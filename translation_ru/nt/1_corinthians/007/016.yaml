base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: ru
  text: Ведь откуда тебе знать[a], жена, спасёшь ли ты своего мужа? Или откуда тебе знать, муж, спасёшь ли ты свою жену?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более развёрнутый перевод: «разве ты можешь знать… спасёшь ли…?» В греческом тексте в косвенном вопросе употреблено будущее время: буквально «спасёшь ли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: Ведь как тебе знать
  rationale: Русское «как тебе знать» естественно передаёт риторический вопрос с τί + οἶδας, а «ведь» сохраняет пояснительно-обосновывающую силу γάρ. Более буквальное «как ты знаешь» в современном русском звучало бы неестественно.
- source_word: γύναι
  choice: жена
  rationale: Хотя γυνή может означать «женщина» или «жена», контекст брака однозначно требует значения «жена»; звательная функция передана обращением.
- source_word: ἄνερ
  choice: муж
  rationale: В брачном контексте звательная форма ἄνερ означает «муж», а не просто «мужчина».
- source_word: σώσεις
  choice: спасёшь
  rationale: Будущее изъявительное наклонение передано будущим временем. В косвенном вопросе с εἰ оно выражает рассматриваемую возможность, а не безусловное предсказание.
- source_word: τὸν ἄνδρα
  choice: своего мужа
  rationale: Определённый артикль указывает на супруга той женщины, к которой обращён вопрос; возвратное притяжательное местоимение естественно выражает это отношение по-русски.
- source_word: τὴν γυναῖκα
  choice: свою жену
  rationale: В параллельной второй части возвратное притяжательное местоимение естественно обозначает жену мужчины, к которому обращён вопрос.
- source_word: ἢ
  choice: Или
  rationale: Простой союз «или» точно связывает два параллельных риторических вопроса.
theological_decisions:
- issue: Значение «спасти» в контексте брака
  choice: Сохранить глагол «спасти», не сужая его смысла.
  alternative: «привести к вере», «сохранить брак» или «оказать спасительное духовное влияние»
  rationale: σῴζω у Павла обычно имеет весомый спасительный смысл, а контекст допускает влияние верующего супруга на неверующего. Прямой перевод сохраняет богословское напряжение и не подменяет текст толкованием.
- issue: Степень уверенности или возможности в вопросе
  choice: Сохранить открытый косвенный вопрос о будущем результате.
  alternative: Передать как уверенное обещание спасения супруга либо как категорическое отрицание такой возможности.
  rationale: εἰ с будущим σώσεις ставит результат под вопрос и не решает заранее, будет ли супруг спасён. Риторическая форма подчёркивает ограниченность знания, не превращая высказывание ни в обещание, ни в отрицание.
translation_notes:
  register: Современный литературный русский язык с симметричным построением двух вопросов. Обращения «жена» и «муж» сохранены, а порядок слов сделан естественным для русского. Формула «как тебе знать» передаёт риторическую неопределённость без архаичного «почему ты знаешь».
