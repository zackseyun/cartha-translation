base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: ru
  text: Ведь раб, призванный в Господе, — вольноотпущенник Господа[a]; так и свободный человек, призванный, — раб Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свободный человек Господа». Вольноотпущенник — человек, освобождённый из рабства.'
    reason: Пояснение социально-правового значения редкого слова «вольноотпущенник» и лексическая альтернатива.
  - marker: b
    text: 'Или: «раб Христа». Греческое слово Христос означает «Помазанник», то есть «Мессия».'
    reason: Традиционная альтернатива передачи титула Χριστός.
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: Передаёт именно несвободное положение, существенное для намеренного парадокса Павла; более мягкое «слуга» ослабило бы противопоставление.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет формулировку и возможный смысл сферы или единения, не сводя её к однозначному «Господом».
- source_word: κληθεὶς
  choice: призванный
  rationale: Передаёт пассивное причастие и характерную для Павла тему Божьего призвания.
- source_word: ἀπελεύθερος
  choice: вольноотпущенник
  rationale: Термин обозначает человека, освобождённого из рабства, и потому сохраняет социально-правовую остроту сопоставления.
- source_word: κυρίου
  choice: Господа
  rationale: Родительный падеж естественно выражает принадлежность Господу, сохраняя связь с образом вольноотпущенника.
- source_word: ὁμοίως
  choice: так же
  rationale: Кратко и естественно сохраняет параллелизм двух частей стиха.
- source_word: ἐλεύθερος
  choice: свободный
  rationale: Обозначает юридически и социально свободного человека и прямо противопоставляется слову «раб».
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт Χριστός как титул Помазанника, сохраняя его смысл, а не только традиционную транслитерацию.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет богословски значимый титул; «господин» чрезмерно сузило бы его до общественного отношения хозяина и раба.
theological_decisions:
- issue: Парадокс общественного и духовного положения
  choice: 'Сохранить резкое сопоставление: раб является вольноотпущенником Господа, а свободный — рабом Мессии.'
  alternative: Смягчить δοῦλος до «слуга» и передать ἀπελεύθερος общим выражением «свободный человек».
  rationale: Именно обращение общественных статусов создаёт смысловую силу высказывания; смягчение терминов скрыло бы напряжение текста.
- issue: Значение Χριστοῦ
  choice: «Мессии»
  alternative: «Христа»
  rationale: Греческое Χριστός исторически является титулом «Помазанник»; вариант «Мессия» делает титульный смысл явным, а сноска сохраняет знакомую традиционную передачу.
translation_notes:
  register: Современный литературный русский с сохранением краткого параллелизма и остроты рабовладельческой метафоры. «Вольноотпущенник» — точный, хотя и исторически окрашенный юридический термин; сноска делает его понятным обычному читателю. Тире естественно оформляют именное сказуемое в русском языке.
