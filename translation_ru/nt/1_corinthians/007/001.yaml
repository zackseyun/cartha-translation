  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: ru
  text: 'Что же касается того, о чём вы писали: хорошо мужчине не прикасаться к женщине.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «не прикасаться к женщине» здесь, вероятно, означает воздерживаться от половых отношений. Возможно, Павел приводит слова из письма коринфян.
    reason: Поясняет идиоматический смысл и сохраняет неопределённость относительно возможной цитаты.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: Что же касается того, о чём вы писали
  rationale: Передаёт переход к вопросам из письма коринфян; частица δέ естественно выражена конструкцией «что же касается», без добавления временного «теперь».
- source_word: καλόν
  choice: хорошо
  rationale: Сохраняет широкую оценочную формулировку греческого текста, не усиливая её до «лучше» или «обязательно».
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: не прикасаться к женщине
  rationale: Сохраняет образность и возможную двусмысленность исходного выражения; его вероятный сексуальный смысл пояснён в сноске.
theological_decisions:
- issue: Являются ли слова «хорошо мужчине…» цитатой из письма коринфян или собственным утверждением Павла
  choice: Не ставить кавычки и сохранить синтаксическую неоднозначность
  alternative: Оформить эти слова как прямую цитату из письма коринфян
  rationale: В греческом тексте нет кавычек, а вопрос о границах возможной цитаты остаётся дискуссионным; перевод не должен решать его за читателя.
- issue: Характер утверждения о неприкосновении к женщине
  choice: «хорошо», без оттенка абсолютного запрета или сравнительной степени
  alternative: «лучше» либо «не следует»
  rationale: Так сохраняется формулировка καλόν и напряжение с последующим обсуждением брака, без внесения аскетического предписания.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и сдержанно-достоинственная. Сохранён буквальный образ «прикасаться», а его идиоматический смысл вынесен в сноску.
