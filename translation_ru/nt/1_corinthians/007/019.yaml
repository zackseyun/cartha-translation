  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: ru
  text: Обрезание ничего не значит[a], и необрезание ничего не значит; важно соблюдать заповеди Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не имеет значения» — в обоих случаях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: обрезание
  rationale: Стандартное русское существительное сохраняет акцент на обрезании как признаке религиозно-заветного статуса, а не только на самом действии.
- source_word: οὐδέν ἐστιν
  choice: ничего не значит
  rationale: Естественно передаёт по-русски резкую оценочную формулу Павла и сохраняет её повтор; более буквальное «есть ничто» звучало бы тяжеловесно.
- source_word: ἀκροβυστία
  choice: необрезание
  rationale: Прямой антоним к «обрезанию» сохраняет риторическую симметрию и обозначение статуса.
- source_word: ἀλλά
  choice: ; важно лишь
  rationale: 'Передаёт сильное противопоставление: внешним признакам противопоставлено то, что действительно имеет значение. Точка с запятой делает русскую фразу ясной.'
- source_word: τήρησις
  choice: соблюдать
  rationale: Глагольная конструкция естественнее в современном русском, чем отвлечённое «соблюдение», при этом сохраняет смысл исполнения и соблюдения.
- source_word: ἐντολῶν θεοῦ
  choice: заповеди Бога
  rationale: Сохраняет конкретное множественное число «заповеди» и родительную связь с Богом без обобщения до «воли Бога».
theological_decisions:
- issue: Оценка Павлом обрезания и необрезания
  choice: Оба признака представлены как не имеющие значения в сопоставлении с соблюдением Божьих заповедей.
  alternative: Павел объявляет обрезание лишённым всякого нравственного значения во всех возможных отношениях.
  rationale: Греческий текст в данном рассуждении одинаково оценивает обрезание и необрезание как «ничто», а затем противопоставляет им соблюдение заповедей Бога. Перевод не распространяет это утверждение за пределы выраженного здесь сопоставления.
translation_notes:
  register: Современный литературный русский язык. Повтор сохранён ради павловской риторической симметрии; эллиптическая греческая конструкция после ἀλλά раскрыта минимально как «важно лишь соблюдать», чтобы фраза звучала естественно и ясно.
