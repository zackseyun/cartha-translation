  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: ru
  text: Но даже если ты женишься, ты не согрешишь; и если девственница выйдет замуж, она не согрешит. Однако таким предстоят тяготы во плоти[a], а я же щажу вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у таких будет скорбь (тягота) во плоти». Вероятно, речь о тяготах земной, телесной жизни, связанных с браком, а не о «греховной природе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я хочу вас уберечь». Павел объясняет пастырскую цель своего предупреждения о таких тяготах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: женишься
  rationale: Аористный конъюнктив с ἐάν выражает реальное условие, ориентированное на будущее. В русском контексте обращение к мужчине естественно передаётся глаголом «женишься».
- source_word: ἥμαρτες / ἥμαρτεν
  choice: не согрешишь / не согрешит
  rationale: 'Хотя в греческом стоит аорист индикатива, в русском условном предложении будущее время естественно передаёт нравственную оценку поступка: вступление в брак не является грехом.'
- source_word: ἡ παρθένος
  choice: девушка
  rationale: παρθένος обозначает девственницу, девушку брачного возраста. В основном тексте «девушка» звучит естественно и достойно; конкретный смысл пояснён с учётом контекста вступления в брак.
- source_word: γήμῃ
  choice: выйдет замуж
  rationale: Для женщины современный русский требует идиоматического «выйдет замуж», сохраняя параллель с «женишься».
- source_word: θλῖψιν
  choice: тяготы
  rationale: θλῖψις здесь означает бедствия, стеснения или трудности, связанные с брачной и телесной жизнью. «Тяготы» сохраняет серьёзность слова без ненужного эсхатологического оттенка «скорби».
- source_word: τῇ σαρκὶ
  choice: в земной жизни
  rationale: Дательный отношения указывает на область, в которой испытываются тяготы. Здесь σάρξ относится к телесному, земному существованию, а не к «греховной природе»; смысловая передача предотвращает ложное богословское прочтение.
- source_word: οἱ τοιοῦτοι
  choice: такие люди
  rationale: Выражение обобщённо указывает на только что упомянутых вступающих в брак, не сужая референцию сильнее греческого текста.
- source_word: φείδομαι
  choice: хочу уберечь
  rationale: Глагол выражает щадящее, оберегающее намерение Павла. «Хочу уберечь» естественно передаёт пастырскую цель, хотя возможна и более буквальная форма «щажу».
theological_decisions:
- issue: Значение σάρξ в τῇ σαρκί
  choice: земная, телесная жизнь
  alternative: плоть как греховная природа
  rationale: Контекст говорит не о нравственной испорченности человека, а о тяготах, которые вступившие в брак испытают в земных обстоятельствах. Перевод сохраняет телесно-земной смысл и не вводит доктрину «греховной природы».
- issue: Сила φείδομαι
  choice: пастырское намерение уберечь адресатов
  alternative: простое утверждение «я щажу вас»
  rationale: Греческое настоящее допускает прямое «щажу», но в ходе наставления Павел объясняет мотив своего совета. Формулировка «хочу уберечь» делает эту прагматику ясной, не представляя желание как гарантированный результат.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Гендерно обусловленные русские глаголы «женишься» и «выйдет замуж» ясно передают параллель греческих форм. Буквально тяжеловесное «скорбь плоти» вынесено в примечание; основной текст передаёт его контекстуальный смысл.
