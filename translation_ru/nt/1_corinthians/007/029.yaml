source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: ru
  text: 'Вот что я говорю, братья[a]: назначенный срок сократился[b], так что отныне и те, у кого есть жёны, должны быть словно у них нет жён,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово «братья» имеет форму мужского рода, но в таком обращении может обозначать всю общину верующих, включая женщин.
    reason: cultural_note
  - marker: b
    text: 'Или: «время стало кратким».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: Я говорю вот что
  rationale: Естественная русская формула, вводящая пояснение Павла и сохраняющая значение греческого оборота без излишнего перефразирования.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет форму мужского рода греческого множественного числа; примечание поясняет, что в данном обращении могли подразумеваться все верующие общины.
- source_word: ὁ καιρός
  choice: назначенный срок
  rationale: Передаёт не просто течение времени, а особый, определённый период; слово «срок» естественно сочетается с глаголом «сократился».
- source_word: συνεσταλμένος ἐστίν
  choice: сократился
  rationale: Передаёт наличное состояние, возникшее в результате сокращения, выраженное греческой перфектной перифразой.
- source_word: τὸ λοιπὸν
  choice: отныне
  rationale: Кратко и естественно выражает временную направленность наставления на оставшийся период.
- source_word: ἵνα
  choice: так что
  rationale: Сохраняет связь между сокращённым сроком и последующим образом жизни, не устраняя возможный оттенок цели или следствия.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: имеющие жён
  rationale: Следует конкретной формулировке оригинала, где γυναῖκας в контексте означает жён, а не женщин вообще.
- source_word: ὡς μὴ ἔχοντες
  choice: как не имеющие
  rationale: Сохраняет резкость и сравнительную форму греческого выражения; подразумеваемое дополнение «жён» ясно из предыдущей части.
theological_decisions:
- issue: Смысл наставления Павла состоящим в браке
  choice: Сохранить прямое и напряжённое выражение «пусть будут как не имеющие», не смягчая его толкованием.
  alternative: Передать как «пусть не привязываются к семейной жизни» или пояснить, что супружеские обязанности сохраняются.
  rationale: Греческий текст резко переоценивает обычные жизненные обстоятельства ввиду сокращённого срока. Перевод должен сохранить это богословское напряжение, а не разрешать его посредством парафраза.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксис остаётся близким к оригиналу, а финальная запятая показывает, что мысль продолжается в следующем стихе.
