  naturalness: «Я говорю вот что» и «назначенный срок сократился» понятны и литературны. «Вот что я говорю» несколько естественнее как вводная формула, а «словно у них нет жён» звучит по-современному яснее, чем эллиптическое «как не имеющие».
  terminology: «Братья» сохраняет форму обращения ἀδελφοί; поясняющее примечание уместно. «Назначенный срок» допустимо передаёт качественный, определённый характер καιρός, не навязывая конкретного богословского истолкования. «Жёны» в данном контексте корректно передаёт γυναῖκας.
