  text: Вы куплены ценой; не становитесь рабами людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: за цену
  rationale: Родительный цены при ἀγοράζω указывает на цену покупки. Русское «куплены за цену» естественно сохраняет образ покупки и не уточняет, какова эта цена.
- source_word: ἠγοράσθητε
  choice: вы куплены
  rationale: Аорист пассивного залога, второе лицо множественного числа. Краткое «вы куплены» сохраняет торгово-искупительный образ и завершённость совершённого действия.
- source_word: μὴ γίνεσθε
  choice: не становитесь
  rationale: γίνομαι означает «становиться», а не просто «быть»; форма с μή передаёт запрет входить в такое состояние или продолжать двигаться к нему.
- source_word: δοῦλοι
  choice: рабами
  rationale: В контексте покупки и принадлежности слово обозначает несвободный статус и подчинение хозяину; «рабами» точнее, чем более мягкое «слугами».
- source_word: ἀνθρώπων
  choice: людей
  rationale: Родительный падеж зависит от δοῦλοι. Современное русское «людей» точно передаёт ἀνθρώπων как общее обозначение человеческих существ и сохраняет противопоставление человеческой власти Господу.
theological_decisions:
- issue: Передача δοῦλοι ἀνθρώπων в контексте покупки и принадлежности
  choice: рабами людей
  alternative: слугами людей
  rationale: 'Мысль стиха опирается на образ принадлежности: купленные не должны отдавать себя под окончательную власть людей. «Рабами» сохраняет эту напряжённость, не превращая запрет в отрицание всякого человеческого служения или законного подчинения.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и афористичная, с сохранением параллелизма двух частей и коммерческо-правового образа оригинала.
