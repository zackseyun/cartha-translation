reference: 1 Corinthians 7:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: ru
  text: Ведь неверующий муж освящён через жену, и неверующая жена освящена через брата[a]. Иначе ваши дети нечисты, а теперь они святы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть через верующего мужа. Буквально: «через брата»; Павел обычно называет «братом» единоверца.'
    reason: lexical_alternative
  - marker: b
    text: «Освящён» здесь указывает на особый, отделённый для Бога статус в связи с верующим супругом и семьёй; это не обязательно означает личное спасение неверующего супруга.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: освящён / освящена
  rationale: Перфект пассивного залога обозначает совершившееся действие с сохраняющимся результатом. «Освящён» сохраняет связь с ἅγιά («святы») и не устраняет смыслового напряжения текста.
- source_word: ἄπιστος
  choice: неверующий / неверующая
  rationale: В контексте брака слово обозначает супруга, который не верит, а не человека, неверного или ненадёжного.
- source_word: ἐν
  choice: через
  rationale: 'Передаёт вероятный инструментально-реляционный смысл: статус неверующего супруга связан с его брачным единством с верующим; буквальное «в» по-русски здесь неестественно и неясно.'
- source_word: ἀνήρ / γυνή
  choice: муж / жена
  rationale: Брачный контекст требует значений «муж» и «жена», а не общих «мужчина» и «женщина».
- source_word: ἀδελφῷ
  choice: через брата
  rationale: Сохраняется необычное слово исходного текста, которым Павел обычно называет единоверца; вероятный смысл пояснён в сноске.
- source_word: ἐπεὶ ἄρα
  choice: иначе
  rationale: Кратко и естественно вводит следствие, которое вытекало бы при отрицании предыдущего утверждения.
- source_word: ἀκάθαρτα
  choice: нечисты
  rationale: Сохраняет культово-религиозный оттенок и прямой контраст со словом «святы».
- source_word: νῦν δὲ
  choice: а теперь
  rationale: Формально передаёт νῦν и противопоставляет действительное положение предполагаемому; не подменяет временное наречие более толковательным оборотом.
- source_word: ἅγια
  choice: святы
  rationale: Сохраняет богословский регистр и лексическую связь с глаголом «освящён».
theological_decisions:
- issue: Смысл освящения неверующего супруга
  choice: Сохранить формулировку «освящён», а ограничивающее пояснение дать в сноске.
  alternative: Истолковать в основном тексте как автоматическое спасение либо лишь как законность брачного союза.
  rationale: Стих связывает освящение супруга со статусом детей, но сам по себе не утверждает ни личного спасения без веры, ни исключительно половой или юридической законности брака. Перевод сохраняет богословское напряжение.
- issue: Значение ἀδελφῷ
  choice: Оставить «через брата» в основном тексте и пояснить вероятный референт в сноске.
  alternative: Сразу перевести «через верующего мужа» ради симметрии.
  rationale: В греческом стоит именно «брат», а не повтор слова «муж». Сохранение этого различия обеспечивает прозрачность по отношению к источнику.
- issue: Наклонение в τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν
  choice: 'Передать настоящим временем: «ваши дети нечисты».'
  alternative: Сгладить условное рассуждение формой «были бы нечисты».
  rationale: Греческий текст использует настоящее изъявительное ἐστιν. Оборот «иначе» уже обозначает гипотетическую логику, поэтому глагольную форму можно сохранить без добавленного сослагательного наклонения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис остаётся ясным для обычного читателя; термины «освящён», «нечисты» и «святы» сохранены ради лексической и богословской связности. Все маркеры сносок присутствуют в основном тексте.
