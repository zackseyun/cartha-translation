  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: ru
  text: Но тот, кто твёрд в своём сердце, не испытывает необходимости[a], сам властен над своей волей и решил в своём сердце сохранить свою деву[b], поступит хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не испытывает принуждения».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «свою деву» может относиться либо к его дочери-девственнице, либо к его невесте, с которой он обручён; смысл греческого выражения остаётся спорным.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: твёрд
  rationale: Сочетание перфекта ἵστημι с ἑδραῖος выражает устойчивую, уже сложившуюся решимость. «Твёрд» естественно передаёт это состояние по-русски.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ / ἐν τῇ ἰδίᾳ καρδίᾳ
  choice: в своём сердце
  rationale: καρδία обозначает внутреннего человека как средоточие решения; сохранён библейский образ и намеренный повтор Павла.
- source_word: μὴ ἔχων ἀνάγκην
  choice: не связан необходимостью
  rationale: ἀνάγκη может означать необходимость, вынужденность или принуждение. Основной вариант сохраняет широту значения, а более конкретное понимание вынесено в сноску.
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: сам властен над своей волей
  rationale: ἐξουσία выражает власть или право распоряжаться, а θέλημα — волю, желание или намерение. Формулировка передаёт самостоятельность решения без добавления отсутствующих в тексте мотивов.
- source_word: κέκρικεν
  choice: решил
  rationale: Перфект указывает на принятое и сохраняющее силу решение; «решил» ясно и естественно передаёт это значение.
- source_word: τηρεῖν
  choice: сохранить
  rationale: τηρέω означает хранить, сохранять или удерживать в данном состоянии. Выбран близкий к источнику глагол без поясняющего добавления «незамужней».
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: свою деву
  rationale: 'Буквальная формулировка удерживает спорную референцию παρθένος: речь может идти либо о дочери-девственнице, либо о невесте. Слово «дева» здесь литературно и позволяет не разрешать эту неоднозначность в основном тексте.'
- source_word: καλῶς ποιήσει
  choice: поступит хорошо
  rationale: Греческое идиоматическое выражение означает поступить хорошо или достойно; русский вариант ясен и сохраняет оценочный характер фразы.
theological_decisions:
- issue: Кого обозначает τὴν ἑαυτοῦ παρθένον («свою деву»)
  choice: В основном тексте сохранено буквальное и неоднозначное «свою деву».
  alternative: «свою дочь-девственницу» или «свою невесту-девственницу»
  rationale: Сам греческий текст не позволяет бесспорно установить, говорит ли Павел об отце или опекуне и его дочери либо о мужчине и его обручённой. Перевод не должен без необходимости разрешать эту давнюю интерпретационную проблему.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повтор «в своём сердце» сохранён как особенность исходного текста. Несколько необычное выражение «свою деву» выбрано сознательно ради сохранения подлинной неоднозначности греческого текста и разъяснено в сноске.
