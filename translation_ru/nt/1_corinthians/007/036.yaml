source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: ru
  text: 'Но если кто считает, что поступает неподобающим образом по отношению к своей деве[a], если её юность уже миновала и так тому надлежит быть, пусть поступает, как хочет: он не грешит. Пусть они вступят в брак.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к своей обручённой девственнице»; традиционно это выражение понимали также как «к своей девственной дочери». Греческий текст допускает разные понимания.'
    reason: Альтернативные прочтения неоднозначного греческого выражения παρθένον αὐτοῦ.
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: поступает неподобающим образом
  rationale: Передаёт неблаговидное или неуместное поведение, не усиливая значение до бесчестия или непристойности сексуального характера.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: по отношению к своей деве
  rationale: «Дева» передаёт παρθένος и позволяет не определять в основном тексте, идёт ли речь о невесте или о дочери, находящейся под попечением мужчины.
- source_word: ὑπέρακμος
  choice: её юность уже миновала
  rationale: Естественно передаёт возрастной смысл — нахождение за пределами расцвета юности, — не вводя точного современного понятия брачного возраста.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: и так тому надлежит быть
  rationale: Сохраняет общее значение необходимости или должного развития обстоятельств, не уточняя не названную в греческом тексте причину.
- source_word: ὃ θέλει ποιείτω
  choice: пусть поступает, как хочет
  rationale: Передаёт разрешительный императив прямо и естественно.
- source_word: οὐχ ἁμαρτάνει
  choice: он не грешит
  rationale: Сохраняет прямое утверждение нравственной допустимости действия.
- source_word: γαμείτωσαν
  choice: Пусть они вступят в брак
  rationale: Передаёт повелительное наклонение во множественном числе и ясно указывает на брак двух лиц.
theological_decisions:
- issue: Кого обозначает выражение παρθένον αὐτοῦ («своя дева»)
  choice: В основном тексте сохранено неоднозначное «своей деве».
  alternative: «своей невесте/обручённой» или «своей незамужней дочери»
  rationale: Греческое выражение допускает оба основных традиционных понимания; контекст не позволяет бесспорно выбрать одно из них, поэтому перевод не устраняет подлинную интерпретационную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слово «дева» выбрано как краткое и достаточно широкое соответствие παρθένος; его смысл пояснён в сноске. Синтаксис сохраняет последовательность условий и заключительных разрешительных форм исходного текста.
