  text: ἕκαστος ἐν τῇ κλήσει ᾗ ἐκλήθη ἐν ταύτῃ μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: ru
  text: Каждый пусть остаётся в том призвании, в котором был призван[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в том положении», «состоянии» или «в тех жизненных обстоятельствах». В греческом тексте буквально: «в призвании»; это перекликается со словами «был призван» в том же стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Форма мужского рода единственного числа («был призван») употреблена обобщённо: наставление относится к каждому верующему.'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: Каждый
  rationale: Сохраняет распределительное значение формы единственного числа и естественно звучит по-русски.
- source_word: κλήσει
  choice: призвании
  rationale: Буквально передаёт κλῆσις и сохраняет словесную связь с ἐκλήθη («был призван»), не сводя смысл только к общественному положению или жизненным обстоятельствам.
- source_word: ᾗ ἐκλήθη
  choice: в котором был призван
  rationale: Отражает относительную конструкцию и повтор предлога ἐν; страдательная форма сохраняет подразумеваемого деятеля, не называя его прямо.
- source_word: ἐν ταύτῃ
  choice: в том призвании
  rationale: Русское указательное местоимение естественно отсылает к уже названному призванию и передаёт смысл ἐν ταύτῃ.
- source_word: μενέτω
  choice: пусть остаётся
  rationale: Передаёт силу повелительного наклонения настоящего времени как указание продолжать оставаться в данном положении.
theological_decisions:
- issue: Значение κλῆσις в контексте
  choice: Сохранить в основном тексте слово «призвание».
  alternative: «положение», «состояние» или «жизненные обстоятельства»
  rationale: Контекст касается обрезания, рабства и других обстоятельств жизни, однако греческий текст намеренно сближает κλήσει и ἐκλήθη. Перевод «призвание» сохраняет как игру слов, так и напряжение между Божьим призывом и положением человека во время этого призыва.
- issue: Родовое значение формы ἐκλήθη
  choice: Употребить форму «был призван» при подлежащем «каждый».
  alternative: Перестроить фразу в явно гендерно-нейтральной форме.
  rationale: Мужской род единственного числа соответствует греческой грамматической форме и в данном наставлении имеет обобщающее, представительное значение.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и естественной синтаксической формой. Лексический повтор «призвании — призван» сохранён намеренно как значимая особенность греческого текста.
