  terminology: «Житейские дела» удачно передаёт нейтральный, не обязательно нравственно отрицательный смысл τὰ τοῦ κόσμου в данном контексте. Слово «жена» корректно для γυνή в брачном контексте. Сноска привязана к соответствующему выражению и даёт допустимые лексические альтернативы, не навязывая отрицательной оценки.
