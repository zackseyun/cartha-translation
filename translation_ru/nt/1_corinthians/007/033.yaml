id: 1CO.7.33
reference: 1 Corinthians 7:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῇ γυναικί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/033.yaml
  text: But the married man is concerned with the things of the world[a], how he may please his wife,
translation:
  language: ru
  text: А женатый заботится о житейских делах[a] — о том, как угодить жене,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о мирских делах»; «о делах этого мира».'
    reason: Лексические варианты для τὰ τοῦ κόσμου сохраняют буквальный образ «того, что относится к миру» и возможные оттенки выражения.
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: А женатый
  rationale: Субстантивированное причастие мужского рода обозначает женатого мужчину и противопоставляет его неженатому в ближайшем контексте. «Женатый» естественно и кратко передаёт эту форму.
- source_word: μεριμνᾷ
  choice: заботится
  rationale: Глагол может означать беспокойство, заботу или озабоченность. Здесь речь идёт об обязанностях и интересах семейной жизни, поэтому «заботится» не приписывает непременно греховной тревоги.
- source_word: τὰ τοῦ κόσμου
  choice: о житейских делах
  rationale: Выражение обозначает дела обычной земной жизни. «Житейские дела» звучит естественно по-русски и не наделяет κόσμος автоматически нравственно отрицательным смыслом.
- source_word: πῶς ἀρέσῃ
  choice: о том, как угодить
  rationale: Конструкция с πῶς и сослагательным наклонением раскрывает содержание заботы. Русская конструкция «о том, как угодить» ясно передаёт направленность этой заботы.
- source_word: τῇ γυναικί
  choice: жене
  rationale: В брачном контексте γυνή означает «жена». Принадлежность очевидна из слова «женатый», поэтому отдельное притяжательное местоимение по-русски не требуется.
theological_decisions:
- issue: Следует ли придавать κόσμος здесь нравственно отрицательный смысл
  choice: Нейтральное «житейские дела»
  alternative: «мирское» или «мирские дела» с возможным неодобрительным оттенком
  rationale: В контексте Павел говорит о практических заботах брачной жизни в отличие от неразделённой заботы о Господнем, а не осуждает брак или обычные семейные обязанности. Нейтральная формулировка сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык; достоинство и лаконичность апостольского рассуждения сохранены. Союз «а» передаёт контраст δέ с предыдущим стихом. Тире естественно вводит пояснение содержания заботы.
