base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: ru
  text: И если у женщины неверующий муж и он согласен жить с ней, пусть она не оставляет своего мужа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть она не разводится со своим мужем». Греческий глагол может означать «оставлять» или «отпускать»; здесь речь идёт о прекращении супружеских отношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις
  choice: если у женщины
  rationale: Оборот вводит общий случай. В современном русском «если у женщины» естественно передаёт неопределённость и подготавливает сочетание «муж неверующий».
- source_word: ἔχει ἄνδρα
  choice: муж
  rationale: В брачном контексте ἀνήρ означает «муж», а русская конструкция принадлежности «у женщины муж» звучит естественнее буквального «женщина имеет мужа».
- source_word: ἄπιστον
  choice: неверующий
  rationale: Здесь речь о муже, не разделяющем христианскую веру; «неверный» могло бы ошибочно означать супружескую неверность.
- source_word: οὗτος
  choice: он
  rationale: Указательное местоимение относится к уже названному мужу; нейтральное русское «он» не вносит лишнего акцента.
- source_word: συνευδοκεῖ
  choice: согласен
  rationale: Передаёт добровольное согласие продолжать совместную жизнь и звучит естественно в данном условном предложении.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: жить с ней
  rationale: Ясно и естественно обозначает совместную семейную жизнь.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: пусть она не оставляет мужа
  rationale: «Пусть не оставляет» сохраняет форму запрета и широкое значение ἀφίημι, не сводя его безоговорочно к юридически оформленному разводу.
theological_decisions:
- issue: Смысл ἀφιέτω в наставлении о браке с неверующим супругом
  choice: пусть она не оставляет мужа
  alternative: пусть она не разводится с мужем
  rationale: В брачном контексте глагол подразумевает прекращение супружеских отношений, однако его форма допускает более буквальное «оставлять/отпускать». Основной текст сохраняет эту широту, а примечание поясняет брачный смысл без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаичного «да не оставляет». Инверсия «муж неверующий» сохраняет смысловую связь определения с мужем и естественна в библейском повествовательном регистре.
