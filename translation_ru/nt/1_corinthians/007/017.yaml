  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: ru
  text: Только[a] пусть каждый поступает[b] так, как определил ему Господь[c] и как призвал его Бог. Так я предписываю во всех церквах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «впрочем», «но только». Здесь выражение вводит общий ограничивающий принцип.'
    reason: discourse_alternative
  - marker: b
    text: 'Буквально: «ходит». В Библии «ходить» часто означает жить и вести себя определённым образом.'
    reason: metaphor_explanation
  - marker: c
    text: 'Или: «уделил», «назначил». Греческий глагол обозначает то, что Господь распределил или определил каждому.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: Только
  rationale: Здесь сочетание вводит ограничивающий общий принцип после разбора частного случая, а не выражает буквальное условие «если не».
- source_word: ἑκάστῳ / ἕκαστον
  choice: каждый / ему
  rationale: Передаёт распределительное значение и индивидуальное применение наставления; русская синтаксическая норма позволяет избежать тяжеловесного буквального повтора слова «каждый».
- source_word: ἐμέρισεν
  choice: определил
  rationale: Глагол обозначает то, что Господь уделил или назначил человеку. «Определил» естественно звучит по-русски и не уточняет без достаточных оснований, идёт ли речь о положении, обстоятельствах или иной данной человеку доле.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Стандартная передача κύριος как божественного наименования.
- source_word: κέκληκεν
  choice: призвал
  rationale: Передаёт божественный призыв; русская форма прошедшего времени естественно выражает совершившееся действие, результат которого сохраняется.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная передача θεός; сохранено отличие от наименования «Господь» в параллельной части фразы.
- source_word: οὕτως περιπατείτω
  choice: пусть каждый поступает так
  rationale: «Поступает» естественно передаёт распространённую библейскую метафору хождения как образа жизни и поведения, не создавая в современном русском ложного впечатления о буквальном перемещении.
- source_word: καὶ οὕτως
  choice: Так
  rationale: Сохраняет повтор οὕτως и связь апостольского распоряжения с изложенным принципом.
- source_word: διατάσσομαι
  choice: я предписываю
  rationale: Передаёт авторитетное установление порядка, не усиливая его до резкого «приказываю».
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: во всех церквах
  rationale: В контексте Павла речь идёт о местных христианских общинах; «церквах» — ясная и устоявшаяся передача.
theological_decisions:
- issue: Различие между «Господом» и «Богом»
  choice: 'Сохранены оба наименования в исходной последовательности: Господь определил, Бог призвал.'
  alternative: Свести оба параллельных обозначения к одному наименованию Бога или поменять их местами по более привычной формуле.
  rationale: Греческий текст намеренно употребляет два разных обозначения; перевод не должен устранять возможное богословское различие или гармонизировать параллели.
- issue: Содержание того, что Господь «определил» каждому
  choice: Не добавлять существительные «положение», «состояние» или «доля» в основной текст.
  alternative: 'Перевести: «в том положении, которое назначил ему Господь».'
  rationale: Контекст указывает на жизненные обстоятельства, однако прямое дополнение в греческом не названо. Сдержанная формулировка сохраняет широту и напряжение исходного выражения.
- issue: Метафора περιπατέω
  choice: Передать функциональным русским библейским соответствием «поступает».
  alternative: Буквальное «ходит» или более динамичное «живёт».
  rationale: «Поступает» сохраняет значение образа жизни и нравственного поведения, оставаясь понятным современному читателю; буквальное «ходит» здесь способно ввести в заблуждение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Порядок титулов «Господь» и «Бог» следует SBLGNT. Формула «пусть каждый поступает» понятна широкой аудитории и передаёт повелительное значение без архаической конструкции.
