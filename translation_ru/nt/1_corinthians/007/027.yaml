  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: ru
  text: Ты связан с женой? Не ищи освобождения[a]. Ты освобождён от жены? Не ищи жены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «Ты женат? Не ищи развода. Ты разведён? Не ищи жены». В греческом тексте буквальнее говорится о том, чтобы быть «связанным» и «освобождённым».'
    reason: Альтернативный, более истолковательный перевод брачной метафоры.
lexical_decisions:
- source_word: δέδεσαι
  choice: ты связан
  rationale: Перфект δέω передаёт сохраняющееся состояние связанности. Такой перевод удерживает образ Павла и его противопоставление λύσιν/λέλυσαι, не заменяя его более узким толкованием «женат».
- source_word: γυναικί
  choice: с женой
  rationale: В брачном контексте γυνή означает «жена»; русский глагол «связан» естественно управляет творительным падежом с предлогом «с».
- source_word: μὴ ζήτει
  choice: не ищи
  rationale: Сохраняет прямую запретительную форму и значение ζητέω без избыточного перефразирования.
- source_word: λύσιν
  choice: освобождения
  rationale: Передаёт значение развязывания или освобождения и сохраняет словесную связь с λέλυσαι. Слово «развод» было бы более узким и явным, чем греческий текст.
- source_word: λέλυσαι
  choice: ты освобождён
  rationale: Перфект λύω обозначает состояние освобождённости и образно соответствует δέδεσαι. Формулировка не решает без достаточных оснований, имеется ли в виду именно развод, вдовство или иное отсутствие брачной связанности.
- source_word: ἀπὸ γυναικός
  choice: от жены
  rationale: В данном брачном контексте γυνή значит «жена», а ἀπό естественно передаётся предлогом «от».
- source_word: γυναῖκα
  choice: жены
  rationale: Контекст указывает на поиск жены, то есть вступление в брак; родительный падеж обусловлен русским управлением после отрицания «не ищи».
theological_decisions:
- issue: Передавать ли стих явными брачно-правовыми словами «женат/разведён» или сохранить образы связанности и освобождения.
  choice: 'В основном тексте сохранены образы: «связан с женой» и «освобождён от жены».'
  alternative: «Ты женат? Не ищи развода. Ты разведён? Не ищи жены».
  rationale: Греческий текст использует δέω/λύω, а не однозначную лексику брака и развода. Сохранение образа точнее отражает источник и не сужает возможный смысл до одной юридической ситуации.
translation_notes:
  register: Современный литературный русский язык; краткий, прямой и достойный стиль. Сохранена параллельная структура вопросов и запретов, а также метафорическое противопоставление связанности и освобождения.
