  naturalness: Формулировки кратки, понятны и соответствуют современному литературному русскому. «Связан с женой» и «освобождён от жены» несколько образны, но именно эта образность принадлежит оригиналу и в данном контексте ясна. Повтор «жены» в конце необходим для сохранения греческой конструкции и смысловой симметрии.
  terminology: Термины «связан», «освобождение» и «освобождён» последовательно передают словесную связь δέδεσαι—λύσιν—λέλυσαι. Сноска корректно отделяет более истолковательный вариант «женат/разведён» от основного, менее узкого перевода; она не навязывает этот вариант как единственно возможный.
