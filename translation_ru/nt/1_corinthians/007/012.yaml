base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: ru
  text: 'Остальным же говорю я, не Господь: если у какого-либо брата неверующая жена и она согласна жить с ним, пусть он не разводится с ней.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть он не оставляет её» или «пусть он не отпускает её». Греческий глагол буквально может означать «оставлять» или «отпускать», но здесь речь идёт о прекращении брака.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: А остальным
  rationale: Оборот обозначает тех, чья ситуация ещё не была рассмотрена; δέ передано как мягкий переход «а».
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: говорю я, не Господь
  rationale: Порядок слов сохраняет смысловое ударение на ἐγώ и различие между наставлением Павла и непосредственно известным изречением Господа, не добавляя оценки авторитетности.
- source_word: ἀδελφὸς
  choice: брат
  rationale: 'Мужской род здесь конкретен: речь идёт о верующем мужчине, имеющем жену.'
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: у какого брата жена неверующая
  rationale: Естественная русская конструкция передаёт брачные отношения; «неверующая» означает не разделяющую христианскую веру, а не неверную супругу.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: и она согласна
  rationale: Передаёт добровольное согласие жены на совместную жизнь.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: жить с ним
  rationale: Естественно обозначает совместную семейную и домашнюю жизнь.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: пусть он не разводится с ней
  rationale: В брачном контексте ἀφίημι означает оставить или отпустить супругу, то есть расторгнуть брак; возвратная русская форма естественно выражает это действие.
theological_decisions:
- issue: Слова Павла «я, не Господь»
  choice: 'Сохранено прямое различие: «говорю я, не Господь».'
  alternative: Передать как личное мнение Павла, лишённое авторитета.
  rationale: Текст различает наставление Павла и непосредственно переданное изречение Иисуса по данному вопросу, но сам по себе не утверждает, что наставление Павла необязательно или неавторитетно.
translation_notes:
  register: Современный литературный русский язык; синтаксис сдержанный и достоинственный. Формулировка сохраняет эмфатическое «я» и не сглаживает богословское напряжение фразы «не Господь».
