base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: ru
  text: 'Неженатым же и вдовам я говорю: хорошо им, если они останутся такими, как и я[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не состоящим в браке». Греческая форма имеет мужской род множественного числа, но может употребляться и обобщённо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как и я». Здесь не уточняется, каким образом Павел оказался без супруги.'
    reason: ambiguity
lexical_decisions:
- source_word: Λέγω δὲ
  choice: же… говорю
  rationale: Частица δέ обозначает мягкий переход к следующей группе наставлений; русское «же» передаёт связность без усиленного противопоставления.
- source_word: τοῖς ἀγάμοις
  choice: неженатым
  rationale: Субстантивированное прилагательное стоит в мужском роде множественного числа и буквально обозначает не состоящих в браке мужчин. Этот перевод сохраняет грамматическую форму; возможность более общего употребления отмечена в сноске.
- source_word: ταῖς χήραις
  choice: вдовам
  rationale: χήρα конкретно означает женщину, муж которой умер; дательный падеж передан естественной русской формой «вдовам».
- source_word: καλὸν αὐτοῖς
  choice: хорошо им
  rationale: καλόν выражает положительную оценку — «хорошо», но само по себе не означает сравнительного «лучше»; дательное αὐτοῖς естественно передан местоимением «им».
- source_word: ἐὰν μείνωσιν
  choice: оставаться
  rationale: В данном контексте μένω означает продолжать пребывать в нынешнем, не связанном браком состоянии. Русский инфинитив после «хорошо им» естественно передаёт условную конструкцию без изменения смысла.
- source_word: ὡς κἀγώ
  choice: как и я
  rationale: κἀγώ представляет собой сочетание καὶ ἐγώ — «и я». Формулировка «как и я» сохраняет добавочное значение καί и намеренную краткость исходного текста.
theological_decisions:
- issue: Круг лиц, обозначенных τοῖς ἀγάμοις
  choice: Передать как «неженатым», следуя мужскому роду греческой формы.
  alternative: «не состоящим в браке» — если мужское множественное число употреблено обобщённо.
  rationale: Отдельное упоминание вдов допускает понимание ἀγάμοις как обозначения неженатых мужчин, однако грамматически возможно и представительное мужское множественное число. Основной текст следует форме оригинала, а реальная неоднозначность сохранена в сноске.
- issue: Смысл καλὸν в совете Павла
  choice: «хорошо»
  alternative: «лучше» или «правильно»
  rationale: В греческом тексте нет сравнительной степени. «Хорошо» сохраняет положительную оценку, не превращая совет в утверждение о безусловном превосходстве или обязательной норме.
- issue: Состояние Павла в выражении ὡς κἀγώ
  choice: Не уточнять причину или разновидность его безбрачного состояния.
  alternative: Раскрыть как «оставаться неженатыми/без брака, как я».
  rationale: Исходный текст лишь сопоставляет положение адресатов с положением Павла и не сообщает здесь, был ли он никогда не женат, овдовел или оказался без супруги по иной причине.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным звучанием. Порядок «Неженатым же и вдовам говорю» сохраняет переходную функцию δέ и риторический акцент на названных группах. Краткость финала намеренно сохранена; конфессиональные предположения о семейной истории Павла не внесены.
