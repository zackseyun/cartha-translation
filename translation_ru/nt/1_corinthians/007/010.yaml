  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: ru
  text: 'Тем, кто состоит в браке, повелеваю не я, а Господь: жене не расходиться[a] с мужем—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не разводиться с мужем». Греческий глагол может означать прекращение совместной брачной жизни, которое в данном контексте может включать развод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: Тем же, кто состоит в браке
  rationale: Перфектное причастие обозначает людей, пребывающих в браке; оборот естественен для современного русского языка. Частица «же» передаёт переходную функцию δέ без чрезмерно сильного противопоставления.
- source_word: παραγγέλλω
  choice: повелеваю
  rationale: Глагол выражает авторитетное предписание; «повелеваю» сохраняет его силу и уместен в dignified современном библейском регистре.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: не я, а Господь
  rationale: Дословно сохраняет подчёркнутое противопоставление, не добавляя толкования о характере авторитета Павла.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: жене … с мужем
  rationale: В брачном контексте γυνή и ἀνήρ означают соответственно жену и мужа. Русское управление с глаголом «расходиться» требует предлога «с».
- source_word: μὴ χωρισθῆναι
  choice: не расходиться
  rationale: В данном контексте χωρίζω обозначает прекращение совместной брачной жизни. «Не расходиться» сохраняет как смысл раздельного проживания, так и возможный оттенок развода, не сводя выражение исключительно к современной юридической процедуре.
theological_decisions:
- issue: Смысл слов «не я, а Господь»
  choice: Сохранено буквальное противопоставление без пояснения в основном тексте.
  alternative: Раскрыть фразу как указание на ранее данное учение Господа Иисуса.
  rationale: Текст различает повеление Господа и последующее апостольское суждение Павла, но перевод не должен ни отрицать авторитет слов Павла, ни вносить это толкование непосредственно в стих.
- issue: Объём значения χωρισθῆναι
  choice: не расходиться
  alternative: не разводиться
  rationale: Выбранный вариант оставляет открытым вопрос, означает ли здесь глагол раздельное проживание, развод или оба явления, сохраняя смысловое напряжение ближайшего контекста.
translation_notes:
