  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: ru
  text: и те, кто плачет, — словно не плачут[a], и те, кто радуется, — словно не радуются, и те, кто покупает, — словно не владеют,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как не плачущие… как не радующиеся… как не владеющие». В греческом тексте повторяется оборот, обозначающий образ отношения к этим переживаниям и действиям, а не отрицающий, что люди действительно плачут, радуются и покупают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: плачущие
  rationale: Субстантивированное причастие настоящего времени прямо обозначает тех, кто плачет; этот вариант сохраняет конкретность действия и не сужает смысл до скорби по определённой причине.
- source_word: ὡς μὴ κλαίοντες
  choice: как не плачущие
  rationale: Сжатая конструкция сохраняет повторяющуюся греческую формулу ὡς μή и выражает образ жизни или отношение, не отрицая самого плача.
- source_word: χαίροντες
  choice: радующиеся
  rationale: Передаёт обычное значение χαίρω и сохраняет параллелизм с «плачущие».
- source_word: ὡς μὴ χαίροντες
  choice: как не радующиеся
  rationale: Повтор той же конструкции сохраняет ритм и риторическую симметрию исходного текста.
- source_word: ἀγοράζοντες
  choice: покупающие
  rationale: Естественный современный эквивалент для участия в обычном приобретении товаров или имущества.
- source_word: κατέχοντες
  choice: владеющие
  rationale: В противопоставлении покупке глагол означает обладание приобретённым; «владеющие» естественнее здесь, чем буквальное «держащие», и не добавляет идеи отказа от собственности.
- source_word: καὶ
  choice: и
  rationale: Повтор союза в каждой части сохраняет накопительный ритм Павловой речи.
theological_decisions:
- issue: Смысл повторяющейся конструкции ὡς μή с причастием
  choice: Призыв относиться к плачу, радости и приобретениям так, чтобы они не становились определяющей реальностью жизни; сами действия и переживания не отрицаются.
  alternative: Понимать слова как аскетический запрет плакать, радоваться или приобретать либо только как психологическую установку вне эсхатологического контекста.
  rationale: В ближайшем контексте говорится о нынешней нужде и о преходящем образе этого мира (1 Кор 7:26, 31). Конструкция ὡς μή указывает на образ действия или жизненную позицию, сохраняя напряжение между реальностью опыта и непривязанностью к нему.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого параллелизма и повторов оригинала. Тире помогают естественно прочитать эллиптические обороты. Конечная запятая сохранена, поскольку стих представляет собой часть продолжающегося предложения.
