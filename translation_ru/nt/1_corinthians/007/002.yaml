    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: Но из-за
  rationale: διά с винительным выражает причину, а δέ обозначает мягкое противопоставление или переход от предыдущей мысли. «Но из-за» сохраняет обе функции и естественно звучит по-русски.
- source_word: τὰς πορνείας
  choice: проявлений сексуальной безнравственности
  rationale: πορνεία обозначает сексуально безнравственное поведение; греческое множественное число передано словом «проявлений». Это современнее и шире, чем «блуд», которое может восприниматься как архаичное или более узкое.
- source_word: ἕκαστος
  choice: у каждого мужчины
  rationale: Мужской род в параллели с ἑκάστη и существительными γυναῖκα/ἄνδρα указывает здесь на мужчину. Русская конструкция «у каждого мужчины» естественно вводит последующее «своя жена».
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: своя жена
  rationale: В брачном контексте γυνή означает «жена», а возвратное ἑαυτοῦ подчёркивает принадлежность, естественно переданную местоимением «своя».
- source_word: ἐχέτω
  choice: пусть ... будет
  rationale: Настоящее повелительное наклонение третьего лица передано конструкцией «пусть». Буквальное «пусть имеет» в современном русском звучит тяжеловесно; «пусть у ... будет» сохраняет повелительный смысл, не заменяя глагол истолковывающим «пусть вступит в брак».
- source_word: καὶ ἑκάστη
  choice: и у каждой женщины
  rationale: Сохранены соединительный союз и распределительная параллель первой половине стиха. «Женщины» отражает форму ἑκάστη, тогда как брачный статус уточняется словом «муж».
- source_word: τὸν ἴδιον ἄνδρα
  choice: свой муж
  rationale: В данном брачном параллелизме ἀνήρ означает «муж», а ἴδιον подчёркивает, что речь идёт о собственном супруге; это передано словом «свой».
theological_decisions:
- issue: Следует ли понимать стих как совет вступить в брак ради предотвращения сексуального греха или как указание о супружеских отношениях
  choice: Сохранить прямое указание о том, чтобы у каждого мужчины была своя жена, а у каждой женщины — свой муж, не уточняя сверх текста, означает ли это вступление в брак или супружеские отношения.
  alternative: 'Перевести истолковывающе: «пусть вступают в брак» либо «пусть исполняют супружеский долг».'
  rationale: В греческом стоит ἐχέτω («пусть имеет»), а не глагол, прямо обозначающий вступление в брак или исполнение супружеского долга. Формулировка сохраняет присущую тексту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранены причинная связь, повелительная сила и симметричный параллелизм оригинала; архаичное и потенциально узкое слово «блуд» не использовано.
