source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: ru
  text: Все братья приветствуют вас.[a] Приветствуйте друг друга святым поцелуем.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все братья и сёстры приветствуют вас»: слово «братья» может собирательно обозначать единоверцев обоих полов.'
    reason: lexical_alternative
  - marker: b
    text: Святой поцелуй был принятым среди верующих приветствием, выражавшим их святость и взаимное общение.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: приветствуют
  rationale: В эпистолярном контексте глагол означает передачу приветствия; настоящее время и краткая естественная формулировка сохранены.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: все братья
  rationale: Сохранена грамматически мужская форма греческого текста. В общинном контексте она может охватывать всех единоверцев, что отмечено в сноске.
- source_word: ἀσπάσασθε
  choice: приветствуйте
  rationale: Прямое повеление передано тем же русским глаголом, что и ἀσπάζονται, благодаря чему сохраняется лексическая связь между двумя частями стиха.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Естественный современный русский эквивалент взаимного местоимения.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: святым поцелуем
  rationale: Творительный падеж естественно передаёт способ приветствия, сохраняя как физический жест, так и определение его святости.
theological_decisions:
- issue: Значение ἀδελφοί в контексте общины
  choice: братья
  alternative: братья и сёстры; все верующие
  rationale: Основной текст сохраняет мужскую форму оригинала, не устраняя возможного собирательного значения. Возможность включения женщин-верующих указана в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, с сохранением повтора однокоренного греческого глагола посредством «приветствуют / приветствуйте».
