  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: ru
  text: 'Прошу вас, братья и сёстры[a]: вы знаете домашних Стефана — они первые плоды Ахаии[b] и посвятили себя служению святым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «братья»; в таком обращении греческое слово могло относиться ко всей общине, включая женщин.'
    reason: lexical_alternative
  - marker: b
    text: «Первые плоды» — вероятно, первые уверовавшие в Ахаии; вместе с тем выражение сохраняет образ первой части урожая, посвящаемой Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Прошу
  rationale: Передаёт настойчивое, но не властное обращение Павла естественным современным русским языком.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход; в русском он естественно передаётся самим началом нового обращения без искусственного «теперь» или излишне противительного «но».
- source_word: ἀδελφοί
  choice: братья и сёстры
  rationale: Мужская форма служит обращением ко всей смешанной общине; инклюзивное русское выражение ясно передаёт адресатов, а буквальная форма отмечена в сноске.
- source_word: οἴδατε
  choice: вы знаете
  rationale: Перфектная форма имеет настоящее значение; это прямой и естественный эквивалент.
- source_word: τὴν οἰκίαν Στεφανᾶ
  choice: дом Стефана
  rationale: «Дом» в библейском и обычном русском употреблении может обозначать всё домашнее сообщество, а не только здание.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: первые плоды Ахаии
  rationale: Сохраняет образ начатков и одновременно допускает смысл первых уверовавших в области.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: служению святым
  rationale: Передаёт направленность их посвящения на практическое служение верующим без привнесения значения церковной должности.
- source_word: ἔταξαν ἑαυτούς
  choice: посвятили себя
  rationale: Рефлексивная конструкция означает, что они сознательно отдали себя постоянному делу, а не официально назначили себя на должность.
theological_decisions:
- issue: Инклюзивность обращения ἀδελφοί
  choice: братья и сёстры
  alternative: братья
  rationale: В данном обращении грамматически мужское множественное число, вероятно, охватывает всю коринфскую общину. Основной текст передаёт реальный круг адресатов, а форма греческого оригинала сохраняется в примечании.
- issue: Метафора ἀπαρχή
  choice: первые плоды Ахаии
  alternative: первые уверовавшие в Ахаии
  rationale: Метафора сохранена, чтобы не сводить выражение исключительно к хронологии и не устранять возможный оттенок посвящения Богу.
- issue: Числовое согласование οἰκία и последующего множественного ἔταξαν
  choice: «дом» с последующим «они»
  alternative: «семья Стефана» с последующим «она»
  rationale: Греческий текст сначала называет дом как единое целое, а затем говорит о его членах во множественном числе; русский перевод сохраняет этот смысловой переход.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского обращения. Синтаксис сделан ясным для обычного читателя; метафора «первые плоды» и переход от собирательного «дом» к множественному «они» сохранены.
