lexical_decisions:
- source_word: ἐπιμενῶ
  choice: я останусь
  rationale: Будущее время глагола ἐπιμένω в контексте планов путешествия означает продолжать находиться в данном месте. «Я останусь» естественно передаёт это значение по-русски.
- source_word: δὲ
  choice: но
  rationale: Частица δέ обозначает мягкое противопоставление предыдущему сообщению о намерении Павла посетить Коринф; союз «но» сохраняет эту связь.
- source_word: ἐν Ἐφέσῳ
  choice: в Эфесе
  rationale: Предлог ἐν с дательным падежом имеет здесь прямое значение места; название города передано в общепринятой русской форме.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: до Пятидесятницы
  rationale: ἕως с родительным падежом указывает срок, до которого продлится пребывание. «Пятидесятница» — общепринятое русское название этого иудейского праздника в новозаветном контексте.
