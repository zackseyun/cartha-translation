reference: 1 Corinthians 16:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: ru
  text: Приветствуют вас церкви Асии[a]. Акила и Приска вместе с церковью в их доме горячо приветствуют вас в Господе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «Асия» — римская провинция на западе Малой Азии, а не современная часть света Азия.
    reason: cultural_note
  - marker: b
    text: В греческом тексте стоит имя «Приска»; в других местах она также названа Прискиллой (например, Деян. 18:2, 18, 26; Рим. 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: приветствуют
  rationale: Обычное значение ἀσπάζομαι — «приветствовать» или «передавать привет». Единый русский глагол сохраняет повтор греческого текста; усиление πολλὰ передано наречием «горячо».
- source_word: αἱ ἐκκλησίαι
  choice: церкви
  rationale: В посланиях Павла ἐκκλησία обычно обозначает местную христианскую общину. «Церкви» — ясное и привычное соответствие во множественном числе.
- source_word: τῆς Ἀσίας
  choice: Асии
  rationale: Здесь Ἀσία — римская провинция на западе Малой Азии. Традиционная русская форма «Асия» отличает её от современного названия континента; исторический смысл пояснён в сноске.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Буквально и богословски ёмко передаёт характер христианского единства и общения, не конкретизируя сверх сказанного в тексте.
- source_word: πολλὰ
  choice: горячо
  rationale: Наречное употребление πολλὰ усиливает приветствие. Буквальное «много» здесь неестественно по-русски, тогда как «горячо» передаёт сердечность и интенсивность.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: Акила и Приска
  rationale: Имена переданы в формах, соответствующих данному греческому тексту. Здесь употреблено Πρίσκα («Приска»), а не уменьшительная форма «Прискилла».
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: вместе с церковью в их доме
  rationale: Формулировка близко передаёт греческое выражение и естественно указывает на христианскую общину, собиравшуюся в доме Акилы и Приски, не добавляя глагол «собиралась» в основной текст.
theological_decisions:
- issue: Значение ἐκκλησία применительно к дому
  choice: «церковь в их доме» — местная христианская община, собиравшаяся в доме Акилы и Приски
  alternative: домашние Акилы и Приски как семья или домашнее хозяйство
  rationale: Обычное для Павла значение ἐκκλησία и конструкция κατ’ οἶκον указывают именно на общину, связанную с частным домом, а не только на членов семьи.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет устойчивый новозаветный титул и богословско-реляционный смысл выражения ἐν κυρίῳ без лишнего уточнения референта.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и естественным синтаксисом. Сохранены повтор глагола «приветствуют», выражение «в Господе» и близкая к оригиналу формула «церковь в их доме». Сноски размещены непосредственно после слов, к которым относятся.
