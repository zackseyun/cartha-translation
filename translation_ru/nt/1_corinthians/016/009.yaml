  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: ru
  text: Ведь для меня открылась великая и действенная дверь[a], и противников много.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открылась великая и действенная возможность». «Дверь» — метафора открывшейся возможности; в данном контексте она связана со служением Павла.'
    reason: лексическая альтернатива и пояснение метафоры
lexical_decisions:
- source_word: θύρα
  choice: дверь
  rationale: 'Сохранена метафора исходного текста: открытая дверь означает возможность для служения, но толкование не подменяет сам образ.'
- source_word: γάρ
  choice: ведь
  rationale: Союз вводит основание для сказанного Павлом ранее и естественно связывает стих с контекстом.
- source_word: μοι
  choice: передо мной
  rationale: Это естественное русское выражение при метафоре открывшейся двери; оно передаёт личную отнесённость дательного местоимения.
- source_word: ἀνέῳγεν
  choice: открылась
  rationale: Перфект указывает на совершившееся открытие и сохраняющееся вследствие него положение; русский совершенный вид естественно выражает этот смысл в данном контексте, не уточняя действующее лицо.
- source_word: μεγάλη
  choice: широкая
  rationale: В сочетании с метафорической «дверью» слово передаёт масштаб открывшейся возможности естественнее, чем буквальное, но неидиоматичное «великая дверь».
- source_word: ἐνεργής
  choice: для плодотворного служения
  rationale: При метафорической «двери» прилагательное означает действенную, дающую результат возможность; эта формулировка ясно и естественно передаёт контекстуальный смысл, сохраняя образ двери.
- source_word: ἀντικείμενοι
  choice: противников
  rationale: Субстантивированное причастие обозначает людей, активно противящихся Павлу и его делу; «противники» передаёт это кратко и без усиления.
- source_word: πολλοί
  choice: много
  rationale: Прямой и естественный эквивалент, сохраняющий краткость греческой фразы.
theological_decisions:
- issue: Метафора двери как возможности для служения
  choice: Сохранить слово «дверь», пояснив направленность возможности выражением «для плодотворного служения».
  alternative: «Передо мной открылась большая и действенная возможность».
  rationale: Сохранение метафоры уважает образность Павла, а естественное русское уточнение передаёт значение ἐνεργής без неидиоматичного сочетания «действенная дверь».
- issue: Связь возможности и сопротивления
  choice: Сохранить соединительный союз «и».
  alternative: «Но противников много».
  rationale: Греческое καί буквально соединяет две одновременно существующие реалии — плодотворную возможность и многочисленное противодействие. Перевод «но» сильнее истолковал бы логическую связь.
translation_notes:
  register: Современный литературный русский язык. Формулировка сохраняет павловскую метафору и её напряжённое соседство с упоминанием множества противников, избегая как церковнославянизмов, так и чрезмерно буквального сочетания «действенная дверь».
