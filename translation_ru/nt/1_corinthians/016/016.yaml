  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: ru
  text: чтобы и вы подчинялись таким людям и каждому, кто сотрудничает и усердно трудится.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или содержательное придаточное, продолжающее призыв предыдущего стиха.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: 'Сохраняет включительный акцент: коринфяне также должны поступать таким образом.'
- source_word: ὑποτάσσησθε
  choice: подчинялись
  rationale: Передаёт призыв признавать руководство и ставить себя под установленный порядок, не усиливая его до безусловного повиновения.
- source_word: τοῖς τοιούτοις
  choice: таким людям
  rationale: Обозначает людей, подобных дому Стефана и посвятивших себя служению; грамматически выражение не требует указания пола.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: всякому, кто трудится вместе с ними
  rationale: Передаёт глагольную форму и совместный характер труда; местоимение «с ними» восстанавливает подразумеваемую связь по контексту, поэтому отмечено сноской.
- source_word: καὶ κοπιῶντι
  choice: и усердно работает
  rationale: Выражает напряжённый, требующий усилий труд естественным современным русским языком.
theological_decisions:
- issue: Характер призыва к подчинению
  choice: Призыв добровольно признавать руководство таких христианских тружеников, как названные в контексте.
  alternative: Общее требование безусловного иерархического повиновения.
  rationale: Контекст стихов 15–18 говорит о доме Стефана и обо всех участвующих в труде. Перевод сохраняет силу призыва, но не привносит отсутствующего в стихе учения об абсолютном или институциональном подчинении.
- issue: С кем именно совершается совместный труд
  choice: «вместе с ними» — контекстуально с такими служителями, как дом Стефана.
  alternative: «с нами» либо неопределённое «трудится сообща».
  rationale: У συνεργοῦντι дополнение не выражено, поэтому референт остаётся не вполне определённым. Основной текст даёт естественное контекстуальное прочтение, а сноска сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Подчинялись» сохраняет прямоту греческого глагола; «усердно работает» естественно передаёт идею напряжённого труда без архаизма.
