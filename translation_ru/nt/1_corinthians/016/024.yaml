lexical_decisions:
- source_word: ἡ ἀγάπη μου
  choice: моя любовь
  rationale: Передаёт личную, обращённую ко всей общине любовь Павла простым и современным русским выражением.
- source_word: μετὰ πάντων ὑμῶν
  choice: со всеми вами
  rationale: Точно сохраняет значение сопровождения и подчёркнуто полный охват адресатов.
- source_word: ἐν
  choice: в
  rationale: Сохраняет характерное для Павла выражение сферы единения, не сужая его до значения «через».
- source_word: Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Χριστός передан как титул «Мессия», а Ἰησοῦ — как имя «Иисус»; падежные формы соответствуют греческой конструкции с ἐν.
theological_decisions:
- issue: Передача Χριστός в заключительной формуле
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: «Мессия» ясно передаёт смысл титула, тогда как традиционное «Христос» в русском языке нередко воспринимается почти как часть имени. Альтернатива отмечена в сноске.
- issue: Отсутствие глагола в греческом тексте
  choice: Моя любовь со всеми вами
  alternative: Моя любовь да будет со всеми вами
  rationale: Русская безглагольная конструкция естественна и сохраняет формальную неопределённость оригинала между утверждением и благопожеланием; добавление «да будет» однозначно истолковало бы фразу как пожелание.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная заключительная формула. Безглагольность оригинала сохранена естественной русской конструкцией. Маркер сноски поставлен непосредственно после относящегося к ней выражения.
