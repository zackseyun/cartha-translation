  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: ru
  text: Что же касается сбора для святых[a], поступайте и вы так, как я распорядился, чтобы поступали церкви Галатии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Божьего народа».'
    reason: Лексическая альтернатива поясняет, что «святые» здесь — обозначение принадлежащих Богу верующих.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Что же касается
  rationale: Естественно вводит новую тему и передаёт переходное значение δὲ, не добавляя временного «теперь».
- source_word: λογείας
  choice: сбора
  rationale: Обозначает денежный сбор; «сбор» точно и нейтрально, без добавочного культового оттенка слова «приношение».
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: для святых
  rationale: Передаёт назначение сбора и сохраняет характерное для Павла обозначение верующих как «святых».
- source_word: διέταξα
  choice: я распорядился
  rationale: Передаёт авторитетное указание, не усиливая его до резкого «приказал».
- source_word: ταῖς ἐκκλησίαις τῆς Γαλατίας
  choice: в церквах Галатии
  rationale: Естественное русское обозначение христианских общин данного региона; дательный падеж при διέταξα в контексте передан конструкцией «распорядился в церквах».
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: то и вы поступайте так
  rationale: Передаёт сравнительное οὕτως, включительное καί и побудительную силу аористного императива.
theological_decisions:
- issue: Передача ἅγιοι в контексте материальной помощи
  choice: святые
  alternative: Божий народ / верующие
  rationale: «Святые» сохраняет устойчивую лексику Павла и не сводит слово к позднейшему значению особо канонизированных лиц; примечание поясняет возможный смысл для современного читателя.
translation_notes:
  register: 'Современный литературный русский язык; тон ясный и достойный. Синтаксис перестроен естественно для русского: тематический оборот «Что же касается…» соотнесён с основной директивой через «то». Формулировка сохраняет авторитет Павлова указания и не уточняет сверх текста характер или получателей сбора.'
