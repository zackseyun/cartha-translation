  source_fidelity: Текст точно передаёт греческое ἡ χάρις τοῦ κυρίου Ἰησοῦ μεθ’ ὑμῶν. Родительная конструкция «благодать Господа Иисуса» сохраняет исходную формулировку, а «да будет с вами» естественно раскрывает эллиптическую благословительную форму без смыслового добавления.
