  text: Благодать Господа Иисуса да будет с вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: 'Устоявшийся и семантически точный русский эквивалент для ключевого термина Павловых благословений: незаслуженная милость и благой дар Господа.'
- source_word: κύριος
  choice: Господь
  rationale: Передаёт титул κύριος в его новозаветном и христологическом значении; «господин» здесь не соответствует характеру апостольского благословения.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Общепринятая русская форма личного имени, поставленная в родительном падеже по греческой конструкции.
- source_word: μεθ’ ὑμῶν
  choice: да будет с вами
  rationale: Греческое выражение буквально означает «с вами», но формула не содержит явного глагола. Частица «да» с формой «будет» естественно передаёт подразумеваемое пожелание-благословение.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: Родительный падеж сохраняет греческую именную конструкцию и не вынуждает выбирать только одно значение между принадлежностью и источником благодати.
theological_decisions:
- issue: Безглагольная формула благословения
  choice: 'Передать подразумеваемое пожелание словами «да будет»: «Благодать Господа Иисуса да будет с вами».'
  alternative: «Благодать Господа Иисуса с вами».
  rationale: В греческом тексте глагола нет, однако форма «да будет» ясно и естественно выражает обычную силу заключительного благословения, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим апостольскому благословению. Формула краткая и понятная; традиционное «да будет» сохранено как естественное выражение пожелания, а не как архаизм.
