lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: Когда же я приду
  rationale: ὅταν с аористом сослагательного наклонения указывает на ожидаемое будущее событие; «когда я приду» естественно передаёт этот смысл. Частица δέ сохранена лёгким связующим «же» без усиления противопоставления.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: тех, кого вы одобрите
  rationale: δοκιμάζω может включать проверку и последующее признание достойными; в контексте выбора представителей естественное русское соответствие — «одобрите».
- source_word: δι’ ἐπιστολῶν
  choice: с письмами
  rationale: διά с родительным падежом обозначает средство или сопровождение. Формулировка «с письмами» не уточняет без достаточных оснований, были ли это рекомендательные или сопроводительные письма.
- source_word: τούτους πέμψω
  choice: тех… я отправлю
  rationale: Указательное τούτους возобновляет и подчёркивает ранее названных одобренных лиц; русская конструкция сохраняет этот акцент.
- source_word: ἀπενεγκεῖν
  choice: чтобы они доставили
  rationale: Инфинитив выражает цель отправки представителей. «Доставили» ясно передаёт перенос пожертвования в Иерусалим и звучит естественно по-русски.
- source_word: τὴν χάριν ὑμῶν
  choice: ваш дар
  rationale: В контексте сбора для святых χάρις обозначает конкретное пожертвование, сохраняя оттенок добровольной щедрости. «Дар» передаёт предметный смысл без превращения слова в отвлечённое богословское понятие.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: εἰς с названием города естественно передаётся по-русски направлением «в Иерусалим».
theological_decisions:
- issue: Значение χάρις в контексте сбора пожертвований
  choice: Конкретный дар для верующих в Иерусалиме
  alternative: «благодать» или «дело милости» в более отвлечённом смысле
  rationale: Контекст 1 Кор 16 говорит о сборе материальной помощи, поэтому здесь требуется предметное обозначение дара; вместе с тем сноска сохраняет смысловой оттенок χάρις, связанный с благодатью и милостью.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный. Порядок слов сохраняет возобновляющее ударение τούτους и недвусмысленно связывает «с письмами» с отправкой одобренных представителей.
