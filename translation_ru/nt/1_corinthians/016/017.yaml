  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: ru
  text: Я рад приходу Стефана, Фортуната и Ахаика[a], потому что они восполнили ваш недостаток.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они восполнили то, чего вам недоставало». Контекст может указывать на то, что эти люди восполнили невозможность коринфян лично быть рядом с Павлом; греческое слово также допускает более широкое значение «нехватка» или «недостаток».'
    reason: лексическая и контекстуальная альтернатива
lexical_decisions:
- source_word: χαίρω
  choice: Я рад
  rationale: Настоящее время и личный тон переданы естественным современным русским выражением; более буквальное «я радуюсь» здесь звучало бы менее идиоматично.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Это слабая связка, которая в русском не требует обязательного союза; начало с «Я рад» сохраняет естественный ход речи без искусственного противопоставления.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: приходу
  rationale: В данном контексте παρουσία означает прибытие и личное присутствие названных людей, а не эсхатологическое пришествие.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: Стефана, Фортуната и Ахаика
  rationale: Имена переданы в традиционной русской библейской форме и поставлены в родительный падеж после слова «приходу».
- source_word: ὅτι
  choice: потому что
  rationale: Союз ясно вводит причину радости Павла.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: то, чего недоставало с вашей стороны
  rationale: 'Формулировка сохраняет исходную неоднозначность: речь может идти о невозможности коринфян лично присутствовать либо шире — о недостающем вкладе с их стороны. Перевод «ваше отсутствие» был бы более узким толкованием.'
- source_word: οὗτοι
  choice: они
  rationale: Русское местоимение естественно отсылает к трем только что названным людям; дополнительное «эти люди» было бы тяжеловесно.
- source_word: ἀνεπλήρωσαν
  choice: восполнили
  rationale: Глагол передает заполнение или возмещение недостающего и хорошо сочетается с конструкцией «то, чего недоставало».
theological_decisions:
- issue: Характер «недостатка» коринфян
  choice: Сохранить широкую формулировку «то, чего недоставало с вашей стороны»
  alternative: «восполнили ваше отсутствие»
  rationale: Греческое ὑστέρημα буквально обозначает нехватку или недостаток и само по себе не уточняет, что имеется в виду только физическое отсутствие. Контекст допускает такое понимание, но текст перевода не должен превращать вероятное толкование в единственно возможное.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный эпистолярный стиль. Основной текст близко передает структуру греческого оригинала, но избегает неестественного буквализма; сноска поясняет вероятный контекстуальный смысл, не устраняя неоднозначность оригинала.
