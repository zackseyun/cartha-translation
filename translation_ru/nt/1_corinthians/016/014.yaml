lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа употреблена всеохватно; русское «всё» естественно передаёт универсальный смысл.
- source_word: ὑμῶν
  choice: у вас
  rationale: Родительный падеж местоимения при πάντα образует сжатое выражение — буквально «всё ваше / всё, относящееся к вам». Оборот «всё у вас» сохраняет эту широту и не сводит смысл исключительно к индивидуальным поступкам.
- source_word: ἐν ἀγάπῃ
  choice: в любви
  rationale: Предложное сочетание может обозначать образ действия или сферу. «В любви» близко следует греческой форме и сохраняет возможный оттенок сферы, тогда как «с любовью» подчёркивало бы прежде всего образ действия.
- source_word: γινέσθω
  choice: пусть … совершается
  rationale: 'Настоящее повелительное наклонение третьего лица от γίνομαι выражает призыв: «пусть происходит / совершается». «Совершается» естественно сочетается со всеохватным «всё» и передаёт направленность на действия и происходящее в общине.'
