  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: ru
  text: Если Тимофей придёт, позаботьтесь, чтобы он пребывал среди вас без страха[a], ведь он совершает дело Господа, как и я[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он был у вас без страха». Греческое выражение может обозначать пребывание Тимофея у адресатов в состоянии, свободном от страха.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ведь он делает дело Господа, как и я».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: Если Тимофей придёт
  rationale: Условная конструкция с ἐάν и аористом сослагательного наклонения выражает реальную будущую возможность. Частица δέ здесь служит мягким переходом и не требует отдельного противительного союза в русском тексте.
- source_word: βλέπετε ἵνα
  choice: позаботьтесь, чтобы
  rationale: Императив βλέπετε требует деятельного внимания и заботы; эта русская конструкция естественно вводит целевое придаточное с ἵνα.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: он был у вас без страха
  rationale: Формулировка сохраняет как идею пребывания Тимофея среди адресатов, так и обстоятельство ἀφόβως, не сводя его исключительно к субъективному чувству безопасности.
- source_word: τὸ ἔργον κυρίου ἐργάζεται
  choice: он совершает дело Господа
  rationale: Однокоренное сочетание существительного и глагола передано естественно для современного русского языка, с сохранением продолжающегося характера служения.
- source_word: κυρίου
  choice: Господа
  rationale: Передаёт κύριος традиционным и контекстуально уместным русским соответствием, не уточняя референта сверх сказанного в греческом тексте.
- source_word: ὡς κἀγώ
  choice: как и я
  rationale: Сохраняет эллипсис греческого выражения и подчёркивает, что Павел также совершает дело Господа.
theological_decisions:
- issue: К кому относится κυρίου
  choice: «Господа» без дополнительного уточнения
  alternative: «Господа Иисуса»
  rationale: В контексте Павловых посланий, вероятнее всего, имеется в виду Иисус Христос, однако исходный текст говорит только «Господа», поэтому перевод не добавляет явного отождествления.
- issue: Характер служения Тимофея
  choice: «совершает дело Господа»
  alternative: «трудится для Господа»
  rationale: Выбранный вариант сохраняет объектную конструкцию τὸ ἔργον κυρίου и ставит труд Тимофея в один ряд с трудом Павла, не вводя дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Позаботьтесь» передаёт не просто наблюдение, а практическую ответственность общины. Сочетание «без страха» намеренно сохраняет формальную широту ἀφόβως; более разговорное «чтобы он чувствовал себя в безопасности» было бы истолковательным.
