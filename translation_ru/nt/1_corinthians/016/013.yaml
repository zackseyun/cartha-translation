  text: Γρηγορεῖτε, στήκετε ἐν τῇ πίστει, ἀνδρίζεσθε, κραταιοῦσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: ru
  text: Бодрствуйте, стойте твёрдо в вере, будьте мужественны[a], укрепляйтесь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поступайте как мужчины»; по смыслу: «будьте смелы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будьте сильны»; греческая форма имеет страдательный залог и может подразумевать: «обретайте силу», «будьте укрепляемы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: Бодрствуйте
  rationale: Настоящее повелительное множественного числа выражает постоянную бдительность; «бодрствуйте» естественно и ёмко передаёт этот призыв в библейском контексте.
- source_word: στήκετε
  choice: стойте твёрдо
  rationale: Глагол обозначает стойкость и непоколебимость, а не просто физическое положение стоя.
- source_word: ἐν τῇ πίστει
  choice: в вере
  rationale: Определённый артикль допускает понимание веры как христианского исповедания или сферы верности ему; русское «в вере» естественно сохраняет возможную смысловую широту и не требует искусственного указательного оборота.
- source_word: ἀνδρίζεσθε
  choice: будьте мужественны
  rationale: Греческий глагол образован от ἀνήρ («мужчина, муж») и буквально призывает действовать по-мужски, но устойчиво выражает смелость и мужество. Русское «будьте мужественны» сохраняет этимологический оттенок и передаёт идиоматический смысл без ложного ограничения адресатов мужчинами.
- source_word: κραταιοῦσθε
  choice: укрепляйтесь
  rationale: Форма настоящего времени в страдательном залоге позволяет передать продолжающееся обретение силы. «Укрепляйтесь» сохраняет эту динамику и залоговую неоднозначность лучше, чем статичное «будьте сильны».
theological_decisions:
- issue: Значение πίστις с артиклем
  choice: в вере
  alternative: в этой вере; в истинной вере
  rationale: Контекст поддерживает понимание христианской веры как исповедания и жизненной позиции, однако добавление «этой» или «истинной» сделало бы выражение уже, чем греческий текст.
- issue: Гендерный образ в ἀνδρίζεσθε
  choice: будьте мужественны
  alternative: поступайте как мужчины; будьте смелы
  rationale: Выбранный вариант передаёт и связь с образом мужества, и общеупотребительный призыв к храбрости, обращённый ко всей общине. Буквальный вариант отмечен в сноске, чтобы не скрывать форму исходного выражения.
- issue: Страдательный залог κραταιοῦσθε
  choice: укрепляйтесь
  alternative: будьте сильны; будьте укрепляемы
  rationale: Перевод сохраняет возможность понимать силу как обретаемую или даруемую, не уточняя прямо её источник; это не устраняет богословское напряжение формы.
translation_notes:
  register: Краткие параллельные повеления сохранены. Регистр современный литературный и достоинственный; традиционное «бодрствуйте» остаётся понятным и уместным, а сноски сохраняют буквальный гендерный образ и залоговую неоднозначность.
