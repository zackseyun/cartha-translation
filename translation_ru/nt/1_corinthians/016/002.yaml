  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: ru
  text: В первый день каждой недели[a] пусть каждый из вас у себя[b] откладывает, накапливая столько, сколько позволяет его достаток[c], чтобы, когда я приду, не устраивались сборы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «В первый день недели». Греческое выражение здесь, по-видимому, имеет распределительное значение и указывает на регулярное еженедельное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при себе» или «у себя». Возможно, речь идёт о том, чтобы каждый лично откладывал деньги, вероятно у себя дома.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сообразно тому, насколько он преуспевает». Смысл в том, чтобы каждый откладывал в соответствии с имеющимся у него достатком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: В первый день каждой недели
  rationale: Конструкция κατά с винительным падежом имеет здесь распределительное значение и указывает на регулярно повторяющееся еженедельное действие. Такой перевод естественно передаёт это значение по-русски.
- source_word: ἕκαστος ὑμῶν
  choice: каждый из вас
  rationale: Точно передаёт распределительное указание, обращённое к каждому члену общины.
- source_word: παρ’ ἑαυτῷ
  choice: у себя
  rationale: Буквально выражение означает «при себе» или «у себя». Перевод сохраняет возможность как личного откладывания средств, так и их хранения дома, не решая однозначно, где именно они должны были храниться.
- source_word: τιθέτω θησαυρίζων
  choice: пусть … откладывает … и копит
  rationale: Форма повелительного наклонения выражает продолжающееся предписание, а причастие θησαυρίζων добавляет идею постепенного накопления. Сочетание двух русских глаголов ясно передаёт оба оттенка.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: столько, сколько позволяет его достаток
  rationale: Неопределённо-условная конструкция соотносит откладываемую сумму с благополучием или достатком каждого. Русская формулировка передаёт смысл естественно, не сводя его только к заработку.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: чтобы, когда я приду, сборы уже не устраивались
  rationale: 'Сохраняет целевую связь: регулярное накопление должно исключить необходимость организовывать сборы по прибытии Павла. «Уже» естественно передаёт усилительное тогда в данном контексте.'
