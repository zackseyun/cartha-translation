  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: ru
  text: Что же касается брата Аполлоса[a], я настоятельно просил его прийти к вам вместе с братьями, но он вовсе не хотел прийти сейчас[b]. Он придёт, когда у него будет возможность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Аполлоса, брата»; притяжательного местоимения в греческом тексте нет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он вовсе не хотел сейчас прийти». Буквально: «совсем не было [его] воли, чтобы он сейчас пришёл»; по контексту имеется в виду воля Аполлоса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Что же касается
  rationale: Естественный русский способ ввести новую тему; частица «же» передаёт переход δέ без добавления временного «теперь».
- source_word: Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: брата Аполлоса
  rationale: Сохраняет приложение с определённым артиклем и не добавляет отсутствующего в греческом притяжательного местоимения.
- source_word: πολλὰ παρεκάλεσα
  choice: я настоятельно просил
  rationale: Передаёт усилительную силу πολλὰ при παρακαλέω современным литературным русским языком.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς
  choice: прийти к вам
  rationale: Русский инфинитив естественно выражает содержание настойчивой просьбы и сохраняет направление πρὸς ὑμᾶς.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: вместе с братьями
  rationale: В контексте речь, вероятно, идёт о конкретных мужчинах-посланниках; грамматически мужской род сохранён.
- source_word: καὶ πάντως οὐκ ἦν θέλημα
  choice: но он вовсе не хотел
  rationale: «Вовсе не» передаёт эмфатическое πάντως οὐκ, а личная конструкция естественно выражает подразумеваемую волю Аполлоса.
- source_word: νῦν
  choice: сейчас
  rationale: Прямо передаёт временное значение наречия в современном русском языке.
- source_word: ἐλεύσεται δὲ
  choice: Он придёт
  rationale: Новая фраза после отрицательного утверждения ясно передаёт слабое противопоставление δέ без тяжеловесного союза.
- source_word: ὅταν εὐκαιρήσῃ
  choice: когда представится удобный случай
  rationale: Передаёт наличие благоприятной возможности или подходящего времени, не сводя смысл к личному удобству.
theological_decisions:
- issue: Субъект и смысл οὐκ ἦν θέλημα
  choice: Высказывание относится к желанию самого Аполлоса.
  alternative: «Не было Божьей воли, чтобы он пришёл сейчас».
  rationale: Ближайший и наиболее естественный носитель воли — Аполлос, которого Павел настойчиво просил. Указания на Божью волю в контексте нет.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным апостольскому письму звучанием. Синтаксис умеренно формальный, но понятный широкому кругу читателей; подлинная неоднозначность конструкции с θέλημα отмечена в сноске.
