id: 1CO.16.5
reference: 1 Corinthians 16:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: ru
  text: Но я приду к вам, когда пройду через Македонию[a], потому что мой путь лежит через Македонию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда буду проходить через Македонию».'
    reason: Возможна передача аориста сослагательного наклонения без явного акцента на завершённости; основной текст выражает её русским совершенным видом.
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: я приду
  rationale: Будущая форма ἔρχομαι выражает намерение Павла прибыть к коринфянам; русское «приду к вам» естественно передаёт направленность πρὸς ὑμᾶς.
- source_word: δὲ
  choice: но
  rationale: δέ обозначает мягкий переход с оттенком противопоставления предшествующему плану путешествия; «но» уместно и не требует усиления.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: πρός с винительным падежом при глаголе движения обозначает движение к людям.
- source_word: ὅταν ... διέλθω
  choice: когда пройду
  rationale: Сочетание ὅταν с аористом сослагательного наклонения указывает на будущее событие, предшествующее приходу Павла. Русский совершенный вид «пройду» естественно сохраняет значение завершённости.
- source_word: Μακεδονίαν
  choice: Македонию
  rationale: Общепринятая русская форма названия римской провинции в требуемом винительном падеже.
- source_word: γὰρ
  choice: потому что
  rationale: γάρ вводит объяснение того, почему Павел придёт после прохождения Македонии; «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: Μακεδονίαν ... διέρχομαι
  choice: мой путь лежит через Македонию
  rationale: Настоящее διέρχομαι может описывать намеченный и уже определённый маршрут. Такая русская формулировка естественно передаёт это значение и избегает двусмысленного впечатления, будто Павел уже физически находится в Македонии.
