  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: ru
  text: Если кто не любит Господа, да будет проклят[a]. Марана та[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или традиционно: «да будет анафема»; то есть да будет под проклятием.'
    reason: lexical_alternative
  - marker: b
    text: 'Арамейское выражение. Возможно: «Господь наш, приди!» или «Господь наш пришёл».'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: любит
  rationale: Здесь φιλέω обозначает личную любовь и привязанность к Господу. «Любит» — наиболее естественный русский эквивалент, не сужающий смысл до дружбы или эмоциональной теплоты.
- source_word: κύριον
  choice: Господа
  rationale: В данном контексте κύριος относится к Иисусу и имеет вес христологического титула. «Господь» сохраняет как титульное значение, так и устойчивое новозаветное употребление.
- source_word: ἤτω
  choice: да будет
  rationale: Форма повелительного наклонения настоящего времени от εἰμί имеет юссивную силу. Оборот «да будет» естественно передаёт торжественный характер предостережения или приговора.
- source_word: ἀνάθεμα
  choice: проклят
  rationale: ἀνάθεμα указывает на того, кто находится под проклятием или обречён на погибель. «Проклят» ясно передаёт смысл на современном русском языке, тогда как традиционное «анафема» может восприниматься исключительно как позднейший церковно-дисциплинарный термин.
- source_word: Μαράνα θά
  choice: Марана та
  rationale: Это арамейское выражение, переданное греческими буквами. Поскольку его членение и точный смысл остаются спорными, в основном тексте сохранена транслитерация, а основные варианты понимания приведены в сноске.
theological_decisions:
- issue: Смысл арамейского выражения Μαράνα θά
  choice: 'Сохранить в основном тексте транслитерацию: «Марана та».'
  alternative: «Господь наш, приди!» или «Господь наш пришёл».
  rationale: Выражение текстуально устойчиво, но его смысл зависит от членения и истолкования арамейской формы. Транслитерация сохраняет исходный литургический или восклицательный характер и не устраняет подлинную неоднозначность.
- issue: Характер выражения ἤτω ἀνάθεμα
  choice: «да будет проклят»
  alternative: '«да будет под проклятием»; традиционно: «да будет анафема»'
  rationale: Перевод сохраняет суровую судебно-проклятийную силу фразы, не уточняя, идёт ли речь о церковном отлучении, окончательном Божьем суде или иной конкретной форме наказания, которой греческий текст прямо не называет.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и предельно серьёзным звучанием. Конструкция «если кто» сохраняет библейскую достоинственность, оставаясь понятной современному читателю. Транслитерация «Марана та» воспроизводит раздельное написание греческого текста; смысл раскрывается в сноске.
