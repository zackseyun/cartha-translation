  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: ru
  text: Ведь они подкрепили мой дух и ваш. Поэтому признавайте таких людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдавайте должное таким людям»; «цените таких людей». Греческое выражение имеет форму мужского рода и здесь относится к мужчинам, названным непосредственно перед этим.'
    reason: Лексический диапазон ἐπιγινώσκετε и конкретная мужская референция τοὺς τοιούτους допускают пояснение без выбора более узкого значения в основном тексте.
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: успокоили
  rationale: Глагол употреблён метафорически и передаёт внутреннее облегчение и ободрение, а не буквальный отдых. «Успокоили» сохраняет образ покоя и естественно сочетается с «духом».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание сказанного ранее; «ведь» естественно выражает эту пояснительно-причинную связь в современном русском языке.
- source_word: πνεῦμα
  choice: дух
  rationale: Здесь имеется в виду внутреннее состояние человека, а не Святой Дух. «Дух» сохраняет лексику и образность Павла.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: и мой дух, и ваш
  rationale: 'Вторая часть греческого выражения эллиптична: после «ваш» подразумевается «дух». Русская формулировка сохраняет компактность и ясно распространяет действие на обе стороны.'
- source_word: ἐπιγινώσκετε
  choice: отдавайте должное
  rationale: В данном контексте глагол призывает не просто опознавать этих людей, а признавать их служение и относиться к ним с должной оценкой. Выражение не усиливает смысл до официального почитания.
- source_word: οὖν
  choice: поэтому
  rationale: Союз обозначает вывод из предшествующего утверждения и вводит призыв.
- source_word: τοὺς τοιούτους
  choice: таким людям
  rationale: Выражение указывает на только что названных Стефана, Фортуната и Ахаика. «Таким людям» звучит естественно по-русски; конкретная мужская референция пояснена в сноске.
theological_decisions:
- issue: Передача мужского рода в τοὺς τοιούτους
  choice: таким людям
  alternative: таким мужам
  rationale: В контексте имеются в виду конкретные мужчины, названные ранее. Однако «таким мужам» в современном русском звучит архаично и излишне торжественно, тогда как «таким людям» естественно обозначает этих лиц, не отрицая их пола; сноска сохраняет точность референции.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Сохранены Павлова метафора «успокоить дух» и логические связки стиха; повеление передано естественным русским выражением.
