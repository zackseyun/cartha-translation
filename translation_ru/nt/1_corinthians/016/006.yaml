lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: у вас
  rationale: При глаголе пребывания сочетание πρός с винительным указывает на пребывание рядом с людьми; по-русски естественно передаётся как «у вас».
- source_word: δὲ
  choice: А
  rationale: Частица служит мягким связующим переходом в изложении планов Павла, без выраженного противопоставления.
- source_word: τυχὸν
  choice: возможно
  rationale: Передаёт значение вероятности и неопределённости, присущее наречному употреблению причастия.
- source_word: παραμενῶ
  choice: задержусь
  rationale: В контексте поездки глагол означает остаться, пробыть некоторое время; «задержусь» естественно передаёт продолжение пребывания.
- source_word: ἢ καὶ
  choice: или даже
  rationale: 'Сочетание усиливает вторую возможность: Павел может не просто задержаться, но провести там всю зиму.'
- source_word: παραχειμάσω
  choice: проведу зиму
  rationale: Глагол точно обозначает пребывание в каком-либо месте в течение зимы.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит цель предполагаемого пребывания Павла.
- source_word: προπέμψητε
  choice: вы помогли мне отправиться дальше
  rationale: В контексте путешествия προπέμπω может означать проводить отъезжающего и содействовать дальнейшему пути, в том числе практической помощью.
- source_word: οὗ ἐὰν πορεύωμαι
  choice: куда бы я ни направился
  rationale: Относительное наречие с ἐάν и сослагательным наклонением выражает неопределённое и пока не установленное направление.
