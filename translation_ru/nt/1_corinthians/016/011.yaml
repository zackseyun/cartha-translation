  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: ru
  text: Итак, пусть никто не относится к нему с пренебрежением. Проводите же его с миром, чтобы он мог прийти ко мне, потому что я жду его вместе с братьями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно также, что речь о Тимофее, который придёт к Павлу вместе с братьями. Слово «братья» может употребляться в собирательном смысле о более широком круге верующих или сотрудников, включая женщин.
    reason: Сохраняет синтаксическую неоднозначность оборота μετὰ τῶν ἀδελφῶν и поясняет возможный собирательный смысл ἀδελφῶν.
lexical_decisions:
- source_word: μή τις οὖν
  choice: Итак, пусть никто не
  rationale: μή с аористом сослагательного наклонения выражает запрещение, а «итак» передаёт выводный характер οὖν и связь с предыдущими наставлениями.
- source_word: ἐξουθενήσῃ
  choice: не относится к нему с пренебрежением
  rationale: Глагол означает считать кого-либо незначительным, ни во что не ставить или презирать; выбранный оборот естественно передаёт отношение и обращение с Тимофеем, не ослабляя предостережения.
- source_word: προπέμψατε
  choice: Проводите же его
  rationale: Глагол может обозначать проводы и содействие человеку при дальнейшем путешествии; «проводите» здесь естественнее буквального «пошлите» и сохраняет практический оттенок помощи в пути.
- source_word: ἐν εἰρήνῃ
  choice: с миром
  rationale: Формулировка близко следует греческому выражению и подразумевает мирные, доброжелательные и беспрепятственные проводы.
- source_word: ἵνα ἔλθῃ πρός με
  choice: чтобы он пришёл ко мне
  rationale: Союз ἵνα с сослагательным наклонением передаёт цель предполагаемых проводов.
- source_word: ἐκδέχομαι
  choice: я жду
  rationale: Настоящее время выражает продолжающееся ожидание; простое «жду» естественно и точно в современном русском языке.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: вместе с братьями
  rationale: Греческое существительное стоит в мужском роде множественного числа. Основной текст сохраняет эту форму, а возможное обозначение более широкого круга верующих или сотрудников отражено в примечании.
theological_decisions:
- issue: К кому по смыслу относится μετὰ τῶν ἀδελφῶν и включает ли ἀδελφῶν женщин
  choice: «я жду его вместе с братьями»; братья ожидают его вместе с Павлом
  alternative: «я жду его и братьев»; либо «вместе с братьями и сёстрами»
  rationale: 'Положение оборота допускает некоторую смысловую неоднозначность: братья могут ожидать Тимофея вместе с Павлом либо быть ожидаемыми спутниками Тимофея. Естественное ближайшее прочтение русского текста понимает их как ожидающих вместе с Павлом, но примечание сохраняет альтернативу и возможный собирательный смысл слова «братья».'
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным звучанием. «Относится с пренебрежением» избрано вместо более книжного «презирать», а «проводите» передаёт обычай содействовать дальнейшему пути. Частица «же» сохраняет переход и лёгкое противопоставление, выраженное δέ.
