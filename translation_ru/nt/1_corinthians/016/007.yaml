  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: ru
  text: Ведь я не хочу сейчас увидеться с вами только проездом, потому что надеюсь пробыть у вас некоторое время, если Господь позволит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увидеться с вами лишь мимоходом»; «увидеться с вами по пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω
  choice: я не хочу
  rationale: Передаёт личное желание и намерение Павла естественным современным русским языком.
- source_word: ἄρτι
  choice: сейчас
  rationale: Указывает на нынешний момент или текущие обстоятельства.
- source_word: ἐν παρόδῳ
  choice: лишь мимоходом
  rationale: Обозначает краткое посещение по пути; частица «лишь» естественно подчёркивает противопоставление более длительному пребыванию.
- source_word: ἰδεῖν
  choice: увидеться
  rationale: В данном контексте речь идёт о личной встрече; возвратная форма по-русски естественнее буквального «увидеть вас» и не усиливает значение до отдельного глагола «посетить».
- source_word: ἐλπίζω
  choice: надеюсь
  rationale: Сохраняет ожидание и желание без оттенка уверенности.
- source_word: χρόνον τινά
  choice: некоторое время
  rationale: Передаёт неопределённую, но не обязательно краткую продолжительность.
- source_word: ἐπιμεῖναι
  choice: пробыть
  rationale: Естественно выражает пребывание в течение некоторого времени и хорошо сочетается с указанной длительностью.
- source_word: πρὸς ὑμᾶς
  choice: у вас
  rationale: С глаголом пребывания это наиболее естественное русское обозначение нахождения у адресатов; смысл общения с ними сохраняется контекстом.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: если Господь позволит
  rationale: Ясно и естественно передаёт условие и зависимость намерения Павла от позволения Господа.
- source_word: κύριος
  choice: Господь
  rationale: Стандартное соответствие κύριος в божественном употреблении; не уточняет референта сверх греческого текста.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Сохранить «Господь» без уточнения.
  alternative: «Господь Иисус» или «Бог».
  rationale: В греческом тексте стоит κύριος без пояснения; перевод сохраняет эту референциальную открытость.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Союз «ведь» передаёт объяснительное γάρ; во второй части «а» естественно выражает смысловое противопоставление краткого визита более длительному пребыванию.
