revisions:
- from: Ведь я не хочу сейчас увидеться с вами лишь мимоходом[a], а надеюсь пробыть у вас некоторое время, если Господь позволит.
  to: Ведь я не хочу сейчас увидеться с вами только проездом, потому что надеюсь пробыть у вас некоторое время, если Господь позволит.[a]
  rationale: Перевод уточнён, чтобы передать объяснительную связь, отмеченную вторым γάρ, и чтобы основное выражение для ἐν παρόδῳ яснее обозначало краткое посещение в пути. Смысл, регистр и открытый референт слова «Господь» сохранены. Сноска перенесена к условию в конце предложения как структурно безопасный якорь, при этом её содержание относится к выражению «только проездом».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:57:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: οὐ θέλω, ἄρτι, ἐν παρόδῳ, ἐλπίζω, χρόνον τινά, ἐπιμεῖναι, πρὸς ὑμᾶς и условие ἐὰν ὁ κύριος ἐπιτρέψῃ отражены без богословского уточнения референта «Господь». Однако второе γάρ выражает основание нежелания Павла; противительный союз «а» передаёт контраст, но ослабляет эту причинную связь.'
  naturalness: Текст в целом литературен и понятен. Формулировка «лишь мимоходом» возможна, но рядом с «увидеться» может восприниматься как случайная краткая встреча, а не как краткая остановка в пути. «Проездом» точнее и естественнее в данном контексте.
  terminology: «Господь» — верное и нейтральное соответствие κύριος; не следует уточнять, идёт ли речь об Иисусе или о Боге. «Пробыть у вас некоторое время» удачно передаёт длительное пребывание у адресатов.
