  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: ru
  text: Если, говоря по-человечески[a], я сражался в Эфесе с дикими зверями[b], какая мне от этого польза? Если мёртвые не воскресают, «будем есть и пить[c], потому что завтра умрём».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «если, с чисто человеческой точки зрения, я сражался…». Оборот может характеризовать либо способ выражения Павла, либо принятую им в рассуждении точку зрения.'
    reason: lexical_alternative
  - marker: b
    text: Слова «сражался с дикими зверями» можно понимать буквально или как образ борьбы с жестокими людьми; основной текст сохраняет греческий образ, не выбирая между этими пониманиями.
    reason: alternative_reading
  - marker: c
    text: Цитата или аллюзия на Ис 22:13.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: говоря по-человечески
  rationale: Естественная русская идиома передаёт человеческий способ выражения или человеческую точку зрения, не устраняя синтаксическую неоднозначность оборота.
- source_word: ἐθηριομάχησα
  choice: я сражался с дикими зверями
  rationale: Сохранён буквальный и яркий образ греческого глагола без решения вопроса, идёт ли речь о настоящих зверях или о жестоких противниках.
- source_word: ἐν Ἐφέσῳ
  choice: в Эфесе
  rationale: Общепринятая русская форма географического названия.
- source_word: τί μοι τὸ ὄφελος
  choice: какая мне от этого польза?
  rationale: Естественно и ясно передаёт риторический вопрос о личной пользе.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: мёртвые не воскресают
  rationale: Обычное русское выражение для воскресения умерших; оно передаёт смысл греческого пассива без тяжеловесного «не бывают воскрешены».
- source_word: Φάγωμεν καὶ πίωμεν
  choice: будем есть и пить
  rationale: Передаёт побудительное значение греческих форм первого лица множественного числа и естественно звучит как цитируемый призыв.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: потому что завтра умрём
  rationale: Передаёт ориентированное на будущее значение настоящего времени в греческой фразе и сохраняет связь с Ис 22:13.
theological_decisions:
- issue: Буквально или метафорически следует понимать ἐθηριομάχησα
  choice: В основном тексте сохранено «сражался с дикими зверями» без уточнения характера события.
  alternative: Понять выражение как метафору ожесточённой борьбы Павла с людьми-противниками в Эфесе.
  rationale: Греческий текст сохраняет образ звероборства, а ход аргумента не требует от перевода разрешать историческую неоднозначность.
- issue: Передача пассивной формы ἐγείρονται
  choice: мёртвые не воскресают
  alternative: мёртвые не воскрешаются
  rationale: Первый вариант современнее и естественнее по-русски; он не отрицает действия Бога, но и не добавляет в основной текст явно названного деятеля, которого в греческой фразе нет.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и риторически выразительный. Сохранены краткость, условная логика и цитатный характер заключительного призыва.
