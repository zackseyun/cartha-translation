  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: ru
  text: Ведь как в Адаме все умирают, так и в Мессии[a] все будут оживлены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе». Греческий титул Χριστός можно передать как «Христос» или перевести по значению как «Мессия»; здесь он переведён по значению.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: Передаёт сравнительную конструкцию ὥσπερ и связующую, пояснительную силу γάρ естественным русским оборотом.
- source_word: ἐν τῷ Ἀδὰμ
  choice: в Адаме
  rationale: Сохраняет краткий и богословски ёмкий оборот с ἐν, не сводя его ни к посредничеству, ни к явно выраженному единению.
- source_word: πάντες
  choice: все
  rationale: Сохраняет неуточнённый охват и точный параллелизм обоих употреблений πάντες.
- source_word: ἀποθνῄσκουσιν
  choice: умирают
  rationale: Настоящее время по-русски естественно выражает общую, постоянно действующую реальность.
- source_word: οὕτως καὶ
  choice: так и
  rationale: Естественно воспроизводит соотносительную структуру «как… так и…» и добавочную силу καί.
- source_word: ἐν τῷ Χριστῷ
  choice: в Мессии
  rationale: Передаёт Χριστός как титул и сохраняет структурный параллелизм с выражением «в Адаме».
- source_word: ζῳοποιηθήσονται
  choice: будут оживлены
  rationale: Сохраняет будущее время и пассивный залог, не называя прямо подразумеваемого деятеля.
theological_decisions:
- issue: Охват слова πάντες в обеих частях
  choice: Сохранить «все» без поясняющего ограничения в обеих частях.
  alternative: Уточнить второе «все» как «все верующие» либо прямо объявить оба употребления полностью тождественными по охвату.
  rationale: Греческий текст намеренно ставит πάντες в параллельных частях и в самом стихе не разъясняет все богословские пределы и механизм этого соответствия.
- issue: Значение предлога ἐν
  choice: 'Передать одинаково: «в Адаме» и «в Мессии».'
  alternative: Раскрыть как «в единении с» или заменить причинно-инструментальным «через».
  rationale: Буквально близкая передача сохраняет корпоративно-представительный оттенок и присущую формулировке многозначность.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный и понятный синтаксис. Симметрия «как… так и…» сохраняет риторическую форму оригинала.
