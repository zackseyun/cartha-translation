id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: ru
  text: Ведь «Он подчинил всё под ноги Его». Когда же сказано[a], что всё подчинено, ясно, что Тот, кто подчинил Ему всё, не входит в это «всё».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда же Он скажет».'
    reason: В греческом глагол стоит в третьем лице единственного числа без явно названного подлежащего; возможна как отсылка к словам Писания, так и понимание Бога в качестве подлежащего.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: всё
  rationale: Субстантивированное среднее множественное имеет всеохватный смысл; «всё» естественно по-русски и сохраняет отзвук Псалма 8.
- source_word: ὑπέταξεν / ὑποτέτακται
  choice: подчинил / подчинено
  rationale: «Подчинить» передаёт установление подчинённого положения; формы сохраняют соответственно активность аориста и пассивное результирующее состояние перфекта.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: под ноги его
  rationale: Буквально сохранён библейский образ господства и подчинения.
- source_word: ὅταν δὲ εἴπῃ
  choice: когда же говорится
  rationale: Безличная формулировка естественно отсылает к приведённому изречению Писания и не навязывает явно не названный в греческом подлежащий.
- source_word: δῆλον
  choice: ясно
  rationale: Кратко и естественно выражает ожидаемый Павлом логический вывод.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: это не относится к Тому, кто подчинил Ему всё
  rationale: 'Передаёт исключение: подчинивший всё Сыну сам не входит в состав подчинённого «всего», при этом по-русски звучит яснее, чем синтаксически обрывистое буквальное «кроме Того».'
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный обозначает того, кому всё подчинено; в контексте это Христос.
theological_decisions:
- issue: Отношение Сына к Тому, кто подчинил Ему всё
  choice: Прямо показать, что подчинивший всё не включён в понятие «всё»
  alternative: 'Более буквальное: «кроме Того, кто подчинил Ему всё»'
  rationale: Так сохраняется прямо выраженное Павлом исключение и различие между Сыном и Тем, кто всё Ему подчинил, без дальнейшего догматического истолкования.
- issue: Неуказанное подлежащее εἴπῃ
  choice: Безличное «говорится»
  alternative: «Он скажет»
  rationale: Греческая форма допускает личное понимание, но непосредственная связь с цитируемым изречением позволяет отнести её к словам Писания; примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «под ноги». Заглавные местоимения помогают различить в контексте действующего Бога и Христа, не добавляя имён, отсутствующих в греческом тексте.
