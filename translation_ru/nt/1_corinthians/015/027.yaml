    text: 'Или: «когда же Он скажет».'
    reason: В греческом глагол стоит в третьем лице единственного числа без явно названного подлежащего; возможна как отсылка к словам Писания, так и понимание Бога в качестве подлежащего.
  revision_rationale: 'Правка делает исключающий смысл ἐκτός недвусмысленным: подчинивший всё не является частью того «всего», что подчинено. «Сказано» сохраняет безличную отсылку к Писанию, а сноска фиксирует допустимое личное прочтение εἴπῃ. Также унифицировано написание местоимений.'
