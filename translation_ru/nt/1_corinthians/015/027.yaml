revisions:
- from: Ведь «всё Он подчинил под ноги его». Когда же говорится[a], что всё подчинено, ясно, что это не относится к Тому, кто подчинил Ему всё.
  to: Ведь «Он подчинил всё под ноги Его». Когда же сказано[a], что всё подчинено, ясно, что Тот, кто подчинил Ему всё, не входит в это «всё».
  rationale: 'Правка делает исключающий смысл ἐκτός недвусмысленным: подчинивший всё не является частью того «всего», что подчинено. «Сказано» сохраняет безличную отсылку к Писанию, а сноска фиксирует допустимое личное прочтение εἴπῃ. Также унифицировано написание местоимений.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:57:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: всеобъемлющее «всё», подчинение «под ноги», а также исключение Того, кто подчинил всё Христу, сохранены. Однако «это не относится к Тому» может означать, что высказывание неприменимо к Нему, а не то, что Он исключён из состава «всего»; греческое ἐκτός выражает именно исключение.'
  naturalness: «Когда же сказано» — естественная современная литературная формулировка для отсылки к библейскому изречению. «Ведь» допустимо для γάρ. Формулировка «не входит в это “всё”» ясна и естественна, не размывая логический вывод.
  terminology: «Подчинил / подчинено» удачно передаёт ὑποτάσσω. Образ «под ноги Его» сохранён. Заглавные местоимения последовательно отражают референтов в ближайшем контексте, не добавляя в текст имён или догматических определений.
  issues:
  - severity: medium
    issue: Неоднозначное выражение «это не относится к Тому»
    rationale: Оно может быть понято как неприменимость утверждения к Тому, кто подчинил всё, тогда как ἐκτὸς τοῦ ὑποτάξαντος означает, что Он не включён среди подчинённых «всех вещей». Следует прямо передать исключение из объёма «всё».
  - severity: low
    issue: Несогласованное оформление личных местоимений в цитате
    rationale: В «под ноги его» строчная форма контрастирует с «Он» и «Ему». При принятом в данном тексте почтительном написании местоимений следует последовательно написать «Его».
  revised_text: Ведь «Он подчинил всё под ноги Его». Когда же сказано[a], что всё подчинено, ясно, что Тот, кто подчинил Ему всё, не входит в это «всё».
  revised_footnotes:
