base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: ru
  text: 'Так и воскресение мёртвых: сеется в тлении, воскрешается в нетлении.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сеется подверженным гибели, воскрешается неподверженным гибели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Так и
  rationale: Кратко и естественно передаёт сравнительно-выводную связь с образом посеянного семени в предыдущих стихах.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: воскресение мёртвых
  rationale: Точно передаёт греческую конструкцию и сохраняет обычное для современного русского библейского языка выражение.
- source_word: σπείρεται
  choice: сеется
  rationale: Сохраняет настоящее время, страдательное значение и сельскохозяйственный образ; безличная форма позволяет не вставлять отсутствующее в греческом тексте слово «тело».
- source_word: ἐν φθορᾷ
  choice: в тлении
  rationale: Передаёт состояние подверженности разрушению и сохраняет выразительную антитезу с «нетлением»; возможный более разъясняющий вариант вынесен в сноску.
- source_word: ἐγείρεται
  choice: восстаёт
  rationale: Естественно обозначает воскресение и сохраняет параллелизм с «сеется», не добавляя явно названного деятеля.
- source_word: ἐν ἀφθαρσίᾳ
  choice: в нетлении
  rationale: Сохраняет прямое лексическое противопоставление φθορά и ἀφθαρσία и означает неподверженность гибели и разрушению.
theological_decisions:
- issue: Телесность и субъект воскресения в метафоре сеяния
  choice: Сохранить метафору и не добавлять в основной текст слово «тело».
  alternative: «Тело погребается тленным, а воскресает нетленным».
  rationale: 'Контекст говорит о теле, однако греческий стих выражается эллиптически: «сеется… восстаёт». Предложенный перевод сохраняет телесный контекст, преемственность и преображение, не превращая пояснение в текст.'
- issue: Смысл контраста φθορά / ἀφθαρσία
  choice: «тление / нетление» как состояние подверженности и неподверженности разрушению.
  alternative: «бренность / непреходящесть» или «подверженность гибели / неподверженность гибели».
  rationale: Контраст относится прежде всего к смертности и разрушимости тела, а не только к нравственной испорченности; формальная пара сохраняет богословскую напряжённость образа.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. «Тление / нетление» несколько традиционны, но понятны и точно сохраняют антитезу; сноска раскрывает их смысл обычными словами.
