  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: ru
  text: 'Не обманывайтесь: дурное общение портит добрые нравы[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дурные разговоры портят добрые нравы». Греческое слово может означать как общение или связи с людьми, так и разговоры; в данном контексте более широкий смысл «общение» представляется предпочтительным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Не обманывайтесь
  rationale: Передаёт форму запрета, не уточняя без необходимости, исходит ли обман от самого человека или от других; выражение естественно звучит как краткое предостережение.
- source_word: φθείρουσιν
  choice: портит
  rationale: Глагол обозначает порчу и постепенное ухудшение. В сочетании с «нравами» слово «портит» сохраняет ёмкость и пословичный характер фразы, не усиливая смысл до полного уничтожения.
- source_word: ἤθη
  choice: нравы
  rationale: Здесь речь идёт о нравственных установках и привычках, а не только о внешних манерах. «Нравы» точно передаёт этический смысл и естественно сочетается с определением «добрые».
- source_word: χρηστὰ
  choice: добрые
  rationale: Простое этическое определение, соответствующее χρηστός и традиционно естественное в сочетании «добрые нравы».
- source_word: ὁμιλίαι
  choice: общение
  rationale: Греческое слово может обозначать как общение и близкое соприкосновение с людьми, так и разговоры. Русское «общение» естественно охватывает основной широкий смысл и отчасти сохраняет лексическую неоднозначность.
- source_word: κακαί
  choice: дурное
  rationale: «Дурное» ясно указывает на нравственно вредный характер общения и соответствует возвышенному, но современному регистру; «злое» звучало бы чрезмерно сильно.
theological_decisions: []
translation_notes:
  register: Краткая, афористичная формулировка на современном литературном русском языке. Сочетание «добрые нравы» сохраняет этический смысл оригинала и его достоинство, не становясь архаичным; единственное число «дурное общение» выбрано ради естественности русского выражения, хотя в греческом употреблено множественное число.
