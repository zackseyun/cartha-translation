  text: ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/018.yaml
  text: Then those also who have fallen asleep in Messiah have perished[a][b].
translation:
  language: ru
  text: Значит, и усопшие в Мессии погибли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе». «Усопшие» — образное обозначение умерших.'
    reason: alternative_reading_and_lexical_clarification
lexical_decisions:
- source_word: ἄρα
  choice: Значит
  rationale: Передаёт вывод из предшествующего условного рассуждения Павла и естественно звучит по-русски.
- source_word: καὶ
  choice: и
  rationale: 'Сохраняет присоединительное значение: к уже названным последствиям добавляется участь умерших верующих.'
- source_word: οἱ κοιμηθέντες
  choice: усопшие
  rationale: Сохраняет эвфемистический образ сна как обозначение смерти, но выражает его естественным и достойным современным русским словом.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Передаёт Χριστός как титул и сохраняет характерную для Павла формулу единения с Мессией.
- source_word: ἀπώλοντο
  choice: погибли
  rationale: Точно передаёт аорист ἀπόλλυμι и его сильный смысл окончательной утраты в рамках рассматриваемого Павлом предположения.
theological_decisions:
- issue: Передача Χριστῷ в формуле единения у Павла
  choice: в Мессии
  alternative: во Христе
  rationale: «Мессия» передаёт значение титула Χριστός, не устраняя богословски значимую формулу пребывания «в» нём; привычный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, весомым синтаксисом. Слово «усопшие» несколько возвышенно, но широко понятно и уместно в библейском контексте; оно сохраняет метафору сна без неестественной кальки «уснувшие».
