  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: ru
  text: в один миг, в мгновение ока, при звуке последней трубы. Ведь труба прозвучит, и мёртвые будут воскрешены нетленными, и мы изменимся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: в один миг
  rationale: Ἄτομος буквально указывает на неделимость, а в данном временном обороте — на предельно краткий момент. «В один миг» естественно передаёт внезапность и краткость без неуместной технической буквальности.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: в мгновение ока
  rationale: Устойчивое современное русское выражение точно передаёт образ стремительного движения глаза и крайнюю быстроту события.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: при звуке последней трубы
  rationale: Предлог ἐν здесь имеет временное значение. Добавление слова «звуке» делает фразу естественной по-русски, сохраняя образ последней трубы и не связывая его с определённой эсхатологической схемой.
- source_word: σαλπίσει
  choice: труба прозвучит
  rationale: Глагол означает трубить или издавать трубный звук; названная непосредственно перед этим труба естественно служит подлежащим в русском переводе.
- source_word: οἱ νεκροὶ
  choice: мёртвые
  rationale: Субстантивированное прилагательное обозначает умерших людей как совокупность; «мёртвые» — прямой и общепонятный русский эквивалент.
- source_word: ἐγερθήσονται
  choice: будут воскрешены
  rationale: Будущее страдательного залога сохранено; в контексте воскресения глагол ἐγείρω передан однозначным и естественным русским выражением.
- source_word: ἄφθαρτοι
  choice: нетленными
  rationale: 'Слово обозначает неподверженность тлению и разрушению. Творительный падеж передаёт предикативное значение: воскрешённые окажутся нетленными.'
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное греческое местоимение сохранено, включая его смысловое сопоставление с мёртвыми, без уточнения, которого нет в самом стихе.
- source_word: ἀλλαγησόμεθα
  choice: изменимся
  rationale: Будущее страдательное значение ἀλλάσσω в русском естественно выражается возвратной формой «изменимся»; она сохраняет прямой смысл, не усиливая его до более толковательного «преобразимся».
theological_decisions:
- issue: Эсхатологический смысл последней трубы
  choice: при звуке последней трубы
  alternative: при последней трубе
  rationale: Перевод прямо сохраняет определение «последней», но не связывает трубу с какой-либо разработанной системой событий конца времён. Слово «звуке» лишь делает временной оборот естественным по-русски.
- issue: Кого обозначает «мы»
  choice: и мы изменимся
  alternative: и те из нас, кто останется в живых, изменятся
  rationale: Первое лицо множественного числа сохранено без поясняющей вставки. Контекст допускает сопоставление с мёртвыми, однако сам стих не разворачивает значение «мы» в отдельное определение.
- issue: Характер воскресшего состояния
  choice: будут воскрешены нетленными
  alternative: воскреснут нетленными
  rationale: Страдательная конструкция источника сохранена, не уточняя прямо действующего лица; «нетленными» передаёт состояние воскрешённых, не добавляя иных богословских характеристик.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но общепонятной библейской образностью. Синтаксический ритм исходного перечисления сохранён. Союзы «и… и…» оставлены без превращения второго в явно противительный, чтобы не усиливать смысловое противопоставление сверх греческого текста.
