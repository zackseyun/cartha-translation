source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: ru
  text: Но Бог даёт ему тело, какое пожелал, и каждому из семян — своё тело.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: даёт ему
  rationale: Настоящее время передано естественным русским «даёт»; местоимение в дательном падеже относится к семени из предыдущего контекста.
- source_word: σῶμα
  choice: тело
  rationale: Стандартное соответствие, сохраняющее важную для всей главы связь с темой телесного воскресения.
- source_word: καθὼς ἠθέλησεν
  choice: какое пожелал
  rationale: В сочетании со словом «тело» это естественно передаёт смысл «такое, как Он пожелал», сохраняя акцент на Божьей воле и аористе исходного текста.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: каждому из семян
  rationale: Близко передаёт дистрибутивное ἑκάστῳ с партитивным родительным и не добавляет отсутствующего в греческом понятия «вид».
- source_word: ἴδιον σῶμα
  choice: своё тело
  rationale: Естественно выражает принадлежность особого тела каждому семени и сохраняет индивидуализирующую силу ἴδιον.
theological_decisions:
- issue: Божественное действие и воля в сравнении семени и тела
  choice: Бог даёт каждому семени тело согласно Своему желанию.
  alternative: 'Явно уточнить: «каждому виду семян — особое тело».'
  rationale: Перевод сохраняет Божью инициативу и волю, но не вводит понятие вида или рода, которого в греческом тексте прямо нет.
translation_notes:
  register: Современный литературный русский язык; синтаксис с тире во второй части делает распределительное значение ясным и звучит естественно. Местоимение «ему» сохраняет связь с единичным семенем из предыдущего стиха. Заглавная буква в местоимении о Боге не используется в основном тексте как необязательная конфессионально-издательская традиция.
