lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Сохраняет функцию торжественного привлечения внимания и при этом естественно звучит в современном литературном русском языке.
- source_word: μυστήριον
  choice: тайну
  rationale: В данном контексте речь идёт о прежде сокрытой, а теперь возвещаемой Божьей истине, а не просто о чём-то загадочном. «Тайна» точно и естественно передаёт этот смысл.
- source_word: ὑμῖν λέγω
  choice: я открываю вам
  rationale: С учётом слова «тайна» это идиоматично передаёт сообщение прежде сокрытой истины; прямое «говорю вам» возможно, но по-русски здесь звучит менее естественно.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: не все мы уснём
  rationale: Сохраняет греческое отрицание «не все» и метафору сна как смерти в свете будущего воскресения.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: но все преобразимся
  rationale: «Преобразимся» естественно передаёт эсхатологическое изменение, не уточняя сверх текста его природу; «но» сохраняет контраст между участью не всех и участью всех.
theological_decisions:
- issue: Значение сна в контексте воскресения
  choice: Сохранена метафора «уснём» как обозначение физической смерти перед воскресением.
  alternative: 'Передать толковательно: «умрём».'
  rationale: Метафора принадлежит самому тексту и связывает смерть с надеждой воскресения; её сохранение не утверждает отдельного учения о состоянии души.
- issue: Текстологический вариант, меняющий соотношение сна и преображения
  choice: 'Основной текст следует SBLGNT: «не все мы уснём, но все преобразимся».'
  alternative: 'Засвидетельствован вариант со смыслом: «все мы уснём, но не все преобразимся».'
  rationale: Предоставленный греческий текст переведён непосредственно, а значимый альтернативный вариант отмечен в сноске без его принятия в основной текст.
