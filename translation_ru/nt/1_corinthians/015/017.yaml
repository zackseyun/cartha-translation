id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: ru
  text: 'Если же Мессия не был воскрешён[a], то вера ваша тщетна[b]: вы всё ещё в своих грехах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос не был воскрешён»; также возможно: «Мессия не воскрес».'
    reason: Сохраняет традиционную передачу титула и возможную возвратную передачу формы ἐγήγερται.
  - marker: b
    text: 'Или: «бесплодна», «напрасна».'
    reason: 'Показывает смысловой диапазон ματαία: вера была бы безрезультатной и не достигала бы цели.'
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт титульное значение Χριστός в богословском рассуждении Павла, не сводя его к традиционной форме имени.
- source_word: ἐγήγερται
  choice: был воскрешён
  rationale: Пассивная форма сохраняет подразумеваемое, но не названное прямо действующее лицо; результативность греческого перфекта в контексте поддерживается дальнейшим описанием нынешнего состояния.
- source_word: ματαία
  choice: тщетна
  rationale: Выражает бесплодность и безрезультатность веры при условии отрицания воскресения; слово понятно в современном литературном русском и сохраняет достоинство стиля.
- source_word: πίστις
  choice: вера
  rationale: В контексте речь идёт о вере коринфян, а не преимущественно об их верности.
- source_word: ἔτι
  choice: всё ещё
  rationale: Естественно передаёт продолжающееся состояние, которое, согласно условному рассуждению Павла, не изменилось.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: в своих грехах
  rationale: Сохраняет образ пребывания в грехах без добавления в текст конкретного толкования об их вине или власти.
- source_word: δὲ
  choice: же
  rationale: После условного «если» частица естественно обозначает контраст с предшествующим рассуждением.
theological_decisions:
- issue: Формулировка воскресения и действующее лицо
  choice: не был воскрешён
  alternative: не воскрес
  rationale: Пассивная формулировка ближе к ἐγήγερται и сохраняет подразумеваемое божественное действие, не называя Бога там, где греческий текст его прямо не называет.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном богословском утверждении слово сохраняет явный смысл титула Помазанника; традиционный вариант дан в сноске как допустимая передача.
- issue: Смысл пребывания «в грехах»
  choice: в своих грехах
  alternative: под властью своих грехов
  rationale: Буквально-естественная формулировка сохраняет смысловую ёмкость выражения и не ограничивает его только властью, виной или непрощённостью грехов.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Порядок «вера ваша» слегка возвышен, но естественен и подчёркивает адресатов; двоеточие ясно связывает тщетность веры с продолжающимся пребыванием в грехах.
