base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: ru
  text: и что он был погребён, и что он был воскрешён на третий день, согласно Писаниям[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскрес». Греческая форма перфекта может подчёркивать, что совершившееся воскресение сохраняет своё значение и результат в настоящем.'
    reason: Передача аспектуального оттенка и возможная естественная русская альтернатива.
lexical_decisions:
- source_word: ἐτάφη
  choice: был погребён
  rationale: Аорист страдательного залога от θάπτω прямо обозначает погребение; русский страдательный оборот естественен и не добавляет отсутствующих в тексте подробностей.
- source_word: ἐγήγερται
  choice: был воскрешён
  rationale: Форма перфекта страдательного залога от ἐγείρω указывает на совершившееся воскресение с сохраняющимся результатом. В основном тексте сохранён страдательный залог, а аспектуальный оттенок пояснён в сноске.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: на третий день
  rationale: Естественная современная русская передача дательного времени без добавления слова «после», которого нет в греческом тексте.
- source_word: κατὰ τὰς γραφάς
  choice: согласно Писаниям
  rationale: Передаёт соответствие свидетельству священных Писаний и сохраняет формульный характер выражения Павла.
- source_word: ὅτι
  choice: что
  rationale: Повтор союза сохраняет последовательную, исповедальную структуру исходного текста.
- source_word: καὶ
  choice: и
  rationale: Повторяющийся соединительный союз сохранён для передачи ритма формулы.
theological_decisions:
- issue: Аспект и залог глагола воскресения
  choice: был воскрешён
  alternative: воскрес; воскрешён и остаётся жив
  rationale: Выбранная форма сохраняет грамматический страдательный залог и не вводит прямо не выраженное дополнение. Поскольку русский прошедший вид не вполне передаёт результативное значение греческого перфекта, оно отмечено в сноске.
- issue: Значение слова γραφαί
  choice: Писания
  alternative: священные Писания; иудейские Писания
  rationale: «Писания» обозначает признанный корпус священных текстов, не добавляя уточнений, которых нет в греческом выражении.
translation_notes:
  register: Современный литературный русский с сохранением формульного повтора «и что». Местоимение «он» дано со строчной буквы как нейтральная орфографическая передача без конфессионально обусловленной капитализации.
