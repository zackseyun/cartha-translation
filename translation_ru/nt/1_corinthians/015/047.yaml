lexical_decisions:
- source_word: πρῶτος
  choice: первый
  rationale: Порядковое прилагательное обозначает первого участника параллели Адам — Христос; «первый» точно и естественно передаёт смысл.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В обеих частях речь идёт о конкретных представителях человечества — Адаме и Христе. Повтор слова сохраняет намеренный параллелизм Павла.
- source_word: ἐκ γῆς
  choice: из земли
  rationale: Оборот указывает на происхождение и сохраняет отсылку к сотворению Адама из земли.
- source_word: χοϊκός
  choice: из праха
  rationale: Прилагательное означает «состоящий из праха, праховый» и перекликается с повествованием о сотворении Адама. Оборот «из праха» понятен современному читателю и не смешивается с переносными значениями слова «земной».
- source_word: δεύτερος
  choice: второй
  rationale: Сохраняет прямое противопоставление «первый — второй».
- source_word: ἐξ οὐρανοῦ
  choice: с неба
  rationale: Оборот обозначает небесное происхождение; «с неба» естественно звучит по-русски и сохраняет богословский смысл контекста.
theological_decisions:
- issue: Христологический смысл выражения «второй человек»
  choice: Сохранено «второй человек» без добавления имени Христа.
  alternative: «Второй человек, Христос, — с неба».
  rationale: Контекст отождествляет второго человека с Христом, однако в самом стихе имя не названо. Перевод сохраняет формулировку источника и типологическую параллель, не добавляя толкования в основной текст.
- issue: Временное значение именных предложений
  choice: Использованы естественные для русского языка именные конструкции с тире, без добавления глагола-связки.
  alternative: «Первый человек был из земли… второй человек есть с неба».
  rationale: В греческом обе части не имеют выраженной связки. Русская именная конструкция естественно передаёт утверждение и не навязывает временну́ю форму там, где источник оставляет её невыраженной.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и симметричная конструкция передаёт параллелизм оригинала. Архаичное «перстный» не используется как малопонятное современному читателю.
