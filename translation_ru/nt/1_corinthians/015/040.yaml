  source_fidelity: 'Текст точно передаёт обе части греческой конструкции: повтор σώματα сохранён в первой части, противопоставление ἀλλά передано союзом «но», а парность ἑτέρα ... ἑτέρα — формулой «одна ... другая». Эллипсис «у небесных / у земных» во второй части прозрачно отсылает к ранее названным телам и не сужает спорный референт.'
  naturalness: Формулировка естественна для современного литературного русского и сохраняет сжатый, возвышенно-рассудительный регистр Павла. Тире перед «у земных» уместно оформляет парное противопоставление.
  terminology: «Тела», «небесные», «земные» и «слава» являются точными и устойчивыми соответствиями σώματα, ἐπουράνια, ἐπίγεια и δόξα. «Слава» оправданно сохраняет как смысл великолепия/сияния в непосредственном контексте, так и библейскую терминологическую связь. Сноска не меняет смысла и корректно объясняет эллипсис и качественный оттенок ἑτέρα.
