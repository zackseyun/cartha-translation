  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: ru
  text: Есть и небесные тела, и земные тела; но одна слава у небесных, а другая — у земных.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но у небесных тел — один вид славы, а у земных тел — другой».'
    reason: Уточняет подразумеваемое существительное и возможный качественный оттенок конструкции ἑτέρα ... ἑτέρα, не заменяя компактную формулировку основного текста.
lexical_decisions:
- source_word: σώματα
  choice: тела
  rationale: Прямое соответствие греческому слову; сохраняет широкий круг возможных значений, не сводя речь ни только к светилам, ни к воскресшим телам.
- source_word: ἐπουράνια
  choice: небесные
  rationale: Естественное современное соответствие со значением «относящиеся к небу»; не сужает смысл до астрономического.
- source_word: ἐπίγεια
  choice: земные
  rationale: Образует ясную и естественную пару со словом «небесные» и передаёт значение «находящиеся на земле, относящиеся к земле».
- source_word: ἀλλὰ
  choice: но
  rationale: Кратко и точно передаёт противопоставление.
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: одна ... другая
  rationale: Передаёт различие двух видов славы и естественно воспроизводит парную греческую конструкцию.
- source_word: δόξα
  choice: слава
  rationale: Сохраняет ключевую лексику Павла и допускает здесь оттенки великолепия, сияния и отличительного достоинства, не ограничивая смысл одним из них.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: у небесных ... у земных
  rationale: 'Сохраняет эллипсис оригинала: подразумеваемое слово «тел» ясно из первой части стиха, а русская конструкция остаётся компактной.'
theological_decisions:
- issue: К чему относятся выражения «небесные тела» и «земные тела»
  choice: Передать обобщённо, не уточняя, идёт ли речь исключительно о небесных светилах, существах или формах телесного существования.
  alternative: «небесные светила и земные тела» либо «небесные существа и земные существа»
  rationale: В греческом прямо сказано σώματα («тела»). Более узкий перевод преждевременно разрешил бы неоднозначность Павлова рассуждения и мог бы привнести отсутствующее в тексте толкование.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и торжественный. Повтор «тела» в первой части сохранён вслед за греческим оригиналом, а во второй части использован естественный для русского эллипсис.
