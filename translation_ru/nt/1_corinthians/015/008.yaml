  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: ru
  text: А после всех Он явился и мне — словно выкидышу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словно выкидышу». Греческое слово может обозначать выкидыш или плод, изгнанный при выкидыше; возможно также представление о ненормальном или несвоевременном рождении. Павел употребляет резкую уничижительную метафору.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: А после всех
  rationale: Наречное ἔσχατον с родительным πάντων обозначает последнее по времени явление в перечисленном ряду; «после всех» естественно передаёт эту последовательность. δέ здесь продолжает повествование.
- source_word: ὡσπερεὶ
  choice: словно
  rationale: 'Передаёт приблизительно-сравнительную силу частицы: Павел вводит резкое образное самоописание, а не даёт буквальное определение.'
- source_word: τῷ ἐκτρώματι
  choice: недоноску
  rationale: ἔκτρωμα буквально может обозначать выкидыш или преждевременно рождённого, нежизнеспособного младенца. «Недоносок» сохраняет ненормальность рождения и уничижительную резкость метафоры, оставаясь понятным в современном русском; буквальные оттенки отмечены в сноске.
- source_word: ὤφθη
  choice: Он явился
  rationale: В контексте явлений воскресшего Христа пассивная форма ὁράω естественно передаётся как «явился»; подлежащее восстанавливается из контекста.
- source_word: κἀμοί
  choice: и мне
  rationale: Красис καί + ἐμοί имеет присоединительное значение и включает Павла в последовательность свидетелей.
theological_decisions:
- issue: Смысл самоописания Павла словом ἐκτρώματι
  choice: Сохранить резкую метафору в основном тексте как «словно недоноску», а её буквальный диапазон пояснить в сноске.
  alternative: «словно выкидышу», «словно преждевременно рождённому», «словно извергу»
  rationale: 'Точный аспект метафоры остаётся спорным: она может подчёркивать несвоевременность, ненормальность или униженность положения Павла. Перевод не должен превращать этот образ в определённое учение о его апостольстве.'
translation_notes:
  register: Современный литературный русский с достоинством апостольского свидетельства; резкость исходной метафоры сохранена без архаизма «изверг» и без излишне клинической формулировки.
