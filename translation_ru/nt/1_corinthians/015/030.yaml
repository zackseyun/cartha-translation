lexical_decisions:
- source_word: τί
  choice: Зачем
  rationale: 'В риторическом вопросе τί указывает на смысл или основание действия; «зачем» естественно передаёт аргумент Павла в контексте: если воскресения нет, какой смысл подвергаться опасности?'
- source_word: καὶ
  choice: и
  rationale: Здесь καὶ присоединяет Павла и его соработников к ранее упомянутым примерам; русское «и мы» естественно передаёт добавочное значение.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение сохранено; в сочетании «и мы» передаётся его добавочно-сопоставительный оттенок.
- source_word: κινδυνεύομεν
  choice: подвергаемся опасности
  rationale: Глагол означает находиться в опасности, подвергаться риску. Выбранный вариант точен и не добавляет более узкого смысла «рискуем жизнью».
- source_word: πᾶσαν ὥραν
  choice: каждый час
  rationale: Выражение обозначает постоянную подверженность опасности; буквальное «каждый час» ясно и естественно по-русски.
theological_decisions:
- issue: Риторическая сила вопроса в рассуждении Павла о воскресении
  choice: Вопрос передан как риторический и подчёркивает бессмысленность апостольской подверженности опасности, если мёртвые не воскресают.
  alternative: 'Передать τί буквально как «что»: «Что же и мы подвергаемся опасности каждый час?»'
  rationale: Греческий синтаксис и ближайший контекст поддерживают вопрос о смысле или основании действий, а не запрос о предмете; перевод сохраняет аргументативное напряжение, не добавляя отдельного доктринального вывода.
translation_notes:
  register: Современный литературный русский язык; формулировка лаконичная, риторическая и понятная широкому кругу читателей. «Подвергаемся опасности» сохраняет достоинство стиля и смысловую широту греческого глагола.
