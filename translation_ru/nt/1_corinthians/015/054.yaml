  source_fidelity: 'Текст точно передаёт синтаксис и ключевые образы греческого оригинала: временное «когда же», две параллельные конструкции «тленное — нетление / смертное — бессмертие», метафору облачения и итоговое наступление написанного изречения. «Сбудется» является естественной передачей γενήσεται в данном контексте и не навязывает специальную доктрину исполнения. «Поглощена смерть победой» сохраняет пассивный образ Κατεπόθη и пророчески совершенный характер цитаты; подразумеваемый деятель не добавлен.'
  naturalness: Перевод звучит как современный литературный русский с уместной библейской торжественностью. Субстантивированные «тленное» и «смертное» понятны в контексте и хорошо сохраняют ритмический параллелизм. «Облечётся» несколько возвышенно, но оправданно метафорой одежды и регистром. «Написанное слово» допустимо и ясно в данном контексте.
