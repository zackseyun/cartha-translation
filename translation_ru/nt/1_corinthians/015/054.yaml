reference: 1 Corinthians 15:54
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: ru
  text: 'Когда же это тленное облечётся в нетление, и это смертное облечётся в бессмертие, тогда сбудется написанное слово: «Поглощена смерть победой».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ис. 25:8; формулировка отражает греческий текст цитаты, которой пользуется Павел.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: тленное
  rationale: Субстантивированное прилагательное обозначает нынешнее тело как подверженное тлению; «тленное» сохраняет краткость и образную параллель с «нетлением».
- source_word: ἐνδύσηται
  choice: облечётся
  rationale: Возвратная форма естественно передаёт средний залог и сохраняет метафору одежды.
- source_word: ἀφθαρσίαν
  choice: нетление
  rationale: Точно соответствует противопоставлению φθαρτόν и остаётся понятным в современном литературном русском.
- source_word: θνητὸν
  choice: смертное
  rationale: Краткое субстантивированное прилагательное передаёт то, что подвержено смерти, и образует ясную пару с «бессмертием».
- source_word: ἀθανασίαν
  choice: бессмертие
  rationale: Прямой и общеупотребительный эквивалент существительного со значением неподвластности смерти.
- source_word: γενήσεται
  choice: сбудется
  rationale: В сочетании с написанным изречением естественно означает, что оно станет действительностью; при этом не вводится специальная формула «исполнится».
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: написанное слово
  rationale: Сохраняет λόγος как «слово» и ясно указывает на письменное пророческое изречение.
- source_word: Κατεπόθη
  choice: поглощена
  rationale: Пассивная форма сохраняет образ и не называет подразумеваемого деятеля; прошедшее время соответствует аористу пророческого провозглашения.
- source_word: εἰς νῖκος
  choice: победой
  rationale: Творительный падеж даёт естественное русское выражение результата полной победы над смертью, не превращая оборот в указание направления.
theological_decisions:
- issue: Передача γενήσεται при введении цитаты Писания
  choice: «сбудется»
  alternative: «исполнится»; «произойдёт»
  rationale: «Сбудется» естественно передаёт наступление написанного события и не усиливает глагол до специальной формулы исполнения пророчества.
- issue: Временная форма цитаты Κατεπόθη ὁ θάνατος
  choice: «Поглощена смерть»
  alternative: «Смерть будет поглощена»; «Смерть поглощается»
  rationale: Прошедшая форма сохраняет форму греческой цитаты и её пророческое представление будущей победы как уже совершившейся в тот момент.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены параллелизм «тленное — нетление / смертное — бессмертие» и метафора облачения; архаичное «облечётся» здесь оправдано устойчивостью и точностью образа.
