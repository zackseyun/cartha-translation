  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: ru
  text: Но теперь Мессия[a] воскрешён из мёртвых — первый плод[b] тех, кто уснул[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός означает «Помазанник», то есть «Мессия».'
    reason: alternative_reading
  - marker: b
    text: «Первый плод» — первая часть урожая, посвящавшаяся Богу; этот образ подразумевает первенство и служит залогом всей будущей жатвы.
    reason: cultural_note
  - marker: c
    text: «Уснул» — образное обозначение смерти, особенно уместное здесь ввиду надежды на воскресение.
    reason: lexical_note
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Но теперь
  rationale: Передаёт резкий переход от гипотетического отрицания воскресения в предыдущих стихах к утверждению действительности.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт значение греческого титула Χριστός; привычный вариант «Христос» дан в сноске, поскольку в данном контексте слово может восприниматься и как закрепившееся именование.
- source_word: ἐγήγερται
  choice: воскрешён
  rationale: Краткое страдательное причастие сохраняет пассивную форму греческого перфекта и представляет воскресение как совершившийся факт с сохраняющимся результатом, не называя прямо действующее лицо.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Естественное русское выражение в контексте воскресения, сохраняющее множественное значение греческого νεκρῶν.
- source_word: ἀπαρχὴ
  choice: первый плод
  rationale: Сохраняет образ начальной части урожая и звучит понятнее для современного читателя, чем архаичное «начаток»; культовый и залоговый смысл пояснён в сноске.
- source_word: τῶν κεκοιμημένων
  choice: среди тех, кто уснул
  rationale: Сохраняет метафору сна, которой в контексте воскресения обозначены умершие, и естественно связывает эту группу с образом первого плода.
theological_decisions:
- issue: Форма и подразумеваемое действующее лицо воскресения
  choice: воскрешён
  alternative: воскрес
  rationale: Пассивная форма исходного текста сохранена, чтобы не скрывать подразумеваемое действие Бога и одновременно не добавлять прямо не названного деятеля.
- issue: Передача христологического титула
  choice: Мессия
  alternative: Христос
  rationale: Основной текст переводит значение титула Χριστός, а традиционная транслитерационная форма приведена как допустимый вариант.
- issue: Связь воскресения Мессии с воскресением умерших
  choice: первый плод среди тех, кто уснул
  alternative: начаток умерших
  rationale: Сохранён образ первого плода урожая, указывающий на начало и предвосхищение последующего воскресения, без превращения этого подразумеваемого смысла в прямое утверждение основного текста.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис краток и энергичен; тире передаёт пояснительно-итоговую связь. Метафоры урожая и сна сохранены, но непонятные современному читателю культурные оттенки вынесены в сноски.
