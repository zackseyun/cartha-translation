  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: ru
  text: Но если воскресения мёртвых нет, то и Мессия[a] не был воскрешён[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческий титул Χριστός можно передать как «Мессия» или «Христос»; здесь выбран вариант, раскрывающий значение титула.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не воскрес». В греческом стоит страдательный перфект: «не был воскрешён»; эта форма подразумевает совершившееся действие, а действующее лицо прямо не названо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: Условный союз εἰ передан как «если», а δέ — как мягкий противительный переход «но», продолжающий рассуждение Павла.
- source_word: ἀνάστασις νεκρῶν
  choice: воскресения мёртвых
  rationale: Сохраняется обычное для Павла обозначение воскресения умерших как целой категории; родительный падеж νεκρῶν естественно передаётся словом «мёртвых».
- source_word: οὐκ ἔστιν
  choice: нет
  rationale: Краткая и естественная русская передача отрицания существования или реальности воскресения.
- source_word: οὐδὲ
  choice: то и … не
  rationale: Конструкция ясно выражает логическое следствие из условной посылки; русское «то и» передаёт силу οὐδέ без избыточного усиления.
- source_word: Χριστός
  choice: Мессия
  rationale: Здесь слово сохраняет смысл титула Помазанника, поэтому переведено, а не передано традиционной формой «Христос».
- source_word: ἐγήγερται
  choice: не был воскрешён
  rationale: Передача сохраняет страдательный залог греческого перфекта и результат совершившегося действия, не называя прямо действующее лицо.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном аргументе слово можно понимать как титул; «Мессия» раскрывает его значение, тогда как традиционная форма «Христос» отмечена в сноске как допустимая.
- issue: Залог ἐγήγερται
  choice: не был воскрешён
  alternative: не воскрес
  rationale: Страдательная форма сохраняет подразумеваемое действие над Мессией, но не добавляет отсутствующего в тексте указания на Бога как действующее лицо.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, логически прозрачная и сохраняет аргументативный переход, титульный смысл Χριστός и страдательный залог ἐγήγερται.
