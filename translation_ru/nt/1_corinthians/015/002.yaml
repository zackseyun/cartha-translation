  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: ru
  text: через которое вы и спасаетесь[a], если твёрдо держитесь возвещённой мною вам благой вести[b], — если только вы не напрасно уверовали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через которое вы и спасены». Греческое настоящее время может передавать продолжающийся процесс («спасаетесь») или более общее настоящее утверждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если держитесь, каким словом я благовествовал вам». Выражение «каким словом» может указывать на содержание возвещённого либо на способ его возвещения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: через которое
  rationale: διά с родительным падежом выражает средство; относительное местоимение отсылает к Благой вести из стиха 1.
- source_word: σῴζεσθε
  choice: вы и спасаетесь
  rationale: Настоящее время пассивного залога допускает процессуальное понимание; русское настоящее время естественно сохраняет его, не исключая общего утверждения о спасении.
- source_word: τίνι λόγῳ
  choice: того слова
  rationale: Сохраняет прямое соответствие λόγος и в сочетании с «держитесь» передаёт содержание возвещённой вести; необычность греческой конструкции отмечена в сноске.
- source_word: εὐηγγελισάμην
  choice: возвестил вам как Благую весть
  rationale: Передаёт значение глагола как объявления благой вести, а не только публичной проповеди.
- source_word: κατέχετε
  choice: твёрдо держитесь
  rationale: Передаёт продолжительное удержание и верность полученному слову.
- source_word: ἐκτὸς εἰ μὴ
  choice: если только не
  rationale: Естественно вводит исключение и сохраняет оттенок оговорки.
- source_word: εἰκῇ
  choice: напрасно
  rationale: Передаёт значение тщетности или отсутствия результата в данном контексте.
- source_word: ἐπιστεύσατε
  choice: уверовали
  rationale: Аорист указывает на совершившееся принятие веры; «уверовали» естественно обозначает вступление в веру.
theological_decisions:
- issue: Видовой оттенок σῴζεσθε
  choice: «спасаетесь» — настоящее время с возможным процессуальным значением
  alternative: «спасены» или явно процессуальное «проходите спасение»
  rationale: Форма настоящего времени сохранена без превращения её ни в исключительно завершённое, ни в доктринально истолкованное поэтапное спасение.
- issue: Условие εἰ κατέχετε
  choice: сохранено прямое «если твёрдо держитесь»
  alternative: объяснить условие как доказательство подлинной веры либо как риторически предполагаемый факт
  rationale: Греческое условие оставлено без конфессионального истолкования вопроса о стойкости и спасении.
- issue: Оговорка ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε
  choice: «если только вы не напрасно уверовали»
  alternative: «разве что вы поверили без достаточного основания»
  rationale: 'Сохранена неоднозначность εἰκῇ: речь может идти о тщетности веры либо о вере без основания; контекст главы особенно поддерживает смысл тщетности.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Благая весть» ясно передаёт евангельскую семантику, а «уверовали» уместно сохраняет традиционную богословскую точность. Все сноски отмечены в основном тексте.
