lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Ведь поскольку
  rationale: «Поскольку» передаёт причинно-обосновывающее значение ἐπειδή, а «ведь» — пояснительную связь γάρ с предыдущим рассуждением.
- source_word: δι’ ἀνθρώπου
  choice: через человека
  rationale: διά с родительным падежом указывает на посредничество или действующее лицо. Одинаковый перевод в обеих частях сохраняет намеренный параллелизм Павла и неопределённую форму единственного числа.
- source_word: θάνατος
  choice: смерть пришла
  rationale: В греческом предложении глагол отсутствует; «пришла» естественно восполняет его по-русски и выражает появление смерти, не добавляя её причины сверх сказанного в тексте.
- source_word: καὶ
  choice: то и
  rationale: Соотносительная конструкция «поскольку… то и…» ясно передаёт соответствие между двумя параллельными частями.
- source_word: ἀνάστασις νεκρῶν
  choice: воскресение мёртвых
  rationale: Прямой и привычный перевод выражения, сохраняющий конкретное утверждение о воскресении умерших, а не о неопределённой загробной жизни.
theological_decisions:
- issue: Представительное противопоставление Адама и Христа
  choice: В обеих частях оставить «через человека», не называя этих людей в основном тексте.
  alternative: «через одного человека» или «через Адама… через Христа»
  rationale: Контекст раскрывает личности двух людей, но сам стих формулирует принцип без имён и без числительного «один». Такой перевод сохраняет лаконичную симметрию оригинала.
- issue: Характер воскресения
  choice: «воскресение мёртвых»
  alternative: «духовное воскресение» или «жизнь после смерти»
  rationale: Контекст 1 Коринфянам 15 говорит о действительном воскресении умерших; перевод не должен ослаблять это утверждение или разрешать богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и легко понятная формулировка. Повтор «пришла через человека» намеренно сохраняет риторический параллелизм оригинала.
