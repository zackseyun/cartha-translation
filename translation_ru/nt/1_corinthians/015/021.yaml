  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: ru
  text: Ибо, поскольку смерть пришла через человека[a][b], то и воскресение мёртвых — через человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством человека» в обеих частях; греческий предлог может указывать как на посредничество, так и на действующее лицо.'
    reason: lexical_alternative
  - marker: b
    text: Из контекста видно, что речь идёт об Адаме и Христе (см. 15:22, 45).
