  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: ru
  text: Каков человек из праха, таковы и те, кто из праха; и каков небесный человек, таковы и те, кто небесны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: каков ... таковы и ...
  rationale: Русская соотносительная конструкция естественно и точно передаёт соответствие между представителем и принадлежащими к тому же порядку людьми, сохраняя параллелизм греческого текста.
- source_word: χοϊκός
  choice: из праха
  rationale: Передаёт происхождение и природу, связанные с прахом, и сохраняет аллюзию на сотворение Адама; «праховый» в современном русском звучит неестественно, а «земной» ослабляет образ праха.
- source_word: ὁ χοϊκός
  choice: человек из праха
  rationale: Субстантивированное прилагательное в ближайшем контексте обозначает Адама как представителя человечества. Добавление «человек» делает фразу естественной и сохраняет личностное противопоставление.
- source_word: οἱ χοϊκοί
  choice: те, кто из праха
  rationale: Обозначает людей, разделяющих природу человека из праха, и повторяет ключевой образ без неестественного существительного.
- source_word: ἐπουράνιος
  choice: небесный
  rationale: Точно передаёт принадлежность к небесному порядку и сохраняет форму прилагательного, не подменяя её выражением «с неба» из предыдущего стиха.
- source_word: ὁ ἐπουράνιος
  choice: небесный Человек
  rationale: В контексте речь идёт о Христе в противопоставлении Адаму. «Человек» воспроизводит параллель с первой частью; прописная буква помогает обозначить конкретного представителя, не вставляя имя в текст.
- source_word: οἱ ἐπουράνιοι
  choice: те, кто небесны
  rationale: 'Сохраняет прилагательное и антропологический смысл контекста: речь о людях, соответствующих небесному Человеку, а не об ангельских существах.'
theological_decisions:
- issue: Следует ли явно передать подразумеваемое «человек» в обоих единственных числах
  choice: «человек из праха» и «небесный Человек»
  alternative: «тот, кто из праха» и «небесный»
  rationale: Контекст 1 Кор 15:45–49 противопоставляет Адама и Христа как представителей. Добавление слова «человек» проясняет референтов, не выходя за пределы контекста, и сохраняет симметрию.
- issue: Кого обозначает οἱ ἐπουράνιοι
  choice: 'Людей, соответствующих небесному Человеку: «те, кто небесны»'
  alternative: 'Небесных существ: «небожители» или «небесные существа»'
  rationale: Раздел посвящён воскресению людей и их уподоблению небесному Человеку; понимание как ангелов нарушило бы ход рассуждения.
- issue: Следует ли уточнять, в каком смысле люди «небесны» — по нынешней природе, принадлежности или будущей судьбе
  choice: Сохранить краткое и допускающее смысловую ёмкость выражение «те, кто небесны»
  alternative: «те, кто принадлежат небу» или «те, кто станут небесными»
  rationale: Греческое прилагательное не уточняет здесь временной или модальный аспект; контекст допускает связь и с принадлежностью, и с воскресным образом. Перевод не должен преждевременно устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясным риторическим параллелизмом. Повтор «прах» удерживает связь с Быт 2–3 и предыдущим стихом. Формулировка «те, кто небесны» несколько возвышенна, но понятна и лучше сохраняет лаконичную симметрию оригинала, чем пространное пояснение.
