source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: ru
  text: И то, что ты сеешь, — не тело, которому предстоит появиться, а голое зерно[a] — возможно, пшеницы или чего-либо другого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простое зерно»; букв. «обнажённое (голое) зерно».'
    reason: Лексическая альтернатива для γυμνὸν κόκκον; примечание сохраняет образ без добавочного толкования.
lexical_decisions:
- source_word: σπείρεις
  choice: сеешь
  rationale: Глагол «сеять» прямо передаёт земледельческий образ и сохраняет его связь с рассуждением Павла о воскресении.
- source_word: σῶμα
  choice: тело
  rationale: «Тело» — прямое и контекстуально значимое соответствие; более свободное «растение» сузило бы смысл до ботанической стороны сравнения.
- source_word: τὸ γενησόμενον
  choice: которое появится
  rationale: Передаёт будущее возникновение тела, не уточняя процесс как простой рост и не перегружая фразу буквальным «которому предстоит возникнуть».
- source_word: γυμνὸν κόκκον
  choice: голое зерно
  rationale: Сохраняет образ непокрытого, ещё не обретшего будущего тела зерна; «зерно» естественно в сочетании с последующим примером пшеницы.
- source_word: εἰ τύχοι
  choice: например
  rationale: В данном обороте выражение вводит возможный частный пример, а не строгое условие; «например» естественно передаёт эту функцию по-русски.
- source_word: σίτου ἤ τινος τῶν λοιπῶν
  choice: пшеничное или какое-нибудь другое
  rationale: Конкретно передаёт пшеницу и естественно выражает отсылку к одному из прочих видов зерна.
theological_decisions:
- issue: Соотношение посеянного зерна и будущего воскресшего тела
  choice: Сохранить слово «тело» и направленность в будущее, не раскрывая сравнение доктринальным пояснением.
  alternative: 'Передать динамически: «растение, которое вырастет».'
  rationale: Стих предполагает и преемственность, и преобразование, но сам выражает это земледельческим сравнением. Перевод не сводит «тело» к растению и не уточняет сверх сказанного характер воскресшего тела.
translation_notes:
  register: Современный литературный русский язык с сохранением повторения «сеешь», ключевого термина «тело» и наглядного земледельческого образа. Синтаксис слегка перестроен для естественности русской речи, без устранения смыслового напряжения между зерном и будущим телом.
