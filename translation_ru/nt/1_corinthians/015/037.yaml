  source_fidelity: В начале стиха καὶ имеет присоединительное значение («И»), а не временное («когда»). Оборот εἰ τύχοι выражает возможность («возможно», «может быть»), поэтому «например» несколько ослабляет модальность. Остальные ключевые соответствия — «сеешь», «тело», будущее появление и образ зерна — в целом верны.
  naturalness: «Голое зерно» возможно в литературном библейском контексте, хотя маркировано образом; его лучше сохранить ради точности, не поясняя образ внутри текста. Конструкция «И то, что ты сеешь...» естественно передаёт греческое начало без внесения временного значения.
  terminology: «Тело» сохранено как ключевой термин. «Пшеничное или какое-нибудь другое» допустимо, но «возможно, пшеницы или чего-либо другого» точнее передаёт генитив σίτου и неопределённость τινος τῶν λοιπῶν. Примечание не должно добавлять толкование о будущем теле зерна.
