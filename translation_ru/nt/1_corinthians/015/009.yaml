source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: ru
  text: Ведь я — наименьший из апостолов и недостоин[a] называться апостолом, потому что гнал Божью церковь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: не гожусь; не соответствую требованиям.'
    reason: Лексема ἱκανός может обозначать не только достоинство, но также достаточность, пригодность или соответствие требованиям.
lexical_decisions:
- source_word: γάρ
  choice: ведь
  rationale: Естественно передаёт пояснительную связь с предыдущим стихом и ход рассуждения Павла.
- source_word: ἐλάχιστος
  choice: наименьший
  rationale: Обозначает самое низкое положение или значимость среди апостолов, а не физический размер.
- source_word: ἀπόστολος / ἀποστόλων
  choice: апостол / апостолов
  rationale: В данном контексте это признанное служение и круг апостолов, а не посланники вообще.
- source_word: ἱκανός
  choice: достоин
  rationale: В контексте прежнего гонения Павел говорит о своём несоответствии апостольскому званию; «достоин» естественно передаёт нравственный оттенок, а смысл пригодности отмечен в сноске.
- source_word: καλεῖσθαι
  choice: называться
  rationale: Передаёт пассивный инфинитив кратко и естественно по-русски.
- source_word: διότι
  choice: потому что
  rationale: Ясно вводит причину, по которой Павел считает себя недостойным.
- source_word: ἐδίωξα
  choice: гнал
  rationale: Передаёт враждебное преследование верующих и соответствует устойчивому русскому библейскому словоупотреблению.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: Божью церковь
  rationale: Обозначает принадлежащую Богу общину верующих; притяжательная конструкция звучит естественно в современном русском языке.
- source_word: ὃς
  choice: и
  rationale: Греческий относительный оборот при буквальной передаче был бы тяжеловесен по-русски; сочинительная связь естественно соединяет утверждение об апостольстве с признанием недостоинства, не устраняя напряжения между ними.
theological_decisions:
- issue: Характер высказывания Павла об апостольстве
  choice: Павел включает себя в число апостолов, одновременно называя себя наименьшим и недостойным этого звания.
  alternative: Понять слова как полное отрицание Павлом собственного апостольства либо только как указание на низкое общественное положение.
  rationale: Фраза «я — наименьший из апостолов» предполагает принадлежность к их числу, а последующее признание основано на прежнем гонении Божьей церкви. Перевод сохраняет это напряжение и не сглаживает его.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Ведь» сохраняет пояснительный характер стиха; «наименьший» поддерживает торжественный библейский регистр без архаизации. Синтаксис слегка перестроен ради естественности русского языка.
