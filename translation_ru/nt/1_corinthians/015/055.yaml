lexical_decisions:
- source_word: ποῦ
  choice: где
  rationale: Вопросительное наречие вводит риторический вызов; простое «где» сохраняет прямоту греческого текста без добавочного усиления.
- source_word: σου
  choice: твоя / твоё
  rationale: Форма родительного падежа местоимения второго лица передана естественными русскими притяжательными формами, согласованными с существительными.
- source_word: θάνατε
  choice: смерть!
  rationale: Звательная форма прямо обращается к олицетворённой смерти. В современном русском звательное значение естественно передаётся именительным падежом и восклицательной интонацией.
- source_word: νῖκος
  choice: победа
  rationale: Слово обозначает победу или торжество. «Победа» точно соответствует SBLGNT и связывает стих с утверждением о победе в предыдущем контексте.
- source_word: κέντρον
  choice: жало
  rationale: Хотя слово может означать также остриё или стрекало, в данном олицетворении смерти и с учётом пояснения в следующем стихе естественнее всего «жало».
theological_decisions:
- issue: Разночтение в первой части стиха
  choice: В основном тексте νῖκος переведено как «победа» согласно SBLGNT.
  alternative: 'Некоторые рукописи читают в первой части «жало», в результате чего получается: «Смерть! Где твоё жало?»'
  rationale: Приоритет отдан предоставленному греческому критическому тексту. Известное традиционное разночтение сохранено в сноске, а не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного, поэтического обращения. Повтор «Смерть!» передаёт два греческих вокатива; восклицательный знак естественно выражает звательную и вызывающую интонацию.
