  source_fidelity: 'Текст точно передаёт синтаксис и смысл греческого оригинала: обращение ἀδελφοί, устойчивое выражение «плоть и кровь», невозможность «унаследовать» Божье Царство и параллельное противопоставление φθορά — ἀφθαρσία. «Тление — нетление» сохраняет важный лексический контраст и не подменяет ἀφθαρσία понятием «бессмертие».'
