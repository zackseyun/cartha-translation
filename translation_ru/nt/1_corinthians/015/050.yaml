source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: ru
  text: 'Вот что я говорю[a], братья: плоть и кровь не могут унаследовать Царство Божье[b], и тление не наследует нетления.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; в греческом тексте буквально «братья», но обращение может включать всю общину.'
    reason: lexical_alternative
  - marker: b
    text: «Плоть и кровь» — образ смертной человеческой жизни в её нынешнем состоянии, а не отрицание телесного воскресения.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: Вот что я говорю
  rationale: Передаёт указательное Τοῦτο и прямое φημι естественным современным русским оборотом; δέ выражено плавным переходом без добавления временного «теперь».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму обращения; вероятный охват всей общины отмечен в сноске.
- source_word: σὰρξ καὶ αἷμα
  choice: плоть и кровь
  rationale: Сохраняет устойчивый библейский образ смертного человеческого существования, не подменяя его толкованием.
- source_word: βασιλείαν θεοῦ
  choice: Царство Божье
  rationale: Естественное и узнаваемое русское соответствие, сохраняющее богословскую значимость выражения.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: унаследовать / наследует
  rationale: Сохраняет повтор глагола и его наследственно-эсхатологический оттенок, учитывая различие форм в греческом тексте.
- source_word: οὐ δύναται
  choice: не могут
  rationale: Точно и кратко выражает невозможность; сказуемое согласовано с парным выражением «плоть и кровь» по нормам русского языка.
- source_word: ἡ φθορά
  choice: тление
  rationale: Сохраняет абстрактное существительное и традиционно понятный в контексте воскресения контраст с нетлением.
- source_word: τὴν ἀφθαρσίαν
  choice: нетления
  rationale: Точно сохраняет лексический и морфологический контраст φθορά/ἀφθαρσία, не смешивая нетление с близким, но отдельным понятием бессмертия.
theological_decisions:
- issue: Значение выражения «плоть и кровь» в связи с воскресением
  choice: Идиома, обозначающая смертное и подверженное тлению человеческое существование в его нынешнем состоянии.
  alternative: Утверждение, будто физическая телесность как таковая не может войти в Божье Царство.
  rationale: Ближайший контекст говорит о преображении тела из тленного в нетленное, а не об отказе от телесности. Основной текст сохраняет образ и не разрешает напряжение путём антиматериального перефразирования.
- issue: Круг адресатов в ἀδελφοί
  choice: В основном тексте «братья», с указанием возможного включительного смысла в сноске.
  alternative: «Братья и сёстры».
  rationale: Так сохраняется грамматическая форма оригинала, а вероятное обращение ко всей смешанной общине не скрывается.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены параллелизм, повтор «наследовать» и напряжённый контраст «тление — нетление»; архаическое «се» и тяжеловесные поясняющие перифразы исключены.
