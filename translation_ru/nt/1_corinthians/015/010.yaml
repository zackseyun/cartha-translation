  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: ru
  text: Но благодатью Божьей я — то, что я есть, и Его благодать ко мне не оказалась тщетной[a]. Напротив, я потрудился больше всех их — но не я, а благодать Божья, которая была со мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не стала пустой»; по смыслу: «не была напрасной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: Но по благодати Божьей
  rationale: Творительный смысл дательного χάριτι передан сочетанием «по благодати»; δέ обозначает мягкое противопоставление предыдущему контексту. Ключевой для Павла термин «благодать» сохранён.
- source_word: εἰμι ὅ εἰμι
  choice: я есмь то, что есмь
  rationale: Повтор исходного выражения сохранён. «Есмь» здесь представляет собой понятную торжественную форму, позволяющую передать формулу близко к греческому тексту, не сводя её лишь к профессии или положению Павла.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: Его благодать ко мне
  rationale: «Ко мне» сохраняет направленность εἰς и естественно связывает благодать с её действием в отношении Павла.
- source_word: οὐ κενὴ ἐγενήθη
  choice: не оказалась тщетной
  rationale: Передаёт результативное значение κενός — «пустой, безрезультатный, напрасный» — и ἐγενήθη, сохраняя образ эффективности благодати. Буквальная альтернатива отмечена в сноске.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: Напротив, я потрудился больше всех их
  rationale: κοπιάω указывает на напряжённый труд; «потрудился» передаёт усилие без излишне архаичного звучания. Сравнение «больше всех их» сохраняет структуру греческого текста и допускает контекстуальный смысл «больше каждого из них» либо «больше их всех».
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: впрочем, не я, а благодать Божья
  rationale: 'Формулировка сохраняет резкое уточнение Павла: его труд реален, но решающее действие приписано Божьей благодати.'
- source_word: ἡ σὺν ἐμοί
  choice: бывшая со мной
  rationale: Передаёт σύν с дательным как «со мной» и относит определение непосредственно к «благодати Божьей», не добавляя идеи совместного труда, которой выражение само по себе не формулирует.
theological_decisions:
- issue: Соотношение труда Павла и действия Божьей благодати
  choice: 'Сохранены оба утверждения: Павел действительно потрудился, однако действующей причиной названа Божья благодать, бывшая с ним.'
  alternative: Явно истолковать фразу либо как совместную деятельность Бога и Павла, либо как отрицание подлинного участия Павла.
  rationale: Греческий текст намеренно удерживает напряжение между «я потрудился» и «не я, а благодать Божья». Перевод не разрешает его в пользу поздней богословской системы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Форма «есмь» выбрана для сохранения выразительного повтора εἰμι ὅ εἰμι; остальная фраза построена естественно и понятно для современного читателя.
