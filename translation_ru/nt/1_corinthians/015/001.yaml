    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: Объявляю вам
  rationale: Глагол означает «даю знать, сообщаю, объявляю». Настоящее время и прямой смысл сохранены; «напоминаю» было бы контекстуальным толкованием, а не ближайшим соответствием.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица отмечает мягкий переход к новой теме и в современном русском здесь естественно передаётся самим началом нового высказывания; «но» создало бы излишне сильное противопоставление, а «теперь» внесло бы временной оттенок.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранено грамматически мужское обращение исходного текста. В данном послании оно обращено ко всей общине, что поясняется в сноске.
- source_word: τὸ εὐαγγέλιον
  choice: Благую Весть
  rationale: Передано прозрачное значение слова εὐαγγέλιον — добрая, благая весть; заглавные буквы указывают на конкретную весть о Христе в данном контексте.
- source_word: εὐηγγελισάμην
  choice: возвещал
  rationale: Глагол обозначает провозглашение благой вести. «Возвещал» естественно и достойно передаёт действие, сохраняя смысловую связь с «Благой Вестью».
- source_word: παρελάβετε
  choice: приняли
  rationale: В контексте переданного учения παραλαμβάνω означает получить или принять сообщение. «Приняли» естественно по-русски и не требует уточнять степень субъективного согласия.
- source_word: ἐν ᾧ
  choice: в которой
  rationale: Сохранён образ Благой Вести как той сферы или основания, в которой пребывают адресаты; вариант «которой» мог бы преждевременно выражать инструментальное значение следующего стиха.
- source_word: ἑστήκατε
  choice: стоите
  rationale: Перфект выражает достигнутое и продолжающееся состояние. Настоящее «стоите» кратко передаёт эту устойчивость, не усиливая текст добавлением «твёрдо».
theological_decisions:
- issue: Охват обращения ἀδελφοί в смешанной общине
  choice: «братья» в основном тексте со сноской о включении женщин
  alternative: «братья и сёстры»
  rationale: Основной текст сохраняет форму греческого обращения, а сноска разъясняет его обычный для Павла общинный охват, не скрывая ни форму, ни подразумеваемых адресатов.
- issue: Образ пребывания в Благой Вести в выражении ἐν ᾧ καὶ ἑστήκατε
  choice: «в которой стоите»
  alternative: «на которой твёрдо стоите»
  rationale: Буквенный образ и неоднозначность предлога ἐν сохранены. Добавление «твёрдо» или замена «в» на «на» сделало бы метафору более определённой, чем греческий текст.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским регистром. Синтаксический повтор «которую… которую… в которой» сохраняет риторическую цепочку греческого оригинала; частица δὲ отдельно не выражена ради естественности русского перехода.
