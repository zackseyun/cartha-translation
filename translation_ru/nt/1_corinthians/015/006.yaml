  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: ru
  text: Затем Он явился более чем пятистам братьям[a] одновременно; большинство из них живы и поныне, хотя некоторые уснули[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьям и сёстрам»; по-гречески буквально «братьям», но в раннехристианской речи это слово иногда могло обозначать всю общину верующих.'
    reason: lexical_alternative
  - marker: b
    text: То есть умерли. Павел называет смерть сном — это распространённое среди первых христиан выражение, связанное с надеждой на воскресение.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Затем
  rationale: Передаёт последовательность явлений в перечне Павла кратко и естественно.
- source_word: ὤφθη
  choice: Он явился
  rationale: В контексте явлений воскресшего Христа пассивная форма ὁράω естественно передаётся как «явился»; подразумеваемый субъект — Христос.
- source_word: ἐπάνω πεντακοσίοις
  choice: более чем пятистам
  rationale: ἐπάνω при числительном означает превышение указанного числа.
- source_word: ἀδελφοῖς
  choice: братьям
  rationale: Сохраняет мужскую форму греческого текста; возможность обозначения всей общины верующих отмечена в сноске.
- source_word: ἐφάπαξ
  choice: одновременно
  rationale: В данном контексте указывает на совместность, одновременность явления всей большой группе.
- source_word: ἐξ ὧν οἱ πλείονες
  choice: большинство из них
  rationale: Естественно передаёт партитивную конструкцию и субстантивированную сравнительную форму со значением «большинство».
- source_word: μένουσιν ἕως ἄρτι
  choice: живы и поныне
  rationale: В контексте μένουσιν означает, что большинство свидетелей продолжает жить; «поныне» точно передаёт ἕως ἄρτι и звучит достойно и естественно.
- source_word: τινὲς δὲ
  choice: хотя некоторые
  rationale: Передаёт мягкое противопоставление между живым большинством и умершими.
- source_word: ἐκοιμήθησαν
  choice: уснули
  rationale: Сохраняет раннехристианскую метафору смерти, особенно значимую в рассуждении о воскресении.
theological_decisions:
- issue: Значение ἀδελφοῖς в потенциально смешанной группе
  choice: братьям
  alternative: братьям и сёстрам
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала, не исключая более широкого общинного значения, указанного в сноске.
- issue: Передача ἐκοιμήθησαν в контексте воскресения
  choice: уснули
  alternative: умерли
  rationale: Сохранение метафоры не сглаживает богословски значимую связь смерти со сном в контексте надежды на воскресение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формулировка «живы и поныне» проясняет контекстуальный смысл μένουσιν, тогда как «уснули» сохраняет образность оригинала.
