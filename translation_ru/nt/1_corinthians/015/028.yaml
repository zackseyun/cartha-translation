  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: ru
  text: Когда же всё будет подчинено Ему[a], тогда Сам Сын будет подчинён Тому, Кто подчинил Ему всё, чтобы Бог был всё во всём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё сущее». Греческое выражение τὰ πάντα повторяется в стихе и подчёркивает всеобщий, космический охват сказанного.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «всё во всех». Греческая формула πάντα ἐν πᾶσιν предельно кратка и допускает разные способы передачи; «всё во всём» сохраняет её широту и риторическую силу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Когда же
  rationale: Сочетание естественно передаёт временное значение ὅταν и мягкий переход, выраженный δέ, без излишне резкого противопоставления.
- source_word: ὑποταγῇ / ὑποταγήσεται / ὑποτάξαντι
  choice: будет подчинено / подчинится / подчинил
  rationale: Единый корень «подчин-» сохраняет настойчивый повтор ὑποτάσσω. Формы передают соответственно пассивный аористный конъюнктив, будущий пассив и активное причастие; русское «подчинится» естественно по форме, не превращая высказывание в пояснительный богословский пересказ.
- source_word: τὰ πάντα
  choice: всё
  rationale: В данном космическом контексте русское собирательное «всё» естественно передаёт субстантивированное среднее множественное τὰ πάντα. Повтор сохранён в обеих позициях.
- source_word: αὐτῷ
  choice: Ему
  rationale: Местоимение относится к Сыну по ближайшему контексту. Прописная буква соответствует принятому русскому библейскому оформлению личных местоимений, относящихся к Богу, и не добавляет нового содержания.
- source_word: τότε αὐτὸς ὁ υἱὸς
  choice: тогда Сам Сын
  rationale: «Тогда» точно обозначает следующий этап, а «Сам Сын» передаёт эмфатическое αὐτός. Отдельное «тоже» не добавлено, поскольку в представленном греческом тексте нет καί.
- source_word: τῷ ὑποτάξαντι
  choice: Тому, Кто подчинил
  rationale: Артикль с причастием передан субстантивированной русской конструкцией, сохраняющей действующее лицо без его явного отождествления в самой фразе.
- source_word: ἵνα ᾖ
  choice: чтобы ... был
  rationale: «Чтобы» сохраняет целевое или результативное значение ἵνα с сослагательным наклонением, не вынуждая выбирать между этими близкими оттенками.
- source_word: πάντα ἐν πᾶσιν
  choice: всё во всём
  rationale: Краткая, риторически сильная формула сохраняет повтор πᾶς и намеренную ёмкость греческого выражения, не сужая πᾶσιν исключительно до людей.
theological_decisions:
- issue: Подчинение Сына Тому, Кто подчинил Ему всё
  choice: Прямо сохранить утверждение о том, что Сам Сын подчинится, без догматических пояснений в основном тексте.
  alternative: Смягчить «подчинится» либо уточнить, что речь идёт только о функциональном, домостроительном подчинении.
  rationale: Греческий текст явно употребляет ὑποτάσσω применительно к Сыну. Перевод не должен ни устранять возникающее богословское напряжение, ни решать его посредством позднейших категорий, отсутствующих в стихе.
- issue: Всеобщий охват τὰ πάντα и неоднозначность πάντα ἐν πᾶσιν
  choice: Последовательно употребить «всё» и завершить формулой «всё во всём».
  alternative: Передать конец как «всё во всех» или «всем во всём».
  rationale: Выбранная формулировка сохраняет космический охват и компактность оригинала, не ограничивая последнюю фразу только личностями или только неодушевлённой совокупностью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис сделан прозрачным, ключевой повтор «подчин-» сохранён, архаизмы и конфессионально окрашенные пояснения не вводятся.
