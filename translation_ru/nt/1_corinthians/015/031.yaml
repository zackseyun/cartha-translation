  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: ru
  text: Каждый день я умираю — клянусь тем, что хвалюсь вами в Мессии Иисусе, нашем Господе.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «ежедневно умираю».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «так же верно, как верно то, что я хвалюсь вами» или «клянусь вашей похвалой». Греческий оборот имеет характер клятвенного заверения, а синтаксическая связь слов о похвале остаётся спорной.'
    reason: alternative_reading
  - marker: c
    text: 'Традиционный перевод: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: каждый день
  rationale: Естественно передаёт распределительное значение «ежедневно, изо дня в день».
- source_word: ἀποθνῄσκω
  choice: я умираю
  rationale: Сохраняет настоящее время и яркость буквального выражения Павла, не заменяя его толкованием «подвергаюсь смерти».
- source_word: νὴ
  choice: клянусь тем
  rationale: Передаёт функцию частицы в клятвенном заверении; буквальное русское «клянусь» ясно и естественно показывает силу оборота.
- source_word: τὴν ὑμετέραν καύχησιν, ἣν ἔχω
  choice: тем, что хвалюсь вами
  rationale: Относительное предложение «которое я имею» указывает на похвалу Павла, связанную с коринфянами. Русская глагольная конструкция естественнее буквального «похвалой о вас», но неоднозначность отмечена в сноске.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Сохраняет важный для Павла оборот с ἐν и передаёт Χριστός как титул «Мессия».
- source_word: τῷ κυρίῳ ἡμῶν
  choice: нашем Господе
  rationale: Естественное согласование приложения с предшествующим предложным оборотом; κύριος передано традиционным титулом «Господь».
theological_decisions:
- issue: Χριστός как титул или традиционная форма имени
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: Здесь Χριστός сохраняет титульный смысл; традиционный вариант дан в сноске.
- issue: Связь καύχησις с ὑμετέραν
  choice: Павел хвалится коринфянами
  alternative: похвала самих коринфян / ваша похвала
  rationale: Фраза ἣν ἔχω («которую я имею») склоняет к похвале Павла, предметом или основанием которой являются адресаты, однако греческий синтаксис допускает спор и потому альтернатива сохранена.
- issue: Характер νὴ τὴν ... καύχησιν
  choice: клятвенное заверение «клянусь тем...»
  alternative: «так же верно, как верно то, что я хвалюсь вами»
  rationale: νὴ вводит торжественное заверение, но точное логическое отношение к последующей именной группе можно выразить по-разному; основной текст не устраняет эту напряжённость пояснением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным клятвенным оборотом. Сохранены краткость, риторическая сила и богословски значимое выражение «в Мессии Иисусе».
