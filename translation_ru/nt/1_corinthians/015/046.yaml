  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: ru
  text: Но прежде — не духовное, а душевное; затем — духовное.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: прежде
  rationale: Наречное употребление обозначает последовательность. «Прежде» естественно передаёт временной порядок и хорошо сочетается с последующим «затем».
- source_word: πνευματικόν
  choice: духовное
  rationale: Субстантивированное прилагательное среднего рода сохранено без добавления слова «тело», которого в самом стихе нет; контекст допускает его подразумевание.
- source_word: ψυχικόν
  choice: душевное
  rationale: «Душевное» формально и традиционно передаёт ψυχικόν и сохраняет прямое противопоставление πνευματικόν. Здесь оно означает принадлежащее обычной одушевлённой жизни, а не обязательно нравственно бездуховное.
- source_word: ἔπειτα
  choice: затем
  rationale: Ясно и естественно обозначает следующий этап в последовательности.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: Но не ... а
  rationale: Русская парная конструкция точно и идиоматично передаёт греческое исправляющее противопоставление.
theological_decisions:
- issue: Смысл противопоставления ψυχικόν и πνευματικόν
  choice: Последовательность душевного и духовного как двух порядков или состояний существования в рассуждении о воскресении.
  alternative: Конкретно «душевное тело» и «духовное тело» либо противопоставление бездуховных и духовных людей.
  rationale: В ближайшем контексте речь идёт о телах (ст. 44), однако в данном стихе существительное σῶμα отсутствует. Поэтому основной текст сохраняет краткость и широту греческого выражения, а контекстуально возможное добавление вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с краткой, симметричной конструкцией, близкой к греческой. Тире перед последним «духовное» облегчает чтение эллиптической фразы. Термин «душевное» требует пояснения, поскольку в современном русском может ошибочно пониматься как «эмоциональное» или «сердечное».
