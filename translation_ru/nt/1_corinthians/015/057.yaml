base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: ru
  text: Но благодарение Богу, дарующему нам победу через нашего Господа Иисуса Мессию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционная форма: «Иисуса Христа». Греческий титул Χριστός означает «Мессия».'
    reason: Сохраняет традиционный вариант имени-титула и поясняет его значение, тогда как основной текст непосредственно переводит титул.
lexical_decisions:
- source_word: χάρις
  choice: благодарение
  rationale: В формуле τῷ θεῷ χάρις слово означает обращённую к Богу благодарность, а не «благодать»; «благодарение Богу» сохраняет краткую торжественную форму.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкое противопоставление предшествующему упоминанию смерти и переход к благодарению за победу.
- source_word: τῷ διδόντι
  choice: Который дарует
  rationale: Субстантивированное причастие настоящего времени характеризует Бога как подателя победы; «дарует» естественно передаёт продолжающееся или общее действие и оттенок дара.
- source_word: ἡμῖν
  choice: нам
  rationale: 'Прямое соответствие дательному падежу: Бог дарует победу «нам».'
- source_word: τὸ νῖκος
  choice: победу
  rationale: Речь о конкретной победе над смертью, только что раскрытой в контексте; в русском винительный падеж естественно употребляется без определённого артикля.
- source_word: διὰ
  choice: через
  rationale: С родительным падежом διά обозначает средство или посредничество; «через» сохраняет эту смысловую открытость.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Господа нашего
  rationale: Сохраняет христологический титул κύριος и торжественный, но понятный русский порядок слов.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В современном русском сочетание «Иисус Христос» является устойчивой формой имени-титула; значение Χριστός как титула «Мессия» поясняется в сноске.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: «Христа» в основном тексте
  alternative: «Мессии»
  rationale: Греческое Χριστός означает «Помазанник, Мессия», но в русском «Иисус Христос» — общепонятная традиционная форма имени-титула. Сноска сохраняет прозрачность исходного титульного значения, не навязывая вывод о том, насколько здесь слово уже функционирует как часть устойчивого именования.
translation_notes:
  register: Современный литературный русский с кратким доксологическим звучанием. Форма «благодарение Богу» намеренно несколько возвышенна, но привычна и понятна; «дарует» подчёркивает характер дара без добавления отсутствующей в тексте причинности.
