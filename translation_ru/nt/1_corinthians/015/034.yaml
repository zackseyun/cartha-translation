  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: ru
  text: 'Протрезвитесь как должно[a] и не грешите: ведь некоторые не знают Бога. К стыду вашему говорю это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Придите в себя как должно». Глагол буквально вызывает образ протрезвления после опьянения, но здесь, вероятно, употреблён метафорически.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: Протрезвитесь
  rationale: Глагол буквально обозначает протрезвление после опьянения, а здесь метафорически призывает решительно вернуться к здравому восприятию; русский глагол сохраняет яркий образ.
- source_word: δικαίως
  choice: как должно
  rationale: Передаёт наречное значение «правильно, должным образом» естественнее, чем буквальное и стилистически тяжёлое «праведно».
- source_word: μὴ ἁμαρτάνετε
  choice: не грешите
  rationale: Настоящий императив допускает общий запрет и оттенок продолжающегося действия; краткая русская форма сохраняет эту неоднозначность, не утверждая непременно, что действие уже совершается.
- source_word: ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν
  choice: ведь некоторые из вас не знают Бога
  rationale: Идиоматично передаёт буквальное «некоторые имеют незнание Бога». «Из вас» естественно следует из обращения к коринфской общине, хотя в греческом прямо стоит только «некоторые».
- source_word: πρὸς ἐντροπὴν ὑμῖν λαλῶ
  choice: К стыду вашему говорю это
  rationale: Сохраняет укоряющий тон и близко передаёт греческую конструкцию, не сводя её однозначно к намерению «чтобы пристыдить вас».
theological_decisions:
- issue: Нравственная сила δικαίως
  choice: как должно
  alternative: праведно
  rationale: Контекст нравственный, однако наречие прежде всего характеризует должный способ протрезвления; перевод не вводит более специального богословского значения праведности.
- issue: Характер незнания Бога
  choice: не знают Бога
  alternative: имеют незнание о Боге
  rationale: Генитив допускает незнание Бога или незнание о Боге. Естественная русская формулировка сохраняет серьёзность личностного смысла, не уточняя сверх текста степень или вид этого незнания.
translation_notes:
  register: Современный литературный русский язык с кратким, резким и увещевательным ритмом. Инверсия «К стыду вашему» сохраняет достоинство и силу заключительного упрёка.
