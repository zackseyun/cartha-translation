  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: ru
  text: Если мы лишь в этой жизни надеемся на Мессию[a], то мы заслуживаем большей жалости, чем все люди[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Мессии»; возможен также традиционный перевод: «во Христе».'
    reason: Передача павловской формулы ἐν Χριστῷ и альтернативное наименование титула.
  - marker: b
    text: 'Или: «мы достойны сожаления больше всех людей».'
    reason: Естественный русский способ передать греческую сравнительную степень со значением того, кто особенно заслуживает жалости.
lexical_decisions:
- source_word: εἰ
  choice: Если
  rationale: Вводит условное высказывание; это прямой и естественный русский эквивалент.
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: в этой жизни
  rationale: Передаёт нынешнюю земную жизнь без добавочного толкования; постановка после «только» ясно ограничивает надежду рамками этой жизни.
- source_word: ἐν Χριστῷ
  choice: на Мессию
  rationale: В сочетании с русским глаголом «надеяться» управление «на Мессию» звучит естественно. Титул Χριστός передан как «Мессия», а буквальная павловская формула отмечена в сноске.
- source_word: ἠλπικότες ἐσμὲν
  choice: надеемся
  rationale: Перифрастический перфект обозначает сложившуюся и сохраняющуюся надежду; русское настоящее время естественно выражает это продолжающееся состояние.
- source_word: μόνον
  choice: только
  rationale: По контексту ограничивает надежду этой жизнью; выбранный порядок слов предотвращает понимание в смысле «мы лишь надеемся и ничего больше не делаем».
- source_word: ἐλεεινότεροι
  choice: более … достойны сожаления
  rationale: Сохраняет сравнительную степень и значение «заслуживающие большей жалости», избегая оттенка презрения, возможного у слова «жалкие».
- source_word: πάντων ἀνθρώπων
  choice: всех людей
  rationale: ἄνθρωποι обозначает людей вообще, а не только мужчин; родительный падеж естественен при конструкции «более всех».
theological_decisions:
- issue: Передача павловской формулы ἐν Χριστῷ
  choice: на Мессию
  alternative: во Христе / в Мессии
  rationale: Основной текст использует естественное русское управление при глаголе надежды и сохраняет смысл титула Χριστός как «Мессия». Буквальная формула, способная указывать не только на объект надежды, но и на пребывание в Мессии, сохранена в сноске, чтобы не скрывать богословскую насыщенность выражения.
- issue: Объём утверждения Павла о надежде
  choice: Надежда условно ограничена только этой жизнью
  alternative: Развёрнутая формулировка о воскресении или загробной жизни
  rationale: Перевод сохраняет условную риторическую силу стиха, но не добавляет выводов, которые в самом предложении прямо не высказаны.
- issue: Сила сравнительной степени ἐλεεινότεροι
  choice: более всех людей достойны сожаления
  alternative: самые несчастные из всех людей
  rationale: Сохранена формальная сравнительная степень и смысл жалости; вариант «самые несчастные» мог бы сдвинуть значение от достойных жалости к объективному несчастью.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным новозаветным звучанием. Синтаксис сделан естественным для широкого читателя, при этом сравнительная форма, условность высказывания и богословски значимая формула ἐν Χριστῷ не устранены.
