base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: ru
  text: Ведь Ему надлежит царствовать, пока все враги не будут положены под Его ноги[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока [он] положит всех врагов под ноги его». В греческом тексте глагол стоит в действительном залоге, но его субъект отдельно не назван; в контексте его относят либо ко Христу, либо к Богу. Пассивная формулировка перевода сохраняет эту неоднозначность.'
    reason: lexical_alternative
  - marker: b
    text: Образ врагов под ногами означает их полное подчинение; ср. Псалом 109:1 (в иной нумерации — 110:1).
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: надлежит
  rationale: Передаёт необходимость и божественную неизбежность, сохраняя возвышенный, но понятный современный русский регистр.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно вводит обоснование предыдущего утверждения и сохраняет связующую функцию частицы.
- source_word: αὐτὸν
  choice: Ему
  rationale: В греческом это винительный падеж субъекта инфинитива; русская безличная конструкция «Ему надлежит царствовать» точно и естественно воспроизводит синтаксическое отношение.
- source_word: βασιλεύειν
  choice: царствовать
  rationale: Точно сохраняет смысл царского правления и привычно звучит в библейском контексте.
- source_word: ἄχρι οὗ
  choice: пока не
  rationale: Естественный русский способ обозначить временной предел ожидаемого события; сама конструкция не утверждает прекращения царствования после этого момента.
- source_word: θῇ
  choice: не положит
  rationale: Аорист конъюнктива после ἄχρι οὗ представляет подчинение врагов как достигнутое событие; русский совершенный вид естественно передаёт эту завершённость.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: всех врагов
  rationale: Сохраняет всеохватность πάντας. Принадлежность врагов Христу понятна из местоимения и контекста, хотя буквально греческий текст говорит «всех врагов», а не «всех Его врагов».
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: под ноги Свои
  rationale: Сохраняет библейский образ полного подчинения и ясно относит возвратное местоимение к действующему лицу.
theological_decisions:
- issue: Временное значение ἄχρι οὗ
  choice: Передано как «пока ... не» без утверждения, что после покорения врагов царствование Христа прекратится.
  alternative: Понять временной предел как указание на окончание Его царствования после покорения врагов.
  rationale: Оборот обозначает момент, до которого действие находится в фокусе, но сам по себе не сообщает, прекращается ли оно затем.
- issue: Действующее лицо при θῇ
  choice: 'Основной текст понимает подразумеваемым субъектом Христа: «Он не положит».'
  alternative: 'Возможна трактовка с Богом как подразумеваемым субъектом: «Бог не положит».'
  rationale: Ближайший названный субъект — Христос, и такая синтаксическая связь наиболее естественна; однако пассивная формулировка Псалма 109:1 по Септуагинте и контекст 1 Кор 15:24–28 допускают обсуждение божественного действия, поэтому неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Надлежит» и «царствовать» сохраняют достоинство и смысл оригинала, оставаясь понятными. Местоимения, относящиеся ко Христу, написаны с прописной буквы согласно принятой русской издательской традиции.
