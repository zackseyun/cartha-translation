base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/007.yaml
  text: Then he appeared to James[a], then to all the apostles.
translation:
  language: ru
  text: Затем Он явился Иакову[a], потом — всем апостолам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Он был увиден Иаковом… всеми апостолами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Затем
  rationale: Наречие обозначает следующий эпизод в последовательном перечне явлений воскресшего Христа; «затем» естественно и точно передаёт эту связь.
- source_word: ὤφθη
  choice: Он явился
  rationale: Форма аориста пассивного залога от ὁράω в рассказах о явлениях воскресшего Христа идиоматически означает «явился». Буквальное «был увиден» сохранено в примечании как возможная формальная передача.
- source_word: Ἰακώβῳ
  choice: Иакову
  rationale: Дательный падеж обозначает лицо, которому Он явился; «Иаков» — традиционная русская форма библейского имени Ἰάκωβος.
- source_word: εἶτα
  choice: потом
  rationale: Второе наречие продолжает последовательность. «Потом» сохраняет пошаговый характер перечня и позволяет естественно избежать тяжёлого повтора.
- source_word: ἀποστόλοις
  choice: апостолам
  rationale: В данном контексте речь идёт о признанных свидетелях и посланниках Христа, поэтому сохраняется устоявшийся термин «апостолы», а не общее «посланники».
- source_word: πᾶσιν
  choice: всем
  rationale: Слово подчёркивает всю названную группу и прямо передаётся как «всем апостолам».
theological_decisions:
- issue: Кого включает выражение «все апостолы» и как эта группа соотносится с Иаковом
  choice: Сохранить прямую формулировку «всем апостолам», не уточняя состав группы.
  alternative: Понимать это как Двенадцать или как более широкий круг уполномоченных свидетелей, отличный от Двенадцати.
  rationale: Греческий текст не определяет точный состав этой группы. Перевод не должен сужать значение или гармонизировать различие между отдельным явлением Иакову и последующим явлением «всем апостолам».
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Заглавное «Он» употреблено как уважительная орфографическая традиция применительно ко Христу; тире перед «всем апостолам» естественно выделяет следующий пункт краткого перечня.
