  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: ru
  text: А если Мессия не был воскрешён[a], то наша проповедь пуста[b], пуста и ваша вера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греч. Χριστός означает «Мессия», то есть «Помазанник».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «тщетна» — в обоих случаях употребления слова «пуста».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт титульный смысл Χριστός и сохраняет связь с мессианским достоинством Иисуса в рассуждении Павла.
- source_word: ἐγήγερται
  choice: не был воскрешён
  rationale: Пассивная форма сохраняет подразумеваемое действие Бога; русский результативный оборот естественно передаёт состояние, существенное для аргумента.
- source_word: ἄρα
  choice: то и
  rationale: Естественно обозначает логическое следствие в русской условной конструкции и связывает оба вывода с отрицанием воскресения.
- source_word: κήρυγμα
  choice: проповедь
  rationale: В данном контексте означает возвещаемую апостолами весть; «проповедь» понятно современному читателю и не ограничивается отдельной речью.
- source_word: κενὸν / κενὴ
  choice: пуста
  rationale: Одинаковый перевод обеих форм сохраняет риторический параллелизм и передаёт отсутствие содержания, основания или действительности.
- source_word: πίστις
  choice: вера
  rationale: Здесь речь идёт о вере коринфян как ответе на провозглашение; «вера» является наиболее естественным и контекстуально точным вариантом.
theological_decisions:
- issue: Форма высказывания о воскресении и действующее лицо
  choice: не был воскрешён
  alternative: не воскрес
  rationale: Греческий перфект пассивного залога сохранён пассивной конструкцией, которая не устраняет подразумеваемое действие Бога и не разрешает шире новозаветное богословское напряжение.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Титульный перевод раскрывает значение греческого слова и удерживает в поле зрения мессианское достоинство; традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной синтаксической параллелью. Инверсия «пуста и ваша вера» сохраняет риторический строй оригинала без архаизации.
