base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: ru
  text: Сеется в бесчестии — воскрешается в славе; сеется в слабости — воскрешается в силе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: сеется
  rationale: Настоящее время и страдательное значение переданы возвратной формой; «сеется» сохраняет развёрнутый в контексте образ семени и тела.
- source_word: ἀτιμίᾳ
  choice: в уничижении
  rationale: «Уничижение» передаёт лишённое чести, низкое состояние тела и образует естественную смысловую противоположность «славе», не сводя значение к субъективному стыду.
- source_word: ἐγείρεται
  choice: восстаёт
  rationale: В контексте воскресения «восстаёт» естественно передаёт ἐγείρεται. Русская возвратная форма не называет действующее лицо и тем самым сохраняет невыраженную в греческом тексте божественную причинность.
- source_word: δόξῃ
  choice: в славе
  rationale: «Слава» — прямое и богословски ёмкое соответствие δόξα; оно сохраняет противопоставление уничижению.
- source_word: ἀσθενείᾳ
  choice: в немощи
  rationale: «Немощь» передаёт телесную слабость и тленную ограниченность, сохраняя широкий смысл слова и параллель с «силой».
- source_word: δυνάμει
  choice: в силе
  rationale: «Сила» — естественное русское соответствие δύναμις в данной антитезе; оно может обозначать не только физическую крепость, но и силу преображённой воскресшей жизни.
theological_decisions:
- issue: Залог и действующее лицо при воскресении
  choice: 'Сохранить формы без прямо названного действующего лица: «восстаёт».'
  alternative: «Бог воскрешает его».
  rationale: Греческий текст использует страдательную форму и не называет Бога в качестве действующего лица. Перевод не должен добавлять это уточнение, хотя божественная причинность подразумевается контекстом.
- issue: Подразумеваемое подлежащее
  choice: Не повторять слово «тело», полагаясь на ближайший контекст.
  alternative: «Тело сеется… тело восстаёт…»
  rationale: В греческом стихе подлежащее не выражено и восстанавливается из предшествующего контекста. Русские безлично воспринимаемые формы сохраняют лаконичный параллелизм и ясны в контексте рассуждения о теле.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской ритмикой. Симметричный синтаксис и тире подчёркивают две антитезы. Слова «уничижение» и «немощь» dignified and understandable in biblical discourse without being archaic; no footnote markers are needed.
