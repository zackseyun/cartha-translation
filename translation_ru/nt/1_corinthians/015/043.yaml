revisions:
- from: Сеется в уничижении — восстаёт в славе; сеется в немощи — восстаёт в силе.
  to: Сеется в бесчестии — воскрешается в славе; сеется в слабости — воскрешается в силе.
  rationale: Заменены слова, которые либо не вполне сохраняли грамматический залог оригинала, либо были менее точны либо менее современны лексически. Подлежащее по-прежнему подразумевается из ближайшего контекста («тело»), а божественный деятель не добавляется.
