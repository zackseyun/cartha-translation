  revision_rationale: Заменены слова, которые либо не вполне сохраняли грамматический залог оригинала, либо были менее точны либо менее современны лексически. Подлежащее по-прежнему подразумевается из ближайшего контекста («тело»), а божественный деятель не добавляется.
