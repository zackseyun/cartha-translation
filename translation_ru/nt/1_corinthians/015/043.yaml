review_pass:
  verdict: revise
  source_fidelity: «Восстаёт» передаёт результат воскресения, но в русском это непереходная активная форма («поднимается/встаёт») и не сохраняет страдательный залог греческого ἐγείρεται. «Воскрешается» точнее передаёт повторяющийся пассив и, как в оригинале, не называет действующее лицо. «Бесчестие» является более прямым современным соответствием ἀτιμία, чем «уничижение», которое может обозначать процесс или акт унижения.
  naturalness: Исправленный текст сохраняет краткий параллелизм и библейскую торжественность, но употребляет понятные современному читателю слова «бесчестие» и «слабость».
  terminology: «Слава», «воскрешается» и «сила» надёжно передают δόξα, ἐγείρεται и δύναμις. «Слабость» — современное прямое соответствие ἀσθένεια; оно не сужает значение только до физической немощи.
  issues:
  - severity: medium
    issue: «Восстаёт» не сохраняет страдательный залог ἐγείρεται.
    rationale: Греческая форма является пассивной. «Воскрешается» сохраняет пассивную конструкцию и оставляет агента неназванным, как в подлиннике.
  - severity: low
    issue: «Уничижение» менее прямо передаёт ἀτιμία.
    rationale: ἀτιμία означает бесчестие, отсутствие чести; «уничижение» может подразумевать действие унижающего. «Бесчестие» точнее сохраняет противопоставление «славе».
  - severity: low
    issue: «Немощь» имеет оттенок традиционно-библейской и несколько архаичной лексики для заявленного современного литературного варианта.
    rationale: «Слабость» прямо и естественно передаёт ἀσθένεια, сохраняя антитезу с «силой».
  revised_text: Сеется в бесчестии — воскрешается в славе; сеется в слабости — воскрешается в силе.
