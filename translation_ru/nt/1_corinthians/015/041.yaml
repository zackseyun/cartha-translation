  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: ru
  text: Иная слава у солнца[a], иная слава у луны, иная — у звёзд; ведь одна звезда отличается от другой славой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сияние» или «блеск» — во всём стихе. Греческое слово δόξα здесь может обозначать видимое сияние, однако перевод «слава» сохраняет повтор одного и того же слова в рассуждении Павла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: иная
  rationale: Повтор «иная» естественно передаёт различие между солнцем, луной и звёздами и сохраняет риторический параллелизм греческого текста.
- source_word: δόξα
  choice: слава
  rationale: В данном образе слово включает видимое сияние, но «слава» сохраняет повтор ключевого термина и его связь с рассуждением Павла о воскресшем теле.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: у солнца / у луны / у звёзд
  rationale: Русская конструкция с «у» естественно выражает принадлежность славы соответствующим небесным светилам.
- source_word: ἀστὴρ ... ἀστέρος
  choice: звезда от звезды
  rationale: Сохранено непосредственное сопоставление двух представителей одной категории.
- source_word: γὰρ
  choice: и
  rationale: В этом контексте γάρ поясняет предыдущее утверждение; русское присоединительное «и» естественно вводит пояснение, не делая причинную связь чрезмерно жёсткой.
- source_word: διαφέρει
  choice: отличается
  rationale: Передаёт различие, не навязывая более сильного значения превосходства.
- source_word: ἐν δόξῃ
  choice: славой
  rationale: Творительный падеж естественно обозначает признак, по которому одна звезда отличается от другой, сохраняя повтор слова «слава».
theological_decisions:
- issue: Передача δόξα в космологическом сравнении внутри рассуждения о воскресении
  choice: слава
  alternative: сияние; блеск
  rationale: Непосредственно речь идёт о видимом сиянии небесных тел, однако «слава» сохраняет лексическую и богословскую связь с окружающим рассуждением, не сводя смысл лишь к физической яркости.
