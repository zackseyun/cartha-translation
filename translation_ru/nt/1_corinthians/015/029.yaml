id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: ru
  text: Иначе что будут делать те, кто принимает крещение за умерших?[a] Если умершие вообще не воскресают, зачем тогда они принимают крещение за них?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради умерших», «из-за умерших»; менее вероятно: «над умершими». Греческий предлог допускает несколько смысловых оттенков, а точный характер упомянутой Павлом практики неизвестен.'
    reason: Лексическая неоднозначность ὑπέρ и неопределённость исторической практики.
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Иначе
  rationale: 'В данном контексте слово вводит следствие из предшествующего рассуждения Павла: если воскресения нет, упомянутая практика теряет смысл.'
- source_word: τί ποιήσουσιν
  choice: что будут делать
  rationale: Сохранены будущее время и широкий смысл ποιέω, без уточняющего толкования вроде «чего добьются».
- source_word: οἱ βαπτιζόμενοι
  choice: те, кто принимает крещение
  rationale: Настоящее страдательное причастие передано естественной русской конструкцией, обозначающей совершаемую или принятую практику и не выражающей оценки её правомерности.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: за умерших
  rationale: Предлог ὑπέρ с родительным падежом обычно означает действие ради кого-либо или в чьих-либо интересах. Русское «за умерших» кратко и естественно, но не устраняет известной неоднозначности выражения; другие возможные оттенки приведены в сноске.
- source_word: εἰ ὅλως
  choice: если ... вообще
  rationale: «Вообще» передаёт усилительное значение ὅλως в условном предложении.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: умершие ... не воскресают
  rationale: Так естественно передаётся воскресение мёртвых по-русски. Форма не уточняет действующее лицо и не добавляет отсутствующего в данном предложении прямого указания на Бога.
- source_word: τί καὶ
  choice: зачем тогда
  rationale: В повторном риторическом вопросе сочетание выражает следствие из поставленного условия; «зачем тогда» естественно передаёт ход аргумента.
- source_word: βαπτίζονται
  choice: они принимают крещение
  rationale: Формулировка согласована с первой частью стиха и сохраняет значение настоящего времени как указание на происходящую или обычную практику.
- source_word: ὑπὲρ αὐτῶν
  choice: за них
  rationale: Местоимение отсылает к умершим; повтор предлога «за» сохраняет параллель с первым упоминанием и не даёт практике дополнительного объяснения.
theological_decisions:
- issue: Смысл крещения «за умерших»
  choice: Сохранить минимально истолковывающую формулировку «принимает крещение за умерших», не определяя точный характер практики.
  alternative: «принимает крещение ради умерших», «принимает крещение из-за умерших» или, менее вероятно, «принимает крещение над умершими»
  rationale: Точный смысл выражения и историческая практика остаются спорными. Перевод сохраняет напряжение текста и риторическое использование Павлом этого примера в доводе о воскресении, не одобряя и не осуждая какую-либо реконструируемую практику.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и торжественно-нейтральный. «Умершие» звучит естественнее субстантивированного «мёртвые», а «принимать крещение» яснее и литературнее формы «креститься» в пассивном контексте.
