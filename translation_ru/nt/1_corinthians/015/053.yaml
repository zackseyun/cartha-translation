base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: ru
  text: Ибо это тленное тело должно облечься в нетление, и это смертное тело — в бессмертие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «это тленное должно облечься в нетление, и это смертное — в бессмертие». В греческом тексте этого стиха слово «тело» прямо не употреблено, хотя из контекста ясно, что речь идёт о теле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: надлежит
  rationale: Передаёт необходимость, о которой говорит Павел, и естественно сочетается с инфинитивом «облечься» в возвышенном, но понятном современном русском.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предыдущим стихом и естественно звучит в русском рассуждении.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: этому тленному телу
  rationale: «Тленное» точно передаёт подверженность разрушению; слово «тело» восполнено из ближайшего контекста о воскресении тела, чтобы избежать неясной субстантивации.
- source_word: ἐνδύσασθαι
  choice: облечься
  rationale: Сохраняет метафору надевания одежды и устойчиво сочетается с «в нетление» и «в бессмертие».
- source_word: ἀφθαρσίαν
  choice: нетление
  rationale: Традиционное и понятное существительное, точно противопоставленное «тленному» и обозначающее неподверженность распаду.
- source_word: καὶ
  choice: и
  rationale: Передаёт простое соединение двух параллельных частей.
- source_word: τὸ θνητὸν τοῦτο
  choice: этому смертному телу
  rationale: «Смертное» точно передаёт подверженность смерти; «тело» восполнено из контекста и поддерживает параллелизм.
- source_word: ἀθανασίαν
  choice: бессмертие
  rationale: Обычное и точное обозначение состояния неподверженности смерти, образующее ясную пару со словом «смертному».
theological_decisions:
- issue: Восполнение слова «тело», отсутствующего в греческом тексте стиха
  choice: Передать субстантивированные прилагательные как «этому тленному телу» и «этому смертному телу»
  alternative: «этому тленному надлежит облечься в нетление, и этому смертному — в бессмертие»
  rationale: В стихах 42–54 речь прямо идёт о воскресении и преображении тела. Восполнение проясняет подразумеваемый референт, не устраняя богословского напряжения между нынешним состоянием тела и его будущим преображением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Облечься» сохраняет метафору оригинала; «тление/нетление» обеспечивают точный параллелизм и остаются понятными в данном контексте.
