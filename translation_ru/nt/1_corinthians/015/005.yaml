lexical_decisions:
- source_word: ὤφθη
  choice: явился
  rationale: Аорист пассивной формы ὁράω в повествованиях о явлениях воскресшего Христа естественно передаётся по-русски возвратным глаголом «явился». Вариант «был увиден» формально отражает пассив, но звучит менее естественно и может сместить акцент на действие свидетеля.
- source_word: Κηφᾷ
  choice: Кифе
  rationale: Передана дательная форма имени Кифа, соответствующая греческому Κηφᾷ; имя не заменено более привычным «Петру», поскольку исходный текст использует именно арамейскую форму.
- source_word: εἶτα
  choice: затем
  rationale: Кратко и естественно обозначает последовательность явлений в передаваемом Павлом предании.
- source_word: τοῖς δώδεκα
  choice: двенадцати
  rationale: Сохранено буквальное групповое обозначение апостольского круга без гармонизации с другими повествованиями и без замены на «одиннадцати» или «апостолам».
- source_word: καὶ ὅτι
  choice: и что
  rationale: Сохраняет синтаксическую связь с рядом придаточных содержания в предыдущих стихах.
theological_decisions:
- issue: Язык явления воскресшего Христа
  choice: Он явился
  alternative: Он был увиден
  rationale: «Явился» естественно передаёт обычное для контекста воскресения употребление ὤφθη, утверждая видимое явление, но не уточняя его способ и не устраняя возможный пассивный оттенок исходной формы.
- issue: «Двенадцать» после отсутствия Иуды
  choice: двенадцати
  alternative: одиннадцати; апостолам
  rationale: Греческий текст сохраняет традиционное название апостольского круга. Перевод не подменяет его исторической реконструкцией и не гармонизирует с другими местами.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественно-нейтральная, соответствующая характеру раннего исповедального перечня. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской норме.
