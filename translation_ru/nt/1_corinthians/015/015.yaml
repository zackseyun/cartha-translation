source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: ru
  text: Тогда мы оказываемся ещё и лжесвидетелями о Боге[a], потому что свидетельствовали против Бога, что Он воскресил Мессию[b], которого Он не воскресил, если действительно мёртвые не воскресают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лжесвидетелями Бога». Греческий родительный падеж при «лжесвидетелях» может обозначать свидетельство о Боге; последующее выражение «свидетельствовали против Бога» передаёт другую, более определённую конструкцию с предлогом κατά.'
    reason: lexical_alternative
  - marker: b
    text: Греч. «Христа»; здесь Χριστός передано как титул «Мессия».
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: мы оказываемся
  rationale: 'Передаёт настоящее пассивное значение результата: при принятии оспариваемой посылки апостолы оказываются лжесвидетелями.'
- source_word: δὲ καὶ
  choice: тогда ... ещё и
  rationale: «Тогда» естественно выражает логический вывод, а «ещё и» сохраняет усилительно-присоединительное значение καί.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: лжесвидетелями против Бога
  rationale: «Лжесвидетели» точно передаёт судебную лексику; зависимость родительного τοῦ θεοῦ допускает понимание Бога как объекта свидетельства, а ближайшее κατὰ τοῦ θεοῦ поддерживает более сильное значение направленности против Него.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: свидетельствовали против Бога
  rationale: 'κατά с родительным обычно имеет значение «против»; формулировка сохраняет остроту довода Павла: апостолы приписали бы Богу то, чего Он не совершал.'
- source_word: ἤγειρεν τὸν Χριστόν
  choice: Он воскресил Мессию
  rationale: Аорист передан совершенным видом; Χριστός с артиклем здесь сохраняет титульное значение, поэтому переведено как «Мессия».
- source_word: ὃν οὐκ ἤγειρεν
  choice: которого Он не воскрешал
  rationale: Сохранены относительная конструкция и повтор того же глагола; несовершенный вид естественно выражает отрицание самого события при условии Павла.
- source_word: εἴπερ ἄρα
  choice: если действительно
  rationale: Передаёт условие, принимаемое ради аргумента, и его подчёркнутый характер.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: мёртвые не воскресают
  rationale: Естественная современная русская формулировка общего тезиса; возвратная форма передаёт пассивно-результативный смысл без тяжеловесного «не бывают воскрешены».
theological_decisions:
- issue: Значение κατὰ τοῦ θεοῦ
  choice: против Бога
  alternative: о Боге
  rationale: 'Чтение «против Бога» соответствует обычному значению κατά с родительным и сохраняет напряжённость аргумента: если воскресения нет, апостольское свидетельство не просто ошибочно говорит о Боге, но выступает против Него, приписывая Ему несовершённое действие. Возможное значение «о Боге» отмечено в сноске.'
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном аргументе форма с артиклем естественно воспринимается как титул; перевод «Мессия» раскрывает исходное значение, не добавляя конфессионального толкования.
- issue: Залог в νεκροὶ οὐκ ἐγείρονται
  choice: мёртвые не воскресают
  alternative: мёртвых не воскрешают
  rationale: Основной вариант звучит естественнее по-русски и сохраняет общий тезис о воскресении мёртвых; альтернатива формальнее подчёркивает внешнее действие, но менее плавна.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской аргументации. Сохранены логический ход, повтор глагола «воскресить» и резкая возможность свидетельства «против Бога»; неоднозначность вынесена в сноску.
