  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: ru
  text: 'Так и написано: «Первый человек, Адам, стал живым существом»[a]; последний Адам стал животворящим духом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живой душой» — традиционный перевод, перекликающийся с Быт. 2:7.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «духом, дающим жизнь». Здесь последний Адам противопоставлен первому; греческое выражение описывает его качество и не обязательно прямо отождествляет Христа со Святым Духом как отдельной Личностью.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: Так и написано
  rationale: Естественная русская формула цитирования Писания, сохраняющая связь с предшествующим рассуждением, выраженную οὕτως καί.
- source_word: Ἐγένετο
  choice: стал
  rationale: Передаёт возникновение нового состояния и соответствует смыслу γίνομαι в цитате из Бытия 2:7.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: первый человек
  rationale: Сохраняет буквальный и типологический контраст между первым человеком и последним Адамом.
- source_word: Ἀδὰμ
  choice: Адам
  rationale: Общепринятая русская форма личного имени.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: живым существом
  rationale: В контексте сотворения ψυχὴ ζῶσα означает живое, одушевлённое существо, а не обязательно отделимую нематериальную душу.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: последний Адам
  rationale: Сохраняет устойчивый эсхатологический и типологический контраст у Павла.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: животворящим духом
  rationale: Кратко и точно передаёт качественное, безартиклевое πνεῦμα и значение причастия ζῳοποιοῦν — «дающий жизнь, оживляющий».
theological_decisions:
- issue: Антропологический смысл ψυχὴ ζῶσα в цитате из Бытия
  choice: живым существом
  alternative: живой душой
  rationale: Выбранный перевод обозначает Адама как живое существо в целом и не навязывает тексту учение о душе как отдельной нематериальной части человека; традиционный вариант отмечен в сноске.
- issue: Смысл выражения «последний Адам стал животворящим духом»
  choice: Сохранить буквальный типологический контраст и написать «духом» со строчной буквы.
  alternative: последний Адам стал Духом, дающим жизнь
  rationale: Безартиклевое πνεῦμα имеет здесь качественную силу. Перевод не должен без пояснения превращать выражение в прямое отождествление Христа со Святым Духом как отдельной Личностью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Животворящий» несколько возвышенно, но широко понятно и точно сохраняет лаконизм и богословскую насыщенность греческого выражения.
