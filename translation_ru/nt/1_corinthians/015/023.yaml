  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: ru
  text: 'Но каждый — в своём порядке: Христос — начаток[a], затем, во время Его пришествия[b], — те, кто принадлежит Христу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мессия». «Христос» — греческий титул со значением «Помазанник»; «начаток» буквально связан с первыми плодами урожая.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово может также означать «присутствие» или «прибытие»; здесь оно относится к будущему пришествию Христа.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: каждый
  rationale: Передаёт распределительное значение и отсылает к последовательности воскресения в контексте.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: в своём порядке
  rationale: В контексте речь идёт об установленной последовательности; такой перевод сохраняет смысл, не усиливая возможный военный оттенок τάγμα.
- source_word: ἀπαρχὴ
  choice: первенец
  rationale: В данном контексте Христос представлен как первый из воскресших и залог последующего воскресения. «Первенец» естественнее по-русски применительно к лицу, хотя греческое слово буквально связано с первым плодом или начатком урожая.
- source_word: Χριστός
  choice: Христос
  rationale: В современном русском библейском и литературном употреблении «Христос» естественно сохраняет греческий титул и не превращает его в обычное имя; значение титула пояснено в сноске.
- source_word: οἱ τοῦ Χριστοῦ
  choice: те, кто принадлежит Христу
  rationale: Ясно выражает отношение принадлежности, переданное родительным падежом.
- source_word: ἐν τῇ παρουσίᾳ αὐτοῦ
  choice: во время Его пришествия
  rationale: В эсхатологическом контексте παρουσία обозначает будущее явление или прибытие Христа; «пришествие» точно и привычно передаёт это значение, не уточняя сверх текста характер события.
theological_decisions:
- issue: Образ ἀπαρχή применительно ко Христу
  choice: первенец
  alternative: начаток; первые плоды
  rationale: «Первенец» сохраняет мысль о Христе как первом в последовательности воскресения и звучит естественно применительно к лицу. Сельскохозяйственный и жертвенный образ оригинала сохранён в сноске, чтобы не утратить его интертекстуальную значимость.
- issue: Передача Χριστός как титула
  choice: Христос
  alternative: Мессия; Помазанник
  rationale: «Христос» — укоренившаяся русская форма титула Χριστός; сноска раскрывает его значение «Помазанник», не навязывая конфессионального толкования.
- issue: Эсхатологическое значение παρουσία
  choice: пришествие
  alternative: присутствие; прибытие
  rationale: Контекст указывает на будущее событие, при котором воскреснут принадлежащие Христу. «Пришествие» сохраняет эту направленность, тогда как возможные основные значения слова отмечены в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Тире помогают ясно представить две стадии последовательности. Заглавная буква в местоимении «Его» соответствует принятому русскому религиозно-литературному употреблению.
