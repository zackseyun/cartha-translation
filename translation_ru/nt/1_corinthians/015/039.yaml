  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: ru
  text: 'Не всякая плоть одинакова[a]: одна плоть у людей, другая — у животных, иная — у птиц, иная — у рыб.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Не всякая плоть — одна и та же плоть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὰρξ
  choice: плоть
  rationale: 'Здесь слово употреблено буквально: Павел сопоставляет телесную плоть разных живых существ. «Плоть» сохраняет ключевой термин и не привносит значения греховной природы.'
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: Не всякая плоть одинакова
  rationale: Естественная для современного русского языка передача категориального различия; буквальное повторение приведено в сноске.
- source_word: ἄλλη
  choice: другая / иная
  rationale: Передаёт различие между категориями; чередование близких русских слов сохраняет ритм перечисления и избегает тяжеловесного повторения.
- source_word: ἀνθρώπων
  choice: людей
  rationale: Обозначает людей вообще, а не только мужчин.
- source_word: κτηνῶν
  choice: животных
  rationale: В данном общем перечне это наиболее ясное обозначение наземных животных; «скот» неоправданно сужал бы смысл до домашнего скота.
- source_word: πτηνῶν
  choice: птиц
  rationale: Естественное контекстуальное обозначение летающих существ в этом перечне.
- source_word: ἰχθύων
  choice: рыб
  rationale: Прямая и естественная передача родительного падежа множественного числа.
theological_decisions:
- issue: Значение σάρξ в контексте воскресения
  choice: буквальное «плоть»
  alternative: «тело» или «греховная природа»
  rationale: Речь идёт о различиях телесной природы сотворённых существ, а не о нравственно-духовной склонности к греху. При этом «плоть» точнее сохраняет лексику Павла, чем «тело».
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, с сохранением буквального термина «плоть» и ритмического перечисления.
