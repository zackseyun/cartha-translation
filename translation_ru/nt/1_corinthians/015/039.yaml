  source_fidelity: Текст верно передаёт οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ как «Не всякая плоть одинакова» и сохраняет буквальное значение σάρξ («плоть») в перечне людей, животных, птиц и рыб. Русские эллиптические члены перечисления естественно подразумевают повтор слова «плоть», хотя в греческом оно повторено при животных и птицах.
