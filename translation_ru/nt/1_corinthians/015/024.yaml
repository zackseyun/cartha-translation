  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: ru
  text: А затем — конец[a], когда Он передаст Царство Богу Отцу[b], когда упразднит всякое начальство, всякую власть и всякую силу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завершение», «достижение цели». Греческое τέλος может означать конец, цель или окончательное завершение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «Богу и Отцу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «лишит силы», «сведёт на нет». Здесь имеется в виду прекращение действенной власти всякого начальства, власти и силы; само слово не обязательно означает их полное уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: А затем
  rationale: Передаёт следующий этап описанной Павлом последовательности и естественно связывает стих с предшествующим контекстом.
- source_word: τὸ τέλος
  choice: конец
  rationale: Сохраняет прямое эсхатологическое значение, не исключая оттенков завершения и достижения цели.
- source_word: ὅταν παραδιδῷ
  choice: когда Он передаст
  rationale: Передаёт будущее событие и смысл вручения или передачи царской власти.
- source_word: τὴν βασιλείαν
  choice: Царство
  rationale: Естественный русский эквивалент, способный обозначать и царство, и царствование; прописная буква уместна для Божьего Царства.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Богу Отцу
  rationale: 'Естественно передаёт наиболее вероятное приложительное понимание: Богу, то есть Отцу.'
- source_word: ὅταν καταργήσῃ
  choice: и упразднит
  rationale: Союз «и» естественно передаёт тесно связанные временные положения; «упразднит» означает лишить силы и положить конец действию, не утверждая непременно уничтожения сущности.
- source_word: πᾶσαν ἀρχὴν
  choice: всякое начальство
  rationale: Сохраняет абстрактно-институциональную и возможную личностную многозначность ἀρχή в перечне сверхъестественных или властных сил.
- source_word: πᾶσαν ἐξουσίαν
  choice: всякую власть
  rationale: Точный и привычный русский эквивалент для осуществляемой власти или полномочия.
- source_word: δύναμιν
  choice: силу
  rationale: Передаёт широкое значение могущества в заключительном элементе триады.
theological_decisions:
- issue: Соотношение слов «Бог» и «Отец» в τῷ θεῷ καὶ πατρί
  choice: 'Приложительное понимание: «Богу Отцу»'
  alternative: Богу и Отцу
  rationale: Контекст указывает на Отца как на Того, Кому Христос передаёт Царство; русский оборот ясен и не вносит дополнительных утверждений о природе Сына.
- issue: Смысл καταργήσῃ применительно к властным силам
  choice: «упразднит» — положит конец их действию и власти
  alternative: уничтожит; лишит силы; сведёт на нет
  rationale: Выбор сохраняет решительность действия, но не решает сверх текста вопрос о полном уничтожении этих сил.
- issue: Референт подлежащего при παραδιδῷ и καταργήσῃ
  choice: Заглавное «Он» указывает на Христа из ближайшего контекста
  alternative: Строчное «он»
  rationale: Русская издательская традиция допускает почтительное написание; оно облегчает отсылку, не добавляя имени в сам текст.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Тире подчёркивает последовательность «затем — конец». Повтор греческого ὅταν естественно свёрнут в однородные сказуемые «передаст… и упразднит», без изменения временного соотношения. Все сноски отмечены в основном тексте.
