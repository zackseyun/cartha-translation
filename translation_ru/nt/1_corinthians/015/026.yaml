  text: ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/026.yaml
  text: The last enemy to be abolished is death[a].
translation:
  language: ru
  text: Последний враг, который будет упразднён, — смерть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Последний враг, который будет уничтожен, — смерть».'
    reason: 'Лексическая альтернатива для καταργεῖται: «уничтожен» — допустимый традиционный перевод, тогда как основной текст подчёркивает прекращение силы и действия смерти.'
lexical_decisions:
- source_word: ἔσχατος
  choice: последний
  rationale: Прилагательное указывает на последнее место в последовательности и сохраняет эсхатологический порядок мысли Павла.
- source_word: ἐχθρὸς
  choice: враг
  rationale: Существительное обозначает противника или враждебную силу; слово «враг» естественно передаёт олицетворение смерти.
- source_word: καταργεῖται
  choice: будет упразднён
  rationale: Глагол означает лишение силы, устранение действия или прекращение существования как действенной силы. Будущее время естественно по-русски передаёт эсхатологическую последовательность контекста, а «упразднён» не уточняет сверх необходимого, каким именно образом смерть перестанет действовать.
- source_word: ὁ θάνατος
  choice: смерть
  rationale: Определённое существительное олицетворено как последний враг; в русском языке слово «смерть» без дополнительных определителей естественно передаёт и понятие, и враждебную силу.
theological_decisions:
- issue: Передача καταργεῖται применительно к окончательному поражению смерти
  choice: будет упразднён
  alternative: будет уничтожен
  rationale: Основной вариант сохраняет значение прекращения действия и лишения силы, не навязывая более узкого метафизического толкования. Традиционное «уничтожен» остаётся допустимой альтернативой и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная. Конструкция с придаточным делает смысл греческого порядка слов ясным, сохраняя акцент на смерти как последнем враге.
