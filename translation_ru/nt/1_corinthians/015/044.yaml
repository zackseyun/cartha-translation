  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: ru
  text: Сеется тело душевное, воскрешается тело духовное. Если есть тело душевное[a], есть и тело духовное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «природное тело» ... «духовное тело». «Душевное» здесь не означает просто эмоциональное. Павел противопоставляет не материальное тело нематериальному, а тело, живущее жизнью, свойственной человеку, телу, жизнь которого определяется духом — возможно, Божьим Духом.'
    reason: Лексическая альтернатива для ψυχικόν и пояснение противопоставления с πνευματικόν без снятия возможной связи с Божьим Духом.
lexical_decisions:
- source_word: σπείρεται
  choice: сеется
  rationale: Сохранён страдательный залог и образ посева, развиваемый Павлом в ближайшем контексте.
- source_word: σῶμα
  choice: тело
  rationale: Прямой и естественный эквивалент; в контексте речь идёт о телесном существовании человека в смерти и воскресении.
- source_word: ψυχικόν
  choice: природное
  rationale: Передаёт тело, принадлежащее к нынешней, обычной человеческой жизни, и сохраняет противопоставление духовному. Вариант «душевное» ближе по форме к ψυχή, но в современном русском легко понимается как «эмоциональное»; «физическое» ошибочно противопоставило бы материальное нематериальному.
- source_word: ἐγείρεται
  choice: восстаёт
  rationale: Естественно передаёт страдательную форму в контексте воскресения и сохраняет параллелизм с «сеется».
- source_word: πνευματικόν
  choice: духовное
  rationale: Прямой эквивалент, сохраняющий терминологию Павла и неоднозначность того, указывает ли определение на дух вообще или на Божьего Духа; слово не означает «бестелесное».
- source_word: Εἰ
  choice: если
  rationale: Сохраняет условную форму греческого текста, не заменяя её более толковательным «поскольку».
- source_word: καὶ
  choice: и
  rationale: 'В русской конструкции «есть и духовное» естественно выражает добавочное значение: существует также духовное тело.'
theological_decisions:
- issue: Противопоставление природного и духовного тела
  choice: Основной текст говорит о природном и духовном теле, не превращая противопоставление в различие между материальным телом и нематериальным существованием.
  alternative: «Душевное тело» и «духовное тело»; либо вводящее в заблуждение «физическое тело» и «нефизическое тело».
  rationale: 'Оба определения относятся к σῶμα — телу. Контраст касается характера и источника жизни: нынешней природной жизни и жизни, определяемой духом или Духом. Перевод сохраняет богословское напряжение и телесный характер воскресения.'
- issue: Референт πνευματικόν
  choice: Оставлено «духовное» без поясняющего добавления «оживляемое Духом» в основном тексте.
  alternative: «Оживляемое Духом» или «принадлежащее Духу».
  rationale: Греческое прилагательное допускает связь с Божьим Духом, особенно в богословии Павла, но само по себе не выражает развёрнутого толкования; буквальная форма лучше сохраняет эту смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом. Формы «сеется» и «восстаёт» сохраняют ритм и образность греческого текста; «природное» выбрано ради понятности, а более буквальное «душевное» вынесено в сноску.
