  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: ru
  text: Ведь если мёртвые не воскресают, то даже Мессия[a] не был воскрешён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческий титул Χριστός можно перевести как «Мессия» или, согласно давней традиции, как «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» естественно передаёт пояснительно-аргументативную функцию γάρ, а «если» сохраняет условие, выраженное εἰ.
- source_word: νεκροὶ
  choice: мёртвые
  rationale: Субстантивированное прилагательное во множественном числе обозначает умерших людей вообще; «мёртвые» — краткое и естественное соответствие.
- source_word: οὐκ ἐγείρονται
  choice: не воскресают
  rationale: В русском языке это обычное выражение для воскресения мёртвых. Хотя греческая форма страдательная, буквальное «не воскрешаются» здесь звучало бы тяжеловесно; контекст сохраняет подразумеваемое действие Бога.
- source_word: οὐδὲ
  choice: то и … не
  rationale: 'В условной русской конструкции сочетание «то и … не» естественно передаёт усиленное следствие: в таком случае даже Мессия не был воскрешён.'
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт значение титула «Помазанник», заметное в богословском рассуждении Павла; традиционный вариант «Христос» сохранён в сноске.
- source_word: οὐδὲ Χριστὸς ἐγήγερται
  choice: то и Мессия не был воскрешён
  rationale: Греческий перфект страдательного залога обозначает совершившееся действие с сохраняющимся результатом. «Не был воскрешён» ясно сохраняет страдательный залог и завершённость действия.
theological_decisions:
- issue: Передача титула Χριστός в рассуждении о воскресении
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» раскрывает титульное значение греческого Χριστός, не превращая его автоматически в имя. Оба варианта укоренены в христианской традиции, поэтому традиционная форма указана в сноске.
- issue: Страдательный залог в ἐγήγερται
  choice: не был воскрешён
  alternative: не воскрес
  rationale: Выбранный вариант не уточняет прямо действующее лицо, но сохраняет грамматически выраженную мысль, что воскресение совершено над Мессией; вариант «не воскрес» был бы естественнее, однако скрывал бы страдательный залог.
translation_notes:
  register: Современный литературный русский язык с краткой и ясной аргументативной структурой. «Ведь» поддерживает связь с предыдущим рассуждением, а «то» естественно оформляет следствие. Формулировка «не был воскрешён» несколько более формальна, но оправдана необходимостью сохранить страдательный залог греческого текста.
