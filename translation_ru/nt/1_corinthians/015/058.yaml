source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: ru
  text: Итак, мои возлюбленные братья[a], будьте стойкими, непоколебимыми, всегда с избытком трудитесь в деле Господа, зная, что ваш труд в Господе не напрасен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «братья», в таком обращении может обозначать всех верующих — и мужчин, и женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Итак
  rationale: Передаёт вывод, который Павел делает из предшествующего рассуждения о воскресении, и естественно звучит в современном русском языке.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: мои возлюбленные братья
  rationale: Сохраняет грамматически мужскую форму ἀδελφοί и прямо передаёт ἀγαπητοί; собирательное значение, охватывающее всю общину, пояснено в сноске.
- source_word: ἑδραῖοι γίνεσθε
  choice: будьте стойкими
  rationale: Русская форма повелительного наклонения естественно выражает призыв пребывать или становиться твёрдыми; «стойкими» передаёт укоренённость и постоянство без неестественного буквализма.
- source_word: ἀμετακίνητοι
  choice: непоколебимыми
  rationale: Передаёт образ того, кого невозможно сдвинуть с занятой позиции, и хорошо сочетается со словом «стойкими».
- source_word: περισσεύοντες
  choice: преуспевайте
  rationale: В данном контексте означает не просто участие, а постоянное изобилие и рост в деле Господа; «преуспевайте» — краткий и укоренившийся русский эквивалент, хотя не сводит смысл к достижению внешнего успеха.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: в деле Господа
  rationale: Сохраняет широкое значение ἔργον и генитивную связь, не сужая выражение до церковного служения или отдельного вида деятельности.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой и естественный эквивалент, сохраняющий непрерывный характер призыва.
- source_word: εἰδότες
  choice: зная
  rationale: Сохраняет причастную связь с увещанием и не делает причинный оттенок более явным, чем в греческом тексте.
- source_word: ὁ κόπος ὑμῶν
  choice: ваш труд
  rationale: «Труд» передаёт напряжённое, тягостное усилие, заложенное в κόπος, и звучит естественно и достойно.
- source_word: οὐκ ἔστιν κενὸς
  choice: не напрасен
  rationale: Идиоматично выражает отсутствие тщетности и бесплодности, соответствуя контексту главы о воскресении.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерную для Павла ёмкую формулу, не ограничивая её только значением средства, причины или союза.
theological_decisions:
- issue: Кого обозначает ἀδελφοί
  choice: В основном тексте — «братья», а собирательное включение женщин пояснено в сноске.
  alternative: братья и сёстры
  rationale: Греческое слово имеет форму мужского рода, но в обращении к общине может охватывать всех верующих. Основной текст сохраняет форму источника, а сноска предупреждает ошибочно узкое прочтение.
- issue: Связь заключительного ἐν κυρίῳ
  choice: «ваш труд в Господе не напрасен»
  alternative: ваш труд не напрасен благодаря Господу
  rationale: Фраза естественно характеризует труд верующих как совершаемый «в Господе»; буквальная ёмкость формулы сохранена без сведения её к одной причинной трактовке.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — естественный и богословски ёмкий русский эквивалент κύριος в данном христологическом контексте.
translation_notes:
  register: Современный литературный русский язык с достойным увещательным тоном. Синтаксис сохраняет движение одной греческой фразы, но остаётся ясным для обычного читателя; богословски насыщенное выражение «в Господе» намеренно не развёрнуто в толкование.
