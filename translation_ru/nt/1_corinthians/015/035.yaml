  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: ru
  text: 'Но кто-нибудь скажет: «Как воскрешаются мёртвые[a] и с каким телом они приходят?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как воскресают мёртвые?» В греческом тексте глагол стоит в пассивной форме — буквально «воскрешаются», что может подразумевать действие Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Но
  rationale: Передаёт контрастный переход к предполагаемому возражению или вопросу.
- source_word: ἐρεῖ τις
  choice: кто-нибудь скажет
  rationale: Сохраняет будущее время и естественно вводит гипотетического собеседника.
- source_word: Πῶς ἐγείρονται οἱ νεκροί
  choice: Как воскрешаются мёртвые
  rationale: Вопросительное «как» сохраняет вопрос о способе или возможности, а возвратно-пассивная форма «воскрешаются» передаёт грамматический пассив исходного текста, не называя действующее лицо.
- source_word: ποίῳ ... σώματι
  choice: с каким телом
  rationale: В современном русском языке эта конструкция естественно выражает вопрос о том, какого рода или свойства будет тело.
- source_word: δὲ
  choice: и
  rationale: Здесь частица связывает второй вопрос с первым без выраженного противопоставления.
- source_word: ἔρχονται
  choice: они приходят
  rationale: Прямо передаёт глагол «приходить», не подменяя его толкованием «являются» или повтором «воскрешаются».
theological_decisions:
- issue: Формулировка воскресения и подразумеваемое действующее лицо
  choice: Как воскрешаются мёртвые
  alternative: Как воскресают мёртвые
  rationale: Пассивная форма исходного текста сохранена, поскольку она может подразумевать действие Бога, однако действующее лицо не названо прямо, как и в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; риторическая формула передана естественно, при этом сохранены пассивная форма первого вопроса и буквальный образ «приходят» во втором.
