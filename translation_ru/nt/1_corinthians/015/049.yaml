  source_fidelity: Основной текст верно передаёт сопоставительную конструкцию, аорист ἐφορέσαμεν («носили»), будущее изъявительное φορέσομεν («будем носить»), а также образ «человека из праха» и «небесного человека». Текстовый вариант в сноске следует сохранить как увещательное чтение, а не как ещё одно будущее утверждение.
  naturalness: Фраза естественна для современного литературного русского и сохраняет торжественный, но не архаичный библейский регистр. Парная конструкция «как … так» удачна.
  terminology: «Образ», «человек из праха» и «небесный человек» точны и сохраняют контекстуальный контраст Адама и Христа. Прописная буква в «Человека» не требуется исходным текстом и вносит интерпретационное выделение; строчная буква лучше сохраняет форму и сдержанность оригинала.
  issues:
