    rationale: Греческий текст не маркирует это выражение как имя собственное. Контекст действительно соотносит небесного человека с Христом, но строчная буква в русском тексте сохраняет это контекстуальное значение без дополнительного типографического богословского толкования.
  - severity: medium
    issue: Сноска недостаточно ясно отличает увещательное вариантное чтение от будущего изъявительного в основном тексте.
    rationale: «Будем же носить» может быть прочитано и как будущее, и как призыв. Формулировка «Будем же и мы носить…» в кавычках естественно выражает русское совместное побуждение и яснее передаёт φορέσωμεν («будем/давайте носить»).
