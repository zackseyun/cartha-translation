base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: ru
  text: И как мы носили образ человека из праха, так будем носить и образ небесного человека.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Будем же и мы носить образ небесного человека».'
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: как … так
  rationale: Русская парная конструкция естественно и ясно передаёт сопоставление двух состояний человека.
- source_word: ἐφορέσαμεν
  choice: мы носили
  rationale: Аорист передан прошедшим временем; глагол «носили» сохраняет образ постоянного несения облика и не сужает смысл до внешнего сходства.
- source_word: εἰκόνα
  choice: образ
  rationale: Обычный и контекстуально точный эквивалент εἰκών, сохраняющий типологическую связь Адама и Христа.
- source_word: τοῦ χοϊκοῦ
  choice: человека из праха
  rationale: Передаёт значение «сделанный из праха» и отсылку к сотворению Адама; слово «человека» восполнено из непосредственного контекста.
- source_word: φορέσομεν
  choice: будем носить
  rationale: Передаёт будущее изъявительное наклонение печатного текста SBLGNT и обещание будущего преображения.
- source_word: τοῦ ἐπουρανίου
  choice: небесного Человека
  rationale: Восполнение «Человека» сохраняет параллель с «человеком из праха» и непосредственный контекст; прописная буква естественно указывает на Христа без добавления имени в текст.
- source_word: καὶ
  choice: и
  rationale: Во второй части передаёт присоединительное значение καί, не утяжеляя русскую фразу повторным наречием «также».
theological_decisions:
- issue: Будущее изъявительное или увещательное сослагательное наклонение во втором глаголе
  choice: будем носить
  alternative: будем же носить / давайте носить
  rationale: Основной текст SBLGNT читает φορέσομεν, будущее изъявительное. Значимый вариант φορέσωμεν сохранён в сноске, чтобы не скрывать текстологическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. «Из праха» понятно обычному читателю и сохраняет связь с Быт 2:7; симметрия двух частей стиха удержана.
