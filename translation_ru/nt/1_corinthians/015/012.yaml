source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: ru
  text: Если же возвещается, что Мессия[a] был воскрешён из мёртвых, то как некоторые из вас говорят, что воскресения мёртвых нет?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός можно передать и как «Мессия», и как «Христос»; в основном тексте передан смысл титула.'
    reason: Альтернативная передача Χριστός.
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: В данном рассуждении слово сохраняет смысл титула; «Мессия» передаёт его значение, а не просто транслитерирует традиционную форму «Христос».
- source_word: κηρύσσεται
  choice: проповедуется
  rationale: Форма настоящего времени в страдательном залоге обозначает продолжающееся публичное возвещение; «проповедуется» естественно для современного русского библейского регистра.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устойчивое и точное русское выражение для воскресения из числа умерших.
- source_word: ἐγήγερται
  choice: воскрешён
  rationale: Перфект страдательного залога указывает на совершившееся действие с сохраняющимся результатом и не превращает пассивную форму в «воскрес».
- source_word: πῶς
  choice: как
  rationale: В сочетании с вопросительной конструкцией передаёт риторическое недоумение без необходимости добавлять отсутствующий в греческом модальный глагол.
- source_word: ἐν ὑμῖν τινες
  choice: некоторые из вас
  rationale: Естественно по-русски обозначает часть коринфской общины и сохраняет внутреннюю отнесённость к адресатам.
- source_word: ἀνάστασις νεκρῶν
  choice: воскресение мёртвых
  rationale: Передаёт родительный оборот и общее воскресение умерших, о котором идёт речь.
- source_word: οὐκ ἔστιν
  choice: нет
  rationale: Краткий естественный экзистенциальный эквивалент греческого выражения.
theological_decisions:
- issue: Передача Χριστός в рассуждении Павла
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово можно понимать как значимый титул. Основной текст передаёт его смысл, а традиционный вариант сохраняется в примечании, не устраняя допустимую неоднозначность.
- issue: Залог ἐγήγερται
  choice: воскрешён
  alternative: воскрес
  rationale: Сохранён грамматический пассив, который не называет действующее лицо прямо и тем самым не добавляет его в текст.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сохраняет условно-риторическую структуру греческого текста; вводное δέ передано как «же», без добавления временного «теперь».
