  naturalness: Исправленный вариант сохраняет современный литературный и достойный библейский регистр. «Возвещается» естественно передаёт κηρύσσεται как публичное провозглашение; «некоторые из вас» и «воскресения мёртвых нет» звучат по-русски ясно и точно.
  terminology: «Мессия» обоснованно передаёт титульный смысл Χριστός; традиционный вариант «Христос» следует оставить в примечании. «Воскрешён» сохраняет пассивный залог, не называя действующее лицо. «Воскресение мёртвых» точно передаёт ἀνάστασις νεκρῶν.
