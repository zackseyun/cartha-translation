  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: ru
  text: Итак, будь то я или они, так мы возвещаем[a], и так вы уверовали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с явным указанием на содержание: «это мы возвещаем, и в это вы уверовали».'
    reason: Повторённое οὕτως может обозначать как «так, таким образом», так и содержание только что изложенной вести.
lexical_decisions:
- source_word: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι
  choice: Итак, я ли, они ли
  rationale: Сочетание «ли… ли» естественно передаёт соотносительные εἴτε… εἴτε, а «итак» выражает выводное значение οὖν и связывает стих с предшествующим перечислением свидетелей воскресения.
- source_word: ἐκεῖνοι
  choice: они
  rationale: Местоимение отсылает к другим апостолам и свидетелям, названным выше; «они» сохраняет контекстуальную определённость, не добавляя пояснения в основной текст.
- source_word: οὕτως … οὕτως
  choice: так … так
  rationale: Одинаковый перевод сохраняет намеренный параллелизм греческого текста и не устраняет двусмысленность между образом действия и содержанием возвещения и веры.
- source_word: κηρύσσομεν
  choice: мы возвещаем
  rationale: Глагол обозначает публичное провозглашение; «возвещаем» передаёт эту мысль в современном литературном и торжественном регистре.
- source_word: ἐπιστεύσατε
  choice: вы уверовали
  rationale: Аорист указывает на состоявшийся в прошлом отклик коринфян; «уверовали» кратко передаёт начало их веры без добавления отсутствующего в тексте объекта.
theological_decisions:
- issue: Единство апостольского возвещения
  choice: Стих утверждает, что Павел и другие упомянутые свидетели возвещают одно и то же и что именно так уверовали коринфяне.
  alternative: Понимать повторённое «так» прежде всего как указание на одинаковый способ проповеди и веры.
  rationale: Повтор οὕτως связывает возвещение и веру с изложенным выше содержанием благой вести, но само слово допускает также оттенок образа действия; перевод «так» сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире делает краткое противопоставление естественным по-русски; повтор «так» сохраняет ритм и структуру оригинала.
