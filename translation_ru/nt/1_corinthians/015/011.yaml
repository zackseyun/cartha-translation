  rationale: Заменена лишь менее естественная русская корреляция «я ли, они ли» на «будь то я или они». Сохранены выводное «итак», повтор «так», коллективное «мы возвещаем» и прошедшее «вы уверовали». Сноска оставлена как уместная передача возможного содержательного оттенка повторённого οὕτως; её якорь перенесён к первому «так», поскольку примечание относится к обоим параллельным употреблениям.
