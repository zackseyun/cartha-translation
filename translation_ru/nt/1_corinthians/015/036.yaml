  text: ⸀ἄφρων, σὺ ὃ σπείρεις, οὐ ζῳοποιεῖται ἐὰν μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: ru
  text: Безрассудный[a]! То, что ты сеешь, не оживёт[b], если не умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Глупец!»; «Неразумный!»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет оживлено»; «не получит жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: Безрассудный
  rationale: Передаёт прямое и резкое обращение в звательном употреблении, оставаясь естественным для современного литературного русского языка; «глупец» звучало бы более жёстко и как существительное-наименование.
- source_word: σὺ
  choice: ты
  rationale: Явное местоимение сохраняет греческое эмфатическое σὺ и естественно включается в придаточное «что ты сеешь».
- source_word: ὃ σπείρεις
  choice: то, что ты сеешь
  rationale: Точно сохраняет образ сеяния и предметную отсылку относительного местоимения; формулировка естественна и понятна.
- source_word: οὐ ζῳοποιεῖται
  choice: не оживёт
  rationale: Естественно передаёт обретение жизни в русском языке. Греческая форма — настоящее страдательного залога, однако буквальное «не оживляется» здесь неестественно; вариант «не будет оживлено» формальнее, но тяжелее и может чрезмерно подчёркивать внешнего деятеля.
- source_word: ἐὰν μὴ
  choice: если не
  rationale: Естественно передаёт отрицательное условие; «пока не» добавило бы временной оттенок, не выраженный конструкцией напрямую.
- source_word: ἀποθάνῃ
  choice: не умрёт
  rationale: Совершенный вид в условной конструкции передаёт аорист сослагательного наклонения без добавления отсутствующего в тексте слова «сначала».
theological_decisions:
- issue: Связь смерти посеянного с воскресением
  choice: Сохранён земледельческий образ без его развёртывания в отдельную доктринальную формулу.
  alternative: Прямо истолковать смерть семени как телесную смерть, а оживление — как воскресение тела.
  rationale: В контексте Павел использует этот образ в рассуждении о воскресении, но сам стих выражает его как краткую земледельческую аналогию; перевод не должен добавлять пояснений, которых нет в тексте.
- issue: Страдательный оттенок ζῳοποιεῖται
  choice: В основном тексте употреблено естественное русское «оживёт», а страдательный вариант отмечен в сноске.
  alternative: «Не будет оживлено».
  rationale: Греческий страдательный залог допускает подразумеваемого жизнедателя, но стих его не называет. Основной вариант не навязывает уточнения деятеля, а сноска сохраняет формальную особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и резкостью, соответствующей апостольскому возражению. Восклицательный знак естественно оформляет отдельное обращение; земледельческая метафора сохранена без поясняющих добавлений.
