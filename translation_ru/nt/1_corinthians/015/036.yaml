  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: резкое обращение ἄφρων, эмфатически выраженное «ты», предмет сеяния, отрицание ζῳοποιεῖται и условие ἐὰν μὴ ἀποθάνῃ. Будущее «не оживёт ... если не умрёт» естественно выражает общий принцип, заключённый в греческой условной конструкции, не добавляя слова «сначала» или иного толкования.'
  naturalness: Фраза звучит естественно на современном литературном русском. «Безрассудный!» сохраняет прямоту обращения, не превращая его в неоправданно грубое оскорбление. Параллельные формы «не оживёт — не умрёт» кратки, ясны и уместны в афористическом земледельческом образе.
  terminology: «Сеешь» верно сохраняет образ σπείρεις. «Оживёт» удачно передаёт обретение жизни, не называя отсутствующего в стихе деятеля; сноска корректно отмечает более формально страдательный вариант «не будет оживлено». Варианты к «Безрассудный» допустимы и не навязывают богословского истолкования.
