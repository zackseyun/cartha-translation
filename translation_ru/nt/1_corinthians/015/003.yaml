  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: ru
  text: 'Ведь я передал вам прежде всего то, что и сам принял: Мессия умер за наши грехи согласно Писаниям[a][b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос умер за наши грехи». Греческий титул Χριστός также традиционно передаётся словом «Христос».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в соответствии с Писаниями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρέδωκα
  choice: я передал
  rationale: Глагол обозначает передачу принятого учения или предания; «передал» естественно по-русски и сохраняет смысл авторитетной передачи.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущей мысли; «ведь» естественно передаёт её пояснительную функцию.
- source_word: ἐν πρώτοις
  choice: как самое важное
  rationale: В данном контексте выражение, вероятнее всего, указывает на первостепенную важность сообщаемого, а не только на временную очередность.
- source_word: ὃ καὶ παρέλαβον
  choice: то, что и сам принял
  rationale: Сохраняется параллель между получением и передачей предания; «сам» естественно подчёркивает, что Павел прежде получил передаваемое им.
- source_word: Χριστὸς
  choice: Мессия
  rationale: В кратком исповедальном изложении слово сохраняет титульный смысл; «Мессия» прямо передаёт этот смысл, тогда как традиционное «Христос» дано в примечании.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Аорист сообщает о совершившемся событии и естественно передаётся русским прошедшим временем.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: за наши грехи
  rationale: Формулировка сохраняет широкий смысл греческого ὑπέρ в контексте спасения и не навязывает более узкую теорию искупления.
- source_word: κατὰ τὰς γραφάς
  choice: согласно Писаниям
  rationale: Передаёт соответствие Писаниям и сохраняет множественное число греческого γραφάς.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово входит в исповедальную формулу и имеет заметную титульную силу; альтернативное традиционное соответствие сохранено в сноске.
- issue: Смысл ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: за наши грехи
  alternative: ради наших грехов
  rationale: Выбранная формулировка утверждает спасительное значение смерти Мессии, не уточняя сверх текста, идёт ли речь о причине, представительстве или конкретном механизме искупления.
- issue: Значение ἐν πρώτοις
  choice: как самое важное
  alternative: прежде всего
  rationale: Контекст поддерживает первенство по значимости; вариант «прежде всего» мог бы быть понят преимущественно как указание на последовательность.
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным регистром. Синтаксический параллелизм «передал — принял» сохранён. Формула «как самое важное» делает явным вероятный смысл первостепенной значимости; титульное «Мессия» сопровождено традиционным вариантом в сноске.
