lexical_decisions:
- source_word: κέντρον
  choice: жало
  rationale: В образе олицетворённой смерти слово обозначает остриё, которым она поражает; «жало» естественно продолжает образ предыдущего стиха и сохраняет метафору.
- source_word: θανάτου
  choice: смерти
  rationale: 'Родительный падеж прямо передаёт принадлежность или связь: жало, которым обладает смерть.'
- source_word: ἁμαρτία
  choice: грех
  rationale: 'Сохранено единственное число: Павел говорит не только об отдельных проступках, но и о грехе как действующей силе.'
- source_word: δύναμις
  choice: сила
  rationale: «Сила» естественно передаёт способность или действенность, которую закон сообщает греху в рассуждении Павла; возможен также оттенок «мощи».
- source_word: νόμος
  choice: закон
  rationale: 'Строчная буква сохраняет открытость формулировки: вероятна прежде всего отсылка к Моисееву закону, но греческий текст допускает и более широкий смысл роли закона.'
- source_word: δὲ
  choice: а
  rationale: Первое δέ не требует отдельного вводного слова по-русски, тогда как второе естественно передаётся союзом «а», связывающим и сопоставляющим две части высказывания без резкого противопоставления.
theological_decisions:
- issue: Значение слова «закон» в утверждении о силе греха
  choice: «закон» со строчной буквы, без уточняющего определения
  alternative: «Закон» как однозначное обозначение Моисеева закона; либо закон как общий принцип
  rationale: 'Ход мысли Павла особенно указывает на Моисеев закон, однако сама формулировка допускает более широкий смысл: закон обнаруживает грех и усиливает его действие. Перевод не снимает эту богословскую напряжённость.'
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура оригинала сохранена с помощью именных сказуемых и тире. Формулировка звучит торжественно, но остаётся понятной обычному читателю.
