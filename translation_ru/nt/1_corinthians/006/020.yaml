base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: ru
  text: Ведь вы были куплены ценой[a]. Так прославьте же[b] Бога в своём теле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куплены за плату». Греческое выражение сохраняет образ покупки и уплаченной цены.'
    reason: lexical_alternative
  - marker: b
    text: 'Частица, переданная словом «же», усиливает повеление. Слово «так» выражает переход от основания к призыву; частицу можно не передавать отдельно: «Так прославьте Бога…»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: вы куплены
  rationale: Аорист страдательного залога от ἀγοράζω передан буквально и естественно для русского языка; сохраняется образ покупки, не заменённый более узким богословским термином «искуплены».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание предшествующего наставления; «ведь» естественно выражает эту пояснительно-причинную связь в современном русском языке.
- source_word: τιμῆς
  choice: за цену
  rationale: Родительный цены при ἀγοράζω обозначает уплаченную стоимость. Формулировка намеренно сохраняет торговый образ и не добавляет отсутствующего в греческом тексте определения «дорогой».
- source_word: δοξάσατε
  choice: прославьте
  rationale: Аорист повелительного наклонения передан прямым призывом к решительному действию; «прославьте» сохраняет смысл и богословскую насыщенность δοξάζω.
- source_word: δὴ
  choice: же
  rationale: После «поэтому» частица «же» передаёт усиление и настоятельность призыва, не превращая δὴ исключительно в логическое следствие.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: в своём теле
  rationale: Сохраняются конкретное «тело» и предлог «в». Единственное число при обращении к группе передано распределительным русским оборотом «в своём теле», относящим призыв к каждому адресату.
theological_decisions:
- issue: Торговый образ спасения
  choice: 'Сохранить метафору покупки: «вы куплены за цену»'
  alternative: «вы искуплены дорогой ценой»
  rationale: Греческий текст прямо использует лексику покупки. Выбранный вариант не подменяет образ термином «искуплены» и не добавляет определения «дорогой», хотя контекст допускает представление о высокой цене.
- issue: Телесный характер нравственного призыва
  choice: Передать σῶμα конкретным словом «тело»
  alternative: «всей своей жизнью» или «самими собой»
  rationale: Ближайший контекст касается полового поведения и тела, поэтому конкретный перевод сохраняет ход рассуждения Павла и не расширяет смысл парафразом.
- issue: Значение частицы δὴ
  choice: Передать одновременно переход и настоятельность сочетанием «поэтому… же»
  alternative: Передать только «итак» либо оставить частицу без отдельного соответствия
  rationale: δὴ может усиливать повеление и поддерживать вывод из предыдущего утверждения. Выбранная формулировка сохраняет обе стороны, а примечание отмечает допустимую более сжатую передачу.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повелением. Не вполне обычное сочетание «куплены за цену» сохранено ради прозрачности исходного торгового образа; сноска предлагает более сжатый вариант. «В своём теле» естественно передаёт распределительное единственное число при множественном адресате.
