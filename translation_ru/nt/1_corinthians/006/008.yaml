lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущей мысли естественным для русского языка союзом.
- source_word: ὑμεῖς
  choice: вы сами
  rationale: Отдельно выраженное греческое местоимение несёт эмфазу; «вы сами» подчёркивает ответственность коринфян.
- source_word: ἀδικεῖτε
  choice: поступаете несправедливо
  rationale: Сохраняет широкий нравственно-правовой смысл глагола, не уточняя без основания объект или конкретный вид проступка.
- source_word: ἀποστερεῖτε
  choice: обираете
  rationale: В данном контексте передаёт лишение другого того, что ему принадлежит или причитается; звучит современно и ясно, не усиливая значение до открытого грабежа.
- source_word: καὶ τοῦτο
  choice: — притом
  rationale: 'Передаёт риторическое усиление: особенно предосудительно, что так поступают именно с членами общины.'
- source_word: ἀδελφούς
  choice: братьев
  rationale: Сохраняет грамматически мужскую форму исходного слова; примечание поясняет возможное более широкое обозначение единоверцев.
theological_decisions:
- issue: Значение ἀδελφούς в контексте христианской общины
  choice: братьев
  alternative: братьев и сестёр; единоверцев
  rationale: Греческое слово имеет форму мужского рода, но в обращении к общине может охватывать верующих обоих полов. Основной текст сохраняет форму оригинала, а примечание — её контекстуальный диапазон.
translation_notes:
  register: Современный литературный русский язык с краткой, обличительной интонацией. Тире и «притом» сохраняют риторический акцент греческого καὶ τοῦτο. Притяжательное «своих» не добавлено, поскольку его нет в исходном тексте; принадлежность к общине ясна из слова «братьев» и контекста.
