  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: ru
  text: 'К стыду вашему говорю: неужели среди вас нет ни одного мудрого человека, который сможет рассудить между братьями?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: К стыду вашему
  rationale: Оборот сохраняет направленную на адресатов силу упрёка и звучит естественно в достойном современном русском регистре.
- source_word: λέγω
  choice: говорю
  rationale: Настоящее время непосредственно передаёт форму греческого глагола и вводит упрёк Павла.
- source_word: οὕτως οὐκ ἔνι ἐν ὑμῖν
  choice: неужели среди вас нет
  rationale: «Неужели» естественно выражает возмущённый риторический вопрос; «среди вас» ясно указывает на общину.
- source_word: οὐδεὶς σοφὸς
  choice: ни одного мудрого человека
  rationale: Передаёт усиленное отрицание, не ограничивая применение мужским полом; субстантивированное прилагательное в контексте относится к члену смешанной общины.
- source_word: δυνήσεται
  choice: смог бы
  rationale: В русском риторическом вопросе условная форма естественно передаёт предполагаемую способность, выраженную греческим будущим временем.
- source_word: διακρῖναι
  choice: рассудить
  rationale: В контексте тяжбы означает вынести решение или разрешить спор; «рассудить» сохраняет судебный оттенок без излишне технического «выступить арбитром».
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: между братьями
  rationale: 'Греческий оборот после «рассудить» эллиптичен: названа одна сторона, а другая подразумевается. Русское «между братьями» естественно передаёт спор между членами общины, не добавляя явно отсутствующего «и другим».'
theological_decisions:
- issue: Мужской род и семейное обозначение членов смешанной общины
  choice: мудрого человека ... между братьями
  alternative: мудреца ... между братом своим и другим
  rationale: «Мудрого человека» позволяет передать собирательное применение οὐδεὶς σοφός ко всей общине, а «братьями» сохраняет семейный образ верующих. Контекст допускает участие как мужчин, так и женщин, но стих не требует разворачивать это пояснение в основном тексте.
- issue: Эллипсис в выражении ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: между братьями
  alternative: между братом своим и другим
  rationale: Вторая сторона спора подразумевается, но не названа. Выбранная формулировка сохраняет смысл и не вносит в основной текст дополнительного участника посредством явного добавления.
translation_notes:
  register: Современный литературный русский язык с кратким, резким упрёком. Синтаксис риторического вопроса естественен для широкой аудитории; сохранён общинно-семейный образ «братьев» и судебный оттенок глагола «рассудить».
