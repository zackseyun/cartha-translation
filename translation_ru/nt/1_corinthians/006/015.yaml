source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: ru
  text: Разве вы не знаете, что ваши тела — члены Христа[a]? Так неужели мне взять члены Христа и сделать их членами проститутки? Да не будет этого[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помазанника». Греческое Χριστός может восприниматься и как титул со значением «Помазанник», и как ставшее именеподобным обозначение «Христос».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Ни в коем случае!» Греческое выражение передаёт решительное отвержение самой мысли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: тела
  rationale: Множественное число обозначает реальную телесность верующих; «тела» прямо и естественно передаёт смысл в контексте рассуждения о половой безнравственности.
- source_word: μέλη
  choice: члены
  rationale: Слово сохраняет повторяющийся образ частей тела, принадлежащих целому, и одновременно традиционно и понятно звучит в богословском контексте. Более пояснительное «части тела» добавляло бы слово, которого в греческом тексте здесь нет.
- source_word: Χριστοῦ
  choice: Христа
  rationale: В современном русском «Христос» является обычным и узнаваемым соответствием Χριστός; форма родительного падежа точно передаёт принадлежность, не решая сверх необходимого, воспринимается ли слово здесь преимущественно как титул или как имя.
- source_word: ἄρας
  choice: возьму
  rationale: Причастие включено в единый риторический вопрос вместе с личной формой ποιήσω. Русское «возьму ... и сделаю» естественно передаёт задуманное действие и его возмутительный характер.
- source_word: ποιήσω
  choice: сделаю
  rationale: 'Прямой перевод сохраняет резкость параллели: сделать члены Христа членами проститутки.'
- source_word: πόρνης
  choice: проститутки
  rationale: πόρνη в данном контексте конкретно обозначает проститутку. Современное слово точнее и понятнее архаичного «блудница».
- source_word: μὴ γένοιτο
  choice: Да не будет этого!
  rationale: Устойчивое русское выражение передаёт не простое отрицание, а сильное, эмоциональное отвержение самой мысли.
- source_word: οὐκ οἴδατε
  choice: Разве вы не знаете
  rationale: Форма естественно передаёт риторический вопрос и обращение Павла к знанию, которое уже должно быть у читателей.
theological_decisions:
- issue: Смысл Χριστός в высказывании о телесном единстве
  choice: Христа
  alternative: Помазанника
  rationale: «Христос» естественно для современного русского библейского текста и сохраняет традиционную форму греческого титула, ставшую именеподобным обозначением. Смысл титула отмечен в сноске, поскольку контекст сам по себе не требует полностью сводить слово ни к имени, ни только к переведённому титулу.
- issue: Сила выражения μὴ γένοιτο
  choice: Да не будет этого!
  alternative: Ни в коем случае!
  rationale: Выбранная формулировка сохраняет оптативный оттенок и предельно сильное отвержение вывода, не добавляя отдельного богословского объяснения.
- issue: Телесная метафора в μέλη Χριστοῦ
  choice: члены Христа
  alternative: части тела Христа
  rationale: 'Выбранный вариант сохраняет краткость и формальную неоднозначность оригинала: Павел называет тела верующих «членами Христа», не употребляя здесь отдельно слова «тело» применительно ко Христу.'
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической энергией оригинала. «Проститутка» выбрано вместо устаревающей «блудницы» ради точности и понятности; повтор «члены» намеренно сохранён как основа аргумента Павла.
