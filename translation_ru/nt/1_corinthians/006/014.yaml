  terminology: «Бог», «Господь», «воскресил/воскресит» и «Своей силой» являются точными, устоявшимися и регистрово уместными соответствиями. Возвратное «Своей» корректно относит силу к Богу; уважительная прописная буква не изменяет смысла.
