  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: ru
  text: Бог воскресил Господа и нас воскресит Своей силой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Здесь δέ — слабая связка, продолжающая рассуждение. В русском её явная передача союзом «и» перед подлежащим звучала бы менее естественно, тогда как связь сохраняется контекстом.
- source_word: θεὸς
  choice: Бог
  rationale: Обычный и точный эквивалент θεός; Бог прямо назван совершающим воскресение.
- source_word: τὸν κύριον
  choice: Господа
  rationale: κύριος здесь относится к Иисусу и употреблено как христологический титул; «Господь» — установившийся и естественный русский эквивалент.
- source_word: ἤγειρεν
  choice: воскресил
  rationale: Аорист ἐγείρω обозначает совершённое Богом воскресение Господа из мёртвых. «Воскресил» точно и естественно передаёт значение в данном контексте.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое дополнение первого лица множественного числа передано без уточняющего расширения.
- source_word: καὶ ... ἐξεγερεῖ
  choice: и нас воскресит
  rationale: Будущее ἐξεγείρω и коррелятивное καί выражают параллель между воскресением Господа и будущим воскресением «нас». Русский глагол «воскресит» естественно передаёт это значение, не создавая искусственного различия с ἤγειρεν.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: Своей силой
  rationale: διά с родительным обозначает средство. Возвратное притяжательное «Своей» однозначно соотносит силу с подлежащим «Бог», а творительный падеж естественно передаёт инструментальное значение.
theological_decisions:
- issue: Значение будущего воскресения в ἐξεγερεῖ
  choice: будущее телесное воскресение верующих
  alternative: общее Божье оправдание или метафорическое духовное пробуждение
  rationale: Ближайший контекст посвящён телу (1 Кор 6:13–20), а параллель с совершившимся воскресением Господа указывает на реальное будущее воскресение. При этом перевод не добавляет слова «из мёртвых» или «телесно», оставляя вывод за контекстом.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Порядок слов «и нас воскресит» подчёркивает параллель с воскресением Господа. Заглавная буква в «Своей» использована как уважительное написание при отнесении к Богу.
