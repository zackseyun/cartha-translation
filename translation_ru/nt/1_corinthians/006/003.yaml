lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Разве вы не знаете
  rationale: Сохраняет характерный для Павла риторический вопрос и естественно звучит по-русски.
- source_word: ὅτι
  choice: что
  rationale: Вводит придаточное, раскрывающее содержание знания.
- source_word: ἀγγέλους
  choice: ангелов
  rationale: В данном эсхатологическом контексте речь идёт о небесных существах, а не о человеческих посланниках.
- source_word: κρινοῦμεν
  choice: мы будем судить
  rationale: Будущее время оригинала передано прямо; «судить» не уточняет без достаточных оснований характер или способ суда.
- source_word: μήτιγε
  choice: тем более
  rationale: 'Передаёт усиленный вывод от большего к меньшему: если верующие будут судить ангелов, то тем более способны разбирать обычные земные дела.'
- source_word: βιωτικά
  choice: житейские дела
  rationale: Субстантивированное прилагательное обозначает дела обычной земной жизни; выражение естественно в современном литературном русском и сохраняет широту значения.
theological_decisions:
- issue: Характер суда верующих над ангелами
  choice: Сохранить буквальное «мы будем судить ангелов» без поясняющего расширения.
  alternative: «мы будем править ангелами» или «мы будем судить падших ангелов»
  rationale: Текст не уточняет ни способ суда, ни круг ангелов; более узкая формулировка привнесла бы толкование в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Риторическая энергия оригинала сохранена вопросом, кратким восклицанием и контрастом между ангелами и житейскими делами.
