reference: 1 Corinthians 6:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: ru
  text: 'Или вы не знаете, что неправедные не наследуют Царства Божьего? Не обманывайтесь: ни живущие в разврате, ни идолопоклонники, ни прелюбодеи, ни изнеженные мужчины[a], ни мужчины, вступающие в половую связь с мужчинами[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мягкие». Слово μαλακοί может означать изнеженных или женоподобных мужчин, нравственно слабых людей, а в этом контексте, возможно, мужчин, исполняющих пассивную роль в однополой половой связи, либо мужчин-проституток.'
    reason: lexical_alternative
  - marker: b
    text: Редкое и спорное слово ἀρσενοκοῖται также переводят как «мужеложники» или «мужчины, практикующие однополые связи»; вероятно, оно связано с формулировкой книги Левит в греческом переводе и обозначает мужчин, вступающих в недозволенную половую связь с мужчинами.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Или
  rationale: Сохраняет резкий риторический переход, продолжающий предшествующее рассуждение Павла.
- source_word: οὐκ οἴδατε
  choice: вы не знаете
  rationale: Прямо и естественно передаёт обычную для Павла риторическую формулу.
- source_word: ἄδικοι
  choice: неправедные
  rationale: Сохраняет широкую нравственную и богословскую категорию, не сводя её только к отдельным проступкам.
- source_word: θεοῦ βασιλείαν
  choice: Царства Божьего
  rationale: Устоявшаяся и понятная библейская формулировка; родительный падеж естественно передаёт греческую конструкцию.
- source_word: οὐ κληρονομήσουσιν
  choice: не наследуют
  rationale: Сохраняет образ наследования и его заветно-эсхатологические оттенки; настоящее по форме русское сказуемое естественно выражает категоричное будущее следствие.
- source_word: μὴ πλανᾶσθε
  choice: Не обманывайтесь
  rationale: Естественно передаёт предупреждение, сохраняя возможность значения как самообмана, так и введения в заблуждение.
- source_word: πόρνοι
  choice: живущие в разврате
  rationale: Передаёт широкую категорию сексуально безнравственного поведения современным русским языком, не ограничивая её одним узким видом связи.
- source_word: εἰδωλολάτραι
  choice: идолопоклонники
  rationale: Точный, краткий и общепонятный эквивалент.
- source_word: μοιχοὶ
  choice: прелюбодеи
  rationale: Сохраняет конкретное указание на нарушение супружеской верности.
- source_word: μαλακοὶ
  choice: изнеженные мужчины
  rationale: Относительно прямо передаёт буквальный образ «мягких», не превращая спорное контекстуальное значение в бесспорное; возможный сексуальный смысл отмечен в сноске.
- source_word: ἀρσενοκοῖται
  choice: мужчины, вступающие в половую связь с мужчинами
  rationale: Описательно передаёт вероятное указание на мужские однополые половые акты, избегая анахроничного языка современной идентичности; спорность редкого термина отражена в сноске.
theological_decisions:
- issue: Значение последовательности μαλακοὶ и ἀρσενοκοῖται в перечне пороков
  choice: Передать как «изнеженные мужчины» и «мужчины, вступающие в половую связь с мужчинами» с отдельными сносками
  alternative: «пассивные участники однополых связей» и «мужчины, совершающие однополые половые акты»; либо традиционные «малакии» и «мужеложники»
  rationale: Первый термин имеет широкий диапазон значений — от мягкости и изнеженности до нравственной слабости и, возможно, пассивной роли в мужской однополой связи. Второй редок, но его состав и вероятный фон греческого текста Левита указывают на половую связь мужчины с мужчиной. Основной текст сохраняет различие терминов, а сноски не скрывают лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет риторическую остроту и структуру перечня. Архаичное «мужеложники» не вынесено в основной текст из-за недостаточной прозрачности для современного читателя; спорные значения обоих греческих терминов явно представлены в сносках.
