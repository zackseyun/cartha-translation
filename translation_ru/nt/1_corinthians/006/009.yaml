  source_fidelity: Русский текст точно передаёт риторическое «Или вы не знаете», будущее отрицание «не наследуют», предупреждение «Не обманывайтесь» и структуру перечня. «Неправедные», «Царство Божье», «идолопоклонники» и «прелюбодеи» соответствуют греческому тексту. Для μαλακοί избрана сравнительно буквальная, не чрезмерно определяющая передача, а для ἀρσενοκοῖται — описательная передача вероятного значения; спорность обоих слов сохранена в примечаниях.
