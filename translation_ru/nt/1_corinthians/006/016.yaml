  source_fidelity: 'Смысл греческого текста в целом передан верно: риторический вопрос, связь с πόρνη, утверждение о «одном теле» и цитата Бытия сохранены. Однако πόρνη в данном контексте точнее передавать современным словом «проститутка», а не «блудница», которое в современном русском имеет архаико-церковную окраску и может обозначать более широкую моральную категорию.'
  naturalness: «Составляет с ней одно тело» несколько тяжеловесно и не вполне естественно для современного литературного русского. Конструкция «одно тело с ней» непосредственно и ясно передаёт греческое ἓν σῶμά ἐστιν. «Ибо сказано» естественно вводит цитату и сохраняет её обосновывающую функцию.
  terminology: Различение σῶμα («тело») и σάρξ («плоть») сохранено. «Проститутка» точно соответствует πόρνη; «плоть» в цитате из Бытия следует оставить как устойчивое библейское выражение.
