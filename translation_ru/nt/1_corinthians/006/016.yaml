  rationale: Правка заменяет архаичное и семантически более широкое «блудница» на точное современное «проститутка» и упрощает предикативную конструкцию. Смысл сексуального единения, аргументативная связь с предшествующим контекстом и намеренное отсутствие названного субъекта у φησίν не изменены.
