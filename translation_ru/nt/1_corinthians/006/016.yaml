  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: ru
  text: Или вы не знаете, что тот, кто соединяется с проституткой, — одно тело с ней?[a] Ибо сказано:[b] «Двое станут одной плотью».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «соединяющийся с проституткой есть одно тело».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «говорит». Цитата из Бытия 2:24.'
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Сохраняет связь с предшествующим рассуждением и вводит очередной риторический вопрос Павла.
- source_word: οὐκ οἴδατε
  choice: вы не знаете
  rationale: Естественно и близко передаёт обычную для Павла риторическую формулу.
- source_word: ὁ κολλώμενος
  choice: тот, кто соединяется
  rationale: κολλάομαι означает «присоединяться, соединяться, прилепляться»; в данном контексте «соединяется» ясно указывает на половую связь, не сужая выражение до одного лишь физического действия.
- source_word: τῇ πόρνῃ
  choice: с блудницей
  rationale: πόρνη обозначает именно проститутку, блудницу; артикль имеет обобщающее значение. Творительный падеж с предлогом «с» требуется естественным русским выражением «соединяться с кем-либо».
- source_word: ἓν σῶμά ἐστιν
  choice: составляет с ней одно тело
  rationale: Передаёт настоящее время ἐστιν и ясно выражает подразумеваемое отношение между мужчиной и женщиной, не заменяя утверждение глаголом «становится».
- source_word: Ἔσονται γάρ
  choice: Ведь ... станут
  rationale: γάρ обосновывает предыдущее утверждение, а будущее ἔσονται с εἰς в цитате естественно передаётся как «станут».
- source_word: φησίν
  choice: сказано
  rationale: Безличная русская формула естественно вводит цитату из Писания и не определяет в основном тексте прямо не названного греческого субъекта; буквальная форма отмечена в сноске.
- source_word: οἱ δύο
  choice: двое
  rationale: Кратко и точно передаёт субстантивированное числительное «эти двое» в цитате.
- source_word: εἰς σάρκα μίαν
  choice: одной плотью
  rationale: Сохраняет традиционное и контекстуально точное библейское выражение «одна плоть», не истолковывая σάρξ как «греховную природу».
theological_decisions:
- issue: Значение цитаты из Бытия для половой связи вне брака
  choice: Цитата прямо обосновывает утверждение Павла о реальном телесном единстве с блудницей.
  alternative: Ограничить выражение «одна плоть» только браком или добавить в перевод развёрнутый нравственный вывод.
  rationale: Павел применяет Бытие 2:24 к связи с блудницей. Перевод сохраняет силу этой аналогии и возникающее богословское напряжение, не добавляя отсутствующих в стихе пояснений.
- issue: Неназванный субъект φησίν
  choice: 'Передать безлично: «сказано».'
  alternative: «Он говорит», прямо понимая субъектом Бога, или «Писание говорит».
  rationale: Греческий текст буквально имеет форму «говорит», но субъект не назван. Безличная русская конструкция не устраняет возможную отсылку к Богу и одновременно не вносит её в основной текст как явное уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Блудница» выбрана как точное и общеупотребительное библейское обозначение проститутки; «плоть» сохранена ради связи с Бытие 2:24 и смыслового различия между σῶμα («тело») и σάρξ («плоть»).
