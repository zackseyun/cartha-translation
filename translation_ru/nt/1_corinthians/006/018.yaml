  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: ru
  text: Бегите от сексуальной безнравственности. Всякий грех, какой бы ни совершил человек, — вне тела[a], а кто совершает сексуальную безнравственность, грешит против собственного тела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершается вне тела». Смысл этого утверждения толкуется по-разному; перевод сохраняет прямую формулировку греческого текста.'
    reason: Сохраняет неоднозначность трудного выражения ἐκτὸς τοῦ σώματος, не навязывая понимание его как абсолютного тезиса или цитаты из коринфского лозунга.
lexical_decisions:
- source_word: φεύγετε
  choice: Бегите
  rationale: Настоящее повелительное наклонение во множественном числе выражает настойчивый призыв постоянно избегать опасности; «бегите» естественно и точно передаёт силу команды.
- source_word: πορνείαν
  choice: сексуальной распущенности
  rationale: πορνεία обозначает широкий круг недозволенных половых отношений; этот вариант современен, понятен и не сужает значение до одного вида проступка.
- source_word: πᾶν ἁμάρτημα
  choice: Всякий грех
  rationale: Передаёт обобщающий и всеохватный характер греческого выражения, сохраняя естественный русский стиль.
- source_word: ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: какой совершает человек
  rationale: ἄνθρωπος употреблено в родовом значении, поэтому «человек» точно и естественно передаёт смысл; конструкция с ἐὰν и сослагательным наклонением выражает неопределённо-обобщённое действие.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: вне тела
  rationale: Буквально сохраняет пространственно-метафорическое противопоставление следующей части стиха, не разрешая его спорный смысл.
- source_word: ὁ δὲ πορνεύων
  choice: а кто предаётся сексуальной распущенности
  rationale: Субстантивированное причастие настоящего времени указывает на человека, совершающего такое действие; формулировка сохраняет глагольный характер выражения.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: грешит против собственного тела
  rationale: «Против» естественно передаёт направленность греха на своё тело, а «собственного» сохраняет усиление, выраженное ἴδιον.
theological_decisions:
- issue: Родовое значение ἄνθρωπος
  choice: человек
  alternative: мужчина
  rationale: В данном обобщающем высказывании ἄνθρωπος относится к человеку как таковому, а русское «человек» одновременно формально соответствует существительному и ясно выражает родовой смысл.
- issue: Смысл утверждения «всякий грех… вне тела»
  choice: Передать высказывание прямо и сохранить его напряжённость
  alternative: Истолковать его в тексте как коринфский лозунг или снабдить ограничивающим пояснением
  rationale: Греческий текст представляет утверждение непосредственно. Перевод не должен заранее решать экзегетический спор или сглаживать кажущееся абсолютным противопоставление.
translation_notes:
  register: Современный литературный русский язык; повеление передано кратко и энергично. Формулировки dignified and accessible, без архаизмов и конфессионально окрашенных уточнений. Повтор πορνεία/πορνεύων сохранён единообразно через «сексуальная распущенность».
