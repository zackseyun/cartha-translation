lexical_decisions:
- source_word: Τολμᾷ
  choice: Смеет ли
  rationale: Передаёт риторический вопрос и оттенок дерзости, заключённый в глаголе τολμάω, без усиления до русского «как смеет».
- source_word: τις ὑμῶν
  choice: кто-нибудь из вас
  rationale: Естественно передаёт неопределённое местоимение в единственном числе с партитивным родительным и сохраняет прямое обращение к коринфянам.
- source_word: πρᾶγμα ἔχων
  choice: имея дело
  rationale: Сохраняет широкий смысл πρᾶγμα — «дело, спорный вопрос, судебное дело» — и не сужает его преждевременно до формального иска.
- source_word: πρὸς τὸν ἕτερον
  choice: против другого
  rationale: В контексте тяжбы πρός выражает направленность дела против другой стороны; формулировка сохраняет единственное число и не конкретизирует личность оппонента.
- source_word: κρίνεσθαι
  choice: обращаться за судом
  rationale: 'Идиоматично передаёт судебный смысл формы κρίνεσθαι: вынести спор на разбирательство и добиваться решения суда. Буквальное «быть судимым» по-русски могло бы ошибочно представить самого верующего обвиняемым по уголовному делу.'
- source_word: ἐπὶ τῶν ἀδίκων
  choice: к неправедным
  rationale: Сохраняет нравственно-богословскую характеристику ἄδικοι и не заменяет её толкованием «неверующие»; конструкция с «к» естественно сочетается с «обращаться за судом».
- source_word: καὶ οὐχὶ
  choice: а не
  rationale: Русское противопоставление естественно передаёт контраст греческого καὶ οὐχί в риторическом вопросе.
- source_word: ἐπὶ τῶν ἁγίων
  choice: к святым
  rationale: Сохраняет обычное для Павла обозначение принадлежащих Богу людей и образует точный лексический контраст с «неправедными».
theological_decisions:
- issue: Противопоставление ἀδίκων и ἁγίων
  choice: неправедным … святым
  alternative: неверующим … верующим; несправедливым … святым
  rationale: Греческий текст использует нравственно и богословски нагруженные определения, а не прямые слова «неверующие» и «верующие». Перевод сохраняет эту формулировку и не снимает присущего ей напряжения.
- issue: Юридический смысл κρίνεσθαι
  choice: обращаться за судом
  alternative: судиться; быть судимым
  rationale: Выбранная формулировка ясно показывает обращение к тем, кто должен разрешить спор, но не утверждает сверх текста, что речь непременно идёт о конкретной форме гражданского иска.
translation_notes:
  register: Современный литературный русский язык с ясным судебным контекстом. Риторическая форма и резкое противопоставление сохранены; формулировка остаётся понятной без архаизмов и конфессионально окрашенных уточнений.
