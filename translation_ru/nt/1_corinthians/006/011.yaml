source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: ru
  text: И такими были некоторые из вас. Но вы омылись[a], но были освящены, но были оправданы именем Господа Иисуса и Духом нашего Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были омыты». Греческая форма допускает возвратное понимание, но в данном ряду Божьих спасительных действий может иметь страдательный смысл.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «во имя Господа Иисуса и в Духе нашего Бога». Греческий предлог может обозначать как средство или действующую силу, так и сферу действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: И такими были некоторые из вас
  rationale: Естественно по-русски передаёт указательное ταῦτα как отсылку к перечисленным выше категориям людей, сохраняя контраст между прежним и нынешним состоянием.
- source_word: ἀλλὰ
  choice: но
  rationale: Троекратное «но» сохраняет анафорический ритм и подчёркнутый перелом в мысли Павла.
- source_word: ἀπελούσασθε
  choice: вы омылись
  rationale: Возвратная форма естественно отражает средний залог греческого глагола, не утверждая непременно независимое от Бога самоочищение; возможное страдательное понимание отмечено в сноске.
- source_word: ἡγιάσθητε
  choice: были освящены
  rationale: Передаёт страдательный залог и сохраняет привычную русскую богословскую лексику, оставаясь понятным современному читателю.
- source_word: ἐδικαιώθητε
  choice: были оправданы
  rationale: Точно передаёт страдательную форму δικαιόω и её характерный для Павла судебно-спасительный смысл.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: именем Господа Иисуса
  rationale: Русский творительный естественно допускает значение средства или действующей силы, заложенное в ἐν, без лишнего уточнения механизма.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: Духом нашего Бога
  rationale: Творительный передаёт вероятное инструментальное значение ἐν; прописная буква отражает наиболее естественную здесь отсылку к Святому Духу.
theological_decisions:
- issue: Залог и субъект действия в ἀπελούσασθε
  choice: «вы омылись»
  alternative: «вы были омыты»
  rationale: Греческая форма морфологически средняя и допускает возвратную передачу, тогда как соседние страдательные глаголы и общий спасительный контекст позволяют понимать её пассивно. Основной текст отражает форму, а сноска сохраняет контекстуально вероятную альтернативу.
- issue: Значение ἐν в заключительных оборотах
  choice: 'Передать оба оборота русским творительным: «именем… и Духом»'
  alternative: «во имя Господа Иисуса и в Духе нашего Бога»
  rationale: Творительный естественно выражает средство или действующую силу и сохраняет параллелизм двух предложных оборотов; пространственно-сферическое понимание остаётся возможным и отмечено в сноске.
- issue: Референт πνεύματι
  choice: Божий Дух
  alternative: духовная сфера или действие Бога в более общем смысле
  rationale: Формула «Дух нашего Бога» в контексте Павла наиболее естественно указывает на Святого Духа, хотя слово «Святой» в перевод не добавляется.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Сохранены трёхкратное «но», богословски значимые «освящены» и «оправданы», а также неоднозначность среднего залога и предлога ἐν.
