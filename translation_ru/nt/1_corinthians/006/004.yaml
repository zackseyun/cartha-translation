base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: ru
  text: Итак, если у вас есть судебные разбирательства по житейским делам[a], неужели вы назначаете судьями тех, кого в церкви ни во что не ставят?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «касающиеся повседневной жизни»; греческое слово обозначает обычные земные или гражданские дела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тех, кем в церкви пренебрегают». Греческое выражение может иронически обозначать либо людей, которых в общине считают незначительными, либо тех, кто не пользуется признанием со стороны церкви.'
    reason: alternative_reading
  - marker: c
    text: 'Некоторые понимают эту часть стиха как саркастическое повеление: «назначайте судьями тех, кого в церкви ни во что не ставят».'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: касающиеся этой жизни
  rationale: Передаёт дела обычной земной, в частности гражданской, жизни, не придавая слову нравственно отрицательного оттенка.
- source_word: κριτήρια
  choice: судебные дела
  rationale: В данном контексте существительное может обозначать суды или судебные разбирательства. Выражение «судебные дела» естественно сочетается с условным оборотом и последующим назначением судей.
- source_word: ἐὰν ἔχητε
  choice: если у вас есть
  rationale: Прямо и естественно передаёт условную конструкцию, не усиливая её значения.
- source_word: τοὺς ἐξουθενημένους
  choice: тех, кто ничего не значит
  rationale: Передаёт людей, которых считают незначительными или лишёнными авторитета, сохраняя иронический оттенок и не определяя однозначно, находятся ли они внутри общины.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: в церкви
  rationale: Сохраняет прямую форму греческого выражения и оставляет открытым, означает ли оно положение внутри общины или оценку со стороны общины.
- source_word: τούτους καθίζετε
  choice: неужели вы назначаете судьями
  rationale: В судебном контексте буквальное «сажаете» означает наделение функцией судьи. «Назначаете судьями» ясно передаёт эту функцию, а «неужели» выявляет риторический характер вопроса.
theological_decisions:
- issue: Считать ли заключительную часть риторическим вопросом или саркастическим повелением
  choice: 'Риторический вопрос: «неужели вы назначаете судьями…?»'
  alternative: 'Саркастическое повеление: «назначайте судьями тех, кто ничего не значит в церкви»'
  rationale: Пунктуация SBLGNT и контекст обличения в 1 Кор 6:1–6 поддерживают вопросительное прочтение, однако синтаксис допускает и повелительное, поэтому оно отмечено в сноске.
- issue: Кого обозначают «те, кто ничего не значит в церкви»
  choice: Не уточнять, являются ли это малозначимые члены общины или посторонние, не имеющие признания с точки зрения церкви
  alternative: Однозначно отнести выражение либо к неуважаемым членам церкви, либо к светским судьям вне церкви
  rationale: Греческое выражение допускает оба понимания; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка сохраняет судебную образность, риторическое обличение и неоднозначность греческого текста; церковная терминология не окрашена конфессионально.
