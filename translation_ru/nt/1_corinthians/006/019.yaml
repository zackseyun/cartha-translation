  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: ru
  text: Или вы не знаете, что ваше тело — храм Святого Духа, пребывающего в вас[a], Которого вы имеете от Бога? И вы не свои[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм Святого Духа, Который в вас».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте слово «тело» стоит в единственном числе, а «ваше» обращено к нескольким людям. Это можно понимать распределительно — «тело каждого из вас» — или представительно.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Сохраняет резкий риторический переход, которым Павел продолжает предшествующее рассуждение.
- source_word: οὐκ οἴδατε
  choice: вы не знаете
  rationale: Естественно передаёт обычную для Павла риторическую формулу и прямое значение οἴδατε.
- source_word: τὸ σῶμα ὑμῶν
  choice: ваше тело
  rationale: Сохраняет необычное сочетание единственного числа «тело» с обращением к нескольким людям, не решая, употреблено ли оно распределительно или представительно.
- source_word: ναὸς
  choice: храм
  rationale: Передаёт значение святилища как места Божьего присутствия и естественно звучит в русском библейском контексте.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: Святого Духа, пребывающего в вас
  rationale: Ясно связывает ἐν ὑμῖν со Святым Духом и сохраняет определение при слове «храм»; причастие делает русскую фразу естественной, не добавляя нового смысла.
- source_word: οὗ
  choice: Которого
  rationale: Относительное местоимение относится к Святому Духу; личная форма соответствует референту и русской грамматике.
- source_word: ἔχετε ἀπὸ θεοῦ
  choice: вы имеете от Бога
  rationale: Сохраняет настоящее значение ἔχετε и выражение происхождения ἀπὸ θεοῦ, не заменяя его явно глаголом «получили».
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: И вы не свои
  rationale: 'Кратко и естественно передаёт принадлежность: адресаты не принадлежат самим себе; формулировка также сохраняет связь со следующим стихом.'
theological_decisions:
- issue: К чему относится οὗ и следует ли передавать его лично
  choice: Местоимение относится к Святому Духу и передано как «Которого».
  alternative: Безличное «который» либо перестройка всей фразы.
  rationale: Грамматически οὗ соотносится с ἁγίου πνεύματός. Личная форма не добавляет отдельного догматического утверждения, а естественно передаёт референт в русском языке.
- issue: Единственное число «тело» при множественном числе адресатов
  choice: Сохранено «ваше тело».
  alternative: «Ваши тела».
  rationale: Греческий текст сочетает τὸ σῶμα в единственном числе с ὑμῶν во множественном. Сохранение этой формы не устраняет возможность как распределительного («тело каждого из вас»), так и представительного понимания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис остаётся близким к греческому, но причастный оборот устраняет неясность русского сочетания «Святого Духа в вас». Единственное число «тело» намеренно сохранено; все сноски обозначены в основном тексте.
