base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: ru
  text: Пища — для желудка, и желудок — для пищи[a], но Бог положит конец и тому и другому[b]. Тело же не для сексуальной безнравственности, а для Господа, и Господь — для тела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «виды пищи — для желудка, и желудок — для видов пищи»; в греческом слово «пища» стоит во множественном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог уничтожит и то и другое» либо «Бог упразднит и то и другое». Многие толкователи считают предшествующие слова о пище и желудке коринфским лозунгом, который Павел приводит, а затем ограничивает.'
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: βρώματα
  choice: пища
  rationale: Хотя в греческом стоит множественное число («виды пищи», «пища» во множественном числе), русское собирательное «пища» естественно передаёт общий смысл изречения.
- source_word: κοιλίᾳ / κοιλία
  choice: желудок
  rationale: В данном контексте речь идёт о принятии и переваривании пищи; «желудок» точнее и нейтральнее, чем разговорное «живот» или более широкое «чрево».
- source_word: καταργήσει
  choice: положит конец
  rationale: Глагол означает прекращение действия, устранение или упразднение. Выражение передаёт будущую временность связи пищи и желудка, не навязывая значения полного физического уничтожения.
- source_word: ταύτην καὶ ταῦτα
  choice: и тому и другому
  rationale: Указательные местоимения относятся соответственно к желудку и пище. Русское выражение сохраняет оба референта и звучит естественно.
- source_word: σῶμα
  choice: тело
  rationale: Прямой и обычный русский эквивалент; здесь имеется в виду человеческое тело в его богословски значимых отношениях с Господом.
- source_word: πορνείᾳ
  choice: сексуальная распущенность
  rationale: Современное и понятное обозначение запрещённого полового поведения. Оно сохраняет широту греческого понятия и избегает как архаичности слова «блуд», так и возможной чрезмерной общности слова «разврат».
- source_word: κυρίῳ / κύριος
  choice: Господь
  rationale: Традиционный и смыслово точный эквивалент, сохраняющий христологический вес слова в данном контексте.
- source_word: δὲ
  choice: но / же
  rationale: Первое δέ передаёт противопоставление временной связи пищи и желудка Божьему решению, а второе — переход к контрастному утверждению о теле.
theological_decisions:
- issue: Является ли начальная фраза коринфским лозунгом или собственным утверждением Павла
  choice: Передать фразу без кавычек и без вводных слов
  alternative: Оформить её как цитату или добавить «вы говорите»
  rationale: Греческий текст сам по себе не отмечает цитирование. Такой перевод сохраняет возможность распространённого понимания фразы как коринфского лозунга, но не возводит это толкование в основной текст.
- issue: Смысл καταργήσει применительно к пище и желудку
  choice: положит конец
  alternative: уничтожит; упразднит; сделает недействующими
  rationale: Выбранное выражение подчёркивает прекращение их нынешней функции или связи, не решая сверх текста вопрос о физическом уничтожении.
- issue: Смысл слов «Господь — для тела»
  choice: Сохранить краткую взаимную конструкцию без пояснения
  alternative: Господь заботится о теле; Господь служит благу тела
  rationale: Оригинал намеренно краток и построен параллельно предыдущей фразе. Развёрнутое пояснение преждевременно определило бы точный характер отношения Господа к телу.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением первой части и сохранением параллелизма оригинала. Формулировки понятны широкому читателю, но сохраняют достоинство и богословскую сжатость текста.
