id: 1CO.6.6
reference: 1 Corinthians 6:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: ru
  text: Но брат судится с братом[b], и притом перед неверующими?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть перед теми, кто не принадлежит к христианской общине. Вероятно, имеются в виду светские суды, однако в греческом тексте сказано просто: «перед неверующими».'
    reason: lexical_alternative
  - marker: b
    text: Повторённое слово «брат» обозначает членов христианской общины.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление между должным разбирательством внутри общины, о котором сказано выше, и фактическим положением дел.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: брат ... с братом
  rationale: Сохраняет повтор и семейное обозначение членов христианской общины; мужской род соответствует форме греческого текста и в контексте имеет представительное значение.
- source_word: μετὰ
  choice: с
  rationale: В сочетании с «судится» естественная русская конструкция «судиться с кем-либо» сама выражает противостояние сторон в судебной тяжбе.
- source_word: κρίνεται
  choice: судится
  rationale: В данном контексте глагол имеет судебное значение. «Судится» кратко и естественно передаёт участие в тяжбе, не уточняя без основания, кто именно подал иск.
- source_word: καὶ τοῦτο
  choice: и притом
  rationale: 'Русский оборот передаёт риторическое усиление и возмущение Павла: тяжба происходит не только между братьями, но ещё и в особенно неподобающей обстановке.'
- source_word: ἐπὶ ἀπίστων
  choice: перед неверующими
  rationale: Сохраняет общий смысл греческого выражения — дело рассматривается перед людьми вне веры — и не добавляет прямо не названное слово «судьи».
theological_decisions:
- issue: Представительное значение ἀδελφός внутри церкви
  choice: брат
  alternative: единоверец; брат или сестра
  rationale: Сохранены мужской род единственного числа и семейная образность оригинала. Контекст показывает, что наставление относится к тяжбам между членами христианской общины в целом; это поясняется в сноске, а не сглаживается в основном тексте.
- issue: Круг лиц, обозначенных ἀπίστων
  choice: неверующие
  alternative: неверующие судьи; язычники; посторонние
  rationale: Так сохраняется проведённое Павлом различие между церковью и теми, кто не принадлежит к вере, без неоправданного сужения значения до судей или язычников.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, риторически заострённая и пригодная для публичного чтения. Оборот «судится с братом» естественно передаёт юридический контекст, а «и притом» сохраняет усиление καὶ τοῦτο.
