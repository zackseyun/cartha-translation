  to: Или вы не знаете, что святые будут судить мир? И если мир будет судим вами[a], неужели вы недостойны того, чтобы разбирать самые незначительные судебные дела[b]?
  rationale: Уточнён судебный характер «дел», убрано невыраженное непосредственно усиление «даже» и исправлена неестественная формулировка сноски. Перевод сохраняет различие между контекстуально предпочтительным значением «судебные дела» и возможным значением κριτήριον как «суд/судебный орган».
