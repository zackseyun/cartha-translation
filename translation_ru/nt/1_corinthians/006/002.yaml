  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: ru
  text: Или вы не знаете, что святые будут судить мир? И если мир будет судим вами[a], неужели вы недостойны того, чтобы разбирать самые незначительные судебные дела[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди вас». Греческое выражение буквально допускает значение «если мир судится среди вас», однако в контексте речь идёт об участии святых в суде над миром.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «самых малых судов»; греческое слово может обозначать как судебные дела, так и суды или судебные органы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Сохраняет резкий риторический переход, продолжающий довод предыдущего стиха.
- source_word: οὐκ οἴδατε
  choice: вы не знаете
  rationale: Передаёт обычную для Павла риторическую формулу прямо и естественно.
- source_word: οἱ ἅγιοι
  choice: святые
  rationale: Традиционное и краткое обозначение принадлежащих Богу верующих; контекст не предполагает особой элитной группы.
- source_word: τὸν κόσμον
  choice: мир
  rationale: Передаёт κόσμος в его широком значении без ненужного уточнения объёма понятия.
- source_word: κρινοῦσιν
  choice: будут судить
  rationale: Сохраняет будущее время и основной судебный смысл глагола, не уточняя способ участия святых в суде.
- source_word: ἐν ὑμῖν
  choice: вами
  rationale: В контексте выражает участие адресатов в суде над миром; буквальное пространственное или ассоциативное значение отмечено в сноске.
- source_word: κρίνεται
  choice: будет судим
  rationale: Будущее по смыслу естественно согласуется с предшествующим κρινοῦσιν, хотя в греческом употреблено настоящее страдательного залога.
- source_word: ἀνάξιοί ἐστε
  choice: неужели вы недостойны
  rationale: Сохраняет оценочную силу ἀνάξιος и риторическую остроту вопроса.
- source_word: κριτηρίων ἐλαχίστων
  choice: разбирать даже самые малые дела
  rationale: В данном споре речь идёт о рассмотрении незначительных тяжб; «даже» естественно передаёт аргумент от большего к меньшему. Возможное значение «малейшие суды» отмечено в сноске.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: Верующих как народ Божий в целом
  alternative: Особую группу исключительно святых верующих
  rationale: У Павла это слово обычно обозначает всех принадлежащих Богу христиан; перевод не вводит идеи отдельного духовного сословия.
- issue: Участие святых в суде над миром
  choice: Реальное будущее участие, точный характер которого не определяется
  alternative: Только образная нравственная оценка либо полностью независимая судебная власть
  rationale: Текст прямо говорит о будущем суде, но не объясняет, каким образом святые будут его совершать; эта неопределённость сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Риторическая последовательность и противопоставление суда над миром малым повседневным тяжбам сохранены.
