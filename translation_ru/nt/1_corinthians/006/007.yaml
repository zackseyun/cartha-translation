base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: ru
  text: Итак, уже сам по себе тот факт, что вы судитесь друг с другом, — полное поражение для вас[a]. Почему бы вам лучше не терпеть несправедливость? Почему бы вам лучше не дать себя лишить[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полный проигрыш»; также возможно: «полная неудача».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «почему бы вам лучше не остаться обделёнными?» или «почему бы вам лучше не дать себя обмануть?».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: И уже само по себе
  rationale: 'Передаёт итоговый переход и усиление: Павел утверждает, что поражение налицо уже в самом факте тяжб, независимо от их исхода.'
- source_word: ἥττημα
  choice: полное поражение
  rationale: Существительное означает поражение, проигрыш или неудачу; «поражение» сохраняет резкую риторическую оценку Павла, а «полное» передаёт усилительное ὅλως.
- source_word: κρίματα
  choice: судитесь
  rationale: В данном контексте речь идёт о судебных разбирательствах между членами общины; глагольная конструкция естественна по-русски и конкретно передаёт юридический смысл.
- source_word: μεθ’ ἑαυτῶν
  choice: друг с другом
  rationale: Передаёт взаимный и внутриобщинный характер судебных тяжб.
- source_word: ἀδικεῖσθε
  choice: терпеть несправедливость
  rationale: Сохраняет пассивный смысл — подвергаться несправедливому обращению — и этическую окраску греческого глагола.
- source_word: ἀποστερεῖσθε
  choice: терпеть ущерб
  rationale: Глагол может означать быть лишённым чего-либо, обманутым или ограбленным; «терпеть ущерб» сохраняет широту значения и подходит к имущественно-правовому контексту, не ограничивая его непременно мошенничеством.
theological_decisions:
- issue: Характер оценки судебных тяжб внутри общины
  choice: «полное поражение» как нравственная оценка самого наличия тяжб
  alternative: «проигрыш» или «неудача»
  rationale: 'Формулировка сохраняет силу утверждения Павла: община уже потерпела поражение независимо от решения суда, но перевод не добавляет отсутствующей в тексте конфессиональной квалификации.'
translation_notes:
  register: Современный литературный русский язык; тон прямой и увещевательный. Синтаксис перестроен естественно для русского, при этом сохранены итоговый характер первой фразы, усиление ὅλως и параллелизм двух риторических вопросов.
