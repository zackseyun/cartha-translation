base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: ru
  text: «Мне всё позволено», но не всё полезно.[a][b] «Мне всё позволено», но я не позволю ничему властвовать надо мной.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или без кавычек: Мне всё позволено. Многие считают эти слова коринфским лозунгом, который Павел цитирует, а затем уточняет.'
    reason: alternative_reading
  - marker: b
    text: 'Или: но не всё идёт на пользу; или: но не всё приносит благо.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: но я не отдам себя во власть ничему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: Мне всё позволено
  rationale: Естественно передаёт безличную конструкцию с дательным лицом и сохраняет всеохватность и афористический повтор греческой фразы.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: но не всё полезно
  rationale: συμφέρει означает то, что приносит пользу или идёт на благо. Краткая формулировка сохраняет параллелизм оригинала и не привносит коммерческого оттенка слова «выгодно».
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: но ничто не будет властвовать надо мной
  rationale: Будущий пассив ἐξουσιασθήσομαι передаёт подчинение чьей-либо власти. Активная русская конструкция звучит естественно, сохраняя игру между «позволено» и «властвовать».
- source_word: ὑπό τινος
  choice: ничто … надо мной
  rationale: Неопределённое τινος допускает широкое значение; в контексте поступков и желаний естественно передать его неперсонифицированно как «ничто».
theological_decisions:
- issue: Является ли Πάντα μοι ἔξεστιν коринфским лозунгом
  choice: Повторённая фраза оформлена кавычками как цитируемый лозунг, который Павел затем ограничивает.
  alternative: Оставить фразу без кавычек как собственное утверждение Павла, уточняемое следующими словами.
  rationale: В греческих рукописях кавычек не было, поэтому оформление как цитаты остаётся интерпретацией. Оно правдоподобно передаёт риторику отрывка, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий афористический параллелизм оригинала сохранён. «Властвовать надо мной» звучит понятно и достойно, одновременно удерживая смысл власти и подчинения в ἐξουσιασθήσομαι.
