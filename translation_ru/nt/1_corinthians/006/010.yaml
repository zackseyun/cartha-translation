base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: ru
  text: ни воры, ни корыстолюбцы, ни пьяницы, ни оскорбители, ни хищники[a] Царства Божьего не наследуют.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вымогатели»; также возможно: «грабители» (ἅρπαγες).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέπται
  choice: воры
  rationale: Естественное современное обозначение людей, занимающихся кражей; сохраняет форму перечня пороков.
- source_word: πλεονέκται
  choice: корыстолюбцы
  rationale: Передаёт устойчивую жажду наживы и стремление иметь больше; точнее для обозначения людей по характерному пороку, чем отвлечённое «жадные».
- source_word: μέθυσοι
  choice: пьяницы
  rationale: Обозначает людей, для которых пьянство стало характерным образом поведения, а не всякого, кто когда-либо напивался.
- source_word: λοίδοροι
  choice: злоречивые
  rationale: Передаёт людей, привычно оскорбляющих и поносящих других, не сужая значение до ложной клеветы.
- source_word: ἅρπαγες
  choice: хищники
  rationale: Сохраняет широкий смысл тех, кто алчно присваивает чужое силой, давлением или эксплуатацией; конкретные варианты раскрыты в примечании.
- source_word: βασιλείαν θεοῦ
  choice: Царства Божьего
  rationale: Устоявшийся и богословски ёмкий русский эквивалент, сохраняющий идею Божьего царствования и царства.
- source_word: κληρονομήσουσιν
  choice: не наследуют
  rationale: Прямо сохраняет будущую форму и образ получения наследственной доли.
theological_decisions:
- issue: Сила перечня пороков и язык наследования
  choice: Субстантивированные существительные переданы как категории людей, характеризуемых названными пороками; толкование о нераскаянном или устойчивом образе жизни не добавлено прямо в текст.
  alternative: Явно перевести как «те, кто постоянно…» или отнести утверждение к любому единичному поступку.
  rationale: Греческая форма естественно обозначает людей по характерному поведению, но стих не формулирует отдельного уточнения о частоте поступков или покаянии. Перевод сохраняет эту напряжённость, не внося конфессионального толкования.
- issue: Значение κληρονομήσουσιν применительно к Царству Божьему
  choice: Сохранён образ «наследуют».
  alternative: Разъяснить в основном тексте как «не получат доли» или «не войдут».
  rationale: «Наследуют» сохраняет эсхатологическую и наследственно-правовую образность Павла; поясняющий пересказ не требуется для понятности.
translation_notes:
  register: Современный литературный русский с достоинством краткого нравственного перечня. Повтор «ни» воспроизводит риторическую структуру греческого текста; «Царства Божьего» сохраняет привычную библейскую формулу. Маркер [a] поставлен непосредственно после слова, к которому относится примечание.
