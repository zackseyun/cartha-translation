translation:
  language: ru
  text: А тот, кто соединяется с Господом, — один дух с Ним[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто прилепляется к Господу»; возможно также: «кто соединён с Господом». Глагол обозначает тесное присоединение или привязанность.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «... — один дух». Слова «с Ним» подразумеваются и добавлены для ясности.'
    reason: lexical_alternative
  - marker: c
    text: Слово «дух» можно писать с прописной буквы, понимая его как указание на Святого Духа. Однако выражение может означать, что верующий и Господь — «один дух». В греческом тексте регистр этого слова не решает вопроса.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: соединяется
  rationale: Причастие обозначает тесное присоединение, привязанность или единение. Возвратная форма «соединяется» естественна по-русски и сохраняет связь с образом союза в предыдущем стихе, не делая выражение излишне телесным.
- source_word: τῷ κυρίῳ (κύριος)
  choice: с Господом
  rationale: В данном контексте «Господь» относится к воскресшему Иисусу. Предлог «с» естественно передаёт по-русски отношение единения, выраженное греческим дательным при κολλάομαι.
- source_word: ἓν
  choice: один
  rationale: Сохраняет прямое значение числительного и подчёркивает единство, а не только согласие или общность целей.
- source_word: πνεῦμα
  choice: дух
  rationale: Строчная буква наиболее естественно указывает здесь на духовное единение верующего с Господом, а не прямо отождествляет обоих со Святым Духом. В греческом письме различие прописной и строчной букв не решает этот вопрос.
- source_word: ὁ δὲ ... ἐστιν
  choice: А тот, кто ... —
  rationale: Субстантивированное причастие передано естественной русской конструкцией «тот, кто». Частица δέ обозначена союзом «А», сохраняющим противопоставление предыдущему стиху.
theological_decisions:
- issue: Характер единства, выраженного словами «один дух»
  choice: Сохранить сильное утверждение о реальном духовном единении с Господом, не стирая различия между человеком и Господом.
  alternative: Понимать выражение либо как мистическое слияние, либо лишь как единство настроя и целей.
  rationale: Контекст противопоставляет телесный союз с блудницей (ст. 16) единению с Господом. Формулировка «один дух с Ним» сохраняет силу этого сопоставления, но не утверждает онтологического тождества.
- issue: Добавление «с Ним»
  choice: Включить «с Ним» для ясности отношения между верующим и Господом.
  alternative: 'Перевести буквально и короче: «есть один дух».'
  rationale: В греческом дополнение подразумевается контекстом. В русском «один дух с Ним» яснее показывает, между кем существует единство, не меняя смысла исходного текста.
- issue: Написание слова «дух» со строчной или прописной буквы
  choice: 'Написать со строчной: «дух».'
  alternative: «Дух», если понимать πνεῦμα как прямое указание на Святого Духа.
  rationale: Непосредственная конструкция ἓν πνεῦμά ἐστιν естественнее описывает единение верующего с Господом в духе. Однако греческий текст сам по себе не исключает толкования, связанного со Святым Духом, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, возвышенная без архаизмов. Тире естественно оформляет именную часть сказуемого при опущенной связке «есть». Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской традиции уважительного обозначения Господа.
