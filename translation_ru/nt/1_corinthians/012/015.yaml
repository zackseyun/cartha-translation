reference: 1 Corinthians 12:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: ru
  text: 'Если нога скажет[a]: «Так как я не рука, я не принадлежу телу», — разве из-за этого она не принадлежит телу?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Если нога скажет: „Так как я не рука, я не от тела“, — разве из-за этого она не от тела?»'
    reason: Сноска показывает буквальную форму повторяющегося греческого оборота ἐκ τοῦ σώματος, который в основном тексте идиоматически передан как принадлежность телу.
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: если ... скажет
  rationale: Сочетание ἐάν с аористом сослагательного наклонения выражает общее гипотетическое условие; русский совершенный вид естественно передаёт предполагаемое высказывание.
- source_word: ὁ πούς
  choice: нога
  rationale: Конкретный образ части тела необходимо сохранить, поскольку на нём строится вся метафора Павла.
- source_word: Ὅτι
  choice: так как
  rationale: Здесь ὅτι вводит основание жалобы ноги. «Так как» ясно передаёт причинную связь и естественно звучит внутри прямой речи.
- source_word: χείρ
  choice: рука
  rationale: Буквальный перевод сохраняет противопоставление ноги и руки в метафоре тела.
- source_word: ἐκ τοῦ σώματος
  choice: принадлежать телу
  rationale: В данном контексте оборот обозначает принадлежность к телу. Такой перевод естественен по-русски и не создаёт ошибочного образа физического происхождения или отделения, возможного при буквальном «от тела».
- source_word: οὐ παρὰ τοῦτο
  choice: разве из-за этого
  rationale: Оборот отвергает вывод, сделанный на указанном основании; «из-за этого» передаёт παρὰ τοῦτο, а частица «разве» вводит ожидающий отрицательного ответа риторический вопрос.
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: она не принадлежит телу?
  rationale: Отрицание сохранено внутри риторического вопроса. Местоимение женского рода ясно отсылает к ноге и требуется естественным русским синтаксисом.
theological_decisions:
- issue: Степень сглаживания повторов и двойного отрицания в метафоре тела
  choice: 'Передать оба случая ἐκ τοῦ σώματος одинаково как «принадлежать телу» и сохранить отрицательную форму риторического вопроса: «разве ... не принадлежит телу?»'
  alternative: 'Более формально: «я не от тела... разве из-за этого она не от тела?»'
  rationale: Основная мысль Павла — самооценка отдельного члена не отменяет его принадлежности телу. Выбранная формулировка сохраняет повтор, отрицание и риторическую напряжённость греческого текста, но избегает неестественного и потенциально двусмысленного русского «от тела».
translation_notes:
  register: Современный литературный русский язык; образность конкретна, тон достоин и понятен. Прямая речь и риторический вопрос сохранены. Формула «принадлежать телу» выбрана как наиболее естественная для обычного читателя без утраты смысла исходного оборота.
