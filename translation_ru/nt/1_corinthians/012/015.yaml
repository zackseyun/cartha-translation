  terminology: «Нога», «рука» и «тело» сохраняют необходимую телесную метафору. Выбор «принадлежать телу» предпочтительнее буквального «быть от тела» в основном тексте и не вносит богословской интерпретации. Сноска прозрачно отмечает более формальную альтернативу.
