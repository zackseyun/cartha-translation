  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: ru
  text: И те части тела, которые мы считаем менее почётными, мы оказываем больше почёта; а наши части, не предназначенные для показа,[a] имеют более благопристойный вид.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши менее благопристойные части». Греческое слово может обозначать то, что считается неприглядным или не подходящим для публичного показа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обладают большей благопристойностью»; также возможно: «большей представительности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: которые мы считаем
  rationale: Передаёт человеческую оценку, а не объективное качество; естественно звучит по-русски.
- source_word: ἀτιμότερα
  choice: менее почётными
  rationale: Сохраняет сравнительную степень и прямой контраст с τιμή — «почётом».
- source_word: τοῦ σώματος
  choice: части тела
  rationale: Явно передаёт отношение части к целому и сохраняет центральный для отрывка образ тела.
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: мы окружаем бо́льшим почётом
  rationale: «Окружаем почётом» — естественное русское сочетание, в котором сохраняется образ возложения или окружения и сравнительное значение περισσοτέραν.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: те наши части, которые неприлично выставлять напоказ
  rationale: Передаёт социальную непристойность или непригодность для публичного показа, не приписывая самим частям нравственной порочности.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: имеют более пристойный вид
  rationale: Передаёт идею большей внешней благопристойности или презентабельности и сохраняет сравнительную конструкцию исходного текста.
theological_decisions:
- issue: Образ частей тела и общественного почёта
  choice: Сохранить конкретную речь о частях тела и о том, как с ними обращаются.
  alternative: Сразу перефразировать как наставление об уважении к менее заметным членам церкви.
  rationale: Павел строит богословский вывод на аналогии с буквальным телом; перевод не должен подменять образ его применением.
- issue: Характер «непристойности» частей тела
  choice: Передать как непригодность для публичного показа.
  alternative: Назвать части «постыдными» или нравственно «неприличными».
  rationale: Контекст касается приличия, покрытия и внешнего обращения, а не моральной порочности частей тела.
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным звучанием. Ударение в «бо́льшим» графически подчёркивает сравнительное значение и предотвращает прочтение как «большим» без явного сопоставления. Полуточка помогает ясно разделить две параллельные части высказывания.
