  to: И те части тела, которые мы считаем менее почётными, мы оказываем больше почёта; а наши части, не предназначенные для показа,[a] имеют более благопристойный вид.[b]
  rationale: Правка уточняет социально-внешний, а не морально-нравственный оттенок ἀσχήμονα, делает русскую фразу более естественной и исправляет чрезмерно буквальное описание лексического варианта в сноске. Сравнительная структура, телесный образ и неоднозначность εὐσχημοσύνη сохранены.
