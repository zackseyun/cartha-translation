  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: ru
  text: 'И Бог поставил в церкви: во-первых — апостолов, во-вторых — пророков, в-третьих — учителей; затем — чудеса[a], затем — дары исцелений, помощь, руководство[b], разные виды языков[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проявления силы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «направление» или «разные формы управления».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «разные виды языков». Греческое слово может означать как языки, так и говорение на языках; основной текст сохраняет неоднозначность выражения Павла.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: поставил
  rationale: Глагол означает, что Бог определил людей и служения на их место в церкви. «Поставил» естественно передаёт как назначение, так и образ размещения, не добавляя идеи формального учреждения должности.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: в церкви
  rationale: В данном контексте ἐκκλησία обозначает общину Божьего народа. «Церковь» — понятный и устойчивый русский эквивалент.
- source_word: πρῶτον … δεύτερον … τρίτον
  choice: во-первых … во-вторых … в-третьих
  rationale: Сохраняется явная последовательность греческого текста без уточнения, означает ли она ранг, хронологию или значимость.
- source_word: ἀποστόλους
  choice: апостолов
  rationale: В перечне церковных служений речь идёт о признанном апостольском служении, а не просто о посланниках в общем смысле.
- source_word: προφήτας
  choice: пророков
  rationale: Прямой и общепринятый эквивалент для носителей пророческого служения.
- source_word: διδασκάλους
  choice: учителей
  rationale: Прямо передаёт служение наставления и обучения в церкви.
- source_word: δυνάμεις
  choice: совершающих чудеса
  rationale: Буквально существительное означает «силы» или «проявления силы», но в перечне оно указывает на чудотворные действия. Личная форма согласует этот пункт с начальным οὓς («которых») и делает фразу естественной по-русски; более буквальный оттенок сохранён в сноске.
- source_word: χαρίσματα ἰαμάτων
  choice: дары исцелений
  rationale: Сохранено множественное число обоих греческих существительных, что не сводит выражение к одному общему дару или одному виду исцеления.
- source_word: ἀντιλήμψεις
  choice: оказание помощи
  rationale: Существительное обозначает помощь и поддержку. Отглагольное выражение ясно передаёт функцию и естественно звучит в русском перечне.
- source_word: κυβερνήσεις
  choice: руководство
  rationale: Слово связано с направлением и управлением, первоначально — с управлением судном. «Руководство» передаёт эту функцию, не превращая её в название определённой церковной должности.
- source_word: γένη γλωσσῶν
  choice: разные виды языков
  rationale: γένη означает виды или разновидности, а γλωσσῶν может обозначать как языки, так и особую речь «на языках». Формулировка сохраняет эту контекстуальную неоднозначность.
theological_decisions:
- issue: Характер последовательности «во-первых … во-вторых … в-третьих … затем»
  choice: Передать последовательность буквально, не объясняя её характера.
  alternative: Истолковать её как постоянную иерархию власти, хронологический порядок появления или шкалу значимости.
  rationale: Текст ясно упорядочивает первые элементы перечня, но сам не уточняет основание этого порядка.
- issue: Значение γλῶσσαι
  choice: Использовать «языки» и пояснить возможное значение в сноске.
  alternative: Однозначно перевести как обычные человеческие языки или как особую экстатическую речь.
  rationale: Русское «языки», как и греческое слово в данном контексте, позволяет не решать спорный вопрос средствами перевода.
- issue: Переход от людей и служений к проявлениям и функциям
  choice: Сохранить переход внутри одного перечня, лишь слегка прояснив личный смысл δυνάμεις выражением «совершающих чудеса».
  alternative: Добавить слова «другим дал» перед дарами и функциями.
  rationale: В греческом тексте такого нового глагола нет; его добавление слишком заметно перестроило бы высказывание.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Строчная буква в слове «церковь» указывает на общину, а не на здание или официальное название учреждения. Тире помогают читателю различить ступени перечня, не добавляя толкования.
