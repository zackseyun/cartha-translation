  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: ru
  text: Но каждому даётся проявление Духа на общее благо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для пользы»; возможно также: «на благо всем».'
    reason: Лексически выражение πρὸς τὸ συμφέρον означает направленность на пользу или благо; общинный охват следует из контекста, но не выражен отдельным словом в самом обороте.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: каждому
  rationale: 'Дательный падеж единственного числа передаёт распределительное значение: проявление Духа даётся каждому человеку в общине.'
- source_word: δὲ
  choice: Но
  rationale: δέ обозначает мягкое противопоставление или переход от разнообразия даров к тому, что проявление Духа даётся каждому; «но» естественно сохраняет эту связь.
- source_word: δίδοται
  choice: даётся
  rationale: Настоящее время страдательного залога передано прямо, без уточнения подразумеваемого Дающего.
- source_word: ἡ φανέρωσις
  choice: проявление
  rationale: Слово обозначает то, посредством чего действие Духа становится явным. «Проявление» точно и естественно звучит в современном русском языке.
- source_word: τοῦ πνεύματος
  choice: Духа
  rationale: В контексте главы речь идёт о Святом Духе, однако перевод не добавляет отсутствующее в этой фразе слово «Святого».
- source_word: πρὸς τὸ συμφέρον
  choice: на общее благо
  rationale: Оборот указывает на пользу или благо. Контекст единого тела поддерживает общинную направленность, но более общее лексическое значение сохранено в сноске.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Святого Духа, с передачей как «Духа»
  alternative: духа в общем смысле
  rationale: В ближайшем контексте один и тот же Дух назван источником даров (ст. 4, 8–11). При этом перевод следует формулировке греческого текста и не добавляет слово «Святого».
- issue: Объём значения συμφέρον
  choice: общее благо
  alternative: то, что полезно; польза без явно указанного круга получателей
  rationale: Само выражение может обозначать полезное вообще, однако рассуждение Павла о многих членах одного тела указывает на пользу для общины. Сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественно-нейтральный. Сохранены страдательная конструкция и богословская сдержанность исходного текста.
