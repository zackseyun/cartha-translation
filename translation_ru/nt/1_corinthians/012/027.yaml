  source_fidelity: «Вы же — тело Мессии, а каждый из вас — часть этого тела» точно передаёт переходное δέ, корпоративное «вы» и противопоставление единого тела множеству его частей. Распределительное развёртывание ἐκ μέρους через «каждый из вас» уместно в данном контексте и не создаёт ложного значения «лишь отчасти». Добавленное «этого тела» не меняет смысла, а делает в русском явной подразумеваемую связь членов с телом.
  naturalness: Фраза звучит естественно и литературно по-русски; тире и частица «же» сохраняют сжатость и риторический переход оригинала. «Часть тела» в современном русском яснее, чем потенциально двусмысленное «член».
  terminology: «Мессии» последовательно отражает Χριστοῦ как титул согласно проектной политике; сноска с вариантом «Христа» достаточна. Терминология телесного образа сохранена без конфессионального истолкования.
