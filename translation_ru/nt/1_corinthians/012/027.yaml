id: 1CO.12.27
reference: 1 Corinthians 12:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/027.yaml
  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: ru
  text: Вы же — тело Мессии[a], а каждый из вас — часть этого тела[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тело Христа». Греческое Χριστός можно передать как «Мессия» или «Христос»; здесь слово понято как титул.'
    reason: alternative_reading
  - marker: b
    text: 'Буквальнее: «а по отдельности — части». Смысл в том, что каждый из вас является отдельной частью единого тела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение второго лица множественного числа обращено ко всей коринфской общине; в русском его выразительность поддерживается частицей «же».
- source_word: δέ
  choice: же
  rationale: Частица обозначает переход от образа одного тела и многих частей к его непосредственному применению к адресатам; «же» естественно передаёт этот переход без излишне резкого противопоставления.
- source_word: σῶμα Χριστοῦ
  choice: тело Мессии
  rationale: Сочетание определяет общину как тело Мессии. Русская форма с родительным падежом естественно передаёт греческую конструкцию.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет значение мессианского титула; вариант «Христа», более привычный для русской библейской речи, указан в сноске.
- source_word: μέλη
  choice: часть этого тела
  rationale: В контексте телесного образа μέλη — составные части тела. Единственное число согласовано с распределительным «каждый из вас»; уточнение «этого тела» делает связь ясной и не превращает «члены» лишь в обозначение участников организации.
- source_word: ἐκ μέρους
  choice: каждый из вас
  rationale: 'Оборот имеет распределительный смысл: община в совокупности является телом, а каждый человек занимает в нём место отдельной части. Такое выражение не создаёт возможного для буквального «отчасти» значения неполноты.'
theological_decisions:
- issue: Передача Χριστοῦ в утверждении о церкви как теле
  choice: Мессии
  alternative: Христа
  rationale: Перевод «Мессии» раскрывает значение титула Χριστός и сохраняет утверждение Павла о принадлежности тела Мессии; традиционная форма «Христа» остаётся допустимой и отмечена в сноске.
- issue: Смысл ἐκ μέρους в καὶ μέλη ἐκ μέρους
  choice: 'распределительное значение: «каждый из вас — часть этого тела»'
  alternative: '«а по отдельности — части»; буквально: «части отчасти/по части»'
  rationale: Ближайший контекст сопоставляет одно тело со многими его частями. Выбранная формулировка сохраняет единство общины и отдельное участие каждого, не внушая ошибочной мысли, будто адресаты лишь отчасти являются членами тела.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Тире подчёркивают отождествление и параллелизм. Формулировка избегает двусмысленного русского «члены» и передаёт телесный образ через «часть тела».
