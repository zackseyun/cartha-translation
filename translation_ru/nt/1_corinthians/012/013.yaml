id: 1CO.12.13
reference: 1 Corinthians 12:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: ru
  text: Ведь в одном Духе[a] все мы были крещены в одно тело — иудеи или греки, рабы или свободные, — и все были напоены одним Духом[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одним Духом». Греческий предлог ἐν может указывать как на сферу действия («в»), так и на средство или действующее начало («посредством», «кем»).'
    reason: alternative_reading
  - marker: b
    text: 'Возможный перевод: «и всем нам было дано пить одного Духа».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «одним духом», если понимать это не как прямое указание на Святого Духа, а как общую духовную реальность; однако контекст преимущественно указывает на Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ведь
  rationale: Передаёт пояснительное значение γάρ и усилительный оттенок καί естественным современным русским союзом.
- source_word: ἐν ἑνὶ πνεύματι
  choice: в одном Духе
  rationale: Сохраняет форму греческого выражения и не устраняет возможный оттенок сферы действия; инструментальное понимание отмечено в сноске.
- source_word: ἡμεῖς πάντες
  choice: все мы
  rationale: Передаёт эмфатическое сочетание явного местоимения с πάντες.
- source_word: ἐβαπτίσθημεν
  choice: были крещены
  rationale: Обычное и контекстуально точное соответствие пассивной форме βαπτίζω без внесения акцента на способ совершения крещения.
- source_word: εἰς ἓν σῶμα
  choice: в одно тело
  rationale: Предлог εἰς выражает включение в одно тело и сохраняет образ единства, развиваемый Павлом.
- source_word: Ἰουδαῖοι εἴτε Ἕλληνες
  choice: иудеи или греки
  rationale: Передаёт этнорелигиозное противопоставление буквально, не расширяя Ἕλληνες до общего обозначения всех язычников.
- source_word: δοῦλοι εἴτε ἐλεύθεροι
  choice: рабы или свободные
  rationale: В явном социально-правовом противопоставлении δοῦλοι означает именно рабов, а не просто слуг.
- source_word: ἐποτίσθημεν
  choice: были напоены
  rationale: Передаёт пассив ποτίζω и общий образ питья кратко и естественно по-русски.
- source_word: ἓν πνεῦμα
  choice: одним Духом
  rationale: Творительный падеж после «напоены» естественно обозначает то, чем напоили; прописная буква отражает наиболее вероятную отсылку к Святому Духу.
theological_decisions:
- issue: Сферическое или инструментальное значение ἐν ἑνὶ πνεύματι
  choice: в одном Духе
  alternative: одним Духом
  rationale: Греческое ἐν допускает оба оттенка. Основной текст близко следует форме оригинала, а сноска сохраняет возможное указание на Духа как действующее средство, не закрепляя спорное богословское толкование.
- issue: Относится ли ἓν πνεῦμα во второй части к Святому Духу
  choice: одним Духом
  alternative: одним духом
  rationale: Непосредственный контекст о единящем действии Духа убедительно поддерживает личную отсылку к Святому Духу, однако регистр буквы является переводческим истолкованием, поэтому иной вариант указан в сноске.
- issue: Передача δοῦλοι в противопоставлении ἐλεύθεροι
  choice: рабы
  alternative: слуги
  rationale: Здесь прямо противопоставлены несвободный и свободный социальные статусы, поэтому «рабы» точно передаёт смысл без смягчения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сохраняет параллелизм и перечисление оригинала; тире выделяют две пары, охватывающие этнические и социальные различия. Термины не архаизированы и не привязаны к конфессионально особому толкованию.
