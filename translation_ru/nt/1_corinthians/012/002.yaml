review_pass:
  verdict: approve
  source_fidelity: «Когда вы были язычниками» уместно передаёт ὅτε ἔθνη ἦτε в данном контексте; оно сохраняет этнорелигиозную окраску без неоправданного уточнения. «К безгласным идолам» точно отражает πρὸς τὰ εἴδωλα τὰ ἄφωνα, включая направленность πρός и контраст с идолами, не способными говорить. Пассивные формы «вас уводили … вас ни вели» передают ἤγεσθε ἀπαγόμενοι и не называют деятеля. Оборот «как бы вас ни вели» адекватно сохраняет неопределённо-модальное значение ὡς ἄν, хотя намеренно повторяет образ ведения.
  naturalness: Текст написан современным литературным русским языком и выдерживает умеренно возвышенный библейский регистр. Повтор «вас уводили … вас ни вели» несколько шероховат, но это оправданное отражение двух греческих пассивных форм и не затрудняет понимания. «Безгласным» — литературное и точное слово в этом контексте.
  terminology: «Язычники» и «идолы» терминологически последовательны и контекстуально точны. «Безгласные идолы» удачно сохраняет образ ἄφωνα, не сводя его к нейтральному «молчаливые» и не вводя физиологически окрашенное «немые».
