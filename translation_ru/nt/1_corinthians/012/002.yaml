  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: ru
  text: Вы знаете, что, когда вы были язычниками[a], вас уводили к безгласным идолам[b], как бы вас ни вели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людьми из языческих народов». Здесь речь идёт не просто об этническом происхождении, но и о прежней жизни среди идолопоклонства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к безгласным идолам, как бы вас ни вели, уводимые». Две страдательные формы подчёркивают, что прежде они подчинялись внешнему влиянию; кто именно их вёл, в тексте не сказано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: вы знаете
  rationale: Прямое настоящее время передаёт обращение Павла к общему знанию адресатов и естественно звучит по-русски.
- source_word: ἔθνη
  choice: язычниками
  rationale: В данном контексте слово обозначает прежнюю принадлежность коринфян к неиудейскому миру и одновременно их языческий религиозный уклад. «Язычниками» естественно сохраняет обе стороны значения; «народами» здесь было бы неясно.
- source_word: πρὸς τὰ εἴδωλα τὰ ἄφωνα
  choice: к безгласным идолам
  rationale: Предлог передаёт направленность движения, а «безгласным» сохраняет сжатый образ неспособных говорить идолов и его контраст с вдохновлённой Духом речью в ближайшем контексте.
- source_word: ἤγεσθε
  choice: вас … вели
  rationale: Страдательная форма и несовершенный вид передают продолжавшееся в прошлом воздействие, которому адресаты подчинялись.
- source_word: ἀπαγόμενοι
  choice: вас уводили
  rationale: Причастие усиливает образ пассивного движения прочь, к ложному поклонению. Личная конструкция «вас уводили» естественнее по-русски, чем буквальное страдательное причастие.
- source_word: ὡς ἂν
  choice: как бы … ни
  rationale: 'Сочетание имеет неопределённо-модальное значение: «каким бы образом ни», «как бы ни». Такая формулировка сохраняет необычную повторность греческой фразы и не уточняет неназванного деятеля.'
theological_decisions:
- issue: Значение ἔθνη применительно к прежней жизни коринфян
  choice: «язычниками» — с сохранением этнорелигиозного смысла в данном контексте
  alternative: «людьми из других народов» или «народами»
  rationale: Павел напоминает о прежнем состоянии адресатов до их исповедания Иисуса Господом. «Язычниками» передаёт контекст поклонения идолам, не добавляя более сильной нравственной оценки.
- issue: Контраст между безгласными идолами и речью, связанной с Духом
  choice: сохранено определение «безгласным»
  alternative: «идолам, которые не могут говорить»
  rationale: Компактный образ следует греческому тексту и сохраняет риторический контраст, не превращая его в добавленное переводчиком объяснение.
- issue: Неопределённый деятель в пассивных формах
  choice: 'деятель не назван: «вас уводили… вас ни вели»'
  alternative: указать, что их вели люди, силы или идолы
  rationale: Греческий текст не называет того, кто вёл адресатов; перевод сохраняет эту смысловую открытость и связанную с ней богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достоинственным звучанием. Сохранена намеренная шероховатость и повторность заключительной греческой конструкции, но буквальное причастие заменено естественной русской личной конструкцией. «Безгласным» выбрано вместо разговорного или физиологически окрашенного «немым».
