base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: ru
  text: И если страдает один член, с ним страдают все члены; если же член удостаивается чести[a], с ним радуются все члены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославляется». В данном контексте речь, вероятнее всего, о чести, оказываемой одному из членов тела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: если … если же
  rationale: Повтор условной конструкции естественен для современного русского языка и сохраняет две сопоставленные ситуации; частица «же» подчёркивает контраст, не превращая его в строгое противопоставление.
- source_word: πάσχει
  choice: страдает
  rationale: Передаёт общее значение настоящего времени и не уточняет без основания характер боли или бедствия.
- source_word: ἓν μέλος
  choice: один член
  rationale: Сохраняет и числительное ἓν, и развёрнутый образ тела. В данном контексте «член» понятно обозначает часть тела и одновременно участника общины.
- source_word: συμπάσχει
  choice: с ним страдают
  rationale: Передаёт значение совместного страдания, выраженное приставочным глаголом, и ясно соотносит переживание всех членов с одним членом.
- source_word: πάντα τὰ μέλη
  choice: все члены
  rationale: Сохраняет повтор одной и той же формулы в обеих частях стиха и поддерживает образ единого тела.
- source_word: δοξάζεται
  choice: удостаивается чести
  rationale: В контексте взаимной заботы членов тела обозначает получение чести или почёта; формулировка естественна по-русски и не навязывает специального смысла эсхатологического прославления.
- source_word: μέλος
  choice: один член
  rationale: Хотя во второй части основного текста нет числительного ἕν, русское «один член» естественно обозначает отдельный член тела и сохраняет ясную параллель с первой частью, не меняя смысла на «единственный».
- source_word: συγχαίρει
  choice: с ним радуются
  rationale: Передаёт совместную радость всех членов по поводу чести, оказанной одному из них.
theological_decisions:
- issue: Значение δοξάζεται в образе тела общины
  choice: удостаивается чести
  alternative: прославляется
  rationale: Ближайший контекст говорит о взаимной заботе и сопричастности членов одного тела. Основной перевод передаёт социальное оказание чести, а допустимый более буквальный вариант сохранён в примечании, чтобы не скрывать широту греческого слова.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены симметрия двух частей, повтор «все члены» и телесно-общинная метафора. Местоимение «ним» грамматически согласуется с существительным «член».
