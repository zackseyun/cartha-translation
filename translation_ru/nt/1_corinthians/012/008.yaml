  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: ru
  text: Одному через Духа даётся слово мудрости[a], другому — слово знания[b], согласно тому же Духу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высказывание мудрости»; «весть мудрости».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «высказывание знания»; «весть знания».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по тому же Духу»; «в соответствии с тем же Духом». В греческом здесь употреблён иной предлог, чем в выражении «через Духа»; он может подчёркивать соответствие действию одного и того же Духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: одному ... другому
  rationale: Естественно передаёт распределительную конструкцию и противопоставление между разными членами общины.
- source_word: διὰ τοῦ πνεύματος
  choice: через Духа
  rationale: Сохраняет значение посредства или действующей силы у διά с родительным падежом и отличает эту конструкцию от последующего κατά.
- source_word: δίδοται
  choice: даётся
  rationale: 'Передаёт настоящее время и страдательный залог: дар сообщается человеку, а не возникает у него самостоятельно.'
- source_word: λόγος σοφίας
  choice: слово мудрости
  rationale: «Слово» сохраняет широту λόγος — высказывание, речь или сообщение — и звучит естественно в данном перечислении духовных проявлений; возможное пояснение дано в сноске.
- source_word: λόγος γνώσεως
  choice: слово знания
  rationale: Сохраняет синтаксический параллелизм с λόγος σοφίας и не конкретизирует характер знания сверх сказанного в греческом тексте.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: по тому же Духу
  rationale: Передаёт значение соответствия или сообразности у κατά и сохраняет отличие от ранее употреблённого «через Духа», хотя русская формулировка требует пояснения.
theological_decisions:
- issue: Кого обозначает πνεῦμα
  choice: 'Святой Дух, обозначенный прописной буквой: «Дух»'
  alternative: человеческий дух
  rationale: В ближайшем контексте один и тот же Дух распределяет духовные проявления; прописная буква ясно передаёт контекстуальный референт без добавления слова «Святой», которого нет в стихе.
- issue: Характер выражений λόγος σοφίας и λόγος γνώσεως
  choice: «слово мудрости» и «слово знания» без дальнейшего определения природы этих даров
  alternative: «весть мудрости/знания» или «высказывание мудрости/знания»
  rationale: Греческий текст не объясняет точный способ или содержание этих проявлений. Перевод сохраняет эту открытость и не связывает выражения с определённой конфессиональной трактовкой.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой. Тире восполняет опущенный во второй части глагол. Формула «по тому же Духу» намеренно сохраняет различие греческих предлогов; её смысл пояснён в сноске.
