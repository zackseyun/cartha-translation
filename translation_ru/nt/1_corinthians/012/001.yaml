  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: ru
  text: Что же касается духовных даров[a], братья[b], я не хочу, чтобы вы оставались в неведении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духовного»; греческое выражение шире слова «дары», хотя далее в этой главе речь главным образом идёт о дарах, которые даёт Дух.'
    reason: alternative_reading
  - marker: b
    text: Обращение «братья» у Павла, вероятно, относится ко всей общине, включая женщин.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Что же касается
  rationale: Естественно вводит новую тему и передаёт как значение περί («о, относительно»), так и мягкую переходную функцию δέ без временного оттенка.
- source_word: τῶν πνευματικῶν
  choice: духовных даров[a]
  rationale: Субстантивированное прилагательное допускает более широкое понимание («духовное», «то, что связано с Духом»), однако дальнейший контекст 12:4–11 сосредоточен на дарах и проявлениях Духа. Слово «даров» контекстуально оправдано, а неоднозначность сохранена в сноске.
- source_word: ἀδελφοί
  choice: братья[b]
  rationale: Сохраняет мужскую форму обращения оригинала. В посланиях Павла это обращение обычно относится ко всей общине, включая женщин; это пояснено в сноске.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: я не хочу, чтобы вы оставались в неведении
  rationale: Современная и естественная русская передача павловой формулы, вводящей важное наставление; выражает отсутствие знания без уничижительного оттенка.
theological_decisions:
- issue: Толкование τῶν πνευματικῶν
  choice: 'В основном тексте: «духовных даров»'
  alternative: «духовного»; «того, что связано с Духом»; менее вероятно — «духовных людей»
  rationale: Греческое выражение эллиптично и само по себе шире слова «дары», но ближайший контекст говорит о дарах и проявлениях, распределяемых Духом. Основной текст отражает наиболее вероятный контекстуальный смысл, а подлинная широта выражения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и естественным синтаксисом. Формулировка сохраняет мягкий переход к новой теме, мужскую форму обращения оригинала и отмечает лексическую неоднозначность τῶν πνευματικῶν.
