  verdict: approve
  source_fidelity: «Что же касается духовных даров, братья, я не хочу, чтобы вы оставались в неведении» точно передаёт структуру и смысл Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν. «Духовных даров» является контекстуально обоснованным истолковывающим переводом, а неявное в греческом слово «дары» надлежащим образом оговорено в сноске.
  naturalness: Фраза звучит естественно на современном литературном русском. «Что же касается» уместно вводит новую тему; «оставались в неведении» — достойная, не уничижительная и понятная передача павловской формулы.
  terminology: «Духовные дары» соответствует обычному русскому библейскому употреблению и контексту 1 Кор 12–14. Мужская форма «братья» сохраняет форму оригинала, а примечание корректно сообщает о вероятном обращении ко всей общине. Сноска a сохраняет существенную семантическую широту τῶν πνευματικῶν без навязывания спорного толкования.
