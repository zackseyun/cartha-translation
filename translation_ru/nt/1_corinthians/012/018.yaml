source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: ru
  text: Но теперь Бог расположил части тела — каждую из них — в теле так, как пожелал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Но теперь
  rationale: Сочетание возвращает от предшествующего предположения к действительному положению дел и сохраняет контраст; в данном контексте «теперь» имеет логический, а не строго временной смысл.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое и естественное соответствие греческому подлежащему.
- source_word: ἔθετο
  choice: расположил
  rationale: Глагол означает «поместил, установил»; здесь «расположил» естественно передаёт целенаправленное размещение частей в составе единого тела.
- source_word: τὰ μέλη
  choice: части тела
  rationale: В телесной метафоре μέλη обозначает составляющие тела. «Части тела» понятно современному читателю и не сужает значение до одних конечностей.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: каждую из них
  rationale: Передаёт подчёркнуто распределительное значение выражения и согласуется с русским словосочетанием «части тела».
- source_word: ἐν τῷ σώματι
  choice: в теле
  rationale: Прямой и естественный перевод пространственного выражения, сохраняющий образ тела.
- source_word: καθὼς ἠθέλησεν
  choice: так, как пожелал
  rationale: Сохраняет значение соответствия Божьему волеизъявлению и звучит естественно и достойно в современном русском языке.
theological_decisions:
- issue: Божественная целенаправленность в размещении частей тела
  choice: Бог расположил каждую часть тела так, как пожелал.
  alternative: Бог лишь поместил части в теле без выраженного оттенка упорядочения.
  rationale: Контекст и сочетание ἔθετο с καθὼς ἠθέλησεν показывают, что разнообразие частей не случайно, а соответствует Божьему намерению; перевод не распространяет это утверждение за пределы мысли данного стиха.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный регистр. Тире выделяют распределительное уточнение «каждую из них» и воспроизводят его смысловой акцент без тяжеловесности.
