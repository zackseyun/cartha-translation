base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: ru
  text: иному — совершение чудес[a], иному — пророчество, иному — различение духов, иному — разные виды языков[b], иному — истолкование языков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действия сил»; или: «совершение могущественных деяний».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разновидности языков». Греческое слово γλῶσσα означает «язык»; в контексте духовных даров природа этого явления остаётся неуточнённой. Перевод «языки» сохраняет эту неоднозначность.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα
  choice: совершение
  rationale: Слово обозначает действия, проявления или производимые результаты. «Совершение» естественно сочетается с «чудесами» и передаёт деятельный характер дара.
- source_word: δυνάμεων
  choice: чудес
  rationale: Буквально слово означает «силы», но во множественном числе в таком контексте обычно указывает на могущественные, чудесные деяния. Основной текст передаёт вероятный смысл, а буквальные варианты сохранены в сноске.
- source_word: προφητεία
  choice: пророчество
  rationale: Прямой и общепонятный эквивалент, не сужающий значение до предсказания будущего или только до одной формы пророческой речи.
- source_word: διακρίσεις
  choice: различение
  rationale: Русское отвлечённое существительное естественно обозначает распознавание и оценку различий. Хотя греческое слово стоит во множественном числе, буквальное «различения» в данном перечне звучит неестественно.
- source_word: πνευμάτων
  choice: духов
  rationale: Сохранено широкое значение греческого слова без уточнения, идёт ли речь о духовных источниках, человеческих духах, добрых или злых духах.
- source_word: γένη
  choice: разные виды
  rationale: Передаёт идею классов или разновидностей и естественно звучит в современном русском языке.
- source_word: γλωσσῶν
  choice: языков
  rationale: 'Русское «языки» сохраняет присущую греческому слову неоднозначность: оно может обозначать языки речи и особое говорение «на языках», не определяя заранее природу явления.'
- source_word: ἑρμηνεία
  choice: истолкование
  rationale: Обозначает передачу содержания языков в понятной форме; «истолкование» сохраняет возможность как перевода, так и объяснения.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: иному
  rationale: Повторяющийся дательный падеж показывает распределение проявлений между разными людьми. Единый перевод не преувеличивает стилистическую смену греческих слов.
theological_decisions:
- issue: Значение δυνάμεων в перечне духовных проявлений
  choice: «чудес»
  alternative: «сил», «могущественных деяний»
  rationale: В этом контексте слово, вероятнее всего, обозначает чудесные проявления силы. Сноска сохраняет более буквальные возможности и не вводит особого учения о продолжительности или прекращении таких даров.
- issue: Природа γλωσσῶν
  choice: «языков»
  alternative: «разновидностей речи» или уточнение «иностранных языков»
  rationale: Текст не определяет, имеются ли в виду известные человеческие языки, экстатическая речь или более широкое явление. «Языки» сохраняет эту богословскую и лексическую неоднозначность.
- issue: Референт πνευμάτων
  choice: 'оставлено широко: «духов»'
  alternative: «духовных высказываний», «духов, стоящих за высказываниями», «человеческих духов»
  rationale: Греческий текст не уточняет референт; конкретизация преждевременно разрешила бы интерпретационный вопрос.
translation_notes:
  register: Современный литературный русский язык с лаконичной ритмикой перечня. Повтор «иному» сохраняет распределительную структуру оригинала; тире делает опущенный глагол понятным. Термины подобраны без конфессионально обусловленных уточнений.
