  terminology: «Апостолы», «пророки» и «учители» — устоявшиеся, точные и нейтральные в конфессиональном отношении термины. Сноска корректно отмечает буквальное «силы» и осторожно объясняет контекстуальную метонимию, не навязывая богословского истолкования.
