id: 1CO.12.29
reference: 1 Corinthians 12:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: ru
  text: Разве все апостолы? Разве все пророки? Разве все учители? Разве все творят чудеса?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Разве все — силы?» Греческое слово «силы» здесь служит кратким обозначением чудесных деяний или тех, кто их совершает.'
    reason: 'Лексическая альтернатива: показывает буквальную форму δυνάμεις и объясняет метонимическую передачу «творят чудеса».'
lexical_decisions:
- source_word: μὴ
  choice: разве
  rationale: Частица μὴ вводит риторический вопрос, предполагающий отрицательный ответ. «Разве» естественно передаёт это ожидание по-русски и сохраняет повторяющуюся вопросительную форму.
- source_word: πάντες
  choice: все
  rationale: «Все» прямо передаёт πάντες и сохраняет риторический повтор, подчёркивающий, что не каждый член тела имеет одну и ту же роль или дар.
- source_word: ἀπόστολοι
  choice: апостолы
  rationale: В данном перечне служений у Павла речь идёт об апостолах, а не просто о посланниках; традиционный термин точен и понятен.
- source_word: προφῆται
  choice: пророки
  rationale: Обычный и точный русский эквивалент для людей, пророчествующих в общине.
- source_word: διδάσκαλοι
  choice: учители
  rationale: «Учители» естественно обозначает людей, исполняющих служение наставления, и соответствует церковному контексту перечня.
- source_word: δυνάμεις
  choice: творят чудеса
  rationale: Буквально существительное означает «силы», а в контексте — могущественные, чудесные деяния и метонимически их совершение. Глагольная передача по-русски ясно выражает смысл, не создавая впечатления, будто люди сами являются «силами».
theological_decisions:
- issue: Передача δυνάμεις в ряду лиц, служений и даров
  choice: Разве все творят чудеса?
  alternative: Разве все обладают чудотворными силами? / букв. «Разве все — силы?»
  rationale: Греческий текст использует краткое метонимическое обозначение. Выбранная формулировка передаёт действие, о котором идёт речь, не утверждая сверх текста, каким образом или на каком основании оно совершается; буквальная форма отмечена в сноске.
- issue: Отрицательное ожидание риторических вопросов с μὴ
  choice: Повтор «Разве все…?»
  alternative: Все ли…? / Не все же…?
  rationale: «Разве» сохраняет вопросительную форму и явно передаёт ожидаемый ответ «нет», тогда как «Все ли…?» слабее выражает значение μὴ, а «Не все же…» превращает вопрос в более прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-риторическим повтором. Эллиптическое построение первых трёх вопросов сохранено; в последнем вопросе метонимия раскрыта естественным русским глагольным оборотом. Маркер сноски поставлен после относящегося к ней выражения.
