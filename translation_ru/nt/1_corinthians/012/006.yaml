base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: ru
  text: И действия бывают различны, но Бог один и тот же — Тот, Кто производит всё во всех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всех». Греческий текст не называет существительного; в данном контексте выражение, вероятно, относится прежде всего ко всем членам общины, в которых Бог производит эти проявления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: бывают различны
  rationale: Передаёт разнообразие проявлений без оттенка раскола; естественно сочетается с существительным «действия».
- source_word: ἐνεργημάτων
  choice: действия
  rationale: Обозначает проявления или результаты действующей силы; повтор глагола «производит» сохраняет смысловую связь с ἐνεργῶν, не создавая в русском тяжеловесного однокоренного оборота.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: но Бог один и тот же
  rationale: δέ выражает мягкое противопоставление разнообразия действий единству их Источника; αὐτός подчёркивает тождество Бога в параллельном ряду стихов 4–6.
- source_word: ὁ ἐνεργῶν
  choice: и Он производит
  rationale: Причастие раскрыто личной глагольной конструкцией, естественной для русского языка; настоящее время передаёт постоянное активное действие.
- source_word: τὰ πάντα
  choice: всё
  rationale: Сохраняет широкий и неуточнённый охват греческого выражения, не сужая его до перечисленных даров.
- source_word: ἐν πᾶσιν
  choice: во всех
  rationale: Сохраняет формальную неопределённость греческого текста, где существительное не названо; контекст указывает прежде всего на всех членов общины.
theological_decisions:
- issue: Объём Божьего действия в τὰ πάντα ἐν πᾶσιν
  choice: «производит всё во всех»
  alternative: «производит всё во всех людях» / «производит всё во всём»
  rationale: Формулировка сохраняет широту τὰ πάντα и не вставляет отсутствующее в греческом существительное после πᾶσιν. Контекст духовных проявлений среди членов общины отражён в примечании, а богословское напряжение не снимается искусственным уточнением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет параллелизм стихов 4–6; союз «но» подчёркивает единство Бога при разнообразии действий.
