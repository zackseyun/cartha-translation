reference: 1 Corinthians 12:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: ru
  text: Ведь как тело одно и имеет много членов, и все члены тела, хотя их много, составляют одно тело, так и Мессия[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός означает «Помазанник»; здесь оно передано словом «Мессия», чтобы сохранить его значение как титула.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «так и Мессия». Это сжатое выражение далее раскрывается через образ многих членов, составляющих одно тело.'
    reason: cross_reference
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: Ведь как
  rationale: «Как» передаёт сравнительную силу καθάπερ, а «ведь» — пояснительную связь γάρ с предыдущим рассуждением.
- source_word: σῶμα
  choice: тело
  rationale: Прямое и естественное соответствие, сохраняющее центральный для контекста образ тела.
- source_word: ἕν
  choice: одно
  rationale: Сохраняет числовое единство и смысл единства многих членов в одном теле.
- source_word: μέλη
  choice: члены
  rationale: «Члены» обозначает части тела и одновременно сохраняет важную для дальнейшего рассуждения связь с членами общины; более нейтральное «части» ослабило бы эту смысловую перекличку.
- source_word: πάντα δὲ τὰ μέλη τοῦ σώματος πολλὰ ὄντα
  choice: и все члены тела, хотя их много
  rationale: δέ имеет здесь связующую, а не резко противопоставительную силу; оборот «хотя их много» естественно выражает уступительный смысл причастия πολλὰ ὄντα.
- source_word: ἕν ἐστιν σῶμα
  choice: составляют одно тело
  rationale: Греческое выражение буквально означает «есть одно тело»; глагол «составляют» делает русскую фразу естественной при подлежащем во множественном числе, не меняя смысла.
- source_word: οὕτως καὶ
  choice: так и
  rationale: Кратко и точно передаёт вывод из сравнения.
- source_word: ὁ Χριστός
  choice: Мессия
  rationale: Χριστός здесь сохраняет титульный смысл «Помазанник»; «Мессия» передаёт его как титул, а не только как ставшее именем слово.
theological_decisions:
- issue: Передача ὁ Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном богословском сравнении слово имеет явную титульную весомость. «Мессия» сохраняет значение титула; допустимый традиционный вариант отмечен в сноске.
- issue: Сжатое выражение «так и Мессия»
  choice: Сохранить без поясняющего добавления
  alternative: «так и тело Мессии» или «так и церковь»
  rationale: Греческий текст прямо говорит οὕτως καὶ ὁ Χριστός. Добавление «тело» или «церковь» преждевременно истолковало бы намеренно сжатую формулировку, которую раскрывают последующие стихи.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет ход греческого сравнения, а слово «члены» удерживает телесный образ и его дальнейшее общинное применение.
