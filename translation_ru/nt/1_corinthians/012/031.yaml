  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: ru
  text: Но ревностно стремитесь к большим дарам[a]. И я покажу вам путь, несравненно лучший[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но вы ревностно стремитесь к большим дарам». Греческую форму ζηλοῦτε здесь можно понять и как повелительное, и как изъявительное наклонение.'
    reason: alternative_reading
  - marker: b
    text: 'Традиционно: «путь ещё превосходнейший».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: ревностно стремитесь
  rationale: Передаёт сильное, деятельное стремление, выраженное глаголом ζηλόω. В основном тексте форма понята как повелительное наклонение; возможное изъявительное значение сохранено в примечании.
- source_word: χαρίσματα
  choice: дары
  rationale: В контексте речь идёт о дарах благодати, однако определение «духовные» в этой фразе отсутствует и потому не добавлено.
- source_word: μείζονα
  choice: большим
  rationale: Сохраняет сравнительное значение «большие, более важные», не уточняя сверх текста, по какому именно признаку эти дары превосходят другие.
- source_word: καὶ ἔτι
  choice: И
  rationale: Союз сохраняет связь со сказанным ранее; значение дальнейшего усиления естественно выражено в сочетании «несравненно лучший».
- source_word: καθ’ ὑπερβολὴν
  choice: несравненно лучший
  rationale: Естественно по-русски передаёт идею чрезвычайной, превосходящей степени, избегая тяжеловесного буквального оборота.
- source_word: ὁδὸν
  choice: путь
  rationale: Сохраняет метафору образа жизни или направления действий, вводящую рассуждение о любви в следующей главе.
- source_word: δείκνυμι
  choice: я покажу
  rationale: Хотя в греческом употреблено настоящее время, русское будущее естественно обозначает непосредственно предстоящее изложение в следующей главе.
theological_decisions:
- issue: Наклонение ζηλοῦτε
  choice: 'повелительное: «ревностно стремитесь»'
  alternative: 'изъявительное: «вы ревностно стремитесь»'
  rationale: Греческая форма допускает оба разбора. Повелительное значение хорошо согласуется с увещевательным контекстом, но альтернативное прочтение отмечено, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранена метафора пути; чрезмерно церковнославянская формула вынесена в примечание.
