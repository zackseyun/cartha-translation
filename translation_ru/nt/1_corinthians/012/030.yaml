  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: ru
  text: Разве у всех есть дары исцелений[a]? Разве все говорят на языках[b]? Разве все истолковывают?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дары исцелений»; в греческом тексте оба существительных стоят во множественном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорят на языках». В данном контексте речь идёт о духовном даре, обычно называемом говорением на языках.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: Разве у всех…? / Разве все…?
  rationale: Частица μή в этих риторических вопросах предполагает отрицательный ответ; конструкция «разве…?» естественно передаёт это ожидание по-русски.
- source_word: χαρίσματα
  choice: дары
  rationale: В данном контексте χάρισμα означает дар, полученный по благодати; краткое «дары» естественно и соответствует терминологии главы.
- source_word: ἰαμάτων
  choice: исцелений
  rationale: Сохранено множественное число греческого ἰαμάτων, не сводя выражение к отвлечённому единственному «исцеления».
- source_word: γλώσσαις λαλοῦσιν
  choice: говорят на языках
  rationale: В 1 Кор 12–14 выражение обозначает харизматическую речь, традиционно называемую говорением на языках; настоящее время выражает общую способность или практику.
- source_word: διερμηνεύουσιν
  choice: истолковывают
  rationale: В контексте речи на языках глагол означает передавать смысл высказывания так, чтобы оно стало понятным другим; «истолковывают» сохраняет связь с духовным даром, не сужая значение до обычного перевода.
theological_decisions:
- issue: Риторические вопросы с μή
  choice: Передать вопросами с «разве», предполагающими отрицательный ответ
  alternative: Передать нейтральными вопросами «Все ли…?»
  rationale: Греческий синтаксис подчёркивает, что не каждый верующий обладает каждым даром; «разве» ясно и естественно сохраняет этот акцент на разнообразии даров в одном теле.
translation_notes:
  register: Современный литературный русский язык; риторический рисунок трёх параллельных вопросов сохранён. Формулировки dignified и понятны без конфессионального уточнения природы даров.
