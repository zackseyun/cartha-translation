base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: ru
  text: Всё это совершает один и тот же Дух, наделяя каждого особо, как Ему угодно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Он решает» или «как Он желает». Греческий глагол может обозначать волю, выбор или желание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Всё же это
  rationale: πάντα ταῦτα охватывает все только что перечисленные проявления Духа; δέ передано частицей «же», которая естественно обозначает мягкий переход и противопоставляет разнообразию даров их единый источник.
- source_word: ἐνεργεῖ
  choice: совершает
  rationale: Глагол обозначает действенное осуществление или произведение результата. «Совершает» передаёт активную причинность, не уточняя её механизм.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: один и тот же Дух
  rationale: Оборот подчёркивает тождество и единство источника разнообразных проявлений. Заглавная буква указывает на Святого Духа, как требует контекст.
- source_word: διαιροῦν
  choice: наделяя
  rationale: 'Причастие поясняет, каким образом действует Дух: Он распределяет дары между людьми. «Наделяя» естественно для современного русского языка и сохраняет идею предоставления каждому своей доли.'
- source_word: ἰδίᾳ ἑκάστῳ
  choice: каждого особо
  rationale: 'Сочетание выражает индивидуальное распределение: каждый человек получает предназначенное именно ему. «Особо» сохраняет усиление, создаваемое ἰδίᾳ рядом с ἑκάστῳ.'
- source_word: καθὼς βούλεται
  choice: как Ему угодно
  rationale: Оборот выражает волю и решение самого Духа. Такая формулировка естественна по-русски и сохраняет личную, намеренную деятельность субъекта.
theological_decisions:
- issue: Личная деятельность и воля Духа в πνεῦμα / βούλεται
  choice: «Дух… как Ему угодно» — с личным местоимением и прописной буквой
  alternative: «дух… как ему угодно» либо безличная формулировка «как определено»
  rationale: Хотя πνεῦμα в греческом языке среднего рода, βούλεται прямо приписывает Духу волю. Контекст представляет Его личным действующим субъектом; русское «Ему» передаёт это, не основывая толкование на грамматическом роде.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет единый источник действия и индивидуальный характер распределения. Единственная сноска отмечает смысловой диапазон βούλεται; остальные решения достаточно ясно переданы в основном тексте.
