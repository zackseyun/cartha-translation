  terminology: Написание «Дух» с прописной буквы оправдано ближайшим контекстом 1 Кор 12. Личное «Ему» корректно передаёт волевое действие, выраженное βούλεται, без добавления конфессионально-специфических утверждений. «Наделяя» уместно для διαιροῦν в контексте даров.
