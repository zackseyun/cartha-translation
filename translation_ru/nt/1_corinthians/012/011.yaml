  source_fidelity: 'В целом перевод точно передаёт единство действующего Духа, Его волю и индивидуальное распределение. Однако «Всё же это» неудачно распределяет значение δέ: в русском «же» после «всё» может восприниматься как усиленное противопоставление («всё же, несмотря на это»), которого греческий текст не требует. «Всё это» естественно передаёт πάντα ταῦτα; мягкий связующий δέ может оставаться невыраженным.'
