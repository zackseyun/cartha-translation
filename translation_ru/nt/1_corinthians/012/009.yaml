lexical_decisions:
- source_word: ἑτέρῳ
  choice: другому
  rationale: 'Дательный падеж продолжает начатое в предыдущем стихе распределительное перечисление: одному даётся одно, другому — другое. Такой перевод естественен по-русски.'
- source_word: πίστις
  choice: вера
  rationale: Основное и наиболее естественное соответствие в данном контексте. Речь идёт о даре, сообщаемом Духом, однако перевод не уточняет его природу сверх сказанного в тексте.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: тем же Духом
  rationale: Предлог ἐν здесь допускает инструментальное понимание. Творительный падеж естественно передаёт действие Духа и сохраняет акцент на том же самом Духе.
- source_word: ἄλλῳ
  choice: иному
  rationale: Слово продолжает распределительное перечисление. Вариант «иному» сохраняет стилистическое чередование греческих ἑτέρῳ и ἄλλῳ, не утверждая между ними строгого смыслового различия.
- source_word: χαρίσματα
  choice: дары
  rationale: Краткое и общепонятное обозначение того, что благодатно даётся Духом; множественное число оригинала сохранено.
- source_word: ἰαμάτων
  choice: исцелений
  rationale: Сохранено множественное число греческого существительного, в результате чего обе части выражения — «дары исцелений» — стоят во множественном числе.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: одним Духом
  rationale: Инструментальная передача естественна по-русски, а «одним» отражает ἑνί и подчёркивает единство Духа среди разнообразия даров.
theological_decisions:
- issue: Значение πίστις в перечне духовных даров
  choice: вера
  alternative: верность; доверие
  rationale: «Вера» сохраняет обычное значение термина и не навязывает определённого конфессионального объяснения этого дара. Допустимые лексические оттенки отмечены в сноске.
- issue: К кому относится πνεύματι
  choice: Дух — Святой Дух
  alternative: дух
  rationale: Контекст 1 Кор 12 ясно указывает на Святого Духа как подателя даров; прописная буква обозначает референта, не добавляя нового утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Эллиптическая структура и тире поддерживают распределительный ряд предыдущего стиха. Различие формулировок «тем же Духом» и «одним Духом» сохранено вслед за греческим текстом.
