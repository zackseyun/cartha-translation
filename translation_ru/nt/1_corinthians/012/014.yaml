  text: Ведь тело состоит не из одного члена, а из многих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Ведь
  rationale: Сочетание вводит пояснение к предшествующему рассуждению. «Ведь» естественно передаёт пояснительно-обосновывающую связь в современном русском языке.
- source_word: τὸ σῶμα
  choice: тело
  rationale: Прямой эквивалент подлежащего; образ тела сохраняется без истолковывающего расширения.
- source_word: οὐκ ἔστιν
  choice: не
  rationale: В русском именном предложении настоящего времени связка обычно опускается; отрицание непосредственно относится к сказуемому «один член».
- source_word: ἓν μέλος
  choice: один член
  rationale: «Член» сохраняет анатомический образ μέλος и его связь с последующим рассуждением о членах тела; «часть» было бы проще, но ослабило бы повторяющуюся метафору.
- source_word: ἀλλὰ πολλά
  choice: а много
  rationale: πολλά употреблено субстантивированно, при этом «членов» подразумевается из предыдущей части. Краткая формулировка сохраняет эллипсис греческого текста и понятна по контексту.
theological_decisions:
- issue: Метафорическое значение слова «тело»
  choice: Сохранить «тело» без добавления «Христово».
  alternative: «тело Христово»
  rationale: Хотя в широком контексте речь идёт о церкви как теле Христа, в данном стихе сказано только «тело». Добавление уточнения превратило бы контекстуальное толкование в часть основного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет противопоставление и телесную метафору оригинала. Тире естественно обозначает опущенную связку.
