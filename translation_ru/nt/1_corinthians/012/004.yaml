base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: ru
  text: Дары различны[a], но Дух — один и тот же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «есть разные виды даров»; возможны также значения «распределения даров» или «различия между дарами». Греческое выражение подчёркивает разнообразие даров, а не разделение в церкви.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: различны
  rationale: Слово обозначает различия или разновидности внутри единого целого. Предикативная конструкция «дары различны» естественна по-русски и не создаёт ложного впечатления о разделениях в церкви.
- source_word: δὲ … δὲ
  choice: но
  rationale: Первое δέ выполняет переходную функцию и в русском не требует отдельного выражения; второе передаёт контраст между разнообразием даров и тождеством их Источника и переводится как «но».
- source_word: χαρισμάτων
  choice: дары
  rationale: В контексте речь идёт о дарах, подаваемых по благодати, особенно о духовных способностях и служениях. «Дары» — ясное и привычное соответствие; оттенок благодати не требуется разворачивать в основном тексте.
- source_word: τὸ … αὐτὸ
  choice: один и тот же
  rationale: 'Оборот подчёркивает тождество: при различии даров Дух остаётся одним и тем же. Русское «один и тот же» естественно и передаёт это усиление.'
- source_word: πνεῦμα
  choice: Дух
  rationale: Ближайший контекст 1 Кор 12:3–11 указывает на Святого Духа как Подателя даров; прописная буква отражает контекстуальный референт без поясняющего добавления в стих.
theological_decisions:
- issue: Референт πνεῦμα
  choice: Святой Дух, переданный как «Дух»
  alternative: человеческий дух или безличная духовная сила
  rationale: Во всём ближайшем отрывке Дух действует как единый божественный Податель, распределяющий дары. При этом определение «Святой» не добавляется в основной текст, поскольку его нет в данном стихе.
translation_notes:
  register: Современный литературный русский язык; краткая симметричная фраза сохраняет противопоставление разнообразия даров и единства Духа. Тире поддерживает естественную русскую интонацию и не добавляет нового смысла.
