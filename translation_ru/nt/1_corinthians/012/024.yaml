  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: ru
  text: А наши благопристойные части в этом не нуждаются. Но Бог составил тело[a], дав больше чести той части, которой недоставало чести,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смешал части тела в единое целое». Греческий глагол может подчёркивать смешение или соединение частей в единое целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: благопристойные части
  rationale: Прилагательное обозначает части тела, которые считаются пристойными и не требуют особого прикрытия или заботы; существительное «части» восполнено из контекста.
- source_word: χρείαν ἔχει
  choice: в этом не нуждаются
  rationale: Естественно передаёт греческий оборот «иметь нужду»; «в этом» отсылает к особому обращению, описанному в предыдущем стихе, не уточняя его сверх контекста.
- source_word: συνεκέρασεν
  choice: соединил тело воедино
  rationale: Глагол выражает соединение или смешение частей в единое целое. Формулировка естественна по-русски и сохраняет акцент на Божьем объединяющем действии.
- source_word: σῶμα
  choice: тело
  rationale: Сохраняет центральный образ Павла без пояснительного расширения.
- source_word: τῷ ὑστεροῦντι
  choice: той части, которой её недоставало
  rationale: Причастие означает «испытывающей недостаток»; местоимение «её» естественно указывает на следующую «честь» и не приписывает части внутреннюю неполноценность.
- source_word: περισσοτέραν τιμήν
  choice: больше чести
  rationale: Передаёт сравнительную степень ясно и естественно для современного русского языка.
- source_word: δοὺς
  choice: дав
  rationale: 'Деепричастие сохраняет связь действия с основным глаголом: Бог соединил тело, наделив прежде обделённую часть большей честью.'
theological_decisions:
- issue: Характер Божьего действия в образе тела
  choice: Бог объединяет тело, наделяя большей честью ту часть, которой её недоставало.
  alternative: Понимать глагол лишь как физическое смешение частей либо ограничить высказывание только человеческой анатомией.
  rationale: Перевод сохраняет непосредственный телесный образ и его применение к общине в широком контексте, не устраняя намеренно оставленную Павлом связь между анатомией и церковью.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. «Благопристойные» точно поддерживает противопоставление предыдущему стиху, хотя слово слегка книжное; это уместно в данном нравственно-телесном контексте. Союз «но» сохраняет явный греческий контраст ἀλλά.
