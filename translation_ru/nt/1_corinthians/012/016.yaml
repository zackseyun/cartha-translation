  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: ru
  text: 'И если ухо скажет: «Поскольку я не глаз, я не часть тела[a]», — от этого оно не перестаёт быть частью тела.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не из тела» ... «не из-за этого оно не из тела». Здесь греческий текст дважды повторяет один и тот же оборот, подчёркивая принадлежность части телу.'
    reason: Лексическая альтернатива и пояснение риторического повтора греческого текста.
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз продолжает приведённое в предыдущем стихе сравнение частей тела.
- source_word: ἐὰν εἴπῃ
  choice: если ... скажет
  rationale: Сочетание ἐάν с аористом сослагательного наклонения вводит условный, предполагаемый случай; по-русски естественно передаётся будущим временем в условной конструкции.
- source_word: τὸ οὖς
  choice: ухо
  rationale: Сохранено обычное анатомическое значение и олицетворение части тела.
- source_word: Ὅτι
  choice: Поскольку
  rationale: ὅτι здесь выражает основание последующего вывода внутри реплики уха; «поскольку» ясно передаёт причинную связь.
- source_word: ὀφθαλμός
  choice: глаз
  rationale: Прямое и естественное соответствие анатомическому термину.
- source_word: ἐκ τοῦ σώματος
  choice: часть тела / быть частью тела
  rationale: В данном контексте ἐκ τοῦ σώματος обозначает принадлежность к телу. Русское «из тела» означало бы происхождение или удаление, поэтому выбрана естественная формулировка о части целого; повтор смысла сохранён.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: от этого оно не перестаёт быть частью тела
  rationale: Конструкция с двумя отрицаниями отвергает ложный вывод. Русская формулировка сохраняет отрицание этого вывода, не создавая неясной цепочки отрицаний.
theological_decisions:
- issue: Степень смыслового уточнения метафоры тела
  choice: Передать ἐκ τοῦ σώματος как «часть тела» и сохранить повтор этой мысли
  alternative: Формально передать как «из тела» либо расширить до прямого упоминания принадлежности к церкви
  rationale: «Часть тела» естественно выражает контекстуальный смысл греческого оборота, тогда как «из тела» вводит в русском иной пространственный смысл. Прямое упоминание церкви не добавлено, чтобы не превращать метафору в пояснительный парафраз.
- issue: Риторическое двойное отрицание
  choice: «от этого оно не перестаёт быть частью тела»
  alternative: «не из-за этого оно не является частью тела»
  rationale: Выбранная конструкция сохраняет логическое отрицание вывода и напряжение аргумента, но остаётся понятной современному русскому читателю.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Олицетворение уха и логическая форма рассуждения сохранены; тяжеловесная буквальная передача греческого оборота заменена естественным русским выражением без богословского расширения.
