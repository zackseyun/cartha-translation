lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: всё тело
  rationale: Естественно и точно передаёт целостность тела в условном образе Павла.
- source_word: ὀφθαλμός
  choice: глазом
  rationale: Творительный падеж после «было» естественно передаёт именную часть сказуемого и сохраняет образ единственного органа.
- source_word: ποῦ
  choice: где был бы / где было бы
  rationale: Условное «если бы» требует в современном русском формы с частицей «бы», передающей гипотетический характер вопроса.
- source_word: ἀκοή
  choice: слух
  rationale: Греческое существительное обозначает способность слышать, а не ухо как орган; «слух» естественно сохраняет эту функциональную семантику.
- source_word: ὅλον
  choice: всё
  rationale: Сохраняет эллипсис второй условной части, где слово «тело» подразумевается, но не повторяется.
- source_word: ὄσφρησις
  choice: обоняние
  rationale: Точно обозначает способность воспринимать запахи и соответствует функциональному значению греческого слова.
theological_decisions:
- issue: Передача метафоры частей тела через способности восприятия или через физические органы
  choice: Передать ἀκοή и ὄσφρησις как способности — «слух» и «обоняние».
  alternative: 'Передать их как органы: «ухо» и «нос».'
  rationale: В греческом тексте названы способности слышать и воспринимать запахи, а не анатомические органы. Такая передача сохраняет формулировку источника и не делает образ конкретнее, чем он дан у Павла.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая конструкция и параллелизм оригинала сохранены. «Слух» и «обоняние» понятны широкому читателю и точно передают названия чувств.
