  text: καὶ διαιρέσεις διακονιῶν εἰσιν, καὶ ὁ αὐτὸς κύριος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: ru
  text: И есть разные виды служения[a], и Господь — один и тот же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «различия в служениях»; также возможно: «разные формы служения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: различны
  rationale: В контексте стихов 4–6 речь идёт о разнообразии при единстве, а не о разделениях или распрях. Предикативная конструкция «служения различны» естественно передаёт греческое «есть различия/разновидности».
- source_word: διακονιῶν
  choice: служения
  rationale: Слово обозначает служение, исполнение поручений или виды служения. «Служения» сохраняет церковный контекст, не сводя смысл только к должностям.
- source_word: ὁ αὐτός
  choice: один и тот же
  rationale: Эта формулировка ясно подчёркивает неизменное единство Господа на фоне разнообразия служений и воспроизводит параллелизм стихов 4–6.
- source_word: κύριος
  choice: Господь
  rationale: Обычный и богословски весомый русский эквивалент титула κύριος; вероятный христологический референт не раскрывается прямо в основном тексте.
- source_word: καί
  choice: И … но
  rationale: Начальное «И» сохраняет связь с параллельным высказыванием предыдущего стиха. Второе καί в русском естественно передано противительным «но», поскольку здесь сопоставлены разнообразие служений и единство Господа.
- source_word: εἰσιν
  choice: различны
  rationale: 'Греческая конструкция существования с διαιρέσεις естественно преобразована в русском в именное сказуемое: «служения различны».'
theological_decisions:
- issue: Кого обозначает «Господь» в триадической формуле 1 Коринфянам 12:4–6
  choice: В тексте оставлен титул «Господь» без поясняющего добавления; в контексте он, вероятнее всего, относится к Господу Иисусу.
  alternative: Общее обозначение Господа/Бога.
  rationale: Последовательность «Дух — Господь — Бог» поддерживает христологическое понимание, однако перевод не устраняет формально сохраняющуюся неоднозначность.
translation_notes:
  register: Современный литературный русский язык. Формулировка краткая и торжественная, сохраняет параллелизм контекста. «Служения» употреблено в широком смысле различных способов и областей служения, а не только церковных должностей.
