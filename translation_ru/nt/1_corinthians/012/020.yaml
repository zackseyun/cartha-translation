  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: ru
  text: Но в действительности частей много, а тело одно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «членов много, а тело одно».'
    reason: Лексический вариант передачи μέλη.
lexical_decisions:
- source_word: νῦν δὲ
  choice: Но в действительности
  rationale: В данном рассуждении νῦν обозначает фактическое положение дел в противопоставлении предположению предыдущего стиха, а δὲ вводит контраст. Такой перевод естественно передаёт оба оттенка.
- source_word: πολλὰ μέλη
  choice: частей много
  rationale: В развёрнутом образе тела μέλη означает составляющие его части. «Части» ясно и естественно передаёт анатомический образ в современном русском языке; традиционное «члены» сохранено в сноске.
- source_word: μὲν ... δὲ
  choice: …, а …
  rationale: Соотносительные частицы противопоставляют множество частей единству тела; русский союз «а» кратко и естественно выражает этот баланс.
- source_word: ἓν
  choice: одно
  rationale: Числительное подчёркивает единство тела в противопоставлении множеству частей.
- source_word: σῶμα
  choice: тело
  rationale: Сохраняется буквальный образ тела и его смысловая сила в рассуждении Павла о единстве при многообразии.
theological_decisions:
- issue: Передача μέλη в образе тела
  choice: части
  alternative: члены
  rationale: «Части» непосредственно передаёт анатомический образ и не звучит как специальный церковный термин. Вместе с тем «члены» — традиционный и смыслово значимый вариант, поэтому он приведён в сноске без устранения возможного церковного оттенка.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная по тону. Порядок слов «частей много, а тело одно» сохраняет риторическое противопоставление множества и единства.
