  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: ru
  text: 'Поэтому даю вам знать: никто, говорящий Духом Божьим, не говорит: «Иисус проклят»[a], и никто не может сказать: «Иисус — Господь»[b], кроме как Духом Святым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет Иисус проклят». Греческое безглагольное восклицание Ἀνάθεμα Ἰησοῦς допускает также смысл формулы проклятия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально порядок слов в греческом: «Господь — Иисус»; здесь это исповедание: «Иисус — Господь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Поэтому
  rationale: Сохраняет логический вывод из предшествующего рассуждения и естественно звучит по-русски.
- source_word: γνωρίζω ὑμῖν
  choice: даю вам знать
  rationale: Передаёт каузативный смысл «делаю известным», не добавляя отсутствующего в греческом волевого оттенка.
- source_word: ἐν πνεύματι θεοῦ
  choice: Духом Божьим
  rationale: Творительный падеж естественно передаёт возможное инструментальное значение ἐν и участие Божьего Духа в речи.
- source_word: λαλῶν λέγει
  choice: говорящий … не скажет
  rationale: Сохраняет различие между причастием λαλῶν и личной формой λέγει, избегая тяжеловесного повтора «говорящий … говорит».
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: Да будет Иисус проклят
  rationale: Передаёт силу безглагольного восклицания и значение ἀνάθεμα как предания проклятию; поскольку повелительная сила не выражена однозначно, альтернативное предикативное понимание отмечено в сноске.
- source_word: δύναται εἰπεῖν
  choice: не может сказать
  rationale: Естественно и точно передаёт способность или возможность, выраженную δύναται.
- source_word: Κύριος Ἰησοῦς
  choice: Иисус — Господь
  rationale: В контексте содержания исповедания русская именная конструкция с тире передаёт подразумеваемую связку и сохраняет христологический титул κύριος.
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: кроме как Духом Святым
  rationale: Передаёт единственное исключение и сохраняет параллель с «Духом Божьим».
theological_decisions:
- issue: Смысл κύριος в исповедании Κύριος Ἰησοῦς
  choice: Господь
  alternative: Владыка / Господин
  rationale: «Господь» сохраняет обычный титульный смысл и высокую христологическую значимость выражения, не уточняя сверх текста её богословский объём.
- issue: Характер утверждения о действии Святого Духа
  choice: Формулировка сохранена без поясняющего ограничения
  alternative: Ограничить высказывание только искренним исповеданием либо развернуть его в учение о возрождении
  rationale: Текст связывает исповедание господства Иисуса с действием Святого Духа, но сам не излагает здесь более подробной доктринальной схемы.
- issue: Сила выражения Ἀνάθεμα Ἰησοῦς
  choice: Да будет Иисус проклят
  alternative: Иисус проклят
  rationale: Безглагольная греческая фраза допускает как проклинающее восклицание, так и предикативное утверждение; основной текст передаёт резкую восклицательную силу, а сноска сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified; синтаксис сохраняет параллелизм двух утверждений. «Божьим» выбрано как естественная современная форма, а «Духом Святым» сохраняет торжественный титульный порядок.
