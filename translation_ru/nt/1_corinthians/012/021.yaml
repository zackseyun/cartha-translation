  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: ru
  text: 'Но глаз не может сказать руке: «Я в тебе не нуждаюсь», или, опять же, голова — ногам: «Я в вас не нуждаюсь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: не может
  rationale: Естественно передаёт действительную невозможность, а не просто недопустимость.
- source_word: δὲ
  choice: Но
  rationale: Сохраняет противопоставление предшествующему рассуждению о взаимозависимости частей тела.
- source_word: ὁ ὀφθαλμός
  choice: глаз
  rationale: Буквально сохраняет развёрнутый Павлом образ тела.
- source_word: εἰπεῖν τῇ χειρί
  choice: сказать руке
  rationale: Точно и естественно передаёт инфинитив и дательный падеж адресата.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: Я в тебе не нуждаюсь
  rationale: Современная русская формулировка сохраняет значение нужды и обращение к одному адресату, не усиливая фразу до значения «ты мне бесполезна».
- source_word: ἢ πάλιν
  choice: или, в свою очередь
  rationale: Вводит второй аналогичный пример; «в свою очередь» естественно выражает здесь функцию πάλιν, не подразумевая буквального повторения действия.
- source_word: ἡ κεφαλὴ τοῖς ποσίν
  choice: голова — ногам
  rationale: Сохраняет буквальную телесную метафору; тире естественно восполняет опущенное в греческом сказуемое «не может сказать».
- source_word: Χρείαν ὑμῶν οὐκ ἔχω
  choice: Я в вас не нуждаюсь
  rationale: Форма «вас» явно сохраняет множественное число ὑμῶν и соответствует обращению к ногам.
theological_decisions:
- issue: Метафора тела как выражение взаимозависимости в общине
  choice: Сохранить названия частей тела без поясняющей вставки
  alternative: Заменить или дополнить их прямым упоминанием членов церкви
  rationale: Богословская мысль Павла раскрывается через сам образ тела; прямое истолкование в основном тексте вышло бы за пределы перевода.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным синтаксисом. Различие между единственным «тебе» и множественным «вас» выражено непосредственно в тексте, поэтому примечание не требуется.
