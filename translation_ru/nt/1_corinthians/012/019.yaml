  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: ru
  text: Если бы всё было одной частью тела, то где было бы тело?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: Если бы
  rationale: В сочетании с формой ἦν вводит гипотетическое условие; русская конструкция «если бы» естественно передаёт этот смысл.
- source_word: δὲ
  choice: то
  rationale: Частица δέ здесь служит мягкой связкой в ходе риторического рассуждения. В русском явное противопоставительное «но» было бы избыточно; коррелят «то» естественно связывает условие со следствием.
- source_word: ἦν
  choice: было
  rationale: Имперфект глагола «быть» вместе с условной частицей передан русским сослагательным оборотом «если бы… было».
- source_word: τὰ πάντα
  choice: всё
  rationale: Средний род множественного числа обозначает совокупность всех частей; в русском «всё» кратко и естественно передаёт эту целостность.
- source_word: ἓν μέλος
  choice: одной частью тела
  rationale: μέλος в телесной метафоре означает отдельную часть тела. Уточнение «тела» сохраняет метафору и предотвращает понимание слова «часть» в слишком общем смысле.
- source_word: ποῦ
  choice: где … было бы?
  rationale: Сохраняет риторический вопрос о невозможности существования тела при отсутствии разнообразия его частей.
- source_word: τὸ σῶμα
  choice: тело
  rationale: Прямо передаёт определённое существительное и не добавляет отсутствующего в стихе уточнения «Христово».
theological_decisions:
- issue: Объём метафоры тела
  choice: Сохранить общее слово «тело», не уточняя в самом тексте «тело Христово».
  alternative: «тело Христово»
  rationale: Хотя контекст связывает метафору с общиной верующих, в данном стихе греческий текст содержит только τὸ σῶμα. Перевод не должен вносить дополнительное богословское уточнение.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая формулировка сохраняет гипотетический характер и телесную метафору оригинала.
