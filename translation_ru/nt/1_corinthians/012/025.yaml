  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: ru
  text: чтобы в теле не было разделения[a], но чтобы все его части одинаково[b] заботились друг о друге.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раскола»; греческое слово может означать разрыв или разделение внутри целого.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в равной мере заботились друг о друге».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ ᾖ
  choice: чтобы… не было
  rationale: Естественно передаёт целевое значение ἵνα с отрицанием и сохраняет связь со сказанным ранее.
- source_word: σχίσμα
  choice: разделение
  rationale: Передаёт разрыв или внутреннее разделение, сохраняя образ тела и не привнося более поздний специальный смысл слова «раскол».
- source_word: ἐν τῷ σώματι
  choice: в теле
  rationale: Прямо сохраняет Павлову метафору тела.
- source_word: τὸ αὐτό
  choice: одинаково
  rationale: В сочетании с μεριμνῶσι выражает одинаковую, равную заботу частей тела друг о друге; наречная передача естественна по-русски.
- source_word: ὑπὲρ ἀλλήλων
  choice: друг о друге
  rationale: В данном контексте ὑπέρ указывает на направленность взаимной заботы, а не на заместительное действие.
- source_word: μεριμνῶσι
  choice: заботились
  rationale: Здесь глагол обозначает положительную заботу, а не тревогу; сослагательная форма соответствует конструкции цели с ἵνα.
- source_word: τὰ μέλη
  choice: все его части
  rationale: В контексте телесной метафоры μέλη — части тела. Добавление «его» ясно связывает их с телом, а «все» естественно выражает совокупность членов без изменения смысла.
theological_decisions:
- issue: Передача σχίσμα в метафоре церкви как тела
  choice: разделение
  alternative: раскол
  rationale: «Разделение» передаёт непосредственный смысл греческого слова и сохраняет внутреннее напряжение метафоры, не навязывая позднейший технический церковный термин.
- issue: Смысл τὸ αὐτό при взаимной заботе
  choice: одинаково заботились друг о друге
  alternative: заботились об одном и том же друг для друга
  rationale: Греческая конструкция допускает акцент на одинаковой или равной взаимной заботе. Выбранный вариант понятен современному читателю и не превращает фразу в утверждение о едином предмете заботы.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный, метафора тела сохранена. «Части» здесь понятнее обычному читателю, чем потенциально двусмысленное «члены».
