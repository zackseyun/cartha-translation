  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: ru
  text: Напротив, гораздо более необходимы те части[a] тела, которые кажутся слабее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «члены тела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: Напротив, гораздо более
  rationale: Передаёт сильное противопоставление и сохраняет явный греческий усилитель πολλῷ μᾶλλον, не растворяя его в общей конструкции.
- source_word: τὰ δοκοῦντα
  choice: которые кажутся
  rationale: Сохраняет различие между кажущимся положением частей тела и их действительной необходимостью.
- source_word: μέλη τοῦ σώματος
  choice: части тела
  rationale: Естественное современное русское обозначение частей физического тела; конкретная метафора сохранена без преждевременной замены на прямое указание на членов церкви.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: кажутся слабее
  rationale: Естественно передаёт сравнительную степень ἀσθενέστερα и связь инфинитива ὑπάρχειν с δοκοῦντα.
- source_word: ἀναγκαῖά ἐστιν
  choice: необходимы
  rationale: Формально и ясно передаёт необходимость; вариант «незаменимы» был бы несколько более интерпретирующим.
theological_decisions:
- issue: Телесная метафора в контексте учения о церкви
  choice: Сохранить прямое выражение «части тела»
  alternative: Передать μέλη как «члены», усилив возможную ассоциацию с членами общины
  rationale: В самом стихе Павел продолжает конкретную метафору тела. Перевод не подменяет образ его церковным истолкованием, хотя контекст предполагает такое применение.
- issue: Соотношение кажущейся слабости и необходимости
  choice: Сохранить «кажутся слабее» и усиленное «гораздо более необходимы»
  alternative: Сгладить до «кажущиеся слабыми части тела необходимы»
  rationale: Греческий текст подчёркивает и сравнительную слабость, и усиление πολλῷ μᾶλλον; их сохранение удерживает парадокс аргумента Павла.
translation_notes:
  register: Современный литературный русский язык; фраза звучит ясно и достойно. Инверсия «гораздо более необходимы те части» сохраняет риторическое ударение оригинала на необходимости кажущихся более слабыми частей.
