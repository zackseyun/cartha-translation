lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: ведёт себя непристойно
  rationale: Передаёт действие, нарушающее нормы приличия и достойного поведения, не сужая смысл до одной лишь грубости.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: ищет своего
  rationale: Сохраняет образ и краткость греческого выражения «ищет своего», подразумевающего своекорыстие, но не уточняет его как непременное настаивание на своём.
- source_word: παροξύνεται
  choice: раздражается
  rationale: Естественно передаёт возбуждение резкого раздражения или гнева; наречие «легко» отсутствует в греческом тексте и потому не добавлено.
- source_word: λογίζεται τὸ κακόν
  choice: не считает причинённого зла
  rationale: Глагол сохраняет метафору учёта, а сочетание «причинённого зла» естественно по-русски выражает вероятный межличностный смысл, не превращая его однозначно в «список обид».
theological_decisions:
- issue: Следует ли усиливать παροξύνεται добавлением «легко»
  choice: не раздражается
  alternative: не легко раздражается / не вспыльчива
  rationale: В греческом нет соответствующего наречия; простой предикат сохраняет категоричность и напряжение текста.
- issue: Следует ли истолковывать λογίζεται τὸ κακόν как ведение списка обид
  choice: не считает причинённого зла
  alternative: не ведёт счёта обидам / не замышляет зла
  rationale: Греческое выражение допускает оттенки учёта зла и в некоторых контекстах замышления зла. Выбранный вариант сохраняет бухгалтерскую метафору и наиболее вероятный здесь межличностный смысл, а примечание отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык с кратким параллелизмом исходного перечня. Подлежащее «любовь» подразумевается из предыдущего контекста; формы сказуемых грамматически согласуются с ним. Формулировки сохраняют нравственную весомость текста без архаизмов и конфессиональных уточнений.
