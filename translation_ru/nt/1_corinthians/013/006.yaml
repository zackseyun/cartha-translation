  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: ru
  text: не радуется неправде[a], но сорадуется истине[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неправедности», «злу» или «несправедливости».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «радуется истине». Греческий глагол может означать как совместную радость, так и радость по поводу истины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: радуется
  rationale: «Радуется» естественно передаёт значение χαίρω и сохраняет словесную параллель с συγχαίρει.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: неправде
  rationale: При χαίρω сочетание ἐπί с дательным указывает на повод или основание радости. «Неправда» сохраняет широкий нравственный смысл ἀδικία и одновременно допускает оттенки зла, неправедности и несправедливости.
- source_word: συγχαίρει
  choice: сорадуется
  rationale: «Сорадуется» передаёт значение совместной радости, выраженное приставкой συν-, и уместно в возвышенном, но понятном русском стиле.
- source_word: δὲ
  choice: но
  rationale: Союз «но» ясно выражает противопоставление между тем, чему любовь не радуется, и тем, чему она сорадуется.
- source_word: τῇ ἀληθείᾳ
  choice: истине
  rationale: «Истине» сохраняет определённость и смысловую противоположность неправде, не сужая значение до правдивой речи, поведения или евангельской истины.
theological_decisions:
- issue: Передача ἀδικία в нравственном противопоставлении у Павла
  choice: неправда
  alternative: неправедность; зло; несправедливость
  rationale: «Неправда» охватывает нравственно-богословский смысл слова и непосредственно противопоставляется «истине», не ограничивая речь только общественной несправедливостью или отдельным проступком.
- issue: Отношение συγχαίρει к «истине»
  choice: сорадуется истине
  alternative: радуется истине
  rationale: Основной текст сохраняет значение приставки συν- — совместную радость, не уточняя, с кем именно она разделяется; возможное неприставочное по смыслу прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным построением. «Сорадуется» несколько возвышенно, но понятно и точно сохраняет приставочное значение греческого глагола; симметрия «не радуется — но сорадуется» воспроизводит форму оригинала.
