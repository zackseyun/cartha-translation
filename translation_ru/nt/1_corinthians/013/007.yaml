lexical_decisions:
- source_word: πάντα
  choice: всё / всему / на всё
  rationale: Повтор местоимения перед каждым глаголом сохраняет всеохватность и риторический параллелизм оригинала; падежные формы обусловлены нормами русского языка.
- source_word: στέγει
  choice: покрывает
  rationale: Основное значение связано с покрытием и защитой; в данном контексте слово может также означать терпеливое перенесение. «Покрывает» отличает этот глагол от заключительного ὑπομένει и сохраняет образную неоднозначность.
- source_word: πιστεύει
  choice: верит
  rationale: Прямой и краткий эквивалент πιστεύει, сохраняющий параллелизм. Здесь речь не обязательно о доверчивости, поэтому оттенок доверия отмечен в сноске.
- source_word: ἐλπίζει
  choice: надеется
  rationale: Естественный русский эквивалент, передающий постоянное, характерное для любви действие.
- source_word: ὑπομένει
  choice: переносит
  rationale: Передаёт стойкое выдерживание тягот и завершает ряд кратким глаголом, не повторяя выбранное для στέγει «покрывает».
theological_decisions:
- issue: Значение повторяющегося πάντα в описании любви
  choice: Сохранена всеохватная риторическая формулировка без дополнительных ограничений в основном тексте.
  alternative: Понимать выражения как утверждение, будто любовь без разбора одобряет всё или принимает за истину любое утверждение.
  rationale: Контекст описывает неизменные свойства любви. Перевод сохраняет напряжённую широту слов Павла, но не вводит в текст идею нравственной неразборчивости или легковерия.
translation_notes:
  register: Современный литературный русский язык; краткий четырёхчастный параллелизм оригинала сохранён. Формулировка возвышенная, но понятная обычному читателю.
