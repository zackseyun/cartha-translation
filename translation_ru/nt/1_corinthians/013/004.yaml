id: 1CO.13.4
reference: 1 Corinthians 13:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: ru
  text: Любовь долготерпелива, любовь проявляет доброту; она не завидует[a], не хвастается, не надмевается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ревнует». Глагол может означать рвение, ревность или зависть; отрицательный контекст здесь указывает на зависть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не раздувается» — образ человека, раздувшегося от гордости.'
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἀγάπη
  choice: любовь
  rationale: «Любовь» — прямой, современный и широкий по значению эквивалент, подходящий для этического и богословского контекста.
- source_word: μακροθυμεῖ
  choice: долготерпелива
  rationale: Передаёт продолжительное терпение, прежде всего по отношению к людям, и сохраняет достоинство хорошо известного текста.
- source_word: χρηστεύεται
  choice: проявляет доброту
  rationale: Глагол описывает деятельную доброту, а не только наличие доброго качества; эта формулировка естественна в современном русском языке.
- source_word: ζηλοῖ
  choice: не завидует
  rationale: Глагол может обозначать ревность, рвение или зависть, но отрицательный ряд качеств указывает здесь на порочную зависть.
- source_word: περπερεύεται
  choice: не хвастается
  rationale: Передаёт самовосхваление и показное выставление себя без архаичности или разговорной резкости.
- source_word: φυσιοῦται
  choice: не надмевается
  rationale: Сохраняет образ раздувания от гордости, характерный для словоупотребления Павла, и звучит естественно в возвышенном современном русском регистре.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: Любовь ... любовь ... она
  rationale: Повтор в первых двух частях сохранён ради риторического акцента; далее местоимение естественно продолжает единый ряд. Текстуальная неуверенность относительно третьего повторения существительного не меняет смысла.
- source_word: οὐ
  choice: не
  rationale: Обычная русская форма отрицания естественно сочетается со всеми глагольными сказуемыми данного ряда.
theological_decisions:
- issue: Передача ἀγάπη в центральном этико-богословском высказывании
  choice: любовь
  alternative: благотворительность; милосердие
  rationale: «Любовь» сохраняет широкий смысл греческого слова и не сужает его до материальной помощи или одного лишь сострадания.
- issue: Отрицательное значение ζηλοῖ
  choice: не завидует
  alternative: не ревнует; не проявляет рвения
  rationale: Хотя сам глагол способен обозначать как рвение, так и ревность или зависть, отрицательный контекст среди других пороков поддерживает значение «завидовать»; многозначность отмечена в сноске.
- issue: Метафора в φυσιοῦται
  choice: не надмевается
  alternative: не высокомерна; не возносится
  rationale: Выбранный вариант сохраняет образ внутреннего «раздувания» гордостью, не превращая его в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим известному поэтическому ряду. Синтаксический параллелизм и повтор слова «любовь» сохранены, а редкие греческие глаголы переданы ясно и без конфессионально окрашенной терминологии.
