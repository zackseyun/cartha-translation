  source_fidelity: 'Текст точно передаёт все пять сказуемых греческого оригинала и его риторический параллелизм: μακροθυμεῖ — «долготерпелива», χρηστεύεται — «проявляет доброту», ζηλοῖ — «не завидует», περπερεύεται — «не хвастается», φυσιοῦται — «не надмевается». Повтор «любовь» в первых двух членах сохранён; переход к «она» в дальнейшей цепочке не меняет смысла. Текстологическая неопределённость относительно третьего ἡ ἀγάπη не требует отражения, поскольку субъект всех отрицательных сказуемых ясен независимо от варианта.'
