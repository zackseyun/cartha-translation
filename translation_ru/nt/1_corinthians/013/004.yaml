  terminology: «Любовь» является точным широким соответствием ἀγάπη и не сужает значение до милостыни или благотворительности. «Не завидует» обоснованно выбрано в отрицательном перечне пороков. «Не надмевается» передаёт образный смысл φυσιοῦται без навязывания богословской интерпретации.
