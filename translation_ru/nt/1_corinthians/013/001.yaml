base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: ru
  text: Если я говорю языками людей и ангелов[a], но любви не имею, я стал звенящей медью[b] или гремящим кимвалом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на языках людей и ангелов». Греческое слово может обозначать язык или наречие; здесь сохранена связь с дальнейшим рассуждением о говорении языками.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «звучащим металлом» или «звенящей бронзой». Греческое слово обозначает медь, бронзу либо предмет из такого металла, но не называет определённого инструмента.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Если
  rationale: Передаёт условный, гипотетический характер риторического высказывания без добавления усиления, которого нет в греческом тексте.
- source_word: ταῖς γλώσσαις
  choice: языками
  rationale: Русское «язык» сохраняет возможные значения языка как средства речи и особого дара языков, не сводя выражение только к обычным человеческим языкам.
- source_word: τῶν ἀνθρώπων
  choice: людей
  rationale: ἄνθρωποι здесь обозначает человечество в противопоставлении ангелам; «людей» точно и естественно передаёт этот смысл без ложного ограничения только мужчинами.
- source_word: λαλῶ
  choice: говорю
  rationale: Простое настоящее время естественно передаёт греческую форму в условном предложении.
- source_word: καὶ τῶν ἀγγέλων
  choice: и ангелов
  rationale: В противопоставлении людям ἄγγελοι естественно означает небесных ангелов, а не обычных посланников.
- source_word: ἀγάπην
  choice: любви
  rationale: Современное и точное соответствие ἀγάπη; не вводит более узкого значения милостыни или благотворительности.
- source_word: δὲ μὴ ἔχω
  choice: но любви не имею
  rationale: Сохраняет противопоставление, выраженное δέ, и несколько возвышенный ритм исходной фразы, оставаясь понятным современному читателю.
- source_word: γέγονα
  choice: я стал
  rationale: 'Передаёт результативный оттенок перфекта: говорящий не просто подобен шумному металлу, но в описанном случае оказался им.'
- source_word: χαλκὸς ἠχῶν
  choice: звенящей медью
  rationale: Буквально сохраняет образ звучащего металла и не превращает его без достаточного основания в конкретный инструмент, например гонг.
- source_word: ἢ κύμβαλον ἀλαλάζον
  choice: или гремящим кимвалом
  rationale: «Кимвал» точно называет κύμβαλον, а «гремящим» передаёт громкий, резкий шум глагольной формы ἀλαλάζον.
theological_decisions:
- issue: «Языки людей и ангелов»
  choice: Сохранено прямое риторическое противопоставление человеческих и ангельских языков.
  alternative: Истолковать ангельские языки как буквальную небесную речь либо исключительно как гиперболу.
  rationale: Сам стих не решает, идёт ли речь о реальных ангельских языках или о риторическом пределе мысли; перевод не должен устранять эту неоднозначность.
- issue: Смысл отсутствия любви
  choice: 'Сохранена резкая метафора: без любви говорящий «стал» звучащим металлом.'
  alternative: Смягчить до «подобен» или пояснить как духовную бесполезность.
  rationale: Греческий текст использует γέγονα без сравнительной частицы; прямой образ сохраняет богословскую и риторическую силу утверждения, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом. Инверсия «любви не имею» сохраняет выразительность апостольской речи, не делая её архаичной. Образы металла и кимвала оставлены резкими и конкретными; неоднозначность выражения об ангельских языках не разрешается переводом.
