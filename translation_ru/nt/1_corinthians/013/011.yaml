id: 1CO.13.11
reference: 1 Corinthians 13:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: ru
  text: Когда я был ребёнком, я говорил как ребёнок, мыслил как ребёнок, рассуждал как ребёнок. Когда я стал мужчиной, я оставил то, что свойственно ребёнку[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что ребёнка»; возможно также: «детское» или «то, что присуще ребёнку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: ребёнок
  rationale: Слово обозначает малого ребёнка и в данном контексте подчёркивает незрелость. «Ребёнок» естественно передаёт метафору и не сужает значение до младенца.
- source_word: ἐλάλουν
  choice: я говорил
  rationale: Обычное и стилистически нейтральное соответствие, сохраняющее первый элемент трёхчастного параллелизма.
- source_word: ἐφρόνουν
  choice: мыслил
  rationale: Передаёт образ мыслей и сохраняет краткость риторического ряда; «мыслил» позволяет отличить этот глагол от последующего «рассуждал».
- source_word: ἐλογιζόμην
  choice: рассуждал
  rationale: Передаёт обдумывание и логическое рассмотрение, сохраняя смысловое отличие от ἐφρόνουν.
- source_word: γέγονα
  choice: я стал
  rationale: Перфект обозначает достигнутое состояние, но в придаточном с «когда» современное русское «стал» звучит естественно и ясно выражает переход к зрелости.
- source_word: ἀνήρ
  choice: мужчина
  rationale: Греческое слово имеет явно мужское значение. «Мужчина» сохраняет прямой контраст с ребёнком и соответствует тому, что Павел говорит о себе.
- source_word: κατήργηκα
  choice: я оставил
  rationale: В контексте взросления глагол означает устранить из своей жизни, прекратить или оставить. «Оставил» естественно передаёт отказ от прежнего, не придавая фразе отвлечённого значения «упразднил».
- source_word: τὰ τοῦ νηπίου
  choice: то, что свойственно ребёнку
  rationale: 'Буквально это субстантивированное выражение «то, что ребёнка». Выбранная формулировка сохраняет широту: речь может идти о детских проявлениях, занятиях или образе поведения, названных в предшествующей триаде.'
theological_decisions:
- issue: Мужской род в противопоставлении ἀνήρ и νήπιος
  choice: «стал мужчиной»
  alternative: «стал взрослым»
  rationale: ἀνήρ прямо означает мужчину, и Павел использует себя как личный пример взросления. Перевод сохраняет грамматически и лексически выраженный мужской образ, не превращая его в утверждение о превосходстве мужчин.
- issue: Объём выражения τὰ τοῦ νηπίου
  choice: «то, что свойственно ребёнку»
  alternative: «детское» / «детские привычки»
  rationale: 'Греческая фраза намеренно широка. Перевод не ограничивает её только привычками, вещами или поведением и тем самым сохраняет связь со всей предшествующей триадой: речью, мышлением и рассуждением.'
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного ритма и трёхчастного параллелизма. Повтор «как ребёнок» оставлен ради риторической структуры оригинала. Формы «мыслил» и «рассуждал» разграничивают близкие, но не тождественные греческие глаголы.
