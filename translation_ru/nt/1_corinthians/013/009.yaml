  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: ru
  text: Ведь мы знаем лишь отчасти[a] и пророчествуем лишь отчасти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «частично». Греческий оборот буквально означает «из части» и повторяется в обеих частях стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: лишь отчасти
  rationale: Оборот означает неполноту, частичность. «Отчасти» естественно по-русски и сохраняет повтор в обеих параллельных частях; «лишь» ясно подчёркивает ограниченность знания и пророчества в контексте противопоставления полноте.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит объяснение предыдущей мысли. Русское «ведь» естественно передаёт пояснительную связь, не превращая её в более жёсткую причинную конструкцию.
- source_word: γινώσκομεν
  choice: мы знаем
  rationale: Прямой эквивалент, сохраняющий смысл знания без сужения до понимания или познания как процесса.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз сохраняет параллелизм двух частей стиха.
- source_word: προφητεύομεν
  choice: пророчествуем
  rationale: Передаёт термин прямо и не ограничивает его ни предсказанием будущего, ни обычной проповедью.
theological_decisions:
- issue: Характер пророческой деятельности в церкви
  choice: «пророчествуем» без дальнейшего уточнения
  alternative: «предсказываем будущее» или «проповедуем»
  rationale: В контексте духовных даров греческий глагол обозначает пророческую речь шире, чем только предсказание или проповедь; нейтральный перевод сохраняет богословскую широту исходного текста.
- issue: Пределы знания и пророчества
  choice: Сохранить одинаковый оборот «лишь отчасти» в обеих частях
  alternative: Передать как «знаем не всё» и «наше пророчество неполно»
  rationale: Повтор отражает симметрию греческого текста и не уточняет сверх сказанного, относится ли ограниченность к объёму, ясности или завершённости знания и пророчества.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Ведь» естественно выражает пояснение, а повтор «лишь отчасти» сохраняет риторический параллелизм оригинала.
