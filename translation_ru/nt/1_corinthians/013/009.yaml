  verdict: approve
  source_fidelity: Текст точно передаёт ἐκ μέρους γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν. Повтор «лишь отчасти» удачно отражает повтор ἐκ μέρους и его значение неполноты; «ведь» передаёт пояснительную функцию γάρ, не навязывая дополнительного толкования. «Пророчествуем» сохраняет широкий смысл προφητεύομεν.
  naturalness: Фраза звучит естественно на современном литературном русском языке. Общий субъект «мы» и соединённые союзом «и» сказуемые не требуют запятой. Умеренно торжественный регистр соответствует контексту.
  terminology: «Пророчествуем» — устоявшийся и нейтральный для данного контекста термин. «Отчасти» точно и идиоматично; добавление «лишь» естественно подчёркивает присущую исходному обороту ограниченность, не меняя смысла.
