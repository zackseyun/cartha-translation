lexical_decisions:
- source_word: νυνὶ δὲ
  choice: А теперь
  rationale: νυνί указывает на нынешнее или итоговое положение, а δέ мягко продолжает мысль либо противопоставляет её предыдущему. «А теперь» естественно передаёт оба оттенка в контексте вывода.
- source_word: μένει
  choice: пребывают
  rationale: Форма единственного числа согласуется с последующим составным перечислением, мыслимым как единое целое; по-русски множественное число звучит естественнее. «Пребывают» передаёт продолжение и устойчивость в противоположность тому, что упраздняется.
- source_word: πίστις
  choice: вера
  rationale: В триаде с надеждой и любовью «вера» — наиболее естественное и общепринятое значение; возможный оттенок доверия отмечен в сноске.
- source_word: ἐλπίς
  choice: надежда
  rationale: Обычное значение слова в посланиях Павла и естественный русский эквивалент в этой триаде.
- source_word: ἀγάπη
  choice: любовь
  rationale: Современный, точный и немаркированный эквивалент, сохраняющий широкое содержание греческого слова.
- source_word: τὰ τρία ταῦτα
  choice: эти три
  rationale: Кратко и естественно отсылает к названным далее вере, надежде и любви.
- source_word: μείζων δὲ τούτων
  choice: Но любовь — величайшая из них
  rationale: Хотя μείζων формально является сравнительной степенью, сочетание с τούτων ранжирует любовь внутри группы из трёх; русский суперлатив ясно и естественно передаёт этот смысл.
theological_decisions:
- issue: Значение πίστις в богословски значимой триаде
  choice: вера
  alternative: доверие; верность
  rationale: Контекст «вера, надежда, любовь» прежде всего указывает на веру; «доверие» возможно как смысловой оттенок, тогда как «верность» здесь менее вероятна.
- issue: Сравнительная форма μείζων применительно к трём добродетелям
  choice: величайшая из них
  alternative: больше них; больше этих
  rationale: Греческая сравнительная степень в конструкции сравнения внутри тройки идиоматически выражает высшее место любви, не устраняя самого сопоставления.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Пребывают» сохраняет библейскую возвышенность, оставаясь понятным; синтаксис близок к греческому, но естественен по-русски.
