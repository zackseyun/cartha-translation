  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: ru
  text: И если я имею дар пророчества, и знаю все тайны, и обладаю всяким знанием, и если имею всю веру[a], так что могу переставлять горы, но любви не имею, — я ничто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё доверие»; менее вероятно: «всю верность». Греческое слово имеет несколько значений, но здесь, скорее всего, обозначает необычайную веру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: дар пророчества
  rationale: В контексте духовных даров русское «дар пророчества» естественно передаёт значение существительного, не сводя его ни к должности, ни к отдельному предсказанию.
- source_word: εἰδῶ
  choice: знаю
  rationale: 'Прямо передаёт οἶδα и естественно сочетается с «тайнами»; отличие от следующего γνῶσις сохраняется синтаксически: «знаю» и «обладаю знанием».'
- source_word: μυστήρια
  choice: тайны
  rationale: Сохраняет устойчивый богословский термин Павла и не раскрывает преждевременно, идёт ли речь о сокрытых или уже открытых истинах.
- source_word: πᾶσαν τὴν γνῶσιν
  choice: всяким знанием
  rationale: Оборот «обладаю всяким знанием» естественен по-русски и сохраняет всеохватность πᾶσαν, а также различие между глаголом εἰδῶ и существительным γνῶσις.
- source_word: πᾶσαν τὴν πίστιν
  choice: всю веру
  rationale: Формально и ясно сохраняет πίστις; в данном контексте речь, вероятнее всего, об исключительной вере, способной совершать необычайное, а не о «верности».
- source_word: ὥστε ὄρη μεθιστάναι
  choice: так что могу переставлять горы
  rationale: Передаёт результативную конструкцию ὥστε с инфинитивом и сохраняет конкретный образ перемещения гор.
- source_word: ἀγάπην
  choice: любви
  rationale: Современный, широкий и естественный эквивалент ἀγάπη без архаического или конфессионально суженного оттенка.
- source_word: οὐθέν εἰμι
  choice: я ничто
  rationale: Кратко и резко передаёт буквальную силу греческого выражения, не смягчая самооценку Павла.
theological_decisions:
- issue: Значение πίστις в контексте способности переставлять горы
  choice: вера
  alternative: доверие; менее вероятно — верность
  rationale: Контекст указывает на необычайную веру, связанную со сверхъестественной возможностью; «верность» лексически возможна в иных контекстах, но здесь плохо согласуется с образом переставления гор.
- issue: Степень конкретизации προφητεία
  choice: дар пророчества
  alternative: пророчество; пророческая способность
  rationale: Контекст 1 Кор 12–14 посвящён дарам, поэтому «дар пророчества» делает русский текст естественным, не утверждая особого сана и не ограничивая значение одним пророческим высказыванием.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической силой исходного текста. Повтор «и если» и противопоставление «но любви не имею» сохранены; тире подчёркивает итоговое «я ничто».
