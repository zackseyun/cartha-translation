  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: ru
  text: Когда же придёт совершенное[a], частичное будет упразднено[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полное», «завершённое» или «зрелое». Греческое выражение τὸ τέλειον допускает разные понимания; оно может обозначать полноту, зрелость или окончательное эсхатологическое свершение в противоположность нынешнему частичному состоянию.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «будет устранено», «прекратится» или «будет отменено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с аористом сослагательного наклонения вводит ожидаемое будущее событие; по-русски естественно передаётся союзом «когда».
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкое противопоставление предшествующему утверждению о частичном знании и пророчестве, не делая контраст резче, чем в греческом.
- source_word: ἔλθῃ
  choice: придёт
  rationale: Аорист сослагательного наклонения после ὅταν указывает на будущее наступление; форма «придёт» естественна в русском придаточном времени.
- source_word: τὸ τέλειον
  choice: совершенное
  rationale: 'Субстантивированное прилагательное среднего рода сохраняет лексическую широту понятия: совершенное, полное, достигшее завершённости. Перевод не уточняет спорный референт.'
- source_word: τὸ ἐκ μέρους
  choice: частичное
  rationale: Артикль субстантивирует предложное выражение «отчасти, по части»; «частичное» кратко и прямо противопоставлено «совершенному».
- source_word: καταργηθήσεται
  choice: упразднится
  rationale: Будущий пассив обозначает прекращение действия или устранение того, что было лишь частичным. «Упразднится» передаёт прекращение без обязательного смысла уничтожения.
theological_decisions:
- issue: Референт выражения τὸ τέλειον
  choice: Оставить обобщённое «совершенное», не определяя референт.
  alternative: «полное», «завершённое», «зрелое»; эсхатологическая полнота, связанная с возвращением Христа или знанием лицом к лицу; завершённый канон Писания.
  rationale: Сам стих прямо не называет референт. Средний род допускает абстрактное или собирательное значение, но не разрешает толковательный спор. Поэтому перевод сохраняет богословскую напряжённость и неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная формулировка сохраняет противопоставление среднего рода «совершенное — частичное». Частица «же» передаёт умеренный контраст, а не резкое противопоставление.
