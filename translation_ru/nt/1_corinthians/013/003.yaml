reference: 1 Corinthians 13:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: ru
  text: И если я раздам всё своё имущество, и если отдам своё тело на сожжение[a], но любви не имею, нет мне от этого никакой пользы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «чтобы мне похвалиться» вместо «на сожжение».'
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: раздам
  rationale: Глагол обозначает раздачу по частям; в сочетании со всем имуществом естественно передаёт благотворительную раздачу всего, чем человек владеет.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: всё своё имущество
  rationale: Оборот относится к материальному достоянию человека; выбранная формулировка ясна, современна и конкретна.
- source_word: παραδῶ
  choice: отдам
  rationale: Передаёт добровольную передачу себя, не добавляя отсутствующего в тексте толкования вроде «принесу в жертву».
- source_word: τὸ σῶμά μου
  choice: своё тело
  rationale: Прямая передача конкретного существительного с естественным для русского языка возвратным притяжательным местоимением.
- source_word: ἵνα καυθήσομαι
  choice: на сожжение
  rationale: Естественная русская целевая конструкция, передающая чтение SBLGNT о предании тела для сожжения.
- source_word: ἀγάπην
  choice: любви
  rationale: «Любовь» — современный и широкий русский эквивалент ἀγάπη без архаического или конфессионально суженного оттенка.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: нет мне от этого никакой пользы
  rationale: 'Сохраняет личный смысл пассивной формы: говорящий не получает никакой пользы; по-русски звучит естественно и весомо.'
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: И если ... и если
  rationale: Повтор условной конструкции сохранён ради нарастающей риторики Павла.
theological_decisions:
- issue: Текстовый вариант в целевой части второго условия
  choice: Основное чтение SBLGNT καυθήσομαι передано как «на сожжение».
  alternative: В ряде рукописей читается καυχήσωμαι — «чтобы мне похвалиться».
  rationale: Основной текст следует указанному греческому изданию. Существенно иное древнее чтение вынесено в сноску, поскольку оно меняет смысл с телесного страдания на возможное хвастовство.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя. Сохранены повтор условий, нарастание мысли и контраст с отсутствием любви; синтаксис сделан естественным без устранения смыслового напряжения текстового варианта.
