  terminology: «Любовь» является точной и современной передачей ἀγάπη. «Раздам», «всё своё имущество» и «отдам своё тело» удачно передают смысл греческих выражений без конфессионального или интерпретационного расширения. Сноска верно и нейтрально отражает значимый текстовый вариант.
