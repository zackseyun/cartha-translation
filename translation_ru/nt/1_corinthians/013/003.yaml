  source_fidelity: Перевод точно передаёт структуру двух условий, всеохватность «всё своё имущество», предание собственного тела, цель «на сожжение», противопоставление отсутствию любви и итоговое отсутствие личной пользы. «На сожжение» корректно представляет чтение SBLGNT καυθήσομαι без внесения дополнительного толкования.
