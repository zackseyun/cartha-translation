  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: ru
  text: Любовь никогда не утрачивает силы[a]. Но пророчества будут упразднены, языки[b] умолкнут, знание будет упразднено[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «никогда не падает». Возможны также переводы: «никогда не прекращается» или «никогда не иссякает».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может обозначать как дар говорения на языках, так и человеческие языки.
    reason: lexical_alternative
  - marker: c
    text: В выражениях «пророчества будут упразднены» и «знание будет упразднено» употреблён один и тот же греческий глагол.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: любовь
  rationale: Обычное и широкое русское соответствие, сохраняющее смысл ключевого для главы понятия без архаического или конфессионально окрашенного оттенка.
- source_word: οὐδέποτε
  choice: никогда
  rationale: Естественно передаёт абсолютное отрицание.
- source_word: πίπτει
  choice: не терпит краха
  rationale: Передаёт контекстуальный, не пространственный смысл πίπτω и подчёркивает непреходящую действенность любви, не отождествляя этот глагол с последующими глаголами прекращения.
- source_word: προφητεῖαι
  choice: пророчества
  rationale: Стандартное и понятное обозначение пророческих речений или проявлений дара пророчества.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: будут упразднены / будет упразднено
  rationale: Одинаковый русский глагол сохраняет повтор одного и того же греческого глагола и передаёт прекращение действия или функции без обязательного смысла уничтожения.
- source_word: γλῶσσαι
  choice: языки
  rationale: Сохраняет принятое в контексте 1 Кор 12–14 обозначение соответствующего дара и вместе с тем не решает спор о точной природе явления.
- source_word: παύσονται
  choice: умолкнут
  rationale: Естественно передаёт прекращение речевого явления и сохраняет отличие от καταργέω в соседних частях стиха.
- source_word: γνῶσις
  choice: знание
  rationale: Обычное соответствие, согласующееся с непосредственным контекстом, где далее говорится о частичном знании.
theological_decisions:
- issue: Смысл πίπτει в утверждении о любви
  choice: Любовь никогда не терпит краха
  alternative: Любовь никогда не падает; Любовь никогда не прекращается
  rationale: Выбранная формулировка выражает надёжность и непреходящую силу любви, но не сливает πίπτει с глаголами прекращения, употреблёнными далее.
- issue: Смысл γλῶσσαι в 1 Кор 12–14
  choice: языки
  alternative: иные языки; языки как дар
  rationale: Краткое «языки» сохраняет терминологию раздела и не навязывает определённого понимания природы этого дара.
- issue: Характер прекращения пророчеств и знания
  choice: будут упразднены / будет упразднено
  alternative: прекратятся; утратят силу
  rationale: Формулировка передаёт прекращение их действия, не уточняя сверх текста время, механизм или богословскую модель этого прекращения.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный, но понятный. Сохранены трёхчастный параллелизм, различие между καταργέω и παύω и неоднозначность термина γλῶσσαι.
