revisions:
- from: Ведь теперь мы видим через зеркало, как в загадке[a], а тогда — лицом к лицу. Теперь я знаю лишь отчасти, а тогда познаю вполне, подобно тому как и сам я был познан.
  to: Ведь теперь мы видим через зеркало, как в загадке[a], а тогда — лицом к лицу. Теперь я знаю лишь отчасти, а тогда познаю вполне, как и я был познан вполне.
  rationale: 'Исправлена только заключительная часть стиха: «вполне» добавлено к пассивному «был познан», чтобы отразить тот же усиленный глагол ἐπιγινώσκω, который ранее передан как «познаю вполне». «Сам» удалено как не требуемое греческим текстом усиление. Смысл, неопределённость относительно познающего и современный литературный регистр сохранены.'
