  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: ru
  text: Ведь теперь мы видим через зеркало, как в загадке[a], а тогда — лицом к лицу. Теперь я знаю лишь отчасти, а тогда познаю вполне, как и я был познан вполне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в загадке»; то есть непрямо, неясно, загадочным образом.'
    reason: Слово αἴνιγμα буквально означает «загадка» или «нечто загадочное» и описывает опосредованность нынешнего восприятия.
lexical_decisions:
- source_word: βλέπομεν
  choice: мы видим
  rationale: Сохраняет зрительный образ и естественно передаёт настоящее время.
- source_word: ἄρτι
  choice: теперь
  rationale: Ясно противопоставляет нынешнее состояние будущему τότε — «тогда».
- source_word: δι’ ἐσόπτρου
  choice: через зеркало
  rationale: Передаёт διά с родительным падежом и сохраняет образ опосредованного видения.
- source_word: ἐν αἰνίγματι
  choice: как в загадке
  rationale: Сохраняет существительное αἴνιγμα и идею непрямого, трудноразличимого восприятия, оставаясь естественным по-русски.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: лицом к лицу
  rationale: Устойчивое русское выражение, точно передающее непосредственную встречу.
- source_word: γινώσκω ἐκ μέρους
  choice: я знаю лишь отчасти
  rationale: Точно передаёт частичный характер нынешнего знания; «лишь» подчёркивает контраст, не добавляя нового смысла.
- source_word: ἐπιγνώσομαι
  choice: познаю вполне
  rationale: Передаёт усиленный смысл ἐπιγινώσκω и контраст с «отчасти», не подразумевая всеведения.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: подобно тому как и сам я был познан
  rationale: Сохраняет пассив, оставляет познающего не названным и передаёт лексическую связь с ἐπιγνώσομαι; «сам» естественно отражает καί при местоименной форме глагола.
theological_decisions:
- issue: Объём будущего знания
  choice: «познаю вполне»
  alternative: «буду знать всё» или «познаю совершенно»
  rationale: Греческий текст противопоставляет частичное знание более полному, но не утверждает, что человек обретёт исчерпывающее или божественное всеведение.
- issue: Кем Павел был познан
  choice: Познающий оставлен не названным
  alternative: «как Бог познал меня»
  rationale: Пассивная форма ἐπεγνώσθην не называет действующее лицо; вероятная отсылка к Богу не должна превращаться в явное уточнение основного текста.
translation_notes:
  register: Современный литературный русский язык с dignified библейским ритмом. Параллелизм «теперь — тогда» и «отчасти — вполне» сохранён; формулировка избегает как архаизации, так и догматического уточнения неоднозначностей.
