base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: ru
  text: Так что же представляет собой Аполлос? И что — Павел?[a] Служители[b], через которых вы уверовали, — каждый в соответствии с тем, что дал ему Господь.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Кто же такой Аполлос? И кто такой Павел?» В греческом тексте буквально стоит «что», поэтому внимание направлено прежде всего на их роль, а не на их личность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слуги». Греческое слово здесь обозначает тех, кто служит или действует как помощник; оно не обязательно указывает на церковную должность диакона.'
    reason: lexical_alternative
  - marker: c
    text: 'Последняя часть фразы в греческом тексте эллиптична: прямо не сказано, что именно Господь дал каждому. Возможный более буквальный перевод: «и каждому — как дал Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: что такое
  rationale: Средний род вопросительного местоимения направляет вопрос на роль и положение Аполлоса и Павла, а не на их личность. Оборот «что такое» передаёт это различие по-русски, сохраняя риторическую резкость.
- source_word: οὖν
  choice: так что же
  rationale: Сочетание передаёт и выводный переход οὖν, и выразительность риторического вопроса в естественной современной русской речи.
- source_word: δέ
  choice: и
  rationale: Здесь частица продолжает парный риторический вопрос с лёгким сопоставлением; союз «и» звучит естественно и не усиливает противопоставление.
- source_word: διάκονοι
  choice: служители
  rationale: В данном контексте слово обозначает людей, исполняющих служение, а не обязательно носителей церковной должности диакона. «Служители» сохраняет достоинство выражения и одновременно подчёркивает подчинённую роль Павла и Аполлоса.
- source_word: δι’ ὧν
  choice: через которых
  rationale: 'διά с родительным падежом выражает посредство: Павел и Аполлос были орудиями, через которых коринфяне пришли к вере.'
- source_word: ἐπιστεύσατε
  choice: вы уверовали
  rationale: Глагол прямо обозначает совершившееся обращение к вере; «уверовали» кратко и точно передаёт его без пояснительного расширения.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: каждый так, как дал ему Господь
  rationale: 'Формулировка сохраняет эллипсис исходного текста: не уточняется, что именно Господь дал каждому. Слово «ему» необходимо для ясной русской конструкции и соответствует дательному ἑκάστῳ.'
- source_word: κύριος
  choice: Господь
  rationale: Это обычная и контекстуально уместная передача κύριος; перевод не уточняет прямо в основном тексте, идёт ли речь о Христе или о Боге в более общем смысле.
theological_decisions:
- issue: Референт κύριος
  choice: В основном тексте сохранено наименование «Господь» без дополнительного уточнения.
  alternative: Явно назвать Иисуса Христа или Бога.
  rationale: Контекст может указывать на Господа Иисуса как распределяющего служение, однако само слово не называет референта прямо; перевод не должен устранять эту сдержанность.
- issue: Эллипсис в выражении «как дал ему Господь»
  choice: Не называть предмет дарования и сохранить эллиптическую форму.
  alternative: «Какую задачу Господь поручил каждому» или «какое служение Господь дал каждому».
  rationale: В греческом тексте отсутствует дополнение при ἔδωκεν. Добавление «задачу», «роль» или «служение» сделало бы подразумеваемый смысл явным и сузило бы исходную формулировку.
- issue: Вопрос «что» или «кто» об Аполлосе и Павле
  choice: «Что такое» — вопрос об их роли и положении.
  alternative: «Кто такой Аполлос? И кто такой Павел?»
  rationale: Форма τί грамматически и риторически смещает внимание с личности служителей на то, чем они являются в Божьем деле, поддерживая аргумент против возвеличивания человеческих лидеров.
translation_notes:
  register: Современный литературный русский язык с краткой, весомой риторикой. «Уверовали» и «Господь» сохраняют привычный библейский регистр, оставаясь понятными современному читателю. Эллипсис заключительной части намеренно сохранён, но оформлен тире и словом «так» для читаемости.
