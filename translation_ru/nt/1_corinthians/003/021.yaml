  source_fidelity: Текст точно передаёт выводный союз ὥστε («Итак»), общее запрещение μηδεὶς καυχάσθω («пусть никто не хвалится»), широкое ἀνθρώποις («людьми») и основание πάντα γὰρ ὑμῶν ἐστιν («ведь всё — ваше»). Русский творительный при «хвалиться» естественно передаёт связь с ἐν, не сужая её до одного оттенка значения.
  naturalness: Фраза краткая, ясная и соответствует современному литературному русскому. «Ведь» уместно выражает обосновывающий γάρ, а тире в «всё — ваше» нормативно и риторически естественно.
