  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: ru
  text: Итак, пусть никто не хвалится людьми[a], ведь всё — ваше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном контексте речь прежде всего может идти о человеческих вождях или наставниках.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Союз вводит вывод из предшествующего рассуждения; «итак» естественно передаёт его логическую силу.
- source_word: μηδεὶς καυχάσθω
  choice: пусть никто не хвалится
  rationale: Форма выражает общее запрещение; «хвалиться» сохраняет смысл глагола, не сужая его до конкретного вида гордости.
- source_word: ἐν ἀνθρώποις
  choice: людьми
  rationale: С предлогом ἐν глагол может указывать на основание или предмет похвальбы. Творительный падеж после «хвалиться» естественен по-русски, а «людьми» сохраняет общее значение греческого слова.
- source_word: πάντα
  choice: всё
  rationale: Субстантивированное среднее множественного числа имеет всеохватный смысл; по-русски «всё» звучит естественнее буквального «все вещи».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание запрета; «ведь» ясно и естественно передаёт пояснительно-причинную связь.
- source_word: ὑμῶν ἐστιν
  choice: ваше
  rationale: Родительный местоимения при глаголе «быть» выражает принадлежность; именная конструкция «всё — ваше» кратко и точно передаёт смысл.
theological_decisions:
- issue: Кого обозначает ἀνθρώποις в контексте споров вокруг Павла, Аполлоса и Кифы
  choice: людьми
  alternative: человеческими вождями / наставниками
  rationale: Греческое слово означает людей вообще, хотя контекст особенно указывает на человеческих руководителей общины. Основной текст сохраняет широту формулировки, а контекстуальное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, риторически выразительная фраза. Тире подчёркивает итоговое утверждение «всё — ваше» без добавления отсутствующей в греческом связки.
