  rationale: 'Исправлено только «если… то» на «там, где…», чтобы передать ὅπου без ненужной гипотетичности. Остальные ключевые решения сохранены. Сноска уточнена: вариант «следуя человеческим меркам» яснее выражает контекстуальный смысл, не выдавая его за единственно возможный перевод, а буквальное «ходите по человеку» фиксирует образ оригинала.'
