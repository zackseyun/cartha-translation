  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: ru
  text: Ведь вы всё ещё плотские. Ведь там, где среди вас есть зависть и раздор, разве вы не плотские и не живёте по-человечески?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живёте, следуя человеческим меркам»; букв.: «ходите по человеку».'
    reason: Лексическая альтернатива для κατὰ ἄνθρωπον и сохранение буквального образа περιπατεῖτε.
lexical_decisions:
- source_word: ἔτι
  choice: всё ещё
  rationale: Передаёт продолжающееся состояние и сохраняет укор Павла.
- source_word: γὰρ
  choice: ведь / то
  rationale: Первое γὰρ передано пояснительным «ведь»; связь второго пояснения естественно выражена условной конструкцией «если… то», без изменения логики довода.
- source_word: σαρκικοί
  choice: плотские
  rationale: Сохраняет связь со словом σάρξ («плоть») и метафорическое противопоставление, не подменяя его толкованием вроде «греховные» или «бездуховные».
- source_word: ὅπου
  choice: если среди вас
  rationale: 'В данном доказательном контексте естественная русская условная конструкция передаёт мысль: наличие зависти и раздора обнаруживает названное состояние. Более формальное «где среди вас» по-русски звучит тяжеловесно.'
- source_word: ζῆλος
  choice: зависть
  rationale: В отрицательном сочетании с ἔρις слово обозначает не похвальное рвение, а завистливую ревность; «зависть» ясно передаёт этот смысл.
- source_word: ἔρις
  choice: раздор
  rationale: Передаёт общее состояние вражды и распрей, не сужая смысл до отдельных ссор.
- source_word: οὐχὶ
  choice: разве… не
  rationale: Естественно передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: κατὰ ἄνθρωπον
  choice: по-человечески
  rationale: Кратко и естественно передаёт жизнь по обычному человеческому образцу; буквальная необычная форма сохранена в сноске.
- source_word: περιπατεῖτε
  choice: живёте
  rationale: В этическом контексте метафорическое «ходить» означает вести жизнь определённым образом; «живёте» понятно современному читателю и не создаёт ложного впечатления о физической ходьбе.
theological_decisions:
- issue: Передача связанного с σάρξ прилагательного σαρκικοί
  choice: плотские
  alternative: мирские; бездуховные; живущие по греховной природе
  rationale: «Плотские» сохраняет терминологию и напряжение павловской метафоры, не внося в текст более узкой богословской интерпретации.
- issue: Передача κατὰ ἄνθρωπον περιπατεῖτε
  choice: живёте по-человечески
  alternative: ведёте себя как обычные люди; ходите по человеку
  rationale: Основной текст остаётся современным и понятным, а сноска показывает буквальный образ и возможную более явную передачу смысла. Формулировка не уточняет сверх текста природу противопоставления.
translation_notes:
  register: Современный литературный русский язык с достойным, прямым тоном обличения. Термин «плотские» сохранён ради павловской образности; менее прозрачный оборот в конце дан естественно, с буквальной формой в сноске.
