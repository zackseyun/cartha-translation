  source_fidelity: 'Текст точно передаёт греческую структуру и смысл: Κἀγώ — «И я», обращение ἀδελφοί — «братья», прошедшая невозможность οὐκ ἠδυνήθην — «не мог», а также тройное сопоставление «как с духовными... как с плотскими, как с младенцами». «Говорить с вами» является естественной русской передачей λαλῆσαι ὑμῖν и не меняет направленности высказывания.'
  naturalness: Фраза звучит литературно, ясно и сдержанно. Обращение «братья» внутри предложения и эллиптические субстантивированные прилагательные «духовными» и «плотскими» естественны для русского библейско-литературного регистра. Повтор «как с» удачно сохраняет синтаксический параллелизм оригинала.
  terminology: «Духовными» и «плотскими» сохраняют исходное противопоставление πνευματικοῖς / σαρκίνοις без конфессионально обусловленного истолкования. «Младенцами» точно передаёт образ νηπίοις. «В Мессии» обоснованно сохраняет титульную силу Χριστῷ; вариант «во Христе» корректно вынесен в сноску.
