id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: ru
  text: И я, братья[a], не мог говорить с вами как с духовными, но как с плотскими, как с младенцами в Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; в греческом тексте буквально «братья».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во Христе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: И я
  rationale: Передаёт соединительное καί и явное ἐγώ, сохраняя связь с предыдущей мыслью и личный контраст без лишнего усиления.
- source_word: ἀδελφοί
  choice: братья
  rationale: Формально передаёт мужскую форму греческого обращения; возможность обращения ко всей общине, включая женщин, отмечена в сноске.
- source_word: οὐκ ἠδυνήθην
  choice: не мог
  rationale: Естественно и точно выражает прошлую невозможность, обозначенную аористом глагола δύναμαι.
- source_word: λαλῆσαι ὑμῖν
  choice: говорить с вами
  rationale: Прямой и естественный русский эквивалент инфинитива с дательным дополнением.
- source_word: πνευματικοῖς
  choice: духовными
  rationale: Субстантивированное прилагательное понятно по конструкции «как с…» и сохраняет контраст с σαρκίνοις без добавочного толкования.
- source_word: σαρκίνοις
  choice: плотскими
  rationale: Сохраняет связь со словом «плоть» и противопоставление «духовным», не усиливая выражение до толкований вроде «грешными» или «мирскими».
- source_word: νηπίοις
  choice: младенцами
  rationale: Точно сохраняет метафору духовной незрелости и соответствует достоинству регистра.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Передаёт титульное значение Χριστός; привычный вариант «во Христе» приведён в сноске.
theological_decisions:
- issue: Передача Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Форма сохраняет значение титула «Помазанник» и не превращает его без необходимости в имя; традиционная русская передача отмечена как допустимая альтернатива.
- issue: Смысл σαρκίνοις
  choice: плотскими
  alternative: мирскими
  rationale: Выбрано лексически близкое обозначение, сохраняющее напряжение между «духовными» и «плотскими» и не навязывающее более узкую нравственную интерпретацию.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Параллельная конструкция «как с духовными… как с плотскими» передаёт структуру греческого текста; слово «младенцами» сохраняет образ незрелости.
