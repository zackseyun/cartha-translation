revisions:
- from: Если чьё-либо дело сгорит, тот понесёт ущерб, но сам спасётся — однако как бы через огонь.[a]
  to: Если чьё-либо дело сгорит, он потерпит урон, но сам спасётся — но как через огонь.[a]
  rationale: Убрано потенциально двусмысленное «как бы»; образное и намеренно нераскрытое «как через огонь» сохранено. «Понесёт ущерб» заменено на более естественное «потерпит урон». Сноска остаётся привязанной к заключительной образной фразе и отмечает допустимые переводческие развёртки, не навязывая доктринального истолкования.
