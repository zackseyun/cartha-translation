  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: ru
  text: Если чьё-либо дело сгорит, он потерпит урон, но сам спасётся — но как через огонь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты перевода: «но лишь как через огонь» или «но как человек, спасшийся из огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τινος
  choice: Если чьё-либо
  rationale: Передаёт простое условие и неопределённое указание на любого человека без дополнительного усиления.
- source_word: τὸ ἔργον
  choice: дело
  rationale: Сохраняет широкий смысл ἔργον и связь с результатом труда строителя в ближайшем контексте.
- source_word: κατακαήσεται
  choice: сгорит
  rationale: Глагол означает уничтожение огнём; «сгорит» естественно и ёмко передаёт завершённость действия.
- source_word: ζημιωθήσεται
  choice: понесёт ущерб
  rationale: Передаёт пережитую потерю, не уточняя вопреки тексту, идёт ли речь о наказании или утрате награды.
- source_word: αὐτὸς δὲ σωθήσεται
  choice: но сам спасётся
  rationale: «Сам» сохраняет эмфатическое противопоставление человека его сгоревшему делу, а «спасётся» соответствует весомому употреблению σῴζω у Павла.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: однако как бы через огонь
  rationale: Сохраняет краткий и образный характер греческой фразы; «как бы» естественно обозначает сравнение и не превращает образ в буквальное описание.
theological_decisions:
- issue: Следует ли истолковать заключительную фразу как очищение после смерти или как едва совершившееся спасение.
  choice: 'Сохранён образ: «однако как бы через огонь».'
  alternative: «но лишь как прошедший через огонь»; «но через очищающий огонь»
  rationale: Греческий текст не разъясняет точный характер образа. Перевод не закрепляет ни учение об очистительном огне, ни однозначное толкование как узкого избавления.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и dignified, с сохранением строительного и огненного образов контекста. Маркер сноски помещён после относящейся к нему заключительной фразы.
