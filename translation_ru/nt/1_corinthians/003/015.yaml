  source_fidelity: 'Основной смысл передан точно: условие относится к чьему-либо делу, которое будет уничтожено огнём; человек терпит потерю, но сам будет спасён. Однако «как бы через огонь» в современном русском может восприниматься как неуверенное «будто, якобы», тогда как ὡς вводит образное сравнение, а не оговорку о достоверности.'
  naturalness: «Понесёт ущерб» понятно, но для личной утраты в данном контексте более естественно и литературно «потерпит урон». Формулировка «спасётся — но как через огонь» кратка, сохраняет напряжённый образ и не перегружает фразу толкованием.
  terminology: «Дело» уместно для τὸ ἔργον и сохраняет широту слова в строительном контексте. «Спасётся» точно передаёт σωθήσεται. Заключительный образ не следует уточнять как посмертное очищение либо как однозначное бегство от огня.
  issues:
