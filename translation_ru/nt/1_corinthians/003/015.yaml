    issue: «Как бы через огонь» может звучать как эпистемическая оговорка.
    rationale: Русское «как бы» нередко означает «будто/якобы» и способно ослабить образ. В греческом ὡς выражает сравнение; «как через огонь» передаёт его без этой дополнительной окраски.
  - severity: low
    issue: «Понесёт ущерб» менее идиоматично для утраты, понесённой человеком.
    rationale: ζημιωθήσεται означает понести потерю/урон. «Потерпит урон» естественно по-русски и не конкретизирует природу утраты.
