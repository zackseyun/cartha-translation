  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: ru
  text: 'Дело каждого станет явным, потому что День[a] выявит его: он открывается в огне[b], и сам огонь испытает, каково дело каждого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «День», вероятно, означает будущий день Божьей оценки или суда.
    reason: cross_reference
  - marker: b
    text: 'Или: «посредством огня». Греческое выражение ἐν πυρί может означать как «в огне», так и «посредством огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: каждого
  rationale: Родительный падеж единственного числа имеет распределительное значение и сохраняет акцент на личной ответственности каждого.
- source_word: τὸ ἔργον
  choice: дело
  rationale: В контексте речь идёт о результате труда каждого строителя; «дело» передаёт широкое значение слова без неоправданного сужения до отдельного поступка.
- source_word: φανερὸν γενήσεται
  choice: станет явным
  rationale: Естественно передаёт будущее раскрытие и сохраняет результативный смысл греческого выражения.
- source_word: ἡ ἡμέρα
  choice: День
  rationale: Контекст указывает на будущий день Божьей оценки; прописная буква помогает обозначить этот особый эсхатологический смысл, не разворачивая его в пояснительный перевод.
- source_word: δηλώσει
  choice: выявит
  rationale: Передаёт действие обнаружения и оценки, при этом лексически отличается от следующего ἀποκαλύπτεται.
- source_word: ἐν πυρὶ
  choice: в огне
  rationale: Буквально и естественно сохраняет образ огня, а также не устраняет возможное инструментальное понимание «посредством огня».
- source_word: ἀποκαλύπτεται
  choice: открывается
  rationale: Сохраняет форму настоящего времени и значение обнаружения или явления; местоимение «он» соотносится с Днём.
- source_word: ὁποῖόν ἐστιν
  choice: каково
  rationale: Кратко и естественно выражает вопрос о характере и качестве дела, не сводя его только к внешнему виду.
- source_word: δοκιμάσει
  choice: испытает
  rationale: Передаёт проверку, цель которой — установить подлинный характер или качество дела.
- source_word: αὐτὸ
  choice: сам
  rationale: 'Сохраняет усилительное значение местоимения: испытание совершает именно огонь.'
theological_decisions:
- issue: Следует ли понимать ἡ ἡμέρα как обычный день или как будущий День Божьей оценки.
  choice: «День» с прописной буквы и пояснительной сноской.
  alternative: «день» со строчной буквы без уточнения.
  rationale: Ближайший контекст испытания дела каждого указывает на эсхатологическую Божью оценку, однако пояснение вынесено в сноску, чтобы не добавлять его непосредственно в текст.
- issue: Что является подлежащим при ἀποκαλύπτεται.
  choice: 'Местоимение «он» отнесено к Дню: «он открывается в огне».'
  alternative: Безличная или перестроенная формулировка, относящая откровение к делу.
  rationale: Грамматически ближайшее подлежащее — «День»; перевод сохраняет эту связь, не превращая спорную синтаксическую деталь в развёрнутое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис следует ходу греческой мысли, но остаётся понятным обычному читателю. Лексическая и богословская неоднозначность выражения ἐν πυρί сохранена в основном тексте и отмечена в сноске.
