  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: ru
  text: 'Ибо мудрость этого мира — безумие в глазах Бога[a]. Ведь написано: «Он ловит мудрых на их хитрости[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у Бога»; то есть в Божьей оценке, в Его глазах.'
    reason: semantic_clarification
  - marker: b
    text: 'Или: «в их хитрости»; «в их коварстве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: мудрость
  rationale: Обычное соответствие греческому слову; в контексте речь идёт о мудрости, которую признаёт и ценит мир.
- source_word: κόσμου τούτου
  choice: этого мира
  rationale: κόσμος здесь обозначает мир и присущий ему порядок ценностей; указательное τούτου передано словом «этого».
- source_word: μωρία
  choice: безумие
  rationale: Передаёт резкую отрицательную оценку и сохраняет характерное для данного раздела противопоставление человеческой мудрости и Божьего суждения.
- source_word: παρὰ τῷ θεῷ
  choice: у Бога
  rationale: Сохраняет краткую конструкцию оригинала и выражает оценку с Божьей точки зрения.
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся формула введения цитаты из Писания, соответствующая перфектной пассивной форме.
- source_word: δρασσόμενος
  choice: улавливает
  rationale: Передаёт образ захватывания или поимки и естественно сочетается с дальнейшим указанием на хитрость мудрых.
- source_word: σοφοὺς
  choice: мудрых
  rationale: Субстантивированное прилагательное обозначает мудрых людей без необходимости уточнять пол.
- source_word: πανουργίᾳ
  choice: хитрости
  rationale: Слово имеет здесь отрицательную окраску и обозначает изворотливую, небескорыстную сообразительность; «хитрость» сохраняет образ и допускает оттенок коварства.
theological_decisions:
- issue: Божья оценка мудрости этого мира
  choice: «безумие у Бога»
  alternative: «безумие в глазах Бога»
  rationale: Более краткая формулировка ближе к παρά с дательным падежом, а сноска поясняет её оценочный смысл, не ослабляя противопоставление.
- issue: Выражение субъекта в цитате из Иова 5:13
  choice: «Он улавливает»
  alternative: «Улавливающий мудрых»
  rationale: Греческий текст использует субстантивированное причастие, относящееся к Богу. Личное местоимение делает русскую цитату естественной, не добавляя нового богословского утверждения.
- issue: Связь мудрых с их собственной хитростью
  choice: «в их хитрости»
  alternative: «их же хитростью»
  rationale: Формулировка сохраняет предлог ἐν и не решает однозначно, означает ли он обстоятельство, сферу или средство, тем самым удерживая образную многозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Союзы «ведь» и «ибо» передают обе причинные части с γάρ; синтаксис остаётся ясным для обычного читателя. В цитате сохранён образ поимки мудрых внутри их собственной хитрости без конфессионального толкования.
