  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: ru
  text: Если же кто строит на основании из золота, серебра, драгоценных камней, дерева, сена, соломы,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: если же кто
  rationale: «Если» передаёт условие, «же» — мягкое продолжение и развитие мысли, а «кто» сохраняет неопределённо-обобщённое значение.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: строит на этом основании
  rationale: Сохраняется строительная метафора; «этом» естественно указывает на уже названное в предыдущем стихе основание.
- source_word: χρυσόν, ἄργυρον
  choice: из золота, серебра
  rationale: Предлог «из» естественно обозначает материал постройки и распространяется на весь последующий перечень.
- source_word: λίθους τιμίους
  choice: драгоценных камней
  rationale: Передаёт ценность и высокое качество камней, не уточняя, идёт ли речь о самоцветах или дорогом строительном камне.
- source_word: ξύλα
  choice: дерева
  rationale: В перечне строительных материалов русское собирательное «дерево» звучит естественнее буквального множественного числа.
- source_word: χόρτον
  choice: сена
  rationale: В противопоставлении строительных материалов речь естественно понимается как о высушенной траве, то есть сене.
- source_word: καλάμην
  choice: соломы
  rationale: В данном перечне «солома» — наиболее ясное и естественное обозначение сухих стеблей как непрочного строительного материала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены условная конструкция, строительная метафора и незавершённость предложения, продолжающегося в следующем стихе. Союзная частица «же» передаёт мягкий переход δέ без усиления контраста.
