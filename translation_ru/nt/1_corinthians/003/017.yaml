source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: ru
  text: Если кто разрушает Божий храм[a], того разрушит Бог, ибо Божий храм свят, а вы и есть этот храм[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «губит» или «оскверняет»; тот же греческий глагол повторён в словах «того разрушит Бог».'
    reason: lexical_alternative
  - marker: b
    text: '«Вы» — множественное число: Павел называет Божьим храмом общину в целом.'
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: храм
  rationale: «Храм» естественно и точно обозначает священное место Божьего присутствия; в данном контексте речь не просто о здании, а об общине как Божьем храме.
- source_word: φθείρει / φθερεῖ
  choice: разрушает / разрушит
  rationale: Одинаковый русский глагол сохраняет намеренный повтор и строгую соразмерность предупреждения. Возможные значения «растлевать» и «осквернять» отмечены в сноске.
- source_word: τοῦτον
  choice: того
  rationale: Указательное местоимение прямо соотносится с неопределённым «кто» и естественно передаёт единственное число без гендерно маркированного местоимения.
- source_word: ἅγιος
  choice: свят
  rationale: Стандартная и ёмкая передача, сохраняющая смысл святости и посвящённости Богу.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: и этот храм вы
  rationale: Такая формулировка естественно по-русски отождествляет адресатов с ранее названным храмом, сохраняя единственное число «храм» и множественное «вы».
theological_decisions:
- issue: Относится ли образ Божьего храма прежде всего к отдельному верующему или к общине в целом
  choice: 'Основной смысл — общинный: множественное «вы» отождествляет всю общину с одним Божьим храмом.'
  alternative: Слова могут применять к отдельному верующему на основании других библейских текстов.
  rationale: В греческом тексте единственное число ναός («храм») соединено с множественным ὑμεῖς («вы»), а ближайший контекст посвящён общине и её созиданию.
translation_notes:
  register: Современный литературный русский язык с кратким, строгим и торжественным звучанием. Повтор «разрушает / разрушит» сохранён ради структуры и силы греческого предупреждения; корпоративный смысл выражен без тяжеловесного пояснения в основном тексте.
