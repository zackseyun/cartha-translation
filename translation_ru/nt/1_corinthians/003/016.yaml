  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: ru
  text: Разве вы не знаете, что вы — храм Божий[a][b] и что Дух Божий обитает в вас[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище Божье».'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимение «вы» стоит во множественном числе: Павел обращается к общине в целом.'
    reason: cultural_note
  - marker: c
    text: 'Или: «среди вас».'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Разве вы не знаете
  rationale: Передаёт риторический вопрос и его укоряющую силу естественным современным русским выражением.
- source_word: ναὸς θεοῦ
  choice: храм Божий
  rationale: ναός обозначает собственно храм, святилище, а не весь храмовый комплекс; традиционное и ясное сочетание «храм Божий» сохраняет образ священного пространства.
- source_word: ἐστε
  choice: вы —
  rationale: Форма второго лица множественного числа обращена ко всей коринфской общине; русское «вы» сохраняет грамматическую множественность без добавления отсутствующего в тексте слова «вместе».
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Дух Божий
  rationale: Естественно передаёт греческую родительную конструкцию и сохраняет личностно-богословское обозначение Духа.
- source_word: οἰκεῖ
  choice: обитает
  rationale: Глагол выражает продолжающееся пребывание; «обитает» соответствует храмовому образу и достоинству стиля.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Буквально передаёт ἐν с местоимением множественного числа, не устраняя возможный корпоративный оттенок «среди вас».
theological_decisions:
- issue: Относится ли образ храма прежде всего к отдельным верующим или к общине в целом
  choice: В основном тексте оставлено множественное «вы — храм Божий», а корпоративный характер обращения пояснён в сноске.
  alternative: «Все вы вместе — храм Божий» либо индивидуализирующее «каждый из вас — храм Божий».
  rationale: Греческое ἐστε стоит во множественном числе, а контекст обращён к общине; однако слова, прямо соответствующего «вместе», в стихе нет, и индивидуализировать высказывание также нельзя.
- issue: Пространственный оттенок ἐν ὑμῖν
  choice: «в вас» в основном тексте.
  alternative: «среди вас».
  rationale: Оба понимания допустимы при множественном адресате. Основной вариант ближе к форме оригинала, а сноска сохраняет корпоративно-пространственную возможность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Порядок частей и повтор «Божий» сохраняют параллелизм греческого текста; тире естественно оформляет именную часть сказуемого.
