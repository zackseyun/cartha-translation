source:
  edition: SBLGNT
  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: ru
  text: Тот, кто сажает, и тот, кто поливает, едины[a], а каждый получит свою награду в соответствии со своим трудом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «составляют одно целое»; букв. «одно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: Сажающий
  rationale: Субстантивированное причастие сохраняет образ земледельческого труда и естественно звучит в паре с «поливающий».
- source_word: ποτίζων
  choice: поливающий
  rationale: Передаёт субстантивированное причастие настоящего времени и сохраняет сельскохозяйственную метафору.
- source_word: ἕν
  choice: одно
  rationale: Форма среднего рода указывает на единство, а не на тождество лиц; буквальная краткость сохраняет смысловую напряжённость оригинала.
- source_word: μισθὸν
  choice: награду
  rationale: В данном контексте означает воздаяние за служение и не сводит значение к денежной плате.
- source_word: λήμψεται
  choice: получит
  rationale: Простой будущий вид естественно передаёт греческую форму будущего времени.
- source_word: κατὰ
  choice: по
  rationale: Кратко и естественно выражает соответствие награды затраченному труду.
- source_word: κόπον
  choice: труду
  rationale: Передаёт не просто деятельность, а работу, сопряжённую с усилиями.
- source_word: ἴδιον
  choice: свою / своему
  rationale: Повтор возвратного притяжательного местоимения сохраняет подчёркнутую индивидуальность как награды, так и труда каждого.
theological_decisions:
- issue: Значение выражения ἕν εἰσιν («они одно»).
  choice: Сажающий и поливающий едины в общем деле и цели, при различии их ролей.
  alternative: Они равны по положению; либо представляют одну команду без особого акцента на общей цели.
  rationale: Средний род ἕν не отождествляет служителей как лиц. В контексте Павел противостоит разделению на партии и подчёркивает согласованность различных служений под властью Бога.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет параллелизм оригинала. Тире помогает естественно передать именную конструкцию «одно», а союз «но» отражает повторное δὲ и противопоставляет общность служителей индивидуальному воздаянию.
