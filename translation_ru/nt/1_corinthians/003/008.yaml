  source_fidelity: 'Смысл греческого текста в целом передан верно: два служителя объединены, а воздаяние каждому соразмерно его собственному труду. Однако «Сажающий и поливающий — одно» грамматически возможно как буквальное воспроизведение среднего рода ἕν, но по-русски звучит неестественно и может создать впечатление безличного отождествления людей.'
  naturalness: '«Сажающий» в роли существительного заметно тяжеловеснее современного литературного «тот, кто сажает». «Едины» естественно передаёт смысл единства без ложного тождества лиц. Союз «а» лучше, чем «но», передаёт δέ: здесь не резкое противопоставление, а переход от общего единства к индивидуальному воздаянию.'
  terminology: «Награда» уместно передаёт μισθός как воздаяние и не ограничивает его денежной оплатой. «В соответствии со своим трудом» ясно выражает κατὰ τὸν ἴδιον κόπον и сохраняет индивидуальный акцент ἴδιον.
