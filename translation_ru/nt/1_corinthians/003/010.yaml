base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: ru
  text: По Божьей благодати, данной мне, я, как мудрый главный строитель[a], заложил основание, а другой строит на нём. Но каждый пусть следит за тем, как строит.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «архитектор»; греческое слово обозначает главного мастера, который руководит строительством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как он строит на нём».'
    reason: previous_rendering
lexical_decisions:
- source_word: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: По данной мне благодати Божьей
  rationale: Оборот передаёт соответствие и обусловленность служения Павла дарованной ему Божьей благодатью; «по благодати» естественно по-русски и не сводит смысл лишь к средству действия.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: как мудрый главный строитель
  rationale: ἀρχιτέκτων в античном контексте обозначает руководящего строительными работами мастера, а не только современного проектировщика; «главный строитель» сохраняет строительный образ и надзорную роль.
- source_word: θεμέλιον ἔθηκα
  choice: заложил основание
  rationale: Это естественное русское сочетание для устройства основания и точная передача строительной метафоры.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: а другой строит на нём
  rationale: Приставочное ἐποικοδομεῖ означает строительство поверх уже заложенного основания; местоимение явно выражает подразумеваемый объект.
- source_word: ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ
  choice: Но каждый пусть смотрит, как строит
  rationale: βλεπέτω здесь призывает к внимательности и осмотрительности. Буквально близкое «пусть смотрит» звучит естественно в русском наставлении и сохраняет образный глагол; повторное «на нём» можно не выражать, поскольку основание ясно из контекста.
theological_decisions:
- issue: Характер благодати в выражении κατὰ τὴν χάριν
  choice: Сохранено слово «благодать» без поясняющего расширения.
  alternative: Передать как «благодаря Божьей благодати» или «по дарованной мне Божьей способности».
  rationale: Греческое χάρις допускает оттенки Божьего благоволения и дарованной способности; нейтральное «благодать» сохраняет богословскую ёмкость и не устраняет эту смысловую напряжённость.
- issue: Обобщающее единственное число ἕκαστος
  choice: Передано как «каждый ... строит».
  alternative: «Каждый человек ... строит» или множественное «все ... строят».
  rationale: Русское «каждый» естественно сохраняет распределительное единственное число и имеет обобщающее значение без ненужного ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Строительная метафора сохранена последовательно; синтаксис сделан ясным для обычного читателя без конфессиональных уточнений.
