id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: ru
  text: будь то Павел, Аполлос, Кифа, мир, жизнь, смерть, настоящее или будущее — всё ваше,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: будь то … или
  rationale: Повторяющийся союз вводит ряд однородных альтернатив; в русском перечислении естественно передать его конструкцией «будь то … или», не повторяя её перед каждым элементом.
- source_word: Παῦλος
  choice: Павел
  rationale: Традиционная русская форма личного имени.
- source_word: Ἀπολλῶς
  choice: Аполлос
  rationale: Традиционная русская форма личного имени, соответствующая греческому тексту.
- source_word: Κηφᾶς
  choice: Кифа
  rationale: Сохранена употреблённая в греческом тексте семитская форма имени, а не заменена эквивалентным именем «Пётр».
- source_word: κόσμος
  choice: мир
  rationale: Наиболее естественный и достаточно широкий русский эквивалент, обозначающий мир как целое.
- source_word: ζωή
  choice: жизнь
  rationale: Прямой и естественный эквивалент существительного.
- source_word: θάνατος
  choice: смерть
  rationale: Прямой лексический эквивалент, сохраняющий резкое противопоставление жизни и смерти.
- source_word: ἐνεστῶτα
  choice: настоящее
  rationale: Субстантивированное причастие обозначает то, что существует теперь; «настоящее» кратко и естественно противопоставлено «будущему».
- source_word: μέλλοντα
  choice: будущее
  rationale: Субстантивированное причастие обозначает грядущее; «будущее» образует ясную и лаконичную пару с «настоящим».
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа обобщает весь перечень лиц и реалий; русское «всё» естественно сохраняет всеохватность.
- source_word: ὑμῶν
  choice: ваше
  rationale: Родительный падеж выражает принадлежность; именная конструкция «всё ваше» передаёт её непосредственно и лаконично.
theological_decisions:
- issue: Смысл принадлежности в выражении πάντα ὑμῶν
  choice: всё ваше
  alternative: всё принадлежит вам
  rationale: Сохранено краткое утверждение принадлежности без пояснения её природы или богословского механизма, поскольку сам стих этого не уточняет.
translation_notes:
  register: Современный литературный русский язык с торжественной риторической лаконичностью. Перечень сохранён без добавочных пояснений; конечная запятая отражает синтаксическую незавершённость стиха в более широком предложении (3:21–23).
