lexical_decisions:
- source_word: καὶ πάλιν
  choice: И ещё
  rationale: Оборот вводит вторую подтверждающую цитату; «И ещё» естественно и кратко передаёт связь с предыдущим доводом.
- source_word: Κύριος
  choice: Господь
  rationale: Обычное и контекстуально уместное соответствие κύριος в библейской цитате.
- source_word: γινώσκει
  choice: знает
  rationale: Прямое соответствие, сохраняющее категоричность утверждения без смыслового расширения.
- source_word: διαλογισμοὺς
  choice: рассуждения
  rationale: Слово обозначает ход мыслей, умственные построения; «рассуждения» здесь точнее отражает интеллектуальный контекст, чем более общее «мысли».
- source_word: τῶν σοφῶν
  choice: мудрых
  rationale: Субстантивированное прилагательное естественно передаётся по-русски формой «мудрых» и сохраняет связь с темой мудрости в контексте.
- source_word: ὅτι
  choice: — они
  rationale: Содержательное ὅτι передано тире с местоименным возобновлением, что естественно для современного русского и ясно выражает содержание знания Господа.
- source_word: μάταιοι
  choice: тщетны
  rationale: «Тщетны» передаёт пустоту, бесплодность и безрезультатность этих рассуждений, сохраняя достоинство библейского регистра.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Тире позволяет избежать тяжеловесного буквального оборота «знает…, что они…», не меняя синтаксического смысла греческого текста.
