  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: ru
  text: Я посадил, Аполлос полил, но Бог давал рост.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но Бог взращивал»; «но Бог растил».'
    reason: Лексические варианты передачи ηὔξανεν; несовершенный вид может выражать продолжающееся Божье действие в прошлом.
lexical_decisions:
- source_word: ἐγὼ ἐφύτευσα
  choice: Я посадил
  rationale: Явно выраженное ἐγώ сохраняется местоимением «я», а «посадил» естественно и точно передаёт сельскохозяйственный образ φυτεύω.
- source_word: Ἀπολλῶς
  choice: Аполлос
  rationale: Имя передано в принятой русской библейской форме.
- source_word: ἐπότισεν
  choice: поливал
  rationale: Глагол «поливал» естественно продолжает образ ухода за посаженным растением; прошедшее время соответствует аористу.
- source_word: ἀλλὰ
  choice: но
  rationale: «Но» ясно передаёт сильное противопоставление человеческого труда решающему действию Бога.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Подлежащее названо прямо, без добавления усилительных слов, которых нет в греческом тексте.
- source_word: ηὔξανεν
  choice: взращивал
  rationale: Несовершенный вид передаёт длительное или продолжающееся в прошлом действие имперфекта; «взращивал» сохраняет образ роста и подчёркивает действенность Бога.
theological_decisions:
- issue: Соотношение человеческого служения и Божьего действия
  choice: Павел сажает, Аполлос поливает, но рост производит Бог
  alternative: «Бог дал рост» или «Бог заставил расти»
  rationale: Перевод сохраняет реальность человеческого труда и одновременно подчёркивает противопоставлением, что рост происходил благодаря действию Бога, не развивая это в дополнительное вероучительное утверждение.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и ритмичная. «Взращивал» несколько возвышеннее разговорного «растил», но понятно и уместно в библейском контексте.
