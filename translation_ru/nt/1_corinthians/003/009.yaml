  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: ru
  text: Ведь мы — Божьи сотрудники; вы — Божье поле[a], Божье строение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы — сотрудники вместе с Богом».'
    reason: Сочетание θεοῦ συνεργοί допускает понимание как работников, принадлежащих Богу и служащих Ему, так и как работников, трудящихся вместе с Богом.
lexical_decisions:
- source_word: γάρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим рассуждением естественным современным русским союзом.
- source_word: συνεργοί
  choice: соработники
  rationale: Сохраняет значение совместного труда и хорошо сочетается с намеренно сохранённой неоднозначностью следующего родительного падежа.
- source_word: θεοῦ (при συνεργοί)
  choice: Бога
  rationale: Конструкция «соработники Бога» в русском может означать работников, принадлежащих Богу и служащих Ему, при этом не устраняет полностью возможное понимание «работающие вместе с Богом».
- source_word: γεώργιον
  choice: поле
  rationale: Ясно и кратко передаёт сельскохозяйственную метафору; в контексте подразумевается возделываемая земля.
- source_word: οἰκοδομή
  choice: строение
  rationale: Естественно вводит строительную метафору, развиваемую в следующих стихах, и может обозначать как возводимое сооружение, так и результат строительства.
- source_word: ἐστε
  choice: вы —
  rationale: Прямо передаёт форму второго лица множественного числа; тире естественно восполняет отсутствующую в настоящем времени связку.
theological_decisions:
- issue: Означает ли θεοῦ συνεργοί «Божьи соработники» или «соработники с Богом»
  choice: соработники Бога
  alternative: соработники с Богом
  rationale: Родительный падеж допускает оба толкования. Выбранная формулировка согласуется с контекстом, где служители принадлежат Богу и трудятся у Него, но сохраняет в русском некоторую неоднозначность; альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий, возвышенно-нейтральный библейский стиль. Повтор «Божье» сохранён как значимый риторический параллелизм оригинала.
