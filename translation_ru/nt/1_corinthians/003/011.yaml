  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: ru
  text: Ведь никто не может заложить другого основания помимо того, которое уже положено; это основание — Иисус, Мессия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус Христос».'
    reason: Традиционный вариант передачи титула Χριστός.
lexical_decisions:
- source_word: θεμέλιον
  choice: основание
  rationale: Прямое и естественное соответствие строительному образу, который Павел развивает в ближайшем контексте.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущим высказыванием естественным современным русским союзом.
- source_word: ἄλλον
  choice: другого
  rationale: Сохраняет смысл иного, дополнительного основания.
- source_word: οὐδεὶς δύναται
  choice: никто не может
  rationale: Точно передаёт всеобщность отрицания и значение способности или возможности.
- source_word: θεῖναι
  choice: заложить
  rationale: По-русски фундамент или основание обычно «закладывают»; это сохраняет строительную метафору.
- source_word: παρὰ τὸν κείμενον
  choice: кроме уже положенного
  rationale: 'Передаёт исключающее значение παρά и результативно-стативный смысл причастия κείμενον: основание уже находится на своём месте.'
- source_word: ὅς ἐστιν
  choice: и основание это —
  rationale: Естественно по-русски отождествляет ранее названное основание с Иисусом, не меняя референт относительного местоимения.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Мессия
  rationale: Χριστός передано как значимый титул «Мессия», а не как фамилия; традиционный вариант сохранён в сноске.
theological_decisions:
- issue: Передача Χριστός в выражении Ἰησοῦς Χριστός
  choice: Иисус Мессия
  alternative: Иисус Христос
  rationale: Греческое Χριστός сохраняет значение титула Помазанника. Перевод «Мессия» явно передаёт этот смысл, тогда как привычная церковная форма «Христос» дана как допустимый традиционный вариант.
- issue: Отождествление основания с Иисусом
  choice: и основание это — Иисус Мессия
  alternative: которое есть Иисус Мессия
  rationale: Выбранная русская конструкция сохраняет прямое отождествление и грамматическую отсылку к «основанию», избегая неестественного буквального оборота.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского текста. Строительная метафора сохранена; синтаксис сделан естественным без устранения прямого отождествления основания с Иисусом.
