lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: В данном обобщающем контексте русское «когда» естественно передаёт неопределённую или повторяющуюся ситуацию.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» сохраняет пояснительную связь с предыдущим рассуждением Павла и звучит естественно в современном русском.
- source_word: λέγῃ τις
  choice: один говорит
  rationale: В паре с ἕτερος δέ оборот «один… а другой…» ясно и естественно передаёт неопределённых участников противопоставления.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Я — Павлов
  rationale: Именная форма сохраняет сжатость греческого родительного падежа и выражает принадлежность к партии Павла, не раскрывая отношение более определённо, чем оригинал.
- source_word: ἕτερος δέ
  choice: а другой
  rationale: Передаёт сопоставительную конструкцию μέν…δέ естественной русской парой «один… а другой…».
- source_word: Ἐγὼ Ἀπολλῶ
  choice: Я — Аполлосов
  rationale: Восстанавливает подразумеваемую связку и сохраняет точный параллелизм с «Я — Павлов».
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: разве вы не просто люди?
  rationale: Риторическая формула «разве… не» передаёт ожидаемый утвердительный ответ; «просто» выражает контекстуальный укор за поведение по сугубо человеческим меркам, тогда как буквальный вариант сохранён в сноске.
theological_decisions:
- issue: Смысл ἄνθρωποι в риторическом упрёке
  choice: просто люди
  alternative: люди; поступаете по-человечески
  rationale: Основной текст передаёт контекстуальный оттенок ограниченного, плотского человеческого поведения, не превращая существительное в глагольную характеристику; буквальная и более динамическая возможности отмечены в сноске.
translation_notes:
  register: Современный литературный русский с краткой, риторически выразительной структурой. Формы «Павлов» и «Аполлосов» несколько отмечены стилистически, но понятны и сохраняют намеренно сжатые формулы партийной принадлежности в греческом тексте.
