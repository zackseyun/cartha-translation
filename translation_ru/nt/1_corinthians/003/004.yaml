  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: ru
  text: 'Ведь всякий раз, когда один говорит: «Я — сторонник Павла», а другой: «Я — сторонник Аполлоса», разве вы не просто люди?[a]'
  philosophy: optimal-equivalence
  footnotes:
