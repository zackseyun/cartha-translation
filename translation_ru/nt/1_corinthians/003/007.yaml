- from: Поэтому ни тот, кто сажает, ничего не значит, ни тот, кто поливает, но Бог, Который даёт рост.[a]
  to: Итак, ни тот, кто сажает, ни тот, кто поливает, ничего не значат, а рост даёт Бог.[a]
  rationale: Перевод исправлен ради естественной русской синтаксической формы. «Итак» сохраняет выводный характер ὥστε; параллель «ни тот..., ни тот...» сохранена; «рост даёт Бог» передаёт Божье действие в αὐξάνων и оставляет «Бог» в конечной, эмфатической позиции. Сноска заменяет не вполне определённое «взращивает» на прямой лексический вариант и сохраняет традиционную формулировку.
