lexical_decisions:
- source_word: ὥστε
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения естественным современным русским союзным наречием.
- source_word: ὁ φυτεύων
  choice: тот, кто сажает
  rationale: Сохраняет субстантивированное причастие и параллелизм с последующим выражением, оставаясь естественным по-русски.
- source_word: ἐστίν τι
  choice: ничего не значит
  rationale: 'Передаёт смысл греческой идиомы в контексте: человеческий служитель сам по себе не имеет определяющего значения. Буквальное «не есть что-либо» по-русски неестественно.'
- source_word: ὁ ποτίζων
  choice: тот, кто поливает
  rationale: Естественно воспроизводит субстантивированное причастие и риторическую параллель с «тем, кто сажает».
- source_word: ἀλλ’
  choice: но
  rationale: Сохраняет прямое противопоставление человеческих работников Богу.
- source_word: ὁ αὐξάνων
  choice: Который даёт рост
  rationale: Передаёт Бога как Того, от Кого происходит рост, не уточняя его вид и сохраняя образ предыдущего земледельческого контекста.
- source_word: θεός
  choice: Бог
  rationale: Сохраняет эмфатическое конечное положение по смыслу и ясно называет подлинный источник роста.
theological_decisions:
- issue: Относительная значимость служителей и действие Бога
  choice: «ничего не значит… но Бог»
  alternative: «не есть что-либо… но Бог»
  rationale: Фраза сохраняет резкий риторический контраст Павла, не превращая его в утверждение о полном отсутствии у служителей какой-либо ценности вне данного контекста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены земледельческий образ и параллельная структура стиха; заглавная буква в «Который» соответствует принятому благоговейному библейскому регистру.
