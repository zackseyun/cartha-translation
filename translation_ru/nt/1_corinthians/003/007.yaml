  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: ru
  text: Итак, ни тот, кто сажает, ни тот, кто поливает, ничего не значат, а рост даёт Бог.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
