  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: ru
  text: Я давал вам пить молоко[a], а не твёрдую пищу[b], потому что вы ещё не могли. Да и теперь всё ещё не можете,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я дал вам пить молоко».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово означает пищу вообще; «твёрдая» добавлено по смыслу из противопоставления молоку.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: молоком
  rationale: Прямой и естественный русский эквивалент, сохраняющий образ молочного питания.
- source_word: ἐπότισα
  choice: поил
  rationale: Глагол буквально обозначает «давать пить»; русский глагол «поил» естественно сочетается с молоком и сохраняет исходную метафору.
- source_word: βρῶμα
  choice: твёрдой пищей
  rationale: Само слово означает пищу вообще, однако определение «твёрдой» естественно передаёт подразумеваемое противопоставление молоку; буквальная широта отмечена в сноске.
- source_word: οὔπω
  choice: ещё … не
  rationale: Передаёт временное отрицание и сохраняет мысль о тогдашней неспособности.
- source_word: ἐδύνασθε
  choice: были не способны её принять
  rationale: Передаёт способность в прошедшем времени; «принять» естественно раскрывает подразумеваемое отношение к пище, не истолковывая содержание метафоры.
- source_word: οὐδὲ ἔτι νῦν
  choice: Да и теперь всё ещё не
  rationale: Сочетание «да и теперь» и «всё ещё» передаёт как усиление, так и продолжающееся состояние.
- source_word: δύνασθε
  choice: способны
  rationale: Настоящее время противопоставлено прежней неспособности и сохраняет параллель с предыдущим глаголом.
theological_decisions:
- issue: Толкование метафоры питания
  choice: Сохранить образ молока и твёрдой пищи без пояснения, какие именно виды наставления им соответствуют.
  alternative: 'Передать смысл истолковательно: «я учил вас только начальным истинам».'
  rationale: Греческий текст выражает мысль метафорой; её сохранение не навязывает читателю более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным звучанием. Параллель «были не способны — всё ещё не способны» сохраняет риторическое усиление оригинала; запятая в конце оставлена в соответствии с границей предоставленного отрывка.
