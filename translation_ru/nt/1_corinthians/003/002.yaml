    rationale: Греческое ἐδύνασθε означает «вы не могли / не были способны» без выраженного инфинитива или дополнения. Добавление «принять» истолковывает образ и нарушает лаконичный параллелизм с последующим δύνασθε.
  - severity: low
    issue: Разные глаголы в противопоставлении «поил ... не кормил»
    rationale: В оригинале один глагол ἐπότισα соотнесён с контрастными объектами. Русское противопоставление двух глаголов не фатально, но менее точно передаёт построение фразы.
