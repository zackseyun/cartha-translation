  source_fidelity: Греческие родительные Χριστοῦ и θεοῦ в обеих кратких именных конструкциях выражают отношение принадлежности. Вариант «принадлежите ... / принадлежит ...» точно передаёт это отношение и сохраняет параллельное, намеренно нераскрытое высказывание.
  naturalness: «Вы — Мессии, а Мессия — Божий» формально возможно и напоминает традиционный библейский стиль, однако «Божий» в современном литературном русском звучит возвышенно-архаично и может читаться как «божественный», а не как ясное указание на принадлежность. Глагольная формулировка естественнее и прозрачнее.
  terminology: «Мессия» последовательно передаёт Χριστός в соответствии с заданным лексическим решением. «Бог» точно передаёт θεός; замена «Божий» на «принадлежит Богу» устраняет нежелательную семантическую двусмысленность, не добавляя доктринального толкования.
