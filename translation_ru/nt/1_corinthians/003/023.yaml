lexical_decisions:
- source_word: ὑμεῖς
  choice: вы
  rationale: Местоимение второго лица множественного числа; русское «вы» естественно передаёт обращение к общине без добавочного усиления.
- source_word: δὲ
  choice: а
  rationale: Частица отмечает переход и сопоставление в цепочке принадлежности; «а» естественно сохраняет связь и лёгкий контраст между звеньями.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Родительный падеж выражает принадлежность. Передача титулом «Мессия» сохраняет его смысл и позволяет воспроизвести лаконичную греческую конструкцию.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Именительный падеж повторяет тот же титул, создавая риторический параллелизм двух частей.
- source_word: θεοῦ
  choice: Божий
  rationale: Предикативное притяжательное прилагательное естественно по-русски передаёт родительный принадлежности θεοῦ и сохраняет краткость исходной фразы.
theological_decisions:
- issue: Передача двух конструкций принадлежности Χριστοῦ и θεοῦ без истолкования характера этих отношений.
  choice: «вы — Мессии, а Мессия — Божий»
  alternative: «вы принадлежите Мессии, а Мессия принадлежит Богу»
  rationale: Краткие именные конструкции ближе к форме греческого текста и сохраняют его параллелизм, неоднозначность и богословское напряжение, не поясняя, в каком именно смысле Мессия назван Божьим.
translation_notes:
  register: Современный литературный русский язык; предельно лаконичная, торжественная формулировка. Тире восполняют отсутствующую в греческом связку и делают параллелизм прозрачным.
