review_pass:
  verdict: revise
  source_fidelity: 'Условная конструкция, будущее время и обещание μισθός переданы верно. Однако «дело, которое кто-либо надстроил» синтаксически и семантически неудачно: по-русски создаётся впечатление, что надстраивают уже само «дело», тогда как ἐποικοδόμησεν обозначает то, что человек построил на положенном основании. Перестройка фразы делает соотнесённость деятеля и построенного ясной.'
  naturalness: «Если у кого-либо устоит построенное им на основании» — современная литературная и ясная формулировка в строительном образе данного контекста. Она избегает тяжеловесного и неестественного «которое кто-либо надстроил».
  terminology: «Награду» уместно передаёт μισθός, не уточняя характер воздаяния. «Устоит» хорошо соответствует μενεῖ в непосредственном контексте испытания огнём; альтернативы сохранены в сноске. Упоминание основания выражает направленность приставки ἐπί- в ἐποικοδομέω и опирается на явно названное основание в ближайшем контексте (3:11).
