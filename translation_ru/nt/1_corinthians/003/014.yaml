  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: ru
  text: Если у кого-либо устоит построенное им на основании, он получит награду.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «останется» или «сохранится».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вознаграждение» или «плату».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: Если
  rationale: Вводит обычное условное предложение; простое «если» точно и естественно.
- source_word: τινος
  choice: кто-либо
  rationale: Неопределённое местоимение в родительном падеже связано с «делом»; русская конструкция с относительным придаточным естественно передаёт смысл «дело кого-либо».
- source_word: τὸ ἔργον
  choice: дело
  rationale: «Дело» сохраняет широкий смысл результата труда и хорошо сочетается со строительным образом контекста.
- source_word: μενεῖ
  choice: устоит
  rationale: Будущая форма означает, что дело останется или сохранится; «устоит» естественно передаёт это в контексте испытания огнём, не превращая образ в прямое утверждение о физическом выживании.
- source_word: ὃ ἐποικοδόμησεν
  choice: которое кто-либо надстроил
  rationale: Глагол ἐποικοδομέω обозначает строительство на уже положенном основании. «Надстроил» сохраняет эту направленность без добавления отсутствующего в стихе дополнения «на основании».
- source_word: μισθὸν
  choice: награду
  rationale: В контексте оценки Богом «награда» звучит естественно и сохраняет значение воздаяния; возможны также более экономические оттенки «плата» и «вознаграждение».
- source_word: λήμψεται
  choice: он получит
  rationale: Точно передаёт будущее время и сохраняет грамматически мужскую форму единственного числа греческого текста.
theological_decisions:
- issue: Характер μισθός при Божьей оценке труда
  choice: награда
  alternative: плата; вознаграждение
  rationale: Перевод не уточняет природу награды и не связывает её с какой-либо частной доктриной; он лишь сохраняет идею воздаяния из контекста.
translation_notes:
  register: Современный литературный русский, сжатый и достойный. Порядок слов сделан естественным для русского языка. «Надстроил» поддерживает строительную метафору предыдущих стихов; «устоит» передаёт испытание, не устраняя возможный буквальный оттенок «останется», отмеченный в сноске.
