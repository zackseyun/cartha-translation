id: 1CO.3.18
reference: 1 Corinthians 3:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: ru
  text: Пусть никто не обманывает самого себя. Если кто-нибудь из вас считает себя мудрым в нынешнем веке[a], пусть станет глупым[b], чтобы стать мудрым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрым по меркам нынешнего века».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «глупцом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: Пусть никто не обманывает самого себя
  rationale: Сохраняет всеобщий запрет, явно выраженное возвратное дополнение и прямое значение глагола «обманывать», не усиливая без необходимости значение приставки ἐξ-.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: считает себя мудрым
  rationale: В данном контексте δοκεῖ обозначает мнение человека о самом себе; русское «считает себя» ясно передаёт эту самооценку.
- source_word: ἐν ὑμῖν
  choice: из вас
  rationale: Естественно обозначает принадлежность человека к общине адресатов; буквальное «среди вас» также возможно, но здесь звучит менее плавно.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: в нынешнем веке
  rationale: «Век» сохраняет временно-мировоззренческий оттенок αἰών и не смешивает его с более общим понятием мира; «нынешнем» естественнее в современном русском контексте, чем «этом».
- source_word: μωρὸς γενέσθω
  choice: пусть станет глупым
  rationale: Передаёт предикативное прилагательное μωρός и повелительную форму γενέσθω, сохраняя намеренный парадокс и не превращая характеристику в неизменное обозначение личности.
- source_word: ἵνα γένηται σοφός
  choice: чтобы стать мудрым
  rationale: Естественно и точно передаёт целевое предложение с ἵνα и повтор глагола γίνομαι, насколько это допускает русская фраза.
theological_decisions:
- issue: Смысл αἰών в противопоставлении Павла
  choice: «в нынешнем веке»
  alternative: «в этом мире» или «по меркам нынешнего века»
  rationale: Основной текст сохраняет временной оттенок αἰών и вместе с тем оставляет открытым вопрос, означает ли выражение принадлежность нынешнему веку или оценку по его меркам; последнее пояснено в сноске.
- issue: Парадокс истинной мудрости через глупость
  choice: «пусть станет глупым, чтобы стать мудрым»
  alternative: «пусть станет глупцом, чтобы стать мудрецом»
  rationale: Сохраняется богословское напряжение и словесное противопоставление Павла без поясняющего добавления о том, перед кем или по чьим меркам человек должен стать глупым.
- issue: Обобщённое грамматически мужское единственное число
  choice: «кто-нибудь… себя… мудрым… глупым»
  alternative: Перестройка во множественном числе с гендерно-нейтральными формами
  rationale: Русская конструкция с «кто-нибудь» естественно требует форм мужского рода как обобщённых и соответствует греческому единственному числу, не ограничивая смысл только мужчинами.
translation_notes:
  register: Современный литературный русский язык с краткой, увещательной интонацией. Синтаксический параллелизм «стать глупым — стать мудрым» сохранён; архаизмы и конфессионально окрашенные пояснения не используются.
