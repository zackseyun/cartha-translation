  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: ru
  text: Я вовсе не имел в виду людей, предающихся в этом мире сексуальной распущенности, корыстолюбцев, хищников[a] или идолопоклонников[b], — иначе вам пришлось бы уйти из мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грабителей», «вымогателей». Греческое слово ἅρπαξ может обозначать тех, кто хищнически отнимает или присваивает чужое — силой либо путём эксплуатации.'
    reason: lexical_alternative
  - marker: b
    text: Павел поясняет, что не имел в виду полного отказа от общения со всеми безнравственными людьми вне общины; ср. 1 Кор. 5:11.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: Я вовсе не имел в виду
  rationale: Выражение уточняет смысл предыдущего наставления и отрицает его абсолютное понимание. В русском языке добавление подразумеваемого глагола делает фразу естественной и связной.
- source_word: πόρνοις
  choice: тех, кто… живёт в разврате
  rationale: Передаёт именно сексуальную распущенность, не расширяя значение до безнравственности вообще; формулировка понятна современному читателю.
- source_word: τοῦ κόσμου τούτου
  choice: в этом мире
  rationale: В данном контексте κόσμος обозначает окружающее человеческое общество вне церковной общины; выражение также сохраняет связь с заключительным «из мира».
- source_word: πλεονέκταις
  choice: корыстолюбцев
  rationale: Слово обозначает людей, жадно стремящихся приобрести больше, нередко за счёт других. «Корыстолюбцы» сохраняет нравственный и эксплуататорский оттенок.
- source_word: ἅρπαξιν
  choice: вымогателей
  rationale: ἅρπαξ может обозначать тех, кто хищнически отнимает или присваивает чужое силой либо эксплуатацией. «Вымогатели» естественно передаёт этот оттенок, а более широкая альтернатива дана в примечании.
- source_word: εἰδωλολάτραις
  choice: идолопоклонников
  rationale: Точное, краткое и общепонятное обозначение людей, поклоняющихся идолам.
- source_word: ἐπεὶ
  choice: иначе
  rationale: Здесь союз вводит следствие, которое наступило бы при абсолютном понимании прежнего наставления.
- source_word: ὠφείλετε
  choice: вам пришлось бы
  rationale: Имперфект в условно-следственном рассуждении выражает практическую необходимость; эта русская конструкция передаёт её естественно.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: уйти из мира
  rationale: 'Сохраняет намеренно резкую, почти гиперболическую формулировку: полностью избегать таких людей можно было бы лишь покинув мир.'
theological_decisions:
- issue: Круг людей, от которых требуется отделение в контексте
  choice: Павел поясняет, что прежнее наставление не требовало полностью избегать безнравственных людей вне общины.
  alternative: Павел требует полного общественного обособления от всех безнравственных людей.
  rationale: 'Сам стих исключает абсолютное понимание: иначе верующим пришлось бы уйти из мира. Перевод сохраняет это уточнение, не вводя требования общественной изоляции.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксически подразумеваемое значение предыдущего стиха раскрыто словами «Я… не имел в виду», чтобы стих естественно читался по-русски; перечень и напряжённый вывод «уйти из мира» сохранены.
