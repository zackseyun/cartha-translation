translation:
  language: ru
  text: предать такого человека Сатане для уничтожения плоти[a], чтобы дух был спасён в День Господа.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для погибели плоти». Выражение может указывать на суровое телесное наказание либо, в более переносном смысле, на уничтожение плотской, греховной направленности этого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «нашего Господа Иисуса» или «Господа Иисуса» вместо «Господа».'
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: предать
  rationale: Инфинитив передаёт действие, которое Павел предписывает общине; «предать» естественно сочетается с дательным «сатане» и сохраняет серьёзность выражения.
- source_word: τὸν τοιοῦτον
  choice: такого человека
  rationale: Передаёт указание на конкретного виновного и одновременно сохраняет категориальный оттенок греческого выражения.
- source_word: τῷ Σατανᾷ
  choice: сатане
  rationale: Имя передано в принятой русской библейской форме; дательный падеж соответствует греческой конструкции.
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: для уничтожения плоти
  rationale: «Уничтожение» сохраняет силу ὄλεθρος, а «плоть» не снимает неоднозначности между телесным наказанием и уничтожением греховной, плотской направленности.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит цель или предполагаемый результат действия.
- source_word: τὸ πνεῦμα
  choice: дух
  rationale: Не добавлено местоимение «его», отсутствующее в греческом тексте; контекстуальный референт при этом остаётся понятным, но формально не уточняется.
- source_word: σωθῇ
  choice: был спасён
  rationale: Страдательная форма сохраняет богословски значимую лексику спасения и соответствует аористу пассивного сослагательного наклонения после ἵνα.
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: в День Господа
  rationale: Передаёт эсхатологическое выражение естественным современным русским языком; прописная буква отмечает его характер как обозначения особого грядущего дня.
theological_decisions:
- issue: Значение выражения «уничтожение плоти»
  choice: Сохранить в основном тексте неоднозначное выражение «уничтожение плоти».
  alternative: Тяжёлое телесное наказание или смерть; либо уничтожение греховной, плотской направленности человека.
  rationale: Греческое выражение допускает оба понимания и не позволяет безоговорочно выбрать одно из них.
- issue: Референт слова «дух»
  choice: Перевести без добавления «его».
  alternative: «Его дух».
  rationale: Контекст указывает на дух виновного, однако притяжательного местоимения в греческом тексте нет.
- issue: Форма выражения «День Господа»
  choice: 'Следовать чтению SBLGNT: «Господа».'
  alternative: «Господа Иисуса» или «нашего Господа Иисуса».
  rationale: Основной источник содержит только κυρίου; расширенные чтения отражены в текстологическом примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и краткости апостольского предписания. Неоднозначность ключевого выражения о плоти намеренно сохранена; синтаксис сделан ясным без конфессиональных уточнений.
