lexical_decisions:
- source_word: Ἔγραψα
  choice: Я писал
  rationale: Аорист передан естественным русским прошедшим временем. Несовершенный вид «писал» идиоматичен с указанием содержания письма и сам по себе не решает, идёт ли речь о прежнем письме или о данном послании.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж обозначает адресатов написанного.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: в послании
  rationale: Определённость греческого выражения указывает на известное адресатам письмо, но не устанавливает, прежнее ли это письмо или нынешнее послание. «Послание» здесь естественно для апостольского письма и сохраняет серьёзный литературный регистр.
- source_word: μὴ συναναμίγνυσθαι
  choice: чтобы вы не общались с
  rationale: Инфинитив с μή передаёт содержание прежнего письменного наставления. «Не общались с» естественно по-русски и выражает отказ от поддержания близкого общения, не сводя значение к случайному контакту.
- source_word: πόρνοις
  choice: людьми, живущими в половой распущенности
  rationale: Существительное обозначает людей, которых характеризует сексуально безнравственное поведение. Описательный перевод понятен современному читателю и не сужает значение до одного конкретного вида нарушения.
theological_decisions:
- issue: К какому письму относится «в послании»
  choice: Перевод не уточняет, говорит ли Павел о прежнем письме или о нынешнем послании.
  alternative: Явно указать либо на утраченное прежнее письмо, либо на более раннюю часть 1 Коринфянам.
  rationale: Греческое ἐν τῇ ἐπιστολῇ определённо по форме, но само по себе не разрешает историческую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис остаётся близким к греческому, а неоднозначность относительно письма сохранена. Формулировка о половой распущенности описывает устойчивое поведение, не вводя конфессионально обусловленной терминологии.
