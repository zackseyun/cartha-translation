base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: ru
  text: 'Действительно, как сообщают, среди вас есть сексуальная безнравственность — и такая сексуальная безнравственность, какой нет даже среди язычников[a]: некто имеет жену своего отца[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди народов»; здесь: среди неевреев.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «имеет жену своего отца»; то есть состоит с ней в сексуальной связи. Возможно, это была его мачеха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: действительно
  rationale: Передаёт усилительный смысл и потрясение Павла; количественное «вообще» здесь менее естественно.
- source_word: ἀκούεται
  choice: до нас доходят слухи
  rationale: Безличный пассив указывает на распространяющееся известие. Русская идиома естественно передаёт смысл «сообщают / слышно», не утверждая формального донесения.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Обозначает происходящее внутри коринфской общины.
- source_word: πορνεία
  choice: разврат
  rationale: Широкое обозначение недозволенного полового поведения; современно и выразительно, без узкого значения устаревающего «блуд».
- source_word: καὶ τοιαύτη πορνεία
  choice: и притом такой разврат
  rationale: Сохраняет усиление и подчёркивает исключительный характер проступка.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: какого нет даже среди язычников
  rationale: В русском контексте «язычники» естественно обозначает нееврейские народы вне Божьего народа; глагол «нет» восполняет греческий эллипсис без добавления идеи распространённости.
- source_word: γυναῖκά τινα τοῦ πατρὸς ἔχειν
  choice: один человек живёт с женой своего отца
  rationale: τινα выражено как неопределённое «один человек», а контекстуальное ἔχειν передано естественной русской эвфемистической формулой отношений; буквальная фраза пояснена в сноске.
theological_decisions:
- issue: Передача ἔθνεσιν
  choice: язычников
  alternative: народов; неевреев
  rationale: «Язычники» — понятное русское обозначение противопоставленной Израилю и христианской общине среды. Сноска сохраняет более буквальную этническую альтернативу и предупреждает излишне узкое понимание.
- issue: Определение женщины как мачехи
  choice: жена своего отца
  alternative: мачеха
  rationale: Греческий текст не употребляет специального термина родства; формулировка не решает вопрос о точном семейном статусе женщины.
- issue: Контекстуальный смысл ἔχειν
  choice: живёт с
  alternative: имеет
  rationale: По-русски буквальное «имеет жену отца» неестественно и может быть неясно; «живёт с» передаёт устойчивую половую связь, сохраняя эвфемистичность и не уточняя её юридический статус.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор слова «разврат» сохраняет риторическое усиление оригинала; двоеточие вводит конкретное содержание сообщения.
