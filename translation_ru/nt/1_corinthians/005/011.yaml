  variant: modern literary Russian
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: ru
  text: Но теперь я написал вам не общаться с тем, кто носит имя брата и при этом развратник, корыстолюбец, идолопоклонник, оскорбитель, пьяница или вымогатель. С таким человеком даже не ешьте вместе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: Но теперь я написал
  rationale: Сохранён аорист «написал» и противопоставление νῦν δέ предыдущему пояснению; речь может идти о только что данном письменном указании.
- source_word: μὴ συναναμίγνυσθαι
  choice: не общаться
  rationale: Естественно передаёт запрет поддерживать близкое общество или связь, не сводя его к случайному контакту.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: называясь братом
  rationale: Сохраняет осторожную формулировку оригинала о человеке, который носит имя брата, без окончательного суждения о подлинности его веры.
- source_word: πόρνος
  choice: развратником
  rationale: Обозначает человека, практикующего половую безнравственность; существительное сохраняет характеристику устойчивого поведения.
- source_word: πλεονέκτης
  choice: корыстолюбцем
  rationale: Передаёт алчность, стремление приобретать больше и наживаться, а не просто нейтральное желание владеть.
- source_word: λοίδορος
  choice: оскорбителем
  rationale: Передаёт человека, который злословит, поносит и словесно унижает других; современнее и яснее, чем «злоречивый».
- source_word: μέθυσος
  choice: пьяницей
  rationale: Передаёт не единичное опьянение, а человека, известного привычным пьянством.
- source_word: ἅρπαξ
  choice: грабителем
  rationale: Сохраняет сильный образ хищного присвоения чужого; контекст допускает также вымогательство и мошенническую наживу.
- source_word: μηδὲ συνεσθίειν
  choice: даже не ешьте вместе
  rationale: Прямо и естественно передаёт усилительный запрет совместной трапезы.
theological_decisions:
- issue: Статус человека, называемого братом
  choice: «называясь братом»
  alternative: «кто считается братом» / «кто называет себя братом»
  rationale: 'Греческая конструкция сохраняет некоторую неопределённость: человек известен под именем брата, однако Павел не выносит здесь явного решения о подлинности его принадлежности к вере.'
- issue: Характер перечисленных пороков
  choice: «остаётся развратником…»
  alternative: простое «является развратником…»
  rationale: Добавленное «остаётся» естественно показывает продолжающийся, характеризующий человека образ жизни, а не единичное падение, не превращая это в отдельную догматическую формулу.
- issue: Объём запрета совместной еды
  choice: буквально «даже не ешьте вместе» без уточнения вида трапезы
  alternative: ограничить запрет церковной трапезой или распространить его на любой случай еды
  rationale: Оригинал не уточняет, идёт ли речь исключительно о Вечере Господней, общинных трапезах или также о частном застольном общении; перевод сохраняет эту широту.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified по тону. Перечень оформлен существительными, как в греческом тексте. «Не общаться» звучит естественно, а заключительное «даже не ешьте вместе» конкретизирует строгость указания без конфессионального толкования.
