revisions:
- from: Но теперь я написал вам не общаться с тем, кто, называясь братом, остаётся развратником, корыстолюбцем, идолопоклонником, оскорбителем, пьяницей или грабителем. С таким человеком даже не ешьте вместе.
  to: Но теперь я написал вам не общаться с тем, кто носит имя брата и при этом развратник, корыстолюбец, идолопоклонник, оскорбитель, пьяница или вымогатель. С таким человеком даже не ешьте вместе.
  rationale: Убрано невыраженное в подлиннике «остаётся». Формула о «носящем имя брата» сохраняет намеренную осторожность ὀνομαζόμενος, а «вымогатель» точнее передаёт ἅρπαξ. Синтаксис заключительного запрета и его широта сохранены без конфессионального уточнения.
