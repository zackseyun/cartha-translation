review_pass:
  verdict: revise
  source_fidelity: 'В целом перечень и два запрета переданы верно. Однако «остаётся» не выражено в греческом тексте: причастие ὤν («будучи») характеризует человека, но не добавляет идеи продолжения после прежнего состояния. «Грабитель» возможен, но для ἅρπαξ в данном этическом перечне более естественно «вымогатель», поскольку слово охватывает хищное, насильственное или бесчестное присвоение чужого, а не только физическое ограбление.'
  naturalness: Текст звучит современно и литературно. «Кто носит имя брата» естественнее передаёт ἀδελφὸς ὀνομαζόμενος, не создавая оттенка, будто человек лишь сам себя так называет.
  terminology: «Развратник», «корыстолюбец», «идолопоклонник», «оскорбитель» и «пьяница» уместны. «Вымогатель» точнее передаёт ἅρπαξ в этом контексте, чем «грабитель».
  issues:
  - severity: medium
    issue: Добавлено «остаётся».
    rationale: В оригинале нет наречия или глагольной формы со значением «продолжает оставаться». Контекст может предполагать устойчивую характеристику, но перевод не должен превращать это в явно выраженное условие.
  - severity: low
    issue: «Называясь братом» может пониматься как самоназвание.
    rationale: ὀνομαζόμενος — «называемый/именуемый»; формула «носит имя брата» лучше сохраняет пассивную, социально-идентификационную неопределённость.
  - severity: low
    issue: «Грабитель» сужает значение ἅρπαξ.
    rationale: Термин может обозначать хищного присвоителя, в том числе вымогателя; «вымогатель» лучше работает в современном этическом перечне.
  revised_text: Но теперь я написал вам не общаться с тем, кто носит имя брата и при этом развратник, корыстолюбец, идолопоклонник, оскорбитель, пьяница или вымогатель. С таким человеком даже не ешьте вместе.
