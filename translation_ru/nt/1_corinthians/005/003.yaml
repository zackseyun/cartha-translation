source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: ru
  text: Ибо я, хотя и отсутствую телом, но присутствую духом[a], уже вынес решение[b], как если бы я присутствовал лично, о том, кто совершил это подобным образом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Духом» здесь, вероятнее всего, означает дух самого Павла, а не Святого Духа.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уже рассудил»; возможно также: «уже вынес приговор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: отсутствую телом
  rationale: Дательный отношения передан естественным русским оборотом; сохраняется краткий контраст с «присутствую духом» без намёка на смерть или отделение души от тела.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: но присутствую духом
  rationale: Безартиклевое πνεύματι в данном противопоставлении естественнее всего понимать как дух самого Павла. Формулировка сохраняет образ и не объясняет точный характер такого присутствия.
- source_word: ἤδη κέκρικα
  choice: уже вынес решение
  rationale: Перфект обозначает уже состоявшееся решение, сохраняющее силу. В контексте церковного разбирательства это по-русски естественнее, чем двусмысленное «осудил».
- source_word: ὡς παρὼν
  choice: словно находясь среди вас
  rationale: Передаёт сравнительную силу ὡς и подразумеваемое физическое присутствие Павла у коринфян; «среди вас» эксплицирует адресатную ситуацию без изменения смысла.
- source_word: τὸν ... κατεργασάμενον
  choice: о том, кто ... поступил
  rationale: Субстантивированное причастие передано без добавления слова «мужчина»; управление «вынес решение о том» создаёт естественную русскую конструкцию.
- source_word: οὕτως τοῦτο κατεργασάμενον
  choice: кто так поступил
  rationale: «Так» передаёт οὕτως, а глагол «поступил» в контексте отсылает к уже названному деянию (τοῦτο), избегая тяжёлого «совершил это таким образом».
- source_word: γάρ
  choice: ибо
  rationale: Сохраняет объяснительную связь с предыдущим высказыванием и соответствует достоинству библейского регистра.
- source_word: μὲν ... δὲ
  choice: хотя ... но
  rationale: Естественно передаёт уступительно-противительный контраст между телесным отсутствием и духовным присутствием.
theological_decisions:
- issue: Значение выражения «присутствую духом»
  choice: Сохранено как указание на духовное присутствие самого Павла при его физическом отсутствии.
  alternative: Понимать πνεύματι как Святого Духа либо как утверждение о более конкретном мистическом присутствии.
  rationale: Непосредственный контраст σώματι и πνεύματι вероятнее относится к телу и духу Павла. Перевод сохраняет богословскую напряжённость и не определяет механизм такого присутствия.
- issue: Характер κέκρικα
  choice: «уже вынес решение» — Павел сообщает о состоявшемся суждении по делу.
  alternative: «Уже осудил» или «уже произнёс приговор».
  rationale: Более сильные варианты могут преждевременно уточнить либо моральное осуждение, либо формально-судебный приговор; выбранная формулировка сохраняет широту κρίνω в дисциплинарном контексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет контраст и ход греческой мысли, но избегает неестественной кальки. Все сноски отмечены в основном тексте.
