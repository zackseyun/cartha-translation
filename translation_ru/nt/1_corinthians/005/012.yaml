  verdict: approve
  source_fidelity: Текст точно передаёт греческую риторическую конструкцию τί γὰρ μοι ... κρίνειν и сохраняет объяснительное «ибо». Противопоставление τοὺς ἔξω / τοὺς ἔσω передано ясно; «судите вы» удачно сохраняет акцентированное ὑμεῖς и не устраняет намеренную грамматико-контекстуальную неоднозначность между описанием и ожидаемой обязанностью.
  naturalness: «Ибо какое мне дело судить тех, кто вне церкви?» — естественная для современного литературного русского, краткая и риторически выразительная фраза. «Не тех ли, кто внутри, судите вы?» несколько книжно-инверсионно, но уместно в переводе апостольской аргументации и хорошо передаёт акцент оригинала.
  terminology: «Судить» последовательно передаёт κρίνειν / κρίνετε и не сужает его до частного юридического значения. Уточнение «вне церкви» оправдано непосредственным контекстом общинной дисциплины; сноска корректно поясняет, что исходные выражения имеют образ «снаружи/внутри» и относятся к общине.
