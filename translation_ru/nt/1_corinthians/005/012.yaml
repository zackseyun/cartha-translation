  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: ru
  text: Ибо какое мне дело судить тех, кто вне церкви? Не тех ли, кто внутри, судите вы?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех, кто снаружи» и «тех, кто внутри»; речь идёт о находящихся вне церковной общины и принадлежащих к ней.'
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι ... κρίνειν
  choice: Ибо какое мне дело судить
  rationale: Греческая идиома спрашивает, какое отношение это имеет к говорящему или входит ли это в круг его забот. Русское «какое мне дело» естественно передаёт риторический вопрос, а «ибо» сохраняет объяснительное γάρ.
- source_word: τοὺς ἔξω
  choice: тех, кто вне церкви
  rationale: Субстантивированное ἔξω обозначает людей вне христианской общины. Уточнение «церкви» делает общественный, а не пространственный смысл ясным современному читателю.
- source_word: κρίνειν / κρίνετε
  choice: судить / судите
  rationale: κρίνω в контексте обозначает вынесение суждения, связанное с общинной дисциплиной. Единый русский корень сохраняет лексическую связь обеих частей стиха.
- source_word: οὐχὶ
  choice: Не ... ли
  rationale: οὐχί вводит риторический вопрос, предполагающий утвердительный ответ; русская конструкция «не ... ли» сохраняет эту форму.
- source_word: τοὺς ἔσω
  choice: тех, кто внутри
  rationale: Выражение обозначает находящихся внутри христианской общины и сохраняет пространственную метафору, противопоставленную «тем, кто вне».
- source_word: ὑμεῖς κρίνετε
  choice: судите вы
  rationale: Сохранён формально изъявительный глагол и выраженное, акцентированное местоимение ὑμεῖς. Контекст допускает оттенок обязанности, но перевод не превращает его однозначно в предписание.
theological_decisions:
- issue: Относится ли противопоставление к церковной дисциплине или ко всякому нравственному суждению
  choice: Передать границу между находящимися вне церкви и внутри неё, не расширяя утверждение за пределы общинного контекста
  alternative: Понять стих как общее разрешение или запрещение любого нравственного суда
  rationale: Контекст 1 Кор 5:9–13 посвящён ответственности общины в отношении своих членов. Формулировка сохраняет это противопоставление, не добавляя более широкого доктринального тезиса.
- issue: Имеет ли ὑμεῖς κρίνετε описательный или обязывающий смысл
  choice: «судите вы»
  alternative: «вы должны судить»
  rationale: Настоящее изъявительное в риторическом вопросе может подразумевать обязанность, однако грамматически прямо её не выражает. Более формальный вариант сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, риторически выразительной формой. «Какое мне дело» звучит естественно и достойно; инверсия «судите вы» передаёт акцент на ὑμεῖς. Маркер сноски помещён после всего стиха.
