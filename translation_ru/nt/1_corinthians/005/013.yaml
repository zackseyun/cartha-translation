lexical_decisions:
- source_word: τοὺς δὲ ἔξω
  choice: А тех, кто вне общины
  rationale: Субстантивированное наречие обозначает людей вне христианской общины. Добавление «общины» естественно проясняет подразумеваемую соотнесённость, не превращая выражение в специальный церковный термин; союз «а» передаёт мягкое противопоставление предыдущему высказыванию о тех, кто внутри.
- source_word: ὁ θεὸς κρίνει
  choice: судит Бог
  rationale: Настоящее время κρίνει сохранено как общее утверждение о Божьем суде; порядок слов с «Бог» в конце естественно выделяет того, кому принадлежит этот суд.
- source_word: ἐξάρατε
  choice: Удалите
  rationale: Аористный императив требует решительного действия. «Удалите» ясно передаёт исключение из среды общины, не добавляя позднейшей дисциплинарной терминологии.
- source_word: τὸν πονηρὸν
  choice: злого человека
  rationale: Субстантивированное прилагательное мужского рода указывает на конкретного виновного мужчину из контекста. «Злого человека» звучит по-русски естественно и сохраняет нравственную характеристику, не сводя её к абстрактному «злу».
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: из своей среды
  rationale: Русский оборот естественно передаёт удаление человека из самой общины; возвратное «своей» сохраняет усилительный смысл αὐτῶν без тяжеловесного буквализма «из вас самих».
theological_decisions:
- issue: Характер повеления об общинной дисциплине
  choice: Повеление относится к удалению конкретного виновного человека из среды общины, тогда как суд над находящимися вне её оставлен Богу.
  alternative: Формулу можно понимать шире — как общее требование устранять зло из сообщества без прямого указания на формальное исключение.
  rationale: Контекст 1 Кор 5 противопоставляет ответственность общины по отношению к своим членам Божьему суду над внешними и говорит о конкретном нарушителе. Перевод передаёт исключение из общины, но не вводит отсутствующих в греческом тексте позднейших процедурных понятий.
- issue: Временная отнесённость Божьего суда
  choice: 'Настоящее время: «судит Бог».'
  alternative: 'Будущее время: «будет судить Бог».'
  rationale: Форма κρίνει является настоящим временем и естественно выражает постоянную прерогативу Бога. Контекст допускает эсхатологический оттенок, но не требует заменять грамматическое настоящее будущим.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. «Вне общины» проясняет контекст без конфессионально окрашенного «вне церкви»; «из своей среды» сохраняет общинный смысл и звучит естественно.
