reference: 1 Corinthians 5:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: ru
  text: Итак, будем праздновать[a] не со старой закваской и не с закваской злобы и порочности, а с опресноками[b] искренности и истины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем совершать праздник». Греческое слово продолжает пасхально-праздничный образ предыдущего стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с пресными хлебами». По-гречески буквально: «с пресными [вещами]»; в пасхальном контексте подразумевается пресный хлеб.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка способом.
- source_word: ἑορτάζωμεν
  choice: будем праздновать
  rationale: Увещательный конъюнктив передан побудительной формой первого лица множественного числа; глагол сохраняет образ праздника из ближайшего контекста.
- source_word: ζύμῃ παλαιᾷ
  choice: со старой закваской
  rationale: «Закваска» буквально и узнаваемо сохраняет пасхальный образ; предлог «с» естественнее русского буквального «в».
- source_word: κακίας καὶ πονηρίας
  choice: злобы и порочности
  rationale: «Злоба» передаёт злонамеренность κακία, а «порочность» — нравственное зло πονηρία, не сливая два понятия.
- source_word: ἀζύμοις
  choice: с опресноками
  rationale: Субстантивированное прилагательное во множественном числе передано традиционным, но понятным названием пресного хлеба, без необходимости добавлять отсутствующее существительное.
- source_word: εἰλικρινείας καὶ ἀληθείας
  choice: искренности и истины
  rationale: Сохраняет сочетание неподдельной чистоты намерений и истины, а также родительную конструкцию образного выражения.
theological_decisions:
- issue: Пасхально-праздничный образ в увещании Павла
  choice: Сохранить слова «праздновать», «закваска» и «опресноки» как единый образ.
  alternative: 'Передать всё как общее нравственное увещание: «будем жить в искренности и истине».'
  rationale: В непосредственном контексте упомянут пасхальный Агнец (ст. 7), поэтому устранение праздничной и пасхальной образности ослабило бы ход мысли Павла. При этом перевод не решает, подразумевает ли он буквальное соблюдение праздника или использует продолженную метафору.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской пасхальной образности. «Опресноки» — несколько традиционное, но точное и широко узнаваемое слово; сноска даёт прозрачный современный эквивалент.
