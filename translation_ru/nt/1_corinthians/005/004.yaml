lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: во имя
  rationale: Устойчивое библейское выражение сохраняет форму греческого оборота и допускает присущий ему смысл действия под властью и полномочием Иисуса.
- source_word: κυρίου
  choice: Господа
  rationale: «Господь» естественно передаёт новозаветный титул κύριος и сохраняет его христологическую весомость.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Имя передано в принятой русской библейской форме.
- source_word: συναχθέντων ὑμῶν
  choice: когда вы соберётесь
  rationale: Независимый родительный оборот с аористным страдательным причастием естественно передан временным придаточным; русский возвратный глагол не навязывает внешнего деятеля.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: мой дух будет с вами
  rationale: В сжатой греческой конструкции сказуемое подразумевается. Добавление «будет с вами» ясно выражает неб телесное участие Павла, не определяя его природу.
- source_word: σὺν τῇ δυνάμει
  choice: вместе с силой
  rationale: Передаёт значение сопровождения у σύν и сохраняет δύναμις как действенную силу, а не сводит её лишь к формальному полномочию.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: нашего Господа Иисуса
  rationale: Родительный падеж сохранён, благодаря чему остаётся открытым точный оттенок принадлежности или источника силы.
theological_decisions:
- issue: Характер присутствия Павла в собрании
  choice: «мой дух будет с вами» — реальное, но не телесное участие Павла без объяснения его механизма
  alternative: Понимать «дух» только как настрой или намерение Павла либо как указание на определённый вид мистического присутствия
  rationale: Текст утверждает участие Павла в духе, однако не разъясняет его метафизическую природу; перевод сохраняет это напряжение.
- issue: Связь выражения «вместе с силой нашего Господа Иисуса» с окружающими частями предложения
  choice: Сохранить присоединительную формулировку без жёсткого синтаксического разрешения
  alternative: Однозначно связать силу либо с собранием, либо с последующим действием «предать» в стихе 5
  rationale: Греческий порядок слов допускает различное синтаксическое членение, а данный стих представляет собой незавершённую часть более длинного предложения.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского регистра. Поскольку стих 4 синтаксически продолжается в стихе 5, в конце оставлена запятая. Формулировка не устраняет намеренно сохранённую в греческом тексте неоднозначность связей между собранием, духом Павла и силой Господа.
