base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: ru
  text: Удалите старую закваску[a], чтобы вы были новой массой теста, ведь вы бесквасны. Ведь Мессия, наш пасхальный агнец[b], принесён в жертву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Закваска здесь продолжает образ предыдущих стихов: небольшое количество закваски воздействует на всё тесто.'
    reason: metaphor_clarification
  - marker: b
    text: 'Буквально: «наша Пасха». Греческое слово может обозначать праздник, пасхальную трапезу или пасхальную жертву; глагол «принесён в жертву» указывает здесь на пасхального агнца или пасхальную жертву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: Удалите
  rationale: Аорист, действительный залог, повелительное наклонение, 2-е лицо множественного числа; глагол требует решительного и полного устранения. «Удалите» естественно по-русски и не добавляет отсутствующего в греческом возвратного значения.
- source_word: τὴν παλαιὰν ζύμην
  choice: старую закваску
  rationale: «Закваска» сохраняет буквальный образ брожения, связь с опресноками и метафору распространяющегося разложения; «старая» точно передаёт παλαιά.
- source_word: ἵνα ἦτε νέον φύραμα
  choice: чтобы стать новым тестом
  rationale: ἵνα с сослагательным наклонением выражает цель или предполагаемый результат. Русское «стать» естественно передаёт призыв к фактическому обновлению, а «тесто» ясно сохраняет хлебный образ φύραμα.
- source_word: καθώς ἐστε ἄζυμοι
  choice: как вы и есть бесквасные
  rationale: Сохраняется намеренное напряжение между повелением стать новым тестом и уже существующим положением адресатов. «Бесквасные» необычно, но понятно в развёрнутой метафоре и не устраняет её толкованием.
- source_word: τὸ πάσχα ἡμῶν
  choice: наш пасхальный агнец
  rationale: Буквально греческий текст говорит «наша Пасха», однако сочетание с θύω указывает на пасхальную жертву, то есть агнца. «Пасхальный агнец» делает подразумеваемый жертвенный образ ясным; буквальная форма отмечена в сноске.
- source_word: ἐτύθη
  choice: принесён в жертву
  rationale: Аорист пассивного залога от θύω обозначает заклание в жертву. Эта формулировка передаёт именно жертвенный смысл, а мужской род согласован с явным субъектом «Мессия».
- source_word: Χριστός
  choice: Мессия
  rationale: В пасхальном контексте Χριστός сохраняет отчётливую функцию титула, поэтому передано как «Мессия», а не как ставшее именеподобным «Христос».
theological_decisions:
- issue: Соотношение призыва к очищению и уже имеющегося статуса общины
  choice: «чтобы стать новым тестом, как вы и есть бесквасные»
  alternative: «чтобы быть новым тестом, поскольку вы бесквасны»
  rationale: Выбранная формулировка не сглаживает напряжение между нравственным призывом и данным общине положением, присутствующее в ἵνα ἦτε ... καθώς ἐστε.
- issue: Передача τὸ πάσχα ἡμῶν применительно к Мессии
  choice: «наш пасхальный агнец»
  alternative: «наша Пасха» / «наша пасхальная жертва»
  rationale: Контекст жертвенного заклания позволяет раскрыть подразумеваемого пасхального агнца, но буквальная широта слова πάσχα сохранена в примечании, чтобы не представить уточнение как прямо выраженное существительное.
- issue: Передача титула Χριστός
  choice: «Мессия»
  alternative: «Христос»
  rationale: Здесь пасхальная типология подчёркивает титульный смысл слова; «Мессия» делает его явным без внесения конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением развёрнутой хлебной и пасхальной образности. «Бесквасные» намеренно оставлено как метафорическое обозначение людей, а «агнец» выбрано вместо разговорного «ягнёнок» ради жертвенного контекста и достойного библейского регистра.
