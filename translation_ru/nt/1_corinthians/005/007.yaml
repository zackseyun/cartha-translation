review_pass:
  verdict: revise
  source_fidelity: 'Основная образность и жертвенное значение θύω переданы верно. Однако «чтобы стать» несколько сужает настоящее сослагательное ἦτε («чтобы вы были»), а «как вы и есть бесквасные» неестественно и грамматически тяжеловесно для современного литературного русского. Связка καθώς в данном контексте естественно передаётся причинно-пояснительным «ведь»: повеление не отменяет уже данного статуса адресатов.'
  naturalness: «Удалите старую закваску» и «пасхальный агнец» понятны и соответствуют высокому, но современному библейскому регистру. Форму «бесквасные» лучше заменить кратким сказуемым «бесквасны»; это естественнее в метафорическом высказывании. «Новой массой теста» точнее для φύραμα и менее двусмысленно, чем «новым тестом».
  terminology: «Закваска», «бесквасны», «пасхальный агнец», «принесён в жертву» и «Мессия» последовательно сохраняют хлебно-пасхальную и жертвенную образность. «Пасхальный агнец» является контекстуально оправданным раскрытием τὸ πάσχα ἡμῶν; сноска должна сохранить буквальное «наша Пасха» и варианты значения.
  issues:
