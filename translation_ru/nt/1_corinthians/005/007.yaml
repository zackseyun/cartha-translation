  - severity: low
    issue: «чтобы стать новым тестом»
    rationale: Греческое ἦτε — настоящее сослагательное глагола «быть». «Чтобы вы были» ближе к форме оригинала; значение обновления уже выражено устранением старой закваски и определением «новой».
