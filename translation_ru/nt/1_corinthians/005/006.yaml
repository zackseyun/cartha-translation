lexical_decisions:
- source_word: καλὸν
  choice: нехороша
  rationale: В данном контексте καλός выражает отрицательную нравственно-практическую оценку. «Нехороша» прямо передаёт упрёк и сохраняет сжатость греческой фразы.
- source_word: καύχημα
  choice: похвальба
  rationale: Существительное обозначает хвастовство или предмет похвальбы. «Похвальба» сохраняет именную конструкцию оригинала и уместна в строгом обличительном контексте.
- source_word: οὐκ οἴδατε
  choice: Разве вы не знаете
  rationale: Риторическая формула передана естественным русским вопросом, сохраняющим значение знания и обличительный тон Павла.
- source_word: μικρὰ ζύμη
  choice: малая закваска
  rationale: «Закваска» точнее современного «дрожжи» передаёт древний образ перебродившего теста и сохраняет библейскую метафору; «малая» подчёркивает незначительное количество.
- source_word: ὅλον τὸ φύραμα
  choice: всё тесто
  rationale: φύραμα здесь означает замешанную массу теста, а ὅλον подчёркивает её целиком. «Всё тесто» ясно и естественно для современного читателя.
- source_word: ζυμοῖ
  choice: заквашивает
  rationale: Глагол однокоренной с ζύμη; «заквашивает» сохраняет эту связь и действие образа.
theological_decisions:
- issue: Метафорический образ закваски
  choice: Сохранить образ без пояснения его нравственного значения внутри текста стиха.
  alternative: Развернуть смысл как «малый грех портит всю общину».
  rationale: Павел приводит образное общеизвестное изречение, а его применение раскрывается контекстом. Поясняющая замена устранила бы образ и сузила возможные оттенки смысла.
translation_notes:
  register: Современный литературный русский язык с краткой, несколько торжественной обличительной интонацией. Сохранены риторический вопрос, параллелизм «закваска — заквашивает» и сжатость исходного изречения.
