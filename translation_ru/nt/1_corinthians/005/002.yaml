  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: ru
  text: А вы надменны! Разве не следовало вам, напротив, скорбеть, чтобы тот, кто совершил такой поступок, был удалён из вашей среды[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был взят из вашей среды». В данном контексте, вероятнее всего, имеется в виду удаление из общины как мера дисциплины.'
    reason: Лексическая альтернатива и сохранение некоторой неоднозначности пассивного ἀρθῇ.
lexical_decisions:
- source_word: πεφυσιωμένοι ἐστέ
  choice: возгордились
  rationale: Греческое выражение буквально рисует образ «надувшихся» и обозначает укоренившееся состояние гордости. «Возгордились» естественно и достойно передаёт упрёк, хотя образ не сохраняет буквально.
- source_word: οὐχὶ μᾶλλον
  choice: разве не следовало вам, напротив
  rationale: Передаёт риторический вопрос с ожидаемым утвердительным ответом и подчёркивает контраст между гордостью коринфян и подобающей скорбью.
- source_word: ἐπενθήσατε
  choice: скорбеть
  rationale: Глагол выражает сильную скорбь, сходную с трауром. «Скорбеть» сохраняет интенсивность и не требует добавлять отсутствующий в греческом тексте прямой объект.
- source_word: ἵνα ἀρθῇ
  choice: чтобы ... был удалён
  rationale: Сохраняет целевое или результативное значение ἵνα с сослагательным наклонением и пассивную форму, не уточняя прямо, кем совершается удаление.
- source_word: ἐκ μέσου ὑμῶν
  choice: из вашей среды
  rationale: Естественный современный русский эквивалент идиомы, сохраняющий её общинный смысл.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: тот, кто совершил такой поступок
  rationale: Передаёт субстантивированное причастие и серьёзность ἔργον; «такой поступок» естественно отсылает к деянию, названному в предыдущем стихе.
theological_decisions:
- issue: Характер требуемого действия в отношении согрешившего
  choice: был удалён из вашей среды
  alternative: был взят из вашей среды; был отлучён от общины; был устранён Богом
  rationale: Пассивная форма ἀρθῇ сама по себе не называет действующее лицо и допускает более общее понимание. Ближайший контекст (ст. 3–5, 13) указывает прежде всего на исключение из общины, однако перевод не вводит специальный церковно-правовой термин и не исключает полностью иной оттенок.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским звучанием. Восклицание после первой фразы естественно передаёт резкий упрёк Павла; последующий риторический вопрос сохраняет структуру и напряжение греческого текста. Маркер сноски помещён непосредственно после спорного выражения об удалении.
