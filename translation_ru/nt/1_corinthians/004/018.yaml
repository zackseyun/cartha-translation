  text: ὡς μὴ ἐρχομένου δέ μου πρὸς ὑμᾶς ἐφυσιώθησάν τινες·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: ru
  text: Некоторые возгордились[a][b], словно я не приду к вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Некоторые стали высокомерны, словно я не приду к вам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «надулись». Павел неоднократно использует в 1 Коринфянам этот образ самодовольной гордости; ср. 1 Кор. 4:6, 19; 5:2; 8:1; 13:4.'
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: словно
  rationale: 'Передаёт сравнительно-предположительное значение: поведение некоторых основано на ошибочном предположении.'
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: я не приду к вам
  rationale: Зависимая от ὡς конструкция обозначает предполагаемую, а не утверждаемую ситуацию; по-русски естественно передаётся личным придаточным с будущим временем.
- source_word: δέ
  choice: не выражено отдельно
  rationale: Слабо выраженная связка с предшествующей мыслью; в русском течение речи сохраняется без отдельного союза.
- source_word: ἐφυσιώθησάν
  choice: возгордились
  rationale: Естественный современный русский эквивалент, обозначающий переход к состоянию надменной самоуверенности; образ раздувания поясняется в сноске.
- source_word: τινες
  choice: некоторые
  rationale: Точно и естественно обозначает часть людей в коринфской общине.
theological_decisions:
- issue: Передача упрёка Павла в гордости
  choice: «возгордились» в тексте с пояснением буквального образа в сноске
  alternative: «напыжились» или «раздулись от гордости»
  rationale: Так сохраняется смысл упрёка на естественном и достойном современном русском языке, а повторяющийся у Павла образ не теряется благодаря сноске.
translation_notes:
  register: Современный литературный русский; краткая, ясная и достойная формулировка. Порядок сносок соответствует порядку маркеров в основном тексте.
