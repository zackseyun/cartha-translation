source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: ru
  text: Вы уже сыты, уже разбогатели, без нас стали царствовать! О, если бы вы и в самом деле царствовали, чтобы и мы царствовали вместе с вами.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Павел говорит иронически: коринфяне ведут себя так, словно уже достигли полноты, разбогатели и царствуют. Вместе с тем его пожелание может выражать и искреннее желание, чтобы их царствование стало действительностью и апостолы разделили его с ними.'
    reason: Риторическая заметка поясняет иронию, не навязывая однозначного истолкования пожелания.
lexical_decisions:
- source_word: ἤδη
  choice: уже
  rationale: Сохраняет повтор и резкий иронический акцент в начале первых двух фраз.
- source_word: κεκορεσμένοι ἐστέ
  choice: вы уже сыты
  rationale: Перифрастический перфект обозначает достигнутое состояние насыщения; краткое русское выражение естественно передаёт и результат, и иронию.
- source_word: ἐπλουτήσατε
  choice: уже разбогатели
  rationale: Глагольная форма «разбогатели» сохраняет значение обретения богатства, а не просто обладания им.
- source_word: χωρὶς ἡμῶν
  choice: без нас
  rationale: Прямо и естественно передаёт независимость коринфян от апостолов, подразумеваемую в укоре.
- source_word: ἐβασιλεύσατε
  choice: стали царствовать / царствовали
  rationale: Сохраняет царскую образность глагола βασιλεύω. В первой фразе «стали царствовать» передаёт заявленное наступление состояния, а в пожелании «царствовали» естественно звучит после «если бы» без добавления отсутствующего в греческом начинательного оттенка.
- source_word: ὄφελόν γε
  choice: И если бы вы и в самом деле царствовали
  rationale: Конструкция с «если бы» естественно выражает нереальное пожелание, а «и в самом деле» передаёт усилительную частицу γε и противопоставляет действительность ироническому притязанию.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель или желаемое следствие без искусственного уточнения отношения между ними.
- source_word: συμβασιλεύσωμεν
  choice: и нам царствовать вместе с вами
  rationale: Сохраняет совместность, выраженную приставкой συν-, и ту же царскую метафору.
theological_decisions:
- issue: Ирония первых трёх утверждений
  choice: Сохранить их как резкие иронические восклицания, не вставляя объяснение в основной текст.
  alternative: Передать как буквальную похвалу или прямо добавить слова «вы думаете, что».
  rationale: Контекст 1 Кор 4:7–13 указывает на иронию, однако грамматически Павел формулирует утверждения прямо; восклицательный знак и примечание передают тон, не переписывая высказывание.
- issue: Характер пожелания ὄφελόν γε
  choice: Сохранить сочетание иронического укора с возможным искренним желанием их подлинного царствования.
  alternative: Истолковать пожелание исключительно как сарказм либо исключительно как прямое эсхатологическое утверждение.
  rationale: Форма выражает нереальное пожелание, а контекст допускает одновременно иронию и подлинное стремление Павла разделить с ними царствование; перевод не разрешает эту напряжённость однозначно.
- issue: Образ царствования
  choice: Использовать «царствовать» и не заменять образ общим «добиться успеха» или «править».
  alternative: Передать как обретение влияния, власти или высокого положения.
  rationale: βασιλεύω и συμβασιλεύω явно относятся к царствованию; сохранение образа важно для риторического и возможного эсхатологического смысла.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным синтаксисом. Повтор «уже» и восклицание воспроизводят риторический напор; «царствовать» сохраняет возвышенную царскую метафору, оставаясь понятным обычному читателю.
