  source_fidelity: 'Основной смысл передан верно: повтор «уже», насыщение, обогащение, независимое от апостолов «царствование» и совместное царствование сохранены. Однако «И если бы вы…» в русском языке выглядит как незавершённое условное предложение, тогда как ὄφελόν γε выражает самостоятельное эмоциональное пожелание.'
  naturalness: Начальные короткие фразы звучат естественно и выразительно. Формулу пожелания следует заменить на самостоятельную русскую конструкцию «О, если бы…», а зависимое «чтобы и нам царствовать» — на личную форму «чтобы и мы царствовали», что делает синтаксис яснее и естественнее.
  terminology: «Царствовать» удачно сохраняет βασιλεύω и συμβασιλεύω; «вместе с вами» точно передаёт συν-. «Сыты» и «разбогатели» соответствуют исходному тексту и современному литературному регистру.
