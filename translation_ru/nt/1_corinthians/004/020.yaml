source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: ru
  text: Ведь Царство Божье — не в словах[a], а в силе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не в речи»; смысл может указывать на одни лишь слова, противопоставленные действенной силе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь ... не
  rationale: γάρ связывает стих с предшествующей мыслью и указывает на основание сказанного; «ведь» естественно передаёт эту пояснительно-причинную связь, а οὐ выражено отрицанием «не».
- source_word: ἐν λόγῳ
  choice: в словах
  rationale: λόγος здесь может означать слово, речь или разговор. Русское множественное число «в словах» естественно выражает противопоставление словесных заявлений действенной силе, не сужая смысл до ораторского искусства.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся и понятное русское соответствие, сохраняющее смысл как Божьего царствования, так и Его царства, без неоправданного выбора только одного оттенка.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: а в силе
  rationale: δύναμις обычно означает силу или могущество; «в силе» сохраняет краткую и резкую антитезу λόγῳ и не уточняет сверх текста характер этой силы.
theological_decisions:
- issue: Характер противопоставления «слов» и «силы»
  choice: Сохранено широкое противопоставление словесных заявлений действенной силе Божьего Царства.
  alternative: Понимать силу исключительно как чудеса, нравственное преображение, церковное взыскание, апостольскую власть или действие Духа в узком смысле.
  rationale: Греческий текст не уточняет здесь конкретное проявление δύναμις, поэтому перевод не должен устранять эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой оригинала. Тире естественно оформляет именное высказывание и подчёркивает антитезу. «Божье» выбрано как современная литературная форма; стиль остаётся dignified и общепонятным.
