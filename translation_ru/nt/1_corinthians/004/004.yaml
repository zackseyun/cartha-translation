  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: ru
  text: Ведь я ни в чём не сознаю за собой вины[a], но этим я не оправдан[b]; Тот, кто исследует меня, — Господь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я ничего за собой не знаю»; «моя совесть ни в чём меня не обвиняет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но этим я не признан невиновным»; «но это не доказывает, что я прав». Греческое слово имеет судебный смысл и также употребляется Павлом в значении «оправдывать».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «судит меня»; «оценивает меня». Греческий глагол может обозначать рассмотрение, исследование или судебную оценку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: Ведь я ни в чём не сознаю за собой вины
  rationale: Оборот σύνοιδα с дательным ἐμαυτῷ выражает осознание чего-либо за собой, особенно в нравственно-судебном контексте. «Не сознаю за собой вины» естественно по-русски передаёт подразумеваемое обвинение, а сноска сохраняет более буквальные варианты.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ
  choice: но этим я ещё не
  rationale: 'ἐν τούτῳ указывает на основание вывода: отсутствие осознаваемой вины само по себе не обеспечивает оправдательного решения. Частица «ещё» здесь имеет усилительно-ограничительный смысл («одного этого недостаточно»), не временной.'
- source_word: δεδικαίωμαι
  choice: оправдан
  rationale: Перфект страдательного залога от δικαιόω имеет судебный оттенок. «Оправдан» сохраняет и юридический смысл, и характерную для Павла лексику, не сводя её только к субъективному чувству невиновности.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: судит же меня
  rationale: ἀνακρίνω в данном контексте означает подвергать рассмотрению и давать оценку в судебном ключе. «Судит» естественно связывает фразу с темой суда в контексте, а сноска отмечает возможные оттенки исследования и оценки.
- source_word: κύριός
  choice: Господь
  rationale: Определённый и узнаваемый титул передан традиционным русским эквивалентом без добавления имени, которого нет в греческом тексте.
theological_decisions:
- issue: Судебный смысл δεδικαίωμαι и связь с самооценкой Павла
  choice: «но этим я ещё не оправдан»
  alternative: «но это не доказывает моей невиновности»; «но этим я не признан правым»
  rationale: 'Формулировка сохраняет судебную силу δικαιόω и богословское напряжение: чистая совесть Павла не равнозначна окончательному оправдательному решению. При этом стих не превращён в самостоятельное систематическое высказывание об оправдании.'
- issue: Значение ἀνακρίνων
  choice: «судит же меня»
  alternative: «исследует меня»; «оценивает меня»
  rationale: Ближайший контекст говорит об оценке и суде. «Судит» передаёт судебно-оценочный смысл, но в сноске сохранена неоднозначность между исследованием, оценкой и вынесением суждения.
- issue: Личность κύριος
  choice: «Господь» без уточнения
  alternative: «Господь Иисус»
  rationale: Хотя в контексте Павла может подразумеваться Христос, греческий текст данного стиха не называет его прямо; перевод не добавляет отсутствующего уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Сознаю за собой вину» передаёт идиому естественно, а «оправдан» сохраняет ключевой судебно-богословский термин. Порядок второй части слегка приближен к русской норме, при этом противопоставление и акцент на Господе сохранены.
