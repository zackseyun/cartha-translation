id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: ru
  text: Итак, не судите ни о чём прежде времени[a], пока не придёт Господь. Он выведет на свет сокрытое во тьме и обнаружит намерения сердец[b]. И тогда каждый получит похвалу от Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раньше надлежащего срока», «преждевременно». Греческое выражение указывает на суждение до наступления подходящего времени.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «замыслы сердец», «побуждения сердец».'
    reason: lexical_alternative
  - marker: c
    text: То есть похвала, исходящая от Бога при окончательной оценке, когда Господь придёт и откроет скрытое.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка союзом.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: не судите ни о чём прежде времени
  rationale: Сохраняет широкий охват τι и временное ограничение πρὸ καιροῦ, не добавляя отсутствующего в греческом тексте слова «назначенного».
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: пока не придёт Господь
  rationale: Естественно выражает временной предел запрета; титул κύριος передан традиционным «Господь» без поясняющей вставки.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: выведет на свет сокрытое во тьме
  rationale: Передаёт метафору раскрытия тайного и сохраняет образ света и тьмы; «во тьме» естественно по-русски и не устраняет возможный оттенок принадлежности тьме.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: обнаружит намерения сердец
  rationale: «Намерения» охватывает внутренние замыслы и цели βουλαί, не сводя их только к психологическим мотивам; множественное число «сердец» сохранено.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: каждый получит похвалу от Бога
  rationale: Идиоматично передаёт, что похвала достанется каждому от Бога, сохраняя распределительное ἑκάστῳ и источник ἀπὸ τοῦ θεοῦ.
theological_decisions:
- issue: Предел и характер суда
  choice: Запрет сформулирован широко, но ограничен временем до прихода Господа и окончательного раскрытия скрытого.
  alternative: Понимать стих как безусловный запрет любого человеческого суждения либо только как запрет оценки апостольских служителей.
  rationale: Текст непосредственно связывает запрет с преждевременностью суда и будущим приходом Господа; перевод не сужает и не расширяет эту формулировку.
- issue: Кого обозначает «Господь»
  choice: Сохранён титул «Господь», который в данном эсхатологическом контексте естественно относится к Иисусу.
  alternative: Явно заменить титул именем «Иисус» либо понимать его как неопределённое указание на Бога.
  rationale: Греческий текст даёт титул ὁ κύριος, а не имя; его сохранение передаёт христологический смысл, не делая скрытого пояснения частью основного текста.
- issue: Похвала каждому
  choice: Сохранено положительное слово «похвала» и распределительное «каждый».
  alternative: Передать как нейтральное «воздаяние» или подразумевать, что похвалу получат лишь некоторые.
  rationale: ἔπαινος означает именно похвалу; перевод не заменяет её более общим понятием и не разрешает за автора возможное напряжение формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис разделён на три предложения для ясности; образы света, тьмы и сердца сохранены. Все маркеры сносок размещены в основном тексте.
