  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: ru
  text: Ибо, хотя у вас и десять тысяч[a] воспитателей[b] в Мессии, отцов у вас немного; ведь в Мессии Иисусе через Благую весть[d] я стал вашим отцом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесчисленное множество»; греческое слово буквально означает «десять тысяч», но может обозначать просто чрезвычайно большое число.'
    reason: lexical_alternative
  - marker: b
    text: То есть людей, надзирающих за воспитанием ребёнка. Греческое слово обозначает не столько школьного учителя, сколько сопровождавшего ребёнка воспитателя и надзирателя.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «я породил вас» или «я родил вас». Это метафора: через проповедь Благой вести Павел привёл коринфян к вере.'
    reason: lexical_alternative
  - marker: d
    text: Греческое εὐαγγέλιον можно также перевести как «Евангелие» или «добрая весть».
    reason: lexical_alternative
lexical_decisions:
- source_word: μυρίους
  choice: десять тысяч
  rationale: Сохраняет конкретный греческий образ и его риторическую гиперболу; примечание указывает на возможное идиоматическое значение очень большого числа.
- source_word: παιδαγωγοὺς
  choice: воспитателей
  rationale: В греко-римской среде παιδαγωγός надзирал за ребёнком и отвечал за его воспитание и дисциплину; русское «воспитатель» передаёт эту роль точнее, чем современное «учитель».
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии / в Мессии Иисусе
  rationale: Χριστός передан как титул «Мессия», а предлог ἐν сохранён, чтобы не устранять характерную для Павла смысловую ёмкость выражения.
- source_word: πατέρας
  choice: отцов
  rationale: Прямо сохраняет родительскую метафору без пояснительного добавления «духовных».
- source_word: διὰ τοῦ εὐαγγελίου
  choice: через Благую Весть
  rationale: 'διά с родительным падежом обозначает средство: Благая Весть была тем, посредством чего коринфяне были приведены к новой жизни.'
- source_word: ἐγέννησα
  choice: я родил вас
  rationale: Буквально и выразительно сохраняет метафору рождения, связывающую этот глагол с предшествующим словом «отцов», не подменяя её толкованием.
theological_decisions:
- issue: Отцовская метафора Павла и его роль в обращении коринфян
  choice: «я родил вас»
  alternative: «я стал вашим отцом» / «я стал вашим духовным отцом»
  rationale: Выбранная формулировка сохраняет намеренно сильную метафору оригинала и указывает на роль Павла через Благую Весть, не вводя дополнительных сакраментальных, иерархических или конфессиональных смыслов.
- issue: Значение выражения ἐν Χριστῷ
  choice: Сохранить «в Мессии»
  alternative: Истолковать как «благодаря Мессии» или «принадлежа Мессии»
  rationale: Буквальная предложная конструкция сохраняет многозначность павловского выражения — сферу, связь и единение — вместо выбора только одного толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксис следует аргументации оригинала, а сильная метафора «я родил вас» намеренно сохранена. «Воспитатели» выбрано вместо анахронично узкого «учителя».
