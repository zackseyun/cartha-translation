  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: ru
  text: Чего вы хотите? Прийти мне к вам с жезлом или с любовью и духом кротости?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с любовью и кротостью духа». Выражение может описывать кроткий внутренний настрой Павла; некоторые видят здесь также указание на действие Святого Духа.'
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: Чего вы хотите?
  rationale: Прямой риторический вопрос сохраняет силу греческого выражения и естественно звучит по-русски.
- source_word: ἐν ῥάβδῳ
  choice: с розгой
  rationale: «Розга» сохраняет буквальный образ орудия наказания и его дисциплинарную остроту; отвлечённое «со строгостью» чрезмерно истолковало бы метафору.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: Прийти мне к вам
  rationale: Такая форма естественно передаёт совещательный аорист сослагательного наклонения внутри вопроса.
- source_word: ἐν ἀγάπῃ
  choice: с любовью
  rationale: Предлог передан инструментально и параллельно выражению «с розгой»; ἀγάπη переведено обычным словом «любовь».
- source_word: πνεύματί τε πραΰτητος
  choice: и духом кротости
  rationale: Перевод сохраняет πνεῦμα и родительную конструкцию πραΰτητος, не сводя выражение только к абстрактной «кротости».
theological_decisions:
- issue: Значение πνεύματι в выражении πνεύματί τε πραΰτητος
  choice: «духом кротости» — прежде всего образ внутреннего настроя и манеры Павла
  alternative: «Духом кротости» — подразумеваемое указание на действие Святого Духа
  rationale: 'Непосредственный контраст касается двух способов прихода Павла: с наказанием либо с любовью и кротким настроем. Отсутствие артикля и контекст не требуют прямого отнесения к Святому Духу, но формулировка сохраняет исходную неоднозначность.'
translation_notes:
  register: Современный литературный русский язык; краткий, риторически острый вопрос. «Розга» сохраняет конкретность метафоры, а «дух кротости» — неоднозначность исходного выражения.
