lexical_decisions:
- source_word: παρακαλῶ
  choice: умоляю
  rationale: В данном увещательном контексте глагол передаёт настойчивую личную просьбу. «Умоляю» сохраняет силу обращения Павла и естественно звучит по-русски.
- source_word: οὖν
  choice: поэтому
  rationale: Союз обозначает вывод из предшествующего рассуждения; «поэтому» ясно передаёт логическую связь.
- source_word: ὑμᾶς
  choice: вас
  rationale: Прямое дополнение во множественном числе, естественно переданное русским «вас».
- source_word: μιμηταί
  choice: подражайте
  rationale: Существительное μιμηταί означает тех, кто подражает чьему-либо образцу. В сочетании с γίνεσθε русская глагольная конструкция «подражайте» точнее и естественнее буквального «станьте подражателями».
- source_word: μου
  choice: мне
  rationale: Родительный местоимения указывает на Павла как на образец; при русском глаголе «подражать» это отношение естественно выражается дательным падежом.
- source_word: γίνεσθε
  choice: подражайте
  rationale: Настоящее повелительное γίνεσθε буквально может быть передано «становитесь». Вместе с μιμηταί оно образует призыв принять Павла за образец; по-русски это идиоматично выражается одним императивом «подражайте».
theological_decisions:
- issue: Призыв Павла подражать ему может показаться чрезмерным вне более широкого христоцентричного контекста, однако в самом стихе Павел прямо называет образцом себя.
  choice: Передать прямой призыв «подражайте мне», не смягчая его.
  alternative: следуйте моему примеру
  rationale: Греческий текст недвусмысленно представляет Павла непосредственным образцом. Вариант «следуйте моему примеру» возможен по смыслу, но менее прозрачно передаёт μιμηταί. Связь с подражанием Христу уместно указать в примечании, а не вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткий, настойчивый и достойный по тону призыв. Глагольная формулировка предпочтена тяжеловесному буквальному обороту, а формальная альтернатива сохранена в примечании.
