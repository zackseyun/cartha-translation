  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: ru
  text: И трудимся, работая своими руками. Когда нас оскорбляют[a], мы благословляем; когда нас преследуют, мы терпим;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда нас поносят».'
    reason: Лексическая альтернатива для λοιδορούμενοι; сохраняет значение «поносить, оскорблять» без изменения основного перевода.
lexical_decisions:
- source_word: κοπιῶμεν
  choice: трудимся
  rationale: Передаёт напряжённый, утомительный труд, а не просто занятость; естественно сочетается с последующим пояснением о работе руками.
- source_word: ἐργαζόμενοι
  choice: работая
  rationale: Причастие поясняет, каким образом совершается этот труд; нейтральное «работая» не добавляет отсутствующей в тексте цели заработка.
- source_word: ταῖς ἰδίαις χερσίν
  choice: своими руками
  rationale: Сохраняет усиление ἰδίαις и естественно выражает личный физический труд.
- source_word: λοιδορούμενοι
  choice: когда нас оскорбляют
  rationale: Передаёт пассивное причастие и в данном ряду естественно выражает обстоятельство, на которое апостолы отвечают благословением.
- source_word: εὐλογοῦμεν
  choice: мы благословляем
  rationale: Сохраняет ключевой библейский глагол и не вводит прямо не названный объект благословения.
- source_word: διωκόμενοι
  choice: когда нас преследуют
  rationale: В контексте означает враждебное преследование; конструкция параллельна предыдущему обстоятельственному обороту.
- source_word: ἀνεχόμεθα
  choice: мы терпим
  rationale: Передаёт стойкое перенесение враждебного обращения и сохраняет отсутствие явного дополнения в греческом тексте.
theological_decisions:
- issue: Ответ апостолов на дурное обращение
  choice: 'Стих описывает поведение апостолов: на оскорбления они отвечают благословением, а преследование терпят.'
  alternative: Передать эти слова как прямое общее повеление всем верующим.
  rationale: Греческий текст повествует об апостольской практике в форме первого лица множественного числа; перевод сохраняет её нравственную силу, не превращая описание в формально выраженную заповедь.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмически параллельным построением. «Оскорбляют» выбрано как более общеупотребительное, чем «поносят»; «терпим» сохраняет лаконизм оригинала.
