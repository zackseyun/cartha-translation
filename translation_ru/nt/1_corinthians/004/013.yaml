  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: ru
  text: Когда нас злословят, мы увещеваем[a]. Мы стали как сор мира, как отброс всего — до сих пор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда нас порочат, мы просим (или: обращаемся с призывом)». Греческий глагол может означать «просить», «призывать», «увещевать», «ободрять» или «утешать»; здесь он, вероятно, обозначает немстительный ответ на оскорбление.'
    reason: lexical_alternative
  - marker: b
    text: Слова, переведённые как «сор» и «отброс», редки и очень резки. Они могут обозначать грязь или остатки, удаляемые при очищении. Слово «всего» передаёт широкий греческий родительный падеж; в зависимости от понимания он может относиться также ко «всем». Иногда в этих словах усматривают ритуальные ассоциации, однако в контексте несомненен образ крайнего презрения.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: Когда нас злословят
  rationale: Страдательное причастие обозначает оскорбительную или порочащую речь против апостолов. «Злословят» передаёт враждебную речь, не сужая значение до юридически понимаемой клеветы.
- source_word: παρακαλοῦμεν
  choice: мы отвечаем добрым словом
  rationale: В данном ряду противопоставлений глагол описывает мирный, не мстительный словесный ответ. Формулировка сохраняет контраст со злословием, не добавляя отсутствующего в греческом наречия «кротко».
- source_word: ὡς
  choice: словно
  rationale: Передаёт сравнение, не превращая образное выражение в строгое отождествление.
- source_word: περικαθάρματα τοῦ κόσμου
  choice: сор для мира
  rationale: Редкое существительное обозначает удаляемую при очищении грязь или отбросы и метафорически выражает крайнее общественное презрение. «Сор» краток, понятен и сохраняет образ очищения.
- source_word: ἐγενήθημεν
  choice: мы стали
  rationale: Аорист передан естественным русским прошедшим временем; продолжающееся состояние явно выражено заключительной фразой.
- source_word: πάντων περίψημα
  choice: отбросы для всех
  rationale: περίψημα — то, что счищают или стирают как негодный остаток. πάντων грамматически допускает отнесение как ко всему, так и ко всем; по-русски «для всех» естественно передаёт социальную оценку, а неоднозначность отмечена в сноске.
- source_word: ἕως ἄρτι
  choice: и остаёмся ими доныне
  rationale: Выражение указывает на продолжение униженного положения до момента написания. Добавление «остаёмся ими» естественно связывает временное указание с результирующим состоянием, не меняя смысла.
theological_decisions:
- issue: Смысл парных уничижительных слов περικαθάρματα и περίψημα
  choice: 'Передать их как яркие образы крайнего презрения: «сор» и «отбросы»'
  alternative: Истолковать их как техническое указание на очистительную жертву или ритуального заместителя
  rationale: Ближайший контекст подчёркивает унижение апостолов в глазах окружающих. Возможные очистительные или ритуальные ассоциации редких слов нельзя уверенно превращать в основное богословское утверждение текста.
- issue: Референт πάντων
  choice: Сохранить доступную контексту социальную направленность в выражении «для всех», отметив более широкую возможность в сноске
  alternative: Перевести буквально «всего» или «всех вещей»
  rationale: Форма πάντων сама по себе неоднозначна по роду. В контексте общественного презрения «для всех» звучит естественно, но сноска сохраняет формальную широту оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Сильные образы сохранены без архаизмов «сор мира» и «прах, всеми попираемый» и без внесения специального жертвенного толкования.
