  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: ru
  text: Ведь кто делает тебя отличным от других?[a] И что у тебя есть, чего ты не получил? А если ты это получил, то почему хвалишься, будто не получил?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто отличает тебя?» Греческий глагол может означать «различать», «выделять» или «делать отличным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: Ведь кто отличает тебя от других?
  rationale: γάρ связывает вопрос с предшествующим обличением, а переходный διακρίνει обозначает проведение различия. Добавление «от других» естественно выражает подразумеваемое сравнение в русском языке, не уточняя, идёт ли речь о Боге, людях или самом адресате.
- source_word: τί δὲ ἔχεις ὃ οὐκ ἔλαβες
  choice: И что у тебя есть, чего бы ты не получил?
  rationale: δὲ здесь служит мягкой связкой в последовательности риторических вопросов. Русская конструкция «чего бы ты не получил» естественно передаёт мысль о том, что всё имеющееся было получено, при этом аорист ἔλαβες не требует отдельного указания времени.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: А если получил
  rationale: Сочетание εἰ ... καὶ в данном контексте подтверждает уже установленный факт. Краткая русская формулировка сохраняет риторическую силу; объект естественно восстанавливается из предыдущего вопроса.
- source_word: τί καυχᾶσαι
  choice: то почему хвалишься
  rationale: καυχάομαι у Павла обозначает хвалу или похвальбу, основанную на предполагаемом преимуществе. «Хвалишься» — ясный и устойчивый современный эквивалент.
- source_word: ὡς μὴ λαβών
  choice: будто не получил
  rationale: Оборот с ὡς и причастием описывает образ действия, противоречащий факту получения. «Будто не получил» кратко и естественно сохраняет это противопоставление.
theological_decisions:
- issue: Источник различий, преимуществ и того, чем обладает адресат
  choice: Перевод подчёркивает, что всякое имеющееся у адресата было получено, но не ограничивает смысл только духовными дарами или служениями.
  alternative: Истолковать вопрос исключительно о духовных дарах либо расширить его прямым добавлением до всех способностей, статуса и благословений.
  rationale: Ближайший контекст касается служения, партийной гордости и похвальбы, однако формулировка Павла остаётся общей. Перевод сохраняет эту широту без догматического уточнения.
- issue: Кто именно проводит различие
  choice: В вопросе сохранено неопределённое «кто», как в греческом тексте.
  alternative: 'Передать явно: «Кто дал тебе преимущество?» или «Бог отличил тебя».'
  rationale: Греческий вопрос не называет действующее лицо и допускает оттенки «различает», «выделяет» и «делает отличным». Называть Бога непосредственно или сводить смысл к превосходству означало бы разрешить сохранённую текстом неоднозначность.
translation_notes:
  register: Современный литературный русский язык; риторическая последовательность и краткость оригинала сохранены. Обращение во втором лице единственного числа передаёт греческое σε и делает обличение личным, как в исходном тексте.
