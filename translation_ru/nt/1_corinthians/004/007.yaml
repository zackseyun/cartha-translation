  naturalness: После исправления текст звучит как современный литературный русский и сохраняет краткую, обличительную последовательность трёх вопросов. «Если ты это получил» естественно подхватывает подразумеваемый объект из предыдущего вопроса.
  terminology: «Хвалишься» точно и естественно передаёт καυχᾶσαι. Перевод не сужает общее «что у тебя есть» до духовных даров и не называет подразумеваемого действующего лица в первом вопросе.
