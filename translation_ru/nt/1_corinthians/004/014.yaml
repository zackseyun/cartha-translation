  naturalness: 'Союз «но» яснее оформляет противопоставление, заданное ἀλλ’, а «наставляю вас как моих любимых детей» — естественная и грамматически прозрачная русская фраза. Запятая перед «как» не требуется: оборот характеризует адресатов наставления.'
  terminology: «Наставляю» — нейтральное современное слово для νουθετῶν, передающее любящее корректирующее наставление без конфессионально специфических или карательных коннотаций. «Любимых детей» сохраняет тёплый характер ἀγαπητά и гендерно-инклюзивность τέκνα.
