  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: ru
  text: Я пишу всё это не для того, чтобы пристыдить вас[a], но наставляю вас как моих любимых детей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вам стало стыдно».'
    reason: lexical_alternative
  - marker: b
