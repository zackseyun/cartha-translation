    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: пристыдить
  rationale: Передаёт направленное на человека переживание стыда; в сочетании с отрицанием естественно выражает отвергаемую Павлом цель письма. «Смущать» было бы слабее.
- source_word: γράφω ταῦτα
  choice: я пишу всё это
  rationale: Настоящее время передано естественным русским эпистолярным выражением; «всё это» указывает на совокупность сказанного выше и идиоматично передаёт множественное ταῦτα.
- source_word: ἀλλ’
  choice: а
  rationale: Русский противительный союз естественно противопоставляет не отвергаемому действию как таковому, а истинному пастырскому намерению Павла.
- source_word: ὡς
  choice: как
  rationale: Сохраняет прямое указание на отношения, в рамках которых Павел обращается к коринфянам, не превращая сравнение в сомнение об их статусе.
- source_word: τέκνα μου ἀγαπητὰ
  choice: моих любимых детей
  rationale: «Детей» сохраняет гендерно-инклюзивное значение τέκνα, а «любимых» передаёт теплоту ἀγαπητά естественным современным русским языком.
- source_word: νουθετῶν
  choice: вразумляю вас
  rationale: «Вразумляю» сочетает исправляющее наставление и предостережение, сохраняя пастырскую, а не карательную направленность. Местоимение «вас» ясно восстанавливает подразумеваемый объект.
theological_decisions:
- issue: Пастырский характер исправления
  choice: «а вразумляю вас как моих любимых детей»
  alternative: «а предостерегаю вас как моих любимых детей»
  rationale: Отрицание стыда и обращение к ним как к любимым детям показывают, что резкость предыдущих слов служит любящему исправлению. «Вразумляю» сохраняет исправительную силу νουθετῶν, не сводя её ни к осуждению, ни к нейтральному совету.
- issue: Синтаксическая связь причастий с глаголом письма
  choice: Первое причастие передано как отвергаемая цель письма, второе — как совершаемое Павлом действие
  alternative: «Не стыдя вас, пишу всё это, но наставляя вас…»
  rationale: Такой русский синтаксис естественно выражает смысл греческой конструкции и сохраняет различие между отвергаемым пристыживанием и реальным вразумлением, не утверждая, что само письмо не является средством вразумления.
translation_notes:
  register: Современный литературный русский язык с тёплым, но сохраняющим исправительную силу пастырским тоном. «Пристыдить» и «вразумляю» понятны широкому читателю и не привносят конфессионально специфической терминологии.
