id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: ru
  text: 'Пусть каждый именно так считает нас: служителями Мессии[b] и распорядителями Божьих тайн.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «Христа». Греческое Χριστός означает «Помазанник» и здесь употреблено как титул.'
    reason: Лексическая альтернатива при передаче мессианского титула.
lexical_decisions:
- source_word: Οὕτως
  choice: так (передано конструкцией «Пусть… считает…» в указанном смысле)
  rationale: Наречие задаёт способ, каким следует воспринимать Павла и его сотрудников; в русском этот смысл естественно выражает вся конструкция предложения.
- source_word: λογιζέσθω
  choice: пусть считает
  rationale: Форма повелительного наклонения выражает предписание относительно того, как надлежит оценивать говорящих; «считать» здесь естественно и точно.
- source_word: ἄνθρωπος
  choice: каждый
  rationale: 'В данном контексте существительное употреблено обобщённо: речь идёт о любом человеке, а не только о мужчине. «Каждый» сохраняет единственное число и обобщающий смысл.'
- source_word: ὑπηρέτας
  choice: служителями
  rationale: Слово обозначает подчинённых служителей и не несёт обязательного значения рабского статуса.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет значение титула Божьего Помазанника; «Мессия» передаёт титульный смысл яснее, чем воспринимаемое как имя слово «Христос».
- source_word: οἰκονόμους
  choice: распорядителями
  rationale: Речь об уполномоченных лицах, которым доверено управление и ответственное распоряжение; «распорядители» сохраняет метафору в понятной современной форме.
- source_word: μυστηρίων θεοῦ
  choice: Божьих тайн
  rationale: Сохраняется характерное для Павла слово «тайны» без добавления толкования о том, когда и как они открыты; родительный падеж допускает принадлежность и источник.
theological_decisions:
- issue: Передача Χριστοῦ как титула
  choice: Мессии
  alternative: Христа
  rationale: В этом месте слово обозначает Того, Кому подчинены служители, и его титульное значение остаётся заметным. Альтернатива «Христа» также лексически возможна и приведена в сноске.
- issue: Обобщённое значение ἄνθρωπος
  choice: каждый
  alternative: человек
  rationale: Греческая форма единственного числа имеет здесь родовое, а не исключительно мужское значение. «Каждый» прямо передаёт отнесённость требования к любому человеку, не превращая единственное число во множественное.
- issue: Смысл выражения μυστηρίων θεοῦ
  choice: Божьих тайн
  alternative: тайн Бога
  rationale: 'Перевод сохраняет неоднозначность родительного падежа: эти тайны принадлежат Богу и исходят от Него; пояснение о «раскрытых тайнах» не добавляется в основной текст.'
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Синтаксис краток и следует движению греческой фразы; «Божьих тайн» естественнее по-русски, чем более буквальное «тайн Бога».
