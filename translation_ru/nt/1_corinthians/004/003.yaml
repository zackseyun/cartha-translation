  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: ru
  text: Для меня почти ничего не значит, что меня разбираете вы или суд людской[a]; да и сам я себя не разбираю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человеческий день»; образное выражение, обозначающее человеческий суд или оценку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν
  choice: Для меня совсем неважно
  rationale: 'Передаёт дательный отношения и идиоматический смысл выражения: человеческая оценка имеет для Павла крайне малое значение.'
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: будете ли вы судить обо мне
  rationale: В данном контексте ἀνακρίνω означает подвергать оценке или разбору; формулировка естественна по-русски и не подразумевает непременно окончательного осуждения.
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: или это сделает человеческий суд[a]
  rationale: Буквальное «человеческий день» — необычный оборот, вероятно обозначающий человеческий суд или оценку в противопоставлении дню Господа; смысл передан идиоматически, а буквальная форма отмечена в сноске.
- source_word: ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω
  choice: Но и сам я о себе не сужу
  rationale: «Но и… не» сохраняет усиление οὐδέ; повтор глагола с корнем «суд-» поддерживает лексическую связь с первым употреблением ἀνακρίνω.
theological_decisions:
- issue: Значение ἀνθρωπίνης ἡμέρας
  choice: человеческий суд
  alternative: человеческий день; человеческая оценка
  rationale: Контекст противопоставляет человеческую оценку суду Господа, не утверждая ничего о календарном дне. Идиоматический перевод понятен современному читателю, а сноска сохраняет необычный образ оригинала.
- issue: Сила ἀνακρίνω
  choice: судить о ком-либо
  alternative: исследовать; оценивать; допрашивать
  rationale: Здесь речь идёт о разборе и оценке служения Павла, а не обязательно о вынесении окончательного приговора. Выражение «судить обо мне» сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык; фраза построена ясно и достойно. Необычная буквальная метафора вынесена в сноску, а различие между человеческой оценкой и окончательным Божьим судом не сглажено.
