  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: ru
  text: 'Всё это, братья и сёстры[a], я ради вас применил к себе и Аполлосу, чтобы на нашем примере вы усвоили: «Не сверх того, что написано»[b], — и чтобы никто из вас не превозносился, становясь на сторону одного против другого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «братья»; по-гречески это слово могло служить обращением ко всей общине, включая женщин.'
    reason: cultural_note
  - marker: b
    text: 'Греческая фраза эллиптична, буквально: «не сверх того, что написано». Возможно, это краткое изречение или лозунг; по смыслу также: «Не выходите за пределы написанного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Всё это
  rationale: Передаёт множественное указание на предшествующее рассуждение и естественно звучит по-русски.
- source_word: ἀδελφοί
  choice: братья и сёстры
  rationale: Форма буквально означает «братья», но в данном обращении охватывает смешанную общину; примечание сохраняет сведения о форме оригинала.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: я … применил к себе и Аполлосу
  rationale: Глагол обозначает риторическое перенесение или применение предыдущего рассуждения к Павлу и Аполлосу.
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: Передаёт значение пользы и пастырской цели.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: чтобы на нашем примере вы усвоили
  rationale: Естественно раскрывает сжатое греческое выражение, в котором Павел и Аполлос выступают примером, не меняя его смысла.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: 'правило: «Не сверх того, что написано»'
  rationale: Сохраняет эллиптичность и возможный характер изречения или правила, не добавляя отсутствующего в греческом глагола.
- source_word: φυσιοῦσθε
  choice: превозносился
  rationale: Передаёт образ самодовольной надменности естественным современным русским словом.
- source_word: ὑπὲρ τοῦ ἑνὸς … κατὰ τοῦ ἑτέρου
  choice: поддерживая одного против другого
  rationale: Ясно передаёт партийное предпочтение одного руководителя в ущерб другому.
theological_decisions:
- issue: Смысл эллиптической фразы Μὴ ὑπὲρ ἃ γέγραπται
  choice: Сохранить в основном тексте краткую формулу «Не сверх того, что написано».
  alternative: «Не выходите за пределы написанного».
  rationale: Греческая фраза не содержит явного глагола и может быть максимой или лозунгом. Буквально-сжатая передача сохраняет эту подлинную неоднозначность, а примечание поясняет вероятный наставительный смысл без его догматизации.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю; тон уважительный и наставительный. Сохранена риторическая сжатость ключевой цитаты и Павлова критика партийной гордости.
