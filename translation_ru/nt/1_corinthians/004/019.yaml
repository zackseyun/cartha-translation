id: 1CO.4.19
reference: 1 Corinthians 4:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: ru
  text: Но я скоро приду к вам, если Господь пожелает, и узнаю не слова возгордившихся[a], а силу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «раздувшихся»; Павел неоднократно употребляет в этом письме этот образ применительно к людям, исполненным гордости и самомнения.'
    reason: Сохранение повторяющегося авторского образа, который невозможно столь же естественно передать в основном русском тексте.
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: Но я скоро приду к вам
  rationale: Будущее ἐλεύσομαι передано простым будущим; δέ выражает лёгкое противопоставление, а ταχέως здесь естественно указывает на скорое время прихода.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: если Господь пожелает
  rationale: Условная конструкция сохраняет зависимость намерения Павла от воли Господа, не уточняя референта сверх греческого текста.
- source_word: γνώσομαι
  choice: узнаю
  rationale: Глагол означает, что при личном посещении Павел выяснит действительное положение дел; «узнаю» естественно и сохраняет связь со значением «знать».
- source_word: οὐ τὸν λόγον
  choice: не слова
  rationale: λόγος в данном противопоставлении обозначает речь или то, что говорят; форма «слова» звучит естественно по-русски и не сужает смысл до риторики либо содержания учения.
- source_word: τῶν πεφυσιωμένων
  choice: возгордившихся
  rationale: Причастие описывает людей, пребывающих в состоянии надменности. Русское «возгордившихся» передаёт устойчивый результат, хотя образ раздутости поясняется в сноске.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: а силу
  rationale: Краткое соответствие сохраняет намеренно широкое противопоставление между словами и реальной силой, не определяя её конкретное проявление.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Господь
  alternative: Господь Иисус; Бог
  rationale: В греческом тексте стоит только ὁ κύριος; перевод не уточняет, идёт ли речь непосредственно об Иисусе или о Боге, и тем самым сохраняет исходную формулировку.
- issue: Характер противопоставления λόγος и δύναμις
  choice: слова и сила
  alternative: риторика и апостольская власть; учение и чудотворная сила
  rationale: Широкие русские соответствия не сводят «силу» к чудесам, власти или иной отдельной форме проявления и сохраняют богословскую ёмкость контраста.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и понятным синтаксисом. «Возгордившихся» избегает разговорности, а сноска сохраняет выразительную метафору греческого текста.
