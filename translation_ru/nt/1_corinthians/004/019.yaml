  source_fidelity: 'Текст точно передаёт греческую конструкцию: будущее посещение, условие ἐὰν ὁ κύριος θελήσῃ, а также противопоставление λόγος—δύναμις. «Узнаю» адекватно передаёт γνώσομαι как результат личной проверки. Единственное число λόγον естественно передано русским собирательным «слова»; смысл не изменён.'
