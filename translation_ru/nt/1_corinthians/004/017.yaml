language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: ru
  text: Поэтому я послал к вам Тимофея, моего возлюбленного и верного сына в Господе[a]. Он напомнит вам о моих путях в Мессии Иисусе[b], как я учу повсюду, в каждой церкви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дитя». Греческое τέκνον не указывает пол само по себе, но здесь относится к Тимофею и выражает духовное родство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во Христе Иисусе». Греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественная причинно-следственная связка, отсылающая к предшествующему рассуждению.
- source_word: ἔπεμψα
  choice: я послал
  rationale: Простой прошедший вид естественно передаёт греческий аорист в данном эпистолярном контексте.
- source_word: Τιμόθεον
  choice: Тимофея
  rationale: Устоявшаяся русская форма личного имени с требуемым винительным падежом.
- source_word: τέκνον
  choice: сына
  rationale: Греческое слово буквально обозначает ребёнка или дитя, однако применительно к взрослому мужчине в отношениях духовного родства русское «сын» звучит естественно и сохраняет семейную метафору; буквальный вариант указан в сноске.
- source_word: ἀγαπητὸν
  choice: возлюбленного
  rationale: Передаёт сердечную привязанность Павла и сохраняет возвышенный тон выражения.
- source_word: πιστὸν
  choice: верного
  rationale: Сохраняет возможные оттенки преданности и надёжности Тимофея, не сводя слово только к одному из них.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерную для Павла формулу, указывающую на отношения и общую сферу жизни в Господе.
- source_word: ἀναμνήσει
  choice: напомнит
  rationale: 'Прямой и естественный эквивалент будущего времени: Тимофей должен восстановить в памяти адресатов уже известное им.'
- source_word: τὰς ὁδούς μου
  choice: о моих путях
  rationale: 'Сохраняет метафору путей и её широкое значение: образ жизни, служения и наставления Павла.'
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Передаёт Χριστός как титул «Мессия» и относит выражение к путям Павла, определяемым его единением с Мессией Иисусом.
- source_word: καθὼς
  choice: о том, чему
  rationale: В составе перестроенной русской фразы естественно выражает соответствие между путями Павла и его повсеместным учением.
- source_word: πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ
  choice: повсюду, в каждой церкви
  rationale: Точно сохраняет оба элемента всеобщего охвата и звучит естественно по-русски.
theological_decisions:
- issue: Передача Χριστός в выражении ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  alternative: во Христе Иисусе
  rationale: Здесь Χριστός сохраняет силу титула. Перевод «Мессия» раскрывает его значение, а традиционный вариант «Христос» приведён в сноске.
- issue: Смысл выражения «мои пути»
  choice: Сохранить метафору, охватывающую образ жизни, служение и учение Павла
  alternative: мой образ жизни; мои правила поведения
  rationale: Контекст исключает понимание как маршрутов путешествий, но не позволяет без необходимости сузить многозначную метафору только до поведения или только до учения.
- issue: Связь последней части предложения с «моими путями»
  choice: «о том, чему я учу»
  alternative: «как я учу»
  rationale: Русская перестройка поясняет, что содержание напоминания соответствует постоянному наставлению Павла во всех церквах, не утверждая искусственного различия между его жизнью и учением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. «Возлюбленный» сохраняет эмоциональную силу оригинала; «сын» избегает неестественного для русского обозначения взрослого мужчины словом среднего рода «дитя». Тире и пояснительная конструкция делают синтаксическую связь последней части стиха ясной без устранения смысловой широты метафоры «пути».
