lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: До самого этого часа
  rationale: Передаёт продолжительность вплоть до настоящего момента и сохраняет усиление ἄρτι вместе с конкретным образом «часа».
- source_word: πεινῶμεν
  choice: мы голодаем
  rationale: Настоящее время описывает продолжающееся лишение; «голодаем» естественно и несколько точнее передаёт состояние нужды, чем нейтральное «мы голодны».
- source_word: διψῶμεν
  choice: мы жаждем
  rationale: Сохраняет параллелизм с «голодаем» и обозначает продолжающуюся жажду без добавочного истолкования.
- source_word: γυμνιτεύομεν
  choice: плохо одеты
  rationale: Глагол может обозначать не полную наготу, а недостаток необходимой одежды; этот вариант не преувеличивает степень лишения.
- source_word: κολαφιζόμεθα
  choice: нас бьют
  rationale: Настоящее пассивное передаёт продолжающееся или повторяющееся физическое насилие; простая формулировка сохраняет конкретность греческого выражения.
- source_word: ἀστατοῦμεν
  choice: мы не имеем постоянного пристанища
  rationale: Передаёт отсутствие устойчивого места проживания, не сужая значение исключительно до современного социального понятия бездомности и не утверждая однозначно постоянное странствование.
- source_word: καὶ … καὶ … καὶ …
  choice: и … и … и …
  rationale: Повтор союза сохраняет накопительный ритм и усиливающийся перечень лишений.
theological_decisions:
- issue: Характер описания апостольских страданий
  choice: Конкретный перечень продолжающихся лишений и насилия
  alternative: Преимущественно риторическое преувеличение
  rationale: Формы настоящего времени прямо описывают положение говорящих; перевод не ослабляет страдания и не усиливает их сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и разговорно не сниженным звучанием. Повтор «и» намеренно сохранён ради ритма и нарастающей силы перечня; неоднозначность γυμνιτεύομεν и ἀστατοῦμεν отмечена в сносках.
