id: 1CO.4.9
reference: 1 Corinthians 4:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: ru
  text: Ибо, как мне кажется, Бог выставил нас, апостолов, последними — словно приговорённых к смерти[a], потому что мы стали зрелищем[b] для мира — и для ангелов, и для людей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обречённых на смерть». Греческое слово обозначает тех, кому предстоит смерть, вероятно с намёком на осуждённых, выставленных на арене.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «театром»; здесь имеется в виду публичное зрелище.'
    reason: lexical_alternative
  - marker: c
    text: Здесь «людей» означает человеческие существа вообще, в противопоставлении ангелам.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: Ибо, как мне кажется
  rationale: Передаёт личную оценку Павла и сохраняет пояснительную связь, выраженную γάρ.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: нас, апостолов
  rationale: Сохраняет приложение, уточняющее, что Павел говорит именно об апостолах.
- source_word: ἐσχάτους ἀπέδειξεν
  choice: выставил … последними
  rationale: Передаёт публичное выставление напоказ и положение последних; сочетание согласуется с последующим образом зрелища и допускает оттенок появления осуждённых в конце представления.
- source_word: ὡς ἐπιθανατίους
  choice: словно приговорённых к смерти
  rationale: Естественно передаёт значение людей, обречённых или назначенных на смерть, вероятно в контексте образности арены.
- source_word: θέατρον ἐγενήθημεν
  choice: мы стали зрелищем
  rationale: Передаёт метафорический смысл публичного зрелища, не ограничивая слово значением здания театра.
- source_word: τῷ κόσμῳ
  choice: для мира
  rationale: Дательный обозначает круг зрителей или тех, перед кем апостолы стали зрелищем.
- source_word: καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: и для ангелов, и для людей
  rationale: Сохраняет симметричную конструкцию и противопоставление ангельских и человеческих наблюдателей; «людей» относится ко всему человечеству, а не только к мужчинам.
theological_decisions:
- issue: Значение ἀγγέλοις
  choice: «ангелы» как небесные существа, наблюдающие унижение апостолов
  alternative: «вестники» в общем смысле
  rationale: В сочетании с «миром» и «людьми» наиболее естествен космический масштаб, включающий сверхъестественных ангельских существ; дополнительных догматических уточнений текст не требует.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены пояснительное начало, личная оценка Павла, приложение «апостолов», образ публичного зрелища и трёхчастный круг наблюдателей. Тире поддерживают напряжённую риторическую структуру, не снимая возможной образности арены.
