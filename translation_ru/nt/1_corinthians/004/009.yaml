  source_fidelity: 'Текст точно передаёт ход и образы греческого оригинала: личную оценку Павла (δοκῶ γάρ), Бога как субъекта публичного «выставления», апостолов в положении последних, сравнение с обречёнными на смерть и их положение публичного зрелища перед миром, ангелами и людьми. «Словно приговорённых к смерти» адекватно передаёт ὡς ἐπιθανατίους, не превращая вероятную образность арены в утверждение.'
