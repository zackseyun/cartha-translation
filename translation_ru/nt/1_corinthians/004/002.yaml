lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: Итак
  rationale: Сочетание вводит вывод или переход в рассуждении. Русское «итак» естественно передаёт эту дискурсивную функцию, не создавая тяжеловесного нагромождения частиц.
- source_word: ζητεῖται
  choice: требуется
  rationale: Буквально глагол означает «ищется», но в данной конструкции выражает предъявляемое к распорядителям требование.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: от распорядителей
  rationale: Так естественно по-русски передаётся круг лиц, к которым относится требование; «распорядители» сохраняет образ управления доверенным имуществом.
- source_word: ἵνα πιστός τις εὑρεθῇ
  choice: чтобы каждый оказался верным
  rationale: «Оказался верным» передаёт пассивное εὑρεθῇ — быть признанным или обнаруженным таковым. В контексте класса распорядителей неопределённое τις естественно выражено словом «каждый», без указания только на мужчин.
theological_decisions:
- issue: Обобщающее единственное число и гендерная точность
  choice: чтобы каждый оказался верным
  alternative: чтобы кто-либо оказался верным; чтобы распорядитель оказался верным
  rationale: Греческое τις имеет неопределённое обобщающее значение и не ограничивает утверждение мужчинами. «Каждый» ясно относит требование к любому из распорядителей.
- issue: Значение πιστός
  choice: верным
  alternative: надёжным; заслуживающим доверия
  rationale: В контексте доверенного управления слово подчёркивает надёжность, однако «верный» сохраняет более широкий нравственный оттенок греческого πιστός и привычную библейскую лексику.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная формулировка. «Распорядитель» понятен современному читателю и сохраняет бытовой образ человека, которому доверено управление чужим достоянием.
