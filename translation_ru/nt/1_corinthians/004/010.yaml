  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: ru
  text: Мы — глупцы ради Христа[a], а вы мудры во Христе[b]; мы слабы, а вы сильны; вы в почёте[c], а мы обесчещены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глупцы из-за Христа». Греческое διὰ Χριστόν может выражать причину или цель; «ради Христа» сохраняет оба оттенка.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Мессии». Греческое ἐν Χριστῷ — характерное для Павла выражение; его точный смысловой оттенок определяется контекстом.'
    reason: lexical_alternative
  - marker: c
    text: Слова «в почёте» и «обесчещены» здесь относятся прежде всего к общественному положению и мнению окружающих, а не только к внутренним переживаниям.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: глупцы
  rationale: Предикативное существительное передаёт резкую ироническую характеристику и сохраняет прямое противопоставление «мудрым».
- source_word: διὰ Χριστόν
  choice: ради Христа
  rationale: διά с винительным может указывать на причину или основание; «ради Христа» естественно передаёт смысл «из-за Христа / ради Христа», не устраняя возможного целевого оттенка.
- source_word: φρόνιμοι
  choice: мудры
  rationale: Наиболее ясно сохраняет риторическую антитезу с «глупцами»; в контексте слова Павла ироничны.
- source_word: ἐν Χριστῷ
  choice: во Христе
  rationale: Сохранена характерная для Павла конструкция с ἐν без поясняющего парафраза.
- source_word: ἀσθενεῖς
  choice: слабы
  rationale: Широкое по смыслу слово, способное охватывать физическую, общественную и воспринимаемую слабость.
- source_word: ἰσχυροί
  choice: сильны
  rationale: Прямой и естественный антоним к «слабы», сохраняющий параллелизм.
- source_word: ἔνδοξοι
  choice: в почёте
  rationale: В данном противопоставлении выражает общественное признание и высокий статус естественнее, чем буквальное «славны».
- source_word: ἄτιμοι
  choice: обесчещены
  rationale: Передаёт утрату или отсутствие общественной чести и сохраняет контраст с «в почёте».
- source_word: δὲ
  choice: а
  rationale: Русский противительный союз «а» естественно подчёркивает повторяющийся контраст между «мы» и «вы».
- source_word: ἡμεῖς / ὑμεῖς
  choice: мы / вы
  rationale: Явные местоимения сохранены, поскольку в греческом они эмфатичны и образуют основу иронического противопоставления.
theological_decisions:
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: В современном русском христианском употреблении «Христос» естественно сохраняет титульное значение греческого Χριστός и узнаваемость обеих формул — «ради Христа» и «во Христе» — без превращения титула в обычное имя.
- issue: Характер утверждений о коринфянах
  choice: Сохранена прямая формулировка без добавления явного показателя иронии
  alternative: «вы, конечно, мудры» или кавычки вокруг характеристик
  rationale: Ирония ясна из контекста и симметрии противопоставлений; добавленный показатель чрезмерно истолковал бы авторский тон.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой исходного трёхчастного противопоставления. Тире выделяет эмфатическое «мы»; повтор союза «а» сохраняет остроту иронии. Лексика понятна широкому читателю без утраты достоинства и социального оттенка заключительной пары.
