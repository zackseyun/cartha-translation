language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: ru
  text: так что вы не испытываете недостатка ни в каком даре[a], с нетерпением ожидая откровения[b] нашего Господа Иисуса Христа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни в каком духовном даре»; или: «ни в каком даре благодати».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «явления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт результат Божьей благодати, описанной в предшествующем контексте, и естественно связывает стих с предыдущей мыслью.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: вы не испытываете недостатка
  rationale: Точно выражает отсутствие нехватки; настоящее время соответствует продолжающемуся состоянию коринфской общины.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: ни в каком даре
  rationale: Сохраняет широкое значение χάρισμα как дара, данного по благодати, не добавляя прямо отсутствующего в греческом тексте определения «духовном».
- source_word: ἀπεκδεχομένους
  choice: с нетерпением ожидая
  rationale: Передаёт длительное и напряжённое ожидание, выраженное усиленным глаголом ἀπεκδέχομαι.
- source_word: ἀποκάλυψιν
  choice: откровения
  rationale: Наиболее прямое соответствие существительному ἀποκάλυψις; сохраняет эсхатологический смысл явления Христа, не сводя его только к видимому появлению.
- source_word: κυρίου
  choice: Господа
  rationale: Стандартное и контекстуально уместное соответствие κύριος в новозаветном именовании Иисуса.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В данном устойчивом сочетании Χριστός функционирует как привычное именование; традиционная русская форма естественна и сохраняет связь с мессианским титулом.
theological_decisions:
- issue: Значение χάρισμα
  choice: дар
  alternative: духовный дар; дар благодати
  rationale: «Дар» не сужает значение термина, тогда как «духовный» в этом стихе было бы поясняющим добавлением. Связь с благодатью ясна из контекста 1 Кор. 1:4–5.
- issue: Значение ἀποκάλυψις в эсхатологическом контексте
  choice: откровение
  alternative: явление
  rationale: «Откровение» формально ближе к греческому слову и сохраняет идею раскрытия того, что ныне сокрыто; «явление» передаёт вероятный контекстуальный смысл и отмечено в сноске.
- issue: Передача Χριστός в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисус Христос
  alternative: Иисус Мессия
  rationale: Здесь сочетание имеет характер закрепившегося именования, а не отдельно акцентированного титула. Русское «Христос» также исторически передаёт тот же мессианский титул без введения частного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского послания. Синтаксис сохраняет зависимость стиха от предыдущего предложения; причастная конструкция передана естественным деепричастным оборотом. Все варианты, действительно влияющие на смысл, вынесены в краткие сноски.
