  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: ru
  text: Я всегда благодарю моего Бога за вас[a] — за Божью благодать, данную вам в Мессии Иисусе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в связи с вами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: благодарю
  rationale: Простое настоящее время естественно передаёт продолжающуюся, привычную благодарность Павла; глагол звучит современно и достойно.
- source_word: τῷ θεῷ μου
  choice: моего Бога
  rationale: Русский глагол «благодарить» требует винительного падежа; местоимение «моего» сохраняет явно выраженное греческое μου.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой и естественный эквивалент наречия с широким временным значением.
- source_word: περὶ ὑμῶν
  choice: за вас
  rationale: В формуле благодарения περί с родительным естественно означает благодарность за людей или в связи с ними; «за вас» наиболее идиоматично по-русски.
- source_word: ἐπὶ τῇ χάριτι
  choice: за … благодать
  rationale: ἐπί с дательным указывает здесь на основание или повод благодарности. Русская конструкция «благодарю … за» ясно и естественно передаёт эту связь.
- source_word: χάριτι τοῦ θεοῦ
  choice: Божью благодать
  rationale: «Благодать» сохраняет ключевое для Павла значение χάρις, а прилагательное «Божью» естественно передаёт τοῦ θεοῦ, не исключая оттенка источника.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: данную вам
  rationale: Сохраняет пассивное значение причастия и оставляет Бога подразумеваемым Подателем.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Передаёт ἐν как сферу или единение, не уточняя связь сверх сказанного; Χριστός передано значением титула «Мессия».
theological_decisions:
- issue: Передача титула Χριστός в выражении ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  alternative: во Христе Иисусе
  rationale: «Мессия» раскрывает титульное значение греческого Χριστός и сохраняет связь с библейским ожиданием Помазанника; традиционный вариант указан в сноске, поскольку он широко узнаваем и лексически возможен.
- issue: Значение ἐν перед Χριστῷ Ἰησοῦ
  choice: в
  alternative: через
  rationale: Буквальное «в» сохраняет характерную для Павла ёмкость выражения и не сводит его исключительно к инструментальному значению.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире проясняет, что Божья благодать является основанием благодарности, не добавляя нового смыслового отношения.
