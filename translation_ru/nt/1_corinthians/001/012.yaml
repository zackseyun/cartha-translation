  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: ru
  text: 'Я имею в виду вот что: каждый из вас говорит: «Я принадлежу Павлу», «Я принадлежу Аполлосу», «Я принадлежу Кифе», «Я принадлежу Мессии»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я принадлежу Христу».'
    reason: Традиционный русский эквивалент титула Χριστός; основной текст переводит титул как «Мессия».
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: 'Я имею в виду вот что:'
  rationale: Естественная современная формулировка передаёт пояснительную функцию оборота; двоеточие выражает вводимое ὅτι содержание.
- source_word: ἕκαστος ὑμῶν λέγει
  choice: каждый из вас говорит
  rationale: Сохранены распределительное значение ἕκαστος и настоящее время λέγει.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: Я принадлежу Павлу
  rationale: Родительный Παύλου при εἰμι обозначает принадлежность или групповую приверженность; глагольная формулировка ясно вводит смысл всех последующих эллиптических реплик.
- source_word: Ἐγὼ δὲ Ἀπολλῶ / Ἐγὼ δὲ Κηφᾶ / Ἐγὼ δὲ Χριστοῦ
  choice: «Я — Аполлосу», «Я — Кифе» или «Я — Мессии»
  rationale: Русский эллипсис с тире естественно продолжает подразумеваемое «принадлежу», сохраняя повторяющийся характер лозунгов и не превращая их явно в утверждения о следовании.
- source_word: Κηφᾶ
  choice: Кифе
  rationale: Передано употреблённое Павлом арамейское имя Кифа, а не заменено именем Пётр; форма стоит в дательном падеже после подразумеваемого «принадлежу».
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь передан как титул «Мессия»; падежная форма соответствует русской конструкции принадлежности.
theological_decisions:
- issue: Передача Χριστοῦ в лозунге одной из групп
  choice: Мессии
  alternative: Христу
  rationale: Слово Χριστός сохраняет значение титула «Мессия», хотя традиционное «Христос» в русском языке также возможно и отмечено в сноске. Перевод не решает вопрос, был ли этот лозунг ещё одним проявлением партийности или противопоставлением ей.
- issue: Характер связи, выраженной εἰμι с родительным падежом
  choice: принадлежу
  alternative: я Павлов / я следую за Павлом
  rationale: «Принадлежу» передаёт принадлежность и приверженность, не сужая смысл до ученичества и не придавая фразе излишне архаический оттенок.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формулировкой. Первое «принадлежу» раскрыто полностью, а в следующих параллельных лозунгах использован естественный русский эллипсис с тире. Повтор местоимения «Я» сохранён ради риторического акцента греческого текста.
