lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: В контексте придаточное указывает основание благодарения Павла в предыдущем стихе; причинное значение естественно передаётся союзом «потому что».
- source_word: ἐν παντὶ
  choice: во всём
  rationale: Широкое идиоматическое выражение означает полноту обогащения; «во всём» сохраняет лаконичность и допускает последующее уточнение.
- source_word: ἐπλουτίσθητε
  choice: вы обогатились
  rationale: Русская возвратная форма естественно передаёт изменение состояния и не сводит метафору к материальному богатству; источник обогащения обозначен словами «в Нём».
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняется наиболее естественное значение сферы или единения со Христом, характерное для языка Павла, без замены на причинное «Им».
- source_word: ἐν παντὶ λόγῳ
  choice: всяким словом
  rationale: λόγος в сочетании с γνώσις вероятнее всего относится к словесному выражению или способности говорить. «Всяким словом» сохраняет многозначность существительного и параллелизм греческой фразы.
- source_word: πάσῃ γνώσει
  choice: всяким знанием
  rationale: Формулировка сохраняет параллель с «всяким словом» и передаёт широкий смысл γνώσις без чрезмерного уточнения.
theological_decisions:
- issue: Значение ἐν αὐτῷ
  choice: в Нём
  alternative: Им / через Него
  rationale: Перевод сохраняет возможный смысл пребывания и единения со Христом, не сводя оборот исключительно к указанию на деятеля или средство.
translation_notes:
  register: Современный литературный и достойный регистр. Тире показывает, что «всяким словом и всяким знанием» раскрывает, в чём именно проявилось обогащение. Заглавная буква в местоимении «Нём» соответствует принятому русскому библейскому оформлению обращения к Христу.
