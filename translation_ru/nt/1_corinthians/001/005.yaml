  source_fidelity: Начальное «потому что» верно передаёт причинное ὅτι. «В Нём» точно сохраняет ἐν αὐτῷ. Однако «обогатились» не столь ясно передаёт страдательную форму ἐπλουτίσθητε, а конструкция «всяким словом и всяким знанием» в русском легко читается как орудие обогащения, тогда как греческие ἐν ... ἐν обозначают сферы/аспекты, в которых оно проявилось.
  naturalness: 'Предлагаемая редакция сохраняет современный литературный строй и делает синтаксическую связь ясной: обогащение произошло «во всём», а именно в речи и знании.'
  terminology: «Речь» уместно передаёт λόγος в паре с γνῶσις, не сужая его до отдельного слова. «Знание» сохраняет широкий смысл γνῶσις. «В Нём» оставлено без богословской конкретизации.
