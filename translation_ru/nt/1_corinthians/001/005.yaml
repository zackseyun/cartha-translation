  - severity: medium
    issue: Инструментальное прочтение «всяким словом и всяким знанием»
    rationale: После тире творительный падеж естественно воспринимается как средство («обогатились чем?»), тогда как в оригинале повторяются предложные обороты ἐν, указывающие области обогащения.
