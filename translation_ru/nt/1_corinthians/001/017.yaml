base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: ru
  text: Ведь Мессия[c] послал меня не крестить, а возвещать благую весть — не мудростью речи[a], чтобы крест Мессии не оказался тщетным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «не с красноречивой мудростью»; более буквально: «не в мудрости слова».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы крест Мессии не был опустошён»; также возможно: «не был лишён действенности».'
    reason: lexical_alternative
  - marker: c
    text: Греч. Χριστός — «Мессия», то есть «Помазанник»; традиционная передача — «Христос».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: Мессия / Мессии
  rationale: Χριστός передан как значимый титул, а не как непереведённое имя; оба употребления в стихе переведены последовательно.
- source_word: βαπτίζειν
  choice: крестить
  rationale: Устоявшийся и естественный русский термин точно передаёт действие, не сужая его до пояснительного «погружать».
- source_word: εὐαγγελίζεσθαι
  choice: возвещать Благую весть
  rationale: Передаёт значение глагола доступным современным языком и сохраняет смысл провозглашения благой вести.
- source_word: σοφίᾳ λόγου
  choice: мудростью речи
  rationale: Сохраняет сжатость и некоторую неоднозначность греческого выражения, которое может указывать на риторическую искусность или красноречивую мудрость.
- source_word: κενωθῇ
  choice: не лишился силы
  rationale: В данном контексте естественно передаёт метафорический смысл пассива κενόω — сделать пустым, тщетным или недейственным; более буквальный образ сохранён в сноске.
- source_word: σταυρὸς
  choice: крест
  rationale: Прямой, традиционный и контекстуально точный эквивалент.
theological_decisions:
- issue: Передача Χριστός как переводного титула или традиционного «Христос»
  choice: Мессия
  alternative: Христос
  rationale: Перевод сохраняет смысл титула «Помазанник» и последовательно применяется в обоих случаях, не меняя христологического содержания.
- issue: Смысл выражения «чтобы крест Мессии не был опустошён»
  choice: чтобы крест Мессии не лишился силы
  alternative: чтобы крест Мессии не оказался тщетным / не был опустошён
  rationale: Основной текст передаёт контекстуальный смысл без утверждения, будто сам крест буквально может стать пустым; образная буквальная форма и иные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской аргументации. Противопоставление «не крестить, а возвещать» сохранено без вывода, будто Павел отвергает крещение вообще. Тире удерживает связь оборота «не мудростью речи» с возвещением Благой вести.
