  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ru
  text: Благодать вам и мир от Бога, нашего Отца, и Господа Иисуса, Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господа Иисуса Христа».'
    reason: Лексическая альтернатива для передачи Χριστοῦ.
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Традиционное и семантически ёмкое соответствие, сохраняющее как смысл благоволения, так и богословскую насыщенность Павлова приветствия.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж естественно передаёт адресата благословения без добавочного предлога.
- source_word: εἰρήνη
  choice: мир
  rationale: Естественное и устойчивое соответствие, сохраняющее оттенки целостности, благополучия и примирённых отношений.
- source_word: ἀπὸ
  choice: от
  rationale: Прямо обозначает источник благодати и мира и в русском предложении относится к обоим последующим наименованиям.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Бога, нашего Отца
  rationale: Приложение передано ясной современной русской конструкцией; «нашего» относится к «Отца», как и ἡμῶν в греческом тексте.
- source_word: κυρίου
  choice: Господа
  rationale: Устойчиво передаёт κύριος как титул, сохраняя его высокий и богословски значимый регистр.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передан по значению как титул «Мессия»; в русском языке определённость титула не требует артикля. Традиционное «Христос» указано в сноске.
theological_decisions:
- issue: Относится ли единый источник благодати и мира и к Богу Отцу, и к Господу Иисусу Мессии
  choice: Один предлог «от» управляет обоими однородными наименованиями.
  alternative: Повторить «от» перед «Господа Иисуса Мессии» или перестроить фразу.
  rationale: В греческом тексте один предлог ἀπό охватывает обе соединённые союзом καί части. Русский перевод сохраняет эту координацию, не добавляя богословского толкования.
- issue: Передача Χριστός как титула или традиционного имени
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» раскрывает исходное титульное значение Χριστός. Поскольку в формуле приветствия возможно восприятие слова и как закрепившегося имени, традиционный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Порядок слов близок к греческому, но приложение «нашего Отца» оформлено естественно для современного читателя.
