  source_fidelity: Текст точно передаёт три риторических вопроса оригинала. «Разделён» адекватно выражает результативное состояние перфекта μεμέρισται; «был распят» сохраняет страдательный залог ἐσταυρώθη; «за вас» естественно передаёт ὑπὲρ ὑμῶν без богословского сужения. «Во имя Павла» — нормативная русская передача крещальной формулы εἰς τὸ ὄνομα, а примечание корректно отмечает более формально близкий вариант.
