id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: ru
  text: Разве Мессия разделён? Разве Павел был распят за вас? Или вы были крещены во имя Павла?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в имя Павла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: разделён
  rationale: Краткая естественная формулировка передаёт перфектное состояние, возникшее в результате разделения, и сохраняет риторический упрёк Павла.
- source_word: ὁ Χριστός
  choice: Мессия
  rationale: 'Артикль подчёркивает титульное употребление: речь идёт о Мессии. В русском определённость не требует отдельного артикля.'
- source_word: μὴ
  choice: разве
  rationale: «Разве» естественно обозначает риторический вопрос, предполагающий отрицательный ответ, не превращая его в прямое утверждение.
- source_word: ἐσταυρώθη
  choice: был распят
  rationale: Прямо и идиоматично передаёт аорист страдательного залога.
- source_word: ὑπὲρ ὑμῶν
  choice: за вас
  rationale: Естественная русская формулировка сохраняет значение действия ради или в пользу адресатов, не сужая его богословский смысл.
- source_word: ἐβαπτίσθητε
  choice: вы были крещены
  rationale: Сохраняет страдательный залог и вопросительную форму оригинала.
- source_word: εἰς τὸ ὄνομα
  choice: во имя
  rationale: Это устойчивое и понятное русское выражение для крещальной формулы; возможный более буквальный вариант «в имя» приведён в примечании, поскольку он сильнее передаёт направленность εἰς.
theological_decisions:
- issue: Передача ὁ Χριστός в риторическом вопросе Павла
  choice: Мессия
  alternative: Христос
  rationale: Артикль допускает ясно титульное прочтение; «Мессия» раскрывает смысл греческого титула, тогда как традиционное «Христос» возможно, но в русском чаще воспринимается как имя.
- issue: Передача εἰς τὸ ὄνομα в контексте крещения
  choice: во имя
  alternative: в имя
  rationale: «Во имя» — естественная современная русская формула. «В имя» формально точнее отражает εἰς и может подчёркивать вступление в связь или принадлежность, однако звучит неестественно и может отвлекать читателя.
translation_notes:
  register: Современный литературный русский язык; три параллельных риторических вопроса сохранены. Повтор «разве» в первых двух вопросах делает ожидаемый отрицательный ответ явным и звучит естественно; перед третьим сохранено противопоставляющее «или».
