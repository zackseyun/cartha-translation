  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: ru
  text: Ибо Божья глупость мудрее людей, и Божья слабость сильнее людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: Божья немудрость
  rationale: Субстантивированное прилагательное передано абстрактным существительным; «немудрость» сохраняет риторический парадокс, не приписывая Богу прямого безумия.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: мудрее людей
  rationale: Сравнительная конструкция передана прямо и естественно; ἄνθρωποι означает людей вообще, а не только мужчин.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: Божья слабость
  rationale: Сохраняется параллелизм с первой частью и намеренно парадоксальная формулировка оригинала.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: сильнее людей
  rationale: Прямая передача сравнительной конструкции с сохранением смыслового и ритмического параллелизма.
theological_decisions:
- issue: Парадоксальное приписывание Богу «немудрости» и «слабости»
  choice: Сохранить риторический парадокс без поясняющих добавлений
  alternative: То, что кажется немудрым/слабым в Божьих делах
  rationale: Контекст разъясняет парадокс, однако сам стих формулирует его предельно сжато; добавление «кажется» сняло бы намеренное напряжение текста.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная и достойная формулировка. «Немудрость» выбрана вместо более резкого «глупость», чтобы естественно передать τὸ μωρόν в генитивной конструкции и сохранить богословский парадокс.
