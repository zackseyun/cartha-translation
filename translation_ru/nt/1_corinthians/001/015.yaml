lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение союза в данном контексте.
- source_word: μή τις
  choice: никто не
  rationale: Отрицательное неопределённое сочетание идиоматично передаётся по-русски конструкцией «никто не».
- source_word: εἴπῃ
  choice: не сказал
  rationale: Аорист конъюнктива после ἵνα обозначает предполагаемое высказывание; русская конструкция с «чтобы» естественно требует формы прошедшего времени совершенного вида.
- source_word: εἰς
  choice: в
  rationale: В сочетании «крещены в моё имя» предлог «в» сохраняет направительное значение греческого εἰς и звучит естественно в современном русском языке.
- source_word: τὸ ἐμὸν ὄνομα
  choice: моё имя
  rationale: Прямо и естественно передаёт притяжательную конструкцию.
- source_word: ἐβαπτίσθητε
  choice: вы были крещены
  rationale: Сохраняет явно выраженный пассив греческой формы и использует нейтральный, общепринятый термин без уточнения способа крещения.
theological_decisions:
- issue: Передача εἰς τὸ ἐμὸν ὄνομα в контексте крещения
  choice: в моё имя
  alternative: моим именем / во имя моё
  rationale: Формулировка «в моё имя» сохраняет направительно-реляционный оттенок εἰς и необычность греческого выражения, не сводя его только к совершению обряда чьей-либо властью. Вариант «во имя моё» более традиционен и идиоматичен, но может затушевать отличие εἰς от ἐν.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и ясный. Сохранены пассивная форма и богословски значимая направительность выражения εἰς τὸ ἐμὸν ὄνομα.
