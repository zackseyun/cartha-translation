  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: ru
  text: 'Призываю вас, братья[a], именем Господа нашего Иисуса Мессии[b]: говорите все одно и то же, и пусть не будет между вами разделений[c], но будьте соединены[d] в одном образе мыслей и в одном суждении[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое существительное мужского рода во множественном числе могло обозначать всю верующую общину.'
    reason: cultural_note
  - marker: b
    text: 'Традиционно: «Христа»; греческое слово означает «Помазанник», то есть «Мессия».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «расколов».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «будьте восстановлены»; употреблённое греческое слово может описывать исправление или соединение разорванного.'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «убеждении» или «мнении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Призываю
  rationale: Передаёт настойчивое пастырское обращение, не превращая его ни в простую просьбу, ни в резкий приказ.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; возможный охват всей общины пояснён в сноске.
- source_word: διὰ τοῦ ὀνόματος
  choice: именем
  rationale: Естественная русская формула обращения со ссылкой на авторитет Иисуса; передаёт διά с родительным как основание или средство увещания.
- source_word: κυρίου
  choice: Господа
  rationale: Обычное и контекстуально точное обозначение власти и достоинства Иисуса.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт смысл титула «Помазанник», а не только его традиционную транслитерацию.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: говорите все одно и то же
  rationale: Сохраняет конкретный образ общей речи и согласия, не сводя выражение к отвлечённому «будьте согласны».
- source_word: σχίσματα
  choice: разделений
  rationale: Ясно и естественно обозначает расколы и разрывы внутри общины без излишне специального церковного оттенка.
- source_word: κατηρτισμένοι
  choice: будьте вновь соединены
  rationale: Передаёт страдательное значение приведённости в надлежащее, восстановленное единство в контексте уже возникших разногласий.
- source_word: νοῒ
  choice: образе мыслей
  rationale: Передаёт νοῦς как мышление или внутреннее понимание и позволяет отличить его от следующего γνώμη.
- source_word: γνώμῃ
  choice: суждении
  rationale: Сохраняет значение оценки, убеждения или принятой позиции, не отождествляя его полностью с образом мыслей.
theological_decisions:
- issue: Передача христологического титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В сочетании с именем Иисуса слово сохраняет титульный смысл «Помазанник»; традиционный вариант указан в сноске.
- issue: Охват обращения ἀδελφοί
  choice: «братья» в основном тексте с пояснением в сноске
  alternative: «братья и сёстры»
  rationale: Основной текст сохраняет грамматическую форму оригинала, а сноска отмечает, что обращение могло относиться ко всей верующей общине.
- issue: Характер требуемого единства
  choice: единство речи, мышления и суждения без уточнения полного тождества всех мнений
  alternative: общее согласие
  rationale: Сохранена напряжённая и конкретная формулировка Павла; перевод не смягчает её и не превращает в доктринальное требование, выходящее за рамки стиха.
translation_notes:
  register: Современный литературный русский язык с достойной, но не архаичной интонацией. Повелительные формы после двоеточия естественно передают греческую конструкцию ἵνα с сослагательным значением призыва. Лексическое различие между νοῦς и γνώμη сохранено как «образ мыслей» и «суждение».
