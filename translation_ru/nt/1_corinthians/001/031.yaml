lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результирующее значение, связанное с предыдущим контекстом, не устраняя присущую греческому союзу смысловую широту.
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Естественная для современного русского языка формула введения цитаты из Писания; греческий перфект подразумевает сохраняющуюся силу написанного.
- source_word: Ὁ καυχώμενος
  choice: Кто хвалится
  rationale: Естественно передаёт субстантивированное причастие и сохраняет общий характер высказывания.
- source_word: ἐν κυρίῳ
  choice: Господом
  rationale: Русский творительный падеж идиоматично выражает основание и предмет похвалы; буквальное «в Господе» возможно, но здесь менее естественно и может затемнять смысл цитаты.
- source_word: καυχάσθω
  choice: пусть хвалится
  rationale: Передаёт повелительное наклонение прямо и современно, без усиления до категорического «должен».
theological_decisions:
- issue: Сила повелительного καυχάσθω
  choice: пусть хвалится
  alternative: должен хвалиться
  rationale: Форма «пусть хвалится» сохраняет грамматическую императивность оригинала и не превращает её в модальное утверждение.
- issue: Значение ἐν κυρίῳ в цитате
  choice: Господом
  alternative: в Господе
  rationale: Творительный падеж ясно направляет допустимую похвалу от человека к Господу, не добавляя конфессионально обусловленного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка, подходящая для цитаты из Писания. Маркер сноски поставлен после цитаты.
