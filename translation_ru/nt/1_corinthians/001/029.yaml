  source_fidelity: Текст точно передаёт целевое значение ὅπως («чтобы»), всеобщее исключение в πᾶσα σὰρξ при отрицании («никакая плоть»), значение καυχήσηται («не хвалилась») и ἐνώπιον τοῦ θεοῦ («перед Богом»). Сослагательная форма «хвалилась» после «чтобы» естественно выражает греческий конъюнктив в целевом придаточном.
