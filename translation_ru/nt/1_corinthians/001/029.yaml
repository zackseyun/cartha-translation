  text: so that no flesh may boast before God[a].
translation:
  language: ru
  text: чтобы никакая плоть не хвалилась перед Богом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ни один человек не хвалился перед Богом». Буквально: «никакая плоть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое, а в данном контексте также результативное значение союза естественной русской конструкцией.
- source_word: μὴ καυχήσηται
  choice: не хвалилась
  rationale: Отрицание с конъюнктивом в целевом придаточном передано русским сослагательным значением после «чтобы»; «хвалиться» точно и современно выражает самовосхваление.
- source_word: πᾶσα σὰρξ
  choice: никакая плоть
  rationale: При отрицании сочетание имеет смысл всеобщего исключения. «Плоть» сохраняет образность и риторическую силу греческого выражения, а не истолковывает его как «греховную природу».
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Краткое и естественное русское соответствие со значением «в присутствии Бога».
theological_decisions:
- issue: Передача слова σάρξ в контексте Павловых посланий
  choice: «плоть»
  alternative: «человек» / «люди» / «греховная природа»
  rationale: Здесь речь идёт не о внутреннем греховном начале, а обо всём смертном и слабом человечестве перед Богом. Буквальное «плоть» сохраняет богословское напряжение и библейскую образность; более ясный антропологический смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением характерной библейской метафоры «плоть». Оборот «никакая плоть» намеренно несколько необычен, но понятен из сноски и воспроизводит риторику оригинала.
