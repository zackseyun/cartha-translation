lexical_decisions:
- source_word: καθὼς
  choice: как
  rationale: Союз вводит соответствие с предыдущей мыслью; в русском контексте простое «как» естественно и сохраняет связующую функцию.
- source_word: μαρτύριον
  choice: свидетельство
  rationale: Передаёт как свидетельское подтверждение, так и провозглашаемую весть, не сводя значение лишь к «сообщению».
- source_word: τοῦ Χριστοῦ
  choice: о Мессии
  rationale: 'Родительный падеж понят как объектный: речь идёт о свидетельстве, содержание которого — Мессия. Χριστός передан как титул «Мессия».'
- source_word: ἐβεβαιώθη
  choice: утвердилось
  rationale: Аорист пассивного залога обозначает, что свидетельство было сделано твёрдым, подтверждено; русское «утвердилось» естественно передаёт достигнутый результат, не уточняя способ подтверждения.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: При обращении к общине выражение естественно указывает на утверждение свидетельства в среде коринфян; буквальное «в вас» остаётся возможным.
theological_decisions:
- issue: Значение родительного оборота τοῦ Χριστοῦ
  choice: 'объектный родительный: «свидетельство о Мессии»'
  alternative: 'субъектный или исходный родительный: «свидетельство Мессии»'
  rationale: Контекст допускает понимание апостольского свидетельства о Мессии, принятого и подтверждённого у коринфян. Грамматическая неоднозначность сохранена в сноске.
- issue: Сфера утверждения в ἐν ὑμῖν
  choice: 'общинное значение: «среди вас»'
  alternative: 'внутреннее или личное значение: «в вас»'
  rationale: Множественное ὑμῖν и обращение к коринфской общине поддерживают общинный смысл, однако предлог ἐν позволяет также буквальное «в вас».
translation_notes:
  register: Современный литературный русский язык, сжатый и достойный библейского контекста. Порядок сносок соответствует месту неоднозначных выражений; все маркеры присутствуют в основном тексте.
