lexical_decisions:
- source_word: εὐχαριστῶ
  choice: Благодарю Бога
  rationale: Настоящее время передано естественной русской формулой благодарения. Дополнение «Бога» отражает хорошо засвидетельствованный вариант текста и обычного адресата благодарения у Павла; его текстовая неопределённость отмечена в сноске.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание благодарности и естественно передаётся русским «что».
- source_word: οὐδένα ὑμῶν
  choice: никого из вас
  rationale: Точно и идиоматично передаёт отрицательное объектное словосочетание.
- source_word: ἐβάπτισα
  choice: крестил
  rationale: Стандартный новозаветный эквивалент, не навязывающий конфессионального понимания способа крещения.
- source_word: εἰ μὴ
  choice: кроме
  rationale: В данной ограничительно-исключительной конструкции естественно означает «кроме».
- source_word: Κρίσπον
  choice: Криспа
  rationale: Традиционная и узнаваемая русская передача личного имени с требуемым винительным падежом.
- source_word: Γάϊον
  choice: Гая
  rationale: Традиционная русская передача личного имени с требуемым винительным падежом.
