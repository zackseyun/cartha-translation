id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: ru
  text: Ведь мне стало известно о вас, братья мои[a], от людей Хлои, что между вами есть распри.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры мои». В греческом тексте стоит слово «братья», которое может включительно обозначать всю общину верующих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: мне стало известно
  rationale: 'Естественно передаёт безлично-пассивный смысл: сведения были сообщены Павлу, без уточнения способа сообщения.'
- source_word: γάρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предшествующим призывом и звучит естественно в современном русском.
- source_word: περὶ ὑμῶν
  choice: о вас
  rationale: Прямой и современный эквивалент предложного оборота.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохраняет грамматически мужскую форму греческого обращения; вероятное обращение ко всей общине поясняется в сноске.
- source_word: ὑπὸ τῶν Χλόης
  choice: от людей Хлои
  rationale: Передаёт лиц, связанных с Хлоей, не сужая неопределённое выражение до её семьи или домашних.
- source_word: ἔριδες
  choice: распри
  rationale: Точно обозначает межличностные столкновения и раздоры, не смешивая их с более широким понятием разделений в контексте.
- source_word: ἐν ὑμῖν εἰσιν
  choice: между вами есть
  rationale: Естественно передаёт наличие распрей внутри общины.
theological_decisions:
- issue: Значение ἀδελφοί при обращении к общине, включавшей мужчин и женщин
  choice: братья мои
  alternative: братья и сёстры мои
  rationale: Основной текст сохраняет форму исходного обращения, а возможный включительный охват всей верующей общины явно отмечен в сноске, без устранения лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. «Люди Хлои» намеренно не конкретизируется как «домашние Хлои», поскольку исходное выражение шире.
