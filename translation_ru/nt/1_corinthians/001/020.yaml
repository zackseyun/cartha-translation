id: 1CO.1.20
reference: 1 Corinthians 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: ru
  text: Где мудрец?[a] Где книжник? Где спорщик нынешнего века?[b] Разве Бог не сделал мудрость мира глупостью?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрый человек». В греческом тексте стоит форма мужского рода в единственном числе, вероятно представляющая всю группу.'
    reason: lexical_alternative
  - marker: b
    text: «Нынешнего века» передаёт другое греческое слово, чем «мира» далее в этом стихе.
    reason: cross_reference
  - marker: c
    text: 'Или: «Разве Бог не показал, что мудрость мира глупа?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Где
  rationale: Сохраняет повторяющийся риторический вызов «Где…?», обращённый к названным далее представителям человеческой мудрости.
- source_word: σοφός
  choice: мудрец
  rationale: Естественно передаёт субстантивированное прилагательное мужского рода в единственном числе; здесь оно, вероятно, обозначает типичного представителя целой группы.
- source_word: γραμματεύς
  choice: книжник
  rationale: Прямой исторически и библейски узнаваемый эквивалент; не сужает значение до современного учёного и сохраняет конкретность греческого слова.
- source_word: συζητητής
  choice: спорщик
  rationale: Передаёт человека, участвующего в рассуждениях и спорах; слово понятно современному читателю и сохраняет полемическую окраску контекста.
- source_word: τοῦ αἰῶνος τούτου
  choice: нынешнего века
  rationale: Передаёт αἰών как временную эпоху и отличает его от κόσμος далее в стихе; «нынешнего» естественно выражает указательное τούτου.
- source_word: οὐχὶ
  choice: Разве … не
  rationale: Естественная русская форма риторического вопроса, предполагающего утвердительный ответ.
- source_word: ἐμώρανεν
  choice: сделал … глупостью
  rationale: 'Сохраняет каузативную силу глагола: Бог сделал мирскую мудрость глупостью; возможное доказательное понимание вынесено в примечание.'
- source_word: σοφίαν
  choice: мудрость
  rationale: Стандартный и контекстуально точный эквивалент, поддерживающий ключевой контраст отрывка.
- source_word: κόσμου
  choice: мира
  rationale: Передаёт κόσμος отдельно от αἰών и сохраняет различие двух греческих понятий в одном стихе.
theological_decisions:
- issue: Различение αἰών и κόσμος в одном стихе
  choice: αἰών передано как «век», а κόσμος — как «мир»
  alternative: Передать оба слова как «мир» ради более привычного звучания
  rationale: Павел употребляет два разных греческих слова. Их различение сохраняет смысловую напряжённость между нынешней эпохой и мудростью мира.
- issue: Каузативное или доказательное понимание ἐμώρανεν
  choice: 'Основной текст: «сделал … глупостью»'
  alternative: «показал, что … глупа»
  rationale: Основной вариант точнее сохраняет формальную каузативность греческого глагола, а примечание указывает допустимое контекстуальное понимание, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической энергией оригинала. Троекратное «Где…?» сохранено; «книжник» поддерживает историко-библейскую конкретность, а различие «век»/«мир» отражает разные греческие термины.
