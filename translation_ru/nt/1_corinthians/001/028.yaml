  source_fidelity: 'Текст точно передаёт греческую структуру и лексику: «незнатное» отражает ἀγενῆ с его социальным оттенком, «презираемое» — ἐξουθενημένα, а «то, чего нет» / «то, что есть» сохраняет намеренно резкую и не до конца сведённую к одному толкованию антитезу τὰ μὴ ὄντα / τὰ ὄντα. «Свести на нет» адекватно передаёт καταργήσῃ как лишение действенности или значимости.'
