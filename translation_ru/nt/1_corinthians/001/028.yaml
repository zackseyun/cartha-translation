id: 1CO.1.28
reference: 1 Corinthians 1:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: ru
  text: И незнатное в мире, и презираемое избрал Бог — то, чего нет[a], — чтобы свести на нет[b] то, что есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что считается ничем».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лишить силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: незнатное в мире
  rationale: Прилагательное указывает на отсутствие знатного происхождения или высокого общественного положения. «Незнатное» естественно передаёт этот социальный оттенок и согласуется с субстантивированным средним родом греческого текста.
- source_word: ἐξουθενημένα
  choice: презираемое
  rationale: Перфектное причастие обозначает то, к чему отнеслись с презрением, как к не имеющему ценности. «Презираемое» кратко и точно сохраняет этот смысл.
- source_word: τὰ μὴ ὄντα
  choice: то, чего нет
  rationale: 'Близкая передача намеренно резкого выражения Павла сохраняет его двусмысленность: речь может идти как о небытии в риторическом смысле, так и о людях или явлениях, которые в глазах мира ничего не значат.'
- source_word: τὰ ὄντα
  choice: то, что есть
  rationale: Буквальная формулировка сохраняет симметричное противопоставление выражению «то, чего нет» и не сужает его заранее до общественного статуса.
- source_word: καταργήσῃ
  choice: свести на нет
  rationale: Выражение передаёт идею лишения действенности или значения, не утверждая непременно буквального уничтожения, и естественно звучит в современном русском языке.
- source_word: ἐξελέξατο
  choice: избрал
  rationale: «Избрал» — естественный и достойный по регистру эквивалент, передающий целенаправленное действие Бога и повторяемый в контексте глагол.
theological_decisions:
- issue: Следует ли понимать τὰ μὴ ὄντα / τὰ ὄντα в основном тексте только как общественные категории или как абсолютные онтологические высказывания?
  choice: 'Сохранить буквальное противопоставление: «то, чего нет» / «то, что есть».'
  alternative: 'Передать толковательно: «тех, кто ничего не значит» / «тех, кто считается значительным».'
  rationale: Контекст связан с положением людей в глазах мира, однако формулировка Павла шире и риторически острее. Близкий перевод сохраняет и социальный смысл, и намеренное напряжение текста, не навязывая единственного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы среднего рода передают греческие субстантивированные прилагательные и одновременно допускают отнесение к людям и общественным категориям. Парные тире обозначают пояснительное приложение и сохраняют ясность длинной синтаксической конструкции.
