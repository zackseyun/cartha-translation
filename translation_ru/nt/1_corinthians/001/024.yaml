  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: ru
  text: А для самих призванных — как иудеев, так и греков — Мессия[a] есть Божья сила и Божья мудрость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῖς δὲ τοῖς κλητοῖς
  choice: А для самих призванных
  rationale: Субстантивированное κλητοῖς передано словом «призванных», сохраняющим смысл Божьего призвания; αὐτοῖς отражено усилительным «самих», а δέ — противительным «а».
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: как иудеев, так и греков
  rationale: Парная конструкция точно передаёт τε καὶ. «Иудеи» здесь обозначает этнорелигиозную общность, а «греки» сохраняет буквальную широту обычного для Павла противопоставления, не подменяя его толкованием «язычники».
- source_word: Χριστόν
  choice: Мессия
  rationale: Χριστός здесь имеет силу титула; «Мессия» передаёт его смысл, а не просто воспроизводит традиционную транслитерацию.
- source_word: θεοῦ δύναμιν
  choice: Божья сила
  rationale: Русское притяжательное прилагательное естественно и точно передаёт родительный θεοῦ.
- source_word: θεοῦ σοφίαν
  choice: Божья мудрость
  rationale: Повтор «Божья» сохраняет параллелизм и повтор θεοῦ в греческом тексте.
- source_word: implicit copula / verbless predicate relation
  choice: Мессия есть Божья сила и Божья мудрость
  rationale: Связка «есть» восполняет подразумеваемое предикативное отношение и позволяет стиху ясно звучать отдельно, не превращая утверждение в приложение.
theological_decisions:
- issue: Передача христологического титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово функционирует как титул. «Мессия» раскрывает его исходное значение, не добавляя конфессионального толкования; традиционный вариант указан в сноске.
- issue: Характер утверждения о силе и мудрости Бога
  choice: 'Предикативное: Мессия есть Божья сила и Божья мудрость'
  alternative: 'Аппозитивное: Мессию — Божью силу и Божью мудрость'
  rationale: Греческая фраза эллиптична и синтаксически продолжается из предыдущего стиха. Для самостоятельного русского стиха восполненная связка ясно передаёт предикативную силу, не уточняя сверх текста, каким именно образом следует понимать это отождествление.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Есть» выбрано как ясная, слегка торжественная связка; тире выделяют уточняющий охват призванных и облегчают чтение сложной структуры.
