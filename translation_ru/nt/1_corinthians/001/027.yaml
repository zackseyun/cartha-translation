base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: ru
  text: Но Бог избрал то, что в мире считается глупым,[a] чтобы посрамить мудрых; и то, что в мире считается слабым,[b] избрал Бог, чтобы посрамить сильное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глупое мира»; в греческом стоит субстантивированное прилагательное среднего рода во множественном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слабое мира»; в греческом также употреблено субстантивированное прилагательное среднего рода во множественном числе. В конце стиха «сильное» имеет ту же грамматическую форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт резкое противопоставление предыдущей мысли естественным русским союзом.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: то, что мир считает глупым
  rationale: Средний род множественного числа употреблён субстантивированно. Такая формулировка сохраняет неопределённость референта и естественно выражает оценочную перспективу мира.
- source_word: ἐξελέξατο
  choice: избрал
  rationale: Точно передаёт намеренный выбор Бога и соответствует возвышенному, но понятному библейскому регистру.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое значение греческой конструкции.
- source_word: καταισχύνῃ
  choice: посрамить
  rationale: Передаёт значение публично пристыдить или привести к стыду; сохраняет риторическую силу текста.
- source_word: τοὺς σοφούς
  choice: мудрых
  rationale: Субстантивированное прилагательное мужского рода обозначает людей, считающихся мудрыми, без необходимости добавлять существительное.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: то, что мир считает слабым
  rationale: Сохраняет субстантивированный средний род и параллелизм с первой частью, не сужая смысл исключительно до людей или предметов.
- source_word: τὰ ἰσχυρά
  choice: сильных
  rationale: По контексту антитеза с «мудрыми» допускает естественное русское обозначение носителей силы; грамматическая особенность оригинала отмечена в сноске.
theological_decisions:
- issue: Относится ли выбор только к людям или также к безличным средствам и обстоятельствам
  choice: Сохранена широкая формулировка «то, что…», не ограничивающая референт людьми.
  alternative: «глупых» и «слабых» — исключительно о людях
  rationale: Греческие τὰ μωρά и τὰ ἀσθενῆ стоят в среднем роде множественного числа и допускают более широкий референт; его не следует преждевременно сужать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Повтор «Бог избрал» сохранён ради акцента и параллелизма оригинала; «посрамить» выбрано как ёмкое и понятное соответствие καταισχύνῃ.
