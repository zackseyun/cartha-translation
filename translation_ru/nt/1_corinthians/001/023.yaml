lexical_decisions:
- source_word: κηρύσσομεν
  choice: проповедуем
  rationale: Естественно передаёт публичное возвещение апостольской вести и соответствует современному литературному русскому употреблению.
- source_word: Χριστὸν
  choice: Мессию
  rationale: В данном контексте слово выступает как титул и обозначает мессианское достоинство Иисуса; вариант «Христа» отмечен в сноске.
- source_word: ἐσταυρωμένον
  choice: распятого
  rationale: Кратко и естественно передаёт перфектное страдательное причастие, представляя Мессию как Того, кто был распят.
- source_word: Ἰουδαίοις
  choice: для иудеев
  rationale: Передаёт этнорелигиозную группу в риторическом противопоставлении язычникам.
- source_word: σκάνδαλον
  choice: камень преткновения
  rationale: Сохраняет метафору препятствия, о которое спотыкаются, не сводя значение лишь к чувству оскорбления.
- source_word: ἔθνεσιν
  choice: для язычников
  rationale: В противопоставлении иудеям речь идёт о неиудейских народах; буквальное значение «народам» указано в сноске.
- source_word: μωρίαν
  choice: безумие
  rationale: Передаёт отрицательную оценку вести как нелепой или лишённой смысла и сохраняет связь с лексикой ближайшего контекста.
theological_decisions:
- issue: Передача Χριστός как титула или как ставшего именем обозначения
  choice: Мессия
  alternative: Христос
  rationale: Контекст определяет содержание апостольской проповеди и подчёркивает парадокс распятого Помазанника, поэтому титульное значение уместно сохранить явно.
- issue: Характер σκάνδαλον
  choice: камень преткновения
  alternative: соблазн; оскорбление
  rationale: Выбранный вариант сохраняет образ того, что заставляет споткнуться, не уточняя сверх текста, является ли реакция прежде всего неверием, оскорблением или отвержением.
translation_notes:
  register: Современный литературный русский, краткий и торжественный без архаизации. Параллелизм двух групп подчёркнут тире; двоеточие естественно вводит их различную оценку проповедуемого распятого Мессии.
