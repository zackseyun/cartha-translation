source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: ru
  text: 'Ведь написано: «Погублю мудрость мудрых и разум разумных отвергну[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «упраздню»; «сведу на нет».'
    reason: Глагол ἀθετέω может обозначать отвержение, отмену или лишение силы.
lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся русская формула введения цитаты из Писания; передаёт сохраняющийся результат перфекта страдательного залога.
- source_word: γάρ
  choice: ведь
  rationale: Естественно выражает обоснование предыдущей мысли Павла и сохраняет связность рассуждения.
- source_word: Ἀπολῶ
  choice: погублю
  rationale: Передаёт сильное значение будущей формы ἀπόλλυμι — уничтожить, привести к гибели или краху; сочетание с «мудростью» уместно в возвышенной пророческой цитате.
- source_word: σοφίαν τῶν σοφῶν
  choice: мудрость мудрых
  rationale: Сохраняет однокоренной риторический повтор и генитивную конструкцию греческого текста.
- source_word: σύνεσιν τῶν συνετῶν
  choice: разум разумных
  rationale: Сохраняет параллелизм и однокоренную игру слов исходного текста; «разум» здесь означает способность понимать и рассуждать.
- source_word: ἀθετήσω
  choice: отвергну
  rationale: Передаёт решение Бога отклонить и лишить силы человеческое разумение, не устраняя присущую глаголу многозначность; альтернативы отмечены в сноске.
theological_decisions:
- issue: Передача пророческой цитаты и Божьего действия по отношению к человеческой мудрости
  choice: Сохранить прямые будущие формы «погублю» и «отвергну» без поясняющего истолкования
  alternative: 'Передать более толковательно: «сведу на нет» или «лишу силы»'
  rationale: Так сохраняются сила риторического противопоставления и напряжение исходного текста без добавления конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Инверсия «разум разумных отвергну» сохраняет параллелизм и торжественный ритм, оставаясь понятной современному читателю.
