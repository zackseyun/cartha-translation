  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: ru
  text: Но от Него и вы — в Мессии Иисусе, который стал для нас мудростью от Бога и праведностью[a], и освящением, и искуплением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливостью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: от Него
  rationale: 'Сохраняет значение источника или происхождения: пребывание верующих в Мессии Иисусе исходит от Бога.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог «в» сохраняет характерный для Павла оборот, не сводя его к пояснительному пересказу; Χριστός передан как титул «Мессия».
- source_word: ἐγενήθη
  choice: стал
  rationale: Прямо и естественно передаёт значение γίνομαι в данном контексте.
- source_word: σοφία
  choice: мудростью
  rationale: Соответствует непосредственному контексту противопоставления человеческой и Божьей мудрости.
- source_word: ἀπὸ θεοῦ
  choice: от Бога
  rationale: Сохраняет значение источника и линейный порядок греческой фразы, не заменяя его толкованием «данной Богом».
- source_word: δικαιοσύνη
  choice: праведностью
  rationale: В данном сотериологическом контексте это наиболее естественное соответствие; возможное значение «справедливостью» сохранено в сноске.
- source_word: ἁγιασμός
  choice: освящением
  rationale: Устоявшийся и точный богословский эквивалент, передающий посвящение Богу и обретение святости.
- source_word: ἀπολύτρωσις
  choice: искуплением
  rationale: Передаёт освобождение ценой выкупа и соответствует употреблению слова в сотериологическом контексте.
theological_decisions:
- issue: Связь выражения «мудростью от Бога» с последующими тремя существительными
  choice: 'Сохранён последовательный ряд: «мудростью от Бога, и праведностью, и освящением, и искуплением».'
  alternative: Считать три последних существительных пояснением того, в чём именно состоит мудрость от Бога, либо распространить слова «от Бога» одинаково на все четыре понятия.
  rationale: Такой синтаксис близок к греческому порядку слов и не устраняет неоднозначность относительно точной связи членов перечисления.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного апостольского регистра. Тире после «вы» помогает естественно передать именную конструкцию без добавления отсутствующего в греческом смыслового глагола; повтор союза «и» сохраняет риторический строй перечисления.
