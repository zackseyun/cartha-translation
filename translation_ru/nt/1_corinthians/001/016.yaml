  text: ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: ru
  text: Крестил я также домашних Стефана[a]. Кроме этого, не знаю, крестил ли я ещё кого-нибудь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом Стефана». Греческое слово может обозначать домашнее сообщество, а не только здание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: крестил
  rationale: Глагол обозначает совершение крещения; стандартный русский эквивалент не уточняет способ совершения обряда.
- source_word: δὲ καὶ
  choice: также и
  rationale: Сочетание имеет присоединительное значение и добавляет домашних Стефана к ранее упомянутым крещённым.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: домашних Стефана
  rationale: В данном контексте οἶκος означает дом как совокупность относящихся к нему людей, а не только здание; «домашних» сохраняет широту понятия и не сводит его к кровным родственникам.
- source_word: λοιπὸν
  choice: а кроме них
  rationale: Слово вводит остаточное уточнение после названного исключения; местоимение «них» естественно соотносится с собирательным обозначением домашних.
- source_word: οὐκ οἶδα
  choice: не знаю
  rationale: Перевод следует прямому значению греческого выражения, хотя из контекста понятно, что речь идёт о воспоминании.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: крестил ли я ещё кого-нибудь
  rationale: Косвенный вопрос с «ли» естественно передаёт неопределённость относительно других крещённых и сохраняет структуру исходного текста.
theological_decisions:
- issue: Состав οἶκος Стефана
  choice: Не уточнять, кто именно входил в число домашних.
  alternative: Перевести как «семью Стефана» или подразумевать определённые возрастные группы.
  rationale: Греческое οἶκος обозначает домашнее сообщество, но стих не перечисляет его членов; перевод не должен использоваться для разрешения споров о составе крещённого дома.
translation_notes:
  register: Современный литературный русский язык с естественным порядком слов. Начальное «Крестил я» передаёт характер добавочного уточнения в ходе воспоминания Павла; «домашних» употреблено в собирательном значении.
