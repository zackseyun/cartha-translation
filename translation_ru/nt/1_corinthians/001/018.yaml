id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: ru
  text: Ведь весть о кресте для погибающих — безумие, а для нас, спасаемых, — сила Божья.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово о кресте». Формы «погибающих» и «спасаемых» представляют погибель и спасение как происходящую реальность.'
    reason: lexical_alternative_and_aspect
lexical_decisions:
- source_word: λόγος
  choice: весть
  rationale: В данном контексте слово обозначает возвещаемое содержание о кресте; «весть» естественно звучит по-русски и не сводит смысл к отдельному слову или высказыванию.
- source_word: σταυροῦ
  choice: о кресте
  rationale: Сохранён буквальный и ёмкий образ креста, который метонимически указывает на распятие Христа, без разъясняющей вставки в основной текст.
- source_word: ἀπολλυμένοις
  choice: для погибающих
  rationale: Причастие настоящего времени передаёт продолжающееся состояние или процесс; «погибающих» сохраняет этот аспект и звучит естественно.
- source_word: μωρία
  choice: безумие
  rationale: «Безумие» ясно передаёт презрительную оценку вести как нелепой и сохраняет резкий контраст с Божьей силой.
- source_word: σῳζομένοις
  choice: для нас, спасаемых
  rationale: Форма «спасаемых» сохраняет процессуальный оттенок причастия настоящего времени и явно включает Павла и его адресатов благодаря ἡμῖν.
- source_word: δύναμις θεοῦ
  choice: сила Божья
  rationale: Естественная русская конструкция сохраняет богословскую весомость выражения и предикативный контраст с «безумием».
theological_decisions:
- issue: Аспект спасения в σῳζομένοις
  choice: для нас, спасаемых
  alternative: для нас, спасённых; для нас, которые спасаются
  rationale: Греческое причастие настоящего времени представляет спасение как совершающуюся реальность. Выбор не сводит спасение исключительно к уже завершённому событию и не уточняет сверх текста, кто именно совершает действие.
translation_notes:
  register: Современный литературный русский язык с краткой, риторически уравновешенной конструкцией. Тире подчёркивают параллель «безумие — сила Божья». «Божья» выбрано как естественное и достойное современное определение; сохранены компактность и напряжение греческого текста.
