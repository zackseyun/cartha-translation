review_pass:
  verdict: revise
  source_fidelity: Начальное «Посмотрите» удачно передаёт увещевательный оттенок Βλέπετε, а социальные категории в целом переданы верно. Однако τὴν κλῆσιν ὑμῶν означает «ваше призвание» (в павловском контексте — призвание Богом), а не «кто вы, призванные». Предложенная перестройка меняет прямой объект глагола и смещает акцент с призвания на состав адресатов. Кроме того, «влиятельных» несколько сужает δυνατοί, которое охватывает силу/могущество, не только общественное влияние.
  naturalness: Исправленный вариант сохраняет современный литературный строй и риторический повтор оригинала. «Обратите внимание на ваше призвание» естественно в контексте и, в отличие от «кто вы, призванные», не создаёт синтаксической двусмысленности. Форму «немного» следует писать слитно в значении «не многие».
  terminology: «Призвание» — устоявшийся и точный эквивалент κλῆσις; его возможная бытовая ассоциация с профессией не оправдывает отказ от прямого соответствия в данном церковно-апостольском контексте. «По человеческим меркам» адекватно передаёт κατὰ σάρκα как оценку с человеческой точки зрения. «Могущественных» лучше сохраняет широту δυνατοί, а «знатного происхождения» точно передаёт εὐγενεῖς. Сноска к «братья» корректна и привязана к существующему якорю.
  issues:
  - severity: medium
    issue: τὴν κλῆσιν ὑμῶν передано как «кто вы, призванные».
    rationale: 'В греческом это прямое дополнение: «ваше призвание». Причастная конструкция заменяет понятие призвания характеристикой адресатов и не сохраняет исходную синтаксическую и смысловую фокусировку.'
  - severity: low
    issue: «Влиятельных» сужает δυνατοί.
    rationale: Слово обозначает сильных, могущественных или обладающих властью; влияние возможно, но не исчерпывает его значения.
  - severity: low
    issue: «Не много» в значении «не многие» требует слитного написания.
    rationale: 'В современном русском нормативно: «немного среди вас мудрых», то есть «не много людей».'
