  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: ru
  text: 'Обратите внимание на ваше призвание, братья[a]: немного среди вас мудрых по человеческим меркам, немного могущественных, немного знатного происхождения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «братья» относится ко всей общине и включает как верующих мужчин, так и женщин.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: Посмотрите
  rationale: Форма допускает изъявительное и повелительное понимание; в данном контексте естественно звучит как призыв обратить внимание и задуматься.
- source_word: τὴν κλῆσιν ὑμῶν
  choice: кто вы, призванные
  rationale: Буквальное «ваше призвание» в современном русском легко понять как профессию или жизненное предназначение. Контекст требует Божьего призыва и одновременно направляет взгляд на состав общины; причастная конструкция передаёт эту связь без добавления «Богом», отсутствующего в стихе.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранено грамматически мужское обращение оригинала; его коллективный охват всей общины пояснён в сноске.
- source_word: οὐ πολλοὶ σοφοὶ
  choice: не много среди вас мудрых
  rationale: «Среди вас» естественно раскрывает подразумеваемую отсылку к коринфской общине, не меняя смысла эллиптической конструкции.
- source_word: κατὰ σάρκα
  choice: по человеческим меркам
  rationale: Здесь выражение обозначает оценку с обычной человеческой точки зрения, а не буквальную плоть; выбранный вариант ясен современному читателю.
- source_word: δυνατοί
  choice: влиятельных
  rationale: В перечне общественного положения слово вероятнее указывает на людей, обладающих весом и властью; «влиятельных» естественнее русского «могущественных» применительно к членам общины.
- source_word: εὐγενεῖς
  choice: знатного происхождения
  rationale: Передаёт социальное происхождение и высокий род, не сводя значение к нравственному благородству.
theological_decisions:
- issue: Значение κλῆσις
  choice: Божий призыв, выраженный формой «кто вы, призванные»
  alternative: «ваше призвание»
  rationale: В Павловом контексте речь идёт не о занятии человека, а о призыве, которым Бог собрал верующих; при этом субъект призыва не добавлен прямо в основной текст.
- issue: Смысл κατὰ σάρκα
  choice: «по человеческим меркам»
  alternative: «по плоти»
  rationale: Контекст говорит о человеческой общественной оценке мудрости. Буквальный вариант мог бы ошибочно придать выражению этический смысл греховной плотской природы.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещевания. Повтор «не много» сохранён ради риторического ритма оригинала; социальные категории выражены естественно и без архаизации.
