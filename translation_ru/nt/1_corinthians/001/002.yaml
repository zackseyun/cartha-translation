language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: ru
  text: 'церкви Божьей, находящейся в Коринфе, — освящённым во Христе Иисусе, призванным быть святыми[a], вместе со всеми, кто во всяком месте — у них и у нас[b] — призывает имя нашего Господа Иисуса Христа:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «призванным святым»; возможно также: «святым по призванию».'
    reason: lexical_alternative
  - marker: b
    text: Сжатое греческое выражение может уточнять «место» («принадлежащее им и нам»); по другому пониманию, «Господа» («их и нашего»).
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: церкви Божьей
  rationale: «Церковь» — естественное и устойчивое русское обозначение общины верующих; форма «Божьей» сохраняет принадлежность Богу и звучит современно и достойно.
- source_word: ἡγιασμένοις
  choice: освящённым
  rationale: Совершенный страдательный причастный смысл передаёт совершённое над адресатами действие с сохраняющимся результатом.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: во Христе Иисусе
  rationale: Сохраняется характерный для Павла оборот единения «во Христе» и греческий порядок титула и имени.
- source_word: κλητοῖς ἁγίοις
  choice: призванным святым
  rationale: Переданы оба согласованных определения без добавления отсутствующего в греческом инфинитива; возможный смысловой оттенок отмечен в сноске.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: призывает имя
  rationale: Устойчивый библейский оборот передаёт обращение к Господу в исповедании, молитве и поклонении.
- source_word: κυρίου
  choice: Господа
  rationale: Традиционный и точный русский эквивалент κύριος в раннехристианском исповедальном контексте.
- source_word: Χριστοῦ
  choice: Христа
  rationale: «Христос» — укоренившаяся в русском языке передача греческого титула Χριστός, означающего Мессию, а не фамилию.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: во всяком месте — у них и у нас
  rationale: Естественная русская формулировка связывает уточнение с местом, а сноска сохраняет синтаксическую неоднозначность сжатого греческого выражения.
theological_decisions:
- issue: Смысл κλητοῖς ἁγίοις
  choice: призванным святым
  alternative: призванным быть святыми / святым по призванию
  rationale: Греческий текст ставит рядом два прилагательных и не уточняет явно, означает ли выражение статус призванных святых или призвание к святости; основной текст следует форме оригинала, а сноска обозначает смысловые варианты.
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: В современном литературном русском «Иисус Христос» и «Христос Иисус» являются естественными формами титула; выбор не отрицает его значения «Мессия» и не превращает его в фамилию.
- issue: К чему относится αὐτῶν καὶ ἡμῶν
  choice: 'к местам, где верующие призывают Господа: «у них и у нас»'
  alternative: 'к Господу: «их и нашему»'
  rationale: Положение генитивов допускает разные синтаксические связи. Основной текст выбирает наиболее ясное по контексту чтение, но альтернативу не устраняет и приводит в сноске.
translation_notes:
  register: Современный литературный русский с достоинством апостольского обращения. Двоеточие сохранено, поскольку стих составляет адресную часть продолжающегося приветствия. Тире разграничивают вложенные определения и делают длинную фразу понятной без устранения отмеченной в сноске неоднозначности.
