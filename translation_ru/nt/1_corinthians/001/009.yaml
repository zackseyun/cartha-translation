base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: ru
  text: Верен Бог, через Которого[a] вы были призваны к общению[b] с Его Сыном — Иисусом Мессией[c], нашим Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Которым».'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «участию» или «сопричастности».'
    reason: lexical_alternative
  - marker: c
    text: 'Греч. Χριστός — титул со значением «Мессия»; традиционно: «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: верен
  rationale: Предикативное прилагательное характеризует Бога как неизменно надёжного и верного; краткая форма «верен» естественно передаёт торжественный греческий порядок слов.
- source_word: δι’ οὗ
  choice: Которым
  rationale: Творительный падеж при страдательной конструкции естественно обозначает Бога как действующее лицо; примечание сохраняет более буквальное «через Которого».
- source_word: ἐκλήθητε
  choice: вы были призваны
  rationale: Страдательная форма сохраняет образ Божьего призвания и характерную для Павла богословскую насыщенность глагола, не сводя его к простому приглашению.
- source_word: κοινωνίαν
  choice: к общению
  rationale: «Общение» доступно современному читателю и передаёт отношение единения с Сыном; примечание отмечает заложенные в слове значения участия и сопричастности.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: с Его Сыном
  rationale: Русское управление «общение с кем-либо» естественно выражает отношение, обозначенное зависимым родительным падежом в греческом.
- source_word: Χριστοῦ
  choice: Мессией
  rationale: Χριστός передаётся как титул «Мессия», а не как непрозрачная транслитерация; творительный падеж согласован с приложением «Иисусом».
- source_word: κυρίου
  choice: Господом
  rationale: Стандартно и достойно передаёт христологический титул κύριος; форма согласована с приложением.
theological_decisions:
- issue: Следует ли понимать δι’ οὗ как непосредственное действующее лицо или как посредничество
  choice: Которым
  alternative: через Которого
  rationale: Контекст называет Бога совершающим призвание, однако διά с родительным падежом буквально допускает оттенок посредничества; он сохранён в примечании.
- issue: Передача Χριστός как традиционного «Христос» или как переведённого титула
  choice: Мессия
  alternative: Христос
  rationale: В сочетании Ἰησοῦ Χριστοῦ титульное значение остаётся смысловым; «Мессия» раскрывает его современному читателю, не добавляя конфессионального толкования.
- issue: Объём значения κοινωνία
  choice: общение
  alternative: участие / сопричастность
  rationale: Основной текст сохраняет естественное relational значение, а примечание предотвращает сужение смысла до одной лишь беседы или дружеского контакта.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным началом «Верен Бог». Прописные местоимения при обращении к Богу соответствуют принятому русскому библейскому регистру. Тире ясно вводит приложение к слову «Сыном», не устраняя синтаксической связи оригинала.
