  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: ru
  text: Ведь поскольку в Божьей мудрости мир не познал Бога через мудрость, Богу было угодно через безумие возвещаемого послания[a][b] спасти верующих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через безумие проповедования».'
    reason: alternative_reading
  - marker: b
    text: То есть безумием мир считает возвещаемое послание.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Ибо поскольку
  rationale: «Ибо» сохраняет пояснительную связь γάρ с предыдущей мыслью, а «поскольку» передаёт причинно-обстоятельственное значение ἐπειδή.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: в Божьей мудрости
  rationale: 'Формулировка сохраняет неоднозначность ἐν: речь может идти о сфере, порядке или устроении Божьей мудрости, без преждевременного сведения оборота к значению средства.'
- source_word: οὐκ ἔγνω
  choice: не познал
  rationale: «Не познал» передаёт аорист и сохраняет как познавательный, так и более широкий личностный оттенок γινώσκω.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Обычный русский эквивалент κόσμος, позволяющий понимать здесь человечество в его земном порядке без лишнего толкования в основном тексте.
- source_word: διὰ τῆς σοφίας
  choice: посредством мудрости
  rationale: «Посредством» ясно передаёт διά с родительным падежом как указание на средство и сохраняет повтор ключевого слова «мудрость».
- source_word: εὐδόκησεν ὁ θεὸς
  choice: Богу было угодно
  rationale: Устойчивая и естественная формула, передающая Божье благоволение и решение, а не просто удовольствие.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: через безумие возвещаемой вести
  rationale: Основной текст преимущественно передаёт κήρυγμα как содержание провозглашения, но слово «возвещаемой» сохраняет связь с самим актом возвещения. «Безумие» оставляет резкую иронию Павла, а примечание уточняет перспективу такой оценки.
- source_word: σῶσαι
  choice: спасти
  rationale: Стандартно и точно передаёт сотериологическое значение σῴζω.
- source_word: τοὺς πιστεύοντας
  choice: верующих
  rationale: Естественно передаёт субстантивированное причастие настоящего времени, не добавляя к нему более узкого богословского определения.
theological_decisions:
- issue: Значение διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: Выражение прежде всего относится к возвещаемой вести, которую мир считает безумием.
  alternative: Выражение относится преимущественно к кажущемуся безумным способу — публичной проповеди; возможно также намеренное сочетание обоих смыслов.
  rationale: κήρυγμα обычно обозначает содержание провозглашения, однако контекст допускает отзвук самого действия. Перевод «возвещаемая весть» выделяет содержание, не разрывая связи с возвещением, а примечания сохраняют альтернативу и поясняют, что оценка «безумие» принадлежит человеческой перспективе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис сохраняет ход греческого рассуждения, но остаётся понятным; повтор слова «мудрость» намеренно удержан как часть противопоставления Павла.
