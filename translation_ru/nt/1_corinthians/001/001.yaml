lexical_decisions:
- source_word: Παῦλος
  choice: Павел
  rationale: Традиционная и общепонятная русская форма личного имени.
- source_word: κλητὸς
  choice: призванный быть
  rationale: Прилагательное указывает, что апостольское служение Павла основано на Божьем призвании; добавление «быть» естественно передаёт эту связь по-русски, не изменяя смысла.
- source_word: ἀπόστολος
  choice: апостол
  rationale: В самообозначении Павла слово имеет устойчивый смысл уполномоченного посланника и служения апостола.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Χριστός здесь сохраняет значение титула, поэтому передано как «Мессия»; порядок компонентов соответствует греческому тексту.
- source_word: διὰ θελήματος θεοῦ
  choice: по воле Бога
  rationale: διά с родительным падежом обозначает основание или посредство призвания; «по воле Бога» — естественная современная русская формулировка.
- source_word: Σωσθένης
  choice: Сосфен
  rationale: Традиционная русская форма греческого личного имени.
- source_word: ὁ ἀδελφὸς
  choice: наш брат
  rationale: Хотя притяжательного местоимения в греческом нет, определённое «брат» в эпистолярном контексте обозначает известного общине единоверца; «наш брат» естественно передаёт эту идиому по-русски.
theological_decisions:
- issue: Передача Χριστός в начальном приветствии Павла
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: В данном самообозначении Χριστός можно услышать как титул Иисуса, а не только как закрепившуюся часть имени. Основной текст сохраняет титульный смысл словом «Мессия», а традиционный вариант указан в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского приветствия. Синтаксис сделан естественным для русского: обстоятельство «по воле Бога» поставлено перед причастным оборотом; незавершённость фразы сохранена, поскольку стих продолжается в следующем предложении.'
