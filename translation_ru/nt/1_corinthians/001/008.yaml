  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: ru
  text: Он и укрепит[a] вас до конца, чтобы в День Господа нашего Иисуса Мессии[c] вы были безупречны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утвердит»; возможно также: «подтвердит».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не подлежащими обвинению», «такими, против кого нельзя выдвинуть обвинение».'
    reason: lexical_alternative
  - marker: c
    text: По-гречески Христос; здесь переведено «Мессия», чтобы сохранить смысл титула — «Помазанник».
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: укрепит
  rationale: Глагол означает сделать твёрдыми, утвердить или упрочить. «Укрепит» естественно звучит по-русски и передаёт направленное на людей действие, не сводя его к подтверждению истинности.
- source_word: ἕως τέλους
  choice: до конца
  rationale: Обычное русское выражение точно передаёт продолжительность вплоть до конечного, в данном контексте эсхатологического, рубежа.
- source_word: ἀνεγκλήτους
  choice: безупречны
  rationale: Слово обозначает тех, против кого нельзя выдвинуть обоснованного обвинения. «Безупречны» кратко и естественно передаёт основной смысл, а юридический оттенок отмечен в сноске.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: в День
  rationale: Предлог и существительное переданы устойчивым библейским оборотом, указывающим на эсхатологический День суда и явления Господа.
- source_word: κυρίου
  choice: Господа
  rationale: «Господь» — естественное и традиционно понятное соответствие κύριος в данном титулярном употреблении.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός является греческим обозначением Помазанника; «Мессия» сохраняет смысл титула, а не превращает его в подобие фамилии.
theological_decisions:
- issue: К кому относится ὃς («который»/«он»)
  choice: Местоимение передано как «Он» и отнесено к Господу Иисусу Мессии, названному в предыдущем стихе.
  alternative: Отнести местоимение шире к Богу, упомянутому ранее в контексте.
  rationale: Ближайший грамматический антецедент в 1 Кор 1:7 — «Господь наш Иисус Мессия». Русское «Он» позволяет естественно продолжить мысль, не повторяя имя и не добавляя отсутствующего в греческом пояснения.
- issue: Связь ἀνεγκλήτους с будущим действием βεβαιώσει
  choice: 'Передать целевой или результирующий смысл: «укрепит… чтобы… вы были безупречны».'
  alternative: 'Формально сблизить определения: «укрепит вас до конца безупречными».'
  rationale: Греческое винительное ἀνεγκλήτους описывает состояние адресатов в День Господа. Конструкция с «чтобы» естественна по-русски и не утверждает, будто они уже безупречны на всём протяжении до конца.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского стиля. Порядок слов слегка перестроен ради ясности: обстоятельство «в День…» вынесено перед придаточной частью. Заглавная буква в слове «День» подчёркивает его эсхатологическое, титулярное употребление; «Иисус Мессия» оформлено без артикля, поскольку в русском языке титул в такой именной группе естественно употребляется без него.'
