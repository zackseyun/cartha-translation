lexical_decisions:
- source_word: ἐπειδή
  choice: ведь
  rationale: Союз вводит основание для последующего противопоставления; «ведь» естественно передаёт причинно-пояснительную связь с контекстом.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: В данном контексте это культурно-религиозная группа, противопоставленная грекам; «иудеи» — традиционное и точное обозначение в русском библейском регистре.
- source_word: σημεῖα
  choice: знамения
  rationale: '«Знамения» сохраняет многозначность греческого слова: речь может идти о чудесах, служащих удостоверяющими знаками, без пояснительного расширения в основном тексте.'
- source_word: αἰτοῦσιν
  choice: требуют
  rationale: В контексте ожидания удостоверяющих знамений русский глагол «требуют» естественно передаёт настойчивую силу настоящего времени, хотя буквально возможно и более нейтральное «просят».
- source_word: Ἕλληνες
  choice: греки
  rationale: Передаёт конкретную культурную рамку оригинала и поддерживает риторическую связь с поиском мудрости; более широкое «язычники» неоправданно обобщило бы выражение.
- source_word: σοφίαν
  choice: мудрости
  rationale: Прямой эквивалент, сохраняющий широкий смысл и не сужающий его до одной лишь философии.
- source_word: ζητοῦσιν
  choice: ищут
  rationale: Точно и естественно передаёт продолжающееся действие настоящего времени.
theological_decisions:
- issue: Смысл «знамений»
  choice: Сохранено общее «знамения»
  alternative: «чудесные знамения» или «чудеса»
  rationale: Оригинал допускает чудесный оттенок, но называет чудеса именно знаками; основной текст не должен устранять эту смысловую широту.
