id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: ru
  text: Разве вы не знаете, что совершающие священное служение питаются от храма[a] и служащие при жертвеннике получают долю от жертвенника[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «едят то, что из храма».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делят с жертвенником», то есть получают долю от принесённых на нём жертв.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: Разве вы не знаете
  rationale: Сохраняет характерную для Павла форму риторического вопроса и естественно звучит по-русски.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: совершающие священное служение
  rationale: Передаёт буквальную связь со «священным» и при этом ясно обозначает храмовую деятельность, не сужая выражение до поздней церковной должности.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: питаются от храма
  rationale: Естественно передаёт мысль о пропитании, получаемом из храмовых приношений, сохраняя глагольный образ еды.
- source_word: ἱεροῦ
  choice: храма
  rationale: ἱερόν обозначает храм или храмовый комплекс; «храм» — ясный и стандартный русский эквивалент.
- source_word: παρεδρεύοντες
  choice: служащие при
  rationale: Передаёт нахождение при жертвеннике ради исполнения обязанностей; «при» сохраняет пространственный оттенок исходного слова.
- source_word: θυσιαστηρίῳ
  choice: жертвеннике
  rationale: Точный традиционный эквивалент названия жертвенного алтаря в библейском контексте.
- source_word: συμμερίζονται
  choice: получают долю от
  rationale: Выражает участие в распределении жертвенных приношений и по-русски яснее, чем буквальное «делят с жертвенником».
theological_decisions:
- issue: Храмовый образ и материальное обеспечение совершающих священное служение
  choice: 'Сохранена аналогия: служители получают пропитание и долю от того священного служения, которое они совершают.'
  alternative: Буквально передать последнюю фразу как «делят с жертвенником».
  rationale: Формулировка сохраняет экономический и культовый смысл аргумента Павла, но не привносит позднейшие представления о церковных должностях или устройстве служения.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный, но понятный. Термины «священное служение» и «жертвенник» сохраняют культовый контекст, а синтаксис остаётся естественным для обычного читателя.
