  verdict: approve
  source_fidelity: Текст точно передаёт риторический вопрос οὐκ οἴδατε, храмовое служение (οἱ τὰ ἱερὰ ἐργαζόμενοι), получение пропитания из храмовых средств и участие служащих при жертвеннике в жертвенной доле. «Питаются от храма» удачно выражает смысл τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, не сводя его к буквальному приёму пищи в храме. «Получают долю от жертвенника» естественно и по смыслу верно передаёт συμμερίζονται τῷ θυσιαστηρίῳ.
  naturalness: Формулировка грамматически ясна и естественна для современного литературного русского. Риторическое «Разве вы не знаете» соответствует регистру Павла; «священное служение» и «жертвенник» сохраняют требуемый культовый контекст без архаизации.
  terminology: «Храм» корректно передаёт ἱερόν как храмовый комплекс, а «жертвенник» — θυσιαστήριον. Термин «священное служение» является допустимой контекстуальной передачей τὰ ἱερά и не навязывает поздней церковной терминологии.
