reference: 1 Corinthians 9:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: ru
  text: Если другие пользуются этим правом по отношению к вам[a], то разве не тем более мы? Но мы не воспользовались этим правом, а всё переносим, чтобы не создавать никаких препятствий для Евангелия Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имеют притязание на вашу поддержку» / «обладают властью по отношению к вам». Вероятнее всего, речь идёт о праве апостолов получать от коринфян материальную поддержку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῆς ὑμῶν ἐξουσίας / τῇ ἐξουσίᾳ ταύτῃ
  choice: этим правом по отношению к вам / этим правом
  rationale: В данном контексте ἐξουσία означает законное право апостолов на материальную поддержку. Формулировка «по отношению к вам» сохраняет неоднозначную связь генитива ὑμῶν и не создаёт ошибочного впечатления, будто право принадлежит коринфянам.
- source_word: μετέχουσιν
  choice: пользуются
  rationale: Глагол обозначает участие или обладание долей; применительно к праву естественное русское выражение «пользуются правом» передаёт практическое участие в нём.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: то тем более — мы, не так ли?
  rationale: Переданы сравнительная сила μᾶλλον, эмфатическое ἡμεῖς и риторический характер вопроса.
- source_word: οὐκ ἐχρησάμεθα
  choice: не воспользовались
  rationale: χράομαι здесь означает воспользоваться имеющимся правом; совершенный вид естественно выражает конкретный отказ Павла и его сотрудников от этого права.
- source_word: πάντα στέγομεν
  choice: всё переносим
  rationale: στέγω в контексте означает терпеть и сносить трудности, а πάντα сохраняет широкий, неуточнённый охват.
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: не создавать никаких препятствий
  rationale: Русская конструкция естественно передаёт значение «не причинить какого-либо препятствия», сохраняя целевую связь с ἵνα μή.
- source_word: τῷ εὐαγγελίῳ
  choice: для Благой вести
  rationale: «Благая весть» прозрачно передаёт основное значение εὐαγγέλιον и уместна в современном литературном русском языке; дательный падеж обозначает то, продвижению чего препятствие могло бы помешать.
- source_word: τοῦ Χριστοῦ
  choice: о Мессии
  rationale: Χριστός здесь сохраняет титульное значение. Родительный падеж допускает связь принадлежности или содержания; в естественном русском выражении «Благая весть о Мессии» передаёт её как весть, относящуюся к Мессии.
theological_decisions:
- issue: Смысл апостольского ἐξουσία
  choice: законное право, которым можно было воспользоваться
  alternative: власть над коринфянами
  rationale: Ближайший контекст главы посвящён праву служителей получать материальную поддержку. Перевод «право» не превращает стих в заявление об общей административной власти.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В сочетании «Благая весть о Мессии» слово сохраняет значение титула Помазанника, не вводя дополнительного конфессионального толкования.
- issue: Связь родительного τοῦ Χριστοῦ с εὐαγγελίῳ
  choice: Благая весть о Мессии
  alternative: Благая весть Мессии
  rationale: Греческий родительный допускает как объективно-содержательный, так и притяжательный оттенок. Основной текст выбирает естественную для русского языка связь содержания, не исключая того, что весть принадлежит Мессии и возвещается от Его имени.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской аргументации. Риторический вопрос передан разговорно понятной, но не сниженной конструкцией. «Всё переносим» сохраняет лаконичность и широту греческого πάντα στέγομεν; «препятствий» во множественном числе звучит по-русски естественнее при отрицании, не меняя смысла греческого единственного числа.
