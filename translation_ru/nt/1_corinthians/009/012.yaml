revisions:
- from: Если другие пользуются этим правом по отношению к вам[a], то тем более — мы, не так ли? Однако мы не воспользовались этим правом, а всё переносим, чтобы не создавать никаких препятствий для Благой вести о Мессии.
  to: Если другие пользуются этим правом по отношению к вам[a], то разве не тем более мы? Но мы не воспользовались этим правом, а всё переносим, чтобы не создавать никаких препятствий для Евангелия Мессии.
  rationale: Уточнена форма риторического вопроса и заменено «Благая весть о Мессии» на «Евангелие Мессии». Эта замена одновременно использует устойчивый русский библейский термин и не предрешает возможные оттенки греческого родительного. Смысловые отношения, право на материальную поддержку и целевая оговорка о недопущении препятствий сохранены.
