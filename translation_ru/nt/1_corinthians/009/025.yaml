  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: обобщающее πᾶς, постоянную самодисциплину ἐγκρατεύεται во «всём», целевое ἵνα и противопоставление временного атлетического венка непреходящему. «Увядающий / неувядающий» уместно конкретизирует контраст φθαρτός / ἄφθαρτος в контексте венка-гирлянды, не добавляя доктринального истолкования.'
