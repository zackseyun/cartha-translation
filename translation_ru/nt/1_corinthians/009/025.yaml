id: 1CO.9.25
reference: 1 Corinthians 9:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: ru
  text: Каждый участник состязания во всём проявляет самообладание. Они делают это, чтобы получить увядающий венок[a], а мы — неувядающий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть наградной венок победителя в атлетическом состязании.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: каждый
  rationale: Форма единственного числа имеет обобщающее значение; «каждый» естественно и точно передаёт его по-русски.
- source_word: ἀγωνιζόμενος
  choice: участник состязания
  rationale: В ближайшем контексте речь идёт об атлетическом состязании; существительное позволяет естественно передать субстантивированное причастие.
- source_word: πάντα
  choice: во всём
  rationale: Передаёт широкий объём самоограничения и не сужает его до питания или отдельных сторон подготовки.
- source_word: ἐγκρατεύεται
  choice: проявляет самообладание
  rationale: Передаёт деятельный и привычный характер воздержанности, подразумеваемой в подготовке атлета.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: они делают это
  rationale: Возвращает читателя к участникам состязания и по-русски естественно восполняет подразумеваемое действие, сохраняя противопоставление с «мы».
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно выражает цель в современном русском языке.
- source_word: φθαρτόν
  choice: увядающий
  rationale: В сочетании с атлетическим венком конкретно передаёт его тленность и образует выразительную пару с «неувядающий».
- source_word: στέφανον
  choice: венок
  rationale: В атлетическом контексте στέφανος обозначает наградной венок победителя; это точнее общего слова «венец».
- source_word: λάβωσιν
  choice: получить
  rationale: Естественно передаёт получение награды как цель состязающихся.
- source_word: ἄφθαρτον
  choice: неувядающий
  rationale: Сохраняет прямой контраст с увядающим венком; существительное эллиптически подразумевается, как и в греческом тексте.
theological_decisions:
- issue: Смысл награды в образе венка
  choice: Сохранить образ неувядающего венка, не уточняя его доктринальное содержание.
  alternative: Прямо истолковать венок как вечную жизнь или как небесную награду.
  rationale: Сам стих не определяет награду точнее; конкретизация устранила бы намеренно оставленную образность и могла бы привнести частное богословское толкование.
translation_notes:
  register: Современный литературный русский язык; ясная, dignified спортивная образность. Тире сохраняет краткое и сильное противопоставление между временной наградой атлетов и непреходящей наградой «нас».
