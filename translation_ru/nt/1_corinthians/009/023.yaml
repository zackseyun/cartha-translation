  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: ru
  text: Но всё это я делаю ради Благой вести[a], чтобы вместе с другими стать причастным к ней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Евангелия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы и мне участвовать в ней»; или: «чтобы стать сопричастным ей».'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: всё это
  rationale: Форма среднего рода множественного числа употреблена обобщённо. «Всё это» естественно по-русски связывает слова Павла с перечисленными ранее действиями, сохраняя широту выражения.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает мягкое противопоставление или переход; в данном контексте «но» естественно продолжает предшествующее рассуждение.
- source_word: ποιῶ
  choice: я делаю
  rationale: Настоящее время передаёт постоянный, характерный для Павла образ действий; простое настоящее естественно выражается формой «делаю».
- source_word: διὰ τὸ εὐαγγέλιον
  choice: ради Благой вести
  rationale: διά с винительным падежом указывает на основание, цель или то, ради чего совершается действие. «Ради» кратко и естественно передаёт эту направленность, а «Благая весть» делает смысл εὐαγγέλιον прозрачным современному читателю.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит целевое придаточное; «чтобы» сохраняет целевое значение и звучит естественно.
- source_word: συγκοινωνὸς
  choice: вместе с другими стать причастным
  rationale: Существительное обозначает того, кто совместно с другими участвует в чём-либо. Описательная передача избегает нежелательного современного оттенка слова «соучастник» и сохраняет значение приставки συν-.
- source_word: αὐτοῦ
  choice: к ней
  rationale: 'Местоимение естественнее всего относится к εὐαγγέλιον. Русское управление при «причастным» требует дательного падежа: «к ней».'
- source_word: γένωμαι
  choice: стать
  rationale: Аорист конъюнктива γίνομαι после ἵνα передаёт достижение или обретение состояния; «стать» сохраняет эту динамику лучше, чем «быть».
theological_decisions:
- issue: Смысл участия Павла в Благой вести
  choice: Сохранено широкое значение причастности Благой вести вместе с другими, без уточнения, идёт ли речь о её благах, распространении или служении ей.
  alternative: Уточнить как «разделить её блага», «участвовать в её распространении» или «стать соработником в служении Благой вести».
  rationale: συγκοινωνός допускает несколько взаимосвязанных оттенков. Контекст не требует сводить выражение только к благам спасения, миссионерскому труду или особой доктринальной категории.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. «Благая весть» доступнее традиционного «Евангелие», которое сохранено в сноске. Описательный оборот «вместе с другими стать причастным» передаёт совместность участия без уголовно-правового оттенка, часто возникающего у слова «соучастник».
