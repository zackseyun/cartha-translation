id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: ru
  text: Если для других я и не апостол, то для вас — несомненно апостол, ведь вы — печать[a] моего апостольства в Господе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть подтверждение или удостоверение моего апостольства. В греческом тексте употреблено слово «печать», сохраняющее образ знака подлинности.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: апостол
  rationale: В контексте защиты Павлом своего служения слово обозначает апостольское призвание и полномочия, а не просто посланника.
- source_word: ἀλλά γε
  choice: то для вас — несомненно
  rationale: Передаёт как резкое противопоставление, так и усилительную силу γε; по-русски утверждение звучит естественно и выразительно.
- source_word: σφραγίς
  choice: печать
  rationale: Сохраняет греческий образ печати как знака, подтверждающего подлинность и полномочия.
- source_word: ἀποστολή
  choice: апостольство
  rationale: Здесь речь идёт об апостольском призвании, служении и полномочиях Павла; «апостольство» сохраняет ёмкость исходного понятия.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула, связывающая существование коринфской общины как свидетельства его апостольства с их отношением ко Христу.
- source_word: ἄλλοις
  choice: для других
  rationale: Русское «для других» естественно передаёт дательный падеж и допускает как отношение других людей к притязанию Павла, так и его служение среди них.
theological_decisions:
- issue: Смысл условного высказывания об апостольстве Павла
  choice: Павел допускает, что другие могут не признавать его апостолом, но решительно утверждает, что коринфяне сами удостоверяют его апостольство.
  alternative: Павел буквально ограничивает своё апостольство только коринфской общиной.
  rationale: Контекст представляет собой защиту апостольских полномочий, а образ печати указывает на коринфскую общину как на подтверждение их подлинности, а не как на единственную сферу их действия.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Частица «и» в условной части и слово «несомненно» передают риторический контраст без искусственной тяжеловесности. Тире подчёркивает параллелизм; повтор слова «апостол» сохраняет ясность. Маркер сноски поставлен непосредственно после слова «печать», к которому относится пояснение.
