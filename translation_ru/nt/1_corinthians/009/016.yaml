  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: ru
  text: 'Ведь если я возвещаю Благую весть[a], мне нечем хвалиться: на меня возложена необходимость. Ибо горе мне, если я не возвещаю Благую весть!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проповедую Евангелие»; также во втором случае.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: возвещаю Благую весть
  rationale: Глагол означает провозглашать добрую весть; дополнение подразумевается контекстом. «Возвещаю Благую весть» естественно передаёт публичный характер провозглашения и сохраняется в обоих случаях.
- source_word: καύχημα
  choice: мне нечем хвалиться
  rationale: Передаёт отсутствие основания для похвалы или самовосхваления естественным современным русским оборотом.
- source_word: ἀνάγκη
  choice: необходимость
  rationale: Сохраняет смысл возложенной обязанности или принуждающей необходимости, не уточняя её источник.
- source_word: ἐπίκειται
  choice: на мне лежит
  rationale: Передаёт образ чего-то возложенного на Павла и тяготеющего над ним, оставаясь естественным по-русски.
- source_word: οὐαί
  choice: горе мне
  rationale: Сохраняет торжественный, пророчески серьёзный оттенок предупреждения о бедствии.
- source_word: ἐὰν μὴ
  choice: если я не
  rationale: Прямо и ясно передаёт отрицательное условие.
- source_word: γάρ
  choice: ведь / потому что
  rationale: Два употребления объяснительной частицы переданы естественными русскими связками в соответствии с их функцией в каждом предложении.
theological_decisions:
- issue: Характер обязанности Павла возвещать Благую весть
  choice: «на мне лежит необходимость» без уточнения источника
  alternative: «я вынужден» или «Бог возложил на меня эту обязанность»
  rationale: Греческий текст утверждает наличие необходимости, но в самом стихе прямо не называет её источник; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической силой оригинала. «Благая весть» употреблена как устойчивое обозначение евангельской вести; восклицательный знак передаёт силу οὐαί.
