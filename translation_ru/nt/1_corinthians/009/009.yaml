  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: ru
  text: 'Ведь в законе Моисея написано: «Не заграждай рта молотящему волу».[a] Разве о волах заботится Бог?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «волу, вымолачивающему зерно ногами».'
    reason: Лексическая альтернатива, поясняющая возможный способ молотьбы, подразумеваемый ἀλοῶντα и контекстом Второзакония 25:4.
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: Ведь в законе Моисея
  rationale: Предлог ἐν естественно передаётся как «в», а γάρ — как «ведь», связывая стих с предшествующим рассуждением. «Закон Моисея» сохраняет генитивную связь и привычное библейское выражение.
- source_word: γέγραπται
  choice: написано
  rationale: Стандартная русская формула введения цитаты из Писания; передаёт перфект пассивного залога без тяжеловесного «стоит написанным».
- source_word: Οὐ κημώσεις
  choice: Не заграждай рта
  rationale: Будущее изъявительного наклонения в запретительном значении передано естественной русской формой повелительного наклонения. Выражение «заграждать рот» точно описывает надевание намордника и сохраняет узнаваемую формулировку цитаты из Второзакония.
- source_word: βοῦν
  choice: волу
  rationale: В данном сельскохозяйственном контексте «вол» — точное и традиционное обозначение рабочего крупного рогатого скота.
- source_word: ἀλοῶντα
  choice: молотящему
  rationale: Причастие настоящего времени передаёт продолжающееся действие. «Молотящий» кратко и точно сохраняет формулировку Павла; конкретный способ молотьбы — хождение по зерну — поясняется в сноске.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: Разве о волах заботится Бог?
  rationale: «Разве» естественно передаёт риторический вопрос с μή, ожидающий отрицательного ответа. Формулировка сохраняет аргументативную силу и не добавляет отсутствующего в греческом слова «только».
theological_decisions:
- issue: Риторический вопрос Павла о Божьей заботе о животных
  choice: Разве о волах заботится Бог?
  alternative: Разве только о волах заботится Бог?
  rationale: В тексте стоит риторический вопрос с μή, но нет слова «только». Поэтому перевод не уточняет, отрицает ли Павел заботу Бога о животных вообще или подчёркивает более широкий смысл заповеди, и сохраняет исходное богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. «Не заграждай рта» несколько возвышенно, но понятно и сохраняет точный образ; остальная синтаксическая структура естественна для современного читателя.
