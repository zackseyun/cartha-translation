id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: ru
  text: Разве я не свободен? Разве я не апостол? Разве я не видел Иисуса, нашего Господа?[a] Разве не вы — моё дело в Господе?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с иной расстановкой слов: «нашего Господа Иисуса».'
    reason: лексическая и синтаксическая альтернатива
lexical_decisions:
- source_word: ἐλεύθερος
  choice: свободен
  rationale: Прямо передаёт утверждение Павла о своей свободе и связанных с ней правах, сохраняя связь с предшествующим рассуждением.
- source_word: ἀπόστολος
  choice: апостол
  rationale: Здесь речь идёт о признанном апостольском служении Павла, поэтому сохранён устоявшийся новозаветный термин.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Иисуса, нашего Господа
  rationale: Передаёт греческую последовательность слов и христологический титул κύριος естественным современным русским языком.
- source_word: ἑόρακα
  choice: видел
  rationale: Русская форма прошедшего времени естественно выражает состоявшееся видение, сохраняющее значение для апостольского притязания Павла, без добавления отсутствующего в греческом слова «воскресшего».
- source_word: ἔργον
  choice: дело
  rationale: 'Сохраняет прямую метафору: коринфская община является результатом апостольского труда Павла, не разворачивая её в пояснительный пересказ.'
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула, обозначающая сферу и основание отношений с Господом.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: Разве ... не ...?
  rationale: Эта русская вопросительная конструкция ясно передаёт риторические вопросы, предполагающие утвердительный ответ.
theological_decisions:
- issue: Смысл утверждения Павла о том, что он видел Иисуса
  choice: Формулировка оставлена как простое утверждение о том, что Павел видел Иисуса, и в контексте служит подтверждением его апостольства.
  alternative: 'Прямо уточнить в переводе: «видел воскресшего Иисуса».'
  rationale: Контекст позволяет понимать слова как указание на явление воскресшего Иисуса, однако определение «воскресшего» в греческом тексте отсутствует, поэтому оно не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык; повтор «Разве» воспроизводит настойчивую цепь риторических вопросов. Формула «в Господе» сохранена без пояснительного расширения.
