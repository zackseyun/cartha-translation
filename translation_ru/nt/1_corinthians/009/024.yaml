  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: ru
  text: Разве вы не знаете, что бегущие на стадионе[a] бегут все, но приз получает один? Бегите так, чтобы получить его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на беговой дорожке». Греческое слово στάδιον обозначает место проведения забега — стадион или беговую дорожку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бегите так, чтобы победить»; возможен также смысл: «чтобы завладеть им» или «чтобы достичь его». Греческое καταλάβητε может означать «получить», «схватить, завладеть» или «достичь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Разве вы не знаете
  rationale: Естественная русская форма риторического вопроса, сохраняющая прямое значение οἶδα и ожидаемый утвердительный ответ.
- source_word: οἱ ἐν σταδίῳ τρέχοντες
  choice: бегущие на стадионе
  rationale: Сохраняет конкретное место состязания и атлетический образ; «стадион» понятно современному читателю, а исторически более точная альтернатива отмечена в сноске.
- source_word: πάντες μὲν τρέχουσιν, εἷς δὲ
  choice: бегут все, но ... один
  rationale: Ясно передаёт противопоставление μέν...δέ без неестественного буквального воспроизведения частиц.
- source_word: λαμβάνει τὸ βραβεῖον
  choice: награду получает
  rationale: «Получает награду» непосредственно передаёт λαμβάνει и βραβεῖον, не подменяя выражение более толковательным «побеждает».
- source_word: οὕτως τρέχετε
  choice: Бегите так
  rationale: Кратко и энергично передаёт указательный смысл οὕτως и повелительное τρέχετε; форма несовершенного вида естественно допускает продолжающееся действие.
- source_word: ἵνα καταλάβητε
  choice: чтобы получить её
  rationale: В контексте награды καταλαμβάνω означает достичь или завладеть ею. «Получить» сохраняет связь с предыдущим λαμβάνει, тогда как оттенки «завладеть» и «достичь» отражены в сноске; местоимение отсылает к награде.
theological_decisions:
- issue: Атлетический образ и его отношение к христианскому упорству
  choice: Сохранить образ состязания и призыв бежать ради получения награды, не уточняя природу награды и механизм её получения.
  alternative: 'Передать толковательно: «бегите, чтобы победить», связав образ с определённым пониманием спасения, заслуги или воздаяния.'
  rationale: Греческий текст настойчиво призывает к целеустремлённости, но сам этот стих не определяет награду и не разрешает более широкие богословские вопросы о спасении, заслуге и стойкости.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос и краткий повелительный призыв сохранены. Синтаксис сделан естественным для устного чтения, а конкретный атлетический образ не обобщён.
