  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: ru
  text: Хотя я свободен от всех, я сделал себя рабом всех[a], чтобы приобрести большее число людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугой всех». Греческий глагол означает «поработить, сделать рабом»; вариант «рабом» сохраняет намеренный контраст со словом «свободен».'
    reason: Уточнение сильной рабской метафоры и указание более мягкого возможного перевода.
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: свободен
  rationale: Передаёт отсутствие подчинённости или обязательства и сохраняет ключевой контраст с последующим образом рабства.
- source_word: ἐκ πάντων
  choice: от всех
  rationale: Компактно передаёт свободу Павла по отношению ко всем людям и поддерживает параллель «от всех — рабом всех».
- source_word: πᾶσιν
  choice: всех
  rationale: При выражении «сделал себя рабом» русский родительный передаёт круг людей, которым Павел добровольно подчинил себя.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: я сделал себя рабом
  rationale: Сохраняет рефлексивность и сильную лексику рабства, существенную для противопоставления свободе; формулировка естественна по-русски.
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно и естественно выражает цель.
- source_word: τοὺς πλείονας
  choice: большее число людей
  rationale: Передаёт сравнительное значение «больше людей», не усиливая его до «как можно больше»; слово «людей» естественно восполняет подразумеваемый объект.
- source_word: κερδήσω
  choice: приобрести
  rationale: Сохраняет метафору обретения людей в контексте служения Павла и не предполагает принуждения.
theological_decisions:
- issue: Передача δουλόω и образа рабства
  choice: рабом
  alternative: слугой
  rationale: Контраст между «свободен» и добровольным превращением себя в раба составляет основу мысли Павла. «Слуга» смягчило бы силу греческого глагола, хотя может быть уместным пояснительным вариантом.
- issue: Смысл τοὺς πλείονας
  choice: большее число людей
  alternative: как можно больше людей
  rationale: Греческий сравнительный оборот говорит о приобретении большего числа людей, но сам по себе не выражает максимализацию; поэтому более сильный вариант не внесён в текст.
translation_notes:
  register: Современный литературный русский язык с сохранением риторического контраста «свободен — раб». Начальное «Ведь» естественно передаёт пояснительное γὰρ. Формулировка остаётся краткой и достойной, без конфессионально окрашенных добавлений.
