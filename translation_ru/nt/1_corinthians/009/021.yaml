  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: ru
  text: Для тех, кто вне Закона[a], я был как человек вне Закона — хотя я не вне закона Божьего, а под законом Мессии[b], — чтобы приобрести тех, кто вне Закона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без Закона». Здесь имеются в виду люди, не находящиеся под Моисеевым законом, а не обязательно беззаконные в нравственном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный вариант передачи: «в законе Мессии»; смысл выражения — находиться в сфере его закона и быть ему подвластным.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: тех, кто вне Закона / человек вне Закона
  rationale: В контексте речь идёт о людях, не находящихся под Моисеевым законом, а не обязательно о беззаконных в нравственном смысле. Повтор сохраняет риторическую связность греческого текста.
- source_word: ὡς
  choice: как
  rationale: Передаёт приспособление Павла к положению этих людей, не утверждая, что он безусловно стал чужд всякому закону.
- source_word: μὴ ὢν
  choice: хотя я не
  rationale: Причастный оборот имеет уступительный смысл; личная форма естественна в современном русском языке.
- source_word: ἄνομος θεοῦ
  choice: вне закона Божьего
  rationale: Сохраняет формальную параллель с выражением «вне Закона» и подчёркивает, что Павел не отвергает Божью волю.
- source_word: ἔννομος Χριστοῦ
  choice: под законом Мессии
  rationale: ἔννομος обозначает нахождение в сфере закона или под его обязательством; «под законом» ясно выражает этот смысл. Χριστοῦ здесь сохраняет титульное значение.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит цель действия.
- source_word: κερδάνω
  choice: приобрести
  rationale: В данном миссионерском контексте глагол означает приобрести людей для веры; формулировка сохраняет образ выгоды, не сводя его к финансовому смыслу.
theological_decisions:
- issue: Значение ἄνομος в данном контексте
  choice: Люди вне Моисеева закона, прежде всего язычники
  alternative: Беззаконные, то есть нравственно порочные или мятежные люди
  rationale: Стихи 20–21 противопоставляют находящихся под Законом тем, кто вне Закона. Оговорка Павла показывает, что имеется в виду положение по отношению к Моисееву закону, а не отказ от нравственных обязательств.
- issue: Смысл ἔννομος Χριστοῦ
  choice: Павел находится под законом Мессии
  alternative: Павел находится внутри закона Мессии / законен перед Мессией
  rationale: Фраза утверждает продолжающуюся подотчётность Павла Божьей воле в её отношении к Мессии, не отождествляя это без пояснения с пребыванием под Моисеевым заветом.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В сочетании «закон Мессии» титульный смысл Χριστός остаётся заметным; перевод не превращает титул в обычное имя.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским регистром. Заглавная буква в «Закон» обозначает Моисеев закон; строчная в выражениях «закон Божий» и «закон Мессии» позволяет не предрешать полное тождество этих понятий с Торой. Повтор «вне Закона» намеренно сохранён.
