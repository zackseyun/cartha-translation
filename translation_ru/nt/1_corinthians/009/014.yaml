  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: ru
  text: Так и Господь повелел тем, кто возвещает Евангелие[a], жить от Евангелия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, кто проповедует Евангелие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зарабатывать на жизнь возвещением Евангелия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Кратко и естественно передаёт вывод по аналогии с предшествующими примерами; сочетание «Так и» сохраняет сравнительно-добавочную связь.
- source_word: καὶ
  choice: и
  rationale: 'В сочетании «Так и Господь» передаёт добавочный смысл: наряду с уже приведёнными основаниями такое повеление дал и Господь.'
- source_word: ὁ κύριος
  choice: Господь
  rationale: Устоявшийся эквивалент κύριος; сохраняет формулировку источника, не добавляя имени Иисуса.
- source_word: διέταξεν
  choice: повелел
  rationale: Передаёт авторитетное установление; в данном контексте точнее и стилистически достойнее, чем «распорядился».
- source_word: τοῖς ... καταγγέλλουσιν
  choice: тем, кто возвещает
  rationale: Субстантивированное причастие передано естественной русской конструкцией; «возвещает» сохраняет смысл публичного провозглашения.
- source_word: τὸ εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшийся и понятный термин в посланиях Павла; прописная буква соответствует распространённой русской библейской практике для Благой вести.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: от Евангелия
  rationale: Сохраняет образную и лаконичную конструкцию греческого текста, где ἐκ указывает на источник средств к жизни; значение поясняется сноской.
- source_word: ζῆν
  choice: жить
  rationale: Инфинитив прямо зависит от «повелел» и сохраняет формальную структуру и смысл источника без излишнего истолкования.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Сохранено «Господь»; в контексте наиболее вероятно имеется в виду Иисус
  alternative: Общее указание на Бога
  rationale: Павел, вероятно, ссылается на наставление Иисуса о содержании благовестников, однако исходный текст не уточняет имени, поэтому перевод также его не добавляет.
- issue: Смысл выражения «жить от Евангелия»
  choice: Получать средства к жизни благодаря служению возвещения Евангелия
  alternative: Получать духовную жизнь от Евангелия
  rationale: Ближайший контекст говорит о праве служителей на материальное содержание. Основной текст сохраняет исходную формулировку, а сноска делает контекстуальный смысл явным.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Фраза построена кратко и торжественно, но остаётся понятной. Все сносочные маркеры размещены непосредственно после соответствующих выражений.
