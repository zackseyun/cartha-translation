id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: ru
  text: Ведь если я делаю это добровольно, то получаю награду; если же против воли, то мне вверено управление[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мне вверено поручение».'
    reason: 'Лексическая альтернатива: οἰκονομία может обозначать как управление вверенным делом, так и само доверенное поручение.'
lexical_decisions:
- source_word: ἑκὼν
  choice: добровольно
  rationale: Передаёт добровольность действия и образует ясную смысловую пару с ἄκων, не добавляя оттенка эмоциональной охоты.
- source_word: τοῦτο πράσσω
  choice: делаю это
  rationale: Естественно и без лишней конкретизации указывает на совершаемое Павлом служение, о котором говорится в контексте.
- source_word: μισθὸν
  choice: награду
  rationale: В данном контексте речь идёт не просто о плате или жалованье, а о воздаянии за добровольное служение; «награда» сохраняет эту широту.
- source_word: ἄκων
  choice: против воли
  rationale: Точно сохраняет противопоставление ἑκὼν и не вносит более узкого оттенка неохоты или небрежности.
- source_word: οἰκονομίαν
  choice: управление
  rationale: Сохраняет образ доверенной распорядительной ответственности, заложенный в οἰκονομία, и не сводит смысл только к разовому поручению.
- source_word: πεπίστευμαι
  choice: мне вверено
  rationale: 'Передаёт страдательный залог и сохраняющееся состояние, выраженное перфектом: ответственность была доверена Павлу и остаётся на нём.'
theological_decisions:
- issue: Характер служения Павла во второй части стиха
  choice: Даже если Павел совершает служение не по собственной воле, ему всё равно вверена ответственность за него.
  alternative: Если Павел служит против воли, у него есть лишь обязанность, но нет награды; либо здесь противопоставляются добровольное служение и вынужденное исполнение должности.
  rationale: Перевод сохраняет противопоставление μισθὸν ἔχω и οἰκονομίαν πεπίστευμαι, не превращая его в разработанное учение о награде или церковной должности. Напряжение между добровольностью и вверенной обязанностью оставлено открытым.
translation_notes:
  register: Современный литературный русский язык; фраза построена ясно и сдержанно. «Против воли» естественнее буквального «недобровольно», а «управление» сохраняет метафору вверенной ответственности без конфессиональной терминологии.
