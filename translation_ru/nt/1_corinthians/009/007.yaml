  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: ru
  text: Кто когда-либо несёт военную службу за свой счёт?[a] Кто сажает виноградник и не ест его плодов? Кто пасёт стадо и не пьёт молока от стада?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на собственное жалованье (или паёк)». Греческое слово обозначает плату или довольствие воина; смысл в том, что воин не содержит себя во время службы за собственный счёт.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не ест от молока стада». По-русски о молоке обычно говорят «пьёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: несёт военную службу
  rationale: Передаёт исполнение воинской службы, не сужая смысл до участия в конкретном сражении.
- source_word: ἰδίοις ὀψωνίοις
  choice: за свой счёт
  rationale: ὀψώνια может обозначать воинское жалованье или паёк; в риторическом вопросе выражение указывает на то, что воин не оплачивает собственную службу.
- source_word: ποτέ
  choice: когда-либо
  rationale: Сохраняет усиление риторического вопроса со значением «когда-нибудь, вообще».
- source_word: φυτεύει ἀμπελῶνα
  choice: сажает виноградник
  rationale: Прямо и понятно передаёт земледельческий образ; глагол «сажает» естественен в современном русском языке.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: его плодов
  rationale: Русское множественное число естественно обозначает урожай виноградника, сохраняя смысл καρπός.
- source_word: ποιμαίνει ποίμνην
  choice: пасёт стадо
  rationale: Естественный русский эквивалент, сохраняющий пастушеский образ.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: молока от этого стада
  rationale: Передаёт источник получаемого молока и смысл участия пастуха в том, что даёт стадо.
- source_word: ἐσθίει
  choice: ест / пьёт
  rationale: В первой фразе глагол передан буквально как «ест», а применительно к молоку — естественным русским «пьёт»; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Обобщающее мужское единственное число в повторяющихся конструкциях τίς
  choice: 'Сохранены риторические вопросы с подразумеваемыми лицами мужского рода: воином, виноградарем и пастухом.'
  alternative: Передать примеры множественным числом или гендерно-нейтральными описаниями.
  rationale: Греческий текст использует единичные представительные примеры; русские формы естественно сохраняют их без введения дополнительного богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с ясным риторическим параллелизмом трёх вопросов. Формулировки сохраняют военный, земледельческий и пастушеский образы, избегая архаизмов и конфессионально окрашенной терминологии.
