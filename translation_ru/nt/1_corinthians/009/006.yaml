  text: Or is it only Barnabas and I who have no right not to work?[a]
translation:
  language: ru
  text: Или только я и Варнава не имеем права не работать?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «права воздерживаться от работы» или «свободы не трудиться». Речь идёт о праве не зарабатывать себе на жизнь обычным трудом, а получать материальную поддержку во время служения.'
    reason: Лексические варианты для ἐξουσίαν μὴ ἐργάζεσθαι и контекстуальное пояснение.
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит следующий риторический вопрос и сохраняет связь с предшествующим рассуждением Павла.
- source_word: μόνος
  choice: только
  rationale: Подчёркивает исключительность составного подлежащего «я и Варнава»; в русском вопросе естественно ставится перед ним.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: я и Варнава
  rationale: Сохраняет порядок греческого текста; форма имени «Варнава» соответствует современной русской библейской традиции.
- source_word: οὐκ ἔχομεν
  choice: не имеем
  rationale: Прямо и естественно передаёт отрицательную форму настоящего времени во множественном числе.
- source_word: ἐξουσίαν
  choice: права
  rationale: В данном контексте обозначает законное апостольское право на материальную поддержку, а не властные полномочия.
- source_word: μὴ ἐργάζεσθαι
  choice: не работать
  rationale: Буквально и кратко передаёт содержание права — возможность не трудиться ради собственного содержания; контекст уточнён в сноске.
theological_decisions:
- issue: Смысл ἐξουσία в контексте
  choice: Апостольское право не зарабатывать себе на жизнь трудом, а получать материальную поддержку во время служения.
  alternative: Общая власть или свобода без конкретной связи с материальным обеспечением.
  rationale: Ближайший контекст 1 Кор 9 посвящён правам апостолов, в частности праву получать пропитание и поддержку. Перевод не разворачивает это толкование в основном тексте, но поясняет его в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая форма сохраняет структуру греческого текста. Выражение «не работать» намеренно оставлено в основном тексте, а его контекстуальный смысл уточнён в сноске, чтобы не устранять возможную поверхностную неоднозначность.
