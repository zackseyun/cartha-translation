  text: Такова моя защита перед теми, кто меня оценивает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто меня исследует»; возможно также: «кто меня судит».'
    reason: Глагол ἀνακρίνω может означать критически исследовать, оценивать или разбирать в судебном порядке; контекст не требует выбирать один оттенок как единственно возможный.
lexical_decisions:
- source_word: ἀπολογία
  choice: защита
  rationale: В контексте Павел отвечает на критическую оценку своих апостольских прав и поведения. «Защита» передаёт формальный ответ на обвинения или сомнения и естественно звучит по-русски.
- source_word: ἀνακρίνουσίν
  choice: подвергает меня разбору
  rationale: Глагол означает критически исследовать, допрашивать или судить. Выражение «подвергает меня разбору» сохраняет идею пристального рассмотрения, не сводя её к окончательному судебному приговору.
- source_word: Ἡ ἐμὴ
  choice: моя
  rationale: Притяжательное местоимение передано прямо; дополнительное усиление «моя собственная» в русском здесь не требуется.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: перед теми, кто подвергает меня разбору
  rationale: Дательный обозначает тех, перед кем или кому Павел представляет защиту. Сочетание «защита перед теми» естественно для русского и допускает квазисудебный оттенок контекста.
- source_word: ἐστιν αὕτη
  choice: вот
  rationale: 'Греческое сочетание указывает на содержание защиты: «вот моя защита». Такая конструкция естественна по-русски и сохраняет указательную силу αὕτη.'
