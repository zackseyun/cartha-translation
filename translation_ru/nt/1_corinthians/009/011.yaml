lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: духовное
  rationale: Субстантивированное прилагательное среднего рода во множественном числе обозначает в широком смысле духовные блага, принесённые апостольским служением; русское собирательное «духовное» сохраняет широту выражения и параллель с «материальным».
- source_word: ἐσπείραμεν
  choice: посеяли
  rationale: Аорист указывает на совершённое ранее служение Павла и его соработников; форма совершенного вида естественно передаёт это по-русски и сохраняет земледельческую метафору.
- source_word: μέγα
  choice: слишком много
  rationale: В риторическом вопросе слово обозначает нечто чрезмерное или неразумно большое; «слишком много» ясно и естественно выражает этот смысл.
- source_word: τὰ σαρκικὰ
  choice: материальное
  rationale: В данном контексте речь идёт о телесных и материальных средствах для содержания служителей, а не о нравственно порочной «плотскости»; собирательное существительное сохраняет противопоставление духовному.
- source_word: θερίσομεν
  choice: пожать
  rationale: Инфинитив после конструкции «неужели слишком много» естественно передаёт будущую перспективу греческого глагола и продолжает образ сеяния и жатвы.
- source_word: ὑμῶν
  choice: у вас
  rationale: Родительный источник при θερίζω естественно передан русской конструкцией «пожать у вас», то есть получить материальную поддержку от коринфян.
- source_word: ἡμεῖς
  choice: мы
  rationale: 'Явное местоимение сохраняет противопоставление: апостолы посеяли духовное и вправе ожидать материальной поддержки.'
theological_decisions:
- issue: Значение τὰ σαρκικὰ в противопоставлении τὰ πνευματικὰ
  choice: Материальные и телесные средства поддержки служителей
  alternative: «Плотское» в нравственно отрицательном смысле
  rationale: Контекст защищает право апостолов получать содержание за духовное служение. Противопоставлены две сферы благ — духовная и материальная, а не святость и греховность.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос и земледельческая метафора сохранены. Парные собирательные формы «духовное — материальное» передают широкие субстантивированные выражения оригинала без излишнего уточнения.
