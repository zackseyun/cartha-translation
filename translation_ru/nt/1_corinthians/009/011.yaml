  text: Если мы посеяли среди вас духовное, разве слишком много, если мы пожнём от вас материальное?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земное». Греческое выражение противопоставляет духовному то, что относится к телесной и материальной жизни.'
