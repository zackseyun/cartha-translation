id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: ru
  text: Разве мы не вправе брать с собой верующую жену[a], как и остальные апостолы, и братья Господа, и Кифа?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сестру, жену», то есть жену, которая является сестрой по вере.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: вправе
  rationale: В контексте речь идёт о законном праве апостолов, а не об отвлечённой власти; краткое «вправе» естественно передаёт эту мысль по-русски.
- source_word: ἀδελφὴν γυναῖκα
  choice: верующую жену
  rationale: Сочетание двух существительных обозначает жену, которая одновременно является «сестрой» по вере. Основной текст передаёт смысл естественно, а буквальная форма сохраняется в сноске.
- source_word: περιάγειν
  choice: брать с собой
  rationale: Здесь глагол означает сопровождение в разъездах служения; «брать с собой» точно и естественно передаёт контекст без добавления отсутствующего в тексте уточнения.
- source_word: ὡς καὶ
  choice: как и
  rationale: Передаёт и сравнение, и добавочное значение частицы καί, сохраняя естественный русский синтаксис.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: остальные апостолы
  rationale: «Остальные» точно выражает λοιποί как других представителей той же группы.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: братья Господа
  rationale: Прямо воспроизводит греческое выражение, не определяя точный характер родства.
- source_word: Κηφᾶς
  choice: Кифа
  rationale: Сохраняет употреблённую в греческом тексте форму имени, а не заменяет её именем Пётр; «Кифа» — устоявшаяся русская библейская передача.
theological_decisions:
- issue: Значение выражения «братья Господа»
  choice: Сохранить прямую формулировку «братья Господа» без пояснения степени родства.
  alternative: Родные братья Иисуса; сводные братья; близкие родственники.
  rationale: Само греческое выражение не разрешает последующие богословские споры о точном родстве, поэтому перевод не должен делать это за текст.
- issue: Значение ἀδελφὴν γυναῖκα
  choice: Передать в основном тексте как «верующую жену».
  alternative: «Сестру в качестве жены» или буквально «сестру, жену».
  rationale: В данном контексте наиболее естественно понимать выражение как жену, являющуюся сестрой по вере. Такое прочтение не превращает женщину лишь в спутницу, а необычная буквальная конструкция отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной и естественной формулировкой. Риторический вопрос передан конструкцией «Разве мы не вправе…», предполагающей утвердительный ответ. Повтор союза «и» сохраняет перечислительную структуру греческого текста.
