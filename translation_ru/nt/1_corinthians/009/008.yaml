  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: ru
  text: Разве я говорю это лишь по человеческим соображениям? Или и Закон не говорит того же?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: Разве
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; русское «разве» естественно передаёт эту силу.
- source_word: κατὰ ἄνθρωπον
  choice: только по человеческому рассуждению
  rationale: Оборот указывает на сугубо человеческое основание или ход рассуждения в противопоставлении свидетельству Закона; «только» передаёт подразумеваемое ограничение, не утверждая, будто человеческий довод сам по себе ложен.
- source_word: ταῦτα
  choice: это
  rationale: В русском собирательное «это» естественно отсылает ко всему предшествующему рассуждению Павла, хотя греческое местоимение имеет форму множественного числа.
- source_word: λαλῶ
  choice: говорю
  rationale: Настоящее время относится к разворачивающемуся рассуждению Павла; простой глагол «говорю» звучит естественно и точно.
- source_word: ἢ
  choice: разве
  rationale: Греческое «или» вводит второй риторический вопрос. В русском отдельный вопрос с повтором «разве» яснее передаёт ход аргумента, чем буквальное «или».
- source_word: καὶ
  choice: и
  rationale: Добавляет Закон как подтверждающего свидетеля наряду с человеческим рассуждением.
- source_word: ὁ νόμος
  choice: Закон
  rationale: Контекст следующего стиха, где цитируется Второзаконие 25:4, указывает на Моисеев Закон как часть Писания; прописная буква обозначает этот конкретный референт.
- source_word: οὐ λέγει
  choice: не говорит
  rationale: Сохранена отрицательная форма риторического вопроса, который предполагает утвердительный ответ.
theological_decisions:
- issue: Значение выражения «по человеку» и соотношение человеческого довода со свидетельством Писания
  choice: «только по человеческому рассуждению» — Павел спрашивает, основан ли его довод лишь на человеческом рассуждении, после чего указывает на подтверждение в Законе
  alternative: «как человек» или «с человеческой точки зрения», что может быть понято как характеристика самого говорящего либо как противопоставление человеческого и божественного
  rationale: 'Контраст со следующим вопросом относится прежде всего к основанию аргумента. Перевод сохраняет напряжение: Павел не обязательно отвергает человеческое рассуждение, но показывает, что Закон свидетельствует о том же.'
- issue: Референт слова ὁ νόμος
  choice: Моисеев Закон, представленный как авторитетное Писание
  alternative: закон или общий принцип в широком смысле
  rationale: Непосредственно следующий стих цитирует Второзаконие 25:4, поэтому здесь имеется в виду конкретный корпус Закона, а не отвлечённый принцип.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Два риторических вопроса делают синтаксис естественным для русского и сохраняют ожидаемые ответы: «нет» на первый и «да» на второй. Слово «Закон» написано с прописной буквы как обозначение Моисеева Закона.'
