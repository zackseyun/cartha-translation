  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: ru
  text: Для иудеев я стал как иудей, чтобы приобрести иудеев[a]; для тех, кто под законом[b], — как находящийся под законом, хотя сам я не под законом, — чтобы приобрести тех, кто под законом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привлечь»; глагол может означать «приобрести» или «склонить на свою сторону».'
    reason: lexical_alternative
  - marker: b
    text: Под «законом» здесь, вероятнее всего, подразумевается закон Моисея.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: я стал
  rationale: Передаёт аорист γίνομαι как принятие Павлом определённого образа поведения по отношению к разным группам, не подразумевая перемены его этнической принадлежности.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: для иудеев ... как иудей
  rationale: 'Дательный падеж передан естественной русской конструкцией «для», а ὡς сохраняет сравнительный смысл: Павел приспосабливал своё поведение к иудеям.'
- source_word: ἵνα ... κερδήσω
  choice: чтобы приобрести
  rationale: Сохраняет основной образ κερδαίνω — «приобретать, получать как приобретение» — и допускает миссионерский смысл привлечения людей, не сводя его к более узкому «убедить».
- source_word: τοῖς ὑπὸ νόμον
  choice: для тех, кто под законом
  rationale: Субстантивированная предложная конструкция передана ясно и буквально; «закон» оставлен без поясняющего добавления в основном тексте.
- source_word: ὡς ὑπὸ νόμον
  choice: как под законом
  rationale: Сжатая формулировка сохраняет параллель с «как иудей» и не утверждает, что Павел действительно находился под законом.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: хотя сам я не под законом
  rationale: Передаёт одновременное уступительно-контрастное уточнение причастного оборота и сохраняет настоящее время как заявление о положении Павла.
- source_word: αὐτὸς
  choice: сам я
  rationale: Сохраняет эмфатический характер αὐτός.
- source_word: νόμος
  choice: закон
  rationale: В контексте наиболее вероятен закон Моисея, однако основной текст сохраняет более широкую и богословски напряжённую формулировку оригинала.
theological_decisions:
- issue: Смысл утверждения Павла, что он «не под законом»
  choice: 'Передать прямо: «хотя сам я не под законом», без дополнительных оговорок.'
  alternative: «Хотя сам я не под законом Моисея» или гармонизирующее пояснение на основании следующего стиха.
  rationale: В греческом тексте данного стиха сказано только, что Павел не находится под законом. Уточнение вида закона в основном тексте или внесение формулировки из 9:21 преждевременно разрешило бы сохраняемое оригиналом богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «под законом» сохранён ради риторической структуры оригинала; парные тире выделяют пояснительную оговорку Павла.
