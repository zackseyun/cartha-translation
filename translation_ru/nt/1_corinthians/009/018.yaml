revisions:
- from: В чём же тогда моя награда? В том, чтобы, возвещая Благую Весть[a], предлагать её даром и не пользоваться в полной мере своим правом при возвещении Благой Вести[b].
  to: Какова же тогда моя награда? Та, что, возвещая Благую Весть[a], я возвещаю её безвозмездно, не пользуясь в полной мере своим правом в деле Благой Вести[b].
  rationale: Перевод уточнён ради естественного русского синтаксиса и более ясной передачи ἀδάπανον. Личная конструкция «я возвещаю» делает зависимое предложение ἵνα прозрачным. «В деле Благой Вести» передаёт сферу, обозначенную ἐν τῷ εὐαγγελίῳ, не навязывая единственное толкование; буквальная и более эксплицитная альтернативы сохранены в сноске.
