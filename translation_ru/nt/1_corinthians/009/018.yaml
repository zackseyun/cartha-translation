source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: ru
  text: Какова же тогда моя награда? Та, что, возвещая Благую Весть[a], я возвещаю её безвозмездно, не пользуясь в полной мере своим правом в деле Благой Вести[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелие»; также в конце стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «своим правом в Благой Вести». Возможный смысл: «своим правом в служении Благой Вести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: награда
  rationale: Вопрос касается не просто платы за труд, а того, что Павел считает своей наградой за служение; дальнейшая фраза парадоксально определяет её как возможность возвещать безвозмездно.
- source_word: εὐαγγελιζόμενος
  choice: возвещая Благую Весть
  rationale: Деепричастие передаёт одновременность действия и сохраняет глагольный характер греческого причастия.
- source_word: ἀδάπανον
  choice: даром
  rationale: Кратко и естественно передаёт значение «без платы, без расходов для получателей» в контексте отказа Павла от материального содержания.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: предлагать её
  rationale: Буквально θήσω означает «положу, представлю», но здесь речь идёт о предоставлении Благой Вести слушателям; местоимение позволяет избежать тяжеловесного повтора, не меняя референта.
- source_word: εὐαγγέλιον
  choice: Благая Весть
  rationale: Передаёт прямое значение слова современным и понятным русским выражением; традиционный вариант «Евангелие» указан в сноске.
- source_word: καταχρήσασθαι
  choice: пользоваться в полной мере
  rationale: В данном контексте глагол указывает на полное использование законного права, а не обязательно на злоупотребление им.
- source_word: ἐξουσίᾳ
  choice: право
  rationale: Контекст главы говорит о законном праве апостола получать материальную поддержку, поэтому «право» точнее общего «власть».
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: при возвещении Благой Вести
  rationale: Греческое выражение обозначает сферу или обстоятельства служения, связанного с Благой Вестью; русский вариант делает эту связь понятной, не сводя её к формальной власти.
theological_decisions:
- issue: Характер ἐξουσία Павла
  choice: Законное право Павла на поддержку при возвещении Благой Вести, которым он добровольно не пользуется в полной мере
  alternative: Апостольская власть в более широком смысле или власть, которой можно злоупотребить
  rationale: Ближайший контекст 1 Кор 9 неоднократно говорит о праве апостола на материальную поддержку. Формулировка не приписывает самому праву отрицательного характера.
- issue: Значение εὐαγγέλιον
  choice: Благая Весть
  alternative: Евангелие
  rationale: Оба варианта возможны; основной текст передаёт прозрачное лексическое значение, а традиционный церковный термин сохранён в сноске.
- issue: Связь заключительной фразы с правом Павла
  choice: Не пользоваться правом в полной мере при возвещении Благой Вести
  alternative: Не злоупотреблять правом
  rationale: Греческое καταχράομαι допускает оттенок злоупотребления, но контекст подчёркивает добровольный отказ от полного осуществления законного права; перевод сохраняет эту мысль без обвинительного оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Риторический вопрос и парадокс сохранены; традиционная терминология не исключена, а дана как допустимая альтернатива. Повтор εὐαγγέλιον частично передан местоимением ради естественности русского синтаксиса.
