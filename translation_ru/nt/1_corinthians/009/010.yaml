  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: ru
  text: 'Или Он говорит это исключительно ради нас? Ведь ради нас это было написано: тот, кто пашет, должен пахать с надеждой, и тот, кто молотит, — с надеждой на участие[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «с надеждой участвовать». В греческом тексте не сказано прямо, в чём именно состоит это участие; это подразумевается из земледельческого образа.'
    reason: implicit_object
lexical_decisions:
- source_word: πάντως
  choice: исключительно / конечно
  rationale: Наречие усиливает риторический вопрос. Вопросительное «исключительно» передаёт возможное значение всецелости, а ответное «конечно» естественно выражает уверенное подтверждение, не скрывая смыслового диапазона.
- source_word: δι’ ἡμᾶς
  choice: ради нас
  rationale: διά с винительным здесь выражает направленность на пользу адресатов; «ради нас» сохраняет этот бенефактивный оттенок и повтор в двух частях стиха.
- source_word: ἐγράφη
  choice: было написано
  rationale: Форма прошедшего времени естественно передаёт аорист пассивного залога и уместна в формуле ссылки на Писание.
- source_word: ὀφείλει
  choice: должен
  rationale: Передаёт нормативную обязанность или обоснованную необходимость, не усиливая её до безусловного принуждения.
- source_word: ἐπ’ ἐλπίδι
  choice: с надеждой
  rationale: Естественное современное русское выражение для труда, совершаемого в ожидании участия в его плодах; повтор сохранён в обеих частях.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: тот, кто пашет, должен пахать
  rationale: Сохраняет обобщённую конструкцию, лексический повтор и параллелизм греческого текста.
- source_word: ὁ ἀλοῶν
  choice: тот, кто молотит
  rationale: Передаёт обобщённое обозначение работника и поддерживает синтаксический параллелизм с пахарем.
- source_word: τοῦ μετέχειν
  choice: получить свою долю
  rationale: μετέχω означает участвовать или иметь долю. Русская формулировка естественна в сельскохозяйственном контексте, при этом не называет прямо не выраженный в греческом объект.
theological_decisions:
- issue: Значение πάντως в риторическом вопросе
  choice: В основном тексте представлены оттенки всецелости («исключительно») и уверенного подтверждения («конечно»).
  alternative: «Неужели Он говорит это только ради нас?» или «Разве не ради нас Он это говорит?»
  rationale: Греческое наречие допускает усиление как объёма утверждения, так и его несомненности. Перевод не сводит неоднозначность к одному оттенку, а сноска прямо её отмечает.
- issue: Неявный объект τοῦ μετέχειν
  choice: «получить свою долю» без уточнения, долю чего именно
  alternative: «участвовать в урожае» или «получить долю урожая»
  rationale: Сельскохозяйственный контекст ясно подразумевает участие в плодах труда, однако сам объект в греческом тексте не назван. Выбранная формулировка сохраняет эту недосказанность и аргумент Павла о праве работника на долю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены риторический вопрос, повтор «ради нас», параллелизм пахоты и молотьбы и неявность объекта участия. Местоимение «Он» написано с прописной буквы как традиционное уважительное обозначение Бога, без добавления конфессионального толкования.
