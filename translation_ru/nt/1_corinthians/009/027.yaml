  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: ru
  text: Но я сурово усмиряю своё тело[a] и порабощаю его[b], как бы мне самому, проповедав другим, не оказаться дисквалифицированным[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наношу удары своему телу». Греческий глагол буквально может означать «бить под глаз»; здесь это яркий образ суровой самодисциплины.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обращаю его в рабство» или «делаю его рабом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не выдержавшим испытания», «не получившим одобрения», «отвергнутым как негодный». «Дисквалифицированным» особенно подчёркивает образ состязания в ближайшем контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: сурово усмиряю
  rationale: Глагол буквально может означать удар под глаз, а в данном контексте передаёт образ жёсткой телесной дисциплины. «Сурово усмиряю» сохраняет силу метафоры, не превращая её без необходимости в прямое утверждение о нанесении себе побоев.
- source_word: σῶμα
  choice: тело
  rationale: 'Сохраняется конкретное значение греческого существительного: Павел прямо называет тело объектом дисциплины.'
- source_word: δουλαγωγῶ
  choice: порабощаю его
  rationale: Сильный глагол означает обращать в рабство, подчинять как раба. «Порабощаю» сохраняет резкость исходной метафоры.
- source_word: μή πως
  choice: чтобы... не
  rationale: Естественная русская передача отрицательной цели или опасения; оттенок возможного нежелательного исхода выражен конструкцией с «не оказаться».
- source_word: ἄλλοις
  choice: другим
  rationale: Дательный падеж при κηρύξας естественно передаётся по-русски как адресат проповеди.
- source_word: κηρύξας
  choice: проповедав
  rationale: Деепричастие передаёт предшествование действия и публичное возвещение, выраженные аористным причастием.
- source_word: ἀδόκιμος
  choice: недостойным
  rationale: Слово означает не выдержавшего испытания, не получившего одобрения, отвергнутого как непригодный. «Недостойным» звучит естественно и сохраняет серьёзность предупреждения, не сводя его однозначно ни к потере спасения, ни только к утрате награды.
- source_word: γένωμαι
  choice: не оказаться
  rationale: Передаёт опасение относительно возможного результата; по-русски здесь естественнее «оказаться», чем буквальное «стать».
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущему рассуждению об усилиях атлета и самообладании.
theological_decisions:
- issue: Смысл опасения Павла оказаться ἀδόκιμος
  choice: «оказаться недостойным» — не выдержать проверки и не получить одобрения
  alternative: быть окончательно отвергнутым Богом; либо лишиться только служебной пригодности или награды
  rationale: Контекст состязания поддерживает идею испытания и одобрения, однако сам греческий текст не уточняет, идёт ли речь об окончательном отвержении, утрате награды или непригодности к служению. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Сохранены тело как конкретный объект дисциплины, сильная метафора рабского подчинения и неоднозначность ἀδόκιμος. Формулировка понятна широкому читателю и не вносит конфессионального толкования.
