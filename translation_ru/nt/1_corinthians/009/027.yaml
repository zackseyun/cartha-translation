    rationale: В русском это прежде всего означает морально не заслуживающий чего-либо. Ἀδόκιμος означает не выдержавший проверки, не получивший одобрения, негодный/отвергнутый; контекст 1 Кор 9 особенно поддерживает «дисквалифицированный».
  - severity: low
    issue: Недостаточно выражен оттенок опасения в μή πως
    rationale: «Чтобы ... не» возможно, но может читаться как простая цель. «Как бы мне самому ... не оказаться» яснее передаёт предостережение и неопределённый оттенок πως.
