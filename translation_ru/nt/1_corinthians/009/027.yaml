- from: Но я сурово усмиряю своё тело[a] и порабощаю его[b], чтобы, проповедав другим, самому не оказаться недостойным[c].
  to: Но я сурово усмиряю своё тело[a] и порабощаю его[b], как бы мне самому, проповедав другим, не оказаться дисквалифицированным[c].
  rationale: Заменено «недостойным» на «дисквалифицированным», чтобы избежать не свойственного ἀδόκιμος акцента на моральной ценности и точнее передать лексику проверки/одобрения в атлетическом контексте. «Как бы мне самому ... не оказаться» сохраняет предостерегающий и неопределённый оттенок μή πως. Сноски приведены в соответствие с выбранным чтением и сохранены все привязки.
