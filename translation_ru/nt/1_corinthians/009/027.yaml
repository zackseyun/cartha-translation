review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: σῶμα сохранено как «тело», а δουλαγωγῶ — как сильная метафора порабощения. Однако «недостойным» для ἀδόκιμος смещает значение к моральной недостойности, тогда как греческое слово говорит о непригодности после проверки, неодобрении или дисквалификации; в ближайшем контексте состязания «дисквалифицированным» наиболее точно сохраняет образ и не разрешает богословский спор. Конструкция μή πως лучше передаётся с оттенком опасения: «как бы ... не».'
  naturalness: 'Исправленная фраза естественна для современного литературного русского: деепричастие «проповедав» ясно обозначает предшествующее действие, а порядок «как бы мне самому ... не оказаться» делает отрицательное опасение прозрачным.'
  terminology: «Сурово усмиряю» адекватно передаёт метафорическую суровость ὑπωπιάζω; сноска сохраняет буквальный образ удара под глазом. «Порабощаю» удачно передаёт δουλαγωγῶ без смягчения. «Дисквалифицированным» передаёт ἀδόκιμος в спортивном контексте, не утверждая ни окончательного отвержения, ни лишь утраты награды.
