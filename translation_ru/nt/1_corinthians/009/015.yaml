id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: ru
  text: Но я ничем из этого не воспользовался[a]. И написал я это не для того, чтобы так поступали со мной. Ведь мне лучше умереть, чем… Никто не лишит меня того, чем я хвалюсь![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ни одним из названных выше прав.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом фраза обрывается после слова «чем…», а затем продолжается: «Никто не лишит меня того, чем я хвалюсь!» По смыслу фразу нередко сглаживают: «мне лучше умереть, чем допустить, чтобы кто-нибудь лишил меня того, чем я хвалюсь».'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: не воспользовался
  rationale: 'Перфект передаёт сохраняющийся результат: Павел до настоящего времени не воспользовался обсуждавшимися правами. Русское «не воспользовался» естественно выражает сознательное неиспользование доступной возможности.'
- source_word: οὐδενὶ τούτων
  choice: ничем из этого
  rationale: Сохраняется буквальная неопределённость греческого выражения, тогда как контекст указывает на перечисленные выше права апостола.
- source_word: οὐκ ἔγραψα δὲ ταῦτα
  choice: И написал я это не для того
  rationale: Отрицание по смыслу относится к цели написанного, а инверсия естественно подчёркивает, что Павел не добивается такого отношения к себе. Единственное «это» по-русски обозначает всё только что написанное.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: чтобы так поступали со мной
  rationale: Сжатая греческая конструкция означает, что Павел не пишет ради получения описанного содержания; безлично-пассивный смысл естественно передан активной неопределённо-личной конструкцией.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: Ведь мне лучше умереть
  rationale: Передаёт сравнительную оценку непосредственно, не усиливая её условным «я предпочёл бы».
- source_word: τὸ καύχημά μου
  choice: того, чем я хвалюсь
  rationale: καύχημα здесь допускает значение предмета или основания для похвалы. Описательная русская конструкция естественнее отвлечённого «моё хваление» и не уточняет сверх текста, в чём именно состоит это основание.
- source_word: κενώσει
  choice: лишит
  rationale: Метафорическое «опустошит» здесь означает лишить содержания, силы или основания. «Лишит меня того, чем я хвалюсь» естественно передаёт результат, не вводя неясного сочетания «опустошит мою похвалу».
theological_decisions:
- issue: Синтаксический обрыв после ἤ («чем…» / «нежели…»)
  choice: 'Сохранить обрыв: «мне лучше умереть, чем… Никто не лишит меня того, чем я хвалюсь!»'
  alternative: 'Сгладить: «мне лучше умереть, чем допустить, чтобы кто-нибудь лишил меня того, чем я хвалюсь»'
  rationale: В греческом после ἤ фраза обрывается, а затем мысль возобновляется самостоятельным утверждением. Многоточие сохраняет эмоциональную напряжённость и подлинную нерегулярность источника, не дополняя отсутствующие слова.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Сохранены контраст, подчёркнутый порядок слов и эмоциональный синтаксический обрыв; контекстуальное слово «права» вынесено в примечание, чтобы не устранять лаконичность оригинала.
