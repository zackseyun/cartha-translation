  text: ἐγενόμην τοῖς ⸀ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· τοῖς πᾶσιν ⸀γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: ru
  text: Для слабых я стал слабым[a], чтобы привлечь слабых. Для всех я стал всем, чтобы всеми возможными средствами[b] спасти некоторых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слабых в вопросах совести»; в 1 Коринфянам слово «слабые» может особенно обозначать людей с уязвимой совестью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «так или иначе» или «во что бы то ни стало»; греческое слово может подчёркивать использование всех возможных способов для достижения цели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: я стал
  rationale: Аорист γίνομαι обозначает то, что Павел принимал положение или образ действий, соответствующий тем, кому служил; «стал» естественно передаёт это по-русски.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: слабых / слабым / слабых
  rationale: Повтор одного корня сохраняет риторическую силу греческого текста. «Слабые» оставляет выражение достаточно широким, не сводя его только к людям со слабой совестью.
- source_word: κερδήσω
  choice: приобрести
  rationale: В миссионерском контексте глагол означает обрести людей, склонив их к вере; «приобрести» сохраняет образ исходного слова и связь с контекстом главы.
- source_word: τοῖς πᾶσιν
  choice: для всех
  rationale: Греческий дательный обозначает тех, применительно к кому Павел менял свой образ действий. Краткое «для всех» естественно и не требует добавления отсутствующего существительного.
- source_word: γέγονα
  choice: я стал
  rationale: Перфект указывает на сложившийся образ служения Павла. В русском «я стал» передаёт достигнутое состояние без неестественной тяжеловесности.
- source_word: πάντα
  choice: всем
  rationale: В сочетании «для всех я стал всем» сохраняются широта, лаконизм и игра повторяющихся форм πᾶς.
- source_word: πάντως
  choice: всеми возможными средствами
  rationale: В данном контексте наречие выражает использование всевозможных средств ради цели. Формулировка не подразумевает нравственно недопустимых способов; возможные оттенки отмечены в сноске.
- source_word: τινὰς
  choice: некоторых
  rationale: 'Неопределённое местоимение скромно ограничивает ожидаемый результат: Павел говорит не обо всех, а о некоторых.'
- source_word: σώσω
  choice: спасти
  rationale: Глагол несёт прямое значение спасения. Такая передача сохраняет богословскую весомость слов Павла, не добавляя объяснения о характере его участия.
theological_decisions:
- issue: Значение выражения «слабые»
  choice: В основном тексте оставить широкое «слабые».
  alternative: «слабые совестью» или «немощные»
  rationale: В 1 Коринфянам это слово нередко относится к людям с уязвимой совестью, особенно в главах 8–10, однако сам стих сохраняет более широкую формулировку. Уточнение в основном тексте неоправданно сузило бы смысл.
- issue: Смысл слов «спасти некоторых»
  choice: Сохранить прямое «спасти», как в греческом тексте.
  alternative: «привести некоторых к спасению» или «содействовать спасению некоторых»
  rationale: σώσω выражает подлинную цель спасения и представляет Павла как действующего участника благовестия. Ослабление глагола недопередало бы текст, а добавочное догматическое разъяснение вышло бы за его рамки.
- issue: Предел выражения «для всех я стал всем»
  choice: Сохранить широкую, напряжённую формулировку без поясняющего ограничения в основном тексте.
  alternative: «я приспосабливался ко всем во всём дозволенном»
  rationale: Контекст говорит о добровольном приспособлении ради благовестия, но сам стих не вводит явного уточнения «дозволенном». Добавлять его означало бы заранее разрешить заложенное в тексте напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаической тяжеловесности. Повтор «слабых — слабым — слабых» и конструкция «для всех я стал всем» сохраняют риторический рисунок греческого текста; сноски отмечены в основном тексте как [a] и [b].
