  text: Do we not have the right to eat and drink?[a]
translation:
  language: ru
  text: Разве мы не вправе есть и пить?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве у нас нет права есть и пить?» В контексте речь, вероятно, идёт о праве получать пищу и питьё как материальную поддержку служения.'
    reason: Лексическая альтернатива и контекстуальное уточнение значения ἐξουσίαν.
lexical_decisions:
- source_word: μὴ οὐκ
  choice: Разве мы не
  rationale: Сочетание вводит риторический вопрос, предполагающий утвердительный ответ. Такая конструкция естественна в современном русском и сохраняет вопросительную форму оригинала.
- source_word: ἔχομεν
  choice: вправе
  rationale: Значение глагола «иметь» передано вместе с существительным ἐξουσίαν устойчивой русской конструкцией «быть вправе».
- source_word: ἐξουσίαν
  choice: вправе
  rationale: В данном контексте речь идёт не о власти над другими и не о физической силе, а о законном праве или дозволенной свободе. «Вправе» кратко и естественно передаёт конструкцию ἔχομεν ἐξουσίαν.
- source_word: φαγεῖν
  choice: есть
  rationale: Инфинитив прямо передаёт обозначенное действие после выражения права.
- source_word: καὶ πεῖν
  choice: и пить
  rationale: Сочинённые инфинитивы естественно и точно передаются как «есть и пить».
theological_decisions:
- issue: Объём подразумеваемого апостольского права
  choice: В основном тексте сохранена общая формулировка о праве есть и пить.
  alternative: Прямо указать право получать пищу и питьё как материальную поддержку от общины.
  rationale: Контекст главы связывает вопрос с правами апостола и материальным содержанием служителей, однако сам стих не называет общину или поддержку прямо. Перевод не должен устранять эту контекстуальную недосказанность.
translation_notes:
  register: Современный литературный русский язык; риторическая краткость и достоинство оригинала сохранены. Формулировка «вправе» понятна широкому кругу читателей и не вносит конфессионально обусловленного толкования.
