lexical_decisions:
- source_word: Περὶ δὲ
  choice: О
  rationale: Естественно вводит новую тему послания; частица δέ выполняет переходную функцию и не требует добавления временного «теперь».
- source_word: τῶν εἰδωλοθύτων
  choice: пище, принесённой в жертву идолам
  rationale: Передаёт культовый контекст и не сужает значение до одного лишь мяса.
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Прямой и естественный эквивалент глагольной формы с настоящим значением.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: что все мы обладаем знанием
  rationale: Сохраняет включающее «мы» и повтор корня «знание», не решая, является ли фраза коринфским лозунгом.
- source_word: ἡ γνῶσις
  choice: Знание
  rationale: Сохраняет прямую лексическую связь с предшествующим γνῶσιν.
- source_word: φυσιοῖ
  choice: раздувает
  rationale: Сохраняет яркую метафору надменного «вздутия», не сводя её к пояснительному «делает гордым».
- source_word: ἡ δὲ ἀγάπη
  choice: а любовь
  rationale: Русское противопоставительное «а» естественно передаёт δέ в парной антитезе.
- source_word: οἰκοδομεῖ
  choice: созидает
  rationale: Передаёт метафору строительства и звучит достойно и понятно в современном литературном русском.
theological_decisions:
- issue: Является ли «все мы обладаем знанием» утверждением Павла или цитатой из коринфского лозунга
  choice: Фраза оставлена в основном тексте без кавычек и уточнений
  alternative: Оформить её как прямую цитату или явно назвать коринфским утверждением
  rationale: В греческом тексте нет бесспорных графических или синтаксических указателей цитаты; примечание сохраняет реальную риторическую неоднозначность.
