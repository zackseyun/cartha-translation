base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: ru
  text: О пище, принесённой в жертву идолам[a], мы знаем, что все мы обладаем знанием[b]. Знание раздувает, а любовь созидает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мясе, принесённом в жертву идолам» или «том, что принесено в жертву идолам».'
