id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: ru
  text: А согрешая так против братьев[a] и раня их немощную совесть, вы согрешаете против Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «братья» — единоверцы; по контексту это слово может относиться как к мужчинам, так и к женщинам.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «против Христа». Греческое Χριστός означает «Мессия, Помазанник».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: А … так
  rationale: δέ дано как лёгкая связка с предыдущей мыслью, а οὕτως — как указание на описанный ранее образ действия. Разнесённая конструкция естественна по-русски и связывает «так» непосредственно с «согрешая».
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: согрешая … против братьев
  rationale: Причастие настоящего времени передаёт сопутствующее действие, а εἰς при ἁμαρτάνω имеет направленное значение «против».
- source_word: τύπτοντες
  choice: раня
  rationale: Буквально глагол означает «ударять», но здесь употреблён метафорически о совести; «раня» сохраняет силу образа и звучит естественно в современном русском языке.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: их немощную совесть
  rationale: Сохранено единственное число греческого существительного с распределительным значением. «Немощную» передаёт не физическую слабость, а уязвимость совести в данном контексте.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: вы согрешаете против Мессии
  rationale: Повтор εἰς передан тем же предлогом «против», а настоящее время — формой «согрешаете». Χριστός сохранён как титул «Мессия».
theological_decisions:
- issue: Значение ἀδελφοὺς в церковном обращении
  choice: братьев
  alternative: братьев и сестёр; единоверцев
  rationale: Основной текст сохраняет мужской род греческой формы, а примечание поясняет, что в контексте речь может идти обо всех верующих, включая женщин.
- issue: Передача Χριστόν
  choice: Мессии
  alternative: Христа
  rationale: Греческое Χριστός является титулом «Помазанник / Мессия». Традиционный русский эквивалент «Христос» указан в примечании без устранения титульного смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Синтаксический параллелизм двух форм на «-я» сохраняет нарастание исходной фразы; лексика понятна широкому читателю без упрощения богословского содержания.
