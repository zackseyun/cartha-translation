  rationale: Заменена тяжеловесная номинализация на устойчивое современное литературно-библейское выражение «вводить в соблазн». Оно сохраняет повтор σκανδαλίζει / σκανδαλίσω, различие между пищей вообще и мясом, а также усиленную временную формулу «вовек».
