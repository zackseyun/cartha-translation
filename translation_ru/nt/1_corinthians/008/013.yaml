id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: ru
  text: Поэтому, если пища вводит моего брата в соблазн, то я вовек не буду есть мяса, чтобы не ввести в соблазн моего брата.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: пища
  rationale: Общее слово «пища» сохраняет отличие от более конкретного κρέα — «мясо».
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: становится / стать причиной падения
  rationale: Передаёт не просто огорчение, а побуждение другого к духовно-нравственному падению; повтор корня по возможности сохранён.
- source_word: κρέα
  choice: мяса
  rationale: Естественный русский эквивалент в данном контексте употребления мяса в пищу.
- source_word: εἰς τὸν αἰῶνα
  choice: вовек
  rationale: Сохраняет сильную временную формулировку оригинала и не ослабляет её до «больше никогда».
- source_word: οὐ μὴ φάγω
  choice: не буду есть
  rationale: Категорическое отрицание передано твёрдым обещанием; его усиление в русском поддерживается словом «вовек».
theological_decisions:
- issue: Смысл σκανδαλίζω
  choice: стать причиной падения
  alternative: соблазнить / заставить споткнуться
  rationale: «Соблазнить» в современном русском может подразумевать привлекательное искушение, а буквальное «споткнуться» звучит неестественно; выбранная формулировка сохраняет нравственно-духовный смысл без уточнения характера падения.
- issue: Сила εἰς τὸν αἰῶνα
  choice: вовек
  alternative: никогда больше
  rationale: Оригинал содержит усиленную и предельно широкую формулу; перевод не ограничивает её подразумеваемым сроком.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Синтаксический параллелизм двух употреблений σκανδαλίζω сохранён, а «вовек» передаёт торжественную категоричность исходной фразы.
