  source_fidelity: 'Смысл в целом передан верно: βρῶμα отличено от κρέα, категоричность οὐ μὴ... εἰς τὸν αἰῶνα сохранена. Однако конструкция «становится причиной падения» несколько отвлечённо перефразирует σκανδαλίζει и ослабляет намеренный глагольный повтор оригинала.'
  naturalness: Текст понятен, но «становится причиной падения» / «стать причиной падения» тяжеловесно для современного литературного русского. Устойчивое «вводить в соблазн» естественнее в библейском регистре и позволяет сохранить повтор.
  terminology: «Пища», «мясо» и «вовек» удачны. «Ввести в соблазн» передаёт σκανδαλίζω как причинение духовного преткновения, не навязывая уточнённого механизма или результата.
