  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: ru
  text: Но если кто любит Бога, тот познан Им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признан Им»; возможен также перевод: «был познан Им». Греческая форма перфекта может указывать на сохраняющееся состояние: Бог познал этого человека, и тот остаётся познанным Им.'
    reason: Лексическая и аспектуальная альтернатива для ἔγνωσται.
lexical_decisions:
- source_word: εἰ δέ
  choice: Но кто
  rationale: δέ выражает мягкое противопоставление предыдущему рассуждению, а условное εἰ в сочетании с неопределённым τις естественно передаётся по-русски обобщающей конструкцией «кто».
- source_word: τις
  choice: кто
  rationale: Неопределённое местоимение имеет обобщающее и гендерно нейтральное значение; конструкция «кто… тот» естественна для современного русского языка.
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Прямое и обычное соответствие настоящему времени ἀγαπάω, без смыслового расширения.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Определённый объект передан естественной русской формой без артикля.
- source_word: οὗτος
  choice: тот
  rationale: Соотносительная конструкция «кто… тот» сохраняет указательную и слегка подчёркнутую функцию οὗτος.
- source_word: ἔγνωσται
  choice: познан
  rationale: Краткое страдательное причастие передаёт перфектное состояние как результат совершившегося действия и сохраняет связь с глаголом «знать/познавать», не сводя смысл к одобрению.
- source_word: ὑπ’ αὐτοῦ
  choice: Им
  rationale: Местоимение естественно относится к Богу; прописная буква помогает ясно обозначить этот референт в русской библейской традиции.
theological_decisions:
- issue: Смысл того, что человек «познан» Богом
  choice: познан Им
  alternative: признан Им; известен Ему; одобрен Им
  rationale: Формулировка сохраняет широкий смысл божественного знания, которое может подразумевать личное признание и отношения, но греческий текст не требует ограничивать его одобрением или отдельно уточнённым спасительным смыслом.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной конструкцией «кто… тот». «Познан» несколько возвышенно, но понятно и точно сохраняет смысловую связь с темой знания в контексте; богословская многозначность не снимается.
