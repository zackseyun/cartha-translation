  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: ru
  text: Ведь даже если существуют так называемые боги[a] — на небе или на земле, — а богов и господ[b] действительно много, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «именуемые богами». Греческое причастие может означать просто «называемые»; выражение «так называемые» в данном контексте передаёт дистанцирование Павла от этих претендентов на божественность.'
    reason: lexical_alternative
  - marker: b
    text: «Господ» передаёт множественное число того же греческого слова, которое часто переводится как «Господь». Здесь имеются в виду многочисленные существа или силы, которым люди дают этот титул, в отличие от единого Господа в стихе 6.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь даже
  rationale: «Ведь» передаёт пояснительную силу γάρ и связывает стих с предыдущей мыслью, а «даже» отражает усилительное καί.
- source_word: εἴπερ
  choice: если и
  rationale: Оборот вводит допущение ради рассуждения; русское «даже если и» естественно передаёт его уступительный и усиленный характер.
- source_word: λεγόμενοι θεοὶ
  choice: так называемые боги
  rationale: Причастие обозначает данное им наименование, а «так называемые» сохраняет дистанцирование Павла от признания их истинными богами.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: на небе или на земле
  rationale: Сохраняется парное противопоставление двух сфер и естественная для русского языка космологическая формулировка.
- source_word: ὥσπερ
  choice: как и действительно
  rationale: Передаёт подтверждающее замечание Павла, не снимая напряжения между условным допущением и фактом существования множества признаваемых людьми богов и господ.
- source_word: θεοὶ πολλοὶ καὶ κύριοι πολλοί
  choice: много богов и много господ
  rationale: Повтор «много» сохраняет параллелизм греческого текста; строчные буквы отличают этих носителей титулов от единого Бога и единого Господа в стихе 6.
theological_decisions:
- issue: Дистанцирование Павла от языческих божеств
  choice: «так называемые боги»
  alternative: «именуемые богами»
  rationale: Выбранный вариант ясно передаёт, что речь идёт о тех, кого называют богами, не утверждая их божественность; при этом сноска сохраняет более нейтральную возможность понимания причастия.
- issue: Соотношение «многих господ» с единым Господом в стихе 6
  choice: «господ» со строчной буквы
  alternative: «владык»
  rationale: «Господ» сохраняет лексическую связь κύριοι с κύριος в следующем стихе и тем самым не ослабляет намеренный контраст, а строчная буква не отождествляет их с единым Господом.
- issue: Статус множества богов и господ
  choice: Сохранить фразу «как и действительно есть» без поясняющего ограничения
  alternative: «как и действительно признаётся много богов и много господ»
  rationale: Греческий текст прямо использует εἰσίν («есть»). Перевод сохраняет богословское напряжение и не подменяет его толкованием о том, в каком именно смысле они существуют.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Тире выделяют вставное уточнение и сохраняют незавершённость синтаксиса, продолжающегося в стихе 6. Формулировка избегает как архаизма, так и излишнего разъяснения непосредственно в тексте.
