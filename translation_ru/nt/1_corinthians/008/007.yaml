  terminology: «Знание», «совесть», «слабая» и «оскверняется» удачны. «Идоложертвенная» — закреплённый в русском библейском употреблении термин; конструкция «как идоложертвенную» отмечает восприятие пищи теми, о ком говорит Павел. Следует также восстановить сноску о текстовом варианте, соответствующую аудиторскому следу и важную для слова «совесть».
