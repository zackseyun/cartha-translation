  source_fidelity: 'Основной смысл передан верно: γνῶσις — «знание», εἰδωλόθυτον — пища, воспринимаемая как принесённая идолу, а слабая совесть «оскверняется». Однако «по укоренившейся доныне привычке к идолу» по-русски неестественно и создаёт впечатление, будто идол является объектом обычной бытовой привычки. Трудную греческую связь συνήθεια ἕως ἄρτι τοῦ εἰδώλου следует передать более идиоматично, сохранив её неуверенное синтаксическое соотнесение в сноске.'
