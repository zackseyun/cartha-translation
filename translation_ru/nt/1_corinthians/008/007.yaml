base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: ru
  text: Но не у всех есть это знание. Некоторые по привычке, связанной с идолом и сохраняющейся доныне,[a] едят эту пищу как идоложертвенную, и их совесть, будучи слабой,[b] оскверняется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально включает слова «по привычке … доныне … идола» и синтаксически трудно. Его также понимают как указание на продолжающееся влияние прежней связи с идолопоклонством.
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях в этой части стиха читается «совесть идола» либо встречаются близкие варианты. Основной текст следует чтению SBLGNT: «их совесть».'
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: знание
  rationale: Сохраняет связь с ближайшим контекстом, где речь идёт о знании того, что идол — ничто.
- source_word: συνήθεια
  choice: укоренившаяся привычка
  rationale: Передаёт приобретённую прежним участием устойчивую привычку или знакомство с идольским культом, не сводя выражение к нейтральному обычаю.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: доныне … к идолу
  rationale: По возможности сохраняет временной элемент ἕως ἄρτι и трудную связь родительного τοῦ εἰδώλου с συνήθεια.
- source_word: εἰδωλόθυτον
  choice: пища, принесённая в жертву идолу
  rationale: Ясно передаёт культовое происхождение пищи и то, как её воспринимают участники, не признавая идола подлинным божеством.
- source_word: συνείδησις
  choice: совесть
  rationale: Обычное и точное соответствие для нравственного самосознания в этическом рассуждении Павла.
- source_word: ἀσθενής
  choice: слабая
  rationale: Сохраняет ключевое для главы обозначение совести, которой недостаёт твёрдости в этом вопросе.
- source_word: μολύνεται
  choice: оскверняется
  rationale: Передаёт образ нравственного загрязнения с надлежащей этической силой.
theological_decisions:
- issue: Как описать идоложертвенную пищу, не подразумевая, что идолы являются настоящими богами
  choice: едят эту пищу как принесённую в жертву идолу
  alternative: едят идоложертвенное
  rationale: Формулировка передаёт культовое значение пищи в восприятии едящего, но не утверждает реальность идола как божества.
- issue: Связь слабости совести с осквернением
  choice: совесть, будучи слабой, оскверняется
  alternative: слабая совесть оскверняется
  rationale: Причастная конструкция сохраняет причинно-обстоятельственный оттенок греческого ἀσθενὴς οὖσα, не уточняя его сверх текста.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и доступный. Необычность греческой фразы передана достаточно близко, а её неоднозначность отмечена в сноске.
