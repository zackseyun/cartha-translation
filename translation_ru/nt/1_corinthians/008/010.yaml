revisions:
- from: Ведь если кто-нибудь увидит, что ты, обладающий знанием, возлежишь за трапезой в капище идола, то не побудит ли это его, немощного в совести, есть принесённое в жертву идолам?[a]
  to: Ведь если кто-нибудь увидит, что ты, обладающий знанием, возлежишь за трапезой в капище идола, то не укрепится ли его совесть — ведь он слаб — настолько, что он станет есть принесённое в жертву идолам?[a]
  rationale: Исправление восстанавливает «совесть» как подлежащее риторического вопроса и страдательно-результативную направленность греческого οἰκοδομηθήσεται, избегая неестественного «немощного в совести». Добавление «настолько, что он станет» естественно передаёт результативное εἰς τὸ ... ἐσθίειν; местоимение «он» однозначно относится к слабому наблюдателю.
