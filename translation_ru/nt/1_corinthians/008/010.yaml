  - severity: low
    issue: «Немощного в совести» неестественно и может восприниматься как характеристика, вставленная без ясной синтаксической связи.
    rationale: ἀσθενοῦς ὄντος характеризует человека-наблюдателя. Более ясная русская конструкция должна выражать это без неуклюжего оборота.
