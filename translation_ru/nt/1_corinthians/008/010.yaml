source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: ru
  text: Ведь если кто-нибудь увидит, что ты, обладающий знанием, возлежишь за трапезой в капище идола, то не укрепится ли его совесть — ведь он слаб — настолько, что он станет есть принесённое в жертву идолам?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не созиждется ли его совесть к тому, чтобы есть». Павел употребляет здесь обычное для него слово «созидать», вероятно с иронией: такое «созидание» ведёт к пагубному поступку. По смыслу: «не осмелеет ли» или «не будет ли побуждён».'
    reason: Сохраняет буквальный образ и вероятную иронию οἰκοδομηθήσεται наряду с естественным русским переводом в основном тексте.
lexical_decisions:
- source_word: γάρ
  choice: Ведь
  rationale: Вводит пояснение и основание предшествующего предостережения; «ведь» естественно передаёт аргументативную связь.
- source_word: τις
  choice: кто-нибудь
  rationale: Сохраняет неопределённый и гипотетический характер лица.
- source_word: ἴδῃ
  choice: увидит
  rationale: Аорист сослагательного наклонения с ἐὰν образует условие; в русском естественна форма будущего времени после «если».
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: что ты, обладающий знанием
  rationale: Передаёт направленность к адресату и характеризующий его артиклевый причастный оборот без тяжеловесной буквальности.
- source_word: γνῶσιν
  choice: знанием
  rationale: Сохраняет ключевой для 1 Кор 8 термин и его связь с контекстом.
- source_word: ἐν εἰδωλείῳ
  choice: в капище идола
  rationale: «Капище» точно обозначает языческое культовое помещение, а единственное число сохраняет форму исходного текста.
- source_word: κατακείμενον
  choice: возлежишь за трапезой
  rationale: Передаёт принятую в древности позу участника трапезы и делает подразумеваемый контекст еды понятным современному читателю.
- source_word: οὐχὶ
  choice: не ... ли
  rationale: Оформляет риторический вопрос, предполагающий утвердительный ответ.
- source_word: ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος
  choice: его, немощного в совести
  rationale: Относит слабость к наблюдающему человеку и естественно выражает по-русски слабость его нравственного сознания.
- source_word: οἰκοδομηθήσεται
  choice: побудит
  rationale: В данном контексте глагол означает, что пример знающего подтолкнёт слабого к действию; буквальный образ «созидания» и его вероятная ирония сохранены в примечании.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: есть принесённое в жертву идолам
  rationale: Передаёт результат или направленность воздействия и сохраняет культовое значение εἰδωλόθυτα.
theological_decisions:
- issue: Значение οἰκοδομηθήσεται в контексте пагубного подражания
  choice: побудит
  alternative: не «созиждется ли ... к тому, чтобы есть»
  rationale: По-русски буквальное «созидаться к тому, чтобы есть» неясно и неестественно. «Побудит» передаёт контекстуальный результат, а примечание сохраняет обычную для Павла лексику созидания и вероятную иронию, не устраняя напряжения.
- issue: Характер слабости наблюдающего
  choice: немощного в совести
  alternative: будучи немощным
  rationale: Формулировка ясно связывает немощь с совестью в соответствии с контекстом главы, не приписывая человеку общую физическую или духовную слабость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Капище» и «возлежишь за трапезой» сохраняют историко-культовый колорит, оставаясь понятными; синтаксис риторического вопроса сделан естественным для русского языка.
