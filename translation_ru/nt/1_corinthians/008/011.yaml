id: 1CO.8.11
reference: 1 Corinthians 8:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: ru
  text: Ибо из-за твоего знания гибнет слабый[a] — брат[b], за которого умер Мессия[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «погибает», «оказывается погублен». Греческий глагол может означать тяжёлую пагубу или уничтожение; из самого выражения не вполне ясно, имеет ли Павел в виду нынешнее духовное разорение, окончательную гибель или и то и другое.'
    reason: alternative_reading
  - marker: b
    text: Здесь «брат» означает единоверца; по смыслу сказанное применимо к брату или сестре по вере.
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте — «Христос»; здесь это слово передано как «Мессия», поскольку оно употреблено как титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: гибнет
  rationale: Настоящее время и залог греческой формы переданы русским несовершенным глаголом. «Гибнет» сохраняет серьёзность значения — гибель, разрушение, пагубу, — но само по себе не разрешает спорный вопрос, говорится ли исключительно о нынешнем духовном ущербе, об окончательной гибели или о том и другом.
- source_word: γάρ
  choice: ибо
  rationale: Союз вводит объяснение предыдущего предостережения. «Ибо» кратко и естественно передаёт эту логическую связь в достойном литературном регистре.
- source_word: ὁ ἀσθενῶν
  choice: слабый
  rationale: Субстантивированное причастие обозначает «того, кто слаб». Прилагательное в значении существительного сохраняет единственное число и не вводит слово «брат» раньше его отдельного появления в греческом тексте.
- source_word: ἐν τῇ σῇ γνώσει
  choice: из-за твоего знания
  rationale: 'Предлог ἐν здесь обозначает связанную с причиной или средством сферу: пагуба слабого происходит вследствие того, как другой человек пользуется своим знанием. «Из-за» ясно передаёт причинную силу и сохраняет иронию Павла.'
- source_word: γνῶσις
  choice: знание
  rationale: Сохраняется ключевой термин ближайшего контекста (8:1, 7, 10) и контраст между заявленным знанием и его пагубным действием без любви.
- source_word: ὁ ἀδελφός
  choice: брат
  rationale: Мужской род и единственное число исходного слова сохранены; в сноске поясняется контекстуальное значение — единоверец.
- source_word: δι’ ὃν
  choice: за которого
  rationale: διά с винительным падежом выражает действие в пользу или ради названного человека. «За которого» — естественное русское выражение применительно к смерти Мессии.
- source_word: Χριστός
  choice: Мессия
  rationale: Здесь Χριστός имеет титульное значение; «Мессия» передаёт его смысл, а не просто воспроизводит традиционную форму «Христос».
- source_word: ἀπέθανεν
  choice: умер
  rationale: Аорист изъявительного наклонения обозначает совершившееся событие и естественно передаётся русским прошедшим временем.
theological_decisions:
- issue: Подразумевает ли ἀπόλλυται окончательную вечную гибель верующего
  choice: В основном тексте употреблено «гибнет» без уточнения характера и окончательности гибели.
  alternative: «погибает», «оказывается погублен», «разрушается»
  rationale: Глагол выражает тяжёлую пагубу или уничтожение, однако сам стих не требует выбрать исключительно временное духовное разорение либо окончательную эсхатологическую гибель. Перевод сохраняет эту богословскую напряжённость.
- issue: Следует ли нейтрализовать мужской род ἀδελφός
  choice: В основном тексте сохранено «брат», а смысл «единоверец» пояснён в сноске.
  alternative: «единоверец», «брат или сестра»
  rationale: Форма источника — мужской род, единственное число. Её сохранение точно передаёт текст, тогда как сноска показывает более широкую применимость в контексте общины.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном высказывании слово действует как титул и подчёркивает искупительное значение смерти Иисуса; «Мессия» непосредственно передаёт титульный смысл.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и понятной синтаксической конструкцией. «Ибо» поддерживает объяснительную связь с предыдущим стихом; тире воспроизводит усиленное повторное обозначение слабого как брата. Формулировка избегает как разговорности, так и излишней церковнославянской окраски.
