base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: ru
  text: Но пища не приблизит нас к Богу[a], ведь едим ли мы — не получаем преимущества, не едим ли — не терпим недостатка[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пища не представит нас перед Богом»; возможно также: «пища не делает нас угоднее Богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ни если едим, не имеем избытка, ни если не едим, не испытываем недостатка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: пища
  rationale: Общее обозначение еды, а не только мяса или конкретной трапезы.
- source_word: παραστήσει τῷ θεῷ
  choice: не приближает нас к Богу
  rationale: Передаёт здесь отношение человека к Богу и не сводит глагол к физическому представлению перед Ним; настоящее время по-русски естественно выражает общее утверждение греческого будущего.
- source_word: οὔτε γὰρ ἐὰν φάγωμεν, περισσεύομεν
  choice: ведь, если мы едим, у нас нет преимущества
  rationale: В данном контексте περισσεύω означает не материальное изобилие, а наличие выгоды или преимущества.
- source_word: οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα
  choice: и если не едим, мы ничего не теряем
  rationale: Идиоматично передаёт отсутствие недостатка или ущерба и сохраняет смысловой контраст с преимуществом.
- source_word: δὲ / γὰρ
  choice: Но / ведь
  rationale: «Но» обозначает мягкое противопоставление, а «ведь» вводит пояснение основания.
theological_decisions:
- issue: Говорит ли Павел о приближении к Богу или о Божьем одобрении
  choice: «пища не приближает нас к Богу»
  alternative: «пища не делает нас угоднее Богу» / «пища не представит нас Богу»
  rationale: Выбранная формулировка сохраняет реляционный смысл παραστήσει, не утверждая, что речь исключительно о нравственном одобрении или ритуальной приемлемости.
- issue: Характер преимущества или ущерба от еды и воздержания
  choice: Не уточнять его как нравственное или спасительное преимущество
  alternative: «мы не становимся лучше / хуже»
  rationale: Греческие περισσεύομεν и ὑστερούμεθα допускают более общий смысл; перевод не разрешает богословскую напряжённость за текст.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Параллелизм двух условных частей сохранён естественными русскими средствами.
