  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: ru
  text: Но смотрите, как бы это ваше право[a] не стало камнем преткновения для слабых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эта ваша свобода». Греческое слово может означать «власть», «право» или «свободу»; здесь имеется в виду свобода, на которую некоторые верующие ссылались, когда ели пищу, связанную с идолами.'
    reason: lexical_alternative
  - marker: b
    text: «Слабые» здесь — те, чья совесть слаба в этом вопросе.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: смотрите
  rationale: Императив призывает к бдительности и осторожности; «смотрите, как бы» естественно передаёт предупредительную силу выражения.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкий контраст и переход от рассуждения к предостережению.
- source_word: μή πως
  choice: как бы … не
  rationale: Обычная современная русская конструкция предостережения о возможном нежелательном результате.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: это ваше право
  rationale: В контексте речь идёт о заявляемом праве или свободе есть пищу, связанную с идолами; «право» конкретнее, чем общее «свобода», а «власть» здесь звучало бы неестественно.
- source_word: πρόσκομμα
  choice: камнем преткновения
  rationale: Сохраняет метафору препятствия, из-за которого человек может духовно или нравственно оступиться, и естественно звучит в библейском русском регистре.
- source_word: γένηται
  choice: не стало
  rationale: Прямо и естественно передаёт значение становления в конструкции предостережения.
- source_word: τοῖς ἀσθενέσιν
  choice: для слабых
  rationale: Сохраняет краткость и неоднозначность исходного выражения; контекст главы уточняет, что речь идёт о людях со слабой в этом вопросе совестью.
theological_decisions:
- issue: Значение ἐξουσία в контексте
  choice: Право некоторых коринфских верующих есть пищу, связанную с идолами
  alternative: Более широкое значение власти, полномочия или свободы
  rationale: Непосредственный контекст 1 Кор 8 посвящён практической свободе в отношении идоложертвенной пищи. «Право» передаёт этическую суть спора, не привнося идеи институциональной власти.
- issue: Значение τοῖς ἀσθενέσιν
  choice: Верующие, чья совесть слаба в этом вопросе
  alternative: Слабые люди вообще, включая физически слабых
  rationale: Повторное употребление слова «слабый» в главе связано с уязвимой совестью. Основной текст сохраняет лаконичное «слабых», а примечание поясняет контекст, не устраняя исходную краткость.
translation_notes:
  register: Современный литературный русский язык с естественной предупредительной конструкцией «смотрите, как бы … не». Сохранена традиционная, но понятная метафора «камень преткновения»; формулировка остаётся краткой и достойной по тону.
