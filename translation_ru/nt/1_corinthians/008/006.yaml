  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: ru
  text: но для нас один Бог — Отец, от Которого всё, и мы — для Него[a], и один Господь — Иисус Мессия[b], через Которого всё, и мы — через Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и мы — к Нему». Предлог может обозначать направление, цель или предназначение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисус Христос». Греческое Χριστός может употребляться как титул «Мессия» или как ставшее именованием слово «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ ἡμῖν
  choice: но для нас
  rationale: 'ἀλλά обозначает противопоставление предыдущему контексту, а дательный ἡμῖν — отношение или точку зрения: «для нас».'
- source_word: εἷς θεὸς ὁ πατήρ
  choice: один Бог — Отец
  rationale: Сохраняется исповедальная формула, а тире естественно передаёт приложение ὁ πατήρ в современном русском языке.
- source_word: ἐξ οὗ τὰ πάντα
  choice: от Которого всё
  rationale: ἐξ с родительным указывает на источник или происхождение; «всё» сохраняет всеохватность τὰ πάντα и звучит естественно по-русски.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: и для Которого мы
  rationale: εἰς допускает значение направленности, цели или предназначения. Формулировка передаёт Бога как цель человеческого существования, не добавляя отсутствующего в греческом глагола.
- source_word: εἷς κύριος
  choice: один Господь
  rationale: Сохраняются параллелизм с «один Бог» и весомое исповедальное значение κύριος.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Мессия
  rationale: В данной исповедальной конструкции Χριστός естественно понимать как титул; вариант «Христос» отмечен в сноске как традиционная и также возможная передача.
- source_word: δι’ οὗ τὰ πάντα
  choice: через Которого всё
  rationale: διά с родительным выражает посредничество или действующее участие; «через Которого» сохраняет отличие от ἐξ οὗ — «от Которого».
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: и через Которого мы
  rationale: Сохранён эллиптический строй оригинала без уточнения, идёт ли речь прежде всего о сотворении, существовании, новой жизни или спасении.
theological_decisions:
- issue: Соотношение выражений «один Бог» и «один Господь»
  choice: 'Сохранена параллельная формула: «один Бог — Отец ... и один Господь — Иисус Мессия».'
  alternative: Ослабить значение слова «Господь» либо развернуть формулу в позднейшую догматическую терминологию.
  rationale: Текст одновременно сохраняет единобожие, различает Отца и Иисуса Мессию и придаёт обоим членам формулы исповедальный вес; перевод не должен ни сглаживать, ни догматически расширять эту напряжённость.
- issue: Различие предлогов ἐξ, εἰς и διά
  choice: Передано как «от», «для» и «через».
  alternative: Передать εἰς как «к», а διά как «посредством» или «благодаря».
  rationale: Выбранные соответствия ясно сохраняют отношения источника, цели и посредничества, при этом не превращая их в более подробное богословское объяснение.
- issue: Смысл эллиптического выражения «и мы через Него»
  choice: 'Глагол не добавлен: «и через Которого мы».'
  alternative: «И мы существуем через Него», «и мы живём через Него» или «и мы спасены через Него».
  rationale: Оригинал оставляет сказуемое подразумеваемым; сохранение эллипсиса не сужает возможный смысл.
translation_notes:
  register: Современный литературный русский язык с торжественным исповедальным ритмом. Параллелизм оригинала сохранён; тире помогают ясно прочитать приложения и эллиптические конструкции. Местоимения, относящиеся к Богу и Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской нормой.
