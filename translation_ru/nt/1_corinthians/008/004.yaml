  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: выводное οὖν («Итак»), предмет обсуждения — акт употребления в пищу идоложертвенного, общее «мы знаем», утверждение о ничтожности идола и исключительности единого Бога. Формула «идол — ничто в мире» удачно сохраняет лаконичность и смысловую ёмкость οὐδὲν εἴδωλον ἐν κόσμῳ, не навязывая одной интерпретации.'
