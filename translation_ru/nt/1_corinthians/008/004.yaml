id: 1CO.8.4
reference: 1 Corinthians 8:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: ru
  text: Итак, что касается употребления в пищу того, что принесено в жертву идолам, мы знаем, что идол — ничто в мире[a] и что нет Бога, кроме одного[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идола в мире не существует».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нет никакого бога, кроме одного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: употребления в пищу
  rationale: Передаёт действие, обозначенное существительным βρῶσις, а не превращает его просто в название пищи; конструкция с «что касается» естественно воспроизводит περὶ с родительным падежом.
- source_word: εἰδωλοθύτων
  choice: того, что принесено в жертву идолам
  rationale: Сохраняет широкий охват греческого субстантивированного определения и не сужает значение до одного лишь мяса.
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Прямо передаёт глагол с настоящим значением и сохраняет обращение Павла к общему знанию говорящего и адресатов.
- source_word: οὐδὲν εἴδωλον
  choice: идол — ничто
  rationale: Сохраняет краткость и силу греческой именной конструкции, не уточняя без необходимости, идёт ли речь о нереальности идола или о его ничтожности.
- source_word: ἐν κόσμῳ
  choice: в мире
  rationale: Естественный современный эквивалент κόσμος в данном контексте.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: нет Бога, кроме одного
  rationale: Передаёт исключительное монотеистическое утверждение и сохраняет выражение εἷς как «одного», не добавляя отсутствующих в тексте определений.
- source_word: οὖν
  choice: Итак
  rationale: Обозначает вывод и переход от предшествующего рассуждения, оставаясь естественным для современного русского текста.
theological_decisions:
- issue: Смысл утверждения об идоле
  choice: «идол — ничто в мире»
  alternative: «идола в мире не существует»
  rationale: 'Основной текст сохраняет смысловую напряжённость οὐδὲν: фраза может подчёркивать как отсутствие подлинной реальности у идола, так и его полное ничтожество.'
- issue: Написание θεός и монотеистическое утверждение
  choice: «нет Бога, кроме одного»
  alternative: «нет никакого бога, кроме одного»
  rationale: Прописная буква естественно указывает на единого истинного Бога в контексте, однако примечание сохраняет возможное нарицательное прочтение греческого θεός без привнесения дополнительной догматической формулы.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и dignified, без архаизмов. Оборот «употребление в пищу» несколько формален, но точно сохраняет значение действия, а выражение «идол — ничто» намеренно удерживает лаконичность и неоднозначность оригинала.
