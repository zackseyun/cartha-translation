source:
  edition: SBLGNT
  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: ru
  text: Если кто думает, что знает что-либо[a], тот ещё не знает так, как следует знать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если кто думает, что уже познал что-либо, тот ещё не познал так, как следует познать».'
    reason: Лексическая альтернатива, отражающая перфектную форму ἐγνωκέναι и повторение форм глагола γινώσκω.
lexical_decisions:
- source_word: εἴ τις
  choice: Если кто
  rationale: Сохраняет условную конструкцию и обобщённое значение неопределённого местоимения; в современном литературном русском это естественная формула.
- source_word: δοκεῖ
  choice: думает
  rationale: Передаёт субъективную оценку человеком собственного знания, а не простую видимость.
- source_word: ἐγνωκέναι
  choice: знает
  rationale: Перфектный инфинитив обозначает достигнутое состояние знания; русское настоящее время естественно передаёт притязание на обладание знанием.
- source_word: τι
  choice: что-либо
  rationale: Передаёт неопределённый объект знания и хорошо сочетается с условной конструкцией.
- source_word: οὔπω
  choice: ещё не
  rationale: Сохраняет временной оттенок незавершённости или недостаточности знания.
- source_word: ἔγνω
  choice: знает
  rationale: В данном обобщённом высказывании русское настоящее время естественнее буквального прошедшего и выражает актуальную оценку состояния человека.
- source_word: καθὼς δεῖ γνῶναι
  choice: так, как следует знать
  rationale: Сохраняет значение образа или нормы знания и нормативную силу δεῖ, не уточняя сверх текста, в чём именно состоит должное знание.
theological_decisions:
- issue: Характер критики знания
  choice: Недостаточность самоуверенного знания, а не отрицание всякого знания
  alternative: Полное отрицание возможности человеческого знания
  rationale: Фраза «ещё не знает так, как следует знать» критикует качество или способ знания и сохраняет напряжение исходного текста, не превращая высказывание в абсолютный скептицизм.
- issue: Обобщённое обозначение человека
  choice: «Если кто… тот»
  alternative: «Если кто-нибудь… он»
  rationale: Греческое τις имеет обобщённое значение и не ограничивает утверждение мужчинами; русская соотносительная конструкция естественна и позволяет избежать ненужного родового уточнения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, с сохранением риторического повтора «знает — знать». Частица «ещё» передаёт οὔπω, а конструкция «так, как следует» сохраняет смысл нормы и образа знания.
