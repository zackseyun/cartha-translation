  source_fidelity: 'Основной смысл передан верно: сохранены противопоставительный союз, формула цитирования, трёхчастный ряд отрицаний, образ «сердца», приготовление Богом и адресаты — любящие Его. Однако исходная русская соотносительная конструкция «Не видел того глаз ... и не приходило то ... что приготовил» синтаксически неудачна и размывает связь греческих ἅ ... ὅσα.'
  naturalness: Фраза «не приходило то на сердце человеку» звучит неестественно из-за порядка слов и сочетания «то ... что». Более естественная и литературная конструкция — «Чего не видел глаз ... и что не приходило человеку на сердце, — то приготовил Бог...». Она сохраняет приподнятый библейский ритм, не становясь архаичной.
  terminology: '«Сердце» следует сохранить: оно соответствует καρδία и не сводит выражение к интеллектуальному «уму». «Человеку» адекватно передаёт обобщающее ἀνθρώπου. «Любящим Его» точно, но «для тех, кто любит Его» несколько естественнее в современном связном предложении и передаёт настоящее причастие без конфессионального истолкования.'
