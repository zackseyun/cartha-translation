source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: ru
  text: 'Но, как написано:


    «Чего не видел глаз,

    и чего не слышало ухо,

    и что не приходило человеку на сердце[a][b], —

    то приготовил Бог для тех, кто любит Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не взошло на сердце человека»; по смыслу также возможно: «не возникло в человеческом сердце» или «никому не приходило в голову».'
    reason: lexical_alternative
  - marker: b
    text: Слово «человек» употреблено здесь в обобщающем смысле и относится ко всем людям.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предшествующей мысли кратким и естественным русским союзом.
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Сохраняет принятую формулу введения цитаты из Писания; русское настоящее «написано» естественно передаёт результативное значение греческого перфекта.
- source_word: Ἃ ... ὅσα
  choice: того ... то, что
  rationale: Передаёт соотносительную конструкцию и возобновление мысли во второй части, сохраняя поэтический параллелизм и ясный русский синтаксис.
- source_word: ὀφθαλμὸς
  choice: глаз
  rationale: Сохраняет единственное число с обобщающим значением и параллель с «ухо».
- source_word: οὖς
  choice: ухо
  rationale: Прямое соответствие греческому слову с сохранением единственного числа и поэтического параллелизма.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: не приходило то на сердце человеку
  rationale: Сохраняет образ сердца и направление движения, выраженное в греческом обороте, но использует понятное современному читателю русское выражение. Не сводит «сердце» исключительно к рассудку.
- source_word: ἡτοίμασεν
  choice: приготовил
  rationale: Естественный русский совершенный вид передаёт завершённое действие Бога без необходимости вводить отсутствующий в греческом тексте временной оттенок.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: любящим Его
  rationale: Причастная форма кратко и естественно передаёт продолжающуюся характеристику тех, кто любит Бога; местоимение однозначно относится к Богу.
theological_decisions:
- issue: Обобщающее значение ἀνθρώπου
  choice: человеку
  alternative: человеческому сердцу; кому-либо
  rationale: Единственное число и личное обозначение сохранены, а русское «человеку» естественно имеет здесь обобщающий смысл и относится ко всякому человеку.
- issue: Значение «сердца» в ἐπὶ καρδίαν
  choice: сохранить слово «сердце»
  alternative: ум; мысль
  rationale: Библейский образ охватывает внутреннюю жизнь человека шире, чем один рассудок; замена на «ум» неоправданно сузила бы смысл.
- issue: Связь Ἃ ... ὅσα
  choice: передать как возобновляемую конструкцию «того ... то, что»
  alternative: объединить в одно придаточное предложение
  rationale: Так сохраняются и риторическое накопление трёх отрицаний, и итоговое указание на приготовленное Богом, без догматического уточнения природы этих благ.
translation_notes:
  register: Современный литературный русский язык с приподнятым, но понятным библейским ритмом. Инверсия «не видел того глаз» и краткое «любящим Его» сохраняют поэтичность цитаты, не делая текст архаичным.
