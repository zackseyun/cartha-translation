  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: ru
  text: Об этом мы и говорим — не словами, которым учит человеческая мудрость, а словами, которым учит Дух, изъясняя духовное духовным людям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сопоставляя духовное с духовным»; возможно также: «выражая духовное духовными словами». Греческое выражение допускает разные понимания: речь может идти о духовных людях, духовных предметах или духовных словах.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: Об этом
  rationale: Указывает на только что упомянутые истины и естественно передаёт относительное местоимение с указательным оттенком в русском контексте.
- source_word: λαλοῦμεν
  choice: мы и говорим
  rationale: Сохраняет значение устной речи; частица «и» передаёт καί и связь с предыдущим утверждением.
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: не словами, которым учит человеческая мудрость
  rationale: Творительный падеж естественно передаёт инструментальное ἐν, а формулировка сохраняет человеческую мудрость как источник обучения.
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: а словами, которым учит Дух
  rationale: Слово «словами» восстановлено из λόγοις в первой части эллиптического противопоставления; «Дух» в контексте обозначает Божьего Духа.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: изъясняя духовное духовным людям
  rationale: Передаёт вероятное значение συγκρίνοντες как истолкования или разъяснения, а πνευματικοῖς понимает как форму мужского рода со значением адресатов. Синтаксис и значение выражения спорны, поэтому другие существенные варианты вынесены в примечание.
theological_decisions:
- issue: Кого обозначает πνεύματος
  choice: Святого Духа, переданного как «Дух»
  alternative: дух или духовный источник в общем смысле
  rationale: Во всём ближайшем контексте 1 Кор 2 Божий Дух противопоставлен человеческой мудрости и открывает Божье; прописная буква передаёт личный божественный референт без добавления отсутствующего здесь определения «Святой».
- issue: Смысл πνευματικοῖς и συγκρίνοντες
  choice: изъясняя духовное духовным людям
  alternative: сопоставляя духовное с духовным; выражая духовное духовными словами
  rationale: Форма πνευματικοῖς может быть понята как мужской дательный множественного числа («духовным людям») либо как средний род или подразумеваемое определение к «словам». Выбранное чтение возможно по синтаксису, но неоднозначность нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство апостольского рассуждения и остаётся понятной без специальной терминологии. Тире облегчает длинное противопоставление. Неоднозначность заключительной греческой конструкции явно отмечена в сноске.
