id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: ru
  text: И я, когда пришёл к вам, братья[a], пришёл не с превосходством речи или мудрости, возвещая вам свидетельство Божье[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «братья» здесь может относиться ко всем верующим, включая женщин в общине.
    reason: cultural_note
  - marker: b
    text: 'В некоторых рукописях: «тайну Божью».'
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: И я
  rationale: Сохраняет связующую силу καί и выраженное местоимением лёгкое смысловое выделение говорящего, не усиливая его до «я сам».
- source_word: ἐλθὼν … ἦλθον
  choice: когда пришёл … пришёл
  rationale: Передаёт причастный оборот естественным временным придаточным и сохраняет намеренный повтор глагола движения в греческом тексте.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет мужскую форму обращения исходного текста; возможность отнесения ко всем верующим в смешанной общине поясняется в сноске.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: с превосходством речи или мудрости
  rationale: Передаёт идею выдающегося, впечатляющего качества речи или мудрости и сохраняет несколько необычную формальность выражения Павла.
- source_word: καταγγέλλων
  choice: возвещая
  rationale: Сохраняет обстоятельное причастие и публичный, декларативный смысл глагола.
- source_word: μαρτύριον
  choice: свидетельство
  rationale: Следует основному чтению SBLGNT и передаёт весомое значение существительного, не подменяя его вариантом «тайна».
- source_word: τοῦ θεοῦ
  choice: Божье
  rationale: Естественно передаёт греческий родительный падеж, не уточняя, означает ли он свидетельство от Бога, о Боге или принадлежащее Богу.
theological_decisions:
- issue: Текстовый вариант в слове μαρτύριον
  choice: свидетельство Божье
  alternative: тайна Божья
  rationale: Основной текст SBLGNT содержит μαρτύριον («свидетельство»); значимый вариант μυστήριον («тайна») отмечен в сноске.
- issue: Смысл родительного τοῦ θεοῦ
  choice: Божье
  alternative: от Бога / о Боге
  rationale: Формулировка сохраняет неоднозначность греческого родительного и не решает без достаточных оснований, идёт ли речь об источнике, содержании или принадлежности свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Синтаксический повтор «пришёл… пришёл» сохранён как заметная черта оригинала; формулировка «превосходство речи» намеренно близка к греческой и не сводит смысл исключительно к красноречию.
