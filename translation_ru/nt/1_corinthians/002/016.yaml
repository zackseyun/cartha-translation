id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: ru
  text: Ибо кто познал разум Господа[b], чтобы наставить его? А мы имеем разум Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разум Христа».'
    reason: lexical_alternative
  - marker: b
    text: Павел перекликается с Ис 40:13.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ ἔγνω
  choice: Ибо кто познал
  rationale: Передаёт прямой риторический вопрос и сохраняет объяснительную связь γάρ с предшествующим рассуждением.
- source_word: νοῦν κυρίου
  choice: разум Господа
  rationale: «Разум» естественно передаёт νοῦς как образ мыслей и понимание, сохраняя узнаваемую связь с Ис 40:13.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: чтобы наставить его
  rationale: В данном контексте συμβιβάζω означает наставлять или указывать; конструкция с «чтобы» естественно выражает смысл греческого относительного оборота, характеризующего того, кто был бы способен наставить Господа.
- source_word: ἡμεῖς δὲ
  choice: А мы
  rationale: Выражает подчёркнутое противопоставление между невозможностью для человека наставлять Господа и утверждением Павла о верующих.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: мы имеем разум Мессии
  rationale: Сохраняет прямое значение ἔχομεν и повтор νοῦς; Χριστός передан как мессианский титул.
theological_decisions:
- issue: Значение утверждения «мы имеем разум Мессии»
  choice: Сохранена прямая и ёмкая формулировка без уточнения, относится ли «мы» прежде всего к апостолам или ко всей общине верующих.
  alternative: Разъяснить «мы» как апостолов либо как всех верующих.
  rationale: Сам стих не устраняет эту контекстуальную неоднозначность, поэтому перевод не должен решать её за читателя.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Здесь Χριστός может быть услышан как титул Помазанника; основной текст сохраняет этот титульный смысл, а традиционный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным построением фразы. Местоимение «его» оставлено со строчной буквы в соответствии с современной издательской практикой и отсутствием такого различия в греческом тексте.
