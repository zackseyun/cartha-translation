reference: 1 Corinthians 2:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: ru
  text: Но мы приняли не дух мира, а Духа, Который от Бога, чтобы знать[a] то, что даровано нам Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы понимать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: дух / Дух
  rationale: Первое употребление обозначает дух или господствующее влияние мира и передано со строчной буквы; второе в контексте указывает на Святого Духа и передано с прописной.
- source_word: κόσμου
  choice: мира
  rationale: Обычное и естественное соответствие, обозначающее человеческий миропорядок в его противопоставлении Богу.
- source_word: ἐλάβομεν
  choice: приняли
  rationale: Русский совершенный вид естественно передаёт состоявшееся получение, значимое для настоящего рассуждения Павла.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: Который от Бога
  rationale: Относительная конструкция ясно связывает оборот с Духом и сохраняет выраженное предлогом ἐκ отношение происхождения.
- source_word: ἵνα εἰδῶμεν
  choice: чтобы знать
  rationale: Сохраняет целевую конструкцию и основной познавательный смысл οἶδα; возможный контекстуальный оттенок понимания отмечен в сноске.
- source_word: χαρισθέντα
  choice: даровано
  rationale: Глагол «даровать» передаёт безвозмездность и благодатный характер действия χαρίζομαι лучше, чем нейтральное «дано».
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: то, что даровано нам
  rationale: Широкая конструкция не ограничивает смысл особыми духовными дарами и естественно передаёт субстантивированное среднее множественное число.
theological_decisions:
- issue: Относится ли πνεῦμα τὸ ἐκ τοῦ θεοῦ именно к Святому Духу
  choice: «Духа, Который от Бога» с прописной буквы
  alternative: «дух, который от Бога»
  rationale: Ближайший контекст противопоставляет дух мира Божьему Духу, принятому верующими; прописная буква отражает наиболее естественное понимание, не добавляя в основной текст слова «Святой».
translation_notes:
  register: Современный литературный русский язык; синтаксис близок к греческому, но звучит естественно. «Даровано» сохраняет возвышенный, однако общепонятный регистр и оттенок благодатного дара.
