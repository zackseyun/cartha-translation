source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: ru
  text: Ведь Бог открыл нам это[a] через Духа, потому что Дух исследует всё, даже глубины Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте прямое дополнение не выражено; оно подразумевается из предшествующего контекста.
    reason: alternative_reading
  - marker: b
    text: 'Или: «то, что глубоко в Боге».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж обозначает получателей откровения; русское «нам» прямо и естественно передаёт эту функцию.
- source_word: ἀπεκάλυψεν
  choice: открыл
  rationale: 'Аорист передан совершенным видом в прошедшем времени: речь идёт о состоявшемся Божьем откровении, значимом для настоящего.'
- source_word: '[подразумеваемое дополнение при ἀπεκάλυψεν]'
  choice: это
  rationale: В греческом прямое дополнение не выражено, но восстанавливается из предшествующего контекста. «Это» ясно связывает стих с предыдущей мыслью, не уточняя её сверх текста.
- source_word: διὰ τοῦ πνεύματος
  choice: через Духа
  rationale: διά с родительным падежом указывает на посредство или средство; «через Духа» сохраняет этот оттенок.
- source_word: πνεῦμα
  choice: Дух
  rationale: Контекст говорит о Божьем откровении и знании Божьих глубин, поэтому оба употребления относятся к Святому Духу; прописная буква делает эту референцию ясной.
- source_word: ἐραυνᾷ
  choice: исследует
  rationale: Глагол обозначает тщательное разыскивание или исследование. «Исследует» сохраняет активный, проникающий характер образа, не заменяя его толкованием.
- source_word: πάντα
  choice: всё
  rationale: Краткий и естественный русский эквивалент с тем же всеобъемлющим значением.
- source_word: καὶ
  choice: даже
  rationale: 'Здесь союз имеет усилительное значение и вводит кульминацию: Дух исследует даже Божьи глубины.'
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: глубины Бога
  rationale: Перевод сохраняет метафору глубины и родительную конструкцию оригинала, не сводя выражение только к тайнам, замыслам или качествам Бога.
theological_decisions:
- issue: Относится ли πνεῦμα к Святому Духу или к человеческому духу
  choice: Святой Дух в обоих случаях
  alternative: человеческий дух в обобщённом смысле
  rationale: Непосредственный контекст приписывает Духу посредство в Божьем откровении и знание глубин Бога, что убедительно указывает на Святого Духа.
- issue: Следует ли понимать «исследует» как приобретение ранее отсутствовавшего знания
  choice: сохранить образ действия без такого вывода
  alternative: перевести толковательно как «знает» или «постигает»
  rationale: Греческий текст использует ἐραυνᾷ («исследует»), но сам по себе не утверждает, что Дух прежде чего-либо не знал. Сохранение метафоры не разрешает эту богословскую напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. Порядок слов «Нам же Бог» сохраняет контрастивное выделение ἡμῖν, а повтор слова «Дух» отражает структуру оригинала. Метафора глубины сохранена без конфессионального истолкования.
