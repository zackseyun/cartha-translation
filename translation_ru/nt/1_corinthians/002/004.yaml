    issue: 'Неестественное и непараллельное управление: «были не с убедительной мудростью, а в явлении».'
    rationale: Греческое ἐν относится к обоим членам противопоставления; в русском следует сохранить одинаковую конструкцию «не в ..., а в ...».
  - severity: medium
    issue: Выражение «с убедительной мудростью» не передаёт смысл πειθοῖ σοφίας достаточно ясно для современного литературного русского.
    rationale: Оно может быть понято как мудрость, которая сама по себе убедительна, тогда как контекст говорит о риторически убедительном способе речи. Подразумеваемые «слова» уместно восстановить, отметив более сжатый вариант в сноске.
  - severity: low
    issue: «Явление Духа» двусмысленно в современном русском.
    rationale: «Явление» обычно обозначает появление; «проявление» точнее передаёт ἀπόδειξις как обнаружение или демонстрацию.
