  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: ru
  text: И речь моя, и проповедь моя — не в убедительных словах мудрости[a], а в проявлении Духа[b] и силы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не с убедительной мудростью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «духа».'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: речь
  rationale: В данном контексте слово обозначает речь Павла и её характер; «речь» сохраняет отличие от κήρυγμα и соответствует риторическому противопоставлению.
- source_word: κήρυγμα
  choice: проповедь
  rationale: «Проповедь» естественно передаёт публичное возвещение и не сливается по смыслу со словом «речь».
- source_word: πειθοῖ σοφίας
  choice: с убедительной мудростью
  rationale: Греческий текст не содержит явно выраженного существительного «слова». Этот перевод сохраняет сжатость и некоторую необычность выражения, не дополняя его без необходимости.
- source_word: ἀποδείξει
  choice: в явлении
  rationale: Здесь имеется в виду наглядное обнаружение или подтверждение, противопоставленное риторическому убеждению. «В явлении» позволяет естественно связать это существительное и с Духом, и с силой.
- source_word: πνεύματος
  choice: Духа
  rationale: Ближайший и более широкий контекст главы указывает на Божьего Духа, однако грамматически возможное понимание «духа» сохранено в сноске.
- source_word: δυνάμεως
  choice: силы
  rationale: «Сила» — прямое и ясное соответствие, естественное для Павлова словоупотребления и данного сочетания.
theological_decisions:
- issue: Относится ли πνεύματος к Святому Духу или к духу в более общем смысле
  choice: Духа
  alternative: духа
  rationale: Контекст 1 Коринфянам 2 противопоставляет человеческую мудрость тому, что исходит от Бога, и далее прямо говорит о Божьем Духе. При этом строчная форма остаётся грамматически возможной и поэтому указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской аргументации. Сохранён параллелизм «и речь моя, и проповедь моя», а также противопоставление человеческой убедительности явлению Духа и силы.
