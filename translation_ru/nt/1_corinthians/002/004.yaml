  to: И речь моя, и проповедь моя — не в убедительных словах мудрости[a], а в проявлении Духа[b] и силы.
  rationale: Перевод исправляет русскую сочетаемость и делает риторический контраст ясным. В основном тексте восстановлено подразумеваемое из контекста «словах», а более буквальная сжатая передача πειθοῖ σοφίας сохранена в сноске. «Проявление» точнее и современнее, чем «явление», без добавления доктринального смысла.
