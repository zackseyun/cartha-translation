  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: ru
  text: И всё же среди зрелых[a] мы возвещаем мудрость — но не мудрость этого века и не мудрость правителей этого века[c], которые лишаются силы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенных»; здесь, вероятно, имеются в виду духовно зрелые.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые упраздняются», «сходят на нет» или «исчезают».'
    reason: lexical_alternative
  - marker: c
    text: «Правители этого века» могут означать земные власти, духовные силы или и тех и других.
    reason: alternative_reading
lexical_decisions:
- source_word: Σοφίαν
  choice: мудрость
  rationale: Прямое и естественное соответствие; повтор сохранён, чтобы передать риторическое ударение греческого текста.
- source_word: δὲ
  choice: И всё же
  rationale: Передаёт противопоставление предшествующему контексту и естественно звучит по-русски.
- source_word: λαλοῦμεν
  choice: мы говорим
  rationale: λαλέω прежде всего означает «говорить»; формулировка не усиливается до «возвещаем».
- source_word: ἐν τοῖς τελείοις
  choice: среди зрелых
  rationale: Предлог ἐν здесь естественно передаётся как «среди», а τέλειοις в контексте вероятнее обозначает достигших зрелости.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: не мудрость этого века
  rationale: «Век» сохраняет временно-мировоззренческий смысл αἰών и не смешивает его с κόσμος, «мир».
- source_word: ἀρχόντων
  choice: правителей
  rationale: Широкое соответствие, не уточняющее, имеются ли в виду земные власти, духовные силы или те и другие.
- source_word: τῶν καταργουμένων
  choice: которые сходят на нет
  rationale: Передаёт продолжающийся процесс утраты силы и значения, выраженный причастием настоящего времени, не сужая значение до физического исчезновения.
theological_decisions:
- issue: Кого обозначают «правители этого века»
  choice: Оставить широкое обозначение «правители», не уточняя референт.
  alternative: Земные политические и религиозные властители; духовные силы; либо и те и другие.
  rationale: Греческая фраза допускает эти толкования, поэтому перевод сохраняет богословскую неоднозначность.
- issue: Значение τέλειοις
  choice: Передать как «зрелых».
  alternative: «Совершенных».
  rationale: В данном контексте вероятнее имеется в виду духовная зрелость, однако буквальная альтернатива сохранена в примечании и возможность иного оттенка не скрыта.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Повтор слова «мудрость» сохранён. Формула «сходят на нет» понятна обычному читателю и передаёт постепенное лишение силы; более формальные варианты даны в примечании.
