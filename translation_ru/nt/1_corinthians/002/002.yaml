  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: ru
  text: Ибо я решил не знать среди вас ничего, кроме Иисуса Мессию[a], и притом распятого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое слово Христос означает «Мессия», то есть «Помазанник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: решил
  rationale: В данном контексте глагол выражает твёрдое осознанное решение, а не судебное суждение; «решил» естественно звучит по-русски.
- source_word: τι εἰδέναι
  choice: не знать … ничего
  rationale: 'В сочетании с οὐ и εἰ μὴ оборот имеет ограничительный смысл: Павел решил не знать ничего, кроме названного далее.'
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Передаёт пребывание и служение Павла в общине коринфян, не сужая выражение до одного лишь времени его визита.
- source_word: εἰ μὴ
  choice: кроме
  rationale: Это обычная исключительная конструкция; «кроме» ясно и естественно передаёт её смысл.
- source_word: Ἰησοῦν Χριστόν
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет силу титула; русская форма с согласованным склонением естественно обозначает Иисуса как Мессию.
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: и притом распятого
  rationale: «И притом» передаёт подчёркивающую силу τοῦτον, а «распятого» сохраняет сжатую форму и акцент на Иисусе в Его состоянии как распятого.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В этом месте слово можно слышать как мессианский титул либо как ставшее привычным именование. Основной текст раскрывает титульный смысл, а традиционная передача сохранена в сноске.
- issue: Смысл выражения «не знать ничего»
  choice: Сохранить абсолютную по форме ограничительную формулировку
  alternative: Передать расширенно как «не говорить ни о чём» или «не возвещать ничего»
  rationale: Исходный текст говорит именно о знании и создаёт намеренно резкий риторический контраст; добавление «говорить» или «возвещать» устранило бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «ибо» сохраняет связь с предыдущим рассуждением; конструкция остаётся краткой и риторически весомой.
