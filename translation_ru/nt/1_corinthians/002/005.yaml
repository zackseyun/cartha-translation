  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: ru
  text: чтобы ваша вера была основана не на человеческой мудрости, а на силе Божьей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит целевое придаточное и сохраняет целевое значение греческого союза.
- source_word: ἡ πίστις ὑμῶν
  choice: ваша вера
  rationale: Передаёт обращение к коринфянам и обозначает их веру как доверие Богу.
- source_word: μὴ ᾖ ἐν
  choice: утверждалась не на
  rationale: По-русски естественно выражает основание, на котором покоится вера; форма с «чтобы» сохраняет значение греческого сослагательного наклонения.
- source_word: σοφίᾳ ἀνθρώπων
  choice: человеческой мудрости
  rationale: ἀνθρώπων здесь относится к людям вообще; прилагательное «человеческой» точно и естественно передаёт этот общий смысл без ненужной гендерной двусмысленности.
- source_word: δυνάμει θεοῦ
  choice: силе Божьей
  rationale: Сохраняет контраст между человеческой мудростью и Божьей силой, а также параллельную конструкцию основания веры.
theological_decisions:
- issue: Смысл конструкции ἐν при слове «вера»
  choice: 'Передать как основание: «утверждалась ... на»'
  alternative: «была в человеческой мудрости ... в силе Божьей»
  rationale: В контексте речь идёт не о местонахождении веры, а о том, на чём она основывается. При этом перевод не уточняет способ действия Божьей силы сверх сказанного в тексте.
- issue: Обобщающее значение ἀνθρώπων
  choice: «человеческой мудрости»
  alternative: «мудрости людей»
  rationale: Обе передачи возможны, но «человеческая мудрость» естественнее в современном русском и ясно обозначает противопоставление человеческого Божьему.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка с сохранением антитезы и целевой связи с предыдущим стихом.
