base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: ru
  text: Но мы возвещаем Божью мудрость как тайну[a] — ту сокрытую мудрость, которую Бог предопределил[b] прежде веков[c] для нашей славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тайне». У Павла «тайна» часто означает Божий замысел, прежде сокрытый, а теперь открытый.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заранее предназначил» или «заранее решил».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «прежде всех веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: возвещаем
  rationale: В русском языке буквальное «говорим Божью мудрость» неестественно, а конструкция «говорим о» ослабляет прямое дополнение. «Возвещаем» естественно передаёт публичное сообщение мудрости, не добавляя к тексту указания на конкретную форму проповеди.
- source_word: θεοῦ σοφίαν
  choice: Божью мудрость
  rationale: Притяжательная конструкция естественна для современного русского языка и сохраняет смысл мудрости, принадлежащей Богу и исходящей от Него.
- source_word: ἐν μυστηρίῳ
  choice: в тайне
  rationale: 'Сохраняет ключевое для Павла понятие μυστήριον и намеренную смысловую напряжённость: речь идёт не просто о чём-то непонятном, а о прежде сокрытом Божьем замысле.'
- source_word: τὴν ἀποκεκρυμμένην
  choice: ту сокрытую мудрость
  rationale: Причастие женского рода относится к «мудрости»; повтор существительного делает эту связь ясной по-русски. Указательное «ту» передаёт определённость греческой конструкции.
- source_word: προώρισεν
  choice: предопределил
  rationale: Прямой и устойчивый эквивалент προορίζω, сохраняющий силу предварительного Божьего решения без сведения фразы к какой-либо поздней доктринальной системе.
- source_word: πρὸ τῶν αἰώνων
  choice: прежде веков
  rationale: Близко передаёт множественное αἰώνων и сохраняет временно-космический масштаб выражения, не заменяя его толкованием «до сотворения мира».
- source_word: εἰς δόξαν ἡμῶν
  choice: для нашей славы
  rationale: Прямо передаёт целевое εἰς и весомое понятие δόξα, не конкретизируя его как «прославление» или «честь».
theological_decisions:
- issue: Доктринально значимое значение προώρισεν
  choice: предопределил
  alternative: заранее предназначил; заранее решил
  rationale: «Предопределил» сохраняет утверждение текста о Божьем предварительном определении, но сам перевод не уточняет его механизм и не связывает стих с определённой конфессиональной системой.
- issue: Связь ἐν μυστηρίῳ с мудростью и её возвещением
  choice: возвещаем Божью мудрость в тайне
  alternative: возвещаем Божью мудрость как тайну; возвещаем Божью мудрость, заключённую в тайне
  rationale: 'Сохранена компактность и неоднозначность греческого оборота: он может характеризовать способ или содержание возвещения и одновременно согласуется с последующим определением мудрости как сокрытой.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Божью» предпочтено более архаичному «Божию», а «сокрытую» сохранено как понятное и уместное слово высокого, но не устаревшего регистра. Тире ясно оформляет греческое приложение.
