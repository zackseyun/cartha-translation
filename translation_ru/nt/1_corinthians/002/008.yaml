  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: ru
  text: которую не познал никто из правителей этого века[a]; ведь если бы они познали её, то не распяли бы Господа славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Правители этого века» могут означать человеческие власти, духовные силы или и тех и других.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: которой
  rationale: Относительное местоимение женского рода отсылает к ранее упомянутой Божьей мудрости; форма «которой» естественно согласуется с управлением глагола «познать» в отрицательной конструкции.
- source_word: ἀρχόντων
  choice: правителей
  rationale: Передаёт значение лиц или сил, обладающих властью, не сужая возможную отсылку только до человеческих руководителей.
- source_word: αἰῶνος τούτου
  choice: этого века
  rationale: Сохраняет временное и миропорядковое значение αἰών и устойчивое для языка Павла выражение, не подменяя его словом «мир».
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: познал / познали
  rationale: Прямо передаёт γινώσκω и допускает как знание, так и распознание истинной значимости Божьей мудрости. В условном обороте русская конструкция с «если бы… то…» ясно выражает нереальное условие.
- source_word: κύριον τῆς δόξης
  choice: Господа славы
  rationale: Сохраняет генитивную конструкцию оригинала, её возвышенное звучание и богословскую ёмкость, не сводя её к определению «славного Господа».
- source_word: ἐσταύρωσαν
  choice: распяли
  rationale: Точный, исторически конкретный и общепринятый русский эквивалент σταυρόω.
theological_decisions:
- issue: Кого обозначают «правители этого века»
  choice: В основном тексте оставлено нейтральное «правители этого века».
  alternative: Человеческие политические и религиозные власти; духовные силы; либо одновременно те и другие.
  rationale: Греческое выражение допускает несколько уровней отсылки. Перевод и примечание сохраняют эту неоднозначность, не разрешая её в пользу одной богословской трактовки.
- issue: Значение γινώσκω в контексте Божьей мудрости
  choice: «познал / познали»
  alternative: «понял / поняли» или «распознал / распознали»
  rationale: «Познать» ближе к форме оригинала и сохраняет смысловой диапазон между знанием, пониманием и распознанием, не делая один оттенок исключительным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Господь славы» сохранено как ясное и значимое выражение; синтаксис условного периода сделан естественным для современного русского языка.
