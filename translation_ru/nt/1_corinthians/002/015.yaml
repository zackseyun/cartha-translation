source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: ru
  text: Но духовный человек[a] исследует всё[b], а его самого никто не исследует.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Духовный человек» — в греческом тексте субстантивированное прилагательное в мужском роде и единственном числе; оно в общем смысле обозначает человека, характеризуемого Духом.
    reason: cultural_note
  - marker: b
    text: 'Или: «оценивает», «распознаёт» или «судит»; тот же греческий глагол употреблён в обеих частях стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: духовный человек
  rationale: Субстантивированное прилагательное обозначает человека, характеризуемого Духом. Такое выражение естественно по-русски и не сводит смысл к отдельному лицу мужского пола.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: исследует / не исследует
  rationale: «Исследовать» передаёт тщательное рассмотрение и оценку, не добавляя оттенка окончательного осуждения; повтор одного русского глагола сохраняет лексическую связь между двумя формами греческого ἀνακρίνω.
- source_word: τὰ πάντα
  choice: всё
  rationale: Кратко и естественно сохраняет всеохватную, ничем прямо не ограниченную формулировку греческого текста.
- source_word: αὐτὸς
  choice: его самого
  rationale: Возвратно-усилительная конструкция сохраняет эмфатический характер греческого местоимения в противопоставлении первой части стиха.
- source_word: ὑπ’ οὐδενὸς
  choice: никто не
  rationale: Активная русская конструкция естественно передаёт греческую пассивную конструкцию с абсолютным отрицанием и не меняет состава участников.
theological_decisions:
- issue: Объём утверждения о духовном человеке
  choice: Сохранить без прямого ограничения выражения «всё» и «никто».
  alternative: В основном тексте ограничить смысл только духовными вопросами или определённой группой людей.
  rationale: Греческий текст формулирует утверждение без оговорок; его рамки задаёт ближайший контекст. Явное ограничение в переводе преждевременно сняло бы напряжение исходного текста.
- issue: Значение ἀνακρίνω в обеих частях стиха
  choice: Передать обе формы одним глаголом «исследовать».
  alternative: Использовать «судить», «оценивать» или разные глаголы в двух частях.
  rationale: Единый глагол сохраняет намеренный повтор оригинала. «Исследовать» оставляет открытыми связанные оттенки рассмотрения, распознавания и оценки, не превращая фразу однозначно в речь о судебном осуждении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок частей и противопоставление сохранены; активная конструкция «никто не исследует» предпочтена более тяжёлой пассивной форме. Всеохватность высказывания намеренно не смягчена.
