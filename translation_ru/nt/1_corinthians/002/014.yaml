id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: ru
  text: Но недуховный человек[a] не принимает того, что принадлежит Духу Божьему, ведь для него это безумие; он и не способен этого познать, потому что это можно распознать лишь духовно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душевный человек»; возможно также: «человек, живущий лишь природной жизнью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «это исследуется» или «оценивается» духовно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: недуховный
  rationale: В контексте слово противопоставлено πνευματικός. «Недуховный» ясно передаёт этот контраст современному читателю, тогда как буквальное «душевный» в современном русском часто означает «сердечный, эмоциональный» и может ввести в заблуждение; буквальный вариант сохранён в сноске.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Грамматически форма мужского рода, но обозначает человека как представителя общего типа, а не именно мужчину.
- source_word: δέχεται
  choice: принимает
  rationale: Передаёт не только получение сведений, но и их признание, что соответствует ходу рассуждения.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: то, что принадлежит Духу Божьему
  rationale: Сохраняет широкое значение греческой конструкции, не сводя её исключительно к словам, дарам или откровениям Духа.
- source_word: μωρία
  choice: безумие
  rationale: Естественный и устойчивый русский эквивалент, сохраняющий сквозной контраст между Божьей мудростью и человеческой оценкой в 1 Коринфянам.
- source_word: γνῶναι
  choice: познать
  rationale: Передаёт способность узнать и постичь эти духовные реалии, не ограничивая смысл простым интеллектуальным пониманием.
- source_word: πνευματικῶς
  choice: духовно
  rationale: Прямо сохраняет наречную форму и допускает как указание на духовный способ суждения, так и связь с действием Духа.
- source_word: ἀνακρίνεται
  choice: судить об этом можно
  rationale: Передаёт смысл исследования, различения и оценки; безличная конструкция естественна по-русски и сохраняет пассивную направленность греческой формы.
theological_decisions:
- issue: Передача ψυχικὸς ἄνθρωπος в противопоставлении духовному суждению
  choice: недуховный человек
  alternative: душевный человек; человек, живущий лишь природной жизнью; человек без Духа
  rationale: «Недуховный» сохраняет контекстуальное противопоставление и остаётся достаточно широким. «Человек без Духа» делает подразумеваемое богословское объяснение явным, а «душевный» в современном русском легко понимается неверно; последний вариант приведён в сноске как более буквальный.
- issue: Значение πνευματικῶς ἀνακρίνεται
  choice: судить об этом можно лишь духовно
  alternative: это распознаётся Духом; это исследуется духовно; это постигается духовно
  rationale: Выбранная формулировка сохраняет неоднозначность между различением, исследованием и оценкой и не заменяет наречие «духовно» более определённым «посредством Духа».
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис сделан плавным и понятным, при этом сохранены противопоставление ψυχικός/πνευματικῶς и смысловая широта ἀνακρίνεται.
