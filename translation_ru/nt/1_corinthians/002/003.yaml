lexical_decisions:
- source_word: κἀγώ
  choice: И я
  rationale: Передаёт соединительное значение καί и явно сохраняет самоотнесение Павла без добавочного усиления.
- source_word: ἐν ἀσθενείᾳ
  choice: в немощи
  rationale: Сохраняет широкое значение физической или личной слабости и соответствует достоинству библейского контекста; значение не сужается до болезни.
- source_word: ἐν φόβῳ
  choice: в страхе
  rationale: Прямо передаёт φόβος, не смягчая его до одной лишь осторожности или благоговения.
- source_word: ἐν τρόμῳ πολλῷ
  choice: в великом трепете
  rationale: Точно передаёт τρόμος и усиление посредством πολλῷ; выражение естественно и торжественно звучит по-русски.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: был у вас
  rationale: Естественно передаёт пребывание Павла среди коринфян и его состояние в их присутствии; возможное значение прихода сохранено в сноске.
theological_decisions:
- issue: Характер страха Павла
  choice: Сохранено прямое слово «страх» без уточнения его причины или объекта.
  alternative: «Благоговейный страх», «робость» или «опасение».
  rationale: Греческий текст не называет объект страха и не разрешает однозначно определить его как благоговение, робость перед людьми или тревогу из-за обстоятельств.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Параллелизм трёх предложных оборотов сохранён; «немощь» выбрана как понятное, ёмкое и контекстуально уместное слово.
