revisions:
- from: Ведь кто из людей знает, что у человека внутри, кроме духа самого человека, который в нём? Так и того, что у Бога, никто не познал, кроме Духа Божьего.[a]
  to: Ведь кто из людей знает то, что принадлежит человеку, кроме духа человека, пребывающего в самом человеке? Так и то, что принадлежит Богу, никто не познал, кроме Духа Божьего.[a]
  rationale: Устранена синтаксическая неясность в описании человеческого духа и восстановлен ясный смысловой параллелизм между τὰ τοῦ ἀνθρώπου и τὰ τοῦ θεοῦ. Изменения не сужают широкое значение исходных выражений и сохраняют перфектную форму второй части вместе с её примечанием.
  reviewer_model: gpt-5.6-terra
