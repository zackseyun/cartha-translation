source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: ru
  text: Ведь кто из людей знает то, что принадлежит человеку, кроме духа человека, пребывающего в самом человеке? Так и то, что принадлежит Богу, никто не познал, кроме Духа Божьего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто не знает». Греческая форма здесь буквально означает «никто не познал» и может подчёркивать сохраняющийся результат познания.'
    reason: лексико-грамматическая альтернатива
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: из людей / у человека
  rationale: Передаёт родовое, а не исключительно мужское значение и естественно звучит по-русски.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: что у человека внутри
  rationale: Передаёт широкое значение внутренних дел, мыслей и побуждений человека, не сводя выражение только к мыслям.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: духа самого человека, который в нём
  rationale: Сохраняет прямое значение πνεῦμα и относительную конструкцию греческого текста, а «самого» ясно выражает принадлежность духа этому человеку.
- source_word: οὕτως καὶ
  choice: Так и
  rationale: Кратко и естественно обозначает тесную аналогию между двумя частями стиха.
- source_word: ἔγνωκεν
  choice: не познал
  rationale: Передаёт перфектную форму и её результирующий оттенок, не устраняя различие с настоящим временем οἶδεν в первой части.
- source_word: τὰ τοῦ θεοῦ
  choice: того, что у Бога
  rationale: Сохраняет намеренно широкое значение выражения и параллель с человеческой внутренней сферой.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: Духа Божьего
  rationale: В контексте речь идёт о Божьем Духе, Который исследует и открывает Божье; прописная буква указывает на личный референт, не добавляя нового содержания.
theological_decisions:
- issue: Следует ли понимать πνεῦμα τοῦ θεοῦ как личное именование Божьего Духа или как безличный «дух Бога».
  choice: Духа Божьего
  alternative: духа Божьего
  rationale: Непосредственный контекст 1 Кор 2 говорит о Духе, Который исследует и открывает глубины Божьи; прописная буква соответствует этому референту, не развивая сверх текста отдельной доктринальной формулировки.
- issue: Нужно ли сузить τὰ τοῦ ἀνθρώπου и τὰ τοῦ θεοῦ до «мыслей».
  choice: 'Сохранить широкое значение: «что у человека внутри» и «того, что у Бога».'
  alternative: мысли человека / мысли Бога
  rationale: Субстантивированная конструкция τὰ τοῦ обозначает более широкую совокупность относящегося к человеку или Богу; сведение только к мыслям неоправданно снимает смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка избегает архаичного «что в человеке» как потенциально неясного, но сохраняет широкую семантику и параллелизм исходного текста. Местоимение «в нём» соответствует единственному числу греческого αὐτῷ.
