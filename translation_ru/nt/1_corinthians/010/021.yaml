  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: ru
  text: Вы не можете пить чашу Господа и чашу бесов; вы не можете участвовать в трапезе Господа и в трапезе бесов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «быть причастными к столу Господа и к столу бесов».'
    reason: 'Лексико-синтаксическая альтернатива для μετέχειν τραπέζης: «трапеза» идиоматически передаёт участие за столом, тогда как греческий текст буквально говорит о «столе».'
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: вы не можете
  rationale: Передаёт повторённое категорическое утверждение о несовместимости двух видов участия, сохраняя прямоту и параллелизм греческого текста.
- source_word: ποτήριον
  choice: чаша
  rationale: Прямой и естественный русский эквивалент, сохраняющий общинные и культовые ассоциации контекста без поясняющего расширения.
- source_word: κυρίου
  choice: Господа
  rationale: Родительный падеж точно воспроизводит отношение принадлежности и поддерживает параллель с выражением «бесов».
- source_word: πίνειν
  choice: пить
  rationale: Простой инфинитив естественно передаёт греческую конструкцию с δύνασθε.
- source_word: δαιμονίων
  choice: бесов
  rationale: «Бесы» — ясный и традиционно понятный эквивалент δαιμόνια, сохраняющий указание на личные злые духовные силы.
- source_word: τραπέζης
  choice: к столу
  rationale: Сохраняет конкретный образ стола и не заменяет его более истолковывающими словами «трапеза» или «жертвенник».
- source_word: μετέχειν
  choice: быть причастны к
  rationale: Передаёт участие и реальную сопричастность; формулировка уместна в торжественном контексте и грамматически сочетается со «столом».
- source_word: καὶ
  choice: и
  rationale: Сохраняет повторяющуюся связку и строгий параллелизм обеих частей стиха.
theological_decisions:
- issue: Характер несовместимости стола Господа и бесовского культа
  choice: Категорическая несовместимость участия в обоих
  alternative: Лишь усиленное риторическое предостережение
  rationale: Дважды повторённое οὐ δύνασθε выражает не мягкую рекомендацию, а решительное отрицание совместимости. Перевод не уточняет сверх текста, является ли невозможность нравственной, культовой или иной.
- issue: Возможный сакраментальный оттенок слова μετέχειν
  choice: «быть причастны» с сохранением общего значения участия
  alternative: «участвовать в трапезе»
  rationale: Выбор сохраняет сильное значение сопричастности, но не вводит в основной текст специального конфессионального толкования; более описательная передача дана в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Повтор «вы не можете» и симметрия «чаша… чаша; стол… стол» сохранены ради риторической силы оригинала.
