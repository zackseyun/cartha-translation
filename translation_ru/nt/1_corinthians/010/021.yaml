  naturalness: «Вы не можете» и «чаша Господа» уместны в современном литературном русском с возвышенным библейским регистром. «Участвовать в трапезе» существенно естественнее, чем «быть причастны к столу».
  terminology: «Господь», «чаша» и «бесы» переданы последовательно и точно. «Бесы» — допустимый традиционный русский эквивалент δαιμόνια; перевод не нуждается в замене на менее естественное «демоны».
