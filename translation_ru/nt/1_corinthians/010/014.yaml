  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: ru
  text: Поэтому, возлюбленные мои, бегите от идолопоклонства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонения идолам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и сохраняет логическую связь с контекстом.
- source_word: ἀγαπητοί μου
  choice: возлюбленные мои
  rationale: Сохраняет тёплое обращение Павла и привычный для библейского русского языка возвышенный, но понятный регистр.
- source_word: φεύγετε
  choice: бегите
  rationale: Настоящее повелительное наклонение выражает настойчивое требование удаляться от опасности; «бегите» передаёт силу глагола лучше, чем более слабое «сторонитесь».
- source_word: ἀπὸ
  choice: от
  rationale: Естественно обозначает удаление от того, чего следует избегать, после глагола «бегите».
- source_word: τῆς εἰδωλολατρίας
  choice: идолопоклонства
  rationale: Точно и ясно обозначает поклонение или служение идолам; это естественный современный русский эквивалент.
theological_decisions:
- issue: Характер запрета
  choice: Прямое повеление избегать идолопоклонства, включая участие в связанных с ним обрядах и практиках
  alternative: Предостережение лишь против внутренней приверженности идолам
  rationale: В ближайшем контексте речь идёт об участии в языческих культовых трапезах и практиках. Общий термин не сужает запрет до одного лишь внутреннего отношения.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью оригинала. Обращение «возлюбленные мои» сохраняет апостольскую теплоту; «бегите» — срочность повеления.
