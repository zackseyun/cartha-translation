  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: ru
  text: Не будем также испытывать Мессию[a], как некоторые из них испытывали Его и гибли от змей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Господа» вместо «Мессию».'
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: Не будем также
  rationale: Продолжает ряд предостережений и естественно передаёт увещевательное сослагательное наклонение в русском языке.
- source_word: ἐκπειράζωμεν
  choice: испытывать
  rationale: Глагол обозначает недозволенно подвергать кого-либо проверке; «испытывать» сохраняет смысл и не создаёт ложного впечатления, будто Мессию можно склонять ко злу.
- source_word: τὸν Χριστόν
  choice: Мессию
  rationale: Χριστός употреблено как титул; «Мессия» передаёт его смысл, а не просто транслитерирует греческое слово.
- source_word: καθώς τινες αὐτῶν ἐπείρασαν
  choice: как некоторые из них испытывали Его
  rationale: Сохраняет сравнение с поступком части израильтян в пустыне; подразумеваемое в греческом дополнение выражено местоимением для ясного русского синтаксиса.
- source_word: ὑπὸ τῶν ὄφεων
  choice: от змей
  rationale: Естественное современное обозначение причины их гибели; книжное «от змиев» было бы неоправданно архаичным.
- source_word: ἀπώλλυντο
  choice: гибли
  rationale: Несовершенный вид передаёт длительный или разворачивавшийся характер действия греческого имперфекта без тяжеловесного пассивного оборота.
theological_decisions:
- issue: Референт и разночтение τὸν Χριστόν
  choice: Мессию
  alternative: Господа
  rationale: Основной текст SBLGNT читает Χριστόν и тем самым связывает Мессию с Тем, Кого Израиль испытывал в пустыне. Значимое рукописное разночтение κύριον («Господа») отмечено, но не подменяет принятый основной текст.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Сочетание «гибли от змей» естественно передаёт греческий пассив; прописная буква в «Его» помогает ясно отнести местоимение к Мессии.
