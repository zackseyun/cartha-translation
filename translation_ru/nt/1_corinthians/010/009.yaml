  source_fidelity: 'Текст точно передаёт греческий оригинал: μηδέ ἐκπειράζωμεν выражено увещевательным «Не будем также испытывать», τὸν Χριστόν — «Мессию», сравнение с некоторыми из израильтян сохранено, а имперфект ἀπώλλυντο удачно передан формой «гибли». «От змей» естественно передаёт ὑπὸ τῶν ὄφεων без смысловой потери.'
  naturalness: Фраза звучит естественно и литературно по-русски, без ненужной архаизации. «Гибли от змей» кратко и ясно; конструкция «как некоторые из них испытывали Его» понятна в данном контексте.
