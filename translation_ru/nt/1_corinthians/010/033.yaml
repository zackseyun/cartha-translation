  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: ru
  text: Как и я во всём угождаю всем[a], ища не своей пользы, а пользы многих[b], чтобы они были спасены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всём — всем»; речь идёт о широкой готовности учитывать других ради их блага.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не своей выгоды, а выгоды многих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: как и я
  rationale: Передаёт сравнительную связь с предшествующим призывом и сохраняет указание Павла на собственный пример.
- source_word: πάντα πᾶσιν
  choice: во всём … всем
  rationale: Сохраняет широкую, но не абсолютно конкретизированную формулировку греческого текста и естественный для русского порядок слов.
- source_word: ἀρέσκω
  choice: угождаю
  rationale: Это прямой русский эквивалент со значением «стараюсь быть приятным, поступаю в интересах другого»; последующее пояснение показывает, что речь не о своекорыстном поиске человеческого одобрения.
- source_word: μὴ ζητῶν
  choice: ища не
  rationale: Передаёт причастие настоящего времени как сопутствующий образ действия или мотив.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: своей пользы
  rationale: σύμφορον обозначает пользу или выгоду; «польза» естественно звучит в контексте заботы о спасении других и не вносит излишне корыстного оттенка.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: а пользы многих
  rationale: Восполняет подразумеваемое существительное ради ясности по-русски и сохраняет буквальное «многих», не заменяя его толкованием «других».
- source_word: ἵνα σωθῶσιν
  choice: чтобы они были спасены
  rationale: Сохраняет целевое значение ἵνα, пассивную форму и обычный для Павла смысл спасения, не уточняя прямо действующее лицо.
theological_decisions:
- issue: Смысл угождения людям
  choice: «угождаю всем» как приспособление ради их подлинного блага
  alternative: поиск человеческого одобрения или нравственный компромисс
  rationale: Ограничивающая фраза о пользе многих определяет мотив Павла и не позволяет понимать его слова как лесть или своекорыстное человекоугодие.
- issue: Значение σωθῶσιν
  choice: «были спасены» в обычном для Павла смысле спасения
  alternative: «получили помощь» или «были сохранены»
  rationale: Контекст благовестия и употребление σῴζω в послании поддерживают сотериологический смысл; пассив оставлен без дополнительного уточнения действующего лица.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Прямое «угождаю» сохранено ради близости к оригиналу, а возможный отрицательный оттенок снимается контекстом и примечанием.
