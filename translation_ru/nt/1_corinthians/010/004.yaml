  source_fidelity: 'Текст точно передаёт греческий оригинал: πάντες τὸ αὐτό — «все ... одно и то же»; оба глагола ἔπιον / ἔπινον корректно переданы естественным для русского повтором «пили», при этом объяснительное придаточное и сноска сохраняют представление о продолжающемся/повторяющемся действии. «Из духовной скалы, следовавшей за ними» передаёт πνευματικῆς ἀκολουθούσης πέτρας без устранения намеренно необычного образа. Прямое «скала была Христом» верно сохраняет силу ἡ πέτρα δὲ ἦν ὁ Χριστός, не навязывая интерпретацию.'
