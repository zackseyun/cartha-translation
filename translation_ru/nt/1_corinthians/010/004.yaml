  terminology: '«Духовное», «скала» и «Христом» выбраны последовательно и точно. Сноска b надлежащим образом раскрывает титульное значение Χριστός («Помазанник, Мессия»), не заменяя традиционный русский библейский термин в основном тексте. Якоря сносок соответствуют поясняемым словам: [a] — причастному обороту о следовании скалы, [b] — «Христом».'
