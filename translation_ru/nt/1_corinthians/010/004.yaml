source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: ru
  text: и все пили одно и то же духовное питьё, потому что пили из духовной скалы, следовавшей за ними[a], а скала была Христом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из духовной скалы, которая сопровождала их». Греческое причастие может обозначать как следование позади, так и сопровождение; его форма подчёркивает продолжающееся действие.'
    reason: lexical_alternative
  - marker: b
    text: То есть Помазанником, Мессией. Греческое Χριστός здесь употреблено как титул.
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: духовное питьё
  rationale: Сохраняет повтор ключевого определения πνευματικός и параллель с «духовной пищей» в предыдущем стихе, не сужая смысл до «символического» или «сверхъестественного».
- source_word: ἔπιον ... ἔπινον
  choice: пили ... пили
  rationale: В русском контексте одинаковая форма естественна; значение продолжительного или повторявшегося действия второго глагола поддерживается придаточным объяснения. Искусственное «продолжали пить» добавило бы оттенок, не выраженный явно.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: из духовной скалы, следовавшей за ними
  rationale: «Духовной» сохраняет богословски значимое πνευματικῆς, а причастный оборот передаёт настоящее причастие ἀκολουθούσης и его длительный характер. Русский не имеет артиклей, поэтому неопределённость греческого оборота не следует искусственно выражать.
- source_word: πέτρα
  choice: скала
  rationale: πέτρα обозначает скалу или скальный массив, а не небольшой камень; «скала» также сохраняет силу образа.
- source_word: ἡ πέτρα δὲ ἦν
  choice: а скала была
  rationale: «А» естественно передаёт мягкий переход δέ и выделяет последующее поясняющее отождествление, не создавая резкого противопоставления.
- source_word: ὁ Χριστός
  choice: Христом
  rationale: В современном русском библейском и литературном употреблении «Христос» остаётся понятным титулом «Помазанник» и здесь звучит естественнее, чем менее укоренённое в данном синтаксисе «Мессией».
- source_word: πάντες τὸ αὐτὸ
  choice: все ... одно и то же
  rationale: Точно сохраняет акцент Павла на общем для всей группы опыте.
theological_decisions:
- issue: Отождествление скалы со Христом
  choice: «скала была Христом»
  alternative: «скала изображала Христа» или «скала представляла Христа»
  rationale: Прямое именное сказуемое сохраняет силу греческого ἡ πέτρα δὲ ἦν ὁ Χριστός и не сводит утверждение заранее к одному лишь символу.
- issue: Значение πνευματικός применительно к питью и скале
  choice: сохранить «духовное»
  alternative: «сверхъестественное», «символическое»
  rationale: Греческое слово допускает богословски насыщенное значение божественного дара и типологической значимости. Более толковательные варианты неоправданно сужают смысл.
- issue: Χριστός как титул
  choice: «Христос» с пояснением значения в сноске
  alternative: «Мессия»
  rationale: «Христос» — традиционный и живой русский эквивалент Χριστός; сноска делает его титульное значение явным, не превращая его молча в личное имя.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис остаётся ясным и близким к греческому; ключевые повторения и прямое богословское отождествление сохранены.
