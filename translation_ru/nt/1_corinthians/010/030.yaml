  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: ru
  text: Если я принимаю пищу с благодарностью[a], почему меня злословят за то, за что я благодарю?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если я принимаю пищу по благодати». Греческое χάριτι может означать «по благодати», однако в этом контексте его часто понимают как «с благодарностью» ввиду последующих слов «за что я благодарю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: с благодарностью
  rationale: Дательный падеж передаёт сопутствующее обстоятельство; в контексте пищи и последующего εὐχαριστῶ речь естественнее всего идёт о благодарности, с которой человек ест. Возможное значение «по благодати» сохранено в сноске.
- source_word: μετέχω
  choice: принимаю пищу
  rationale: Глагол означает участие или приобщение, а в данном контексте подразумевает вкушение пищи. Явное «пищу» делает русскую фразу естественной, не меняя подразумеваемого смысла.
- source_word: βλασφημοῦμαι
  choice: меня злословят
  rationale: Когда речь идёт о человеке, глагол обозначает порочащую или осуждающую речь против него; «злословят» точно и достойно передаёт пассивную форму без неуместного оттенка богохульства.
- source_word: ὑπὲρ οὗ
  choice: за то, за что
  rationale: Оборот указывает на основание злословия. Повтор «за то, за что» естественен по-русски и сохраняет соотнесённость с предметом благодарения.
- source_word: εὐχαριστῶ
  choice: благодарю
  rationale: Глагол значит «благодарить, воздавать благодарение». Объект благодарности, Бог, в греческом тексте не назван, поэтому и в переводе остаётся подразумеваемым.
- source_word: ἐγὼ ... ἐγὼ
  choice: я ... я
  rationale: Дважды выраженное местоимение создаёт в греческом оттенок личного акцента. В русском он достаточно передан повторением форм первого лица без искусственного усиления.
- source_word: τί
  choice: почему
  rationale: 'В риторическом вопросе τί имеет значение причины: «почему?».'
theological_decisions:
- issue: Значение χάριτι в связи с пищей и благодарением
  choice: с благодарностью
  alternative: по благодати
  rationale: Непосредственный контекст и однокоренное по смыслу εὐχαριστῶ указывают прежде всего на благодарность при принятии пищи. Вместе с тем лексически возможное «по благодати» не исключено и отмечено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Принимаю пищу» звучит естественно и достойно; «злословят» сохраняет силу исходного глагола, не создавая впечатления, будто речь обязательно идёт о богохульстве.
