base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: ru
  text: И не ропщите, как роптали некоторые из них и погибли от истребителя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от ангела-истребителя». В греческом тексте сказано «истребителя»; возможно, это отсылка к исполнителю Божьего суда в повествованиях о странствиях Израиля.'
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: И не
  rationale: Связывает этот запрет с предыдущими предостережениями и естественно передаёт продолжение ряда запретов.
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: ропщите / роптали
  rationale: «Роптать» точно выражает недовольное, осуждающее сетование и сохраняет связь с повествованиями о ропоте Израиля в пустыне; слово остаётся понятным в современном литературном русском.
- source_word: καθάπερ
  choice: как
  rationale: Естественно вводит сопоставление с примером израильтян; усиленное «точно так же, как» здесь было бы стилистически тяжеловесным.
- source_word: τινὲς αὐτῶν
  choice: некоторые из них
  rationale: Прямо передаёт партитивное выражение и отсылает к части израильтян, упомянутых в контексте.
- source_word: ἀπώλοντο
  choice: погибли
  rationale: Передаёт результат гибели естественным русским глаголом, а последующее сочетание «от истребителя» сохраняет указание на внешнего губительного деятеля.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: от истребителя
  rationale: Сохраняет субстантивированное обозначение деятеля в греческом тексте, не уточняя его личность сверх сказанного; оборот «погибли от» естественен по-русски.
theological_decisions:
- issue: Личность ὁ ὀλοθρευτής
  choice: истребитель
  alternative: ангел-истребитель
  rationale: Греческий текст называет действующее лицо «истребителем», но прямо не именует его ангелом. Основной текст сохраняет эту неопределённость, а традиционное уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Повтор «ропщите / роптали» намеренно сохраняет лексическую связь греческих форм одного глагола. Пунктуация не разделяет однородные сказуемые «роптали и погибли» лишней запятой.
