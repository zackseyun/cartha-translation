source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: ru
  text: Чаша благословения, которую мы благословляем, — разве не приобщение к крови Мессии? Хлеб, который мы преломляем, — разве не приобщение к телу Мессии?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «участие в».'
    reason: lexical_alternative
  - marker: b
    text: 'Греч. Χριστοῦ («Помазанника»); здесь переведено «Мессии», поскольку Χριστός употреблено как титул. Традиционно: «Христа».'
    reason: alternative_reading
lexical_decisions:
- source_word: ποτήριον
  choice: чаша
  rationale: «Чаша» — естественный и традиционно понятный русский эквивалент, подходящий как для обычной трапезы, так и для богослужебного контекста.
- source_word: τῆς εὐλογίας
  choice: благословения
  rationale: Прямо передаёт существительное εὐλογία и сохраняет смысловую связь с последующим глаголом «благословляем», не сводя выражение только к благодарению.
- source_word: ὃ εὐλογοῦμεν
  choice: которую мы благословляем
  rationale: Сохраняет словесный повтор «благословения — благословляем» и не уточняет сверх текста, идёт ли речь исключительно о благодарственной молитве.
- source_word: οὐχὶ
  choice: разве не
  rationale: Естественно передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: κοινωνία
  choice: приобщение к
  rationale: Передаёт реальное участие и сопричастность, не определяя способ этой связи и не разрешая конфессиональные споры о природе евхаристического присутствия.
- source_word: τοῦ αἵματος
  choice: к крови
  rationale: Сохраняет прямое упоминание крови и её жертвенно-заветный смысл без пояснительного расширения.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет титульное значение Помазанника; «Мессия» делает это значение явным, а традиционный вариант «Христос» указан в сноске.
- source_word: ἄρτον
  choice: хлеб
  rationale: Обычный и точный русский эквивалент; контекст не требует более узкого перевода «каравай» или «один хлеб».
- source_word: ὃν κλῶμεν
  choice: который мы преломляем
  rationale: Передаёт конкретное действие κλάω; «преломляем» остаётся понятным и сохраняет достоинство библейского регистра.
- source_word: τοῦ σώματος
  choice: к телу
  rationale: Прямо сохраняет христологическую и евхаристическую значимость выражения, не сужая его богословского смысла.
theological_decisions:
- issue: Передача κοινωνία в евхаристическом контексте
  choice: приобщение к
  alternative: участие в; общение с
  rationale: «Приобщение» выражает сопричастность телу и крови Мессии, но не уточняет её способ. Тем самым перевод не ослабляет выражение до простой символики и не вводит позднейшую конфессиональную формулу.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово сохраняет значение титула Помазанника. Традиционный русский эквивалент отмечен в сноске, чтобы не скрывать привычную передачу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены параллелизм двух риторических вопросов и повтор корня «благословение — благословляем». «Преломляем» предпочтено разговорному «ломаем» как естественное для данного контекста, но не узкотехническое слово.
