lexical_decisions:
- source_word: ὅτι
  choice: Поскольку
  rationale: Передаёт причинное объяснение предыдущей мысли естественным современным русским языком.
- source_word: εἷς ἄρτος
  choice: хлеб один
  rationale: Сохраняет повтор ключевых понятий «один» и «хлеб», а также евхаристический оттенок контекста; возможное конкретное значение «одна буханка хлеба» указано в сноске.
- source_word: ἓν σῶμα
  choice: одно тело
  rationale: Прямо передаёт образ единого тела, сохраняя его общинную и богословскую насыщенность без дополнительного толкования.
- source_word: οἱ πολλοί
  choice: мы, хотя нас много
  rationale: Ясно и естественно выражает противопоставление множества людей их единству.
- source_word: οἱ γὰρ πάντες
  choice: ведь все мы
  rationale: «Ведь» вводит обоснование, а «все» сохраняет акцент на всеобщем участии.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν
  choice: разделяем один хлеб
  rationale: Естественно передаёт совместное участие в одном хлебе. Формулировка не ограничивает смысл только физическим вкушением и не навязывает более позднюю конфессиональную терминологию.
theological_decisions:
- issue: Связь одного хлеба и одного тела
  choice: Сохранена прямая причинно-объяснительная связь между общим хлебом и единством многих верующих.
  alternative: Можно было усилить либо чисто символическое, либо сакраментальное понимание этой связи.
  rationale: Греческий текст тесно связывает участие в одном хлебе с единством тела, но сам перевод не должен разрешать более поздние споры о природе Вечери Господней.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой. Оборот «хотя нас много» естественно раскрывает противопоставление οἱ πολλοί и ἓν σῶμα. «Разделяем один хлеб» сохраняет образ общей трапезы и богословскую напряжённость текста без конфессионально маркированного глагола «причащаемся».
