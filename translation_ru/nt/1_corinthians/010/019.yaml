lexical_decisions:
- source_word: τί οὖν φημι
  choice: Что же я хочу сказать?
  rationale: Естественно передаёт риторический вопрос и ход рассуждения Павла; настоящее время и первое лицо сохраняются по смыслу.
- source_word: ὅτι
  choice: Что
  rationale: Просто вводит содержание предполагаемого утверждения, не добавляя толкования.
- source_word: εἰδωλόθυτόν
  choice: пища, принесённая в жертву идолам
  rationale: В контексте речь идёт о пище, связанной с языческим жертвоприношением; формулировка ясна современному читателю.
- source_word: τί ἐστιν
  choice: что-то значит
  rationale: Передаёт идиоматический вопрос о реальной значимости, не утверждая ни полного небытия предмета, ни его божественной реальности.
- source_word: ἢ
  choice: или
  rationale: Сохраняет простую разделительную связь между параллельными частями вопроса.
- source_word: εἴδωλον
  choice: идол
  rationale: Контекстуально точное и общепринятое обозначение культового образа или ложного божества.
theological_decisions:
- issue: Утверждает ли Павел реальное существование или духовную значимость идолов и посвящённой им пищи
  choice: 'Сохранить риторическую форму: «что-то значит»'
  alternative: «имеет реальное существование» или «представляет собой нечто реальное»
  rationale: Греческое τί ἐστιν допускает вопрос о значимости или реальности в соответствующем смысле. Перевод не превращает стих в философское отрицание материального существования идола и не приписывает жертвенной пище внутренней духовной силу.
translation_notes:
  register: Современный литературный русский язык; риторическая краткость оригинала сохранена. Повтор «что-то значит» намеренно передаёт параллелизм двух греческих оборотов τί ἐστιν.
