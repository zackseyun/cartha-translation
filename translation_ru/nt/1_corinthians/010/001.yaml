  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: ru
  text: Ибо я не хочу, братья[a], чтобы вы не знали, что все наши отцы были под облаком и все прошли через море.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово «братья» может служить обращением ко всей общине, включая женщин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: я не хочу, чтобы вы оставались в неведении
  rationale: Сохраняет отрицательную форму греческого оборота и естественно звучит по-русски; вариант «не хочу, чтобы вы не знали» менее плавен, а «хочу, чтобы вы знали» снимает отмеченное в оригинале отрицание.
- source_word: γὰρ
  choice: Ибо
  rationale: Передаёт пояснительную связь с предыдущим рассуждением Павла; в современном литературном русском сохраняет достоинство библейского регистра.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет форму мужского множественного числа в оригинале; контекстуальное обращение ко всей общине, включая женщин, поясняется в сноске.
- source_word: οἱ πατέρες ἡμῶν
  choice: наши отцы
  rationale: Сохраняет семейно-историческую формулировку и риторическое отождествление коринфских верующих с историей Израиля; «предки» было бы более обобщённо.
- source_word: πάντες
  choice: все ... все
  rationale: Повтор сохранён, поскольку он риторически важен для дальнейшего противопоставления в отрывке.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: были под облаком
  rationale: Естественно и близко передаёт образ облака, сопровождавшего Израиль при исходе.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: прошли через море
  rationale: Точно передаёт движение через море, не добавляя отсутствующих в греческом тексте уточнений.
theological_decisions:
- issue: Обращение ἀδελφοί к общине смешанного состава
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматическую форму оригинала, а охват всей общины отмечен в сноске.
- issue: Отождествление церкви, включающей неевреев, с Израилем в выражении οἱ πατέρες ἡμῶν
  choice: наши отцы
  alternative: наши предки
  rationale: «Наши отцы» сохраняет намеренную семейную и общинную связь с историей Израиля, не разрешая дополнительно вопрос о характере этой связи.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для обычного читателя; повтор «все» и ключевые образы исхода сохранены.
