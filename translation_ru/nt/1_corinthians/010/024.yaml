  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: ru
  text: Пусть никто не ищет своей пользы, но пользы другого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть никто не ищет своего, но того, что принадлежит другому». В греческом оба выражения эллиптичны.'
    reason: 'Лексическая альтернатива: исходный текст не называет прямо ни собственную пользу, ни пользу другого.'
lexical_decisions:
- source_word: μηδεὶς
  choice: Пусть никто не
  rationale: В сочетании с императивом третьего лица выражает общий запрет; эта конструкция естественна для современного русского языка.
- source_word: ζητείτω
  choice: ищет
  rationale: 'Сохраняет простоту и широкий смысл ζητέω: искать, добиваться, стремиться к чему-либо.'
- source_word: τὸ ἑαυτοῦ
  choice: своей выгоды
  rationale: 'Субстантивированное сочетание эллиптично: буквально «своего». В контексте 10:23–33 речь идёт об отказе от собственной пользы или преимущества ради другого; «выгода» передаёт этот смысл, не ограничивая его материальной сферой.'
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт прямое противопоставление между собственной выгодой и пользой другого.
- source_word: τὸ τοῦ ἑτέρου
  choice: пользы другого
  rationale: Эллиптическое «того, что другого» раскрыто симметрично первой части. ἕτερος обозначает другого человека в противопоставлении самому себе.
theological_decisions:
- issue: Восполнение подразумеваемого существительного в τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου
  choice: «своей выгоды ... пользы другого»
  alternative: «своего ... того, что принадлежит другому»; «своих интересов ... интересов другого»
  rationale: 'Греческий текст намеренно оставляет объект подразумеваемым. В русском буквальная эллиптическая формулировка звучит неясно, поэтому смысл раскрыт через контекст: человек не должен добиваться собственного преимущества, а должен искать пользы другого. Сноска сохраняет доступ к более буквальной форме и её неоднозначности.'
translation_notes:
  register: Современный литературный русский язык; краткая, наставительная и dignified формулировка. Тире после «но» подчёркивает эллипсис сказуемого и ясный контраст.
