  source_fidelity: 'Греческие τὸ ἑαυτοῦ и τὸ τοῦ ἑτέρου — параллельные эллиптические выражения («своего ... другого/того, что другого»). Основной смысл передан верно: отказ от поиска собственного преимущества ради блага другого. Однако «выгода» заметнее тяготеет к личной, нередко материальной или корыстной пользе, тогда как «польза» во второй части шире; такая асимметрия не отражает параллелизма оригинала.'
