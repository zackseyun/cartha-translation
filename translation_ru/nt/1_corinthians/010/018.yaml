lexical_decisions:
- source_word: βλέπετε
  choice: Посмотрите
  rationale: Повелительное наклонение во множественном числе призывает обратить внимание и осмыслить приведённый пример; «посмотрите» естественно вводит аргумент Павла.
- source_word: τὸν Ἰσραὴλ κατὰ σάρκα
  choice: Израиль по плоти
  rationale: Сохраняет характерное для Павла выражение и его буквальный образ; в данном контексте речь идёт об Израиле по природному происхождению, а не о «греховной природе».
- source_word: οὐχ ... εἰσίν;
  choice: разве ... не ...?
  rationale: Передаёт риторический вопрос с ожидаемым утвердительным ответом.
- source_word: οἱ ἐσθίοντες
  choice: те, кто ест
  rationale: Передаёт субстантивированное причастие настоящего времени и сохраняет конкретное действие еды.
- source_word: τὰς θυσίας
  choice: жертвы
  rationale: Прямой и естественный эквивалент, уместный в контексте жертвенной трапезы.
- source_word: κοινωνοὶ τοῦ θυσιαστηρίου
  choice: приобщаются к жертвеннику
  rationale: Передаёт реальную сопричастность жертвеннику и связанному с ним жертвоприношению; глагольная конструкция звучит по-русски естественнее буквального «являются участниками жертвенника».
theological_decisions:
- issue: Значение выражения «Израиль по плоти»
  choice: Сохранить формулировку «Израиль по плоти» как указание на Израиль по природному, телесному происхождению.
  alternative: «Израиль по природному происхождению» или «земной Израиль».
  rationale: Контекст указывает на исторический народ Израиля и его жертвенную практику, однако буквальная формулировка сохраняет богословскую напряжённость выражения и не вводит более широких выводов об Израиле и Церкви.
- issue: Характер связи с жертвенником
  choice: «приобщаются к жертвеннику»
  alternative: «становятся сопричастниками жертвенника» или «имеют долю в жертвеннике».
  rationale: κοινωνοί обозначает подлинное участие или общность. Перевод не сводит эту связь ни к простому присутствию при трапезе, ни к тождеству с самим жертвенником.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранено выражение «по плоти», а смысл κοινωνοί передан естественной конструкцией «приобщаются к».
