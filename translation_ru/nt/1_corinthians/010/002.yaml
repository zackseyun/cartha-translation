  text: и все крестились в Моисея[a] — в облаке и в море[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соединились с Моисеем», «отождествились с Моисеем» или «признали власть Моисея». Буквально по-гречески: «в Моисея»; это сохраняет проведённую Павлом типологическую параллель с крещением.'
    reason: alternative_reading
  - marker: b
    text: Павел говорит «в море», а не «через море», сохраняя параллель с выражением «в облаке».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: все
  rationale: Кратко передаёт собирательное указание на всех израильтян и сохраняет повторяющийся в контексте акцент Павла.
- source_word: εἰς τὸν Μωϋσῆν
  choice: в Моисея
  rationale: Формальное соответствие сохраняет необычное выражение Павла и типологическую параллель с языком крещения, не сводя его смысл к одному толкованию.
- source_word: ἐβαπτίσαντο
  choice: крестились
  rationale: Естественная русская форма передаёт аорист среднего залога без неуместного уточнения, будто израильтяне совершили обряд над собой; сохраняется устоявшееся значение βαπτίζω и типологический характер выражения.
- source_word: ἐν τῇ νεφέλῃ
  choice: в облаке
  rationale: 'Сохраняет предлог ἐν, образ Исхода и возможную смысловую широту: сферу, средство или связь.'
- source_word: ἐν τῇ θαλάσσῃ
  choice: в море
  rationale: Передаёт именно ἐν, а не διά, и сохраняет параллельную конструкцию «в облаке и в море».
theological_decisions:
- issue: Смысл крещения Израиля «в Моисея»
  choice: Сохранить буквальное типологическое и представительское выражение «в Моисея».
  alternative: «соединились с Моисеем», «признали власть Моисея» или «отождествились с Моисеем»
  rationale: Павел сопоставляет опыт Исхода с христианским крещением. Перевод не должен заранее разрешать богословскую напряжённость и ограничивать выражение одним объяснением.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Тире помогает естественно связать уточняющие обстоятельства с фразой «крестились в Моисея», не изменяя их синтаксической параллельности.
