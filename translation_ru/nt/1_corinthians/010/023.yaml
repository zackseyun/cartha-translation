  source_fidelity: 'Текст точно передаёт повторяющуюся формулу Πάντα ἔξεστιν и оба противопоставления: συμφέρει — «полезно», οἰκοδομεῖ — «созидает». Сжатый параллелизм оригинала сохранён. Кавычки являются допустимым интерпретационным оформлением и не выдают спорное чтение за текстологический факт, поскольку неоднозначность оговорена в сноске.'
  naturalness: «Всё позволено, но не всё полезно» звучит естественно и афористично в современном литературном русском. «Не всё созидает» несколько книжнее, но уместно для павловской строительной метафоры и понятно в библейском регистре.
  terminology: «Позволено» удачно передаёт ἔξεστιν без ненужной юридизации; сноска корректно даёт «законно» как альтернативу. «Созидает» сохраняет важную метафору οἰκοδομεῖ и не навязывает конкретное конфессиональное толкование о том, кого именно назидают.
