id: 1CO.10.23
reference: 1 Corinthians 10:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: ru
  text: «Всё позволено», но не всё полезно.[a] «Всё позволено», но не всё созидает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё законно». Греческое выражение может означать как дозволенность, так и соответствие закону. Кавычки показывают, что это, вероятно, коринфский лозунг, который Павел уточняет; однако фразу можно понимать и как его собственное утверждение.'
    reason: Лексическая альтернатива и неоднозначность цитирования.
lexical_decisions:
- source_word: Πάντα
  choice: Всё
  rationale: Субстантивированное прилагательное среднего рода во множественном числе имеет всеохватный смысл; русское «всё» естественно и сохраняет краткую, повторяющуюся форму выражения.
- source_word: ἔξεστιν
  choice: позволено
  rationale: Безличная форма естественно передаёт значение допустимости или дозволенности и не придаёт фразе излишне юридического оттенка.
- source_word: ἀλλ’
  choice: но
  rationale: Краткий противительный союз точно воспроизводит резкое сопоставление в греческом тексте.
- source_word: συμφέρει
  choice: полезно
  rationale: Глагол обозначает то, что приносит пользу или служит ко благу; «полезно» ясно и естественно выражает эту мысль без коммерческого оттенка.
- source_word: οἰκοδομεῖ
  choice: созидает
  rationale: Слово сохраняет строительную метафору Павла и в современном библейском контексте означает укрепление и развитие человека или общины.
theological_decisions:
- issue: Следует ли обозначать Πάντα ἔξεστιν как цитируемый коринфский лозунг
  choice: Выражение «Всё позволено» заключено в кавычки в обоих случаях.
  alternative: Передать фразу без кавычек как собственное, прямо не маркированное утверждение Павла.
  rationale: Повторяемая формула, вероятно, была коринфским лозунгом, который Павел ограничивает своими уточнениями. Поскольку древнегреческие рукописи не имели современных кавычек, это остаётся интерпретационным решением; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий афористичный параллелизм оригинала сохранён. «Созидает» выбрано ради сохранения характерной для Павла строительной метафоры, оставаясь понятным в данном контексте.
