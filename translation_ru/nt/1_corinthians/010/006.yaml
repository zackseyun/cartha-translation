source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: ru
  text: А всё это стало примерами для нас[a], чтобы мы не желали дурного, как желали и они.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образцами для нас»; возможно также: «прообразами для нас».'
    reason: Слово τύποι может обозначать примеры, образцы или прообразы; основной текст передаёт прежде всего увещательную функцию, а сноска сохраняет лексическую широту.
lexical_decisions:
- source_word: Ταῦτα
  choice: всё это
  rationale: Указательное местоимение среднего рода во множественном числе отсылает к ранее рассказанным событиям в пустыне; по-русски собирательное «всё это» звучит естественно.
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает переход с лёгким противопоставлением: события относятся к Израилю, но служат примером для христиан. «Но» естественно передаёт эту связь, не вводя отсутствующего временного «теперь».'
- source_word: τύποι ἡμῶν
  choice: примерами для нас
  rationale: В данном увещательном контексте τύποι означает поучительные образцы или прецеденты. «Примеры» ясно передаёт практическую направленность, а сноска сохраняет более буквальные возможности.
- source_word: ἐγενήθησαν
  choice: стало
  rationale: Форма γίνομαι выражает становление или приобретение функции; «стало» сохраняет этот оттенок лучше, чем простое «было».
- source_word: εἰς τὸ μὴ εἶναι ἡμᾶς
  choice: чтобы мы не
  rationale: Конструкция допускает оттенки цели и результата; русское «чтобы» естественно сохраняет эту смысловую ёмкость. Именная конструкция далее передана глагольно ради естественного русского синтаксиса.
- source_word: ἐπιθυμητὰς κακῶν
  choice: стремились к злу
  rationale: ἐπιθυμητής обозначает желающего, а κακῶν — объект пагубного желания. «Стремиться к злу» передаёт устойчивую направленность желания и не сужает смысл до сексуальной похоти.
- source_word: καθὼς κἀκεῖνοι ἐπεθύμησαν
  choice: как стремились и они
  rationale: Сохраняется сравнение и добавочное значение καί в κἀκεῖνοι; повтор глагола воспроизводит связь с предыдущим выражением без тяжеловесного повтора «стремились к нему».
theological_decisions:
- issue: Значение τύποι применительно к событиям исхода
  choice: «примеры» в смысле назидательных и предостерегающих прецедентов
  alternative: «прообразы» или «образцы»
  rationale: Ближайший контекст подчёркивает нравственное предостережение. «Прообразы» могло бы навязать более узкую техническую типологию, хотя соответствующая лексическая возможность отмечена в сноске.
- issue: Широта значения ἐπιθυμέω / ἐπιθυμητής
  choice: «стремиться к злу»
  alternative: «вожделеть злого», «жаждать дурного»
  rationale: Греческая лексика обозначает широкое пагубное желание и не ограничена сексуальным смыслом. Выбранная формулировка сохраняет нравственную серьёзность и общий охват.
- issue: Целевой или результативный оттенок εἰς τὸ μή с инфинитивом
  choice: «чтобы»
  alternative: «так что» или «для того, чтобы»
  rationale: Контекст позволяет видеть предназначение этих событий как предостережения, не исключая результирующего оттенка. Обычное русское «чтобы» не требует чрезмерно жёсткого разграничения.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Глагольная формулировка «не стремились к злу» предпочтена буквальному, но неестественному «не были желающими злого». Частица δέ сохранена как «Но», поскольку она связывает повествование с его применением к читателям.
