  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: ru
  text: 'Не становитесь идолопоклонниками, как некоторые из них, — как написано: «Народ сел есть и пить и встал забавляться».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встал предаваться разгулу». Это цитата из Исхода 32:6, где такое веселье связано с идолопоклонническим пиршеством Израиля у золотого тельца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Не
  rationale: В контексте это продолжение ряда предостережений; русская отрицательная повелительная конструкция естественно передаёт связь без тяжеловесного «и не».
- source_word: εἰδωλολάτραι
  choice: идолопоклонниками
  rationale: Устоявшийся и точный русский эквивалент существительного со значением людей, поклоняющихся идолам.
- source_word: γίνεσθε
  choice: становитесь
  rationale: Передаёт значение вхождения в определённое состояние или образ поведения, а не только статичное «будьте».
- source_word: καθώς τινες αὐτῶν
  choice: как некоторые из них
  rationale: Сохраняет сравнительную конструкцию и допускаемую греческим текстом эллиптичность без избыточного повторения сказуемого.
- source_word: ὥσπερ γέγραπται
  choice: как написано
  rationale: Естественная русская формула цитирования Писания; форма «написано» передаёт сохраняющую силу записанного текста.
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: Народ сел
  rationale: Точно и естественно передаёт коллективное единственное число и начало цитаты.
- source_word: φαγεῖν καὶ πεῖν
  choice: есть и пить
  rationale: Прямой эквивалент парных инфинитивов.
- source_word: ἀνέστησαν
  choice: а потом встал
  rationale: «Встал» передаёт действие буквально, а «потом» и противительный союз естественно обозначают последовательность двух действий в русском повествовании.
- source_word: παίζειν
  choice: забавляться
  rationale: Сохраняет широкое значение игры и увеселения, не сводя слово исключительно к разгулу; контекстуальный оттенок пиршественного разгула отмечен в сноске.
theological_decisions:
- issue: Насколько явно раскрывать смысл παίζειν в связи с Исходом 32:6
  choice: В основном тексте оставить широкое «забавляться», а контекстуальное значение разгула пояснить в сноске.
  alternative: «предаваться разгулу» или «веселиться»
  rationale: Цитата относится к празднеству у золотого тельца, однако само греческое слово семантически шире. Основной текст сохраняет эту неоднозначность, а сноска сообщает важный контекст, не превращая толкование в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской интонацией. Цитата звучит просто и достойно; архаизмы исключены. Маркер сноски поставлен непосредственно после цитаты.
