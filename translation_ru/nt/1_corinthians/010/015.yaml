  text: Я обращаюсь к вам как к рассудительным людям[a]; сами рассудите, что я говорю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоразумным людям»; также возможно: «мудрым людям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φρονίμοις
  choice: как с рассудительными людьми
  rationale: Оборот обозначает, в каком качестве Павел обращается к своим читателям. «Рассудительные» передаёт практическое благоразумие и здравое суждение, не усиливая значение до безусловной похвалы мудрости.
- source_word: λέγω
  choice: я говорю
  rationale: Естественно передаёт настоящее время и речевое действие в обращении Павла.
- source_word: κρίνατε
  choice: рассудите
  rationale: Императив призывает слушателей самостоятельно оценить сказанное. В данном контексте «рассудите» естественнее русского «судите» и сохраняет идею взвешенного суждения.
- source_word: ὑμεῖς
  choice: сами
  rationale: Явно выраженное местоимение имеет эмфатический характер; «сами» передаёт призыв к личной оценке.
- source_word: ὅ φημι
  choice: что я говорю
  rationale: Прямой и естественный русский эквивалент относительной конструкции; различие между λέγω и φημί здесь не требует искусственного разграничения.
theological_decisions:
- issue: Риторическая характеристика адресатов
  choice: «рассудительными людьми» — положительное, но умеренное обращение, указывающее на способность к здравой оценке
  alternative: «мудрыми людьми», либо понимание обращения как иронического
  rationale: Греческий текст сам по себе не устанавливает однозначно ни иронию, ни полное одобрение адресатов. Перевод сохраняет эту риторическую открытость.
translation_notes:
  register: Современный литературный русский язык; тон достоинственный и ясный. Повтор «говорю» сохранён вслед за двумя близкими греческими глаголами, а эмфаза ὑμεῖς передана словом «сами».
