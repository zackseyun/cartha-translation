  text: and all ate the same spiritual food[a]
translation:
  language: ru
  text: и все ели одну и ту же духовную пищу[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сверхъестественную пищу». Вероятно, речь идёт о манне в пустыне; в данном контексте это выражение может также иметь типологический смысл.'
    reason: Лексическая альтернатива и сохранение возможной типологической силы выражения.
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Обычный соединительный союз, связывающий стих с предыдущим высказыванием.
- source_word: πάντες
  choice: все
  rationale: Передаёт подчёркнутую всеобщность и относится ко всему упомянутому народу Израиля.
- source_word: τὸ αὐτὸ
  choice: одну и ту же
  rationale: Естественная русская передача тождества пищи, подчёркнутого сочетанием артикля с αὐτό.
- source_word: πνευματικὸν
  choice: духовную
  rationale: Сохраняет характерное для Павла определение и не сужает его до значений «данную Духом» или «сверхъестественную».
- source_word: βρῶμα
  choice: пищу
  rationale: Прямой и стилистически уместный эквивалент общего обозначения еды.
- source_word: ἔφαγον
  choice: ели
  rationale: Естественно передаёт прошедшее повествовательное действие; несовершенный вид в русском здесь описывает общий для всех опыт без изменения смысла греческого аориста.
theological_decisions:
- issue: Значение выражения «духовная пища» в типологии странствования по пустыне
  choice: Сохранить в основном тексте выражение «духовная пища», не уточняя, что это манна, и не делая явной связь с Вечерей Господней.
  alternative: «сверхъестественная пища»; «пища, данная Духом»; прямое указание на манну или Вечерю Господню
  rationale: Контекст, вероятно, отсылает к манне, однако формулировка Павла несёт более широкую типологическую нагрузку. Буквенно-смысловая передача сохраняет эту богословскую напряжённость и не навязывает узкого толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сочетание «одну и ту же» естественно подчёркивает общее участие всех, а «духовную» сохраняет неоднозначность оригинала.
