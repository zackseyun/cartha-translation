source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: ru
  text: 'Вас постигло лишь такое искушение, какое бывает у людей.[a] Но Бог верен: Он не допустит, чтобы вы подверглись искушению сверх ваших сил, но вместе с искушением даст и выход,[b] чтобы вы могли перенести его.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вас постигло лишь такое испытание, какое бывает у людей». Греческое слово может означать как «искушение», так и «испытание»; выражение указывает на то, что свойственно людям.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «путь выхода»; возможно также: «исход».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «смогли выдержать его». «Выход», который даёт Бог, позволяет перенести искушение, а не обязательно означает его немедленное прекращение.'
    reason: translation_clarification
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: искушение / быть искушаемыми
  rationale: В ближайшем контексте Павел предостерегает от греховного желания и идолопоклонства, поэтому нравственный смысл здесь наиболее заметен; возможное значение «испытание» сохранено в примечании.
- source_word: εἴληφεν
  choice: постигло
  rationale: Передаёт совершенный вид и значение переживания, которое настигло адресатов, естественным современным русским языком.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: лишь человеческое
  rationale: ἀνθρώπινος означает «человеческий», то есть свойственный людям и не выходящий за пределы человеческого опыта; краткая формулировка не добавляет отсутствующего в греческом слова «обычное».
- source_word: πιστός
  choice: верен
  rationale: Выражает надёжность Бога и Его постоянство.
- source_word: οὐκ ἐάσει
  choice: не допустит
  rationale: Точно и естественно передаёт значение разрешения или допущения.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: сверх ваших сил
  rationale: Идиоматически передаёт предел способности адресатов, выраженный δύνασθε.
- source_word: ποιήσει
  choice: даст
  rationale: В сочетании с ἔκβασις обозначает активное обеспечение Богом выхода; по-русски «даст выход» звучит естественнее буквального «сделает».
- source_word: σὺν τῷ πειρασμῷ
  choice: вместе с искушением
  rationale: 'Сохраняет идею одновременного сопровождения: Божье обеспечение дано вместе с искушением, а не обязательно посредством его немедленного устранения.'
- source_word: ἔκβασιν
  choice: выход
  rationale: Передаёт основной образ выхода или пути наружу, не исключая оттенка благополучного исхода.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: чтобы вы могли выстоять
  rationale: Передаёт цель или результат и значение ὑποφέρω — выдерживать давление, стойко переносить; «выстоять» естественно связывает Божий выход с терпеливой стойкостью.
theological_decisions:
- issue: Значение πειρασμός и πειρασθῆναι
  choice: В основном тексте — «искушение» и «быть искушаемыми».
  alternative: «Испытание» и «подвергаться испытанию».
  rationale: Контекст греховных желаний и идолопоклонства поддерживает нравственный смысл, но греческие слова допускают и более широкое значение испытания; эта неоднозначность не устраняется.
- issue: Характер обещанного ἔκβασις
  choice: «выход», благодаря которому верующие могут выстоять.
  alternative: «путь выхода» или «исход».
  rationale: Заключительная цель — перенести искушение, поэтому текст не обещает непременно его немедленного прекращения; он утверждает, что Бог обеспечивает возможность устоять.
- issue: Божья верность и предел искушения
  choice: Бог не допустит искушения сверх сил адресатов и обеспечит выход.
  alternative: Формулировка через более общее «испытание».
  rationale: Перевод сохраняет прямое утверждение текста о Божьем верном ограничении переживаемого, не вводя дополнительного учения о происхождении искушения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Сверх ваших сил» и «выстоять» выбраны как естественные русские соответствия, сохраняющие смысл греческих оборотов. Все примечания отмечены в основном тексте.
