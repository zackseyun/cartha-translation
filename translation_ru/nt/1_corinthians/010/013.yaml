  verdict: revise
  source_fidelity: Начальное «Вас постигло лишь человеческое искушение» передаёт βασовую лексику, но в современном русском звучит неполно и может быть понято как противопоставление «человеческого» иному виду искушения, без ясного смысла «свойственное людям». Греческое отрицание οὐκ ... εἰ μὴ требует более явной конструкции «лишь такое..., какое бывает у людей». Остальная синтаксическая линия верно передаёт Божью верность, предел допущенного искушения, сопутствующий ἔκβασις и цель перенесения.
  naturalness: «Лишь такое искушение, какое бывает у людей» — естественная современная литературная формула. «Подвергнуться искушению» и «перенести его» яснее, чем несколько книжное «быть искушаемыми» и менее конкретное «выстоять», при этом сохраняют пассивный смысл и значение ὑποφέρειν.
  terminology: «Искушение» оправдано контекстом, а возможность перевода «испытание» следует сохранить в примечании. «Бог верен», «не допустит», «выход» и «перенести» надёжно соответствуют πιστός, ἐάσει, ἔκβασις и ὑπενεγκεῖν. Примечание к «выходу» должно также сохранять вариант «исход», не превращая его в догматическое толкование.
