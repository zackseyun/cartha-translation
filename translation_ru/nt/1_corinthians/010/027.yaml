  source_fidelity: 'Текст точно передаёт греческий оригинал: условное приглашение со стороны «неверующего», готовность пойти, повеление есть всё подаваемое и не выяснять ничего по причине/в связи с совестью. Неоднозначность того, чья именно совесть имеется в виду, сохранена.'
