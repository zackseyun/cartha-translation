  terminology: «Неверующие», «приглашает», «ешьте» и «совесть» являются точными и устойчивыми соответствиями. «Ни о чём не расспрашивая» верно передаёт практический смысл μηδὲν ἀνακρίνοντες, не вводя в основной текст уточнение об идоложертвенной пище.
