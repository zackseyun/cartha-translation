id: 1CO.10.27
reference: 1 Corinthians 10:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: ru
  text: Если кто-нибудь из неверующих приглашает вас и вы хотите пойти, ешьте всё, что вам подадут, ни о чём не расспрашивая ради совести.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничего не выясняя»; речь идёт о том, чтобы не расспрашивать о происхождении пищи. Чья именно совесть имеется в виду, поясняется в следующем стихе.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: неверующих
  rationale: Субстантивированное определение обозначает людей, не разделяющих христианскую веру; «неверующие» кратко и естественно сохраняет различение внутри контекста.
- source_word: καλεῖ
  choice: приглашает
  rationale: В контексте совместной трапезы глагол означает приглашение, а не просто обращение или призыв.
- source_word: θέλετε πορεύεσθαι
  choice: вы хотите пойти
  rationale: Передаёт желание или готовность принять приглашение и сохраняет условный характер высказывания.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: всё, что вам подадут
  rationale: Оборот относится к подаваемой на трапезе пище; эта формулировка естественна по-русски и сохраняет всеохватность πᾶν.
- source_word: ἐσθίετε
  choice: ешьте
  rationale: Настоящее повелительное выражает общее практическое предписание; обычная русская форма повелительного наклонения передаёт его без избыточного уточнения вида.
- source_word: μηδὲν ἀνακρίνοντες
  choice: ни о чём не расспрашивая
  rationale: В данном контексте речь идёт не об исследовании пищи как таковой, а о выяснении её происхождения, вероятно связи с идоложертвенным.
- source_word: διὰ τὴν συνείδησιν
  choice: ради совести
  rationale: διά с винительным указывает на основание или принимаемое во внимание соображение. Краткая формулировка сохраняет неоднозначность относительно того, чья именно совесть имеется в виду.
theological_decisions:
- issue: К чьей совести относится συνείδησις
  choice: В основном тексте оставлено общее «ради совести», без уточнения принадлежности.
  alternative: 'Уточнить: «ради вашей совести» или «ради совести другого человека».'
  rationale: Сам стих не называет носителя совести; следующий стих развивает эту мысль. Преждевременное уточнение сняло бы намеренную контекстуальную напряжённость.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанный и достойный стиль. «Всё, что вам подадут» естественно для ситуации трапезы, а «ради совести» сохраняет краткость и смысловую открытость греческого текста.
