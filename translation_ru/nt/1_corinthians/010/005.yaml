base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: ru
  text: Но Бог не был доволен большинством из них, ибо они были повержены[a] в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пали»; образно: «были распростёрты» или «были разбросаны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт сильное противопоставление перечисленным ранее привилегиям Израиля; в современном русском здесь естественнее краткое «но».
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός
  choice: большинство из них не были угодны Богу
  rationale: Естественно передаёт конструкцию εὐδοκέω с ἐν и сохраняет количественный смысл τοῖς πλείοσιν — «большинство».
- source_word: κατεστρώθησαν
  choice: они пали
  rationale: В контексте означает гибель израильтян в пустыне вследствие суда; «пали» передаёт смерть и сохраняет образ поверженных тел, не уточняя способ гибели.
- source_word: γὰρ
  choice: поэтому
  rationale: Связывает Божье неблаговоление с последовавшей гибелью. Хотя γάρ обычно пояснительное, в данном русском построении «поэтому» естественно выражает очевидную смысловую связь.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Традиционное и понятное обозначение места странствий Израиля после исхода.
theological_decisions:
- issue: Характер суда, выраженного κατεστρώθησαν
  choice: «они пали» — указание на гибель израильтян в пустыне под Божьим судом
  alternative: «они были повержены» или «их тела были разбросаны»
  rationale: Контекст предупреждения ясно подразумевает Божий суд, однако глагол сам по себе образно описывает павших; перевод не добавляет конкретного способа гибели.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формулировка краткая и понятная; образность редкого греческого глагола отражена в основном тексте и уточнена в сноске.
