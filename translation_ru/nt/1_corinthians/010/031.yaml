  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: ru
  text: Итак, едите ли вы, пьёте ли или делаете что бы то ни было — всё делайте во славу Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: едите ли ... пьёте ли ... или делаете
  rationale: Повторяющаяся соотносительная конструкция обозначает ряд возможных случаев. Частицы «ли ... ли ... или» естественно передают её по-русски, сохраняя риторическое перечисление.
- source_word: οὖν
  choice: Итак
  rationale: Союз вводит практический вывод из предшествующего рассуждения; «итак» ясно выражает итоговый переход и соответствует возвышенному, но современному регистру.
- source_word: ἐσθίετε
  choice: едите
  rationale: Настоящее время имеет обобщённое значение и говорит не о действии в данный момент, а об обычном или возможном действии.
- source_word: πίνετε
  choice: пьёте
  rationale: Как и ἐσθίετε, форма настоящего времени употреблена обобщённо.
- source_word: τι
  choice: что-либо другое
  rationale: В сочетании εἴτε τι ποιεῖτε местоимение расширяет ряд за пределы еды и питья. Добавление «другое» естественно для русского перечисления и не ограничивает всеохватность выражения.
- source_word: ποιεῖτε
  choice: делаете / делайте
  rationale: Одна и та же греческая форма по контексту сначала входит в условно-альтернативный оборот, а затем выражает повелительное наставление. Русское различение «делаете» и «делайте» передаёт эти функции естественно.
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа имеет всеобъемлющий смысл; русское «всё» кратко и естественно передаёт совокупность любых действий.
- source_word: εἰς δόξαν
  choice: во славу
  rationale: Предлог εἰς здесь обозначает цель или направленность. Устойчивое русское выражение «во славу» передаёт, что поступки должны быть направлены к прославлению Бога.
- source_word: θεοῦ
  choice: Бога
  rationale: Родительный падеж прямо передаёт греческий генитив и сохраняет выражение «слава Бога» внутри устойчивого оборота «во славу Бога».
theological_decisions:
- issue: Объём наставления Павла
  choice: Наставление охватывает все поступки, включая обычные действия, и призывает направлять их во славу Бога.
  alternative: Наставление относится только к вопросам еды и питья.
  rationale: Павел переходит от конкретных примеров — еды и питья — к широким выражениям τι и πάντα. Перевод сохраняет как связь с непосредственным контекстом, так и всеобщий характер сформулированного принципа.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и достойная формулировка. Тире отделяет перечисление возможных действий от итогового повеления и делает синтаксис прозрачным. Слово «Бог» передано без конфессионально окрашенных уточнений.
