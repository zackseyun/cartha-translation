  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: ru
  text: И не будем предаваться сексуальной безнравственности, как некоторые из них предавались ей, — и в один день пали двадцать три тысячи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пали»; в этом контексте речь идёт о смерти под судом. В Числах 25:9 названы двадцать четыре тысячи умерших. Павел говорит, что двадцать три тысячи пали «в один день»; возможно, это число умерших в тот день, тогда как в книге Чисел приведено общее число. Перевод сохраняет формулировку Павла, не устраняя расхождения.'
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: μηδὲ πορνεύωμεν
  choice: Не будем и предаваться разврату
  rationale: Отрицательная увещательная форма передаёт запрет, продолжающий ряд предостережений; «предаваться разврату» естественно выражает сексуальную безнравственность, не сужая значение до одного конкретного проступка.
- source_word: καθώς τινες αὐτῶν ἐπόρνευσαν
  choice: как некоторые из них предались разврату
  rationale: Сохранены сравнение, неопределённое «некоторые» и повтор того же корня по смыслу, подчёркивающий связь между запретом и примером Израиля.
- source_word: ἔπεσαν
  choice: пало
  rationale: Буквально передаёт образ греческого πίπτω; в данном контексте речь идёт о смерти под судом, что поясняется в сноске.
- source_word: μιᾷ ἡμέρᾳ
  choice: в один день
  rationale: Естественно передаёт временной дательный и подчёркивает, что это произошло в пределах одного дня.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: двадцать три тысячи
  rationale: Прямо воспроизводит число, засвидетельствованное в греческом тексте, без согласования с Числами 25:9.
theological_decisions:
- issue: Соотношение с числом в Числах 25:9
  choice: В основном тексте сохранить «двадцать три тысячи».
  alternative: Заменить на «двадцать четыре тысячи» либо представить одно число как итог другого.
  rationale: Греческий текст 1 Коринфянам прямо содержит число двадцать три тысячи. Перевод не должен устранять числовое напряжение путём гармонизации; возможное объяснение следует вынести в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повтор «разврату — разврату» намеренно сохраняет риторическую связь греческих однокоренных форм. «Пало» сохраняет исходный образ и допускает контекстуальное значение смерти под судом.
