source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: ru
  text: 'Нет: то, что они приносят в жертву, они приносят бесам, а не Богу; и я не хочу, чтобы вы становились причастниками бесов.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имеющими общение с бесами»; также возможно: «участниками вместе с бесами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: Нет. То, что
  rationale: В контексте ἀλλά вводит исправление возможного неверного вывода из предыдущего стиха. Русское «Нет» естественно передаёт корректирующую силу, а «то, что» вводит содержание противопоставления.
- source_word: ἃ θύουσιν
  choice: то, что они приносят в жертву
  rationale: Нейтральное относительное местоимение обозначает жертвенные приношения без лишней конкретизации; выражение естественно по-русски и сохраняет общий смысл.
- source_word: θύουσιν
  choice: приносят в жертву
  rationale: В культовом контексте θύω означает совершать жертвоприношение. Эта формулировка яснее и естественнее буквального «жертвуют».
- source_word: δαιμονίοις
  choice: бесам
  rationale: В новозаветном употреблении δαιμόνιον обозначает злых духовных существ; «бесы» — традиционное и понятное русское соответствие.
- source_word: καὶ οὐ θεῷ
  choice: а не Богу
  rationale: Контекст противопоставляет бесов истинному Богу. Русское противительное «а не» естественно передаёт отрицательный контраст καὶ οὐ.
- source_word: οὐ θέλω δὲ
  choice: и я не хочу
  rationale: δέ здесь продолжает мысль с лёгким переходом; союз «и» сохраняет плавную связь, не усиливая противопоставление.
- source_word: κοινωνοὺς
  choice: причастниками
  rationale: κοινωνός обозначает того, кто участвует в чём-либо и разделяет сопричастность. «Причастники» сохраняет серьёзный религиозно-реляционный смысл контекста, не сводя его к простому общению.
- source_word: τῶν δαιμονίων
  choice: бесов
  rationale: Родительный падеж после «причастниками» естественно воспроизводит греческую конструкцию и выражает участие или связь, а не принадлежность.
- source_word: γίνεσθαι
  choice: становились
  rationale: γίνομαι указывает на вхождение в состояние; «становились» сохраняет этот оттенок, в отличие от простого «были».
theological_decisions:
- issue: Характер языческих жертвоприношений
  choice: Жертвы язычников приносятся бесам, а не Богу.
  alternative: Речь лишь о социальном значении языческих трапез или о «богах» как чистой метафоре.
  rationale: Прямое противопоставление «бесам, а не Богу» сохранено без смягчения и без добавочных предположений о природе этого действия.
- issue: Смысл κοινωνοὺς τῶν δαιμονίων
  choice: Реальная сопричастность бесам.
  alternative: Только социальное общение с идолопоклонниками либо полная сознательная преданность бесам.
  rationale: Контекст стихов 16–18 придаёт κοινωνός смысл действительного участия. «Причастники бесов» сохраняет вес этого предупреждения, не утверждая сверх текста полной преданности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Приносить в жертву» понятно широкому читателю; «причастники» сохраняет смысловую связь с темой участия в предшествующем контексте. Точка после «Нет» подчёркивает корректирующий ход мысли.
