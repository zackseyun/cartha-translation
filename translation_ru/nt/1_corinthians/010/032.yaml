  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: ru
  text: Не давайте повода к преткновению[a] ни иудеям, ни грекам[b], ни Божьей церкви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не становитесь причиной преткновения»; возможно также: «будьте неукоризненны».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «греки», вероятно, означает неиудеев вообще в окружении Павла; однако в греческом тексте буквально сказано «греки».
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: не давайте повода к преткновению
  rationale: Передаёт контекстуальный смысл отсутствия действий, из-за которых другие могут споткнуться или преткнуться, и естественно сочетается с перечислением групп в дательном падеже. В отличие от «будьте безупречны», сохраняет направленный на других смысл увещания.
- source_word: γίνεσθε
  choice: не давайте
  rationale: Настоящее повелительное наклонение передано как продолжающееся увещание. Вместо буквального «будьте/становитесь» выбран естественный русский оборот, выражающий ту же поведенческую установку.
- source_word: Ἰουδαίοις
  choice: иудеям
  rationale: Речь идёт об иудеях как религиозно-этнической группе, а не только о жителях Иудеи. «Иудеи» — точное и привычное обозначение в новозаветном контексте.
- source_word: Ἕλλησιν
  choice: грекам
  rationale: Сохранено прямое лексическое значение «греки». В данном контексте слово, вероятно, охватывает неиудеев вообще, но основной текст не подменяет конкретное обозначение более широким толкованием.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: Божьей церкви
  rationale: Передаёт общину верующих и сохраняет принадлежность Богу. Русская притяжательная конструкция естественнее буквального «церкви Бога» без изменения смысла.
theological_decisions:
- issue: Соотношение трёх названных групп
  choice: 'Сохранены три отдельные группы: иудеи, греки и Божья церковь.'
  alternative: Понимать «греков» как обобщённое обозначение всех язычников или раскрывать состав Божьей церкви в самом переводе.
  rationale: Стих прямо перечисляет три группы. Перевод сохраняет это перечисление, не решая дополнительно вопрос об их соотношении и не сводя увещание исключительно к миссионерской стратегии.
- issue: Характер «преткновения»
  choice: Поведение не должно давать другим повода к преткновению.
  alternative: Перевести как общее требование быть безупречными либо как запрет оскорблять чувства других.
  rationale: Контекст 1 Кор 10 указывает на влияние поступков на других; при этом «преткновение» сохраняет более широкий смысл, чем простая обида, и не утверждает непогрешимость человека.
translation_notes:
  register: Современный литературный русский с умеренно библейским, но понятным оборотом «повод к преткновению». Параллельное «ни… ни… ни…» сохраняет ритм и равный охват всех трёх групп.
