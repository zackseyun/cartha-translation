review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: события с поколением в пустыне имеют образцовое значение, записанное служит νουθεσία адресатов, а выражение τὰ τέλη τῶν αἰώνων сохранено во множественном числе. Однако «до которых дошли концы веков» меняет образную направленность εἰς οὓς ... κατήντηκεν: в греческом именно «концы веков» достигли адресатов. «С ними» допустимо, но «случалось с ними» точнее передаёт συνέβαινεν, чем нейтральное «происходило с ними».'
  naturalness: '«Всё это происходило с ними как примеры» звучит синтаксически шероховато: обстоятельство «как примеры» при таком построении воспринимается не вполне естественно. «Случалось с ними в качестве примеров» — современное литературное и ясное решение. «К которым пришли концы веков» сохраняет необычный, но намеренный библейский образ и читается естественнее, чем «до которых дошли».'
  terminology: «Вразумление» уместно для νουθεσία, хотя несколько книжно; оно соответствует умеренно возвышенному регистру и сопровождено полезной сноской. «Концы веков» правильно сохраняет оба греческих множественных числа. В сноске к τυπικῶς «прообразы» допустимо как альтернатива; полезно также назвать «типологически», не делая этот технический вариант основным текстом.
