  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: ru
  text: Всё это случалось с ними в качестве примеров, а записано было для нашего вразумления — для нас, к которым пришли концы веков[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Буквально: «концы веков»; необычное множественное число сохраняет выражение Павла о ходе Божьего замысла в истории.'
    reason: literal_rendering
lexical_decisions:
- source_word: τυπικῶς
  choice: как примеры
  rationale: Передаёт события как образцы, имеющие наставительное значение для последующих верующих; технические варианты вынесены в сноску.
- source_word: συνέβαινεν
  choice: происходило
  rationale: Несовершенный вид естественно передаёт греческий имперфект и охватывает ряд упомянутых событий.
- source_word: ἐκείνοις
  choice: с ними
  rationale: Местоимение указывает на ранее упомянутое поколение израильтян в пустыне.
- source_word: ἐγράφη
  choice: было написано
  rationale: Безличная форма сохраняет единственное число греческого глагола и естественно относится ко всему записанному повествованию.
- source_word: πρὸς νουθεσίαν
  choice: для нашего вразумления
  rationale: «Вразумление» сочетает наставительный и предостерегающий оттенки νουθεσία, оставаясь уместным в современном литературном русском.
- source_word: εἰς οὓς
  choice: для нас, до которых
  rationale: Повтор «для нас» проясняет соотнесение местоимения с верующими, а «до которых» сохраняет направительное значение εἰς.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: концы веков
  rationale: Сохранено необычное двойное множественное число греческого выражения, чтобы не сглаживать его богословскую напряжённость.
- source_word: κατήντηκεν
  choice: дошли
  rationale: Передаёт достижение конечной точки; форма совершенного вида выражает совершившееся прибытие с актуальным для адресатов результатом.
theological_decisions:
- issue: Эсхатологическое выражение τὰ τέλη τῶν αἰώνων
  choice: до которых дошли концы веков
  alternative: которые живут при завершении веков
  rationale: Основной текст сохраняет множественное число и образ достижения адресатов, не сводя выражение к единственному «концу века» и не истолковывая его как уже полностью завершившуюся историю.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Вразумление» выбрано как понятное, но ёмкое слово; необычное «концы веков» намеренно сохранено и пояснено сноской.
