  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: ru
  text: Итак[a], кто думает, что стоит, пусть остерегается, чтобы не упасть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поэтому».'
    reason: Лексическая альтернатива для ὥστε; оба варианта передают вывод из предшествующего контекста.
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Союз вводит вывод из предшествующих предостерегающих примеров. «Итак» естественно и кратко передаёт логическое следствие.
- source_word: ὁ δοκῶν
  choice: кто думает
  rationale: Субстантивированное причастие обозначает всякого человека, считающего себя стоящим; русская конструкция с «кто» естественно сохраняет обобщённо-личный смысл.
- source_word: ἑστάναι
  choice: что стоит
  rationale: Перфектный инфинитив выражает состояние устойчивого положения. Простое «стоит» сохраняет образ и не добавляет отсутствующего в тексте усиления «твёрдо».
- source_word: βλεπέτω
  choice: пусть остерегается
  rationale: Императив настоящего времени призывает к постоянной бдительности. «Пусть остерегается» ясно передаёт предупредительную силу глагола и звучит естественно по-русски.
- source_word: μὴ πέσῃ
  choice: как бы не упасть
  rationale: μή с аористным конъюнктивом после повелительной формы выражает предостережение от возможного падения. Русская конструкция сохраняет краткость и настоятельный тон.
theological_decisions:
- issue: Смысл «падения» в предостережении Павла
  choice: Сохранено общее «упасть» без уточнения характера падения.
  alternative: «впасть в грех»; «подвергнуться суду»; «отпасть»
  rationale: Контекст напоминает о неудачах Израиля и предостерегает от самоуверенности, однако πέσῃ само по себе не уточняет, идёт ли речь о нравственном падении, суде или отпадении. Образ оставлен широким, чтобы не снимать богословское напряжение текста.
- issue: Обобщённое обозначение человека в форме мужского рода
  choice: Использована конструкция «кто думает, что стоит», не требующая добавления местоимения.
  alternative: «тот, кто думает, что он стоит»; множественное число «те, кто думают»
  rationale: Греческая форма имеет единственное число и обобщённо-представительный смысл. Русское «кто» сохраняет единственное число и охватывает любого человека без стилистически тяжёлого повторения местоимения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясной предостерегающей интонацией. Сохранены образ стояния и неопределённость образа падения; архаичные «да блюдёт» и «дабы не пасть» не использованы.
