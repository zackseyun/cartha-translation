base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: ru
  text: Я говорю о совести — не о твоей собственной, а о совести другого человека.[a] Ведь почему моя свобода подвергается суду совести другого человека?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не собственную, а другого». В контексте имеется в виду: «не твою собственную, а другого человека».'
    reason: lexical_alternative
  - marker: b
    text: Этот риторический вопрос можно понимать либо как вопрос самого Павла, либо как приводимое им возражение; в греческом тексте смена говорящего явно не обозначена.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: совесть
  rationale: В контексте речь идёт о нравственном сознании, оценивающем поступки; «совесть» — точный и естественный русский эквивалент.
- source_word: δὲ λέγω
  choice: о которой я говорю
  rationale: Оборот вводит уточнение к предыдущему высказыванию; относительная конструкция естественно передаёт эту пояснительную функцию без добавления временного «теперь».
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: не твоя собственная, а другого человека
  rationale: Контекст указывает на противопоставление совести адресата совести другого человека. Русское «твоя» ясно выражает обращение к читателю, а примечание сохраняет формальную неоднозначность ἑαυτοῦ.
- source_word: ἱνατί γὰρ
  choice: В самом деле, почему
  rationale: «Почему» сохраняет риторический вопрос, а «в самом деле» естественно передаёт пояснительно-обосновывающую связь γάρ.
- source_word: ἐλευθερία
  choice: свобода
  rationale: Обычное современное соответствие, подходящее к теме допустимости поступков.
- source_word: κρίνεται
  choice: должна быть судима
  rationale: «Судима» сохраняет широкий смысл κρίνω — подвергаться суждению или оценке — без сужения до осуждения; модальная конструкция естественно передаёт риторическую силу вопроса.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: чужой совестью
  rationale: Краткое и естественное русское выражение для совести другого человека, выступающей субъектом суждения.
theological_decisions:
- issue: Референт притяжательного противопоставления
  choice: В основном тексте противопоставлены собственная совесть адресата и совесть другого человека.
  alternative: 'Формально: «не его собственную, а другого», поскольку ἑαυτοῦ имеет форму третьего лица.'
  rationale: Контекст обращения к коринфянам поддерживает «твою», однако примечание сохраняет грамматически более буквальный вариант.
- issue: Принадлежность риторического вопроса говорящему
  choice: Вопрос оставлен без кавычек как неразмеченный риторический вопрос.
  alternative: Его можно понимать как возражение собеседника, которое Павел приводит без явных греческих маркеров цитирования.
  rationale: Греческий текст не обозначает смену говорящего, поэтому перевод не разрешает эту интерпретационную напряжённость и отмечает её в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка перестроен ради естественного пояснения; ключевая неоднозначность вынесена в примечания.
