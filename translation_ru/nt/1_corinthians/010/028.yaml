  terminology: «Принесено в жертву», «жертвенное мясо» в примечании и «совесть» последовательно и точно передают ключевые понятия. Примечание a корректно отражает лексическую альтернативу, а примечание b не навязывает её основному тексту и опирается на прямое пояснение следующего стиха.
