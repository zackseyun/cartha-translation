  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: ru
  text: 'Но если кто-нибудь скажет вам: «Это было принесено в жертву»[a], то не ешьте — ради того, кто сообщил вам об этом, и ради совести[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это жертвенное мясо». Греческое прилагательное обозначает нечто принесённое в жертву.'
    reason: lexical_alternative
  - marker: b
    text: То есть ради совести другого человека, а не вашей собственной; см. следующий стих.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: Но если кто-нибудь скажет вам
  rationale: Условная конструкция передана естественно для современного русского языка; δέ обозначает противопоставление предыдущему рассуждению, а τις сохраняет неопределённость.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: Это было принесено в жертву
  rationale: ἱερόθυτος обозначает нечто принесённое в жертву. Такая формулировка не добавляет отсутствующее в самом слове указание на идола и естественно передаёт смысл греческого предикативного прилагательного.
- source_word: μὴ ἐσθίετε
  choice: не ешьте
  rationale: Запрет с μή и императивом настоящего времени передан прямой отрицательной формой повелительного наклонения; объект ясен из контекста.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: ради того, кто сообщил вам об этом
  rationale: διά с винительным выражает основание или уважение к интересам другого человека; μηνύω здесь означает сообщить или открыть сведения.
- source_word: καὶ τὴν συνείδησιν
  choice: и ради совести
  rationale: Эллиптическое сочетание передано с повтором «ради», чтобы ясно связать его с предыдущей причиной, не уточняя в основном тексте, чья именно совесть имеется в виду.
theological_decisions:
- issue: Чья совесть подразумевается в τὴν συνείδησιν
  choice: В основном тексте принадлежность совести не уточняется; примечание указывает на совесть сообщившего.
  alternative: 'Явно перевести: «ради его совести» либо понять речь как совесть самого едящего.'
  rationale: 'Сам стих грамматически не называет обладателя совести, тогда как следующий стих поясняет: «не свою, а другого». Сжатость и последовательность мысли Павла сохранены в тексте, а ближайший контекст отражён в примечании.'
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной и достойной формулировкой. Частица «то» естественно оформляет условную конструкцию, а тире подчёркивает основание запрета. Сохранена присущая стиху краткость и не внесено уточнение «идолу», отсутствующее в данном греческом словосочетании.
