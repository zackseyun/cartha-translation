    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: всё, что продаётся
  rationale: Субстантивированная конструкция среднего рода означает всё продаваемое; этот вариант естественен по-русски и сохраняет всеохватность выражения.
- source_word: ἐν μακέλλῳ
  choice: на мясном рынке
  rationale: μάκελλον обозначает место продажи мяса, а не рынок вообще; формулировка также сохраняет связь контекста с мясом, которое могло прежде участвовать в языческом жертвоприношении.
- source_word: ἐσθίετε
  choice: Ешьте
  rationale: Настоящее повелительное наклонение, второе лицо множественного числа. Прямое повеление естественно передаёт значение формы; возможный обычный или продолжающийся характер действия ясен из контекста.
- source_word: μηδὲν ἀνακρίνοντες
  choice: ничего не выясняя
  rationale: ἀνακρίνω может означать расспрашивать, исследовать или выяснять. В данном контексте речь идёт о том, чтобы не выяснять происхождение мяса; перевод сохраняет эту широту лучше, чем более узкое «не задавая вопросов».
- source_word: διὰ τὴν συνείδησιν
  choice: ради совести
  rationale: διά с винительным падежом здесь передаёт основание или мотив. Краткая русская формулировка не уточняет, чья именно совесть имеется в виду, поскольку сам стих этого не определяет.
theological_decisions:
- issue: К кому относится «совесть»
  choice: Передать как «ради совести», не добавляя притяжательного местоимения.
  alternative: «ради вашей совести» или «ради совести другого человека»
  rationale: В греческом тексте стоит определённый артикль, но нет явного указания на обладателя совести. Последующий контекст помогает обсуждать референта, однако в этом стихе неоднозначность следует сохранить.
translation_notes:
  register: Современный литературный русский язык; повеление передано прямо и ясно. «Мясной рынок» конкретизирует историческую обстановку без архаизации, а «ради совести» сохраняет лаконичность и неоднозначность оригинала.
