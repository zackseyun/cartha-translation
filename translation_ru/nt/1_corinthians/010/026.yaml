  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: ru
  text: Ведь Господу принадлежит земля и всё, что её наполняет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Цитата из Псалма 23:1 (24:1 по еврейской нумерации). Более буквально: «Господня земля и всё, что её наполняет».'
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: Господу принадлежит
  rationale: Родительный падеж τοῦ κυρίου выражает принадлежность. Русская конструкция с глаголом «принадлежит» ясно и естественно передаёт этот смысл, причём относится и к земле, и ко всему, что её наполняет.
- source_word: γάρ
  choice: ведь
  rationale: Частица γάρ вводит основание предшествующего утверждения. «Ведь» естественно передаёт пояснительно-обосновывающую связь в современном русском языке.
- source_word: γῆ
  choice: земля
  rationale: В цитате из псалма в сочетании с «всем, что её наполняет» слово обозначает землю в широком, мировом смысле, а не отдельную страну или территорию.
- source_word: πλήρωμα
  choice: всё, что её наполняет
  rationale: Здесь πλήρωμα обозначает совокупность всего находящегося на земле. Такой перевод понятнее современному читателю, чем буквальная «полнота», и сохраняет образ наполненной земли.
- source_word: αὐτῆς
  choice: её
  rationale: Местоимение женского рода относится к γῆ («земля»); русское «её» естественно сохраняет эту связь.
theological_decisions:
- issue: Передача κύριος в цитате из Псалма с богословским значением
  choice: Господь
  alternative: Владыка
  rationale: «Господь» соответствует обычному новозаветному употреблению κύριος и сохраняет узнаваемую связь с текстом Псалма, не добавляя в греческий текст особого типографического обозначения Божьего имени.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов перестроен ради естественности и ясного выражения принадлежности; образ «наполняет» сохранён.
