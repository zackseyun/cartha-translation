  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: ru
  text: Или мы вызываем у Господа ревность? Разве мы сильнее Его?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: хотим вызвать … ревность
  rationale: Глагол означает «возбуждать ревность, вызывать ревность». Форма настоящего времени передаёт совершаемое действие, а вопросительный контекст — предостережение о том, к чему ведёт участие в идольской трапезе.
- source_word: τὸν κύριον
  choice: у Господа
  rationale: В конструкции с «вызвать ревность» естественное русское управление требует родительного падежа с предлогом «у»; определённое обозначение κύριος передано традиционным «Господь».
- source_word: μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν
  choice: Разве мы сильнее Его?
  rationale: Частица μή предполагает отрицательный ответ. Сжатый риторический вопрос естественно передаёт греческую конструкцию и сохраняет её предостерегающую силу.
theological_decisions:
- issue: Ревность Господа
  choice: Сохранить прямое выражение «вызвать у Господа ревность»
  alternative: «разгневать Господа»
  rationale: παραζηλόω прямо обозначает возбуждение ревности и в контексте идолопоклонства отсылает к библейскому языку исключительной верности Богу; обобщение до «разгневать» утратило бы эту связь.
- issue: Смысл второго вопроса
  choice: Передать как риторический вопрос с ожидаемым отрицательным ответом
  alternative: «Мы ведь не сильнее Его»
  rationale: Вопросительная форма оригинала сохраняется без превращения высказывания в утверждение, а русское «разве» ясно обозначает ожидаемый ответ «нет».
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
