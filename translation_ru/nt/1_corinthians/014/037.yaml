  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: ru
  text: Если кто считает себя пророком или духовным человеком, пусть признает, что то, что я пишу вам, — Господне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что я пишу вам, является повелением Господа». Буквально по-гречески: «то, что я пишу вам, — Господне»; слово «повеление» прямо в тексте отсутствует, но подразумевается по контексту.'
    reason: Сохраняет эллиптичность выражения κυρίου ἐστίν и указывает на его вероятный контекстуальный смысл, не подменяя буквальную формулировку.
lexical_decisions:
- source_word: δοκεῖ
  choice: считает себя
  rationale: В сочетании с εἶναι выражает самооценку или притязание человека; формулировка сохраняет возможный корректирующий оттенок.
- source_word: προφήτης
  choice: пророком
  rationale: Обычный и ясный эквивалент в контексте пророчества и духовных даров.
- source_word: πνευματικός
  choice: духовным человеком
  rationale: Субстантивированное прилагательное обозначает человека, считающего себя духовным или наделённым Духом; добавление слова «человеком» необходимо для естественного русского синтаксиса и не сужает значение до одного конкретного дара.
- source_word: ἐπιγινωσκέτω
  choice: пусть признает
  rationale: Настоящее повелительное наклонение требует признать и подтвердить авторитет написанного, а не просто узнать о нём.
- source_word: ἃ γράφω ὑμῖν
  choice: то, что я пишу вам
  rationale: Естественно передаёт относительную конструкцию и настоящее время греческого текста.
- source_word: κυρίου ἐστίν
  choice: — от Господа
  rationale: Краткая русская формулировка передаёт предикативный родительный падеж и сохраняет широту эллиптического греческого выражения, не вставляя в основной текст отсутствующее существительное «повеление».
theological_decisions:
- issue: Эллиптическое выражение κυρίου ἐστίν
  choice: «— от Господа» в основном тексте
  alternative: «является повелением Господа»; «принадлежит Господу»; «Господне»
  rationale: В греческом тексте буквально сказано «есть Господа / Господне», без существительного «повеление». Контекст указывает на обязательный авторитет наставления, однако основной перевод сохраняет подлинную грамматическую сжатость и смысловую широту; контекстуальное раскрытие дано в сноске.
- issue: Мужской род в τις … προφήτης … πνευματικός
  choice: 'Сохранить формы мужского рода: «кто считает себя пророком или духовным человеком»'
  alternative: Использовать гендерно-нейтральную описательную конструкцию
  rationale: Греческие формы стоят в мужском роде единственного числа и обобщённо относятся к любому человеку, заявляющему о таком статусе; русский оборот с «кто» естественно сохраняет эту грамматику.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный, наставительный и достойный. Формулировка понятна широкому читателю, при этом не устраняет намеренно сжатое выражение оригинала.
