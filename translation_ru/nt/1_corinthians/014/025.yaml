  source_fidelity: 'Основной смысл передан точно: τὰ κρυπτὰ τῆς καρδίας — «тайны его сердца», φανερὰ γίνεται — «становятся явными», πεσὼν ἐπὶ πρόσωπον — «пав ниц», προσκυνήσει τῷ θεῷ — «поклонится Богу», а ἐν ὑμῖν обоснованно передано как «среди вас» с сохранением альтернативы в сноске. Однако καὶ οὕτως имеет здесь прежде всего следственный оттенок («и потому/и так»), а не только временной «и тогда». Кроме того, ἀπαγγέλλων — причастие, описывающее сопровождающее признание; отдельное будущее «и провозгласит» несколько ослабляет эту связь и придаёт глаголу излишне публично-ораторский оттенок.'
