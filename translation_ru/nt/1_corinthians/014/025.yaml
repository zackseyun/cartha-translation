  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: ru
  text: 'тайны его сердца становятся явными, и потому он, пав ниц, поклонится Богу, заявляя: «Поистине, Бог среди вас!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поистине, Бог в вас».'
    reason: Греческое ἐν ὑμῖν может означать как присутствие среди собравшихся, так и пребывание в них.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: тайны
  rationale: Субстантивированное прилагательное во множественном числе обозначает скрытое во внутреннем мире человека. «Тайны» естественно звучит по-русски и соответствует контексту обнаружения сокровенного.
- source_word: τῆς καρδίας αὐτοῦ
  choice: его сердца
  rationale: «Сердце» сохраняет библейское обозначение внутреннего мира, мыслей и побуждений человека, не подменяя его толкованием.
- source_word: φανερὰ γίνεται
  choice: становятся явными
  rationale: Передаёт переход скрытого в явное и сохраняет смысл γίνεται, не сводя выражение к более интерпретирующему пассиву «открываются».
- source_word: καὶ οὕτως
  choice: и тогда
  rationale: Естественно передаёт связь между обнаружением сокровенного и последующей реакцией человека; в данном контексте сочетает следственное и последовательное значение.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: пав ниц
  rationale: Устойчивое и достоинственное русское выражение для падения лицом вниз в знак поклонения.
- source_word: προσκυνήσει τῷ θεῷ
  choice: поклонится Богу
  rationale: Точно обозначает религиозное поклонение, направленное Богу; телесная поза уже выражена словами «пав ниц».
- source_word: ἀπαγγέλλων
  choice: провозгласит
  rationale: Передаёт открытое и торжественное высказывание признания. Русская личная форма естественно соединена с однородным будущим действием, сохраняя смысл греческого причастия.
- source_word: Ὄντως
  choice: поистине
  rationale: Передаёт усиленное подтверждение истинности вывода и соответствует возвышенному, но понятному регистру.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В контексте собравшейся общины выражение прежде всего указывает на присутствие Бога посреди неё. Возможное буквальное понимание «в вас» сохранено в сноске.
theological_decisions:
- issue: Значение ἐν ὑμῖν в заключительном признании
  choice: среди вас
  alternative: в вас
  rationale: Ближайший контекст описывает собрание церкви и признание Божьего присутствия в общине через происходящее в ней. Греческое выражение допускает также значение «в вас», поэтому эта богословски значимая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Пав ниц» и «поистине» сохраняют достоинство сцены, оставаясь понятными широкому читателю.
