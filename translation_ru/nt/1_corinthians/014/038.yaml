base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/038.yaml
  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: ru
  text: Но если кто этого не признаёт[b], тот не признан[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «если же кто не знает, пусть не знает». В принятом здесь тексте: «если кто не признаёт, тот не признан».'
    reason: textual_variant
  - marker: b
    text: 'Или: «не признаёт… не признаётся». В греческом тексте один и тот же глагол употреблён сначала в действительном, а затем в страдательном залоге, создавая словесный параллелизм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: если
  rationale: Обычный русский условный союз, не добавляющий утверждения об истинности условия.
- source_word: δέ
  choice: но
  rationale: Передаёт противопоставление предыдущему призыву признать сказанное Павлом как повеление Господа.
- source_word: τις
  choice: кто
  rationale: Естественно передаёт неопределённое и обобщённое указание на любого человека в конструкции «если кто».
- source_word: ἀγνοεῖ
  choice: не признаёт
  rationale: В контексте ст. 37 речь идёт не просто о незнании, а о непризнании апостольского наставления. Дополнение «этого» восстановлено из ближайшего контекста.
- source_word: ἀγνοεῖται
  choice: не признан
  rationale: Пассивная форма того же греческого глагола передана тем же русским глаголом, чтобы сохранить намеренный словесный параллелизм и не уточнять не названного в тексте деятеля.
theological_decisions:
- issue: Смысл пассивной формы ἀγνοεῖται
  choice: «тот не признан» — ответное или судебное непризнание человека, который сам не признаёт апостольского наставления
  alternative: «тот неизвестен»; согласно иному варианту текста — «пусть остаётся в неведении»
  rationale: В принятом тексте SBLGNT стоит пассивный индикатив, а не повелительное наклонение. Перевод сохраняет грамматическую форму, взаимную риторическую связь двух форм одного глагола и не определяет сверх текста, кем именно человек не признан — общиной, Богом или обоими.
translation_notes:
  register: Современный литературный русский язык; краткая, строгая формулировка сохраняет условную конструкцию и риторический повтор оригинала. «Этого» естественно восполняет подразумеваемый объект из ст. 37, не сужая его до одной частной формулировки.
