lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Сохраняет разделительный союз и вводит резкий риторический вопрос без добавления отсутствующего в греческом восклицания.
- source_word: ἀφ’ ὑμῶν
  choice: от вас
  rationale: Прямо передаёт значение источника или исходной точки у ἀπό с родительным падежом.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Естественное и весомое русское соответствие, сохраняющее широту выражения и не сводящее его исключительно к Евангелию или пророчеству.
- source_word: ἐξῆλθεν
  choice: вышло
  rationale: Сохраняет образ движения от источника и хорошо сочетается с «от вас» в риторическом вопросе.
- source_word: εἰς ὑμᾶς μόνους
  choice: только до вас
  rationale: 'Передаёт направленность и исключительность: коринфяне не являются единственными получателями Божьего слова.'
- source_word: κατήντησεν
  choice: дошло
  rationale: Естественно выражает значение «достигло, прибыло» и сохраняет параллельный образ распространения слова.
theological_decisions:
- issue: К чему относится выражение «слово Божье»
  choice: Оставлено широкое выражение «слово Божье» без уточнения референта.
  alternative: «евангельская весть» или «пророческое слово в собрании»
  rationale: В контексте Павел обличает притязание коринфян быть источником или единственными получателями авторитетной Божьей вести. Греческое выражение допускает более широкое понимание, поэтому перевод не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая симметричная конструкция сохраняет резкость двух риторических вопросов. Форма «Божье» естественна для широкого круга современных читателей и остаётся достойной по регистру.
