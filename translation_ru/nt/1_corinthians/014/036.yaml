  source_fidelity: 'Первый вопрос точно передаёт ἀφ’ ὑμῶν ... ἐξῆλθεν: «от вас вышло слово Божье». Во втором вопросе нужно яснее показать, что μόνους относится к адресатам слова («вас одних»), а не к пределу его распространения. «Достигло только вас» непосредственно передаёт εἰς ὑμᾶς μόνους κατήντησεν.'
  naturalness: '«Или от вас вышло слово Божье, или только до вас оно дошло?» в целом понятно, но оборот «только до вас дошло» допускает менее точное прочтение: слово дошло лишь до Коринфа и не пошло дальше. «Или оно достигло только вас?» современно, литературно и сохраняет резкость риторического вопроса.'
  terminology: «Слово Божье» — естественное и достаточно широкое соответствие ὁ λόγος τοῦ θεοῦ; оно не навязывает более узкое понимание как «Евангелие» или как конкретное пророчество. Капитализация «Божье» соответствует обычному русскому библейскому употреблению.
