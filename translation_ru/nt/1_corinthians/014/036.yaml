    rationale: 'В греческом μόνους характеризует ὑμᾶς: коринфяне мыслится как единственные получатели. Формула «только до вас оно дошло» может также восприниматься как указание на географический предел, до которого слово дошло. Перестановка с глаголом «достигло» снимает эту побочную неоднозначность без изменения смысла.'
