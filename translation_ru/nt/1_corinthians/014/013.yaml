lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и сохраняет явную логическую связь.
- source_word: ὁ λαλῶν
  choice: тот, кто говорит
  rationale: Субстантивированное причастие настоящего времени обозначает всякого человека, совершающего это действие; конструкция естественна для современного русского языка.
- source_word: γλώσσῃ
  choice: на языке
  rationale: Сохраняет единственное число греческого слова и принятую в этой главе лексику, не решая заранее, идёт ли речь об обычном человеческом языке, экстатической речи или более широкой категории.
- source_word: προσευχέσθω
  choice: пусть молится
  rationale: Точно и естественно передаёт повелительное наклонение третьего лица с продолжающимся или обычным характером действия.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель или желаемый результат молитвы, не устраняя возможного оттенка содержания просьбы.
- source_word: διερμηνεύῃ
  choice: истолковывать
  rationale: В контексте главы означает делать речь понятной для других; «переводить» было бы уже по смыслу, а «объяснять» — шире.
theological_decisions:
- issue: Значение γλώσσῃ в контексте 1 Коринфянам 12–14
  choice: на языке
  alternative: на ином языке; на языках
  rationale: Так сохраняются образ речи и терминологическая связь внутри главы без преждевременного решения вопроса о природе этого дара.
- issue: Подразумеваемый субъект при διερμηνεύῃ
  choice: не выражать местоимением
  alternative: чтобы он мог истолковывать
  rationale: Русская грамматика позволяет сохранить единичного представительного субъекта без ненужного акцента на мужском роде; по смыслу речь идёт о любом говорящем на языке.
- issue: Цель молитвы
  choice: чтобы истолковывать
  alternative: о даре истолкования
  rationale: Перевод следует форме греческого текста и не уточняет, просит ли человек о способности, возможности или конкретном случае истолкования.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. «Пусть молится» сохраняет силу наставления, а «истолковывать» поддерживает терминологию главы.
