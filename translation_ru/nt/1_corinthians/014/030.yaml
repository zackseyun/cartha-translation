lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Но если
  rationale: Передаёт условие и лёгкое противопоставление или переход к следующему случаю в наставлении.
- source_word: ἄλλῳ
  choice: другому
  rationale: Дательный падеж указывает на другого участника собрания, отличного от говорящего.
- source_word: ἀποκαλυφθῇ
  choice: будет что-то открыто
  rationale: Сохраняет пассивную форму и не называет прямо подразумеваемого деятеля; неопределённое «что-то» естественно восполняет объект русского предложения.
- source_word: καθημένῳ
  choice: сидящему
  rationale: Причастие согласовано с «другому» и сохраняет конкретный образ сидящего участника собрания.
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Сохраняет буквальную краткость греческого выражения; из контекста ясно, что речь идёт о говорившем первым.
- source_word: σιγάτω
  choice: пусть замолчит
  rationale: Передаёт повеление прекратить текущую речь, а не требование хранить постоянное молчание.
theological_decisions:
- issue: Характер откровения во время пророческой речи в собрании
  choice: «будет что-то открыто» без прямого указания источника откровения
  alternative: «другому будет дано откровение» или «Бог что-то откроет другому»
  rationale: Пассивная форма подразумевает откровение, однако сам стих не называет Бога действующим лицом. Формулировка сохраняет эту сдержанность и грамматическую неопределённость.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная формулировка. «Пусть замолчит» в данном контексте естественнее, чем буквальное «пусть молчит», поскольку речь идёт о прекращении уже идущей речи.
