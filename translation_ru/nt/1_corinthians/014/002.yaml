reference: 1 Corinthians 14:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: ru
  text: Ведь тот, кто говорит на языке, говорит не людям, а Богу, потому что никто его не понимает[a]; напротив, он говорит тайны в Духе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто не слышит». Греческий глагол может означать как физическое восприятие речи, так и, по смыслу контекста, её понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорит тайны духом». Греческое выражение может относиться либо к Святому Духу, либо к духу самого говорящего.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: тот, кто говорит
  rationale: Субстантивированное причастие имеет обобщённое значение; оборот естественен по-русски и не уточняет пол сверх необходимого.
- source_word: γλώσσῃ
  choice: на языке
  rationale: Сохраняется единственное число и непосредственное обозначение речи на языке без уточнения, идёт ли речь об известном человеческом языке или об иной форме речи.
- source_word: ἀνθρώποις
  choice: людям
  rationale: Форма имеет обобщённое, а не исключительно мужское значение.
- source_word: θεῷ
  choice: Богу
  rationale: Прямое и естественное соответствие дательному дополнению при глаголе «говорит».
- source_word: ἀκούει
  choice: понимает
  rationale: Хотя основное значение глагола — «слышит», в контексте противопоставлена понятная людям речь непонятной; «понимает» передаёт подразумеваемый смысл. Буквальная возможность отмечена в сноске.
- source_word: δὲ
  choice: напротив
  rationale: Союз вводит контраст с предшествующим утверждением; «напротив» ясно и естественно выражает эту связь.
- source_word: μυστήρια
  choice: тайны
  rationale: Сохраняется богословская ёмкость павловского слова без истолковывающего перифраза вроде «сокрытые истины».
- source_word: πνεύματι
  choice: в Духе
  rationale: Так передаётся вероятная отсылка к Святому Духу и сохраняется предложная форма, не сводящая выражение однозначно к значению средства действия. Возможная отсылка к духу говорящего указана в сноске.
theological_decisions:
- issue: К кому или чему относится πνεύματι
  choice: «в Духе» в основном тексте
  alternative: «духом» или «в своём духе», если имеется в виду дух говорящего
  rationale: Греческая форма допускает отсылку как к Святому Духу, так и к духу самого говорящего. Русская орфография вынуждает обозначить предпочтительное понимание прописной буквой, поэтому подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены единственное число «на языке», слово «тайны» и богословская неоднозначность заключительной фразы.
