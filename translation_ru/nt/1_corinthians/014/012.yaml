base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: ru
  text: 'Так и вы: поскольку вы ревностно стремитесь к духовным дарам[a], стремитесь изобиловать ради созидания церкви.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. πνευμάτων: «духов», «духовных [вещей]»; в данном контексте, вероятно, имеются в виду духовные дары или проявления Духа.'
    reason: Сохраняет грамматическую и смысловую неоднозначность греческого слова, одновременно поясняя наиболее вероятное контекстуальное понимание.
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так и вы
  rationale: Передаёт связь с предшествующим сравнением и сохраняет краткую выводную формулу греческого текста.
- source_word: ἐπεὶ
  choice: поскольку
  rationale: Естественно вводит основание последующего призыва и сохраняет причинный оттенок.
- source_word: ζηλωταί ἐστε
  choice: вы ревностно стремитесь
  rationale: Передаёт значение существительного ζηλωταί — людей, отличающихся сильным рвением и желанием чего-либо, — естественным современным русским выражением.
- source_word: πνευμάτων
  choice: к духовным дарам[a]
  rationale: В контексте 1 Кор 12–14 речь идёт о дарах или проявлениях Духа. Добавление «дарам» делает сжатое греческое выражение понятным по-русски, а буквальная неоднозначность сохранена в сноске.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: ради созидания церкви
  rationale: Сохраняет павловскую метафору строительства общины; «ради» ясно выражает направленность и цель, заданную πρός.
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: стремитесь изобиловать ими
  rationale: Сохраняет побуждение к целенаправленному стремлению и образ изобилия в περισσεύω. Местоимение «ими» восполняет подразумеваемый из контекста объект, необходимый для естественного русского выражения.
theological_decisions:
- issue: Значение πνευμάτων
  choice: духовные дары
  alternative: духи; духовные проявления
  rationale: Ближайший контекст посвящён дарам и проявлениям Духа, особенно пророчеству и языкам. Основной текст передаёт вероятный контекстуальный смысл, а необычная и более широкая буквальная форма отмечена в сноске, чтобы не скрывать неоднозначность.
- issue: Подразумеваемый объект при περισσεύητε
  choice: изобиловать ими
  alternative: изобиловать; преуспевать
  rationale: 'В греческом объект прямо не назван, однако русское «изобиловать» обычно требует уточнения. Местоимение связывает призыв с упомянутыми духовными дарами, не утверждая, что сами дары являются конечной целью: их употребление направлено на созидание церкви.'
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным звучанием. Сохранены повтор «стремитесь» и метафора «созидания», отражающие структуру и лексику греческого текста.
