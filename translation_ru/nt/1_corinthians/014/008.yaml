  text: καὶ γὰρ ἐὰν ἄδηλον ⸂φωνὴν σάλπιγξ⸃ δῷ, τίς παρασκευάσεται εἰς πόλεμον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: ru
  text: Ведь если труба издаёт неясный звук[a], кто станет готовиться к битве[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неразличимый звук».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к войне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь
  rationale: Сочетание вводит пояснение и усиливает связь с предыдущим рассуждением; «ведь» естественно передаёт эту функцию по-русски.
- source_word: ἐὰν
  choice: если
  rationale: Вводит условное придаточное с сослагательным наклонением; обычное русское соответствие — «если».
- source_word: ἄδηλον
  choice: неясный
  rationale: Означает неясный, неразличимый или неопределённый; «неясный» естественно выражает непригодность сигнала для понимания.
- source_word: φωνὴν
  choice: звук
  rationale: В сочетании с трубой φωνή обозначает издаваемый ею звук, а не голос.
- source_word: σάλπιγξ
  choice: труба
  rationale: Речь идёт о сигнальном духовом инструменте; безартиклевое греческое существительное имеет здесь обобщающий смысл, естественно передаваемый по-русски словом «труба».
- source_word: δῷ
  choice: издаёт
  rationale: Буквально «даёт», но русское сочетание «издаёт звук» современно и идиоматично, сохраняя образ действия инструмента.
- source_word: τίς
  choice: кто
  rationale: Прямо передаёт вопросительное местоимение в риторическом вопросе.
- source_word: παρασκευάσεται
  choice: станет готовиться
  rationale: Будущая форма среднего залога указывает на подготовку самого человека; «станет готовиться» сохраняет возвратный смысл и естественно звучит по-русски.
- source_word: εἰς πόλεμον
  choice: к битве
  rationale: Буквально выражение может означать «к войне», но в контексте трубного сигнала непосредственная подготовка к сражению естественно передаётся как «к битве».
