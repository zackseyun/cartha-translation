    issue: 'Неестественная передача τῷ νοΐ μου: «своим умом».'
    rationale: В сочетании «сказать пять слов своим умом» русский оборот может означать, что слова произносятся лишь мысленно. Контекст требует понятной, осмысленной публичной речи.
  - severity: medium
    issue: Сноска добавляет слово «ином».
    rationale: В ἐν γλώσσῃ нет определения «иной». Добавление создаёт более узкое значение, чем допускает исходный текст.
  - severity: low
    issue: «В церкви» допускает локальное значение здания.
    rationale: ἐν ἐκκλησίᾳ относится к собранию христианской общины; «на церковном собрании» яснее передаёт этот аспект в современном русском.
