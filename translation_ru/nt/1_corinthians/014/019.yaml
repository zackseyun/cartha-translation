  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: ru
  text: Но на церковном собрании я предпочитаю произнести пять слов с ясным пониманием, чтобы наставить и других, нежели десять тысяч слов на языке[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на языке [народа]». Греческое слово может означать как орган речи, так и язык; здесь оно относится к речи, обсуждаемой в 1 Коринфянам 12–14.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: в церкви
  rationale: Здесь слово обозначает собравшуюся для богослужения христианскую общину; «в церкви» естественно звучит по-русски и сохраняет церковно-общинный смысл.
- source_word: θέλω
  choice: предпочитаю
  rationale: Буквально «хочу», но конструкция с последующим ἢ выражает сопоставление и предпочтение.
- source_word: πέντε λόγους
  choice: пять слов
  rationale: Конкретное числовое выражение сохраняет резкий риторический контраст с «десятью тысячами слов».
- source_word: τῷ νοΐ μου
  choice: своим умом
  rationale: Формально передаёт νοῦς и сохраняет противопоставление осмысленной речи речи на языке без истолкования.
- source_word: λαλῆσαι
  choice: сказать
  rationale: В сочетании с числительным и словом λόγους русское «сказать пять слов» звучит естественнее, чем «говорить пять слов».
- source_word: ἵνα καὶ ἄλλους κατηχήσω
  choice: чтобы наставить и других
  rationale: κατηχέω означает устно наставлять; частица καί перед ἄλλους передана словом «и».
- source_word: μυρίους λόγους
  choice: десять тысяч слов
  rationale: Сохранено буквальное числовое значение и яркое противопоставление пяти словам.
- source_word: ἐν γλώσσῃ
  choice: на языке
  rationale: Русское выражение допускает как значение языка речи, так и специальное употребление в контексте 1 Кор 12–14, не определяя заранее природу явления.
theological_decisions:
- issue: Значение γλῶσσα в 1 Коринфянам 12–14
  choice: на языке
  alternative: на ином языке; языком; в говорении на языках
  rationale: 'Выбранная формулировка сохраняет лексическую и богословскую неоднозначность: текст не сводится ни к обычному иностранному языку, ни к специально обозначенной экстатической речи.'
- issue: Смысл τῷ νοΐ μου
  choice: своим умом
  alternative: осмысленно; с пониманием
  rationale: Более формальная передача сохраняет антропологический термин Павла и не заменяет его истолковывающей парафразой.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет Павлов контраст между пятью и десятью тысячами слов; спорная природа речи «на языке» не конкретизирована.
