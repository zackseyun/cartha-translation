  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: ru
  text: Ведь Бог — не Бог беспорядка, а мира[a], как во всех церквах святых.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог — не Бог неразберихи, а мира».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как это бывает во всех церквах Божьего святого народа». Некоторые присоединяют слова «как во всех церквах святых» к следующему стиху, а не к этому.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: беспорядка
  rationale: В контексте упорядоченного богослужебного собрания слово обозначает беспорядок, неразбериху или нарушение порядка; «беспорядок» сохраняет широту смысла и ясно противопоставляется миру.
- source_word: εἰρήνης
  choice: мира
  rationale: Обычный и естественный эквивалент εἰρήνη; здесь речь о мире и согласованном порядке в общине, но перевод не расширяет значение пояснительной добавкой.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Определённое личное наименование естественно передаётся по-русски без артикля.
- source_word: γάρ
  choice: Ведь
  rationale: Передаёт обоснование предшествующего наставления и естественно звучит в современном русском тексте.
- source_word: ὡς
  choice: как
  rationale: Сохраняет краткость и синтаксическую неоднозначность греческой сравнительной конструкции.
- source_word: ἐκκλησίαις
  choice: церквах
  rationale: Устоявшееся обозначение местных христианских общин в новозаветном контексте.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Сохраняет обычное для Павла наименование верующих и высокий, но понятный библейский регистр.
theological_decisions:
- issue: Связь оборота ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων
  choice: В основном тексте оборот присоединён к стиху 33
  alternative: 'Его можно присоединить к следующему стиху: «Как во всех церквах святых, женщины…»'
  rationale: Пунктуация SBLGNT связывает оборот со стихом 33, однако древний греческий текст не устраняет синтаксической неоднозначности; альтернативное членение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Конструкция «Бог — не Бог…» формально сохраняет греческое противопоставление; «ведь» естественно передаёт γάρ. Все примечания отмечены в основном тексте.
