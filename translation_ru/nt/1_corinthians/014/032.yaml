  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: ru
  text: И духи пророков подчиняются пророкам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «духи пророков» может относиться к пророческим побуждениям или к духовной деятельности, связанной с пророками; при таком понимании подчёркивается, что во время пророчества они сохраняют самообладание.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, вводящий дополнительное обоснование в ходе рассуждения Павла.
- source_word: πνεύματα
  choice: духи
  rationale: Сохраняет прямое значение множественного числа и намеренно не сводит выражение ни к пророческим речам, ни к духовным дарам.
- source_word: προφητῶν
  choice: пророков
  rationale: Родительный падеж передаёт связь духов с пророками, не уточняя сверх текста характер этой связи.
- source_word: προφήταις
  choice: пророкам
  rationale: Дательный падеж при глаголе подчинения естественно обозначает тех, кому подчиняются.
- source_word: ὑποτάσσεται
  choice: подчиняются
  rationale: При среднем/страдательном глаголе в единственном числе и подлежащем среднего рода во множественном числе русский перевод требует множественного числа; «подчиняются» естественно передаёт состояние подчинённости и возможность самоконтроля, не добавляя слова «контролируются».
theological_decisions:
- issue: Смысл выражения «духи пророков» и ответственность пророков за порядок
  choice: В основном тексте сохранено буквальное и неоднозначное выражение «духи пророков»; контекст допускает понимание как пророческих побуждений или духовной деятельности, не лишающих пророков самообладания.
  alternative: Понимать речь как о человеческом духе каждого пророка, подчинённом другим пророкам, либо как о пророческих сообщениях, оцениваемых пророками.
  rationale: Контекст 1 Кор. 14:29–33 подчёркивает порядок при пророчестве, однако сама формулировка не позволяет безоговорочно заменить «духи» словами «побуждения», «дары» или «сообщения».
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и естественная формулировка. Повтор слова «пророков / пророкам» сохранён вслед за греческим текстом, поскольку он важен для смысла.
