id: 1CO.14.28
reference: 1 Corinthians 14:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: ru
  text: Если же нет истолкователя, пусть он молчит в церкви[a], а говорит самому себе и Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в собрании»; также возможно: «в общине».'
    reason: Лексема ἐκκλησία здесь обозначает собравшуюся христианскую общину, а не обязательно здание или учреждение.
lexical_decisions:
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: Если же нет
  rationale: Естественно передаёт условную конструкцию с сослагательным наклонением и сохраняет связующий, слегка контрастный оттенок δέ.
- source_word: διερμηνευτής
  choice: истолкователь
  rationale: Обозначает человека, который делает речь на ином языке понятной собранию. «Истолкователь» точно передаёт функцию и соответствует контексту 1 Кор 14; «переводчик» возможно, но может создавать более узкое современное представление о профессиональном переводе.
- source_word: σιγάτω
  choice: пусть он молчит
  rationale: Передаёт повелительное наклонение третьего лица без архаизма и сохраняет указание воздерживаться от публичной речи.
- source_word: ἐν ἐκκλησίᾳ
  choice: в церкви
  rationale: В контексте речь идёт о собравшейся христианской общине. «В церкви» естественно по-русски, а примечание сохраняет возможное значение «в собрании».
- source_word: ἑαυτῷ
  choice: самому себе
  rationale: Прямо передаёт возвратное местоимение и не добавляет отсутствующих в греческом тексте уточнений вроде «про себя» или «наедине».
- source_word: λαλείτω
  choice: пусть … говорит
  rationale: Нейтрально и естественно передаёт продолжающее повеление, сохраняя контраст с требованием молчать в собрании.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж естественно обозначает адресата речи; в русском глагол «говорить» также требует дательного падежа.
theological_decisions:
- issue: Пределы повеления молчать во время богослужебного собрания
  choice: Повеление запрещает обращённую к собранию речь на ином языке при отсутствии истолкователя, но сохраняет возможность говорить самому себе и Богу.
  alternative: Говорящий должен полностью прекратить всякую речь либо может продолжать слышимо обращаться к собранию.
  rationale: Противопоставление «пусть … молчит в церкви» и «пусть … говорит самому себе и Богу» ограничивает публичное выступление, но не объясняет способ или громкость непубличной речи. Перевод не разрешает эту неоднозначность добавочными словами.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «пусть он молчит … а говорит» сохраняет повелительную силу и греческое противопоставление. Маркер примечания помещён после «церкви», поскольку примечание относится к ἐν ἐκκλησίᾳ.
