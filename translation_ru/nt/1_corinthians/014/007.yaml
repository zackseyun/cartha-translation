    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: Даже
  rationale: Вводит наглядное сопоставление с неодушевлёнными инструментами и естественно передаёт усилительный оттенок в данном контексте.
- source_word: τὰ ἄψυχα φωνὴν διδόντα
  choice: неодушевлённые инструменты, издающие звук
  rationale: τὰ ἄψυχα буквально обозначает неодушевлённые предметы, но последующее уточнение прямо называет музыкальные инструменты; экспликация делает русский текст ясным, сохраняя противопоставление живой речи.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: свирель или кифара
  rationale: αὐλός обозначает древний духовой инструмент, а κιθάρα — древний струнный щипковый инструмент. Эти исторически уместные русские названия сохраняют различие инструментов.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: если они не издают различимых звуков
  rationale: διαστολή выражает различение, а φθόγγοι — отдельные звуки или тоны. Формулировка естественна по-русски и передаёт необходимость различимости музыкальных звуков.
- source_word: πῶς γνωσθήσεται
  choice: как можно будет распознать
  rationale: Будущий пассив γινώσκω здесь указывает на возможность узнать или распознать исполняемое; «распознать» хорошо соответствует музыкальному контексту.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: что играют на свирели или кифаре
  rationale: Субстантивированные пассивные причастия обозначают исполняемое на каждом инструменте. Русская конструкция передаёт смысл без тяжеловесного повтора.
