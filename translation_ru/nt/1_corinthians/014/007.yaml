  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: ru
  text: Даже неодушевлённые предметы, издающие звук, — будь то свирель или кифара[a], — если они не издают звуков, различающихся между собой, как можно будет распознать то, что играют на свирели или кифаре?
