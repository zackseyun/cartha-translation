  text: ὥστε, ἀδελφοί ⸀μου, ζηλοῦτε τὸ προφητεύειν, καὶ τὸ λαλεῖν ⸂μὴ κωλύετε γλώσσαις⸃·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: ru
  text: Итак, братья мои[a], ревностно стремитесь пророчествовать и не запрещайте говорить на языках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры мои». В греческом тексте буквально «братья мои»; это обращение может относиться ко всей общине, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Союз подводит итог предшествующему рассуждению и вводит вытекающее из него наставление.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохранены мужской род греческого обращения и притяжательное местоимение; в данном контексте обращение, вероятно, относится ко всей общине, что поясняется в сноске.
- source_word: ζηλοῦτε
  choice: ревностно стремитесь
  rationale: Форма понимается как повелительное наклонение и выражает настойчивое, продолжающееся стремление; перевод передаёт как побуждение, так и оттенок усердия.
- source_word: τὸ προφητεύειν
  choice: пророчествовать
  rationale: Артиклированный инфинитив выступает объектом побуждения; русский инфинитив естественно передаёт эту конструкцию.
- source_word: μὴ κωλύετε
  choice: не запрещайте
  rationale: Отрицательная повелительная конструкция прямо запрещает препятствовать данной практике; «не запрещайте» точно и естественно в контексте установлений для собрания.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: говорить на языках
  rationale: Передаёт устойчивое обозначение обсуждаемой в главе практики, сохраняя формулировку с глаголом речи и множественным числом «языках».
theological_decisions:
- issue: Объём обращения ἀδελφοί в общине, состоящей из мужчин и женщин
  choice: братья мои
  alternative: братья и сёстры мои
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала, не исключая вероятного обращения ко всей общине; возможный инклюзивный смысл явно отмечен в сноске.
- issue: Соотношение пророчества и говорения на языках
  choice: Положительное повеление ревностно стремиться пророчествовать и запрет запрещать говорение на языках
  alternative: Переформулировать вторую часть как безусловное одобрение или как ограничение дара языков
  rationale: 'Перевод сохраняет различие в формулировках Павла: пророчество предписано как предмет ревностного стремления, тогда как говорение на языках не следует запрещать. Текст не усиливается до богословского вывода сверх сказанного.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и наставительным звучанием. Формулировка избегает архаизмов; «ревностно стремитесь» сохраняет интенсивность ζηλοῦτε, а «говорить на языках» соответствует привычной русской библейской терминологии.
