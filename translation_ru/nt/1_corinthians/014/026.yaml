  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: ru
  text: Итак, что же, братья[a]? Когда вы собираетесь вместе, у каждого есть псалом, есть наставление, есть откровение, есть речь на языке[b], есть истолкование. Пусть всё происходит ради созидания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «братья» здесь относится ко всей общине, включая женщин.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «язык». Греческое слово может обозначать язык или речь на языке; здесь формулировка сохраняет неоднозначность термина в рассуждении Павла.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: Итак, что же
  rationale: Сохраняет риторический переход к практическому выводу, не добавляя в основной текст отсутствующего в греческом глагола действия.
- source_word: ἀδελφοί
  choice: братья
  rationale: Передаёт грамматически мужское обращение; в данном обращении ко всей коринфской общине оно имеет представительный смысл, пояснённый в сноске.
- source_word: ὅταν συνέρχησθε
  choice: Когда вы собираетесь вместе
  rationale: Естественно передаёт повторяющуюся ситуацию собрания общины и временное значение конструкции с ὅταν.
- source_word: ἕκαστος
  choice: у каждого
  rationale: Передаёт распределительное значение и естественно вводит перечень того, что каждый приносит в собрание.
- source_word: ψαλμὸν
  choice: псалом
  rationale: Сохраняет конкретное обозначение песнопения, не расширяя его до общего «песня».
- source_word: διδαχὴν
  choice: наставление
  rationale: В контексте вклада в собрание звучит естественнее, чем более систематическое «учение», и передаёт смысл поучения.
- source_word: ἀποκάλυψιν
  choice: откровение
  rationale: Стандартно и прозрачно передаёт сообщение, открытое Богом в контексте собрания.
- source_word: γλῶσσαν
  choice: речь на языке
  rationale: По-русски простое «язык» после «есть» звучало бы как обладание языком; выбранная формулировка обозначает речевое явление, сохраняя слово «язык» и не определяя природу этой речи.
- source_word: ἑρμηνείαν
  choice: истолкование
  rationale: Соответствует ближайшему контексту, где речь на языке должна стать понятной собранию; не ограничивает значение только техническим переводом.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: Пусть всё происходит ради созидания
  rationale: Передаёт повелительный смысл и сохраняет метафору созидания общины без более узкого пояснения в основном тексте.
theological_decisions:
- issue: Представительное мужское обращение к общине
  choice: Сохранить «братья» в основном тексте и пояснить включение женщин в сноске.
  alternative: «братья и сёстры»
  rationale: Так сохраняется форма исходного текста, а её контекстуальный охват всей общины разъясняется без изменения обращения.
- issue: Значение γλῶσσα в 1 Коринфянам 12–14
  choice: «речь на языке»
  alternative: «иной язык» или «незнакомый язык»
  rationale: Выбор сохраняет термин Павла и не решает сверх текста, является ли речь известным человеческим языком, экстатической речью или более широкой категорией.
- issue: Цель даров в собрании
  choice: «ради созидания» без явного дополнения «общины»
  alternative: «для укрепления общины»
  rationale: Метафора οἰκοδομή сохранена, а подразумеваемый общинный объект не внесён непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор «есть» намеренно сохранён вслед за анафорой греческого текста. Термины «откровение», «истолкование» и «созидание» понятны в контексте и удерживают смысловые связи главы.
