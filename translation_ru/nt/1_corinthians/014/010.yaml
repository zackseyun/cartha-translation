lexical_decisions:
- source_word: τοσαῦτα εἰ τύχοι
  choice: пожалуй, множество
  rationale: Сочетание передаёт большое, точно не определённое число и смягчающий оборот εἰ τύχοι; такая формулировка естественна по-русски и не превращает высказывание в точный подсчёт.
- source_word: γένη
  choice: разных
  rationale: В сочетании с существительным «языков» значение «виды, разновидности» естественно выражается определением «разных».
- source_word: φωνῶν
  choice: языков
  rationale: φωνή допускает значения «звук», «голос» и «язык». В контексте рассуждения о понятной и непонятной речи «языков» ясно передаёт основной смысл, а более буквальная возможность сохранена в сноске.
- source_word: ἐν κόσμῳ
  choice: в мире
  rationale: Прямое и естественное соответствие выражению ἐν κόσμῳ.
- source_word: οὐδὲν ἄφωνον
  choice: ни один из них не лишён смысла
  rationale: Буквально ἄφωνος означает «безгласный, беззвучный», однако при понимании φωναί как языков фраза указывает на их смысловую значимость. Местоименная форма согласована с «языков»; буквальный образ отмечен в сноске.
