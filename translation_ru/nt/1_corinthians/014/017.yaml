  terminology: «Воздаёшь благодарение» — устойчивое литературное выражение для εὐχαριστεῖς и не требует добавлять подразумеваемого адресата. «Назидание» уместно в данном контексте и не навязывает конфессионального толкования; буквальный образ «не созидается» дан как альтернатива.
