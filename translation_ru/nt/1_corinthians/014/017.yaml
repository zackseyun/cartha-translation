base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: ru
  text: Ведь ты, конечно, хорошо воздаёшь благодарение, но другой не получает назидания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не созидается».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ μὲν
  choice: ты-то
  rationale: Частица «-то» естественно передаёт выделение подлежащего и подготавливает противопоставление с ἀλλά; единственное число местоимения сохранено.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» передаёт пояснительную связь с предшествующим рассуждением.
- source_word: καλῶς
  choice: хорошо
  rationale: Сохраняет прямую положительную оценку действия, не сужая её до значения «правильно».
- source_word: εὐχαριστεῖς
  choice: благодаришь Бога
  rationale: Глагол означает выражение благодарности; подразумеваемый адресат благодарения — Бог — назван для естественности и ясности современной русской фразы.
- source_word: ἀλλ’
  choice: но
  rationale: Передаёт прямое противопоставление между личным благодарением говорящего и отсутствием пользы для другого.
- source_word: ὁ ἕτερος
  choice: другой человек
  rationale: Обозначает другого участника собрания; слово «человек» делает выражение самостоятельным и естественным по-русски, не уточняя его роль сверх текста.
- source_word: οὐκ οἰκοδομεῖται
  choice: от этого не созидается
  rationale: Сохранена павловская строительная метафора духовного укрепления. «От этого» естественно обозначает связь с благодарением, не добавляя нового богословского содержания.
theological_decisions:
- issue: Метафора οἰκοδομέω применительно к участнику собрания
  choice: не созидается
  alternative: не получает назидания
  rationale: Основной текст сохраняет строительный образ Павла и пассивную форму, не определяя более узко характер происходящего укрепления; более привычный церковный эквивалент дан в примечании.
- issue: Подразумеваемый адресат благодарения
  choice: благодаришь Бога
  alternative: воздаёшь благодарение
  rationale: В контексте речь идёт о благодарении, обращённом к Богу. Экспликация делает русскую фразу естественной, но не вводит конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Конструкция «ты-то» передаёт контраст μέν…ἀλλά, а «созидается» сохраняет ключевую метафору главы.
