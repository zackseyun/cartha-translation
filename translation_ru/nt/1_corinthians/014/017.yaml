  source_fidelity: 'В основном смысл передан верно: сохранены пояснительное «ведь», признание положительной стороны благодарения и контраст с отсутствием пользы для другого. Однако «Бога» в греческом тексте отсутствует; хотя адресат ясен из контекста, его лучше не вводить в основной текст. Добавленное «от этого» также эксплицирует связь, которая подразумевается, но не выражена напрямую.'
