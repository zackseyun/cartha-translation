  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: ru
  text: 'В Законе написано: «Иными языками и устами чужеземцев Я буду говорить этому народу[a], но даже так они не послушают Меня[b]», — говорит Господь.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Через людей, говорящих на иных языках, и устами других Я буду говорить этому народу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не внемлют Мне».'
    reason: lexical_alternative
  - marker: c
    text: Эта цитата перекликается с Ис. 28:11–12.
    reason: cross_reference
  - marker: d
    text: Поскольку в цитате говорит Бог Израиля, некоторые переводы передают эти слова как «говорит ГОСПОДЬ», отражая их древнееврейский фон.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: В Законе
  rationale: В данном контексте νόμος обозначает Писание в широком смысле, поскольку цитата взята из Исаии, а не из Пятикнижия. Прописная буква сохраняет традиционное обозначение авторитетного корпуса Писания.
- source_word: γέγραπται
  choice: написано
  rationale: Естественная и близкая к форме греческого стандартная формула введения цитаты из Писания.
- source_word: ἐν ἑτερογλώσσοις
  choice: иными языками
  rationale: Передаёт значение речи на других языках и сохраняет лексическую связь с темой языков в ближайшем контексте главы. Возможная отсылка к говорящим на этих языках отражена в сноске.
- source_word: ἐν χείλεσιν ἑτέρων
  choice: устами чужеземцев
  rationale: Сохраняет образ «уст» и по контексту передаёт, что речь идёт о людях иного языка или народа; более буквальное «устами других» дано как альтернатива.
- source_word: λαλήσω
  choice: Я буду говорить
  rationale: Прямое и естественное соответствие будущему времени λαλέω; прописная буква в местоимении соответствует принятому в русском библейском стиле почтительному обозначению Бога.
- source_word: τῷ λαῷ τούτῳ
  choice: этому народу
  rationale: λαός в цитате естественно означает народ, к которому обращается Бог; «нации» здесь было бы менее идиоматично.
- source_word: οὐδ’ οὕτως
  choice: но даже так
  rationale: 'Передаёт усиление οὐδέ и значение οὕτως: народ не откликнется даже при таком способе Божьего обращения.'
- source_word: εἰσακούσονταί μου
  choice: они не послушают Меня
  rationale: Глагол выражает не просто слышание звука, но внимательное слушание и отклик. Альтернатива «не внемлют Мне» отмечает оттенок повиновения.
- source_word: λέγει κύριος
  choice: говорит Господь
  rationale: Сохраняет настоящее время формулы цитирования и непосредственно передаёт греческое κύριος без подстановки еврейского тетраграмматона.
theological_decisions:
- issue: Передача κύριος в цитате, где говорит Бог Израиля
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий источник содержит κύριος, поэтому основной текст переводит именно его. В еврейском фоне цитаты подразумевается Божье имя, что отмечено в сноске без замены чтения греческого текста.
- issue: Степень выраженности неповиновения в εἰσακούσονταί μου
  choice: не послушают Меня
  alternative: не внемлют Мне
  rationale: Основной вариант естественен для современного русского языка и допускает как слушание, так и отклик; альтернатива яснее подчёркивает оттенок повиновения, не навязывая его как единственно возможный.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Синтаксис сделан ясным для обычного читателя; сохранены образ «уст», ключевое слово «языки» и напряжение между слышанием и послушанием. Архаизм «внемлют» вынесен в сноску.
