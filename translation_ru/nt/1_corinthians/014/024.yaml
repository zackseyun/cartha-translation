revisions:
- from: Но если все пророчествуют и войдёт неверующий или несведущий человек[a], он от всех услышит обличение, и все призовут его к ответу.
  to: Но если все пророчествуют и войдёт неверующий или несведущий человек[a], он будет обличён всеми и будет судим всеми.
  rationale: Исправление устраняет добавленное значение «услышит» и чрезмерно юридическое «призовут к ответу». Повторение «всеми» и две страдательные формы сохранены, как в греческом тексте. «Будет судим» передаёт ἀνακρίνεται в его контекстуальном значении оценки или разбора, не утверждая окончательного осуждения.
  reviewer_model: gpt-5.6-terra
