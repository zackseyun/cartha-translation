source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: ru
  text: Но если все пророчествуют и войдёт неверующий или несведущий человек[a], он будет обличён всеми и будет судим всеми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «посторонний». Греческое слово может обозначать человека, который не осведомлён, не посвящён в происходящее или не принадлежит к говорящей группе.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: все
  rationale: Сохранён прямой всеохватный смысл и связь со всеми пророчествующими в собрании.
- source_word: προφητεύωσιν
  choice: пророчествуют
  rationale: Традиционный и понятный термин сохраняет особую категорию речи, о которой Павел говорит во всей главе, не сводя её просто к вдохновенной речи.
- source_word: ἄπιστος
  choice: неверующий
  rationale: В данном контексте обозначает человека, который не верит, а не просто неверного или ненадёжного человека.
- source_word: ἰδιώτης
  choice: несведущий человек
  rationale: Передаёт отсутствие у человека нужного понимания или знакомства с происходящим в собрании, не утверждая непременно, что он совершенно посторонний.
- source_word: ἐλέγχεται
  choice: услышит обличение
  rationale: Естественно передаёт греческий страдательный оборот и смысл нравственного обличения под воздействием пророческой речи.
- source_word: ἀνακρίνεται
  choice: призовут к ответу
  rationale: Передаёт смысл рассмотрения, проверки и вынесения суждения, не усиливая его до окончательного осуждения.
- source_word: ὑπὸ πάντων
  choice: от всех / все
  rationale: Смысл повторён в обеих частях фразы, при этом синтаксис сделан естественным для современного русского языка.
- source_word: δέ
  choice: но / и
  rationale: Первое δέ обозначает противопоставление предыдущей ситуации, а второе естественно связывает условие с входом человека.
- source_word: τις
  choice: человек
  rationale: Неопределённость выражена конструкцией «неверующий или несведущий человек» без тяжеловесного «некий».
theological_decisions:
- issue: Значение ἰδιώτης в контексте собрания
  choice: несведущий человек
  alternative: посторонний
  rationale: Контекст посвящён понятности речи и её воздействию на человека, не знакомого с происходящим. Основной вариант сохраняет этот смысл и не решает однозначно, принадлежит ли такой человек к общине; допустимая альтернатива вынесена в сноску.
- issue: Характер действия ἀνακρίνεται
  choice: призовут к ответу
  alternative: будет исследован; будет судим
  rationale: Выбранный вариант сохраняет идею проверяющего суждения, но не представляет происходящее как окончательный приговор или осуждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Греческие страдательные формы переданы естественными русскими действительными конструкциями; риторическое повторение «всеми» сохранено смысловым повтором «от всех… все».
