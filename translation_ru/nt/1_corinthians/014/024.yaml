review_pass:
  verdict: revise
  source_fidelity: Начальная условная конструкция и значения «все», «пророчествуют», «неверующий» и «несведущий» в целом переданы верно. Однако «услышит обличение» добавляет не выраженный в греческом глагол восприятия, а «все призовут его к ответу» заметно сужает и усиливает ἀνακρίνεται до юридически-карательного действия. Греческий текст дважды употребляет страдательные формы и повторяет ὑπὸ πάντων; это следует сохранить яснее.
  naturalness: «Несведущий человек» приемлемо в современном литературном регистре и в данном контексте понятности собрания. Формулировка «будет обличён всеми и будет судим всеми» естественна для русского библейского стиля и точно воспроизводит повторённую структуру оригинала.
  terminology: '«Пророчествуют» сохраняет павловскую терминологию. «Несведущий» удачно не предрешает, является ли ἰδιώτης внешним человеком, непосвящённым или некомпетентным участником. Для ἀνακρίνεται здесь «будет судим» не должно пониматься как окончательный приговор: речь идёт об оценке или разборе человека под воздействием пророческой речи.'
  issues:
  - severity: medium
    issue: «Он от всех услышит обличение»
    rationale: Греч. ἐλέγχεται ὑπὸ πάντων означает «обличается/будет обличён всеми». Слово «услышит» не передаёт страдательного действия обличения и добавляет иной смысловой акцент.
  - severity: high
    issue: «Все призовут его к ответу» для ἀνακρίνεται ὑπὸ πάντων
    rationale: «Призвать к ответу» в современном русском обычно означает потребовать объяснений или привлечь к ответственности. Это юридически и карательно сильнее, чем ἀνακρίνω («исследовать, оценивать, судить»), и заменяет исходную страдательную конструкцию активной с иным оттенком.
  revised_text: Но если все пророчествуют и войдёт неверующий или несведущий человек[a], он будет обличён всеми и будет судим всеми.
