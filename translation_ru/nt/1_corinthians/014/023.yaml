source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: ru
  text: Итак, если вся церковь соберётся в одном месте и все будут говорить на языках[a], а войдут неосведомлённые[b] или неверующие, разве они не скажут, что вы не в своём уме?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорить языками». Греческое слово может означать «языки»; выражение «говорить на языках» сохраняет принятое в этом контексте обозначение явления, не определяя его точной природы.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «посторонние». Греческое слово, вероятно, обозначает людей, не знакомых с порядком и практикой общины; здесь они упомянуты отдельно от неверующих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: церковь
  rationale: В данном контексте слово обозначает собравшуюся христианскую общину; «церковь» — естественный и устоявшийся русский эквивалент.
- source_word: ὅλη
  choice: вся
  rationale: Определяет всю церковь как единое целое и подчёркивает участие всей общины.
- source_word: συνέλθῃ … ἐπὶ τὸ αὐτό
  choice: соберётся в одном месте
  rationale: Передаёт и совместное собрание, и пространственный оттенок греческого выражения, не создавая избыточного повтора.
- source_word: λαλῶσιν γλώσσαις
  choice: будут говорить на языках
  rationale: Устоявшееся русское выражение для обсуждаемого в 1 Кор 12–14 дара; оно сохраняет многозначность явления и не определяет заранее его точную природу.
- source_word: ἰδιῶται
  choice: непосвящённые
  rationale: Слово обозначает людей, не знакомых с соответствующей практикой или не принадлежащих к кругу осведомлённых; перевод сохраняет их отличие от отдельно названных неверующих.
- source_word: ἄπιστοι
  choice: неверующие
  rationale: Прямо передаёт обозначение тех, кто не верит, и сохраняет проведённое Павлом различие с непосвящёнными.
- source_word: μαίνεσθε
  choice: вы не в своём уме
  rationale: Современная и естественная русская идиома, передающая обвинение в безумии без архаичности или чрезмерной разговорности.
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: разве они не скажут, что
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: οὖν
  choice: Итак
  rationale: Ясно выражает вывод из предшествующего рассуждения и естественно звучит в современной русской речи.
theological_decisions:
- issue: Природа γλώσσαι в 1 Кор 14
  choice: «говорить на языках» без дальнейшего уточнения природы явления
  alternative: Передать как речь на иностранных языках либо как экстатическую речь
  rationale: Греческое слово может обозначать языки, однако сам стих не решает, идёт ли речь об известных человеческих языках, экстатической речи или явлении, допускающем оба понимания. Перевод сохраняет эту интерпретационную открытость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Риторический вопрос сохранён; формулировка избегает как церковнославянизмов, так и чрезмерно разговорной лексики.
