  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: условие желания узнать что-либо, предписание спрашивать дома собственных мужей и основание — постыдность речи женщины в собрании. «Что-либо узнать» является естественной русской передачей μαθεῖν в данном контексте и не сужает его смысл. Повелительное «пусть ... спрашивают» корректно передаёт ἐπερωτάτωσαν. Неоднозначность γυνή сохранена: в тексте стоит «женщине», а вариант «жене» указан в сноске.'
  naturalness: Формулировка современна, литературна и синтаксически прозрачна. «Дома спрашивают у своих мужей» звучит по-русски естественно; «постыдно говорить в собрании» сохраняет сдержанный высокий регистр оригинала без искусственной архаизации.
  terminology: «Мужья» оправдано сочетанием τοὺς ἰδίους ἄνδρας и домашним контекстом. «Собрание» удачно передаёт ἐκκλησία как собравшуюся общину, не сводя значение к зданию либо к позднейшей институциональной категории. Сноски корректно объясняют варианты «жена» и «церковь/община»; их якоря стоят у соответствующих слов.
