id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: ru
  text: Если же они хотят что-либо узнать, пусть дома спрашивают у своих мужей, потому что женщине[a] постыдно говорить в собрании[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жене». Греческое слово в зависимости от контекста может означать как женщину, так и жену.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в церкви» или «в общине»; греческое слово здесь относится к собравшейся общине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: узнать
  rationale: Инфинитив μανθάνω обозначает приобретение знания. В сочетании с желанием задать вопрос естественное русское «что-либо узнать» точнее передаёт смысл, чем более процессуальное «чему-либо научиться».
- source_word: ἐν οἴκῳ
  choice: дома
  rationale: Это естественный русский эквивалент оборота «в доме», сохраняющий противопоставление домашней обстановки собранию общины.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: у своих мужей
  rationale: Сочетание ἰδίους с ἄνδρας и домашний контекст указывают здесь на супругов. Предлог «у» естественно сочетается в русском с глаголом «спрашивать».
- source_word: ἐπερωτάτωσαν
  choice: пусть спрашивают
  rationale: Форма настоящего времени в повелительном наклонении выражает предписание спрашивать; конструкция с «пусть» ясно и естественно передаёт эту силу.
- source_word: αἰσχρὸν
  choice: постыдно
  rationale: Слово обозначает то, что считается постыдным или позорным; «постыдно» сохраняет нравственно-общественную оценку исходного выражения.
- source_word: γυναικὶ
  choice: женщине
  rationale: γυνή может означать и женщину, и жену. В основном тексте сохранено обобщённое «женщине», а контекстуально возможное «жене» отмечено в сноске.
- source_word: λαλεῖν
  choice: говорить
  rationale: Общее значение λαλέω — «говорить». Перевод не уточняет вид речи, поскольку сам греческий глагол в этом предложении такого уточнения не содержит.
- source_word: ἐν ἐκκλησίᾳ
  choice: в собрании
  rationale: Здесь ἐκκλησία обозначает собравшуюся общину. «В собрании» передаёт этот смысл без сведения слова к зданию или позднейшей институциональной форме.
theological_decisions:
- issue: Объём запрета относительно речи женщин
  choice: Передать формулировку без уточнения конкретного вида речи
  alternative: Ограничить её disruptive-вопросами, оценкой пророчеств или понять как цитату позиции коринфян
  rationale: Греческий текст говорит лишь, что женщине постыдно «говорить в собрании», не обозначая здесь более узкий вид речи. Перевод сохраняет эту напряжённость и не вносит толкование в основной текст.
- issue: Передача γυνή и ἀνήρ как обозначений пола или супружеских отношений
  choice: Перевести ἄνδρας как «мужей», а γυναικὶ как «женщине», отметив вариант «жене» в сноске
  alternative: Последовательно перевести «жена — муж» либо «женщина — мужчина»
  rationale: Оборот «своих мужей» убедительно указывает на супружеское значение ἄνδρας. Единственное число γυναικὶ допускает как обобщённое «женщине», так и контекстуальное «жене», поэтому неоднозначность сохранена с помощью сноски.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Порядок слов сделан естественным для русского, а широкая формулировка исходного запрета и лексическая неоднозначность γυνή сохранены.
