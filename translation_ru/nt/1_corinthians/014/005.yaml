language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: ru
  text: Я хочу, чтобы все вы говорили на языках, но ещё больше — чтобы вы пророчествовали. Тот, кто пророчествует, важнее того, кто говорит на языках, разве только он истолкует[a], чтобы церковь получила назидание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве только кто-нибудь истолкует». Греческий глагол стоит в единственном числе и может относиться к самому говорящему на языках либо, с учётом контекста, указывать на то, что истолкование будет дано.'
    reason: alternative_reading
  - marker: b
    text: «Назидание» здесь означает созидание и укрепление собравшейся общины.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: Я хочу
  rationale: Настоящее изъявительное выражает прямое личное желание Павла; современная и естественная формулировка.
- source_word: πάντας ὑμᾶς
  choice: все вы
  rationale: Передаёт множественное число и всеохватность обращения ко всей общине.
- source_word: λαλεῖν γλώσσαις
  choice: говорили на языках
  rationale: Устоявшаяся русская передача терминологии 1 Кор 12–14, сохраняющая γλῶσσα и не решающая заранее природу этой речи.
- source_word: μᾶλλον δὲ
  choice: но ещё больше
  rationale: Выражает сравнительное предпочтение, а не отрицание говорения на языках.
- source_word: ἵνα προφητεύητε
  choice: чтобы вы пророчествовали
  rationale: После θέλω конструкция ἵνα с сослагательным наклонением обозначает содержание желания.
- source_word: μείζων
  choice: больше
  rationale: Сохраняет буквальную сравнительную характеристику, позволяя заключительной цели — назиданию церкви — раскрыть её функциональный смысл.
- source_word: ὁ προφητεύων
  choice: тот, кто пророчествует
  rationale: Естественно передаёт субстантивированное причастие и сохраняет обобщённое единственное число.
- source_word: ὁ λαλῶν γλώσσαις
  choice: тот, кто говорит на языках
  rationale: Сохраняет синтаксический параллелизм двух сравниваемых лиц.
- source_word: ἐκτὸς εἰ μὴ
  choice: разве только
  rationale: Идиоматично вводит исключение; в данном русском предложении звучит естественнее буквального «если только не».
- source_word: διερμηνεύῃ
  choice: он истолкует сказанное
  rationale: Единственное число естественно отсылает к говорящему на языках; «истолкует сказанное» ясно выражает передачу смысла речи и не ограничивает действие письменным переводом.
- source_word: ἡ ἐκκλησία
  choice: церковь
  rationale: В контексте обозначает собравшуюся христианскую общину; «церковь» — понятная и устоявшаяся русская передача.
- source_word: οἰκοδομὴν λάβῃ
  choice: получила назидание
  rationale: Сохраняет греческую конструкцию «получить созидание/назидание» и передаёт духовное укрепление собравшейся общины.
theological_decisions:
- issue: Относительное превосходство пророчества над говорением на языках
  choice: Сохранено прямое «больше», а цель назидания церкви оставлена определять смысл сравнения в контексте.
  alternative: «важнее» или утверждение превосходства в духовном положении
  rationale: Заключительное ἵνα связывает сравнение с пользой для общины; текст не утверждает более высокий личный ранг или святость пророчествующего.
- issue: Подлежащее διερμηνεύῃ
  choice: «он истолкует» — говорящий на языках сам истолковывает сказанное
  alternative: «кто-нибудь истолкует» или «будет дано истолкование»
  rationale: Неуказанное подлежащее глагола единственного числа естественнее всего продолжает упоминание говорящего на языках, однако ближайший контекст допускает истолкование другим человеком, поэтому эта возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся близким к греческому, но не звучит архаично. Термины «говорить на языках», «пророчествовать», «церковь» и «назидание» сохраняют межконфессионально узнаваемую лексику; подлинная неоднозначность относительно истолкователя вынесена в сноску.
