  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: ru
  text: Стремитесь к любви и ревностно желайте духовного[a], а особенно — чтобы вы пророчествовали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духовных проявлений»; возможно также: «духовных даров». Греческое выражение шире слова «дары», но в данном контексте речь идёт о проявлениях Духа в церкви.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а лучше — чтобы вы пророчествовали».'
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: Стремитесь
  rationale: Передаёт настойчивое, деятельное и продолжающееся устремление, выраженное повелительным διώκετε; буквальное «преследуйте» по-русски здесь звучало бы неестественно.
- source_word: τὴν ἀγάπην
  choice: к любви
  rationale: «Любовь» — современный и устойчивый эквивалент ἀγάπη, сохраняющий прямую связь с главой 13.
- source_word: ζηλοῦτε
  choice: ревностно желайте
  rationale: Сочетает значения сильного желания и рвения, сохраняя положительный повелительный смысл ζηλόω.
- source_word: τὰ πνευματικά
  choice: духовных проявлений
  rationale: Греческое субстантивированное прилагательное шире слова «дары», однако контекст 1 Кор 12–14 указывает на проявления Духа в собрании. Формулировка не сужает выражение исключительно до перечня даров.
- source_word: μᾶλλον δὲ
  choice: особенно же
  rationale: Передаёт сравнительное предпочтение и лёгкий переход, выраженные μᾶλλον и δέ, не создавая жёсткого противопоставления.
- source_word: ἵνα προφητεύητε
  choice: пророчествовать
  rationale: Русский инфинитив естественно выражает содержание настойчивого желания; «пророчествовать» сохраняет установленную библейскую категорию.
theological_decisions:
- issue: Объём значения τὰ πνευματικά
  choice: «духовные проявления»
  alternative: «духовные дары»; «духовное»; «духовные вещи»
  rationale: Форма среднего рода множественного числа сама по себе допускает широкое значение, а ближайший контекст говорит о данных Духом проявлениях в церкви. Основной текст передаёт контекст, не добавляя более узкого существительного «дары» без оговорки.
- issue: Сила предпочтения пророчества
  choice: «особенно же — пророчествовать»
  alternative: «а лучше — пророчествовать»; «но более всего — пророчествовать»
  rationale: Формулировка сохраняет приоритет пророчества в данном рассуждении, не утверждая, будто остальные духовные проявления недействительны или нежелательны.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис краткий и ясный; «же» передаёт δέ, а тире делает естественным присоединение инфинитива после «особенно».
