base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: ru
  text: Братья[a], не становитесь детьми в мышлении; напротив, в отношении зла будьте младенцами, а в мышлении становитесь зрелыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Братья и сёстры»; греческое слово имеет мужскую форму «братья», но здесь служит обращением ко всей общине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Братья
  rationale: Сохраняет мужскую форму греческого обращения, которое в контексте обращено ко всей общине; инклюзивный охват пояснён в сноске.
- source_word: παιδία
  choice: детьми
  rationale: Передаёт общее обозначение детей и сохраняет контраст с «младенцами» и «зрелыми», не уточняя возраст сверх текста.
- source_word: γίνεσθε
  choice: не будьте / будьте
  rationale: В русском императив «будьте» естественно передаёт требуемое состояние и сохраняет параллелизм; буквальное «не становитесь» здесь менее идиоматично и может ошибочно предполагать процесс изменения.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: по уму
  rationale: 'Кратко и естественно передаёт дательный отношения: в том, что касается мышления и разумения; повтор сохраняет риторическую рамку стиха.'
- source_word: τῇ κακίᾳ
  choice: в отношении зла
  rationale: Сохраняет широкую нравственную сферу κακία и ясно передаёт дательный отношения, не сужая значение до одной лишь злобы.
- source_word: νηπιάζετε
  choice: будьте младенцами
  rationale: Сохраняет образ младенческого возраста и намеренный контраст с детьми и зрелыми людьми без разговорного оттенка.
- source_word: τέλειοι
  choice: зрелыми
  rationale: В данном контексте обозначает взрослость и зрелость разумения, а не безгрешное совершенство.
- source_word: ἀλλὰ ... δὲ
  choice: напротив ... а
  rationale: 'Естественно для русского языка выражает двойное противопоставление: не дети по уму, но младенцы относительно зла, а по уму — зрелые.'
theological_decisions:
- issue: Гендерно маркированное обращение к общине
  choice: В основном тексте «Братья», а инклюзивный охват всей общины указан в сноске.
  alternative: «Братья и сёстры»
  rationale: Греческое ἀδελφοί имеет мужскую форму, но как общинное обращение, вероятно, включает и женщин. Перевод сохраняет форму источника, не скрывая её контекстуального охвата.
- issue: Значение τέλειοι
  choice: «зрелыми»
  alternative: «совершенными»
  rationale: Контраст с детьми и младенцами указывает на зрелость мышления; «совершенными» могло бы внести не требуемую контекстом идею нравственной безупречности.
- issue: Объём значения κακία
  choice: Общее «зло»
  alternative: Более узкое «злоба»
  rationale: Контекст допускает оттенок злобы, но не требует сужать широкое значение κακία; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор «по уму» намеренно сохраняет композицию греческого текста; «в отношении зла» чуть формальнее разговорной речи, но точно и понятно передаёт конструкцию.
