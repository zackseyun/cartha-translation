source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: ru
  text: Итак, языки[a] служат знамением не для верующих, а для неверующих[b]; пророчество же — не для неверующих, а для верующих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может обозначать человеческие языки. В 1 Кор 12–14 оно употребляется как обозначение особого дара; перевод не определяет, идёт ли речь об иностранных языках или об иной духовной речи.
    reason: lexical_alternative
  - marker: b
    text: С учётом приведённых выше слов из Ис 28:11–12 некоторые толкователи понимают это как знамение суда.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным и ясным русским союзом.
- source_word: γλῶσσαι
  choice: языки
  rationale: Сохраняет буквальный образ греческого слова и принятую терминологию 1 Кор 12–14, не определяя заранее, идёт ли речь об иностранных языках или об особой духовной речи.
- source_word: εἰς σημεῖόν
  choice: служат знамением
  rationale: Естественно передаёт значение назначения или результата конструкции εἰς с винительным падежом, сохраняя нейтральный смысл слова «знамение».
- source_word: τοῖς πιστεύουσιν
  choice: для верующих
  rationale: Кратко и естественно передаёт субстантивированное причастие «тем, кто верит» и поддерживает ясный контраст с неверующими.
- source_word: τοῖς ἀπίστοις
  choice: для неверующих
  rationale: Точно и лаконично передаёт религиозно-общинный контраст с πιστεύουσιν.
- source_word: ἡ δὲ προφητεία
  choice: пророчество же
  rationale: «Пророчество» прямо обозначает дар или деятельность в контексте главы, а частица «же» естественно выражает противопоставление δέ.
theological_decisions:
- issue: Значение γλῶσσαι в контексте духовных даров
  choice: «языки» без уточнения природы речевого явления
  alternative: «иные языки», «иностранные языки» или «экстатическая речь»
  rationale: Греческое слово и контекст допускают спор о характере этого дара; перевод не должен заранее закреплять конфессиональное толкование.
- issue: Смысл знамения для неверующих
  choice: нейтральное «служат знамением»
  alternative: «служат знамением суда» или «служат подтверждающим знамением»
  rationale: Сам стих не уточняет характер знамения. Предшествующая цитата из Ис 28 допускает судебное понимание, однако основной текст должен сохранить смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Параллельная структура греческого предложения сохранена; «же» подчёркивает противопоставление, а тире позволяет избежать тяжеловесного повторения глагола.
