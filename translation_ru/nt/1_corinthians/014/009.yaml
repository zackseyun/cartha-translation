base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: ru
  text: 'Так и вы: если языком не произносите понятной речи[a], как будет понятно то, что говорится? Ведь вы будете говорить в пустоту.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ясной речи»; возможно также: «разборчивых слов». Греческое выражение обозначает речь, которую слушатели могут распознать и понять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так и вы
  rationale: Кратко и естественно передаёт применение к коринфянам предшествующего сравнения.
- source_word: διὰ τῆς γλώσσης
  choice: языком
  rationale: Сохраняет конкретный образ органа речи и инструментальное значение греческого оборота, не подменяя его толкованием «на языке».
- source_word: εὔσημον λόγον
  choice: понятных слов
  rationale: Передаёт речь, которую слушатели могут распознать и понять; множественное число естественно по-русски выражает собирательный смысл λόγον.
- source_word: δῶτε
  choice: произнесёте
  rationale: Буквальное «дадите» с дополнением «слова» возможно, но здесь звучит менее естественно; «произнесёте» ясно передаёт речевое действие в данном контексте.
- source_word: πῶς γνωσθήσεται τὸ λαλούμενον
  choice: как можно будет понять сказанное?
  rationale: Пассив γνωσθήσεται в контексте обозначает восприятие и понимание речи; безличная русская конструкция сохраняет неопределённость относительно слушателя.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: Ведь вы будете говорить на ветер
  rationale: Естественная русская идиома сохраняет образ речи, не достигающей слушателей, и её бесплодности.
