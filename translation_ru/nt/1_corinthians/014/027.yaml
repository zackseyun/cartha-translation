  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: ru
  text: Если кто-нибудь говорит на языке[a], пусть говорят двое или, самое большее, трое, по очереди, и один пусть истолковывает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорит языком». Греческое слово может означать «язык»; в этой главе оно относится к дару языков, но само по себе не определяет природу этого дара.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: на языке
  rationale: Дательный падеж при λαλεῖ обозначает говорение языком. Выражение сохраняет ключевое для 1 Кор 12–14 слово и не определяет заранее, идёт ли речь об известном человеческом языке или об иной форме речи.
- source_word: τις
  choice: кто-нибудь
  rationale: Неопределённое местоимение имеет обобщённое значение и естественно передаётся в условной конструкции словом «кто-нибудь».
- source_word: λαλεῖ
  choice: говорит
  rationale: Настоящее время в общем условии естественно передаётся русским настоящим временем.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: пусть говорят двое или, самое большее, трое
  rationale: Оборот устанавливает предел числа говорящих; добавлен подразумеваемый глагол «говорят», необходимый для ясного и естественного русского синтаксиса.
- source_word: ἀνὰ μέρος
  choice: по очереди
  rationale: Оборот указывает, что участники должны говорить раздельно, один вслед за другим, а не одновременно.
- source_word: εἷς
  choice: один
  rationale: Числительное употреблено субстантивно и обозначает одного человека, исполняющего истолкование.
- source_word: διερμηνευέτω
  choice: пусть истолковывает
  rationale: Повелительная форма требует сделать сказанное понятным собранию. «Истолковывать» сохраняет традиционную контекстуальную связь с даром истолкования и шире, чем однозначное «переводить».
theological_decisions:
- issue: Значение γλώσσῃ в контексте духовных даров
  choice: Передать как «на языке», не уточняя природу речи.
  alternative: «иным языком»; «на иностранном языке»; «в экстатической речи»
  rationale: Контекст говорит о даре языков, однако сам стих не решает, является ли эта речь человеческим иностранным языком, небесной речью или иным харизматическим явлением. Нейтральная формулировка сохраняет эту открытость.
- issue: Характер действия διερμηνευέτω
  choice: «пусть истолковывает»
  alternative: «пусть переводит»; «пусть объясняет»
  rationale: Греческий глагол допускает передачу смысла сказанного, но стих не уточняет механизм этого действия. «Истолковывает» не сводит его исключительно к обычному переводу или свободному объяснению.
translation_notes:
  register: Современный литературный русский язык с ясной нормативной формулировкой. Союз «а» перед заключительным предписанием естественно разделяет говорящих и одного истолковывающего; двусмысленность относительно природы языков сохранена.
