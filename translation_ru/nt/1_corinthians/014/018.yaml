  choice: на языках
  rationale: В контексте 1 Кор 12–14 слово обозначает обсуждаемый духовный феномен. Традиционное русское выражение «говорить на языках» сохраняет термин контекста и не определяет природу этих языков.
- source_word: λαλῶ
  choice: я говорю
  rationale: Настоящее время передано простым настоящим временем русского глагола, подходящим для общего утверждения.
