  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: ru
  text: Итак, что же делать? Буду молиться духом[a], но буду молиться и умом; буду петь хвалу[b] духом, но буду петь хвалу и умом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в духе» или «посредством духа». Греческий текст прямо не уточняет, имеется ли в виду Святой Дух, дух самого молящегося или духовное высказывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «буду петь» или «буду воспевать».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «осмысленно» или «с пониманием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Итак, что же делать?
  rationale: Риторический вопрос подводит к практическому выводу. Эта формулировка естественна по-русски и передаёт функцию выражения, не превращая его в отдельное утверждение.
- source_word: προσεύξομαι
  choice: буду молиться
  rationale: Будущее время глагола προσεύχομαι прямо выражает намерение Павла; отдельная передача среднего залога по-русски не требуется.
- source_word: τῷ πνεύματι
  choice: духом
  rationale: Творительный падеж естественно передаёт греческий дательный и сохраняет параллель с «умом», не уточняя сверх текста, идёт ли речь о человеческом духе, Святом Духе или духовном проявлении.
- source_word: τῷ νοΐ
  choice: умом
  rationale: νοῦς обозначает разум, способность осмыслять и понимать. «Умом» кратко и точно сохраняет лексический и синтаксический параллелизм с «духом».
- source_word: ψαλῶ
  choice: буду петь хвалу
  rationale: В контексте богослужения ψάλλω означает петь, обращаясь к Богу или прославляя Его. «Петь хвалу» яснее передаёт этот смысл, чем одно лишь «петь», и звучит современно.
- source_word: δὲ καὶ
  choice: но буду ... и
  rationale: 'Сочетание выражает добавление с лёгким противопоставлением: не только одним способом, но также другим. Русская конструкция «но ... и» сохраняет уравновешенность двух частей.'
theological_decisions:
- issue: Значение πνεῦμα в противопоставлении духа и ума
  choice: Передать как «дух», не уточняя в основном тексте, чей именно дух имеется в виду.
  alternative: «Святым Духом», «моим духом» или «духовным языком».
  rationale: Греческий текст прямо не определяет, означает ли πνεῦμα человеческий дух, действие Святого Духа или духовное изречение. Контекст допускает различные толкования, поэтому перевод сохраняет эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Повтор глагольных конструкций сохранён ради риторического параллелизма оригинала; «духом» и «умом» намеренно поставлены в одинаковую синтаксическую форму.
