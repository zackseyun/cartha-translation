  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: ru
  text: А тот, кто пророчествует, говорит людям для их укрепления[a], ободрения[b] и утешения[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для их созидания»; буквально образ связан со строительством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «увещания»; греческое слово может также означать призыв или утешение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «успокоения»; здесь имеется в виду утешающая, поддерживающая речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: А тот, кто пророчествует
  rationale: Субстантивированное причастие передано естественной русской конструкцией «тот, кто…». Частица δέ выражает мягкое противопоставление предыдущему стиху и передана союзом «а».
- source_word: ἀνθρώποις
  choice: людям
  rationale: Дательный падеж обозначает адресатов речи; слово употреблено в общем, а не исключительно мужском значении.
- source_word: λαλεῖ
  choice: говорит
  rationale: Настоящее время и обычное значение глагола λαλέω прямо и естественно передаются глаголом «говорит».
- source_word: οἰκοδομὴν
  choice: для их укрепления
  rationale: В данном контексте οἰκοδομή метафорически обозначает созидание и духовное укрепление людей. «Укрепление» понятно современному читателю, а конструкция с «для» передаёт направленность и результат речи.
- source_word: παράκλησιν
  choice: ободрения
  rationale: παράκλησις может означать ободрение, увещание или утешение. «Ободрение» сохраняет отличие от следующего παραμυθία и естественно звучит по-русски.
- source_word: παραμυθίαν
  choice: утешения
  rationale: παραμυθία обозначает утешение, успокоение или ободряющую речь. «Утешение» сохраняет особый, более успокаивающий оттенок этого слова.
theological_decisions:
- issue: Значение пророчества в контексте собрания
  choice: Сохранено «пророчествует» без дополнительного определения.
  alternative: «проповедует» или «передаёт откровение»
  rationale: Стих описывает воздействие пророчества на людей, но не даёт исчерпывающего определения самого явления. Такой перевод не сужает смысл в соответствии с какой-либо конфессиональной трактовкой.
- issue: Функция трёх винительных существительных после λαλεῖ
  choice: 'Передана как направленность и результат речи: «для их укрепления, ободрения и утешения».'
  alternative: 'Передать их как непосредственное содержание речи: «говорит укрепление, ободрение и утешение».'
  rationale: Греческая конструкция лаконична и допускает оттенок содержания и результата. Русская конструкция с «для» звучит естественно и передаёт основную мысль, не превращая три результата в прямую цитату.
translation_notes:
  register: Современный литературный русский язык; стиль ясный и достойный. Традиционное «назидание» заменено более доступным «укреплением», а различие между παράκλησις и παραμυθία сохранено словами «ободрение» и «утешение».
