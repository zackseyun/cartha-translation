  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: ru
  text: Ведь все вы можете пророчествовать один за другим[a], чтобы все учились и все получали ободрение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по одному».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «получали увещевание»; или: «получали утешение». Греческий глагол в зависимости от контекста может означать ободрение, увещевание или утешение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: можете
  rationale: Передаёт настоящее изъявительное наклонение и значение способности или возможности естественным современным русским языком.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительно-обосновывающую связь с предшествующим наставлением и естественно звучит по-русски.
- source_word: καθ’ ἕνα
  choice: один за другим
  rationale: Идиоматически передаёт последовательность выступлений; возможный оттенок «по одному, не одновременно» отмечен в сноске.
- source_word: πάντες
  choice: все
  rationale: Сохраняет трёхкратный повтор и широту греческого выражения, не сужая его референт сверх того, что задаёт контекст.
- source_word: προφητεύειν
  choice: пророчествовать
  rationale: Сохраняет принятую новозаветную категорию и не подменяет её более узким толкованием.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое, с возможным оттенком результата, значение придаточного предложения.
- source_word: μανθάνωσιν
  choice: учились
  rationale: Передаёт общее педагогическое значение настоящего конъюнктива; несовершенный вид уместно выражает процесс.
- source_word: παρακαλῶνται
  choice: получали ободрение
  rationale: Передаёт пассивную форму и широкое созидательное значение παρακαλέω; возможные смыслы увещевания и утешения сохранены в сноске.
theological_decisions:
- issue: Объём значения πάντες («все») в наставлении о собрании
  choice: Сохранено «все» без уточнения «все вы» во втором и третьем употреблениях или «все пророки».
  alternative: Уточнить первое употребление как «все пророки», а последующие — как «все присутствующие».
  rationale: Греческий текст трижды повторяет πάντες, но непосредственные референты определяются контекстом. Перевод сохраняет риторический повтор и не устраняет присущую тексту неопределённость.
- issue: Смысл παρακαλῶνται
  choice: «получали ободрение» с перечислением иных смыслов в сноске
  alternative: «получали увещевание» или «получали утешение»
  rationale: В контексте созидания собрания «ободрение» достаточно широко, но греческий глагол допускает также увещевание и утешение; эти оттенки не следует исключать.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный. «Пророчествовать» сохраняет терминологическую точность, а «получали ободрение» естественно передаёт пассивную форму. Все три употребления πάντες переданы словом «все».
