base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: ru
  text: Но пусть всё совершается благопристойно[a] и по порядку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобающим образом»; греческое слово означает то, что уместно, достойно и прилично.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа имеет широкий охват; «всё» естественно по-русски передаёт совокупность происходящего в собрании.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкое противопоставление или переход к итоговому наставлению; «но» уместно связывает его с предыдущим обсуждением.
- source_word: εὐσχημόνως
  choice: благопристойно
  rationale: Наречие обозначает то, что совершается подобающим, достойным образом. «Благопристойно» сохраняет оттенок уместности поведения и соответствует возвышенному, но понятному библейскому регистру.
- source_word: κατὰ τάξιν
  choice: по порядку
  rationale: Предложное сочетание указывает на соблюдение надлежащего порядка или последовательности; русский оборот «по порядку» передаёт это прямо и естественно.
- source_word: γινέσθω
  choice: пусть … совершается
  rationale: Форма повелительного наклонения третьего лица выражает общее предписание. «Пусть всё совершается» сохраняет повелительную силу и подходит к контексту происходящего на собрании.
theological_decisions:
- issue: Сфера действия наставления Павла в контексте собрания
  choice: Общее требование, чтобы всё в собрании происходило подобающим образом и упорядоченно, без указания конкретной конфессиональной формы богослужения.
  alternative: Понимать стих либо как предписание неизменного формального чина богослужения, либо как принцип, прямо распространяемый на всю церковную практику вне ближайшего контекста.
  rationale: Стих подводит итог непосредственному обсуждению речи и порядка в собрании. Перевод сохраняет обобщённость греческого текста и не вводит определённую литургическую или церковно-организационную модель.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой. «Благопристойно» несколько возвышенно, но общеупотребительно в библейском контексте; сноска поясняет смысл и даёт более нейтральный вариант.
