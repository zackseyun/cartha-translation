id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: ru
  text: Женщины[a] в церквах пусть молчат, потому что им не позволено говорить[b], но пусть подчиняются, как говорит и закон[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Жёны»; греческое γυνή в зависимости от контекста может означать и «женщина», и «жена».'
    reason: alternative_reading
  - marker: b
    text: Сам стих не уточняет, какой именно вид говорения имеется в виду; некоторые понимают это указание более узко, исходя из окружающего контекста.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Закон»; Павел может иметь в виду конкретно Моисеев закон либо Писание в более широком смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: женщины
  rationale: Слово γυνή может означать как «женщина», так и «жена». В самом стихе мужья прямо не упомянуты, поэтому в основном тексте сохранено более широкое значение, а возможный вариант «жёны» указан в сноске.
- source_word: ἐκκλησίαις
  choice: в церквах
  rationale: В данном контексте ἐκκλησία обозначает собравшиеся христианские общины. «В церквах» — естественная для русского библейского текста передача, допускающая смысл собраний поместных общин.
- source_word: σιγάτωσαν
  choice: пусть молчат
  rationale: Настоящее повелительное наклонение выражает требование молчать в описанной обстановке. Формулировка также сохраняет связь с другими употреблениями σιγάω в этой главе.
- source_word: ἐπιτρέπεται
  choice: им не позволено
  rationale: Страдательная форма указывает на отсутствие позволения. Безличная русская конструкция точно и естественно передаёт греческое выражение.
- source_word: λαλεῖν
  choice: говорить
  rationale: λαλέω — широкое, нейтральное обозначение речи. Перевод не уточняет вид говорения, поскольку сам стих этого не делает.
- source_word: ὑποτασσέσθωσαν
  choice: пусть подчиняются
  rationale: Настоящее среднее/страдательное повелительное наклонение выражает требуемое состояние или действие подчинения. Русская возвратная форма естественна и не добавляет не указанного в тексте объекта.
- source_word: νόμος
  choice: закон
  rationale: Строчная буква не предрешает, имеется ли в виду конкретно Моисеев закон или Писание в более широком смысле; в греческом регистр букв не разрешает этот вопрос.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: как говорит и закон
  rationale: Передача сохраняет сравнительную силу καθὼς и добавочное значение καί, не конкретизируя источник сверх сказанного в греческом тексте.
theological_decisions:
- issue: Кого обозначает γυναῖκες
  choice: женщины в церковных собраниях
  alternative: жёны в церковных собраниях
  rationale: Греческое слово допускает оба значения, но в непосредственном тексте мужья не названы. Поэтому основной текст сохраняет более широкое значение, а более узкое отмечено в сноске.
- issue: Объём запрета говорить
  choice: прямой перевод без уточнения вида речи
  alternative: запрет только на disruptive speech или на обсуждение и оценку пророчеств
  rationale: В стихе употреблён общий глагол «говорить». Контекстуальные ограничения обсуждаются, поэтому перевод не вводит их в основной текст.
- issue: Значение ὁ νόμος
  choice: закон без дальнейшей конкретизации
  alternative: Моисеев Закон или Писание в более широком смысле
  rationale: Точная отсылка остаётся предметом толкования; перевод сохраняет неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис близок к греческому, но естественен по-русски; спорные референты и объём запрета намеренно не конкретизированы.
