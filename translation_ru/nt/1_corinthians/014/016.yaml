  source_fidelity: 'Смысл в целом передан точно: сохранены условно-следственная связка, неоднозначность πνεύματι, ответное «аминь», нетехническое значение εὐχαριστία и причина непонимания. Однако «занимающий место несведущего» без определительного слова звучит по-русски как характеристика человека, который подменяет несведущего, а не как воспроизведение греческого идиоматического обозначения участника собрания, находящегося в положении ἰδιώτης. Предлог «на» в сочетании «скажет ... на твоё благодарение» также менее естественен, чем «при».'
