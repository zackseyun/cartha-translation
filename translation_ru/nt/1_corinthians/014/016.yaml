- from: Иначе, если ты благословляешь духом[a], то как занимающий место несведущего[b] скажет «аминь» на твоё благодарение[c], раз он не знает, что ты говоришь?
  to: Иначе, если ты благословляешь духом[a], то как тот, кто занимает место несведущего[b], скажет «аминь» при твоём благодарении[c], раз он не знает, что ты говоришь?
