source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: ru
  text: Иначе, если ты благословляешь духом[a], то как тот, кто занимает место несведущего[b], скажет «аминь» при твоём благодарении[c], раз он не знает, что ты говоришь?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в духе». Греческая форма не уточняет однозначно, имеется ли в виду человеческий дух или речь, совершаемая под действием Божьего Духа.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «непосвящённого», «необученного», возможно, «постороннего». Здесь имеется в виду человек, который не понимает произносимого.'
    reason: lexical_alternative
  - marker: c
    text: Здесь «благодарение» означает произнесение благодарности и не обязательно является позднейшим специальным названием Евхаристии.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: иначе, если
  rationale: Передаёт условный пример с выводом из предшествующего рассуждения, а не просто причинное «ибо если».
- source_word: εὐλογῇς
  choice: благословляешь
  rationale: Сохраняет основное значение глагола и обозначает произносимое в собрании благословение.
- source_word: πνεύματι
  choice: духом
  rationale: Творительный падеж естественно передаёт греческий дательный, не решая однозначно, идёт ли речь о человеческом духе, действии Духа или духовном способе речи.
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: занимающий место несведущего
  rationale: Передаёт образ человека, занимающего в собрании положение того, кто не обладает необходимым знанием или пониманием.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: как ... скажет «аминь»
  rationale: Сохраняет традиционное слово согласия и естественную русскую формулировку; греческий артикль не требует буквального «скажет это аминь».
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: на твоё благодарение
  rationale: Передаёт ответное «аминь» на произнесённую благодарственную речь, не вводя позднейшего технического значения «Евхаристия».
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: раз он не знает, что ты говоришь
  rationale: Близко следует греческой формулировке и ясно указывает причину невозможности осмысленного ответа.
theological_decisions:
- issue: Значение πνεύματι в контексте духовной речи
  choice: «духом» без уточнения референта
  alternative: «в духе»; «Духом»; «своим духом»
  rationale: Греческий текст допускает инструментальное или сферическое понимание и сам по себе не требует выбирать между человеческим духом и речью, совершаемой под действием Божьего Духа.
- issue: Значение εὐχαριστίᾳ
  choice: «благодарение» как произнесение благодарности
  alternative: «Евхаристия» как технический сакраментальный термин
  rationale: Непосредственный контекст говорит о понятной для собрания благодарственной речи; позднейшее специальное значение здесь не обязательно.
- issue: Значение ἰδιώτης
  choice: «несведущий»
  alternative: «непосвящённый»; «посторонний»; «простой человек»
  rationale: В данном рассуждении акцент стоит на отсутствии понимания сказанного, однако точный статус этого человека остаётся не вполне определённым.
translation_notes:
  register: Современный литературный русский язык с достоинством богослужебного контекста. Синтаксис сохраняет ход греческого вопроса, но остаётся понятным. «Аминь» дано в кавычках как произносимый ответ; неоднозначности πνεύματι и ἰδιώτης вынесены в примечания.
