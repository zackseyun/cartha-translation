  terminology: «Благословляешь духом», «несведущий», «аминь» и «благодарение» допустимы. Написание «аминь» со строчной буквы в кавычках уместно как передача произносимого слова. Примечания корректно сохраняют лексическую и богословскую неоднозначность и не навязывают конфессионального прочтения.
