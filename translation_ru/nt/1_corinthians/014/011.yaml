base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: ru
  text: Итак, если я не понимаю значения речи[a], то я буду для говорящего чужеземцем[b], и говорящий будет чужеземцем для меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «силу голоса (или звука)», то есть передаваемое им значение или смысл.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово означает здесь человека с чужой и непонятной речью, а не обязательно нецивилизованного человека.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Итак, если
  rationale: Сохраняет условность ἐάν и логический вывод οὖν, естественно связывая стих с предшествующим рассуждением.
- source_word: μὴ εἰδῶ
  choice: не понимаю
  rationale: Хотя οἶδα буквально означает «знать», в данном контексте речь идёт о распознавании смысла речи; «не понимаю» естественно передаёт это по-русски.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: смысла произносимого
  rationale: δύναμις здесь обозначает значение или смысл, а φωνή — слышимую речь/звук. Такое сочетание передаёт идиоматический смысл, не сводя φωνή непременно к отдельному языку.
- source_word: τῷ λαλοῦντι
  choice: для говорящего
  rationale: Естественно передаёт дательный отношения при причастии «говорящий».
- source_word: βάρβαρος
  choice: чужеземец
  rationale: В контексте слово указывает на языковую чуждость и взаимную непонятность, а не на нецивилизованность.
- source_word: ἐν ἐμοὶ
  choice: для меня
  rationale: Передаёт идиоматическое отношение со стороны воспринимающего и сохраняет взаимную структуру высказывания.
