lexical_decisions:
- source_word: προφῆται
  choice: пророков
  rationale: Существительное прямо обозначает пророков или пророческих вестников; контекст регулирует их речь в собрании.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает мягкий переход к следующему наставлению; в русском языке такой переход естественно передаётся самим началом нового предложения без отдельного союза.
- source_word: δύο ἢ τρεῖς
  choice: двое или трое
  rationale: Прямо передаёт числовое выражение; форма «двое/трое» естественна при обозначении людей мужского пола или смешанной группы.
- source_word: λαλείτωσαν
  choice: пусть говорят
  rationale: Передаёт повелительное значение формы третьего лица множественного числа и сохраняет указание на устную речь.
- source_word: οἱ ἄλλοι
  choice: остальные
  rationale: Сохраняет неопределённость греческого выражения, не уточняя, имеются ли в виду другие пророки, руководители или всё собрание.
- source_word: διακρινέτωσαν
  choice: пусть оценивают сказанное
  rationale: В данном контексте глагол означает внимательное распознавание и оценку пророческой речи. Добавление «сказанное» естественно выражает подразумеваемый объект оценки, не превращая её в осуждение.
theological_decisions:
- issue: Кого обозначают «остальные»
  choice: Сохранено общее обозначение «остальные».
  alternative: «остальные пророки» или «остальные в собрании»
  rationale: Греческий текст не определяет эту группу точнее, поэтому перевод не разрешает оставленный открытым экклезиологический вопрос.
- issue: Характер проверки пророческой речи
  choice: «оценивают сказанное»
  alternative: «судят», «различают» или «рассуждают»
  rationale: Так передана необходимость проверять пророческую речь без привнесения смысла судебного осуждения; примечание сохраняет широту греческого глагола.
translation_notes:
  register: Современный литературный русский язык; краткая повелительная конструкция сохраняет достоинство и ясность оригинала. Союз «а» естественно разграничивает речь пророков и последующую оценку, не усиливая противопоставление.
