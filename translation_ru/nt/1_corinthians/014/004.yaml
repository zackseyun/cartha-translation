  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: ru
  text: Кто говорит на языке[a], тот назидает себя, а кто пророчествует, тот назидает церковь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть говорит на языках; точная природа этой речи остаётся предметом споров.
    reason: contextual_explanation
  - marker: b
    text: 'Или: «собрание» или «общину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: Кто говорит
  rationale: Субстантивированное причастие настоящего времени обозначает любого человека, характеризуемого этим действием; конструкция «кто… тот» естественна для современного русского языка и сохраняет параллелизм обеих частей.
- source_word: γλώσσῃ
  choice: на языке
  rationale: Дательный падеж единственного числа без артикля передан буквально и естественно. В контексте речь идёт о даре говорения на языках, однако формулировка не определяет точную природу этого явления.
- source_word: ἑαυτὸν
  choice: себя
  rationale: Русское возвратное местоимение точно передаёт греческое ἑαυτόν и не требует выражать грамматический род, сохраняя обобщающий смысл.
- source_word: οἰκοδομεῖ
  choice: назидает
  rationale: Глагол употреблён метафорически — о духовном укреплении и созидании. «Назидает» является понятным библейским термином и позволяет сохранить повтор одного и того же глагола в обеих частях стиха.
- source_word: ὁ δὲ προφητεύων
  choice: а кто пророчествует
  rationale: Повторная конструкция «кто… тот» воспроизводит синтаксический параллелизм; δέ передано союзом «а», выражающим мягкое противопоставление.
- source_word: ἐκκλησίαν
  choice: церковь
  rationale: В данном контексте слово обозначает собравшуюся христианскую общину. «Церковь» — наиболее естественный русский эквивалент, при этом возможны варианты «собрание» и «община».
theological_decisions:
- issue: Значение γλώσσῃ в контексте 1 Коринфянам 12–14
  choice: «на языке» — обозначение дара говорения на языках без уточнения природы речи
  alternative: «на ином языке»; «на незнакомом языке»; «в экстатической речи»
  rationale: Контекст связывает выражение с духовным даром, но сам стих не позволяет однозначно решить, является ли речь обычным иностранным языком, экстатической речью или иным феноменом. Перевод сохраняет эту неоднозначность.
- issue: Контраст личного и общинного назидания
  choice: 'Сохранить нейтральное утверждение: «назидает себя… назидает церковь»'
  alternative: Добавить оценочные слова, представляющие самоназидание как эгоистичное или отрицательное
  rationale: В греческом тексте данного стиха противопоставлены адресаты назидания, но прямой нравственной оценки самоназидания здесь не выражено; её не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Конструкция «кто… тот» ясна широкой аудитории и сохраняет параллелизм оригинала. Термин «назидает» выбран ради точности строительной метафоры и лексического повтора; он несколько книжный, но устойчив и понятен в библейском контексте.
