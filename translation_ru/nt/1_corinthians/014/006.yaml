  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: ru
  text: Теперь же, братья[a], если я приду к вам, говоря на языках[b], какую пользу я вам принесу, если не обращусь к вам с откровением, знанием, пророчеством или наставлением?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое «братья» могло служить обращением ко всей общине, включая женщин.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говоря на языках»; греческое слово может означать «языки». В 1 Кор 12–14 оно относится к обсуждаемому явлению, но само по себе не определяет его точную природу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: Теперь же
  rationale: Передаёт переход к следующему практическому пункту рассуждения и сохраняет лёгкий оттенок противопоставления, выраженный δέ.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; в данном общинном контексте оно может включать и женщин, что пояснено в сноске.
- source_word: γλώσσαις λαλῶν
  choice: буду говорить на языках
  rationale: Это естественное русское обозначение обсуждаемого в 1 Кор 12–14 духовного речевого явления; перевод не определяет его природу более узко, чем контекст.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: какую пользу я вам принесу
  rationale: Естественно передаёт значение ὠφελέω — приносить пользу, помогать — и сохраняет направленность на пользу для общины.
- source_word: ἐὰν μὴ
  choice: если не
  rationale: В русском сложном вопросительном предложении эта форма звучит естественнее, чем «если только не», и точно выражает отрицательное условие.
- source_word: ἐν ἀποκαλύψει / γνώσει / προφητείᾳ / διδαχῇ
  choice: через откровение / знание / пророчество / наставление
  rationale: «Через» передаёт инструментально-модальное значение ἐν и сохраняет параллелизм четырёх способов внятной, полезной речи.
- source_word: διδαχή
  choice: наставление
  rationale: В данном перечне означает сообщаемое учение или наставление; русский вариант естественен и не смешивает содержание речи с самим процессом преподавания.
theological_decisions:
- issue: Кого обозначает обращение ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет форму исходного слова, а сноска сообщает, что Павел мог обращаться так ко всей смешанной общине.
- issue: Смысл γλώσσαις в 1 Кор 12–14
  choice: на языках
  alternative: на иных языках; на наречиях
  rationale: Выражение сохраняет традиционное и контекстуально узнаваемое обозначение явления, не решая спорный вопрос о том, были ли это обычные человеческие языки или речь иного рода.
- issue: Соотношение четырёх предложных сочетаний с полезной речью
  choice: через откровение, знание, пророчество или наставление
  alternative: с откровением, знанием, пророчеством или наставлением
  rationale: Инструментальное «через» сохраняет открытость вопроса о точных границах и взаимосвязи этих категорий, не превращая их без основания в четыре строго обособленных вида служения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранены риторический вопрос, повтор «через» и четырёхчленный параллельный перечень; синтаксис слегка перестроен ради естественности русской речи.
