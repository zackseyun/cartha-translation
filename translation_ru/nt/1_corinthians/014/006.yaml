  source_fidelity: 'Основной текст в целом точно передаёт синтаксис, риторический вопрос и четыре параллельные категории греческого текста. Однако «говорить вам через откровение/знание…» в современном русском звучит не вполне естественно и может создавать чрезмерно техническое представление о канале сообщения. Конструкция «обратиться к вам с…» естественнее и сохраняет модальную открытость ἐν. Сноска b нуждается в уточнении: «наречия» не является буквальным значением γλῶσσαι в данном контексте, а лексическая альтернатива — «языки».'
