  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: ru
  text: Ведь если я молюсь на языке[a], то мой дух молится, но мой разум[b] бесплоден.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на человеческом языке». Греческое слово может обозначать человеческий язык либо «язык» в особом смысле речи, дарованной Духом, о которой говорится в этой главе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моё понимание бесплодно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Ведь если
  rationale: «Ведь» передаёт пояснительную силу γάρ и естественно связывает стих с ходом рассуждения, а «если» сохраняет условное значение ἐάν.
- source_word: προσεύχωμαι
  choice: я молюсь
  rationale: Настоящее время естественно передаёт форму настоящего времени в условной конструкции.
- source_word: γλώσσῃ
  choice: на языке
  rationale: В русском выражение «молиться на языке» сохраняет единственное число и допускает как значение человеческого языка, так и особый вид речи, обсуждаемый в этой главе.
- source_word: τὸ πνεῦμά μου
  choice: мой дух
  rationale: Буквально передаёт притяжательную конструкцию и сохраняет вероятное указание на дух самого молящегося, не добавляя прямого отождествления со Святым Духом.
- source_word: ὁ δὲ νοῦς μου
  choice: но мой разум
  rationale: «Разум» естественно выражает νοῦς и сохраняет противопоставление духу; возможный оттенок «понимание» отмечен в сноске.
- source_word: ἄκαρπός ἐστιν
  choice: остаётся бесплодным
  rationale: Сохраняет метафору ἄκαρπος и по-русски ясно выражает отсутствие результата или плода для разума в описанной ситуации.
theological_decisions:
- issue: К кому относится «мой дух» (τὸ πνεῦμά μου)
  choice: дух самого молящегося
  alternative: Святой Дух, действующий в молящемся
  rationale: Притяжательное «мой» и параллель с «моим разумом» указывают прежде всего на внутреннюю сторону самого человека. Формулировка «мой дух» при этом не исключает действия Святого Духа и не разрешает богословский вопрос сверх сказанного в тексте.
- issue: Характер γλώσσῃ
  choice: «на языке» с сохранением смысловой открытости
  alternative: «на ином языке» или «на незнакомом языке»
  rationale: В греческом тексте нет определений «иной» или «незнакомый». Нейтральная формулировка не решает заранее, идёт ли речь об обычном человеческом языке или о дарованной Духом речи.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и ясный. Сохранены противопоставление «дух — разум» и метафора бесплодности, а неоднозначность слова γλῶσσα вынесена в сноску.
