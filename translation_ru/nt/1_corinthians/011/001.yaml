  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: ru
  text: Подражайте мне, как и я подражаю Христу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мессии».'
    reason: Передаёт титульное значение греческого Χριστός («Помазанник»).
lexical_decisions:
- source_word: μιμηταί μου γίνεσθε
  choice: Подражайте мне
  rationale: Греческая конструкция буквально призывает стать подражателями Павла. Русское «подражайте мне» естественно и ясно передаёт побуждение следовать его примеру, сохраняя явную идею подражания.
- source_word: καθὼς κἀγὼ
  choice: как и я
  rationale: 'Передаёт сравнительную силу καθὼς и добавочное ударение καί в κἀγώ: Павел предлагает подражать ему в соответствии с тем, что сам подражает Христу.'
- source_word: Χριστοῦ
  choice: Христу
  rationale: При русском глаголе «подражать» требуется дательный падеж. «Христос» — укоренившееся в русском языке титульное обозначение Иисуса; вариант «Мессия» указан в примечании.
theological_decisions:
- issue: Восполнение эллипсиса во второй части стиха
  choice: как и я подражаю Христу
  alternative: как и я — Христу
  rationale: В греческом после κἀγὼ подразумевается ранее названное «подражатель». Повтор глагола в русском явно передаёт смысл эллипсиса и предотвращает неестественное или двусмысленное прочтение, не добавляя новой богословской мысли.
- issue: Передача Χριστοῦ
  choice: Христу
  alternative: Мессии
  rationale: «Христос» естественно и узнаваемо в современном литературном русском, тогда как «Мессия» прозрачнее раскрывает титульный смысл. Альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Греческий именной оборот передан естественным русским глагольным побуждением, а подразумеваемый элемент во второй части восстановлен ради ясности.
