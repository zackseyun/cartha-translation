  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: ru
  text: Каждый мужчина, который молится или пророчествует с чем-либо на голове[a], позорит свою голову[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному переводу: «с покрытой головой». Буквально по-гречески: «имея что-либо на голове» или «имеющееся/спускающееся с головы»; что именно имеется в виду, не уточняется.'
    reason: lexical_alternative
  - marker: b
    text: Греческое «голову» может обозначать его собственную голову в буквальном смысле и вместе с тем перекликаться с реляционным употреблением слова «глава» в ближайшем контексте.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: всякий мужчина
  rationale: ἀνήρ может означать мужчину или мужа, но параллель с «всякой женщиной» в ст. 5 поддерживает здесь общее обозначение лица мужского пола; «мужчина» не вносит преждевременно брачное толкование.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: который молится или пророчествует
  rationale: Причастия настоящего времени обозначают человека во время соответствующего действия; придаточное определительное естественно звучит по-русски и сохраняет прямой смысл обоих глаголов.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: имея что-либо на голове
  rationale: Греческое выражение буквально указывает на наличие чего-либо на голове или спускающегося с неё, не называя конкретного предмета. Формулировка сохраняет эту недосказанность.
- source_word: καταισχύνει
  choice: позорит
  rationale: Глагол означает навлекать стыд, бесчестить. «Позорит» естественно сочетается с дополнением «свою голову» и передаёт категорию чести и стыда.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: свою голову
  rationale: Возвратное «свою» естественно по-русски при соотнесении с подлежащим и сохраняет возможность как буквального, так и контекстуально-реляционного понимания слова «голова».
theological_decisions:
- issue: Следует ли прямо определить последнюю κεφαλή как физическую голову или как того, кто является «главой» мужчины
  choice: Сохранить двусмысленность посредством «свою голову»
  alternative: «свою физическую голову» или «того, кто является его главой»
  rationale: В контексте возможна словесная перекличка между физической головой и реляционным употреблением «головы/главы» в ст. 3. Основной текст не должен устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. «Пророчествует» сохранено как прозрачный библейский термин. Необычная конструкция «имея что-либо на голове» намеренно отражает недосказанность греческого выражения; традиционный вариант вынесен в примечание.
