base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: ru
  text: Ведь всякий раз, когда вы едите этот хлеб и пьёте из чаши[a], вы возвещаете смерть Господа — пока Он не придёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пьёте чашу». В греческом здесь «чашу», а не «эту чашу», хотя из ближайшего контекста ясно, о какой чаше идёт речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: всякий раз, когда
  rationale: 'Передаёт неопределённо-повторительное значение сочетания: это совершается каждый раз, когда происходят названные действия.'
- source_word: γὰρ
  choice: смысловая связь передана без отдельного союза
  rationale: Частица вводит пояснение к предыдущему наставлению. В русском отдельное «ибо» здесь звучало бы книжно и менее естественно; пояснительная связь ясна из контекста.
- source_word: ἐσθίητε
  choice: едите
  rationale: Настоящее сослагательное в неопределённом временном придаточном естественно передаётся русским настоящим временем.
- source_word: τὸν ἄρτον τοῦτον
  choice: этот хлеб
  rationale: Точно передаёт существительное ἄρτος и указательное местоимение τοῦτον.
- source_word: τὸ ποτήριον πίνητε
  choice: пьёте из чаши
  rationale: По-русски естественно говорят «пить из чаши»; определённость греческого артикля сохраняется словом «чаши» в данном контексте, без добавления отсутствующего указательного «этой».
- source_word: καταγγέλλετε
  choice: возвещаете
  rationale: Передаёт публичный, декларативный смысл глагола и сохраняет торжественный, но понятный современный регистр.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: смерть Господа
  rationale: Естественно и точно передаёт греческую родительную конструкцию.
- source_word: κυρίου
  choice: Господа
  rationale: «Господь» соответствует обычному значению κύριος в данном христологическом контексте.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: пока Он не придёт
  rationale: Естественная русская временная конструкция, обозначающая предел продолжающегося возвещения; подразумеваемый субъект — Господь.
theological_decisions:
- issue: Подразумеваемый субъект в ἄχρι οὗ ἔλθῃ
  choice: «Он» относится к Господу Иисусу
  alternative: Безличная или неопределённая передача субъекта
  rationale: Ближайший и естественный антецедент — «Господь»; заглавная буква помогает русскому читателю распознать этот референт, не добавляя нового содержания.
- issue: Евхаристическая/сакраментальная формулировка
  choice: Прямо назвать вкушение хлеба, питьё из чаши и возвещение смерти Господа
  alternative: Сакраментализирующая либо чисто мемориалистская парафраза
  rationale: Стих утверждает, что совершаемое возвещает смерть Господа, но не излагает здесь полной богословской теории Вечери; перевод не разрешает эту напряжённость за текст.
translation_notes:
  register: Современный литературный русский с достоинством литургического контекста. «Возвещаете» сохраняет торжественность без архаизма; тире перед заключительной временной фразой подчёркивает предел действия. Маркер сноски помещён сразу после соответствующего выражения.
