lexical_decisions:
- source_word: κρινόμενοι
  choice: когда Господь судит нас
  rationale: Настоящее страдательное причастие передано временной конструкцией. «Судит» сохраняет судебный смысл κρίνω и не смешивает его с более сильным κατακρίνω — «осуждать».
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкое противопоставление предшествующему предупреждению о суде.
- source_word: ὑπὸ κυρίου
  choice: Господь ... нас
  rationale: Греческая конструкция с указанием действующего лица естественно преобразована в русское действительное предложение; κύριος передано традиционным и современно понятным словом «Господь» без добавления имени.
- source_word: παιδευόμεθα
  choice: Он вразумляет нас
  rationale: В контексте Божьего исправляющего воздействия «вразумляет» выражает воспитательную и исправительную, а не только карательную сторону παιδεύω. Повторение «нас» делает синтаксис ясным.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Естественно сохраняет целевое значение греческой конструкции.
- source_word: σὺν τῷ κόσμῳ
  choice: вместе с миром
  rationale: Передаёт совместность и общую участь; «мир» сохраняет собирательный характер κόσμος.
- source_word: κατακριθῶμεν
  choice: мы не были осуждены
  rationale: «Осуждены» передаёт неблагоприятный окончательный приговор и сохраняет отличие от более общего «судит» в начале стиха.
theological_decisions:
- issue: Соотношение нынешнего суда Господа и осуждения мира
  choice: Текст различает исправляющее воздействие Господа сейчас и осуждение вместе с миром, которого оно призвано не допустить.
  alternative: Стих можно понимать шире — как речь о временном наказании, не делая явного разграничения между верующими и неверующими.
  rationale: Контраст κρίνω и κατακρίνω, значение παιδεύω и целевая конструкция ἵνα μὴ указывают на исправительную цель нынешнего суда. Перевод сохраняет это различие, не вводя дополнительных положений о стойкости спасения или действенности таинства.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Вразумляет» выбрано вместо архаичного «наказывает» или книжного «подвергает взысканию», чтобы сохранить воспитательно-исправительный оттенок.
