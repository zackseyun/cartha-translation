  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: ru
  text: 'Но хочу, чтобы вы знали: глава[a] каждого мужчины — Мессия, глава женщины[b] — мужчина, а глава Мессии — Бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «глава» здесь может также пониматься в смысле «источник» или «тот, кто имеет власть над»; в основном тексте сохранена греческая метафора.
    reason: lexical_alternative
  - marker: b
    text: Слова «женщина» и «мужчина» здесь можно также понимать как «жена» и «муж».
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: Но хочу, чтобы вы знали
  rationale: Естественно передаёт личное намерение Павла и мягкий переход, выраженный δέ; подразумеваемое в греческом «я» по-русски можно не выражать.
- source_word: παντὸς ἀνδρὸς
  choice: всякому мужчине
  rationale: ἀνήρ здесь естественнее всего понимать как «мужчина»; дательный после «глава» позволяет сохранить параллельную и сжатую конструкцию.
- source_word: κεφαλή
  choice: глава
  rationale: Сохраняет греческую метафору и её богословскую неоднозначность, не сводя её ни к «источнику», ни к «власти»; в библейском регистре «глава» естественнее метафорического «голова».
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: Мессия / Мессии
  rationale: Χριστός употреблено как титул; «Мессия» передаёт его смысл и соответствует контексту предикативных отношений.
- source_word: γυναικὸς ὁ ἀνήρ
  choice: женщине — мужчина
  rationale: γυνή и ἀνήρ могут обозначать как женщину и мужчину, так и жену и мужа. В основном тексте сохранено общее значение, а супружеское прочтение отмечено в сноске.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная и прямая передача θεός; предложение оставлено без поясняющей догматической парафразы.
theological_decisions:
- issue: Значение метафоры κεφαλή в трёх параллельных высказываниях
  choice: Сохранить метафору словом «глава»
  alternative: «источник» или «тот, кто имеет власть над»
  rationale: Греческое слово допускает спорные контекстуальные толкования. Перевод не должен разрешать этот богословский спор вместо исходного текста.
- issue: Значение ἀνήρ / γυνή
  choice: «мужчина / женщина» в основном тексте
  alternative: «муж / жена»
  rationale: Широкий параллелизм стиха поддерживает общее прочтение, но лексика и контекст допускают супружеское; эта возможность сохранена в сноске.
- issue: Финальное утверждение о Мессии и Боге
  choice: «глава Мессии — Бог»
  alternative: Интерпретирующая парафраза о функциональном порядке
  rationale: Буквальная метафорическая формулировка сохраняет напряжение текста и не вводит объяснения, которого нет в греческом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Двоеточие и тире естественно передают три параллельные именные конструкции; союз «а» выделяет завершающий член ряда. Все сноски отмечены в основном тексте.
