base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: ru
  text: Ведь во время еды каждый принимается за свой ужин раньше других[a], и один голоден, а другой напивается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый берётся за свою еду раньше других»; греческий глагол может подчёркивать как действие заранее, так и то, что человек начинает, не дожидаясь остальных.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «один голоден, а другой пьян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: каждый
  rationale: Сохраняет распределительное значение единственного числа и естественно звучит по-русски.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим упрёком естественным русским дискурсивным средством.
- source_word: τὸ ἴδιον δεῖπνον
  choice: свой собственный ужин
  rationale: «Ужин» передаёт δεῖπνον как основную, обычно вечернюю трапезу, а сочетание «свой собственный» подчёркивает частное владение в противоположность общей трапезе.
- source_word: προλαμβάνει
  choice: спешит приняться за
  rationale: Передаёт действие прежде других и инициативу без ожидания остальных, не исключая значения «берёт заранее».
- source_word: ἐν τῷ φαγεῖν
  choice: когда едят
  rationale: Естественно и без лишнего расширения передаёт временное значение конструкции с артиклевым инфинитивом.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: один ... другой
  rationale: Кратко и естественно передаёт сопоставительную конструкцию.
- source_word: πεινᾷ
  choice: остаётся голодным
  rationale: В контексте ясно выражает результат неравного участия в трапезе; буквальное «голоден» возможно, но менее связно по-русски.
- source_word: μεθύει
  choice: напивается
  rationale: Передаёт реальное опьянение и допускаемую глаголом динамику наступления этого состояния, не смягчая упрёк.
theological_decisions:
- issue: Характер злоупотребления во время Вечери Господней
  choice: напивается
  alternative: пьян
  rationale: Греческий глагол обозначает состояние или наступление опьянения; перевод не смягчает текст до простого излишества, но и не добавляет доктринальных выводов.
- issue: Частная трапеза в противоположность общей
  choice: свой собственный ужин
  alternative: свою еду
  rationale: Усиленное выражение сохраняет контраст между частным присвоением пищи и общинным характером собрания, явный из контекста, без конфессиональной конкретизации.
- issue: Связь двух итоговых состояний с поведением участников
  choice: так что один остаётся голодным, а другой напивается
  alternative: и один голоден, а другой пьян
  rationale: «Так что» делает естественной подразумеваемую результативную связь, однако более формальное простое соединение также возможно; богословское напряжение между лишением одних и избытком других сохранено.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя и сохраняющий достоинство апостольского упрёка. «Ведь» естественно вводит объяснение; «ужин» поддерживает связь с последующим упоминанием Вечери Господней. Формулировка избегает архаизмов и конфессионально нагруженных добавлений.
