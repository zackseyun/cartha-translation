source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: ru
  text: Я хвалю вас за то, что вы во всём помните обо мне и твёрдо держитесь преданий именно так, как я передал их вам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учений»; или: «наставлений». Греческое слово буквально обозначает «предания», то есть то, что было передано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: Я хвалю
  rationale: Прямо передаёт положительную оценку Павла и сохраняет личную форму высказывания.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица обозначает мягкий переход; в современном русском начале фразы такой переход естественно передаётся самим ходом речи, без добавления «теперь» или усиленного противопоставления.
- source_word: πάντα μου μέμνησθε
  choice: вы во всём помните обо мне
  rationale: Передаёт широкий охват πάντα и продолжающееся памятование, не превращая выражение в менее естественное «помните всё моё».
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: именно так, как я передал их вам
  rationale: «Именно так, как» ясно выражает соответствие, заложенное в καθὼς; «передал» сохраняет смысл передачи полученного учения или установлений.
- source_word: τὰς παραδόσεις
  choice: преданий
  rationale: «Предания» лексически прозрачно передаёт то, что было передано, и сохраняет связь с глаголом «передал», не сводя смысл только к отвлечённому учению.
- source_word: κατέχετε
  choice: твёрдо держитесь
  rationale: Передаёт активное сохранение и приверженность; выражение понятно современному читателю и не звучит архаично.
theological_decisions:
- issue: Значение παραδόσεις в контексте апостольской передачи
  choice: предания
  alternative: учения; наставления
  rationale: Текст говорит о содержании и практике, переданных Павлом коринфянам. «Предания» сохраняет категорию переданного и словесную связь с «передал», но само по себе не утверждает более поздних конфессиональных представлений о церковном Предании.
translation_notes:
  register: Современный литературный русский язык с достоинством и без избыточной архаизации. Формулировка сохраняет положительный тон, связь «предания — передал» и возможную широту выражения πάντα.
