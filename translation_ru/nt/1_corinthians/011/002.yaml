  terminology: «Предания» удачно сохраняет смысл παραδόσεις как того, что было передано, и словесную связь с «передал», не навязывая позднейших конфессиональных выводов. Сноска корректно предлагает «учения» и «наставления» как контекстуальные альтернативы.
