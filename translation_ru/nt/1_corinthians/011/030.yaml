  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: ru
  text: По этой причине многие среди вас слабы и больны, и немало уснули[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть умерли. Здесь «уснули» — образное обозначение смерти.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: По этой причине
  rationale: Передаёт явную причинную связь с недостойным участием в Вечере Господней, о котором говорится выше.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Обозначает положение дел внутри коринфской общины, а не состояние внутри отдельных людей.
- source_word: πολλοὶ
  choice: многие
  rationale: Прямой и естественный перевод субстантивированного количественного прилагательного.
- source_word: ἀσθενεῖς
  choice: слабы
  rationale: Сохраняет общее значение физической слабости и отличие от следующего, более определённого обозначения болезни.
- source_word: ἄρρωστοι
  choice: больны
  rationale: Естественно обозначает болезнь и не смешивается со словом «слабы».
- source_word: κοιμῶνται
  choice: уснули
  rationale: Сохраняет метафору сна, которая в данном контексте означает смерть, не заменяя образ истолкованием в основном тексте.
- source_word: ἱκανοί
  choice: немало
  rationale: Передаёт значение значительного числа и избегает механического повтора слова «многие».
theological_decisions:
- issue: Следует ли передавать κοιμῶνται буквально как сон или прямо как смерть
  choice: Метафора смерти сохранена в основном тексте словом «уснули»
  alternative: «умерли» или буквальное понимание обычного сна
  rationale: Последовательность «слабы — больны — уснули» и контекст Божьего суда указывают на смерть, однако сохранение метафоры не устраняет образность и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Метафора сна сохранена без конфессионально обусловленного толкования.
