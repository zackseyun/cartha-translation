revisions:
- from: Однако в Господе ни женщина не существует независимо от мужчины, ни мужчина — независимо от женщины.[a]
  to: Однако в Господе женщина не отделена от мужчины, как и мужчина — от женщины.[a]
  rationale: Исправление устраняет неоправданную экспликацию «существует независимо», сохраняя взаимную симметрию, общий смысл γυνή/ἀνήρ и традиционную павловскую формулу «в Господе». Союз «как и» естественно передаёт вторую часть греческой корреляции οὔτε … οὔτε без смысловой потери.
  reviewer_model: gpt-5.6-terra
