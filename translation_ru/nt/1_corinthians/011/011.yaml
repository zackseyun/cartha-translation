base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: ru
  text: Однако в Господе женщина не отделена от мужчины, как и мужчина — от женщины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жена не отделена от мужа, как и муж — от жены». Греческие слова могут означать как женщину и мужчину, так и жену и мужа; в основном тексте выбран более широкий смысл, поскольку утверждение выглядит общим, а не ограниченным браком.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Однако
  rationale: Передаёт уточняющий и уравновешивающий поворот мысли Павла после предшествующего рассуждения.
- source_word: γυνή
  choice: женщина
  rationale: Слово может означать также «жена», но общий контекст о мужчине и женщине и взаимность утверждения поддерживают более широкое значение.
- source_word: ἀνήρ
  choice: мужчина
  rationale: Слово может означать также «муж», однако здесь вероятнее общее обозначение мужчины в паре с γυνή.
- source_word: χωρίς
  choice: независимо от
  rationale: В данном взаимном утверждении выражает не простое физическое отсутствие, а невозможность обособленного, независимого положения; добавление «не существует» делает эту связь естественной по-русски.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерную для Павла формулу, обозначающую сферу жизни и отношений, определяемую Господом, без сужения её смысла.
- source_word: οὔτε ... οὔτε
  choice: ни ... ни
  rationale: Точно сохраняет симметричное двойное отрицание исходного текста.
theological_decisions:
- issue: Передача γυνή / ἀνήρ как «женщина/мужчина» или «жена/муж»
  choice: женщина/мужчина
  alternative: жена/муж
  rationale: Непосредственный контекст говорит о мужчине и женщине в творении и богослужении, а стих формулирует общее взаимное соотношение «в Господе». При этом лексическая возможность брачного значения сохраняется в примечании.
- issue: Смысл взаимного отрицания с χωρίς
  choice: не существует независимо от
  alternative: не бывает без / не отделена от
  rationale: Формулировка передаёт взаимозависимость, не превращая стих в утверждение лишь о физическом присутствии и не уточняя сверх текста природу этой зависимости.
translation_notes:
  register: Современный литературный русский язык; сохранены достоинство, симметрия исходной конструкции и традиционная формула «в Господе». Тире во второй части естественно восполняет опущенное сказуемое.
