  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: ru
  text: Ведь среди вас должны быть и расколы[a], чтобы среди вас стали явными и те, кто выдержал испытание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «группировки», «секты»; в более позднем употреблении — «ереси». Здесь, вероятнее всего, имеются в виду разделяющие общину группировки.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «те, кто признан достойным», «подлинные», «прошедшие проверку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: должны быть
  rationale: Передаёт сильное значение необходимости, не уточняя, идёт ли речь о Божьем замысле, логической необходимости или практической неизбежности.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно для современного русского языка сохраняет пояснительную связь с предыдущей мыслью.
- source_word: καὶ αἱρέσεις
  choice: и разногласия
  rationale: В данном контексте слово обозначает разделяющие общину группировки или расколы, а не позднейшее специальное понятие догматической ереси.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Передаёт существование разделений внутри общины и сохраняет повтор этой формулы в конце стиха.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет возможный оттенок как цели, так и результата, не принуждая читателя к одному толкованию.
- source_word: καὶ οἱ δόκιμοι
  choice: и те, кто выдержал испытание
  rationale: Передаёт смысл проверенной подлинности и сохраняет второе καί как «и».
- source_word: φανεροὶ γένωνται
  choice: стали явными
  rationale: Сохраняет значение перехода к открытой видимости, выраженное сочетанием прилагательного с γένωνται.
theological_decisions:
- issue: Передача αἱρέσεις
  choice: разногласия
  alternative: расколы; группировки; секты; ереси
  rationale: Ближайший контекст касается разделений внутри коринфской общины. «Ереси» могло бы преждевременно внести позднейший догматический смысл; примечание сохраняет лексическую широту.
- issue: Сила δεῖ
  choice: должны быть
  alternative: неизбежны; необходимо, чтобы были
  rationale: Формулировка сохраняет утверждение необходимости, но не определяет её источник и тем самым не снимает богословское напряжение текста.
- issue: Отношение ἵνα к необходимости разделений
  choice: чтобы
  alternative: так что; в результате чего
  rationale: Греческая конструкция допускает целевой или результативный оттенок. Русский союз «чтобы» сохраняет сильную связь, не добавляя прямого утверждения о том, что Бог является причиной разделений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. «Ведь» естественно вводит пояснение; повтор «среди вас» сохранён ради риторического обрамления оригинала. Формулировка избегает конфессионально нагруженного употребления слова «ереси» в основном тексте.
