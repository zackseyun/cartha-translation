  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: ru
  text: Ибо мужчина[a] не должен покрывать голову[b], ведь он — образ и слава Бога; женщина же — слава мужчины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческие слова ἀνήρ и γυνή могут также означать «муж» и «жена»; тогда весь стих можно понимать применительно к супругам.
    reason: alternative_reading
  - marker: b
    text: 'Или: «покрывать голову покрывалом»; греческий текст говорит в более общем смысле: «покрывать голову».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: мужчина
  rationale: В контексте противопоставления мужского и женского пола это естественное родовое обозначение; значение «муж» возможно и отмечено в сноске.
- source_word: ὀφείλει
  choice: не должен
  rationale: Передаёт нормативную обязанность естественным современным русским языком, не усиливая её до отдельного категорического приказа.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: покрывать голову
  rationale: Сохраняет общую формулировку греческого текста и не уточняет без необходимости, идёт ли речь именно о покрывале.
- source_word: εἰκὼν
  choice: образ
  rationale: Обычный богословски значимый эквивалент, сохраняющий вероятную отсылку к повествованию о сотворении.
- source_word: δόξα
  choice: слава
  rationale: Один и тот же эквивалент в обоих случаях сохраняет параллелизм, широту значения и напряжённость утверждения.
- source_word: ὑπάρχων
  choice: потому что он —
  rationale: Причастие сообщает основание предшествующей нормы; причинная связь ясно и естественно выражена по-русски.
- source_word: ἡ γυνὴ
  choice: женщина
  rationale: Передаёт родовое противопоставление мужчине; возможное значение «жена» отмечено в сноске.
- source_word: ἀνδρός
  choice: мужчины
  rationale: Согласуется с родовым значением ἀνήρ в первой части стиха и не ограничивает утверждение отношениями супругов.
theological_decisions:
- issue: Передавать ли ἀνήρ/γυνή как «мужчина/женщина» или «муж/жена»
  choice: мужчина/женщина
  alternative: муж/жена
  rationale: Контекст связывает противопоставление с мужским и женским полом, покрытием головы и сотворением, поэтому более широкий вариант предпочтителен; лексическая неоднозначность сохранена в сноске.
- issue: Следует ли смягчить асимметричное утверждение о славе
  choice: сохранить прямое «женщина — слава мужчины»
  alternative: «женщина отражает славу мужчины» или «женщина — честь мужчины»
  rationale: В греческом тексте употреблены прямое именное сказуемое и одно и то же слово δόξα; перевод не должен объяснять или сглаживать богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис краток и близок к структуре оригинала; тире естественно оформляет именные сказуемые. Сноска помещена после первого контекстуально неоднозначного термина и охватывает соответствующую пару слов во всём стихе.
