  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: ru
  text: Но всякая женщина, которая молится или пророчествует с непокрытой головой[b], позорит свою голову[a], ведь это то же самое, что быть обритой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякая жена, которая молится или пророчествует… позорит своего мужа (свою „главу“)». Греческое слово γυνή может означать как «женщина», так и «жена»; слово «голова» в данном контексте может пониматься буквально или метафорически, в том числе как муж.'
    reason: alternative_reading
  - marker: b
    text: Слово «непокрытая» само по себе не уточняет вид покрытия; толкователи расходятся во мнениях, идёт ли речь именно о покрывале или, шире, о непокрытой голове.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: женщина
  rationale: Слово может означать «женщина» или «жена». В непосредственной конструкции речь естественнее всего понимается обобщённо; вариант «жена» отмечен в сноске.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: которая молится или пророчествует
  rationale: Относительное придаточное естественно передаёт причастия настоящего времени и обозначает совершаемые действия.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: с непокрытой головой
  rationale: Передаёт состояние головы, не уточняя сверх текста, идёт ли речь именно о покрывале, причёске или ином покрытии.
- source_word: καταισχύνει
  choice: позорит
  rationale: Глагол выражает причинение стыда или бесчестия; «позорит» естественно передаёт социальный оттенок публичного бесчестия.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: свою голову
  rationale: Русское возвратное местоимение естественно указывает на субъект, а слово «голову» сохраняет возможность буквального и метафорического понимания.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: потому что это одно и то же
  rationale: Передаёт подчёркнутое тождество, выраженное греческой идиомой.
- source_word: τῇ ἐξυρημένῃ
  choice: как если бы она была обрита
  rationale: Передаёт результирующее состояние после бритья и восполняет подразумеваемое сравнение естественным русским оборотом.
theological_decisions:
- issue: Значение второго κεφαλή в выражении «позорит свою голову»
  choice: Сохранить неоднозначное «свою голову» без уточнения.
  alternative: Физическая голова; либо метафорическая «глава», то есть муж или супруг в логике контекста.
  rationale: Греческая формулировка допускает буквальное прочтение, тогда как контекст поднимает возможность метафорического. Основной текст не должен устранять эту напряжённость.
- issue: Характер покрытия в слове ἀκατακαλύπτῳ
  choice: 'Передать обобщённо: «с непокрытой головой».'
  alternative: Без покрывала; с распущенными или иначе непокрытыми волосами.
  rationale: Прилагательное указывает на отсутствие покрытия, но само по себе не определяет его точный вид.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сделан естественным для обычного читателя; неоднозначность слов «женщина/жена» и «голова/глава», а также точный вид покрытия не разрешены догматически и отражены в сносках.
