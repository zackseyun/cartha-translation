  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: ru
  text: Поэтому женщина должна иметь власть на голове[a] из-за ангелов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более истолковательном переводе: «должна носить на голове знак власти». В греческом тексте сказано «власть»; слов «знак» или «покрывало» в нём нет.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из-за вестников», хотя значение «ангелов» здесь вероятнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт вывод из предшествующего рассуждения Павла.
- source_word: ὀφείλει
  choice: должна
  rationale: Передаёт обязанность или должное, не усиливая её до формулы безусловного юридического приказа.
- source_word: ἡ γυνὴ
  choice: женщина
  rationale: Сохраняет обобщённое единственное число в контексте рассуждения о мужчине и женщине; значение «жена» здесь не обязательно.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Прямо передаёт греческое слово, не добавляя отсутствующих в тексте понятий «знак» или «покрывало».
- source_word: ἔχειν
  choice: иметь
  rationale: Сохраняет обычное значение инфинитива; перевод «носить» был бы контекстуальным истолкованием.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: на голове
  rationale: Естественный русский пространственный оборот, сохраняющий смысловую открытость греческой фразы.
- source_word: διὰ τοὺς ἀγγέλους
  choice: ради ангелов
  rationale: Передаёт мотивирующее основание διά с винительным; «ангелы» — наиболее вероятное значение ἄγγελοι в данном контексте.
theological_decisions:
- issue: Значение ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς
  choice: Сохранить формулировку «иметь власть на голове».
  alternative: «носить на голове знак власти» или «иметь покрывало как знак власти»
  rationale: В греческом тексте нет слов «знак» и «покрывало». Поскольку выражение спорно, основной текст сохраняет его необычность, а распространённое толкование вынесено в сноску.
- issue: Референт ἀγγέλους
  choice: ангелов
  alternative: вестников
  rationale: Хотя ἄγγελος может обозначать вестника, неуточнённое множественное число у Павла вероятнее указывает на небесных существ; конкретная причина их упоминания остаётся неразъяснённой.
- issue: Объём значения γυνή
  choice: женщина
  alternative: жена
  rationale: Более широкий контекст говорит о мужчине и женщине как таковых и не требует ограничения смысла брачными отношениями.
translation_notes:
  register: Современный литературный русский язык. Необычное и спорное выражение «иметь власть на голове» намеренно сохранено, чтобы не подменять перевод одним из толкований. Маркеры сносок поставлены непосредственно после относящихся к ним выражений.
