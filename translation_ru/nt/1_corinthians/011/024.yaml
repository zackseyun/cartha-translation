base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: ru
  text: 'И, возблагодарив, преломил его и сказал: «Это Моё тело — за вас[a]. Делайте это в воспоминание обо Мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях после слов «за вас» добавлено «преломляемое»: «Это Моё тело, преломляемое за вас».'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: возблагодарив
  rationale: Аористное причастие обозначает действие, предшествующее преломлению хлеба. Деепричастие естественно и кратко передаёт эту последовательность.
- source_word: ἔκλασεν
  choice: преломил его
  rationale: В контексте речь идёт о хлебе; местоимение делает подразумеваемое дополнение ясным. «Преломил» сохраняет значение ломания хлеба и соответствует принятому литературному употреблению.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: Это Моё тело
  rationale: Прямо передаёт связочную конструкцию и не заменяет «есть» толкованием вроде «означает» или «символизирует».
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: которое за вас
  rationale: Краткая формулировка сохраняет значение пользы и действия ради адресатов, не добавляя отсутствующего в греческом глагола и не закрепляя частную теорию искупления.
- source_word: τοῦτο ποιεῖτε
  choice: Делайте это
  rationale: Несовершенный вид русского императива естественно допускает продолжающееся и повторяющееся совершение, соответствуя настоящему императиву ποιεῖτε без тяжеловесного уточнения «продолжайте делать».
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: в воспоминание обо Мне
  rationale: Передаёт активное памятование и установительное значение ἀνάμνησις; формулировка литературна и не сводит выражение к отвлечённой памяти.
theological_decisions:
- issue: Смысл слов «Это Моё тело» в евхаристическом контексте
  choice: Сохранена прямая формулировка «Это Моё тело».
  alternative: «Это означает Моё тело» или «Это символ Моего тела».
  rationale: Греческая связочная конструкция сама по себе не разъясняет способ присутствия Христа; буквальная передача сохраняет богословское напряжение и не решает позднейший конфессиональный спор средствами перевода.
- issue: Смысл ὑπὲρ ὑμῶν
  choice: «за вас»
  alternative: «ради вас» или «для вас»
  rationale: «За вас» сохраняет как благотворный, так и возможный заместительный оттенок ὑπέρ, не превращая его в техническую формулу определённой теории искупления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся ко Христу, написаны с прописной буквы. Эллиптическое «которое за вас» намеренно сохраняет сжатость греческого текста; повторное действие выражено несовершенным видом «делайте».
