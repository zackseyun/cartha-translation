  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: ru
  text: Разве сама природа[b] не учит вас, что если мужчина носит длинные волосы[a], то это бесчестье для него?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отращивает длинные волосы»; или: «имеет длинные волосы». Греческий глагол означает носить или иметь длинные волосы.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сама природа» может указывать на сотворённый порядок, общее человеческое восприятие или на то, что в культуре считается естественно подобающим; греческий текст здесь не уточняет смысл.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: Разве не
  rationale: Передаёт отрицательную риторическую вопросительность и естественно продолжает предшествующий довод.
- source_word: ἡ φύσις αὐτὴ
  choice: сама природа
  rationale: Сохраняет усиление αὐτή и не сужает значение φύσις до одной лишь биологии или общественного обычая.
- source_word: διδάσκει ὑμᾶς
  choice: учит вас
  rationale: Прямой и естественный эквивалент, сохраняющий дидактический смысл настоящего времени.
- source_word: ἀνὴρ
  choice: мужчина
  rationale: В данном противопоставлении речь идёт о мужчине, а не специально о муже.
- source_word: μὲν
  choice: не выражено отдельно
  rationale: Частица намечает противопоставление, завершаемое в следующем стихе; отдельное «с одной стороны» здесь по-русски было бы тяжеловесно.
- source_word: ἐὰν κομᾷ
  choice: если мужчина носит длинные волосы
  rationale: Передаёт значение ношения или наличия длинных волос и звучит естественно в современном русском языке.
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: то это бесчестит его
  rationale: Идиоматично передаёт, что длинные волосы являются для мужчины бесчестием, не усиливая значение до «позора».
theological_decisions:
- issue: Значение φύσις в доводе Павла
  choice: «сама природа» без уточнения референта
  alternative: «сотворённый порядок», «естественное человеческое восприятие» или «то, что культура считает естественно подобающим»
  rationale: Греческое слово здесь не определяет однозначно, идёт ли речь о сотворённом порядке, общем восприятии или культурно обусловленном представлении о естественном; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос передан естественно и с достоинством. Формулировка сохраняет смысловую широту слова «природа» и связь с последующим противопоставлением.
