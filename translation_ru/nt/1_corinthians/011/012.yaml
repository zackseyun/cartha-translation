id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: ru
  text: Ибо как женщина — от мужчины[a], так и мужчина — через женщину; но всё — от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жена — от мужа» и далее «муж — через жену», если понимать слова в более узком, супружеском смысле.'
    reason: Альтернативное значение слов γυνή и ἀνήρ.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ибо как
  rationale: Передаёт и пояснительное значение γάρ, и сравнительную конструкцию ὥσπερ… οὕτως.
- source_word: ἡ γυνή
  choice: женщина
  rationale: 'В данном контексте γυνή имеет обобщённое значение: речь идёт о взаимосвязи мужчины и женщины в творении и рождении, а не только о супругах.'
- source_word: ἐκ τοῦ ἀνδρός
  choice: от мужчины
  rationale: Предлог ἐκ обозначает источник или происхождение и сохраняет отсылку к сотворению женщины из мужчины.
- source_word: ὁ ἀνήρ
  choice: мужчина
  rationale: Обобщённое «мужчина» соответствует параллельному употреблению γυνή и не сужает смысл до отношений мужа и жены.
- source_word: διὰ τῆς γυναικός
  choice: через женщину
  rationale: 'διά с родительным падежом указывает на посредство: мужчина появляется на свет через женщину. Формулировка сохраняет отличие от ἐκ — «от».'
- source_word: τὰ δὲ πάντα
  choice: но всё
  rationale: δέ выражает мягкое противопоставление и переход к окончательному источнику всего; единственное собирательное «всё» естественно по-русски.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Передаёт ἐκ как указание на источник и естественно выражает мысль об окончательном происхождении всего от Бога.
theological_decisions:
- issue: Значение γυνή и ἀνήρ
  choice: «женщина» и «мужчина» в общем смысле
  alternative: «жена» и «муж» в супружеском смысле
  rationale: Упоминание сотворения женщины из мужчины и рождения мужчины через женщину расширяет смысл за пределы одной супружеской пары; при этом возможное супружеское прочтение отмечено в сноске.
- issue: Соотношение происхождения мужчины и женщины
  choice: сохранить различие между «от» (ἐκ) и «через» (διά)
  alternative: передать оба отношения одним предлогом «от»
  rationale: 'Различие предлогов отражает разные аспекты мысли Павла: происхождение женщины из мужчины при сотворении и появление мужчины на свет через женщину. Это сохраняет взаимность и напряжение исходного текста.'
translation_notes:
  register: Современный литературный русский язык. Краткий параллелизм оригинала сохранён; тире подчёркивают отношения происхождения и делают фразу естественной и ясной.
