source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: ru
  text: Ведь если женщина не покрывает голову[a], пусть тогда и острижётся. Но если женщине постыдно быть остриженной или обритой, пусть покрывает голову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жена»; греческое слово может означать как женщину, так и жену — в зависимости от контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: не покрывает голову / пусть покрывает голову
  rationale: Глагол означает «покрывать, закрывать, носить покрывало». В русском для ясности естественно выразить подразумеваемый контекстом объект «голову», не уточняя вид покрытия.
- source_word: γυνή / γυναικί
  choice: женщина / женщине
  rationale: Слово может означать как женщину, так и жену. Здесь формулировка сама по себе не называет мужа, поэтому более широкое значение сохранено в тексте, а возможное «жена» отмечено в сноске.
- source_word: κειράσθω
  choice: пусть тогда и острижётся
  rationale: Глагол обозначает остригание, обычно короткое или полное, и здесь употреблён как риторическое следствие. «Острижётся» естественно по-русски и не смешивает остригание с последующим ξυρᾶσθαι — обритием.
- source_word: καί
  choice: тогда и
  rationale: Частица связывает риторическое следствие с условием; сочетание «тогда и» ясно передаёт ход довода.
- source_word: αἰσχρόν
  choice: постыдно
  rationale: Передаёт связанную с общественным стыдом и бесчестием оценку, не усиливая её до специального богословского термина.
- source_word: τὸ κείρασθαι
  choice: быть остриженной
  rationale: Субстантивированный инфинитив обозначает состояние после остригания и сохраняет отличие от обривания.
- source_word: ξυρᾶσθαι
  choice: быть обритой
  rationale: Точно передаёт бритьё и сохраняет контраст с остриганием.
- source_word: γὰρ ... δὲ
  choice: ведь ... но
  rationale: «Ведь» естественно вводит обоснование предыдущей мысли, а «но» обозначает противопоставление внутри довода.
theological_decisions:
- issue: Следует ли передавать γυνή как «женщина» или «жена»
  choice: женщина
  alternative: жена
  rationale: В самом стихе муж прямо не упоминается, поэтому «женщина» сохраняет более широкий смысл и не ограничивает утверждение только замужними; контекстуально возможное значение «жена» отмечено в сноске.
- issue: Следует ли конкретизировать покрытие как определённый вид покрывала
  choice: покрывать голову
  alternative: быть под покрывалом / носить покрывало
  rationale: Греческий глагол говорит о покрытии, тогда как голова подразумевается контекстом. Перевод не должен без необходимости определять конкретный предмет или способ покрытия.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет условно-риторический ход оригинала. «Острижётся» и «обритой» различены, а вид головного покрытия намеренно не конкретизирован.
