  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: ru
  text: 'Так же, после вечери, Он взял чашу и сказал[a]: «Эта чаша — новый завет в Моей крови. Делайте это всякий раз, когда пьёте её, в воспоминание обо Мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «Так же и чашу после вечери, говоря»; глагол «взял» подразумевается по параллели с предыдущим стихом.'
    reason: Указание на синтаксический эллипсис оригинала
lexical_decisions:
- source_word: ὡσαύτως καὶ τὸ ποτήριον
  choice: Так же и чашу
  rationale: 'Сохраняется эллиптическая параллель с предшествующим действием над хлебом: глагол действия подразумевается, как и в греческом тексте. Это позволяет не вносить отсутствующее в данной фразе «взял».'
- source_word: μετὰ τὸ δειπνῆσαι
  choice: после вечери
  rationale: 'Оборот с μετά и субстантивированным инфинитивом выражает время: после того, как поужинали. «После вечери» кратко и уместно в библейском повествовательном регистре, оставаясь понятным современному читателю.'
- source_word: ἡ καινὴ διαθήκη
  choice: новый завет
  rationale: διαθήκη здесь обозначает завет и отсылает к ветхозаветному фону нового завета; «завещание» в современном русском языке передало бы иной смысл.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: в Моей крови
  rationale: Близкая к форме оригинала передача сохраняет образ крови завета и не уточняет толковательно значение предлога ἐν как «посредством» или «утверждённый».
- source_word: τοῦτο ποιεῖτε
  choice: Делайте это
  rationale: Настоящее повелительное наклонение допускает повторяющееся действие; его регулярность прямо проясняется последующим ὁσάκις ἐὰν. Русское «делайте» естественно передаёт продолжающееся предписание без избыточного усиления.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: всякий раз, когда пьёте её
  rationale: Конструкция указывает на повторяющиеся случаи. Местоимение «её» восполняет подразумеваемый объект — чашу — и необходимо для естественной русской речи.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: в воспоминание обо Мне
  rationale: ἀνάμνησις означает воспоминание или памятное совершение. Формулировка сохраняет активный поминальный смысл, не сводя высказывание к позднейшей конфессиональной трактовке.
theological_decisions:
- issue: Значение διαθήκη в словах установления
  choice: завет
  alternative: завещание
  rationale: В контексте крови, устанавливающей завет, и на фоне Иер 31 значение «завет» является наиболее вероятным; «завещание» способно создать в современном русском языке юридически-наследственную ассоциацию.
- issue: Связь чаши с новым заветом
  choice: «Эта чаша — новый завет в Моей крови» без поясняющей перефразировки
  alternative: «Эта чаша представляет новый завет» или «новый завет, утверждённый Моей кровью»
  rationale: Греческий текст прямо отождествляет чашу с новым заветом и не разъясняет характер этого отношения. Перевод сохраняет исходную богословскую напряжённость, не вводя ни символическое, ни сакраментальное уточнение.
- issue: Продолжительность повеления
  choice: «Делайте это всякий раз»
  alternative: «Продолжайте делать это»
  rationale: Повторяемость выражена сочетанием настоящего императива и придаточного «всякий раз, когда». Выбранная форма естественна по-русски и не приписывает самому виду глагола больше значения, чем допускает контекст.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены привычные «вечеря» и «новый завет», но исключены конфессионально нагруженные слова вроде «потир». Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
