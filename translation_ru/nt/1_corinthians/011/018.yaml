  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: ru
  text: Ибо, прежде всего, когда вы собираетесь как община[a], я слышу, что среди вас есть разделения, и отчасти этому верю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в собрании»; греческое выражение указывает на собравшуюся общину, а не обязательно на церковное здание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν γὰρ
  choice: Ибо прежде всего
  rationale: Передаёт причинно-пояснительное γάρ и вводную функцию πρῶτον μέν, которое обозначает первый пункт рассуждения, хотя явная парная конструкция μέν...δέ далее не завершена.
- source_word: συνερχομένων ὑμῶν
  choice: когда вы собираетесь вместе
  rationale: Генитив абсолютный естественно передан временным придаточным; формулировка также сохраняет повторяющийся в главе мотив совместного собрания.
- source_word: ἐν ἐκκλησίᾳ
  choice: как церковь
  rationale: В данном контексте речь идёт о собравшейся общине, а не о нахождении в культовом здании. Формулировка «как церковь» естественно передаёт корпоративный характер собрания.
- source_word: ἀκούω
  choice: я слышу
  rationale: Настоящее время и основанное на сообщениях знание Павла переданы прямо, без избыточного уточнения вида действия.
- source_word: σχίσματα
  choice: разделения
  rationale: Слово обозначает расколы или разрывы внутри сообщества; «разделения» сохраняет широту значения и не предполагает непременно уже сложившихся партий.
- source_word: ἐν ὑμῖν ὑπάρχειν
  choice: среди вас есть
  rationale: Естественная русская конструкция точно передаёт наличие разделений внутри общины.
- source_word: καὶ μέρος τι πιστεύω
  choice: и отчасти этому верю
  rationale: Сохраняет ограниченную, не безоговорочную степень доверия Павла к услышанному сообщению; местоимение «этому» ясно обозначает подразумеваемый объект веры.
theological_decisions:
- issue: Значение ἐκκλησία в данном контексте
  choice: собравшаяся община («как церковь»)
  alternative: «в церкви» или «в собрании»
  rationale: Контекст описывает совместное собрание коринфских верующих, связанное далее с Вечерей Господней. Выбранный вариант не сводит ἐκκλησία к зданию и не превращает её в отвлечённый институт.
- issue: Степень доверия Павла сообщению о разделениях
  choice: «отчасти этому верю»
  alternative: «в некоторой мере верю» или понимание μέρος τι как части самого сообщения
  rationale: Наиболее естественно μέρος τι ограничивает πιστεύω, выражая частичное принятие услышанного, но формулировка не уточняет, какая именно часть сообщения достоверна.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и понятный. Сохранена вводная логика «прежде всего», причинное «ибо» и осторожность выражения «отчасти верю». Терминология не привязана к конфессионально специфическому пониманию церкви.
