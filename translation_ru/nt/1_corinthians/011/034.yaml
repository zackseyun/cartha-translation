revisions:
- from: Если кто голоден, пусть ест дома, чтобы вам не собираться себе на суд.[a] А насчёт остального я дам указания, когда приду.
  to: Если кто голоден, пусть ест дома, чтобы вы, собираясь, не навлекали на себя суда.[a] А насчёт остального я дам указания, когда приду.
  rationale: Изменена только конструкция, передающая εἰς κρίμα συνέρχησθε. Формулировка «чтобы вы, собираясь, не навлекали на себя суда» естественна для современного литературного русского, сохраняет связь с собранием общины и передаёт κρίμα как его неблагоприятное следствие, не предрешая, следует ли понимать это слово как суд или осуждение. Сноска приведена в соответствие с новой формулировкой.
