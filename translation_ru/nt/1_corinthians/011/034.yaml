  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: ru
  text: Если кто голоден, пусть ест дома, чтобы вы, собираясь, не навлекали на себя суда.[a] А насчёт остального я дам указания, когда приду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осуждения». Греческое κρίμα может означать как «суд», так и «осуждение». Здесь «суд» лучше соответствует ближайшему контексту, где Павел говорит о нынешнем суде Господа, имеющем целью вразумление, а не об окончательном осуждении (ст. 29–32).'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: голоден
  rationale: Настоящее время описывает текущее состояние; «голоден» естественно и точно передаёт смысл по-русски.
- source_word: ἐν οἴκῳ
  choice: дома
  rationale: Речь идёт о домашней трапезе в противопоставление собранию общины; «дома» — наиболее естественный современный эквивалент.
- source_word: ἐσθιέτω
  choice: пусть ест
  rationale: Форма сохраняет побудительную силу греческого императива третьего лица и естественно звучит по-русски.
- source_word: εἰς κρίμα
  choice: себе на суд
  rationale: Оборот передаёт нежелательный результат собрания и сохраняет широкое значение κρίμα — «суд, судебное решение», не усиливая его до однозначного «осуждения».
- source_word: συνέρχησθε
  choice: собираться
  rationale: Сохраняет повторяющийся в данном отрывке мотив собрания общины и близко передаёт греческий глагол.
- source_word: Τὰ δὲ λοιπὰ
  choice: А насчёт остального
  rationale: Естественный переход к вопросам, решение которых Павел откладывает до своего прихода.
- source_word: ὡς ἂν ἔλθω
  choice: когда приду
  rationale: Конструкция обозначает ожидаемое будущее посещение; по-русски это естественнее всего выражается словами «когда приду».
- source_word: διατάξομαι
  choice: дам указания
  rationale: В контексте глагол означает распорядиться или определить, как следует поступать; «дам указания» ясно передаёт практический характер будущих распоряжений.
theological_decisions:
- issue: Значение κρίμα в предостережении о собрании на Вечерю Господню
  choice: суд, допускающий понимание как Божьего дисциплинарного суда
  alternative: осуждение; судебный приговор в более широком смысле
  rationale: Ближайший контекст (ст. 29–32) говорит о нынешнем суде и вразумлении от Господа и отличает их от осуждения вместе с миром. Перевод «суд» сохраняет эту связь, но не устраняет присущую слову смысловую широту.
- issue: Неопределённое местоимение τις и императив единственного числа
  choice: если кто… пусть ест
  alternative: если кто-нибудь голоден, ему следует поесть
  rationale: Русская конструкция естественно сохраняет неопределённое единственное число и повелительную силу оригинала без ненужного уточнения пола.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской, но понятной конструкцией «собираться себе на суд». Формулировка сохраняет словесную связь с собраниями общины и серьёзность предупреждения, не делая значение κρίμα более узким, чем в греческом тексте.
