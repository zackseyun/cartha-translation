  terminology: «Суд» удачно сохраняет смысловую широту κρίμα; «осуждение» следует оставить в сноске как возможный вариант. «Дам указания» — точная и современная передача διατάξομαι. «Когда приду» уместно передаёт ожидаемый будущий приход.
