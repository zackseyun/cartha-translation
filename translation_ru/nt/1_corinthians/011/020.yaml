lexical_decisions:
- source_word: συνερχομένων
  choice: когда вы собираетесь
  rationale: Родительный абсолют с ὑμῶν передан естественной временной конструкцией; глагол сохраняет смысл общего собрания.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предыдущего обличения разделений и естественно звучит в современном русском тексте.
- source_word: ἐπὶ τὸ αὐτό
  choice: в одном месте
  rationale: Сохраняет пространственный оттенок выражения и не дублирует значение «собираетесь».
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: это ещё не значит, что вы вкушаете
  rationale: 'Передаёт сжатую оценочную конструкцию: само собрание при описанном поведении не делает трапезу вечерей Господней. Частица «ещё» выражает недостаточность самого факта собрания, не превращая слова Павла в утверждение о метафизической невозможности.'
- source_word: κυριακὸν δεῖπνον
  choice: вечерю Господню
  rationale: Устоявшееся и понятное русское выражение; сохраняет значение трапезы, принадлежащей Господу, и связь с церковным контекстом.
theological_decisions:
- issue: Отрицает ли Павел возможность вкушать эту трапезу или то, что поведение коринфян позволяет считать её вечерей Господней
  choice: Их совместное собрание при таком поведении ещё не означает, что они вкушают вечерю Господню.
  alternative: «Вы не вкушаете вечерю Господню» или «невозможно вкушать вечерю Господню».
  rationale: Контекст стихов 21–22 обличает порядок и характер общей трапезы. Основной текст сохраняет оценочную силу греческой конструкции, а примечание указывает более прямой допустимый перевод, не устраняя неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским глаголом «вкушать». Формулировка понятна широкому читателю, не вводит конфессионально специфической терминологии и сохраняет смысловую напряжённость оригинала.
