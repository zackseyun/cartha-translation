  text: For man is not from woman[a], but woman from man.
translation:
  language: ru
  text: Ведь мужчина — не от женщины, а женщина — от мужчины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь не муж от жены, а жена от мужа». Греческие слова могут означать как «мужчина/женщина», так и «муж/жена»; здесь предпочтён более широкий смысл, связанный с сотворением.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ведь
  rationale: Союз вводит обоснование предыдущей мысли; «ведь» естественно передаёт пояснительно-аргументативную связь в современном русском языке.
- source_word: ἀνήρ / ἀνδρός
  choice: мужчина / мужчины
  rationale: В контексте обращения к повествованию о сотворении речь идёт прежде всего о мужчине и женщине, а не только о супругах; при этом возможное значение «муж» отмечено в сноске.
- source_word: ἐκ / ἐξ
  choice: от
  rationale: Предлог обозначает источник или происхождение. Русское «от» кратко и естественно передаёт эту связь.
- source_word: γυνή / γυναικός
  choice: женщина / женщины
  rationale: В паре с ἀνήρ и в контексте сотворения слово имеет более широкое значение «женщина»; супружеское прочтение сохраняется как допустимая альтернатива в сноске.
- source_word: ἀλλά
  choice: а
  rationale: В русском противопоставлении после отрицательной конструкции «не…, а…» союз «а» точнее и естественнее английского формального соответствия «но».
- source_word: ἐστιν
  choice: не выражено отдельным словом
  rationale: В русском настоящем времени связка «есть» обычно опускается; отношение происхождения ясно выражено конструкцией «не … от …, а … от …».
theological_decisions:
- issue: Передавать ли ἀνήρ/γυνή как «мужчина/женщина» или «муж/жена»
  choice: мужчина/женщина
  alternative: муж/жена
  rationale: Аргумент опирается на происхождение женщины от мужчины в повествовании о сотворении, поэтому более широкий смысл предпочтителен. Однако греческие слова допускают и супружеское значение, которое не следует устранять и потому оно указано в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмически уравновешенная конструкция сохраняет противопоставление и аргументативный характер оригинала.
