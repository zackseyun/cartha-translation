  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: ru
  text: 'Судите сами: прилично ли женщине молиться Богу с непокрытой головой?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жене», если в более широком контексте этого отрывка γυνή понимается в значении замужней женщины.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: сами
  rationale: Идиоматично передаёт усиленный призыв к собственному суждению адресатов; в сочетании «Судите сами» звучит естественно и точно.
- source_word: κρίνατε
  choice: Судите
  rationale: Аористный императив прямо призывает дать оценку; «судите» сохраняет силу и риторический характер обращения.
- source_word: πρέπον ἐστὶν
  choice: прилично ли
  rationale: Передаёт вопрос о подобающем и уместном поведении в данном контексте, сохраняя оттенок общественной и нравственной пристойности.
- source_word: γυναῖκα
  choice: женщине
  rationale: γυνή может означать «женщина» или «жена», но сам стих не упоминает мужа и формулирует вопрос обобщённо; возможное брачное значение отмечено в сноске.
- source_word: ἀκατακάλυπτον
  choice: с непокрытой головой
  rationale: Буквально прилагательное означает «непокрытая»; добавление «головой» естественно для русского языка и делает явной подразумеваемую из ближайшего контекста часть тела.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж после προσεύχομαι обозначает того, к кому обращена молитва; русское «молиться Богу» точно и естественно.
- source_word: προσεύχεσθαι
  choice: молиться
  rationale: Обычное и точное соответствие инфинитиву «молиться», зависящему от вопроса о том, прилично ли это.
theological_decisions:
- issue: Значение γυνή в рассуждении о покрытии головы
  choice: женщина
  alternative: жена
  rationale: В самом стихе муж не назван, а риторический вопрос имеет обобщённую форму. Поэтому основной текст не сужает значение до замужней женщины, но сохраняет возможное брачное понимание в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, прямая и достойная. «Прилично ли» сохраняет риторический вопрос о подобающем поведении, а «с непокрытой головой» естественно раскрывает подразумеваемый объект прилагательного.
