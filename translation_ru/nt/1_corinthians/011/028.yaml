  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: ru
  text: Пусть же человек испытывает себя, и пусть так ест от хлеба и пьёт из чаши.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: пусть испытывает
  rationale: Глагол означает проверять, исследовать с целью установить подлинность или пригодность; «испытывает» сохраняет оттенок проверки, не сводя смысл лишь к размышлению.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В данном контексте слово имеет обобщённое значение и относится к каждому участнику трапезы; современное русское «человек» точно передаёт этот охват.
- source_word: ἑαυτόν
  choice: себя
  rationale: Возвратное местоимение сохраняет направленность проверки на самого участника.
- source_word: οὕτως
  choice: только тогда
  rationale: 'В контексте выражает требуемую последовательность: сначала самоиспытание, затем участие; русский оборот передаёт эту связь естественно, не уточняя критерий испытания.'
- source_word: ἐκ τοῦ ἄρτου / ἐκ τοῦ ποτηρίου
  choice: от хлеба / из чаши
  rationale: 'Предлог ἐκ сохранён там, где это естественно по-русски: традиционное «есть от хлеба» и обычное «пить из чаши».'
theological_decisions:
- issue: Характер самоиспытания
  choice: Не уточнять содержание или ожидаемый результат испытания
  alternative: Передать как требование признать себя достойным либо недостойным
  rationale: Стих повелевает человеку испытывать себя, но не формулирует здесь критерий и не говорит, что итогом должно стать отстранение от трапезы; после испытания следует повеление есть и пить.
- issue: Значение ἄνθρωπος
  choice: Обобщённое «человек»
  alternative: Гендерно маркированное «мужчина» или «муж»
  rationale: Греческое ἄνθρωπος в этой сентенции обозначает человека вообще, а не взрослого мужчину в противопоставлении женщине.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и наставительным звучанием. Синтаксис краток и сохраняет два параллельных повеления; архаическое «да испытывает» не используется.
