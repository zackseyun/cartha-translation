  text: Но если бы мы судили самих себя[a], то не были бы судимы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исследовали себя»; возможен также смысл «различали себя». Греческий глагол может означать оценивать или различать; перевод «судили» сохраняет перекличку со словами «были бы судимы» во второй части стиха.'
