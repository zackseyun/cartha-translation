lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если бы
  rationale: εἰ вводит условие, а δέ обозначает мягкое противопоставление или переход. Частица «бы» вместе с формой сказуемого естественно передаёт нереальное условие прошедшего времени.
- source_word: ἑαυτοὺς
  choice: самих себя
  rationale: Возвратное местоимение в винительном падеже; «самих себя» естественно передаёт объект самооценки и сохраняет эмфазу.
- source_word: διεκρίνομεν
  choice: судили
  rationale: В данном контексте διακρίνω означает различающую, критическую оценку себя. «Судили» сохраняет смысловую и словесную связь с ἐκρινόμεθα; возможны также «исследовали» и «различали».
- source_word: οὐκ ἂν
  choice: то не были бы
  rationale: Сочетание οὐκ ἂν с имперфектом образует следствие нереального условия; русская конструкция с «бы» передаёт его естественно.
- source_word: ἐκρινόμεθα
  choice: были бы судимы
  rationale: Пассивная форма κρίνω передана без усиления до «осуждены». Это сохраняет параллель с первой частью и не предрешает характер суда, который ближайший контекст связывает с Господним наказанием.
theological_decisions:
- issue: Означает ли ἐκρινόμεθα окончательное осуждение или Божий дисциплинарный суд
  choice: 'Передать нейтрально: «были бы судимы»'
  alternative: «были бы осуждены»
  rationale: В стихе 32 суд и вразумляющее наказание от Господа противопоставлены осуждению вместе с миром. Поэтому более сильное «осуждены» внесло бы в стих смысл, которого сама форма κρίνω здесь не требует.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Повтор корня «суд-» намеренно сохраняет риторическое противопоставление оригинала.
