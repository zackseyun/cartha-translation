  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: ru
  text: Но если кто-то считает себя склонным к спорам[a], то ни у нас, ни у церквей Божьих такого обычая нет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ему кажется, что он склонен к спорам»; «спорлив»; «любит препираться».'
    reason: lexical_alternative
  - marker: b
    text: Слова «такого обычая» могут относиться либо к склонности вступать в споры, либо к практике, обсуждавшейся в предыдущих стихах.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ φιλόνεικος εἶναι
  choice: склонен к спорам
  rationale: Естественно передаёт в русском языке расположенность человека к препирательствам и раздорам. Такое выражение учитывает возможное значение δοκεῖ как «быть склонным» и значение φιλόνεικος как «спорливый, любящий споры», не усиливая его до открытой враждебности.
- source_word: τοιαύτην
  choice: такого
  rationale: Указательное слово сохраняет обратную отсылку, не уточняя её предмет сверх того, что выражено в греческом тексте.
- source_word: συνήθειαν
  choice: обычая
  rationale: Слово обозначает принятую привычку, практику или установившийся обычай. «Обычай» естественно сочетается с глаголом «нет» и сохраняет широту значения.
- source_word: οὐκ ἔχομεν
  choice: у нас… нет
  rationale: Идиоматичное русское соответствие буквальному «мы не имеем», без добавления значений «не разрешаем» или «не соблюдаем».
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: Божьи церкви
  rationale: Передаёт принадлежность общин Богу и сохраняет множественное число, которым Павел ссылается на более широкий круг церквей.
theological_decisions:
- issue: К чему относится выражение «такого обычая»
  choice: 'Референт оставлен неопределённым: «такого обычая».'
  alternative: Можно понимать либо обычай вступать в споры, либо обсуждавшуюся в предыдущих стихах практику.
  rationale: Краткое греческое выражение τοιαύτην συνήθειαν допускает оба контекстуальных понимания. Перевод не устраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Перестановка «ни у нас, ни у Божьих церквей… нет» соответствует русскому синтаксису и сохраняет смысл греческой конструкции.
