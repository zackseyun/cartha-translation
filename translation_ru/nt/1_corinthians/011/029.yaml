  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: ru
  text: Ведь тот, кто ест и пьёт, ест и пьёт себе на суд, не различая[b] тела[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «тела Господня» вместо «тела».'
    reason: textual_variant
  - marker: b
    text: 'Или: «не распознавая тела». Это может относиться к пониманию значения Вечери Господней, к признанию собравшихся верующих телом Христа или к обоим смыслам.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: суд
  rationale: Слово обозначает судебное решение или суд. «Суд» сохраняет широту греческого выражения и, в отличие от «осуждения», не подразумевает непременно окончательную погибель; в ближайшем контексте говорится также о Божьем вразумляющем наказании.
- source_word: ἑαυτῷ
  choice: себе на суд
  rationale: Дательный падеж указывает, что едящий и пьющий сам навлекает на себя суд. Оборот «себе на суд» кратко передаёт неблагоприятное последствие и сохраняет структуру исходного высказывания.
- source_word: διακρίνων
  choice: различая
  rationale: Причастие может означать проведение должного различия, верную оценку или распознавание. «Различая» сохраняет смысловой диапазон и не определяет заранее, какое именно осмысление тела имеется в виду.
- source_word: τὸ σῶμα
  choice: тела
  rationale: Наиболее ранний восстанавливаемый текст содержит просто «тело», без уточнения «Господне». Краткая форма сохраняет возможную отнесённость как к телу Христа в Вечере, так и к собранию верующих как телу Христа.
- source_word: ὁ … ἐσθίων καὶ πίνων
  choice: тот, кто ест и пьёт
  rationale: Субстантивированные причастия выражают обобщённое единственное число. Русский оборот естественен, понятен и близко передаёт греческую конструкцию.
- source_word: μὴ διακρίνων
  choice: не различая
  rationale: Деепричастный оборот непосредственно отражает греческое причастие и сохраняет связь между вкушением суда и отсутствием должного различения, не превращая её в более явно условную конструкцию.
theological_decisions:
- issue: Значение выражения «тело» в контексте Вечери Господней
  choice: Сохранить в основном тексте неоднозначное «тело», не уточняя его референт.
  alternative: «тело Господне» или «тело верующих»
  rationale: Греческий текст говорит только «тело». Контекст касается и отношения Вечери к Иисусу, и недостойного отношения коринфян друг к другу, поэтому перевод не должен устранять возможную богословскую многозначность.
- issue: Смысл κρίμα
  choice: «суд», а не «осуждение»
  alternative: «осуждение»
  rationale: В стихе 32 Божий суд над верующими противопоставлен осуждению мира. Поэтому «суд» точнее передаёт слово здесь и не утверждает окончательного осуждения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «ест и пьёт» сохранён вслед за греческим текстом; оборот «себе на суд» несколько приподнят, но понятен и позволяет избежать чрезмерно сильного «себе в осуждение».
