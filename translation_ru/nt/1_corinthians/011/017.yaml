source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: ru
  text: Но, давая это наставление[a], я не хвалю вас, потому что вы собираетесь не к лучшему, а к худшему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «давая это повеление». Греческий глагол может означать наставлять, давать указание или повелевать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: Но, давая это наставление
  rationale: Τοῦτο вместе с причастием παραγγέλλων указывает на вводимое далее наставление; δὲ отмечает переход с оттенком противопоставления предыдущей похвале.
- source_word: παραγγέλλων
  choice: давая это наставление
  rationale: Глагол может означать наставлять, давать указание или повелевать. «Давая это наставление» сохраняет авторитетный оттенок без неоправданного усиления.
- source_word: οὐκ ἐπαινῶ
  choice: я не хвалю вас
  rationale: Прямая и естественная передача отрицания с ἐπαινέω; также сохраняется смысловая связь с похвалой в стихе 2. Дополнение «вас» ясно из контекста обращения.
- source_word: ὅτι
  choice: потому что
  rationale: Здесь союз естественно вводит причину, по которой Павел не хвалит адресатов.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: не на пользу, а во вред
  rationale: 'Субстантивированные сравнительные формы обозначают итог собраний: не к лучшему, а к худшему. Русская антитеза «на пользу — во вред» ясно и естественно передаёт практический результат.'
- source_word: συνέρχεσθε
  choice: ваши собрания идут
  rationale: Греческая форма означает «собираться, сходиться». Перестройка в «ваши собрания идут…» позволяет естественно соединить действие с русским выражением результата «на пользу / во вред», не добавляя нового содержания.
theological_decisions:
- issue: Степень властности παραγγέλλων
  choice: наставление
  alternative: повеление
  rationale: «Наставление» сохраняет апостольскую направляющую речь и не делает тон более резким, чем однозначно требует контекст.
- issue: Характер отрицательного результата собраний
  choice: во вред
  alternative: к худшему
  rationale: «Во вред» передаёт реальный отрицательный итог, не уточняя, кому именно причиняется вред, и потому сохраняет широту греческого выражения.
translation_notes:
  register: Современный литературный русский язык; тон прямой и обличительный, но без излишней резкости. Антитеза «не на пользу, а во вред» звучит естественно и сохраняет контраст исходного текста.
