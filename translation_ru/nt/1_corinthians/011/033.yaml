  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: ru
  text: Итак, братья мои[a], когда вы собираетесь, чтобы поесть, ждите друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры». В греческом тексте стоит слово «братья», которое нередко служит обращением ко всей общине, включая женщин.'
