lexical_decisions:
- source_word: Ὥστε
  choice: Итак
  rationale: Союз выражает вывод из предшествующего обличения злоупотреблений на Вечере Господней; «итак» естественно передаёт эту логическую связь.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Форма звательного падежа множественного числа с притяжательным местоимением буквально означает «братья мои». Мужской род сохранён в основном тексте, а обращённость ко всей общине пояснена в сноске.
- source_word: συνερχόμενοι
  choice: когда вы собираетесь
  rationale: Причастие употреблено обстоятельственно при повелительном глаголе и обозначает ситуацию, в которой действует наставление. Формулировка также сохраняет повторяющийся в главе мотив собрания общины.
- source_word: εἰς τὸ φαγεῖν
  choice: чтобы поесть
  rationale: Предлог с субстантивированным инфинитивом выражает цель. Эта формулировка естественна по-русски и не уточняет характер трапезы сверх сказанного в греческом тексте.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Взаимное местоимение в винительном падеже естественно передаётся устойчивым русским выражением «друг друга».
- source_word: ἐκδέχεσθε
  choice: ждите
  rationale: В контексте, где одни начинали есть раньше других (ст. 21), глагол наиболее естественно означает ожидание остальных перед началом трапезы. Возможный оттенок принятия не вносится в основной текст.
theological_decisions:
- issue: Представительное мужское обращение ἀδελφοί
  choice: Сохранить «братья» в основном тексте и пояснить инклюзивную функцию в сноске.
  alternative: «братья и сёстры»
  rationale: Греческая форма грамматически мужского рода, но в данном контексте, вероятно, обращена ко всей общине, включая женщин. Перевод сохраняет форму источника, не скрывая её обычного широкого употребления.
- issue: Значение ἐκδέχεσθε в наставлении о совместной трапезе
  choice: «ждите»
  alternative: «принимайте» или «приветствуйте»
  rationale: Ближайший контекст противопоставляет повеление практике, при которой каждый поспешно брался за собственную еду; поэтому смысл ожидания друг друга наиболее вероятен, хотя более широкое значение принятия лексически возможно.
translation_notes:
  register: Современный литературный русский язык; фраза проста и достойна по тону. Порядок «братья мои» сохраняет лёгкую библейскую возвышенность без архаизации. Синтаксис ясно передаёт вывод, обстоятельство собрания, цель и повеление.
