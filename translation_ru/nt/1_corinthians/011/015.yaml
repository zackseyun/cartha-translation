  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: ru
  text: А если женщина[a] носит длинные волосы, разве это не слава для неё? Ведь волосы даны ей вместо покрова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жена». Греческое слово может означать как женщину, так и жену — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как покров». Греческий предлог может выражать замещение или соответствие; сама эта фраза не решает окончательно, служат ли волосы покровом или даны в соотношении с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: женщина
  rationale: Слово может означать как женщину вообще, так и жену. Здесь сформулировано общее положение, поэтому «женщина» лучше соответствует непосредственному контексту, а возможное значение «жена» отмечено в сноске.
- source_word: κομᾷ
  choice: носит длинные волосы
  rationale: Глагол означает носить или иметь длинные волосы. Этот перевод естественно передаёт состояние, а не просто наличие волос.
- source_word: δόξα
  choice: слава
  rationale: Слово обозначает славу, почёт или то, что служит человеку к чести. «Слава» сохраняет силу и ключевую лексическую связь греческого выражения.
- source_word: κόμη
  choice: волосы
  rationale: Существительное обозначает волосы на голове, нередко с оттенком длинных, отращённых волос. Поскольку длина уже выражена глаголом, повторять её здесь не требуется.
- source_word: ἀντί
  choice: вместо
  rationale: Предлог обычно выражает замещение или соответствие. «Вместо» сохраняет его наиболее прямое значение, а возможность понимания «как покров» указана в сноске.
- source_word: περιβολαίου
  choice: покров
  rationale: Существительное обозначает то, чем оборачиваются или покрываются. «Покров» не сужает значение до конкретного вида головного покрывала или вуали.
- source_word: δέδοται
  choice: даны ей
  rationale: Перфект страдательного залога указывает на данность и сохраняющееся состояние. В русском краткая форма «даны ей» естественно передаёт этот результативный смысл.
theological_decisions:
- issue: Отождествляет ли стих волосы с требуемым в отрывке головным покрытием.
  choice: Перевести περιβόλαιον общим словом «покров», не уточняя его как вуаль или платок.
  alternative: «покрывало», «вуаль» или толкование волос как самого предписанного головного покрытия.
  rationale: Греческое слово шире конкретной вуали или платка, а сочетание с ἀντί допускает обсуждение замещения либо соответствия. Перевод не должен заранее разрешать более широкий спор об отношении волос к покрытию головы.
- issue: Высказывание или риторический вопрос в первой части стиха.
  choice: 'Передать как риторический вопрос: «разве это не слава для неё?»'
  alternative: 'Утвердительное: «это для неё слава».'
  rationale: В издании SBLGNT после ἐστιν стоит знак вопроса. Русская форма с «разве не» естественно передаёт риторический характер вопроса; сами древнейшие рукописи, однако, не имели современной пунктуации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Носит длинные волосы» звучит естественно и точно; «покров» сохраняет широту исходного слова. Риторический вопрос следует пунктуации SBLGNT.
