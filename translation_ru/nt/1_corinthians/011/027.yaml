id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: ru
  text: Итак, кто ест хлеб или пьёт чашу Господа недостойным образом[a], тот будет виновен по отношению к телу и крови Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Недостойным образом» передаёт наречие: речь идёт о том, как человек ест или пьёт, а не о его собственной ценности или достоинстве.'
    reason: lexical_alternative
  - marker: b
    text: 'Более буквально и традиционно: «будет виновен против тела и крови Господа». Греческая конструкция указывает на виновность или ответственность в отношении тела и крови Господа, не уточняя здесь её точный характер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения о Вечере Господней естественным современным русским союзом.
- source_word: ὃς ἂν
  choice: кто
  rationale: Неопределённо-относительная конструкция имеет обобщающий смысл; русское «кто … тот» естественно передаёт это значение.
- source_word: ἐσθίῃ
  choice: ест
  rationale: Настоящее время в обобщающей условной конструкции естественно передаёт греческий презенс конъюнктива.
- source_word: τὸν ἄρτον
  choice: хлеб
  rationale: Определённость уже задаётся контекстом Вечери; указательное «этот» отсутствует в греческом и потому не добавлено.
- source_word: ἢ
  choice: или
  rationale: Сохраняет явное разделительное значение греческого союза и не заменяет его литургически ожидаемым «и».
- source_word: πίνῃ τὸ ποτήριον
  choice: пьёт чашу
  rationale: 'Сохраняет обычную библейскую метонимию: пьётся содержимое чаши; дополнение «из чаши» несколько дальше от формы оригинала.'
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Родительный падеж естественно передаёт принадлежность или связь, а κύριος в данном контексте является титулом Иисуса.
- source_word: ἀναξίως
  choice: недостойным образом
  rationale: Наречное выражение характеризует способ участия, а не объявляет самого участника внутренне недостойным.
- source_word: ἔνοχος ἔσται
  choice: будет виновен
  rationale: Передаёт будущую виновность и ответственность, сохраняя юридически серьёзный оттенок выражения.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος
  choice: по отношению к телу и крови
  rationale: Передаёт область, в отношении которой возникает виновность, не уточняя сверх текста точную юридическую природу этой ответственности.
theological_decisions:
- issue: Значение ἀναξίως применительно к участию в Вечере Господней
  choice: Осуждается принятие хлеба или чаши недостойным образом.
  alternative: Стих якобы называет самого участника недостойным человеком.
  rationale: ἀναξίως — наречие, относящееся к глаголам «ест» и «пьёт»; перевод не должен превращать характеристику действия в утверждение о присущем человеку достоинстве.
- issue: Сила союза ἢ между вкушением хлеба и питьём чаши
  choice: Предупреждение относится к любому из двух действий, если оно совершается недостойным образом.
  alternative: Передать действия как неразделимую пару при помощи «и».
  rationale: В исходном тексте стоит разделительный союз ἢ («или»), и его богословски значимая формулировка сохранена без гармонизации с литургической традицией.
- issue: Связь ἔνοχος с родительным τοῦ σώματος καὶ τοῦ αἵματος
  choice: Сохранить общую виновность по отношению к телу и крови Господа.
  alternative: Уточнить её как осквернение, преступление или ответственность за смерть Господа.
  rationale: Греческая конструкция выражает виновность или ответственность в отношении названного предмета, но сама по себе не определяет её точнее; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены метонимия «пьёт чашу», разделительное «или» и строчные буквы в словах «тело» и «кровь», поскольку оригинал не задаёт типографического богословского выделения.
