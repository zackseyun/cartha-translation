id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: ru
  text: Разве у вас нет домов, чтобы есть и пить? Или вы презираете церковь Божью и унижаете тех, у кого ничего нет[a]? Что мне вам сказать? Похвалить вас? За это я вас не хвалю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедных»; или: «тех, у кого нет еды». Буквально: «не имеющих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: домов
  rationale: Множественное число обозначает частные жилища и сохраняет противопоставление собранию церкви.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: чтобы есть и пить
  rationale: Естественно передаёт целевое значение конструкции с артиклевыми инфинитивами.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: церковь Божью
  rationale: Устоявшееся и понятное обозначение принадлежащего Богу сообщества верующих; контекст указывает на собравшуюся общину, не требуя институционального уточнения.
- source_word: καταφρονεῖτε
  choice: презираете
  rationale: Сохраняет резкость упрёка и значение отношения к чему-либо как не заслуживающему уважения.
- source_word: καταισχύνετε
  choice: унижаете
  rationale: В данном контексте естественно выражает причинение стыда; вариант «стыдите» в современном русском менее естественен.
- source_word: τοὺς μὴ ἔχοντας
  choice: тех, у кого ничего нет
  rationale: Близко передаёт буквальное «не имеющих», не сужая смысл до однозначного социального обозначения.
- source_word: τί εἴπω ὑμῖν;
  choice: Что мне вам сказать?
  rationale: Естественно передаёт риторический вопрос с делиберативным аористом сослагательного наклонения.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: Похвалить вас?
  rationale: Краткий русский инфинитивный вопрос сохраняет риторическую иронию и предполагаемый отрицательный ответ.
- source_word: ἐν τούτῳ
  choice: За это
  rationale: В современном русском ясно указывает на обсуждаемое поведение и звучит естественнее буквального «в этом».
- source_word: οὐκ ἐπαινῶ
  choice: я вас не хвалю
  rationale: Сохраняет лексический повтор глагола ἐπαινέω и усиливает риторический контраст.
theological_decisions:
- issue: Кого обозначает выражение τοὺς μὴ ἔχοντας в контексте Вечери Господней
  choice: тех, у кого ничего нет
  alternative: бедных; тех, у кого нет еды
  rationale: Контекст указывает на материально нуждающихся членов общины, вероятно не имевших еды, но греческое выражение буквально шире — «не имеющих». Основной текст сохраняет эту недосказанность, а примечание сообщает контекстуальные варианты.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Риторические вопросы переданы кратко и резко, в соответствии с обличительным характером стиха. «Церковь Божью» употреблено в привычном русском библейском значении общины Божьего народа.
