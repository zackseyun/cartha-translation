  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: ru
  text: Ведь не мужчина был сотворён ради женщины, а женщина — ради мужчины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за женщины … из-за мужчины». Греческий предлог может указывать как на причину, так и на цель; здесь «ради» отражает связь с рассуждением о творении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ведь
  rationale: Частица «ведь» естественно передаёт пояснительно-обосновывающую силу γάρ и в данном контексте достаточно отражает усилительный оттенок καί, не создавая тяжеловесного сочетания вроде «ибо действительно».
- source_word: ἐκτίσθη
  choice: был сотворён
  rationale: Глагол κτίζω означает «творить, создавать»; «сотворён» точно передаёт пассивную форму и соответствует обращению Павла к повествованию о творении.
- source_word: ἀνὴρ / γυνὴ
  choice: мужчина / женщина
  rationale: В контексте творения слова обозначают мужчину и женщину как таковых, а не только мужа и жену. Такая передача сохраняет родовой и сотворенческий масштаб высказывания.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: ради женщины / ради мужчины
  rationale: Предлог διά с винительным падежом может обозначать причину, цель или направленность в чьих-либо интересах. «Ради» естественно звучит в конструкции «сотворён ради» и не сводит смысл исключительно к причинности, хотя возможная неоднозначность отмечена в сноске.
- source_word: ἀλλὰ
  choice: а
  rationale: В русском параллельном противопоставлении после отрицания конструкция «не …, а …» точнее и естественнее английского буквального «но» передаёт ἀλλά.
theological_decisions:
- issue: Передавать ли ἀνήρ и γυνή как «муж/жена» или как «мужчина/женщина»
  choice: мужчина/женщина
  alternative: муж/жена
  rationale: Упоминание сотворения указывает на повествование Бытия и на более широкое соотношение мужчины и женщины. Перевод «муж/жена» без необходимости ограничил бы утверждение рамками брака.
- issue: Определять ли διά как указание исключительно на цель
  choice: Сохранить оттенок цели или направленности словом «ради», отметив причинное прочтение в сноске
  alternative: из-за женщины / из-за мужчины
  rationale: Контекст аргумента о творении благоприятствует целевой направленности, однако сама греческая конструкция допускает причинный оттенок. Сноска сохраняет эту лексическую неоднозначность, не разрешая её догматически.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная конструкция сохраняет противопоставление исходного текста. «Сотворён» поддерживает достойный библейский регистр, оставаясь понятным современному читателю.
