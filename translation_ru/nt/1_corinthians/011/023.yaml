  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: ru
  text: 'Ведь я принял от Господа то, что и передал вам: Господь Иисус в ту ночь, когда Его выдавали[a], взял хлеб.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Его передавали во власть»; традиционно: «когда Он был предан».'
    reason: Греческий глагол может означать как предательство, так и передачу человека во власть; имперфект также подчёркивает происходившее действие.
lexical_decisions:
- source_word: παρέλαβον
  choice: принял
  rationale: Передаёт получение Павлом учения или предания и сохраняет смысловую связь с последующим «передал».
- source_word: ἀπὸ τοῦ κυρίου
  choice: от Господа
  rationale: Сохраняет прямое указание на источник, не расширяя греческую формулировку.
- source_word: παρέδωκα
  choice: передал
  rationale: Естественно выражает передачу принятого учения и сохраняет словесную перекличку с «принял».
- source_word: ὅτι
  choice: двоеточие
  rationale: В современном русском содержание переданного естественнее вводится бессоюзно после двоеточия; смысл греческого ὅτι полностью сохраняется.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет почтительный и христологический смысл титула.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: в ту ночь, когда
  rationale: Естественная современная русская передача временной конструкции.
- source_word: παρεδίδετο
  choice: Его предавали
  rationale: Несовершенный вид передаёт имперфект и происходившее действие; «предавали» сохраняет в русском неоднозначность между изменническим предательством и передачей во власть.
- source_word: ἔλαβεν ἄρτον
  choice: взял хлеб
  rationale: Прямая и естественная передача глагола с неопределённым существительным без ненужного уточнения «буханку».
theological_decisions:
- issue: Передача παρεδίδετο в повествовании об установлении Вечери
  choice: Его предавали
  alternative: Он был предан
  rationale: Форма «Его предавали» сохраняет процессуальность греческого имперфекта и допускает как смысл предательства, так и смысл передачи Иисуса во власть, не сводя действие исключительно к Иуде.
translation_notes:
  register: Современный литературный русский язык с достоинством и узнаваемой библейской интонацией. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской религиозной издательской нормой.
