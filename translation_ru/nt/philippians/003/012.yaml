revisions:
- from: Не то чтобы я уже достиг[a] или уже стал совершенным[b], но стремлюсь вперёд, чтобы и мне овладеть тем, ради чего Христос[c] Иисус овладел мною.
  to: Не то чтобы я уже получил[a] или уже был доведён до совершенства[b]; но я стремлюсь вперёд — не удастся ли и мне овладеть тем, ради чего Христос[c] овладел мною.
  rationale: Убрано не засвидетельствованное в SBLGNT «Иисус». «Получил» сохраняет основной смысл ἔλαβον при сохранении имплицитного объекта в сноске. Пассивный результативный характер τετελείωμαι восстановлен в основной строке. Формулировка «не удастся ли» передаёт модально-условный оттенок εἰ καί, а «овладеть — овладел» сохраняет связь καταλάβω / κατελήμφθην. Целевое понимание ἐφ’ ᾧ оставлено, но не выдано за единственно возможное в пояснительном аппарате.
  reviewer_model: gpt-5.6-terra
