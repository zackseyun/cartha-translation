  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: ru
  text: Не то чтобы я уже получил[a] или уже был доведён до совершенства[b]; но я стремлюсь вперёд — не удастся ли и мне овладеть тем, ради чего Христос[c] овладел мною.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достиг». В греческом тексте объект глагола не назван и подразумевается из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «достиг полноты»; также возможно: «стал совершенным».'
    reason: lexical_alternative
  - marker: c
    text: Греч. Христос; буквально «Помазанник», то есть Мессия.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: достиг
  rationale: Глагол оставляет объект невыраженным и по контексту указывает на ещё не достигнутую цель; «достиг» естественно передаёт этот смысл без искусственного добавления местоимения.
- source_word: τετελείωμαι
  choice: стал совершенным
  rationale: Перфектная форма обозначает достигнутое состояние завершённости. Русское «стал совершенным» сохраняет неопределённость между совершенством и полнотой, хотя не воспроизводит формально пассивную конструкцию.
- source_word: διώκω
  choice: стремлюсь вперёд
  rationale: Передаёт настойчивое продолжающееся движение к цели и естественно связывается с контекстом бега.
- source_word: καταλάβω
  choice: овладеть
  rationale: Передаёт значение достижения и захвата цели и позволяет сохранить словесную связь с однокоренной формой κατελήμφθην.
- source_word: ἐφ’ ᾧ
  choice: тем, ради чего
  rationale: Сохраняет наиболее вероятное целевое понимание оборота, не уточняя сверх текста, в чём именно состояла цель призвания Павла.
- source_word: κατελήμφθην
  choice: овладел мною
  rationale: 'Активная русская конструкция естественнее буквального пассива и сохраняет взаимную игру форм καταλαμβάνω: Павел стремится овладеть тем, ради чего Христос овладел им.'
- source_word: Χριστοῦ
  choice: Христос
  rationale: В павловском употреблении слово здесь звучит как устойчивое обозначение Иисуса, при этом его титульное значение отмечено в сноске.
theological_decisions:
- issue: Следует ли τετελείωμαι переводить так, чтобы оно подразумевало безгрешное совершенство
  choice: стал совершенным
  alternative: достиг полноты / был доведён до совершенства
  rationale: Текст отрицает, что Павел уже находится в окончательно завершённом состоянии, но не определяет это состояние категориями позднейших богословских систем.
- issue: Значение ἐφ’ ᾧ
  choice: ради чего
  alternative: потому что
  rationale: 'Целевое прочтение хорошо соответствует движению мысли: Павел старается овладеть целью, ради которой Христос овладел им. Существующую грамматическую возможность причинного понимания не следует выдавать за невозможную.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «овладеть — овладел» намеренно сохраняет риторическую связь двух форм одного греческого глагола. Включение «Иисус» следует тексту SBLGNT в данном месте.
