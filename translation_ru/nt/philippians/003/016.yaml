  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: ru
  text: Только будем держаться[a] достигнутого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем идти в ногу с тем, чего достигли»; возможен также смысл: «будем придерживаться того же мерила».'
    reason: Глагол στοιχεῖν может означать упорядоченно идти, следовать принятой линии или норме. В кратком греческом тексте при τῷ αὐτῷ подразумевается, но не названо, то же основание, правило или мерило.
lexical_decisions:
- source_word: πλήν
  choice: Только
  rationale: 'Здесь слово вводит ограничивающий и подытоживающий призыв: независимо от дальнейшего продвижения важно не отступать от уже достигнутого. «Только» сохраняет эту сужающую силу и естественно звучит по-русски.'
- source_word: εἰς ὃ
  choice: того, чего
  rationale: Оборот указывает на уже достигнутую ступень или меру. В сочетании с русским «держаться» естественно передаётся как «того, чего».
- source_word: ἐφθάσαμεν
  choice: уже достигли
  rationale: Глагол обозначает достижение некоторой ступени или положения. «Уже достигли» подчёркивает достигнутый к настоящему моменту результат, не предполагая окончательного совершенства.
- source_word: τῷ αὐτῷ
  choice: и дальше
  rationale: В данном кратком греческом тексте подразумевается продолжение по тому же пути или в соответствии с достигнутой мерой, но существительное «правило» отсутствует. «И дальше» естественно выражает постоянство, не вводя отсутствующего в тексте понятия.
- source_word: στοιχεῖν
  choice: держаться
  rationale: Глагол передаёт движение в установленном порядке, следование определённой линии или норме. «Держаться» ясно выражает верность уже достигнутому, хотя образ движения строем становится менее явным; он отмечен в сноске.
theological_decisions:
- issue: Следует ли явно добавлять к τῷ αὐτῷ существительное «правило», «мерило» или «норма»
  choice: Не добавлять его в основной текст, а передать призыв как «будем и дальше держаться того, чего уже достигли».
  alternative: «Будем поступать по тому же правилу» / «будем придерживаться того же мерила».
  rationale: В SBLGNT существительное, обозначающее правило или мерило, отсутствует. Его добавление сделало бы подразумеваемый образ слишком определённым и могло бы отразить влияние расширенных текстовых форм или традиционных переводов.
- issue: Означает ли ἐφθάσαμεν достижение окончательного духовного совершенства
  choice: Передать нейтрально как «уже достигли», то есть достигли некоторой ступени.
  alternative: «Достигли совершенства».
  rationale: Контекст непосредственно перед этим отрицает, что Павел уже достиг цели или стал совершенным. Поэтому в стихе говорится о сохранении достигнутого уровня, а не о заявлении окончательного совершенства.
translation_notes:
  register: Современный литературный русский язык, краткий и увещательный тон. «Будем и дальше держаться» понятно широкому кругу читателей и передаёт постоянство без внесения в основной текст отсутствующего существительного «правило».
