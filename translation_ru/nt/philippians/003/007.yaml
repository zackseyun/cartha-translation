  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: ru
  text: Но всё, что было для меня приобретением, я счёл убытком ради Мессии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за Мессии»; традиционно: «ради Христа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление прежним основаниям для уверенности, перечисленным выше.
- source_word: ἅτινα
  choice: всё, что
  rationale: Естественно передаёт неопределённо-относительное местоимение и охватывает всю совокупность ранее названных преимуществ.
- source_word: κέρδη
  choice: приобретением
  rationale: Сохраняет образ бухгалтерского подсчёта; собирательное единственное число естественно согласуется по-русски с конструкцией «всё, что».
- source_word: ἥγημαι
  choice: я счёл
  rationale: Передаёт совершившуюся переоценку; контекст показывает, что её результат остаётся в силе.
- source_word: διὰ τὸν Χριστόν
  choice: ради Мессии
  rationale: διά с винительным допускает причинно-мотивационное значение; «ради» здесь естественно выражает то, что Мессия стал основанием этой переоценки, не устраняя альтернативу «из-за Мессии».
- source_word: ζημίαν
  choice: убытком
  rationale: Сохраняет коммерческую метафору и прямой контраст с κέρδη.
theological_decisions:
- issue: Передача Χριστόν
  choice: Мессии
  alternative: Христа
  rationale: Χριστός здесь можно понимать как титул; перевод «Мессия» раскрывает его значение. Традиционное «Христос» отмечено как допустимая альтернатива.
- issue: Значение διὰ τὸν Χριστόν
  choice: ради Мессии
  alternative: из-за Мессии
  rationale: Оборот может указывать на причину или мотив. Основной текст использует естественное в данном контексте «ради», а примечание сохраняет причинную альтернативу.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной синтаксической структурой. Бухгалтерская метафора «приобретение — убыток» сохранена; архаические обороты исключены.
