id: PHP.3.9
reference: Philippians 3:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: ru
  text: и оказаться в Нём, не имея собственной праведности от закона[b], но имея праведность через веру в Мессию[a] — праведность от Бога, основанную на вере.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через верность Мессии».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «справедливости»; так же во втором случае употребления слова «праведность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: оказаться
  rationale: Передаёт аористный пассивный сослагательный глагол в естественной русской форме и сохраняет смысл того, в каком состоянии Павел желает быть найденным или предстать.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Буквально сохраняет ёмкое павловское выражение единения с Мессией, не сводя его к одному толкованию.
- source_word: μὴ ἔχων
  choice: не имея
  rationale: Сохраняет обстоятельственную причастную конструкцию, описывающую состояние Павла.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: «Праведность» — естественный и богословски ёмкий русский эквивалент; возможный оттенок справедливости отмечен в сноске.
- source_word: τὴν ἐκ νόμου
  choice: от закона
  rationale: Кратко передаёт источник или происхождение, выраженные ἐκ; строчная буква не навязывает более узкую идентификацию закона, чем допускает контекст.
- source_word: διὰ πίστεως Χριστοῦ
  choice: через веру в Мессию
  rationale: В основном тексте принят объектный смысл родительного оборота, а реально возможное значение верности Мессии сохранено в сноске.
- source_word: Χριστοῦ
  choice: Мессию
  rationale: Передаёт Χριστός как значимый титул, а не только как ставшую именем традиционную форму «Христос».
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: праведность от Бога
  rationale: Сохраняет компактность и повтор существительного, которыми поясняется предшествующее выражение.
- source_word: ἐπὶ τῇ πίστει
  choice: основанную на вере
  rationale: Естественно передаёт значение основания или опоры, выраженное ἐπί с дательным падежом.
theological_decisions:
- issue: Значение πίστεως Χριστοῦ
  choice: 'объектный родительный: «вера в Мессию»'
  alternative: 'субъектный родительный: «верность Мессии»'
  rationale: Греческая конструкция допускает оба разбора. Основной текст следует распространённому объектному прочтению, не скрывая альтернативу.
- issue: Значение δικαιοσύνη в павловском контексте
  choice: «праведность» в основном тексте
  alternative: «справедливость»
  rationale: «Праведность» лучше сохраняет устойчивый религиозно-нравственный диапазон слова в этом контексте, тогда как сноска отмечает его юридико-этический оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского рассуждения. Повтор «праведность» сохранён ради структуры и смыслового акцента оригинала; местоимение «Нём» написано с прописной буквы по устойчивой русской библейской практике.
