source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: ru
  text: Который преобразит наше уничижённое тело[a], уподобив его Своему телу, исполненному славы[b], — действием силы[c], которой Он может даже подчинить Себе всё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тело нашего уничижения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «телу Его славы».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сообразно действию Его способности подчинить Себе всё».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: преобразит
  rationale: Глагол обозначает действительное изменение формы или состояния; «преобразит» естественно передаёт силу будущего действия.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: наше уничижённое тело
  rationale: Передаёт нынешнее состояние телесной приниженности или унижения, не сводя смысл лишь к смертности или физической слабости.
- source_word: σύμμορφον
  choice: уподобив его
  rationale: Передаёт результат преобразования — соответствие телу Христа по образу и форме — естественным современным русским языком.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: Своему телу, исполненному славы
  rationale: Выражает тело, характеризуемое славой, и сохраняет смысл греческой генитивной конструкции без двусмысленности слова «славный» в современном русском.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: действием силы
  rationale: Сочетание сохраняет идею действенной, проявляющей себя силы и при этом звучит естественнее буквального «согласно действию».
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: которой Он может
  rationale: Не создаёт впечатления, будто внешняя сила наделяет Христа способностью, и естественно связывает Его могущество с действующей силой.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: подчинить Себе всё
  rationale: Сохраняет значение подчинения власти и всеохватность τὰ πάντα.
theological_decisions:
- issue: Связь нынешнего телесного уничижения с будущей славой
  choice: Будущее действие передано как преобразование нынешнего уничижённого тела верующих в подобие исполненного славы тела Христа.
  alternative: Можно было прямо употребить лексику воскресения или уточнить природу прославленного тела.
  rationale: Греческий текст утверждает телесное преобразование и уподобление телу Христа, но в этом стихе не описывает механизм воскресения; перевод не добавляет такого уточнения.
- issue: Источник и характер силы Христа
  choice: Фраза передана так, чтобы сила была действенным проявлением могущества Христа, благодаря которому Он может подчинить Себе всё.
  alternative: «Силой, которая позволяет Ему» могло бы звучать так, будто способность сообщается Христу извне.
  rationale: Конструкция говорит о Его способности и действующей силе, не определяя её как внешне дарованную.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Начальное «Который» сохраняет синтаксическую связь с предыдущим стихом. Прописные местоимения, относящиеся ко Христу, использованы в соответствии с распространённой русской библейской издательской традицией.
