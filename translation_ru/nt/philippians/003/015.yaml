    rationale: Греческое καὶ τοῦτο означает «и это/это также». В русском после «если» частица «то» уже выполняет синтаксическую функцию, а добавочное «и это» создаёт стилистически тяжёлое удвоение. «То и это» можно понять, но оно не является лучшим современным литературным выражением.
