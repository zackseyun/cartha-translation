  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: ru
  text: Итак, все мы, достигшие зрелости[a], будем мыслить так[b]; а если в чём-либо вы мыслите иначе, то и это Бог вам откроет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенные». Греческое слово τέλειοι может означать «совершенные», но здесь, вероятно, указывает на духовную зрелость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будем держаться такого образа мыслей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка логическим переходом.
- source_word: ὅσοι
  choice: все мы
  rationale: В сочетании с формой первого лица φρονῶμεν выражение включает Павла и его адресатов; «все мы» естественно передаёт групповой и всеохватный смысл.
- source_word: τέλειοι
  choice: зрелые
  rationale: В данном контексте речь, вероятнее всего, идёт о духовной зрелости, поскольку выше Павел отрицает, что уже достиг цели или стал совершенным. В сноске сохранено буквальное значение «совершенные».
- source_word: τοῦτο φρονῶμεν
  choice: будем мыслить так
  rationale: Передаёт указание на описанный выше образ мыслей и увещевательное значение сослагательного наклонения; формулировка остаётся естественной и не сводит φρονέω только к отвлечённому мнению.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: если в чём-либо вы мыслите иначе
  rationale: Сохраняет условность, неопределённый охват τι и расхождение в образе мыслей без уточнения предмета разногласия.
- source_word: καὶ τοῦτο
  choice: то и это
  rationale: Сохраняет повтор указательного местоимения и подчёркивает, что Бог откроет адресатам также и тот вопрос, в котором они мыслят иначе.
- source_word: ἀποκαλύψει
  choice: откроет
  rationale: Прямой и богословски ёмкий русский эквивалент, передающий действие божественного откровения без излишнего пояснения.
theological_decisions:
- issue: Значение τέλειοι в увещевании Павла
  choice: зрелые
  alternative: совершенные
  rationale: 'Непосредственный контекст не позволяет без оговорки приписать адресатам уже достигнутое абсолютное совершенство: Павел сам говорит, что ещё не достиг цели. «Зрелые» передаёт вероятный контекстуальный смысл, а сноска сохраняет подлинную лексическую напряжённость.'
- issue: Характер Божьего действия в ἀποκαλύψει
  choice: Бог вам откроет
  alternative: Бог даст вам понять
  rationale: Выбрано более прямое соответствие глаголу «открывать», чтобы не ослаблять возможный смысл божественного откровения и не уточнять его способ.
translation_notes:
  register: Современный литературный русский язык; тон увещевательный, достойный и понятный. Синтаксис сохраняет логическую связь двух частей стиха и намеренно не уточняет, в чём именно адресаты могут мыслить иначе.
