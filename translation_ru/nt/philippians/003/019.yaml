id: PHP.3.19
reference: Philippians 3:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: ru
  text: Их конец — погибель, их бог — чрево[a], и слава их — в их позоре; их мысли устремлены к земному.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их бог — их аппетит».'
    reason: Лексическая альтернатива поясняет смысл метафоры, не подменяя ею конкретный образ в основном тексте.
lexical_decisions:
- source_word: τέλος
  choice: конец
  rationale: Сохраняет краткость греческого выражения и допускает смысл как завершения, так и конечного исхода.
- source_word: ἀπώλεια
  choice: погибель
  rationale: Передаёт суровый, в том числе эсхатологический, смысл слова, не сводя его лишь к физическому уничтожению.
- source_word: κοιλία
  choice: чрево
  rationale: Сохраняет конкретный телесный образ греческого текста. Слово слегка возвышенное, но понятно в данном афористическом обороте и не превращает метафору в толкование.
- source_word: δόξα
  choice: слава
  rationale: Прямой эквивалент, сохраняющий резкое и ироничное противопоставление славы и позора.
- source_word: αἰσχύνη
  choice: позор
  rationale: Естественно выражает бесчестье и постыдность; в сочетании «слава — в позоре» создаёт ясный риторический контраст.
- source_word: τὰ ἐπίγεια
  choice: земное
  rationale: Ёмкое русское собирательное обозначение того, что относится к земной сфере.
- source_word: φρονοῦντες
  choice: их мысли устремлены
  rationale: Передаёт не случайные размышления, а устойчивую направленность мышления и интересов.
- source_word: ὧν ... ὧν
  choice: их ... их
  rationale: Естественно продолжает характеристику людей из предыдущего стиха, сохраняя повтор притяжательной конструкции без тяжеловесного «чей».
theological_decisions:
- issue: Метафорический смысл выражения «их бог — чрево»
  choice: Конкретный образ «чрево» сохранён в основном тексте.
  alternative: «их бог — их аппетит» или шире «их бог — их желания»
  rationale: Греческий текст использует телесную метафору, которая может указывать на аппетит, чувственные желания или служение телесным потребностям. Основной текст не сужает этот образ до одного толкования.
- issue: Характер погибели (ἀπώλεια)
  choice: «погибель» без дополнительного уточнения
  alternative: «уничтожение» или «вечная погибель»
  rationale: Контекст допускает эсхатологический смысл, однако сам стих не уточняет ни способ, ни продолжительность погибели; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллельные конструкции и контраст «слава — позор» сохранены; финальная фраза передаёт устойчивую направленность мышления естественным русским оборотом.
