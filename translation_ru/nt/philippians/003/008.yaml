    issue: «ради превосходящей ценности познания»
    rationale: Греческое διὰ τὸ ὑπερέχον обозначает основание оценки («из-за/ввиду превосходства»), тогда как «ради» в русском обычно маркирует цель или чью-либо пользу; само сочетание «превосходящая ценность» также не вполне естественно.
  - severity: low
    issue: «всё это» во втором случае
    rationale: τὰ πάντα повторяет всеохватное «всё» без указательного элемента. Простой повтор лучше сохраняет риторику и объём оригинала.
  - severity: low
    issue: «приобрести Мессию»
    rationale: Хотя метафора κερδήσω допускает «приобрести», в русском это может звучать как получение вещи. «Обрести» естественнее в личностном отношении и не отменяет образ выгоды.
