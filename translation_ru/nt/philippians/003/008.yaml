  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: ru
  text: Более того, я всё считаю потерей ввиду непревзойдённой ценности познания Мессии Иисуса, моего Господа. Ради Него я лишился всего и считаю всё отбросами[a], чтобы обрести Мессию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может обозначать мусор, нечистоты или навоз и выражает резкое пренебрежение.
    reason: lexical_alternative
  - marker: b
    text: «Мессия» — то же титульное слово, которое традиционно передаётся как «Христос».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Более того
  rationale: Сочетание частиц усиливает и развивает предыдущую мысль; этот оборот естественно передаёт переход к ещё более решительному утверждению.
- source_word: ἡγοῦμαι
  choice: считаю
  rationale: Глагол обозначает осознанную оценку; один и тот же русский эквивалент сохранён в обоих случаях.
- source_word: πάντα / τὰ πάντα
  choice: всё / всё это
  rationale: Передаёт всеохватность выражения; во втором случае указательное «это» естественно связывает слова с перечисленным ранее, не сужая их объёма.
- source_word: ζημίαν
  choice: потерей
  rationale: Сохраняет метафору прибыли и убытка, продолженную глаголом κερδήσω.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: ради превосходящей ценности познания
  rationale: Передаёт субстантивированное τὸ ὑπερέχον как исключительную ценность или превосходство, а γνώσεως — как «познание», сохраняя как содержательный, так и личностный оттенок.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» делает его смысл явным в современном русском.
- source_word: τοῦ κυρίου μου
  choice: моего Господа
  rationale: Сохраняет притяжательное отношение и христологическую весомость κύριος.
- source_word: δι’ ὃν
  choice: Ради Него
  rationale: Передаёт личную направленность и причинно-жертвенный смысл греческого оборота.
- source_word: ἐζημιώθην
  choice: я лишился
  rationale: Естественно передаёт аорист пассивного глагола как понесённую утрату, не утверждая сверх текста, была ли она исключительно добровольной.
- source_word: σκύβαλα
  choice: отбросами
  rationale: Сильное пренебрежительное слово для ненужных или нечистых отходов; «отбросы» звучит выразительно и достойно, а более грубый возможный смысл отмечен в сноске.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: чтобы приобрести Мессию
  rationale: «Чтобы» передаёт цель, а «приобрести» продолжает образ прибыли и потери.
theological_decisions:
- issue: Передача Χριστός в посланиях Павла
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово сохраняет титульное значение; традиционный русский эквивалент приведён в сноске, чтобы не исключать его привычное прочтение.
- issue: Характер «познания» в τῆς γνώσεως
  choice: познание Мессии Иисуса
  alternative: знание о Мессии Иисусе / знание, исходящее от Мессии Иисуса
  rationale: Объектный генитив наиболее естественен в контексте личного отношения Павла к своему Господу, однако «познание» не сводится ни только к сведениям, ни только к переживанию.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified апостольским тоном. Сохранены повтор «считаю», всеохватность «всё» и сквозная метафора потери и приобретения. Синтаксис разделён на два предложения ради естественной русской читаемости без изменения логической связи.
