source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: ru
  text: Ведь многие живут как враги креста Мессии[a]. Я часто говорил вам о них, а теперь говорю о них со слезами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа».'
    reason: Альтернативная передача греческого титула Χριστός.
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное прямо обозначает неопределённо большое число людей; «многие» — точный и естественный русский эквивалент.
- source_word: γὰρ
  choice: ведь
  rationale: Союз обосновывает предшествующее наставление; «ведь» естественно передаёт пояснительно-причинную связь в современном русском.
- source_word: περιπατοῦσιν
  choice: живут
  rationale: Глагол буквально означает «ходят», но у Павла здесь метафорически описывает образ жизни. «Живут» ясно передаёт смысл без неестественного для русского оборота «ходят как враги».
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: я часто говорил вам
  rationale: Наречие πολλάκις и имперфект ἔλεγον выражают неоднократное действие в прошлом; русский оборот сохраняет эту повторяемость.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: а теперь говорю даже плача
  rationale: Причастие настоящего времени κλαίων изображает Павла плачущим в момент речи. «Даже плача» сохраняет и обстоятельственную форму, и усилительное καί.
- source_word: ἐχθροὺς
  choice: как враги
  rationale: Существительное обозначает людей, враждебных кресту. «Как враги» естественно связывает приложение с метафорическим описанием их жизни.
- source_word: σταυροῦ
  choice: креста
  rationale: Прямой традиционный эквивалент, обозначающий распятие и связанную с ним богословскую реальность.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός естественно воспринимается как титул; «Мессия» передаёт его значение, а не только традиционную транслитерацию.
theological_decisions:
- issue: Передача титула Χριστοῦ в выражении τοῦ σταυροῦ τοῦ Χριστοῦ
  choice: креста Мессии
  alternative: креста Христа
  rationale: Контекст не требует понимать Χριστός как имя собственное; передача «Мессия» сохраняет титульное значение. Традиционный вариант «Христа» указан в сноске.
- issue: Синтаксическая связь τοὺς ἐχθροὺς с περιπατοῦσιν и λέγω
  choice: многие живут как враги… Я… говорю о них
  alternative: многие… о которых я говорил… — враги креста
  rationale: 'Греческая фраза имеет напряжённую, несколько прерывистую конструкцию: относительное οὓς и приложение τοὺς ἐχθρούς стоят в винительном падеже при λέγω, тогда как смысл характеризует образ жизни этих людей. Русская формулировка сохраняет обе смысловые связи, не утверждая сверх текста отдельной доктринальной классификации.'
translation_notes:
  register: Современный литературный русский язык с достойным, эмоционально сдержанным звучанием. Ради естественности длинная греческая конструкция разделена на два предложения; повтор «говорил… говорю» и непосредственное «плача» сохранены.
