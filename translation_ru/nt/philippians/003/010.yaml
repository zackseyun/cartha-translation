id: PHP.3.10
reference: Philippians 3:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: ru
  text: чтобы познать Его, силу Его воскресения и участие в Его страданиях, сообразуясь с Его смертью[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «становясь подобным Его смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: познать
  rationale: Инфинитив передаёт цель или стремление Павла; «познать» сохраняет личный и опытный смысл, не сводя его к получению сведений.
- source_word: δύναμιν
  choice: силу
  rationale: Прямое и естественное соответствие δύναμις, обозначающее действенную силу, явленную в воскресении Христа.
- source_word: ἀναστάσεως
  choice: воскресения
  rationale: Устоявшийся и точный термин для воскресения Христа.
- source_word: κοινωνίαν
  choice: участие
  rationale: Передаёт реальную причастность к страданиям Христа; в современном русском яснее, чем буквальное, но неоднозначное «общение».
- source_word: παθημάτων
  choice: страданиях
  rationale: Прямо передаёт πάθημα и сохраняет личную связь страданий со Христом.
- source_word: συμμορφιζόμενος
  choice: уподобляясь
  rationale: Настоящее причастие обозначает продолжающийся процесс обретения соответствия; деепричастие естественно сохраняет зависимость оборота от стремления познать Христа.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: Ему в смерти
  rationale: В сочетании с «уподобляясь» естественный русский синтаксис требует указать лицо и сферу уподобления; смысл соответствия смерти Христа сохранён.
theological_decisions:
- issue: Значение κοινωνίαν παθημάτων αὐτοῦ
  choice: реальное участие в страданиях Христа
  alternative: общение с Его страданиями либо сопричастность Его страданиям
  rationale: Конструкция выражает причастность Павла к образу страданий Христа, а не только сочувствие; «участие» сохраняет этот смысл без конфессионального уточнения.
- issue: Характер συμμορφιζόμενος
  choice: продолжающееся уподобление Христу в Его смерти
  alternative: состояние уже достигнутого соответствия Его смерти
  rationale: Форма настоящего времени благоприятствует процессуальному оттенку, но не определяет подробно способ этого уподобления.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Номинальная последовательность оригинала в основном сохранена, но δυσестественное «общение Его страданий» заменено ясным «участие в Его страданиях». Местоимения, относящиеся ко Христу, написаны с прописной буквы согласно распространённой русской библейской традиции.
