  source_fidelity: 'Начальная часть точно передаёт целевой инфинитив τοῦ γνῶναι и три связанных объекта: познание Христа, силу Его воскресения и участие в Его страданиях. «Участие в Его страданиях» удачно выражает κοινωνία без сведения её к сочувствию. Однако «уподобляясь Ему в смерти» смещает прямое отношение συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ: в греческом уподобление относится к Его смерти, а не непосредственно к Нему «в смерти».'
  naturalness: «Сообразуясь с Его смертью» — понятное литературное выражение, уместное для современного библейского русского и более точное, чем предложенное в черновике. Убрана ненужная запятая между однородными дополнениями «Его» и «силу».
  terminology: «Познать», «сила воскресения», «участие в страданиях» и «смерть» точны и соответствуют современному литературному библейскому регистру. «Сообразуясь с Его смертью» передаёт процессуальный оттенок настоящего причастия συμμορφιζόμενος и дательный объект τῷ θανάτῳ.
