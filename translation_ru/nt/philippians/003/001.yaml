  text: Τὸ λοιπόν, ἀδελφοί μου, χαίρετε ἐν κυρίῳ. τὰ αὐτὰ γράφειν ὑμῖν ἐμοὶ μὲν οὐκ ὀκνηρόν, ὑμῖν δὲ ἀσφαλές.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: ru
  text: Впрочем[a], братья мои[b], радуйтесь в Господе. Писать вам то же самое для меня не тягостно[c], а для вас это надёжная защита[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наконец»; или: «Что же до остального».'
    reason: lexical_alternative
  - marker: b
    text: Обращение «братья» здесь относится ко всей общине, то есть к братьям и сёстрам.
    reason: cultural_note
  - marker: c
    text: 'Или: «не обременительно»; или: «не в тягость».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «для вас безопасно» или «для вас надёжно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Впрочем
  rationale: Выражение вводит переход к следующей мысли. «Впрочем» естественно звучит по-русски и не создаёт ложного впечатления, будто послание уже заканчивается; другие возможные значения отмечены в сноске.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохранена грамматически мужская форма греческого обращения; в данном контексте оно обращено ко всей общине, что пояснено в сноске.
- source_word: χαίρετε
  choice: радуйтесь
  rationale: Форма повелительного наклонения во множественном числе передана прямым призывом, сохраняя характерное для Павла значение χαίρω.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Прямой и традиционно понятный перевод, сохраняющий связь радости с Господом без уточнения характера этой связи.
- source_word: τὰ αὐτά
  choice: то же самое
  rationale: Формулировка сохраняет неопределённость греческого текста относительно того, какие именно прежние наставления Павел повторяет.
- source_word: γράφειν
  choice: писать
  rationale: Инфинитив естественно передаёт действие в русской безлично-предикативной конструкции.
- source_word: οὐκ ὀκνηρόν
  choice: не тягостно
  rationale: Передаёт мысль, что повторное написание не обременяет Павла и не вызывает у него нежелания, не сужая смысл до скуки.
- source_word: ἀσφαλές
  choice: служит защитой
  rationale: Греческое прилагательное выражает безопасность, надёжность или защищённость. В русском контексте глагольно-именная конструкция звучит естественно и передаёт защитную функцию повторного наставления.
theological_decisions:
- issue: Гендерная форма обращения к общине
  choice: братья мои
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматически мужское множественное число оригинала, а сноска поясняет, что обращение охватывает всю общину.
- issue: Защитное значение повторного наставления
  choice: для вас это служит защитой
  alternative: для вас это безопасно; это укрепляет вашу безопасность
  rationale: Выбран естественный русский оборот, выражающий смысл ἀσφαλές, но не уточняющий, от какой именно опасности защищает повторение наставления.
translation_notes:
  register: Современный литературный русский язык; тон тёплый, наставительный и достойный. Синтаксис остаётся близким к греческому, однако заключительная предикативная конструкция передана естественным русским оборотом. Неопределённость выражений τὸ λοιπόν и τὰ αὐτά сохранена, а основные лексические альтернативы вынесены в сноски.
