    issue: Ненормативное/неудачное согласование при «те, кто»
    rationale: 'В тексте стоят формы единственного числа: «служит», «хвалится», «не полагается», хотя соотносительное слово «те» и субъект «мы» требуют здесь множественного числа: «служат», «хвалятся», «не полагаются».'
  - severity: low
