  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: ru
  text: 'Ведь мы и есть обрезание: мы служим Божьим Духом[a], хвалимся Мессией Иисусом[b] и не полагаемся на плоть[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «мы служим Богу в духе».'
    reason: textual_variant
  - marker: b
    text: «Мессия» передаёт титул Христос (греч. Χριστός).
    reason: lexical_alternative
  - marker: c
    text: «Плоть» здесь означает телесные и человеческие основания для уверенности — например, обрезание, происхождение или религиозный статус.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: обрезание
  rationale: 'Сохранён конкретный заветный термин и риторическая острота утверждения Павла: «обрезание — это мы», без поясняющей парафразы в основном тексте.'
- source_word: πνεύματι θεοῦ
  choice: Его Духом
  rationale: Дательный передаёт средство или сферу служения; «Его» естественно соотносит Духа с Богом, названным при глаголе, и избегает тяжеловесного повтора.
- source_word: λατρεύοντες
  choice: служит Богу
  rationale: Глагол обозначает религиозное, богослужебное служение. «Служит Богу» сохраняет оттенок священного служения лучше, чем одно «поклоняется».
- source_word: καυχώμενοι
  choice: хвалится
  rationale: Передаёт контраст между основанием для похвалы в Мессии и уверенностью в человеческих преимуществах; форма согласована с собирательным определением «те, кто».
- source_word: Χριστῷ Ἰησοῦ
  choice: Мессией Иисусом
  rationale: Χριστός передан как живой мессианский титул, а не как непрозрачное имя; творительный после «хвалиться» естественен по-русски.
- source_word: σαρκὶ
  choice: плоть
  rationale: Сохранена намеренная буквальная и метафорическая многозначность σάρξ; контекст раскрывается в примечании и последующих стихах.
- source_word: πεποιθότες
  choice: не полагается
  rationale: Передаёт устойчивую опору или уверенность, выраженную перфектным причастием, естественным современным русским оборотом.
- source_word: γάρ
  choice: Потому что
  rationale: Ясно передаёт объяснительную связь с предшествующим предупреждением.
theological_decisions:
- issue: Значение σάρξ
  choice: «плоть» как телесные и человеческие основания для религиозной уверенности
  alternative: «греховная природа» как внутреннее нравственное начало
  rationale: Ближайший контекст перечисляет обрезание, происхождение, законнический статус и достижения Павла; поэтому нельзя сужать значение до внутренней склонности ко греху.
- issue: Смысл πνεύματι θεοῦ
  choice: служение посредством или в сфере Духа Божьего
  alternative: служение Богу человеческим духом, то есть духовно
  rationale: Чтение SBLGNT θεοῦ естественнее указывает на Божьего Духа, хотя грамматический оттенок средства и сферы остаётся открытым.
- issue: Идентификация «обрезания»
  choice: сохранить прямое «обрезание — это мы»
  alternative: пояснить как «истинно обрезанные» или «народ Божьего обрезания»
  rationale: Прямое выражение сохраняет парадокс и богословское напряжение Павловой формулировки, не добавляя отсутствующего в греческом слова «истинное».
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис сохраняет трёхчастное описание, а ключевые термины «обрезание», «Дух», «Мессия» и «плоть» оставлены богословски насыщенными без конфессиональной конкретизации.
