    rationale: В этой позиции «и» может восприниматься как усилительная частица, а не как «также». «Мы также с нетерпением ожидаем» прямо и естественно передаёт καί.
  - severity: low
    issue: Неточная лексическая альтернатива «наше государство» в сноске a.
    rationale: πολίτευμα может обозначать гражданское устройство или общину, но «государство» в современном русском излишне институционально и может увести от смысла небесной гражданской принадлежности.
