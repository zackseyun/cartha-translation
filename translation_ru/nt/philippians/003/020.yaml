  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: ru
  text: Ведь наше гражданство[a] — на небе[b], откуда мы также с нетерпением ожидаем Спасителя — Господа Иисуса, Мессию[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наша гражданская община».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на небесах».'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «Господа Иисуса Христа».'
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: гражданство
  rationale: Слово имеет гражданско-политический смысл и здесь обозначает принадлежность верующих к небесному сообществу; «гражданство» ясно передаёт этот смысл, не превращая его без необходимости в название государства.
- source_word: ἐν οὐρανοῖς
  choice: на небе
  rationale: Греческое существительное стоит во множественном числе, но в современном русском для обозначения небесной сферы естественно единственное число «на небе»; буквальная форма отмечена в сноске.
- source_word: ὑπάρχει
  choice: —
  rationale: Настоящее существование, выраженное глаголом, по-русски естественно передаётся именной конструкцией с тире и опущенной связкой настоящего времени.
- source_word: ἐξ οὗ
  choice: откуда
  rationale: Наречие естественно отсылает к небу как к месту, откуда придёт ожидаемый Спаситель.
- source_word: ἀπεκδεχόμεθα
  choice: ожидаем с нетерпением
  rationale: Передаёт продолжающееся напряжённое и исполненное надежды ожидание, заключённое в сложном греческом глаголе.
- source_word: σωτῆρα
  choice: Спасителя
  rationale: Устоявшийся и точный русский эквивалент, сохраняющий как смысл избавления, так и христологическую значимость слова.
- source_word: κύριον
  choice: Господа
  rationale: Нормальное новозаветное наименование Иисуса, точно передающее κύριος в данном христологическом контексте.
- source_word: Χριστόν
  choice: Мессию
  rationale: Здесь слово сохраняет силу титула Помазанника, а не служит просто частью личного имени; «Мессия» раскрывает значение титула современному читателю.
theological_decisions:
- issue: Передача Χριστόν в сочетании κύριον Ἰησοῦν Χριστόν
  choice: Господа Иисуса, Мессию
  alternative: Господа Иисуса Христа
  rationale: Основной текст сохраняет титульное значение Χριστός как «Мессия», а пунктуация показывает, что это наименование того же Спасителя, не добавляя отсутствующего в греческом отдельного лица. Традиционный вариант дан в сноске.
- issue: Характер небесной принадлежности, выраженной πολίτευμα
  choice: гражданство
  alternative: государство; гражданское сообщество
  rationale: Контекст допускает оттенок как статуса граждан, так и самого политического сообщества. Основной вариант естественен по-русски, а сноска сохраняет лексическую широту без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным звучанием. Частица «ведь» естественно передаёт γάρ, а конструкция с тире сохраняет выразительность и нормальный русский синтаксис.
