  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: ru
  text: Хотя у меня самого есть основания для уверенности даже в плоти. Если кто-то другой считает, что у него есть основания для уверенности в плоти[a], то у меня их ещё больше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в плоти»; здесь имеются в виду человеческое происхождение, положение и внешние религиозные преимущества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: хотя и
  rationale: Передаёт уступительное значение в начале высказывания и естественно связывает стих с предыдущей мыслью.
- source_word: ἔχων πεποίθησιν
  choice: у меня самого есть основания полагаться
  rationale: Передаёт устойчивую уверенность и её основание; по-русски звучит естественнее буквального «имея уверенность», не превращая утверждение в простой перечень заслуг.
- source_word: καὶ ἐν σαρκί
  choice: даже на плоть
  rationale: Сохраняет исходный образ «плоти» и усилительное καί; глагольное управление «полагаться на» естественно для русского языка.
- source_word: δοκεῖ
  choice: думает
  rationale: Нейтрально передаёт мнение человека о наличии у него оснований для такой уверенности.
- source_word: πεποιθέναι ἐν σαρκί
  choice: может полагаться на плоть
  rationale: Выражает установившуюся уверенность, подразумеваемую перфектным инфинитивом, в естественной русской конструкции.
- source_word: μᾶλλον
  choice: тем более
  rationale: Сохраняет краткое и выразительное сравнительное утверждение Павла.
theological_decisions:
- issue: Значение σάρξ в Филиппийцам 3:4
  choice: Сохранить в основном тексте слово «плоть», пояснив его контекстуальный смысл в сноске.
  alternative: «человеческие преимущества» или «внешнее положение»
  rationale: Последующие стихи называют обрезание, происхождение, отношение к закону и ревность; поэтому здесь речь идёт о человеческих и внешних основаниях для уверенности, а не непосредственно о «греховной природе». Сохранение образа не устраняет присущую слову богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык; достоинство и риторическая краткость оригинала сохранены. Конструкция «есть основания полагаться» делает смысл понятным без устранения образа «плоти».
