  - severity: low
    issue: «Праведности в Законе»
    rationale: Формально близко к ἐν νόμῳ, но по-русски способно обозначать праведность, находящуюся в тексте Закона. «По Закону» яснее выражает нормативную сферу, сохраняя исходную ограниченную рамку.
  revised_text: в отношении ревности — преследовавший церковь; в отношении праведности по Закону — оказавшийся безупречным.
