  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: ru
  text: в отношении ревности — преследовавший церковь; в отношении праведности по Закону — оказавшийся безупречным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: что до
  rationale: Оборот вводит критерий оценки и естественно передаёт повторяющуюся риторическую конструкцию κατά.
- source_word: ζῆλος
  choice: ревность
  rationale: «Ревность» передаёт пылкую религиозную преданность Павла и сохраняет привычную для библейского контекста лексику.
- source_word: διώκων
  choice: гнавший
  rationale: В данном контексте причастие обозначает враждебное преследование верующих; форма «гнавший» кратка и сохраняет причастную структуру.
- source_word: ἐκκλησίαν
  choice: церковь
  rationale: Здесь имеется в виду христианская община, а не собрание вообще.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: «Праведность» лучше всего выражает соответствие религиозно-нравственной норме Закона; возможный оттенок справедливости не доминирует в этом контексте.
- source_word: ἐν νόμῳ
  choice: в Законе
  rationale: Буквальная конструкция естественна по-русски и сохраняет открытым вопрос, обозначает ли ἐν сферу, основание или мерило этой праведности.
- source_word: γενόμενος
  choice: ставший
  rationale: Причастие передаёт результат, достигнутый в прежней жизни Павла, и не сводит выражение к простому прилагательному.
- source_word: ἄμεμπτος
  choice: безупречным
  rationale: Слово означает отсутствие основания для порицания в названной системе оценки и само по себе не утверждает абсолютной безгрешности.
theological_decisions:
- issue: Пределы утверждения Павла о безупречности
  choice: Безупречность относится к праведности, оцениваемой в рамках Закона.
  alternative: Павел утверждает свою абсолютную нравственную безгрешность.
  rationale: Грамматика связывает ἄμεμπτος с выражением δικαιοσύνη τὴν ἐν νόμῳ; потому перевод сохраняет ограничивающую рамку, не добавляя толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с краткой, параллельной структурой исходного перечисления. Причастные формы сохранены, поскольку стих является частью более длинного предложения и такой синтаксис звучит достойно и понятно.
