  rationale: 'Исправлены две точки, где буквальная калька ослабляла ясность современного русского: διώκων передано как «преследовавший», а ἐν νόμῳ — как «по Закону». Параллельная структура и причастный характер исходного перечисления сохранены; «оказавшийся безупречным» передаёт результативность γενόμενος и контекстуальную, законническую рамку оценки.'
