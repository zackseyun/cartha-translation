lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: обрезанный на восьмой день
  rationale: Естественно передаёт сжатое греческое выражение и сохраняет указание на совершение обрезания в установленный восьмой день.
- source_word: ἐκ γένους Ἰσραήλ
  choice: из народа Израиля
  rationale: Здесь γένος обозначает происхождение и принадлежность к народу; этот вариант ясен современному читателю и не сужает смысл до одной семьи.
- source_word: φυλῆς Βενιαμίν
  choice: из колена Вениамина
  rationale: «Колено» — укоренившееся и понятное обозначение племенного подразделения Израиля; предлог «из» передаёт происхождение.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: еврей от евреев
  rationale: Сохраняет краткость, эмфазу и некоторую неоднозначность греческой формулы, указывающей на еврейское происхождение и идентичность Павла.
- source_word: κατὰ νόμον
  choice: что касается Закона
  rationale: Передаёт значение отношения или сферы, не создавая впечатления, будто речь непосредственно идёт о степени соблюдения Закона.
- source_word: Φαρισαῖος
  choice: фарисей
  rationale: Общепринятое русское наименование этой иудейской религиозной группы.
theological_decisions:
- issue: Смысл сочетания κατὰ νόμον Φαρισαῖος
  choice: что касается Закона — фарисей
  alternative: по Закону — фарисей
  rationale: Выбранный вариант ясно связывает слово «фарисей» со сферой отношения к Закону, но не утверждает сверх текста, что Павел характеризует здесь качество собственного законопослушания.
- issue: Передача Ἑβραῖος ἐξ Ἑβραίων
  choice: еврей от евреев
  alternative: еврей, рождённый от евреев
  rationale: Основной текст сохраняет компактность и широту греческого выражения; возможное уточнение родового происхождения вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмом перечисления. Причастная конструкция сохранена, поскольку стих продолжает синтаксис предыдущего контекста. «Закон» написан с прописной буквы как обозначение Закона Моисея.
