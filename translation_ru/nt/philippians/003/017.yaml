  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: ru
  text: Братья[a], вместе подражайте мне и обращайте внимание на тех, кто живёт так же, как мы, служащие вам образцом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое обращение имеет форму мужского рода во множественном числе, но, вероятно, относится ко всей общине.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «кто живёт так, как вы имеете нас образцом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: вместе подражайте мне
  rationale: Передаёт призыв стать совместными подражателями Павлу; наречие «вместе» сохраняет коллективный смысл существительного Συμμιμηταί, а естественная русская повелительная конструкция передаёт γίνεσθε.
- source_word: ἀδελφοί
  choice: Братья
  rationale: Сохраняет грамматически мужскую форму обращения; вероятное обращение ко всей общине поясняется в сноске.
- source_word: σκοπεῖτε
  choice: присматривайтесь
  rationale: Глагол выражает продолжительное внимательное наблюдение за людьми, чей образ жизни следует замечать и учитывать.
- source_word: οὕτω περιπατοῦντας
  choice: тех, кто живёт так
  rationale: В современном русском «живёт» естественно передаёт метафорическое περιπατέω в значении образа жизни, не создавая ошибочного впечатления о буквальной ходьбе.
- source_word: τύπον
  choice: пример
  rationale: Здесь τύπος означает образец для подражания; «пример» ясно и естественно передаёт эту функцию.
- source_word: ἡμᾶς
  choice: нашем
  rationale: 'Сохраняет множественное число греческого местоимения: Павел указывает на себя вместе со своими соработниками, а не только на себя.'
theological_decisions:
- issue: Охват обращения ἀδελφοί
  choice: В основном тексте «Братья», с пояснением вероятного обращения ко всей общине в сноске.
  alternative: «Братья и сёстры» непосредственно в основном тексте.
  rationale: Так сохраняется мужская форма греческого обращения и одновременно не скрывается его вероятный инклюзивный смысл в данном контексте.
- issue: Соотношение единственного «мне» и множественного «нас»
  choice: Сохранить переход от подражания лично Павлу к общему примеру Павла и его соработников.
  alternative: 'Свести оба выражения к одному лицу: «подражайте мне… мой пример».'
  rationale: Греческий текст намеренно использует μου в единственном числе, а затем ἡμᾶς во множественном; перевод не должен устранять это различие.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. «Вместе подражайте» сохраняет коллективную силу Συμμιμηταί; «живёт так» естественно раскрывает устойчивую метафору образа жизни. Все маркеры сносок присутствуют в основном тексте.
