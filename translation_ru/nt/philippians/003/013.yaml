lexical_decisions:
- source_word: ἀδελφοί
  choice: Братья
  rationale: Сохраняет мужскую форму греческого обращения; в данном употреблении Павел обращается ко всей общине, включая женщин, что пояснено в сноске.
- source_word: λογίζομαι
  choice: считаю
  rationale: Естественно передаёт смысл личной оценки или заключения в современном русском языке.
- source_word: κατειληφέναι
  choice: овладел этим
  rationale: Сохраняет образ достижения и захвата из ближайшего контекста; местоимение «этим» восполняет подразумеваемый объект, не уточняя его сверх текста.
- source_word: ἓν δέ
  choice: Но одно
  rationale: Сохраняет резкий эллиптический переход оригинала, не добавляя отсутствующего в греческом глагола «делаю».
- source_word: τὰ μὲν ὀπίσω
  choice: то, что позади
  rationale: Естественно выражает собирательный смысл субстантивированного греческого оборота и поддерживает пространственный образ.
- source_word: ἐπιλανθανόμενος
  choice: забывая
  rationale: Передаёт прямое лексическое значение причастия без замены его толкованием вроде «оставляя».
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: тому, что впереди
  rationale: Сохраняет пространственный контраст с «тем, что позади» и направление движения.
- source_word: ἐπεκτεινόμενος
  choice: устремляясь
  rationale: Передаёт активное вытягивание и движение вперёд в естественной русской форме, не чрезмерно усиливая образ.
theological_decisions:
- issue: Подразумеваемый объект при κατειληφέναι
  choice: Передать неопределённым «этим»
  alternative: Конкретизировать как «цель», «совершенство» или «награду»
  rationale: В стихе объект не назван; «этим» сохраняет связь с контекстом и подлинную неопределённость, не навязывая одного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Сохранены эллипсис «Но одно» и незавершённость фразы, переходящей в следующий стих; причастные обороты поддерживают образ направленного вперёд движения.
