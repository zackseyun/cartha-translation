lexical_decisions:
- source_word: εἴ πως
  choice: чтобы как-нибудь
  rationale: Передаёт зависимую от предыдущего контекста цель и сохраняет оттенок смиренной неопределённости относительно пути или способа, не утверждая сомнения в Божьем обещании.
- source_word: καταντήσω
  choice: достичь
  rationale: Глагол обозначает прибытие к цели; «достичь» естественно передаёт здесь метафорическое достижение эсхатологического исхода.
- source_word: εἰς
  choice: достичь воскресения
  rationale: Значение направления к цели естественно выражено русским управлением глагола «достичь» без отдельного предлога.
- source_word: ἐξανάστασιν
  choice: воскресения
  rationale: Существительное означает воскресение; буквальное словообразовательное воспроизведение было бы неестественным и могло бы неоправданно внушить особый технический смысл.
- source_word: τὴν ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устойчиво и ясно передаёт исход из среды мёртвых, сохраняя различие между воскресением из мёртвых и более общим выражением о воскресении мёртвых.
theological_decisions:
- issue: Следует ли резко отличать ἐξανάστασις от обычного ἀνάστασις и тем самым подразумевать особое воскресение.
  choice: 'В основном тексте: «воскресения из мёртвых».'
  alternative: «восстания из среды мёртвых» или буквальное «из-воскресение из мёртвых».
  rationale: Необычная форма слова и повторная идея выхода отмечены в сноске, но сами по себе не требуют вводить русский неологизм или утверждать отдельную доктрину. Формулировка сохраняет возможный оттенок отличительности, не разрешая его сверх данных текста.
- issue: Выражает ли εἴ πως сомнение Павла в будущем воскресении.
  choice: Сохранить осторожное «как-нибудь» без пояснения, будто Павел сомневается в Божьем обещании.
  alternative: «если только смогу» или «может быть, достигну», что сильнее выражало бы сомнение в исходе.
  rationale: Греческое выражение допускает оттенок неопределённости, прежде всего относительно способа достижения цели. Перевод не должен ни устранять эту напряжённость, ни превращать её в однозначное сомнение в самом воскресении.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. «Мёртвых» написано с «ё». Начальное «чтобы» сохраняет синтаксическую связь стиха с предшествующей мыслью.
