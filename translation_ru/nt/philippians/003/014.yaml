  text: κατὰ σκοπὸν διώκω ⸀εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: ru
  text: Я стремлюсь к цели — к награде высшего Божьего призвания в Мессии Иисусе[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвания свыше» или «небесного призвания».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «во Христе Иисусе»; здесь Χριστός передано словом «Мессия», поскольку это титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: к цели
  rationale: В контексте состязания оборот обозначает направленность движения к намеченной цели; русское «к цели» естественно сохраняет спортивный образ.
- source_word: διώκω
  choice: я стремлюсь
  rationale: Глагол передаёт настойчивое преследование цели. «Стремлюсь» естественно звучит по-русски и соответствует образу напряжённого движения вперёд.
- source_word: εἰς τὸ βραβεῖον
  choice: к награде
  rationale: Предлог εἰς указывает на направленность и цель усилий. Повторение «к» сохраняет параллельное движение к цели и награде, не добавляя прямо отсутствующего в тексте значения «чтобы получить».
- source_word: ἄνω
  choice: ввысь
  rationale: «Ввысь» сохраняет пространственную направленность ἄνω и не сводит выражение исключительно к значению «небесный» или «исходящий свыше».
- source_word: κλήσεως τοῦ θεοῦ
  choice: Божьего призвания
  rationale: 'Так передаётся греческая родительная конструкция: призвание принадлежит Богу или исходит от Него. Форма естественна для современного литературного русского языка.'
- source_word: Χριστῷ
  choice: Мессии
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» делает это значение явным, не превращая титул лишь в часть имени.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог и порядок компонентов сохранены, чтобы передать характерное для Павла выражение пребывания «в» Мессии Иисусе.
theological_decisions:
- issue: Значение ἄνω κλήσεως
  choice: призвания ввысь
  alternative: призвания свыше; небесного призвания
  rationale: «Ввысь» сохраняет направленность, созвучную образу состязания, но примечание оставляет открытыми также значения происхождения призвания свыше и его небесного характера.
- issue: Связь награды и призвания
  choice: к награде Божьего призвания
  alternative: к награде, ради которой Бог призвал; к награде за Божье призвание
  rationale: Родительная связь в греческом тексте сохранена без уточнения, является ли награда содержанием, целью или следствием призвания.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Тире помогает естественно связать «цель» и «награду». Необычность сочетания «призвания ввысь» сознательно сохранена ради пространственного образа и исходной неоднозначности; альтернативы вынесены в примечание.
