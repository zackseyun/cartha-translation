  terminology: «Награда», «призвание» и «Мессия Иисус» сохранены. «Высшего» является естественным русским эквивалентом ἄνω в данном генитивном сочетании, тогда как значение «свыше»/«небесное» не устраняется благодаря примечанию. Предложный оборот «в Мессии Иисусе» точно сохраняет ἐν Χριστῷ Ἰησοῦ.
