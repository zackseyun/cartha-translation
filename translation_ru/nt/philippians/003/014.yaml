  verdict: revise
  source_fidelity: '«Я стремлюсь» адекватно передаёт διώκω, а «к цели» — κατὰ σκοπόν. Однако сочетание «к награде Божьего призвания ввысь» синтаксически неясно: «ввысь» может относиться к «награде» либо восприниматься как неестественное обстоятельство при «призвании». Греческая цепочка родительных падежей требует в русском более ясной группировки: награда относится к призванию, а призвание характеризуется как ἄνω и принадлежит/исходит от Бога. «Высшего Божьего призвания» передаёт эту связь без богословского уточнения; примечание сохраняет варианты значения ἄνω.'
