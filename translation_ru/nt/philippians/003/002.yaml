lexical_decisions:
- source_word: Βλέπετε
  choice: Берегитесь
  rationale: Настоящее повелительное наклонение выражает настойчивое предостережение. Троекратное повторение «берегитесь» сохраняет ритм и усиление греческого текста.
- source_word: τοὺς κύνας
  choice: псов
  rationale: Буквальный и резкий образ сохранён без поясняющих добавлений. «Псы» звучит в современном русском литературно и передаёт полемическую окраску.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: злых работников
  rationale: Переданы как нравственная оценка κακούς, так и обычное значение ἐργάτας; формулировка не уточняет сверх текста, в чём именно состоит их злая деятельность.
- source_word: τὴν κατατομήν
  choice: изувечивания
  rationale: Абстрактное существительное сохранено, а выбранное слово передаёт уничижительную игру с περιτομή («обрезание») в следующем стихе и резкость значения «увечье, уродующее отсечение».
theological_decisions:
- issue: Передача κατατομήν в связи с περιτομή в Флп 3:3
  choice: изувечивания
  alternative: увечащих; ложного обрезания
  rationale: Павел намеренно употребляет не обычное слово «обрезание», а резкий созвучный контртермин. Абстрактная форма сохраняет грамматику исходного текста и не превращает понятие в обозначение людей, хотя в контексте оно метонимически относится к ним.
translation_notes:
  register: Современный литературный русский с сохранением резкого полемического тона и трёхчастного параллелизма. «Псы» предпочтено более разговорному «собаки», а необычность «изувечивания» сохранена ради словесной игры исходного текста.
