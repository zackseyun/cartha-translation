  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: ru
  text: Приветствуют вас все святые, особенно же те, кто принадлежит к дому кесаря.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто из дома кесаря». Имеются в виду люди, связанные с императорским домом, но не обязательно родственники кесаря.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: приветствуют
  rationale: Обычный глагол эпистолярного приветствия; прямое и естественное соответствие в современном русском языке.
- source_word: πάντες οἱ ἅγιοι
  choice: все святые
  rationale: Сохраняет устойчивое у Павла обозначение верующих и его богословскую значимость, не заменяя его пояснительным пересказом.
- source_word: μάλιστα δὲ
  choice: особенно же
  rationale: Передаёт как выделительное значение μάλιστα, так и лёгкий связующий оттенок δέ.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: те, кто из дома кесаря
  rationale: Сохраняет конструкцию ἐκ и намеренно не сводит οἰκία к кровным родственникам; речь может идти о людях, связанных с императорским домом.
- source_word: Καίσαρος
  choice: кесаря
  rationale: Сохраняет исторический титул Καῖσαρ, не подменяя его более общим словом «император».
theological_decisions:
- issue: Значение слова ἅγιοι у Павла
  choice: «святые» как обозначение верующих, составляющих христианскую общину
  alternative: «народ Божий» или «верующие»
  rationale: «Святые» сохраняет лексику Павла и не создаёт впечатления, будто здесь имеется в виду лишь особая группа выдающихся христиан.
- issue: Состав «дома кесаря»
  choice: Не уточнять, были ли эти люди родственниками, рабами, вольноотпущенниками или служащими
  alternative: Передать как «члены семьи кесаря»
  rationale: Греческое выражение допускает более широкий круг лиц, связанных с императорским хозяйством и службой; семейное толкование было бы неоправданным сужением.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного послания. Слово «кесарь» сохраняет историко-библейский колорит; конструкция «те, кто из дома кесаря» понятна и не устраняет смысловую широту оригинала.
