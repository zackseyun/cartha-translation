base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: ru
  text: Я очень обрадовался в Господе, что наконец-то ваша забота обо мне снова ожила[a]. Вы и прежде заботились обо мне[b], но у вас не было возможности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваша забота обо мне вновь возродилась»; буквально образно: «вы снова расцвели», думая обо мне или заботясь обо мне.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вы и прежде думали обо мне»; греческий глагол может означать «думать», «быть расположенным» или «заботиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: я возрадовался
  rationale: Аорист χαίρω передаёт конкретную радость Павла; «возрадовался» сохраняет достоинство тона и естественно сочетается с «в Господе».
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерную для Павла формулу, допускающую оттенки сферы и основания радости.
- source_word: μεγάλως
  choice: весьма
  rationale: Передаёт усилительное значение наречия без чрезмерно разговорного оттенка.
- source_word: ἤδη ποτὲ
  choice: теперь наконец
  rationale: Естественно выражает наступление события после некоторого промежутка времени, не обязательно подразумевая упрёк.
- source_word: ἀνεθάλετε
  choice: вновь расцвела
  rationale: Сохраняет образное значение глагола «снова расцвести, ожить»; по-русски подлежащим естественно выступает «забота».
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: ваша забота обо мне
  rationale: В контексте φρονέω означает не просто мысль, а расположенность и деятельную заботу о Павле.
- source_word: ἐφ’ ᾧ καὶ ἐφρονεῖτε
  choice: вы и прежде заботились обо мне
  rationale: 'Передаёт пояснение Павла: забота не возникла лишь теперь, а уже существовала; «и прежде» естественно выражает контекстуальный временной оттенок.'
- source_word: ἠκαιρεῖσθε
  choice: у вас не было возможности это проявить
  rationale: Глагол указывает на отсутствие подходящего случая или возможности, а не желания; добавление «это проявить» ясно связывает возможность с заботой и поддержкой.
theological_decisions:
- issue: Характер радости «в Господе»
  choice: сохранить формулу «в Господе» без уточнения
  alternative: «благодаря Господу» или «перед Господом»
  rationale: Греческая конструкция допускает смысл сферы, основания или отношения ко Христу; уточняющий перевод неоправданно сузил бы её.
- issue: Отношение Павла к задержке помощи филиппийцев
  choice: передать отсутствие возможности, а не отсутствие заботы
  alternative: «вы перестали заботиться»
  rationale: Вторая часть стиха прямо утверждает, что они продолжали думать о Павле и заботиться о нём, но не имели подходящего случая это выразить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апостольским тоном. Образ «вновь расцвела» сохраняет метафору оригинала, а заключение сформулировано ясно и без намёка на упрёк.
