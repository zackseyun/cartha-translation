id: PHP.4.8
reference: Philippians 4:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: ru
  text: Наконец[b], братья[a], всё, что истинно, всё, что достойно уважения, всё, что справедливо, всё, что чисто, всё, что достойно любви, всё, что заслуживает одобрения, — если есть какая-либо добродетель и если есть что-либо достойное похвалы, — об этом размышляйте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое «братья» может быть обращением ко всей общине верующих.'
    reason: cultural_note
  - marker: b
    text: 'Или: «В остальном».'
    reason: translation_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Наконец
  rationale: Естественный русский связующий оборот, вводящий заключительное наставление; возможное значение «в остальном» отмечено в сноске.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет форму мужского рода греческого обращения; в данном употреблении оно может относиться ко всей общине, что поясняется в сноске.
- source_word: ὅσα
  choice: всё, что
  rationale: Повторяющийся оборот естественно передаёт собирательно-распределительное значение греческого относительного местоимения и сохраняет ритм перечня.
- source_word: ἀληθῆ
  choice: истинно
  rationale: Передаёт широкое значение истины и подлинности в нравственно-мысленном перечне.
- source_word: σεμνά
  choice: достойно уважения
  rationale: Выражает нравственную весомость и почтенность без архаичного оттенка.
- source_word: δίκαια
  choice: справедливо
  rationale: В этическом перечне охватывает то, что право, честно и соответствует справедливости.
- source_word: ἁγνά
  choice: чисто
  rationale: Сохраняет нравственные и внутренние оттенки греческого слова, не сужая его до половой чистоты.
- source_word: προσφιλῆ
  choice: достойно любви
  rationale: Передаёт то, что вызывает любовь и расположение; формулировка естественна и отличает это качество от следующего.
- source_word: εὔφημα
  choice: заслуживает одобрения
  rationale: Передаёт благую репутацию и то, о чём отзываются хорошо, в понятной современной формулировке.
- source_word: εἴ τις ἀρετὴ
  choice: если есть какая-либо добродетель
  rationale: Сохраняет условную форму и существительное со значением нравственного достоинства или совершенства.
- source_word: εἴ τις ἔπαινος
  choice: если есть что-либо достойное похвалы
  rationale: Естественно по-русски передаёт параллельное условие и значение похвалы, не превращая его в прямое повеление хвалить.
- source_word: ταῦτα λογίζεσθε
  choice: об этом размышляйте
  rationale: Передаёт длительное, намеренное сосредоточение мысли и сохраняет повелительную силу формы.
theological_decisions: []
