lexical_decisions:
- source_word: Χαίρετε
  choice: Радуйтесь
  rationale: Форма настоящего времени повелительного наклонения во втором лице множественного числа выражает продолжающийся призыв; «радуйтесь» естественно и точно передаёт его в современном русском языке.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Буквальное и естественное выражение сохраняет значение сферы или отношений — радость в единении с Господом и в связи с Ним, — не сводя его к причине или средству.
- source_word: πάντοτε
  choice: всегда
  rationale: Краткий современный эквивалент, точно передающий постоянный характер призыва.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт подчёркнутое повторение призыва и естественно сочетается с будущим временем «скажу».
- source_word: ἐρῶ
  choice: скажу
  rationale: Сохраняет будущее время греческого глагола, не заменяя его настоящим или пояснительным «повторю».
- source_word: χαίρετε
  choice: радуйтесь
  rationale: Повтор того же русского императива сохраняет риторическое усиление оригинала.
theological_decisions:
- issue: Значение выражения «в Господе»
  choice: Сохранено выражение «в Господе», указывающее прежде всего на сферу отношений и единения с Господом.
  alternative: «Радуйтесь благодаря Господу» или «радуйтесь из-за Господа».
  rationale: Фраза ἐν κυρίῳ допускает смысловые оттенки основания и содействия, однако у Павла обычно обозначает сферу жизни и отношений. Буквальная русская формулировка сохраняет эту богословскую широту и напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и общепонятная формулировка. Инверсия «всегда в Господе» избегается ради естественного русского порядка слов, при этом «в Господе» остаётся непосредственно связано с призывом радоваться.
