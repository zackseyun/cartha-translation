  - severity: low
    issue: Форма «помогай»
    rationale: Настоящее повелительное наклонение может обозначать продолженное содействие, но в данном контексте русское «окажи помощь» естественнее передаёт конкретный призыв поддержать женщин, не добавляя аспектуального оттенка.
  - severity: low
    issue: Формулировка сноски о «Сизиге»
    rationale: Нужно яснее сообщить, что σύζυγος некоторые принимают за личное имя, сохраняя спорность этого решения.
