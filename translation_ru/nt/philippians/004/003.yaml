source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: ru
  text: 'Да, прошу и тебя, верный соратник[a]: окажи помощь этим женщинам, которые вместе со мной боролись в деле Благой Вести[b], вместе с Климентом и остальными моими сотрудниками, чьи имена — в книге жизни.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «верный товарищ по упряжке»; некоторые понимают «Сизиг» как собственное имя.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «боролись вместе со мной в Благой Вести»; «трудились бок о бок со мной в деле Благой Вести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Да
  rationale: Сохраняет утвердительный переход и непосредственность обращения Павла.
- source_word: ἐρωτῶ
  choice: прошу
  rationale: Передаёт обычное значение глагола и личный тон просьбы, не усиливая его до настоятельного увещания.
- source_word: γνήσιε σύζυγε
  choice: верный соратник
  rationale: Сочетание понято как описательное обращение к неназванному сотруднику. «Соратник» естественно передаёт тесное участие в общем деле, тогда как буквальный образ общей упряжи вынесен в сноску.
- source_word: συλλαμβάνου
  choice: помогай
  rationale: Форма настоящего времени в повелительном наклонении призывает к деятельной поддержке; «помогай» ясно и естественно выражает этот смысл.
- source_word: αὐταῖς
  choice: этим женщинам
  rationale: Женский род множественного числа явно указывает на Еводию и Синтихию из предыдущего контекста; в русском местоимение «им» не выражало бы этого.
- source_word: συνήθλησάν μοι
  choice: вместе со мной боролись
  rationale: Сохраняет заложенный в συναθλέω образ совместной борьбы или состязания и остаётся понятным современному читателю.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: за Благую Весть
  rationale: Естественно для русского языка обозначает дело, ради которого велась совместная борьба; более буквальные оттенки отмечены в сноске.
- source_word: συνεργῶν
  choice: сотрудниками
  rationale: Передаёт обычное для Павла обозначение людей, трудящихся вместе с ним, в современном литературном регистре.
- source_word: βίβλῳ ζωῆς
  choice: книге жизни
  rationale: Сохраняет устойчивое библейское выражение и образ небесной записи принадлежащих жизни.
theological_decisions:
- issue: Толкование γνήσιε σύζυγε
  choice: 'Описательное обращение к неназванному соратнику: «верный соратник»'
  alternative: Имя собственное «Сизиг» либо более буквальное «верный товарищ по упряжке»
  rationale: Прилагательное γνήσιε естественно согласуется с нарицательным существительным в звательном обращении. Однако возможность имени собственного и буквальная метафора остаются предметом обсуждения, поэтому они сохранены в сноске.
- issue: Значение ἐν τῷ εὐαγγελίῳ
  choice: «за Благую Весть» как указание на общее дело и цель борьбы
  alternative: «в Благой Вести» или «в деле Благой Вести»
  rationale: Греческое выражение сжато и допускает оттенки сферы, служения и цели. Основной текст выбран ради естественности русского языка, а неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Благая Весть» выбрана как понятная передача εὐαγγέλιον; спортивно-боевой образ συναθλέω сохранён глаголом «боролись». Тире перед заключительным оборотом подчёркивает заверение, не добавляя нового смыслового отношения.
