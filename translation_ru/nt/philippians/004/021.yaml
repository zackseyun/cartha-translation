  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: ru
  text: Приветствуйте каждого святого в Мессии Иисусе.[a] Братья, которые со мной,[b] приветствуют вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе».'
    reason: lexical_alternative
  - marker: b
    text: Слово «братья» здесь может обозначать всех находящихся с Павлом единоверцев, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Приветствуйте
  rationale: Повелительная форма в заключительной части письма означает передать привет; «приветствуйте» кратко и естественно передаёт этот смысл.
- source_word: πάντα ἅγιον
  choice: каждого святого
  rationale: Сочетание πᾶς с существительным в единственном числе имеет распределительное значение; «каждого святого» сохраняет и эту форму, и обозначение верующих как посвящённых Богу.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Χριστός здесь выступает как титул «Мессия», а конструкция с ἐν сохранена без уточнения характера единения, чтобы не устранять смысловую ёмкость оригинала.
- source_word: ἀσπάζονται
  choice: приветствуют
  rationale: В эпистолярном контексте средняя форма естественно передаётся по-русски действительным глаголом «приветствуют».
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Братья, которые находятся со мной
  rationale: Перевод сохраняет грамматически мужское множественное число ἀδελφοί и прямо передаёт оборот σὺν ἐμοί; возможное включение женщин-верующих отмечено в сноске.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Греческое Χριστός соответствует титулу «Помазанник / Мессия»; основной текст делает титульное значение прозрачным, а традиционный русский эквивалент указан в сноске.
- issue: Объём значения ἀδελφοί
  choice: Братья
  alternative: Братья и сёстры / единоверцы
  rationale: Основной текст сохраняет мужскую грамматическую форму оригинала, не исключая контекстуальной возможности смешанной группы, которая оговорена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного библейского стиля. Формулировки доступны обычному читателю; необычный, но содержательно прозрачный оборот «в Мессии Иисусе» сохраняет порядок и богословскую ёмкость греческого выражения.
