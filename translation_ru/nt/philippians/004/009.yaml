  naturalness: Исходная соотносительная конструкция «Чему вы научились, что приняли...» понятна, но неоднородное управление без повторения союзного слова звучит несколько шероховато. Формулировка «То, чему вы научились, что приняли, что услышали и что увидели во мне» яснее и остаётся литературной. «Делайте это» — естественная современная передача πράσσετε; настоящее повелительное сохраняет призыв к практическому осуществлению.
