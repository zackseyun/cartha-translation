  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: ru
  text: То, чему вы научились, что приняли, что услышали и что увидели во мне[b], делайте это[a]; и Бог мира будет с вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступайте так».'
    reason: lexical_alternative
  - marker: b
    text: «Увидели во мне» можно также передать как «увидели на моём примере» или «увидели в моей жизни».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: чему… что… то
  rationale: Относительное местоимение среднего рода множественного числа охватывает всё содержание наставления; в русском для естественного согласования с разными глаголами использована соотносительная конструкция «чему… что… то».
- source_word: ἐμάθετε
  choice: научились
  rationale: Передаёт усвоенное филиппийцами наставление и естественно управляет дательным «чему».
- source_word: παρελάβετε
  choice: приняли
  rationale: 'Сохраняет широту значения: получение и принятие переданного наставления, без добавления слова «предание».'
- source_word: ἠκούσατε
  choice: услышали
  rationale: Прямо передаёт аорист ἀκούω и сохраняет последовательность глаголов.
- source_word: εἴδετε ἐν ἐμοί
  choice: увидели во мне
  rationale: Формально и естественно сохраняет указание на то, что было заметно в самом Павле, не ограничивая смысл только его «примером» или «жизнью».
- source_word: ταῦτα πράσσετε
  choice: то и исполняйте
  rationale: Настоящее повелительное передаёт продолжающуюся практику; «исполняйте» в данном контексте звучит естественнее буквального «делайте это» и сохраняет практическую направленность.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Бог мира
  rationale: Сохраняет краткое павловское выражение с родительным падежом и его возможную смысловую широту.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: будет с вами
  rationale: Прямая передача будущего времени и μετά с родительным падежом.
theological_decisions:
- issue: Связь между исполнением наставления и присутствием Бога
  choice: Наставление и обещание соединены союзом «и», без превращения их в явно условную формулу.
  alternative: «Если будете это исполнять, то Бог мира будет с вами».
  rationale: Греческий текст связывает части посредством καί, а не явной условной конструкцией; перевод сохраняет пастырское обещание и богословское напряжение, не усиливая причинно-следственную связь.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет четырёхчастный ряд греческого текста, но слегка адаптирован к русскому управлению. Маркеры примечаний поставлены после относящейся к ним повелительной части; примечание [b] поясняет более раннюю фразу «увидели во мне».
