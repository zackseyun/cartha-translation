revisions:
- from: Но я получил всё сполна[a] и живу в достатке. Теперь у меня есть всё необходимое, потому что я получил от Епафродита присланное вами — благоуханный аромат, угодную жертву, приятную Богу.
  to: Но я получил всё[a] и имею с избытком; я полностью обеспечен, получив от Епафродита присланное вами — благоухание, приемлемую жертву, угодную Богу.
  rationale: Правка точнее передаёт различие между «получил всё» (ἀπέχω πάντα), «имею с избытком» (περισσεύω) и «полностью обеспечен» (πεπλήρωμαι), не внося отсутствующее временное или причинное уточнение. Образность благоухания и жертвы сохранена.
