reference: Philippians 4:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: ru
  text: Но я получил всё[a] и имею с избытком; я полностью обеспечен, получив от Епафродита присланное вами — благоухание, приемлемую жертву, угодную Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у меня есть всё полностью»; возможно также: «я получил полный расчёт».'
    reason: Глагол ἀπέχω может обозначать как получение чего-либо в полном объёме, так и, в расчётном контексте, подтверждение полного получения причитающегося.
lexical_decisions:
- source_word: ἀπέχω
  choice: я получил всё сполна
  rationale: В контексте материальной поддержки глагол может означать получение всей причитающейся суммы или получение в полном объёме. «Получил всё сполна» естественно передаёт завершённость получения, не превращая благодарность Павла в строго коммерческую расписку.
- source_word: πάντα
  choice: всё
  rationale: Нейтральное множественное число имеет всеохватное значение и относится ко всему присланному филиппийцами.
- source_word: περισσεύω
  choice: живу в достатке
  rationale: Глагол обозначает изобилие, превышающее простую достаточность. Такая формулировка естественна по-русски и сохраняет смысл нынешнего обеспеченного состояния Павла.
- source_word: πεπλήρωμαι
  choice: теперь у меня есть всё необходимое
  rationale: Перфект подчёркивает настоящее состояние как результат полученного дара. Перевод ясно передаёт полную обеспеченность, не создавая неуместного впечатления физической сытости.
- source_word: δεξάμενος
  choice: потому что я получил
  rationale: Причастие объясняет, каким образом Павел оказался полностью обеспечен; в современном русском придаточное причины звучит естественнее буквальной причастной конструкции.
- source_word: παρὰ Ἐπαφροδίτου
  choice: от Епафродита
  rationale: Епафродит представлен как непосредственный передатчик дара; следующий оборот указывает на филиппийцев как его отправителей.
- source_word: τὰ παρ’ ὑμῶν
  choice: присланное вами
  rationale: Субстантивированный оборот относится к дару от общины. Выбор естественно выражает происхождение и передачу помощи, не уточняя её состав сверх текста.
- source_word: ὀσμὴν εὐωδίας
  choice: благоуханный аромат
  rationale: Сохраняется жертвенный образ и его ветхозаветный культовый оттенок; выражение понятно современному читателю и остаётся возвышенным.
- source_word: θυσίαν δεκτήν
  choice: угодную жертву
  rationale: «Угодную» передаёт принятие дара Богом и хорошо сочетается с традиционной библейской жертвенной лексикой, оставаясь понятным современному читателю.
- source_word: εὐάρεστον τῷ θεῷ
  choice: приятную Богу
  rationale: Фраза прямо выражает Божье благоволение к дару и сохраняет отдельный третий элемент последовательности после образа аромата и угодной жертвы.
theological_decisions:
- issue: Жертвенная образность применительно к материальному дару филиппийцев
  choice: 'Сохранить последовательность реальной метафоры поклонения: «благоуханный аромат, угодную жертву, приятную Богу».'
  alternative: Свести образ к общей благодарности или передать лишь как «дар, который Бог принимает».
  rationale: Павел намеренно описывает помощь языком храмового жертвоприношения. Сохранение образов аромата, жертвы и Божьего благоволения передаёт богословскую силу текста, не добавляя конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной жертвенной лексикой. Первые три утверждения сохраняют риторическое нарастание полноты и достатка, а финальная триада — культовую образность исходного текста.
