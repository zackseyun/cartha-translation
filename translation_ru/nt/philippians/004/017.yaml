  text: οὐχ ὅτι ἐπιζητῶ τὸ δόμα, ἀλλὰ ἐπιζητῶ τὸν καρπὸν τὸν πλεονάζοντα εἰς λόγον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: ru
  text: Не то чтобы я искал дара; я ищу плода, который всё больше зачисляется на ваш счёт.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плода, умножающегося в вашу пользу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: ищу
  rationale: Передаёт активное стремление и сохраняет точный повтор глагола в противопоставлении.
- source_word: δόμα
  choice: дара
  rationale: Прямо обозначает дар филиппийцев без добавления отсутствующего в греческом усиления «самого».
- source_word: καρπὸν
  choice: плода
  rationale: Сохраняет образ плода и его намеренное сочетание с языком счёта.
- source_word: πλεονάζοντα
  choice: который умножается
  rationale: Передаёт продолжающееся возрастание; «умножается» естественно сочетается и с плодом, и с бухгалтерским образом.
- source_word: εἰς λόγον ὑμῶν
  choice: на вашем счету
  rationale: Сохраняет коммерческий образ учёта, продолжая лексику контекста Флп 4:15.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Не то чтобы…; …
  rationale: Естественно по-русски передаёт риторическое уточнение и противопоставление; во второй части повтор «я ищу» сохраняет структуру оригинала.
theological_decisions:
- issue: Соотношение образов плода и бухгалтерского счёта
  choice: 'Сохранить оба образа: «плод… на вашем счету»'
  alternative: 'Истолковать единым образом: «прибыль, зачисляемую вам» или «плод, приносящий вам пользу»'
  rationale: Оригинал соединяет сельскохозяйственную и коммерческую метафоры; перевод не должен устранять эту смысловую напряжённость или уточнять природу воздаяния.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная формулировка. Родительный падеж после «искал» естественен при отрицании. Точка с запятой ясно отделяет уточнение от главного утверждения.
