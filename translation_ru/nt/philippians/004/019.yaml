base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: ru
  text: И мой Бог восполнит каждую вашу нужду в соответствии со Своим богатством в славе, в Мессии Иисусе[a][b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе».'
    reason: lexical_alternative
  - marker: b
    text: «В соответствии со Своим богатством» указывает на меру Божьего дара, а не только на то, что дар берётся из Его богатства.
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «славно» — вместо «в славе».'
    reason: alternative_reading
  - marker: d
    text: 'Возможен перевод без обособления последнего оборота: «в соответствии со Своим богатством в славе в Мессии Иисусе». Точная связь двух оборотов с «в» в греческом тексте не вполне однозначна.'
    reason: syntax_ambiguity
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: И мой Бог
  rationale: Частица δέ здесь мягко связывает эту мысль с предыдущей; союз «и» не создаёт излишне резкого противопоставления и сохраняет личное «мой Бог».
- source_word: πληρώσει
  choice: восполнит
  rationale: В данном контексте πληρόω означает дать недостающее, удовлетворить нужду. «Восполнит» естественно сочетается с «нуждой» и остаётся близким к образу наполнения.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: всякую вашу нужду
  rationale: 'χρεία обозначает нужду или необходимость, а πᾶσαν при существительном в единственном числе имеет распределительное значение: каждую нужду.'
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: сообразно Своему богатству
  rationale: κατά с винительным обозначает меру или норму обеспечения, а не только его источник. «Сообразно» передаёт смысл обеспечения, соответствующего Божьему богатству.
- source_word: ἐν δόξῃ
  choice: в славе
  rationale: Формальная предложная конструкция сохраняет открытым точный смысл и синтаксическую связь оборота; вариант «славно» был бы более истолковывающим.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  rationale: Χριστός здесь остаётся титулом «Мессия». Перестановка имени и титула делает сочетание естественнее по-русски, не меняя его смысла.
theological_decisions:
- issue: Передача Χριστός в выражении ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  alternative: во Христе Иисусе
  rationale: Основной текст раскрывает значение титула Χριστός как «Мессия»; традиционный вариант с «Христос» сохранён в сноске.
- issue: Синтаксическая связь ἐν δόξῃ и ἐν Χριστῷ Ἰησοῦ
  choice: сохранить оба предложных оборота без однозначного толкования их связи
  alternative: славно восполнит … через Иисуса Мессию
  rationale: Греческая последовательность допускает несколько оттенков связи. Более истолковывающий перевод необоснованно устранил бы эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Восполнит нужду» и «сообразно Своему богатству» понятны современному читателю и передают смысл оригинала без разговорного упрощения; прописные местоимения при обращении к Богу соответствуют принятой русской библейской издательской норме.
