source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: ru
  text: 'Я знаю, как жить в стеснённых обстоятельствах, знаю и как жить в изобилии. Во всём и при любых обстоятельствах я постиг тайну[a]: быть и сытым, и голодным, жить и в изобилии, и в нужде.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я посвящён». Павел метафорически использует язык посвящения, говоря о постигнутой им тайне жизни в любых обстоятельствах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: я знаю, как
  rationale: В сочетании с инфинитивами выражает не отвлечённое знание, а приобретённое опытом умение; оборот «знаю, как» естественно передаёт это по-русски.
- source_word: ταπεινοῦσθαι
  choice: жить в стеснённых обстоятельствах
  rationale: Форма указывает на пребывание в неблагоприятном, приниженном положении. Такой перевод сохраняет обстоятельственный смысл и не сводит его к внутреннему смирению или унижению достоинства.
- source_word: περισσεύειν
  choice: жить в изобилии
  rationale: Передаёт наличие более чем достаточного и сохраняет широкий смысл глагола, не ограничивая его богатством или успехом.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: во всём и при любых обстоятельствах
  rationale: Различает оба близких выражения и сохраняет их риторическую полноту в естественной русской форме.
- source_word: μεμύημαι
  choice: я постиг тайну
  rationale: Контекстуально передаёт приобретённое сокровенное знание, а исходный образ посвящения сохраняется в сноске.
- source_word: χορτάζεσθαι
  choice: быть сытым
  rationale: Ясно сохраняет пищевой смысл и прямой контраст с голодом.
- source_word: πεινᾶν
  choice: быть голодным
  rationale: Прямой и естественный русский эквивалент, сохраняющий противопоставление сытости.
- source_word: ὑστερεῖσθαι
  choice: жить в нужде
  rationale: Передаёт состояние недостатка и лишений, не ограничивая его исключительно нехваткой денег.
