  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: ru
  text: Богу же и Отцу нашему — слава во веки веков[a]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в веки веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Мягкая связка отмечает переход к заключительному славословию; «же» естественно передаёт связующую функцию, не усиливая её до резкого противопоставления.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: Богу и Отцу нашему
  rationale: Единое наименование одного Лица; форма «нашему» по-русски естественно относится ко всему сочетанию.
- source_word: ἡ δόξα
  choice: слава
  rationale: Греческая фраза безглагольная. Русское славословие может естественно сохранить именную конструкцию с тире, не вынуждая выбирать между пожеланием «да будет» и утверждением «принадлежит».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивое, понятное и возвышенное русское соответствие семитизированной греческой формуле неограниченной длительности.
- source_word: ἀμήν
  choice: Аминь
  rationale: Сохранена традиционная транслитерация устойчивого литургического подтверждения.
theological_decisions:
- issue: Восполнение подразумеваемого глагола в славословии
  choice: Безглагольная конструкция «— слава»
  alternative: «да будет слава» / «принадлежит слава»
  rationale: В греческом глагола нет, поэтому русская именная конструкция сохраняет смысловую открытость между славословным пожеланием и утверждением, не разрешая её искусственно.
translation_notes:
  register: Современный литературный русский с достоинством традиционного славословия. Инверсия «Богу же и Отцу нашему» сохраняет фокус исходной фразы и остаётся понятной обычному читателю.
