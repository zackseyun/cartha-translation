lexical_decisions:
- source_word: πλὴν
  choice: И всё же
  rationale: Передаёт мягкое противопоставление предыдущей мысли, не ослабляя похвалы Павла; естественно звучит в современном русском.
- source_word: καλῶς ἐποιήσατε
  choice: вы хорошо поступили
  rationale: Устойчиво и естественно передаёт положительную оценку совершённого филиппийцами поступка.
- source_word: συγκοινωνήσαντές
  choice: разделив со мной
  rationale: Передаёт активное участие и сопричастность Павлу, а не простое сочувствие со стороны.
- source_word: τῇ θλίψει
  choice: мою скорбь
  rationale: θλῖψις обозначает тяжёлое положение, бедствие или страдание; «скорбь» сохраняет вес греческого слова. Местоимение μου естественно соотносится со скорбью в русском переводе.
