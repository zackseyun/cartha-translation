    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιεικές
  choice: снисходительность
  rationale: Слово обозначает мягкое, великодушное и не настаивающее на своём отношение к другим. «Снисходительность» передаёт этот широкий нравственный смысл лучше, чем более узкая «кротость», хотя в современном русском может нуждаться в пояснении альтернативами.
- source_word: γνωσθήτω
  choice: пусть … будет известна
  rationale: Пассивный императив передан естественной русской побудительной конструкцией, сохраняющей значение «стать известной, быть явной».
- source_word: πᾶσιν ἀνθρώποις
  choice: всем людям
  rationale: Формально и ясно передаёт всеобщий, не ограниченный мужчинами охват выражения.
- source_word: κύριος
  choice: Господь
  rationale: Обычный русский эквивалент титула κύριος, сохраняющий его богословскую значимость.
- source_word: ἐγγύς
  choice: близко
  rationale: 'Наречие «близко» сохраняет краткость греческого выражения и не устраняет возможную двойственность: близость Господа может пониматься как близость его присутствия, близость его пришествия или обе сразу.'
theological_decisions:
- issue: Смысл выражения ὁ κύριος ἐγγύς
  choice: Господь близко
  alternative: Господь рядом; пришествие Господа близко
  rationale: Греческое выражение допускает как пространственно-присутствующий, так и временно-эсхатологический смысл. Основной текст намеренно не сводит его только к одному из них.
translation_notes:
