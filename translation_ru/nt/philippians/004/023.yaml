  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: ru
  text: Благодать Господа Иисуса Христа да будет с вашим духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «со всеми вами».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Традиционный и семантически ёмкий эквивалент, сохраняющий характерное для Павла богословское содержание пожелания.
- source_word: κυρίου
  choice: Господа
  rationale: Передаёт κύριος как христологический титул и естественно входит в русскую формулу «Господь Иисус Христос».
- source_word: Χριστοῦ
  choice: Христа
  rationale: В современном русском библейском употреблении «Христос» узнаваемо передаёт титул Мессии и в данной устойчивой формуле тесно связано с именем Иисус.
- source_word: μετὰ
  choice: с
  rationale: При родительном падеже μετά выражает пребывание вместе или присутствие; русский предлог «с» передаёт это прямо и естественно.
- source_word: πνεύματος
  choice: духом
  rationale: Строчная буква указывает на человеческий дух адресатов, а не однозначно на Святого Духа; единственное число сохранено.
- source_word: ὑμῶν
  choice: вашим
  rationale: Местоимение передаёт второе лицо множественного числа; форма «вашим» согласуется с единственным числом «духом» и допускает собирательный смысл.
theological_decisions:
- issue: Передача Χριστοῦ как «Христа» или «Мессии»
  choice: Христа
  alternative: Мессии
  rationale: Хотя Χριστός является титулом «Мессия», в Павловой формуле «Господь Иисус Христос» слово уже тесно связано с именем. «Христос» сохраняет титульный смысл в русском языке и звучит естественнее, не навязывая спорного разграничения между титулом и частью имени.
- issue: К кому относится πνεῦμα
  choice: человеческий дух адресатов
  alternative: Святой Дух
  rationale: Притяжательное ὑμῶν и благословительная формула естественнее указывают на внутреннюю жизнь общины; прописная буква необоснованно снимала бы сохраняющуюся в греческом тексте неоднозначность.
- issue: Число в выражении «вашим духом»
  choice: сохранить единственное число как собирательное
  alternative: «с вашими духами»
  rationale: Греческое πνεύματος стоит в единственном числе при местоимении множественного числа и может обозначать общий духовный настрой или внутреннюю жизнь общины; множественное число устранило бы эту особенность.
translation_notes:
  register: Современный литературный русский язык с достоинством традиционной апостольской формулы. Частица «да» естественно выражает подразумеваемое благопожелание при отсутствии глагола в греческом тексте. Местоимение «вашим» сохраняет обращение к общине во множественном числе.
