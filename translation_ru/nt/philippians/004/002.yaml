source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: ru
  text: Еводию призываю и Синтихию призываю быть единомысленными в Господе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мыслить одинаково в Господе»; возможно также: «быть согласными в Господе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Еводию
  rationale: Личное имя передано принятой русской транслитерацией и поставлено в винительный падеж в соответствии с греческим синтаксисом.
- source_word: παρακαλῶ
  choice: призываю
  rationale: «Призываю» передаёт настойчивое, но не властно-приказное обращение Павла. Повтор глагола сохранён, поскольку в греческом тексте Павел отдельно обращается к каждой женщине.
- source_word: Συντύχην
  choice: Синтихию
  rationale: Личное имя передано принятой русской транслитерацией и поставлено в винительный падеж.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: быть единомысленными
  rationale: Выражение обозначает общность образа мыслей и внутренней направленности, а не только согласие по отдельному вопросу. Русское «быть единомысленными» естественно передаёт эту мысль, хотя более буквальное «мыслить одинаково» также возможно.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: 'Близкая к форме оригинала передача сохраняет богословски значимую открытость выражения: единомыслие должно существовать в сфере отношений с Господом и быть основано на Нём.'
theological_decisions:
- issue: Характер требуемого единства
  choice: быть единомысленными в Господе
  alternative: согласиться друг с другом в Господе
  rationale: 'Оригинал говорит шире, чем о достижении согласия в конкретном споре: φρονεῖν включает образ мыслей и внутреннюю установку. Формулировка не уточняет неизвестную причину разногласия и не сводит призыв лишь к личному примирению.'
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Синтаксический повтор «призываю» намеренно сохранён, чтобы передать равное и отдельное обращение к каждой женщине.
