source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: ru
  text: Итак, возлюбленные мои братья[a], по которым я тоскую, моя радость и мой венец[b], стойте так в Господе, возлюбленные.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово имеет форму мужского рода — «братья», однако здесь Павел обращается к верующим общины в целом, а не только к мужчинам.
    reason: cultural_note
  - marker: b
    text: То есть наградной венок, которым увенчивали победителя.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно вводит следующее наставление.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; его обращённость ко всей общине пояснена в сноске.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет тёплый тон обращения и связь с языком христианской любви; повтор в конце стиха воспроизведён.
- source_word: ἐπιπόθητοι
  choice: по которым я тоскую
  rationale: Естественно по-русски передаёт сильное личное стремление Павла увидеть адресатов; буквальное «желанные» здесь звучало бы двусмысленно и менее естественно.
- source_word: χαρά
  choice: радость
  rationale: Прямо и естественно передаёт утверждение Павла о том, кем для него являются филиппийцы.
- source_word: στέφανος
  choice: венец
  rationale: Сохраняет образ наградного венка и привычное для русского библейского языка метафорическое употребление.
- source_word: οὕτως
  choice: так
  rationale: Сохраняет указание на образ стойкости, связанный с предшествующим контекстом, не уточняя его сверх сказанного в греческом тексте.
- source_word: στήκετε
  choice: стойте
  rationale: Императив передаёт призыв оставаться твёрдыми; в сочетании «стойте в Господе» устойчивость выражена без добавочной интерпретации.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет намеренно ёмкую пространственно-реляционную формулу Павла, не сводя её только к союзу, помощи или верности.
theological_decisions:
- issue: Кого включает обращение ἀδελφοί
  choice: В основном тексте сохранено «братья», а включение всей общины пояснено в сноске.
  alternative: «братья и сёстры»
  rationale: Мужская форма исходного текста передана явно, но контекстуально широкое обращение к верующим не скрыто.
- issue: Смысл выражения ἐν κυρίῳ
  choice: Сохранено «в Господе».
  alternative: «в единении с Господом» или «с помощью Господа»
  rationale: Греческое выражение допускает богатый реляционный смысл; более развёрнутые варианты преждевременно сузили бы его.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, уместной для апостольского обращения лексикой. Перестройка «возлюбленные мои братья, по которым я тоскую» устраняет неестественное русское «желанные братья», сохраняя смысл и эмоциональную насыщенность оригинала. Повтор «возлюбленные» намеренно оставлен.
