lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Сохраняет широкий смысл греческого винительного множественного числа. Контекст говорит о способности переносить любые обстоятельства, но сам оборот шире, поэтому это уточняется в сноске, а не в основном тексте.
- source_word: ἰσχύω
  choice: могу
  rationale: Глагол выражает наличие силы или способности. «Могу» естественно передаёт здесь способность, не добавляя отдельного глагола действия, отсутствующего в греческом тексте.
- source_word: ἐν
  choice: благодаря
  rationale: В сочетании с обозначением того, кто наделяет силой, предлог выражает основание или средство способности. «Благодаря» звучит по-русски естественнее буквального «в» и не требует вводить отсутствующее имя.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: тому, кто даёт мне силу
  rationale: Субстантивированное причастие передано описательно и с сохранением его деятельного смысла. Формулировка не называет Христа прямо, поскольку в данном стихе имя отсутствует.
theological_decisions:
- issue: Кого подразумевают слова «тому, кто даёт мне силу»
  choice: Сохранить описательное обозначение без добавления имени «Христос» в основной текст.
  alternative: «Всё могу во Христе, который укрепляет меня».
  rationale: Контекст указывает на Христа, однако греческий текст этого стиха прямо его не называет. Перевод сохраняет различие между выраженным в тексте и подразумеваемым из контекста.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Строчная буква в слове «тому» не превращает подразумеваемого адресата в явно названного и сохраняет сдержанность греческого текста.
