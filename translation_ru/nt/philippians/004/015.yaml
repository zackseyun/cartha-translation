    rationale: Греческое εἰς λόγον δόσεως καὶ λήμψεως означает участие «в вопросе/деле» даяния и получения и может нести учётный оттенок. Простое «в даянии и получении» этот элемент ослабляет.
  - severity: low
    issue: Сочетание «участвовала со мной в даянии и получении» несколько неуклюже.
    rationale: Оно формально возможно, но не вполне ясно, в чём именно состоит участие церкви. «Участвовала со мной в вопросе даяния и получения» точнее воспроизводит конструкцию и естественнее по-русски.
