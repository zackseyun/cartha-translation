id: PHP.4.15
reference: Philippians 4:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: ru
  text: И вы сами, филиппийцы, знаете, что в начале благовествования, когда я покинул Македонию, ни одна церковь, кроме вас одних, не участвовала со мной в вопросе даяния и получения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по счёту даяния и получения».'
    reason: Лексема λόγος может обозначать вопрос или дело, но в сочетании с «даянием и получением» возможен также бухгалтерский образ счёта.
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: И вы сами знаете
  rationale: Передаёт настоящее значение οἴδατε, связующую функцию δέ, добавочное καί и подчёркнутое ὑμεῖς естественной русской фразой.
- source_word: Φιλιππήσιοι
  choice: филиппийцы
  rationale: Прямое и привычное русское обращение к жителям Филипп, уместное в апостольском послании.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: в начале благовествования
  rationale: В данном контексте выражение, вероятно, указывает на начальный период проповеди Благой вести; «благовествование» сохраняет связь с εὐαγγέλιον и естественнее обозначает разворачивавшееся служение, не уточняя его сверх текста.
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: когда я покинул Македонию
  rationale: Точно и естественно передаёт единичное прошедшее действие и исходную точку движения.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: ни одна церковь ... не участвовала со мной
  rationale: «Участвовала со мной» сохраняет идею совместного участия κοινωνέω и личную соотнесённость μοι, не сводя выражение лишь к денежной выплате.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: в даянии и получении
  rationale: Передаёт финансовый контекст и парность греческих отглагольных существительных; возможный бухгалтерский оттенок λόγος отмечен в сноске.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: кроме вас одних
  rationale: Естественно по-русски сохраняет исключительность и эмфатическую силу μόνοι.
theological_decisions:
- issue: Значение выражения «даяние и получение»
  choice: Сохранена взаимная формула без уточнения, кто именно даёт и получает.
  alternative: Истолковать её исключительно как материальную поддержку Павла филиппийцами.
  rationale: Контекст указывает на материальное участие, однако греческая формула допускает образ взаимных расчётов или партнёрства; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным эпистолярным звучанием. Синтаксис близок к греческому, но не тяжеловесен; «благовествование» и «даяние» сохраняют библейский регистр, оставаясь понятными по контексту.
