  source_fidelity: 'В целом перевод точно передаёт обращение, временную отсылку, уход Павла из Македонии и исключительность филиппийской церкви. Однако εἰς λόγον («в вопросе/деле», с возможным оттенком счёта) в основном тексте лучше передать явно: формула «участвовала со мной в даянии и получении» сглаживает этот компонент и по-русски звучит не вполне определённо.'
  naturalness: Фраза литературна и понятна. Более естественны порядок обращения «И вы сами, филиппийцы, знаете» и сочетание «в вопросе даяния и получения».
  terminology: «Благовествование», «даяние» и «получение» допустимы в библейском эпистолярном регистре. «Вопрос» сохраняет нейтральную широту λόγος; сноска об учётном смысле уместна.
  issues:
