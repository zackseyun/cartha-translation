revisions:
- from: И вы сами знаете, филиппийцы, что в начале благовествования, когда я покинул Македонию, ни одна церковь, кроме вас одних, не участвовала со мной в даянии и получении.[a]
  to: И вы сами, филиппийцы, знаете, что в начале благовествования, когда я покинул Македонию, ни одна церковь, кроме вас одних, не участвовала со мной в вопросе даяния и получения.[a]
  rationale: Добавлено «в вопросе», чтобы передать λόγος в εἰς λόγον δόσεως καὶ λήμψεως, не навязывая исключительно бухгалтерское толкование; возможный учётный оттенок сохранён в сноске. Перестановка обращения улучшает современную русскую фразу без смыслового изменения.
