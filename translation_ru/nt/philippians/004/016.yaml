lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит объяснение предыдущего высказывания Павла; «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: ἐν Θεσσαλονίκῃ
  choice: в Фессалонике
  rationale: Сохранено прямое локативное значение греческого оборота без замены на направление «в Фессалонику».
- source_word: ἅπαξ καὶ δὶς
  choice: не раз
  rationale: Это естественный современный русский способ передать идиоматическое значение «и раз, и два», то есть повторность оказанной помощи; буквальная форма приведена в сноске.
- source_word: εἰς τὴν χρείαν μοι
  choice: мне необходимое
  rationale: Передаёт помощь, направленную на удовлетворение нужды Павла. Субстантивированное «необходимое» позволяет по-русски естественно восполнить подразумеваемый объект глагола «присылали».
- source_word: ἐπέμψατε
  choice: вы присылали
  rationale: «Присылали» естественно выражает повторную отправку чего-либо Павлу и согласуется с контекстом материальной поддержки, не уточняя её конкретный вид.
