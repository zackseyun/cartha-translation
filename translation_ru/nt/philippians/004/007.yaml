id: PHP.4.7
reference: Philippians 4:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: ru
  text: И мир Божий, превосходящий всякое понимание, будет хранить ваши сердца и ваши мысли в Иисусе Мессии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: мир
  rationale: Естественный и точный русский эквивалент, сохраняющий смысл внутреннего покоя и целостности без поясняющего расширения.
- source_word: τοῦ θεοῦ
  choice: Божий
  rationale: Притяжательное прилагательное естественно передаёт греческий родительный падеж, не сводя его значение только к источнику мира.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: превосходящий всякое понимание
  rationale: Передаёт превосходство Божьего мира над любой способностью постичь его; «всякое» сохраняет распределительную силу πάντα, а «понимание» уместно выражает νοῦς в данной конструкции.
- source_word: φρουρήσει
  choice: будет хранить
  rationale: Сохраняет защитный, сторожевой оттенок глагола и звучит естественно в современном литературном русском.
- source_word: τὰς καρδίας ὑμῶν
  choice: ваши сердца
  rationale: Сохраняет библейское обозначение внутреннего средоточия личности.
- source_word: τὰ νοήματα ὑμῶν
  choice: ваши мысли
  rationale: νοήματα обозначает мысли, замыслы или процессы мышления; «мысли» точнее разграничивает этот термин с καρδίας, чем повторное обозначение внутренней способности словом «ум».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  rationale: Передаёт Χριστός как значимый титул «Мессия» и сохраняет конструкцию ἐν, выражающую сферу единения и пребывания.
theological_decisions:
- issue: Значение родительного τοῦ θεοῦ
  choice: Божий
  alternative: от Бога
  rationale: Греческая форма допускает оттенок источника, но прямо выражает принадлежность или отношение; основной текст не должен сужать её до одного истолкования.
- issue: Передача Χριστῷ в формуле ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  alternative: во Христе Иисусе
  rationale: Перевод титула сохраняет его мессианское содержание, а порядок «Иисусе Мессии» естественнее в современном русском и соответствует референту греческого сочетания.
- issue: Связь ἐν Χριστῷ Ἰησοῦ с глаголом охраны
  choice: в Иисусе Мессии
  alternative: через Иисуса Мессию
  rationale: Сохранён пространственно-сферический образ ἐν и не внесено инструментальное толкование, которого предлог здесь прямо не требует.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Синтаксис следует греческому ходу мысли, но избегает архаизмов; повтор «ваши» сохранён ради соответствия исходному тексту и ясного параллелизма.
