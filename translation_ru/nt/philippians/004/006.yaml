  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: ru
  text: Ни о чём не тревожьтесь[a], но во всём с молитвой и прошением, с благодарностью открывайте Богу свои просьбы[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ни о чём не беспокойтесь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мольбе».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «открывайте свои просьбы пред Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Ни о чём не тревожьтесь
  rationale: Отрицательное местоимение вместе с запретом естественно передаётся по-русски конструкцией «ни о чём не…». «Тревожьтесь» выражает мучительное беспокойство, не исключая всякой разумной заботы.
- source_word: ἐν παντί
  choice: во всём
  rationale: Сохраняет всеохватность греческого выражения и не сужает его до одних лишь обстоятельств.
- source_word: τῇ προσευχῇ
  choice: в молитве
  rationale: Обычное и точное обозначение молитвенного обращения к Богу.
- source_word: τῇ δεήσει
  choice: в прошении
  rationale: Передаёт более конкретную настойчивую просьбу и сохраняет отличие от общего слова «молитва».
- source_word: μετ’ εὐχαριστίας
  choice: с благодарностью
  rationale: Естественная современная русская формулировка, ясно передающая сопровождение молитвы благодарением.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: свои просьбы
  rationale: Передаёт конкретное содержание того, о чём просят, и избегает тяжеловесного повторения слова «прошения».
- source_word: γνωριζέσθω
  choice: открывайте
  rationale: Греческий пассивный императив буквально говорит о том, чтобы просьбы становились известны. Русское активное «открывайте» естественнее и сохраняет смысл осознанного изложения просьб Богу, не предполагая, будто Бог прежде их не знает.
- source_word: πρὸς τὸν θεόν
  choice: Богу
  rationale: Прямо передаёт направленность молитвенного обращения; вариант «пред Богом» отмечен в сноске как возможное пространственно-реляционное прочтение предлога πρός.
theological_decisions:
- issue: Запрет μεριμνᾶτε и разумная забота
  choice: не тревожьтесь
  alternative: не заботьтесь
  rationale: «Не заботьтесь» могло бы ошибочно прозвучать как запрет ответственности и попечения; в данном контексте речь идёт о тревожном беспокойстве.
- issue: Божественное всеведение и γνωριζέσθω
  choice: открывайте Богу свои просьбы
  alternative: пусть ваши просьбы станут известны Богу
  rationale: Формулировка сохраняет действие сообщения или раскрытия просьб, но не разрешает богословское напряжение так, будто молитва снабжает Бога неизвестными Ему сведениями.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет противопоставление запрета и повеления; сочетание «молитва и прошение» удерживает различие двух греческих существительных.
