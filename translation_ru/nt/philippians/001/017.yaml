id: PHP.1.17
reference: Philippians 1:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: ru
  text: Другие же возвещают Мессию[a] из своекорыстного соперничества, не с чистыми побуждениями, полагая, что причинят мне страдания в заключении[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «моим узам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: из своекорыстного соперничества
  rationale: Сочетание передаёт как личную корысть, так и дух партийного соперничества; речь идёт не просто об эгоизме, а о честолюбивом стремлении возвыситься за счёт другого.
- source_word: Χριστόν
  choice: Мессию
  rationale: 'Здесь слово обозначает содержание возвещения и сохраняет титульный смысл: Иисус возвещается как обещанный Мессия.'
- source_word: καταγγέλλουσιν
  choice: возвещают
  rationale: Глагол означает открытое, публичное провозглашение и не ограничивается формальной проповедью.
- source_word: οὐχ ἁγνῶς
  choice: не с чистыми побуждениями
  rationale: В данном контексте ἁγνῶς относится к чистоте мотивов; развёрнутая русская формулировка выражает это естественнее, чем буквальное «не чисто».
- source_word: οἰόμενοι
  choice: полагая
  rationale: Передаёт их расчёт или представление о результате своих действий, не утверждая, что этот результат действительно был достигнут.
- source_word: θλῖψιν ἐγείρειν
  choice: причинят мне страдания
  rationale: 'Идиоматическая передача выражения «воздвигнуть скорбь»: сохраняет намерение доставить Павлу дополнительные тяготы без неестественной русской кальки.'
- source_word: τοῖς δεσμοῖς μου
  choice: мне … в заключении
  rationale: Буквальные «узы» метонимически обозначают заключение; основной текст ясно передаёт смысл, а образ цепей сохранён в сноске.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В контексте публичного возвещения титульное значение выступает на первый план. Сноска сохраняет традиционную передачу и подлинную лексическую возможность.
- issue: Характер вреда, которого ожидали соперники Павла
  choice: причинят мне страдания в заключении
  alternative: воздвигнут скорбь моим узам
  rationale: Греческое выражение допускает образное прочтение, связанное с узами Павла, но не уточняет конкретный вид страдания. Перевод не вводит такого уточнения и сохраняет неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок «Другие же» сохраняет контраст с предыдущей группой; формулировка остаётся понятной без устранения неоднозначности мотивов и ожидаемого страдания.
