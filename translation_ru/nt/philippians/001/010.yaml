  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: ru
  text: чтобы вы умели распознавать, что действительно важно[a], и были чисты и безупречны ко дню Мессии[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распознавать лучшее», «одобрять превосходное»; буквальнее: «испытывать то, что различается».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «ко дню Христа». Слово «безупречны» также может означать «не претыкались» или «не давали другим повода преткнуться».'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: распознавать
  rationale: Глагол обозначает проверку и оценку, ведущую к одобрению; «распознавать» естественно передаёт здесь способность выносить испытанное нравственное суждение.
- source_word: τὰ διαφέροντα
  choice: что действительно важно
  rationale: Буквально выражение означает «то, что различается»; в контексте оно указывает на существенное, превосходное или лучшее. Выбранный вариант сохраняет идею различения того, что имеет подлинный вес.
- source_word: εἰλικρινεῖς
  choice: чисты
  rationale: Прилагательное может означать чистоту, искренность и неподдельность; «чисты» уместно в этическом контексте и хорошо сочетается с «безупречны».
- source_word: ἀπρόσκοποι
  choice: безупречны
  rationale: Слово допускает значения «не преткнувшиеся» и «не дающие повода к преткновению». «Безупречны» кратко передаёт общий этический результат, не уточняя однозначно направление действия.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: ко дню Мессии
  rationale: Предлог εἰς выражает направленность к будущему дню; «ко дню» передаёт эту перспективу. Χριστός в данном эсхатологическом обороте сохраняется как титул «Мессия».
theological_decisions:
- issue: Передача Χριστοῦ в эсхатологическом выражении εἰς ἡμέραν Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Здесь Χριστός функционирует как титул, поэтому «Мессия» раскрывает его смысл; привычный церковный вариант «Христа» сохранён в сноске.
- issue: Смысл ἀπρόσκοποι
  choice: безупречны
  alternative: не претыкались / не давали другим повода преткнуться
  rationale: Греческое слово допускает как непереходное, так и причинное понимание. Основной текст сохраняет обобщённый нравственный смысл, а сноска отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Синтаксис продолжает предшествующую мысль стиха 9; повтор греческих целевых конструкций передан одним естественным русским рядом. Подлинная неоднозначность τὰ διαφέροντα и ἀπρόσκοποι отмечена в сносках.
