  source_fidelity: Текст точно передаёт противопоставление двух групп (τινὲς μὲν … τινὲς δέ), мотивы «из зависти и соперничества» (διὰ φθόνον καὶ ἔριν) и положительный мотив «из добрых побуждений» (δι’ εὐδοκίαν), а также действие κηρύσσουσιν. Необязательные в русском усилительные καί не требуют отдельной передачи; смысловой баланс противопоставления сохранён.
  naturalness: Фраза звучит естественно и литературно по-русски. Конструкция «Одни …, а другие — …» ясна, а тире корректно обозначает пропуск повторяющегося сказуемого.
  terminology: «Проповедуют Христа» — устоявшееся и понятное современное русское библейское выражение для τὸν Χριστὸν κηρύσσουσιν. «Соперничество» удачно передаёт конкурентно-враждебный оттенок ἔρις; «добрые побуждения» передаёт εὐδοκία как положительный мотив, не внося лишней интерпретации.
