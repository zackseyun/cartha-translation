  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: ru
  text: Одни проповедуют Христа из зависти и соперничества, а другие — из добрых побуждений.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Одни … а другие
  rationale: Естественно передаёт противопоставление двух неопределённых групп, выраженное конструкцией μέν … δέ.
- source_word: διὰ φθόνον
  choice: из зависти
  rationale: διά с винительным падежом указывает здесь на мотив; «из зависти» кратко и естественно передаёт причинный смысл.
- source_word: ἔριν
  choice: соперничества
  rationale: В контексте противостояния между проповедниками слово обозначает конкурентную враждебность; «соперничество» точнее контекстуально, чем более общее «раздор».
- source_word: δι’ εὐδοκίαν
  choice: из добрых побуждений
  rationale: Выражение обозначает положительный мотив и прямо противопоставлено зависти и соперничеству. Такой перевод естественнее по-русски, чем буквальное «из благоволения», и не уточняет, на кого направлено благоволение.
- source_word: τὸν Χριστόν
  choice: Христа
  rationale: В современном русском библейском и литературном употреблении «Христос» естественно передаёт греческий титул Χριστός; форма «Христа» обусловлена винительным падежом.
- source_word: κηρύσσουσιν
  choice: проповедуют
  rationale: Обычное современное русское соответствие для публичного возвещения религиозной вести; сохраняет смысл κηρύσσω без неестественной тяжеловесности.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Частицы καί не переданы отдельно: в данном контексте они усиливают обе части, но буквальное «также» нарушило бы естественность русского противопоставления. Тире во второй части естественно восполняет повтор сказуемого «проповедуют Христа».'
