id: PHP.1.16
reference: Philippians 1:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: ru
  text: Одни возвещают Христа из любви[a], зная, что я поставлен для защиты Благой вести[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «одни — из любви»; слова «возвещают Христа» подразумеваются из предыдущего стиха.
    reason: implicit_action
  - marker: b
    text: Или «предназначен для защиты Благой вести».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: Одни возвещают Христа
  rationale: Греческая конструкция эллиптична и противопоставлена οἱ δέ; действие «возвещают Христа» восстановлено из ближайшего контекста (ст. 15), чтобы фраза естественно звучала по-русски.
- source_word: ἐξ ἀγάπης
  choice: из любви
  rationale: Предлог ἐξ с отвлечённым существительным обозначает побуждение; «из любви» точно и естественно передаёт этот смысл.
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастие сохраняет смысловую связь греческого причастия с поступком этих людей и не уточняет сверх текста, является ли знание причиной или сопутствующим обстоятельством.
- source_word: εἰς ἀπολογίαν
  choice: для защиты
  rationale: ἀπολογία означает обоснованную, в том числе судебную, защиту; конструкция «для защиты» передаёт целевое значение εἰς.
- source_word: τοῦ εὐαγγελίου
  choice: Благой вести
  rationale: Передаёт основной смысл εὐαγγέλιον понятным современным выражением; прописная буква указывает на конкретную христианскую Весть.
- source_word: κεῖμαι
  choice: я поставлен
  rationale: В данном контексте глагол говорит об отведённом Павлу положении или назначении; «поставлен» сохраняет образ и не сводит его лишь к физическому нахождению в заключении.
theological_decisions:
- issue: Смысл κεῖμαι в контексте заключения Павла
  choice: я поставлен
  alternative: я предназначен; я нахожусь здесь
  rationale: «Поставлен» допускает мысль о назначенной Павлу роли, но не уточняет прямо, кем именно он поставлен, и потому не усиливает богословское утверждение сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без излишне церковной лексики. Эллипсис раскрыт по непосредственному контексту и отмечен сноской; неоднозначность κεῖμαι сохранена в примечании.
