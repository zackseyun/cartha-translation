base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/003.yaml
  text: I thank my God at every remembrance of you,[a]
translation:
  language: ru
  text: Я благодарю моего Бога при каждом воспоминании о вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я благодарю моего Бога за каждое воспоминание о вас».'
    reason: 'Лексико-синтаксическая альтернатива: ἐπί может указывать не только на случай, но и на основание благодарения.'
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Я благодарю
  rationale: Настоящее время, действительный залог, первое лицо единственного числа. Прямое и естественное соответствие греческому глаголу εὐχαριστέω.
- source_word: τῷ θεῷ μου
  choice: моего Бога
  rationale: При русском глаголе «благодарить» адресат ставится в винительном падеже; притяжательное местоимение μου сохранено без расширения смысла.
- source_word: ἐπὶ πάσῃ
  choice: при каждом
  rationale: ἐπί с дательным падежом здесь естественно обозначает обстоятельство или повод благодарения. Сочетание «при каждом» сохраняет связь с единичным существительным μνείᾳ и не усиливает причинное значение.
- source_word: μνείᾳ
  choice: воспоминании
  rationale: Существительное передано существительным, чтобы сохранить образ и синтаксическую сжатость оригинала; в данном контексте речь идёт о воспоминании, а не обязательно об устном упоминании.
- source_word: ὑμῶν
  choice: о вас
  rationale: Родительный падеж обозначает тех, кого касается воспоминание. Русское «о вас» естественно передаёт это отношение и не добавляет отсутствующего в тексте слова «всех».
theological_decisions:
- issue: Значение ἐπί в связи с благодарением
  choice: «при каждом воспоминании» — воспоминание представлено как случай или повод для благодарности
  alternative: «за каждое воспоминание» — воспоминание представлено как основание или предмет благодарности
  rationale: Обе связи допустимы для конструкции ἐπί с дательным падежом. Основной текст сохраняет наиболее непосредственное обстоятельственное значение, а причинно-объектный оттенок указан в сноске без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранена именная конструкция оригинала; более разговорное «каждый раз, когда я вспоминаю о вас» не выбрано, поскольку оно явно вводит Павла как субъекта воспоминания и тем самым несколько сужает греческую формулировку.
