lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт следствие, вытекающее из предыдущего высказывания, и естественно связывает стих с контекстом.
- source_word: τοὺς δεσμούς μου
  choice: мои узы
  rationale: Сохраняет буквальный образ оков и одновременно естественно обозначает заключение Павла.
- source_word: φανεροὺς ... γενέσθαι
  choice: стали известны
  rationale: 'Передаёт результативный смысл конструкции: причина и характер уз Павла получили широкую огласку.'
- source_word: ἐν Χριστῷ
  choice: за Мессию
  rationale: В контексте указывает на связь заключения Павла с Мессией и естественно выражает вероятный смысл причины его уз; более буквальная и богословски ёмкая формулировка сохранена в сноске.
- source_word: Χριστῷ
  choice: Мессию
  rationale: Передаёт Χριστός как титул «Мессия», а не только как имя.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: всей императорской гвардии
  rationale: Передаёт наиболее вероятный в данном контексте коллективный референт πραιτώριον и избегает малопонятного заимствования в основном тексте.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: всем остальным
  rationale: Близко передаёт полноту выражения и расширяет круг людей за пределы императорской гвардии.
theological_decisions:
- issue: Связь ἐν Χριστῷ с узами Павла
  choice: «узы за Мессию» — заключение Павла связано с его верностью Мессии и произошло ради него
  alternative: «мои узы в Мессии» — узы понимаются как переживаемые в сфере единения с Мессией
  rationale: Контекст говорит о том, что окружающим стала известна связь заключения Павла с Мессией. Основной текст передаёт вероятный причинно-определительный смысл, а сноска сохраняет подлинную неоднозначность греческой фразы.
