id: PHP.1.14
reference: Philippians 1:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: ru
  text: И большинство братьев[a], обретя в Господе уверенность благодаря моим узам, ещё больше осмеливаются бесстрашно говорить слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братьев и сестёр»; здесь это слово, вероятно, обозначает верующих в целом.'
    reason: 'Лексическая альтернатива: грамматически мужское множественное число могло в данном контексте включать верующих обоих полов.'
lexical_decisions:
- source_word: τοὺς πλείονας τῶν ἀδελφῶν
  choice: большинство братьев
  rationale: Сочетание с артиклем и родительным разделительным означает «большинство» или «бо́льшая часть», а не просто «больше братьев».
- source_word: ἀδελφῶν
  choice: братьев
  rationale: Греческое существительное стоит во множественном числе мужского рода. Основной текст сохраняет эту форму, а вероятный более широкий круг верующих отмечен в сноске.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формулировка. В данном контексте она отнесена к обретённой уверенности, хотя расположение слов допускает смысловую близость и к «братьям».
- source_word: πεποιθότας
  choice: обретя уверенность
  rationale: Перфектное причастие указывает на возникшее ранее и сохраняющееся состояние уверенности; деепричастная конструкция естественно передаёт связь с последующим действием.
- source_word: τοῖς δεσμοῖς μου
  choice: благодаря моим узам
  rationale: «Узы» сохраняют конкретный образ δεσμοί, а дательный в контексте передаёт причину или средство укрепления уверенности. «Благодаря» отражает парадоксально положительный результат заключения Павла.
- source_word: περισσοτέρως
  choice: ещё больше
  rationale: 'Передаёт сравнительное усиление: узы Павла побудили верующих к большей решимости.'
- source_word: τολμᾶν
  choice: осмеливаются
  rationale: Глагол обозначает решимость совершить действие, несмотря на возможную опасность. Настоящее время в русском выражает сохраняющийся результат, заложенный в конструкции греческого предложения.
- source_word: ἀφόβως
  choice: бесстрашно
  rationale: Наречие прямо обозначает отсутствие страха и потому передано точнее, чем более общее «смело».
- source_word: τὸν λόγον
  choice: слово
  rationale: Буквально сохраняет λόγος и не добавляет отсутствующее в данной текстовой форме уточнение «Божье»; по контексту речь идёт о возвещаемой вести.
- source_word: λαλεῖν
  choice: говорить
  rationale: Нейтральный глагол точно соответствует общему значению λαλεῖν; «проповедовать» было бы более узким толкованием.
theological_decisions:
- issue: Круг лиц, обозначенных ἀδελφῶν
  choice: В основном тексте — «братьев», со сноской о возможном включении сестёр.
  alternative: «братьев и сестёр» или «верующих»
  rationale: Форма оригинала грамматически мужского рода, но в обращении к общине могла охватывать верующих обоих полов. Сноска сохраняет эту вероятную широту без замены формы исходного текста.
- issue: Связь выражения ἐν κυρίῳ
  choice: 'Отнесено к уверенности: «обретя в Господе уверенность».'
  alternative: «большинство братьев в Господе, ободрённые моими узами»
  rationale: Наиболее естественно понимать Господа как основание или сферу уверенности, однако порядок слов допускает некоторую синтаксическую неоднозначность, поэтому перевод не развивает выражение дополнительным богословским толкованием.
- issue: Содержание «слова»
  choice: Оставлено «слово».
  alternative: «Божье слово» или «Евангелие»
  rationale: Контекст указывает на христианскую весть, но в представленной греческой форме определение «Божье» отсутствует. Перевод не восполняет его и сохраняет лаконичность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («Господь», «узы», «слово»). Конструкция стремится сохранить последовательность мысли оригинала, оставаясь понятной при чтении стиха отдельно; сочетание «осмеливаются бесстрашно» намеренно удерживает оба элемента исходного текста — решимость и отсутствие страха.
