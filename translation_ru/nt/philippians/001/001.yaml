reference: Philippians 1:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: ru
  text: 'Павел и Тимофей, рабы Мессии Иисуса, — всем святым в Мессии Иисусе, находящимся в Филиппах, вместе с надзирателями[a] и диаконами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «епископами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: рабы
  rationale: Передаёт несвободный, всецело принадлежащий господину статус, выраженный греческим словом, хотя по-русски это звучит резче традиционного «служители».
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Мессии Иисуса / в Мессии Иисусе
  rationale: Χριστός передан как титул «Мессия», а не как ставшая привычной частью имени форма «Христос»; падежи отражают греческий синтаксис.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: всем святым
  rationale: Краткая и естественная для русского библейского регистра передача обращения ко всем членам освящённого сообщества.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Сохранён повтор предлога ἐν и богословски значимое выражение единения с Мессией без поясняющего пересказа.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: находящимся в Филиппах
  rationale: Причастная конструкция естественно передаёт явное указание на местонахождение адресатов.
- source_word: σὺν
  choice: вместе с
  rationale: Ясно выражает присоединение названных служителей к остальным адресатам.
- source_word: ἐπισκόποις
  choice: надзирателями
  rationale: Прозрачно передаёт основное значение слова и не предрешает вопрос о соответствии более поздней должности епископа.
- source_word: διακόνοις
  choice: диаконами
  rationale: В паре с ἐπισκόποις слово, вероятнее всего, обозначает признанное церковное служение; «диаконы» — естественный и устоявшийся русский эквивалент.
theological_decisions:
- issue: Передача титула Χριστός в формуле приветствия
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: Перевод «Мессия» сохраняет исходную титулярную семантику Χριστός. При этом традиционная форма «Христос Иисус» остаётся возможной, но в основной текст не вынесена, поскольку различие не создаёт здесь смысловой неопределённости.
- issue: Передача δοῦλοι
  choice: рабы
  alternative: служители; рабы-служители
  rationale: «Рабы» точнее сохраняет отношение принадлежности господину и зависимый статус; более мягкое «служители» естественнее стилистически, но ослабляет смысл исходного слова.
- issue: Церковный статус ἐπίσκοποι
  choice: надзиратели
  alternative: епископы
  rationale: «Надзиратели» передаёт лексическое значение, не отождествляя автоматически служение I века с позднейшей формой епископата; традиционный термин отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Двоеточие сохраняет незавершённость адресной формулы перед последующим приветствием. Форма «рабы» намеренно сильна и близка к греческому источнику; «надзиратели» сопровождаются сноской из-за устойчивой церковной альтернативы «епископы».
