id: PHP.1.6
reference: Philippians 1:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: ru
  text: 'Я уверен именно в этом: тот, кто начал среди вас[a] доброе дело, доведёт его до завершения ко дню Мессии Иисуса[b].[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Христа Иисуса».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «до дня Мессии Иисуса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Я уверен
  rationale: Причастие связано с говорящим Павлом; в русском контексте естественно передать его личной формой глагола, не меняя смысла.
- source_word: αὐτὸ τοῦτο
  choice: именно в этом
  rationale: «Именно» сохраняет усилительное значение сочетания, оставаясь естественным для современного русского языка.
- source_word: ὁ ἐναρξάμενος
  choice: тот, кто начал
  rationale: Передаёт субстантивированное причастие и сохраняет личный, но прямо не названный в греческом тексте субъект.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Местоимение стоит во множественном числе и обращено к общине; «среди вас» ясно передаёт возможный общинный охват, не исключая действия в отдельных верующих.
- source_word: ἔργον ἀγαθὸν
  choice: доброе дело
  rationale: Прямой и привычный русский эквивалент без неоправданного уточнения характера дела.
- source_word: ἐπιτελέσει
  choice: доведёт его до завершения
  rationale: Передаёт доведение начатого дела до конца и естественно соотносится с ранее упомянутым «делом».
- source_word: ἄχρι ἡμέρας
  choice: ко дню
  rationale: Выражает день как предельный срок завершения. Буквально-временное «до дня» сохраняется в примечании, поскольку греческий предлог допускает такую передачу.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Χριστός здесь передан как титул «Мессия», а не традиционной транслитерацией; порядок компонентов сохранён.
theological_decisions:
- issue: Индивидуальный или общинный охват Божьего дела
  choice: «среди вас» в основном тексте
  alternative: «в вас»
  rationale: Множественное ὑμῖν и обращение ко всей филиппийской общине позволяют подчеркнуть общинный смысл, не сводя стих к утверждению исключительно об индивидуальной стойкости.
- issue: Субъект начавшего доброе дело
  choice: «тот, кто начал» без добавления имени Бога
  alternative: «Бог, начавший»
  rationale: В контексте субъект подразумевается как Бог, однако в самом греческом стихе он прямо не назван, поэтому перевод не делает неявное явным.
- issue: Отношение завершения дела ко дню Мессии Иисуса
  choice: «ко дню» как указание на предельный срок
  alternative: «до дня»
  rationale: «Ко дню» естественно выражает эсхатологическую направленность завершения, а примечание сохраняет более буквальную временную формулировку и присущую ей оттеночную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Структура фразы близка к греческой, но причастный оборот раскрыт личной конструкцией ради естественности. Строчная буква в «тот, кто» не вводит отсутствующую в оригинале конфессиональную орфографическую интерпретацию.
