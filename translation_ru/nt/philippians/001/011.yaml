  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: ru
  text: исполненные плода праведности[a], который обретается через Иисуса Мессию[b], во славу и хвалу Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плода справедливости».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «Иисуса Христа»; слово «Христос» означает «Мессия» и здесь передано как титул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: исполненные
  rationale: Перфектное страдательное причастие передаёт достигнутое состояние и сохраняет синтаксическую связь с предшествующим контекстом.
- source_word: καρπὸν
  choice: плодом
  rationale: Сохраняется обычный для Павла образ плода как нравственного и духовного результата; творительный падеж обусловлен русским управлением слова «исполненные».
- source_word: δικαιοσύνης
  choice: праведности
  rationale: '«Праведность» здесь естественно передаёт δικαιοσύνη и не ограничивает родительный оборот одним толкованием: плод может быть характеризуем праведностью или состоять в ней.'
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: приходящим через Иисуса Мессию
  rationale: Оборот с διά и родительным указывает на посредство или действующую силу. «Через» сохраняет эту смысловую широту, а причастие естественно связывает оборот со словом «плодом».
- source_word: Χριστοῦ
  choice: Мессию
  rationale: Χριστός передан как титул «Мессия», чтобы сохранить его смысл, а не представить лишь как второе личное имя.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: во славу и хвалу Бога
  rationale: «Во славу» естественно выражает цель или результат εἰς; единое зависимое слово «Бога» отнесено и к славе, и к хвале.
theological_decisions:
- issue: Значение выражения «плод праведности»
  choice: Сохранён родительный оборот «плод праведности» без уточнения его логического отношения.
  alternative: «Плод, состоящий в праведности» или «праведный плод».
  rationale: Греческий родительный допускает несколько близких прочтений. Буквенно естественная русская конструкция сохраняет эту богословскую и грамматическую открытость.
- issue: Роль Иисуса Мессии в появлении плода
  choice: «Приходящим через Иисуса Мессию».
  alternative: «Произведённым Иисусом Мессией» или «даваемым через Иисуса Мессию».
  rationale: Такой перевод выражает посредство или действие Христа, но не уточняет сверх текста, является ли он непосредственным производителем или посредником.
translation_notes:
  register: Современный литературный и достойный регистр. Причастная форма сохранена, поскольку стих продолжает предыдущее предложение; образ «плода» и целевая формула «во славу и хвалу Бога» переданы без конфессионального уточнения.
