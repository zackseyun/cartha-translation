lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: Хочу ... чтобы вы знали
  rationale: Естественно передаёт эпистолярную формулу сообщения и личное намерение автора.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход; в русском он естественно передаётся самим началом новой мысли, без избыточного «теперь» или контрастного «но».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматическую форму греческого обращения; вероятный охват всей общины пояснён в сноске.
- source_word: τὰ κατ’ ἐμὲ
  choice: то, что произошло со мной
  rationale: Ясно и естественно обозначает обстоятельства Павла, не сужая выражение до какого-либо одного события.
- source_word: μᾶλλον
  choice: ещё большему
  rationale: 'Сохраняет сравнительное значение μᾶλλον и подразумеваемый неожиданный результат: обстоятельства не помешали вести, а содействовали её дальнейшему продвижению.'
- source_word: εἰς προκοπὴν
  choice: послужило ... распространению
  rationale: 'Передаёт направленность и результат: случившееся содействовало продвижению вести. «Распространение» естественно сочетается с «Благой вестью».'
- source_word: τοῦ εὐαγγελίου
  choice: Благой вести
  rationale: Передаёт основное значение εὐαγγέλιον понятным современным выражением; традиционный вариант указан в сноске.
- source_word: ἐλήλυθεν
  choice: послужило
  rationale: Перфект описывает наступивший и сохраняющийся результат; в сочетании «послужило ... распространению» он передан естественно по-русски.
