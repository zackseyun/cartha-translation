  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: ru
  text: И я молюсь о том, чтобы ваша любовь всё больше и больше возрастала в познании и во всякой проницательности[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «познанием»; греческий предлог допускает значение сферы или тесной связи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всяким пониманием» или «всякой нравственной чуткостью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: И молюсь о том
  rationale: Союз «и» сохраняет связь с предыдущим контекстом, а «о том» естественно передаёт указательное τοῦτο при русском глаголе «молюсь».
- source_word: προσεύχομαι
  choice: молюсь
  rationale: Настоящее время передаёт продолжающуюся молитву Павла без необходимости добавлять наречия времени.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит содержание и одновременно сохраняет целевую направленность молитвы.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: ваша любовь
  rationale: Прямо и естественно передаёт греческое сочетание, не уточняя без достаточных оснований объект любви.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον
  choice: всё больше и больше
  rationale: Передаёт как продолжающееся возрастание, выраженное ἔτι, так и усиление посредством повторения μᾶλλον.
- source_word: περισσεύῃ
  choice: изобиловала
  rationale: Сохраняет образ полноты и избытка, а форма с «чтобы» естественно передаёт греческое сослагательное наклонение.
- source_word: ἐν ἐπιγνώσει
  choice: познанием
  rationale: Творительный падеж после «изобиловала» естественен по-русски и передаёт тесную связь любви с познанием; возможный оттенок сферы отмечен в сноске.
- source_word: πάσῃ αἰσθήσει
  choice: всякой проницательностью
  rationale: «Проницательность» передаёт способность нравственно и практически распознавать существенное, а «всякой» сохраняет широту πάσῃ.
theological_decisions:
- issue: Связь любви с познанием и проницательностью
  choice: Не уточнять, являются ли познание и проницательность сферой, средством или сопровождающими качествами любви.
  alternative: Перевести однозначно как «в познании» либо «посредством познания».
  rationale: Предлог ἐν допускает близкие смысловые отношения; контекст не требует устранять эту неоднозначность.
- issue: Объект любви
  choice: Оставить «ваша любовь» без дополнения.
  alternative: Добавить «к Богу», «друг к другу» или «ко всем».
  rationale: В стихе объект любви прямо не назван, поэтому его добавление неоправданно сужало бы смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного послания. Формулировка понятна широкому читателю; «изобиловала» сохраняет образ оригинала, а сноски удерживают лексическую и синтаксическую неоднозначность.
