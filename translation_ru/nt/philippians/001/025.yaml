  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: ru
  text: И, уверенный в этом, я знаю, что останусь и продолжу быть со всеми вами ради вашего преуспевания и радости в вере[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радости веры» или «радости, которую даёт вера».'
    reason: alternative_reading
lexical_decisions:
- source_word: πεποιθὼς
  choice: уверенный
  rationale: Перфектное причастие передаёт устойчивое состояние уверенности; «уверенный» естественно и точно выражает этот смысл по-русски.
- source_word: μενῶ
  choice: останусь
  rationale: Будущая форма μένω означает «остаться»; выбор сохраняет прямой смысл и связь с последующим παραμενῶ.
- source_word: παραμενῶ
  choice: буду рядом
  rationale: Составной глагол добавляет к простому «останусь» оттенок продолжающегося пребывания рядом с адресатами. Формулировка различает два глагола, не вводя идеи служения, которой нет в самом слове.
- source_word: πᾶσιν ὑμῖν
  choice: со всеми вами
  rationale: Передаёт и совместность пребывания, и явно выраженное πᾶσιν — «всеми».
- source_word: προκοπὴν
  choice: преуспевание
  rationale: Слово обозначает продвижение вперёд, рост. «Преуспевание» подходит к духовному развитию в контексте и сохраняет возвышенный, но понятный регистр.
- source_word: χαρὰν τῆς πίστεως
  choice: радость в вере
  rationale: Естественная русская формулировка связывает радость с верой, не сводя родительный оборот однозначно к причинному значению.
- source_word: πίστεως
  choice: вера
  rationale: В данном контексте πίστις обозначает веру верующих; «вера» является наиболее прямым и нейтральным соответствием.
theological_decisions:
- issue: Значение родительного падежа в χαρὰν τῆς πίστεως
  choice: радость в вере
  alternative: «радость веры» или «радость, которую даёт вера»
  rationale: Греческий оборот допускает связь, принадлежность или источник. Основной текст оставляет связь достаточно широкой, а примечание сохраняет возможные оттенки, не разрешая грамматическую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Пара «останусь и буду рядом» передаёт различие между μένω и παραμένω без тяжеловесного буквального повтора. Запятая в конце сохранена, поскольку стих синтаксически продолжается в Флп 1:26.
