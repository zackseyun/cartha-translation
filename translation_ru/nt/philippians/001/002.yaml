  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: ru
  text: Благодать вам и мир от Бога, нашего Отца, и Господа Иисуса Христа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Христос» означает «Мессия», то есть Помазанник.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся и естественный русский эквивалент, сохраняющий как смысл Божьего благоволения, так и богословскую насыщенность павловского приветствия.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж естественно передаёт адресата благословения и соответствует русской форме приветствия.
- source_word: εἰρήνη
  choice: мир
  rationale: Прямой и ёмкий эквивалент, сохраняющий значение мира, благополучия и целостности.
- source_word: ἀπό
  choice: от
  rationale: Точно и естественно обозначает источник благодати и мира.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Бога, нашего Отца
  rationale: 'Передаёт наиболее естественное аппозиционное понимание: Бог является нашим Отцом; порядок слов соответствует современному литературному русскому языку.'
- source_word: κυρίου
  choice: Господа
  rationale: Устоявшийся новозаветный эквивалент, сохраняющий смысл власти и высокий христологический регистр.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В русском языке «Христос» — общепринятое и понятное обозначение Иисуса как Мессии; форма родительного падежа обусловлена предлогом «от».
theological_decisions:
- issue: Передача Χριστοῦ в формуле павловского приветствия
  choice: Христа
  alternative: Мессии
  rationale: «Христос» в современном русском библейском употреблении естественно сочетается с именем Иисус и сохраняет традиционный высокий регистр. Смысл титула «Мессия» указан в примечании, чтобы не скрывать значение греческого слова.
- issue: Соотношение Бога Отца и Господа Иисуса как источника благодати и мира
  choice: Сохранена единая конструкция с предлогом «от»
  alternative: 'Повторить предлог: «от Бога… и от Господа…»'
  rationale: Греческий текст употребляет ἀπό один раз перед двумя однородными генитивными группами. Русский перевод сохраняет эту структуру и не ослабляет подразумеваемое совместное указание на источник.
translation_notes:
  register: Современный литературный русский язык с достоинством традиционной апостольской формулы. Пунктуация делает приложение «нашего Отца» прозрачным, не превращая его в отдельный источник благословения.
