id: PHP.1.19
reference: Philippians 1:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: ru
  text: Ведь я знаю, что всё это обернётся для меня спасением[a] благодаря вашей молитве и поддержке Духа Иисуса Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавлением»; возможно также: «оправданием».'
    reason: alternative_reading
  - marker: b
    text: 'Традиционно: «Духа Иисуса Христа»; греческое Χριστός — титул со значением «Мессия», «Помазанник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: я знаю
  rationale: Перфектная форма οἶδα имеет значение настоящего времени; «я знаю» естественно передаёт уверенность Павла.
- source_word: τοῦτό
  choice: всё это
  rationale: Указательное местоимение отсылает ко всей описанной ситуации; «всё это» ясно выражает широкий контекстуальный референт, не конкретизируя его сверх текста.
- source_word: ἀποβήσεται
  choice: обернётся
  rationale: Глагол обозначает итог или результат; «обернётся» естественно сочетается с последующим творительным падежом и сохраняет направленность в будущее.
- source_word: σωτηρίαν
  choice: спасением
  rationale: Слово допускает значения спасения, избавления и оправдания. «Спасение» сохраняет его широкий богословский диапазон и возможную связь с формулировкой Иов 13:16 в Септуагинте, тогда как контекст заключения допускает более непосредственное понимание.
- source_word: δεήσεως
  choice: молитве
  rationale: В данном контексте речь идёт о молитвенном прошении; «молитва» — ясный и естественный русский эквивалент.
- source_word: ἐπιχορηγίας
  choice: поддержке
  rationale: Существительное обозначает предоставляемую помощь или снабжение. «Поддержка» естественно передаёт действенную помощь Духа, не вводя материального оттенка слова «снабжение».
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Духа Иисуса Мессии
  rationale: Родительная конструкция передана прямо. Χριστός здесь является титулом и переведено как «Мессия»; традиционный вариант отмечен в сноске.
theological_decisions:
- issue: Значение σωτηρίαν в контексте заключения Павла
  choice: спасением
  alternative: избавлением; оправданием
  rationale: Контекст допускает освобождение из заключения или подтверждение правоты Павла, однако слово сохраняет и более широкое значение спасения. Основной текст не сводит его к одному временному исходу, а варианты приведены в сноске.
- issue: Отношение родительного πνεύματος к ἐπιχορηγίας
  choice: поддержке Духа
  alternative: дару Духа; ниспосланию Духа
  rationale: Греческая конструкция может указывать как на помощь, которую оказывает Дух, так и на дарование самого Духа. Выбранная формулировка наиболее естественна в контексте, не уточняя способ действия Духа.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Формулировка сохраняет уверенность Павла и смысловую широту ключевого слова σωτηρία, избегая конфессионального уточнения характера ожидаемого исхода.
