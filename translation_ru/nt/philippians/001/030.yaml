translation:
  language: ru
  text: испытывая ту же борьбу, какую вы видели у меня и о которой теперь слышите.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: борьбу
  rationale: Передаёт состязание, напряжённое противостояние и страдание за веру без неоправданного сужения до военного конфликта.
- source_word: ἔχοντες
  choice: ведя
  rationale: По-русски естественно сочетается со словом «борьба» и сохраняет обстоятельственную связь причастия с предыдущим контекстом.
- source_word: ἐν ἐμοί
  choice: вёл я / я всё ещё веду
  rationale: Буквальное «во мне» здесь по-русски неясно; оборот идиоматически указывает на борьбу, происходящую в жизни Павла. Настоящее время νῦν ἀκούετε передано продолжением борьбы.
theological_decisions:
- issue: Характер борьбы Павла и филиппийцев
  choice: «ту же борьбу» без уточнения её вида
  alternative: «те же страдания» или «ту же битву»
  rationale: Греческое ἀγών допускает широкий образ напряжённой борьбы; конкретизация могла бы преждевременно разрешить смысл в пользу страданий, проповеди или духовной брани.
- issue: Значение второго ἐν ἐμοί
  choice: «я всё ещё веду»
  alternative: «теперь слышите обо мне» / «теперь слышите во мне»
  rationale: 'Выбор выражает естественный смысл: адресаты слышат, что борьба Павла продолжается. «Всё ещё» имплицировано сопоставлением увиденного прежде с тем, о чём они слышат теперь, хотя отдельного соответствующего слова в греческом нет.'
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство и риторический параллелизм оригинала. Инверсия «вёл я» поддерживает сопоставление с «вы видели», не создавая архаического звучания.
