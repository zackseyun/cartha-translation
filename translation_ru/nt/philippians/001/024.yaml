  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: ru
  text: Но оставаться во плоти нужнее ради вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжать жить в теле».'
    reason: Лексическая альтернатива поясняет, что выражение «во плоти» означает продолжение телесной земной жизни.
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: оставаться
  rationale: Субстантивированный инфинитив передан инфинитивом; глагол сохраняет мысль о продолжении нынешней земной жизни и естественно звучит по-русски.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает контраст с предшествующей мыслью Павла об уходе и пребывании со Христом.
- source_word: ἐν τῇ σαρκὶ
  choice: во плоти
  rationale: Формально близкая передача сохраняет буквальное указание на телесную земную жизнь, не привнося здесь значения «греховная природа».
- source_word: ἀναγκαιότερον
  choice: нужнее
  rationale: Сравнительная степень сохранена; «нужнее» яснее и естественнее современного русского оборота «более необходимо».
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: Оборот естественно выражает направленность продолжения служения на благо адресатов, сохраняя краткость греческого текста.
theological_decisions:
- issue: Значение σάρξ в этом стихе
  choice: буквальная телесная земная жизнь («во плоти»)
  alternative: нравственно-метафорическое значение («греховная природа») или поясняющий пересказ («оставаться в живых в этом мире»)
  rationale: Контекст противопоставляет уход и пребывание со Христом продолжению нынешней жизни Павла ради филиппийцев. Нравственное значение здесь контекстом не поддерживается, а полный пересказ устранил бы образ исходного текста.
- issue: Смысл сравнительной формы ἀναγκαιότερον
  choice: 'сохранить сравнение: «нужнее»'
  alternative: сгладить до «необходимо»
  rationale: Греческий текст прямо употребляет сравнительную степень, которая поддерживает напряжение между тем, что лучше лично для Павла, и тем, что нужнее для адресатов.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная формулировка. Сохранён библейский образ «во плоти», а сноска предотвращает ошибочное нравственно-метафорическое прочтение.
