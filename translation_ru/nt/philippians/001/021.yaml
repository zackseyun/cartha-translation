lexical_decisions:
- source_word: ἐμοὶ
  choice: для меня
  rationale: Дательный местоимения передаёт личную перспективу Павла; «для меня» естественно по-русски и сохраняет смысловую выделенность.
- source_word: γὰρ
  choice: ведь
  rationale: γάρ поясняет предшествующую мысль; «ведь» естественно выражает пояснительную связь, не делая её чрезмерно причинной.
- source_word: τὸ ζῆν
  choice: жизнь
  rationale: Субстантивированный инфинитив передан существительным, что создаёт в русском языке краткую и естественную формулу и сохраняет параллелизм со «смертью».
- source_word: Χριστὸς
  choice: Христос
  rationale: В Павловом употреблении Χριστός может иметь как титульный, так и близкий к имени характер; традиционное и современное русское «Христос» сохраняет эту ёмкость.
- source_word: τὸ ἀποθανεῖν
  choice: смерть
  rationale: Субстантивированный инфинитив естественно передаётся существительным и образует уравновешенную пару с «жизнью».
- source_word: κέρδος
  choice: приобретение
  rationale: Слово обозначает выгоду или выигрыш; «приобретение» передаёт положительный итог без излишне коммерческого оттенка и соответствует сжатой именной конструкции оригинала.
theological_decisions:
- issue: Смысл формулы «жизнь — Христос»
  choice: Сохранена без поясняющего дополнения
  alternative: «жить — значит служить Христу» или «смысл жизни — Христос»
  rationale: Греческая формула предельно сжата и допускает несколько взаимосвязанных оттенков. Добавление «служить» или «смысл» сузило бы её богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык; афористическая краткость и параллелизм оригинала сохранены. Тире передают подразумеваемые связки. Союзы «ведь… а…» естественно обозначают пояснение и контраст.
