lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ ὑμῶν
  choice: за ваше участие
  rationale: Предлог ἐπί с дательным здесь указывает на основание благодарения в окружающем предложении. «Участие» передаёт κοινωνία как деятельную сопричастность общему делу, не сводя её лишь к общению.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: в благовестии
  rationale: Такой перевод естественно обозначает сферу совместного участия и сохраняет тесную связь κοινωνία с εὐαγγέλιον. Возможное целевое значение εἰς отражено в сноске.
- source_word: εὐαγγέλιον
  choice: благовестие
  rationale: «Благовестие» — понятный и укоренённый в русском библейском языке эквивалент, обозначающий и провозглашаемую Благую весть, и связанное с ней служение.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: с первого дня
  rationale: Фраза точно и естественно обозначает начальную точку продолжающегося участия филиппийцев.
- source_word: ἄχρι τοῦ νῦν
  choice: и доныне
  rationale: Передаёт продолжение действия вплоть до настоящего момента; союз «и» по-русски естественно связывает границы временного промежутка.
theological_decisions:
- issue: Связь участия филиппийцев с благовестием
  choice: в благовестии
  alternative: ради благовестия
  rationale: Греческое εἰς допускает понимание благовестия как сферы совместного участия или как его цели. Основной текст выбирает естественное по-русски сферическое прочтение, а целевое сохраняется в сноске без устранения смысловой напряжённости.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Доныне» сохраняет достоинство стиля и остаётся понятным широкому читателю; синтаксис учитывает, что стих является частью более длинного предложения.
