  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: ru
  text: Ведь Бог мне свидетель, как я тоскую по всем вам с сердечной привязанностью[a] Мессии Иисуса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с состраданием Мессии Иисуса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христа Иисуса».'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυς
  choice: свидетель
  rationale: Оборот «Бог мне свидетель» естественно и точно передаёт торжественный призыв к Богу как свидетелю искренности Павла.
- source_word: γάρ
  choice: ведь
  rationale: «Ведь» сохраняет пояснительную связь с предыдущей мыслью и звучит естественно в современном русском языке.
- source_word: ὡς
  choice: как
  rationale: Здесь слово вводит содержание и подчёркивает силу устремления Павла.
- source_word: ἐπιποθῶ
  choice: тоскую по
  rationale: Выражение передаёт сильное личное стремление быть с адресатами, не добавляя прямо отсутствующего в греческом упоминания о встрече.
- source_word: πάντας ὑμᾶς
  choice: по всем вам
  rationale: Сохраняется явный охват всей общины.
- source_word: σπλάγχνοις
  choice: с нежностью
  rationale: Буквально слово обозначает внутренности как средоточие глубоких чувств; «нежность» естественно передаёт здесь глубокую сердечную привязанность, а вариант «сострадание» отмечен в сноске.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Χριστός передано как значимый титул «Мессия», а порядок компонентов сохранён насколько позволяет русский язык; традиционный вариант дан в сноске.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  alternative: Христа Иисуса
  rationale: Основной текст раскрывает титульное значение Χριστός, не превращая его без пояснения в имя; традиционная русская форма сохранена как допустимая альтернатива.
- issue: Отнесённость глубокого чувства к Мессии Иисусу
  choice: с нежностью Мессии Иисуса
  alternative: с состраданием Мессии Иисуса
  rationale: Родительный оборот сохранён без уточнения, идёт ли речь о чувстве, исходящем от Мессии, принадлежащем ему или подобном его чувству; такая неоднозначность присутствует в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; тон личный и торжественный. Сохранён библейски узнаваемый оборот «Бог мне свидетель», при этом избегнуты архаические «утробы» и поясняющие добавления вроде «жажду увидеть».
