    rationale: σπλάγχνοις обозначает глубочайшие внутренние чувства, в данном контексте — сердечную привязанность, также допускающую оттенок сострадания. Русская «нежность» уже и может означать лишь мягкость отношения.
  - severity: low
    issue: Сноска a дана как одиночная лексема.
    rationale: Для русского читателя лучше показать альтернативу в той же синтаксической рамке и сохранить связь с «Мессии Иисуса».
