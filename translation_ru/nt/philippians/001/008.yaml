- from: Ведь Бог мне свидетель, как я тоскую по всем вам с нежностью[a] Мессии Иисуса[b].
  to: Ведь Бог мне свидетель, как я тоскую по всем вам с сердечной привязанностью[a] Мессии Иисуса[b].
  rationale: Заменено слишком узкое «с нежностью» на «с сердечной привязанностью», более полно передающее σπλάγχνοις в контексте личной любви Павла. Сноска a уточнена как полное альтернативное словосочетание. Остальные элементы сохраняют смысл, порядок аргумента и намеренную неоднозначность греческого родительного оборота.
