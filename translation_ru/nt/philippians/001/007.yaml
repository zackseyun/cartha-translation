id: PHP.1.7
reference: Philippians 1:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: ru
  text: 'И справедливо мне так думать обо всех вас[a], потому что вы у меня в сердце: ведь все вы — мои соучастники в благодати[b] и в моих узах, и в защите и утверждении Благой Вести.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что я у всех вас в сердце». Греческий оборот допускает оба понимания.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вместе со мной участвуете в благодати».'
    reason: alternative_rendering
lexical_decisions:
- source_word: δίκαιον
  choice: справедливо
  rationale: 'Передаёт этический и оценочный смысл: такое отношение Павла к филиппийцам правильно и обоснованно.'
- source_word: φρονεῖν
  choice: так думать
  rationale: Естественно передаёт мысль и устойчивое внутреннее отношение, не сужая значение до одной эмоции.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: обо всех вас
  rationale: При φρονεῖν оборот обозначает направленность мысли и отношения к людям.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: потому что вы у меня в сердце
  rationale: Следует контекстуально вероятному прочтению, при котором Павел держит филиппийцев в своём сердце; грамматически возможная обратная трактовка отмечена в сноске.
- source_word: δεσμοῖς
  choice: узах
  rationale: Сохраняет конкретный образ заключения и подходит возвышенному, но понятному библейскому регистру.
- source_word: ἀπολογίᾳ
  choice: защищаю
  rationale: Передаёт публичную, а возможно и судебную, защиту Благой Вести; глагольная форма делает русскую фразу естественнее.
- source_word: βεβαιώσει
  choice: утверждаю
  rationale: Выражает укрепление и подтверждение истинности Благой Вести и естественно сочетается с глаголом «защищаю».
- source_word: εὐαγγελίου
  choice: Благую Весть
  rationale: Ясно передаёт значение εὐαγγέλιον современному читателю и сохраняет смысл провозглашаемой вести.
- source_word: συγκοινωνούς μου
  choice: вместе со мной причастны
  rationale: Передаёт совместное участие без неестественной русской тавтологии.
- source_word: χάριτος
  choice: благодати
  rationale: Сохраняет ключевой богословский термин и охватывает Божий дар, в котором Павел и адресаты участвуют совместно.
theological_decisions:
- issue: Синтаксическая неоднозначность оборота о сердце
  choice: вы у меня в сердце
  alternative: я у вас в сердце
  rationale: Оба местоимения при инфинитиве стоят в винительном падеже, поэтому формально возможны оба направления отношения. Основной вариант лучше согласуется с непосредственным выражением отношения Павла, а иной сохранён в сноске.
- issue: Соотнесение участия в благодати с узами и служением Благой Вести
  choice: все вы вместе со мной причастны благодати
  alternative: все вы — мои соучастники в благодати
  rationale: Выбранный вариант сохраняет мысль о совместном участии в благодати, не уточняя сверх текста, относится ли она преимущественно к служению, страданию или Божьему дару в целом.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Узы» сохраняют образ δεσμοί, а глагольная конструкция «защищаю и утверждаю» устраняет тяжеловесную цепочку отглагольных существительных. Маркеры сносок помещены в основной текст.
