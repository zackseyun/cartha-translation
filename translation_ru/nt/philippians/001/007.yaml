revisions:
- from: 'И справедливо мне так думать обо всех вас[a], потому что вы у меня в сердце: и в моих узах, и когда я защищаю и утверждаю Благую Весть, все вы вместе со мной причастны благодати.[b]'
  to: 'И справедливо мне так думать обо всех вас[a], потому что вы у меня в сердце: ведь все вы — мои соучастники в благодати[b] и в моих узах, и в защите и утверждении Благой Вести.'
  rationale: Перестроена заключительная часть, чтобы «узы», «защита» и «утверждение Благой Вести» ясно характеризовали общее с Павлом участие адресатов в благодати. Глагольное «когда я защищаю и утверждаю» заменено исходными существительными, сохраняя координацию ἀπολογίᾳ καὶ βεβαιώσει. Неоднозначность оборота о сердце сохранена в сноске.
