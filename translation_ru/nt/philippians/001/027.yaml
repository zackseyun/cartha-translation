source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: ru
  text: Только пусть ваша жизнь будет достойна Благой Вести о Мессии, чтобы — приду ли я и увижу вас или останусь в отсутствии — я слышал о вас, что вы твёрдо стоите в одном духе[a], единодушно[b] сообща подвизаясь за веру, связанную с Благой Вестью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одном Духе».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «одной душой».'
    reason: lexical_alternative
  - marker: c
    text: 'Греч. выражение допускает также перевод: «сообща подвизаясь за веру в Благую Весть».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: Только
  rationale: 'Начальная позиция и краткая форма сохраняют эмфатическое ограничение: это главное требование.'
- source_word: ἀξίως
  choice: достойно
  rationale: Естественное русское наречие точно передаёт характеристику образа жизни.
- source_word: πολιτεύεσθε
  choice: живите
  rationale: В контексте речь об образе жизни и поведении общины; естественное «живите» не перегружает текст, тогда как гражданский оттенок глагола здесь остаётся вторичным.
- source_word: τοῦ εὐαγγελίου τοῦ Χριστοῦ
  choice: Благой Вести о Мессии
  rationale: «Благая Весть» ясно передаёт смысл εὐαγγέλιον; Χριστός сохраняется как титул «Мессия». Родительный Χριστοῦ естественно выражен через «о».
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: услышу о вас
  rationale: Естественно передаёт греческий оборот о получении известий, касающихся адресатов.
- source_word: στήκετε
  choice: твёрдо стоите
  rationale: Передаёт устойчивость и стойкость, заключённые в глаголе.
- source_word: ἐν ἑνὶ πνεύματι
  choice: в одном духе
  rationale: Строчная буква соответствует ближайшему параллелизму с единодушием общины, но возможная ссылка на Святого Духа отмечена в сноске.
- source_word: μιᾷ ψυχῇ
  choice: единодушно
  rationale: Идиоматично передаёт буквальное «одной душой» как общность воли и устремления.
- source_word: συναθλοῦντες
  choice: вместе боретесь
  rationale: Сохраняет совместность и образ напряжённой борьбы, лежащий в основе составного глагола.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: за веру, основанную на Благой Вести
  rationale: Основной текст понимает дательный как объект совместной борьбы, а родительный — как определяющий содержание или основание веры; иная возможная связь отмечена в сноске.
theological_decisions:
- issue: Относится ли πνεύματι к общему человеческому духу или к Святому Духу
  choice: в одном духе
  alternative: в одном Духе
  rationale: Параллель с μιᾷ ψυχῇ поддерживает мысль о единстве настроя общины, однако грамматика допускает и указание на Святого Духа, поэтому напряжение сохранено в сноске.
- issue: Как понимать τῇ πίστει τοῦ εὐαγγελίου
  choice: за веру, основанную на Благой Вести
  alternative: за веру в Благую Весть
  rationale: Греческий родительный допускает несколько смысловых отношений; основной вариант сохраняет «веру» как то, за что сообща борются, не отождествляя её однозначно с субъективным актом доверия.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Синтаксис несколько упрощён ради читаемости, но условная конструкция, параллелизм и богословская неоднозначность сохранены.
