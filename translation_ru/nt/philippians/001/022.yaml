  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: ru
  text: Но если жить во плоти[a] — это для меня плодотворный труд[b], а что я выберу, не знаю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в теле».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «плод труда»; возможно также: «труд, приносящий плод».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: продолжать жить
  rationale: Артиклированный инфинитив в данном контексте обозначает продолжение нынешней земной жизни; такой перевод естественно передаёт её длительность.
- source_word: ἐν σαρκί
  choice: во плоти
  rationale: Здесь σάρξ указывает на телесную земную жизнь, а не на нравственно испорченную природу; буквальный русский эквивалент сохраняет лексику Павла.
- source_word: καρπὸς ἔργου
  choice: плодотворный труд
  rationale: Сжатое греческое выражение буквально означает «плод труда». Выбранный вариант естественно передаёт мысль о труде, приносящем плод, не уточняя его вид сверх контекста.
- source_word: αἱρήσομαι
  choice: выбрать
  rationale: В контексте двух возможностей глагол означает выбор или предпочтение; «выбрать» — наиболее ясный современный эквивалент.
- source_word: οὐ γνωρίζω
  choice: я не знаю
  rationale: Хотя γνωρίζω часто значит «сообщать, давать знать», здесь оборот выражает неуверенность Павла относительно выбора.
theological_decisions:
- issue: Значение σάρξ в этом стихе
  choice: телесное земное существование («во плоти»)
  alternative: греховная природа
  rationale: Контекст противопоставляет продолжение нынешней жизни уходу и пребыванию со Христом, поэтому речь идёт о телесной жизни, а не о нравственной испорченности.
- issue: Синтаксическая сжатость первого условия
  choice: «означает для меня плодотворный труд»
  alternative: 'буквально: «это для меня — плод труда»'
  rationale: Греческая фраза эллиптична. Основной текст передаёт наиболее вероятную связь между продолжением жизни и приносящим плод трудом, а буквальная форма сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Сохранено выражение «во плоти», характерное для речи Павла, но примечание поясняет его телесный смысл. Сжатый греческий оборот передан естественно, без уточнения характера труда.
