  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: ru
  text: Что же? Важно лишь то, что Мессию[a] возвещают так или иначе — притворно или искренне, — и этому я рад. Да, буду радоваться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Что же?
  rationale: Сохраняет краткий риторический переход Павла, не превращая его в более пространное «какое это имеет значение?».
- source_word: πλὴν ὅτι
  choice: 'Важно лишь одно:'
  rationale: 'Естественно передаёт ограничительно-итоговую силу выражения: независимо от побуждений решающим остаётся последующий факт.'
- source_word: παντὶ τρόπῳ
  choice: каким бы образом ни возвещали
  rationale: Передаёт всеохватность оборота и в русском естественно связывается с последующим противопоставлением способов или побуждений.
- source_word: προφάσει
  choice: притворно
  rationale: Передаёт видимость и неискренность, не конкретизируя сверх текста ложные мотивы проповедников.
- source_word: ἀληθείᾳ
  choice: искренне
  rationale: В данной антитезе обозначает подлинность в противоположность притворству; наречная форма звучит по-русски естественно.
- source_word: Χριστὸς
  choice: Мессию
  rationale: Передаёт Χριστός как титул Помазанника в контексте его возвещения, а не как ставшее именем обозначение.
- source_word: καταγγέλλεται
  choice: возвещают
  rationale: Русская неопределённо-личная конструкция естественно передаёт греческий пассив и публичный характер провозглашения, не называя действующих лиц.
- source_word: ἐν τούτῳ
  choice: этому
  rationale: Ясно соотносит радость Павла с фактом возвещения Мессии.
- source_word: χαίρω
  choice: я рад
  rationale: Современная и естественная передача настоящего состояния радости без потери смысла.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: Более того, я и впредь буду радоваться
  rationale: Передаёт усилительно-присоединительную силу ἀλλὰ καί и будущую направленность χαρήσομαι; «и впредь» естественно связывает будущую радость с нынешней.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово стоит в контексте публичного возвещения и сохраняет титульное значение; «Мессия» делает значение титула прозрачным, не добавляя конфессиональной интерпретации.
- issue: Отношение Павла к неискреннему возвещению
  choice: Радость относится к факту возвещения Мессии, а не к притворству возвещающих
  alternative: Павел одобряет и сам неискренний способ возвещения
  rationale: Синтаксис связывает ἐν τούτῳ с тем, что Мессия возвещается при любом из названных побуждений; перевод не должен превращать это в одобрение ложных мотивов.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Парная конструкция «притворно или искренне» естественно передаёт греческую антитезу. Тире выделяют два противопоставленных обстоятельства, не устраняя возможной смысловой широты παντὶ τρόπῳ. Единственный маркер [a] присутствует в основном тексте.
