  source_fidelity: 'Черновик верно передаёт целевое значение ἵνα, титул Χριστός («Мессия») и общий смысл: возвращение Павла увеличит у филиппийцев повод для хваления в Мессии Иисусе. Однако «новому приходу» не передаёт πάλιν («снова, опять») и звучит неестественно. «Хвалиться мною» чрезмерно делает Павла прямым объектом хваления; ἐν ἐμοί здесь естественнее передать как основание/повод: «благодаря мне», тогда как хваление остаётся «в Мессии Иисусе».'
