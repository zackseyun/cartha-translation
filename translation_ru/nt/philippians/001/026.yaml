  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: ru
  text: чтобы благодаря моему возвращению к вам у вас стало ещё больше поводов хвалиться в Мессии Иисусе благодаря мне.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы ваше хваление в Мессии Иисусе благодаря мне ещё более умножилось через моё возвращение к вам». Слово καύχημα может означать как хваление, так и основание или повод для него; выражение ἐν ἐμοί буквально означает «во мне» и здесь может передаваться также как «из-за меня» или «благодаря мне».'
    reason: lexical_alternative
  - marker: b
    text: '«Мессии Иисусе» можно также перевести: «Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит цель или ожидаемый результат сказанного в предыдущем стихе.
- source_word: τὸ καύχημα ὑμῶν
  choice: у вас было ещё больше оснований хвалиться
  rationale: καύχημα может обозначать как само хваление, так и его основание или повод; в данном контексте оборот с «основаниями» ясно передаёт мысль о возросшем поводе для радости и хвалы.
- source_word: περισσεύῃ
  choice: было ещё больше
  rationale: Передаёт идею умножения или изобилия и сохраняет направленность придаточного с ἵνα.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Χριστός сохраняет значение титула «Мессия», а предлог ἐν передан без устранения характерной для Павла формулы пребывания «в Мессии».
- source_word: ἐν ἐμοὶ
  choice: хвалиться мною
  rationale: Формально выражение означает «во мне», но здесь Павел выступает поводом или предметом хваления; русское творительное дополнение естественно передаёт эту связь.
- source_word: διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς
  choice: благодаря моему новому приходу к вам
  rationale: παρουσία здесь означает личное прибытие и присутствие Павла; «новый приход» естественно передаёт повторное посещение, а διά с родительным — средство или обстоятельство, благодаря которому возрастёт повод для хвалы.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В сочетании Χριστῷ Ἰησοῦ титульное значение остаётся различимым; перевод «Мессия» раскрывает смысл греческого титула, а традиционный вариант отмечен в сноске.
- issue: Связь ἐν ἐμοὶ с καύχημα
  choice: мною как поводом или предметом хваления
  alternative: «во мне» либо «из-за меня»
  rationale: Греческая конструкция допускает более буквальную передачу, однако контекст ожидаемого возвращения Павла указывает на него как на повод для хваления; формулировка не приписывает Павлу источник спасения, поскольку хваление остаётся «в Мессии Иисусе».
translation_notes:
  register: Современный литературный русский язык; синтаксис перестроен ради естественности, при этом причинно-инструментальная связь возвращения Павла и возрастания повода для хвалы сохранена. Формулировка «оснований хвалиться» избегает неестественного буквального оборота «хваление да изобилует», а сноска сохраняет лексическую и синтаксическую неоднозначность оригинала.
