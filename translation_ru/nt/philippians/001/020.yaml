id: PHP.1.20
reference: Philippians 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: ru
  text: согласно моему напряжённому ожиданию и надежде, что я ни в чём не буду посрамлён[a], но со всей смелостью, как всегда, так и теперь, Мессия[b] будет возвеличен в моём теле — жизнью ли, смертью ли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не постыжусь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: согласно
  rationale: Передаёт соответствие между ожидаемым исходом и напряжённым ожиданием и надеждой Павла.
- source_word: ἀποκαραδοκίαν
  choice: напряжённое ожидание
  rationale: Сохраняет усиленный, устремлённый вперёд характер редкого греческого существительного и звучит естественно по-русски.
- source_word: ἐλπίδα
  choice: надежда
  rationale: Обычное для Павла значение уверенной надежды; естественно сочетается со словом «ожидание».
- source_word: ἐν οὐδενὶ
  choice: ни в чём
  rationale: Кратко и идиоматично выражает полное отрицание.
- source_word: αἰσχυνθήσομαι
  choice: не буду посрамлён
  rationale: 'Сохраняет возможный пассивный и публичный оттенок: Павел не окажется опозоренным или не оправдавшим надежды.'
- source_word: παρρησίᾳ
  choice: со всей смелостью
  rationale: В контексте открытого свидетельства обозначает бесстрашие и свободу говорить и действовать.
- source_word: μεγαλυνθήσεται
  choice: будет возвеличен
  rationale: Передаёт смысл признания и явления величия Христа, сохраняя возвышенный библейский регистр.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Здесь титул остаётся смысловым и указывает на мессианское достоинство Иисуса; традиционное «Христос» отмечено как допустимая альтернатива.
- source_word: ἐν τῷ σώματί μου
  choice: в моём теле
  rationale: Прямо сохраняет телесный характер свидетельства Павла как в жизни, так и в смерти.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: жизнью ли, смертью ли
  rationale: Русский творительный падеж естественно передаёт средство или обстоятельство, выраженное διά с родительным, и сохраняет параллелизм.
theological_decisions:
- issue: Передача Χριστός в послании Павла
  choice: Мессия
  alternative: Христос
  rationale: В данном высказывании титульное значение остаётся различимым; вариант «Мессия» делает его явным, не добавляя конфессионально специфического толкования.
- issue: Значение αἰσχυνθήσομαι
  choice: не буду посрамлён
  alternative: не постыжусь
  rationale: Форма допускает как внешнее посрамление, так и внутренний стыд. Основной текст сохраняет публично-объективный оттенок контекста, а сноска фиксирует подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Порядок фразы слегка приспособлен к русскому синтаксису; тире подчёркивает заключительную симметрию. Маркеры сносок размещены при словах, к которым относятся соответствующие варианты.
