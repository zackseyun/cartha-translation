lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание для сказанного в предыдущем стихе; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: ἐχαρίσθη
  choice: даровано
  rationale: Глагол указывает на свободно и милостиво данный дар, а не просто на разрешение. «Даровано» сохраняет этот смысл и подразумеваемое божественное действие.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: ради Мессии
  rationale: Субстантивированная конструкция охватывает оба последующих инфинитива и связывает весь дар с Мессией. «Ради Мессии» естественно передаёт значение основания или отношения; Χριστός передан как титул «Мессия».
- source_word: πιστεύειν εἰς αὐτόν
  choice: верить в Него
  rationale: Это прямой и естественный русский эквивалент оборота, обозначающего веру, направленную на личность.
- source_word: πάσχειν
  choice: страдать
  rationale: Прямой перевод сохраняет силу и простоту греческого инфинитива.
- source_word: ὑπὲρ αὐτοῦ
  choice: за Него
  rationale: В данном контексте ὑπέρ выражает страдание из-за верности Мессии и ради Него; краткое «за Него» естественно в русском языке.
theological_decisions:
- issue: Относится ли дарование и к вере, и к страданию
  choice: Сохранить оба инфинитива как предметы одного «даровано»
  alternative: Ослабить выражение до разрешения или построить фразу так, чтобы даром выглядело только страдание
  rationale: Греческий синтаксис включает и веру в Мессию, и страдание за Него в то, что было даровано. Перевод сохраняет эту богословскую напряжённость, не смягчая её.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово сохраняет функцию титула; «Мессия» делает титульный смысл явным. Традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Порядок слов сохраняет общий охват выражения «ради Мессии», а формула «вам… даровано» удерживает оттенок благодатного дара. Заглавная буква в местоимении следует принятому благоговейному русскому библейскому регистру.
