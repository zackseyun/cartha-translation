  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: ru
  text: и ни в чём не страшась[a] противников. Это для них — знак[b] гибели, а для вас — спасения; и это от Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пугаясь»; «не поддаваясь запугиванию».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свидетельство»; «указание» на гибель.'
    reason: lexical_alternative
  - marker: c
    text: Слова «это от Бога» могут относиться непосредственно к спасению или шире — ко всему предшествующему знаку.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: не страшась
  rationale: Причастие передаёт испуг или запугивание перед лицом противодействия. «Не страшась» естественно по-русски и сохраняет связь с продолжающимся призывом предыдущего стиха.
- source_word: ἐν μηδενί
  choice: ни в чём
  rationale: 'Буквально и идиоматично передаёт всеохватный смысл: ни в каком отношении и ни при каких обстоятельствах.'
- source_word: ὑπὸ τῶν ἀντικειμένων
  choice: противников
  rationale: Субстантивированное причастие обозначает тех, кто противостоит адресатам. «Противников» кратко и естественно; сама конструкция ясно указывает, кого не следует страшиться.
- source_word: ἔνδειξις
  choice: знак
  rationale: Слово обозначает свидетельствующий признак или указание. «Знак» ясно и кратко сохраняет эту доказательную функцию, не усиливая её до безусловного «доказательства».
- source_word: ἀπωλείας
  choice: гибели
  rationale: «Гибель» естественно передаёт смысл окончательного краха или уничтожения и не вносит конфессионально окрашенной терминологии.
- source_word: σωτηρίας
  choice: спасения
  rationale: «Спасение» сохраняет обычный для Павла богословский вес слова и параллель с «гибелью».
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: и это от Бога
  rationale: Сохраняет указательное местоимение и намеренно не уточняет, относится ли оно только к спасению или ко всему предшествующему знаку.
theological_decisions:
- issue: Референт τοῦτο («это»)
  choice: В основном тексте оставлено широкое и грамматически неоднозначное «и это от Бога».
  alternative: «Спасение — от Бога» либо «этот знак — от Бога».
  rationale: Греческий текст допускает как ближайший референт «спасение», так и более широкий охват предшествующей мысли; перевод не должен устранять эту богословски значимую неоднозначность.
- issue: Соотношение погибели противников и спасения верующих
  choice: 'Сохранена симметричная конструкция: один и тот же знак указывает для одних на гибель, для других — на спасение.'
  alternative: Развернуть причинную связь или объяснить знак как доказательство приговора.
  rationale: Исходный текст утверждает контраст, но не объясняет здесь механизм; перевод сохраняет напряжение без добавочного толкования.
translation_notes:
  register: Современный литературный русский с достоинством новозаветного увещевания. Причастный оборот со строчной буквы сохраняет синтаксическую связь со стихом 1:27. Тире подчёркивают параллель «для них — …, для вас — …» без добавления отсутствующего в греческом сказуемого.
