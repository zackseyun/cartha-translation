lexical_decisions:
- source_word: πάντοτε
  choice: всегда
  rationale: Прямо передаёт временную всеохватность греческого наречия.
- source_word: ἐν πάσῃ δεήσει μου
  choice: во всякой моей молитве
  rationale: Естественное русское выражение, сохраняющее значение каждого отдельного молитвенного обращения; «δέησις» обозначает просьбу или моление, но здесь по-русски уместно общее «молитва».
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: за всех вас
  rationale: Передаёт направленность молитвы на благо адресатов и сохраняет повтор всеохватности.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Точное и естественное соответствие обстоятельственному обороту.
- source_word: τὴν δέησιν ποιούμενος
  choice: молясь
  rationale: Русский деепричастный оборот естественно передаёт греческую конструкцию «совершая молитву», не создавая тяжеловесного повтора.
