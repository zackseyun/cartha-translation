  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: ru
  text: 'Но я разрываюсь между двумя: желаю отойти[a] и быть с Мессией[b], ведь это гораздо лучше.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умереть». Буквально: «отойти».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Христом». Греческое слово означает «Помазанник».'
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέχομαι δὲ ἐκ τῶν δύο
  choice: Но я разрываюсь между двумя
  rationale: Оборот передаёт состояние человека, которого одновременно теснят две возможности. «Разрываюсь между двумя» естественно выражает внутреннее напряжение и сохраняет указание на две альтернативы.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: желаю
  rationale: Причастный оборот с существительным «желание» естественно и без смысловой потери передан русским личным глаголом; более буквальное «имея желание» звучало бы тяжеловесно.
- source_word: ἀναλῦσαι
  choice: отойти
  rationale: Глагол буквально обозначает уход или отбытие и здесь эвфемистически указывает на смерть. «Отойти» сохраняет образность греческого текста, не заменяя её прямым толкованием.
- source_word: Χριστῷ
  choice: Мессией
  rationale: Χριστός здесь сохраняет значение титула — «Помазанник». «Мессия» передаёт титульный смысл; традиционное «Христос» приведено в примечании.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: ведь это несравненно лучше
  rationale: Греческое сочетание предельно усиливает сравнительную степень. «Несравненно лучше» естественно передаёт эту эмфазу в современном литературном русском языке.
theological_decisions:
- issue: Общение с Мессией после смерти
  choice: отойти и быть с Мессией
  alternative: умереть и сразу отправиться на небеса к Христу
  rationale: 'Перевод сохраняет только то, что прямо сказано по-гречески: уход и пребывание с Мессией. Он не добавляет описания места, способа или хронологии посмертного состояния.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка остаётся ясной для широкого читателя; двоеточие делает связь желания Павла с двумя упомянутыми возможностями прозрачной, не устраняя напряжения между ними.
