  source_fidelity: 'Основной смысл передан точно: Павел находится в напряжении между двумя возможностями, желает «отойти» и быть с Мессией. «Разрываюсь между двумя» — естественная русская передача συνέχομαι ... ἐκ τῶν δύο и не требует экспликации второй возможности, которая раскрывается в следующем стихе. Однако «несравненно лучше» несколько усиливает греческое πολλῷ μᾶλλον κρεῖσσον до оттенка несопоставимости; «гораздо лучше» точнее передаёт усиленную сравнительную степень.'
