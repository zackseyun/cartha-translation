lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью естественно для современного русского текста.
- source_word: οὐδένα … ἔχω
  choice: у меня нет никого
  rationale: Естественная русская конструкция, точно передающая отрицание и значение глагола ἔχω в данном контексте.
- source_word: ἰσόψυχον
  choice: столь близкого мне по духу
  rationale: Передаёт редкое сложное прилагательное со значением душевного единства и сходства внутренних устремлений; местоимение «мне» проясняет подразумеваемое сопоставление с Павлом, не превращая его в доктринальное толкование.
- source_word: ὅστις
  choice: кто
  rationale: Естественно вводит характеристику такого человека и сохраняет относительную конструкцию.
- source_word: γνησίως
  choice: искренне
  rationale: Передаёт подлинность и неподдельность заботы без оттенка простой истинности утверждения.
- source_word: τὰ περὶ ὑμῶν
  choice: о вашем благе
  rationale: Идиоматично выражает заботу об обстоятельствах, нуждах и интересах адресатов; более буквальная широта отмечена в сноске.
- source_word: μεριμνήσει
  choice: позаботится
  rationale: Будущее время сохранено; в контексте глагол означает положительную деятельную заботу, а не предосудительную тревогу.
theological_decisions:
- issue: Оттенок значения μεριμνάω
  choice: позаботится
  alternative: будет тревожиться
  rationale: Контекст говорит о пастырской заботе Тимофея, поэтому отрицательный оттенок тревоги здесь не навязывается.
- issue: Подразумеваемое сравнение в ἰσόψυχον
  choice: близкого мне по духу
  alternative: единодушного
  rationale: Формулировка обозначает близость Тимофея Павлу по внутреннему настрою, сохраняя образность слова и не сводя её лишь к совпадению мнений.
translation_notes:
