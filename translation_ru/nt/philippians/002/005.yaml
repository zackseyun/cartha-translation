lexical_decisions:
- source_word: τοῦτο
  choice: такой
  rationale: Указательное местоимение отсылает вперёд, к образу мыслей, раскрываемому в последующих стихах; «такой» естественно передаёт эту направленность в русском предложении.
- source_word: φρονεῖτε
  choice: пусть у вас будет … образ мыслей
  rationale: Глагол обозначает не единичную мысль, а устойчивую направленность мышления и внутреннюю установку; конструкция сохраняет побудительную силу настоящего императива.
- source_word: ἐν ὑμῖν
  choice: у вас
  rationale: Местоимение стоит во множественном числе, а контекст обращён ко всей общине; русское «у вас» допускает как совместный, так и личный аспект, не сводя призыв только к отдельному человеку.
- source_word: ὃ καὶ
  choice: какой был и
  rationale: Связка соотносит требуемый образ мыслей с образом мыслей Иисуса. Добавленное по смыслу «был» делает эллиптическую греческую конструкцию ясной по-русски, а «и» передаёт καί.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: у Мессии Иисуса
  rationale: При избранном прочтении оборот указывает на образ мыслей, проявившийся в Иисусе. Χριστός передано как титул «Мессия», а не как непрозрачное заимствование.
theological_decisions:
- issue: Оборот может указывать либо на образ мыслей, явленный Иисусом как пример, либо на образ мыслей верующих в их единении с ним.
  choice: 'Примерное прочтение: «какой был и у Мессии Иисуса».'
  alternative: 'Причастностное прочтение: «который есть у вас и в Мессии Иисусе».'
  rationale: Непосредственный контекст далее описывает самоумаление Иисуса как образец для общины, что поддерживает примерное прочтение. Однако сжатый греческий оборот допускает понимание через пребывание верующих в Мессии, поэтому эта возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка обращена к общине и избегает как излишне церковнославянского «мудрствуйте», так и разговорного «настрой».
