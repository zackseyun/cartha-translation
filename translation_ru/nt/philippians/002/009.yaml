id: PHP.2.9
reference: Philippians 2:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: ru
  text: Поэтому Бог и превознёс Его и даровал Ему имя, которое выше всякого имени.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милостиво дал Ему».'
    reason: lexical_alternative
  - marker: b
    text: «Имя» может обозначать не только произносимое имя, но также достоинство, положение или титул; в самом этом стихе не уточняется, какое именно имя имеется в виду.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Поэтому ... и
  rationale: «Поэтому» передаёт выводное значение διό, а «и» — добавочное значение καί; такой порядок естественен для современного русского языка.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Подлежащее в греческом тексте выражено явно и определённо; в русском именование Бога обычно употребляется без артикля.
- source_word: ὑπερύψωσεν
  choice: превознёс
  rationale: Глагол передаёт усиленное значение ὑπερ- и сохраняет возвышенный, но понятный библейский регистр. Вариант «возвысил превыше всего» был бы более разъясняющим и добавлял бы отсутствующее в тексте дополнение.
- source_word: ἐχαρίσατο
  choice: даровал
  rationale: «Даровал» естественно передаёт благосклонное, незаслуженно данное дарение, связанное с χάρις, не требуя тяжеловесного «милостиво дал».
- source_word: τὸ ὄνομα
  choice: имя
  rationale: Греческий текст прямо говорит об «имени»; перевод не сужает смысл до титула или положения.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: которое выше всякого имени
  rationale: Сохраняется сравнительная конструкция с ὑπέρ и πᾶν, при этом фраза звучит естественно по-русски.
theological_decisions:
- issue: Какое именно «имя» имеется в виду
  choice: В основном тексте оставлено просто «имя», без уточнения.
  alternative: Явно назвать имя «Иисус» либо титул «Господь», опираясь на Флп 2:10–11.
  rationale: Сам стих 2:9 не называет это имя; перевод сохраняет открытость текста и не переносит толкование последующих стихов в основной текст.
- issue: Смысл возвышения Христа
  choice: Сохранён глагол «превознёс» без поясняющего дополнения.
  alternative: «Возвысил до наивысшего положения» или «возвысил превыше всего».
  rationale: Греческий глагол выражает предельное возвышение, но не содержит отдельного дополнения «положение» или «всё»; перевод не конкретизирует способ и сферу возвышения.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. «Превознёс» несколько возвышенно, но прозрачно и точно передаёт усиленный греческий глагол; местоимения, относящиеся ко Христу, написаны с прописной буквы по принятой русской библейской издательской традиции. Маркеры сносок размещены после соответствующего предложения.
