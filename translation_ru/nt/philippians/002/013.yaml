  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: ru
  text: Ведь именно Бог производит в вас и желание, и действие ради Своего благоволения[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и желать, и действовать».'
