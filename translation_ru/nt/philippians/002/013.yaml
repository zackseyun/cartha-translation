  - marker: b
    text: 'Или: «по Своему благоволению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Ведь
  rationale: Передаёт пояснительное обоснование предыдущего призыва и естественно связывает стих с контекстом.
- source_word: ὁ ἐνεργῶν
  choice: это Бог производит
  rationale: Конструкция с артиклем и причастием выделяет Бога как действующего; оборот «это Бог» сохраняет эмфазу, а «производит» — действенную причинность настоящего причастия.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Сохраняет возможность как личного, так и общинного понимания множественного числа, не сужая смысл до одного из них.
- source_word: τὸ θέλειν
  choice: желание
  rationale: Передаёт волевой смысл субстантивированного инфинитива современным и понятным русским словом.
- source_word: τὸ ἐνεργεῖν
  choice: действие
  rationale: Сохраняет параллельную именную форму с «желание» и обозначает осуществление на деле, не добавляя идеи одной лишь способности действовать.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: ради Своего благоволения
  rationale: Передаёт наиболее естественный здесь целевой оттенок ὑπέρ с родительным падежом; местоимение «Своего» явно соотносит благоволение с Богом, как подразумевает контекст.
theological_decisions:
- issue: Божественное действие и человеческие желание и действие
  choice: «Бог производит в вас и желание, и действие»
  alternative: «Бог даёт вам и желать, и действовать»
  rationale: Основной текст прямо относит к Божьему действию и волю, и осуществление, не ослабляя ни одной стороны и не объясняя их соотношение в рамках отдельной богословской системы.
- issue: Значение ὑπὲρ τῆς εὐδοκίας
  choice: «ради Своего благоволения»
  alternative: «по Своему благоволению»
  rationale: Основной вариант сохраняет вероятный оттенок цели или направленности, а примечание предоставляет традиционно возможное понимание основания или соответствия.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формулировка «Ведь это Бог» естественно передаёт греческое смысловое выделение; «благоволение» сохранено как точный и укоренённый богословский термин. Все местоимения, относящиеся к Богу, оформлены в принятой для данного регистра почтительной орфографии.
