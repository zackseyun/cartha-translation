  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: ru
  text: чтобы вам стать безупречными и чистыми, непорочными детьми Божьими среди строптивого и развращённого поколения[b], в котором вы сияете[a], словно светила в мире.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы видны как светила».'
    reason: lexical_alternative
  - marker: b
    text: Слова «строптивое и развращённое поколение», вероятно, перекликаются со Второзаконием 32:5, противопоставляя детей Божьих испорченному поколению.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: чтобы вам стать
  rationale: Передаёт целевое значение ἵνα и динамический смысл γίνομαι — «стать», а не только «быть».
- source_word: ἄμεμπτοι καὶ ἀκέραιοι
  choice: безупречными и чистыми
  rationale: «Безупречными» выражает отсутствие повода для обвинения, а «чистыми» — нравственную цельность и неиспорченность; различие между прилагательными сохраняется.
- source_word: τέκνα θεοῦ ἄμωμα
  choice: непорочными детьми Божьими
  rationale: Ἄμωμα непосредственно характеризует «детей Божьих». «Непорочными» сохраняет образ отсутствия изъяна и не повторяет уже употреблённое «безупречными».
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: среди строптивого и развращённого поколения
  rationale: «Среди» естественно передаёт положение верующих внутри окружающего поколения. «Строптивого и развращённого» сохраняет нравственную оценку и ветхозаветное звучание, не ограничивая смысл современными ассоциациями слова «извращённый».
- source_word: ἐν οἷς
  choice: в котором
  rationale: Относительное местоимение соотнесено с собирательным «поколением»; по-русски такая конструкция звучит естественно и сохраняет смысл пребывания в его среде.
- source_word: φαίνεσθε
  choice: вы сияете
  rationale: В сочетании с φωστῆρες наиболее вероятен световой смысл глагола. Возможное значение «видны/являетесь» отмечено в сноске.
- source_word: ὡς φωστῆρες ἐν κόσμῳ
  choice: словно светила в мире
  rationale: «Светила» передаёт φωστῆρες как источники света, возможно небесные, не сужая значение до звёзд; «в мире» естественно передаёт ἐν κόσμῳ.
theological_decisions:
- issue: Связь определения ἄμωμα с выражением τέκνα θεοῦ и отзвук Второзакония 32:5
  choice: «непорочными детьми Божьими»; аллюзия пояснена только в сноске
  alternative: Отнести «непорочными» ко всему ряду качеств или сделать отсылку ко Второзаконию явной в основном тексте
  rationale: Порядок и синтаксис греческого текста естественно связывают ἄμωμα с «детьми Божьими», тогда как скрытый межтекстовый контраст не следует превращать в прямую цитату.
- issue: Значение φαίνεσθε рядом с φωστῆρες
  choice: «сияете»
  alternative: «видны» или «являетесь» как светила
  rationale: Контекст света поддерживает значение «сиять», но лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Слова «строптивого», «непорочными» и «светила» понятны современному читателю и сохраняют образность и межтекстовый оттенок оригинала.
