  text: Так же и вы радуйтесь и радуйтесь вместе со мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: Так же
  rationale: Оборот τὸ αὐτό употреблён наречно и указывает на ту же ответную радость, о которой говорится в предыдущем стихе; «так же» естественно передаёт эту связь. Частица δέ обозначает переход и в данном контексте не требует отдельного противительного союза.
- source_word: χαίρετε
  choice: радуйтесь
  rationale: Форма настоящего времени повелительного наклонения, 2-го лица множественного числа. «Радуйтесь» сохраняет прямой призыв и повторяющуюся в Послании тему радости.
- source_word: συγχαίρετέ
  choice: радуйтесь вместе
  rationale: Сложный глагол выражает совместную радость. Повтор корня «радуйтесь» воспроизводит связь χαίρετε и συγχαίρετε в греческом тексте.
- source_word: μοι
  choice: со мной
  rationale: Дательный падеж обозначает человека, вместе с которым адресаты призваны радоваться; по-русски это естественно передаётся сочетанием «со мной».
