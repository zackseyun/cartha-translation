lexical_decisions:
- source_word: σκοποῦντες
  choice: пусть заботится
  rationale: Причастие передаёт направленное внимание к делам и нуждам; в русском увещевательном контексте «пусть заботится» естественно выражает практическую направленность, не сводя смысл к простому наблюдению.
- source_word: τὰ ἑαυτῶν
  choice: о своих интересах
  rationale: Субстантивированное сочетание среднего рода множественного числа обозначает не только имущество, но шире — собственные дела, нужды и интересы.
- source_word: ἕκαστοι
  choice: каждый
  rationale: 'Сохраняет распределительное значение: наставление относится к каждому человеку в общине.'
- source_word: ἀλλὰ καὶ
  choice: не только… но и
  rationale: Хотя в греческом первая часть выражена через простое отрицание, русская соотносительная конструкция естественно передаёт сочетание противопоставления и добавления.
- source_word: τὰ ἑτέρων
  choice: об интересах других
  rationale: Параллельно τὰ ἑαυτῶν выражение охватывает дела, нужды и благо других людей, а не только принадлежащие им вещи.
