  terminology: «В Господе» верно сохраняет краткую и намеренно ёмкую формулу оригинала. «Таких людей» естественно передаёт мужскую форму множественного числа без неоправданного ограничения адресатов; сноска корректно отмечает грамматический род исходного выражения.
