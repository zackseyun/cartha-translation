  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: выводное οὖν («Итак»), повеление προσδέχεσθε («примите»), устойчивую павловскую формулу ἐν κυρίῳ («в Господе»), полноту радости в μετὰ πάσης χαρᾶς («с полной радостью») и обобщающее τοὺς τοιούτους («таких людей»). «Считайте достойными почёта» адекватно выражает призыв ἐντίμους ἔχετε относиться к таким людям как к почитаемым.'
