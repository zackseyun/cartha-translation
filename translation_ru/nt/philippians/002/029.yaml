  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: ru
  text: Итак, примите его в Господе с полной радостью и таких людей[a] считайте достойными почёта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таких мужчин». В греческом здесь употреблено выражение мужского рода во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: примите
  rationale: Повелительная форма призывает общину радушно принять Епафродита; в сочетании «с полной радостью» глагол «примите» естественно передаёт этот смысл без избыточного пояснения.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего наставления и естественно связывает стихи в современном русском тексте.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет ёмкую формулу Павла и её намеренно широкий духовный и общинный смысл без истолковывающего перифраза.
- source_word: μετὰ πάσης χαρᾶς
  choice: с полной радостью
  rationale: Передаёт полноту, выраженную πάσης, и звучит естественнее по-русски, чем буквальное «со всякой радостью».
- source_word: τοὺς τοιούτους
  choice: таких людей
  rationale: Передаёт указание на людей такого рода, примером которых служит Епафродит, не сужая выражение до одной конкретной группы сверх того, что требует контекст.
- source_word: ἐντίμους ἔχετε
  choice: считайте достойными почёта
  rationale: Отражает значение признания таких людей почитаемыми и достойными уважения; формулировка ясна и избегает возможной двусмысленности глагола «почитать».
theological_decisions:
- issue: Смысл выражения ἐν κυρίῳ
  choice: в Господе
  alternative: как брата в Господе
  rationale: Более краткий вариант сохраняет многозначность Павловой формулы и не сводит её только к братскому статусу Епафродита.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксис близок к оригиналу, но «с полной радостью» и «считайте достойными почёта» выбраны ради естественности и ясности.
