lexical_decisions:
- source_word: ἐπειδὴ
  choice: поскольку
  rationale: Союз вводит причину, объясняющую решение послать Епафродита; «поскольку» естественно связывает этот стих с предыдущим контекстом.
- source_word: ἐπιποθῶν ἦν
  choice: он тосковал
  rationale: Перифрастическая конструкция с причастием настоящего времени и имперфектом передаёт продолжительное состояние в прошлом; русский несовершенный вид сохраняет эту длительность.
- source_word: πάντας ὑμᾶς
  choice: по всем вам
  rationale: Сохраняет явное πάντας — чувство Епафродита обращено ко всей общине без исключения.
- source_word: ἀδημονῶν
  choice: глубоко переживал
  rationale: Передаёт сильное душевное беспокойство, а не просто лёгкую озабоченность, и звучит естественно в современном литературном русском.
- source_word: διότι
  choice: из-за того, что
  rationale: Ясно выражает причину его тяжёлого переживания и естественно сочетается с русской конструкцией.
- source_word: ἠκούσατε
  choice: вы услышали
  rationale: Форма второго лица множественного числа прямо означает, что весть получили филиппийцы; перевод следует представленному греческому тексту.
- source_word: ὅτι ἠσθένησεν
  choice: о его болезни
  rationale: 'ἀσθενέω в контексте обозначает физическую болезнь. Именная русская конструкция точно и естественно передаёт, что община узнала: Епафродит заболел.'
