source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: ru
  text: Но я надеюсь в Господе Иисусе вскоре послать к вам Тимофея, чтобы и я ободрился, узнав, как ваши дела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «узнав о том, что касается вас».'
    reason: Более буквальная передача τὰ περὶ ὑμῶν сохраняет широкое указание на обстоятельства адресатов.
lexical_decisions:
- source_word: Ἐλπίζω
  choice: я надеюсь
  rationale: Настоящее время передаёт нынешнюю надежду и ожидание Павла; это прямой и естественный русский эквивалент.
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий переход с оттенком противопоставления предшествующему контексту.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: в Господе Иисусе
  rationale: 'Сохраняет характерную для Павла формулировку: его надежда существует в связи с Господом Иисусом и в зависимости от Него.'
- source_word: Τιμόθεον
  choice: Тимофея
  rationale: Использована традиционная русская форма личного имени в требуемом падеже.
- source_word: ταχέως
  choice: вскоре
  rationale: В данном контексте наречие указывает прежде всего на близкое время отправления, а не на скорость действия.
- source_word: πέμψαι ὑμῖν
  choice: послать к вам
  rationale: Естественно передаёт инфинитив и дательный адресата; применительно к человеку по-русски уместно «к вам».
- source_word: ἵνα κἀγὼ εὐψυχῶ
  choice: чтобы и мне ободриться
  rationale: Сохраняет целевое значение ἵνα, усилительное «и» в κἀγώ и смысл редкого глагола εὐψυχέω — прийти в хорошее расположение духа.
- source_word: γνοὺς τὰ περὶ ὑμῶν
  choice: узнав, как ваши дела
  rationale: Причастие передано деепричастием, а идиоматическое τὰ περὶ ὑμῶν — естественной русской формулой о положении и обстоятельствах адресатов; более буквальная форма приведена в сноске.
theological_decisions:
- issue: Передача κύριος в выражении ἐν κυρίῳ Ἰησοῦ
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — закреплённый и контекстуально точный русский эквивалент новозаветного христологического титула; оснований заменять его более узким вариантом нет.
- issue: Характер надежды Павла в выражении ἐν κυρίῳ Ἰησοῦ
  choice: Сохранить «в Господе Иисусе» без поясняющей перифразы
  alternative: «полагаясь на Господа Иисуса»
  rationale: Буквенная конструкция сохраняет возможную широту смысла — зависимость, единение и обусловленность волей Господа — не сводя её к одной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского письма. «Вскоре» несколько возвышеннее разговорного «скоро», а «как ваши дела» естественно передаёт идиому без канцелярской тяжеловесности. Маркер сноски поставлен непосредственно после относящейся к нему заключительной фразы.
