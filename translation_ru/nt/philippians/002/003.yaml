review_pass:
  verdict: approve
  source_fidelity: «Ничего не делайте» точно передаёт μηδέν в увещевательном контексте. «Из своекорыстия» адекватно передаёт κατ᾽ ἐριθείαν как действие из эгоистического, корыстного побуждения, не ограничивая его лишь соперничеством. «Тщеславие» удачно соответствует κενοδοξία. «В смирении считайте других выше себя» передаёт датив образа действия, оценочный смысл ἡγούμενοι и сравнительное ὑπερέχοντας ἑαυτῶν, не навязывая конкретный вид превосходства.
  naturalness: Текст краток, ясен и естествен для современного литературного русского, сохраняя наставительный ритм. «Своекорыстие» имеет несколько книжный, но понятный и уместный для послания регистр; конструкция «считайте других выше себя» нормативна и не тяжеловесна.
  terminology: «Смирение» — устоявшееся и точное соответствие ταπεινοφροσύνη. «Тщеславие» передаёт идею пустого самовозвеличивания. Формулировка «выше себя» намеренно сохраняет семантическую широту ὑπερέχοντας и не превращает нравственный призыв в утверждение об онтологическом статусе людей.
