id: PHP.2.3
reference: Philippians 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: ru
  text: Ничего не делайте из своекорыстия или тщеславия, но в смирении считайте других выше себя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считайте других превосходящими вас»; также возможно: «важнее себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Ничего не делайте
  rationale: В контексте наставления эллиптическая греческая конструкция естественно передаётся по-русски как запрещение.
- source_word: κατ’ ἐριθείαν
  choice: из своекорыстия
  rationale: Передаёт мотив корыстного самоутверждения и личной выгоды, присущий ἐριθεία, не сводя значение лишь к открытому соперничеству.
- source_word: κατὰ κενοδοξίαν
  choice: или тщеславия
  rationale: Естественное современное соответствие для пустого стремления к славе и самовозвышению; буквальный образ «пустой славы» сохраняется в смысловом объёме слова.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: в смирении
  rationale: Дательный падеж выражает образ действия или внутреннюю установку; формулировка естественна и сохраняет этический смысл.
- source_word: ἀλλήλους ἡγούμενοι
  choice: считайте других
  rationale: ἡγέομαι здесь обозначает осознанную оценку, а ἀλλήλους — взаимное отношение внутри общины; «других» звучит естественнее буквального «друг друга» при сравнении с собой.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: выше себя
  rationale: Кратко сохраняет сравнительный смысл «превосходящих вас» и не уточняет без необходимости, идёт ли речь о важности, достоинстве или положении.
theological_decisions:
- issue: Характер превосходства других в выражении ὑπερέχοντας ἑαυτῶν
  choice: выше себя
  alternative: важнее себя / превосходящими себя
  rationale: Греческий текст не уточняет вид превосходства. «Выше себя» сохраняет эту открытость и передаёт призыв к смиренной оценке, не утверждая онтологического превосходства каждого человека.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным ритмом. «Своекорыстие» несколько возвышенно, но понятно и точнее передаёт мотив ἐριθεία, чем более узкое «соперничество». Единственный маркер [a] присутствует в основном тексте.
