  source_fidelity: 'Перевод точно передаёт синтаксическое движение и основные лексические соответствия греческого текста: сильное противопоставление («но»), рефлексивное «опустошил себя», «образ раба», становление в подобии людей и различение внешнего вида в заключительном обороте. «Став подобным людям» — естественная русская передача ἐν ὁμοιώματι ἀνθρώπων γενόμενος, не превращающая подобие в простую видимость. «По виду оказавшись человеком» адекватно отражает σχήματι εὑρεθεὶς ὡς ἄνθρωπος, хотя русский оборот несколько более свободен, чем греческий пассив.'
