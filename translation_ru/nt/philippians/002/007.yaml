reference: Philippians 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ ἑαυτὸν ἐκένωσεν μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/007.yaml
  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: ru
  text: но опустошил себя[a], приняв образ раба[b], став подобным людям[c]; и по виду оказавшись человеком[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал себя ничем». Глагол также может выражать самоумаление; текст не говорит, что Христос перестал обладать какими-либо божественными свойствами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «невольника». Греческое слово обозначает человека, находящегося в рабском подчинении; «слуга» передаёт его мягче.'
    reason: lexical_alternative
  - marker: c
    text: 'Букв.: «став в подобии людей». Слово «подобие» здесь само по себе не означает, что человечность была лишь кажущейся.'
    reason: source_clarification
  - marker: d
    text: 'Греческое слово имеет здесь общее значение: «человеком», а не специально «мужчиной». Возможен перевод: «оказавшись по внешнему облику как человек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт сильное противопоставление предыдущей мысли и естественно связывает этот фрагмент с контекстом.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: опустошил себя
  rationale: Сохраняет метафору κενόω и не уточняет сверх текста, чего именно Христос себя лишил. Последующие причастные обороты показывают, как совершилось это самоумаление.
- source_word: μορφὴν δούλου λαβών
  choice: приняв образ раба
  rationale: «Образ» сохраняет соответствие μορφή в ближайшем контексте, а «раб» передаёт несвободное положение δοῦλος сильнее, чем более мягкое «слуга».
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: став подобным людям
  rationale: Естественно передаёт становление (γενόμενος), подобие (ὁμοίωμα) и родовое множественное ἀνθρώπων, не сводя подобие к одной лишь видимости.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: по виду оказавшись человеком
  rationale: «По виду» передаёт явленный, распознаваемый облик σχῆμα и отличает его от ранее употреблённого μορφή; «человек» здесь имеет родовое, а не гендерно-ограниченное значение.
theological_decisions:
- issue: Смысл выражения ἑαυτὸν ἐκένωσεν в христологическом контексте
  choice: Сохранить метафору «опустошил себя», позволяя следующим оборотам раскрывать образ действия.
  alternative: «Уничижил себя»; «сделал себя ничем»; явное утверждение об отказе от божественных свойств.
  rationale: Греческий текст не называет содержимое «опустошения». Буквенная метафора сохраняет богословское напряжение и не вводит определённую кенотическую теорию.
- issue: Значение ὁμοίωμα применительно к человечеству Христа
  choice: Передать как «подобным людям», не истолковывая это как мнимую человечность.
  alternative: «Лишь казавшись человеком» либо более сильное отождествление, устраняющее особую формулировку Павла.
  rationale: Перевод сохраняет слово о подобии, но не добавляет идеи, будто человечность была только внешней видимостью.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены различие между μορφή («образ») и σχῆμα («вид»), метафора самоопустошения и смысловая напряжённость слова «подобие». Местоимение «себя» дано со строчной буквы согласно нейтральной современной издательской норме.
