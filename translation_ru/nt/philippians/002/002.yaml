id: PHP.2.2
reference: Philippians 2:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: ru
  text: Сделайте мою радость полной, чтобы вы мыслили одинаково, имели одну и ту же любовь, были единодушны[a] и мыслили об одном[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были одной душой»; возможный перевод: «были едины душой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стремились к одной цели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαράν
  choice: сделайте мою радость полной
  rationale: Передаёт повеление довести радость Павла до полноты, сохраняя образ наполнения и звуча естественно по-русски.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит содержание и ожидаемый результат призыва, не устраняя возможный оттенок цели.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: вы мыслили одинаково
  rationale: φρονέω обозначает не только отдельную мысль, но образ мышления и внутреннюю направленность; «мыслили одинаково» сохраняет призыв к единству и повтор ключевого глагола далее в стихе.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: имели одну и ту же любовь
  rationale: Близко передаёт греческую причастную конструкцию и повтор αὐτός, не уточняя без основания ни объект, ни источник любви.
- source_word: σύμψυχοι
  choice: были единодушны
  rationale: Естественное современное соответствие сложному прилагательному со значением общей душевной настроенности; образ души отмечен в сноске.
- source_word: τὸ ἓν φρονοῦντες
  choice: мыслили об одном
  rationale: Сохраняет буквальную направленность на «одно» и повтор φρονέω, не сводя выражение исключительно к одной практической цели.
theological_decisions:
- issue: Степень единства, выраженная повтором φρονέω
  choice: «мыслили одинаково … мыслили об одном»
  alternative: «были одних мыслей … стремились к одной цели»
  rationale: Выбранный вариант сохраняет лексический повтор и риторическое усиление греческого текста, но не превращает призыв к единству в утверждение о полном единообразии всех мнений.
- issue: Значение σύμψυχοι
  choice: «были единодушны» с буквальной альтернативой в сноске
  alternative: «были одной душой» или «были едины духом»
  rationale: «Единодушны» естественно по-русски и сохраняет идею глубинного внутреннего единства; вариант «едины духом» мог бы неоправданно внести прямое указание на дух вместо ψυχή, а буквальный образ сохранён в сноске.
- issue: Значение τὸ ἓν в заключительной фразе
  choice: «мыслили об одном»
  alternative: «стремились к одной цели»
  rationale: Греческое выражение допускает целевую направленность, но прямо не называет «цель»; основной текст сохраняет эту смысловую открытость, а идиоматическая трактовка дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным глаголом «мыслить». Синтаксический ряд греческого текста сохранён, однако причастия переданы личными глагольными формами ради естественности русского выражения.
