id: PHP.2.1
reference: Philippians 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: ru
  text: Итак, если есть в Мессии какое-либо ободрение, если есть какое-либо утешение от любви, если есть какое-либо общение Духа[a], если есть какое-либо сердечное участие и сострадание,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «участие в Духе»; менее вероятно: «общность духа».'
    reason: Сочетание κοινωνία πνεύματος допускает разные способы понимания родительного падежа и, менее вероятно, отнесение πνεύματος к человеческому духу.
lexical_decisions:
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод и переход от предыдущего наставления, естественно связывая стих с контекстом.
- source_word: παράκλησις
  choice: ободрение
  rationale: В данном перечне слово обозначает укрепляющее и поддерживающее воздействие; «ободрение» не сужает значение ни до увещания, ни до одного лишь утешения.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Сохраняет значение титула Χριστός и обычную для Павла формулу пребывания «в Мессии».
- source_word: παραμύθιον
  choice: утешение
  rationale: Передаёт смысл успокаивающей, утешающей поддержки и сохраняет отличие от παράκλησις, переведённого как «ободрение».
- source_word: ἀγάπης
  choice: от любви
  rationale: 'Естественно передаёт вероятное значение источника: утешение, исходящее от любви, не перегружая основной текст буквальной конструкцией «утешение любви».'
- source_word: κοινωνία
  choice: общение
  rationale: Передаёт общность и совместную причастность; неоднозначное отношение к πνεύματος сохранено с помощью примечания.
- source_word: πνεύματος
  choice: Духа
  rationale: Наиболее вероятна ссылка на Святого Духа, однако компактная греческая конструкция допускает и иные способы понимания, указанные в примечании.
- source_word: σπλάγχνα
  choice: сердечная привязанность
  rationale: Идиоматически передаёт глубокое внутреннее расположение, избегая анатомической буквальности.
- source_word: οἰκτιρμοί
  choice: сострадание
  rationale: Современное и ясное обозначение милосердного сочувствия; естественно сочетается с «сердечной привязанностью».
- source_word: τις / τι
  choice: хоть какое-нибудь / хоть какая-нибудь
  rationale: Передаёт повторяющуюся условную формулу и оттенок «если есть что-либо», сохраняя риторическое нарастание.
theological_decisions:
- issue: Относится ли πνεύματος к Святому Духу и как понимать родительный падеж при κοινωνία
  choice: общение Духа
  alternative: участие в Духе; менее вероятно — общность духа
  rationale: В контексте Павловых христианских оснований единства наиболее вероятна ссылка на Святого Духа. При этом греческая конструкция не уточняет однозначно характер связи, поэтому альтернативы сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «если есть хоть какое-нибудь» сохраняет риторическую структуру греческого текста. Конечная запятая показывает, что условное предложение продолжается в следующем стихе.
