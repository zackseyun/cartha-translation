revisions:
- from: Итак, если есть хоть какое-нибудь ободрение в Мессии, если есть хоть какое-нибудь утешение от любви, если есть хоть какое-нибудь общение Духа[a], если есть хоть какая-нибудь сердечная привязанность и сострадание,
  to: Итак, если есть в Мессии какое-либо ободрение, если есть какое-либо утешение от любви, если есть какое-либо общение Духа[a], если есть какое-либо сердечное участие и сострадание,
  rationale: Убрано не требуемое оригиналом усиление «хоть», а «сердечная привязанность» заменена на более широкое и контекстуально точное «сердечное участие». Сохранены риторический повтор, титул «Мессия», вероятное отнесение к Святому Духу и конечная запятая, поскольку условное предложение продолжается в следующем стихе.
