  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: ru
  text: Ведь все ищут своего, а не того, что относится к Иисусу Христу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πάντες
  choice: все
  rationale: Субстантивированное сочетание обозначает всех людей, о которых идёт речь; краткое «все» естественно по-русски и сохраняет обобщающий акцент.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего утверждения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: τὰ ἑαυτῶν
  choice: своего
  rationale: Субстантивированное среднее множественного числа широко обозначает всё относящееся к самим людям — их дела, заботы и интересы. Русское «искать своего» сохраняет ёмкость выражения и его нравственный оттенок.
- source_word: ζητοῦσιν
  choice: ищут
  rationale: Прямое соответствие глаголу ζητέω, пригодное для обеих сторон противопоставления; в сочетании «ищут своего» означает стремление к собственным интересам.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: того, что угодно Иисусу Христу
  rationale: Эллиптическое выражение буквально означает «того, что относится к Иисусу Христу». Развёрнутая русская формулировка естественно передаёт направленность на его волю и дело, не сводя смысл только к выгоде или интересам.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисусу Христу
  alternative: Иисусу Мессии
  rationale: В русском литературном и библейском употреблении «Иисус Христос» — устойчивое сочетание, при этом слово «Христос» сохраняет мессианский титул и не воспринимается просто как фамилия.
- issue: Смысл эллипсиса τὰ Ἰησοῦ Χριστοῦ
  choice: того, что угодно Иисусу Христу
  alternative: интересов Иисуса Христа / того, что принадлежит Иисусу Христу
  rationale: Греческая конструкция допускает широкий смысл — дела, воля и интересы Иисуса Христа. Выбранный вариант читается естественно и сохраняет этическое противопоставление, не внося конфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный по тону. Сохранены причинная связь с предыдущим стихом и резкое противопоставление между собственным и Христовым.
