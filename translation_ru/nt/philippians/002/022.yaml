lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий контраст с упомянутыми ранее людьми и естественно связывает стих с контекстом.
- source_word: δοκιμὴν αὐτοῦ γινώσκετε
  choice: вы знаете, как он показал себя
  rationale: Естественно по-русски передаёт мысль о качествах Тимофея, подлинность которых была обнаружена испытанием и подтверждена опытом.
- source_word: ὡς πατρὶ τέκνον
  choice: как ребёнок с отцом
  rationale: Сохраняет семейное сравнение и не сужает нейтральное τέκνον до значения «сын».
- source_word: σὺν ἐμοὶ ἐδούλευσεν
  choice: он служил вместе со мной
  rationale: Передаёт совместное служение и глагол из группы δοῦλος без неестественного для данного контекста буквального «рабствовал».
- source_word: εἰς τὸ εὐαγγέλιον
  choice: делу Благой вести
  rationale: Выражает направленность совместного служения на возвещение Евангелия и звучит естественно в современном русском языке.
