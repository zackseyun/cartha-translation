  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: ru
  text: 'Но вы знаете, как он проявил себя[a]: подобно тому как ребёнок служит отцу, он служил вместе со мной ради Благой вести.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы знаете его испытанность»; речь идёт о качествах, подлинность которых была доказана испытанием.'
