lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: смирил
  rationale: Передаёт активное и добровольное самоуничижение естественным для современного русского языка глаголом.
- source_word: ἑαυτὸν
  choice: себя
  rationale: Сохраняет явно выраженное возвратное местоимение и акцент на добровольности действия.
- source_word: γενόμενος
  choice: став
  rationale: Естественно передаёт причастную конструкцию и показывает, в чём выразилось смирение, не навязывая излишне строгой временной последовательности.
- source_word: ὑπήκοος
  choice: послушным
  rationale: Прямой и понятный эквивалент, сохраняющий смысл повиновения.
- source_word: μέχρι θανάτου
  choice: до смерти
  rationale: Кратко и точно передаёт предел, до которого простиралось послушание; возможный оттенок «вплоть до смерти» отмечен в сноске.
- source_word: δὲ
  choice: причём
  rationale: В данном контексте вводит риторическое усиление и уточнение вида смерти, не превращая союз в отдельное богословское утверждение.
- source_word: σταυροῦ
  choice: на кресте
  rationale: Естественно раскрывает сжатую родительную конструкцию и ясно называет распятие как способ смерти.
theological_decisions:
- issue: Смысл заключительной фразы θανάτου δὲ σταυροῦ
  choice: 'Риторическое усиление: «причём смерти на кресте»'
  alternative: '«даже смерти на кресте»; буквально: «смерти же крестной»'
  rationale: Фраза не просто повторяет слово «смерть», а доводит высказывание до кульминации, указывая на смерть через распятие; перевод сохраняет усиление без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но не архаичная. Повтор слова «смерть» сохранён ради риторической структуры оригинала. Местоимение «себя» дано со строчной буквы по общим нормам русского языка, без внесения конфессиональной издательской традиции.
