lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результативное значение, связанное с предыдущим высказыванием, естественным для русского придаточным оборотом.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: перед именем Иисуса
  rationale: В контексте преклонения выражает почтительный отклик на имя и достоинство Иисуса. Возможное значение «во имя Иисуса» сохранено в сноске.
- source_word: πᾶν γόνυ
  choice: всякое колено
  rationale: Сохраняет яркий телесный образ всеобщего преклонения, не заменяя его отвлечённым словом «все».
- source_word: κάμψῃ
  choice: преклонилось
  rationale: Естественно сочетается с «колено» и передаёт жест поклонения; сослагательная форма после ἵνα выражена русской конструкцией с «чтобы».
- source_word: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: тех, кто на небе, на земле и под землёй
  rationale: Передаёт субстантивированные родительные прилагательные через естественное русское обозначение принадлежащих к трём космическим сферам, не уточняя их состав сверх сказанного в тексте.
theological_decisions:
- issue: Объём трёхчастного выражения ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων
  choice: Сохранён всеобщий космический охват — те, кто на небе, на земле и под землёй, — без уточнения их идентичности.
  alternative: Назвать их соответственно ангелами, людьми и умершими либо ангелами, людьми и демонами.
  rationale: Греческий текст подчёркивает универсальность преклонения перед Иисусом, но прямо не определяет состав каждой группы.
- issue: Значение ἐν τῷ ὀνόματι Ἰησοῦ
  choice: «перед именем Иисуса» как указание на почтительный отклик и преклонение.
  alternative: «во имя Иисуса» как указание на сферу, основание или власть, в которой совершается действие.
  rationale: Оба понимания допускаются конструкцией; основной текст следует непосредственному контексту преклонения, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Оборот «преклонилось всякое колено» сохраняет образ оригинала; пояснение «тех, кто…» делает греческие субстантивированные прилагательные понятными и не снимает намеренной неопределённости относительно обитателей трёх сфер.
