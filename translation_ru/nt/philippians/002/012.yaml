source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: ru
  text: Итак, мои возлюбленные, как вы всегда слушались — не только в моём присутствии, но теперь тем более в моё отсутствие, — со страхом и трепетом[b] совершайте своё спасение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Выражение «со страхом и трепетом» передаёт глубокую серьёзность, смирение и благоговейный трепет перед Богом; его сила не сводится ни к одному лишь уважению, ни обязательно к паническому ужасу.
    reason: lexical_alternative
  - marker: c
    text: «Совершайте» можно также передать как «осуществляйте» или «доводите до результата». Глагол призывает деятельно осуществлять спасение в жизни; сам по себе он не равнозначен выражению «зарабатывайте спасение».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает увещание с контекстом.
- source_word: ἀγαπητοί μου
  choice: мои возлюбленные
  rationale: Сохраняет тёплое пастырское обращение и достоинство оригинала.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: как вы всегда были послушны
  rationale: Естественно по-русски выражает устойчиво проявлявшееся прежде послушание без добавления не названного в тексте объекта.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: в моём присутствии / в моё отсутствие
  rationale: Ясно сохраняет параллель и противопоставление греческих существительных.
- source_word: πολλῷ μᾶλλον
  choice: гораздо более
  rationale: Передаёт усиленную сравнительную степень, не уточняя сверх текста, в чём именно должно сильнее проявляться послушание.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: со страхом и трепетом
  rationale: Сохраняет силу и традиционную образность выражения, не сводя его заранее ни к ужасу, ни к одному лишь почтению.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: своё спасение
  rationale: Передаёт как обычное богословское значение σωτηρία, так и возвратное ἑαυτῶν, подчёркивающее ответственность адресатов.
- source_word: κατεργάζεσθε
  choice: совершайте
  rationale: Передаёт длительное повеление осуществлять и доводить до результата; сохраняет смысловую напряжённость фразы и не добавляет в основной текст ни «зарабатывайте», ни «только проявляйте».
theological_decisions:
- issue: Смысл повеления «совершайте своё спасение»
  choice: Сохранено прямое и напряжённое повеление осуществлять и доводить до результата собственное спасение.
  alternative: «Зарабатывайте спасение» или, напротив, «лишь показывайте уже полученное спасение».
  rationale: κατεργάζεσθε обозначает деятельное осуществление или достижение результата, но сам стих не формулирует исчерпывающую схему соотношения человеческого послушания и Божьего действия; ближайший контекст продолжает мысль в стихе 13.
- issue: Характер «страха и трепета»
  choice: Сохранена буквальная формула «со страхом и трепетом».
  alternative: «С благоговением» либо «в паническом ужасе».
  rationale: Исходное выражение несёт одновременно серьёзность, смирение и сильную эмоциональную окраску; более узкая перефразировка преждевременно сняла бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пастырского тона. Традиционные выражения «возлюбленные», «страх и трепет» и «совершайте своё спасение» оставлены там, где они понятны современному читателю и точно удерживают богословскую насыщенность оригинала.
