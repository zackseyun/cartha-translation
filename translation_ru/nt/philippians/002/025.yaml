revisions:
- from: Но я счёл необходимым послать к вам Епафродита — моего брата, сотрудника и соратника, а вашего посланника[a] и служителя, помогавшего мне в нужде[b], —
  to: Но я счёл необходимым послать к вам Епафродита — моего брата, сотрудника и соратника, а вашего посланника[a] и служителя в моей нужде[b], —
  rationale: 'Исправлено только описание служения Епафродита: устранены добавленные глагольное действие и прошедший временной оттенок, при сохранении ясного современного русского языка. Остальные решения соответствуют греческому тексту и английской аудиторской фиксации.'
