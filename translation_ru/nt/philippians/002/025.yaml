source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: ru
  text: Но я счёл необходимым послать к вам Епафродита — моего брата, сотрудника и соратника, а вашего посланника[a] и служителя в моей нужде[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «апостола», то есть посланного вами представителя.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «служителя моей нужды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: необходимым
  rationale: Передаёт оценку необходимости и естественно сочетается с «счёл».
- source_word: ἡγησάμην
  choice: я счёл
  rationale: Выражает обдуманное суждение Павла, а не просто мимолётную мысль.
- source_word: πέμψαι
  choice: послать
  rationale: В самом греческом тексте нет явно выраженного значения «послать обратно»; оно выводится лишь из контекста.
- source_word: ἀδελφὸν
  choice: брата
  rationale: Сохраняет семейное обозначение единоверца без поясняющего расширения.
- source_word: συνεργὸν
  choice: сотрудника
  rationale: Естественное современное обозначение человека, трудящегося вместе с Павлом.
- source_word: συστρατιώτην
  choice: соратника
  rationale: Сохраняет военный образ совместной борьбы и звучит естественно по-русски.
- source_word: ἀπόστολον
  choice: посланника
  rationale: В контексте обозначает представителя, посланного филиппийской общиной, и не обязательно носителя особого апостольского служения.
- source_word: λειτουργὸν τῆς χρείας μου
  choice: служителя, помогавшего мне в нужде
  rationale: Передаёт почётный характер служения Епафродита и его направленность на практическую нужду Павла, избегая неестественной русской конструкции.
theological_decisions:
- issue: Следует ли понимать ἀπόστολον как особый титул «апостол» или в широком смысле как посланного представителя
  choice: посланника
  alternative: апостола
  rationale: Притяжательное ὑμῶν и непосредственный контекст указывают на Епафродита как на представителя, посланного филиппийцами; примечание сохраняет возможный более буквальный вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Тройное описание отношений Павла с Епафродитом сохранено через «брата, сотрудника и соратника», а противопоставление «моего» и «вашего» передано явно. Конечное тире показывает, что предложение продолжается в следующем стихе.
