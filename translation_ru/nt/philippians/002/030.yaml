  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: ru
  text: ибо ради дела Мессии[a] он был близок к смерти, рискуя жизнью, чтобы восполнить то, чего недоставало[b] в вашем служении мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греч.: «дела Христа / Мессии».'
    reason: alternative_reading
  - marker: b
    text: Речь идёт не о нежелании филиппийцев помочь, а о том служении, которое они из-за своего отсутствия не могли оказать Павлу лично.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: ради дела Мессии
  rationale: διά с винительным здесь указывает на причину или основание самоотверженного поступка; «ради» естественно передаёт смысл «из-за / ради дела», не создавая тяжеловесного повтора с ὅτι.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός сохраняет значение титула; русское «Мессия» передаёт его смысл яснее, чем традиционная транслитерация «Христос».
- source_word: μέχρι θανάτου ἤγγισεν
  choice: он был близок к смерти
  rationale: Естественное современное выражение, точно передающее приближение к пределу смерти.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: рискуя жизнью
  rationale: Причастие обозначает сознательное подвергание себя опасности, а ψυχή здесь означает земную жизнь, не нематериальную душу.
- source_word: ἵνα ἀναπληρώσῃ
  choice: чтобы восполнить
  rationale: Передаёт целевое значение ἵνα и смысл восполнения отсутствующего.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: то, чего недоставало
  rationale: Формулировка сохраняет объективную нехватку и не приписывает филиппийцам нравственной вины или нерадения.
- source_word: τῆς πρός με λειτουργίας
  choice: в вашем служении мне
  rationale: λειτουργία здесь охватывает практическую помощь и служение Павлу; «служение» сохраняет широту греческого слова.
theological_decisions:
- issue: Передача Χριστοῦ в выражении «дело Χριστοῦ»
  choice: Мессии
  alternative: Христа
  rationale: В данном сочетании титульный смысл остаётся различимым; «Мессии» переводит титул, тогда как «Христа» представляет традиционную транслитерацию.
- issue: Смысл «недостатка» в служении филиппийцев
  choice: объективно недостающее из-за их отсутствия
  alternative: упрёк в недостаточном усердии
  rationale: Контекст указывает, что Епафродит лично исполнил то, чего община не могла сделать на расстоянии; стих не требует понимать слова как нравственное порицание.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и без архаизмов. Синтаксис близок к греческому, но причинное сочетание ὅτι и διά передано естественно: «потому что ради». Сохранена возможная напряжённость выражения об объективной нехватке служения без обвинительного оттенка.'
