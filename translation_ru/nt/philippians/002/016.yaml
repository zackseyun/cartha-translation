  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: ru
  text: держась слова жизни[a], чтобы в день Мессии[b] мне было чем похвалиться, потому что я не напрасно бежал и не напрасно трудился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предлагая слово жизни» или «протягивая слово жизни».'
