  - marker: b
    text: 'Традиционный перевод: «в день Христа».'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: слова жизни
  rationale: 'Сохраняет краткость греческого выражения и его возможную двойную силу: слово, которое даёт жизнь, и весть о жизни.'
- source_word: ἐπέχοντες
  choice: держась
  rationale: В контексте призыва к стойкости передаёт вероятное значение «крепко держаться». Возможный смысл вынесения или предложения слова другим сохранён в сноске.
- source_word: καύχημα ἐμοὶ
  choice: мне было чем похвалиться
  rationale: Естественно передаёт мысль о законном основании для похвалы, не превращая καύχημα в отвлечённое понятие.
- source_word: ἡμέραν Χριστοῦ
  choice: день Мессии
  rationale: Χριστός здесь сохраняет титульный, эсхатологический смысл; русское «Мессия» передаёт его явно.
- source_word: οὐκ εἰς κενὸν
  choice: не напрасно
  rationale: Точно и естественно передаёт устойчивое значение бесплодности или тщетности и сохраняет параллелизм двух частей.
- source_word: ἔδραμον
  choice: бежал
  rationale: Сохраняет метафору бега как образ апостольского служения и усилий.
- source_word: ἐκοπίασα
  choice: трудился
  rationale: Передаёт напряжённый труд и естественно сочетается с образом бега.
theological_decisions:
- issue: Передача Χριστοῦ в эсхатологическом выражении
  choice: Мессии
  alternative: Христа
  rationale: В выражении «день Мессии» титульный и эсхатологический смысл Χριστός остаётся активным; традиционный вариант указан в сноске.
- issue: Связь ὅτι с предыдущим высказыванием
  choice: двоеточие перед «я не напрасно…»
  alternative: «потому что я не напрасно…»
  rationale: Двоеточие естественно показывает содержание будущей похвалы Павла, не исключая причинного оттенка ὅτι.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство и риторический параллелизм оригинала. Причастный оборот оставлен со строчной буквы, поскольку стих синтаксически продолжает предыдущее предложение.
