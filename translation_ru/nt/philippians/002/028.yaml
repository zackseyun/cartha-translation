  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: ru
  text: Поэтому я тем охотнее отправил его, чтобы, снова увидев его, вы обрадовались, а я меньше печалился.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: с ещё большим усердием
  rationale: Сравнительное наречие передаёт усиленную старательность и рвение Павла; эта формулировка сохраняет сравнительную степень и естественно звучит по-русски.
- source_word: οὖν
  choice: Поэтому
  rationale: Сохраняет выводную связь с предшествующим рассуждением.
- source_word: ἔπεμψα
  choice: послал
  rationale: Аорист передан естественной русской формой совершенного вида в прошедшем времени.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель отправления Епафродита.
- source_word: ἰδόντες
  choice: снова увидев его
  rationale: Аористное причастие естественно передаётся русским деепричастием; πάλιν отнесено к встрече с Епафродитом.
- source_word: χαρῆτε
  choice: обрадовались
  rationale: Аористный сослагательный глагола χαίρω обозначает предполагаемую радость при новой встрече; совершенный вид естественен в данном контексте.
- source_word: κἀγὼ
  choice: а я
  rationale: Сочетание καὶ ἐγώ здесь соединяет вторую цель с первой, при этом по-русски уместен лёгкий смысловой контраст между радостью адресатов и уменьшением печали Павла.
- source_word: ἀλυπότερος
  choice: меньше печалился
  rationale: Сохраняет сравнительное значение — не полное отсутствие скорби, а её уменьшение — и связь со значением λύπη, «печаль, скорбь».
- source_word: ὦ
  choice: печалился
  rationale: 'Настоящее сослагательное εἰμί с именной сравнительной формой ἀλυπότερος по-русски естественно передаётся глагольной конструкцией в рамках цели: «чтобы… я меньше печалился».'
theological_decisions:
- issue: Степень уменьшения печали Павла
  choice: меньше печалился
  alternative: не печалился
  rationale: Сравнительная форма ἀλυπότερος указывает лишь на уменьшение печали, а не на её полное устранение; важно сохранить эту эмоциональную напряжённость.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и достойная по тону. Синтаксис близок к греческому, но не калькирован. «Усердие» передаёт σπουδαιοτέρως без излишне разговорного оттенка, а «обрадовались» и «печалился» сохраняют эмоциональную лексику стиха.
