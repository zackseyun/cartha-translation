  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: ru
  text: Но даже если я изливаюсь как возлияние[a] на жертву и служение[b] вашей веры[c], я радуюсь и радуюсь вместе со всеми вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изливаюсь как жидкая жертва». Возлияние — жидкая жертва, изливаемая перед Богом.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может означать «служение», «общественное служение» или «священное служение»; здесь окружающие слова придают ему оттенок богослужения и жертвоприношения.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вашей верности».'
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: изливаюсь как возлияние
  rationale: Сохраняет пассивный образ жидкой жертвы, которую изливают при жертвоприношении, не сводя метафору лишь к общему самопожертвованию.
- source_word: ἐπὶ
  choice: на
  rationale: 'Передаёт наиболее непосредственный пространственно-жертвенный образ: Павел изливается «на» жертву; при этом возможная связь в смысле «при, в дополнение к» не исключается.'
- source_word: θυσίᾳ
  choice: жертву
  rationale: Обычный и точный русский эквивалент культового термина θυσία; сохраняет связь с образом возлияния.
- source_word: λειτουργίᾳ
  choice: служение
  rationale: Нейтральное по конфессиональной окраске слово; примечание сохраняет присутствующий в контексте богослужебно-жертвенный оттенок.
- source_word: πίστεως
  choice: веры
  rationale: Сохраняет обычное значение πίστις и допускает понимание веры филиппийцев как источника или характеристики их жертвы и служения.
- source_word: χαίρω
  choice: радуюсь
  rationale: Передаёт настоящее время и ключевую для Послания к филиппийцам тему радости.
- source_word: συγχαίρω
  choice: радуюсь вместе
  rationale: Прямо передаёт совместность радости и сохраняет словесную связь с χαίρω, не истолковывая глагол как поздравление.
- source_word: πᾶσιν ὑμῖν
  choice: со всеми вами
  rationale: Естественно по-русски сохраняет подчёркнутую включённость всей общины.
theological_decisions:
- issue: Жертвенный образ возможной смерти Павла
  choice: Павел изображает себя изливаемым как возлияние на жертву и служение веры филиппийцев.
  alternative: Павел говорит лишь о самоотдаче в связи с их служением, без выраженного культового образа.
  rationale: Сочетание σπένδομαι, θυσία и λειτουργία образует явный комплекс языка жертвоприношения, который следует сохранить, не уточняя сверх текста, означает ли это неизбежную смерть Павла.
- issue: Значение родительного πίστεως ὑμῶν
  choice: вашей веры
  alternative: вашей верности
  rationale: Форма допускает смысл «веры» или «верности» и не определяет однозначно отношение родительного к «жертве и служению»; основной текст сохраняет компактность оригинала, а примечание отмечает лексическую альтернативу.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного жертвенного образа. Намеренный повтор «радуюсь и радуюсь вместе» отражает однокоренные греческие глаголы χαίρω и συγχαίρω и подчёркивает общую радость Павла и всей общины.
