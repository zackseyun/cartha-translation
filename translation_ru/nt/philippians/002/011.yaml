id: PHP.2.11
reference: Philippians 2:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: ru
  text: и всякий язык исповедал, что Иисус Христос[a] — Господь, во славу Бога Отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус Мессия — Господь». «Христос» — греческий титул, соответствующий слову «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: всякий язык
  rationale: Сохраняет телесную метафору всеобщего исповедания и естественно звучит в возвышенной современной русской речи.
- source_word: ἐξομολογήσηται
  choice: исповедал
  rationale: Передаёт открытое, явное признание. Форма прошедшего времени в русском зависит от начатой в предыдущем стихе конструкции цели «чтобы…» и естественно передаёт греческий конъюнктив.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет сильное христологическое утверждение и вероятный отзвук ветхозаветного языка поклонения.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Христос
  rationale: Это естественная и укоренившаяся русская форма; при этом титульное значение Χριστός разъяснено в примечании как «Мессия».
- source_word: εἰς δόξαν
  choice: во славу
  rationale: Естественный русский оборот, передающий направленность результата к славе Бога.
- source_word: θεοῦ πατρός
  choice: Бога Отца
  rationale: Точно и естественно передаёт греческое сочетание без добавочного истолкования.
theological_decisions:
- issue: Передача Χριστός в исповедальной формуле
  choice: Христос
  alternative: Мессия
  rationale: «Христос» — понятная и нормативная русская форма в сочетании «Иисус Христос», однако исходное титульное значение сохранено в примечании.
- issue: Связь господства Иисуса со славой Бога Отца
  choice: во славу Бога Отца
  alternative: к славе Бога Отца
  rationale: 'Оборот не противопоставляет исповедание Иисуса славе Отца, а сохраняет направленность εἰς: это исповедание служит славе Бога Отца.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Строчная начальная буква и форма «исповедал» сохраняют синтаксическую связь со стихом 10, где начинается конструкция цели «чтобы…».
