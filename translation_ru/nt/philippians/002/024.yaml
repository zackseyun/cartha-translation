id: PHP.2.24
reference: Philippians 2:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πέποιθα δὲ ἐν κυρίῳ ὅτι καὶ αὐτὸς ταχέως ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/024.yaml
  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: ru
  text: Но я уверен в Господе, что и сам скоро приду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθα
  choice: я уверен
  rationale: Перфект передаёт устойчивое, сложившееся состояние уверенности; настоящее «я уверен» естественно выражает этот смысл по-русски.
- source_word: δὲ
  choice: но
  rationale: Слабая противительно-переходная частица связывает эту надежду Павла с предыдущим намерением послать Тимофея; «но» естественно обозначает переход, не создавая резкого противопоставления.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранено характерное для Павла выражение, указывающее на сферу и основание уверенности, без сведения его смысла только к личному оптимизму или прямому откровению.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание уверенности Павла.
- source_word: καὶ αὐτὸς
  choice: и сам
  rationale: «И» сохраняет добавочное значение καί по отношению к отправлению Тимофея, а «сам» передаёт усилительное αὐτός и подчёркивает личный приход Павла.
- source_word: ταχέως
  choice: скоро
  rationale: В данном контексте наречие указывает на близость события во времени, а не на скорость передвижения.
- source_word: ἐλεύσομαι
  choice: приду
  rationale: 'Будущая форма ἔρχομαι передана с сохранением дейктической перспективы адресатов: Павел придёт к филиппийцам.'
- source_word: κυρίῳ
  choice: Господе
  rationale: «Господь» — естественное и богословски нейтральное соответствие κύριος в данном контексте Павлова послания.
theological_decisions:
- issue: Характер уверенности Павла в связи с выражением «в Господе»
  choice: «я уверен в Господе»
  alternative: «я надеюсь на Господа, что…»
  rationale: 'Выбранная формулировка сохраняет характерную конструкцию ἐν κυρίῳ: ожидание Павла укоренено в Господе и зависит от Него, однако текст не превращён ни в утверждение о прямом откровении, ни в простое выражение личного оптимизма.'
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка с сохранением Павлова оборота «в Господе». Порядок слов «и сам скоро приду» естественен по-русски и одновременно сохраняет добавочное значение καί и личное усиление αὐτός.
