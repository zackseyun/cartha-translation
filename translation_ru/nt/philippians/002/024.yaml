  source_fidelity: 'Текст точно передаёт все существенные элементы греческого оригинала: πέποιθα — «я уверен», ἐν κυρίῳ — «в Господе», содержание с ὅτι, добавочно-усилительное καὶ αὐτός — «и сам», ταχέως — «скоро», и ἐλεύσομαι — «приду». Начальное «Но» допустимо для мягкого переходного δέ в данном контексте и не создаёт несоразмерного противопоставления.'
