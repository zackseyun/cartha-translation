  terminology: '«Господе» является точным и устоявшимся соответствием κυρίῳ. Оборот «уверен в Господе» сохраняет намеренно неразвёрнутый характер греческого ἐν κυρίῳ: уверенность связана с Господом, но не истолковывается как безусловное предсказание или прямое откровение.'
