  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: ru
  text: Ведь он и в самом деле был болен, близок к смерти[a]; но Бог смиловался над ним — и не только над ним, но и надо мной, — чтобы мне не пришлось испытать скорбь за скорбью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «едва не умер»; буквально: «близко к смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «скорбь на скорбь»; повтор выражает умножившуюся, накопившуюся скорбь.'
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: был болен
  rationale: В контексте глагол обозначает физическую болезнь Епафродита; этот вариант точен и естественен для современного русского языка.
- source_word: παραπλήσιον θανάτῳ
  choice: при смерти
  rationale: Выражение передаёт крайнюю близость к смерти, не утверждая, что смерть наступила; краткий русский оборот естественно выражает тяжесть состояния.
- source_word: ἠλέησεν αὐτόν
  choice: помиловал его
  rationale: «Помиловал» сохраняет богословскую весомость божественной милости и в данном контексте подразумевает избавление от смерти, не сводя смысл лишь к чувству жалости.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: и не только его, но и меня
  rationale: Формулировка сохраняет контраст и ясно распространяет действие глагола «помиловал» также на Павла.
- source_word: ἵνα μὴ λύπην ἐπὶ λύπην σχῶ
  choice: чтобы мне не пришлось пережить печаль за печалью
  rationale: Передаёт целевое значение ἵνα μή и естественно выражает предотвращённое для Павла переживание умножившейся скорби.
theological_decisions:
- issue: Смысл Божьей милости к Павлу
  choice: Сохранить формулировку «и меня» без пояснения механизма милости в основном тексте.
  alternative: Разъяснить, что Бог помиловал Павла, избавив его от дополнительной скорби из-за смерти Епафродита.
  rationale: Греческий текст прямо называет Павла объектом Божьей милости, а следующая придаточная часть показывает её связь с предотвращением новой печали; перевод сохраняет эту связь, не добавляя отсутствующего в тексте толкования.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Частицы «ведь» и «и в самом деле» передают усилительное καὶ γάρ. Оборот «при смерти» естественен и краток; буквальная образность λύπην ἐπὶ λύπην сохранена в русском идиоматическом выражении «печаль за печалью» и пояснена в сноске.
