lexical_decisions:
- source_word: Πάντα
  choice: Всё
  rationale: Винительный падеж множественного числа πᾶς употреблён всеохватно; «всё» естественно передаёт универсальный характер повеления.
- source_word: ποιεῖτε
  choice: делайте
  rationale: Настоящее повелительное наклонение выражает продолжающееся общее предписание; русское «делайте» естественно сохраняет эту силу.
- source_word: χωρὶς
  choice: без
  rationale: Предлог с родительным падежом указывает на то, чего не должно быть в их поступках; «без» — точная и естественная передача.
- source_word: γογγυσμῶν
  choice: ропота
  rationale: γογγυσμός обозначает недовольное ворчание или приглушённые жалобы. «Ропот» сохраняет библейский оттенок, включая вероятный отзвук ропота Израиля в пустыне, и остаётся понятным современному читателю.
- source_word: διαλογισμῶν
  choice: споров
  rationale: В данном увещательном контексте διαλογισμός, вероятнее всего, означает пререкания или спорные препирательства, хотя слово может обозначать также сомнения или рассуждения. «Споры» ясно передаёт наиболее вероятный межличностный смысл.
theological_decisions:
- issue: Значение διαλογισμῶν
  choice: споров
  alternative: сомнений; пререканий
  rationale: Контекст поведения общины благоприятствует значению разногласий и препирательств, но семантическая широта слова не позволяет полностью исключить внутренние сомнения; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Ропот» выбран вместо разговорного «ворчания» ради точности и межтекстового оттенка; «споры» — как наиболее понятная передача вероятного смысла διαλογισμῶν.
