lexical_decisions:
- source_word: ὃς
  choice: который
  rationale: Сохраняет относительную связь с предшествующим упоминанием Христа и синтаксическую незавершённость стиха в составе более длинного предложения.
- source_word: ἐν μορφῇ θεοῦ
  choice: в образе Бога
  rationale: «Образ» достаточно прямо передаёт μορφή и не подменяет выражение более узким метафизическим толкованием вроде «по природе Бог».
- source_word: ὑπάρχων
  choice: хотя и пребывал
  rationale: «Пребывал» передаёт продолжающееся состояние, а уступительное «хотя и» выявляет контраст с последующим самоумалением в ст. 7. Стативный вариант без уступительного оттенка дан в сноске.
- source_word: ἡγήσατο
  choice: не счёл
  rationale: Естественно и кратко передаёт значение «считать, рассматривать, полагать».
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: равенство с Богом
  rationale: Идиоматично передаёт субстантивированный инфинитив и наречное ἴσα, сохраняя смысл равного положения; буквальная конструкция отмечена в сноске.
- source_word: ἁρπαγμὸν
  choice: тем, чем можно воспользоваться ради собственной выгоды
  rationale: В контексте перехода к добровольному самоумалению эта формулировка передаёт вероятный смысл преимущества, не употреблённого для собственной пользы. Поскольку значение ἁρπαγμός спорно, варианты «то, что следует схватить» и «то, за что следует держаться» сохранены в сноске.
theological_decisions:
- issue: Христологический смысл выражения ἐν μορφῇ θεοῦ
  choice: Сохранить формулировку «в образе Бога».
  alternative: «Обладая природой Бога» или «будучи Богом по природе».
  rationale: Основной текст сохраняет собственное выражение Павла и его высокую христологическую силу, не заменяя его позднейшей догматической формулой.
- issue: Значение ἁρπαγμός применительно к равенству с Богом
  choice: Передать как возможность воспользоваться равенством ради собственной выгоды.
  alternative: «То, что следует схватить», «добыча» или «то, за что следует держаться».
  rationale: Ближайший контекст подчёркивает отказ Христа от своекорыстного использования своего положения, однако лексическая конструкция допускает и традиционное понимание приобретения или удержания; оно явно сохранено в сноске.
- issue: Уступительный или стативный смысл ὑπάρχων
  choice: «Хотя и пребывал».
  alternative: «Пребывая» или «существуя».
  rationale: Уступительный перевод делает явным риторический контраст со ст. 7, но не является единственно возможным, поэтому нейтральный стативный вариант приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и прозрачной связью с греческим синтаксисом. Формулировка остаётся частью предложения и потому завершается запятой. Архаизмы и конфессионально маркированные догматические перифразы не используются.
