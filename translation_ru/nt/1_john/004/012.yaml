id: 1JN.4.12
reference: 1 John 4:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: ru
  text: Бога никто никогда не видел. Если мы любим друг друга, Бог пребывает в нас, и Его любовь[a] доведена в нас до совершенства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наша любовь к Нему». Греческое выражение допускает оба понимания, однако контекст скорее говорит о Божьей любви к нам.'
    reason: Сохранение неоднозначности генитива αὐτοῦ.
  - marker: b
    text: 'Или: «достигла в нас полноты».'
    reason: Лексическая альтернатива для τετελειωμένη ἐστιν, подчёркивающая завершённость и достижение цели.
lexical_decisions:
- source_word: τεθέαται
  choice: видел
  rationale: В сочетании с отрицанием и πώποτε русское «никто никогда не видел» естественно передаёт перфектное утверждение об отсутствии такого опыта; «созерцал» было бы излишне возвышенным и сужало бы смысл.
- source_word: πώποτε
  choice: никогда
  rationale: При οὐδεὶς это обычный и выразительный русский способ передать «никто никогда».
- source_word: ἐὰν ἀγαπῶμεν
  choice: если мы любим
  rationale: Сохраняет условный характер конструкции ἐάν с настоящим сослагательным, не добавляя оттенков гипотетичности или повторяемости.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Современный и естественный русский эквивалент взаимного местоимения.
- source_word: μένει
  choice: пребывает
  rationale: Передаёт продолжительное пребывание и сохраняет важную для Иоанна лексическую связь; слово понятно в современном литературном и библейском регистре.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: Его любовь
  rationale: 'Буквально и естественно сохраняет неоднозначность генитива: прежде всего любовь Бога, но грамматически возможно и понимание как любви к Нему.'
- source_word: τετελειωμένη ἐστιν
  choice: доведена до совершенства
  rationale: Передаёт перифрастический перфект как достигнутое и сохраняющееся состояние и сохраняет связь с τελειόω — достижением полноты или совершенства.
- source_word: ἐν ἡμῖν
  choice: в нас
  rationale: Последовательно передаёт оба употребления ἐν ἡμῖν и соответствует теме пребывания Бога внутри сообщества верующих, не исключая коллективного смысла.
theological_decisions:
- issue: Смысл выражения ἡ ἀγάπη αὐτοῦ
  choice: любовь Бога, проявляющаяся и достигающая полноты в нас
  alternative: наша любовь к Богу достигает совершенства в нас
  rationale: Ближайший контекст (ст. 10–11) подчёркивает первенство Божьей любви. При этом русский оборот «Его любовь» и примечание сохраняют реальную грамматическую неоднозначность.
- issue: Значение совершенства любви
  choice: любовь доведена до совершенства, то есть достигла полноты своего действия
  alternative: любовь стала нравственно безупречной
  rationale: τελειόω здесь прежде всего указывает на завершение и достижение цели; перевод не должен навязывать исключительно морально-перфекционистское прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пребывает» сохраняет ключевой термин Иоанна, а порядок слов «Бога никто никогда не видел» отражает вынесение θεόν вперёд и звучит естественно. Заглавная буква в «Его» употреблена как издательская норма для местоимения, относящегося к Богу.
