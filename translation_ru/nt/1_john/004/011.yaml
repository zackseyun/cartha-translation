source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: ru
  text: Возлюбленные, если Бог так возлюбил нас[a], то и мы должны любить друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поскольку Бог возлюбил нас таким образом». В греческом тексте стоит условное «если», хотя в данном контексте условие, по-видимому, принимается как истинное.'
    reason: Альтернативная передача риторического условия и значения οὕτως.
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Возлюбленные
  rationale: Форма прямого обращения во множественном числе. «Возлюбленные» сохраняет смысловую и словесную связь с глаголом ἀγαπάω в этом стихе и передаёт тёплый, богословски насыщенный стиль Иоанна.
- source_word: εἰ
  choice: если
  rationale: Сохраняет условную форму греческого текста. В контексте истинность Божьей любви не ставится под сомнение, однако перевод «поскольку» снял бы риторическую условность.
- source_word: οὕτως
  choice: так
  rationale: Краткое и естественное соответствие, допускающее как указание на образ проявленной любви, так и оттенок её меры или силы.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое и естественное соответствие греческому подлежащему.
- source_word: ἠγάπησεν
  choice: возлюбил
  rationale: Аорист ἀγαπάω указывает на совершившееся проявление любви. «Возлюбил» сохраняет в русском тексте лексическую связь с обращением «Возлюбленные» и звучит уместно в возвышенной библейской речи.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое соответствие местоимению в функции дополнения.
- source_word: καὶ ἡμεῖς
  choice: то и мы
  rationale: Конструкция «то и мы» естественно передаёт в русском языке следствие условной части, союз καί и акцент, создаваемый явным местоимением ἡμεῖς.
- source_word: ὀφείλομεν
  choice: должны
  rationale: Передаёт нравственную обязанность, выраженную ὀφείλω, без более узкого образа денежного долга.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычное современное русское соответствие взаимному местоимению.
- source_word: ἀγαπᾶν
  choice: любить
  rationale: Естественно передаёт инфинитив после ὀφείλομεν и сохраняет центральную лексику любви.
theological_decisions:
- issue: Смысл условного оборота εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: 'Сохранено формальное условие: «если Бог так возлюбил нас».'
  alternative: «Поскольку Бог так возлюбил нас» или «раз Бог возлюбил нас таким образом».
  rationale: В контексте Божья любовь принимается как несомненная истина, но автор облекает основание призыва в условную форму. Перевод сохраняет эту риторическую форму и не превращает её без необходимости в явно причинную конструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обращения. «Возлюбленные» намеренно сохраняет повтор корня любви; «то» добавлено как естественный русский коррелят к «если», не меняющий логики исходного текста.
