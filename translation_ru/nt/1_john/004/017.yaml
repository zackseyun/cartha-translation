reference: 1 John 4:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: ru
  text: В этом[a] любовь достигла совершенства среди нас[b], чтобы мы имели уверенность[c] в день суда, потому что каков он[d], таковы и мы в этом мире.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Этим» или «Так». Греческое выражение может указывать на средство, образ действия или на то, в чём проявляется полнота любви.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «с нами»; возможно также понимание «у нас».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дерзновение», то есть смелую, свободную от страха уверенность.'
    reason: lexical_alternative
  - marker: d
    text: Вероятнее всего, местоимение относится к Иисусу; некоторые понимают его как указание на Бога в более общем смысле.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Так
  rationale: Передаёт указательно-обстоятельственное значение выражения и естественно связывает завершение любви с последующим объяснением, не устраняя возможного перевода «В этом».
- source_word: τετελείωται
  choice: достигла совершенства
  rationale: Перфект страдательного залога указывает на доведение до полноты с сохраняющимся результатом; формулировка не подразумевает, будто Божья любовь прежде была нравственно несовершенной.
- source_word: ἡ ἀγάπη
  choice: любовь
  rationale: Прямой и естественный эквивалент, сохраняющий неопределённость относительно того, идёт ли речь преимущественно о Божьей любви к людям, любви людей к Богу или любви в общине.
- source_word: μεθ’ ἡμῶν
  choice: среди нас
  rationale: В данном контексте естественно обозначает любовь, достигшую полноты в жизни верующих; примечание сохраняет более буквальную возможность «с нами».
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое или результативное отношение между совершенством любви и уверенностью перед судом.
- source_word: παρρησίαν
  choice: уверенность
  rationale: В контексте предстояния перед Богом слово означает свободную от страха уверенность; современное русское слово понятнее, чем книжное «дерзновение».
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: в день суда
  rationale: Естественно передаёт устойчивое эсхатологическое выражение без лишнего уточнения характера суда.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает причинное основание уверенности.
- source_word: καθὼς ἐκεῖνός ἐστιν
  choice: каков он
  rationale: Сохраняет настоящее время и подразумеваемый в греческом тексте референт местоимения, не подставляя прямо имя Иисуса.
- source_word: καὶ ἡμεῖς ἐσμεν
  choice: таковы и мы
  rationale: Естественная русская соотносительная конструкция «каков… таковы…», точно передающая сравнение.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: в этом мире
  rationale: Стандартно и контекстуально точно обозначает нынешнюю сферу человеческой жизни.
theological_decisions:
- issue: К кому относится ἐκεῖνος («он»)
  choice: Местоимение оставлено без названного референта; вероятнее всего, имеется в виду Христос, Сын.
  alternative: Местоимение может пониматься как более общее указание на Бога.
  rationale: В 1 Иоанна ἐκεῖνος часто указывает на Иисуса (2:6; 3:3, 5, 7, 16), однако сам стих не называет референта; местоимение сохраняет эту формальную неоднозначность.
- issue: Смысл совершенства любви
  choice: Любовь доведена до предназначенной полноты среди верующих, следствием чего становится уверенность в день суда.
  alternative: Речь исключительно о совершенной любви верующих к Богу либо исключительно о Божьей любви к ним.
  rationale: Греческая формулировка не ограничивает любовь только одним направлением и не утверждает безгрешного нравственного совершенства верующих.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Избегнуты как архаичное основное «дерзновение», так и чрезмерно разговорные обороты. Строчная форма местоимения «он» не навязывает референта и соответствует современной русской орфографической практике; конструкция «каков он, таковы и мы» сохраняет сжатость и богословское напряжение оригинала.
