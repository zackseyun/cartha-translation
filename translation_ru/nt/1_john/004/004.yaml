  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: ru
  text: Вы от Бога, дети, и победили их[a], потому что тот, кто в вас, больше того, кто в мире[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть упомянутых выше противников, прежде всего лжепророков.
    reason: cross_reference
  - marker: b
    text: 'Или: «он, пребывающий в вас, … он, пребывающий в мире». В греческом оба лица прямо не названы; контекст позволяет предположить, что первое выражение относится к Богу или Его Духу, а второе — к лукавому, стоящему за миром.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение подчёркивает адресатов; в русском это естественно передаётся словом «вы» в начале предложения.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ указывает на источник, происхождение или принадлежность; «от Бога» естественно передаёт этот смысл и сохраняет характерную для послания формулировку.
- source_word: τεκνία
  choice: дети
  rationale: Это ласковое семейное обращение. «Дети» звучит в современном русском естественно и достойно, тогда как «деточки» было бы чрезмерно уменьшительным, а «дети мои» добавляло бы отсутствующее в греческом местоимение.
- source_word: νενικήκατε
  choice: победили
  rationale: Перфект обозначает состоявшуюся победу, результат которой сохраняется. Русское совершенное прошедшее «победили» ясно передаёт этот смысл.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение отсылает к упомянутым выше противникам, прежде всего к лжепророкам, но основной текст не должен уточнять референт сверх греческого оригинала.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину победы верующих; «потому что» ясно и естественно выражает причинную связь.
- source_word: μείζων
  choice: больше
  rationale: Сравнительное прилагательное имеет широкий смысл превосходства; «больше» не сужает его до одной лишь силы, как могли бы сделать слова «сильнее» или «могущественнее».
- source_word: ὁ ἐν ὑμῖν
  choice: тот, кто в вас
  rationale: Субстантивированное выражение оставляет лицо подразумеваемым. Формулировка «тот, кто в вас» естественна и не вносит в основной текст явного отождествления.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: тот, кто в мире
  rationale: Параллельная формулировка сохраняет риторическое противопоставление и оставляет референт не названным, как в греческом тексте.
- source_word: κόσμῳ
  choice: мире
  rationale: «Мир» — основное соответствие κόσμος. Хотя в контексте слово может обозначать мир, противящийся Богу, развёрнутое толкование в основном тексте было бы избыточным.
theological_decisions:
- issue: Кого обозначают выражения «тот, кто в вас» и «тот, кто в мире»
  choice: Оба лица оставлены не названными, а параллельные выражения переданы со строчной буквы.
  alternative: Прямо назвать первого Богом или Святым Духом, а второго — дьяволом либо лукавым; или обозначить первого местоимением с прописной буквы.
  rationale: Контекст указывает на Бога или Его Духа в верующих и на лукавого, стоящего за миром, однако греческий текст не называет их прямо. Строчная буква и параллельный синтаксис сохраняют намеренную неявность и не превращают перевод в толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, ясным и достойным синтаксисом. Обращение «дети» сохраняет пастырскую теплоту без архаичности и чрезмерной уменьшительности. Параллелизм заключительных выражений передаёт структуру оригинала.
