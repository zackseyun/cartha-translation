base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: ru
  text: Они — от мира; поэтому говорят по-мирски[a], и мир их слушает.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из мира». Та же греческая конструкция употреблена в начале стиха («от мира») и указывает на источник и происхождение их речи.'
    reason: lexical_alternative
  - marker: b
    text: «Мир» здесь — отчуждённый от Бога человеческий порядок, а не сотворённая вселенная сама по себе.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: они
  rationale: Местоимение отсылает к лжепророкам из контекста и сохраняет противопоставление последующему «мы». Тире естественно передаёт лёгкое смысловое выделение без добавления «сами».
- source_word: ἐκ τοῦ κόσμου
  choice: от мира
  rationale: Предлог ἐκ указывает на источник или происхождение. «От мира» сохраняет эту мысль и повторяющуюся формулу Иоанна.
- source_word: κόσμος
  choice: мир
  rationale: Сохранён традиционный и многозначный термин. Здесь из контекста он обозначает отчуждённый от Бога человеческий порядок, а не сотворённую вселенную как таковую.
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и естественно выражает причинно-следственную связь между их происхождением и речью.
- source_word: λαλοῦσιν
  choice: говорят
  rationale: Настоящее время имеет общий, характерный смысл; «говорят» звучит естественно и сохраняет нейтральную весомость глагола.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: говорят от мира
  rationale: Необычная, но понятная конструкция сохраняет повтор ἐκ τοῦ κόσμου и подчёркивает источник их речи, не сводя смысл только к теме разговора.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: мир их слушает
  rationale: «Слушает» передаёт восприимчивое, благосклонное слышание, а не только физическое восприятие звука.
theological_decisions:
- issue: Значение κόσμος в богословии Иоанна
  choice: «мир» как человеческий порядок, отчуждённый от Бога
  alternative: физическая вселенная или человечество в нейтральном смысле
  rationale: Контекст противопоставляет тех, кто «от Бога», тем, кто «от мира»; речь идёт о духовно-нравственном происхождении и восприимчивости. В основном тексте сохранено многозначное «мир», а пояснение вынесено в сноску.
- issue: Сила αὐτοὶ
  choice: лёгкое контрастное выделение посредством конструкции «Они — от мира»
  alternative: «Они сами — от мира» либо нейтральное «Они от мира»
  rationale: Греческое местоимение имеет контрастный оттенок, но «сами» могло бы неоправданно усилить рефлексивность. Тире передаёт выделение естественным русским способом.
- issue: Отношение второго ἐκ τοῦ κόσμου к λαλοῦσιν
  choice: 'источник и обусловленность речи: «говорят от мира»'
  alternative: 'тема речи: «говорят о мирском» или «говорят о мире»'
  rationale: Повтор той же предложной конструкции прежде всего подчёркивает происхождение; перевод не должен молча сужать её до содержания речи.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-нейтральным строем. Повтор слова «мир» и конструкции «от мира» намеренно сохранён как ключевой риторический и богословский элемент оригинала. Маркер [b] поставлен после всего утверждения, которое он поясняет.
