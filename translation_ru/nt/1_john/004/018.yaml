source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: ru
  text: В любви нет страха, но совершенная любовь[a] изгоняет страх, потому что страх связан с наказанием[b]. А кто боится, тот не достиг совершенства в любви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Совершенная» здесь может также означать «полная» или «зрелая», то есть любовь, достигшую предназначенной ей полноты.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «страх имеет наказание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: страх / боится
  rationale: Передаёт повтор ключевого слова и в данном контексте обозначает страх перед судом и наказанием, не сужая значение до одного лишь ужаса.
- source_word: ἀγάπῃ / ἀγάπη
  choice: любовь
  rationale: Естественный и устойчивый русский эквивалент, последовательно сохраняющий ключевой термин стиха.
- source_word: τελεία
  choice: совершенная
  rationale: Сохраняет смысл любви, достигшей полноты, и словесную связь с τετελείωται; возможные оттенки «полная» и «зрелая» отмечены в сноске.
- source_word: ἔξω βάλλει
  choice: изгоняет
  rationale: Естественно передаёт образ решительного удаления страха и сохраняет его силу.
- source_word: κόλασιν ἔχει
  choice: связан с наказанием
  rationale: Идиоматичный русский оборот, не превращающий κόλασις в «мучение» и не уточняющий сверх текста, является ли речь о самом наказании или о его ожидании.
- source_word: ὁ δὲ φοβούμενος
  choice: А кто боится
  rationale: Естественно и без гендерного уточнения передаёт субстантивированное причастие.
- source_word: οὐ τετελείωται ἐν τῇ ἀγάπῃ
  choice: тот ещё не достиг совершенства в любви
  rationale: Передаёт нынешнее состояние незавершённости и сохраняет лексическую связь с «совершенной любовью»; «ещё» естественно выражает результирующее состояние, не утверждая отдельной доктрины о безгрешном совершенстве.
theological_decisions:
- issue: Смысл выражений «совершенная любовь» и «не достиг совершенства в любви»
  choice: Сохранить корень «совершен-» в обеих частях стиха.
  alternative: «зрелая любовь» / «ещё не созрел в любви» или «полная любовь» / «любовь ещё не достигла полноты».
  rationale: Так сохраняется напряжение между полнотой любви и незавершённостью боящегося человека, не сводя мысль только к эмоциональной зрелости и не вводя учение о безгрешности.
- issue: Связь страха с наказанием
  choice: «страх связан с наказанием»
  alternative: 'Буквально: «страх имеет наказание»; также возможно: «страх несёт наказание».'
  rationale: Греческая конструкция кратка и допускает некоторую смысловую открытость. Выбранный вариант показывает неразрывную связь страха с наказанием, не решая явно, означает ли это переживание наказания или ожидание грядущего наказания.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный без архаизмов. Повтор слов «страх», «любовь» и корня «совершен-» сохранён как важная часть аргументации.
