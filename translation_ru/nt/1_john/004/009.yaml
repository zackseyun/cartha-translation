  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: ru
  text: Любовь Бога проявилась среди нас[a] в том, что Бог послал в мир Своего единственного[b] Сына, чтобы мы жили через Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нас». Греческое выражение может означать как проявление любви внутри верующих, так и среди них как общины.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «единородного». Греческое слово подчёркивает уникальность Сына; вариант «единородного» сохраняет исторически сложившуюся церковную формулировку.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: в том, что
  rationale: Иоаннова формула указывает, каким образом любовь стала явной; по-русски естественно соединяется с последующим ὅτι в конструкции «в том, что».
- source_word: ἐφανερώθη
  choice: явилась
  rationale: Передаёт становление любви видимой и явной, сохраняя краткость и достоинство греческого выражения.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: любовь Бога
  rationale: 'Родительный падеж естественно понимается как субъективный: любовь, исходящая от Бога и проявленная Им.'
- source_word: ἐν ἡμῖν
  choice: среди нас
  rationale: Передаёт проявление Божьей любви в среде общины или по отношению к ней; буквальное и возможное «в нас» сохранено в сноске.
- source_word: ὅτι
  choice: что
  rationale: Вводит пояснение содержания и способа проявления любви, а не только причину.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: Своего единственного Сына
  rationale: Возвратное «Своего» естественно связывает Сына с подлежащим «Бог», а «единственного» подчёркивает уникальность Сына без внесения в основной текст спорного этимологического оттенка рождения.
- source_word: ἀπέσταλκεν
  choice: послал
  rationale: Русский совершенный вид выражает завершённое послание; отдельное формальное воспроизведение греческого перфекта по-русски было бы неестественным.
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: Прямое и естественное соответствие направлению послания Сына в человеческий мир.
- source_word: ἵνα ζήσωμεν
  choice: чтобы мы жили
  rationale: Передаёт цель послания; форма «жили» естественно выражает предполагаемую жизнь как результат действия Бога.
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: 'διά с родительным обозначает средство или посредничество: жизнь обретается через Сына.'
theological_decisions:
- issue: Значение μονογενής применительно к Сыну
  choice: «единственного Сына» в основном тексте
  alternative: «единородного Сына»
  rationale: В данном употреблении слово прежде всего подчёркивает уникальность отношений Сына с Отцом. Традиционное церковное «единородного» сохранено в сноске, но его этимологический оттенок не навязывается основному тексту.
- issue: Смысл ἐν ἡμῖν
  choice: «среди нас»
  alternative: «в нас»
  rationale: Контекст допускает корпоративное проявление любви среди верующих и внутреннее проявление в них. Основной текст выбирает естественное коммунальное прочтение, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и торжественным звучанием. Порядок слов сделан естественным для русского; прописные буквы в «Сына», «Своего» и «Него» поддерживают достоинство христологического наименования, не добавляя толкования к содержанию стиха.
