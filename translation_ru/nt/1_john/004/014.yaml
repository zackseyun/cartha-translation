source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: ru
  text: И мы видели и свидетельствуем, что Отец послал Сына, Спасителя мира.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: И мы
  rationale: Сохраняет связь с предыдущей мыслью и лёгкое смысловое выделение явного местоимения ἡμεῖς, не усиливая его до «мы сами».
- source_word: τεθεάμεθα
  choice: видели
  rationale: Передаёт свидетельский характер глагола и остаётся естественным для современного русского языка. Греческий перфект указывает на состоявшееся видение, сохраняющее значение для настоящего свидетельства; в русском это поддерживается сочетанием с настоящим временем «свидетельствуем».
- source_word: μαρτυροῦμεν
  choice: свидетельствуем
  rationale: Точно передаёт продолжающееся свидетельство в настоящем времени и естественно сочетается с предшествующим «видели».
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание свидетельства, а не причину.
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Передаёт употреблённое у Иоанна личностное наименование Бога в Его отношении к Сыну; прописная буква соответствует русской традиции передачи божественного титула.
- source_word: ἀπέσταλκεν
  choice: послал
  rationale: Русский совершенный вид естественно обозначает завершённое послание; сохраняющаяся значимость действия ясна из контекста. Форма «послал» точнее и естественнее, чем искусственная попытка формально воспроизвести греческий перфект.
- source_word: τὸν υἱόν
  choice: Сына
  rationale: Сохраняет определённый титул без добавления отсутствующего в греческом притяжательного местоимения «Своего».
- source_word: σωτῆρα
  choice: Спасителя
  rationale: Это точный, общепринятый и понятный эквивалент, не сужающий смысл до отдельного аспекта избавления.
- source_word: τοῦ κόσμου
  choice: мира
  rationale: Сохраняет родительный оборот и широкий масштаб выражения κόσμος, не уточняя его богословски сверх текста.
- source_word: σωτῆρα τοῦ κόσμου
  choice: как Спасителя мира
  rationale: Предлог «как» естественно передаёт в русском языке предикативно-аппозитивное употребление «Спасителя мира» после глагола «послал». Более буквальная конструкция приведена в примечании, поскольку греческий текст не содержит отдельного эквивалента слова «как».
theological_decisions:
- issue: Объём выражения «Спаситель мира»
  choice: Сохранено широкое выражение «Спаситель мира» без ограничения круга подразумеваемых людей и без указания конкретной теории спасения.
  alternative: «Спаситель избранных»; «возможный Спаситель мира»
  rationale: Греческий текст прямо называет Сына Спасителем мира. Любое сужение или догматическое уточнение добавило бы к тексту то, чего в нём нет.
- issue: Отношение Отца и Сына
  choice: Сохранены титулы «Отец» и «Сын» в их прямом иоанновском употреблении.
  alternative: «Бог Отец послал Иисуса Христа»
  rationale: В стихе употреблены именно соотносительные наименования «Отец» и «Сын», а не имя «Иисус» и не титул «Христос»; разворачивать их в пояснение не следует.
- issue: Синтаксическая роль «Спасителя мира»
  choice: В основном тексте передано «как Спасителя мира», а более буквальная аппозиция отмечена в сноске.
  alternative: «послал Сына — Спасителя мира»
  rationale: Греческое σωτῆρα может пониматься как приложение или предикативное обозначение роли. Русское «как» звучит естественно, но может сильнее выделять роль, поэтому буквальная форма сохранена как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью библейской речи. Синтаксис краткий, без архаизмов; повтор «видели и свидетельствуем» сохранён как смысловая связь очевидческого опыта с продолжающимся свидетельством.
