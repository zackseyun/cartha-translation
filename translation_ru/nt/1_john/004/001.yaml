source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: ru
  text: Возлюбленные[a], не всякому духу верьте, но испытывайте духов, от Бога ли они[b], потому что в мир вышли многие лжепророки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дорогие мои». Греческое обращение буквально означает «возлюбленные».'
    reason: lexical_alternative
  - marker: b
    text: То есть следует проверять духовный источник пророческих притязаний; далее человеческими носителями таких притязаний названы «лжепророки».
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Возлюбленные
  rationale: Тёплое обращение во множественном числе; сохраняет связь с языком любви, характерным для Иоанна, и звучит достойно в современном русском библейском тексте.
- source_word: παντὶ πνεύματι
  choice: всякому духу
  rationale: Сохраняет обобщённое единственное число и сверхъестественную рамку исходного текста, не сводя смысл только к учителям или высказываниям.
- source_word: πιστεύετε
  choice: верьте
  rationale: Настоящее повелительное наклонение с отрицанием выражает общий запрет принимать всякое духовное притязание за истинное.
- source_word: δοκιμάζετε
  choice: испытывайте
  rationale: Передаёт проверку на подлинность и соответствует традиционному, но всё ещё понятному современному словоупотреблению.
- source_word: τὰ πνεύματα
  choice: духов
  rationale: Прямо сохраняет множественное число и не устраняет неоднозначность между духовными источниками и их проявлением через пророков.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: от Бога ли они
  rationale: Естественная русская конструкция косвенного вопроса; «от Бога» ясно выражает источник или происхождение.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: много лжепророков
  rationale: Точное и общепонятное соответствие греческому выражению.
- source_word: ἐξεληλύθασιν
  choice: вышло
  rationale: Совершенный вид в сочетании с контекстом передаёт совершившийся выход и его продолжающееся последствие; сохраняется образ движения в мир.
- source_word: εἰς τὸν κόσμον
  choice: в мир
  rationale: Естественно и без лишнего истолкования передаёт человеческую сферу, в которой действуют лжепророки.
theological_decisions:
- issue: К кому или к чему относятся «духи»
  choice: Реальные духовные источники пророческих притязаний, распознаваемые через говорящих людей
  alternative: Только человеческие учителя либо лишь пророческие высказывания
  rationale: 'Текст различает «духов» и «лжепророков»: первые представлены как источник, вторые — как человеческие носители. Перевод сохраняет это различие, не уточняя сверх сказанного.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Возлюбленные» и «испытывайте» сохраняют стиль Иоанна, оставаясь понятными; порядок слов сделан естественным для русского языка.
