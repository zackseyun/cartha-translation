lexical_decisions:
- source_word: ἡμεῖς
  choice: мы
  rationale: Явное местоимение сохраняет выраженный в греческом тексте субъект; по-русски здесь звучит естественно и допускает лёгкое смысловое противопоставление.
- source_word: ἀγαπῶμεν
  choice: любим
  rationale: Настоящее время передано естественным русским настоящим временем; объект не добавлен, поскольку в основном тексте SBLGNT он отсутствует.
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз понят как причинный: наша любовь имеет основание в предшествующей любви Бога.'
- source_word: αὐτὸς
  choice: Он
  rationale: В контексте местоимение относится к Богу. Русское «Он» передаёт субъект без тяжеловесного «Он Сам».
- source_word: πρῶτος
  choice: первым
  rationale: Передаёт временное и логическое первенство Божьей любви; форма «первым» естественно сочетается с глаголом.
- source_word: ἠγάπησεν
  choice: полюбил
  rationale: Аорист передан совершенным видом прошедшего времени как предшествующий решающий акт любви.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое дополнение передано буквально и естественно.
theological_decisions:
- issue: Следует ли добавлять объект к словам «мы любим»
  choice: 'Оставить объект невыраженным: «Мы любим»'
  alternative: «Мы любим Его» / «Мы любим Бога»
  rationale: 'В представленном тексте SBLGNT после ἀγαπῶμεν нет дополнения. Неопределённость сохраняется: любовь Бога служит основанием любви верующих, а её объект данный вариант текста прямо не ограничивает.'
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Заглавная буква в «Он» использована как традиционное русское обозначение Бога в данном контексте.
