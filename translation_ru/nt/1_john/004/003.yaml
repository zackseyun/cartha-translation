  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: ru
  text: А всякий дух, который не исповедует Иисуса, — не от Бога.[a] Это дух антихриста,[b] о котором вы слышали, что он приходит, и теперь он уже в мире.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «не исповедует, что Иисус Христос пришёл во плоти».'
    reason: textual_variant
  - marker: b
    text: 'Буквально греческий текст эллиптичен: «это — то, что принадлежит антихристу»; подразумевается «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: всякий дух
  rationale: Сочетание имеет распределительное значение. В контексте речь идёт о проверяемых духовных влияниях и притязаниях, а не о Святом Духе.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: исповедует Иисуса
  rationale: Передаёт не просто признание факта, а открытое исповедание и верность; основной текст следует краткому чтению SBLGNT.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ указывает на источник или происхождение; «от Бога» естественно передаёт этот смысл по-русски.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Это дух антихриста
  rationale: В греческом выражение эллиптическое, но подразумеваемое слово πνεῦμα ясно из первой части стиха. Его восполнение обеспечивает естественность русского текста; буквальная структура отмечена в сноске.
- source_word: ἀντιχρίστου
  choice: антихриста
  rationale: Определённость греческого выражения передаётся обычным русским обозначением известного из контекста антихриста без неестественного отдельного артиклевого эквивалента.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: о котором вы слышали, что он приходит
  rationale: Относительное местоимение в греческом среднего рода соотносится со всем предшествующим выражением; русский грамматический род согласуется с восполненным словом «дух», не превращая референт в личность антихриста.
- source_word: ἐν τῷ κόσμῳ ... ἤδη
  choice: теперь он уже в мире
  rationale: «Уже» сохраняет акцент на нынешнем присутствии, а «в мире» естественно передаёт устойчивое иоанновское выражение.
theological_decisions:
- issue: Текстовая форма отвергаемого исповедания
  choice: 'В основном тексте: «не исповедует Иисуса».'
  alternative: «не исповедует, что Иисус Христос пришёл во плоти».
  rationale: Краткое чтение соответствует SBLGNT; расширенное чтение, вероятно гармонизированное со стихом 2, сохраняется в сноске как значимый текстовый вариант.
- issue: Восполнение эллипсиса τὸ τοῦ ἀντιχρίστου
  choice: «Это дух антихриста».
  alternative: 'Буквальнее: «Это то, что от антихриста» или «это — антихристово».'
  rationale: Греческий текст не повторяет πνεῦμα, однако оно ясно подразумевается из ближайшего контекста. Восполнение делает русский текст понятным, а сноска сохраняет осведомлённость об эллипсисе.
- issue: Референт приходящего
  choice: Местоимение «он» грамматически относится к «духу антихриста».
  alternative: 'Понять фразу как указание непосредственно на личность антихриста: «вы слышали, что он приходит».'
  rationale: Греческое ὃ имеет средний род и согласуется с предшествующим эллиптическим выражением, поэтому перевод не должен без оговорки заменять его личным мужским референтом-антихристом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Исповедует» сохранено как понятный церковно-библейский термин с оттенком открытого признания. Синтаксис упрощён ровно настолько, чтобы греческий эллипсис не делал русский текст неестественным.
