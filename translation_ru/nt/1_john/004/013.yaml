  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: ru
  text: Из того, что Он дал нам от Своего Духа[a][b], мы узнаём, что пребываем в Нём и Он — в нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаёмся в Нём». Глагол μένω — одно из ключевых слов у Иоанна; он передаёт продолжающуюся связь и постоянство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дал нам от Своего Духа». Такое выражение подчёркивает источник дара; по смыслу возможно также: «дал нам Своего Духа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: По этому
  rationale: В данном контексте оборот вводит основание, по которому верующие узнают о взаимном пребывании; «по этому» естественно передаёт доказательное значение, сохраняя близость к греческому выражению.
- source_word: γινώσκομεν
  choice: мы узнаём
  rationale: Настоящее время выражает актуальное и продолжающееся распознавание; «узнаём» здесь естественно сочетается с «по этому» и не исключает смысла уверенного знания.
- source_word: ἐν αὐτῷ μένομεν
  choice: пребываем в Нём
  rationale: «Пребывать» сохраняет длительный и relationally устойчивый смысл ключевого для Иоанна глагола μένω, оставаясь понятным в современном литературном русском.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: и Он — в нас
  rationale: Греческий текст не повторяет глагол; тире естественно передаёт эллипсис и сохраняет компактный параллелизм.
- source_word: ὅτι
  choice: двоеточие с последующим пояснением
  rationale: Второе ὅτι вводит основание знания. Русская бессоюзная пояснительная конструкция после двоеточия передаёт причинно-доказательную связь без принудительного выбора между «потому что» и «что».
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: от Своего Духа
  rationale: Предлог ἐκ указывает на источник и допускает оттенок уделения «от Духа»; формулировка сохраняет этот нюанс, не сводя выражение просто к «дал Своего Духа».
- source_word: δέδωκεν ἡμῖν
  choice: дал нам
  rationale: Русский совершенный вид естественно выражает совершившееся дарование с сохраняющимся результатом; порядок слов соответствует нормальной русской речи.
theological_decisions:
- issue: К кому относятся местоимения и кто назван Духом
  choice: Прописные «Нём», «Он», «Своего Духа» указывают на Бога и Святого Духа.
  alternative: Строчное «духа» как обозначение духовного дара или настроя.
  rationale: Ближайший контекст говорит о взаимном пребывании Бога и верующих, подтверждаемом дарованием Его Духа. Прописная буква обозначает контекстуальный референт, не добавляя конфессионально специфического толкования.
- issue: Взаимное пребывание
  choice: Сохранить «пребываем в Нём и Он — в нас» без добавления второго глагола.
  alternative: «Пребываем в Нём, и Он пребывает в нас».
  rationale: Эллиптическая форма сохраняет симметрию и сжатость греческого текста, а подразумеваемый глагол в русском ясен.
- issue: Оттенок ἐκ τοῦ πνεύματος αὐτοῦ
  choice: «дал нам от Своего Духа»
  alternative: «дал нам Своего Духа»
  rationale: Выбранный вариант сохраняет подлинную неоднозначность между указанием на источник и оттенком уделения, не утверждая, будто Дух делим на части.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Пребываем» сохранено как значимый термин Иоанна; синтаксис сделан ясным и компактным. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру.
