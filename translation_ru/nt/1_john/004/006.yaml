source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: ru
  text: Мы — от Бога. Кто знает Бога, тот слушает нас; кто не от Бога, тот нас не слушает.[a] Из этого мы узнаём Духа истины[b][c] и дух заблуждения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слышит нас» — в обоих случаях; греческий глагол может обозначать слышание, но здесь, вероятно, подразумевается восприимчивое отношение к апостольскому свидетельству.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дух истины». Выражение можно понимать и в более общем смысле, хотя у Иоанна оно обычно относится к Святому Духу.'
    reason: alternative_reading
  - marker: c
    text: Выражение «Дух истины» перекликается с Ин. 14:17; 15:26; 16:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ передаёт источник или происхождение; «от Бога» сохраняет этот смысл и естественно звучит в русском языке.
- source_word: ὁ γινώσκων τὸν θεόν
  choice: кто знает Бога
  rationale: Субстантивированное причастие настоящего времени выражает общую, характерную принадлежность; конструкция «кто знает Бога» передаёт её ясно и естественно.
- source_word: ἀκούει ἡμῶν
  choice: слушает нас
  rationale: В контексте речь идёт не только о физическом восприятии речи, но и о принятии апостольского свидетельства. «Слушает нас» сохраняет эту восприимчивость, не усиливая смысл до «повинуется».
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: кто не от Бога
  rationale: Формулировка сохраняет обобщающий смысл относительного местоимения и противопоставление происхождения «от Бога».
- source_word: ἐκ τούτου
  choice: по этому
  rationale: 'Оборот указывает на основание для последующего распознавания: отношение к апостольскому свидетельству служит критерием.'
- source_word: γινώσκομεν
  choice: узнаём
  rationale: Выбор сохраняет связь с γινώσκων в первой части стиха и одновременно допускает контекстуальный смысл распознавания.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Духа истины
  rationale: В контексте проверки духов и в более широком употреблении у Иоанна выражение, вероятнее всего, обозначает Святого Духа; прописная буква передаёт это понимание, не устраняя альтернативу в примечании.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: дух заблуждения
  rationale: πλάνη обозначает заблуждение, обман или уклонение от истины. «Заблуждение» естественно противопоставляется истине и не сужает выражение до одной конкретной формы обмана.
theological_decisions:
- issue: Обозначает ли первое πνεῦμα Святого Духа
  choice: Духа истины
  alternative: дух истины
  rationale: У Иоанна «Дух истины» обычно служит обозначением Святого Духа, особенно в контексте различения духов. При этом грамматика допускает более общее прочтение, поэтому оно отмечено в сноске.
- issue: Означает ли ἀκούει простое слышание или восприимчивое слушание апостольского свидетельства
  choice: слушает нас
  alternative: слышит нас
  rationale: Контекст связывает истинность духов с откликом на апостольское свидетельство. «Слушает» передаёт восприимчивое отношение, но не привносит более сильного значения повиновения.
translation_notes:
  register: Современный литературный русский язык; краткий, достоинственный синтаксис. Тире в первом предложении подчёркивает местоимение ἡμεῖς и естественно оформляет именное сказуемое. Повтор «от Бога» сохранён ради композиционного и богословского противопоставления.
