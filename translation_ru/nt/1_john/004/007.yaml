  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: ru
  text: Возлюбленные[a], будем любить друг друга, потому что любовь — от Бога, и каждый, кто любит, рождён от Бога и знает Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дорогие друзья». Греческое обращение буквально означает «возлюбленные» и перекликается с неоднократно повторёнными в этом стихе словами «любить» и «любовь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Возлюбленные
  rationale: Форма обращения во множественном числе. «Возлюбленные» сохраняет смысл и заметную связь с повторяющимися в стихе словами ἀγαπάω и ἀγάπη; более разговорная альтернатива вынесена в сноску.
- source_word: ἀγαπῶμεν
  choice: будем любить
  rationale: Настоящее сослагательное первого лица множественного числа выражает призыв. «Будем любить» естественно передаёт побуждение, не усиливая явно подразумеваемую длительность действия.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычный и естественный русский эквивалент взаимного местоимения.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание призыва и здесь имеет ясное причинное значение.
- source_word: ἡ ἀγάπη
  choice: любовь
  rationale: Артикль допускает обобщённое употребление; по-русски естественно существительное без дополнительного определителя.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ указывает на источник или происхождение; «от Бога» точно и естественно передаёт эту мысль.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: каждый, кто любит
  rationale: Субстантивированное причастие с πᾶς обозначает всякого человека, характеризуемого любовью; придаточная конструкция естественна для современного русского языка.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: рождён от Бога
  rationale: Перфект пассивного залога указывает на совершившееся рождение с сохраняющимся результатом. Краткая форма «рождён» в русском естественно описывает наличное состояние, а «от Бога» сохраняет значение источника.
- source_word: γινώσκει τὸν θεόν
  choice: знает Бога
  rationale: Настоящее время прямо передаёт продолжающееся знание Бога; вариант «познал Бога» необоснованно сдвинул бы акцент к началу этого знания.
theological_decisions:
- issue: Связь любви, рождения от Бога и знания Бога
  choice: 'Сохранить прямое утверждение: каждый любящий рождён от Бога и знает Бога.'
  alternative: Истолковать фразу как техническое доказательство определённого порядка спасения либо свести её к нравственному наставлению без связи с рождением от Бога.
  rationale: Греческий текст прямо связывает любовь с рождением от Бога и знанием Бога, но сам по себе не разворачивает конфессиональную схему порядка спасения.
- issue: Повтор корня ἀγαπ-
  choice: Передать однокоренными русскими словами «Возлюбленные», «любить», «любовь», «любит».
  alternative: Использовать более разговорное обращение «Дорогие друзья», ослабив слышимый повтор.
  rationale: Повтор составляет важную литературную и богословскую особенность стиха; основной текст по возможности сохраняет её, а естественная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского обращения. «Возлюбленные» несколько возвышенно, но понятно и оправданно важным повтором корня; остальная фраза построена просто и естественно.
