source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: ru
  text: И мы познали любовь Бога в нас и поверили в неё.[a] Бог есть любовь. Кто пребывает в любви, тот пребывает в Боге, и Бог пребывает в нём.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «любовь Бога среди нас». Греческое выражение может указывать на любовь, пребывающую в верующих или проявляющуюся в их общине.'
    reason: alternative_reading
  - marker: b
    text: «В нём» относится к каждому, кто пребывает в любви; мужской род единственного числа здесь употреблён в обобщающем значении.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: познали
  rationale: Русский совершенный вид передаёт состоявшееся обретение знания, результат которого сохраняется; «познали» также соответствует характерному для Иоанна языку личного и опытного знания.
- source_word: πεπιστεύκαμεν
  choice: поверили в неё
  rationale: Совершенный вид выражает состоявшееся и сохраняющее силу доверие. Местоимение «в неё» добавлено ради естественного русского управления и ясно соотнесено с любовью.
- source_word: τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: любовь Бога к нам
  rationale: Это естественная русская формулировка контекстуального смысла Божьей любви, обращённой к верующим. Поскольку буквальное ἐν ἡμῖν допускает значения «в нас» и «среди нас», эта неоднозначность отмечена в сноске.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Бог есть любовь
  rationale: Прямая и устойчивая передача именного сказуемого без поясняющего расширения; связка «есть» сохраняет торжественный, но понятный регистр.
- source_word: ὁ μένων
  choice: кто пребывает
  rationale: «Пребывает» сохраняет ключевую для Иоанна идею продолжающегося, устойчивого нахождения; конструкция с «кто» естественна в современном русском.
- source_word: ἐν τῇ ἀγάπῃ
  choice: в любви
  rationale: Естественно передаёт любовь как сферу продолжающейся жизни и отношений, не сводя её к отдельному чувству.
- source_word: ἐν τῷ θεῷ μένει
  choice: пребывает в Боге
  rationale: Сохраняет предлог и повтор глагола μένω, важный для темы взаимного пребывания.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: Бог пребывает в нём
  rationale: Сохраняет взаимность конструкции и грамматический мужской род единственного числа, который здесь имеет обобщающее значение.
theological_decisions:
- issue: Значение ἐν ἡμῖν в первой части стиха
  choice: В основном тексте передать контекстуальный смысл как «любовь Бога к нам», а буквальную пространственную неоднозначность сохранить в сноске.
  alternative: «любовь Бога в нас» или «любовь Бога среди нас»
  rationale: Предлог ἐν буквально указывает на нахождение «в» или «среди», тогда как контекст допускает восприятие этой любви как Божьей любви к верующим. Ни внутреннее пребывание, ни проявление любви в общине не следует исключать; поэтому они указаны как возможные понимания, а не устранены молча.
- issue: Взаимное пребывание Бога и верующего
  choice: 'Сохранить симметрию: «пребывает в Боге, и Бог пребывает в нём».'
  alternative: Пояснить это как духовное единение или общение
  rationale: Исходный текст утверждает взаимное пребывание без определения его механизма; перевод не должен добавлять конфессиональное толкование.
- issue: Обобщающее значение αὐτῷ
  choice: «в нём» с пояснением представительного значения в сноске
  alternative: «в таком человеке» или «в этом человеке»
  rationale: Мужской род соответствует форме греческого текста и русской конструкции «кто… тот», но относится к любому человеку, пребывающему в любви.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной библейской возвышенностью. «Пребывает» сохранено как узнаваемый богословски значимый термин Иоанновой лексики, тогда как остальной синтаксис сделан простым и понятным. Повтор «пребывает» намеренно соответствует повтору μένει.
