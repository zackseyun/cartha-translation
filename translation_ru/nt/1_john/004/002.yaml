  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: ru
  text: 'По этому признаку вы узнаёте[a] Духа Божьего: всякий дух, исповедующий Иисуса Мессию[b], пришедшего во плоти[c], — от Бога.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнавайте». Греческая форма может быть как изъявительной, так и повелительной.'
    reason: grammatical_alternative
  - marker: b
    text: 'Или: «Иисуса Христа». Греческое Χριστός — титул со значением «Мессия», то есть «Помазанник».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «исповедующий Иисуса Мессию как пришедшего во плоти». Греческое перфектное причастие указывает на совершившееся пришествие, значение которого сохраняется.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: По этому признаку
  rationale: Оборот вводит критерий распознавания. Добавление подразумеваемого слова «признаку» делает выражение естественным по-русски, сохраняя инструментальный смысл.
- source_word: γινώσκετε
  choice: вы узнаёте
  rationale: Форма допускает изъявительное и повелительное понимание; в контексте она прежде всего сообщает, как распознать Божьего Духа. Возможное повелительное прочтение отмечено в сноске.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Духа Божьего
  rationale: Определённая форма и противопоставление различным духам указывают на Божьего Духа. Заглавная буква передаёт это понимание, не добавляя отдельного наименования «Святой Дух».
- source_word: πᾶν πνεῦμα
  choice: всякий дух
  rationale: Распределительное выражение охватывает всякое духовное влияние или заявление, подлежащее проверке; строчная буква сохраняет отличие от Божьего Духа.
- source_word: ὁμολογεῖ
  choice: исповедующий
  rationale: Глагол означает открыто признавать и исповедовать. Причастная конструкция естественно связывает его со словом «дух».
- source_word: Ἰησοῦν Χριστόν
  choice: Иисуса Мессию
  rationale: Χριστός здесь сохраняет смысл титула, поэтому передан словом «Мессия», а не как фамильная часть имени. Вариант «Иисуса Христа» указан в сноске.
- source_word: ἐν σαρκὶ
  choice: во плоти
  rationale: Точное и укоренённое русское выражение утверждает реальность телесного человеческого пришествия Иисуса.
- source_word: ἐληλυθότα
  choice: пришедшего
  rationale: Перфектное причастие определяет Иисуса Мессию и указывает на совершившееся пришествие с сохраняющимся значением. Русское причастие наиболее близко воспроизводит греческую конструкцию.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: от Бога
  rationale: ἐκ обозначает источник или происхождение; краткая русская конструкция естественно передаёт смысл «происходит от Бога».
theological_decisions:
- issue: Относится ли τὸ πνεῦμα τοῦ θεοῦ непосредственно к Божьему Духу или вообще к духу от Бога
  choice: Духа Божьего
  alternative: духа от Бога
  rationale: Единственное число с артиклем на фоне последующего «всякий дух» естественно указывает на Божьего Духа, распознаваемого среди истинных и ложных духов.
- issue: Христологический смысл ἐν σαρκὶ ἐληλυθότα
  choice: пришедшего во плоти
  alternative: который пришёл как человек
  rationale: Формулировка сохраняет собственные слова текста и утверждает действительное воплощённое пришествие Иисуса, не вводя отсутствующей в греческом позднейшей технической терминологии.
- issue: Синтаксическая связь Ἰησοῦν Χριστὸν с ἐληλυθότα
  choice: Иисуса Мессию, пришедшего во плоти
  alternative: Иисуса Мессию как пришедшего во плоти
  rationale: Согласованное причастие непосредственно определяет Иисуса Мессию. Основной текст сохраняет эту структуру, а альтернативная формулировка в сноске яснее выражает зависимость от глагола исповедания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «По этому признаку» звучит естественнее буквального «в этом»; «исповедующий» и «во плоти» сохраняют богословскую точность без архаизации. Тире перед «от Бога» помогает ясно прочитать составное именное сказуемое.
