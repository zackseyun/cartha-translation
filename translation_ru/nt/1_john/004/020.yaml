source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: ru
  text: 'Если кто говорит: «Я люблю Бога», — а брата своего ненавидит, тот лжец; ведь тот, кто не любит своего брата, которого видел, не может любить Бога, которого не видел.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «как может любить Бога, которого не видел?»'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Если кто говорит
  rationale: Сочетание ἐάν с аористом сослагательного наклонения выражает общее условие; эта формулировка естественна для современного литературного русского языка.
- source_word: Ἀγαπῶ τὸν θεόν
  choice: Я люблю Бога
  rationale: Прямой перевод сохраняет настоящее время и повторение глагола ἀγαπάω далее в стихе.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: брата своего / своего брата
  rationale: Сохраняет мужской род и единственное число греческого ἀδελφός, не исключая его представительного употребления в контексте.
- source_word: μισῇ
  choice: ненавидит
  rationale: Простое настоящее время естественно передаёт длительный или характерный смысл настоящего сослагательного в условной конструкции.
- source_word: ψεύστης ἐστίν
  choice: тот лжец
  rationale: Сохраняет категоричное именное суждение Иоанна, а не ослабляет его до «тот лжёт».
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: Ведь кто не любит
  rationale: «Ведь» передаёт пояснительную функцию γάρ, а «кто не любит» естественно передаёт субстантивированное причастие.
- source_word: ὃν ἑώρακεν / ὃν οὐχ ἑώρακεν
  choice: которого видит / которого не видит
  rationale: Русское настоящее время здесь естественно выражает доступность брата зрению в противопоставлении невидимому Богу; буквальное «которого видел» могло бы ошибочно звучать как указание лишь на прошлую встречу.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: не может любить
  rationale: Сохраняет сильное утверждение о невозможности, выраженное δύναται с отрицанием.
theological_decisions:
- issue: Значение ἀδελφός в обращении к общине
  choice: брат
  alternative: брат или сестра; единоверец
  rationale: Основной текст сохраняет грамматически мужскую форму единственного числа и образ исходного текста; возможное представительное значение поясняется в сноске без конфессионального сужения до «единоверца».
- issue: Сила выражения οὐ δύναται ἀγαπᾶν
  choice: не может любить Бога
  alternative: не способен любить Бога
  rationale: Выбранная формулировка сохраняет категорическую морально-духовную невозможность в логике стиха и не добавляет объяснения её природы.
- issue: Текстовый вариант в заключительной части стиха
  choice: не может любить Бога
  alternative: как может любить Бога?
  rationale: SBLGNT печатает οὐ δύναται, поддерживая утвердительное «не может». В рукописной традиции засвидетельствовано вопросительное πῶς δύναται; значимый вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «любит / любить» сохранён ради лексической связи в оригинале. Местоимение «тот» делает синтаксис условия прозрачным. Сноска помещена после всего предложения и её маркер присутствует в основном тексте.
