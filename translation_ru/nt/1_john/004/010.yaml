base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: ru
  text: 'Любовь заключается вот в чём: не в том, что мы полюбили Бога, а в том, что Он полюбил нас и послал Своего Сына как искупительную жертву за наши грехи.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву умилостивления»; возможно также: «жертву очищения от грехов». Греческое слово ἱλασμός относится к жертвенному обращению с грехами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Любовь заключается вот в чём
  rationale: Естественно передаёт указательную конструкцию Иоанна, направленную на последующее определение любви, и сохраняет её смысловой акцент.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: не в том, что… а в том, что
  rationale: Сохраняет противопоставление, определяющее, в чём состоит любовь, а не превращает его в причинное пояснение.
- source_word: ἠγαπήκαμεν
  choice: мы полюбили
  rationale: Русская форма совершенного вида естественно передаёт результативность греческого перфекта; буквальное «мы возлюбили» звучало бы архаично.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: Он полюбил нас
  rationale: Местоимение с прописной буквы ясно указывает на Бога; структура «не… а…» передаёт эмфатическое противопоставление αὐτός.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: послал Своего Сына
  rationale: Точно и естественно сохраняет значимый для Иоанна язык послания Сына; «Своего» однозначно соотносит Сына с Богом.
- source_word: ἱλασμὸν
  choice: как искупительную жертву
  rationale: Передаёт жертвенный способ действенного устранения грехов без сведения спорного термина исключительно к умилостивлению или очищению; «как» делает русскую предикативную конструкцию естественной.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: за наши грехи
  rationale: В контексте жертвенной терминологии περί естественно передаётся русским «за».
theological_decisions:
- issue: Передача ἱλασμός в богословски значимом контексте искупления
  choice: искупительная жертва
  alternative: умилостивление; жертва умилостивления; жертва очищения
  rationale: Основной текст ясно сообщает, что Сын как жертва действенно решает проблему грехов, но не определяет односторонне, следует ли понимать термин прежде всего как умилостивление или как очищение от греха. Лексические варианты сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранено определительное противопоставление исходного текста; избегнуты как архаическое «возлюбили», так и узкоконфессиональное разрешение смыслового диапазона ἱλασμός.
