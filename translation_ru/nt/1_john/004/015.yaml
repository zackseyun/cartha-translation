  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: ru
  text: Кто исповедует, что Иисус — Сын Божий, в том пребывает Бог, и он — в Боге.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в том остаётся Бог, и он остаётся в Боге». Греческий глагол μένω — важное слово в произведениях Иоанна; он может означать «оставаться» или «пребывать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Кто
  rationale: Сочетание относительного местоимения с ἐάν образует обобщённо-условную конструкцию; русское «кто» естественно передаёт значение «всякий, кто» без утяжеления.
- source_word: ὁμολογήσῃ
  choice: исповедует
  rationale: В контексте 1 Иоанна глагол означает открытое признание истины об Иисусе. «Исповедует» сохраняет как публичный, так и богословский оттенок; аорист конъюнктива в обобщённой конструкции естественно передаётся русским настоящим временем.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: Иисус — Сын Божий
  rationale: Именное сказуемое с титулом естественно оформляется тире. «Сын Божий» сохраняет определённый христологический титул и звучит нормативно в современном литературном русском.
- source_word: ἐν αὐτῷ μένει
  choice: в том пребывает
  rationale: «Пребывает» передаёт длительный, реляционный смысл ключевого для Иоанна глагола μένω. Указательное «в том» ясно соотносится с обобщённым «кто» и избегает неоднозначности местоимения «нём».
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: и он — в Боге
  rationale: 'Сохранён греческий эллипсис: глагол μένει подразумевается из первой части. Тире помогает современному русскому читателю распознать пропущенное сказуемое и сохраняет риторическую взаимность формулировки.'
theological_decisions:
- issue: Взаимное пребывание Бога и человека
  choice: 'Сохранить взаимную формулу: «в том пребывает Бог, и он — в Боге» без поясняющего расширения.'
  alternative: «Бог живёт в нём, и он живёт в Боге»; «Бог пребывает в нём, и он пребывает в Боге».
  rationale: Текст связывает исповедание Иисуса Сыном Божьим со взаимным пребыванием Бога и исповедующего. Перевод не сводит эту формулу к простой близости и не добавляет её позднейшего богословского истолкования.
- issue: Христологический титул
  choice: Передать ὁ υἱὸς τοῦ θεοῦ как «Сын Божий».
  alternative: «Божий Сын»; «Сын Бога».
  rationale: «Сын Божий» — точный, ясный и устойчивый русский эквивалент полного титула, не добавляющий толкования к греческому тексту.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. «Исповедует» и «пребывает» несколько возвышенны, но понятны и оправданы ключевой богословской лексикой текста. Эллипсис второй части сохранён и обозначен тире.
