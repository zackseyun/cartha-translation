  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: ru
  text: 'И мы имеем от Него эту заповедь: тот, кто любит Бога, должен любить и своего брата[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего брата или свою сестру». В греческом тексте стоит форма мужского рода единственного числа — «брата», которая может употребляться обобщённо, обозначая другого верующего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: заповедь
  rationale: Сохраняет нравственно обязывающую и авторитетную силу слова в контексте Иоанновых писаний и естественно звучит по-русски.
- source_word: ἀπ’ αὐτοῦ
  choice: от Него
  rationale: Передаёт греческое местоимение, не заменяя его явным «от Бога»; прописная буква помогает естественно обозначить отсылку к Богу в русском религиозном тексте.
- source_word: ἵνα
  choice: двоеточие и конструкция «должен любить»
  rationale: Здесь союз вводит содержание заповеди, а не явно выраженную цель; по-русски это естественно передаётся пояснением после двоеточия.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: любящий Бога
  rationale: Субстантивированное причастие сохраняет единственное число и обобщающий характер греческой конструкции, оставаясь кратким и литературным.
- source_word: ἀγαπᾷ
  choice: должен любить
  rationale: Передаёт предписывающую силу сослагательного наклонения после ἵνα как содержание заповеди, не превращая высказывание в простое утверждение.
- source_word: καὶ τὸν ἀδελφὸν αὐτοῦ
  choice: и своего брата
  rationale: «И» сохраняет добавочное значение καί, а возвратное «своего» естественно передаёт принадлежность при соотнесённости с субъектом; «брата» сохраняет мужской род и единственное число оригинала.
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: любить / любящий
  rationale: Единообразно сохраняет ключевую для послания лексику любви.
theological_decisions:
- issue: Референт местоимения в ἀπ’ αὐτοῦ
  choice: Сохранить «от Него»
  alternative: «от Бога»
  rationale: В ближайшем контексте местоимение естественно относится к Богу, однако оригинал не повторяет существительное; местоименная форма сохраняет ход мысли источника.
- issue: Мужской род и единственное число в ἀδελφὸν αὐτοῦ
  choice: «своего брата» в основном тексте с пояснением в сноске
  alternative: «брата или сестру»; «единоверца»
  rationale: Греческая форма буквально мужского рода и единственного числа, но может репрезентативно обозначать другого верующего. Основной текст сохраняет форму источника, а широкий смысл отмечен без конфессионального сужения в сноске.
- issue: Степень обязательности формы ἀγαπᾷ после ἵνα
  choice: «должен любить»
  alternative: «пусть любит»; «любит»
  rationale: Контекст заповеди требует нормативного смысла. «Должен» ясно передаёт обязанность, тогда как изъявительное «любит» ослабило бы предписание.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Начальное καί передано как «И вот», что естественно связывает стих с предыдущим рассуждением и вводит формулировку заповеди. Синтаксис слегка перестроен посредством двоеточия для естественной передачи содержательного ἵνα.
