  text: ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: ru
  text: Кто не любит, тот не познал Бога[a], потому что Бог есть любовь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не знает Бога». Форма греческого глагола может быть передана настоящим временем, однако «не познал» подчёркивает, что такой человек не пришёл к познанию Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Кто не любит, тот
  rationale: Субстантивированное причастие настоящего времени обозначает всякого человека, для которого характерно отсутствие любви. Русская конструкция «кто… тот» естественно передаёт обобщённое значение и сохраняет продолжающийся или характерный характер действия.
- source_word: ἀγαπῶν
  choice: любит
  rationale: Выбрано однокоренное соответствие существительному «любовь» далее в стихе, чтобы сохранить смысловую и словесную связь ἀγαπῶν и ἀγάπη.
- source_word: οὐκ ἔγνω
  choice: не познал
  rationale: Совершенный вид передаёт аорист и смысл «не пришёл к познанию». Глагол «познал» в данном контексте обозначает не только интеллектуальное понимание, но и личное, действенное знание Бога.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Прямое дополнение к «познал»; стандартное русское соответствие.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предыдущего утверждения; «потому что» ясно выражает причинную связь.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Подлежащее греческого предложения; сохранено без перестановки, которая могла бы обратить смысл высказывания.
- source_word: ἀγάπη
  choice: любовь
  rationale: Абстрактное существительное точно передаёт именную часть сказуемого и сохраняет связь с глаголом «любит».
- source_word: ἐστίν
  choice: есть
  rationale: Связка сохранена явно, чтобы естественно и весомо передать именное высказывание «Бог есть любовь», не превращая его в менее сильное «Бог любит» или «Бог любящий».
theological_decisions:
- issue: Смысл высказывания «Бог есть любовь»
  choice: Сохранено как предикативное утверждение о Божьем характере и природе, без превращения его в исчерпывающее определение.
  alternative: «Бог любящий»; «Любовь есть Бог»
  rationale: В греческом тексте ὁ θεὸς является определённым подлежащим, а ἀγάπη — именной частью сказуемого. Поэтому обратное утверждение «Любовь есть Бог» грамматически и богословски не оправдано, а «Бог любящий» ослабляет силу существительного.
- issue: Аспект и характер познания Бога
  choice: «не познал Бога»
  alternative: «не знает Бога»; «не понял Бога»
  rationale: Аорист ἔγνω допускает акцент на том, что человек не пришёл к познанию Бога. «Познал» также сохраняет личностный и жизненный характер знания в контексте Иоанна, не сводя его к интеллектуальному пониманию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулировкой. Конструкция «кто… тот» общепонятна и естественна; выражение «Бог есть любовь» сохраняет краткость, вес и структуру исходного утверждения.
