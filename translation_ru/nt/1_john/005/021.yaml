lexical_decisions:
- source_word: Τεκνία
  choice: Дети мои
  rationale: Ласковое уменьшительное обращение Иоанна к адресатам. В современном русском «Дети мои» естественно передаёт пастырскую теплоту и семейную близость; местоимение «мои» выражает заложенный в обращении оттенок привязанности, не утверждая буквального возраста адресатов.
- source_word: φυλάξατε
  choice: храните
  rationale: Аористный императив во втором лице множественного числа выражает настоятельный призыв к бдительности. «Храните себя» — естественное и достойное русское сочетание со значением оберегать себя и не допускать сближения с опасностью.
- source_word: ἑαυτὰ
  choice: себя
  rationale: Возвратное местоимение прямо сохраняет направленность действия на самих адресатов.
- source_word: ἀπὸ
  choice: от
  rationale: Предлог обозначает удаление и отделение; русский «от» точно и лаконично передаёт эту связь.
- source_word: εἰδώλων
  choice: идолов
  rationale: Слово обозначает идолов или культовые изображения, связанные с ложным поклонением. «Идолы» — прямой и общепонятный эквивалент, не расширяющий смысл до всего, что может занять место Бога.
theological_decisions:
- issue: Объём значения «идолы»
  choice: Сохранить конкретное «идолы» без поясняющего расширения.
  alternative: «всё, что становится идолом» или «ложное поклонение»
  rationale: Греческий текст прямо называет идолов. Более широкое применение возможно как богословский вывод, но его не следует вносить в сам перевод.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная заключительная заповедь. Обращение сохраняет пастырскую теплоту оригинала, а формулировка не расширяет конкретное упоминание идолов.
