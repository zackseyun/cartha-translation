  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: ru
  text: И мы знаем, что Сын Божий пришёл и дал нам разумение, чтобы мы знали Истинного. И мы — в Истинном, в Его Сыне Иисусе Мессии. Этот[a] — истинный Бог и вечная жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое указательное местоимение οὗτός («этот») может относиться непосредственно к Иисусу Мессии, ближайшему названному лицу; некоторые понимают его как отсылку к Истинному, то есть к Отцу, упомянутому выше.
    reason: Неоднозначный антецедент греческого указательного местоимения οὗτός.
lexical_decisions:
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Перфектная по форме лексема οἶδα имеет значение настоящего состояния и выражает твёрдое знание.
- source_word: ἥκει
  choice: пришёл
  rationale: Передаёт совершившийся приход Сына с сохраняющимся результатом; русское прошедшее совершенного вида естественно выражает это в данном контексте.
- source_word: δέδωκεν
  choice: дал
  rationale: 'Совершенный вид передаёт состоявшийся дар; сохраняющийся результат понятен из цели: теперь верующие способны знать Истинного.'
- source_word: διάνοιαν
  choice: разумение
  rationale: Обозначает данную способность понимать и распознавать истину; «разумение» звучит достойно и точнее контекстуального «ум».
- source_word: ἵνα γινώσκωμεν
  choice: чтобы мы знали
  rationale: Сохраняет целевое значение ἵνα и не добавляет отсутствующей в тексте идеи постепенного познания.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: Истинного / в Истинном
  rationale: Субстантивированное прилагательное относится к Личности; одинаковая лексема в обеих фразах сохраняет иоанновский повтор.
- source_word: ἐσμὲν ἐν
  choice: мы — в
  rationale: Буквально сохраняет характерный для Иоанна язык пребывания и отношения, не подменяя его толкованием вроде «соединены с».
- source_word: Ἰησοῦ Χριστῷ
  choice: Иисусе Мессии
  rationale: Χριστός здесь сохраняет титульный смысл; «Мессия» ясно передаёт значение Помазанника, а не воспринимается только как часть имени.
- source_word: οὗτός
  choice: Он
  rationale: Естественное русское личное местоимение; неоднозначность его антецедента явно отмечена сноской.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: истинный Бог
  rationale: Точное и укоренённое русское соответствие греческому выражению.
- source_word: ζωὴ αἰώνιος
  choice: вечная жизнь
  rationale: Естественная и традиционная передача иоанновского выражения, охватывающего непреходящую жизнь и её особое качество.
theological_decisions:
- issue: К кому относится οὗτός в заключительном предложении
  choice: В основном тексте «Он» естественнее всего соотносится с ближайшим личным предшественником — Иисусом Мессией.
  alternative: Местоимение может возвращаться к «Истинному», то есть к Отцу, упомянутому в предыдущей части стиха.
  rationale: Ближайшим грамматическим антецедентом является Сын, однако синтаксис допускает исторически известное альтернативное понимание. Сноска сохраняет эту богословскую и грамматическую напряжённость, не устраняя её.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Но» естественно передаёт δέ в контексте завершающего утверждения; тире в «мы — в» и перед именной частью заключительного предложения облегчает чтение. Заглавная буква в «Истинном» обозначает личное именование, не меняя значения прилагательного.
