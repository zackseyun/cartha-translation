id: 1JN.5.3
reference: 1 John 5:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: ru
  text: Ведь любовь к Богу состоит в том, чтобы мы соблюдали Его заповеди[a]. И Его заповеди не тяжки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любовь Божья». Греческое выражение может означать как любовь к Богу, так и любовь, исходящую от Бога, хотя ближайший контекст скорее говорит о любви к Богу.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: состоит в том
  rationale: Указательное местоимение вместе с последующим ἵνα вводит пояснение того, в чём выражается любовь; эта конструкция естественно передаёт смысл по-русски.
- source_word: γάρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущим стихом естественным современным русским союзом.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: любовь к Богу
  rationale: Ближайший контекст связывает любовь верующих к Богу с исполнением Его заповедей, поэтому объектное понимание родительного падежа наиболее вероятно.
- source_word: ἵνα
  choice: в том, чтобы
  rationale: Здесь союз вводит содержание и практическое выражение любви, а не цель.
- source_word: ἐντολάς
  choice: заповеди
  rationale: Сохраняет весомость понятия и привычное для Иоанновых текстов словоупотребление.
- source_word: τηρῶμεν
  choice: соблюдали
  rationale: Естественно передаёт значение соблюдения и исполнения заповедей без архаичности.
- source_word: βαρεῖαι
  choice: тяжки
  rationale: Краткая литературная форма точно передаёт образ тяжести и смысл обременительности; выражение «заповеди не тяжки» ясно и достойно по регистру.
theological_decisions:
- issue: Значение родительного оборота ἡ ἀγάπη τοῦ θεοῦ
  choice: 'объектное: любовь верующих к Богу'
  alternative: 'субъектное: Божья любовь к людям; возможно также сохранение обеих сторон значения'
  rationale: В стихах 2–3 любовь к Богу непосредственно связывается с соблюдением Его заповедей, поэтому объектное прочтение предпочтительно. Существующая грамматическая неоднозначность отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и торжественная без выраженной архаизации. Заглавное «Его» соответствует принятому благоговейному библейскому регистру.
