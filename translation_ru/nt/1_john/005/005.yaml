source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: ru
  text: Кто же побеждает мир, как не тот, кто верит, что Иисус — Сын Божий?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «побеждающий… верующий». В греческом здесь употреблены причастия мужского рода единственного числа в обобщающем значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ⸂δέ ἐστιν⸃
  choice: Кто же
  rationale: Риторический вопрос продолжает мысль предыдущего стиха. Частица «же» естественно передаёт лёгкую связующую и выделительную силу δέ, а связка ἐστιν в русском настоящем времени не требует отдельного выражения.
- source_word: ὁ νικῶν
  choice: тот, кто побеждает
  rationale: Субстантивированное причастие настоящего времени обозначает человека, для которого победа характерна или продолжается; конструкция «тот, кто побеждает» сохраняет глагольную силу и естественна по-русски.
- source_word: τὸν κόσμον
  choice: мир
  rationale: Сохранено простое наименование κόσμος без пояснительного расширения вроде «мировой порядок», которое сузило бы и истолковало смысл за читателя.
- source_word: εἰ μὴ
  choice: как не
  rationale: В риторическом вопросе эта конструкция выражает исключительность; русское «как не» передаёт её естественно и ясно.
- source_word: ὁ πιστεύων
  choice: тот, кто верит
  rationale: Субстантивированное причастие настоящего времени передано глагольной конструкцией, сохраняющей значение веры как характерного действия, а не отвлечённого статуса.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание веры, а не причину.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Устоявшаяся русская форма личного имени.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Устоявшаяся в русском языке форма христологического титула, сохраняющая определённость и исповедальный вес греческого выражения.
theological_decisions:
- issue: Передача субстантивированных причастий мужского рода ὁ νικῶν и ὁ πιστεύων
  choice: тот, кто побеждает / тот, кто верит
  alternative: побеждающий / верующий; человек, который побеждает / верит
  rationale: Греческий мужской род имеет здесь обобщающее, представительское значение. Русская конструкция «тот, кто…» сохраняет число, глагольность и грамматическую форму, не ограничивая смысл только мужчинами.
- issue: Христологическое исповедание ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  alternative: Сын Бога
  rationale: «Сын Божий» — точная и естественная для современного литературного русского форма титула; она не расширяет и не ослабляет утверждение текста о личности Иисуса.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной риторической конструкцией. Порядок слов и частица «же» сохраняют связь с предшествующим контекстом; тире перед именной частью сказуемого соответствует нормам русского письма.
