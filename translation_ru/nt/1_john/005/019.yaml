base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: ru
  text: Мы знаем, что мы от Бога, и весь мир лежит во власти лукавого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «весь мир лежит в лукавом». Греческое выражение, вероятнее всего, относится к личному «лукавому»; возможен также смысл: «во зле».'
    reason: Лексическая альтернатива и возможное неоднозначное прочтение ἐν τῷ πονηρῷ.
lexical_decisions:
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Передаёт уверенное, установившееся знание и сохраняет тон убеждённости, характерный для послания.
- source_word: ἐκ τοῦ θεοῦ
  choice: мы от Бога
  rationale: Предлог ἐκ указывает на источник, происхождение или принадлежность. Формулировка «от Бога» сохраняет эту широту и не добавляет отсутствующего здесь глагола «рождены».
- source_word: ὁ κόσμος ὅλος
  choice: весь мир
  rationale: Естественно передаёт всеохватность выражения; в контексте Иоанна «мир» может обозначать человеческий миропорядок, противящийся Богу.
- source_word: ἐν τῷ πονηρῷ
  choice: во власти лукавого
  rationale: В контексте писаний Иоанна субстантивированное πονηρός вероятнее всего обозначает личного противника — лукавого. Добавление «во власти» естественно выражает по-русски состояние под его господством, подразумеваемое всей конструкцией, а более буквальная и абстрактная возможности отмечены в сноске.
- source_word: κεῖται
  choice: лежит
  rationale: Сохраняет образ греческого κεῖται и одновременно обозначает устойчивое состояние, в котором пребывает мир.
theological_decisions:
- issue: Обозначает ли τῷ πονηρῷ личного «лукавого» или безличное «зло»
  choice: 'Личное понимание: «лукавого»'
  alternative: 'Безличное понимание: «зла»; более формально также «лежит в лукавом»'
  rationale: В Первом послании Иоанна ὁ πονηρός обычно обозначает личного злого противника (2:13–14; 3:12; 5:18), поэтому личное понимание вероятнее. Однако грамматическая форма допускает восприятие как обозначение зла, и эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «А» естественно передаёт смысловое противопоставление между принадлежностью верующих Богу и состоянием всего мира. Слово «лукавый» сохраняет традиционно узнаваемое личное обозначение противника, а выражение «во власти» делает греческую конструкцию понятной современному читателю.
