  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: ru
  text: Всякая неправедность[a] — грех, и есть грех, не ведущий к смерти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякое неправое дело»; возможен также перевод: «всякая несправедливость».'
