  - marker: b
    text: 'Или: «не приводящий к смерти»; более буквально: «не к смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: всякая неправедность
  rationale: 'Сочетание передаёт всеохватный смысл: всякое проявление неправедности. «Неправедность» сохраняет широкий нравственно-богословский смысл ἀδικία и связь с понятием праведности.'
- source_word: ἁμαρτία
  choice: грех
  rationale: Прямой и контекстуально точный перевод обоих употреблений ἁμαρτία.
- source_word: καὶ
  choice: и
  rationale: Сохранён простой соединительный союз греческого текста без усиления или истолкования логической связи.
- source_word: οὐ πρὸς θάνατον
  choice: не ведущий к смерти
  rationale: Современная естественная передача направленности или результата, подразумеваемых оборотом πρὸς θάνατον; она также согласуется с формулировкой предыдущего стиха.
- source_word: θάνατον
  choice: смерти
  rationale: Прямой перевод без уточнения характера смерти, которого нет в греческом тексте.
theological_decisions:
- issue: Характер «смерти» в выражении о грехе, не ведущем к смерти
  choice: Оставить просто «смерть» без поясняющего определения
  alternative: Телесная смерть; духовная смерть; окончательное осуждение
  rationale: Греческий текст не уточняет, какой именно вид смерти имеется в виду, поэтому перевод сохраняет толковательную открытость.
- issue: Передача ἀδικία в широком нравственно-богословском утверждении
  choice: неправедность
  alternative: злодеяние; несправедливость; всякое неправое дело
  rationale: «Неправедность» не сужает смысл до общественной или юридической несправедливости и сохраняет связь с лексикой праведности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Именное сказуемое оформлено тире; конструкция «не ведущий к смерти» естественна для современного читателя и не устраняет смысловую неоднозначность слова «смерть».
