  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: ru
  text: Ведь каждый, кто рождён от Бога,[a] побеждает мир. И вот победа, победившая мир, — наша вера.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё, что рождено от Бога»; греческая форма среднего рода охватывает всех рождённых от Бога как целое.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наша верность». Греческое слово может в зависимости от контекста означать веру, доверие или верность; в основном тексте дано наиболее вероятное здесь значение «вера».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит основание для предшествующего утверждения; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: πᾶν τὸ γεγεννημένον
  choice: каждый, кто рождён
  rationale: Формально это субстантивированное причастие среднего рода, охватывающее весь класс рождённых от Бога; в контексте речь идёт о людях, поэтому личная конструкция естественна по-русски, а формальная особенность отмечена в сноске.
- source_word: γεγεννημένον
  choice: рождён
  rationale: Перфектное страдательное причастие указывает на совершившееся рождение с сохраняющимся результатом. Краткое причастие «рождён» естественно передаёт это состояние в конструкции «кто рождён».
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ выражает источник или происхождение; «рождён от Бога» — точная и естественная русская формулировка.
- source_word: νικᾷ
  choice: побеждает
  rationale: Передаёт настоящее время и сохраняет корневую связь с существительным νίκη и причастием νικήσασα.
- source_word: τὸν κόσμον
  choice: мир
  rationale: Сохраняет характерный для Иоанна термин без внесения в основной текст пояснения о противостоящем Богу мировом порядке.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: И вот победа
  rationale: «Вот» естественно передаёт указательное выделение αὕτη; именная конструкция с тире сохраняет смысл греческого текста.
- source_word: ἡ νικήσασα
  choice: победившая
  rationale: 'Причастие совершенного вида передаёт аорист как победу, представленную совершившейся, и сохраняет повтор одного корня: «побеждает — победа — победившая».'
- source_word: ἡ πίστις ἡμῶν
  choice: наша вера
  rationale: «Вера» — наиболее вероятное и обычное значение πίστις здесь; притяжательное местоимение прямо передаёт ἡμῶν.
theological_decisions:
- issue: Референт πᾶν τὸ γεγεννημένον
  choice: 'личное собирательное значение: «каждый, кто рождён от Бога»'
  alternative: «всё, что рождено от Бога»
  rationale: Хотя греческая форма среднего рода буквально допускает «всё, что», контекст говорит о верующих. Основной текст ясно передаёт личный референт, а формальная неоднозначность сохраняется в сноске.
- issue: Значение πίστις
  choice: «вера»
  alternative: «верность» или «доверие»
  rationale: В данном контексте «наша вера» наиболее естественно обозначает то, чем верующие одерживают победу. Лексически возможное значение «верность» сохранено в сноске без навязывания его основному тексту.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Сохранён риторический повтор одного корня: «побеждает — победа — победившая». Маркеры сносок размещены непосредственно после соответствующих выражений.'
