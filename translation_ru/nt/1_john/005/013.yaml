base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: ru
  text: Это я написал вам, верующим во имя Сына Божьего,[a] чтобы вы знали, что имеете вечную жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к порядку слов в греческом тексте: «Это я написал вам, чтобы вы знали, что имеете вечную жизнь, — тем, кто верит во имя Сына Божьего».'
    reason: Сохраняет возможную возобновляющую связь заключительной причастной конструкции и необычный греческий порядок слов.
lexical_decisions:
- source_word: Ταῦτα
  choice: Это
  rationale: Средний род множественного числа указывает на написанное в послании или на предшествующее изложение; по-русски собирательное «это» естественнее буквального «эти вещи».
- source_word: ἔγραψα
  choice: написал
  rationale: Аорист обозначает совершённое действие; в контексте письма естественно русское прошедшее время.
- source_word: ὑμῖν
  choice: вам
  rationale: Прямое соответствие дательному падежу адресата.
- source_word: ἵνα εἰδῆτε
  choice: чтобы вы знали
  rationale: Передаёт цель написанного и значение формы εἰδῆτε без излишней модальности.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устойчивое и точное выражение, сохраняющее как непреходящий характер, так и богословское содержание жизни.
- source_word: ἔχετε
  choice: имеете
  rationale: Настоящее время подчёркивает нынешнее обладание вечной жизнью, а не только будущую надежду.
- source_word: τοῖς πιστεύουσιν
  choice: верующим
  rationale: Причастие в дательном падеже естественно согласуется с «вам» и определяет адресатов; русская форма сохраняет компактность греческого выражения.
- source_word: πιστεύουσιν εἰς
  choice: верующим во
  rationale: Сохраняет характерную для Иоанна конструкцию веры, направленной на личность, и привычную библейскую формулировку.
- source_word: τὸ ὄνομα
  choice: имя
  rationale: Сохранён библейский образ имени как выражения личности и власти, без пояснительного перефразирования.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Сына Божьего
  rationale: Точно и естественно передаёт христологический титул и греческую родительную конструкцию.
theological_decisions:
- issue: Синтаксическая связь τοῖς πιστεύουσιν
  choice: 'Связано с ὑμῖν: «вам, верующим во имя Сына Божьего»'
  alternative: 'Возобновляющее приложение после утверждения: «чтобы вы знали, что имеете вечную жизнь, — вы, верующие во имя Сына Божьего»'
  rationale: Обе связи возможны при греческом порядке слов. Основной текст использует наиболее естественную по-русски идентификацию адресатов, а подлинная синтаксическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Инверсия «Это написал я» слегка маркирована, но естественна и сохраняет акцент греческого Ταῦτα ἔγραψα. Заглавные буквы в титуле «Сын Божий» соответствуют современной русской библейской традиции.
