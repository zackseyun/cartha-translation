  text: Дух, вода и кровь — и все трое сходятся в одном[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и трое — к одному». По контексту это, вероятно, означает, что их свидетельство согласно.'
    reason: Сохраняет необычную направленную конструкцию εἰς τὸ ἕν и поясняет её вероятный контекстуальный смысл без утверждения онтологического единства.
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В ближайшем контексте речь, вероятнее всего, идёт о Святом Духе как свидетеле; прописная буква передаёт этот определённый референт, не добавляя пояснения в текст.
- source_word: τὸ ὕδωρ
  choice: вода
  rationale: Сохранён конкретный образ исходного текста без уточнения его значения, которое сам стих не раскрывает.
- source_word: τὸ αἷμα
  choice: кровь
  rationale: Сохранён конкретный образ исходного текста без внесения в перевод его возможного толкования.
- source_word: οἱ τρεῖς
  choice: эти трое
  rationale: Указательное «эти» естественно связывает выражение с только что названными Духом, водой и кровью; форма «трое» сохраняет собирательный характер греческой субстантивированной конструкции.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: сходятся в одном
  rationale: Русское выражение передаёт направленность к одному и согласованность свидетельства, подразумеваемую контекстом, при этом не утверждая онтологического тождества трёх названных свидетелей.
theological_decisions:
- issue: Передаёт ли εἰς τὸ ἕν εἰσιν онтологическое единство или согласованность свидетельства
  choice: «эти трое сходятся в одном» — согласованность и направленность к одному
  alternative: «эти трое — одно» или более буквально «эти трое — к одному»
  rationale: Контекст 1 Ин. 5:6–8 посвящён свидетельству, поэтому согласованность трёх свидетелей наиболее вероятна. Вместе с тем сноска сохраняет необычную форму греческого выражения и не скрывает более буквальную возможность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, но понятная. Конкретные образы «вода» и «кровь» оставлены без поясняющего толкования.
