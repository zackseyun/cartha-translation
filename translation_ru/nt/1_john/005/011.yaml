  source_fidelity: 'Текст точно передаёт греческий оригинал: μαρτυρία передано как «свидетельство», ὅτι естественно раскрыто двоеточием, аорист ἔδωκεν — совершенным прошедшим «дал», а повтор указательного элемента и выражение ἐν τῷ υἱῷ αὐτοῦ сохранены. Смысловая компактность «жизнь — в его Сыне» соответствует оригиналу и не подменяет «в» толкованием «через» или «у».'
