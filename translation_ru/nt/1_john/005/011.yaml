  terminology: «Свидетельство», «вечная жизнь» и «Сын» удачно соответствуют иоанновскому словоупотреблению. Строчная буква в «его» отвечает современной русской орфографической норме, а прописная в титуле «Сын» уместна в данном христологическом контексте.
