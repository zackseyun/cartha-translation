  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: ru
  text: 'И вот в чём свидетельство: Бог дал нам вечную жизнь, и эта жизнь — в его Сыне.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρία
  choice: свидетельство
  rationale: Передаёт содержание того, о чём свидетельствует Бог, и естественно звучит в данном контексте.
- source_word: ὅτι
  choice: ':'
  rationale: Двоеточие естественно вводит по-русски содержание свидетельства, выраженное в греческом союзом ὅτι.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшийся и точный перевод, сохраняющий как непреходящий характер, так и богословскую полноту понятия жизни у Иоанна.
- source_word: ἔδωκεν
  choice: дал
  rationale: Русское совершенное прошедшее естественно передаёт завершённое действие; контекст показывает, что дар сохраняет силу в настоящем.
- source_word: ἡμῖν
  choice: нам
  rationale: Прямо передаёт дательный падеж и не сужает круг тех, с кем отождествляет себя автор.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: вот в чём ... эта жизнь
  rationale: Сохраняет указательную связь между свидетельством и названной затем жизнью, оставаясь естественным для современного русского языка.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: в его Сыне
  rationale: Сохраняет ёмкий иоанновский оборот с ἐν, не сводя его смысл к «через Сына» или «у Сына».
theological_decisions:
- issue: Временной и смысловой оттенок аориста ἔδωκεν
  choice: «дал нам вечную жизнь»
  alternative: «даровал нам вечную жизнь»
  rationale: Форма «дал» передаёт завершённость Божьего действия, а ближайший контекст — продолжающуюся реальность дара; перевод не добавляет отдельной догматической схемы.
- issue: Смысл выражения о жизни «в Сыне»
  choice: Сохранено «в его Сыне»
  alternative: «через его Сына» или «у его Сына»
  rationale: Предлог «в» удерживает намеренно насыщенную формулировку оригинала о связи вечной жизни с Сыном, не сводя её только к посредничеству или обладанию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «вот в чём свидетельство» естественно вводит содержание свидетельства; тире перед «в его Сыне» подчёркивает сказуемую группу без смыслового расширения. Местоимение «его» написано со строчной буквы по нормам современного русского письма, а «Сын» — с прописной как христологическое наименование.
