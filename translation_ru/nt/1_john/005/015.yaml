  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: ru
  text: И если мы знаем, что Он слышит нас, чего бы мы ни просили[a], то знаем, что имеем то, о чём мы просили у Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что бы мы ни просили». Греческая конструкция выражает открытое значение: всё, о чём бы мы ни просили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: Он слышит нас
  rationale: Оборот с родительным местоимения естественно передаётся как «слышит нас» в контексте молитвы; это не усиливает значение до «отвечает нам».
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: чего бы мы ни просили
  rationale: Неопределённо-относительная конструкция передаёт открытое, всеохватное значение «что бы ни / чего бы ни»; выбранный оборот естественен по-русски после «слышит нас».
- source_word: αἰτώμεθα
  choice: просили
  rationale: Глагол означает просьбу, здесь молитвенную; «просить» — прямой и естественный русский эквивалент.
- source_word: ἔχομεν
  choice: имеем
  rationale: Сохранено настоящее время и буквальное значение «иметь»; вариант «получаем» добавлял бы не выраженный прямо смысл.
- source_word: τὰ αἰτήματα
  choice: просимое нами
  rationale: Субстантивированное «просимое» естественно обозначает то, о чём просят, и сохраняет связь с глаголом «просить».
- source_word: ἃ ᾐτήκαμεν
  choice: просимое нами
  rationale: Компактная русская конструкция передаёт содержание совершенной просьбы с сохраняющейся актуальностью, избегая тяжёлого повтора «просьбы, которые мы попросили».
- source_word: ἀπ’ αὐτοῦ
  choice: у Него
  rationale: При русском глаголе «просить» нормативная конструкция «просить у кого-либо» естественно передаёт источник, выраженный ἀπό.
- source_word: οἴδαμεν
  choice: знаем
  rationale: Прямой эквивалент сохраняет повтор ключевого для послания глагола знания и уверенности.
theological_decisions:
- issue: Означает ли ἀκούει простое/благосклонное слышание молитвы или уже ответ на неё?
  choice: Он слышит нас
  alternative: Он отвечает нам
  rationale: Греческий текст прямо говорит о слышании, а затем отдельно выводит из него, что просимое уже имеется. «Отвечает» устранило бы это двухступенчатое рассуждение и разрешило бы богословское напряжение за текст.
- issue: Как передать настоящее ἔχομεν в отношении просимого?
  choice: имеем
  alternative: получаем
  rationale: «Имеем» сохраняет грамматическое настоящее и формулировку автора, не определяя дополнительно, каким образом и когда просимое осуществляется.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксический параллелизм «знаем… знаем» сохранён. Местоимение «Он» написано с прописной буквы по принятой русской библейской издательской норме; это не устраняет референциальной связи с Богом в контексте.
