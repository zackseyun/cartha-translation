  source_fidelity: 'Основной смысл передан верно: сохранены условное рассуждение, двукратное «знаем», «слышит», широкий охват «чего бы мы ни просили» и настоящее «имеем». Однако сочетание «имеем просимое нами у Него» синтаксически тяжеловесно и не вполне ясно передаёт ἀπ’ αὐτοῦ: «у Него» может быть понято как место или как обладание у Него, а не как Тот, у кого была испрошена эта вещь.'
  naturalness: «И если мы знаем… то знаем» — естественный литературный библейский синтаксис. Заменить «просимое нами у Него» на «то, о чём мы просили у Него» необходимо для ясной, современной и плавной русской фразы.
  terminology: «Слышит нас» точно сохраняет ἀκούει и не подменяет его «отвечает». «Чего бы мы ни просили» удачно передаёт неопределённо-относительную конструкцию ὃ ἐὰν. «Имеем» сохраняет настоящее ἔχομεν без богословски интерпретирующего «получаем».
