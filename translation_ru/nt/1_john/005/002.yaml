id: 1JN.5.2
reference: 1 John 5:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: ru
  text: 'Вот как мы узнаём, что любим детей Божьих: когда любим Бога и исполняем его заповеди[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делаем его заповеди»; возможно также: «соблюдаем его заповеди». Здесь употреблён греческий глагол ποιέω («делать, исполнять»), а не более обычный в таком сочетании τηρέω («соблюдать, хранить»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Вот как
  rationale: Естественная русская передача иоанновской формулы, указывающей на последующий признак или основание узнавания; сохраняет указательную силу выражения.
- source_word: γινώσκομεν
  choice: мы узнаём
  rationale: Настоящее время передаёт продолжающееся распознавание; «узнаём» естественно сочетается с вводным «вот как» и не усиливает смысл до абсолютной уверенности.
- source_word: ἀγαπῶμεν
  choice: любим
  rationale: Прямо и последовательно передаёт ἀγαπάω; русское настоящее время соответствует греческому.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: детей Божьих
  rationale: τέκνα означает детей без ограничения по полу; форма «детей Божьих» естественна для современного литературного русского и сохраняет отношение принадлежности.
- source_word: ὅταν
  choice: когда
  rationale: Сохраняет временно-условную широту греческого ὅταν с сослагательным наклонением, не сводя её исключительно к условному «если» или повторительному «всякий раз, когда».
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: исполняем его заповеди
  rationale: «Исполнять заповеди» — естественное русское сочетание, при этом оно ближе к буквальному ποιέω («делать, исполнять»), чем «соблюдать», обычно соответствующее τηρέω.
theological_decisions:
- issue: Связь любви к детям Божьим с любовью к Богу и исполнением его заповедей
  choice: Стих называет любовь к Богу и исполнение его заповедей признаком, по которому узнаётся любовь к детям Божьим, не уточняя, является ли эта связь причинной, доказательной или определяющей.
  alternative: Передать ὅταν исключительно условным «если» и тем самым подчеркнуть проверочный характер высказывания.
  rationale: Формулировка сохраняет краткость и напряжение греческого текста, не разрешая богословское соотношение сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанно возвышенной библейской интонацией. Местоимение «его» написано со строчной буквы согласно нейтральной современной орфографической практике; двоеточие сохраняет пояснительную структуру стиха.
