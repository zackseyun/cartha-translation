source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: ru
  text: 'Если мы принимаем свидетельство людей, то свидетельство Бога больше, ибо это свидетельство Бога: Он засвидетельствовал о Своем Сыне.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последние слова можно понять и как указание причины: «потому что Он засвидетельствовал о Своем Сыне».'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: свидетельство
  rationale: Сохраняет повтор ключевого слова и естественно передаёт доказательственный смысл в данном контексте.
- source_word: ἀνθρώπων
  choice: людей
  rationale: Форма имеет обобщённое значение и противопоставляет человеческое свидетельство Божьему; «людей» точно и естественно передаёт это в современном русском языке.
- source_word: λαμβάνομεν
  choice: принимаем
  rationale: В сочетании со «свидетельством» глагол означает признание или принятие свидетельства; «принимаем» идиоматичнее буквального «получаем».
- source_word: μείζων
  choice: больше
  rationale: Прямо передаёт сравнительную степень и утверждает превосходство Божьего свидетельства над человеческим.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: вот свидетельство Бога
  rationale: Указательное «вот» естественно вводит содержание свидетельства, сохраняя повтор слова «свидетельство».
- source_word: μεμαρτύρηκεν
  choice: засвидетельствовал
  rationale: 'Передаёт совершенный вид греческого перфекта: Бог уже дал свидетельство, и оно сохраняет силу.'
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: о Своём Сыне
  rationale: «О» естественно передаёт περί с родительным; возвратное «Своём» недвусмысленно относит Сына к Богу.
theological_decisions:
- issue: Значение второго ὅτι
  choice: 'изъяснительное: «Он засвидетельствовал о Своём Сыне»'
  alternative: 'причинное: «потому что Он засвидетельствовал о Своём Сыне»'
  rationale: После «вот свидетельство Бога» придаточное наиболее естественно раскрывает содержание свидетельства. Причинное понимание грамматически возможно и отмечено в сноске.
- issue: Обобщённое значение ἀνθρώπων
  choice: «людей»
  alternative: «человеческое свидетельство»
  rationale: Речь идёт обо всех людях в противопоставлении Богу, а не только о мужчинах; перевод не вносит гендерного ограничения, которого нет в смысле контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Повтор «свидетельство» сохранён как важный риторический и смысловой элемент; синтаксис слегка упрощён для ясности.
