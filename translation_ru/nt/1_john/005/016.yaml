source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: ru
  text: Если кто увидит, что его брат[a] совершает грех, не ведущий к смерти, пусть попросит Бога, и Он даст ему жизнь — тем, кто грешит не к смерти.[b] Есть грех, ведущий к смерти; я не говорю, что следует просить о таком грехе.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «брат» — слово в единственном числе мужского рода; в данном контексте оно, вероятно, обозначает единоверца и может относиться к члену христианской общины вообще.
    reason: cultural_note
  - marker: b
    text: Греческий текст не уточняет, означает ли здесь «смерть» физическую смерть, духовную смерть или окончательное осуждение. В выражении «есть грех, ведущий к смерти» также не уточняется, идёт ли речь об одном определённом грехе или о разряде грехов.
    reason: theological_ambiguity
  - marker: c
    text: 'Буквально: «и даст ему жизнь»; подлежащее в греческом тексте не названо, но из контекста просьбы подразумевается Бог. В первой части употреблён глагол «просить», а в последней — близкий по смыслу глагол; последняя фраза сформулирована не как прямой запрет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: брат
  rationale: Сохраняет мужской род и единственное число греческого слова; в контексте послания речь, вероятнее всего, идёт о члене христианской общины.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: совершает грех
  rationale: Естественно передаёт причастие с однокоренным дополнением и сохраняет указание на конкретный греховный поступок.
- source_word: μὴ πρὸς θάνατον
  choice: не ведущий к смерти
  rationale: Передаёт направленность или результат, выраженные πρός, не уточняя, о какой именно смерти идёт речь.
- source_word: αἰτήσει
  choice: пусть попросит
  rationale: Будущее изъявительное здесь имеет побудительный оттенок; такая форма ясна и естественна по-русски.
- source_word: δώσει αὐτῷ ζωήν
  choice: Бог даст ему жизнь
  rationale: В греческом подлежащее не выражено; контекст молитвенной просьбы указывает на Бога как подателя жизни. Слово «жизнь» оставлено без богословского уточнения.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: тем, кто совершает грех, не ведущий к смерти
  rationale: Оборот после тире сохраняет пояснительный характер трудной дательной конструкции и отражает переход греческого текста от единственного лица к множеству людей.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: есть грех, ведущий к смерти
  rationale: Сохраняет краткость и неопределённость безартиклевой греческой конструкции, не решая, имеется ли в виду один определённый поступок или разряд грехов.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: я не говорю, что следует просить об этом
  rationale: Естественно передаёт осторожную формулировку автора и не превращает её в прямой запрет молиться.
theological_decisions:
- issue: Смысл «смерти» в выражении «грех, ведущий к смерти»
  choice: Оставить слово «смерть» без уточнения.
  alternative: Физическая смерть как суд Божий; духовная смерть; окончательное осуждение.
  rationale: Сам стих не определяет вид смерти, поэтому перевод сохраняет подлинную богословскую неоднозначность.
- issue: Кто даёт жизнь
  choice: Явно назвать Бога подателем жизни.
  alternative: Оставить местоименное «он» либо понимать подлежащим молящегося.
  rationale: Хотя подлежащее при δώσει не выражено, контекст просьбы к Богу наиболее естественно указывает на Бога; примечание сообщает о буквальной форме.
- issue: Просьба о грехе, ведущем к смерти
  choice: Передать как «не говорю, что следует просить», а не как прямой запрет.
  alternative: «Запрещаю просить» или «не следует молиться».
  rationale: Греческая фраза не содержит прямого запрета и не утверждает явно, что такая просьба недопустима.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Повтор слова «грех» и переход от единственного лица к множеству сохранены ради близости к структуре оригинала; тире обозначает пояснительное присоединение.
