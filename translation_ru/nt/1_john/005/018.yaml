source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: ru
  text: Мы знаем, что всякий, кто рождён от Бога, не живёт во грехе[a], но тот, кто рождён от Бога, хранит его[b], и лукавый не прикасается к нему[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не грешит». Настоящее время греческого глагола здесь, вероятно, обозначает продолжающийся или привычный грех, а не полное отсутствие отдельных грехов (ср. 1 Ин. 1:8–10; 2:1).'
    reason: Передача глагольного вида и межтекстовый контекст.
  - marker: b
    text: 'При другом синтаксическом понимании: «но рождённый от Бога хранит самого себя». Многие понимают «того, кто рождён от Бога» как Иисуса, Сына, который хранит верующего.'
    reason: Сохранение синтаксической и референциальной неоднозначности; уточнение того, что вариант «самого себя» зависит от разбора конструкции.
  - marker: c
    text: «Прикасаться» здесь может означать схватить или завладеть кем-либо, чтобы причинить вред.
    reason: Пояснение возможного оттенка значения ἅπτεται.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Мы знаем
  rationale: Перфектная по форме лексема οἶδα имеет значение настоящего состояния; это естественная и точная передача.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: всякий рождённый от Бога
  rationale: Конструкция имеет распределительное значение, а перфектное причастие указывает на состояние, возникшее вследствие рождения от Бога.
- source_word: οὐχ ἁμαρτάνει
  choice: не живёт во грехе
  rationale: Настоящее время здесь допускает значение продолжающегося или привычного греховного образа жизни. Формулировка не утверждает, что верующий вообще никогда не совершает греха.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Рождённый от Бога
  rationale: Формулировка следует греческому тексту, не добавляя прямо «Сын». Прописная буква отражает вероятное отнесение к Христу, а сноска сохраняет альтернативное понимание.
- source_word: τηρεῖ αὐτόν
  choice: хранит его
  rationale: τηρέω может означать хранить, оберегать или сохранять. «Хранит» передаёт защитный смысл, не становясь излишне пояснительным.
- source_word: ὁ πονηρὸς
  choice: лукавый
  rationale: Субстантивированное прилагательное с артиклем в контексте Иоанна естественно обозначает личного противника — дьявола; «лукавый» является понятным библейским обозначением.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: не прикасается к нему
  rationale: Сохраняется основной образ глагола ἅπτομαι; сноска поясняет возможный оттенок захвата с целью причинить вред.
theological_decisions:
- issue: Значение настоящего времени в οὐχ ἁμαρτάνει
  choice: Отрицание постоянной или привычной жизни во грехе
  alternative: Утверждение, что рождённый от Бога вообще никогда не совершает греха
  rationale: Имперфективный вид настоящего времени и контекст 1 Ин. 1:8–10; 2:1 поддерживают значение продолжающейся греховной практики, не устраняя напряжения текста.
- issue: К кому относится ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: В основном тексте вероятное отнесение ко Христу обозначено формой «Рождённый», при сохранении самой греческой формулировки
  alternative: Это тот же верующий, рождённый от Бога, который хранит самого себя
  rationale: Синтаксис допускает оба понимания. Аористное причастие в противопоставлении перфектному причастию может указывать на Христа, однако сноска сохраняет реальную неоднозначность.
- issue: Референт αὐτόν и αὐτοῦ
  choice: 'Оба местоимения относятся к верующему: «его», «к нему»'
  alternative: 'При отнесении причастия к верующему αὐτόν понимается возвратно: «самого себя»'
  rationale: Форма αὐτόν сама по себе не является возвратным местоимением, поэтому основной текст сохраняет невозвратную форму, а альтернативный синтаксический разбор вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Рождённый» написано с прописной буквы как указание на вероятного референта — Христа, но альтернативный разбор явно сохранён в сноске. Маркеры сносок расположены непосредственно после соответствующих выражений.
