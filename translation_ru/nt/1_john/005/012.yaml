id: 1JN.5.12
reference: 1 John 5:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: ru
  text: У кого есть Сын, у того есть жизнь[a]; у кого нет Сына Божьего, у того нет жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечная жизнь». В произведениях Иоанна «жизнь» здесь означает жизнь, обретаемую в Сыне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: у кого есть
  rationale: Субстантивированное причастие обозначает любого человека, характеризуемого тем, что у него есть Сын. Конструкция «у кого есть» естественна в современном русском языке и сохраняет обобщённый смысл.
- source_word: τὸν υἱόν
  choice: Сын
  rationale: В первой части греческого текста стоит краткое наименование «Сын» без дополнения «Божий»; перевод сохраняет это намеренное различие между двумя частями стиха.
- source_word: ἔχει
  choice: есть / у того есть
  rationale: Глагол ἔχω передан обычной русской конструкцией обладания «у кого… у того есть», которая естественнее буквального «имеет» и не добавляет толкования о характере этого обладания.
- source_word: τὴν ζωήν
  choice: жизнь
  rationale: Перевод «жизнь» точно сохраняет формулировку стиха. Хотя в контексте Иоанновых писаний подразумевается вечная жизнь, это уточнение не внесено непосредственно в основной текст.
- source_word: ὁ μὴ ἔχων
  choice: у кого нет
  rationale: Отрицательная конструкция с причастием зеркально передана русским оборотом «у кого нет», что сохраняет уравновешенную антитезу стиха.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Сына Божьего
  rationale: Полное христологическое наименование передано явно. Форма «Божьего» естественна для современного литературного русского языка и сохраняет родительное отношение τοῦ θεοῦ.
- source_word: οὐκ ἔχει
  choice: у того нет
  rationale: Отрицание при личной форме глагола передано нормативной русской конструкцией «нет», параллельной утвердительной части.
theological_decisions:
- issue: Смысл слова «жизнь» в Иоанновом контексте
  choice: В основном тексте оставить «жизнь».
  alternative: «вечная жизнь»
  rationale: В произведениях Иоанна ζωή часто означает вечную жизнь, обретаемую в Сыне, однако в данном стихе определения «вечная» нет. Краткий перевод сохраняет формулировку источника, а смысловую альтернативу поясняет сноска.
- issue: Обобщённое значение субстантивированных причастий мужского рода
  choice: Передать конструкцией «у кого… у того…».
  alternative: «тот, кто…» или «имеющий…»
  rationale: Греческая форма грамматически имеет мужской род и единственное число, но относится к любому человеку. Русская соотносительная конструкция естественно выражает этот обобщённый смысл без неоправданного ограничения по полу.
- issue: Характер выражения «иметь Сына»
  choice: Сохранить глагол обладания без поясняющей парафразы.
  alternative: «пребывать в единстве с Сыном» или «верить в Сына»
  rationale: Такие разъяснения могут отражать контекстуальный смысл, но сужают многозначность Иоанновой формулировки. Перевод сохраняет её богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык с ясной, ритмически уравновешенной конструкцией «у кого… у того…». Заглавные буквы в словах «Сын» и «Сына» указывают на титул Иисуса Христа. Синтаксический параллелизм и различие между кратким «Сын» в первой части и полным «Сын Божий» во второй сохранены.
