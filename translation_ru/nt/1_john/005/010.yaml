  naturalness: «Верующий» и особенно «не верующий Богу» понятны, но в современном литературном русском могут звучать как номинализация или допускать нежелательное ассоциативное сближение с «неверующим». Обороты «тот, кто верит» и «тот, кто не верит Богу» естественнее и яснее, сохраняя обобщённое значение греческих субстантивированных причастий.
