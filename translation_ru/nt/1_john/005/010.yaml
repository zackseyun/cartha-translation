id: 1JN.5.10
reference: 1 John 5:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: ru
  text: Тот, кто верит в Сына Божьего, имеет свидетельство в себе[a]; тот, кто не верит Богу, сделал Его лжецом[b], потому что не поверил свидетельству, которое Бог дал о Своём Сыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «в нём» вместо «в себе»; такое чтение может быть понято и как указание на Сына.'
    reason: textual_variant
  - marker: b
    text: 'Или: «тем самым представляет Его лжецом». Буквально по-гречески: «сделал Его лжецом» — то есть, отвергая Божье свидетельство, человек фактически считает Бога говорящим неправду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: Верующий
  rationale: Субстантивированное причастие настоящего времени передаёт обобщённое обозначение человека без архаичного оборота «тот, кто верует».
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: в Сына Божьего
  rationale: При πιστεύω предлог εἰς выражает направленную на личность веру и доверие; по-русски естественно «верующий в».
- source_word: τὴν μαρτυρίαν
  choice: это свидетельство
  rationale: «Свидетельство» сохраняет характерную для Иоанна лексику и оттенок удостоверяющего показания; указательное «это» естественно связывает выражение с контекстом.
- source_word: ἐν αὑτῷ
  choice: в себе
  rationale: Возвратное местоимение естественно относится к только что упомянутому верующему и передаёт внутреннее обладание свидетельством.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: не верующий Богу
  rationale: Дательный падеж при πιστεύω здесь означает непринятие Божьих слов как истинных, а не просто отсутствие веры в существование Бога; различие с «веровать в Бога» сохранено.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: сделал Его лжецом
  rationale: Буквальный образ сохранён; перфект указывает на совершённое действие с сохраняющимся результатом. В примечании поясняется идиоматический смысл.
- source_word: οὐ πεπίστευκεν
  choice: не поверил
  rationale: Совершенный вид естественно передаёт состоявшийся отказ принять свидетельство, результат которого сохраняется.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: которое Бог дал
  rationale: По-русски «дать свидетельство» звучит естественнее буквального и тяжеловесного «которым Бог засвидетельствовал» и точно передаёт смысл глагола.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: о Своём Сыне
  rationale: περί с родительным означает «о, относительно»; возвратное «Своём» однозначно соотносит Сына с Богом, подлежащим придаточного предложения.
theological_decisions:
- issue: К кому относится выражение «в себе»
  choice: Свидетельство находится в самом верующем.
  alternative: При варианте чтения ἐν αὐτῷ выражение может пониматься как «в нём», в том числе как указание на Сына.
  rationale: Основной текст SBLGNT содержит возвратное αὑτῷ, которое естественно относится к верующему. Более широкое богословское объяснение природы этого внутреннего свидетельства в перевод не добавляется.
- issue: Смысл выражения «не верующий Богу»
  choice: Речь идёт об отвержении Божьего свидетельства как истинного.
  alternative: Общее неверие в Бога или отрицание Его существования.
  rationale: Следующее предложение с ὅτι прямо объясняет неверие как непринятие свидетельства Бога о Его Сыне.
- issue: Образ «сделал Его лжецом»
  choice: Сохранена прямая и напряжённая формулировка греческого текста.
  alternative: «Тем самым представляет Его лжецом» или «обращается с Ним как с лжецом».
  rationale: Перевод не смягчает обвинение и не подменяет его толкованием; идиоматический смысл разъяснён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Сохранено смысловое различие между «веровать в Сына» и «не веровать Богу». Избегнуты архаизмы и конфессионально обусловленные пояснения.
