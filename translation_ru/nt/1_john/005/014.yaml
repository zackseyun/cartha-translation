id: 1JN.5.14
reference: 1 John 5:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: ru
  text: 'И вот какая уверенность[a] есть у нас перед Ним: если мы просим чего-либо по Его воле, Он слышит нас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смелость»; «дерзновение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: уверенность
  rationale: В контексте молитвенного обращения слово обозначает открытую, смелую уверенность перед Богом. «Уверенность» естественно звучит по-русски и не сводит смысл лишь к внешней смелости речи.
- source_word: πρὸς αὐτόν
  choice: перед Ним
  rationale: Предлог πρός с личным объектом здесь выражает отношение и нахождение в присутствии Бога; «перед Ним» естественно передаёт этот смысл в контексте молитвы.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι вводит содержание уверенности, а не причину. В русском языке двоеточие естественно раскрывает это содержание без избыточного союза «что».
- source_word: ἐάν τι αἰτώμεθα
  choice: если мы просим чего-либо
  rationale: Условная конструкция сохраняет общий характер высказывания, а «чего-либо» передаёт неопределённость τι и естественно сочетается с глаголом «просить».
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: по Его воле
  rationale: Краткое и устойчивое русское выражение передаёт соответствие просьбы Божьей воле, заданное κατά с винительным падежом.
- source_word: ἀκούει ἡμῶν
  choice: Он слышит нас
  rationale: Это идиоматичный русский эквивалент греческой конструкции в контексте молитвы. Он говорит о Божьем внимании к просьбе, не добавляя прямо смысла немедленного исполнения.
theological_decisions:
- issue: Смысл того, что Бог «слышит» молитву
  choice: «Он слышит нас» — Бог слышит молитву и внимает ей.
  alternative: «Он отвечает нам» или «Он исполняет наши просьбы».
  rationale: Сам стих утверждает, что Бог слышит просьбы, согласные с Его волей; более сильное утверждение об их исполнении развивается далее. Перевод не должен преждевременно устранять это смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Заглавные буквы в местоимениях «Ним», «Его», относящихся к Богу, использованы в соответствии с распространённой русской библейской традицией. Конструкция «И вот какая…» звучит естественно и сохраняет указательный акцент αὕτη.
