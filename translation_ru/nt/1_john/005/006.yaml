language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: ru
  text: Это тот, кто пришёл через воду и кровь — Иисус, Мессия[a][b]. Не только с водой, но с водой и с кровью. И Дух свидетельствует, потому что[c] Дух есть истина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством воды и крови». Само выражение истолковывают по-разному: как указание на крещение и смерть Иисуса, на Его рождение и смерть либо как образ, связанный с таинствами. Перевод не выбирает ни одно из этих толкований.'
    reason: alternative_reading
  - marker: b
    text: Греч. «Иисус Христос»; здесь Χριστός передано как титул «Мессия».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «что Дух есть истина». Греческий союз может вводить как причину, так и содержание свидетельства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: Он — Тот, кто пришёл
  rationale: Передаёт указательно-идентифицирующую конструкцию и субстантивированное причастие естественным русским оборотом, сохраняя отсылку к историческому приходу Иисуса.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: через воду и кровь
  rationale: διά с родительным допускает значение средства или сопутствующего обстоятельства. «Через» сохраняет образность и не уточняет спорный смысл воды и крови.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус-Мессия
  rationale: Χριστός здесь сохраняет титульное значение «Мессия»; дефис связывает имя и титул в цельное именование и избегает восприятия «Мессии» как отдельного пояснительного добавления.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: не только через воду, но через воду и через кровь
  rationale: Русское «через» естественно продолжает первую фразу; повтор предлога перед «кровью» сохраняет греческое усиление и подчёркивает оба элемента.
- source_word: τὸ πνεῦμά
  choice: Дух
  rationale: Контекст свидетельства указывает на Святого Духа; прописная буква обозначает референта без пояснительной вставки в основной текст.
- source_word: τὸ μαρτυροῦν
  choice: свидетельствует
  rationale: Настоящее время передаёт продолжающееся свидетельство; личная глагольная форма естественнее для современного русского, чем буквальное «есть свидетельствующий».
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз понят как причинный: основанием достоверности свидетельства служит то, что Дух есть истина. Возможное изъяснительное прочтение отмечено в сноске.'
- source_word: ἡ ἀλήθεια
  choice: истина
  rationale: Конструкция передана отождествляюще — «Дух есть истина», а не ослабленным «Дух истинен».
theological_decisions:
- issue: Смысл выражения «вода и кровь»
  choice: Оставить образы воды и крови без истолкования
  alternative: Уточнить как крещение и смерть Иисуса, рождение и смерть либо таинства
  rationale: Сам греческий текст не объясняет эти образы; перевод сохраняет подлинную экзегетическую неоднозначность.
- issue: Кого обозначает «Дух»
  choice: Святой Дух
  alternative: некий дух вообще
  rationale: Контекст Божьего свидетельства и словоупотребление 1 Иоанна убедительно указывают на Святого Духа; это отражено прописной буквой.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В приложении к идентифицирующей фразе слово сохраняет различимое титульное значение, поэтому оно переведено как «Мессия».
- issue: Значение ὅτι
  choice: 'причинное: «потому что»'
  alternative: 'изъяснительное: «что»'
  rationale: Причинное прочтение хорошо связывает истинность Духа с Его свидетельством, но грамматически возможная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной синтаксической формой. Повтор «через воду… через воду и через кровь» намеренно сохранён ради контраста и риторического акцента оригинала; спорные образы не раскрываются в основном тексте.
