  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: ru
  text: Каждый, кто верит, что Иисус — Мессия[a], рождён от Бога[b]; и каждый, кто любит Того, кто родил, любит и рождённого от Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое слово Χριστός означает «Помазанник» и здесь употреблено как титул.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «рождён от Бога… любит Того, кто родил, и рождённого от Него». В греческом тексте во всех этих выражениях употреблены формы одного и того же глагола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Всякий, кто верит
  rationale: Субстантивированное причастие настоящего времени имеет обобщающий смысл; этот вариант естественен по-русски и сохраняет значение, относящееся ко всякому верующему.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: что Иисус — Мессия
  rationale: Χριστός употреблено как титул обещанного Помазанника; «Мессия» передаёт титульный и исповедальный смысл.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: рождён от Бога
  rationale: Перфект страдательного залога указывает на совершившееся рождение с сохраняющимся результатом; краткое причастие в русском естественно выражает это устойчивое состояние, а «от Бога» передаёт источник.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: всякий, кто любит
  rationale: Сохраняется обобщающий характер второго субстантивированного причастия и синтаксический параллелизм первой части стиха.
- source_word: τὸν γεννήσαντα
  choice: Родившего
  rationale: Активное причастие от γεννάω передано без добавленного в греческом тексте объекта; оно сохраняет связь с формами того же глагола в стихе. Заглавная буква ясно указывает на Бога в данном контексте.
- source_word: ἀγαπᾷ καὶ
  choice: любит и
  rationale: Частица καί перед вторым объектом естественно передаётся русской конструкцией «любит и…», выражающей также направленность любви на рождённого.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: рождённого от Него
  rationale: Причастная конструкция сохраняет словесную связь с «рождён» и «Родившего», не заменяя её более толковательным словом «дитя»; «от Него» передаёт происхождение.
theological_decisions:
- issue: Передача образа рождения от Бога и повторов γεννάω
  choice: Использовать однокоренные формы «рождён», «Родившего», «рождённого»
  alternative: Передать как «рождён от Бога», «любит Отца» и «любит Его детей»
  rationale: Однокоренные формы сохраняют намеренный лексический повтор и родственную аналогию греческого текста, не подменяя её толкованием.
- issue: Кого обозначает «рождённый от Него»
  choice: Сохранить форму единственного числа «рождённого от Него» без уточнения
  alternative: Уточнить как «каждого, кто рождён от Него», «Его дитя» или «братьев и сестёр»
  rationale: Греческий текст использует единственное число с обобщающей силой. Буквальная причастная форма сохраняет возможную широту выражения и не вносит лишнего богословского уточнения.
- issue: Мессианский титул Иисуса
  choice: Мессия
  alternative: Христос
  rationale: В исповедальной формуле ὁ χριστός является титулом; «Мессия» ясно передаёт значение обещанного Помазанника, а традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Конструкция «Всякий, кто…» понятна широкому читателю и поддерживает параллелизм. Однокоренной ряд намеренно сохранён; заглавные буквы в «Родившего» и «Него» обозначают Бога. Маркеры сносок поставлены непосредственно после соответствующих выражений.
