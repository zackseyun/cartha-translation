  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: ru
  text: 'Кто соблюдает Его заповеди, тот пребывает[a] в Нём, и Он — в нём. И по этому мы узнаём, что Он пребывает в нас: по Духу[b], Которого Он нам дал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаётся». Греческий глагол μένω обозначает продолжающееся пребывание и является одним из ключевых слов в произведениях Иоанна.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от Духа». Греческий предлог ἐκ может указывать как на источник, так и на основание, по которому мы это знаем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: соблюдает
  rationale: «Соблюдает» естественно передаёт постоянное исполнение и верность заповедям, не сужая значение до одного лишь внешнего повиновения.
- source_word: ἐντολάς
  choice: заповеди
  rationale: «Заповеди» сохраняет характерную для Иоанновых текстов лексику и нравственно-заветную силу слова.
- source_word: μένει
  choice: пребывает
  rationale: Глагол повторён трижды; единообразное «пребывает» сохраняет важный для Иоанна мотив продолжающегося взаимного единения.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Местоимение сохранено, а не заменено словом «Бог», поэтому читатель следует за контекстом и исходная формулировка не становится излишне однозначной.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: мы узнаём
  rationale: В русском языке конструкция «что… мы узнаём по…» естественно выражает основание или признак, благодаря которому нечто известно.
- source_word: ἐκ τοῦ πνεύματος
  choice: по Духу
  rationale: «По Духу» передаёт свидетельствующее основание знания; возможный оттенок источника сохранён в сноске.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: Которого Он нам дал
  rationale: Личное относительное местоимение уместно для Святого Духа, а прошедшее время прямо передаёт аорист ἔδωκεν без добавления отсутствующего в форме акцента.
theological_decisions:
- issue: К кому относятся αὐτῷ / αὐτός и подразумеваемое подлежащее μένει ἐν ἡμῖν
  choice: Сохранены местоимения «в Нём», «Он», без подстановки имени «Бог» или «Христос».
  alternative: Явно назвать Бога либо истолковать последнее пребывание как пребывание Христа.
  rationale: Ближайший контекст указывает прежде всего на Бога, однако местоименная форма оригинала оставляет связь с более широким христологическим языком Послания; перевод не устраняет эту напряжённость.
- issue: Значение πνεῦμα
  choice: «Дух» с прописной буквы как Святой Дух.
  alternative: «дух» со строчной буквы.
  rationale: Дух, данный Богом верующим, в данном контексте понимается как Божий Святой Дух; прописная буква обозначает референта, не добавляя конфессионально-специфического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён до естественной конструкции «кто…, тот…», при этом три повтора «пребывает» сохранены. Прописные буквы в местоимениях обозначают божественного референта, но не снимают вопрос о точной отнесённости к Отцу или Христу.
