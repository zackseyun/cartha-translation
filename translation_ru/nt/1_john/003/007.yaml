  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: ru
  text: Дети, пусть никто не вводит вас в заблуждение. Кто поступает праведно, тот праведен, как и тот[a] праведен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тот». Вероятнее всего, имеется в виду Христос, хотя некоторые понимают это как указание на Бога.'
    reason: Сохранение неоднозначности референта ἐκεῖνος.
lexical_decisions:
- source_word: τεκνία
  choice: Дети мои
  rationale: Ласковое обращение к членам общины. В современном русском «дети мои» естественно передаёт семейную теплоту уменьшительной формы, не прибегая к слишком детскому «детки».
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: пусть никто не вводит вас в заблуждение
  rationale: Передаёт запрет и смысл πλανάω — обманывать, вводить в заблуждение или сбивать с верного пути; формулировка естественна для современного литературного русского.
- source_word: ὁ ποιῶν τὴν δικαιοσύνην
  choice: кто поступает праведно
  rationale: Настоящее причастие обозначает характерный образ действий. Глагольное выражение по-русски звучит естественнее буквального «делающий праведность» и сохраняет связь с последующим «праведен».
- source_word: δίκαιός ἐστιν
  choice: тот праведен
  rationale: «Праведен» передаёт δίκαιος в этическом контексте и сохраняет смысловую связь с праведным поведением.
- source_word: καθὼς ἐκεῖνος δίκαιός ἐστιν
  choice: как праведен и тот
  rationale: Сравнительная конструкция передана прямо, а указательное местоимение «тот» сохраняет форму оригинала и не заменяет неоднозначный референт именем.
theological_decisions:
- issue: К кому относится ἐκεῖνος
  choice: В основном тексте сохранено указательное местоимение «тот».
  alternative: Назвать прямо Христа либо Бога; перевести местоимением «Он».
  rationale: В ближайшем контексте и в сходных этических сравнениях у Иоанна наиболее вероятен Христос, однако возможен референт Бог. Сохранение местоимения не устраняет заложенную в тексте неоднозначность.
- issue: Связь праведного поведения и характеристики человека
  choice: «Кто поступает праведно, тот праведен».
  alternative: Перевести так, будто отдельный праведный поступок сам по себе делает человека праведным.
  rationale: Форма настоящего времени описывает устойчивую практику, но текст оставлен в его прямой и напряжённой формулировке без добавления конфессионального объяснения основания праведности.
translation_notes:
  register: Современный литературный русский язык с тёплым пастырским обращением и ясным, назидательным синтаксисом. Строго буквальные, но неестественные обороты заменены идиоматическими без снятия богословской напряжённости.
