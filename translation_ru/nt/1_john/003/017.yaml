reference: 1 John 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: ru
  text: Но кто обладает благами этого мира и видит, что его брат[a] нуждается, но закрывает перед ним своё сердце[b], — как в нём пребывает любовь Божья[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брат или сестра». В греческом тексте стоит слово «брат», которое здесь может представительно обозначать любого единоверца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отказывает ему в сострадании». Буквально: «закрывает от него свои внутренности» — образное выражение, означающее отказ от сердечного сострадания.'
    reason: lexical_alternative
  - marker: c
    text: Выражение «любовь Божья» может означать как Божью любовь, пребывающую в человеке, так и любовь человека к Богу.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: благами этого мира
  rationale: βίος здесь обозначает средства к жизни, материальное имущество или достаток. В контексте помощи нуждающемуся речь идёт о материальных ресурсах; выражение «блага этого мира» естественно передаёт этот смысл и сохраняет связь с κόσμος.
- source_word: θεωρῇ
  choice: видит
  rationale: В данном нравственном контексте θεωρέω означает непосредственное наблюдение и осознание нужды; простое «видит» звучит естественно и не ослабляет ответственности наблюдающего.
- source_word: ἀδελφὸν αὐτοῦ
  choice: его брат
  rationale: Греческий текст употребляет существительное мужского рода в единственном числе. Основной текст сохраняет эту форму, а возможное представительное значение поясняется в сноске.
- source_word: χρείαν ἔχοντα
  choice: нуждается
  rationale: Причастный оборот буквально означает «имеющего нужду». Русский глагол «нуждается» кратко и естественно передаёт состояние нехватки необходимого.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: закрывает перед ним своё сердце
  rationale: σπλάγχνα буквально обозначает внутренности, а идиоматически — глубокое сострадание. Русская метафора «закрыть сердце» ясно передаёт сознательный отказ проявить сердечное участие; «перед ним» отражает направленное отстранение от нуждающегося.
- source_word: πῶς
  choice: как
  rationale: Сохраняется форма риторического вопроса без добавления модального «может», которого прямо нет в греческом тексте.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: любовь Божья
  rationale: Формулировка остаётся максимально близкой к греческому родительному обороту и не заменяется однозначным толкованием «любовь к Богу» или «Божья любовь к человеку»; смысловая неоднозначность отмечена в сноске.
- source_word: μένει ἐν αὐτῷ
  choice: в нём пребывает
  rationale: «Пребывает» сохраняет длительный, устойчивый смысл μένω и важную для Иоанновых писаний терминологическую связь, оставаясь понятным в современном литературном русском.
theological_decisions:
- issue: Неоднозначность выражения ἡ ἀγάπη τοῦ θεοῦ
  choice: «любовь Божья» с пояснением в сноске
  alternative: «любовь к Богу» или «Божья любовь, действующая в человеке»
  rationale: Греческий родительный падеж допускает понимание как любви, исходящей от Бога и пребывающей в человеке, так и человеческой любви к Богу. Контекст Иоанновых писаний тесно связывает полученную и проявляемую любовь, поэтому основной текст не должен устранять это богословское напряжение.
- issue: Передача ἀδελφόν в мужском роде
  choice: «брат»
  alternative: «брат или сестра»; «единоверец»
  rationale: Источник содержит форму мужского рода единственного числа. Она сохранена в основном тексте, тогда как возможное обобщённое указание на любого единоверца вынесено в сноску.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан естественным для обычного читателя; ключевое Иоанново μένω передано словом «пребывает». Метафора сердца сохраняет образность исходного идиоматического выражения без буквального и неясного упоминания внутренностей.
