id: 1JN.3.15
reference: 1 John 3:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: ru
  text: Всякий, кто ненавидит своего брата[a], — убийца; и вы знаете, что ни один убийца не имеет вечной жизни, пребывающей в нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «брат», вероятнее всего, означает другого верующего, члена общины; в греческом тексте стоит форма мужского рода единственного числа.
    reason: contextual_note
  - marker: b
    text: 'Или: «остающейся в нём». Глагол μένω — важное для писаний Иоанна слово, которое также можно переводить как «оставаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Всякий, кто ненавидит
  rationale: Субстантивированное причастие настоящего времени обозначает всякого, кому свойственна такая ненависть. Эта конструкция естественна по-русски и сохраняет обобщающий характер высказывания.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата
  rationale: Возвратное «своего» естественно соотносит брата с подлежащим. Сохранена форма мужского рода единственного числа; вероятный контекстуальный смысл — член общины верующих — пояснён в сноске.
- source_word: ἀνθρωποκτόνος
  choice: убийца
  rationale: Современный и точный русский эквивалент, сохраняющий резкую нравственную силу утверждения. «Человекоубийца» формальнее, но в современном литературном русском звучит архаично и менее естественно.
- source_word: οἴδατε
  choice: вы знаете
  rationale: Передаёт второе лицо множественного числа без ненужного усиления.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: ни один убийца не имеет
  rationale: Русская отрицательная конструкция естественно и однозначно передаёт отрицание всего класса, выраженное греческими πᾶς и οὐκ.
- source_word: ζωὴν αἰώνιον
  choice: вечной жизни
  rationale: Устоявшееся и контекстуально точное выражение в Иоанновой традиции.
- source_word: ἐν αὐτῷ μένουσαν
  choice: пребывающей в нём
  rationale: Причастная конструкция сохраняет синтаксическую связь с «вечной жизнью» и длительный смысл μένω. «Пребывать» также поддерживает важную для Иоанна лексическую связь, оставаясь понятным в современном литературном русском.
theological_decisions:
- issue: Объём значения слова «брат»
  choice: Сохранить в основном тексте «своего брата».
  alternative: «брата или сестру»; «единоверца»
  rationale: Контекст, вероятно, указывает на другого члена общины верующих, однако греческий текст имеет форму мужского рода единственного числа. Перевод не подменяет её поясняющим или инклюзивным пересказом, а контекстуальный смысл отмечает в сноске.
- issue: Значение Иоаннова μένω
  choice: Передать как «пребывающей в нём».
  alternative: «остающейся в нём»; «живущей в нём»
  rationale: «Пребывать» сохраняет длительность и повторяющуюся в Иоанновых текстах тематическую лексику, не решая сверх текста вопрос о точном характере пребывания вечной жизни.
- issue: Связь ненависти и убийства
  choice: Сохранить прямое утверждение «— убийца».
  alternative: «подобен убийце»
  rationale: В греческом тексте стоит именная предикативная конструкция «есть убийца», а не сравнение; смягчение до подобия устранило бы намеренную нравственную напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейского изложения. Сохранены категоричность исходного утверждения, повтор слова «убийца» и причастная связь «пребывающей» с вечной жизнью; архаичное «человекоубийца» не использовано.
