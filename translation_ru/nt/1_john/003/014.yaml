lexical_decisions:
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Форма οἶδα имеет в койне настоящее стативное значение; «мы знаем» естественно передаёт уверенное знание.
- source_word: μεταβεβήκαμεν
  choice: перешли
  rationale: Перфект обозначает совершившийся переход с сохраняющимся результатом; русская форма «перешли» в данном контексте передаёт и переход, и нынешнее состояние.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: из смерти в жизнь
  rationale: Сочетание ἐκ…εἰς выражает движение из одной области в другую; «из смерти в жизнь» сохраняет краткость и образность оригинала.
- source_word: ἀγαπῶμεν
  choice: любим
  rationale: Настоящее время указывает на продолжающееся, характерное действие; «любим» звучит естественно и точно.
- source_word: τοὺς ἀδελφούς
  choice: братьев
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала; в контексте слово, вероятно, охватывает всех единоверцев, что отмечено в сноске.
- source_word: ὁ μὴ ἀγαπῶν
  choice: кто не любит
  rationale: Субстантивированное причастие обозначает любого человека, характеризуемого отсутствием любви; русская конструкция ясна и сохраняет обобщённый смысл.
- source_word: μένει
  choice: остаётся
  rationale: Глагол обозначает продолжающееся пребывание в прежнем состоянии; «остаётся» доступно современному читателю и сохраняет смысл длительности.
- source_word: ἐν τῷ θανάτῳ
  choice: в смерти
  rationale: Краткая метафорическая формулировка оригинала сохранена без поясняющего богословского расширения.
theological_decisions:
- issue: Референт и родовое значение ἀδελφοί
  choice: В основном тексте — «братьев», с указанием вероятного инклюзивного смысла в сноске.
  alternative: «братьев и сестёр»
  rationale: Греческое слово имеет форму мужского рода во множественном числе, однако в контексте, вероятно, означает единоверцев обоих полов. Основной текст сохраняет форму источника, а сноска сообщает читателю о широте возможного референта.
- issue: Смысл образов «смерть» и «жизнь»
  choice: Образы сохранены без уточняющих определений.
  alternative: «из духовной смерти в вечную жизнь» или «из области смерти в область жизни»
  rationale: Текст говорит о богословски значимом переходе, но не раскрывает эти понятия дополнительными определениями. Их расширение сузило бы намеренно ёмкую формулировку.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-сдержанным синтаксисом. Повтор «смерть — жизнь — смерть» сохранён как смысловая рамка стиха; архаичное «пребывает» заменено более понятным «остаётся».
