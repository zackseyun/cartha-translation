id: 1JN.3.22
reference: 1 John 3:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: ru
  text: И чего бы мы ни просили, получаем от Него, потому что соблюдаем Его заповеди и делаем то, что угодно Ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: чего бы… ни
  rationale: Неопределённо-относительная конструкция естественно передаётся по-русски оборотом «чего бы… ни», сохраняя значение «что бы ни / всё, что».
- source_word: αἰτῶμεν
  choice: мы ни просили
  rationale: В контексте молитвенного прошения αἰτέω естественно означает «просить».
- source_word: λαμβάνομεν
  choice: получаем
  rationale: 'Настоящее время передано как общее утверждение: «получаем».'
- source_word: ἀπ’ αὐτοῦ
  choice: от Него
  rationale: Предлог ἀπό с родительным обозначает источник. Прописная буква в местоимении соответствует принятому благоговейному библейскому регистру русского языка.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит прямо выраженную причину и не должен быть ослаблен до простой связи или сопутствующего обстоятельства.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: Его заповеди
  rationale: «Заповеди» сохраняет характерную для Иоанна богословско-нравственную лексику и звучит естественно в современном русском.
- source_word: τηροῦμεν
  choice: соблюдаем
  rationale: «Соблюдаем» передаёт значение хранить и исполнять заповеди без излишнего толкования.
- source_word: τὰ ἀρεστὰ
  choice: то, что угодно
  rationale: Субстантивированное прилагательное во множественном числе обозначает всё угодное Богу; русский оборот сохраняет широкий смысл.
- source_word: ἐνώπιον αὐτοῦ
  choice: Ему
  rationale: В сочетании «делать угодное» естественное русское управление «угодно Ему» идиоматически включает смысл «пред Ним / в Его глазах», не изменяя объекта оценки.
- source_word: ποιοῦμεν
  choice: делаем
  rationale: Прямой и естественный эквивалент ποιέω в данном сочетании.
theological_decisions:
- issue: Связь между получением просимого и соблюдением заповедей
  choice: 'Сохранена причинная связь: «получаем… потому что соблюдаем… и делаем…».'
  alternative: Ослабить причинность до сопутствующей связи либо пояснить её как безусловную формулу исполнения любой просьбы.
  rationale: ὅτι явно вводит основание. Перевод сохраняет богословское напряжение текста, не ослабляя причинность и не превращая стих в расширенное догматическое объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Формулировка ясна обычному читателю; синтаксис плавный, без архаизмов. Местоимение, относящееся к Богу, написано с прописной буквы согласно распространённой русской библейской традиции.
