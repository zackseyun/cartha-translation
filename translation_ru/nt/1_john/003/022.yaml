  source_fidelity: 'Текст точно передаёт неопределённо-относительное «чего бы ... ни», обобщающее настоящее «получаем», источник «от Него» и явно причинный союз ὅτι: «потому что». «Соблюдаем Его заповеди» хорошо передаёт τηροῦμεν τὰς ἐντολὰς αὐτοῦ. Оборот «делаем то, что угодно Ему» адекватно выражает τὰ ἀρεστὰ ἐνώπιον αὐτοῦ; русское «угодно Ему» естественно включает оценочный аспект «в Его глазах», не добавляя нового смысла.'
  naturalness: Фраза звучит естественно на современном литературном русском и сохраняет сдержанный библейский регистр. Синтаксис ясен, а прописное написание местоимений последовательно соответствует выбранному регистру.
  terminology: «Заповеди» и «соблюдаем» уместно сохраняют иоаннову лексику. «Угодно Ему» — нормальное русское сочетание и не требует искусственного буквального оборота «угодно перед Ним».
