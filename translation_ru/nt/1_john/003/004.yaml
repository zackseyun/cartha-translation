source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: ru
  text: Всякий, кто совершает грех, совершает и беззаконие[a], и грех есть беззаконие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякий, кто грешит, творит и беззаконие». Греческие формы настоящего времени могут в данном контексте указывать на продолжающееся или характерное действие, но сами по себе не требуют слов «постоянно» или «непрерывно».'
    reason: lexical_alternative
  - marker: b
    text: «Беззаконие» передаёт греческое ἀνομία — буквально состояние или действие вопреки закону. Текст не уточняет здесь, о каком именно законе идёт речь.
    reason: translation_clarification
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Всякий, кто совершает грех
  rationale: Субстантивированное причастие настоящего времени имеет обобщающий смысл. «Всякий, кто совершает грех» сохраняет универсальность высказывания и близко передаёт сочетание ποιεῖν с ἁμαρτία, не ограничивая его одним заранее названным проступком.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: совершает и беззаконие
  rationale: Повтор глагола «совершает» воспроизводит параллелизм ποιῶν… ποιεῖ, а «беззаконие» прямо передаёт ἀνομία и сохраняет связь понятия с законом без уточнения, о каком именно законе идёт речь.
- source_word: ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: грех есть беззаконие
  rationale: Краткая именная конструкция сохраняет определительный характер греческой фразы и её напряжённое отождествление понятий. Связка «есть» уместна в сжатом, торжественном утверждении.
theological_decisions:
- issue: Передавать ли формы настоящего времени как отдельное совершение или как продолжающееся либо характерное действие
  choice: В основном тексте сохранено нейтральное «совершает», а возможный продолжающийся или характерный оттенок отмечен в сноске.
  alternative: «Всякий, кто постоянно грешит» или «всякий, кто живёт во грехе»
  rationale: Греческие формы настоящего времени допускают контекстуальный оттенок продолжающегося или характерного поведения, однако добавление «постоянно» либо «живёт во грехе» сделало бы этот оттенок более определённым, чем сама грамматическая форма.
- issue: Смысл ἀνομία в определении греха
  choice: беззаконие
  alternative: нарушение закона; неправедность
  rationale: «Беззаконие» сохраняет лексическую связь с νόμος и не уточняет, имеется ли в виду Моисеев закон, Божья воля в более широком смысле или конкретное правонарушение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской краткостью. Повтор «совершает» намеренно сохраняет синтаксический параллелизм оригинала; «есть» подчёркивает определительный характер заключительной фразы.
