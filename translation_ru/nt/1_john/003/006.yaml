source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: ru
  text: Всякий, кто пребывает в Нём, не грешит[a]; всякий, кто грешит, не видел Его и не познал Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие формы настоящего времени могут описывать продолжающееся или характерное действие: «не продолжает грешить… кто продолжает грешить».'
    reason: Сохранить аспектуальную неоднозначность настоящего времени и предупредить абсолютное прочтение без внесения толкования в основной текст.
lexical_decisions:
- source_word: πᾶς ὁ
  choice: всякий, кто
  rationale: Артиклевая конструкция с πᾶς имеет обобщающее значение; «всякий, кто» естественно передаёт её универсальную силу.
- source_word: ἐν αὐτῷ μένων
  choice: кто пребывает в Нём
  rationale: «Пребывает» сохраняет важный для Иоанна смысл продолжающегося пребывания и отношений, а «в Нём» — исходный образ единения.
- source_word: οὐχ ἁμαρτάνει
  choice: не грешит
  rationale: Настоящее время передано прямо, без внесения в основной текст явно не выраженного оборота «не продолжает грешить»; возможное значение продолжающегося или характерного действия отмечено в сноске.
- source_word: ὁ ἁμαρτάνων
  choice: кто грешит
  rationale: Причастие настоящего времени передано симметрично первой части; аспектуальная неоднозначность сохранена и пояснена в сноске.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: не видел Его
  rationale: Перфект обозначает состояние, вытекающее из предшествующего действия; русская форма «не видел» естественно передаёт смысл без избыточного уточнения.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: и не познал Его
  rationale: «Познал» передаёт не только осведомлённость, но и личностное, relationalное знание; повтор отрицания естественно отражает οὐδέ.
- source_word: αὐτῷ / αὐτόν
  choice: Нём / Его
  rationale: Местоименная форма оригинала сохранена без уточнения референта как Бога, Сына или Христа.
theological_decisions:
- issue: Учит ли стих абсолютной безгрешности пребывающего во Христе
  choice: В основном тексте сохранена формальная фраза «не грешит… кто грешит», а возможное продолжающееся или характерное значение настоящего времени вынесено в сноску.
  alternative: «Не продолжает грешить… продолжает грешить» или «не живёт во грехе… живущий во грехе».
  rationale: Греческая форма допускает контекстуальное понимание продолжающегося или характерного действия, но сама по себе не кодирует его однозначно. Сноска сохраняет напряжение с 1 Ин. 1:8–2:2, не разрешая его прямо в переводе.
- issue: Референт местоимения αὐτός
  choice: Оставлено местоимение «Он» без поясняющей замены.
  alternative: Уточнить как «Бог», «Сын» или «Христос».
  rationale: Исходный текст использует местоимение, а контекст Иоанна тесно связывает Отца и Сына; уточнение сузило бы неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но понятным регистром. «Пребывает» и «познал» сохранены как естественные в религиозно-литературном контексте ключевые термины Иоанна; прописные буквы в местоимениях обозначают традиционное благоговейное написание, не уточняя референта.
