source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: ru
  text: Посмотрите, какую любовь Отец даровал нам, чтобы мы назывались детьми Бога, — и мы ими являемся.[a] Поэтому мир не знает нас, потому что не познал Его.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях слова «и мы ими являемся» отсутствуют.
    reason: textual_variant
  - marker: b
    text: 'Или: «мир не признаёт нас, потому что не признал Его». Греческий глагол может означать как знание, так и узнавание или признание.'
    reason: lexical_alternative
  - marker: c
    text: «Его» здесь естественнее всего понимать как указание на Отца; в более широком иоанновском контексте некоторые относят это местоимение ко Христу.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Посмотрите
  rationale: Аористный императив множественного числа служит призывом обратить внимание; «Посмотрите» естественно звучит по-русски и сохраняет прямое побуждение.
- source_word: ποταπὴν ἀγάπην
  choice: какую любовь
  rationale: ποταπός выражает изумление перед характером и качеством любви, а не только перед её величиной; русское «какую любовь» естественно сохраняет эту качественную открытость.
- source_word: δέδωκεν ἡμῖν
  choice: даровал нам
  rationale: Перфект указывает на совершившийся дар с сохраняющимся результатом; «даровал» передаёт благодатный характер дара и соответствует достойному литературному регистру.
- source_word: ὁ πατὴρ
  choice: Отец
  rationale: В контексте это наименование Бога; прописная буква соответствует русской издательской норме для божественного титула.
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: мы названы детьми Бога
  rationale: Конструкция с ἵνα обозначает результат или цель дара. Русская форма передаёт пассив κληθῶμεν и не добавляет гендерного уточнения к τέκνα.
- source_word: καὶ ἐσμέν
  choice: и мы действительно Его дети
  rationale: Сохраняет краткое emphатическое подтверждение реальности статуса; добавление «действительно» делает контраст между «названы» и «являемся» ясным в естественном русском синтаксисе, а повтор существительного устраняет неуклюжее «и мы есть».
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь с предшествующим утверждением.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Сохраняется широкий и богословски насыщенный иоанновский термин без истолкования его прямо в тексте.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: не знает нас
  rationale: Прямое соответствие γινώσκω сохраняет словесную связь с последующим οὐκ ἔγνω; оттенок «не признаёт/не распознаёт» остаётся возможным.
- source_word: οὐκ ἔγνω αὐτόν
  choice: не познал Его
  rationale: «Познал» естественно выражает состоявшееся в прошлом отсутствие подлинного знания и сохраняет тот же греческий глагол, варьируя вид и время по-русски.
theological_decisions:
- issue: Референт αὐτόν
  choice: «Его» прежде всего относится к Отцу
  alternative: Местоимение может пониматься как указание на Христа в более широком иоанновском контексте
  rationale: Ближайший явно названный антецедент — Отец. Однако греческое местоимение само по себе не называет референта, поэтому христологическое понимание не исключается и отмечено в сноске.
- issue: Наличие καὶ ἐσμέν
  choice: 'Включить в основной текст: «и мы действительно Его дети»'
  alternative: Опустить согласно части рукописной традиции
  rationale: SBLGNT включает слова καὶ ἐσμέν; они подчёркивают, что речь не только о названии, но и о действительном статусе. Вариант с пропуском отмечен в сноске.
- issue: Смысл «мир не знает нас»
  choice: Сохранить «не знает»
  alternative: Передать как «не признаёт» или «не узнаёт»
  rationale: Основной вариант сохраняет лексическую связь двух форм γινώσκω и богословскую многозначность; возможный оттенок непризнания указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Формулировка «какую любовь» сохраняет удивление перед её характером. Двоеточие естественно раскрывает содержание дара; причинная связь во второй части передана без тяжеловесности.
