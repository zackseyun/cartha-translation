  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: ru
  text: 'Вот как можно отличить детей Бога от детей дьявола: всякий, кто не поступает праведно, — не от Бога, как и тот, кто не любит своего брата.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брата или сестру», то есть другого верующего. В греческом тексте стоит слово «брат» в мужском роде и единственном числе.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Вот как
  rationale: Оборот указывает на признак или основание, по которому распознаётся различие; «вот как» естественно передаёт это в современном русском, не превращая фразу в указание лишь на предшествующее или лишь на последующее.
- source_word: φανερά ἐστιν
  choice: можно отличить
  rationale: Греческое выражение означает, что две группы явны или распознаваемы. Русская конструкция естественно передаёт смысл различимости, сохраняя связь с ἐν τούτῳ.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: детей Бога от детей дьявола
  rationale: Сохранён явный семейный образ τέκνα и резкое противопоставление принадлежности Богу и дьяволу.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: всякий, кто не поступает праведно
  rationale: Настоящее причастие описывает характерный образ действий. «Поступает праведно» естественнее по-русски, чем буквальное «делает праведность», и не сводит выражение к одному поступку.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: не от Бога
  rationale: «От Бога» сохраняет значение происхождения или принадлежности, не уточняя его посредством привнесённой богословской категории.
- source_word: καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: таков же и тот, кто не любит своего брата
  rationale: Восполнен подразумеваемый сказуемый «не от Бога», а καί передано как присоединение второго равнозначного признака. «Брата» сохраняет мужской род и единственное число оригинала.
theological_decisions:
- issue: Семейный язык духовной принадлежности
  choice: дети Бога и дети дьявола
  alternative: принадлежащие Богу и принадлежащие дьяволу
  rationale: τέκνα прямо выражает образ детей, важный для богословия послания; обобщающая замена ослабила бы противопоставление.
- issue: Смысл δικαιοσύνη в этическом контексте
  choice: поступает праведно
  alternative: творит справедливость
  rationale: Здесь речь идёт о праведном образе жизни в противопоставлении греху и отсутствию любви. Перевод «справедливость» неоправданно сузил бы значение до общественно-правовой сферы.
- issue: Объём значения ἀδελφός
  choice: своего брата
  alternative: брата или сестру; единоверца
  rationale: Основной текст сохраняет грамматически мужскую форму оригинала. Возможное контекстуальное распространение на любого члена общины отмечено в сноске, а не встроено в текст.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным звучанием. Формулировка «вот как можно отличить» делает синтаксис естественным и оставляет открытым, охватывает ли указание последующее утверждение, ближайший контекст или оба элемента. Образ «детей» и выражение «от Бога» сохранены без конфессионального истолкования.
