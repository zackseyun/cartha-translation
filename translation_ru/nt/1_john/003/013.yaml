  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: ru
  text: Не удивляйтесь, братья[a], если мир ненавидит вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте стоит форма мужского рода «братья»; здесь обращение, вероятно, относится ко всей общине верующих, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Не удивляйтесь
  rationale: Настоящее время повелительного наклонения с μή выражает запрет; «не удивляйтесь» естественно передаёт смысл в современном русском языке.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма звательного множественного числа мужского рода сохранена как прямое обращение; вероятный охват всей общины пояснён в сноске.
- source_word: εἰ
  choice: если
  rationale: Передаёт условную частицу без усиления до «когда» и без устранения присущей конструкции условности.
- source_word: μισεῖ
  choice: ненавидит
  rationale: Простое настоящее время естественно передаёт продолжающуюся или общую реальность, выраженную настоящим временем греческого глагола.
- source_word: ὁ κόσμος
  choice: мир
  rationale: Сохраняет ёмкий и характерный для Иоанна образ, не сужая его толкованием вроде «общество, враждебное Богу».
theological_decisions:
- issue: Представительное обращение мужского рода ἀδελφοί
  choice: Сохранить «братья» в основном тексте
  alternative: «братья и сёстры»; «верующие»
  rationale: Греческая форма грамматически мужского рода, но, вероятно, обращена ко всей общине верующих. Основной текст сохраняет форму источника, а сноска разъясняет её возможный широкий охват.
- issue: Иоанново значение κόσμος
  choice: Передать как «мир» без поясняющего расширения
  alternative: «мир, враждебный Богу»; «мирская система»
  rationale: У Иоанна слово часто обозначает человечество или порядок жизни в противостоянии Богу, однако буквальное «мир» сохраняет богословскую широту и не навязывает контексту одно толкование.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Порядок слов слегка адаптирован к русской норме без изменения смысла.
