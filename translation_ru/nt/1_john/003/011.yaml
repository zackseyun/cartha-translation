    rationale: В современном литературном русском сочетание «вот весть» в этой конструкции звучит обрывочно и не передаёт плавно формулу αὕτη ἐστὶν ἡ ἀγγελία. «Такова весть» сохраняет указательное значение и естественный порядок слов.
  - severity: low
    issue: «Мы должны любить» чрезмерно конкретизирует модальный оттенок ἵνα с сослагательным наклонением.
    rationale: Такой перевод допустим по контексту, но «чтобы мы любили» точнее сохраняет грамматическую форму и не предрешает, следует ли понимать придаточное прежде всего как содержание, цель или побудительный оттенок.
  - severity: low
