  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: ru
  text: 'Ибо такова весть, которую вы услышали с самого начала[a]: чтобы мы любили друг друга[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую вы слышали с самого начала».'
    reason: Стилистический вариант передачи относительного придаточного и времени получения вести.
  - marker: b
    text: 'Или: «мы должны любить друг друга»; возможно также: «будем любить друг друга».'
    reason: Ἵνα с сослагательным наклонением может передавать содержание вести с оттенком цели, нравственного обязательства или побуждения.
lexical_decisions:
- source_word: Ὅτι
  choice: Ведь
  rationale: Союз вводит пояснение к предшествующей мысли; «ведь» естественно передаёт объяснительную силу ὅτι в современном русском языке.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: вот весть
  rationale: Оборот сохраняет указательность и прямоту греческой конструкции, одновременно естественно предваряя содержание вести после двоеточия.
- source_word: ἣν ἠκούσατε
  choice: которую вы услышали
  rationale: Аорист обозначает восприятие возвещённой вести в прошлом; совершенный вид по-русски естественно выражает это завершённое получение учения.
- source_word: ἀπ’ ἀρχῆς
  choice: с самого начала
  rationale: Это естественный современный русский эквивалент устойчивого иоанновского выражения; частица «самого» подчёркивает исходную точку, не добавляя новой временной привязки.
- source_word: ἵνα ἀγαπῶμεν
  choice: мы должны любить
  rationale: В данном контексте ἵνα с сослагательным наклонением передаёт содержание вести и её нравственно-побудительную силу. Формулировка не сводит выражение ни к простой цели, ни к утверждению факта.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычное и точное русское взаимное местоименное выражение, соответствующее общинной направленности наставления.
theological_decisions:
- issue: Смысл ἵνα ἀγαπῶμεν ἀλλήλους
  choice: «мы должны любить друг друга» — содержание вести с нравственно обязательной силой
  alternative: «чтобы мы любили друг друга» (цель или желаемый результат); «будем любить друг друга» (прямой призыв)
  rationale: Конструкция допускает содержательный, целевой и побудительный оттенки. Основной текст ясно передаёт содержание и нравственную обязательность вести, а примечание сохраняет грамматически возможные целевой и увещательный варианты.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Весть» кратко и ясно передаёт ἀγγελία; конструкция с двоеточием делает содержание вести прозрачным для обычного читателя.
