  rationale: Исправлена неестественная русская формулировка при сохранении пояснительной связи с предыдущим контекстом. Основной вариант «чтобы мы любили друг друга» ближе к греческой конструкции ἵνα ἀγαπῶμεν и оставляет её функцию столь же открытой, как в оригинале; допустимые более интерпретирующие варианты вынесены в примечание.
