source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: ru
  text: 'И вот его заповедь: чтобы мы верили во имя его Сына Иисуса, Мессии[a][b], и любили друг друга, как он дал нам заповедь.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или традиционно: «Иисуса Христа». Греческое Χριστός передано как «Мессия», то есть «Помазанник».'
    reason: alternative_rendering
  - marker: b
    text: 'Или: «доверяли имени его Сына». Здесь имя представляет самого Иисуса — того, кем он явлен и какой властью обладает.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «как он дал нам заповедь».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐντολή
  choice: заповедь / заповедал
  rationale: «Заповедь» естественно передаёт обязательную силу существительного ἐντολή. В заключительной части та же смысловая основа выражена идиоматичным русским глаголом «заповедал», что сохраняет лексический повтор без неестественного оборота «дал заповедь».
- source_word: ἵνα πιστεύσωμεν
  choice: чтобы мы верили
  rationale: После слов «вот его заповедь» союз ἵνα вводит содержание заповеди; русское «чтобы мы верили» естественно передаёт сослагательную форму и её побудительный оттенок.
- source_word: πιστεύω τῷ ὀνόματι
  choice: верили во имя
  rationale: Оборот сохраняет характерную для Иоанна речь о вере, направленной на Личность, явленную в имени. Вариант «доверяли имени» отмечен в сноске как возможный смысловой оттенок.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: его Сына
  rationale: «Сын» написано с прописной буквы как обозначение Иисуса в его отношении к Богу; местоимение оставлено со строчной по нормам современного неритуального русского издания.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет силу титула, поэтому передано словом «Мессия», а не как фамильная часть имени. Русское склонение «Мессии» согласовано с родительным падежом всей группы.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: любили друг друга
  rationale: Это прямой, естественный и общепонятный русский эквивалент взаимного призыва к любви.
- source_word: καθὼς
  choice: как
  rationale: «Как» ясно выражает соответствие ранее данной заповеди и звучит естественнее более тяжеловесного «подобно тому как».
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: он и заповедал нам
  rationale: Греческое сочетание буквально говорит, что он «дал нам заповедь». Глагольный русский оборот идиоматичен, а частица «и» подчёркивает соответствие, выраженное καθὼς.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном сочетании слово обозначает мессианский титул Иисуса. Основной текст раскрывает значение титула, а традиционная форма приведена в сноске.
- issue: Смысл πιστεύω τῷ ὀνόματι
  choice: верить во имя
  alternative: доверять имени
  rationale: Основной вариант сохраняет характерную богословскую формулу Иоанна и не сводит веру лишь к интеллектуальному согласию; возможный оттенок доверия указан отдельно.
- issue: Единство заповеди
  choice: единственное число «заповедь» при двух координированных действиях
  alternative: множественное число «заповеди»
  rationale: Греческий текст употребляет ἐντολή в единственном числе и представляет веру и взаимную любовь как единое содержание заповеди.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Синтаксис сделан доступным для обычного читателя; сохранены единственное число «заповедь», формула «верить во имя» и титульное значение слова «Мессия». Местоимения, относящиеся к Богу и Христу, набраны со строчной буквы как нейтральная современная редакционная норма.
