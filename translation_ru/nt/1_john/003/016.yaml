source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: ru
  text: 'Вот как[a] мы познали любовь: он отдал за нас свою жизнь, и мы должны отдать свои жизни за братьев.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Именно в этом»; возможен также смысл: «Благодаря этому мы познали».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «за братьев»; в контексте, вероятно, имеются в виду все единоверцы, включая сестёр.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: вот как
  rationale: Оборот указывает на основание или способ познания любви. «Вот как» естественно вводит последующее пояснение, не сужая значение до одной строго логической связи.
- source_word: ἐγνώκαμεν
  choice: мы познали
  rationale: Перфект обозначает состоявшееся познание с сохраняющимся результатом; русский совершенный вид в данном контексте передаёт это естественно.
- source_word: τὴν ἀγάπην
  choice: любовь
  rationale: Прямое и контекстуально достаточное соответствие, сохраняющее любовь как определяемое далее понятие.
- source_word: ἐκεῖνος
  choice: он
  rationale: В контексте послания местоимение указывает на Иисуса Христа, однако перевод местоимением сохраняет способ выражения и не делает неявное имя явным.
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: Передаёт действие ради нас и в нашу пользу, не закрепляя в переводе какую-либо более узкую теорию искупления.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: отдал за нас свою жизнь
  rationale: В данном устойчивом обороте ψυχή означает жизнь, а сочетание с τίθημι — добровольную самоотдачу. «Отдал свою жизнь» понятно современному читателю и звучит естественно.
- source_word: ὀφείλομεν
  choice: мы должны
  rationale: Передаёт нравственную обязанность прямо и современно, без излишне юридического оттенка.
- source_word: τῶν ἀδελφῶν
  choice: братьев
  rationale: Сохраняет грамматически мужскую форму греческого текста; вероятный собирательный смысл, охватывающий всех единоверцев, пояснён в сноске.
- source_word: τὰς ψυχὰς θεῖναι
  choice: отдавать свои жизни
  rationale: Повтор глагола «отдавать» сохраняет связь с поступком Христа; множественное «жизни» соответствует греческому числу и каждому члену общины.
theological_decisions:
- issue: К кому относится ἐκεῖνος
  choice: Местоимение «он», в контексте относящееся к Иисусу Христу
  alternative: Явно назвать Иисуса или Христа
  rationale: Контекст и иоанновский оборот об отданной жизни ясно указывают на Христа, но греческий текст использует местоимение; перевод сохраняет это и не устраняет дискурсивную форму оригинала.
- issue: Объём значения ἀδελφῶν
  choice: «братьев» в основном тексте с пояснением собирательного смысла
  alternative: «братьев и сестёр» или «единоверцев»
  rationale: Мужская форма оригинала сохранена, а вероятное включение женщин в обозначение всей общины не скрыто и вынесено в сноску.
- issue: Значение ὑπέρ в самопожертвовании Христа
  choice: «за нас»
  alternative: «вместо нас» или «ради нас»
  rationale: «За нас» удерживает как благотворный, так и потенциально заместительный оттенок, не разрешая богословскую многозначность предлога односторонне.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Выбрано естественное «отдал жизнь» вместо более буквального и менее современного «положил душу»; параллелизм двух частей сохранён повтором «отдал/отдавать».
