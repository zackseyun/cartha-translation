  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: ru
  text: Дети[a], будем любить не словом и не языком[b], а делом и истиной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «детки»; ласковое обращение.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть речью; по-гречески буквально: «языком».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поступком и истиной»; «истиной» может также подразумевать подлинность, но не сводится только к искренности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Дети
  rationale: Ласковое обращение во множественном числе. «Дети» естественно и достойно звучит по-русски; буквальное «детки» сильнее передаёт уменьшительный оттенок, но в современном литературном русском может звучать чрезмерно по-детски или покровительственно.
- source_word: μὴ ἀγαπῶμεν
  choice: будем любить не
  rationale: Сочетание μή с сослагательным наклонением выражает призыв от первого лица множественного числа. Русское «будем любить не… а…» естественно передаёт совместное увещевание.
- source_word: λόγῳ
  choice: словом
  rationale: Творительный падеж кратко передаёт способ выражения любви и сохраняет параллель «словом… делом».
- source_word: μηδὲ τῇ γλώσσῃ
  choice: и не языком
  rationale: Сохранён конкретный образ греческого γλῶσσα («язык»), метонимически обозначающий речь. «И не» естественно продолжает русскую отрицательную конструкцию.
- source_word: ἀλλὰ
  choice: а
  rationale: В конструкции «не… а…» русский союз «а» наиболее естественно выражает резкое противопоставление.
- source_word: ἐν ἔργῳ
  choice: делом
  rationale: «Делом» сохраняет прямое значение ἔργον и выразительное противопоставление слову; возможный смысл «поступками» отмечен в сноске.
- source_word: καὶ ἀληθείᾳ
  choice: и истиной
  rationale: Сохранено основное значение ἀλήθεια и характерная для Иоанновых текстов смысловая глубина; перевод не сужает его до одной лишь искренности.
theological_decisions:
- issue: Значение ἀληθείᾳ в выражении «делом и истиной»
  choice: Сохранить «истиной»
  alternative: «искренне», «по-настоящему»
  rationale: Слово может указывать на подлинность любви, но в Иоанновых текстах «истина» имеет более широкий богословский смысл. Буквальная передача сохраняет и подлинность любви, и её согласие с Божьей истиной, не устраняя напряжения между этими оттенками.
translation_notes:
  register: Современный литературный русский, краткий и увещевательный. Сохранены параллелизм «словом… делом», конкретный образ «языком» и богословски ёмкое слово «истиной».
