source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: ru
  text: Всякий, кто рождён от Бога, не совершает греха[a], потому что Его семя остаётся в нём[b]; и он не может продолжать грешить[c], потому что рождён от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «не делает греха» или «не совершает греха». Греческая форма в этом контексте, вероятно, обозначает продолжающуюся греховную практику, а не единичный поступок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пребывает в нём».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «не может грешить». Инфинитив настоящего времени в данном контексте, вероятно, имеет смысл «не может продолжать грешить».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Всякий, кто рождён
  rationale: Субстантивированное причастие с πᾶς обозначает весь класс людей; конструкция «всякий, кто» естественно передаёт обобщённость, а «рождён» — состояние, возникшее вследствие рождения.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ при γεννάω указывает на источник или происхождение; по-русски это естественно передаётся выражением «рождён от Бога».
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: не предаётся греху
  rationale: Выражение ποιεῖν ἁμαρτίαν буквально означает «делать/совершать грех», но в данном контексте настоящее время указывает на характерную, продолжающуюся практику. «Не предаётся греху» передаёт устойчивый образ действий, не превращая утверждение в отрицание любого отдельного греховного поступка.
- source_word: σπέρμα αὐτοῦ
  choice: Его семя
  rationale: Сохранена конкретная метафора «семя», поскольку её точный смысл в контексте спорен и не должен истолковываться прямо в переводе. Заглавная буква в «Его» ясно относит местоимение к Богу.
- source_word: ἐν αὐτῷ μένει
  choice: остаётся в нём
  rationale: Глагол μένω выражает пребывание или продолжительное сохранение; «остаётся» — естественный современный эквивалент, сохраняющий длительный смысл.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: не может продолжать грешить
  rationale: Инфинитив настоящего времени ἁμαρτάνειν в контексте естественно описывает продолжающееся действие. Слово «продолжать» делает этот аспект явным, тогда как буквальное «не может грешить» может быть понято как абсолютная невозможность любого единичного греха.
- source_word: γεγέννηται
  choice: рождён
  rationale: Перфект указывает на совершившееся рождение и сохраняющееся вследствие него состояние. Русское краткое страдательное причастие естественно передаёт это результирующее состояние.
theological_decisions:
- issue: Учит ли стих абсолютной безгрешности или несовместимости рождения от Бога с продолжающейся греховной практикой
  choice: Основной текст говорит о невозможности продолжать жить в греховной практике.
  alternative: Абсолютная невозможность совершить какой-либо грех.
  rationale: Формы настоящего времени ποιεῖ и ἁμαρτάνειν в ближайшем и общем контексте послания допускают и, вероятнее всего, предполагают продолжающееся или характерное действие. Такой перевод сохраняет напряжение с 1 Ин. 1:8–2:1, не устраняя буквальную альтернативу, которая отмечена в сноске.
- issue: Значение выражения «Его семя»
  choice: Метафора «семя» сохранена без истолкования.
  alternative: Слово Бога, жизнь Бога или Божья природа.
  rationale: Сам стих не раскрывает точный референт σπέρμα. Его конкретизация в основном тексте внесла бы спорное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Избегаются как архаичное «творит грех», так и чрезмерно разговорные обороты. Метафора «семя» и богословское напряжение текста сохранены.
