  source_fidelity: '«Не предаётся греху» удачно передаёт предполагаемую длительность, но заметно смещает прямое ποιεῖν ἁμαρτίαν («делать/совершать грех») к мысли о порабощённости или самоотдаче греху. «Не совершает греха» ближе к исходной конструкции; примечание сохраняет вероятный аспектуальный смысл. Остальные соответствия исходному тексту точны: совершенный вид γεννάω передан как устойчивое состояние рождения от Бога, а метафора σπέρμα оставлена неистолкованной.'
