  source_fidelity: '«Так» допустимо, но в современном русском несколько неопределённо; «По этому» яснее передаёт ἐν τούτῳ как указание на основание/признак. «Мы от истины» формально близко к ἐκ τῆς ἀληθείας, однако по-русски звучит неестественно и может восприниматься как неполная конструкция. «Мы принадлежим истине» — естественный и контекстуально оправданный вариант, но несколько интерпретирует образ происхождения; поэтому лучше сохранить более близкое «мы — от истины». «Убедим своё сердце» грамматически возможно, но в современном литературном русском неестественно: обычно убеждают кого-либо в чём-либо. В данном контексте πείσομεν с καρδίαν означает успокоение/уверение сердца перед Богом; «успокоим свои сердца» естественно и соответствует контекстуальному значению.'
