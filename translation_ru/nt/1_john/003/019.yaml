lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Так
  rationale: В данном контексте выражение указывает на основание или средство узнавания. «Так» естественно передаёт эту связь по-русски, не уточняя сверх текста, относится ли указание к предшествующему или последующему.
- source_word: γνωσόμεθα
  choice: мы узнаем
  rationale: Будущее время γινώσκω прямо и естественно передаётся формой «узнаем»; она может обозначать как установление, так и осознание факта.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: мы от истины
  rationale: Предлог ἐκ выражает происхождение или принадлежность. Формулировка «от истины» сохраняет образ и богословскую ёмкость оригинала, не заменяя его пояснением.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: перед Ним
  rationale: Кратко и точно передаёт пространственно-отношенческое выражение «перед Ним, в Его присутствии».
- source_word: πείσομεν
  choice: убедим
  rationale: Сохраняет основное значение πείθω и неоднозначность выражения с «сердцем» как дополнением. Более контекстуальное «успокоим» вынесено в примечание, чтобы не сужать смысл в основном тексте.
- source_word: τὴν καρδίαν ἡμῶν
  choice: своё сердце
  rationale: Сохраняет единственное число греческого текста и естественно употребляет возвратное притяжательное местоимение при подлежащем «мы».
theological_decisions:
- issue: Смысл выражения «от истины»
  choice: Сохранить «мы от истины»
  alternative: «мы принадлежим истине»
  rationale: Оригинал допускает оттенки происхождения и принадлежности, но не раскрывает их здесь полностью; буквенный образ не следует заменять более определённым богословским толкованием.
- issue: Смысл убеждения сердца перед Богом
  choice: «убедим своё сердце»
  alternative: «успокоим свои сердца»
  rationale: Форма с «убедим» сохраняет лексическую широту πείθω и напряжение контекста. Вариант «успокоим» хорошо передаёт вероятный смысл внутреннего ободрения, но интерпретирует его более однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальной близостью к греческому тексту. Заглавное «Ним» использовано как принятое в русском библейском стиле уважительное обозначение Бога; оно не устраняет референциальную ясность контекста.
