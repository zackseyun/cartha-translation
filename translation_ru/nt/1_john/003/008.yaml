source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: ru
  text: 'Тот, кто совершает грех[a], — от дьявола[b], потому что дьявол грешит от начала. Для этого и был явлен[c] Сын Божий: чтобы разрушить[d] дела дьявола.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «тот, кто делает грех» или «тот, кто совершает грех». Греческое настоящее причастие указывает на продолжающееся или характерное поведение, а не обязательно на один отдельный поступок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «принадлежит дьяволу». Греческое «от» указывает на нравственно-духовный источник или принадлежность, а не на буквальное происхождение.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «явился» или «стал явным». Греческий глагол подчёркивает явление и раскрытие.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «уничтожить» или «расстроить». Греческий глагол буквально означает «развязать, распустить», а здесь — разрушить или лишить силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: кто живёт во грехе
  rationale: Настоящее причастие передаёт продолжающееся или характерное совершение греха. «Живёт во грехе» естественно выражает устойчивый образ жизни, не сводя высказывание к одному отдельному проступку.
- source_word: ἐκ τοῦ διαβόλου
  choice: от дьявола
  rationale: Предлог ἐκ обозначает источник или нравственно-духовную принадлежность. «От дьявола» сохраняет образ происхождения, не утверждая буквального рождения от него.
- source_word: ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει
  choice: потому что дьявол грешит от начала
  rationale: «Потому что» передаёт причинное значение ὅτι, а «от начала» сохраняет намеренно неуточнённую временную формулу Иоанна. Русское настоящее время естественно выражает продолжающуюся характерную деятельность.
- source_word: ἐφανερώθη
  choice: явился
  rationale: В данном контексте глагол говорит о явлении и раскрытии Сына Божьего и его миссии. «Явился» звучит естественно и сохраняет иоанновскую тему явления; формальное «был явлен» возможно, но менее естественно по-русски.
- source_word: ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου
  choice: чтобы разрушить дела дьявола
  rationale: Оборот ἵνα с сослагательным наклонением выражает цель. λύω буквально значит «развязать, распустить», а здесь — расстроить и лишить силы; «разрушить» передаёт решительное устранение дел дьявола, сохраняя широкое слово «дела».
theological_decisions:
- issue: Характер греховного действия в настоящем времени
  choice: 'Устойчивое, характерное греховное поведение: «живёт во грехе»'
  alternative: Утверждение о любом единичном греховном поступке
  rationale: Настоящее причастие ποιῶν в контексте Первого послания Иоанна указывает на продолжающуюся или характерную практику. Такой перевод сохраняет напряжение с 1 Ин. 1:8–2:2, не превращая стих в отрицание того, что верующий может согрешить.
- issue: Смысл выражения «от дьявола»
  choice: Нравственно-духовный источник и принадлежность
  alternative: Буквальное происхождение или рождение от дьявола
  rationale: ἐκ в иоанновском противопоставлении обозначает источник и сторону, с которой соотнесён образ жизни; текст не утверждает буквального происхождения человека от дьявола.
- issue: Цель явления Сына Божьего
  choice: Разрушить и расстроить дела дьявола
  alternative: Только обнаружить или разоблачить дела дьявола
  rationale: Целевая конструкция ἵνα λύσῃ говорит о действенном разрушении, а не лишь о раскрытии. Перевод не уточняет способ и объём исполнения сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной библейской интонацией. Формула «от начала» сохранена без уточнения, поскольку греческий текст не определяет, идёт ли речь о сотворении, падении дьявола или начале человеческого греха. Лексика избегает конфессионально узких толкований.
