  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: ru
  text: Не так, как Каин, который был от лукавого[a] и убил[b] своего брата. А почему он убил его? Потому что его дела были злыми, а дела его брата — праведными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от зла». Греческое выражение допускает отвлечённое понимание, однако в текстах Иоанна оно обычно обозначает личного лукавого.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «зарезал», «заколол». Греческий глагол сильнее обычного «убил» и передаёт насильственное умерщвление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Не так, как Каин
  rationale: Сохраняет отрицательное сравнение с предшествующим призывом и звучит естественно по-русски.
- source_word: ἐκ τοῦ πονηροῦ
  choice: от лукавого
  rationale: Предлог «от» передаёт значение источника в ἐκ, а субстантивированное «лукавого» допускает наиболее вероятное в контексте Иоанна личное понимание.
- source_word: ἔσφαξεν
  choice: зарезал
  rationale: Передаёт более резкую и наглядную силу σφάζω по сравнению с нейтральным «убил»; возможный более общий вариант вынесен в сноску.
- source_word: χάριν τίνος
  choice: почему
  rationale: Естественно передаёт вопрос о причине без тяжеловесного буквального оборота.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: его дела были злы
  rationale: «Дела» естественно передаёт ἔργα в нравственном контексте, а «злы» сохраняет прямую этическую характеристику πονηρά.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: а дела его брата — праведны
  rationale: Повтор слова «дела» делает греческий эллипсис ясным по-русски; «праведны» передаёт нравственный смысл δίκαια и сохраняет контраст со злыми делами.
theological_decisions:
- issue: Личное или отвлечённое значение τοῦ πονηροῦ
  choice: 'личное: «от лукавого»'
  alternative: 'отвлечённое: «от зла»'
  rationale: В произведениях Иоанна выражение с артиклем обычно указывает на личного лукавого, однако грамматически возможно и отвлечённое прочтение; оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, прямой синтаксической структурой. «Лукавого» оставлено со строчной буквы, чтобы не вводить отсутствующую в греческом тексте типографскую интерпретацию; личное прочтение определяется формой и контекстом.
