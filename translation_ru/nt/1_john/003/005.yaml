  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: ru
  text: И вы знаете, что Он явился[a], чтобы удалить грехи[b], и в Нём нет греха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был явлен», «стал явным».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убрать» или «унести грехи». Греческий глагол может означать «поднять», «нести», «убрать» или «унести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: знаете
  rationale: Форма οἶδα в койне обычно имеет настоящее значение; «знаете» естественно передаёт смысл.
- source_word: ἐκεῖνος
  choice: Он
  rationale: В данном контексте указательное местоимение подчёркнуто указывает на Иисуса Христа; русское «Он» звучит естественно и не добавляет имени, отсутствующего в греческом тексте.
- source_word: ἐφανερώθη
  choice: явился
  rationale: Здесь глагол говорит об историческом явлении Христа. «Явился» — ясный современный эквивалент, сохраняющий возможный оттенок того, что прежде сокрытое стало явным.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз «чтобы» естественно и точно выражает цель.
- source_word: τὰς ἁμαρτίας
  choice: грехи
  rationale: Сохранено множественное число греческого существительного, указывающее на конкретную множественность грехов.
- source_word: ἄρῃ
  choice: унести
  rationale: Глагол αἴρω охватывает значения поднять, нести и удалить. «Унести» сохраняет одновременно оттенки удаления и несения, не сводя смысл к одной модели искупления.
- source_word: ἁμαρτία
  choice: грех
  rationale: Единственное число без артикля естественно передаётся словом «грех» и выражает полное отсутствие греха в Нём.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Буквально и естественно сохраняет характерную для Иоанна формулировку.
theological_decisions:
- issue: К кому относится ἐκεῖνος
  choice: к Иисусу Христу, переданному местоимением «Он»
  alternative: буквальное «Тот»
  rationale: Непосредственный контекст указывает на Христа как на явившегося ради устранения грехов и не имеющего в Себе греха. Местоимение сохраняет форму исходного текста без поясняющей вставки.
- issue: Смысл αἴρω применительно к грехам
  choice: «унести грехи»
  alternative: «устранить грехи» или «взять на Себя грехи»
  rationale: '«Унести» удерживает реальную лексическую широту глагола: грехи удаляются, но сам способ их удаления не уточняется. Вариант «взять на Себя» был бы богословски более определённым, чем данный стих сам по себе.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Прописные буквы в местоимениях «Он», «Нём» применены как распространённая русская издательская конвенция для ясного указания на Христа; они не отражают различия регистра в греческой рукописной традиции.
