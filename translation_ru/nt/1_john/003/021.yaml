id: 1JN.3.21
reference: 1 John 3:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: ru
  text: Возлюбленные, если наше сердце не осуждает нас, то мы имеем дерзновение перед Богом.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сердце» здесь означает внутреннего человека и его нравственное сознание; по смыслу близко к «совести».
    reason: cultural_note
  - marker: b
    text: 'Или: «уверенность перед Богом»; возможный смысл — свобода открыто обращаться к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Возлюбленные
  rationale: Форма обращения во множественном числе выражает тёплое отношение и сохраняет связь с ключевой для 1 Иоанна темой любви.
- source_word: ἐὰν
  choice: если
  rationale: Естественно передаёт условную конструкцию с сослагательным наклонением.
- source_word: ἡ καρδία
  choice: наше сердце
  rationale: Сохраняет исходную метафору; в контексте речь идёт о внутреннем человеке и его нравственной самооценке, однако замена словом «совесть» сузила бы значение.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: не осуждает нас
  rationale: Передаёт судебно-нравственный оттенок καταγινώσκω и естественно продолжает мысль предыдущего стиха.
- source_word: παρρησίαν ἔχομεν
  choice: мы имеем дерзновение
  rationale: «Дерзновение» передаёт открытую, свободную и уверенную позицию без сведения смысла лишь к внутреннему чувству уверенности.
- source_word: πρὸς τὸν θεόν
  choice: перед Богом
  rationale: Идиоматично выражает положение человека по отношению к Богу и в Его присутствии.
theological_decisions:
- issue: Значение внутренней способности, обозначенной словом καρδία
  choice: сердце
  alternative: совесть
  rationale: «Сердце» сохраняет лексику и образ оригинала, а функциональная близость к совести поясняется в сноске без сужения смысла основного текста.
- issue: Оттенок παρρησία в отношении к Богу
  choice: дерзновение перед Богом
  alternative: уверенность перед Богом
  rationale: Выбранная формулировка сохраняет напряжение между свободой открыто обращаться к Богу и благоговением перед Ним; она не сводит понятие к субъективной психологической уверенности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Возлюбленные» и «дерзновение» сохраняют тематические и смысловые связи оригинала; синтаксис остаётся ясным для современного читателя.
