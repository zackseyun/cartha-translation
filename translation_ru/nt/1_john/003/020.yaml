  naturalness: Формулировка звучит современно, литературно и достаточно лаконично. «Бог больше нашего сердца» — нормальная библейско-литературная сравнительная конструкция; добавление «то» делает условное предложение ясным, не меняя смысла.
  terminology: «Сердце», «осуждает», «Бог» и «знает всё» последовательно и точно передают ключевые термины. Перевод не подменяет «сердце» толковательным словом «совесть» и не сужает смысл Божьего превосходства до одного богословского объяснения.
