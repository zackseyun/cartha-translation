source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: ru
  text: Ведь если наше сердце осуждает нас[a], то Бог больше нашего сердца[b] и знает всё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укоряет нас»; «находит в нас вину».'
    reason: lexical_alternative
  - marker: b
    text: Слова «Бог больше нашего сердца» могут указывать на то, что Он полнее знает истину о нас, а также подразумевать, что Его власть выше нашего самоосуждения.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι (первое)
  choice: ведь
  rationale: Первое ὅτι вводит объяснение или основание предыдущей мысли; «ведь» естественно передаёт эту пояснительную связь в современном русском языке.
- source_word: ἐὰν
  choice: если
  rationale: В сочетании с формой сослагательного наклонения καταγινώσκῃ обозначает условную ситуацию.
- source_word: καταγινώσκῃ
  choice: осуждает
  rationale: Глагол может означать осуждение, укор или признание виновным. «Осуждает» сохраняет выраженный в контексте внутренний судебный оттенок, не сводя сердце непосредственно к совести.
- source_word: ἡ καρδία ἡμῶν
  choice: наше сердце
  rationale: Буквальный образ сердца как средоточия внутренней жизни сохранён; его не следует истолковывать в основном тексте исключительно как совесть.
- source_word: ὅτι (второе)
  choice: передано синтаксической связью условного предложения
  rationale: Второе ὅτι допускает пояснительное или причинное понимание. В русском предложении его функция естественно выражена конструкцией «если… то…», без неуклюжего повторения союза.
- source_word: μείζων
  choice: больше
  rationale: 'Сравнение оставлено широким: текст прямо не ограничивает превосходство Бога только знанием, властью или милостью, хотя следующая часть особо указывает на знание.'
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Обычный и точный русский эквивалент θεός.
- source_word: τῆς καρδίας ἡμῶν
  choice: нашего сердца
  rationale: Родительный падеж после сравнительной степени естественно передаёт греческую сравнительную конструкцию и сохраняет повтор слова «сердце».
- source_word: γινώσκει πάντα
  choice: знает всё
  rationale: Естественно и полно передаёт всеохватность πάντα; местоимение-подлежащее в русском языке не требуется, поскольку Бог назван в той же части предложения.
theological_decisions:
- issue: В каком смысле Бог «больше нашего сердца»
  choice: Сохранить широкую формулировку, не сводя её исключительно к милости, власти или всеведению.
  alternative: Передать как «Божий приговор выше нашего самоосуждения» либо «Бог знает нас лучше нашего сердца».
  rationale: Само сравнение не уточняет аспект Божьего превосходства. Фраза «и знает всё» подчёркивает полноту Божьего знания, но не требует сужать смысл сравнительной формы только до знания.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным звучанием. Союз «ведь» передаёт пояснительную связь с контекстом; конструкция «если… то…» обеспечивает естественный русский синтаксис. Библейский образ сердца и намеренная широта утверждения о Божьем превосходстве сохранены.
