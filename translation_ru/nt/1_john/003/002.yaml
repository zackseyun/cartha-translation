  source_fidelity: 'Основной смысл передан точно: настоящее сыновство Божье противопоставлено ещё не открытому будущему, а обещание подобия Христу связано с видением Его «таким, каков Он есть». Однако «если Он явится» переводит страдательный аорист φανερωθῇ активной конструкцией и ослабляет намеренную лексическую связь с προηγущим ἐφανερώθη («не открылось/не было явлено»).'
  naturalness: Текст звучит естественно и соответствует современному литературному, сдержанно-торжественному русскому. «Если Он будет явлен» несколько менее разговорно, чем «если Он явится», но это оправдано требованием точно передать страдательный залог и сохранить смысловую связь в греческом тексте.
  terminology: '«Возлюбленные», «дети Божьи», «подобны Ему» и «таким, каков Он есть» удачны по регистру и смыслу. Прописные буквы в относящихся ко Христу местоимениях допустимы в принятой русской библейской традиции. Неявное подлежащее φανερωθῇ не следует представлять как бесспорно установленное: его христологическое понимание уместно в основном тексте при сохранении альтернативы в примечании.'
