revisions:
- from: Возлюбленные, теперь мы — дети Божьи, но ещё не открылось, чем мы будем. Мы знаем, что, если Он явится[a], мы будем подобны Ему, потому что увидим Его таким, каков Он есть.
  to: Возлюбленные, теперь мы — дети Божьи, но ещё не открылось, чем мы будем. Мы знаем, что, если Он будет явлен[a], мы будем подобны Ему, потому что увидим Его таким, каков Он есть.
  rationale: Заменено «если Он явится» на «если Он будет явлен», чтобы передать страдательный залог φανερωθῇ и сохранить повтор глагола φανερόω с «ещё не открылось». Сноска сохраняет грамматически возможное понимание невыраженного подлежащего как будущего состояния верующих, а также распространённую более интерпретативную передачу «когда Он явится». Остальной текст не требует изменения.
