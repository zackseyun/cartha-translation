id: 1JN.3.2
reference: 1 John 3:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: ru
  text: Возлюбленные, теперь мы — дети Божьи, но ещё не открылось, чем мы будем. Мы знаем, что, если Он будет явлен[a], мы будем подобны Ему, потому что увидим Его таким, каков Он есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «если это откроется», то есть если откроется, чем мы будем; в греческом тексте подлежащее не выражено. Контекст, однако, скорее указывает на Христа. Часто переводят: «когда Он явится».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Возлюбленные
  rationale: Тёплое обращение во множественном числе; сохраняет связь с языком любви и звучит достойно в современном литературном русском.
- source_word: νῦν
  choice: теперь
  rationale: Передаёт временное противопоставление нынешнего положения будущему откровению.
- source_word: τέκνα θεοῦ
  choice: дети Божьи
  rationale: Выражает сыновнее отношение к Богу без указания на пол; естественная русская конструкция.
- source_word: οὔπω ἐφανερώθη
  choice: ещё не открылось
  rationale: Передаёт пассивное проявление или раскрытие и сохраняет лексическую связь с последующим φανερωθῇ.
- source_word: τί ἐσόμεθα
  choice: чем мы будем
  rationale: Естественно обозначает будущее состояние или природу верующих, а не только их личную идентичность.
- source_word: οἴδαμεν
  choice: Мы знаем
  rationale: Прямо передаёт глагол совершенной формы с настоящим значением.
- source_word: ἐὰν φανερωθῇ
  choice: если Он явится
  rationale: Неявный субъект по контексту, вероятнее всего, Христос. Условное «если» сохраняет форму ἐάν, а «явится» естественно передаёт явление в русском, хотя пассивность греческой формы отражена менее буквально.
- source_word: ὅμοιοι αὐτῷ
  choice: подобны Ему
  rationale: Обозначает реальное сходство, но не тождество; «подобны» соответствует достоинству регистра.
- source_word: ὀψόμεθα αὐτὸν
  choice: увидим Его
  rationale: Прямая и естественная передача будущей формы ὁράω с личным дополнением.
- source_word: καθώς ἐστιν
  choice: таким, каков Он есть
  rationale: Ясно передаёт видение Христа в Его действительном состоянии, не усиливая сравнение сверх греческого текста.
theological_decisions:
- issue: Референт невыраженного подлежащего в ἐὰν φανερωθῇ
  choice: 'Подразумевается Христос: «если Он явится».'
  alternative: 'Подразумевается будущее состояние верующих: «если это откроется»; возможна также временная передача «когда Он явится».'
  rationale: Последующие слова об уподоблении Ему и видении Его убедительно указывают на Христа, однако грамматическая невыраженность подлежащего сохраняется в примечании.
- issue: Характер будущего подобия верующих Христу
  choice: «мы будем подобны Ему» выражает сходство, но не тождество.
  alternative: 'Более сильная, но неточная передача: «мы станем такими же, как Он».'
  rationale: ὅμοιοι означает подобие; перевод сохраняет силу обещанного преображения, не утверждая полного тождества.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Местоимения, относящиеся ко Христу, написаны с прописной буквы согласно распространённой русской библейской традиции. Сохранено условное «если», чтобы не превращать ἐάν без пояснения во временное «когда».
