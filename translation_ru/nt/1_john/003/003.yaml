  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: ru
  text: И всякий, кто возлагает эту надежду на него, очищает себя[a], подобно тому как он чист.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто имеет эту надежду в нём». Греческое выражение допускает передачу надежды как направленной на него или пребывающей в нём.'
    reason: lexical_alternative
  - marker: b
    text: Местоимения «него» и «он», вероятнее всего, относятся здесь к Сыну, Христу, хотя греческий текст прямо не называет референта.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: каждый, кто возлагает
  rationale: Субстантивированное причастие имеет обобщающий смысл. В сочетании с ἐλπίδα ἐπ’ αὐτῷ естественное русское «кто возлагает эту надежду на Него» передаёт не просто обладание надеждой, а её направленность.
- source_word: τὴν ἐλπίδα ταύτην
  choice: эту надежду
  rationale: Указательное местоимение отсылает к надежде, выраженной в предыдущем стихе; «надежда» сохраняет смысл уверенного ожидания.
- source_word: ἐπ’ αὐτῷ
  choice: на Него
  rationale: ἐπί с дательным здесь может указывать на объект или основание надежды. «Возлагает … на Него» естественно выражает её направленность, не называя прямо референта местоимения.
- source_word: ἁγνίζει ἑαυτὸν
  choice: очищает себя
  rationale: Сохраняет возвратное значение и нравственно-религиозный оттенок ἁγνίζω, а также связь с последующим ἁγνός.
- source_word: καθὼς
  choice: как и
  rationale: Передаёт сравнение естественно и кратко; частица «и» подчёркивает соответствие образцу.
- source_word: ἐκεῖνος ἁγνός ἐστιν
  choice: Он чист
  rationale: В русском контексте местоимение звучит естественнее буквального «Тот». Заглавная буква отражает наиболее вероятную отсылку ко Христу, а сноска сохраняет формальную неоднозначность греческого местоимения.
theological_decisions:
- issue: Референт αὐτῷ и ἐκεῖνος
  choice: В основном тексте сохранены местоимения; наиболее вероятный референт — Христос, Сын.
  alternative: Местоимения могут относиться к Богу Отцу либо сохранять намеренную неоднозначность между Отцом и Сыном.
  rationale: Ближайший контекст о том, что верующие увидят Его таким, каков Он есть, преимущественно указывает на Христа, однако греческий текст не называет референта прямо.
- issue: Человеческое участие в очищении
  choice: «очищает себя»
  alternative: «бывает очищен» или «Бог очищает его»
  rationale: Греческий глагол стоит в действительном залоге и прямо называет человека субъектом действия. Перевод не превращает это утверждение ни в пассив, ни в исчерпывающее учение о самостоятельном нравственном очищении.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. «Возлагает надежду» — привычное библейское и общеупотребительное сочетание. Маркеры сносок поставлены непосредственно при выражениях, к которым относятся.
