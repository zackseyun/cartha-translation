source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: ru
  text: То, что было от начала[a], что мы слышали, что видели своими глазами, что рассматривали и чего коснулись наши руки, — о слове жизни[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «То, что существовало от начала». Греческое местоимение стоит в среднем роде и может широко указывать на всё содержание апостольского свидетельства о Сыне, а не прямо называть Его словами «Тот, кто».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Слове жизни». Это выражение может лично указывать на Сына, перекликаясь с Ин. 1:1, либо обозначать несущую жизнь весть о Нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: То, что / что
  rationale: 'Средний род относительного местоимения сохранён и не заменён личным «Тот, кто»: речь может идти широко о содержании апостольского свидетельства, хотя контекст явно христологический.'
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: было от начала
  rationale: Передаёт имперфект ἦν и характерный для Иоанна оборот ἀπ’ ἀρχῆς, не добавляя не выраженных в тексте оттенков.
- source_word: ἀκηκόαμεν
  choice: мы слышали
  rationale: Русское прошедшее совершенного вида естественно передаёт состоявшееся восприятие и его значение для нынешнего свидетельства; буквальное «услышали» могло бы неоправданно представить это как единичное событие.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: видели своими глазами
  rationale: Сохранены и свидетельский характер перфекта, и подчёркнутая телесная конкретность выражения «нашими глазами»; по-русски естественно «своими глазами».
- source_word: ἐθεασάμεθα
  choice: созерцали
  rationale: Глагол означает внимательное, непосредственное рассматривание, а не простой мимолётный взгляд. «Созерцали» сохраняет этот оттенок в достойном современном регистре.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: чего касались наши руки
  rationale: Передаёт физическую осязаемость свидетельства. Относительное «чего» согласуется со средним ὃ и связывает оборот с предыдущими придаточными.
- source_word: περὶ
  choice: о
  rationale: Естественный русский способ ввести предмет последующего свидетельства; более буквальное «относительно» было бы тяжеловесным.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: о слове жизни
  rationale: «Слово» сохраняет диапазон λόγος — слово, весть и возможное личное указание на Сына. Строчная буква не решает неоднозначность, которой греческое письмо само по себе не разрешает.
theological_decisions:
- issue: Референт местоимений среднего рода и выражения λόγος τῆς ζωῆς
  choice: Сохранить безлично-широкое «То, что…» и написать «слово жизни» со строчной буквы.
  alternative: «Тот, кто был от начала» и/или «Слово жизни» с прописной буквы, прямо отождествляющее референт с Сыном.
  rationale: Христологический смысл контекста несомненен, однако греческий текст употребляет местоимения среднего рода и не кодирует различие прописных и строчных букв. Перевод поэтому не должен устранять напряжение между личным референтом и свидетельством или вестью о нём.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом пролога. Повтор «что» сохраняет анафору оригинала. Тире отражает незавершённость синтаксиса, продолжающегося в следующих стихах; маркер [b] поставлен непосредственно при неоднозначном выражении «слове жизни».
