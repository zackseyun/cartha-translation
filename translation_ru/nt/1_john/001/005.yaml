id: 1JN.1.5
reference: 1 John 1:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: ru
  text: 'И вот весть, которую мы услышали от Него и возвещаем вам: Бог есть свет, и нет в Нём никакой тьмы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: весть
  rationale: «Весть» естественно звучит в современном русском и передаёт содержание сообщаемого; кроме того, позволяет сохранить смысловую связь с глаголом «возвещаем».
- source_word: ἀκηκόαμεν
  choice: мы услышали
  rationale: Русское прошедшее совершенного вида естественно передаёт состоявшееся и сохраняющее значение восприятие вести; буквальное «услышали и продолжаем иметь услышанное» было бы неестественно.
- source_word: ἀπ’ αὐτοῦ
  choice: от Него
  rationale: Сохранено местоимение оригинала без подстановки «от Иисуса» или «от Сына», чтобы не вносить в текст дополнительное истолкование.
- source_word: ἀναγγέλλομεν
  choice: возвещаем
  rationale: Глагол передаёт открытое сообщение полученной вести и в русском поддерживает смысловую связь с существительным «весть».
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Бог есть свет
  rationale: Прямая метафора сохранена без поясняющих добавлений; связка «есть» придаёт формулировке ясность и достоинство, оставаясь понятной современному читателю.
- source_word: σκοτία
  choice: тьма
  rationale: «Тьма» сохраняет как буквальный образ, так и нравственно-богословскую многозначность слова в контексте Иоанновых писаний.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Естественный русский эквивалент, сохраняющий метафорическую формулировку без её истолкования.
- source_word: οὐκ ... οὐδεμία
  choice: нет ... никакой
  rationale: 'Двойное отрицательное оформление по нормам русского языка передаёт усиленное греческое отрицание: полное отсутствие тьмы.'
theological_decisions:
- issue: Метафорическое сказуемое «Бог есть свет»
  choice: Метафора сохранена прямо, без поясняющего определения.
  alternative: «Бог — чистый свет»; «Бог — святой свет»
  rationale: Определения «чистый» или «святой» сузили бы многогранный образ оригинала и внесли бы толкование в основной текст.
- issue: Референт местоимения αὐτοῦ
  choice: Сохранено «от Него».
  alternative: «от Иисуса»; «от Сына»
  rationale: Хотя референт устанавливается из контекста, оригинал использует местоимение; его конкретизация разрешила бы контекстуальный вопрос непосредственно в переводе.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Формула «Бог есть свет» сохранена как краткое и выразительное утверждение; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
