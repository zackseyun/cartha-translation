source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: ru
  text: То, что мы видели и слышали, возвещаем и вам, чтобы и вы имели общение[a] с нами. И наше общение — с Отцом и с Его Сыном, Иисусом Мессией[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Общение» можно также передать словами «единение», «сопричастность» или «участие»; здесь подразумеваются разделяемая жизнь и отношения.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисусом Христом». Греческое Χριστός означает «Мессия», то есть Помазанник, и может передаваться традиционным словом «Христос».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὃ
  choice: То, что
  rationale: Сохраняет грамматически средний и широкий характер относительного местоимения, не сводя его референт только к личности.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: мы видели и слышали
  rationale: 'Естественная русская передача греческих перфектов: речь идёт о пережитом свидетельстве, сохраняющем значение в настоящем.'
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: возвещаем и вам
  rationale: «Возвещаем» передаёт сообщение засвидетельствованного, а «и вам» сохраняет καί и его присоединительное значение.
- source_word: κοινωνία
  choice: общение
  rationale: В современном библейском русском языке слово охватывает совместную причастность, близость и разделяемую жизнь, не ограничивая смысл бытовым общением.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: И наше общение
  rationale: Краткая русская конструкция естественно вводит пояснение; сочетание καί и δέ здесь не требует тяжеловесной буквальной передачи двумя отдельными частицами.
- source_word: μετὰ τοῦ πατρὸς
  choice: с Отцом
  rationale: Титульное употребление πατήρ применительно к Богу передано с прописной буквы.
- source_word: μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: с Его Сыном
  rationale: Сохраняет сыновнее отношение к Отцу и естественно передаёт греческое притяжательное местоимение.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисусом Мессией
  rationale: После предлога «с» имена стоят в творительном падеже; Χριστός передан как титул «Мессия», а не как утратившая прозрачность часть имени.
theological_decisions:
- issue: Смысл κοινωνία
  choice: общение
  alternative: единение; сопричастность; участие
  rationale: «Общение» сохраняет как отношение верующих к апостольским свидетелям, так и их совместную причастность Отцу и Сыну, не сужая смысл до социальной связи или сакраментального термина.
- issue: Передача Χριστοῦ
  choice: Мессией
  alternative: Христом
  rationale: В сочетании Ἰησοῦ Χριστοῦ слово Χριστός допускает традиционную передачу «Христос», но здесь может быть ясно воспринято как титул; «Мессия» раскрывает его значение, не добавляя конфессионального толкования.
- issue: Референт ὃ
  choice: То, что
  alternative: Тот, кого
  rationale: Средний род греческого местоимения и ближайший контекст позволяют более широкую отсылку к явленной жизни и засвидетельствованной реальности; персонализация была бы преждевременным снятием этой неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и естественным; тире во втором предложении подчёркивает пояснительный характер утверждения без добавления отсутствующей в греческом связки.
