id: 1JN.1.10
reference: 1 John 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: ru
  text: Если мы говорим, что не согрешили[a], то делаем его лжецом, и его слово[b] не в нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не грешили». В греческом стоит перфект, обозначающий совершённое в прошлом действие, которое сохраняет значение в настоящем; в русском у этой формы нет точного грамматического соответствия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весть». Греческое λόγος может означать и «слово», и «весть»; вариант «слово» сохраняет характерную для Иоанна лексику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: если мы говорим
  rationale: Условная конструкция с ἐάν и сослагательным наклонением естественно передаётся по-русски настоящим временем с «если»; вариант «утверждаем» добавлял бы оттенок, которого нет в самом глаголе.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: не согрешили
  rationale: Совершенный вид передаёт совершённость действия; русский язык не располагает прямым соответствием греческому перфекту, выражающему прошлое действие с сохраняющейся значимостью.
- source_word: ψεύστην
  choice: лжецом
  rationale: Существительное ψεύστης прямо означает «лжец»; перевод не смягчает личный и резкий характер высказывания.
- source_word: ποιοῦμεν αὐτὸν
  choice: делаем его
  rationale: Конструкция ποιέω с предикативным винительным означает представлять или объявлять кого-либо кем-либо; буквальное «делаем его лжецом» ясно и естественно в данном контексте.
- source_word: ὁ λόγος αὐτοῦ
  choice: его слово
  rationale: λόγος может обозначать как «слово», так и «весть». Выбрано «слово», чтобы сохранить характерную для Иоанна лексику и возможную многозначность.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: не в нас
  rationale: Краткая именная конструкция точно сохраняет пространственно-внутренний образ греческого текста; «не пребывает в нас» добавляло бы значение, прямо не выраженное глаголом εἰμί.
theological_decisions:
- issue: К кому относятся αὐτόν и αὐτοῦ
  choice: В основном тексте сохранено местоимение «его»; по контексту оно относится к Богу.
  alternative: 'Прямо назвать Бога: «делаем Бога лжецом, и Божьего слова нет в нас».'
  rationale: Ближайший контекст указывает на Бога как на того, чьё свидетельство отвергается, однако замена местоимения именем устранила бы формальную связь с греческим текстом и сделала бы подразумеваемое явным.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет краткость, параллелизм и резкость оригинала. Местоимение, относящееся к Богу, дано со строчной буквы согласно нейтральной современной орфографической практике и форме исходного текста.
