source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: ru
  text: — и жизнь явилась[a], и мы видели её, и свидетельствуем, и возвещаем вам вечную жизнь[b], которая была у Отца и явилась нам —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была явлена», «открылась» (ἐφανερώθη).'
    reason: lexical_alternative
  - marker: b
    text: Выражение «вечная жизнь» грамматически не обозначает лицо, но в данном контексте лично указывает на Сына — Того, Кто был у Отца и явился апостолам.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: жизнь / вечную жизнь
  rationale: Существительное сохранено без замены на личное местоимение или имя. В русском определённость передаётся контекстом, поскольку артикля нет; повторение слова «жизнь» сохраняет композицию и богословскую насыщенность греческого текста.
- source_word: ἐφανερώθη
  choice: явилась
  rationale: «Явилась» естественно передаёт раскрытие прежде сокрытого и хорошо сочетается с личностным референтом слова «жизнь». Эта форма не вынуждает называть действующее лицо пассивной конструкции и сохраняет возможный оттенок появления.
- source_word: ἑωράκαμεν
  choice: мы видели её
  rationale: Русское прошедшее «видели» естественно выражает состоявшееся свидетельское восприятие, значимое и теперь. Местоимение «её» добавлено как требуемое русским синтаксисом дополнение и относится к «жизни».
- source_word: μαρτυροῦμεν
  choice: свидетельствуем
  rationale: Сохраняет смысл свидетельского подтверждения и настоящее время греческой формы.
- source_word: ἀπαγγέλλομεν
  choice: возвещаем
  rationale: Передаёт сообщение, обращённое к другим, и отличает этот глагол от «свидетельствуем»; слово уместно в современном литературном библейском регистре.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: вечную жизнь
  rationale: Естественная русская именная группа, сохраняющая определение αἰώνιον. Определённость выражается контекстом, а не отсутствующим в русском языке артиклем.
- source_word: ἥτις
  choice: которая
  rationale: Относительное местоимение согласовано с грамматическим антецедентом «жизнь». Оно не подменено личным «который», поэтому личностный смысл не навязывается грамматически.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: была у Отца
  rationale: Идиоматически передаёт пребывание в непосредственном отношении к Отцу и перекликается с языком Ин 1:1, не разворачивая выражение в богословский парафраз.
- source_word: τὸν πατέρα
  choice: Отца
  rationale: Заглавная буква отмечает употребление слова как обозначения Бога Отца.
- source_word: ἡμῖν
  choice: нам
  rationale: Точно передаёт дательный падеж и сохраняет акцент на апостольских очевидцах.
theological_decisions:
- issue: Личный или безличный способ передачи повторяющегося слова «жизнь»
  choice: Сохранено «жизнь» и «вечную жизнь», а личностный референт раскрывается контекстом и поясняется в сноске.
  alternative: «Он явился» или прямое именование Сына.
  rationale: Греческий текст говорит о Сыне посредством существительного ζωὴ и не употребляет здесь мужского личного местоимения. Сохранение этой формы не устраняет намеренную богословскую многозначность.
- issue: Передача предсуществования и отношения к Отцу в πρὸς τὸν πατέρα
  choice: «была у Отца»
  alternative: «пребывала перед Отцом» или «находилась в присутствии Отца»
  rationale: Выбранная формулировка утверждает предшествующее явлению пребывание вечной жизни у Отца и сохраняет личностное отношение, не добавляя отсутствующих в тексте уточнений.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Повтор союзов «и» сохраняет накопительную структуру греческой фразы. Начальное и конечное тире показывают, что стих составляет вставную часть предложения, продолжающегося из 1:1 в 1:3.
