  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: ru
  text: Но если мы ходим во свете, как Он Сам во свете, то имеем общение друг с другом[a], и кровь Иисуса, Его Сына, очищает нас от всякого греха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между собой». Некоторые толкователи понимают эти слова как указание на общение верующих с Богом, однако взаимное греческое местоимение естественнее всего относится к общению верующих друг с другом.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «от всего греха». Греческое выражение можно понимать распределительно («от всякого греха») или собирательно («от всего греха»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Но если
  rationale: δέ противопоставляет это условие утверждению предыдущего стиха о хождении во тьме; «но если» естественно передаёт контраст.
- source_word: ἐν τῷ φωτὶ
  choice: во свете
  rationale: Сохраняет ключевой для контекста образ света и естественно звучит по-русски.
- source_word: περιπατῶμεν
  choice: ходим
  rationale: Сохраняет этическую метафору хождения, не сводя её сразу к толкованию «живём».
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: как и Он — во свете
  rationale: «Он» передаёт явное αὐτός, а частица «и» подчёркивает сопоставление; тире естественно восполняет опущенную в русском связку настоящего времени.
- source_word: κοινωνίαν ἔχομεν
  choice: имеем общение
  rationale: Передаёт совместную причастность и отношения без внесения специально сакраментального оттенка слова «причастие».
- source_word: μετ’ ἀλλήλων
  choice: друг с другом
  rationale: Естественно передаёт взаимное значение греческого местоимения ἀλλήλων.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: кровь Иисуса, Его Сына
  rationale: Сохраняет «кровь» как подлежащее и ясно передаёт приложение, относящее Иисуса к Богу как Его Сына.
- source_word: καθαρίζει
  choice: очищает
  rationale: Передаёт нравственные и культовые ассоциации глагола; настоящее время сохраняет характерное или продолжающееся действие без усиления «непрестанно».
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: от всякого греха
  rationale: Естественно передаёт возможное дистрибутивное значение πάσης при существительном в единственном числе; коллективное понимание отмечено в сноске.
theological_decisions:
- issue: К кому относится «друг с другом» (μετ’ ἀλλήλων)
  choice: взаимное общение верующих
  alternative: общение верующих с Богом
  rationale: Взаимное местоимение ἀλλήλων естественнее всего обозначает отношения участников между собой. Более широкий контекст говорит и об общении с Богом, однако это не следует молча подставлять в данную фразу.
- issue: Видовое значение настоящего времени καθαρίζει
  choice: «очищает» — простое настоящее с возможным продолжающимся или характерным смыслом
  alternative: «продолжает очищать» или однократное очищение
  rationale: Греческое настоящее допускает продолжающееся или характерное действие, но явное усиление «продолжает» было бы более толковательным, чем исходный текст.
translation_notes:
  register: Современный литературный русский язык с сохранением иоанновской метафоры хождения во свете. Прописные «Он» и «Его» употреблены как традиционные уважительные обозначения Бога; синтаксис остаётся ясным и торжественным без архаизации.
