  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: ru
  text: И мы пишем это, чтобы наша радость была полной[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «ваша радость» вместо «наша радость».'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Естественный сочинительный союз, связывающий этот стих с предшествующим свидетельством.
- source_word: ταῦτα
  choice: это
  rationale: В современном русском «пишем это» естественно обозначает всё содержание письма; буквальное «эти вещи» здесь звучало бы неидиоматично.
- source_word: γράφομεν
  choice: пишем
  rationale: Настоящее время естественно передаёт совершаемое авторами действие и эпистолярное настоящее.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение сохранено, поскольку в греческом оно имеет некоторую эмфатическую силу, хотя лицо уже обозначено формой глагола.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение и естественно звучит в современном русском.
- source_word: ἡ χαρὰ ἡμῶν
  choice: наша радость
  rationale: Основной текст SBLGNT содержит ἡμῶν, «наша»; существительное χαρά передано обычным и точным словом «радость».
- source_word: ᾖ πεπληρωμένη
  choice: была полной
  rationale: Передаёт результирующее состояние полноты, выраженное сочетанием сослагательной формы εἰμί с перфектным страдательным причастием πληρόω; формулировка естественна по-русски.
theological_decisions:
- issue: Местоимение в выражении ἡ χαρὰ ἡμῶν
  choice: наша радость
  alternative: ваша радость
  rationale: Предоставленный греческий текст читает ἡμῶν («наша»), поэтому это чтение принято в основном тексте. Значимое рукописное чтение «ваша» сохранено в сноске без разрешения текстологического расхождения в пользу варианта.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сохранено эксплицитное «мы», а греческое ταῦτα естественно передано собирательным русским «это».
