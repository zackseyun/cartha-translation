source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: ru
  text: Если мы исповедуем свои грехи, то Он, будучи верен и праведен, простит нам грехи и очистит нас от всякой неправедности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедлив».'
    reason: 'Лексический вариант: δίκαιος может означать «праведный» или «справедливый».'
lexical_decisions:
- source_word: ἐὰν
  choice: если
  rationale: Передаёт условный характер конструкции, не добавляя значения повторяемости, возможного при переводе «всякий раз, когда».
- source_word: ὁμολογῶμεν
  choice: мы исповедуем
  rationale: В контексте грехов глагол означает открыто признавать, исповедовать; «исповедуем» точно передаёт и признание, и нравственную серьёзность.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: свои грехи
  rationale: Возвратное притяжательное местоимение естественно для русского языка при подлежащем «мы» и точно передаёт «наши грехи».
- source_word: πιστός
  choice: верен
  rationale: Указывает на надёжность и неизменность Бога; «верен» — естественный и ёмкий русский эквивалент.
- source_word: δίκαιος
  choice: праведен
  rationale: Сохраняет широкое значение нравственной правоты, не сводя слово исключительно к судебной справедливости.
- source_word: ἵνα
  choice: двоеточие с формами будущего времени
  rationale: В этой конструкции ἵνα может выражать цель или ожидаемый результат. Русское двоеточие естественно связывает Божью верность и праведность с последующими прощением и очищением, не вводя неестественное «чтобы» после кратких прилагательных.
- source_word: ἀφῇ
  choice: простит
  rationale: В контексте грехов ἀφίημι означает «прощать»; форма будущего времени естественно передаёт действие, следующее при выполнении условия.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: простит нам грехи
  rationale: Прямо и естественно передаёт дательный объект и прямое дополнение греческой конструкции.
- source_word: καθαρίσῃ
  choice: очистит
  rationale: Сохраняет образ удаления нравственной нечистоты и хорошо сочетается с прощением.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: от всякой неправедности
  rationale: «Неправедность» сохраняет широкое нравственно-богословское значение ἀδικία; единственное число с «всякой» соответствует греческой конструкции.
theological_decisions:
- issue: Значение δίκαιος как основания Божьего прощения
  choice: праведен
  alternative: справедлив
  rationale: «Праведен» передаёт нравственную правоту Бога в широком смысле и не навязывает исключительно судебное толкование. «Справедлив» остаётся допустимым лексическим вариантом и поэтому указан в сноске.
- issue: Связь ἵνα с Божьей верностью и праведностью
  choice: пояснительная связь через двоеточие
  alternative: «чтобы простить нам грехи и очистить нас»
  rationale: Греческая конструкция допускает оттенки цели или результата. Двоеточие сохраняет логическую связь, не разрешая богословское напряжение искусственно и не создавая в русском впечатления, будто Богу требуется быть праведным ради последующего действия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавное «Он» употреблено как традиционное уважительное обозначение Бога. Повтор слова «грехи» сохранён вслед за греческим текстом; «неправедность» оставлена как более широкое понятие, параллельное конкретным грехам.
