id: 1JN.1.8
reference: 1 John 1:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: ru
  text: Если мы говорим, что не имеем греха[a], то обманываем самих себя, и истины нет в нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «греховности»; буквально по-гречески: «греха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Если
  rationale: Передаёт условную конструкцию с сослагательным наклонением естественным для русского языка способом.
- source_word: εἴπωμεν
  choice: мы говорим
  rationale: Настоящее время в русском естественно выражает предполагаемое утверждение в условной конструкции.
- source_word: ἁμαρτίαν
  choice: греха
  rationale: Единственное число без артикля обозначает грех как присутствующую в человеке реальность, а не один отдельный проступок; родительный падеж требуется при отрицании с «иметь».
- source_word: οὐκ ἔχομεν
  choice: не имеем
  rationale: Сохраняет образ обладания в греческом тексте и отличается от утверждения, что человек не совершал грехов.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: обманываем самих себя
  rationale: Возвратное значение передано ясно и естественно; «самих» сохраняет выразительное ударение греческого местоимения.
- source_word: ἡ ἀλήθεια
  choice: истины
  rationale: Определённое «истина» сохраняет характерную для Иоанна смысловую глубину, не сводя выражение только к искренности или только к открытому Богом учению.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: нет в нас
  rationale: Естественная русская экзистенциальная конструкция, сохраняющая внутреннюю, личную направленность выражения.
theological_decisions:
- issue: Смысл слов «не имеем греха»
  choice: 'Сохранено «не имеем греха»: речь идёт о наличии греха, а не только об отдельных греховных поступках.'
  alternative: «в нас нет греховности» или «мы не совершили греха»
  rationale: Греческое ἁμαρτίαν ἔχομεν буквально говорит о том, чтобы «иметь грех», и отличается от отрицания совершённых грехов в 1 Ин. 1:10. Более толковательное «греховность» вынесено в примечание.
- issue: Смысл слов «истины нет в нас»
  choice: Формулировка оставлена без поясняющего расширения.
  alternative: «Божьей истины нет в нас» или «мы не живём по истине»
  rationale: Краткое выражение Иоанна может охватывать и объективную Божью истину, и внутреннюю правдивость; перевод не устраняет эту многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской, но ясной конструкцией «не имеем греха». Союз «то» делает длинное условное предложение естественным по-русски, не добавляя нового смыслового содержания.
