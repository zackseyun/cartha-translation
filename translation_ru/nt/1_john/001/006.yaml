source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: ru
  text: Если мы говорим, что имеем общение с Ним, но ходим во тьме, то лжём и не поступаем по истине.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не делаем истины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Если мы говорим
  rationale: Сохраняет условный характер греческой конструкции без усиления до «утверждаем» или «заявляем».
- source_word: κοινωνίαν ἔχομεν
  choice: имеем общение
  rationale: Близко передаёт греческую конструкцию и её смысл участия, связи и общности, не сужая его до одной стороны отношений.
- source_word: μετ’ αὐτοῦ
  choice: с Ним
  rationale: Сохраняет местоимение исходного текста; его референт определяется контекстом.
- source_word: ἐν τῷ σκότει
  choice: во тьме
  rationale: Естественная русская передача образа нравственно-духовной сферы, противопоставленной Богу; отсутствие артикля в русском не устраняет определённости образа.
- source_word: περιπατῶμεν
  choice: ходим
  rationale: Сохраняет понятную библейскую метафору образа жизни и поведения, не заменяя её толкованием «живём».
- source_word: ψευδόμεθα
  choice: лжём
  rationale: Кратко и естественно передаёт настоящее время и деятельный характер глагола.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: не поступаем по истине
  rationale: Естественно по-русски передаёт идиому «не делаем истину», сохраняя практический, поведенческий смысл; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Нравственно-духовная метафора тьмы
  choice: Сохранить «ходим во тьме»
  alternative: живём в грехе; живём во тьме
  rationale: Иоаннова метафора включает зло, ложь и отчуждение от Бога, но стих не сводит её явно лишь к одному из этих понятий.
- issue: Практический характер истины
  choice: «не поступаем по истине» с буквальной сноской
  alternative: не делаем истины; не живём по истине
  rationale: Передаёт истину не только как содержание речи, но и как то, что осуществляется в поведении, не превращая идиому в конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных, всё ещё понятных библейских метафор «ходить» и «тьма». Противительный союз «но» естественно передаёт смысл καί в контексте резкого несоответствия между исповеданием и образом жизни.
