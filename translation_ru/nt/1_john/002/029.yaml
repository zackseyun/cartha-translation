id: 1JN.2.29
reference: 1 John 2:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: ru
  text: Если вы знаете, что Он праведен[a], то знаете[b], что всякий, кто поступает праведно, рождён от Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимения «Он» и «Него» могут относиться как к Богу Отцу, так и к Сыну; греческий текст не называет лицо прямо.
    reason: alternative_reading
  - marker: b
    text: 'Или: «знайте». Греческая форма может быть понята и как повеление.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Если вы знаете
  rationale: Условная конструкция передана естественным русским оборотом; οἶδα здесь обозначает знание, а не приобретение знания.
- source_word: δίκαιός
  choice: праведен
  rationale: «Праведен» передаёт нравственно-богословский смысл и сохраняет связь с δικαιοσύνη далее в стихе.
- source_word: γινώσκετε
  choice: то знаете
  rationale: Форма понята как изъявительное наклонение; «то» ясно связывает главное предложение с условием. Возможное повелительное прочтение отмечено в сноске.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: всякий, кто поступает праведно
  rationale: Причастие настоящего времени выражает характерное, продолжающееся поведение; этот оборот звучит естественно по-русски и сохраняет смысл праведного образа действий.
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: рождён от Него
  rationale: Русское «рождён от» естественно передаёт образ происхождения, а краткое страдательное причастие выражает совершившееся рождение с сохраняющимся результатом.
theological_decisions:
- issue: К кому относятся местоимения в δίκαιός ἐστιν и ἐξ αὐτοῦ
  choice: Сохранены местоимения «Он» и «Него» без уточнения лица.
  alternative: Прямо назвать Бога Отца либо Сына.
  rationale: Ближайший контекст допускает оба понимания, а сам греческий стих не называет лицо прямо; перевод не должен устранять эту богословскую неоднозначность.
- issue: Изъявительное или повелительное значение γινώσκετε
  choice: «то знаете» — изъявительное наклонение.
  alternative: «знайте» — повелительное наклонение.
  rationale: В условной конструкции изъявительное прочтение создаёт естественное утверждение, однако греческая форма грамматически допускает и повелительное значение, поэтому оно вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным звучанием. Повтор «знаете» сохранён ради структуры исходного текста; формула «поступает праведно» естественно передаёт устойчивый образ действий без архаизма «творит правду».
