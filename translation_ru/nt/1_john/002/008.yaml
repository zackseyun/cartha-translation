  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: πάλιν уместно передано связующим «И всё же» в контексте противопоставления ст. 7; ὅ ἐστιν ἀληθές сохранено как нейтральное «то, что истинно»; продолжающийся характер παράγεται и φαίνει передан формами «проходит» и «уже сияет». Причинная связь ὅτι ясно выражена словами «потому что».'
