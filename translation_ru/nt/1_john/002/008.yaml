  terminology: «Новая заповедь», «тьма» и «истинный свет» являются точными и устойчивыми соответствиями важным иоанновым выражениям. Написание «Нём» соответствует принятому в русском христианском литературном регистре способу обозначить наиболее вероятную отсылку ко Христу, не меняя смысла. Примечание корректно сохраняет альтернативное понимание αὐτῷ и его якорь поставлен непосредственно после «Нём».
