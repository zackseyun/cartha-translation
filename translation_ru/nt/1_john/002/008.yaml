id: 1JN.2.8
reference: 1 John 2:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: ru
  text: И всё же я пишу вам новую заповедь — то, что истинно в Нём[a] и в вас, потому что тьма проходит и истинный свет уже сияет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ней и в вас», если местоимение относится к заповеди, а не лично к Христу.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: И всё же
  rationale: В связи с противопоставлением «не новую» в предыдущем стихе и «новую» здесь слово вводит иной аспект той же заповеди. «И всё же» естественно передаёт этот поворот мысли, не сводя πάλιν к простому временному «снова».
- source_word: ἐντολὴν καινὴν
  choice: новую заповедь
  rationale: Прямое и устойчивое соответствие, сохраняющее качественный оттенок καινός и связь с характерной для Иоанна формулировкой.
- source_word: γράφω ὑμῖν
  choice: я пишу вам
  rationale: Русское настоящее время естественно передаёт настоящее время греческого глагола в эпистолярном контексте.
- source_word: ὅ ἐστιν ἀληθές
  choice: то, что истинно
  rationale: Средний род относительного местоимения может относиться ко всей предшествующей мысли, а не согласовываться непосредственно с существительным женского рода ἐντολή. Формулировка сохраняет эту синтаксическую широту и повтор корня истины.
- source_word: ἐν αὐτῷ καὶ ἐν ὑμῖν
  choice: в Нём и в вас
  rationale: «В Нём» передаёт наиболее вероятную личную отсылку к Христу; «в вас» сохраняет прямой параллелизм обеих предложных конструкций и не сужает смысл до «среди вас».
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает причинное основание предшествующего утверждения.
- source_word: ἡ σκοτία παράγεται
  choice: тьма проходит
  rationale: Передаёт продолжающийся процесс удаления или исчезновения тьмы без усиления до уже завершившегося состояния.
- source_word: τὸ φῶς τὸ ἀληθινόν
  choice: истинный свет
  rationale: Сохраняет ключевое для писаний Иоанна выражение и смысловой контраст с тьмой.
- source_word: ἤδη φαίνει
  choice: уже сияет
  rationale: «Уже» передаёт наступившую действительность, а «сияет» естественно выражает продолжающееся действие φαίνει.
theological_decisions:
- issue: К чему относится αὐτῷ
  choice: 'Личная отсылка ко Христу: «в Нём»'
  alternative: 'Отсылка к заповеди: «в ней»'
  rationale: Форма αὐτῷ допускает мужской или средний род; в контексте наиболее вероятна личная отсылка ко Христу, в Котором эта истина воплощена. Однако синтаксическая сложность фразы позволяет понимать местоимение как относящееся к заповеди или ко всему сказанному о ней, поэтому альтернативу необходимо сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Поворот «И всё же» естественно связывает стих с противопоставлением в предыдущем контексте; конструкция «то, что истинно» сохраняет необычную форму греческой относительной части и не устраняет её смысловую напряжённость.
