revisions:
- from: А в вас остаётся помазание, которое вы получили от Него, и вам не нужно, чтобы кто-либо учил вас. Но поскольку Его помазание учит вас всему, и оно истинно, а не ложно, то, как оно и научило вас, оставайтесь в Нём.[a][b]
  to: Что же до вас, то помазание, которое вы получили от Него, остаётся в вас, и вам не нужно, чтобы кто-либо учил вас. Но поскольку Его помазание учит вас обо всём, и оно истинно и не является ложью, то, как оно и научило вас, оставайтесь в Нём.[a][b]
  rationale: Исправления ограничены более точной передачей ἀληθές ... οὐκ ἔστιν ψεῦδος, ясной передачей περὶ πάντων и более естественным воспроизведением начального выделения адресатов. Сохранены метафора «помазание», повтор глагола μένω, неуточнённость референта местоимений и текстовая альтернатива заключительного глагола.
