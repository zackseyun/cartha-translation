source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: ru
  text: Что же до вас, то помазание, которое вы получили от Него, остаётся в вас, и вам не нужно, чтобы кто-либо учил вас. Но поскольку Его помазание учит вас обо всём, и оно истинно и не является ложью, то, как оно и научило вас, оставайтесь в Нём.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как оно и научило вас, вы остаётесь в Нём». Греческая форма может быть понята и как повелительное, и как изъявительное наклонение; некоторые рукописи также поддерживают изъявительное прочтение.'
    reason: textual_variant
  - marker: b
    text: В выражениях «остаётся в вас» и «оставайтесь в Нём» употреблён один и тот же греческий глагол.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: помазание
  rationale: Сохраняет метафору греческого текста и не подменяет её истолкованием «Святой Дух» или «весть».
- source_word: ἀπ’ αὐτοῦ
  choice: от Него
  rationale: Сохраняет местоимение и позволяет контексту определить его референта; прописная буква естественно указывает на божественный референт в русском библейском тексте.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: остаётся в вас / оставайтесь в Нём
  rationale: Последовательно передаёт повтор μένω современным и понятным русским глаголом.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: вам не нужно, чтобы кто-либо учил вас
  rationale: Близко следует греческой конструкции, не смягчая и не абсолютизируя утверждение.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: учил / учит / научило
  rationale: Сохраняет лексический повтор и временные формы в естественном русском выражении.
- source_word: περὶ πάντων
  choice: всему
  rationale: Естественная русская передача значения «обо всём / всему» при глаголе «учить», без искусственного ограничения сферы.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: оно истинно, а не ложно
  rationale: Передаёт резкое противопоставление истины и лжи; при этом русское «не ложно» грамматически согласуется с «помазание» и звучит достойно.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: как оно и научило вас
  rationale: Сохраняет сравнительную связь καθὼς и отсылку к уже полученному наставлению.
theological_decisions:
- issue: Референт χρῖσμα
  choice: В основном тексте оставлено «помазание».
  alternative: «Святой Дух» или «полученная весть».
  rationale: Хотя в контексте, вероятно, имеется в виду Дух или Его действие, сам автор употребляет метафору, которую перевод не должен преждевременно истолковывать.
- issue: Смысл утверждения об отсутствии нужды в учителе
  choice: Фраза сохранена без поясняющего ограничения.
  alternative: Явно ограничить её лжеучителями либо истолковать как отрицание всякого человеческого наставления.
  rationale: Обе конкретизации выходили бы за непосредственную формулировку стиха; границы утверждения должен показать контекст.
- issue: Наклонение заключительного μένετε
  choice: 'Повелительное: «оставайтесь в Нём».'
  alternative: 'Изъявительное: «вы остаётесь в Нём».'
  rationale: В принятом тексте форма естественно читается как призыв, но морфологическая неоднозначность формы отмечена в сноске.
- issue: Референт ἐν αὐτῷ
  choice: «в Нём» — личный мужской референт.
  alternative: «в нём» — в помазании.
  rationale: Мужской род греческого местоимения и контекст благоприятствуют личному референту; перевод сохраняет это, не называя его прямо.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для обычного читателя; сохранены ключевые повторы и неоднозначности оригинала. Маркеры сносок поставлены после заключительной фразы, к которой относятся оба примечания.
