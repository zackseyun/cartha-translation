  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: ru
  text: Всякий, кто отрицает Сына, не имеет и Отца; кто исповедует Сына, имеет и Отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях отсутствуют слова: «кто исповедует Сына, имеет и Отца».'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Всякий, кто отрицает
  rationale: Субстантивированное причастие настоящего времени имеет обобщающий смысл. Такая формулировка естественна для современного русского языка и сохраняет всеобщий охват высказывания.
- source_word: ἀρνούμενος
  choice: отрицает
  rationale: В контексте исповедания веры глагол означает отрицание Сына и соответствует антонимичному «исповедует» во второй части стиха.
- source_word: τὸν υἱὸν
  choice: Сына
  rationale: Сохранён определённый христологический титул без пояснительного добавления «Божьего», которого нет в греческом тексте.
- source_word: οὐδὲ τὸν πατέρα ἔχει
  choice: не имеет и Отца
  rationale: Русская конструкция «не имеет и…» естественно передаёт распространение отрицания на Отца и сохраняет буквальный глагол «иметь».
- source_word: ὁ ὁμολογῶν
  choice: кто исповедует
  rationale: «Исповедует» передаёт открытое признание Сына и сохраняет конфессиональный оттенок ὁμολογέω; обобщённая конструкция уравновешивает первую часть.
- source_word: καὶ τὸν πατέρα ἔχει
  choice: имеет и Отца
  rationale: 'Частица «и» передаёт соответствие второй части первой: исповедующий Сына имеет также Отца.'
theological_decisions:
- issue: Вторая часть стиха отмечена в SBLGNT как текстуально спорная
  choice: 'Включить в основной текст: «кто исповедует Сына, имеет и Отца»'
  alternative: Опустить эту часть согласно некоторым рукописям
  rationale: Предоставленный текст SBLGNT включает эту часть, хотя и отмечает её как вариантную; поэтому она переведена в основном тексте, а разночтение отражено в сноске.
- issue: Смысл выражения «иметь Отца»
  choice: Сохранить буквальное выражение «иметь Отца»
  alternative: Истолковать как «иметь общение с Отцом» или «принадлежать Отцу»
  rationale: Иоаннова формулировка допускает богатый реляционный смысл. Буквальный перевод сохраняет богословскую напряжённость и не сужает её до одного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Параллелизм двух частей сохранён; прописные буквы в словах «Сын» и «Отец» обозначают титулы.
