base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: ru
  text: А тот, кто ненавидит своего брата[a], находится во тьме и ходит во тьме, и не знает, куда идёт, потому что тьма ослепила его глаза.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брата или сестру»; по-гречески буквально «брата». Вероятно, имеется в виду другой верующий, принадлежащий к христианской общине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: тот, кто ненавидит
  rationale: Субстантивированное причастие настоящего времени выражает характерную, продолжающуюся позицию; такая конструкция естественна в современном русском языке.
- source_word: ἀδελφὸν
  choice: своего брата
  rationale: Сохранены мужской род и единственное число греческого текста; местоимение αὐτοῦ естественно передано возвратным притяжательным «своего». Более широкий возможный референт пояснён в сноске.
- source_word: ἐν τῇ σκοτίᾳ
  choice: во тьме
  rationale: Сохранены образ тьмы и его повторение. В русском языке отвлечённое «тьма» обычно употребляется без определительного эквивалента артикля, не теряя здесь нравственно-духовного смысла.
- source_word: περιπατεῖ
  choice: ходит
  rationale: Буквальный образ хождения сохранён как важная для Иоанна метафора образа жизни; перевод «живёт» был бы более толковательным.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: не знает, куда идёт
  rationale: Естественная русская формулировка сохраняет образ движения и настоящее время.
- source_word: ἐτύφλωσεν
  choice: ослепила
  rationale: Греческий аорист передан русским прошедшим временем; результат действия очевиден из контекста, поэтому добавлять аспектуальное «уже» не требуется.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: его глаза
  rationale: Сохранён конкретный образ глаз, а не заменён отвлечённым «его» или «зрение».
theological_decisions:
- issue: Нравственно-духовный смысл σκοτία в дуалистической образности Иоанна
  choice: Передать буквально как «тьма».
  alternative: «зло» или «тьма греха»
  rationale: Буквальный образ сохраняет намеренное противопоставление света и тьмы и не сужает богословский смысл толковательной вставкой.
- issue: Референт слова ἀδελφός
  choice: Сохранить в основном тексте «брат».
  alternative: «брат или сестра» либо «единоверец»
  rationale: В источнике стоит мужской род единственного числа. В контексте слово, вероятно, обозначает другого члена общины верующих; это пояснено в сноске без нейтрализации формы оригинала.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксический параллелизм и троекратный образ тьмы сохранены; «ходит во тьме» оставлено как прозрачная библейская метафора поведения.
