id: 1JN.2.14
reference: 1 John 2:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: ru
  text: Я написал вам, дети, потому что вы познали Отца. Я написал вам, отцы, потому что вы познали Того, Кто от начала[a]. Я написал вам, юноши, потому что вы сильны, и слово Божье пребывает в вас[b], и вы победили лукавого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «Тот, Кто от начала», вероятнее всего, относится к предвечному Сыну, однако в самом стихе Он прямо не назван.
    reason: alternative_reading
  - marker: b
    text: 'Или: «остаётся в вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Я написал
  rationale: Греческий аорист обозначает совершённое действие; в русском эпистолярном контексте естественно звучит простое прошедшее время. Повтор сохранён как риторический приём.
- source_word: παιδία
  choice: дети
  rationale: Передаёт семейное обращение без добавления отсутствующих в тексте оттенков «дорогие» или «малые».
- source_word: ἐγνώκατε
  choice: вы познали
  rationale: Перфект указывает на состоявшееся познание с сохраняющимся результатом; «познали» естественно передаёт это в библейском контексте.
- source_word: τὸν πατέρα
  choice: Отца
  rationale: В контексте Иоанна это титульное обозначение Бога; прописная буква уместна в русском издании.
- source_word: πατέρες
  choice: отцы
  rationale: Сохраняет буквальное обращение и трёхчастную риторическую структуру, не сводя значение исключительно к возрасту.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: Того, Кто от начала
  rationale: Сохраняет неназванного личного референта и лаконичную временную формулу оригинала, не подставляя прямо «Христа» или «Сына».
- source_word: νεανίσκοι
  choice: юноши
  rationale: Естественный литературный эквивалент мужского множественного обращения, сохраняющий противопоставление «отцам».
- source_word: ἰσχυροί
  choice: сильны
  rationale: Прямой и естественный эквивалент в контексте духовной стойкости.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Привычная современная русская формулировка, оставляющая открытым, имеется ли в виду Божья весть вообще или возвещённое благовестие.
- source_word: μένει
  choice: пребывает
  rationale: Передаёт длительность и ключевую для Иоанна идею устойчивого пребывания; в современном библейском регистре слово понятно и достойно.
- source_word: νενικήκατε
  choice: вы победили
  rationale: Русское прошедшее совершенного вида выражает достигнутую победу; контекст и продолжение стиха показывают её сохраняющуюся значимость.
- source_word: τὸν πονηρόν
  choice: лукавого
  rationale: Артикль и форма мужского рода указывают на личного противника, а не на абстрактное зло; «лукавый» — ёмкое и узнаваемое библейское обозначение.
theological_decisions:
- issue: Кого обозначает выражение «Тот, Кто от начала»
  choice: 'Референт оставлен не названным: «Того, Кто от начала».'
  alternative: Прямо назвать Христа/Сына либо истолковать выражение как относящееся к Богу вообще.
  rationale: Иоаннова словесность позволяет предполагать предвечного Сына, однако сам стих не называет Его прямо. Перевод сохраняет эту недосказанность.
- issue: Род и характер трёх групп адресатов
  choice: παιδία передано как «дети», а πατέρες и νεανίσκοι — как «отцы» и «юноши».
  alternative: Нейтрализовать все обращения как обозначения ступеней духовной зрелости или возрастных групп всей общины.
  rationale: Так сохраняются смешанная родовая форма греческого текста и его трёхчастная риторическая структура без навязанного толкования.
- issue: Личный или абстрактный смысл τὸν πονηρόν
  choice: Передано личным обозначением «лукавого».
  alternative: «Зло».
  rationale: Артикль, мужской род и Иоаннов контекст поддерживают указание на личного духовного противника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм и троекратное «Я написал вам» сохранены. Архаизмы сведены к минимуму; «пребывает» и «лукавого» сохранены как понятные термины, точно передающие Иоаннову лексику.
