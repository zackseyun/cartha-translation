  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: ru
  text: Потому что всё, что в мире, — желание плоти[a], желание глаз и хвастовство жизненными благами[b] — не от Отца, но от мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вожделение плоти». Греческое слово может означать сильное желание, страстное влечение или похоть; здесь «желание» не ограничивает смысл только сексуальной сферой. «Плоть» в данном контексте может также обозначать падшую человеческую природу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «житейская надменность» или «гордость жизни». Речь может идти о хвастливой самоуверенности, связанной с положением, имуществом, средствами или образом жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание предшествующего призыва не любить мир; причинное значение передано прямо и естественно.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: всё, что в мире
  rationale: Субстантивированная конструкция среднего рода имеет собирательное значение; русский оборот сохраняет её всеохватность.
- source_word: κόσμῳ / κόσμου
  choice: мир / мира
  rationale: Сохраняется широкий термин κόσμος без поясняющего сужения до «мировой системы»; противопоставление Отцу раскрывает его смысл в контексте.
- source_word: ἐπιθυμία
  choice: желание
  rationale: Слово обозначает сильное желание, здесь отрицательно окрашенное; «желание» не сужает значение до сексуальной похоти.
- source_word: τῆς σαρκὸς
  choice: плоти
  rationale: Буквальный богословски насыщенный термин сохраняет неоднозначность между телесными влечениями и падшей человеческой направленностью.
- source_word: τῶν ὀφθαλμῶν
  choice: глаз
  rationale: Прямо передаёт греческий родительный падеж и множественное число, сохраняя параллелизм перечня.
- source_word: ἀλαζονεία τοῦ βίου
  choice: надменность житейская
  rationale: ἀλαζονεία выражает высокомерную самоуверенность и хвастливую претензию, а βίος может обозначать земную жизнь, образ и средства жизни; компактная формулировка сохраняет эту широту.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: не от Отца
  rationale: ἐκ указывает на источник или происхождение; эллиптическая русская конструкция ясна и сохраняет контраст.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: но от мира
  rationale: 'Сохраняется параллельное противопоставление двух источников: Отца и мира.'
theological_decisions:
- issue: Значение σάρξ в нравственно отрицательном перечне
  choice: плоть
  alternative: греховная природа
  rationale: «Плоть» ближе к исходному слову и не закрепляет одну антропологическую интерпретацию; возможный метафорический смысл отмечен в сноске.
- issue: Значение κόσμος
  choice: мир
  alternative: падший мировой порядок
  rationale: Перевод «мир» сохраняет многозначность и литературное противопоставление «Отцу», не встраивая толкование в основной текст.
- issue: Смысл ἀλαζονεία τοῦ βίου
  choice: надменность житейская
  alternative: гордость жизнью; хвастовство достатком
  rationale: Греческое выражение допускает связь со статусом, имуществом, средствами или образом жизни; выбранный вариант не сводит его только к обладанию вещами.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм греческого перечня сохранён; архаизирующая, но понятная формула «надменность житейская» выбрана для краткой передачи широкого смысла βίος.
