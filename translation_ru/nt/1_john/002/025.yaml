id: 1JN.2.25
reference: 1 John 2:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: ru
  text: 'И это — обещание, которое он сам[a] дал нам: вечная жизнь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «он сам» в греческом тексте имеет усилительное значение. В этом стихе прямо не уточняется, идёт ли речь об Отце или о Сыне.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία
  choice: обещание
  rationale: Прямой и естественный русский эквивалент, обозначающий данное обязательство или обещанный дар.
- source_word: αὐτός
  choice: он сам
  rationale: Сохраняет выраженное в греческом тексте усиление местоимения, не уточняя его референта.
- source_word: ἐπηγγείλατο
  choice: дал
  rationale: В сочетании «дал обещание» естественно передаёт значение «обещал» и позволяет избежать тяжеловесного русского повтора «обещание, которое обещал».
- source_word: ἡμῖν
  choice: нам
  rationale: Естественно передаёт дательный падеж адресата обещания.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: вечная жизнь
  rationale: Фраза стоит в приложении и раскрывает содержание обещания; это ясный и устойчивый русский эквивалент. Определённость греческой формы не требует отдельного выражения в русском языке.
- source_word: καὶ αὕτη ἐστίν
  choice: И это —
  rationale: Сохраняет указательное значение и связь с предыдущим контекстом; тире естественно вводит именную часть сказуемого.
theological_decisions:
- issue: К кому относится усиленное местоимение αὐτός
  choice: Сохранено «он сам» без уточнения личности.
  alternative: Отец; Сын.
  rationale: В самом стихе референт заново не назван, а контекст допускает разные толкования. Перевод не разрешает эту неоднозначность за греческий текст.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Строчная буква в местоимении не навязывает конфессиональную издательскую традицию; двоеточие сохраняет приложение, раскрывающее содержание обещания.
