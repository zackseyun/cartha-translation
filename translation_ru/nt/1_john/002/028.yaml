  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: ru
  text: И теперь, дети, оставайтесь в Нём, чтобы, если Он явится[a], мы имели уверенность и не отшатнулись от Него в стыде[b] при Его пришествии[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если Он будет явлен». Греческий глагол стоит в страдательном залоге («будет явлен», «станет явным»); в основном тексте выбран более естественный русский вариант «явится».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не постыдились перед Ним». Эти слова можно понимать как стыд в Его присутствии, не подчёркивая отстранения от Него.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «в Его присутствии». В данном контексте «пришествие» передаёт эсхатологический смысл греческого слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: дети
  rationale: Ласковое обращение с уменьшительным оттенком. В современном русском «дети» естественно передаёт семейное, пастырское обращение; добавление «мои» было бы смысловой экспликацией, которой нет в греческом тексте.
- source_word: μένετε
  choice: оставайтесь
  rationale: Сохраняет длительный характер призыва и ключевую для Иоанна идею пребывания, оставаясь понятным современному читателю. «Пребывайте» точнее поддерживает традиционную терминологию, но звучит более книжно и архаично.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняет характерную для Иоанна пространственно-реляционную метафору без поясняющего добавления «в единении с Ним».
- source_word: φανερωθῇ
  choice: Он явится
  rationale: Естественно передаёт эсхатологическое явление Христа. Греческая пассивная форма и условный оттенок конструкции отмечены в сноске, поскольку буквальное «будет явлен» в основном тексте тяжеловесно.
- source_word: σχῶμεν παρρησίαν
  choice: мы имели уверенность
  rationale: Передаёт открытую, свободную уверенность перед Богом в эсхатологической обстановке. «Дерзновение» традиционно, но для многих современных читателей менее прозрачно и может ошибочно восприниматься как дерзость.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: не отшатнулись от Него в стыде
  rationale: Передаёт и чувство стыда, и направительное значение ἀπό — удаление от Него. Формулировка не превращает предупреждение в утверждение об окончательном осуждении.
- source_word: παρουσίᾳ
  choice: пришествии
  rationale: В данном эсхатологическом контексте это общепонятное обозначение будущего прихода Христа; более буквальное значение «присутствие» сохранено в сноске.
theological_decisions:
- issue: К кому относятся местоимения и о каком явлении идёт речь
  choice: Местоимения поняты как относящиеся к Сыну, Иисусу Христу, а явление и пришествие — как будущие эсхатологические события.
  alternative: Не уточнять, относится ли местоимение к Сыну или в более общем смысле к Богу.
  rationale: Ближайший контекст говорит о пребывании в Сыне и затем о Его явлении. Перевод не добавляет имени, но сохраняет естественную контекстуальную связь.
- issue: Смысл выражения стыда при пришествии
  choice: Возможная реакция изображена как отшатывание от Него в стыде, без утверждения о судебном осуждении.
  alternative: «Не постыдились перед Ним» или «не были посрамлены Им».
  rationale: Сочетание αἰσχυνθῶμεν с ἀπ’ αὐτοῦ допускает образ удаления в стыде. Вариант с прямым причинением стыда Христом грамматически возможен как толкование, но переопределяет роль предлога и потому не выбран.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Оставайтесь» предпочтено более архаичному «пребывайте», тогда как «пришествие» сохранено как ясный и укоренившийся эсхатологический термин. Прописные буквы в местоимениях использованы в соответствии с распространённой русской библейской практикой и для ясности референта.
