- from: Они вышли от нас, но не были из наших; ведь если бы они были из наших, то остались бы с нами. Но они вышли, чтобы стало явным, что не все они из наших.[a]
  to: Они вышли от нас, но не были из нас; ведь если бы они были из нас, то остались бы с нами. Но это произошло, чтобы стало ясно, что не все они из нас.
  rationale: Убрана сноска, поскольку она приписывает греческой конструкции значение, которого она здесь не имеет. Восстановлена более точная связь последнего целевого предложения с фактом ухода, а повтор ἐξ ἡμῶν передан единообразно как «из нас», без богословской конкретизации.
