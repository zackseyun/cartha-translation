review_pass:
  verdict: revise
  source_fidelity: 'Первая часть передана в целом точно, включая противопоставление ухода «от нас» и принадлежности «из нас», а также нереальное условие. Однако повтор «они вышли» в последнем предложении излишне эксплицирует подразумеваемое действие и делает русскую связь менее точной: ἀλλ’ ἵνα вводит цель/результат самого произошедшего ухода. Сноска ошибочно объявляет финальную конструкцию двусмысленной в смысле «ни один»: в данном контексте οὐκ ... πάντες означает «не все», а не «все не / ни один не».'
  naturalness: «Из наших» возможно, но «из нас» точнее воспроизводит повторяющийся общинно-реляционный оборот и естественно звучит в сдержанном литературном контексте. «Но это произошло, чтобы стало ясно» связнее и естественнее, чем повторное «Но они вышли».
  terminology: Не следует заменять общинное «из нас» формулами об истинной вере, спасении или формальном членстве. Выражение «из нас» сохраняет исходную реляционную и богословски неуточнённую формулировку.
  issues:
  - severity: medium
    issue: Сноска предлагает «что все они не из наших», то есть «ни один из них не из наших», как равноправное значение.
    rationale: Отрицание при πάντες здесь означает «не все»; контекст определяет, что речь идёт об ушедших, но не превращает саму конструкцию в утверждение «ни один». Такая сноска создаёт несуществующую текстовую неоднозначность.
  - severity: low
    issue: В последнем предложении повторено «они вышли».
    rationale: Греческое ἀλλ’ ἵνα не повторяет глагол, а связывает цель/следствие с предшествующим событием. Русское «Но это произошло» передаёт эту связь без ненужного повторения.
  revised_text: Они вышли от нас, но не были из нас; ведь если бы они были из нас, то остались бы с нами. Но это произошло, чтобы стало ясно, что не все они из нас.
