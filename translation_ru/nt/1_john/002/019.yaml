source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: ru
  text: Они вышли от нас, но не были из нас; ведь если бы они были из нас, то остались бы с нами. Но это произошло, чтобы стало ясно, что не все они из нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: от нас / из наших
  rationale: При описании ухода естественно «от нас»; в высказываниях о принадлежности — «из наших». Такое варьирование передаёт два связанных контекстуальных оттенка повторяющегося греческого оборота, не уточняя богословски, что именно составляет подлинную принадлежность.
- source_word: ἐξῆλθαν
  choice: вышли
  rationale: Сохраняет простой и конкретный образ ухода, не добавляя в сам глагол толкования вроде «отступили».
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: остались бы с нами
  rationale: Передаёт нереальное условное следствие и характерное для Иоанна значение μένω — оставаться, пребывать; здесь «остались бы» звучит естественно по-русски.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: Но они вышли, чтобы стало явным
  rationale: Повторение «они вышли» восполняет подразумеваемое действие после ἀλλά и создаёт полноценную русскую фразу. «Стало явным» естественно передаёт пассивное φανερωθῶσιν, не определяя сверх текста, кем или каким образом это было открыто.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: что не все они из наших
  rationale: Сохраняет порядок смысловых компонентов и неоднозначную область действия отрицания. Возможное понимание, согласно которому речь идёт обо всех ушедших без исключения, отмечено в сноске.
theological_decisions:
- issue: Следует ли истолковать выражение «из наших» через позднейшие категории видимого членства, истинной веры или спасения
  choice: Сохранить общинно-реляционное выражение «из наших»
  alternative: «они никогда не были истинно верующими» или «в действительности не принадлежали к Церкви»
  rationale: Греческий текст противопоставляет уход и принадлежность, но не формулирует это различие в категориях позднейшей систематической теологии. Буквенно-естественный оборот сохраняет богословское напряжение.
- issue: Область действия отрицания в οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: 'В основном тексте: «не все они из наших»'
  alternative: «все они не из наших», то есть «ни один из них не из наших»
  rationale: Греческая конструкция допускает формальное прочтение «не все», тогда как ближайший контекст может поддерживать распределительное понимание отрицания применительно ко всем ушедшим. Альтернатива вынесена в сноску, чтобы не устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Повтор «из наших» намеренно сохраняет связность греческого текста, а «остались бы» передаёт условность без архаизации.
