id: 1JN.2.21
reference: 1 John 2:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: ru
  text: Я написал вам не потому, что вы не знаете истины, а потому, что вы знаете её, и потому, что никакая ложь не исходит от истины.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: Я написал
  rationale: Греческий аорист передан естественным русским прошедшим временем. В контексте послания это может относиться как к написанному здесь, так и к письму, которое адресаты читают; русский вид не требует искусственного уточнения.
- source_word: οἴδατε
  choice: вы знаете
  rationale: Прямо передаёт значение глагола; резкое противопоставление «не знаете… а… знаете» сохраняет смысловое ударение без дополнительных слов.
- source_word: τὴν ἀλήθειαν / τῆς ἀληθείας
  choice: истины / от истины
  rationale: Определённость и богословская ёмкость выражения сохраняются русским словом «истина»; контекст не позволяет безосновательно сужать его до «истинной вести» или «Евангелия».
- source_word: πᾶν ψεῦδος
  choice: никакая ложь
  rationale: Сочетание πᾶν с отрицанием естественно передаётся универсальным отрицанием «никакая ложь», а не буквальным и двусмысленным «всякая ложь не».
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: не исходит от истины
  rationale: Предлог ἐκ обозначает источник или происхождение. «Не исходит от» ясно и естественно выражает эту связь, не превращая её в более широкое утверждение.
theological_decisions:
- issue: Смысл выражения «истина» в контексте Иоанна
  choice: Сохранено общее выражение «истина» без поясняющей подстановки.
  alternative: «истинная весть» или «евангельская истина»
  rationale: У слова есть богословская глубина, однако сам стих не ограничивает его одним более узким определением.
- issue: Отношение лжи к истине
  choice: «никакая ложь не исходит от истины» — утверждение об источнике или происхождении.
  alternative: «никакая ложь не принадлежит истине»
  rationale: ἐκ прежде всего указывает на источник; перевод сохраняет противопоставление истины и лжи, не усиливая его до отсутствующего в тексте онтологического тезиса.
translation_notes:
  register: Современный литературный русский язык; синтаксис близок к греческому, но звучит естественно. Повтор «потому, что» сохранён ради логической структуры и риторического акцента оригинала.
