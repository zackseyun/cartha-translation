id: 1JN.2.7
reference: 1 John 2:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: ru
  text: Возлюбленные, я пишу вам не новую заповедь, а старую, которая была у вас от начала. Старая заповедь — это весть[a], которую вы услышали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово»: «Старая заповедь — это слово, которое вы услышали».'
    reason: Лексическая альтернатива для λόγος; «слово» буквальнее, тогда как «весть» яснее передаёт здесь содержание услышанного возвещения.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Возлюбленные
  rationale: Форма обращения передаёт тёплый пастырский тон и сохраняет лексическую связь с языком любви, характерным для послания.
- source_word: ἐντολήν
  choice: заповедь
  rationale: «Заповедь» естественно передаёт богословски значимое употребление ἐντολή у Иоанна и сохраняет связь с библейской традицией.
- source_word: καινήν
  choice: новую
  rationale: Прямо сохраняет противопоставление καινήν и παλαιάν.
- source_word: γράφω
  choice: я пишу
  rationale: Русское настоящее время естественно передаёт совершающееся действие письма.
- source_word: παλαιάν / παλαιά
  choice: старую / старая
  rationale: Сохраняет повтор одного и того же слова и прямое противопоставление «новой»; контекст показывает, что речь идёт о давно известной, а не об утратившей силу заповеди.
- source_word: εἴχετε
  choice: была у вас
  rationale: Естественная русская передача продолжительного обладания в прошлом без тяжеловесного буквального «которую вы имели».
- source_word: ἀπ’ ἀρχῆς
  choice: от начала
  rationale: Сохраняет характерную для Иоанна формулировку и не уточняет, какое именно начало имеется в виду.
- source_word: λόγος
  choice: весть
  rationale: В данном контексте обозначает услышанное содержание возвещения; «весть» ясно выражает этот смысл, а более буквальное «слово» приведено в примечании.
- source_word: ἠκούσατε
  choice: вы услышали
  rationale: Совершенный вид естественно передаёт аорист и указывает на состоявшееся принятие возвещения.
theological_decisions:
- issue: Значение выражения «от начала»
  choice: 'Оставлено без уточнения: «от начала».'
  alternative: «с начала вашей христианской жизни» или «с начала возвещения Благой вести»
  rationale: Ближайший контекст допускает связь с первоначальным наставлением читателей, но сам текст не определяет это начало точнее.
- issue: Отождествление старой заповеди с услышанной вестью
  choice: Связь передана прямо, без поясняющего расширения.
  alternative: Добавить пояснение о содержании заповеди из соседних стихов.
  rationale: Греческий текст непосредственно отождествляет старую заповедь с услышанным λόγος; перевод не должен заранее раскрывать или гармонизировать это отождествление.
translation_notes:
  register: Современный литературный русский язык с тёплым, достойным пастырским обращением. Синтаксис сделан естественным для русского, при этом сохранены повтор «старая заповедь», неоднозначность выражения «от начала» и лаконичное отождествление заповеди с услышанной вестью.
