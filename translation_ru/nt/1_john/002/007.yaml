  verdict: approve
  source_fidelity: 'Текст точно передаёт греческую структуру и ключевые противопоставления: «не новую заповедь, а старую», а также прямое отождествление старой заповеди с услышанным λόγος. «Которая была у вас от начала» корректно отражает εἴχετε ἀπ’ ἀρχῆς, не сужая значение «от начала». Финальное «которую вы услышали» соответствует аористу ἠκούσατε; в исходном тексте повтор «от начала» в этой заключительной части отсутствует, и перевод его не добавляет.'
  naturalness: Русский текст звучит естественно и достойно в современном литературном, пастырском регистре. «Возлюбленные» уместно как тёплое церковно-литературное обращение. Повтор «старая заповедь» сохранён намеренно и не воспринимается как неуклюжий.
  terminology: «Заповедь» удачно передаёт ἐντολή и сохраняет библейско-иоанновский терминологический вес. «Весть» является допустимой современной передачей λόγος в значении услышанного содержания возвещения; примечание корректно даёт более буквальное «слово» без навязывания толкования.
