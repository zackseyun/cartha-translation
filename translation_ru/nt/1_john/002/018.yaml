  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: ru
  text: Дети, настал последний час. И, как вы слышали, что антихрист[a] грядёт, так и теперь появились многие антихристы[b]. Из этого мы узнаём, что настал последний час.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое существительное стоит без артикля. Оно может относиться к известной ожидаемой фигуре, однако русский язык не выражает такую определённость артиклем.
    reason: alternative_reading
  - marker: b
    text: 'Или: «возникли» или «пришли». Греческая форма подчёркивает, что многие антихристы появились и теперь присутствуют.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Дети
  rationale: Пастырское семейное обращение во множественном числе. «Дети» звучит естественно и сохраняет теплоту обращения, не усиливая уменьшительный оттенок.
- source_word: ἐσχάτη ὥρα
  choice: сейчас последний час
  rationale: Сохраняет эсхатологический образ «последнего часа», не сводя его ни к буквальным шестидесяти минутам, ни к определённой богословской схеме. «Сейчас» естественно передаёт именную конструкцию настоящего времени.
- source_word: καθὼς ἠκούσατε
  choice: как вы слышали
  rationale: Передаёт отсылку к ранее полученному наставлению без ненужного уточнения времени или источника.
- source_word: ἀντίχριστος
  choice: антихрист
  rationale: Сохраняет традиционный термин и грамматическое единственное число. Строчная буква не навязывает понимание слова исключительно как имени собственного; возможная определённость отмечена в сноске.
- source_word: ἔρχεται
  choice: приходит
  rationale: Настоящее время сохраняет оттенок ожидаемого прихода и не превращает высказывание в однозначно будущее.
- source_word: καὶ νῦν
  choice: так уже теперь
  rationale: Передаёт усиленное сопоставление ожидаемого прихода с уже наличной действительностью множества антихристов.
- source_word: ἀντίχριστοι πολλοὶ
  choice: много антихристов
  rationale: Прямо сохраняет множественное число и лексическую связь с предшествующим единственным числом.
- source_word: γεγόνασιν
  choice: появилось
  rationale: 'Передаёт возникновение этих лиц и результативный оттенок греческого перфекта: они появились и теперь присутствуют.'
- source_word: ὅθεν γινώσκομεν
  choice: По этому мы узнаём
  rationale: Сохраняет вывод из только что названного признака. «Узнаём» передаёт распознавание последнего часа по наблюдаемому явлению.
theological_decisions:
- issue: Значение выражения «последний час»
  choice: Сохранён временно-эсхатологический образ без поясняющего истолкования в основном тексте.
  alternative: Передать как «последнее время», «заключительный период» или как строго ближайший хронологический момент.
  rationale: Греческий текст говорит именно о «последнем часе», но контекст не требует понимать это как буквальные шестьдесят минут. Перевод сохраняет образ и его богословское напряжение.
- issue: Соотношение единственного «антихрист» и множественного «антихристы»
  choice: Сохранено противопоставление ожидаемого антихриста и уже появившихся многих антихристов.
  alternative: Истолковать единственное число только как общее понятие либо однозначно оформить его как имя конкретной личности.
  rationale: Текст намеренно сопоставляет ранее услышанное ожидание в единственном числе с нынешней множественностью; перевод не должен заранее согласовывать их в рамках отдельной эсхатологической системы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет повтор «последний час» и контраст единственного и множественного числа. Термин «антихрист» оставлен традиционным, но без конфессионально обусловленного уточнения.
