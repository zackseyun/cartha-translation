  text: Я написал вам это о тех, кто вводит вас в заблуждение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто обманывает вас»; возможно также: «кто пытается ввести вас в заблуждение». Греческое причастие описывает тех, чья деятельность направлена на то, чтобы ввести вас в заблуждение, не уточняя, достигла ли она цели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: Это
  rationale: Форма среднего рода множественного числа указывает на сказанное выше; в современном русском собирательное «это» звучит естественнее буквального «эти вещи».
- source_word: ἔγραψα ὑμῖν
  choice: я написал вам
  rationale: Аорист обозначает совершённое действие письма, а дательный ὑμῖν — его адресатов. Русское совершенное прошедшее передаёт это прямо и естественно.
- source_word: περὶ
  choice: о
  rationale: Предлог вводит тему написанного; краткое русское «о» точно и стилистически естественно.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: о тех, кто вводит вас в заблуждение
  rationale: Субстантивированное причастие настоящего времени характеризует людей по их продолжающейся деятельности. Оборот «вводит в заблуждение» передаёт значение πλανάω, не утверждая однозначно, что обман уже достиг цели.
theological_decisions:
- issue: Означает ли πλανώντων успешный обман или деятельность, направленную на введение читателей в заблуждение
  choice: кто вводит вас в заблуждение
  alternative: кто пытается ввести вас в заблуждение
  rationale: В греческом тексте нет отдельного глагола со значением «пытаться». Прямая форма сохраняет силу причастия настоящего времени, а примечание отмечает, что результат действия не обязательно подразумевается.
translation_notes:
  register: Современный литературный русский язык; ясный, сдержанный и достойный стиль. Порядок слов сохраняет связь «Это» с предшествующим отрывком, не прибегая к неестественному буквальному выражению «эти вещи».
