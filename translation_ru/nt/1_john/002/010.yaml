  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: ru
  text: Кто любит своего брата, тот пребывает в свете, и в нём нет причины для падения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и для него нет того, обо что он мог бы споткнуться». Греческое выражение может указывать либо на то, чего нет в нём самом, либо на то, что не становится препятствием для него.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Кто любит
  rationale: Субстантивированное причастие настоящего времени выражает общее и продолжающееся действие; конструкция «кто любит» естественна в современном русском языке.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата
  rationale: Сохраняет грамматически мужской род и единственное число оригинала. В контексте речь может идти о члене общины, однако расширительное толкование не вносится в основной текст.
- source_word: ἐν τῷ φωτὶ
  choice: в свете
  rationale: Сохраняет важный для Иоанна образ света и естественно звучит по-русски.
- source_word: μένει
  choice: пребывает
  rationale: Передаёт длительный характер μένω и его устойчивое богословское значение у Иоанна; слово литературное и понятное, без излишней архаичности.
- source_word: σκάνδαλον
  choice: причины для падения
  rationale: Передаёт метафору препятствия, ведущего к спотыканию или падению, в понятной современной форме, не сводя её к буквальному предмету.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Наиболее прямо воспроизводит предложную конструкцию и относит местоимение к любящему человеку, не уточняя сверх текста, касается ли падение его самого или других.
- source_word: οὐκ ἔστιν
  choice: нет
  rationale: Естественная русская экзистенциальная конструкция, точно передающая отрицание наличия.
theological_decisions:
- issue: Смысл заключительной фразы καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: В любящем братa нет причины для падения.
  alternative: Для него нет того, обо что он мог бы споткнуться.
  rationale: Оборот ἐν αὐτῷ допускает понимание как «в нём», так и в смысле того, что не встречается на его пути. Основной текст сохраняет внутренний нравственный оттенок, не уточняя, кто именно мог бы пасть; альтернативный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Формула «пребывает в свете» сохраняет иоанновскую образность, а заключительная фраза передана понятно, при этом синтаксическая и богословская неоднозначность оригинала вынесена в сноску.
