  source_fidelity: 'Текст верно передаёт все основные элементы греческого оригинала: обобщённое лицо ὁ ἀγαπῶν, «своего брата», пребывание «в свете» и отрицательное утверждение о σκάνδαλον «в нём». Смысловая неоднозначность ἐν αὐτῷ не снята догматически и надлежащим образом отражена в сноске.'
