  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: ru
  text: 'И по этому мы узнаём, что познали Его[a]: если соблюдаем Его заповеди.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма может подразумевать: «пришли к познанию Его и теперь знаем Его».'
    reason: Передача результативного значения греческого перфекта ἐγνώκαμεν, для которого в русском языке нет прямого грамматического соответствия.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: вот как
  rationale: Естественно передаёт характерный для Иоанна оборот, указывающий на основание или признак, по которому нечто узнаётся.
- source_word: γινώσκομεν
  choice: мы узнаём
  rationale: Настоящее время обозначает нынешнее распознавание или уверенность; «узнаём» хорошо сочетается с последующим указанием на признак.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: что познали Его
  rationale: Совершенный вид глагола «познали» передаёт совершившееся обретение знания, сохраняющее силу в настоящем, не перегружая русский текст описательной конструкцией.
- source_word: αὐτόν
  choice: Его
  rationale: Сохранено местоимение исходного текста без уточнения, идёт ли речь непосредственно о Боге или о Христе.
- source_word: ἐὰν
  choice: если
  rationale: Прямо и естественно вводит условие, служащее проверочным признаком сказанного.
- source_word: ἐντολάς
  choice: заповеди
  rationale: Сохраняет нравственный и библейский вес слова ἐντολή и остаётся понятным в современном русском языке.
- source_word: τηρῶμεν
  choice: соблюдаем
  rationale: Передаёт смысл верного исполнения и хранения заповедей; в русском языке это наиболее естественное сочетание со словом «заповеди».
theological_decisions:
- issue: К кому относится αὐτόν («Его»)
  choice: Сохранить местоимение «Его» без уточнения референта.
  alternative: Указать в тексте «Бога» или «Иисуса Христа».
  rationale: Греческий текст использует местоимение, а контекст Первого послания Иоанна тесно связывает познание Бога и отношение к Сыну. Уточнение искусственно сняло бы сохраняемую текстом неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским регистром. Формулировка краткая, ясная и сохраняет логическую связь между знанием и его проверочным признаком.
