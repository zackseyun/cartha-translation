  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: ru
  text: Кто лжец, если не тот, кто отрицает, что Иисус — Мессия?[a] Он и есть антихрист[b] — тот, кто отрицает Отца и Сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое ὁ χριστός здесь употреблено как титул и означает «Мессия», то есть Помазанник.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «тот самый антихрист». В греческом стоит определённый артикль. В посланиях Иоанна это слово может обозначать противника такого рода — того, кто отрицает Отца и Сына, — а не обязательно только одну будущую личность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: лжец
  rationale: С артиклем существительное обозначает определённый, характерный образ лжеца; русская конструкция «Кто лжец, если не…» сохраняет полемическую заострённость оригинала.
- source_word: ἀρνούμενος
  choice: тот, кто отрицает
  rationale: Субстантивированное причастие настоящего времени описывает человека по характерному для него отрицанию; эта передача естественна по-русски и сохраняет характеризующую силу формы.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: что Иисус — Мессия
  rationale: 'Отрицание выражено управляющим глаголом «отрицает»: по-русски естественно сказать «отрицает, что Иисус — Мессия», не повторяя отрицание внутри придаточного и не создавая двусмысленности.'
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь слово употреблено как титул и обозначает Помазанника; «Мессия» передаёт содержание титула и его иудейский контекст.
- source_word: οὗτός ἐστιν ὁ ἀντίχριστος
  choice: Он и есть антихрист
  rationale: Указательное местоимение отсылает к только что описанному человеку, а усилительная конструкция «и есть» ясно передаёт отождествление; «антихрист» сохраняет традиционный и понятный термин.
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: Отца и Сына
  rationale: В контексте Иоанновых посланий это личностные обозначения Бога Отца и Сына, поэтому использованы прописные буквы.
theological_decisions:
- issue: Передача титула Χριστός в формуле исповедания или отрицания
  choice: Мессия
  alternative: Христос
  rationale: В данном предложении речь идёт именно о титуле Иисуса. «Мессия» делает смысл утверждения явным, не превращая титул в часть имени.
- issue: Референция ἀντίχριστος
  choice: антихрист
  alternative: Антихрист / тот самый антихрист
  rationale: Строчная буква и примечание сохраняют возможность понимать слово как обозначение типа противника, не исключая определённости греческого выражения и не сводя его обязательно к единственной эсхатологической фигуре.
- issue: Отношение отрицания Сына к отрицанию Отца
  choice: сохранена координация «Отца и Сына»
  alternative: пояснительная передача, связывающая оба отрицания причинно
  rationale: Текст прямо называет отрицание обоих, но не объясняет здесь логическую или причинную связь; перевод не добавляет такого объяснения.
translation_notes:
  register: Современный литературный русский язык с краткой, полемически выразительной структурой. Тире оформляет именную часть сказуемого; повтор «тот, кто отрицает» намеренно сохраняет риторическую структуру греческого текста. Все маркеры примечаний помещены непосредственно в основной текст.
