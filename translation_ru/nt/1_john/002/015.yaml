id: 1JN.2.15
reference: 1 John 2:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: ru
  text: Не любите ни мира, ни того, что в мире. Если кто любит мир, в нём нет любви Отца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «любовь Отца», вероятнее всего, означает «любовь к Отцу»; возможно также значение «любовь, исходящая от Отца».
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: Не любите
  rationale: Настоящее повелительное наклонение с μή допускает как общий запрет, так и прекращение продолжающегося действия. Простая форма «не любите» сохраняет эту широту, не уточняя аспект сверх текста.
- source_word: τὸν κόσμον
  choice: мир
  rationale: В данном контексте κόσμος обозначает мир как порядок желаний и привязанностей, противостоящий Богу, но перевод «мир» сохраняет образ и не вводит толкование непосредственно в текст.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: ни того, что в мире
  rationale: Фраза распространяет запрет на всё принадлежащее миру; эта формулировка близка греческому тексту и естественна в современном русском языке.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Если кто любит
  rationale: «Если кто» естественно передаёт неопределённое τις и сохраняет обобщающий характер условия.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: любви Отца
  rationale: 'Родительная конструкция сохраняет неоднозначность греческого генитива: речь может идти о любви к Отцу или о любви, исходящей от Отца. Сноска сообщает наиболее вероятное контекстуальное понимание.'
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Сохранены мужской род и единственное число греческого αὐτῷ, употреблённого обобщённо по отношению к τις.
theological_decisions:
- issue: Значение слова «мир» в этическом контексте послания
  choice: Сохранено простое обозначение «мир» без поясняющего расширения.
  alternative: «мирской порядок» или «система этого мира»
  rationale: Предостережение относится не к Божьему творению или людям как таковым, а к порядку желаний и верности, противостоящему Богу. Однако более развёрнутый перевод преждевременно сузил бы многозначный образ.
- issue: Значение родительного падежа в ἡ ἀγάπη τοῦ πατρὸς
  choice: В основном тексте сохранено неоднозначное «любовь Отца».
  alternative: «любовь к Отцу»; менее вероятно — «любовь Отца» в смысле любви, исходящей от Него
  rationale: Противопоставление любви к миру, вероятнее всего, указывает на любовь человека к Отцу, однако греческая конструкция формально допускает и субъективное значение. Сноска сохраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Конструкция «Если кто» и обобщённое «в нём» сохраняют библейскую сжатость, оставаясь понятными современному читателю.
