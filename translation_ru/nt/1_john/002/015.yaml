  source_fidelity: Текст точно передаёт оба запрета Μὴ ἀγαπᾶτε … μηδὲ, условное ἐάν τις ἀγαπᾷ и итоговое οὐκ ἔστιν … ἐν αὐτῷ. «Ни мира, ни того, что в мире» адекватно воспроизводит охват запрета, не превращая κόσμος в истолковательный «мирской порядок».
