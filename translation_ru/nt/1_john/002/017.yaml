id: 1JN.2.17
reference: 1 John 2:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: ru
  text: И мир проходит вместе со своим желанием[a], а тот, кто исполняет волю Бога, остаётся навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со своей похотью» или «со своим страстным желанием». Греческое слово ἐπιθυμία обозначает сильное желание и в данном контексте имеет отрицательный нравственный смысл, но не обязательно относится только к половой страсти.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пребывает вечно». Глагол μένω («оставаться», «пребывать») — характерное слово в произведениях Иоанна; здесь оно противопоставляет непреходящее пребывание человека преходящему миру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: мир
  rationale: Стандартное и достаточно широкое соответствие; в контексте 1 Ин. 2:15–16 речь идёт не просто о творении, а о человеческом мире с его ценностями и стремлениями, противостоящими Богу.
- source_word: παράγεται
  choice: проходит
  rationale: 'Настоящее время передаёт происходящий процесс: мир преходящ и уже проходит. Русское «проходит» естественно выражает эту мысль без добавления отсутствующего в греческом уточнения.'
- source_word: ἐπιθυμία αὐτοῦ
  choice: своим желанием
  rationale: Единственное число оригинала сохранено. «Желание» шире, чем «похоть», и не сужает смысл до половой страсти; возвратное «своим» ясно соотносит желание с миром.
- source_word: ὁ δὲ ποιῶν
  choice: а тот, кто исполняет
  rationale: Субстантивированное причастие обозначает человека, для которого характерно исполнение Божьей воли. Конструкция современна и сохраняет обобщающее значение единственного числа.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: волю Бога
  rationale: «Воля» точно и естественно передаёт θέλημα, сохраняя смысл послушания Божьему намерению, а не просто Его предпочтению.
- source_word: μένει
  choice: остаётся
  rationale: Глагол μένω важен для языка Иоанна и может означать «пребывать»; здесь «остаётся» яснее для современного читателя и хорошо подчёркивает контраст с проходящим миром.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Устойчивое выражение означает непрекращающееся пребывание. «Навеки» естественно передаёт его силу в данном противопоставлении.
theological_decisions:
- issue: Смысл κόσμος в контексте Иоанна
  choice: Сохранено широкое слово «мир», контекстуально обозначающее преходящий человеческий порядок с его противными Богу стремлениями.
  alternative: Уточнить в тексте как «мирской порядок» или понять как физическую вселенную.
  rationale: Предыдущие стихи определяют мир через желание плоти, желание глаз и житейскую гордость. Однако сам стих сохраняет ёмкое слово κόσμος, поэтому перевод не сужает его поясняющей вставкой.
- issue: Сила μένει εἰς τὸν αἰῶνα
  choice: «остаётся навеки» — утверждение о непреходящем пребывании исполняющего Божью волю.
  alternative: Развернуть выражение как прямое техническое утверждение о вечной жизни.
  rationale: Греческий текст говорит о вечном пребывании, но не объясняет здесь его богословский механизм; перевод сохраняет вес утверждения, не добавляя отсутствующих категорий.
- issue: Связь исполнения Божьей воли и вечного пребывания
  choice: Сохранено прямое противопоставление текста без пояснения причинно-следственного механизма.
  alternative: Истолковать исполнение воли как основание спасения либо только как доказательство уже полученного спасения.
  rationale: Стих сам не уточняет эту догматическую взаимосвязь, поэтому перевод не разрешает заложенное в формулировке богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. «Остаётся навеки» выбрано вместо более церковного «пребывает вовек», а «исполняет волю Бога» сохраняет достоинство и богословскую точность без архаизации.
