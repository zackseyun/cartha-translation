  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: ru
  text: Что же до вас, пусть в вас пребывает то, что вы слышали с самого начала. Если в вас будет пребывать то, что вы слышали с самого начала, то и вы будете пребывать в Сыне и в Отце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: Что же до вас
  rationale: Вынесенное вперёд местоимение имеет контрастное, тематическое ударение. Оборот «Что же до вас» естественно передаёт его в русском контексте противопоставления лжеучителям.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: то, что вы слышали с самого начала
  rationale: Нейтральное относительное местоимение ὃ передано без уточняющих слов «весть», «Евангелие» или «учение», чтобы не сужать смысл исходного текста.
- source_word: ἀπ’ ἀρχῆς
  choice: с самого начала
  rationale: Современный и понятный русский эквивалент, сохраняющий мысль об изначально услышанном возвещении; «самого» естественно подчёркивает исходную точку.
- source_word: ἐν ὑμῖν μενέτω
  choice: пусть в вас пребывает
  rationale: Настоящее повелительное наклонение выражает продолжающееся пребывание. «Пребывать» уместно в литературном русском и позволяет сохранить сквозной повтор глагола μένω.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Если в вас будет пребывать
  rationale: Условная конструкция передана естественным русским будущим временем; продолженное «будет пребывать» не превращает условие в однократное действие и сохраняет связь с другими формами μένω.
- source_word: καὶ ὑμεῖς
  choice: то и вы
  rationale: Частица «и» передаёт καί в значении «также», а явное местоимение сохраняет авторское ударение.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: в Сыне и в Отце
  rationale: Сохранены порядок «Сын — Отец» и повтор отношения, выраженного предлогом ἐν, без добавления богословских пояснений.
- source_word: μενεῖτε
  choice: будете пребывать
  rationale: Будущее изъявительное передано прямо; тот же русский глагол сохраняет важный для стиха тройной повтор μένω.
theological_decisions:
- issue: Характер условного утверждения в заключительной части
  choice: «то и вы будете пребывать в Сыне и в Отце»
  alternative: Передать заключение как призыв либо истолковать его через позднейшую систему учения о стойкости верующих
  rationale: Греческий текст содержит условие и будущее изъявительное. Перевод сохраняет форму обещания и обусловленность продолжением в изначально услышанном, не разрешая возникающее богословское напряжение в пользу отдельной традиции.
- issue: Что именно обозначает «то, что вы слышали с самого начала»
  choice: Оставить обозначение обобщённым
  alternative: 'Уточнить в основном тексте: «Евангелие», «апостольская весть» или «учение о Сыне»'
  rationale: Контекст указывает на изначальное апостольское возвещение о Сыне, однако греческое ὃ само по себе не называет его. Перевод не должен быть уже исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным глаголом «пребывать». Синтаксический параллелизм и тройной повтор μένω сохранены; порядок «в Сыне и в Отце» следует греческому тексту.
