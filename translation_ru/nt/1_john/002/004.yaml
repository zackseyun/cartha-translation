id: 1JN.2.4
reference: 1 John 2:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: ru
  text: 'Кто говорит: «Я познал Его»[a], но не соблюдает Его заповедей, тот лжец, и истины в нём нет.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я знаю Его». Греческий перфект указывает на нынешнее состояние, возникшее в результате познания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и в таком истины нет»; то есть в таком человеке.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Кто говорит
  rationale: Субстантивированное причастие настоящего времени имеет обобщающее значение; эта формулировка естественна для современного русского языка.
- source_word: ὅτι
  choice: двоеточие и кавычки
  rationale: ὅτι вводит прямую речь; по-русски это естественно передаётся пунктуацией.
- source_word: Ἔγνωκα
  choice: Я познал
  rationale: Перфект γινώσκω обозначает достигнутое познание с сохраняющимся результатом. «Познал» лучше, чем простое «знаю», сохраняет оттенок состоявшегося познания и его личностный характер.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение оставляет референт неуточнённым, как и греческий текст; прописная буква соответствует русской библейской издательской традиции при указании на Бога.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: Его заповедей
  rationale: «Заповеди» сохраняет устойчивое библейское значение ἐντολαί и межтекстовые связи; родительный падеж обусловлен отрицанием.
- source_word: μὴ τηρῶν
  choice: не соблюдает
  rationale: Настоящее причастие указывает на продолжающуюся практику, а τηρέω здесь означает соблюдать, исполнять; «соблюдает» естественнее русского буквального «хранит».
- source_word: ψεύστης
  choice: лжец
  rationale: Предикативное существительное прямо характеризует человека; «лжец» точно передаёт его нравственную силу.
- source_word: ἐν τούτῳ
  choice: в нём
  rationale: Указательное местоимение относится к описанному человеку; «в нём» естественно передаёт анафорическую связь, не исключая буквального варианта «в таком человеке».
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: истины ... нет
  rationale: Русская безличная конструкция естественно передаёт отрицательное οὐκ ἔστιν и сохраняет широкое богословское значение «истины».
theological_decisions:
- issue: Референт αὐτόν / αὐτοῦ
  choice: Сохранить местоимение «Его», не называя референта прямо
  alternative: 'Уточнить: «Бога» или «Христа»'
  rationale: В ближайшем контексте наиболее вероятен Бог, но Иоанново богословие тесно связывает Отца и Сына. Местоимение сохраняет формулировку и напряжение оригинала.
- issue: Смысл совершенного вида Ἔγνωκα
  choice: «Я познал Его» как состоявшееся познание с продолжающимся результатом
  alternative: «Я знаю Его»
  rationale: Перфект выражает нынешнее состояние, возникшее в результате познания. Краткое «познал» сохраняет аспект лучше, хотя «знаю» возможно как более идиоматичный вариант.
- issue: Характер «познания»
  choice: Сохранить ёмкий глагол «познал» без поясняющей парафразы
  alternative: Передать как «вступил с Ним в близкие отношения»
  rationale: Контекст предполагает личностное, а не только интеллектуальное знание, но парафраза чрезмерно сузила бы и истолковала смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис краток и афористичен; союз «но» естественно выражает противопоставление, заложенное сочетанием καί с отрицательным причастным оборотом. Маркеры сносок [a] и [b] присутствуют в основном тексте.
