  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: ru
  text: И Он Сам — искупительная жертва за наши грехи[a], и не только за наши грехи, но и за грехи всего мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умилостивление»; некоторые понимают это слово как «искупление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Интенсивное употребление местоимения передано сочетанием «Он Сам», подчёркивающим личную роль Иисуса без добавления смысла исключительности.
- source_word: ἱλασμός
  choice: искупительная жертва
  rationale: Это естественное и понятное выражение передаёт жертвенный характер устранения греха, не сводя спорное греческое понятие исключительно к умилостивлению или исключительно к очищению; значимые варианты отмечены в сноске.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: за наши грехи
  rationale: При ἱλασμός предлог περί естественно передаётся как «за»; формулировка идиоматична по-русски и точно обозначает отношение жертвы к грехам.
- source_word: τῶν ἡμετέρων
  choice: за наши
  rationale: Субстантивированное притяжательное местоимение эллиптически отсылает к уже названным грехам. Русское «за наши» сохраняет эту структуру и остаётся ясным.
- source_word: ὅλου τοῦ κόσμου
  choice: грехи всего мира
  rationale: Добавление слова «грехи» раскрывает эллипсис, необходимый для естественного русского синтаксиса, а «всего мира» сохраняет полную широту ὅλου τοῦ κόσμου без богословского сужения.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: не только за наши, но и
  rationale: Коррелятивная конструкция передана обычным русским оборотом «не только…, но и…», сохраняющим противопоставление и нарастание мысли.
theological_decisions:
- issue: Объём выражения «весь мир»
  choice: Сохранить широкое выражение «грехи всего мира» без истолковательного ограничения.
  alternative: «грехи людей со всего мира» или «грехи избранных по всему миру»
  rationale: Греческий текст прямо говорит ὅλου τοῦ κόσμου и не вводит подобных ограничений; перевод сохраняет широту и богословское напряжение исходного высказывания.
- issue: Передача термина ἱλασμός
  choice: «искупительная жертва» в основном тексте
  alternative: «умилостивление» или «жертва очищения»
  rationale: Выбранная формулировка понятна современному читателю, сохраняет жертвенно-искупительный смысл и не разрешает односторонне спор о том, акцентирует ли слово отвращение гнева или устранение греха. Альтернативы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Заглавные буквы в «Он Сам» отражают традиционное уважительное обозначение Христа; тире помогает ясно оформить именную конструкцию. Эллипсис во второй половине раскрыт словами «за грехи», чтобы избежать неестественного русского выражения «за всего мира».
