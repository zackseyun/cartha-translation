id: 1JN.2.1
reference: 1 John 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: ru
  text: Дети мои, пишу вам это, чтобы вы не грешили. Но если кто-нибудь согрешит, у нас есть Ходатай[a] перед Отцом — Иисус Мессия[b], Праведник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое παράκλητος можно также понимать шире: «помощник», «советник» или «утешитель».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «Иисус Христос». Греческое Χριστός означает «Мессия» и может также употребляться почти как часть имени — «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Дети мои
  rationale: Передаёт ласковое семейное обращение и при этом звучит естественно и достойно в современном русском; буквальное «детки мои» было бы излишне разговорным.
- source_word: ταῦτα γράφω ὑμῖν
  choice: пишу вам это
  rationale: Настоящее время соответствует γράφω, а собирательное «это» естественно передаёт ταῦτα без уточнения его референта.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: чтобы вы не грешили
  rationale: Ясно передаёт целевое значение ἵνα с сослагательным наклонением и не превращает цель автора в утверждение о достигнутой безгрешности.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Но если кто-нибудь согрешит
  rationale: «Но» выражает контекстуальное противопоставление предыдущей цели возможному падению; совершенный вид «согрешит» естественно передаёт условный случай совершения греха.
- source_word: παράκλητον
  choice: Ходатай
  rationale: В контексте присутствия перед Отцом слово прежде всего обозначает представителя и заступника; «Ходатай» сохраняет юридико-заступнический оттенок и традиционно понятно русскому читателю.
- source_word: πρὸς τὸν πατέρα
  choice: перед Отцом
  rationale: Передаёт направленность и присутствие по отношению к Отцу, а также естественно сочетается в русском с ролью ходатая.
- source_word: Ἰησοῦν Χριστὸν
  choice: Иисус Мессия
  rationale: Χριστός здесь прочитано как мессианский титул; «Мессия» раскрывает его смысл, тогда как традиционное «Христос» сохранено в примечании.
- source_word: δίκαιον
  choice: Праведник
  rationale: Субстантивированное наименование естественно передаёт согласованное с именем прилагательное и сохраняет его христологическую весомость.
theological_decisions:
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: Контекст допускает и титульное, и ставшее именеподобным восприятие слова. В основном тексте раскрыт титульный смысл, а привычный традиционный вариант отмечен в сноске.
- issue: Возможный вывод о безгрешном совершенстве из ἵνα μὴ ἁμάρτητε
  choice: Целевая формулировка «чтобы вы не грешили»
  alternative: Формулировка, утверждающая фактически достигнутую безгрешность
  rationale: Текст выражает цель написанного, а следующее условие признаёт возможность греха; перевод сохраняет это напряжение и не разрешает его доктринально.
- issue: Смысл παράκλητος применительно к Иисусу перед Отцом
  choice: Ходатай
  alternative: Помощник, Советник или Утешитель
  rationale: Ближайший контекст поддерживает представительно-заступнический смысл, однако более широкий семантический диапазон сохранён в примечании.
translation_notes:
  register: Современный литературный русский с тёплым пастырским обращением и сдержанно возвышенной библейской лексикой. Архаизмы устранены; «Ходатай», «Мессия» и «Праведник» сохранены как понятные богословски значимые наименования.
