source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: ru
  text: Пишу вам, отцы, потому что вы познали того, кто от начала[a]; пишу вам, юноши, потому что вы победили лукавого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «тот, кто от начала», вероятнее всего, относится к Сыну, хотя некоторые понимают его шире — как указание на Бога.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: пишу
  rationale: Настоящее время естественно передаёт действие автора письма и сохраняет непосредственность греческой формы.
- source_word: πατέρες
  choice: отцы
  rationale: Сохранено буквальное обращение; в контексте оно может обозначать духовно зрелых мужчин, но перевод не подменяет образ толкованием.
- source_word: ἐγνώκατε
  choice: вы познали
  rationale: Форма совершенного времени указывает на состоявшееся познание с сохраняющимся результатом; русский совершенный вид передаёт этот смысл естественно.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: того, кто от начала
  rationale: Субстантивированное выражение сохранено без явного называния его референта; краткая формула также поддерживает характерный для Иоанна язык.
- source_word: νεανίσκοι
  choice: юноши
  rationale: Передано обращение к лицам мужского пола во множественном числе без гендерного обобщения.
- source_word: νενικήκατε
  choice: вы победили
  rationale: Совершенный вид выражает уже одержанную победу с продолжающимся результатом и звучит естественно по-русски.
- source_word: τὸν πονηρόν
  choice: лукавого
  rationale: Мужской род и субстантивированная форма указывают на личного злого противника, а не на отвлечённое зло; имя собственное в перевод не добавлено.
theological_decisions:
- issue: Кого обозначает выражение «тот, кто от начала»
  choice: 'Референт не назван прямо: «того, кто от начала»'
  alternative: Явно назвать Сына/Христа либо отнести выражение к Богу без уточнения Лица
  rationale: Контекст Иоанновых писаний, вероятно, указывает на Сына, однако само греческое выражение здесь не называет референта, поэтому двусмысленность сохранена.
- issue: Значение выражения «лукавого»
  choice: Личный злой противник
  alternative: Отвлечённое зло
  rationale: Мужской род единственного числа с артиклем убедительно поддерживает личный референт, обычно понимаемый как сатана, однако его имя в греческом тексте отсутствует.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Повтор «пишу вам» и буквальные обращения «отцы», «юноши» сохранены. Строчные буквы в местоименных обозначениях не навязывают типографическим способом конкретное богословское отождествление.
