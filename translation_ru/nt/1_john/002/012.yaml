lexical_decisions:
- source_word: Γράφω
  choice: Пишу
  rationale: Настоящее время естественно передаёт совершающееся действие письма; в русском «пишу» не требует отдельной продолженной формы.
- source_word: τεκνία
  choice: дети мои
  rationale: Обращение выражает семейную близость и нежность, а не только малый возраст. «Дети мои» естественно передаёт этот оттенок в современном русском, хотя местоимения «мои» в греческом тексте нет.
- source_word: ὅτι
  choice: потому что
  rationale: В данном контексте союз вероятнее всего указывает причину, по которой автор пишет; возможное значение «что» сохранено в сноске.
- source_word: ἀφέωνται
  choice: прощены
  rationale: Перфектная пассивная форма обозначает совершившееся прощение с сохраняющимся результатом. Краткое страдательное причастие «прощены» естественно выражает нынешнее состояние.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: ваши грехи
  rationale: Дательный ὑμῖν при глаголе прощения естественно передаётся по-русски притяжательной конструкцией «ваши грехи».
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: ради его имени
  rationale: διά с винительным падежом указывает основание или причину. Оборот «ради его имени» сохраняет личностный и богословский вес слова «имя», не сводя его к репутации.
- source_word: ὄνομα
  choice: имя
  rationale: Прямое соответствие сохраняет библейское представление об имени как выражении личности и власти.
theological_decisions:
- issue: К кому относится αὐτοῦ («его»)
  choice: В основном тексте оставлено местоимение «его» без уточнения личности
  alternative: «Бога» или «Иисуса»
  rationale: Сам стих прямо не называет референта; контекст допускает соотнесение с Богом или с Иисусом. Строчная буква помогает не добавлять в текст редакционное уточнение.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным синтаксисом. Обращение «дети мои» передаёт ласковый семейный тон без архаичного «чадца». Строчное «его» выбрано для сохранения референциальной неоднозначности оригинала.
