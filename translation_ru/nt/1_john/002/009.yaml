  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: ru
  text: Кто говорит, что он во свете, и ненавидит своего брата, тот до сих пор во тьме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего брата или сестру». В греческом тексте стоит существительное мужского рода в единственном числе — «брата», которое в таком этическом высказывании может употребляться как обобщающее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Кто говорит
  rationale: Субстантивированное причастие обозначает всякого человека с таким утверждением; русская конструкция «кто говорит» естественно передаёт обобщённый характер выражения.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: что он во свете
  rationale: После «говорит» по-русски естественно придаточное предложение. «Во свете» сохраняет пространственно-метафорический образ Иоанна.
- source_word: καί
  choice: но
  rationale: Хотя καί обычно означает «и», здесь оно соединяет заявленное состояние с резко противоречащим ему отношением. Русское «но» ясно передаёт заложенное контекстом противопоставление без изменения содержания.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата
  rationale: «Брата» сохраняет мужской род и единственное число греческого ἀδελφός; возвратное «своего» естественно соотносит его с субъектом.
- source_word: μισῶν
  choice: ненавидит
  rationale: Настоящее причастие описывает продолжающееся или характерное отношение; русское настоящее время передаёт это естественно.
- source_word: ἐν τῇ σκοτίᾳ ἐστίν
  choice: тот ... во тьме
  rationale: Соотносительное «тот» завершает конструкцию «кто ... тот», а «во тьме» сохраняет параллель с «во свете» и образный контраст.
- source_word: ἕως ἄρτι
  choice: до сих пор
  rationale: Устойчиво и естественно выражает продолжение состояния вплоть до настоящего момента.
theological_decisions:
- issue: Значение ἀδελφός в обобщённом этическом высказывании
  choice: брат
  alternative: брат или сестра; единоверец
  rationale: Основной текст сохраняет грамматически мужское единственное число и не сужает значение до явно конфессионального «единоверец». Возможное представительное, включающее употребление отмечено в сноске.
- issue: Связь между заявлением о свете и ненавистью
  choice: но
  alternative: и
  rationale: 'Греческое καί формально допускает «и», однако в данном контексте выражена уступительно-противительная связь: человек заявляет одно, тогда как его отношение обнаруживает обратное. «Но» естественно выявляет этот контраст, не снимая богословского напряжения между исповеданием и действительным состоянием.'
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура оригинала сохранена. Парная конструкция «кто ... тот» делает синтаксис ясным, а образы света и тьмы переданы единообразно и без поясняющей интерпретации.
