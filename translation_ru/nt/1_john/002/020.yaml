  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: ru
  text: Но вы имеете помазание от Святого[a], и все вы знаете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В другом текстовом варианте: «и вы знаете всё». В тексте SBLGNT: «и все вы знаете».'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Но
  rationale: В начале стиха союз выражает контраст с упомянутыми ранее антихристами; русское «но» естественно передаёт эту связь.
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение имеет контрастный оттенок, поддержанный начальным «но».
- source_word: χρῖσμα
  choice: помазание
  rationale: Сохраняет исходную метафору и не конкретизирует её как Святого Духа или Его действие.
- source_word: ἔχετε
  choice: имеете
  rationale: Прямое и уместное в литературном русском соответствие настоящему времени глагола.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: от Святого
  rationale: Сохраняет субстантивированное божественное именование, не определяя, идёт ли речь об Отце или Сыне.
- source_word: καὶ
  choice: и
  rationale: Обычный соединительный союз, связывающий две части утверждения.
- source_word: οἴδατε
  choice: знаете
  rationale: Наиболее прямое и естественное соответствие глаголу знания.
- source_word: πάντες
  choice: все вы
  rationale: 'Передаёт πάντες как именительный падеж множественного числа: знают все адресаты, а не «всё» как объект знания.'
theological_decisions:
- issue: Кого обозначает «Святой»
  choice: Сохранено именование «Святой» без уточнения референта.
  alternative: Бог Отец; Иисус Христос; Святой Дух
  rationale: Греческий текст не называет референта прямо; перевод не должен устранять эту богословскую неоднозначность.
- issue: Смысл χρῖσμα
  choice: Сохранена метафора «помазание».
  alternative: Святой Дух; действие Духа; дар помазания
  rationale: Хотя контекст допускает связь со Святым Духом, исходное слово обозначает помазание и не раскрывает метафору прямо.
- issue: Синтаксис πάντες
  choice: «все вы знаете»
  alternative: «вы знаете всё»
  rationale: Текст SBLGNT читает πάντες, именительный падеж множественного числа; вариант πάντα означал бы «всё».
translation_notes:
  register: Современный литературный русский язык; сохранены краткость, контраст и богословская неоднозначность оригинала. Порядок «все вы знаете» выбран для ясного выражения того, что πάντες относится к адресатам.
