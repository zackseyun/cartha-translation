  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: ru
  text: Кто говорит, что пребывает в нём[a], тот и сам должен ходить так, как ходил он[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаётся в нём». Греческий глагол μένω — важное для Иоанна слово, обозначающее продолжение, постоянство или пребывание в отношениях.'
    reason: lexical_alternative
  - marker: b
    text: «Он» — Иисус. В греческом стоит указательное местоимение ἐκεῖνος, буквально «тот».
    reason: alternative_reading
  - marker: c
    text: «Ходить» — библейский образ поведения и образа жизни; то есть человек должен жить так, как жил Иисус.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Кто говорит
  rationale: Субстантивированное причастие обозначает любого человека, заявляющего это. Русская конструкция «кто говорит» естественно передаёт обобщённое значение греческого единственного числа.
- source_word: ἐν αὐτῷ μένειν
  choice: что пребывает в нём
  rationale: Инфинитив выражает содержание заявления. «Пребывает» сохраняет характерный для Иоанна глагол μένω и его смысл продолжающихся отношений, а местоимение оставлено со строчной буквы, поскольку в греческом тексте особого почтительного написания нет.
- source_word: ὀφείλει
  choice: должен
  rationale: Глагол выражает нравственную обязанность; «должен» ясно и естественно передаёт её без излишне юридического оттенка.
- source_word: καθὼς
  choice: так, как
  rationale: Оборот ясно передаёт соответствие образцу и естественно звучит по-русски.
- source_word: ἐκεῖνος
  choice: Он
  rationale: В контексте местоимение указывает на Иисуса. Самостоятельное «Он» естественно для русского языка; прописная буква помогает обозначить конкретного, уже понятного из контекста Лица, тогда как указательное значение греческого отмечено в сноске.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: ходил ... ходить
  rationale: Сохранена библейская метафора хождения как образа жизни, а формы прошедшего времени и инфинитива соответствуют греческой конструкции.
- source_word: καὶ αὐτὸς
  choice: и сам
  rationale: Передаёт как добавочное значение καί, так и подчёркивание субъекта местоимением αὐτός.
theological_decisions:
- issue: Референт αὐτῷ и ἐκεῖνος
  choice: Первое местоимение передано как «нём» со строчной буквы, а ἐκεῖνος — как «Он» с пояснением, что речь об Иисусе.
  alternative: Передать оба местоимения со строчной буквы либо оба — с прописной; перевести ἐκεῖνος буквально как «тот».
  rationale: Ближайший контекст указывает на Иисуса как на образец жизни. При этом строчная буква в «нём» не вносит отсутствующего в греческом графического толкования. В позиции ἐκεῖνος русское «тот» звучало бы неестественно и могло бы затруднить понимание, поэтому выбранное «Он» сопровождается текстологически прозрачной сноской.
- issue: Хождение как этическая метафора
  choice: Сохранить «ходить» и пояснить метафорический смысл в сноске.
  alternative: 'Раскрыть метафору непосредственно в тексте: «жить так, как жил Он».'
  rationale: Сохранение образа поддерживает межтекстовые связи библейской речи, а сноска делает смысл доступным современному читателю, не сужая его до одного пересказа.
- issue: Обобщённое лицо мужского рода
  choice: Использовать конструкцию «кто говорит… тот и сам должен».
  alternative: Перестроить во множественное число или устранить местоименное согласование.
  rationale: Так сохраняются единственное число и представительный характер греческой конструкции без ограничения высказывания только мужчинами.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской метафоры «ходить». Синтаксис краткий и ясный; конструкция «кто… тот» передаёт обобщённое единственное число. Сноски разъясняют ключевой иоанновский термин, референт местоимения и этическую метафору.
