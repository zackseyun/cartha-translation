source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: ru
  text: 'Но кто соблюдает Его слово, в нём[a] любовь Божья[b] поистине доведена до совершенства. Из этого мы узнаём, что мы в Нём:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этом» или «в этом человеке». Греческое выражение может указывать как на человека, соблюдающего Его слово, так и на это обстоятельство как свидетельство.'
    reason: alternative_reading
  - marker: b
    text: Выражение «любовь Божья» может означать Божью любовь, действующую в верующем, или любовь верующего к Богу.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Но кто
  rationale: Сочетание относительного местоимения с ἄν выражает общее условие — «кто бы ни», естественно передаваемое по-русски как «кто»; δέ сохраняется как мягкое противопоставление «но».
- source_word: τηρῇ
  choice: соблюдает
  rationale: Глагол τηρέω означает хранить, соблюдать, исполнять. «Соблюдает» естественно сочетается со «словом» и сохраняет связь с характерной для Иоанна речью о соблюдении слова и заповедей.
- source_word: αὐτοῦ τὸν λόγον
  choice: Его слово
  rationale: Единственное число λόγος обозначает переданное Богом или Христом слово в широком смысле. «Слово» сохраняет иоанновскую лексику и не сужает значение до «наставления» или «весть».
- source_word: ἀληθῶς
  choice: поистине
  rationale: Наречие усиливает утверждение. «Поистине» передаёт это усиление в современном литературном и достойном регистре.
- source_word: ἐν τούτῳ
  choice: в том
  rationale: Форма буквально допускает «в этом» или «в этом человеке». «В том» естественно указывает на человека, соблюдающего слово, и при этом ближе к форме греческого указательного местоимения, чем разъясняющее «в нём».
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: любовь Божья
  rationale: Родительный τοῦ θεοῦ может обозначать как Божью любовь, действующую в верующем, так и любовь человека к Богу. Краткая традиционная формулировка сохраняется в основном тексте, а смысловая неоднозначность отмечается в сноске.
- source_word: τετελείωται
  choice: доведена до совершенства
  rationale: Перфект пассива выражает достигнутое и сохраняющееся состояние. «Доведена до совершенства» передаёт пассивность и идею завершённости или достижения полноты.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: По этому мы узнаём
  rationale: Иоанновская формула указывает на основание или признак, позволяющий знать нечто; «по этому мы узнаём» естественно передаёт доказательное значение.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: что мы в Нём
  rationale: Буквальное «в Нём» сохраняет ключевое иоанновское выражение близости и единения, не заменяя его истолкованием.
theological_decisions:
- issue: Значение родительного падежа в ἡ ἀγάπη τοῦ θεοῦ
  choice: любовь Божья
  alternative: Божья любовь к человеку; любовь человека к Богу
  rationale: Греческий родительный допускает субъектное и объектное понимание. Основной текст не добавляет направленности любви, а оба возможных смысла прямо указаны в сноске.
- issue: Референт первого ἐν τούτῳ
  choice: в том
  alternative: в этом; в этом человеке; в нём
  rationale: Указательное местоимение может относиться к соблюдающему слово человеку либо, менее лично, к самому признаку или обстоятельству. Формулировка «в том» читается лично, но сноска сохраняет более буквальную широту.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Заглавные буквы в местоимениях «Его», «Нём» обозначают Бога или Христа согласно принятой русской библейской практике. Двоеточие сохранено, поскольку мысль продолжается в следующем стихе.
