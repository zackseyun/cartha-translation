  text: Итак, мы должны принимать таких людей[a], чтобы стать соработниками истины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол, переведённый как «принимать», может также означать гостеприимно встречать и материально поддерживать таких странствующих служителей.
    reason: lexical_alternative
  - marker: b
    text: 'Греческий дательный здесь понимают по-разному: «соработниками истины» может означать соработников ради дела истины; возможны также оттенки «с истиной» или «в истине».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: мы
  rationale: 'Явно выраженное местоимение сохранено: оно подчёркивает обязанность автора и его единомышленников в противопоставлении поведению, описанному в контексте.'
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предыдущего стиха естественным для современного русского языка связующим словом.
- source_word: ὀφείλομεν
  choice: должны
  rationale: Выражает нравственную обязанность без ослабления до простого совета и без излишнего усиления.
- source_word: ὑπολαμβάνειν
  choice: принимать
  rationale: В данном контексте означает гостеприимно принимать странствующих служителей и оказывать им необходимую поддержку; широкое русское слово сохраняет этот спектр значения.
- source_word: τοὺς τοιούτους
  choice: таких людей
  rationale: Указывает на людей того рода, о которых только что говорилось, и не вводит в перевод ненужного уточнения пола.
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно и естественно вводит цель или предполагаемый результат.
- source_word: συνεργοὶ
  choice: соработниками
  rationale: Сохраняет образ совместного участия в труде и соответствует достойному эпистолярному регистру.
- source_word: γινώμεθα
  choice: стать
  rationale: 'Передаёт значение вхождения в новое положение: оказывая поддержку, верующие становятся участниками общего труда.'
- source_word: τῇ ἀληθείᾳ
  choice: ради истины
  rationale: Передаёт дательный падеж как указание на дело или цель, которой служит совместный труд, при этом грамматическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Связь τῇ ἀληθείᾳ с συνεργοὶ
  choice: «соработниками ради истины» — участие в деле распространения истины
  alternative: «соработниками истины», «соработниками вместе с истиной» или «соработниками в истине»
  rationale: Контекст говорит о поддержке тех, кто вышел в путь ради Имени; поэтому основной текст подчёркивает участие в их служении истине. Однако греческий дательный допускает и другие способы понимания, которые сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным эпистолярным звучанием. «Соработниками» несколько возвышеннее разговорного «сотрудниками», но понятно в контексте и точнее сохраняет образ совместного труда.
