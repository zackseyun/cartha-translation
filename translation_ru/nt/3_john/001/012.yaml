source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: ru
  text: Димитрий получил свидетельство от всех и от самой истины. Мы также свидетельствуем, и ты знаешь, что наше свидетельство истинно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δημητρίῳ
  choice: о Димитрии
  rationale: Имя передано в принятой русской библейской форме; дательный падеж при пассивном глаголе естественно выражен конструкцией «о Димитрии свидетельствуют».
- source_word: μεμαρτύρηται
  choice: свидетельствуют
  rationale: Греческий перфект пассива указывает на данное свидетельство с сохраняющейся силой. Русское настоящее время в безлично-пассивном по смыслу обороте естественно передаёт сложившуюся и действующую рекомендацию, не добавляя отсутствующего в тексте слова «доброе».
- source_word: ὑπὸ πάντων
  choice: все
  rationale: ὑπό с родительным обозначает действующих лиц; при перестройке пассива в естественную русскую конструкцию они становятся подлежащим. Всеобщий охват сохранён.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: и сама истина
  rationale: Сохранены определённость, олицетворённый характер выражения и усиление αὐτῆς («сама»), без сужения смысла до Евангелия или поведения Димитрия.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Свидетельствуем и мы
  rationale: Так переданы добавочное значение καί/δέ и эмфатическое ἡμεῖς; повтор корня «свидетель-» сохраняет связь с соседними словами.
- source_word: οἶδας
  choice: ты знаешь
  rationale: οἶδα формально имеет перфектную форму, но функционирует как глагол настоящего состояния; единственное число сохранено.
- source_word: ἡ μαρτυρία ἡμῶν
  choice: наше свидетельство
  rationale: Прямой и естественный русский эквивалент, сохраняющий лексическую связь с глаголом «свидетельствуем».
- source_word: ἀληθής ἐστιν
  choice: истинно
  rationale: Прямой перевод сказуемого, сохраняющий корневую и смысловую связь с «истиной» ранее в стихе.
theological_decisions:
- issue: Смысл выражения «сама истина» в Иоанновом словоупотреблении
  choice: Сохранить буквальное и многозначное выражение «сама истина».
  alternative: «Само Евангелие» или «сама жизнь Димитрия».
  rationale: Греческий текст допускает понимание истины как евангельской истины и как истины, подтверждаемой соответствующей ей жизнью Димитрия. Перевод не должен устранять эту богословскую и литературную многозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка компактна и понятна; лексический повтор «свидетельствуют — свидетельствуем — свидетельство» намеренно сохраняет риторику оригинала.
