- from: О Димитрии свидетельствуют все — и сама истина. Свидетельствуем и мы, и ты знаешь, что наше свидетельство истинно.
  to: Димитрий получил свидетельство от всех и от самой истины. Мы также свидетельствуем, и ты знаешь, что наше свидетельство истинно.
  rationale: Исправлена только передача греческого перфекта страдательного залога в начале стиха. Перевод остаётся буквальным в существенных элементах, сохраняет многозначность «самой истины» и не вносит отсутствующую в оригинале характеристику свидетельства как «доброго».
