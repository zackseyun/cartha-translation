    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: засвидетельствовали
  rationale: Аорист сообщает о совершившемся свидетельстве; русское прошедшее время передаёт это прямо. «Засвидетельствовали» сохраняет смысл подтверждения или сообщения перед общиной.
- source_word: σου τῇ ἀγάπῃ
  choice: о твоей любви
  rationale: Дательный падеж обозначает содержание свидетельства. Оборот «о твоей любви» естественен по-русски и ясно указывает, что речь идёт о проявленной Гаием любви.
- source_word: ἐνώπιον ἐκκλησίας
  choice: перед церковью
  rationale: ἐνώπιον указывает на присутствие собравшихся, а ἐκκλησία здесь означает местную христианскую общину. Формулировка кратка и соответствует современному церковному словоупотреблению.
- source_word: καλῶς ποιήσεις
  choice: ты хорошо сделаешь
  rationale: Будущее время имеет вежливо-побудительную силу. Русское выражение сохраняет и форму одобрения, и смысл увещания, не превращая его в резкий приказ.
- source_word: προπέμψας
  choice: если поможешь им отправиться дальше
  rationale: Причастие обозначает содействие продолжению пути и в данном контексте может подразумевать практическое обеспечение путешественников. Условная конструкция естественно связывается по-русски с выражением «хорошо сделаешь».
- source_word: ἀξίως τοῦ θεοῦ
  choice: так, как достойно Бога
  rationale: Оборот передаёт образ действия, сообразный Божьему достоинству и чести. Эта формулировка сохраняет богословскую весомость греческого выражения и звучит естественно в современном русском языке.
theological_decisions:
- issue: Смысл προπέμπω в контексте христианского гостеприимства
  choice: «поможешь им отправиться дальше» в основном тексте с пояснением практической поддержки в сноске
  alternative: «проводишь их в путь»; «снарядишь их в дальнейший путь»
  rationale: Речь, вероятно, идёт не просто о прощании, а о помощи странствующим служителям продолжить путь. Основной текст передаёт этот смысл без чрезмерной конкретизации, а сноска сохраняет возможный оттенок снабжения всем необходимым.
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным звучанием. Сохранено обращение на «ты», соответствующее единственному числу в греческом тексте. Два русских предложения обеспечивают ясность, не меняя логической связи исходного высказывания.
