base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: ru
  text: Я кое-что написал церкви[a], но Диотреф, который любит быть первым среди них, не принимает нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Я написал церкви краткую записку». В греческом тексте употреблено неопределённое выражение («написал кое-что»); в некоторых рукописях формулировка расширена.'
    reason: textual_variant
  - marker: b
    text: 'Или: «не оказывает нам гостеприимства»; или: «не признаёт нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: я написал
  rationale: Аорист естественно передаётся русским прошедшим временем; контекст не требует формы «я писал» или «я уже написал».
- source_word: τι
  choice: кое-что
  rationale: Неопределённое местоимение буквально обозначает нечто неопределённое. «Кое-что» звучит естественно по-русски и не добавляет отсутствующего в тексте существительного вроде «письмо» или «записка».
- source_word: τῇ ἐκκλησίᾳ
  choice: церкви
  rationale: Здесь ἐκκλησία означает местную общину христиан; «церковь» — общепонятный и устойчивый русский эквивалент.
- source_word: ἀλλ’
  choice: но
  rationale: Союз выражает явное противопоставление между письмом автора и реакцией Диотрефа.
- source_word: ὁ φιλοπρωτεύων
  choice: который любит быть первым
  rationale: Передаёт как стремление к первенству, так и отрицательную нравственную оценку, не вводя специальной терминологии о церковной должности.
- source_word: αὐτῶν
  choice: среди них
  rationale: Родительный падеж указывает на группу, в которой Диотреф стремится занимать первое место. Формулировка «среди них» не предполагает сверх текста официальной власти над общиной.
- source_word: Διοτρέφης
  choice: Диотреф
  rationale: Использована традиционная русская форма греческого личного имени.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: не принимает нас
  rationale: Глагол может включать личный приём, гостеприимство и признание представителей или их авторитета. Широкое «не принимает нас» сохраняет эту смысловую открытость.
theological_decisions:
- issue: Характер противодействия Диотрефа
  choice: не принимает нас
  alternative: не приветствует нас; не признаёт нас
  rationale: Греческий глагол не позволяет с уверенностью свести конфликт только к отказу в гостеприимстве или только к непризнанию авторитета автора. Перевод сохраняет эту богословски и экклезиологически значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Необычная неопределённость τι сохранена без стилистического сглаживания; «принимает» оставлено достаточно широким, чтобы не сужать смысл до гостеприимства либо признания власти.
