  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: ru
  text: Ведь я очень обрадовался, когда пришли братья[a] и засвидетельствовали о твоей верности истине[b], как ты живёшь в истине.
  philosophy: optimal-equivalence
  footnotes:
