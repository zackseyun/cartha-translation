    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «о твоей истине»; возможно также: «об истине, которая в тебе». Здесь речь не о личной или субъективной истине адресата, а о его отношении к истине.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Я очень обрадовался
  rationale: Аорист ἐχάρην имеет активное по смыслу значение; «очень обрадовался» естественно передаёт усиление λίαν. Частица γάρ здесь поясняет предыдущую мысль, однако в русском связном тексте её значение достаточно выражено самим продолжением рассуждения, поэтому отдельное «ведь» не требуется.
- source_word: ἐρχομένων ἀδελφῶν
  choice: когда пришли братья
  rationale: Родительный самостоятельный оборот передан естественным временным придаточным. «Братья» сохраняет мужскую форму греческого ἀδελφῶν и раннехристианский язык духовного родства.
- source_word: μαρτυρούντων
  choice: засвидетельствовали
  rationale: Сохраняется характерная для Иоанновых текстов лексика свидетельства; глагол звучит достойно и понятен современному читателю.
- source_word: σου τῇ ἀληθείᾳ
  choice: о твоей верности истине
  rationale: Буквальное «о твоей истине» по-русски легко понять как личную, субъективную истину. Выбранная формулировка естественно связывает притяжательное местоимение с отношением адресата к истине, а буквальная структура отмечена в сноске.
- source_word: καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς
  choice: о том, что ты живёшь в истине
  rationale: «Живёшь» естественно передаёт этическую метафору περιπατεῖς в современном русском, а «в истине» сохраняет Иоаннову богословско-нравственную категорию и связь с первым употреблением ἀληθείᾳ.
theological_decisions:
- issue: Значение ἀλήθεια в богословско-нравственном контексте Иоанновых посланий
  choice: Во втором употреблении сохранено «истина», а первое передано как «верность истине».
  alternative: «о твоей истине»; «об истине, которая в тебе»
  rationale: Перевод не сводит истину ни к одной лишь искренности, ни только к вероучению. Формулировка показывает связь исповедуемой истины с образом жизни, не устраняя напряжения между богословским и нравственным смыслами.
- issue: Образ хождения в истине
  choice: живёшь в истине
  alternative: ходишь в истине
  rationale: В русском «ходишь в истине» звучит архаично и может быть неясно. «Живёшь в истине» передаёт устойчивое нравственное поведение, сохраняя пространственную конструкцию «в истине».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным эпистолярным звучанием. Избегается двусмысленное для современного русского выражение «твоя истина», которое могло бы означать субъективную правду адресата. Синтаксис сделан плавным, без архаического «ходить в истине».
