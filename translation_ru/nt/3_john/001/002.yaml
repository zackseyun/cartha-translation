id: 3JN.1.2
reference: 3 John 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: ru
  text: Возлюбленный[a], молюсь, чтобы ты во всём преуспевал[b] и был здоров, как преуспевает твоя душа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дорогой друг».'
    reason: Лексическая альтернатива обращения Ἀγαπητέ.
  - marker: b
    text: 'Или: «чтобы во всех отношениях у тебя всё складывалось благополучно». Традиционное «прежде всего» менее вероятно: греческий оборот скорее указывает на охват пожелания, чем на его первоочерёдность.'
    reason: Альтернативная передача περὶ πάντων и εὐοδοῦσθαι с пояснением синтаксической неоднозначности.
  - marker: c
    text: 'Или: «как благополучен твой внутренний человек»; «как хорошо обстоят дела с твоей душой».'
    reason: Лексическая широта ψυχή и εὐοδοῦται.
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Возлюбленный
  rationale: Форма обращения в единственном числе выражает любовь к адресату и сохраняет связь слова ἀγαπητός с понятием любви. Более разговорный вариант — «дорогой друг».
- source_word: περὶ πάντων
  choice: во всём
  rationale: Оборот естественнее понимать как указание на сферу или полноту благополучия — «во всех отношениях», а не как обозначение первоочерёдности «прежде всего».
- source_word: εὔχομαί
  choice: молюсь
  rationale: В контексте христианского послания глагол передаёт молитвенное пожелание; «молюсь» сохраняет религиозный оттенок.
- source_word: σε εὐοδοῦσθαι
  choice: чтобы ты… преуспевал
  rationale: Глагол означает, что дела или жизнь складываются благополучно. «Преуспевал» кратко передаёт этот смысл и позволяет сохранить повтор того же глагола во второй части стиха.
- source_word: ὑγιαίνειν
  choice: был здоров
  rationale: Здесь глагол относится к телесному здоровью; выбран естественный для современного русского языка оборот.
- source_word: καθὼς
  choice: как
  rationale: Союз вводит сравнение внешнего и телесного благополучия адресата с благополучием его души.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: преуспевает твоя душа
  rationale: Формулировка сохраняет лексический повтор εὐοδόομαι и настоящее время, указывающее на нынешнее благополучное состояние души.
- source_word: ψυχή
  choice: душа
  rationale: «Душа» сохраняет смысл внутренней жизни человека и контраст с телесным здоровьем, не навязывая тексту подробной антропологической схемы.
theological_decisions:
- issue: Значение περὶ πάντων в начальном пожелании
  choice: во всём / во всех отношениях
  alternative: прежде всего
  rationale: Греческий оборот вероятнее обозначает охват пожелания, а не его приоритет. Поэтому перевод не превращает эти слова в утверждение о высшей духовной или материальной цели.
- issue: Смысл ψυχή
  choice: душа
  alternative: внутренний человек / жизнь
  rationale: Перевод «душа» сохраняет заложенное в стихе сопоставление с телесным здоровьем, но сам по себе не определяет точное соотношение частей человеческой природы.
- issue: Повтор εὐοδοῦσθαι / εὐοδοῦται
  choice: преуспевал / преуспевает
  alternative: чтобы у тебя всё складывалось благополучно / как благополучна твоя душа
  rationale: Повтор одного русского глагола отражает намеренный лексический параллелизм оригинала. При этом «преуспевать» понимается широко как благополучие, а не исключительно как материальное обогащение.
translation_notes:
  register: Современный литературный русский язык с достойным эпистолярным тоном. Обращение «Возлюбленный» сохраняет библейскую торжественность, а остальная фраза построена просто и понятно. Лексический повтор «преуспевал — преуспевает» намеренно отражает повтор греческого глагола и не ограничивается значением материального успеха.
