  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: ru
  text: Возлюбленный, не подражай злу, а добру. Кто делает добро, тот от Бога; кто делает зло, тот не видел Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие причастия можно также передать: «делающий добро… делающий зло»; они могут подчёркивать продолжающееся или характерное поведение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Возлюбленный
  rationale: Форма обращения в единственном числе передаёт сердечность и сохраняет характерное для Иоанновых текстов наименование адресата.
- source_word: μὴ μιμοῦ
  choice: подражай не
  rationale: Настоящее повелительное наклонение с отрицанием выражает запрет; «подражать» прямо передаёт идею следования нравственному примеру.
- source_word: τὸ κακὸν … τὸ ἀγαθόν
  choice: злу… добру
  rationale: Субстантивированные прилагательные обозначают общие нравственные категории; русский дательный после «подражать» естественно сохраняет их противопоставление.
- source_word: ὁ ἀγαθοποιῶν
  choice: Кто делает добро
  rationale: Субстантивированное причастие настоящего времени обозначает человека по его совершаемым или характерным поступкам, не ограничивая смысл единичным действием.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: тот от Бога
  rationale: Сохранена краткая Иоаннова формула, указывающая на происхождение или принадлежность, без её догматического развёртывания.
- source_word: ὁ κακοποιῶν
  choice: кто делает зло
  rationale: Формулировка параллельна «кто делает добро» и сохраняет возможный оттенок продолжающегося или характерного поведения.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: тот не видел Бога
  rationale: Перфект передан естественной русской формой прошедшего времени; буквальный образ видения Бога сохранён и не заменён толкованием «не знает Бога».
theological_decisions:
- issue: Связь нравственного поведения с отношением к Богу в Иоанновой формуле
  choice: Сохранить утверждения «от Бога» и «не видел Бога» в их собственных категориях.
  alternative: Истолковать их как прямые формулы о возрождении, безгрешности или полном отсутствии всякой прежней связи с Богом.
  rationale: Греческий текст даёт нравственно-духовную характеристику в Иоанновой терминологии, но не разворачивает её в позднейшую систематическую доктрину; перевод сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Возлюбленный» сохраняет библейскую теплоту обращения; синтаксис краток и афористичен. Маркер сноски поставлен после всего высказывания, к которому относится пояснение о двух параллельных причастиях.
