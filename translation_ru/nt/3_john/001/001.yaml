  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: ru
  text: Старейшина — возлюбленному Гаию, которого я люблю в истине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которого я искренне люблю» или «которого я поистине люблю». Греческое выражение может указывать на искреннюю любовь, на любовь, основанную на истине Благой вести, или на оба смысла одновременно.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Старейшина
  rationale: Субстантивированное определение с артиклем служит самоназванием отправителя. «Старейшина» естественно передаёт вероятный оттенок положения или служения, не сводя слово ни к возрасту («старец»), ни к заимствованному техническому термину («пресвитер»).
- source_word: Γαΐῳ
  choice: Гаию
  rationale: Использована традиционная русская форма имени Гаий в дательном падеже, как того требует эпистолярная конструкция.
- source_word: τῷ ἀγαπητῷ
  choice: возлюбленному
  rationale: Сохраняет теплоту обращения и лексическую связь с последующим глаголом ἀγαπῶ лучше, чем более нейтральное «дорогому».
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: которого я люблю
  rationale: Передаёт относительное местоимение как объект глагола и сохраняет явно выраженное греческое ἐγώ посредством русского «я», не добавляя искусственного усиления.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Буквально и естественно сохраняет возможные значения искренности и любви, укоренённой в истине, не выбирая преждевременно только одно из них.
theological_decisions:
- issue: Смысл выражения ἐν ἀληθείᾳ в заключительной части стиха
  choice: в истине
  alternative: «поистине» или «в той истине»
  rationale: В Иоанновых текстах «истина» может иметь богословскую глубину, однако здесь выражение допускает и значение искренности. Формулировка «в истине» сохраняет эту смысловую напряжённость, не сводя её ни к простому наречию, ни к однозначно техническому обозначению евангельской истины.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного приветствия. Тире помогает естественно передать подразумеваемую в греческом именную конструкцию «отправитель — адресату». Повтор «возлюбленному… люблю» намеренно сохраняет лексическую связь оригинала.
