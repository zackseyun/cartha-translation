  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: ru
  text: Возлюбленный, ты поступаешь верно во всём, что делаешь для братьев[a], и притом для незнакомых тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братьев» — буквально мужское множественное число; здесь имеются в виду собратья по вере, хотя в их числе могли быть и женщины.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и особенно когда они тебе незнакомы». Греческий оборот подчёркивает служение братьям, которых адресат прежде не знал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Возлюбленный
  rationale: Форма обращения в единственном числе передаёт сердечность и возвышенно-дружеский тон послания, не добавляя отсутствующего в греческом слове значения «друг».
- source_word: πιστὸν ποιεῖς
  choice: ты поступаешь верно
  rationale: Греческое сочетание буквально означает «делаешь верное/верное дело»; русское «поступаешь верно» естественно передаёт похвалу за верность и надёжность.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: во всём, что делаешь
  rationale: 'Относительное местоимение с ἐάν и сослагательным наклонением имеет обобщённо-неопределённый смысл: речь идёт обо всём, что адресат делает.'
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: для братьев
  rationale: Предлог εἰς здесь передаёт направленность действий на благо людей; «для» звучит естественно. Существительное имеет форму мужского рода во множественном числе.
- source_word: καὶ τοῦτο ξένους
  choice: и притом для незнакомых тебе
  rationale: Оборот подчёркивает, что братья были лично незнакомы адресату. «И притом» сохраняет добавочное усиление καὶ τοῦτο, не превращая его без необходимости в более определённое «особенно».
- source_word: ξένους
  choice: незнакомых тебе
  rationale: В контексте гостеприимства слово обозначает людей, которых хозяин прежде не знал, а не обязательно иноземцев.
theological_decisions:
- issue: Кого обозначает τοὺς ἀδελφοὺς
  choice: Сохранено буквальное «братьев» с пояснением в сноске.
  alternative: «братьев и сестёр» или «единоверцев»
  rationale: Греческая форма грамматически мужского рода и в данном контексте обозначает собратьев по вере; расширительный перевод в основном тексте мог бы сделать состав группы определённее, чем позволяет источник.
- issue: Связь ξένους с «братьями»
  choice: Передано как братья, лично незнакомые адресату.
  alternative: Отдельная группа чужеземцев или вообще посторонних людей
  rationale: Синтаксис естественно связывает ξένους с τοὺς ἀδελφοὺς, а ближайший контекст послания говорит о пришедших братьях; при этом перевод не утверждает их этническую принадлежность.
translation_notes:
  register: Современный литературный русский язык с тёплым, достойным эпистолярным тоном. Синтаксис сделан естественным для обычного читателя, при этом сохранены обращение «Возлюбленный», мужская форма «братьев» и смысловая напряжённость оборота καὶ τοῦτο.
