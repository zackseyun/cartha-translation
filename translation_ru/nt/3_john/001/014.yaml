base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: ru
  text: Но я надеюсь вскоре увидеть тебя, и мы поговорим с глазу на глаз.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уста к устам»; то есть при личной встрече, непосредственно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: я надеюсь
  rationale: Настоящее время выражает личную надежду и ожидание автора; это естественная формулировка для завершения письма.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает мягкое противопоставление или переход от мысли о письменном общении к надежде на личную встречу.
- source_word: εὐθέως
  choice: вскоре
  rationale: Хотя слово может означать «немедленно», в контексте предполагаемой поездки оно указывает на близкое время встречи.
- source_word: σε ἰδεῖν
  choice: увидеть тебя
  rationale: Передаёт конструкцию прямо и естественно, не добавляя более узкого значения «навестить».
- source_word: στόμα πρὸς στόμα
  choice: с глазу на глаз
  rationale: Греческое выражение буквально означает «уста к устам», но здесь обозначает непосредственную личную беседу; русский идиом передаёт этот смысл естественно.
- source_word: λαλήσομεν
  choice: мы поговорим
  rationale: Будущее время обозначает ожидаемую беседу; «поговорим» звучит естественно в современном русском и сохраняет взаимный характер общения.
