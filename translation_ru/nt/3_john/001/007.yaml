base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: ru
  text: Ведь они отправились в путь ради Имени, ничего не принимая от язычников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «неверующих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: ради
  rationale: С родительным падежом здесь выражает основание или цель служения. «Ради» естественно и кратко передаёт этот смысл, не внося идеи замещения.
- source_word: τοῦ ὀνόματος
  choice: Имени
  rationale: Греческое выражение буквально означает «Имени» и служит благоговейным обозначением Иисуса/Господа. Прописная буква помогает сохранить этот особый смысл, не добавляя отсутствующих в тексте слов «Христа» или «Его».
- source_word: ἐξῆλθον
  choice: отправились в путь
  rationale: В контексте странствующего христианского служения глагол обозначает выход или отправление. Такой перевод звучит естественно по-русски и яснее, чем буквальное «вышли», при этом не уточняет не названное в стихе место назначения.
- source_word: μηδὲν λαμβάνοντες
  choice: ничего не принимая
  rationale: 'Причастный оборот описывает обстоятельства их служения: они не принимали материальной поддержки от названной далее группы. «Принимая» точнее передаёт этот контекстуальный оттенок, чем возможное «беря».'
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: от язычников
  rationale: В данном контексте ἐθνικοί обозначает людей вне христианской общины, сохраняя этнорелигиозный оттенок слова. «Язычники» — понятный и исторически уместный русский эквивалент; возможные контекстуальные варианты указаны в сноске.
theological_decisions:
- issue: Кого обозначает «Имя»
  choice: Сохранено благоговейное и нерасшифрованное «Имя», подразумевающее Иисуса/Господа.
  alternative: «ради имени Христа» или «ради Его имени»
  rationale: Сам текст не называет носителя Имени прямо. Сохранение исходного выражения передаёт его богословскую насыщенность и не добавляет отсутствующего уточнения.
- issue: Значение ἐθνικῶν
  choice: «язычников» в основном тексте
  alternative: «иноверцев» или «неверующих»
  rationale: Слово может контекстуально обозначать нехристиан, однако «язычники» лучше сохраняет исторический этнорелигиозный ракурс. Сноска отражает более функциональные толкования, не подменяя ими основной перевод.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и понятным синтаксисом. «Отправились в путь» естественно передаёт миссионерское отправление; «Имя» сохраняет благоговейную недосказанность оригинала. Маркер сноски помещён непосредственно после слова, к которому относится лексическая альтернатива.
