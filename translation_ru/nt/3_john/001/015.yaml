lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Мир тебе
  rationale: Сохраняет краткую форму греческого эпистолярного благословения и естественно звучит по-русски; глагол в оригинале подразумевается.
- source_word: ἀσπάζονταί σε
  choice: Тебя приветствуют
  rationale: Передаёт обычное для писем значение глагола ἀσπάζομαι и сохраняет обращение к одному адресату.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: друзья / друзей
  rationale: Последовательно и прямо передаёт φίλοι, не заменяя его более привычными, но отсутствующими в оригинале обозначениями вроде «братья» и не добавляя притяжательного местоимения.
- source_word: ἀσπάζου
  choice: Приветствуй
  rationale: Прямо передаёт повелительное наклонение единственного числа и сохраняет лексическую связь с предыдущим предложением.
- source_word: κατ’ ὄνομα
  choice: по имени
  rationale: Формально близко к греческому выражению и сохраняет оттенок личного, отдельного приветствия каждого человека.
