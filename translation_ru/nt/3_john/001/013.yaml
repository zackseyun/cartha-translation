base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: ru
  text: Мне о многом хотелось написать тебе, но я не хочу писать тебе чернилами и тростниковым пером.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ
  choice: о многом
  rationale: Субстантивированное прилагательное среднего рода во множественном числе означает множество тем или вещей; русское «о многом» естественно передаёт этот смысл.
- source_word: εἶχον γράψαι σοι
  choice: мне о многом хотелось написать тебе
  rationale: Сочетание εἶχον с инфинитивом обозначает имевшееся намерение написать. Буквальное «я имел многое написать» неестественно по-русски; выбранная формулировка сохраняет прошедший временной план и оттенок намерения.
- source_word: ἀλλ’ οὐ θέλω
  choice: но я не хочу
  rationale: θέλω выражает желание или волю; «не хочу» — прямой, современный и стилистически уместный эквивалент.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: чернилами и тростниковым пером
  rationale: διά с родительным обозначает средство. μέλαν — чернила, а κάλαμος в данном контексте — изготовленное из тростника писчее перо; явное «тростниковым» сохраняет конкретный образ греческого текста.
- source_word: γράφειν
  choice: писать
  rationale: Инфинитив настоящего времени представляет процесс письма; обычное русское «писать» передаёт его без избыточного уточнения длительности.
