  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: ru
  text: Нет для меня большей радости, чем слышать, что мои дети живут в истине.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Нет у меня радости большей, чем эти вещи»; последующие слова поясняют, в чём состоит эта радость. «Живут» передаёт смысл образа «ходят».'
    reason: lexical_alternative
  - marker: b
    text: Под «моими детьми», вероятно, имеются в виду духовные дети автора — верующие, о которых он заботился.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν … χαράν
  choice: большей радости
  rationale: Естественная русская передача сравнительной конструкции со значением «радость более великая».
- source_word: τούτων
  choice: чем
  rationale: Родительный сравнения соотносится с последующим содержанием радости; в русском оборот «нет большей радости, чем…» звучит естественно. Более буквальная множественная форма отмечена в сноске.
- source_word: ἵνα ἀκούω
  choice: слышать, что
  rationale: Здесь ἵνα вводит содержание того, что составляет радость, а не обычную цель.
- source_word: τὰ ἐμὰ τέκνα
  choice: мои дети
  rationale: Сохранён семейный образ греческого текста без уточнения в основном тексте, буквальные это дети или духовные.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: в истине
  rationale: Формулировка сохраняет широту иоанновского понятия истины, не сводя его только к искренности или только к вероучению.
- source_word: περιπατοῦντα
  choice: живут
  rationale: Греческая метафора хождения обозначает образ жизни. В современном русском «живут в истине» ясно и естественно передаёт смысл, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Кого обозначает τέκνα — родных или духовных детей
  choice: Оставить в основном тексте «мои дети».
  alternative: «мои духовные дети»; «обращённые мною»
  rationale: Контекст, вероятно, указывает на верующих, о которых автор заботится духовно, однако сам греческий текст сохраняет семейное обозначение и не выражает уточнения прямо.
- issue: Смысл выражения ἐν τῇ ἀληθείᾳ
  choice: «в истине»
  alternative: «правдиво»; «согласно истинному учению»
  rationale: Выражение может охватывать и верность истине, и соответствующий ей образ жизни; перевод не сужает эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Конструкция с «чем слышать» естественна для русского; «живут в истине» избегает неестественного библеизма, при этом исходная метафора сохранена в сноске.
