id: 3JN.1.10
reference: 3 John 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: ru
  text: 'Поэтому, если я приду, я укажу на его дела, которые он совершает: он распускает о нас злобные и пустые речи. Но и этого ему мало: он сам не принимает братьев[a][b], препятствует тем, кто хочет их принять, и изгоняет их из церкви[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оказывает братьям гостеприимства». Греческий глагол может означать гостеприимно принимать или приветствовать.'
    reason: lexical_alternative
  - marker: b
    text: Под «братьями», вероятно, имеются в виду странствующие христиане, в том числе служители Благой вести.
    reason: contextual_clarification
  - marker: c
    text: То есть исключает из местной христианской общины тех, кто хочет принять братьев.
    reason: referent_clarification
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предыдущим стихом кратко и естественно.
- source_word: ἐὰν ἔλθω
  choice: если я приду
  rationale: Сохраняет условную форму и эпистолярную перспективу греческого текста.
- source_word: ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: обращу внимание на дела, которые он совершает
  rationale: ὑπομιμνῄσκω буквально связано с напоминанием, но здесь речь идёт о том, чтобы поставить продолжающиеся поступки Диотрефа на вид; выбранная формулировка естественно выражает эту контекстуальную функцию.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: распускает о нас злобные и пустые речи
  rationale: Сочетание передаёт как враждебный характер λόγοις πονηροῖς, так и оттенок пустословия или вздорной болтовни в φλυαρῶν, не сводя выражение только к формально установленной клевете.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: не довольствуясь этим
  rationale: Близко воспроизводит причастный оборот и показывает, что последующие действия дополняют уже названное зло.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: он сам не принимает братьев
  rationale: «Принимает» сохраняет широту ἐπιδέχεται, включая признание и гостеприимный приём; усилительное αὐτός передано словом «сам».
- source_word: τοὺς βουλομένους κωλύει
  choice: препятствует тем, кто хочет их принять
  rationale: Подразумеваемое действие при βουλομένους восстановлено из предыдущей фразы для ясности; κωλύει передано без уточнения способа противодействия.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: изгоняет их из церкви
  rationale: Передаёт сильный глагол ἐκβάλλει и сохраняет настоящее время, описывающее продолжающееся поведение; «церковь» здесь означает местную христианскую общину.
theological_decisions:
- issue: Кого обозначает τοὺς ἀδελφούς в контексте церковного гостеприимства
  choice: братьев
  alternative: единоверцев; братьев и сестёр
  rationale: Грамматически стоит мужской род, а ближайший контекст 3 Иоанна указывает на странствующих христианских служителей. Перевод сохраняет эту конкретность, не исключая пояснения в сноске.
- issue: Кого изгоняют из церкви
  choice: тех, кто хочет принять братьев
  alternative: странствующих братьев
  rationale: Местоименное «их» естественнее всего соотносится с ближайшей группой — τοὺς βουλομένους, хотя греческая формулировка не повторяет дополнение явно. Перевод сохраняет местоименную форму, а сноска отмечает референт.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным церковного послания синтаксисом. Сохранены резкость обличения, последовательность действий и неоднозначность глагола «принимать»; тяжеловесные кальки и конфессионально окрашенные термины не использованы.
