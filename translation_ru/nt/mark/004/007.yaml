  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: ru
  text: И другое семя упало среди терновника[a]. Терновник вырос и заглушил его, и оно не принесло плода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в терновник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: другое семя
  rationale: Субстантивированное прилагательное среднего рода единственного числа эллиптически указывает на семя из ближайшего контекста. Слово «семя» добавлено для естественности и ясности по-русски.
- source_word: ἔπεσεν
  choice: упало
  rationale: Прямо передаёт аорист πίπτω и не подменяет его контекстуальным толкованием «было посеяно».
- source_word: εἰς τὰς ἀκάνθας
  choice: среди терновника
  rationale: В данном земледельческом контексте это естественная русская передача попадания семени в место, заросшее колючими растениями; буквальное пространственное значение εἰς отмечено в сноске.
- source_word: ἀνέβησαν αἱ ἄκανθαι
  choice: терновник вырос
  rationale: Передаёт появление и рост колючей растительности естественным современным русским языком. Собирательное «терновник» согласуется с единственным числом.
- source_word: συνέπνιξαν αὐτό
  choice: заглушил его
  rationale: «Заглушил» — устойчивое русское обозначение того, как сорная растительность подавляет рост культурного растения; местоимение сохраняет отсылку к семени.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: оно не принесло плода
  rationale: Естественно и близко передаёт буквальное «не дало плода», сохраняя сельскохозяйственный образ и отрицательный результат.
