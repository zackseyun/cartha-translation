  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: ru
  text: 'И они исполнились великого страха и говорили друг другу: «Кто же он, что даже ветер и море повинуются ему?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: исполнились великого страха
  rationale: Сочетание глагола с однокоренным винительным усиливает значение. Выбранная формулировка естественна для современного литературного русского языка и сохраняет сильную степень страха без буквального, но неестественного «устрашились великим страхом».
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект допускает длительное или повторяющееся действие; русская форма несовершенного вида естественно передаёт этот оттенок в повествовании.
- source_word: πρὸς ἀλλήλους
  choice: друг другу
  rationale: Прямо и идиоматично передаёт взаимный характер речи.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Кто же Он
  rationale: Частица ἄρα выражает вывод и изумление; «же» естественно сохраняет этот оттенок. Местоимение «Он» обозначает присутствующего Иисуса без добавочного истолкования.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит поразительное обстоятельство, лежащее в основе вопроса, и естественно передаётся русским «что».
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: даже ветер и море
  rationale: Первое καί имеет усилительное значение «даже», а второе соединяет два подлежащих; перевод сохраняет удивление учеников.
- source_word: ὑπακούει αὐτῷ
  choice: повинуются Ему
  rationale: ὑπακούω здесь означает послушание приказу. «Повинуются» подчёркивает власть Иисуса над ветром и морем и сохраняет их олицетворённое изображение.
theological_decisions:
- issue: Власть Иисуса над творением
  choice: Сохранить вопрос учеников и прямое утверждение о повиновении ветра и моря без поясняющего догматического вывода.
  alternative: Раскрыть подразумеваемую божественную идентичность Иисуса непосредственно в переводе.
  rationale: Греческий текст передаёт необычайную власть Иисуса через изумлённый вопрос учеников, но не формулирует здесь явного догматического заключения; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Усиленная греческая конструкция передана естественным выражением «исполнились великого страха»; несовершенный вид «говорили» сохраняет повествовательный оттенок имперфекта.
