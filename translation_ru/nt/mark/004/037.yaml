    text: 'Букв.: «великая буря ветра».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «волны снова и снова ударяли в лодку». Греческая форма глагола изображает продолжающееся или повторяющееся действие.'
    reason: lexical_alternative
