    text: 'Или: «лодка уже наполнялась».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: поднялась
  rationale: Историческое настоящее Марка передано естественным русским повествовательным прошедшим временем; глагол также выражает начало бури.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: сильная буря
  rationale: λαῖλαψ обозначает шквал или бурю, ἀνέμου указывает на ветер, а μεγάλη — на значительную силу; по-русски «сильная буря» естественно передаёт всё выражение без тяжеловесности.
- source_word: τὰ κύματα
  choice: волны
  rationale: Обычный и точный современный эквивалент κῦμα; определённость ясна из контекста.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: одна за другой захлёстывали лодку
  rationale: Имперфект передаёт продолжающееся и повторяющееся действие волн; «захлёстывали» естественно выражает как их удар, так и попадание воды внутрь лодки.
- source_word: τὸ πλοῖον
  choice: лодку
  rationale: Для судна на Галилейском море современное «лодка» уместнее, чем более крупное или архаизирующее «корабль».
- source_word: ὥστε
  choice: так что
  rationale: Естественно вводит фактическое следствие в русском языке.
- source_word: ἤδη
  choice: уже
  rationale: Прямо передаёт достигнутую к этому моменту степень развития действия.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: лодка уже наполнялась водой
  rationale: Передаёт продолжающийся процесс и смысл пассивно-медиальной формы; «водой» эксплицирует очевидное из контекста содержание, необходимое для естественного русского выражения.
