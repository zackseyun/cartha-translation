  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: ru
  text: И поднялась сильная буря[a]. Волны одна за другой захлёстывали лодку[b], так что лодка уже наполнялась водой[c].
  philosophy: optimal-equivalence
  footnotes:
