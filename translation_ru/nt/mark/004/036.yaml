lexical_decisions:
- source_word: ἀφέντες
  choice: оставив
  rationale: Деепричастие естественно передаёт предшествующее действие и не уточняет без необходимости, просто ли ученики покинули народ или отпустили его.
- source_word: τὸν ὄχλον
  choice: народ
  rationale: В евангельском повествовании «народ» — естественное современное обозначение собравшейся толпы без архаического оттенка слова «множество».
- source_word: παραλαμβάνουσιν αὐτόν
  choice: они взяли Его с собой
  rationale: «Взять с собой» передаёт значение παραλαμβάνω — взять кого-либо вместе с собой; прошедшее время обеспечивает естественное русское повествование.
- source_word: ὡς ἦν
  choice: таким, как Он был
  rationale: Формулировка сохраняет возможный акцент на том, что Иисуса взяли без дополнительных приготовлений, не конкретизируя Его состояние.
- source_word: ἐν τῷ πλοίῳ
  choice: в лодке
  rationale: Для судна на Галилейском море современное «лодка» уместнее, чем «корабль»; расположение оборота следует греческой последовательности и допускает связь с предшествующими словами.
- source_word: ἄλλα πλοῖα
  choice: другие лодки
  rationale: Перевод не добавляет отсутствующего в греческом тексте определения «маленькие».
- source_word: ἦν μετ’ αὐτοῦ
  choice: с Ним были
  rationale: Передаёт простое и несколько сдержанное указание на то, что другие лодки сопровождали Иисуса; русское множественное число согласовано по смыслу.
theological_decisions:
- issue: Связь выражения ὡς ἦν ἐν τῷ πλοίῳ
  choice: «таким, как Он был, в лодке» с пояснением в сноске
  alternative: «взяли Его с собой прямо в той лодке, где Он находился»
  rationale: Греческая конструкция допускает акцент либо на том, что Иисус уже находился в лодке, либо на том, что Его взяли без дальнейших приготовлений. Основной текст сохраняет необычную структуру, а сноска открыто отмечает неоднозначность, не превращая её в богословский вывод.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Местоимение, относящееся к Иисусу, написано с прописной буквы согласно принятой русской библейской традиции. Необычная компактность греческой конструкции умеренно сохранена, а её подлинная неоднозначность вынесена в сноску.
