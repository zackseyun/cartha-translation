  text: Оставив народ, они взяли Его с собой, как Он был в лодке[a]. С Ним были и другие лодки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взяли Его с собой таким, как Он был». Греческий оборот может подчёркивать, что Иисус уже находился в лодке, или что Его взяли без дополнительных приготовлений.'
