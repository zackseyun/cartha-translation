  text: Слушайте! Вот, сеятель вышел сеять.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Слушайте!
  rationale: Настоящее повелительное наклонение, второе лицо множественного числа, служит призывом ко вниманию. «Слушайте!» естественно для современного русского языка и сохраняет силу команды.
- source_word: ἰδού
  choice: Вот,
  rationale: Частица привлекает внимание к последующему образу. «Вот» сохраняет указательную и повествовательно-выделительную функцию без архаичного оттенка слова «се».
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Аорист действительного залога обозначает движение наружу; в данном контексте естественное соответствие — «вышел».
- source_word: ὁ σπείρων
  choice: сеятель
  rationale: Субстантивированное причастие с артиклем обозначает человека по его занятию в рассказе. «Сеятель» кратко, ясно и идиоматично передаёт эту роль.
- source_word: σπεῖραι
  choice: сеять
  rationale: Аористный инфинитив выражает цель выхода. Русская конструкция «вышел сеять» прямо и естественно передаёт этот смысл.
