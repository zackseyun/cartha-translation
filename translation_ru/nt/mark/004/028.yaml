  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: ru
  text: 'Земля сама приносит урожай: сначала зелёный побег, потом колос, а затем — полное зерно в колосе.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: сама
  rationale: Согласуется с «земля» и естественно передаёт отсутствие видимого участия человека, не внося механического оттенка слова «автоматически».
- source_word: γῆ
  choice: земля
  rationale: В земледельческом контексте обозначает почву; «земля» звучит естественно и сохраняет привычный библейский образ.
- source_word: καρποφορεῖ
  choice: приносит урожай
  rationale: В данном земледельческом контексте речь идёт о производстве зернового урожая; такой перевод понятнее буквального «плодоносит» применительно к хлебному злаку.
- source_word: πρῶτον χόρτον
  choice: сначала зелёный побег
  rationale: χόρτος здесь обозначает первую зелёную поросль зернового растения. «Зелёный побег» ясно передаёт начальную стадию, не называя её преждевременно стеблем.
- source_word: εἶτα
  choice: потом / а затем
  rationale: Передаёт последовательную смену стадий; небольшое стилистическое варьирование естественно для современного русского языка.
- source_word: στάχυν
  choice: колос
  rationale: Точное и общеупотребительное русское обозначение колоса зернового растения.
- source_word: πλήρης σῖτον
  choice: полное зерно
  rationale: Сохраняет необычное сочетание исходного текста и не добавляет прямо не выраженного значения «созревшее». Прилагательное πλήρης грамматически согласовано с σῖτον.
- source_word: ἐν τῷ στάχυϊ
  choice: в колосе
  rationale: Буквально и ясно указывает местонахождение зерна, последовательно передавая στάχυς словом «колос».
theological_decisions: []
