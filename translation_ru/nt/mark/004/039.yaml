  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: ru
  text: 'И, пробудившись[a], Он запретил ветру и сказал морю: «Замолчи! Уймись![b]» И ветер утих, и наступило великое затишье.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «когда Его разбудили». Греческая форма сама по себе не требует уточнять, пробудился ли Он сам или был разбужен.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Буквально второе повеление означает: «будь заграждено, как намордником»; это образ принудительного умолкания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: пробудившись
  rationale: Аористное причастие передаёт действие, предшествующее повелению. Возвратная форма естественна по-русски и не уточняет без необходимости, проснулся ли Иисус сам или был разбужен учениками.
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: Глагол обозначает властный упрёк или строгое повеление. «Запретил» сохраняет характерный для евангельского повествования язык властного приказа и естественно сочетается с ветром.
- source_word: τῷ ἀνέμῳ
  choice: ветру
  rationale: В греческом тексте прямо назван ветер, а не буря вообще.
- source_word: τῇ θαλάσσῃ
  choice: морю
  rationale: Буквальное значение θάλασσα — «море». Оно сохранено вместо географически поясняющего «озеро», чтобы не сужать образность исходного текста.
- source_word: Σιώπα
  choice: Замолчи!
  rationale: Прямое и сильное повеление немедленно прекратить шум; в обращении к морю по-русски звучит естественно и передаёт олицетворение.
- source_word: πεφίμωσο
  choice: Уймись!
  rationale: Греческая форма буквально связана с надеванием намордника и выражает требование быть заставленным замолчать. «Уймись!» естественно передаёт прекращение неистовства моря, а буквальный образ отмечен в сноске.
- source_word: ἐκόπασεν
  choice: утих
  rationale: κοπάζω означает стихнуть или прекратиться, особенно о ветре. «Ветер утих» — точное и естественное русское сочетание.
- source_word: ἐγένετο
  choice: наступило
  rationale: В данном контексте глагол вводит возникшее вследствие повеления состояние; «наступило» идиоматично с существительным «затишье».
- source_word: γαλήνη μεγάλη
  choice: великое затишье
  rationale: Сохраняется усилительное μεγάλη и повествовательный контраст с великой бурей; «затишье» передаёт полное успокоение моря и ветра.
theological_decisions:
- issue: Передача резкого образа в повелении πεφίμωσο
  choice: В основном тексте — «Уймись!», с буквальным образом намордника в сноске
  alternative: «Будь взнуздано!» или традиционное «Умолкни!»
  rationale: Буквальная русская конструкция с намордником звучала бы неестественно и могла бы отвлечь читателя, тогда как «Уймись!» сохраняет властность приказа и его действие в контексте. Сноска не скрывает выразительную метафору греческого текста.
- issue: Передача θάλασσα как моря или озера
  choice: море
  alternative: озеро, то есть Галилейское озеро
  rationale: Исходный текст называет водоём морем. Такое обозначение сохраняет лексику и образный масштаб повествования, не добавляя богословского толкования.
- issue: Уточнение того, был ли Иисус разбужен учениками
  choice: 'Не уточнять деятеля в основном тексте: «пробудившись»'
  alternative: «когда Его разбудили»
  rationale: Пассивная форма греческого причастия допускает акцент на пробуждении, но контекст не требует вводить в перевод явно выраженного деятеля. Сноска сохраняет возможное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Формы «запретил», «великое затишье» сохраняют торжественную сжатость Марка, а «Замолчи! Уймись!» звучит непосредственно и властно. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией, без внесения дополнительного толкования.
