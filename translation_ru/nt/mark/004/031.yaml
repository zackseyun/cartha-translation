base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: ru
  text: Оно подобно горчичному зерну[a], которое, когда его сеют в землю, меньше всех семян на земле[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горчичному семени».'
    reason: lexical_alternative
  - marker: b
    text: В греческом употреблена сравнительная степень «меньше», а не превосходная «самое маленькое».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Оно подобно
  rationale: Греческий оборот эллиптичен и зависит от вопроса предыдущего стиха о Царстве Божьем; местоимение «оно» естественно восполняет подразумеваемое подлежащее и сохраняет сравнение.
- source_word: κόκκῳ σινάπεως
  choice: горчичному зерну
  rationale: κόκκος допускает значения «зерно» и «семя»; устойчивое современное русское выражение «горчичное зерно» естественно передаёт образ.
- source_word: ὅταν σπαρῇ
  choice: когда его сеют
  rationale: ὅταν с аористом сослагательного наклонения имеет обобщённо-временное значение; настоящее время в русском естественно выражает обычное действие.
- source_word: ἐπὶ τῆς γῆς
  choice: в землю
  rationale: В контексте сева γῆ означает почву, а русское «сеять в землю» звучит естественно, хотя греческий предлог буквально допускает «на землю».
- source_word: μικρότερον ὂν
  choice: меньше
  rationale: Сохранена сравнительная степень μικρότερον, а причастная конструкция передана личной формой ради ясного и естественного русского синтаксиса.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: всех семян на земле
  rationale: Переданы сравнительный генитив и повторное уточнение «на земле» без ботанического переуточнения.
theological_decisions:
- issue: Сравнительная или превосходная степень в описании горчичного зерна
  choice: меньше всех семян
  alternative: самое маленькое из всех семян
  rationale: В греческом стоит сравнительная форма μικρότερον, а не явная превосходная степень. Русское «меньше всех» сохраняет форму и напряжение исходного текста, не устраняя параболическую гиперболу.
translation_notes:
  register: Современный литературный русский язык с dignified, но общедоступным библейским регистром. Тире в конце сохраняет незавершённость предложения, продолжающегося в следующем стихе.
