  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: ru
  text: А когда его посеют, оно всходит и становится крупнее всех огородных растений и пускает большие ветви, так что птицы небесные[a] могут гнездиться[b] под его тенью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «птицы неба»; традиционно: «птицы воздушные».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обитать» или «селиться». Этот образ может перекликаться с ветхозаветными образами птиц, находящих приют в большом дереве (например, Иез 17:23; Дан 4:12).'
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: его посеют
  rationale: Аорист пассивного сослагательного наклонения после ὅταν выражает неопределённо-повторяющееся временное условие. Русское «когда его посеют» естественно передаёт эту конструкцию и сохраняет образ сеяния.
- source_word: ἀναβαίνει
  choice: всходит
  rationale: В земледельческом контексте глагол обозначает появление растения из земли; «всходит» — точный и естественный русский эквивалент.
- source_word: γίνεται
  choice: становится
  rationale: Глагол указывает на достигнутое состояние в процессе роста, не сводя смысл к простому «бывает».
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: больше всех огородных растений
  rationale: 'λάχανα здесь — выращиваемые в огороде травянистые растения, а не только овощи в современном узком смысле. Сравнительная конструкция передана прямо: «больше всех».'
- source_word: ποιεῖ κλάδους μεγάλους
  choice: пускает большие ветви
  rationale: Русское «пускает ветви» идиоматично передаёт появление ветвей у растущего растения и звучит естественнее буквального «делает ветви».
- source_word: ὥστε δύνασθαι
  choice: так что ... могут
  rationale: Конструкция ὥστε с инфинитивом выражает результат; «так что ... могут» сохраняет этот смысл в естественной русской форме.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: под его тенью
  rationale: «Под его тенью» точно и привычно передаёт образ укрытия, создаваемого растением.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: птицы небесные
  rationale: Выражение близко следует греческому обороту и сохраняет возможное библейское созвучие, оставаясь понятным современному читателю.
- source_word: κατασκηνοῦν
  choice: гнездиться
  rationale: В применении к птицам «гнездиться» естественно передаёт пребывание и устройство под укрытием ветвей; более широкое значение глагола отмечено в сноске.
theological_decisions:
- issue: Возможная отсылка к ветхозаветному образу птиц, находящих приют в большом дереве
  choice: Сохранить образ в основном тексте без его истолкования
  alternative: Передать κατασκηνοῦν более буквально как «обитать», усилив словесное сходство с образами Иез 17:23 и Дан 4:12
  rationale: Греческий текст допускает межтекстовую связь, но не истолковывает её прямо. Перевод сохраняет образ и возможное богословское напряжение, не вводя в стих выводов, которых он сам явно не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «птицы небесные». Синтаксис сохраняет последовательное развитие образа, но избегает неестественного буквализма.
