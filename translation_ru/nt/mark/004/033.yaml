  naturalness: Исходное «возвещал им слово» возможно в традиционном библейском регистре, но звучит более конфессионально и семантически уже, чем требуется. Предлагаемая фраза сохраняет литературное библейское звучание, оставаясь понятной современному читателю.
  terminology: «Притчи» — устоявшийся точный эквивалент παραβολαί. «Слово» сохраняет широту и марковский оттенок τὸν λόγον; варианты «весть» и «учение» обоснованно оставлены в примечании. Строчная буква в «он» допустима в нейтральной современной редакционной норме.
