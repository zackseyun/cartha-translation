  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: ru
  text: И многими подобными притчами он обращался к ним со словом[a] — в той мере, в какой они могли его слушать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестью»; или: «учением».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «столько, сколько они могли слушать»; или: «насколько они могли слушать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις παραβολαῖς πολλαῖς
  choice: многими подобными притчами
  rationale: Творительный падеж передаёт средство, которым Иисус пользовался в наставлении; «подобными» отсылает к притчам, приведённым выше, а «многими» сохраняет количественную характеристику.
- source_word: ἐλάλει
  choice: возвещал
  rationale: Имперфект указывает на продолжительное или повторявшееся действие. «Возвещал» естественно сочетается со «словом» и соответствует контексту публичного наставления, не сводя действие лишь к единичному высказыванию.
- source_word: τὸν λόγον
  choice: слово
  rationale: «Слово» сохраняет греческую формулировку и характерный для Марка библейский оборот; в данном контексте оно обозначает содержание возвещения или учения.
- source_word: καθὼς ἠδύναντο ἀκούειν
  choice: в той мере, в какой они могли его слышать
  rationale: Оборот передаёт соразмерность наставления способности слушателей. Глагол «слышать» сохраняет прямое значение ἀκούειν и не подменяет его более истолковывающим «понимать»; местоимение «его» относится к слову.
theological_decisions:
- issue: Значение τὸν λόγον в служении Иисуса
  choice: слово
  alternative: весть; учение
  rationale: Основной текст сохраняет широкую и богословски значимую формулировку оригинала, не сужая её до одного аспекта — вести или учения.
- issue: Смысл ἀκούειν
  choice: слышать
  alternative: понимать; воспринимать
  rationale: Хотя в контексте слышание может предполагать восприятие и понимание, оригинал прямо говорит о способности слышать. Перевод сохраняет эту смысловую напряжённость.
- issue: Характер соразмерности в καθὼς
  choice: в той мере, в какой
  alternative: как; столько, сколько
  rationale: Такая передача ясно выражает соответствие между способом или объёмом наставления и способностью слушателей, не утверждая точнее, чем оригинал, шла ли речь только об объёме.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка остаётся доступной, а поясняющие примечания сохраняют допустимые смысловые варианты. Местоимение «он» написано со строчной буквы согласно нейтральной современной издательской практике.
