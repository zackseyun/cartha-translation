    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передан несовершенным видом, который сохраняет оттенок продолжающейся или повторяющейся речи, не сводя его к однократному «сказал».
- source_word: Οὕτως … ὡς
  choice: — как если
  rationale: Эта конструкция вводит сжатое сравнение, продолжающееся в следующем стихе. Русское «как если» сохраняет его открытый, условно-сравнительный характер.
- source_word: βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся и понятное современному читателю выражение, способное обозначать как царственное владычество Бога, так и Его царство; намеренно не сужено до одного из этих значений.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В русском языке «человек» естественно передаёт типического участника притчи; грамматический мужской род сохраняется в последующем глаголе.
- source_word: βάλῃ
  choice: бросит
  rationale: Сохраняется конкретный образ глагола βάλλω («бросать»), который в земледельческом контексте описывает разбрасывание семени при посеве.
- source_word: τὸν σπόρον
  choice: семя
  rationale: В данном контексте существительное употреблено собирательно; русский язык естественно выражает такое значение формой единственного числа без обязательного артиклевого соответствия.
- source_word: ἐπὶ τῆς γῆς
  choice: на землю
  rationale: В земледельческом контексте γῆ означает землю или почву, а ἐπί указывает на поверхность; «на землю» точно и естественно передаёт образ.
theological_decisions:
- issue: Царство как область или Божье царствование
  choice: Царство Божье
  alternative: царствование Бога
  rationale: Греческое βασιλεία допускает оба смысловых оттенка. Традиционное русское выражение сохраняет эту многозначность, тогда как «царствование» заранее выбирало бы только динамический смысл.
- issue: Незавершённость сравнения в границах стиха
  choice: Сохранить открытую конструкцию «— как если…,» с продолжением в следующем стихе
  alternative: Завершить мысль формулой «подобно человеку, который посеял семя»
  rationale: Греческий синтаксис сжат и смысловое сравнение продолжается в стихе 27. Его не следует преждевременно завершать или пояснять добавленными словами.
translation_notes:
  register: Современный литературный русский с достоинством евангельского повествования. Несовершенный вид «говорил» сохраняет повествовательный аспект; тире и конечная запятая подчёркивают, что сравнение продолжается в следующем стихе.
