  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: ru
  text: 'А посеянные на доброй почве — это те, кто слышит слово, принимает его[a] и приносит плод: один — в тридцать, другой — в шестьдесят, а иной — во сто крат.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принимает его с готовностью»; также возможно: «радушно принимает его».'
    reason: Лексический диапазон παραδέχονται включает благосклонное принятие и радушный приём.
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: те
  rationale: Указательное местоимение отсылает к последней из описанных групп и естественно передаётся по-русски словом «те».
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: посеянные на доброй почве
  rationale: Сохранены страдательная конструкция и земледельческий образ; «почва» естественно передаёт γῆ в контексте притчи.
- source_word: ἀκούουσιν τὸν λόγον
  choice: слышит слово
  rationale: «Слово» сохраняет повторяющийся термин притчи и не сужает его значение до пояснительного «весть».
- source_word: παραδέχονται
  choice: принимает его
  rationale: Глагол означает благосклонно принять или признать; местоимение «его» ясно отсылает к слову.
- source_word: καρποφοροῦσιν
  choice: приносит плод
  rationale: Сохранена земледельческая метафора без истолковывающего расширения.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: один — в тридцать, другой — в шестьдесят, а иной — во сто крат
  rationale: Форма «во сто крат» естественна по-русски; распределительные слова передают повторяющееся ἓν и показывают различную урожайность без изменения смысла.
theological_decisions:
- issue: Характер отклика на слово у доброй почвы
  choice: 'Передана последовательность: слышат, принимают и приносят плод.'
  alternative: Уточнить, что речь непременно идёт об окончательной стойкости, либо только о первоначальном отклике.
  rationale: Греческий текст описывает положительное принятие слова и плодоношение, но не формулирует более широкого учения о стойкости или отпадении.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и земледельческой образности. Единственное число в придаточной части согласовано с собирательно понимаемой группой «те, кто»; распределительная концовка делает естественным русский синтаксис и передаёт различную меру урожая.
