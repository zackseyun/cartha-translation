  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: ru
  text: 'И Он говорил им: «Будьте внимательны к тому, что слышите. Какой мерой вы мерите, такой мерой будет отмерено вам, и ещё будет вам добавлено[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст не уточняет, что именно будет добавлено. В данном контексте это может относиться к более глубокому пониманию учения Иисуса.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающуюся или повторявшуюся речь; русское «говорил» естественно сохраняет этот повествовательный аспект.
- source_word: Βλέπετε
  choice: Будьте внимательны
  rationale: В данном употреблении глагол имеет значение предостережения и призыва внимательно отнестись к услышанному, а не буквального зрительного восприятия.
- source_word: τί ἀκούετε
  choice: к тому, что слышите
  rationale: τί означает «что», поэтому формулировка сохраняет отличие Марка от «как вы слушаете» в Лк. 8:18 и не гармонизирует тексты.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Какой мерой вы мерите
  rationale: Русская соотносительная конструкция естественно передаёт меру как средство или норму измерения и сохраняет намеренный повтор корня.
- source_word: μετρηθήσεται ὑμῖν
  choice: такой будет отмерено вам
  rationale: Сохранены будущая форма, пассивный залог и принцип ответной меры без добавления отсутствующего в греческом слова «назад».
- source_word: προστεθήσεται ὑμῖν
  choice: ещё будет вам добавлено
  rationale: Глагол означает добавление или увеличение. «Ещё» естественно выражает прибавление, но перевод не называет, что именно будет добавлено.
theological_decisions:
- issue: Смысл изречения об ответной мере
  choice: Сохранён широкий образ ответной меры в контексте внимательного принятия учения Иисуса.
  alternative: Ограничить смысл судом, щедростью либо исключительно ростом духовного понимания.
  rationale: Ближайший контекст связан со слушанием, однако сама метафора допускает более широкий смысл; перевод не навязывает узкого догматического толкования.
- issue: Что именно будет добавлено
  choice: Дополнение оставлено без названного объекта, как в греческом тексте.
  alternative: 'Уточнить: «вам прибавится понимания».'
  rationale: Контекст допускает мысль о возрастающем понимании, но прямое дополнение в исходном тексте отсутствует, поэтому неоднозначность следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повтор «мерой — мерите — отмерено» сохранён как значимый образ исходного текста; синтаксис сделан понятным для обычного современного читателя.
