    issue: Грамматическая несогласованность в конструкции «Какой мерой вы мерите, такой будет отмерено вам».
    rationale: «Такой» не согласуется с существительным «мера» и в данной позиции не образует ясной русской корреляции. Повтор «мерой» во второй части устраняет дефект без смыслового добавления.
