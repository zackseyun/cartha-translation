revisions:
- from: 'И Он говорил им: «Будьте внимательны к тому, что слышите. Какой мерой вы мерите, такой будет отмерено вам, и ещё будет вам добавлено[a]».'
  to: 'И Он говорил им: «Будьте внимательны к тому, что слышите. Какой мерой вы мерите, такой мерой будет отмерено вам, и ещё будет вам добавлено[a]».'
  rationale: 'Внесена только безопасная языковая правка во вторую часть изречения: «такой мерой» восстанавливает грамматическую соотнесённость с «какой мерой» и сохраняет метафору, будущее время, страдательную форму и отсутствие уточнения «назад». Сноска остаётся привязанной к неопределённому «будет добавлено» и не превращает возможное контекстуальное понимание в основной текст.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:08:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Перевод точно передаёт ἔλεγεν как повествовательный имперфект («говорил»), Βλέπετε τί ἀκούετε как призыв внимательно относиться к содержанию слышимого, а не к способу слушания, и сохраняет неопределённость дополнения при προστεθήσεται ὑμῖν. Образ меры и будущая страдательная конструкция в целом сохранены. Однако сочетание «Какой мерой вы мерите, такой будет отмерено вам» грамматически и стилистически неудачно: указательное «такой» не согласовано с подразумеваемой «мерой», а краткое страдательное «отмерено» требует более ясной конструкции.'
  naturalness: «Будьте внимательны к тому, что слышите» — естественная современная литературная формулировка. Исправление на «такой мерой будет отмерено вам» делает вторую фразу грамматически цельной, сохраняя намеренный повтор образа меры. Порядок слов «будет отмерено вам» допустим в сдержанном библейском регистре.
  terminology: Термины и имена проблем не вызывают. «Мера», «мерите», «отмерено», «добавлено» последовательно воспроизводят метафору греческого μέτρον / μετρεῖν / μετρηθήσεται / προστεθήσεται. «Ещё» передаёт прибавление, не называя того, что добавляется.
  issues:
