  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: ru
  text: 'И Он говорил[a]: «У кого есть уши, чтобы слышать, пусть слышит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И Он продолжал говорить».'
    reason: 'Передача имперфекта ἔλεγεν: форма может подчёркивать продолженность речи, однако более развёрнутый вариант в основном тексте был бы излишне тяжеловесным.'
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз, не добавляя временного оттенка.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающееся или фоновое действие; русское «говорил» естественно сохраняет аспект, не настаивая на многократности.
- source_word: Ὃς ἔχει
  choice: У кого есть
  rationale: Естественная современная русская передача обобщённой относительной конструкции; она сохраняет единственное число и не ограничивает высказывание мужчинами.
- source_word: ὦτα
  choice: уши
  rationale: Буквальная и идиоматичная передача формы множественного числа.
- source_word: ἀκούειν
  choice: чтобы слышать
  rationale: Передаёт назначение и сохраняет лексический повтор со следующим ἀκουέτω.
- source_word: ἀκουέτω
  choice: пусть слышит
  rationale: Точно передаёт повелительное наклонение третьего лица и риторическое повторение глагола «слышать».
theological_decisions:
- issue: Обобщённая конструкция мужского рода в изречении
  choice: «У кого есть… пусть слышит»
  alternative: «Кто имеет… тот да слышит»
  rationale: Греческая форма мужского рода имеет обобщённое значение. Выбранная формулировка естественна для современного русского языка, сохраняет единственное число и не создаёт впечатления, будто речь относится только к мужчинам.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и пословичным звучанием. Местоимение «Он» добавлено как требуемое русским синтаксисом явное подлежащее и относится к Иисусу; прописная буква соответствует принятому благоговейному библейскому регистру.
