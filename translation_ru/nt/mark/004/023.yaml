  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: ru
  text: Если у кого есть уши, чтобы слышать, пусть слышит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: Если у кого
  rationale: Сохраняет условную форму греческого выражения и его обобщённый смысл; по-русски это звучит естественнее, чем буквальное «если кто-нибудь имеет».
- source_word: ἔχει ὦτα
  choice: есть уши
  rationale: Естественная русская конструкция обладания сохраняет буквальный образ греческого текста.
- source_word: ἀκούειν
  choice: чтобы слышать
  rationale: Передаёт значение цели или способности и сохраняет связь с повторным употреблением того же глагола.
- source_word: ἀκουέτω
  choice: пусть слышит
  rationale: Точно передаёт повелительное наклонение третьего лица единственного числа и сохраняет повтор глагола «слышать», включая смысл внимательного, восприимчивого слушания.
theological_decisions:
- issue: Обобщённое единственное число в призыве
  choice: пусть слышит
  alternative: пусть слушают
  rationale: Греческий текст использует неопределённое местоимение и повелительное наклонение в единственном числе. Русская конструкция «если у кого… пусть слышит» естественно сохраняет обобщённое единственное число без указания на пол.
translation_notes:
  register: Краткое, выразительное изречение передано современным литературным русским языком. Сохранены условная форма, образ ушей и повтор глагола «слышать».
