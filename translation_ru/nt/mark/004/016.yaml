lexical_decisions:
- source_word: ὁμοίως
  choice: подобным образом
  rationale: Передаёт наречие и сохраняет смысловую связь с предшествующим объяснением притчи.
- source_word: ἐπὶ τὰ πετρώδη
  choice: на каменистой почве
  rationale: Естественно передаёт место посева, отличающееся каменистым грунтом, и сохраняет земледельческий образ.
- source_word: σπειρόμενοι
  choice: посеянные
  rationale: Причастие сохраняет намеренно образное отождествление людей с посеянным в объяснении притчи.
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняет повторяющуюся лексику притчи и библейскую выразительность, не устраняя контекстуальный смысл провозглашаемой вести.
- source_word: εὐθύς
  choice: тотчас
  rationale: Краткое литературное соответствие, сохраняющее характерную для Марка непосредственность действия.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямо и естественно передаёт обстоятельство образа действия.
- source_word: λαμβάνουσιν αὐτόν
  choice: принимают его
  rationale: Передаёт принятие услышанного слова, не приписывая этому принятию устойчивости, о которой стих сам по себе не говорит.
theological_decisions:
- issue: Кого обозначают «посеянные» в объяснении притчи
  choice: Сохранить образное выражение «посеянные на каменистой почве»
  alternative: Разъяснить как «люди, чьи сердца подобны каменистой почве»
  rationale: Греческий текст сохраняет образ сеяния и одновременно относит его к людям; поясняющий пересказ добавил бы отсутствующее в тексте упоминание сердца.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка перестроен ради ясности: именная часть «это те» следует после образного обозначения. Запятая в конце сохранена, поскольку предоставленный стих продолжается в следующем стихе.'
