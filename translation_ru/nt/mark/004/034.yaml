  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: ru
  text: Без притчи Он им не говорил, а Своим ученикам наедине объяснял всё.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истолковывал всё». Глагол может означать «объяснять», «истолковывать», «разъяснять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ παραβολῆς
  choice: Без притчи
  rationale: Передаёт прямое значение «без / вне притчи» и сохраняет конкретное единственное число греческого текста.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: Он им не говорил
  rationale: Естественная русская передача имперфекта в обобщающем описании повторявшегося способа речи; длительно-обычный оттенок выражается контекстом.
- source_word: κατ’ ἰδίαν
  choice: наедине
  rationale: Кратко и естественно передаёт противопоставление публичной речи частному объяснению.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: Своим ученикам
  rationale: 'Возвратно-притяжательное «Своим» естественно по-русски сохраняет акцент ἰδίοις: речь именно о Его собственных учениках.'
- source_word: ἐπέλυεν
  choice: объяснял
  rationale: Доступно передаёт значение «объяснять, истолковывать» и сохраняет несовершенный, повторяющийся характер действия.
- source_word: πάντα
  choice: всё
  rationale: Сохраняет неограниченную формулировку оригинала, не сводя её в самом переводе только к притчам или сказанному ранее.
theological_decisions:
- issue: Объём того, что Иисус объяснял ученикам
  choice: «всё» без уточняющего дополнения
  alternative: «все притчи» или «всё сказанное»
  rationale: Греческий текст содержит только πάντα. Контекст допускает более узкое понимание, но перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Заглавные местоименные формы «Он», «Своим» применены как традиционная русская издательская норма при отсылке к Иисусу. Акцент ἰδίοις передан в основном тексте словом «Своим», поэтому отдельная сноска для него не требуется.
