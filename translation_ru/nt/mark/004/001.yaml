source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: ru
  text: И снова Он начал учить у моря. К Нему собирается[a] огромная толпа, так что Он вошёл в лодку и сел в ней на воде[b], а вся толпа была на суше у моря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собралось»; Марк часто употребляет настоящее время для живого рассказа о прошлых событиях.'
    reason: lexical_alternative
  - marker: b
    text: То есть Иисус сидел в лодке на воде, а толпа оставалась на суше.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Естественно и кратко передаёт повторение действия.
- source_word: ἤρξατο διδάσκειν
  choice: начал учить
  rationale: Сохраняет начинательное значение конструкции и звучит естественно по-русски.
- source_word: παρὰ τὴν θάλασσαν
  choice: у моря
  rationale: Передаёт местоположение рядом с морем; сохраняется слово «море», как в греческом тексте.
- source_word: συνάγεται
  choice: собирается
  rationale: Сохраняет характерное для Марка историческое настоящее и живость повествования.
- source_word: ὄχλος πλεῖστος
  choice: великое множество людей
  rationale: Передаёт усилительную силу πλεῖστος естественным литературным русским языком.
- source_word: πρὸς αὐτόν
  choice: к Нему
  rationale: Точно выражает движение людей к Иисусу.
- source_word: ὥστε
  choice: так что
  rationale: Естественно вводит следствие огромного стечения людей.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: Он вошёл в лодку
  rationale: Ясно передаёт предшествующее посадке действие причастия, не перегружая русскую фразу деепричастным оборотом.
- source_word: καθῆσθαι ἐν τῇ θαλάσσῃ
  choice: сел в ней на воде
  rationale: 'Устраняет невозможное буквальное впечатление, будто Иисус сел непосредственно на море, при этом сохраняет пространственный смысл: Он находился в лодке на воде.'
- source_word: πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: весь народ оставался на берегу у самого моря
  rationale: Естественно передаёт противопоставление Иисуса в лодке на воде и людей на суше возле воды.
