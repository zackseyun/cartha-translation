  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: ru
  text: 'А другие — это посеянные среди терний[a]: они слышали слово[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посеянные в тернии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: другие
  rationale: Субстантивированное прилагательное обозначает другую группу в противопоставлении уже названным; «другие» естественно передаёт это по-русски.
- source_word: εἰς τὰς ἀκάνθας
  choice: среди терний
  rationale: Хотя εἰς обычно указывает движение «в», здесь речь идёт о семени, оказавшемся среди колючих растений; «среди терний» естественно для русского языка и сохраняет образ.
- source_word: ἀκάνθας
  choice: терний
  rationale: Традиционное и ёмкое русское обозначение колючих сорных растений в контексте притчи; сохраняет достоинство библейского стиля.
- source_word: σπειρόμενοι
  choice: посеянные
  rationale: Пассивное причастие сохраняет прямое отождествление людей с посеянным семенем, не разъясняя метафору сверх текста.
- source_word: οὗτοί εἰσιν
  choice: они
  rationale: После уже введённого оборота «другие — это…» местоименное возобновление «они» звучит по-русски естественно и передаёт греческую указательную конструкцию без тяжеловесного повтора.
- source_word: οἱ ... ἀκούσαντες
  choice: слышали
  rationale: Аористное причастие обозначает совершившееся слушание; личная форма естественна в русском придаточно-координированном построении и не предрешает, было ли услышанное принято.
- source_word: τὸν λόγον
  choice: слово
  rationale: «Слово» сохраняет устойчивый библейский образ и связь с формулировками этой притчи; «весть» остаётся допустимым смысловым вариантом.
theological_decisions:
- issue: Метафорическое отождествление людей с семенем
  choice: 'Сохранить буквальный образ: «посеянные среди терний»'
  alternative: «те, у кого семя посеяно среди терний»
  rationale: Греческий текст прямо называет людей посеянными, продолжая метафору семени. Перевод сохраняет литературное напряжение образа и не добавляет толкования.
- issue: Характер слушания слова
  choice: «слышали слово»
  alternative: «услышали слово»
  rationale: Форма «слышали» не приписывает слушателям результативного восприятия или принятия слова, которого сам стих явно не утверждает; завершённость действия определяется контекстом следующих слов.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. «Тернии» сохраняет узнаваемость образа, а синтаксис остаётся ясным для обычного читателя. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
