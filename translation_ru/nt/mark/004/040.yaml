lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз, связывающий слова Иисуса с предшествующим эпизодом.
- source_word: εἶπεν αὐτοῖς
  choice: Он сказал им
  rationale: Естественная передача обычной повествовательной формулы, вводящей прямую речь.
- source_word: Τί
  choice: Почему
  rationale: 'В сочетании с именной частью сказуемого вопросительное τί имеет обстоятельственное значение причины: «почему?».'
- source_word: δειλοί ἐστε
  choice: вы так боязливы
  rationale: Передаёт страх учеников и отрицательный оттенок δειλός, не усиливая его до однозначного обвинения в трусости; «так» естественно оформляет по-русски вопрос-упрёк.
- source_word: οὔπω
  choice: всё ещё нет
  rationale: В вопросе такая формулировка естественно передаёт временной и риторический смысл «до сих пор не / ещё не».
- source_word: ἔχετε
  choice: у вас ... нет
  rationale: Русская конструкция обладания с «у вас» естественно передаёт греческое ἔχετε в отрицательном вопросе.
- source_word: πίστιν
  choice: веры
  rationale: «Вера» — прямая и богословски нейтральная передача πίστις; в данном контексте слово также подразумевает доверие Иисусу.
theological_decisions:
- issue: Передача πίστις в контексте опасности и доверия Иисусу
  choice: вера
  alternative: доверие
  rationale: Основной текст сохраняет широкий смысл греческого существительного и привычную библейскую терминологию, а контекстуально уместное «доверие» отмечено в сноске без сужения смысла.
- issue: Сила упрёка в слове δειλοί
  choice: боязливы
  alternative: малодушны
  rationale: «Боязливы» сохраняет связь с непосредственным страхом учеников; «малодушны» точнее передаёт возможный более резкий оттенок, но в основном тексте может прозвучать как более общий приговор их характеру.
translation_notes:
  register: Современный литературный русский язык; реплика звучит как краткий и серьёзный упрёк. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой, без добавления имени, отсутствующего в стихе.
