  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: ru
  text: 'И Он сказал им: «Почему вы так боязливы[a]? У вас всё ещё нет веры[b][c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему вы так малодушны?»'
    reason: lexical_alternative
  - marker: b
