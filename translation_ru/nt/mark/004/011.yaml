  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: ru
  text: 'И Он говорил им: «Вам дана тайна Царства Божьего, а тем, кто вне, всё бывает в притчах».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: тайна
  rationale: Передаёт не просто нечто непонятное, а прежде сокрытый Божий замысел, который открывается тем, кому он дан.
- source_word: δέδοται
  choice: дана
  rationale: Сохраняет перфектную пассивную форму и мысль о дарованном свыше откровении.
- source_word: ἐκείνοις δὲ τοῖς ἔξω
  choice: а для тех, внешних
  rationale: Сохраняет пространственно-групповое обозначение людей, не входящих в круг учеников, не уточняя сверх текста, относительно чего именно они являются внешними.
- source_word: ἐν παραβολαῖς
  choice: в притчах
  rationale: Прямой и устойчивый эквивалент формы множественного числа.
- source_word: τὰ πάντα γίνεται
  choice: всё бывает
  rationale: 'Передаёт динамику γίνεται и сохраняет неоднозначность выражения: всё доходит до внешних или совершается для них в форме притч.'
theological_decisions:
- issue: Природа «тайны» Царства Божьего
  choice: тайна Царства Божьего
  alternative: тайное знание о Царстве Божьем
  rationale: Буквальная конструкция сохраняет богословскую насыщенность μυστήριον и не сводит её к эзотерическому знанию.
- issue: Смысл τὰ πάντα γίνεται ἐν παραβολαῖς
  choice: всё бывает в притчах
  alternative: всё даётся в притчах
  rationale: Выбран вариант, не добавляющий подразумеваемого субъекта дарования и сохраняющий необычную, допускающую несколько оттенков формулировку оригинала.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной формальной близостью к греческому тексту. Сохранена слегка необычная формулировка «всё бывает в притчах», чтобы не устранять подлинную смысловую неоднозначность γίνεται.
