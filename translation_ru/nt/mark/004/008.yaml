  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: ru
  text: Другие зёрна[a] упали на хорошую почву, приносили плод, всходя и разрастаясь, и давали урожай в тридцать, шестьдесят и сто крат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другое упало на хорошую почву»; слово «семя» подразумевается из контекста.'
    reason: 'Лексическая альтернатива: греческое ἄλλα употреблено самостоятельно и буквально не называет зёрна.'
lexical_decisions:
- source_word: ἄλλα
  choice: другие зёрна
  rationale: Субстантивированное прилагательное среднего рода множественного числа отсылает к семени из контекста. В русском «зёрна» делает множественное число явным и позволяет естественно выстроить последующие действия.
- source_word: γῆν τὴν καλήν
  choice: хорошую почву
  rationale: В земледельческом контексте γῆ означает именно почву, пригодную для посева, а не землю как территорию.
- source_word: ἐδίδου καρπὸν
  choice: стали приносить плод
  rationale: Передаёт начало и продолжающийся характер плодоношения, выраженный имперфектом, естественной русской конструкцией.
- source_word: ἀναβαίνοντα
  choice: всходили
  rationale: В контексте посева причастие описывает появление и рост всходов; «всходили» является точным современным земледельческим выражением.
- source_word: αὐξανόμενα
  choice: разрастались
  rationale: Сохраняет отличие от «всходили» и передаёт дальнейшее увеличение и развитие растений.
- source_word: ἔφερεν
  choice: давали урожай
  rationale: Имперфект обозначает продолжающееся принесение плода; «давали урожай» естественно связывается с указанной далее кратностью.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: в тридцать, шестьдесят и сто раз больше посеянного
  rationale: Передаёт подразумеваемое соотношение урожая к посеянному понятным современным русским языком. Повторяющееся ἓν указывает на разные случаи урожайности, но буквальное повторение «одно» по-русски здесь тяжеловесно.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с доступной земледельческой образностью. Синтаксис слегка перестроен ради ясности: действия, грамматически распределённые в греческом между «плодом» и подразумеваемыми зёрнами, представлены как последовательное развитие посева. Сохраняются все три стадии — всход, рост и урожайность.'
