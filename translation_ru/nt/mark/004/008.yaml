  - severity: low
    issue: «в тридцать, шестьдесят и сто раз больше посеянного»
    rationale: Греческое выражение — эллиптическая идиома урожайности. Добавление «больше посеянного» не обязательно и в строгом математическом прочтении «в тридцать раз больше» может означать величину, превышающую исходную в тридцать раз, а не тридцатикратный урожай.
