base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: ru
  text: 'А Он Сам был на корме и спал на подушке[a]. Они разбудили Его и сказали Ему: «Учитель, Тебе всё равно, что мы погибаем?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на изголовье». Греческое слово означает подушку или иную опору для головы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: Сам Он был
  rationale: Явное αὐτός передаёт подчёркнутое противопоставление Иисуса остальным участникам сцены; инверсия сохраняет этот акцент в естественном русском повествовании.
- source_word: ἐν τῇ πρύμνῃ
  choice: на корме
  rationale: πρύμνα обозначает кормовую, заднюю часть судна; «на корме» — точный и общепонятный русский морской термин.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: на подушке
  rationale: προσκεφάλαιον — предмет, служащий опорой для головы, то есть подушка или изголовье. «На подушке» естественно по-русски и не добавляет отсутствующего в тексте уточнения о положении головы.
- source_word: καθεύδων
  choice: спал
  rationale: Причастие описывает продолжающееся состояние Иисуса; личная форма «спал» естественна в русском повествовании.
- source_word: ἐγείρουσιν
  choice: разбудили
  rationale: Историческое настоящее передано прошедшим временем согласно нормам русского повествования; «разбудили» точно выражает пробуждение спящего.
- source_word: λέγουσιν
  choice: сказали
  rationale: Историческое настоящее естественно передано русским прошедшим временем.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и точное соответствие διδάσκαλος без привнесения дополнительных оттенков слова «Господин» или «Наставник».
- source_word: οὐ μέλει σοι
  choice: Неужели Тебе всё равно
  rationale: Русская формулировка естественно передаёт резкий, укоряющий вопрос и смысл отсутствия заботы; частица «неужели» отражает эмоциональную силу, не превращая вопрос в утверждение.
- source_word: ἀπολλύμεθα
  choice: мы погибаем
  rationale: Настоящее время сохраняет ощущение уже разворачивающейся смертельной опасности; «погибаем» точно и естественно передаёт ἀπόλλυμι в данном контексте.
theological_decisions:
- issue: Сила упрёка в вопросе учеников Иисусу
  choice: «Неужели Тебе всё равно, что мы погибаем?»
  alternative: «Разве Тебя не заботит, что мы погибаем?»
  rationale: Греческая конструкция οὐ μέλει σοι звучит резко и обвинительно. Выбранный вариант сохраняет напряжение сцены и не объясняет ни намерения Иисуса, ни духовное состояние учеников.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя. Сохранены повествовательный контраст, срочность опасности и резкость ученического упрёка. Местоимения, относящиеся к Иисусу в прямом обращении и повествовании, написаны с прописной буквы в соответствии с принятой русской библейской издательской традицией.
