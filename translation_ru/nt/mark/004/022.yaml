  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: ru
  text: Ведь нет ничего сокрытого, кроме как для того, чтобы стать явным[a], и ничто не стало утаённым, кроме как для того, чтобы выйти наружу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь нет ничего сокрытого, которое не стало бы явным…» Обороты с ἵνα могут выражать как цель, так и результат.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «прийти в явное», то есть стать открытым, видимым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: сокрытого
  rationale: Передаёт значение скрытого от взгляда или знания и сохраняет возвышенный, но понятный регистр.
- source_word: ἐὰν μὴ ἵνα
  choice: что не стало бы
  rationale: Естественно передаёт исключительную конструкцию, при этом сослагательная форма допускает оттенки предназначения и результата.
- source_word: φανερωθῇ
  choice: стало бы явным
  rationale: 'Сохраняет пассивно-результативный смысл: скрытое становится видимым или известным.'
- source_word: ἀπόκρυφον
  choice: утаено
  rationale: Передаёт состояние сокрытости и позволяет не повторять «сокрытое» в параллельной части.
- source_word: ἐγένετο
  choice: было утаено
  rationale: Естественная русская формулировка состояния, возникшего в прошлом; буквально возможно «стало сокрытым».
- source_word: ἔλθῃ εἰς φανερόν
  choice: выйти наружу
  rationale: Сохраняет образ движения в открытое, явное пространство и звучит естественно по-русски.
- source_word: γάρ
  choice: Ведь
  rationale: Связывает изречение с предшествующим контекстом как пояснение; в современном русском естественнее начального «ибо».
theological_decisions:
- issue: Оттенок цели или результата в двух конструкциях с ἵνα
  choice: В первой части употреблена допускающая оба оттенка конструкция «что не стало бы явным», во второй — целевая «чтобы не выйти наружу».
  alternative: 'Последовательно перевести как цель: «сокрыто лишь для того, чтобы стать явным… утаено лишь для того, чтобы выйти наружу»; либо как результат: «нет сокрытого, которое не станет явным».'
  rationale: В койне ἵνα может выражать как цель, так и ожидаемый результат. Перевод не сводит высказывание исключительно к утверждению о намеренной божественной причинности и сохраняет его напряжение.
translation_notes:
  register: Современный литературный русский; параллелизм двух частей сохранён. «Сокрытого / утаено» различает близкие греческие слова, а «стало бы явным / выйти наружу» сохраняет различие между пассивным раскрытием и образом движения.
