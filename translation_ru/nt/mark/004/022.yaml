  source_fidelity: 'Первая часть черновика передаёт общий итог раскрытия, но конструкция «что не стало бы явным» не выражает повторяющееся в греческом ἵνα («кроме как/лишь для того, чтобы»). Во второй части «чтобы не выйти наружу» из-за отрицания σημαчески переворачивает смысл: греческое ἵνα ἔλθῃ εἰς φανερόν означает выход в явное, а не его предотвращение. «Не стало утаённым» адекватно передаёт ἐγένετο ἀπόκρυφον как вхождение в состояние сокрытости.'
