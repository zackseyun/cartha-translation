  terminology: «Сокрытое / утаённое» допустимо различает κρυπτόν и ἀπόκρυφον, не приписывая им чрезмерно разные значения. «Стать явным» хорошо передаёт φανερωθῇ. Обе целевые конструкции сохраняют спорный оттенок цели/результата, не превращая его в утверждение о конкретном действующем лице.
