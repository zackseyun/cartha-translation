base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: ru
  text: Другое семя упало на каменистую почву[a], где почвы было немного, и сразу взошло, потому что глубина почвы была недостаточной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на каменистое место». Греческое слово описывает каменистый участок, покрытый лишь тонким слоем почвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: другое семя
  rationale: Прилагательное среднего рода единственного числа употреблено самостоятельно и по контексту обозначает семя; существительное «семя» добавлено для естественности и ясности по-русски.
- source_word: πετρῶδες
  choice: каменистое место
  rationale: Слово обозначает каменистый участок, где над камнем лежит лишь неглубокий слой земли; этот вариант передаёт сельскохозяйственный образ, не сводя его к отдельным разбросанным камням.
- source_word: γῆν πολλήν
  choice: мало земли
  rationale: В данном контексте γῆ означает землю как почву для роста. Отрицательная греческая конструкция естественно передана по-русски словами «было мало земли».
- source_word: εὐθὺς
  choice: сразу
  rationale: Передаёт немедленность появления всхода естественным современным русским словом.
- source_word: ἐξανέτειλεν
  choice: взошло
  rationale: В сельскохозяйственном контексте глагол обозначает появление ростка; «взошло» точно и идиоматично сочетается с «семя».
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: потому что слой земли был неглубоким
  rationale: Конструкция с διά выражает причину. Упоминание слоя земли ясно передаёт образ малой глубины почвы над каменистым основанием.
- source_word: ὅπου
  choice: где
  rationale: Прямая и естественная передача местного относительного наречия.
