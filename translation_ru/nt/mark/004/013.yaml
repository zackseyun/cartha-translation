  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: ru
  text: 'И говорит им: «Не понимаете этой притчи? Как же вы поймёте все притчи?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Не знаете этой притчи? И как узнаете все притчи?» В данном контексте греческие глаголы со значением «знать» относятся к пониманию смысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для Марка историческое настоящее и живость повествования.
- source_word: οἴδατε
  choice: понимаете
  rationale: Хотя глагол часто означает «знать», здесь применительно к притче речь идёт о понимании её смысла.
- source_word: παραβολὴν ταύτην
  choice: этой притчи
  rationale: Обычный и точный термин «притча» вместе с указанием на только что рассказанную притчу.
- source_word: καὶ πῶς
  choice: Как же
  rationale: Частица «же» естественно передаёт связь второго вопроса с первым и подчёркивает вытекающий из него вывод.
- source_word: πάσας τὰς παραβολὰς
  choice: все притчи
  rationale: Передаёт множественное число с πᾶς и широкий охват приточного учения Иисуса.
- source_word: γνώσεσθε
  choice: поймёте
  rationale: В данном контексте будущая форма γινώσκω означает постижение смысла притч; русский совершенный вид естественно выражает достижение понимания.
theological_decisions:
- issue: Соотношение οἴδατε и γνώσεσθε
  choice: Оба глагола переданы формами глагола «понимать».
  alternative: Передать один или оба глагола через «знать».
  rationale: Контекст говорит о постижении смысла притч, а не просто об осведомлённости. Единый русский глагол сохраняет параллелизм и риторическую силу, не устраняя лексического различия оригинала без пояснения.
translation_notes:
  register: Современный литературный русский язык; речь естественная и сдержанно торжественная. Историческое настоящее сохранено. Обращение во множественном числе передаёт αὐτοῖς без добавления явного подлежащего.
