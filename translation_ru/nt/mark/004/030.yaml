- source_word: ἐν τίνι παραβολῇ
  choice: Какой притчей
  rationale: 'Творительный падеж естественно передаёт возможное инструментальное значение ἐν с дательным: посредством какой притчи.'
- source_word: αὐτὴν ... θῶμεν
  choice: представить его
  rationale: В данном сочетании τίθημι означает изложить или представить посредством притчи; местоимение согласовано с русским словом «Царство».
