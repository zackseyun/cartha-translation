  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: ru
  text: Сеятель сеет слово[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть». Греческое слово λόγος в зависимости от контекста может означать «слово» или «весть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Сеятель
  rationale: Субстантивированное причастие с артиклем обозначает того, кто сеет. «Сеятель» естественно и кратко передаёт образ притчи, не расширяя его до более общего «земледелец».
- source_word: τὸν λόγον
  choice: слово
  rationale: λόγος может означать «слово» или «весть». В основном тексте сохранено более прямое «слово», которое не уточняет преждевременно содержание возвещения; допустимая контекстуальная альтернатива вынесена в сноску.
- source_word: σπείρει
  choice: сеет
  rationale: Настоящее время выражает общее действие при истолковании притчи. Повтор корня «сеятель — сеет» сохраняет риторическую фигуру греческого текста.
theological_decisions:
- issue: К чему относится «слово» в объяснении притчи
  choice: Оставлено общее «слово» без добавления «Божье» или «Евангелия».
  alternative: весть; Божье слово; Евангелие
  rationale: В греческом тексте стоит только τὸν λόγον. Контекст подразумевает возвещаемую божественную весть, однако уточнение в основном тексте внесло бы отсутствующее в стихе толкование.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет образ и намеренный корневой повтор оригинала.
