  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: ru
  text: 'В тот день, когда настал вечер, Он говорит им: «Переправимся на другую сторону».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для повествования Марка историческое настоящее; в русском рассказе такая форма здесь звучит естественно.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: в тот день
  rationale: Естественная русская передача временного оборота, сохраняющая связь с событиями того же дня.
- source_word: ὀψίας γενομένης
  choice: когда настал вечер
  rationale: Генитив абсолютный имеет временное значение; формулировка передаёт наступление вечера ясно и без излишней буквальности.
- source_word: Διέλθωμεν
  choice: переправимся
  rationale: Побудительный аорист сослагательного наклонения первого лица множественного числа передан естественной русской формой совместного предложения; глагол уместен для пересечения водоёма.
- source_word: εἰς τὸ πέραν
  choice: на другую сторону
  rationale: В контексте речь идёт о противоположном берегу озера; выражение сохраняет краткость оригинала, не добавляя слова «берег».
