  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: ru
  text: А когда взошло солнце, семя было опалено и, не имея корня, засохло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: А когда взошло солнце
  rationale: Сохраняет простой повествовательный союз и временную конструкцию; «взошло солнце» — естественное русское соответствие греческому выражению.
- source_word: ἐκαυματίσθη
  choice: оно было опалено
  rationale: Передаёт пассивную форму и повреждение растения солнечным жаром, не усиливая смысл до полного сгорания.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: не имея корня
  rationale: Естественно выражает причину, заданную διά с артиклевым инфинитивом, и сохраняет единственное число «корень».
- source_word: ἐξηράνθη
  choice: засохло
  rationale: Передаёт становление сухим или увядшим в данном земледельческом контексте; кратко и естественно по-русски.
