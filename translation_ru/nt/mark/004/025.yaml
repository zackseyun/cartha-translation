id: MRK.4.25
reference: Mark 4:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: ru
  text: Ведь тому, кто имеет, будет дано, а у того, кто не имеет, будет отнято даже то, что он имеет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: тому, кто / у того, кто
  rationale: Неопределённо-относительная конструкция имеет обобщающий, афористический смысл; русское «тот, кто» естественно передаёт его, а падежные формы обусловлены синтаксисом.
- source_word: γὰρ
  choice: ведь
  rationale: Частица обосновывает предыдущее высказывание; «ведь» естественно сохраняет пояснительно-причинную связь.
- source_word: ἔχει
  choice: имеет
  rationale: Сохраняет простое и намеренно неуточнённое обозначение обладания, позволяя контексту определить, что именно имеется в виду.
- source_word: δοθήσεται αὐτῷ
  choice: ему будет дано
  rationale: Греческий текст не называет объекта. Русская безлично-пассивная конструкция звучит естественно и позволяет не добавлять подразумеваемое «больше».
- source_word: καὶ
  choice: а
  rationale: В данном антитетическом построении русский противительный союз «а» яснее и естественнее передаёт сопоставление двух частей, оставаясь в пределах смысловой функции καί.
- source_word: οὐκ ἔχει
  choice: не имеет
  rationale: Прямо передаёт отрицание обладания и сохраняет лаконичность изречения.
- source_word: καὶ ὃ ἔχει
  choice: даже то, что он имеет
  rationale: 'Вторая καί имеет усилительное значение в контексте: лишение касается даже уже имеющегося.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: будет отнято у него
  rationale: Передаёт будущее страдательное значение и удаление/лишение, выраженное αἴρω с ἀπό.
theological_decisions:
- issue: Неназванный объект при δοθήσεται
  choice: Сохранить буквально открытое «будет дано», не добавляя «больше».
  alternative: «будет дано больше»
  rationale: Смысл приумножения действительно подразумевается противопоставлением и контекстом, однако русский язык допускает естественную конструкцию без объекта. Это сохраняет подлинную недосказанность греческого текста и не требует пояснения в основном тексте.
- issue: Обобщающее местоимение мужского рода
  choice: 'Передать единственным числом: «тому, кто… у того, кто… он».'
  alternative: 'Множественное число: «тем, кто… у тех, кто…»'
  rationale: Греческие формы стоят в единственном числе и имеют обобщающий смысл. Русское единственное число сохраняет как форму афоризма, так и его универсальное применение.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный и афористичный строй. Порядок частей слегка приспособлен к естественному русскому синтаксису. Неопределённость того, что человек «имеет» и что ему «будет дано», намеренно сохранена.
