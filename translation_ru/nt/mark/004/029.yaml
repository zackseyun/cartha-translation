  source_fidelity: «Но когда урожай созреет» точно передаёт временную конструкцию ὅταν δέ и контекстуальный смысл необычного παραδοῖ с ὁ καρπός в роли субъекта. «Тотчас» соответствует εὐθύς; «пускает в ход серп» естественно выражает образное ἀποστέλλει τὸ δρέπανον как начало жатвы. «Настала жатва» хорошо передаёт результативное настоящее значение παρέστηκεν.
  naturalness: Текст звучит естественно на современном литературном русском, оставаясь выразительным и уместно библейским по регистру. Связка «потому что» ясно выражает причинное ὅτι.
