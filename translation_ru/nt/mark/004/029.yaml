  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: ru
  text: Но когда урожай созреет[a], он тотчас пускает в ход серп, потому что настала жатва.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даст себя собрать». Буквально греческий текст использует необычное активное выражение: урожай «отдаёт себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Но когда
  rationale: Передаёт неопределённо-временное значение ὅταν и лёгкий переход или контраст, выраженный δέ.
- source_word: παραδοῖ ὁ καρπός
  choice: урожай созреет
  rationale: Необычное активное выражение буквально означает, что урожай «отдаёт себя», то есть становится готовым к жатве. «Созреет» естественно передаёт смысл по-русски, а буквальный образ отмечен в сноске.
- source_word: ὁ καρπός
  choice: урожай
  rationale: В контексте серпа и жатвы речь идёт о созревшем урожае; этот вариант естественнее общего «плод» и не сужает значение до конкретной культуры.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Сохраняет характерную для Марка быстроту действия и соответствует достоинству литературного регистра.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: пускает в ход серп
  rationale: Греческое «посылает серп» является ярким оборотом о начале жатвы. Русское выражение сохраняет действие серпа и звучит естественно.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит причину немедленного начала жатвы.
- source_word: παρέστηκεν ὁ θερισμός
  choice: настала жатва
  rationale: Перфект указывает, что жатва уже пришла и теперь налицо; «настала» кратко передаёт наступление и наличный результат.
theological_decisions:
- issue: Готовность урожая в притче о Царстве
  choice: Сохранить земледельческий образ без уточнения его богословского референта
  alternative: Истолковать жатву непосредственно как суд, миссию или завершение века
  rationale: Сам стих не раскрывает однозначно, к чему именно относится жатва. Перевод не должен снимать присущую притче богословскую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык: ясный и достойный. «Тотчас» и «настала жатва» сохраняют библейскую выразительность без архаизации; сноска отмечает необычность греческой формулировки.'
