  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: ru
  text: 'И говорил им: «Разве светильник приходит[a] для того, чтобы его поставили под мерный сосуд[b] или под кровать? Не для того ли, чтобы его поставили на подставку для светильника?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «светильник приходит». Это яркое олицетворение; по смыслу можно также перевести: «Разве светильник приносят…?»'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду сосуд определённой вместимости, служивший мерой для сыпучих продуктов.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолженную или повторяющуюся речь; русское «говорил» естественно сохраняет этот аспект в повествовании.
- source_word: Μήτι
  choice: разве
  rationale: Частица вводит риторический вопрос, предполагающий отрицательный ответ; «разве» естественно передаёт это ожидание по-русски.
- source_word: ἔρχεται ὁ λύχνος
  choice: светильник приходит
  rationale: Сохранён яркий, олицетворённый образ греческого текста. Необычность оборота пояснена сноской, где дан естественный русский вариант.
- source_word: λύχνος
  choice: светильник
  rationale: Речь идёт о переносном масляном светильнике, а не о свете как отвлечённом понятии. «Светильник» точнее и уместнее в данном бытовом образе, чем «свет».
- source_word: μόδιον
  choice: мерный сосуд
  rationale: μόδιος обозначает меру сыпучих тел и сосуд соответствующей вместимости. «Мерный сосуд» сохраняет культурно-бытовой смысл без привязки к поздней русской или английской системе мер.
- source_word: κλίνην
  choice: кровать
  rationale: κλίνη может означать кровать или ложе; «кровать» — ясный и естественный современный эквивалент в домашней сцене.
- source_word: λυχνίαν
  choice: подставка
  rationale: Здесь имеется в виду предназначенная для светильника подставка. В контексте значение понятно, а «подсвечник» мог бы ошибочно вызвать образ свечи.
- source_word: τεθῇ
  choice: его поставили
  rationale: Пассивный аорист сослагательного наклонения передан неопределённо-личной русской конструкцией, которая звучит естественно и сохраняет действие помещения предмета.
- source_word: ἵνα ... τεθῇ
  choice: для того, чтобы его поставили
  rationale: Конструкция ясно сохраняет целевое значение ἵνα в обоих риторических вопросах.
theological_decisions:
- issue: Сохранять ли олицетворение в выражении ἔρχεται ὁ λύχνος или передать его обычным пассивным оборотом
  choice: 'Сохранить активный образ: «светильник приходит»'
  alternative: «Разве светильник приносят…?»
  rationale: Греческое изречение намеренно образно. Буквальная активная формулировка сохраняет его риторическую выразительность, а сноска предупреждает возможное недоумение.
- issue: Как передать определённый артикль в ὁ λύχνος в обобщающем изречении
  choice: 'Передать существительным без указательного уточнения: «светильник»'
  alternative: «этот светильник»
  rationale: В греческом артикль допускает родовое, обобщённое значение. Русское существительное без уточнения естественно выражает общий принцип и не создаёт ложной отсылки к конкретному светильнику.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой, афористичной формы изречения. Необычное олицетворение оригинала оставлено в основном тексте и пояснено; бытовые предметы названы ясно, без архаичных единиц измерения и без образа свечного подсвечника.
