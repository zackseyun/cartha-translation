  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: ru
  text: и не имеют в себе корня, но остаются лишь на время. Потом, когда из-за слова наступает скорбь или гонение, они тотчас отпадают.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спотыкаются» или «соблазняются». Греческий глагол может обозначать преткновение, соблазн или отпадение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: корня в себе
  rationale: Сохраняет земледельческую метафору и возвратный смысл греческого выражения, не добавляя отсутствующих в тексте определений «глубокого» или «крепкого».
- source_word: πρόσκαιροί
  choice: остаются лишь на время
  rationale: Естественно передаёт ограниченную длительность; речь идёт о людях, поэтому буквальное «временны» по-русски звучало бы неестественно.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: когда ... наступают скорбь или гонение
  rationale: Передаёт временное значение генитивной абсолютной конструкции. «Скорбь» сохраняет смысл давления и тяжёлого испытания, а «гонение» — целенаправленного преследования.
- source_word: διὰ τὸν λόγον
  choice: из-за слова
  rationale: Сохраняет повторяющийся в притче термин «слово» и ясно выражает причину скорби или гонения.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для Марка непосредственность; слово современно, кратко и подходит dignified register.
- source_word: σκανδαλίζονται
  choice: отпадают
  rationale: В контексте кратковременного принятия слова и последующего крушения под давлением обозначает отказ от прежнего отклика. В сноске сохранены более образные и неоднозначные варианты.
theological_decisions:
- issue: Значение σκανδαλίζονται в контексте ученичества и отпадения
  choice: отпадают
  alternative: спотыкаются; соблазняются
  rationale: «Отпадают» передаёт серьёзность отказа от принятого слова, но не делает дополнительного утверждения об окончательной участи или прежнем состоянии спасения. Сноска сохраняет лексическую неоднозначность греческого глагола.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified формулировкой. Сохранены образ корня, ключевой термин «слово» и богословская напряжённость заключительного глагола.
