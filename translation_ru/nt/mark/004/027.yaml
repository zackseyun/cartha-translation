  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: ru
  text: и спит, и встаёт ночью и днём, а семя всходит и растёт, хотя он сам не знает, как это происходит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как он сам не знает»; смысл: он сам не знает, как происходит рост.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: спит
  rationale: Настоящее сослагательное в последовательности притчи передаёт повторяющееся, обычное действие; русское настоящее время выражает это естественно.
- source_word: ἐγείρηται
  choice: встаёт
  rationale: Форма употреблена непереходно в значении пробуждения и подъёма; «встаёт» не вносит ассоциации с воскресением.
- source_word: νύκτα καὶ ἡμέραν
  choice: ночью и днём
  rationale: Естественное русское обозначение непрерывной смены времени, сохраняющее порядок греческого текста.
- source_word: ὁ σπόρος
  choice: семя
  rationale: Определённость восстанавливается из контекста притчи; по-русски нулевой артикль естественен, а «семя» связывает фразу с посевом.
- source_word: βλαστᾷ
  choice: всходит
  rationale: В контексте посеянного семени «всходит» ясно обозначает появление ростка и звучит естественнее технического «прорастает».
- source_word: μηκύνηται
  choice: растёт
  rationale: Глагол буквально указывает на удлинение или увеличение в высоту; в данном растительном контексте русское «растёт» естественно охватывает этот процесс без неуклюжего буквализма.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: как — он и сам не знает
  rationale: 'Так сохраняется формальная неоднозначность ὡς, но по-русски ясно передаётся смысл: человеку неизвестно, каким образом происходит рост; «и сам» отражает эмфатическое αὐτός.'
theological_decisions:
- issue: Причина и механизм роста семени в притче
  choice: Оставить способ роста неизвестным самому сеятелю, не называя действующую силу.
  alternative: Прямо сказать, что семя растит Бог, либо представить происходящее лишь как естественный процесс.
  rationale: Греческий текст подчёркивает незнание человека и не называет причину роста; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; сохранён мерный ритм притчи и повтор союзов. Тире перед «он и сам не знает» делает естественной русскую конструкцию с вынесенным вопросительным словом «как».
