  source_fidelity: 'Основной образ и последовательность действий переданы верно. Однако «одно семя» в русском обычно означает ровно одно отдельное зерно, тогда как ὃ μέν имеет распределительно-частичное значение: часть посеянного семени. «Часть семян» точнее передаёт этот смысл в естественном русском употреблении.'
