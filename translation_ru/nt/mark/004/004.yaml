  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: ru
  text: И когда он сеял, часть семян упала у дороги[a], и прилетели птицы и склевали их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возле тропы»; греческое выражение обозначает место рядом с дорогой или тропой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: когда он сеял
  rationale: Идиоматическая повествовательная конструкция обозначает событие, произошедшее во время сева; такой перевод естественно передаёт временное значение, не вводя тяжеловесного «случилось».
- source_word: ὃ μὲν
  choice: одно семя
  rationale: Средний род относительного местоимения с μέν имеет распределительно-частичное значение и указывает на часть высеваемого семени. В русском для ясности требуется назвать подразумеваемое «семя».
- source_word: ἔπεσεν
  choice: упало
  rationale: Прямое и естественное соответствие глаголу πίπτω в данном контексте.
- source_word: παρὰ τὴν ὁδόν
  choice: у дороги
  rationale: Выражение обозначает место рядом с дорогой или тропой. Краткое «у дороги» сохраняет пространственный смысл, а возможный сельскохозяйственный образ тропы отмечен в сноске.
- source_word: τὰ πετεινὰ
  choice: птицы
  rationale: Обычное значение существительного; в греческом тексте этого стиха нет уточнения «небесные» или «воздушные».
- source_word: κατέφαγεν
  choice: склевали
  rationale: В отношении птиц и семени «склевали» естественно передаёт полное поедание, выраженное усиленным глаголом κατεσθίω.
- source_word: αὐτό
  choice: его
  rationale: Местоимение относится к семени, представленному как единичная часть посева; русский мужской род обусловлен словом «семя».
