  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: ru
  text: Когда Он оказался в уединении[a], те, кто был рядом с Ним, вместе с Двенадцатью спрашивали Его о притчах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в стороне от народа, в частной обстановке; это не означает, что Иисус был совершенно один, поскольку рядом находились Его последователи.
    reason: lexical_clarification
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Когда
  rationale: В русском начале предложения временной союз «когда» естественно передаёт переход к следующему эпизоду; отдельное «и» здесь необязательно для сохранения связного повествования.
- source_word: ἐγένετο κατὰ μόνας
  choice: Он остался наедине
  rationale: Оборот означает, что Иисус оказался в частной обстановке, вдали от множества народа. «Остался наедине» передаёт смысл идиомы, а примечание предупреждает, что речь не об абсолютном одиночестве.
- source_word: ἠρώτων
  choice: стали расспрашивать
  rationale: Имперфект допускает продолженное или неоднократное действие. «Стали расспрашивать» естественно передаёт разворачивающийся разговор, не усиливая повторность до категоричного «всё спрашивали».
- source_word: οἱ περὶ αὐτὸν
  choice: те, кто был рядом с Ним
  rationale: Формулировка сохраняет более широкий круг последователей Иисуса и не сводит его к одним Двенадцати; «рядом» может обозначать как близость, так и принадлежность к окружению.
- source_word: σὺν τοῖς δώδεκα
  choice: вместе с Двенадцатью
  rationale: Передаёт значение совместности и сохраняет синтаксическое различие между окружавшими Иисуса людьми и Двенадцатью.
- source_word: τὰς παραβολάς
  choice: о притчах
  rationale: Сохраняется засвидетельствованное в SBLGNT множественное число, относящее вопрос к притчевому учению Иисуса.
theological_decisions:
- issue: Состав тех, кто расспрашивал Иисуса
  choice: Иисуса расспрашивал более широкий круг находившихся рядом с Ним последователей вместе с Двенадцатью.
  alternative: Его расспрашивали только Двенадцать.
  rationale: Конструкция οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα естественнее всего различает окружение Иисуса и Двенадцать, одновременно объединяя их как задававших вопросы.
- issue: Значение уединения Иисуса
  choice: Иисус находился в стороне от народа, в частной обстановке с последователями.
  alternative: Иисус был совершенно один.
  rationale: Последующая фраза прямо упоминает находившихся рядом с Ним людей, поэтому κατὰ μόνας обозначает уединённую обстановку, а не отсутствие всякого сопровождения.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Местоимения, относящиеся к Иисусу, написаны с прописной буквы. Выражение «те, кто был рядом с Ним» намеренно не превращено в конфессионально нагруженное обозначение и сохраняет различие между более широким кругом последователей и Двенадцатью.
