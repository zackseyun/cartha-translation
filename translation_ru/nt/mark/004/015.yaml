source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: ru
  text: А те, что у дороги, где сеется слово, — это те, кто, услышав его, тотчас видят, как приходит Сатана и отнимает слово, посеянное в них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посеянное внутрь них».'
    reason: εἰς αὐτούς буквально обозначает направленность «в/внутрь них»; основной вариант «в них» естественен по-русски, не снимая этого оттенка.
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδόν
  choice: А те, что у дороги, — это люди
  rationale: Так сохраняется образ места из притчи и одновременно естественно поясняется, что речь идёт о людях. δέ передано лёгким связующим «А», без усиления противопоставления.
- source_word: ὅπου σπείρεται ὁ λόγος
  choice: в которых сеется слово
  rationale: В контексте объяснения притчи локальное «где» естественно соотносится с людьми через «в которых». «Слово» сохраняет повтор ключевого λόγος и образ сеяния.
- source_word: ὅταν ἀκούσωσιν
  choice: когда они слышат
  rationale: ὅταν с аористом сослагательного наклонения выражает обобщённую повторяющуюся ситуацию; настоящее время по-русски звучит естественно.
- source_word: εὐθὺς ἔρχεται ὁ Σατανᾶς
  choice: тотчас приходит сатана
  rationale: «Тотчас» передаёт характерную для Марка непосредственность εὐθύς. «Сатана» прямо передаёт личное обозначение ὁ Σατανᾶς.
- source_word: αἴρει τὸν λόγον
  choice: забирает слово
  rationale: «Забирает» передаёт значение удаления или отнятия у αἴρω, не добавляя более резкого оттенка «выхватывает».
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: посеянное в них
  rationale: Причастная конструкция сохранена как определение к «слову». «В них» естественно передаёт направленность εἰς αὐτούς и допускает как идею вхождения, так и пребывания слова внутри слушающих.
theological_decisions:
- issue: Личная деятельность сатаны в объяснении притчи
  choice: сатана приходит и забирает слово
  alternative: обезличенное «противник» или абстрактное зло
  rationale: Греческое ὁ Σατανᾶς здесь естественно обозначает личного деятеля; перевод не демифологизирует текст и не превращает сатану в отвлечённый принцип.
- issue: Степень принятия слова слушателями
  choice: слово «посеяно в них» без уточнения глубины или спасительного результата
  alternative: добавить «принято сердцем» либо, напротив, «лишь услышано внешне»
  rationale: Текст говорит о сеянии слова εἰς αὐτούς, но не разрешает здесь полностью вопрос о характере и глубине его принятия; эта напряжённость сохранена.
translation_notes:
  register: 'Современный литературный русский язык с ясным, но достойным библейским звучанием. Синтаксис слегка сглажен ради естественности: «люди» добавлено для раскрытия подразумеваемого референта, а «где» передано относительным «в которых». Строчная форма «сатана» соответствует современной русской орфографической практике для этого наименования.'
