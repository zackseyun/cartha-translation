revisions:
- from: 'А те, что у дороги, — это люди, в которых сеется слово: когда они слышат, тотчас приходит сатана и забирает слово, посеянное в них[a].'
  to: А те, что у дороги, где сеется слово, — это те, кто, услышав его, тотчас видят, как приходит Сатана и отнимает слово, посеянное в них[a].
  rationale: Исправлена связь ὅπου с образом дороги как места сеяния. Для естественного русского синтаксиса временная конструкция ὅταν ἀκούσωσιν передана деепричастным оборотом «услышав его», при этом добавленное «его» лишь восполняет подразумеваемый контекстом объект — слово. «Видят, как» не добавляет нового события, а естественно раскрывает греческое настоящее ἔρχεται после «услышав». Имя «Сатана» нормализовано, αἴρει передано как «отнимает».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:08:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная мысль и ключевые соответствия переданы верно: λόγος сохранён как «слово», εὐθύς — как «тотчас», а ὁ Σατανᾶς — как личный деятель. Однако «в которых сеется слово» меняет синтаксическую связь оригинала: ὅπου относится к «дороге/месту», а не непосредственно к людям. Кроме того, заглавная буква в имени «Сатана» нормативна и предпочтительна в современном литературном русском.'
  naturalness: Фраза «те, что у дороги, — это люди, в которых сеется слово» понятна, но образно-синтаксически смешивает людей с местом посева. Перестройка с «где сеется слово» естественнее и ближе к греческому. «Отнимает» точнее и литературнее, чем несколько разговорное «забирает» в данном контексте.
  terminology: «Слово» последовательно передаёт λόγος. «Сатана» следует писать с прописной буквы как имя/персонифицированное обозначение. Примечание к εἰς αὐτούς уместно; формулировку следует сделать точнее, не выдавая «внутрь» за единственно возможное значение.
  issues:
  - severity: medium
    issue: Относительное «в которых» отнесено к людям, тогда как ὅπου в оригинале относится к месту у дороги, где сеется слово.
    rationale: Такое изменение затушёвывает пространственный образ притчи и создаёт неестественное отождествление людей с местом посева. Следует сохранить «у дороги, где сеется слово».
  - severity: low
    issue: «сатана» написано со строчной буквы.
    rationale: В современном литературном русском при личном употреблении этого имени нормативно «Сатана».
  - severity: low
    issue: «Забирает» стилистически слабее передаёт αἴρει.
    rationale: «Отнимает» естественно передаёт лишение/удаление слова, не усиливая глагол до «выхватывает» или «похищает».
