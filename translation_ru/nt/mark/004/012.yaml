  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: ru
  text: чтобы они, глядя, смотрели, но не видели[a], и, слушая, слышали, но не понимали[b], как бы они не обратились[c] и не было им прощено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но не распознавали»; «но не постигали увиденного».'
    reason: lexical_alternative
  - marker: b
    text: Иисус отсылает к Ис. 6:9–10, сохраняя напряжение между Божьим судом и неспособностью людей откликнуться.
    reason: cross_reference
  - marker: c
    text: «Обратились» можно также перевести как «повернулись», «вернулись» или, по смыслу контекста, «покаялись».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно сохраняет целевое/результативное значение греческого союза, не снимая напряжения контекста.
- source_word: βλέποντες βλέπωσι
  choice: глядя, смотрели
  rationale: Два родственных глагола передают эмфатический и парадоксальный повтор оригинала; «глядя» и «смотрели» звучат по-русски естественнее буквального повтора одной формы.
- source_word: ἴδωσιν
  choice: видели
  rationale: Смена глагола вслед за βλέπω сохраняется; в контексте «видеть» может означать подлинно воспринимать или распознавать, что пояснено в сноске.
- source_word: ἀκούοντες ἀκούωσι
  choice: слушая, слышали
  rationale: Сохраняет двойную конструкцию и ее семитский риторический характер, используя естественную русскую пару глаголов.
- source_word: συνιῶσιν
  choice: понимали
  rationale: Ясный и обычный русский эквивалент умственного и духовного постижения.
- source_word: μήποτε
  choice: как бы ... не
  rationale: Передает отрицательно-предупредительную, перспективную силу μήποτε и сохраняет намеренно трудную связь с предшествующим «чтобы».
- source_word: ἐπιστρέψωσιν
  choice: обратились
  rationale: «Обратиться» сохраняет образ поворота и в русском библейском контексте допускает смысл возвращения к Богу и покаяния, не заменяя его более узким термином.
- source_word: ἀφεθῇ αὐτοῖς
  choice: не было им прощено
  rationale: Сохраняет безлично-пассивную конструкцию и не уточняет подразумеваемый субъект или объект прощения.
theological_decisions:
- issue: Целевое/результативное значение цитаты и возможность того, что притчи препятствуют обращению
  choice: Сохранить «чтобы ... как бы ... не», не смягчая формулировку до простого описания результата.
  alternative: «так что ... иначе они могли бы обратиться»
  rationale: Греческий текст намеренно сохраняет напряжение между Божьим судом и неспособностью людей откликнуться; перевод не должен разрешать его в пользу одной богословской схемы.
- issue: Смысл ἐπιστρέψωσιν применительно к покаянию
  choice: «обратились» в основном тексте с пояснением возможных значений в сноске.
  alternative: «покаялись» или «повернули назад»
  rationale: Глагол может иметь покаянно-заветный оттенок, особенно в отсылке к Исаии, но его значение шире технического обозначения покаяния.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Параллелизм зрения и слуха сохранен; намеренная трудность заключительной конструкции не сглажена.
