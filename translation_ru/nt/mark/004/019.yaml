  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: ru
  text: а заботы этого века[a], обманчивость богатства[b] и проникающие внутрь желания всего прочего заглушают слово, и оно становится бесплодным[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заботы этого мира». Греческое слово может означать «век, эпоху», а также связанный с ними миропорядок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обман богатства».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и становится бесплодным». Ближайший названный референт — «слово»; по смыслу образа речь также может идти о семени или о слушающем, который не приносит плода.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: заботы
  rationale: Слово обозначает тяготящие заботы или тревоги; «заботы» естественно по-русски и не сводит смысл лишь к психологическому состоянию.
- source_word: αἰῶνος
  choice: этого века
  rationale: Основное значение αἰών — «век, эпоха»; перевод сохраняет временной оттенок и вместе с тем допускает смысл нынешнего миропорядка.
- source_word: ἀπάτη τοῦ πλούτου
  choice: обманчивость богатства
  rationale: Оборот указывает на способность богатства обманывать и создавать ложные ожидания; сохраняется родительная конструкция источника.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: желания всего прочего
  rationale: Передаёт широкую направленность желаний на всё остальное, конкурирующее со словом, без искусственно буквального синтаксиса.
- source_word: εἰσπορευόμεναι
  choice: проникая внутрь
  rationale: Причастие изображает эти силы входящими в человека или почву; деепричастный оборот сохраняет образ и относится ко всему однородному ряду.
- source_word: συμπνίγουσιν
  choice: заглушают
  rationale: В контексте посева глагол означает, что разрастающиеся помехи душат растение; «заглушают» — естественный русский глагол для такого образа.
- source_word: τὸν λόγον
  choice: слово
  rationale: «Слово» сохраняет устойчивый библейский образ провозглашённой вести и связь с посеянным семенем.
- source_word: ἄκαρπος γίνεται
  choice: оно становится бесплодным
  rationale: Перевод сохраняет результативный смысл γίνεται и ближайший грамматический референт — «слово», не заменяя его толковательным субъектом.
theological_decisions:
- issue: Референт заключительного сказуемого ἄκαρπος γίνεται
  choice: Местоимение «оно» отнесено к ближайшему существительному «слово».
  alternative: Бесплодным становится слушающий либо подразумеваемое семя/растение.
  rationale: Ближайший явно названный референт единственного числа — τὸν λόγον. При этом сжатость греческого текста допускает осмысление через образ семени и его восприятие слушателем, поэтому альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет накопительный ряд греческого текста, но остаётся понятным; «этого века» предпочтено архаичному «века сего».
