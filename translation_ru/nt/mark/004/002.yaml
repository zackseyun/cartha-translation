  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: ru
  text: 'И Он учил их многому в притчах[a] и в Своём учении говорил им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многому учил их посредством притч». Греческое πολλά допускает передачу как «многому» или «многое»; выражение ἐν παραβολαῖς может обозначать форму или средство обучения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: учил
  rationale: Русский несовершенный вид естественно передаёт длительное или разворачивающееся действие греческого имперфекта без тяжеловесного «был учащим».
- source_word: ἐν παραβολαῖς
  choice: в притчах
  rationale: Естественно передаёт ἐν с дательным как способ или форму обучения и сохраняет привычный библейский термин.
- source_word: πολλά
  choice: многому
  rationale: Субстантивированное нейтральное множественное πολλά здесь обозначает объём содержания; «учил многому» по-русски естественно и сохраняет возможный смысл «многое».
- source_word: ἔλεγεν
  choice: говорил
  rationale: Несовершенный вид передаёт имперфект и плавно вводит последующую прямую речь.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: в Своём учении
  rationale: Близко сохраняет греческую предложную конструкцию и существительное διδαχή, не сводя выражение к более свободному «когда учил».
- source_word: καὶ
  choice: И
  rationale: Сохраняет характерную для Марка сочинительную связь с предыдущим повествованием.
- source_word: αὐτοὺς / αὐτοῖς
  choice: их / им
  rationale: Передаёт соответственно прямое дополнение при «учил» и адресата при «говорил».
