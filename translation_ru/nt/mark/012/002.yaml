  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: χρονологическое τῷ καιρῷ («в положенное время»), направление посылки к виноградарям, социально конкретное δοῦλον («раба»), цель действия («чтобы получить») и партитивный смысл ἀπὸ τῶν καρπῶν («часть плодов виноградника»). Замена второго повтора «виноградарей» местоимением «них» не меняет ясного референта и сохраняет смысл παρά с родительным («от»).'
  naturalness: Перевод звучит естественно на современном литературном русском. Синтаксис ясен, а выражения «в положенное время», «послал к виноградарям» и «часть плодов виноградника» соответствуют спокойному повествовательному регистру притчи.
  terminology: «Виноградари» удачно передаёт γεωργοί в данном контексте, не навязывая социально-правовое значение «арендаторы». «Раб» точно отражает δοῦλος; сноска корректно отмечает контекстуально возможный вариант «слуга». «Виноградник» является стандартным и точным соответствием ἀμπελών.
