id: MRK.12.2
reference: Mark 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: ru
  text: И в положенное время он послал к виноградарям раба[a], чтобы получить от них часть плодов виноградника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу».'
    reason: Лексема δοῦλος буквально указывает на раба, но в контексте поручения хозяина по-русски возможна передача «слуга».
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычное и естественное повествовательное соответствие аористу ἀποστέλλω.
- source_word: γεωργούς / γεωργῶν
  choice: виноградари / них
  rationale: γεωργός обозначает возделывающего землю; контекст виноградника позволяет естественно уточнить значение словом «виноградари». Во втором упоминании местоимение устраняет тяжеловесный повтор без потери референта.
- source_word: τῷ καιρῷ
  choice: в положенное время
  rationale: Передаёт смысл надлежащего, установленного момента, не уточняя прямо, что речь идёт о времени сбора урожая.
- source_word: δοῦλον
  choice: раба
  rationale: δοῦλος обозначает человека, находящегося в рабской зависимости; «раб» сохраняет социальную реальность притчи, тогда как «слуга» остаётся возможным контекстуальным вариантом.
- source_word: ἵνα ... λάβῃ
  choice: чтобы получить
  rationale: Сохраняет целевое значение конструкции с ἵνα и естественно звучит по-русски.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: часть плодов виноградника
  rationale: 'Конструкция ἀπό с родительным имеет партитивный смысл: хозяин намерен получить некоторую часть урожая, а не обязательно все плоды.'
- source_word: ἀμπελῶνος
  choice: виноградника
  rationale: Точное и общепринятое соответствие слову ἀμπελών.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены социальная конкретность слова δοῦλος и партитивный смысл выражения о плодах; лишний повтор «виноградарей» заменён местоимением.
