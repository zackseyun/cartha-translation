  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: ru
  text: 'Они принесли. И Он говорит им: «Чьё это изображение и чья надпись?» Они ответили Ему: «Кесаря».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν
  choice: принесли
  rationale: Глагол означает «принести»; прямое дополнение не выражено и восстанавливается из предыдущего стиха как динарий. Русский язык естественно допускает здесь отсутствие дополнения, как и греческий текст.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для Марка историческое настоящее и живость повествования.
- source_word: Τίνος
  choice: чьи
  rationale: 'Родительный падеж вопросительного местоимения выражает принадлежность; во множественном числе «чьи» естественно относится к двум однородным существительным разного рода: «изображение и надпись».'
- source_word: εἰκών
  choice: изображение
  rationale: Точное и общепонятное обозначение изображения, отчеканенного на монете.
- source_word: ἐπιγραφή
  choice: надпись
  rationale: В контексте монеты обозначает нанесённый на неё текст; «надпись» точно и доступно современному читателю.
- source_word: Καίσαρος
  choice: Кесаря
  rationale: Русский родительный падеж кратко и непосредственно отвечает на вопрос о принадлежности изображения и надписи.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Историческое настоящее сохранено. Эллипсис при «принесли» передан без добавления объекта, поскольку он ясен из ближайшего контекста и такое построение естественно по-русски.
