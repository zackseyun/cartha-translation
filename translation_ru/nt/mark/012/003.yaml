  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: ru
  text: Они схватили его, избили и отослали ни с чем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пустым», то есть ничего ему не дав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: схватили
  rationale: Аористное причастие передаёт действие, предшествующее следующим глаголам. В данном враждебном контексте «схватили» естественно выражает значение λαμβάνω, не добавляя излишней конкретики.
- source_word: ἔδειραν
  choice: избили
  rationale: Глагол δέρω означает бить, избивать; «избили» ясно передаёт жестокое обращение, не уточняя способ наказания, которого греческий текст не называет.
- source_word: ἀπέστειλαν
  choice: отослали
  rationale: Глагол ἀποστέλλω здесь означает отправить прочь; «отослали» кратко и естественно передаёт удаление слуги после избиения.
- source_word: κενόν
  choice: ни с чем
  rationale: Прилагательное κενόν буквально означает «пустым», но в этом контексте указывает, что слуга ничего не получил. Русское выражение «ни с чем» точно и идиоматично передаёт смысл.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повторяющийся союз καί связывает действия в простой повествовательной последовательности; русский текст сохраняет эту сочинительную структуру там, где она звучит естественно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательно энергичная. «Ни с чем» естественно передаёт образное употребление κενόν, а сноска сохраняет буквальную форму.
