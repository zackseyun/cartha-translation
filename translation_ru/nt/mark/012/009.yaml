source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: ru
  text: Что сделает хозяин виноградника? Он придёт, погубит виноградарей[a] и отдаст виноградник другим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арендаторов»; греческое слово обозначает земледельцев, которые здесь возделывают чужой виноградник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: Что сделает
  rationale: Прямо и естественно передаёт греческий вопрос с будущим временем, не добавляя отсутствующей в тексте связки вроде «итак».
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: хозяин виноградника
  rationale: В пределах притчи κύριος обозначает владельца или хозяина виноградника, а не служит явным божественным титулом. «Хозяин» естественно звучит по-русски и сохраняет смысл принадлежности.
- source_word: ἐλεύσεται
  choice: Он придёт
  rationale: Передаёт будущее время и живой образ личного вмешательства хозяина.
- source_word: ἀπολέσει
  choice: погубит
  rationale: Сохраняет суровость ἀπόλλυμι и его несколько более широкий смысл по сравнению с однозначным «убьёт».
- source_word: τοὺς γεωργούς
  choice: виноградарей
  rationale: В контексте виноградника обозначает тех, кто возделывает его; сноска уточняет их положение как арендаторов, не перегружая основной текст.
- source_word: δώσει τὸν ἀμπελῶνα ἄλλοις
  choice: отдаст виноградник другим
  rationale: «Отдаст» естественно передаёт δίδωμι в данном контексте, а «другим» сохраняет неопределённость ἄλλοις и не добавляет слово «арендаторам», отсутствующее в греческом.
theological_decisions:
- issue: Передача κύριος в притче с небожественным непосредственным референтом
  choice: хозяин
  alternative: господин; владелец
  rationale: Непосредственно в мире притчи речь идёт о хозяине виноградника. Такой перевод не навязывает слову формальный божественный титул, но и не устраняет более широкого богословского смысла притчи, раскрываемого контекстом.
- issue: Степень конкретизации суда в ἀπολέσει
  choice: погубит
  alternative: убьёт; уничтожит
  rationale: «Погубит» сохраняет решительность суда и лексическую широту глагола, не сводя его значение без необходимости исключительно к физическому убийству.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая форма и суровый тон притчи сохранены. «Виноградари» звучит естественно в основном тексте, а арендные отношения уточнены в сноске.
