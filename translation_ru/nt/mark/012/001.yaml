id: MRK.12.1
reference: Mark 12:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: ru
  text: 'И начал Он говорить им притчами: «Один человек посадил виноградник, обнёс его оградой[a], выкопал яму для точила[b], построил башню, отдал виноградник в аренду виноградарям[c] и уехал[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. φραγμός может означать ограду, забор, стену или живую изгородь.
    reason: lexical_alternative
  - marker: b
    text: То есть нижний резервуар виноградного пресса, куда стекал выжатый сок.
    reason: lexical_clarification
  - marker: c
    text: 'Или: «сдал его в аренду земледельцам». В данном контексте речь идёт о людях, возделывавших чужой виноградник.'
    reason: lexical_alternative
  - marker: d
    text: Описание перекликается с Ис 5:1–2, где виноградник также сажают, огораживают и оборудуют точилом и башней.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο … λαλεῖν
  choice: начал … говорить
  rationale: Стандартная передача начинательной конструкции с инфинитивом; естественна для современного русского повествования.
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: Русский творительный образа/средства естественно передаёт греческое выражение и сохраняет множественное число.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: Один человек посадил виноградник
  rationale: «Один человек» естественно вводит нового участника притчи и сохраняет конкретный человеческий образ без излишнего уточнения его общественного положения.
- source_word: περιέθηκεν φραγμόν
  choice: обнёс его оградой
  rationale: Передаёт устройство защитного ограждения вокруг виноградника, не определяя без достаточных оснований, было ли оно забором, стеной или живой изгородью.
- source_word: ὤρυξεν ὑπολήνιον
  choice: выкопал яму для точила
  rationale: ὑπολήνιον обозначает нижний резервуар или яму виноградного пресса; формулировка точнее, чем обобщённое «выкопал точило».
- source_word: ᾠκοδόμησεν πύργον
  choice: построил башню
  rationale: Прямая и привычная передача сельскохозяйственной сторожевой башни без добавления отсутствующего в тексте пояснения.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: отдал виноградник в аренду виноградарям
  rationale: Глагол указывает на сдачу имущества, а γεωργοί в контексте виноградника — его арендаторы-возделыватели. Повтор существительного вместо местоимения устраняет возможную русскую двусмысленность.
- source_word: ἀπεδήμησεν
  choice: уехал
  rationale: Кратко и естественно выражает удаление владельца на некоторое время, не добавляя цели или дальности поездки.
theological_decisions:
- issue: Социальное положение γεωργοί
  choice: виноградари, получившие виноградник в аренду
  alternative: арендаторы; земледельцы
  rationale: Контекст аренды сохраняет важное для притчи различие между владельцем и возделывателями, однако основной текст не превращает их роль в громоздкий составной титул.
- issue: Аллюзия на Исайю 5:1–2
  choice: сохранить образные соответствия в тексте и отметить параллель в сноске
  alternative: не отмечать аллюзию
  rationale: Последовательность посадки, ограждения, устройства точила и строительства башни явно перекликается с Ис 5:1–2; сноска сообщает об этом, не навязывая полного истолкования притчи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность греческих аористов, но избегает архаизмов. «Точило» оставлено как точный, хотя и не повседневный виноградарский термин, с пояснением в сноске.
