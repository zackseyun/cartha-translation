  source_fidelity: 'Перевод точно передаёт последовательность греческих действий и отношения в притче: начинательную конструкцию ἤρξατο ... λαλεῖν, множественное ἐν παραβολαῖς, посадку и оснащение виноградника, сдачу его γεωργοῖς и удаление владельца. «Выкопал яму для точила» корректно отражает ὤρυξεν ὑπολήνιον как выкапывание нижнего приёмного резервуара, а не просто сооружение пресса.'
