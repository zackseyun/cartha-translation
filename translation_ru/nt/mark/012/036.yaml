  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: ru
  text: 'Сам Давид сказал в Святом Духе[a]: «Господь сказал Господу моему[b]: „Сиди по правую руку от Меня, пока Я не положу врагов Твоих под ноги Твои“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Святого Духа».'
    reason: alternative_reading
  - marker: b
    text: Цитата из Псалма 109:1 по нумерации Септуагинты и русской традиции (110:1 по еврейской и западной нумерации). В еврейском тексте первое «Господь» передаёт Божье имя YHWH, традиционно переводимое как «ГОСПОДЬ», а второе относится к тому, кого Давид называет своим господом.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Сам Давид
  rationale: Интенсивное αὐτός подчёркивает, что эти слова принадлежат самому Давиду; такой порядок слов естественен по-русски.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: в Святом Духе
  rationale: Сохраняет форму греческого выражения и не сужает его смысл до одного лишь обозначения средства действия.
- source_word: κύριος / τῷ κυρίῳ μου
  choice: Господь / Господу моему
  rationale: Сохраняет повтор одного греческого слова и важное для рассуждения Иисуса различие между говорящим Господом и тем, кого Давид называет своим Господом.
- source_word: Κάθου
  choice: Сиди
  rationale: Естественная форма повелительного наклонения в контексте царского воцарения.
- source_word: ἐκ δεξιῶν μου
  choice: по правую руку от Меня
  rationale: Передаёт устойчивое пространственное и почётное значение греческого оборота современным литературным русским языком.
- source_word: ἕως ἂν θῶ
  choice: пока Я не положу
  rationale: Естественно передаёт предел действия и будущую направленность греческой конструкции.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: под ноги Твои
  rationale: Следует формулировке Марка, не добавляя отсутствующий здесь образ подножия.
theological_decisions:
- issue: Формула речи Давида, связанной со Святым Духом
  choice: сказал в Святом Духе
  alternative: сказал через Святого Духа
  rationale: Буквальная предложная конструкция сохраняет возможный оттенок пребывания и действия в Духе, не исключая значения вдохновения или посредства.
- issue: Христологическая сила цитаты из Псалма 109:1 по нумерации Септуагинты и русской традиции (110:1 по еврейской и западной нумерации)
  choice: Господь сказал Господу моему
  alternative: ГОСПОДЬ сказал Господу моему
  rationale: Основной текст сохраняет одинаковое греческое κύριος в обоих случаях; различие, видимое в еврейском тексте псалма, разъясняется в примечании, а не вносится в греческую формулировку Марка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу и Мессии внутри цитаты, написаны с прописной буквы согласно распространённой русской библейской практике; синтаксис остаётся ясным для обычного читателя.
