review_pass:
  verdict: revise
  source_fidelity: «При воскресении» точно передаёт ἐν τῇ ἀναστάσει как эсхатологический контекст, а «когда они воскреснут» — будущую временную конструкцию ὅταν ἀναστῶσιν. Вопрос «чьей женой она будет?» адекватно выражает τίνος αὐτῶν ἔσται γυνή. Заключительное «все семеро были её мужьями» передаёт, естественным русским способом, то, что каждый из семи имел её как жену. Критически неуверенное чтение ὅταν ἀναστῶσιν отмечено сноской.
  naturalness: «Имели её женой» грамматически возможно, но для современного литературного русского заметно книжно-архаично и звучит неестественно. «Были её мужьями» ясно и литературно, не превращая отношение в событие брака. Повтор «воскресении / воскреснут» уместно сохраняет повтор в греческом.
  terminology: Термин «воскресение» установлен и соответствует контексту спора о воскресении. «Жена» и «мужья» последовательно передают брачное значение γυνή и конструкции ἔχω ... γυναῖκα. «Ведь» хорошо передаёт объяснительное γάρ.
