  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: ru
  text: При воскресении, когда они воскреснут[a], чьей женой она будет? Ведь все семеро были её мужьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях отсутствуют слова «когда они воскреснут».
    reason: textual_variant
lexical_decisions:
- source_word: ἀνάστασις
  choice: воскресение
  rationale: В споре с саддукеями слово обозначает будущее воскресение; это естественный и устоявшийся русский эквивалент.
- source_word: ὅταν ἀναστῶσιν
  choice: когда они воскреснут
  rationale: Сочетание ὅταν с аористом сослагательного наклонения выражает будущее обстоятельство времени. Русское «воскреснут» передаёт смысл без добавления отсутствующего в греческом слова «снова».
- source_word: τίνος αὐτῶν
  choice: чьей
  rationale: Вопросительное местоимение в родительном падеже с αὐτῶν естественно передаётся по-русски как «чьей»; круг лиц ясен из следующей фразы.
- source_word: ἔσται γυνή
  choice: женой она будет
  rationale: Предикативная конструкция обозначает брачное отношение; русский творительный падеж после «будет» передаёт её естественно.
- source_word: γυνή
  choice: жена / женой
  rationale: В обоих случаях контекст однозначно брачный, поэтому более широкое «женщина» здесь не подходит.
- source_word: οἱ γὰρ ἑπτὰ
  choice: ведь все семеро
  rationale: γάρ объясняет основание вопроса, а субстантивированное «семеро» отсылает к семи братьям. «Все» естественно подчёркивает совокупность семи, уже заданную контекстом.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: имели её женой
  rationale: Формулировка сохраняет значение состояния и брачного отношения в конструкции ἔχω + дополнение + γυνή точнее, чем событийное «женились на ней».
theological_decisions:
- issue: Язык воскресения в споре с саддукеями
  choice: при воскресении, когда они воскреснут
  alternative: при воскресении из мёртвых, когда они снова восстанут
  rationale: Перевод сохраняет утверждение о будущем воскресении, не добавляя слов «из мёртвых» или «снова», которых в данном стихе нет.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор корня «воскрес-» сохранён вслед за греческим повтором ἀνάστασις / ἀναστῶσιν. Формула «имели её женой» несколько приподнята, но понятна и точнее сохраняет вид отношения, а не событие заключения брака.
