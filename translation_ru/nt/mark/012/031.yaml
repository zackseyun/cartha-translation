  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: ru
  text: 'Вторая такова: «Люби своего ближнего, как самого себя». Нет другой заповеди, которая была бы больше этих[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально по порядку слов: «Никакая другая заповедь не больше этих». Слово «этих» в контексте относится к двум заповедям вместе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Вторая — вот
  rationale: 'Греческая фраза эллиптична: подразумевается «вторая заповедь». Краткая русская конструкция сохраняет вынесенное вперёд «вторая» и связь с первой заповедью в контексте.'
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Форма будущего времени в цитате из Левита 19:18 имеет повелительную силу. Русский императив естественно и ясно передаёт предписание, не прибегая к архаичному «возлюби».
- source_word: τὸν πλησίον σου
  choice: ближнего твоего
  rationale: «Ближний» точно передаёт πλησίον и сохраняет узнаваемую библейскую связь с Левитом 19:18. Порядок слов поддерживает достоинство цитаты без чрезмерной архаизации.
- source_word: ὡς σεαυτόν
  choice: как самого себя
  rationale: Передаёт краткое греческое сравнение без добавления отсутствующего в тексте глагола.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Нет другой заповеди больше этих
  rationale: Формулировка сохраняет сравнительное значение μείζων и множественное τούτων, относящееся в контексте к двум заповедям, при этом звучит понятно по-русски.
- source_word: ἐντολή
  choice: заповедь
  rationale: «Заповедь» соответствует библейскому и заветному контексту речи о предписаниях Торы лучше, чем более общее «повеление».
theological_decisions:
- issue: К чему относится τούτων («этих») в заключительной фразе
  choice: Множественное число сохранено как указание на обе заповеди вместе
  alternative: Отнести высказывание только к непосредственно названной второй заповеди, передав смысл в единственном числе
  rationale: Множественное указательное местоимение естественно отсылает к двум заповедям, обсуждаемым в контексте. Перевод не сводит множественное число к одной заповеди и не устраняет связь между любовью к Богу и любовью к ближнему.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Избегается архаичное «возлюби», однако сохраняются ключевые традиционные термины «ближний» и «заповедь».
