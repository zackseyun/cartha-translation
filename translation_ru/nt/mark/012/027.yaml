  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: ru
  text: Он не Бог мёртвых, а живых. Вы глубоко заблуждаетесь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: Бог
  rationale: Безартиклевое θεός здесь обозначает единого Бога, о котором говорится в непосредственном контексте, а не «бога» в неопределённом смысле.
- source_word: νεκρῶν
  choice: мёртвых
  rationale: Субстантивированное родительное множественного числа естественно передаётся по-русски как «мёртвых» и сохраняет краткий контраст с «живых».
- source_word: ἀλλὰ ζώντων
  choice: а живых
  rationale: Субстантивированное причастие обозначает живых людей; союз «а» естественно выражает противопоставление после отрицания.
- source_word: πολὺ
  choice: глубоко
  rationale: Наречное πολὺ усиливает πλανᾶσθε; сочетание «глубоко заблуждаетесь» современно, ясно и передаёт силу упрёка.
- source_word: πλανᾶσθε
  choice: заблуждаетесь
  rationale: Форма допускает оттенки пребывания в ошибке или уклонения, но в данном контексте «заблуждаетесь» естественно передаёт ошибочность понимания без уточнения её внешней или внутренней причины.
- source_word: οὐκ ἔστιν
  choice: Он не
  rationale: Местоимение «Он» восстанавливает подразумеваемого из контекста Бога и позволяет получить естественное русское предложение без ненужного повтора слова «Бог».
theological_decisions:
- issue: Связь слов о мёртвых и живых с воскресением
  choice: Сохранён прямой контраст «мёртвых» и «живых» без поясняющего догматического развёртывания.
  alternative: Бог не есть Бог умерших людей, но тех, кто продолжает жить перед Ним.
  rationale: Высказывание служит аргументу Иисуса о воскресении, однако перевод не должен заранее определять, каким именно образом следует понимать состояние умерших или промежуточное состояние.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. В тексте нет сносок, поэтому маркеры не требуются.
