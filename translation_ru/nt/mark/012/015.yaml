source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: ru
  text: 'Но Он, зная их лицемерие, сказал им: «Зачем вы испытываете Меня?[a] Принесите Мне денарий[b], чтобы Я на него посмотрел».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искушаете Меня?»'
    reason: lexical_alternative
  - marker: b
    text: Денарий — римская серебряная монета; обычно он составлял плату за один день работы.
    reason: cultural_note
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие передаёт осведомлённость Иисуса об их скрытом намерении; «зная» естественно и не добавляет того, каким именно образом Он это узнал.
- source_word: ὑπόκρισιν
  choice: лицемерие
  rationale: Слово обозначает притворство и неискренность; традиционное «лицемерие» сохраняет нравственную силу греческого выражения и соответствует контексту ловушки.
- source_word: Τί
  choice: зачем
  rationale: 'В сочетании с глаголом πειράζω вопросительное местоимение имеет значение причины или цели: «зачем?», а не буквальное «что?».'
- source_word: πειράζετε
  choice: испытываете
  rationale: Передаёт намеренную враждебную проверку, не сужая смысл до побуждения ко греху; возможный оттенок «искушаете» отмечен в сноске.
- source_word: φέρετέ
  choice: принесите
  rationale: Императив требует доставить предмет говорящему; «принесите Мне» — прямое и естественное соответствие.
- source_word: δηνάριον
  choice: денарий
  rationale: Сохранено историческое название римской монеты; необходимые культурные сведения вынесены в сноску.
- source_word: ἵνα ἴδω
  choice: чтобы Я посмотрел
  rationale: Целевая конструкция передана естественно по-русски. Глагол «посмотрел» в данном предметном контексте идиоматичнее буквального «увидел»; подразумеваемый объект не требуется повторять.
theological_decisions:
- issue: Смысл πειράζετε в обращении Иисуса
  choice: испытываете Меня
  alternative: искушаете Меня
  rationale: Контекст указывает на злонамеренную попытку проверить Иисуса и поймать Его на слове. «Испытываете» сохраняет широту греческого слова, а возможный более сильный оттенок указан в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской издательской практике. Порядок сносок исправлен относительно английского консультационного слоя: лексическая сноска поставлена после πειράζετε, культурная — после δηνάριον.'
