  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: ru
  text: 'Продолжая учить в храме, Иисус сказал: «Как книжники могут говорить, что Мессия[a] — сын Давида?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческий титул χριστός здесь употреблён в мессианском значении.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: сказал
  rationale: Хотя причастие часто означает «ответив», здесь перед словами Иисуса нет прямого вопроса. В Марке этот глагол может вводить отклик на ситуацию или ход рассуждения; буквальное «ответив» в современном русском создало бы неясность.
- source_word: ἔλεγεν
  choice: сказал
  rationale: Имперфект перед прямой речью естественно передаётся русским повествовательным «сказал»; длительный характер происходящего выражен оборотом «продолжая учить».
- source_word: διδάσκων
  choice: продолжая учить
  rationale: Причастие обозначает действие, одновременное с речью Иисуса. Такой оборот сохраняет обстановку продолжающегося наставления и звучит естественно по-русски.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище; общеупотребительное «в храме» здесь достаточно ясно.
- source_word: Πῶς
  choice: Как ... могут
  rationale: В риторическом вопросе слово выражает недоумение и ставит утверждение книжников под вопрос. Русское «как могут говорить» передаёт эту силу, не превращая вопрос в простое выяснение способа речи.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и исторически точный русский термин для знатоков и толкователей Писания в евангельском контексте.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь χριστός употреблено как титул ожидаемого помазанника в иудейском мессианском споре, поэтому «Мессия» яснее передаёт функцию слова.
- source_word: υἱὸς Δαυίδ
  choice: сын Давида
  rationale: Фраза передаёт признанное мессианское обозначение и происхождение из рода Давида; в русском определённость понятна из контекста без артикля.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Контекст обсуждает мессианские ожидания и титул, а не употребляет «Христос» как ставшее именеподобным обозначение Иисуса. Альтернатива сохранена в сноске.
- issue: Смысл вопроса о сыне Давида
  choice: Сохранён прямой вопрос без пояснения предполагаемого ответа
  alternative: Добавить, что Мессия является не только потомком, но и Господом Давида
  rationale: Сам стих формулирует напряжение, которое развивается далее. Внесение решения уже в этот вопрос преждевременно устранило бы его риторическую и богословскую открытость.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис упрощён по сравнению с буквальным «ответив, говорил», но ответный характер высказывания не подчёркнут искусственно при отсутствии прямого предшествующего вопроса.
