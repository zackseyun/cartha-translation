language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: ru
  text: 'Неужели вы не читали даже этого места Писания: «Камень, который отвергли строители, стал краеугольным камнем[a]»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главой угла»; возможно также: «главным угловым камнем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: даже не
  rationale: 'Передаёт усиленную отрицательную риторическую формулу: Иисус подчёркивает, что собеседники не прочли даже этот известный текст.'
- source_word: τὴν γραφὴν ταύτην
  choice: этого места Писания
  rationale: В новозаветном употреблении γραφή здесь означает священное Писание, а указательное местоимение относится к конкретной цитате. Слово «место» делает русскую формулировку естественной, не сводя значение к обычному письменному тексту.
- source_word: ἀνέγνωτε
  choice: вы не читали
  rationale: Аорист в риторическом вопросе естественно передаётся русским прошедшим временем; конструкция апеллирует к уже доступному собеседникам тексту.
- source_word: Λίθον
  choice: Камень
  rationale: Хотя в греческом существительное без артикля, цитируемый образ указывает на определённый камень; в русском контексте определённость понятна без отдельного средства выражения.
- source_word: ἀπεδοκίμασαν
  choice: отвергли
  rationale: Глагол обозначает отклонение после оценки. «Отвергли» ясно и естественно передаёт основной смысл без тяжеловесного пояснения в тексте.
- source_word: οἱ οἰκοδομοῦντες
  choice: строители
  rationale: Субстантивированное причастие естественно и кратко передаётся существительным, сохраняя строительную метафору.
- source_word: ἐγενήθη
  choice: стал
  rationale: Русское прошедшее время точно передаёт совершившуюся перемену положения камня и допускает сохраняющийся результат.
- source_word: εἰς κεφαλὴν γωνίας
  choice: краеугольным камнем
  rationale: Это понятный и укоренившийся русский эквивалент, сохраняющий образ главного камня угла. Более буквальная формулировка приведена в примечании из-за возможной неоднозначности конструкции.
theological_decisions:
- issue: Мессианское применение образа из Псалма 117:22 (по нумерации Септуагинты)
  choice: Сохранить в основном тексте образы камня, строителей и краеугольного камня без прямого отождествления камня с Мессией.
  alternative: Добавить в переводе прямое указание, что камень — это Иисус или Мессия.
  rationale: Контекст применяет цитату к Иисусу, однако сам греческий текст сохраняет метафору. Её прямое истолкование внутри перевода устранило бы намеренную образность и добавило слова, которых нет в стихе.
- issue: Значение выражения κεφαλὴ γωνίας
  choice: В основном тексте — «краеугольным камнем», с буквальным вариантом в примечании.
  alternative: «главой угла», «главным угловым камнем» или «верхним камнем»
  rationale: Точное архитектурное обозначение выражения обсуждается. Основной вариант естественен по-русски и соответствует устойчивому библейскому образу, а примечание сохраняет буквальную форму и не исключает иной архитектурной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи Иисуса. Риторическое «Неужели» передаёт упрёк, а «даже» сохраняет усиление οὐδέ. Цитата звучит естественно, но её метафора не разъясняется внутри основного текста.
