  source_fidelity: 'Текст точно передаёт греческую риторическую формулу οὐδὲ ... ἀνέγνωτε («Неужели вы не читали даже...»), сакральное значение γραφή («место Писания») и цитату: камень был отвергнут строителями и стал краеугольным камнем. Прошедшее «стал» адекватно передаёт ἐγενήθη, не устраняя результата совершившегося действия.'
  naturalness: Формулировка естественна для современного литературного русского и сохраняет достойный, обличительный тон прямой речи. «Этого места Писания» — нормативное и понятное обозначение конкретного библейского отрывка; «Неужели» и «даже» удачно передают вопросительную и усилительную силу оригинала.
  terminology: «Писание», «строители» и «краеугольный камень» являются устоявшимися, точными русскими соответствиями. Примечание корректно отмечает буквальную форму «главой угла» и не навязывает спорное архитектурное толкование. Мессианское значение образа правомерно не внесено в основной текст.
