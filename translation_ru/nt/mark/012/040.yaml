source:
  edition: SBLGNT
  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: ru
  text: которые пожирают дома вдов и для вида подолгу молятся, — те получат более суровое осуждение[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напоказ»; «для показа».'
    reason: Лексическая альтернатива для προφάσει, передающая значение показного предлога или внешней видимости.
  - marker: b
    text: 'Или: «больший суд».'
    reason: Лексическая альтернатива для κρίμα; «суд» сохраняет более широкое значение греческого слова.
lexical_decisions:
- source_word: κατεσθίοντες
  choice: пожирают
  rationale: Сохраняет яркую метафору хищнического присвоения чужого имущества и нравственную силу греческого глагола.
- source_word: οἰκίας
  choice: дома
  rationale: Передаёт конкретный образ оригинала, не сужая и не расширяя его явно до имущества или состояния, хотя в контексте это значение подразумевается.
- source_word: χηρῶν
  choice: вдов
  rationale: Прямо передаёт родительный падеж множественного числа и указывает на социально уязвимых жертв.
- source_word: προφάσει
  choice: напоказ
  rationale: Естественно по-русски выражает показной, лицемерный характер молитв; формально более близкий вариант «под предлогом» приведён в сноске.
- source_word: μακρὰ
  choice: подолгу
  rationale: Наречная форма естественно передаёт длительность молитв.
- source_word: προσευχόμενοι
  choice: молятся
  rationale: Личная форма обеспечивает естественный русский синтаксис при сохранении одновременной характеристики тех же лиц.
- source_word: λήμψονται
  choice: примут
  rationale: Достойный и достаточно формальный эквивалент будущей формы со значением получения назначенного воздаяния.
- source_word: περισσότερον
  choice: более суровое
  rationale: В сочетании с «осуждение» естественно выражает сравнительную степень тяжести; буквальное «большее осуждение» по-русски менее ясно.
- source_word: κρίμα
  choice: осуждение
  rationale: В контексте предупреждения о Божьем воздаянии передаёт карательную силу слова, не разворачивая её в особую доктринальную формулу.
theological_decisions:
- issue: Значение κρίμα в предупреждении о религиозном лицемерии
  choice: осуждение
  alternative: суд
  rationale: Контекст указывает не просто на рассмотрение дела, а на неблагоприятный и более суровый приговор. Однако более широкое значение «суд» остаётся лексически возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; тон торжественный и обличительный. Метафора «пожирают дома вдов» намеренно сохранена. «Напоказ» понятно обычному читателю и передаёт лицемерный внешний мотив без конфессиональной интерпретации.
