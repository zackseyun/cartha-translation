  source_fidelity: Перевод точно передаёт пояснительное γάρ («Ведь»), временную перспективу ὅταν с аористным сослагательным («когда ... воскреснут»), активную форму ἀναστῶσιν и сравнительное значение ὡς («подобны», а не тождественны ангелам). Формула «ни жениться, ни выходить замуж» естественно передаёт парные οὔτε ... οὔτε и в русском различает мужскую и женскую стороны брака. «На небесах» уместно отражает множественное число τοῖς οὐρανοῖς.
  naturalness: Текст звучит естественно на современном литературном русском, с умеренно библейским регистром. Будущее «не будут» / «будут подобны» хорошо согласовано с будущим воскресением и не создаёт стилистической тяжеловесности.
  terminology: «Воскреснут из мёртвых», «жениться», «выходить замуж», «ангелы» и «небеса» употреблены последовательно и понятно. «Подобны ангелам» сохраняет именно сравнение и не навязывает представление о превращении людей в ангелов.
