  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: ru
  text: Ведь когда они воскреснут из мёртвых, то не будут ни жениться, ни выходить замуж, но будут подобны ангелам на небесах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Ведь когда
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «когда» — временное значение ὅταν в контексте будущего воскресения.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: они воскреснут из мёртвых
  rationale: Устойчивое и естественное русское выражение для воскресения; активная форма «воскреснут» соответствует греческому активному залогу и не вносит отсутствующий в форме пассив.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: не будут ни жениться, ни выходить замуж
  rationale: Естественная русская парная формула сохраняет различие между вступлением в брак и тем, что человека отдают в брак, не повторяя громоздкое «не будут выдаваемы замуж».
- source_word: ἀλλ’ εἰσὶν
  choice: но будут
  rationale: Будущее время по-русски естественно согласуется с условно-временной перспективой воскресения, хотя в греческом употреблено настоящее εἰσίν.
- source_word: ὡς ἄγγελοι
  choice: подобны ангелам
  rationale: Передаёт сравнение, выраженное ὡς, и не создаёт впечатления, будто воскресшие становятся ангелами.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Естественное русское библейское выражение, сохраняющее множественное число греческого οὐρανοῖς.
theological_decisions:
- issue: Характер уподобления ангелам
  choice: Воскресшие будут подобны ангелам, а не превратятся в ангелов.
  alternative: Воскресшие станут ангелами.
  rationale: Сравнительная частица ὡς обозначает подобие, а не тождество. Перевод не уточняет сходство сверх непосредственно названного контекста отсутствия брака.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формула «ни жениться, ни выходить замуж» понятна широкому читателю и естественно передаёт две стороны брачного обычая. «На небесах» сохраняет греческое множественное число, поэтому отдельная сноска не требуется.
