lexical_decisions:
- source_word: παρὰ κυρίου
  choice: от Господа
  rationale: 'παρά с родительным падежом прежде всего указывает на источник: это произошло или пришло от Господа. Русское «от Господа» естественно передаёт этот смысл и сохраняет возможность видеть за ним также Божье действие.'
- source_word: κυρίου
  choice: Господа
  rationale: В греческом тексте стоит κύριος; в цитате речь идёт о Боге. «Господь» соответствует новозаветной форме цитаты, не подменяя её непосредственно ветхозаветным написанием имени Божьего.
- source_word: ἐγένετο αὕτη
  choice: это от Господа
  rationale: Буквально оборот означает «это произошло/стало от Господа». В русском цитатном контексте эллиптическое «это от Господа» звучит естественно и передаёт происхождение события, не создавая оттенка случайности.
- source_word: θαυμαστὴ
  choice: дивно
  rationale: θαυμαστός обозначает нечто изумительное, чудесное, достойное восхищения. «Дивно» сохраняет возвышенный поэтический регистр псалма и хорошо сочетается с выражением «в наших глазах».
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: в наших глазах
  rationale: Сохранён библейский образ оригинала; выражение понятно современному читателю и означает «по нашему восприятию», «для нас».
theological_decisions:
- issue: Передача κύριος в цитате из псалма, где подразумевается Бог
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Хотя в еврейском тексте Псалма 117:23 стоит имя Божье, Марк цитирует греческую форму κυρίου. Перевод следует непосредственно новозаветному греческому тексту, сохраняя ветхозаветную отсылку в сноске.
- issue: Источник или действующее лицо в παρὰ κυρίου
  choice: от Господа
  alternative: Господом
  rationale: Конструкция допускает оттенок как происхождения, так и действия. «От Господа» яснее сохраняет основное значение источника, а вариант «Господом» отмечен в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического звучания цитаты. «Дивно» здесь осознанно употреблено как краткое наречное сказуемое; оно не архаизирует фразу чрезмерно и удерживает библейскую образность. Вопросительный знак сохранён по греческому тексту как завершение риторического вопроса, начатого в предыдущем стихе.
