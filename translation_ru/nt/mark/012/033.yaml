source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: ru
  text: и любить его всем сердцем, всем разумением и всей силой, и любить ближнего, как самого себя, — важнее всех всесожжений[a] и жертв.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Всесожжение — жертва, которую целиком сжигали на жертвеннике.
    reason: Пояснение специального значения греческого ὁλοκαύτωμα и русского культового термина.
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: любить
  rationale: Инфинитив сохраняет словесную силу и параллелизм двух конструкций с артиклем.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение сохраняет формулировку греческого текста; его отнесённость к Богу ясна из предшествующего контекста.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: всем сердцем
  rationale: Естественная русская формулировка передаёт полноту внутренней преданности, не вводя отсутствующего здесь местоимения второго лица.
- source_word: συνέσεως
  choice: разумением
  rationale: Передаёт способность понимать и рассуждать и сохраняет отличие σύνεσις от более общего обозначения ума; слово уместно в современном литературном библейском регистре.
- source_word: ἰσχύος
  choice: силой
  rationale: Ясно передаёт полноту сил и возможностей человека в данном этическом контексте.
- source_word: πλησίον
  choice: ближнего
  rationale: Традиционное и естественное русское обозначение ближнего здесь имеет обобщённое значение.
- source_word: ὡς ἑαυτόν
  choice: как самого себя
  rationale: Сохраняет возвратное и обобщённое значение, не превращая косвенно переданную формулировку в прямое обращение к читателю.
- source_word: περισσότερόν ἐστιν
  choice: важнее
  rationale: Естественно выражает недвусмысленное превосходство в ценности, не добавляя утверждения об отмене жертвоприношений.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: всех всесожжений и жертв
  rationale: «Всесожжение» — точный и устоявшийся русский термин для жертвы, полностью сжигаемой на жертвеннике; родительный падеж естественно выражает сравнение.
theological_decisions:
- issue: Соотношение заповедей любви и жертвенного богослужения
  choice: Любовь к Богу всем существом и любовь к ближнему названы более важными, чем все всесожжения и жертвы.
  alternative: Понимать стих как прямую отмену жертвоприношений либо лишь как постановку любви в один ряд с ними.
  rationale: Сравнительная форма περισσότερον ясно утверждает превосходство любви, но сам стих прямо не объявляет жертвенную систему отменённой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм сохранён; формулировки понятны без излишней архаизации. Местоимение «его» оставлено со строчной буквы как обычное местоимение исходного текста.
