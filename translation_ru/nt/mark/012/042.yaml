  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: ru
  text: И пришла одна бедная вдова и положила две лепты[a], что составляет один кодрант[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Лепта — очень мелкая монета; две лепты равнялись одному римскому кодранту.
    reason: cultural_note
  - marker: b
    text: Кодрант — римская монета, названная в греческом тексте.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: пришла
  rationale: 'Аористное причастие естественно передано личной формой в составе последовательного повествования: «пришла… и положила».'
- source_word: μία
  choice: одна
  rationale: Сохранено явное числительное μία. В русском «одна бедная вдова» естественно вводит нового участника повествования и не обязательно выражает числовое противопоставление.
- source_word: χήρα πτωχὴ
  choice: бедная вдова
  rationale: Прямое и естественное соответствие; «нищая» могло бы чрезмерно конкретизировать степень бедности в самом этом стихе.
- source_word: ἔβαλεν
  choice: положила
  rationale: В контексте ящика для пожертвований это современное нейтральное обозначение действия; «бросила» могло бы создавать ненужный оттенок силы.
- source_word: λεπτὰ δύο
  choice: две лепты
  rationale: Сохранено историческое название мелкой монеты, уже освоенное русской библейской традицией; пояснение её ценности дано в примечании и следующей фразе.
- source_word: ὅ ἐστιν
  choice: это
  rationale: Кратко и естественно вводит пояснение суммарной стоимости двух лепт.
- source_word: κοδράντης
  choice: один кодрант
  rationale: Сохранено названное в греческом тексте римское денежное обозначение; «один» ясно выражает равенство суммы двух лепт одному кодранту.
