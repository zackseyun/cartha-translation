  source_fidelity: 'Основной смысл передан верно: бедная вдова приходит, кладёт две лепты, а их сумма поясняется как кодрант. Однако греческое ὅ ἐστιν вводит пояснение к сумме «две лепты»; русское «— это один кодрант» допустимо, но менее точно связывает пояснение с предшествующей суммой, чем «что составляет».'
