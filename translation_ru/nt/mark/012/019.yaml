  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: ru
  text: '«Учитель, Моисей написал нам[c]: если у кого-нибудь умрёт брат, оставив жену и не оставив ребёнка[a], то его брат должен взять жену и произвести потомство для своего брата[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не оставит ребёнка»; возможно также: «не оставит детей».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «воздвигнуть семя брату» — выражение, означающее произвести потомство для умершего брата согласно обязанности левиратного брака.'
    reason: lexical_alternative
  - marker: c
    text: См. Второзаконие 25:5 — здесь имеется в виду установленный Моисеевым законом левиратный брак.
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Естественное обращение к Иисусу, точно передающее διδάσκαλος без избыточного оттенка власти.
- source_word: ἔγραψεν ἡμῖν
  choice: написал нам
  rationale: Дательный ἡμῖν указывает на адресованность или значимость предписания для Израиля; по-русски «написал нам» естественно в контексте ссылки на закон.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: если у кого-нибудь умрёт брат
  rationale: Сохраняет неопределённость τινος и мужской термин родства ἀδελφός.
- source_word: καταλίπῃ γυναῖκα καὶ μὴ ἀφῇ τέκνον
  choice: оставив жену, но не оставив ребёнка
  rationale: Передаёт параллельные глаголы со значением оставления после смерти; «но» естественно выражает смысловое противопоставление, а единственное число «ребёнка» соответствует τέκνον.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: то его брат должен взять его жену
  rationale: В контексте левиратного закона «взять жену» означает вступить с вдовой в брак; формулировка сохраняет юридическую образность исходного текста.
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: восстановить потомство умершему брату
  rationale: «Восстановить потомство» понятно передаёт идиому «воздвигнуть семя»; слово «умершему» проясняет референта местоимения, уже заданного условной частью.
theological_decisions:
- issue: Передача левиратной брачной формулы
  choice: «взять его жену и восстановить потомство умершему брату»
  alternative: «жениться на вдове и произвести потомство для брата»
  rationale: Выбранный вариант сохраняет юридико-библейскую образность греческого текста, но остаётся понятным современному читателю и не добавляет конфессионального толкования.
- issue: Родовые и брачные обозначения
  choice: Сохранены слова «брат» и «жена»
  alternative: Гендерно-нейтральная передача
  rationale: Исходный текст прямо описывает мужчину, его брата и жену в рамках конкретного брачного закона; нейтрализация исказила бы содержание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным для устной ссылки на закон; сохранены юридическая формула и мужские термины родства.
