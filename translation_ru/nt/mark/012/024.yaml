  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: ru
  text: 'Иисус сказал им[a]: «Не потому ли вы заблуждаетесь, что не знаете ни Писаний, ни силы Бога?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве не поэтому вы сбиваетесь с пути — потому что не знаете ни Писаний, ни силы Бога?»'
    reason: 'Лексическая альтернатива: πλανᾶσθε может обозначать не только ошибочное мнение, но и уклонение с верного пути.'
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус сказал им
  rationale: Простая формула введения прямой речи естественно передаёт φημί, не добавляя отсутствующего в глаголе оттенка «ответил».
- source_word: Οὐ διὰ τοῦτο
  choice: Не потому ли
  rationale: Передаёт причинное значение διὰ τοῦτο и риторический вопрос с οὐ, предполагающий утвердительный ответ.
- source_word: πλανᾶσθε
  choice: вы заблуждаетесь
  rationale: Возвратная форма сохраняет диапазон между ошибочным пониманием и уклонением от истины, не усиливая его до прямого утверждения об обмане извне.
- source_word: μὴ εἰδότες
  choice: что не знаете
  rationale: Причастный оборот указывает на основание заблуждения; придаточное с «что» естественно связывается в русском с конструкцией «не потому ли».
- source_word: τὰς γραφὰς
  choice: Писаний
  rationale: «Писания» — ясное и устоявшееся обозначение священных текстов; прописная буква подчёркивает терминологическое употребление.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ни силы Бога
  rationale: Парная конструкция «ни… ни…» точно передаёт отрицательную координацию, а «сила Бога» сохраняет прямую генитивную связь.
theological_decisions:
- issue: Характер заблуждения, выраженного πλανᾶσθε
  choice: заблуждаетесь
  alternative: сбились с пути / введены в заблуждение
  rationale: Греческая форма допускает как ошибку, так и уклонение или введение в заблуждение. В контексте спор идёт о неверном понимании воскресения, Писаний и Божьей силы; выбранный вариант сохраняет упрёк, не уточняя без необходимости источник и нравственную природу ошибки.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Риторический вопрос сохранён; формулировка ясна обычному читателю и не сглаживает строгость упрёка.
