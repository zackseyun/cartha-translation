base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: ru
  text: 'Но те арендаторы виноградника сказали друг другу[a]: «Это наследник. Давайте убьём его, и наследство будет нашим[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказали между собой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и наследство достанется нам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Но те виноградари
  rationale: δέ передано мягким противопоставлением «но», а ἐκεῖνοι сохранено указательным «те». В контексте притчи γεωργοί — арендаторы, обрабатывающие виноградник; русское «виноградари» естественно обозначает их по занятию, тогда как отношения аренды уже ясны из контекста притчи.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: сказали друг другу
  rationale: Оборот обозначает речь внутри группы; «друг другу» естественно передаёт совместное обсуждение, не превращая его во внутренний монолог.
- source_word: ὅτι
  choice: двоеточие и прямая речь
  rationale: Здесь ὅτι вводит прямую речь, что в современном русском естественно передаётся пунктуацией.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Это наследник
  rationale: Сохранено указательное значение Οὗτός и обычный юридико-семейный смысл κληρονόμος.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Давайте убьём его
  rationale: δεῦτε с сослагательным наклонением выражает совместное побуждение. «Давайте убьём» звучит естественно и прямо, не добавляя юридического оттенка слова «казнить» или отдельной квалификации «убить как преступление».
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: и наследство будет нашим
  rationale: Формулировка сохраняет вынесенное притяжательное значение ἡμῶν и не добавляет отсутствующее в греческом тексте «его».
theological_decisions:
- issue: Передача γεωργοί в контексте притчи о винограднике
  choice: виноградари
  alternative: арендаторы; земледельцы
  rationale: «Виноградари» сохраняет непосредственный образ работников виноградника и привычно для русской библейской речи, не привнося аллегорического толкования. Их положение как арендаторов устанавливается контекстом; добавление «арендаторы-виноградари» здесь было бы тяжеловесным.
translation_notes:
  register: Современный литературный русский с ясной, прямой речью и умеренно традиционным для притчи словом «виноградари». Синтаксис краток и сохраняет напряжённость исходного высказывания.
