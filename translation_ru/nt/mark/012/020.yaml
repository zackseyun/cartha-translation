  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: ru
  text: Было семь братьев. Первый женился и умер, не оставив потомства[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семени». Греческое слово здесь означает потомство.'
