lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Было семь братьев
  rationale: Естественная русская передача бытийной конструкции; слово «братья» сохранено, поскольку речь идёт именно о мужчинах-братьях.
- source_word: ὁ πρῶτος
  choice: Первый
  rationale: Обозначает первого по порядку среди семи братьев; перевод «старший» необоснованно добавил бы указание на возраст.
- source_word: ἔλαβεν γυναῖκα
  choice: женился
  rationale: Греческое выражение буквально означает «взял жену», но в данном контексте это обычная идиома вступления в брак. «Женился» звучит естественно и точно в современном русском языке.
- source_word: ἀποθνῄσκων
  choice: умерев
  rationale: Деепричастие естественно передаёт обстоятельственное значение греческого причастия и связывает смерть с отсутствием оставленного потомства.
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: не оставил потомства
  rationale: В семейно-правовом контексте σπέρμα означает потомство. Эта формулировка естественна по-русски и не сужает значение до одного ребёнка.
