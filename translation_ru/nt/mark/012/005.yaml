revisions:
- from: 'И послал он другого; но и того они убили. Посылал он и многих других: одних били, других убивали.'
  to: 'И послал он ещё одного, и его тоже убили; затем послал многих других: одних били, других убивали.'
  rationale: Убрано невыраженное в греческом противительное значение; добавочная сила κἀκεῖνον передана словами «его тоже». Для подразумеваемого при «многих других» глагола выбран совершенный вид «послал», соответствующий аористному повествованию. Заключительная распределительная конструкция сохранена в естественном русском виде.
