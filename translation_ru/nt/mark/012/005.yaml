  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: ru
  text: 'И послал он ещё одного, и его тоже убили; затем послал многих других: одних били, других убивали.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: другого
  rationale: Речь идёт о ещё одном слуге в последовательности посланных хозяином; «другого» естественно передаёт это значение без лишнего уточнения.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Простая форма прошедшего времени ясно и естественно передаёт аорист и сохраняет повествовательную динамику.
- source_word: κἀκεῖνον
  choice: но и того
  rationale: «И того» сохраняет добавочное значение καί и указательное значение ἐκεῖνον; «но» по-русски естественно подчёркивает трагический исход очередной попытки, не меняя событийной связи.
- source_word: ἀπέκτειναν
  choice: они убили
  rationale: Прямое современное соответствие ἀποκτείνω, сохраняющее силу выраженного насилия.
- source_word: πολλοὺς ἄλλους
  choice: многих других
  rationale: Прямо указывает на множество дополнительных слуг, посланных после уже названных.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: одних ... других
  rationale: Обычная русская распределительная конструкция, точно передающая греческое противопоставление групп.
- source_word: δέροντες
  choice: били
  rationale: «Били» передаёт общее значение физического избиения, не сужая его до формального бичевания.
- source_word: ἀποκτέννοντες
  choice: убивали
  rationale: Несовершенный вид естественно передаёт суммарный характер повторявшихся действий над разными слугами и соответствует настоящему причастию в греческом.
theological_decisions:
- issue: Передача причастной итоговой конструкции
  choice: 'Самостоятельное предложение с личными формами: «одних били, других убивали»'
  alternative: «одних избивая, других убивая»
  rationale: Решение синтаксическое, а не доктринальное. Личные формы звучат естественно в современном русском языке и сохраняют распределительный характер и повторяемость насилия.
- issue: Подразумеваемое действие перед «многих других»
  choice: 'Эксплицировать сказуемое: «Посылал он и многих других»'
  alternative: 'Сохранить эллипсис: «и многих других — одних били, других убивали»'
  rationale: В греческом сказуемое подразумевается из ἀπέστειλεν. Его восстановление по-русски устраняет грамматическую шероховатость и ясно показывает, что хозяин посылал многих других, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и энергичное. Сохранены нарастание насилия и распределительная структура заключительной фразы. Архаизмы и конфессионально окрашенная лексика не использованы.
