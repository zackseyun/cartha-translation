base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: ru
  text: И снова он послал к ним другого слугу[a]; его они ударили по голове[b] и унизили[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другого раба». Греческое слово δοῦλος может означать как слугу, так и раба — в зависимости от контекста.'
    reason: alternative_reading
  - marker: b
    text: 'Редкий греческий глагол указывает на насилие, направленное на голову; возможен перевод: «ранили его в голову». Здесь он, вероятнее всего, не означает «обезглавили».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обошлись с ним позорно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторение действия в последовательности событий притчи и естественно звучит в современном русском повествовании.
- source_word: ἀπέστειλεν
  choice: он послал
  rationale: Аорист повествует о завершённом событии; нейтральное «послал» точно и естественно.
- source_word: πρὸς αὐτούς
  choice: к ним
  rationale: При глаголе посылания πρὸς с винительным падежом естественно передаётся по-русски как «к ним».
- source_word: ἄλλον δοῦλον
  choice: другого слугу
  rationale: δοῦλος может обозначать раба или слугу. В основном тексте «слугу» естественно передаёт роль персонажа и его подчинённость хозяину; социально более буквальный вариант сохранён в сноске.
- source_word: κἀκεῖνον
  choice: но они… его
  rationale: κἀκεῖνον означает «и того (тоже)» и продолжает последовательность. Русское «но они… его» естественно связывает отправку слуги с враждебной реакцией виноградарей; значение повторности уже поддерживается контекстом.
- source_word: ἐκεφαλίωσαν
  choice: ударили его по голове
  rationale: Редкий глагол обозначает насилие, направленное на голову. Такой перевод сохраняет предметное значение и не вводит сомнительного смысла «обезглавили».
- source_word: ἠτίμασαν
  choice: унизили
  rationale: Глагол означает лишить чести, подвергнуть бесчестию или постыдному обращению. «Унизили» кратко и естественно передаёт нанесённое человеку бесчестие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование краткое и ритмичное. «Слуга» выбрано для естественности, а «раб» вынесено в сноску. Союз «но» подчёркивает враждебный ответ арендаторов, не устраняя последовательного значения греческого καί.
