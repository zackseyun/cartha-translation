  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: ru
  text: 'Иисус ответил: «Первая заповедь такова: „Слушай, Израиль: Господь[a], Бог наш, — Господь один[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь цитируется Шма (Втор. 6:4); греческое «Господь» соответствует слову κύριος, которым в Септуагинте передано божественное имя YHWH.
    reason: cross_reference
  - marker: b
    text: 'Возможны также переводы: «Господь, Бог наш, — один Господь» или «Господь — наш Бог, только Господь». Греческая формулировка перекликается с Втор. 6:4 и может подчеркивать единство Бога, исключительную преданность Ему или оба смысла.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычная и естественная передача глагола ответа в повествовательном диалоге.
- source_word: Πρώτη ἐστίν
  choice: Первая заповедь такова
  rationale: Прилагательное употреблено самостоятельно и по контексту относится к заповеди; существительное восстановлено для ясного и естественного русского синтаксиса.
- source_word: Ἄκουε
  choice: Слушай
  rationale: Императив передан прямо; эта формулировка также сохраняет узнаваемое начало Шма из Второзакония 6:4.
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Сохранено прямое обращение без добавления архаичного русского междометия «о».
- source_word: κύριος
  choice: Господь
  rationale: Стандартная передача κύριος; в цитате из Шма слово соответствует употреблению κύριος в Септуагинте вместо божественного имени YHWH.
- source_word: ὁ θεὸς ἡμῶν
  choice: Бог наш
  rationale: Сохранены притяжательное значение и торжественный, но понятный порядок слов цитаты.
- source_word: εἷς
  choice: один
  rationale: Прямая передача числительного сохраняет смысловую насыщенность исповедания и не сводит его заранее только к единству или только к исключительности.
theological_decisions:
- issue: Передача заключительной части Шма и сохранение ее смыслового напряжения
  choice: Господь, Бог наш, — Господь один
  alternative: «Господь, Бог наш, — один Господь» или «Господь — наш Бог, только Господь»
  rationale: Выбранная формулировка близка к порядку греческих слов κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν и естественна по-русски. Она не устраняет намеренно возможность акцента как на единстве Бога, так и на исключительной верности Ему; основные варианты указаны в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и узнаваемым ритмом библейского исповедания. «Слушай, Израиль» звучит естественно и сохраняет прямое обращение; архаизмы и конфессионально окрашенные уточнения не добавлены.
