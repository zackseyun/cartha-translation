  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «первые места»; применительно к древней трапезе — наиболее почётные места на ложах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: почётные места
  rationale: Слово обозначает места первенства и высокого статуса в собрании. «Почётные места» естественно передаёт этот смысл по-русски, не сводя его лишь к физически передним или удобным сиденьям.
- source_word: συναγωγαῖς
  choice: синагогах
  rationale: В данном контексте речь идёт о местах еврейских религиозных собраний; «синагоги» — точное и общепонятное обозначение.
- source_word: πρωτοκλισίας
  choice: почётные места
  rationale: Слово указывает на наиболее престижные места за трапезой, в древности — места на ложах. Функциональный смысл важнее буквального упоминания лож, непривычного современному читателю.
- source_word: δείπνοις
  choice: пирах
  rationale: Здесь имеются в виду торжественные общественные трапезы, на которых распределение мест выражало статус. «Пиры» передаёт это лучше, чем нейтральные «обеды».
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повтор союза сохранён, чтобы передать перечисление и ритмическое накопление обвинений.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: в синагогах ... на пирах
  rationale: 'Предлог передан идиоматично: «в» для помещения и «на» для общественной трапезы.'
