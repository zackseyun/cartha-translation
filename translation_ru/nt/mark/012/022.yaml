  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: ru
  text: И ни один из семерых не оставил потомства. После всех умерла и женщина.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: ни один из семерых
  rationale: Субстантивированное числительное указывает на семерых братьев из предшествующего контекста. В сочетании с отрицанием такая формулировка естественно передаёт, что потомства не оставил никто из них.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: не оставил потомства
  rationale: Буквальное «не оставили семени» здесь означает отсутствие оставшихся после них детей или потомков. «Не оставил потомства» ясно и естественно передаёт идиому в современном русском языке.
- source_word: ἔσχατον πάντων
  choice: после всех
  rationale: 'Фраза обозначает последнюю стадию последовательности: женщина умерла после всех семерых. «После всех» сохраняет временное значение и звучит естественно.'
- source_word: καὶ ἡ γυνὴ
  choice: и женщина
  rationale: 'καί имеет присоединительное значение: в итоге умерла также уже упомянутая женщина. Русская конструкция «умерла и женщина» естественно выражает это добавление.'
- source_word: ἀπέθανεν
  choice: умерла
  rationale: Прямой эквивалент греческого глагола без эвфемистического смягчения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Буквальный образ «семени» не вынесен в примечание, поскольку «потомство» полностью и без богословской потери передаёт смысл контекстуальной идиомы.
