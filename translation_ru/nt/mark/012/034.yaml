id: MRK.12.34
reference: Mark 12:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: ru
  text: 'Иисус, увидев, что тот ответил рассудительно, сказал ему: «Ты недалеко от Царства Божьего»[a]. И никто больше не осмеливался задавать Ему вопросы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты близок к Царству Божьему». Греческое выражение говорит о близости, но прямо не утверждает вхождения в Царство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие естественно передаёт предшествующее наблюдение Иисуса и сохраняет связь с последующим высказыванием.
- source_word: νουνεχῶς
  choice: рассудительно
  rationale: Слово обозначает разумность, здравое понимание и обдуманность ответа; «рассудительно» звучит естественно и передаёт положительную оценку.
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Русский совершенный вид ясно обозначает завершённый ответ, предшествующий словам Иисуса; отдельная форма давнопрошедшего времени не требуется.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Ты недалеко от
  rationale: Сохраняется пространственный образ близости без утверждения, что человек уже вошёл в Царство.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Устоявшееся и понятное русское соответствие сохраняет возможные оттенки и царства как сферы, и Божьего царствования.
- source_word: οὐκέτι
  choice: больше не
  rationale: 'Естественно передаёт временной смысл: после этого никто уже не решался продолжать расспросы.'
- source_word: ἐτόλμα
  choice: не осмеливался
  rationale: Передаёт значение дерзновения и несовершенный вид греческого глагола, описывающий отсутствие дальнейших попыток.
- source_word: ἐπερωτῆσαι
  choice: задавать Ему вопросы
  rationale: Передаёт обращённые к Иисусу вопросы и уместно сохраняет контекст испытующих расспросов, не усиливая значение до «допрашивать».
theological_decisions:
- issue: Положение книжника по отношению к спасению и Царству Божьему
  choice: «Ты недалеко от Царства Божьего»
  alternative: «Ты близок к Царству Божьему»
  rationale: Греческий текст утверждает близость, но не вхождение или обладание. Формулировка сохраняет напряжение между похвалой проницательности книжника и отсутствием прямого заявления, что он уже находится в Царстве.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Местоимение «Ему» написано с прописной буквы по распространённой русской библейской традиции; синтаксис остаётся простым и доступным.
