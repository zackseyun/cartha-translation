  terminology: «Царство Божье» — устоявшееся русское библейское соответствие βασιλεία τοῦ θεοῦ. Сноска корректно объясняет, что формула выражает близость, а не прямо заявляет о вхождении в Царство; альтернативное «близок к» допустимо.
