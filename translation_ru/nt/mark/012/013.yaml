  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: ru
  text: И посылают к Нему нескольких фарисеев и нескольких иродиан, чтобы поймать Его на слове.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы уловить Его посредством сказанного Им». Греческий глагол содержит образ охоты, а заключительное выражение указывает на ловушку, устроенную через Его речь.'
    reason: Лексическая альтернатива поясняет охотничью метафору и значение λόγῳ, которые русская идиома «поймать на слове» передаёт не полностью.
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: посылают
  rationale: Историческое настоящее греческого повествования естественно передаётся русским настоящим временем и сохраняет живость рассказа.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: нескольких фарисеев и иродиан
  rationale: Передаёт неопределённое число представителей обеих названных групп без избыточно буквального повторения «нескольких из».
- source_word: Φαρισαίων
  choice: фарисеев
  rationale: Устоявшееся русское название этой иудейской религиозной группы.
- source_word: Ἡρῳδιανῶν
  choice: иродиан
  rationale: Устоявшееся русское название сторонников династии Ирода.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно и ясно выражает цель действия.
- source_word: ἀγρεύσωσιν
  choice: поймать
  rationale: Сохраняет охотничью метафору глагола и в сочетании «поймать на слове» естественно передаёт намерение устроить словесную ловушку.
- source_word: λόγῳ
  choice: на слове
  rationale: Русское выражение «поймать на слове» передаёт инструментальный смысл дательного падежа и связь ловушки с речью Иисуса, хотя может восприниматься идиоматически; поэтому добавлена сноска.
theological_decisions:
- issue: Подлежащее при греческом глаголе во множественном числе не названо
  choice: они (выражено личной формой «посылают» без добавленного существительного)
  alternative: первосвященники, книжники и старейшины; власти
  rationale: Русская форма глагола позволяет, как и греческий текст, не уточнять в этом стихе действующих лиц и не вносить их наименование из контекста.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими названиями групп. Историческое настоящее сохранено. Местоимение «Нему/Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
