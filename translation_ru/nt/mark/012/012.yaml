source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: ru
  text: Они пытались схватить Его, но боялись народа, потому что поняли, что эту притчу Он рассказал против них[a]. И, оставив Его, они ушли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о них», «в отношении них»; возможно также: «обращаясь к ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: искали случая
  rationale: Имперфект передаёт продолжавшееся намерение или попытку; сочетание «искали случая» естественно по-русски и не утверждает, что захват уже начался.
- source_word: κρατῆσαι
  choice: схватить
  rationale: Передаёт основное значение «завладеть, схватить», не вводя явно не названную формальную процедуру ареста.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: боялись народа
  rationale: Прямой и естественный перевод; «народ» в данном контексте обозначает собравшуюся массу людей.
- source_word: ἔγνωσαν
  choice: поняли
  rationale: Аорист здесь выражает осознание того, к кому относится притча; «поняли» естественнее русского «знали» в этой последовательности событий.
- source_word: πρὸς αὐτούς
  choice: о них
  rationale: Сохраняет референциальное значение оборота без обязательного усиления до «против них»; враждебная направленность ясна из контекста. Возможная более острая передача отмечена в сноске.
- source_word: τὴν παραβολὴν
  choice: эту притчу
  rationale: Указательное «эту» естественно отсылает к непосредственно предшествующей притче, хотя в греческом стоит определённый артикль.
- source_word: εἶπεν
  choice: рассказал
  rationale: Для притчи по-русски естественно «рассказать притчу»; прошедшее время ясно обозначает действие, предшествующее их пониманию.
- source_word: ἀφέντες αὐτόν
  choice: оставив Его
  rationale: 'Сохраняет форму и смысл причастия: они отказались от непосредственной попытки и оставили Иисуса.'
- source_word: ἀπῆλθον
  choice: ушли
  rationale: Краткая современная передача повествовательного движения без архаического оттенка.
theological_decisions:
- issue: Направленность притчи в πρὸς αὐτούς
  choice: о них
  alternative: против них; обращаясь к ним
  rationale: Предлог πρός с винительным допускает значение отношения или направленности. Контекст подразумевает обличение, но основной текст не должен превращать этот подтекст в единственно возможное лексическое значение.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Местоимение «Его» применительно к Иисусу написано с прописной буквы по принятой русской библейской традиции; синтаксис остаётся доступным обычному читателю.
