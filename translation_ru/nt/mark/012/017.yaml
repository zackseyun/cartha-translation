base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: ru
  text: 'Иисус же сказал им: «Отдайте[a] кесарю то, что принадлежит кесарю, а Богу — то, что принадлежит Богу». И они очень удивлялись ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воздайте». Глагол может означать «отдать», «вернуть», «уплатить» или «воздать» то, что причитается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Отдайте
  rationale: Повелительная форма передаёт требование отдать или возвратить тому, кому нечто принадлежит. «Отдайте» естественно по-русски и не сужает смысл до одной лишь уплаты налога.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: кесарю то, что принадлежит кесарю
  rationale: Описательная конструкция ясно передаёт субстантивированный оборот с родительным падежом и сохраняет идею принадлежности, не уточняя сверх текста, что именно имеется в виду.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: Богу — то, что принадлежит Богу
  rationale: Формулировка сохраняет намеренный параллелизм с первой частью изречения и не определяет за читателя объём Божьих требований.
- source_word: ἐξεθαύμαζον
  choice: чрезвычайно дивились
  rationale: Глагол выражает усиленное изумление; несовершенный вид «дивились» передаёт описательный характер имперфекта, а наречие «чрезвычайно» — усилительную приставку.
- source_word: ἐπ’ αὐτῷ
  choice: ему
  rationale: При глаголе удивления сочетание ἐπί с дательным указывает на объект изумления. Дательный «ему» прямо сохраняет отнесённость реакции к Иисусу, не заменяя её толкованием «его ответу».
- source_word: δὲ
  choice: же
  rationale: Частица «же» естественно передаёт мягкий переход и контраст δέ в русском повествовании, не делая противопоставление чрезмерно резким.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямое и нейтральное соответствие греческому введению речи.
theological_decisions:
- issue: Соотношение обязанностей перед гражданской властью и перед Богом
  choice: Передать обе параллельные части без поясняющего толкования
  alternative: Истолковать слова либо как широкое одобрение государственной власти, либо как скрытое умаление притязаний кесаря
  rationale: Сам стих признаёт принадлежащее кесарю и принадлежащее Богу, но не формулирует исчерпывающей политической теологии. Перевод сохраняет параллелизм и присущее высказыванию напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Кесарь» сохраняет исторический титул и узнаваемую форму изречения; конструкция «то, что принадлежит…» делает смысл прозрачным для современного читателя. Местоимение, относящееся к Иисусу, написано со строчной буквы в соответствии с общей современной литературной нормой.
