    text: 'Или, с явным указанием подразумеваемого из контекста: «Бог один». В греческом тексте сказано просто «он один»; о ком идёт речь, ясно из предыдущих слов.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: книжник
  rationale: Традиционный и точный евангельский термин для признанного знатока и толкователя Закона; он короче и ближе к исходному слову, чем пояснительное «учитель Закона».
- source_word: Καλῶς
  choice: Хорошо
  rationale: В данном ответе наречие выражает одобрение сказанного Иисусом. Отдельная реплика «Хорошо, Учитель!» естественно звучит по-русски и не требует добавлять отсутствующий в греческом глагол.
- source_word: διδάσκαλε
  choice: Учитель
  rationale: Прямое и современное соответствие обращению διδάσκαλε.
- source_word: ἐπ’ ἀληθείας
  choice: верно
  rationale: Фраза употреблена наречно и подтверждает истинность сказанного; «верно» естественно сочетается с «сказал».
- source_word: εἶπες
  choice: Ты ... сказал
  rationale: Русское прошедшее время прямо передаёт греческий аорист и естественно для непосредственного отклика на предшествующие слова.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание сказанного, а не причину одобрения.
- source_word: εἷς ἐστιν
  choice: он один
  rationale: Сохраняет эллиптичность греческого текста, где слово «Бог» в этом стихе не повторено, но подразумевается из предшествующего контекста.
- source_word: οὐκ ἔστιν ἄλλος
  choice: нет другого
  rationale: Естественная русская передача конструкции существования с отрицанием; сохраняет исключительность утверждения.
- source_word: πλὴν αὐτοῦ
  choice: кроме него
  rationale: Точно передаёт значение исключения, выраженное πλήν с родительным падежом.
theological_decisions:
- issue: Подразумеваемое подлежащее в εἷς ἐστιν
  choice: «он один» с пояснительной сноской
  alternative: «Бог один» или «есть один Бог»
  rationale: Контекст ясно указывает на Бога Израиля, однако сам греческий текст стиха не повторяет θεός. Эллиптическая формулировка сохраняет прозрачность по отношению к источнику и не делает основной текст более эксплицитным, чем оригинал.
- issue: Прописные буквы в местоимениях, относящихся к Богу или Иисусу
  choice: Строчные «ему», «он», «него»
  alternative: «Ему», «Он», «Него»
  rationale: В исходном греческом регистр не кодирует почтительного богословского написания. Современная литературная норма допускает строчные буквы; это также не добавляет в текст интерпретационного выделения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены краткость реплики и эллиптичность исходного текста; обращение «Учитель» выделено естественной русской пунктуацией.
