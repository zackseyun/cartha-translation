base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: ru
  text: 'И книжник сказал ему: «Хорошо сказано, Учитель. Ты верно сказал, что он один[a] и нет другого, кроме него».'
  philosophy: optimal-equivalence
  footnotes:
