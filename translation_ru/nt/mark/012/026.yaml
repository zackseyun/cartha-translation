  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: ru
  text: 'А о том, что мёртвые воскресают, разве вы не читали в книге Моисея, в отрывке о кусте[a], как Бог сказал ему: «Я Бог Авраама, Бог Исаака и Бог Иакова»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у куста»; греческое выражение может обозначать место Писания по эпизоду с кустом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: А о мёртвых
  rationale: Оборот с περί и родительным вводит тему; δέ передано лёгкой связкой «А», сохраняющей ход рассуждения без излишне резкого противопоставления.
- source_word: ὅτι ἐγείρονται
  choice: что они воскресают
  rationale: Форма настоящего времени в данном контексте выражает общее утверждение о воскресении мёртвых. Русское «воскресают» естественно и не требует тяжеловесного «бывают воскрешены»; возможный пассивный оттенок формы не усиливается сверх контекста.
- source_word: οὐκ ἀνέγνωτε
  choice: разве вы не читали
  rationale: Риторический вопрос естественно передан формулой «разве вы не читали», выражающей обращение к известному собеседникам тексту Писания.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: в книге Моисея
  rationale: βίβλος может означать книгу или свиток; «книга Моисея» — ясное и естественное обозначение Моисеева Писания.
- source_word: ἐπὶ τοῦ βάτου
  choice: в рассказе о терновом кусте
  rationale: Выражение, вероятно, называет раздел Писания по эпизоду с кустом. «В рассказе о терновом кусте» ясно передаёт эту функцию; буквальная локативная возможность отмечена в сноске.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: как Бог сказал ему
  rationale: Русский глагол речи уже естественно вводит прямую цитату, поэтому отдельная передача λέγων словом «говоря» была бы избыточной и стилистически тяжёлой.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Я Бог Авраама, Бог Исаака и Бог Иакова
  rationale: Именная конструкция настоящего времени передана без глагола-связки, как естественно по-русски. Повторение «Бог» сохраняет риторическую структуру цитаты.
theological_decisions:
- issue: Значение ὅτι ἐγείρονται в речи о воскресении
  choice: что они воскресают
  alternative: что их воскрешают
  rationale: Выбрана естественная русская формулировка общего утверждения о воскресении. Она не уточняет действующее лицо там, где оно прямо не названо, и при этом сохраняет предмет спора.
- issue: Настоящее время в самоопределении Бога
  choice: Я Бог Авраама, Бог Исаака и Бог Иакова
  alternative: Я был Богом Авраама, Богом Исаака и Богом Иакова
  rationale: Русская нулевая связка выражает настоящее время. Прошедшее время не вводится, поскольку оно изменило бы формулировку цитаты, на которой строится довод Иисуса.
translation_notes:
  register: Современный литературный русский язык с ясной риторической интонацией. «Терновый куст» сохраняет традиционно узнаваемый библейский образ без архаичного синтаксиса; повтор слова «Бог» поддерживает торжественность цитаты.
