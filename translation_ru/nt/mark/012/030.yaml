source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: ru
  text: И люби Господа, Бога твоего, всем сердцем твоим, и всей душой твоей, и всем разумом твоим, и всей силой твоей[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всей жизнью твоей» — для ψυχῆς («душой»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всем пониманием твоим» — для διανοίας («разумом»).'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «всей мощью твоей» — для ἰσχύος («силой»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: люби
  rationale: Будущее изъявительное в цитате заповеди имеет повелительную силу. Русское «люби» естественно передаёт прямую заповедь и избегает неуместного буквального «будешь любить».
- source_word: κύριον τὸν θεόν σου
  choice: Господа, Бога твоего
  rationale: Передаёт устойчивую библейскую формулу и сохраняет приложение «Бога твоего»; порядок слов придаёт речи достоинство, оставаясь понятным современному читателю.
- source_word: ἐξ
  choice: всем / всей
  rationale: В сочетании с частями и способностями человека предлог выражает полноту вовлечённости. По-русски это естественно передаётся творительным падежом без отдельного предлога.
- source_word: ὅλης
  choice: всем / всей
  rationale: Повтор слова «весь» сохраняет подчёркнутую в греческом тексте полноту каждого элемента.
- source_word: καρδίας
  choice: сердцем
  rationale: Традиционное и точное соответствие, обозначающее внутренний центр желаний, решений и чувств без пояснительного расширения.
- source_word: ψυχῆς
  choice: душой
  rationale: Сохраняет различие между перечисленными сторонами человека и широкий смысл ψυχή; возможное значение «жизнь» отмечено в сноске.
- source_word: διανοίας
  choice: разумом
  rationale: Естественно обозначает способность мыслить и понимать; вариант «пониманием» отмечен в сноске.
- source_word: ἰσχύος
  choice: силой
  rationale: Ясное современное соответствие для физической и общей способности действовать; вариант «мощью» отмечен в сноске.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: и ... и ... и ... и
  rationale: Повтор союзов сохранён ради накопительной, подчёркнутой структуры оригинала.
theological_decisions:
- issue: Передача κύριος в цитате заповеди
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: Греческий текст содержит κύριος. «Господь» сохраняет новозаветную форму и связь с заветным именованием Бога, не вводя типографического различия, которого нет в греческом тексте.
- issue: Четыре обозначения сторон человеческого существа
  choice: сердце / душа / разум / сила
  alternative: сердце / жизнь / понимание / мощь
  rationale: Различные греческие слова сохранены, а не сведены к обобщению вроде «всем существом», чтобы не устранять риторическую и богословскую многогранность всецелой любви к Богу.
translation_notes:
  register: Современный литературный русский с достоинством библейской заповеди. Умеренно традиционный порядок «Бога твоего», «сердцем твоим» сохраняет ритм и повтор исходного текста, не прибегая к устаревшим формам. Все союзы καί переданы, чтобы удержать накопительный акцент.
