  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: ru
  text: 'И, уча, Он говорил: «Остерегайтесь книжников, которые любят ходить в длинных одеждах[a] и принимать приветствия на площадях,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт о заметных длинных верхних одеждах, служивших знаком положения и общественного почёта.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν
  choice: уча, Он говорил
  rationale: Естественная русская передача обстановочного выражения и имперфекта; сохраняет представление о речи Иисуса в процессе учения, не утяжеляя фразу буквальным «в Своём учении».
- source_word: Βλέπετε ἀπὸ
  choice: остерегайтесь
  rationale: Императив с ἀπό выражает серьёзное предостережение и требование быть настороже по отношению к названным людям.
- source_word: γραμματέων
  choice: книжников
  rationale: Традиционный и точный евангельский термин для знатоков и толкователей Писания; он не сводит их роль только к переписыванию текстов.
- source_word: τῶν θελόντων
  choice: которые любят
  rationale: В данном описании θέλω обозначает характерное стремление и склонность; русское «любят» естественно передаёт демонстративное предпочтение, не вводя дополнительного мотива.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: ходить в длинных одеждах
  rationale: στολαί — длинные, заметные верхние одеяния; выбранная формулировка понятна современному читателю и сохраняет оттенок публичной демонстрации статуса.
- source_word: ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: принимать приветствия на площадях
  rationale: ἀγοραί были не только рынками, но и общественными площадями; «на площадях» ясно передаёт публичную среду почётных приветствий.
theological_decisions:
- issue: Объём предостережения Иисуса о книжниках
  choice: 'Определительное придаточное без обособления: «книжников, которые любят...»'
  alternative: Понимать слова как безусловное осуждение всех книжников без различия
  rationale: Греческое причастное определение характеризует тех книжников, о которых идёт речь, через стремление к публичному почёту. Перевод не расширяет осуждение и не снимает сохраняющуюся в конструкции обобщённость.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельской речи. «Остерегайтесь» сохраняет серьёзность предупреждения; «книжники» оставлено как устойчивый библейский термин. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
