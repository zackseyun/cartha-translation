  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: ru
  text: Сам Давид называет Его Господом. Как же Он может быть его сыном?[a][b] И многочисленная толпа охотно слушала Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и откуда Он его сын?»'
    reason: Сохраняет буквальное пространственно-исходное значение πόθεν, которое в данном вопросе употреблено логически.
  - marker: b
    text: Слово «сын» перекликается с мессианским титулом «Сын Давида» и здесь может означать также «потомок».
    reason: Поясняет династический смысл υἱός, не подменяя им формулировку основного текста.
lexical_decisions:
- source_word: αὐτὸς Δαυίδ
  choice: Сам Давид
  rationale: Препозитивное αὐτός имеет усилительное значение; «Сам Давид» естественно передаёт акцент на личности Давида.
- source_word: λέγει αὐτὸν κύριον
  choice: называет Его Господом
  rationale: В этой предикативной конструкции λέγει означает «называет», а κύριον сохраняется как титул «Господь».
- source_word: καὶ πόθεν αὐτοῦ ἐστιν υἱός
  choice: Как же Он может быть его сыном?
  rationale: πόθεν буквально указывает на источник, но здесь выражает логическое недоумение; «как же… может быть» естественно передаёт риторическую силу вопроса, не снимая напряжения между «Господом» и «сыном».
- source_word: υἱός
  choice: сын
  rationale: «Сын» сохраняет словесную связь с мессианским наименованием «Сын Давида»; перевод «потомок» был бы пояснительным и ослабил бы риторический контраст.
- source_word: ὁ πολὺς ὄχλος
  choice: множество народа
  rationale: Выражение обозначает многочисленную толпу; выбранный вариант звучит достойно и не вводит социального смысла «простой народ».
- source_word: ἤκουεν αὐτοῦ
  choice: слушало Его
  rationale: Имперфект передаёт продолжающееся действие, а управление по-русски естественно выражается винительным падежом.
- source_word: ἡδέως
  choice: с удовольствием
  rationale: Наречие обозначает приятное, охотное восприятие; «с удовольствием» — ясный современный эквивалент.
theological_decisions:
- issue: Христологическое значение того, что Давид называет Мессию Господом
  choice: Сохранён прямой титул «Господь» и риторический вопрос без догматического пояснения.
  alternative: «Сам Давид называет Мессию Господом; в каком же смысле Он его сын?»
  rationale: Исходный текст создаёт напряжение между происхождением Мессии от Давида и Его превосходством над Давидом, но сам не разворачивает богословского объяснения.
- issue: Значение υἱός в контексте титула «Сын Давида»
  choice: сын
  alternative: потомок
  rationale: «Сын» сохраняет мессианскую формулировку и построенный на ней вопрос; примечание сообщает более широкий династический смысл.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимения, относящиеся к Иисусу, оформлены с прописной буквы по принятой русской библейской традиции. Порядок сносок [a][b] соответствует порядку их появления и маркировке.
