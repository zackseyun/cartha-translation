  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: ru
  text: Ведь все они клали из своего избытка, а она из своей нужды положила всё, что имела, — все свои средства к жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, на что ей оставалось жить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ
  choice: Ведь все они
  rationale: «Ведь» естественно передаёт пояснительную функцию γάρ и связывает стих с предшествующей оценкой Иисуса; «все они» сохраняет обобщение и акцент πάντες.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: из своего избытка
  rationale: Оборот обозначает средства сверх необходимого. «Из своего избытка» точно передаёт контраст с нуждой вдовы и звучит естественно по-русски.
- source_word: ἔβαλον
  choice: клали
  rationale: В контексте храмовой сокровищницы βάλλω описывает внесение монет. «Клали» сохраняет конкретность действия и согласуется с многократными пожертвованиями группы.
- source_word: αὕτη δὲ
  choice: а она
  rationale: Противительный союз «а» ясно противопоставляет вдову всем остальным без ненужного усиления.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: из своей нужды
  rationale: ὑστέρησις означает недостаток, нужду, лишение. «Из своей нужды» сохраняет прямой контраст с «избытком» и не сводит смысл только к формальному имущественному статусу.
- source_word: πάντα ὅσα εἶχεν
  choice: всё, что имела
  rationale: Передаёт всеохватность и эмфазу греческой конструкции естественным современным русским выражением.
- source_word: ἔβαλεν
  choice: положила
  rationale: Форма единственного числа описывает конкретный поступок вдовы; «положила» естественно обозначает внесение денег в сокровищницу.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: все свои средства к жизни
  rationale: В данном денежном контексте βίος обозначает средства существования, а не биологическую жизнь. Формулировка сохраняет экономический смысл и подчёркнутую полноту ὅλον.
theological_decisions:
- issue: Значение βίος в высказывании о приношении вдовы
  choice: средства к жизни
  alternative: всю свою жизнь
  rationale: Контекст посвящён денежному приношению, а βίος может обозначать имущество или средства существования. Перевод не утверждает, что вдова буквально отдала биологическую жизнь, но сохраняет радикальность того, что она лишилась всего, на что могла жить.
translation_notes:
  register: Современный литературный русский язык с простой, dignified синтаксической структурой. Сохранены пояснительная связь с предыдущим стихом, резкий контраст между избытком и нуждой и повтор глагола внесения пожертвования. Термин βίος раскрыт как средства существования; допустимый более разъяснительный вариант вынесен в сноску.
