lexical_decisions:
- source_word: καθίσας
  choice: сев
  rationale: Аористное причастие обозначает действие, предшествующее наблюдению; деепричастие «сев» естественно передаёт последовательность действий.
- source_word: κατέναντι
  choice: напротив
  rationale: Точно и естественно обозначает положение непосредственно по другую сторону, лицом к объекту.
- source_word: γαζοφυλάκιον
  choice: храмовая сокровищница
  rationale: Сохраняет общее значение греческого термина, который может обозначать храмовую сокровищницу или связанные с ней вместилища для пожертвований; уточнение «храмовая» ясно передаёт контекст.
- source_word: ἐθεώρει
  choice: наблюдал
  rationale: Имперфект указывает на продолжительное, внимательное наблюдение; русское несовершенное прошедшее сохраняет этот аспект.
- source_word: πῶς
  choice: как
  rationale: Сохраняет акцент на том, каким образом происходило пожертвование, не сводя смысл лишь к факту внесения денег.
- source_word: ὁ ὄχλος
  choice: народ
  rationale: В данном храмовом эпизоде «народ» естественно обозначает собравшихся людей и звучит литературнее, чем буквальное «толпа».
- source_word: βάλλει / ἔβαλλον
  choice: кладёт / клали
  rationale: В контексте внесения денег βάλλω идиоматически передаётся глаголом «класть»; настоящее время в первом случае и имперфект во втором отражены соответствующими русскими формами.
- source_word: χαλκόν
  choice: деньги
  rationale: Буквально слово обозначает медь или медную монету, но здесь употреблено собирательно о деньгах; «деньги» естественно передаёт функцию монет, не создавая ненужного акцента на металле.
- source_word: πολλοὶ πλούσιοι
  choice: многие богатые люди
  rationale: Передаёт множественное число и обобщённое обозначение состоятельных людей без неоправданного ограничения по полу.
- source_word: πολλά
  choice: большие суммы
  rationale: В денежном контексте нейтральное множественное πολλά означает значительное количество денег; «большие суммы» ясно и естественно выражает этот смысл.
