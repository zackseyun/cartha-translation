base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: ru
  text: 'Оставался у него ещё один — любимый сын.[a] Он послал его к ним последним, сказав: «Моего сына они будут уважать».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дорого любимый сын».'
    reason: Лексическая альтернатива для ἀγαπητόν, подчёркивающая глубокую любовь.
  - marker: b
    text: Греческий глагол может также означать «постыдятся моего сына» или «устыдятся перед моим сыном»; здесь имеется в виду, что они проявят к нему уважение.
    reason: Сохранение смыслового диапазона ἐντραπήσονται и объяснение контекстуального выбора.
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Оставался у него ещё один
  rationale: Передаёт, что после посланных слуг у хозяина оставался ещё один человек, которого можно было послать; русская конструкция естественно выражает и продолжение обладания, и значение последнего оставшегося.
- source_word: υἱὸν ἀγαπητόν
  choice: любимый сын
  rationale: «Любимый» точно и естественно передаёт ἀγαπητός, сохраняя значимость выражения и его созвучие другим упоминаниям любимого Сына в Евангелии от Марка без добавочного толкования.
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: Его он послал к ним последним
  rationale: Сохраняет акцент на сыне и передаёт ἔσχατον как указание на его последнее, кульминационное место в череде посланных.
- source_word: λέγων ὅτι
  choice: 'сказав: «…»'
  rationale: Прямая речь естественна для русского повествования и точно вводит ожидание хозяина.
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: Моего сына они будут уважать
  rationale: В данном контексте ἐντρέπομαι обозначает проявление уважения или почтения. Формулировка ясна современному читателю, а более буквальный оттенок стыда отмечен в сноске.
theological_decisions:
- issue: Христологическое звучание выражения «любимый сын»
  choice: Сохранить «любимый сын» без поясняющего расширения в основном тексте.
  alternative: единственный любимый сын; горячо любимый сын
  rationale: Фраза перекликается с более широким изображением Иисуса как любимого Сына у Марка, однако перевод не должен превращать это созвучие в явное толкование.
- issue: Значение реакции на сына в ἐντραπήσονται
  choice: Передать контекстуальное значение как «будут уважать».
  alternative: постыдятся моего сына; устыдятся перед моим сыном
  rationale: Глагол допускает оттенок стыда перед кем-либо, ведущего к почтительному отношению. Основной текст выражает ожидаемое поведение ясно, а сноска сохраняет лексическую напряжённость.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и dignified. Инверсия «Его он послал» сохраняет акцент исходного текста на сыне. Архаичное «постыдятся» не вынесено в основной текст из-за возможной неясности для современного читателя, но сохранено в сноске.
