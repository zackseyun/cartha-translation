  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: ru
  text: 'Подозвав к себе Своих учеников, Он сказал им: «Истинно говорю вам: эта бедная вдова положила больше всех, кто клал в сокровищницу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ящик для пожертвований». Греческое слово может обозначать храмовую сокровищницу или находившееся там вместилище для пожертвований.'
    reason: 'Лексическая альтернатива: термин допускает обозначение как сокровищницы, так и приёмного ящика или сосуда.'
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвав к себе
  rationale: 'Передаёт значение аористного причастия среднего залога: Иисус зовёт учеников приблизиться к Нему, прежде чем обратиться к ним; русское деепричастие естественно выражает сопутствующую и предшествующую основному высказыванию ситуацию.'
- source_word: μαθητὰς
  choice: учеников
  rationale: Общепринятый и естественный русский эквивалент, сохраняющий смысл последователей, которых наставляет Иисус.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную формулу удостоверения слов Иисуса и остаётся ясным для современного читателя.
- source_word: χήρα
  choice: вдова
  rationale: Прямой и однозначный русский эквивалент.
- source_word: πτωχὴ
  choice: бедная
  rationale: Передаёт обычное значение прилагательного, не усиливая его до «нищая» или «лишённая всего» сверх сказанного в данном стихе.
- source_word: πλεῖον πάντων
  choice: больше всех
  rationale: Кратко и близко к греческому передаёт сопоставление со всеми прочими жертвователями, не уточняя в самом переводе, в каком смысле её вклад был больше.
- source_word: ἔβαλεν
  choice: положила
  rationale: В контексте пожертвований βάλλω означает положить или опустить вклад; совершенный вид естественно передаёт завершённое действие вдовы.
- source_word: τῶν βαλλόντων
  choice: кто клал
  rationale: Несовершенный вид передаёт изображённое причастием продолжающееся или повторявшееся действие остальных жертвователей.
- source_word: γαζοφυλάκιον
  choice: сокровищницу
  rationale: Традиционный и достаточно широкий эквивалент для храмовой сокровищницы или находившегося там вместилища для пожертвований; предметное значение пояснено в сноске.
theological_decisions:
- issue: В каком смысле дар вдовы оказался больше
  choice: Сохранено буквальное сравнение «положила больше всех» без разъяснения его смысла в тексте стиха.
  alternative: Истолковать сравнение как указание на большую относительную жертвенность, а не на большую денежную сумму.
  rationale: Следующий стих объясняет оценку Иисуса бедностью вдовы и тем, что она отдала всё, однако данный стих сам по себе оставляет основание сравнения невыраженным. Перевод сохраняет эту смысловую напряжённость и не подменяет слова Иисуса толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула «Истинно говорю вам» сохраняет торжественность оригинала. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой; синтаксис при этом остаётся современным и понятным.
