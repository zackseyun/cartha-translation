  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: ru
  text: И второй женился на ней[a] и умер, не оставив потомства; так же и третий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взял её». Здесь имеется в виду: взял её в жёны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: второй
  rationale: Субстантивированное порядковое числительное; «брат» понятен из контекста, но в самой фразе не выражен.
- source_word: ἔλαβεν αὐτήν
  choice: женился на ней
  rationale: Буквально — «взял её», однако в контексте левиратного брака это устойчиво означает взять женщину в жёны; по-русски «женился на ней» ясно и естественно.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямая передача простого повествовательного глагола без эвфемизма.
- source_word: μὴ καταλιπὼν
  choice: не оставив
  rationale: Деепричастный оборот естественно передаёт греческое причастие и его сопутствующий результат.
- source_word: σπέρμα
  choice: потомства
  rationale: В данном контексте слово обозначает детей или продолжение рода, а не буквальное «семя»; «потомство» сохраняет собирательность и не сужает смысл до одного ребёнка.
- source_word: ὁ τρίτος ὡσαύτως
  choice: так же и третий
  rationale: 'Сохранена краткая эллиптическая конструкция: повтор совершённых действий понятен из контекста.'
theological_decisions: []
