  text: Они взяли его, убили и выбросили его из виноградника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые читатели могут ожидать последовательность «выбросили его из виноградника и убили» по параллельным изложениям притчи, однако греческий текст Марка здесь гласит: «убили его и выбросили его из виноградника».'
