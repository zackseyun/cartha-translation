lexical_decisions:
- source_word: λαβόντες
  choice: схватив его
  rationale: Аористное причастие передаёт предшествующее действие. В данном контексте «схватив» естественно выражает насильственный захват, не утяжеляя стремительную последовательность событий.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Прямой и ясный современный эквивалент ἀποκτείνω, сохраняющий резкость повествования.
- source_word: ἐξέβαλον
  choice: выбросили
  rationale: Передаёт сильное значение ἐκβάλλω и естественно сочетается с указанием движения из виноградника; местоимение «его» по-русски не повторяется, поскольку объект однозначно сохраняется.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: из виноградника
  rationale: После глагола движения русское «из виноградника» естественно передаёт удаление за его пределы.
- source_word: ἀμπελῶνος
  choice: виноградника
  rationale: Стандартный русский эквивалент ἀμπελών в контексте притчи.
theological_decisions:
- issue: Порядок убийства и изгнания в притче
  choice: 'Сохранена последовательность греческого текста: сначала они убили его, затем выбросили из виноградника.'
  alternative: В согласовании с параллельной традицией можно было бы поставить изгнание перед убийством.
  rationale: SBLGNT в Мк. 12:8 недвусмысленно располагает ἀπέκτειναν перед ἐξέβαλον; перевод не гармонизирует Марка с параллельными изложениями и сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык; краткая, энергичная и достойная повествовательная формулировка. Причастный оборот сохраняет структуру греческой последовательности, а повтор объекта устранён как неестественный для русского языка.
