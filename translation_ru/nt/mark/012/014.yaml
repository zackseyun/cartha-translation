  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: ru
  text: 'Они пришли и сказали Ему: «Учитель, мы знаем, что Ты правдив и не считаешься ни с чьим мнением, ведь Ты не смотришь на положение людей,[a] но истинно учишь Божьему пути. Позволительно ли платить кесарю подушный налог или нет? Платить ли нам его[b] или не платить?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не смотришь на лицо людей»; то есть не проявляешь пристрастия и не судишь по положению или внешнему впечатлению.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о римском подушном налоге, взимавшемся имперской властью.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Естественное и общепринятое обращение к наставнику в современном русском языке.
- source_word: ἀληθὴς
  choice: правдив
  rationale: Передаёт качество человека, говорящего истину, и естественно звучит в именной части сказуемого.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: не считаешься ни с чьим мнением
  rationale: В контексте передаёт независимость Иисуса от человеческого давления, не создавая впечатления, будто Он безразличен к людям.
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: не смотришь на положение людей
  rationale: 'Передаёт идиоматический смысл: Иисус не руководствуется общественным положением или влиятельностью человека; буквальный образ отмечен в сноске.'
- source_word: ἐπ’ ἀληθείας
  choice: истинно
  rationale: Сохраняет наречное значение и торжественный библейский регистр без архаизации.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: пути Божьему
  rationale: Сохраняет библейский образ пути и естественное русское управление глагола «учить».
- source_word: ἔξεστιν
  choice: Позволительно ли
  rationale: Передаёт вопрос о религиозно-нравственной допустимости, не сводя его исключительно к римскому законодательству.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: платить подать кесарю
  rationale: «Платить» естественно передаёт действие, κῆνσος обозначает римскую подушную подать, а «кесарь» сохраняет традиционное русское обозначение титула.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Платить нам её или не платить?
  rationale: Сохраняет резкое повторение вопроса; местоимение ясно указывает на подать.
theological_decisions:
- issue: Смысл выражений о независимости от людей и взгляде на их лицо
  choice: 'Передать идиоматически: «не считаешься ни с чьим мнением… не смотришь на положение людей»'
  alternative: 'Буквально: «Тебе нет дела ни до кого… не смотришь на лицо людей»'
  rationale: 'Буквальный русский текст может ошибочно приписать Иисусу безразличие к людям. Идиоматический перевод сохраняет смысл лести собеседников: Он не поддаётся влиянию и не проявляет пристрастия по статусу.'
- issue: Характер вопроса ἔξεστιν
  choice: «Позволительно ли»
  alternative: «Законно ли»
  rationale: Формулировка сохраняет намеренную широту вопроса — допустимо ли это перед Богом и законом — и не решает заранее, о каком именно законе идёт речь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные местоимения, относящиеся к Иисусу, использованы по устойчивой русской библейской традиции; синтаксис остаётся понятным обычному читателю.
