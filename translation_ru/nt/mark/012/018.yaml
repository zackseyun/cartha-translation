source:
  edition: SBLGNT
  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: ru
  text: 'И пришли к Нему саддукеи, которые говорят, что воскресения нет, и стали спрашивать Его:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: саддукеи
  rationale: Устоявшееся русское название иудейской религиозно-политической группы.
- source_word: ἀνάστασιν
  choice: воскресения
  rationale: В данном контексте обозначает воскресение мёртвых; краткая формулировка сохраняет форму и смысл греческого текста.
- source_word: ἐπηρώτων
  choice: стали спрашивать
  rationale: Имперфект передаёт начавшееся и разворачивающееся действие; такой перевод естественен по-русски и согласуется с последующим изложением вопроса.
- source_word: λέγοντες
  choice: '[двоеточие]'
  rationale: Русское двоеточие естественно вводит последующую прямую речь и передаёт функцию причастия без тяжеловесного «говоря».
theological_decisions:
- issue: Отрицание воскресения саддукеями
  choice: «которые говорят, что воскресения нет»
  alternative: «которые утверждают, что нет воскресения мёртвых»
  rationale: Сохранена лаконичность исходного текста и его настоящее время; уточнение «мёртвых» контекстуально верно, но отсутствует в данном стихе и потому не добавлено.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Заглавные местоимения «Нему», «Его» следуют привычной русской издательской норме при указании на Иисуса; двоеточие подготавливает прямую речь следующего стиха.
