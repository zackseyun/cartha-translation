  source_fidelity: 'Текст точно передаёт состав и смысл греческого оригинала: Καὶ — «И», ἔρχονται — «пришли» в естественном русском повествовательном оформлении, Σαδδουκαῖοι — «саддукеи», отрицание ἀνάστασιν μὴ εἶναι — «что воскресения нет». «Стали спрашивать» удачно отражает имперфект ἐπηρώτων как начавшееся и продолжающееся действие и соответствует английскому аудиторскому варианту «began questioning».'
