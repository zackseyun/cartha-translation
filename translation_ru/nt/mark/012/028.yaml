source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: ru
  text: 'Один из книжников подошёл и, услышав, как они спорят, и увидев, что Он хорошо им ответил, спросил Его: «Какая заповедь — первая из всех[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главная из всех»; «самая важная из всех».'
    reason: Лексема πρώτη может обозначать не только первую по порядку, но и первейшую по рангу или значимости.
lexical_decisions:
- source_word: γραμματέων
  choice: книжников
  rationale: В евангельском контексте γραμματεύς обозначает признанного знатока и толкователя иудейского Закона; «книжник» — прямой и устоявшийся русский эквивалент.
- source_word: προσελθὼν
  choice: подошёл
  rationale: Передаёт движение к Иисусу естественным современным русским глаголом.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: услышав, как они спорят
  rationale: συζητέω может обозначать обсуждение, прение или спор; здесь речь идёт о публичном обмене мнениями по спорным вопросам, поэтому «спорят» передаёт контекст без добавления открытой враждебности.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: увидев, что Он хорошо им ответил
  rationale: Сохраняет значение восприятия и прямо передаёт наречие καλῶς как «хорошо», не усиливая его до «правильно».
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Простой и естественный эквивалент ἐπερωτάω в данном контексте.
- source_word: Ποία
  choice: Какая
  rationale: Вопрос направлен на выделение одной заповеди среди остальных; «какая» естественно выражает это по-русски.
- source_word: ἐντολή
  choice: заповедь
  rationale: Традиционный и точный русский эквивалент в контексте Моисеева Закона.
- source_word: πρώτη πάντων
  choice: первая из всех
  rationale: Сохраняет буквальный образ первенства в греческом тексте и не устраняет возможный смысл первенства по значимости.
theological_decisions:
- issue: Значение πρώτη в вопросе о заповеди
  choice: первая из всех
  alternative: главная из всех; самая важная из всех
  rationale: πρώτη буквально означает «первая», но может указывать на высший ранг или значимость. Основной текст сохраняет эту смысловую напряжённость, а примечание сообщает более явные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет последовательность действий исходного текста, оставаясь понятным обычному читателю.
