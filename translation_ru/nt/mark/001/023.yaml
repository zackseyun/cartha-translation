lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для Марка стремительность повествования и звучит естественно в современном литературном русском языке.
- source_word: ἦν
  choice: оказался
  rationale: В данном контексте естественно выражает присутствие ранее не названного человека в синагоге, не привнося идеи внезапного появления.
- source_word: συναγωγῇ αὐτῶν
  choice: в их синагоге
  rationale: Сохраняет как конкретное значение συναγωγή в иудейском контексте, так и местоимение αὐτῶν.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Обычное и точное русское соответствие; дальнейшее местоимение мужского рода согласуется с мужским референтом.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: с нечистым духом
  rationale: Естественно передаёт связь человека с нечистым духом, сохраняя сдержанность греческого выражения и не добавляя истолковывающее «одержимый».
- source_word: ἀκαθάρτῳ
  choice: нечистым
  rationale: Традиционное и контекстуально точное соответствие, сохраняющее религиозно-нравственные оттенки слова.
- source_word: ἀνέκραξεν
  choice: закричал
  rationale: Передаёт громкий возглас и начало единичного речевого действия; двоеточие естественно вводит слова следующего стиха.
theological_decisions:
- issue: Передача выражения ἐν πνεύματι ἀκαθάρτῳ
  choice: с нечистым духом
  alternative: во власти нечистого духа; одержимый нечистым духом
  rationale: Формулировка ясно сообщает о связи с нечистым духом, но не усиливает исходное выражение более определённой концепцией «одержимости» или власти духа.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Тотчас» поддерживает повторяющийся у Марка динамичный ритм; «синагога» и «нечистый дух» сохраняют устойчивую евангельскую лексику.
