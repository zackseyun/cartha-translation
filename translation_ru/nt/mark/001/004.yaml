  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: ru
  text: Иоанн Креститель явился в пустыне и провозглашал крещение покаяния для прощения грехов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: явился
  rationale: В повествовании Марка эта форма вводит Иоанна на сцену; «явился» естественно передаёт данный смысл, не прибегая к буквальному «стал быть».
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Иоанн Креститель
  rationale: Устоявшееся русское именование естественно передаёт субстантивированное причастие «крестящий» и сохраняет указание на роль Иоанна.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: «Пустыня» — естественный библейский и географический эквивалент, не обязательно обозначающий песчаную пустыню.
- source_word: κηρύσσων
  choice: провозглашал
  rationale: Глагол передаёт публичное возвещение с оттенком речи глашатая; несовершенный вид уместно обозначает продолжающееся служение.
- source_word: βάπτισμα μετανοίας
  choice: крещение покаяния
  rationale: 'Сохраняется компактная и намеренно не до конца конкретизированная генитивная связь: крещение, характеризуемое покаянием.'
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: для прощения грехов
  rationale: Формулировка естественно передаёт направленность или результат, не навязывая более узкого догматического толкования; множественное число «грехов» сохранено.
theological_decisions:
- issue: Связь крещения, покаяния и прощения
  choice: «крещение покаяния для прощения грехов»
  alternative: «крещение в знак покаяния, ведущее к прощению грехов»
  rationale: Греческий текст связывает эти понятия, но сам по себе не требует определить крещение как исключительно символическое, инструментальное или декларативное. Выбранная формулировка сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Устоявшееся «Иоанн Креститель» предпочтено буквальному, но менее естественному «Иоанн Крестящий». Союз «и» естественно связывает появление Иоанна с его продолжающимся возвещением.
