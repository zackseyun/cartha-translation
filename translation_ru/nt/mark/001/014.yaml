  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: ru
  text: После того как Иоанн был предан[a], Иисус пришёл в Галилею, возвещая Благую весть Божью[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того как Иоанн был арестован». Буквальнее греческий текст говорит, что Иоанн «был предан»; тот же глагол позднее употребляется у Марка в рассказе о предании Иисуса.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Евангелие Божье».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «Благая весть Божья» может означать весть, которая исходит от Бога, принадлежит Богу или сосредоточена на Боге.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: после того как … был предан
  rationale: Оборот с μετά и субстантивированным инфинитивом имеет временное значение. «Был предан» сохраняет более широкий смысл враждебной передачи и словесную связь с последующим рассказом Марка о страданиях Иисуса; «был арестован» яснее описывает ситуацию, но сужает значение.
- source_word: Ἰωάννην
  choice: Иоанн
  rationale: Устоявшаяся русская форма имени Ἰωάννης.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Естественная передача аориста ἔρχομαι без добавления оттенка завершённого прибытия.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Предлог εἰς обозначает движение в направлении области или внутрь неё; русское «в Галилею» естественно сохраняет эту направленность.
- source_word: κηρύσσων
  choice: возвещая
  rationale: κηρύσσω означает публично провозглашать как вестник. «Возвещая» передаёт это значение и не сужает действие до церковной проповеди.
- source_word: εὐαγγέλιον
  choice: Благую весть
  rationale: Передаёт прозрачное лексическое значение εὐαγγέλιον на современном русском языке; прописная буква указывает на особый характер вести в данном контексте, не заменяя её менее понятным церковным термином.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: 'Родительный падеж сохраняет широту греческого генитива: это может быть весть, исходящая от Бога, принадлежащая Ему или имеющая Его своим содержательным центром.'
theological_decisions:
- issue: Передача παραδοθῆναι в связи с повторяющейся у Марка лексикой страстей
  choice: был предан
  alternative: был арестован
  rationale: Марк неоднократно употребляет παραδίδωμι для враждебной передачи, в том числе применительно к Иисусу. «Был предан» сохраняет эту повествовательную перекличку, не уточняя сверх текста, кому именно и каким образом передали Иоанна.
- issue: Значение генитива в τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Благая весть Бога
  alternative: Благая весть от Бога; Благая весть о Боге
  rationale: Греческий генитив допускает несколько взаимосвязанных смыслов. Русская конструкция с родительным падежом оставляет их открытыми, не выбирая без необходимости только источник или только содержание вести.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; причастная конструкция κηρύσσων передана деепричастием «возвещая». Формулировки не вводят конфессионально специфических толкований и сохраняют смысловую широту оригинала.
