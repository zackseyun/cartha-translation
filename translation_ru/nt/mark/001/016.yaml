  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: ru
  text: Проходя вдоль Галилейского моря, Он увидел Симона и Андрея, брата Симона, закидывавших сеть в море, потому что они были рыбаками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: проходя вдоль моря
  rationale: Причастие настоящего времени передаёт действие, одновременное с εἶδεν, а παρά с винительным указывает на движение вдоль берега. Русский деепричастный оборот естественно сохраняет эту связь.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Галилейское море
  rationale: Сохраняется традиционное и узнаваемое русское географическое название, соответствующее греческому θάλασσα, хотя географически это озеро.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямое соответствие аористу ὁράω без добавления оттенка намеренного наблюдения.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Симона и Андрея
  rationale: Имена переданы в установившейся русской библейской форме и поставлены в винительный падеж согласно синтаксису.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: брата Симона
  rationale: Приложение относится к Андрею; краткая русская конструкция сохраняет семейную идентификацию без лишнего повтора имени.
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: закидывавших сеть в море
  rationale: Глагол обозначает забрасывание рыболовной сети; слово «сеть» эксплицирует заложенный в глаголе предмет. «В море» естественно передаёт направленность действия в русском контексте.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: потому что они были рыбаками
  rationale: γάρ вводит пояснение их занятию. «Потому что» ясно и естественно выражает причинно-пояснительную связь в современном русском языке.
