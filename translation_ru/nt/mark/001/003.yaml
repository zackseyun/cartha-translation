lexical_decisions:
- source_word: φωνὴ
  choice: Голос
  rationale: В данном контексте φωνή означает «голос». Русский язык не требует выражать отсутствие артикля неопределённым местоимением.
- source_word: βοῶντος
  choice: взывающего
  rationale: Причастие в родительном падеже зависит от φωνή; «взывающего» передаёт громкий, настойчивый характер провозглашения и сохраняет достоинство пророческой цитаты.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: ἔρημος обозначает пустынную, безлюдную местность; «в пустыне» естественно соответствует и контексту Марка, и цитате из Исаии.
- source_word: Ἑτοιμάσατε
  choice: Приготовьте
  rationale: Аористный императив во множественном числе выражает прямой призыв к решительному действию; «приготовьте» звучит ясно и естественно.
- source_word: τὴν ὁδὸν κυρίου
  choice: путь Господу
  rationale: Хотя родительный κυρίου формально допускает «путь Господа», сочетание означает путь, приготовляемый для прихода Господа; дательный «Господу» естественно передаёт это по-русски, сохраняя образ пути.
- source_word: εὐθείας ποιεῖτε
  choice: прямыми сделайте
  rationale: εὐθείας здесь означает «прямыми», а ποιεῖτε — «делайте»; порядок слов сохраняет акцент на требуемом качестве троп и звучит как параллельная поэтическая строка.
- source_word: τὰς τρίβους αὐτοῦ
  choice: Его тропы
  rationale: τρίβος — «тропа, путь»; множественное число сохранено. Местоимение «Его» относится к Господу.
theological_decisions:
- issue: Передача κύριος в цитате из Исаии, где еврейский текст говорит о YHWH
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной текст следует греческому κυρίου и передаёт его обычным титулом «Господь». Связь с именем YHWH в Ис 40:3 обозначена в примечании, без подмены формы греческой цитаты.
- issue: Синтаксическое присоединение слов «в пустыне»
  choice: к «взывающего»
  alternative: к повелению «приготовьте путь Господу»
  rationale: 'В греческой фразе Марка слова ἐν τῇ ἐρήμῳ естественнее относятся к βοῶντος: «взывающего в пустыне». Иная пунктуация цитаты из Исаии возможна и сохранена в примечании.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром пророческой цитаты. «Взывающего» сохраняет торжественную силу без архаической грамматики; «приготовьте» и «сделайте» понятны широкому читателю. Прописная буква в «Его» употреблена как традиционный русский способ обозначить отнесённость местоимения к Господу.
