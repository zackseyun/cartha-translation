id: MRK.1.40
reference: Mark 1:40
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: ru
  text: 'И приходит к Нему человек, больной проказой[a], умоляет Его, становится перед Ним на колени и говорит Ему: «Если Ты хочешь, то можешь очистить меня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «прокажённый». Греческое слово могло обозначать различные тяжёлые кожные заболевания, а не только болезнь, которую сегодня называют проказой.
    reason: lexical_alternative
  - marker: b
    text: То есть сделать чистым. Речь может идти как о телесном восстановлении, так и об очищении от ритуальной нечистоты.
    reason: semantic_clarification
lexical_decisions:
- source_word: λεπρὸς
  choice: человек, больной проказой
  rationale: Субстантивированное прилагательное обозначает человека с тяжёлым кожным заболеванием. Личностная формулировка естественна для современного русского языка и не сводит человека к его болезни.
- source_word: παρακαλῶν
  choice: умоляет Его
  rationale: В данном контексте глагол передаёт настойчивую личную просьбу; «умоляет» звучит естественно и соответствует силе обращения.
- source_word: γονυπετῶν
  choice: становится перед Ним на колени
  rationale: Передаёт принятие коленопреклонённой позы и яснее звучит по-русски, чем буквальное причастие.
- source_word: Ἐὰν θέλῃς
  choice: Если Ты хочешь
  rationale: Сохраняет условность и акцент на желании или готовности Иисуса, не превращая выражение в указание на будущее.
- source_word: δύνασαί
  choice: можешь
  rationale: Обычная русская форма прямо выражает способность и силу совершить действие.
- source_word: καθαρίσαι
  choice: очистить меня
  rationale: Сохраняет лексику очищения, которая допускает одновременно физический и связанный с ритуальной нечистотой смысл; не заменяется более узким «исцелить».
- source_word: ἔρχεται
  choice: приходит
  rationale: Настоящее время сохраняет характерное для Марка живое историческое настоящее.
theological_decisions:
- issue: Характер очищения при кожном заболевании
  choice: очистить меня
  alternative: исцелить меня
  rationale: В греческом тексте употреблён глагол очищения, а не обычный глагол исцеления. Выбранный вариант сохраняет напряжение между телесным восстановлением и устранением ритуальной нечистоты.
translation_notes:
  register: Современный литературный русский язык с живым историческим настоящим. Обращение к Иисусу оформлено с прописной буквы согласно принятой русской библейской традиции. Синтаксис слегка разгружен по сравнению с цепочкой греческих причастий, но последовательность действий и повторное «Ему» сохранены.
