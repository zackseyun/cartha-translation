  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: ru
  text: Они изумлялись Его учению, ибо Он учил их как тот, кто имеет власть, а не как книжники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: изумлялись
  rationale: Передаёт сильное удивление; несовершенный вид естественно отражает длительную реакцию, выраженную греческим имперфектом.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: Его учению
  rationale: «Учение» в данном контексте может обозначать как содержание, так и характер наставления Иисуса и звучит естественно в современном русском языке.
- source_word: ἦν γὰρ διδάσκων
  choice: потому что Он учил
  rationale: Русский глагол несовершенного вида «учил» естественно передаёт продолжающееся действие перифрастической греческой конструкции; «потому что» ясно выражает причинное γάρ.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: как имеющий власть
  rationale: Сохраняет сравнительную структуру с ὡς и не сводит ἐξουσία лишь к манере уверенной речи.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и точный русский термин для иудейских знатоков и толкователей Писания и Закона; пояснительное «учители закона» было бы более интерпретирующим.
theological_decisions:
- issue: Природа власти Иисуса в противопоставлении книжникам
  choice: Описательно передать, что Иисус учил как имеющий власть, не уточняя её источник.
  alternative: «Он учил с божественной властью»
  rationale: Стих подчёркивает отличие Иисуса от книжников, но в этом предложении прямо не определяет источник или природу Его власти; уточнение «божественной» внесло бы в перевод вывод, не выраженный эксплицитно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Он» применительно к Иисусу написано с прописной буквы согласно устойчивой русской библейской традиции. Добавлен явный субъект «люди», поскольку без него русское предложение звучало бы обрывочно; он представляет присутствующих слушателей, подразумеваемых формой греческого глагола во множественном числе.
