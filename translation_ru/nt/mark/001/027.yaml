  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: ru
  text: 'И все изумились, так что стали обсуждать между собой: «Что это? Новое учение — с властью![a] Он даже нечистым духам повелевает, и они повинуются Ему».


    [a] Или: «Что это? Что это за новое учение с властью?» Греческий текст допускает такое членение фразы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что это? Что это за новое учение с властью?» Греческий текст допускает такое членение фразы.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν ἅπαντες
  choice: все изумились
  rationale: «Изумились» естественно передаёт сильное потрясение и удивление, выраженное ἐθαμβήθησαν, а «все» сохраняет усиленное указание ἅπαντες на всеобщность реакции.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: так что стали обсуждать между собой
  rationale: Оборот с ὥστε и инфинитивом выражает результат; «стали обсуждать» естественно передаёт возникшее вследствие изумления взаимное обсуждение, не придавая ему обязательно спорного характера.
- source_word: Τί ἐστιν τοῦτο;
  choice: Что это?
  rationale: Краткий прямой вопрос сохраняет внезапность реакции и не добавляет толкования вроде «Что это значит?».
- source_word: διδαχὴ καινή
  choice: новое учение
  rationale: «Учение» — современный и контекстуально уместный эквивалент διδαχή; «доктрина» звучала бы излишне технически.
- source_word: κατ’ ἐξουσίαν
  choice: наделённое властью
  rationale: Формулировка естественно связывает выражение с «новым учением», но сноска сохраняет допустимую синтаксическую неоднозначность. «Власть» передаёт реальное право и силу повелевать, а не просто убедительность речи.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: нечистым духам
  rationale: Традиционное и понятное выражение сохраняет религиозно-нравственный оттенок ἀκάθαρτος, не смягчая его до «нечистых/нечистых в физическом смысле» благодаря устойчивому сочетанию.
- source_word: ἐπιτάσσει
  choice: повелевает
  rationale: «Повелевает» передаёт властный характер приказа и поддерживает смысловую связь с ἐξουσία.
- source_word: ὑπακούουσιν αὐτῷ
  choice: они повинуются Ему
  rationale: «Повинуются» точно выражает послушный отклик на властное повеление; местоимение сохраняет личную направленность действия.
theological_decisions:
- issue: Синтаксическая связь κατ’ ἐξουσίαν
  choice: 'Связать в основном с предшествующим выражением: «Новое учение, наделённое властью!»'
  alternative: «Что это? Что это за новое учение? Он властно повелевает даже нечистым духам…» либо отнести «с властью» преимущественно к глаголу «повелевает».
  rationale: Греческий текст допускает разное членение и пунктуацию. Основной вариант даёт естественную русскую реплику и подчёркивает властность учения, а сноска прямо сохраняет возможность вопросительного членения и связи характеристики власти с последующим повелением.
- issue: Смысл ἐξουσία
  choice: Передать как «власть»
  alternative: «Авторитет» или «властно»
  rationale: В контексте изгнания нечистого духа речь идёт не только о впечатляющей манере преподавания, но и о действенном праве повелевать. «Власть» сохраняет эту богословски значимую широту без дальнейшего догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Реплика толпы остаётся краткой и живой. «Наделённое властью» несколько приподнято, но понятно обычному читателю и помогает избежать возможного понимания «авторитетного учения» лишь как уважаемого или убедительного.
