base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: ru
  text: 'Как написано у пророка Исаии[a]: «Вот, я посылаю моего вестника перед тобой[c], который приготовит твой путь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «у пророков» вместо «у пророка Исаии».'
    reason: textual_variant
  - marker: b
    text: В цитате соединены формулировки из Мал 3:1 и Ис 40:3.
    reason: cross_reference
  - marker: c
    text: 'Буквально: «перед лицом твоим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Как
  rationale: Естественно вводит соответствие между началом благой вести и последующим свидетельством Писания; отдельное «точно так же, как» здесь по-русски избыточно.
- source_word: γέγραπται
  choice: написано
  rationale: Обычная русская формула цитирования Писания, передающая сохраняющий силу результат перфекта.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: у пророка Исаии
  rationale: Естественная современная русская формула ссылки на пророческую книгу без добавления отсутствующего в греческом слова «книга».
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет призыв обратить внимание и торжественный пророческий тон, оставаясь понятным в современном русском.
- source_word: ἀποστέλλω
  choice: Я посылаю
  rationale: Прямо передаёт настоящее время и уместно звучит как торжественное пророческое изречение.
- source_word: ἄγγελόν
  choice: вестника
  rationale: В контексте речь идёт о посланнике-предтече; «вестник» сохраняет значение порученной миссии и не создаёт ошибочного впечатления, будто обязательно имеется в виду небесный ангел.
- source_word: πρὸ προσώπου σου
  choice: перед Тобой
  rationale: Естественно передаёт греческий пространственный оборот; буквальное «перед лицом Твоим» отмечено в сноске.
- source_word: κατασκευάσει
  choice: приготовит
  rationale: Передаёт значение подготовки и хорошо сочетается с образом пути.
- source_word: τὴν ὁδόν σου
  choice: Тебе путь
  rationale: Естественный русский порядок слов сохраняет образ пути и смысл «приготовит твой путь / путь для тебя», не устраняя возможный оттенок принадлежности.
theological_decisions:
- issue: В формуле цитирования назван Исаия, хотя первая часть цитаты близка к Мал 3:1, а продолжение — к Ис 40:3.
  choice: Сохранить в основном тексте «у пророка Исаии».
  alternative: «у пророков»
  rationale: Основной текст SBLGNT называет Исаию; композиционное напряжение не следует устранять гармонизацией. Разночтение и составной характер цитаты указаны в сносках.
- issue: Определение ἄγγελος может обозначать как ангела, так и посланника.
  choice: вестник
  alternative: ангел
  rationale: Ближайший контекст представляет человеческого предтечу, а фон Мал 3:1 поддерживает функциональное значение «вестник» без привнесения утверждения о небесной природе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные буквы в местоимениях внутри прямой речи обозначают обращение Бога к Мессии и служат русской издательской конвенцией; сами по себе они не снимают смыслового напряжения текста. Маркеры сносок размещены непосредственно при соответствующих выражениях.
