base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: ru
  text: 'И с небес[a] раздался голос: «Ты — Мой возлюбленный Сын; в Тебе Моё благоволение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с неба». В греческом тексте употреблено множественное число: «с небес».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Тебе Я благоволил»; возможный смысл: «Ты Мне угоден».'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: раздался голос
  rationale: По-русски это естественно передаёт возникновение и звучание голоса; буквальное «голос произошёл» было бы неидиоматичным.
- source_word: ἐκ τῶν οὐρανῶν
  choice: с небес
  rationale: Сохраняется множественное число греческого οὐρανῶν, а сочетание «с небес» естественно для современного литературного русского языка.
- source_word: Σὺ εἶ
  choice: Ты —
  rationale: Явное местоимение сохраняет прямоту и акцент обращения; именная конструкция с тире естественна по-русски.
- source_word: ὁ υἱός μου
  choice: Мой возлюбленный Сын
  rationale: Притяжательное местоимение передано естественным русским порядком слов. Заглавная буква указывает на уникальный христологический референт в контексте, не добавляя отсутствующего в тексте титула.
- source_word: ὁ ἀγαπητός
  choice: возлюбленный
  rationale: Слово точно передаёт любовь и сохраняет торжественный, но понятный современному читателю регистр.
- source_word: ἐν σοὶ
  choice: в Тебе
  rationale: Сохраняется непосредственное значение предлога ἐν и образная формулировка исходного текста, хотя по-русски возможно также «Ты Мне угоден».
- source_word: εὐδόκησα
  choice: Я нахожу отраду
  rationale: Формулировка передаёт благоволение и удовольствие Бога в естественной русской форме. Настоящее время выражает актуальную силу провозглашения; возможное более строгое отражение аориста отмечено в сноске.
theological_decisions:
- issue: Передача обращения Бога к Иисусу без ослабления его христологической силы
  choice: Мой возлюбленный Сын
  alternative: Мой Сын, Возлюбленный; Мой любимый Сын
  rationale: Перевод сохраняет как сыновнее тождество, так и любовь Отца, не вводя позднейшей догматической терминологии.
- issue: Передача εὐδόκησα и временного оттенка аориста
  choice: в Тебе Я нахожу отраду
  alternative: в Тебе Я обрёл отраду; Ты Мне угоден
  rationale: Основной текст сохраняет конструкцию «в Тебе» и актуальную силу небесного провозглашения. Сноска оставляет открытыми возможные оттенки завершённого действия и благоволения.
- issue: Сохранение множественного числа οὐρανῶν
  choice: с небес
  alternative: с неба
  rationale: Множественное число оригинала естественно звучит по-русски и потому не требует сглаживания до традиционного единственного числа.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для божественного провозглашения. «Возлюбленный» сохраняет торжественность без архаической грамматики; «раздался голос» звучит естественно и ясно.
