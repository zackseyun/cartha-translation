  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: ru
  text: А тёща Симона лежала в лихорадке, и ему сразу же сказали о ней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорят ему о ней». В греческом тексте употреблено историческое настоящее, придающее повествованию живость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ Σίμωνος
  choice: тёща Симона
  rationale: πενθερά обозначает мать супруга или супруги; применительно к мужчине естественный и точный русский термин — «тёща».
- source_word: κατέκειτο
  choice: лежала
  rationale: Имперфект передаёт продолжавшееся состояние; «лежала» сохраняет это значение, не усиливая его до «была прикована к постели».
- source_word: πυρέσσουσα
  choice: в лихорадке
  rationale: Причастие означает, что она страдала от жара или лихорадки. Выражение «лежала в лихорадке» естественно по-русски и не добавляет отсутствующей в тексте степени тяжести.
- source_word: εὐθὺς
  choice: сразу же
  rationale: Передаёт незамедлительность и характерный для повествования Марка быстрый темп.
- source_word: λέγουσιν αὐτῷ
  choice: ему сказали
  rationale: В основном тексте историческое настоящее передано естественным для русского повествования прошедшим временем; форма исходного текста отмечена в сноске.
- source_word: περὶ αὐτῆς
  choice: о ней
  rationale: Краткий и естественный русский эквивалент оборота περί с родительным падежом.
- source_word: δὲ
  choice: А
  rationale: Частица обозначает мягкий переход к следующему обстоятельству повествования, без сильного противопоставления.
theological_decisions: []
