  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: ru
  text: И вот, в те дни Иисус пришёл из Назарета в Галилее и был крещён Иоанном в Иордане[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Иордан». Греческий предлог может быть передан более буквально, с указанием направления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: И случилось
  rationale: Естественно передаёт повествовательную переходную формулу, сохраняя её событийную функцию без архаичного «и было».
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в те дни
  rationale: Прямое и стилистически достойное соответствие временному обороту.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Передаёт основное значение глагола движения без дополнительного акцента на достижении конечной точки.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Устоявшаяся русская форма имени.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: из Назарета Галилейского
  rationale: Естественная русская библейская формула, точно указывающая, к какой области относится Назарет.
- source_word: ἐβαπτίσθη
  choice: был крещён
  rationale: Точно передаёт страдательный аорист и сохраняет общепринятую русскую терминологию, не сужая значение до конфессионально значимого описания способа крещения.
- source_word: εἰς τὸν Ἰορδάνην
  choice: в Иордане
  rationale: В контексте крещения русское местное выражение звучит естественно; более буквальное направление «в Иордан» сохранено в сноске как реальная возможность греческого предлога.
- source_word: ὑπὸ Ἰωάννου
  choice: Иоанном
  rationale: Творительный падеж естественно выражает личного деятеля при страдательной конструкции.
theological_decisions:
- issue: Передача βαπτίζω в конфессионально чувствительном контексте
  choice: был крещён
  alternative: был погружён
  rationale: «Был крещён» верно называет событие и не навязывает более узкое толкование способа совершения обряда.
- issue: Пространственное значение εἰς при крещении
  choice: в Иордане
  alternative: в Иордан
  rationale: Основной текст следует естественной русской речи и понимает Иордан как место действия, а сноска сохраняет возможный направительный оттенок греческой конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Двоеточие после вводной формулы делает длинное предложение ясным и естественным; порядок слов удерживает Иоанна рядом с глаголом, а место крещения — в финальной позиции.
