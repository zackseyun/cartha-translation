source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: ru
  text: 'И говорит ему: «Смотри, никому ничего не говори. Но пойди, покажись священнику и принеси за своё очищение то, что повелел Моисей, — им во свидетельство[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «им как доказательство»; речь может идти о свидетельстве, предъявленном священникам или другим людям. Некоторые понимают эти слова более резко: «во свидетельство против них».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Смотри
  rationale: Императив вводит строгое предостережение; «смотри» естественно передаёт его силу в современной русской речи.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: никому ничего не говори
  rationale: 'Сохраняет всеохватность двойной отрицательной конструкции: ни адресата, ни содержания сообщения.'
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт резкий переход от запрета к предписанному действию без добавочного истолкования.
- source_word: ὕπαγε
  choice: пойди
  rationale: Прямой и естественный эквивалент повеления отправиться.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: покажись священнику
  rationale: Естественно передаёт возвратную конструкцию и подразумеваемое священническое освидетельствование.
- source_word: ἱερεῖ
  choice: священнику
  rationale: В русском отсутствие артикля не требует добавлять «одному» или «этому»; речь идёт о надлежащем священнике в рамках предписания Торы.
- source_word: προσένεγκε
  choice: принеси
  rationale: Глагол обозначает принесение предписанного дара или жертвы; «принеси» сохраняет предметную широту и не уточняет сверх текста вид обряда.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: за своё очищение
  rationale: Передаёт культовое назначение приношения и сохраняет связь с очищением.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: то, что повелел Моисей
  rationale: Естественная русская передача собирательного значения греческого относительного местоимения во множественном числе.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: им во свидетельство
  rationale: Сохраняет целевое или результативное значение εἰς и намеренно не разрешает, кому относится «им» и имеет ли свидетельство обвинительный оттенок.
theological_decisions:
- issue: Референт и смысл выражения εἰς μαρτύριον αὐτοῖς
  choice: «им во свидетельство» с сохранением широты референта и характера свидетельства
  alternative: «как доказательство священникам» или «во свидетельство против них»
  rationale: В греческом тексте не назван точный круг лиц и отсутствует явный предлог со значением «против». Поэтому перевод не должен заранее ограничивать референт священниками либо придавать фразе полемический смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Настоящее время «говорит» сохранено вслед за историческим настоящим λέγει; культовая лексика передана понятно, без конфессионального уточнения.
