  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: ru
  text: И они сразу же оставили сети и последовали за Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет характерное для Марка последовательное течение повествования, не добавляя толкования.
- source_word: εὐθὺς
  choice: сразу же
  rationale: Современное и естественное русское выражение точно передаёт незамедлительность действия и характерную для Марка динамику.
- source_word: ἀφέντες
  choice: оставили
  rationale: Аористное причастие обозначает действие, предшествующее основному; по-русски естественно передать его однородным сказуемым. «Бросили» могло бы неоправданно усилить эмоциональный оттенок.
- source_word: τὰ δίκτυα
  choice: сети
  rationale: Определённый артикль не требует отдельной передачи в русском. Притяжательное «свои» контекстуально возможно, но в греческом прямо не выражено.
- source_word: ἠκολούθησαν
  choice: последовали
  rationale: Глагол сохраняет как буквальный смысл движения вслед за Иисусом, так и возникающий в контексте смысл ученичества, не раскрывая его парафразом.
- source_word: αὐτῷ
  choice: за Ним
  rationale: Русское управление глагола «последовать» требует конструкции «за» с творительным падежом. Местоимение сохранено, а имя Иисуса не подставлено вместо него.
theological_decisions:
- issue: Оттенок ученичества в ἠκολούθησαν
  choice: «последовали за Ним» без поясняющего расширения
  alternative: «стали Его учениками»; «пошли с Ним»
  rationale: Формулировка сохраняет одновременно буквальное следование и богословски значимый смысл ученичества, позволяя ему раскрываться из контекста, а не из переводческого пояснения.
translation_notes:
  register: Современный литературный русский язык; краткая и динамичная фраза соответствует стилю Марка. «Сразу же» звучит естественнее в обычной речи, чем более книжное «немедленно». Местоимение «Ним» написано с прописной буквы как традиционный русский знак почтения, не меняющий референцию или смысл.
