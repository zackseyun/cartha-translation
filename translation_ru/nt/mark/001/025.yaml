  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: ru
  text: 'Иисус резко одёрнул его: «Замолчи[a] и выйди из него!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Будь в наморднике».'
    reason: Сохраняет буквальный образ глагола φιμόω («надеть намордник; заставить замолчать»), тогда как основной текст передаёт естественное для русского повелительное значение.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: строго приказал
  rationale: Глагол обозначает резкое, властное порицание или запрещение. В обращении к нечистому духу «строго приказал» естественно передаёт как суровость, так и властность речи Иисуса; вариант «запретил» возможен, но в современном русском без дополнения звучит менее ясно.
- source_word: αὐτῷ
  choice: ему
  rationale: Местоимение мужского рода относится к нечистому духу, к которому Иисус обращается непосредственно, а не к одержимому человеку.
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание властного приказа. В современном русском его естественно передать бессоюзным переходом к прямой речи, не добавляя тяжеловесного «говоря».
- source_word: Φιμώθητι
  choice: Замолчи
  rationale: Буквально глагол связан с надеванием намордника, а в переносном повелительном употреблении требует немедленно прекратить речь. «Замолчи» сохраняет резкость приказа и естественно звучит по-русски; буквальный образ вынесен в сноску.
- source_word: ἔξελθε
  choice: выйди
  rationale: В контексте изгнания духа глагол означает движение наружу из человека. «Выйди» — прямой и точный русский императив.
- source_word: ἐξ αὐτοῦ
  choice: из него
  rationale: Предлог ἐξ указывает на выход изнутри; выражение ясно отличает нечистого духа, к которому обращён приказ, от человека, из которого тот должен выйти.
theological_decisions:
- issue: К кому обращён строгий приказ Иисуса
  choice: Иисус непосредственно обращается к нечистому духу.
  alternative: Непосредственным адресатом считается сам человек.
  rationale: Предшествующий контекст называет нечистого духа действующим говорящим, а приказ «выйди из него» грамматически и повествовательно различает адресата-духа и человека, из которого он должен выйти, без дополнительных доктринальных выводов.
translation_notes:
  register: Современный литературный русский, краткий и властный тон прямой речи. «Строго приказал» выбрано вместо более традиционного «запретил», чтобы обычному читателю сразу была ясна речевая сила глагола. Сноска сохраняет буквальную метафору, не делая основной текст неестественным.
