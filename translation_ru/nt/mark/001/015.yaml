  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: ru
  text: 'и говорил: «Время исполнилось, и Царство Божье[a] приблизилось. Покайтесь и верьте в благую весть[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царствование Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Евангелие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: исполнилось
  rationale: Перфект передаёт свершившееся исполнение, результат которого сохраняется в настоящем; русская форма «исполнилось» естественно выражает наступление назначенного срока.
- source_word: ὁ καιρὸς
  choice: время
  rationale: В контексте имеется в виду решающий, назначенный момент; слово «время» сохраняет лаконичность оригинала, а особый смысл раскрывается контекстом.
- source_word: ἤγγικεν
  choice: приблизилось
  rationale: Перфект указывает на состоявшееся приближение и нынешнюю близость; «приблизилось» сохраняет динамику греческого глагола, не сводя его к статическому «близко».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся и широкое по смыслу соответствие, способное обозначать как Божье владычество, так и сферу его осуществления; вариант «царствование Бога» дан в примечании.
- source_word: μετανοεῖτε
  choice: покайтесь
  rationale: Глагол призывает к решительной перемене мыслей и жизненного направления; «покайтесь» является точным, ёмким и понятным русским соответствием.
- source_word: πιστεύετε
  choice: верьте
  rationale: Прямое соответствие повелительной форме πιστεύετε; оно сохраняет смысл веры и доверия, не сужая его до одного психологического оттенка.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: в Благую весть
  rationale: После πιστεύω предлог ἐν здесь естественно передаётся как «в», а εὐαγγέλιον — прозрачным современным выражением «Благая весть»; традиционное «Евангелие» сохранено в примечании.
- source_word: λέγων
  choice: и говорил
  rationale: Греческое причастие продолжает повествовательную конструкцию предыдущего стиха; русская личная форма естественнее буквального «и говоря» и сохраняет связь с предшествующим контекстом.
theological_decisions:
- issue: Передача выражения βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  alternative: царствование Бога
  rationale: Основной вариант сохраняет традиционную широту выражения и не ограничивает его только динамическим правлением или только пространственной областью.
- issue: Передача εὐαγγέλιον
  choice: Благая весть
  alternative: Евангелие
  rationale: «Благая весть» непосредственно передаёт значение исходного слова и понятно современному читателю; церковно-традиционный эквивалент указан в примечании.
- issue: Видовое значение μετανοεῖτε καὶ πιστεύετε
  choice: Покайтесь и верьте
  alternative: Продолжайте каяться и верить
  rationale: Формы настоящего времени могут иметь продолженный оттенок, однако простые повелительные формы по-русски естественно передают настоятельный призыв и не навязывают спорного аспектуального истолкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной библейской интонацией. «Божье» предпочтено архаизирующему «Божие»; прописные буквы в выражениях «Царство Божье» и «Благая весть» поддерживают принятый в переводе религиозный регистр.
