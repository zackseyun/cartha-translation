base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: ru
  text: Рано утром, когда было ещё совсем темно, Он встал, вышел и удалился в безлюдное место[a]. Там Он молился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пустынное место» или «в уединённое место». Греческое слово может обозначать безлюдное, необитаемое или удалённое от поселений место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: Рано утром, когда было ещё совсем темно
  rationale: Сочетание обозначает очень раннее утро, пока ещё продолжалась ночная темнота. Русская формулировка естественно передаёт и время, и усиление.
- source_word: ἀναστὰς
  choice: Он встал
  rationale: Аористное причастие обозначает действие, предшествующее последующим глаголам; личная форма естественна в современном русском повествовании.
- source_word: ἐξῆλθεν καὶ ἀπῆλθεν
  choice: вышел и удалился
  rationale: 'Два отдельных глагола сохранены: сначала выход из места пребывания, затем движение прочь.'
- source_word: εἰς ἔρημον τόπον
  choice: в безлюдное место
  rationale: ἔρημος здесь характеризует место как пустынное, необитаемое или уединённое, не обязательно как географическую пустыню.
- source_word: κἀκεῖ
  choice: Там
  rationale: Кратко и естественно передаёт καὶ ἐκεῖ; деление на два предложения сохраняет ясную связь с указанным местом.
- source_word: προσηύχετο
  choice: Он молился
  rationale: Русский несовершенный вид передаёт длительный характер имперфекта без необходимости в громоздкой конструкции.
theological_decisions:
- issue: Повествовательный акцент на молитве Иисуса
  choice: Передать уход Иисуса и Его молитву без добавочного богословского истолкования
  alternative: Подчеркнуть в самом тексте пример уединённой молитвы или христологический смысл зависимости в молитве
  rationale: Греческий текст сообщает о поступке Иисуса, но не формулирует здесь его доктринального значения.
translation_notes:
  register: Современный литературный русский язык; сдержанный и ясный повествовательный стиль. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской традицией, без внесения дополнительного толкования.
