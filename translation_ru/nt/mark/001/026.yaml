  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: ru
  text: И нечистый дух, вызвав у него судороги и громко закричав, вышел из него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: сотрясши его в судорогах
  rationale: Аористное причастие обозначает действие, предшествующее выходу духа. Формулировка передаёт телесные судороги, не прибегая к потенциально двусмысленному буквальному «растерзав».
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: нечистый дух
  rationale: Устойчивое и понятное обозначение демонического духа, сохраняющее оттенок нечистоты в ἀκάθαρτος и личную субъектность духа в повествовании.
- source_word: φωνῆσαν
  choice: закричав
  rationale: Причастие передаёт сопровождающее выход громкое голосовое действие, не уточняя сверх текста его эмоциональную окраску.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Естественно передаёт обстоятельственный дательный образа действия; значение большой силы голоса сохранено без тяжеловесного повтора «закричав громким голосом».
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: вышел из него
  rationale: Прямо и естественно передаёт пространственный образ выхода духа из человека.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Начальное «И» сохраняет характерную для Марка последовательную повествовательную связь; второе καί естественно соединяет два предшествующих главному глаголу действия.
theological_decisions:
- issue: Природа вселившейся сущности
  choice: «нечистый дух» представлен как личный действующий субъект
  alternative: безличная злая сила
  rationale: 'В повествовании дух сам совершает действия: вызывает судороги, кричит и выходит. Перевод сохраняет эту грамматическую и повествовательную субъектность, не добавляя дальнейших догматических пояснений.'
translation_notes:
  register: Современный литературный русский язык; краткая и энергичная фраза сохраняет динамику повествования Марка. Деепричастные обороты передают последовательность греческих аористных причастий, а «сотрясши его в судорогах» звучит ясно и достойно, хотя форма «сотрясши» несколько книжная и уместна для библейского регистра.
