  terminology: «Нечистый дух» — устойчивое и точное соответствие τὸ πνεῦμα τὸ ἀκάθαρτον; оно сохраняет терминологическую связь с евангельским употреблением и личную субъектность действующего духа. Дополнительные сноски не требуются.
