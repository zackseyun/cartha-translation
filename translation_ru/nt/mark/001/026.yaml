  source_fidelity: 'Фраза «сотрясши его в судорогах» передаёт общий смысл σπαράξαν, однако синтаксически неясна: создаётся впечатление, что дух сотрясал человека, находясь «в судорогах». Греческий глагол обозначает причинение судорог/конвульсий человеку. «Вызвав у него судороги» передаёт это значение ясно и без излишней буквальности. «Громко закричав» адекватно передаёт φωνήσαν φωνῇ μεγάλῃ, а «вышел из него» — ἐξῆλθεν ἐξ αὐτοῦ.'
