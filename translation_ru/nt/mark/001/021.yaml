lexical_decisions:
- source_word: εἰσπορεύονται
  choice: приходят
  rationale: 'Историческое настоящее сохранено: оно характерно для живого повествования Марка. В сочетании с εἰς передаёт прибытие в Капернаум.'
- source_word: Καφαρναούμ
  choice: Капернаум
  rationale: Употреблена закрепившаяся в русском языке форма географического названия.
- source_word: εὐθύς
  choice: сразу же
  rationale: Естественное современное выражение, передающее быстроту действия и характерную для Марка динамику.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Формально множественное число здесь представляет собой обычное временное выражение, которое по контексту естественно понимать как указание на субботний день.
- source_word: ἐδίδασκεν
  choice: стал учить
  rationale: Несовершенный вид греческого глагола представляет разворачивающееся действие; в данном контексте русское «стал учить» естественно передаёт начало последующего процесса, не сводя его к одноразовому действию.
- source_word: συναγωγήν
  choice: синагоге
  rationale: В иудейском контексте слово обозначает местную синагогу, а не собрание вообще.
