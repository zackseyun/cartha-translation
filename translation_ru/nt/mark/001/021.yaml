  - severity: medium
    issue: «стал учить» закрепляет начинательное значение ἐδίδασκεν.
    rationale: Имперфект может иметь начинательный оттенок в контексте, но сам по себе также обозначает продолжающееся действие. «Учил» не навязывает один из спорных оттенков.
  - severity: low
