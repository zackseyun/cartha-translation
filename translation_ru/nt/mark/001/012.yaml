  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: ru
  text: И тотчас Дух погнал его в пустыню[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух выгнал его в пустыню» или «Дух заставил его идти в пустыню». Греческий глагол выражает сильное, решительное действие; Марк часто употребляет его и для изгнания бесов.'
    reason: 'Лексическая альтернатива: поясняет сильный оттенок ἐκβάλλει и отмечает характерное словоупотребление Марка, не отождествляя контексты.'
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет характерное для Марка непрерывное повествовательное движение, не усиливая временное значение сверх текста.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Естественное для современного литературного русского языка слово передаёт быстроту и напряжённый темп повествования Марка.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: Определённость понятна из ближайшего контекста крещения Иисуса; добавление «Святой» здесь не требуется, поскольку его нет в греческом тексте.
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение относится к Иисусу; строчная буква соответствует обычной современной издательской практике и не вносит конфессионально обусловленной капитализации.
- source_word: ἐκβάλλει
  choice: повёл ... силой
  rationale: Передаёт направленное движение в пустыню и сохраняет необычно сильный оттенок ἐκβάλλω, но по-русски не создаёт ложного впечатления, будто Дух «изгнал» Иисуса как демона.
- source_word: εἰς τὴν ἔρημον
  choice: в пустыню
  rationale: «Пустыня» — естественный и традиционный русский эквивалент для безлюдной, пустынной местности; предлог передаёт движение внутрь или в пределы этой местности.
theological_decisions:
- issue: Сила действия Духа по отношению к Иисусу
  choice: «повёл его в пустыню силой»
  alternative: «выгоняет его в пустыню»; «посылает его в пустыню»; «ведёт его в пустыню»
  rationale: 'Глагол ἐκβάλλω заметно сильнее обычного «вести» или «посылать», и эту напряжённость важно сохранить: уход Иисуса в пустыню совершается по решительному побуждению Духа. Вместе с тем буквальное «выгоняет» в русском контексте может чрезмерно сблизить действие Духа с изгнанием нечистых духов. Выбранная формулировка удерживает силу глагола без такого нежелательного смыслового сдвига.'
translation_notes:
  register: Современный литературный русский, краткий и энергичный, в соответствии со стилем Марка. Формулировка «повёл ... силой» понятна широкому читателю, сохраняет достоинство текста и одновременно передаёт силу оригинального глагола. Настоящее историческое ἐκβάλλει естественно передано прошедшим временем русского повествования.
