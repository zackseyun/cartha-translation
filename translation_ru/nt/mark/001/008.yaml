id: MRK.1.8
reference: Mark 1:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: ru
  text: Я крестил вас водой, а он будет крестить вас Святым Духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Святом Духе». Греческий предлог допускает оба варианта перевода.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Я
  rationale: Явное местоимение сохранено, чтобы передать подчёркнутое противопоставление Иоанна тому, кто идёт за ним.
- source_word: ἐβάπτισα
  choice: крестил
  rationale: Устоявшийся русский эквивалент βαπτίζω сохраняет обрядовый и межтекстовый смысл, не сводя значение только к способу совершения действия.
- source_word: ὑμᾶς
  choice: вас
  rationale: Форма естественно передаёт прямое дополнение во множественном числе.
- source_word: ὕδατι
  choice: водой
  rationale: Творительный падеж естественно передаёт средство и сохраняет лаконичную параллель с выражением «Святым Духом».
- source_word: αὐτὸς
  choice: он
  rationale: Контрастное значение местоимения передано структурой «а он»; добавление «сам» было бы возможно, но звучало бы излишне усиленно.
- source_word: δὲ
  choice: а
  rationale: Русский противительно-сопоставительный союз «а» естественно выражает контраст между двумя крещениями без чрезмерно резкого противопоставления.
- source_word: βαπτίσει
  choice: будет крестить
  rationale: Сохранены будущее время и лексическая связь с «крестил».
- source_word: ἐν
  choice: Святым Духом (творительный падеж)
  rationale: Беспредложный творительный падеж естественно передаёт значение средства («посредством Святого Духа»), тогда как возможное значение сферы сохранено в сноске.
- source_word: πνεύματι ἁγίῳ
  choice: Святым Духом
  rationale: В данном пророческом контексте выражение наиболее естественно обозначает божественного Святого Духа; написание с прописных букв соответствует восприятию сочетания как именования.
theological_decisions:
- issue: Обозначает ли πνεύματι ἁγίῳ божественного Святого Духа или неопределённую святую духовную силу
  choice: Святым Духом
  alternative: святым духом
  rationale: В контексте Марка противопоставление водного крещения Иоанна крещению, которое совершит Грядущий, естественнее всего указывает на божественного Святого Духа, при этом перевод не добавляет дальнейшего догматического объяснения.
- issue: Как передать ἐν в выражении ἐν πνεύματι ἁγίῳ
  choice: Святым Духом
  alternative: в Святом Духе
  rationale: Творительный падеж идиоматично передаёт средство и поддерживает параллель с «водой». Возможное значение сферы не устраняется и приведено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная без архаизмов. Местоимение «он» написано со строчной буквы, поскольку прописная буква в русском была бы добавочным почтительным толкованием, отсутствующим в греческой графике.
