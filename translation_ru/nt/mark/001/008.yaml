  source_fidelity: Текст точно передаёт явное «Я», прошедшее время ἐβάπτισα, множественное «вас», контраст αὐτὸς δέ через «а он» и будущее βαπτίσει. «Водой» и «Святым Духом» естественно передают дативные конструкции; возможный пространственно-сферический оттенок ἐν сохранён в сноске.
  naturalness: Фраза краткая, ясная и вполне естественная для современного литературного русского языка. Союз «а» хорошо выражает сопоставительно-противительный переход. Строчная буква в «он» не навязывает почтительного либо конфессионального оформления.
  terminology: «Крестил / будет крестить» сохраняет терминологическую и смысловую связь исходного текста. «Святым Духом» — нормативное русское обозначение в данном контексте и не добавляет доктринальных пояснений. Сноска корректно фиксирует допустимый вариант «в Святом Духе».
