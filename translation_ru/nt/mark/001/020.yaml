  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: ru
  text: И тотчас он позвал их, и они, оставив своего отца Зеведея в лодке с наёмными работниками, пошли за ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пошли следом за ним»; выражение может обозначать как движение вслед за кем-либо, так и начало следования за ним в качестве учеников.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерное для Марка указание на немедленность действия и звучит естественно в современном литературном русском языке.
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Нейтрально передаёт значение καλέω в данном повествовательном контексте, не усиливая его до «приказал» и не ослабляя до «пригласил».
- source_word: ἀφέντες
  choice: оставив
  rationale: Деепричастие естественно выражает действие, предшествующее основному глаголу, и не привносит отрицательного оттенка слова «бросив».
- source_word: πατέρα αὐτῶν
  choice: своего отца
  rationale: Возвратное притяжательное местоимение — нормативный и естественный русский эквивалент при совпадении обладателя с подлежащим.
- source_word: Ζεβεδαῖον
  choice: Зеведея
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени.
- source_word: πλοίῳ
  choice: лодке
  rationale: Соответствует галилейскому рыболовному контексту; «корабль» обозначал бы чрезмерно крупное судно.
- source_word: μισθωτῶν
  choice: наёмными работниками
  rationale: Точно указывает на людей, работавших за плату, не сужая значение до подёнщиков и не придавая ему современного корпоративного оттенка.
- source_word: ἀπῆλθον
  choice: пошли
  rationale: Естественно передаёт направленное движение от прежнего места; значение удаления достаточно выражено контекстом оставления отца и лодки.
- source_word: ὀπίσω αὐτοῦ
  choice: за ним
  rationale: Русское выражение сохраняет как пространственный смысл движения следом, так и возникающий в контексте смысл ученичества.
theological_decisions:
- issue: Оттенок ученичества в ὀπίσω αὐτοῦ
  choice: пошли за ним
  alternative: пошли следом за ним; последовали за ним
  rationale: Формулировка «пошли за ним» сохраняет одновременно буквальное движение вслед за Иисусом и подразумеваемое начало ученичества, не сводя выражение лишь к одному из этих смыслов.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Местоимение «он» написано со строчной буквы как обычное местоимение текста, без введения конфессионально обусловленной почтительной капитализации.
