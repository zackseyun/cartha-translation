  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: ru
  text: 'И сказал им Иисус: «Идите за Мной, и Я сделаю так, что вы станете ловцами людей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Идите за Мной
  rationale: Передаёт призыв буквально и естественно по-русски, сохраняя образ следования за Иисусом.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: Я сделаю так, что вы станете
  rationale: Сохраняет выраженную в греческом тексте идею становления, не сводя оборот к более краткому «сделаю вас».
- source_word: ἁλιεῖς ἀνθρώπων
  choice: ловцами людей
  rationale: Сохраняет метафору рыбной ловли; «людей» точно передаёт родовое ἀνθρώπων без неоправданного ограничения только мужчинами.
theological_decisions:
- issue: Роль Иисуса в будущем становлении учеников
  choice: Я сделаю так, что вы станете
  alternative: вы станете
  rationale: Выбранный вариант сохраняет причинную роль Иисуса, прямо выраженную глаголом ποιήσω, и одновременно передаёт γενέσθαι — «стать».
translation_notes:
  register: Современный литературный русский язык; речь ясная и dignified, с сохранением библейской метафоры. Местоимения, относящиеся к Иисусу в прямом обращении, написаны с прописной буквы согласно распространённой русской библейской традиции.
