base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: ru
  text: 'Разгневавшись[a], Он протянул руку, прикоснулся к нему и сказал: «Хочу. Очистись».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «сжалившись».'
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: разгневавшись
  rationale: Передаёт напечатанное в SBLGNT причастие от ὀργίζομαι в его прямом значении, не заменяя его более известным разночтением.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: Он протянул руку
  rationale: Естественно передаёт последовательное телесное действие; личное местоимение проясняет подлежащее в русском повествовании.
- source_word: ἥψατο
  choice: прикоснулся к нему
  rationale: Обычное контекстуальное значение среднего залога ἅπτω; сохраняет значимость непосредственного прикосновения к прокажённому.
- source_word: λέγει αὐτῷ
  choice: сказал
  rationale: Историческое настоящее передано прошедшим временем, естественным для современного русского повествования; адресат ясен из контекста и уже выражен в соседней фразе.
- source_word: Θέλω
  choice: Хочу
  rationale: Кратко и естественно выражает волю и готовность Иисуса в прямом ответе на условную просьбу; не сводит форму к будущему времени.
- source_word: καθαρίσθητι
  choice: Очистись
  rationale: Русская возвратная форма естественно передаёт греческий пассивный императив и сохраняет физико-ритуальную многозначность очищения.
theological_decisions:
- issue: Текстовый вариант, описывающий эмоциональное состояние Иисуса
  choice: В основном тексте перевести чтение SBLGNT ὀργισθείς как «разгневавшись»
  alternative: «сжалившись» / «проникнувшись состраданием»
  rationale: Основной текст следует предоставленному греческому изданию. Поскольку разночтение существенно меняет описание чувства Иисуса, оно отмечено в сноске, а напряжение текста не устраняется толкованием.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная речь. Пунктуация прямой речи сохраняет резкость двух кратких греческих повелительных высказываний. Местоимение «Он» написано с прописной буквы как принятая благоговейная издательская конвенция, без добавления толкования.
