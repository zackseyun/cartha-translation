lexical_decisions:
- source_word: κατεδίωξεν
  choice: бросились искать
  rationale: Глагол καταδιώκω обозначает настойчивое, энергичное преследование или разыскивание. В данном контексте современное русское «бросились искать» естественно передаёт и сам поиск, и его интенсивность, не создавая нежелательного впечатления враждебной погони.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятой русской библейской традиции и не меняет смысла исходного текста.
- source_word: Σίμων
  choice: Симон
  rationale: Употреблена традиционная русская форма имени.
- source_word: οἱ μετ’ αὐτοῦ
  choice: те, кто был с ним
  rationale: Формулировка близко и естественно передаёт буквальное «те, кто с ним», не уточняя сверх текста характер этой группы.
- source_word: καὶ
  choice: и
  rationale: Союз сохраняет простой присоединительный ход повествования, характерный для Марка.
theological_decisions: []
