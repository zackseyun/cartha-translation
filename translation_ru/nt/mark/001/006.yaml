base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: ru
  text: Иоанн был одет в одежду из верблюжьей шерсти и носил кожаный пояс на талии[a]. Он ел саранчу и дикий мёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Одежда Иоанна напоминает описание Илии в 4 Царств 1:8 и помогает увидеть в Иоанне пророческого предтечу.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: был одет в одежду из верблюжьей шерсти
  rationale: Причастие передаёт устойчивое состояние, а винительный τρίχας καμήλου обозначает материал одежды. Добавление слова «одежду» делает смысл естественным по-русски и не позволяет ошибочно понять фразу как указание на шкуру верблюда.
- source_word: ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ
  choice: опоясан кожаным поясом
  rationale: Естественная русская формулировка точно передаёт кожаный пояс вокруг талии; «чресла» здесь звучало бы архаично.
- source_word: ἔσθων
  choice: ел
  rationale: Настоящее причастие в описательном контексте указывает на обычный рацион Иоанна; русское несовершенное «ел» естественно выражает длительное или привычное действие.
- source_word: ἀκρίδας
  choice: саранчу
  rationale: Прямое и обычное значение греческого слова — съедобные насекомые, саранча; контекст не даёт оснований для иного толкования.
- source_word: μέλι ἄγριον
  choice: дикий мёд
  rationale: Прямой и естественный русский эквивалент, обозначающий мёд, найденный в дикой природе.
- source_word: καὶ ἦν
  choice: Иоанн был
  rationale: Начальное καί продолжает повествование, но отдельное «и» в начале русского предложения необязательно и утяжеляло бы текст; явного временного маркера вроде «тогда» или «в то время» в источнике нет.
theological_decisions:
- issue: Связь одежды Иоанна с образом пророка Илии
  choice: Оставить основной текст описательным, а перекличку с Илиёй указать в сноске.
  alternative: Прямо назвать Иоанна подобным Илии в основном тексте.
  rationale: Описание напоминает 4 Царств 1:8, однако сам стих не отождествляет Иоанна с Илиёй прямо. Сноска сохраняет важную межтекстовую связь, не превращая вывод толкователя в текст перевода.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повествовательной интонацией. Избегаются архаизмы «чресла» и неоднозначная формула «одет в верблюжью шерсть».
