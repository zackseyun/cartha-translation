lexical_decisions:
- source_word: ἦν … ἐπισυνηγμένη
  choice: собрался
  rationale: Сочетание имперфекта εἰμί с перфектным страдательным причастием описывает сложившуюся и наблюдаемую сцену. По-русски естественнее передать её простым глаголом «собрался», не утяжеляя фразу конструкцией «был собран».
- source_word: ὅλη ἡ πόλις
  choice: весь город
  rationale: Прямо сохраняет яркое обобщение греческого текста; выражение не следует ослаблять до «многие жители города».
- source_word: πρὸς τὴν θύραν
  choice: у двери
  rationale: При статическом описании πρός с винительным обозначает положение возле двери, то есть у входа в дом. «У двери» естественно для современного русского языка, тогда как буквальное «к двери» может ошибочно создавать впечатление продолжающегося движения.
- source_word: θύραν
  choice: двери
  rationale: Основное значение θύρα — «дверь»; в данном контексте имеется в виду вход в дом, но замена на «вход» не обязательна.
