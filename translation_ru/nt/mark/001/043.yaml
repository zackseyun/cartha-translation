lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: строго предостерегши
  rationale: Причастие передаёт сильную эмоциональную окраску и суровость наставления. «Строго предостерегши» естественно по-русски выражает настоятельность последующего запрета, не утверждая однозначно, что Иисус гневался на исцелённого.
- source_word: αὐτῷ
  choice: его
  rationale: Дательный падеж местоимения относится к исцелённому; при русском глаголе «предостеречь» естественно употребляется винительный падеж.
- source_word: εὐθύς
  choice: тотчас
  rationale: Сохраняет характерную для Марка стремительность повествования и звучит литературно, но понятно современному читателю.
- source_word: ἐξέβαλεν
  choice: выпроводил
  rationale: Глагол сильнее нейтрального «отпустил» или «послал». «Выпроводил» передаёт решительное удаление человека, не вызывая столь прямой ассоциации с изгнанием бесов, как «изгнал».
- source_word: αὐτόν
  choice: его
  rationale: Винительное местоимение относится к тому же исцелённому человеку.
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет синтаксис и повествовательную манеру Марка.
theological_decisions:
- issue: Тон действий Иисуса по отношению к исцелённому
  choice: Передать заметную суровость речи и решительность удаления, не истолковывая их как враждебность к человеку.
  alternative: Сгладить выражение до нейтрального «наставив, отпустил» либо передать как личный гнев и упрёк.
  rationale: Оба греческих глагола необычно сильны. Перевод сохраняет напряжённость, но не разрешает сверх текста вопрос о точном эмоциональном состоянии Иисуса; следующий стих связывает суровость с данным человеку повелением.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Тотчас» поддерживает ритм Марка; «выпроводил» сохраняет силу исходного глагола и остаётся понятным обычному читателю.
