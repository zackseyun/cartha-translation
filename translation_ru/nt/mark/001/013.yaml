base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: ru
  text: И Он был в пустыне сорок дней, искушаемый Сатаной[a], и был среди диких зверей, и ангелы служили Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытываемый Сатаной». Греческий глагол может означать «искушать» или «испытывать»; при упоминании Сатаны здесь наиболее вероятно значение «искушаемый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: в пустыне
  rationale: «Пустыня» — естественный и традиционный русский эквивалент, обозначающий безлюдную дикую местность без лишнего уточнения её ландшафта.
- source_word: τεσσεράκοντα ἡμέρας
  choice: сорок дней
  rationale: Прямая передача обстоятельства продолжительности; библейские ассоциации сорокадневного испытания оставлены неразъяснёнными в основном тексте.
- source_word: πειραζόμενος
  choice: искушаемый
  rationale: Причастие сохраняет длительный характер действия и пассивную конструкцию оригинала. При сатане как действующем лице наиболее естественно значение «искушаемый», хотя значение «испытываемый» также лексически возможно и отмечено в сноске.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: сатаной
  rationale: Передаёт явно названного личного деятеля; «сатана» является общепринятым русским обозначением этого сверхъестественного противника.
- source_word: μετὰ τῶν θηρίων
  choice: среди диких зверей
  rationale: «Дикие звери» ясно передаёт θηρία, а «среди» естественно по-русски описывает пребывание в окружении животных, не определяя характер их отношения к Иисусу.
- source_word: ἄγγελοι
  choice: ангелы
  rationale: В данном сверхъестественном контексте речь идёт о небесных существах, поэтому «ангелы», а не общее «вестники».
- source_word: διηκόνουν αὐτῷ
  choice: служили Ему
  rationale: «Служили» точно и естественно передаёт διακονέω; несовершенный вид выражает продолжавшееся действие греческого имперфекта.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: И Он был ... и был ... и ...
  rationale: Повтор союзов сохраняет характерный для Марка паратактический ритм, не делая русский текст непонятным.
theological_decisions:
- issue: Значение πειραζόμενος при сатане как действующем лице
  choice: искушаемый
  alternative: испытываемый
  rationale: Глагол допускает оба значения, но при прямом указании на сатану вероятнее враждебное искушение. Лексическая и богословская напряжённость сохранена в сноске, а не устранена толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены причастная конструкция, повтор союзов и смысловая неоднозначность πειραζόμενος. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
