  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: ru
  text: К нему выходили люди из всей Иудеи и все жители Иерусалима; у него они крестились в реке Иордане, исповедуя свои грехи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: выходили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся в прошлом действие; русская форма несовершенного вида естественно сохраняет этот оттенок.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: вся Иудейская область
  rationale: χώρα обозначает область, край или территорию. «Иудейская область» сохраняет географический смысл и риторическую всеохватность πᾶσα.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: все жители Иерусалима
  rationale: Так естественно и точно передано обозначение жителей города вместе с πάντες; форма «иерусалимляне» возможна, но менее нейтральна по стилю.
- source_word: ἐβαπτίζοντο
  choice: крестились
  rationale: Русская возвратная форма является обычным способом назвать принятие крещения и вместе с несовершенным видом передаёт повторявшееся действие, не уточняя его способ.
- source_word: ὑπ’ αὐτοῦ
  choice: у него
  rationale: Оборот сохраняет указание на Иоанна как совершающего крещение, не заменяя местоимение явно названным именем.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: в реке Иордане
  rationale: Передано и собственное имя, и явно присутствующее ποταμός «река»; падежная форма соответствует современной русской норме.
- source_word: ἐξομολογούμενοι
  choice: исповедуя
  rationale: Причастный оборот передаёт сопутствующее крещению действие и сохраняет прямое значение открытого признания грехов.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: свои грехи
  rationale: Возвратное притяжательное местоимение естественно соотносит грехи с подлежащим причастного оборота.
theological_decisions:
- issue: Объём выражений со значением «весь»
  choice: Сохранить «вся» и «все», допуская обычную для повествования обобщающую риторику
  alternative: Ослабить до «многие из Иудеи и Иерусалима»
  rationale: В греческом тексте стоят πᾶσα и πάντες. Их следует передать, не превращая повествовательное обобщение в специально сформулированное утверждение о каждом человеке без исключения.
- issue: Смысл и способ крещения
  choice: Передать глагол нейтральным «крестились»
  alternative: Уточнить как «погружались» или «омывались»
  rationale: Стих называет действие, но сам по себе не разъясняет его способ или богословское значение; нейтральная передача не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным звучанием. Сохранены риторическая всеохватность оригинала, несовершенный вид глаголов и явное упоминание реки; синтаксис слегка выровнен точкой с запятой ради ясности.
