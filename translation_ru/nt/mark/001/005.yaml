- from: К нему выходили вся Иудейская область и все жители Иерусалима; они крестились у него в реке Иордане, исповедуя свои грехи.
  to: К нему выходили люди из всей Иудеи и все жители Иерусалима; у него они крестились в реке Иордане, исповедуя свои грехи.
  rationale: Исправлена только русская грамматика и естественность передачи коллективного географического обозначения. Сохранены оба выражения всеохватности, имперфектный характер повествования, указание на Иоанна как совершающего крещение, реку Иордан и сопутствующее исповедание грехов.
