  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: ru
  text: И Он ходил по всей Галилее[a], проповедуя в их синагогах и изгоняя демонов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Он пришёл, проповедуя в их синагогах по всей Галилее и изгоняя демонов». Греческий глагол можно перевести как «пришёл», но в данном контексте он, вероятно, описывает передвижение по всей области.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: ходил по
  rationale: Аорист ἔρχομαι буквально может означать «пришёл», однако в сочетании с указанием на всю Галилею и двумя причастиями описывает передвижение Иисуса по области. «Ходил по» естественно передаёт странствующий характер служения, не превращая его в одно завершённое путешествие.
- source_word: κηρύσσων
  choice: проповедуя
  rationale: κηρύσσω обозначает публичное провозглашение. «Проповедуя» естественно для действия в синагогах и сохраняет смысл открытого возвещения.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: в их синагогах
  rationale: Хотя εἰς буквально указывает направление «в», здесь при глаголе деятельности естественно обозначает место действия. Местоимение αὐτῶν сохранено как «их».
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: по всей Галилее
  rationale: Оборот указывает на пространственный охват служения. «По всей Галилее» идиоматично передаёт распространение движения по области и сохраняет значение ὅλην.
- source_word: τὰ δαιμόνια
  choice: демонов
  rationale: δαιμόνια прямо обозначает демонов. В русском языке при описании повторяющейся деятельности после «изгоняя» отсутствие определённого артикля передаётся естественнее без добавления указательного или обобщающего слова.
- source_word: ἐκβάλλων
  choice: изгоняя
  rationale: В контексте освобождения от демонов ἐκβάλλω означает «изгонять». Это точное, современное и стилистически достойное соответствие.
theological_decisions:
- issue: Характер δαιμόνια
  choice: Передано словом «демоны» в обычном личностно-духовном смысле.
  alternative: «злые духи» или «бесы»
  rationale: «Демоны» — наиболее прямое лексическое соответствие; оно сохраняет представленную в тексте власть Иисуса над демоническими существами и не добавляет доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный библейский регистр без архаизмов. Причастные обороты сохраняют одновременность проповеди и изгнания демонов с передвижением Иисуса по Галилее.
