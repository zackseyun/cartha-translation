  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: ru
  text: С наступлением вечера, когда зашло солнце, к Нему несли всех больных и одержимых бесами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто был во власти бесов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: С наступлением вечера
  rationale: Генитив абсолютный обозначает временной переход. Формулировка естественна для современного русского языка и сохраняет образ наступившего вечера.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: когда зашло солнце
  rationale: ὅτε передано прямым временным союзом «когда», а аорист ἔδυ — естественной русской формой совершенного вида. Сохранено отдельное упоминание захода солнца, не слитое с первой временной фразой.
- source_word: ἔφερον
  choice: несли
  rationale: Русский глагол несовершенного вида передаёт длительный или повторяющийся характер имперфекта без неестественной громоздкости.
- source_word: πρὸς αὐτὸν
  choice: к Нему
  rationale: Передаёт направленное движение к названному ранее Иисусу; имя не добавляется, поскольку в греческом тексте стоит местоимение.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: всех больных
  rationale: Идиоматическое выражение буквально описывает тех, кому нездоровится. Краткая русская формулировка естественна и сохраняет всеохватность πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: одержимых бесами
  rationale: Устойчивое и понятное русское выражение сохраняет прямую отсылку текста к воздействию бесов, не сводя его к обычной болезни.
theological_decisions:
- issue: Передача δαιμονιζομένους без устранения или чрезмерной конкретизации бесовского воздействия
  choice: одержимых бесами
  alternative: тех, кто был во власти бесов
  rationale: Основной вариант ясен современному читателю и сохраняет реальность бесовского воздействия в повествовании. Сноска отмечает более описательный вариант, поскольку греческий причастный глагол сам по себе не излагает подробной теории о характере или степени такого воздействия.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным ритмом. Местоимение «Нему» оформлено с прописной буквы согласно распространённой русской библейской традиции; синтаксическая параллель двух групп сохранена без архаизмов.
