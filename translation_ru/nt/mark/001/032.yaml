  source_fidelity: 'Русский текст точно передаёт обе временные формулы греческого оригинала: наступление вечера и заход солнца. «Несли» удачно сохраняет несовершенный вид ἔφερον; «к Нему» точно передаёт πρὸς αὐτόν без добавления имени. «Всех больных и одержимых бесами» воспроизводит охват πάντας и различение двух групп.'
