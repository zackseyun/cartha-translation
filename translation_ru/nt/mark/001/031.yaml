base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: ru
  text: Подойдя, Он поднял её, взяв за руку. Лихорадка оставила её, и она стала служить им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служила им». Греческий имперфект может просто описывать её служение, хотя контекст допускает и значение «стала служить им» как непосредственный результат исцеления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Подойдя
  rationale: Аористное причастие передаёт движение Иисуса к женщине перед основным действием; «подойдя» естественно и не добавляет лишних подробностей.
- source_word: ἤγειρεν αὐτὴν
  choice: Он поднял её
  rationale: ἐγείρω здесь обозначает физическое поднятие больной; «поднял» сохраняет силу глагола и возможный более широкий оттенок, не превращая его в явную ссылку на воскресение.
- source_word: κρατήσας τῆς χειρός
  choice: взяв за руку
  rationale: Естественная русская передача идиоматического сочетания со значением «взять/держать за руку»; она отражает сопровождающее действие без излишне сильного «схватив».
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: Горячка оставила её
  rationale: Сохраняется субъектная конструкция греческого текста, где горячка как бы сама покидает женщину.
- source_word: ὁ πυρετός
  choice: горячка
  rationale: Современное и понятное обозначение лихорадочного состояния; в библейском повествовательном регистре звучит естественно.
- source_word: διηκόνει αὐτοῖς
  choice: она стала служить им
  rationale: Имперфект описывает последующее служение; «стала служить» естественно выражает начало продолжающегося действия как непосредственный результат исцеления, хотя значение начала не кодируется однозначно самой формой.
- source_word: αὐτοῖς
  choice: им
  rationale: Множественное местоимение относится к присутствовавшей группе, а не только к Иисусу.
theological_decisions:
- issue: Возможный отзвук языка воскресения в ἐγείρω
  choice: поднял её
  alternative: помог ей встать
  rationale: «Поднял» сохраняет лексику Марка и возможную смысловую напряжённость, не навязывая этому эпизоду значение воскресения.
- issue: Начинательный оттенок имперфекта διηκόνει
  choice: стала служить им
  alternative: служила им
  rationale: Контекст поддерживает понимание служения как немедленно начавшегося после исцеления, однако альтернативная передача отмечена, поскольку имперфект может просто описывать продолжавшееся действие.
translation_notes:
  register: Современный литературный русский язык; краткий, повествовательный и достойный регистр. Местоимение «Он» написано с прописной буквы согласно принятой русской библейской традиции. Синтаксис разделён на два предложения для естественности русского звучания.
