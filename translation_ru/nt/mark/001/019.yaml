- source_word: προβὰς ὀλίγον
  choice: пройдя немного дальше
  rationale: Аористное причастие передаёт предшествующее и сопутствующее повествованию действие, а ὀλίγον указывает на небольшое расстояние; русская формулировка естественно выражает продолжение пути.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямое и нейтральное соответствие повествовательному аористу ὁράω без добавочного оттенка намеренного наблюдения.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Иакова, сына Зеведея
  rationale: Конструкция с родительным падежом указывает на происхождение; явное слово «сына» необходимо для естественного и ясного русского выражения.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: его брата Иоанна
  rationale: Местоимение αὐτοῦ естественнее всего относится к Иакову; такой порядок слов ясен и современен.
- source_word: καὶ αὐτούς
  choice: они тоже
  rationale: 'Второе καί имеет присоединительный смысл: Иаков и Иоанн, подобно ранее упомянутым Симону и Андрею, находились в лодке. Развёртывание конструкции в отдельное предложение устраняет неестественную для русского аккузативно-причастную структуру.'
- source_word: ἐν τῷ πλοίῳ
  choice: были в лодке
  rationale: Определённый артикль указывает на конкретную лодку в сцене; глагол «были» добавлен по требованиям русского синтаксиса, не меняя содержания.
- source_word: καταρτίζοντας
  choice: чинили
  rationale: В контексте рыболовных сетей глагол обычно означает восстановление или приведение в пригодное состояние. «Чинили» — краткое и естественное русское соответствие, а более широкий диапазон значения отмечен в сноске.
- source_word: τὰ δίκτυα
  choice: сети
  rationale: Речь идёт о рыболовных сетях; в русском определённость здесь понятна из контекста и не требует притяжательного местоимения, отсутствующего в греческом.
