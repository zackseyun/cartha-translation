lexical_decisions:
- source_word: εὗρον
  choice: найдя
  rationale: Аорист εὑρίσκω обозначает успешное завершение поисков; деепричастие естественно связывает это действие с последующим сообщением в русском повествовании.
- source_word: λέγουσιν
  choice: сказали
  rationale: Историческое настоящее передано прошедшим временем, обычным для связного русского повествования.
- source_word: ὅτι
  choice: двоеточие и прямая речь
  rationale: ὅτι вводит содержание высказывания; по-русски здесь естественнее оформить прямую речь пунктуационно.
- source_word: Πάντες
  choice: Все
  rationale: Передаёт собирательный смысл в ближайшем контексте и не требует понимать слово как безусловно всеобщее.
- source_word: ζητοῦσίν σε
  choice: Тебя ищут
  rationale: В данном эпизоде ζητέω прежде всего означает попытку физически найти Иисуса; русский глагол «искать» сохраняет и более широкий оттенок стремления к Нему.
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой соединительный союз и характерный для Марка быстрый повествовательный ритм.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: Его / Ему / Тебя
  rationale: Местоимения прямо переданы согласно их синтаксическим функциям; прописные буквы употреблены как принятая в русском библейском стиле форма уважительного обозначения Иисуса.
