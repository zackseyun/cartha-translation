  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: ru
  text: И сразу же, выйдя из синагоги, они вместе с Иаковом и Иоанном пришли в дом Симона и Андрея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: сразу же
  rationale: Передаёт характерную для Марка стремительность повествования естественным современным русским выражением.
- source_word: ἐκ τῆς συναγωγῆς
  choice: из синагоги
  rationale: Сохраняет исходное значение ἐκ — движение из помещения; в сочетании с «выйдя» по-русски звучит естественно.
- source_word: ἐξελθόντες ἦλθον
  choice: выйдя… пришли
  rationale: 'Деепричастие передаёт предшествующее действие аористного причастия: сначала они вышли, затем пришли.'
- source_word: ἦλθον
  choice: пришли
  rationale: Глагол допускает значения «пришли» и «пошли»; «пришли» сохраняет обычную повествовательную перспективу и не устраняет присущую форме вариативность посредством уточнений.
- source_word: εἰς τὴν οἰκίαν
  choice: в дом
  rationale: Предлог «в» с винительным падежом ясно выражает движение внутрь, соответствуя εἰς.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: Симона и Андрея
  rationale: Родительный падеж естественно обозначает принадлежность дома обоим названным лицам.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: вместе с Иаковом и Иоанном
  rationale: Ясно и естественно передаёт сопровождение, выраженное μετά с родительным падежом.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Симон / Андрей / Иаков / Иоанн
  rationale: Использованы устойчивые русские формы библейских личных имён.
