  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: ru
  text: И тотчас проказа оставила его, и он был очищен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очистился». Глагол означает не только избавление от болезни, но и очищение от ритуальной нечистоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для Марка стремительность действия и звучит естественно в современном литературном русском языке.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: сошла с него
  rationale: Сочетание буквально выражает удаление болезни от человека; «сошла с него» сохраняет образ исходного текста и естественно сочетается с «проказа».
- source_word: ἡ λέπρα
  choice: проказа
  rationale: Традиционный и краткий русский эквивалент; при этом древнее обозначение могло охватывать более широкий круг тяжёлых кожных заболеваний, чем современная болезнь Хансена.
- source_word: ἐκαθαρίσθη
  choice: он очистился
  rationale: Форма сохраняет смысл очищения, включающий как избавление от болезни, так и устранение связанной с ней ритуальной нечистоты; «исцелился» сузило бы значение.
theological_decisions:
- issue: Соотношение физического исцеления и ритуальной чистоты в ἐκαθαρίσθη
  choice: он очистился
  alternative: он исцелился; он был очищен
  rationale: В контексте проказы глагол указывает не только на физическое выздоровление, но и на обретение чистоты. Русское «очистился» сохраняет эту смысловую напряжённость, не добавляя отдельного деятеля сверх того, что выражено греческим пассивом.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом Марка. Сохранена смысловая связь между уходом болезни и очищением человека; архаические слова и конфессионально окрашенные уточнения не используются.
