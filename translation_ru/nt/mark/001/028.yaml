  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: ru
  text: И весть о Нём[a] тотчас разнеслась повсюду, по всей окрестности Галилеи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщение о Нём»; «молва о Нём».'
    reason: Лексема ἀκοή может обозначать услышанное сообщение, молву или весть.
  - marker: b
    text: 'Буквально: «вышла повсюду во всю окрестность Галилеи».'
    reason: Примечание сохраняет для читателя буквальный образ глагола ἐξῆλθεν и направительное значение εἰς, которые в основном тексте переданы естественным русским оборотом.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: разнеслась
  rationale: Глагол буквально означает «вышла», но применительно к вести естественное русское «разнеслась» ясно передаёт её быстрое распространение, сохраняя образ движения наружу.
- source_word: ἀκοὴ
  choice: весть
  rationale: Здесь существительное обозначает услышанное — сообщение или весть об Иисусе. «Весть» естественно в повествовательном контексте и не усиливает значение до «славы» или известности.
- source_word: αὐτοῦ
  choice: о Нём
  rationale: Родительный падеж указывает на содержание распространявшейся вести; по-русски это естественно выражается оборотом «о Нём».
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для Марка непосредственность действия, оставаясь современным и достойным по регистру.
- source_word: πανταχοῦ
  choice: повсюду
  rationale: Прямо передаёт значение наречия и подчёркивает широкий охват распространения вести.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: по всей окрестности Галилеи
  rationale: Русский предлог «по» естественно выражает распространение по территории, тогда как «во всю окрестность» было бы формальнее, но менее идиоматично. «Окрестность Галилеи» сохраняет географическую формулировку источника без неоправданного уточнения.
theological_decisions:
- issue: Значение ἀκοὴ αὐτοῦ
  choice: весть о Нём
  alternative: Его слава; молва о Нём
  rationale: В контексте речь идёт о распространяющемся сообщении о поступке Иисуса. Вариант «Его слава» смещал бы акцент к репутации и известности, чего само слово здесь не требует.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом, соответствующим повествованию Марка. «Тотчас» сохраняет достоинство библейского регистра без архаизации; «разнеслась» звучит естественно и ясно.
