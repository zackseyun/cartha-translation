source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: ru
  text: 'И он возвещал: «Следом за мной идёт Тот, Кто сильнее меня. Я недостоин наклониться и развязать ремешок Его сандалий».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не годен наклониться и развязать ремешок Его сандалий».'
    reason: Лексическое значение ἱκανός допускает оттенки пригодности, достаточности или способности, хотя в данном контексте особенно подчёркнуто недостоинство.
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: возвещал
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие, а «возвещал» сохраняет смысл публичного провозглашения без узко церковного оттенка.
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: В современном русском сочетание «возвещал, говоря» тяжеловесно; содержание причастия естественно передаётся введением прямой речи.
- source_word: Ἔρχεται
  choice: идёт
  rationale: Настоящее время сохраняет живую непосредственность греческой формы; в сочетании «следом за мной идёт» звучит естественно.
- source_word: ὁ ἰσχυρότερός μου
  choice: Тот, Кто сильнее меня
  rationale: Артикль субстантивирует сравнительное прилагательное; перевод сохраняет прямой смысл силы и естественен по-русски.
- source_word: ὀπίσω μου
  choice: следом за мной
  rationale: Выражение сохраняет как пространственный образ, так и временной смысл появления после Иоанна.
- source_word: ἱκανὸς
  choice: достоин
  rationale: В данном контексте слово выражает не просто способность, а глубокое сознание несоответствия статусу Грядущего.
- source_word: κύψας λῦσαι
  choice: наклониться и развязать
  rationale: Координация инфинитивов естественно передаёт по-русски сопутствующее и предшествующее действие аористного причастия.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: ремешок Его сандалий
  rationale: «Ремешок» ясно обозначает кожаное крепление, а «сандалии» исторически точно передают вид обуви.
theological_decisions:
- issue: Степень самоуничижения Иоанна
  choice: Я недостоин даже наклониться и развязать
  alternative: Я не годен / не способен наклониться и развязать
  rationale: Контекст сопоставления с более сильным Грядущим указывает прежде всего на недостоинство и низший статус Иоанна, а не на физическую неспособность; «даже» эксплицирует прагматически очевидный смысл самой унизительной рабской услуги.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Краткие фразы облегчают восприятие устного провозглашения. Заглавные местоименные формы в отношении Грядущего применены как издательская норма уважительного библейского регистра, не добавляя к тексту отдельного догматического утверждения.
