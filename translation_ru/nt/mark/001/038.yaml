  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: ru
  text: 'И Он сказал им: «Пойдём в другие места, в соседние селения[b], чтобы и там проповедовать, ведь для этого Я вышел[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради этой цели Я вышел». Эти слова могут относиться просто к тому, что Иисус покинул прежнее место, или, в более широком смысле, к цели Его выхода на проповедь.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово обозначает небольшие населённые пункты — нечто среднее между деревнями и городами.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Пойдём
  rationale: 'Побудительный конъюнктив первого лица множественного числа естественно передаётся приглашением к совместному действию: «Пойдём».'
- source_word: ἀλλαχοῦ
  choice: в другие места
  rationale: Наречие указывает на перемещение в иное место; такой перевод ясен и естественен по-русски.
- source_word: ἐχομένας
  choice: соседние
  rationale: В сочетании с названиями мест причастие обозначает ближайшие или соседние населённые пункты.
- source_word: κωμοπόλεις
  choice: селения
  rationale: Слово обозначает небольшие населённые пункты промежуточного типа между деревней и городом. «Селения» достаточно широко и не навязывает современной административной категории.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: чтобы Мне и там проповедовать
  rationale: «Чтобы» сохраняет значение цели, а «и там» передаёт акцент καὶ ἐκεῖ. «Проповедовать» — понятный и устоявшийся эквивалент κηρύσσω в данном контексте.
- source_word: εἰς τοῦτο
  choice: для этого
  rationale: Оборот выражает цель или основание и лаконично передаётся по-русски словами «для этого».
- source_word: ἐξῆλθον
  choice: Я вышел
  rationale: Буквальный и естественный перевод аориста ἐξέρχομαι, не уточняющий, идёт ли речь о выходе из конкретного места или, шире, о выходе на проповедь.
- source_word: λέγει αὐτοῖς
  choice: Он сказал им
  rationale: Греческий исторический презенс естественно передан русским прошедшим временем в повествовании.
theological_decisions:
- issue: Смысл и масштаб ἐξῆλθον
  choice: Я вышел
  alternative: Я пришёл ради этого / ради этого Я отправился в путь
  rationale: Греческая фраза может относиться как к недавнему выходу Иисуса из конкретного места, так и шире к цели Его выхода на проповедь. Перевод сохраняет эту неоднозначность и не вводит утверждения о происхождении или миссии, которого текст прямо не уточняет.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Тире поясняет отношение между «другими местами» и «соседними селениями». Слово «селения» выбрано как широкое обозначение небольших населённых пунктов без привязки к современной административной классификации.
