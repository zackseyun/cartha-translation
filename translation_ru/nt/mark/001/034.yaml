  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: ru
  text: И Он исцелил многих, страдавших различными болезнями, и изгнал многих бесов. Он не позволял бесам говорить, потому что они знали Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они знали, кто Он». По-гречески буквально: «они знали Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: Глагол θεραπεύω здесь обозначает исцеление; «исцелил» естественно и точно передаёт действие Иисуса.
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: многих, страдавших
  rationale: Греческая идиома κακῶς ἔχω означает «быть больным». В сочетании с последующим указанием на болезни «страдавших» даёт естественный русский текст без ненужного повтора.
- source_word: ποικίλαις νόσοις
  choice: различными болезнями
  rationale: ποικίλος указывает на разнообразие, а νόσος — на болезнь; творительный падеж естественно передаёт греческий оборот.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: изгнал многих бесов
  rationale: В контексте освобождения от бесов ἐκβάλλω означает изгнать; это точная и привычная для русского библейского повествования формулировка.
- source_word: οὐκ ἤφιεν
  choice: не позволял
  rationale: Имперфект передаёт продолжавшийся или повторявшийся в данной сцене запрет; несовершенный вид русского глагола сохраняет этот оттенок.
- source_word: λαλεῖν
  choice: говорить
  rationale: Нейтральный глагол «говорить» соответствует обычному значению λαλέω и подходит к достоинству повествовательного регистра.
- source_word: ὅτι
  choice: потому что
  rationale: Союз естественнее всего понимать как указание на причину запрета.
- source_word: ᾔδεισαν αὐτόν
  choice: они знали Его
  rationale: Перевод сохраняет прямое дополнение αὐτόν и не разворачивает его в отсутствующее в греческом тексте пояснение личности Иисуса.
theological_decisions:
- issue: Следует ли явно уточнить, что бесы знали, кем был Иисус
  choice: они знали Его
  alternative: они знали, кто Он
  rationale: Греческий текст говорит буквально лишь «знали Его». Более развёрнутый вариант возможен по смыслу, но сделал бы христологическое содержание явнее, чем это выражено в данном стихе; краткая формулировка сохраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с естественным, dignified повествовательным ритмом. Сохранены трёхчастная структура стиха, аспектуальный оттенок имперфекта «не позволял» и лаконичность заключительной фразы.
