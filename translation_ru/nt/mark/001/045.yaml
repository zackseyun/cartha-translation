source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: ru
  text: Но он, выйдя, стал широко возвещать и распространять весть, так что Иисус уже не мог открыто войти в город, а оставался снаружи, в безлюдных местах. И к Нему приходили отовсюду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: много рассказывать
  rationale: Передаёт интенсивное и пространное возвещение исцелённого естественным современным русским языком; πολλὰ здесь наречно характеризует масштаб его рассказа.
- source_word: διαφημίζειν τὸν λόγον
  choice: повсюду распространять весть
  rationale: διαφημίζειν означает широко разглашать, а τὸν λόγον в данном контексте — весть о случившемся, не обязательно дословно «слово».
- source_word: φανερῶς
  choice: открыто
  rationale: Сохраняет смысл публичного, беспрепятственного появления.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: в безлюдных местах
  rationale: ἐρήμοις описывает необитаемые или уединённые места; «безлюдных» естественно и не вызывает узкой ассоциации с песчаной пустыней.
- source_word: ἤρχοντο ... πάντοθεν
  choice: приходили отовсюду
  rationale: Имперфект передан как продолжавшееся или повторявшееся действие.
theological_decisions:
- issue: Явное обозначение субъекта αὐτόν
  choice: Иисус
  alternative: Он
  rationale: Греческое местоимение относится к Иисусу; имя устраняет возможную двусмысленность после упоминания исцелённого, не добавляя богословского толкования.
- issue: Содержание τὸν λόγον
  choice: весть
  alternative: слово
  rationale: Контекст указывает на сообщение об исцелении; перевод «весть» сохраняет смысл без превращения выражения в специальный богословский термин.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Начальное «А тот» сохраняет контраст δὲ и ясно возвращает к исцелённому человеку; прописная буква в «Нему» следует традиционному русскому благоговейному оформлению местоимения, относящегося к Иисусу.
