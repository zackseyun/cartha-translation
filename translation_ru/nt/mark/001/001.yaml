  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: ru
  text: Начало благой вести[a] Иисуса, Мессии[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Евангелия». Греческое εὐαγγέλιον означает «благая весть»; «Евангелие» — традиционная передача этого слова.
    reason: lexical_alternative
  - marker: b
    text: Или «Христа». Греческое Χριστός, употреблённое как титул, означает «Мессия».
    reason: alternative_reading
  - marker: c
    text: Греческий родительный падеж может указывать как на весть об Иисусе, так и на весть, возвещённую им или принадлежащую ему.
    reason: source_ambiguity
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Начало
  rationale: Краткое именное начало сохраняет форму греческого зачина и не превращает его в полное предложение.
- source_word: εὐαγγελίου
  choice: Благой вести
  rationale: Передаёт общеязыковое значение εὐαγγέλιον понятными современными словами; традиционный вариант «Евангелия» указан в сноске.
- source_word: Ἰησοῦ
  choice: Иисусе
  rationale: Имя передано в принятой русской библейской форме; предлог «об» естественно выражает основное контекстуальное понимание вести как вести об Иисусе.
- source_word: χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь естественно понимать как титул Иисуса, поэтому передано его значением, а не как вторая часть имени; традиционный вариант «Христа» дан в сноске.
theological_decisions:
- issue: Передавать ли Χριστός как титул или как традиционную часть имени
  choice: Мессии
  alternative: Христа
  rationale: В программном зачине Марка слово обозначает мессианское достоинство Иисуса. Перевод «Мессия» раскрывает титул, не вводя дополнительного конфессионального толкования.
- issue: Как понять родительный падеж в выражении εὐαγγελίου Ἰησοῦ χριστοῦ
  choice: Благая весть об Иисусе — Мессии
  alternative: Благая весть, возвещённая Иисусом Мессией / принадлежащая Иисусу Мессии
  rationale: В контексте наиболее естественна объективная связь — весть об Иисусе, однако греческая форма сама по себе допускает и субъектное либо более общее отношение. Эта неоднозначность прямо отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной краткостью заглавного зачина. Заглавные буквы в сочетании «Благая весть» подчёркивают его употребление как обозначения провозглашения, не превращая выражение в узкоконфессиональный термин. Тире естественно оформляет «Мессия» как поясняющий титул.
