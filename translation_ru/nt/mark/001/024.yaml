  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: ru
  text: 'говоря: «Что тебе до нас, Иисус Назарянин[a]? Ты пришёл погубить нас? Я знаю, кто Ты: Святой Божий».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус из Назарета». Буквально: «Иисус Назарянин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ἡμῖν καὶ σοί
  choice: Что тебе до нас
  rationale: 'Краткая и естественная русская идиома передаёт формулу отчуждения или враждебного неприятия, буквально: «что нам и Тебе».'
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Иисус Назарянин
  rationale: Сохраняет звательную функцию и передаёт Ναζαρηνός как обозначение человека из Назарета, не превращая его в пояснительную конструкцию.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: Ты пришёл погубить нас?
  rationale: «Пришёл» естественно передаёт аорист с актуальным результатом, а «погубить» выражает уничтожение без излишнего уточнения его характера; множественное «нас» сохранено.
- source_word: οἶδά σε τίς εἶ
  choice: Я знаю, кто Ты
  rationale: Прямое и естественное выражение узнавания личности; местоимение с прописной буквы соответствует достоинству русского библейского регистра, не добавляя содержания.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Святой Божий
  rationale: Титульная русская формула точно и ёмко передаёт определённое ὁ ἅγιος и родительную связь τοῦ θεοῦ.
theological_decisions:
- issue: Христологический титул в устах нечистого духа
  choice: Святой Божий
  alternative: Святой Бога
  rationale: Выбранная традиционно понятная русская титульная конструкция сохраняет силу признания, но не разворачивает её в более полное догматическое исповедание.
- issue: Множественное число в речи единственного нечистого духа
  choice: нас
  alternative: меня
  rationale: Греческое ἡμῖν/ἡμᾶς последовательно стоит во множественном числе; перевод сохраняет эту напряжённость и не объясняет, кого именно включает говорящий.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Реплика звучит резко и естественно; подлинная неопределённость множественного «нас» сохранена. Маркер сноски поставлен после соответствующего выражения.
