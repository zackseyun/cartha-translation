id: MRK.1.10
reference: Mark 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: ru
  text: И сразу же, поднимаясь из воды, он увидел, как разрываются небеса[a] и Дух, словно голубь, нисходит на него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небеса раскалываются». Употреблённый греческий глагол сильнее, чем просто «открываются».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в него». Греческий предлог εἰς может означать движение внутрь, однако здесь выражение «на него» лучше соответствует контексту нисхождения Духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: сразу же
  rationale: Передаёт характерную для Марка повествовательную стремительность естественным современным русским выражением.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: поднимаясь из воды
  rationale: Причастный оборот сохраняет одновременность действия с εἶδεν, а «из воды» точно передаёт ἐκ.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямое соответствие простому аористу глагола зрительного восприятия.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: как разрываются небеса
  rationale: «Разрываются» сохраняет сильный и зримый образ σχίζω, не ослабляя его до простого «открываются»; множественное число «небеса» соответствует греческому тексту и библейскому регистру.
- source_word: τὸ πνεῦμα
  choice: Дух
  rationale: В контексте речь идёт о Божьем Духе; при этом перевод не добавляет отсутствующее в данном месте определение «Святой».
- source_word: ὡς περιστερὰν
  choice: словно голубь
  rationale: Сравнительный оборот оставляет открытым, относится ли образ к виду, движению или обоим аспектам.
- source_word: καταβαῖνον
  choice: нисходит
  rationale: «Нисходит» точно передаёт движение сверху вниз и поддерживает достойный библейский регистр без архаической тяжеловесности.
- source_word: εἰς αὐτόν
  choice: на него
  rationale: При глаголе нисхождения это естественное русское выражение направления к человеку; возможное буквальное значение «в него» отмечено в сноске.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Божий Дух, переданный как «Дух»
  alternative: «Святой Дух»
  rationale: Контекст указывает на Божьего Духа, однако в греческом тексте стоит τὸ πνεῦμα без определения «Святой», поэтому оно не добавляется.
- issue: Смысл сравнения с голубем
  choice: Неуточнённое сравнение «словно голубь»
  alternative: Дух принял вид голубя; Дух спускался подобно голубю
  rationale: ὡς обозначает сравнение, но не определяет, идёт ли речь о внешнем виде, характере движения или о том и другом.
- issue: Направление нисхождения Духа
  choice: «на него»
  alternative: «в него»
  rationale: εἰς допускает значение движения внутрь, но в сочетании с нисхождением Духа контекстуально и идиоматически предпочтительно «на него»; лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Строчные местоимения не вносят отсутствующего в греческом тексте графического почтения. Порядок образов и напряжённая динамика повествования сохранены.
