  source_fidelity: 'Основной смысл передан верно: речь о том, что свидетельские показания не согласовывались между собой. Однако «в этом» без существительного звучит несколько неопределённо и может восприниматься как указание на предмет обвинения, тогда как οὕτως отсылает к только что описанному способу/случаю. Связка «но» несколько сильнее противопоставляет, чем простое καί.'
