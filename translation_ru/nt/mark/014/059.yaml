lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: Но даже и
  rationale: В данном контексте сочетание продолжает рассказ и подчёркивает, что согласия не было даже при этой формулировке обвинения; русское «но даже и» естественно передаёт связь и усиленное отрицание.
- source_word: οὕτως
  choice: в этом
  rationale: Отсылает к только что приведённому способу изложения обвинения; по-русски «в этом» звучит естественнее буквального «таким образом».
- source_word: ἴση ἦν
  choice: не совпадали
  rationale: Буквально говорится, что свидетельство «не было равным»; в судебном контексте смысл состоит в том, что показания свидетелей не соответствовали друг другу.
- source_word: ἡ μαρτυρία αὐτῶν
  choice: их свидетельства
  rationale: 'Хотя греческое существительное стоит в единственном числе, контекст нескольких свидетелей и русская идиоматика требуют множественного числа: речь идёт об их показаниях, которые не совпадали.'
