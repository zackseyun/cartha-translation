  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: ru
  text: 'Истинно говорю вам: Я больше не буду пить[a] от плода виноградной лозы[b] вплоть до того дня, когда буду пить его заново[c] в Царстве Божьем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст содержит усиленное отрицание: «ни в коем случае больше не буду пить»; возможно также: «никогда больше не буду пить».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от плода лозы» — так здесь назван напиток из винограда, поданный за трапезой.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «буду пить его новым». Греческое слово может означать «новый» и подразумевать новизну грядущего Царства.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Передаёт торжественную формулу заверения ясно и естественно для современного русского языка; «аминь» здесь было бы менее прозрачно.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: Я больше не буду пить
  rationale: «Больше не» передаёт οὐκέτι, а будущее время — направленность emphatic οὐ μὴ с аористом сослагательного наклонения; особая категоричность отрицания отмечена в сноске.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: от плода виноградной лозы
  rationale: Сохраняет исходный образ и не конкретизирует напиток словом «вино», которого в греческом тексте здесь нет.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: вплоть до того дня
  rationale: Точно передаёт временной предел и указательное значение ἐκείνης.
- source_word: ὅταν αὐτὸ πίνω
  choice: когда буду пить его
  rationale: В русском придаточном будущем требуется форма «буду пить»; местоимение «его» естественно отсылает к ранее упомянутому плоду лозы, то есть напитку.
- source_word: καινὸν
  choice: новым
  rationale: Буквально сохраняет качественное значение «новый», не сводя его однозначно к наречному «снова» или «по-новому».
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: в Царстве Божьем
  rationale: Естественная современная русская форма традиционного новозаветного выражения, сохраняющая его богословскую значимость.
theological_decisions:
- issue: Значение καινὸν в заключительной части стиха
  choice: «новым» — без уточнения характера новизны
  alternative: «заново» или «по-новому»
  rationale: Греческое прилагательное допускает качественную, в том числе эсхатологическую, новизну, тогда как контекст может также вызывать смысл возобновлённого питья. Перевод не устраняет эту напряжённость.
- issue: Что именно названо «плодом виноградной лозы»
  choice: Сохранён исходный образ
  alternative: «вино»
  rationale: Хотя по контексту речь идёт о напитке в чаше, оригинал прямо не употребляет слово «вино»; более конкретный перевод был бы интерпретацией.
- issue: Сила отрицания οὐ μὴ
  choice: В основном тексте естественное «больше не буду пить», с пояснением в сноске
  alternative: «ни в коем случае больше не буду пить» или «никогда больше не буду пить»
  rationale: Конструкция выражает категорическое отрицание будущего действия, но вариант «никогда» без оговорки может затушевать прямо названный предел «до того дня».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Заглавная буква в местоимении «Я» обусловлена началом предложения, а не специальной конфессиональной капитализацией. Формулировка сохраняет образность и смысловую неоднозначность оригинала.
