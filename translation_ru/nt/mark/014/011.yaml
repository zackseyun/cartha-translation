id: MRK.14.11
reference: Mark 14:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: ru
  text: Услышав это, они обрадовались и пообещали дать ему денег[a]. А он стал искать удобного случая, чтобы предать его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебра». Греческое слово может обозначать как серебро, так и деньги вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выдать его», «передать его в руки». В данном контексте «предать» передаёт вероломный характер поступка Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Услышав это, они
  rationale: Причастный оборот передаёт временную связь и естественно звучит по-русски; «это» восполняет подразумеваемый из контекста объект.
- source_word: ἐχάρησαν
  choice: обрадовались
  rationale: Передаёт наступившую радость противников Иисуса и сохраняет нравственно значимый контраст повествования.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: пообещали дать ему денег
  rationale: Глагол означает обещание или обязательство, а ἀργύριον в данном контексте естественно обозначает деньги без уточнения суммы или вида монет.
- source_word: ἐζήτει
  choice: стал искать
  rationale: Имперфект выражает начавшееся и продолжавшееся действие; «стал искать» хорошо передаёт переход к новому этапу замысла.
- source_word: πῶς αὐτὸν εὐκαίρως παραδοῖ
  choice: искать удобного случая, чтобы предать его
  rationale: Естественная русская конструкция передаёт поиск подходящей возможности и целевую направленность действия, не добавляя не названных в стихе обстоятельств.
- source_word: παραδοῖ
  choice: предать
  rationale: Хотя основной образ глагола — передача кого-либо в чужие руки, в действиях Иуды контекстуально выражено вероломное предательство; буквальная альтернатива сохранена в сноске.
theological_decisions:
- issue: Передача παραδίδωμι применительно к поступку Иуды
  choice: предать
  alternative: выдать; передать в руки
  rationale: Контекст описывает не нейтральную передачу, а тайное содействие противникам Иисуса. «Предать» передаёт эту повествовательную и нравственную окраску, а сноска сохраняет буквальный диапазон глагола.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Союз «а» во втором предложении естественно отмечает переход от реакции первосвященников к последующим действиям Иуды. Местоимение «его» оставлено со строчной буквы в соответствии с обычной современной издательской практикой и без внесения отсутствующего в греческом тексте графического толкования.
