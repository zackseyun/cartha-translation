source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: ru
  text: 'И куда бы он ни вошёл, скажите хозяину дома: «Учитель говорит: „Где Моя комната для гостей[a], в которой Я буду есть пасху с Моими учениками?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помещение для Меня» или «место для ночлега». Греческое слово обозначает место, где останавливаются; здесь, вероятнее всего, имеется в виду гостевая комната в частном доме, а не постоялый двор.'
    reason: Лексический диапазон κατάλυμα и его наиболее вероятное контекстуальное значение.
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: куда бы он ни вошёл
  rationale: Сочетание ὅπου с ἐάν и аористом сослагательного наклонения имеет неопределённо-относительное значение. Русская конструкция «куда бы… ни» естественно передаёт неопределённость направления и сохраняет связь с глаголом движения.
- source_word: εἴπατε
  choice: скажите
  rationale: Аорист повелительного наклонения во множественном числе обращён к двум ученикам; «скажите» точно вводит последующую прямую речь.
- source_word: οἰκοδεσπότῃ
  choice: хозяину дома
  rationale: Слово обозначает человека, распоряжающегося домом или хозяйством. Этот вариант ясен современному читателю и сохраняет подразумеваемое положение главы дома.
- source_word: Ὁ διδάσκαλος
  choice: Учитель
  rationale: Обычное значение слова — «учитель»; здесь оно употреблено как узнаваемое обозначение Иисуса. Прописная буква отражает титульное употребление, не усиливая его до иного христологического титула.
- source_word: τὸ κατάλυμά μου
  choice: Моя комната для гостей[a]
  rationale: В данном домашнем контексте κατάλυμα вероятнее всего означает помещение для размещения гостей, а не постоялый двор. Притяжательное местоимение μου сохранено словом «Моя».
- source_word: τὸ πάσχα
  choice: пасху
  rationale: В сочетании с глаголом «есть» слово обозначает пасхальную пищу или трапезу. Традиционная и понятная русская формулировка не требует добавления отсутствующего в греческом тексте слова «трапеза».
- source_word: μετὰ τῶν μαθητῶν μου
  choice: с Моими учениками
  rationale: «Ученики» — устойчивый и точный евангельский эквивалент μαθηταί; притяжательное местоимение сохранено.
- source_word: φάγω
  choice: Я буду есть
  rationale: Сослагательная форма относится к предполагаемому действию в искомом помещении. В естественном русском языке контекстуальное будущее передаёт это без неуместного оттенка сомнения, который могло бы внести «мог бы».
theological_decisions:
- issue: Передача обозначения Иисуса Ὁ διδάσκαλος
  choice: Учитель
  alternative: Наставник; Господин
  rationale: «Учитель» передаёт прямое лексическое значение и узнаваемое в повествовании обозначение Иисуса, не привнося более сильного утверждения о статусе, чем выражено греческим словом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным евангельским регистром. Вложенная прямая речь оформлена русскими кавычками. Прописные буквы в местоимениях, относящихся к Иисусу, поддерживают традиционный уважительный регистр; лексика при этом остаётся современной и общепонятной.
