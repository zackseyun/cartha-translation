  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: ru
  text: 'Увидев Петра, который грелся, она пристально посмотрела на него и говорит: «И ты был с Иисусом Назарянином».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασα αὐτῷ
  choice: пристально посмотрела на него
  rationale: Передаёт направленный, внимательный взгляд, выраженный глаголом ἐμβλέπω, естественным современным русским оборотом.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее оригинала, которое оживляет повествование.
- source_word: τοῦ Ναζαρηνοῦ … τοῦ Ἰησοῦ
  choice: с Иисусом Назарянином
  rationale: Естественный русский порядок слов сохраняет отождествление Иисуса по происхождению/прозванию «Назарянин» без добавочного толкования.
- source_word: Καὶ σὺ
  choice: И ты
  rationale: 'Сохраняет присоединительное и выделительное значение καί: служанка относит Петра к числу спутников Иисуса.'
theological_decisions:
- issue: Обозначение Иисуса как Ναζαρηνός
  choice: Иисус Назарянин
  alternative: Иисус из Назарета
  rationale: Форма «Назарянин» ближе к существительному/эпитету оригинала и не сводит его явно только к указанию места происхождения.
translation_notes:
  register: Современный литературный русский язык; повествовательное историческое настоящее сохранено вслед за греческим текстом. Формулировка ясная, сдержанная и пригодная для публичного чтения.
