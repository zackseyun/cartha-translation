base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: ru
  text: Но после того, как Меня воскресят[a], Я пойду впереди вас в Галилею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того, как Я буду воскрешён». В греческом тексте употреблён пассивный инфинитив глагола, означающего «поднимать, воскрешать», — обычное выражение, говорящее о воскресении.'
    reason: лексическая альтернатива и пояснение пассивной формы
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Краткий и естественный противительный союз, обозначающий контраст с предшествующим предсказанием о рассеянии учеников.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: после того, как Я буду воскрешён
  rationale: Конструкция μετά с субстантивированным инфинитивом выражает последующее время. Русская придаточная конструкция естественно передаёт значение «после», а форма «буду воскрешён» сохраняет пассивный залог греческого текста.
- source_word: ἐγερθῆναί
  choice: буду воскрешён
  rationale: Аористный пассивный инфинитив ἐγείρω употреблён в контексте воскресения. Выбор сохраняет пассивную форму и не заменяет её толкующим активным «воскресну».
- source_word: προάξω
  choice: пойду впереди
  rationale: Будущая форма προάγω здесь означает, что Иисус раньше учеников направится к указанному месту. «Пойду впереди» понятно современному читателю и сохраняет пространственно-направительный оттенок.
- source_word: ὑμᾶς
  choice: вас
  rationale: Форма второго лица множественного числа естественно передаётся русским «вас».
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Предлог εἰς обозначает движение к месту или внутрь него; русский винительный с «в» точно и естественно передаёт это направление.
theological_decisions:
- issue: Пассивная формулировка воскресения в ἐγερθῆναί με
  choice: после того, как Я буду воскрешён
  alternative: после того, как Я воскресну
  rationale: Пассив сохранён как значимая особенность исходного текста; перевод не уточняет прямо действующее лицо и не сглаживает выражение до возвратного или непереходного глагола.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Избегнуто традиционное «предварю вас», которое для многих современных читателей не вполне прозрачно; пассивная формулировка воскресения сознательно сохранена.
