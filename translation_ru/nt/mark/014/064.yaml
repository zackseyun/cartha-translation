  terminology: «Богохульство» сохраняет юридико-религиозный характер обвинения и не утверждает его справедливость от лица повествователя. «Достойным смерти» надёжно передаёт ἔνοχον ... θανάτου; в примечании сохранён юридически более эксплицитный вариант «подлежащим смертной казни».
