  source_fidelity: 'Начальная реплика и вопрос переданы точно: «Вы слышали богохульство. Каково ваше решение?» естественно воспроизводят ἠκούσατε τῆς βλασφημίας и τί ὑμῖν φαίνεται в судебном контексте. Однако «признали Его виновным и подлежащим смерти» расчленяет единый греческий судебный оборот ἔνοχον εἶναι θανάτου на два утверждения и делает «виновным» смыслово неполным: в оригинале речь именно о признании подлежащим смерти / заслуживающим смерти.'
