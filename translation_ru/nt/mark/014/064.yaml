base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: ru
  text: «Вы слышали богохульство. Каково ваше решение?» И все признали Его достойным смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осудили Его как заслуживающего смерти»; «признали Его подлежащим смертной казни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: вы слышали
  rationale: Русское прошедшее время естественно передаёт аорист и отсылает к только что услышанным словам.
- source_word: τῆς βλασφημίας
  choice: богохульство
  rationale: Сохраняет религиозно-правовой вес обвинения; определённость понятна из ближайшего контекста и не требует указательного местоимения.
- source_word: τί ὑμῖν φαίνεται
  choice: каково ваше решение?
  rationale: В контексте разбирательства оборот запрашивает мнение или вердикт; эта формулировка естественна по-русски и сохраняет судебный оттенок.
- source_word: οἱ δὲ πάντες
  choice: и все
  rationale: Явно сохраняет подчёркнутое в греческом единодушие.
- source_word: κατέκριναν
  choice: признали виновным
  rationale: Передаёт судебное значение κατακρίνω — вынести обвинительный приговор; в сочетании со следующим оборотом избегает тяжеловесного повтора слова «осудили».
- source_word: ἔνοχον εἶναι θανάτου
  choice: виновным и подлежащим смерти
  rationale: Передаёт как обвинительный вердикт, так и подверженность смертной казни, не сводя выражение только к моральной оценке «достоин смерти».
theological_decisions:
- issue: Обвинение в богохульстве в контексте суда
  choice: богохульство
  alternative: богохульные слова
  rationale: Текст сообщает формулировку обвинителей, не подтверждая справедливость обвинения от лица рассказчика; термин сохраняет правовую и богословскую напряжённость.
- issue: Значение ἔνοχον θανάτου
  choice: виновным и подлежащим смерти
  alternative: достойным смерти
  rationale: Выбранный вариант сохраняет неоднозначное сочетание виновности и юридической ответственности, не превращая судебный вердикт исключительно в нравственную оценку.
translation_notes:
  register: Современный литературный русский язык, понятный широкой аудитории; речь сохраняет достоинство и судебный характер сцены. Заглавная буква в местоимении «Его» соответствует принятому благоговейному оформлению христианского текста.
