  yaml_path: translation/nt/mark/014/046.yaml
  text: Then they laid hands on him and seized him[a][b].
translation:
  language: ru
  text: Тогда они наложили на Него руки и схватили Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Тогда они
  rationale: Субстантивированное οἱ передано местоимением «они», а δέ — естественным для повествования «тогда», без усиления противопоставления.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: схватили Его
  rationale: Греческое выражение буквально говорит о возложении рук, но здесь идиоматически обозначает физическое задержание; «схватили» естественно передаёт враждебное действие.
- source_word: ἐκράτησαν αὐτόν
  choice: стали держать
  rationale: κρατέω обозначает удерживание схваченного человека. Такая передача сохраняет последовательность двух действий и не сводит оба греческих выражения к одному понятию «арестовали».
