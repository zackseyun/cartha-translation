  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: ru
  text: И, оставив Его, все убежали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь с предшествующей сценой ареста, не добавляя временного или причинного оттенка.
- source_word: ἀφέντες
  choice: оставили
  rationale: В данном контексте ἀφίημι означает оставить кого-либо; личная форма по-русски естественно и лаконично передаёт греческое деепричастие вместе с последующим сказуемым.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому в русском библейском стиле почтительному написанию.
- source_word: ἔφυγον
  choice: убежали
  rationale: Передаёт бегство от опасности естественным современным русским словом, сохраняя динамику действия.
- source_word: πάντες
  choice: все
  rationale: 'Сохраняет подчёркнутую греческим текстом полноту: Иисуса оставили все находившиеся с Ним спутники.'
theological_decisions:
- issue: Полнота оставления Иисуса учениками
  choice: все оставили Его и убежали
  alternative: оставив Его, все бежали
  rationale: Перевод прямо сохраняет утверждение πάντες о всеобщем бегстве спутников Иисуса в этот момент, не смягчая и не расширяя смысл текста.
translation_notes:
  register: Современный литературный русский язык; краткая, напряжённая повествовательная фраза. Координация двух личных глаголов звучит естественнее буквального причастного оборота и сохраняет последовательность действий.
