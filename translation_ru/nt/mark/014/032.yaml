  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: ru
  text: 'И приходят они в место, называемое Гефсиманией, и Он говорит Своим ученикам: «Посидите здесь, пока Я помолюсь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: приходят
  rationale: 'Историческое настоящее сохранено: в русском повествовании оно звучит естественно и передаёт живость стиля Марка.'
- source_word: χωρίον
  choice: место
  rationale: Нейтрально передаёт широкое значение слова, не уточняя без достаточных оснований, было ли это владение, участок или сад.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: называемое Гефсиманией
  rationale: Естественная современная русская передача конструкции «которому имя», с традиционной формой топонима.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее оригинала, согласованное с «приходят».
- source_word: μαθηταῖς
  choice: ученикам
  rationale: Стандартный и точный евангельский эквивалент, сохраняющий отношение учителя и учеников.
- source_word: Καθίσατε
  choice: Посидите
  rationale: В данном контексте естественно выражает повеление оставаться сидеть на месте; форма «сядьте» также возможна, но слабее передаёт ожидаемую продолжительность.
- source_word: ὧδε
  choice: здесь
  rationale: Прямой и естественный эквивалент указательного наречия.
- source_word: ἕως προσεύξωμαι
  choice: пока Я помолюсь
  rationale: Естественно передаёт временной предел, заданный ἕως с аористом сослагательного наклонения, без излишнего уточнения завершённости.
