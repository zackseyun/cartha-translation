  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: ru
  text: 'Но один из стоявших рядом выхватил меч, ударил раба[a] первосвященника и отсёк ему ухо.


    [a] Или: «слугу» (греч. δοῦλος).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу» (греч. δοῦλος).'
    reason: 'Лексическая альтернатива: русское «слуга» возможно по функции, тогда как «раб» точнее сохраняет выраженный греческим словом зависимый статус.'
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Но один
  rationale: Передаёт мягкое повествовательное противопоставление δέ и неопределённость сочетания εἷς… τις, не уточняя личность нападавшего.
- source_word: τῶν παρεστηκότων
  choice: из стоявших рядом
  rationale: Сохраняет как принадлежность к присутствовавшей группе, так и пространственный оттенок причастия παρεστηκότων.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: выхватил меч
  rationale: В контексте оружия σπάομαι означает «извлечь, обнажить»; «выхватил меч» естественно передаёт быстрое действие, а греческое причастие преобразовано в однородное сказуемое.
- source_word: ἔπαισεν
  choice: ударил
  rationale: Прямой современный эквивалент, сохраняющий насильственный характер действия без архаизации.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: раба первосвященника
  rationale: «Раб» сохраняет обозначенный словом δοῦλος несвободный и подчинённый статус; родительный оборот звучит естественно и точно передаёт отношение к первосвященнику.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: отсёк ему ухо
  rationale: В данном насильственном контексте ἀφαιρέω означает отделение ударом; «ему» естественно передаёт посессивное αὐτοῦ, а уменьшительная форма ὠτάριον по-русски нейтрально переводится как «ухо».
theological_decisions:
- issue: Передача δοῦλος в повествовании о социальном статусе
  choice: раб
  alternative: слуга
  rationale: Основной текст сохраняет историческую реальность несвободного либо зависимого положения, не смягчая δοῦλος до более широкого «слуга»; допустимая лексическая альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык; краткое, динамичное повествование. Синтаксис с последовательностью однородных сказуемых естественно передаёт греческое причастие и два личных глагола. Не добавлено указание на правое ухо, отсутствующее у Марка.
