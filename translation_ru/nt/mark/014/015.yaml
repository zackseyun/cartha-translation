lexical_decisions:
- source_word: αὐτὸς
  choice: Он сам
  rationale: Ударное местоимение сохраняет выраженное в греческом тексте подчёркивание действующего лица.
- source_word: δείξει
  choice: покажет
  rationale: Естественно передаёт будущее время δείκνυμι; адресат выражен местоимением «вам».
- source_word: ἀνάγαιον
  choice: верхнюю комнату
  rationale: Обозначает помещение в верхней части дома; это точный и понятный современному читателю эквивалент.
- source_word: μέγα
  choice: большую
  rationale: Прямо и естественно передаёт размер помещения.
- source_word: ἐστρωμένον
  choice: обставленную
  rationale: Передаёт помещение, устроенное для пользования, вероятно снабжённое ложами или принадлежностями для трапезы, но не уточняет детали сверх текста.
- source_word: ἕτοιμον
  choice: готовую
  rationale: Сохраняет отдельный признак готовности и не смешивает его с предшествующим причастием.
- source_word: ἐκεῖ
  choice: там
  rationale: Естественный русский эквивалент локативного наречия.
- source_word: ἑτοιμάσατε
  choice: приготовьте
  rationale: Передаёт аористный императив множественного числа как прямое поручение ученикам.
- source_word: ἡμῖν
  choice: для нас
  rationale: Сохраняет простой дательный интереса, не раскрывая состав группы истолковательным добавлением.
