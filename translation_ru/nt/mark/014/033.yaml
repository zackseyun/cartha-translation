  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: ru
  text: И берёт Он с Собой Петра, Иакова и Иоанна и начинает ужасаться и тосковать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильно тревожиться и испытывать глубокую душевную муку». Первый глагол может обозначать сильный испуг, потрясение или ужас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: берёт с Собой
  rationale: Историческое настоящее сохранено ради живости повествования; глагол передаёт выбор спутников, которых Иисус берёт с собой.
- source_word: μετ’ αὐτοῦ
  choice: с Собой
  rationale: Естественно передаёт сопровождение Иисуса; прописная буква у возвратного местоимения соответствует принятому благоговейному русскому оформлению.
- source_word: ἤρξατο
  choice: начинает
  rationale: Сохраняет начинательное значение конструкции и согласуется с историческим настоящим предыдущего глагола.
- source_word: ἐκθαμβεῖσθαι
  choice: испытывать сильное потрясение
  rationale: Передаёт интенсивную эмоциональную реакцию — потрясение, ужас или глубокую тревогу — не сводя значение к простому удивлению.
- source_word: ἀδημονεῖν
  choice: тоску
  rationale: Выражает мучительную внутреннюю подавленность и душевную тяжесть; в сочетании с «сильным потрясением» сохраняет различие двух греческих глаголов.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повтор союзов по возможности сохранён, чтобы передать паратактическую манеру Марка.
theological_decisions:
- issue: Эмоциональное состояние Иисуса в Гефсимании
  choice: Прямо передать подлинное и сильное человеческое переживание как «сильное потрясение и тоску».
  alternative: Смягчить до «удивляться и тревожиться» либо усилить до «ужасаться и мучиться».
  rationale: Греческий текст описывает глубокое эмоциональное потрясение Иисуса. Формулировка не умаляет Его истинной человечности, но и не добавляет богословского объяснения, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной весомостью. Историческое настоящее сохранено. Имена переданы в традиционной русской библейской форме; синтаксис остаётся ясным для широкого читателя.
