  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: ru
  text: Каждый день Я был с вами в храме[a], учил, а вы не схватили Меня[b]. Но это произошло, чтобы исполнились Писания[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «храм» означает весь храмовый комплекс, включая дворы, а не только внутреннее святилище.
    reason: cultural_note
  - marker: b
    text: 'Или: «не арестовали Меня».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «Но чтобы исполнились Писания». В греческом тексте оборот эллиптический: главное сказуемое подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Каждый день
  rationale: Естественно передаёт распределительное значение «ежедневно, день за днём» без излишнего усиления.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: Я был с вами
  rationale: Сохраняет прямое значение присутствия Иисуса среди обращённых к Нему людей.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Обычное русское обозначение храмового комплекса; примечание уточняет, что речь не обязательно о внутреннем святилище.
- source_word: διδάσκων
  choice: и учил
  rationale: Передаёт сопутствующее продолжительное действие причастия естественной русской глагольной конструкцией.
- source_word: οὐκ ἐκρατήσατέ με
  choice: вы не схватили Меня
  rationale: «Схватили» сохраняет как физический, так и контекстуально арестный оттенок κρατέω, не превращая его в узкий юридический термин.
- source_word: ἀλλ’ ἵνα
  choice: Но это произошло, чтобы
  rationale: В греческом оборот эллиптический; добавление нейтрального «это произошло» делает фразу грамматически полной по-русски, не уточняя субъекта действия.
- source_word: πληρωθῶσιν
  choice: исполнились
  rationale: Передаёт аорист пассивного залога в устойчивом русском библейском сочетании с Писаниями.
- source_word: αἱ γραφαί
  choice: Писания
  rationale: Обозначает признанные священные тексты Израиля; прописная буква указывает на установленный религиозный референт.
theological_decisions:
- issue: Эллиптическое придаточное цели и божественный замысел
  choice: Но это произошло, чтобы исполнились Писания
  alternative: Но — чтобы исполнились Писания
  rationale: Греческий текст после ἀλλ’ ἵνα опускает главное сказуемое. Нейтральное восполнение «это произошло» обеспечивает ясность, сохраняя цель/результат и не усиливая детерминистическое прочтение.
- issue: Значение κρατέω в контексте задержания
  choice: схватили
  alternative: арестовали
  rationale: Выбор сохраняет более широкий физический смысл глагола и одновременно допускает подразумеваемое задержание.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис упрощён до естественной русской координации; прописные местоимения в обращении к Иисусу применены в соответствии с распространённой русской издательской традицией.
