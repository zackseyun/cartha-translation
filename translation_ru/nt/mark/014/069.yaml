  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: ru
  text: 'Увидев его, служанка снова стала говорить стоявшим рядом: «Этот человек — один из них».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: служанка
  rationale: Обозначает молодую женщину-служанку; «служанка» естественно для русского повествования и не утверждает прямо её правовой статус, который здесь не находится в центре внимания.
- source_word: ἰδοῦσα
  choice: увидев его
  rationale: Деепричастный оборот естественно передаёт аористное причастие и указывает на обстоятельство, вызвавшее её слова.
- source_word: ἤρξατο πάλιν λέγειν
  choice: снова стала говорить
  rationale: Передаёт и начинательность ἤρξατο, и повторность πάλιν, сохраняя естественный порядок слов в современном русском языке.
- source_word: τοῖς παρεστῶσιν
  choice: стоявшим рядом
  rationale: 'Сохраняет конкретный пространственный оттенок причастия: речь обращена к людям, находившимся поблизости.'
- source_word: Οὗτος
  choice: этот человек
  rationale: Указательное местоимение относится к Петру; добавление «человек» естественно по-русски и не привносит пренебрежительного оттенка.
- source_word: ἐξ αὐτῶν
  choice: один из них
  rationale: Естественно передаёт принадлежность Петра к группе последователей Иисуса.
