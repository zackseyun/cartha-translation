  source_fidelity: В первом предложении «заранее условился с ними о знаке» передаёт предполагаемую предварительную договорённость, но заменяет выражение δεδώκει ... σύσσημον («дал им условный/опознавательный знак») иной конструкцией. Более близкое «заранее дал им условный знак» сохраняет плюсквамперфектную предшествующую подготовку и действие субъекта. «Под надёжной охраной» является контекстуально обоснованным истолкованием ἀσφαλῶς; альтернативный смысл «безопасно» надлежащим образом оставлен в сноске.
