base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: ru
  text: 'А тот, кто предавал его, заранее дал им условный знак[a], сказав: «Тот, кого я поцелую[b], — это он. Схватите его и уведите под надёжной охраной[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об условном сигнале»; греческое слово означает заранее согласованный опознавательный знак.'
    reason: lexical_alternative
  - marker: b
    text: Поцелуй был обычной формой приветствия; здесь Иуда использует его как опознавательный знак.
    reason: cultural_note
  - marker: c
    text: 'Или: «уведите безопасно». В данном контексте, вероятно, имеется в виду, что его нужно было надёжно удерживать под контролем.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: заранее условился
  rationale: Плюсквамперфект указывает, что договорённость была достигнута до описываемого момента; наречие «заранее» естественно передаёт это по-русски.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: тот, кто предавал его
  rationale: Причастный оборот передан естественной русской конструкцией; «предавал» соответствует смыслу παραδίδωμι в повествовании об Иуде.
- source_word: σύσσημον
  choice: знак
  rationale: Речь идёт о заранее согласованном опознавательном знаке; это значение уточняется самой конструкцией «условился о знаке» и сноской.
- source_word: Ὃν ἂν φιλήσω
  choice: Кого я поцелую
  rationale: Сохраняется неопределённо-относительная конструкция и не добавляется отсутствующее в греческом слово «человек».
- source_word: αὐτός ἐστιν
  choice: тот и есть
  rationale: Краткая эллиптическая формула естественна в русском языке и сохраняет усиленное указание на опознаваемого человека.
- source_word: κρατήσατε
  choice: Схватите
  rationale: Передаёт физическое и настойчивое значение κρατέω, не сводя его к формально-правовому «арестуйте».
- source_word: ἀπάγετε ἀσφαλῶς
  choice: уведите под надёжной охраной
  rationale: В контексте задержания выражение, вероятнее всего, означает увести Иисуса так, чтобы он оставался под контролем; возможный оттенок «безопасно» сохранён в сноске.
