  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: ru
  text: 'И приходит, и видит, что они спят, и говорит Петру: «Симон, ты спишь? Неужели ты не смог бодрствовать один час?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: приходит
  rationale: Историческое настоящее сохранено, чтобы передать характерную для Марка живость повествования.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: видит, что они спят
  rationale: Оборот естественно передаёт обнаружение учеников в продолжающемся состоянии сна; буквальное «находит их спящими» возможно, но менее естественно в современном русском контексте.
- source_word: λέγει τῷ Πέτρῳ
  choice: говорит Петру
  rationale: Историческое настоящее сохранено; дательный падеж передан естественной русской конструкцией.
- source_word: Σίμων
  choice: Симон
  rationale: Сохранено личное имя, которым Иисус обращается к Петру, в отличие от авторского обозначения «Пётр».
- source_word: καθεύδεις
  choice: ты спишь?
  rationale: Настоящее время и непосредственный характер вопроса естественно переданы по-русски.
- source_word: οὐκ ἴσχυσας
  choice: неужели ты не смог
  rationale: В данном контексте глагол обозначает неспособность; «не смог» звучит естественно и не сводит смысл к физической силе. «Неужели» передаёт ожидаемый отрицательный ответ вопроса с οὐ.
- source_word: μίαν ὥραν
  choice: один час
  rationale: Винительный длительности времени естественно передаётся без предлога после «бодрствовать».
- source_word: γρηγορῆσαι
  choice: бодрствовать
  rationale: Слово сохраняет одновременно буквальный контраст со сном и оттенок настороженного бдения, важный в контексте.
theological_decisions:
- issue: Историческое настоящее у Марка
  choice: 'Основные повествовательные глаголы переданы настоящим временем: «приходит», «видит», «говорит».'
  alternative: 'Передать прошедшим временем: «пришёл», «увидел», «сказал».'
  rationale: Настоящее время отражает стиль греческого текста и остаётся приемлемым в русском библейском повествовании.
- issue: Смысл γρηγορέω
  choice: «бодрствовать»
  alternative: «не спать» или «оставаться бодрствующим»
  rationale: «Бодрствовать» передаёт прямое противопоставление сну, не устраняя более широкий оттенок бдительности и духовной настороженности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены короткие сочинительные связи и историческое настоящее Марка; обращение звучит непосредственно и естественно.
