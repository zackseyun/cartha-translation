base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: ru
  text: 'И тотчас петух пропел во второй раз. Пётр вспомнил сказанное Иисусом ему: «Прежде чем петух пропоёт дважды, ты трижды отречёшься от Меня». И, подумав об этом, плакал.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое причастие, переданное словами «подумав об этом», имеет неясное значение. Его также понимают как указание на внезапно нахлынувшее чувство или на внешний жест, например покрывание головы.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт временную непосредственность и характерную для Марка динамику; естественно звучит в современном литературном русском.
- source_word: ἐκ δευτέρου
  choice: во второй раз
  rationale: Сохраняет явное указание на повторный крик петуха.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: петух пропел
  rationale: Обычное русское обозначение крика петуха; контекст не требует указательного «этот петух».
- source_word: ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα
  choice: Пётр вспомнил слова
  rationale: Русское множественное «слова» естественно обозначает сказанное далее высказывание; буквальное «слово» здесь менее идиоматично.
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Иисуса, сказанные ему
  rationale: Естественно связывает воспоминание Петра с ранее произнесёнными Иисусом словами, не добавляя нового смысла.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Прежде чем петух пропоёт дважды
  rationale: Точно передаёт временную конструкцию πρίν с инфинитивом и два крика петуха.
- source_word: τρίς με ἀπαρνήσῃ
  choice: ты трижды отречёшься от Меня
  rationale: «Отречься от» точно передаёт личностный и публичный смысл ἀπαρνέομαι и является естественной русской библейской формулировкой.
- source_word: ἐπιβαλών
  choice: не выдержав
  rationale: Передаёт вероятный эмоциональный перелом и начало плача, не навязывая конкретного телесного жеста; ввиду трудности оборота иные понимания вынесены в примечание.
- source_word: ἔκλαιεν
  choice: он заплакал
  rationale: В сочетании с предшествующим причастием естественно обозначает наступление продолжающегося плача, хотя греческий имперфект сам по себе может передаваться и как «плакал».
theological_decisions:
- issue: Значение трудного причастия ἐπιβαλών
  choice: «не выдержав» как обозначение эмоционального надлома перед плачем
  alternative: «подумав об этом»; также предлагались значения, предполагающие внешний жест, например закрывание лица или головы
  rationale: Форма допускает несколько толкований и влияет на изображение реакции Петра. Основной текст сохраняет эмоциональную силу контекста, но не утверждает неясный телесный жест; неоднозначность явно отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Сохранены марковская стремительность («тотчас»), числовое соответствие «дважды — трижды» и прозрачная неоднозначность заключительного причастия.
