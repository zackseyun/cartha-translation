lexical_decisions:
- source_word: ἔλεγον
  choice: они говорили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся обсуждение; русское «говорили» естественно сохраняет этот видовой оттенок.
- source_word: γάρ
  choice: ведь
  rationale: Союз поясняет предыдущее утверждение; «ведь» естественно выражает пояснительную связь в современном русском.
- source_word: Μὴ
  choice: только не
  rationale: 'В греческом это краткая эллиптическая реплика: подразумевается «не [делать этого]». «Только не» сохраняет разговорную сжатость и оттенок предостережения.'
- source_word: ἐν τῇ ἑορτῇ
  choice: во время праздника
  rationale: Предлог ἐν имеет временное значение, а ἑορτή обозначает упомянутый в контексте праздничный период; перевод не добавляет отсутствующее здесь название праздника.
- source_word: μήποτε
  choice: чтобы не
  rationale: Оборот вводит опасаемое последствие; «чтобы не» ясно и естественно выражает предупредительную цель или опасение.
- source_word: ἔσται
  choice: возникло
  rationale: Будущая перспектива после μήποτε по-русски естественно передаётся конструкцией «чтобы не возникло».
- source_word: θόρυβος
  choice: возмущение
  rationale: Слово обозначает шумное общественное волнение или беспорядок. «Возмущение» передаёт возможность массовых волнений, не усиливая смысл до однозначного «мятежа».
- source_word: τοῦ λαοῦ
  choice: в народе
  rationale: Генитив допускает понимание как источника волнения, так и среды, внутри которой оно произойдёт. Основной текст использует естественное «в народе», а сноска сохраняет альтернативу.
