revisions:
- from: 'Иисус сказал: «Я есмь[a], и вы увидите Сына Человеческого, сидящего по правую руку Силы[b] и приходящего с облаками небесными[c]».'
  to: 'Иисус сказал: «Я[a], и вы увидите Сына Человеческого, восседающего по правую руку Силы[b] и приходящего с облаками небесными[c]».'
  rationale: Перевод исправлен только там, где это безопасно улучшает соответствие современному литературному русскому и сохраняет смысловую неопределённость оригинала. «Я» не вводит отсутствующее в греческом «Он» и не воспроизводит архаизм «есмь»; возможное более гладкое «Это Я» вынесено в сноску. «Восседающего» точнее отражает образ почётного, царственного положения, выраженный καθήμενον и контекстом Пс 109:1.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:42:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысловой состав стиха передан верно: прямой ответ Иисуса, видение Сына Человеческого по правую руку Силы и пришествие с облаками неба сохранены. Однако «Я есмь» в современном русском звучит как намеренная архаизация и может сильнее, чем греческая простая формула ἐγώ εἰμι в данном диалоге, направлять читателя к особому богословскому прочтению. Непредикативное «Я» точно отвечает на вопрос первосвященника, не добавляя «Он», и сохраняет исходную открытость.'
  naturalness: «Я» — естественный современный ответ на вопрос «Ты ли...?». «Восседающего» лучше передаёт статусное, престольное значение καθήμενον, чем нейтральное «сидящего», при этом оставаясь в умеренно возвышенном библейском регистре. Остальная фраза естественна для современного литературного русского.
  terminology: «Сын Человеческий» и «Сила» сохранены корректно. «Сила» с прописной буквы и пояснением в сноске удачно передаёт благоговейную перифразу τῆς δυνάμεως, не заменяя её прямым «Бог». Ссылка «Пс 109:1» соответствует традиционной русской нумерации Псалтири; Дан 7:13 уместна.
  issues:
  - severity: medium
    issue: Архаизм «Я есмь» в основном тексте
    rationale: Форма «есмь» не относится к современному литературному нейтрально-возвышенному употреблению. Она также способна излишне выделить формулу как техническое богословское высказывание, тогда как в контексте это прежде всего прямой ответ; греческий не содержит дополнения, но и не требует русского архаизма.
  - severity: low
    issue: «Сидящего» недостаточно передаёт престольный оттенок καθήμενον
    rationale: Причастие обозначает Сына Человеческого в положении восседания по правую руку. «Восседающего» точнее передаёт этот образ и лучше сочетается с возвышенным контекстом.
