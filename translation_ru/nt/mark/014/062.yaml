id: MRK.14.62
reference: Mark 14:62
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: ru
  text: 'Иисус сказал: «Я[a], и вы увидите Сына Человеческого, восседающего по правую руку Силы[b] и приходящего с облаками небесными[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это Я». В греческом тексте: «Я есть».'
    reason: alternative_reading
  - marker: b
    text: «Сила» — благоговейное обозначение Бога.
    reason: cultural_note
  - marker: c
    text: Ср. Пс 109:1 и Дан 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Я есмь
  rationale: Сохраняет простую и выразительную греческую формулу без добавления местоименного дополнения «Он». Хотя «есмь» имеет возвышенную окраску, эта форма понятна современному читателю и позволяет удержать как прямой утвердительный ответ, так и возможный более глубокий смысл.
- source_word: ὄψεσθε
  choice: вы увидите
  rationale: Прямой и естественный эквивалент будущего времени ὁράω; сохраняет силу предсказания без поясняющего перефразирования.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшееся библейское самообозначение Иисуса, сохраняющее связь с образом из Даниила 7.
- source_word: ἐκ δεξιῶν
  choice: по правую руку
  rationale: Передаёт почётное место и власть, избегая архаического «одесную» и сохраняя библейскую образность.
- source_word: τῆς δυνάμεως
  choice: Силы
  rationale: Сохраняет употреблённое в греческом благоговейное обозначение Бога вместо прямой подстановки слова «Бог»; прописная буква указывает на личную божественную референцию.
- source_word: καθήμενον
  choice: сидящего
  rationale: Точно передаёт причастие и образ восседания на почётном месте; контекст выражения «по правую руку» сообщает царственное достоинство.
- source_word: ἐρχόμενον
  choice: приходящего
  rationale: Естественно передаёт движение к месту или присутствующим и сохраняет эсхатологический смысл и связь с Дан 7:13.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: с облаками небесными
  rationale: Близко следует греческому выражению и сохраняет возвышенный апокалиптический образ, а также словесную связь с Дан 7:13.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: 'Повтор союза сохраняет накопительное соединение двух образов: восседания и пришествия.'
theological_decisions:
- issue: Передача Ἐγώ εἰμι как простого утверждения или расширенного самоотождествления
  choice: «Я есмь» в основном тексте
  alternative: «Это Я» / «Я — Он»
  rationale: В греческом нет выраженного именного дополнения. Выбранный вариант сохраняет непосредственный утвердительный ответ и возможный более глубокий отзвук, не навязывая читателю единственного богословского истолкования.
- issue: Степень явности божественной референции в τῆς δυνάμεως
  choice: «Силы»
  alternative: «Бога» / «Всемогущего»
  rationale: Источник использует благоговейное описательное обозначение, а не прямое именование Бога. Его сохранение передаёт и содержание, и тон греческого текста.
- issue: Соотношение образов Пс 109:1 и Дан 7:13
  choice: Сохранить оба образа в тексте и отметить перекличку в сноске
  alternative: Разъяснить их непосредственно в основном тексте
  rationale: Текст соединяет мотив восседания по правую руку с мотивом пришествия с небесными облаками. Сноска показывает интертекстуальную связь, не превращая перевод в толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизм «есмь» сохранён точечно ради необычной формы исходного выражения и его смысловой открытости; более архаические «одесную» и «грядущего» не использованы.
