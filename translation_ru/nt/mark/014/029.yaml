lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт противопоставление слов Петра предшествующему предсказанию Иисуса.
- source_word: ἔφη αὐτῷ
  choice: сказал ему
  rationale: Сохраняет обычный глагол речи и местоименную отсылку греческого текста.
- source_word: Εἰ καὶ
  choice: Даже если
  rationale: Естественно передаёт условно-уступительное значение выражения.
- source_word: πάντες
  choice: все
  rationale: Относится ко всей группе учеников и сохраняет широкий охват исходного слова.
- source_word: σκανδαλισθήσονται
  choice: отступятся
  rationale: В контексте предстоящего оставления Иисуса выражает серьёзный срыв верности, не утверждая окончательного отпадения.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: я — нет
  rationale: Краткая эллиптическая конструкция сохраняет резкое противопоставление и эмфатическое ἐγώ.
theological_decisions:
- issue: Значение σκανδαλισθήσονται в контексте неверности учеников
  choice: отступятся
  alternative: споткнутся; соблазнятся; отпадут
  rationale: «Отступятся» соответствует повествовательному контексту бегства учеников и сохраняет серьёзность их неверности, не решая вопрос об окончательном духовном отпадении.
translation_notes:
  register: Современный литературный русский язык; реплика Петра передана кратко и решительно. Тире в «я — нет» подчёркивает выраженное в греческом местоимение ἐγώ и сохраняет эллипсис исходного текста.
