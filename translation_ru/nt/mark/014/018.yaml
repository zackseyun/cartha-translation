id: MRK.14.18
reference: Mark 14:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: ru
  text: 'И когда они возлежали за столом и ели[a], Иисус сказал: «Истинно говорю вам[b]: один из вас предаст[c] Меня — тот, кто ест со Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возлежание было обычной позой участников торжественной трапезы.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «Аминь, говорю вам».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «передаст». Греческий глагол может означать «передать», «выдать» или «предать»; здесь речь идёт о вероломной выдаче Иисуса одним из Его спутников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: возлежали за столом
  rationale: Причастие обозначает принятую в древнем Средиземноморье позу за торжественной трапезой. «Возлежали за столом» исторически точно и понятнее современному читателю, чем просто «возлежали».
- source_word: ἐσθιόντων / ὁ ἐσθίων
  choice: ели / тот, кто ест
  rationale: Прямо передаёт значение «есть»; конструкция «тот, кто ест» отражает определённое артиклем причастие ὁ ἐσθίων.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Естественная для русского библейского регистра передача торжественной вводной формулы Иисуса; буквальное «Аминь» сохранено в сноске.
- source_word: εἷς ἐξ ὑμῶν
  choice: один из вас
  rationale: 'Естественно и точно передаёт партитивное выражение: речь идёт об одном человеке из присутствующих.'
- source_word: παραδώσει
  choice: предаст
  rationale: В данном контексте передача Иисуса врагам совершается Его близким спутником и имеет характер измены. Более широкое буквальное значение «передаст» указано в сноске.
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: Прямая и естественная передача совместности; прописная буква соответствует принятому русскому благоговейному оформлению местоимений, относящихся к Иисусу.
theological_decisions:
- issue: Передача παραδώσει в рассказе о страстях
  choice: предаст
  alternative: передаст
  rationale: Сам глагол может обозначать нейтральное «передать, выдать», но здесь совместная трапеза подчёркивает вероломство одного из близких спутников. «Предаст» выражает контекстуальный смысл, а буквальная альтернатива сохраняет лексическую широту исходного слова.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены историческая деталь возлежания за столом, торжественность формулы Иисуса и напряжение между буквальным значением «передать» и контекстуальным «предать».
