  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: ru
  text: 'Но он снова всё отрицал. Немного спустя те, кто стоял рядом, снова говорили Петру: «Ты действительно один из них, ведь ты тоже галилеянин, да и речь у тебя такая же».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да и говор у тебя такой же»; «да и говоришь ты так же». Греческое слово может обозначать речь, манеру говорить, диалект или акцент.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых рукописях слова «да и речь у тебя такая же» отсутствуют.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: отрицал это
  rationale: Имперфект передаёт продолжавшееся или повторное отрицание; «это» естественно обозначает подразумеваемое обвинение в связи с Иисусом, не уточняя его сверх контекста.
- source_word: μετὰ μικρὸν
  choice: немного спустя
  rationale: Передаёт краткий промежуток времени и сохраняет сжатость греческого оборота.
- source_word: οἱ παρεστῶτες
  choice: стоявшие рядом
  rationale: Сохраняет как буквальный образ стоящих людей, так и пространственное значение присутствия поблизости.
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект представлен формой, допускающей продолженное или повторное высказывание; наречие «опять» дополнительно отражает πάλιν.
- source_word: Ἀληθῶς
  choice: действительно
  rationale: Передаёт уверенность говорящих естественно и без излишне разговорного оттенка.
- source_word: ἐξ αὐτῶν εἶ
  choice: ты один из них
  rationale: Естественный русский способ обозначить принадлежность Петра к той же группе.
- source_word: καὶ γὰρ Γαλιλαῖος εἶ
  choice: ведь ты тоже галилеянин
  rationale: «Ведь» выражает обоснование, данное γάρ, а «тоже» сохраняет добавочное значение καί.
- source_word: ἡ λαλιά σου ὁμοιάζει
  choice: да и речь у тебя такая же
  rationale: Передаёт сходство манеры речи, не сужая λαλιά исключительно до акцента или говора; подразумеваемый объект сравнения естественно восстанавливается из контекста.
