  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: ru
  text: Ибо Сын Человеческий идёт, как написано о нём, но горе тому человеку, через которого Сын Человеческий предаётся! Лучше было бы тому человеку не родиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: В данном контексте союз вводит объяснение слов Иисуса; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: ὁ μὲν ... δὲ
  choice: …но…
  rationale: Контраст μέν…δέ по-русски естественно выражается союзом «но» без отдельной передачи μέν.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохранено устойчивое самообозначение Иисуса и его возможный отзвук Дан 7:13.
- source_word: ὑπάγει
  choice: идёт
  rationale: Настоящее время и направленность движения к предстоящей участи переданы без уточнения, которое могло бы преждевременно истолковать глагол как смерть или уход.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: как написано о нём
  rationale: Формула естественна в современном русском и сохраняет как сравнительное καθώς, так и указание на остающееся в силе свидетельство Писания.
- source_word: οὐαὶ
  choice: горе
  rationale: «Горе» сохраняет пророческую силу предостережения и осуждения.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: тому человеку
  rationale: Указательное местоимение и конкретная отсылка сохранены без замены нейтральным обобщением.
- source_word: δι’ οὗ
  choice: через которого
  rationale: Передаёт посредническое или агентное значение διά с родительным падежом и не снимает вопрос о более широкой цепи действующих лиц.
- source_word: παραδίδοται
  choice: предают
  rationale: Неопределённо-личная конструкция естественно передаёт греческий страдательный залог; «предают» ясно выражает измену в непосредственном контексте, а более буквальный смысл «передают в руки» сохранён в сноске.
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: Лучше было бы тому человеку не родиться
  rationale: Русская идиома естественно передаёт контрфактическую оценку, не добавляя усилительного «никогда».
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: тому человеку
  rationale: Торжественный повтор обозначения человека сохранён, а не заменён местоимением.
theological_decisions:
- issue: Значение παραδίδοται в повествовании о страстях
  choice: предают
  alternative: передают в руки
  rationale: Непосредственный контекст подчёркивает предательство Иуды, однако более широкое значение глагола не исключается и приведено в сноске.
- issue: Соотношение исполнения Писания и ответственности предателя
  choice: 'Сохранены обе части высказывания: путь Сына Человеческого соответствует написанному, но предателю возвещается горе.'
  alternative: Истолковать написанное либо как снимающее ответственность с предателя, либо исключительно как результат его свободного поступка.
  rationale: Греческий текст ставит исполнение Писания и ответственность человека рядом, не разрешая явно их богословское напряжение; перевод не должен делать это за автора.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены титул «Сын Человеческий», повтор «тому человеку» и резкий контраст; местоимение «нём» дано со строчной буквы по нейтральной современной орфографической практике.
