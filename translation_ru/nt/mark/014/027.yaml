  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: ru
  text: 'Иисус говорит им: «Все вы оставите Меня, потому что написано: „Поражу пастыря, и овцы рассеются“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее, характерное для живого повествовательного стиля Марка.
- source_word: σκανδαλισθήσεσθε
  choice: отступитесь
  rationale: В данном контексте глагол обозначает предстоящее малодушие учеников и их оставление Иисуса. «Отступитесь» естественно передаёт серьёзность разрыва, не утверждая окончательного отпадения; более буквальные возможности отмечены в сноске.
- source_word: γέγραπται
  choice: написано
  rationale: Устойчивое и точное введение ссылки на Писание, отражающее результативное значение греческого перфекта.
- source_word: Πατάξω
  choice: Поражу
  rationale: Передаёт силу глагола и сохраняет возвышенный, но понятный регистр цитаты из Писания.
- source_word: τὸν ποιμένα
  choice: пастыря
  rationale: Прямо сохраняет образ пророческой цитаты и определённость обозначенного пастыря.
- source_word: τὰ πρόβατα
  choice: овцы
  rationale: Естественный русский эквивалент, сохраняющий образ стада.
- source_word: διασκορπισθήσονται
  choice: рассеются
  rationale: Точно передаёт разобщение стада после поражения пастыря; русская возвратная форма естественно соответствует греческому пассиву.
theological_decisions:
- issue: Значение σκανδαλισθήσεσθε применительно к реакции учеников
  choice: отступитесь
  alternative: преткнётесь; соблазнитесь; будете введены в соблазн
  rationale: Контекст предсказывает оставление Иисуса и рассеяние учеников. «Отступитесь» передаёт эту серьёзную, но контекстуально ограниченную неверность, не превращая её в утверждение об окончательной утрате веры. Сноска сохраняет образ «преткновения» и формальную пассивность греческой формы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром в цитате из Писания. Историческое настоящее сохранено. Формулировка ясна широкому кругу читателей и не вносит конфессионально обусловленного толкования.
