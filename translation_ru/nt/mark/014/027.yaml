review_pass:
  verdict: revise
  source_fidelity: «Отступитесь» передаёт контекстуальную мысль о том, что ученики оставят Иисуса, однако в русском языке эта форма обычно требует дополнения («от кого/от чего») и может звучать как более определённое отречение, чем допускает σκανδαλισθήσεσθε. Формулировка «оставите Меня» ясно выражает ближайший контекст предстоящего оставления Иисуса; сноска сохраняет более буквальное и неоднозначное значение греческого глагола. Историческое настоящее «говорит», формула «написано» и пророческая цитата переданы точно.
  naturalness: «Все вы отступитесь» без дополнения несколько неестественно для современного литературного русского. «Все вы оставите Меня» естественно, ясно и соответствует повествовательному контексту. Регистр цитаты («Поражу пастыря») уместно умеренно возвышенный.
  terminology: '«Пастырь» оправдан как традиционный библейский образ в прямой цитате; «овцы рассеются» точно и естественно передаёт образ и пассивное значение. В сноске лучше избежать выражения «будете введены в соблазн»: оно и стилистически тяжеловесно, и в современном русском способно вызвать не тот смысл. «Соблазнитесь» сохраняет лексическую альтернативу, но отмечено как менее буквальный вариант наряду с «преткнётесь».'
