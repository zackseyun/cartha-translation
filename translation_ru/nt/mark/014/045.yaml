base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: ru
  text: 'И, придя, он тотчас подошёл к Нему и сказал: «Равви!» — и крепко поцеловал Его.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «стал целовать Его», или «горячо поцеловал Его»; греческий глагол выразительнее простого «поцеловал».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: придя
  rationale: Аористное причастие передаёт предшествующее обстоятельство и последовательность действий; русское деепричастие здесь естественно и лаконично.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Сохраняет характерную для Марка стремительность повествования и соответствует возвышенному, но современному литературному регистру.
- source_word: προσελθὼν αὐτῷ
  choice: подошёл к Нему
  rationale: Ясно передаёт физическое приближение к Иисусу и избегает неестественного повторения глагола движения.
- source_word: λέγει
  choice: сказал
  rationale: Историческое настоящее естественно передано русским прошедшим временем в повествовании.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохраняет употреблённое в сцене семитское обращение и его историко-культурную окраску; перевод «Учитель» возможен по смыслу, но менее прозрачен по отношению к форме греческого текста.
- source_word: κατεφίλησεν
  choice: крепко поцеловал Его
  rationale: Приставочный глагол καταφιλέω выразительнее простого «поцеловал», однако сам по себе не позволяет с уверенностью выбрать между усиленным и повторным действием. «Крепко поцеловал» сохраняет эмфатический характер жеста без обязательного утверждения его многократности.
theological_decisions:
- issue: Передача обращения Ῥαββί
  choice: Равви
  alternative: Учитель
  rationale: Транслитерация сохраняет историческую форму обращения и повествовательную иронию сцены, не добавляя конфессионального толкования.
- issue: Характер поцелуя Иуды в καταφιλέω
  choice: крепко поцеловал
  alternative: стал целовать / горячо поцеловал
  rationale: Основной текст передаёт усиленность глагола, но не разрешает однозначно его возможную повторность или эмоциональную окраску; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Нему/Его» написано с прописной буквы согласно распространённой русской библейской издательской традиции. Тире после прямой речи облегчает чтение последовательности действий.
