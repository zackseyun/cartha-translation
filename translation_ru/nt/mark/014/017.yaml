  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: ru
  text: Когда наступил вечер, Он приходит с двенадцатью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с Двенадцатью», если понимать это выражение как устойчивое название группы апостолов Иисуса.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: Καὶ
  choice: Когда
  rationale: Греческое καί связывает этот эпизод с предыдущим, но в сочетании с временным генитивным оборотом естественно передаётся по-русски придаточным времени без отдельного «и».
- source_word: ὀψίας γενομένης
  choice: когда наступил вечер
  rationale: Генитив абсолютный обозначает временное обстоятельство; эта формулировка естественна в современном русском и точно передаёт наступление вечера.
- source_word: ἔρχεται
  choice: Он приходит
  rationale: Сохранено историческое настоящее Марка, придающее повествованию живость. Местоимение с прописной буквы соответствует принятому в русском библейском регистре уважительному обозначению Иисуса.
- source_word: μετὰ τῶν δώδεκα
  choice: с двенадцатью
  rationale: μετά с родительным падежом обозначает сопровождение. Краткая субстантивированная форма сохраняет выражение оригинала и не добавляет толковательных слов «учениками» или «апостолами».
theological_decisions:
- issue: Кого обозначают «двенадцать»
  choice: Ближайший круг учеников Иисуса, включая Иуду на данном этапе повествования
  alternative: Явно перевести как «с двенадцатью учениками» или «с двенадцатью апостолами»
  rationale: Контекст ясно указывает на известную группу Двенадцати; добавление «учениками» или «апостолами» было бы истолковывающим расширением.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным библейским звучанием. Историческое настоящее сохранено; конструкция остаётся понятной обычному читателю.
