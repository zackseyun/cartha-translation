  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: ru
  text: 'Но Он молчал и ничего не ответил. Первосвященник снова стал спрашивать Его и говорит Ему: «Ты — Мессия[a], Сын Благословенного[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός означает «Помазанник» и здесь употреблено как мессианский титул.'
    reason: alternative_reading
  - marker: b
    text: «Благословенный» — почтительное иудейское обозначение Бога.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: молчал
  rationale: Имперфект передаёт продолжающееся молчание; в русском контексте простая форма «молчал» естественно выражает длительность.
- source_word: ἀπεκρίνατο οὐδέν
  choice: ничего не отвечал
  rationale: Передаёт полное отсутствие ответа и сохраняет естественный современный русский синтаксис.
- source_word: πάλιν
  choice: снова
  rationale: Ясно обозначает повторение допроса.
- source_word: ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное название высшей иудейской священнической должности.
- source_word: ἐπηρώτα
  choice: стал спрашивать
  rationale: Имперфект допускает продолженное или повторное действие; оборот естественно вводит возобновлённый вопрос в судебном контексте.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет характерный для Марка исторический презенс и живость повествования.
- source_word: χριστός
  choice: Мессия
  rationale: Здесь слово употреблено как иудейский мессианский титул, поэтому «Мессия» яснее передаёт его функцию, чем имяобразное «Христос».
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: Сын Благословенного
  rationale: Сохраняет почтительное иудейское иносказательное обозначение Бога, не подменяя его более прямым выражением.
theological_decisions:
- issue: Передача Χριστός как прямого мессианского титула
  choice: Мессия
  alternative: Христос
  rationale: В вопросе первосвященника это титул ожидаемого помазанника; выбранный вариант сохраняет иудейский контекст и не превращает титул в имя.
- issue: Передача τοῦ εὐλογητοῦ
  choice: Благословенного
  alternative: Бога
  rationale: Сохранено почтительное косвенное именование Бога, чтобы не устранять культурную и богословскую особенность исходного выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-религиозной сцены. Исторический презенс «говорит» сохранён как характерная черта повествования Марка; местоимения, относящиеся к Иисусу, даны с прописной буквы в соответствии с распространённой русской библейской нормой.
