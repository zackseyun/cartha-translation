  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: ru
  text: Когда Иисус был в Вифании и возлежал за столом в доме Симона прокажённого, пришла женщина с алебастровым сосудом очень дорогого благовония из чистого нарда[a]. Разбив сосуд, она вылила благовоние Ему на голову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настоящего нарда»; значение греческого слова πιστικῆς спорно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Когда Иисус был ... и возлежал за столом
  rationale: Генитив абсолютный задаёт обстоятельственный фон. Имя «Иисус» естественно восстанавливает референта местоимения по контексту, а «возлежал за столом» ясно передаёт обычную позу во время трапезы, подразумеваемую κατακειμένου.
- source_word: Βηθανίᾳ
  choice: Вифании
  rationale: Устоявшаяся русская форма географического названия.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: в доме Симона прокажённого
  rationale: Сохраняет данное в греческом тексте прозвание и не добавляет отсутствующего определения «бывшего».
- source_word: γυνὴ
  choice: женщина
  rationale: В данном месте Марк не называет и не определяет её точнее.
- source_word: ἀλάβαστρον
  choice: алебастровый сосуд
  rationale: Слово обозначает сосуд для благовоний, первоначально связанный с алебастром; «сосуд» естественно и не навязывает излишне точную форму.
- source_word: μύρου
  choice: благовония
  rationale: μύρον — ароматическое масло или мазь; «благовоние» ясно передаёт функцию вещества, не уточняя без основания его консистенцию.
- source_word: νάρδου
  choice: нарда
  rationale: Сохраняется название конкретного ароматического вещества.
- source_word: πιστικῆς
  choice: чистого
  rationale: Вероятно указывает на чистоту или подлинность нарда, однако значение спорно; альтернативное понимание отмечено в сноске.
- source_word: πολυτελοῦς
  choice: очень дорогого
  rationale: Передаёт высокую стоимость, существенную для последующего развития повествования.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Разбив сосуд
  rationale: Деепричастная конструкция сохраняет предшествование этого действия последующему выливанию.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: вылила благовоние Ему на голову
  rationale: Естественно передаёт действие наливания на голову; повтор существительного устраняет неясность русского местоимения.
theological_decisions:
- issue: Следует ли смягчать обозначение «Симон прокажённый», предполагая, что он уже исцелился
  choice: Сохранить «Симона прокажённого»
  alternative: Симона, бывшего прокажённым
  rationale: Греческий текст прямо даёт такое прозвание и не говорит, что болезнь осталась в прошлом. Добавление «бывшего» разрешило бы вопрос посредством исторически возможного, но не выраженного в тексте предположения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Возлежал за столом» сохраняет историческую обстановку трапезы и остаётся понятным; «благовоние» звучит естественнее узкотехнических вариантов. Маркер [a] помещён непосредственно после спорного выражения.
