base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: ru
  text: 'И некоторые стали плевать на него, закрывать ему лицо[a], бить его кулаками и говорить ему: «Пророчествуй!» А стражники наносили ему удары[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «закрывать ему глаза». Буквально: «закрывать ему лицо».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «приняли его ударами». Также возможно: «били его» или «осыпали его ударами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: некоторые стали
  rationale: Передаёт неопределённую группу и начинательное значение конструкции ἄρχομαι с инфинитивом естественным современным русским языком.
- source_word: ἐμπτύειν αὐτῷ
  choice: плевать на него
  rationale: Обычный русский эквивалент глагола с дательным дополнением; ясно передаёт прямое унижение.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: закрывать ему лицо
  rationale: Сохраняет буквальный образ греческого текста и не превращает вероятную цель действия — лишить возможности видеть — в прямо высказанный факт.
- source_word: κολαφίζειν αὐτόν
  choice: бить его кулаками
  rationale: Передаёт характерный смысл κολαφίζω — наносить удары кулаком — точнее, чем общее «бить».
- source_word: Προφήτευσον
  choice: Пророчествуй!
  rationale: Сохраняет краткий издевательский приказ без добавления отсутствующих в тексте пояснений.
- source_word: ὑπηρέται
  choice: служители
  rationale: Обозначает подчинённых должностных лиц при властях; выбор не сужает значение до стражников и не создаёт ассоциации с домашними слугами.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: встретили его ударами
  rationale: Передаёт необычный и яркий оборот с λαμβάνω, оставаясь понятным по-русски; менее буквальный смысловой вариант указан в сноске.
theological_decisions:
- issue: Содержание насмешливого приказа Προφήτευσον в связи с личностью Иисуса
  choice: «Пророчествуй!»
  alternative: «Докажи, что ты пророк!» / «Скажи, кто тебя ударил!»
  rationale: Греческий текст содержит только краткий императив. Перевод сохраняет повествовательную иронию и богословское напряжение, не добавляя пояснений из параллельных рассказов или толкований.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым повествовательным ритмом. Местоимения, относящиеся к Иисусу, даны со строчной буквы как нейтральная современная орфографическая практика. Необычный финальный образ сохранён в понятной форме, а его буквальная структура и более идиоматические варианты вынесены в сноску.
