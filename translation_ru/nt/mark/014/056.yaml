  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: ru
  text: Ведь многие давали против Него ложные показания, и их свидетельства не совпадали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «лжесвидетельствовали против Него, и свидетельства не были согласны между собой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное обозначает множество людей; слово «свидетели» подразумевается глаголом, но прямо в греческом тексте не выражено.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим повествованием естественно для современного русского языка.
- source_word: ἐψευδομαρτύρουν
  choice: давали ложные показания
  rationale: Имперфект указывает на продолжавшиеся или повторявшиеся действия, а выражение сохраняет юридический смысл глагола.
- source_word: κατ’ αὐτοῦ
  choice: против Него
  rationale: В судебном контексте κατά с родительным падежом обозначает направленное против Иисуса враждебное свидетельство.
- source_word: ἴσαι
  choice: не совпадали
  rationale: Буквально прилагательное означает «равные», но применительно к свидетельствам передаёт отсутствие совпадения или согласия между ними.
- source_word: αἱ μαρτυρίαι
  choice: их свидетельства
  rationale: Артикль отсылает к только что упомянутым ложным показаниям; притяжательное местоимение естественно уточняет эту связь по-русски.
- source_word: οὐκ ἦσαν
  choice: не совпадали
  rationale: Отрицательная форма глагола «быть» объединена с ἴσαι в естественную русскую конструкцию без изменения смысла.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением судебной лексики. «Давали ложные показания» звучит естественно и передаёт процессуальный контекст; в сноске сохранён более буквальный глагол «лжесвидетельствовали». Прописное «Него» употреблено как принятое в русском библейском регистре уважительное обозначение Иисуса.
