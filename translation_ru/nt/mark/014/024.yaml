  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: ru
  text: 'И сказал им: «Это Моя кровь завета[a], изливаемая за многих[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях и параллельных местах: «Моя кровь нового завета». Здесь греческий текст, вероятнее всего, гласит: «Моя кровь завета».'
    reason: textual_variant
  - marker: b
    text: 'Или: «которая изливается за многих»; также возможно: «изливаемая ради многих». Традиционно: «проливаемая за многих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Это
  rationale: В русском именная конструкция с нулевой связкой естественно и прямо передаёт греческое «это есть», не вводя толкований «означает» или «символизирует».
- source_word: τὸ αἷμά μου
  choice: Моя кровь
  rationale: Прямо сохраняет кровную и жертвенную образность исходного текста; парафраз «Моя смерть» был бы уже истолкованием.
- source_word: τῆς διαθήκης
  choice: завета
  rationale: В контексте установления завета и аллюзии на Исх 24:8 διαθήκη означает «завет», а не завещание; слово «нового» в данном греческом тексте отсутствует.
- source_word: ἐκχυννόμενον
  choice: изливаемая
  rationale: Причастие настоящего времени и страдательного залога естественно согласуется с «кровь» и сохраняет образ излияния; «проливаемая» также возможно, но менее явно передаёт глагол ἐκχέω.
- source_word: ὑπὲρ πολλῶν
  choice: за многих
  rationale: Русское «за многих» кратко и естественно передаёт значение действия ради или в пользу многих, не заменяя «многих» словом «всех» и не детализируя сверх текста характер заместительности.
theological_decisions:
- issue: Заветный или завещательный смысл διαθήκη
  choice: завета
  alternative: завещания
  rationale: Кровь и контекст трапезы отсылают к заключению завета, особенно к Исх 24:8; завещательный смысл здесь контекстуально неуместен.
- issue: Следует ли добавлять «нового» перед «завета»
  choice: кровь завета
  alternative: кровь нового завета
  rationale: В представленном тексте SBLGNT прилагательного καινῆς нет, поэтому основной текст не гармонизируется с параллельными местами и вариантами рукописей.
- issue: Богословский объём выражения ὑπὲρ πολλῶν
  choice: за многих
  alternative: за всех
  rationale: Перевод сохраняет слово «многих» и не разрешает в самом стихе более широкий спор об объёме искупления.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет краткость и торжественность высказывания. Местоимение «Моя» написано с прописной буквы по принятой русской религиозно-издательской традиции, без добавления богословских уточнений.
