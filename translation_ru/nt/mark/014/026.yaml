lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь без добавления оттенка последовательности, которого союз сам по себе не выражает.
- source_word: ὑμνήσαντες
  choice: воспев хвалу
  rationale: Аористное причастие от ὑμνέω обозначает пение хвалы, предшествовавшее уходу. Формулировка естественна и не уточняет без необходимости, был ли исполнен один конкретный гимн.
- source_word: ἐξῆλθον
  choice: они пошли
  rationale: В данном контексте русское «пошли» естественно передаёт движение из места трапезы к названному месту назначения; буквальное «вышли» возможно, но звучит менее плавно с последующим направлением.
- source_word: εἰς
  choice: на
  rationale: Обычный русский предлог при обозначении направления к горе.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: Елеонскую гору
  rationale: Устоявшееся русское географическое название Масличной горы в библейской традиции, понятное современному читателю.
