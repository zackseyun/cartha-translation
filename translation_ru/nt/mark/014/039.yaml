  text: καὶ πάλιν ἀπελθὼν προσηύξατο τὸν αὐτὸν λόγον εἰπών.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: ru
  text: И, снова отойдя, Он молился, повторяя те же слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «сказав то же слово»; здесь «слово» означает содержание прежней молитвы — то же самое высказывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Наречие обозначает повторение действия и естественно передаёт последовательность повествования.
- source_word: ἀπελθὼν
  choice: отойдя
  rationale: Аористное причастие указывает на действие, предшествующее молитве; деепричастие кратко и естественно передаёт это соотношение.
- source_word: προσηύξατο
  choice: молился
  rationale: Обычное и ясное соответствие глаголу προσεύχομαι; средний залог здесь не требует отдельного выражения по-русски.
- source_word: τὸν αὐτὸν λόγον
  choice: те же слова
  rationale: В данном контексте λόγος обозначает содержание повторённой молитвы. Русское множественное число естественно указывает на повторение ранее произнесённой молитвы, не создавая впечатления, будто было повторено одно отдельное слово.
- source_word: εἰπών
  choice: повторяя
  rationale: Причастие поясняет, каким образом Иисус молился. В сочетании с «те же слова» глагол «повторяя» естественно передаёт смысл εἰπών, не дублируя неуклюже глагол речи.
