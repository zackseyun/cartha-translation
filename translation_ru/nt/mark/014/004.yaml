  verdict: approve
  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: неопределённое τινες («Некоторые»), реакционное δέ («же»), сильное ἀγανακτοῦντες («возмущались»), групповую направленность πρὸς ἑαυτούς («между собой») и оценку ἀπώλεια как растраты. Вопрос «К чему такая трата благовония?» естественно выражает смысл Εἰς τί ... γέγονεν, не утяжеляя русский текст искусственным воспроизведением перфекта.'
