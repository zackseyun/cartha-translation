  terminology: «Благовоние» допустимо как обобщённое обозначение μύρον в данном контексте; примечание надлежащим образом уточняет возможные более конкретные значения («ароматическое масло», «благовонная мазь»). Неоднозначность πρὸς ἑαυτούς также сохранена в примечании без навязывания одного толкования.
