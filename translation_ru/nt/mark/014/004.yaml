  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: ru
  text: 'Некоторые же возмущались между собой: «К чему такая трата благовония?[a][b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «друг другу» или «про себя». Греческое выражение может указывать как на взаимные жалобы внутри группы, так и на внутреннюю реакцию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ароматического масла» или «благовонной мази». Греческое слово μύρον обозначает ароматическое масло либо мазь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Некоторые же… возмущались
  rationale: Частица δέ обозначает переход и лёгкое противопоставление поступку женщины; русское постпозитивное «же» естественно передаёт этот оттенок.
- source_word: τινες
  choice: некоторые
  rationale: Сохраняет неопределённость греческого местоимения и не уточняет, кто именно выражал недовольство.
- source_word: ἀγανακτοῦντες
  choice: возмущались
  rationale: Передаёт сильное неодобрение с нравственной оценкой, а не просто раздражение.
- source_word: πρὸς ἑαυτούς
  choice: между собой
  rationale: В контексте высказанной жалобы это естественно указывает на реакцию и разговор внутри группы, не исключая допустимого оттенка внутреннего возмущения.
- source_word: Εἰς τί
  choice: К чему
  rationale: Сохраняет направленную на цель или результат формулировку вопроса и звучит естественно по-русски.
- source_word: ἡ ἀπώλεια αὕτη
  choice: такая трата
  rationale: В данном контексте ἀπώλεια означает, по мнению говорящих, напрасное расходование ценного вещества. «Такая» естественно передаёт указательное αὕτη в эмоциональном вопросе.
- source_word: τοῦ μύρου
  choice: благовония
  rationale: μύρον обозначает ароматическое масло или мазь; «благовоние» — понятное и стилистически достойное обобщающее обозначение.
- source_word: γέγονεν
  choice: К чему такая трата…?
  rationale: Русская безглагольная вопросительная конструкция естественно передаёт смысл совершившегося действия с сохраняющимся результатом, не воспроизводя тяжеловесное «произошла».
