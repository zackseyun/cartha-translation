  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: ru
  text: 'Они стали печалиться и один за другим говорить Ему: «Не я ли?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая частица μήτι показывает, что говорящий ожидает отрицательного ответа: «Ведь не я?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: стали
  rationale: Аорист ἄρχομαι с зависимыми инфинитивами обозначает начало действий; в сочетании «опечалились и стали… говорить» по-русски естественно передаёт их наступление без тяжеловесного повтора «начали».
- source_word: λυπεῖσθαι
  choice: опечалились
  rationale: Форма обозначает наступление печали или скорби. «Опечалились» сохраняет инхоативный оттенок и соответствует торжественному контексту.
- source_word: καὶ λέγειν
  choice: и стали… говорить
  rationale: λέγω означает «говорить, сказать»; хотя последующая реплика является вопросом, перевод не заменяет исходный глагол более узким «спрашивать».
- source_word: αὐτῷ
  choice: Ему
  rationale: Сохранено местоимение исходного текста; прописная буква ясно указывает в данном контексте на Иисуса и соответствует принятой русской библейской письменной традиции.
- source_word: εἷς κατὰ εἷς
  choice: один за другим
  rationale: Дистрибутивное выражение указывает на последовательные индивидуальные реплики; «один за другим» естественно и точно передаёт это значение.
- source_word: Μήτι ἐγώ;
  choice: Не я ли?
  rationale: Краткая русская вопросительная конструкция сохраняет эллиптичность греческой реплики и передаёт ожидаемый отрицательный ответ, заложенный в μήτι.
theological_decisions:
- issue: Смысловая направленность вопроса учеников
  choice: «Не я ли?» — вопрос с ожиданием отрицательного ответа
  alternative: «Я?» или «Это я?» — нейтральный вопрос
  rationale: Частица μήτι предполагает ответ «нет». Сохранение этой направленности передаёт тревогу и внутренний протест учеников, не определяя сверх текста степень их уверенности или вины.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Порядок слов слегка перестроен ради естественности: последовательность «опечалились» и «стали… говорить» сохраняет оба зависимых действия, а «один за другим» поставлено рядом с глаголом речи. Маркер сноски присутствует в основном тексте.'
