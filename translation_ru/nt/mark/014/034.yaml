  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: ru
  text: 'И говорит им: «Душа Моя объята глубокой скорбью, до смерти[a]. Останьтесь здесь и бодрствуйте[b]».'
  philosophy: optimal-equivalence
  footnotes:
