lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохранено, чтобы передать характерную для Марка живость повествования.
- source_word: Περίλυπός
  choice: объята глубокой скорбью
  rationale: Передаёт крайнюю степень печали и душевной муки естественным и достойным современным русским языком.
- source_word: ψυχή
  choice: душа
  rationale: Сохраняет прямой антропологический образ греческого текста и выражает внутреннюю жизнь, охваченную скорбью.
- source_word: ἕως θανάτου
  choice: вплоть до смерти
  rationale: Сохраняет предельную силу выражения, не решая однозначно, означает ли оно смертельную степень скорби или скорбь, продолжающуюся до смерти.
- source_word: μείνατε
  choice: останьтеcь
  rationale: Точно и естественно передаёт повеление не уходить с этого места.
- source_word: ὧδε
  choice: здесь
  rationale: Прямой и естественный эквивалент указания на место.
- source_word: γρηγορεῖτε
  choice: бодрствуйте
  rationale: В контексте включает как физическое бодрствование, так и настороженную духовную бдительность.
theological_decisions:
- issue: Передача ψυχή в словах Иисуса
  choice: душа
  alternative: всё существо / жизнь
  rationale: «Душа» сохраняет форму исходного выражения и полноту подлинного человеческого страдания Иисуса, не добавляя последующего догматического истолкования.
- issue: Смысл ἕως θανάτου
  choice: вплоть до смерти
  alternative: до смерти / так, что готов умереть
  rationale: 'Выбранная формулировка сохраняет неоднозначность: это может быть указание как на крайнюю, смертельную скорбь, так и на её предел.'
- issue: Сила γρηγορεῖτε
  choice: бодрствуйте
  alternative: не спите / будьте начеку
  rationale: «Бодрствуйте» удерживает вместе буквальную необходимость не заснуть и более широкий призыв к бдительности.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Историческое настоящее сохранено. Местоимение «Моя» написано с прописной буквы согласно распространённой русской библейской издательской традиции; смысловой нагрузки это не добавляет.
