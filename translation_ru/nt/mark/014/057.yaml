lexical_decisions:
- source_word: καί
  choice: И
  rationale: Сохраняет простой повествовательный переход, характерный для Марка.
- source_word: τινες
  choice: некоторые
  rationale: Передаёт неопределённое указание на несколько не названных лиц.
- source_word: ἀναστάντες
  choice: встав
  rationale: Естественно передаёт аористное причастие и уместно в обстановке судебного разбирательства.
- source_word: ἐψευδομαρτύρουν
  choice: стали лжесвидетельствовать
  rationale: Глагол «лжесвидетельствовать» точно передаёт судебный смысл, а конструкция «стали» в данном повествовательном контексте отражает развёртывающееся действие имперфекта.
- source_word: κατ’ αὐτοῦ
  choice: против Него
  rationale: Передаёт враждебную направленность показаний в судебном контексте.
- source_word: λέγοντες
  choice: 'говоря:'
  rationale: Вводит содержание ложного свидетельства, которое следует в следующем стихе.
