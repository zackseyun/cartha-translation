  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: ru
  text: Пётр издали следовал за Ним и вошёл во двор первосвященника. Там он сидел вместе со служителями и грелся у огня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у света». Буквально: «к свету»; вероятно, речь идёт о свете огня во дворе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: издали
  rationale: Естественно и кратко передаёт пространственную дистанцию, сохраняющуюся между Петром и Иисусом.
- source_word: ἠκολούθησεν αὐτῷ
  choice: шёл за Ним
  rationale: В повествовательном контексте естественно передаёт действие следования; местоимение с прописной буквы соответствует принятому русскому библейскому стилю.
- source_word: ἕως ἔσω εἰς τὴν αὐλήν
  choice: до самого двора … и, войдя внутрь
  rationale: Передаёт усиленное указание на предел движения и явно выраженное ἔσω, не создавая впечатления, будто Пётр вошёл в само здание.
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Устоявшийся и точный русский эквивалент в контексте евангельского повествования о Страстях.
- source_word: ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν
  choice: сидел вместе со служителями
  rationale: Передаёт длительное фоновое действие и значение совместного пребывания; «служители» не сужает их роль до домашней прислуги или исключительно стражников.
- source_word: θερμαινόμενος
  choice: грелся
  rationale: Краткое и естественное русское обозначение продолжающегося действия.
- source_word: πρὸς τὸ φῶς
  choice: у огня
  rationale: Контекстуально ясно передаёт источник тепла, хотя буквальное значение φῶς — «свет»; лексическая неоднозначность отмечена в сноске.
