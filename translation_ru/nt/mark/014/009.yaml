source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: ru
  text: 'Истинно говорю вам: где бы ни возвещалась Благая весть[a] по всему миру, будут говорить и о том, что сделала эта женщина, в память о ней[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в воспоминание о ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: Передаёт торжественное и авторитетное введение к изречению естественным для литературного русского языка способом.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Слабая связующая частица; в русском ходе речи её функция достаточно передана началом прямого торжественного высказывания.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо сохраняет обращение к слушателям и естественно сочетается с «Истинно».
- source_word: ὅπου ἐὰν
  choice: где бы … ни
  rationale: Русская уступительно-неопределённая конструкция точно передаёт значение любого места, в котором совершается действие.
- source_word: κηρυχθῇ
  choice: ни возвещалась
  rationale: «Возвещать» передаёт публичное провозглашение и не сужает смысл до церковной проповеди.
- source_word: τὸ εὐαγγέλιον
  choice: Благая весть
  rationale: Передаёт исходное значение выражения ясным и укоренённым в русском языке сочетанием; традиционное «Евангелие» сохранено в сноске.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: по всему миру
  rationale: Естественно по-русски выражает всеобщий географический охват.
- source_word: καὶ
  choice: и
  rationale: 'В сочетании «и о том» сохраняет добавочное значение: вместе с Благой вестью будут рассказывать и о поступке женщины.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: о том, что сделала эта женщина
  rationale: Женский указательный местoименный элемент αὕτη раскрыт через контекстуально ясное «эта женщина»; аорист передан завершённым действием.
- source_word: λαληθήσεται
  choice: будут рассказывать
  rationale: Неопределённо-личная русская конструкция естественно передаёт греческий пассив и смысл последующего устного рассказа о её поступке.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: в память о ней
  rationale: Кратко и естественно передаёт назначение рассказа как сохранение памяти о женщине, не уточняя сверх текста характер этого памятования.
theological_decisions:
- issue: Передача εὐαγγέλιον в высказывании о всемирном возвещении
  choice: Благая весть
  alternative: Евангелие
  rationale: Основной вариант раскрывает исходное значение греческого слова и остаётся понятным современному читателю; традиционный христианский термин дан как допустимая альтернатива без внесения конфессионального уточнения.
- issue: Явное обозначение αὕτη как женщины
  choice: эта женщина
  alternative: она; эта
  rationale: Форма женского рода указывает на женщину из непосредственного контекста. Её явное называние делает русский текст яснее, не добавляя нового толкования.
- issue: Значение εἰς μνημόσυνον αὐτῆς
  choice: в память о ней
  alternative: в воспоминание о ней
  rationale: Формулировка сохраняет открытым характер памятования и не превращает его в специально определённый культовый или обрядовый акт.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным регистром. Конструкция «где бы … ни» сохраняет обобщённость исходного текста; неопределённо-личное «будут рассказывать» естественно воспроизводит греческий будущий пассив.
