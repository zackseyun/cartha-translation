  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: ru
  text: До Пасхи и праздника Опресноков[b] оставалось два дня[a]. Первосвященники и книжники искали, как бы им коварством схватить Его[c] и убить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по прошествии двух дней». Выражение указывает, что Пасха и праздник Опресноков приближались.'
    reason: lexical_alternative
  - marker: b
    text: 'По-гречески буквально: «пресные [хлебы]» — обычное обозначение праздника Опресноков.'
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «арестовать Его»; глагол также может означать «захватить» или «схватить».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: оставалось
  rationale: В сочетании с указанием срока естественная русская конструкция «оставалось два дня» передаёт временной смысл; слабый переходный оттенок δέ не требует отдельного слова.
- source_word: τὸ πάσχα
  choice: Пасха
  rationale: Устоявшееся русское название иудейского праздника; в контексте речь идёт о праздновании, а не непосредственно о пасхальном ягнёнке.
- source_word: τὰ ἄζυμα
  choice: праздник Опресноков
  rationale: Буквально выражение означает «пресные [хлебы]», но в данном контексте служит названием праздника; добавление слова «праздник» делает смысл ясным современному читателю.
- source_word: μετὰ δύο ἡμέρας
  choice: оставалось два дня
  rationale: Идиоматически передаёт близость событий; более буквальное «через два дня» отмечено в сноске.
- source_word: ἐζήτουν
  choice: искали
  rationale: Имперфект указывает на продолжавшиеся поиски способа осуществить замысел.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Традиционный и точный термин для представителей высшего священства во множественном числе.
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: Прямой и общеупотребительный библейский эквивалент, понятный современному русскому читателю.
- source_word: ἐν δόλῳ
  choice: коварством
  rationale: Передаёт обманный и нравственно предосудительный характер замысла, не сводя значение только к секретности.
- source_word: κρατήσαντες
  choice: схватить Его
  rationale: Передаёт враждебный захват, не уточняя сверх греческого текста, был ли он формально юридическим арестом.
- source_word: ἀποκτείνωσιν
  choice: убить
  rationale: Прямой современный эквивалент без излишнего юридического оттенка.
theological_decisions:
- issue: Соотношение Пасхи и Опресноков
  choice: 'Сохранить два отдельных наименования: «Пасха и праздник Опресноков»'
  alternative: Объединить их в одно составное название праздника
  rationale: Марк прямо называет обе тесно связанные, но различимые реалии; перевод не сливает их в одно название.
- issue: Нравственная характеристика замысла руководителей
  choice: Передать ἐν δόλῳ словом «коварством»
  alternative: «тайно» или «незаметно»
  rationale: Греческое слово указывает не только на скрытность, но и на обман; перевод сохраняет эту этическую окраску.
- issue: Характер захвата Иисуса
  choice: «схватить Его»
  alternative: «арестовать Его»
  rationale: Так сохраняется диапазон значения κρατέω и не добавляется формально-правовая характеристика, хотя контекст допускает арест.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского читателя; сохранены краткость, продолжающийся характер поисков и неоднозначность между общим захватом и официальным арестом.
