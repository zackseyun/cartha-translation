source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: ru
  text: 'Но Иисус сказал: «Оставьте её. Зачем вы причиняете ей столько хлопот? Она сделала для Меня прекрасное дело[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доброе дело».'
    reason: Слово καλός может означать «прекрасный», «добрый», «достойный».
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: Оставьте её
  rationale: Краткое повеление передаёт требование немедленно прекратить вмешательство; в данном контексте по-русски естественно означает «оставьте её в покое».
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Зачем вы причиняете ей беспокойство?
  rationale: Оборот буквально говорит о доставлении ей тягот или хлопот. «Причиняете ей беспокойство» сохраняет укоризненную силу и звучит естественно в современном литературном русском.
- source_word: καλὸν ἔργον
  choice: прекрасное дело
  rationale: καλός совмещает значения доброго, прекрасного и достойного; «прекрасное дело» передаёт не только нравительную положительность, но и уместность, красоту поступка.
- source_word: ἠργάσατο
  choice: сделала
  rationale: Обычное русское сочетание «сделала дело» точно и без излишней формальности передаёт глагол.
- source_word: ἐν ἐμοί
  choice: для Меня
  rationale: Буквальное «во Мне» здесь неестественно по-русски. Контекстуальное «для Меня» передаёт направленность поступка на Иисуса, не сводя выражение только к физическому помазанию.
- source_word: δὲ
  choice: Но
  rationale: 'Союз обозначает переход с оттенком противопоставления: Иисус возражает тем, кто осуждает женщину.'
theological_decisions:
- issue: Смысл καλὸν ἔργον при оценке поступка женщины
  choice: прекрасное дело
  alternative: доброе дело; благородный поступок
  rationale: Формулировка сохраняет высокую положительную оценку Иисуса и эстетически-нравственную многозначность καλός, не привнося учения о заслугах.
- issue: Значение ἐν ἐμοί
  choice: для Меня
  alternative: по отношению ко Мне; надо Мной; во Мне
  rationale: Идиоматический перевод указывает, что поступок был обращён к Иисусу лично, но не добавляет более узкого богословского или пространственного толкования.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Прямая речь передана естественно; прописная буква в «Меня» соответствует традиционной русской библейской орфографии.
