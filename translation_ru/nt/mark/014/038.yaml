  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ru
  text: Бодрствуйте и молитесь, чтобы не впасть в искушение.[a] Дух готов, но плоть слаба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытание».'
    reason: Лексическая многозначность πειρασμός.
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Бодрствуйте
  rationale: Повелительная форма множественного числа означает буквально «не спите» и вместе с тем призывает сохранять бдительность; «бодрствуйте» естественно передаёт оба оттенка в контексте Гефсимании.
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Настоящее повелительное передаёт продолжающееся побуждение; обычная русская форма «молитесь» звучит ясно и естественно.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: чтобы не впасть в искушение
  rationale: Оборот с ἵνα μή выражает цель или предотвращение. Русское «впасть в искушение» идиоматично и сохраняет образ вхождения в ситуацию искушения.
- source_word: πειρασμόν
  choice: искушение
  rationale: Слово может обозначать искушение, испытание или проверку. В данном предостережении основным выбран смысл «искушение», а более широкая возможность отражена в сноске.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Дух готов
  rationale: πνεῦμα в противопоставлении плоти естественнее всего понимать как человеческий дух, внутреннее намерение. πρόθυμος означает готовность, расположенность или усердие; «готов» кратко и точно сохраняет смысл.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: но плоть слаба
  rationale: «Плоть» сохраняет антропологическое противопоставление духу и не сводит выражение ни только к телу, ни к догматическому понятию греховной природы. «Слаба» прямо передаёт человеческую немощь.
theological_decisions:
- issue: К кому или чему относится πνεῦμα
  choice: человеческий дух, то есть внутреннее намерение
  alternative: Святой Дух
  rationale: Контраст с плотью и обращение к сонным ученикам указывают прежде всего на их искреннюю внутреннюю готовность. Строчная буква не навязывает отождествление со Святым Духом.
- issue: Значение σάρξ
  choice: плоть
  alternative: тело; греховная природа
  rationale: Здесь речь идёт о человеческой слабости, а не обязательно о теле как таковом или о специально сформулированном учении о греховной природе. Буквальное «плоть» сохраняет напряжение исходного противопоставления.
- issue: Значение πειρασμός
  choice: искушение
  alternative: испытание; проверка
  rationale: Контекст предупреждения поддерживает значение «искушение», однако греческое слово допускает более широкое понимание, поэтому варианты сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Бодрствуйте» сохраняет библейскую выразительность, не являясь архаизмом; краткий параллелизм «Дух готов, но плоть слаба» воспроизводит сжатость и контраст греческого текста.
