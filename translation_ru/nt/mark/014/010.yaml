base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: ru
  text: И Иуда Искариот, один из Двенадцати, пошёл к первосвященникам, чтобы передать Его им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предать Его им». Греческий глагол может означать «передать» или «выдать», а в случае Иуды такая передача была актом предательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Простой повествовательный союз сохраняет связь с предшествующим эпизодом, не добавляя нового смыслового оттенка.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Иуда Искариот
  rationale: Устоявшаяся русская передача личного имени и прозвания.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: один из Двенадцати
  rationale: Субстантивированное обозначение известного круга учеников передано как название группы; прописная буква помогает отличить его от простого числительного.
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: Естественная современная передача повествовательного аориста движения без излишнего усиления значения удаления.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: к первосвященникам
  rationale: Во множественном числе слово обозначает иерусалимское высшее священническое руководство; «первосвященники» — традиционный и точный русский эквивалент.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно и ясно выражает цель действия.
- source_word: παραδοῖ
  choice: выдать
  rationale: Глагол παραδίδωμι имеет широкое значение передачи или выдачи во власть другого. «Выдать» естественно по-русски и сохраняет связь с последующим языком Страстей, не сводя лексическое значение только к предательству.
- source_word: αὐτὸν ... αὐτοῖς
  choice: Его им
  rationale: 'Оба местоимения сохранены: объектом является Иисус, а получателями — первосвященники. Прописная буква в «Его» следует принятому в русском библейском регистре уважительному написанию.'
theological_decisions:
- issue: Передача παραδοῖ в контексте поступка Иуды
  choice: выдать Его им
  alternative: предать Его им
  rationale: Поступок Иуды является предательством, однако сам греческий глагол шире и в повествовании о Страстях последовательно означает передачу во власть. Основной текст сохраняет эту лексическую и богословскую напряжённость, а оттенок предательства поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и естественный; сохранены явные местоимения оригинала и признанное групповое обозначение «Двенадцать».
