    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает лёгкое противопоставление предыдущему действию: юношу схватили, но он вырвался и убежал.'
- source_word: καταλιπὼν
  choice: оставив
  rationale: 'Аористное причастие καταλείπω передаёт предшествующее сопутствующее действие: он оставил полотно, чтобы спастись.'
- source_word: σινδόνα
  choice: льняное полотно
  rationale: Слово обозначает кусок льняной ткани, который мог служить покрывалом или одеждой; нейтральное «полотно» не уточняет его форму сверх данных текста.
- source_word: γυμνὸς
  choice: нагим
  rationale: В данном контексте юноша оставляет единственное упомянутое покрытие; «нагим» естественно передаёт прямой смысл слова, сохраняя возможность пояснить более широкий диапазон значения в сноске.
- source_word: ἔφυγεν
  choice: убежал
  rationale: Форма φεύγω обозначает поспешное бегство; «убежал» звучит естественно в современном русском повествовании.
