  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: ru
  text: Но он, оставив льняное полотно[a], убежал нагим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «льняную ткань», «льняное покрывало» либо «льняную одежду».'
    reason: lexical_alternative
  - marker: b
