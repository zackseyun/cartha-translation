  text: Вставайте, пойдём. Вот, предающий Меня приблизился.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «тот, кто отдаёт Меня, приблизился».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Вставайте
  rationale: Форма повелительного наклонения во множественном числе. В данном контексте Иисус призывает учеников подняться и идти, поэтому «Вставайте» точнее по ситуации, чем «Просыпайтесь».
- source_word: ἄγωμεν
  choice: пойдём
  rationale: Увещевательное сослагательное наклонение первого лица множественного числа естественно передаётся современным русским «пойдём».
- source_word: ἰδού
  choice: Вот
  rationale: Междометие привлекает внимание к непосредственному приближению предателя; «вот» сохраняет указательную силу и звучит естественно и достойно.
- source_word: ὁ παραδιδούς
  choice: предающий Меня
  rationale: Артиклированное причастие обозначает того, кто предаёт или передаёт Иисуса властям. «Предающий Меня» сохраняет причастную форму и передаёт нравственно-реляционный смысл в контексте Иуды.
- source_word: ἤγγικεν
  choice: приблизился
  rationale: 'Перфект обозначает совершившееся приближение с актуальным результатом: этот человек уже рядом. «Приблизился» сохраняет движение, не сводя выражение к статичному «близко».'
theological_decisions:
- issue: Передача παραδίδωμι в повествовании о страстях
  choice: предающий
  alternative: передающий
  rationale: В связи с Иудой контекст ясно включает предательство, однако исходный глагол буквально может означать передачу человека в чужие руки. Основной текст передаёт контекстуальный смысл, а сноска сохраняет более буквальную возможность и заложенное в слове напряжение.
translation_notes:
  register: Современный литературный русский язык; краткие повелительные фразы передают напряжённость сцены. Сохранена причастная конструкция исходного текста. Местоимение «Меня» написано с прописной буквы согласно распространённой русской библейской издательской норме.
