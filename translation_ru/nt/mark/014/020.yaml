  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: ru
  text: 'И Он сказал им: «Один из двенадцати — тот, кто обмакивает вместе со Мной в блюдо[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в миску». Греческое слово τρύβλιον обозначает блюдо или миску, из которой ели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ответил
  rationale: В данном контексте δέ мягко продолжает повествование, а сочетание с εἶπεν естественно передаётся по-русски глаголом «ответил», поскольку слова Иисуса следуют за вопросом учеников.
- source_word: εἶπεν αὐτοῖς
  choice: Он ответил им
  rationale: Передаёт обращение Иисуса к ученикам и естественно связывает реплику с их предшествующим вопросом.
- source_word: Εἷς τῶν δώδεκα
  choice: Один из двенадцати
  rationale: Точно сохраняет указание на принадлежность предателя к ближайшему кругу учеников; строчная буква не превращает числительное в формальный титул.
- source_word: ὁ ἐμβαπτόμενος
  choice: тот, кто обмакивает хлеб
  rationale: Настоящее причастие передаёт происходящее действие. Дополнение «хлеб» в русском делает подразумеваемый предмет обмакивания понятным, не меняя смысла застольной сцены.
- source_word: μετ’ ἐμοῦ
  choice: вместе со Мной
  rationale: Естественно передаёт значение совместности у μετά с родительным падежом.
- source_word: εἰς τὸ τρύβλιον
  choice: в блюдо
  rationale: Предлог «в» передаёт направленность εἰς, а «блюдо» обозначает общую столовую посуду, в которую обмакивали пищу.
