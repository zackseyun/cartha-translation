    rationale: 'Оборот «Куда нам пойти...» превращает вопрос о желании Иисуса в самостоятельное предложение учеников. Следует передать: «Где Ты хочешь, чтобы мы...».'
  - severity: medium
    issue: «Чтобы Ты мог есть» вносит отсутствующий модальный смысл.
    rationale: φάγῃς означает «Ты ел / мог поесть» лишь в целевой конструкции; отдельная модальность возможности в греческом не выражена.
