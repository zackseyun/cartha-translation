  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: ru
  text: 'В первый день праздника Пресных хлебов, когда закалывали пасхальных ягнят[a], ученики спросили Иисуса: «Где Ты хочешь, чтобы мы пошли и приготовили Тебе пасхальную трапезу?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда закалывали Пасху». В данном контексте греческое слово «Пасха», вероятнее всего, обозначает пасхальных ягнят, которых приносили в жертву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: в первый день праздника Пресных хлебов
  rationale: Название праздника передано естественно для современного русского языка. Слово «праздника» добавлено для ясности, хотя в греческом оно подразумевается конструкцией «день Пресных хлебов».
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: когда закалывали пасхальных ягнят
  rationale: При θύω слово πάσχα обозначает пасхальную жертву. Глагол «закалывали» точно передаёт жертвенный контекст, а множественное число естественно согласуется с неопределённым субъектом ἔθυον и обычным совершением обряда.
- source_word: λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: ученики спросили Иисуса
  rationale: Историческое настоящее передано русским прошедшим временем. «Спросили» естественно вводит последующий вопрос; имя «Иисуса» проясняет местоименную отсылку без изменения смысла.
- source_word: Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν
  choice: Куда нам пойти и всё приготовить
  rationale: Причастие ἀπελθόντες естественно включено в однородную последовательность действий. θέλεις в русском вопросе идиоматично передаётся конструкцией «куда нам», а подразумеваемое желание Иисуса сохраняется контекстом поручения.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: чтобы Ты мог есть пасхальную трапезу
  rationale: ἵνα передаёт цель. Во втором случае πάσχα относится к пасхальной трапезе, поэтому это значение выражено явно; «мог» передаёт подготовку необходимых условий, не утверждая сомнения в возможности действия.
theological_decisions:
- issue: Значение πάσχα в двух случаях данного стиха
  choice: Первое употребление передано как пасхальные ягнята в контексте заклания, второе — как пасхальная трапеза в контексте еды.
  alternative: В обоих случаях оставить общее обозначение «Пасха».
  rationale: Различие определяется ближайшими глаголами θύω и ἐσθίω и делает смену референта ясной, не привнося конфессионального толкования.
- issue: Календарное выражение «первый день Пресных хлебов»
  choice: Сохранить формулировку Марка без попытки согласовать её с иной хронологической схемой.
  alternative: Переформулировать как канун праздника или пояснить календарную систему в основном тексте.
  rationale: Перевод сохраняет формулировку и напряжение исходного повествования, не разрешая его посредством гармонизации.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественной библейской лексикой. Заглавная буква в «Ты» следует принятой русской традиции уважительного обращения к Иисусу; выражения «Пресные хлебы» и «пасхальная трапеза» понятны широкому читателю.
