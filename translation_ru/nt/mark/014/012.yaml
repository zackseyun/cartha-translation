  source_fidelity: В начале стиха переданы праздник и жертвенный контекст; «пасхальных ягнят» уместно раскрывает значение τὸ πάσχα при θύω. Однако в вопросе опущено явно выраженное θέλεις («Ты хочешь»), а «мог есть» добавляет модальный оттенок, которого в ἵνα φάγῃς нет. Неопределённое «всё» также не имеет опоры в греческом тексте.
  naturalness: Предлагаемая редакция сохраняет современный литературный русский и делает вопрос учеников естественным. Формула «приготовить Тебе пасхальную трапезу» ясно выражает назначение приготовления без неестественного в современном русском буквального оборота «есть Пасху».
  terminology: «Праздник Пресных хлебов» и «пасхальные ягнята» приемлемы. «Пасхальная трапеза» во втором употреблении πάσχα точно передаёт значение в контексте φάγῃς. Написание «Ты» сохранено как выбранная регистровая норма обращения к Иисусу.
