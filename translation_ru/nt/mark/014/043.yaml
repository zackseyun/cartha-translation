  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: ru
  text: И тотчас, пока Он ещё говорил, пришёл Иуда, один из Двенадцати, а с ним — толпа от первосвященников, книжников и старейшин, с мечами и дубинами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «от первосвященников, книжников и старейшин» может означать, что толпа действовала по их поручению; буквально в греческом тексте — «от».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт внезапность и стремительность, характерные для повествования Марка, и естественно звучит в современном литературном русском.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: пока Он ещё говорил
  rationale: Естественно передаёт одновременность действий в греческой конструкции genitivus absolutus; «ещё» соответствует ἔτι.
- source_word: παραγίνεται
  choice: пришёл
  rationale: Греческий исторический презенс передан прошедшим временем, обычным для русского повествования; глагол обозначает появление Иуды на месте действия.
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная и общепонятная русская форма имени.
- source_word: εἷς τῶν δώδεκα
  choice: один из Двенадцати
  rationale: Сохраняет краткое обозначение ближайшей группы учеников без добавления отсутствующего в тексте слова «учеников».
- source_word: ὄχλος
  choice: толпа
  rationale: Прямое значение слова; враждебность этой толпы ясна из упоминания оружия, поэтому более оценочное «сброд» или «толпа нападавших» не требуется.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: с мечами и дубинами
  rationale: «Мечи» достаточно точно передаёт μάχαιραι в данном контексте, а буквальное «деревяшки/дерево» для ξύλα заменено контекстуально точным названием оружия — «дубины».
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: от первосвященников, книжников и старейшин
  rationale: Сохраняет выраженное предлогом παρά значение источника или полномочия и не усиливает его до прямо не высказанного «посланная».
- source_word: ἀρχιερέων
  choice: первосвященников
  rationale: Устоявшееся русское обозначение представителей высшей священнической верхушки во множественном числе.
- source_word: γραμματέων
  choice: книжников
  rationale: Прямой традиционный эквивалент, сохраняющий историко-религиозное обозначение группы.
- source_word: πρεσβυτέρων
  choice: старейшин
  rationale: Точно передаёт обозначение признанных руководителей народа в данном институциональном контексте.
theological_decisions:
- issue: Исторический презенс παραγίνεται
  choice: 'Передать прошедшим временем: «пришёл»'
  alternative: 'Сохранить настоящее время: «приходит»'
  rationale: Настоящее время придаёт греческому рассказу живость, однако прошедшее время естественнее в современном русском повествовании и не изменяет содержания.
- issue: Значение παρά при упоминании руководителей
  choice: «от первосвященников, книжников и старейшин»
  alternative: «посланная первосвященниками, книжниками и старейшинами»
  rationale: Греческий текст указывает на источник или санкцию властей, но не формулирует действие посылания напрямую; буквальная конструкция сохраняет эту смысловую сдержанность.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Инверсия и перегруженность устранены, но последовательность событий и компактное «один из Двенадцати» сохранены. Прописное «Он» употреблено по принятой русской библейской традиции.
