  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: ru
  text: 'И посылает Он двух Своих учеников и говорит им: «Пойдите в город. Вам встретится человек, несущий кувшин воды[a]. Следуйте за ним».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глиняный кувшин с водой».'
    reason: Лексема κεράμιον может обозначать сосуд из обожжённой глины; основной текст не уточняет материал без необходимости.
lexical_decisions:
- source_word: ἀποστέλλει
  choice: посылает
  rationale: Настоящее время сохраняет характерное для повествования Марка живое историческое настоящее.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: двух Своих учеников
  rationale: Передаёт партитивную конструкцию и употребляет общепринятый в данном контексте эквивалент слова μαθητής.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого текста и согласованность с формой «посылает».
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Пойдите в город
  rationale: Естественная русская формулировка прямого повеления с указанием движения внутрь города.
- source_word: ἀπαντήσει ὑμῖν
  choice: Вам встретится
  rationale: Идиоматично передаёт будущее время и дательный объект, не добавляя намерения человека выйти навстречу.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В русском языке слово естественно обозначает здесь конкретного мужчину, тогда как «мужчина» звучало бы более маркированно, чем греческое ἄνθρωπος.
- source_word: κεράμιον ὕδατος
  choice: кувшин воды
  rationale: Ясно и естественно обозначает сосуд с водой; возможная конкретизация материала вынесена в примечание.
- source_word: βαστάζων
  choice: несущий
  rationale: Причастие непосредственно и естественно передаёт одновременное действие греческого βαστάζων.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Следуйте за ним
  rationale: Прямо передаёт повеление идти вслед за человеком и соответствует dignified modern Russian register.
theological_decisions: []
