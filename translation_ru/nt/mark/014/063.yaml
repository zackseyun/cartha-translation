  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: ru
  text: 'Тогда первосвященник разорвал на себе одежды[a] и говорит[b]: «Зачем нам ещё свидетели?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои хитоны»; χιτών обозначает нижнюю одежду или тунику, но здесь возможно более общее значение «одежды».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблено историческое настоящее: «говорит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное русское обозначение единственного носителя этой должности в данном повествовании.
- source_word: διαρρήξας
  choice: разорвал
  rationale: Передаёт решительное действие аористного причастия современным литературным языком; оборот «на себе» естественно связывает действие с собственной одеждой первосвященника.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: на себе одежды
  rationale: Сохраняет множественное число и не сужает значение χιτών до рубахи или до церемониального облачения.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет историческое настоящее греческого текста, допустимое и выразительное в русском повествовании.
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων
  choice: Зачем нам ещё свидетели?
  rationale: Естественная русская передача риторического вопроса, сохраняющая значение ἔτι («ещё») и мысль об отсутствии дальнейшей нужды в свидетелях.
theological_decisions:
- issue: Значение разрывания одежды первосвященником
  choice: Жест передан буквально, без пояснения его мотивов.
  alternative: Прямо назвать жест выражением скорби, возмущения или реакцией на предполагаемое богохульство.
  rationale: Сам стих сообщает о действии, но не истолковывает его; перевод не должен вносить в текст конкретное богословское объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено как особенность исходного текста; формулировка вопроса сделана естественной для обычного современного читателя.
