  source_fidelity: 'Текст точно передаёт греческий оригинал: ὁ ἀρχιερεύς — «первосвященник»; аористное причастие διαρρήξας естественно выражено глаголом «разорвал»; множественное число τοὺς χιτῶνας сохранено в «одежды»; ἔτι отражено словом «ещё». Риторический вопрос «Зачем нам ещё свидетели?» является естественной русской передачей «Какую ещё нужду мы имеем в свидетелях?» и не добавляет толкования.'
  naturalness: Фраза звучит как современный литературный русский библейского регистра. Оборот «разорвал на себе одежды» несколько возвышен, но нормативен и уместен в повествовательном контексте. Историческое настоящее «говорит» в русском возможно и согласуется с выбранной стратегией сохранения формы оригинала.
  terminology: «Первосвященник» — точное устоявшееся обозначение. Более общее «одежды» не чрезмерно конкретизирует χιτών как тунику и при этом сохраняет множественное число. Сноска a корректно фиксирует лексическую альтернативу; сноска b корректно поясняет историческое настоящее.
