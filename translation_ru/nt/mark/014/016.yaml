id: MRK.14.16
reference: Mark 14:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: ru
  text: Ученики вышли, пришли в город и нашли всё так, как Он им сказал; и они приготовили Пасху.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасхальную трапезу». Греческое выражение может обозначать как Пасху вообще, так и, в данном контексте, приготовляемую пасхальную трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышли
  rationale: Естественно передаёт аорист ἐξέρχομαι и обозначает уход из прежнего места.
- source_word: οἱ μαθηταί
  choice: ученики
  rationale: Устоявшееся и понятное обозначение последователей Иисуса, сохраняющее смысл обучения и личной связи с Учителем.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: пришли в город
  rationale: Передаёт движение внутрь города; по-русски «пришли в город» естественнее буквального «вошли в город» в данной последовательности.
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: нашли всё так, как Он им сказал
  rationale: Объект глагола в греческом не выражен; «всё» естественно восполняет подразумеваемые обстоятельства, не уточняя их сверх контекста. Прошедшее время в русском ясно обозначает ранее сказанное.
- source_word: ἡτοίμασαν
  choice: приготовили
  rationale: Прямо и естественно передаёт значение «подготовили, сделали готовым».
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: Сохраняет широту греческого πάσχα, которое может обозначать как праздник, так и в данном контексте пасхальную трапезу.
theological_decisions:
- issue: Объём значения τὸ πάσχα
  choice: Пасху
  alternative: пасхальную трапезу
  rationale: 'Основной текст не устраняет лексическую многозначность: в контексте подразумевается приготовление к пасхальной трапезе, однако греческое выражение формально шире.'
translation_notes:
  register: Современный литературный русский язык; повествование краткое и dignified, синтаксис сохраняет последовательность греческих καί без неестественной буквальности. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
