source:
  edition: SBLGNT
  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: ru
  text: 'Но он начал призывать проклятия и клясться[a]: «Я не знаю этого человека, о котором вы говорите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проклинать»; возможно: «призывать проклятие на самого себя». В греческом тексте объект проклятия прямо не указан.'
    reason: Лексическая неоднозначность глагола ἀναθεματίζειν и отсутствие выраженного объекта.
lexical_decisions:
- source_word: ὁ δὲ
  choice: Но он
  rationale: δέ передаёт развитие повествования с оттенком противопоставления и усиления после предыдущего отрицания.
- source_word: ἤρξατο
  choice: стал
  rationale: В сочетании с инфинитивами естественно передаёт начало действия; в современном русском здесь звучит плавнее, чем «начал» с двумя последующими инфинитивами.
- source_word: ἀναθεματίζειν
  choice: призывать проклятия
  rationale: Передаёт смысл навлечения или призывания проклятия, не уточняя его объект, который в греческом тексте прямо не назван.
- source_word: ὀμνύναι
  choice: клясться
  rationale: Обозначает подтверждение слов клятвой, а не употребление бранных выражений.
- source_word: ὅτι
  choice: двоеточие и прямая речь
  rationale: Союз вводит содержание клятвенного отрицания; по-русски естественно оформить его прямой речью.
- source_word: Οὐκ οἶδα
  choice: Я не знаю
  rationale: Сохраняет прямой и резкий характер отрицания без добавочного толкования «не признаю».
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: этого человека
  rationale: Указательное местоимение τοῦτον передано явно; выражение не получает дополнительной пренебрежительной окраски.
- source_word: ὃν λέγετε
  choice: о котором вы говорите
  rationale: Естественно передаёт указание на человека, упоминаемого собеседниками, и сохраняет относительную конструкцию оригинала.
theological_decisions:
- issue: Характер проклятия в ἀναθεματίζειν
  choice: Передать действие как призывание проклятий без указания их объекта.
  alternative: «Проклинать»; «призывать проклятие на самого себя».
  rationale: В контексте возможно самообременение проклятием как подтверждение клятвы, однако греческий текст не говорит прямо, на кого или на что направлено проклятие. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified повествовательный стиль. «Клясться» здесь означает подтверждать слова клятвой, а «призывать проклятия» отличает это действие от простой брани и сохраняет неопределённость оригинала.
