  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: ru
  text: И, отойдя немного вперёд[a], Он пал на землю и молился, чтобы, если возможно, час миновал Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пройдя немного дальше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: отойдя немного вперёд
  rationale: Причастие προελθών с μικρόν обозначает перемещение на небольшое расстояние вперёд от остальных; этот вариант естественен по-русски и сохраняет пространственный смысл.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: Он пал на землю
  rationale: Имперфект может описывать наступление или развитие действия; в русском повествовании совершенный вид естественно передаёт падение ниц, не навязывая неуместной повторности.
- source_word: προσηύχετο
  choice: молился
  rationale: Форма имперфекта представляет молитву как продолжавшееся действие; русский несовершенный вид сохраняет эту длительность.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит содержание и желаемый исход молитвы; «чтобы» естественно сохраняет обе стороны значения.
- source_word: εἰ δυνατόν ἐστιν
  choice: если возможно
  rationale: Безличная русская конструкция точно и естественно передаёт условность, не конкретизируя источник возможности.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: этот час миновал Его
  rationale: «Час» сохранён как значимый образ назначенного времени страданий, а «миновал Его» передаёт идею прохождения мимо или удаления от Него. Указательное «этот» в русском естественно обозначает конкретный, контекстуально определённый час.
theological_decisions:
- issue: Значение выражения «час»
  choice: сохранить образ «этот час» без поясняющей замены
  alternative: время страданий; момент страданий
  rationale: У Марка «час» несёт повествовательную и богословскую нагрузку. Прямой образ сохраняет напряжение молитвы и не сводит его к толкованию.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской практике; синтаксис остаётся ясным для обычного читателя.
