  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: ru
  text: 'Она сделала, что могла[a]: заранее помазала Моё тело благовониями для погребения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что имела, то сделала».'
    reason: Лексическая альтернатива, сохраняющая буквальную форму греческой идиомы.
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Она сделала, что могла
  rationale: Греческое выражение буквально означает «что имела, то сделала», но идиоматически передаёт мысль о том, что женщина сделала всё, что было в её силах. Русское «сделала, что могла» естественно и точно выражает этот смысл; буквальная форма сохранена в сноске.
- source_word: προέλαβεν
  choice: заранее
  rationale: Глагол указывает на действие, совершённое заблаговременно. Наречие «заранее» естественно сочетается по-русски с последующим описанием помазания и не привносит значения движения.
- source_word: μυρίσαι
  choice: помазала … благовониями
  rationale: Глагол означает нанесение ароматического масла или благовония. Эта формулировка яснее для современного читателя, чем более архаичное «умастила», и сохраняет конкретный смысл действия.
- source_word: τὸ σῶμά μου
  choice: Моё тело
  rationale: Прямая и естественная передача греческого словосочетания.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: для погребения
  rationale: Предложное сочетание выражает назначение действия — подготовку тела к погребению. Перевод сохраняет лаконичность оригинала.
theological_decisions:
- issue: Следует ли явно обозначить женщину как субъект, хотя в данной греческой фразе местоимение отсутствует
  choice: Она сделала… помазала
  alternative: Что имела, то сделала…
  rationale: Формы глаголов стоят в третьем лице единственного числа, а непосредственный контекст однозначно указывает на женщину. Добавление местоимения необходимо для естественного русского синтаксиса и не вносит нового богословского содержания.
- issue: Связь помазания с будущим погребением Иисуса
  choice: заранее помазала Моё тело благовониями для погребения
  alternative: предвосхитила помазание Моего тела при погребении
  rationale: Выбранная формулировка сохраняет утверждение Иисуса о заблаговременности действия, не уточняя сверх текста, насколько сама женщина осознавала его погребальный смысл.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Помазала благовониями» выбрано вместо архаичного «умастила» ради ясности; порядок слов остаётся естественным и подчёркивает, что действие было совершено заранее.
