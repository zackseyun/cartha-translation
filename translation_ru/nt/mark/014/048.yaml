  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: ru
  text: 'Иисус сказал им в ответ: «Вы вышли против Меня, как против разбойника[a], с мечами и дубинами, чтобы схватить Меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бандита» или «мятежника». Греческое слово λῃστής может обозначать вооружённого разбойника или повстанца, а не только вора.'
    reason: 'Лексическая альтернатива: сохранение более широкого смыслового диапазона λῃστής.'
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: сказал … в ответ
  rationale: Естественно передаёт обычную греческую формулу введения речи, сохраняя значение ответа без тяжеловесного буквального «ответив, сказал».
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: словно разбойника
  rationale: Передаёт смысл обращения с Иисусом как с опасным преступником, против которого выступают вооружённым отрядом; постановка в конце фразы звучит естественно по-русски.
- source_word: λῃστὴν
  choice: разбойника
  rationale: «Разбойник» обозначает насильственного преступника и сохраняет традиционно узнаваемое значение; возможный оттенок вооружённого мятежника отмечен в сноске.
- source_word: ἐξήλθατε
  choice: вышли
  rationale: Простой прошедший вид естественно передаёт аорист в данном риторическом вопросе и движение вооружённой группы к Иисусу.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: с мечами и дубинами
  rationale: «Мечи» естественно передаёт μάχαιραι в сцене задержания, а «дубины» выражает функцию деревянных палок как оружия.
- source_word: συλλαβεῖν με
  choice: чтобы схватить Меня
  rationale: «Схватить» сохраняет непосредственную силу глагола и подходит как для насильственного захвата, так и для задержания, не сужая его до формальной юридической процедуры.
theological_decisions:
- issue: Смысл λῃστής в риторическом вопросе Иисуса
  choice: «разбойник» в основном тексте с пояснением более широкого значения в сноске
  alternative: «бандит» или «мятежник» в основном тексте
  rationale: Греческое слово может обозначать не только грабителя, но и вооружённого бандита или повстанца. Основной вариант остаётся ясным и естественным, а исторически значимая неоднозначность не устраняется, а сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достоинственная. Риторический вопрос сохранён, синтаксис сделан естественным для русской речи. Местоимение «Меня» написано с прописной буквы в соответствии с распространённой русской библейской традицией.
