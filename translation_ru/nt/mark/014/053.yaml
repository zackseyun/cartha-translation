  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: ru
  text: И отвели Иисуса к первосвященнику, и собрались[a] все первосвященники, старейшины и книжники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «собираются» — в греческом здесь употреблено историческое настоящее, придающее рассказу живость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: отвели
  rationale: Глагол передаёт перемещение Иисуса под стражей; «отвели» естественно звучит по-русски и не уточняет способ принуждения сверх сказанного в тексте.
- source_word: ἀρχιερέα
  choice: к первосвященнику
  rationale: Форма единственного числа обозначает действующего главу священства; «первосвященник» — точное и привычное обозначение этой должности.
- source_word: συνέρχονται
  choice: собрались
  rationale: Греческое историческое настоящее передано русским прошедшим временем ради естественного повествования; значение совместного сбора сохранено.
- source_word: πάντες
  choice: все
  rationale: Сохраняет выраженный в греческом тексте охват названных групп.
- source_word: ἀρχιερεῖς
  choice: старшие священники
  rationale: Во множественном числе слово обозначает представителей высшей священнической знати. Этот вариант отличает группу от одного первосвященника и понятен современному читателю.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: В данном институциональном контексте речь идёт о признанных руководителях народа, а не просто о пожилых мужчинах.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и точный термин для знатоков и толкователей Писания в евангельском контексте.
theological_decisions:
- issue: Историческое настоящее συνέρχονται в повествовании о прошлом
  choice: 'Передано прошедшим временем: «собрались»'
  alternative: «собираются»
  rationale: Это не богословское уточнение, а решение о повествовательном времени. Русское прошедшее время обеспечивает естественность рассказа, а буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Повтор союза «и» сохраняет последовательную структуру греческой фразы.
