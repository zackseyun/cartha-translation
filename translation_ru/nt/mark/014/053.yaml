  source_fidelity: '«Отвели Иисуса к первосвященнику» точно передаёт ἀπήγαγον ... πρὸς τὸν ἀρχιερέα. Прошедшее «собрались» является оправданным естественным сглаживанием исторического настоящего συνέρχονται; сноска корректно сохраняет эту особенность. Однако «старшие священники» для ἀρχιερεῖς менее точно: это не просто священники более высокого статуса, а устоявшееся обозначение группы первосвященников / высшего первосвященнического круга.'
