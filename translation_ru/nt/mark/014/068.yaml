  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: ru
  text: 'Но он отрицал это, говоря: «Я не знаю и не понимаю, о чём ты говоришь». Затем он вышел наружу, в передний двор, и пропел петух[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях слова «и пропел петух» отсутствуют.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: стал отрицать это
  rationale: Средний аорист означает отрицание или отказ признать сказанное. Местоимение «это» естественно указывает на только что прозвучавшее обвинение, не внося более толковательное «отрёкся от Иисуса».
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Я не знаю и не понимаю
  rationale: Два близких глагола передают усиленное отрицание Петра; современная русская формулировка сохраняет их риторическое удвоение.
- source_word: σὺ τί λέγεις
  choice: о чём ты говоришь
  rationale: Это естественный русский эквивалент буквального «что ты говоришь» в данном контексте; он сохраняет прямое обращение и не подменяет речь более толковательным «что ты имеешь в виду».
- source_word: ἐξῆλθεν ἔξω
  choice: вышел наружу
  rationale: Сочетание глагола с наречием имеет лёгкое усиление; «вышел наружу» передаёт его без неестественного повтора.
- source_word: προαύλιον
  choice: к входу во двор
  rationale: Слово обозначает пространство перед внутренним двором или у его входа. Эта формулировка понятнее современному читателю, чем «преддверие» или «передний двор», и не смешивает место с самим внутренним двором.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: пропел петух
  rationale: Устойчивое и естественное русское выражение, точно передающее греческую фразу.
theological_decisions:
- issue: Наличие слов καὶ ἀλέκτωρ ἐφώνησεν
  choice: 'Включить в основной текст: «и пропел петух»'
  alternative: Опустить эти слова по чтению части рукописей
  rationale: SBLGNT сохраняет данную фразу, отмечая её текстуальную неустойчивость. Поэтому она переведена в основном тексте, а разночтение отражено в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Реплика Петра звучит естественно, но сохраняет двойное отрицание знания и понимания. Пространственный термин передан описательно ради понятности и точности.
