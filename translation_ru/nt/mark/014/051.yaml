  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: ru
  text: За Ним следовал один юноша, накинув на голое тело льняное полотно[a]. Его хватают,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «льняную простыню». Греческое слово может обозначать льняное полотно или ткань наподобие простыни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: один юноша
  rationale: νεανίσκος обозначает юношу или молодого человека, а τις вводит прежде не названного участника с лёгкой выделительной силой; «один юноша» естественно передаёт это по-русски.
- source_word: συνηκολούθει
  choice: следовал
  rationale: Имперфект изображает продолжавшееся действие; в русском контексте вид и порядок слов естественно передают фоновое следование.
- source_word: αὐτῷ
  choice: за Ним
  rationale: Местоимение в контексте относится к Иисусу; русский глагол «следовать» нормативно сочетается с предлогом «за» и творительным падежом.
- source_word: περιβεβλημένος
  choice: накинув
  rationale: Причастная форма περιβάλλω описывает полотно, обёрнутое или наброшенное вокруг тела; «накинув» звучит естественно и не превращает ткань в определённый вид одежды.
- source_word: σινδόνα
  choice: льняное полотно
  rationale: σινδών может обозначать льняную ткань, полотно или подобие простыни; общее «льняное полотно» сохраняет предметную неопределённость.
- source_word: ἐπὶ γυμνοῦ
  choice: на голое тело
  rationale: Фраза указывает, что полотно было непосредственно на обнажённом теле, без иной одежды.
- source_word: κρατοῦσιν
  choice: хватают
  rationale: Настоящее историческое создаёт живость повествования; «хватают» сохраняет её и передаёт физическое схватывание без более узкого толкования «арестовывают».
- source_word: αὐτόν
  choice: его
  rationale: Прямое дополнение относится к только что упомянутому юноше.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и сдержанно. Историческое настоящее в «хватают» сохранено. Прописная буква в «Ним» следует принятой русской библейской типографической традиции и ясно указывает на Иисуса в контексте.
