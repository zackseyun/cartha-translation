base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: ru
  text: 'что[a]: «Мы слышали, как Он говорил: „Я разрушу этот рукотворный храм и за три дня построю другой, нерукотворный“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что». Здесь союз, вероятнее всего, вводит содержание свидетельского показания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание свидетельского показания, а не выражает причину.
- source_word: Ἡμεῖς
  choice: мы
  rationale: Явное местоимение сохранено, поскольку в греческом оно подчёркивает самоутверждение свидетелей.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: мы слышали, как Он говорил
  rationale: Естественная русская передача конструкции с родительным падежом и причастием, сохраняющая длительный оттенок «говорил».
- source_word: καταλύσω
  choice: Я разрушу
  rationale: В отношении здания глагол означает разрушить или разобрать; «разрушу» ясно передаёт силу обвинения.
- source_word: τὸν ναὸν τοῦτον
  choice: этот храм
  rationale: «Храм» естественно обозначает Иерусалимский храм; указательное местоимение сохраняет значение конкретного здания, находящегося в виду.
- source_word: χειροποίητον
  choice: возведённый руками
  rationale: Сохраняет буквальный образ и прямой контраст с ἀχειροποίητον, оставаясь естественным в отношении здания.
- source_word: διὰ τριῶν ἡμερῶν
  choice: за три дня
  rationale: 'Передаёт продолжительность и предел срока: строительство совершается в течение трёх дней. В примечании сохранён естественный альтернативный вариант.'
- source_word: ἄλλον
  choice: другой
  rationale: Сохраняет утверждение о другом храме без внесения значения «восстановлю».
- source_word: ἀχειροποίητον
  choice: нерукотворный
  rationale: Устоявшееся и понятное русское слово точно передаёт «не сделанный руками» и сохраняет богословскую многозначность, не истолковывая её.
- source_word: οἰκοδομήσω
  choice: построю
  rationale: Точно передаёт значение глагола и не добавляет отсутствующего в греческом смысла «восстановлю».
theological_decisions:
- issue: Статус слов как враждебного свидетельского показания
  choice: Передать их как прямую речь внутри показания без поясняющего истолкования
  alternative: Добавить, что свидетели исказили слова Иисуса
  rationale: Стих сообщает именно заявление свидетелей; перевод не должен привносить гармонизацию с другими местами или оценку рассказчика.
- issue: Контраст χειροποίητον и ἀχειροποίητον
  choice: «возведённый руками» / «нерукотворный»
  alternative: «созданный людьми» / «созданный Богом»
  rationale: Выбранная формулировка сохраняет образный контраст исходного текста и возможный богословский смысл, не утверждая прямо, кем будет возведён второй храм.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прямой речи. Заглавное «Он» использовано по принятой русской издательской норме для местоимения, относящегося к Иисусу. Формула «за три дня» естественно выражает срок совершения действия; синтаксис сохраняет вложенную структуру свидетельского показания.
