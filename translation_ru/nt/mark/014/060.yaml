- from: 'Тогда первосвященник встал посреди собрания[a] и спросил Иисуса: «Ты ничего не отвечаешь? Что свидетельствуют против Тебя эти люди?»'
  to: 'И первосвященник встал и, выйдя на середину, спросил Иисуса: «Ты ничего не отвечаешь? В чём эти люди свидетельствуют против Тебя?»'
  rationale: Устранены добавочный временной оттенок, недостаточно выраженное направление εἰς μέσον и неестественная русская конструкция второго вопроса. Смысл судебного свидетельства против Иисуса сохранён; дополнительная сноска не нужна, поскольку «выйдя на середину» прямо и естественно передаёт пространственный оттенок оригинала.
