  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: ru
  text: 'И первосвященник встал и, выйдя на середину, спросил Иисуса: «Ты ничего не отвечаешь? В чём эти люди свидетельствуют против Тебя?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: 'Причастие от ἀνίστημι обозначает физическое действие: первосвященник поднялся со своего места. «Встал» естественно передаёт это движение в современном русском языке.'
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное обозначение иудейского первосвященника, председательствующего на разбирательстве.
- source_word: εἰς μέσον
  choice: посреди собрания
  rationale: Оборот указывает на центральное положение перед присутствующими. Добавление «собрания» делает пространственный смысл ясным по контексту, а сноска сохраняет возможный оттенок движения к середине.
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: В судебном контексте глагол означает обращение с вопросом. «Спросил» звучит естественно и не усиливает смысл до более жёсткого «допросил».
- source_word: ἀποκρίνῃ οὐδέν
  choice: Ты ничего не отвечаешь?
  rationale: Формулировка сохраняет резкий риторический вопрос и двойное отрицательное построение греческой фразы в естественной для русского языка форме.
- source_word: οὗτοί
  choice: эти люди
  rationale: Указательное местоимение мужского рода во множественном числе относится к присутствующим свидетелям. «Эти люди» явно передаёт указание на конкретных лиц без ненужного добавления слова «мужчины».
- source_word: καταμαρτυροῦσιν
  choice: свидетельствуют против Тебя
  rationale: Передан юридический смысл свидетельства, направленного против обвиняемого, без сведения значения лишь к общему «обвиняют».
theological_decisions:
- issue: Конкретность и род референта οὗτοί
  choice: эти люди
  alternative: они; эти мужчины
  rationale: Русское «эти люди» сохраняет указание на конкретных свидетелей и согласуется с мужской формой греческого местоимения, не подчёркивая пол сильнее, чем требует контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим судебной сцене. Союз καί в начале передан как «Тогда», чтобы естественно связать действие с предшествующим повествованием. Причастие λέγων отдельно не воспроизводится, поскольку русское двоеточие после «спросил» естественно вводит прямую речь.
