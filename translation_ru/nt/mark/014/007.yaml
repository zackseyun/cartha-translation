source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: ru
  text: Ведь бедные всегда с вами, и, когда захотите, вы можете делать им добро; а Я не всегда с вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: всегда
  rationale: Обычное наречие постоянной или неизменно доступной возможности; сохраняет повтор и контраст обеих частей стиха.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим высказыванием естественно для современного русского языка.
- source_word: τοὺς πτωχούς
  choice: бедные
  rationale: Субстантивированное прилагательное обозначает бедных людей как группу; русский эквивалент краток и точен.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: с вами
  rationale: В русском оборот «бедные всегда с вами» естественно выражает их постоянное присутствие и доступность; повтор той же конструкции в отношении Иисуса сохраняет параллелизм.
- source_word: ὅταν θέλητε
  choice: когда захотите
  rationale: 'Передаёт неопределённое временное условие: возможность открыта всякий раз, когда возникает желание действовать.'
- source_word: δύνασθε
  choice: можете
  rationale: Точно и естественно выражает способность или возможность без стилистически тяжёлого «вы способны».
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: делать им добро
  rationale: Сохраняет смысл идиомы — действовать им во благо, а не просто испытывать доброжелательность; не сужает значение до одной лишь милостыни.
- source_word: ἐμὲ δὲ οὐ πάντοτε ἔχετε
  choice: а Я не всегда с вами
  rationale: «А» ясно передаёт контраст δέ, а естественная русская конструкция сохраняет настоящее время и противопоставление постоянной доступности бедных ограниченному присутствию Иисуса.
theological_decisions:
- issue: Возможное понимание слов как умаления заботы о бедных
  choice: Сохранён временной и ситуативный контраст между постоянным присутствием бедных и ограниченным присутствием Иисуса; возможность делать бедным добро прямо утверждается.
  alternative: Истолковать слова как отказ от заботы о бедных ради почитания Иисуса.
  rationale: Текст сам говорит, что ученики могут делать бедным добро, когда захотят; перевод не должен ни ослаблять это утверждение, ни добавлять отсутствующие в стихе доктринальные пояснения.
- issue: Настоящее или будущее время в последней части
  choice: «Я не всегда с вами»
  alternative: «Я не всегда буду с вами»
  rationale: Греческий текст употребляет настоящее ἔχετε. Русский вариант с настоящим временем сохраняет форму источника и его напряжение, не вводя явного будущего времени.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены пояснительное «ведь», параллелизм «всегда с вами / не всегда с вами» и широкий деятельный смысл выражения «делать добро».
