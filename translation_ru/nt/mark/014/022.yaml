base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: ru
  text: 'И когда они ели, Он взял хлеб, благословил, преломил его, дал им и сказал: «Возьмите: это Моё тело»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это означает Моё тело» / «это представляет Моё тело». Греческий текст буквально: «это есть Моё тело».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: когда они ели
  rationale: Родительный самостоятельный оборот с причастием настоящего времени обозначает одновременное продолжающееся действие; эта формулировка естественна для современного русского повествования.
- source_word: λαβὼν ἄρτον
  choice: Он взял хлеб
  rationale: Аористное причастие естественно передано личной формой глагола в последовательности повествовательных действий. Неопределённый ἄρτον не требует уточнения «каравай» или «лепёшка».
- source_word: εὐλογήσας
  choice: благословил
  rationale: В контексте трапезы глагол указывает на произнесение благословения над хлебом. Русское «благословил» сохраняет краткость и намеренно не уточняет подразумеваемый объект сверх греческого текста.
- source_word: ἔκλασεν
  choice: преломил его
  rationale: «Преломил» — понятное и достойное контекста обозначение разламывания хлеба; местоимение естественно восстанавливает объект из контекста.
- source_word: ἔδωκεν αὐτοῖς
  choice: дал им
  rationale: Прямое соответствие греческой конструкции; объект ясен из предыдущего действия и не нуждается в повторении.
- source_word: Λάβετε
  choice: Возьмите
  rationale: Прямо передаёт повелительную форму и не добавляет отсутствующее в греческом тексте дополнение.
- source_word: τοῦτό ἐστιν
  choice: это Моё тело
  rationale: Связка ἐστιν передана обычным для русского настоящего времени нулевым эквивалентом; смысл буквально соответствует «это есть Моё тело» без стилистически архаичного «есть».
- source_word: τὸ σῶμά μου
  choice: Моё тело
  rationale: σῶμα прямо означает «тело»; оснований заменять его толкованием в основном тексте нет.
theological_decisions:
- issue: Смысл слов Иисуса о хлебе на Вечере
  choice: «это Моё тело»
  alternative: «это означает Моё тело» / «это символизирует Моё тело»
  rationale: Греческий текст использует обычную связку ἐστιν («есть»). Основной текст сохраняет прямую формулировку и связанную с ней богословскую напряжённость, не разрешая евхаристические споры средствами перевода.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой («преломил»). Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской практикой. Синтаксис сохраняет последовательность действий оригинала, оставаясь естественным для чтения вслух.
