  terminology: «Сын Человеческий» — устоявшееся и необходимое титульное соответствие. «Предаётся в руки» сохраняет широту παραδίδοται и не сужает смысл до предательства Иуды. «Грешники» корректно передаёт τῶν ἁμαρτωλῶν без неоправданного гендерного уточнения.
