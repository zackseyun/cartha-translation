  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ru
  text: 'И приходит в третий раз и говорит им: «Вы всё ещё спите и отдыхаете?[a] Довольно![b] Настал час. Вот, Сын Человеческий предаётся в руки грешников».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Спите дальше и отдыхайте». Греческие слова можно понять либо как риторический вопрос, либо как ироническое разрешение или повеление.'
    reason: alternative_reading
  - marker: b
    text: 'Греческое выражение трудно для точного понимания. Возможны также переводы: «Хватит» или «Этого достаточно»; предлагалось и менее вероятное здесь значение «уплачено сполна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: приходит в третий раз
  rationale: Историческое настоящее сохранено ради живости повествования; определённая форма τὸ τρίτον естественно передана как «в третий раз».
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Вы всё ещё спите и отдыхаете?
  rationale: В данном контексте формы могут звучать как риторический вопрос-упрёк; «всё ещё» естественно передаёт трудное идиоматическое τὸ λοιπὸν. Возможное ироническое повеление отмечено в сноске.
- source_word: ἀπέχει
  choice: Довольно!
  rationale: Краткое самостоятельное восклицание естественно обозначает резкий переход к наступившему часу, не вводя сомнительного коммерческого смысла.
- source_word: ἦλθεν ἡ ὥρα
  choice: Настал час
  rationale: «Час» сохраняет образ назначенного решающего момента и традиционную богословскую выразительность фразы.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современный и естественный русский указательный маркер, сохраняющий призыв обратить внимание.
- source_word: παραδίδοται
  choice: предаётся
  rationale: Глагол передаёт совершающееся отдание во власть других; русский «предаётся» сохраняет как повествовательную, так и страдательную окраску, не ограничивая действие одним предательством Иуды.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача самоназвания, сохраняющая его титульную и библейскую функцию.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: в руки грешников
  rationale: Сохраняется конкретная метафора перехода под чужую власть; субстантивированное прилагательное естественно передано словом «грешники».
theological_decisions:
- issue: Сила Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Риторический вопрос: «Вы всё ещё спите и отдыхаете?»'
  alternative: 'Ироническое разрешение или повеление: «Спите дальше и отдыхайте»'
  rationale: Древнейшая пунктуация не решает вопрос однозначно. Вопрос хорошо соответствует непосредственному упрёку и русскому контексту, но реальная двусмысленность сохранена в сноске.
- issue: Значение ἀπέχει
  choice: «Довольно!»
  alternative: «Хватит»; «этого достаточно»; предполагаемый коммерческий смысл «уплачено сполна»
  rationale: Контекст требует краткого переходного возгласа перед сообщением о наступившем часе. Лексическая трудность прямо отмечена, а спекулятивное техническое значение не внесено в текст.
- issue: Передача παραδίδοται
  choice: «предаётся»
  alternative: «выдаётся»; «передаётся»; «предан»
  rationale: Настоящее страдательное сохраняет разворачивающееся действие и не сводит круг действующих лиц исключительно к Иуде.
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной живостью. Историческое настоящее сохранено. Синтаксис сделан ясным для обычного читателя, а подлинная неоднозначность ключевых выражений вынесена в сноски.
