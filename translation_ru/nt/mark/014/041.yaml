  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: историческое настоящее («приходит»), τρίτον («в третий раз»), наступление часа и настоящее страдательное παραδίδοται («предаётся»). Формулировка «в руки грешников» сохраняет образ передачи во власть других. Риторическое прочтение Καθεύδετε ... ἀναπαύεσθε допустимо; альтернативное иронически-повелительное прочтение надлежащим образом сохранено в сноске.'
