  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: ru
  text: Первосвященники и весь совет[a] искали свидетельство против Иисуса, чтобы предать Его смерти, но не находили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весь синедрион».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀρχιερεῖς
  choice: Первосвященники
  rationale: δέ здесь служит мягкой повествовательной связкой и не требует отдельного русского слова; ἀρχιερεῖς обозначает представителей высшего храмового священства, для которых традиционное и понятное русское соответствие — «первосвященники».
- source_word: ὅλον τὸ συνέδριον
  choice: весь совет
  rationale: «Совет» передаёт значение συνέδριον без менее прозрачной транслитерации, а «весь» сохраняет ὅλον. Историческое наименование приведено в сноске.
- source_word: ἐζήτουν
  choice: искали
  rationale: Русское прошедшее несовершенного вида естественно передаёт длительное или повторявшееся действие имперфекта.
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: свидетельство против Иисуса
  rationale: κατά с родительным имеет здесь враждебно-направленное значение, а μαρτυρία в судебном контексте означает содержание свидетельских показаний.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: чтобы предать Его смерти
  rationale: Оборот с εἰς и субстантивированным инфинитивом выражает цель. «Предать смерти» сохраняет официальный судебный оттенок θανατόω и звучит естественно в данном контексте.
- source_word: καὶ οὐχ ηὕρισκον
  choice: но не находили
  rationale: Хотя καί буквально является соединительным союзом, в русском контекстуальное «но» ясно передаёт контраст между поиском и отсутствием результата; несовершенный вид сохраняет длительность имперфекта.
theological_decisions:
- issue: Идентификация συνέδριον
  choice: В основном тексте — «весь совет», в сноске — «весь синедрион».
  alternative: Передать в основном тексте как «весь синедрион».
  rationale: Это лексико-исторический, а не доктринальный вопрос. Перевод «совет» понятен современному читателю и соответствует значению греческого слова, а сноска сохраняет привычное историческое название учреждения.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-повествовательного контекста. Несовершенный вид глаголов передаёт продолжающееся действие обоих греческих имперфектов. Местоимение «Его» написано с прописной буквы по устойчивой русской библейской издательской норме, без добавления толкования.
