base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: ru
  text: 'И говорил[a]: «Авва, Отец[b], Тебе всё возможно. Удали от Меня эту чашу[c]. Но не то, чего хочу Я, а то, чего хочешь Ты».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И сказал». Греческий имперфект может указывать на продолжавшуюся или повторявшуюся речь.'
    reason: lexical_alternative
  - marker: b
    text: «Авва» — арамейская форма обращения к отцу; в исходном тексте рядом с ней сохранено греческое «Отец».
    reason: cultural_note
  - marker: c
    text: «Чаша» — библейский образ предстоящих Ему страданий; ср. Марка 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект допускает длительное или повторяющееся действие; «говорил» естественно передаёт это в русском повествовании, тогда как в сноске отмечена возможность перевода «сказал».
- source_word: Αββα ὁ πατήρ
  choice: Авва, Отец
  rationale: Сохранены и арамейское обращение «Авва», и следующее за ним греческое «Отец», без добавления отсутствующего в тексте притяжательного местоимения.
- source_word: πάντα δυνατά σοι
  choice: Тебе всё возможно
  rationale: Естественная современная русская формулировка, сохраняющая всеохватность πάντα и дательный σοι.
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: Удали от Меня эту чашу
  rationale: Императив передан прямой просьбой; образ чаши сохранён, а не заменён истолкованием.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Но пусть будет не то, чего хочу Я, а то, чего хочешь Ты
  rationale: В русском явно восполнено подразумеваемое сказуемое «пусть будет», необходимое для естественности молитвенной фразы. Контрастные местоимения передают эмфатические ἐγώ и σύ; θέλω передано как «хочу», без устранения напряжения между волей Иисуса и волей Отца.
theological_decisions:
- issue: Двойное обращение к Богу — на арамейском и греческом
  choice: Авва, Отец
  alternative: Авва, Отче; Авва, Отец Мой
  rationale: Сохранены обе формы исходного текста. «Отец» является современным прямым обращением; «Мой» не добавлено, поскольку в греческом тексте его нет.
- issue: Метафора чаши
  choice: эту чашу
  alternative: эти страдания; эту участь
  rationale: 'Образ не истолкован внутри текста: он сохраняет библейские связи и богословскую многозначность, а его смысл поясняется сноской.'
- issue: Соотношение воли Иисуса и воли Отца
  choice: не то, чего хочу Я, а то, чего хочешь Ты
  alternative: не Моя воля, но Твоя
  rationale: Перевод следует форме греческого τί ... θέλω и не превращает её в отвлечённое существительное. Эмфатический контраст сохранён без попытки сгладить богословское напряжение.
translation_notes:
  register: Современный литературный русский, ясный и молитвенно-достоинный. Заглавные буквы в «Меня», «Я», «Ты», «Тебе» отражают принятую русскую библейскую орфографическую традицию при обращении к Богу, не добавляя смысловых элементов. Порядок сносок приведён в последовательность [a], [b], [c].
