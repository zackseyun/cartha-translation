  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: ru
  text: Взяв чашу и воздав благодарность, Он подал её им, и все отпили из неё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: взяв
  rationale: Деепричастие естественно передаёт предшествующее сопутствующее действие аористного причастия, не превращая его в отдельный сказуемый.
- source_word: ποτήριον
  choice: чашу
  rationale: Греческое существительное употреблено без артикля. В русском отсутствие неопределённого артикля позволяет естественно сказать «чашу», сохранив возможную неопределённость; контекст трапезы при этом может указывать на конкретную чашу.
- source_word: εὐχαριστήσας
  choice: возблагодарив
  rationale: Передаёт благодарение и предшествование действия основной форме «подал», не вводя более поздний литургический термин и не заменяя благодарение благословением.
- source_word: ἔδωκεν αὐτοῖς
  choice: Он подал её им
  rationale: «Подал» естественно описывает передачу чаши за столом; местоимение «её» явно отсылает к чаше и восполняет подразумеваемый в греческом объект.
- source_word: ἔπιον
  choice: пили
  rationale: Русский прошедший вид «пили» естественно сочетается с указанием «из неё» и описывает участие всех; перевод «выпили» мог бы излишне подразумевать, что содержимое было допито полностью.
- source_word: ἐξ αὐτοῦ
  choice: из неё
  rationale: Местоимение по смыслу относится к чаше; «из неё» является прямым и естественным русским выражением.
- source_word: πάντες
  choice: все
  rationale: Позиция перед сказуемым ясно подчёркивает, что пили все присутствующие ученики.
theological_decisions:
- issue: Возможные евхаристические оттенки εὐχαριστήσας
  choice: возблагодарив
  alternative: благословив; произнеся благодарственную молитву
  rationale: Глагол прямо обозначает благодарение. Перевод сохраняет смысл исходного текста, не привнося позднейшую литургическую терминологию и не уточняя, что именно было произнесено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Возблагодарив» выбрано как понятное и достойное контекста слово; «подал» естественно для совместной трапезы. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской практике.
