base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: ru
  text: Ведь это благовонное масло[a] можно было продать более чем за триста динариев и раздать деньги бедным». И они резко упрекали её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благовонную мазь» или «духи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сурово бранили её». Греческий глагол выражает сильное недовольство или суровое порицание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: благовонное масло
  rationale: Передаёт ароматическое масло или благовонную мазь; в данном контексте это естественное и исторически уместное русское обозначение дорогостоящего вещества.
- source_word: πραθῆναι
  choice: можно было продать
  rationale: Пассивный инфинитив при ἠδύνατο выражает нереализованную возможность; такая конструкция естественна по-русски.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: больше чем за триста динариев
  rationale: ἐπάνω с родительным суммы указывает на превышение названной цены; предлог «за» ясно выражает цену продажи.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: раздать деньги бедным
  rationale: Формально подразумевается, что бедным можно было отдать выручку от продажи. Добавление «деньги» делает референт ясным по-русски, не меняя смысла.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: они сурово бранили её
  rationale: Глагол выражает сильное недовольство, направленное на женщину, и резкое словесное порицание; «сурово бранили» сохраняет эту интенсивность.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно передаёт обоснование предыдущего возражения и сохраняет пояснительную связь.
- source_word: ἠδύνατο
  choice: можно было
  rationale: Передаёт возможность, которая не была реализована, без неестественной буквальной конструкции.
