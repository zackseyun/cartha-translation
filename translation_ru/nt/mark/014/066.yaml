lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Когда Пётр был
  rationale: Генитив абсолютный с причастием настоящего времени естественно передаётся временным придаточным, которое сохраняет фоновый, продолжающийся характер действия.
- source_word: κάτω
  choice: внизу
  rationale: Передаёт более низкое пространственное положение Петра и возможный контраст с происходящим выше в доме первосвященника.
- source_word: ἐν τῇ αὐλῇ
  choice: во дворе
  rationale: В данном контексте αὐλή означает внутренний двор при доме; «во дворе» — ясный и естественный русский эквивалент.
- source_word: ἔρχεται
  choice: пришла
  rationale: Греческое историческое настоящее в современном русском повествовании естественно передаётся прошедшим временем.
- source_word: μία τῶν παιδισκῶν
  choice: одна из служанок
  rationale: παιδίσκη может обозначать молодую домашнюю служанку или рабыню. «Служанка» естественно обозначает её роль в доме, а возможный правовой статус отмечен в сноске.
- source_word: τοῦ ἀρχιερέως
  choice: первосвященника
  rationale: Родительный падеж передаёт принадлежность к домашней челяди или связь с домом первосвященника без излишнего уточнения.
