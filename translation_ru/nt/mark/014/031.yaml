  source_fidelity: 'Основная передача точна: «ещё настойчивее говорил» удачно передаёт ἐκπερισσῶς ἐλάλει, «если мне придётся» — необходимость δέῃ, «умереть вместе с Тобой» сохраняет совместность συναποθανεῖν, а «ни за что ... не отрекусь» адекватно выражает усиленное οὐ μή. Однако «все остальные» добавляет ограничение, которого в πάντες нет: греческий текст говорит «все», без противопоставления Петру как исключённому из этой группы.'
  naturalness: Текст звучит естественно и соответствует современному литературному русскому. «Но он ещё настойчивее говорил» и «И все говорили то же самое» сохраняют повествовательную динамику и повторяемость имперфектов.
