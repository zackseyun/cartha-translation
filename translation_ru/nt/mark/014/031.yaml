base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: ru
  text: 'Но он ещё настойчивее говорил[a]: «Если мне придётся умереть вместе с Тобой, я ни за что от Тебя не отрекусь[b]». И все говорили то же самое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорил с ещё большей горячностью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «никогда от Тебя не отрекусь». В греческом тексте употреблено усиленное отрицание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: ещё настойчивее говорил
  rationale: Наречие передаёт усиление, а имперфект — продолжающуюся речь. По-русски это естественно выражает нарастающую настойчивость Петра, не сводя глагол к однократному «сказал».
- source_word: Ἐὰν δέῃ με
  choice: Если мне придётся
  rationale: δέῃ обозначает необходимость; конструкция «если мне придётся» кратко и естественно сохраняет условный характер фразы.
- source_word: συναποθανεῖν σοι
  choice: умереть вместе с Тобой
  rationale: Приставка συν- в глаголе явно выражает совместность; «вместе с Тобой» сохраняет её полнее, чем просто «умереть с Тобой».
- source_word: οὐ μή ... ἀπαρνήσομαι
  choice: ни за что ... не отрекусь
  rationale: Сочетание οὐ μή с будущим временем выражает решительное отрицание. Русское «ни за что не отрекусь» естественно передаёт силу заверения Петра.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: И все остальные говорили то же самое
  rationale: Имперфект сохранён формой «говорили», а ὡσαύτως передано через содержание речи — «то же самое». «Остальные» ясно показывает, что к Петру присоединились все другие присутствующие ученики.
theological_decisions:
- issue: Сила обещания Петра не отрекаться
  choice: ни за что от Тебя не отрекусь
  alternative: никогда от Тебя не отрекусь
  rationale: Выбранная формулировка сохраняет усиленное греческое отрицание и самоуверенную решительность Петра, не добавляя объяснения последующей повествовательной иронии.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Местоимения, обращённые к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией; это графическое решение не добавляет смыслового различия, отсутствующего в греческом тексте.
