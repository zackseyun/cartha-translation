source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: ru
  text: 'И говорит ему Иисус: «Истинно говорю тебе: сегодня, этой самой ночью, прежде чем петух пропоёт дважды, ты трижды отречёшься от Меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для Марка историческое настоящее и живость повествования.
- source_word: Ἀμὴν λέγω σοι
  choice: Истинно говорю тебе
  rationale: Торжественная формула передана естественно и вместе с тем близко к греческому строю; «истинно» выражает утвердительную силу ἀμήν.
- source_word: σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃
  choice: сегодня, этой самой ночью
  rationale: Сохранены оба временных выражения, а «самой» передаёт усилительный оттенок указательного оборота.
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: прежде чем петух пропоёт дважды
  rationale: Естественная русская конструкция точно сохраняет порядок времени и важное для Марка указание на двукратное пение петуха.
- source_word: τρίς ⸂με ἀπαρνήσῃ⸃
  choice: ты трижды отречёшься от Меня
  rationale: «Отречёшься от Меня» — точный и устойчивый русский эквивалент в данном контексте; местоимение «ты» передаёт явное и эмфатическое σὺ.
theological_decisions:
- issue: Сочетание σήμερον и ταύτῃ τῇ νυκτί
  choice: 'Сохранить оба выражения: «сегодня, этой самой ночью»'
  alternative: 'Объединить их в одно: «этой самой ночью»'
  rationale: Греческий текст намеренно ставит рядом оба обозначения времени, усиливая непосредственность предсказания; устранение одного из них обеднило бы текст.
- issue: Историческое настоящее λέγει
  choice: «говорит»
  alternative: «сказал»
  rationale: Настоящее время сохраняет повествовательную манеру Марка, не меняя смысла реплики.
- issue: Соотношение δὶς и τρίς
  choice: «дважды» и «трижды»
  alternative: «два раза» и «три раза»
  rationale: Краткие наречные формы ясно сохраняют числовое противопоставление и соответствуют достойному современному регистру.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным евангельским звучанием. Синтаксис остаётся близким к греческому, но естественным для русского читателя; архаизмы не используются.
