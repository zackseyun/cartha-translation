  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: ru
  text: 'Но если мы скажем: «От людей»? — они боялись толпы, потому что все считали, что Иоанн действительно был пророком[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Возможно также: «все считали Иоанна истинным пророком».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Но если мы скажем
  rationale: Передаёт противопоставление и условно-совещательный смысл аориста сослагательного наклонения в ходе их рассуждения, не добавляя отсутствующих в греческом пояснений.
- source_word: Ἐξ ἀνθρώπων
  choice: От людей
  rationale: Буквально сохраняет противопоставление человеческого и небесного источника крещения Иоанна; более истолковывающий вариант вынесен в сноску.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: они боялись народа
  rationale: «Народ» естественно обозначает собравшихся людей как общественную силу, реакции которой опасались вожди; несовершенный вид передаёт продолжавшееся состояние страха.
- source_word: ἅπαντες
  choice: все
  rationale: Кратко и естественно передаёт всеобщность убеждения в пределах упомянутого народа.
- source_word: εἶχον
  choice: считали
  rationale: В данной конструкции ἔχω выражает устойчивое мнение или признание; русское «считали» ясно передаёт этот смысл.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: что Иоанн действительно был пророком
  rationale: Сохраняет ὅτι как вводящее содержание убеждения и передаёт усилительное ὄντως словом «действительно», не превращая сообщение о мнении народа в отдельное авторское утверждение.
theological_decisions:
- issue: Источник крещения и полномочий Иоанна в выражении Ἐξ ἀνθρώπων
  choice: От людей
  alternative: Человеческого происхождения
  rationale: Основной вариант сохраняет образное и богословски значимое противопоставление «с небес — от людей», не разъясняя его сверх текста.
- issue: Статус утверждения об Иоанне в ὄντως ὅτι προφήτης ἦν
  choice: все считали, что Иоанн действительно был пророком
  alternative: все считали Иоанна истинным пророком
  rationale: Выбранная конструкция сохраняет утверждение внутри передаваемого мнения народа и оставляет усиление при глагольной связке; альтернативная конструкция допустима, но слегка смещает акцент на качество слова «пророк».
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым синтаксисом внутреннего рассуждения. «Народ» здесь употреблено в естественном повествовательном смысле собравшейся массы людей; пунктуация сохраняет резкий обрыв рассуждения и переход к авторскому пояснению.
