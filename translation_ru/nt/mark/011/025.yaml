source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: ru
  text: И всякий раз, когда вы стоите и молитесь, прощайте, если имеете что-либо против кого-либо, чтобы и ваш Отец, Который на небесах[a], простил вам ваши прегрешения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на небе». В греческом тексте буквально: «на небесах» — во множественном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проступки», «нарушения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: стоите
  rationale: 'Сохраняет конкретный образ принятой при молитве позы; в сочетании с ὅταν передаёт повторяющееся действие: «всякий раз, когда вы стоите».'
- source_word: προσευχόμενοι
  choice: и молитесь
  rationale: Причастие обозначает действие, одновременное со «стоите». Сочинительная конструкция естественна по-русски и не устраняет значение молитвенной позы.
- source_word: ἀφίετε
  choice: прощайте
  rationale: В контексте межличностной обиды глагол означает простить, отпустить вину; повелительное значение передано прямо.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: если имеете что-либо против кого-либо
  rationale: Сохраняет широкую неопределённость τι и τινος и естественно выражает наличие претензии или обиды на другого человека.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: ваш Отец, Который на небесах
  rationale: Передаёт определительную конструкцию и сохраняет множественное число οὐρανοῖς, не заменяя его толковательным выражением «Небесный Отец».
- source_word: ἀφῇ
  choice: простил
  rationale: Форма после ἵνα передаёт цель или предполагаемый результат; русское сослагательное значение выражается союзом «чтобы». Частица καί сохранена как «и».
- source_word: παραπτώματα
  choice: прегрешения
  rationale: Слово обозначает проступки, нарушения или прегрешения. Выбранный вариант уместен в контексте Божьего прощения и не сводит термин без пояснения к более общему «грехи».
theological_decisions:
- issue: Связь между прощением людей и прощением со стороны Бога
  choice: 'Сохранена прямая целевая связь: «прощайте… чтобы и ваш Отец… простил».'
  alternative: Ослабить связь, представив прощение других лишь признаком уже полученного Божьего прощения.
  rationale: Конструкция ἵνα… ἀφῇ прямо связывает повеление прощать с прощением Отца. Перевод сохраняет эту богословскую напряжённость, не разрешая её посредством привнесённой системы толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Формула «стоите и молитесь» сохраняет образ позы, но звучит естественнее буквального причастного оборота. Местоимение «вы» добавлено лишь там, где оно необходимо для плавности; обращение остаётся во множественном числе.
