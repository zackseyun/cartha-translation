  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: повторяющееся обстоятельство ὅταν («всякий раз, когда»), образ молитвы стоя (στήκετε προσευχόμενοι), повеление прощать, неопределённую широту «что-либо против кого-либо», целевую связь ἵνα и множественное число «на небесах». «Простил» после «чтобы» корректно выражает сослагательно-целевое значение ἀφῇ в современном русском.'
  naturalness: Фраза звучит естественно и литературно. Сочетание «стоите и молитесь» несколько менее формально, чем деепричастное «стоя молитесь», но хорошо передаёт одновременность действий и сохраняет конкретный образ позы. «Прегрешения» уместно в возвышенном, но понятном библейском регистре.
  terminology: «Отец», «прощайте» и «прегрешения» согласованы по регистру и не навязывают конфессионального истолкования. «На небесах» верно сохраняет множественное число τοῖς οὐρανοῖς. Сноски стоят у соответствующих слов и предлагают допустимые лексические варианты.
