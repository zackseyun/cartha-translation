  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: ru
  text: 'В ответ Иисусу они сказали: «Не знаем». Иисус сказал им: «И Я не скажу вам, какой властью Я это делаю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: ответили
  rationale: Русское личное сказуемое естественно передаёт греческий причастный оборот, вводящий ответ собеседников.
- source_word: λέγουσιν / λέγει / λέγω
  choice: ответили / сказал / скажу
  rationale: В русском повествовании прошедшее время звучит естественнее греческого исторического настоящего; в последней реплике будущее «не скажу» идиоматично выражает отказ сообщить ответ.
- source_word: Οὐκ οἴδαμεν
  choice: Не знаем
  rationale: Кратко и точно передаёт отрицание знания с настоящим значением.
- source_word: Οὐδὲ ἐγὼ
  choice: И Я не
  rationale: 'Сохраняет ответную симметрию: поскольку они не отвечают, Иисус также отказывается отвечать.'
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: какой властью
  rationale: Творительный падеж естественно выражает основание или полномочие, с которым совершается действие, не добавляя толкования.
- source_word: ταῦτα ποιῶ
  choice: Я это делаю
  rationale: Русское собирательное «это» естественно отсылает к действиям Иисуса, обозначенным греческим нейтральным множественным ταῦτα.
