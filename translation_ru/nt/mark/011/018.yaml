base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: ru
  text: 'Первосвященники и книжники услышали об этом и искали, как бы погубить Его[a], потому что боялись Его: ведь вся толпа изумлялась Его учению.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убить Его» или «предать смерти». Греческий глагол может иметь более широкое значение «погубить», хотя в данном контексте подразумевается смертельный замысел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: услышали об этом
  rationale: Глагол допускает значения «услышали» и «узнали». Добавленное «об этом» естественно отсылает к предшествующим действиям и словам Иисуса в храме, не уточняя их сверх текста.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение группы представителей высшего храмового священства; форма множественного числа здесь обозначает не нескольких одновременно служивших верховных первосвященников, а священническую верхушку.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшийся и достаточно понятный евангельский термин для знатоков и толкователей Писания и Закона; более разъяснительные варианты были бы уже интерпретацией.
- source_word: ἐζήτουν πῶς
  choice: стали искать способ
  rationale: Передаёт продолженное и целенаправленное обдумывание того, каким образом осуществить намерение; по-русски естественнее буквального «искали, как».
- source_word: ἀπολέσωσιν
  choice: погубить Его
  rationale: «Погубить» сохраняет широкий смысл ἀπόλλυμι и вместе с тем в данном контексте естественно подразумевает смертельное намерение, не сводя значение глагола исключительно к прямому «убить».
- source_word: ἐφοβοῦντο
  choice: боялись Его
  rationale: Передаёт продолжающийся страх руководителей перед Иисусом, в контексте связанный с воздействием Его учения на народ.
- source_word: πᾶς ὁ ὄχλος
  choice: весь народ
  rationale: В храмовой сцене «весь народ» звучит по-русски естественнее, чем «вся толпа», и сохраняет собирательную, усилительную силу выражения, не предполагая буквально каждого человека.
- source_word: ἐξεπλήσσετο
  choice: изумлялся
  rationale: Передаёт сильное и продолжающееся впечатление от учения Иисуса; «изумлялся» соответствует достоинству библейского повествования и остаётся понятным современному читателю.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: Его учению
  rationale: Творительное управление русского глагола «изумляться» естественно выражает основание или повод реакции, обозначенный ἐπί с дательным.
theological_decisions:
- issue: Объём намерения руководителей в ἀπολέσωσιν
  choice: «погубить Его» с примечанием о возможном «убить»
  alternative: «убить Его» / «предать Его смерти»
  rationale: Контекст явно указывает на смертельный замысел, однако сам греческий глагол шире прямого обозначения убийства. Основной текст сохраняет эту лексическую широту, а примечание поясняет подразумеваемый в контексте смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной евангельской терминологией («первосвященники», «книжники»). Синтаксис упрощён до естественного русского порядка, при этом причинная связь и напряжение исходного текста сохранены. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
