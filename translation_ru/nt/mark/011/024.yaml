  verdict: revise
  source_fidelity: 'Основная синтаксическая связь и оба глагола προσεύχεσθε καὶ αἰτεῖσθε переданы точно: «обо всём, о чём молитесь и чего просите». Будущее ἔσται ὑμῖν удачно сохранено как «это будет у вас», без сглаживания парадоксальной последовательности. Однако «уже» не выражено непосредственно аористом ἐλάβετε: совершенный вид «получили» достаточно передаёт завершённость действия, тогда как «уже» добавляет более определённый временной оттенок.'
