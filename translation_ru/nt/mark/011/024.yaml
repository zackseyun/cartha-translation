  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: ru
  text: 'Поэтому говорю вам: обо всём, о чём молитесь и чего просите, верьте, что получили это, — и это будет у вас.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим наставлением о вере и молитве.
- source_word: πάντα ὅσα
  choice: обо всём
  rationale: Сохраняет всеохватность греческого выражения и позволяет построить понятную современную русскую фразу.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: молитесь и просите
  rationale: 'Оба глагола переданы отдельно: первый обозначает молитву, второй — выраженную в ней просьбу.'
- source_word: πιστεύετε
  choice: верьте
  rationale: Прямо вводит содержание веры, выраженное далее придаточным с ὅτι.
- source_word: ἐλάβετε
  choice: уже получили
  rationale: Совершенный вид передаёт завершённость аориста, а «уже» ясно сохраняет намеренно парадоксальное соотношение с последующим будущим временем.
- source_word: ἔσται ὑμῖν
  choice: это будет у вас
  rationale: Близко передаёт греческую конструкцию принадлежности, не превращая обещание в повторное «получите» и не добавляя отсутствующий в тексте пассив «будет дано».
theological_decisions:
- issue: Временное соотношение веры и исполнения молитвы
  choice: «верьте, что уже получили это, — и это будет у вас»
  alternative: «верьте, что получаете это, — и это будет у вас»
  rationale: Основной текст SBLGNT содержит аорист ἐλάβετε. Перевод сохраняет напряжение между уже совершившимся получением в вере и будущим обладанием, не объясняя его в рамках какой-либо богословской системы.
translation_notes:
  register: Современный литературный русский язык; обращение звучит прямо и авторитетно, но без архаизмов. Двоеточие и тире помогают ясно передать ход мысли и сохранить парадокс греческих временных форм.
