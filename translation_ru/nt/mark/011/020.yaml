  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: ru
  text: И рано утром, проходя мимо, они увидели, что смоковница засохла до самых корней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: проходя мимо
  rationale: Причастие настоящего времени передаёт фоновое действие, одновременное с основным глаголом; русский деепричастный оборот естественно сохраняет эту связь.
- source_word: πρωῒ
  choice: рано утром
  rationale: Наречие указывает на раннее утреннее время; формулировка кратка и естественна для современного русского языка.
- source_word: εἶδον
  choice: они увидели
  rationale: Прямо передаёт аорист глагола зрительного восприятия без добавочного значения «заметили».
- source_word: συκῆν
  choice: смоковница
  rationale: Традиционное и точное русское название фигового дерева в библейском повествовании.
- source_word: ἐξηραμμένην
  choice: засохла
  rationale: Передаёт результирующее состояние дерева, выраженное перфектным страдательным причастием, естественным русским глаголом состояния.
- source_word: ἐκ ῥιζῶν
  choice: до самых корней
  rationale: В данном контексте естественно передаёт полноту засыхания, затронувшего дерево вплоть до корней, не вводя лишней пространственной направленности.
