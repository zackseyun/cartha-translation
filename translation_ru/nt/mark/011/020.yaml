  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: временное указание «рано утром» (πρωῒ), фоновое действие «проходя мимо» (παραπορευόμενοι), восприятие «они увидели» (εἶδον), смоковницу и её результирующее состояние засыхания. Оборот «до самых корней» идиоматически передаёт ἐκ ῥιζῶν в данном контексте — засыхание, охватившее дерево вплоть до корней.'
