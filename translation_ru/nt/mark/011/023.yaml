  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: ru
  text: 'Истинно говорю вам: кто скажет этой горе: «Поднимись и будь брошена в море», — и не усомнится в своём сердце[a], но поверит, что сказанное им сбывается[b], тому так и будет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поколеблется» или «не будет раздвоен внутри себя»; греческий глагол может обозначать как сомнение, так и внутреннее раздвоение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что сказанное им происходит» или «осуществляется». В греческом здесь стоит настоящее время («сбывается», «происходит») перед предложением о будущем результате.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную формулу заверения и звучит естественно в современном литературном русском.
- source_word: ὃς ἂν εἴπῃ
  choice: кто скажет
  rationale: Передаёт неопределённо-обобщающее условие без излишней модальности.
- source_word: τῷ ὄρει τούτῳ
  choice: этой горе
  rationale: Сохраняет значение «гора» и указательное местоимение, придающее образу непосредственность.
- source_word: Ἄρθητι καὶ βλήθητι
  choice: Поднимись и бросься
  rationale: Передаёт последовательный образ поднятия с места и броска в море; русские возвратные повелительные формы естественно выражают греческие пассивные императивы в обращении к неодушевлённому предмету.
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: не усомнится в своём сердце
  rationale: «Усомнится» ясно передаёт контекстуальный смысл внутреннего сомнения, а «в своём сердце» сохраняет библейскую антропологическую образность.
- source_word: πιστεύῃ
  choice: поверит
  rationale: Сохраняет прямое значение веры/убеждённости и согласуется с условной конструкцией по-русски.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: что сказанное им сбывается
  rationale: «Сбывается» сохраняет настоящее время γίνεται и естественно относится к произнесённому слову; конструкция не превращена в явно будущую.
- source_word: ἔσται αὐτῷ
  choice: тому так и будет
  rationale: Передаёт открытый по формулировке будущий результат, не уточняя его механизм.
theological_decisions:
- issue: Характер обещания о вере и произнесённом слове
  choice: Сохранить прямую условную форму и силу образа без добавочных оговорок.
  alternative: Свести высказывание только к гиперболе либо представить его как безусловное обещание исполнения любого желания.
  rationale: Сам стих не формулирует дальнейших систематических ограничений; перевод сохраняет напряжение текста и ничего к нему не добавляет.
- issue: Мужской род αὐτοῦ / αὐτῷ при обобщающем субъекте
  choice: Передать обобщающей конструкцией «кто… в своём сердце… тому».
  alternative: Использовать множественное число или явно гендерно-нейтральную перестройку.
  rationale: Русская конструкция сохраняет грамматическое единственное число и соответствующую исходнику обобщающую форму.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис ясен для широкого читателя; традиционная формула «Истинно говорю вам» сохранена как узнаваемая и не архаичная. Все сноски отмечены в основном тексте.
