source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: ru
  text: 'И если кто-нибудь спросит вас: «Зачем вы это делаете?» — скажите: «Он нужен Господу[a], и Он тотчас отошлёт его обратно сюда[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяину» или «господину». Греческое κύριος может означать «Господь», «господин» или «хозяин»; здесь в основном тексте оно передано как титул в соответствии с контекстом Евангелия.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «и Он тотчас отсылает его обратно сюда». В греческом тексте глагол стоит в настоящем времени, которое здесь может живо изображать будущее действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: если кто-нибудь спросит вас
  rationale: Сочетание ἐάν с аористом сослагательного наклонения выражает открытое условие, относящееся к будущему. В данном контексте εἴπῃ естественно передаётся глаголом «спросит», поскольку далее следует вопрос.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Зачем вы это делаете?
  rationale: В этой вопросительной реплике τί оспаривает или выясняет основание действия; «Зачем вы это делаете?» естественно передаёт смысл, не прибегая к буквализму «Что вы делаете это?».
- source_word: εἴπατε
  choice: скажите
  rationale: Аорист повелительного наклонения во множественном числе передан прямой и нейтральной формой повеления.
- source_word: Ὁ κύριος αὐτοῦ χρείαν ἔχει
  choice: Он нужен Господу
  rationale: Русская конструкция естественно передаёт буквальный смысл «Господь имеет нужду в нём». Местоимение «он» согласовано с упомянутым ранее ослёнком и не обезличивает животное.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Слово сохраняет характерную для Марка непосредственность действия и соответствует достоинству повествовательного регистра.
- source_word: ἀποστέλλει
  choice: отошлёт
  rationale: Хотя греческая форма стоит в настоящем времени, в данном условно-будущем контексте она естественно понимается как настоящее с будущим значением. Русское совершенное будущее передаёт ожидаемый результат.
- source_word: πάλιν ὧδε
  choice: обратно сюда
  rationale: πάλιν при глаголе отправления означает возвращение, а ὧδε указывает на место говорящего; сочетание «обратно сюда» ясно сохраняет оба элемента.
theological_decisions:
- issue: Значение и референт κύριος
  choice: Господь
  alternative: хозяин / господин
  rationale: В контексте Евангелия слово естественно относится к Иисусу и сохраняет титульную силу. При этом лексически возможно обычное значение «хозяин» или «господин», поэтому оно отмечено в сноске без навязывания более узкого толкования.
- issue: Подлежащее при ἀποστέλλει
  choice: В русском тексте подлежащее не выражено явно
  alternative: явно назвать человека, задавшего вопрос, либо Господа
  rationale: Греческий глагол не называет подлежащее отдельным словом. Русская неопределённость позволяет не разрешать насильно вопрос о том, кто именно отошлёт ослёнка, хотя ближайший контекст обычно указывает на человека, остановившего учеников.
translation_notes:
  register: Современный литературный русский язык с ясной прямой речью и умеренно возвышенной библейской лексикой. «Тотчас» сохраняет марковскую динамику, а естественный порядок слов «Он нужен Господу» избегает тяжеловесной кальки. Неявное подлежащее последнего глагола сохраняет грамматическую неоднозначность исходного текста.
