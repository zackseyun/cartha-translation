base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: ru
  text: 'И те, кто шёл впереди, и те, кто шёл следом, кричали: «Осанна![a] Благословен Грядущий во имя Господа!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Осанна» — древнееврейско-арамейский богослужебный возглас, первоначально означавший примерно «спаси же» или «спаси сейчас»; здесь он звучит также как хвала.
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с Псалмом 117:26 (в иной нумерации — 118:26).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: те, кто шёл впереди
  rationale: Субстантивированное причастие настоящего времени обозначает людей впереди Иисуса в движущейся процессии; формулировка естественна по-русски и передаёт продолжающееся действие.
- source_word: οἱ ἀκολουθοῦντες
  choice: те, кто следовал за Ним
  rationale: Параллельное субстантивированное причастие обозначает людей, двигавшихся позади Иисуса. Местоимение проясняет естественный для контекста объект следования, не меняя смысла.
- source_word: ἔκραζον
  choice: восклицали
  rationale: Имперфект передаёт продолжавшиеся или повторявшиеся возгласы; «восклицали» сохраняет публичный и торжественный характер происходящего.
- source_word: Ὡσαννά
  choice: Осанна
  rationale: Сохраняется укоренившаяся литургическая транслитерация древнееврейско-арамейского возгласа; его исходное просительное значение пояснено в сноске.
- source_word: Εὐλογημένος
  choice: Благословен
  rationale: Точно передаёт пассивное причастие в формуле благословения и сохраняет узнаваемую связь с Псалмом 117:26 по принятой в русской традиции нумерации.
- source_word: ὁ ἐρχόμενος
  choice: Грядущий
  rationale: Субстантивированное причастие с артиклем передано ёмким и традиционно понятным библейским выражением. Оно сохраняет возможную титульную окраску, не добавляя прямо слов «Мессия» или «царь».
- source_word: ἐν ὀνόματι κυρίου
  choice: во имя Господа
  rationale: Сохраняет библейскую формулу и её смысл — приход с властью и как представитель Господа — без пояснительной подстановки в основной текст.
- source_word: κυρίου
  choice: Господа
  rationale: κύριος в формуле псалма передано стандартным библейским соответствием «Господь».
theological_decisions:
- issue: Следует ли прямо обозначить мессианскую идентичность Грядущего
  choice: Сохранить формулу «Благословен Грядущий во имя Господа» без добавления «Мессия» или «царь».
  alternative: «Благословен Мессия, грядущий во имя Господа».
  rationale: В контексте возглас имеет мессианское значение, однако греческий текст не содержит здесь явного титула «Мессия» или «царь». Цитатная формулировка сохраняет богословскую напряжённость и не вносит толкование в текст.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. «Грядущий» и «во имя Господа» сохраняют цитатный характер возгласа; синтаксис первой части остаётся ясным и естественным.
