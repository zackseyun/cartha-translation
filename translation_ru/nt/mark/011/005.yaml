  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: ru
  text: 'И некоторые из стоявших там спрашивали их: «Что вы делаете, отвязывая ослёнка?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες
  choice: некоторые
  rationale: Сохраняет неопределённое указание на часть присутствовавших.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: из стоявших там
  rationale: Естественно и близко передаёт субстантивированное причастие совершенного вида с наречием ἐκεῖ.
- source_word: ἔλεγον
  choice: спросили
  rationale: В данном контексте глагол речи вводит прямой вопрос; русский совершенный вид естественно описывает речевой акт, хотя формально греческий имперфект допускает «говорили».
- source_word: Τί ποιεῖτε λύοντες
  choice: Что вы делаете? Зачем отвязываете
  rationale: Греческая конструкция буквально спрашивает «Что вы делаете, отвязывая…?»; разделение на два естественных русских вопроса ясно передаёт возражение, но добавочное «зачем» несколько раскрывает прагматический смысл.
- source_word: τὸν πῶλον
  choice: молодого осла
  rationale: πῶλος обозначает молодое животное; контекст повествования определяет его как осла. Такой вариант современнее и понятнее неоднозначного русского «жеребёнок».
