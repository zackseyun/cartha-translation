  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: ru
  text: Они сказали им так, как сказал Иисус, и те отпустили их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволили им уйти». Греческий глагол может означать «позволить», «отпустить» или «освободить»; здесь эти люди больше не препятствуют ученикам увести ослёнка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Они
  rationale: Субстантивированное οἱ указывает на учеников из ближайшего контекста; δέ служит связкой в повествовании и не требует отдельной передачи по-русски.
- source_word: εἶπαν αὐτοῖς
  choice: ответили им
  rationale: Хотя буквально это «сказали им», в контексте ученики отвечают на заданный им вопрос; «ответили» естественно передаёт речевое действие.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: так, как велел Иисус
  rationale: καθώς выражает соответствие. Здесь εἶπεν отсылает к предварительному указанию Иисуса, что именно ученикам надлежит сказать, поэтому «велел» ясно и естественно передаёт контекст, не добавляя содержания.
- source_word: ἀφῆκαν αὐτούς
  choice: те позволили им уйти
  rationale: ἀφίημι здесь означает перестать препятствовать, позволить ученикам продолжить действие. Явное «те» устраняет возможную для русского языка путаницу между двумя группами, а «уйти» идиоматически выражает разрешение продолжить путь с ослёнком.
