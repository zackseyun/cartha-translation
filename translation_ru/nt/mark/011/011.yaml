  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: ru
  text: И вошёл Он в Иерусалим, на территорию храма[a]. Осмотрев всё вокруг, Он, поскольку было уже поздно[b], вышел и отправился в Вифанию с двенадцатью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на территорию храмового комплекса, а не во внутреннее святилище.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «так как час был уже поздний»; возможно также: «когда было уже поздно».'
    reason: lexical_alternative
  - marker: c
    text: То есть с двенадцатью учениками.
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Аорист εἰσέρχομαι обозначает вход; «вошёл» естественно передаёт повествовательное движение.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: τὸ ἱερόν
  choice: на территорию храма
  rationale: Ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище (ναός); выбранная формулировка ясно передаёт пространственный смысл.
- source_word: περιβλεψάμενος πάντα
  choice: осмотрев всё вокруг
  rationale: Причастие выражает охватывающий взгляд по сторонам; деепричастная конструкция сохраняет последовательность действий и звучит естественно по-русски.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: поскольку было уже поздно
  rationale: Генитив абсолютный задаёт временное обстоятельство с возможным причинным оттенком; «поскольку» сохраняет связь с последующим уходом.
- source_word: ἐξῆλθεν εἰς Βηθανίαν
  choice: вышел и отправился в Вифанию
  rationale: Греческое выражение буквально описывает выход по направлению к Вифании; добавление «отправился» делает направление назначения ясным и естественным на русском.
- source_word: μετὰ τῶν δώδεκα
  choice: с двенадцатью
  rationale: Сохраняется числительное греческого текста без превращения его в формальный титул; подразумеваемый круг учеников пояснён в сноске.
theological_decisions:
- issue: Значение τὸ ἱερόν
  choice: территория храма, то есть храмовый комплекс
  alternative: храм
  rationale: Так сохраняется различие между ἱερόν, обозначающим весь комплекс, и ναός, обозначающим внутреннее святилище, без излишнего уточнения конкретного двора.
- issue: Обозначение группы οἱ δώδεκα
  choice: двенадцать, со строчной буквы
  alternative: Двенадцать как закреплённое наименование группы
  rationale: В греческой рукописной традиции современное различие прописных и строчных не определяет статус выражения; строчная буква сохраняет простую числовую форму, а сноска уточняет референт.
- issue: Связь ὀψὲ ἤδη οὔσης τῆς ὥρας с уходом
  choice: 'временно-причинная: «поскольку было уже поздно»'
  alternative: 'чисто временная: «когда было уже поздно»'
  rationale: Конструкция допускает обстоятельственный временной смысл, однако контекст естественно связывает поздний час с уходом; перевод не усиливает причинность сверх значения «поскольку».
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный стиль. Местоимение «Он» написано с прописной буквы как традиционный русский знак уважения к Иисусу, без изменения содержания исходного текста. Формулировка «на территорию храма» одновременно понятна широкому читателю и точнее простого «в храм».
