  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: ru
  text: 'Иисус же сказал им: «Я задам вам один вопрос[a]. Ответьте мне, и я скажу вам, какой властью я всё это делаю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я спрошу вас об одном деле»; букв. «одно слово».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкое противопоставление и ответный поворот повествования, не усиливая связь до резкого «но».
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Принятая в русском библейском и литературном употреблении форма имени.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямое и естественное соответствие повествовательной формуле.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Я задам вам
  rationale: В сочетании со словом «вопрос» естественно передаёт будущее время и намерение задать встречный вопрос.
- source_word: ἕνα λόγον
  choice: один вопрос
  rationale: В контексте λόγος обозначает то, на что требуется ответ; «один вопрос» ясно передаёт смысл, а буквальная образность отмечена в сноске.
- source_word: ἀποκρίθητέ μοι
  choice: Ответьте Мне
  rationale: Сохраняет прямую повелительную форму и обращённость ответа к Иисусу.
- source_word: ἐρῶ ὑμῖν
  choice: Я скажу вам
  rationale: Точно и естественно передаёт обещание сообщить ответ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: какой властью
  rationale: Сохраняет вопрос об основании и правомочности действий Иисуса, не сводя ἐξουσία лишь к силе или способности.
- source_word: ταῦτα ποιῶ
  choice: Я всё это делаю
  rationale: «Всё это» естественно передаёт множественное указательное ταῦτα, а настоящее время сохранено.
theological_decisions:
- issue: Значение ἐξουσία в споре с руководителями храма
  choice: власть
  alternative: право; полномочие; сила
  rationale: «Власть» удерживает одновременно смысл правомочности и авторитетного основания действий Иисуса; «сила» чрезмерно подчёркивала бы способность, а «право» или «полномочие» сужали бы выражение до юридического или делегированного статуса.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Порядок «Иисус же» сохраняет ответный поворот греческого δὲ. Длинная греческая цепочка с καὶ разделена на два предложения ради ясности, при этом повеление и последующее обещание сохранены.
