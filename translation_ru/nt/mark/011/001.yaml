  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: ru
  text: Когда они приближались к Иерусалиму — к Виффагии и Вифании, у Масличной горы[a], — Он посылает[b] двух Своих учеников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие предлоги допускают и более буквальную передачу: «к Виффагии и Вифании, по направлению к Масличной горе». Пространственная связь названных мест выражена сжато.'
    reason: lexical_alternative
  - marker: b
    text: 'Марк употребляет здесь историческое настоящее — «посылает»; по-русски возможно также: «послал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: приближались
  rationale: Настоящее время оригинала выполняет повествовательную функцию; русское несовершенное прошедшее естественно передаёт продолжающееся приближение и вводит сцену.
- source_word: εἰς Ἱεροσόλυμα
  choice: к Иерусалиму
  rationale: При ἐγγίζω предлог указывает место, к которому приближаются; русское «приближаться к» точно и естественно.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: к Виффагии и Вифании
  rationale: Повтор предлога сохранён, чтобы не устранять неоднозначность пространственной связи этих селений с маршрутом к Иерусалиму.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: у Масличной горы
  rationale: В данном контексте πρός может обозначать близость или пространственную соотнесённость; «у» естественно передаёт местоположение, не делая движение к горе обязательным.
- source_word: ἀποστέλλει
  choice: посылает
  rationale: Сохранено историческое настоящее Марка, придающее повествованию живость.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: двух Своих учеников
  rationale: 'Естественная русская передача партитивной конструкции: двое из группы учеников, принадлежащих к ближайшему кругу Иисуса.'
- source_word: Βηθφαγὴ
  choice: Виффагия
  rationale: Употреблена закрепившаяся в русской библейской традиции форма топонима.
- source_word: Βηθανίαν
  choice: Вифания
  rationale: Употреблена закрепившаяся в русском языке форма топонима.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Масличная гора
  rationale: Общепринятое русское название места, передающее смысл греческого сочетания.
