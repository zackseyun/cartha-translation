  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: ru
  text: Крещение Иоанна было с небес[a] или от людей[b]? Ответьте Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Бога». Буквально по-гречески: «с неба (небес)» — иудейское выражение, указывающее на божественное происхождение или полномочие.'
    reason: lexical_alternative
  - marker: b
    text: То есть от людей, имеющее лишь человеческое происхождение или полномочие.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: Крещение Иоанна
  rationale: Родительный падеж естественно обозначает крещение, связанное с Иоанном; русское сочетание звучит ясно и сохраняет форму оригинала.
- source_word: ἐξ οὐρανοῦ
  choice: с небес
  rationale: Сохраняется иудейское почтительное обозначение божественного происхождения или полномочия без подстановки толкования «от Бога» в основной текст.
- source_word: ἐξ ἀνθρώπων
  choice: от людей
  rationale: Передаёт общий смысл ἀνθρώπων и ясно противопоставляет человеческий источник или полномочие небесному.
- source_word: ἀποκρίθητέ μοι
  choice: Ответьте Мне
  rationale: Повелительная форма требует прямого ответа; множественное число соответствует обращению к группе собеседников.
- source_word: ἦν ἢ
  choice: было ... или ...?
  rationale: Сохраняет конструкцию с глаголом «быть» и указанием происхождения, оставаясь естественной по-русски.
theological_decisions:
- issue: Смысл выражения «с небес»
  choice: Сохранить в основном тексте выражение «с небес» как указание на божественное происхождение или полномочие.
  alternative: от Бога
  rationale: Так сохраняются и исходная иудейская идиома, и риторическая напряжённость вопроса, без внесения поясняющего толкования непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык; речь краткая и требовательная. Заглавная буква в «Мне» соответствует принятому в русском библейском изложении уважительному обозначению Иисуса. Формула «с небес» сохраняет исходную идиому, а примечания разъясняют обе стороны противопоставления.
