  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: ru
  text: 'И Пётр, вспомнив, говорит Ему: «Равви! Посмотри: смоковница, которую Ты проклял, засохла[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высохла». Греческий глагол может означать высыхание или увядание; форма перфекта подчёркивает сохраняющийся результат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: вспомнив
  rationale: Деепричастие естественно передаёт аористное причастие и связывает воспоминание Петра с его последующими словами.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для повествования Марка историческое настоящее и его живость.
- source_word: αὐτῷ
  choice: Ему
  rationale: Сохранено местоимение исходного текста; из контекста ясно, что речь обращена к Иисусу.
- source_word: Ῥαββί
  choice: Равви
  rationale: Транслитерированный титул сохраняет иудейский контекст и прямую форму обращения.
- source_word: ἴδε
  choice: Посмотри
  rationale: Современная и естественная передача повелительной формы, привлекающей внимание к увиденному.
- source_word: συκῆ
  choice: смоковница
  rationale: Существительное обозначает здесь дерево; «смоковница» — точный и устойчивый русский эквивалент.
- source_word: κατηράσω
  choice: Ты проклял
  rationale: Прямая и естественная передача формы второго лица единственного числа и совершившегося ранее действия.
- source_word: ἐξήρανται
  choice: засохла
  rationale: Глагол указывает на высыхание или увядание, а перфект подчёркивает наличный результат; «засохла» естественно употребляется о дереве и передаёт достигнутое состояние.
