  to: 'И в ответ Он сказал ей: «Пусть никто никогда впредь не ест от тебя плода»[b]. И ученики Его слышали это[c].'
  rationale: Заменён менее естественный и семантически неточный деепричастный оборот «отозвавшись» на «в ответ», что лучше передаёт греческий нарративный идиоматизм. Усиление «никогда впредь» естественно выражает сочетание μηκέτι с εἰς τὸν αἰῶνα, не превращая оптатив в предсказание. Уточнены формулировки сносок b и c. Сноска a сохранена как пояснение к передаче ἀποκριθείς, хотя в основном тексте её маркер не требуется; для структурной согласованности с предоставленным набором сносок она приводится полностью.
