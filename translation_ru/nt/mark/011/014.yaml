base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: ru
  text: 'И в ответ Он сказал ей: «Пусть никто никогда впредь не ест от тебя плода»[b]. И ученики Его слышали это[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «Пусть никто больше не ест от тебя плода вовек». Греческое выражение буквально: «в век»; в данном контексте оно означает «навсегда».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «И ученики Его слушали». Греческий имперфект может подчёркивать продолжающееся восприятие; также возможен перевод: «услышали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: отозвавшись
  rationale: Сохраняет значение «ответить/отозваться» и характерный греческий повествовательный оборот, хотя перед этим не приведено словесной реплики.
- source_word: αὐτῇ
  choice: ей
  rationale: Местоимение согласовано с подразумеваемым русским существительным «смоковница», которое, как и греческое συκῆ, женского рода.
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: никто и никогда больше не
  rationale: Естественно передаёт сочетание «больше не» с идиомой «вовек», выражая окончательное прекращение.
- source_word: ἐκ σοῦ
  choice: от тебя
  rationale: Сохраняет прямое обращение Иисуса к дереву во втором лице.
- source_word: μηδεὶς
  choice: никто
  rationale: Прямое и ясное соответствие отрицательному местоимению в формуле пожелания.
- source_word: καρπὸν
  choice: плода
  rationale: Родительный падеж после отрицания естественен в литературном русском и передаёт родовое значение единственного числа.
- source_word: φάγοι
  choice: пусть ... не ест
  rationale: Передаёт волитивную силу аористного оптатива как провозглашённое пожелание, а не как простое предсказание.
- source_word: ἤκουον
  choice: слышали это
  rationale: Русский несовершенный вид сохраняет значение имперфекта; добавленное «это» естественно обозначает содержание услышанного, не меняя смысла.
- source_word: μαθηταὶ αὐτοῦ
  choice: ученики Его
  rationale: Достоинственная и понятная передача притяжательной конструкции.
theological_decisions:
- issue: Характер слов Иисуса, обращённых к смоковнице
  choice: 'Передать как волитивное провозглашение: «Пусть никто и никогда больше не ест...»'
  alternative: 'Предсказательное утверждение: «Никто больше никогда не будет есть...»'
  rationale: Оптатив φάγοι выражает пожелание или изречение суда, а не обычное сообщение о будущем; перевод сохраняет эту грамматическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет заметную повествовательную форму оригинала, но остаётся понятным обычному читателю. Местоимение «ей» естественно соотносится со смоковницей из контекста.
