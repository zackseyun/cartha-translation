source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: ru
  text: Но[a] если вы не прощаете, то и Отец ваш, Который на небесах, не простит ваших проступков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в древнейших греческих рукописях, включая Синайский и Ватиканский кодексы IV века, а также в ранних коптских переводах; однако он присутствует в византийской традиции большинства рукописей, латинской традиции и большинстве сирийских рукописей. Вероятно, позднейшие переписчики добавили его для согласования со словами Иисуса в Матфея 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: прощать / простить
  rationale: В контексте человеческих обид и Божьего суда глагол означает освобождение от вины; «прощать» — естественный и точный русский эквивалент.
- source_word: παράπτωμα
  choice: проступки
  rationale: Передаёт образ отклонения от должного и сохраняет отличие от более общего слова «грех», не создавая при этом неестественного звучания.
theological_decisions:
- issue: Связь прощения со стороны людей и прощения Отца
  choice: Сохранена прямая условная формулировка без поясняющего смягчения
  alternative: Истолковать человеческое прощение как признак уже полученного Божьего прощения
  rationale: Греческий текст прямо утверждает следствие и сам не разъясняет его богословский механизм; перевод не должен разрешать эту напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Отец ваш, Который на небесах» близко передаёт греческую относительную конструкцию; заглавная буква в «Который» соответствует русской издательской традиции при местоименных обозначениях Бога.
