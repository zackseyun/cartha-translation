  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: ru
  text: И снова они пришли в Иерусалим. Когда Иисус ходил по храмовым дворам[a], к Нему подошли первосвященники, книжники и старейшины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме» или «на территории храма». Греческое слово обозначает весь храмовый комплекс, а не только внутреннее святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: пришли
  rationale: Историческое настоящее передано естественным для русского повествования прошедшим временем.
- source_word: πάλιν
  choice: снова
  rationale: Наречие указывает на повторное прибытие в Иерусалим.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: ἐν τῷ ἱερῷ
  choice: по храму
  rationale: Ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; при глаголе движения русское «ходил по храму» звучит естественно, а примечание уточняет пространственный смысл.
- source_word: περιπατοῦντος αὐτοῦ
  choice: Когда Иисус ходил
  rationale: Генитив абсолютный передаёт фоновое продолжающееся действие. Имя «Иисус» употреблено вместо местоимения для ясности по-русски без изменения референта.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Во множественном числе термин обозначает высших представителей священнической власти; это устоявшийся русский библейский эквивалент.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Прямой и традиционно понятный эквивалент, сохраняющий общественно-религиозное наименование без сужения до одной функции учителей закона.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: В данном институциональном контексте речь идёт о признанных руководителях народа, а не просто о пожилых мужчинах.
- source_word: πρὸς αὐτόν
  choice: к Нему подошли
  rationale: Передаёт направленное движение к Иисусу и естественно сочетается с русским глаголом «подошли».
theological_decisions:
- issue: Передача ἱερόν
  choice: храм с пояснением о храмовом комплексе
  alternative: храмовые дворы; территория храма
  rationale: Формулировка не отождествляет место действия с внутренним святилищем и сохраняет широкий пространственный смысл греческого слова. Решение носит лексико-пространственный, а не конфессиональный характер.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Синтаксис упрощён для естественного чтения; повтор союза καί перед второй сценой не воспроизведён механически. Местоимение «Нему» оформлено с прописной буквы в соответствии с распространённой русской издательской традицией.
