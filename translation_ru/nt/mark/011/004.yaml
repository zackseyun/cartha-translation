lexical_decisions:
- source_word: ἀπῆλθον
  choice: пошли
  rationale: Аорист ἀπέρχομαι обозначает уход с места, где Иисус дал поручение; «пошли» естественно передаёт начало их пути в русском повествовании.
- source_word: εὗρον
  choice: нашли
  rationale: Обычное и точное соответствие εὑρίσκω в повествовательном контексте.
- source_word: πῶλον
  choice: ослёнка
  rationale: Хотя πῶλος сам по себе означает молодое ездовое животное, ближайший контекст (Мк. 11:2) позволяет естественно обозначить его как ослёнка, не утяжеляя русский текст менее ясным словом «жеребёнок».
- source_word: δεδεμένον
  choice: привязанного
  rationale: Перфектное страдательное причастие описывает наличное состояние животного; «привязанного» конкретно и естественно по-русски.
- source_word: πρὸς θύραν
  choice: у двери
  rationale: πρός с винительным здесь выражает близость к двери; «у двери» — наиболее естественное пространственное обозначение.
- source_word: ἔξω
  choice: снаружи
  rationale: Передаёт расположение вне помещения; в сочетании «снаружи у двери» звучит естественно и сохраняет пространственную деталь.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: на улице
  rationale: ἄμφοδον обозначает улицу, переулок или проход; «на улице» — ясный современный эквивалент, при сохранении альтернативной пространственной связи в сноске.
- source_word: λύουσιν αὐτόν
  choice: отвязали его
  rationale: Историческое настоящее λύουσιν естественно передано прошедшим временем русского повествования; «отвязали» точно описывает действие.
