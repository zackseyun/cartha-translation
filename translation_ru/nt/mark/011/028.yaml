  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: ru
  text: 'И спрашивали Его: «Какой властью Ты всё это делаешь? Или кто дал Тебе эту власть делать всё это?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: спрашивали
  rationale: Имперфект передаёт продолжающееся действие; в русском контексте глагол «спрашивали» естественно выражает речевой акт, поскольку далее следуют прямые вопросы.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Какой властью
  rationale: Творительный падеж естественно передаёт ἐν с дательным в значении основания или полномочия, сохраняя повтор ключевого слова ἐξουσία.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: власть / эту власть
  rationale: «Власть» охватывает здесь право и полномочие действовать и соответствует вызову законности действий Иисуса.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: Ты это делаешь / Ты это делал
  rationale: Русское собирательное «это» естественно указывает на совокупность недавних действий Иисуса; формы настоящего времени сохраняют актуальность вопроса.
- source_word: ἢ
  choice: Или
  rationale: Союз вводит второй, тесно связанный вопрос как альтернативную формулировку первого.
- source_word: τίς σοι ἔδωκεν
  choice: кто дал Тебе
  rationale: Простое прошедшее время естественно передаёт аорист и не добавляет аспектуальных оттенков.
- source_word: ἵνα ταῦτα ποιῇς
  choice: чтобы Ты это делал
  rationale: Конструкция с «чтобы» непосредственно сохраняет ἵνα с сослагательным наклонением и возможный оттенок цели или предоставленного полномочия.
theological_decisions:
- issue: Источник полномочий Иисуса
  choice: Вопрос передан нейтрально как вызов власти и праву Иисуса действовать.
  alternative: Уточнить в переводе, что речь идёт именно о божественной власти.
  rationale: Сам стих ставит вопрос, но не называет источник власти; перевод не должен заранее давать богословский ответ.
translation_notes:
  register: Современный литературный русский язык; реплика звучит прямо и достойно. Повтор слова «власть» сохранён как значимый элемент исходного текста. Местоимения, обращённые к Иисусу, даны с прописной буквы согласно распространённой русской библейской издательской традиции.
