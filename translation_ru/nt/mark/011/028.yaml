review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: имперфект ἔλεγον отражён формой «спрашивали», ἐξουσία последовательно передана словом «власть», а второй вопрос не получает богословского ответа, отсутствующего в тексте. Однако ταῦτα дважды стоит во множественном числе («эти дела/всё это»), тогда как простое «это» может слишком сгладить эту деталь. В придаточном цели/назначения лучше употребить инфинитив после «дал власть», что естественно передаёт ἵνα ποιῇς без нежелательной русской временной окраски формы «делал».'
  naturalness: '«Какой властью» — допустимая и понятная современному читателю библейская формулировка. Вариант «чтобы Ты это делал» грамматически возможен, но после «кто дал Тебе эту власть» более естественно и компактно: «кто дал Тебе эту власть делать всё это?»'
  terminology: «Власть» удачно сохраняет повтор ἐξουσία и передаёт как полномочие, так и право действовать. Прописное «Ты/Тебе/Его» соответствует принятому русскому библейскому издательскому регистру. Никаких конфессионально окрашенных уточнений источника власти не добавлено.
