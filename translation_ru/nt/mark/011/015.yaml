  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: ru
  text: И пришли они в Иерусалим. Войдя на территорию храма[a], Иисус начал выгонять оттуда тех, кто продавал и покупал; он опрокинул столы менял и сиденья продавцов голубей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на территорию храмового комплекса, а не во внутреннее святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: пришли
  rationale: Историческое настоящее передано естественным для русского повествования прошедшим временем; множественное число сохранено.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: εἰσελθὼν
  choice: войдя
  rationale: Деепричастие естественно передаёт предшествующее главному действию обстоятельство, не утяжеляя фразу.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: на территорию храма / оттуда
  rationale: ἱερόν обозначает весь храмовый комплекс, а не собственно внутреннее святилище. «Оттуда» естественно устраняет тяжёлый повтор, сохраняя пространственную отнесённость действия.
- source_word: ἤρξατο ἐκβάλλειν
  choice: начал выгонять
  rationale: Сохранено начинательное значение конструкции и энергичный смысл ἐκβάλλω.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: тех, кто продавал и покупал
  rationale: Переданы субстантивированные причастия и параллелизм двух групп без излишней тяжеловесности.
- source_word: κολλυβιστῶν
  choice: менял
  rationale: Устоявшееся и понятное русское обозначение людей, занимавшихся разменом денег.
- source_word: καθέδρας
  choice: сиденья
  rationale: Нейтральное широкое соответствие, не уточняющее без основания вид предметов.
- source_word: περιστερὰς
  choice: голубей
  rationale: Обычное русское обозначение птиц, продававшихся для жертвоприношений; видовая конкретизация греческим словом не требуется.
- source_word: κατέστρεψεν
  choice: опрокинул
  rationale: Живо и точно передаёт действие по отношению к столам и сиденьям.
theological_decisions:
- issue: Пространственный объём ἱερόν в рассказе об очищении храма
  choice: «территория храма» в основном тексте
  alternative: «храм» с пояснением в сноске или «храмовый двор»
  rationale: Греческое ἱερόν относится к храмовому комплексу в целом, а не к внутреннему святилищу. «Территория храма» ясно сохраняет это различие и не определяет конкретный двор точнее, чем позволяет текст.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно торжественным библейским регистром. Имя «Иисус» употреблено вместо местоимения для естественной русской связности и ясного указания действующего лица; референт однозначно задан контекстом.
