lexical_decisions:
- source_word: ἤφιεν
  choice: не позволял
  rationale: 'Имперфект передаёт продолжавшееся или повторявшееся действие: Иисус пресекал попытки проносить вещи.'
- source_word: ἵνα τις διενέγκῃ
  choice: никому проносить
  rationale: После глагола позволения конструкция ἵνα с сослагательным наклонением естественно передаётся по-русски инфинитивным оборотом; τις в сфере отрицания означает «никому».
- source_word: διενέγκῃ
  choice: проносить
  rationale: Глагол обозначает перенос предмета через определённое место; приставочное «проносить» сохраняет направительное значение вместе с последующим «через».
- source_word: σκεῦος
  choice: какую-либо вещь
  rationale: 'Слово имеет широкое значение: предмет, сосуд, утварь или принадлежность. «Вещь» не конкретизирует её вид без достаточного основания.'
- source_word: διὰ τοῦ ἱεροῦ
  choice: через храмовый двор
  rationale: ἱερόν обозначает храмовый комплекс, а не внутреннее святилище; в данном контексте речь идёт о доступном для прохода дворе.
theological_decisions:
- issue: Значение ἱερόν применительно к Иерусалимскому храму
  choice: храмовый двор как часть более широкого храмового комплекса
  alternative: храм; территория храма
  rationale: Перевод отличает ἱερόν от ναός и не создаёт впечатления, будто люди проходили через внутреннее святилище; примечание сохраняет более широкий лексический объём слова.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и повествовательный. Имперфект передан несовершенным видом «не позволял». Выражение «какую-либо вещь» намеренно сохраняет неопределённость σκεῦος, а примечания поясняют объём обоих неоднозначных существительных.
