lexical_decisions:
- source_word: Εὐλογημένη
  choice: Благословенно
  rationale: Предикативное прилагательное вводит торжественное восклицание; «благословенно» сохраняет литургический и библейский оттенок, не сводя смысл лишь к человеческой хвале.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: грядущее царство
  rationale: «Грядущее» естественно передаёт настоящее причастие ἐρχομένη как приближающуюся реальность и уместно в торжественной речи; оно не превращает выражение в отвлечённую формулу о далёком будущем.
- source_word: βασιλεία
  choice: царство
  rationale: В данном давидическом контексте «царство» передаёт и царское владычество, и связанную с ним конкретную династическую реальность лучше, чем более абстрактное «правление».
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: отца нашего Давида
  rationale: Сохраняет родительный оборот и почётное обозначение Давида как праотца народа; порядок слов соответствует достоинству торжественного возгласа.
- source_word: Ὡσαννὰ
  choice: Осанна
  rationale: В новозаветном употреблении это уже устойчивый литургический возглас; исходный смысл мольбы о спасении поясняется в сноске.
- source_word: ἐν τοῖς ὑψίστοις
  choice: в вышних
  rationale: Краткий традиционный оборот точно сохраняет возвышенный литургический регистр и указание на высшую, небесную сферу без разъясняющего добавления.
theological_decisions:
- issue: Характер возгласа о царстве Давида
  choice: Передать прямо как благословение грядущего царства отца Давида, не добавляя определения «мессианское».
  alternative: «Благословенно грядущее мессианское царство отца нашего Давида».
  rationale: Контекст предполагает мессианские ожидания, однако греческий текст прямо называет лишь «грядущее царство отца нашего Давида». Буквенное добавление сняло бы сохраняемую текстом богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным литургическим регистром. Формы «грядущее» и «в вышних» здесь понятны из контекста и поддерживают характер народного торжественного возгласа; синтаксис остаётся кратким и естественным.
