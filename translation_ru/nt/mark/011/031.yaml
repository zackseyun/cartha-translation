source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: ru
  text: 'И они рассуждали между собой: «Что нам сказать? Если скажем: „С неба“[a], — он скажет: „Почему же вы не поверили ему?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «С неба» — иудейский благоговейный способ сказать «от Бога» или «божественного происхождения».
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: рассуждали
  rationale: Имперфект передаёт продолжавшееся обдумывание и обсуждение; «рассуждали» сохраняет мыслительный оттенок глагола и естественно звучит по-русски.
- source_word: πρὸς ἑαυτοὺς
  choice: между собой
  rationale: Оборот указывает на взаимное обсуждение внутри группы, а не только на внутренние мысли каждого.
- source_word: λέγοντες
  choice: содержание передано прямой речью после двоеточия
  rationale: В русском языке отдельное «говоря» здесь было бы тяжеловесно; двоеточие ясно вводит содержание обсуждения.
- source_word: Τί εἴπωμεν;
  choice: Что нам сказать?
  rationale: 'Так естественно передаётся совещательный аористный конъюнктив: они решают, какой ответ дать.'
- source_word: ἐὰν εἴπωμεν
  choice: Если скажем
  rationale: Краткая условная конструкция точно и идиоматично передаёт греческий оборот.
- source_word: Ἐξ οὐρανοῦ
  choice: С небес
  rationale: Сохранён буквальный образ иудейского благоговейного выражения, обозначающего божественное происхождение или полномочие.
- source_word: ἐρεῖ
  choice: он спросит
  rationale: Хотя буквально глагол означает «скажет», последующая прямая речь является вопросом; «спросит» естественно передаёт функцию реплики без изменения смысла.
- source_word: Διὰ τί οὖν
  choice: Почему же
  rationale: Частица «же» передаёт выводную связь οὖν и естественно звучит в русском вопросе.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: вы не поверили ему
  rationale: Дательный αὐτῷ указывает на принятие слов или свидетельства Иоанна; «поверили ему» точнее, чем «уверовали в него».
theological_decisions:
- issue: Значение выражения Ἐξ οὐρανοῦ применительно к крещению и полномочиям Иоанна
  choice: Сохранить в основном тексте выражение «С небес»
  alternative: «От Бога»
  rationale: Греческий текст сохраняет иудейское благоговейное обозначение божественного источника. Буквальный образ не устраняет подразумеваемого смысла и сохраняет риторическую напряжённость ответа.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и разговорно естественная, но сохраняет достоинство повествования. Маркер сноски поставлен после всей реплики, к которой относится пояснение выражения «С небес».
