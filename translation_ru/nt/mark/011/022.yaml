lexical_decisions:
- source_word: ἀποκριθεὶς … λέγει
  choice: сказал … в ответ
  rationale: Причастие ἀποκριθείς вместе с историческим настоящим λέγει вводит ответную реплику. Русское прошедшее время естественно для повествования, а оборот «сказал … в ответ» передаёт обе формы без тяжеловесного «отвечая, говорит».
- source_word: Ἔχετε
  choice: имейте
  rationale: Настоящее повелительное наклонение выражает требование устойчивого расположения; «имейте» кратко и непосредственно передаёт греческую форму, не усиливая аспект словами «сохраняйте» или «держитесь».
- source_word: πίστιν
  choice: веру
  rationale: В данном призыве πίστις естественно означает веру или доверие. «Веру» сохраняет ключевой богословский термин и хорошо сочетается с зависимым оборотом «в Бога».
- source_word: θεοῦ
  choice: в Бога
  rationale: 'После πίστιν родительный θεοῦ допускает разные синтаксические толкования. По ближайшему контексту наставления о вере и молитве наиболее естественно объективное значение: вера, направленная к Богу. Неоднозначность отмечена в сноске.'
theological_decisions:
- issue: Неоднозначный генитив в πίστιν θεοῦ
  choice: «вера в Бога»
  alternative: Буквально «вера Бога»; возможно также «Божья верность» или «вера от Бога»
  rationale: Контекст Мк 11:23–24 поддерживает призыв доверять Богу, однако сама греческая конструкция не исключает других отношений между πίστις и θεός. Поэтому основной текст дан естественно по-русски, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Историческое настоящее передано обычным для русского повествования прошедшим временем. Маркер сноски поставлен непосредственно после цитаты.
