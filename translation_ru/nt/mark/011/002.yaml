  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: ru
  text: 'И говорит им: «Пойдите в селение, которое напротив вас. Войдя в него, сразу найдёте привязанное молодое животное[a], на которого ещё никто из людей не садился[b]. Отвяжите его и приведите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово πῶλος обозначает молодое животное; в данном контексте его нередко понимают как ослёнка.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на которого ещё никто из людей не садился». Греческая формулировка прямо указывает, что ни один человек прежде не сидел на нём.'
    reason: literal_rendering
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Пойдите
  rationale: Прямой и естественный перевод повелительной формы глагола движения без добавочных оттенков.
- source_word: κώμην
  choice: селение
  rationale: κώμη обозначает небольшой населённый пункт, не город; «селение» понятно, литературно и не навязывает точного административного статуса.
- source_word: τὴν κατέναντι ὑμῶν
  choice: которое напротив вас
  rationale: Передаёт пространственное значение κατέναντι и сохраняет соотнесённость с местом, где находятся ученики.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτήν
  choice: Как только войдёте в него, вы сразу
  rationale: Естественная русская конструкция передаёт как обстоятельство входа, так и непосредственность последующего обнаружения животного.
- source_word: εὑρήσετε
  choice: вы найдёте
  rationale: Сохраняет прямое предсказательное значение будущего времени.
- source_word: πῶλον
  choice: ослёнка
  rationale: πῶλος может обозначать молодое животное; в повествовательном контексте въезда Иисуса речь идёт о молодом осле. Лексическая широта греческого слова отмечена в сноске.
- source_word: δεδεμένον
  choice: привязанного
  rationale: Передаёт состояние животного, закреплённого на месте, выраженное перфектным страдательным причастием.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: на которого ещё никто из людей не садился
  rationale: Сохраняет οὔπω («ещё не») и явно выраженное ἀνθρώπων, не утяжеляя русскую фразу сверх необходимого.
- source_word: λύσατε
  choice: Отвяжите
  rationale: Наиболее точное и естественное действие по отношению к привязанному животному.
- source_word: φέρετε
  choice: приведите
  rationale: В отношении живого животного русское «приведите» естественно передаёт направленное движение к говорящему, не предполагая, что его нужно нести.
