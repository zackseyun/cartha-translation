translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Историческое настоящее «говорит» сохранено вслед за греческим текстом. Формулировки ясны для широкого круга читателей; видовая принадлежность πῶλος передана по контексту и оговорена в сноске.
