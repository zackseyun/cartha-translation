  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: ru
  text: Они привели ослёнка к Иисусу, набросили на него свои плащи, и Иисус сел на него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: ослёнка
  rationale: В данном контексте речь идёт о молодом осле; «ослёнок» естественно и точно передаёт значение.
- source_word: ἐπιβάλλουσιν
  choice: набросили
  rationale: Глагол буквально выражает действие помещения или бросания сверху; «набросили» естественно описывает, как плащи положили на ослёнка.
- source_word: ἱμάτια
  choice: плащи
  rationale: В контексте верхняя одежда служит импровизированным седлом; «плащи» понятно современному читателю.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: Иисус сел на него
  rationale: Повтор имени устраняет возможную русскую двусмысленность местоимения, не добавляя нового содержания.
