base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: ru
  text: И всякий раз, когда наступал вечер, они выходили из города.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: всякий раз, когда
  rationale: В сочетании с имперфектом передаёт повторяющееся, обычное действие; эта формулировка яснее простого «когда» выражает итеративность.
- source_word: ὀψὲ ἐγένετο
  choice: наступал вечер
  rationale: Естественно передаёт греческое временное выражение со значением «становилось поздно / наступал вечер» и согласуется с повторным характером действия.
- source_word: ἐξεπορεύοντο
  choice: они выходили
  rationale: Русский имперфективный глагол прошедшего времени в данном контексте естественно выражает обычное повторявшееся действие и движение наружу.
- source_word: ἔξω τῆς πόλεως
  choice: из города
  rationale: Предлог «из» в сочетании с глаголом движения точно и естественно передаёт направленность движения за пределы города.
- source_word: πόλεως
  choice: города
  rationale: Источник говорит «города», не называя Иерусалим прямо; перевод не добавляет подразумеваемое имя собственное.
