  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: ru
  text: 'И он учил и говорил им: «Разве не написано: „Мой дом будет назван домом молитвы для всех народов“?[a] А вы превратили его в логово разбойников».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для всех племён». Греческое выражение передано словами «для всех народов» и перекликается с Ис 56:7, подчёркивая всеобщий охват этой пророческой формулировки.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «логово разбойников» перекликается с Иер 7:11. Слово λῃστής в зависимости от контекста может означать также грабителя, бандита или вооружённого разбойника.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: учил и говорил
  rationale: Два имперфекта передают продолжавшееся действие. В русском контекст и несовершенный вид естественно выражают длительность без утяжеляющей конструкции.
- source_word: Οὐ γέγραπται
  choice: Разве не написано
  rationale: Естественная русская формула ссылки на сохраняющий авторитет Писания; вопросительная частица передаёт ожидаемый утвердительный ответ.
- source_word: Ὁ οἶκός μου
  choice: Мой дом
  rationale: Прямо сохраняет образ и формулировку цитаты из Ис 56:7, не заменяя её пояснительным словом «храм».
- source_word: οἶκος προσευχῆς
  choice: дом молитвы
  rationale: Естественная и узнаваемая передача греческой конструкции с сохранением библейского образа.
- source_word: κληθήσεται
  choice: будет назван
  rationale: Точно передаёт будущее время и страдательный залог, оставаясь современным по звучанию.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: для всех народов
  rationale: Передаёт дательный оборот как указание на предназначение дома и сохраняет всеобщий охват слова ἔθνη.
- source_word: ὑμεῖς δὲ
  choice: А вы
  rationale: Ударное «вы» и противительный союз подчёркивают контраст между назначением Божьего дома и действиями слушателей.
- source_word: πεποιήκατε αὐτόν
  choice: превратили его
  rationale: 'По-русски естественно выражает достигнутый результат перфекта: вследствие их действий дом оказался логовом.'
- source_word: σπήλαιον λῃστῶν
  choice: разбойничье логово
  rationale: Сохраняет образ укрытия разбойников и узнаваемую отсылку к Иер 7:11, не сужая λῃστῶν до политически окрашенного значения.
theological_decisions:
- issue: Всеобщий охват пророческой цитаты
  choice: для всех народов
  alternative: для всех племён; для всех людей
  rationale: «Народов» прямо и естественно передаёт ἔθνη и сохраняет мысль Ис 56:7 о предназначении Божьего дома для людей за пределами Израиля, не конкретизируя богословские следствия.
- issue: Смысл обвинения λῃστῶν
  choice: разбойничье логово
  alternative: логово грабителей; убежище мятежников
  rationale: Контекст цитаты из Иер 7:11 поддерживает значение «разбойники». Перевод не навязывает слову возможный в иных контекстах политический смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм «учил и говорил» сохранён ради аспектуальной и риторической близости к греческому тексту; архаизмы и конфессионально нагруженные уточнения исключены.
