lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Прямо передаёт количественное значение без добавочного усиления.
- source_word: ἱμάτια
  choice: плащи
  rationale: В данном повествовательном контексте речь идёт о верхней одежде; «плащи» естественно и наглядно звучит по-русски.
- source_word: ἔστρωσαν εἰς τὴν ὁδόν
  choice: расстилали на дороге
  rationale: Передаёт размещение одежды на поверхности дороги и сохраняет повторяющийся характер действий множества людей в естественной русской форме.
- source_word: ἄλλοι δὲ
  choice: а другие
  rationale: Передаёт мягкое сопоставление групп, выраженное δέ.
- source_word: στιβάδας
  choice: листву
  rationale: Слово обозначает настил или массу срезанной растительности, листвы либо ветвей; «листва» не привносит пальмовые ветви из параллельной традиции и сохраняет собирательный образ.
- source_word: κόψαντες ἐκ τῶν ἀγρῶν
  choice: срезанную в полях
  rationale: Естественно передаёт предшествующее действие аористного причастия и источник растительности.
