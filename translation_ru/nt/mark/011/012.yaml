  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: ru
  text: На следующий день, когда они вышли из Вифании, Он проголодался.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: На
  rationale: Καί продолжает повествование; в русском временное сочетание «На следующий день» естественно передаёт связь с предшествующим рассказом без отдельного «и».
- source_word: τῇ ἐπαύριον
  choice: на следующий день
  rationale: Артикль с ἐπαύριον образует обстоятельственное обозначение времени; выбран современный и естественный русский оборот.
- source_word: ἐξελθόντων αὐτῶν
  choice: когда они вышли
  rationale: Генитив абсолютный с аористным причастием обозначает действие, предшествующее главному; придаточное времени сохраняет множественное число и ясно передаёт последовательность.
- source_word: ἀπὸ Βηθανίας
  choice: из Вифании
  rationale: ἀπό указывает на движение от места; применена традиционная русская форма библейского топонима.
- source_word: ἐπείνασεν
  choice: Он проголодался
  rationale: Аорист πεινάω естественно допускает ингрессивное понимание — наступление голода; «проголодался» точно и современно передаёт его без тяжеловесности.
theological_decisions:
- issue: Неявный субъект ἐπείνασεν
  choice: Местоимение «Он» без добавления имени Иисуса
  alternative: Явно назвать Иисуса
  rationale: В греческом субъект не назван, но однозначно понятен из контекста. Местоимение сохраняет лаконичность источника и прямо сообщает о подлинном человеческом голоде Иисуса, не добавляя богословского пояснения.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза проста и достойна. Заглавная буква в «Он» следует принятой русской библейской традиции для местоимения, относящегося к Иисусу.
