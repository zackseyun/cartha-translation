  source_fidelity: «На следующий день» точно передаёт τῇ ἐπαύριον. Оборот «когда они вышли из Вифании» адекватно воспроизводит генитив абсолютный ἐξελθόντων αὐτῶν и сохраняет его множественное число; «из Вифании» естественно передаёт ἀπὸ Βηθανίας. «Он проголодался» правомерно передаёт аорист ἐπείνασεν с его естественным ингрессивным оттенком. Неявный в греческом подлежащий не расширен именем.
  naturalness: Текст звучит естественно и литературно по-русски. Начальное «На следующий день» нормативно передаёт повествовательный переход без неестественного отдельного союза «И».
  terminology: Топоним «Вифания» соответствует устойчивой русской библейской традиции. Заглавное «Он» последовательно отражает заявленную библейскую орфографическую конвенцию и не изменяет смысла.
