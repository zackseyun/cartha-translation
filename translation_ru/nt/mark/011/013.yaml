revisions:
- from: Увидев издали смоковницу, покрытую листьями, он пошёл к ней посмотреть, не найдёт ли на ней чего-нибудь. Но, подойдя к ней, он не нашёл ничего, кроме листьев, ведь тогда был не сезон инжира[a].
  to: Увидев издали смоковницу с листьями, он пошёл к ней посмотреть, не найдёт ли на ней чего-нибудь. Но, подойдя к ней, он не нашёл ничего, кроме листьев, ведь тогда был не сезон инжира[a].
