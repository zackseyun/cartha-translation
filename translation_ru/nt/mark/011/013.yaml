source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: ru
  text: Увидев издали смоковницу с листьями, он пошёл к ней посмотреть, не найдёт ли на ней чего-нибудь. Но, подойдя к ней, он не нашёл ничего, кроме листьев, ведь тогда был не сезон инжира[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь тогда было не время для инжира».'
    reason: 'Лексическая альтернатива для καιρός: слово может обозначать как «сезон», так и подходящее «время».'
lexical_decisions:
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие естественно передаёт обстоятельственно-временное значение греческого причастия, не уточняя сверх текста строгую последовательность действий.
- source_word: συκῆν
  choice: смоковницу
  rationale: Точный и устойчивый литературный эквивалент названия фигового дерева в русском библейском контексте.
- source_word: ἀπὸ μακρόθεν
  choice: издали
  rationale: Естественно и кратко передаёт пространственное значение греческого выражения.
- source_word: ἔχουσαν φύλλα
  choice: покрытую листьями
  rationale: Передаёт видимый признак дерева естественнее буквального «имеющую листья», не добавляя утверждения о плодах.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: пошёл к ней посмотреть, не найдёт ли на ней чего-нибудь
  rationale: Конструкция с «не найдёт ли» сохраняет цель действия и оттенок неопределённого ожидания, выраженный εἰ ἄρα.
- source_word: ἐν αὐτῇ
  choice: на ней
  rationale: Русский язык говорит о плодах, находящихся на дереве; это естественное контекстуальное соответствие греческому ἐν.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: подойдя к ней
  rationale: Естественно передаёт приближение к дереву и сохраняет форму сопутствующего действия.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: не нашёл ничего, кроме листьев
  rationale: Прямой и идиоматичный эквивалент исключительной конструкции εἰ μὴ.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: ведь тогда был не сезон инжира
  rationale: «Сезон» ясно передаёт καιρός как надлежащее время плодоношения, а «ведь» сохраняет пояснительную функцию γάρ. Добавление «тогда» делает фразу естественной по-русски, не устраняя напряжения повествования.
theological_decisions:
- issue: Смысл пояснения о времени инжира
  choice: 'Сохранить прямое пояснение рассказчика: «ведь тогда был не сезон инжира».'
  alternative: Расширить фразу агрономическим объяснением того, почему при наличии листьев можно было ожидать ранних плодов.
  rationale: Текст одновременно сообщает, что Иисус искал плод, и что сезон инжира ещё не был актуален. Перевод сохраняет это повествовательное напряжение и не разрешает его посредством внесённого в текст толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Местоимение «он» дано со строчной буквы в соответствии с обычной современной орфографией и без внесения конфессиональной типографской традиции. Слово «смоковница» сохранено как общепринятое библейско-литературное название дерева.
