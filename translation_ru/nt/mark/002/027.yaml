  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: ru
  text: 'И говорил Он им: «Суббота возникла для человека[a], а не человек — для субботы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть для людей вообще, для всего человечества. В греческом тексте стоит единственное число «человек», употреблённое в обобщающем смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолженное или повторяющееся действие; русское «говорил» естественно сохраняет этот повествовательный аспект.
- source_word: τὸ σάββατον
  choice: суббота
  rationale: Слово с артиклем обозначает субботний день и установление субботы; стандартное русское «суббота» ясно передаёт оба оттенка без лишнего добавления.
- source_word: διὰ τὸν ἄνθρωπον
  choice: для человека
  rationale: διά с винительным выражает цель или пользу. Единственное число «человек» сохраняет форму и риторическую симметрию оригинала, при этом употреблено обобщённо.
- source_word: ἐγένετο
  choice: была установлена
  rationale: Глагол означает «возникла, появилась, стала существовать». В отношении субботы «была установлена» естественно по-русски указывает на её происхождение как установления, не превращая фразу в утверждение лишь о её нынешней функции.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: а не человек для субботы
  rationale: Противительное «а не» естественно передаёт резкую антитезу; эллиптическая форма сохранена, как и параллелизм двух частей.
theological_decisions:
- issue: Обобщающее значение единственного числа ἄνθρωπος
  choice: «человек» в основном тексте с пояснением в сноске
  alternative: «люди» или «человечество»
  rationale: Высказывание относится ко всем людям, однако единственное число оригинала важно для афористической формы и симметрии. Русское «человек» естественно имеет обобщающее значение и не требует замены множественным или отвлечённым существительным.
- issue: Значение ἐγένετο применительно к субботе
  choice: «была установлена»
  alternative: «возникла» или «появилась»
  rationale: Выбранный вариант идиоматичен для религиозно-нормативного установления и сохраняет указание на происхождение субботы. Он не уточняет названного действующего лица и не разрешает дополнительно вопрос о способе установления.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой оригинала. Местоимение «Он» помогает естественно обозначить говорящего в отдельном стихе; прописная буква соответствует принятому благоговейному библейскому регистру.
