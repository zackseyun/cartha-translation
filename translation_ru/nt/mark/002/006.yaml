  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: ru
  text: 'Но некоторые из книжников сидели там и рассуждали в своих сердцах[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «размышляли про себя» или «рассуждали в уме». Буквально по-гречески: «в своих сердцах» — это библейское выражение, обозначающее внутренние мысли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Но ... сидели
  rationale: δέ обозначает переход к реакции другой группы и лёгкое противопоставление; «но» естественно передаёт этот повествовательный поворот, не усиливая его чрезмерно.
- source_word: τινες τῶν γραμματέων
  choice: некоторые из книжников
  rationale: 'Частичный родительный падеж сохраняет смысл: речь идёт не обо всех, а о части книжников.'
- source_word: ἐκεῖ καθήμενοι
  choice: сидели там
  rationale: Естественный русский порядок слов точно передаёт место и положение участников сцены.
- source_word: διαλογιζόμενοι
  choice: рассуждали
  rationale: Глагол обозначает внутреннее обдумывание или рассуждение; выбранный вариант сохраняет мыслительный процесс и не добавляет значения открытого спора.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: в своих сердцах
  rationale: Сохранён библейский образ сердца как средоточия внутренней мысли; местоимение «своих» естественно указывает на субъект действия.
theological_decisions:
- issue: Антропологическая идиома καρδίαις
  choice: в своих сердцах
  alternative: про себя; в уме
  rationale: Буквальный образ сохраняет понятийный мир текста, где сердце является средоточием размышлений, и не навязывает современного противопоставления разума и чувств.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской идиомы. Формулировка проста, достойна по стилю и пригодна для чтения вслух.
