lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет обычную для Марка присоединительную связь и его паратактический стиль.
- source_word: ἔρχονται
  choice: пришли
  rationale: Греческое историческое настоящее естественно передано прошедшим временем в русском повествовании.
- source_word: φέροντες πρὸς αὐτὸν
  choice: к Нему люди, неся
  rationale: Передаёт сопутствующее действие и направление к Иисусу; слово «люди» восполняет подразумеваемое подлежащее формы множественного числа, не отождествляя его непременно с четверыми носильщиками.
- source_word: παραλυτικὸν
  choice: парализованного
  rationale: Субстантивированное прилагательное передано современным и понятным обозначением человека; контекст ясно указывает на лицо мужского пола.
- source_word: αἰρόμενον
  choice: которого несли
  rationale: Явно передаёт пассивное причастие и физическое несение больного другими.
- source_word: ὑπὸ τεσσάρων
  choice: четверо
  rationale: Сохраняет эллиптичность греческого текста, где не названо существительное «мужчины» или «люди».
