  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: ru
  text: 'Иисус сказал им: «Разве могут участники свадебного пира[a] поститься, пока с ними жених? Пока жених с ними, они не могут поститься».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья брачного чертога» — идиоматическое обозначение тех, кто участвует в свадебном торжестве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: Разве могут ... поститься?
  rationale: Отрицательная частица μή вводит риторический вопрос, предполагающий отрицательный ответ. Русская конструкция с «разве» естественно передаёт эту направленность, не превращая вопрос в утверждение.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: участники свадебного пира
  rationale: Буквально выражение означает «сыновья брачного чертога» и является идиомой для людей, участвующих в свадебном торжестве, прежде всего спутников жениха. «Участники свадебного пира» передаёт смысл естественно и не сужает круг до официальных сопровождающих.
- source_word: ἐν ᾧ ... ἐστιν
  choice: пока ... с ними
  rationale: Оборот имеет здесь временной смысл; «пока» ясно и естественно передаёт длительность присутствия жениха.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: жених
  rationale: Обычное современное русское слово сохраняет свадебный образ и его библейский богословский потенциал без дополнительных толкований.
- source_word: μετ’ αὐτῶν
  choice: с ними
  rationale: μετά с родительным падежом обозначает совместное пребывание; прямое соответствие — «с ними».
- source_word: ὅσον χρόνον
  choice: пока
  rationale: Оборот обозначает продолжительность времени. В данном повторе «пока» звучит естественно и сохраняет временное ограничение.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: жених с ними
  rationale: Хотя греческий текст буквально говорит «имеют жениха с ними», по-русски «пока жених с ними» естественнее. Значение наличия и присутствия сохраняется без неидиоматичного «имеют при себе жениха».
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус сказал им
  rationale: Прямой и литературно нейтральный повествовательный оборот. Начальное καί не обязательно передавать союзом «и» в изолированном русском стихе.
theological_decisions:
- issue: Метафорическое представление Иисуса как жениха
  choice: Сохранить образ жениха без поясняющего отождествления в основном тексте
  alternative: Перевести истолковательно, явно подчеркнув мессианский или божественный смысл образа
  rationale: Высказывание подразумевает связь Иисуса с образом жениха, но не формулирует её как отдельное богословское утверждение. Перевод сохраняет образ и оставляет его значение открытым для контекста и толкования.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Риторический вопрос сохранён; буквальная, но непрозрачная свадебная идиома передана по смыслу и отмечена сноской. Повтор слова «жених» и глагола «поститься» сохранён ради структуры и акцента исходного текста.
