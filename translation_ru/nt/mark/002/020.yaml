source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: ru
  text: Но придут дни, когда жениха отнимут у них, и тогда, в тот день[a], они будут поститься.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте стоит единственное число: «в тот день», а не «в те дни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Но придут дни
  rationale: Сохраняет греческую идиому о наступающих днях и передаёт δέ союзом «но», отмечающим контраст с нынешним временем свадебного торжества.
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с аористом сослагательного наклонения обозначает ожидаемое будущее событие; «когда» здесь естественнее, чем повторительное «всякий раз, когда».
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: жениха отнимут у них
  rationale: Неопределённо-личная русская конструкция естественно сохраняет неназванного деятеля и передаёт оттенок насильственного удаления, заложенный в ἀπαίρω.
- source_word: ὁ νυμφίος
  choice: жениха
  rationale: «Жених» точно и общепонятно сохраняет свадебный образ без поясняющей подстановки имени Иисуса.
- source_word: καὶ τότε
  choice: и тогда
  rationale: Явно сохраняет временную последовательность между отнятием жениха и постом.
- source_word: νηστεύσουσιν
  choice: они будут поститься
  rationale: Передаёт будущее время и употребляет обычное современное обозначение религиозного поста.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: в тот день
  rationale: Сохраняет подчёркнутое единственное число греческого выражения и естественно звучит по-русски.
theological_decisions:
- issue: Метафорическое отождествление Иисуса с женихом
  choice: Сохранить слово «жених» как метафору, не заменяя его прямым указанием на Иисуса.
  alternative: «когда Меня отнимут у них»
  rationale: Из контекста ясно, что Иисус говорит о Себе, однако греческий текст сохраняет свадебный образ; перевод не должен устранять его литературную и богословскую выразительность.
- issue: Характер и исполнитель отнятия жениха
  choice: «жениха отнимут у них» без указания исполнителя или прямого упоминания смерти
  alternative: «жених будет отнят у них смертью»
  rationale: Форма ἀπαρθῇ оставляет деятеля неназванным и лишь подразумевает резкое удаление. Стих предвосхищает смерть Иисуса, но здесь прямо не называет ни её, ни исполнителя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Оборот «жениха отнимут у них» выбран вместо тяжеловесного страдательного «жених будет отнят у них»; он не называет деятеля и сохраняет резкость действия. Повтор «тогда, в тот день» намеренно отражает καὶ τότε … ἐν ἐκείνῃ τῇ ἡμέρᾳ.
