  verdict: approve
  source_fidelity: 'Текст точно передаёт все смысловые элементы SBLGNT: контрастное «Но», будущее наступление дней, временное «когда», безлично выраженное насильственное удаление жениха от его спутников, последующий пост и единственное число в выражении «в тот день». Не добавлены ни исполнитель удаления, ни прямое истолкование образа как смерти Иисуса.'
  naturalness: «Но придут дни, когда жениха отнимут у них, и тогда, в тот день, они будут поститься» звучит понятно и литературно. Сочетание «тогда, в тот день» несколько намеренно усилено, но оправданно воспроизводит два греческих временных указателя (καὶ τότε и ἐν ἐκείνῃ τῇ ἡμέρᾳ), не нарушая современную русскую норму.
  terminology: «Жених» сохраняет библейский свадебный образ νυμφίος, а «будут поститься» — установленное и естественное обозначение νηστεύσουσιν. «Отнимут у них» удачно передаёт пассивную форму и оттенок резкого удаления, не называя деятеля. Сноска корректно фиксирует значимое единственное число греческого выражения.
