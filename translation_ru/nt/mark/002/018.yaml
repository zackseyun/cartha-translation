source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: ru
  text: 'Ученики Иоанна и фарисеи постились. И вот приходят и говорят Ему[a]: «Почему ученики Иоанна и ученики фарисеев постятся, а Твои ученики не постятся?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди приходят и говорят Ему». В греческом тексте не указано, кто именно приходит и говорит.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: постились
  rationale: Перифрастическая конструкция с имперфектом εἰμί и причастием настоящего времени обозначает продолжавшееся действие в прошлом; русское несовершенное «постились» естественно передаёт этот видовой смысл.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ученики Иоанна
  rationale: Родительный падеж выражает принадлежность или связь; такая конструкция точна и естественна по-русски.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование этой религиозной группы.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: приходят и говорят
  rationale: Настоящее историческое сохранено, чтобы передать характерную для Марка живость повествования; подлежащее не конкретизировано, поскольку в греческом оно не выражено.
- source_word: Διὰ τί
  choice: Почему
  rationale: Естественный и точный русский вопросительный эквивалент.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: ученики фарисеев
  rationale: Передаёт отношение, выраженное родительным падежом, не отождествляя самих фарисеев с их учениками.
- source_word: νηστεύουσιν
  choice: постятся
  rationale: Настоящее время в вопросе естественно передаёт обычную практику; форма «постятся» сохраняет контраст с «не постятся».
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: а Твои ученики
  rationale: Частица δέ выражает противопоставление; «а» естественно передаёт его по-русски, а притяжательное местоимение отражает σοί/σός.
theological_decisions:
- issue: Кто именно приходит и говорит Иисусу
  choice: 'Субъект оставлен неуточнённым: «приходят и говорят Ему»'
  alternative: «Люди приходят и говорят Ему» или прямое указание на одну из упомянутых групп
  rationale: Греческий текст не называет подлежащего у ἔρχονται и λέγουσιν. Перевод не добавляет отсутствующей в источнике конкретизации и сохраняет повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Историческое настоящее сохранено. «И вот» передаёт повествовательную живость καὶ при переходе к новому действию, не вводя временного значения «теперь». Местоимения, относящиеся к Иисусу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
