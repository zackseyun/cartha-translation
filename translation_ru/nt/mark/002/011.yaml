  verdict: approve
  source_fidelity: «Тебе говорю» точно передаёт вынесенное в начало Σοί и его личную направленность. Последовательность повелений («встань, возьми… и иди») соответствует трём императивам ἔγειρε, ἆρον, ὕπαγε. «Домой» — естественная русская передача εἰς τὸν οἶκόν σου без потери направления.
  naturalness: Фраза краткая, ясная и властная; она звучит естественно в современном литературном русском. «Свою подстилку» уместно обозначает простой переносной κράβαττος и не создаёт образа стационарной кровати.
  terminology: Выбор «подстилка» согласуется с лексическим значением κράβαττος как простой постели/мата. Сноска a корректно даёт «постель» как возможную альтернативу и поясняет предмет. Сноска b верно отмечает буквальное соответствие «в свой дом». В отличие от технически перепутанных английских маркеров в предоставленном аудиторском следе, русские маркеры стоят при относящихся к ним словах.
