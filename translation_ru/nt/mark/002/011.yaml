  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: ru
  text: 'Тебе говорю: встань, возьми свою подстилку[a] и иди домой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постель». Греческое κράβαττος обозначает простую подстилку или переносную постель.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «иди в свой дом».'
    reason: literal_rendering
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Тебе говорю
  rationale: Начальная позиция местоимения Σοί придаёт личному обращению особое ударение. Порядок слов «Тебе говорю» сохраняет этот акцент и остаётся естественным в прямой властной речи.
- source_word: ἔγειρε
  choice: встань
  rationale: Аористный императив ἐγείρω здесь означает непосредственное повеление парализованному подняться. «Встань» ясно и естественно в современном русском языке.
- source_word: ἆρον
  choice: возьми
  rationale: 'Аористный императив αἴρω обозначает конкретное действие: поднять и взять с собой. В сочетании с переносной подстилкой русское «возьми» естественно передаёт необходимый смысл, не перегружая фразу.'
- source_word: τὸν κράβαττόν σου
  choice: свою подстилку
  rationale: κράβαττος — простая переносная подстилка или бедная постель. «Подстилка» передаёт её лёгкость и переносимость, не создавая образа полноценной кровати; возвратное «свою» естественно при обращении к действующему лицу.
- source_word: ὕπαγε
  choice: иди
  rationale: Императив передаёт простое повеление отправиться; «иди» — прямой и современный русский эквивалент без излишней книжности.
- source_word: εἰς τὸν οἶκόν σου
  choice: домой
  rationale: Буквально выражение означает «в свой дом», однако в русском языке направление к собственному дому естественно выражается наречием «домой».
theological_decisions:
- issue: Тон и сила повеления Иисуса
  choice: 'Прямое личное повеление: «Тебе говорю: встань…»'
  alternative: 'Более традиционное: «Говорю тебе: встань, возьми постель твою и иди в дом твой»'
  rationale: Перевод сохраняет личную направленность и властный характер речи, но не добавляет богословского толкования природы этой власти.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и властная, как в греческом тексте. Выбраны общеупотребительные повелительные формы без архаизмов.
