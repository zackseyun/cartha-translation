source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: ru
  text: «Но чтобы вы знали, что Сын Человеческий[a] имеет власть на земле прощать грехи…» — говорит он парализованному[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сын человека». Это выражение может одновременно иметь идиоматический смысл, связанный с человеком или человечеством, и отсылать к образу из Дан 7.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «расслабленному».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Но чтобы
  rationale: ἵνα выражает цель, а δέ обозначает мягкий поворот в рассуждении; сочетание «но чтобы» естественно передаёт обе функции.
- source_word: εἰδῆτε
  choice: вы знали
  rationale: Прямо передаёт значение глагола и указывает на знание, которое должно быть подтверждено последующим исцелением.
- source_word: ἐξουσίαν ἔχει
  choice: имеет власть
  rationale: ἐξουσία здесь означает законное полномочие и право действовать, а не только способность или силу.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся русская передача самоназвания Иисуса сохраняет как связь с человеческой природой, так и возможную отсылку к Дан 7.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Естественно обозначает земную сферу, в которой проявляется названная власть.
- source_word: ἀφιέναι ἁμαρτίας
  choice: прощать грехи
  rationale: В данном контексте ἀφίημι означает отпущение, то есть прощение грехов.
- source_word: λέγει τῷ παραλυτικῷ
  choice: говорит он парализованному
  rationale: Настоящее время сохраняет историческое настоящее λέγει; «парализованному» понятно современному читателю и передаёт субстантивированное παραλυτικός.
theological_decisions:
- issue: Передача титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Сын человека; Человек
  rationale: Традиционная форма не сводит выражение ни только к человечности, ни исключительно к мессианскому титулу и сохраняет возможную связь с образом из Дан 7.
- issue: Значение ἐξουσία применительно к прощению грехов
  choice: власть
  alternative: сила; право
  rationale: Контекст говорит о правомочии прощать грехи, которое подтверждается исцелением, а не просто о способности совершить действие.
translation_notes:
  register: 'Современный литературный русский язык с сохранением достоинства библейской речи. Многоточие и тире передают намеренный обрыв высказывания: после заявления Иисус обращается к парализованному. Местоимение «он» не капитализировано, поскольку греческий текст не кодирует почтительного написания.'
