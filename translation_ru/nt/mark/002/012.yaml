base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: ru
  text: 'И он встал, тотчас взял свою подстилку и вышел у всех на виду, так что все изумлялись и прославляли Бога, говоря: «Такого мы ещё никогда не видели!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Так мы ещё никогда не видели». Этот греческий оборот означает, что ничего подобного прежде не видели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: встал
  rationale: В контексте исцеления форма глагола обозначает, что парализованный поднялся, исполняя повеление Иисуса. Вариант «был поднят» неестественен по-русски и неоправданно выдвигает на первый план возможные ассоциации с воскресением.
- source_word: εὐθύς
  choice: тотчас
  rationale: Передаёт характерную для повествования Марка непосредственность действия и сохраняет достойный литературный регистр.
- source_word: ἄρας
  choice: взял
  rationale: В данном контексте причастие означает, что исцелённый поднял и понёс свою подстилку; русское «взял» естественно передаёт последовательность действий.
- source_word: κράβαττον
  choice: подстилку
  rationale: Слово обозначает простое переносное ложе или спальную подстилку. Этот вариант понятен современному читателю и не создаёт образа полноценной кровати или медицинских носилок.
- source_word: ἔμπροσθεν πάντων
  choice: у всех на виду
  rationale: 'Естественный русский оборот сохраняет акцент на публичности исцеления: человек вышел так, что все могли его видеть.'
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: так что все изумлялись
  rationale: Передаёт результат увиденного и сильное потрясение присутствующих, не усиливая выражение до потери естественности.
- source_word: δοξάζειν τὸν θεόν
  choice: прославляли Бога
  rationale: Точно сохраняет направленную к Богу реакцию людей и привычную библейскую лексику.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Такого мы ещё никогда не видели
  rationale: Естественно передаёт греческий идиоматический оборот, выражающий беспрецедентность увиденного; буквальная структура отмечена в сноске.
theological_decisions:
- issue: Возможный оттенок воскресения в ἠγέρθη
  choice: встал
  alternative: был поднят / воскрес
  rationale: Хотя ἐγείρω в других контекстах может относиться к воскресению, здесь речь непосредственно идёт о физическом подъёме исцелённого парализованного. Перевод не привносит в этот эпизод невыраженный богословский смысл.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Сохранены стремительность повествования Марка, публичность чуда и непосредственная реакция свидетелей.
