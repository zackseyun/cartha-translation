  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: ru
  text: Почему этот человек так говорит? Он богохульствует! Кто может прощать грехи, кроме одного Бога?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кроме единого Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... οὕτως λαλεῖ
  choice: Почему Он так говорит?
  rationale: 'В этой конструкции Τί естественно передаёт вопрос о причине: «почему». Наречие οὕτως передано словом «так». Местоимение «Он» понятно из непосредственного контекста и по-русски звучит естественнее буквального «этот», не усиливая пренебрежительный оттенок.'
- source_word: βλασφημεῖ
  choice: Он богохульствует!
  rationale: Настоящее время выражает непосредственное обвинение книжников; глагол «богохульствует» сохраняет религиозно-юридическую тяжесть высказывания.
- source_word: τίς δύναται ἀφιέναι ἁμαρτίας
  choice: Кто может прощать грехи
  rationale: Это естественная русская передача вопроса о способности и праве прощать; в данном контексте ἀφίημι означает именно прощение грехов.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: кроме одного Бога
  rationale: 'Сочетание εἰ μή выражает исключение, а εἷς сохраняет явное значение единственности: никто, кроме одного Бога.'
theological_decisions:
- issue: Степень пренебрежения в οὗτος
  choice: Он
  alternative: этот человек / этот
  rationale: Контекст сохраняет враждебность книжников, но нейтральное местоимение не добавляет к греческому тексту чрезмерной презрительности. Указательный оттенок несущественен для установления референта в русском контексте.
- issue: Сила обвинения βλασφημεῖ
  choice: Он богохульствует!
  alternative: Это богохульство!
  rationale: Личная глагольная формулировка прямо воспроизводит обвинение книжников и сохраняет христологическое напряжение повествования, не оценивая заранее истинность их вывода.
- issue: Значение εἷς ὁ θεός
  choice: кроме одного Бога
  alternative: кроме единого Бога / кроме Бога одного
  rationale: Формулировка сохраняет эксплицитное εἷς и утверждение исключительности Бога, не превращая фразу в более специализированную конфессиональную формулу.
translation_notes:
  register: Современный литературный русский язык; короткие риторические вопросы и восклицание сохраняют резкость внутреннего возражения книжников. Прописная буква в «Он» соответствует традиционной русской библейской орфографии при отнесении местоимения к Иисусу.
