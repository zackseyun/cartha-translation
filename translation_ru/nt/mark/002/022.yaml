source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: ru
  text: И никто не наливает молодое вино в старые мехи. Иначе вино прорвёт мехи, и вино пропадёт, и мехи тоже[a]. Но молодое вино — в новые мехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и вино будет испорчено, и мехи тоже».'
    reason: Лексема ἀπόλλυται допускает в данном контексте оттенки утраты, порчи или гибели; основной текст передаёт это словом «пропадёт».
lexical_decisions:
- source_word: βάλλει
  choice: наливает
  rationale: Хотя греческий глагол имеет общее значение «класть, помещать», применительно к вину и сосуду естественный современный русский эквивалент — «наливать».
- source_word: οἶνον νέον
  choice: молодое вино
  rationale: В данном образе νέος указывает на недавно изготовленное, ещё бродящее вино. «Молодое вино» естественно по-русски и позволяет отличить νέον от καινούς в конце стиха.
- source_word: ἀσκούς
  choice: мехи
  rationale: Речь идёт о сосудах из шкур для хранения вина. Традиционное русское «мехи» кратко и точно сохраняет историко-культурный образ.
- source_word: παλαιούς
  choice: старые
  rationale: Прямо передаёт прилагательное и сохраняет противопоставление новым мехам, не усиливая смысл до «изношенных».
- source_word: ῥήξει
  choice: прорвёт
  rationale: Глагол описывает разрыв мехов под давлением бродящего вина. «Прорвёт» естественно выражает действие вина как причины разрыва.
- source_word: ἀπόλλυται
  choice: пропадёт
  rationale: В контексте означает, что вино будет потеряно, станет непригодным. «Пропадёт» сохраняет этот смысл без неуместно высокого «погибнет»; возможный оттенок «будет испорчено» отмечен в сноске.
- source_word: καινούς
  choice: новые
  rationale: Для мехов естественно «новые». Различие между νέος и καινός по-русски передано сочетанием «молодое вино» и «новые мехи»; вариант «свежие мехи» был бы неестественным.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Но молодое вино — в новые мехи
  rationale: В греческом заключительная фраза эллиптическая, без выраженного глагола. Русское именное построение с тире сохраняет краткость и афористичность, не превращая принцип в явное повеление.
theological_decisions:
- issue: Характер заключительной эллиптической фразы
  choice: 'Передана как краткий общий принцип: «Но молодое вино — в новые мехи».'
  alternative: «Но молодое вино следует наливать в новые мехи» или «Но молодое вино наливают в новые мехи».
  rationale: В исходном тексте глагол отсутствует. Эллиптическая русская конструкция сохраняет эту недосказанность и не добавляет явно ни предписания, ни неопределённо-личного действия.
translation_notes:
  register: Современный литературный русский с кратким, достоинственным ритмом притчи. «Мехи» сохраняет понятный библейский культурный образ; различие греческих прилагательных естественно отражено словами «молодое» и «новые». Повтор «и вино» следует структуре исходного текста, а «тоже» позволяет по-русски ясно распространить итог и на мехи.
