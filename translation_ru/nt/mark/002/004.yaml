  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: ru
  text: Не имея возможности из-за толпы поднести его к Иисусу[a], они разобрали крышу над тем местом, где Он находился, и, проделав в ней отверстие, спускают подстилку[b], на которой лежал парализованный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднести его к нему»; первое местоимение относится к парализованному, второе — к Иисусу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «циновку», «лежанку». Речь идёт о простом переносном ложе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: не имея возможности
  rationale: Причастный оборот передаёт обстоятельство, побудившее мужчин действовать дальше, и естественно звучит в современном русском языке.
- source_word: προσενέγκαι αὐτῷ
  choice: поднести его к Иисусу
  rationale: Глагол обозначает приближение или доставление кого-либо к кому-либо. Имя «Иисус» естественно проясняет референт дательного местоимения, не меняя смысла контекста.
- source_word: διὰ τὸν ὄχλον
  choice: из-за толпы
  rationale: Передаёт причинное значение διά с винительным падежом кратко и естественно.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: разобрали крышу
  rationale: Сочетание указывает на снятие или раскрытие кровли; «разобрали крышу» ясно описывает действие и избегает неестественной тавтологии.
- source_word: ὅπου ἦν
  choice: над тем местом, где Он находился
  rationale: Само выражение буквально означает «где Он был», однако контекст крыши подразумевает вертикальное расположение; «над тем местом» делает пространственную связь естественной по-русски.
- source_word: ἐξορύξαντες
  choice: проделав в ней отверстие
  rationale: Глагол буквально связан с выкапыванием или пробиванием. Выбор передаёт результат действия, не уточняя неизвестный материал крыши.
- source_word: χαλῶσι
  choice: спускают
  rationale: Настоящее время сохраняет повествовательную живость исторического настоящего в греческом тексте.
- source_word: κράβαττον
  choice: подстилку
  rationale: Слово обозначает простой тюфяк, мат или лежанку, а не полноценную кровать; «подстилка» понятно современному читателю и соответствует скромному переносному ложу.
- source_word: ὁ παραλυτικὸς
  choice: парализованный
  rationale: Субстантивированное прилагательное естественно передаётся русским обозначением человека по его состоянию без добавления диагноза сверх текста.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: на которой лежал парализованный
  rationale: Относительное предложение по смыслу относится к подстилке и указывает, что человек лежал на ней.
theological_decisions:
- issue: Референт αὐτῷ
  choice: Иисус
  alternative: ему
  rationale: В ближайшем повествовательном контексте местоимение относится к Иисусу. Явное имя устраняет тяжёлое русское повторение «его к нему», при этом буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Историческое настоящее «спускают» сохранено ради живости оригинала. Местоимение, относящееся к Иисусу, написано с прописной буквы в соответствии с принятой русской библейской традицией; при этом богословского вывода из капитализации не делается.
