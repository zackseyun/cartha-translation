base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: ru
  text: 'А фарисеи говорили Ему: «Смотри, почему они делают в субботу то, чего нельзя делать?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Смотри, что они делают в субботу такого, чего нельзя?» Греческое τί может означать «что», хотя в данном контексте вероятнее значение «почему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: А
  rationale: Связка продолжает повествование и одновременно естественно вводит возражение фарисеев; русское «а» здесь не добавляет резкого противопоставления.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование религиозной группы; греческий артикль отдельно не передаётся.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид передаёт имперфект как продолжающееся или повторявшееся высказывание, не усиливая его до «твердили».
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж естественно передаёт адресата речи; прописная буква соответствует принятому русскому библейскому оформлению местоимения, относящегося к Иисусу.
- source_word: Ἴδε
  choice: Смотри
  rationale: Естественный современный призыв обратить внимание; сохраняет прямоту греческого императива без архаического «се».
- source_word: τί
  choice: почему
  rationale: 'В контексте упрёка τί естественно имеет наречное значение причины: «почему». Формальная возможность чтения «что» сохранена в сноске.'
- source_word: ποιοῦσιν
  choice: они делают
  rationale: Настоящее время сохранено в прямой речи и обозначает действие, происходящее перед глазами говорящих.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Форма множественного числа является обычным греческим обозначением субботнего дня; по-русски естественно единственное число.
- source_word: ὃ οὐκ ἔξεστιν
  choice: то, чего нельзя делать
  rationale: Передаёт отсутствие дозволенности ясным современным русским языком. Добавление «делать» эллиптически восполняет смысл и избегает неестественного «то, чего нельзя».
theological_decisions:
- issue: Основание возражения фарисеев
  choice: «то, чего нельзя делать» — без уточнения источника запрета
  alternative: «то, что противозаконно» или «то, что запрещено законом»
  rationale: Греческое οὐκ ἔξεστιν утверждает недозволенность действия, но само по себе не определяет, идёт ли речь непосредственно о Писании, фарисейском предании или галахическом толковании. Перевод сохраняет эту напряжённость.
- issue: Значение τί в вопросе
  choice: 'Основной текст: «почему»'
  alternative: «что они делают в субботу такого, чего нельзя?»
  rationale: Контекст обвинительного вопроса поддерживает причинное «почему», однако грамматически возможно понимать τί как «что»; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с прямой, понятной формулировкой. «Говорили» сохраняет длительный или повторный оттенок имперфекта, а «Смотри» передаёт живой характер упрёка без архаизации. Сноска отмечена в основном тексте после всей реплики.
