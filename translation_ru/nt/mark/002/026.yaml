source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: ru
  text: как он вошёл в дом Божий во времена первосвященника Авиафара[a], ел хлебы предложения[b], которые позволено есть только священникам, и дал их также тем, кто был с ним?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при первосвященнике Авиафаре». Греческое выражение можно понимать и шире — как указание на время или повествовательный контекст, связанный с первосвященником Авиафаром.'
    reason: alternative_reading
  - marker: b
    text: «Хлебы предложения» — освящённые хлебы, которые клали перед Богом в святилище.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: как
  rationale: Естественно вводит пересказ поступка Давида и сохраняет связь с предшествующим вопросом.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: вошёл в дом Божий
  rationale: Прямой и естественный перевод, сохраняющий сакральное обозначение места.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: во времена первосвященника Авиафара
  rationale: Передаёт временное значение конструкции с ἐπί и родительным падежом, не сводя её безоговорочно к точному сроку первосвященства Авиафара.
- source_word: ἄρτους τῆς προθέσεως
  choice: хлебы предложения
  rationale: Устоявшееся русское обозначение освящённых хлебов, полагавшихся перед Богом; значение поясняется в сноске.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: которые никому, кроме священников, есть не позволено
  rationale: Ясно передаёт установленный законом запрет и исключительное право священников.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: и дал также тем, кто был с ним
  rationale: Сохраняет подразумеваемое дополнение и близко передаёт греческое причастное выражение естественным русским языком.
theological_decisions:
- issue: Временное выражение с именем Авиафара и его соотношение с ветхозаветным рассказом
  choice: «во времена первосвященника Авиафара» в основном тексте
  alternative: «при первосвященнике Авиафаре» или понимание как указания на повествовательный контекст, связанный с Авиафаром
  rationale: Греческое выражение допускает более широкое временное или контекстуальное понимание. Перевод сохраняет напряжение с 1 Царств 21 и не разрешает его внутри основного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. Синтаксис сохраняет вопросительную форму и зависимость стиха от предыдущего контекста; культовый термин пояснён без конфессиональных добавлений.
