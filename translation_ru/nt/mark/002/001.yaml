source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: ru
  text: Через несколько дней Иисус снова пришёл в Капернаум, и стало известно, что Он в доме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дома».'
    reason: Лексическая альтернатива для ἐν οἴκῳ, которое допускает как буквальное «в доме», так и идиоматическое «дома».
lexical_decisions:
- source_word: εἰσελθὼν
  choice: пришёл
  rationale: Аористное причастие перед главным глаголом передано личной формой в естественной русской повествовательной конструкции; в сочетании с εἰς обозначает прибытие в Капернаум.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторное прибытие кратко и естественно.
- source_word: Καφαρναούμ
  choice: Капернаум
  rationale: Использована устоявшаяся русская форма географического названия.
- source_word: δι’ ἡμερῶν
  choice: через несколько дней
  rationale: Идиоматично передаёт неопределённый промежуток в несколько дней, не уточняя его длительность.
- source_word: ἠκούσθη
  choice: стало известно
  rationale: Безличная конструкция естественно передаёт греческий пассив сообщения, не вводя явно названного распространителя вести.
- source_word: ἐν οἴκῳ
  choice: в доме
  rationale: 'Формально близкая передача сохраняет неоднозначность: речь может идти просто о доме либо о месте, воспринимаемом как дом Иисуса; русский вариант «дома» сильнее склонял бы ко второму пониманию.'
- source_word: ἐστίν
  choice: Он в доме
  rationale: Настоящее время греческой косвенной речи сохранено в русском сообщении как естественное указание на актуальное местонахождение Иисуса.
theological_decisions:
- issue: Обозначает ли ἐν οἴκῳ собственный дом или просто нахождение внутри определённого дома?
  choice: в доме
  alternative: дома
  rationale: Контекст не устанавливает однозначно, кому принадлежал дом. Основной текст сохраняет более широкое значение, а возможное идиоматическое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и повествовательно естественный. Имя «Иисус» эксплицировано вместо греческого подразумеваемого подлежащего, поскольку стих открывает новый эпизод и по-русски такое уточнение облегчает восприятие. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
