  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: ru
  text: Никто не пришивает к старой одежде заплату из ткани, ещё не давшей усадки[a]. Иначе новая заплата оторвётся от старой одежды[b], и разрыв станет ещё хуже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из необработанной ткани». Греческое выражение обозначает ткань, ещё не прошедшую обработку, после которой она уже не дала бы усадки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «заплата отнимает от неё — новое от старого». Смысл, по-видимому, в том, что новая заплата отрывается от старой одежды и увеличивает разрыв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: заплата
  rationale: В данном контексте слово обозначает кусок ткани, которым заделывают разрыв; «заплата» — точный и естественный русский эквивалент.
- source_word: ῥάκους ἀγνάφου
  choice: из ткани, ещё не давшей усадки
  rationale: ἄγναφος описывает ткань, которая ещё не прошла обработку и потому может дать усадку. Перевод передаёт практически важный для сравнения смысл понятным современным языком.
- source_word: ἐπιράπτει
  choice: пришивает
  rationale: Глагол означает прикреплять шитьём; «пришивает» естественно передаёт конкретное действие.
- source_word: ἱμάτιον παλαιόν
  choice: к старой одежде
  rationale: ἱμάτιον обозначает предмет одежды, нередко верхнюю одежду; общий перевод не вводит неоправданной конкретизации.
- source_word: εἰ δὲ μή
  choice: иначе
  rationale: Кратко и естественно вводит последствие описанного действия.
- source_word: αἴρει ... ἀπ’ αὐτοῦ
  choice: оторвётся от
  rationale: В контексте усадки новой ткани выражение указывает на отделение заплаты от старой ткани. Русская формулировка ясно передаёт развитие образа, а буквальная структура отмечена в сноске.
- source_word: τὸ πλήρωμα
  choice: заплата
  rationale: Здесь слово относится к куску, заполняющему разрыв, то есть к заплате.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: новая заплата от старой ткани
  rationale: Сохраняется противопоставление нового и старого, при этом подразумеваемые существительные выражены для ясности по-русски.
- source_word: χεῖρον σχίσμα γίνεται
  choice: разрыв станет ещё хуже
  rationale: Формулировка близко передаёт сравнительную степень χεῖρον и результирующее значение γίνεται, оставаясь естественной по-русски.
theological_decisions:
- issue: Толкование образа нового и старого
  choice: Не раскрывать предполагаемое богословское соответствие внутри перевода
  alternative: Явно связать новую заплату с учением или служением Иисуса, а старую одежду — с прежним религиозным порядком
  rationale: Сам стих сохраняет форму бытового сравнения и не называет соответствий; их конкретизация в тексте перевода была бы толкованием.
translation_notes:
  register: Современный литературный русский язык; конкретный бытовой образ передан ясно и без архаизмов. Синтаксис упрощён ровно настолько, чтобы трудная греческая конструкция была понятна, а её буквальная форма сохранена в сноске.
