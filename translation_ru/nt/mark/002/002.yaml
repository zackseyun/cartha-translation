  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: ru
  text: И собралось много людей, так что места уже не было даже у двери, и Он возвещал им слово[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть». Буквально: «слово».'
    reason: 'Лексическая альтернатива для λόγος: в контексте «слово» может обозначать возвещаемую весть.'
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: собралось много людей
  rationale: Передаёт аорист пассивной формы естественной русской конструкцией со значением скопления людей; подразумеваемое существительное «людей» выражено для ясности.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: так что места уже не было
  rationale: Сохраняет значение результата, вводимое ὥστε, и передаёт χωρεῖν как отсутствие свободного места; μηκέτι отражено словом «уже» в отрицательной конструкции.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: даже у двери
  rationale: Естественно передаёт идиоматическое обозначение пространства возле двери и усилительное отрицание μηδέ.
- source_word: ἐλάλει αὐτοῖς
  choice: Он говорил им
  rationale: Имперфект передан несовершенным видом, сохраняющим длительный характер действия; более узкое «проповедовал» не вносится.
- source_word: τὸν λόγον
  choice: слово
  rationale: Формально сохраняет λόγος и не добавляет отсутствующее в стихе уточнение «Божье»; возможное контекстуальное значение «весть» вынесено в сноску.
theological_decisions:
- issue: Значение τὸν λόγον применительно к речи Иисуса
  choice: слово
  alternative: весть; Божье слово
  rationale: «Слово» сохраняет формулировку греческого текста и богословскую открытость выражения. «Весть» допустима как смысловая передача, тогда как «Божье слово» добавляло бы не выраженное здесь определение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис ясен для широкого читателя; длительность ἐλάλει сохранена несовершенным видом. Местоимение «Он» написано с прописной буквы как традиционно уважительное обозначение Иисуса.
