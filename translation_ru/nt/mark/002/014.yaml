base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: ru
  text: 'Проходя мимо, Иисус увидел Левия, сына Алфея, сидевшего у места сбора налогов[a], и говорит ему: «Следуй за Мной». Тот встал и последовал за Ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у места сбора пошлин». Греческое слово обозначает место, где собирали налоги или таможенные пошлины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: проходя мимо
  rationale: Причастие настоящего времени задаёт одновременное фоновое действие; русский деепричастный оборот естественно передаёт эту связь.
- source_word: εἶδεν
  choice: увидел
  rationale: Прямое соответствие аористу ὁράω без добавочной смысловой окраски «заметил».
- source_word: Λευὶν
  choice: Левия
  rationale: Традиционная и понятная русская передача личного имени с требуемым винительным падежом.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: сына Алфеева
  rationale: Родительный оборот обозначает происхождение; слово «сына» восполнено по смыслу. Форма «Алфеев» сохраняет достоинство библейского регистра и ясна современному читателю.
- source_word: καθήμενον
  choice: сидевшего
  rationale: Причастие описывает положение Левия в момент, когда Иисус его увидел.
- source_word: ἐπὶ τὸ τελώνιον
  choice: у места сбора налогов
  rationale: τελώνιον обозначает место взимания налогов или пошлин; нейтральная формулировка не сужает значение до современной дорожной будки.
- source_word: λέγει
  choice: говорит
  rationale: Сохранён исторический презенс Марка, придающий рассказу живость.
- source_word: Ἀκολούθει μοι
  choice: Следуй за Мной
  rationale: Прямо передаёт повеление и сохраняет связь с последующим ἠκολούθησεν; добавочное «иди» отсутствует в греческом.
- source_word: ἀναστὰς
  choice: встал
  rationale: Естественно и последовательно передаёт предшествующее действие аористного причастия.
- source_word: ἠκολούθησεν αὐτῷ
  choice: последовал за Ним
  rationale: Сохраняет лексическую связь с повелением «Следуй» и прямо передаёт ответ Левия.
theological_decisions:
- issue: Историческое настоящее в повествовании Марка
  choice: 'Сохранить λέγει в настоящем времени: «говорит»'
  alternative: 'Согласовать с прошедшим временем повествования: «сказал»'
  rationale: Настоящее время отражает яркую повествовательную манеру Марка и остаётся допустимым в современном русском рассказе.
- issue: Референт невыраженного подлежащего при παράγων и εἶδεν
  choice: Эксплицировать имя «Иисус»
  alternative: Оставить местоименное «Он» или невыраженное подлежащее, полагаясь на контекст
  rationale: В пределах отдельно читаемого стиха греческое подлежащее определяется контекстом. Имя устраняет русскую синтаксическую неясность, не добавляя нового участника повествования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Историческое настоящее сохранено. Заглавные буквы в местоимениях, относящихся к Иисусу, использованы как принятая русская издательская норма, не меняющая смысла исходного текста.
