source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: ru
  text: 'Услышав это, Иисус говорит им: «Не здоровые нуждаются во враче[a], а больные. Я пришёл призвать не праведников,[b] а грешников».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сильные» или «крепкие»; в данном контексте: здоровые.'
    reason: lexical_alternative
  - marker: b
    text: 'В контексте слова «праведники» могут звучать иронически — о тех, кого считают праведными или кто сам считает себя праведным; однако греческий текст просто говорит: «праведники».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: услышав это
  rationale: Деепричастие естественно передаёт предшествующее главному глаголу действие аористного причастия; «это» восполняет подразумеваемый из контекста объект.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для повествования Марка историческое настоящее и его живость.
- source_word: οἱ ἰσχύοντες
  choice: сильные
  rationale: Передаёт прямое значение причастия от ἰσχύω — обладающие силой; в данном медицинском образе оно может означать здоровых, что отмечено в сноске.
- source_word: χρείαν ἔχουσιν
  choice: нуждаются
  rationale: Естественный современный русский эквивалент греческого оборота «иметь нужду».
- source_word: ἰατροῦ
  choice: во враче
  rationale: «Врач» — точное, общепонятное и стилистически достойное соответствие.
- source_word: οἱ κακῶς ἔχοντες
  choice: больные
  rationale: Греческий идиоматический оборот буквально описывает тех, кому плохо, и в медицинском противопоставлении обозначает больных.
- source_word: οὐκ ἦλθον καλέσαι
  choice: Я пришёл призвать не
  rationale: Русская конструкция с вынесенным отрицанием перед противопоставляемым дополнением естественно выражает οὐκ ... ἀλλά; «призвать» сохраняет смысл властного зова, не сужая его до приглашения.
- source_word: δικαίους
  choice: праведников
  rationale: Субстантивированное прилагательное передано принятой морально-религиозной категорией без добавления иронического толкования.
- source_word: ἁμαρτωλούς
  choice: грешников
  rationale: Стандартное и точное соответствие субстантивированному прилагательному.
theological_decisions:
- issue: Подразумеваемый объект при «услышав»
  choice: Добавлено «это»
  alternative: 'Оставить без объекта: «Услышав, Иисус говорит им»'
  rationale: Греческий текст не называет объект, но русский язык допускает и естественно ожидает указание на услышанное; «это» отсылает к непосредственному контексту, не уточняя содержание сверх текста.
- issue: Историческое настоящее λέγει
  choice: «говорит»
  alternative: «сказал»
  rationale: Настоящее время сохраняет повествовательную манеру Марка и не изменяет богословского содержания.
- issue: Возможная ирония в δικαίους
  choice: В основном тексте оставлено «праведников»
  alternative: «тех, кто считает себя праведным»
  rationale: Контекст допускает ироническое понимание, однако греческий текст прямо говорит «праведников». Сноска сохраняет возможность такого прочтения, не навязывая его.
- issue: Отрицание и противопоставление в οὐκ ... ἀλλά
  choice: «Я пришёл призвать не праведников, а грешников»
  alternative: «Я не пришёл призвать праведников, но грешников»
  rationale: Выбранный русский порядок слов яснее связывает отрицание именно с первым объектом призвания и естественно передаёт греческое противопоставление, не устраняя его богословской напряжённости.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и доступным синтаксисом. Историческое настоящее сохранено. Лексически более прямое «сильные» оставлено в основном тексте, а контекстуальное «здоровые» вынесено в сноску. Все сноски отмечены в основном тексте.
