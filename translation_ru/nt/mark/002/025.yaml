  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: ru
  text: 'И Он сказал им: «Неужели вы никогда не читали, что сделал Давид, когда оказался в нужде и проголодался — он и те, кто был с ним?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: оказался в нужде
  rationale: Передаёт идиому «имел нужду» естественным современным русским языком, сохраняя состояние необходимости и не уточняя сверх текста, в чём именно состояла нужда.
- source_word: ἐπείνασεν
  choice: проголодался
  rationale: Точно передаёт аорист глагола «голодать, испытывать голод» и сохраняет отдельное от нужды утверждение.
- source_word: οἱ μετ’ αὐτοῦ
  choice: те, кто был с ним
  rationale: Естественный и точный эквивалент, не добавляющий конкретного обозначения спутников Давида.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с уважительным, но понятным синтаксисом. Риторический вопрос передан через «Неужели… никогда», а завершающее уточнение «он и те, кто был с ним» сохранено после тире для ясности и близости к греческому акценту.
