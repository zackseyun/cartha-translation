source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: ru
  text: 'И сразу же Иисус, осознав в Своём духе[a], что они так рассуждают про себя, сказал им: «Почему вы рассуждаете обо всём этом в своих сердцах?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поняв духом»; возможно также: «распознав внутри Себя». Греческий текст прямо не уточняет, каким образом Иисус это осознал.'
    reason: Лексическая и синтаксическая неоднозначность выражений ἐπιγνοὺς и τῷ πνεύματι αὐτοῦ.
lexical_decisions:
- source_word: εὐθὺς
  choice: сразу же
  rationale: Передаёт характерную для Марка стремительность повествования естественным современным русским выражением.
- source_word: ἐπιγνοὺς
  choice: осознав
  rationale: Причастие указывает на ясное распознание или понимание; «осознав» не уточняет сверх текста, каким именно образом Иисус узнал их мысли.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: в Своём духе
  rationale: Сохраняет форму и неоднозначность греческого дательного, не сводя её однозначно ни к средству восприятия, ни просто к внутренней интуиции.
- source_word: οὕτως διαλογίζονται ἐν ἑαυτοῖς
  choice: они так рассуждают про себя
  rationale: «Рассуждают» сохраняет значение внутреннего обдумывания, а «про себя» естественно указывает на невысказанные мысли, а не на открытый спор.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Почему вы рассуждаете об этом
  rationale: В данном вопросе τί естественно передаётся по-русски словом «почему»; «об этом» ясно выражает ταῦτα.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: в своих сердцах
  rationale: Сохраняет библейский образ сердца как внутреннего средоточия мыслей и намерений, не сужая значение до одного лишь разума.
theological_decisions:
- issue: Природа знания Иисуса во фразе τῷ πνεύματι αὐτοῦ
  choice: Сохранить выражение «в Своём духе» и не определять механизм восприятия.
  alternative: Передать как однозначное указание либо на божественное всеведение, либо только на человеческую проницательность.
  rationale: Стих ясно утверждает, что Иисус распознал их внутренние рассуждения, но сама греческая фраза не объясняет, каким образом это произошло. Перевод сохраняет богословское напряжение без добавочного толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. «Сразу же» поддерживает динамику Марка; «про себя» естественно обозначает внутреннее рассуждение. Прописное «Своём» употреблено как традиционная русская графическая форма почтительного указания на Иисуса, без внесения дополнительного смыслового различия.
