  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: ru
  text: 'Иисус, увидев их веру, говорит парализованному: «Сын, тебе прощаются грехи».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое τέκνον — ласковое обращение: буквально «дитя, ребёнок». В данном контексте оно обращено к мужчине; «сын» передаёт его естественно в русском библейском регистре.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие естественно передаёт аористное причастие и сохраняет его связь с главным глаголом.
- source_word: πίστιν αὐτῶν
  choice: их веру
  rationale: Сохраняется обычное значение πίστις как веры, то есть проявленного доверия, и принадлежность этой веры группе.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для повествования Марка живое историческое настоящее.
- source_word: παραλυτικῷ
  choice: парализованному
  rationale: Субстантивированное прилагательное обозначает парализованного человека; русский вариант естественен и не требует добавлять отсутствующее в греческом слово «мужчина».
- source_word: Τέκνον
  choice: Дитя
  rationale: Передаёт тёплое, ласковое обращение и не вносит мужской семантики, которой само греческое слово не требует.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: прощены твои грехи
  rationale: Краткая русская пассивная конструкция передаёт прямое провозглашение прощения и, как греческий текст, не называет действующего лица.
theological_decisions:
- issue: Характер провозглашения прощения Иисусом
  choice: «прощены твои грехи» как прямое утверждение о нынешней реальности
  alternative: «прощаются твои грехи» или «твои грехи были прощены»
  rationale: Форма настоящего пассива представляет прощение как действительную реальность, не уточняя отдельно его механизм, временную протяжённость или подразумеваемого деятеля.
translation_notes:
  register: Современный литературный русский язык с сохранением марковского исторического настоящего. Обращение «Дитя» звучит возвышенно и тепло; сноска поясняет возможную естественную альтернативу.
