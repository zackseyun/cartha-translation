  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: ru
  text: И вот, когда Он возлежал за столом в его доме[a], многие сборщики налогов и грешники тоже возлежали за столом вместе с Иисусом и Его учениками, потому что их было много и они следовали за Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в доме Левия»; некоторые понимают: «в доме Иисуса». В греческом тексте сказано только: «в его доме».'
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: случилось
  rationale: Историческое настоящее у Марка передано естественным для русского повествования прошедшим временем.
- source_word: κατακεῖσθαι
  choice: возлежал за столом
  rationale: Глагол обозначает принятую в то время позу за трапезой; добавление «за столом» ясно передаёт контекст еды.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: в его доме
  rationale: Буквально сохраняет местоимение и не устраняет неясность относительно владельца дома.
- source_word: τελῶναι
  choice: сборщики налогов
  rationale: Современное и понятное обозначение людей, занимавшихся сбором государственных пошлин и налогов.
- source_word: ἁμαρτωλοὶ
  choice: грешники
  rationale: Прямой и традиционно понятный эквивалент, сохраняющий социально-религиозную характеристику исходного текста.
- source_word: συνανέκειντο
  choice: возлежали вместе с
  rationale: Сохраняет как образ совместной трапезы, так и значение совместности, выраженное приставкой συν-.
- source_word: μαθηταῖς
  choice: учениками
  rationale: Обычный русский эквивалент, передающий отношения обучения и следования.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: потому что их было много
  rationale: Естественно передаёт пояснительное γάρ и сохраняет неопределённость группы, к которой относится множественное число.
- source_word: ἠκολούθουν αὐτῷ
  choice: они следовали за Ним
  rationale: Передаёт длительное или повторяющееся действие имперфекта без неестественной тяжеловесности.
theological_decisions:
- issue: К кому относится «его» в выражении «в его доме» (αὐτοῦ)
  choice: В основном тексте оставлено «в его доме» без указания владельца.
  alternative: «в доме Левия» или «в доме Иисуса»
  rationale: Греческое местоимение в ближайшем контексте допускает оба понимания. Перевод сохраняет подлинную неоднозначность, а варианты разъясняются в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Возлежал за столом» сохраняет историческую реалии трапезы и остаётся понятным из контекста. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской норме.
