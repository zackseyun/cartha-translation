revisions:
- from: И случилось, что он возлежал за столом в его доме[a]. Многие сборщики налогов и грешники возлежали вместе с Иисусом и Его учениками, потому что их было много и они следовали за Ним.
  to: И вот, когда Он возлежал за столом в его доме[a], многие сборщики налогов и грешники тоже возлежали за столом вместе с Иисусом и Его учениками, потому что их было много и они следовали за Ним.
  rationale: Исправлен только неестественный для современного русского вводный оборот. Формула «И вот, когда…» сохраняет ход повествования и связь с последующим описанием трапезы. Повтор «за столом» во второй части устраняет возможную шероховатость «возлежали вместе с» и передаёт τραпезный контекст κατακεῖσθαι/συνανάκεισθαι. Сноска сохраняет исходную неоднозначность владельца дома.
