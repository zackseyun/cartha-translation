  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: ru
  text: 'А книжники из числа фарисеев, увидев, что Он ел с грешниками и сборщиками налогов[a], говорили Его ученикам: «Почему Он ест со сборщиками налогов и грешниками?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ел с». В данном контексте это подразумевает совместную трапезу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и по-прежнему понятный евангельский термин для знатоков и толкователей Писания и закона; он не сужает их роль до современного понятия учителя.
- source_word: τῶν Φαρισαίων
  choice: из фарисеев
  rationale: Естественно передаёт родительный падеж как принадлежность к группе, не решая жёстко, означает ли выражение членство или более широкую связь с фарисеями.
- source_word: ἰδόντες
  choice: увидев
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство, выраженное аористным причастием.
- source_word: ὅτι ἐσθίει
  choice: что Он ест
  rationale: Настоящее время по-русски естественно изображает наблюдаемую сцену; простое «ест» сохраняет буквальный образ совместной трапезы.
- source_word: ἁμαρτωλῶν
  choice: грешниками
  rationale: Прямой эквивалент сохраняет социально-религиозную характеристику людей и обвинительный оттенок речи книжников.
- source_word: τελωνῶν
  choice: сборщиками налогов
  rationale: Современное и понятное обозначение должностных лиц, собиравших налоги и пошлины; оно яснее архаичного «мытари».
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид сохраняет длительный либо повторявшийся характер высказывания, выраженный имперфектом.
- source_word: μαθηταῖς
  choice: ученикам
  rationale: Стандартно передаёт отношения учеников с учителем и точнее общего слова «последователи».
- source_word: Ὅτι
  choice: Почему
  rationale: В вопросительной реплике вводит причину возмущения; русское «почему» передаёт функцию естественно.
- source_word: μετὰ ... ἐσθίει
  choice: ест с
  rationale: Прямая и естественная передача совместной трапезы без внесения пояснения о религиозно-социальном общении в основной текст.
theological_decisions:
- issue: Социально-религиозный смысл совместной трапезы
  choice: Сохранить простую формулировку «ест с грешниками и сборщиками налогов».
  alternative: 'Передать более разъяснительно: «разделяет трапезу со сборщиками налогов и грешниками».'
  rationale: Греческий текст говорит буквально о еде вместе с этими людьми; подразумеваемое принятие и общение лучше оставить напряжением самого повествования, не превращая подтекст в явное толкование.
- issue: Связь книжников с фарисеями
  choice: «книжники из фарисеев»
  alternative: «книжники, принадлежавшие к фарисеям» или «фарисейские книжники»
  rationale: Выбранная формулировка передаёт групповую принадлежность и сохраняет некоторую компактность исходного родительного оборота, не добавляя конфессионально-исторических уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. «Книжники» сохранено как узнаваемое историко-религиозное название, тогда как «сборщики налогов» выбрано вместо малопонятного современному читателю «мытари». Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской издательской нормой.
