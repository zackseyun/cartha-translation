  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: ru
  text: 'Что легче: сказать парализованному: «Твои грехи прощены» — или сказать: «Встань, возьми свою циновку и ходи»?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Что легче
  rationale: Естественная русская формулировка сравнительного вопроса, точно передающая τί и сравнительную степень εὐκοπώτερον.
- source_word: εἰπεῖν
  choice: сказать
  rationale: Прямо и последовательно вводит обе реплики.
- source_word: τῷ παραλυτικῷ
  choice: парализованному
  rationale: Современное и понятное обозначение человека, страдающего параличом; субстантивированное прилагательное в данном контексте звучит естественно и не требует добавления отсутствующего в греческом слова «человек».
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Твои грехи прощены
  rationale: Краткая естественная формула сохраняет страдательное значение и акцент на наступившем состоянии прощения, не уточняя названного действующего лица или времени действия сверх греческого текста.
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Обычный и контекстуально точный эквивалент без привнесения метафоры долга.
- source_word: Ἔγειρε
  choice: Встань
  rationale: Естественный современный императив, уместный как повеление парализованному подняться.
- source_word: ἆρον
  choice: возьми
  rationale: В сочетании с переносимой циновкой естественно передаёт поднятие и последующее несение предмета; буквальное «подними» возможно, но хуже выражает весь контекстуальный смысл.
- source_word: τὸν κράβαττόν σου
  choice: свою циновку
  rationale: «Циновка» передаёт простой переносной настил для сна и не создаёт образа массивной современной кровати. Возвратное «свою» естественно по-русски при совпадении обладателя с адресатом повеления.
- source_word: περιπάτει
  choice: ходи
  rationale: Сохраняет форму настоящего императива и её возможный продолжительный оттенок; в контексте означает восстановленную способность ходить, а не только один шаг.
theological_decisions:
- issue: Формулировка объявления о прощении
  choice: Твои грехи прощены
  alternative: Твои грехи были прощены
  rationale: Выбранная формулировка сохраняет пассивное объявление и результирующее состояние, не навязывая более точной временной локализации и не называя деятеля. Так сохраняется повествовательное напряжение между невидимым прощением и видимым исцелением.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Синтаксический параллелизм двух вариантов сохранён. Тире перед «или» помогает читателю различить сопоставляемые высказывания. Сносок нет: возможный результирующий оттенок ἀφίενταί адекватно передан самой формой «прощены» и не требует отдельного примечания.'
