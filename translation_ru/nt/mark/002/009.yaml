  source_fidelity: Текст точно передаёт греческий сравнительный вопрос τί ἐστιν εὐκοπώτερον и сохраняет параллельную структуру двух инфинитивных высказываний. «Твои грехи прощены» удачно передаёт Ἀφίενταί σου αἱ ἁμαρτίαι как пассивное декларативное высказывание без неоправданного уточнения времени или действующего лица. «Встань, возьми свою циновку и ходи» соответствует трём повелениям Ἔγειρε, ἆρον и περιπάτει; «ходи» уместно сохраняет оттенок настоящего императива.
  naturalness: Формулировка современна, литературна и ясна. Субстантивированное «парализованному» допустимо и естественно в данном кратком повествовательном контексте. «Циновка» конкретно и понятно обозначает переносной настил; синтаксис и пунктуация хорошо выделяют противопоставление.
  terminology: «Грехи» и «прощены» — точные, нейтральные в конфессиональном отношении соответствия. Выбор не вносит богословского истолкования. Термины «парализованный» и «циновка» не создают анахронизмов и соответствуют контексту.
