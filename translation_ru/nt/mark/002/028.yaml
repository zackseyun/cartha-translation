  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: ru
  text: Поэтому Сын Человеческий — Господь даже субботы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поэтому Сын Человеческий — Господь также и субботы». Греческое καί может означать «и/также», однако здесь, вероятно, имеет усилительный смысл «даже», подчёркивая широту Его власти.'
    reason: Лексическая альтернатива для καί и сохранение возможного менее усилительного прочтения.
lexical_decisions:
- source_word: ὥστε
  choice: Поэтому
  rationale: Союз вводит вывод из предшествующих слов Иисуса; «поэтому» ясно и естественно передаёт логическое следствие.
- source_word: κύριος
  choice: Господь
  rationale: В роли именной части сказуемого слово выражает власть и господство. Традиционное «Господь» сохраняет сильное христологическое звучание, не сводя смысл к простой дозволенности.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохранён устойчивый евангельский титул Иисуса с его намеренной смысловой напряжённостью и возможной отсылкой к книге Даниила.
- source_word: καὶ
  choice: даже
  rationale: В данном положении καί, вероятнее всего, имеет усилительное значение и подчёркивает, что власть Сына Человеческого распространяется даже на субботу; буквальное «и/также» отмечено в сноске.
- source_word: σαββάτου
  choice: субботы
  rationale: Родительный падеж сохраняет греческую конструкцию κύριος + родительный и естественную для библейского русского формулу «Господь субботы».
theological_decisions:
- issue: Христологическая сила заявления о власти над субботой
  choice: Передать κύριος как «Господь», сохранив прямое утверждение господства Сына Человеческого над субботой.
  alternative: «Имеет власть над субботой».
  rationale: Греческое κύριος выражает господство, а не только ограниченное право определять допустимое; перевод не ослабляет утверждение и не добавляет к нему догматического толкования.
- issue: Кого обозначает выражение «Сын Человеческий»
  choice: Сохранить «Сын Человеческий» как титул Иисуса.
  alternative: «человек» или «представитель человечества».
  rationale: В Евангелии от Марка это выражение служит самообозначением Иисуса и сохраняет христологическую и интертекстуальную неоднозначность, которую не следует разрешать парафразом.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского изложения. Традиционные титулы «Сын Человеческий» и «Господь» сохранены; краткая синтаксическая форма следует выразительности исходного текста.
