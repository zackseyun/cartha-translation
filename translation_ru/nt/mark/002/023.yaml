  terminology: «Суббота», «засеянные поля» и «колосья» точны и стилистически нейтральны. Прописное «Он/Его» допустимо в принятом библейском издательском оформлении. Сноска должна отмечать буквальную форму идиомы, но не выдавать одно спорное объяснение за установленный смысл.
