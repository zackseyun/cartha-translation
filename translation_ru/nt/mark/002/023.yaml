  source_fidelity: 'Основной смысл передан верно: речь идёт об одном субботнем дне, прохождении через засеянные поля и срывании колосьев учениками. Однако конструкция «случилось Ему ... проходить» — неоправданно буквальная калька греческого винительного субъекта при инфинитиве и не соответствует нормам современного русского. Оборот ὁδὸν ποιεῖν следует передавать как движение/продвижение, не как реальное прокладывание дороги в основном тексте.'
