  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: ru
  text: Однажды в субботу Он проходил через засеянные поля[a], а Его ученики, идя, стали срывать колосья[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через посевы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «начали делать путь, срывая колосья». Оборот «делать путь» здесь идиоматически обозначает продвижение по пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: случилось
  rationale: Сохраняет вводную повествовательную формулу, не прибегая к архаичному «было» или тяжеловесному «произошло так».
- source_word: ἐν τοῖς σάββασιν
  choice: в субботу
  rationale: Форма множественного числа в койне здесь идиоматически обозначает один субботний день; русский язык естественно требует единственного числа.
- source_word: παραπορεύεσθαι
  choice: проходить
  rationale: Передаёт движение через местность в конструкции с ἐγένετο и инфинитивом.
- source_word: διὰ τῶν σπορίμων
  choice: через засеянные поля
  rationale: σπόριμα обозначает посевы или засеянные поля; выбранный вариант ясен современному читателю и не уточняет вид зерновой культуры.
- source_word: ὁδὸν ποιεῖν
  choice: по пути
  rationale: В контексте оборот описывает продвижение учеников, а не строительство дороги; «по пути стали» естественно связывает движение с сопутствующим срыванием колосьев.
- source_word: τίλλοντες
  choice: срывать
  rationale: Точно и естественно передаёт отделение колосьев рукой.
- source_word: τοὺς στάχυας
  choice: колосья
  rationale: Обычное современное русское обозначение колосьев зерновых; не требуется более описательное «верхушки стеблей».
- source_word: αὐτὸν
  choice: Ему
  rationale: Греческий винительный субъект при инфинитиве после ἐγένετο естественно передан русским дательным субъектом в безличной конструкции.
theological_decisions:
- issue: Обозначение субботы
  choice: в субботу
  alternative: по субботам
  rationale: Контекст повествует об одном случае; греческое множественное число имеет идиоматическое значение единственного и не указывает на повторяющееся действие.
- issue: Значение ὁδὸν ποιεῖν в контексте спора о субботе
  choice: по пути стали
  alternative: стали прокладывать дорогу
  rationale: Выбранное чтение не создаёт неподтверждённого впечатления дорожных работ и передаёт движение через поле одновременно со срыванием колосьев. Буквальная образность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Конструкция «случилось Ему… проходить» сохраняет форму греческого повествования, оставаясь понятной; прописные местоимения следуют принятой русской библейской издательской традиции.
