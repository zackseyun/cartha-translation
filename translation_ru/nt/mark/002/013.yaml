  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: ru
  text: И Он снова вышел на берег моря[a], и вся толпа шла к Нему, и Он учил их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вдоль моря».'
