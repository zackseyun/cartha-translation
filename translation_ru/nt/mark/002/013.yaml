    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Естественный русский эквивалент аориста ἐξέρχομαι; направление далее уточняется оборотом «к морю».
- source_word: πάλιν
  choice: снова
  rationale: Прямо и естественно передаёт значение повторности.
- source_word: παρὰ τὴν θάλασσαν
  choice: к морю
  rationale: Παρά с винительным падежом в данном контексте допускает движение к месту у моря; краткая русская формулировка естественна, а пространственная альтернатива отмечена в сноске.
- source_word: πᾶς ὁ ὄχλος
  choice: весь народ
  rationale: Идиоматично передаёт собирательное значение ὄχλος и сочетание πᾶς ὁ; «вся толпа» возможно, но в современном русском может звучать несколько отчуждённо.
- source_word: ἤρχετο
  choice: шёл
  rationale: Несовершенный вид естественно передаёт продолженное действие греческого имперфекта без избыточного уточнения повторности.
- source_word: πρὸς αὐτόν
  choice: к Нему
  rationale: Естественно передаёт направленность движения к лицу.
- source_word: ἐδίδασκεν
  choice: учил
  rationale: Русский глагол несовершенного вида сохраняет длительный характер греческого имперфекта.
- source_word: αὐτούς
  choice: их
  rationale: Прямое дополнение отсылает к собравшимся людям.
