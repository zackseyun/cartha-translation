translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Союз «а» во второй части естественно связывает одновременные действия, не вводя сильного противопоставления.
