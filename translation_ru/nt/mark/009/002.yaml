revisions:
- from: Через шесть дней[a] Иисус берёт с Собой Петра, Иакова и Иоанна и ведёт их одних на высокую гору. И там, у них на глазах, Его облик преобразился[b].
  to: Через шесть дней[a] Иисус берёт с Собой Петра, Иакова и Иоанна и ведёт их одних на высокую гору. И у них на глазах Он преобразился[b].
  rationale: Убраны невыраженные в оригинале «там» и «Его облик». Прямое «Он преобразился» точнее сохраняет субъект греческого μετεμορφώθη, а «у них на глазах» сохраняет смысл ἔμπροσθεν αὐτῶν. Остальные решения сохранены как точные и естественные.
