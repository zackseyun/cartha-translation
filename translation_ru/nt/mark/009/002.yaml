    issue: В основном тексте добавлено «Его облик», а Иисус перестаёт быть прямым субъектом преобразования.
    rationale: μετεμορφώθη имеет субъектом Иисуса; слово «облик» в оригинале не выражено. Оно может быть пояснительным, но безопаснее сохранить формулировку без добавления.
  - severity: low
    issue: Добавлено слово «там».
    rationale: Оно выводимо из контекста, но греческое καί просто соединяет следующее событие; для оптимально-эквивалентного перевода добавление излишне.
