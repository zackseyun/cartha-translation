  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: ru
  text: Через шесть дней[a] Иисус берёт с Собой Петра, Иакова и Иоанна и ведёт их одних на высокую гору. И у них на глазах Он преобразился[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По прошествии шести дней».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он преобразился перед ними». Это событие традиционно называется Преображением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Через шесть дней
  rationale: Естественно передаёт временное следование; более буквальный вариант «по прошествии шести дней» дан в сноске.
- source_word: παραλαμβάνει
  choice: берёт с Собой
  rationale: Передаёт значение «берёт с собой» и сохраняет характерное для Марка настоящее историческое время.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: ведёт их ... на высокую гору
  rationale: Глагол обозначает движение вверх; русское «ведёт ... на высокую гору» звучит естественно и сохраняет направление восхождения.
- source_word: κατ’ ἰδίαν μόνους
  choice: их одних
  rationale: Кратко и естественно передаёт усиленную мысль об отделении этих троих от остальных; оттенок уединённости разъяснён в сноске.
- source_word: μετεμορφώθη
  choice: Его облик преобразился
  rationale: Передаёт видимое изменение Иисуса, не объясняя его природу сверх сказанного в тексте; традиционное название события указано в сноске.
- source_word: ἔμπροσθεν αὐτῶν
  choice: у них на глазах
  rationale: Естественно выражает, что событие произошло перед учениками и было ими увидено.
theological_decisions:
- issue: Передача μετεμορφώθη в христологическом контексте
  choice: Его облик преобразился
  alternative: Он преобразился; Он преобразился перед ними
  rationale: Формулировка ясно говорит о видимой перемене, но не вводит предположений о её механизме или природе. Она сохраняет связь с традиционным понятием Преображения, не делая традиционный термин единственно возможным лексическим толкованием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Настоящее историческое время сохранено в «берёт» и «ведёт»; конструкция «Его облик преобразился» естественно передаёт пассивную греческую форму через русское возвратное выражение. Частица «там» добавлена лишь для плавной связи и не меняет места действия.
