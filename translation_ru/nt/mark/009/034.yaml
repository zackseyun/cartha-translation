id: MRK.9.34
reference: Mark 9:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: ru
  text: Но они молчали, потому что по дороге спорили друг с другом о том, кто из них больше.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто из них величайший». В греческом тексте стоит сравнительная степень: «больше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: молчали
  rationale: Имперфект передаёт продолжавшееся молчание в ответ на вопрос Иисуса; русское несовершенное «молчали» естественно выражает этот длительный аспект.
- source_word: διελέχθησαν
  choice: спорили
  rationale: Глагол может обозначать обсуждение или пререкание; в контексте соперничества за более высокое положение «спорили» уместно передаёт напряжённый характер разговора.
- source_word: πρὸς ἀλλήλους
  choice: друг с другом
  rationale: Сохраняет взаимный характер действия и естественно звучит по-русски.
- source_word: ἐν τῇ ὁδῷ
  choice: по дороге
  rationale: Естественный русский эквивалент, ясно передающий разговор во время пути.
- source_word: τίς μείζων
  choice: кто из них больше
  rationale: Сохраняет сравнительную степень μείζων («больше»), а добавление «из них» естественно проясняет подразумеваемую группу участников спора.
- source_word: οἱ δὲ
  choice: Но они
  rationale: δέ обозначает лёгкое противопоставление их молчания предшествующему вопросу Иисуса.
- source_word: γὰρ
  choice: потому что
  rationale: Ясно передаёт причину их молчания в современном русском синтаксисе.
theological_decisions:
- issue: Сравнительная форма μείζων и возможная идиоматическая превосходная степень
  choice: кто из них больше
  alternative: кто из них самый главный / кто из них величайший
  rationale: Греческий текст использует сравнительную, а не превосходную степень. Перевод сохраняет эту форму и не сглаживает соперничество учеников традиционной превосходной конструкцией.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и естественная, с достоинством повествовательного стиля. Несовершенные формы «молчали» и «спорили» передают длительность без тяжеловесного «продолжали молчать».
