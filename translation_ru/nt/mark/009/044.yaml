  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ru
  text: где[a] червь их не умирает и огонь не угасает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в древнейших греческих рукописях, в том числе в Синайском и Ватиканском кодексах IV века, а также в ранних коптских переводах, но присутствует в Александрийском кодексе V века, латинской традиции и большинстве более поздних византийских рукописей. Вероятно, это позднейшее добавление переписчика, дословно повторяющее фразу из стиха 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: червь
  rationale: Прямой и традиционный эквивалент, сохраняющий образ и словесную связь с Исайей 66:24; в контексте может обозначать червя, питающегося разлагающейся плотью.
- source_word: τελευτᾷ
  choice: умирает
  rationale: Глагол означает «приходить к концу, умирать»; применительно к живому существу естественный русский эквивалент — «умирает».
- source_word: σβέννυται
  choice: угасает
  rationale: Настоящее время страдательного по форме греческого глагола передаёт неугасимость огня; по-русски «огонь не угасает» звучит естественно, точно и торжественно.
theological_decisions: []
translation_notes:
