source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: ru
  text: 'И он говорил им: «Истинно говорю вам: некоторые из стоящих здесь не вкусят смерти[a], пока не увидят Царство Божье, пришедшее в силе[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «вкусить смерть» означает «испытать смерть», то есть умереть.
    reason: lexical_alternative
  - marker: b
    text: Текст не уточняет, какое именно событие названо приходом Царства Божьего в силе. Это выражение связывают, в частности, с преображением, воскресением и возвышением Христа, Пятидесятницей, судом над Иерусалимом или будущим окончательным явлением Царства.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передан несовершенным видом, что сохраняет оттенок продолжающейся речи и связь с предшествующим высказыванием; в данном контексте русское «говорил» звучит естественно.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Это естественная для современного литературного русского передача формулы торжественного заверения; она сохраняет её вес, не превращая вводное ἀμήν в менее понятную здесь транслитерацию.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: некоторые из стоящих здесь
  rationale: 'Передаёт партитивное значение: речь идёт о части присутствующих. «Стоящих здесь» сохраняет образ и состояние, выраженное причастием совершенного времени.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: не вкусят смерти
  rationale: Сохранена греческая метафора. Категоричное русское будущее в торжественном заверении передаёт усиленное отрицание οὐ μή без неестественного добавления наречия.
- source_word: ἕως ἂν ἴδωσιν
  choice: пока не увидят
  rationale: Обычная и естественная русская временная конструкция для будущего предела действия.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшаяся и понятная русская передача, сохраняющая как значение Божьего правления, так и эсхатологический образ Царства.
- source_word: ἐληλυθυῖαν
  choice: пришедшее
  rationale: Причастие совершенного вида передаёт перфектный оттенок состоявшегося прихода и согласуется с «Царство» без преобразования фразы в толковательное придаточное.
- source_word: ἐν δυνάμει
  choice: в силе
  rationale: Близко передаёт предложную конструкцию и идею явленной силы, не уточняя способ её проявления.
theological_decisions:
- issue: Событие, к которому относится приход Царства Божьего в силе
  choice: Оставить выражение без указания на конкретное событие
  alternative: Преображение, воскресение и возвышение Христа, Пятидесятница, суд над Иерусалимом или окончательное явление Царства
  rationale: Греческий текст прямо не называет событие. Перевод сохраняет исходную неоднозначность и не отдаёт предпочтения одной богословской трактовке.
- issue: Соотношение «Царства» с Божьим правлением и сферой этого правления
  choice: Царство Божье
  alternative: царствование Бога
  rationale: В контексте допустимы динамический и пространственно-эсхатологический оттенки βασιλεία. Традиционное русское выражение позволяет сохранить оба, тогда как «царствование» сузило бы смысл.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным евангельским звучанием. Сохранены образ «вкусить смерть», партитивное «некоторые из стоящих здесь» и смысловая напряжённость заключительной фразы; архаические формы и конфессионально окрашенные уточнения не вводились.
