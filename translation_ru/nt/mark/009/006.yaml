  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: ru
  text: Ведь он не знал, что ответить, потому что они пришли в ужас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ … ᾔδει
  choice: не знал
  rationale: Оборот передаёт отсутствие знания или понимания того, как ответить; «не знал» естественно и точно звучит по-русски.
- source_word: τί ἀποκριθῇ
  choice: что ответить
  rationale: ἀποκρίνομαι означает «отвечать»; русский инфинитив естественно передаёт здесь косвенный вопрос с совещательным оттенком.
- source_word: ἔκφοβοι
  choice: в ужас
  rationale: Слово выражает сильный страх; устойчивое сочетание «прийти в ужас» сохраняет усиленное значение без стилистической тяжеловесности.
- source_word: ἐγένοντο
  choice: пришли
  rationale: Глагол обозначает наступление состояния, а не только пребывание в нём; «пришли в ужас» передаёт эту перемену естественным русским оборотом.
- source_word: γὰρ … γὰρ
  choice: ведь … потому что
  rationale: Оба объяснительных союза сохранены, но переданы разными естественными русскими средствами, чтобы избежать неуклюжего повтора.
theological_decisions:
- issue: Подлежащее во множественном числе в заключительной части
  choice: они пришли в ужас
  alternative: он пришёл в ужас
  rationale: Формы ἔκφοβοι и ἐγένοντο стоят во множественном числе и относятся к Петру и его спутникам; единственное число не поддерживается греческой грамматикой.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и достойная по тону. Сохранены обе причинно-пояснительные связи и динамический оттенок наступления страха.
