  text: Πᾶς γὰρ πυρὶ ⸀ἁλισθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: ru
  text: Ведь каждый будет осолён огнём[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет приправлен огнём». Образ может указывать на суд, очищение или жертвоприношение; ср. Лев 2:13.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях добавлено: «и всякая жертва будет осолена солью».'
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: каждый
  rationale: Субстантивированное прилагательное мужского рода в единственном числе в данном контексте естественно обозначает каждого человека, а не всё вообще.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим предостережением естественным для современного русского языка способом.
- source_word: πυρὶ
  choice: огнём
  rationale: Творительный падеж сохраняет возможное значение средства или образа действия, не уточняя принудительно «в огне» или «посредством огня».
- source_word: ἁλισθήσεται
  choice: будет осолён
  rationale: Будущее страдательное от ἁλίζω буквально означает «солить, приправлять солью». Необычный образ намеренно сохранён, а не заменён толкованием.
theological_decisions:
- issue: Значение метафоры «осолён огнём»
  choice: Сохранить буквальную метафорическую формулировку, не определяя, относится ли она прежде всего к суду, очищению, жертвоприношению или испытанию учеников.
  alternative: 'Передать толковательно: «пройдёт через огненный суд», «будет очищен огнём» или «будет посвящён как жертва».'
  rationale: Греческая фраза кратка и многозначна; контекст допускает несколько взаимосвязанных толкований. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык. «Осолён огнём» звучит намеренно необычно, как и греческий оригинал; форма «каждый» ясно указывает на людей в контексте. Буква «ё» использована для однозначного чтения.
