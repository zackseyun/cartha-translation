  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: ru
  text: 'Но Иисус, увидев, что толпа быстро сбегается[a], запретил нечистому духу, сказав ему: «Немой и глухой дух! Я приказываю тебе: выйди из него и больше в него не входи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что толпа сбегается со всех сторон». Греческий глагол указывает на быстрое схождение людей к одному месту.'
    reason: Лексическая альтернатива уточняет заложенные в ἐπισυντρέχω движение и быстроту.
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Но Иисус, увидев
  rationale: Аористное причастие передаёт обстоятельство, предшествующее главному действию, а δέ — мягкий повествовательный переход. Такая конструкция естественна для современного русского языка.
- source_word: ἐπισυντρέχει ὄχλος
  choice: народ быстро сбегается
  rationale: Глагол ἐπισυντρέχω описывает быстрое схождение людей к одному месту; «сбегается» сохраняет и движение, и срочность, выраженные греческим глаголом.
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: В евангельском контексте ἐπιτιμάω обозначает властное пресечение или запрещение. «Запретил» естественно сочетается с адресатом в дательном падеже и сохраняет силу действия.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: нечистому духу
  rationale: «Нечистый дух» — точная и устойчивая передача евангельского обозначения личного демонического существа без замены его расплывчатым понятием болезни или зла.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Дух немой и глухой!
  rationale: Именительный с артиклем выполняет функцию обращения. Раздельные определения «немой» и «глухой» сохраняют оба свойства, названные в оригинале.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: Я приказываю тебе
  rationale: ἐπιτάσσω выражает властное повеление, а явное ἐγώ подчёркивает говорящего; русское «Я приказываю тебе» сохраняет это ударение без добавочного толкования.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: выйди из него
  rationale: Прямой повелительный оборот точно передаёт экзорцистскую формулу и направленность действия.
- source_word: καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: и больше в него не входи
  rationale: μηκέτι запрещает повторение действия в дальнейшем. Русская формулировка ясно и естественно передаёт окончательный запрет на возвращение.
theological_decisions:
- issue: Обозначение демонического существа и власти Иисуса
  choice: Сохранены выражения «нечистый дух», «запретил» и «Я приказываю тебе»
  alternative: «злой дух»; «строго сказал»; ослабление текста до описания болезни
  rationale: Греческий текст представляет дух как личного адресата властного приказа Иисуса. Перевод не сводит повествование к медицинскому описанию и не добавляет к нему догматических пояснений.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, с сохранением краткости и властного тона прямой речи. «Народ» здесь означает собиравшуюся толпу, а не этническую общность.
