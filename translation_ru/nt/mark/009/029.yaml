base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: ru
  text: 'И Он сказал им: «Этот род нельзя изгнать ничем, кроме молитвы[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые более поздние рукописи добавляют: «и поста».'
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Этот род
  rationale: Греческое γένος обозначает здесь разряд или вид; контекст указывает на нечистого духа, однако слово «дух» в самой фразе не повторяется, поэтому краткость и некоторая неоднозначность оригинала сохранены.
- source_word: ἐν οὐδενὶ
  choice: ничем
  rationale: Сочетание выражает средство; русское «ничем» естественно передаёт отрицание любого иного средства.
- source_word: δύναται ἐξελθεῖν
  choice: нельзя изгнать
  rationale: Буквально речь идёт о невозможности для этого рода «выйти». В контексте изгнания нечистого духа безличная конструкция «нельзя изгнать» звучит естественно по-русски и сохраняет смысл, не вводя нового действующего лица.
- source_word: εἰ μὴ
  choice: кроме
  rationale: Оборот вводит единственное исключение и естественно сочетается по-русски с предшествующим отрицанием.
- source_word: ἐν προσευχῇ
  choice: молитвы
  rationale: Предложная конструкция обозначает средство. В русском оборот «ничем, кроме молитвы» ясно и естественно передаёт инструментальный смысл.
theological_decisions:
- issue: Включать ли слова «и поста»
  choice: В основном тексте только «молитвы»
  alternative: «молитвы и поста»
  rationale: В предоставленном тексте SBLGNT стоит только προσευχῇ («молитвой»). Более длинное чтение с добавлением «и постом» засвидетельствовано в части более поздней рукописной традиции, поэтому оно отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
