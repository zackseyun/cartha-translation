  source_fidelity: 'В начале стиха καί означает «и», а не противопоставительное «но». Главное отклонение — συνεσπάραξεν имеет подлежащим «дух» и является переходным глаголом: дух вызвал у мальчика судороги. В черновике это действие передано как самостоятельное начало судорог у мальчика, отчего явная причинная связь ослаблена.'
  naturalness: «Вызвал у него судороги» — современная литературная и ясная русская конструкция; она точно выражает действие духа, не прибегая к неестественному обороту «свёл его судорогой». «Катался, испуская пену» допустимо и не добавляет уточнения «изо рта».
  terminology: «Дух» верно сохраняет τὸ πνεῦμα без внесения определения «нечистый» или замены на «бес». Заглавные местоимения, относящиеся к Иисусу, могут быть сохранены как редакционный способ устранить двусмысленность.
