source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: ru
  text: И привели его к Нему. Как только дух увидел Его, он тотчас вызвал у него судороги; упав на землю, он катался, испуская пену.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν
  choice: привели
  rationale: В данном контексте форма φέρω означает, что мальчика доставили к Иисусу; «привели» естественно звучит в русском повествовании и не предполагает без необходимости, что его несли.
- source_word: πρὸς αὐτόν
  choice: к Нему
  rationale: Предлог πρός с винительным обозначает движение к человеку; прописная буква помогает различить Иисуса и мальчика при двух местоимениях подряд.
- source_word: ἰδὼν αὐτὸν
  choice: как только дух увидел Его
  rationale: Аористное причастие передано временной конструкцией; «как только» в сочетании с εὐθύς естественно выражает немедленную реакцию.
- source_word: τὸ πνεῦμα
  choice: дух
  rationale: Сохранено простое обозначение данного стиха без добавления слов «нечистый» или «бес», хотя характер духа ясен из контекста.
- source_word: εὐθὺς
  choice: тотчас
  rationale: «Тотчас» передаёт немедленность и сохраняет достойный современный повествовательный регистр.
- source_word: συνεσπάραξεν αὐτόν
  choice: он тотчас стал биться в судорогах
  rationale: Греческий глагол обозначает сильные судороги. Перестройка в непереходную русскую конструкцию устраняет неестественное «дух свёл его судорогой», сохраняя причинную связь через контекст.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: упав на землю
  rationale: Причастная конструкция сохраняет форму и последовательность греческого текста, при этом субъектом естественно понимается мальчик.
- source_word: ἐκυλίετο
  choice: катался
  rationale: Несовершенный вид передаёт продолженное движение, выраженное греческим имперфектом.
- source_word: ἀφρίζων
  choice: испуская пену
  rationale: Передаёт состояние мальчика без добавления отсутствующего в греческом уточнения «изо рта».
theological_decisions:
- issue: Идентификация τὸ πνεῦμα
  choice: В основном тексте переведено как «дух».
  alternative: «нечистый дух» или «бес»
  rationale: В более широком контексте речь идёт о нечистом духе, однако в самом стихе стоит только τὸ πνεῦμα; перевод не добавляет богословски верное, но здесь не выраженное определение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавное «Нему/Его» использовано прежде всего для ясного различения Иисуса и мальчика. Синтаксис слегка перестроен ради естественности русского языка, без устранения причинной связи между действием духа и судорогами мальчика.
