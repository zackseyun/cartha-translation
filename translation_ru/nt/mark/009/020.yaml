  rationale: Исправлены союз, чтобы не создавать отсутствующего в оригинале противопоставления, и передача συνεσπάραξεν, чтобы прямо сохранить действие духа по отношению к мальчику. Причастные конструкции и отсутствие добавленного уточнения о месте появления пены сохранены.
