source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: ru
  text: И если твоя рука вводит тебя в грех[a], отсеки её. Лучше тебе увечным войти в жизнь, чем с обеими руками отправиться в геенну[b], в неугасимый огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставляет тебя споткнуться». Греческий глагол может означать, что кто-либо становится причиной преткновения, падения или греха.'
    reason: lexical_alternative
  - marker: b
    text: Геенна — греческая форма названия места, связанного с образом Божьего суда; традиционный перевод — «ад».
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: вводит тебя в грех
  rationale: Глагол обозначает действие, которое заставляет споткнуться, пасть или согрешить. В современном русском буквальное «заставляет споткнуться» применительно к руке звучит неясно; выбранный вариант естественно передаёт смысл в контексте предупреждения, а образ спотыкания отмечен в сноске.
- source_word: ἀπόκοψον
  choice: отсеки её
  rationale: Сильный и конкретный императив сохранён без смягчения; «отсеки» точно передаёт отделение части тела и соответствует торжественно-предупредительному регистру.
- source_word: καλόν
  choice: лучше
  rationale: 'В конструкции сопоставления с ἢ слово имеет сравнительный смысл: «лучше», хотя буквально означает «хорошо».'
- source_word: κυλλόν
  choice: без руки
  rationale: κυλλός указывает на увечье или отсутствие части тела. Контекст прямо говорит об отсечённой руке, поэтому «без руки» точно, понятно и не использует потенциально уничижительное обозначение человека.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: войти в жизнь
  rationale: Сохранено эсхатологическое выражение и направленность εἰς; русское «войти в жизнь» звучит естественно и торжественно.
- source_word: ἀπελθεῖν
  choice: отправиться
  rationale: Передаёт движение прочь и сохраняет противопоставление «войти в жизнь — отправиться в геенну».
- source_word: γέενναν
  choice: геенну
  rationale: Сохранено конкретное греческое наименование, связанное с ветхозаветно-иудейским образом суда, без сведения его к более широкому богословскому термину «ад».
- source_word: ἄσβεστον
  choice: неугасимый
  rationale: Точно передаёт огонь, который не угасает или не может быть погашен, и является естественным русским сочетанием.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: с обеими руками
  rationale: Естественная русская передача причастного оборота, сохраняющая явное противопоставление отсутствию одной руки.
theological_decisions:
- issue: Передача γέεννα в изречении о суде
  choice: геенна
  alternative: ад
  rationale: Транслитерация сохраняет конкретный историко-библейский образ и не подменяет его более широким позднейшим термином; традиционный эквивалент указан в сноске.
- issue: Сила образа отсечения руки
  choice: сохранить конкретный телесный образ без смягчающего толкования
  alternative: перефразировать как общее устранение причин греха
  rationale: Текст использует намеренно резкий образ; перевод не должен заранее объяснять его или ослаблять риторическую силу.
- issue: Смысл σκανδαλίζῃ
  choice: вводит тебя в грех
  alternative: заставляет тебя споткнуться
  rationale: В контексте суда речь допускает нравственное падение, но исходная метафора шире; поэтому ясный русский смысл дан в тексте, а образная и лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и резким звучанием предупреждения. Местоимения, относящиеся к человеку, написаны со строчной буквы. Сохранены конкретная телесная образность, эсхатологическое «войти в жизнь» и термин «геенна».
