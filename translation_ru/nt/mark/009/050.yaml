base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: ru
  text: Соль хороша. Но если соль станет несолёной, чем вы её приправите? Имейте в себе соль[a] и живите в мире друг с другом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ «имейте в себе соль» допускает разные толкования — например, чистоту, мудрость, верность завету или благотворное влияние, — но здесь его смысл прямо не уточняется.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: хорошо
  rationale: Широкая положительная оценка передана естественно и без сужения смысла до одной лишь пользы.
- source_word: ἅλας / ἅλα
  choice: соль
  rationale: Образ соли последовательно сохранён, в том числе в повелении, без истолковывающей подстановки.
- source_word: ἄναλον γένηται
  choice: станет несолёной
  rationale: Передаёт изменение состояния и сохраняет греческую игру слов «соль — несолёная»; необычность выражения соответствует парадоксальности исходного образа.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: чем вы придадите ей вкус?
  rationale: ἀρτύω обозначает приправление; русская формулировка естественно передаёт вопрос о средстве и сохраняет кулинарный образ.
- source_word: ἔχετε ἐν ἑαυτοῖς
  choice: имейте в себе
  rationale: Сохранены прямое повеление и внутренне направленный образ рефлексивной конструкции, без сведения его к конкретному толкованию.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: будьте в мире друг с другом
  rationale: Естественная современная русская передача продолжающегося взаимного мирного отношения.
theological_decisions:
- issue: Смысл соли в повелении
  choice: 'Сохранить метафору: «Имейте в себе соль»'
  alternative: Раскрыть её как чистоту, мудрость, верность завету или благотворное влияние
  rationale: Сам стих прямо не определяет значение метафоры, поэтому перевод не должен закреплять одно богословское истолкование.
- issue: Последнее повеление о мире
  choice: «будьте в мире друг с другом»
  alternative: «живите в мире друг с другом»
  rationale: Выбран прямой и естественный эквивалент εἰρηνεύετε; он передаёт состояние и практику мира, не добавляя смысловых компонентов.
translation_notes:
  register: Современный литературный русский язык с лаконичной афористичностью. Сохранены повтор «соль» и намеренно парадоксальное «станет несолёной»; богословская неоднозначность метафоры не устранена.
