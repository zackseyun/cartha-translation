  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: ru
  text: 'Иисус сказал ему: «„Если можешь“?[a] Всё возможно тому, кто верит[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Это — „если можешь“?» Иисус повторяет слова отца из предыдущего стиха и ставит их под вопрос.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тому, кто доверяет»; «тому, у кого есть вера».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: «Если можешь»?
  rationale: Артикль τό вводит повтор слов отца из предыдущего стиха; вопросительное оформление естественно передаёт, что Иисус подхватывает и оспаривает его условие.
- source_word: δύνῃ
  choice: можешь
  rationale: Обычное и естественное соответствие δύναμαι в прямой речи.
- source_word: πάντα
  choice: всё
  rationale: Передаёт собирательный смысл среднего рода множественного числа и звучит естественно по-русски.
- source_word: δυνατά
  choice: возможно
  rationale: В данной именной конструкции δυνατός обозначает возможность.
- source_word: τῷ πιστεύοντι
  choice: тому, кто верит
  rationale: Дательный падеж и субстантивированное причастие переданы без превращения выражения в устойчивое наименование «верующий»; настоящее время сохраняет общий характер высказывания.
theological_decisions:
- issue: Объём утверждения «всё возможно»
  choice: Сохранено краткое и безусловно звучащее утверждение без поясняющего добавления.
  alternative: «Всё возможно с Богом для того, кто верит» или иное явное ограничение контекстом Божьей силы.
  rationale: В греческом тексте здесь нет слов «с Богом». Их добавление сняло бы намеренную напряжённость и ослабило риторическую силу высказывания.
- issue: Оттенок πιστεύοντι
  choice: «тому, кто верит»
  alternative: «тому, кто доверяет»; «тому, у кого есть вера»
  rationale: Основное значение глагола πιστεύω сохранено в тексте, а возможные оттенки доверия и веры отмечены в сноске без навязывания одного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная реплика. Вложенные кавычки показывают, что Иисус повторяет слова собеседника. Порядок маркеров соответствует месту поясняемых выражений.
