  terminology: «Ученики», «изгнать» и «дух» в сноске терминологически последовательны и понятны. Сноска корректно объясняет, что русская форма «его» допускает оба референта, при этом отмечая предпочтительную связь греческого среднего рода с πνεῦμα. Она не навязывает доктринального вывода.
