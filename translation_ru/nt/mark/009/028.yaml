source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: ru
  text: 'Когда Он вошёл в дом, ученики наедине спрашивали Его: «Почему мы не смогли изгнать его[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое местоимение среднего рода естественнее относится к духу (греч. πνεῦμα — среднего рода), а не к мальчику. В русском языке «его» может указывать и на духа, и на мальчика.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Когда Он вошёл
  rationale: Аористное причастие в конструкции genitivus absolutus задаёт предшествующий временной фон; по-русски естественно передаётся придаточным времени.
- source_word: εἰς οἶκον
  choice: в дом
  rationale: Хотя существительное в греческом без артикля, контекст указывает на определённое место; русское «в дом» естественно и не требует добавления указательного оттенка.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ученики
  rationale: «Ученики» — точная и устоявшаяся передача μαθηταί; местоименная принадлежность в русском ясна из контекста и следующего «Его».
- source_word: κατ’ ἰδίαν
  choice: наедине
  rationale: Передаёт разговор отдельно от остальных и звучит естественно в современном литературном русском.
- source_word: ἐπηρώτων
  choice: спрашивали
  rationale: Несовершенный вид передаёт имперфект как разворачивающееся действие, не навязывая непременно многократности.
- source_word: Ὅτι
  choice: Почему
  rationale: В данном вопросительном употреблении ὅτι идиоматически обозначает причину.
- source_word: οὐκ ἠδυνήθημεν
  choice: мы не смогли
  rationale: Естественно выражает отсутствие способности совершить конкретное действие в прошлом.
- source_word: ἐκβαλεῖν
  choice: изгнать
  rationale: В контексте нечистого духа «изгнать» точно передаёт ἐκβάλλω и сохраняет экзорцистский смысл без архаической тяжеловесности.
- source_word: αὐτό
  choice: его
  rationale: Русское грамматическое согласование требует мужского рода при подразумеваемом «дух»; местоимение сохраняется без вставки отсутствующего в стихе существительного.
theological_decisions:
- issue: Референт конечного местоимения αὐτό
  choice: Местоимение относится к нечистому духу; по-русски — «его», поскольку слово «дух» мужского рода.
  alternative: 'Местоимение может быть понято как относящееся к мальчику: «его».'
  rationale: Греческая форма среднего рода естественнее соотносится с πνεῦμα «дух», также среднего рода, и именно дух является объектом глагола «изгнать». Однако русская форма «его» сама по себе не различает духа и мальчика, поэтому неоднозначность и предпочтительный референт поясняются в сноске.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Заглавные буквы в местоимениях «Он», «Его» следуют принятой русской библейской традиции. Синтаксис сохраняет последовательность исходного повествования без излишней буквальности.
