  source_fidelity: Перевод точно передаёт временной фон генитива абсолютного («Когда Он вошёл»), направление εἰς οἶκον («в дом»), приватность κατ’ ἰδίαν («наедине»), имперфект ἐπηρώτων («спрашивали») и вопросительное Ὅτι («Почему»). «Изгнать» уместно передаёт ἐκβαλεῖν в экзорцистском контексте. Русское «его» неизбежно не воспроизводит среднего рода греческого αὐτό, но не добавляет отсутствующего существительного и сопровождено необходимым пояснением.
