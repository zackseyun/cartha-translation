source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: ru
  text: А кто станет причиной падения одного из этих малых, верующих в Меня, тому было бы лучше, если бы ему на шею повесили жернов, приводимый в движение ослом[a], и бросили его в море.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ослиный жернов»; то есть большой жернов, приводимый в движение ослом.'
    reason: lexical_clarification
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: введёт в грех
  rationale: Глагол обозначает действие, ведущее другого к греху или отпадению. Русское «введёт в грех» естественно передаёт тяжесть предупреждения; буквальное «заставит споткнуться» без пояснения может быть понято как физическое действие.
- source_word: μικρῶν τούτων
  choice: этих малых
  rationale: 'Выражение сохраняет широту греческого: речь может включать детей, уязвимых или незначительных в глазах людей учеников, а не только малолетних.'
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: верующих в Меня
  rationale: Прямо и привычно передаёт причастную конструкцию и её личный объект.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: тому было бы лучше
  rationale: Естественный русский способ передать сравнительное преимущество в контексте сурового предостережения.
- source_word: μύλος ὀνικός
  choice: мельничный жернов, который вращает осёл
  rationale: Греческое выражение обозначает большой жернов, приводимый в движение ослом, в отличие от ручного жернова. Развёрнутая передача ясна современному читателю.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: ему на шею надели
  rationale: Естественно передаёт помещение тяжёлого предмета вокруг шеи, не усиливая образ сверх исходного текста.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: бросили его в море
  rationale: Русская форма согласована с условно-сравнительной конструкцией «было бы лучше, если бы» и передаёт результативную силу греческого перфекта.
theological_decisions:
- issue: Кого обозначают «эти малые»
  choice: 'Формулировка оставлена широкой: «эти малые, верующие в Меня».'
  alternative: «эти дети» или «эти смиренные ученики»
  rationale: Уточнение «верующих в Меня» не позволяет уверенно ограничить выражение только детьми; перевод сохраняет возможность понимать его как уязвимых или малозначимых в глазах мира верующих.
- issue: Смысл σκανδαλίσῃ
  choice: «введёт в грех»
  alternative: «заставит споткнуться» или «станет причиной отпадения»
  rationale: Контекст содержит серьёзную духовно-нравственную угрозу. «Введёт в грех» передаёт её без сужения до окончательного отпадения, хотя несколько ослабляет исходную метафору преткновения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавная буква в «Меня» следует принятой русской практике для местоимения, относящегося ко Христу. Синтаксис сохраняет резкость исходного предупреждения.
