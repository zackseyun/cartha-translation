review_pass:
  verdict: revise
  source_fidelity: 'Нужно убрать добавленное слово «учеников»: τοὺς δώδεκα обозначает группу «Двенадцать», но в данном стихе не содержит существительного «ученики». Будущее ἔσται точнее передать формой «будет», а не побудительным «пусть будет». Оборот πάντων διάκονος естественно и близко к оригиналу передаётся как «слугой всем».'
  naturalness: «Двенадцать» с прописной буквы — естественное русское обозначение известной группы. «Сев, он…» сохраняет связь предшествующего действия с последующим и звучит литературно. «Слугой всем» кратко и ясно выражает служение каждому, не создавая оттенка принадлежности, возможного у «слугой всех».
  terminology: διάκονος передано нетитульным словом «слуга», что соответствует контексту. «Двенадцать» сохраняет обозначение группы без не имеющегося в греческом уточнения «ученики».
  issues:
  - severity: medium
    issue: Добавлено «учеников»
    rationale: В греческом тексте стоит только «Двенадцать» (τοὺς δώδεκα); хотя референт понятен из контекста, добавление не требуется и снижает формальную точность.
  - severity: medium
    issue: Будущее ἔσται передано побудительной формой «пусть будет»
    rationale: Будущее изъявительного наклонения в изречении следует сохранять как «будет»; нормативный смысл контекста не требует грамматически заменять его русским повелительным оборотом.
  - severity: low
    issue: «слугой для всех» менее прямо передаёт πάντων διάκονος
    rationale: «Слугой всем» естественно передаёт направленность служения всем людям и ближе к генитиву πάντων.
  revised_text: 'Сев, он позвал Двенадцать и говорит им: «Кто хочет быть первым, будет последним из всех и слугой всем».'
