source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: ru
  text: 'Сев, он позвал Двенадцать и говорит им: «Кто хочет быть первым, будет последним из всех и слугой всем».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: Сев
  rationale: Естественно и точно передаёт аористное причастие, обозначающее действие перед обращением к двенадцати.
- source_word: ἐφώνησεν
  choice: позвал
  rationale: В данном контексте означает, что Иисус подозвал к Себе двенадцать учеников; «позвал» звучит ясно и естественно.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого текста, оживляющее повествование.
- source_word: πρῶτος
  choice: первым
  rationale: Сохраняет смысл первенства или высшего положения без дополнительного толкования.
- source_word: ἔσται
  choice: пусть будет
  rationale: В условном изречении форма будущего передаёт требование, предъявляемое желающему быть первым; русское побуждение естественно выражает эту силу высказывания.
- source_word: πάντων ἔσχατος
  choice: последним из всех
  rationale: Передаёт оба элемента выражения и сохраняет парадоксальное противопоставление «первым — последним».
- source_word: πάντων διάκονος
  choice: слугой для всех
  rationale: «Слуга» передаёт обычное, не титульное значение διάκονος, а «для всех» естественно выражает направленность служения всем.
theological_decisions:
- issue: Смысл формы будущего ἔσται в изречении Иисуса
  choice: пусть будет
  alternative: будет
  rationale: 'Контекст наставления допускает и, вероятно, предполагает нормативную силу: путь к первенству состоит в добровольном принятии последнего места и служении всем. При этом перевод не добавляет конфессионального толкования.'
- issue: Значение διάκονος
  choice: слугой
  alternative: служителем
  rationale: Здесь слово обозначает роль служащего другим, а не церковную должность; «слуга» лучше сохраняет конкретность и радикальность высказывания.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Историческое настоящее «говорит» сохранено вслед за греческим текстом; «двенадцать учеников» употреблено для естественной русской понятности обозначения группы.
