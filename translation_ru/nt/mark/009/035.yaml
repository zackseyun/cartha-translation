- from: 'Сев, Он позвал двенадцать учеников и говорит им: «Кто хочет быть первым, пусть будет последним из всех и слугой для всех».'
  to: 'Сев, он позвал Двенадцать и говорит им: «Кто хочет быть первым, будет последним из всех и слугой всем».'
  rationale: Исправление устраняет добавленное определение, сохраняет историческое настоящее «говорит», передаёт будущее ἔσται будущим временем и уточняет русскую связь «слуга — всем» без изменения смысла.
