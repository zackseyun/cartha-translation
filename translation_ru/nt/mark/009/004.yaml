  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: ru
  text: Илия явился им вместе с Моисеем, и они беседовали с Иисусом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разговаривали с Иисусом».'
    reason: 'Лексическая альтернатива для συλλαλοῦντες: «беседовали» и «разговаривали» передают взаимный характер речи с небольшим различием регистра.'
lexical_decisions:
- source_word: ὤφθη
  choice: явились
  rationale: Аорист пассивной формы ὁράω здесь имеет значение появления, становления видимыми. Русское «явились» естественно передаёт внезапное появление; множественное число обусловлено составным субъектом «Илия с Моисеем» в русском предложении.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж прямо обозначает тех, кому явились Илия и Моисей.
- source_word: Ἠλίας σὺν Μωϋσεῖ
  choice: Илия с Моисеем
  rationale: Сохраняются традиционные русские формы библейских имён; предлог «с» естественно передаёт совместность, выраженную σὺν.
- source_word: ἦσαν συλλαλοῦντες
  choice: беседовали
  rationale: Перифрастическая конструкция передаёт продолжавшееся в тот момент взаимное общение. «Беседовали» ясно выражает разговор между участниками и соответствует литературному повествовательному регистру.
- source_word: τῷ Ἰησοῦ
  choice: с Иисусом
  rationale: При глаголе взаимного разговора дательный обозначает собеседника; по-русски это естественно передаётся творительным падежом с предлогом «с».
theological_decisions:
- issue: Характер появления Илии и Моисея при преображении
  choice: Передать их появление и беседу с Иисусом как прямо изложенное повествовательное событие
  alternative: Уточнить, что это было лишь видение или символическое представление
  rationale: Греческий текст без оговорок сообщает об их появлении и беседе. Перевод не должен ни ослаблять реальность описания, ни добавлять отсутствующее в тексте доктринальное объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Беседовали» несколько возвышеннее разговорного «разговаривали», но остаётся понятным обычному читателю. Маркер сноски поставлен после той фразы, к которой относится лексическая альтернатива.
