source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: ru
  text: Где бы ни схватывал его дух, он бросает мальчика на землю; у мальчика идёт пена, он скрежещет зубами и цепенеет[a]. Я сказал твоим ученикам, чтобы они изгнали его, но они не смогли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высыхает», «иссыхает»; точный оттенок греческого слова в этом контексте неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: где бы … ни
  rationale: 'Сочетание передаёт неопределённое обстоятельство: это происходит всякий раз, в каком бы месте дух ни овладел мальчиком. Русская конструкция «где бы … ни» сохраняет пространственный оттенок оригинала.'
- source_word: καταλάβῃ
  choice: овладел
  rationale: Глагол обозначает, что враждебный дух захватывает мальчика и получает над ним власть; «овладел» естественно передаёт это в данном контексте.
- source_word: ῥήσσει
  choice: бросает его наземь
  rationale: В контексте припадка глагол описывает резкое, насильственное повержение мальчика. Такой перевод ясен и не создаёт ошибочного впечатления, будто дух разрывает его тело.
- source_word: ἀφρίζει
  choice: испускает пену
  rationale: Передаёт физический симптом без добавления отсутствующего в греческом тексте уточнения «изо рта».
- source_word: τρίζει τοὺς ὀδόντας
  choice: скрежещет зубами
  rationale: Точно и естественно передаёт буквальное действие, описанное греческим выражением.
- source_word: ξηραίνεται
  choice: цепенеет
  rationale: По последовательности телесных симптомов слово, вероятно, описывает оцепенение или неподвижность тела. Поскольку буквальное значение связано с высыханием или иссыханием, эта неоднозначность сохранена в сноске.
- source_word: εἶπα … ἵνα
  choice: сказал … чтобы
  rationale: Формально и естественно передаёт просьбу или поручение отца ученикам, не усиливая глагол до однозначного «приказал».
- source_word: ἐκβάλωσιν
  choice: изгнали
  rationale: Обычное русское обозначение удаления нечистого духа; сохраняет экзорцистский смысл глагола.
- source_word: οὐκ ἴσχυσαν
  choice: не смогли
  rationale: Кратко и точно передаёт отсутствие способности или силы совершить требуемое.
theological_decisions:
- issue: К кому относится αὐτό в выражении «изгнали его»
  choice: Местоимение относится к нечистому духу, мучившему мальчика.
  alternative: Его можно было бы понять более обобщённо — как указание на недуг.
  rationale: Ближайший контекст говорит о духе, который овладевает мальчиком и которого ученики пытались изгнать. Русское мужское местоимение согласовано со словом «дух», подразумеваемым из контекста.
- issue: Смена действующего лица после «бросает его наземь»
  choice: Слово «мальчик» добавлено для ясного указания, что пенится, скрежещет зубами и цепенеет именно мальчик.
  alternative: Сохранить последовательность местоимений без явного называния мальчика.
  rationale: В греческом смена подлежащего понятна из смысла, но в русском цепочка мужских местоимений могла бы ошибочно приписать симптомы духу. Уточнение не разрешает богословскую неоднозначность, а предотвращает грамматическую неясность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествованием. Сохранены резкость описания и экзорцистский контекст; устаревшие обороты и конфессионально окрашенная терминология не использованы.
