  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: ru
  text: И много раз он бросал его и в огонь, и в воду[a], чтобы погубить его. Но, если Ты можешь что-нибудь сделать, помоги нам, сжалившись над нами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в воды»; в греческом тексте здесь множественное число.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сострадая нам»; «проявив к нам милость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: много раз
  rationale: Передаёт повторяемость случаев естественным современным русским выражением.
- source_word: ἔβαλεν
  choice: бросал
  rationale: Несовершенный вид естественно выражает неоднократное действие, хотя в греческом употреблён аорист, обобщающий повторявшиеся случаи.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: то в огонь, то в воду
  rationale: Русская парная конструкция ясно передаёт повторяющееся попадание в разные опасные среды; единственное число «в воду» звучит естественно, а греческое множественное число отмечено в сноске.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: чтобы погубить
  rationale: Сохраняет значение цели и широкий разрушительный смысл ἀπόλλυμι, не сужая его до одного лишь «убить»; объект понятен из ближайшего контекста.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Но если Ты что-нибудь можешь
  rationale: Сохраняет неопределённое τι и нерешительность отца, не смягчая напряжение высказывания.
- source_word: βοήθησον ἡμῖν
  choice: помоги нам
  rationale: Прямо и естественно передаёт настоятельную просьбу о немедленной помощи.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: сжалься над нами
  rationale: Естественно передаёт глубокое сострадание и направленность действия на просителей; при согласовании с повелением причастие идиоматично выражено повелительной формой.
theological_decisions:
- issue: Неуверенность отца в способности Иисуса помочь
  choice: «если Ты что-нибудь можешь»
  alternative: «если можешь»; «если Ты в силах что-либо сделать»
  rationale: Греческий текст прямо сохраняет сомнение и неопределённое τι; перевод не превращает просьбу в более уверенное исповедание.
- issue: Соотношение сострадания и помощи в просьбе
  choice: «сжалься над нами и помоги нам»
  alternative: «помоги нам, сжалившись над нами»
  rationale: 'Такой порядок естественнее по-русски и сохраняет обе смысловые составляющие: внутреннее сострадание и последующую помощь, не вводя дополнительного богословского толкования.'
translation_notes:
  register: Современный литературный русский язык с прямой, эмоционально напряжённой речью отца. Местоимение «Ты» в обращении к Иисусу написано с прописной буквы по принятой русской библейской издательской традиции; это не меняет смысла исходного текста.
