    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкое противопоставление между заключением окружающих, что мальчик умер, и последующим действием Иисуса.
- source_word: κρατήσας
  choice: взял
  rationale: В сочетании с родительным τῆς χειρὸς естественно передаётся по-русски как «взял за руку»; сохраняется конкретное физическое действие без излишне резкого оттенка «схватил».
- source_word: τῆς χειρὸς αὐτοῦ
  choice: его за руку
  rationale: Естественная русская конструкция при глаголе «взять» точно сохраняет указание на руку.
- source_word: ἤγειρεν
  choice: поднял
  rationale: В данном контексте означает, что Иисус поднял лежавшего мальчика. Выбор не превращает эпизод в повествование о воскресении, тогда как более широкий диапазон греческого глагола отмечен в сноске.
- source_word: ἀνέστη
  choice: он встал
  rationale: Ясно и современно передаёт последовавшее действие мальчика; сноска сохраняет возможный более формальный вариант.
theological_decisions:
- issue: Возможный отзвук лексики воскресения в ἤγειρεν и ἀνέστη
  choice: В основном тексте употреблены обычные контекстуальные выражения «поднял» и «встал», а более широкий смысловой диапазон отмечен в сносках.
  alternative: «Воздвиг его, и он восстал», что сильнее подчёркивало бы словесную перекличку с воскресением.
  rationale: Непосредственно речь идёт о том, как Иисус поднимает мальчика после изгнания духа, а не прямо о воскресении из мёртвых. При этом сноски не скрывают того, что оба греческих глагола могут употребляться и в контекстах воскресения.
translation_notes:
  register: Современный литературный русский язык с простым и достоинственным повествовательным строем. Формулировка «взял его за руку» естественнее буквального «взявшись за его руку», а «встал» избегает архаического оттенка слова «восстал».
