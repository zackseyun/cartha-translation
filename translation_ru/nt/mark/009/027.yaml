  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: ru
  text: Но Иисус взял его за руку и поднял его[a], и тот встал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставил на ноги». Греческий глагол может также употребляться, когда говорится о пробуждении ото сна или воскресении из мёртвых.'
