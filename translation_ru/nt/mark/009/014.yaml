  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: ru
  text: Когда они пришли к ученикам, то увидели вокруг них большую толпу и книжников, споривших с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: когда они подошли к остальным ученикам
  rationale: Аористное причастие естественно передано придаточным времени. «Остальным» ясно показывает, что Иисус и трое сопровождавших Его подошли к ученикам, оставшимся внизу, не изменяя референта греческого выражения.
- source_word: εἶδον
  choice: увидели
  rationale: Простой повествовательный аорист ὁράω передан обычным русским глаголом совершенного вида.
- source_word: ὄχλον πολύν
  choice: большую толпу
  rationale: Прямо передаёт количественное значение πολύς и звучит естественно в современном русском повествовании.
- source_word: περὶ αὐτούς
  choice: вокруг них
  rationale: περί с винительным имеет здесь пространственное значение; местоимение относится к ученикам.
- source_word: γραμματεῖς
  choice: книжников
  rationale: Традиционный и точный русский евангельский термин для иудейских знатоков и толкователей Писания и Закона.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: споривших с ними
  rationale: В данном конфликтном контексте συζητέω означает не нейтральное обсуждение, а спор; πρὸς αὐτούς естественно передано как «с ними», причём местоимение относится к ученикам.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Причастная конструкция «книжников, споривших» сохраняет структуру и одновременность греческого описания; двукратное «них/ними» естественно и ясно отсылает к ученикам.
