  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: ru
  text: Когда они спускались с горы, Он велел им никому не рассказывать о том, что они видели, до тех пор, пока Сын Человеческий не воскреснет из мёртвых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кроме как когда Сын Человеческий воскреснет из мёртвых».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταβαινόντων
  choice: когда они спускались
  rationale: Причастие настоящего времени в родительном самостоятельном обороте обозначает одновременное продолжающееся действие; эта формулировка естественна по-русски.
- source_word: ὄρους
  choice: с горы
  rationale: ὄρος обычно означает гору и соответствует месту преображения в повествовании.
- source_word: διεστείλατο
  choice: велел
  rationale: Глагол передаёт твёрдое распоряжение; «велел» сохраняет его силу и звучит естественно в современном русском языке.
- source_word: ἵνα μηδενὶ
  choice: никому не рассказывать
  rationale: Естественно передаёт содержание распоряжения и отрицательное μηδενί — «никому».
- source_word: ἃ εἶδον
  choice: о том, что они видели
  rationale: Передаёт субстантивированное относительное выражение и ясно отсылает к уже увиденному событию.
- source_word: διηγήσωνται
  choice: рассказывать
  rationale: Глагол означает подробно излагать или повествовать; «рассказывать» уместно и не утяжеляет фразу.
- source_word: εἰ μὴ ὅταν
  choice: кроме как тогда, когда
  rationale: Сохраняет буквальную форму исключения, привязанного к будущему моменту, не сводя её без оговорки к «пока не».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшийся русский перевод самообозначения Иисуса сохраняет титульный характер и ветхозаветную аллюзию.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Передаёт воскресение из среды умерших; русская формула естественна и сохраняет значение греческого выражения.
- source_word: ἀναστῇ
  choice: воскреснет
  rationale: Аорист конъюнктива после ὅταν обозначает будущее относительно распоряжения событие, рассматриваемое как наступившее к указанному моменту.
theological_decisions:
- issue: Передача ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человеческий Сын
  rationale: Традиционная формула понятна современному читателю и сохраняет титульную и вероятную даниилову окраску выражения.
- issue: Временное значение εἰ μὴ ὅταν
  choice: кроме как тогда, когда Сын Человеческий воскреснет
  alternative: пока Сын Человеческий не воскреснет
  rationale: Основной текст сохраняет формальное исключение греческой конструкции; более идиоматическое временное понимание отмечено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прописное «Он» применено к Иисусу согласно распространённой русской библейской издательской традиции. Формулировка «кроме как тогда, когда» несколько отмеченная, но намеренно сохраняет структуру εἰ μὴ ὅταν; идиоматический вариант вынесен в сноску.
