lexical_decisions:
- source_word: ὅπου
  choice: где
  rationale: Прямо и естественно передаёт относительное наречие места, вводящее описание.
- source_word: ὁ σκώληξ αὐτῶν
  choice: их червь
  rationale: Сохраняет конкретный образ и греческую притяжательную конструкцию; «червь» достаточно широко по значению и поддерживает связь с Ис 66:24, не уточняя вид личинки.
- source_word: οὐ τελευτᾷ
  choice: не умирает
  rationale: При подлежащем «червь» это естественная передача глагола τελευτάω; она сохраняет резкость образа, хотя буквально возможно также «не приходит к концу».
- source_word: τὸ πῦρ
  choice: огонь
  rationale: Прямой и общеупотребительный эквивалент без необходимости в поясняющем перифразе.
- source_word: οὐ σβέννυται
  choice: не угасает
  rationale: Естественная русская передача настоящего времени страдательной формы в отношении огня; выражает продолжающееся неугасимое состояние и сохраняет отзвук Ис 66:24.
theological_decisions:
- issue: Характер образов суда
  choice: Сохранить конкретные образы червя и огня, не истолковывая их прямо как уничтожение, сознательное мучение или исключительно метафору.
  alternative: Передать стих так, чтобы он однозначно утверждал вечное сознательное наказание, окончательное уничтожение либо лишь символические позор и осквернение.
  rationale: Сам стих использует яркий язык суда и перекликается с Ис 66:24, но не разрешает всех богословских вопросов о природе наказания. Перевод сохраняет напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Формула краткая и ритмичная; «не угасает» звучит естественнее буквального пассивного «не бывает погашен». Маркеры сносок размещены в основном тексте.
