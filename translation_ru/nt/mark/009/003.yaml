source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: ru
  text: Его одежды стали сверкающими, необычайно белыми — так не может выбелить их ни один белильщик тканей[a] на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сукновал» — мастер, очищавший и обрабатывавший ткань.'
    reason: 'Лексическая альтернатива для γναφεύς: традиционный термин точнее обозначает древнее ремесло, но менее понятен современному читателю.'
lexical_decisions:
- source_word: ἱμάτια
  choice: одежды
  rationale: Общее обозначение предметов одежды; множественное число и нейтральный современный регистр соответствуют контексту.
- source_word: ἐγένετο
  choice: стали
  rationale: Передаёт изменение состояния во время преображения; согласование во множественном числе обусловлено русским словом «одежды».
- source_word: στίλβοντα
  choice: сверкающими
  rationale: Передаёт яркий, блестящий зрительный эффект без добавления богословского истолкования.
- source_word: λευκὰ λίαν
  choice: необычайно белыми
  rationale: «Белыми» сохраняет основное значение цвета, а «необычайно» естественно и выразительно передаёт сильную степень, обозначенную λίαν.
- source_word: γναφεύς
  choice: белильщик тканей
  rationale: Понятно современному читателю передаёт относящуюся к контексту работу мастера по очистке и отбеливанию ткани, не ограничивая значение лишь стиркой.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Прямо и идиоматично обозначает предел земных человеческих возможностей.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: так не может выбелить их
  rationale: Сохраняет настоящее время, значение способности и степень результата. Местоимение «их» необходимо для естественной русской фразы и явно отсылает к одеждам.
theological_decisions:
- issue: Видимый эффект преображения
  choice: Описать сверхъестественную яркость и белизну одежд без поясняющей богословской формулы.
  alternative: Добавить выражение вроде «сияли славой».
  rationale: Стих сообщает о внешнем виде одежд, но прямо не называет это сияние славой; перевод не должен вносить отсутствующее в тексте толкование.
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и торжественно без архаизации. Тире подчёркивает переход от описания к сравнению с пределом человеческого мастерства.
