language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: ru
  text: 'Ведь он учил своих учеников и говорил им: «Сын Человеческий предаётся в руки людей[a], и они убьют его; и после того, как он будет убит, спустя три дня[b] он воскреснет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в человеческие руки». Греческий текст буквально говорит: «в руки людей».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «после трёх дней»; возможно также: «через три дня». В других местах эта формулировка употребляется наряду с выражением «на третий день».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: учил
  rationale: Русский глагол несовершенного вида передаёт продолжавшееся действие, выраженное греческим имперфектом.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим контекстом естественно для современного русского языка.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: своих учеников
  rationale: «Ученики» — устойчивое и понятное евангельское обозначение; возвратное «своих» естественно указывает на принадлежность при совпадении субъекта.
- source_word: ἔλεγεν αὐτοῖς
  choice: говорил им
  rationale: Несовершенный вид сохраняет продолжительный характер второго имперфекта и его параллельность глаголу «учил».
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача самоназвания, сохраняющая его возможную связь с Дан 7 и не сводящая выражение к простой характеристике человеческой природы.
- source_word: παραδίδοται
  choice: предаётся
  rationale: Настоящее страдательного залога представлено настоящим временем; слово сохраняет неопределённость действующего лица и может охватывать передачу во власть врагов, не ограничиваясь одним лишь предательством.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: в руки людей
  rationale: Сохраняется конкретный греческий образ передачи под власть людей и риторическое сопоставление Сына Человеческого с людьми.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: они убьют его
  rationale: Прямая и современная передача будущего времени; множественное «они» сохраняет не названных прямо человеческих исполнителей.
- source_word: ἀποκτανθεὶς
  choice: после того, как он будет убит
  rationale: Явно передаёт страдательный залог и предшествование убийства воскресению, выраженные аористным причастием.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: спустя три дня
  rationale: Передаёт обычное значение μετά с винительным — «после» — и не гармонизирует фразу с формулой «на третий день».
- source_word: ἀναστήσεται
  choice: он воскреснет
  rationale: Естественный русский непереходный глагол передаёт будущее среднее ἀναστήσεται, не превращая его в страдательное «будет воскрешён».
theological_decisions:
- issue: Значение и залог παραδίδοται
  choice: предаётся
  alternative: будет предан; отдаётся во власть
  rationale: Настоящее страдательного залога оставляет действующее лицо неназванным и допускает одновременно человеческое предательство, передачу под власть врагов и более широкую перспективу Божьего допущения; перевод не разрешает эту напряжённость.
- issue: Соотношение Ὁ υἱὸς τοῦ ἀνθρώπου и ἀνθρώπων
  choice: Сын Человеческий — в руки людей
  alternative: Сын Человеческий — в человеческие руки
  rationale: Выбранная формулировка сохраняет лексическое и риторическое сопоставление особого наименования Иисуса с обычными человеческими деятелями, не добавляя отдельного доктринального вывода.
- issue: Форма воскресения в ἀναστήσεται
  choice: он воскреснет
  alternative: он будет воскрешён
  rationale: Средняя форма здесь естественно допускает непереходное значение; перевод не подменяет её страдательной формой из других новозаветных высказываний.
translation_notes:
  register: Современный литературный русский язык с сдержанным библейским достоинством. Несовершенный вид передаёт повествовательный фон, синтаксис остаётся ясным для обычного читателя. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно нейтральной современной издательской норме; титул «Сын Человеческий» сохранён с прописных букв как устойчивое наименование.
