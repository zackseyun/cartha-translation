  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: ru
  text: Кто примет одного из таких детей во имя Моё, тот принимает Меня; а кто принимает Меня, тот не Меня принимает, но Пославшего Меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приветствует» — во всех случаях в этом стихе употреблён один и тот же греческий глагол, который может означать как принятие, так и радушный приём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Кто … тот
  rationale: Сочетание относительного местоимения с ἄν выражает общее неопределённое условие; русская соотносительная конструкция естественно передаёт смысл «всякий, кто».
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: одного из таких детей
  rationale: Сохраняются и партитивная конструкция «одного из», и качественное значение τοιούτων — «таких, подобного рода», без замены на более указательное «этих».
- source_word: δέξηται / δέχεται / δέχηται
  choice: примет / принимает
  rationale: Глагол δέχομαι допускает значения «принимать» и «приветствовать». «Принимать» сохраняет единый глагольный ряд во всех частях стиха и естественно сочетается как с ребёнком, так и с Иисусом и Пославшим Его.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Устойчивая и ёмкая русская формула передаёт действие ради имени Иисуса и в связи с Его личностью и властью, не сводя выражение только к одному оттенку причины.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: не Меня принимает, но
  rationale: Сохранены греческий контраст и подчеркнутое местоимение без поясняющего добавления «не только», которое устранило бы напряжение оригинала.
- source_word: τὸν ἀποστείλαντά με
  choice: Пославшего Меня
  rationale: Субстантивированное причастие естественно передаётся русским причастием; формулировка сохраняет язык посланничества и связь Иисуса с Тем, Кто Его послал.
theological_decisions:
- issue: Смысл противопоставления «не Меня … но Пославшего Меня»
  choice: Сохранить буквальное риторическое противопоставление
  alternative: 'Передать пояснительно: «не только Меня, но и Пославшего Меня»'
  rationale: Оригинал не отрицает, что человек принимает Иисуса, поскольку это прямо утверждено перед контрастом. Он подчёркивает, что принятие Иисуса достигает Пославшего Его. Добавление «не только … но и» разъяснило бы подразумеваемую связь, но сняло бы намеренное напряжение текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Инверсия «во имя Моё», «не Меня принимает» и прописные местоимения поддерживают торжественный регистр, оставаясь понятными современному читателю. Маркер сноски поставлен после всего стиха, поскольку примечание относится ко всем повторениям глагола.
