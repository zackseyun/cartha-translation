  source_fidelity: Текст точно передаёт неопределённо-обобщённую конструкцию ὃς ἂν, партитивное ἓν τῶν τοιούτων παιδίων («одного из таких детей»), повтор δέχομαι и заключительное противопоставление οὐκ ἐμέ ... ἀλλά. «Во имя Моё» является устойчивым и приемлемым соответствием ἐπὶ τῷ ὀνόματί μου. Смена «примет» / «принимает» не искажает греческую форму и сохраняет общий характер высказывания.
  naturalness: Формулировка звучит естественно для современного литературного русского с уместно возвышенным библейским регистром. Соотносительная конструкция «Кто ... тот ...» и риторический порядок «не Меня принимает, но Пославшего Меня» ясны и выразительны.
  terminology: «Принимать» последовательно передаёт δέχομαι во всех трёх случаях; «Пославшего Меня» точно передаёт субстантивированное причастие τὸν ἀποστείλαντά με. Прописные местоимения согласованы с выбранным библейским регистром. Сноска корректно отмечает допустимую альтернативу «приветствует» и поясняет повтор того же греческого глагола.
