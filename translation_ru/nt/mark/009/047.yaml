  - severity: low
    issue: Не вполне выражено ἔχοντα («имея»)
    rationale: Вариант «с двумя глазами» передаёт общий смысл, но греческое причастие отчётливо противопоставляет состояние «одноглазым» состоянию «имея два глаза». Это можно передать без утраты естественности.
  - severity: low
    issue: Термин «Царство Бога» менее идиоматичен
    rationale: «Царство Божие» — естественная современная литературная форма и устойчивый русский библейский термин; значение τοῦ θεοῦ сохраняется.
