source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: ru
  text: И если твой глаз становится для тебя преткновением, выбрось его. Тебе лучше войти в Царство Божие одноглазым, чем, имея два глаза, быть брошенным в геенну[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «ад». В греческом тексте стоит «геенна» — термин, восходящий к названию долины Еннома и употребляемый в связи с эсхатологическим судом.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: заставляет тебя спотыкаться
  rationale: Сохраняет образ преткновения, присутствующий в греческом глаголе, и не сводит его значение исключительно к совершению греха; в контексте предостережения метафора остаётся понятной.
- source_word: ἔκβαλε
  choice: выбрось
  rationale: Передаёт обычное значение ἐκβάλλω — «выбрасывать, изгонять» — и силу повеления, не добавляя отсутствующего в греческом указания на то, что глаз следует именно вырвать.
- source_word: καλόν
  choice: лучше
  rationale: Хотя буквально слово означает «хорошо», конструкция с ἤ («чем») имеет сравнительный смысл, естественно передаваемый по-русски словом «лучше».
- source_word: μονόφθαλμον
  choice: с одним глазом
  rationale: Естественная современная передача значения «одноглазый» в составе данного предложения, сохраняющая конкретный образ.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Царство Бога
  rationale: Прозрачно передаёт греческое словосочетание и сохраняет его богословскую значимость без архаизации.
- source_word: βληθῆναι
  choice: быть брошенным
  rationale: Точно передаёт страдательный инфинитив βάλλω и сохраняет резкость противопоставления.
- source_word: γέενναν
  choice: геенну
  rationale: Транслитерация сохраняет особый греческий термин, связанный с долиной Еннома и образом эсхатологического суда, не подменяя его более широким понятием «ад».
theological_decisions:
- issue: Передача γέεννα в контексте суда
  choice: геенна
  alternative: ад
  rationale: В исходном тексте употреблён конкретный термин γέεννα, а не общее обозначение мира мёртвых или наказания. Основной текст сохраняет эту специфику, а привычный вариант «ад» приводится в сноске.
- issue: Смысл σκανδαλίζω
  choice: заставляет тебя спотыкаться
  alternative: вводит тебя в грех
  rationale: Образная передача сохраняет намеренную широту греческого глагола и его метафору преткновения, не ограничивая смысл только одним явно истолкованным нравственным результатом.
translation_notes:
  register: Современный литературный русский язык с кратким, весомым синтаксисом. «Выбрось» намеренно сохраняет формулировку исходного глагола и не заменяется традиционным «вырви», которое конкретизировало бы способ действия. Маркер сноски поставлен при слове «геенну», к которому относится примечание.
