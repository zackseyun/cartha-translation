  terminology: «Геенна» верно сохраняет греческую специфику; сноска с вариантом «ад» уместна. «Царство Божие» — более идиоматичная и терминологически устойчивая русская форма. «Одноглазым» точно передаёт μονόφθαλμον и в данном контексте не является оценочным обозначением человека.
