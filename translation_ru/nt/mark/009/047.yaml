  source_fidelity: 'Смысл в целом передан точно: сохранены образ σκανδαλίζω, повеление ἔκβαλε, противопоставление «лучше… чем», «Царство Бога» и специфический термин γέεννα. Однако «с двумя глазами» несколько ослабляет явно выраженное в греческом причастие «имея два глаза», а «Царство Божие» естественнее для современного литературного русского при сохранении установленного библейского термина.'
