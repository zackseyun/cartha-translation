  rationale: Правка улучшает естественность русского текста и точнее отражает синтаксическое противопоставление оригинала, не меняя смысла и не добавляя конфессионального истолкования. Основной текст сохраняет «геенну», а сноска корректно указывает распространённый переводной вариант и историко-семантический фон термина.
