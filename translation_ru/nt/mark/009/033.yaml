  source_fidelity: Перевод точно передаёт множественное «пришли» (ἦλθον), место назначения, переход к подразумеваемому единственному субъекту — Иисусу, конкретную обстановку «в доме» и вопрос ученикам. «Спросил» является естественной русской повествовательной передачей имперфекта ἐπηρώτα; хотя форма не воспроизводит его аспект буквально, в данном контексте не утрачивается существенный смысл. «По дороге» точно и идиоматично передаёт ἐν τῇ ὁδῷ.
