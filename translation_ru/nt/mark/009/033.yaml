  terminology: «Капернаум» — нормативная устоявшаяся форма. «Рассуждали» сохраняет лексическую широту διαλογίζεσθε и не предрешает оттенок открытого спора; сноска надлежащим образом отмечает альтернативу. Явное употребление имени «Иисус» устраняет синтаксическую неясность без добавления толкования.
