  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: ru
  text: 'И пришли они в Капернаум. Когда Иисус был в доме, Он спросил их: «О чём вы рассуждали[a] по дороге?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о чём вы спорили». Глагол может обозначать рассуждение, обсуждение или спор; из следующего стиха видно, что ученики говорили о том, кто из них больше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: пришли
  rationale: Аорист ἔρχομαι с εἰς обозначает прибытие в Капернаум; «пришли» естественно передаёт повествовательное движение и сохраняет множественное число.
- source_word: Καφαρναούμ
  choice: Капернаум
  rationale: Использована устоявшаяся русская форма географического названия.
- source_word: ἐν τῇ οἰκίᾳ
  choice: в доме
  rationale: Конкретное «в доме» отражает наличие артикля и не вводит более интерпретативное «дома» в значении собственного жилища.
- source_word: γενόμενος
  choice: когда Иисус был
  rationale: Причастие γίνομαι имеет здесь временное значение. Имя «Иисус» добавлено для ясности при переходе от множественного подлежащего к подразумеваемому единственному.
- source_word: ἐπηρώτα
  choice: спросил
  rationale: Русское совершенное прошедшее естественно передаёт вопрос в повествовании; контекст не требует искусственно сохранять длительность греческого имперфекта формой «спрашивал».
- source_word: ἐν τῇ ὁδῷ
  choice: по дороге
  rationale: Это естественный русский эквивалент выражения о времени и обстоятельствах пути.
- source_word: διελογίζεσθε
  choice: рассуждали
  rationale: διαλογίζομαι может означать обсуждение, размышление или спор. «Рассуждали» сохраняет широту значения, а возможный оттенок спора отмечен в сноске.
theological_decisions:
- issue: Переход от множественного подлежащего ἦλθον к единственному субъекту γενόμενος и ἐπηρώτα
  choice: 'Явно назвать Иисуса субъектом последующего действия: «Когда Иисус был в доме, Он спросил их»'
  alternative: 'Оставить субъект подразумеваемым: «Когда Он был в доме, Он спросил их»'
  rationale: Контекст указывает на Иисуса как на единственного субъекта. Экспликация имени устраняет возможную русскую двусмысленность и не добавляет богословского толкования.
- issue: Оттенок διελογίζεσθε
  choice: «рассуждали» с лексической сноской
  alternative: «спорили» или «обсуждали»
  rationale: Следующий стих показывает сопернический характер разговора, однако сам глагол допускает более широкий диапазон. Основной текст не должен преждевременно сужать его до открытого спора.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным ритмом. Начальное «И» сохранено как связь с предыдущим повествованием. Местоимение «Он» оформлено с прописной буквы согласно распространённой русской библейской издательской традиции.
