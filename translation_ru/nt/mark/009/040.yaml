  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: ru
  text: Ведь кто не против нас, тот за нас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот на нашей стороне». Греческое выражение ὑπὲρ ἡμῶν может также означать «в нашу пользу» или «на нашей стороне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: кто… тот
  rationale: Субстантивированное относительное местоимение имеет обобщающее значение; русская конструкция «кто…, тот…» естественно передаёт эту общность.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предыдущему высказыванию; «ведь» естественно и кратко выражает пояснительную связь.
- source_word: οὐκ ἔστιν
  choice: не против
  rationale: Отрицание при связке передаётся простой русской именной конструкцией без лишнего добавления глагола «быть» в настоящем времени.
- source_word: καθ’ ἡμῶν
  choice: против нас
  rationale: κατά с родительным падежом выражает направленность против кого-либо; этот вариант ясен и сохраняет противопоставление.
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: ὑπέρ с родительным может означать «за», «в пользу», «на стороне». «За нас» наиболее кратко и симметрично противопоставлено выражению «против нас».
- source_word: ἐστιν
  choice: тот за нас
  rationale: В настоящем времени русская нулевая связка естественна; соотносительное «тот» завершает конструкцию «кто…, тот…».
theological_decisions:
- issue: Объём подразумеваемой солидарности в выражениях «против нас» и «за нас»
  choice: Сохранить местоимение первого лица множественного числа и не уточнять сферу солидарности.
  alternative: «Кто не противится нашей миссии, тот на нашей стороне» или «кто не против Бога, тот за Бога».
  rationale: Греческий текст прямо говорит «нас». Уточняющий пересказ необоснованно разрешил бы смысловую напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная форма и параллелизм исходного высказывания сохранены. «Ведь» передаёт пояснительную функцию γάρ без книжной тяжеловесности.
