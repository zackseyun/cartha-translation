source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: ru
  text: 'Но говорю вам: Илия уже пришёл[a], и с ним поступили как хотели, как и написано о нём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Илия уже пришёл в лице и служении Иоанна Крестителя; см. Марка 9:11–12; ср. Матфея 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление ожиданию учеников и естественно связывает ответ с предыдущим рассуждением.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и естественно передаёт устойчивую формулу личного обращения.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: Илия уже пришёл
  rationale: «Уже» естественно выражает завершённость прихода и его актуальность в контексте; καί здесь имеет присоединительно-усилительный оттенок, который по-русски не требует отдельного слова.
- source_word: ἐποίησαν αὐτῷ ὅσα ἤθελον
  choice: с ним поступили как хотели
  rationale: Идиоматичный русский оборот сохраняет неограниченный характер действий, совершённых над ним, не конкретизируя их сверх текста.
- source_word: καθὼς γέγραπται ἐπ’ αὐτόν
  choice: как и написано о нём
  rationale: Передаёт формулу ссылки на Писание; ἐπί с винительным при γράφω понимается как «о, относительно».
theological_decisions:
- issue: Кого обозначает Илия в этом изречении
  choice: В основном тексте сохранено имя «Илия» без поясняющей подстановки имени Иоанна Крестителя.
  alternative: 'Передать непосредственно: «Иоанн Креститель пришёл как Илия».'
  rationale: Греческий текст прямо называет Илию. Контекстуальное отождествление с служением Иоанна важно, но является толкованием и потому вынесено в сноску.
- issue: Смысл выражения «написано о нём»
  choice: Сохранена общая формулировка без указания конкретного ветхозаветного текста.
  alternative: Уточнить в переводе, что речь идёт о предсказанных страданиях Илии или его прообраза.
  rationale: Текст не называет конкретную цитату и допускает обсуждение того, какие места Писания имеются в виду; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; речь краткая, прямая и достойная. Оборот «с ним поступили как хотели» звучит естественнее буквального «сделали ему всё, что хотели», сохраняя смысл исходного текста.
