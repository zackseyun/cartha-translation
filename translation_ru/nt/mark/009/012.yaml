  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: ru
  text: 'Он сказал им: «Илия, придя первым, восстанавливает всё. И как же написано о Сыне Человеческом, что Ему надлежит много пострадать и подвергнуться презрению[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быть презренным»; буквально по смыслу: «быть сочтённым за ничто».'
    reason: 'Лексическая альтернатива: греческий глагол означает презрение к кому-либо как к незначительному, ничего не стоящему.'
lexical_decisions:
- source_word: ἔφη
  choice: сказал
  rationale: Обычный глагол речи в повествовании; «сказал» естественно и точно передаёт форму без лишней интерпретации.
- source_word: Ἠλίας
  choice: Илия
  rationale: Использована традиционная русская форма библейского имени.
- source_word: ἐλθὼν πρῶτον
  choice: придя прежде
  rationale: Деепричастная конструкция сохраняет причастную форму и выражает действие, предшествующее восстановлению.
- source_word: ἀποκαθιστάνει πάντα
  choice: восстанавливает всё
  rationale: Настоящее время сохранено как общее или живо представленное утверждение; «всё» естественно передаёт широкий охват πάντα.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: как написано о Сыне Человеческом
  rationale: «Написано» сохраняет формулу ссылки на Писание, а «о» передаёт значение ἐπί как указание на предмет сказанного.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Сыне Человеческом
  rationale: Сохранён устойчивый и богословски значимый евангельский титул без поясняющей подмены.
- source_word: ἵνα πολλὰ πάθῃ
  choice: что Ему надлежит много пострадать
  rationale: Оборот передаёт содержание написанного и обусловленное Писанием ожидание; «много пострадать» естественно выражает πολλὰ πάθῃ.
- source_word: ἐξουδενηθῇ
  choice: подвергнуться презрению
  rationale: Формулировка сохраняет страдательное значение и передаёт отношение к человеку как к незначительному, ничего не стоящему.
theological_decisions:
- issue: Связь между восстановительной ролью Илии и страданиями Сына Человеческого
  choice: Сохранить вторую часть как риторический вопрос и не объяснять логическое напряжение.
  alternative: Добавить явное противопоставление («но как же тогда…») или превратить вопрос в разъясняющее утверждение.
  rationale: Греческий текст непосредственно сополагает восстановление и страдание в вопросительной форме; перевод не должен заранее разрешать это богословское напряжение.
- issue: Значение титула «Сын Человеческий»
  choice: Сохранить титул без истолковывающей замены.
  alternative: Передать как «Мессия» или развернуть прямое отождествление с Иисусом.
  rationale: Хотя в контексте титул относится к Иисусу и несёт мессианские оттенки, такие пояснения выходили бы за пределы формулировки исходного текста.
- issue: Модальность ἵνα при ссылке на написанное
  choice: Передать оборотом «Ему надлежит», выражающим предстоящее согласно Писанию, без узкого сведения к цели.
  alternative: «Чтобы Он…» как исключительно целевой оборот или простое будущее «Он пострадает».
  rationale: Здесь ἵνα вводит содержание написанного и ожидаемое исполнение; «надлежит» сохраняет эту обусловленность, не уточняя сверх текста её природу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Формула «написано» и титул «Сын Человеческий» сохранены; синтаксис вопроса оставлен несколько напряжённым вслед за греческим оригиналом.
