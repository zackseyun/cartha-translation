base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: ru
  text: И, уйдя оттуда, они проходили через Галилею[a], и он не хотел, чтобы кто-нибудь узнал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «шли через Галилею». Греческая форма глагола подчёркивает продолжавшееся движение.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте не сказано прямо, что именно он не хотел, чтобы кто-либо узнал; по контексту речь может идти о его присутствии или пути через Галилею.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Уйдя оттуда
  rationale: Оборот передаёт и связь с предыдущим повествованием (καί), и удаление из прежнего места (ἐκεῖθεν, ἐξελθόντες), оставаясь естественным для современного русского языка.
- source_word: παρεπορεύοντο
  choice: проходили
  rationale: Имперфект обозначает продолжавшееся движение; «проходили» естественно передаёт следование через местность, не превращая его в завершённое одноразовое действие.
- source_word: διὰ τῆς Γαλιλαίας
  choice: через Галилею
  rationale: διά с родительным падежом обозначает движение через область; русское название места употреблено без артикля.
- source_word: οὐκ ἤθελεν
  choice: он не хотел
  rationale: Форма θέλω выражает желание или волю; простой современный оборот сохраняет смысл без излишней торжественности.
- source_word: ἵνα τις γνοῖ
  choice: чтобы кто-нибудь узнал
  rationale: Придаточное с ἵνα передаёт нежелательный для субъекта результат. Как и в греческом тексте, предмет знания прямо не назван.
theological_decisions:
- issue: Неявно названный субъект οὐκ ἤθελεν
  choice: «он», то есть Иисус
  alternative: Безличное или коллективное понимание
  rationale: Глагол стоит в единственном числе и в контексте естественно относится к Иисусу. Строчная буква не вносит отсутствующего в греческой графике конфессионального оформления.
- issue: Неуказанный предмет глагола γνοῖ
  choice: Оставить предмет знания невыраженным
  alternative: Добавить «об этом», «о его присутствии» или «о пути»
  rationale: Греческий текст не уточняет, что именно не должны были узнать; сохранение пропуска удерживает контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Причастный оборот передаёт исходное предшествующее действие, а строчное «он» следует обычной современной орфографии и не добавляет к тексту конфессиональной маркировки.
