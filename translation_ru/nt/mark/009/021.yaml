  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: ru
  text: 'И Он спросил его отца: «Как давно это с ним происходит?» Тот ответил: «С детства».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Глагол здесь вводит обычный прямой вопрос; «спросил» естественно передаёт его без лишнего оттенка официального расспроса.
- source_word: τὸν πατέρα αὐτοῦ
  choice: его отца
  rationale: Местоимение по контексту относится к страдающему мальчику. Формулировка сохраняет краткость и естественность оригинала.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Как давно
  rationale: Греческий оборот спрашивает, сколько времени прошло от начала состояния до настоящего момента; «как давно» ясно и естественно выражает этот смысл по-русски.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: это с ним происходит
  rationale: Перфект γέγονεν указывает на возникшее и продолжающееся состояние. Настоящее время в русском передаёт его актуальную продолжительность.
- source_word: ὁ δὲ εἶπεν
  choice: Тот ответил
  rationale: δέ обозначает переход к ответной реплике. «Тот ответил» естественно различает собеседников и не придаёт союзу неоправданного противопоставления.
- source_word: Ἐκ παιδιόθεν
  choice: С детства
  rationale: Оборот обозначает начало состояния в детстве и его продолжение до настоящего времени. «С детства» — краткая и современная русская формулировка.
theological_decisions: []
