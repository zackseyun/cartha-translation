review_pass:
  verdict: revise
  source_fidelity: Нужна правка управления в заключительной просьбе. В греческом βοηθέω с μου естественно передаёт просьбу о помощи самому говорящему, а τῇ ἀπιστίᾳ обозначает сферу его неверия/недостатка веры. Формула «Помоги моему неверию» возможна как традиционализированная калька, но в современном русском буквально может означать помощь самому неверию. «Помоги мне в моём неверии» точнее и яснее сохраняет парадокс Πιστεύω—ἀπιστία. «Закричал» отчётливее передаёт κράξας, чем более нейтральное «воскликнул».
  naturalness: 'Исправленный текст звучит естественно в современном литературном русском, оставаясь кратким и эмоционально напряжённым. Отдельное соответствие ἔλεγεν не требуется: глагол речи естественно включён в «закричал» перед прямой речью.'
  terminology: «Верю» корректно передаёт Πιστεύω, а «неверие» сохраняет намеренное напряжение с «Верю», не истолковывая его заранее как только «маловерие». В примечании уместно указать «недостаток веры»/«маловерие» как возможный смысл ἀπιστία.
  issues:
  - severity: medium
    issue: «Помоги моему неверию» двусмысленно и неестественно в современном русском.
    rationale: Такая конструкция может быть понята как просьба помочь неверию, тогда как греческое μου относится к человеку, просящему помощи в его неверии. Требуется явное «Помоги мне в моём неверии».
  - severity: low
    issue: «Воскликнул» несколько слабее передаёт κράξας.
    rationale: Κράξας обозначает громкий, настойчивый крик; «закричал» сохраняет эту силу без искусственной архаизации.
  revised_text: 'Тотчас отец ребёнка закричал: «Верю! Помоги мне в моём неверии![a]»'
  revised_footnotes:
