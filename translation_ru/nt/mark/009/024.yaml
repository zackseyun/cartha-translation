  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: ru
  text: 'Тотчас отец ребёнка закричал: «Верю! Помоги мне в моём неверии![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помоги мне в моём маловерии!» Греческое ἀπιστία может означать неверие или недостаток веры.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Тотчас
  rationale: Передаёт немедленность реакции и характерную для Марка динамику; звучит естественно и достойно в современном русском.
- source_word: κράξας
  choice: воскликнул
  rationale: Передаёт громкий, эмоционально напряжённый возглас, не сводя его только к крику как указанию на громкость.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: отец ребёнка
  rationale: Прозрачно передаёт родительную конструкцию; «ребёнок» сохраняет обычный диапазон παιδίον, тогда как контекст уже указывает на сына.
- source_word: ἔλεγεν
  choice: не передано отдельным глаголом
  rationale: В русском «воскликнул» естественно вводит прямую речь и одновременно передаёт κράξας; добавление «и сказал» было бы стилистически тяжеловесным.
- source_word: Πιστεύω
  choice: Верю
  rationale: Прямо передаёт значение πιστεύω и сохраняет связь с темой веры в ближайшем контексте.
- source_word: βοήθει
  choice: Помоги
  rationale: Краткая и естественная форма повелительного наклонения сохраняет настоятельность просьбы.
- source_word: μου τῇ ἀπιστίᾳ
  choice: моему неверию
  rationale: Дательный после «помоги» естественен по-русски и сохраняет намеренный парадокс между верой и неверием; возможен также смысл недостатка веры.
theological_decisions:
- issue: Напряжение между Πιστεύω и ἀπιστίᾳ
  choice: 'Сохранить прямой парадокс: «Верю! Помоги моему неверию!»'
  alternative: «Верю! Помоги мне там, где мне недостаёт веры!»
  rationale: Греческий текст ставит веру и неверие рядом, не объясняя и не устраняя напряжение. Основной текст должен сохранить эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский, краткий и эмоционально напряжённый. Опущено отдельное «сказал», поскольку «воскликнул» естественно вводит прямую речь и избегает неуклюжего «воскликнул и сказал».
