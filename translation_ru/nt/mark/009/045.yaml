  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: ru
  text: И если твоя нога становится для тебя причиной падения, отсеки её. Лучше тебе войти в жизнь хромым, чем с обеими ногами быть брошенным в геенну[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ад». Греческое слово «геенна» отсылает к долине Еннома и связанным с ней представлениям о Божьем суде.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: заставляет тебя спотыкаться
  rationale: Сохраняет исходный образ преткновения и падения, не сужая значение до прямого «заставляет грешить»; в контексте образ указывает на нравственное падение.
- source_word: ἀπόκοψον
  choice: отсеки её
  rationale: Передаёт резкий и конкретный характер аористного повеления, не смягчая гиперболический образ.
- source_word: καλόν ἐστίν … ἢ
  choice: лучше … чем
  rationale: В конструкции сравнения с ἢ прилагательное καλόν естественно передаётся сравнительной формой «лучше».
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: войти в жизнь
  rationale: Сохраняет эсхатологический образ и не добавляет отсутствующего в греческом тексте определения «вечную».
- source_word: χωλὸν
  choice: хромым
  rationale: Точно обозначает нарушение ходьбы и непосредственно соответствует упоминанию ноги.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: с обеими ногами
  rationale: Естественно по-русски передаёт противопоставление хромоте и сохраняет значение наличия обеих ног.
- source_word: βληθῆναι
  choice: быть брошенным
  rationale: Прямо передаёт страдательный инфинитив и силу образа суда.
- source_word: γέενναν
  choice: геенну
  rationale: Сохраняет специфический греческий термин и его иудейские историко-эсхатологические ассоциации вместо замены более общим традиционным понятием.
theological_decisions:
- issue: Передача γέεννα в контексте суда
  choice: геенна
  alternative: ад
  rationale: В исходном тексте употреблён конкретный термин γέεννα, связанный с долиной Еннома и образом Божьего суда. «Ад» является привычным истолковывающим соответствием, но менее точно сохраняет форму и исторические ассоциации исходного выражения.
- issue: Смысл σκανδαλίζῃ
  choice: заставляет тебя спотыкаться
  alternative: вводит тебя в грех
  rationale: Выбранный вариант сохраняет метафору преткновения и допускает её нравственно-духовный смысл, не устраняя образ и не ограничивая семантическую широту глагола.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. «Отсеки» сохраняет суровую образность оригинала; «геенна» оставлена в основном тексте и пояснена сноской.
