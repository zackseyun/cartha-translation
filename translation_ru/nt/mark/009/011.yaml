  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: ru
  text: 'И они спрашивали Его: «Почему[a] книжники говорят, что Илия должен прийти прежде?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как же это книжники говорят, что Илия должен прийти прежде?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: спрашивали
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; русская форма несовершенного вида «спрашивали» естественно сохраняет этот оттенок.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание вопроса. В современном русском его естественно передать синтаксически, не добавляя тяжеловесного «говоря».
- source_word: Ὅτι
  choice: Почему
  rationale: В данном вопросительном контексте ὅτι идиоматически вводит вопрос «почему / как же так, что». «Почему» ясно и естественно передаёт основной смысл.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и исторически точный русский термин для знатоков и толкователей Писания в евангельском контексте.
- source_word: Ἠλίαν
  choice: Илия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: δεῖ
  choice: должен
  rationale: Передаёт выраженную δεῖ необходимость, не уточняя её источник сверх сказанного в тексте.
- source_word: ἐλθεῖν
  choice: прийти
  rationale: Естественный русский эквивалент в контексте пророческого ожидания.
- source_word: πρῶτον
  choice: прежде
  rationale: Передаёт временную первоочерёдность и в данном возвышенно-повествовательном регистре звучит естественно.
theological_decisions:
- issue: Смысл вопроса, вводимого Ὅτι
  choice: Прямой вопрос «Почему книжники говорят…?»
  alternative: «Как же это книжники говорят…?»
  rationale: «Почему» ясно передаёт вопросительную функцию ὅτι. Более буквальное «как же это» возможно, но в современном русском может сильнее подразумевать недоверие или недоумение.
- issue: Характер пришествия Илии
  choice: «Илия должен прийти прежде» без поясняющего дополнения
  alternative: «Илия должен снова прийти» или «Илия должен прийти прежде Мессии»
  rationale: Греческий текст говорит лишь о необходимости предварительного прихода Илии; слова «снова» и «прежде Мессии» были бы контекстуальными толкованиями, а не переводом явно выраженного содержания.
translation_notes:
  register: Современный литературный русский язык с сохранением привычной библейской терминологии. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой; синтаксис прямой речи сделан естественным для русского языка.
