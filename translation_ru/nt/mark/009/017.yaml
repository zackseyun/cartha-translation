  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: ru
  text: 'И один из толпы ответил Ему: «Учитель, я привёл к Тебе своего сына, у которого был немой дух».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; сохраняет евангельскую формулу без лишнего расширения.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: один человек из толпы
  rationale: «Один из толпы» возможно формально, однако в современном русском добавление «человек» естественно обозначает участника толпы, не привнося существенной новой информации.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Точно и естественно передаёт обращение к тому, кто учит; «Наставник» было бы менее прямым соответствием.
- source_word: ἤνεγκα
  choice: я привёл
  rationale: Аорист передан естественным русским прошедшим временем; поскольку речь идёт о сыне, «привёл» здесь уместнее буквального «принёс».
- source_word: τὸν υἱόν μου
  choice: своего сына
  rationale: Сохраняет родственную связь, прямо выраженную словом υἱός; возвратное «своего» естественно по-русски при подлежащем первого лица.
- source_word: πρὸς σέ
  choice: к Тебе
  rationale: Естественно передаёт направление движения при глаголе «привёл».
- source_word: ἔχοντα
  choice: одержимого
  rationale: Причастие согласуется с «сыном» и описывает его состояние. В данном контексте «одержимого ... духом» ясно и естественно выражает наличие действующего в нём духа, хотя это несколько более контекстуально, чем буквальное «имеющего».
- source_word: πνεῦμα ἄλαλον
  choice: немым духом
  rationale: Сохраняет прямое обозначение «дух» и характеристику ἄλαλον, не добавляя слов «злой» или «бес», которых в стихе нет.
theological_decisions:
- issue: Значение πνεῦμα в рассказе об изгнании духа
  choice: дух, овладевший сыном, без добавления определения «злой»
  alternative: злой дух; бес
  rationale: Контекст указывает на враждебного сверхъестественного духа, однако сам стих говорит только πνεῦμα. Формулировка «одержимого ... духом» передаёт контекст, не добавляя отсутствующего определения.
- issue: К кому относится характеристика ἄλαλον
  choice: 'к духу: «немым духом»'
  alternative: 'к воздействию духа: «духом, лишающим его речи»'
  rationale: Грамматически ἄλαλον непосредственно определяет πνεῦμα. Перевод сохраняет эту форму и не сводит выражение только к вызываемому симптому.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Местоимения при обращении к Иисусу написаны с прописной буквы согласно распространённой русской библейской традиции. Формулировка сохраняет краткость и напряжение исходного текста.
