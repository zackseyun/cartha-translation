  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ru
  text: 'И Пётр сказал Иисусу: «Равви, хорошо нам быть здесь. Давайте сделаем три шатра[a]: один для Тебя, один для Моисея и один для Илии».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «шалаши»; традиционно — «кущи». Греческое слово обозначает временные укрытия и может вызывать ассоциации с шатрами, а также с праздником Кущей, однако сам стих прямо этих ассоциаций не уточняет.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: сказал
  rationale: В повествовательном греческом это обычная формула ответа или вступления в речь, даже когда явного вопроса нет. Русское «сказал» звучит естественно и не создаёт впечатления, будто Иисус задал вопрос.
- source_word: λέγει
  choice: сказал
  rationale: Историческое настоящее передано русским прошедшим временем в соответствии с естественной нормой повествования.
- source_word: Ῥαββί
  choice: Равви
  rationale: Сохраняет семитскую форму уважительного обращения и её историко-культурный оттенок; перевод «Учитель» возможен, но менее формально близок.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: Хорошо нам быть здесь
  rationale: Сохраняет оценочное «хорошо» и конструкцию со значением пребывания, не усиливая её до «как чудесно» или «нам следует остаться».
- source_word: ποιήσωμεν
  choice: Давайте сделаем
  rationale: Передаёт побудительное значение первого лица множественного числа; «построим» было бы несколько конкретнее основного значения ποιέω.
- source_word: σκηνάς
  choice: шалаша
  rationale: «Шалаш» ясно обозначает простое временное укрытие и не навязывает храмовых или праздничных ассоциаций, которые могут возникнуть у традиционного слова «кущи».
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: один для Тебя, один для Моисея и один для Илии
  rationale: Сохранены троекратное распределительное повторение μίαν и параллельное построение исходного текста.
theological_decisions:
- issue: Возможные культовые или праздничные ассоциации слова σκηνάς
  choice: Нейтральное «шалаши» в основном тексте
  alternative: палатки; кущи
  rationale: Сам стих прямо не связывает предлагаемые сооружения ни с праздником Кущей, ни со скинией как святилищем. Нейтральный перевод не устраняет возможного подтекста, а варианты сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Обращение «Равви» сохраняет исторический колорит; «шалаши» понятно широкому кругу читателей. Местоимение «Тебя» написано с прописной буквы как уважительная издательская норма, без изменения смысла исходного текста.
