  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: ru
  text: 'Иоанн сказал Ему: «Учитель! Мы видели кого-то, кто Твоим именем изгонял бесов, и пытались запретить ему, потому что он не следовал за нами».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы запрещали ему». Греческая форма может указывать на продолжавшееся действие или на попытку воспрепятствовать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Иоанн сказал Ему
  rationale: Обычная для повествования формула речи; простое прошедшее время естественно по-русски, а местоимение передано с прописной буквы согласно принятому библейскому оформлению обращения к Иисусу.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и естественное соответствие греческому обращению διδάσκαλε без более интерпретирующих вариантов «Наставник» или «Равви».
- source_word: εἴδομέν τινα
  choice: мы видели человека
  rationale: Неопределённое τινα обозначает некоего человека; русский язык здесь естественно требует существительного, при этом личность не конкретизируется.
- source_word: ἐν τῷ ὀνόματί σου
  choice: Твоим именем
  rationale: Естественная русская передача устойчивого библейского выражения, сохраняющая смысл действия посредством имени и власти Иисуса.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: изгонял бесов
  rationale: Точно передаёт экзорцистское значение ἐκβάλλω и привычно звучит в русском евангельском контексте.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: и пытались запретить ему
  rationale: Имперфект может обозначать продолжавшуюся или предпринятую попытку воспрепятствовать; «пытались запретить» естественно передаёт эту аспектуальную неоднозначность.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: потому что он не следовал за нами
  rationale: Прямо сохраняет дательное ἡμῖν — «за нами», не заменяя его интерпретирующим «за Тобой» или «вместе с нами».
theological_decisions:
- issue: К кому относится следование человека в заключительной фразе
  choice: «не следовал за нами»
  alternative: «не следовал за Тобой»; «не был одним из нас»
  rationale: В греческом тексте прямо стоит ἡμῖν («нам/за нами»). Это сохраняет напряжение между групповой озабоченностью учеников и последующим ответом Иисуса, не внося в перевод отсутствующее «за Тобой».
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Сохранены традиционные «бесы» и прописные местоимения при обращении к Иисусу; синтаксис сделан понятным для обычного современного читателя.
