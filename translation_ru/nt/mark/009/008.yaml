source:
  edition: SBLGNT
  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: ru
  text: И вдруг, оглянувшись, они больше никого не увидели — только Иисуса, который был с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: вдруг
  rationale: Естественно и точно передаёт значение внезапности.
- source_word: περιβλεψάμενοι
  choice: оглянувшись
  rationale: Передаёт круговой осмотр окружающего пространства и сохраняет обстоятельную форму причастия.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: уже никого не увидели
  rationale: Сохраняет сочетание οὐκέτι («уже не») с οὐδένα («никого»).
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: кроме одного Иисуса
  rationale: Передаёт исключение ἀλλά после отрицания и подчёркивающую исключительность функцию μόνον без неестественного русского «Иисуса одного».
- source_word: μεθ’ ἑαυτῶν
  choice: рядом с собой
  rationale: Ясно обозначает, что Иисус оставался вместе с учениками; расположение фразы устраняет возможную двусмысленность русского «с ними».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, повествовательная и dignified формулировка. Порядок слов слегка перестроен ради естественности, при этом сохранены внезапность, смена восприятия и исключительное присутствие Иисуса.
