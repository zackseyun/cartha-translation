  source_fidelity: 'Основной смысл передан точно: запрет препятствовать, совершение деяния, связанного с именем Иисуса, и невозможность вскоре злословить Его. Однако «силой Моего имени» чрезмерно конкретизирует ἐπὶ τῷ ὀνόματί μου как источник силы; исходный оборот прежде всего обозначает действие во имя Иисуса / с призыванием Его имени.'
  naturalness: Фраза в целом литературна, но «совершивший ... не сможет» представляет действие как уже совершённое, тогда как греческие будущие формы описывают того, кто совершит такое деяние. Финитная конструкция с «кто совершит» яснее и точнее.
  terminology: «Могущественное дело» приемлемо для δύναμιν и не сужает смысл до «чуда». «Во имя Моё» — устойчивое современное соответствие ἐπὶ τῷ ὀνόματί μου, не навязывающее более точного объяснения механизма или основания действия. «Злословить Меня» точно передаёт κακολογῆσαι и соответствует возвышенно-нейтральному регистру.
