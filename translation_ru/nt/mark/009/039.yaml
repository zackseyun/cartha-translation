  to: 'Но Иисус сказал: «Не запрещайте ему, ибо никто, кто совершит могущественное дело[a] во имя Моё, не сможет вскоре злословить Меня[b]».'
  rationale: Заменены «силой Моего имени» на «во имя Моё», чтобы не добавлять к исходному обороту конкретное объяснение характера действия именем Иисуса, и прошедшее причастие на придаточное с будущим временем, соответствующее ποιήσει. Остальные ключевые решения сохранены.
