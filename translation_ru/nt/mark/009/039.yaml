source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: ru
  text: 'Но Иисус сказал: «Не запрещайте ему, ибо никто, кто совершит могущественное дело[a] во имя Моё, не сможет вскоре злословить Меня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «чудо» или «проявление силы»; буквально: «силу».'
    reason: lexical_alternative
  - marker: b
    text: Или «поносить Меня» или «говорить обо Мне дурно».
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: не запрещайте
  rationale: В данном контексте глагол означает не позволять человеку действовать, препятствовать ему; настоящее повелительное наклонение с μή передаёт запрет прекратить такие попытки.
- source_word: δύναμιν
  choice: могущественное дело
  rationale: Так передаётся деяние, в котором проявляется сила, без сужения значения до одного лишь современного понятия чуда.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: силой Моего имени
  rationale: В контексте изгнания бесов оборот указывает на имя Иисуса как основание и источник полномочия; русская формулировка естественно передаёт этот оттенок.
- source_word: ταχὺ
  choice: вскоре
  rationale: Наречие обозначает временную близость последующего действия, а не быстроту его совершения.
- source_word: κακολογῆσαί
  choice: злословить Меня
  rationale: Глагол означает говорить о ком-либо дурно, поносить или хулить; «злословить» сохраняет широту и силу выражения.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: потому что никто
  rationale: Естественная русская конструкция сохраняет категорическую отрицательную формулировку греческого текста.
- source_word: δυνήσεται
  choice: не сможет
  rationale: Будущее время и значение способности переданы явно.
theological_decisions:
- issue: Характер деяния, совершённого именем Иисуса
  choice: «могущественное дело»
  alternative: «чудо» или «проявление силы»
  rationale: Выбранный вариант сохраняет связь δύναμις с силой и не ограничивает смысл более узким термином «чудо».
- issue: Смысл связи человека с Иисусом
  choice: Высказывание передано как ограниченное утверждение о том, что такой человек не станет вскоре злословить Иисуса.
  alternative: Уточнить, что этот человек является истинным учеником, либо, напротив, действует из корыстных побуждений.
  rationale: Греческий текст не выносит здесь более широкого суждения о статусе или мотивах этого человека.
translation_notes:
  register: Современный литературный русский язык с ясной и достойной речью. «Не запрещайте ему» естественно продолжает контекст предыдущего стиха; причастная конструкция позволяет точно связать совершённое деяние с последующей невозможностью вскоре злословить Иисуса.
