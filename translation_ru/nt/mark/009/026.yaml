  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: ru
  text: 'Дух закричал, вызвал у мальчика сильные судороги[a] и вышел из него. Мальчик стал словно мёртвым, так что многие говорили: «Он умер»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вверг его в сильные судороги».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «он умер». Это вывод наблюдавших; повествователь говорит, что мальчик стал словно мёртвым.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: закричал
  rationale: Аористное причастие обозначает действие, сопровождающее и предшествующее выходу духа. Нейтральное «закричал» не уточняет без достаточных оснований, был ли это крик или визг.
- source_word: πολλὰ σπαράξας
  choice: сильно сотряс мальчика в судорогах
  rationale: В контексте изгнания духа σπαράσσω означает причинение судорог, а πολλὰ усиливает действие. Объект «мальчика» восстановлен из контекста ради ясности русского текста.
- source_word: ἐξῆλθεν
  choice: вышел из него
  rationale: Подразумеваемый субъект — дух, упомянутый в предшествующем контексте. Мужской род соответствует русскому слову «дух», а дополнение «из него» естественно передаёт смысл выхода из мальчика.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Мальчик стал словно мёртвый
  rationale: Сравнительное ὡσεὶ указывает на видимое состояние, не утверждая, что мальчик действительно умер.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: так что многие говорили
  rationale: Конструкция передаёт следствие, а τοὺς πολλούς здесь естественно понимать как «многие», не обязательно «большинство».
- source_word: ὅτι ἀπέθανεν
  choice: «Он умер»
  rationale: Прямая речь естественна по-русски; аорист ἀπέθανεν передаёт вывод наблюдавших о наступившей смерти.
theological_decisions:
- issue: Умер ли мальчик на самом деле или лишь выглядел мёртвым
  choice: Повествователь утверждает, что мальчик стал словно мёртвый, а его смерть представлена лишь как вывод окружающих.
  alternative: Мальчик действительно умер, а затем ожил.
  rationale: Сравнение ὡσεὶ («словно») и слова множества очевидцев сохраняют различие между внешним впечатлением и прямым утверждением повествователя, не превращая следующий эпизод в явно названное воскресение.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Подразумеваемые участники названы явно («дух», «мальчик») для устранения неестественной для русского языка цепочки местоимений; при этом сравнительный характер описания состояния мальчика сохранён.
