  source_fidelity: 'Основной смысл передан верно: εὐθύς — «тотчас», реакция толпы — сильное изумление без навязанной причины, а ἀσπάζομαι — «приветствовать». Однако «весь народ» менее точно, чем «вся толпа», для ὁ ὄχλος; кроме того, русское единственное число в сочетании «народ ... подбегая ... приветствовал» чрезмерно сглаживает множественное действие людей, выраженное в греческом тексте.'
