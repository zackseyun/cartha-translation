  terminology: «Толпа» — точное нейтральное соответствие ὄχλος и не снижает регистра. «Сильно изумилась» естественно передаёт ἐξεθαμβήθησαν, не исключая оттенка потрясения или тревоги, отмеченного в сноске. Личные местоимения «Его», «Нему» сохраняются согласно принятому в проекте библейскому регистру.
