    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для повествования Марка стремительность и при этом звучит естественно и достойно в современном литературном русском.
- source_word: πᾶς ὁ ὄχλος
  choice: весь народ
  rationale: Передаёт совокупность присутствующих; «народ» естественнее для библейского повествования, чем несколько более бытовое «толпа».
- source_word: ἰδόντες αὐτόν
  choice: увидев Его
  rationale: Деепричастный оборот сохраняет обстоятельственное отношение аористного причастия к основной реакции народа.
- source_word: ἐξεθαμβήθησαν
  choice: пришёл в сильное изумление
  rationale: Передаёт интенсивность глагола, не определяя без достаточных оснований, было ли это исключительно восхищением, потрясением или испугом.
- source_word: προστρέχοντες
  choice: подбегая к Нему
  rationale: Сохраняет направленное и энергичное движение к Иисусу, выраженное приставочным причастием.
- source_word: ἠσπάζοντο αὐτόν
  choice: приветствовал Его
  rationale: Нейтрально и точно передаёт обычное значение ἀσπάζομαι в данном повествовательном контексте.
theological_decisions:
- issue: Характер реакции народа на Иисуса в ἐξεθαμβήθησαν
  choice: сильное изумление без указания причины
  alternative: испуг; потрясение из-за предполагаемого сияния лица Иисуса
  rationale: Сам стих сообщает лишь об интенсивной реакции при виде Иисуса и о последующем приветствии. Перевод не вводит отсутствующего в тексте объяснения и сохраняет возможный спектр эмоций.
translation_notes:
