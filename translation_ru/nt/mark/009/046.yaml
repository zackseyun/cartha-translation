  yaml_path: translation/nt/mark/009/046.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ru
  text: где[a] их червь не умирает и огонь не угасает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в наиболее ранних греческих рукописях, включая Синайский и Ватиканский кодексы IV века, а также в ранних коптских переводах, но присутствует в большинстве византийских рукописей и в латинской традиции. Вероятно, он был позднее добавлен переписчиком как повтор тех же слов из стиха 48 (ср. также стих 44).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: червь
  rationale: Передаёт образ червя, пожирающего разлагающуюся плоть, и сохраняет прямую связь с Исайей 66:24; более узкое «личинка» здесь менее уместно.
- source_word: τελευτᾷ
  choice: не умирает
  rationale: В данном контексте глагол означает «умирать»; настоящее время выражает непрекращающееся действие.
- source_word: σβέννυται
  choice: не угасает
  rationale: Естественное и традиционное русское выражение применительно к огню; форма сохраняет пассивно-непереходный оттенок греческого глагола без излишнего уточнения действующего лица.
theological_decisions:
- issue: Образ непрекращающегося червя и огня
  choice: Сохранён буквально без пояснения природы наказания
  alternative: Истолковать образ как указание на конкретную доктрину о посмертном наказании
  rationale: Текст цитатно воспроизводит образ Исайи 66:24 и сам по себе не разрешает все богословские вопросы, связанные с его пониманием.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, ритма и библейской образности исходного текста. Союз «и» перед второй частью передаёт καί; запятая не ставится, поскольку обе части образуют тесно связанную однородную конструкцию.
