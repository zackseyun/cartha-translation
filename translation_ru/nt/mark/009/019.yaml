  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: ru
  text: 'И Он отвечает им: «О неверующее поколение[a]! Долго ли Мне быть с вами? Долго ли Мне терпеть вас[b]? Приведите его ко Мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неверное поколение». Греческое слово может обозначать как отсутствие веры, так и неверность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сносить вас»; «мириться с вами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Он отвечает им
  rationale: Греческое причастие с историческим настоящим вводит ответ Иисуса. Русское настоящее время сохраняет живость повествовательной манеры Марка, а естественная конструкция избегает тяжеловесного «ответив им, говорит».
- source_word: γενεὰ
  choice: поколение
  rationale: Передаёт обращение ко всему современному Иисусу поколению яснее для современного читателя, чем более многозначное «род».
- source_word: ἄπιστος
  choice: неверующее
  rationale: В данном контексте на первом плане недостаток веры и доверия. Возможное значение «неверное» сохранено в примечании, чтобы не устранять смысловую неоднозначность.
- source_word: ἕως πότε
  choice: долго ли
  rationale: Естественный русский способ передать повторённый греческий вопрос «до каких пор?» с оттенком скорби и упрёка.
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: Мне быть с вами
  rationale: Точно и естественно выражает продолжающееся пребывание Иисуса среди адресатов.
- source_word: ἀνέξομαι ὑμῶν
  choice: Мне терпеть вас
  rationale: Сохраняет сильный оттенок тягостного перенесения и неудовлетворённости, не переходя к разговорному «мириться с вами».
- source_word: φέρετε αὐτὸν πρός με
  choice: Приведите его ко Мне
  rationale: В контексте речь идёт о мальчике, которого велят доставить к Иисусу; «приведите» по-русски естественнее, чем буквальное «принесите», и не предполагает непременно, что его несут.
theological_decisions:
- issue: Смысл ἄπιστος в обращении Иисуса
  choice: неверующее
  alternative: неверное
  rationale: Основной перевод подчёркивает отсутствие веры, непосредственно проявившееся в эпизоде. Вариант «неверное» может указывать также на неверность Богу; он вынесен в примечание, чтобы сохранить богословское напряжение без навязывания более узкого толкования.
- issue: Сила выражения ἀνέξομαι ὑμῶν
  choice: терпеть вас
  alternative: сносить вас / мириться с вами
  rationale: «Терпеть вас» сохраняет резкость риторического вопроса Иисуса, но не усиливает её сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным звучанием. Историческое настоящее сохранено ради характерной для Марка живости. Местоимение «Мне» и «ко Мне» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
