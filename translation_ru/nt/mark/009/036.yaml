  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: ru
  text: 'Взяв ребёнка, Он поставил его посреди них и, обняв его[a], сказал им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взяв его на руки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν παιδίον
  choice: Взяв ребёнка
  rationale: Аористное причастие передаёт действие, предшествующее основному глаголу; «ребёнка» естественно передаёт παιδίον без навязывания уменьшительного оттенка.
- source_word: ἔστησεν αὐτὸ
  choice: Он поставил его
  rationale: 'ἵστημι употреблено каузативно: Иисус поставил ребёнка; русский глагол сохраняет конкретность действия и звучит естественно.'
- source_word: ἐν μέσῳ αὐτῶν
  choice: посреди них
  rationale: Передаёт пространственный смысл выражения — в центре среди собравшихся.
- source_word: ἐναγκαλισάμενος αὐτὸ
  choice: обняв его
  rationale: Глагол может означать обнять или взять в объятия; «обняв» кратко, естественно и сохраняет жест, не уточняя сверх исходного текста его длительность.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Прямой и нейтральный русский эквивалент греческого выражения.
theological_decisions: []
