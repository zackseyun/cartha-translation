  verdict: approve
  source_fidelity: «Взяв ребёнка» точно передаёт аористное причастие λαβών и παιδίον без необоснованного усиления значения. «Поставил его посреди них» хорошо отражает каузативное ἔστησεν и ἐν μέσῳ αὐτῶν. «Обняв его» является допустимым и естественным эквивалентом ἐναγκαλισάμενος; сноска корректно сохраняет альтернативу «взяв его на руки». Финальное «сказал им» точно передаёт εἶπεν αὐτοῖς. Порядок действий и двоеточие перед последующей речью сохранены.
