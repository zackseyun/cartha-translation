  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: ru
  text: 'Ибо кто даст вам чашу воды напиться, потому что вы принадлежите Мессии[a], — истинно говорю вам: тот ни в коем случае не лишится своей награды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во имя того, что вы принадлежите Мессии»; греческая конструкция допускает и такое более формальное понимание.'
    reason: Сочетание ἐν ὀνόματι ὅτι необычно; примечание сохраняет формальную альтернативу при естественной причинной передаче в основном тексте.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Ибо кто
  rationale: Передаёт неопределённую относительную конструкцию естественно по-русски, а γάρ сохраняет связь с предшествующим высказыванием.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: даст вам выпить чашу воды
  rationale: Сохраняет значение ποτίζω «дать пить, напоить» и образ чаши воды, не превращая предмет в более привычный, но менее точный «стакан».
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: во имя того, что вы принадлежите Мессии
  rationale: Сохраняет необычное сочетание ἐν ὀνόματι с пояснительным ὅτι и не добавляет отсутствующее в греческом местоимение «Моё». Принадлежность, выраженная родительным χριστοῦ, передана ясным современным оборотом.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: истинно говорю вам
  rationale: Торжественная и узнаваемая передача вводной формулы Иисуса, сохраняющая силу ἀμήν.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ни в коем случае не лишится
  rationale: Передаёт усиленное отрицание οὐ μή и естественно сочетается в русском языке с «наградой».
- source_word: τὸν μισθὸν αὐτοῦ
  choice: своей награды
  rationale: В данном нравственно-эсхатологическом контексте μισθός означает воздаяние или награду; возвратное «своей» однозначно относит её к совершающему поступок.
theological_decisions:
- issue: Передача Χριστός в конструкции принадлежности
  choice: Мессия
  alternative: Христос
  rationale: Здесь Χριστός обозначает титул Иисуса; «Мессия» сохраняет его смысл, а не превращает в имя собственное.
- issue: Связь ἐν ὀνόματι и ὅτι χριστοῦ ἐστε
  choice: во имя того, что вы принадлежите Мессии
  alternative: потому что вы принадлежите Мессии
  rationale: Основной текст сохраняет формальную особенность и неоднозначность греческой конструкции, не подставляя «во имя Моё»; сноска даёт вероятное причинное понимание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным евангельским регистром. Сохранены логическое «ибо», формула «истинно говорю вам» и необычность исходной конструкции; избегнуты архаические формы и добавление «Моё», которого нет в данном греческом тексте.
