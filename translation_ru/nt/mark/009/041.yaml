  rationale: 'Исправлена неидиоматичная калька «во имя того, что» на естественное причинное выражение, которое передаёт наиболее вероятную функцию ὅτι в данном контексте. Формальная неоднозначность исходной конструкции не устранена молча, а отражена в сноске. Также слегка выровнена русская сочетаемость глагола и дополнения: «дать чашу воды напиться».'
