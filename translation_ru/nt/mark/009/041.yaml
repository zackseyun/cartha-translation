review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: ποτίσῃ — дать пить, ποτήριον ὕδατος — чаша воды, χριστοῦ ἐστε — принадлежность Мессии, а οὐ μή — усиленное отрицание. Однако «во имя того, что» является неестественной русской калькой и затемняет, а не сохраняет, функцию спорного сочетания ἐν ὀνόματι ὅτι. Причинное понимание («потому что») хорошо обосновано и прямо отражено в английском аудите как альтернативное; формальную особенность можно сохранить в сноске.'
  naturalness: «Ибо кто даст вам выпить чашу воды» допустимо, но «кто даст вам чашу воды напиться» в современном литературном русском звучит естественнее. «Во имя того, что вы принадлежите Мессии» стилистически тяжеловесно и семантически неидиоматично. Причинный оборот делает фразу ясной, не снижая евангельского регистра.
  terminology: «Мессия» точно передаёт Χριστός как титул. «Истинно говорю вам» и «не лишится своей награды» удачны. Сноска должна фиксировать формальную альтернативу, а не повторять выбранное причинное чтение как «или».
  issues:
  - severity: medium
    issue: Неестественная конструкция «во имя того, что»
    rationale: Она формально калькирует греческое ἐν ὀνόματι ὅτι, но в современном русском не выражает ясно ни основание действия, ни его мотив. Причинное «потому что» является естественной и текстологически допустимой передачей ὅτι; формальное чтение следует вынести в примечание.
  - severity: low
    issue: Сноска маркирована как альтернатива, но повторяет причинное понимание
    rationale: Основной текст уже фактически выражает связь через «того, что», а примечание предлагает «потому что». После естественного причинного перевода сноска должна отмечать более буквальную, хотя и неидиоматичную, формальную конструкцию оригинала.
