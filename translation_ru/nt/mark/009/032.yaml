  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: ru
  text: Но они не понимали сказанного[a] и боялись спросить Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этого высказывания», «этого изречения». Греческое ῥῆμα может означать произнесённое слово, изречение или высказывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Но они
  rationale: δέ обозначает здесь мягкое противопоставление предшествующему предсказанию Иисуса; подразумеваемые ученики естественно переданы местоимением «они».
- source_word: ἠγνόουν
  choice: не понимали
  rationale: ἀγνοέω в данном контексте означает неспособность понять сказанное. Имперфект передаёт продолжавшееся состояние и естественно выражается формой «не понимали».
- source_word: τὸ ῥῆμα
  choice: этих слов
  rationale: ῥῆμα здесь относится к только что произнесённым словам Иисуса, то есть ко всему Его предсказанию. Русское «этих слов» звучит естественно, хотя буквально возможно единственное число «сказанное».
- source_word: ἐφοβοῦντο
  choice: боялись
  rationale: Имперфект φοβέομαι обозначает продолжавшееся состояние страха; русская форма «боялись» точно и естественно его передаёт.
- source_word: αὐτὸν ἐπερωτῆσαι
  choice: спросить Его
  rationale: ἐπερωτάω означает «спрашивать, задавать вопрос», а αὐτόν относится к Иисусу. Такой порядок слов естественен для современного литературного русского языка.
theological_decisions: []
