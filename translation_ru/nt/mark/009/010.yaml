  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: ru
  text: Они сохранили сказанное между собой и обсуждали, что значит «воскреснуть из мёртвых».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскреснуть из числа мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: эти слова
  rationale: В данном контексте λόγος обозначает сказанное Иисусом в предыдущем стихе. «Эти слова» естественно отсылает к его высказыванию и не сводит λόγος к отдельному слову.
- source_word: ἐκράτησαν πρὸς ἑαυτούς
  choice: сохранили эти слова между собой
  rationale: Сочетание передаёт как удержание сказанного в памяти, так и его сохранение внутри круга учеников. Русское выражение оставляет эту смысловую широту и согласуется с последующим обсуждением между ними.
- source_word: συζητοῦντες
  choice: обсуждали
  rationale: Причастие указывает на совместное выяснение вопроса и не требует значения острого спора.
- source_word: τί ἐστιν
  choice: что значит
  rationale: В контексте ученики пытаются понять смысл выражения; это естественная русская передача буквального «что есть».
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: «воскреснуть из мёртвых»
  rationale: Артиклевый инфинитив обозначает выражение, которое обсуждают ученики. Формулировка сохраняет образ выхода из среды мёртвых и звучит понятно на современном русском.
theological_decisions:
- issue: Смысл слов о воскресении в обсуждении учеников
  choice: «воскреснуть из мёртвых»
  alternative: «воскреснуть из числа мёртвых»
  rationale: Перевод сохраняет воскресительную лексику и недоумение учеников, не добавляя позднейшего богословского объяснения. Более развёрнутый вариант точнее раскрывает ἐκ, но менее естественен в основном тексте.
translation_notes:
  register: Современный литературный русский; повествование ясное и сдержанное. Кавычки показывают, что предметом обсуждения было само выражение Иисуса. Формулировка не усиливает συζητοῦντες до «спорили» и сохраняет смысловую напряжённость.
