  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: ru
  text: 'И появилось облако, осенявшее их, и из облака раздался голос: «Это Мой возлюбленный Сын. Слушайте Его[a]».


    [a] Или: «Внимайте Ему». Повеление означает не просто услышать, но внимательно прислушаться к Нему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Внимайте Ему». Повеление означает не просто услышать, но внимательно прислушаться к Нему.'
    reason: Лексическая альтернатива поясняет прагматическую силу ἀκούετε, не заменяя её более узким значением «повинуйтесь».
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: появилось облако
  rationale: Глагол γίνομαι здесь обозначает наступление или возникновение события. «Появилось облако» естественно передаёт внезапность, не добавляя толкования.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: осенившее их
  rationale: «Осенить» сохраняет образ облака, покрывающего присутствующих своей тенью, и уместную для повествования о Божьем явлении торжественность, не объясняя образ сверх сказанного.
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: из облака раздался голос
  rationale: По-русски голос естественно «раздаётся»; оборот сохраняет исходное направление ἐκ — голос исходит из облака — без добавления отдельного глагола речи.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Мой возлюбленный Сын
  rationale: «Возлюбленный» точно передаёт ἀγαπητός и сохраняет особую силу небесного утверждения. Порядок слов выбран ради естественного современного русского языка.
- source_word: ἀκούετε αὐτοῦ
  choice: Слушайте Его
  rationale: Императив означает не только физически слышать, но внимательно воспринимать сказанное. «Слушайте Его» сохраняет этот диапазон смысла и не сужает выражение до прямого «повинуйтесь».
theological_decisions:
- issue: Небесное свидетельство о личности Иисуса
  choice: «Это Мой возлюбленный Сын» передано как прямое утверждение Бога об Иисусе.
  alternative: «Это Сын Мой, Возлюбленный»
  rationale: Греческий текст прямо называет Иисуса Сыном Бога. Естественный русский порядок слов сохраняет христологическую силу высказывания без дополнительного догматического разъяснения.
- issue: Смысл повеления ἀκούετε αὐτοῦ
  choice: «Слушайте Его»
  alternative: «Повинуйтесь Ему» или «Услышьте Его»
  rationale: В контексте повеление предполагает внимательное, отзывчивое слушание, однако греческий глагол не является однозначным эквивалентом «повиноваться». Поэтому сохранена смысловая широта исходного выражения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Осенившее» сохраняет образность исходного причастия; в остальных местах синтаксис сделан естественным для современного читателя.
