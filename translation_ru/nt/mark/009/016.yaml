lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: В повествовательном контексте аорист ἐπερωτάω естественно передаётся обычным русским глаголом «спросил», вводящим прямую речь.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение сохраняет присущую греческому тексту неопределённость и не уточняет без необходимости, идёт ли речь об учениках, книжниках или всей группе.
- source_word: Τί
  choice: о чём
  rationale: В сочетании с глаголом обсуждения или спора τί указывает на предмет разговора; по-русски естественно «о чём».
- source_word: συζητεῖτε
  choice: спорите
  rationale: В контексте столкновения книжников с учениками глагол συζητέω естественно допускает оттенок спора или пререкания. «Спорите» передаёт этот оттенок, не усиливая его до открытой ссоры.
- source_word: πρὸς αὑτούς
  choice: друг с другом
  rationale: Оборот имеет взаимное значение и по-русски идиоматично передаётся выражением «друг с другом».
- source_word: καὶ
  choice: И
  rationale: Союз связывает действие с предшествующим повествованием без дополнительного уточнения временной последовательности.
