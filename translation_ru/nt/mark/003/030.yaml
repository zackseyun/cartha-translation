lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину сказанного Иисусом ранее и естественно передаёт причинную связь.
- source_word: ἔλεγον
  choice: они говорили
  rationale: Имперфект указывает на продолжавшееся или повторявшееся обвинение; русская форма «говорили» сохраняет этот аспект.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: нечистый дух
  rationale: Это устойчивое евангельское обозначение демонического духа, сохраняющее прямое значение ἀκάθαρτον.
- source_word: ἔχει
  choice: В Нём
  rationale: Русская конструкция «в нём нечистый дух» естественно передаёт греческое «имеет нечистого духа», не превращая подразумеваемую одержимость в прямое утверждение основного текста.
theological_decisions:
- issue: Характер обвинения против Иисуса
  choice: 'Сохранить прямое обвинение: «В Нём нечистый дух»'
  alternative: «Он одержим нечистым духом»
  rationale: Основной текст сохраняет резкость обвинения и не делает подразумеваемую одержимость более явной, чем в греческом ἔχει. Идиоматическое истолкование дано в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественно-нейтральная. Местоимение «Нём» написано с прописной буквы согласно распространённой русской библейской традиции.
