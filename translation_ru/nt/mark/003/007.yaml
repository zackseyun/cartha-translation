lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: удалился
  rationale: Глагол означает уход или отступление и может подразумевать удаление под давлением обстоятельств; «удалился» сохраняет этот оттенок, не усиливая его до бегства.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: вместе со Своими учениками
  rationale: «Ученики» — естественное и устоявшееся обозначение последователей Иисуса; «вместе» ясно передаёт совместность действия.
- source_word: πρὸς τὴν θάλασσαν
  choice: к морю
  rationale: Предлог πρός с винительным указывает на движение к морю и не требует утверждать, что Иисус уже достиг берега; θάλασσα буквально передано словом «море».
- source_word: πολὺ πλῆθος
  choice: великое множество людей
  rationale: Передаёт значительную численность собравшихся и звучит естественно в современном литературном русском; добавление «людей» делает выражение ясным.
- source_word: ἠκολούθησεν
  choice: последовало за Ним
  rationale: В данном контексте глагол обозначает физическое следование за Иисусом; дополнение «за Ним» естественно по-русски и ясно восстанавливает объект.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: из Галилеи
  rationale: Точно передаёт происхождение людей.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: и из Иудеи,
  rationale: Сохраняет продолжение перечня в следующем стихе; конечная запятая отражает синтаксическую незавершённость стиха.
