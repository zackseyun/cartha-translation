  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: ru
  text: и Андрея, и Филиппа, и Варфоломея, и Матфея, и Фому, и Иакова, сына Алфея, и Фаддея, и Симона Кананита[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. Кананит; вероятно, это слово означает «ревнитель», как в Лк 6:15, а не указывает на происхождение из Ханаана.
    reason: Разъяснение вероятного арамейского происхождения и значения неоднозначного эпитета.
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Повтор союза сохранён, чтобы передать паратактическое построение греческого перечня.
- source_word: Ἀνδρέαν
  choice: Андрея
  rationale: Употреблена общепринятая русская форма имени.
- source_word: Φίλιππον
  choice: Филиппа
  rationale: Употреблена общепринятая русская форма имени.
- source_word: Βαρθολομαῖον
  choice: Варфоломея
  rationale: Употреблена общепринятая русская форма имени.
- source_word: Μαθθαῖον
  choice: Матфея
  rationale: Употреблена общепринятая русская форма имени.
- source_word: Θωμᾶν
  choice: Фому
  rationale: Употреблена общепринятая русская форма имени.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Иакова, сына Алфея
  rationale: Конструкция с родительным падежом естественно понимается как указание на отца; слово «сына» делает эту связь ясной по-русски.
- source_word: Θαδδαῖον
  choice: Фаддея
  rationale: Употреблена общепринятая русская форма имени.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Симона Кананита
  rationale: Сохранена традиционная русская передача греческого эпитета, а его вероятное значение разъяснено в сноске без подмены формы, стоящей у Марка.
theological_decisions:
- issue: Значение эпитета Καναναῖος
  choice: Кананит
  alternative: Ревнитель; Зилот; хананеянин
  rationale: Вероятнее всего, греческая форма передаёт арамейское обозначение ревнителя, что согласуется с ζηλωτής в Лк 6:15. Однако в основном тексте сохранён особый эпитет Марка, а не внесено однозначное толкование; этническое понимание как «хананеянин» маловероятно.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Повторяющееся «и» сохраняет ритм исходного перечня; фрагмент начинается со строчной буквы, поскольку продолжает предложение предыдущего стиха.
