  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: ru
  text: 'И всякий раз, когда нечистые духи видели Его, они падали перед Ним[a] и кричали: «Ты — Сын Божий!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросались перед Ним на землю». Греческий глагол может обозначать падение перед кем-либо в знак подчинения или мольбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: нечистые духи
  rationale: Прямой и устоявшийся евангельский термин сохраняет смысл ἀκάθαρτα точнее, чем более толковательное «злые духи».
- source_word: ὅταν
  choice: всякий раз, когда
  rationale: 'В сочетании с формами имперфекта передаёт повторяемость: при каждой встрече духи поступали одинаково.'
- source_word: ἐθεώρουν
  choice: видели
  rationale: Естественная передача глагола θεωρέω в данном повествовательном контексте; повторяемость выражена оборотом «всякий раз, когда».
- source_word: προσέπιπτον αὐτῷ
  choice: падали перед Ним
  rationale: Передаёт телесное действие и подчинённое положение, не уточняя без достаточного основания, было ли это поклонением, мольбой или вынужденным признанием власти.
- source_word: ἔκραζον λέγοντα
  choice: кричали
  rationale: Двоеточие перед прямой речью естественно передаёт сочетание личного глагола и причастия без тяжеловесного «кричали, говоря».
- source_word: Σὺ εἶ
  choice: Ты —
  rationale: Местоимение сохранено, а именная конструкция естественно оформлена по-русски с помощью тире.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Сохраняет титульный и христологический вес греческого выражения в его традиционной и понятной русской форме.
theological_decisions:
- issue: Следует ли понимать падение нечистых духов перед Иисусом как поклонение
  choice: падали перед Ним
  alternative: поклонялись Ему; падали ниц перед Ним
  rationale: Глагол προσπίπτω может обозначать падение перед кем-либо в знак подчинения, почтения или мольбы. Сам стих прямо не называет это поклонением, поэтому перевод сохраняет физическое действие и не снимает богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Оборот «всякий раз, когда» передаёт повторяемость, а прямая речь после двоеточия звучит естественнее буквального «кричали, говоря».
