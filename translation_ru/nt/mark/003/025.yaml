  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: ru
  text: И если дом разделится сам в себе[a], этот дом не сможет устоять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семья разделится сама в себе». Греческое οἰκία может означать как дом, так и семью или домочадцев, однако слово «устоять» поддерживает здесь образ дома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: дом
  rationale: Основное значение — «дом». В сочетании с глаголом «устоять» конкретный образ здания особенно естественен, хотя слово может также обозначать семью или домочадцев.
- source_word: ἐφ’ ἑαυτὴν
  choice: сам против себя
  rationale: Оборот выражает внутреннее противостояние; по-русски сочетание «дом разделится сам против себя» сохраняет рефлексивность и напряжение исходного образа.
- source_word: μερισθῇ
  choice: разделится
  rationale: Аорист пассивного сослагательного наклонения в общем условии передаёт наступившее внутреннее разделение. Русская возвратная форма звучит естественно и не уточняет внешнего деятеля.
- source_word: δυνήσεται
  choice: не сможет
  rationale: Будущая форма δύναμαι указывает на невозможность в результате названного условия; «не сможет» точно передаёт будущую способность.
- source_word: σταθῆναι
  choice: устоять
  rationale: Глагол сохраняет образ стоящего здания и одновременно естественно выражает смысл «сохраниться, выдержать».
- source_word: ἡ οἰκία ἐκείνη
  choice: этот дом
  rationale: Указательное местоимение ἐκείνη выделяет именно названный дом; в русском контексте анафорическое «этот дом» естественнее буквального «тот дом».
- source_word: καὶ ἐὰν
  choice: И если
  rationale: «И» сохраняет связь с предыдущим доводом, а «если» вводит общее условие.
