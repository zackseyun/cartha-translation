  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: ru
  text: Ведь кто исполняет волю Бога, тот Мне брат, и сестра, и мать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς … ἂν ποιήσῃ
  choice: кто исполняет
  rationale: Неопределённое относительное условие обозначает любого человека, соответствующего условию. Русское настоящее время естественно передаёт общее, вневременное утверждение.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущими словами Иисуса и естественно звучит в современном русском языке.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: волю Бога
  rationale: Прямая и ясная передача родительной конструкции без архаизации.
- source_word: οὗτος
  choice: тот
  rationale: В русской соотносительной конструкции «кто…, тот…» сохраняется указательная и выделительная сила οὗτος без введения исключительно мужского местоимения.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: Мне брат, и сестра, и мать
  rationale: Все три конкретных термина родства сохранены, как и накопительная сила повторяющегося καί. Дательный «Мне» естественно выражает отношение, переданное греческим μου.
theological_decisions:
- issue: Грамматический род единственного субъекта при перечислении мужского и женских родственных обозначений
  choice: кто … тот
  alternative: кто … он
  rationale: Соотносительная конструкция остаётся в единственном числе, сохраняет указательное выделение и не создаёт впечатления, будто высказывание относится только к мужчинам.
- issue: Характер семейной образности
  choice: сохранены буквальные названия родства в метафорическом употреблении
  alternative: член Моей семьи
  rationale: Обобщение ослабило бы риторическую силу слов Иисуса, который прямо называет брата, сестру и мать.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная без архаизмов. Повтор союзов намеренно сохранён ради ритма и смыслового выделения каждого родственного отношения.
