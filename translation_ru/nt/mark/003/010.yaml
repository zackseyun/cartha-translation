  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: ru
  text: Ведь Он исцелил многих, так что все, кто страдал от тяжёлых недугов[a], напирали на Него[b], чтобы прикоснуться к Нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бичей»; здесь имеются в виду тяжёлые, мучительные недуги или страдания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бросались к Нему»; греческое выражение подчёркивает напор людей, устремлявшихся к Иисусу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς γὰρ ἐθεράπευσεν
  choice: Ведь Он исцелил многих
  rationale: «Ведь» естественно передаёт пояснительное γάρ; аорист ἐθεράπευσεν передан совершенным видом как предшествующая причина поведения толпы.
- source_word: ὥστε
  choice: и потому
  rationale: Передаёт фактическое следствие исцелений в естественной русской связи между частями предложения.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: напирали на Него
  rationale: В контексте толпы выражает сильное физическое устремление к Иисусу и звучит естественнее буквального «падали на Него».
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: чтобы прикоснуться к Нему
  rationale: Сохраняет значение цели у ἵνα и обычное значение ἅπτομαι с родительным падежом — физически коснуться.
- source_word: ὅσοι εἶχον μάστιγας
  choice: все, кто страдал от тяжёлых недугов
  rationale: ὅσοι имеет обобщающее значение «все, кто»; μάστιγας буквально означает «бичи», но здесь образно обозначает тяжёлые мучительные заболевания или страдания.
theological_decisions:
- issue: Характер μάστιγας в контексте исцеления
  choice: тяжёлые недуги
  alternative: болезни; бедствия; бичи
  rationale: Перевод сохраняет связь с исцелением и тяжесть страдания, не ограничивая слово узким медицинским диагнозом и не вводя буквальный образ бича в основной текст.
translation_notes:
  register: Современный литературный русский язык, доступный широкому читателю. Синтаксис сохраняет пояснительно-следственную структуру оригинала; «напирали» передаёт энергичность ἐπιπίπτειν без неестественного буквализма. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской издательской традиции.
