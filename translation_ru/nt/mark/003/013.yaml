id: MRK.3.13
reference: Mark 3:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: ru
  text: Иисус поднялся на гору, позвал к себе тех, кого сам хотел, и они пришли к нему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: поднялся
  rationale: Историческое настоящее передано прошедшим временем, естественным для русского повествования; значение движения вверх сохранено.
- source_word: εἰς τὸ ὄρος
  choice: на гору
  rationale: В сочетании с ἀναβαίνει оборот естественно означает подъём на гору; русский вариант краток и идиоматичен.
- source_word: προσκαλεῖται
  choice: позвал к себе
  rationale: Передаёт направленный к самому Иисусу призыв и личную вовлечённость, выраженную формой среднего залога.
- source_word: οὓς ἤθελεν αὐτός
  choice: тех, кого сам хотел
  rationale: «Хотел» естественно передаёт θέλω, а «сам» сохраняет явное эмфатическое αὐτός без догматического расширения смысла.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: они пришли к нему
  rationale: Хотя ἀπέρχομαι обычно обозначает уход или движение от исходной точки, πρὸς αὐτόν задаёт движение к Иисусу; по-русски «пришли к нему» естественно выражает итоговое направление.
theological_decisions:
- issue: Акцент на личном выборе Иисуса
  choice: «тех, кого сам хотел»
  alternative: «тех, кого хотел»
  rationale: Слово αὐτός подчёркивает собственную волю Иисуса. Перевод сохраняет этот акцент, но не превращает его в утверждение какой-либо более широкой доктрины об избрании.
translation_notes:
  register: Современный литературный русский язык; ясное и достойное повествование без архаизмов. Имя «Иисус» добавлено вместо местоимения для естественности отдельного стиха и ясности субъекта.
