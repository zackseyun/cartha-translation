lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Обычный соединительный союз, связывающий последнее имя с предшествующим перечнем апостолов.
- source_word: Ἰούδαν
  choice: Иуду
  rationale: Традиционная русская форма личного имени в винительном падеже, требуемом синтаксисом перечня.
- source_word: Ἰσκαριώθ
  choice: Искариота
  rationale: Традиционная транслитерация прозвания в форме, согласованной с именем; его неясная этимология не переводится предположительно.
- source_word: ὃς
  choice: который
  rationale: Естественно вводит определительное придаточное, относящееся к Иуде.
- source_word: καὶ
  choice: и
  rationale: 'В придаточном имеет присоединительно-усилительный оттенок: это дополнительная характеристика Иуды. Русское «и» сохраняет его без излишнего усиления.'
- source_word: παρέδωκεν
  choice: предал
  rationale: Глагол буквально может означать «передал» или «выдал», однако применительно к поступку Иуды контекстуально выражает предательство; русское «предал» естественно сохраняет и действие, и его нравственный смысл.
- source_word: αὐτόν
  choice: Его
  rationale: Прямое дополнение, относящееся к Иисусу. Прописная буква соответствует принятому русскому библейскому оформлению местоимений, относящихся к Нему.
theological_decisions:
- issue: Передача παραδίδωμι применительно к поступку Иуды по отношению к Иисусу
  choice: предал
  alternative: передал; выдал
  rationale: Сам по себе греческий глагол не всегда обозначает предательство, но здесь субъект и евангельский контекст придают поступку именно этот смысл. Основной текст передаёт его естественным русским словом, а более буквальные варианты сохраняются в сноске.
