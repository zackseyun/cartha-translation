source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: ru
  text: и Иакова, сына Зеведея, и Иоанна, брата Иакова (Он дал им имя[a] Воанергес, что означает «Сыны грома»),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имена»; множественное число, вероятно, относится к одному общему прозвищу, данному обоим братьям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Иакова
  rationale: Традиционная и общепринятая русская форма имени Ἰάκωβος применительно к новозаветному апостолу.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: сына Зеведея
  rationale: Конструкция с артиклем и родительным падежом обозначает происхождение по отцу; явное «сына» естественно передаёт смысл по-русски.
- source_word: Ἰωάννην
  choice: Иоанна
  rationale: Традиционная русская форма имени Ἰωάννης.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: брата Иакова
  rationale: ἀδελφός здесь обозначает родного брата и естественно передаётся словом «брат».
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: Он дал им имя
  rationale: Сочетание ἐπιτίθημι с ὄνομα идиоматически означает наречение именем или прозвищем; единственное число по-русски естественно для одного общего прозвища двух братьев, тогда как греческое множественное число отмечено в сноске.
- source_word: Βοανηργές
  choice: Воанергес
  rationale: Семитское прозвище транслитерировано, поскольку сам текст сохраняет его и затем разъясняет значение.
- source_word: ὅ ἐστιν
  choice: что означает
  rationale: Формула вводит перевод или толкование прозвища; этот вариант ясен и естествен в современном русском языке.
- source_word: Υἱοὶ Βροντῆς
  choice: Сыны грома
  rationale: Буквальный и выразительный перевод объяснения прозвища; «сыны» сохраняет образную форму устойчивого наименования.
theological_decisions:
- issue: Передача прозвища Иакова и Иоанна
  choice: Сохранить форму «Воанергес» и пояснение «Сыны грома»
  alternative: 'Передать только значение прозвища: «Сыны грома»'
  rationale: Исходный текст намеренно приводит и иноязычную форму, и её объяснение; сохранение обоих элементов передаёт эту особенность без привнесения богословского толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных форм библейских имён. Синтаксис продолжает перечень предыдущего стиха; скобки и конечная запятая сохранены в соответствии с фрагментарным контекстом стиха.
