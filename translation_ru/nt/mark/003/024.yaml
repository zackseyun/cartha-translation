review_pass:
  verdict: revise
  source_fidelity: 'Смысл условного высказывания передан верно: царство, внутренне разделённое, не может устоять. Однако сочетание «разделится само против себя» в современном русском звучит как неестественная калька. Греческое ἐφ’ ἑαυτὴν в данном контексте обозначает направленное на себя внутреннее разделение; «само в себе» передаёт это без добавления причины или участников конфликта.'
  naturalness: «Разделится само в себе» — устойчивое и понятное литературное выражение для внутреннего раскола. Удаление частицы «то» делает фразу несколько компактнее, не меняя логической связи.
  terminology: «Царство», «устоять» и повтор «такое царство» удачно сохраняют политический образ, метафору и риторическое выделение ἡ βασιλεία ἐκείνη. Специальных богословских терминов или примечаний не требуется.
  issues:
  - severity: medium
    issue: Неестественное сочетание «разделится само против себя».
    rationale: Оно формально воспроизводит «against itself», но в современном литературном русском обычно говорят о царстве, «разделившемся само в себе». Этот вариант ясно выражает внутренний раскол и не расширяет смысл.
  revised_text: И если царство разделится само в себе, такое царство не сможет устоять.
  revised_footnotes: []
  revision_rationale: Исправлена только неидиоматичная передача греческого выражения ἐφ’ ἑαυτὴν. Условная конструкция, повтор «царство», указательное значение ἐκείνη и образ «устоять» сохранены.
