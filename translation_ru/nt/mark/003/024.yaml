  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: ru
  text: И если царство разделится само в себе, такое царство не сможет устоять.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз сохраняет прямую связь с предшествующим рассуждением.
- source_word: ἐὰν
  choice: если
  rationale: Передаёт условную конструкцию с сослагательным наклонением и естественно звучит в общем утверждении.
- source_word: βασιλεία
  choice: царство
  rationale: В данной аналогии речь идёт о царстве как о целостном общественно-политическом образовании, а не отвлечённо о царствовании.
- source_word: ἐφ’ ἑαυτὴν
  choice: само против себя
  rationale: Передаёт внутреннее противостояние; местоимение согласовано с русским существительным среднего рода «царство».
- source_word: μερισθῇ
  choice: разделится
  rationale: Естественная русская формулировка условного предложения передаёт значение внутреннего разделения, не уточняя его причину.
- source_word: οὐ δύναται
  choice: не сможет
  rationale: Кратко и естественно выражает невозможность в рамках условного высказывания.
- source_word: σταθῆναι
  choice: устоять
  rationale: Сохраняет образ стояния и одновременно естественно означает продолжить существование.
- source_word: ἡ βασιλεία ἐκείνη
  choice: такое царство
  rationale: Указательное «такое» естественно отсылает к царству, описанному в условной части, и сохраняет повтор существительного.
theological_decisions:
- issue: Характер высказывания
  choice: Передать стих как общий принцип внутри довода Иисуса, не расширяя его до самостоятельного учения о политических образованиях или о сатане.
  alternative: Передать как универсальную общественно-политическую максиму.
  rationale: В контексте это аналогия в ответе Иисуса; перевод сохраняет афористичность, но не добавляет утверждений, которых сам стих не делает.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сохранены условная структура, повтор слова «царство» и метафора способности устоять.
