  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: ru
  text: 'И, подозвав их, Он говорил им притчами: «Как может Сатана изгонять Сатану?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвав их
  rationale: 'Аористное причастие от προσκαλέομαι обозначает предшествующее действие: Иисус позвал их к Себе, прежде чем заговорить. «Подозвав» естественно и кратко передаёт это движение к говорящему.'
- source_word: ἐν παραβολαῖς
  choice: притчами
  rationale: В синоптическом контексте παραβολή обозначает наглядное сравнение или образное изречение. Творительный падеж естественно передаёт греческое ἐν, а множественное число сохранено.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт развёрнутое высказывание, а русское «говорил» сохраняет несовершенный вид и звучит естественно в повествовании.
- source_word: Πῶς δύναται
  choice: Как может
  rationale: Сочетание вводит риторический вопрос о возможности; «Как может» кратко и естественно сохраняет его силу.
- source_word: Σατανᾶς
  choice: сатана
  rationale: Традиционная русская передача имени или титула. Строчная буква сохраняет принятую в современных русских библейских переводах возможность восприятия слова как обозначения противника, не снимая его контекстуальной персонификации.
- source_word: ἐκβάλλειν
  choice: изгонять
  rationale: Глагол ἐκβάλλω у Марка регулярно употребляется применительно к изгнанию бесов. «Изгонять» точно передаёт этот контекст и естественно сочетается с несовершенным видом в вопросе общего характера.
theological_decisions:
- issue: Смысл вопроса о том, может ли сатана действовать против самого себя
  choice: «Как может сатана изгонять сатану?» — риторический вопрос, ставящий под сомнение саму возможность такого действия.
  alternative: «Каким образом сатана способен изгонять сатану?»
  rationale: Греческий текст спрашивает о возможности и в контексте выявляет внутреннюю несостоятельность обвинения. Перевод сохраняет риторическую силу, не добавляя объяснения в основной текст.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Синтаксис сохраняет последовательность действий и несовершенный вид основного глагола без тяжеловесной буквальности.
