base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: ru
  text: 'Вокруг Него сидела толпа, и Ему сказали: «Вот, Твоя мать и Твои братья снаружи и ищут Тебя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разыскивают Тебя». Греческий глагол может означать «искать» или «разыскивать»; здесь речь, вероятно, идёт о попытке найти Его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: сидела
  rationale: Имперфект изображает продолжающуюся фоновую сцену; в русском прошедшее несовершенного вида естественно передаёт этот аспект.
- source_word: περὶ αὐτὸν ὄχλος
  choice: Вокруг Него сидела толпа
  rationale: περί с винительным указывает на расположение вокруг; порядок слов сохраняет пространственный образ и звучит естественно по-русски.
- source_word: λέγουσιν
  choice: Ему сказали
  rationale: Настоящее историческое передано обычным для русского повествования прошедшим временем; неопределённо-личная конструкция не уточняет названных в тексте говорящих.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Частица привлекает внимание к сообщению; «вот» современно и не имеет архаического оттенка.
- source_word: μήτηρ
  choice: мать
  rationale: Прямое соответствие обычному термину родства.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранено грамматически мужское множественное число без толкования характера родства.
- source_word: ἔξω
  choice: стоят снаружи
  rationale: «Снаружи» передаёт местонахождение; добавленное «стоят» естественно выражает по-русски ситуацию, не утверждая конкретной позы как смысловой детали.
- source_word: ζητοῦσίν σε
  choice: ищут Тебя
  rationale: ζητέω буквально допускает значение поиска; «ищут Тебя» сохраняет его широту и не сводит смысл к просьбе выйти.
theological_decisions:
- issue: Кого обозначает ἀδελφοί
  choice: братья
  alternative: близкие родственники; братья и сёстры
  rationale: Сам стих использует обычное слово «братья» и не поясняет точный характер семейной связи; прямой перевод не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции.
