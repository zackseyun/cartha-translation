  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: ru
  text: И Он много раз строго запрещал им предавать Его огласке[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делать Его известным», «раскрывать Его»; более буквально: «делать Его явным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: много раз
  rationale: Наречное употребление среднего рода множественного числа передаёт повторяемость или усиленность действия; «много раз» естественно сохраняет значение повторности.
- source_word: ἐπετίμα
  choice: строго запрещал
  rationale: Глагол выражает властное, резкое предостережение или приказ. В сочетании с отрицательной конструкцией по-русски естественно звучит «строго запрещал».
- source_word: αὐτοῖς
  choice: им
  rationale: Местоимение во множественном числе относится к нечистым духам из непосредственного контекста.
- source_word: ἵνα μὴ
  choice: запрещал… открывать
  rationale: Конструкция передаёт содержание или цель строгого приказа с отрицательным значением; русский инфинитив после «запрещал» выражает это ясно и естественно.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: открывать, кто Он
  rationale: Оборот означает сделать кого-либо явным, известным или публично раскрыть его личность. «Открывать, кто Он» естественно передаёт раскрытие личности Иисуса, не уточняя содержание признания сверх сказанного в стихе.
theological_decisions:
- issue: Характер запрета, обращённого к нечистым духам
  choice: Запрет раскрывать, кто такой Иисус, без уточнения конкретного титула
  alternative: Прямой запрет называть Его Сыном Божьим либо общее повеление молчать
  rationale: Ближайший контекст подразумевает раскрытие личности Иисуса, однако сам стих не повторяет титул «Сын Божий». Перевод сохраняет эту недосказанность и не добавляет отсутствующего уточнения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прописная буква в местоимении «Он» соответствует принятому русскому библейскому регистру; повторность πολλὰ передана явно.
