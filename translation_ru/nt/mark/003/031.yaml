    rationale: 'Эта русская конструкция меняет пространственную перспективу: подразумевает посылку за Иисусом, чтобы привести Его, вместо посылки к Нему. Греческое πρὸς αὐτόν требует передать направление к Иисусу; объект глагола «послали» может оставаться невыраженным, как и в оригинале.'
