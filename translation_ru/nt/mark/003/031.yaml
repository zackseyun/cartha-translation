  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: ru
  text: И пришли Его мать и братья и, стоя снаружи, послали к Нему, зовя Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Союз продолжает повествование; простое «И» сохраняет связь с предыдущим эпизодом без излишнего уточнения временной последовательности.
- source_word: ἔρχονται
  choice: пришли
  rationale: Настоящее время употреблено как повествовательное историческое настоящее; русское прошедшее время звучит естественно в данном контексте.
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: Его мать и братья
  rationale: Передаёт родственные обозначения прямо и не уточняет характер братства сверх сказанного в греческом тексте; повтор местоимения по-русски не требуется.
- source_word: ἔξω στήκοντες
  choice: стоя снаружи
  rationale: Сохраняет пространственное значение ἔξω и одновременное обстоятельство, выраженное причастием.
- source_word: ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν
  choice: послали за Ним, чтобы позвать Его
  rationale: Естественная русская конструкция передаёт как отправление к Иисусу подразумеваемого посредника, так и цель — позвать Его; не добавляется указание, кто именно был послан.
theological_decisions:
- issue: Кого обозначают «Его братья»
  choice: Передать буквально как «Его братья» без пояснения степени родства.
  alternative: Истолковать как единоутробных братьев, сводных братьев или более дальних родственников.
  rationale: Сам стих называет их ἀδελφοί, но не определяет точнее характер родственной связи; перевод не должен разрешать этот конфессионально значимый вопрос за текст.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным строем. Заглавные местоимения при обозначении Иисуса употреблены в соответствии с принятой в русском библейском стиле почтительной нормой.
