review_pass:
  verdict: revise
  source_fidelity: «Послали за Ним» в русском языке обычно означает «послали кого-то, чтобы привести Его», тогда как ἀπέστειλαν πρὸς αὐτόν обозначает направление посланных к Нему. Безопаснее сохранить направление «к Нему», не уточняя, кого именно послали.
  naturalness: Исправленный вариант остаётся современным литературным русским и естественно передаёт последовательность действий. Сочетание «послали к Нему, зовя Его» возможно в повествовательном стиле и не требует добавлять слово «людей» или «вестника».
  terminology: «Мать и братья» точно передаёт μήτηρ и ἀδελφοί и не разрешает вопрос о характере родства. Почтительное написание местоимений с прописной буквы последовательно и допустимо для русского библейского регистра.
