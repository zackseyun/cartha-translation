  verdict: approve
  source_fidelity: 'Текст точно передаёт греческую конструкцию и образность: adversative «Но», невозможность («никто не может»), вхождение в дом сильного человека, разграбление его имущества, предварительное связывание и последующее разграбление дома. Повтор «разграбить / разграбит» обоснованно отражает повтор διαρπάζω. Деепричастие «войдя» естественно передаёт εἰσελθών и не нарушает временной последовательности.'
