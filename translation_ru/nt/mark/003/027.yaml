  terminology: «Сильный человек» последовательно передаёт субстантивированное ἰσχυρός. «Имущество» удачно передаёт τὰ σκεύη в контексте ограбления; сноска корректно сохраняет более буквальный вариант. Сноска к образу не вносит это толкование в основной текст и осторожно формулирует его как контекстуальный смысл.
