id: MRK.3.27
reference: Mark 3:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: ru
  text: Но никто не может, войдя в дом сильного человека[b], разграбить его имущество[a], если прежде не свяжет этого сильного человека; и тогда разграбит его дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его вещи»; более буквально: «его сосуды, предметы».'
    reason: lexical_alternative
  - marker: b
    text: «Сильный человек» — часть образа, которым Иисус говорит о победе над сатаной; в основном тексте сохранён сам образ, а не подставлено его толкование.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление предыдущему обвинению и продолжает опровержение Иисуса естественным русским союзом.
- source_word: οὐδεὶς δύναται
  choice: никто не может
  rationale: Точно и естественно передаёт отрицание возможности.
- source_word: εἰς τὴν οἰκίαν … εἰσελθὼν
  choice: войдя в дом
  rationale: Деепричастная конструкция сохраняет обстоятельственный аористный причастный оборот и последовательность действий.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: сильного человека / этого сильного человека
  rationale: Субстантивированное прилагательное передано понятным русским выражением; при повторе указательное местоимение подчёркивает анафорическую определённость, не меняя образа.
- source_word: τὰ σκεύη αὐτοῦ
  choice: его имущество
  rationale: В контексте разграбления дома множественное σκεύη обозначает принадлежащие хозяину вещи; «имущество» естественно охватывает этот смысл, а буквальная возможность отмечена в сноске.
- source_word: διαρπάσαι / διαρπάσει
  choice: разграбить / разграбит
  rationale: Глагол выражает насильственное расхищение и повторён в переводе в соответствии с греческим текстом.
- source_word: ἐὰν μὴ πρῶτον
  choice: если прежде не
  rationale: Сохраняет необходимое предварительное условие и временной порядок.
- source_word: δήσῃ
  choice: свяжет
  rationale: Прямо передаёт образ физического связывания, не заменяя его отвлечённым толкованием.
- source_word: καὶ τότε
  choice: и тогда
  rationale: Сохраняет переход к последующему действию после исполнения условия.
theological_decisions:
- issue: Метафорический смысл выражения «сильный человек» в рассуждении Иисуса о сатане
  choice: Сохранить образ «сильного человека» в основном тексте.
  alternative: Прямо назвать сильного человека сатаной или передать выражение отвлечённо как «могущественный».
  rationale: Контекст указывает на победу Иисуса над сатаной, однако сам греческий текст сохраняет форму образного изречения. Перевод не подменяет образ его истолкованием.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной повествовательной интонацией. Деепричастный оборот сохраняет структуру и последовательность исходного текста; лексика остаётся конкретной и поддерживает образ проникновения в дом, связывания хозяина и разграбления.
