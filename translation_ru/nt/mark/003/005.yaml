source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: ru
  text: 'И, оглядев их с гневом и скорбя из-за ожесточения их сердец[a], Он говорит человеку: «Протяни руку». Тот протянул её, и рука его восстановилась.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом слово «сердце» стоит в единственном числе при местоимении «их» и, вероятно, имеет собирательное значение.
    reason: Сохраняет и точно описывает формальную неоднозначность единственного числа καρδίας при местоимении множественного числа.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: оглядев их
  rationale: Аористное причастие передаёт действие, предшествующее историческому настоящему λέγει; «оглядев» естественно выражает направленный на окружающих взгляд.
- source_word: μετ’ ὀργῆς
  choice: с гневом
  rationale: μετά с родительным обозначает сопутствующий образ действия; прямой перевод сохраняет силу эмоции, не усиливая её словом «ярость».
- source_word: συλλυπούμενος
  choice: скорбя
  rationale: Причастие обозначает глубокую печаль и внутреннюю боль; деепричастие сохраняет одновременность гнева и скорби.
- source_word: ἐπὶ τῇ πωρώσει
  choice: из-за ожесточения
  rationale: ἐπί с дательным указывает на причину скорби, а πώρωσις — на нравственную нечувствительность, чёрствость или ожесточённость. «Ожесточение» сохраняет традиционную метафору и понятно современному читателю.
- source_word: τῆς καρδίας αὐτῶν
  choice: их сердец
  rationale: В греческом «сердце» стоит в единственном числе при местоимении во множественном; по-русски естественнее distributive plural «их сердец». Формальная особенность оригинала отмечена в сноске.
- source_word: λέγει
  choice: Он говорит
  rationale: Настоящее историческое сохранено, чтобы передать характерную для Марка живость повествования.
- source_word: τῷ ἀνθρώπῳ
  choice: человеку
  rationale: В контексте речь идёт о конкретном мужчине, однако русское «человеку» точно и естественно соответствует ἀνθρώπῳ без ненужного повторения слова «мужчина».
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Протяни руку
  rationale: Краткая форма естественно передаёт решительное повеление и сохраняет связь с последующим исполнением.
- source_word: ἐξέτεινεν
  choice: Тот протянул её
  rationale: Местоимение «тот» ясно меняет субъект после слов Иисуса, а «протянул» сохраняет словесный повтор оригинала.
- source_word: ἀπεκατεστάθη
  choice: восстановилась
  rationale: Пассивная форма означает возвращение руки в прежнее нормальное состояние; «восстановилась» точнее, чем более общее «исцелилась».
theological_decisions:
- issue: Гнев и скорбь Иисуса
  choice: 'Обе эмоции переданы прямо: «с гневом и скорбя».'
  alternative: Смягчить ὀργή как «негодование» либо передать только печаль.
  rationale: Оригинал одновременно называет гнев и скорбь Иисуса; перевод сохраняет эту богословскую и эмоциональную напряжённость без сглаживания.
- issue: Причина скорби
  choice: «из-за ожесточения их сердец»
  alternative: «глядя на ожесточение» или «по поводу чёрствости их сердец»
  rationale: Конструкция естественно выражает причинное значение ἐπί с дательным и не приписывает тексту дополнительного объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее «говорит» сохранено; синтаксис сделан естественным, а эмоциональная напряжённость оригинала не смягчена.
