  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: ru
  text: И Он велел Своим ученикам, чтобы для Него всегда была наготове небольшая лодка из-за толпы, чтобы Его не теснили[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не раздавили Его». Греческий глагол может означать теснить, сдавливать или раздавливать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: велел
  rationale: В сочетании с ἵνα здесь передаётся не просто сообщение, а распоряжение ученикам; «велел» естественно выражает эту силу.
- source_word: μαθηταῖς
  choice: ученикам
  rationale: Стандартное и контекстуально точное обозначение учеников Иисуса, сохраняющее отношения учителя и последователей.
- source_word: πλοιάριον
  choice: небольшую лодку
  rationale: Передаёт уменьшительный оттенок существительного и естественно звучит по-русски.
- source_word: προσκαρτερῇ
  choice: держать наготове
  rationale: В данном контексте глагол обозначает постоянную готовность и доступность лодки; русское выражение ясно передаёт практический смысл.
- source_word: αὐτῷ
  choice: для Него
  rationale: Дательный падеж указывает, что лодка должна быть в распоряжении Иисуса.
- source_word: διὰ τὸν ὄχλον
  choice: из-за толпы
  rationale: διά с винительным выражает причину; перевод краток, естественен и точен.
- source_word: θλίβωσιν
  choice: теснили
  rationale: Глагол обозначает давление, сдавливание или стеснение толпой. «Теснили» естественно подходит к сцене, а более сильный оттенок сохранён в сноске.
