  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: ru
  text: 'И говорит человеку с иссохшей рукой[a]: «Встань и выйди на середину».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с высохшей рукой».'
    reason: Греческое ξηράν буквально означает «сухая»; в данном контексте оно описывает поражённую, утратившую нормальную функцию руку. «Иссохшая» — естественная литературная передача, не уточняющая диагноз.
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Историческое настоящее сохраняет характерную для Марка живость повествования и естественно звучит в русском библейском рассказе.
- source_word: ἀνθρώπῳ
  choice: человеку
  rationale: Русское «человеку» точно передаёт ἀνθρώπῳ; мужской пол лица уже ясен из контекста и грамматической формы.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: с иссохшей рукой
  rationale: Краткая атрибутивная конструкция естественна по-русски и передаёт состояние руки без уточнения причины или медицинского диагноза.
- source_word: ξηράν
  choice: иссохшей
  rationale: «Иссохшей» сохраняет основной образ сухости и утраты жизненной силы, оставаясь понятным обозначением поражённой руки.
- source_word: Ἔγειρε
  choice: Встань
  rationale: В данном контексте повелительная форма естественно означает «встань»; вариант не добавляет действия, которого нет в глаголе.
- source_word: εἰς τὸ μέσον
  choice: посередине
  rationale: Так передаётся требование занять место среди присутствующих; русская формулировка естественна и сохраняет пространственный смысл выражения.
