  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: ru
  text: 'Истинно говорю вам: сынам человеческим[a] будут прощены все грехи и все хуления, какие бы они ни произнесли;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть всем людям. Греческое выражение «сыны человеческие» здесь имеет обобщённое значение.
    reason: Лексическая альтернатива и пояснение включающего значения семитского оборота.
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Передаёт торжественную формулу Иисуса естественным и привычным для современного русского библейского стиля выражением, не удваивая Ἀμήν, как в характерной для Иоанна формуле.
- source_word: πάντα … τὰ ἁμαρτήματα
  choice: все грехи
  rationale: πάντα имеет всеохватное значение и далее уточняется существительным τὰ ἁμαρτήματα; русское сочетание ясно передаёт этот смысл без неуместного «всё» в значении всех вещей.
- source_word: ἀφεθήσεται
  choice: будут прощены
  rationale: В контексте грехов ἀφίημι означает прощение. Пассивная форма сохранена и не уточняет прямо подразумеваемого Бога как совершающего прощение.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: сынам человеческим
  rationale: Сохранён образный семитский оборот и грамматически мужская форма оригинала; сноска поясняет его обобщённое значение.
- source_word: αἱ βλασφημίαι
  choice: хуления
  rationale: «Хуления» сохраняет как речевой, так и религиозный смысл βλασφημία и лучше соответствует ближайшему контексту, чем более узкие «клевета» или «оскорбления».
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: какие бы они ни произнесли
  rationale: Конструкция передаёт неопределённый и неограниченный охват относительного оборота с ἐάν и сослагательным наклонением; глагол «произнесли» естественно сочетается с речевым характером хулений.
theological_decisions:
- issue: Соотношение всеохватного обещания прощения с последующим предостережением о хуле на Святого Духа
  choice: Сохранить в этом стихе безоговорочную по форме широту обещания прощения.
  alternative: Уже здесь встроить ограничение, сформулированное в следующем стихе.
  rationale: Сам стих сначала провозглашает широту прощения, тогда как исключение появляется далее. Перевод не должен преждевременно устранять создаваемое контекстом богословское напряжение.
- issue: Обобщённое значение выражения τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: Передать как «сынам человеческим» и пояснить включающее значение в сноске.
  alternative: Перевести непосредственно как «людям» или «человеческому роду».
  rationale: Так сохраняется конкретная форма исходного выражения, а сноска предотвращает ошибочное понимание, будто речь идёт только о мужчинах.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан прямым и понятным, при этом сохранены пассивная конструкция, речевой образ хуления и итоговая точка с запятой, связывающая стих с продолжающимся высказыванием.
