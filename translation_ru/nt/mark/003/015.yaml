  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: ru
  text: и иметь власть изгонять бесов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выгонять бесов».'
    reason: Лексическая альтернатива для ἐκβάλλειν, подчёркивающая принудительное удаление.
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Обычный сочинительный союз, связывающий этот инфинитивный оборот с предшествующими целями избрания Двенадцати.
- source_word: ἔχειν
  choice: иметь
  rationale: Прямой и естественный эквивалент инфинитива ἔχειν, сохраняющий синтаксическую связь с предыдущим стихом.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Передаёт предоставленное право и полномочие действовать, а не только безличную силу; соответствует контексту поручения, данного Иисусом.
- source_word: ἐκβάλλειν
  choice: изгонять
  rationale: В контексте освобождения от бесов естественно передаёт действие удаления или изгнания; настоящее инфинитива допускает обобщённое значение.
- source_word: τὰ δαιμόνια
  choice: бесов
  rationale: Точно передаёт δαιμόνια и не подменяет его встречающимся в других местах выражением «нечистые духи».
theological_decisions:
- issue: Характер ἐξουσία в поручении ученикам
  choice: власть
  alternative: силу
  rationale: «Власть» сохраняет акцент на полномочии, предоставленном Иисусом, не отрицая подразумеваемой способности совершать изгнание.
translation_notes:
  register: Современный литературный русский язык с традиционной и широко понятной библейской лексикой. Формулировка краткая и синтаксически продолжает Марка 3:14; «изгонять бесов» естественно для русского библейского регистра.
