  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: ru
  text: 'И сказал им: «Что позволено в субботу: делать добро или зло, спасать жизнь или убивать?» Но они молчали.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔξεστιν
  choice: Что позволено
  rationale: Вопрос касается допустимого по закону и обычаю; русское «что позволено» естественно передаёт юридико-нравственный смысл без тяжеловесности.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Форма множественного числа в греческом употреблена идиоматически; в данном эпизоде естественный русский эквивалент — единственное число «в субботу».
- source_word: ἀγαθοποιῆσαι
  choice: делать добро
  rationale: Прямо и естественно передаёт действие, приносящее благо.
- source_word: κακοποιῆσαι
  choice: делать зло
  rationale: Сохраняет явную нравственную антитезу греческих ἀγαθοποιῆσαι и κακοποιῆσαι; контекст включает и практический смысл причинения вреда.
- source_word: ψυχὴν
  choice: жизнь
  rationale: В противопоставлении убийству ψυχή означает жизнь человека, а не отдельно понимаемую нематериальную душу.
- source_word: σῶσαι
  choice: спасти
  rationale: Сохраняет обычное значение σῴζω и естественно сочетается со словом «жизнь».
- source_word: ἀποκτεῖναι
  choice: убить
  rationale: Передаёт основное значение глагола, не добавляя отсутствующего в тексте юридического оттенка убийства как преступления.
- source_word: ἐσιώπων
  choice: они молчали
  rationale: Имперфект изображает продолжающееся молчание в ответ на вопрос; русская форма естественна в повествовании.
theological_decisions:
- issue: Идиоматическое множественное число слова «суббота» в споре о дозволенном
  choice: в субботу
  alternative: по субботам / в субботы
  rationale: Хотя греческая форма стоит во множественном числе, здесь она идиоматична и относится к соблюдению субботы в конкретной повествовательной ситуации. Единственное число ясно и естественно передаёт смысл, не создавая впечатления серии отдельных суббот.
- issue: Нравственная и практическая сила κακοποιῆσαι
  choice: делать зло
  alternative: причинять вред
  rationale: «Делать зло» точнее сохраняет формальную антитезу «делать добро — делать зло», тогда как последующее «спасти жизнь или убить» раскрывает её практическую остроту. Вариант «причинять вред» возможен, но несколько сужает нравственный смысл.
translation_notes:
  register: Современный литературный русский язык; краткая, риторически уравновешенная фраза. Сохранены две параллельные антитезы и напряжённое заключительное молчание.
