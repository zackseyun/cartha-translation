  text: 'И, ответив им, Он говорит[a]: «Кто Моя мать и Мои братья?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более привычно по-русски: «Он ответил им: „Кто Моя мать и Мои братья?“» В греческом тексте употреблены аористное причастие и историческое настоящее: буквально «ответив им, говорит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: И, отвечая им, Он говорит
  rationale: Причастие аориста с историческим настоящим передано формально близко, чтобы сохранить характерную для Марка живость повествования; сочетание понятно и допустимо в современном литературном русском.
- source_word: Τίς
  choice: Кто
  rationale: Прямой и естественный русский эквивалент вопросительного местоимения, обозначающего установление личности.
- source_word: μήτηρ
  choice: мать
  rationale: Обычное, нейтральное и достойное обозначение родства.
- source_word: ἢ
  choice: и
  rationale: Хотя греческое ἢ обычно означает «или», в вопросе с двумя неоднородными по числу именными группами буквальное русское «или» звучит так, будто предлагается выбор между ними. Русское «и» естественно передаёт совокупный вопрос о матери и братьях без изменения его смысла.
- source_word: ἀδελφοί
  choice: братья
  rationale: Мужской род множественного числа сохранён без расширения до «братья и сёстры» или обобщения «родные».
theological_decisions:
- issue: Значение родственного термина ἀδελφοί
  choice: братья
  alternative: братья и сёстры; родные
  rationale: Перевод сохраняет грамматически мужское множественное число и не решает сверх текста вопрос о точной природе родства.
- issue: Форма вопроса о матери и братьях
  choice: «Кто Моя мать и Мои братья?»
  alternative: «Кто Моя мать или Мои братья?»
  rationale: Естественная русская координация не превращает вопрос в альтернативу и сохраняет риторическое напряжение контекста.
translation_notes:
  register: Современный литературный русский с умеренно формальным, библейски достойным звучанием. Заглавные местоимения при обращении к Иисусу применены согласно традиционной русской издательской практике. Порядок слов и настоящее время сохраняют повествовательную живость Марка.
