  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: ru
  text: Выйдя, фарисеи тотчас стали совещаться с иродианами против Иисуса о том, как погубить Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, конкретнее по смыслу данного контекста: «убить Его» или «предать Его смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: Выйдя
  rationale: Аористное причастие передаёт действие, предшествующее основному; деепричастие естественно и кратко связывает его с ближайшим контекстом — выходом из синагоги.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Сохраняет характерную для Марка стремительность повествования и звучит достойно и естественно в современном русском тексте.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: с иродианами
  rationale: μετά с родительным обозначает совместность. «Иродиане» — традиционное и понятное наименование сторонников династии Ирода.
- source_word: συμβούλιον ἐδίδουν
  choice: стали совещаться
  rationale: Греческий оборот означает держать совет, совещаться. «Стали» передаёт начинательное или развёртывающееся значение имперфекта, не добавляя к тексту более узкое понятие тайного заговора.
- source_word: κατ’ αὐτοῦ
  choice: против Иисуса
  rationale: 'κατά с родительным здесь имеет явно враждебное значение. Имя «Иисуса» употреблено вместо местоимения ради ясности русской референции: иначе «против Него» рядом с множественным субъектом может восприниматься менее плавно.'
- source_word: ὅπως
  choice: как бы
  rationale: В сочетании с сослагательным наклонением вводит намерение и способ его осуществления; русское «как бы» естественно передаёт обсуждение того, каким образом достичь цели.
- source_word: ἀπολέσωσιν
  choice: погубить Его
  rationale: «Погубить» сохраняет более широкий смысл ἀπόλλυμι — уничтожить, привести к гибели — и в данном контексте допускает ясное понимание смертельного намерения, не сужая глагол до одного значения в основном тексте.
theological_decisions:
- issue: Следует ли прямо назвать намерение фарисеев убийством в основном тексте
  choice: Сохранить более широкое «погубить Его».
  alternative: «убить Его» или «предать Его смерти»
  rationale: В данном контексте речь несомненно идёт об устранении Иисуса, вероятнее всего через смерть, однако ἀπόλλυμι обладает более широким значением. Основной текст сохраняет эту лексическую широту, а примечание поясняет очевидный контекстуальный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Тотчас» и «погубить» сохраняют достоинство регистра, оставаясь понятными. Заглавное написание местоимения «Его» принято как редакционная норма почтительного обозначения Иисуса.
