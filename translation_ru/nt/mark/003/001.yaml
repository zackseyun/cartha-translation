  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: ru
  text: И снова Он вошёл в синагогу[a]. Там был человек с иссохшей рукой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ту синагогу», если имеется в виду конкретная синагога, уже известная из контекста.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «с усохшей рукой»; буквально также возможно: «с высохшей рукой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Аорист εἰσέρχομαι в повествовании естественно передаётся совершенным видом «вошёл».
- source_word: πάλιν
  choice: снова
  rationale: Прямо выражает повторность действия и естественно звучит в современном русском повествовании.
- source_word: εἰς συναγωγήν
  choice: в синагогу
  rationale: Предлог εἰς при глаголе движения передан русской конструкцией «вошёл в»; отсутствие артикля не требует определять синагогу как уже известную, хотя такая трактовка возможна из контекста.
- source_word: ἦν ἐκεῖ
  choice: Там был
  rationale: Естественно передаёт как наличие человека, так и явное указание места посредством ἐκεῖ.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Обычное и точное соответствие ἄνθρωπος; контекст не требует заменять его более узким словом «мужчина».
- source_word: ἐξηραμμένην
  choice: иссохшей
  rationale: Перфектное причастие ξηραίνω описывает руку, которая иссохла и остаётся в таком состоянии; «иссохшая» сохраняет образ и привычно для повествования об исцелении.
- source_word: ἔχων τὴν χεῖρα
  choice: с иссохшей рукой
  rationale: Причастная конструкция идиоматично передана русским оборотом с предлогом «с», без буквального и тяжеловесного «имевший руку».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза разбита на два предложения для естественного повествовательного ритма. Местоимение «Он» относится к Иисусу и написано с прописной буквы как принятая в русском библейском стиле форма уважения, без добавления имени, отсутствующего в греческом тексте.
