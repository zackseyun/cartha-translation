  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: ru
  text: И если Сатана восстал против самого себя и разделился, он не может устоять, но ему пришёл конец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «но имеет конец». Возможно также: «но приходит к концу».'
    reason: Сохраняется лексическая и временная неоднозначность выражения τέλος ἔχει.
lexical_decisions:
- source_word: Σατανᾶς
  choice: сатана
  rationale: Традиционная и общепонятная передача личного имени; строчная буква соответствует современной русской орфографической норме для этого наименования.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: восстал против самого себя
  rationale: Передаёт направленное противодействие в сочетании ἀνίστημι с ἐπί и возвратным местоимением, сохраняя выразительность греческой фразы.
- source_word: ἐμερίσθη
  choice: разделился
  rationale: В данном рассуждении речь о внутреннем разделении; русская возвратная форма естественно выражает состояние раскола без неуместного уточнения внешнего деятеля.
- source_word: οὐ δύναται στῆναι
  choice: не может устоять
  rationale: Идиоматично передаёт невозможность сохранить существование или положение и сохраняет образ стояния.
- source_word: ἀλλὰ τέλος ἔχει
  choice: ему пришёл конец
  rationale: Естественная русская идиома, близко передающая буквальное «имеет конец» и итог логического условия, не добавляя развёрнутой эсхатологической трактовки.
theological_decisions:
- issue: Характер утверждения о конце сатаны
  choice: Передать как логический итог саморазделения в рамках условного довода Иисуса
  alternative: «он приходит к концу» или более абсолютное «он уничтожен»
  rationale: 'Контекст представляет reductio ad absurdum: разделённое владычество сатаны не способно устоять. Перевод не должен превращать эту фразу саму по себе в исчерпывающее утверждение о сроках окончательного эсхатологического поражения.'
translation_notes:
  register: Современный литературный русский язык; краткий, dignified и понятный синтаксис. Тире подчёркивает итог довода. Маркер сноски поставлен непосредственно после спорной заключительной фразы.
