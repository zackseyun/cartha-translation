source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: ru
  text: 'Услышав об этом, близкие ему[a] вышли, чтобы схватить его, потому что говорили: «Он не в себе»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «его родные», «его семья»; греческое выражение неоднозначно и может обозначать людей из дома Иисуса или его близкого окружения.
    reason: alternative_reading
  - marker: b
    text: Или «Он потерял рассудок», «Он сошёл с ума».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: близкие ему люди
  rationale: Идиоматическое выражение обозначает людей, принадлежащих к его окружению; в контексте это, вероятно, родные, однако греческий текст прямо не называет их семьёй. Формулировка сохраняет эту неоднозначность.
- source_word: ἀκούσαντες
  choice: услышав об этом
  rationale: Аористное причастие естественно передаётся деепричастием. Добавление «об этом» делает подразумеваемый объект слуха явным по-русски, не уточняя его содержание.
- source_word: ἐξῆλθον
  choice: отправились
  rationale: Глагол описывает выход и начало движения. «Отправились» естественно звучит в данном повествовательном контексте и не предполагает, что они уже прибыли к Иисусу.
- source_word: κρατῆσαι
  choice: чтобы схватить его
  rationale: κρατέω означает взять или удержать силой. «Схватить» сохраняет энергичность действия, не превращая его в юридический арест и не подменяя действие предполагаемой целью «удержать».
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжающееся или повторявшееся высказывание; русская форма «говорили» допускает это значение без тяжеловесности.
- source_word: ἐξέστη
  choice: Он не в себе
  rationale: В данном контексте выражение означает утрату самообладания или здравого рассудка. «Не в себе» — современная, естественная и достаточно широкая формулировка, не усиливающая обвинение до клинического диагноза.
theological_decisions:
- issue: Кого обозначает οἱ παρ’ αὐτοῦ
  choice: близкие ему люди
  alternative: его родные; его семья; его люди
  rationale: Последующий контекст делает семью Иисуса наиболее вероятным референтом, но само греческое выражение шире прямого термина родства. Основной текст не устраняет эту смысловую напряжённость, а уточнение дано в сноске.
- issue: Смысл оценки ἐξέστη
  choice: Он не в себе
  alternative: Он сошёл с ума; Он потерял рассудок
  rationale: Фраза передаёт отрицательную оценку состояния Иисуса со стороны говоривших, но может обозначать как утрату рассудка, так и состояние крайнего возбуждения. Перевод сохраняет широту обвинения.
translation_notes:
  register: Современный литературный русский язык с кратким повествовательным синтаксисом. Выражение «не в себе» понятно широкому кругу читателей и сохраняет некоторую смысловую широту оригинала; двусмысленность обозначения близких Иисуса вынесена в сноску.
