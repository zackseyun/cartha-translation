  source_fidelity: 'Основной смысл передан верно: временное причастие ἀκούσαντες, неопределённое обозначение οἱ παρ’ αὐτοῦ, движение с целью силой завладеть Иисусом и отрицательная оценка ἐξέστη сохранены. Однако «отправились» передаёт начало пути, но ослабляет конкретный смысл ἐξῆλθον («вышли»). Добавленное «об этом» допустимо как восполнение подразумеваемого содержания услышанного и не меняет смысла.'
  naturalness: '«Близкие ему люди» понятно, но несколько описательно и тяжеловесно. Субстантивированное «близкие ему» естественнее в современном литературном русском и сохраняет неопределённость референта. Положение маркера сноски b следует привести к русской пунктуационной норме: после закрывающих кавычек и до конечной точки.'
