  terminology: «Дом», «толпа» и «хлеб» нейтральны, точны и соответствуют регистру повествования. Прописное «Он» соответствует распространённой русской библейской редакционной традиции и не меняет смысла. Сноски уместно отражают идиоматическую возможность «домой» и значение «есть хлеб» как принимать пищу.
