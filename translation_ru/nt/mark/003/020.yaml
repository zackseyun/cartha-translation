  source_fidelity: Перевод точно передаёт историческое настоящее ἔρχεται и συνέρχεται, неопределённость εἰς οἶκον («в дом» без уточнения владельца), повторность πάλιν («снова») и результативный оборот ὥστε с инфинитивом. Множественное «они» корректно сохраняет нераскрытое в самом стихе αὐτούς; не добавляются «ученики» или иная интерпретация. «Не могут даже хлеба поесть» адекватно передаёт μηδὲ ἄρτον φαγεῖν, сохраняя слово «хлеб».
