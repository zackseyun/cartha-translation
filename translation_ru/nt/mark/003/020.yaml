  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: ru
  text: И приходит Он в дом[a]. И снова собирается толпа, так что они не могут даже хлеба поесть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домой». Греческое выражение буквально означает «в дом», но может употребляться в значении возвращения домой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «есть хлеб»; то есть принимать пищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: приходит
  rationale: Историческое настоящее сохраняет характерную для Марка живость повествования; настоящее время также согласуется с последующим συνέρχεται.
- source_word: εἰς οἶκον
  choice: в дом
  rationale: Греческое выражение не имеет артикля и притяжательного определения, поэтому перевод не уточняет, чей это дом; при этом оно может идиоматически означать возвращение домой.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: снова собирается толпа
  rationale: Естественно передаёт непереходное значение συνέρχεται, повторность πάλιν и собирательное ὁ ὄχλος.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: так что они не могут
  rationale: Оборот ὥστε с инфинитивом выражает следствие. Местоимение «они» сохраняет множественное число и не уточняет сверх текста, кто именно находился с Иисусом.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: не могут даже хлеба поесть
  rationale: Сохраняется упоминание хлеба, но русский порядок слов и глагол «поесть» естественно передают контекст приёма пищи.
theological_decisions:
- issue: К кому относится αὐτούς («они»)
  choice: Сохранено неопределённое «они»
  alternative: «Иисус и ученики не могут»
  rationale: Греческий текст употребляет местоимение без явного называния группы; её конкретизация внесла бы отсутствующее в стихе толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно повествовательным ритмом. Историческое настоящее сохранено. «Толпа» звучит естественнее и точнее, чем «народ», а сочетание «хлеба поесть» сохраняет образ оригинала без чрезмерной буквальности.
