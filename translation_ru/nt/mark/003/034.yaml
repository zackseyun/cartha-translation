  choice: братья
  alternative: братья и сёстры; родные
  rationale: Основной текст сохраняет выраженную в греческом мужскую форму и не снимает неоднозначность состава группы. Сноска сообщает читателю, что в данном контексте слово может охватывать последователей обоих полов.
