lexical_decisions:
- source_word: περιβλεψάμενος
  choice: оглядев
  rationale: 'Деепричастие передаёт завершённое направленное действие: Иисус обвёл взглядом находившихся вокруг Него. Русское «оглядев» естественно и не добавляет отсутствующей в тексте эмоциональной окраски.'
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: сидевших вокруг Него
  rationale: Сочетание περὶ αὐτόν и κύκλῳ подчёркивает окружение Иисуса; в русском «вокруг Него» естественно передаёт эту пространственную картину без тяжеловесного повтора «кругом вокруг».
- source_word: λέγει
  choice: Он говорит
  rationale: Настоящее время сохраняет характерное для Марка живое историческое настоящее.
- source_word: Ἴδε
  choice: Вот
  rationale: Указательное «вот» естественно направляет внимание на людей, которых Иисус называет Своей новой семьёй; оно современнее архаичного «се» и точнее в данном жестовом контексте, чем повелительное «посмотрите».
- source_word: μήτηρ
  choice: мать
  rationale: Прямое и обычное соответствие греческому слову.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняется грамматически мужская форма греческого множественного числа; возможное более широкое значение для смешанной группы отмечено в сноске.
theological_decisions:
