base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: ru
  text: Но кто хулит Святого Духа, тому вовек не будет прощения[a], но он виновен в вечном грехе[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не имеет прощения в век»; то есть «никогда не получит прощения» или «не имеет прощения навеки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ответствен за вечный грех».'
    reason: lexical_alternative
  - marker: c
    text: 'В некоторых рукописях: «вечному суду» или «вечному осуждению» вместо «вечному греху».'
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Но кто
  rationale: Неопределённое относительное выражение с ἄν передано естественной русской конструкцией «кто»; δέ обозначает противопоставление предыдущему высказыванию и передано союзом «но».
- source_word: βλασφημήσῃ
  choice: станет хулить
  rationale: Аорист сослагательного наклонения в обобщающем условии обозначает возможный поступок; «хулить» сохраняет религиозную весомость глагола βλασφημέω и звучит естественно по-русски.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: Святого Духа
  rationale: При βλασφημέω предлог εἰς указывает на объект хулы. В русском языке глагол «хулить» требует прямого дополнения, поэтому предлог отдельно не воспроизводится.
- source_word: οὐκ ἔχει ἄφεσιν
  choice: тому не будет прощения
  rationale: ἄφεσις здесь означает прощение. Русская безличная конструкция точно и естественно передаёт отсутствие прощения, не добавляя объяснения его богословского механизма.
- source_word: εἰς τὸν αἰῶνα
  choice: вовек
  rationale: В отрицательном контексте выражение буквально «в век» имеет значение «никогда, навеки». «Вовек» кратко сохраняет и временной, и торжественный оттенок оригинала.
- source_word: ἀλλὰ
  choice: он
  rationale: Сильное противопоставление сохранено двоеточием и переходом к утвердительному следствию; повторное «но» после начального «но» было бы тяжеловесным по-русски.
- source_word: ἔνοχός ἐστιν
  choice: виновен
  rationale: ἔνοχος допускает значения виновности и подлежания ответственности. «Виновен» естественно сочетается с «в грехе» и сохраняет судебно-нравственный оттенок.
- source_word: αἰωνίου ἁμαρτήματος
  choice: в вечном грехе
  rationale: Основной текст SBLGNT читает ἁμαρτήματος, «греха», а не «суда» или «осуждения». Прилагательное αἰώνιος передано прямо как «вечный».
theological_decisions:
- issue: Сущность непростительной хулы
  choice: Сохранена прямая формулировка «хулить Святого Духа» без толкования внутри стиха.
  alternative: Уточнить как сознательное и упорное отвержение свидетельства Духа либо как приписывание Его дела демонической силе.
  rationale: Контекст помогает понять изречение, однако сам стих не содержит этих пояснений. Их добавление сняло бы намеренно сохранённое текстом богословское напряжение.
- issue: Разночтение в конце стиха
  choice: Переведено чтение SBLGNT «вечный грех».
  alternative: «вечный суд» или «вечное осуждение».
  rationale: Предоставленный греческий основной текст содержит αἰωνίου ἁμαρτήματος. Известное разночтение отмечено в сноске, но не подменяет исходное чтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Вовек» сохраняет краткость и торжественность исходного идиоматического выражения, оставаясь понятным современному читателю. Синтаксис сделан естественным для русского языка без конфессионально обусловленных пояснений.
