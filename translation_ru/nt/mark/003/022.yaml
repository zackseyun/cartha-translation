  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: ru
  text: 'А книжники, пришедшие из Иерусалима, говорили: «Он одержим Веельзевулом[a]». Они также говорили: «Властью повелителя[b] бесов он изгоняет бесов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. «имеет Веельзевула»; то есть «одержим Веельзевулом». Традиционная форма имени: «Веельзевув».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «князя бесов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционное и в целом понятное обозначение знатоков и толкователей иудейского Закона в евангельском контексте; речь не просто о переписчиках.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: пришедшие из Иерусалима
  rationale: Естественная русская передача обстоятельства прибытия. Буквальное «сошедшие» отражает географическую перспективу, но в современном русском здесь звучит неестественно и несущественно для смысла.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид передаёт длительный или повторяющийся характер обвинения.
- source_word: Βεελζεβοὺλ
  choice: Веельзевул
  rationale: Передаёт греческую форму Βεελζεβούλ и соответствует укоренившейся русской библейской передаче.
- source_word: ἔχει
  choice: В Нём
  rationale: Само по себе буквальное «имеет Веельзевула» по-русски не передаёт идиоматического смысла и звучит непонятно. Эллиптическое «В Нём Веельзевул» сохраняет резкость и некоторую недосказанность обвинения; явное значение одержимости дано в примечании.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: силой повелителя бесов
  rationale: 'ἐν здесь имеет инструментальный смысл: обвинители утверждают, что изгнание совершается властью или силой главы бесов. «Силой» естественно выражает это по-русски.'
- source_word: δαιμονίων / δαιμόνια
  choice: бесов
  rationale: Точное и привычное для русского евангельского языка обозначение демонов, не смешивающее данное слово с выражением «нечистые духи».
- source_word: ἐκβάλλει
  choice: изгоняет
  rationale: Нормальная современная русская передача глагола в контексте изгнания бесов.
theological_decisions:
- issue: Передача обвинения Βεελζεβοὺλ ἔχει
  choice: «В Нём Веельзевул» в основном тексте
  alternative: «Он одержим Веельзевулом»
  rationale: Основной текст сохраняет краткость и напряжённую неоднозначность греческой формулировки, не превращая подразумеваемую одержимость в полностью явное толкование. Более эксплицитный смысл вынесен в примечание.
- issue: Передача ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: «силой повелителя бесов»
  alternative: «властью князя бесов»
  rationale: Инструментальное значение предлога передано ясно и естественно. «Повелитель» является современным нейтральным обозначением носителя власти; традиционный вариант «князь» сохранён в примечании.
translation_notes:
  register: Современный литературный русский с умеренно традиционной евангельской лексикой («книжники», «бесы», «изгоняет»). Синтаксис обвинений сохраняет их параллельность и повторяемость; формулировка остаётся понятной без излишнего богословского истолкования.
