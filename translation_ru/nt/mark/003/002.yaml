  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: ru
  text: И они пристально следили за Ним, исцелит ли Он его в субботу[a], чтобы обвинить Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по субботам»; греческое слово стоит во множественном числе, которое может идиоматически обозначать субботний день.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: пристально следили
  rationale: Имперфект передаёт продолжающееся наблюдение, а глагол в данном контексте подразумевает внимательное и недоброжелательное выслеживание.
- source_word: εἰ
  choice: исцелит ли
  rationale: Частица вводит косвенный вопрос; русская конструкция с «ли» естественно передаёт значение «чтобы увидеть, исцелит ли» без избыточного пояснения.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Дательный множественного числа в койне может идиоматически обозначать субботний день; русский единственный падеж здесь естественнее и не меняет смысла.
- source_word: θεραπεύσει
  choice: исцелит
  rationale: Будущее изъявительное в косвенном вопросе естественно сохраняется в русском будущем времени; «исцелит» точно передаёт значение глагола в контексте.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз выражает цель наблюдения.
- source_word: κατηγορήσωσιν αὐτοῦ
  choice: обвинить Его
  rationale: Аорист конъюнктива после ἵνα выражает цель. «Обвинить» сохраняет возможный юридический оттенок, не превращая сцену в явно формальное судебное преследование.
theological_decisions:
- issue: Намерение наблюдавших
  choice: Враждебное наблюдение с целью найти основание для обвинения
  alternative: Более юридически определённое «привлечь Его к суду»
  rationale: κατηγορέω допускает судебный оттенок, однако стих говорит лишь о намерении обвинить Иисуса и не уточняет форму последующего разбирательства.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-д dignified библейский регистр. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции; неоднозначность степени юридической формальности сохранена.
