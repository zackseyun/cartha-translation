  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: ru
  text: Он назначил Двенадцать и дал Симону имя Пётр[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Пётр означает «камень».
    reason: Передаёт лексическое значение греческого имени Πέτρος, сохранённого в основном тексте как личное имя.
lexical_decisions:
- source_word: ἐποίησεν
  choice: поставил
  rationale: В данном контексте глагол означает не просто «сделал», а установил, сформировал Двенадцать как особую группу. «Поставил» сохраняет эту учредительную силу и не добавляет отсутствующей в греческом церковной терминологии.
- source_word: τοὺς δώδεκα
  choice: двенадцать
  rationale: Определённый артикль указывает на учреждаемую и далее известную группу. По-русски субстантивированное «двенадцать» естественно в данном контексте и не требует добавления слова «апостолов» или «учеников».
- source_word: ἐπέθηκεν ὄνομα
  choice: дал … имя
  rationale: Греческая идиома буквально говорит о возложении имени. Русское «дал … имя» ясно и естественно передаёт акт наречения, сохраняя его явный характер.
- source_word: Σίμωνι
  choice: Симону
  rationale: Личное имя передано в принятой русской библейской форме и в дательном падеже, соответствующем греческому.
- source_word: Πέτρον
  choice: Пётр
  rationale: Здесь слово служит данным Симону личным именем, поэтому оно передано традиционной русской формой, а его смысл вынесен в примечание.
theological_decisions:
- issue: Характер действия Иисуса по отношению к двенадцати
  choice: поставил двенадцать
  alternative: сделал двенадцать; назначил двенадцать
  rationale: «Поставил» передаёт смысл учреждения особой группы, не сводя действие к буквальному «сделал» и не придавая ему чрезмерно административного оттенка слова «назначил».
- issue: Передача имени Πέτρος
  choice: Пётр
  alternative: Камень
  rationale: Поскольку Πέτρος функционирует как личное имя, в основном тексте сохранена традиционная форма «Пётр». Лексическое значение имени сообщается в примечании, без навязывания его богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краток и следует структуре греческого текста; местоимение «Он» не снабжено конфессионально обусловленной почтительной капитализацией внутри предложения. Маркер примечания поставлен после имени «Пётр», к которому относится пояснение.
