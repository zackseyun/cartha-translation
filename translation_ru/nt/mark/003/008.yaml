base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: ru
  text: И из Иерусалима, и из Идумеи, и из земель по другую сторону Иордана[a], и из окрестностей Тира и Сидона[b] пришло великое множество людей, которые слышали о том, что Он делал[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Заиорданья». Греческое выражение обозначает область на другой стороне реки Иордан.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вокруг Тира и Сидона»; речь идёт об окружающей их области, а не обязательно о самих городах.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обо всём, что Он делал». Греческое местоимение может иметь всеохватный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: из Иерусалима
  rationale: Предлог ἀπό с родительным падежом указывает на место происхождения или отправления; название города передано в общепринятой русской форме.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: из Идумеи
  rationale: Сохранено указание на географическое происхождение и употреблено традиционное русское название области.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: из земель по другую сторону Иордана
  rationale: Оборот обозначает территорию за Иорданом; добавленное по смыслу «из земель» естественно продолжает перечень мест, из которых пришли люди, и не сводит выражение к одной точке.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: из окрестностей Тира и Сидона
  rationale: περί с винительным падежом имеет здесь пространственное значение и указывает на окружающую города область, а не обязательно на сами города.
- source_word: πλῆθος πολύ
  choice: великое множество людей
  rationale: Передаёт многочисленность собравшихся; слово «людей» проясняет естественный для русского языка смысл собирательного существительного.
- source_word: ἀκούοντες
  choice: услышав
  rationale: Деепричастие сохраняет связь с главным действием, не закрепляя однозначно временное или причинное отношение.
- source_word: ὅσα ἐποίει
  choice: о том, что Он делал
  rationale: Имперфект передаёт продолжающуюся деятельность; формулировка не усиливает без необходимости возможный всеохватный оттенок ὅσα.
- source_word: ἦλθον πρὸς αὐτόν
  choice: пришло к Нему
  rationale: Естественно передаёт движение к Иисусу; единственное число согласовано с собирательным подлежащим «множество».
- source_word: καὶ … καὶ … καὶ
  choice: и … и … и
  rationale: Повтор союза сохранён, чтобы передать накопительный ритм географического перечня у Марка.
