  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: ru
  text: И Он поставил двенадцать[a], чтобы они были с Ним и чтобы Он посылал их проповедовать[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
