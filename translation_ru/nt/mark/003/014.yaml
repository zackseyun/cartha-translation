    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: поставил
  rationale: Буквально глагол может означать «сделал», но здесь он говорит об учреждении и назначении группы двенадцати. «Поставил» естественно передаёт этот смысл и сохраняет достоинство стиля.
- source_word: δώδεκα
  choice: двенадцать
  rationale: В греческом тексте существительное отсутствует; субстантивированное числительное естественно и понятно и в русском языке.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: чтобы они были с Ним
  rationale: Оборот с ἵνα и сослагательным наклонением обозначает цель; русская конструкция с «чтобы» передаёт её прямо и естественно.
- source_word: ἀποστέλλῃ
  choice: чтобы Он посылал их
  rationale: Форма настоящего времени допускает повторяющееся или предполагаемое действие. «Посылал» сохраняет эту аспектуальную открытость, не вводя отсутствующий в основном тексте титул «апостолы».
- source_word: κηρύσσειν
  choice: проповедовать
  rationale: Глагол означает публично возвещать или провозглашать. В контексте служения учеников «проповедовать» — краткий и естественный русский эквивалент.
theological_decisions:
- issue: Следует ли вводить в основной текст титул «апостолы»
  choice: Не добавлять титул «апостолы» в основной текст.
  alternative: «…которых и назвал апостолами…»
  rationale: Предоставленный текст SBLGNT содержит только «поставил двенадцать». Более пространное чтение засвидетельствовано частью рукописей и поэтому отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Местоимение «Он» применительно к Иисусу написано с прописной буквы согласно распространённой русской библейской традиции. Пунктуация сохраняет продолжение предложения в следующем стихе.
