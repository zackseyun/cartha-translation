  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: ru
  text: Услышав, что Он жив и что она видела Его[a], они не поверили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Он был увиден ею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: они
  rationale: Местоимение относится к упомянутым ранее плакавшим и рыдавшим спутникам Иисуса; связь с предыдущим повествованием по-русски естественно передаётся последовательностью фразы без отдельного начального «и».
- source_word: ἀκούσαντες
  choice: услышав
  rationale: Деепричастие естественно передаёт временное значение аористного причастия и сохраняет последовательность событий.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание услышанного.
- source_word: ζῇ
  choice: Он жив
  rationale: Настоящее время греческого глагола выражает продолжающуюся жизнь; русское «Он жив» естественно сохраняет это значение и не требует согласования времени с прошедшим «услышав».
- source_word: καὶ
  choice: и что
  rationale: 'Повтор «что» ясно связывает два однородных сообщения: Он жив и женщина видела Его.'
- source_word: ἐθεάθη
  choice: видела Его
  rationale: Греческая пассивная форма буквально означает «Он был увиден», но русская активная конструкция естественнее и сохраняет смысл восприятия, не усиливая его до «явился».
- source_word: ὑπ’ αὐτῆς
  choice: она
  rationale: Сохраняется местоименная отсылка к Марии из предыдущего контекста без внесения имени в данный стих.
- source_word: ἠπίστησαν
  choice: не поверили
  rationale: Прямая и естественная передача отсутствия веры в услышанное без добавочного оттенка сознательного отказа.
theological_decisions:
- issue: Выражение воскресшей жизни Иисуса
  choice: Он жив
  alternative: Он живёт
  rationale: «Он жив» точно и естественно передаёт настоящее время ζῇ и продолжающееся состояние жизни после смерти, не ослабляя его согласованием времён.
- issue: Характер встречи Марии с Иисусом
  choice: она видела Его
  alternative: Он был увиден ею; Он явился ей
  rationale: Активная русская конструкция передаёт пассивное ἐθεάθη без тяжеловесности. Вариант «явился» мог бы сильнее подчеркнуть самораскрытие Иисуса, чем требует эта форма.
translation_notes:
  register: Современный литературный русский язык; краткая, повествовательно естественная фраза. Местоимение «Он» применительно к Иисусу оформлено с прописной буквы по принятой русской библейской традиции.
