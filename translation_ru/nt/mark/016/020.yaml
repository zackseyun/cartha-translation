source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: ru
  text: Они же, выйдя, возвещали повсюду, а Господь содействовал им и подтверждал весть[a] сопровождавшими знамениями.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово». Здесь греч. λόγος означает возвещаемую весть.'
    reason: lexical_alternative
  - marker: b
    text: Стихи 9–20 отсутствуют в некоторых ранних и важных рукописях Евангелия от Марка; в других рукописях встречаются иные окончания.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: они же
  rationale: Местоимение отсылает к ранее упомянутым ученикам, а частица δέ продолжает повествование с лёгким смысловым переходом; «они же» естественно передаёт оба элемента.
- source_word: ἐξελθόντες
  choice: выйдя
  rationale: Деепричастие сохраняет предшествующее сопутствующее действие аористного причастия без тяжеловесности.
- source_word: ἐκήρυξαν πανταχοῦ
  choice: возвещали повсюду
  rationale: «Возвещали» передаёт публичное провозглашение, не сужая смысл до церковной проповеди; «повсюду» прямо соответствует πανταχοῦ.
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: Господь содействовал им
  rationale: Генитив абсолютный передан параллельным личным предложением. «Содействовал» сохраняет значение совместного действия и поддержки; местоимение «им» естественно восполняет подразумеваемых участников.
- source_word: τὸν λόγον
  choice: весть
  rationale: В данном контексте λόγος обозначает возвещаемое содержание. «Весть» ясно передаёт этот смысл современному читателю, а буквальная возможность «слово» сохранена в примечании.
- source_word: βεβαιοῦντος
  choice: подтверждал
  rationale: Глагол обозначает удостоверение или подтверждение истинности возвещаемой вести.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: сопровождавшими знамениями
  rationale: Творительный падеж передаёт διά с родительным в значении средства. Формулировка сохраняет смысл знамений, которые следовали за возвещением или сопровождали его, не добавляя в основной текст отсутствующий в греческом дополненный объект.
theological_decisions:
- issue: Кого обозначает «Господь»
  choice: Сохранён титул «Господь»; ближайший контекст указывает на воскресшего Иисуса.
  alternative: Понимать обозначение шире — как Бога.
  rationale: В Мк 16:19 «Господь» непосредственно обозначает Иисуса. Перевод сохраняет исходный титул и не вставляет имя в текст.
- issue: Роль знамений
  choice: Знамения представлены как средство подтверждения возвещаемой вести.
  alternative: Считать, что знамения лишь следовали за возвещавшими без функции удостоверения.
  rationale: Синтаксически оборот с διά относится к действию «подтверждал», поэтому знамения выполняют удостоверяющую функцию. Текст не даёт оснований делать дополнительные выводы об их последующей продолжительности или нормативности.
- issue: Текстологический статус стиха
  choice: Стих переведён как часть представленного источника, а спорность длинного окончания отмечена в сноске.
  alternative: Не отмечать текстологическую проблему либо исключить стих из основного текста.
  rationale: Мк 16:20 засвидетельствован в большинстве рукописей, но всё длинное окончание Мк 16:9–20 отсутствует в ряде ранних и важных свидетелей. Читателю следует сообщить об этом, не решая вопрос молча.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный без архаизации. «Возвещали» и «знамения» сохраняют библейскую выразительность, оставаясь понятными обычному читателю. Конструкция «сопровождавшими знамениями» намеренно не уточняет, сопровождали ли знамения весть, возвещение или самих учеников, поскольку в греческом дополнение не выражено.
