base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: ru
  text: Подняв глаза, они увидели, что камень уже отвален[a], ибо он был очень большим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камень уже был отвален». Греческая форма глагола подчёркивает, что, когда женщины увидели камень, он уже находился в отваленном состоянии.'
    reason: Лексический вариант и пояснение результативного значения греческого перфекта.
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: Подняв глаза
  rationale: Аористное причастие естественно передаёт движение взгляда женщин вверх или по направлению к гробнице, сохраняя последовательность действий.
- source_word: θεωροῦσιν
  choice: они увидели
  rationale: Историческое настоящее в повествовании естественно передаётся русским прошедшим временем; «увидели» ясно выражает зрительное восприятие без стилистической тяжеловесности.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание увиденного и прямо соответствует естественной русской конструкции.
- source_word: ἀποκεκύλισται
  choice: уже отвален
  rationale: 'Перфект страдательного залога обозначает совершившееся действие и сохраняющийся результат: к моменту, когда женщины посмотрели, камень находился в отваленном состоянии. «Уже» делает этот оттенок явным.'
- source_word: ὁ λίθος
  choice: камень
  rationale: Речь идёт о ранее упомянутом камне, закрывавшем вход в гробницу; добавлять отсутствующее в греческом тексте пояснение не требуется.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: хотя он был очень большим
  rationale: В данном контексте γάρ относится к затруднению, обозначенному предыдущим вопросом женщин, а не объясняет, почему камень был отвален. Русское «хотя» естественно передаёт контекстуальный уступительный оттенок, тогда как σφόδρα выражено усилителем «очень».
- source_word: καὶ
  choice: не выражено отдельно
  rationale: Начальное καί продолжает повествование; в современном русском его отдельная передача союзом «и» перед деепричастным оборотом была бы необязательной и менее плавной.
