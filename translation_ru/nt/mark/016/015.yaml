  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: ru
  text: 'И Он сказал им: «Идите во весь мир и провозгласите благую весть[b] всему творению[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждому творению»; традиционно: «всей твари». Греческое выражение допускает как собирательное, так и распределительное понимание.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Евангелие». Греческое εὐαγγέλιον буквально означает «благая весть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Идите
  rationale: Аористное причастие перед главным повелительным глаголом имеет сопутствующее побудительное значение; русское повелительное «идите» естественно передаёт силу поручения.
- source_word: κόσμον ἅπαντα
  choice: по всему миру
  rationale: Сочетание обозначает весь мир как сферу миссии; «по всему миру» естественно по-русски и сохраняет всеобщий охват.
- source_word: κηρύξατε
  choice: провозгласите
  rationale: Глагол κηρύσσω означает публично и властно возвещать; «провозгласите» передаёт этот смысл без сужения до церковной проповеди.
- source_word: τὸ εὐαγγέλιον
  choice: Благую весть
  rationale: Εὐαγγέλιον буквально означает благую, добрую весть. Этот вариант понятен современному читателю; традиционное «Евангелие» сохранено в примечании.
- source_word: πάσῃ τῇ κτίσει
  choice: всему творению
  rationale: Κτίσις может обозначать творение или сотворённое существо. Формулировка «всему творению» сохраняет широкий, возможно космический охват греческого выражения.
- source_word: εἶπεν αὐτοῖς
  choice: Он сказал им
  rationale: Прямой и естественный перевод повествовательной формулы; местоимение написано с прописной буквы в соответствии с принятым благоговейным русским библейским регистром.
theological_decisions:
- issue: Охват выражения πάσῃ τῇ κτίσει в поручении
  choice: всему творению
  alternative: каждому творению; всякой твари
  rationale: Выражение допускает корпоративное или космическое понимание («всему творению») и дистрибутивное («каждому сотворённому существу»). Основной текст сохраняет широту и напряжение греческой формулировки, не сводя её без необходимости только к отдельным людям.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным и общедоступным звучанием. Сохранены универсальный масштаб поручения и лексическая связь εὐαγγέλιον с благой вестью; традиционные варианты вынесены в примечания.
