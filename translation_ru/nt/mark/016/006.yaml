  source_fidelity: 'Основная передача в целом точно отражает греческий текст: сохранены историческое настоящее («он говорит»), настоящее ζητεῖτε, эпитет Ναζαρηνός, указание на распятого Иисуса, «здесь», указательное «вот», а также неназванный субъект действия «положили». Однако «Он воскрешён» в современном русском обычно воспринимается как состояние или продолжающийся процесс и неудачно передаёт завершённое аористное событие ἠγέρθη. Безопаснее и точнее: «Он был воскрешён».'
