base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: ru
  text: 'Но он говорит им: «Не пугайтесь. Вы ищете Иисуса Назарянина[a], распятого. Он был воскрешён[b], Его здесь нет. Вот место, куда Его положили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса из Назарета». Греческое слово представляет собой обозначение, образованное от названия Назарета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он воскрес». Греческий глагол имеет страдательную форму: «Он был воскрешён».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: не пугайтесь
  rationale: Глагол обозначает сильное потрясение и испуг, а не простое удивление. «Не пугайтесь» естественно звучит по-русски и соответствует ситуации у гробницы.
- source_word: Ναζαρηνὸν
  choice: Назарянина
  rationale: Греческое прилагательное, образованное от названия Назарета, употреблено как устойчивое обозначение Иисуса. «Назарянин» сохраняет форму эпитета.
- source_word: ἐσταυρωμένον
  choice: распятого
  rationale: Причастие совершенного вида кратко передаёт совершившееся распятие и сохраняет определительную связь с Иисусом.
- source_word: ἠγέρθη
  choice: Он воскрешён
  rationale: Такой перевод сохраняет страдательный залог греческого глагола и не называет прямо подразумеваемого деятеля.
- source_word: ὧδε
  choice: здесь
  rationale: Прямое и естественное соответствие указанию на место.
- source_word: ἴδε
  choice: вот
  rationale: В данном контексте слово направляет внимание женщин на конкретное место; русское «вот» передаёт эту указательную силу без архаичности.
- source_word: τόπος
  choice: место
  rationale: Обычное и точное обозначение места, где лежало тело Иисуса.
- source_word: ἔθηκαν
  choice: положили
  rationale: Глагол естественен в контексте погребения и передаёт действие неназванных людей, поместивших тело в гробницу.
- source_word: ζητεῖτε
  choice: вы ищете
  rationale: Настоящее время сохранено естественной русской формой, описывающей происходящее действие.
- source_word: λέγει αὐταῖς
  choice: он говорит им
  rationale: Настоящее время сохраняет характерное для повествования Марка историческое настоящее и его живость.
theological_decisions:
- issue: Формулировка воскресения и залог глагола
  choice: Он воскрешён
  alternative: Он воскрес; Он был воскрешён
  rationale: Греческое ἠγέρθη имеет страдательную форму. Основной перевод сохраняет её и тем самым оставляет подразумеваемое Божье действие неразъяснённым; примечание указывает естественную русскую альтернативу.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Историческое настоящее сохранено. Формулировки избегают как архаизмов, так и излишнего богословского разъяснения.
