    rationale: Греческое εἰς τὴν Γαλιλαίαν — направительное выражение («в Галилею», возможно «к Галилее»), не локативное «в Галилее». Кроме того, заявленная сноска не соответствует английскому аудиторскому следу, где альтернативой является «to Galilee», а не «in Galilee».
  - severity: low
