  source_fidelity: 'Основной текст в целом точно передаёт греческий оригинал: повеления сохранены, Пётр упомянут отдельно, а προάγει передано как движение Иисуса впереди учеников. Однако сноска b неверно представляет вариант «в Галилее» как возможное значение εἰς τὴν Γαλιλαίαν: εἰς здесь обозначает направление — «в/к Галилее», а не местонахождение «в Галилее».'
  naturalness: «Но идите и скажите Его ученикам и Петру» — естественно для современного литературного библейского русского. В заключительной фразе «как Он сказал вам» точнее передаёт аорист εἶπεν и звучит столь же естественно, без оттенка повторяющегося действия, который может создавать «говорил».
  terminology: Имена и библейский регистр выдержаны. Отдельное упоминание Петра сохранено без догматического или интерпретирующего добавления. Написание местоимений с прописной буквы последовательно соответствует заявленной традиции.
