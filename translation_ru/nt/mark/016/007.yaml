  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: ru
  text: 'Но идите и скажите Его ученикам и Петру[a]: «Он идёт впереди вас в Галилею. Там вы увидите Его, как Он сказал вам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Пётр назван отдельно от учеников. Это может указывать на его восстановление после отречения, однако в греческом тексте прямо не сказано: «особенно Петру».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильный переход к повелению и естественно связывает стих с предшествующим контекстом.
- source_word: ὑπάγετε
  choice: идите
  rationale: Естественное современное соответствие повелительному наклонению во множественном числе без избыточной передачи вида.
- source_word: εἴπατε
  choice: скажите
  rationale: Точно и естественно вводит сообщение, которое женщины должны передать названным адресатам.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: Его ученикам и Петру
  rationale: Сохраняет простое сочинение адресатов и отдельное упоминание Петра, не добавляя толкований «особенно» или «включая».
- source_word: ὅτι
  choice: прямая речь в кавычках
  rationale: ὅτι вводит содержание сообщения; прямая речь ясна и естественна по-русски.
- source_word: Προάγει ὑμᾶς
  choice: Он идёт впереди вас
  rationale: 'Сохраняет направительное значение προάγω: Иисус движется прежде учеников и оказывается впереди них.'
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Русское направление движения естественно выражается винительным падежом с «в»; это передаёт εἰς без неестественного буквализма.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: Там вы увидите Его
  rationale: Прямая и точная передача указания места и будущей встречи/зрительного восприятия.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: как Он и говорил вам
  rationale: Частица «и» естественно подчёркивает соответствие прежним словам Иисуса, выраженное καθώς.
theological_decisions:
- issue: Отдельное упоминание Петра после учеников
  choice: «Его ученикам и Петру»
  alternative: «Его ученикам, особенно Петру»; «Его ученикам, включая Петра»
  rationale: Греческий текст отдельно называет Петра, что может иметь повествовательное и пастырское значение после его отречения, но грамматически не уточняет «особенно» или «включая». Простое сочинение сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и торжественная повествовательная речь. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
