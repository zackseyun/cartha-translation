  rationale: Удалена ошибочная сноска b и её якорь, поскольку в русском основном тексте «в Галилею» уже естественно передаёт направительное εἰς, а предложенное «в Галилее» не является допустимой альтернативой. «Говорил» заменено на «сказал» для более прямой передачи εἶπεν. Остальная формулировка сохранена.
