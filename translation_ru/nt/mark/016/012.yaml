source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: ru
  text: После этого Он явился в ином облике[a] двоим из них, когда они шли в сельскую местность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в другом образе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в поле»; здесь греческое слово ἀγρός, вероятно, означает сельскую местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: После этого
  rationale: Естественно передаёт временную последовательность; частица δέ здесь выполняет связующую, продолжительную функцию и не требует отдельного «же».
- source_word: δυσὶν ἐξ αὐτῶν
  choice: двоим из них
  rationale: Сохраняет указание на двух человек из более широкой группы и звучит естественно по-русски.
- source_word: περιπατοῦσιν
  choice: когда они шли
  rationale: Передаёт одновременное и продолжающееся действие настоящего причастия без тяжеловесной конструкции.
- source_word: ἐφανερώθη
  choice: Он явился
  rationale: В контексте явления после воскресения это естественный русский эквивалент пассивной формы φανερόω.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: в ином облике
  rationale: «Облик» естественно обозначает воспринимаемую внешнюю форму, а «ином» сохраняет значение отличия, не объясняя его природу.
- source_word: πορευομένοις εἰς ἀγρόν
  choice: когда они шли в сельскую местность
  rationale: Единая русская конструкция избегает неестественного повтора двух близких причастий и передаёт направленное движение; ἀγρός в данном контексте, вероятно, означает сельскую местность.
theological_decisions:
- issue: Характер явления, выраженный словами ἐν ἑτέρᾳ μορφῇ
  choice: в ином облике
  alternative: с иной внешностью
  rationale: Текст утверждает различие облика, но не поясняет, изменился ли внешний вид Иисуса, восприятие учеников или способ узнавания; перевод не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная повествовательная речь. Заглавное «Он» использовано для однозначной отсылки к Иисусу, подразумеваемому формой глагола.
