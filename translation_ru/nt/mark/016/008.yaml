  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: ru
  text: Выйдя, они убежали от гробницы[a], потому что их охватили дрожь и изумление. И никому ничего не сказали, потому что боялись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях добавлено так называемое краткое окончание: «Всё, что им было поручено, они вкратце сообщили тем, кто был с Петром. После этого и сам Иисус через них послал от востока до запада священную и нетленную проповедь о вечном спасении. Аминь».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: Выйдя
  rationale: Аористное причастие женского рода множественного числа относится к женщинам и обозначает действие, предшествующее основному глаголу; деепричастие естественно передаёт эту связь по-русски.
- source_word: ἔφυγον
  choice: побежали
  rationale: В данном контексте φεύγω означает поспешное бегство; «побежали от» звучит естественно и сохраняет живость повествования.
- source_word: μνημείου
  choice: гробницы
  rationale: В рассказе о погребении и воскресении μνημεῖον обозначает высеченную или устроенную гробницу, а не просто могилу.
- source_word: εἶχεν αὐτὰς
  choice: их охватили
  rationale: Идиоматическая конструкция с названиями состояний передаёт то, что дрожь и изумление овладели женщинами; множественное сказуемое согласовано с двумя однородными подлежащими.
- source_word: τρόμος
  choice: дрожь
  rationale: Передаёт телесную реакцию сильного страха и не дублирует заключительное «боялись».
- source_word: ἔκστασις
  choice: изумление
  rationale: Здесь слово означает потрясённое, ошеломлённое состояние; «изумление» понятно современному читателю и не вызывает неуместной ассоциации с экстазом.
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: никому ничего не сказали
  rationale: Естественная русская конструкция с усиленным всеобщим отрицанием точно передаёт греческое οὐδενὶ οὐδέν.
- source_word: ἐφοβοῦντο
  choice: боялись
  rationale: Несовершенный вид передаёт продолжавшееся состояние страха и сохраняет лаконичность резкого окончания.
- source_word: γάρ (оба случая)
  choice: потому что
  rationale: Оба употребления имеют причинно-пояснительную силу; современное «потому что» ясно и естественно, при этом заключительная фраза остаётся обрывисто краткой.
theological_decisions:
- issue: Краткое окончание после Марка 16:8
  choice: Не включать заключённый в двойные скобки текст в основной перевод, но привести его в текстологической сноске.
  alternative: Включить краткое окончание в основной текст стиха.
  rationale: SBLGNT отмечает эти предложения двойными скобками как материал, не принадлежащий основному установленному тексту. Сноска сохраняет вариант для прозрачности, не приравнивая его к основному чтению.
- issue: Смысл молчания женщин
  choice: Сохранить без поясняющего ограничения утверждение «никому ничего не сказали».
  alternative: Уточнить, что они никому не сказали по дороге или до встречи с учениками.
  rationale: Сам стих не содержит такого ограничения; добавлять его ради согласования с последующим повествованием означало бы устранять реальное повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык, сдержанный и повествовательно выразительный. Сохранены краткость, страх и резкость окончания стиха; текстологический вариант вынесен в сноску.
