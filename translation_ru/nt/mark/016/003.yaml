  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: ru
  text: 'И они говорили друг другу: «Кто откатит для нас камень от входа[a] в гробницу?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от двери гробницы».'
    reason: θύρα может означать как «вход», так и «дверь»; основное чтение выбрано с учётом камня, закрывавшего проём гробницы.
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжавшийся разговор по дороге; русская форма несовершенного вида «говорили» естественно сохраняет эту длительность.
- source_word: πρὸς ἑαυτάς
  choice: друг другу
  rationale: Буквально выражение означает «между собой / самим себе», но во множественном числе контекст ясно указывает на взаимный разговор женщин; «друг другу» звучит естественно.
- source_word: Τίς
  choice: Кто
  rationale: Прямое вопросительное местоимение естественно передаёт вопрос о человеке, способном совершить действие.
- source_word: ἀποκυλίσει
  choice: отвалит
  rationale: Глагол обозначает удаление посредством перекатывания; «отвалит» — обычное русское выражение применительно к камню, закрывающему вход.
- source_word: ἡμῖν
  choice: для нас
  rationale: Дательный падеж выражает действие в пользу женщин, поэтому «для нас» точнее передаёт значение, чем простое «нам».
- source_word: τὸν λίθον
  choice: камень
  rationale: Определённость естественно следует из контекста; прилагательное «большой» не добавлено, поскольку в данном стихе его нет.
- source_word: ἐκ τῆς θύρας
  choice: от входа
  rationale: θύρα может означать дверь или вход; для высеченной гробницы современное русское «вход» ясно передаёт отверстие, закрытое камнем, без образа створчатой двери.
- source_word: τοῦ μνημείου
  choice: в гробницу
  rationale: μνημεῖον здесь означает место погребения. Сочетание «вход в гробницу» идиоматичнее по-русски, чем буквальное «вход гробницы», при сохранении отношения родительного падежа.
