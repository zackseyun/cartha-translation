  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: ru
  text: Итак, Господь Иисус, после того как сказал им, был вознесён на небо и сел по правую руку от Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: Итак
  rationale: Сочетание частиц обозначает переход и подводит итог; «итак» естественно передаёт эту связующую и заключительную функцию.
- source_word: κύριος Ἰησοῦς
  choice: Господь Иисус
  rationale: «Господь» сохраняет обычное новозаветное и богословски значимое соответствие κύριος, а имя передано в принятой русской форме.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: после того как сказал им это
  rationale: Оборот с μετά и субстантивированным инфинитивом имеет временное значение. Глагол λαλέω здесь относится к предшествующей речи; «сказал им это» звучит естественно по-русски, не уточняя содержания сверх контекста.
- source_word: ἀνελήμφθη
  choice: был вознесён
  rationale: Пассивная форма сохранена; «был вознесён» точно и естественно обозначает восхождение Иисуса, тогда как направление отдельно выражено словами «на небо».
- source_word: εἰς τὸν οὐρανόν
  choice: на небо
  rationale: В русском языке направление движения с существительным «небо» естественно выражается сочетанием «на небо»; артикль отдельно не передаётся.
- source_word: ἐκάθισεν
  choice: сел
  rationale: Аорист обозначает совершившееся действие — принятие сидячего положения; краткое «сел» естественно и точно.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: по правую руку от Бога
  rationale: Устойчивое русское библейское выражение передаёт идиоматическое значение положения справа, а не буквальное исходное значение предлога ἐκ.
theological_decisions:
- issue: Передача языка вознесения и возвышения без догматических добавлений
  choice: был вознесён на небо и сел по правую руку от Бога
  alternative: был взят на небо и занял место по правую руку от Бога
  rationale: Выбранный вариант сохраняет пассив вознесения и библейский образ почётного положения рядом с Богом, не поясняя действующее лицо пассива и не добавляя толкования.
- issue: Передача κύριος как христологического титула
  choice: Господь Иисус
  alternative: Владыка Иисус
  rationale: «Господь» сохраняет традиционную и современно понятную передачу κύριος и его богословскую весомость; «Владыка» здесь было бы стилистически маркированным и менее обычным.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и общепонятным; традиционный оборот «по правую руку от Бога» сохранён как узнаваемая библейская идиома.
