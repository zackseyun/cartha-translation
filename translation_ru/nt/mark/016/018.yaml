id: MRK.16.18
reference: Mark 16:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: ru
  text: Они будут брать в руки змей[a], и даже если выпьют что-нибудь смертоносное, это нисколько им не повредит; они возложат руки на больных, и те выздоровеют[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых ранних рукописях Мк 16:9–20 отсутствует; этот стих относится к пространному окончанию Евангелия от Марка.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «и будут здоровы» или «и будут хорошо себя чувствовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: змей
  rationale: Обычное современное обозначение змей; оно естественно передаёт греческое ὄφεις без архаического оттенка слова «змии».
- source_word: ἀροῦσιν
  choice: будут брать в руки
  rationale: αἴρω означает «поднимать, брать»; выражение «брать в руки» ясно описывает физическое действие и не уточняет, случайно или намеренно оно совершается.
- source_word: κἂν
  choice: и даже если
  rationale: καὶ ἐάν вводит условие с возможным уступительным оттенком; «даже если» естественно передаёт этот оттенок в данном контексте.
- source_word: θανάσιμόν τι
  choice: что-нибудь смертоносное
  rationale: Сохраняет широкое значение греческого выражения — нечто способное причинить смерть — и не сужает его до яда.
- source_word: οὐ μὴ ... βλάψῃ
  choice: нисколько им не повредит
  rationale: Двойное отрицание οὐ μή выражает решительное отрицание; «нисколько не повредит» передаёт его усиленную силу естественным русским языком.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: возложат руки на больных
  rationale: Сохраняет устойчивое библейское и русское выражение, непосредственно соответствующее греческой конструкции.
- source_word: καλῶς ἕξουσιν
  choice: те выздоровеют
  rationale: Буквально выражение означает «будут хорошо себя чувствовать / будут здоровы»; в контексте больных «выздоровеют» ясно передаёт предполагаемый результат. Местоимение «те» устраняет возможную русскую двусмысленность относительно субъекта.
theological_decisions:
- issue: Характер обещанной защиты и исцелений
  choice: Передать будущие действия и результаты прямо, не добавляя ограничений или пояснений об их универсальности, нормативности либо временных рамках.
  alternative: Истолковать знамения как обязательные для всех верующих, ограниченные апостольской эпохой или исключительно символические.
  rationale: Греческий текст сам по себе не разрешает эти богословские вопросы, поэтому перевод сохраняет его утверждение без конфессионального толкования.
- issue: Текстологический статус Мк 16:9–20
  choice: Перевести предоставленный текст стиха и отметить принадлежность к пространному окончанию Марка в сноске.
  alternative: Опустить стих или заключить его в скобки в основном тексте.
  rationale: Стих присутствует в предоставленном тексте SBLGNT, однако отсутствие Мк 16:9–20 в некоторых ранних рукописях требует прозрачного текстологического примечания.
translation_notes:
  register: Современный литературный русский язык с естественным, но dignified библейским регистром. Архаизм «змии» не используется; устойчивое выражение «возложат руки» сохранено. Усиленное отрицание передано словом «нисколько».
