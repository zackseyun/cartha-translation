source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: ru
  text: Войдя в гробницу, они увидели юношу[a], сидевшего справа и одетого в белое одеяние, и были потрясены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или по смыслу: «ангела». Здесь Марк называет его «юношей», хотя общий контекст и параллельные повествования указывают на ангельского посланника.'
    reason: Альтернативное контекстуальное понимание личности юноши.
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: войдя
  rationale: Аористное причастие женского рода множественного числа относится к женщинам и обозначает действие, предшествующее основному; русское деепричастие естественно передаёт эту связь.
- source_word: μνημεῖον
  choice: гробница
  rationale: Обозначает место погребения; «гробница» ясно и естественно для рассказа о погребении и воскресении.
- source_word: νεανίσκον
  choice: юношу
  rationale: Греческое слово прямо называет молодого мужчину, не отождествляя его в этом стихе с ангелом.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: сидевшего справа
  rationale: Передаёт позу и местонахождение юноши кратко и естественно по-русски.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: одетого в белое одеяние
  rationale: Совершенное причастие описывает его как уже облачённого; στολή означает заметную длинную одежду, а нейтральное «одеяние» сохраняет достоинство регистра без излишней конкретизации фасона.
- source_word: ἐξεθαμβήθησαν
  choice: были потрясены
  rationale: Глагол выражает сильное потрясение и смятение, большее, чем простое удивление, но сам по себе не требует перевода как крайний ужас.
theological_decisions:
- issue: Кем был νεανίσκος
  choice: 'В основном тексте перевести описательно: «юноша».'
  alternative: ангел
  rationale: Хотя белое одеяние, контекст и параллельные повествования указывают на ангельского посланника, Марк здесь употребляет слово «юноша». Перевод сохраняет формулировку данного стиха и не подменяет её толкованием.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и достойное. Причастные обороты сохранены там, где они звучат естественно; эмоциональная сила последнего глагола передана без чрезмерного усиления.
