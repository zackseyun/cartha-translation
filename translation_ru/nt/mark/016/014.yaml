  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: ru
  text: Позднее Он явился одиннадцати, когда они возлежали за столом[a], и упрекнул их за неверие и жестокосердие, потому что они не поверили тем, кто видел Его после того, как Он был воскрешён[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое слово обозначает принятую в то время позу во время трапезы: возлежание.'
    reason: cultural_note
  - marker: b
    text: 'Или: «тем, кто видел Его воскресшим». Буквально: «тем, кто видел Его как воскрешённого»; греческое причастие имеет совершенный страдательный залог.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Позднее
  rationale: Передаёт временную последовательность естественным современным русским словом; возможный вариант — «После этого».
- source_word: ἀνακειμένοις
  choice: когда они возлежали за столом
  rationale: Сохраняет указание на принятую в ту эпоху позу во время еды и одновременно поясняет контекст трапезы.
- source_word: τοῖς ἕνδεκα
  choice: самим одиннадцати
  rationale: «Одиннадцать» обозначает группу апостолов после отпадения Иуды, а «самим» передаёт лёгкое усиление, создаваемое αὐτοῖς.
- source_word: ἐφανερώθη
  choice: явился
  rationale: В повествовании о явлениях после воскресения это наиболее естественная и точная передача греческой пассивной формы.
- source_word: ὠνείδισεν
  choice: упрекнул
  rationale: Передаёт сильное порицание ясным современным словом без излишне архаичного оттенка.
- source_word: ἀπιστίαν
  choice: неверие
  rationale: Здесь существительное обозначает отказ или неспособность поверить свидетельству очевидцев.
- source_word: σκληροκαρδίαν
  choice: жестокосердие
  rationale: Сохраняет образ сердца как внутреннего центра сопротивления истине; слово «упрямство» чрезмерно сгладило бы библейскую метафору.
- source_word: θεασαμένοις
  choice: тем, кто видел
  rationale: Прямо и естественно обозначает очевидцев воскресшего Иисуса.
- source_word: ἐγηγερμένον
  choice: уже воскрешённым
  rationale: 'Передаёт совершенный вид и пассивную форму причастия: очевидцы видели Его в состоянии после того, как Он был воскрешён.'
- source_word: οὐκ ἐπίστευσαν
  choice: не поверили
  rationale: Обозначает предшествовавший явлению отказ принять свидетельство; временная соотнесённость в русском ясна из контекста.
theological_decisions:
- issue: Пассивная форма ἐγηγερμένον в высказывании о воскресении
  choice: уже воскрешённым
  alternative: воскресшим
  rationale: Основной текст сохраняет грамматический пассив и состояние, наступившее в результате воскресения, не уточняя прямо действующее лицо. Более привычное «воскресшим» дано как допустимая альтернатива.
- issue: Смысл σκληροκαρδία
  choice: жестокосердие
  alternative: упрямство
  rationale: Сохранена библейская метафора духовно невосприимчивого сердца, а не предложено более узкое психологическое истолкование.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Слова «возлежали» и «жестокосердие» сохранены ради культурной точности и значимой метафоры; первое снабжено пояснением. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с принятой русской библейской издательской традицией.
