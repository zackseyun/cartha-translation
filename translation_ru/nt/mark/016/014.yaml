  terminology: «Неверие» и «жестокосердие» удачно сохраняют традиционную библейскую терминологию без навязывания толкования. Пассивное «был воскрешён» следует сохранить в основном тексте; вариант «воскресшим» можно оставить в сноске как более гладкий, но менее формально пассивный.
