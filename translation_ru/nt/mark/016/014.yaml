  source_fidelity: 'В целом переданы последовательность событий, явление одиннадцати, порицание за неверие и ожесточённость, а также пассивный смысл ἐγηγερμένον. Однако «самим одиннадцати» неестественно по-русски и излишне превращает обычное дательное «им, одиннадцати» в эмфатическое «самим». Формулировка «видел Его уже воскрешённым» грамматически возможна, но звучит тяжеловесно и не вполне ясно: наречие «уже» не является существенной частью греческого смысла.'
