  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: ru
  text: Тот, кто поверил и был крещён, будет спасён[a], а тот, кто не поверил, будет осуждён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно по-русски: «Кто поверит и будет крещён, тот будет спасён, а кто не поверит, будет осуждён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: тот, кто поверил
  rationale: Субстантивированное причастие обозначает человека, характеризуемого совершённым действием. Такая передача сохраняет единственное число и предшествование действия будущему результату, оставаясь естественной в современном русском языке.
- source_word: βαπτισθεὶς
  choice: был крещён
  rationale: Аористное страдательное причастие передано формой, явно сохраняющей страдательный залог и показывающей крещение как действие, предшествующее будущему спасению.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: В данном контексте глагол имеет обычный сотериологический смысл; эта формулировка точна, ясна и не добавляет конфессионального толкования.
- source_word: ὁ δὲ ἀπιστήσας
  choice: а тот, кто не поверил
  rationale: Отрицательная форма естественно передаёт смысл ἀπιστέω и сохраняет прямой контраст с «поверил». Союз «а» по-русски плавно выражает противопоставление двух исходов.
- source_word: κατακριθήσεται
  choice: будет осуждён
  rationale: Будущая страдательная форма обозначает неблагоприятный судебный приговор; «будет осуждён» является прямым и естественным соответствием.
- source_word: καὶ
  choice: и
  rationale: Союз прямо соединяет веру и крещение в описании человека, который будет спасён.
- source_word: δὲ
  choice: а
  rationale: Здесь частица имеет противопоставительное значение; русский союз «а» естественно сопоставляет положительный и отрицательный исходы.
theological_decisions:
- issue: Связь веры и крещения со спасением
  choice: Оба действия прямо сохранены в описании того, кто будет спасён; во второй части причиной осуждения названо неверие, а отсутствие крещения отдельно не упомянуто.
  alternative: Либо представить крещение как явно инструментальную причину спасения, либо ослабить его связь со спасением, назвав его лишь второстепенным обстоятельством.
  rationale: Греческий текст соединяет веру и крещение, но в отрицательной части говорит только о неверии. Перевод сохраняет эту богословскую напряжённость, не разрешая её в пользу определённой конфессиональной позиции.
- issue: Мужской род и единственное число субстантивированных причастий
  choice: тот, кто … тот, кто
  alternative: множественное число «те, кто» или обобщённое «всякий, кто»
  rationale: Конструкция сохраняет представленное в греческом единственное число и при этом в русском языке имеет общий смысл, не ограниченный мужчинами.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без излишней церковнославянской окраски. Основной текст сохраняет завершённость и предшествование действий, выраженные аористными причастиями; сноска предлагает более идиоматическую русскую формулировку с будущим временем.
