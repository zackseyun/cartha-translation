  verdict: approve
  source_fidelity: 'Основной текст точно передаёт структуру греческого высказывания: оба аористных причастия в первой части представлены как предшествующие будущему результату («поверил и был крещён»), страдательный залог βαπτισθεὶς и σωθήσεται сохранён, а во второй части верно переданы противопоставление и будущая пассивная форма κατακριθήσεται. «Не поверил» — естественная русская передача ἀπιστήσας и сохраняет контраст с «поверил».'
  naturalness: Формулировка современная, литературная и ясная. Сочетание «поверил и был крещён» несколько более формально, чем разговорный вариант, но уместно для библейского регистра и полезно тем, что не утрачивает страдательность греческого причастия. Сноска предлагает более плавный вариант для читателя, не подменяя основной текст.
  terminology: «Крещён», «спасён» и «осуждён» являются устоявшимися, точными и межконфессионально нейтральными в данном контексте терминами. Перевод не превращает связь веры и крещения в явно причинно-инструментальное утверждение и не добавляет отсутствующего в греческом осуждения за некрещение.
