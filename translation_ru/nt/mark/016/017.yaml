lexical_decisions:
- source_word: σημεῖα
  choice: знамения
  rationale: «Знамения» передаёт не только чудесный характер явлений, но и их значение как свидетельствующего знака.
- source_word: τοῖς πιστεύσασιν
  choice: уверовавших
  rationale: Субстантивированное причастие аориста обозначает тех, кто пришёл к вере; русское «уверовавших» сохраняет глагольную форму и завершённый оттенок, не ограничивая высказывание одной исторической группой.
- source_word: ταῦτα
  choice: такие
  rationale: В русском вводит следующий далее перечень естественнее, чем буквальное «эти», при этом сохраняет указательную функцию греческого слова.
- source_word: παρακολουθήσει
  choice: будут сопровождать
  rationale: Глагол выражает сопутствие, а не только следование во времени или пространстве.
- source_word: ἐν τῷ ὀνόματί μου
  choice: Моим именем
  rationale: Естественная русская формула действия именем и властью Иисуса; она не уточняет сверх текста механизм совершаемого.
- source_word: δαιμόνια
  choice: бесов
  rationale: Прямой и укоренившийся в русском библейском языке эквивалент; «нечистых духов» было бы подстановкой иной греческой формулы.
- source_word: ἐκβαλοῦσιν
  choice: будут изгонять
  rationale: Точно передаёт принудительное удаление в контексте изгнания бесов и звучит естественно по-русски.
- source_word: γλώσσαις
  choice: на языках
  rationale: Русское «языки», как и греческое γλῶσσαι, допускает связь с речью и языками; формулировка не определяет, идёт ли речь об известных человеческих языках или об ином виде речи.
- source_word: λαλήσουσιν
  choice: говорить
  rationale: Нейтральный современный эквивалент обычного греческого глагола речи.
- source_word: καιναῖς
  choice: новых
  rationale: Прямо передаёт новизну, не заменяя её более узким толкованием «неизвестных» или «незнакомых».
theological_decisions:
- issue: Характер «новых языков»
  choice: Сохранить выражение «говорить на новых языках» без определения природы этой речи.
  alternative: Уточнить как известные человеческие языки либо как экстатическую речь.
  rationale: Само греческое выражение не устанавливает здесь точный характер явления; уточнение внесло бы в перевод конфессиональное толкование.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для русского: объект «уверовавших» поставлен в начало, а «такие» вводит последующий перечень. Написание «Моим» с прописной буквы следует принятой русской библейской издательской традиции.'
