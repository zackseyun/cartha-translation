  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: ru
  text: Она пошла и сообщила об этом тем, кто был с ним[a] и кто скорбел и плакал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Она пошла и рассказала тем, кто был с ним; они скорбели и плакали».'
    reason: Греческие причастия позволяют передать скорбь и плач либо как характеристику тех, кто был с Иисусом, либо как сопутствующее обстоятельство.
lexical_decisions:
- source_word: ἐκείνη
  choice: она
  rationale: Указательное местоимение отсылает к Марии Магдалине из предыдущего стиха; в современном русском естественно употребить личное местоимение.
- source_word: πορευθεῖσα
  choice: пошла
  rationale: Аористное причастие обозначает действие, предшествующее основному; личная форма естественно передаёт последовательность действий.
- source_word: ἀπήγγειλεν
  choice: сообщила об этом
  rationale: Глагол означает «сообщить, возвестить»; дополнение «об этом» восполняет подразумеваемое содержание — только что упомянутое явление Иисуса.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: тем, кто был с ним
  rationale: Оборот обозначает людей, прежде находившихся вместе с Иисусом; такая формулировка точна и естественна по-русски.
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: и кто скорбел и плакал
  rationale: Оба причастия характеризуют адресатов сообщения; «скорбел» передаёт траурную печаль, а «плакал» — выражение этой скорби слезами.
theological_decisions: []
