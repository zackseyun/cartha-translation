  source_fidelity: Текст точно передаёт последовательность πορευθεῖσα ἀπήγγειλεν («пошла и сообщила»), подразумеваемое содержание сообщения («об этом»), адресатов τοῖς μετ’ αὐτοῦ γενομένοις («тем, кто был с ним») и их состояние, выраженное двумя настоящими причастиями πενθοῦσι καὶ κλαίουσιν («скорбел и плакал»). Временная форма русского прошедшего времени естественно следует повествовательному контексту и не вносит дополнительного смысла.
  naturalness: Формулировка современная, литературная и сдержанная. Повтор относительного слова в «кто был с ним и кто скорбел и плакал» несколько формален, но грамматически ясен и помогает недвусмысленно отнести скорбь и плач к адресатам сообщения.
  terminology: «Сообщила», «скорбел» и «плакал» уместны по регистру и лексически соответствуют греческому тексту. Написание «ним» со строчной буквы последовательно сохраняет нейтральную литературную норму без конфессионального типографского добавления. Сноска корректно отмечает допустимую русскую синтаксическую перестройку без заявления о текстологической неопределённости.
