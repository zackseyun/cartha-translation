  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: ru
  text: И они, уйдя, сообщили остальным[a], но и те им не поверили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другим».'
    reason: Лексема λοιποί может обозначать как «остальных» членов известной группы, так и «других» по отношению к названным лицам.
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: А они
  rationale: Стяжённая форма καὶ ἐκεῖνοι означает «и те»; в русском повествовании местоимение «они» естественно отсылает к двум ученикам из предыдущего контекста, не добавляя отсутствующего в греческом слова «мужчины».
- source_word: ἀπελθόντες
  choice: пошли
  rationale: Аористное причастие обозначает действие, предшествующее сообщению. Сочинённая конструкция с личной формой естественна по-русски и сохраняет последовательность действий.
- source_word: ἀπήγγειλαν
  choice: сообщили
  rationale: Глагол ἀπαγγέλλω означает «сообщать, извещать». Русское «сообщили» подходит для передачи увиденного или пережитого; подразумеваемое содержание сообщения восстанавливается из контекста без добавления местоимения «это».
- source_word: τοῖς λοιποῖς
  choice: остальным
  rationale: Субстантивированное λοιποί обозначает оставшихся членов группы. «Остальным» кратко и естественно передаёт этот смысл.
- source_word: οὐδὲ
  choice: но и … не
  rationale: οὐδέ связывает этот отказ поверить с предыдущим подобным отказом и имеет добавочное значение «также не». Конструкция «но и те … не» естественно выражает как повествовательное противопоставление, так и повторяемость реакции.
- source_word: ἐκείνοις
  choice: им
  rationale: 'Дательный падеж множественного числа относится к двум ученикам, принёсшим сообщение. После русского «поверить» нормативно употребляется дательный падеж: «поверили им».'
- source_word: ἐπίστευσαν
  choice: поверили
  rationale: В данном повествовательном контексте πιστεύω означает признать свидетельство истинным. «Поверили» точнее, чем более широкое и лично-реляционное «доверились».
theological_decisions:
- issue: Значение πιστεύω в контексте свидетельства
  choice: не поверили
  alternative: не доверились
  rationale: Речь идёт о неприятии сообщения двух учеников, а не о специально сформулированном богословском понятии веры или личного упования. Поэтому нейтральное «не поверили» сохраняет повествовательный смысл.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и достойная по тону. Синтаксис слегка перестроен ради естественности русского языка, при этом последовательность действий и добавочное значение οὐδέ сохранены.
