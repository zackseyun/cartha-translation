  - marker: c
    text: 'Или: «после восхода солнца». Греческая конструкция указывает на время их прихода, не уточняя его точнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: очень рано
  rationale: Передаёт усиление наречия πρωῒ словом λίαν естественным и ёмким современным русским выражением.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: в первый день недели
  rationale: Передаёт смысл устойчивого семитского и койне-греческого оборота; буквальная форма была бы неясна современному русскому читателю.
- source_word: ἔρχονται
  choice: они приходят
  rationale: Сохранено историческое настоящее Марка, придающее повествованию живость.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: к гробнице
  rationale: В данном погребальном контексте μνημεῖον обозначает гробницу, а ἐπί с винительным указывает на движение к ней.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: когда солнце уже взошло
  rationale: Генитив абсолютный выражает временное обстоятельство. «Когда» не усиливает последовательность до однозначного «после», а «уже взошло» естественно передаёт предшествующую завершённость действия относительно прихода.
