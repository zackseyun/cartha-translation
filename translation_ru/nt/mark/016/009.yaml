lexical_decisions:
- source_word: Ἀναστὰς
  choice: Воскреснув
  rationale: Аористное причастие обозначает действие, предшествующее явлению; краткая русская форма естественно передаёт временную последовательность и в данном контексте означает воскресение из мёртвых.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабый связующий союз; в русском отдельное «же» или «но» здесь звучало бы излишне либо придавало бы неоправданное противопоставление.
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: рано утром в первый день недели
  rationale: πρωῒ указывает на раннее утро, а πρώτῃ σαββάτου — обычное обозначение первого дня недели.
- source_word: ἐφάνη πρῶτον
  choice: явился прежде всего
  rationale: ἐφάνη в повествованиях о воскресении естественно передаётся как «явился»; πρῶτον указывает на первое явление в последовательности.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: Марии Магдалине
  rationale: Принятая современная русская форма имени и прозвания; дательный падеж соответствует лицу, которому Он явился.
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: из которой изгнал
  rationale: Оборот обозначает изгнание бесов из человека; плюсквамперфект указывает на действие, совершившееся ранее, что в русском достаточно ясно из контекста и вида глагола.
- source_word: ἑπτὰ δαιμόνια
  choice: семь бесов
  rationale: В евангельском контексте δαιμόνια обозначает бесов; число передано буквально.
theological_decisions:
- issue: Текстологический статус Мк. 16:9 в составе пространного окончания
  choice: Стих переведён по предоставленному тексту SBLGNT, а спорность отрывка отмечена сноской.
  alternative: Некоторые ранние рукописи заканчивают Евангелие от Марка на 16:8; другие содержат 16:9–20, иногда с вариантами.
  rationale: Угловые двойные скобки в SBLGNT отмечают текстологически спорный отрывок. Значимый вариант следует сообщить читателю, не исключая стих из перевода и не разрешая вопрос в пользу одной рукописной традиции.
- issue: Значение Ἀναστὰς
  choice: «Воскреснув»
  alternative: «Встав»
  rationale: В непосредственном контексте явлений после смерти глагол обозначает воскресение, однако перевод не добавляет отсутствующих в стихе подробностей.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимение «Он» употреблено для ясного указания на Иисуса; прописная буква соответствует принятой русской религиозной издательской норме, не добавляя толкования. «Прежде всего» естественно передаёт порядок явлений.
