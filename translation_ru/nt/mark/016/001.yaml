  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: ru
  text: Когда суббота миновала, Мария Магдалина, Мария, мать Иакова[a], и Саломия купили благовония, чтобы, придя, помазать Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Мария Иакова», то есть Мария, названная по её отношению к Иакову; традиционно это понимается как «мать Иакова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: когда суббота миновала
  rationale: Родительный самостоятельный оборот обозначает время, предшествующее главному действию; этот вариант естественно и точно передаёт завершение субботы.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Мария Магдалина
  rationale: Устоявшаяся и узнаваемая русская форма имени и прозвания.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Мария, мать Иакова
  rationale: Греческое выражение буквально определяет Марию через её отношение к Иакову, не называя самого отношения. По контексту евангельского повествования наиболее вероятно материнство; неоднозначность отмечена в сноске.
- source_word: Σαλώμη
  choice: Саломия
  rationale: Устоявшаяся русская форма личного имени.
- source_word: ἠγόρασαν
  choice: купили
  rationale: Прямой и естественный эквивалент простого повествовательного аориста.
- source_word: ἀρώματα
  choice: благовония
  rationale: Слово обозначает ароматические вещества, применявшиеся при погребении; «благовония» естественно для русского погребального контекста и не сужает значение до современных кулинарных пряностей.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: чтобы пойти и помазать Его
  rationale: ἵνα выражает цель, а причастие ἐλθοῦσαι — предшествующее перемещение. В данном контексте русское «пойти» передаёт направленность женщин к месту погребения естественнее буквального «прийти».
- source_word: ἀλείψωσιν
  choice: помазать
  rationale: Сохраняет прямое значение нанесения благовоний или мази на тело и погребальный смысл, не заменяя его более широким толкованием.
theological_decisions:
- issue: Восполнение подразумеваемого родства в выражении Μαρία ἡ τοῦ Ἰακώβου
  choice: Мария, мать Иакова
  alternative: Мария Иакова / Мария, связанная с Иаковом
  rationale: Греческий текст не называет отношение прямо, однако евангельский контекст поддерживает традиционное понимание «мать Иакова». Поскольку восполнение остаётся интерпретацией, буквальная неопределённость раскрыта в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; традиционные формы имён и глагол «помазать» сохранены там, где они естественны и точно передают исходный текст.
