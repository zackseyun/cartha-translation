  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: ru
  text: И Он велел им никому не рассказывать. Но чем больше Он запрещал им, тем больше они это провозглашали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но сколько Он ни запрещал им, они провозглашали это всё больше и больше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο
  choice: велел
  rationale: Средняя форма διαστέλλομαι передаёт твёрдое распоряжение. «Велел» естественно звучит по-русски и сохраняет силу повеления без архаического оттенка.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: никому не рассказывать
  rationale: Оборот выражает содержание распоряжения. «Рассказывать» в данном контексте естественно указывает на сообщение о случившемся.
- source_word: ὅσον ... διεστέλλετο
  choice: чем настойчивее Он им запрещал
  rationale: Сочетание ὅσον с имперфектом передаёт нарастающее или повторяющееся запрещение. Сравнительная конструкция «чем… тем…» естественно воспроизводит соотношение частей фразы.
- source_word: μᾶλλον περισσότερον
  choice: тем усерднее
  rationale: Два усилительных наречия подчёркивают возрастающую интенсивность. «Усерднее» сохраняет усиление и не создаёт тяжеловесного буквального повтора.
- source_word: ἐκήρυσσον
  choice: они это разглашали
  rationale: κηρύσσω означает публично провозглашать или широко объявлять. «Разглашали» передаёт публичное распространение вести и особенно уместно на фоне запрета молчать; «это» восполняет подразумеваемое содержание.
theological_decisions:
- issue: Мотив мессианской тайны и сила повеления Иисуса
  choice: Передать запрет как реальное и настойчивое повеление, не объясняя его причины.
  alternative: Добавить толкование мотива запрета или передать глагол как «строго предупредил».
  rationale: Текст сохраняет напряжение между повелением Иисуса молчать и всё более широким разглашением произошедшего, но не объясняет причину запрета.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены твёрдость запрета, длительный характер действия и усиленная публичность последующего разглашения.
