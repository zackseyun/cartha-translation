  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: ru
  text: Эта женщина была гречанкой[a], сирофиникиянкой по происхождению[b], и всё просила Его изгнать беса из её дочери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язычницей». В греческом тексте буквально «гречанкой»; в данном контексте это слово, вероятно, также подчёркивает, что она была нееврейкой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сирофиникиянкой по роду», то есть сирофиникийского происхождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: гречанкой
  rationale: Прямо передаёт женскую форму «гречанка» и сохраняет возможный культурно-этнический смысл; контекст также указывает на её принадлежность к неевреям, что отмечено в сноске.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: сирофиникиянкой по происхождению
  rationale: Передаёт этническое и географическое происхождение женщины естественным современным русским языком.
- source_word: ἠρώτα
  choice: всё просила
  rationale: Имперфект выражает продолжавшуюся или повторявшуюся просьбу; оборот звучит естественно и не усиливает глагол до «умоляла».
- source_word: ἵνα ... ἐκβάλῃ
  choice: изгнать
  rationale: Естественно передаёт содержание просьбы и обычное для контекста экзорцизма значение ἐκβάλλω.
- source_word: τὸ δαιμόνιον
  choice: беса
  rationale: Прямой и традиционно понятный русский эквивалент δαιμόνιον, не подменяющий его выражением «нечистый дух».
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: из её дочери
  rationale: Предлог «из» конкретно передаёт ἐκ и естественен при глаголе «изгнать».
- source_word: δὲ
  choice: Эта женщина
  rationale: Слабый повествовательный переход не требует отдельного русского союза; указательное местоимение естественно связывает стих с предыдущим контекстом без добавления временного «теперь».
theological_decisions:
- issue: Этническая принадлежность женщины
  choice: 'Сохранены оба обозначения: «гречанкой, сирофиникиянкой по происхождению».'
  alternative: «язычницей, сирофиникиянкой по происхождению»
  rationale: Так сохраняются два слоя исходного описания — греческая/нееврейская идентичность и сирофиникийское происхождение — без сведения их к одному признаку.
- issue: Характер недуга дочери
  choice: «изгнать беса»
  alternative: «изгнать злого духа»
  rationale: Перевод следует конкретному слову δαιμόνιον и не смягчает сверхъестественное утверждение текста.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достоинственное. «Всё просила» сохраняет длительность имперфекта, а «гречанкой» и «сирофиникиянкой по происхождению» удерживают оба исходных обозначения.
