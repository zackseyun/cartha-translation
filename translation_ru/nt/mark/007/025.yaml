lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт мягкий противительный переход от предыдущего повествования и естественно звучит по-русски.
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: как только услышала о Нём
  rationale: Связывает немедленность с тем, что женщина, услышав об Иисусе, сразу откликнулась; такая конструкция естественна в современном русском и сохраняет повествовательную стремительность Марка.
- source_word: γυνὴ
  choice: одна женщина
  rationale: Неопределённое «одна женщина» естественно вводит нового участника повествования и не означает числового противопоставления.
- source_word: θυγάτριον
  choice: маленькая дочь
  rationale: Сохраняет родственную связь и возможный уменьшительный оттенок греческой формы; альтернативное понимание отмечено в сноске.
- source_word: ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον
  choice: у которой маленькая дочь была одержима нечистым духом
  rationale: Передаёт греческую конструкцию естественным русским выражением, не оставляя неясным, что дух воздействовал на дочь.
- source_word: πνεῦμα ἀκάθαρτον
  choice: нечистый дух
  rationale: Сохраняет характерный для Марка термин и его смысловые ассоциации; «демон» было бы более истолковывающим переводом.
- source_word: ἐλθοῦσα
  choice: пришла
  rationale: Естественно передаёт последовательность действий греческого причастия в русском повествовании.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: пала к Его ногам
  rationale: Сохраняет телесный образ смиренной и настойчивой мольбы без излишнего уточнения позы.
theological_decisions:
- issue: Передача πνεῦμα ἀκάθαρτον
  choice: нечистый дух
  alternative: нечистая сила; демон
  rationale: Буквальный термин сохраняет лексику Марка и не сводит её заранее к истолковывающему обозначению «демон».
- issue: Передача состояния дочери
  choice: была одержима нечистым духом
  alternative: в ней был нечистый дух
  rationale: «Была одержима» естественно по-русски передаёт греческое «имела нечистого духа», не уточняя сверх текста характер или степень воздействия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «как только услышала» устраняет тяжеловесное разнесение наречия и причастия, сохраняя срочность реакции. Заглавные местоимения при упоминании Иисуса соответствуют принятому русскому библейскому регистру.
