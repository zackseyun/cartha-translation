  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: ru
  text: Когда Он, оставив толпу, вошёл в дом, ученики стали расспрашивать Его о притче[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об изречении»; греческое слово παραβολή может обозначать притчу или образное высказывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Когда
  rationale: В русском повествовании временное «когда» естественно передаёт ὅτε; отдельное «и» здесь можно не воспроизводить, чтобы избежать тяжеловесного начала фразы.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: Он вошёл в дом
  rationale: Глагол «вошёл» точно передаёт εἰσῆλθεν. Хотя οἶκον употреблено без артикля, русское «в дом» не маркирует определённость так же, как английский артикль, и звучит естественно.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: удалившись от толпы
  rationale: Оборот ясно передаёт отделение Иисуса от толпы и естественно связывает это обстоятельство со входом в дом.
- source_word: ἐπηρώτων
  choice: спросили
  rationale: Совершенный вид естественен в русском повествовании. Имперфект может подразумевать продолжительность или повторность, но контекст не требует явно выражать её.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ученики
  rationale: При явно названном ранее Иисусе притяжательное местоимение в русском можно опустить без потери референции; заглавное «Его» в следующем слове ясно указывает объект вопроса.
- source_word: τὴν παραβολήν
  choice: об этой притче
  rationale: «Притча» прямо сохраняет категорию παραβολή, которой Марк обозначает предыдущее образное высказывание. Указательное «этой» естественно отсылает к только что сказанному.
theological_decisions:
- issue: Значение παραβολή применительно к краткому образному высказыванию
  choice: притча
  alternative: изречение; образное высказывание
  rationale: Перевод «притча» сохраняет термин самого евангелиста и не сужает его до простого изречения, однако примечание отмечает допустимую широту значения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимения, относящиеся к Иисусу, оформлены с традиционной прописной буквы; синтаксис не перегружен буквальным воспроизведением греческой связки.
