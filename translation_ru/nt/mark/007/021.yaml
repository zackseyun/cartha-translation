  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: ru
  text: 'Ибо изнутри, из сердца людей, исходят злые помыслы: блудодеяния[a], кражи, убийства,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «проявления сексуальной безнравственности»; греческое слово стоит во множественном числе и широко обозначает недозволенные половые поступки.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: изнутри
  rationale: Передаёт внутренний источник и сохраняет противопоставление внешнему в ближайшем контексте.
- source_word: γὰρ
  choice: ибо
  rationale: Вводит объяснение предыдущего утверждения; союз уместен в современном литературном библейском изложении.
- source_word: ἐκ τῆς καρδίας
  choice: из сердца
  rationale: Сохраняет библейский антропологический образ сердца как центра мыслей, воли и нравственной жизни, не заменяя его толкованием.
- source_word: τῶν ἀνθρώπων
  choice: людей
  rationale: Греческое множественное число употреблено обобщённо и относится ко всем людям; русское «людей» точно и естественно передаёт этот смысл.
- source_word: οἱ διαλογισμοὶ οἱ κακοὶ
  choice: злые помыслы
  rationale: «Помыслы» передаёт внутренние размышления и намерения, а «злые» сохраняет явную нравственную оценку.
- source_word: ἐκπορεύονται
  choice: исходят
  rationale: Сохраняет образ движения наружу из внутреннего источника и естественно сочетается с «из сердца».
- source_word: πορνεῖαι
  choice: блудодеяния
  rationale: Множественное число передаёт отдельные проявления недозволенного полового поведения, не сужая значение до одной современной категории.
- source_word: κλοπαί
  choice: кражи
  rationale: Естественный русский эквивалент существительного во множественном числе в перечне пороков.
- source_word: φόνοι
  choice: убийства
  rationale: Передаёт нравственно и юридически предосудительное лишение жизни точнее, чем более широкое «лишения жизни».
theological_decisions:
- issue: Обобщённое значение ἀνθρώπων
  choice: людей
  alternative: мужчин / человеков
  rationale: В данном контексте слово обозначает людей вообще, а не только лиц мужского пола; «людей» сохраняет объём значения без искусственной гендерной конкретизации.
- issue: Объём значения πορνεῖαι
  choice: блудодеяния
  alternative: половая распущенность / сексуальная безнравственность
  rationale: Выбрано широкое обозначение недозволенных половых поступков во множественном числе; перевод не ограничивает термин одной разновидностью поведения и не превращает конкретный элемент перечня в отвлечённое качество.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ибо», «сердце» и «помыслы» сохраняют достоинство и образность оригинала, оставаясь понятными современному читателю. Конечная запятая сохранена, поскольку стих продолжает перечень в следующем стихе.
