base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: ru
  text: 'И, взглянув на небо, Он вздохнул[a] и сказал ему: «Эффафа», то есть «Откройся»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простонал»; глагол может обозначать глубокий вздох или стон.'
    reason: lexical_alternative
  - marker: b
    text: «Эффафа» — арамейское слово, означающее «Откройся».
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας
  choice: взглянув
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; в сочетании с «на небо» естественно передаёт направленный вверх взгляд.
- source_word: εἰς τὸν οὐρανόν
  choice: на небо
  rationale: В данном молитвенно-жестовом контексте οὐρανός означает небо; русское «взглянуть на небо» естественно и точно.
- source_word: ἐστέναξεν
  choice: глубоко вздохнул
  rationale: στενάζω может обозначать тяжёлый вздох или стон. «Глубоко вздохнул» передаёт эмоциональную и слышимую глубину действия, не усиливая его однозначно до стона.
- source_word: λέγει αὐτῷ
  choice: сказал ему
  rationale: Историческое настоящее передано русским прошедшим временем ради естественного повествования; местоимение сохраняет личное обращение к человеку.
- source_word: Εφφαθα
  choice: Эффафа
  rationale: Сохранено арамейское слово в традиционно понятной русской транслитерации, вслед за которым Марк сам приводит перевод.
- source_word: Διανοίχθητι
  choice: Откройся
  rationale: Аористный пассивный императив второго лица единственного числа. В русском возвратная форма естественно передаёт значение «стань открытым», сохраняя обращение к человеку.
theological_decisions:
- issue: Референт αὐτῷ и адресат повеления
  choice: «сказал ему… Откройся» — обращение к глухому человеку
  alternative: Понять повеление как косвенно обращённое к ушам и речевой способности человека
  rationale: Дательный αὐτῷ естественнее всего относится к самому человеку. Перевод не подменяет личное обращение пояснительной анатомической парафразой.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным евангельским звучанием. Историческое настоящее сглажено прошедшим временем. Заглавное «Он» использовано как уважительное обозначение Иисуса.
