  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: ru
  text: И открылся у него слух[a], развязались узы его языка[b], и он стал говорить ясно[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открылись его уши». Греческое слово может обозначать как уши, так и способность слышать.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «развязались узы его языка»; то есть было устранено то, что мешало ему говорить.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «правильно», «отчётливо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: открылся
  rationale: Аорист пассивного залога передаёт внезапное восстановление способности слышать; по-русски безлично-возвратная форма «открылся слух» естественно выражает это событие.
- source_word: αἱ ἀκοαί
  choice: слух
  rationale: Множественное число греческого существительного может обозначать уши или способность слышать. Русское «слух» естественно передаёт восстановленную функцию, не вынуждая понимать выражение только анатомически.
- source_word: ἐλύθη
  choice: освободились
  rationale: Пассивная форма λύω означает, что связывавшее язык препятствие было устранено. «Освободились узы» сохраняет образ и звучит естественнее буквального «были развязаны».
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: узы его языка
  rationale: Сохраняется конкретная метафора δεσμός — связывающие узы, — без замены её клиническим выражением «дефект речи».
- source_word: ἐλάλει
  choice: стал говорить
  rationale: Имперфект описывает последовавшую речь как продолжающееся проявление исцелённой способности; «стал говорить» естественно передаёт начало этого нового состояния в повествовательном контексте.
- source_word: ὀρθῶς
  choice: ясно
  rationale: В контексте исцеления речи наречие означает правильную, отчётливую речь. «Ясно» не создаёт нежелательного оттенка грамматической или нравственной правильности.
theological_decisions:
- issue: Передавать ли исцеление речи буквально-образно или толковательно
  choice: Сохранить метафору «освободились узы его языка»
  alternative: «Исчезло препятствие, мешавшее ему говорить» или «его язык освободился»
  rationale: Греческий текст описывает чудесное исцеление через образ уз. Его сохранение не превращает перевод в медицинское толкование и удерживает выразительность оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и образности оригинала. «Узы языка» намеренно оставлены как понятная библейская метафора; сноска разъясняет её смысл. Начальное καί передано связкой «И», а чтение «тотчас» отражает текстуальный вариант, отмеченный в SBLGNT знаком варианта; поскольку представленная строка содержит его как часть печатного текста, оно сохранено.
