    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающуюся речь; русское «говорил» естественно сохраняет этот повествовательный аспект без излишнего утяжеления.
- source_word: δὲ
  choice: И
  rationale: Здесь частица служит мягкой повествовательной связкой и не выражает сильного противопоставления.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: То, что выходит из человека
  rationale: Субстантивированное причастие естественно передаётся придаточной конструкцией; «выходит» сохраняет конкретный образ исходного текста.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: из человека / человека
  rationale: ἄνθρωπος имеет здесь обобщённое значение; русское «человек» естественно охватывает любого человека и сохраняет лексический повтор.
- source_word: ἐκεῖνο
  choice: именно это
  rationale: Указательное местоимение подчёркивает, что оскверняет как раз выходящее из человека; «именно это» ясно воспроизводит данный акцент.
- source_word: κοινοῖ
  choice: оскверняет
  rationale: В контексте чистоты глагол означает делать нечистым, осквернять. «Оскверняет» кратко и естественно передаёт как нравственную, так и культовую окраску.
theological_decisions:
- issue: Язык чистоты в глаголе κοινόω
  choice: оскверняет
  alternative: делает нечистым
  rationale: «Оскверняет» звучит естественно и сохраняет богословскую силу высказывания, тогда как вариант «делает нечистым» явнее обозначает категорию чистоты и потому приводится в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Повтор слова «человек» сохранён ради риторического параллелизма оригинала; «именно это» передаёт эмфатическое ἐκεῖνο.
