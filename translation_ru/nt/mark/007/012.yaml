  text: вы уже не позволяете ему ничего сделать для отца или матери.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничем помочь отцу или матери». В данном контексте широкое греческое выражение может включать практическую или материальную поддержку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно передаёт прекращение прежней возможности или практики и сохраняет временное значение греческого наречия.
- source_word: ἀφίετε
  choice: позволяете
  rationale: В данном контексте глагол означает «допускать, позволять», а не «прощать» или «оставлять».
- source_word: αὐτὸν
  choice: ему
  rationale: Русская конструкция «позволять кому-либо что-либо сделать» требует дательного падежа; мужской род и единственное число сохранены.
- source_word: οὐδὲν ποιῆσαι
  choice: ничего сделать
  rationale: Прямо и естественно передаёт отрицательное местоимение с инфинитивом, не сужая действие до одной лишь материальной помощи.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: для отца или матери
  rationale: Предлог «для» передаёт значение заинтересованного лица; принадлежность родителей понятна из контекста и в русском не требует повторения местоимения «его».
theological_decisions:
- issue: Следует ли явно выразить подразумеваемую контекстом материальную поддержку родителей
  choice: Сохранить общее выражение «ничего сделать для отца или матери»
  alternative: «ничем помочь отцу или матери»
  rationale: Греческая формулировка шире материальной или практической помощи. Контекст корвана подсказывает такую область применения, но сам стих её прямо не ограничивает.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, с сохранением широты греческого выражения. Строчная начальная буква уместна, поскольку стих синтаксически продолжает предыдущее высказывание.
