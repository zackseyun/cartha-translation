  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: ru
  text: Ведь фарисеи и все иудеи не едят, пока не вымоют руки особым образом[a], придерживаясь предания старейшин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кулаком»; возможно также: «до запястья» или «тщательно». Значение греческого слова неясно; вероятно, речь идёт об установленном способе обрядового омовения рук.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительный характер авторского замечания и естественно связывает его с предыдущим стихом.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование этой религиозной группы.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: все иудеи
  rationale: Сохраняет широкую формулировку греческого текста; в контексте это обобщающее описание обычая, а не обязательно статистическое утверждение о каждом человеке.
- source_word: ἐὰν μὴ
  choice: пока не
  rationale: Естественно передаёт отрицательное условие применительно к обычному действию; буквальное «если не» возможно, но менее плавно по-русски.
- source_word: πυγμῇ
  choice: особым образом
  rationale: Значение редкого и спорного слова неясно; выражение, вероятно, обозначает установленный способ или меру обрядового омовения. Нейтральная передача не закрепляет одну из спорных реконструкций, которые приведены в сноске.
- source_word: νίψωνται τὰς χεῖρας
  choice: вымоют руки
  rationale: Обычная и ясная русская передача мытья части тела; совершенный вид естественен после «пока не».
- source_word: οὐκ ἐσθίουσιν
  choice: не едят
  rationale: Сохраняет настоящее время обычного действия без добавления отсутствующего в оригинале объекта.
- source_word: κρατοῦντες
  choice: придерживаясь
  rationale: Передаёт устойчивую приверженность унаследованной практике.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: предания старейшин
  rationale: «Предание» обозначает переданную традицию, а родительный падеж сохраняет возможное указание как на её источник, так и на связь со старейшинами.
theological_decisions:
- issue: Объём выражения πάντες οἱ Ἰουδαῖοι
  choice: Сохранено «все иудеи» как широкое пояснительное обобщение Марка.
  alternative: «все жители Иудеи»; «многие иудеи»
  rationale: Греческий текст прямо содержит πάντες, а Ἰουδαῖοι здесь естественнее понимать в широком этнорелигиозном смысле. Сужение или смягчение выражения выходило бы за пределы перевода.
- issue: Значение πυγμῇ
  choice: В основном тексте — «особым образом», со спорными вариантами в сноске.
  alternative: «кулаком»; «до запястья»; «тщательно»
  rationale: Слово лексически затруднительно, а буквальное «кулаком» без пояснения может создать ложную конкретность. Нейтральная формулировка сохраняет указание на установленный способ омовения, не разрешая спор молча.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Предание старейшин» сохраняет библейскую терминологию без архаизации; спорное πυγμῇ передано нейтрально, а подлинная неоднозначность раскрыта в сноске.
