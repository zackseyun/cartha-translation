  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: ru
  text: 'И снова подозвав к себе народ, Он говорил им: «Послушайте Меня, все вы, и поймите».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвав к себе
  rationale: Передаёт значение призыва приблизиться к говорящему и естественно сочетается с «народ».
- source_word: πάλιν
  choice: снова
  rationale: Сохраняет явное указание на повторность действия.
- source_word: τὸν ὄχλον
  choice: народ
  rationale: Естественное современное обозначение собравшейся толпы людей в данном повествовательном контексте.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Русский несовершенный вид сохраняет имперфект и представляет речь как разворачивающееся действие.
- source_word: Ἀκούσατέ μου
  choice: Послушайте Меня
  rationale: «Послушайте» передаёт не только физическое слышание, но и призыв внимательно воспринять сказанное; местоимение сохраняет греческое μου.
- source_word: σύνετε
  choice: поймите
  rationale: Прямо передаёт повеление уразуметь смысл последующего учения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаизмов. Прописная буква в местоимении «Он/Меня» следует принятой русской библейской типографической традиции и не добавляет смыслового содержания.
