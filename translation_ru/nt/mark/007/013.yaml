  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: ru
  text: тем самым лишая силы слово Бога своим преданием, которое вы передали. И многое другое, подобное этому, вы делаете.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: лишая силы
  rationale: Причастие означает делать недействительным или лишать действенности. Оборот «лишая силы» естественен по-русски и сохраняет обвинительную силу высказывания.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Бога
  rationale: Прямо передаёт греческое словосочетание и сохраняет противопоставление Божьего слова человеческому преданию.
- source_word: τῇ παραδόσει ὑμῶν
  choice: своим преданием
  rationale: 'Дательный падеж имеет инструментальное значение: предание служит средством, которым слово Бога лишают силы. Возвратное «своим» естественно при обращении к слушателям.'
- source_word: ᾗ παρεδώκατε
  choice: которое вы передали
  rationale: Сохраняет смысл передачи предания другим и словесную связь παράδοσις с παραδίδωμι, насколько это допускает естественный русский язык.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: многое другое, подобное этому
  rationale: Передаёт множественность и сходство названных поступков без неестественной для русского языка избыточности греческого выражения.
- source_word: ποιεῖτε
  choice: вы делаете
  rationale: Настоящее время передаёт продолжающееся или привычное действие; конечная позиция глагола сохраняет риторическое ударение.
theological_decisions:
- issue: Характер предания в обвинении Иисуса
  choice: «своим преданием»
  alternative: «человеческим преданием»
  rationale: В стихе сказано буквально «вашим преданием»; слово «человеческим» было бы поясняющим добавлением. Контекст сам показывает, что осуждается именно предание, противоречащее слову Бога.
- issue: Степень воздействия на слово Бога
  choice: «лишая силы»
  alternative: «отменяя»
  rationale: Выбранный оборот сохраняет возможный смысл лишения действенности или обязательной силы и не создаёт впечатления, будто Божье слово перестаёт существовать.
translation_notes:
  register: Современный литературный русский язык; тон прямой и обличительный, но без архаизмов. Синтаксис сохраняет связь с предыдущим высказыванием посредством «тем самым».
