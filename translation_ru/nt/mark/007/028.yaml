base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: ru
  text: 'Она же ответила Ему: «Господи[a], ведь и собачки[b] под столом едят крошки детей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое κύριε может быть как почтительным обращением «Господин», так и титулом «Господь».'
    reason: alternative_reading
  - marker: b
    text: Греческое слово имеет уменьшительную форму и может обозначать маленьких или домашних собак.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: ответила Ему
  rationale: Греческое сочетание буквально передаёт ответ и последующее говорение, но в современном русском естественно выражается одним глаголом речи; историческое настоящее λέγει не требует отдельного воспроизведения.
- source_word: Κύριε
  choice: Господин
  rationale: В данном прямом обращении форма κύριε может быть почтительным «Господин». Такой перевод сохраняет контекстуальную неоднозначность; возможное титульное «Господи» указано в примечании.
- source_word: καὶ
  choice: ведь и
  rationale: Частица вводит ответ женщины в рамках метафоры и подчёркивает, что собачкам также достаётся пища; «ведь и» естественно передаёт одновременно подтверждение и добавочный смысл.
- source_word: κυνάρια
  choice: собачки
  rationale: Уменьшительная форма обозначает маленьких или домашних собак. «Собачки» сохраняет этот оттенок, не сужая значение до щенков.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: под столом
  rationale: Прямой и естественный перевод пространственного оборота.
- source_word: ἐσθίουσιν
  choice: едят
  rationale: Настоящее время описывает обычное, характерное действие.
- source_word: ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: крошки, которые роняют дети
  rationale: ἀπό с родительным указывает на пищу из числа крошек; родительный τῶν παιδίων связывает крошки с детьми. Развёрнутая русская формулировка естественно передаёт подразумеваемые крошки со стола, не добавляя отдельного слова «пища».
theological_decisions:
- issue: Значение κύριε в обращении женщины к Иисусу
  choice: Господин
  alternative: Господи
  rationale: В форме обращения κύριε может быть как почтительным обращением «Господин», так и титулом «Господь». Контекст сам по себе не устраняет эту неоднозначность, поэтому основной текст использует обычное почтительное обращение, а титульный вариант сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с естественным диалогическим синтаксисом. Сохранён уменьшительный оттенок κυνάρια и отмечена подлинная неоднозначность обращения κύριε.
