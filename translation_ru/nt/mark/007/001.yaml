base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: ru
  text: И к Нему собираются фарисеи и некоторые из книжников, пришедшие из Иерусалима.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет характерную для Марка связь с предшествующим повествованием.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: собираются к Нему
  rationale: Естественно передаёт настоящее повествовательное время и направленность собрания к Иисусу, не добавляя отсутствующего в греческом тексте значения «вокруг».
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование религиозной группы; определённость обозначена контекстом и порядком слов без артикля, которого в русском нет.
- source_word: τινες τῶν γραμματέων
  choice: некоторые из книжников
  rationale: 'Сохраняет партитивную конструкцию: речь идёт о части книжников.'
- source_word: ἐλθόντες
  choice: пришедшие
  rationale: Причастие естественно сохраняет греческую синтаксическую форму и указывает на предшествующий приход.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: из Иерусалима
  rationale: Прямо передаёт исходный пункт движения.
