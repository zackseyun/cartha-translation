base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: ru
  text: Иисус отвёл его в сторону от толпы, чтобы остаться с ним наедине, вложил пальцы в его уши, затем плюнул[a] и коснулся его языка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст буквально сообщает, что Он плюнул и коснулся языка; прямо не сказано, что Иисус нанёс слюну на язык этого человека.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: отведя его в сторону от толпы
  rationale: Причастие передаёт отделение человека от остальных; русское «отведя в сторону от толпы» естественно и точно описывает это действие.
- source_word: κατ’ ἰδίαν
  choice: в сторону
  rationale: В данном контексте выражение указывает, что Иисус отвёл человека отдельно от других. Значение «наедине» отмечено в сноске, чтобы не создавать избыточного повторения.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: Он вложил пальцы в его уши
  rationale: «Вложил» естественно передаёт здесь контекстуальное значение βάλλω и сохраняет конкретность физического действия без оттенка резкости.
- source_word: πτύσας
  choice: затем плюнул
  rationale: Аористное причастие обозначает действие, предшествующее прикосновению. Формулировка сохраняет последовательность, но не уточняет, куда попала слюна.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: коснулся его языка
  rationale: ἅπτομαι с родительным падежом обычно означает «касаться»; местоимение по контексту относится к исцеляемому человеку.
theological_decisions:
- issue: Описание жеста Иисуса при исцелении
  choice: Прямо передать плевок и прикосновение, не утверждая, что Иисус нанёс слюну на язык человека.
  alternative: Перевести так, будто Иисус смочил слюной язык человека.
  rationale: Греческий текст сообщает лишь, что Иисус плюнул и коснулся языка; объект или направление плевка прямо не названы. Перевод сохраняет эту повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование конкретное и сдержанное. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской традицией; синтаксис остаётся доступным обычному читателю.
