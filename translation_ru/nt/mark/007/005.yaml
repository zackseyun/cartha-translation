  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: ru
  text: 'И фарисеи и книжники спросили Его: «Почему Твои ученики не поступают по преданию старейшин, а едят хлеб нечистыми руками[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обычными руками»; имеется в виду ритуальная нечистота, а не физическая грязь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: спросили
  rationale: Историческое настоящее естественно передаётся русским прошедшим временем; глагол обозначает обращённый к Иисусу вопрос без необходимости усиливать длительность или повторность.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшееся и понятное в евангельском контексте обозначение признанных знатоков и толкователей Закона.
- source_word: Διὰ τί
  choice: почему
  rationale: Естественный русский вопросительный эквивалент.
- source_word: περιπατοῦσιν
  choice: поступают
  rationale: В данном контексте метафорическое «ходить» означает образ поведения. «Поступают» естественно передаёт идиому, не создавая впечатления буквального передвижения.
- source_word: κατὰ τὴν παράδοσιν
  choice: по преданию
  rationale: Кратко и естественно выражает соответствие установленной традиции.
- source_word: τῶν πρεσβυτέρων
  choice: старейшин
  rationale: Прямо передаёт родительный оборот и указывает на авторитетных предшественников, с которыми связывали это предание.
- source_word: κοιναῖς χερσὶν
  choice: нечистыми руками
  rationale: В контексте спора κοινός означает ритуально осквернённое, непригодное для священного употребления, а не просто физически грязное. Сноска сохраняет буквальное значение «обычными» и уточняет ритуальный смысл.
- source_word: ἄρτον
  choice: едят хлеб
  rationale: Сохраняет конкретное значение существительного, которое здесь может также обозначать пищу или трапезу в целом.
theological_decisions:
- issue: Ритуальный статус, выраженный словом κοινός
  choice: нечистыми руками
  alternative: осквернёнными руками; обычными руками
  rationale: «Нечистыми» естественно передаёт категорию ритуальной непригодности, не сводя вопрос к гигиене и не приписывая ученикам нравственного зла. Буквальная необычность κοινός отражена в сноске.
- issue: Метафора поведения в περιπατοῦσιν
  choice: поступают
  alternative: ходят; живут
  rationale: Русское «ходят по преданию» звучит неестественно и может быть понято буквально. «Поступают» сохраняет смысл поведения, не добавляя вывода о всём образе жизни учеников.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных евангельских терминов «фарисеи», «книжники» и «предание». Реплика звучит естественно и достойно; ритуальный смысл спорного выражения прояснён сноской без конфессионального истолкования.
