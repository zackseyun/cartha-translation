source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: ru
  text: 'И Он говорил ей: «Пусть сначала насытятся дети, ведь нехорошо взять детский хлеб и бросить его собачкам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленьким собакам», «домашним собакам»; возможно также просто: «собакам». В греческом употреблена уменьшительная форма, которая может обозначать небольших или домашних собак.'
    reason: Лексическая альтернатива для κυναρίοις и пояснение уменьшительной формы.
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающуюся речь; русское «говорил» сохраняет этот аспект и звучит естественно.
- source_word: Ἄφες
  choice: пусть
  rationale: 'В данном обороте повелительная форма ἀφίημι выражает позволение: «пусть» естественно вводит желаемое действие.'
- source_word: πρῶτον
  choice: прежде
  rationale: Сохраняет последовательность и смысл приоритета, не превращая его в окончательное исключение других.
- source_word: χορτασθῆναι
  choice: насытятся
  rationale: Глагол означает получить пищу досыта; «насытятся» сохраняет и образ трапезы, и полноту насыщения.
- source_word: τὰ τέκνα
  choice: дети
  rationale: Прямое и естественное обозначение детей, сохраняющее семейную метафору без пояснения её референтов.
- source_word: καλόν ἐστιν
  choice: нехорошо
  rationale: Передаёт оценку действия как неподобающего и при этом близко отражает καλόν; форма естественна для русской речи.
- source_word: λαβεῖν τὸν ἄρτον τῶν τέκνων
  choice: взять хлеб у детей
  rationale: По-русски принадлежность в данной сцене естественно выражается конструкцией «хлеб у детей», сохраняющей смысл отнятия предназначенной им пищи.
- source_word: κυναρίοις
  choice: собачкам
  rationale: Уменьшительная форма сохраняет значение греческого диминутива и допускает образ небольших или домашних собак, не превращая их непременно в щенков.
- source_word: βαλεῖν
  choice: бросить
  rationale: Сохраняет конкретность и выразительность βάλλω, не ослабляя образ до нейтрального «дать».
theological_decisions:
- issue: Метафорический смысл «детей» и «собачек»
  choice: Сохранить бытовую метафору без прямого отождествления её участников.
  alternative: Передать «детей» как Израиль или иудеев, а «собачек» как язычников.
  rationale: Греческий текст оставляет референты внутри метафоры; их явное истолкование в основном тексте устранило бы образность и внесло бы пояснение переводчика.
- issue: Смысл πρῶτον
  choice: Передать как «прежде».
  alternative: Опустить указание на очередность либо передать высказывание как окончательное исключение.
  rationale: 'Указание на первоочерёдность сохраняет повествовательное и богословское напряжение: приоритет детей не обязательно означает вечное исключение остальных.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «И Он говорил ей» сохраняет греческое καὶ и аспект имперфекта; местоимение с прописной буквы соответствует распространённой русской библейской традиции. Формулировка не раскрывает метафору внутри основного текста и сохраняет последовательное «прежде».
