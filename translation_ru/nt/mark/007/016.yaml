  text: If anyone has ears to hear, let him hear.
translation:
  language: ru
  text: Если у кого есть уши, чтобы слышать, пусть слышит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в наиболее ранних греческих рукописях, включая Синайский и Ватиканский кодексы IV века, а также в ранних коптских переводах. Он присутствует в большинстве византийских рукописей, в латинской традиции и в большинстве сирийских свидетельств. Вероятно, это позднейшая вставка переписчика, повторяющая ту же фразу из Мк. 4:9 и 4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: уши
  rationale: Сохраняется буквальный образ органов слуха, метафорически указывающий на готовность воспринять и понять сказанное.
- source_word: ἀκουέτω
  choice: пусть слышит
  rationale: Форма третьего лица единственного числа настоящего времени повелительного наклонения передана естественной русской побудительной конструкцией; повтор корня «слышать» сохраняет риторическое звучание греческого текста.
theological_decisions:
- issue: Текстуальная подлинность стиха
  choice: Стих переведён согласно указанному византийскому изданию, а разночтение отмечено в сноске.
  alternative: Опустить стих в основном тексте либо заключить его в скобки.
  rationale: Предоставленный исходный текст включает этот стих, однако его отсутствие в наиболее ранних греческих рукописях существенно для читателя и требует прозрачного текстологического примечания без догматического вывода.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и легко понятная формулировка. Конструкция «у кого есть уши, чтобы слышать» сохраняет исходный семитизированный образ и узнаваемую риторическую форму.
