  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: ru
  text: 'Он сказал им: «Неужели и вы так непонятливы? Разве вы не понимаете, что всё входящее в человека извне не может осквернить его[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделать его нечистым». В данном контексте греческий глагол связан с представлениями о ритуальной чистоте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее естественно передано русским прошедшим временем в повествовательном контексте.
- source_word: Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε;
  choice: Неужели и вы так непонятливы?
  rationale: Передаёт удивление и укор, выраженные οὕτως, καί и явным ὑμεῖς, современным и естественным русским вопросом.
- source_word: νοεῖτε
  choice: понимаете
  rationale: Прямо выражает познавательный смысл глагола и сохраняет смысловую связь с «непонятливы».
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: всё входящее ... извне
  rationale: Сохраняет обобщающее πᾶν, субстантивированное причастие и указание на внешний источник.
- source_word: εἰς τὸν ἄνθρωπον
  choice: в человека
  rationale: Естественно передаёт направление εἰς и родовое употребление единственного числа ἄνθρωπος без ненужного гендерного уточнения.
- source_word: κοινῶσαι
  choice: осквернить
  rationale: В контексте спора о чистоте глагол означает сделать человека нечистым; «осквернить» кратко и естественно сохраняет этот оттенок, а более буквальная ритуальная формулировка дана в сноске.
theological_decisions:
- issue: Терминология чистоты в κοινόω
  choice: осквернить
  alternative: сделать нечистым
  rationale: Контекст связан с чистотой, а не только с нравственной порчей. Основной вариант звучит естественно и достойно, тогда как сноска явно сохраняет категорию нечистоты и не навязывает последующего догматического толкования.
translation_notes:
  register: Современный литературный русский язык с уважительным библейским регистром. Вопросы передают укор без излишней резкости. Конечная запятая сохранена, поскольку фраза продолжается в следующем стихе.
