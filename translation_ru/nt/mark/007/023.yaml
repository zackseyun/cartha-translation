  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: ru
  text: Всё это зло исходит изнутри и оскверняет человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Всё это зло
  rationale: Субстантивированное прилагательное во множественном числе обобщает перечисленные ранее пороки. По-русски собирательное «всё это зло» звучит естественнее, чем буквальное «все эти злые вещи», и сохраняет указательный и всеохватный характер выражения.
- source_word: ἔσωθεν
  choice: изнутри
  rationale: Наречие обозначает внутренний источник и сохраняет противопоставление внешней и внутренней нечистоты в контексте.
- source_word: ἐκπορεύεται
  choice: исходит
  rationale: Глагол выражает движение из внутреннего источника. «Исходит» естественно сочетается с собирательным «зло» и передаёт смысл без архаического оттенка.
- source_word: κοινοῖ
  choice: оскверняет
  rationale: В контексте спора о чистоте глагол означает делать нечистым, осквернять. «Оскверняет» кратко передаёт как религиозную, так и нравственную сторону значения.
- source_word: τὸν ἄνθρωπον
  choice: человека
  rationale: Единственное число употреблено обобщённо. Русское «человека» естественно включает любого человека и при этом формально сохраняет число и основное лексическое значение.
theological_decisions:
- issue: Обобщённое значение τὸν ἄνθρωπον в высказывании о человеческой нечистоте
  choice: человека
  alternative: мужчину; всякого человека; людей
  rationale: ἄνθρωπος здесь обозначает человека как такового, а не лицо мужского пола. Русское «человека» сохраняет обобщённое единственное число без ненужного гендерного сужения и без превращения его во множественное.
- issue: Соотношение ритуальной и нравственной нечистоты в κοινοῖ
  choice: оскверняет
  alternative: делает нечистым
  rationale: Контекст объединяет язык чистоты с перечислением нравственного зла. «Оскверняет» сохраняет эту смысловую напряжённость, не сводя значение исключительно к ритуальной или исключительно к нравственной категории.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка, соответствующая заключительному характеру стиха. Собирательное «всё это зло» предпочтено неестественному буквальному множественному обороту.
