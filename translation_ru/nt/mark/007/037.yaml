base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: ru
  text: 'И они безмерно изумлялись и говорили: «Он всё сделал хорошо[a]: и глухим даёт слышать, и немым — говорить».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «Он всё совершил хорошо». Эта формулировка может перекликаться с библейским языком о Божьих делах.'
    reason: lexical_alternative
  - marker: b
    text: Ср. Ис. 35:5–6, где при Божьем восстановлении глухие начинают слышать, а немые — говорить.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: безмерно
  rationale: Передаёт чрезвычайно усиленное значение наречия естественным и выразительным современным русским словом.
- source_word: ἐξεπλήσσοντο
  choice: изумлялись
  rationale: Имперфект описывает продолжавшуюся реакцию; «изумлялись» сохраняет сильную степень удивления и хорошо сочетается с «безмерно».
- source_word: λέγοντες
  choice: и говорили
  rationale: Деепричастное «говоря» здесь менее естественно; сочинительная конструкция ясно передаёт сопутствующее действие.
- source_word: Καλῶς πάντα πεποίηκεν
  choice: Он всё делает хорошо
  rationale: Русское настоящее обобщает наблюдаемый результат совершённых дел и звучит естественно; сноска сохраняет более буквальную передачу греческого перфекта.
- source_word: κωφοὺς ποιεῖ ἀκούειν
  choice: глухим даёт слышать
  rationale: Передаёт каузативную конструкцию ποιεῖ с инфинитивом без неестественного русского «заставляет слышать».
- source_word: ἀλάλους λαλεῖν
  choice: немым — говорить
  rationale: Кратко и параллельно передаёт неспособность говорить и её чудесное устранение.
- source_word: καὶ ... καὶ
  choice: даже ... а
  rationale: «Даже» выражает усилительный оттенок перечисления, а «а» создаёт естественный русский параллелизм без противопоставления по смыслу.
theological_decisions:
- issue: Возможная перекличка с Исайей 35:5–6 и оценкой Божьих дел
  choice: Сохранить прямое высказывание толпы, не делая аллюзии явными в основном тексте.
  alternative: 'Передать формальнее: «Он всё совершил хорошо», усилив созвучие с библейской речью о Божьих делах.'
  rationale: Греческий текст допускает такие библейские отзвуки, но прямо их не поясняет. Основной перевод остаётся понятным, а возможные связи отмечены в сносках.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя. Сохранены торжественность возгласа, сильная степень изумления и параллелизм заключительной фразы; буквальные и межтекстовые нюансы вынесены в сноски.
