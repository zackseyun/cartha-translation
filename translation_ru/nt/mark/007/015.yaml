id: MRK.7.15
reference: Mark 7:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: ru
  text: Нет ничего вне человека, что, входя в него, может осквернить его[a]; но то, что выходит из человека, — вот что оскверняет человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделать его нечистым». Греческий глагол может обозначать приведение человека в состояние нечистоты; «осквернить» сохраняет также более широкий нравственный оттенок контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: нет ничего
  rationale: Естественно и точно передаёт абсолютное отрицательное местоимение среднего рода.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: вне человека
  rationale: Сохраняет пространственный контраст с последующим «из человека» и звучит естественно в современном литературном русском.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: входя в него
  rationale: Деепричастный оборот передаёт обстоятельственное значение причастия и не перегружает фразу.
- source_word: δύναται
  choice: может
  rationale: Обычный русский эквивалент глагола возможности; конструкция «способно» здесь была бы тяжелее.
- source_word: κοινῶσαι / κοινοῦντα
  choice: осквернить / оскверняет
  rationale: «Осквернять» удерживает связь как с нечистотой в контексте правил чистоты, так и с более широким нравственным смыслом; буквальное «сделать общим» по-русски смысла не передаёт.
- source_word: ἀλλὰ
  choice: но
  rationale: Прямо и естественно выражает сильное противопоставление; усилительная конструкция «вот что» передаёт его уточняющую силу во второй части.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: то, что выходит из человека
  rationale: Естественно передаёт субстантивированное причастие среднего рода множественного числа как собирательное содержание и сохраняет противопоставление входящего и выходящего.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: человека
  rationale: Русское «человек» точно передаёт родовое значение ἄνθρωπος без ненужного ограничения мужским полом и позволяет сохранить повтор исходного текста.
theological_decisions:
- issue: Значение κοινόω в споре о чистоте
  choice: осквернить
  alternative: сделать нечистым
  rationale: Выбранный глагол сохраняет одновременно культово-ритуальный и нравственный оттенки контекста, не сводя высказывание только к обрядовой нечистоте.
- issue: Родовое употребление ἄνθρωπος
  choice: человек
  alternative: мужчина
  rationale: В данном контексте ἄνθρωπος обозначает человека вообще. Русское «человек» сохраняет единственное число и риторический повтор, не внося значения пола.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи Иисуса. Синтаксический параллелизм «входя в него» / «выходит из человека» сохранён; конструкция «вот что» естественно подчёркивает контраст без добавления отдельного богословского толкования.
