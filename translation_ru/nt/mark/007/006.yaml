source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: ru
  text: 'Но Он сказал им: «Исаия верно пророчествовал о вас, лицемерах, как написано: “Этот народ чтит Меня устами, но сердце их далеко от Меня”».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкое противопоставление и поворот к ответу Иисуса в предшествующем диалоге.
- source_word: εἶπεν αὐτοῖς
  choice: Он сказал им
  rationale: Естественная и формально близкая передача повествовательной конструкции с косвенным дополнением.
- source_word: Καλῶς
  choice: Хорошо
  rationale: Сохраняет прямую оценочную силу наречия, не сужая смысл до «верно» или «точно».
- source_word: ἐπροφήτευσεν
  choice: пророчествовал
  rationale: Стандартно передаёт глагол и ясно сохраняет формулу ссылки на пророка.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: о вас, лицемерах
  rationale: Передаёт приложение τῶν ὑποκριτῶν к ὑμῶν и сохраняет прямое обличение слушателей.
- source_word: ὡς γέγραπται ὅτι
  choice: 'как написано:'
  rationale: Естественная русская формула введения прямой цитаты; двоеточие передаёт функцию ὅτι.
- source_word: Οὗτος ὁ λαὸς
  choice: Этот народ
  rationale: Сохраняет единственное число и пророческую форму цитаты Ис 29:13.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: чтит Меня устами
  rationale: «Чтит» точно передаёт τιμᾷ, а «устами» естественно выражает средство без добавления притяжательного местоимения.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: но сердце их
  rationale: Сохраняет греческое единственное число «сердце» как собирательный образ внутреннего состояния народа и одновременно передаёт αὐτῶν множественным «их».
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: далеко от Меня
  rationale: Идиоматично передаёт как пространственный образ, так и подразумеваемую духовно-реляционную отдалённость, не разъясняя её сверх текста.
theological_decisions:
- issue: Применение слов Исаии 29:13 к собеседникам Иисуса
  choice: Сохранено прямое обращение «о вас, лицемерах» и обличительная цитата «Этот народ».
  alternative: Смягчить или обобщить высказывание, устранив прямую направленность на слушателей.
  rationale: Греческий текст прямо применяет пророческое обличение к присутствующим собеседникам; перевод сохраняет эту силу без добавочного конфессионального толкования.
- issue: Единственное число «сердце» при множественном αὐτῶν
  choice: «сердце их»
  alternative: «их сердца»
  rationale: 'Единственное число сохраняет собирательный образ исходного текста и его напряжение: народ представлен как общность с единым внутренним расположением.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис прям и понятен; традиционные слова «пророчествовал», «лицемеры», «чтит» остаются общеупотребительными и точно соответствуют контексту. Местоимения, относящиеся к Богу и Христу, оформлены с прописной буквы согласно принятой русской библейской издательской практике.
