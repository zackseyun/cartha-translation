  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: ru
  text: 'И Он сказал ей: «За этот ответ иди: демон вышел из твоей дочери».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: И Он сказал ей
  rationale: Союз καί передан нейтральным повествовательным «и», без добавления более определённого временного оттенка «тогда».
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: За эти слова
  rationale: διά с винительным падежом выражает основание или причину. Русское «за эти слова» естественно отсылает к только что данному ответу женщины; множественное число соответствует русской идиоме, хотя λόγος в греческом стоит в единственном числе.
- source_word: ὕπαγε
  choice: иди
  rationale: Повелительная форма служит разрешением уйти. Простое «иди» ясно и не добавляет отсутствующих в греческом слов.
- source_word: ἐξελήλυθεν
  choice: вышел
  rationale: Греческий перфект обозначает совершившееся действие с сохраняющимся результатом. В русском совершенный вид и контекст естественно передают, что бес уже вышел и больше не находится в девочке.
- source_word: ἐκ τῆς θυγατρός σου
  choice: из твоей дочери
  rationale: Предлог ἐκ сохраняет образ выхода из человека; «из твоей дочери» прямо и естественно передаёт эту конструкцию.
- source_word: τὸ δαιμόνιον
  choice: бес
  rationale: δαιμόνιον прямо обозначает демоническое существо. «Бес» — точный, понятный и традиционно укоренённый русский эквивалент, не подменяющий его выражением «нечистый дух», которого в данном предложении нет.
theological_decisions:
- issue: Передача языка изгнания беса без смягчения сверхъестественного утверждения
  choice: бес вышел из твоей дочери
  alternative: злой дух покинул твою дочь
  rationale: Греческий текст прямо называет δαιμόνιον и утверждает его выход из дочери. Перевод сохраняет личностную демоническую реальность и пространственный образ исходного текста, не сводя происходящее к болезни или безличному злому влиянию.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формой. «За эти слова» звучит естественнее буквального «за это слово», при этом примечание сохраняет возможную развёрнутую причинную передачу.
