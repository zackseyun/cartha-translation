- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: пройдя посреди земель Десятиградия
  rationale: Сохраняет пространственный смысл необычного выражения ἀνὰ μέσον и передаёт ὅρια как территорию.
