    rationale: διδάσκοντες означает «уча, преподавая». Контекст осуждает содержание такого преподавания, но данная форма не требует приписывать действующим лицам именно акт намеренного введения в заблуждение.
  - severity: low
    issue: Единственное число «учение» сглаживает множественное число διδασκαλίας.
    rationale: Собирательное единственное возможно, но «учения» ближе к форме и к выражению «преподавать ... как учения».
  - severity: medium
    issue: Текст сноски «наставляя учениям — человеческим заповедям» неграмматичен и не даёт ясной альтернативы.
    rationale: Нужно сформулировать допустимое аппозиционное прочтение современным русским языком и сохранить маркер сноски.
