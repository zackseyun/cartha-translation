  verdict: revise
  source_fidelity: 'Основной смысл передан верно: μάτην — «тщетно», σέβονται — «поклоняются», а ἐντάλματα ἀνθρώπων — «человеческие заповеди». Однако «выдавая ... за» вносит оттенок намеренного обмана, которого причастие διδάσκοντες («преподавая/уча») само по себе не выражает. Более прямой перевод сохраняет связь: человеческие заповеди преподаются в качестве учений.'
  naturalness: «Но они тщетно поклоняются Мне» звучит естественно в современном литературном русском и соответствует возвышенному регистру пророческой цитаты. «Преподавая человеческие заповеди как учения» ясно и грамматически естественно; оно точнее, чем «выдавая ... за учение».
  terminology: «Поклоняются», «человеческие заповеди» и «учения» удачно передают религиозный регистр и множественное число διδασκαλίας. Прописное «Мне» допустимо в принятом библейском оформлении. Сноска в черновике содержит неестественную и синтаксически неверную формулировку «наставляя учениям».
  issues:
