  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: ru
  text: Но они тщетно поклоняются Мне, преподавая человеческие заповеди как учения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преподавая учения, то есть человеческие заповеди».'
    reason: Лаконичная греческая конструкция допускает более аппозиционное понимание связи между «учениями» и «человеческими заповедями».
lexical_decisions:
- source_word: μάτην
  choice: тщетно
  rationale: Наречие означает «напрасно, без пользы, без действительного результата». «Тщетно» сохраняет силу пророческого обличения и соответствует возвышенному, но понятному регистру цитаты.
- source_word: δὲ
  choice: но
  rationale: Союз выражает противопоставление предыдущим словам о внешнем почитании при удалённом от Бога сердце.
- source_word: σέβονταί με
  choice: они поклоняются Мне
  rationale: Глагол обозначает благоговейное почитание или поклонение; при обращённости действия к Богу «поклоняются» наиболее точно передаёт религиозный смысл.
- source_word: διδάσκοντες
  choice: выдавая … за учение
  rationale: Причастие описывает то, чем характеризуется это тщетное поклонение. Конструкция «выдавая … за» естественно по-русски передаёт приписывание человеческим предписаниям статуса авторитетного учения.
- source_word: διδασκαλίας
  choice: учение
  rationale: Форма множественного числа в сочетании с ἐντάλματα обозначает учения или доктринальные наставления. Собирательное единственное «учение» естественно в русском и передаёт их заявленный авторитетный статус.
- source_word: ἐντάλματα ἀνθρώπων
  choice: человеческие заповеди
  rationale: Выражение обозначает предписания, исходящие от людей, в противопоставлении Божьей заповеди. Прилагательное «человеческие» ясно передаёт источник и не создаёт ненужного гендерного оттенка.
theological_decisions:
- issue: Соотношение «учений» и «человеческих заповедей» в сжатой греческой конструкции
  choice: выдавая человеческие заповеди за учение
  alternative: наставляя учениям — человеческим заповедям
  rationale: 'Греческий текст допускает тесное аппозиционное прочтение: преподаваемые «учения» в действительности являются человеческими предписаниями. Основной вариант ясно передаёт обличение в том, что человеческим заповедям придаётся статус обязательного учения, не уточняя сверх текста, каким именно образом это происходит.'
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. «Тщетно» несколько возвышенно, но общеупотребительно; прописная буква в «Мне» следует принятому русскому библейскому оформлению местоимения, относящегося к Богу.
