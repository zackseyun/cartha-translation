id: MRK.7.8
reference: Mark 7:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: ru
  text: Оставив заповедь Бога, вы крепко держитесь человеческого предания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: Оставив
  rationale: 'Аористное причастие передаёт действие, логически предшествующее основному: адресаты оставляют Божью заповедь и держатся предания. «Оставив» сохраняет прямоту греческого выражения, не усиливая его до «отвергнув».'
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: заповедь Бога
  rationale: «Заповедь» естественно передаёт религиозно-нормативный смысл ἐντολή, а родительный τοῦ θεοῦ указывает на принадлежность и источник.
- source_word: κρατεῖτε
  choice: крепко держитесь
  rationale: κρατέω здесь означает твёрдо придерживаться чего-либо. Наречие «крепко» сохраняет усиленный оттенок глагола и звучит естественно по-русски.
- source_word: τὴν παράδοσιν
  choice: предания
  rationale: «Предание» — точный и традиционно понятный русский эквивалент παράδοσις в значении унаследованного обычая или учения.
- source_word: τῶν ἀνθρώπων
  choice: человеческого
  rationale: Прилагательное естественно выражает родительный множественного числа и ясно сохраняет противопоставление человеческого источника Божьему, не создавая ошибочного ограничения только мужчинами.
theological_decisions:
- issue: Противопоставление Божьей заповеди и человеческого предания
  choice: 'Сохранено резкое противопоставление: «заповедь Бога» — «человеческое предание».'
  alternative: «предание людей»
  rationale: '«Человеческое предание» по-русски яснее выражает источник предания и противопоставление божественного человеческому. Формулировка не превращает стих в осуждение всякого предания вообще: порицается предание, которому отдают предпочтение перед Божьей заповедью.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, строгая и понятная. Местоимение «вы» передаёт явно выраженное личным окончанием обращение во множественном числе и делает упрёк прозрачным. Синтаксис сохраняет последовательность и риторический контраст оригинала.
