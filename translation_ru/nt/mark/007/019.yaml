lexical_decisions:
- source_word: καρδίαν
  choice: сердце
  rationale: Буквальный эквивалент сохраняет библейское противопоставление внутреннего человека и пищеварительной системы, не сводя «сердце» только к разуму или чувствам.
- source_word: κοιλίαν
  choice: желудок
  rationale: В данном физиологическом контексте это естественное и точное современное обозначение органа пищеварения; «чрево» звучало бы архаично, а «живот» — менее точно.
- source_word: ἀφεδρῶνα
  choice: отхожее место
  rationale: Выражение ясно обозначает место удаления нечистот, сохраняет достоинство стиля и не предполагает современного устройства канализации.
- source_word: καθαρίζων
  choice: тем самым очищая
  rationale: Причастная конструкция передана прямо, без добавления отсутствующего в греческом глагола «объявлять». Формулировка допускает понимание слов как авторского пояснения, а подлинная синтаксическая неоднозначность отмечена в сноске.
- source_word: πάντα τὰ βρώματα
  choice: всякую пищу
  rationale: Собирательное русское выражение естественно передаёт греческое множественное число и охватывает все виды пищи.
- source_word: αὐτοῦ
  choice: человека
  rationale: Греческое местоимение относится к обсуждаемому человеку. В русском «его сердце» без ближайшего однозначного антецедента звучало бы неясно, поэтому референт выражен существительным.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: входит / выходит
  rationale: Сохранён простой контраст движения внутрь и наружу, существенный для аргумента стиха.
theological_decisions:
- issue: Синтаксическая и богословская роль καθαρίζων πάντα τὰ βρώματα
  choice: 'Основной текст передаёт фразу как пояснение к словам Иисуса: «тем самым очищая всякую пищу»'
  alternative: 'Причастие может относиться к пищеварительному процессу: «…выходит в отхожее место, очищая всякую пищу»'
  rationale: Мужской именительный падеж причастия позволяет понимать субъектом Иисуса и видеть здесь пояснение Марка о следствии Его слов, однако связь с непосредственно предшествующим описанием пищеварения также традиционно обсуждается. Поэтому основной текст не усиливает смысл добавлением «объявляя чистой», а альтернативу сохраняет в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной физиологической лексикой и сдержанным, достойным тоном. Местоименный субъект пищи («она») восстановлен по русской грамматике и контексту предыдущего стиха; кавычка показывает завершение прямой речи.
