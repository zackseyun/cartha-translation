lexical_decisions:
- source_word: μοιχεῖαι
  choice: прелюбодеяния
  rationale: Форма множественного числа сохраняет структуру перечня и может указывать на отдельные случаи супружеской неверности.
- source_word: πλεονεξίαι
  choice: алчность
  rationale: Обозначает ненасытное стремление иметь больше, нередко за счёт других; «алчность» ясно и естественно передаёт этот порок.
- source_word: πονηρίαι
  choice: злые дела
  rationale: Греческое множественное число указывает на различные проявления нравственного зла; русское «злые дела» естественнее буквального «злодейства» и сохраняет множественность.
- source_word: δόλος
  choice: обман
  rationale: Передаёт намеренное введение в заблуждение современным и понятным словом.
- source_word: ἀσέλγεια
  choice: распущенность
  rationale: Слово обозначает бесстыдное, необузданное поведение, часто сексуального характера; «распущенность» сохраняет широту значения.
- source_word: ὀφθαλμὸς πονηρός
  choice: завистливый глаз
  rationale: Сохраняет образ «глаза» и одновременно делает понятным идиоматический смысл завистливого или недоброжелательного отношения.
- source_word: βλασφημία
  choice: злословие
  rationale: Греческое слово может обозначать оскорбительную, порочащую речь как о людях, так и о Боге; «злословие» сохраняет широкий речевой смысл, а богословски значимая альтернатива вынесена в сноску.
- source_word: ὑπερηφανία
  choice: высокомерие
  rationale: Точнее нейтрального или иногда положительного русского «гордость» передаёт надменное самовозвышение.
- source_word: ἀφροσύνη
  choice: безрассудство
  rationale: Передаёт нравственную и практическую неразумность, а не недостаток интеллекта как таковой.
theological_decisions:
- issue: Значение βλασφημία в перечне пороков
  choice: злословие
  alternative: богохульство
  rationale: В контексте перечня нравственных пороков естествен широкий смысл вредоносной и оскорбительной речи. Однако слово может особо относиться к хуле на Бога, поэтому эта возможность сохранена в сноске.
- issue: Передача идиомы ὀφθαλμὸς πονηρός
  choice: завистливый глаз
  alternative: дурной глаз; недоброжелательный взгляд
  rationale: Основной текст сохраняет метафору, не сводя выражение только к абстрактной «зависти»; сноска поясняет буквальную форму и диапазон идиоматического значения.
translation_notes:
  register: Современный литературный русский язык; краткий ритмичный перечень пороков. Избегаются архаизмы вроде «лихоимство», «лукавство» и «непотребство». Образность ὀφθαλμὸς πονηρός сохранена с пояснением, а неоднозначность βλασφημία не устранена.
