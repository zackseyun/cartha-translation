  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: ru
  text: прелюбодеяния, алчность, злые дела, обман, распущенность, завистливый глаз[a], злословие[b], высокомерие, безрассудство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «злой глаз»; идиома, обозначающая завистливый или недоброжелательный взгляд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «богохульство». Греческое слово может обозначать как злословие в адрес людей, так и хулу на Бога.'
