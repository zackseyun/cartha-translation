  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: ru
  text: 'Но вы говорите: «Если человек скажет отцу или матери: „Корван“[a] (то есть „дар“[b]) — всё, чем ты мог бы воспользоваться от меня», —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Корван» — обозначение того, что посвящено как дар Богу и потому изъято из обычного семейного пользования.
    reason: cultural_note
  - marker: b
    text: 'Или: «приношение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Но вы говорите
  rationale: δὲ выражает противопоставление предшествующей Божьей заповеди человеческому преданию; настоящее время λέγετε естественно передаётся как общее настоящее.
- source_word: Ἐὰν εἴπῃ
  choice: Если ... скажет
  rationale: Сочетание ἐὰν с аористом сослагательного наклонения вводит возможный случай; по-русски это естественно передаётся будущим временем в условном придаточном.
- source_word: ἄνθρωπος
  choice: человек
  rationale: ἄνθρωπος здесь имеет обобщающее значение; русское «человек» точно и естественно передаёт его без ненужного уточнения пола.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: отцу или матери
  rationale: Дательный падеж обозначает адресатов речи; русская форма без повторения притяжательного местоимения звучит естественно и сохраняет семейную конкретность.
- source_word: Κορβᾶν
  choice: Корван
  rationale: Греческий текст сохраняет семитский религиозный термин и сам далее поясняет его; поэтому термин транслитерирован, а не заменён толкованием.
- source_word: ὅ ἐστιν Δῶρον
  choice: то есть «дар»
  rationale: δῶρον буквально означает «дар» и в данном контексте может обозначать приношение; основной текст сохраняет краткое авторское пояснение Марка, а возможный культовый оттенок отмечен в сноске.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: всё, чем я мог бы помочь тебе
  rationale: Неопределённая относительная конструкция передана словом «всё», а пассивное ὠφεληθῇς — естественным русским выражением о помощи, которую родитель мог бы получить от говорящего.
theological_decisions:
- issue: Передача формулы посвящения Κορβᾶν в контексте дара Богу и человеческого предания
  choice: Сохранить исторический термин «Корван» в основном тексте и вслед за Марком пояснить его как «дар».
  alternative: Перевести непосредственно как «приношение» или «дар, посвящённый Богу».
  rationale: Так сохраняются и семитский термин исходного текста, и данное самим евангелистом пояснение, без внесения в основной текст дополнительных представлений о порядке или последствиях обета.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейским регистром. Порядок реплики сохранён близко к греческому. Конечная запятая и тире показывают, что синтаксическая конструкция продолжается в следующем стихе.
