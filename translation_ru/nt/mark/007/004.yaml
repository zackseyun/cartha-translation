  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: ru
  text: 'И, возвратившись с рынка, они не едят, пока не омоются[a]. Есть и многое другое, что они приняли и соблюдают: омовения чаш, кувшинов, медных сосудов и лож для трапезы[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока не погрузятся в воду». В греческом употреблена форма глагола, часто переводимого как «крестить», но здесь, в контексте обычаев ритуальной чистоты, речь идёт об омовении.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых рукописях слов «и лож для трапезы» нет.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: с рынка
  rationale: ἀγορά обозначает общественное место торговли, рынок; выражение «возвратившись с рынка» естественно передаёт исходную конструкцию с ἀπό.
- source_word: βαπτίσωνται
  choice: не омоются
  rationale: В контексте предписаний о ритуальной чистоте глагол обозначает омовение; возвратная форма передаёт действие над собой и не вносит несвойственных контексту ассоциаций с христианским крещением.
- source_word: παρέλαβον κρατεῖν
  choice: приняли и соблюдают
  rationale: Сочетание говорит о принятых преданиях или установлениях, которых продолжают держаться; перевод передаёт как принятие, так и постоянное соблюдение.
- source_word: βαπτισμοὺς
  choice: омовения
  rationale: Здесь слово обозначает ритуальные омовения предметов; «омовения» сохраняет культовый оттенок, не сужая значение до полного погружения.
- source_word: ξεστῶν
  choice: кувшинов
  rationale: ξέστης — сосуд наподобие кувшина или кружки; «кувшинов» даёт ясный и не чрезмерно узкий русский эквивалент.
- source_word: χαλκίων
  choice: медных сосудов
  rationale: χαλκίον обозначает предмет или сосуд из меди либо медного сплава; «медные сосуды» близко к форме и значению греческого слова.
- source_word: κλινῶν
  choice: обеденных лож
  rationale: κλίνη может означать постель или ложе; в контексте приёма пищи речь, вероятнее всего, идёт о ложах, на которых возлежали за столом.
- source_word: ἄλλα πολλά
  choice: многое другое
  rationale: Перевод сохраняет широкую формулировку оригинала и не уточняет её словом «обычаи» или «предания», отсутствующим в данной фразе.
theological_decisions:
- issue: Значение βαπτίσωνται и βαπτισμοὺς в контексте ритуальной чистоты
  choice: Передать как «омоются» и «омовения».
  alternative: «погрузятся» и «погружения» либо формы со словом «крещение»
  rationale: Контекст описывает фарисейские правила чистоты, а не христианское крещение. Выбранные слова передают ритуальный характер действий, не утверждая, что они обязательно совершались полным погружением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Омоются» и «омовения» естественно обозначают ритуальную чистоту; «приняли и соблюдают» ясно передаёт устойчивое следование полученному преданию. Конечное тире сохранено как знак продолжения пояснительной вставки в более широком предложении.
