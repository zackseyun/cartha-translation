  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: ru
  text: И, придя к себе домой, она увидела, что ребёнок лежит на постели, а бес уже вышел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к греческой конструкции: «...а бес вышел»; буквально: «...и бес — вышедший».'
    reason: Передаёт причастную конструкцию ἐξεληλυθός и её результативный смысл без некорректной русской формы «беса — вышедшим».
lexical_decisions:
- source_word: ἀπελθοῦσα
  choice: придя
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу; русское деепричастие естественно передаёт последовательность, не добавляя значения возвращения.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: к себе домой
  rationale: Передаёт движение в её собственное жилище естественным современным русским выражением.
- source_word: εὗρεν
  choice: увидела
  rationale: В данном повествовательном контексте εὑρίσκω означает, что по прибытии она застала и увидела описанное положение дел; буквальное «нашла» по-русски могло бы неуместно подразумевать поиски.
- source_word: παιδίον
  choice: ребёнок
  rationale: Сохраняет нейтральное обозначение ребёнка в этом стихе; из контекста ясно, что речь идёт о её дочери.
- source_word: βεβλημένον
  choice: лежит
  rationale: Совершенное страдательное причастие описывает наличное положение ребёнка на постели. «Лежит» естественно передаёт результативное состояние, не привнося оттенка насильственного броска.
- source_word: ἐπὶ τὴν κλίνην
  choice: на постели
  rationale: Прямо и естественно передаёт положение ребёнка на ложе.
- source_word: δαιμόνιον
  choice: бес
  rationale: Обычное, понятное и укоренённое в русском библейском языке соответствие δαιμόνιον; оно сохраняет отличие от выражения «нечистый дух» в более широком контексте.
- source_word: ἐξεληλυθός
  choice: уже вышел
  rationale: Перфектное причастие выражает завершившийся выход беса и его последующее отсутствие. «Уже» делает результативность ясной в естественной русской фразе, не добавляя нового события.
theological_decisions:
- issue: Результат изгнания беса
  choice: бес уже вышел
  alternative: бес вышел; беса — вышедшим
  rationale: Формулировка сохраняет утверждение о реальном и завершённом выходе беса, подчёркнутое греческим перфектом, но не уточняет способ или момент изгнания сверх сказанного в тексте.
translation_notes:
  register: 'Современный литературный русский язык с умеренно традиционным библейским словом «бес». Синтаксис сделан ясным для обычного читателя; двоеточие и тяжёлая буквальная конструкция устранены. Формулировка не добавляет, что женщина видела самого беса: она увидела положение ребёнка и обнаружила результат его выхода.'
