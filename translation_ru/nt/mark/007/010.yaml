  - marker: b
    text: 'Буквально греческая юридическая формула: «смертью да умрёт». Возможен также перевод: «тот непременно должен умереть».'
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующими словами Иисуса естественно для современного русского языка.
- source_word: εἶπεν
  choice: сказал
  rationale: Нейтральный глагол речи, уместный при введении цитаты.
- source_word: Τίμα
  choice: почитай
  rationale: Сохраняет повелительную форму и вес заповеди; в данном контексте точнее, чем более узкое «уважай».
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: отца твоего и мать твою
  rationale: Сохраняет явное повторение притяжательного местоимения и узнаваемую форму заповеди, не делая язык архаичным.
- source_word: Ὁ κακολογῶν
  choice: кто злословит
  rationale: Существительное по функции причастие передано обобщающей конструкцией «кто»; «злословит» охватывает речь, направленную во зло, не сводя значение только к формальному проклятию.
- source_word: πατέρα ἢ μητέρα
  choice: отца или мать
  rationale: Следует греческому тексту, в котором во второй цитате нет явного притяжательного местоимения.
- source_word: θανάτῳ τελευτάτω
  choice: тот непременно должен умереть
  rationale: Передаёт усиленную юридическую формулу и обязательную силу греческого императива, не уточняя сверх текста способ исполнения приговора.
theological_decisions:
- issue: Передача юридической формулы θανάτῳ τελευτάτω
  choice: тот непременно должен умереть
  alternative: да будет предан смерти
  rationale: Выбранный вариант сохраняет буквальный образ смерти и торжественную обязательность формулы. Альтернатива яснее выражает судебную казнь, но несколько определённее греческой формы указывает на действие исполнителей приговора.
- issue: Объём значения κακολογῶν
  choice: злословит
  alternative: проклинает
  rationale: «Злословит» сохраняет более широкий диапазон значения — говорить дурное, поносить или проклинать — и не ограничивает его одним видом речевого проступка.
translation_notes:
  register: Современный литературный русский язык с достоинством и узнаваемым звучанием заповеди. Связка «ведь» естественно передаёт аргументативное γὰρ; формулировка наказания сохраняет юридическую торжественность без излишней архаизации.
