base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ru
  text: 'Ведь Моисей сказал: «Почитай отца твоего и мать твою», а также: «Кто злословит[a] отца или мать, тот должен быть предан смерти[b]».'
