  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: ru
  text: К Нему привели глухого, который говорил с трудом[a], и умоляли Его возложить на него руку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «глухого и говорившего с трудом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: привели
  rationale: Характерное для Марка историческое настоящее естественно передано русским прошедшим временем, сохраняющим последовательность повествования.
- source_word: αὐτῷ
  choice: к Нему
  rationale: Дательный падеж обозначает направленность действия к Иисусу; в русском контексте естественно «к Нему».
- source_word: κωφόν
  choice: глухого
  rationale: κωφός здесь обозначает глухоту; последующее μογιλάλον отдельно характеризует нарушение речи, поэтому перевод «глухонемого» смешал бы два признака и усилил смысл.
- source_word: μογιλάλον
  choice: который говорил с трудом
  rationale: Редкое слово обозначает затруднённую, нарушенную речь, а не полную немоту. Описательная конструкция ясна современному читателю.
- source_word: παρακαλοῦσιν
  choice: стали умолять
  rationale: В контексте просьбы об исцелении глагол выражает настойчивую, горячую просьбу; «умолять» передаёт её силу лучше, чем нейтральное «просить». Форма «стали» естественно передаёт переход к следующему действию при историческом настоящем.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: возложить на него руку
  rationale: Оборот передаёт содержание просьбы и сохраняет единственное число χεῖρα. «Возложить руку» — понятное и уместное обозначение жеста исцеления.
theological_decisions:
- issue: Характер нарушения у приведённого человека
  choice: Он был глух и говорил с трудом, но не назван полностью немым.
  alternative: Он был глухонемым.
  rationale: Раздельные определения κωφός и μογιλάλος указывают на глухоту и затруднённую речь. Перевод «немой» или «глухонемой» чрезмерно усилил бы значение μογιλάλος и устранил различие, присутствующее в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой библейской издательской традиции. Описательный оборот избегает устаревшего или неточного «косноязычный».
