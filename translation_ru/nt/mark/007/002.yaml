  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: ru
  text: и увидели, что некоторые из Его учеников едят хлеб нечистыми руками, то есть немытыми —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: увидели
  rationale: Аористное причастие передано личной формой для естественного русского повествования; подразумеваемое подлежащее определяется по контексту стиха 1.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: некоторые из Его учеников
  rationale: 'Сохраняется партитивная конструкция: речь идёт о части учеников Иисуса.'
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание увиденного, а не причину.
- source_word: κοιναῖς χερσίν
  choice: нечистыми руками
  rationale: В контексте иудейских установлений κοινός обозначает ритуально осквернённое, а не просто физически грязное. Буквальное «обычными руками» в современном русском не передаёт этого смысла и вводит читателя в заблуждение.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: то есть немытыми
  rationale: Сохранено авторское пояснение Марка; слово «руками» перенесено после обоих определений, чтобы фраза звучала естественно и связь между ними оставалась ясной.
- source_word: ἐσθίουσιν
  choice: едят
  rationale: Историческое настоящее сохранено настоящим временем, естественным для живого повествования Марка.
- source_word: τοὺς ἄρτους
  choice: хлеб
  rationale: Множественное ἄρτους здесь идиоматически обозначает хлеб как пищу; русское собирательное единственное число звучит естественно.
theological_decisions:
- issue: Оттенок языка ритуальной чистоты в κοινός
  choice: «нечистыми» в основном тексте с пояснением в сноске
  alternative: «осквернёнными»; буквально «обычными»
  rationale: «Нечистыми» ясно обозначает установленную контекстом ритуальную категорию, тогда как «грязными» свело бы смысл к гигиене, а «обычными» без пояснения оказалось бы непонятным. Сноска сохраняет буквальную особенность греческого выражения и предупреждает неверное прочтение.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет незавершённость греческой фразы, продолжающейся в следующем стихе. Заглавное «Его» принято как уважительная русская издательская норма, не добавляющая отдельного толкования.
