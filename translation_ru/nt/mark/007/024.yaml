  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: ru
  text: Оттуда Он встал и пошёл в область Тира[a]. Войдя в дом, Он не хотел, чтобы кто-нибудь узнал о Нём[b], но остаться незамеченным не смог[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на территорию Тира»; греческое слово может обозначать область или территорию, связанную с Тиром, а не только его границу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не хотел, чтобы кто-нибудь узнал»; в греческом не сказано прямо, что именно, но по смыслу речь идёт о Его присутствии или местонахождении.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не смог скрыться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: Оттуда
  rationale: Ἐκεῖθεν обозначает отправную точку движения, а слабое повествовательное δέ естественно не выражать отдельным союзом в современном русском.
- source_word: ἀναστὰς ἀπῆλθεν
  choice: Он встал и пошёл
  rationale: Причастие ἀναστὰς вводит последующее действие; сочетание передано двумя последовательными глаголами, сохраняя конкретность движения и естественность повествования.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: в область Тира
  rationale: ὅρια во множественном числе может обозначать прилегающую территорию или область, а не только пограничную линию.
- source_word: εἰσελθὼν εἰς οἰκίαν
  choice: Войдя в один дом
  rationale: Причастие передаёт последовательность действий; отсутствие артикля у οἰκίαν указывает на неопределённый дом, что по-русски естественно выражается словом «один».
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: Он не хотел, чтобы кто-нибудь узнал о Нём
  rationale: В греческом объект γνῶναι не выражен и подразумевает присутствие или местонахождение Иисуса. «О Нём» делает фразу естественной, не уточняя сверх текста, что именно должны были узнать.
- source_word: οὐκ ἠδυνήθη λαθεῖν
  choice: остаться незамеченным не смог
  rationale: λανθάνω означает ускользать от внимания, оставаться незамеченным; выбранная формулировка передаёт безлично-пассивный результат естественным русским языком.
