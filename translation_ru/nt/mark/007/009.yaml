lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Греческий имперфект передаёт продолжающуюся или повторявшуюся речь; русская форма несовершенного вида сохраняет этот аспект естественно.
- source_word: Καλῶς
  choice: ловко
  rationale: В контексте наречие употреблено иронически. «Ловко» передаёт язвительный упрёк и не звучит как искреннее одобрение.
- source_word: ἀθετεῖτε
  choice: отменяете
  rationale: Глагол означает отвергать, устранять действие или лишать силы. «Отменяете» ясно выражает сознательное устранение Божьей заповеди и образует контраст с «соблюсти».
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: заповедь Бога
  rationale: «Заповедь» сохраняет религиозный и властный смысл ἐντολή, а зависимый родительный оборот прямо передаёт τοῦ θεοῦ.
- source_word: ἵνα
  choice: чтобы
  rationale: 'Союз естественно передаёт целевое значение: Божью заповедь отменяют ради сохранения собственного предания.'
- source_word: τὴν παράδοσιν ὑμῶν
  choice: своё предание
  rationale: «Предание» точно обозначает переданную традицию в религиозном споре; возвратное «своё» естественно соотносит её с подлежащим «вы» и сохраняет противопоставление Божьей заповеди.
- source_word: τηρήσητε
  choice: соблюсти
  rationale: Глагол означает хранить или соблюдать. «Соблюсти» подходит к религиозному преданию и подчёркивает контраст с «отменяете».
theological_decisions:
- issue: Тон слов Иисуса
  choice: Иронический упрёк, переданный словом «ловко»
  alternative: Буквальное «хорошо» как возможное на слух одобрение
  rationale: Контекст противопоставляет человеческое предание Божьей заповеди, поэтому καλῶς является не похвалой, а резкой иронией. Перевод сохраняет тон, не превращая высказывание в прямое одобрение.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным звучанием. «Ловко» делает иронию доступной обычному читателю; восклицательный знак поддерживает обличительный тон. Форма «говорил» сохраняет длительность греческого имперфекта.
