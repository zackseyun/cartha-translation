  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: ru
  text: 'Он сказал им: «Что вы хотите, чтобы Я сделал для вас?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Он
  rationale: 'Артикль с δέ идиоматически продолжает повествование и обозначает уже известного деятеля. В русском отдельный союз не требуется: нулевой переход звучит естественно и не придаёт δέ лишнего противительного оттенка.'
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Сохранён обычный смысл λέγω — «сказать»; вопросительная форма реплики сама показывает, что это вопрос. Дательный αὐτοῖς прямо передан как «им», без добавления «обоим», которого в греческом тексте нет.
- source_word: Τί θέλετε
  choice: Что вы хотите
  rationale: Прямая и естественная передача вопросительного τί и глагола желания θέλω в современном литературном русском.
- source_word: ποιήσω
  choice: чтобы Я сделал
  rationale: Аорист конъюнктива после θέλετε обозначает желаемое действие говорящего. Русская конструкция «хотите, чтобы Я сделал» естественно передаёт синтаксическую связь; «сделал» здесь точнее контекстуального «сотворил».
- source_word: ὑμῖν
  choice: для вас
  rationale: 'Дательный имеет бенефактивное значение: речь идёт о действии в их пользу или по их просьбе. «Для вас» яснее передаёт это значение, чем буквальное «вам».'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; реплика передана просто, непосредственно и с достоинством. Местоимение «Я» в прямой речи написано с прописной буквы по принятой русской библейской издательской традиции, без изменения смысла исходного текста.
