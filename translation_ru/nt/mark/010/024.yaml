  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: ru
  text: 'Ученики же изумлялись Его словам. А Иисус снова ответил им[a]: «Дети, как трудно войти в Царство Божье!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Дети, как трудно тем, кто надеется на богатство, войти в Царство Божье!»'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: изумлялись
  rationale: Имперфект передаёт продолжавшуюся реакцию, а «изумлялись» сохраняет силу глагола и естественно звучит в современном русском языке.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: Его словам
  rationale: Предлог ἐπί с дательным указывает на предмет или основание изумления; конструкция «изумлялись Его словам» кратка и близка к греческому тексту.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторное обращение Иисуса и сохраняет последовательность повествования.
- source_word: ἀποκριθεὶς λέγει
  choice: сказал им
  rationale: Буквальное удвоение «ответив, говорит» в современном русском звучало бы тяжеловесно. В контексте «снова сказал» естественно передаёт возобновлённый ответ Иисуса.
- source_word: Τέκνα
  choice: Дети
  rationale: Сохраняет тёплое семейное обращение без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: πῶς δύσκολόν ἐστιν
  choice: как трудно
  rationale: Восклицательная конструкция с πῶς усиливает утверждение; «как трудно» естественно передаёт эту силу.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: войти в Царство Божье
  rationale: Ясная и естественная русская конструкция, точно передающая направленность действия и традиционное библейское понятие.
theological_decisions:
- issue: Включать ли более пространное чтение о надеющихся на богатство
  choice: 'В основном тексте следовать краткому чтению SBLGNT: «как трудно войти в Царство Божье»'
  alternative: «Дети, как трудно надеющимся на богатство войти в Царство Божье»
  rationale: Краткое чтение дано в исходном греческом тексте и сохраняет широкое, напряжённое утверждение Иисуса. Более пространное чтение сужает его смысл, поэтому отмечено как значимый текстовый вариант в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис сделан естественным без утраты повествовательного контраста; прописные буквы в «Царство Божье» соответствуют принятому русскому библейскому употреблению.
