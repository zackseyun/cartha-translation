  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: ru
  text: И будут насмехаться над Ним, плевать на Него, бичевать Его и убьют Его, и после трёх дней Он воскреснет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В других местах время воскресения выражено словами «на третий день». Здесь у Марка буквально: «после трёх дней».'
    reason: Уточнение временной формулы оригинала и сохранение различия с параллельными выражениями.
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: будут насмехаться
  rationale: Передаёт враждебное осмеяние и презрение естественным современным русским выражением.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: плевать на Него
  rationale: Дательный αὐτῷ обозначает направленность унизительного действия; по-русски естественно «плевать на Него».
- source_word: μαστιγώσουσιν
  choice: бичевать
  rationale: Точно передаёт жестокое телесное наказание; слово понятно в литературном и библейском регистре и конкретнее общего «бить».
- source_word: ἀποκτενοῦσιν
  choice: убьют
  rationale: Прямо передаёт значение глагола, не добавляя юридического оттенка «предадут смерти» или моральной квалификации.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: через три дня
  rationale: Естественное русское обозначение срока, соответствующее μετά с винительным в значении «после трёх дней»; формулу Марка не следует молча заменять выражением «на третий день».
- source_word: ἀναστήσεται
  choice: воскреснет
  rationale: Будущая средняя форма естественно передаётся непереходным русским глаголом «воскреснет», без внесения пассивного «будет воскрешён» и без добавления отсутствующего в греческом «снова».
theological_decisions:
- issue: Формулировка воскресения
  choice: Он воскреснет
  alternative: Он будет воскрешён
  rationale: Форма ἀναστήσεται поддерживает непереходное выражение. Оно сохраняет формулировку данного стиха, не отрицая других новозаветных текстов, где говорится, что Иисуса воскресил Отец.
- issue: Указание времени воскресения
  choice: через три дня
  alternative: на третий день
  rationale: Основной текст сохраняет буквальную временную формулу Марка μετὰ τρεῖς ἡμέρας и не гармонизирует её молча с формулировкой параллельных мест.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксический ряд сохранён, но повторение местоимений оформлено естественно для русского языка. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции.
