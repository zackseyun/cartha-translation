source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ru
  text: 'Иисус, взглянув на него, полюбил его и сказал ему: «Одного тебе недостаёт: пойди, продай всё, что имеешь,[a] и раздай бедным — и будет у тебя сокровище на небе. Иди за Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продай, что имеешь». Греческое выражение ὅσα ἔχεις в данном контексте охватывает всё его имущество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: пристально посмотрел на него
  rationale: Причастие обозначает направленный, внимательный взгляд; «пристально посмотрел» естественно передаёт эту силу, не превращая её в толкование внутренних чувств.
- source_word: ἠγάπησεν αὐτόν
  choice: полюбил его
  rationale: Прямо передаёт аорист ἀγαπάω и сохраняет явно выраженную любовь Иисуса без ослабления или догматической конкретизации.
- source_word: Ἕν σε ὑστερεῖ
  choice: Одного тебе недостаёт
  rationale: Субстантивированное среднее числительное естественно передаётся русским «одного»; конструкция сохраняет прямоту обращения.
- source_word: ὕπαγε
  choice: пойди
  rationale: Обычный повелительный призыв удалиться и исполнить поручение; «пойди» естественно в русском контексте.
- source_word: ὅσα ἔχεις
  choice: всё, что имеешь
  rationale: Выражение допускает передачу «что имеешь» или «всё, что имеешь»; контекст указывает на полный охват имущества, а выбранный вариант ясно и естественно выражает это.
- source_word: πώλησον
  choice: продай
  rationale: Прямой эквивалент повелительной формы с обычным торговым значением.
- source_word: δὸς τοῖς πτωχοῖς
  choice: раздай бедным
  rationale: Русское «раздай» естественно сочетается с выручкой от продажи и множественным адресатом; «бедным» точно передаёт субстантивированное πτωχοῖς.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: сокровище на небе
  rationale: Устойчивое и точное русское выражение, сохраняющее единственное число и небесную локализацию.
- source_word: δεῦρο
  choice: потом приходи
  rationale: «Приходи» естественно передаёт призыв двигаться к говорящему; «потом» раскрывает последовательность после исполнения предыдущих повелений, выраженную порядком команд, не меняя их содержания.
- source_word: ἀκολούθει μοι
  choice: следуй за Мной
  rationale: Настоящее повелительное выражает продолжающееся следование и ученичество; русский несовершенный вид «следуй» хорошо сохраняет этот оттенок.
theological_decisions:
- issue: Характер любви Иисуса к человеку
  choice: полюбил его
  alternative: отнёсся к нему с любовью; проявил к нему любовь
  rationale: Текст прямо утверждает ἠγάπησεν αὐτόν. Перевод сохраняет подлинность любви и возникающее повествовательное напряжение, не сводя её к доброжелательности и не определяя её в терминах позднейшей догматической системы.
- issue: Объём повеления относительно имущества
  choice: продай всё, что имеешь
  alternative: продай, что имеешь
  rationale: ὅσα ἔχεις формально допускает оба варианта, но в данном контексте имеет всеохватный смысл. Перевод не смягчает требование до общего призыва к щедрости.
- issue: Связь небесного сокровища с повелением
  choice: и будет у тебя сокровище на небе
  alternative: тем самым ты заслужишь спасение
  rationale: Перевод сохраняет сформулированное в тексте обещание, но не отождествляет «сокровище» с какой-либо более узкой сотериологической схемой.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступной библейской интонацией. Обращение к Иисусу передано прописной буквой в местоимении «Мной» по принятой русской религиозно-литературной норме. Краткие повеления сохранены, а пунктуация подчёркивает последовательность требования, обещания и призыва.
