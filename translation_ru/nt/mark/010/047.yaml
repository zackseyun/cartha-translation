lexical_decisions:
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство аористного причастия и сохраняет последовательность действий.
- source_word: Ναζαρηνός
  choice: Назарянин
  rationale: Передаёт греческое эпитетное обозначение, а не разворачивает его в более явное географическое выражение «из Назарета».
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: начал кричать
  rationale: «Начал» сохраняет начинательное значение конструкции. В русском вводимое прямой речью «кричать» естественно выражает также λέγειν без тяжеловесного «кричать и говорить».
- source_word: Υἱὲ Δαυὶδ
  choice: Сын Давида
  rationale: Буквально сохраняет форму обращения и его царско-мессианское звучание.
- source_word: ἐλέησόν με
  choice: помилуй меня
  rationale: Краткое и весомое прошение, точно передающее повелительную форму ἐλεέω и сохраняющее библейскую выразительность.
- source_word: Ἰησοῦ
  choice: Иисус
  rationale: Использована общепринятая русская форма имени; звательная функция передаётся обращением.
theological_decisions:
- issue: Мессианский смысл обращения «Сын Давида»
  choice: Сохранить «Сын Давида» как обращённый к Иисусу титул.
  alternative: Передать как «потомок Давида».
  rationale: В повествовании Марка выражение имеет царско-мессианский оттенок; обобщённая генеалогическая передача ослабила бы его.
- issue: Передача Ναζαρηνός
  choice: Назарянин
  alternative: Иисус из Назарета
  rationale: Греческий текст использует эпитет Ναζαρηνός. Основной текст сохраняет эту форму, а понятный географический вариант приводится в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сделан естественным для устного повествования; срочность просьбы передана глаголом «кричать», а традиционно узнаваемые «Сын Давида» и «помилуй меня» сохранены без конфессионального уточнения.
