  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: ru
  text: 'Они ответили Ему: «Можем[a]». Но Иисус сказал им: «Чашу, которую Я пью, будете пить и вы; и крещением, которым Я крещусь[b], будете крещены и вы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы можем».'
    reason: lexical_alternative
  - marker: b
    text: «Чаша» и «крещение» здесь образно обозначают предстоящие Иисусу страдания и участь, которые разделят и Его ученики.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Можем
  rationale: Кратко и естественно передаёт настоящее время δύναμαι и уверенный ответ учеников; подразумеваемое «мы» ясно из формы глагола.
- source_word: ποτήριον
  choice: чашу
  rationale: Сохраняет библейский образ предназначенной доли или участи, не подменяя метафору её толкованием.
- source_word: πίνω / πίεσθε
  choice: Я пью / будете пить и вы
  rationale: Передаёт настоящее и будущее время и сохраняет словесный параллелизм; добавление «и вы» естественно выражает сопоставление, заложенное в формах первого и второго лица.
- source_word: βάπτισμα
  choice: крещением
  rationale: Сохраняет обычное значение термина и метафорический образ, не сводя его непосредственно к «страданию» или «испытанию».
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: Я крещусь / будете крещены
  rationale: Сохраняет однокоренную связь с «крещением» и отражает пассивную форму будущего βαπτισθήσεσθε.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Но Иисус сказал им
  rationale: «Но» передаёт лёгкое противопоставление между уверенным ответом учеников и последующим утверждением Иисуса.
theological_decisions:
- issue: Метафорический смысл чаши и крещения
  choice: Обе метафоры сохранены в основном тексте; пояснение об их связи со страданием и участью дано в сноске.
  alternative: Заменить образы прямыми словами «страдание», «смерть» или «мученичество».
  rationale: Греческий текст намеренно использует насыщенные библейскими ассоциациями образы; прямое истолкование в основном тексте сузило бы их смысл.
- issue: Связь βάπτισμα с обрядовым крещением
  choice: Использовано слово «крещение», при этом контекст и сноска указывают на метафорическое употребление.
  alternative: Перевести как «погружение» или «испытание», чтобы исключить обрядовое прочтение.
  rationale: Лексическая форма и повтор однокоренных слов важны для текста; вместе с тем перевод не утверждает, что здесь непосредственно говорится о таинстве или обряде.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены краткость диалога, параллелизм двух образов и однокоренной повтор «крещением — крещусь — крещены». Местоимение «Ему» и «Я» оформлены по распространённой русской библейской издательской традиции.
