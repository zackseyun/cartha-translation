source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: ru
  text: И кто захочет быть первым среди вас, будет рабом всех.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугой всех». Греческое слово δοῦλος сильнее слова διάκονος («слуга»), употреблённого в предыдущем стихе; «раб» сохраняет это усиление.'
    reason: Указывает возможный более мягкий перевод и объясняет значимый лексический контраст с предыдущим стихом.
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: кто захочет
  rationale: Сочетание относительного местоимения с ἄν и сослагательным наклонением выражает общее неопределённое условие; «кто захочет» естественно передаёт и неопределённость, и волевой смысл θέλω.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В контексте положения внутри группы выражение обозначает место в кругу учеников, а не просто физическое нахождение.
- source_word: πρῶτος
  choice: первым
  rationale: Прямо передаёт первенство по положению и сохраняет связь с темой величия и старшинства в контексте.
- source_word: ἔσται
  choice: будет
  rationale: Сохраняет форму будущего времени греческого текста, не заменяя её истолковывающим «должен быть».
- source_word: πάντων
  choice: всех
  rationale: Родительный падеж при «рабом» передаёт подчинённость всем и сохраняет универсальный охват.
- source_word: δοῦλος
  choice: рабом
  rationale: «Раб» передаёт более сильное значение δοῦλος и сохраняет усиление по сравнению с διάκονος («слуга») в предыдущем стихе.
theological_decisions:
- issue: Передача δοῦλος в наставлении об ученичестве
  choice: рабом
  alternative: слугой
  rationale: В стихе 43 употреблено διάκονος, а здесь — более сильное δοῦλος. «Рабом» сохраняет резкое требование полного самоумаления и не сглаживает контраст между двумя греческими словами.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная формулировка сохраняет параллелизм изречения. «Рабом» намеренно звучит сильнее, чем «слугой», в соответствии с греческим текстом и ближайшим контекстом.
