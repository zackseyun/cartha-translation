id: MRK.10.46
reference: Mark 10:46
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: ru
  text: Они пришли в Иерихон.[a] Когда он выходил из Иерихона вместе со своими учениками и многочисленной толпой,[b] у дороги[c] сидел слепой нищий Вартимей, сын Тимея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приходят в Иерихон». Повествовательное настоящее часто встречается у Марка; здесь оно передано русским прошедшим временем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «довольно большой толпой».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на обочине дороги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: пришли
  rationale: В греческом употреблено повествовательное настоящее («приходят»), но в современном русском повествовании здесь естественнее прошедшее время; последовательность событий сохраняется.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: когда он выходил
  rationale: Генитив абсолютный обозначает действие, одновременное с описываемой далее сценой; форма несовершенного вида передаёт его протяжённость.
- source_word: ὄχλου ἱκανοῦ
  choice: многочисленной толпой
  rationale: ἱκανός указывает здесь на значительный размер толпы. «Многочисленная» звучит естественно и не усиливает смысл сверх исходного текста.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Вартимей, сын Тимея
  rationale: Сохранены и семитское имя, и данное Марком пояснение; русский порядок приложения обеспечивает ясность.
- source_word: τυφλὸς προσαίτης
  choice: слепой нищий
  rationale: Прямой, понятный перевод обоих определений без смягчения или стилистического усложнения.
- source_word: παρὰ τὴν ὁδόν
  choice: у дороги
  rationale: Оборот обозначает место рядом с дорогой; «у дороги» кратко и естественно в современном русском языке.
- source_word: Ἰεριχώ
  choice: Иерихон
  rationale: Устоявшаяся русская форма географического названия.
theological_decisions:
- issue: Обозначение Вартимея
  choice: Сохранить в основном тексте и имя «Вартимей», и пояснение «сын Тимея».
  alternative: Оставить только имя либо только его пояснение.
  rationale: Обе части присутствуют в греческом тексте и отражают намеренное пояснение Марка; устранение одной из них неоправданно сокращало бы исходный текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно нейтральной современной орфографической норме. Синтаксис упрощён лишь настолько, чтобы длинная греческая конструкция оставалась ясной, при этом одновременность действий и все участники сцены сохранены.
