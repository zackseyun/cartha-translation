  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: ru
  text: По этой причине мужчина оставит отца и мать и соединится со своей женой,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прилепится к своей жене». Греческий глагол может подчёркивать тесную привязанность.'
