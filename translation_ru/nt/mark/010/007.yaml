    reason: textual_variant
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Поэтому
  rationale: Естественно и точно передаёт причинно-следственную связь вводного выражения.
- source_word: καταλείψει
  choice: оставит
  rationale: Будущее время и основной смысл ухода из родительского дома переданы прямо, без усиленного оттенка «покинет навсегда» или «бросит».
- source_word: ἄνθρωπος
  choice: мужчина
  rationale: Хотя слово может обозначать человека вообще, упоминание «его жены» и контекст брака указывают здесь именно на мужчину.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: отца и мать
  rationale: 'В русском языке притяжательное местоимение можно естественно не повторять: принадлежность ясно определяется подлежащим и дальнейшим «своей женой».'
- source_word: προσκολληθήσεται
  choice: соединится
  rationale: Передаёт тесную брачную связь и медиально-пассивную форму будущего времени; буквальный оттенок крепкой привязанности отмечен в сноске.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: со своей женой
  rationale: В брачном контексте γυνή означает «жена»; русское управление «соединиться с» требует творительного падежа, а «своей» однозначно соотносит жену с подлежащим.
theological_decisions:
- issue: Гендерно конкретный язык в цитате о браке
  choice: мужчина… со своей женой
  alternative: человек… со своим супругом
  rationale: Контекст представляет именно мужчину и его жену; обобщение сделало бы исходную гендерную конкретность менее ясной.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Поэтому» звучит естественнее тяжеловесного «по этой причине», а «соединится» сохраняет брачный смысл без конфессионально специфической терминологии.
