id: MRK.10.29
reference: Mark 10:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: ru
  text: 'Иисус сказал: «Истинно говорю вам: нет никого, кто оставил дом, или братьев, или сестёр, или мать, или отца, или детей, или поля ради Меня и ради Евангелия,»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη ὁ Ἰησοῦς
  choice: Иисус сказал
  rationale: Прямо и естественно передаёт вводящую речь формулу, не добавляя оттенка ответа или торжественного провозглашения.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Сохраняет торжественную формулу синоптического речения и звучит естественно в современном литературном русском.
- source_word: οὐδείς ἐστιν ὃς
  choice: нет никого, кто
  rationale: Идиоматично передаёт греческую конструкцию существования с всеобщим отрицанием.
- source_word: ἀφῆκεν
  choice: оставил
  rationale: Передаёт совершившееся оставление без более сильного значения отречения или безответственного отказа от близких.
- source_word: οἰκίαν
  choice: дом
  rationale: Наиболее прямое и конкретное соответствие; не сужает значение до семьи как домочадцев.
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: братьев, или сестёр
  rationale: Сохраняет отдельное упоминание братьев и сестёр в исходном перечне.
- source_word: μητέρα ἢ πατέρα
  choice: мать, или отца
  rationale: Прямо передаёт засвидетельствованный SBLGNT порядок членов семьи.
- source_word: τέκνα
  choice: детей
  rationale: Естественный общий термин для потомства без указания пола.
- source_word: ἀγρούς
  choice: поля
  rationale: Конкретно передаёт участки возделываемой земли, не расширяя значение до любой собственности.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: ради Меня и ради Евангелия
  rationale: Повтор «ради» сохраняет параллелизм и две явно названные причины оставления.
theological_decisions:
- issue: Не преувеличить характер оставления семьи и имущества
  choice: оставил дом… братьев… детей… поля
  alternative: покинул / бросил / отрёкся от
  rationale: «Оставил» сохраняет напряжённость призыва к ученичеству, но не приписывает тексту безответственное отвержение семейных обязанностей.
- issue: Связь поступка с Иисусом и Евангелием
  choice: ради Меня и ради Евангелия
  alternative: ради Меня, то есть ради Евангелия
  rationale: Союз καί сохранён без истолковывающего отождествления двух формулировок.
translation_notes:
  register: Современный литературный русский с достоинством библейского речения. Сохранены перечислительная структура, торжественное «Истинно говорю вам» и незавершённость предложения, продолжающегося в следующем стихе. Местоимение «Меня» написано с прописной буквы согласно распространённой русской библейской издательской норме.
