  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: ru
  text: «Вот, мы поднимаемся в Иерусалим, и Сын Человеческий будет передан[a] первосвященникам и книжникам; они осудят его на смерть и передадут язычникам[b].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдан»; тот же греческий глагол ниже переведён словом «передадут».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народам», то есть неевреям.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: передано началом прямой речи без отдельного слова
  rationale: ὅτι вводит содержание слов Иисуса в продолжение предыдущего стиха. В современном русском эту функцию естественно выполняют кавычки; перевод «что» внутри данного стиха был бы синтаксически неестественным.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет функцию привлечения внимания и звучит естественно в современном литературном русском.
- source_word: ἀναβαίνομεν
  choice: мы поднимаемся
  rationale: Передаёт настоящее время и движение вверх к Иерусалиму, сохраняя географический оттенок без архаичного «восходим».
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Обычное русское обозначение направления движения к городу.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшийся буквальный перевод самообозначения, сохраняющий его библейские и христологические связи.
- source_word: παραδοθήσεται
  choice: будет передан
  rationale: Пассивная форма обозначает передачу во власть других. «Передан» сохраняет широкий смысл и не сужает его до предательства.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: первосвященникам
  rationale: Устоявшееся обозначение группы высших священнических руководителей.
- source_word: τοῖς γραμματεῦσιν
  choice: книжникам
  rationale: Прямой и традиционно понятный эквивалент, не разворачивающий термин в толкование «учителя закона».
- source_word: κατακρινοῦσιν
  choice: осудят
  rationale: Передаёт официальный обвинительный приговор и сохраняет судебный вес глагола.
- source_word: θανάτῳ
  choice: на смерть
  rationale: Естественное русское дополнение в сочетании «осудить на смерть».
- source_word: παραδώσουσιν
  choice: передадут
  rationale: Повтор того же русского корня сохраняет повторение παραδίδωμι и последовательность передачи Иисуса из рук в руки.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В контексте страстей речь идёт о нееврейских властях; «язычникам» передаёт историческое противопоставление точнее, чем отвлечённое «народам».
theological_decisions:
- issue: Перевод ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек
  rationale: Буквальное традиционное выражение сохраняет самообозначение Иисуса и связь с ветхозаветным образом, не устраняя богословскую многозначность.
- issue: Перевод τοῖς ἔθνεσιν
  choice: язычникам
  alternative: народам
  rationale: Непосредственный контекст указывает на передачу от иудейских руководителей нееврейским властям; вариант «язычникам» сохраняет это историческое различие.
- issue: Перевод παραδίδωμι
  choice: передан / передадут
  alternative: предан / предадут
  rationale: «Передать» сохраняет значение отдачи во власть и не навязывает более узкий смысл личного предательства, хотя контекстуально он может присутствовать.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Поднимаемся» естественнее архаичного «восходим», но сохраняет движение вверх. Местоимение «его» дано со строчной буквы согласно общим нормам современного русского текста; синтаксическая связь ὅτι с предыдущим стихом передана оформлением прямой речи.
