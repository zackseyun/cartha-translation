  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: ru
  text: Итак, пусть человек[a] не разлучает то, что соединил Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ни один человек. В греческом тексте слово «человек» стоит в единственном числе и употреблено в обобщающем смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: что … того
  rationale: Относительное местоимение среднего рода относится к созданному брачному союзу как к единому целому. Соотносительная конструкция «что … того» естественна для русского языка и сохраняет объектную функцию местоимения.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующих слов о Божьем замысле относительно брака.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое соответствие подлежащему; в русском языке в таком употреблении артикль не передаётся.
- source_word: συνέζευξεν
  choice: соединил
  rationale: Глагол обозначает соединение двоих, буквально также связывание в одну упряжь. «Соединил» ясно и естественно передаёт совершённое Богом действие без излишнего подчёркивания образа ярма.
- source_word: ἄνθρωπος
  choice: человек
  rationale: 'Единственное число имеет обобщающее значение: речь идёт о любом человеке, а не только о мужчине. Русское «человек» сохраняет и форму единственного числа, и широкий смысл.'
- source_word: μὴ χωριζέτω
  choice: пусть не разлучает
  rationale: Отрицательное повеление в третьем лице передано современной и вместе с тем достойной конструкцией. «Разлучает» особенно уместно в контексте брака и передаёт действие, противоположное соединению.
theological_decisions:
- issue: Обобщающее значение ἄνθρωπος в изречении о браке
  choice: «человек» с пояснением об обобщающем смысле
  alternative: «никто» / «ни один человек»
  rationale: Исходный текст употребляет существительное в единственном числе, но запрещает разлучать супругов любому человеку. Основной текст сохраняет форму оригинала, а примечание предотвращает ошибочное понимание как указания только на мужчину.
- issue: Характер Божьего действия в брачном союзе
  choice: «что Бог соединил»
  alternative: «кого Бог соединил» / «что Бог сочетал»
  rationale: Средний род ὃ представляет брачный союз как созданное Богом единство, не сводя высказывание лишь к обозначению двух лиц. «Соединил» сохраняет эту смысловую напряжённость и звучит естественно в современном русском языке.
translation_notes:
  register: Современный литературный русский язык с достойным, афористичным звучанием. Конструкция «пусть не разлучает» предпочтена более архаичному «да не разлучает»; узнаваемая библейская краткость при этом сохранена.
