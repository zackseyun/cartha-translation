id: MRK.10.5
reference: Mark 10:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: ru
  text: 'Но Иисус сказал им: «Из-за вашего жестокосердия[a] он[b] написал вам эту заповедь[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «черствости вашего сердца».'
    reason: lexical_alternative
  - marker: b
    text: То есть Моисей, упомянутый в предыдущем стихе.
    reason: cross_reference
  - marker: c
    text: 'Или: «это повеление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: 'Передаёт лёгкое противопоставление: Иисус отвечает на ссылку собеседников на Моисея.'
- source_word: Πρὸς
  choice: Из-за
  rationale: 'В сочетании с винительным падежом выражает основание или причину: предписание было дано ввиду состояния людей.'
- source_word: σκληροκαρδίαν
  choice: жестокосердия
  rationale: Сохраняет образ сердца и нравственный смысл греческого сложного слова, не сводя его просто к упрямству.
- source_word: ἔγραψεν
  choice: он написал
  rationale: В греческом подлежащее не названо прямо и определяется из предыдущего стиха; местоименная форма сохраняет связность оригинала.
- source_word: ἐντολήν
  choice: заповедь
  rationale: Передаёт авторитетное предписание и соответствует правовому и религиозному контексту речи о Моисеевом установлении.
- source_word: ταύτην
  choice: эту
  rationale: Указывает на конкретное предписание, обсуждаемое в предшествующем стихе.
theological_decisions:
- issue: Следует ли прямо назвать Моисея субъектом глагола «написал»
  choice: 'Сохранить не названный прямо субъект: «он»'
  alternative: «Моисей написал»
  rationale: Греческий текст не повторяет имени Моисея; референт ясен из предыдущего стиха. Это позволяет не вносить отсутствующее в оригинале дополнительное ударение.
- issue: Как передать σκληροκαρδίαν, не ослабляя библейский образ
  choice: «жестокосердие»
  alternative: «упрямство» или «черствость сердца»
  rationale: Выбранное слово сохраняет образ сердца и нравственно-духовную напряжённость выражения, не навязывая узкоконфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Жестокосердие» сохраняет исходную метафору, а синтаксис остаётся ясным для обычного читателя.
