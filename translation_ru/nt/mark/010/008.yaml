  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: ru
  text: И двое станут одной плотью. Итак, они уже не двое, но одна плоть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται ... εἰς
  choice: станут
  rationale: Сочетание εἰμί с εἰς и винительным обозначает итог соединения; по-русски естественно передать его глаголом «станут».
- source_word: οἱ δύο
  choice: двое
  rationale: Субстантивированное числительное сохраняет подчёркнутую двойственность и естественно соотносится с последующим «не двое».
- source_word: εἰς σάρκα μίαν
  choice: одной плотью
  rationale: Творительный предикативный после «станут» естественно передаёт результирующее состояние; «одна плоть» сохраняет связь с Быт 2:24.
- source_word: ὥστε
  choice: так что
  rationale: Передаёт вывод или следствие из предшествующей цитаты без излишне формального оттенка.
- source_word: οὐκέτι
  choice: уже не
  rationale: Обычная современная русская передача прекращения прежнего состояния.
- source_word: ἀλλὰ μία σάρξ
  choice: но одна плоть
  rationale: Сохраняет прямое противопоставление двух и одного, а также библейское выражение без толковательного расширения.
theological_decisions:
- issue: Значение выражения «одна плоть» в цитате из Бытия
  choice: Сохранить выражение «одна плоть» без поясняющего расширения.
  alternative: одно тело; один человек; соединены половым союзом
  rationale: Греческий текст не сужает значение выражения до одного аспекта. Буквальная библейская формула сохраняет его антропологическую и брачную многозначность и межтекстовую связь.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Союз «и» в начале сохранён как продолжение предшествующей цитаты. Порядок слов во второй фразе поддерживает контраст «не двое, но одна плоть».
