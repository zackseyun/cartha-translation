  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: ru
  text: 'Он сказал ему: «Учитель, всё это я соблюдаю с юности».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: сказал
  rationale: Обычный глагол речи; «сказал» естественно передаёт повествовательную формулу без добавления значения ответа, которого сам глагол не требует.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Форма обращения от διδάσκαλος прямо обозначает того, кто учит; «Учитель» сохраняет основной смысл без усиления оттенка власти.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Естественное русское соответствие сочетанию указательного местоимения с πᾶς; по контексту речь идёт обо всех только что названных заповедях.
- source_word: ἐφυλαξάμην
  choice: соблюдаю
  rationale: В контексте заповедей φυλάσσω означает «соблюдать». Настоящее время по-русски в сочетании «с юности» естественно выражает действие, начавшееся в прошлом и продолжающееся до момента речи.
- source_word: ἐκ νεότητός μου
  choice: с юности
  rationale: Передаёт временную исходную точку и не сужает νεότης до детства.
- source_word: ὁ δὲ
  choice: Он
  rationale: δέ здесь служит мягкой повествовательной связкой. В отдельном русском стихе нулевое соответствие позволяет избежать неуместного усиления через «но» и тяжеловесного «и».
theological_decisions:
- issue: Характер утверждения о соблюдении заповедей
  choice: Передать заявление прямо, не оценивая его истинность
  alternative: Добавить оттенок притязания или заявить о совершенном исполнении
  rationale: Греческий текст сообщает слова человека без явной авторской оценки в пределах этого стиха; перевод не должен заранее разрешать богословское напряжение контекста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «С юности» идиоматичнее буквального «от моей юности»; порядок «всё это я соблюдаю» сохраняет смысловой акцент на перечисленных заповедях.
