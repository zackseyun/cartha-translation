source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: ru
  text: 'И, оглядевшись, Иисус говорит своим ученикам: «Как трудно будет тем, у кого есть богатство[a], войти в Царство Божье!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деньги», «имущество».'
    reason: Лексема χρήματα может обозначать деньги, имущество или материальные средства вообще.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: оглядевшись
  rationale: Аористное причастие передаёт взгляд Иисуса вокруг Себя перед речью; деепричастие естественно сохраняет последовательность действий.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для Марка живое историческое настоящее.
- source_word: Πῶς δυσκόλως
  choice: Как трудно
  rationale: Естественно передаёт восклицательное усиление и именно трудность, не превращая её в невозможность.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: тем, у кого есть богатство
  rationale: Сохраняет описательную конструкцию греческого текста и не заменяет её фиксированным социальным обозначением «богатые».
- source_word: χρήματα
  choice: богатство
  rationale: Передаёт материальные средства и имущество шире, чем одни наличные деньги.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшаяся, прозрачная и понятная современному читателю передача выражения о Божьем царствовании и царстве.
- source_word: εἰσελεύσονται
  choice: войти
  rationale: Инфинитив после конструкции «как трудно тем... войти» естественен по-русски; перспектива будущего входа понятна из смысла высказывания без тяжеловесного «будет войти».
theological_decisions:
- issue: Следует ли понимать слова Иисуса как утверждение невозможности спасения для обладающих богатством или как указание на серьёзную трудность
  choice: 'Передано как серьёзная трудность: «Как трудно... войти»'
  alternative: Усилить до практической или абсолютной невозможности
  rationale: Греческое δυσκόλως означает «с трудом», а не «невозможно»; перевод сохраняет напряжённость изречения, не навязывая более сильного богословского вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее «говорит» сохраняет повествовательную живость Марка; «Царство Божье» — ясная современная форма без конфессионального уточнения.
