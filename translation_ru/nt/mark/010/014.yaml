  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ru
  text: 'Но Иисус, увидев это, вознегодовал и сказал им: «Пусть дети приходят ко Мне; не препятствуйте им, потому что Царство Божье принадлежит таким, как они».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ибо Царство Божье — таких».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Увидев это, Иисус
  rationale: Аористное причастие обозначает обстоятельство, вызвавшее реакцию Иисуса; «это» естественно восполняется из контекста. Контраст, выраженный δὲ, в русском достаточно передаётся соположением с предшествующим поступком учеников без обязательного отдельного «но».
- source_word: ἠγανάκτησεν
  choice: вознегодовал
  rationale: Передаёт сильное, нравственно окрашенное возмущение, не сводя его к неконтролируемому гневу.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Пусть дети приходят ко Мне
  rationale: Естественно передаёт повелительное ἄφετε со значением дозволения и инфинитив движения к Иисусу.
- source_word: μὴ κωλύετε αὐτά
  choice: не препятствуйте им
  rationale: Сохраняет образ создания помех и соответствует настоящему императиву с μή.
- source_word: τῶν γὰρ τοιούτων
  choice: потому что ... таким, как они
  rationale: τοιούτων указывает не только на присутствующих детей, но на людей такого рода; формулировка сохраняет представительный смысл.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся, понятное и естественное библейское выражение в современном русском языке.
- source_word: ἐστὶν
  choice: принадлежит
  rationale: Идиоматично раскрывает греческую конструкцию «таких есть Царство», не превращая её в утверждение о составе Царства.
theological_decisions:
- issue: Значение выражения τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье принадлежит таким, как они
  alternative: таких есть Царство Божье
  rationale: Перевод передаёт представительную силу τοιούτων и не добавляет утверждений о невиновности детей или их автоматическом спасении. Более буквальная конструкция сохранена в сноске как подлинная формальная неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Вознегодовал» сохраняет библейскую возвышенность, оставаясь понятным; синтаксис прямой и доступный.
