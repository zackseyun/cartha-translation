  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: ru
  text: Они были в пути[a], поднимаясь в Иерусалим, и Иисус шёл впереди них; они изумлялись, а те, кто шёл следом, боялись. Иисус снова отвёл Двенадцать в сторону[b] и начал говорить им о том, что предстояло с Ним случиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дороге».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «взял Двенадцать с Собой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: были в пути
  rationale: Естественно передаёт конкретную обстановку путешествия; вариант «были в дороге» также возможен.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: поднимаясь в Иерусалим
  rationale: Сохраняет указание на подъём к Иерусалиму, связанное с рельефом и традиционным языком паломничества.
- source_word: προάγων αὐτούς
  choice: шёл впереди них
  rationale: Передаёт прежде всего положение Иисуса впереди группы, не добавляя более интерпретативного значения «вёл их».
- source_word: ἐθαμβοῦντο
  choice: изумлялись
  rationale: Выражает сильное удивление и сохраняет длительный характер реакции, не усиливая её до ужаса.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: те, кто следовал за ними
  rationale: Сохраняет субстантивированную причастную конструкцию и не отождествляет эту группу исключительно с двенадцатью.
- source_word: ἐφοβοῦντο
  choice: боялись
  rationale: Прямое и нейтральное соответствие, передающее продолжающееся эмоциональное состояние.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: отвёл двенадцать учеников в сторону
  rationale: В контексте действие отделяет двенадцать от остальных для особого наставления; слово «учеников» поясняет устойчивое обозначение «двенадцать» для современного читателя.
- source_word: πάλιν
  choice: снова
  rationale: Ясно обозначает повторность действия.
- source_word: ἤρξατο ... λέγειν
  choice: начал говорить им
  rationale: Естественная русская конструкция сохраняет начинательный оттенок греческого выражения.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: о том, что должно было с Ним произойти
  rationale: Передаёт предстоящие события, не усиливая выражение до идеи безусловной предопределённости.
theological_decisions:
- issue: Различие эмоциональных реакций двух групп
  choice: «они изумлялись», а «те, кто следовал за ними, боялись»
  alternative: Передать обе реакции общими словами, выражающими смешанное удивление и страх
  rationale: Греческий текст употребляет два разных глагола и, по-видимому, различает реакции групп; перевод сохраняет эту повествовательную напряжённость.
- issue: Смысл μέλλοντα в описании предстоящих страданий
  choice: «что должно было с Ним произойти»
  alternative: «что было предопределено с Ним произойти» или «что вскоре с Ним произойдёт»
  rationale: Формулировка сохраняет направленность на будущие события, не навязывая тексту более сильного учения о предопределении и не делая акцент исключительно на временной близости.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Структура слегка разделена на предложения ради естественного чтения; различие между изумлением и страхом сохранено. Местоимение «Ним» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
