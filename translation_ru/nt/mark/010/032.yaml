  verdict: revise
  source_fidelity: 'В целом ход повествования и различие между изумлением первой группы и страхом следующих переданы верно. Однако «что должно было с Ним произойти» способно в русском выражать необходимость/предопределённость сильнее, чем μέλλοντα; более нейтрально и точно: «что предстояло с Ним случиться». Обозначение τοὺς δώδεκα лучше сохранить как традиционное «Двенадцать», не добавляя отсутствующее в греческом «учеников».'
  naturalness: Исправленный текст сохраняет современный литературный, сдержанный библейский регистр. «Те, кто шёл следом» естественнее, чем «следовал за ними», и не создаёт в русском ненужной неоднозначности относительно того, за кем именно следуют.
  terminology: «Двенадцать» — устойчивое обозначение группы в данном контексте; «снова» адекватно передаёт πάλιν. Написание местоимения «Ним» с прописной буквы допустимо в избранной библейской издательской традиции.
  issues:
  - severity: medium
    issue: «должно было с Ним произойти» для τὰ μέλλοντα αὐτῷ συμβαίνειν
    rationale: Русское «должно было» легко читается как необходимость или предопределённость, тогда как греческая конструкция прежде всего обозначает предстоящие события. «Предстояло с Ним случиться» передаёт будущее значение без такого добавочного оттенка.
  - severity: low
    issue: Добавлено слово «учеников» в «двенадцать учеников»
    rationale: В оригинале стоит традиционное обозначение τοὺς δώδεκα без существительного. Добавление не существенно меняет смысл, но не нужно для ясности и ослабляет формальную точность.
  - severity: low
    issue: «те, кто следовал за ними»
    rationale: Греческое αὐτούς допускает отсылку к ранее названной группе, но русский вариант звучит несколько тяжеловесно и может излишне акцентировать объект следования. «Те, кто шёл следом» сохраняет неопределённость оригинала и естественнее.
