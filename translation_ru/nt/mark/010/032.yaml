revisions:
- from: Они были в пути[a], поднимаясь в Иерусалим. Иисус шёл впереди них; они изумлялись, а те, кто следовал за ними, боялись. Иисус снова отвёл двенадцать учеников в сторону[b] и начал говорить им о том, что должно было с Ним произойти.
  to: Они были в пути[a], поднимаясь в Иерусалим, и Иисус шёл впереди них; они изумлялись, а те, кто шёл следом, боялись. Иисус снова отвёл Двенадцать в сторону[b] и начал говорить им о том, что предстояло с Ним случиться.
