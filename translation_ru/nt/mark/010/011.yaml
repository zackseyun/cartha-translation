id: MRK.10.11
reference: Mark 10:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: ru
  text: 'И говорит им: «Кто разведётся со своей женой и женится на другой[a], тот совершает прелюбодеяние против неё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «женится на другой женщине».'
    reason: 'Лексический вариант: прилагательное ἄλλην стоит в женском роде и употреблено самостоятельно, подразумевая женщину.'
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для повествования Марка историческое настоящее и естественно звучит по-русски.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения естественно передаётся русским косвенным дополнением.
- source_word: Ὃς ἂν
  choice: кто… тот
  rationale: Эта русская соотносительная конструкция ясно передаёт неопределённо-общее условие греческого оборота.
- source_word: ἀπολύσῃ
  choice: разведётся
  rationale: В контексте брака глагол означает расторжение брака, а не просто отсылание или отпускание.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: со своей женой
  rationale: Контекст развода определяет значение γυνή как «жена»; возвратное «своей» естественно соотносит её с подлежащим.
- source_word: γαμήσῃ ἄλλην
  choice: женится на другой
  rationale: Форма ἄλλην женского рода подразумевает другую женщину; русское субстантивированное «другой» передаёт это кратко и естественно.
- source_word: μοιχᾶται
  choice: совершает прелюбодеяние
  rationale: Сохраняется прямое нравственно-правовое значение глагола без ослабления до общего понятия неверности.
- source_word: ἐπ’ αὐτήν
  choice: против неё
  rationale: Передаёт направленность проступка против оставленной жены и сохраняет несколько резкую, но значимую формулировку оригинала.
theological_decisions:
- issue: Сохранение силы выражения ἐπ’ αὐτήν как указания на проступок против жены
  choice: «совершает прелюбодеяние против неё»
  alternative: «совершает прелюбодеяние»; «изменяет ей»
  rationale: 'Греческое дополнение не следует опускать: оно подчёркивает, что поступок мужа является нарушением верности и несправедливостью по отношению к оставленной жене. Вариант «изменяет ей» звучит естественнее, но менее явно передаёт μοιχᾶται.'
- issue: Передача неопределённо-общей мужской формы
  choice: «Кто… тот» при явном упоминании жены
  alternative: «Всякий мужчина, который…»
  rationale: Русская конструкция точно передаёт общее условие без ненужного добавления слова «мужчина»; непосредственная брачная ситуация остаётся ясной из слов «со своей женой».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Историческое настоящее сохранено. Формулировка «против неё» намеренно оставляет заметной смысловую направленность греческого ἐπ’ αὐτήν, хотя она менее разговорна, чем «изменяет ей».
