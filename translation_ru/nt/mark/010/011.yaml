  source_fidelity: 'Перевод точно передаёт все существенные элементы греческого текста: историческое настоящее λέγει («говорит»), неопределённо-обобщающую конструкцию ὃς ἄν («Кто… тот»), развод с собственной женой, последующий брак с другой женщиной и указание ἐπ’ αὐτήν на проступок против первой жены. «Разведётся» уместно передаёт ἀπολύσῃ в брачном контексте.'
  naturalness: Текст звучит как современный литературный русский с уместной библейской сдержанностью. Конструкция «Кто… тот» ясна и естественна. Формула «совершает прелюбодеяние против неё» несколько более книжная и резкая, чем разговорное «изменяет ей», но именно поэтому хорошо сохраняет юридико-нравственную определённость и направленность греческой формулировки.
  terminology: «Жена», «разведётся», «женится» и «совершает прелюбодеяние» терминологически точны. Сноска корректно поясняет подразумеваемое существительное при ἄλλην, не создавая альтернативного смысла и не требуя изменения основного текста.
