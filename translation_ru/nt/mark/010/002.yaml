  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: ru
  text: И они спрашивали Его, позволено ли мужчине развестись с женой[a], испытывая Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволено ли мужу развестись со своей женой».'
    reason: Лексическая неоднозначность слов ἀνήρ («мужчина; муж») и γυνή («женщина; жена») допускает более явно супружескую формулировку.
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет ход повествования, не добавляя явно не выраженного временного оттенка.
- source_word: ἐπηρώτων
  choice: спрашивали
  rationale: Имперфект передаёт продолжающееся или повторявшееся действие; русское несовершенное «спрашивали» естественно сохраняет этот аспект.
- source_word: ἔξεστιν
  choice: позволено
  rationale: Вопрос касается допустимости развода по закону, а не физической возможности; «позволено» ясно передаёт эту юридико-нормативную мысль.
- source_word: ἀνδρὶ
  choice: мужчине
  rationale: ἀνήρ может означать как «мужчина», так и «муж». Выбор «мужчине» сохраняет обобщённую форму вопроса, тогда как брачный контекст выражен сочетанием «разводиться с женой».
- source_word: γυναῖκα
  choice: с женой
  rationale: В контексте развода γυνή означает жену, а не женщину вообще. Русская конструкция «разводиться с женой» естественна и не требует добавления притяжательного местоимения.
- source_word: ἀπολῦσαι
  choice: разводиться
  rationale: Хотя глагол может буквально означать «отпустить» или «отослать», в брачно-правовом контексте он имеет устойчивое значение «развестись».
- source_word: πειράζοντες
  choice: испытывая
  rationale: Причастие обозначает проверку или враждебное испытание Иисуса. «Испытывая» передаёт это прямо, не превращая мотив в более подробное толкование вроде «пытаясь поймать на слове».
theological_decisions:
- issue: Неоднозначность ἀνδρὶ в брачно-правовом вопросе
  choice: мужчине
  alternative: мужу
  rationale: Греческое слово допускает оба значения. Основной текст сохраняет обобщённое «мужчине», а вариант «мужу» отмечает явно супружеское прочтение, не устраняя исходную неоднозначность.
- issue: Характер действия πειράζοντες
  choice: испытывая Его
  alternative: пытаясь поймать Его на слове
  rationale: Основной вариант сохраняет лексическую широту причастия и враждебный оттенок контекста, но не добавляет конкретный способ испытания, не названный в стихе.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной и достойной формулировкой. Заглавное «Его» следует принятой русской библейской традиции уважительного обозначения Иисуса. Синтаксис сохраняет продолжающееся действие имперфекта и одновременность причастия.
