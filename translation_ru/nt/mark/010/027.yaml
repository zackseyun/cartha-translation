id: MRK.10.27
reference: Mark 10:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: ru
  text: 'Иисус посмотрел на них и сказал: «Для людей это невозможно, но не для Бога, потому что для Бога всё возможно».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: посмотрел на них
  rationale: Передаёт направленный, внимательный взгляд естественным современным русским выражением без излишнего усиления.
- source_word: Παρὰ ἀνθρώποις
  choice: для людей
  rationale: В данном контексте παρά с дательным обозначает сферу человеческих возможностей; «для людей» звучит ясно и естественно.
- source_word: ἀδύνατον
  choice: невозможно
  rationale: Сохраняет категорическое утверждение греческого текста о невозможности.
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: потому что для Бога всё возможно
  rationale: γάρ передано причинным союзом «потому что», а повтор παρά — одинаковым оборотом «для Бога»; порядок слов делает акцент на всеохватности «всё».
theological_decisions:
- issue: Соотношение человеческой невозможности и Божьей возможности
  choice: 'Сохранено прямое противопоставление: «для людей… но не для Бога»'
  alternative: «человекам… у Бога»
  rationale: Формулировка не уточняет механизм спасения и не снимает напряжения контекста, а точно сохраняет контраст исходного текста.
- issue: Значение πάντα — «всё»
  choice: Передано без ограничивающего пояснения
  alternative: «Богу возможно спасти»
  rationale: Хотя контекст относится к спасению, исходный текст использует широкое «всё»; конкретизация сузила бы авторскую формулировку.
translation_notes:
  register: Современный литературный русский язык; речь ясная, сдержанная и достойная. Синтаксис сохраняет параллелизм и повтор исходного текста.
