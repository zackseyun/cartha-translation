  source_fidelity: 'Перевод точно передаёт основное противопоставление греческого текста: человеческую невозможность и Божью возможность. «Посмотрел на них» адекватно передаёт ἐμβλέψας αὐτοῖς; «для людей» и повтор «для Бога» естественно отражают παρά с дательным. Широкое πάντα сохранено как «всё» без контекстуально оправданного, но отсутствующего в исходнике сужения.'
