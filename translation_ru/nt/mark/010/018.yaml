  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: ru
  text: 'Но Иисус сказал ему: «Почему ты называешь Меня добрым?[a] Никто не добр, кроме одного — Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «За что ты называешь Меня добрым?»'
    reason: 'Лексическая альтернатива: τί формально означает «что», но в данной конструкции выражает вопрос о причине или основании.'
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт мягкий контраст и переход к ответу Иисуса; в данном контексте естественнее, чем простое «и».
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Прямой и нейтральный эквивалент конструкции с косвенным дополнением, без лишней интерпретации.
- source_word: Τί
  choice: Почему
  rationale: В сочетании с глаголом τί здесь имеет обстоятельственное значение причины; по-русски естественно «Почему ты называешь…».
- source_word: με λέγεις ἀγαθόν
  choice: ты называешь Меня добрым
  rationale: Сохраняет прямое дополнение и именную часть сказуемого, а также звучит естественно по-русски.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: добрым / добр
  rationale: Сохраняет повтор одного и того же греческого прилагательного и не добавляет уточнения «нравственно».
- source_word: οὐδεὶς
  choice: Никто
  rationale: Естественно и точно передаёт всеобщее отрицание.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: кроме одного Бога
  rationale: Передаёт исключение и акцент на единственности; синтаксически естественно для современного русского языка, не устраняя возможный оттенок «кроме одного — Бога».
theological_decisions:
- issue: Возможное христологическое значение слов Иисуса о благости
  choice: Высказывание переведено прямо, без пояснений, будто Иисус либо отрицает Свою божественность, либо прямо утверждает её.
  alternative: Интерпретирующий перевод, заранее разрешающий напряжение в одну из сторон.
  rationale: Греческий текст ставит вопрос о применении слова «добрый» и утверждает уникальную благость Бога, но сам по себе не проговаривает дальнейший христологический вывод; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Местоимение «Меня» написано с прописной буквы по принятой русской библейской традиции обращения к Иисусу; формулировка не добавляет конфессионального толкования.
