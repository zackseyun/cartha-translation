source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: ru
  text: 'Ты знаешь заповеди: «Не убивай[a], не прелюбодействуй, не кради, не лжесвидетельствуй, не лишай другого того, что ему причитается[b], почитай отца и мать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не совершай убийства». Греческий глагол обычно обозначает убийство человека, особенно неправомерное, а не всякое лишение жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «не обирай», «не удерживай чужого» или «не лишай другого причитающегося ему». Речь идёт о неправомерном отнятии или удержании того, что принадлежит другому, в том числе путём эксплуатации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολάς
  choice: заповеди
  rationale: В контексте перечисления предписаний Декалога «заповеди» точнее и привычнее, чем общее «повеления».
- source_word: οἶδας
  choice: ты знаешь
  rationale: Форма οἶδα имеет настоящее значение; обращение к одному собеседнику передано естественно для русского языка.
- source_word: Μὴ φονεύσῃς
  choice: не убивай
  rationale: Это узнаваемая русская формулировка заповеди; возможная более узкая семантика неправомерного убийства пояснена в сноске без сужения основного текста.
- source_word: Μὴ μοιχεύσῃς
  choice: не прелюбодействуй
  rationale: Точный и устоявшийся русский термин для нарушения супружеской верности в библейском нравственно-правовом контексте.
- source_word: Μὴ κλέψῃς
  choice: не кради
  rationale: Прямое, точное и узнаваемое соответствие запрету.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: не лжесвидетельствуй
  rationale: Сохраняет правовой оттенок ложного свидетельства и связь с формулировкой Декалога, не расширяя смысл до всякой лжи.
- source_word: Μὴ ἀποστερήσῃς
  choice: не лишай другого того, что ему принадлежит
  rationale: Передаёт идею неправомерного удержания или отнятия причитающегося другому и сохраняет более широкий диапазон глагола, чем одно лишь «не обманывай».
- source_word: Τίμα
  choice: почитай
  rationale: Устоявшееся и семантически сильное соответствие в контексте заповеди; выражает не только уважение, но и надлежащее отношение и признание.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: отца и мать
  rationale: Притяжательное значение в русском естественно восстанавливается из обращения; отсутствие повторения «своих» делает формулировку ясной и узнаваемой.
theological_decisions:
- issue: Передача цитат и аллюзий на Декалог
  choice: Сохранить узнаваемую форму заповедей, следуя при этом смыслу греческого текста
  alternative: Передать весь перечень свободными современными перифразами
  rationale: Узнаваемая форма показывает связь с Декалогом, а сноски сохраняют важные лексические оттенки без внесения конфессионального толкования.
- issue: Объём запрета Μὴ φονεύσῃς
  choice: Основной текст «не убивай» с уточнением в сноске
  alternative: «Не совершай убийства» или «не убивай незаконно»
  rationale: Русская форма «не убивай» традиционно узнаваема как заповедь, тогда как греческий глагол обычно относится к убийству человека, особенно преступному; сноска удерживает обе стороны без догматического расширения или сужения.
- issue: Значение Μὴ ἀποστερήσῃς
  choice: Не лишай другого того, что ему принадлежит
  alternative: «Не обманывай», «не обирай» или «не удерживай чужого»
  rationale: Глагол допускает лишение, удержание причитающегося и эксплуатацию. Развёрнутая формулировка сохраняет смысловую широту и нравственно-экономический оттенок.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Формы «не прелюбодействуй», «не лжесвидетельствуй» и «почитай» сохранены как понятная библейская лексика, уместная для прямой отсылки к Декалогу. Кавычки обозначают перечисляемые заповеди.
