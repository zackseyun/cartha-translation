source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: ru
  text: 'Когда Иисус выходил на дорогу[a], к Нему подбежал один человек, опустился перед Ним на колени и спросил Его: «Добрый Учитель, что мне сделать, чтобы унаследовать вечную жизнь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда Он отправлялся в путь». Греческое выражение может означать как выход на дорогу, так и начало пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Когда Иисус выходил на дорогу
  rationale: Родительный самостоятельный оборот передаёт фоновое одновременное действие. Имя «Иисус» естественно восстанавливает подразумеваемое местоимение в отдельном русском стихе; выражение сохраняет образ движения к дороге, а возможное значение начала пути отмечено в сноске.
- source_word: προσδραμὼν
  choice: подбежал
  rationale: Кратко и живо передаёт поспешное приближение человека.
- source_word: εἷς
  choice: один человек
  rationale: Субстантивированное числительное вводит отдельного участника повествования; «человек» естественно по-русски и не сообщает больше, чем позволяет контекст.
- source_word: γονυπετήσας αὐτόν
  choice: опустился перед Ним на колени
  rationale: Точно передаёт позу почтения или настойчивой просьбы без усиления до падения ниц.
- source_word: ἐπηρώτα αὐτόν
  choice: спросил Его
  rationale: Хотя имперфект допускает оттенок продолженного действия, в русском повествовании однократное «спросил» звучит естественно и соответствует функции глагола здесь.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Учитель благой
  rationale: Сохраняет прямое сочетание обращения διδάσκαλε с прилагательным ἀγαθέ и его значимость для ответа Иисуса в следующем стихе. Постпозиция прилагательного придаёт обращению dignified, но понятное современное звучание.
- source_word: τί ποιήσω
  choice: что мне сделать
  rationale: Передаёт совещательный вопрос о требуемом поступке, не добавляя прямо отсутствующего в греческом модального слова «должен».
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает целевую связь между действием и наследованием жизни.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшееся и точное выражение, сохраняющее временной и богословский объём греческого сочетания.
- source_word: κληρονομήσω
  choice: унаследовать
  rationale: Сохраняет образ получения наследства, не сводя его к более общему «получить».
theological_decisions:
- issue: Обращение человека к Иисусу
  choice: Учитель благой
  alternative: Добрый Учитель; Благой Наставник
  rationale: διδάσκαλος означает «учитель», а не более сильный титул; прилагательное «благой» сохраняет формулировку, существенную для следующего ответа, не внося дополнительного догматического толкования.
- issue: Передача εἷς
  choice: один человек
  alternative: кто-то; один мужчина
  rationale: Форма мужского рода обозначает конкретного участника, однако нейтральное русское «человек» достаточно точно в данном контексте и не акцентирует пол сильнее исходного повествования.
- issue: Связь действия и наследования вечной жизни
  choice: что мне сделать, чтобы унаследовать
  alternative: что я должен сделать, чтобы обрести
  rationale: Перевод сохраняет сформулированное самим человеком отношение цели, но не превращает его вопрос в утверждение текста о способе спасения; образ наследования оставлен без сглаживания.
translation_notes:
  register: Современный литературный русский с ясным повествовательным синтаксисом и умеренно возвышенным евангельским регистром. Прописные местоимения по отношению к Иисусу использованы последовательно в рамках выбранной русской издательской нормы.
