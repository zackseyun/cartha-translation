  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: ru
  text: 'Они же были чрезвычайно изумлены и говорили друг другу[a]: «Тогда кто может спастись?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между собой»; букв.: «к самим себе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Они же
  rationale: Местоимение отсылает к участникам разговора в контексте, а частица «же» естественно передаёт переход δέ, не усиливая его до резкого противопоставления.
- source_word: περισσῶς
  choice: чрезвычайно
  rationale: Передаёт высокую степень изумления и сильную интенсивность наречия.
- source_word: ἐξεπλήσσοντο
  choice: были ... поражены
  rationale: Выражает сильное изумление; конструкция с «были» позволяет отразить продолженное состояние, обозначенное имперфектом.
- source_word: λέγοντες
  choice: и говорили
  rationale: Естественная русская координация передаёт одновременность причастного оборота с основной реакцией.
- source_word: πρὸς ἑαυτούς
  choice: друг другу
  rationale: В данном множественном и разговорном контексте оборот естественно имеет взаимное значение; буквальная возможность отмечена в сноске.
- source_word: Καὶ
  choice: тогда ... же
  rationale: В вопросе καί получает контекстуальный оттенок следствия; русское «же тогда» естественно выражает вывод из предшествующих слов Иисуса.
- source_word: τίς
  choice: кто
  rationale: Сохраняет прямой всеобщий вопрос о том, какой человек способен получить спасение.
- source_word: δύναται
  choice: может
  rationale: Прямо и естественно передаёт способность или возможность.
- source_word: σωθῆναι
  choice: спастись
  rationale: Обычная русская форма для пассивного смысла «быть спасённым»; сохраняет богословский и эсхатологический вес слова в контексте Божьего царства.
theological_decisions:
- issue: Смысл σωθῆναι в контексте
  choice: спастись
  alternative: быть избавленным
  rationale: Контекст входа в Божье царство указывает на спасение в широком богословском смысле, а не только на избавление от временной опасности.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет достоинство, сильную эмоциональную реакцию и естественное звучание живой речи.
