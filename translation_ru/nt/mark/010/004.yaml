  language: ru
  text: 'Они ответили: «Моисей позволил написать разводный документ[a] и отпустить жену[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разводное письмо». Речь идёт о письменном юридическом документе, оформляющем развод.'
