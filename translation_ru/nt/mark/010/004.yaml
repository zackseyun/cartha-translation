lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Они ответили
  rationale: Артикль употреблён субстантивированно и обозначает упомянутых ранее собеседников; δέ вводит их реплику. В современном русском «ответили» естественно передаёт диалогическую связь, не усиливая противопоставление.
- source_word: Ἐπέτρεψεν
  choice: позволил
  rationale: Глагол означает разрешение, а не повеление; это различие существенно для последующего ответа Иисуса.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: βιβλίον ἀποστασίου
  choice: свидетельство о разводе
  rationale: Сочетание обозначает письменный юридический документ о расторжении брака; выбран ясный современный эквивалент.
- source_word: γράψαι
  choice: написать
  rationale: Прямое соответствие инфинитиву γράψαι без излишнего уточнения процесса составления документа.
- source_word: καὶ ἀπολῦσαι
  choice: и отпустить жену
  rationale: В брачном контексте ἀπολύω означает отпустить или развестись. Формулировка сохраняет образ исходного выражения; «жену» добавлено для естественности и ясности по контексту.
theological_decisions:
- issue: Характер Моисеева установления о разводе
  choice: Моисей позволил развод
  alternative: Моисей повелел дать разводное свидетельство
  rationale: Ἐπέτρεψεν прямо выражает позволение. Перевод сохраняет важное для контекста различие между уступкой и повелением.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и сдержанно-достоинственная. Юридический оттенок сохранён без архаизма, а буквальный образ «отпустить» пояснён в сноске.
