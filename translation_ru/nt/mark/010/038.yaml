  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: ru
  text: 'Но Иисус сказал им: «Вы не знаете, о чём просите. Можете ли вы испить чашу[a], которую Я пью, или креститься крещением, которым Я крещусь?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Чаша» — библейский образ назначенной человеку доли; здесь речь прежде всего о предстоящих страданиях Иисуса.
    reason: cross_reference
  - marker: b
    text: 'Или, с передачей смысла: «пройти через то крещение, через которое прохожу Я». В греческом тексте однокоренные слова «крещение» и «креститься» повторены для выразительности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Но Иисус сказал им
  rationale: δέ передаёт лёгкое противопоставление и вводит поправляющий ответ Иисуса; «но» естественно выражает этот поворот.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Вы не знаете, о чём просите
  rationale: Сохраняется основное значение οἶδα — «знать», а αἰτέω естественно передано глаголом «просить»; конструкция звучит ясно и современно.
- source_word: δύνασθε
  choice: Можете ли вы
  rationale: Передаёт способность или готовность оказаться способными совершить названное, не усиливая смысл дополнительным толкованием.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: испить чашу, которую Я пью
  rationale: Метафора чаши сохранена без поясняющего добавления «страданий». «Испить чашу» имеет уместное библейское достоинство, тогда как относительное придаточное точно передаёт греческую конструкцию.
- source_word: ἢ
  choice: или
  rationale: Сохраняется дизъюнктивное значение греческого союза и чтение SBLGNT без гармонизации с иными текстовыми традициями.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: креститься крещением, которым Я крещусь
  rationale: Сохранён намеренный повтор однокоренных слов βάπτισμα/βαπτίζω и метафорическая форма исходного текста. Русская конструкция несколько торжественна, но понятна и близка к греческой риторике.
theological_decisions:
- issue: Метафорический смысл чаши и крещения
  choice: Сохранить обе метафоры в основном тексте, не раскрывая их как страдание, смерть или гнев Божий.
  alternative: 'Передать истолковательно: «перенести те страдания, которые перенесу Я», либо добавить «чашу страданий».'
  rationale: Контекст указывает прежде всего на предстоящие страдания Иисуса, однако сам стих оставляет образы неразвёрнутыми. Их буквальное сохранение удерживает библейские связи и не сужает богословский смысл.
- issue: Форма вопроса δύνασθε
  choice: 'Передать как вопрос о способности: «Можете ли вы…?»'
  alternative: 'Передать как вопрос о готовности: «Готовы ли вы…?»'
  rationale: Греческий глагол обозначает прежде всего возможность или способность; «готовы» смещало бы акцент к намерению.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Местоимение «Я» в прямой речи Иисуса написано с прописной буквы согласно распространённой русской библейской издательской традиции. Лексический повтор «креститься крещением» сознательно сохранён ради формы и образности оригинала.
