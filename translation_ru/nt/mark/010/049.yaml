  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: ru
  text: 'Иисус остановился и сказал: «Позовите его». Они позвали слепого и сказали ему: «Смелее, вставай: он зовёт тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: остановился
  rationale: Аористное причастие от ἵστημι буквально указывает на то, что Иисус встал или остановился; в контексте движения естественный русский эквивалент — «остановился».
- source_word: Φωνήσατε αὐτόν / φωνοῦσι / φωνεῖ σε
  choice: позовите его / позвали / зовёт тебя
  rationale: Повтор одного корня сохраняет заметный в греческом тексте лексический повтор и естественно звучит по-русски.
- source_word: τὸν τυφλὸν
  choice: слепого
  rationale: Субстантивированное прилагательное обозначает уже упомянутого слепого мужчину; контекст позволяет естественно употребить русское прилагательное как существительное.
- source_word: Θάρσει
  choice: Смелее
  rationale: Краткое побуждение передаёт ободрение и призыв набраться мужества, оставаясь понятным в современной речи.
- source_word: ἔγειρε
  choice: вставай
  rationale: Императив призывает человека подняться; «вставай» естественно передаёт непосредственность обращения.
theological_decisions:
- issue: Написание местоимения, относящегося к Иисусу
  choice: Он с прописной буквы в начале предложения по общему правилу
  alternative: он со строчной буквы внутри перестроенного предложения
  rationale: Прописная буква обусловлена только началом предложения, а не конфессиональным правилом почтительного написания местоимений.
translation_notes:
  register: Современный литературный русский язык с прямым, dignified повествованием. Лексический повтор φωνέω сохранён. Сноски английского консультационного слоя не перенесены, поскольку их маркеры и содержание взаимно смещены и для ясного русского текста не требуются.
