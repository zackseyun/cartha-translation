lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: обняв их
  rationale: Причастие обозначает, что Иисус принял детей в объятия; «обняв» естественно и конкретно передаёт этот тёплый физический жест.
- source_word: κατευλόγει
  choice: благословлял их
  rationale: Несовершенный вид греческого глагола передаёт продолжающееся или повторявшееся действие. Русская форма «благословлял» естественно сохраняет эту длительность; усилительный оттенок составного глагола отмечен в сноске.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: возлагая на них руки
  rationale: Причастный оборот выражает сопутствующий благословению жест. «Возлагая на них руки» — ясная и узнаваемая библейская формулировка без добавления церемониального смысла.
- source_word: αὐτὰ ... αὐτά
  choice: их ... на них
  rationale: Местоимения относятся к детям из непосредственного контекста; повторять существительное нет необходимости.
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет характерную для повествования Марка связь, не добавляя временного или причинного значения.
theological_decisions:
- issue: Характер действий Иисуса по отношению к детям
  choice: 'Сохранить конкретные действия: Он обнял детей, благословлял их и возлагал на них руки.'
  alternative: Передать происходящее как особый обряд или церемонию благословения.
  rationale: Греческий текст изображает сердечный приём и благословение детей, но не определяет действие посредством позднейшей сакраментальной или конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Заглавное «Он» употреблено как традиционная русская референция к Иисусу; синтаксис сохраняет последовательность и одновременность действий исходного текста.
