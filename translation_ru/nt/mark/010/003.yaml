  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: ru
  text: 'Но Он ответил им: «Что повелел вам Моисей?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Слабый противительный союз отмечает поворот в диалоге и здесь естественно передаёт лёгкое противопоставление предыдущему испытующему вопросу фарисеев.
- source_word: ἀποκριθεὶς εἶπεν
  choice: Он ответил
  rationale: Обычное греческое сочетание, испытавшее семитское влияние, в современном русском естественно передаётся одним глаголом без избыточного «ответив, сказал».
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж обозначает адресатов ответа; «ответил им» — естественная русская конструкция.
- source_word: Τί
  choice: Что
  rationale: Вопросительное местоимение вводит прямой вопрос о содержании данного Моисеем повеления.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж обозначает тех, кому было обращено повеление; порядок «повелел вам» звучит естественно и сохраняет смысл.
- source_word: ἐνετείλατο
  choice: повелел
  rationale: Глагол означает авторитетно предписать или дать заповедь; «повелел» сохраняет юридико-авторитетный оттенок и подходит к обсуждению Моисеева установления.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Имя передано в общепринятой русской библейской форме.
theological_decisions:
- issue: Упоминание авторитета Моисея в ответе Иисуса
  choice: Сохранено прямое именование Моисея как давшего повеление.
  alternative: «Что предписывает вам закон Моисея?» или «Что повелел вам Бог через Моисея?»
  rationale: Греческий текст прямо называет Моисея и не заменяет его именование словом «закон», а также не добавляет пояснения о Боге как источнике повеления. Перевод не должен разрешать или расширять эту формулировку.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная диалогическая формулировка. Местоимение «Он» написано с прописной буквы по устойчивой русской библейской издательской норме, без изменения содержания исходного текста.
