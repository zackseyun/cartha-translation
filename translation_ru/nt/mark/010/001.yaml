  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: ru
  text: И, поднявшись, Он оттуда приходит в пределы Иудеи и за Иордан[a]. К Нему снова сходятся толпы, и Он, по обыкновению, снова учил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «в пределы Иудеи за Иорданом». Греческое выражение может обозначать либо Иудею и область по другую сторону Иордана, либо пределы Иудеи, находящиеся за Иорданом.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Естественное русское пространственное наречие, связывающее переход с предыдущим местом действия.
- source_word: ἀναστὰς
  choice: выйдя
  rationale: В данном контексте причастие обозначает, что Иисус поднялся и отправился в путь; «выйдя» естественно передаёт начало движения и не вызывает ненужной ассоциации с воскресением.
- source_word: ἔρχεται
  choice: приходит
  rationale: Настоящее время сохраняет характерное для повествования Марка историческое настоящее и его живость.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: пределы Иудеи
  rationale: ὅρια обозначает область или территорию; «пределы Иудеи» сохраняет географический смысл и торжественный, но понятный регистр.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: и за Иордан
  rationale: Передаёт область по другую сторону реки, не уточняя направление движения сверх того, что выражено в греческом тексте.
- source_word: συμπορεύονται … ὄχλοι πρὸς αὐτόν
  choice: к Нему … сходятся толпы
  rationale: «Сходятся» естественно выражает движение множества людей к Иисусу и сохраняет значение совместного движения, заложенное в глаголе.
- source_word: πάλιν
  choice: снова
  rationale: Оба употребления наречия сохранены, чтобы передать повторяемость и характерную для Марка словесную повторность.
- source_word: ὡς εἰώθει
  choice: по обыкновению
  rationale: Кратко и естественно передаёт привычное, регулярно совершаемое действие.
- source_word: ἐδίδασκεν αὐτούς
  choice: учил их
  rationale: Прошедшее время несовершенного вида передаёт длительное или обычное действие греческого имперфекта.
theological_decisions:
- issue: Историческое настоящее ἔρχεται
  choice: 'Сохранено настоящее время: «приходит»'
  alternative: «пришёл» или «отправился»
  rationale: Настоящее время не несёт отдельной доктринальной нагрузки, но прозрачно передаёт живую повествовательную манеру Марка.
- issue: Синтаксис географического выражения τὰ ὅρια τῆς Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου
  choice: «в пределы Иудеи и за Иордан» как два согласованных географических обозначения
  alternative: «в пределы Иудеи за Иорданом» как единое обозначение территории
  rationale: Греческая конструкция сжата и допускает оба понимания; основной текст следует порядку слов источника, а примечание сохраняет альтернативу, не разрешая неоднозначность искусственно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Историческое настоящее и оба повторения «снова» сохранены; чрезмерно буквальная последовательность союзов слегка сглажена делением на два предложения.
