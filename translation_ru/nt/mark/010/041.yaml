    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Связь передана последовательностью повествования без отдельного «и»
  rationale: В русском языке начальное «и» здесь необязательно; бессоюзное продолжение естественно сохраняет повествовательную связь, не добавляя нового временного оттенка.
- source_word: ἀκούσαντες
  choice: Услышав об этом
  rationale: Аористное причастие обозначает действие, предшествующее основной реакции. «Об этом» естественно восполняет подразумеваемый из контекста предмет услышанного.
- source_word: οἱ δέκα
  choice: десять учеников
  rationale: Греческий текст буквально говорит «десять». Слово «учеников» делает русскую фразу ясной, не вводя «остальные», которого в оригинале нет.
- source_word: ἤρξαντο
  choice: стали
  rationale: Передаёт начало реакции в естественной русской конструкции «стали негодовать».
- source_word: ἀγανακτεῖν
  choice: негодовать
  rationale: Глагол выражает сильное возмущение и недовольство; «негодовать» сохраняет эту интенсивность и оценочный оттенок.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: на Иакова и Иоанна
  rationale: В данном контексте περί может обозначать тех, на кого направлено негодование, либо его повод. Основной вариант естественно передаёт направленность реакции, а неоднозначность отмечена в сноске.
- source_word: Ἰακώβου
  choice: Иакова
  rationale: Традиционная и общепонятная русская форма имени Ἰάκωβος.
- source_word: Ἰωάννου
  choice: Иоанна
  rationale: Традиционная и общепонятная русская форма имени Ἰωάννης.
