  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ru
  text: 'Истинно говорю вам: кто не примет Царства Божьего подобно ребёнку,[a] тот никогда не войдёт в него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «как ребёнок». Слова могут указывать на детское смирение, доверие или зависимость, однако греческий текст не уточняет, какое именно качество имеется в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: Передаёт торжественную и авторитетную формулу введения без архаичного заимствования «аминь».
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямой и естественный перевод настоящего времени глагола с местоимением в дательном падеже.
- source_word: ὃς ἂν
  choice: кто
  rationale: В конструкции с последующим соотносительным «тот» естественно передаёт неопределённо-обобщающее значение греческого оборота.
- source_word: μὴ δέξηται
  choice: не примет
  rationale: «Принять» сохраняет образ восприимчивости и принятия дара, не превращая Царство в человеческое достижение.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Традиционное и понятное выражение, способное охватывать как Божье царствование, так и сферу Его владычества.
- source_word: ὡς παιδίον
  choice: как ребёнок
  rationale: Сохраняет сравнение и не уточняет, какое именно качество ребёнка подразумевается.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: непременно не войдёт
  rationale: Передаёт усиленное отрицание οὐ μή в современном литературном русском языке.
- source_word: εἰς αὐτήν
  choice: в него
  rationale: Местоимение отсылает к Царству; предлог «в» естественно сохраняет направленность греческого εἰς.
theological_decisions:
- issue: Смысл принятия Царства «как ребёнок»
  choice: Сохранить сравнение, не определяя конкретное детское качество.
  alternative: «с детским смирением», «с детским доверием» или «в полной зависимости, как ребёнок»
  rationale: Греческий текст не уточняет, идёт ли речь о смирении, доверии, зависимости либо о положении ребёнка; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Формула «Истинно говорю вам» сохраняет торжественность; конструкция «кто… тот…» звучит естественно и ясно. Маркер сноски поставлен непосредственно после спорного оборота.
