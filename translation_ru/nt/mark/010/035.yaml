source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: ru
  text: 'И подошли к Нему[a] Иаков и Иоанн, сыновья Зеведея, и сказали Ему: «Учитель, мы хотим, чтобы Ты сделал для нас всё, о чём мы Тебя попросим».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришли к Нему». Греческий глагол обозначает движение к Иисусу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: подошли к Нему
  rationale: Глагол обозначает движение по направлению к Иисусу; русское «подошли к Нему» естественно передаёт историческое настоящее и пространственный оттенок.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: сыновья Зеведея
  rationale: Сохранено приложение, прямо отождествляющее Иакова и Иоанна как сыновей Зеведея.
- source_word: λέγοντες αὐτῷ
  choice: и сказали
  rationale: Причастная конструкция естественно передана русским однородным сказуемым; адресат понятен из контекста и следующего обращения.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Точно передаёт обращение к Иисусу как к наставнику, не усиливая значение до «Господин» или «Владыка».
- source_word: θέλομεν ἵνα
  choice: мы хотим, чтобы
  rationale: Современная и прямая русская конструкция, сохраняющая настойчивый характер просьбы.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: всё, о чём мы Тебя попросим
  rationale: Сочетание относительного местоимения с ἐάν выражает неопределённость — «что бы ни»; выбранная формулировка естественна по-русски.
- source_word: ποιήσῃς ἡμῖν
  choice: Ты сделал для нас
  rationale: Сохраняет широкое значение ποιέω «делать» и дательный благополучателя, не истолковывая просьбу более узким глаголом «исполнил».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. Историческое настоящее греческого текста передано обычным для русского повествования прошедшим временем. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
