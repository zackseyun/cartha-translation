  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: ru
  text: 'Пётр начал говорить ему: «Вот, мы оставили всё и последовали за тобой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: начал говорить
  rationale: Оборот с ἄρχομαι и инфинитивом естественно передаётся по-русски как «начал говорить»; он вводит последующую прямую речь.
- source_word: ὁ Πέτρος
  choice: Пётр
  rationale: Использована традиционная русская форма личного имени.
- source_word: αὐτῷ
  choice: ему
  rationale: Местоимение относится к Иисусу по контексту; имя не подставляется, поскольку в греческом тексте здесь стоит местоимение.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: В данном контексте это частица привлечения внимания. «Вот» естественно и достойно звучит в современной русской прямой речи; «смотри» могло бы необоснованно усиливать буквальный зрительный оттенок.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное греческое местоимение передано русским «мы», сохраняющим контрастно-эмфатический оттенок в сочетании с «вот».
- source_word: ἀφήκαμεν πάντα
  choice: оставили всё
  rationale: «Оставили всё» точно и естественно передаёт совершённое действие; вариант «отказались от всего» добавил бы оттенок, не обязательный для ἀφίημι.
- source_word: ἠκολουθήκαμέν σοι
  choice: последовали за тобой
  rationale: Русский глагол «последовать» с конструкцией «за тобой» естественно передаёт следование за учителем. Совершенный вид хорошо отражает греческий перфект как предпринятое действие с сохраняющимся результатом.
theological_decisions:
- issue: Утверждение Петра о жертве учеников
  choice: Передать слова Петра прямо, без оценки и смягчения
  alternative: Добавить поясняющий смысл вроде «отказались от всего ради тебя» либо заранее соотнести слова с ответом Иисуса
  rationale: Стих сообщает собственное заявление Петра и не даёт здесь авторской оценки. Перевод сохраняет напряжение текста, не подтверждая и не опровергая полноту его притязания.
translation_notes:
  register: Современный литературный русский язык с естественной, но достойной библейской повествовательной интонацией. «Вот» сохраняет функцию привлечения внимания без архаического «се».
