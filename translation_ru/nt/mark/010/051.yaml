base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: ru
  text: 'Иисус сказал Ему в ответ: «Что ты хочешь, чтобы Я сделал для тебя?» Слепой сказал Ему: «Раввуни[a], чтобы мне прозреть».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Раввуни» — арамейское обращение, означающее «мой учитель» или «мой господин».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: сказал … в ответ
  rationale: Передаёт сочетание причастия «ответив» с глаголом «сказал», сохраняя ответный характер реплики и естественный порядок слов в современном русском языке.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Что ты хочешь, чтобы Я сделал для тебя?
  rationale: Дательный σοι явно передан словами «для тебя», а θέλεις — естественной русской конструкцией с «хочешь».
- source_word: ὁ … τυφλὸς
  choice: слепой
  rationale: Субстантивированное прилагательное естественно передаётся по-русски словом «слепой»; из контекста ясно, что речь идёт о конкретном мужчине.
- source_word: Ραββουνι
  choice: Раввуни
  rationale: Сохранена переданная греческим текстом семитская форма обращения; её смысл поясняется в сноске.
- source_word: ἵνα ἀναβλέψω
  choice: чтобы мне прозреть
  rationale: В контексте исцеления ἀναβλέπω означает обретение или возвращение зрения. Эллиптический ответ с ἵνα сохранён естественной русской конструкцией с «чтобы».
theological_decisions:
- issue: Передача обращения Ραββουνι
  choice: «Раввуни» в основном тексте с пояснительной сноской
  alternative: «мой Учитель» или «Господин»
  rationale: Греческий текст сохраняет транслитерированное семитское обращение, а не заменяет его обычным греческим титулом. Транслитерация сохраняет историческую окраску и не сужает возможный оттенок значения.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции; это орфографическое решение не добавляет к греческому тексту отдельного смыслового утверждения.
