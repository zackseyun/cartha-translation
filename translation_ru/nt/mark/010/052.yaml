base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: ru
  text: 'Иисус сказал ему: «Иди, твоя вера[a] спасла тебя[b]». И тот сразу прозрел и следовал за Иисусом по дороге.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь слово «вера» можно также передать как «доверие».
    reason: alternative_reading
  - marker: b
    text: 'Или: «исцелила тебя» или «сделала тебя здоровым». Греческий глагол может обозначать как спасение, так и исцеление.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Иди
  rationale: Прямое и естественное повеление уйти; в греческом тексте нет притяжательного оттенка, который требовал бы перевода «иди своей дорогой».
- source_word: πίστις
  choice: вера
  rationale: Сохраняет ключевой богословский термин и здесь обозначает доверие человека Иисусу; возможный смысл «доверие» указан в сноске.
- source_word: σέσωκέν
  choice: спасла
  rationale: Перфект глагола σῴζω допускает значения спасения, исцеления и восстановления. «Спасла» сохраняет широту формулировки Иисуса и не сводит её только к физическому исцелению.
- source_word: εὐθύς
  choice: сразу
  rationale: Естественно передаёт немедленность и характерный для повествования Марка быстрый темп.
- source_word: ἀνέβλεψεν
  choice: прозрел
  rationale: В контексте слепоты глагол означает обретение зрения; «прозрел» кратко и естественно выражает это по-русски.
- source_word: ἠκολούθει
  choice: последовал
  rationale: Передаёт реальное следование за Иисусом после исцеления. Русский совершенный вид естественно обозначает начало дальнейшего движения, не требуя тяжеловесного «стал следовать».
- source_word: αὐτῷ
  choice: за Иисусом
  rationale: Повтор имени вместо местоимения устраняет возможную неясность русского «за ним» и не добавляет нового содержания.
- source_word: ἐν τῇ ὁδῷ
  choice: по дороге
  rationale: Сохраняет конкретную картину движения по дороге; возможное более широкое звучание «на пути» отмечено в сноске.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Иисус
  rationale: В начале русского предложения имя без начального «и» звучит естественнее; повествовательная связь сохраняется контекстом. Второе καί передано как «И».
theological_decisions:
- issue: Значение σῴζω в словах Иисуса
  choice: «спасла тебя»
  alternative: «исцелила тебя» / «сделала тебя здоровым»
  rationale: Непосредственный контекст говорит о восстановлении зрения, однако греческий глагол шире физического исцеления. Перевод сохраняет лексическую и богословскую многозначность.
- issue: Значение πίστις
  choice: «вера»
  alternative: «доверие»
  rationale: «Вера» сохраняет устойчивый ключевой термин, тогда как контекст доверия Иисусу остаётся доступен и поясняется в сноске.
- issue: Образ ὁδός
  choice: «по дороге»
  alternative: «на пути»
  rationale: Основным оставлен конкретный дорожный образ, но сноска сохраняет возможный мотив пути и ученичества, не навязывая его как единственное толкование.
translation_notes:
  register: 'Современный литературный русский язык: краткая, ясная и достойная повествовательная фраза. «Тот» естественно возвращает внимание к исцелённому человеку, а повтор имени Иисуса исключает местоименную двусмысленность. Подлинная смысловая широта слов «вера», «спасла» и «дорога/путь» сохранена с помощью сносок.'
