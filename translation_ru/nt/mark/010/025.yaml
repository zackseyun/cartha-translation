base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: ru
  text: Легче верблюду[b] пройти сквозь игольное ушко[a], чем богатому[c] войти в Царство Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через отверстие иглы».'
    reason: lexical_alternative
  - marker: b
    text: Иногда вместо «верблюд» предлагали читать «канат», однако здесь в греческом тексте стоит слово «верблюд».
    reason: alternative_reading
  - marker: c
    text: Слово «богатому» в греческом тексте имеет форму мужского рода, единственного числа; в этом изречении оно употреблено в обобщающем смысле.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: легче
  rationale: Сравнительная форма прямо выражает меньшую трудность; «легче» естественно по-русски и сохраняет силу гиперболического сопоставления.
- source_word: κάμηλον
  choice: верблюду
  rationale: В греческом тексте стоит κάμηλος — «верблюд». Эта передача сохраняет яркий образ и не подменяет его предполагаемым словом «канат».
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: сквозь игольное ушко
  rationale: Выражение обозначает отверстие швейной иглы. «Игольное ушко» — ясный и устойчивый современный русский эквивалент.
- source_word: διελθεῖν
  choice: пройти
  rationale: Инфинитив διέρχομαι означает «пройти, пройти сквозь»; вместе с «сквозь» русская формулировка точно передаёт движение через отверстие.
- source_word: πλούσιον
  choice: богатому
  rationale: Субстантивированное прилагательное мужского рода передано таким же естественным русским субстантивированным прилагательным. В данном изречении оно имеет обобщающий смысл.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: войти в Царство Бога
  rationale: Передаёт устойчивое евангельское понятие βασιλεία τοῦ θεοῦ без добавочного толкования; глагол «войти» естественно сочетается с предлогом «в».
- source_word: εἰσελθεῖν
  choice: войти
  rationale: Точный и краткий русский эквивалент инфинитива εἰσέρχομαι в данном контексте.
theological_decisions:
- issue: Смысл образа верблюда и игольного ушка
  choice: Сохранён буквальный гиперболический образ верблюда, проходящего сквозь отверстие иглы.
  alternative: Понимать «игольное ушко» как название узких ворот или заменять «верблюда» на «канат».
  rationale: Сам греческий текст создаёт резкий образ невозможности. Упоминание особых ворот не следует из текста, а чтение «канат» не соответствует данному греческому тексту; перевод не должен смягчать напряжённость изречения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Формулировка сохраняет лаконичность афоризма; «игольное ушко» естественно для обычного читателя, а «богатому» избегает тяжеловесного «богатому мужчине», не стирая грамматическую форму оригинала.
