lexical_decisions:
- source_word: ἀποβαλών
  choice: сбросил с себя
  rationale: Аористное причастие передаёт решительное, быстрое действие; личная форма естественно выстраивает последовательность событий по-русски.
- source_word: ἱμάτιον
  choice: плащ
  rationale: Ἱμάτιον здесь обозначает верхнюю одежду; «плащ» — краткий и понятный контекстуальный эквивалент.
- source_word: ἀναπηδήσας
  choice: вскочил
  rationale: Глагол выражает внезапное энергичное движение вверх; «вскочил» сохраняет живость повествования.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: подошёл к Иисусу
  rationale: Сочетание обозначает направленное движение к Иисусу с достижением цели; «подошёл» естественно звучит в данном русском повествовательном контексте.
- source_word: δὲ
  choice: Он
  rationale: Слабый повествовательный связующий элемент δέ не требует отдельного союза в русском; начало с местоимения обеспечивает естественный переход и сохраняет референта.
