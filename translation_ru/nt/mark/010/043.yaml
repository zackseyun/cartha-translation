lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Но среди вас пусть будет не так
  rationale: Передаёт противопоставление δέ и отрицание описанного в предыдущем контексте порядка. «Пусть будет» естественно выражает нормативную силу высказывания в русском, хотя буквально возможно настоящее время «это не так».
- source_word: ἀλλ’
  choice: Напротив
  rationale: Ясно обозначает сильное противопоставление мирскому представлению о величии и последующему порядку служения.
- source_word: ὃς ἂν θέλῃ
  choice: кто хочет
  rationale: Естественно передаёт неопределённо-общее условие и волевое значение θέλω.
- source_word: μέγας γενέσθαι
  choice: стать великим
  rationale: «Стать» сохраняет значение перехода в состояние у γενέσθαι, а «великим» — статусную лексику μέγας.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Соответствует общественному и общинному смыслу выражения; в стихе передано последовательно.
- source_word: ἔσται ὑμῶν διάκονος
  choice: тот будет вам слугой
  rationale: Будущее «будет» сохраняет форму ἔσται, не устраняя её возможной предписывающей силы. «Слуга» передаёт διάκονος как служащего другим, не превращая слово в название церковной должности.
theological_decisions:
- issue: Нормативная сила οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Но среди вас пусть будет не так
  alternative: Но среди вас это не так
  rationale: В контексте слова Иисуса устанавливают иной образ отношений среди учеников. Основной текст естественно передаёт эту нормативность, а сноска сохраняет возможность более формального настоящего времени.
- issue: Сила будущего ἔσται в наставлении Иисуса
  choice: тот будет вам слугой
  alternative: тот должен быть вам слугой
  rationale: Будущее изъявительное может иметь здесь предписывающую силу, однако перевод сохраняет греческую глагольную форму, а альтернативный нормативный смысл отмечает в сноске.
- issue: Значение διάκονος
  choice: слуга
  alternative: служитель
  rationale: В данном контексте речь идёт о смиренном служении внутри общины, а не о закреплённой церковной должности. «Слуга» избегает позднейшего должностного оттенка.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены повтор «среди вас», статусный образ «стать великим» и напряжение между формой будущего времени и предписывающим смыслом. Конечная запятая сохранена, поскольку стих синтаксически продолжается в Мк 10:44.
