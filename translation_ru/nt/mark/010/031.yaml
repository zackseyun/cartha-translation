  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ru
  text: Но многие первые станут последними, а последние — первыми.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более развёрнуто: «Но многие из тех, кто сейчас первые, станут последними, а те, кто сейчас последние, — первыми».'
    reason: 'Лексико-синтаксическая альтернатива: развёрнутая формулировка поясняет субстантивированные прилагательные и подразумеваемый переворот положения, не меняя основного смысла.'
lexical_decisions:
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное обозначает широкую, но не всеохватную группу. Русское «многие» естественно употребляется самостоятельно и не требует добавления «люди».
- source_word: δὲ
  choice: но
  rationale: Частица выражает мягкое противопоставление предыдущему обещанию и вводит принцип переворота привычного порядка.
- source_word: ἔσονται
  choice: станут
  rationale: Будущая форма εἰμί здесь допускает естественную русскую передачу «станут», подчёркивающую предстоящую перемену положения и сохраняющую афористичность.
- source_word: πρῶτοι
  choice: первые
  rationale: Слово указывает на первенство по положению или рангу; «первые» сохраняет прямое противопоставление слову «последние».
- source_word: ἔσχατοι
  choice: последними / последние
  rationale: «Последние» точно сохраняет противоположность «первым» и не сужает смысл до конкретной социальной, нравственной или иной категории.
- source_word: καὶ
  choice: а
  rationale: В симметричной русской конструкции союз «а» естественно связывает и одновременно противопоставляет две части изречения; смысловая связь греческого καὶ сохраняется.
- source_word: οἱ ἔσχατοι
  choice: последние
  rationale: Артикль субстантивирует прилагательное. Русское «последние» столь же естественно обозначает соответствующую группу без добавления «те, кто».
theological_decisions:
- issue: Характер переворота первых и последних
  choice: Сохранить изречение как общий принцип грядущего переворота положения, не уточняя, какие именно социальные, нравственные или сотериологические группы имеются в виду.
  alternative: Отнести «первых» и «последних» исключительно к богатым и бедным, ученикам и посторонним либо представить это как безусловное правило для каждого человека.
  rationale: Сам стих формулирует открытый парадокс и не определяет категории исчерпывающе. Лаконичная передача сохраняет его богословскую напряжённость и не навязывает частного толкования.
translation_notes:
  register: Современный литературный русский язык; лаконичная и ритмически уравновешенная афористическая конструкция. Тире восполняет опущенное сказуемое во второй части. Маркер сноски помещён после всего изречения, поскольку сноска разворачивает обе параллельные части.
