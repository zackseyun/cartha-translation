source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: ru
  text: 'Иисус подозвал их и сказал: «Вы знаете, что те, кого считают правителями язычников[a], господствуют над ними, и их знатные люди властвуют над ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто, по-видимому, правит народами».'
    reason: 'Сноска сохраняет две связанные неоднозначности: δοκοῦντες может означать как общественное признание, так и кажимость, а ἔθνη может быть передано как «язычники» или шире — «народы».'
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвал их
  rationale: 'Средний залог передаёт действие, направленное к говорящему: Иисус позвал учеников к себе. «Подозвал» естественно выражает это по-русски, не придавая словам оттенка официального вызова.'
- source_word: λέγει
  choice: сказал
  rationale: Греческое историческое настоящее в русском повествовании естественно передаётся прошедшим временем.
- source_word: Οἴδατε
  choice: Вы знаете
  rationale: Форма οἶδα имеет настоящее значение и прямо указывает на известное собеседникам положение вещей.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: те, кого считают правителями
  rationale: Оборот сохраняет значение общественного признания или репутации, не отрицая непременно реальность их власти. Возможный оттенок кажимости отмечен в сноске.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В данном иудейском контексте ἔθνη обозначает нееврейские народы. «Язычники» — понятный и традиционно точный русский эквивалент; более общее «народы» дано как альтернатива в сноске.
- source_word: κατακυριεύουσιν
  choice: господствуют над ними
  rationale: Глагол обозначает властное, подавляющее господство. Русское «господствуют над» сохраняет отрицательный оттенок и образ власти сверху.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: их вельможи
  rationale: Речь идёт о видных и могущественных людях. «Вельможи» передаёт высокий общественный статус, не приписывая им конкретной должности.
- source_word: κατεξουσιάζουσιν
  choice: властвуют над ними
  rationale: Перевод передаёт осуществление власти и сохраняет параллелизм, не сливая полностью этот глагол с более сильным κατακυριεύουσιν.
theological_decisions:
- issue: Референт τῶν ἐθνῶν
  choice: язычников
  alternative: народов
  rationale: В речении противопоставляется обычный для нееврейского мира порядок власти тому порядку, которому Иисус учит учеников. Вместе с тем лексически возможное более широкое значение сохранено в сноске.
- issue: Смысл δοκοῦντες
  choice: кого считают правителями
  alternative: кто, как кажется, правит
  rationale: Основной текст передаёт общественное признание этих людей правителями и не вводит утверждения, будто их власть лишь мнимая. Реальная неоднозначность δοκέω сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Вельможи» слегка возвышенно, но понятно и уместно для обозначения влиятельных лиц; синтаксис остаётся ясным для обычного читателя.
