  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: ru
  text: И приносили к Нему детей, чтобы Он прикоснулся к ним[a], но ученики упрекнули их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленьких детей». Греческое παιδία может обозначать детей вообще, в том числе малых детей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: приносили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; русское несовершенное «приносили» естественно сохраняет этот аспект и смысл представления детей Иисусу.
- source_word: παιδία
  choice: детей
  rationale: Слово обозначает детей в широком смысле и может включать малых детей; нейтральное «детей» не усиливает без необходимости оттенок малолетства.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: чтобы Он прикоснулся к ним
  rationale: Конструкция выражает цель, а ἅπτομαι непосредственно означает «касаться, прикасаться»; перевод не привносит из параллельных мест возложения рук.
- source_word: ἐπετίμησαν
  choice: запрещали
  rationale: Глагол передаёт строгое порицание или пресечение действия. В данном контексте «запрещали им» естественно выражает резкость реакции учеников и её практическую направленность.
- source_word: αὐτοῖς
  choice: им
  rationale: Местоимение наиболее естественно относится к людям, приносившим детей. Русский перевод сохраняет местоименную форму и контекстуальную соотнесённость.
- source_word: δὲ
  choice: но
  rationale: Союз отмечает контраст между действиями приносивших детей и реакцией учеников.
theological_decisions:
- issue: К кому относится упрёк учеников
  choice: Ученики запрещали людям, приносившим детей.
  alternative: Ученики порицали самих детей.
  rationale: Дательное αὐτοῖς наиболее связно относится к подразумеваемым участникам действия προσέφερον — тем, кто приносил детей. При этом местоимение «им» сохраняет формальную краткость и не устраняет полностью грамматическую неявность.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Прописное «Нему/Он» принято как уважительное обозначение Иисуса. «Приносили» лучше, чем «приводили», поскольку возраст детей не уточнён и глагол охватывает как принесение на руках, так и приведение.
