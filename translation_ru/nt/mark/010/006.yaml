  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: ru
  text: Но от начала творения «мужчиной и женщиной создал их»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужского и женского пола создал их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Но от начала творения
  rationale: Оборот сохраняет исходную точку во времени, а δέ передаётся противительным «но» в связи с предшествующим рассуждением о разводе.
- source_word: ἄρσεν καὶ θῆλυ
  choice: мужчиной и женщиной
  rationale: Русские существительные естественно передают парные обозначения человеческого мужского и женского пола в цитате из Бытия; творительный падеж обусловлен глаголом «сотворил».
- source_word: ἐποίησεν
  choice: сотворил
  rationale: Хотя обычное значение ποιέω — «делать», в данной цитате из рассказа о сотворении «сотворил» естественно по-русски и точно отражает контекст, не меняя деятеля.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение передано прямо, без добавочного «обоих», которого нет в греческом тексте.
theological_decisions:
- issue: Передача терминов пола в цитате из Бытия
  choice: мужчиной и женщиной
  alternative: мужским полом и женским
  rationale: Выбранная формулировка сохраняет различие полов и вместе с тем звучит естественно и достойно применительно к людям.
- issue: Не выраженное явно подлежащее при ἐποίησεν
  choice: сотворил их
  alternative: Бог сотворил их
  rationale: В греческом подлежащее подразумевается. Русская форма глагола также позволяет не добавлять имени «Бог», сохраняя лаконичность источника.
translation_notes:
  register: Современный литературный русский язык; сохранены противопоставление с предыдущим контекстом, порядок ключевых элементов цитаты и подразумеваемое подлежащее. Кавычки обозначают цитату из Бытия.
