  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: соединение с предыдущим высказыванием, женский субъект, развод с её мужем, последующий брак с другим мужчиной и утверждение о прелюбодеянии. Совершенный вид в «разведётся… выйдет замуж» естественно выражает последовательность действий, заданную аористным причастием и аористным конъюнктивом; настоящее «совершает» удачно передаёт μοιχᾶται.'
