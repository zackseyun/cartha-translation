base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: ru
  text: и если она разведётся со своим мужем и выйдет замуж за другого[a], то совершает прелюбодеяние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отпустив своего мужа, выйдет замуж за другого». В данном брачном контексте имеется в виду развод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Обычный соединительный союз, связывающий это высказывание с параллельным случаем в предыдущем стихе.
- source_word: ἐὰν
  choice: если
  rationale: Вводит условное придаточное; «если» естественно передаёт условный характер изречения.
- source_word: αὐτὴ
  choice: она
  rationale: Сохраняет явно выраженный субъект женского рода; усилительный оттенок местоимения по-русски не требует добавления «сама».
- source_word: ἀπολύσασα
  choice: разведётся
  rationale: Хотя буквальное значение связано с отпусканием, в брачном контексте глагол обозначает расторжение брака; совершенный вид естественно передаёт действие, предшествующее новому браку.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: со своим мужем
  rationale: В брачном контексте ἀνήρ означает «муж»; русское управление глагола «развестись» требует предлога «с», а «своим» ясно соотносит мужа с субъектом.
- source_word: γαμήσῃ ἄλλον
  choice: выйдет замуж за другого
  rationale: Идиоматическое русское выражение для вступления женщины в брак; форма ἄλλον мужского рода сохраняется в слове «другого».
- source_word: μοιχᾶται
  choice: совершает прелюбодеяние
  rationale: Прямо и достойно передаёт настоящее время и значение глагола, не заменяя поступок характеристикой женщины.
theological_decisions:
- issue: Сохранение гендерно-конкретной формулировки
  choice: «если она… выйдет замуж за другого»
  alternative: «если жена… вступит в другой брак»
  rationale: Греческий текст явно обозначает женский субъект и мужской объект; это также сохраняет намеренный параллелизм с предыдущим стихом.
- issue: Передача ἀπολύω как термина расторжения брака
  choice: «разведётся»
  alternative: «отпустит»
  rationale: В данном брачном контексте речь идёт о разводе. При этом буквальный образ отмечен в сноске, чтобы не скрывать лексическую форму оригинала.
- issue: Временное соотношение развода, нового брака и прелюбодеяния
  choice: «разведётся… выйдет… то совершает»
  alternative: «разводится… выходит… прелюбодействует»
  rationale: Условная конструкция с совершенным видом естественна по-русски и передаёт предшествование двух действий, а настоящее время главного глагола сохраняет характер морального утверждения без дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная. «Прелюбодеяние» сохраняет библейский нравственно-правовой регистр, а «разведётся» и «выйдет замуж» звучат естественно для современного читателя.
