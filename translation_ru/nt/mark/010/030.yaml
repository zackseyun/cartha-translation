  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: ru
  text: и не получил бы теперь, в это время, в сто раз больше[a] домов, братьев, сестёр, матерей, детей и полей — вместе с гонениями, а в грядущем веке[b] — вечную жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стократно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в веке, который грядёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: получил бы
  rationale: В контексте обещанного воздаяния глагол означает получение, а не активное присвоение; сослагательная форма естественно продолжает греческую условно-относительную конструкцию предыдущего стиха.
- source_word: ἑκατονταπλασίονα
  choice: в сто раз больше
  rationale: Передаёт количественный смысл «стократно» ясным современным русским выражением; область действия выражения распространяется на последующий перечень.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: уже теперь, в это время
  rationale: Сохраняет усиленное указание на настоящее и явный контраст с грядущим веком.
- source_word: οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ μητέρας καὶ τέκνα καὶ ἀγρούς
  choice: домов, братьев, сестёр, матерей, детей и полей
  rationale: Сохранены конкретные существительные, их число и отдельное упоминание братьев и сестёр; родительный падеж естественно зависит от количественного выражения.
- source_word: μετὰ διωγμῶν
  choice: вместе с гонениями
  rationale: 'Прямо сохраняет напряжение текста: обещанное обилие в настоящее время сопровождается гонениями.'
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: в грядущем веке
  rationale: αἰών обозначает век или эпоху; формулировка сохраняет эсхатологический контраст и не подменяет его физическим «миром».
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшийся и контекстуально точный русский эквивалент эсхатологического выражения.
theological_decisions:
- issue: Характер обещанного воздаяния в настоящее время
  choice: Перечень домов, родственных отношений и полей передан прямо как реальное стократное воздаяние, причём гонения также явно сохранены.
  alternative: Истолковать перечень только метафорически либо представить обещание как материальное благополучие без страданий.
  rationale: Греческий текст одновременно утверждает обильное воздаяние и гонения; перевод не должен устранять это напряжение.
- issue: Передача семейных обозначений
  choice: ἀδελφοὺς и ἀδελφὰς переданы раздельно как «братьев» и «сестёр».
  alternative: Объединить их общим словом «родных» или «братьев и сестёр» как единым соответствием только для ἀδελφοὺς.
  rationale: Источник намеренно называет мужчин и женщин отдельно, и это различие следует сохранить.
- issue: Связь стиха с предыдущим предложением
  choice: Начало передано как «и не получил бы», то есть как продолжение начатой ранее конструкции.
  alternative: Превратить фрагмент в самостоятельное утверждение, добавив отсутствующее в данном стихе подлежащее.
  rationale: ἐὰν μὴ λάβῃ синтаксически завершает относительную конструкцию стиха 29; добавление нового подлежащего могло бы скрыть эту связь.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским звучанием. Двоеточие раскрывает содержание стократного воздаяния, а тире подчёркивают два контрастных дополнения: гонения в нынешнее время и вечную жизнь в грядущем веке. Все примечания отмечены в основном тексте.'
