  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: повествовательную связку Καὶ, ситуативное εἰς τὴν οἰκίαν, учеников как субъект, θέμα περὶ τούτου и имперфект ἐπηρώτων. «Расспрашивали» уместно передаёт повторный/продолженный характер имперфекта, не навязывая обязательного инцептивного значения. Направительный оттенок εἰς в данном повествовательном контексте естественно передан как обстановка действия («в доме»).'
