  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: ru
  text: И в доме ученики снова расспрашивали Его об этом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И когда они снова были в доме, ученики расспрашивали Его об этом».'
    reason: Греческое πάλιν («снова») может относиться либо к расспрашиванию, либо к возвращению в дом.
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Обычная повествовательная связка, сохраняющая связь с предшествующей сценой без добавления более точного временного оттенка.
- source_word: εἰς τὴν οἰκίαν
  choice: в доме
  rationale: Буквально сочетание с εἰς означает «в дом», однако при глаголе расспрашивания оно описывает обстановку после входа. Русское «в доме» естественно передаёт этот ситуативно-локативный смысл.
- source_word: πάλιν
  choice: снова
  rationale: В основном тексте наречие отнесено к расспрашиванию учеников. Греческий порядок допускает и связь с возвращением в дом, поэтому иной вариант отражён в сноске.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: Определённый артикль указывает на уже известных из контекста учеников; добавлять «Его» перед существительным необязательно.
- source_word: περὶ τούτου
  choice: об этом
  rationale: Кратко и естественно передаёт отсылку к только что обсуждавшемуся вопросу о разводе.
- source_word: ἐπηρώτων
  choice: расспрашивали
  rationale: Имперфект передаёт продолжающееся или повторявшееся действие. «Расспрашивали» естественно выражает не единичный вопрос, а развёрнутое обращение за разъяснением, не добавляя явно не выраженного значения «начали».
- source_word: αὐτόν
  choice: Его
  rationale: Прямое дополнение относится к Иисусу; прописная буква соответствует принятому благоговейному оформлению местоимений в русском библейском стиле.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским достоинством. Порядок слов сделан естественным для русского, а подлинная неоднозначность связи наречия «снова» сохранена посредством сноски.
