  terminology: '«Ученики», «расспрашивали», «об этом» и написание «Его» соответствуют русскому библейскому употреблению и не вносят конфессионального толкования. Сноска обоснованно отмечает синтаксическую неопределённость области действия πάλιν: оно может характеризовать вопрос учеников либо повторное нахождение/возвращение в дом.'
