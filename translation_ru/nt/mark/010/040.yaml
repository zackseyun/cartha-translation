  source_fidelity: 'Смысловые элементы оригинала переданы верно: противопоставлены места по правую и левую сторону от Иисуса, отсутствие у Него права их даровать и их приготовленность для определённых людей. Однако в исходной русской фразе эллипсис «не Мне давать, а тем» синтаксически слишком неясен: после «а тем» не выражено, что именно относится к этим людям.'
  naturalness: Формулировка «Но сесть ... — не Мне давать, а тем» звучит для современного литературного русского неестественно и может быть понята как противопоставление субъектов действия «сесть». Явное называние подразумеваемых мест и разбиение на две части делают фразу ясной, не добавляя толкования.
  terminology: «По правую или по левую сторону от Меня» корректно передаёт пространственный параллелизм. «Не Моё право» естественно выражает ἐμὸν без догматического уточнения; в сноске сохранён более буквальный вариант. Перфектный пассив ἡτοίμασται удачно передан словом «приготовлены».
