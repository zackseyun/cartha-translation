  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: ru
  text: Но дать сесть по правую или по левую сторону от Меня — не Моё право; эти места — для тех, для кого они приготовлены[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не Мне давать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: сесть
  rationale: Субстантивированный инфинитив естественно передаётся русским инфинитивом; совершенный вид уместно обозначает занятие места.
- source_word: ἐκ δεξιῶν μου ... ἐξ εὐωνύμων
  choice: по правую или по левую сторону от Меня
  rationale: Передаёт пространственную идиому обеих параллельных конструкций без добавления слова «рука», которого в греческом тексте нет.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: не Мне давать
  rationale: Кратко и близко передаёт конструкцию принадлежности или полномочия, сохраняя неоднозначность между «не Моё право» и «не Мне предназначено» без поясняющей гармонизации.
- source_word: ἀλλ’ οἷς
  choice: а тем, для кого
  rationale: 'Восполняет греческий эллипсис минимально и естественно: подразумевается, что места будут даны тем, для кого они приготовлены.'
- source_word: ἡτοίμασται
  choice: это приготовлено
  rationale: Форма перфекта в пассиве указывает на совершённое приготовление с сохраняющимся результатом; «приготовлено» естественно выражает это состояние по-русски.
theological_decisions:
- issue: Следует ли пояснять, что ограничение власти Иисуса относится только к данному контексту или связано с волей Отца
  choice: Оставить прямое «не Мне давать» без дополнительного объяснения
  alternative: «не Мне давать независимо от воли Отца» или «не в Моей власти давать»
  rationale: Греческий текст утверждает ограничение, но не объясняет его. Добавление ссылки на волю Отца или абсолютное истолкование власти разрешило бы богословское напряжение, которое следует сохранить.
translation_notes:
  register: Современный литературный русский язык; речь краткая и достойная. Заглавная буква в «Меня/Мне» соответствует принятому благоговейному оформлению речи Иисуса. Конструкция «по правую или по левую сторону» понятна современному читателю и сохраняет параллелизм оригинала.
