- from: Но сесть по правую или по левую сторону от Меня — не Мне давать[a], а тем, для кого это приготовлено.
  to: Но дать сесть по правую или по левую сторону от Меня — не Моё право; эти места — для тех, для кого они приготовлены[a].
  rationale: Перестроена только русская синтаксическая передача эллиптического противопоставления. «Эти места» — минимальное восполнение объекта, уже подразумеваемого инфинитивом «дать сесть» и контекстом просьбы; оно не определяет, кем приготовлены места и почему Иисус их не даёт. Основное выражение «не Моё право» естественно для современного русского, а более близкое к форме оригинала «не Мне давать» сохранено в сноске.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:40:40Z'
