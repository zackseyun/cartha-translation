  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ru
  text: 'Многие бранили его, чтобы он замолчал, но он ещё сильнее кричал: «Сын Давида[a], помилуй меня!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сын Давида» — царско-мессианский титул; по смыслу его можно передать словом «Мессия», однако здесь сохранена формулировка греческого текста.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: строго велели
  rationale: Передаёт силу ἐπιτιμάω в данном контексте как настойчивое порицание с требованием замолчать; имперфект в сочетании с последующим инфинитивным смыслом отражён контекстуально.
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное переведено прямо, без добавления отсутствующего в греческом слова «толпа».
- source_word: ἵνα σιωπήσῃ
  choice: замолчать
  rationale: Естественная русская конструкция после «велели» ясно передаёт цель требования молчать.
- source_word: πολλῷ μᾶλλον
  choice: ещё настойчивее
  rationale: Передаёт усиление действия, не сводя его лишь к громкости, которая прямо не названа в греческом.
- source_word: ἔκραζεν
  choice: кричал
  rationale: Имперфект обозначает продолжавшийся крик; русский несовершенный вид сохраняет эту длительность.
- source_word: Υἱὲ Δαυίδ
  choice: Сын Давида
  rationale: Буквально сохраняет царско-мессианский титул и его библейскую значимость.
- source_word: ἐλέησόν με
  choice: помилуй меня
  rationale: Естественная и достоинственная русская форма настойчивой просьбы, точно передающая ἐλεέω.
theological_decisions:
- issue: Мессианское значение обращения «Сын Давида»
  choice: Сохранить обращение «Сын Давида» без замены толкованием.
  alternative: «Мессия, помилуй меня!»
  rationale: В греческом тексте непосредственно употреблён титул Υἱὲ Δαυίδ. Его сохранение передаёт формулировку источника и не устраняет заложенное в ней мессианское значение.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Несовершенный вид «кричал» передаёт продолжительность действия, а «ещё настойчивее» сохраняет усиление, не добавляя прямо не указанной громкости.
