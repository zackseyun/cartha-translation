  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: ru
  text: Он же, помрачнев от этих слов[a], ушёл опечаленный, потому что у него было много имущества.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. «помрачнев при этом слове»; возможно также: «пав духом от этих слов» или «приуныв от сказанного». Греческое слово может указывать на заметно помрачневшее выражение лица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: помрачнев
  rationale: Причастие передаёт заметную мрачную реакцию, вероятно отразившуюся на лице. «Помрачнев» сохраняет образ и не сводит его только к внутреннему унынию.
- source_word: ἐπὶ τῷ λόγῳ
  choice: от этих слов
  rationale: Оборот обозначает причину или повод реакции. В русском контексте естественно множественное «слова», относящееся к только что сказанному Иисусом, хотя греческое λόγῳ стоит в единственном числе.
- source_word: ἀπῆλθεν
  choice: ушёл
  rationale: Естественно передаёт движение прочь без излишне высокого или архаичного оттенка.
- source_word: λυπούμενος
  choice: опечаленный
  rationale: Передаёт продолжающуюся печаль, с которой человек уходит; контекстуально естественнее буквального причастия «печалясь».
- source_word: κτήματα πολλά
  choice: много имущества
  rationale: κτήματα обозначает собственность, владения или имущество, а πολλά — их значительный объём. Выражение «много имущества» ясно и естественно по-русски.
- source_word: ἦν γὰρ ἔχων
  choice: потому что у него было
  rationale: Естественная русская передача перифрастической конструкции, обозначающей устойчивое обладание.
theological_decisions:
- issue: Характер эмоциональной реакции человека на слова Иисуса
  choice: Сохранены видимое помрачнение и печаль без дополнительной нравственной оценки.
  alternative: Истолковать реакцию как гнев, неповиновение или лишь разочарование.
  rationale: Греческий текст прямо говорит о мрачной реакции и печали, но не называет её гневом и не даёт здесь явной нравственной квалификации.
translation_notes:
  register: Современный литературный русский язык; повествование звучит просто и достойно. «Помрачнев» сохраняет наглядность греческого глагола, а «имущество» охватывает собственность и владения без архаичного оттенка.
