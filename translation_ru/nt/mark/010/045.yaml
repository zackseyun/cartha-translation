source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ru
  text: Ведь и Сын Человеческий пришёл не для того, чтобы Ему служили, но чтобы служить и отдать Свою жизнь как выкуп за многих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как выкуп вместо многих». Употреблённый здесь предлог может выражать замену или обмен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь и
  rationale: Сочетание вводит обоснование предыдущих слов и одновременно подчёркивает пример Сына Человеческого; «ведь и» естественно передаёт обе функции.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшееся самоназвание Иисуса, сохраняющее связь с ветхозаветным образом и не сводящее выражение к общему обозначению человека.
- source_word: οὐκ ἦλθεν
  choice: пришёл не для того
  rationale: Инфинитивы далее выражают цель прихода; такая русская конструкция ясно и естественно передаёт синтаксическую связь.
- source_word: διακονηθῆναι / διακονῆσαι
  choice: чтобы Ему служили / чтобы служить
  rationale: Повтор одного русского корня сохраняет риторическое противопоставление пассивного и активного действия.
- source_word: δοῦναι
  choice: отдать
  rationale: В сочетании с «жизнь» глагол «отдать» естественно выражает добровольную её отдачу, не добавляя идеи насильственной передачи.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: Свою жизнь
  rationale: Здесь ψυχή означает жизнь, отдаваемую до смерти, а не отдельно понимаемую нематериальную душу.
- source_word: λύτρον
  choice: выкуп
  rationale: «Выкуп» кратко и понятно передаёт цену освобождения и сохраняет метафорическую и богословскую насыщенность термина.
- source_word: ἀντὶ πολλῶν
  choice: за многих
  rationale: Это естественная русская формулировка, однако она может не полностью выявлять присущий ἀντί смысл замещения; он сохранён в примечании.
theological_decisions:
- issue: Смысл ἀντί в выражении λύτρον ἀντὶ πολλῶν
  choice: «выкуп за многих» в основном тексте с пояснением «вместо многих» в примечании
  alternative: «выкуп вместо многих»
  rationale: Предлог ἀντί естественно несёт значение замены или обмена. Основной вариант остаётся благозвучным и понятным по-русски, а примечание делает замещающий оттенок явным, не снимая богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавные местоимения «Ему», «Свою» использованы в соответствии с распространённой русской библейской традицией; синтаксис сохраняет краткость и параллелизм исходного высказывания.
