  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: ru
  text: 'Они сказали Ему: «Дай нам сесть в Твоей славе: одному — по правую руку от Тебя, другому — по левую».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: Позволь нам
  rationale: В данном контексте просьбы естественно передаёт греческую конструкцию буквально означающую «дай нам, чтобы», не теряя смысла испрашиваемого дозволения.
- source_word: εἷς ... καὶ εἷς
  choice: одному ... а другому
  rationale: Ясно передаёт распределение двух просителей по двум почётным местам; принадлежность к говорящим понятна из «нам».
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: по правую руку ... по левую
  rationale: Сохраняет пространственный и почётный смысл устойчивыми русскими выражениями.
- source_word: ἐν τῇ δόξῃ σου
  choice: в Твоей славе
  rationale: Формально сохраняет богословски ёмкое выражение, не уточняя его как царство, престол или явление славы.
theological_decisions:
- issue: Значение «в Твоей славе»
  choice: Сохранено без поясняющей конкретизации
  alternative: «когда Ты войдёшь в Свою славу» или «в Твоём славном Царстве»
  rationale: Греческий текст говорит именно о пребывании/сидении «в славе» и оставляет характер славы открытым; добавочная временная или царственная конкретизация разрешила бы эту ёмкость за текст.
translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно и вместе с тем сохраняет торжественное «в Твоей славе». Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с принятым благоговейным издательским регистром.
