  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: ru
  text: Был третий час[a], и они распяли Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть около девяти часов утра, согласно обычному иудейскому счёту времени.
    reason: Культурно-историческое пояснение древнего обозначения времени.
lexical_decisions:
- source_word: Ἦν
  choice: был
  rationale: Имперфект εἰμί в сочетании с обозначением времени естественно передаётся по-русски конструкцией «был третий час».
- source_word: δὲ
  choice: и
  rationale: Здесь δέ служит мягкой повествовательной связкой без выраженного противопоставления; союз «и» естественно передаёт продолжение рассказа.
- source_word: ὥρα τρίτη
  choice: третий час
  rationale: Буквальная передача сохраняет древнее обозначение времени и не вносит в основной текст его современный пересчёт.
- source_word: ἐσταύρωσαν
  choice: распяли
  rationale: Стандартный и точный русский эквивалент глагола, обозначающего казнь через распятие.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятой в русском библейском стиле уважительной орфографии, не меняя смысла исходного текста.
theological_decisions:
- issue: Передача времени в связи с хронологией распятия
  choice: Сохранить в основном тексте выражение «третий час».
  alternative: Передать как «около девяти часов утра».
  rationale: Сам стих использует древнее обозначение времени и не переводит его в современную систему. Буквальная передача сохраняет имеющуюся хронологическую напряжённость и не навязывает способ согласования; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Синтаксис близок к греческому, но естественен для русского читателя.
