lexical_decisions:
- source_word: ἦν δὲ
  choice: А … был
  rationale: δέ — мягкая повествовательная связка; «а» естественно продолжает рассказ, не придавая выражению временного значения. ἦν передано формой «был».
- source_word: ὁ λεγόμενος
  choice: человек по имени
  rationale: Субстантивированное причастие обозначает человека, носившего это имя. Русское «человек по имени» звучит естественно и не несёт неодобрительного оттенка выражения «так называемый».
- source_word: Βαραββᾶς
  choice: Варавва
  rationale: Традиционная русская передача личного имени, хорошо узнаваемая читателями.
- source_word: μετὰ τῶν στασιαστῶν
  choice: вместе с мятежниками
  rationale: στασιασταί обозначает участников мятежа или восстания. «Мятежники» ясно передаёт политико-уголовный контекст и сохраняет связь с στάσις.
- source_word: δεδεμένος
  choice: был связан
  rationale: Перфектное страдательное причастие от δέω буквально описывает состояние связанного человека; контекст предполагает содержание под стражей, но перевод сохраняет конкретный образ исходного текста.
- source_word: οἵτινες
  choice: которые
  rationale: Относительное местоимение вводит характеристику мятежников; нейтральное «которые» точно выполняет эту функцию.
- source_word: ἐν τῇ στάσει
  choice: во время мятежа
  rationale: στάσις здесь означает мятеж или восстание. «Во время мятежа» естественно передаёт обстоятельство события и сохраняет лексическую связь со словом «мятежники».
- source_word: φόνον πεποιήκεισαν
  choice: совершили убийство
  rationale: Конструкция указывает на совершённое ранее действие. Единственное число φόνον передано как «убийство» без уточнения числа погибших или личности жертвы.
