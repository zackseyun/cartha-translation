id: MRK.15.1
reference: Mark 15:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: ru
  text: И тотчас, рано утром, первосвященники вместе со старейшинами, книжниками и всем Советом[a] провели совещание. Затем они связали Иисуса, отвели Его и передали Пилату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем синедрионом». Греческое слово συνέδριον обозначает иудейский высший совет.'
    reason: Сохраняется общеизвестное историческое название учреждения как альтернативный вариант.
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для Марка стремительность повествования и сохраняет торжественный, но современный регистр.
- source_word: πρωῒ
  choice: рано утром
  rationale: Ясно выражает указание на раннее утреннее время.
- source_word: συμβούλιον ποιήσαντες
  choice: провели совещание
  rationale: Естественно передаёт греческую идиому о совместном официальном обсуждении, не сводя её лишь к составлению плана.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение ведущих представителей священнической власти; множественное число не подразумевает одновременного служения нескольких действующих первосвященников.
- source_word: πρεσβυτέρων
  choice: старейшины
  rationale: В данном контексте речь идёт о признанных руководителях, а не просто о пожилых людях.
- source_word: γραμματέων
  choice: книжники
  rationale: Краткий и традиционно понятный русский термин для знатоков и толкователей Закона.
- source_word: ὅλον τὸ συνέδριον
  choice: весь Совет
  rationale: Передаёт значение иудейского правящего собрания понятным русским словом; историческое название «синедрион» вынесено в примечание.
- source_word: δήσαντες
  choice: связали
  rationale: Прямо передаёт действие, совершённое перед отведением Иисуса.
- source_word: ἀπήνεγκαν
  choice: отвели
  rationale: В контексте содержания под стражей естественно обозначает принудительное препровождение, не создавая впечатления, будто Иисуса несли.
- source_word: παρέδωκαν
  choice: передали
  rationale: Сохраняет судебно-правовой смысл передачи Иисуса под власть Пилата без добавления богословских выводов.
- source_word: Πιλάτῳ
  choice: Пилату
  rationale: Стандартная русская форма имени в дательном падеже.
theological_decisions:
- issue: Значение συνέδριον
  choice: «весь Совет» в основном тексте
  alternative: «весь синедрион»
  rationale: Перевод делает функцию учреждения понятной современному читателю, а примечание сохраняет его точное историческое наименование.
- issue: Смысл παρέδωκαν в повествовании о страстях
  choice: «передали» с судебно-правовым оттенком
  alternative: «выдали» или «предали»
  rationale: «Передали» точно обозначает переход под власть римского правителя и не привносит в сам стих дополнительных оценочных или доктринальных смыслов.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным библейским звучанием. Длинная греческая конструкция разделена на два предложения ради естественности и удобства чтения; последовательность действий сохранена. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
