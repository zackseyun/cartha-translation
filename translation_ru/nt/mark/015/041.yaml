  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: ru
  text: Они[a], когда Он был в Галилее, следовали за Ним и служили Ему; а также было много других женщин, которые вместе с Ним пришли в Иерусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть женщины, названные в предыдущем стихе.
    reason: Уточняет, что греческое относительное местоимение αἳ отсылает к женщинам, названным в предыдущем стихе.
  - marker: b
    text: 'Буквально: «которые взошли с Ним в Иерусалим»; в библейской речи о пути в Иерусалим обычно говорится «восходить».'
    reason: Поясняет традиционный библейский образ восхождения в Иерусалим, сохранённый в греческом глаголе συναναβᾶσαι.
lexical_decisions:
- source_word: αἳ
  choice: Они
  rationale: Относительное местоимение женского рода множественного числа отсылает к женщинам, названным в предыдущем стихе. Русское «они» естественно сохраняет эту связь без повторения существительного.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: когда Он был в Галилее
  rationale: Прямо и естественно передаёт временное придаточное и местонахождение Иисуса.
- source_word: ἠκολούθουν
  choice: следовали за Ним
  rationale: Имперфект описывает продолжавшееся или обычное действие в прошлом. В контексте «когда Он был в Галилее» русский несовершенный вид естественно выражает эту длительность без добавления громоздкого «имели обыкновение».
- source_word: διηκόνουν αὐτῷ
  choice: служили Ему
  rationale: Передаёт практическую помощь и поддержку, сохраняя широкое значение διακονέω и не вводя представления о формальной церковной должности.
- source_word: ἄλλαι πολλαὶ
  choice: много других женщин
  rationale: Женский род ясен из греческой формы и контекста; существительное «женщин» необходимо для естественного русского выражения.
- source_word: αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα
  choice: с Ним в Иерусалим пришло
  rationale: Передаёт совместное предшествующее путешествие в Иерусалим. «Пришло» звучит естественнее в современном русском основном тексте, тогда как буквальный образ восхождения сохранён в примечании.
theological_decisions:
- issue: Характер служения женщин, выраженный глаголом διηκόνουν
  choice: служили Ему
  alternative: заботились о Нём / помогали Ему
  rationale: «Служили» сохраняет широту практической помощи и поддержки, не сводя её к домашним обязанностям и не приписывая женщинам формальную церковную должность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Прописные местоимения при обращении к Иисусу соответствуют принятому русскому библейскому регистру. Порядок второй части слегка перестроен ради естественного синтаксиса; смысл и женский референт сохранены.
