translation:
  language: ru
  text: 'И исполнилось Писание, в котором сказано: «И был причислен к беззаконникам».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в самых ранних греческих рукописях, включая Синайский и Ватиканский кодексы IV века, а также в ранних коптских переводах, но сохранился в византийской традиции большинства рукописей и в латинской традиции. Вероятно, позднейшие переписчики добавили его для согласования с Лк. 22:37, где цитируется Исайя 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω
  choice: исполнилось
  rationale: В контексте пророческого Писания это естественная и точная передача пассивной формы, указывающей на осуществление сказанного.
- source_word: ἄνομος
  choice: беззаконники
  rationale: Сохраняет связь с законом, заложенную в греческом слове, и соответствует пророческому контексту Исайи 53:12; более узкое «преступники» могло бы свести смысл лишь к уголовному преступлению.
- source_word: λογίζομαι
  choice: причислен
  rationale: 'Точно передаёт пассивный смысл: он был отнесён к определённой группе и поставлен в один ряд с её представителями.'
- source_word: γραφὴ ἡ λέγουσα
  choice: Писание, в котором сказано
  rationale: Естественная современная русская формулировка, сохраняющая указание на конкретное изречение Писания.
theological_decisions:
- issue: Связь цитаты с Исайей 53:12 и её применение к Иисусу
  choice: Сохранена краткая форма мужского рода «причислен» без добавления имени или пояснения субъекта
  alternative: «Он был причислен» или «Иисус был причислен»
  rationale: Греческий текст не называет субъекта явно; краткая форма позволяет сохранить эту синтаксическую сжатость и мессианское применение в контексте, не добавляя отсутствующих слов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. «Беззаконники» сохраняет богословскую и лексическую связь с законом, а «причислен» звучит естественнее буквального «сосчитан» и точнее передаёт отнесение к группе.
