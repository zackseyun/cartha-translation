  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: ru
  text: После того как они насмеялись над Ним, они сняли с Него пурпурное одеяние[a] и надели на Него Его собственные одежды. Затем Его вывели, чтобы распять Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пурпур»; подразумевается предмет одежды. Возможные переводы: «пурпурная одежда» или «пурпурный плащ».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблена конструкция, выражающая цель: «чтобы распять Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν αὐτῷ
  choice: вдоволь насмеялись над Ним
  rationale: Глагол означает глумление, насмешку над кем-либо; конструкция с ὅτε и аористом передаёт завершённое действие. «Вдоволь насмеялись» естественно выражает смысл «когда закончили глумиться», не смягчая унижения.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: сняли с Него пурпурное одеяние
  rationale: Глагол обозначает снятие одежды с человека. Поскольку πορφύρα здесь буквально означает «пурпур» с подразумеваемым предметом одежды, нейтральное «одеяние» сохраняет контекст без излишне точного определения фасона.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: одели Его в Его собственную одежду
  rationale: Переданы и действие облачения, и эмфатическое τὰ ἴδια — принадлежность одежды самому Иисусу. Единственное собирательное «одежду» естественно для современного русского языка.
- source_word: ἐξάγουσιν αὐτόν
  choice: Его вывели
  rationale: Историческое настоящее греческого повествования естественно передаётся русским прошедшим временем; «вывели» точно выражает движение наружу под стражей.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: чтобы распять
  rationale: Союз «чтобы» сохраняет явно выраженное греческой конструкцией значение цели; повторение местоимения в русском не требуется, поскольку объект понятен из предыдущей части.
theological_decisions:
- issue: Описание унижения Иисуса перед распятием
  choice: 'Передать последовательность действий прямо, без дополнительных толкований: глумление, снятие пурпурной одежды, возвращение собственной одежды и выведение на распятие.'
  alternative: Уточнить пурпурную одежду как царскую мантию и явно назвать действующих лиц в каждом предложении.
  rationale: Текст подразумевает пародию на царское достоинство, но в данном стихе не называет одежду «царской» и не повторяет субъект. Перевод не вносит этого пояснения в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о Страстях. Синтаксис сделан естественным для русского; историческое настоящее передано прошедшим временем. Заглавные буквы в местоимениях об Иисусе соответствуют принятому благоговейному библейскому регистру.
