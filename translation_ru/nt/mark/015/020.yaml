  source_fidelity: Наречие «вдоволь» не имеет соответствия в греческом ἐνέπαιξαν и добавляет оттенок продолжительности/пресыщения. «Собственную одежду» в единственном числе несколько сглаживает греческое множественное τὰ ἱμάτια τὰ ἴδια; «свои одежды» точнее. Целевая конструкция передана верно, но прямое дополнение «Его» лучше сохранить.
  naturalness: Исправленный текст остаётся современным литературным русским. «После того как они насмеялись над Ним» естественнее, чем «вдоволь насмеялись», а «надели на Него Его собственные одежды» ясно передаёт последовательность действий.
  terminology: «Пурпурное одеяние» — нейтральное и уместное обозначение подразумеваемого предмета одежды; сноска сохраняет лексическую неопределённость πορφύρα. «Распять» точно передаёт σταυρόω. Благоговейное написание местоимений последовательно сохранено.
