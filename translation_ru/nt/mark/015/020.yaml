    rationale: ἐνέπαιξαν обозначает насмешку/глумление, но не сообщает, что действующие лица делали это «вдоволь».
  - severity: low
    issue: «Собственную одежду» передаёт множественное число τὰ ἱμάτια менее точно.
    rationale: Хотя собирательное единственное возможно по-русски, «собственные одежды» сохраняет множественность исходного текста и не звучит архаично в данном регистре.
  - severity: low
    issue: Сноска b предлагает вариант, который не воспроизводит прямо цель, выраженную ἵνα.
    rationale: Формулировка «повели Его на распятие» естественна, но переводит цель как направление; лучше пояснить саму целевую конструкцию без такого альтернативного перевода.
