    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: проходившие мимо
  rationale: Причастие обозначает людей, проходивших мимо места казни, и передаёт продолжающееся действие.
- source_word: ἐβλασφήμουν
  choice: поносили
  rationale: В данном контексте глагол означает оскорбительную, хулительную речь против Иисуса; «поносили» сохраняет силу выражения, не сужая его до технического значения «богохульствовали».
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: качая головами
  rationale: Естественное русское выражение для жеста насмешки и презрения.
- source_word: Οὐὰ
  choice: Эй!
  rationale: Междометие здесь вводит насмешливое обращение. «Эй!» естественно передаёт оклик, хотя оттенок злорадной насмешки также можно выразить как «Ага!».
- source_word: ὁ καταλύων
  choice: разрушающий
  rationale: Артикль с причастием употреблён как прямое обращение; буквальная форма сохраняет насмешливую отсылку к предъявленному обвинению.
- source_word: ναὸν
  choice: храм
  rationale: Общепонятный русский эквивалент; возможное более узкое значение «святилище» вынесено в примечание.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: строящий его за три дня
  rationale: Греческий глагол буквально означает «строить», а «за три дня» естественно передаёт срок совершения действия. Контекстуальное «восстанавливающий» отмечено в примечании.
theological_decisions:
- issue: Смысл речения о храме
  choice: Передать слова насмешников как обвинительную отсылку без пояснения, что храм означает тело Иисуса.
  alternative: В основном тексте истолковать храм как тело Иисуса.
  rationale: Марк в этом стихе передаёт насмешку прохожих. Перевод должен сохранять повествовательную перспективу и не разрешать межтекстовое и богословское напряжение посредством добавленного толкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный и выразительный. Синтаксис сохраняет незавершённость реплики, поскольку предложение продолжается в следующем стихе. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции.
