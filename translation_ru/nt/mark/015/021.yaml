  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: ru
  text: Они принудили[b] одного прохожего — Симона из Кирены, шедшего с поля[a], отца Александра и Руфа, — нести крест Иисуса[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шедшего из сельской местности»; греческое слово может означать поле или сельскую местность.'
    reason: lexical_alternative
  - marker: b
    text: Глагол подразумевает принудительное привлечение к службе или повинности.
    reason: cultural_note
  - marker: c
    text: Некоторые понимают здесь конкретно поперечную перекладину, однако в греческом тексте сказано просто «крест».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: принудили
  rationale: Глагол обозначает принудительное привлечение к службе или повинности, а не просьбу; «принудили» ясно передаёт насильственный характер действия.
- source_word: παράγοντά τινα
  choice: одного прохожего
  rationale: Причастие указывает на человека, проходившего мимо, а неопределённое местоимение τινα передано естественным русским оборотом «одного прохожего».
- source_word: Σίμωνα Κυρηναῖον
  choice: Симона Киринеянина
  rationale: Имя передано традиционной транслитерацией, а географическое определение — принятым русским наименованием жителя Кирены.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: шедшего с поля
  rationale: Сохраняется широкий смысл ἀγρός — «поле, сельская местность» — без добавления отсутствующей в тексте мысли о возвращении.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: отца Александра и Руфа
  rationale: Определяющее приложение сохранено прямо, без предположений о том, почему эти имена были известны первым читателям.
- source_word: ἵνα ἄρῃ
  choice: нести
  rationale: После глагола принуждения русский инфинитив естественно выражает цель; в данном контексте αἴρω означает взять на себя и нести.
- source_word: σταυρὸν
  choice: крест
  rationale: Греческое слово означает «крест» и само по себе не уточняет, шла ли речь только о поперечной перекладине.
- source_word: αὐτοῦ
  choice: его
  rationale: Местоименная форма оригинала сохранена; в контексте местоимение относится к Иисусу, но имя не подставляется вместо него.
theological_decisions:
- issue: Характер принуждения Симона
  choice: Симона принудили нести крест.
  alternative: Симона лишь попросили или добровольно привлекли.
  rationale: ἀγγαρεύω обозначает принудительную повинность; более мягкая формулировка ослабила бы повествовательный смысл.
- issue: Какой именно предмет нёс Симон
  choice: крест
  alternative: поперечная перекладина креста
  rationale: Исторически могла подразумеваться перекладина, однако σταυρός в данном стихе не содержит такого уточнения, поэтому перевод не сужает значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Одного прохожего» звучит естественно и передаёт случайность встречи; конструкция с тире делает длинное приложение ясным. Местоимение «его» оставлено со строчной буквы как обычное местоимение оригинала, без внесения конфессиональной редакционной практики.
