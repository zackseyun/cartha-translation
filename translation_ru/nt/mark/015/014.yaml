  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: ru
  text: 'Пилат же продолжал спрашивать их: «Ведь какое зло он сделал?» Но они закричали ещё громче: «Распни его!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: продолжал спрашивать
  rationale: Имперфект передаёт продолжающуюся или повторяемую речь; по контексту речь является вопросом. Такая формулировка естественна по-русски и не задаёт точного числа повторений.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Какое зло он сделал?
  rationale: Фраза требует назвать основание обвинения. Русский вопрос естественно передаёт γάρ контекстуально, без отдельного «ведь», а κακόν сохраняется как «зло» с его нравственно-правовой силой.
- source_word: κακόν
  choice: зло
  rationale: Слово обозначает дурное или злое деяние; «зло» не ослабляет нравственную весомость вопроса.
- source_word: περισσῶς
  choice: ещё громче
  rationale: Наречие усиливает реакцию толпы. В сочетании с глаголом крика эта формулировка естественно выражает нарастание силы возгласов.
- source_word: ἔκραξαν
  choice: закричали
  rationale: Глагол передаёт громкий публичный возглас; «закричали» ясно и естественно звучит в современном русском языке.
- source_word: Σταύρωσον αὐτόν
  choice: Распни его!
  rationale: Прямое повеление Пилату передано кратко и энергично, в соответствии с формой греческого императива.
- source_word: δὲ
  choice: же / но
  rationale: В первой части частица обозначает переход и лёгкое противопоставление, естественно переданное словом «же»; во второй контраст с вопросом Пилата выражен союзом «но».
- source_word: Πιλᾶτος
  choice: Пилат
  rationale: Использована общепринятая русская форма имени.
theological_decisions:
- issue: Степень нравственной силы слова κακόν в вопросе Пилата
  choice: «зло»
  alternative: «дурного» / «плохого»
  rationale: «Зло» сохраняет нравственно-правовую весомость греческого слова и не смягчает вызов, заключённый в вопросе Пилата, при этом не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранены достоинство повествования, контраст между вопросом Пилата и криком толпы, а также аспектуальная длительность ἔλεγεν.
