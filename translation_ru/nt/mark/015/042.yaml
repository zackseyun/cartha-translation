  text: Καὶ ἤδη ὀψίας γενομένης, ἐπεὶ ἦν παρασκευή, ὅ ἐστιν ⸀προσάββατον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: ru
  text: И когда уже настал вечер[a], поскольку был день приготовления[b], то есть день перед субботой[c], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда уже стало вечереть».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «приготовление»; так назывался день подготовки к субботе.'
    reason: cultural_note
  - marker: c
    text: 'Или: «канун субботы»; имеется в виду день перед субботой, традиционно пятница.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет характерную для Марка сочинительную связь и естественно продолжает повествование.
- source_word: ἤδη ὀψίας γενομένης
  choice: когда уже настал вечер
  rationale: Генитив абсолютный передан временным придаточным; «уже» сохраняет ἤδη, а «настал вечер» естественно выражает γενομένης в современном русском языке.
- source_word: ἐπεὶ
  choice: поскольку
  rationale: Передаёт причинно-пояснительное значение союза в данном контексте.
- source_word: παρασκευή
  choice: день приготовления
  rationale: В контексте это установленное обозначение дня подготовки к субботе; добавление слова «день» делает календарный смысл ясным, не подменяя термин словом «пятница».
- source_word: ὅ ἐστιν
  choice: то есть
  rationale: Естественная русская формула пояснения.
- source_word: προσάββατον
  choice: день перед субботой
  rationale: Прямо и понятно передаёт значение редкого слова, сохраняя данное Марком пояснение и не сужая его до названия дня недели.
