base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: ru
  text: 'Так же и первосвященники вместе с книжниками, насмехаясь, говорили между собой[a]: «Других он спас, а себя спасти не может».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первосвященники, насмехаясь между собой с книжниками, говорили». Греческое сочетание допускает, что «между собой» прежде всего относится к взаимному общению первосвященников, при участии книжников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: так же
  rationale: Передаёт сопоставление с насмешками, описанными непосредственно перед этим, и естественно звучит по-русски.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение ведущих представителей храмового священства; форма множественного числа не означает, что все они одновременно занимали единственную должность первосвященника.
- source_word: ἐμπαίζοντες
  choice: насмехаясь
  rationale: Передаёт презрительную, издевательскую направленность действия и сохраняет обстоятельственную форму греческого причастия.
- source_word: πρὸς ἀλλήλους
  choice: друг другу
  rationale: 'Сохраняет взаимное направление речи: они обменивались этими насмешливыми словами между собой.'
- source_word: μετὰ τῶν γραμματέων
  choice: вместе с книжниками
  rationale: Ясно показывает, что книжники участвовали в речи и насмешке вместе с первосвященниками.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид русского глагола естественно передаёт продолженное или повторявшееся действие греческого имперфекта.
- source_word: Ἄλλους ἔσωσεν
  choice: Других он спас
  rationale: Глагол «спас» сохраняет широкий смысл σῴζω — спасти, избавить — и иронию реплики; совершенный вид соответствует греческому аористу.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: а себя спасти не может
  rationale: Естественно передаёт отрицание способности и повторяет корень «спас-», как и греческий текст повторяет σῴζω.
theological_decisions:
- issue: Единообразная передача σῴζω в обеих частях насмешки
  choice: спас ... спасти
  alternative: избавил ... избавить
  rationale: Повтор одного русского корня сохраняет словесную связь и богословскую иронию оригинала, не сужая смысл до исключительно духовного или исключительно физического спасения.
- issue: Регистр местоимений, относящихся к Иисусу
  choice: он ... себя со строчной буквы
  alternative: Он ... Себя
  rationale: В греческом тексте нет особого графического почтительного выделения; строчные буквы соответствуют обычной современной русской повествовательной норме и не добавляют конфессиональной редакционной традиции.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Порядок слов сохраняет параллель между «других он спас» и «себя спасти не может», а восклицательный знак передаёт характер язвительной насмешки.
