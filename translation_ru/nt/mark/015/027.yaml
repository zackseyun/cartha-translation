  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: ru
  text: 'И вместе с Ним распинают двух разбойников[a]: одного справа от Него, другого слева.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бандитов»; возможно, «мятежников», если слово имеет политический оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Сочетание σύν с дательным падежом выражает совместность; этот вариант естественно передаёт сопровождение и связь казней.
- source_word: σταυροῦσιν
  choice: распинают
  rationale: Настоящее время сохраняет характерное для повествования Марка историческое настоящее и его живость.
- source_word: δύο λῃστάς
  choice: двух разбойников
  rationale: λῃστής обозначает разбойника или бандита и иногда может иметь оттенок участника вооружённого мятежа. «Разбойники» — широкое и понятное соответствие, не навязывающее политического смысла.
- source_word: ἕνα ἐκ δεξιῶν
  choice: одного справа от Него
  rationale: Оборот указывает на пространственное положение по правую сторону; по-русски естественно «справа от Него».
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: другого слева
  rationale: εὐώνυμος здесь обозначает левую сторону. «Другого» естественно передаёт параллельное противопоставление ἕνα… ἕνα, а принадлежность позиции Иисусу ясна из первой части.
theological_decisions:
- issue: Значение λῃσταί в рассказе о распятии
  choice: разбойники
  alternative: бандиты; возможно, мятежники
  rationale: Сам стих не требует политически более узкого значения «мятежники». Основной текст сохраняет широкое значение, а примечание сообщает о возможных оттенках.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Историческое настоящее сохранено. Заглавная буква в местоимении «Ним/Него» соответствует принятому русскому благоговейному оформлению, не меняя смысла оригинала.
