  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: ru
  text: Иисус же, издав громкий крик, испустил последний вздох.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Мягкая соединительно-противительная частица здесь передаёт повествовательный переход и смысловой контраст; «но» естественно звучит в кульминации эпизода.
- source_word: ἀφεὶς
  choice: издав
  rationale: Причастие от ἀφίημι в сочетании с φωνή означает испустить, издать звук; русское «издав» точно и естественно сочетается со словом «крик».
- source_word: φωνὴν μεγάλην
  choice: громкий крик
  rationale: φωνή может означать голос, звук или крик, а μεγάλην здесь указывает на силу и громкость; в данном контексте естественный эквивалент — «громкий крик».
- source_word: ἐξέπνευσεν
  choice: испустил дух
  rationale: Глагол буквально связан с выдыханием и идиоматически обозначает смерть. Устойчивое русское выражение «испустил дух» сохраняет телесный образ и торжественный регистр, не добавляя формулировок из параллельных евангельских повествований.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Но Иисус
  rationale: Артикль перед именем отдельно не передаётся; частица δέ выражена союзом «но».
theological_decisions:
- issue: Передача смерти Иисуса без привнесения дополнительного богословского смысла
  choice: испустил дух
  alternative: умер
  rationale: Фраза передаёт идиоматическое значение ἐκπνέω и сохраняет образ последнего выдоха. Она не означает, что Иисус «отдал дух», как в формулировках других Евангелий, и потому не гармонизирует данный стих с параллельными местами.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная повествовательная фраза. «Издав громкий крик» понятно широкому читателю, а «испустил дух» сохраняет достоинство и образность оригинала.
