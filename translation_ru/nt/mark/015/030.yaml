base_translation:
  language: en
  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: ru
  text: Спаси себя[a], сойдя с креста!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Спаси себя — сойди с креста!»'
    reason: Греческое причастие можно понимать как сопутствующее действие и передать двумя тесно связанными повелениями.
lexical_decisions:
- source_word: σῶσον
  choice: Спаси
  rationale: Аористный императив второго лица единственного числа передаёт насмешливое повеление. «Спаси» непосредственно соответствует глаголу и сохраняет связь с языком спасения, не сводя смысл лишь к физическому избавлению.
- source_word: σεαυτόν
  choice: себя
  rationale: Возвратное местоимение является прямым дополнением и сохраняет насмешливую направленность требования на самого Иисуса.
- source_word: καταβάς
  choice: сойдя
  rationale: Аористное действительное причастие естественно передаётся русским деепричастием. Такой вариант сохраняет зависимую форму греческой конструкции и не превращает её без необходимости во второе самостоятельное повеление.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: с креста
  rationale: Обычное и естественное русское обозначение движения вниз и прочь от креста в данном контексте.
theological_decisions:
- issue: Связь причастия καταβάς с повелением σῶσον
  choice: 'Сохранить причастную зависимость: «Спаси себя, сойдя с креста!»'
  alternative: «Спаси себя — сойди с креста!» или «Спаси себя, спустившись с креста!»
  rationale: Греческая сжатая насмешка допускает понимание причастия как сопутствующего действия или как указания на способ спасения. Деепричастная конструкция сохраняет эту связь, а примечание показывает возможное прочтение в виде двух тесно связанных повелений.
translation_notes:
  register: Современный литературный русский язык; краткая, резкая форма сохраняет тон насмешливого вызова. Возвратное местоимение написано со строчной буквы, что соответствует современной нейтральной норме и речи насмешников.
