  text: καὶ ⸀ἀναβὰς ὁ ὄχλος ἤρξατο αἰτεῖσθαι ⸀καθὼς ἐποίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: ru
  text: И народ, подойдя, начал просить его сделать для них то, что он обычно делал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «И толпа, поднявшись, начала просить его сделать для них то, что он обычно делал». В греческом тексте действие, о котором просят, после слова «просить» подразумевается.'
    reason: 'Лексико-синтаксическая альтернатива: ἀναβὰς буквально означает «поднявшись», а предмет просьбы в греческой конструкции выражен эллиптически.'
lexical_decisions:
- source_word: ἀναβὰς
  choice: подойдя
  rationale: Аористное причастие от ἀναβαίνω буквально указывает на движение вверх или приближение. В данном повествовательном контексте естественное русское «подойдя» передаёт приближение народа к месту пребывания Пилата, не навязывая лишней топографической конкретики.
- source_word: ὁ ὄχλος
  choice: народ
  rationale: ὄχλος означает толпу, множество людей. В библейском повествовании современное русское «народ» звучит естественно и достойно; формально возможное «толпа» сильнее подчёркивало бы неорганизованную массу.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: начал просить
  rationale: Сочетание ἄρχομαι с инфинитивом передаёт начало действия, а αἰτέω здесь означает просьбу или требование. «Начал просить» точно и естественно воспроизводит конструкцию.
- source_word: καθὼς
  choice: как
  rationale: 'καθώς вводит сравнение с обычным действием Пилата: народ просит поступить так, как он поступал прежде. Русское «как» сохраняет эту связь без избыточного пояснения подразумеваемого предмета просьбы.'
- source_word: ἐποίει
  choice: поступал обычно
  rationale: Имперфект ποιέω имеет здесь значение повторявшегося в прошлом действия. Добавление «обычно» естественно выражает обычный характер действия.
- source_word: αὐτοῖς
  choice: с ними
  rationale: Дательный αὐτοῖς допускает значение «им» или «для них». В сочетании с русским «поступать» конструкция «поступал с ними» естественно передаёт действие в их пользу, хотя более буквальное «делал для них» также возможно.
