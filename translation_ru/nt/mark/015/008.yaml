  terminology: «Народ» допустимо для ὁ ὄχλος в данном повествовательном регистре. «Подойдя» приемлемо контекстуально передаёт ἀναβάς. «Обычно делал для них» сохраняет итеративный имперфект и бенефактивный дательный.
