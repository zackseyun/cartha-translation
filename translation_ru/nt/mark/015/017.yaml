  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: ru
  text: И одевают Его в пурпур и, сплетя терновый венец, возлагают его на Него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: одевают Его в
  rationale: Глагол означает надеть одежду на кого-либо; выражение естественно по-русски и сохраняет каузативный смысл.
- source_word: πορφύραν
  choice: пурпурную одежду
  rationale: Существительное может обозначать пурпурную ткань или одежду. В русском языке одно «в пурпур» здесь неестественно, поэтому родовое «одежду» ясно передаёт подразумеваемый предмет, не уточняя его как плащ или мантию.
- source_word: περιτιθέασιν
  choice: возлагают его на Него
  rationale: Глагол означает поместить на кого-либо или вокруг кого-либо; «возлагают» естественно сочетается с венцом и передаёт действие без лишнего уточнения о голове.
- source_word: πλέξαντες
  choice: сплетя
  rationale: Деепричастие передаёт предшествующее действие аористного причастия кратко и естественно.
- source_word: ἀκάνθινον
  choice: терновый
  rationale: Прилагательное обозначает сделанное из колючих ветвей; «терновый венец» — ясное и устойчивое русское выражение.
- source_word: στέφανον
  choice: венец
  rationale: В контексте пародии на царское достоинство «венец» передаёт царский образ и при этом соответствует предмету, сплетённому из ветвей.
theological_decisions:
- issue: Пародийно-царские образы в унижении Иисуса
  choice: «терновый венец» для ἀκάνθινον στέφανον
  alternative: «венок из колючек»
  rationale: «Венец» сохраняет царскую символику издевательства, не добавляя богословского толкования сверх повествования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Историческое настоящее исходного текста сохранено. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции.
