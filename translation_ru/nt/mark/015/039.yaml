  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: ru
  text: 'Когда сотник, стоявший напротив Иисуса, увидел, что Он так испустил дух, то сказал: «Воистину этот человек был Божьим Сыном[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыном Бога». Греческое выражение допускает качественное или неопределённое понимание, однако в контексте Евангелия от Марка, вероятнее всего, имеет силу титула «Сын Божий».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Когда … увидел
  rationale: Аористное причастие естественно передано временным придаточным; слабая связка δέ не требует отдельного перевода.
- source_word: κεντυρίων
  choice: сотник
  rationale: Традиционное, точное и понятное русское обозначение римского военного чина.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: стоявший напротив Иисуса
  rationale: Передаёт устойчивое положение, выраженное перфектным причастием, и пространственное значение ἐξ ἐναντίας; имя Иисуса употреблено вместо местоимения ради ясности по-русски.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: что Он так испустил дух
  rationale: «Испустил дух» сохраняет образ дыхания в ἐκπνέω и остаётся естественным выражением смерти; «так» передаёт οὕτως и связывает слова сотника с тем, как умер Иисус.
- source_word: Ἀληθῶς
  choice: Воистину
  rationale: Передаёт торжественную и уверенную силу наречия, сохраняя достоинство повествования.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: этот человек
  rationale: Прямой и естественный русский эквивалент.
- source_word: υἱὸς θεοῦ
  choice: Божьим Сыном
  rationale: Естественно передаёт родительное отношение и в контексте Марка звучит как значимый титул, не вводя отдельный определённый артикль, которого в греческой форме нет.
- source_word: ἦν
  choice: был
  rationale: Сохраняет прошедшее время греческого имперфекта и не заменяет его богословски мотивированным настоящим.
theological_decisions:
- issue: Смысл выражения υἱὸς θεοῦ в словах сотника
  choice: Божьим Сыном
  alternative: сыном бога
  rationale: В повествовательном контексте Евангелия от Марка выражение, вероятнее всего, имеет силу христологического титула. Однако безартиклевая греческая конструкция допускает качественное или неопределённое понимание, поэтому альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным тоном. «Испустил дух» сохраняет образность оригинала; «воистину» уместно для solemn declaration. Прописные буквы в местоимении «Он» и в титуле служат русской издательской ясности, тогда как возможная неопределённость самого греческого выражения явно отмечена в сноске.
