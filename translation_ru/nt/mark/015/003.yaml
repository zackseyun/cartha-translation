  text: καὶ κατηγόρουν αὐτοῦ οἱ ἀρχιερεῖς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/003.yaml
  text: And the chief priests were accusing him of many things[a].
translation:
  language: ru
  text: И первосвященники выдвигали против Него множество обвинений.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много в чём обвиняли Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой соединительный союз и характерное для повествования Марка последовательное присоединение событий.
- source_word: κατηγόρουν
  choice: выдвигали обвинения
  rationale: Имперфект передаёт продолжавшееся или повторявшееся обвинение; сочетание естественно для судебного контекста.
- source_word: αὐτοῦ
  choice: против Него
  rationale: Родительный падеж при κατηγορέω обозначает обвиняемого; по-русски это естественно выражается конструкцией «против кого-либо».
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение ведущих представителей священнической знати; множественное число не означает нескольких одновременно действующих верховных первосвященников.
- source_word: πολλά
  choice: множество обвинений
  rationale: Передаёт многочисленность предметов обвинения, не уточняя их содержание; существительное «обвинений» эксплицирует подразумеваемый объект глагола.
