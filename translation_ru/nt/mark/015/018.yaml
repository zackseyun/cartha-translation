  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: ru
  text: 'И стали приветствовать Его: «Радуйся, Царь Иудейский!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет характерную для Марка последовательность повествования без добавочного временного толкования.
- source_word: ἤρξαντο ἀσπάζεσθαι
  choice: стали приветствовать
  rationale: Конструкция с ἄρχομαι передаёт начало действия; «стали» естественно звучит по-русски. «Приветствовать» сохраняет основное значение ἀσπάζομαι, тогда как насмешливый церемониальный оттенок раскрывается прямой речью и контекстом.
- source_word: Χαῖρε
  choice: Радуйся
  rationale: Традиционная и узнаваемая передача формы приветствия, которая также сохраняет буквальный оттенок греческого повелительного наклонения и торжественно-насмешливый тон сцены.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Царь Иудейский
  rationale: Устоявшееся русское наименование в контексте Страстей; звательная функция передана формой именительного падежа, естественной для современного русского языка.
theological_decisions:
- issue: Передача насмешливого царского приветствия Иисусу
  choice: «Радуйся, Царь Иудейский!»
  alternative: «Приветствуем Тебя, Царь Иудейский!»
  rationale: Выбранный вариант сохраняет форму прямого обращения, торжественную окраску и иронию солдат, не добавляя пояснения в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формула «Царь Иудейский» сохранена как широко понятная и контекстуально устоявшаяся; местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
