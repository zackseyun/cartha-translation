  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: ru
  text: Пилат же, желая удовлетворить толпу[a], отпустил им Варавву, а Иисуса велел бичевать и предал на распятие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желая угодить толпе». Буквально: «желая сделать для толпы достаточное».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: желая
  rationale: Причастие выражает волю или намерение Пилата; «желая» естественно передаёт его мотив, не усиливая оттенок обдуманного решения.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: угодить толпе
  rationale: Греческий оборот буквально означает «сделать для толпы достаточное» и в контексте указывает на стремление удовлетворить её требование. «Угодить толпе» — естественный русский оборот, сохраняющий оттенок политического потворства.
- source_word: ἀπέλυσεν
  choice: отпустил
  rationale: В судебном контексте глагол означает освобождение заключённого; «отпустил» ясно и естественно по-русски.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж указывает на толпу как сторону, ради которой и в пользу которой Варавва отпустили.
- source_word: παρέδωκεν
  choice: предал
  rationale: «Предал» сохраняет значимый для повествования о Страстях смысл передачи Иисуса во власть других и соответствует возвышенному, но современно понятному библейскому регистру.
- source_word: φραγελλώσας
  choice: велел бичевать
  rationale: Аористное причастие обозначает действие, предшествующее передаче. Каузативная формулировка естественно показывает, что Пилат распорядился подвергнуть Иисуса римскому бичеванию, а не обязательно исполнил его лично.
- source_word: ἵνα σταυρωθῇ
  choice: на распятие
  rationale: 'После глагола «предал» эта конструкция кратко и идиоматично передаёт цель: чтобы Иисус был распят.'
- source_word: Βαραββᾶν
  choice: Варавву
  rationale: Использована традиционная и общепонятная русская форма имени.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Использована устоявшаяся русская форма имени.
theological_decisions:
- issue: Мотив Пилата в выражении τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Пилат стремился угодить толпе, удовлетворив её требование
  alternative: Пилат стремился удовлетворить толпу; буквально — сделать для толпы достаточное
  rationale: Перевод сохраняет политический и нравственный оттенок потворства толпе, не представляя поступок Пилата как благожелательную услугу и не добавляя отсутствующего в тексте богословского объяснения.
- issue: Связь бичевания с распоряжением Пилата
  choice: Пилат велел бичевать Иисуса
  alternative: Пилат, бичевав Иисуса / после бичевания Иисуса, предал Его
  rationale: 'В данном административно-судебном контексте причастие естественно допускает каузативное понимание: наказание совершили по приказу Пилата. Формулировка не приписывает ему личного исполнения бичевания.'
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Сохранён традиционно узнаваемый термин «бичевать» и значимый глагол «предал», при этом синтаксис остаётся понятным обычному читателю.
