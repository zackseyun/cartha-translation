  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: ru
  text: 'Пилат снова ответил им: «Что же вы хотите, чтобы я сделал с тем, кого вы называете царём иудеев?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Наречие указывает, что Пилат вновь обращается к толпе в продолжающемся разговоре; «снова» естественно передаёт ход повествования.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: спросил
  rationale: Сочетание причастия со сказуемым вводит ответную реплику. Поскольку сама реплика является вопросом, русское «спросил» естественно передаёт речевое действие, не воспроизводя буквально тяжеловесное «ответив, говорил».
- source_word: Τί οὖν
  choice: Что же
  rationale: Частица οὖν связывает вопрос с предшествующим требованием толпы; «же» сохраняет эту логическую и риторическую связь.
- source_word: θέλετε ποιήσω
  choice: вы хотите, чтобы я сделал
  rationale: Русская конструкция с придаточным предложением точно и естественно передаёт θέλετε с аористным сослагательным ποιήσω.
- source_word: ὃν λέγετε
  choice: с тем, кого вы называете
  rationale: Предлог «с» необходим по нормам русского управления при глаголе «сделал», а относительная конструкция сохраняет отнесение титула к словам толпы.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: царём иудеев
  rationale: Творительный падеж обусловлен глаголом «называете». Строчная буква сохраняет характер политического наименования в устах участников сцены, не превращая его в исповедальное утверждение переводчика.
theological_decisions:
- issue: Представляет ли вопрос Пилата признание царского достоинства Иисуса или передаёт обозначение, употребляемое толпой
  choice: «с тем, кого вы называете царём иудеев»
  alternative: «с царём иудеев»
  rationale: Оборот ὃν λέγετε подчёркивает, что это обозначение исходит от собеседников Пилата. Перевод сохраняет его риторическую дистанцию, не приписывая Пилату ни исповедания, ни прямого отрицания этого титула.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным регистром. Местоимения, относящиеся к Иисусу, даны со строчной буквы по обычным правилам современного русского текста; это не выражает богословской оценки.
