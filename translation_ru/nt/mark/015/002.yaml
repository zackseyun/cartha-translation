  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: ru
  text: 'Пилат спросил его[a]: «Ты царь иудеев?» Иисус ответил ему[b]: «Ты сам говоришь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в территориально-этническом смысле: «царь жителей Иудеи». Здесь выражение «царь иудеев» передаёт обычную формулировку политического обвинения, предъявленного перед Пилатом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Ты говоришь». Ответ Иисуса краток и сохраняет некоторую неоднозначность; возможный смысл: «Это говоришь ты».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Глагол означает «спросить, задать вопрос». Нейтральное «спросил» естественно передаёт судебный контекст, не усиливая его до формального допроса.
- source_word: Σὺ εἶ
  choice: Ты
  rationale: В русском вопросе именная часть и связка настоящего времени передаются естественной конструкцией «Ты Царь…?», а явное местоимение сохраняет акцент на собеседнике.
- source_word: βασιλεὺς
  choice: Царь
  rationale: «Царь» сохраняет конкретный монархический смысл и политико-мессианское звучание обвинения; более широкое «правитель» было бы неточным.
- source_word: Ἰουδαίων
  choice: иудеев
  rationale: В данном устойчивом политическом титуле перед Пилатом «Царь иудеев» — традиционный и точный русский эквивалент; он может относиться и к народу, и в иных контекстах к жителям Иудеи.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Иисус ответил ему
  rationale: Русская повествовательная конструкция естественно объединяет причастие и историческое настоящее. Имя «Иисус» проясняет субъект после двух местоименных референтов, не меняя смысла.
- source_word: Σὺ λέγεις
  choice: Ты сам говоришь
  rationale: Краткая формула сохраняет отнесение этих слов к Пилату и не превращает ответ ни в безоговорочное «да», ни в отрицание. «Сам» передаёт эмфатическое Σὺ, не добавляя явного утверждения.
theological_decisions:
- issue: Сила ответа Иисуса Σὺ λέγεις
  choice: 'Сдержанный и допускающий неоднозначность ответ: «Ты сам говоришь».'
  alternative: '«Да, это так»; более буквально: «Ты говоришь».'
  rationale: В греческом тексте нет явного «да». Формулировка оставляет титул на устах Пилата и сохраняет напряжение между признанием и непрямым ответом.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный повествовательный стиль. Заглавная буква в «Царь» отражает употребление титула в прямой речи, а прописное «Его» соответствует принятому благоговейному русскому библейскому регистру.
