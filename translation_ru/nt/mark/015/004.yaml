  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: ru
  text: 'Но Пилат снова спросил Его: «Ты ничего не отвечаешь? Посмотри, сколько обвинений они выдвигают против Тебя!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посмотри, как много они Тебя обвиняют».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление и развитие повествования в данном контексте.
- source_word: πάλιν
  choice: снова
  rationale: Естественно передаёт повторность действия.
- source_word: ἐπηρώτα
  choice: спросил
  rationale: В русском повествовании прошедшее совершенного вида звучит естественно; контекст показывает, что Пилат вновь обращается к Иисусу с вопросом, тогда как более сильное «допрашивал» могло бы переакцентировать судебный оттенок.
- source_word: λέγων
  choice: 'спросил Его:'
  rationale: Причастная формула введения прямой речи естественно объединена с глаголом речи без отдельного «говоря».
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Ты ничего не отвечаешь?
  rationale: Сохраняет нажим отрицательной вопросительной конструкции и подчёркивает молчание Иисуса.
- source_word: ἴδε
  choice: Посмотри
  rationale: Современный и ясный императив, привлекающий внимание; «вот» или «узри» были бы менее точны либо архаичны.
- source_word: πόσα
  choice: сколько обвинений
  rationale: Существительное «обвинений» восполняет подразумеваемый объект по судебному контексту и глаголу κατηγοροῦσιν; буквальное значение отмечено в сноске.
- source_word: σου
  choice: против Тебя
  rationale: Родительный при κατηγορέω обозначает обвиняемого; по-русски это естественно выражается сочетанием «против Тебя».
- source_word: κατηγοροῦσιν
  choice: они выдвигают
  rationale: Настоящее время передаёт продолжающиеся обвинения, а «выдвигают обвинения» естественно звучит в судебном контексте.
