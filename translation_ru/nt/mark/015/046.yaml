  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: ru
  text: Купив льняное полотно[a], он снял его, обернул этим полотном и положил в гробницу, высеченную в скале. Затем он подкатил камень ко входу в гробницу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «льняную ткань»; по контексту — погребальное покрывало (σινδών).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к двери гробницы»; греческое θύρα может означать «дверь», «вход» или «проём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: льняное полотно / этим полотном
  rationale: Слово σινδών обозначает льняное полотно, здесь использованное как погребальное покрывало. «Полотно» сохраняет указание на материал и не вводит более узкое значение слова «плащаница»; указательное «этим» естественно отсылает к уже упомянутому полотну.
- source_word: καθελών
  choice: снял Его
  rationale: В данном контексте καθαιρέω означает снять тело Иисуса с креста. Дополнение «с креста» подразумевается контекстом и в самом стихе прямо не выражено.
- source_word: ἐνείλησεν
  choice: обернул
  rationale: Глагол означает оборачивать или окутывать. «Обернул» естественно передаёт погребальное действие, не добавляя не названных в тексте подробностей.
- source_word: ἔθηκεν
  choice: положил
  rationale: Обычный и достойный по стилю эквивалент τίθημι в контексте погребения.
- source_word: μνημείῳ / μνημείου
  choice: гробницу / гробницу
  rationale: Здесь μνημεῖον обозначает устроенное место погребения, высеченное в скале; «гробница» точнее, чем «могила», передаёт характер сооружения.
- source_word: λελατομημένον ἐκ πέτρας
  choice: высеченную в скале
  rationale: Перфектное страдательное причастие описывает готовое состояние гробницы. Русское «высеченную в скале» точно и естественно передаёт способ её устройства.
- source_word: προσεκύλισεν
  choice: подкатил
  rationale: Глагол выражает движение камня посредством качения к отверстию гробницы; «подкатил» сохраняет направленность действия.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: ко входу в гробницу
  rationale: θύρα может обозначать как дверь, так и вход или проём. В описании скальной гробницы «вход» наиболее ясно передаёт предметный смысл, а сочетание с «подкатил» естественно выражает закрывание проёма.
- source_word: ἀγοράσας
  choice: купив
  rationale: Деепричастие передаёт предшествующее действие аористного причастия кратко и естественно.
