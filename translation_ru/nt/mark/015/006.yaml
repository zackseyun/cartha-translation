    issue: «за кого они просили»
    rationale: Оборот «просить за кого-либо» чаще значит заступаться или ходатайствовать за этого человека, тогда как греческое ὃν παρῃτοῦντο здесь обозначает узника, освобождения которого просили. Следует прямо выразить подразумеваемое действие освобождения.
