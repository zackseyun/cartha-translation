  text: На праздник он обычно отпускал им одного узника, которого они просили отпустить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: На праздник
  rationale: Κατά с винительным имеет временное значение и указывает на обычай, соблюдавшийся по случаю праздника. В контексте имеется в виду Пасха; общее слово «праздник» сохраняет формулировку исходного текста. Частица δέ здесь служит лёгкой связкой и не требует отдельного перевода.
- source_word: ἀπέλυεν
  choice: обычно отпускал
  rationale: Имперфект выражает повторявшееся в прошлом действие. «Обычно отпускал» ясно передаёт обычай, не сводя глагол к однократному событию.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный указывает на тех, в чью пользу совершалось освобождение; естественный русский эквивалент — «им».
- source_word: ἕνα δέσμιον
  choice: одного узника
  rationale: «Одного» сохраняет явное числительное ἕνα. «Узник» естественно обозначает человека, находящегося под стражей, и соответствует судебному контексту.
- source_word: ὃν παρῃτοῦντο
  choice: того, за кого они просили
  rationale: Относительная конструкция обозначает выбранного толпой узника. Средний глагол παραιτέομαι здесь значит «просить, требовать выдать»; «за кого они просили» естественно по-русски и сохраняет направленность просьбы на освобождение конкретного человека.
