review_pass:
  verdict: revise
  source_fidelity: Начальная временная конструкция «На праздник», привычное действие «обычно отпускал», дательный «им» и «одного узника» точно передают Κατὰ δὲ ἑορτὴν, ἀπέλυεν, αὐτοῖς и ἕνα δέσμιον. Однако «того, за кого они просили» в русском обычно означает ходатайство за человека и может сместить смысл παρῃτοῦντο («кого они просили отпустить/о чьём освобождении просили»).
  naturalness: Фраза в целом естественна и соответствует современному литературному повествовательному регистру. Явное дополнение «отпустить» устраняет неудачную русскую двусмысленность и делает связь просьбы с освобождением прозрачной.
  terminology: «Узник» допустим и стилистически уместен в данном судебно-повествовательном контексте. Специальных богословских терминов в стихе нет.
