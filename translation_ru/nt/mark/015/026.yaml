  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: ru
  text: 'Надпись с указанием обвинения против него гласила: «Царь иудеев».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Царь жителей Иудеи».'
    reason: 'Лексическая альтернатива: Ἰουδαῖοι в некоторых контекстах может иметь географический смысл «жители Иудеи».'
lexical_decisions:
- source_word: ἐπιγραφή
  choice: надпись
  rationale: Обозначает письменный текст, помещённый на кресте или над ним; «надпись» естественно и точно передаёт смысл.
- source_word: αἰτία
  choice: с указанием его вины
  rationale: В данном судебном контексте слово обозначает предъявленную вину, то есть основание обвинения; формулировка сохраняет юридический оттенок и естественно сочетается со словом «надпись».
- source_word: ἐπιγεγραμμένη
  choice: гласила
  rationale: Перифрастическая конструкция указывает, что текст был написан и находился перед глазами; «гласила» по-русски естественно описывает содержание надписи, не меняя его смысла.
- source_word: βασιλεὺς
  choice: Царь
  rationale: Слово передаёт царский титул в формулировке обвинения; прописная буква уместна в цитируемом официальном обозначении.
- source_word: Ἰουδαίων
  choice: иудеев
  rationale: В повествовании о страстях это устойчивое обозначение народа в титуле Иисуса; «иудеев» сохраняет традиционный и понятный русский эквивалент, тогда как географически более узкое «жителей Иудеи» оставлено в примечании.
theological_decisions:
- issue: Передача Ἰουδαίων в титуле при распятии
  choice: иудеев
  alternative: жителей Иудеи
  rationale: Фраза передаёт римскую формулировку обвинения и обозначение народа, а не обязательно только жителей области Иудея. Основной вариант сохраняет узнаваемый евангельский титул, а возможный географический смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. Оборот «надпись… гласила» звучит естественно, а выражение «с указанием его вины» сохраняет связь αἰτία с официальным обвинением.
