translation:
  language: ru
  text: Но первосвященники подстрекнули толпу, чтобы он отпустил им Варавву, а не другого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он вместо этого отпустил им Варавву». Греческое слово выражает предпочтение: Варавву следовало отпустить вместо другого человека, подразумеваемого из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Но
  rationale: δέ выражает здесь мягкое противопоставление ожидаемому решению Пилата и действиям первосвященников.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся и точное обозначение представителей высшего иерусалимского священства во множественном числе.
- source_word: ἀνέσεισαν
  choice: подстрекнули
  rationale: Глагол означает побудить или возбуждать людей к желаемому действию; «подстрекнули» естественно передаёт целенаправленное воздействие на толпу.
- source_word: τὸν ὄχλον
  choice: толпу
  rationale: Современное и контекстуально точное соответствие слову ὄχλος.
- source_word: ἵνα
  choice: просить, чтобы
  rationale: Конструкция передаёт цель подстрекательства; добавление «просить» естественно выражает подразумеваемую реакцию толпы в русском языке, не называя отсутствующий в греческом объект сравнения.
- source_word: μᾶλλον
  choice: лучше
  rationale: 'Сохраняет сравнительно-предпочтительное значение: Варавву должны отпустить вместо подразумеваемой из контекста альтернативы.'
- source_word: τὸν Βαραββᾶν
  choice: Варавву
  rationale: Традиционная русская форма имени в требуемом винительном падеже.
- source_word: ἀπολύσῃ
  choice: отпустил
  rationale: Аорист конъюнктива после ἵνα выражает намеченный результат; русское прошедшее время в придаточном после «чтобы» является естественной формой ирреального наклонения и не обозначает прошедшего времени действия.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж прямо сохраняет указание на тех, для кого или по чьему требованию должен быть освобождён Варавва.
