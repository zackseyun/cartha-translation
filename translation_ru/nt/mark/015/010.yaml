  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: ru
  text: Ибо он знал, что первосвященники уже выдали Его из зависти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ревности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: он знал
  rationale: Имперфект передаёт устойчивое осознание Пилата; по-русски естественно простое прошедшее время «знал».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит объяснение предыдущего высказывания; «ведь» естественно и ясно передаёт эту связь.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание знания Пилата.
- source_word: διὰ φθόνον
  choice: из зависти
  rationale: διά с винительным выражает причину, а φθόνος здесь обозначает зависть как побуждение.
- source_word: παραδεδώκεισαν αὐτόν
  choice: предали Его в руки властей
  rationale: Плюсквамперфект обозначает действие, предшествовавшее знанию Пилата. Глагол παραδίδωμι означает передачу в чью-либо власть; добавление «в руки властей» естественно раскрывает подразумеваемую судебную передачу, не придавая глаголу более узкого значения «предали как изменники».
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Традиционный и понятный русский эквивалент множественного ἀρχιερεῖς, обозначающего высших представителей священнической власти.
theological_decisions:
- issue: Мотив первосвященников
  choice: Их побуждением названа зависть.
  alternative: ревность
  rationale: Перевод сохраняет данную в тексте оценку Пилата и не развивает её богословски; «зависть» точнее передаёт отрицательное значение φθόνος в данном контексте.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Ведь» сохраняет объяснительную связь, а «предали Его в руки властей» ясно передаёт судебный контекст.
