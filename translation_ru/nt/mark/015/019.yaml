source:
  edition: SBLGNT
  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: ru
  text: Они били Его по голове тростью, плевали на Него и, становясь на колени, кланялись Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялись Ему». Греческий глагол может означать «кланяться», «выражать почтение» или «поклоняться»; здесь воины насмешливо изображают почести, воздаваемые царю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: били
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; русская форма несовершенного вида естественно сохраняет эту длительность.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: Его по голове
  rationale: Естественная русская конструкция для обозначения повторяемых ударов по части тела.
- source_word: καλάμῳ
  choice: тростью
  rationale: κάλαμος обозначает тростник или сделанную из него трость; «тростью» естественно передаёт предмет, служивший орудием издевательства.
- source_word: ἐνέπτυον αὐτῷ
  choice: плевали на Него
  rationale: Несовершенный вид сохраняет повторяемость действия, выраженную имперфектом.
- source_word: τιθέντες τὰ γόνατα
  choice: становясь на колени
  rationale: Буквально «полагая колени» — идиома, естественно передаваемая по-русски как «становясь на колени».
- source_word: προσεκύνουν αὐτῷ
  choice: кланялись Ему
  rationale: Передаёт внешний жест почтения, который в данном контексте был издевательской имитацией царских почестей, не исключая более сильного значения глагола в иных контекстах.
theological_decisions:
- issue: Значение προσκυνέω в сцене издевательства
  choice: кланялись Ему
  alternative: поклонялись Ему
  rationale: Контекст описывает насмешливое изображение почтения царю, а не искреннее богопочитание. Основной текст передаёт наблюдаемый жест, а сноска сохраняет лексическую возможность значения «поклоняться».
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная повествовательная фраза. Заглавные местоимения по отношению к Иисусу соответствуют принятому достоинственному библейскому регистру.
