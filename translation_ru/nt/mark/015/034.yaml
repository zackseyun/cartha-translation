source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: ru
  text: 'В девятый час Иисус громко воскликнул: «Элои, Элои, лема савахфани?»[a] — что в переводе означает: «Боже Мой, Боже Мой,[b] почему Ты Меня оставил?»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях и древних текстовых традициях: «лама савахфани».'
    reason: textual_variant
  - marker: b
    text: Эти слова перекликаются с Псалмом 21:2 (22:1 по иной нумерации).
    reason: cross_reference
  - marker: c
    text: 'Или: «для чего Ты Меня оставил?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: в девятый час
  rationale: Сохраняет принятую в тексте систему отсчёта времени и естественно передаёт греческое обстоятельство времени; перевод «около трёх часов дня» был бы пояснительным.
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: громко воскликнул
  rationale: Естественно и ёмко передаёт как сильный крик, выраженный глаголом ἐβόησεν, так и усиление φωνῇ μεγάλῃ, не создавая тяжеловесного повтора.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Элои, Элои, лема савахфани?
  rationale: Сохраняет переданные Марком семитские слова и не гармонизирует их с формой у Матфея; вслед за источником их смысл затем приводится отдельно.
- source_word: μεθερμηνευόμενον
  choice: что в переводе означает
  rationale: Ясно показывает, что далее Марк даёт перевод семитского возгласа; формула звучит естественно по-русски.
- source_word: εἰς τί
  choice: почему
  rationale: В данном вопросительном обороте выражение обозначает причину; «почему» — точный и естественный современный русский эквивалент. Более буквальное «для чего» отмечено в сноске как возможная передача.
- source_word: ἐγκατέλιπές με
  choice: Ты Меня оставил
  rationale: Передаёт аорист без искусственного усложнения и сохраняет связь с формулировкой Псалма 21:2 в русской библейской традиции; «покинул» или «оставил на произвол» были бы более интерпретирующими.
theological_decisions:
- issue: Связь возгласа Иисуса с Псалмом 21:2 (22:1)
  choice: Сохранить прямой вопрос об оставленности и отметить отсылку только в сноске.
  alternative: Смягчить смысл оставленности либо прямо объяснить его богословское значение в основном тексте.
  rationale: Марк передаёт слова без богословского разъяснения. Перевод сохраняет одновременно их остроту и псалмопевческое звучание, не разрешая заложенное в тексте напряжение.
- issue: Передача семитских слов Иисуса
  choice: Оставить транслитерацию, а затем дать перевод, как у Марка.
  alternative: Опустить транслитерацию или заменить марковское «Элои» на более знакомое «Или».
  rationale: Так сохраняется литературная структура стиха и самостоятельная форма текста Марка без гармонизации с Матфеем.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой прямой речи. Местоимения, относящиеся к Богу и Иисусу в прямом обращении, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой. Семитская фраза сохранена в транслитерации; архаичные слова вроде «возопил» не используются.
