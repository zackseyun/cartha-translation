  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: ru
  text: И завеса храма[a] разорвалась надвое — сверху донизу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может обозначать собственно храмовое святилище, а не весь храмовый комплекс.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: завеса
  rationale: «Завеса» — естественное и достаточно точное русское обозначение храмового полотнища; оно сохраняет конкретный образ, не истолковывая его символику.
- source_word: ναοῦ
  choice: храма
  rationale: Греческое ναός может обозначать собственно храмовое святилище, а не весь храмовый комплекс. В основном тексте выбрано привычное «храма», а более узкое значение отмечено в сноске.
- source_word: ἐσχίσθη
  choice: разорвалась
  rationale: Аорист пассивного залога описывает завесу как подвергшуюся разрыву. Русская возвратная форма естественно передаёт событие, не называя действующее лицо.
- source_word: εἰς δύο
  choice: надвое
  rationale: Кратко и идиоматично передаёт разделение на две части.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: сверху донизу
  rationale: Естественно передаёт направление и полную протяжённость разрыва.
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз и связь с предшествующим событием, не добавляя более определённого временного оттенка.
theological_decisions:
- issue: Символическое значение разрыва храмовой завесы
  choice: Передать событие описательно, не объясняя его символику в основном тексте.
  alternative: Истолковать разрыв как открытие доступа к Богу или как суд над храмовым устройством.
  rationale: Сам стих сообщает о событии, но не формулирует его богословского значения; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная повествовательная фраза. Тире подчёркивает направление разрыва без добавления нового смысла.
