  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: ru
  text: 'Тогда кто-то подбежал, наполнил губку кислым вином[a], насадил её на трость и стал давать Ему пить, говоря: «Оставьте Его[b]. Посмотрим, придёт ли Илия снять Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кислое вино — дешёвый кислый винный напиток, а не обязательно уксус в современном бытовом смысле.
    reason: cultural_note
  - marker: b
    text: 'Или: «Погодите».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: подбежал
  rationale: Аористное причастие передаёт предшествующее действие; личная форма естественно выражает последовательность событий по-русски.
- source_word: τις καὶ
  choice: кто-то
  rationale: Неопределённое местоимение обозначает не названного по имени человека; καί в данном сочетании не требует отдельного перевода.
- source_word: γεμίσας σπόγγον ὄξους
  choice: наполнил губку кислым вином
  rationale: ὄξος обозначает кислое дешёвое вино или винный напиток; «кислое вино» не вызывает современного представления о столовом уксусе.
- source_word: περιθεὶς καλάμῳ
  choice: насадил её на трость
  rationale: Передаёт прикрепление губки к καλάμος для поднесения к распятому; «трость» сохраняет конкретный образ исходного слова.
- source_word: ἐπότιζεν αὐτόν
  choice: стал давать Ему пить
  rationale: Форма имперфекта подчёркивает разворачивающееся или предпринимаемое действие, не утверждая сверх текста, выпил ли Иисус.
- source_word: Ἄφετε
  choice: Оставьте Его
  rationale: Императив может означать требование не вмешиваться и оставить Его на время; возможное идиоматическое значение «Погодите» сохранено в сноске.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Посмотрим, придёт ли Илия
  rationale: Естественная русская конструкция сохраняет ожидание и неопределённость вопроса о приходе Илии.
- source_word: καθελεῖν αὐτόν
  choice: снять Его
  rationale: В контексте распятия καθαιρέω означает снять человека с возвышенного положения, то есть с креста.
theological_decisions:
- issue: Смысл повеления Ἄφετε
  choice: «Оставьте Его» — призыв временно не вмешиваться, чтобы увидеть, придёт ли Илия.
  alternative: «Погодите» или «Подождите».
  rationale: Основной текст сохраняет прямое значение глагола, а сноска отмечает возможное идиоматическое прочтение, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской традиции.
