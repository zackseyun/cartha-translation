  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: ru
  text: 'И некоторые из стоявших там, услышав это, говорили: «Смотрите, он зовёт Илию[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он призывает Илию».'
    reason: Глагол φωνεῖ с прямым дополнением может передавать не только обращение по имени, но и призывание человека; эта формулировка сохраняет смысловую возможность без добавления цели «на помощь».
lexical_decisions:
- source_word: καί
  choice: И
  rationale: Обычный повествовательный союз, связывающий реакцию присутствующих с предшествующим возгласом Иисуса без добавления временного оттенка.
- source_word: τινες τῶν παρεστηκότων
  choice: некоторые из стоявших там
  rationale: Передаёт неопределённую часть присутствовавших и сохраняет конкретный пространственный смысл субстантивированного причастия παρεστηκότων.
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Деепричастие естественно передаёт действие, предшествующее их словам; «это» добавлено для ясности и относится к предшествующему возгласу Иисуса.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид передаёт незавершённый или продолжающийся характер греческого имперфекта, не навязывая значения многократности.
- source_word: Ἴδε
  choice: Смотрите
  rationale: Естественное современное побуждение обратить внимание; множественное число согласуется с обращением говорящих к окружающим.
- source_word: Ἠλίαν
  choice: Илию
  rationale: Традиционная и общепонятная русская форма имени пророка в винительном падеже.
- source_word: φωνεῖ
  choice: он зовёт
  rationale: Сохраняет прямое дополнение «Илию» и не уточняет сверх греческого текста, просто ли он обращается к Илии или зовёт его на помощь.
theological_decisions:
- issue: Следует ли прямо пояснять, что стоявшие рядом ошибочно поняли возглас Иисуса как обращение к Илии
  choice: 'Сохранить их непосредственные слова: «он зовёт Илию»'
  alternative: «он зовёт Илию на помощь» или пояснение, что они так подумали
  rationale: Греческий текст сообщает слова присутствующих, но не добавляет авторского объяснения их ошибки. Контекст позволяет читателю увидеть недоразумение, а возможное значение просьбы о помощи отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с естественной повествовательной интонацией. Формулировка доступна широкому читателю, не архаична и сохраняет неоднозначность исходного текста.
