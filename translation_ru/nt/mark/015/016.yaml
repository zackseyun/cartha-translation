translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Местоимение «Его» применительно к Иисусу написано с прописной буквы. Технические термины «претория» и «когорта» сохранены ради исторической точности; менее известный термин «когорта» пояснён в сноске.
