  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: ru
  text: Тогда воины отвели Его во двор[a], то есть в преторию, и созвали всю когорту[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутрь двора».'
    reason: lexical_alternative
  - marker: b
    text: Когорта — подразделение римской армии; здесь это слово обозначает собравшихся воинов.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Тогда
  rationale: δέ обозначает переход к следующему событию повествования, а не резкое противопоставление; «тогда» естественно передаёт последовательность действий.
- source_word: στρατιῶται
  choice: воины
  rationale: Прямое обозначение римских военнослужащих; слово сохраняет достоинство литературного регистра и понятно современному читателю.
- source_word: ἀπήγαγον
  choice: отвели
  rationale: Глагол означает «увести, отвести»; направление внутрь уточняется последующим оборотом.
- source_word: ἔσω τῆς αὐλῆς
  choice: внутрь двора
  rationale: Передаёт пространственное значение ἔσω с родительным падежом, не добавляя отсутствующего в тексте уточнения о дворце или резиденции.
- source_word: ὅ ἐστιν πραιτώριον
  choice: то есть в преторию
  rationale: Сохраняет исторический римский термин и пояснительный характер греческой конструкции; падеж согласован с направлением движения.
- source_word: συγκαλοῦσιν
  choice: созвали
  rationale: Передаёт значение совместного созыва. Русское прошедшее время обеспечивает естественную связность повествования; историческое настоящее оригинала не воспроизводится механически.
- source_word: ὅλην τὴν σπεῖραν
  choice: всю когорту
  rationale: «Когорта» сохраняет техническое значение названия римского военного подразделения, а «всю» непосредственно передаёт ὅλην.
