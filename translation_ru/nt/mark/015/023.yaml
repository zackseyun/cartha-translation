  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: ru
  text: Ему давали вино, смешанное со смирной[a], но он не взял его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вино, приправленное смирной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: давали
  rationale: Имперфект передаёт продолженное или предпринятое действие; русское несовершенное «давали» сохраняет этот аспект и естественно звучит в повествовании.
- source_word: ἐσμυρνισμένον οἶνον
  choice: вино, смешанное со смирной
  rationale: Причастие от σμυρνίζω обозначает вино, приготовленное со смирной; эта формулировка ясна современному читателю и прямо называет добавленное вещество.
- source_word: ὃς δὲ
  choice: но он
  rationale: Формально ὃς — относительное местоимение, однако здесь конструкция имеет возобновляющую функцию и возвращается к Иисусу; «но он» естественно передаёт также лёгкое противопоставление δέ.
- source_word: ἔλαβεν
  choice: не взял его
  rationale: λαμβάνω здесь естественно передаётся глаголом «взять»; местоимение «его» ясно отсылает к вину и восполняет подразумеваемое дополнение.
theological_decisions:
- issue: Причина отказа Иисуса от напитка
  choice: Передать действие описательно, не объясняя мотив отказа.
  alternative: Указать, что Иисус отказался от обезболивающего или от обычного напитка.
  rationale: Греческий текст сообщает лишь, что ему давали вино со смирной, но он его не взял; причина отказа в стихе не названа.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. Порядок «Ему давали» естественно обозначает адресата и сохраняет несовершенный вид исходного глагола. Архаичное «мирра» не использовано; выбрано традиционное и понятное «смирна».
