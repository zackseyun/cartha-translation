  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: ru
  text: И, узнав от сотника, он отдал тело Иосифу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мёртвое тело», «труп».'
    reason: Лексически πτῶμα прямо обозначает мёртвое тело; основной вариант «тело» менее резок и естественнее в русском повествовании.
lexical_decisions:
- source_word: γνοὺς
  choice: узнав
  rationale: 'Аористное причастие выражает предшествующее обстоятельство: Пилат отдал тело после того, как получил сведения; деепричастие естественно и кратко передаёт эту последовательность.'
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: от сотника
  rationale: Предлог ἀπό с родительным указывает источник сведений. «Сотник» — традиционный и понятный русский термин для римского центуриона.
- source_word: ἐδωρήσατο
  choice: отдал
  rationale: Средняя форма δωρέομαι означает дать или предоставить; в данном контексте речь об официальной передаче тела Иосифу. «Отдал» звучит естественно и сохраняет оттенок разрешённой передачи.
- source_word: πτῶμα
  choice: тело
  rationale: Слово обозначает мёртвое тело, труп. В основном тексте «тело» естественно для повествования, а буквальная эксплицитность отмечена в сноске.
- source_word: τῷ Ἰωσήφ
  choice: Иосифу
  rationale: Дательный падеж обозначает получателя.
