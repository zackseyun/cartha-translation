source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: ru
  text: И распинают Его, и делят между собой Его одежды, бросая жребий, кому что взять.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυροῦσιν
  choice: распинают
  rationale: Настоящее время сохраняет характерное для Марка живое историческое настоящее и естественно звучит в повествовании.
- source_word: διαμερίζονται
  choice: делят между собой
  rationale: Передаёт распределение одежды между участниками и естественно сочетается с последующим указанием на жребий.
- source_word: ἱμάτια
  choice: одежды
  rationale: Множественное число «одежды» сохраняет конкретный смысл отдельных предметов одежды и соответствует достойному повествовательному регистру.
- source_word: βάλλοντες κλῆρον
  choice: бросая жребий
  rationale: Устойчивое русское выражение точно передаёт способ распределения по жребию.
- source_word: ἐπ’ αὐτὰ
  choice: имплицитно в конструкции «кому что взять»
  rationale: Отнесённость жребия к предметам одежды ясна из контекста; отдельное местоимение сделало бы русскую фразу тяжеловесной.
- source_word: τίς τί ἄρῃ
  choice: кому что взять
  rationale: 'Кратко и естественно сохраняет двойную распределительность греческих местоимений: какой человек получит какой предмет.'
theological_decisions:
- issue: Историческое настоящее в рассказе о страстях
  choice: «распинают» и «делят»
  alternative: «распяли» и «разделили»
  rationale: Настоящее время отражает дискурсивную живость греческого текста Марка, не привнося дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с лаконичным и торжественным повествовательным звучанием. Синтаксис сохраняет последовательность греческих действий, но избегает неестественной буквальности.
