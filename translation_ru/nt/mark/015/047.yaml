base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: ru
  text: А Мария Магдалина и Мария, мать Иосии[a], смотрели, где Он был положен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мария Иосии». Греческий текст определяет эту Марию по её отношению к Иосии, прямо не называя характер этого отношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Слабый повествовательный союз продолжает рассказ; «А» естественно вводит смену внимания без выраженного противопоставления.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Мария Магдалина
  rationale: Традиционная и понятная русская форма имени и прозвания.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Мария, мать Иосии
  rationale: Греческий родительный падеж буквально обозначает отношение Марии к Иосии, не называя его характера; контекст Марка позволяет естественно уточнить подразумеваемое материнство, сохранив буквальную неопределённость в сноске.
- source_word: ἐθεώρουν
  choice: смотрели
  rationale: Имперфект передаёт продолженное наблюдение; в данном контексте естественное русское «смотрели» сохраняет этот видовой оттенок.
- source_word: ποῦ
  choice: куда
  rationale: При глаголе помещения русский язык естественно использует обозначение направления «куда», тогда как буквальное «где» звучало бы менее точно.
- source_word: τέθειται
  choice: Его положили
  rationale: Перфект пассива указывает на совершённое помещение с сохраняющимся результатом. Русский совершенный вид естественно передаёт это в повествовании; подразумеваемый объект — Иисус — выражен местоимением.
theological_decisions:
- issue: Подразумеваемый объект пассивного глагола
  choice: Явно выражено «Его» применительно к Иисусу
  alternative: «тело положили» или безличное «было положено»
  rationale: В греческом объект ясен из контекста и опущен. «Его» даёт естественную русскую фразу и не сводит Иисуса лишь к телу.
- issue: Отношение Марии к Иосии
  choice: В основном тексте уточнено «мать Иосии»
  alternative: Буквальное «Мария Иосии»
  rationale: Эллиптический греческий оборот определяет Марию через Иосию; материнское отношение наиболее естественно следует из употребления у Марка, однако формальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Фраза краткая и прозрачная; продолженность наблюдения передана несовершенным видом «смотрели», а результативность погребального действия — совершенным видом «положили».
