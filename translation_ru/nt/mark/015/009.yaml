  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: ru
  text: 'Но Пилат ответил им: «Хотите, я отпущу вам царя иудеев[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царя жителей Иудеи». Греческое Ἰουδαίων может означать как «иудеев», так и «жителей Иудеи»; в повествовании о Страстях это устойчивый титул.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление и поворот повествования в ответе Пилата толпе.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: ответил им
  rationale: Естественная русская передача формулы «ответил им, говоря»; отдельное «говоря» было бы тяжеловесным и избыточным.
- source_word: Θέλετε
  choice: Хотите
  rationale: Точно и современно передаёт выраженное глаголом θέλω желание.
- source_word: ἀπολύσω ὑμῖν
  choice: я отпущу вам
  rationale: В судебном контексте ἀπολύω означает освобождение заключённого; дательный ὑμῖν передан словом «вам».
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Царя Иудейского
  rationale: Устоявшаяся в русском библейском языке и понятная современному читателю передача политического титула; прописная буква отражает употребление выражения как особого титула в прямой речи.
theological_decisions:
- issue: Передача титула τὸν βασιλέα τῶν Ἰουδαίων
  choice: Царя Иудейского
  alternative: царя иудеев / царя жителей Иудеи
  rationale: Фраза выступает в повествовании о Страстях как политический и иронический титул, а не как добавленное переводчиком вероучительное утверждение. Традиционная русская форма сохраняет этот титульный характер, тогда как этногеографическая двусмысленность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением достоинства евангельского повествования. Причастная формула λέγων не воспроизведена буквально, чтобы избежать неестественного «ответил им, говоря». Традиционный титул «Царь Иудейский» сохранён, а подлинная лексическая неоднозначность вынесена в сноску.
