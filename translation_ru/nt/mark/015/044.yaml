  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: ru
  text: Пилат удивился, что Иисус уже умер[a]. Подозвав центуриона, он спросил его, давно ли Иисус умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умер ли Он уже».'
    reason: Передаёт возможное вопросительное понимание εἰ при сохранении значения ἤδη («уже») без добавления не выраженного в греческом усиления «действительно».
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: удивился
  rationale: Естественно передаёт удивление Пилата неожиданно скорой смерти Иисуса, не усиливая значение до изумления.
- source_word: εἰ ἤδη τέθνηκεν
  choice: что Иисус уже умер
  rationale: После глагола удивления косвенный вопрос по-русски естественно передаётся придаточным с «что»; «уже умер» выражает совершившееся событие и наступившее состояние.
- source_word: προσκαλεσάμενος
  choice: подозвав
  rationale: Передаёт предшествующее основному глаголу действие кратко и естественно.
- source_word: κεντυρίωνα
  choice: центуриона
  rationale: Исторически точное и устоявшееся обозначение римского военного чина.
- source_word: ἐπηρώτησεν αὐτόν
  choice: он спросил его
  rationale: Прямое современное соответствие без ненужного усиления значения.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: давно ли Иисус умер
  rationale: В контексте πάλαι относится к тому, прошло ли со времени смерти уже некоторое время; русское «давно ли» естественно передаёт косвенный вопрос, не обязательно подразумевая большой промежуток.
