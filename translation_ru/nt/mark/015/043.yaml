  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: ru
  text: Придя, Иосиф из Аримафеи, уважаемый член совета, который и сам ожидал Царства Божьего, осмелился войти к Пилату и попросил тело Иисуса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: в контексте передано движением «войти»
  rationale: Предшествующее аористное причастие обозначает приход Иосифа; отдельное «придя» по-русски утяжелило бы сочетание с последующим «вошёл». Смысл движения естественно включён в основной глагол.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: из Аримафеи
  rationale: Прямо и естественно передаёт происхождение Иосифа, не превращая географическое указание в прозвище.
- source_word: εὐσχήμων
  choice: уважаемый
  rationale: Передаёт общественное положение и почёт без архаичности и без чрезмерно узкого значения «знатный».
- source_word: βουλευτής
  choice: член совета
  rationale: Сохраняет общее обозначение должности; греческое слово само по себе не называет синедрион.
- source_word: ὃς καὶ αὐτὸς
  choice: который и сам
  rationale: Сохраняет эмфатическое указание на то, что Иосиф лично разделял это ожидание.
- source_word: ἦν προσδεχόμενος
  choice: ожидал
  rationale: Передаёт продолжительную направленность ожидания; русская форма несовершенного вида естественно выражает длительность без вспомогательного глагола.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Устойчивое, ясное и точное соответствие ключевому евангельскому выражению.
- source_word: τολμήσας
  choice: осмелился
  rationale: Сохраняет значение решимости и риска точнее, чем простое наречие «смело», и естественно связывается с инфинитивом.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: войти к Пилату
  rationale: Передаёт вход в присутствие Пилата и направленность действия.
- source_word: ᾐτήσατο
  choice: попросил
  rationale: Естественно передаёт просьбу о выдаче тела без излишне официального оттенка слова «ходатайствовал».
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: тело Иисуса
  rationale: Прямое и торжественно-нейтральное соответствие греческой конструкции.
theological_decisions:
- issue: Статус Иосифа как βουλευτής
  choice: член совета
  alternative: член синедриона
  rationale: В контексте, вероятно, имеется в виду иудейский совет, однако сам греческий термин не называет синедрион; основной текст не должен вносить более узкую историческую конкретизацию.
- issue: Смысл τολμήσας
  choice: осмелился войти
  alternative: смело вошёл; набравшись смелости, вошёл
  rationale: Так сохраняется акцент на преодолении риска или страха, при этом причастная конструкция передаётся естественным современным русским оборотом.
- issue: Ожидание Царства Божьего
  choice: ожидал Царства Божьего
  alternative: чаял Царства Божьего
  rationale: «Ожидал» ясно и точно передаёт продолжающееся ожидание, не добавляя архаического или конфессионально окрашенного оттенка.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный повествовательный регистр. Синтаксис сохраняет последовательность характеристик Иосифа и подчёркивает его решимость, избегая тяжеловесного буквального воспроизведения двух греческих причастий.
