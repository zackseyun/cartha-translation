  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: ru
  text: А когда настал шестой час[b], на всю землю[a] настала тьма до девятого часа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю Землю». Греческое слово может означать землю, страну или Землю.'
    reason: alternative_reading
  - marker: b
    text: То есть примерно с полудня до трёх часов дня.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ γενομένης ὥρας ἕκτης
  choice: А когда настал шестой час
  rationale: Генитив абсолютный естественно передан временным придаточным. Сохранён древний способ обозначения времени; современный эквивалент дан в сноске.
- source_word: σκότος
  choice: тьма
  rationale: «Тьма» точно передаёт значение существительного и соответствует возвышенному, но понятному регистру повествования.
- source_word: ἐγένετο
  choice: покрыла
  rationale: В сочетании «тьма покрыла» естественно по-русски передаётся наступление и распространение тьмы, выраженное греческим ἐγένετο с последующим ἐπί.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: всю землю
  rationale: Слово γῆ допускает значения «земля, страна, территория» и «Земля». Строчная буква в основном тексте не навязывает глобального толкования, а возможный более широкий смысл отмечен в сноске.
- source_word: ἕως ὥρας ἐνάτης
  choice: до девятого часа
  rationale: Сохранён исходный способ обозначения времени и обеспечен параллелизм с «шестым часом».
theological_decisions:
- issue: Масштаб тьмы в выражении ἐφ’ ὅλην τὴν γῆν
  choice: всю землю
  alternative: всю Землю
  rationale: Греческое γῆ лексически неоднозначно и может обозначать как землю или территорию, так и всю Землю. Основной текст сохраняет эту неоднозначность, а глобальное прочтение явно представлено в сноске без догматического разрешения вопроса.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным звучанием. Древнее обозначение часов сохранено в основном тексте, а пояснение вынесено в сноску.
