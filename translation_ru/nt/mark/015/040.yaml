  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: ru
  text: Были также женщины, наблюдавшие издали[a]. Среди них были Мария Магдалина, Мария, мать Иакова, называемого Малым[b], и Иосии[c], и Саломия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с расстояния».'
    reason: lexical_alternative
  - marker: b
    text: Греч. слово может означать также «меньший»; неизвестно, относится ли оно к возрасту, росту или положению.
    reason: lexical_alternative
  - marker: c
    text: В греческом здесь стоит имя Иосия (Ἰωσῆς), форма, отличная от имени Иосиф.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: Были там и женщины
  rationale: Естественно передаёт повествовательное δέ и добавочное καί; слово «там» в русском связывает фразу с местом происходящего, не добавляя нового обстоятельства.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: наблюдавшие издали
  rationale: Причастная конструкция сохраняет длительное зрительное наблюдение; «издали» кратко и естественно передаёт пространственное значение.
- source_word: ἐν αἷς
  choice: Среди них были
  rationale: Ясно обозначает названных далее женщин как часть более широкой группы.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Мария Магдалина
  rationale: Устоявшаяся русская форма имени и прозвания.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Мария, мать Иакова Младшего и Иосии
  rationale: «Мать» относится к обоим родительным именам. «Младшего» служит естественным различительным обозначением, а примечание сохраняет неоднозначность μικρός.
- source_word: Ἰωσῆτος
  choice: Иосии
  rationale: Передаёт особую греческую форму имени Ἰωσῆς и не сглаживает её до формы «Иосиф».
- source_word: Σαλώμη
  choice: Саломия
  rationale: Устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Значение τοῦ μικροῦ при имени Иакова
  choice: Иаков Младший
  alternative: Иаков Малый / Иаков меньший / Иаков невысокого роста
  rationale: Выражение является различительным прозванием, но греческое μικρός само по себе не устанавливает, идёт ли речь о возрасте, росте или положении. Основной текст выбирает понятную традиционную идентификацию, а примечание сохраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-достоинственное. Синтаксис следует греческой структуре без неестественной буквальности, а неоднозначность τοῦ μικροῦ вынесена в примечание.
