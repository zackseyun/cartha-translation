  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: ru
  text: 'И приводят Его на место, называемое Голгофой, что в переводе означает: «Место черепа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: приводят
  rationale: Историческое настоящее сохранено. «Приводят» естественно передаёт движение к месту назначения и не утверждает, что Иисуса несли на руках.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: на место Голгофа
  rationale: Предлог с винительным обозначает движение к месту; сохранены и τόπον, и собственное имя. Слово «называемое» не добавлено, поскольку его нет в греческом тексте.
- source_word: Γολγοθᾶν
  choice: Голгофа
  rationale: Собственное имя передано в закрепившейся русской форме.
- source_word: μεθερμηνευόμενον
  choice: что в переводе означает
  rationale: Формулировка естественна по-русски и сохраняет явное указание на перевод, а не только на общее значение названия.
- source_word: Κρανίου Τόπος
  choice: Место черепа
  rationale: Родительный падеж передаёт греческое сочетание без внесения определённости, которую русский язык здесь грамматически не выражает.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением повествовательного исторического настоящего. Заглавная буква в «Его» соответствует принятому благоговейному библейскому регистру; выражение «Место черепа» передано ясно и без искусственного воспроизведения отсутствующего в русском артикля.
