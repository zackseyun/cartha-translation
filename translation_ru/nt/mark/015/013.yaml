  text: But they cried out again, “Crucify him!”
translation:
  language: ru
  text: 'Но они снова закричали: «Распни Его!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: они
  rationale: Субстантивированное существительное с артиклем указывает на уже названную в контексте группу; местоимение «они» естественно передаёт эту анафорическую связь, не уточняя без основания «народ» или «толпа».
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает здесь лёгкое противопоставление ответу на предшествующие слова Пилата; «но» ясно и без чрезмерного усиления передаёт эту связь.
- source_word: πάλιν
  choice: снова
  rationale: Наречие прямо выражает повторение крика; «снова» естественно звучит в современном русском повествовании.
- source_word: ἔκραξαν
  choice: закричали
  rationale: Глагол κράζω обозначает громкий крик. «Закричали» сохраняет интенсивность и хорошо сочетается с последующей прямой речью.
- source_word: Σταύρωσον
  choice: Распни
  rationale: Аористный императив второго лица единственного числа прямо обращён к Пилату. Краткое повеление «Распни» точно сохраняет форму и силу греческого текста, не заменяя её более косвенным «вели распять».
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение является прямым дополнением и относится к Иисусу; «Его» точно и естественно передаёт эту отсылку.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая, напряжённая и достойная по тону. Традиционное «распни» остаётся понятным современному читателю и точно обозначает требуемую казнь. Заглавная буква в «Его» следует принятому в русском библейском стиле уважительному написанию местоимения, относящегося к Иисусу.
