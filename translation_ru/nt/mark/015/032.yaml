  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: ru
  text: «Пусть Мессия[a], Царь Израиля, сейчас сойдёт с креста, чтобы мы увидели и поверили!» И распятые вместе с Ним тоже поносили Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός означает «Помазанник» и здесь употреблено как царско-мессианский титул.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ χριστός
  choice: Мессия
  rationale: В данном контексте это титул Помазанника и часть насмешки над царскими притязаниями Иисуса; «Мессия» передаёт смысл титула яснее, чем традиционное «Христос».
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: Царь Израиля
  rationale: Прямо передаёт титульное сочетание и сохраняет царскую направленность насмешки.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: пусть ... сейчас сойдёт с креста
  rationale: Форма третьего лица передаёт насмешливое требование, а «сейчас» сохраняет подчёркнутую немедленность νῦν.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: чтобы мы увидели и поверили
  rationale: Сохраняет целевую конструкцию и краткую последовательность двух глаголов без пояснительного расширения.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: распятые вместе с Ним
  rationale: Естественно и компактно передаёт субстантивированное причастие и совместность распятия.
- source_word: ὠνείδιζον αὐτόν
  choice: поносили Его
  rationale: «Поносили» передаёт сильное словесное оскорбление и упрёк; несовершенный вид отражает продолжавшееся действие.
theological_decisions:
- issue: Передача Χριστός в контексте насмешки
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово функционирует как иудейский царско-мессианский титул, а не как имя; выбранный вариант сохраняет смысл «Помазанник» и связь с последующим титулом «Царь Израиля».
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство библейского повествования и резкость насмешливого вызова. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции.
