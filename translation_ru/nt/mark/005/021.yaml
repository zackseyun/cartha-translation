id: MRK.5.21
reference: Mark 5:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: ru
  text: Когда Иисус снова переправился в лодке на другой берег[a], вокруг Него собралось множество людей. Он был у моря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на другой берег Галилейского моря — озера, которое в Евангелиях обычно называется морем.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: когда ... переправился
  rationale: Аористное причастие в родительном самостоятельном обороте обозначает обстоятельство, предшествующее собиранию толпы. Русское «когда ... переправился» естественно передаёт временную связь; завершённость действия выражена совершенным видом.
- source_word: ἐν τῷ πλοίῳ
  choice: в лодке
  rationale: Предложное сочетание сохранено явно. «Лодка» естественно для повествовательной обстановки на Галилейском море и точнее современного употребления, чем «корабль».
- source_word: πάλιν
  choice: снова
  rationale: Наречие указывает на повторность переправы; «снова» ясно и естественно передаёт этот смысл.
- source_word: εἰς τὸ πέραν
  choice: на другой берег
  rationale: В контексте переправы через водоём субстантивированное πέραν обозначает противоположную сторону. По-русски «на другой берег» естественнее и конкретнее буквального «на другую сторону».
- source_word: συνήχθη
  choice: собралось
  rationale: Хотя глагол формально стоит в пассиве, в данном контексте он естественно передаётся русским возвратным глаголом со значением самостоятельного собирания.
- source_word: ὄχλος πολὺς
  choice: множество людей
  rationale: Выражение передаёт многочисленную толпу. «Множество людей» звучит естественно и достойно в современном русском; смысл размера сохранён.
- source_word: ἐπ’ αὐτόν
  choice: вокруг Него
  rationale: При συνάγω сочетание ἐπί с винительным выражает направленность и схождение к Иисусу. «Вокруг Него» естественно передаёт пространственный результат этого движения.
- source_word: παρὰ τὴν θάλασσαν
  choice: у моря
  rationale: παρά с винительным здесь обозначает положение возле берега. Краткое русское «у моря» естественно передаёт местонахождение.
- source_word: θάλασσαν
  choice: моря
  rationale: Сохранён исходный термин «море», как принято в евангельском наименовании Галилейского моря; географическая особенность поясняется в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Синтаксис разделён на два предложения ради естественности и удобочитаемости без изменения смысловых связей. Местоимение «Него» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
