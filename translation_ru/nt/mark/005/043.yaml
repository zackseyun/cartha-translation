lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: строго приказал им
  rationale: Средний залог διαστέλλομαι обозначает настойчивое распоряжение или строгое предписание, а πολλὰ усиливает его; по-русски это естественно передаётся наречием «строго».
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: чтобы никто об этом не узнал
  rationale: ἵνα с аористом сослагательного наклонения выражает цель предписания; γνοῖ здесь указывает на то, что событие не должно стать кому-либо известным.
- source_word: εἶπεν δοθῆναι αὐτῇ φαγεῖν
  choice: велел дать ей поесть
  rationale: Хотя εἶπεν буквально означает «сказал», инфинитивная конструкция в данном контексте передаёт распоряжение. Русское «велел» естественно выражает эту силу; пассив δοθῆναι идиоматично передан неопределённо-личной конструкцией.
theological_decisions:
- issue: Мотив мессианской тайны и объём запрета
  choice: Передать лишь строгое требование не разглашать случившееся, не объясняя его богословскую причину.
  alternative: Явно связать распоряжение с более широким мотивом мессианской тайны или ограничить его только ближайшими свидетелями.
  rationale: Сам стих сообщает о строгом распоряжении присутствующим, чтобы никто не узнал о событии, но не раскрывает причину и не уточняет предполагаемый круг тех, от кого его следует скрыть.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Строго приказал» сохраняет силу первого распоряжения, а «велел дать ей поесть» звучит естественно и передаёт повелительный смысл второй конструкции. Местоимение «Он» написано с прописной буквы в соответствии с традиционным русским библейским оформлением.
