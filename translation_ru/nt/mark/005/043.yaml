  text: И Он строго приказал им, чтобы никто об этом не узнал[a], и велел дать ей поесть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «строго-настрого приказал им, чтобы никто об этом не узнал». Греческое выражение буквально включает усилительное слово со значением «много» и подчёркивает настойчивость приказа.'
    reason: lexical_alternative
