  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: ru
  text: 'И они умоляли Его: «Пошли нас в свиней, чтобы мы вошли в них».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: стали умолять
  rationale: В данном контексте глагол передаёт настойчивую просьбу нечистых духов; «стали умолять» естественно звучит по-русски и сохраняет повествовательный аспект формы.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому русскому библейскому оформлению личного местоимения, относящегося к Нему.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание просьбы. В современном русском его естественно передать синтаксически, не добавляя избыточного «говоря».
- source_word: Πέμψον
  choice: Пошли
  rationale: Сохраняет прямое значение πέμπω «послать»; подразумеваемое разрешение не подменяет явную формулировку оригинала.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое соответствие местоимению первого лица множественного числа.
- source_word: εἰς τοὺς χοίρους
  choice: в свиней
  rationale: χοῖρος означает «свинья»; форма «в свиней» естественно передаёт направленность и последующее вселение.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает цель просьбы и сохраняет связь между частями высказывания.
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: мы вошли в них
  rationale: Буквально и ясно передаёт вхождение духов в животных, не усиливая текст словом «вселились».
theological_decisions:
- issue: Характер просьбы духов к Иисусу
  choice: Духи настойчиво просят Иисуса послать их в свиней, тем самым повествование показывает их подчинённость Его власти.
  alternative: Передать это как нейтральную просьбу о перемещении, ослабив оттенок подчинения.
  rationale: «Умолять» и повелительное «Пошли» отражают лексику исходного текста и его повествовательное напряжение, не добавляя доктринальных выводов.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Причастие λέγοντες передано русской пунктуацией при прямой речи ради естественности; лексическая конкретность и повтор направления «в свиней… в них» сохранены.
