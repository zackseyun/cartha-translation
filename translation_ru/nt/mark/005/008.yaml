  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: ru
  text: 'Ведь Он говорил ему: «Выйди из человека, нечистый дух!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжавшееся или повторявшееся в прошлом действие; русское несовершенное «говорил» естественно сохраняет этот аспект.
- source_word: γὰρ
  choice: Ведь
  rationale: Частица вводит пояснение к предыдущему стиху; «ведь» естественно передаёт пояснительную связь в русском повествовании.
- source_word: αὐτῷ
  choice: ему
  rationale: 'Дательный местoимения сохранён без уточнения референта: в повествовательной рамке Иисус говорит человеку, тогда как повеление обращено к находящемуся в нём духу.'
- source_word: Ἔξελθε
  choice: Выйди
  rationale: Аористный императив выражает прямое повеление; «выйди» — точный и естественный русский эквивалент движения изнутри наружу.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: нечистый дух
  rationale: Хотя греческая форма имеет артикль и формально является именительным падежом, после императива сочетание выполняет функцию обращения; русский звательный именительный «нечистый дух» это ясно передаёт.
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: из этого человека
  rationale: ἐκ обозначает движение изнутри, а определённый артикль указывает на конкретного человека, уже присутствующего в сцене; указательное «этого» делает такую определённость естественной по-русски.
theological_decisions:
- issue: Передача πνεῦμα ἀκάθαρτον в контексте изгнания беса
  choice: нечистый дух
  alternative: злой дух
  rationale: «Нечистый дух» непосредственно передаёт греческое выражение и сохраняет его смысловые оттенки нечистоты; «злой дух» было бы более толковательным.
- issue: Референт αὐτῷ и адресат повеления
  choice: Сохранено «ему», а «нечистый дух» оформлено как прямое обращение
  alternative: «духу» или «ему, духу»
  rationale: 'Так сохраняется напряжение греческого текста: повествователь говорит, что Иисус обращался к нему, но само повеление явно направлено нечистому духу.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавная буква в «Он» следует принятой русской библейской практике для обозначения Иисуса. Порядок слов сохраняет пояснительный характер стиха и прямоту повеления.
