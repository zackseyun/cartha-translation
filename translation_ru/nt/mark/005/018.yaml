  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: ru
  text: Когда Он садился в лодку, человек, прежде одержимый бесами, настойчиво просил Его позволить ему быть с Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: Когда Он садился
  rationale: Генитив абсолютный с причастием настоящего времени обозначает действие, происходящее одновременно с основной просьбой; несовершенный вид «садился» естественно передаёт процесс.
- source_word: πλοῖον
  choice: лодку
  rationale: В повествовании о Галилейском море современное русское «лодка» точнее и естественнее, чем подразумевающее крупное судно слово «корабль».
- source_word: παρεκάλει
  choice: настойчиво просил
  rationale: Имперфект передаёт продолженную или повторявшуюся просьбу, а παρακαλέω в данном контексте выражает сильную мольбу.
- source_word: ὁ δαιμονισθείς
  choice: человек, который прежде был одержим бесами
  rationale: Субстантивированное причастие указывает на уже исцелённого человека. «Прежде был» ясно показывает предшествующее состояние, а множественное «бесами» соответствует контексту рассказа о множестве бесов.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: позволить ему остаться с Ним
  rationale: Оборот с ἵνα передаёт содержание просьбы. «Остаться с Ним» сохраняет личностный смысл пребывания рядом и звучит естественно по-русски; слово «позволить» имплицитно раскрывает просительный оборот.
theological_decisions:
- issue: Передача δαιμονισθείς как обозначения реального бесовского порабощения без привнесения медицинских или метафорических категорий
  choice: одержим бесами
  alternative: находился во власти бесов
  rationale: «Одержим бесами» — ясное и общепонятное русское выражение для описанного в евангельском повествовании состояния. Оно не сводит происходящее к болезни и при этом не добавляет конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык, доступный широкому читателю. Синтаксис плавный и повествовательный; местоимения, относящиеся к Иисусу, даны с прописной буквы в соответствии с распространённой русской библейской традицией.
