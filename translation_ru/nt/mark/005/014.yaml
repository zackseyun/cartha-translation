lexical_decisions:
- source_word: βόσκοντες
  choice: Пастухи, пасшие
  rationale: Субстантивированное причастие обозначает людей, присматривавших за стадом; «пастухи, пасшие их» естественно передаёт и их роль, и действие.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение сохраняет форму греческого текста и ясно относится к свиньям из предыдущего стиха.
- source_word: ἔφυγον
  choice: убежали
  rationale: Передаёт внезапное бегство живым и естественным русским глаголом.
- source_word: ἀπήγγειλαν
  choice: рассказали обо всём
  rationale: Глагол означает сообщить известие; добавление «обо всём» естественно обозначает содержание сообщения, подразумеваемое контекстом.
- source_word: εἰς τὴν πόλιν
  choice: в городе
  rationale: При глаголе сообщения русский естественно обозначает место распространения вести предложным оборотом «в городе».
- source_word: εἰς τοὺς ἀγρούς
  choice: в окрестностях
  rationale: Во множественном числе и в противопоставлении городу ἀγροί обозначает сельскую местность вокруг города; «в окрестностях» естественно передаёт этот смысл.
- source_word: ἦλθον
  choice: люди пришли
  rationale: У греческого глагола подразумевается субъект во множественном числе. «Люди» ясно и ненавязчиво указывает на услышавших весть жителей, не сужая их до одной группы.
- source_word: ἰδεῖν
  choice: посмотреть
  rationale: Инфинитив цели после глагола движения естественно передаётся как «пришли посмотреть».
- source_word: τί ἐστιν τὸ γεγονός
  choice: что произошло
  rationale: Краткая и естественная русская передача вопроса о случившемся событии; перфектный результативный смысл сохраняется контекстом.
