source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: ru
  text: И он позволил им. Нечистые духи вышли и вошли в свиней, и стадо — около двух тысяч свиней — бросилось с крутого склона[a] в море[b], и свиньи утонули в море.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «с обрыва»; греческое слово может обозначать крутой склон, крутой берег или обрыв.
    reason: lexical_alternative
  - marker: b
    text: Греч. «в море». Имеется в виду Галилейское море.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: позволил им
  rationale: «Позволил» естественно и точно передаёт предоставление разрешения; местоимение относится к нечистым духам из ближайшего контекста.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: нечистые духи
  rationale: Устоявшееся и понятное выражение сохраняет личностно-духовный характер названных существ и смысл ἀκάθαρτα.
- source_word: ἐξελθόντα ... εἰσῆλθον
  choice: вышли и вошли
  rationale: Передаёт последовательность действий, выраженную аористным причастием и личной формой глагола, без тяжеловесной русской конструкции.
- source_word: εἰς τοὺς χοίρους
  choice: в свиней
  rationale: Современное нейтральное обозначение животных; конструкция естественно передаёт движение внутрь.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: стадо ... бросилось
  rationale: «Бросилось» выражает внезапное стремительное движение; единственное число согласуется в русском с собирательным существительным «стадо».
- source_word: κατὰ τοῦ κρημνοῦ
  choice: с крутого склона
  rationale: κρημνός может обозначать крутой склон, обрыв или крутой берег; основной текст не навязывает представление об отвесной скале.
- source_word: ὡς δισχίλιοι
  choice: около двух тысяч свиней
  rationale: «Около» сохраняет приблизительность ὡς; повтор слова «свиней» ясно указывает, что речь идёт о числе животных.
- source_word: εἰς τὴν θάλασσαν
  choice: в море
  rationale: Сохраняет буквальное наименование θάλασσα, тогда как географическое пояснение вынесено в сноску.
- source_word: ἐπνίγοντο
  choice: свиньи утонули
  rationale: Естественно по-русски передаёт гибель животных в воде. Явное подлежащее устраняет возможную двусмысленность после единственного числа «стадо»; несовершенный вид греческой формы не требует неестественного акцента на длительности процесса.
theological_decisions:
- issue: К кому относится «им»
  choice: К нечистым духам, просившим разрешения войти в свиней
  alternative: Оставить референт совершенно неуточнённым
  rationale: Непосредственный контекст определяет референт, однако перевод не добавляет поясняющего существительного в основной текст и сохраняет местоименную форму оригинала.
- issue: Личностный характер нечистых духов
  choice: Сохранить выражение «нечистые духи»
  alternative: Передать как безличные «злые силы»
  rationale: Греческий текст описывает духов как действующих существ; перевод сохраняет это представление, не добавляя дальнейших догматических толкований.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Местоимение «он» дано со строчной буквы, без привнесения конфессиональной типографской традиции. Повтор «в море» сохранён вслед за греческим текстом; повтор «свиней» обеспечивает ясность русской фразы.
