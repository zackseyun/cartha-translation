  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: ru
  text: 'Но Иисус, услышав сказанное[a], говорит начальнику синагоги: «Не бойся, только верь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приняв сказанное во внимание» (или «оставив сказанное без внимания»). Греческое слово παρακούσας допускает оба смысла.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «продолжай верить»; также возможно: «только доверься». Греческий глагол — πιστεύω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: услышав
  rationale: Причастие может означать как то, что Иисус услышал сказанное, так и то, что Он оставил его без внимания. В данном контексте непосредственный ответ Иисуса на только что прозвучавшее сообщение естественнее всего передаётся словом «услышав»; альтернативный смысл сохранён в сноске.
- source_word: τὸν λόγον λαλούμενον
  choice: сказанное
  rationale: Естественное современное русское выражение, обозначающее прозвучавшее сообщение; оно передаёт смысл греческой конструкции без тяжеловесного буквального оборота «говоримое слово».
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для Марка историческое настоящее и живость повествования.
- source_word: ἀρχισυναγώγῳ
  choice: начальнику синагоги
  rationale: Устоявшееся и понятное обозначение руководителя или председательствующего должностного лица синагоги.
- source_word: Μὴ φοβοῦ
  choice: Не бойся
  rationale: Прямой, естественный и точный русский эквивалент греческого запретительного повеления.
- source_word: μόνον
  choice: только
  rationale: 'Передаёт ограничительный смысл наречия: от начальника синагоги требуется не поддаваться страху, а верить.'
- source_word: πίστευε
  choice: верь
  rationale: Прямой эквивалент настоящего императива πιστεύω. Форма настоящего времени может подразумевать продолжение веры, однако русское «верь» сохраняет это возможное значение без добавления отсутствующего в тексте слова.
theological_decisions:
- issue: Смысл παρακούσας
  choice: Иисус услышал прозвучавшее сообщение и обратился к начальнику синагоги.
  alternative: Иисус не принял сказанное во внимание или оставил его без внимания.
  rationale: Оба смысла лексически возможны. Связь последующих слов Иисуса с только что прозвучавшим сообщением поддерживает значение «услышав», но подлинная повествовательная неоднозначность сохранена в сноске.
- issue: Передача πιστεύω в повелении Иисуса
  choice: верь
  alternative: продолжай верить; доверься
  rationale: «Верь» — наиболее прямой русский эквивалент и не сужает объект или характер веры. Возможный длительный оттенок настоящего императива и смысл доверия отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и краткости прямой речи. Историческое настоящее «говорит» передаёт живой повествовательный стиль Марка. Формулировка «услышав сказанное» естественна по-русски и не перегружает стих буквальным воспроизведением греческой конструкции.
