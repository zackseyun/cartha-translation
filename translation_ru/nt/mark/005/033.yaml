  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: ru
  text: Женщина же, испугавшись и дрожа, зная, что с ней произошло, подошла, пала перед Ним[a] и рассказала Ему всю правду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пала к Его ногам»; или: «простёрлась перед Ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Постпозитивная частица естественно передаёт лёгкое противопоставление и продолжение повествования без чрезмерно резкого «но».
- source_word: ἡ γυνὴ
  choice: женщина
  rationale: Контекст однозначно указывает на уже упомянутую женщину; в русском языке определённость выражается контекстом.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: испугавшись и дрожа
  rationale: Сохраняет сочетание двух причастных форм и живо передаёт её страх и физическую дрожь.
- source_word: εἰδυῖα
  choice: зная
  rationale: Причастная конструкция сохраняет обстоятельственную связь, не делая причинное значение более явным, чем в греческом.
- source_word: ὃ γέγονεν αὐτῇ
  choice: что с ней произошло
  rationale: Естественное русское выражение для пережитого ею события — исцеления — без добавления отсутствующей в тексте конкретизации.
- source_word: ἦλθεν
  choice: подошла
  rationale: В данном эпизоде обозначает приближение женщины к Иисусу; «подошла» звучит естественнее буквального «пришла».
- source_word: προσέπεσεν αὐτῷ
  choice: пала перед Ним
  rationale: Передаёт физическое падение перед Иисусом и возможный оттенок почтения или мольбы, не определяя этот жест как поклонение.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: рассказала Ему всю правду
  rationale: Идиоматично передаёт глагол речи с содержательным дополнением и сохраняет усиление πᾶσαν — «всю».
theological_decisions:
- issue: Характер жеста в προσέπεσεν αὐτῷ
  choice: пала перед Ним
  alternative: пала к Его ногам; простёрлась перед Ним
  rationale: Глагол допускает жест почтения, страха, отчаяния или мольбы. Выбранная формулировка сохраняет эту многозначность и не утверждает прямо, что речь идёт о богослужебном поклонении.
translation_notes:
  register: Современный литературный русский язык, повествовательный и dignified регистр. Заглавные местоимения при обращении к Иисусу соответствуют принятому русскому библейскому оформлению; они не добавляют к смыслу греческого текста отдельного богословского утверждения.
