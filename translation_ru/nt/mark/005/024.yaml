  text: И он пошёл с ним. За ним следовала большая толпа и теснила его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напирала на него» или «сдавливала его». Греческий глагол передаёт физическое давление толпы на Иисуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: Аорист описывает движение Иисуса вслед за Иаиром. «Пошёл» естественно передаёт действие в данном контексте, не добавляя оттенка удаления, возможного у «ушёл».
- source_word: μετ’ αὐτοῦ
  choice: с ним
  rationale: μετά с родительным падежом обозначает совместное движение; «с ним» — прямой и естественный русский эквивалент.
- source_word: ἠκολούθει
  choice: следовала
  rationale: Имперфект выражает продолжавшееся действие. В сочетании с описанием толпы русская форма прошедшего времени естественно передаёт фоновый процесс.
- source_word: ὄχλος πολύς
  choice: большая толпа
  rationale: πολύς указывает здесь на многочисленность толпы; «большая толпа» ясно и современно передаёт этот смысл.
- source_word: συνέθλιβον
  choice: теснила его со всех сторон
  rationale: Глагол συνθλίβω передаёт физическое сдавливание, создаваемое тесно окружившей Иисуса толпой. «Теснила… со всех сторон» сохраняет осязаемость сцены, не подразумевая непременно причинения вреда.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к Иисусу и естественно передаётся русским «его».
theological_decisions: []
