  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: ru
  text: И Он никому не позволил идти с Ним, кроме Петра, Иакова и Иоанна, брата Иакова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: не позволил
  rationale: В сочетании с инфинитивом ἀφίημι означает «позволять, допускать». Отрицательная форма естественно передаёт решение Иисуса не брать с собой остальных.
- source_word: οὐδένα
  choice: никому
  rationale: Дательный падеж обусловлен русской конструкцией «позволить кому-либо»; вместе с отрицанием он сохраняет значение полного исключения.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: идти с Ним
  rationale: Составной глагол и оборот μετ’ αὐτοῦ обозначают совместное следование. «Идти с Ним» естественно и точно передаёт сопровождение в данном повествовательном контексте.
- source_word: εἰ μὴ
  choice: кроме
  rationale: Здесь оборот вводит исключение, а не условие.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Петра, Иакова и Иоанна
  rationale: Имена переданы в традиционной русской библейской форме; обычное русское перечисление звучит естественно и сохраняет всех трёх названных учеников.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: брата Иакова
  rationale: Приложение прямо уточняет, о каком Иоанне идёт речь, и сохраняет буквальное родственное обозначение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные буквы в местоимениях «Он», «Ним» использованы как традиционный русский способ обозначения Иисуса; смысловой информации сверх оригинала они не добавляют.
