  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: ru
  text: Там, у горы, было большое стадо пасущихся свиней.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом с горой».'
