lexical_decisions:
- source_word: ἦν δὲ
  choice: паслось
  rationale: Греческая конструкция сообщает о наличии стада и одновременно связана с причастием βοσκομένη; в естественном русском предложении это передано единым сказуемым. Мягкий повествовательный переход δέ не требует отдельного слова.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямой и естественный русский эквивалент указательного наречия места.
- source_word: πρὸς τῷ ὄρει
  choice: у горы
  rationale: Πρός с дательным обозначает положение рядом с горой; «у горы» естественно передаёт близость, не уточняя её чрезмерно.
- source_word: ἀγέλη
  choice: стадо
  rationale: Обычное современное русское обозначение группы пасущихся животных.
- source_word: χοίρων
  choice: свиней
  rationale: Нейтральный и современный эквивалент χοῖρος; архаичное «свиньи» как собирательное здесь не требуется.
- source_word: μεγάλη
  choice: большое
  rationale: В данном контексте слово характеризует величину или многочисленность стада; «большое стадо» — естественное русское сочетание.
- source_word: βοσκομένη
  choice: паслось
  rationale: Причастие описывает стадо, которое кормилось на выпасе. «Паслось» кратко и естественно передаёт эту сцену, не вводя внешнего кормящего субъекта.
