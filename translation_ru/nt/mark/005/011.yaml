    rationale: «Там, у горы, паслось большое стадо свиней» сообщает о выпасе, но не воспроизводит явно сообщение «там было ... стадо». В сочетании ἦν ... ἀγέλη ... βοσκομένη греческий текст содержит и наличие стада, и его состояние.
  revised_text: Там, у горы, было большое стадо пасущихся свиней.[a]
