  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: ru
  text: И вот пришёл один из начальников синагоги, по имени Иаир. Увидев Иисуса, он пал к Его ногам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: пришёл
  rationale: Историческое настоящее в повествовании Марка естественно передано русским прошедшим временем; частица «вот» отчасти сохраняет живость появления нового участника.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: один из начальников синагоги
  rationale: Сохранена партитивная конструкция «один из». ἀρχισυνάγωγος обозначает человека, отвечавшего за руководство и устройство жизни синагоги; традиционное «начальник синагоги» понятно и достаточно точно.
- source_word: ὀνόματι Ἰάϊρος
  choice: по имени Иаир
  rationale: Естественная русская передача греческого оборота называния; имя дано в устоявшейся русской библейской форме.
- source_word: ἰδὼν αὐτόν
  choice: увидев Иисуса
  rationale: Аористное причастие передано деепричастием, сохраняющим последовательность действий. Местоимение раскрыто именем «Иисуса», чтобы в русском тексте ясно обозначить референта без изменения смысла.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: он пал к Его ногам
  rationale: Второе историческое настоящее передано прошедшим временем. Оборот описывает физическое падение у ног Иисуса и не истолковывает его как поклонение.
theological_decisions:
- issue: Характер жеста перед Иисусом
  choice: пал к Его ногам
  alternative: поклонился Ему; преклонил перед Ним колени
  rationale: Греческий текст описывает действие, которое может выражать почтение, отчаяние или мольбу, но прямо не называет его поклонением. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским достоинством. Исторические настоящие согласованно переданы прошедшим временем. Предложение разделено на два для ясности; начальное καί передано сочетанием «И вот», сохраняющим повествовательный переход и живость.
