  text: καὶ ἤρξαντο παρακαλεῖν αὐτὸν ἀπελθεῖν ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: ru
  text: И они стали просить Его уйти из их края.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали настойчиво просить Его покинуть их владения».'
    reason: 'Лексическая альтернатива: παρακαλεῖν может подчёркивать настойчивость просьбы, а ὅρια — обозначать территорию или владения.'
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь с предыдущим стихом без добавления явно не выраженного временного оттенка.
- source_word: ἤρξαντο
  choice: стали
  rationale: В сочетании с инфинитивом естественно передаёт начинательное значение в современном русском повествовании.
- source_word: παρακαλεῖν
  choice: просить
  rationale: Передаёт настойчивую просьбу; более сильное «умолять» возможно, но в русском могло бы чрезмерно конкретизировать степень эмоциональности.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому благоговейному оформлению библейского текста на русском языке, не меняя смысла.
- source_word: ἀπελθεῖν
  choice: уйти
  rationale: Естественно передаёт инфинитив ἀπέρχομαι как содержание просьбы.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: из их края
  rationale: ὅρια буквально обозначает границы, а во множественном числе в данном обороте — ограниченную ими местность; «из их края» звучит естественно и сохраняет территориальный смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранено начальное «И» как повествовательная связь; конструкция не архаизирована.
