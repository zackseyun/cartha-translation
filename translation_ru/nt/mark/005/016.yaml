  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: ru
  text: Очевидцы рассказали им о том, как всё произошло с одержимым[a], а также о свиньях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с бесноватым»; греческое слово само по себе не уточняет числа бесов.'
    reason: Лексическая альтернатива и сохранение формальной неопределённости греческого выражения.
lexical_decisions:
- source_word: διηγήσαντο
  choice: рассказали
  rationale: Глагол обозначает связное изложение случившегося; «рассказали» естественно звучит в современном русском повествовании.
- source_word: οἱ ἰδόντες
  choice: очевидцы
  rationale: Субстантивированное причастие указывает на видевших происшедшее. «Очевидцы» кратко и ясно передаёт их роль, не добавляя сведений сверх контекста.
- source_word: πῶς ἐγένετο
  choice: что произошло
  rationale: В данном контексте оборот вводит рассказ о случившемся с человеком. Буквальное «как произошло» по-русски требует тяжеловесного дополнения; «что произошло» естественно передаёт смысл, хотя несколько ослабляет оттенок образа или хода события.
- source_word: τῷ δαιμονιζομένῳ
  choice: с человеком, одержимым бесами
  rationale: Форма обозначает человека, находившегося под властью демонических сил. Оборот понятен современному читателю, сохраняет личностный референт и согласуется с упомянутым ранее множеством бесов.
- source_word: περὶ τῶν χοίρων
  choice: и со свиньями
  rationale: В сочетании с «что произошло» русская конструкция «и со свиньями» естественно передаёт вторую тему рассказа; греческое περί буквально допускает «о свиньях».
theological_decisions:
- issue: Передача δαιμονιζομένῳ в повествовании о демоническом воздействии
  choice: человеком, одержимым бесами
  alternative: бесноватым; человеком, одержимым бесом
  rationale: Основной вариант ясно сохраняет представленную Марком реальность демонического порабощения, не сводит её к психологическому состоянию и не превращает человека лишь в обозначение его недуга. Множественное число соответствует ближайшему контексту, хотя сама греческая форма числа бесов не уточняет.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. «Очевидцы» выбрано ради естественной краткости; «свиньи» — нейтральное современное обозначение. Маркер [a] помещён непосредственно после спорного выражения.
