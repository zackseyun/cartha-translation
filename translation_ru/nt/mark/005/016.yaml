- from: Очевидцы рассказали им, что произошло с человеком, одержимым бесами[a], и со свиньями.
  to: Очевидцы рассказали им о том, как всё произошло с одержимым[a], а также о свиньях.
  rationale: 'Правка сохраняет значение πῶς («как всё произошло») и различает два предмета сообщения: произошедшее с одержимым и сведения о свиньях. «Одержимый» воспроизводит греческое субстантивированное причастие и не добавляет невыраженного числа демонов; сноска сохраняет естественный альтернативный вариант.'
