  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: ru
  text: И постоянно, ночью и днём, среди гробниц и в горах он кричал и резал себя камнями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: постоянно, ночью и днём
  rationale: Оборот выражает непрерывность во всём указанном промежутке времени; перевод естественно передаёт как продолжительность, так и последовательность «ночью и днём».
- source_word: μνήμασιν
  choice: гробниц
  rationale: Слово обозначает места погребения; «гробницы» соответствует вероятному контексту высеченных в скале погребальных помещений точнее, чем более общее «могилы».
- source_word: ὄρεσιν
  choice: горах
  rationale: Прямое значение ὄρος — «гора»; форма множественного числа сохранена без контекстуального смягчения до «холмов».
- source_word: ἦν κράζων
  choice: он кричал
  rationale: Перифрастическая конструкция с имперфектом обозначает продолжавшееся или повторявшееся действие; это значение поддерживается наречием «постоянно» и общим строением фразы.
- source_word: κατακόπτων ἑαυτὸν
  choice: рассекал себя
  rationale: κατακόπτω сильнее нейтрального «резать» и передаёт нанесение себе порезов или ран; «рассекал» сохраняет интенсивность, не добавляя идеи полного увечья.
- source_word: λίθοις
  choice: камнями
  rationale: Дательный падеж имеет инструментальное значение; русский творительный естественно передаёт орудие действия.
theological_decisions: []
