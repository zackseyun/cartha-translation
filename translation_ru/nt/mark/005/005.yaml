  register: Современный литературный русский язык, сдержанный и выразительный. Порядок обстоятельств в основном следует греческому тексту. Слово «гробницы» сохраняет историко-культурную конкретность, а «рассекал себя» передаёт силу исходного глагола без излишней натуралистичности.
