  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: ru
  text: И они смеялись над Ним[a]. Но Он, выслав всех, берёт с Собой отца и мать ребёнка и тех, кто был с Ним[b], и входит туда, где находился ребёнок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насмехались над Ним». Греческий глагол может обозначать насмешливый смех.'
    reason: lexical_alternative
  - marker: b
    text: То есть учеников, сопровождавших Его.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: смеялись над Ним
  rationale: Имперфект передаёт продолжавшуюся насмешливую реакцию; выражение естественно по-русски и сохраняет прямое значение смеха.
- source_word: ἐκβαλὼν πάντας
  choice: выслав всех
  rationale: Предшествующее обстоятельство обозначает удаление присутствующих; «выслав» естественно и не создаёт ненужной ассоциации с изгнанием бесов.
- source_word: παραλαμβάνει
  choice: берёт с Собой
  rationale: Сохранено настоящее историческое Марка; приставка и контекст передают, что Иисус берёт избранных людей вместе с Собой.
- source_word: παιδίου / παιδίον
  choice: ребёнка / ребёнок
  rationale: Сохранено нейтральное обозначение παιδίον, хотя из контекста известно, что речь идёт о дочери Иаира.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: тех, кто был с Ним
  rationale: Формулировка сохраняет неопределённость греческого выражения; личности сопровождавших пояснены в сноске.
- source_word: εἰσπορεύεται
  choice: входит
  rationale: Естественный русский эквивалент движения внутрь; настоящее историческое сохранено.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: туда, где находился ребёнок
  rationale: Передаёт только явно выраженное местонахождение и не добавляет, что ребёнок лежал.
theological_decisions:
- issue: Историческое настоящее и повествовательная выразительность
  choice: 'Сохранить настоящее время: «берёт… входит»'
  alternative: 'Передать прошедшим временем: «взял… вошёл»'
  rationale: Марк использует историческое настоящее для живости повествования; в данном контексте оно понятно и допустимо в современном русском.
- issue: Кто такие «те, кто был с Ним»
  choice: Не уточнять в основном тексте
  alternative: Назвать их учениками или тремя учениками
  rationale: Само выражение остаётся обобщённым, а ближайший контекст позволяет пояснить референт в сноске без внесения уточнения в текст стиха.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Заглавная буква в местоимениях, относящихся к Иисусу, соответствует распространённой русской библейской издательской традиции. Исторические настоящие сохранены ради повествовательной выразительности.
