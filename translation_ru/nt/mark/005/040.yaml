  naturalness: Фраза написана естественным современным литературным русским языком. Историческое настоящее в сочетании «Но Он… берёт… и входит» звучит допустимо и выразительно в библейском повествовании. «Выслав всех» ясно передаёт удаление остальных присутствующих без неуместных экзорцистских коннотаций.
  terminology: Употребление «ребёнок» последовательно и нейтрально. «Тех, кто был с Ним» не чрезмерно конкретизирует τοὺς μετ’ αὐτοῦ; сноска корректно поясняет контекстуальный референт. Заглавные буквы в местоимениях относятся к заявленной издательской традиции и не изменяют смысла.
