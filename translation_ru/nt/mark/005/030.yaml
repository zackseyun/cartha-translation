  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: ru
  text: 'И тотчас Иисус, осознав, что из Него вышла сила, обернулся в толпе и спросил: «Кто прикоснулся к Моей одежде?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для Марка стремительность повествования и сохраняет достойный современный регистр.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: почувствовав в Себе
  rationale: Естественно выражает внутреннее и ясное осознание Иисусом случившегося, не сводя его к внешнему наблюдению.
- source_word: δύναμιν
  choice: сила
  rationale: Прямой и достаточно широкий эквивалент; добавление «исцеляющая» излишне конкретизировало бы исходный текст.
- source_word: ἐξελθοῦσαν
  choice: вышла
  rationale: Передаёт действие, уже совершившееся к моменту осознания Иисусом.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: обернулся среди толпы
  rationale: Сохраняет физическое движение Иисуса и естественно обозначает Его положение в окружавшей Его толпе.
- source_word: ἔλεγεν
  choice: спросил
  rationale: Вводит прямой вопрос естественно по-русски; несовершенный вид греческого глагола здесь не требует передачи длительности или повторности.
- source_word: ἥψατο τῶν ἱματίων
  choice: прикоснулся к Моей одежде
  rationale: «Прикоснулся» точно передаёт значение глагола в данном контексте, а собирательное единственное «одежде» естественно передаёт греческое множественное число без неоправданного уточнения вида одежды.
theological_decisions:
- issue: Иисус осознаёт, что из Него вышла сила
  choice: Сохранено прямое повествовательное утверждение о вышедшей из Иисуса силе.
  alternative: Уточнить как «исцеляющая сила» либо представить это лишь как субъективное ощущение.
  rationale: Исходный текст утверждает реальность действия силы, но не объясняет механизм чуда и не добавляет определения «исцеляющая»; перевод сохраняет эту богословскую сдержанность и напряжение текста.
translation_notes:
  register: 'Современный литературный русский язык с ясным, достойным повествовательным звучанием. Прописные местоимения «Себе», «Него», «Моей» употреблены в соответствии с принятой русской библейской традицией. Ошибочная английская сноска не перенесена: её маркер стоит после имени «Jesus», тогда как содержание предлагает вариант для «garments» и не соответствует месту маркера; русский текст не нуждается в такой сноске.'
