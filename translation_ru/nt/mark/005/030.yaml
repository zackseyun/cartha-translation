revisions:
- from: 'И тотчас Иисус, почувствовав в Себе, что из Него вышла сила, обернулся среди толпы и спросил: «Кто прикоснулся к Моей одежде?»'
  to: 'И тотчас Иисус, осознав, что из Него вышла сила, обернулся в толпе и спросил: «Кто прикоснулся к Моей одежде?»'
  rationale: 'Заменены только менее точные «почувствовав» и «среди толпы». Опущенное в русском явное соответствие ἐν ἑαυτῷ не меняет смысла: «осознав» в данном контексте естественно выражает внутреннее распознание, не приписывая Иисусу внешнего источника знания или физического ощущения.'
