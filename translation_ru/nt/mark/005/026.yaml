  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: ru
  text: Она много страдала от многих врачей[a], истратила всё, что у неё было[b], и не получила никакой пользы — напротив, ей стало ещё хуже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «много пострадала от многих врачей» или «в руках многих врачей». Греческое выражение может указывать как на действия врачей, так и на то, что она подвергалась их лечению.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всё бывшее при ней», то есть всё, чем она располагала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: много натерпелась
  rationale: Передаёт значительное и продолжительное страдание, выраженное аористным причастием, естественным современным русским языком.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: от лечения у многих врачей
  rationale: Сохраняет связь страданий с врачами и их лечением, не утверждая однозначно ни злого умысла, ни прямой виновности врачей; неоднозначность конструкции отмечена в сноске.
- source_word: δαπανήσασα
  choice: истратила
  rationale: Точно выражает расходование средств и естественно сочетается с последующим указанием на всё её имущество.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: всё, что у неё было
  rationale: Естественно передаёт всё находившееся в её распоряжении или принадлежавшее ей.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: не получила никакой пользы
  rationale: 'Сохраняет пассивно-результативный смысл: лечение нисколько ей не помогло.'
- source_word: ἀλλὰ μᾶλλον
  choice: напротив
  rationale: 'Ясно выражает усиленное противопоставление: не просто отсутствие пользы, а противоположный результат.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: ей становилось всё хуже
  rationale: Идиоматично передаёт переход к худшему состоянию и развитие болезни.
