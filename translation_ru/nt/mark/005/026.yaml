  terminology: Термины «врачи», «истратить», «польза» нейтральны и точны. «Всё, что у неё было» адекватно передаёт τὰ παρ’ αὐτῆς πάντα. Сноска к [b] корректно поясняет буквальную образность выражения.
  issues:
