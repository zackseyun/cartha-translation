review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: женщина много страдала в связи со многими врачами, истратила всё имевшееся, не получила пользы и ухудшилась. Однако «от лечения у многих врачей» вводит слово «лечение», которого в греческом тексте нет, и несколько размывает прямую связь ὑπὸ πολλῶν ἰατρῶν с врачами. «Ей становилось всё хуже» передаёт общий смысл, но форма «ей стало ещё хуже» точнее передаёт результирующий характер аористного ἐλθοῦσα.'
