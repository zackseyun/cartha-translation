    text: 'Или: «поднялась».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте глагол и существительное однокоренные; это усиливает выражение крайнего изумления.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для повествования Марка стремительность и употреблено в обоих местах стиха.
- source_word: ἀνέστη
  choice: встала
  rationale: В данном контексте глагол описывает, как девочка физически поднялась после повеления Иисуса; вариант не устраняет контекст возвращения к жизни, но и не усиливает воскресную терминологию сверх необходимого.
- source_word: τὸ κοράσιον
  choice: девочка
  rationale: Естественное современное обозначение ребёнка женского пола; точный возраст назван далее в стихе.
- source_word: περιεπάτει
  choice: начала ходить
  rationale: Имперфект изображает продолжавшееся, наглядно наблюдаемое действие после того, как девочка встала; по-русски начало этого действия естественно выражается сочетанием «начала ходить».
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: ведь ей было двенадцать лет
  rationale: «Ведь» сохраняет пояснительную функцию γάρ, а конструкция с дательным лицом идиоматично сообщает возраст по-русски.
- source_word: ἐξέστησαν … ἐκστάσει μεγάλῃ
  choice: были охвачены великим изумлением
  rationale: Передаёт крайнюю степень потрясения естественным русским выражением, не прибегая к вводящему в заблуждение современному слову «экстаз».
theological_decisions:
- issue: Возможный оттенок воскресения в ἀνέστη
  choice: встала
  alternative: поднялась; воскресла
  rationale: Контекст ясно говорит о возвращении девочки к жизни, однако сам глагол здесь способен обозначать обычное вставание. Основной текст сохраняет эту лексическую сдержанность и не превращает возможный оттенок в явно сформулированное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор «тотчас» сохранён вслед за греческим текстом и характерным темпом Марка. Однокоренная греческая конструкция в конце передана идиоматично, а её форма пояснена в сноске.
