base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: ru
  text: И тотчас девочка встала[a] и начала ходить, ибо ей было двенадцать лет. Их тотчас охватило великое изумление[b].
  philosophy: optimal-equivalence
  footnotes:
