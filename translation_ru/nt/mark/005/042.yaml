  source_fidelity: 'Основной текст верно передаёт оба εὐθύς («тотчас»), физическое вставание девочки (ἀνέστη), продолженное действие имперфекта περιεπάτει («начала ходить»), пояснение γάρ и силу сочетания ἐξέστησαν … ἐκστάσει μεγάλῃ. Предлагаемая правка не меняет смысла, а делает заключительную фразу естественнее по-русски. Сноска b нуждается в уточнении: приведённая в ней формула не является строго буквальным переводом глагола ἐξέστησαν.'
  naturalness: «Их тотчас охватило великое изумление» звучит в современном литературном русском более естественно, чем «они тотчас были охвачены великим изумлением». «Ибо» уместно передаёт пояснительное γάρ в литературном библейском регистре.
  terminology: «Девочка», «встала», «начала ходить» и «великое изумление» точны и не привносят конфессионального истолкования. Сноска к «встала» ограничена реальной лексической альтернативой «поднялась» и не навязывает воскресную терминологию.
