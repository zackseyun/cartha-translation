source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: ru
  text: И он ушёл и начал возвещать в Десятиградии, сколько сделал для него Иисус[a], и все изумлялись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что сделал для него Иисус».'
    reason: 'Лексически допустимая передача ὅσα: местоимение может выражать как объём — «сколько», так и совокупность — «всё, что».'
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ушёл
  rationale: Аорист ἀπέρχομαι обозначает уход с места действия; «ушёл» естественно и точно передаёт движение без излишней торжественности.
- source_word: ἤρξατο κηρύσσειν
  choice: начал возвещать
  rationale: Конструкция ἄρχομαι с инфинитивом имеет начинательное значение. «Возвещать» передаёт публичное провозглашение и не создаёт впечатления формальной проповеди.
- source_word: ἐν τῇ Δεκαπόλει
  choice: в Десятиградии
  rationale: ἐν прямо означает «в»; традиционное русское географическое название «Десятиградие» понятно в библейском контексте и передаёт греческое Δεκάπολις.
- source_word: ὅσα
  choice: сколько
  rationale: ὅσα здесь может обозначать объём совершённого — «сколько сделал»; этот вариант сохраняет оттенок меры и не добавляет прямо не выраженной оценки.
- source_word: ἐποίησεν αὐτῷ
  choice: сделал для него
  rationale: Дательный αὐτῷ в контексте указывает на действие в пользу человека. Русское «сделал для него» естественно передаёт этот смысл.
- source_word: πάντες
  choice: все
  rationale: Прямое и естественное соответствие πάντες без добавления отсутствующего существительного.
- source_word: ἐθαύμαζον
  choice: изумлялись
  rationale: Имперфект передаёт продолжающуюся или повторяющуюся реакцию; несовершенный вид «изумлялись» сохраняет эту аспектуальную черту.
- source_word: ὁ Ἰησοῦς
  choice: Иисус
  rationale: Имя передано в общепринятой русской библейской форме.
theological_decisions:
- issue: Связь свидетельства исцелённого с личностью Иисуса
  choice: Прямо сообщается, что человек возвещал сделанное для него Иисусом, без поясняющего богословского расширения.
  alternative: Добавить формулировку, особо подчёркивающую божественную власть Иисуса.
  rationale: Стих показывает необычайную силу Иисуса через рассказ и реакцию людей, но не формулирует здесь отдельного вероучительного вывода; перевод сохраняет повествовательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Десятиградие» сохраняет устоявшееся историко-географическое название; «возвещать» передаёт публичность действия без узко церковного оттенка.
