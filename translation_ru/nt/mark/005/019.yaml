  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: ru
  text: 'Но Иисус не позволил ему, а сказал: «Иди домой, к своим[a], и расскажи им, как много сделал для тебя Господь[b] и как Он помиловал тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к твоим». Речь может идти не только о семье, но и о близких и людях его круга.'
    reason: lexical_alternative
  - marker: b
    text: Здесь возможно понимать «Господь» как указание на Бога; вместе с тем повествование сохраняет связь между Божьей милостью, властью и действием Иисуса.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: не позволил ему
  rationale: В данном контексте ἀφίημι означает «позволять, разрешать», а не «прощать» или «оставлять».
- source_word: λέγει αὐτῷ
  choice: сказал
  rationale: Греческое историческое настоящее естественно передано прошедшим временем, обычным для русского повествования.
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: Иди домой
  rationale: οἶκος здесь обозначает дом как место возвращения и домашний круг; «иди домой» звучит естественно и точно передаёт направление.
- source_word: πρὸς τοὺς σούς
  choice: к своим
  rationale: Субстантивированное τοὺς σούς буквально означает «к своим» и может охватывать семью, близких и других людей своего круга, не ограничиваясь только родственниками.
- source_word: ἀπάγγειλον αὐτοῖς
  choice: расскажи им
  rationale: ἀπαγγέλλω означает сообщить или передать известие; в личном обращении «расскажи» естественно передаёт поручение дать отчёт о случившемся.
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: сколько сделал для тебя Господь
  rationale: ὅσα выражает объём и величину совершённого; дательный σοι относится к действию и передан словами «для тебя».
- source_word: ἠλέησέν σε
  choice: как Он помиловал тебя
  rationale: ἐλεάω обозначает проявление милости. Союз «как» естественно продолжает косвенный вопрос после «расскажи» и сохраняет отдельный акцент на милости.
theological_decisions:
- issue: Значение κύριος в словах Иисуса о совершённом исцелении
  choice: Господь
  alternative: Бог
  rationale: Передача «Господь» сохраняет обычное значение κύριος и не снимает намеренно возникающую связь между милостью Господа и действием самого Иисуса. Замена на «Бог» преждевременно разрешила бы эту богословскую напряжённость.
- issue: Явное обозначение субъекта первой части стиха
  choice: Иисус
  alternative: Он
  rationale: В греческом субъект восстанавливается из контекста. Имя «Иисус» делает отдельный стих понятным по-русски, не меняя его референта.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. «К своим» сохраняет краткость и широту греческого выражения; возможная неясность пояснена в сноске. Местоимение «Он» написано с прописной буквы как отсылка к Господу в пределах прямой речи.
