  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: ru
  text: 'И Он спрашивал его: «Как тебя зовут?» И говорит Ему: «Имя мне — Легион[a], ибо нас много».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Легион» — латинский военный термин, вошедший в греческий язык и обозначавший крупное подразделение римской армии. Здесь это названное имя; оно подразумевает множество говорящих духов.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: спрашивал
  rationale: Имперфект передан глаголом несовершенного вида, что сохраняет оттенок продолжающегося или повторяющегося действия.
- source_word: Τί ὄνομά σοι
  choice: Как тебя зовут?
  rationale: Естественное современное русское соответствие греческому обороту с ὄνομα и дательным местоимением; сохраняет прямоту вопроса.
- source_word: λέγει αὐτῷ
  choice: Тот отвечает Ему
  rationale: Историческое настоящее сохранено настоящим временем; «отвечает» естественно выражает реплику в ответ на вопрос, хотя буквально глагол означает «говорит».
- source_word: Λεγιὼν
  choice: Легион
  rationale: Слово выступает как названное имя или обозначение, поэтому передано транслитерацией и с прописной буквы.
- source_word: ὄνομά μοι
  choice: Имя мне —
  rationale: Достаточно близко воспроизводит греческую именную конструкцию и при этом звучит естественно и торжественно по-русски.
- source_word: ὅτι πολλοί ἐσμεν
  choice: потому что нас много
  rationale: ὅτι указывает причину данного имени; первое лицо множественного числа сохранено без сглаживания.
theological_decisions:
- issue: Переход от единственного числа к множественному в самоназвании говорящего
  choice: Сохранить единственное число в выражении «Имя мне — Легион» и множественное в словах «нас много».
  alternative: 'Сгладить переход: «Наше имя — Легион».'
  rationale: Греческий текст намеренно сочетает самоназвание в единственном числе с объяснением во множественном. Перевод сохраняет эту напряжённость и не истолковывает её за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прописные местоимения «Он», «Ему» помогают ясно обозначить Иисуса, не добавляя конфессионального толкования; «Тот» устраняет возможную неясность относительно говорящего.
