  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: ru
  text: И тотчас источник её кровотечения иссяк[a], и она поняла по своему телу, что исцелена от мучительного недуга[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «источник её крови высох». В греческом тексте использован яркий образ источника или родника.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от бича». Это слово может обозначать тяжёлое, мучительное страдание или болезнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт характерную для повествования Марка непосредственность события и звучит естественно в современном литературном русском.
- source_word: ἐξηράνθη
  choice: иссяк
  rationale: Сохраняет образ высохшего источника и в данном контексте естественно обозначает прекращение кровотечения.
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: источник её кровотечения
  rationale: Сохраняет яркую метафору πηγή — «источник, родник», одновременно ясно указывая на продолжавшееся кровотечение.
- source_word: ἔγνω τῷ σώματι
  choice: она ощутила телом
  rationale: Передаёт телесное распознавание совершившегося исцеления; русское «ощутила» в этом контексте естественно объединяет физическое чувство и осознание.
- source_word: ἴαται
  choice: исцелена
  rationale: Краткая результативная форма передаёт совершившееся исцеление и его сохраняющийся результат, выраженные греческим перфектом.
- source_word: ἀπὸ τῆς μάστιγος
  choice: от мучительного недуга
  rationale: μάστιξ буквально означает «бич», но здесь метафорически обозначает тяжёлое болезненное страдание; «мучительный недуг» ясно передаёт контекстуальный смысл.
theological_decisions:
- issue: Характер исцеления
  choice: Передать как действительное и немедленное телесное исцеление, которое женщина осознала физически.
  alternative: Передать лишь субъективное ощущение улучшения.
  rationale: Греческий текст сочетает объективное прекращение кровотечения с телесным осознанием женщиной уже совершившегося исцеления, не объясняя его механизм.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Образ источника сохранён, а буквальный «бич» раскрыт в основном тексте как мучительный недуг и отмечен в сноске.
