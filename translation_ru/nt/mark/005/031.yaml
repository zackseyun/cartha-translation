  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: ru
  text: 'Его ученики говорили ему: «Ты видишь, как толпа теснит тебя[a], и говоришь: „Кто прикоснулся ко мне?“»'
  philosophy: optimal-equivalence
  footnotes:
