    text: 'Или: «напирает на тебя». Греческое причастие передаёт, что окружившая Иисуса толпа физически сжимала и теснила его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект передаёт продолжающуюся или повторявшуюся речь; русское несовершенное прошедшее «говорили» естественно сохраняет эту аспектуальность.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: его ученики
  rationale: «Ученики» — общепринятый и точный эквивалент, сохраняющий отношения обучения и следования за Иисусом.
- source_word: Βλέπεις
  choice: Ты видишь
  rationale: Настоящее изъявительное указывает на очевидную для собеседника ситуацию и естественно передаётся прямым утверждением.
- source_word: τὸν ὄχλον
  choice: толпа
  rationale: Современное нейтральное слово точно обозначает множество людей в данной сцене.
- source_word: συνθλίβοντά σε
  choice: как толпа теснит тебя
  rationale: Причастие описывает физическое давление окружившей Иисуса толпы. «Теснит» передаёт сжатие и напор, не усиливая смысл до буквального «давит» или «раздавливает».
- source_word: καὶ λέγεις
  choice: и всё же говоришь
  rationale: В контексте καί связывает очевидное обстоятельство с вызвавшим недоумение вопросом. «И всё же» естественно выражает заложенное в реплике противопоставление, не меняя её содержания.
- source_word: Τίς μου ἥψατο
  choice: Кто прикоснулся ко мне?
  rationale: ἅπτομαι с родительным обозначает прикосновение; аорист указывает на конкретное только что совершившееся действие. Русское управление требует «прикоснулся ко мне».
