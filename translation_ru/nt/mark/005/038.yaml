  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: ru
  text: Они приходят в дом начальника синагоги, и Он видит там суматоху[a], а также людей, которые плачут и громко причитают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шум», «переполох».'
    reason: лексическая альтернатива для греч. θόρυβος, обозначающего шумную суматоху или беспорядок.
lexical_decisions:
- source_word: ἔρχονται
  choice: приходят
  rationale: Историческое настоящее сохранено ради живости повествования; глагол передаёт прибытие к дому без лишнего истолкования.
- source_word: οἶκον
  choice: дом
  rationale: Прямое и естественное соответствие; вариант «жилище» был бы излишне книжным.
- source_word: ἀρχισυναγώγου
  choice: начальника синагоги
  rationale: Передаёт должность руководителя синагоги ясным и укоренившимся в русском библейском употреблении выражением.
- source_word: θεωρεῖ
  choice: видит
  rationale: Простое соответствие глаголу зрительного восприятия; имя «Иисус» проясняет подразумеваемое подлежащее из контекста.
- source_word: θόρυβον
  choice: смятение
  rationale: В данном контексте слово обозначает не просто шум, а шумную суматоху, вызванную плачем и причитаниями.
- source_word: κλαίοντας
  choice: люди плачут
  rationale: Субстантивированное причастие естественно развёрнуто в русском языке в личную конструкцию.
- source_word: ἀλαλάζοντας
  choice: причитают
  rationale: Передаёт громкие вопли и плач в обстановке траура естественным современным русским словом.
- source_word: πολλά
  choice: громко
  rationale: Наречное усиление при ἀλαλάζοντας передано по смыслу как указание на силу и громкость причитаний.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. Историческое настоящее сохранено. Повтор греческих союзов передан двумя предложениями и пояснительным двоеточием, чтобы избежать тяжеловесного многократного «и» при сохранении последовательности картины.
