  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: ru
  text: 'И он настойчиво умолял Его: «Моя маленькая дочь при смерти. Приди и возложи на неё руки, чтобы она исцелилась[a] и жила».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была спасена»; «выздоровела». Греческий глагол может означать «спасти», «избавить» или «исцелить»; здесь непосредственный контекст говорит о физическом исцелении.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ αὐτὸν πολλὰ
  choice: настойчиво умолял Его
  rationale: Сочетание παρακαλεῖ с πολλὰ передаёт усиленную, отчаянную просьбу; «настойчиво умолял» естественно выражает и интенсивность, и повторность обращения.
- source_word: θυγάτριόν μου
  choice: моя маленькая дочь
  rationale: Уменьшительная форма θυγάτριον может указывать на юный возраст и передавать отцовскую нежность; «маленькая дочь» сохраняет обе возможности.
- source_word: ἐσχάτως ἔχει
  choice: при смерти
  rationale: Греческий оборот означает крайне тяжёлое, предсмертное состояние; краткое русское выражение точно и естественно передаёт его смысл.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: приди и возложи на неё руки
  rationale: Обстоятельственное причастие ἐλθών в составе просьбы естественно передаётся повелительной формой; «возложи на неё руки» сохраняет число и характер жеста.
- source_word: σωθῇ
  choice: спаслась
  rationale: σῴζω охватывает значения спасения, избавления и исцеления. «Спаслась» сохраняет широкую лексику оригинала, тогда как непосредственный контекст указывает на физическое исцеление; это пояснено в сноске.
- source_word: ζήσῃ
  choice: жила
  rationale: Прямое значение глагола — «жить»; здесь он выражает желаемый итог спасения или исцеления девочки.
theological_decisions:
- issue: Значение σωθῇ в рассказе об исцелении
  choice: спаслась
  alternative: исцелилась; выздоровела
  rationale: Контекст явно связан с телесным исцелением, однако широкий смысл σῴζω позволяет услышать также избавление и спасение. Основной текст сохраняет эту смысловую широту, а сноска сообщает контекстуальные варианты.
translation_notes:
  register: Современный литературный русский язык с естественным, но достойным звучанием. Заглавная буква в местоимении «Его» следует принятой русской библейской стилистике; прямая речь передана ясно и без архаизмов.
