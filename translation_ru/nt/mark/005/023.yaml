  source_fidelity: Передача παρακαλεῖ ... πολλὰ, предсмертного состояния дочери и жеста возложения рук в целом точна. Однако в данном непосредственном контексте σωθῇ обозначает ожидаемое телесное исцеление/спасение от смерти; русское «спаслась» без уточнения звучит прежде всего как духовное спасение и в сочетании «спаслась и жила» неестественно. «Исцелилась» точно передаёт контекстуальный смысл, а более широкое значение σῴζω сохранено в сноске.
