lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз и характерный для Марка паратаксис.
- source_word: γυνὴ
  choice: женщина
  rationale: Вводит новую участницу повествования; отсутствие артикля в русском естественно и не требует добавления «одна».
- source_word: οὖσα
  choice: которая… страдала
  rationale: Причастие буквально означает «будучи», но вместе с обозначением состояния и длительности естественно передаётся личной конструкцией, выражающей продолжительное страдание.
- source_word: ἐν ῥύσει αἵματος
  choice: кровотечением
  rationale: Предлог с дательным описывает состояние. «Кровотечение» — точный, понятный и естественный русский эквивалент выражения «истечение крови».
- source_word: δώδεκα ἔτη
  choice: двенадцать лет
  rationale: Винительный длительности времени в русском языке естественно передаётся без предлога.
