  source_fidelity: Черновик верно сохраняет единственное число говорящего («он») и множественное число духов («их»), а также передаёт местное значение χώρα. Однако «настойчиво просил» передаёт интенсивность, но недостаточно ясно выражает итеративный оттенок πολλὰ при имперфекте παρεκάλει; «из той области» также несколько ослабляет явное ἔξω («за пределы, вон из»).
  naturalness: Фраза «он снова и снова умолял Его не отсылать их за пределы этой местности» естественна для современного литературного русского и сохраняет сдержанный библейский регистр. «Местность» здесь не предполагает современного государства и подходит для местного района.
  terminology: «Умолял» адекватно передаёт срочную мольбу в контексте. «Отсылать» точно выражает ἀποστέλλῃ без внесения оттенка насильственного изгнания. Заглавное «Его» сохранено как принятое в данном русском библейском регистре.
