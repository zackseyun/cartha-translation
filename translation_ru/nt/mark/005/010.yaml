  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: ru
  text: И он снова и снова умолял Его не отсылать их за пределы этой местности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И он настойчиво просил Его не высылать их из этой области».'
    reason: 'Лексическая альтернатива: πολλὰ может подчёркивать силу или многократность мольбы, а χώρα обозначает местную область, территорию.'
lexical_decisions:
- source_word: παρεκάλει
  choice: настойчиво просил
  rationale: В контексте изгнания бесов глагол обозначает настоятельную мольбу; сочетание естественно звучит по-русски и передаёт силу просьбы.
- source_word: πολλὰ
  choice: настойчиво
  rationale: Наречное употребление усиливает просьбу; форма допускает оттенок многократности, отражённый в сноске.
- source_word: ἵνα μὴ
  choice: не
  rationale: При глаголе просьбы русский инфинитив с отрицанием естественно передаёт содержание просьбы.
- source_word: αὐτὰ
  choice: их
  rationale: Местоимение среднего рода множественного числа относится к нечистым духам; русское личное местоимение множественного числа сохраняет эту множественность.
- source_word: ἀποστείλῃ
  choice: высылать
  rationale: Передаёт значение удаления по чьему-либо повелению без добавления идеи насильственного изгнания, которой сам глагол не требует.
- source_word: ἔξω τῆς χώρας
  choice: из той области
  rationale: χώρα здесь означает местную область или территорию, а не современное государство; указательное «той» естественно указывает на область, где происходят события.
theological_decisions:
- issue: Смена числа между единственным субъектом просьбы и множественным объектом высылки
  choice: «он… просил Его не высылать их»
  alternative: Сгладить конструкцию, представив говорящих и просителей только как коллектив
  rationale: 'Сохранена напряжённость греческого текста: один говорящий выступает от имени множества бесов. Единственное и множественное число не гармонизированы.'
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Заглавное «Его» употреблено по принятой русской библейской традиции для обозначения Иисуса; неоднозначность числа в описании бесов сохранена.
