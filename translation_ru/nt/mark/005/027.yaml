translation:
  language: ru
  text: Услышав об Иисусе, она подошла к Нему сзади в толпе и прикоснулась к Его одежде.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Его верхней одежде» или «к Его плащу». Греческое слово ἱμάτιον имеет широкое значение и часто обозначает верхнюю одежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα περὶ τοῦ Ἰησοῦ
  choice: Услышав об Иисусе
  rationale: Аористное причастие обозначает действие, предшествующее основному; русский деепричастный оборот естественно сохраняет последовательность. περί с родительным передано обычным «об».
- source_word: ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν
  choice: она подошла к Нему сзади в толпе
  rationale: ἐλθοῦσα передаёт приближение к Иисусу, а ὄπισθεν — положение сзади; местоименное дополнение ясно из контекста. «В толпе» сохраняет обстоятельство места, выраженное ἐν с дательным.
- source_word: ἥψατο
  choice: прикоснулась
  rationale: В данном рассказе средний аорист ἅπτω естественно означает однократное прикосновение; перевод не усиливает его до хватания или удерживания.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: к Его одежде
  rationale: ἱμάτιον может обозначать одежду вообще и особенно верхнюю одежду. «Одежда» сохраняет широту значения и единственное число, не уточняя покрой.
