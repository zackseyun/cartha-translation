  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: ru
  text: Они пришли к Иисусу и увидели, что человек, прежде одержимый бесами, сидит одетый и в здравом уме — тот самый, у которого был легион[a]. И они испугались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Легион». Слово может пониматься как имя, которым ранее назвало себя множество бесов.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: пришли
  rationale: Историческое настоящее естественно передано русским прошедшим временем, что соответствует обычному повествовательному стилю.
- source_word: θεωροῦσιν
  choice: увидели
  rationale: Ещё одно историческое настоящее; «увидели» естественно передаёт зрительное восприятие сцены без излишне книжного оттенка.
- source_word: δαιμονιζόμενον
  choice: человек, прежде одержимый бесами
  rationale: Субстантивированное причастие обозначает известного из контекста человека и утверждает реальность бесовской одержимости. «Прежде» ясно показывает, что к моменту встречи его состояние уже изменилось.
- source_word: καθήμενον
  choice: сидит
  rationale: Причастие описывает наблюдаемое состояние человека; в русском придаточном после «увидели, что» настоящее время естественно передаёт одновременность восприятия.
- source_word: ἱματισμένον
  choice: одетый
  rationale: Кратко и естественно выражает восстановленное состояние человека в противопоставлении его прежнему виду.
- source_word: σωφρονοῦντα
  choice: в здравом уме
  rationale: Устойчивое современное выражение передаёт восстановленную рассудительность и самообладание, не сводя описание к клиническому диагнозу.
- source_word: ἐσχηκότα
  choice: в котором был
  rationale: Перфектное причастие ретроспективно отождествляет человека по его прежнему состоянию. Русское прошедшее время в сочетании с «прежде» и общей сценой достаточно ясно показывает, что одержимость прекратилась.
- source_word: λεγιῶνα
  choice: легион
  rationale: Слово отсылает к предшествующему самоназванию множества бесов. Строчная буква сохраняет возможность понимать его как обозначение множества, не исключая прочтения в качестве имени, указанного в сноске.
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Естественно и точно передаёт наступившую реакцию страха, выраженную аористом.
theological_decisions:
- issue: Описание бесовской одержимости
  choice: человек, прежде одержимый бесами
  alternative: одержимый; человек, одержимый бесом
  rationale: Форма множественного числа согласуется с контекстом о множестве бесов и не смягчает сверхъестественное утверждение текста. «Прежде» не является отрицанием прежней реальности одержимости, а отражает явное изменение состояния.
- issue: λεγιών как обозначение или имя
  choice: легион
  alternative: Легион
  rationale: Артикль и контекст допускают понимание как обозначения множества бесов и как их самоназвания. Основной текст не навязывает статус имени собственного, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис делает сцену наглядной, избегая архаизмов и тяжеловесного буквального воспроизведения греческих причастий.
