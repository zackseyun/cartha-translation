    issue: «в котором был легион»
    rationale: Греческое τὸν ἐσχηκότα τὸν λεγιῶνα буквально характеризует человека как того, «у кого был легион» / «кто имел легион». Локативное «в котором был» является возможным контекстуальным пояснением, но не столь точно передаёт исходную конструкцию.
