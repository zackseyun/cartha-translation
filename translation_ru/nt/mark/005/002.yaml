lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: Когда Он вышел
  rationale: Родительный самостоятельный оборот с аористным причастием естественно передан временным придаточным; совершенный вид обозначает выход Иисуса из лодки как предшествующее действие.
- source_word: πλοίου
  choice: из лодки
  rationale: В повествовательном контексте Галилейского моря современное «лодка» точнее и естественнее, чем «корабль».
- source_word: εὐθὺς
  choice: тотчас
  rationale: Сохраняет характерную для Марка стремительность повествования и соответствует литературному библейскому регистру без архаичности.
- source_word: ὑπήντησεν αὐτῷ
  choice: навстречу Ему вышел
  rationale: Передаёт движение человека к Иисусу и естественно сочетается с исходной точкой движения, выраженной словами ἐκ τῶν μνημείων.
- source_word: ἐκ τῶν μνημείων
  choice: из гробниц
  rationale: Множественное число и значение погребальных помещений сохранены; «гробницы» точнее контекстуального «могилы».
- source_word: ἄνθρωπος
  choice: человек
  rationale: Нейтральное и точное соответствие существительному; пол персонажа становится явным из дальнейшего контекста, но здесь русское «человек» звучит естественнее, чем маркированное «мужчина».
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: с нечистым духом
  rationale: Сохраняет близость к греческой конструкции и не вводит более истолковывающее понятие одержимости непосредственно в основной текст.
theological_decisions:
- issue: Описание воздействия нечистого духа
  choice: с нечистым духом
  alternative: одержимый нечистым духом
  rationale: Греческое ἐν πνεύματι ἀκαθάρτῳ буквально выражает состояние как пребывание «в/с нечистым духом». Основной перевод сохраняет формулировку источника, а возможное истолкование как одержимости вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Порядок слов сохраняет марковскую стремительность и ясно показывает движение человека из гробниц навстречу Иисусу. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятому русскому библейскому стилю.
