  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: ru
  text: 'И, громко закричав, он говорит: «Что тебе до меня, Иисус, Сын Бога Всевышнего?[a] Заклинаю тебя Богом: не мучь меня!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что мне и тебе?» Это устойчивый библейский оборот, который может выражать отчуждение, конфликт или требование не вмешиваться.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Умоляю тебя перед Богом: не мучь меня». Глагол «заклинаю» передаёт торжественное требование или обращение, связанное с клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: громко закричав
  rationale: Передаёт предшествующее главному глаголу действие аористного причастия и силу выражения φωνῇ μεγάλῃ естественным современным русским языком.
- source_word: λέγει
  choice: он говорит
  rationale: Сохраняет историческое настоящее Марка и присущую повествованию живость.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Что тебе до меня
  rationale: Краткий и естественный русский эквивалент семитского оборота, выражающего отчуждение, протест или требование не вмешиваться; неоднозначность пояснена в сноске.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Сын Бога Всевышнего
  rationale: Ясно сохраняет обращение к Иисусу как к Сыну и относит определение «Всевышний» к Богу, не добавляя более поздних богословских формулировок.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Заклинаю тебя Богом
  rationale: Русский глагол «заклинаю» сохраняет торжественный, связанный с клятвой характер ὁρκίζω и необычное обращение духа к Богу как к основанию требования.
- source_word: μή με βασανίσῃς
  choice: не мучь меня
  rationale: Естественно и достаточно сильно передаёт βασανίζω, не конкретизируя способ причиняемого страдания.
theological_decisions:
- issue: Признание духом личности Иисуса
  choice: Сын Бога Всевышнего
  alternative: Сын Всевышнего Бога
  rationale: Выбранная формулировка сохраняет оба элемента греческого обращения — сыновство Иисуса и наименование Бога Всевышним — без ослабления или догматического расширения.
- issue: Сила обращения ὁρκίζω в речи нечистого духа
  choice: Заклинаю тебя Богом
  alternative: Умоляю тебя перед Богом
  rationale: 'Основной текст сохраняет напряжённость исходника: нечистый дух пытается торжественно обязать Иисуса, призывая Бога. Более мягкое «умоляю» могло бы свести это к обычной просьбе.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Историческое настоящее сохранено. Местоимения, относящиеся к Иисусу, набраны со строчной буквы согласно нейтральной современной издательской норме; имена и титулы — с прописной.
