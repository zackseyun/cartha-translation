lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный повествовательный союз, сохраняющий связь с предыдущим действием без добавления причинного или следственного оттенка.
- source_word: περιεβλέπετο
  choice: продолжал оглядываться
  rationale: Имперфект передаёт продолжающееся действие; глагол означает осматриваться по сторонам, оглядывать окружающих.
- source_word: ἰδεῖν
  choice: чтобы увидеть
  rationale: Инфинитив естественно выражает цель действия и сохраняет прямое значение греческого глагола.
- source_word: τὴν ... ποιήσασαν
  choice: ту, которая ... сделала
  rationale: Субстантивированное причастие женского рода прямо указывает на женщину, но не содержит существительного «женщина»; русская конструкция «ту, которая» сохраняет обе особенности.
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение отсылает к непосредственно предшествующему поступку; «это» звучит естественно и не уточняет сверх текста.
