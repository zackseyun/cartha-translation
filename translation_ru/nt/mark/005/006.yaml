lexical_decisions:
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие естественно передаёт аористное причастие и сохраняет последовательность действий без излишнего уточнения временного отношения.
- source_word: ἀπὸ μακρόθεν
  choice: издалека
  rationale: Краткое и естественное обозначение пространственной удалённости в современном русском языке.
- source_word: ἔδραμεν
  choice: подбежал
  rationale: В данном контексте обозначает, что человек бегом приблизился к Иисусу; «подбежал» естественно выражает направленность движения, заданную повествованием.
- source_word: προσεκύνησεν αὐτόν
  choice: поклонился Ему
  rationale: «Поклонился» сохраняет видимое действие и допускает заложенный в προσκυνέω диапазон значений — от почтительного земного поклона до поклонения, — не разрешая неоднозначность преждевременно.
- source_word: καὶ
  choice: не передано отдельным союзом
  rationale: Начальное καὶ служит повествовательной связкой; в изолированном русском стихе его опущение обеспечивает естественное течение речи без потери смысловой связи.
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Прямое дополнение передано обычной русской формой винительного падежа имени.
theological_decisions:
- issue: Следует ли передавать προσεκύνησεν как однозначное религиозное поклонение Иисусу
  choice: 'В основном тексте: «поклонился Ему»'
  alternative: «стал поклоняться Ему»; «пал перед Ним ниц»; «выразил Ему почтение»
  rationale: Глагол προσκυνέω может обозначать как религиозное поклонение, так и почтительное падение ниц. Контекст подчёркивает признание власти Иисуса, но не требует, чтобы перевод однозначно определял характер поступка. «Поклонился» сохраняет богословское напряжение и физическую сторону действия.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет стремительность Маркова рассказа. Местоимение «Ему» написано с прописной буквы в соответствии с распространённой русской библейской традицией, без добавления смыслового содержания.
