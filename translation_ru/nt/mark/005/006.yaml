  text: Увидев Иисуса издалека, он подбежал и поклонился ему[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пал перед ним ниц»; также возможно: «поклонился ему как объекту поклонения». Греческий глагол может обозначать как поклонение, так и почтительный земной поклон — в зависимости от контекста.'
