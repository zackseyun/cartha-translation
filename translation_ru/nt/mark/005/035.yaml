  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: ru
  text: 'Пока Он ещё говорил, пришли люди из дома начальника синагоги и сказали: «Твоя дочь умерла. Зачем тебе ещё беспокоить Учителя?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Пока Он ещё говорил
  rationale: Родительный самостоятельный оборот выражает действие, происходящее одновременно с последующим событием; «ещё» передаёт ἔτι.
- source_word: ἔρχονται
  choice: пришли
  rationale: Историческое настоящее естественно передано русским прошедшим временем в повествовании.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: из дома начальника синагоги
  rationale: 'По контексту речь идёт о людях, пришедших от домашних начальника синагоги: сам начальник в это время находится рядом с Иисусом. Добавление «дома» ясно передаёт подразумеваемый источник прибытия.'
- source_word: λέγοντες ὅτι
  choice: и сказали
  rationale: Причастие вводит прямую речь; личная глагольная форма звучит естественно по-русски.
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: Твоя дочь умерла
  rationale: Аорист сообщает о свершившейся смерти; русское прошедшее совершенного вида точно и естественно передаёт смысл.
- source_word: τί ἔτι σκύλλεις
  choice: Зачем ещё беспокоить
  rationale: Вопрос подразумевает, что дальнейшее обращение к Учителю теперь считают напрасным; инфинитивная конструкция естественна в русской прямой речи.
- source_word: τὸν διδάσκαλον
  choice: Учителя
  rationale: Сохранён титул, употреблённый говорящими, без замены именем или усиления оттенка власти.
theological_decisions:
- issue: Обозначение Иисуса как «Учителя»
  choice: Учителя
  alternative: Иисуса; Наставника
  rationale: Греческий текст использует титул διδάσκαλος, а не имя. Его сохранение передаёт точку зрения говорящих и не добавляет отсутствующего в тексте христологического уточнения.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно-торжественная. Заглавные «Он» и «Учителя» обозначают Иисуса в соответствии с принятым библейским регистром, не изменяя содержания исходного текста.
