  text: 'Ведь она говорила: «Если я прикоснусь хотя бы к Его одежде, то исцелюсь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «буду спасена». Греческий глагол может означать «быть спасённым», «исцелиться» или «выздороветь»; здесь контекст указывает на физическое исцеление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: она говорила
  rationale: Имперфект передаёт продолженное или повторявшееся высказывание; форма «говорила» сохраняет эту аспектуальность, не уточняя, произносила ли женщина слова вслух.
- source_word: γὰρ
  choice: ведь
  rationale: Союз поясняет предшествующий поступок женщины; «ведь» естественно связывает русское повествование с данным объяснением.
- source_word: ὅτι
  choice: прямая речь
  rationale: ὅτι вводит содержание её слов; в русском языке здесь естественна прямая речь.
- source_word: ἐὰν ἅψωμαι
  choice: если я прикоснусь
  rationale: Условная конструкция с конъюнктивом выражает ожидаемое будущее действие; совершенный вид «прикоснусь» естественно передаёт единичное касание.
- source_word: κἂν
  choice: хотя бы
  rationale: 'В данном контексте сочетание имеет ограничительно-усилительный смысл: достаточно прикоснуться хотя бы к одежде.'
- source_word: τῶν ἱματίων αὐτοῦ
  choice: к Его одежде
  rationale: Множественное ἱμάτια собирательно обозначает одежду. Русское единственное число «одежде» звучит естественно и не сужает значение до конкретного предмета одежды.
- source_word: σωθήσομαι
  choice: исцелюсь
  rationale: В непосредственном контексте кровотечения глагол означает физическое выздоровление. Более широкое значение «буду спасена» сохранено в сноске.
theological_decisions:
- issue: Значение σωθήσομαι в рассказе об исцелении
  choice: исцелюсь
  alternative: буду спасена; стану здорова
  rationale: Контекст прямо указывает на телесное исцеление, однако греческий глагол σῴζω охватывает также значение спасения. Основной текст передаёт ближайший смысл, а сноска сохраняет более широкую смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. «Его» написано с прописной буквы по принятой русской библейской традиции; местоимение присутствует в греческом тексте без особого эмфатического выделения.
