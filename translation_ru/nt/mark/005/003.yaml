  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: ru
  text: Он жил среди гробниц[a], и никто уже не мог связать его даже цепью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имел жилище в гробницах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: жил
  rationale: Греческое выражение буквально означает «имел жилище», но в современном русском естественно передаётся глаголом «жил» без утраты смысла.
- source_word: ἐν τοῖς μνήμασιν
  choice: среди гробниц
  rationale: μνῆμα обозначает гробницу или место погребения. «Среди гробниц» естественно описывает место обитания и не утверждает, что он постоянно находился внутри одной гробницы.
- source_word: οὐκέτι
  choice: уже не
  rationale: Передаёт прекращение прежней возможности связывать его и естественно звучит в русском повествовании.
- source_word: οὐδὲ ἁλύσει
  choice: даже цепью
  rationale: Сохраняет усиление οὐδέ и единственное число существительного ἅλυσις.
- source_word: ἐδύνατο αὐτὸν δῆσαι
  choice: не мог связать его
  rationale: Точно передаёт физическое связывание и продолжительную невозможность, выраженную имперфектом ἐδύνατο.
theological_decisions: []
