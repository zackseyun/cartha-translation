  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: ru
  text: 'Но он сказал ей: «Дочь, твоя вера спасла тебя[a]. Иди с миром и будь здорова — свободна от своего недуга[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исцелила тебя»; «сделала тебя здоровой». Греческий глагол может обозначать спасение, избавление или исцеление.'
    reason: Сохранение смыслового диапазона σῴζω и связи между спасением и физическим исцелением.
  - marker: b
    text: 'Или: «оставайся здоровой».'
    reason: Греческое выражение описывает состояние здоровья и допускает акцент на его продолжении.
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Дочь
  rationale: Сохранено прямое, тёплое обращение без добавления отсутствующего в греческом притяжательного местоимения «моя».
- source_word: πίστις
  choice: вера
  rationale: В контексте это доверие женщины Иисусу; «вера» сохраняет ключевой новозаветный термин и его смысловую связь с другими местами.
- source_word: σέσωκέν σε
  choice: спасла тебя
  rationale: Перфект σῴζω передан как достигнутое действие с сохраняющимся результатом. «Спасла» удерживает более широкий смысл глагола и не сводит его только к телесному исцелению.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: иди с миром
  rationale: Естественная русская формула, передающая повеление уйти в состоянии мира и благополучия.
- source_word: ἴσθι ὑγιὴς
  choice: будь здорова
  rationale: 'Стативное повеление передано прямо: речь идёт о дальнейшем состоянии здоровья, а не только о моменте исцеления.'
- source_word: ἀπὸ τῆς μάστιγός σου
  choice: свободна от своего мучительного недуга
  rationale: Предлог ἀπό передаёт освобождение от страдания; μάστιξ метафорически обозначает тяжёлый, мучивший женщину недуг.
theological_decisions:
- issue: Связь спасения и исцеления в σῴζω
  choice: спасла тебя
  alternative: исцелила тебя; сделала тебя здоровой
  rationale: Основной текст сохраняет широкий сотериологический диапазон σῴζω и отличие от следующего выражения ἴσθι ὑγιής, явно говорящего о здоровье. Возможный медицинский смысл указан в сноске, а не исключён.
- issue: Характер πίστις
  choice: вера
  alternative: доверие
  rationale: «Вера» естественно описывает доверительное обращение женщины к Иисусу и сохраняет богословскую многозначность термина, не превращая его в обозначение длительной верности.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «он» не капитализировано, чтобы не вносить конфессионально-редакционную традицию, отсутствующую в греческом тексте. Конструкция «будь здорова, свободна от…» сохраняет два элемента исходного выражения: состояние здоровья и освобождение от мучительного недуга.'
