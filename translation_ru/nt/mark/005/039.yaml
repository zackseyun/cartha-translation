  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: ru
  text: 'И, войдя, Он говорит им: «Почему вы шумите и плачете? Ребёнок не умер, а спит»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ребёнок не умер, но спит». Слова Иисуса о сне могут метафорически обозначать смерть в свете предстоящего воскрешения.'
    reason: Лексико-интерпретационная альтернатива; сохраняет образ сна и не разрешает его значение однозначно.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Войдя
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия, не утяжеляя русскую фразу.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для Марка живое историческое настоящее.
- source_word: Τί
  choice: Что
  rationale: Русское «Что вы шумите?» естественно выражает вопрос-упрёк и близко следует греческой конструкции.
- source_word: θορυβεῖσθε
  choice: шумите
  rationale: Глагол обозначает шумное волнение или переполох; краткое «шумите» естественно в данном вопросе и сохраняет звуковой аспект сцены.
- source_word: κλαίετε
  choice: плачете
  rationale: Обычное и достойное соответствие, не уточняющее сверх текста, был ли это обрядовый плач.
- source_word: παιδίον
  choice: Ребёнок
  rationale: Сохраняет общее значение существительного среднего рода; хотя из контекста известно, что это девочка, сам стих употребляет слово «ребёнок».
- source_word: οὐκ ἀπέθανεν
  choice: не умер
  rationale: Совершенный вид прямо передаёт аорист события смерти и звучит естественно по-русски; перевод «не мёртв» неоправданно заменил бы глагольное выражение состоянием.
- source_word: καθεύδει
  choice: спит
  rationale: Настоящее время прямо и естественно сохраняет образ сна, не раскрывая его смысл в основном тексте.
theological_decisions:
- issue: Следует ли понимать слова Иисуса как буквальное отрицание смерти или как метафорическое обозначение смерти с учётом предстоящего воскрешения
  choice: 'Сохранить без поясняющей вставки резкое противопоставление: «не умер, а спит».'
  alternative: «Не останется мёртвым, а словно спит» или «умерла, но будет пробуждена».
  rationale: Греческий текст не разъясняет смысл высказывания. Перевод сохраняет его подлинную богословскую напряжённость и не выбирает между буквальным, метафорическим и предвосхищающим прочтением.
translation_notes:
  register: Современный литературный русский язык; речь краткая, живая и достойная. Историческое настоящее Марка сохранено. Местоимение «Он» написано с прописной буквы как принятое в русском библейском регистре, без добавления толкования.
