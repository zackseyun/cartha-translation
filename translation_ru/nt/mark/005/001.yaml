lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет характерную для Марка паратактическую связь повествования без стилистического сглаживания до «затем».
- source_word: ἦλθον
  choice: прибыли они
  rationale: Простая передача аориста множественного числа; речь идёт об Иисусе и сопровождавших его людях из предшествующего контекста.
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: на другой берег моря
  rationale: Естественно передаёт направленное движение к противоположной стороне; «моря» сохраняет словоупотребление греческого текста, хотя имеется в виду Галилейское море, то есть озеро.
- source_word: εἰς τὴν χώραν
  choice: в область
  rationale: χώρα здесь обозначает местность или территорию, а не страну в современном государственно-политическом смысле.
- source_word: Γερασηνῶν
  choice: герасинцев
  rationale: Передаёт этникон — название жителей или людей, связанных с Герасой, — и следует чтению SBLGNT.
theological_decisions:
- issue: Разночтение в названии местности в рассказе об изгнании бесов
  choice: герасинцев
  alternative: гадаринцев; гергесинцев
  rationale: Основной текст следует чтению Γερασηνῶν в SBLGNT, а значимые рукописные варианты сохраняются в сноске без попытки устранить текстовую и географическую сложность.
translation_notes:
  register: Современный литературный русский язык с ясным и достойным повествовательным строем. Инверсия «прибыли они» слегка поддерживает библейский повествовательный ритм, оставаясь естественной. Маркер [a] поставлен непосредственно после слова «моря», по расположению консультационного текста, хотя разночтение относится к названию области далее в стихе.
