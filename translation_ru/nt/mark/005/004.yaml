  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: ru
  text: потому что его много раз сковывали ножными оковами и цепями, но он разрывал цепи и разбивал оковы, и никто не был в силах усмирить его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укротить его». Греческий глагол может означать как «укротить», так и в более широком смысле «усмирить, подчинить, взять под контроль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: потому что его
  rationale: διά с субстантивированным инфинитивом выражает причину предыдущего утверждения; русская конструкция естественно вводит причинное пояснение.
- source_word: πολλάκις
  choice: много раз
  rationale: Передаёт повторяемость действий ясно и естественно в современном русском повествовании.
- source_word: πέδαις / τὰς πέδας
  choice: ножными оковами / оковы
  rationale: πέδη обозначает прежде всего оковы для ног; первое употребление уточнено словом «ножными», а при повторе достаточно краткого «оковы».
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: цепями / цепи
  rationale: Сохраняется различие между цепями вообще и ножными оковами.
- source_word: δεδέσθαι
  choice: сковывали
  rationale: По-русски естественно передаёт повторные попытки связать и удержать человека железными средствами; повторяемость обозначена словами «много раз».
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις
  choice: он разрывал цепи
  rationale: Активная русская конструкция ясно передаёт личное действие и силу глагола διασπάω.
- source_word: τὰς πέδας συντετρῖφθαι
  choice: разбивал оковы
  rationale: Передаёт интенсивное разрушение, выраженное συντρίβω, без избыточно громоздкого «разбивал на куски».
- source_word: οὐδεὶς ἴσχυεν
  choice: никто не был в силах
  rationale: Сохраняет оттенок силы и способности, присущий ἰσχύω.
- source_word: δαμάσαι
  choice: усмирить
  rationale: В данном контексте означает подчинить и взять под контроль; «усмирить» естественно применимо к человеку и не навязывает образ дрессировки.
theological_decisions:
- issue: Источник необычайной силы человека
  choice: Перевод описывает безуспешные попытки удержать его, не называя в этом стихе источник силы.
  alternative: Прямо связать силу с бесовским воздействием.
  rationale: Сам стих сообщает о необычайной силе и невозможности усмирить человека, однако её причина раскрывается окружающим повествованием, а не формулируется здесь прямо.
- issue: Значение δαμάσαι
  choice: усмирить
  alternative: укротить
  rationale: «Усмирить» сохраняет значение подчинения и взятия под контроль, тогда как «укротить» сильнее вызывает ассоциацию с животным; подлинная широта греческого слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, энергичным повествовательным ритмом. Термины «ножные оковы» и «цепи» различены в соответствии с греческим текстом; архаизмы и конфессионально окрашенные толкования исключены.
