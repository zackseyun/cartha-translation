base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: ru
  text: 'И, взяв ребёнка за руку, Он говорит ей: «Талифа кум»[a], что в переводе означает: «Девочка, говорю тебе, встань».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционная русская передача этой арамейской фразы — «Талифа куми». В тексте SBLGNT стоит κουμ («кум»).
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς
  choice: взяв … за руку
  rationale: Причастие κρατήσας с родительным τῆς χειρός обозначает, что Иисус взял ребёнка за руку. Эта формулировка естественна по-русски и передаёт физическое прикосновение без излишне резкого оттенка «схватив».
- source_word: τοῦ παιδίου
  choice: девочку
  rationale: Хотя παιδίον само по себе означает «ребёнок», местоимение αὐτῇ и последующее κοράσιον ясно указывают на девочку. Русское «девочку» делает фразу естественной и не добавляет отсутствующей в контексте информации.
- source_word: λέγει αὐτῇ
  choice: Он говорит ей
  rationale: Настоящее время сохраняет характерное для Марка историческое настоящее и живость повествования.
- source_word: Ταλιθα κουμ
  choice: Талифа кум
  rationale: Сохранена переданная греческим текстом арамейская фраза, которую сам Марк затем переводит. «Кум» непосредственно отражает чтение κουμ в SBLGNT.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: что в переводе означает
  rationale: Естественная современная русская формула, ясно вводящая данный евангелистом перевод арамейских слов.
- source_word: Τὸ κοράσιον
  choice: Девочка
  rationale: κοράσιον обозначает девочку или юную девушку; в прямом обращении «Девочка» точно и естественно, тогда как «маленькая девочка» звучало бы по-русски менее органично.
- source_word: σοὶ λέγω
  choice: тебе говорю
  rationale: Явно выраженное σοὶ сохранено с естественным для русского акцентом на адресате повеления.
- source_word: ἔγειρε
  choice: встань
  rationale: Повелительная форма ἐγείρω в данном контексте призывает девочку подняться. «Встань» звучит ясно, современно и непосредственно.
theological_decisions:
- issue: Сохранение арамейских слов Иисуса
  choice: Передать «Талифа кум» транслитерацией и вслед за Марком привести перевод.
  alternative: 'Оставить только русский перевод: «Девочка, тебе говорю: встань».'
  rationale: Греческий источник намеренно сохраняет семитские слова и сам поясняет их. Передача обеих частей сохраняет повествовательную фактуру текста, не затемняя смысла.
- issue: Значение ἔγειρε в рассказе о возвращении к жизни
  choice: Перевести «встань», не уточняя отдельно «оживи» или «воскресни».
  alternative: Перевести «воскресни» или «пробудись».
  rationale: Глагол допускает смысл пробуждения и поднятия, а контекст придаёт ему более глубокое значение. «Встань» сохраняет конкретную форму приказа и не снимает богословское напряжение поясняющим переводом.
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной живостью. Историческое настоящее Марка сохранено («говорит»); местоимение «Он» написано с прописной буквы согласно принятой русской библейской издательской традиции.
