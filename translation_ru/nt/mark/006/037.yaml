source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: ru
  text: 'Но Он ответил им: «Вы сами дайте им поесть». Они сказали Ему: «Пойти ли нам купить хлеба на двести динариев[a] и дать им поесть?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарий был обычной платой работнику примерно за один день труда. Греческое слово, переведённое как «хлеб», может также означать «хлебы» или «буханки хлеба».
    reason: Культурное пояснение денежной единицы и сохранение лексической альтернативы для ἄρτους.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: В современном русском сочетание «ответив, сказал» звучит избыточно; глагол «ответил» естественно и точно передаёт повествовательную формулу.
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Вы сами дайте им поесть
  rationale: «Вы сами» передаёт эмфатическое ὑμεῖς, а «дайте им поесть» естественно выражает конструкцию с инфинитивом φαγεῖν и сохраняет прямой императив.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Неужели нам пойти купить
  rationale: Делиберативный конъюнктив в контексте передаёт вопрос о предполагаемом действии; «неужели» естественно отражает контекстуально вероятное удивление, не превращая вопрос в утверждение.
- source_word: δηναρίων διακοσίων
  choice: на двести динариев
  rationale: Родительный падеж обозначает цену; русская конструкция «купить на…» ясно передаёт стоимость покупки.
- source_word: ἄρτους
  choice: хлеба
  rationale: В данном контексте неисчисляемое «хлеб» наиболее естественно по-русски; греческое слово также может обозначать отдельные хлебы или буханки.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: дать им поесть
  rationale: Сохраняется словесная перекличка с повелением Иисуса и не вводится более толковое «накормить».
theological_decisions:
- issue: Характер вопроса учеников
  choice: Неужели нам пойти купить…?
  alternative: Пойти ли нам купить…?
  rationale: Греческая форма допускает делиберативный вопрос; выбранная формулировка передаёт естественную для контекста реакцию недоумения, но не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык; речь прямая и доступная, с сохранением эмфазы «вы сами» и повтора «дать им поесть». Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
