  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: ru
  text: 'Он спросил их: «Сколько у вас хлебов? Пойдите и посмотрите». Узнав, они ответили: «Пять хлебов и две рыбы».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει / λέγουσιν
  choice: спросил / ответили
  rationale: 'Историческое настоящее естественно передано русским прошедшим временем; речевые глаголы уточнены по функции реплик: первый вводит вопрос, второй — ответ.'
- source_word: ἄρτους
  choice: хлебов
  rationale: Счётная форма «хлебов» обозначает отдельные хлебы или лепёшки и сохраняет конкретность исходного текста.
- source_word: ὑπάγετε ἴδετε
  choice: Пойдите посмотрите
  rationale: Переданы два повелительных глагола краткой и естественной русской конструкцией.
- source_word: γνόντες
  choice: Узнав
  rationale: 'Деепричастие сохраняет предшествование действия: ученики сначала выяснили количество, затем сообщили его.'
- source_word: ἰχθύας
  choice: рыбы
  rationale: После числительного «две» нормативна форма родительного падежа единственного числа; смысл двух отдельных рыб сохраняется.
