lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Естественно и с достоинством передаёт характерную для Марка безотлагательность действия.
- source_word: βασιλεὺς
  choice: царь
  rationale: Сохраняет повествовательное обозначение Ирода у Марка, не исправляя его на исторически более точный титул «тетрарх».
- source_word: σπεκουλάτορα
  choice: телохранителя
  rationale: Греческое слово, заимствованное из латыни, обозначает воина из охраны правителя; в данном контексте он выполняет роль палача. Выбор сохраняет должность, а не только разовую функцию.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: приказал принести
  rationale: Прямо и естественно передаёт повеление с инфинитивом.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: голову Иоанна
  rationale: Явное имя устраняет возможную в русском тексте двусмысленность местоимения, не меняя референта, однозначного из контекста.
- source_word: ἀπεκεφάλισεν
  choice: обезглавил
  rationale: Точный и стилистически уместный эквивалент, обозначающий отсечение головы.
- source_word: ἐν τῇ φυλακῇ
  choice: в темнице
  rationale: Передаёт конкретное место заключения в dignified narrative register; «темница» понятно современному читателю и соответствует библейскому повествовательному стилю.
