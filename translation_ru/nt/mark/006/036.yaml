  source_fidelity: 'Текст точно передаёт повеление ἀπόλυσον, целевое ἵνα и последовательность, выраженную ἀπελθόντες. «Окрестные селения и деревни» — приемлемое контекстуальное воспроизведение ἀγρούς καὶ κώμας: различие двух греческих обозначений сельской местности/поселений несколько сглажено, но смысл не утрачен и не внесена излишняя конкретизация. «Купили себе что-нибудь поесть» верно передаёт ἀγοράσωσιν ἑαυτοῖς τί φάγωσιν.'
