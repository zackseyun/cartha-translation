source:
  edition: SBLGNT
  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: ru
  text: Отпусти их, чтобы они пошли в окрестные селения и деревни и купили себе что-нибудь поесть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλυσον αὐτούς
  choice: Отпусти их
  rationale: В данном контексте ἀπολύω означает отпустить или отослать собравшихся; «отпусти их» естественно передаёт повеление без излишней официальности.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель предполагаемого действия.
- source_word: ἀπελθόντες
  choice: они пошли
  rationale: Аористное причастие включено в придаточное цели; так сохраняются последовательность действий и естественность русской речи.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: в окрестные селения и деревни
  rationale: ἀγροί здесь обозначает сельские места или поселения в окружающей местности, а κῶμαι — деревни; перевод сохраняет два согласованных элемента и избегает неуместного представления, будто пищу предлагалось покупать в полях.
- source_word: ἀγοράσωσιν ἑαυτοῖς
  choice: купили себе
  rationale: Сохраняется обычное значение глагола «купить» и значение выгоды, выраженное возвратным местоимением в дательном падеже.
- source_word: τί φάγωσιν
  choice: что-нибудь поесть
  rationale: Естественное русское выражение для неопределённого τί в значении пищи, которую можно съесть.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Повелительное «отпусти» согласовано с обращением к одному Иисусу, а множественное «они пошли» относится к народу.
