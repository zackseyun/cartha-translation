  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: ru
  text: 'Ведь все они увидели его и пришли в смятение. Но он тотчас заговорил с ними и говорит им: «Мужайтесь! Это я[a]. Не бойтесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я есть». Выражение может быть обычным указанием на себя («это я»), но также может иметь более глубокий богословский оттенок.'
    reason: Сохраняет неоднозначность ἐγώ εἰμι и объясняет естественный перевод в основном тексте.
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: пришли в смятение
  rationale: Передаёт сильное внутреннее потрясение и испуг, не сужая значение лишь до страха.
- source_word: εὐθύς
  choice: тотчас
  rationale: Естественное и точное обозначение немедленного действия.
- source_word: Θαρσεῖτε
  choice: Мужайтесь!
  rationale: Краткий, повелительный призыв обрести мужество; соответствует достоинству и силе греческого выражения.
- source_word: ἐγώ εἰμι
  choice: Это я
  rationale: В данном контексте это естественная русская формула самоидентификации. Возможное более буквальное и богословски значимое прочтение сохранено в сноске, без навязывания одного толкования.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого повествования и переход от «заговорил» к прямой речи.
theological_decisions:
- issue: Возможный богословский оттенок выражения ἐγώ εἰμι
  choice: 'В основном тексте: «Это я»; буквальная форма указана в сноске.'
  alternative: «Я есть» или архаическое «Я есмь»
  rationale: Греческое выражение допускает как обычную самоидентификацию, так и возможный отзвук божественной формулы. «Я есть» по-русски неестественно, а «Я есмь» искусственно усиливает богословскую интерпретацию; сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткими, энергичными повелениями. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с обычной современной орфографией и без добавления отсутствующей в греческом тексте конфессиональной маркировки.
