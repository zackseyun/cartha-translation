  terminology: «Безлюдное место» удачно передаёт ἔρημον τόπον без ложного географического значения современной «пустыни». «Немного отдохните» точно передаёт ἀναπαύσασθε ὀλίγον. Сноска сохраняет уместную альтернативу и пояснение.
