  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: ru
  text: 'И Он сказал им: «Пойдите одни в безлюдное место[a] и немного отдохните». Ведь многие приходили и уходили, так что у учеников не было возможности даже поесть[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «в уединённое место». Греческое выражение означает изолированное или необитаемое место, не обязательно пустыню в современном смысле.
    reason: lexical_alternative
  - marker: b
    text: Или «ученикам некогда было даже поесть».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: сказал
  rationale: Греческий исторический презенс передан прошедшим временем в соответствии с естественным русским повествованием.
- source_word: Δεῦτε
  choice: Пойдите
  rationale: Побудительная форма приглашает учеников удалиться от толпы; «пойдите» естественно передаёт требуемое перемещение.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: одни
  rationale: Эмфатические местоимения и оборот κατ’ ἰδίαν вместе подчёркивают, что ученикам следует удалиться отдельно от других; русское «одни» кратко и естественно сохраняет этот смысл.
- source_word: ἔρημον τόπον
  choice: безлюдное место
  rationale: ἔρημος обозначает прежде всего необитаемое, уединённое место, а не обязательно пустыню в современном географическом смысле.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: немного отдохните
  rationale: Средний императив призывает прекратить труд и восстановить силы, а ὀλίγον указывает на непродолжительность отдыха.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: множество людей приходило и уходило
  rationale: Субстантивированные причастия описывают постоянный поток людей; существительное «людей» ясно восполняет подразумеваемое лицо.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: у них не было возможности даже поесть
  rationale: εὐκαιρέω означает располагать временем или удобной возможностью; выбранная формулировка точна и естественна, а «даже» передаёт οὐδέ.
