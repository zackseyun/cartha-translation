  source_fidelity: 'Основной смысл передан точно: Иисус приглашает учеников уйти отдельно в безлюдное место и немного отдохнуть; причиной служит непрерывный поток приходящих и уходящих людей. Однако местоимение «у них» после «множество людей приходило и уходило» в русском тексте может быть понято как относящееся к этим людям, тогда как в греческом оно относится к ученикам, которым сказано повеление.'
