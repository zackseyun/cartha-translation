base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: ru
  text: 'Она тотчас же поспешно вошла к царю и попросила: «Хочу, чтобы ты сейчас же дал мне на блюде голову Иоанна Крестителя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: вошла к царю
  rationale: Причастие передаёт движение девушки внутрь, к царю; по-русски действие естественно выражено личной формой в последовательном повествовании.
- source_word: εὐθὺς
  choice: тотчас же
  rationale: Сохраняет характерную для Марка непосредственность действия и не сливается со вторым указанием на срочность в самой просьбе.
- source_word: μετὰ σπουδῆς
  choice: поспешно
  rationale: Передаёт быстроту и настойчивую спешку, не приписывая девушке положительно окрашенного усердия.
- source_word: βασιλέα
  choice: царю
  rationale: Переводит βασιλεύς как оно дано в повествовании, несмотря на исторический титул Ирода Антипы — тетрарх.
- source_word: ᾐτήσατο λέγουσα
  choice: попросила
  rationale: Глагол означает обращение с просьбой; содержание речи естественно вводится двоеточием, поэтому отдельная передача λέγουσα в русском не требуется.
- source_word: Θέλω
  choice: Хочу
  rationale: Сохраняет прямой и резкий характер волеизъявления без излишне книжного «желаю».
- source_word: ἵνα ... δῷς μοι
  choice: чтобы ты ... дал мне
  rationale: Естественно передаёт придаточное, раскрывающее содержание желания.
- source_word: ἐξαυτῆς
  choice: сейчас же
  rationale: Отдельно передаёт требование немедленного исполнения, тогда как εὐθὺς относится к её приходу.
- source_word: ἐπὶ πίνακι
  choice: на блюде
  rationale: πίναξ обозначает большое блюдо или поднос; «на блюде» естественно для контекста пира и традиционно понятно современному читателю.
- source_word: τὴν κεφαλὴν
  choice: голову
  rationale: Прямой перевод сохраняет намеренно страшную конкретность просьбы.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Иоанна Крестителя
  rationale: «Креститель» — устойчивое и понятное русское обозначение лица, совершающего крещение; оно сохраняет описательную функцию греческого титула βαπτιστής.
theological_decisions:
- issue: Передача титула Ἰωάννου τοῦ βαπτιστοῦ
  choice: Иоанна Крестителя
  alternative: Иоанна, совершавшего крещение
  rationale: Устойчивое русское «Креститель» точно обозначает деятельность Иоанна и звучит естественно; описательный оборот был бы тяжеловесным и не добавлял бы смысловой точности.
translation_notes:
  register: 'Современный литературный русский язык с кратким, напряжённым повествовательным ритмом. Два разных указания на срочность сохранены: «тотчас же» описывает её приход, а «сейчас же» — требуемый срок исполнения.'
