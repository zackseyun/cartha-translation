id: MRK.6.15
reference: Mark 6:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: ru
  text: 'А другие говорили: «Это Илия», а иные говорили: «Это пророк, подобный одному из пророков».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Менее вероятный вариант: «тот Пророк», если речь идёт о конкретной ожидаемой эсхатологической фигуре. Однако греческий текст здесь естественнее понимать как «пророк», поскольку далее сказано: «подобный одному из пророков».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: А другие / а иные
  rationale: ἄλλοι обозначает другие группы среди высказывавшихся, а δέ передаёт мягкое противопоставление и продолжение; русские формулировки избегают тяжёлого повтора.
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект указывает на продолжавшиеся или повторявшиеся высказывания; русское прошедшее несовершенного вида естественно сохраняет этот аспект.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: «Это Илия»
  rationale: Прямая речь естественна после глагола речи; местоимение «это» по-русски ясно указывает на обсуждаемого Иисуса.
- source_word: προφήτης
  choice: пророк
  rationale: Безартиклевое именное сказуемое здесь имеет, вероятнее всего, неопределённый смысл; в русском языке неопределённый артикль не требуется.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: подобный одному из пророков
  rationale: ὡς выражает сравнение; формулировка сохраняет и значение εἷς, и сопоставление с пророками прошлого.
theological_decisions:
- issue: Следует ли понимать προφήτης как общее обозначение пророка или как титул конкретной эсхатологической фигуры
  choice: пророк
  alternative: тот Пророк
  rationale: Отсутствие артикля и продолжение «подобный одному из пророков» естественнее указывают на общее обозначение. Менее вероятная титульная трактовка сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Сохранены повторяемость сообщений, смена групп говорящих и неоднозначность слова προφήτης; менее вероятное титульное прочтение вынесено в примечание.
