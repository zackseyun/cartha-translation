  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: ru
  text: И он велел им рассадить всех группами[a] на зелёной траве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «группа за группой»; повтор в греческом тексте подчёркивает, что людей разместили отдельными группами для еды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: велел
  rationale: Глагол обозначает властное распоряжение; «велел» естественно передаёт его силу в данном повествовательном контексте.
- source_word: αὐτοῖς
  choice: им
  rationale: Сохранено местоимение исходного текста; из контекста ясно, что речь идёт об учениках.
- source_word: ἀνακλῖναι πάντας
  choice: рассадить всех
  rationale: 'Инфинитив здесь употреблён переходно: приказ обращён к ученикам, а «все» — те, кого им надлежит разместить для трапезы. Перевод не смешивает адресатов приказа с толпой.'
- source_word: συμπόσια συμπόσια
  choice: группами
  rationale: Повтор существительного имеет распределительное значение и описывает организованное размещение людей отдельными группами для еды.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: на зелёной траве
  rationale: Прямой и естественный перевод сочетания, где χλωρός означает «зелёный, свежий», а χόρτος — «трава».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык. «Рассадить» выбрано вместо буквального «возложить» или «усадить полулёжа»: оно естественно передаёт организацию людей для трапезы, сохраняя различие между учениками, которым дано распоряжение, и всей толпой, которую им велено разместить.'
