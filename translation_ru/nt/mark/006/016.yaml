lexical_decisions:
- source_word: ἀκούσας
  choice: услышав об этом
  rationale: Аористное причастие естественно передано деепричастным оборотом; «об этом» восполняет подразумеваемый из контекста предмет услышанного.
- source_word: δὲ
  choice: но
  rationale: Частица обозначает мягкий повествовательный переход с оттенком противопоставления и возвращает внимание к реакции Ирода.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Несовершенный вид греческого глагола допускает длительное или повторяющееся высказывание; русское «говорил» сохраняет эту возможность без излишнего уточнения.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Иоанн, которому я отсёк голову
  rationale: Фраза перестроена в соответствии с естественным русским порядком слов, при этом сохранены имя, относительная конструкция и прямой смысл глагола обезглавливания.
- source_word: οὗτος
  choice: это он
  rationale: Указательное местоимение имеет подчёркнутый характер; оборот «это он» передаёт его выразительнее, чем простое «он».
- source_word: ἠγέρθη
  choice: был воскрешён
  rationale: Сохранён страдательный залог аориста ἐγείρω и контекстуальный смысл возвращения умершего к жизни; совершающий действие не назван.
theological_decisions:
- issue: Передача ἠγέρθη в речи Ирода
  choice: был воскрешён
  alternative: воскрес
  rationale: Страдательная форма исходного текста сохранена, чтобы не превращать её без необходимости в активную формулу и не уточнять неназванного деятеля.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным синтаксисом. Реплика Ирода сохраняет подчёркнутое «это он», соответствующее οὗτος, и несколько напряжённую формулировку пассива, важную для точности исходного текста.
