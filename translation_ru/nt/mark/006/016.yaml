  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: ru
  text: 'Но Ирод, услышав об этом, говорил[a]: «Иоанн, которому я отрубил голову, — он был воскрешён[b]».'
  philosophy: optimal-equivalence
  footnotes:
