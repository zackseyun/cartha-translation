  source_fidelity: «Отплыли в лодке» в целом передаёт уход на лодке, а «в безлюдное место» хорошо передаёт εἰς ἔρημον τόπον. Однако «чтобы побыть одним» преобразует обстоятельственное κατ’ ἰδίαν в целевую конструкцию и добавляет оттенок намерения («чтобы»), которого греческий текст прямо не выражает.
