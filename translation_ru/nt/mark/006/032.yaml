  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: ru
  text: И они отправились на лодке в безлюдное место одни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдельно от других»; «наедине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет характерное для Марка простое повествовательное соединение.
- source_word: ἀπῆλθον
  choice: отплыли
  rationale: В сочетании с «в лодке» естественно передаёт удаление из прежнего места водным путём; значение движения не сводится к простому пребыванию в лодке.
- source_word: ἐν τῷ πλοίῳ
  choice: в лодке
  rationale: Близко следует греческой предложной конструкции; «лодка» естественно для евангельского контекста.
- source_word: εἰς ἔρημον τόπον
  choice: в безлюдное место
  rationale: Передаёт основное значение незаселённого, уединённого места, не навязывая географический образ пустыни.
- source_word: κατ’ ἰδίαν
  choice: чтобы побыть одним
  rationale: Естественно по-русски выражает отделённость группы от других людей. Целевая конструкция слегка эксплицирует подразумеваемый смысл уединения; возможен более формально близкий вариант в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простым повествовательным ритмом. «Безлюдное место» понятно широкому читателю и не создаёт лишней ассоциации с песчаной пустыней. Формулировка «чтобы побыть одним» звучит естественно, но сохраняющая синтаксическую неоднозначность альтернатива дана в сноске.
