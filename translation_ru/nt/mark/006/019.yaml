  text: Иродиада же питала к нему неприязнь и хотела убить его[a], но не могла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «держала на него зло» или «питала к нему вражду»; греческое выражение передаёт продолжающуюся враждебность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Частица отмечает развитие повествования с оттенком противопоставления; постпозитивное «же» естественно связывает стих с предыдущим контекстом.
- source_word: Ἡρῳδιὰς
  choice: Иродиада
  rationale: Использована устоявшаяся русская форма личного имени.
- source_word: ἐνεῖχεν αὐτῷ
  choice: затаила на него злобу
  rationale: Греческое выражение обозначает сохраняющуюся враждебность; «затаила злобу» передаёт как неприязнь, так и длительный характер имперфекта.
- source_word: ἤθελεν
  choice: хотела
  rationale: Прямой и естественный эквивалент, выражающий продолжающееся намерение.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: убить его
  rationale: Передаёт значение глагола прямо, не добавляя юридической или нравственной квалификации, присущей слову «убить» в отличие от более интерпретирующего «совершить убийство».
- source_word: καὶ οὐκ ἠδύνατο
  choice: но не могла
  rationale: 'Хотя καὶ обычно означает «и», здесь связь по смыслу противительная: желание Иродиады сталкивалось с невозможностью его осуществить.'
