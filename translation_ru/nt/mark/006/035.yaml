  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: ru
  text: 'Когда уже стало совсем поздно, его ученики подошли к нему и сказали: «Это безлюдное место, и уже совсем поздно».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: уже
  rationale: Прямо передаёт указание на то, что время продвинулось; естественно звучит в обоих случаях.
- source_word: ὥρας πολλῆς γενομένης
  choice: когда стало уже совсем поздно
  rationale: Генитив абсолютный обозначает наступление позднего времени; русская временная конструкция естественно передаёт греческий оборот, а «совсем поздно» отражает усиление πολλῆς.
- source_word: προσελθόντες αὐτῷ
  choice: подошли к Иисусу
  rationale: «Подошли» точно и естественно передаёт движение к нему; имя «Иисус» употреблено ради ясности русского повествования при сохранении референции местоимения.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ученики
  rationale: При названном адресате принадлежность ясна из контекста; такое выражение избегает тяжеловесного «его ученики» рядом с «к Иисусу».
- source_word: ἔλεγον
  choice: сказали
  rationale: Русский совершенный глагол естественен при введении прямой речи; греческий имперфект здесь не обязательно обозначает повторение и не требует искусственного «говорили».
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: место здесь безлюдное
  rationale: ἔρημος в данном контексте означает необитаемое, уединённое место; «безлюдное» не привносит эмоционального оттенка «пустынного», а «здесь» естественно выражает ситуативное указание.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: и уже поздно
  rationale: Идиоматично передаёт поздний час. В прямой речи «совсем» не повторяется, чтобы избежать стилистической тяжеловесности, при этом смысл πολλή сохраняется словом «поздно» в контексте.
