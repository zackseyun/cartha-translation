  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: ru
  text: И апостолы собрались у Иисуса и рассказали Ему обо всём, что они сделали и чему учили.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: собрались
  rationale: Историческое настоящее передано естественным для русского повествования прошедшим временем; глагол сохраняет значение совместного сбора.
- source_word: οἱ ἀπόστολοι
  choice: апостолы
  rationale: У Марка это устойчивое обозначение Двенадцати в их роли посланников; традиционный русский термин точен и понятен.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: у Иисуса
  rationale: Оборот передаёт итог движения к Иисусу и место встречи; буквальное «собрались к Иисусу» в современном русском звучит неестественно.
- source_word: ἀπήγγειλαν
  choice: рассказали
  rationale: В контексте возвращения с поручения речь идёт о сообщении Иисусу результатов; «рассказали» естественно передаёт это без излишне официального оттенка слова «доложили».
- source_word: πάντα ὅσα ἐποίησαν
  choice: обо всём, что они сделали
  rationale: Сохраняется всеохватность πάντα и содержание первого относительного оборота.
- source_word: ὅσα ἐδίδαξαν
  choice: чему учили
  rationale: Русский оборот естественно обозначает содержание их учения и сохраняет параллель со сделанным, не уточняя то, чего греческий текст не уточняет.
theological_decisions:
- issue: Обозначение учеников словом ἀπόστολοι
  choice: апостолы
  alternative: посланники
  rationale: Здесь слово обозначает порученную роль Двенадцати и уже функционирует как узнаваемое наименование; «посланники» могло бы ошибочно придать ему общий смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сделан плавным для повествования; местоимение «Ему» оформлено по принятой в русском библейском стиле почтительной норме.
