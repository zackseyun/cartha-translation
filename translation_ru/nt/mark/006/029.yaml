  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: ru
  text: Услышав об этом, его ученики пришли, подняли его тело[a] и положили его в гробницу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «труп». Греческое слово означает мёртвое тело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Услышав об этом
  rationale: Аористное причастие имеет здесь временное значение. Добавленное «об этом» естественно передаёт подразумеваемую в греческом объектную связь с известием о казни.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: его ученики
  rationale: «Ученики» точно передаёт μαθηταί; местоимение в ближайшем контексте относится к Иоанну Крестителю.
- source_word: ἦλθον
  choice: пришли
  rationale: Прямое и естественное повествовательное соответствие ἦλθον.
- source_word: ἦραν
  choice: забрали
  rationale: В данном контексте αἴρω обозначает, что ученики взяли тело и унесли его для погребения; «забрали» передаёт это естественно и без лишней конкретизации способа.
- source_word: πτῶμα
  choice: тело
  rationale: Греческое слово обозначает именно мёртвое тело. В основном тексте «тело» звучит современно и достойно, а точное значение отмечено в сноске.
- source_word: ἔθηκαν
  choice: положили
  rationale: Обычное и уместное в контексте погребения соответствие τίθημι.
- source_word: ἐν μνημείῳ
  choice: в гробницу
  rationale: μνημεῖον здесь означает место погребения, гробницу; это точнее, чем более широкое «могила».
theological_decisions:
- issue: К кому относится выражение «его ученики»
  choice: к ученикам Иоанна Крестителя
  alternative: к ученикам Иисуса
  rationale: Ближайший контекст повествует о казни Иоанна, и именно его ученики забирают и погребают его тело.
translation_notes:
  register: Современный литературный русский язык; повествование краткое, ясное и достойное. Сохранена последовательность греческого текста без излишней буквальности.
