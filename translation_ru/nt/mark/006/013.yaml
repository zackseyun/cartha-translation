  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: ru
  text: Они изгоняли многих демонов, помазывали маслом[a] многих больных и исцеляли их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оливковым маслом».'
    reason: Лексема ἔλαιον может обозначать оливковое масло, обычное в древнем средиземноморском контексте, хотя в исходном тексте употреблено общее слово «масло».
lexical_decisions:
- source_word: δαιμόνια πολλὰ
  choice: множество бесов
  rationale: δαιμόνια обозначает злых духов, а πολλὰ указывает на их большое число. «Множество бесов» точно и естественно передаёт это сочетание, не подменяя его выражением «нечистые духи», которого в данном стихе нет.
- source_word: ἐξέβαλλον
  choice: изгоняли
  rationale: Имперфект описывает продолжавшееся или неоднократно совершавшееся действие; русская форма несовершенного вида «изгоняли» сохраняет этот аспект.
- source_word: ἤλειφον
  choice: помазывали
  rationale: ἀλείφω означает мазать или помазывать; в данном контексте «помазывали» является естественным и традиционно понятным обозначением нанесения масла. Несовершенный вид отражает имперфект.
- source_word: ἐλαίῳ
  choice: маслом
  rationale: ἔλαιον означает масло, в средиземноморском контексте обычно оливковое. В основном тексте достаточно общего и естественного слова «маслом», а более явный вариант отмечен в сноске.
- source_word: πολλοὺς ἀρρώστους
  choice: многих больных
  rationale: Субстантивированное прилагательное ἀρρώστους обозначает больных людей, а πολλούς — их множественность. Русское «многих больных» передаёт это кратко и естественно.
- source_word: ἐθεράπευον
  choice: исцеляли их
  rationale: θεραπεύω здесь означает исцелять. Несовершенный вид «исцеляли» сохраняет повторяемость или длительность действия, а местоимение «их» ясно соотносит действие с упомянутыми больными.
- source_word: καὶ
  choice: и; бессоюзное соединение в первом случае
  rationale: Повторяющееся καί связывает действия в простой повествовательной цепи. В русском перечислении первая связь естественно передаётся запятой, а последняя — союзом «и», без изменения смыслового отношения.
theological_decisions:
- issue: Связь помазания маслом с исцелением
  choice: Описать оба действия без объяснения механизма исцеления
  alternative: Представить масло как само по себе производящее исцеление либо как исключительно символическое средство
  rationale: Стих сообщает, что ученики помазывали больных маслом и исцеляли их, но не разъясняет богословский механизм этой связи. Перевод сохраняет последовательность и напряжение исходного текста, не вводя позднейших конфессиональных выводов.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, ясное и достойное. Несовершенный вид глаголов передаёт повторяющийся характер действий в повествовательном резюме.
