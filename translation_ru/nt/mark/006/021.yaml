lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохранён характерный для Марка повествовательный союз, естественный и в русском продолжении рассказа.
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: настал подходящий день
  rationale: Генитивная абсолютная конструкция задаёт обстоятельство, а εὔκαιρος обозначает день, подходящий для замысла Иродиады; формулировка сохраняет зловещий оттенок удобного случая, не уточняя явно, для кого он был подходящим.
- source_word: ὅτε
  choice: ':'
  rationale: Следующее событие раскрывает, почему этот день оказался подходящим. Двоеточие естественно передаёт пояснительную связь и избегает тяжёлого повтора «когда».
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: в свой день рождения
  rationale: γενέσια здесь означает празднование дня рождения; русская идиома ясно и кратко передаёт повод.
- source_word: δεῖπνον ἐποίησεν
  choice: устроил пир
  rationale: Греческая идиома буквально означает «устроил ужин»; «устроил пир» естественно передаёт торжественную трапезу для высокопоставленных гостей.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: для своих вельмож
  rationale: μεγιστᾶνες — высокопоставленные лица, связанные с правителем; «вельможи» кратко и уместно передаёт их общественное положение.
- source_word: τοῖς χιλιάρχοις
  choice: военачальников
  rationale: Термин обозначает старших военных командиров; функциональный русский эквивалент понятен без чрезмерно узкого римского титула.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: знатных людей Галилеи
  rationale: πρῶτοι обозначает наиболее видных, первенствующих жителей области. «Знатные люди» передаёт высокий общественный статус и естественно звучит по-русски.
- source_word: Ἡρῴδης
  choice: Ирод
  rationale: Устоявшаяся русская форма имени.
