  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/042.yaml
  text: And they all ate and were satisfied.
translation:
  language: ru
  text: И все ели и насытились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: ели
  rationale: Аорист активного залога от ἐσθίω обозначает обычное действие принятия пищи. «Ели» — простой и естественный русский эквивалент; добавлять объект «пищу» нет необходимости.
- source_word: πάντες
  choice: все
  rationale: Субстантивированное прилагательное во множественном числе относится ко всему народу, собравшемуся вокруг Иисуса. Русское «все» естественно выражает полный охват без добавления местоимения.
- source_word: ἐχορτάσθησαν
  choice: насытились
  rationale: Пассивная форма χορτάζω означает быть накормленными досыта, полностью утолить голод. Возвратное «насытились» идиоматично передаёт результат и сохраняет связь именно с едой.
- source_word: καὶ ... καὶ
  choice: И ... и ...
  rationale: Повторяющийся союз καί прямо соединяет два действия. Сохранение начального и внутреннего «и» передаёт характерный для Марка паратактический ход повествования.
theological_decisions: []
