lexical_decisions:
- source_word: ἀλλὰ
  choice: а
  rationale: Краткий противительный союз естественно связывает это указание с предыдущими ограничениями.
- source_word: ὑποδεδεμένους
  choice: обуться
  rationale: Перфектное причастие в контексте передаёт предписанное состояние — быть обутыми; инфинитив согласуется с формой ряда указаний и звучит естественно по-русски.
- source_word: σανδάλια
  choice: в сандалии
  rationale: Прямое и исторически уместное обозначение обуви; предложная конструкция естественна с глаголом «обуться».
- source_word: μὴ ἐνδύσησθε
  choice: не надевать
  rationale: Запрет с аористным конъюнктивом передаёт действие облачения, не сводя его к состоянию ношения.
- source_word: δύο
  choice: двух
  rationale: Числительное сохранено прямо, с требуемым русским падежным согласованием.
- source_word: χιτῶνας
  choice: хитонов
  rationale: «Хитон» точно обозначает основную нательную одежду того времени и избегает анахроничного «рубашка».
