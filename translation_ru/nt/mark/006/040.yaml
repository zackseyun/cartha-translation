  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: ru
  text: И они расположились группами, по сто и по пятьдесят человек[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «грядками, грядками» — образ упорядоченных рядов или отдельных групп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: расположились
  rationale: Глагол означает занять место, обычно возлечь для трапезы. «Расположились» естественно звучит по-русски и сохраняет контекст совместной еды, не навязывая непривычную современному читателю позу.
- source_word: πρασιαὶ πρασιαὶ
  choice: группами
  rationale: Повторённое πρασιά буквально обозначает грядки или участки сада, а здесь образно передаёт упорядоченное размещение людей отдельными группами. Русское «группами» ясно выражает распределительный смысл; буквальный образ сохранён в сноске.
- source_word: κατὰ ἑκατὸν
  choice: по сто
  rationale: κατά с числительным имеет распределительное значение. «По сто» — краткое и естественное русское соответствие.
- source_word: κατὰ πεντήκοντα
  choice: по пятьдесят
  rationale: Параллельно предыдущему обороту κατά выражает распределение; «по пятьдесят» сохраняет структуру и смысл греческого текста.
