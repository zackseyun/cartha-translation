source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: ru
  text: И куда бы Он ни приходил — в селения, города или сельскую местность, — на рыночных площадях клали больных и умоляли Его, чтобы они могли хотя бы прикоснуться к краю Его одежды[a]. И все, кто прикасался к Нему, исцелялись[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к кайме Его одежды»; возможно также: «к кисти Его одежды». Греческое слово может обозначать край или кайму одежды, а в иудейском контексте — также кисть на ней.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «спасались». Здесь греческий глагол употреблён в значении физического исцеления или восстановления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: куда бы Он ни приходил
  rationale: Сочетание ὅπου с ἄν передаёт обобщённо-неопределённое значение, а имперфект указывает на повторявшееся действие; русская конструкция естественно выражает оба оттенка.
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: в селения, города или сельские местности
  rationale: ἀγροί в этом перечислении обозначает сельские районы или открытую местность, а не только отдельные поля.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: на площадях
  rationale: ἀγορά могла означать рынок или общественную площадь; в данном контексте русское «на площадях» естественно обозначает публичные места, куда приносили больных.
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: клали больных
  rationale: Имперфект обозначает повторявшееся действие, уже выраженное обобщающей конструкцией «куда бы… ни» и словом «там».
- source_word: παρεκάλουν αὐτόν
  choice: просили Его
  rationale: παρακαλέω здесь означает настойчивую просьбу; «просили» звучит достойно и естественно, не ослабляя контекстуальной настойчивости.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: позволить им хотя бы прикоснуться
  rationale: κἄν выражает минимальное условие — «хотя бы»; инфинитивная русская конструкция естественно передаёт содержание просьбы.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: к краю Его одежды
  rationale: κράσπεδον может обозначать край, кайму или кисть одежды. «Край» сохраняет основное пространственное значение, не исключая возможной связи с кистями и не делая её обязательной.
- source_word: ἥψαντο αὐτοῦ
  choice: прикасался к Нему
  rationale: Греческий текст прямо использует местоимение αὐτοῦ мужского рода со значением «к Нему»; предшествующая фраза уточняет предполагаемый способ прикосновения — к краю одежды.
- source_word: ἐσῴζοντο
  choice: исцелялись
  rationale: Хотя σῴζω имеет широкий диапазон значений, включая «спасать», непосредственный контекст говорит о восстановлении больных; «исцелялись» ясно передаёт контекстуальный смысл.
theological_decisions:
- issue: Передача ἐσῴζοντο от σῴζω
  choice: исцелялись
  alternative: спасались / становились здоровы
  rationale: Контекст прямо касается больных и их физического восстановления. «Исцелялись» не вносит сюда отдельного сотериологического утверждения, но сноска сохраняет буквальную широту глагола.
- issue: Объект прикосновения в ἥψαντο αὐτοῦ
  choice: к Нему
  alternative: к краю одежды / к ней
  rationale: Местоимение αὐτοῦ грамматически отсылает к Иисусу, хотя ближайший контекст показывает, что прикосновение совершалось к краю Его одежды. Основной текст сохраняет формальную отсылку оригинала.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. Обобщённо-повторительный характер сцены передан конструкцией «куда бы… ни… там». Местоимение «Он» оформлено с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
