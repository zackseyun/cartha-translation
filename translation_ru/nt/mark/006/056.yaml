  to: И куда бы Он ни приходил — в селения, города или сельскую местность, — на рыночных площадях клали больных и умоляли Его, чтобы они могли хотя бы прикоснуться к краю Его одежды[a]. И все, кто прикасался к Нему, исцелялись[b].
  rationale: Правки минимальны и не меняют значения. «Рыночные площади» точнее передаёт ἀγοραί, «сельскую местность» улучшает русскую сочетаемость, а «умоляли» воспроизводит контекстуальную настойчивость παρεκάλουν. Формулировка «чтобы они могли» сохраняет целевое придаточное ἵνα и не добавляет прямого утверждения о формальном разрешении.
