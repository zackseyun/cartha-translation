base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: ru
  text: 'Выйдя, она спросила свою мать: «Чего мне попросить?» Та ответила: «Голову Иоанна Крестителя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иоанна, крестящего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Выйдя
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу; деепричастие естественно и кратко передаёт последовательность действий.
- source_word: Τί αἰτήσωμαι
  choice: Чего мне попросить?
  rationale: Делиберативный аорист конъюнктива выражает вопрос о том, с какой просьбой следует обратиться. Русское «чего мне попросить?» естественно передаёт эту модальность и управление глагола.
- source_word: μητρὶ αὐτῆς
  choice: свою мать
  rationale: Возвратно-притяжательное местоимение нормативно для русского языка, поскольку обладатель соотносится с подлежащим.
- source_word: κεφαλήν
  choice: Голову
  rationale: Сохраняется прямое и намеренно жестокое содержание просьбы без эвфемизма.
- source_word: τοῦ βαπτίζοντος
  choice: Крестителя
  rationale: Субстантивированное причастие называет Иоанна по характерному действию крещения; «Креститель» — прозрачное, устойчивое и неденоминационное русское обозначение.
theological_decisions:
- issue: Передача прозвания Иоанна βαπτίζων
  choice: Крестителя
  alternative: крестящего
  rationale: «Креститель» сохраняет деятельное значение греческого причастия и в современном русском служит устойчивым прозванием Иоанна, не обозначая его принадлежности к позднейшей конфессии.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Повтор греческого εἶπεν передан естественным чередованием «спросила» и «ответила», поскольку реплики сами определяют речевую функцию. Маркер сноски поставлен непосредственно после соответствующего выражения.
