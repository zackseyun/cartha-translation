  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: ru
  text: И, простившись с ними[a], Он пошёл на гору помолиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «попрощавшись с ними».'
    reason: Лексическая альтернатива для ἀποταξάμενος αὐτοῖς; оба варианта передают прощание перед уходом.
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз, продолжающий рассказ без добавления более явного временного оттенка.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: простившись с ними
  rationale: Средняя форма ἀποτάσσομαι с дательным обозначает прощание перед уходом. Русское «простившись с ними» естественно, точно передаёт обстоятельственный причастный оборот и не вносит оттенка формального роспуска людей.
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: В данном сочетании направление уже выражено словами «на гору», а предшествующее «простившись» ясно подразумевает уход. «Пошёл» звучит естественно и не утяжеляет фразу; возможное «удалился» было бы более книжным.
- source_word: εἰς τὸ ὄρος
  choice: на гору
  rationale: Оборот с определённым артиклем буквально указывает на «гору». В русском языке направление к месту такого рода идиоматично выражается как «на гору».
- source_word: προσεύξασθαι
  choice: помолиться
  rationale: Инфинитив цели после глагола движения. Совершенный вид естественно передаёт цель конкретного ухода, не ограничивая длительность самой молитвы.
theological_decisions:
- issue: Определённость выражения τὸ ὄρος
  choice: «на гору» без символического истолкования
  alternative: «на одну из гор» или толкование горы как особого места откровения
  rationale: Греческий текст употребляет артикль, но не объясняет символического значения. Перевод сохраняет конкретную повествовательную деталь и не привносит отсутствующего в тексте богословского смысла.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и достойная по тону. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией, без изменения смысла исходного текста.
