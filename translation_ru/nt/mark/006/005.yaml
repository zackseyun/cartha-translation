source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: ru
  text: И Он не мог совершить там никакого могущественного деяния[a], лишь возложил руки на нескольких больных и исцелил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никакого чуда»; буквально: «никакой силы». У Марка слово «сила» может обозначать чудесное деяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: не мог
  rationale: Прямо передаёт отрицательную форму δύναμαι и сохраняет выраженное в тексте реальное ограничение, не заменяя его нежеланием.
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: совершить никакого могущественного деяния
  rationale: «Совершить» естественно сочетается с «деянием», а «могущественное деяние» сохраняет связь δύναμις с силой и одновременно указывает на чудесное действие, не сводя выражение к более истолковывающему слову «чудо».
- source_word: εἰ μὴ
  choice: лишь
  rationale: Кратко и естественно вводит исключение из предшествующего отрицания.
- source_word: ὀλίγοις ἀρρώστοις
  choice: на нескольких больных
  rationale: Передаёт небольшое число людей и естественно включается в конструкцию с возложением рук.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: возложил руки на
  rationale: Устойчивое и понятное русское выражение, точно передающее физическое действие аористного причастия.
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: В данном контексте точно передаёт θεραπεύω и сохраняет библейский, но современно понятный регистр.
theological_decisions:
- issue: Следует ли смягчить οὐκ ἐδύνατο, чтобы не подразумевать ограничения Иисуса
  choice: 'Сохранить прямой смысл: «Он не мог совершить»'
  alternative: «Он не стал совершать» или «Он не захотел совершить»
  rationale: Греческий текст прямо употребляет δύναμαι с отрицанием. Перевод сохраняет богословское напряжение и не подменяет выраженную неспособность нежеланием.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавное «Он» соответствует принятому русскому благоговейному употреблению, не меняя смысла исходного текста.
