  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: ru
  text: Увидев, как они выбиваются из сил, гребя, ибо ветер был им встречный, около четвёртой стражи ночи Он идёт к ним, шагая по морю[a][b], и хотел пройти мимо них[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Четвёртая стража ночи по римскому счёту времени приблизительно соответствовала промежутку от трёх до шести часов утра.
    reason: cultural_note
  - marker: b
    text: 'Или: «по воде». В греческом тексте буквально: «по морю».'
    reason: lexical_alternative
  - marker: c
    text: Слова «хотел пройти мимо них» могут означать просто, что Он собирался пройти дальше. Однако они могут также перекликаться с ветхозаветными сценами, в которых Бог «проходит мимо», являя Себя (например, Исх. 33:19, 22; 34:6; 3 Цар. 19:11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Увидев
  rationale: Деепричастие естественно передаёт аористное причастие и сохраняет временную связь с последующим действием.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: как они изнемогают, гребя против ветра
  rationale: «Изнемогают» передаёт тяжесть мучительной борьбы, выраженную βασανιζομένους, а «гребя» — одновременное действие ἐν τῷ ἐλαύνειν. Уточнение «против ветра» естественно связывает усилия гребцов с непосредственно названной причиной.
- source_word: ἐναντίος αὐτοῖς
  choice: был встречный
  rationale: Для ветра «встречный» — точное и естественное русское соответствие со значением направленности против плывущих.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: около четвёртой стражи ночи
  rationale: Сохранена древняя система отсчёта времени; περὶ передано словом «около».
- source_word: ἔρχεται
  choice: Он идёт
  rationale: Настоящее историческое сохранено ради характерной для Марка живости повествования.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: по морю
  rationale: Естественное русское выражение передаёт движение по поверхности моря и сохраняет θάλασσα как «море».
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: хотел пройти мимо них
  rationale: Формулировка близка к греческому тексту и не решает заранее, обозначает ли она обычное движение мимо учеников или содержит отзвук богоявления.
theological_decisions:
- issue: Смысл слов «хотел пройти мимо них»
  choice: Сохранить буквальную и неоднозначную формулировку в основном тексте.
  alternative: «намеревался обойти их» или явным образом истолковать это как богоявление
  rationale: Греческая фраза допускает прямой пространственный смысл, но может также перекликаться с ветхозаветными рассказами, где Бог «проходит мимо», являя Себя. Сам текст не разъясняет намерение, поэтому напряжение сохраняется, а возможная аллюзия отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Историческое настоящее сохранено. Заглавная буква в местоимении «Он» соответствует принятой русской библейской издательской традиции, не добавляя толкования к содержанию стиха.
