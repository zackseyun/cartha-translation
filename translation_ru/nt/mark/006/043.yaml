lexical_decisions:
- source_word: ἦραν
  choice: собрали
  rationale: В контексте сбора оставшейся еды αἴρω означает собрать; это естественная и точная передача конкретного действия.
- source_word: κλάσματα
  choice: кусков
  rationale: κλάσματα — отломанные куски, в данном контексте прежде всего хлеба. Русское «куски» ясно и не перегружает текст.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: двенадцать полных корзин
  rationale: Передаёт и число корзин, и значение πλήρωμα — их наполненность или полное содержимое; по-русски звучит естественнее буквального «наполнения двенадцати корзин».
- source_word: κόφινος
  choice: корзин
  rationale: Нейтральное «корзина» точно передаёт название ёмкости, не добавляя неуказанных размеров или формы.
- source_word: πληρώματα
  choice: полных
  rationale: В этой конструкции слово указывает на количество, наполняющее корзины; прилагательное «полных» естественно выражает данный смысл.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: а также остатки рыбы
  rationale: ἀπό здесь указывает на источник собранной пищи — от рыб. Слово «остатки» восстанавливается из контекста действия и делает эллиптическую греческую конструкцию понятной по-русски, не утверждая точного количества.
