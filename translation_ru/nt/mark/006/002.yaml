id: MRK.6.2
reference: Mark 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: ru
  text: 'Когда наступила суббота, Он начал учить в синагоге. Многие, слушая Его, изумлялись и говорили: «Откуда у Него всё это? Что это за мудрость, данная Ему, и что за чудеса[a] совершаются Его руками?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «могущественные дела» или «проявления силы». Греческое слово δύναμις во множественном числе может обозначать чудесные деяния или явления силы.
    reason: лексическая альтернатива
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: когда наступила суббота
  rationale: Генитив абсолютный выражает временное обстоятельство; формулировка сохраняет значение наступления субботы и естественно звучит по-русски.
- source_word: ἤρξατο διδάσκειν
  choice: начал учить
  rationale: Передаёт начинательное значение конструкции ἄρχομαι с инфинитивом в естественном повествовательном стиле.
- source_word: συναγωγῇ
  choice: синагоге
  rationale: В данном иудейском контексте имеется в виду место собрания и богослужения; «синагога» — точный и общепонятный эквивалент.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: многие, слушая Его
  rationale: Передаёт как значение «многие», так и одновременность слушания; объект понятен из контекста и выражен для естественности русского текста.
- source_word: ἐξεπλήσσοντο
  choice: изумлялись
  rationale: Сохраняет сильную эмоциональную реакцию и длительный вид несовершенного времени.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Откуда у Него всё это?
  rationale: Вопрос касается источника того, чем обладает и что совершает Иисус. Русская конструкция естественна; контекстуальное «всё» собирательно передаёт ταῦτα.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Что это за мудрость, данная Ему
  rationale: Сохраняет вопросительно-восклицательный характер фразы и пассивное значение «данная», не уточняя, кем она дана.
- source_word: δυνάμεις
  choice: чудеса
  rationale: Во множественном числе в повествовании Марка слово обозначает необыкновенные деяния, являющие силу. «Чудеса» понятно современному читателю; более буквальные смысловые варианты приведены в примечании.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: совершаются Его руками
  rationale: Сохраняет инструментальный образ греческого выражения «через Его руки» и его настоящее, происходящее значение, оставаясь естественным по-русски.
theological_decisions:
- issue: Значение δυνάμεις в данном контексте
  choice: чудеса
  alternative: могущественные дела; проявления силы
  rationale: Контекст соединяет мудрость с необыкновенными деяниями Иисуса. Основной вариант ясно передаёт референт, а примечание сохраняет буквальную связь слова с силой.
- issue: Источник мудрости Иисуса
  choice: сохранена пассивная формулировка «данная Ему»
  alternative: указать, что мудрость дана Богом
  rationale: Греческий текст не называет дающего; перевод не восполняет эту намеренно невыраженную информацию.
- issue: Оттенок τούτῳ
  choice: у Него / Ему
  alternative: у этого человека / этому человеку
  rationale: Указательное местоимение может звучать дистанцированно, однако явная пренебрежительность не обязательна. Нейтральная русская передача сохраняет неоднозначность тона, который раскрывается контекстом.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным повествовательным тоном. Синтаксис вопроса слегка упорядочен для естественности, при этом сохранены его повторность и напряжение. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
