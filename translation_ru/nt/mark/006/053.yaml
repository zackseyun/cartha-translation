  source_fidelity: «Переправившись, они достигли земли Геннисаретской и причалили там» точно передаёт последовательность аористного причастия διαπεράσαντες, прибытие к земле/в область Геннисарета и морской смысл προσωρμίσθησαν. Определение «Геннисаретской» уместно передаёт топоним как название местности, не превращая его в название города.
  naturalness: Фраза грамматически ясна и звучит естественно в современном литературном русском, сохраняя сдержанный библейский повествовательный ритм. «Причалили там» — идиоматичное и точное решение в данном водном контексте.
