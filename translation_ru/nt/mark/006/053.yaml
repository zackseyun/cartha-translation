  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: ru
  text: Переправившись, они достигли земли Геннисаретской[a] и причалили там[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достигли берега у Геннисарета». Буквально: «пришли на землю в Геннисарет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стали там на якорь»; греческий глагол имеет морской смысл — подвести лодку к берегу или месту стоянки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ διαπεράσαντες
  choice: Переправившись
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам. Русское деепричастие естественно передаёт последовательность; союз καί отдельно не воспроизведён, поскольку в русском начале предложения он был бы избыточен.
- source_word: ἐπὶ τὴν γῆν ἦλθον εἰς Γεννησαρὲτ
  choice: они достигли земли Геннисаретской
  rationale: Формулировка сохраняет упоминание γῆ («земля, суша») и одновременно естественно выражает прибытие в область Геннисарета после переправы по воде.
- source_word: Γεννησαρὲτ
  choice: Геннисаретской
  rationale: Традиционная русская передача топонима; согласованное определение при слове «земли» ясно указывает на местность Геннисарет.
- source_word: προσωρμίσθησαν
  choice: причалили там
  rationale: 'Глагол имеет специальный морской смысл: подвести судно к месту стоянки или берегу. «Причалили» естественно и точно передаёт его в данном контексте; «там» добавлено для ясной русской связи с местом прибытия.'
