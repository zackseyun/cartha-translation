  source_fidelity: 'Смысл в целом передан верно: сохранены немедленность действия, сильное побуждение, отправление учеников раньше Иисуса, другой берег, направление к Вифсаиде и личное отпущение собравшихся. Однако «пока Сам не отпустит» вводит будущее время относительно точки повествования; в русском повествовании естественнее прошедшее время. «Народ» менее точно передаёт ὄχλον, который здесь означает собравшуюся толпу.'
