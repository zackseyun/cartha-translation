  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: ru
  text: И сразу же Он заставил Своих учеников сесть в лодку и отправиться впереди Него на другую сторону, в сторону Вифсаиды[a], пока Он Сам не отпустил толпу.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Вифсаиде». Греческий предлог может указывать как на общее направление, так и на намеченную цель движения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пока Он Сам отпускает толпу»; в греческом временном придаточном употреблено настоящее время. В русском повествовании здесь естественно прошедшее время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: сразу же
  rationale: Передаёт характерную для Марка стремительность повествования естественным современным русским выражением.
- source_word: ἠνάγκασεν
  choice: заставил
  rationale: Сохраняет значение сильного побуждения или необходимости; «велел» было бы слабее, а «принудил» могло бы чрезмерно подчёркивать насилие.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: Своих учеников
  rationale: «Ученики» точно передаёт отношения ученика и учителя; возвратное «Своих» естественно связывает их с подлежащим.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: сесть в лодку
  rationale: Естественное современное русское обозначение посадки в лодку.
- source_word: προάγειν
  choice: отправиться вперёд
  rationale: Передаёт, что ученики должны были выступить раньше Иисуса и двигаться впереди Него, не предполагая, что Он последует тем же способом.
- source_word: εἰς τὸ πέραν
  choice: на другой берег
  rationale: Устойчиво и ясно передаёт движение к противоположной стороне озера.
- source_word: πρὸς Βηθσαϊδάν
  choice: к Вифсаиде
  rationale: Сохраняет направительное значение πρός; русский предлог «к» допускает как указание направления, так и понимание Вифсаиды как намеченной цели.
- source_word: ἕως αὐτὸς ἀπολύει τὸν ὄχλον
  choice: пока Сам не отпустит народ
  rationale: Русская конструкция «пока не» естественно передаёт временной предел, а «Сам» сохраняет эмфазу αὐτός. «Народ» в данном контексте звучит естественнее, чем более буквальное «толпа».
