base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: ru
  text: Взяв пять хлебов и две рыбы, Он поднял глаза к небу, произнёс благословение[a], разломил хлебы и подавал их Своим ученикам, чтобы те раздавали людям; и две рыбы Он разделил на всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возблагодарил». Греческий глагол означает «благословил», но в контексте трапезы его смысл может сближаться с благодарением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: взяв
  rationale: Аористное причастие вводит последовательность действий; деепричастие естественно передаёт эту связь по-русски.
- source_word: τοὺς πέντε ἄρτους
  choice: пять хлебов
  rationale: Ἄρτος здесь обозначает отдельные считаемые хлебы, а не хлеб как вещество.
- source_word: τοὺς δύο ἰχθύας
  choice: две рыбы
  rationale: Прямой и естественный эквивалент считаемого множественного числа.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: поднял глаза к небу
  rationale: Естественная русская формулировка, сохраняющая направленный вверх взгляд и образ неба.
- source_word: εὐλόγησεν
  choice: произнёс благословение
  rationale: Сохраняет значение εὐλογέω и не вводит отсутствующий в греческом тексте прямой объект; в контексте трапезы речь идёт о благословении.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: разломил хлебы
  rationale: Передаёт усиленный глагол и сохраняет прямо названный объект.
- source_word: ἐδίδου
  choice: стал подавать
  rationale: Несовершенный вид греческого глагола указывает на продолжавшееся или повторявшееся действие при раздаче.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: Своим ученикам
  rationale: Возвратное притяжательное местоимение естественно передаёт явное αὐτοῦ при подлежащем «Он».
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: чтобы они раздавали людям
  rationale: Передаёт цель действия; παρατίθημι в контексте раздачи пищи означает подавать или ставить перед кем-либо. «Людям» проясняет референт αὐτοῖς из контекста толпы.
- source_word: ἐμέρισεν πᾶσιν
  choice: разделил на всех
  rationale: Сохраняет основное значение «разделить, распределить» и ясно выражает охват всех присутствующих.
theological_decisions:
- issue: Значение εὐλόγησεν в контексте трапезы
  choice: произнёс благословение
  alternative: возблагодарил
  rationale: В исходном тексте стоит εὐλογέω, а не εὐχαριστέω. Выбранная формулировка сохраняет лексическую прозрачность и не решает без необходимости, было ли благословение направлено на Бога или относилось к пище.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Заглавные местоимения, относящиеся к Иисусу, использованы как принятая русская издательская конвенция; синтаксис сделан ясным без устранения смысловой напряжённости глагола εὐλόγησεν.
