source:
  edition: SBLGNT
  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: ru
  text: И, призвав к себе Двенадцать, Он начал посылать их по двое[a] и давал им власть над нечистыми духами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «парами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «силу над нечистыми духами».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: призвав к себе
  rationale: Греческий исторический презенс в связном русском повествовании естественно передан прошедшим временем; средний залог отражён словами «к себе». Деепричастная конструкция устраняет резкий переход от настоящего времени к прошедшему и ясно связывает призвание с последующим посыланием.
- source_word: τοὺς δώδεκα
  choice: Двенадцать
  rationale: Это устойчивое обозначение избранной группы учеников Иисуса; прописная буква передаёт титульный характер названия без добавления отсутствующего в тексте слова «учеников».
- source_word: ἤρξατο αὐτοὺς ἀποστέλλειν
  choice: начал посылать их
  rationale: Передаёт конструкцию ἄρχομαι с инфинитивом и миссионерский смысл ἀποστέλλω, не вводя в текст существительное «апостолы».
- source_word: δύο δύο
  choice: по двое
  rationale: Естественная русская distributive-конструкция точно передаёт повторение «два-два», то есть отправление парами.
- source_word: ἐδίδου
  choice: давал
  rationale: Несовершенный вид русского глагола сохраняет длительный или повторяющийся аспект греческого имперфекта и его одновременность с отправлением.
- source_word: ἐξουσίαν
  choice: власть
  rationale: «Власть» передаёт полномочие, данное Иисусом, лучше, чем одно лишь обозначение способности или силы.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: над нечистыми духами
  rationale: Сохраняется терминология Марка без истолковывающей замены словом «демоны»; родительный после ἐξουσίαν здесь естественно выражает область власти и передан предлогом «над».
theological_decisions:
- issue: Характер данного Двенадцати дара в выражении ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: власть над нечистыми духами
  alternative: силу против нечистых духов
  rationale: «Власть» сохраняет смысл предоставленного Иисусом полномочия и отношений господства, тогда как «сила» может быть понята лишь как внутренняя способность. Формулировка не уточняет сверх сказанного, каким именно образом эта власть осуществлялась.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской практикой. Исторический презенс не воспроизведён буквально, поскольку сочетание «призывает… начал» звучало бы по-русски резко и неестественно; последовательность действий сохранена деепричастием.
