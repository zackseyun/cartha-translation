source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: ru
  text: Иисус вышел оттуда и пришёл в Свой родной город[a]. За Ним последовали Его ученики.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приходит в Свой родной город, и за Ним следуют Его ученики». В греческом здесь употреблено историческое настоящее, придающее повествованию живость.'
    reason: лексическая и стилистическая альтернатива
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Аорист ἐξέρχομαι обозначает уход из прежнего места; «вышел» сохраняет образ движения и естественно звучит по-русски.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Наречие указывает на место отправления; «оттуда» — прямой и естественный эквивалент.
- source_word: ἔρχεται
  choice: пришёл
  rationale: Историческое настоящее передано прошедшим временем ради естественного русского повествования; глагол сохраняет направленность движения к месту назначения.
- source_word: πατρίδα
  choice: родной город
  rationale: В данном контексте πατρίς означает родное место Иисуса, то есть Назарет; «родной город» точнее контекстуально, чем широкие варианты «родина» или «страна».
- source_word: ἀκολουθοῦσιν
  choice: последовали
  rationale: Историческое настоящее передано прошедшим временем; «последовали» сохраняет характерную для Евангелий лексику следования за Иисусом.
- source_word: μαθηταὶ
  choice: ученики
  rationale: Устоявшийся и точный русский эквивалент, передающий и обучение, и личную связь с учителем.
- source_word: αὐτοῦ / αὐτῷ
  choice: Свой / Ним / Его
  rationale: Местоимения естественно соотнесены с явно названным Иисусом; прописные буквы соответствуют принятому благоговейному русскому библейскому употреблению.
theological_decisions:
- issue: Передача исторического настоящего (ἔρχεται, ἀκολουθοῦσιν)
  choice: 'Прошедшее время: «пришёл», «последовали»'
  alternative: 'Сохранить настоящее время: «приходит… следуют»'
  rationale: Это стилистическое, а не вероучительное решение. Прошедшее время естественно для современного русского повествования, а наличие в греческом исторического настоящего отмечено в сноске.
- issue: Явное называние Иисуса вместо начального местоимения αὐτός
  choice: «Иисус»
  alternative: «Он»
  rationale: В изолированном стихе имя обеспечивает ясность референта, не меняя смысла; в греческом местоимение связано с Иисусом из предшествующего контекста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повествование разбито на два предложения для естественного ритма; повторяющиеся греческие союзы καί переданы без механического сохранения каждого «и».
