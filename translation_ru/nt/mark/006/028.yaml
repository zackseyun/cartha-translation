  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: ru
  text: Он принёс его голову на блюде[a] и дал её девочке, а девочка дала её своей матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
