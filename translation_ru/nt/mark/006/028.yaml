    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: принёс
  rationale: Аорист φέρω обозначает физическое перемещение отсечённой головы к месту пира; «принёс» естественно и не уточняет способ действия сверх текста.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: его голову
  rationale: Естественная русская притяжательная конструкция; местоимение по контексту относится к Иоанну Крестителю.
- source_word: ἐπὶ πίνακι
  choice: на блюде
  rationale: πίναξ здесь означает сервировочное блюдо, поднос или тарелку; «на блюде» естественно для контекста пира и сохраняет предметную конкретность.
- source_word: ἔδωκεν
  choice: отдал / отдала
  rationale: Формы «отдал» и «отдала» передают повтор одного и того же греческого глагола δίδωμι с необходимым для русского согласованием по роду; приставочная форма естественна при передаче предмета другому лицу.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: девушке / девушка
  rationale: κοράσιον обозначает девочку или молодую девушку. В данном повествовательном контексте «девушка» звучит современно и нейтрально, не вводя архаического или уничижительного оттенка.
- source_word: τῇ μητρὶ αὐτῆς
  choice: своей матери
  rationale: Возвратное притяжательное местоимение естественно по-русски и однозначно связывает мать с девушкой, являющейся подлежащим предложения.
