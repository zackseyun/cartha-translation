language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: ru
  text: 'И услышал об этом царь Ирод, потому что имя Иисуса стало широко известно. Люди говорили: «Иоанн Креститель[a] воскрешён из мёртвых[b], поэтому в нём действуют эти силы[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Иоанн, крестящий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воскрес из мёртвых». Греческий глагол стоит в пассивной форме: «воскрешён».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «чудотворные силы»; возможно также: «могущественные деяния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: царь Ирод
  rationale: Естественный русский порядок слов для титула и имени; βασιλεύς передано прямо как «царь».
- source_word: ἤκουσεν
  choice: услышал об этом
  rationale: Объект в греческом подразумевается из предшествующего рассказа о служении и известности Иисуса; «об этом» естественно восполняет его без добавления новой мысли.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: потому что имя Иисуса стало широко известно
  rationale: Оборот сообщает, что имя и слава Иисуса получили широкую известность. Имя названо явно, чтобы устранить неестественную для русского языка двусмысленность местоимения после упоминания Ирода.
- source_word: ἔλεγον
  choice: люди говорили
  rationale: Форма множественного числа имеет неопределённый субъект; «люди говорили» естественно передаёт это по-русски.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Иоанн Креститель
  rationale: Это укоренившееся, понятное современному русскому читателю обозначение Иоанна; деятельный смысл причастия поясняется в сноске альтернативой «Иоанн, совершающий крещение».
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: поднят из мёртвых
  rationale: 'Сохранён перфектный пассив греческого глагола: Иоанн не просто «воскрес», а «поднят»; результат действия остаётся в силе.'
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь.
- source_word: ἐνεργοῦσιν
  choice: действуют
  rationale: Настоящее время и активность сил естественно выражаются русским «действуют».
- source_word: αἱ δυνάμεις
  choice: эти силы
  rationale: Сохранено множественное число и не устранена смысловая широта δύναμις, которое может обозначать чудотворные силы или могущественные деяния.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Прямо сохраняет конструкцию с ἐν и представление о силах, действующих в нём; вариант «через него» был бы более истолковывающим.
theological_decisions:
- issue: Пассивная форма ἐγήγερται в контексте воскресения
  choice: поднят из мёртвых
  alternative: воскрес из мёртвых
  rationale: Греческий текст явно использует пассив. Его сохранение не определяет прямо деятеля и не заменяет формулировку более привычным активным выражением.
- issue: Передача Ἰωάννης ὁ βαπτίζων
  choice: Иоанн Креститель
  alternative: Иоанн, совершающий крещение
  rationale: Традиционное русское наименование ясно и естественно, а сноска сохраняет прозрачность исходного причастия без создания неуклюжего титула.
- issue: Смысл αἱ δυνάμεις
  choice: эти силы
  alternative: чудотворные силы / могущественные деяния
  rationale: Основной текст сохраняет неоднозначность между действующими силами и проявляющимися в чудесах могущественными деяниями.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис упрощён для ясности: длинное греческое предложение разделено на повествовательную часть и прямую речь. Все смысловые неоднозначности, существенные для исходного текста, сохранены либо отмечены сносками.'
