  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: ru
  text: Царь глубоко опечалился, но из-за своих клятв и возлежавших за столом[a] не захотел отказать ей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гостей за столом». Буквально греческое выражение обозначает возлежавших во время трапезы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отвергнуть её просьбу»; смысл в том, что он не захотел отступить от обещанного ей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: глубоко опечалился
  rationale: Передаёт наступившее состояние и сильную скорбь естественным современным русским выражением.
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Прямой и традиционный эквивалент βασιλεύς; сохраняет наименование Ирода в повествовании Марка.
- source_word: διὰ τοὺς ὅρκους
  choice: из-за своих клятв
  rationale: Передаёт причинное значение διά с винительным; «своих» ясно указывает на клятвы царя из ближайшего контекста.
- source_word: τοὺς ἀνακειμένους
  choice: возлежавших с ним за столом
  rationale: Сохраняет историческую позу участников трапезы и естественно обозначает присутствовавших гостей; «с ним» подразумевается контекстом совместной трапезы.
- source_word: οὐκ ἠθέλησεν
  choice: не захотел
  rationale: Точно выражает волю, а не невозможность.
- source_word: ἀθετῆσαι αὐτήν
  choice: отказать ей
  rationale: В данном контексте означает не отвергнуть её как личность, а не отклонить обращённую к нему просьбу и не нарушить данное обещание.
theological_decisions:
- issue: Логическая связь скорби царя с последующим решением
  choice: «опечалился, но… не захотел отказать»
  alternative: 'Буквальное нанизывание: «опечалившись, из-за… не захотел отказать»'
  rationale: 'Причастие по контексту имеет уступительный оттенок: несмотря на глубокую скорбь, царь не пожелал отказать. Союз «но» делает этот контраст явным, не меняя смысла.'
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. «Возлежавших» несколько книжное, но исторически точно; более обычный вариант дан в сноске.
