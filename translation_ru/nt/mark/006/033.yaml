lexical_decisions:
- source_word: εἶδον αὐτοὺς ὑπάγοντας
  choice: увидели, как они отплывали
  rationale: В контексте предыдущего стиха они отправились на лодке; «отплывали» естественно передаёт наблюдаемое удаление и связывает рассказ, хотя сам глагол ὑπάγω буквально означает «уходить, отправляться».
- source_word: ἐπέγνωσαν
  choice: узнали их
  rationale: Здесь ἐπιγινώσκω обозначает распознавание людей, а не приобретение нового знания.
- source_word: πολλοί
  choice: многие
  rationale: Субстантивированное прилагательное передано кратко и естественно; далее подразумеваемые люди названы для ясности русского синтаксиса.
- source_word: πεζῇ
  choice: по суше
  rationale: В данном контексте выражение противопоставляет сухопутный путь путешествию на лодке; вариант «пешком» также лексически возможен и отмечен в сноске.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: из всех окрестных городов
  rationale: πόλις может обозначать как город, так и небольшое поселение. «Окрестных» естественно выражает контекстуально подразумеваемые населённые пункты этой местности, не утверждая абсолютного всемирного охвата.
- source_word: συνέδραμον ἐκεῖ
  choice: побежали туда… собрались вместе
  rationale: Переданы и быстрое движение, и совместное стечение людей, заложенные в составном глаголе συντρέχω.
- source_word: προῆλθον αὐτούς
  choice: опередили их
  rationale: Конструкция означает, что толпа прибыла раньше них; краткий русский глагол сохраняет сравнительное значение.
