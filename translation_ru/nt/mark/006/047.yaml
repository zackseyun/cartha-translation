base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: ru
  text: Когда настал вечер, лодка была посреди моря, а Он был один на суше.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на земле»; это выражение противопоставляет Его местонахождение лодке, находившейся в море.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: когда настал вечер
  rationale: Генитив абсолютный выражает временное обстоятельство; эта формулировка естественно и точно передаёт наступление вечера.
- source_word: τὸ πλοῖον
  choice: лодка
  rationale: В галилейском контексте речь идёт о лодке; современное «корабль» создавало бы неверное представление о размере судна.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: посреди моря
  rationale: Сохраняет пространственное значение греческого выражения и звучит естественно в современном литературном русском.
- source_word: τῆς θαλάσσης
  choice: моря
  rationale: Хотя Галилейское море географически является озером, перевод сохраняет исходное θάλασσα и принятую в евангельском повествовании формулировку.
- source_word: αὐτὸς μόνος
  choice: Он один
  rationale: Передаёт акцент местоимения и μόνος на том, что Иисус находился без других людей.
- source_word: ἐπὶ τῆς γῆς
  choice: на суше
  rationale: Естественно передаёт противопоставление местонахождения Иисуса лодке, находившейся в море; «на земле» здесь звучало бы менее ясно.
