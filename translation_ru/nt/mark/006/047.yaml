translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Он» написано с прописной буквы как традиционное уважительное обозначение Иисуса; добавлен глагол «оставался» для естественной русской связи, не изменяющей смысла греческого ἦν.
