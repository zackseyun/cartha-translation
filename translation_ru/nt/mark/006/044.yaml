lexical_decisions:
- source_word: ἦσαν
  choice: было
  rationale: Имперфект εἰμί здесь служит простой связкой при указании численности; «было» прямо и естественно передаёт эту функцию, не добавляя значения «насчитывалось».
- source_word: οἱ φαγόντες
  choice: тех же, кто ел
  rationale: Субстантивированное аористное причастие обозначает группу через совершённое действие. Русская конструкция «тех, кто ел» естественна и не навязывает не выраженного явно предпрошедшего времени.
- source_word: τοὺς ἄρτους
  choice: эти хлебы
  rationale: Множественное число указывает на конкретные хлебы, розданные в этом эпизоде. Указательное «эти» естественно связывает фразу с предшествующим рассказом, а «хлебы» сохраняет конкретность и число греческого выражения.
- source_word: πεντακισχίλιοι
  choice: пять тысяч
  rationale: Прямое соответствие греческому количественному числительному.
- source_word: ἄνδρες
  choice: мужчин
  rationale: ἀνήρ здесь обозначает именно мужчин, а не людей вообще; русское «мужчин» сохраняет гендерную специфику исходного текста.
theological_decisions:
- issue: Гендерно специфичное обозначение при подсчёте
  choice: Передать ἄνδρες словом «мужчин» в основном тексте.
  alternative: людей
  rationale: В греческом употреблено ἀνήρ, а не общее обозначение людей. Перевод сохраняет эту специфику и не превращает число в явно совокупное число всех присутствовавших.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза с достоинством и ясностью. Частица «же» передаёт связность καί с итогом предшествующего рассказа. Единственная сноска поясняет смысловую значимость гендерно специфичного слова; возможное значение ἄρτοι как собирательного «хлеб» отражено в выборе конкретного множественного числа без отдельной сноски.
