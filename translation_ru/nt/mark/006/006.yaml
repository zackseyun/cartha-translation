    text: 'Или: «ходил по селениям вокруг»; возможно также: «обходил селения по кругу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: удивлялся
  rationale: Имперфект передаёт продолженное состояние или реакцию в прошлом. «Удивлялся» естественно и точно выражает значение θαυμάζω, не ослабляя повествовательной силы текста.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: их неверию
  rationale: διά с винительным обозначает причину, а ἀπιστία здесь указывает на неверие, а не просто на слабость доверия. Русское управление глагола «удивляться» дательным падежом естественно передаёт причинную связь.
- source_word: περιῆγεν
  choice: обходил
  rationale: Имперфект περιάγω описывает продолжавшееся передвижение из места в место. «Обходил» кратко передаёт странствующий характер действия.
- source_word: τὰς κώμας
  choice: селения
  rationale: κώμη означает небольшое сельское поселение. «Селения» — ясное и уместное в литературном библейском повествовании соответствие.
- source_word: κύκλῳ
  choice: окрестные
  rationale: Наречие указывает на окружающую местность или движение по кругу. В сочетании «обходил окрестные селения» смысл естественно выражен по-русски, хотя возможен и акцент на обходе селений по кругу.
- source_word: διδάσκων
  choice: и учил
  rationale: Причастие настоящего времени обозначает действие, происходившее одновременно с передвижением. Сочинительная конструкция звучит естественнее по-русски и сохраняет одновременный, продолженный характер служения.
theological_decisions:
- issue: Реакция Иисуса на неверие и возможность ошибочно устранить богословское напряжение
  choice: И Он удивлялся их неверию.
  alternative: И Он дивился их неверию.
  rationale: Перевод прямо сохраняет утверждение текста об удивлении Иисуса, не добавляя объяснений о природе или пределах этого удивления и не сглаживая заложенное в повествовании богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Местоимение «Он» пишется с прописной буквы как уважительное обозначение Иисуса. Синтаксис сделан естественным для широкого круга читателей; неоднозначность κύκλῳ отражена в сноске.
