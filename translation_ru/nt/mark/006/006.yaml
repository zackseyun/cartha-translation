  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: ru
  text: И Он удивлялся их неверию[a]. Он ходил по окрестным селениям и учил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дивился их неверию».'
    reason: lexical_alternative
