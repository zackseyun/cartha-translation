  to: Выйдя на берег, он увидел большую толпу и проникся состраданием к ним[a], потому что они были как овцы без пастуха[b]. И он начал учить их многому.
  rationale: Правка точнее передаёт значение ἐσπλαγχνίσθη посредством «проникся состраданием», улучшает естественность порядка слов в заключительной фразе и устраняет из пояснительной сноски необязательную интерпретирующую характеристику. Образ и смысловые неоднозначности исходного текста сохранены.
