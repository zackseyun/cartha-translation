  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: ru
  text: Выйдя на берег, он увидел большую толпу и проникся состраданием к ним[a], потому что они были как овцы без пастуха[b]. И он начал учить их многому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сжалился над ними»; букв. «исполнился сострадания к ним».'
    reason: lexical_alternative
  - marker: b
    text: Образ овец без пастуха перекликается с библейским описанием народа, лишённого руководства; ср. Чис. 27:17; 3 Цар. 22:17; Иез. 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: выйдя на берег
  rationale: Буквально причастие означает «выйдя». В контексте переправы на лодке (Мк. 6:32–33) речь естественно понимается как выход из лодки на берег.
- source_word: πολὺν ὄχλον
  choice: большую толпу
  rationale: Передаёт обычное значение ὄχλος («толпа») и количественную силу πολύν без усиления до «огромной».
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: сжалился над людьми
  rationale: Глагол обозначает глубокое, сердечное сострадание. Русское «сжалился над» естественно передаёт и чувство, и направленность действия; слово «людьми» устраняет стилистически тяжёлое повторение местоимений.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: как овцы без пастуха
  rationale: Сохраняет прозрачный пастырский образ и не раскрывает его богословский смысл непосредственно в тексте.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: начал многому их учить
  rationale: Сохраняет начинательное значение конструкции ἤρξατο διδάσκειν и передаёт πολλά как множество предметов учения, а не только длительность речи.
theological_decisions:
- issue: Образ овец без пастуха
  choice: Сохранить метафору без толкования в основном тексте.
  alternative: Развернуть смысл как «люди, лишённые духовного руководства».
  rationale: Образ перекликается с ветхозаветным языком о народе и его руководителях, однако перевод не должен сужать или заранее разрешать его богословские оттенки.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным синтаксисом. Местоимение «он» написано со строчной буквы по общим нормам современной орфографии. Повтор союза «И» сохраняет повествовательный ритм греческого текста.
