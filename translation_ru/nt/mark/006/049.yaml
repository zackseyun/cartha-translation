  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: ru
  text: Но они, увидев, что Он идёт по морю, подумали, что это призрак[a], и закричали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привидение» или «фантом». Греческое слово φάντασμα означает призрачное явление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Но … они
  rationale: δέ передаёт лёгкое противопоставление и переводит повествование к реакции учеников; οἱ указывает на уже названную группу.
- source_word: ἰδόντες αὐτὸν
  choice: увидев, что Он
  rationale: Аористное причастие имеет временное значение; конструкция «увидев, что Он…» естественно связывает восприятие учеников с увиденным действием.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: идёт по морю
  rationale: ἐπί с родительным в данном контексте означает движение по поверхности воды. «Идёт по морю» звучит естественно и сохраняет прямой смысл повествования.
- source_word: ἔδοξαν
  choice: подумали
  rationale: δοκέω здесь означает ошибочно решить или счесть на основании увиденного; нейтральное «подумали» не усиливает оттенок сверх текста.
- source_word: ὅτι φάντασμά ἐστιν
  choice: что это призрак
  rationale: φάντασμα обозначает призрачное явление, привидение или фантом; «призрак» ясно и естественно передаёт значение без утверждения о природе увиденного.
- source_word: καὶ ἀνέκραξαν
  choice: и закричали
  rationale: ἀνακράζω обозначает громкий, внезапный крик; «закричали» передаёт интенсивность и естественно звучит по-русски.
theological_decisions:
- issue: Характер движения Иисуса по воде
  choice: идёт по морю
  alternative: идёт у моря / вдоль моря
  rationale: В контексте рассказа ἐπὶ τῆς θαλάσσης означает движение по поверхности моря, а не по берегу; перевод сохраняет чудесный характер события, не добавляя пояснений.
- issue: Природа того, что, по мнению учеников, они увидели
  choice: призрак
  alternative: привидение / видение / фантом
  rationale: Текст сообщает ошибочное восприятие учеников, а не даёт богословского утверждения о существовании или природе духов; «призрак» сохраняет эту дистанцию.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Заглавная буква в местоимении «Он» употреблена как традиционная русская графическая норма для указания на Иисуса, не меняя смысла оригинала.
