base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: ru
  text: 'Иисус говорил им: «Пророк не бывает без почёта, разве что в родных местах[a], среди своих родственников[b] и среди своих домашних[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на своей родине»; греческое слово обозначает родную местность, место происхождения человека — здесь речь идёт о Назарете.'
    reason: lexical_alternative
  - marker: b
    text: То есть среди людей своего рода, своих родичей.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в своём доме». Греческое слово может обозначать как дом, так и живущих в нём домочадцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт развёртывающееся в прошлом высказывание; русское «говорил» естественно сохраняет этот видовой оттенок.
- source_word: προφήτης
  choice: пророк
  rationale: Обычный и точный русский эквивалент, уместный в данном изречении.
- source_word: ἄτιμος
  choice: без почёта
  rationale: Сохраняет выраженную в греческом тему чести и отрицательную конструкцию, не усиливая её до значений «презираем» или «обесчещен».
- source_word: εἰ μὴ
  choice: кроме как
  rationale: После отрицания оборот вводит исключение, а не условие.
- source_word: πατρίδι
  choice: в родных местах
  rationale: πατρίς обозначает место происхождения человека. Выражение естественно для современного русского языка и не сужает значение строго до города и не расширяет его обязательно до страны.
- source_word: συγγενεῦσιν
  choice: среди своих родственников
  rationale: Термин обозначает людей, связанных родством; «родственники» — ясный современный эквивалент.
- source_word: οἰκίᾳ
  choice: среди своих домашних
  rationale: В данном ряду οἰκία естественно понимать как домочадцев, то есть ближайший домашний круг. Такое выражение отличает их от более широкого круга родственников, сохраняя возможность буквального значения «дом» в примечании.
- source_word: καὶ ... καὶ ... καὶ
  choice: и ... среди ... и среди
  rationale: Повторяющееся соединение сохраняет накопительный ряд всё более близких кругов окружения.
theological_decisions:
- issue: Отнесение общего изречения о пророке к Иисусу
  choice: Сохранить форму общего изречения без поясняющего добавления о мессианском статусе Иисуса.
  alternative: Прямо перефразировать слова как утверждение о непризнании Иисуса-Мессии.
  rationale: Контекст относит изречение к Иисусу, однако сам стих формулирует общее высказывание о пророке. Перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого, афористичного изречения. Оборот «не бывает без почёта нигде, кроме как» сохраняет греческую отрицательную конструкцию; «родные места» и «домашние» понятны широкому читателю без конфессионально окрашенной терминологии.
