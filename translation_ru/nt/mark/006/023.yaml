base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: ru
  text: 'И поклялся ей: «Чего ни попросишь у меня, дам тебе — до половины моего царства[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «до половины моего царства» — традиционная гиперболическая формула в речи правителя.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: поклялся
  rationale: Аорист ὀμνύω обозначает принесение клятвы; «поклялся» естественно и точно передаёт торжественную силу обещания.
- source_word: αὐτῇ
  choice: ей
  rationale: Дательный падеж женского рода указывает на девушку, к которой обращается Ирод.
- source_word: Ὅ τι ἐάν
  choice: чего ни
  rationale: Неопределённо-относительная конструкция выражает открытое условие — любой возможный предмет просьбы; русское «чего ни попросишь» звучит естественно и сохраняет широту обещания.
- source_word: με αἰτήσῃς
  choice: попросишь у меня
  rationale: αἰτέω означает «просить»; конструкция с με естественно передаётся по-русски как «попросишь у меня».
- source_word: δώσω σοι
  choice: дам тебе
  rationale: Будущее время δίδωμι с дательным σοι прямо выражает обещание дать просимое.
- source_word: ἕως ἡμίσους
  choice: вплоть до половины
  rationale: ἕως здесь обозначает предел или меру, а не время; «вплоть до» сохраняет значение предельного объёма предложения.
- source_word: τῆς βασιλείας μου
  choice: моего царства
  rationale: В придворной формуле βασιλεία естественно обозначает царство как владение; «царство» сохраняет конкретный и традиционный смысл без богословской специализации.
theological_decisions:
- issue: Значение βασιλεία в речи Ирода
  choice: царство
  alternative: правление; царская власть
  rationale: Хотя βασιλεία может обозначать правление или царскую власть, в контексте гиперболического царского обещания речь естественнее воспринимается как предложение части владений.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Инверсия «Чего ни попросишь у меня» передаёт широту обещания без архаической тяжеловесности; тире подчёркивает кульминационный предел клятвы.
