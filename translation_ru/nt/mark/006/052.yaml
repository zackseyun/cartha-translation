lexical_decisions:
- source_word: συνῆκαν ἐπὶ τοῖς ἄρτοις
  choice: не поняли значения хлебов
  rationale: Сочетание передаёт не просто непонимание факта умножения хлебов, а неспособность постичь его значение; явное «значения» делает идиоматический смысл ἐπί с дательным естественным по-русски.
- source_word: ἄρτοις
  choice: хлебов
  rationale: Множественное число указывает на конкретные хлебы из предшествующего рассказа о насыщении множества людей.
- source_word: αὐτῶν ἡ καρδία
  choice: их сердца
  rationale: Хотя в греческом стоит собирательное единственное число «их сердце», русское множественное число естественнее при обозначении внутреннего состояния нескольких учеников и сохраняет смысл.
- source_word: πεπωρωμένη
  choice: были ожесточены
  rationale: Русское «ожесточены» сохраняет метафору внутренней твёрдости и духовной невосприимчивости, не уточняя причину этого состояния.
- source_word: ἀλλ’ ἦν
  choice: ': … были'
  rationale: 'Двоеточие естественно выражает пояснительно-противительный смысл: непонимание объясняется состоянием их сердец. Альтернативная передача «но» отмечена в сноске.'
theological_decisions:
- issue: Характер состояния учеников в πεπωρωμένη
  choice: их сердца были ожесточены
  alternative: их сердца огрубели / были нечувствительны
  rationale: Перевод сохраняет духовно-нравственную напряжённость образа, но не указывает, кем или почему сердца были ожесточены, поскольку греческий текст этого не уточняет.
- issue: Связь чуда с непониманием учеников
  choice: не поняли значения хлебов
  alternative: не поняли, что произошло с хлебами
  rationale: Фраза указывает на непостижение смысла знамения, однако перевод не конкретизирует его христологическое или иное богословское содержание сверх сказанного Марком.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. «Хлебы» сохраняет связь с конкретными хлебами в рассказе, а не обозначает хлеб вообще. Собирательное единственное число оригинала вынесено в сноску.
