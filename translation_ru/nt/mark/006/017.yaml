source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: ru
  text: Ведь сам Ирод послал схватить Иоанна[a], связал его и заключил в темницу из-за Иродиады, жены своего брата Филиппа, на которой он женился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послав, схватил Иоанна». То есть Ирод распорядился схватить его через посланных им людей.'
    reason: Уточнение синтаксиса аористного причастия ἀποστείλας и личной ответственности Ирода без предположения, что он сам физически совершил арест.
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Ведь сам Ирод
  rationale: «Ведь» естественно передаёт пояснительное γὰρ, а «сам» сохраняет эмфатическую силу Αὐτός при имени Ирод.
- source_word: ἀποστείλας ἐκράτησεν
  choice: послал схватить
  rationale: Аористное причастие обозначает действие, предшествующее захвату и инициированное Иродом. Русская конструкция ясно передаёт действие через посланных людей, не создавая впечатления, будто Ирод схватил Иоанна лично.
- source_word: τὸν Ἰωάννην
  choice: Иоанна
  rationale: Прямое соответствие греческому имени в винительном падеже.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: связал его и заключил в темницу
  rationale: Буквальное «связал его в темнице» в современном русском может означать лишь связывание внутри тюрьмы. Выбранная формулировка естественно выражает заключение под стражу, сохраняя конкретное δέω «связал» и смысл φυλακή как места заключения.
- source_word: διὰ Ἡρῳδιάδα
  choice: из-за Иродиады
  rationale: διά с винительным падежом обозначает причину; «из-за» кратко и естественно передаёт причинную связь.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: жены своего брата Филиппа
  rationale: γυνή здесь означает «жена». Русский порядок слов однозначно показывает, что Филипп — брат Ирода, а Иродиада — жена Филиппа.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: на которой он женился
  rationale: Передаёт причинное пояснение без тяжёлого повтора «потому что» и сохраняет совершившийся ранее факт брака. Местоимение «он» в контексте относится к Ироду.
theological_decisions:
- issue: Историко-нравственная характеристика брака Ирода
  choice: Стих описывает причину заключения Иоанна без добавленной нравственной оценки.
  alternative: Прямо назвать этот брак незаконным в основном тексте.
  rationale: В данном предложении незаконность брака прямо не сформулирована; она раскрывается последующим контекстом. Перевод не предваряет авторское объяснение.
- issue: Личная ответственность Ирода и участие исполнителей
  choice: «Сам Ирод» сохраняет его ответственность, а «послал схватить» указывает на действие через исполнителей.
  alternative: «Ирод лично схватил Иоанна».
  rationale: Сочетание Αὐτός и ἀποστείλας подчёркивает инициативу и ответственность Ирода, но не требует понимать захват как совершённый им собственноручно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Темница» несколько возвышенно, но общеупотребительно и соответствует повествовательному регистру; синтаксис сделан ясным для обычного читателя.
