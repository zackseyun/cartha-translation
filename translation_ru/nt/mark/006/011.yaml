source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: ru
  text: И если в каком-нибудь месте вас не примут и не станут слушать, то, уходя оттуда, стряхните пыль из-под ног — как свидетельство для них.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельством против них». Буквально греческое выражение можно передать как «свидетельством для них», но в данном контексте оно, вероятно, имеет обвинительный смысл.'
    reason: alternative_reading
  - marker: b
    text: Стряхнуть пыль с ног означало символически отмежеваться от тех, кто отверг посланников, и предостеречь их.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: какое-либо место
  rationale: Неопределённо-обобщающая конструкция сохранена вместе с выраженным существительным τόπος; по-русски она передаёт значение любого возможного места.
- source_word: δέξηται
  choice: не примет
  rationale: Глагол обозначает принятие посланников, включая подразумеваемое гостеприимство; «примет» сохраняет широту греческого слова без излишнего уточнения.
- source_word: ἀκούσωσιν ὑμῶν
  choice: не станет вас слушать
  rationale: Передаёт не простое физическое слышание, а готовность выслушать посланников, не усиливая смысл до «не послушается».
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: уходя оттуда
  rationale: Причастный оборот естественно передаёт сопутствующее по времени действие и последовательность событий.
- source_word: ἐκτινάξατε
  choice: стряхните
  rationale: Точный и естественный русский глагол для удаления пыли резким движением.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: пыль из-под ваших ног
  rationale: Естественно и близко к греческому выражению передаёт пыль, находящуюся под ногами.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: это будет свидетельством для них
  rationale: Формулировка сохраняет направленность αὐτοῖς («для/им») и не устраняет неоднозначность относительно того, является ли свидетельство обвинительным; контекстуальное понимание «против них» отмечено в сноске.
theological_decisions:
- issue: Направленность свидетельства в εἰς μαρτύριον αὐτοῖς
  choice: свидетельством для них
  alternative: свидетельством против них
  rationale: Греческое αὐτοῖς буквально не выражает предлога «против», хотя контекст отвержения придаёт жесту предостерегающий и, вероятно, обвинительный смысл. Основной текст сохраняет формальную неоднозначность, а вероятная контекстуальная сила указана в сноске.
- issue: Смысл стряхивания пыли
  choice: символический знак отделения и предостережения при отвержении посланников
  alternative: исключительно прямое провозглашение суда
  rationale: Контекст поддерживает неблагоприятное свидетельство, однако сам стих не раскрывает весь смысл жеста; поэтому перевод не сводит его только к одной богословской формуле.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет условную структуру и последовательность греческого текста. Формулировка «какое-либо место» несколько формальнее разговорной, но понятна обычному читателю и сохраняет явное τόπος.
