review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: условие неприятия/нежелания слушать, уход и символическое стряхивание пыли сохранены. «Свидетельство для них» удачно удерживает формальную направленность αὐτοῖς и не подменяет её однозначным «против них». Однако «какое-либо место не примет вас и не станет вас слушать» стилистически и синтаксически неестественно: место может «принять», но «слушать» должны его жители; кроме того, греческая смена единственного числа (τόπος) на множественное (ἀκούσωσιν) лучше воспроизводится русской безлично-пассивной конструкцией.'
  naturalness: Нужна безопасная стилистическая правка. «И если в каком-нибудь месте вас не примут и не станут слушать» звучит естественно в современном литературном русском, сохраняет неопределённо-обобщённое значение конструкции ὃς ἂν τόπος и не приписывает действию самому месту. «Как свидетельство для них» точнее и легче, чем пояснительное «— это будет свидетельством для них».
  terminology: «Примут», «слушать», «стряхните пыль» и «свидетельство» точны по регистру и смыслу. Сноска a корректно фиксирует контекстуально возможное «против них», не делая его основным текстом. Культурная сноска b уместна и не навязывает доктринального истолкования.
  issues:
  - severity: medium
    issue: Неестественное олицетворение «какое-либо место ... не станет вас слушать».
    rationale: В греческом τόπος обозначает место как пункт назначения, тогда как ἀκούσωσιν относится к людям этого места. Русская формулировка с единым подлежащим «место» создаёт семантический сбой. Безличная конструкция сохраняет смысл и устраняет его.
  - severity: low
    issue: «То» и тире с «это будет» избыточно эксплицируют синтаксическую связь.
    rationale: Греческое εἰς μαρτύριον естественно передать русским «как свидетельство для них»; это компактнее и ближе к исходной конструкции.
