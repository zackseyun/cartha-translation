lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: вошёл к ним в лодку
  rationale: Глагол ἀναβαίνω буквально означает движение вверх, но в сочетании с εἰς τὸ πλοῖον естественно описывает вход в лодку. Оборот «к ним» сохраняет значение πρὸς αὐτούς и показывает, что Иисус присоединился к ученикам.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: ветер утих
  rationale: κοπάζω о ветре означает «стихать, утихать, прекращаться». «Утих» — естественное и точное русское выражение без лишнего уточнения степени.
- source_word: λίαν ἐκ περισσοῦ
  choice: сверх всякой меры
  rationale: Сочетание двух усилительных элементов подчёркивает чрезвычайную силу реакции. Русский оборот сохраняет необычную выразительность греческого текста лучше, чем одно наречие.
- source_word: ἐν ἑαυτοῖς
  choice: про себя
  rationale: Оборот передаёт внутренний характер реакции учеников и звучит естественнее буквального «в самих себе».
- source_word: ἐξίσταντο
  choice: изумлялись
  rationale: Средняя/непереходная форма ἐξίστημι здесь обозначает сильное изумление. Выбор сохраняет значение, не вводя в основной текст потенциально двусмысленную русскую идиому «были вне себя».
theological_decisions:
- issue: Сила реакции учеников на власть Иисуса над ветром
  choice: «изумлялись сверх всякой меры»
  alternative: «были вне себя от изумления»
  rationale: Основной текст передаёт предельную интенсивность реакции, но не добавляет объяснения её богословской причины сверх того, что сообщает повествование. Более резкий оттенок глагола отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм исходного текста сохранён, а необычная интенсивность λίαν ἐκ περισσοῦ передана выразительным, но понятным оборотом.
