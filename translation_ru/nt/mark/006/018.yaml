source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: ru
  text: 'Ведь Иоанн говорил Ироду: «Тебе не разрешено[a] жить с женой твоего брата».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тебе нельзя»; или: «Тебе не позволено».'
    reason: Лексические варианты для Οὐκ ἔξεστίν σοι. «Не разрешено» в основном тексте сохраняет оттенок дозволенности и правовой запрет; «нельзя» передаёт более краткую, но несколько менее юридически окрашенную формулировку.
lexical_decisions:
- source_word: ἔλεγεν
  choice: не раз говорил
  rationale: Имперфект передаёт продолжавшееся или повторявшееся в прошлом высказывание; «не раз говорил» естественно выражает повторность по-русски.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит объяснение предшествующих событий; «ведь» сохраняет пояснительную связь и естественно звучит в русском повествовании.
- source_word: Ἡρῴδῃ
  choice: Ироду
  rationale: Традиционная русская форма имени в дательном падеже соответствует греческому Ἡρῴδῃ.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Тебе не позволено
  rationale: Оборот выражает отсутствие дозволения или законного права и сохраняет нравственно-правовую силу упрёка, не добавляя прямой ссылки на Моисеев закон.
- source_word: ἔχειν
  choice: иметь
  rationale: Прямое значение инфинитива уместно и понятно в контексте брачного союза.
- source_word: γυναῖκα
  choice: жену
  rationale: В сочетании с «твоего брата» слово γυνή однозначно обозначает жену, а не женщину вообще.
- source_word: τοῦ ἀδελφοῦ σου
  choice: твоего брата
  rationale: Естественная русская передача греческой родительной конструкции, сохраняющая ключевое родственное отношение.
theological_decisions:
- issue: Характер обличения Иоанна
  choice: «Тебе не позволено» как нравственно-правовой запрет
  alternative: «Тебе нельзя» или более общее «Так поступать неправильно»
  rationale: ἔξεστιν относится к дозволенному или законному. Выбранная формулировка сохраняет правовой оттенок и вероятный фон предписаний Торы, но не вводит отсутствующую в стихе прямую ссылку на закон.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной и доступной формулировкой. «Не раз говорил» передаёт повторность имперфекта без тяжеловесной конструкции; «не позволено» сохраняет серьёзный нравственно-правовой тон пророческого обличения.
