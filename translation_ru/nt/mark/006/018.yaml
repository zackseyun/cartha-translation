  source_fidelity: 'Основной смысл передан верно: γάρ отражено словом «ведь», Ἡρῴδῃ — «Ироду», а запретительный нравственно-правовой характер οὐκ ἔξεστίν σοι сохранён. Однако «не раз говорил» конкретизирует имперфект как неоднократность, тогда как греческая форма допускает также продолжающееся действие; простое «говорил» лучше сохраняет эту видовую широту. В брачном контексте «жить с женой ...» естественнее по-русски, чем «иметь жену ...», не меняя смысла ἔχειν.'
  naturalness: «Тебе не позволено иметь жену твоего брата» понятно, но для современного литературного русского несколько тяжеловесно и может звучать как обозначение владения или самого брачного статуса. «Тебе не разрешено жить с женой твоего брата» более естественно и ясно выражает оспариваемые отношения.
  terminology: «Иоанн», «Ирод», «жена», «брат» употреблены нормативно. «Не разрешено» сохраняет требуемый оттенок дозволенности/законности, не добавляя явной ссылки на конкретный закон.
