  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: ru
  text: Ведь Ирод боялся Иоанна, зная, что он — человек праведный и святой, и оберегал его. Когда он слушал Иоанна, то сильно недоумевал[a], но всё же слушал его охотно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «многое делал» — вместо «сильно недоумевал».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: боялся
  rationale: Передаёт прямое и продолжительное отношение Ирода к Иоанну; контекст допускает, что этот страх сочетался с почтением, но не сводит значение к более мягкому «уважал».
- source_word: εἰδὼς
  choice: зная
  rationale: Сохраняет форму причастия и подразумеваемую причинную связь со страхом и защитой Иоанна.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: человек праведный и святой
  rationale: Естественно и точно передаёт нравственную праведность (δίκαιον) и святость (ἅγιον), не добавляя конфессиональных оттенков.
- source_word: συνετήρει
  choice: оберегал его
  rationale: В данном контексте глагол выражает сохранение и защиту Иоанна от вреда; «оберегал» естественно передаёт этот оттенок по-русски.
- source_word: ἀκούσας αὐτοῦ
  choice: слушая Иоанна
  rationale: Передаёт временное значение причастия и идиоматическое употребление ἀκούω с родительным; повтор имени устраняет возможную для русского текста неясность местоимений.
- source_word: πολλὰ ἠπόρει
  choice: приходил в большое недоумение
  rationale: 'Следует чтению SBLGNT ἠπόρει: Ирод оказывался в растерянности или недоумении; πολλὰ усиливает степень состояния.'
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: но всё же слушал его охотно
  rationale: «Охотно» передаёт удовольствие или расположенность, а «но всё же» естественно выявляет смысловой контраст с сильным недоумением, не устраняя напряжения текста.
theological_decisions:
- issue: Разночтение после упоминания о том, что Ирод слушал Иоанна
  choice: 'Основной текст следует SBLGNT: «приходил в большое недоумение» (ἠπόρει).'
  alternative: «многое делал» (ἐποίει).
  rationale: Критический текст описывает внутреннюю растерянность Ирода и сохраняет напряжение между его недоумением и охотным слушанием. Существенно отличающееся рукописное чтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировки доступны обычному читателю; сохранён парадокс поведения Ирода и не внесены конфессиональные толкования.
