revisions:
- from: Ведь Ирод боялся Иоанна, зная, что тот человек праведный и святой, и оберегал его. Слушая Иоанна, он приходил в большое недоумение[a], но всё же слушал его охотно.
  to: Ведь Ирод боялся Иоанна, зная, что он — человек праведный и святой, и оберегал его. Когда он слушал Иоанна, то сильно недоумевал[a], но всё же слушал его охотно.
  rationale: Исправлены лишь стилистически неровные места и уточнена временная связка второго предложения. Сохранены страх Ирода, праведность и святость Иоанна, защитное действие Ирода, недоумение при слушании и парадоксальное охотное слушание. Разночтение сохранено в сноске без предпочтения иной рукописной традиции.
