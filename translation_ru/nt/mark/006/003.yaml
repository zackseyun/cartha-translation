  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: ru
  text: «Не плотник ли он, сын Марии, брат Иакова, Иосии, Иуды и Симона?[a] И не здесь ли, среди нас, его сёстры?» Он стал для них камнем преткновения.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «брат» и «сёстры» обычно обозначают братьев и сестёр, но здесь их также понимают как более дальних родственников или как сводных братьев и сестёр.
    reason: alternative_reading
  - marker: b
    text: 'Или: «они соблазнялись из-за него»; буквально выражение передаёт образ преткновения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: плотник
  rationale: Традиционное и наиболее вероятное в данном контексте обозначение ремесленника, работающего прежде всего с деревом; более широкие варианты «мастер» или «строитель» здесь менее конкретны.
- source_word: υἱὸς τῆς Μαρίας
  choice: сын Марии
  rationale: Прямо сохраняет необычное именование Иисуса по матери в речи земляков, не объясняя возможный социальный оттенок.
- source_word: ἀδελφὸς / ἀδελφαί
  choice: брат / сёстры
  rationale: Это обычные значения греческих слов. Возможность более широкого родственного значения или понимания как сводных братьев и сестёр отмечена в сноске без разрешения богословского спора в основном тексте.
- source_word: Ἰωσῆτος
  choice: Иосии
  rationale: Передаёт особую греческую форму имени Ἰωσῆτος и не уравнивает её без необходимости с формой «Иосиф».
- source_word: ὧδε πρὸς ἡμᾶς
  choice: здесь, среди нас
  rationale: Естественно по-русски выражает местное присутствие и социальную близость к говорящим.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: они отвергали его
  rationale: В данном повествовательном контексте выражение обозначает не буквальное преткновение и не просто эмоциональную обиду, а реакцию неприятия Иисуса. Имперфект передан несовершенным видом.
theological_decisions:
- issue: Кем приходятся Иисусу названные братья и сёстры
  choice: В основном тексте употреблены обычные слова «брат» и «сёстры» без уточнения характера родства.
  alternative: Родственники либо сводные братья и сёстры.
  rationale: Греческие слова обычно обозначают родных братьев и сестёр, однако сам стих не разрешает исторический спор о точной степени родства; сноска сохраняет альтернативные традиционные понимания.
- issue: Социальный оттенок выражения «сын Марии»
  choice: Выражение переведено прямо, без пояснения предполагаемой насмешки или уничижения.
  alternative: Передать или пояснить его как пренебрежительное обозначение.
  rationale: Контекст допускает недоброжелательный оттенок, но греческий текст не выражает его явно.
- issue: Смысл реакции ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: «они отвергали его»
  alternative: «они соблазнялись из-за него» / «он стал для них камнем преткновения» / «они возмущались им»
  rationale: Выбранный вариант ясно передаёт контекстуальное неприятие, сохраняя продолжительный характер реакции; сноска указывает более буквальный образ преткновения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Риторические вопросы сохранены. Имена переданы в привычных русских библейских формах, при этом Ἰωσῆτος различено с «Иосифом» как «Иосия».
