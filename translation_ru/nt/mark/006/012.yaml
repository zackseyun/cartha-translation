lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Обычный повествовательный союз, связывающий исполнение поручения с предшествующим рассказом без добавления особого временного оттенка.
- source_word: ἐξελθόντες
  choice: пошли
  rationale: Аористное причастие обозначает, что ученики отправились исполнять поручение; личная форма естественна в современном русском повествовании.
- source_word: ἐκήρυξαν
  choice: возвещали
  rationale: Глагол κηρύσσω означает публично провозглашать или объявлять; «возвещали» сохраняет этот смысл и достойный библейский регистр, не сводя действие к позднейшему церковному понятию проповеди.
- source_word: ἵνα
  choice: чтобы
  rationale: Вводит содержание или направленность возвещения; русский союз «чтобы» естественно сохраняет эту смысловую широту.
- source_word: μετανοῶσιν
  choice: покаялись
  rationale: В контексте Евангелия μετανοέω означает покаяние — перемену внутренней направленности и жизни перед Богом; «покаялись» передаёт это точнее и естественнее, чем буквальное «изменили мышление».
theological_decisions:
- issue: Следует ли явно обозначить подразумеваемое подлежащее при μετανοῶσιν
  choice: чтобы люди покаялись
  alternative: чтобы они покаялись
  rationale: В греческом подлежащее глагола подразумевается и относится к слушателям возвещения. Слово «люди» устраняет возможное впечатление, будто покаяться должны сами ученики, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Сохранена смысловая широта конструкции ἵνα и богословская насыщенность μετανοέω без искусственной кальки.
