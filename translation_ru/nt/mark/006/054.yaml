  source_fidelity: 'Текст верно передаёт генитив абсолютный ἐξελθόντων αὐτῶν временным придаточным («Когда они вышли»), πλοῖον как «лодка», εὐθύς как «сразу же» и ἐπιγνόντες αὐτόν как «узнали его». Слово «люди» обоснованно раскрывает невыраженное в греческом подлежащее номинативного множественного причастия: им не могут быть «они» из генитива αὐτῶν, а ближайший контекст (ст. 55) указывает на местных жителей.'
