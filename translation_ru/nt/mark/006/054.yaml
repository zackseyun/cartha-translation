  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: ru
  text: Когда они вышли из лодки[a], люди сразу же узнали его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Когда они вышли из лодки, сразу же узнав его…» В греческом тексте подлежащее при слове «узнав» не названо; из контекста видно, что речь идёт о местных жителях.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: когда они вышли
  rationale: Генитив абсолютный естественно передаётся по-русски придаточным времени; «вышли» точно описывает выход из лодки.
- source_word: πλοίου
  choice: лодки
  rationale: В евангельском контексте πλοῖον обозначает небольшое судно, обычно рыбацкую лодку на Галилейском море.
- source_word: εὐθὺς
  choice: сразу же
  rationale: Передаёт быстроту действия и характерную для Марка повествовательную динамику естественным современным русским выражением.
- source_word: ἐπιγνόντες
  choice: узнали
  rationale: Здесь глагол означает распознание знакомого человека при встрече; «узнали» — наиболее естественный русский эквивалент.
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение относится к Иисусу; строчная буква сохраняет обычную современную русскую орфографию и не добавляет отсутствующего в греческом тексте графического различия.
- source_word: implicit subject of ἐπιγνόντες
  choice: люди
  rationale: Подлежащее причастия прямо не названо, однако грамматически оно не совпадает с αὐτῶν в генитиве абсолютном, а следующий стих указывает на местных жителей. Слово «люди» делает русский текст ясным.
theological_decisions:
- issue: Кто узнал Иисуса
  choice: местные люди, выражено словом «люди»
  alternative: оставить только «они», не уточняя подлежащее
  rationale: Это синтаксическое, а не вероучительное уточнение. Контекст следующего стиха показывает, что Иисуса узнали жители той местности; при этом сноска сохраняет формальную неоднозначность греческой конструкции.
translation_notes:
  register: Современный литературный русский язык, простой и достойный повествовательный стиль. «Сразу же» сохраняет характерную для Марка стремительность; добавленное для ясности слово «люди» сопровождается сноской о форме исходного текста.
