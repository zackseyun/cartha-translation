  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: ru
  text: Они обежали всю ту область и стали носить больных на подстилках[a] туда, где, как они слышали, был Иисус.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на тюфяках» или «на носилках»; греческое слово обозначает простую переносную постель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: обежали
  rationale: Передаёт быстрое и охватывающее всю местность движение, сохраняя оттенок срочности составного глагола.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: всю ту область
  rationale: χώρα обозначает окружающую местность или округ, а не современное государство; указательное ἐκείνην сохранено словом «ту».
- source_word: ἤρξαντο ... περιφέρειν
  choice: стали носить
  rationale: Естественно передаёт начало многократного действия и физическое перемещение больных.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: на подстилках
  rationale: κράβαττος — простая переносная постель, подстилка или тюфяк; «подстилки» понятно современному читателю и не предполагает полноценной кровати.
- source_word: τοὺς κακῶς ἔχοντας
  choice: больных
  rationale: Кратко и идиоматично передаёт устойчивое греческое выражение о людях, которые нездоровы.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: туда, где, по слухам, находился Иисус
  rationale: Передаёт направленность движения и косвенное сообщение. Имя «Иисус» делает подразумеваемый субъект ясным по-русски, а «по слухам» естественно отражает ἤκουον, не утверждая непосредственного знания.
