  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: ru
  text: 'И велел им ничего не брать с собой в дорогу, кроме одного посоха: ни хлеба, ни дорожной сумки[a], ни меди[b] за поясом —'
  philosophy: optimal-equivalence
  footnotes:
