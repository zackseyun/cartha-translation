lexical_decisions:
- source_word: παρήγγειλεν
  choice: велел
  rationale: Передаёт авторитетное распоряжение естественным и современным русским глаголом, не усиливая его до сурового «приказал».
- source_word: μηδὲν αἴρωσιν
  choice: ничего не брать с собой
  rationale: В контексте дорожных припасов αἴρω означает брать или нести; русское «брать с собой» ясно выражает подготовку к пути.
- source_word: εἰς ὁδὸν
  choice: в дорогу
  rationale: Естественный русский эквивалент целевого значения греческого оборота.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: кроме одного посоха
  rationale: «Посох» точно обозначает дорожную палку, а «одного» естественно сохраняет ограничительное μόνοv.
- source_word: ἄρτον
  choice: хлеба
  rationale: Сохранён конкретный образ хлеба без обобщения до «еды».
- source_word: πήραν
  choice: сумы
  rationale: πήρα — дорожная сумка, обычно для припасов; «сума» кратко и точно передаёт предмет в достойном библейском регистре.
- source_word: ζώνην
  choice: за поясом
  rationale: Деньги носили в складках или кармане пояса; русское выражение передаёт место хранения естественнее буквального «в пояс».
- source_word: χαλκόν
  choice: медных монет
  rationale: Буквально слово означает «медь», но здесь метонимически обозначает медные деньги; явное «монет» предотвращает ошибочное понимание как куска металла, сохраняя материал монет.
