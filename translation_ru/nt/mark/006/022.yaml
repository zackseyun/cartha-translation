base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: ru
  text: 'Когда дочь Иродиады[a] вошла и станцевала, она понравилась Ироду и возлежавшим с ним за столом. Царь сказал девушке: «Проси у меня чего хочешь, и я дам тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях и традициях текст понимается как «его дочь Иродиада», а не «дочь Иродиады». Здесь перевод следует греческому тексту: «дочь Иродиады».'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθούσης
  choice: когда вошла
  rationale: Аористное причастие в родительном самостоятельном обороте естественно передано временным придаточным; сохраняется вход девушки в помещение пира.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: дочь Иродиады
  rationale: Следуем тексту SBLGNT, где конструкция наиболее естественно обозначает дочь Иродиады; местоимение αὐτῆς усиливает связь, но отдельное «самой» по-русски было бы тяжеловесно.
- source_word: ὀρχησαμένης
  choice: стала танцевать
  rationale: Передаёт последующее действие причастной цепочки естественным современным русским языком, не уточняя вид или характер танца сверх текста.
- source_word: ἀρεσάσης
  choice: она понравилась
  rationale: Прямо передаёт значение ἀρέσκω и грамматически связывает произведённое впечатление с девушкой в целом после её танца, не усиливая его до «восхитила».
- source_word: τοῖς συνανακειμένοις
  choice: возлежавшим с ним за столом
  rationale: Сохраняет конкретный культурный образ участников пира, возлежавших за столом, а не обобщает его до «гостей».
- source_word: εἶπεν ὁ βασιλεὺς
  choice: царь сказал
  rationale: Сохраняется повествовательное обозначение Ирода как βασιλεύς, без исторической замены на технический титул «тетрарх».
- source_word: τῷ κορασίῳ
  choice: девушке
  rationale: Естественное современное обозначение молодой особы без архаического оттенка слова «девица».
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: проси у меня чего хочешь
  rationale: Идиоматично передаёт повеление и открытый характер обещания; форма «чего хочешь» естественна после «проси».
- source_word: δώσω σοι
  choice: я дам тебе
  rationale: Прямое и естественное соответствие будущему времени; предмет просьбы понятен из предыдущей фразы и не требует добавления местоимения.
theological_decisions:
- issue: Обозначение Ирода Антипы словом βασιλεύς
  choice: царь
  alternative: тетрарх; правитель
  rationale: Перевод следует словоупотреблению Марка и не подменяет повествовательное наименование исторически более точным внешним титулом.
- issue: К кому относится дочь в разночтении
  choice: дочь Иродиады
  alternative: его дочь Иродиада
  rationale: Основной текст следует представленному чтению SBLGNT, а реальная текстовая неоднозначность отмечена в сноске без её молчаливого устранения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Оборот «возлежавшим с ним за столом» намеренно сохраняет культурную деталь античного пира; отдельная культурная сноска не требуется, поскольку смысл понятен из самого выражения.
