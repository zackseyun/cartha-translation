  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: ru
  text: 'И Он говорил им: «В какой бы дом вы ни вошли, оставайтесь там, пока не уйдёте оттуда[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока не выйдете оттуда». В контексте речь, вероятно, идёт об уходе из той местности, хотя греческое выражение прямо не уточняет, к чему относится «оттуда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающееся наставление; русское «говорил» естественно сохраняет этот повествовательный аспект без тяжеловесного «продолжал говорить».
- source_word: Ὅπου ἐὰν
  choice: где бы … ни
  rationale: Сочетание выражает неопределённое относительное значение «где бы ни / где бы то ни было»; выбран современный и естественный русский оборот.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: вошли в дом
  rationale: Глагол с εἰς обозначает вход внутрь; «войти в дом» точно и естественно передаёт направление.
- source_word: οἰκίαν
  choice: дом
  rationale: В данном контексте речь прежде всего о месте проживания и гостеприимства; «дом» не требует преждевременно выбирать между зданием и домашним хозяйством.
- source_word: ἐκεῖ μένετε
  choice: оставайтесь там
  rationale: Повелительное μένετε означает оставаться, не переходя в другое место; «оставайтесь там» ясно и достойно звучит по-русски.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: пока не уйдёте оттуда
  rationale: Формулировка близко передаёт греческое «пока не выйдете/уйдёте оттуда» и сохраняет возможную неоднозначность того, относится ли ἐκεῖθεν непосредственно к дому или шире к данной местности.
theological_decisions:
- issue: К чему относится ἐκεῖθεν в заключительной части наставления
  choice: Сохранить открытое «оттуда», не уточняя в основном тексте «из дома» или «из того места».
  alternative: «пока не покинете то место», то есть местность, где ученики служат
  rationale: Контекст миссионерского наставления позволяет понимать речь как запрет менять место проживания до ухода из данной местности, однако буквальная грамматика не называет местность прямо. Перевод не должен молча устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; наставление звучит просто и достойно. Заглавная буква в местоимении «Он» соответствует принятому благоговейному библейскому регистру, не добавляя толкования.
