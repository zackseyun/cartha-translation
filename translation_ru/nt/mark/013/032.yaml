source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: ru
  text: А о том дне или часе[a] не знает никто — ни ангелы на небе, ни Сын, а только Отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые толкователи относят слова «ни Сын» к земному служению Сына или к Его человеческой природе; перевод сохраняет формулировку греческого текста, не добавляя такого объяснения в основной текст.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: А о
  rationale: περί с родительным падежом вводит тему («о»), а δέ обозначает мягкий переход или сопоставление; сочетание «А о» естественно передаёт обе функции по-русски.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: том дне или часе
  rationale: Форма сохраняет различие между днём и более точным моментом — часом; повтор указательного слова по-русски не требуется.
- source_word: οὐδεὶς οἶδεν
  choice: не знает никто
  rationale: οἶδα, хотя исторически имеет форму перфекта, здесь выражает настоящее состояние знания. Порядок слов естественно подводит к следующему перечислению.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: ни ангелы на небе
  rationale: οὐδέ продолжает и усиливает отрицание, естественно передаваемое после «никто» частицей «ни»; ἐν οὐρανῷ понято локативно.
- source_word: οὐδὲ ὁ υἱός
  choice: ни Сын
  rationale: Повторное οὐδέ продолжает отрицательный ряд. Титул «Сын» сохранён без смягчающего или поясняющего добавления.
- source_word: εἰ μὴ ὁ πατήρ
  choice: а только Отец
  rationale: После общего отрицания εἰ μή вводит единственное исключение; «а только Отец» ясно и естественно выражает исключительность.
theological_decisions:
- issue: Утверждение о том, что Сын не знает дня или часа
  choice: Сохранить прямую формулировку «ни Сын» без поясняющего расширения.
  alternative: Добавить в основной текст уточнение вроде «по Своей человеческой природе» или иным образом смягчить высказывание.
  rationale: Греческий текст прямо содержит οὐδὲ ὁ υἱός. Перевод сохраняет подлинное богословское напряжение и не вносит в строку текста более поздний догматический синтез.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Тире перед перечислением подчёркивает последовательное расширение отрицания, не меняя смысла исходного текста.
