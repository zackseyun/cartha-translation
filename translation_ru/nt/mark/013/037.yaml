lexical_decisions:
- source_word: ὃ
  choice: что
  rationale: Субстантивированное относительное местоимение среднего рода естественно передаётся словом «что» и сохраняет обобщающе-возвратный смысл.
- source_word: δὲ
  choice: а
  rationale: Частица имеет здесь мягкую связующую функцию с оттенком перехода; «а» естественно вводит заключительное обобщение без сильного противопоставления.
- source_word: ὑμῖν
  choice: вам
  rationale: Форма второго лица множественного числа обращена к непосредственным слушателям; последующее «всем» ясно расширяет круг адресатов.
- source_word: λέγω ... λέγω
  choice: говорю ... говорю
  rationale: Сохранён повтор греческого глагола, передающий риторическое ударение и параллельную структуру фразы.
- source_word: πᾶσιν
  choice: всем
  rationale: Кратко и точно сохраняет всеохватность греческой формы, не добавляя отсутствующего в исходном тексте существительного.
- source_word: γρηγορεῖτε
  choice: бодрствуйте
  rationale: Настоящее повелительное наклонение множественного числа призывает к продолжающейся бдительности; «бодрствуйте» сохраняет как образ бодрствования, так и переносный смысл настороженности.
theological_decisions:
- issue: Круг адресатов призыва Иисуса
  choice: Слова, обращённые к ученикам, прямо распространяются на всех.
  alternative: Ограничить призыв непосредственными слушателями в повествовательной сцене.
  rationale: Противопоставление «вам» и «всем» явно выражено в греческом тексте, поэтому универсальный охват сохранён без дополнительного уточнения, кого именно включает «все».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Повтор «говорю ... говорю» намеренно сохранён. «Бодрствуйте» понятно в современном религиозно-нравственном контексте и передаёт длительный характер призыва.
