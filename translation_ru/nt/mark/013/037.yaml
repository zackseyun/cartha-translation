  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: ru
  text: 'А то, что говорю вам, говорю всем: бодрствуйте.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не спите»; или: «будьте бдительны».'
