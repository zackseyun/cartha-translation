  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: ru
  text: Но молитесь, чтобы это не случилось зимой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с уточнением по контексту: «чтобы вам не пришлось бежать зимой». Греческий текст Марка выражен более сжато, чем параллельное место в Мф. 24:20.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Настоящее повелительное наклонение, 2-е лицо множественного числа. Простая форма «молитесь» естественно передаёт призыв, не усиливая аспект до «не переставайте молиться».
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкий переход с оттенком противопоставления; «но» уместно связывает призыв с предшествующим предупреждением.
- source_word: ἵνα μὴ
  choice: чтобы… не
  rationale: Естественно вводит содержание молитвы с отрицанием в современном русском языке.
- source_word: γένηται
  choice: это не случилось
  rationale: Аорист конъюнктива γίνομαι в эллиптической конструкции. Указательное «это» сохраняет отсылку к ожидаемому событию из контекста, не добавляя отсутствующее в греческом тексте слово «бегство».
- source_word: χειμῶνος
  choice: зимой
  rationale: Родительный времени передан естественным русским наречным эквивалентом.
theological_decisions:
- issue: Не выраженный явно субъект γένηται
  choice: Сохранить эллиптичность посредством «это не случилось»
  alternative: «чтобы вам не пришлось бежать зимой» / «чтобы ваше бегство не случилось зимой»
  rationale: У Марка слово «бегство» отсутствует, в отличие от Мф. 24:20. Перевод не вносит уточнение из параллельного места и сохраняет более сжатую формулировку исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Эллиптичность оригинала сохранена без архаизации и без заимствования явного дополнения из параллельного текста.
