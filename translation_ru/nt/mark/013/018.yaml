  naturalness: Формулировка краткая, ясная и естественная для современного литературного русского. «Но» уместно передаёт связующую функцию δέ в данном контексте.
  terminology: «Молитесь» — точный и нейтральный перевод προσεύχεσθε. Сезонное «зимой» естественно передаёт χειμῶνος. Конфессионально окрашенных или навязанных интерпретационных терминов нет.
