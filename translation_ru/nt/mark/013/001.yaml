  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: ru
  text: 'Когда Иисус выходил из храма[a], один из Его учеников говорит Ему: «Учитель, посмотри, какие впечатляющие камни и какие впечатляющие здания!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἱερόν обозначает весь храмовый комплекс с его дворами и постройками, а не только внутреннее святилище.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «какие замечательные камни и какие замечательные здания!» Греческое прилагательное выражает изумление или восхищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Когда Иисус выходил
  rationale: Генитив абсолютный с причастием настоящего времени обозначает одновременное, ещё продолжающееся действие. Имя «Иисус» естественно восстанавливает подлежащее в русском повествовании.
- source_word: τοῦ ἱεροῦ
  choice: из храма
  rationale: Ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; традиционное «храм» сохраняет ясность, а точный объём значения поясняется в сноске.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет характерное для Марка живое историческое настоящее.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: один из Его учеников
  rationale: Прямая и естественная передача партитивной конструкции.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Точный современный эквивалент обращения к тому, кто учит.
- source_word: ἴδε
  choice: посмотри
  rationale: Императив привлекает внимание; «посмотри» естественно звучит в современной русской речи.
- source_word: ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί
  choice: какие огромные камни и какие величественные здания
  rationale: Восклицательное ποταπός выражает изумление и восхищение качеством или масштабом увиденного. Контекстуально разные прилагательные создают естественную русскую фразу, не устраняя общий оттенок восхищения.
- source_word: λίθοι
  choice: камни
  rationale: Прямое обозначение массивных камней храмовых сооружений.
- source_word: οἰκοδομαί
  choice: здания
  rationale: Ясное современное обозначение строений храмового комплекса.
