id: MRK.13.5
reference: Mark 13:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: ru
  text: 'Иисус же начал говорить им: «Смотрите, чтобы никто не ввёл вас в заблуждение».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Берегитесь, чтобы никто вас не обманул».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Слабая повествовательная связка; «же» естественно продолжает речь и не придаёт ей излишне сильного противопоставления.
- source_word: ἤρξατο λέγειν
  choice: начал говорить
  rationale: Передаёт маркианскую повествовательную конструкцию близко к греческому и естественно по-русски, не добавляя отсутствующего здесь глагола «ответил».
- source_word: αὐτοῖς
  choice: им
  rationale: Сохраняет местоимение оригинала, не заменяя его поясняющим существительным «ученикам».
- source_word: Βλέπετε
  choice: Смотрите
  rationale: Настоящее повелительное наклонение выражает постоянную бдительность; в сочетании с придаточным предупреждения «смотрите, чтобы» звучит современно и естественно.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: чтобы никто не ввёл вас в заблуждение
  rationale: Конструкция μή с сослагательным наклонением после императива выражает предостережение. Перевод передаёт обман и отклонение от истины, не сужая смысл лишь до интеллектуальной ошибки.
theological_decisions:
- issue: Характер предостережения в πλανήσῃ
  choice: Предостережение от обмана, уводящего с верного пути
  alternative: Предостережение только от интеллектуального заблуждения
  rationale: Глагол πλανάω охватывает не только сообщение ложных сведений, но и введение человека в заблуждение, способное увести его с правильного пути; перевод сохраняет эту широту без дополнительного доктринального толкования.
translation_notes:
  register: Современный литературный русский язык; краткое и достойное повествование. Синтаксис близок к оригиналу, но естественен для обычного читателя. Маркер сноски помещён после цитаты.
