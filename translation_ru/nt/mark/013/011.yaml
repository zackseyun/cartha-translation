id: MRK.13.11
reference: Mark 13:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: ru
  text: Когда вас поведут и предадут, не тревожьтесь заранее о том, что говорить. Говорите то, что будет дано вам в тот час, ведь говорить будете не вы, а Святой Дух.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Когда
  rationale: Вводит ожидаемое будущее обстоятельство. В русском языке начальное «и» здесь не требуется для связи с предыдущей речью и утяжеляло бы фразу.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: вас поведут и предадут
  rationale: Координация двух глаголов естественно передаёт движение под стражей и последующую передачу властям, не сужая παραδίδωμι до личного предательства и не добавляя прямо не названных властей или суда.
- source_word: μὴ προμεριμνᾶτε
  choice: не тревожьтесь заранее
  rationale: Передаёт как тревожную озабоченность, так и временное значение приставки προ-.
- source_word: τί λαλήσητε
  choice: о том, что говорить
  rationale: Естественная современная русская конструкция; «говорить» сохраняет связь с повторяющимся в стихе λαλέω.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: то, что будет дано вам
  rationale: Сохраняет страдательный залог и не называет прямо дающего, хотя дальнейшая фраза указывает на действие Святого Духа.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: в тот час
  rationale: Сохраняет образ решающего часа и торжественный оттенок исходного выражения.
- source_word: τοῦτο λαλεῖτε
  choice: Говорите то
  rationale: 'Указательное «то» передаёт акцент τοῦτο: следует произнести именно данное в тот час.'
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: ведь говорить будете не вы
  rationale: Естественно передаёт усиленное противопоставление ὑμεῖς следующему упоминанию Святого Духа.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое современное русское наименование, ясное и неархаичное.
theological_decisions:
- issue: Действующее лицо речи при гонениях
  choice: Повеление ученикам говорить сохранено рядом с утверждением, что говорит Святой Дух.
  alternative: Представить учеников либо как полностью пассивные орудия диктовки, либо как говорящих лишь под неопределённым духовным влиянием.
  rationale: Греческий текст одновременно повелевает ученикам говорить данное им и называет Святого Духа действующим источником речи. Перевод сохраняет это напряжение, не устраняя ни человеческого участия, ни божественного действия.
translation_notes:
  register: Современный литературный русский язык с кратким, серьёзным и доступным синтаксисом. Сохранены повтор «говорить» и выражение «в тот час»; исключены архаизмы и не выраженные прямо в тексте уточнения.
