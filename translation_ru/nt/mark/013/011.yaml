  source_fidelity: 'Текст точно передаёт последовательность греческого оригинала: принудительное ведение и предание, запрет заранее тревожиться о содержании речи, пассивное «будет дано вам», указание «в тот час» и противопоставление учеников Святому Духу. «Предадут» в данном контексте допустимо передаёт παραδιδόντες без неоправданного уточнения адресата передачи.'
  naturalness: Современный литературный русский звучит ясно и сжато. Конструкции «не тревожьтесь заранее о том, что говорить» и «Говорите то, что будет дано вам» естественны. Порядок слов «говорить будете не вы» уместно выделяет противопоставление.
  terminology: «Святой Дух» — нормативное современное русское обозначение. Повтор «говорить» удачно сохраняет лексическую связность λαλέω, не создавая неестественной тяжеловесности. «В тот час» соответствует возвышенному, но не архаичному регистру оригинала.
