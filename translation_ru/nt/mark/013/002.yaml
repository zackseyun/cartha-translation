  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Видишь эти огромные здания?[a] Здесь не останется камня на камне[b] — всё будет разрушено[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эти огромные храмовые здания». Из контекста ясно, что речь идёт о храмовом комплексе, хотя по-гречески сказано просто «здания».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «не останется камня на камне» означает полное разрушение.
    reason: cultural_note
  - marker: c
    text: 'Или: «будет снесено», «будет низвергнуто».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: Видишь
  rationale: Форма настоящего времени в данном контексте выражает прямой вопрос. Русское «Видишь…?» естественно сохраняет вопросительную силу, не превращая высказывание в повеление «Посмотри».
- source_word: μεγάλας οἰκοδομάς
  choice: огромные здания
  rationale: οἰκοδομαί обозначает здания или сооружения, а μεγάλας здесь указывает на их внушительные размеры и величие. «Огромные здания» звучит естественно и не добавляет отсутствующего в греческом тексте слова «храмовые».
- source_word: οὐ μὴ ἀφεθῇ
  choice: не останется
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание в будущем. Русская конструкция «не останется» в сочетании с «камня на камне» ясно и естественно передаёт категоричность предсказания.
- source_word: ὧδε
  choice: здесь
  rationale: Наречие места непосредственно указывает на находящийся перед собеседниками храмовый комплекс.
- source_word: λίθος ἐπὶ λίθον
  choice: камня на камне
  rationale: Устойчивое русское выражение точно сохраняет образ греческого текста и означает полное разрушение.
- source_word: καταλυθῇ
  choice: был бы разрушен
  rationale: В контексте сооружений καταλύω означает разрушить, снести или разобрать. «Разрушен» сохраняет широкий смысл, не уточняя способ уничтожения.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Иисус сказал ему
  rationale: Прямая и естественная передача повествовательной формулы. Начальное καί не воспроизведено отдельным союзом, поскольку в современном русском начале реплики он был бы стилистически избыточен.
theological_decisions:
- issue: Объём предсказания Иисуса о храмовом комплексе
  choice: В основном тексте употреблено общее слово «здания».
  alternative: «храмовые здания»
  rationale: Из ближайшего контекста ясно, что речь идёт о храмовом комплексе, однако в греческом тексте стоит общее οἰκοδομάς. Такой перевод не вносит в основной текст отсутствующего уточнения.
- issue: Степень полноты предсказанного разрушения
  choice: Сохранён образ «не останется камня на камне» с относительным оборотом «который не был бы разрушен».
  alternative: «всё будет разрушено»
  rationale: Выбранная формулировка ближе передаёт синтаксис греческого текста и его усиленное отрицание, не ослабляя категоричности предсказания и не добавляя обобщающего «всё».
translation_notes:
  register: Современный литературный русский язык; речь ясная, сдержанная и торжественная. Сохранены конкретный образ камней, вопросительная форма и категоричность предсказания, без конфессиональных уточнений.
