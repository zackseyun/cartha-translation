review_pass:
  verdict: approve
  source_fidelity: 'Текст точно передаёт обе части греческого высказывания: будущую враждебность «со стороны всех», причинный оборот διὰ τὸ ὄνομά μου, а также обещание тому, кто сохраняет стойкость «до конца». Активный русский порядок «все будут ненавидеть вас» смыслово равнозначен греческой пассивной конструкции и сохраняет неограниченную широту πάντων. «Выстоит до конца» удачно передаёт ὁ ὑπομείνας εἰς τέλος, не конкретизируя, какой именно конец имеется в виду.'
  naturalness: Фраза звучит естественно на современном литературном русском. Противопоставление через «Но», коррелятивная конструкция «тот, кто…» и формула «будет спасён» ясны и уместны для торжественного библейского регистра. Буквальное повторение указательного местоимения после придаточного не требуется русским синтаксисом.
  terminology: «Моего имени» сохраняет важный библейский образ ὄνομα, а «будет спасён» передаёт богословски весомый, но не суженный смысл σωθήσεται. Сноска корректно отмечает допустимое значение «будет избавлен» и не разрешает контекстную неоднозначность в пользу одной интерпретации.
