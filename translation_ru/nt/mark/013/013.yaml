id: MRK.13.13
reference: Mark 13:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ru
  text: И все будут ненавидеть вас из-за Моего имени. Но тот, кто выстоит до конца, будет спасён.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет избавлен». Греческое слово может означать как избавление от опасности, так и спасение; контекст не устраняет этой многозначности.'
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: все будут ненавидеть вас
  rationale: Будущая перифрастическая конструкция естественно передаётся по-русски действительным оборотом; πάντων сохраняется как неограниченное «все», без ослабляющего уточнения.
- source_word: διὰ τὸ ὄνομά μου
  choice: из-за Моего имени
  rationale: διά с винительным указывает на причину; формулировка сохраняет образ «имени», обозначающего личность Иисуса и принадлежность Ему.
- source_word: ὁ δὲ ὑπομείνας
  choice: Но тот, кто выстоит
  rationale: ὑπομένω здесь означает стойко выдержать давление и не отступить; «выстоит» естественно и не вносит узкой богословской терминологии.
- source_word: εἰς τέλος
  choice: до конца
  rationale: Сохраняется неопределённость относительно того, идёт ли речь о конце испытания, жизни или эсхатологическом конце.
- source_word: οὗτος
  choice: тот
  rationale: Русская коррелятивная конструкция «тот, кто» естественно передаёт указательное и возобновляющее значение οὗτος, не воспроизводя тяжеловесно греческий синтаксис.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: «Спасён» сохраняет широкий диапазон σῴζω — избавление и спасение — и его богословскую весомость в контексте речи о конце.
theological_decisions:
- issue: Значение σωθήσεται в изречении о стойкости
  choice: будет спасён
  alternative: будет избавлен
  rationale: Перевод не сужает смысл ни до одного лишь земного избавления, ни до определённой конфессиональной схемы спасения, сохраняя напряжение исходного текста.
- issue: Охват πάντων
  choice: все будут ненавидеть вас
  alternative: вас будут ненавидеть все люди
  rationale: Сохраняется категорическая широта греческого выражения без добавочных оговорок; его риторический охват определяется контекстом.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Прямой порядок слов в первой фразе естественен для русского и сохраняет акцент на всеобщей враждебности. Прописная буква в «Моего» следует принятой русской библейской орфографической традиции.
