    rationale: В оригинале конструкция буквально обозначает того, кто находится в поле, а не будущий факт нахождения там. Русское «кто в поле» точнее и лаконичнее.
  - severity: low
    issue: «Взять» может быть недостаточно конкретно в контексте возвращения
    rationale: Инфинитив ἆραι выражает цель возвращения — забрать оставленную вещь. «Забрать» естественно уточняет это без изменения смысла.
