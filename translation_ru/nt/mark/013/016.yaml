  verdict: revise
  source_fidelity: Греческое высказывание точно передаёт запрет возвращаться с целью забрать ἱμάτιον. Однако «кто будет в поле» неоправданно сдвигает настоящее обозначение «находящийся в поле» в будущее; «кто в поле» сохраняет обобщённое единственное число и исходную временную неопределённость. «Забрать» в данном контексте яснее выражает возвращение за оставленной одеждой, чем нейтральное «взять».
  naturalness: «А кто в поле» — естественная современная русская конструкция. Сочетание «возвращается назад» допустимо и передаёт усиление εἰς τὰ ὀπίσω, хотя в русском оно несколько избыточно; здесь оно уместно для подчёркнутого запрета.
  terminology: «Верхняя одежда» точно передаёт более широкий смысл ἱμάτιον; сноска «плащ» даёт естественный более конкретный вариант. Возвратное «свою» корректно передаёт принадлежность без ненужного ограничения по полу.
  issues:
