base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: ru
  text: А кто в поле, пусть не возвращается назад, чтобы забрать свою верхнюю одежду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плащ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: кто будет в поле
  rationale: Субстантивированная конструкция обозначает человека, находящегося в поле; по-русски придаточная конструкция звучит естественно и сохраняет обобщённое единственное число.
- source_word: ἀγρός
  choice: поле
  rationale: В данном контексте бегства слово обозначает поле или возделываемую землю; «поле» — наиболее прямой и естественный вариант.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: пусть не возвращается назад
  rationale: Запретительный аористный императив передаёт настоятельный запрет, а εἰς τὰ ὀπίσω подчёркивает движение назад.
- source_word: ἆραι
  choice: взять
  rationale: Инфинитив цели указывает, ради чего человек мог бы вернуться; «взять» точно и естественно передаёт действие без добавления идеи, отсутствующей в тексте.
- source_word: ἱμάτιον
  choice: верхнюю одежду
  rationale: Слово обычно обозначает верхнюю одежду или плащ; более широкое «верхняя одежда» сохраняет лексический объём исходного слова.
- source_word: αὐτοῦ
  choice: свою
  rationale: Русское возвратное притяжательное местоимение естественно указывает, что одежда принадлежит субъекту, и сохраняет единственное число.
theological_decisions:
- issue: Обобщённое указание на человека в мужском роде
  choice: Передать конструкцией «кто будет в поле… свою», сохранив обобщённое единственное число.
  alternative: «Тот, кто будет в поле, пусть не возвращается назад, чтобы взять его верхнюю одежду».
  rationale: Греческий текст использует мужское единственное число как обобщённое обозначение. Русская конструкция с «кто» и «свою» сохраняет число и общий смысл, не ограничивая предупреждение только мужчинами.
translation_notes:
  register: Современный литературный русский язык; настоятельность запрета передана формой «пусть не возвращается», а лексическая широта ἱμάτιον сохранена в основном тексте с более конкретным вариантом в сноске.
