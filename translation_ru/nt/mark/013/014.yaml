  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: ru
  text: Но когда увидите мерзость запустения, стоящую там, где ей не должно быть (пусть читатель поймёт)[a], тогда те, кто в Иудее, пусть бегут в горы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «стоящего там, где ему не должно быть». Греческое причастие имеет форму мужского рода, что может указывать на личный референт, стоящий за выражением «мерзость».'
    reason: alternative_reading
  - marker: b
    text: Выражение «мерзость запустения» перекликается с книгой Даниила (см. Дан. 9:27; 11:31; 12:11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Но когда
  rationale: Ὅταν вводит временное условие, а δέ служит мягкой связкой; «но когда» естественно продолжает предыдущее предупреждение, не усиливая противопоставление.
- source_word: ἴδητε
  choice: увидите
  rationale: Аорист конъюнктива ὁράω во временной конструкции естественно передаётся русским будущим совершенного вида.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: мерзость запустения
  rationale: Сохраняет узнаваемую, близкую к источнику формулу из книги Даниила и не уточняет спорный характер или исторический референт этой мерзости.
- source_word: ἑστηκότα
  choice: стоящую
  rationale: Перфектное причастие передаёт наличное состояние после того, как нечто было поставлено; «стоящую» сохраняет наглядность греческого выражения.
- source_word: ὅπου οὐ δεῖ
  choice: там, где ей не должно быть
  rationale: δεῖ выражает должное или необходимое. Местоимение «ей» согласуется с русским существительным «мерзость», а мужской род греческого причастия отмечен в сноске.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: читающий да поймёт
  rationale: Краткое родовое обозначение читателя и побудительная конструкция сохраняют форму и торжественную сжатость авторского отступления.
- source_word: τότε
  choice: тогда
  rationale: Ясно отмечает следующее за названным знамением действие.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: те, кто в Иудее
  rationale: Естественно и точно передаёт субстантивированное обозначение находящихся в Иудее.
- source_word: φευγέτωσαν
  choice: пусть бегут
  rationale: Передаёт настоятельное повеление третьего лица множественного числа без излишней официальности.
- source_word: εἰς τὰ ὄρη
  choice: в горы
  rationale: Прямой и естественный русский эквивалент, соответствующий топографическому смыслу.
theological_decisions:
- issue: Толкование формулы βδέλυγμα τῆς ἐρημώσεως
  choice: Сохранить выражение «мерзость запустения», не называя её исторический референт.
  alternative: «осквернение, несущее опустошение» или «мерзость, вызывающая запустение»
  rationale: Фраза отсылает к книге Даниила и может обозначать святотатственный предмет, действие или лицо; перевод не должен устранять эту намеренную неоднозначность.
- issue: Мужской род причастия ἑστηκότα при среднем роде βδέλυγμα
  choice: В основном тексте согласовать «стоящую» и «ей» с русским словом «мерзость», а личностную возможность отметить в сноске.
  alternative: «стоящего там, где ему не должно быть»
  rationale: Греческая форма мужского рода может указывать на стоящее за выражением лицо или персонификацию, однако синтаксис неоднозначен; основной текст остаётся читаемым, а напряжение оригинала сохраняется в примечании.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формула «мерзость запустения» сохранена ради межтекстовой связи; «читающий да поймёт» намеренно несколько возвышенно и передаёт краткое авторское наставление.
