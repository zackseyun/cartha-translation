  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: ru
  text: 'Многие придут под моим именем и будут говорить: «Это я»[a] — и многих введут в заблуждение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Я есмь». В греческом тексте сказуемое прямо не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Многие
  rationale: Субстантивированное прилагательное обозначает неопределённо большое число людей; краткое «многие» естественно по-русски.
- source_word: ἐλεύσονται
  choice: придут
  rationale: Будущее время ἔρχομαι непосредственно и естественно передаётся глаголом «придут».
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: под моим именем
  rationale: Оборот указывает на выступление с притязанием на связь с именем Иисуса или его полномочиями. «Под моим именем» сохраняет эту смысловую широту и в данном контексте звучит естественнее, чем буквальное «на моём имени».
- source_word: λέγοντες
  choice: и будут говорить
  rationale: Причастие описывает сопутствующее действие. Личная глагольная форма естественна в современном русском повествовании и не усиливает значение до «утверждать» или «заявлять».
- source_word: ὅτι Ἐγώ εἰμι
  choice: «Это я»
  rationale: В греческом сказуемое после ἐγώ εἰμι явно не выражено. Русское «Это я» естественно передаёт самоотождествляющее притязание в контексте, не уточняя прямо «Я Христос»; более формальная структура отражена в сноске.
- source_word: πολλοὺς
  choice: многих
  rationale: Субстантивированное прилагательное является прямым дополнением и естественно передаётся словом «многих».
- source_word: πλανήσουσιν
  choice: введут в заблуждение
  rationale: πλανάω означает заставить заблуждаться, сбить с верного пути, обмануть. Выбранный оборот ясен современному читателю и сохраняет идею отклонения от истины.
theological_decisions:
- issue: Передача Ἐγώ εἰμι в речи ложных претендентов
  choice: «Это я» с примечанием о буквальной форме
  alternative: «Я есмь»; «Я — тот самый»
  rationale: Контекст предполагает притязание на личность или роль Иисуса, однако греческий текст не называет сказуемое прямо. «Это я» звучит естественно и сохраняет недосказанность; вариант «Я — тот самый» сильнее разрешал бы её, а «Я есмь» в основном тексте звучал бы архаично и мог бы вызвать избыточные богословские ассоциации.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно общим нормам современного издания. Тире после прямой речи помогает ясно связать второе будущее действие с первой частью стиха.
