  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: ru
  text: Брат предаст брата на смерть[a], и отец предаст своего ребёнка; дети восстанут против родителей и убьют их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдаст брата на смерть». Греческий глагол может означать «передать», «выдать» или, в данном контексте, «предать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: предаст
  rationale: В контексте преследований глагол означает передачу человека в руки властей или врагов и одновременно допускает оттенок предательства. «Предаст» кратко и естественно сохраняет оба смысловых аспекта; более конкретное «выдаст» указано в примечании.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: брат предаст брата
  rationale: Сохранены мужской род и резкий повтор исходного текста; конструкция звучит естественно по-русски и имеет обобщающий характер.
- source_word: εἰς θάνατον
  choice: на смерть
  rationale: Передаёт направленность к смертельному исходу без излишнего синтаксического развёртывания.
- source_word: πατὴρ τέκνον
  choice: отец — своего ребёнка
  rationale: «Отец» сохраняет конкретное πατήρ, а «ребёнок» передаёт более широкое τέκνον без неоправданного уточнения пола. Притяжательное «своего» естественно выражает подразумеваемое родство.
- source_word: ἐπαναστήσονται ... ἐπὶ
  choice: восстанут против
  rationale: Сохраняет образ враждебного выступления и силу греческого выражения, не сводя его лишь к внутреннему несогласию.
- source_word: γονεῖς
  choice: родителей
  rationale: Прямой современный эквивалент формы множественного числа, охватывающий отца и мать.
- source_word: θανατώσουσιν αὐτούς
  choice: убьют их
  rationale: Прямо и естественно передаёт значение «лишить жизни, предать смерти». Русское «умертвят» было бы формальнее, но менее современно и обычно.
theological_decisions:
- issue: Родовые обозначения членов семьи в обобщающем высказывании
  choice: Сохранить «брат» и «отец», но передать τέκνον и γονεῖς как «ребёнок» и «родители».
  alternative: 'Нейтрализовать все обозначения: «один родственник», «родитель».'
  rationale: Греческий текст конкретно называет брата и отца мужскими существительными, тогда как τέκνον и γονεῖς имеют более широкое значение. Перевод сохраняет это различие и не привносит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой фразой. Тире восполняет пропущенный во второй части глагол и сохраняет параллелизм исходного текста. «Убьют» предпочтено более книжному «умертвят» ради ясности для широкого круга читателей.
