  text: ὑμεῖς δὲ βλέπετε· ⸀προείρηκα ὑμῖν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: ru
  text: 'Но вы будьте настороже[a]: Я заранее сказал вам обо всём[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смотрите»; «берегитесь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я заранее предупредил вас обо всём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: вы
  rationale: Личное местоимение выражено явно и несёт контрастное усиление; в русском его сохранение естественно подчёркивает обращение именно к ученикам.
- source_word: δὲ
  choice: но
  rationale: Передаёт противопоставление и переход от описанной опасности к прямому предостережению.
- source_word: βλέπετε
  choice: будьте настороже
  rationale: Форма настоящего повелительного наклонения здесь призывает сохранять постоянную бдительность; буквальное «смотрите» в современном русском менее ясно передаёт функцию предупреждения.
- source_word: προείρηκα
  choice: заранее сказал
  rationale: 'Передаёт значение «сказать прежде, заранее» и результативную силу перфекта: ранее сказанное остаётся значимым сейчас.'
- source_word: ὑμῖν
  choice: вам
  rationale: Естественно передаёт дательный падеж адресата при глаголе речи.
- source_word: πάντα
  choice: обо всём
  rationale: Нейтрально и естественно передаёт «всё» без добавочного ограничения; объём сказанного определяется контекстом.
theological_decisions:
- issue: Объём предварительного откровения Иисуса
  choice: Сохранено широкое «обо всём» без поясняющего ограничения.
  alternative: Передать как «обо всём этом», прямо ограничив значение ближайшими предупреждениями.
  rationale: πάντα допускает контекстуальное отнесение ко всему относящемуся к обсуждаемому, однако сам стих не содержит указательного слова «этом». Перевод сохраняет эту смысловую широту и не превращает фразу ни в утверждение об исчерпывающем знании всех деталей будущего, ни в явно ограниченную ссылку только на непосредственно предшествующие слова.
- issue: Характер повеления βλέπετε
  choice: Передано как постоянное предостережение «будьте настороже».
  alternative: 'Более буквально: «смотрите»; также возможно «берегитесь».'
  rationale: В контексте лжепророков и обмана глагол имеет предупредительную силу. Выбранный вариант сохраняет призыв к бдительности, не добавляя конкретного объекта опасения.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинственный. Контрастное «вы» сохранено; двоеточие естественно связывает повеление с основанием для него. Заглавная буква в «Я» отражает принятое в русском библейском наборе почтительное написание местоимения, относящегося к Иисусу.
