  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: ru
  text: 'Истинно говорю вам: не пройдёт это поколение, пока всё это не произойдёт[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «этот народ» или «этот род»; греческое слово γενεά допускает более широкие значения, хотя здесь наиболее естественно «поколение».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте отрицание усилено: «ни в коем случае не пройдёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: В синоптических Евангелиях вводит торжественное и авторитетное изречение; «Истинно» естественно для современного литературного русского и сохраняет формулу речи.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близко передаёт стандартную формулу прямого обращения и сохраняет несколько торжественный регистр.
- source_word: οὐ μὴ παρέλθῃ
  choice: не пройдёт
  rationale: Глагол передан естественно в сочетании с «поколение»; усилительный характер οὐ μή отмечен в сноске, поскольку буквальное усиление в основном тексте звучало бы по-русски тяжеловесно.
- source_word: ἡ γενεὰ αὕτη
  choice: это поколение
  rationale: Наиболее прямое и естественное значение в данном контексте; перевод сохраняет спорность выражения, не подменяя его эсхатологическим толкованием.
- source_word: μέχρις οὗ
  choice: пока
  rationale: Естественно обозначает временной предел в русском придаточном предложении.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Идиоматично и полно передаёт совокупность упомянутых событий; по-русски естественнее, чем «все эти вещи».
- source_word: γένηται
  choice: не произойдёт
  rationale: В контексте событий γίνομαι означает «произойти, совершиться»; «произойдёт» ясно и современно.
theological_decisions:
- issue: Значение ἡ γενεὰ αὕτη в эсхатологической речи
  choice: это поколение
  alternative: «этот народ» / «этот род»; либо поколение будущего времени, которое увидит начало знамений
  rationale: Обычное значение выражения — «это поколение». Перевод не уточняет его референт и тем самым сохраняет присущую тексту богословскую и хронологическую напряжённость.
- issue: Временная связь μέχρις οὗ с исполнением предсказанного
  choice: пока всё это не произойдёт
  alternative: «прежде чем всё это произойдёт»
  rationale: «Пока… не» прямо передаёт временной предел и не добавляет выводов о том, что должно последовать после него.
translation_notes:
  register: Современный литературный русский с торжественной евангельской формулой «Истинно говорю вам». Синтаксис краткий и ясный; спорное «это поколение» сохранено без конфессионального или эсхатологического истолкования.
