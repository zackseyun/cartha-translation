  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: ru
  text: И сначала благая весть должна быть возвещена всем народам.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелие». Греческое εὐαγγέλιον буквально означает «благая весть».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди всех народов»; в некоторых контекстах греческое ἔθνη может также означать «язычники».'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Союз продолжает предшествующую речь, не вводя более сильного противопоставления.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: всем народам
  rationale: При глаголе возвещения εἰς может обозначать направленность или охват. «Всем народам» естественно передаёт всемирный масштаб, не сужая значение до одних язычников.
- source_word: πρῶτον
  choice: прежде
  rationale: Передаёт временную первоочерёдность и естественно звучит при данном порядке слов, не уточняя сверх текста, перед чем именно это должно совершиться.
- source_word: δεῖ
  choice: должна
  rationale: Выражает необходимость, в том числе возможную необходимость в рамках Божьего замысла, но не называет её источник прямо.
- source_word: κηρυχθῆναι
  choice: быть возвещена
  rationale: Пассивный инфинитив обозначает публичное провозглашение; «возвещена» сохраняет достоинство и широту исходного глагола.
- source_word: τὸ εὐαγγέλιον
  choice: Благая весть
  rationale: Прямо передаёт смысл εὐαγγέλιον современным понятным русским языком; традиционный термин «Евангелие» дан в примечании.
theological_decisions:
- issue: Объём значения ἔθνη
  choice: всем народам
  alternative: среди всех народов; всем язычникам
  rationale: Выбор сохраняет глобальный этнический охват и не навязывает более узкое противопоставление иудеев и язычников; допустимые смысловые оттенки отмечены в сноске.
- issue: Сила δεῖ
  choice: должна
  alternative: необходимо
  rationale: Форма сохраняет категорическую необходимость, но не добавляет прямо не названного в стихе объяснения её источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «всем народам прежде» сохраняет акцент исходного порядка слов и остаётся естественной; «Благая весть» употреблена как наименование вести.
