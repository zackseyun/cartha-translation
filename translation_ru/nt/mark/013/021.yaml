source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: ru
  text: 'И тогда, если кто-нибудь скажет вам: «Смотрите, Мессия[a] здесь!» — или: «Смотрите, там!» — не верьте.


    [a] Или: «Христос».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Альтернативная традиционная передача греческого титула ὁ χριστός.
lexical_decisions:
- source_word: καὶ τότε
  choice: И тогда
  rationale: Сохраняет и связь с предыдущими словами (καί), и временное значение τότε, естественно звуча по-русски.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: если кто-нибудь скажет вам
  rationale: Передаёт общее условие и неопределённое τις без излишне формального оттенка.
- source_word: Ἴδε
  choice: Смотрите
  rationale: Современный и выразительный призыв обратить внимание; не использует архаичное «се».
- source_word: ὧδε
  choice: здесь
  rationale: Прямо передаёт указание на близкое место.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: В данном контексте слово употреблено как титул ожидаемого помазанного избавителя, а не как имя; традиционный вариант «Христос» дан в сноске.
- source_word: ἐκεῖ
  choice: там
  rationale: Кратко и точно сохраняет пространственное противопоставление слову «здесь».
- source_word: μὴ πιστεύετε
  choice: не верьте
  rationale: Сохраняет не выраженный в греческом тексте объект веры и потому не сужает смысл до «не верьте ему» или «не верьте этому».
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Артикль и контекст ложных эсхатологических заявлений указывают на титульное значение. «Мессия» ясно передаёт смысл помазанного избавителя, а вариант «Христос» сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным евангельским звучанием. Повтор «Смотрите» сохраняет настойчивую форму греческого Ἴδε; объект при «не верьте» намеренно не добавлен, чтобы сохранить смысловую открытость оригинала.
