base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ru
  text: Небо и земля пройдут, но Мои слова никогда не пройдут.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни в коем случае не пройдут». В греческом тексте употреблено усиленное отрицание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: небо
  rationale: В устойчивой космической паре «небо и земля» слово обозначает не только видимый небосвод, но небо как часть всего сотворённого мира.
- source_word: ἡ γῆ
  choice: земля
  rationale: В сочетании с «небом» речь идёт о земле как части мира, а не об отдельной стране или территории.
- source_word: παρελεύσονται
  choice: пройдут
  rationale: Глагол здесь означает «пройти, миновать, перестать существовать». Краткое «пройдут» естественно по-русски и сохраняет эсхатологическую силу без уточнения того, каким образом это произойдёт.
- source_word: δὲ
  choice: но
  rationale: Союз выражает резкое противопоставление преходящего неба и земли непреходящим словам Иисуса.
- source_word: οἱ λόγοι μου
  choice: Мои слова
  rationale: Прямо передаёт слова и изречения Иисуса; местоимение с прописной буквы соответствует принятому в русском библейском стиле благоговейному написанию.
- source_word: οὐ μὴ παρελεύσονται
  choice: ни за что не пройдут
  rationale: Сочетание οὐ μή с будущим временем выражает усиленное отрицание. «Ни за что не пройдут» отчётливо передаёт уверенность и категоричность греческой конструкции, оставаясь понятным современному читателю.
theological_decisions:
- issue: Сила усиленного отрицания в утверждении Иисуса о Своих словах
  choice: «ни за что не пройдут»
  alternative: «никогда не пройдут»; «ни в коем случае не пройдут»
  rationale: Перевод явно сохраняет усиленную отрицательную конструкцию и противопоставляет преходящий сотворённый порядок непреложности слов Иисуса, не добавляя объяснения о способе исполнения.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Сохранены параллелизм и резкий контраст оригинала. Формулировка «ни за что не пройдут» несколько разговорнее традиционного «не прейдут», но понятна широкому кругу читателей и точно передаёт усиление.
