  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: ru
  text: И тогда Он пошлёт ангелов и соберёт избранных[a] от четырёх ветров[b] — от края земли до края неба[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть тех, кого избрал Бог.
    reason: lexical_alternative
  - marker: b
    text: «От четырёх ветров» — образное выражение со значением «со всех сторон света».
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «от самого края земли до самого края неба». Эта пространственная формулировка выражает всеобщий охват.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: тогда
  rationale: Естественно передаёт временную последовательность в эсхатологической речи.
- source_word: ἀποστελεῖ
  choice: пошлёт
  rationale: Будущее время глагола ἀποστέλλω; русский глагол ясно передаёт направление уполномоченных посланников без лишнего уточнения.
- source_word: ἀγγέλους
  choice: ангелов
  rationale: В апокалиптическом контексте речь идёт о небесных существах, а не о человеческих вестниках.
- source_word: ἐπισυνάξει
  choice: соберёт
  rationale: Естественно и точно передаёт значение соединения в одно собрание; приставочное значение не требует отдельного «вместе».
- source_word: ἐκλεκτούς
  choice: избранных
  rationale: Субстантивированное прилагательное передаётся привычным и понятным русским библейским термином без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: с четырёх ветров
  rationale: Сохраняет образ исходного текста и библейскую идиому, обозначающую все стороны света.
- source_word: ἀπ’ ἄκρου γῆς
  choice: от края земли
  rationale: Близко передаёт пространственную крайность ἄκρον и сохраняет параллелизм заключительной пары.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: до края неба
  rationale: Сохраняет буквальный пространственный образ и параллель с «краем земли», не превращая «небо» в специальное утверждение о месте Божьего пребывания.
- source_word: καὶ τότε ... καὶ
  choice: И тогда ... и
  rationale: Сохраняет характерную для Марка связность повествования и координацию двух будущих действий.
theological_decisions:
- issue: Передача ἐκλεκτούς в эсхатологическом контексте
  choice: избранных
  alternative: тех, кого избрал Бог
  rationale: «Избранных» точно и кратко сохраняет богословское содержание, но не уточняет в самом переводе субъект, основания или механизм избрания сверх сказанного в греческом тексте.
- issue: Охват собирания
  choice: с четырёх ветров — от края земли до края неба
  alternative: со всех концов света, от одного края неба до другого
  rationale: Выбранная формулировка сохраняет необычное сочетание образов исходного текста и не сглаживает его по традиционным параллельным формулировкам.
- issue: Подразумеваемое подлежащее глаголов
  choice: Он
  alternative: он
  rationale: Заглавная буква служит русской издательской норме для ясной отсылки к Сыну Человеческому в предыдущем стихе, не добавляя имени или титула в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены образ «четырёх ветров» и намеренно необычная пара «край земли — край неба»; тире помогает естественно связать поясняющий диапазон с предшествующей идиомой. Все сноски отмечены в основном тексте.
