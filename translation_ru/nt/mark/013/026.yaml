lexical_decisions:
- source_word: ὄψονται
  choice: увидят
  rationale: Будущее время от ὁράω здесь имеет прямое значение; «увидят» естественно по-русски и сохраняет явный, зримый характер события.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшаяся передача титула, сохраняющая его связь с Дан 7 и не сводящая выражение к общему обозначению человека.
- source_word: ἐρχόμενον
  choice: идущего
  rationale: Причастие настоящего времени передаёт разворачивающееся действие. «Идущего» — традиционная и понятная библейская передача, не сужающая смысл до момента прибытия.
- source_word: ἐν νεφέλαις
  choice: на облаках
  rationale: Хотя ἐν буквально означает «в», в русском сочетание «идущего на облаках» естественно передаёт образ и вероятную отсылку к Дан 7:13; более буквальное «в облаках» сохранено в примечании.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: с великой силой
  rationale: μετά с родительным обозначает сопровождение, а «великая сила» естественно передаёт степень, выраженную πολλῆς.
- source_word: καὶ δόξης
  choice: и славой
  rationale: «Слава» сохраняет обычный библейский смысл δόξα — явленное величие — и межтекстовые связи.
theological_decisions:
- issue: Апокалиптический титул и образ облаков
  choice: Сохранить титул «Сын Человеческий» и образ шествия на облаках без поясняющего расширения.
  alternative: Передать титул как «Человек» либо явно раскрыть в основном тексте отсылку к Дан 7:13.
  rationale: Стих явно перекликается с Дан 7:13, однако перевод должен сохранять эту перекличку, а не подменять её толкованием. Традиционный титул удерживает христологическую и эсхатологическую напряжённость греческого текста.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис прост и общедоступен; традиционные ключевые выражения сохранены там, где они несут межтекстовый и богословский вес.
