  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: ru
  text: И тогда увидят Сына Человеческого, грядущего в облаках с великой силой и славой[a].
  philosophy: optimal-equivalence
  footnotes:
