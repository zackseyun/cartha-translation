  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: ru
  text: Но в те дни, после той скорби[a], солнце померкнет, и луна не даст своего света,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того бедствия», «после того страдания» или «после того притеснения».'
    reason: Лексема θλῖψις допускает значения скорби, бедствия, страдания и притеснения; контекст не требует сводить её к одному узкому оттенку.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление или переход к следующей части речи естественным и кратким русским союзом.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в те дни
  rationale: Сохраняет структуру греческого временного оборота и его эсхатологическое звучание.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: после той скорби
  rationale: μετά с винительным имеет временное значение «после»; «скорбь» передаёт тяжесть θλῖψις и сохраняет библейские переклички, не уточняя природу бедствия.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: солнце померкнет
  rationale: Естественный современный русский оборот для будущего затмения света; он точно передаёт результат пассивной формы, не вводя явно названного деятеля.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: луна не даст своего света
  rationale: Сохраняет образное греческое «не даст» и прямо передаёт φέγγος как «свет».
theological_decisions:
- issue: Передача θλῖψις в апокалиптической речи
  choice: скорбь
  alternative: бедствие; страдание; притеснение
  rationale: «Скорбь» сохраняет напряжённость и традиционные межтекстовые ассоциации апокалиптического контекста, но сама по себе не навязывает определённой эсхатологической системы.
- issue: Пассивная форма σκοτισθήσεται
  choice: померкнет
  alternative: будет омрачено
  rationale: «Померкнет» звучит естественно и возвышенно в современном русском; при этом перевод не называет причину или деятеля и потому не снимает заложенную в пассиве неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Синтаксис близок к греческому, но естественен по-русски; запятая в конце сохранена как признак продолжения предложения в следующем стихе.
