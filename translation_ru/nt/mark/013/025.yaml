  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: ru
  text: И звёзды будут падать с неба[a], и силы на небесах[b] поколеблются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с небес». Греческое слово οὐρανός может обозначать как видимое небо, так и небесную сферу.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «силы на небесах» может обозначать небесные силы, космические силы или само устройство небес; греческий текст не уточняет.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: звёзды
  rationale: Обычное значение слова; в апокалиптическом контексте сохраняется прямой космический образ.
- source_word: ἔσονται ... πίπτοντες
  choice: будут падать
  rationale: Будущее время εἰμί с причастием настоящего времени передаёт длительное или зримо разворачивающееся будущее действие; русская конструкция «будут падать» естественно сохраняет этот оттенок.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: 'Естественное русское соответствие, сохраняющее допустимую двойственность οὐρανός: видимое небо или небесная сфера.'
- source_word: δυνάμεις
  choice: силы
  rationale: Буквальный и достаточно широкий эквивалент, не уточняющий, имеются ли в виду небесные существа, космические силы или устройство небес.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: находящиеся на небесах
  rationale: Передаёт определительную конструкцию и множественное число «небес», не превращая её без основания в однозначное «небесные силы».
- source_word: σαλευθήσονται
  choice: поколеблются
  rationale: 'Точно и естественно передаёт будущее страдательное значение σαλεύω в эсхатологическом контексте: будут потрясены, приведены в колебание.'
theological_decisions:
- issue: Значение выражения «силы, находящиеся на небесах»
  choice: Оставить общее обозначение «силы», не конкретизируя их природу.
  alternative: «небесные силы» как ангельские существа либо «силы небес» как космические силы и структуры
  rationale: Греческая формулировка допускает несколько пониманий, а апокалиптический контекст не устраняет эту неоднозначность; перевод не должен разрешать её за исходный текст.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Конструкция «будут падать» сохраняет динамический характер образа, а «поколеблются» — достоинство и силу исходной речи.
