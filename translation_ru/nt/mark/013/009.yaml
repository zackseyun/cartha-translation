source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: ru
  text: Но вы будьте настороже. Вас будут отдавать на суд советов, будут бить в синагогах, и вы предстанете перед правителями и царями из-за Меня — во свидетельство им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как свидетельство для них»; выражение может также означать «как свидетельство против них».'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Но вы будьте настороже
  rationale: Настоящее повелительное передаёт постоянную бдительность; явное ὑμεῖς и возвратное ἑαυτούς подчёркивают личную ответственность учеников. «Будьте настороже» естественно и сохраняет предостерегающую силу.
- source_word: παραδώσουσιν ὑμᾶς εἰς συνέδρια
  choice: Вас будут отдавать под суд местных советов
  rationale: παραδίδωμι здесь означает передачу властям, а множественное συνέδρια указывает на местные судебно-управленческие советы, не обязательно только на Иерусалимский синедрион. Добавление «под суд» проясняет юридическую функцию без чрезмерной конкретизации.
- source_word: εἰς συναγωγὰς δαρήσεσθε
  choice: будут бить в синагогах
  rationale: Будущий пассив δαρήσεσθε обозначает физическое избиение; «бить» сохраняет широту значения и не сужает его до конкретного вида бичевания. Синагоги названы как место общинного разбирательства и наказания.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: вы предстанете перед правителями и царями
  rationale: Форма σταθήσεσθε в сочетании с ἐπί передаёт официальное появление перед властями, вероятно вынужденное. «Предстанете» естественно выражает судебно-официальный оттенок; «правители и цари» сохраняет различие названных властей.
- source_word: ἕνεκεν ἐμοῦ
  choice: из-за Меня
  rationale: Фраза выражает причину преследования — связь учеников с Иисусом. «Из-за Меня» ясно и современно, не добавляя идеи заслуги или выгоды.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: во свидетельство им
  rationale: μαρτύριον означает свидетельство, а αὐτοῖς обозначает тех, кому оно обращено. Формулировка сохраняет возможность того, что свидетельство может иметь и обвинительный смысл, но не вводит его прямо в основной текст.
theological_decisions:
- issue: Смысл выражения εἰς μαρτύριον αὐτοῖς
  choice: Появление учеников перед властями станет свидетельством, обращённым к ним.
  alternative: Оно станет обвинительным свидетельством против них.
  rationale: Дательный αὐτοῖς сам по себе не требует значения «против них». Основной текст сохраняет более широкое «им», а возможный обвинительный оттенок отмечен в сноске, чтобы не разрешать неоднозначность преждевременно.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. «Местных советов» предотвращает ошибочное отождествление каждого συνέδριον с единственным Иерусалимским синедрионом. Заглавная буква в «Меня» следует принятой русской библейской типографической традиции.
