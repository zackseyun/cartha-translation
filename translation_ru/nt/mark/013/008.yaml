  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: ru
  text: Ведь народ восстанет против народа и царство — против царства. В разных местах будут землетрясения, будет голод. Всё это — начало родовых мук[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родовых схваток»; греческое слово обозначает боли при родах и здесь метафорически указывает на страдания, предшествующие тому, что последует.'
    reason: Лексическая альтернатива и пояснение метафоры.
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: восстанет
  rationale: Будущая пассивная форма ἐγείρω в данном сочетании идиоматически описывает выступление одного народа против другого. Русское «восстанет» естественно передаёт начало противостояния, не воспроизводя неуместно буквальную пассивную конструкцию.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: народ ... против народа
  rationale: ἔθνος может означать народ, нацию или этническую общность. «Народ» — современное и достаточно широкое соответствие, сохраняющее параллелизм с политическим «царством».
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: царство ... против царства
  rationale: Здесь βασιλεία обозначает политическое владение или государство, а не отвлечённое царствование. «Царство» сохраняет исторический колорит и синтаксический параллелизм.
- source_word: σεισμοὶ
  choice: землетрясения
  rationale: В данном контексте σεισμός прямо обозначает землетрясение; выбран обычный современный русский термин.
- source_word: κατὰ τόπους
  choice: в разных местах
  rationale: Распределительное κατά с множественным числом τόπους указывает на события в ряде мест. «В разных местах» естественно выражает эту распределительность.
- source_word: λιμοί
  choice: будет голод
  rationale: λιμός означает тяжёлый недостаток пищи, голод. Хотя в греческом стоит множественное число, в современном русском «голод» обычно употребляется как собирательное существительное в единственном числе; буквальное «голоды» звучало бы неестественно.
- source_word: ἀρχὴ
  choice: начало
  rationale: Безартиклевое ἀρχή в именной части сказуемого обозначает начальную стадию перечисленных бедствий. Русское «начало» точно и естественно передаёт эту функцию.
- source_word: ὠδίνων
  choice: родовых мук
  rationale: ὠδίν обозначает боли при родах и метафорически — страдания, предшествующие дальнейшему событию. «Родовые муки» сохраняют образ и понятны современному читателю.
- source_word: ταῦτα
  choice: всё это
  rationale: Греческое указательное местоимение во множественном числе отсылает ко всем перечисленным событиям, но сочетается с единственным числом сказуемого. «Всё это» естественно передаёт собирательный смысл.
theological_decisions:
- issue: Апокалиптическая метафора ἀρχὴ ὠδίνων
  choice: «начало родовых мук» — перечисленные бедствия представлены как начальная стадия страданий, а не как их завершение
  alternative: Обобщить как «начало бедствий» либо конкретизировать образ в рамках определённой эсхатологической системы
  rationale: 'Сохранён образ родов и присущая ему напряжённость: страдания предшествуют тому, что последует, однако перевод не уточняет природу последующего события сверх сказанного в тексте.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Повтор «против» сохраняет параллелизм оригинала; тире во второй части устраняет тяжеловесный повтор глагола. «Ведь» передаёт пояснительное γάρ в связи с предыдущим контекстом. Архаичное «глады» и канцелярское «нехватка продовольствия» отвергнуты.
