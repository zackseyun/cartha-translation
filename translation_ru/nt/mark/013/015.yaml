  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: ru
  text: Тот, кто на крыше[a], пусть не спускается с крыши и не входит в дом, чтобы взять что-либо из своего дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт о плоской крыше дома, часто доступной для людей и используемой как часть жилого пространства.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: тот, кто будет на крыше
  rationale: Субстантивированное выражение обозначает человека, находящегося в этом месте. Будущее время естественно для русского наставления о предстоящей ситуации.
- source_word: δώματος
  choice: крыше
  rationale: δώμα здесь обозначает плоскую и доступную крышу дома; обычное русское «крыша» понятно читателю, а культурная особенность поясняется в сноске.
- source_word: μὴ καταβάτω
  choice: пусть не спускается
  rationale: Запретительный императив третьего лица естественно передаётся конструкцией «пусть не»; «спускается» точно выражает движение с крыши вниз.
- source_word: μηδὲ εἰσελθάτω
  choice: и не входит в дом
  rationale: μηδέ присоединяет второй запрет, а подразумеваемое направление входа ясно из последующего упоминания дома. «Входит» сохраняет значение εἰσέρχομαι без лишнего уточнения способа движения.
- source_word: τι ἆραι
  choice: чтобы взять что-нибудь
  rationale: Инфинитив выражает цель, а неопределённое местоимение указывает на любую вещь; такой порядок слов звучит естественно по-русски.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: из своего дома
  rationale: ἐκ указывает на вынесение изнутри дома. Возвратное «своего» естественно соотносит дом с субъектом и сохраняет единственное число исходного текста.
theological_decisions:
- issue: Мужской род единственного числа в наставлении общего характера
  choice: из своего дома
  alternative: из их дома
  rationale: Греческий текст использует грамматически мужское единственное число с обобщающим значением. Русское возвратное местоимение «своего» сохраняет единственное число и отношение принадлежности, не вводя неестественного гендерного акцента.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и настойчивая, соответствующая срочности контекста. Синтаксис сохраняет два последовательных запрета и цель запрещённого входа.
