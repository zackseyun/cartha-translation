  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: ru
  text: Горе же беременным и кормящим грудью в те дни!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: горе
  rationale: Сохраняет пророческую силу скорбного восклицания и предупреждения о грядущем бедствии.
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий переход к следующей мысли, не усиливая противопоставление.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: беременным
  rationale: Естественно и точно передаёт греческую идиому «имеющим во чреве» в современном русском языке.
- source_word: θηλαζούσαις
  choice: кормящим грудью
  rationale: Передаёт действие θηλάζω ясно и естественно; подразумеваемый ребёнок не требует добавления в основном тексте.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в те дни
  rationale: Кратко и буквально сохраняет временную связь с контекстом.
