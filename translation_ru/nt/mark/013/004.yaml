  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: ru
  text: '«Скажите нам: когда это произойдёт и какое будет знамение, когда всё это вот-вот совершится?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда всё это совершится». Греческая конструкция с μέλλω и инфинитивом может более определённо указывать на предстоящее, возможно близкое, совершение события.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Скажите нам
  rationale: Аористный императив λέγω с дательным косвенного объекта естественно передаётся вежливым по форме, но прямым по смыслу обращением «Скажите нам».
- source_word: πότε ταῦτα ἔσται
  choice: когда это произойдёт
  rationale: Буквальное «когда это будет» в данном контексте менее естественно по-русски; «произойдёт» ясно передаёт вопрос о времени предсказанных событий, а собирательное «это» допустимо для греческого ταῦτα.
- source_word: σημεῖον
  choice: знамение
  rationale: «Знамение» — понятный и закрепившийся в библейском эсхатологическом контексте эквивалент, сохраняющий более насыщенный смысл, чем нейтральный «признак».
- source_word: ὅταν
  choice: когда
  rationale: Передаёт временное придаточное с присущей греческой конструкции перспективой будущего события.
- source_word: μέλλῃ … συντελεῖσθαι
  choice: приблизится к завершению
  rationale: Формулировка сохраняет перспективно-имминентный оттенок μέλλω и значение достижения конца у συντελέω, оставаясь естественной на современном русском языке.
- source_word: ταῦτα … πάντα
  choice: всё это
  rationale: Естественно передаёт сочетание πάντα с указательным местоимением и сохраняет связь со всеми ранее упомянутыми событиями.
theological_decisions:
- issue: Эсхатологический оттенок μέλλῃ с инфинитивом
  choice: 'Сохранён смысл приближающегося завершения: «приблизится к завершению»'
  alternative: «когда всё это завершится»
  rationale: μέλλω добавляет перспективный оттенок предстоящего или близящегося действия. Перевод сохраняет его, не делая вывода о конкретной хронологии последних событий.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Двоеточие после «нам» естественно вводит два прямых вопроса. «Знамение» сохраняет традиционную библейскую окраску, а «приблизится к завершению» избегает как тяжеловесной буквальности, так и утраты оттенка μέλλω.
