base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: ru
  text: 'Когда же услышите о войнах и вести о войнах[a], не тревожьтесь: это должно произойти, но конец ещё не настал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слухи о войнах». Греческое слово может означать вести, сообщения или слухи о войнах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Когда же
  rationale: ὅταν вводит временное условие с будущей направленностью, а δέ служит мягкой связкой; «когда же» естественно передаёт оба элемента без чрезмерного противопоставления.
- source_word: ἀκούσητε
  choice: услышите о
  rationale: Аорист конъюнктива после ὅταν передаёт будущее возможное событие; русское «услышите о» идиоматично сочетается с последующими существительными.
- source_word: πολέμους
  choice: войнах
  rationale: Прямое и общепринятое соответствие множественному числу πόλεμος.
- source_word: ἀκοὰς πολέμων
  choice: военных известиях
  rationale: ἀκοή здесь может означать услышанные сведения, вести или слухи о войнах. «Военные известия» сохраняет широкое значение и избегает обязательного оттенка недостоверности.
- source_word: μὴ θροεῖσθε
  choice: не тревожьтесь
  rationale: θροέομαι обозначает сильное смятение или испуг; «не тревожьтесь» звучит естественно и достойно, не сводя смысл лишь к страху.
- source_word: δεῖ γενέσθαι
  choice: этому надлежит произойти
  rationale: δεῖ выражает необходимость, а γενέσθαι — наступление события. Местоимение «этому» естественно отсылает к войнам и известиям о них, не добавляя нового содержания.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: но это ещё не конец
  rationale: Фраза кратко и естественно сохраняет отрицание οὔπω и эсхатологическую открытость слова τέλος.
theological_decisions:
- issue: Эсхатологическая необходимость в δεῖ γενέσθαι
  choice: «этому надлежит произойти»
  alternative: «это должно произойти»
  rationale: «Надлежит» сохраняет сильный смысл необходимости, включая возможный пророческий или божественный аспект, но не навязывает конкретной эсхатологической системы и не объясняет механизм этой необходимости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Формулировка сохраняет краткость предупреждения и подлинную широту значения ἀκοή.
