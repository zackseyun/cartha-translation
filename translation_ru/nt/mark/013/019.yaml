id: MRK.13.19
reference: Mark 13:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: ru
  text: Ибо те дни будут временем такого бедствия, какого не было от начала творения, которое сотворил Бог, доныне[a] и никогда не будет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какого никогда не бывало от начала творения, которое сотворил Бог, доныне и никогда не будет».'
    reason: Возможен более слитный русский оборот, в котором отрицательное усиление относится ко всему временному сравнению; основной текст яснее сохраняет структуру греческого предложения.
lexical_decisions:
- source_word: θλῖψις
  choice: бедствие
  rationale: В данном эсхатологическом контексте слово обозначает чрезвычайно тяжёлое и всеохватное страдание. «Бедствие» звучит естественно и весомо в современном русском языке, не сужая смысл до гонения или личной скорби.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: те дни будут временем такого бедствия
  rationale: 'Греческая конструкция сжата: сами дни отождествляются с бедствием. Добавление «временем» делает фразу грамматически естественной по-русски, сохраняя предикативный смысл.'
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: такого ... какого не было
  rationale: Русская соотносительная конструкция передаёт уникальность бедствия и одновременно сохраняет заметное усиление греческого оборота.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: от начала творения
  rationale: «Творение» прямо передаёт κτίσις и сохраняет связь со следующим однокоренным глаголом, хотя по-русски повтор получается менее явным, чем в греческом.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: которое сотворил Бог
  rationale: Относительное предложение сохранено без сокращения; оно прямо называет Бога Творцом и отражает присутствующую в оригинале смысловую повторность.
- source_word: ἕως τοῦ νῦν
  choice: доныне
  rationale: Краткое литературное слово точно выражает временной предел и остаётся понятным современному читателю.
- source_word: οὐ μὴ γένηται
  choice: никогда не будет
  rationale: Сочетание «никогда» с будущим временем передаёт усиленное греческое отрицание, не добавляя отсутствующего в оригинале слова «снова».
theological_decisions:
- issue: Масштаб выражения «от начала творения»
  choice: Сохранена прямая отсылка ко всему Божьему творению.
  alternative: «От начала мира» или ограничение начала местным либо заветным событием.
  rationale: κτίσις и однокоренное ἔκτισεν при явном субъекте ὁ θεός указывают на сотворённый Богом порядок; перевод не сужает этот масштаб и не привязывает стих к определённой эсхатологической схеме.
- issue: Абсолютность заключительного отрицания
  choice: «никогда не будет»
  alternative: «больше не повторится».
  rationale: Так сохраняется категоричность οὐ μή и будущая направленность глагола, но не вводится дополнительное представление о повторении, которого греческий текст прямо не выражает.
translation_notes:
  register: Современный литературный, торжественный, но понятный регистр. Сохранены повтор «творения, которое сотворил» и абсолютное сравнение; синтаксическое добавление «временем» устраняет неестественное для русского языка прямое отождествление дней с бедствием.
