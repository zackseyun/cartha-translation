  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: ru
  text: чтобы он, придя внезапно, не застал вас спящими.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: чтобы … не
  rationale: Передаёт отрицательное предостережение/опасение, синтаксически зависящее от предыдущего контекста.
- source_word: ἐλθὼν ἐξαίφνης
  choice: придя внезапно
  rationale: Сохраняет обстоятельный аористный причастный оборот и наречие внезапности без перестройки в отдельное личное сказуемое.
- source_word: εὕρῃ
  choice: застал
  rationale: В данном контексте русское «застал» естественно передаёт смысл «нашёл в определённом состоянии».
- source_word: ὑμᾶς καθεύδοντας
  choice: вас спящими
  rationale: Сохраняет конструкцию «вас» с причастием, обозначающим состояние, в котором хозяин может обнаружить адресатов.
theological_decisions:
- issue: Буквальный или метафорический смысл сна
  choice: Сохранено простое «спящими» без пояснения
  alternative: «духовно спящими» или «небодрствующими»
  rationale: Греческий текст использует обычное καθεύδω; контекст придаёт ему нравственно-эсхатологическую силу, но перевод не должен устранять образ или добавлять толкование.
- issue: Неопределённый субъект глагола
  choice: «он»
  alternative: «хозяин дома»
  rationale: В стихе субъект подразумевается и определяется предыдущим контекстом; явное повторение «хозяин дома» было бы добавлением к данному греческому предложению.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. Порядок слов сохраняет акцент на внезапности прихода и опасности быть застигнутыми спящими.
