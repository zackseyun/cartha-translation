source:
  edition: SBLGNT
  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: ru
  text: 'И когда Он сидел на Масличной горе напротив храма[a], Пётр, Иаков, Иоанн и Андрей наедине спрашивали Его:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ἱερόν обозначает весь храмовый комплекс или его территорию, а не только внутреннее святилище (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: когда Он сидел
  rationale: Родительный самостоятельный оборот с причастием настоящего времени задаёт сопутствующее, продолжающееся обстоятельство; русская конструкция естественно передаёт эту сцену.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: на Масличной горе
  rationale: При глаголе положения εἰς здесь имеет локативный смысл; «Масличная гора» — укоренившееся русское географическое название.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: напротив храма
  rationale: κατέναντι означает расположение напротив или лицом к чему-либо; «храм» естественно в контексте, а точное значение ἱερόν разъяснено в сноске.
- source_word: ἐπηρώτα
  choice: спрашивали
  rationale: Имперфект представляет расспрос как разворачивающееся действие. Множественное число согласовано с последующим составным подлежащим, что допустимо при греческом глаголе в единственном числе перед перечислением.
- source_word: κατ’ ἰδίαν
  choice: наедине
  rationale: Передаёт значение разговора отдельно от остальных, в частной обстановке, кратко и естественно по-русски.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Пётр, Иаков, Иоанн и Андрей
  rationale: Использованы традиционные русские формы имён; греческое многосоюзие не воспроизведено механически ради естественного современного русского синтаксиса.
