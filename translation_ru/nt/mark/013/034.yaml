source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: ru
  text: 'Это подобно человеку, отправившемуся в путь: он оставил свой дом, дал своим рабам[a] полномочия, каждому — своё дело, а привратнику велел бодрствовать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугам»; греческое слово δοῦλοι означает рабов, находившихся в зависимости от хозяина в его доме.'
    reason: Уточняет социальный смысл исходного слова и отмечает допустимый контекстуальный вариант.
lexical_decisions:
- source_word: ὡς
  choice: Это как
  rationale: Передаёт вводимое сравнение и естественно связывает иллюстрацию с предшествующим призывом.
- source_word: ἄνθρωπος ἀπόδημος
  choice: человек, который, отправляясь в путь
  rationale: ἀπόδημος обозначает человека, покидающего своё место и находящегося вдали; формулировка выражает отъезд без излишнего уточнения цели или дальности поездки.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: оставил свой дом
  rationale: Сохраняет прямое значение οἰκία и последовательность действий, выраженную аористным причастием.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: дал своим рабам власть
  rationale: Передаёт δίδωμι и основное значение ἐξουσία как делегированной власти, не заменяя его более узким понятием ответственности.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: каждому — своё дело
  rationale: Сохраняет краткость и некоторую эллиптичность греческой фразы, а также распределительное значение ἑκάστῳ.
- source_word: τῷ θυρωρῷ
  choice: привратнику
  rationale: Обычное и точное русское обозначение человека, стерегущего вход.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: велел бодрствовать
  rationale: «Велел» сохраняет властный характер распоряжения, а «бодрствовать» передаёт как буквальное отсутствие сна, так и требуемую настороженность.
theological_decisions:
- issue: Передача δοῦλος в образе господского дома
  choice: рабы
  alternative: слуги
  rationale: В изображённом домашнем укладе δοῦλοι находятся под властью хозяина, поэтому «рабы» точнее передаёт социальное и правовое отношение. В сноске указано более мягкое контекстуальное соответствие «слуги».
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и образный. Тире в обороте «каждому — своё дело» сохраняет эллиптичность оригинала, не добавляя глагола «поручил».
