  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: ru
  text: 'Так и вы, когда увидите, что всё это происходит, знайте: это[a] близко, у самых дверей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он близок». В греческом тексте подлежащее прямо не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так и вы
  rationale: Передаёт связь с предшествующим сравнением о смоковнице и сохраняет акцент на учениках; по-русски звучит естественно.
- source_word: ὅταν ἴδητε
  choice: когда увидите
  rationale: ὅταν с аористом сослагательного наклонения обозначает ожидаемое будущее условие; «когда увидите» естественно передаёт его в данном контексте.
- source_word: ταῦτα γινόμενα
  choice: что всё это происходит
  rationale: Конструкция с «что» естественна в современном русском языке, а «всё это» сохраняет совокупный смысл множественного ταῦτα.
- source_word: γινώσκετε
  choice: знайте
  rationale: Прямо передаёт повелительное наклонение и требование сделать вывод по наблюдаемым признакам.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: он близко
  rationale: В греческом подлежащее не выражено. Русский допускает как личное, так и событийное восполнение; в основном тексте выбран личный вариант, естественно отсылающий к Сыну Человеческому в контексте, при сохранении альтернативы в сноске.
- source_word: ἐπὶ θύραις
  choice: у самых дверей
  rationale: Сохраняет множественное число θύραις и ясно передаёт идиому крайней близости; «самых» выражает усилительный смысл оборота без изменения его образности.
theological_decisions:
- issue: Неявное подлежащее при ἐγγύς ἐστιν
  choice: 'В основном тексте: «он близко».'
  alternative: «это близко» / «оно близко», то есть близко предсказанное событие или исполнение.
  rationale: Греческий текст не называет подлежащее, поэтому нельзя окончательно решить, имеется ли в виду Сын Человеческий или приближение предсказанного события. Личное прочтение естественно в контексте, но неоднозначность явно сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка краткая и понятная; образ множественного «дверей» сохранён вслед за греческим текстом. Маркер сноски поставлен непосредственно после восполненного местоимения, где возникает неоднозначность.
