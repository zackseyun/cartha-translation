id: MRK.13.22
reference: Mark 13:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: ru
  text: Ведь восстанут лжемессии[a] и лжепророки и явят знамения и чудеса, чтобы, если возможно[b], ввести в заблуждение избранных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лжехристы». Греческое слово образовано от Χριστός — титула со значением «Мессия».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «если бы это было возможно». Греческая формулировка прямо не решает, могут ли избранные в действительности быть введены в заблуждение; она указывает на цель обманщиков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: восстанут
  rationale: В данном контексте будущая пассивная форма идиоматически обозначает появление или выступление людей. «Восстанут» сохраняет пророческий тон и не приписывает их появление Богу.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит объяснение предшествующего предостережения; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: ψευδόχριστοι
  choice: лжемессии
  rationale: Сложное слово обозначает тех, кто ложно притязает на мессианский статус. Такой перевод ясен современному читателю и сохраняет титульное значение Χριστός.
- source_word: ψευδοπροφῆται
  choice: лжепророки
  rationale: Устойчивый и точный русский эквивалент сложного существительного.
- source_word: δώσουσιν
  choice: явят
  rationale: Буквально глагол значит «дадут», однако по-русски сочетание «дадут знамения и чудеса» неестественно. «Явят» точно передаёт совершение или предъявление знамений, не добавляя указания на их подлинность.
- source_word: σημεῖα καὶ τέρατα
  choice: знамения и чудеса
  rationale: Традиционное и понятное соответствие устойчивой греческой паре, сохраняющее различие между знамением и вызывающим изумление явлением.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: чтобы ... ввести в заблуждение
  rationale: Конструкция выражает цель. Русское выражение естественно передаёт намерение увести от истины.
- source_word: εἰ δυνατόν
  choice: если возможно
  rationale: Прямой перевод краткого условного оборота, который не решает, действительно ли избранных возможно ввести в заблуждение.
- source_word: τοὺς ἐκλεκτούς
  choice: избранных
  rationale: Сохраняет богословски значимый термин и остаётся естественным в русском библейском контексте.
theological_decisions:
- issue: Передача ψευδόχριστοι как мессианского титула
  choice: лжемессии
  alternative: лжехристы
  rationale: В сложном слове Χριστός употреблено как титул «Мессия». «Лжемессии» яснее выражает смысл притязаний и не превращает титул в имя.
- issue: Смысл εἰ δυνατόν относительно возможности обольщения избранных
  choice: если возможно
  alternative: если бы это было возможно
  rationale: Греческий текст формулирует условие, но сам по себе не уточняет, осуществима ли эта цель. Перевод сохраняет богословское напряжение и не усиливает оттенок невозможности.
- issue: Связь оборота εἰ δυνατόν
  choice: поместить «если возможно» перед инфинитивной группой «ввести в заблуждение избранных»
  alternative: «ввести в заблуждение, если возможно, избранных»
  rationale: Русский порядок слов устраняет неестественный разрыв сказуемого и дополнения, сохраняя оборот внутри выражения цели и не закрепляя спорное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Восстанут», «явят», «знамения» и «избранные» сохраняют достоинство и межтекстовую узнаваемость, не делая фразу архаичной. Порядок слов выбран естественный для русского языка, при этом условность εἰ δυνατόν сохранена.
