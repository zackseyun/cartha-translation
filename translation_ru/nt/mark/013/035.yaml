id: MRK.13.35
reference: Mark 13:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: ru
  text: 'Итак, бодрствуйте[a], потому что вы не знаете, когда придёт хозяин дома: вечером ли, в полночь, при пении петуха[b] или утром.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «будьте начеку». Повеление означает сохранять бдительность и готовность.
    reason: lexical_alternative
  - marker: b
    text: «Пение петуха» служило обозначением одной из ночных страж.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: бодрствуйте
  rationale: Повелительная форма выражает постоянную настороженность и готовность; «бодрствуйте» естественно для современного литературного русского и сохраняет как буквальный образ бодрствования ночью, так и переносный смысл бдительности.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего наставления и ясно связывает стих с контекстом.
- source_word: οὐκ οἴδατε
  choice: вы не знаете
  rationale: Прямая передача отрицательной формы глагола знания без неоправданного усиления.
- source_word: πότε
  choice: когда
  rationale: Естественная и точная передача косвенного вопроса о времени.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: хозяин дома
  rationale: В бытовом образе обозначает человека, обладающего властью над домом. «Хозяин дома» звучит естественно и не превращает выражение преждевременно в прямой титул.
- source_word: ἔρχεται
  choice: придёт
  rationale: Настоящее время имеет контекстуально будущее значение ожидаемого возвращения; в русском совершенный вид естественно выражает неизвестный момент прибытия.
- source_word: ὀψὲ
  choice: вечером
  rationale: В последовательности ночных страж обозначает вечернюю стражу, а не просто неопределённое «поздно».
- source_word: μεσονύκτιον
  choice: в полночь
  rationale: Обычное русское обозначение соответствующего времени ночи.
- source_word: ἀλεκτοροφωνίας
  choice: при пении петуха
  rationale: Передаёт название ночной стражи через понятный современному читателю временной ориентир, сохраняя образ греческого слова.
- source_word: πρωΐ
  choice: утром
  rationale: Естественно обозначает последнюю ночную стражу, переходящую в утро, без излишнего уточнения «на рассвете».
theological_decisions:
- issue: Передача κύριος в притчевом выражении, которое в образе означает домовладельца, но косвенно может указывать на Иисуса
  choice: хозяин дома
  alternative: Господин дома
  rationale: Непосредственный бытовой контекст требует обычного значения лица, распоряжающегося домом. «Хозяин» сохраняет смысл образа, не отрицая его более широкого христологического применения и не делая это применение явным сверх текста.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис сохраняет причинную связь и четырёхчастное перечисление ночных периодов; архаические «бдите» и «при петухах» не используются.
