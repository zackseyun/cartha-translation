  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: ru
  text: Будьте настороже, бодрствуйте, ведь вы не знаете, когда наступит время[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенное время», «решающий момент» или «срок». Греческое καιρός часто означает особое, решающее или назначенное время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Будьте настороже
  rationale: Форма повелительного наклонения употреблена как призыв к бдительности и осторожности, а не к зрительному восприятию; этот вариант естественен по-русски и не дублирует следующее повеление.
- source_word: ἀγρυπνεῖτε
  choice: бодрствуйте
  rationale: Передаёт как буквальный образ бодрствования, так и переносный смысл неослабевающей бдительности; соответствует возвышенному, но понятному регистру.
- source_word: οὐκ οἴδατε
  choice: вы не знаете
  rationale: Прямо передаёт отрицание глагола знания без необоснованного смыслового расширения.
- source_word: γὰρ
  choice: ведь
  rationale: Вводит основание для предшествующих повелений и естественно связывает части русского предложения.
- source_word: πότε
  choice: когда
  rationale: Наиболее прямой и естественный русский эквивалент наречия времени.
- source_word: ὁ καιρός
  choice: наступит время
  rationale: Существительное может обозначать особый, решающий или назначенный момент. Конструкция с «наступит» естественно передаёт по-русски выражение о приходе такого времени, не уточняя сверх греческого текста, что оно назначено.
- source_word: ἐστιν
  choice: наступит
  rationale: Греческая связка буквально означает «есть», однако в вопросе о будущем моменте русское «когда наступит время» звучит естественно и сохраняет смысл контекста.
theological_decisions:
- issue: Оттенок καιρός в эсхатологическом контексте
  choice: время
  alternative: назначенное время; решающий момент; срок
  rationale: В эсхатологической речи καιρός может указывать на особый или назначенный момент. Основной текст сохраняет более широкое «время», а возможный оттенок вынесен в примечание, чтобы не разрешать неоднозначность интерпретационно.
translation_notes:
  register: 'Современный литературный русский язык; краткий, настоятельный и достойный тон. Различие между двумя повелениями сохранено: первое призывает быть настороже, второе — продолжать бодрствовать.'
