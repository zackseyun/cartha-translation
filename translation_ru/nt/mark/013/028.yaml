  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: ru
  text: 'Возьмите урок[a] у смоковницы: когда её ветвь уже станет нежной и на ней распустятся листья, вы знаете, что лето близко.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притчу»; также возможно: «наглядное сравнение».'
    reason: Лексическая альтернатива для παραβολή; в этом контексте слово вводит наглядный урок, извлекаемый из примера смоковницы.
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν
  choice: Возьмите урок у смоковницы
  rationale: ἀπό с родительным указывает на источник научения, а μάθετε — повеление научиться. В данном контексте παραβολή обозначает наглядный урок или сравнение; естественное русское сочетание «возьмите урок» передаёт смысл без неясного выражения «научитесь притче».
- source_word: ὅταν
  choice: когда
  rationale: ὅταν с сослагательным наклонением вводит общее временное условие; русское «когда» естественно передаёт сезонную закономерность.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: её ветвь уже становится мягкой
  rationale: ἤδη сохранено словом «уже», κλάδος — «ветвь», а ἁπαλός описывает её мягкость и нежность при начале нового роста.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: распускаются листья
  rationale: ἐκφύω означает выпускать или отращивать; применительно к дереву современное русское «распускаются листья» ясно и естественно.
- source_word: γινώσκετε
  choice: вы знаете
  rationale: Форма здесь изъявительная и сообщает обычное узнавание признака, а не отдаёт второе повеление.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: лето близко
  rationale: θέρος имеет обычное значение «лето», а ἐγγύς указывает на временную близость.
theological_decisions:
- issue: Значение παραβολή в данном контексте
  choice: В основном тексте передано как «урок», а в сноске дано «притча».
  alternative: «Научитесь притче от смоковницы» или «поймите сравнение на примере смоковницы».
  rationale: Здесь παραβολή относится к наглядному сравнению со смоковницей. «Урок» делает функцию сравнения понятной современному читателю, тогда как сноска сохраняет связь с обычным евангельским термином «притча», не навязывая аллегорического толкования.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис слегка идиоматизирован ради естественности; сезонный образ и временное «уже» сохранены.
