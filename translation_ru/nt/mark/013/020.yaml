  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: ru
  text: И если бы Господь не сократил те дни, не спасся бы ни один человек[a]. Но ради избранных, которых Он избрал, Он сократил те дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «никакая плоть» — библейское обозначение людей; также: «никто».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: сократил
  rationale: Глагол означает «сократить, укоротить». «Сократил» естественно звучит по-русски применительно к дням и одинаково передаёт оба употребления.
- source_word: κύριος
  choice: Господь
  rationale: Прямой и традиционный эквивалент; в контексте это определённый референт, хотя в греческом перед словом нет артикля.
- source_word: τὰς ἡμέρας
  choice: те дни
  rationale: Указательное «те» естественно отсылает к периоду бедствия, описанному выше, не конкретизируя его сверх текста.
- source_word: οὐκ ἂν ἐσώθη
  choice: не спаслась бы
  rationale: Форма с ἄν выражает нереальное следствие. «Спаслась бы» сохраняет основное значение σῴζω, тогда как контекст указывает прежде всего на сохранение жизни.
- source_word: πᾶσα σάρξ
  choice: никакая плоть
  rationale: Сохранён буквальный библейский образ, обозначающий всё живое человечество; более ясный смысл дан в сноске.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: ради избранных
  rationale: διά с винительным выражает основание или действие в чью-либо пользу; «ради» передаёт это кратко и естественно.
- source_word: ἐκλεκτούς
  choice: избранных
  rationale: Устоявшийся библейский термин, который не навязывает конкретного конфессионального понимания избрания.
- source_word: οὓς ἐξελέξατο
  choice: которых Он избрал
  rationale: Прозрачно передаёт однокоренную связь с «избранных», присутствующую в греческом тексте, и сохраняет риторическое повторение.
theological_decisions:
- issue: Значение «спаслась» в контексте
  choice: Сохранено слово «спаслась», при этом непосредственный контекст указывает на физическое сохранение человеческой жизни во время бедствия.
  alternative: «не уцелел бы ни один человек»
  rationale: Перевод не сводит глагол только к вечному спасению и одновременно не устраняет его более широкого библейского звучания.
- issue: Кого обозначают «избранные»
  choice: Сохранено обозначение «избранные» без дальнейшего догматического уточнения.
  alternative: «те, кого Бог выбрал» с явно коллективным или индивидуально-предопределительным толкованием
  rationale: Стих утверждает, что они избраны, но сам по себе не разрешает богословские споры о характере избрания.
- issue: Субъект второго ἐκολόβωσεν
  choice: Местоимение «Он» отнесено к Господу и написано с прописной буквы по русской библейской традиции.
  alternative: Повторить «Господь сократил» или написать «он» со строчной буквы
  rationale: Греческий субъект подразумевается из первой части; местоимение делает русскую фразу ясной, не добавляя нового референта.
translation_notes:
  register: Современный литературный русский с торжественным библейским оттенком. Синтаксис условного предложения сохранён, а выражение «никакая плоть» оставлено в основном тексте как намеренно буквальный образ и разъяснено в сноске.
