lexical_decisions:
- source_word: τί γὰρ ὠφελεῖ
  choice: Ведь какая польза
  rationale: Риторический вопрос передан естественной русской конструкцией; «ведь» сохраняет пояснительную связь γάρ с предшествующим высказыванием.
- source_word: ἄνθρωπον
  choice: человеку
  rationale: ἄνθρωπος здесь имеет обобщённое значение; русское «человеку» естественно охватывает любого человека без необходимости отдельного культурного примечания.
- source_word: κερδῆσαι
  choice: приобретёт
  rationale: Глагол сохраняет образ приобретения и образует ясное смысловое противопоставление последующей потере.
- source_word: τὸν κόσμον ὅλον
  choice: весь мир
  rationale: Передаёт всеохватность выражения буквально и естественно для современного русского языка.
- source_word: ζημιωθῆναι
  choice: потеряет
  rationale: Пассивный инфинитив обозначает понесённый ущерб или утрату; в русском условном риторическом вопросе «потеряет» ясно и естественно противопоставлено «приобретёт».
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: свою жизнь
  rationale: В ближайшем контексте Мк 8:35–37 ψυχή прежде всего означает жизнь человека, которую можно сохранить или потерять; возвратное «свою» естественно передаёт αὐτοῦ при соотнесении с субъектом.
theological_decisions:
- issue: Значение ψυχή в изречении об ученичестве
  choice: жизнь
  alternative: душа; самого себя
  rationale: «Жизнь» лучше сохраняет связь с Мк 8:35 и не навязывает тексту узкую антропологическую схему. Однако ψυχή допускает значение «душа», поэтому эта подлинная смысловая возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Экономическое противопоставление приобретения и потери сохранено; традиционное «душа» вынесено в примечание как реальная лексическая альтернатива.
