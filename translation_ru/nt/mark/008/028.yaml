base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: ru
  text: 'Они сказали ему: «Иоанн Креститель; другие — Илия; а иные — один из пророков».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более явно: «Они сказали ему: “Одни говорят, что Ты Иоанн Креститель, другие — что Илия, а иные — что один из пророков”». В греческом тексте в последующих частях глагол «говорят» и подразумеваемое «Ты» не повторяются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Они
  rationale: Артикль с δέ возобновляет подлежащее и указывает на учеников из предшествующего контекста; слабая связующая сила δέ естественно остаётся невыраженной.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: сказали ему
  rationale: Сочетание личной формы и причастия от λέγω представляет собой обычную формулу введения речи. Буквальное «сказали ему, говоря» в современном русском тяжеловесно, поэтому конструкция естественно свёрнута без потери смысла.
- source_word: ὅτι
  choice: двоеточие и прямая речь
  rationale: ὅτι вводит содержание ответа; в русском это естественно передаётся прямой речью после двоеточия.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Иоанн Креститель
  rationale: Устоявшееся русское наименование исторического лица, понятное читателю и соответствующее причастию βαπτιστής.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: другие ... а иные
  rationale: Передаёт распределение мнений между разными группами; союз «а» отражает сопоставительную силу δέ без излишне резкого противопоставления.
- source_word: Ἠλίαν
  choice: Илия
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: один из пророков
  rationale: Сохраняется эллиптическая, сжатая форма греческого перечня; подразумеваемое «ты» или «ты —» не добавляется в основной текст.
- source_word: προφητῶν
  choice: пророков
  rationale: Стандартное соответствие προφήτης в контексте пророческих фигур Израиля.
theological_decisions:
- issue: Передача распространённых в народе отождествлений Иисуса
  choice: 'Ответ оформлен как краткий перечень: «Иоанн Креститель; другие — Илия; а иные — один из пророков».'
  alternative: «Одни говорят, что Ты Иоанн Креститель, другие — что Илия, а иные — что один из пророков».
  rationale: Греческий текст синтаксически сжат и оставляет подразумеваемую связку и местоимение невыраженными. Основной перевод сохраняет эту сжатость и не уточняет сверх источника, кто именно произносит каждое мнение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Эллиптический перечень сохранён, но прояснён тире; «а иные» естественно передаёт заключительное сопоставление.
