    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: В те дни
  rationale: Естественная русская передача обычного временного оборота, сохраняющая повествовательный фон.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: когда снова собралось множество народа
  rationale: Генитив абсолютный передан придаточным обстоятельства; πάλιν сохраняет значение повторения, а πολλοῦ ὄχλου — многочисленности собравшихся.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: и людям было нечего есть
  rationale: Причастная конструкция относится к собравшемуся народу; безличный русский оборот ясно и естественно передаёт отсутствие пищи.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: Иисус подозвал учеников
  rationale: «Подозвал» передаёт направленность действия к говорящему, заложенную в προσκαλέομαι. Имя «Иисус» восстановлено из контекста ради ясности русского предложения, тогда как притяжательное «своих» не добавляется.
- source_word: λέγει αὐτοῖς
  choice: говорит им
  rationale: Настоящее время сохраняет характерный для Марка исторический презенс и живость повествования.
theological_decisions:
- issue: Историческое настоящее в повествовании Марка
  choice: 'Сохранить настоящее время: «говорит им»'
  alternative: 'Сгладить временем прошедшим: «сказал им»'
  rationale: Это сохраняет дискурсивную особенность греческого текста и не придаёт ей дополнительного богословского значения.
- issue: Неявный субъект главного действия
  choice: Уточнить субъект словом «Иисус»
  alternative: Передать местоимением «Он»
  rationale: Греческий язык допускает невыраженный субъект, известный из контекста; в русском явное имя устраняет двусмысленность после упоминания народа, не меняя референта.
translation_notes:
  register: Современный литературный русский язык с естественным синтаксисом и умеренно возвышенным библейским регистром. Историческое настоящее сохранено; тяжёлая буквальная конструкция генитива абсолютного преобразована в придаточное времени.
