base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: ru
  text: 'В те дни, когда снова было много народа и им было нечего есть, Иисус подозвал учеников и говорит им[a]:'
  philosophy: optimal-equivalence
  footnotes:
