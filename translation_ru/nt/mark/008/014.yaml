source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: ru
  text: Они забыли взять с собой хлеб[a], и в лодке у них была всего одна буханка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «хлебы». Множественное число греческого слова ἄρτους может обозначать отдельные буханки, но здесь, вероятно, имеется в виду хлеб как дорожный припас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: забыли
  rationale: Аорист ἐπιλανθάνομαι обозначает предшествующее действие, объясняющее отсутствие припасов; в русском повествовании простое прошедшее «забыли» естественно передаёт эту временную связь.
- source_word: λαβεῖν
  choice: взять с собой
  rationale: Инфинитив дополняет «забыли» и означает, что ученики не захватили хлеб в дорогу; «с собой» ясно выражает подразумеваемое направление действия.
- source_word: ἄρτους
  choice: хлеб
  rationale: Форма множественного числа может буквально обозначать отдельные хлебы или буханки, но здесь естественно понимается как хлеб, взятый в качестве припасов.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: всего одна буханка
  rationale: 'Оборот εἰ μή имеет исключительное значение: при них находилась только одна буханка. «Всего» естественно передаёт ограничительный смысл.'
- source_word: οὐκ εἶχον μεθ’ ἑαυτῶν
  choice: у них была всего
  rationale: Русская конструкция с «у них была» естественно выражает наличие при себе; ограничение передано словом «всего» вместе с исключительным оборотом.
- source_word: ἐν τῷ πλοίῳ
  choice: в лодке
  rationale: Прямое и естественное обозначение места действия.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка проста и повествовательно естественна. «Буханка» употреблена для счётного значения ἄρτον в единственном числе, а «хлеб» — для общего значения формы множественного числа.
