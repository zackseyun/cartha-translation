  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: ru
  text: 'Его ученики ответили Ему: «Откуда здесь, в пустынной местности, кто-нибудь сможет досыта накормить этих людей хлебом?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: ответили
  rationale: Обычный повествовательный глагол ответа; естественно передаёт форму множественного числа.
- source_word: ὅτι
  choice: двоеточие и кавычки
  rationale: После глагола речи частица вводит прямую речь и в современном русском естественно передаётся пунктуацией.
- source_word: Πόθεν
  choice: Откуда
  rationale: Сохраняет буквальный вопрос об источнике необходимого хлеба, не заменяя его более толковательным «как».
- source_word: τούτους
  choice: этих людей
  rationale: Местоимение указывает на собравшихся; добавление «людей» делает референт ясным, не ограничивая его мужчинами.
- source_word: δυνήσεταί τις
  choice: кто-нибудь сможет
  rationale: Передаёт неопределённое τις и будущее значение формы δύναμαι.
- source_word: ὧδε
  choice: здесь
  rationale: Прямой и естественный эквивалент наречия места.
- source_word: χορτάσαι
  choice: досыта накормить
  rationale: Передаёт не просто кормление, а насыщение пищей; по-русски это естественнее буквального «насытить хлебом».
- source_word: ἄρτων
  choice: хлебом
  rationale: Сохраняет прямое наименование пищи без неоправданного уточнения «буханками» или обобщения «едой».
- source_word: ἐπ’ ἐρημίας
  choice: в безлюдном месте
  rationale: Передаёт значение пустынной, необитаемой местности современным и понятным выражением.
