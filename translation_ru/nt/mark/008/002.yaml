  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: ru
  text: 'Мне жаль этих людей: они уже три дня остаются со Мной, и им нечего есть.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Мне жаль
  rationale: Глагол выражает глубокое сострадание. «Мне жаль» естественно звучит по-русски и сохраняет настоящее время, не добавляя причин или действий, которых нет в тексте.
- source_word: ἐπὶ τὸν ὄχλον
  choice: этих людей
  rationale: Предлог с винительным обозначает объект сострадания. В данном контексте ὄχλος — собравшееся множество; после «Мне жаль» естественное русское управление требует винительного падежа, а «эти люди» звучит живее и яснее, чем формальное «толпа».
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι вводит основание сострадания. В прямой речи современное русское двоеточие естественно передаёт пояснительно-причинную связь без тяжеловесного повтора «потому что».
- source_word: ἤδη ἡμέραι τρεῖς
  choice: уже три дня
  rationale: Сохраняются как достигнутая продолжительность, выраженная ἤδη, так и временной период в три дня.
- source_word: προσμένουσίν μοι
  choice: остаются со Мной
  rationale: προσμένω обозначает продолжающееся пребывание при ком-либо. Настоящее «остаются» сохраняет форму греческого глагола и подчёркивает, что люди всё ещё находятся с Иисусом.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: им нечего есть
  rationale: Естественная русская конструкция точно передаёт отсутствие у них пищи; инфинитив соответствует идиоматическому значению τί с сослагательным наклонением.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, ясный и достойный. Прописная буква в «Мной» следует принятой русской библейской орфографической традиции при местоимении, относящемся к Иисусу. Причинная связь передана двоеточием; допустимый более явный вариант — «Мне жаль этих людей, потому что…».
