  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: ru
  text: И Он строго велел им никому не говорить о Нём[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запретил им»; греческий глагол может также означать «упрекнул их» или «строго приказал им».'
    reason: 'Лексическая широта глагола ἐπιτιμάω: в данном контексте он обозначает строгое распоряжение, хотя его обычное значение также включает упрёк или порицание.'
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: строго велел
  rationale: Глагол передаёт властное и настойчивое распоряжение. В данном контексте «строго велел» естественно выражает силу запрета, не создавая впечатления, будто Иисус упрекал учеников за уже совершённый проступок.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения во множественном числе относится к ученикам, к которым обращается Иисус.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: никому не говорить
  rationale: После глагола распоряжения конструкция ἵνα с сослагательным наклонением передаёт содержание повеления. Русский инфинитив с отрицательным местоимением звучит естественно и точно.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Предлог περί с родительным падежом означает «о, относительно». Местоимение относится к Иисусу; прописная буква соответствует принятому русскому библейскому оформлению.
theological_decisions:
- issue: Сила запрета Иисуса в контексте сокрытия Его мессианской идентичности
  choice: Передать властный и строгий запрет, не объясняя его причины внутри перевода.
  alternative: «запретил им» или более буквально «упрекнул их»
  rationale: Стих подчёркивает настойчивость распоряжения, но не раскрывает здесь причины молчания. Формулировка сохраняет эту богословскую напряжённость и не вводит теорию о так называемой мессианской тайне.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Частица «И» сохраняет связь с предыдущим стихом, а «строго велел» передаёт силу греческого глагола без архаизма.
