  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: ru
  text: 'И Он спрашивал их: «А вы кем считаете Меня?» Пётр ответил Ему: «Ты — Мессия[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Традиционная альтернативная передача греческого титула ὁ χριστός.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: спрашивал
  rationale: Имперфект передан глаголом несовершенного вида, что сохраняет представление о разворачивающемся в повествовании вопросе и не уточняет без необходимости, был ли он повторным.
- source_word: Ὑμεῖς δὲ
  choice: А вы
  rationale: Явное местоимение ὑμεῖς несёт смысловое ударение, а δέ противопоставляет учеников людям, о которых говорилось ранее; естественное русское «А вы» передаёт и контраст, и акцент.
- source_word: τίνα με λέγετε εἶναι
  choice: кем считаете Меня
  rationale: Естественная русская передача конструкции с винительным падежом и инфинитивом. Она сохраняет вопрос о том, кем ученики признают Иисуса, не прибегая к неуклюжему буквализму «кем говорите Меня быть».
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: Пётр ответил Ему
  rationale: Причастие и историческое настоящее объединены в естественную русскую повествовательную форму прошедшего времени без утраты функции реплики-ответа.
- source_word: Σὺ εἶ
  choice: Ты —
  rationale: Явное местоимение сохранено; именная конструкция с тире естественно передаёт исповедальное утверждение и его смысловой акцент.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь χριστός употреблено как титул «Помазанник». «Мессия» естественно и узнаваемо передаёт его иудейский мессианский смысл, а традиционный вариант «Христос» указан в сноске.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В ответе Петра слово обозначает титул, а не личное имя. «Мессия» сохраняет значение ожидаемого Помазанника и не добавляет конфессионально специфического толкования; традиционная передача отмечена как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Заглавные буквы в местоимениях «Он», «Меня», «Ему», «Ты» следуют принятой русской благоговейной издательской традиции; текст остаётся понятным без архаизмов.
