translation:
  language: ru
  text: Что может человек дать в обмен на свою жизнь?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душу»; греческое слово может означать «жизнь», «самого себя» или «душу» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Что
  rationale: Вопросительное τί передано словом «что». Связующая частица γάρ объясняет предыдущее высказывание; в русском риторическом вопросе эта связь естественно передаётся самим продолжением мысли, без тяжеловесного «ибо».
- source_word: δοῖ
  choice: может дать
  rationale: Аористный конъюнктив δίδωμι в риторическом вопросе выражает мыслимую возможность; «может дать» ясно и естественно передаёт эту силу.
- source_word: ἄνθρωπος
  choice: человек
  rationale: ἄνθρωπος здесь употреблено обобщённо. Русское «человек» точно сохраняет единственное число и универсальный смысл.
- source_word: ἀντάλλαγμα
  choice: в обмен
  rationale: Существительное обозначает то, что дают взамен. Оборот «дать в обмен» естественно выражает это значение по-русски.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: за свою жизнь
  rationale: В контексте Мк 8:35–37 ψυχή обозначает жизнь человека и одновременно его самого. «Свою жизнь» ясно связано с предыдущими стихами, а более традиционное «душу» сохранено в примечании.
theological_decisions:
- issue: Передача ψυχή в контексте спасения и утраты
  choice: жизнь
  alternative: душа; самого себя
  rationale: Контекст связывает ψυχή с жизнью, которую можно потерять или спасти, но смысл не сводится к биологическому существованию и охватывает всего человека. Основной текст сохраняет контекстуальную ясность, а примечание — смысловую и богословскую многослойность.
translation_notes:
  register: Современный литературный русский язык; краткий и выразительный риторический вопрос. Формулировка «свою жизнь» естественна для русского и явно соотносит предмет обмена с самим человеком.
