  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: ru
  text: Их было около четырёх тысяч, и он отпустил[a] их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распустил».'
    reason: 'Лексический вариант: ἀπολύω в отношении собравшейся толпы может означать «отпустить» или «распустить».'
lexical_decisions:
- source_word: ἦσαν
  choice: их было
  rationale: Экзистенциальное употребление εἰμί естественно передаётся по-русски безличной конструкцией; местоимение «их» указывает на численность собравшихся.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабый повествовательный связующий элемент не требует отдельного слова в русском; связь с контекстом сохраняется самой конструкцией предложения.
- source_word: ὡς
  choice: около
  rationale: Перед числительным слово обозначает приблизительность количества.
- source_word: τετρακισχίλιοι
  choice: четырёх тысяч
  rationale: Прямая и естественная передача числительного с учётом русской конструкции «их было».
- source_word: καὶ
  choice: и
  rationale: Сохраняет простую повествовательную связь между сообщением о числе людей и последующим действием Иисуса.
- source_word: ἀπέλυσεν
  choice: отпустил
  rationale: В данном контексте глагол означает, что Иисус позволил собравшимся уйти после насыщения; «отпустил» естественно и сохраняет широту значения.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к упомянутым людям и прямо передаётся русским «их».
theological_decisions: []
