  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: ru
  text: 'И Он настойчиво предупреждал их: «Смотрите, берегитесь закваски[a] фарисеев и закваски Ирода».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Закваска» употреблена образно; в этом стихе не уточняется, что именно она означает в связи с фарисеями и Иродом. Сравните Мф. 16:6, 12; Лк. 12:1.
    reason: metaphor_clarification_and_cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: настойчиво предупреждал
  rationale: Имперфект передаёт продолженное или повторяющееся действие, а сам глагол в данном контексте — серьёзное предостережение. Такая передача естественна по-русски и не превращает слова Иисуса в однократный формальный приказ.
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание предостережения; в современном русском это естественно передаётся конструкцией с двоеточием без отдельного «говоря».
- source_word: Ὁρᾶτε, βλέπετε
  choice: Смотрите, берегитесь
  rationale: Два близких по смыслу повелительных глагола образуют усиленное предостережение. Сочетание сохраняет риторическое удвоение и звучит естественно и весомо.
- source_word: ἀπὸ
  choice: берегитесь закваски
  rationale: При глаголе «беречься» русский родительный падеж естественно выражает удаление от опасности, соответствуя греческому ἀπό.
- source_word: ζύμης
  choice: закваски
  rationale: «Закваска» — понятный современному читателю библейский образ проникающего воздействия; он лучше сохраняет метафору, чем буквальное пояснение её смысла.
- source_word: τῶν Φαρισαίων
  choice: фарисеев
  rationale: Стандартное русское название группы; родительный падеж сохраняет ассоциативную связь с закваской.
- source_word: Ἡρῴδου
  choice: Ирода
  rationale: Текст прямо называет Ирода и ставит его параллельно фарисеям; перевод не расширяет значение до его сторонников, двора или влияния.
theological_decisions:
- issue: Смысл метафоры «закваска»
  choice: Сохранить метафору без истолкования в основном тексте
  alternative: учение; лицемерие; разлагающее влияние
  rationale: В данном стихе Марк не уточняет, какую именно сторону влияния фарисеев и Ирода обозначает образ. Пояснительная сноска отмечает общий смысл, не устраняя намеренную смысловую открытость текста.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Обращение «Смотрите, берегитесь» сохраняет эмфатическое удвоение оригинала. Заглавная буква в местоимении «Он» следует принятому почтительному библейскому регистру; метафора «закваска» оставлена без конфессионального истолкования.
