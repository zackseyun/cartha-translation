revisions:
- from: Он велел народу расположиться на земле[a]. Затем, взяв семь хлебов и воздав благодарение, Он разломил их и стал передавать Своим ученикам, чтобы те раздавали их народу[b]; и они раздали их народу.
  to: Он велел народу расположиться на земле[a]. Затем, взяв семь хлебов и воздав благодарение, Он разломил их и давал Своим ученикам, чтобы те подавали их народу[b]; и они подали их народу.
  rationale: Исправлены два глагола подачи пищи, чтобы сохранить конкретный смысл παρατίθημι («ставить перед, подавать») в целевой конструкции и в последующем повествовании. «Давал Своим ученикам» точнее передаёт продолженное действие ἐδίδου, не добавляя акцента на его начало. Остальные решения сохранены как точные и стилистически приемлемые.
