  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: ru
  text: Он велел народу расположиться на земле[a]. Затем, взяв семь хлебов и воздав благодарение, Он разломил их и давал Своим ученикам, чтобы те подавали их народу[b]; и они подали их народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возлечь на земле». Греческий глагол точнее указывает на положение полулёжа, принятое во время еды.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «ставили перед народом». То есть подавали пищу народу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: велел
  rationale: Глагол обозначает авторитетное распоряжение. «Велел» естественно для современного русского повествования; историческое настоящее передано прошедшим временем.
- source_word: ἀναπεσεῖν
  choice: расположиться
  rationale: В данном контексте речь идёт о принятии положения для еды, обычно полулёжа. «Расположиться» звучит естественно и не создаёт ложного впечатления, будто людям предписано лечь плашмя.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Здесь γῆ означает поверхность земли, на которой размещается народ.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: взяв семь хлебов
  rationale: В библейском повествовательном контексте «хлебы» естественно обозначает отдельные буханки или лепёшки и сохраняет традиционный образ без громоздкого уточнения.
- source_word: εὐχαριστήσας
  choice: воздав благодарение
  rationale: Передаёт благодарение над пищей, не добавляя прямо не названного в греческом тексте объекта благодарности.
- source_word: ἔκλασεν
  choice: разломил их
  rationale: Подразумеваемый объект — семь хлебов; местоимение добавлено по нормам русского языка для ясности.
- source_word: ἐδίδου
  choice: стал передавать
  rationale: Имперфект выражает продолжавшееся или повторявшееся действие. «Стал передавать» передаёт процесс, не утверждая больше, чем позволяет форма.
- source_word: ἵνα παρατιθῶσιν
  choice: чтобы те раздавали их народу
  rationale: Буквально глагол означает «ставить/класть перед», особенно пищу. В сцене кормления естественное русское «раздавали» точно передаёт функцию действия; буквальный образ отмечен в сноске.
- source_word: παρέθηκαν
  choice: они раздали их народу
  rationale: Аорист сообщает о совершённом действии учеников. Повтор «раздали» сохраняет связь с предшествующей целевой конструкцией.
- source_word: ὄχλος
  choice: народ
  rationale: В этом контексте «народ» — естественное современное обозначение собравшегося множества людей; оно избегает разговорного оттенка слова «толпа».
theological_decisions:
- issue: Последовательность повествования и евхаристический оттенок
  choice: εὐχαριστήσας передано как «воздав благодарение» без специальной сакраментальной терминологии
  alternative: «совершив евхаристию» или иная формулировка с явно выраженным литургическим смыслом
  rationale: Слова могут вызывать ассоциацию с позднейшей христианской практикой, однако непосредственно здесь описано благодарение над пищей. Перевод сохраняет возможный оттенок, но не превращает его в добавленное учение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные местоимения по отношению к Иисусу использованы последовательно в рамках принятой русской издательской нормы. Синтаксис сделан плавным, при этом сохранены последовательность действий и длительный оттенок ἐδίδου.
