id: MRK.8.34
reference: Mark 8:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: ru
  text: 'Подозвав к себе народ вместе со Своими учениками, Он сказал им: «Если кто хочет[a] идти за Мной, пусть отречётся от себя, возьмёт свой крест[b] и следует за Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если кто желает идти за Мной».'
    reason: Лексический вариант передачи θέλει.
  - marker: b
    text: Выражение «возьмёт свой крест» сохраняет буквальный образ креста, не заменяя его лишь представлением о бремени или трудностях.
    reason: Историко-культурное пояснение образа.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвав к себе
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу; «подозвав к себе» естественно передаёт как последовательность, так и направленность призыва к говорящему.
- source_word: τὸν ὄχλον
  choice: народ
  rationale: В данном повествовательном контексте «народ» — естественное современное обозначение собравшейся группы людей; оно не придаёт выражению архаического звучания.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: вместе со Своими учениками
  rationale: 'Сохраняется значение совместности: Иисус обращается и к народу, и к ученикам.'
- source_word: Εἴ τις θέλει
  choice: Если кто хочет
  rationale: Условная конструкция выражает открытый призыв к любому человеку; «хочет» естественно передаёт θέλει, не ослабляя последующих требований.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: идти за Мной
  rationale: Выражение сохраняет образ движения за Иисусом и при этом не дублирует буквально последующий глагол ἀκολουθέω.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: пусть отречётся от себя
  rationale: Передаёт повелительную силу формы и смысл отказа признавать собственное «я» определяющим, не сводя выражение к отдельным бытовым лишениям.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: возьмёт свой крест
  rationale: Сохраняются конкретный образ креста и личное притяжательное значение αὐτοῦ без замены образа общим понятием бремени.
- source_word: ἀκολουθείτω μοι
  choice: следует за Мной
  rationale: Несовершенный вид передаёт продолжающееся следование, соответствуя настоящему императиву; частица «пусть» в начале ряда распространяется и на этот глагол.
theological_decisions:
- issue: Сила требований ученичества
  choice: 'Открытое условие «если кто хочет» сочетается с повелениями: «пусть отречётся… возьмёт… и следует».'
  alternative: Передача всех повелений повторяющейся конструкцией «должен».
  rationale: Греческий текст соединяет добровольное желание идти за Иисусом с обязательными императивами, не разрешая напряжения между приглашением и требованием.
- issue: Значение σταυρός
  choice: Буквальный образ «крест».
  alternative: «Бремя», «страдание» или только «мученичество».
  rationale: Образ связан с реальным орудием римской казни и одновременно используется как метафора цены ученичества; более отвлечённая замена неоправданно сузила бы или смягчила смысл.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным, но не архаичным синтаксисом. Совершенный вид в первых двух повелениях отражает аористные императивы, а несовершенный вид «следует» — продолжающийся характер настоящего императива. Местоимения, относящиеся к Иисусу, оформлены с прописной буквы согласно распространённой русской библейской издательской традиции; это орфографический выбор, а не добавление смыслового различия.
