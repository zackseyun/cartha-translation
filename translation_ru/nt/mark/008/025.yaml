  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: ru
  text: Затем Он снова возложил руки ему на глаза[a]. Тот стал ясно видеть, зрение его восстановилось, и он отчётливо видел всё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях эта часть стиха имеет иную формулировку, отражённую в таких переводах: «Он пристально посмотрел, зрение его восстановилось, и он стал ясно видеть всё».'
    reason: textual_variant
  - marker: b
    text: 'Или: «и мог ясно видеть всё». Последняя часть фразы сочетает глагол в имперфекте с наречием, обозначающим ясное, отчётливое зрение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Затем… снова
  rationale: «Затем» передаёт последовательность, выраженную εἶτα, а «снова» — повторность действия, выраженную πάλιν.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: Он… возложил руки ему на глаза
  rationale: «Возложил руки» естественно передаёт устойчивое сочетание с ἐπιτίθημι и сохраняет конкретное физическое действие; местоименная конструкция «ему на глаза» звучит по-русски естественнее, чем буквальное «на его глаза».
- source_word: διέβλεψεν
  choice: стал ясно видеть
  rationale: διαβλέπω здесь обозначает обретение ясного зрения после первоначального частичного исцеления. Перевод не привносит значение «пристально посмотрел», связанное с иным прочтением текста.
- source_word: ἀπεκατέστη
  choice: зрение его восстановилось
  rationale: ἀποκαθίστημι означает возвращение в прежнее или нормальное состояние. Явно названное «зрение» делает русскую фразу понятной, не добавляя нового смыслового содержания.
- source_word: ἐνέβλεπεν
  choice: видел
  rationale: Русский глагол несовершенного вида естественно передаёт имперфект и сохраняет длительное или результирующее состояние после восстановления зрения.
- source_word: τηλαυγῶς
  choice: отчётливо
  rationale: Наречие указывает на ясность, различимость зрения; «отчётливо» передаёт это значение и избегает неуклюжего повторения слова «ясно».
- source_word: ἅπαντα
  choice: всё
  rationale: Субстантивированная форма среднего рода множественного числа идиоматически означает все видимые предметы, то есть «всё».
theological_decisions:
- issue: Последовательный характер исцеления в два этапа
  choice: 'Сохранена последовательность: человек стал ясно видеть, его зрение восстановилось, после чего он продолжал отчётливо видеть всё.'
  alternative: Свести все глаголы к одному сообщению о мгновенном полном исцелении.
  rationale: Цепочка греческих глаголов, включая имперфект ἐνέβλεπεν, изображает развитие действия и последующее состояние. Перевод не сглаживает эту повествовательную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Местоимение «Он» относится к Иисусу и оформлено с традиционной прописной буквы; «тот» недвусмысленно обозначает исцелённого человека. Несовершенный вид «видел» сохраняет аспектуальное отличие заключительного глагола.
