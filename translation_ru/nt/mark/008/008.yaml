  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: ru
  text: И они поели и насытились, а затем собрали семь корзин оставшихся кусков.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое σπυρίδες означает «корзины», вероятно, более крупные; при насыщении пяти тысяч в Мк 6:43 Марк употребляет другое слово — κόφινοι.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ели
  rationale: Аорист ἐσθίω передаёт простое завершённое действие в повествовании; «ели» естественно сочетается с последующим «насытились».
- source_word: ἐχορτάσθησαν
  choice: насытились
  rationale: Глагол означает, что люди получили достаточно пищи и наелись досыта; «насытились» кратко и точно передаёт этот смысл.
- source_word: ἦραν
  choice: наполнили
  rationale: Буквально глагол означает «подняли, собрали». В сочетании с количеством корзин русский идиоматически выражает результат сбора словом «наполнили», хотя подразумеваемое наполнение не названо отдельным глаголом в греческом.
- source_word: περισσεύματα κλασμάτων
  choice: оставшимися кусками
  rationale: Сочетание обозначает остатки от разломанной пищи; русский творительный после «наполнили» ясно и естественно передаёт их как содержимое корзин.
- source_word: ἑπτὰ σπυρίδας
  choice: семь больших корзин
  rationale: σπυρίς — корзина или плетёная ёмкость, вероятно более крупная, чем κόφινος в Мк 6:43. Определение «больших» помогает сохранить лексическое различие.
