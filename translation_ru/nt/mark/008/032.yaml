  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: ru
  text: И Он говорил об этом открыто[a]. Пётр, отведя Его в сторону, стал упрекать Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прямо», «без обиняков». Греческое слово указывает на открытую, откровенную речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: открыто
  rationale: Передаёт откровенный, прямой и нескрываемый характер речи; примечание сохраняет возможный оттенок «прямо».
- source_word: τὸν λόγον
  choice: об этом
  rationale: Артикль и контекст связывают выражение с непосредственно предшествующим предсказанием Иисуса. Буквальное «это слово» в современном русском здесь звучит менее естественно.
- source_word: ἐλάλει
  choice: говорил
  rationale: Несовершенный вид естественно передаёт продолженное значение греческого имперфекта.
- source_word: προσλαβόμενος
  choice: отвёл Его в сторону
  rationale: В данном контексте причастие означает, что Пётр отвёл Иисуса в сторону для отдельного разговора.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: начал Ему возражать
  rationale: Сохраняет начинательное значение конструкции и передаёт резкое неодобрение, не создавая в русском неуместного впечатления, будто Пётр обладал законным правом наставлять Иисуса.
theological_decisions:
- issue: Сила глагола ἐπιτιμάω применительно к словам Петра, обращённым к Иисусу
  choice: возражать
  alternative: укорять; порицать
  rationale: Греческий глагол обозначает резкий упрёк или выговор. «Возражать» естественно в современном русском и сохраняет повествовательную напряжённость, хотя несколько смягчает силу; поэтому в основном тексте сохранена начинательная конструкция, а выбор не превращён в doctrинальное истолкование.
- issue: Значение παρρησίᾳ в описании предсказания страданий
  choice: открыто
  alternative: прямо; без обиняков; смело
  rationale: Контекст подчёркивает ясность и нескрываемость речи Иисуса, объясняющую реакцию Петра; перевод не сводит слово только к публичности или смелости.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Местоимения, относящиеся к Иисусу, даны с прописной буквы согласно распространённой русской библейской традиции. Синтаксис сохраняет последовательность греческого повествования без неестественного буквализма.
