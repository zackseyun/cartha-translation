  terminology: «Упрекать» является естественным современным соответствием ἐπιτιμάω в данном контексте и не предполагает, что Пётр обладал каким-либо правом наставлять Иисуса. Прописное написание местоимений соответствует заявленной библейской редакционной традиции.
