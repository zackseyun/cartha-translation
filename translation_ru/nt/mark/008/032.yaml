  rationale: Заменено «начал Ему возражать» на «стал упрекать Его», чтобы точно передать силу ἐπιτιμάω, не добавляя интерпретации. «Отведя Его в сторону» яснее отражает греческое причастие προσλαβόμενος и сохраняет естественный русский порядок повествования.
