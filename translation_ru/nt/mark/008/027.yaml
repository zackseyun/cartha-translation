source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: ru
  text: 'Иисус и Его ученики отправились в селения Кесарии Филипповой. По дороге Он спрашивал Своих учеников: «Кем люди считают Меня?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: пошёл
  rationale: Передаёт начало и направленность движения естественным русским глаголом; буквальное «вышел» здесь без обозначения исходного места звучало бы неполно.
- source_word: κώμας
  choice: селения
  rationale: κώμη обозначает небольшие населённые пункты, обычно деревни или посёлки; «селения» сохраняет широту значения во множественном числе.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Кесарии Филипповой
  rationale: Устоявшаяся русская форма географического названия, отличающая этот город от других Кесарий.
- source_word: ἐν τῇ ὁδῷ
  choice: по дороге
  rationale: Естественный современный эквивалент, сохраняющий как конкретное путешествие, так и важный для повествования Марка мотив пути.
- source_word: ἐπηρώτα
  choice: спрашивал
  rationale: Несовершенный вид передаёт имперфект — действие, разворачивавшееся во время пути.
- source_word: λέγων αὐτοῖς
  choice: двоеточие перед прямой речью
  rationale: Греческая формула «спрашивал их, говоря им» в современном русском естественно оформляется глаголом речи и прямой речью без избыточного «говоря им».
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: За кого люди Меня принимают?
  rationale: Идиоматически передаёт вопрос о том, кем люди считают Иисуса; «люди» точно отражает обобщённое значение ἄνθρωποι без ограничения мужчинами.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: с учениками / Своих учеников
  rationale: При первом упоминании принадлежность естественно выражена контекстом совместности; при втором возвратное «Своих» явно передаёт αὐτοῦ и соответствует русской норме.
theological_decisions:
- issue: Обобщённое значение ἄνθρωποι в вопросе Иисуса
  choice: люди
  alternative: мужчины; люди вообще
  rationale: В данном контексте существительное обозначает общество в целом, а не только лиц мужского пола.
- issue: Смысл вопроса τίνα ... εἶναι
  choice: За кого люди Меня принимают?
  alternative: Кем, по словам людей, Я являюсь?
  rationale: Выбранная формулировка сохраняет вопрос об идентичности Иисуса и не уточняет заранее возможный богословский ответ.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Синтаксис упрощён там, где буквальное воспроизведение греческого причастия было бы неестественно, при сохранении повествовательного аспекта и смысловой напряжённости вопроса.
