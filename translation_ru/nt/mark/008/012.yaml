  source_fidelity: 'Текст точно передаёт греческий оригинал: усиленное ἀναστενάξας отражено как «глубоко вздохнув», τῷ πνεύματι αὐτοῦ сохранено как «в духе Своём», историческое настоящее λέγει передано формой «говорит». «Почему» верно выражает идиоматическое τί, а «ищет знамения» сохраняет значение ζητεῖ σημεῖον, не усиливая его до «требует». Отрицательное «не будет дано» корректно раскрывает смысл клятвенной εἰ-конструкции.'
