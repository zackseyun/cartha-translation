  terminology: «Поколение», «знамение», «истинно говорю вам» терминологически последовательны и подходят контексту. Прописная буква в «Своём» соответствует заявленной библейской издательской конвенции. Сноска точно объясняет формально условную, но по смыслу отрицательную конструкцию без внесения доктринальных интерпретаций.
