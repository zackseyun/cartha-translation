source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: ru
  text: 'Глубоко вздохнув в духе Своём, Он говорит: «Почему это поколение ищет знамения? Истинно говорю вам: не будет дано этому поколению знамения[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если будет дано этому поколению знамение». Это клятвенная формула, выражающая решительное отрицание: знамение не будет дано.'
    reason: Сохранение формальной особенности и подлинной риторической напряжённости греческой конструкции.
lexical_decisions:
- source_word: ἀναστενάξας
  choice: глубоко вздохнув
  rationale: Передаёт усиленное значение глагола с ἀνα- и внутреннюю тяжесть реакции, оставаясь естественным по-русски.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: в духе Своём
  rationale: Сохраняет антропологическую лексику и дательный сферы исходного текста, не сводя выражение лишь к значению «про Себя».
- source_word: λέγει
  choice: Он говорит
  rationale: Настоящее время сохраняет характерное для Марка живое историческое настоящее.
- source_word: Τί
  choice: Почему
  rationale: В данном вопросительном обороте τί выражает причину; «почему» естественно и точно передаёт смысл.
- source_word: γενεὰ
  choice: поколение
  rationale: Сохраняет корпоративный и временной оттенки греческого слова.
- source_word: ζητεῖ
  choice: ищет
  rationale: Прямое соответствие греческому глаголу; не усиливает его до «требует», хотя контекст носит конфронтационный характер.
- source_word: σημεῖον
  choice: знамение
  rationale: Традиционное и понятное библейское обозначение удостоверяющего сверхъестественного знака без поясняющей вставки в основной текст.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Естественно передаёт торжественную формулу речи Иисуса и силу ἀμήν.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: не будет дано этому поколению знамения
  rationale: После торжественной формулы условная конструкция представляет семитизированную клятвенную эллиптическую формулу и по смыслу выражает решительное отрицание.
theological_decisions:
- issue: Передача клятвенной конструкции с εἰ после ἀμὴν λέγω ὑμῖν
  choice: 'Явное решительное отрицание: «не будет дано этому поколению знамения»'
  alternative: 'Формально буквальное: «если будет дано этому поколению знамение»'
  rationale: В греческом сохранена эллиптическая формула клятвы, смысл которой отрицательный. Основной текст передаёт её функцию, а примечание сохраняет сведения о необычной форме оригинала, не превращая эллипсис в неясную русскую фразу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Историческое настоящее сохранено. Местоимение «Своём» написано с прописной буквы по принятой русской библейской издательской традиции; синтаксис остаётся ясным для обычного читателя.
