  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: ru
  text: 'А когда семь хлебов раздали четырём тысячам, сколько больших корзин, наполненных кусками, вы собрали? Они ответили Ему: «Семь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε καὶ
  choice: А когда
  rationale: Естественно вводит вторую часть сопоставления с предыдущим насыщением, передавая соединительную и временную функцию выражения без тяжеловесного отдельного «также».
- source_word: τοὺς ἑπτὰ
  choice: семь хлебов
  rationale: В греческом тексте стоит эллиптическое «семь», отсылающее к семи хлебам в Мк 8:5–6. В русском явное «хлебов» необходимо для ясности и естественности.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: для четырёх тысяч
  rationale: Предлог εἰς здесь выражает отношение к группе, для которой были предназначены хлебы; краткая формулировка понятна из контекста насыщения.
- source_word: πόσων σπυρίδων
  choice: сколько ... больших корзин
  rationale: σπυρίς обозначает большую корзину и лексически отличается от κόφινος в Мк 8:19; прилагательное сохраняет значимое различие.
- source_word: πληρώματα κλασμάτων
  choice: полных ... корзин с кусками
  rationale: Передаёт корзины как наполненные остатками разломанного хлеба естественным современным русским языком.
- source_word: ἤρατε
  choice: вы собрали
  rationale: В контексте речь идёт о собирании оставшихся кусков; «собрали» точнее и естественнее буквального «подняли».
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Они ответили Ему
  rationale: Историческое настоящее передано русским прошедшим временем; «ответили» естественно выражает функцию реплики в диалоге.
- source_word: Ἑπτά
  choice: Семь
  rationale: Прямой числовой ответ сохранён без добавлений.
theological_decisions: []
