  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: ru
  text: 'И говорил им: «Вы всё ещё не понимаете?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь, не добавляя выраженного временного оттенка.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передан несовершенным видом; русская форма естественно допускает продолженное или повторявшееся действие.
- source_word: αὐτοῖς
  choice: им
  rationale: Прямо передаёт местоимение, не подставляя из контекста существительное «ученикам».
- source_word: Οὔπω
  choice: до сих пор не
  rationale: Естественно передаёт οὔπω в вопросе и подчёркивает, что ожидаемое понимание всё ещё отсутствует.
- source_word: συνίετε
  choice: понимаете
  rationale: Точно и ясно передаёт умственное постижение в форме второго лица множественного числа настоящего времени.
theological_decisions:
- issue: Следует ли добавлять подразумеваемое дополнение, например «этого»
  choice: 'Оставить дополнение невыраженным: «Неужели вы до сих пор не понимаете?»'
  alternative: «Неужели вы до сих пор этого не понимаете?»
  rationale: В греческом тексте дополнение отсутствует; открытая формулировка сохраняет широту и обличительную силу вопроса.
translation_notes:
  register: Современный литературный русский язык; сдержанный, достойный и понятный стиль. Частица «неужели» естественно передаёт укоризненную силу греческого вопроса, не вводя нового предмета понимания.
