lexical_decisions:
- source_word: εὐθὺς
  choice: тотчас
  rationale: Передаёт временную безотлагательность и характерный для повествования Марка стремительный темп; звучит естественно и достойно в современном русском.
- source_word: ἐμβὰς
  choice: сев
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу; применительно к лодке русское «сев в лодку» кратко и идиоматично.
- source_word: τὸ πλοῖον
  choice: лодку
  rationale: В контексте плавания по Галилейскому морю «лодка» точнее соответствует предполагаемому размеру судна, чем «корабль».
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: вместе со Своими учениками
  rationale: Передаёт значение сопровождения; «вместе» делает связь естественной при русском деепричастно-причастном построении, а прописная буква следует принятому уважительному оформлению местоимений, относящихся к Иисусу.
- source_word: ἦλθεν
  choice: отправился
  rationale: В данном повествовании глагол описывает движение к названной местности; «отправился» естественно передаёт смену места, не навязывая точного значения прибытия.
- source_word: τὰ μέρη
  choice: окрестности
  rationale: Греческое множественное выражение обозначает область или местность; русское «окрестности» сохраняет множественный оттенок и остаётся географически естественным.
- source_word: Δαλμανουθά
  choice: Далмануфы
  rationale: Традиционная русская передача географического названия с учётом греческого θ как «ф»; родительный падеж обусловлен словом «окрестности».
