revisions:
- from: И приходят они в Вифсаиду. Там к Иисусу приводят слепого и настойчиво просят прикоснуться к нему.
  to: И они приходят в Вифсаиду. И к Иисусу приводят слепого и просят Его прикоснуться к нему.
  rationale: Правка сохраняет историческое настоящее и всю последовательность греческого текста, устраняет добавленное «Там» и делает порядок слов более естественным для современного литературного русского. Имя «Иисусу» оставлено как безопасное прояснение референта αὐτῷ; прописное «Его» помогает отличить Иисуса от слепого в русском предложении.
  reviewer_model: gpt-5.6-terra
