  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: ru
  text: И они приходят в Вифсаиду. И к Иисусу приводят слепого и просят Его прикоснуться к нему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: приходят
  rationale: 'Историческое настоящее сохранено: оно естественно для русского повествования и передаёт характерную живость рассказа Марка.'
- source_word: εἰς Βηθσαϊδάν
  choice: в Вифсаиду
  rationale: Предлог εἰς обозначает направление движения; русская форма названия следует общепринятой библейской традиции.
- source_word: φέρουσιν αὐτῷ
  choice: к Иисусу приводят
  rationale: Глагол φέρω здесь означает доставление человека, но не уточняет, несли ли его; «приводят» не вводит лишней детали. Имя «Иисус» проясняет референт местоимения без изменения смысла.
- source_word: τυφλὸν
  choice: слепого
  rationale: Субстантивированное прилагательное мужского рода обозначает слепого мужчину; краткая русская форма естественна в данном контексте.
- source_word: παρακαλοῦσιν
  choice: настойчиво просят
  rationale: Передаёт серьёзную, усиленную просьбу, не прибегая к потенциально чрезмерному «умоляют».
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: прикоснуться к нему
  rationale: Инфинитив естественно передаёт содержание просьбы; ἅπτομαι с родительным означает физическое прикосновение.
- source_word: καὶ
  choice: И / Там
  rationale: Начальное καί сохранено как «И». Второе καί передано контекстуальным «Там», чтобы связать прибытие с последующим событием и избежать тяжеловесного повторения, сохранив последовательность рассказа.
