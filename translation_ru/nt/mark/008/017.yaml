  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: ru
  text: 'Иисус, зная об этом, сказал им: «Почему вы рассуждаете о том, что у вас нет хлеба? Неужели вы всё ещё не осознаёте и не понимаете? Неужели ваши сердца ожесточены?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: зная об этом
  rationale: Аористное причастие указывает, что Иисус знал о рассуждениях учеников; подразумеваемое дополнение естественно восстанавливается из контекста.
- source_word: διαλογίζεσθε
  choice: рассуждаете
  rationale: Передаёт взаимное обсуждение и размышление учеников, сохраняя связь с их разговором о хлебе.
- source_word: ἄρτους
  choice: хлеба
  rationale: Хотя в греческом стоит множественное число, русское собирательное «хлеб» естественно обозначает имеющийся запас хлеба.
- source_word: νοεῖτε
  choice: осознаёте
  rationale: Передаёт мысленное восприятие и сохраняет смысловое различие со следующим συνίετε.
- source_word: συνίετε
  choice: понимаете
  rationale: Естественно выражает понимание и сохраняет риторическую пару с «осознаёте».
- source_word: πεπωρωμένην
  choice: ожесточены
  rationale: Передаёт совершившееся состояние нечувствительности; это устойчивое и ясное библейское обозначение внутренней невосприимчивости.
- source_word: καρδίαν
  choice: сердца
  rationale: Сохраняет библейскую метафору внутреннего человека; множественное число естественно в русском при обращении к нескольким людям.
theological_decisions:
- issue: Передача заключительного вопроса о состоянии учеников
  choice: Неужели ваши сердца по-прежнему ожесточены?
  alternative: Неужели вы держите свои сердца ожесточёнными?
  rationale: Греческая конструкция буквально содержит «имеете сердце ожесточённым», но буквальное воспроизведение по-русски неестественно и может ошибочно подразумевать сознательное поддержание такого состояния. Предикативная конструкция точно передаёт состояние, выраженное перфектным страдательным причастием, а «по-прежнему» раскрывает контекстуальную силу οὔπω в последовательности вопросов.
translation_notes:
  register: Современный литературный русский язык; речь Иисуса передана прямо и строго, но без синтаксической кальки. Настоящее историческое λέγει естественно передано прошедшим временем. Частица «неужели» сохраняет укоризненную риторическую силу вопросов.
