  source_fidelity: 'В целом перевод точно передаёт смысл стиха: γνοὺς — «зная об этом», διαλογίζεσθε — «рассуждаете», а пара νοεῖτε / συνίετε разумно различена как «осознаёте и понимаете». «Хлеба» естественно передаёт греческое ἄρτους в данном контексте. Однако «по-прежнему» в последнем вопросе необоснованно переносит οὔπω из предыдущего вопроса: в греческом тексте оно относится к «не понимаете и не разумеете», а не к состоянию сердца.'
