lexical_decisions:
- source_word: διελογίζοντο
  choice: обсуждали
  rationale: Имперфект передаёт продолжавшееся обсуждение; «обсуждали» естественно звучит по-русски и сохраняет значение взаимного рассуждения.
- source_word: πρὸς ἀλλήλους
  choice: между собой
  rationale: Устойчиво и естественно передаёт взаимное общение учеников.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание обсуждения, а не его причину.
- source_word: ἄρτους
  choice: хлеба
  rationale: В русском контексте естественно употребить собирательное «хлеб»; буквальное множественное число «хлебов» значимо в ближайшем контексте подсчёта хлебов и отмечено в сноске.
- source_word: οὐκ ἔχουσιν
  choice: у них нет
  rationale: Настоящее время греческой косвенной речи естественно передаётся русской конструкцией «у них нет», сохраняющей точку зрения участников внутри повествования.
