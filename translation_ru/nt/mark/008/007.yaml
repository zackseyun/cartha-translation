  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: ru
  text: У них было несколько рыбок. Благословив их, Он велел подать и их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: рыбок
  rationale: Уменьшительная форма указывает на небольшую рыбу; русское «рыбок» естественно сохраняет этот оттенок.
- source_word: ὀλίγα
  choice: несколько
  rationale: Естественно передаёт малое количество исчисляемых предметов без излишнего усиления.
- source_word: εὐλογήσας
  choice: благословив
  rationale: Деепричастие передаёт предшествующее действие аористного причастия и сохраняет прямое значение εὐλογέω, не заменяя его более истолковывающим «возблагодарив».
- source_word: αὐτά
  choice: их
  rationale: Местоимение относится к рыбкам во множественном числе.
- source_word: καὶ ταῦτα
  choice: и их
  rationale: 'Сохраняет добавочное значение καί: рыбу следовало подать наряду с уже упомянутым хлебом; в русском повтор «их» звучит естественнее, чем указательное «эти».'
- source_word: παρατιθέναι
  choice: подать
  rationale: В контексте трапезы глагол означает поставить пищу перед людьми, то есть подать её. Активный инфинитив естественно передан русской конструкцией после «велел».
- source_word: εἶπεν
  choice: велел
  rationale: В сочетании с инфинитивом глагол вводит распоряжение; «велел» естественно выражает эту функцию по-русски, хотя формально εἶπεν означает «сказал».
