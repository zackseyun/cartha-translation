  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: ru
  text: 'И Он отправил его домой[a], сказав: «Даже не входи в селение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях добавлено: «и никому в селении не рассказывай».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: отправил
  rationale: Аорист ἀποστέλλω здесь обозначает, что Иисус отослал исцелённого; «отправил» естественно передаёт действие, не приписывая ему особой миссии.
- source_word: εἰς οἶκον αὐτοῦ
  choice: домой
  rationale: Выражение буквально указывает на его дом как место назначения; русское «домой» кратко и естественно передаёт возвращение в собственное жилище.
- source_word: λέγων
  choice: сказав
  rationale: Деепричастие сохраняет связь сопутствующей речи с основным действием и естественно звучит в русском повествовании.
- source_word: Μηδὲ
  choice: Даже не
  rationale: 'Передаёт усилительный оттенок отрицания μηδέ: человеку запрещено даже заходить в селение.'
- source_word: κώμην
  choice: селение
  rationale: κώμη обозначает небольшое поселение; «селение» точно и уместно в современном литературном библейском регистре.
- source_word: εἰσέλθῃς
  choice: заходи
  rationale: Запретительная конструкция с аористом сослагательного наклонения естественно передаётся русским отрицательным повелением; «заходи» соответствует движению внутрь поселения.
theological_decisions:
- issue: Объём запрета Иисуса относительно селения
  choice: В основном тексте дан только прямой запрет заходить в селение.
  alternative: Ряд рукописей добавляет запрет рассказывать кому-либо в селении.
  rationale: Текст SBLGNT содержит лишь запрет входить в селение; более пространное чтение не следует включать в основной текст, но его уместно отметить в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным звучанием. Местоимение «Он» написано с прописной буквы по принятой русской библейской традиции; формулировка остаётся простой и понятной.
