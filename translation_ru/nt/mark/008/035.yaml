  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: ru
  text: Ведь кто хочет спасти свою жизнь, тот потеряет её; а кто потеряет свою жизнь ради Меня и Евангелия, тот спасёт её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душу» — во всём стихе. Греческое слово может означать как жизнь человека, так и его душу или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: жизнь
  rationale: В контексте призыва следовать за Иисусом речь прежде всего идёт о жизни человека, которую он пытается сохранить или готов потерять. «Жизнь» естественно передаёт парадокс и не сужает значение до нематериальной части человека; вариант «душа» отмечен в сноске.
- source_word: σῶσαι / σώσει
  choice: спасти / спасёт
  rationale: Одинаковый русский глагол сохраняет словесное соответствие и парадокс оригинала, а также его богословскую значимость.
- source_word: ἀπολέσει
  choice: потеряет
  rationale: При дополнении ψυχή глагол естественно означает потерю жизни. Это сохраняет прямой контраст со «спасти» без усиления до «погубить».
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: ради Меня и Евангелия
  rationale: «Ради» кратко и естественно выражает причину или побуждение; одна конструкция одинаково относится к обоим однородным членам.
- source_word: εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшееся и понятное обозначение Благой вести, сохраняющее ключевой для Марка термин.
- source_word: ὃς ... ὃς
  choice: кто ... кто
  rationale: Русская соотносительная конструкция «кто... тот» естественно передаёт обобщающий и открытый характер греческого выражения.
- source_word: θέλῃ
  choice: хочет
  rationale: Современный и точный русский эквивалент, прямо выражающий волю человека.
theological_decisions:
- issue: Антропологический смысл ψυχή в парадоксальном изречении Иисуса
  choice: В основном тексте перевести как «жизнь»
  alternative: «душа»
  rationale: Ближайший контекст говорит о самоотречении и готовности потерять жизнь ради Иисуса и Евангелия. «Жизнь» лучше всего передаёт непосредственный смысл, не исключая более широкого смыслового оттенка греческого слова, который сохранён в сноске.
- issue: Связь ἕνεκεν с двумя однородными членами
  choice: «ради Меня и Евангелия»
  alternative: «ради Меня и ради Евангелия»
  rationale: В греческом одна предложная конструкция управляет обоими членами. Однократное «ради» точно и более естественно по-русски, не ослабляя отношения ко второму члену.
translation_notes:
  register: Современный литературный русский язык с ясной, ритмичной конструкцией «кто... тот». Заглавные буквы в «Меня» и «Евангелия» соответствуют принятому русскому библейскому регистру. Подлинная многозначность ψυχή сохранена посредством сноски.
