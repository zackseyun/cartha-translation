  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: ru
  text: И если Я отпущу их домой голодными, они обессилеют в пути, и некоторые из них пришли издалека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπολύσω
  choice: отпущу
  rationale: В контексте речь о том, чтобы отпустить собравшихся и позволить им разойтись; «отпущу» естественно передаёт это значение.
- source_word: νήστεις
  choice: голодными
  rationale: Здесь слово обозначает людей, оставшихся без пищи, а не обязательно соблюдающих религиозный пост.
- source_word: εἰς οἶκον αὐτῶν
  choice: домой
  rationale: Греческое выражение имеет распределительный смысл — каждый направится к себе домой; русское наречие передаёт это естественно и кратко.
- source_word: ἐκλυθήσονται
  choice: обессилеют
  rationale: Глагол означает ослабеть, изнемочь от недостатка сил; «обессилеют» сохраняет смысл, не утверждая непременно буквального падения или потери сознания.
- source_word: ἐν τῇ ὁδῷ
  choice: в пути
  rationale: Естественное русское обозначение происходящего по дороге домой.
- source_word: καί τινες αὐτῶν
  choice: ведь некоторые из них
  rationale: В данном контексте καί вводит пояснение причины опасения Иисуса; «ведь» ясно и естественно выражает эту логическую связь, хотя формально возможно «и».
- source_word: ἀπὸ μακρόθεν
  choice: издалека
  rationale: Передаёт значительное расстояние, которое некоторые уже преодолели и которое связано с трудностью обратного пути.
- source_word: ἥκασιν
  choice: пришли
  rationale: Русское прошедшее время естественно описывает их прибытие и сохраняющийся результат; буквальное воспроизведение греческого перфекта здесь было бы тяжеловесно.
