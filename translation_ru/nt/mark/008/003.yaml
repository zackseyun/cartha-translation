translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и сдержанно. Заглавное «Я» употреблено как уважительное местоимение в прямой речи Иисуса. Подлинная смысловая широта ἐκλυθήσονται сохранена выбором «обессилеют» без излишне конкретного «упадут в обморок».
