source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: ru
  text: Ибо кто постыдится Меня и Моих слов в этом прелюбодейном и грешном поколении[a], того постыдится и Сын Человеческий, когда придёт в славе Своего Отца со святыми ангелами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в этом неверном и грешном поколении». В основном тексте сохранено слово «прелюбодейном», поскольку в греческом употреблена конкретная пророческая метафора прелюбодеяния, обозначающая неверность Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: постыдится / постыдится
  rationale: «Постыдиться кого-либо» прямо и естественно передаёт значение глагола и сохраняет взаимность между нынешним отношением человека к Иисусу и будущим отношением Сына Человеческого к этому человеку. «Отречётся» было бы более сильным и толковательным переводом.
- source_word: λόγους
  choice: слов
  rationale: Передаёт греческое множественное число и сохраняет акцент на словах Иисуса; «учения» или «вести» были бы более обобщающими вариантами.
- source_word: γενεᾷ
  choice: поколении
  rationale: Обычный и контекстуально уместный эквивалент, обозначающий современное Иисусу человеческое сообщество в его нравственной характеристике.
- source_word: μοιχαλίδι
  choice: прелюбодейном
  rationale: Сохраняет конкретную пророческую метафору супружеской неверности, употреблённую в греческом тексте для обозначения духовной и нравственной неверности.
- source_word: ἁμαρτωλῷ
  choice: грешном
  rationale: Прямой эквивалент, естественно сочетающийся с определением «прелюбодейном» и не усиливающий исходное выражение.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет устойчивый мессианский титул и его библейско-богословские ассоциации, не заменяя его толкованием «Я» или «Мессия».
- source_word: δόξῃ
  choice: славе
  rationale: Традиционный и точный библейский эквивалент, сохраняющий значения божественного величия, чести и сияния.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: со святыми ангелами
  rationale: Естественно передаёт атрибутивную конструкцию, не добавляя отсутствующее в греческом тексте притяжательное местоимение «Своими».
- source_word: ὃς γὰρ ἐὰν
  choice: Ибо кто
  rationale: Передаёт обобщённое условие и сохраняет объяснительную связь, выраженную союзом γάρ.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: в этом ... поколении
  rationale: Передаёт среду, в которой человек проявляет стыд по отношению к Иисусу и Его словам.
theological_decisions:
- issue: Метафорический смысл определения μοιχαλίδι
  choice: Сохранить в основном тексте «прелюбодейном» как пророческую метафору духовной и нравственной неверности.
  alternative: Передать как «неверном».
  rationale: Исходный текст использует конкретное нравственное понятие, созвучное пророческому языку о неверности Богу. Сохранение метафоры поддерживает межтекстовые связи и не сводит образ к толкованию.
- issue: Значение титула «Сын Человеческий»
  choice: Сохранить мессианский титул «Сын Человеческий».
  alternative: Заменить на «Я» или «Мессия».
  rationale: Греческий текст употребляет самостоятельный христологический титул с эсхатологическим значением; его замена устранила бы важную смысловую напряжённость и аллюзивность.
- issue: Передача αὐτόν в обобщённой конструкции
  choice: Перестроить фразу как «того постыдится», сохранив единственное число и соотнесённость с «кто».
  alternative: Использовать множественное число или явно гендерно маркированное «его».
  rationale: Русская соотносительная конструкция «кто... того» точно передаёт греческое обобщённое единственное число, звучит естественно и не вносит ненужной двусмысленности.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для русского: корреляция «кто... того» сохраняет взаимный характер предупреждения. Прописные буквы в местоимениях, относящихся к Иисусу и Отцу, соответствуют принятому русскому библейскому регистру; слово «ангелами» оставлено со строчной буквы.'
