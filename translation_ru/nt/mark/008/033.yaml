    rationale: Ὕπαγε — повеление идти/удалиться, а не стоять. «Ступай за Мной» передаёт движение и «позади Меня», сохраняя образ исходного текста.
  - severity: low
    issue: «Строго выговорил» для ἐπετίμησεν
    rationale: Глагол действительно обозначает резкое порицание, но наречие «строго» отдельно не выражено, а сочетание менее естественно. «Упрекнул Петра» достаточно передаёт силу глагола без добавления.
  - severity: low
    issue: Формулировка сноски «то, что людей»
    rationale: Она неудачна по-русски и не проясняет форму оборота. Лучше объяснить, что речь о том, что относится к людям вообще.
