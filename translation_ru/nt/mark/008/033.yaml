  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Иисус оборачивается, видит учеников, порицает Петра и противопоставляет Божье человеческому. Однако «Встань позади Меня» сужает Ὕπαγε («иди/ступай») до приказа встать и потому требует исправления. «Строго выговорил» несколько добавляет эксплицитную характеристику строгости и менее естественно, чем «упрекнул».'
  naturalness: Текст в целом литературный, но «строго выговорил Петру» звучит тяжеловесно, а «Встань позади Меня» не является естественным русским соответствием глаголу движения. Исправленный вариант сохраняет резкость реплики и пространственный образ оригинала.
  terminology: «Ученики», «сатана», «Божье» и «человеческое» уместны. Имя «сатана» следует оставить со строчной буквы как обращение, согласно обычной русской библейской орфографии. Сноска должна точнее объяснять родовое значение ἀνθρώπων, не создавая неестественной псевдобуквальной русской формулы.
