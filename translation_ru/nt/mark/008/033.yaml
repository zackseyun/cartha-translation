source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: ru
  text: 'Но Он, обернувшись и взглянув на Своих учеников, упрекнул Петра и сказал: «Ступай за Мной, сатана! Ведь ты думаешь не о том, что Божье, а о том, что человеческое[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что относится к людям»; греческое слово обозначает людей вообще, человечество.'
    reason: Уточняет обобщённое значение греческого слова и форму оборота.
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: обернувшись
  rationale: Передаёт физический поворот Иисуса и естественно выражает предшествующее основному действию обстоятельство.
- source_word: ἰδὼν
  choice: взглянув
  rationale: В данном контексте выражает направленный взгляд Иисуса на учеников и сохраняет последовательность действий.
- source_word: μαθητὰς
  choice: учеников
  rationale: Обычный и точный евангельский эквивалент μαθητής, обозначающий учеников и последователей Иисуса.
- source_word: ἐπετίμησεν
  choice: строго выговорил
  rationale: Передаёт резкое словесное порицание, выражаемое ἐπιτιμάω, и позволяет естественно присоединить адресата в дательном падеже.
- source_word: καὶ λέγει
  choice: сказал
  rationale: Историческое настоящее естественно передано русским прошедшим временем в повествовании; сочинительная связь выражена пунктуацией.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Встань позади Меня
  rationale: Сохраняет пространственный образ ὀπίσω μου и повелительную силу, не превращая фразу просто в приказ уйти прочь.
- source_word: Σατανᾶ
  choice: сатана
  rationale: Передаёт прямое обращение как принятое в русском языке именование, не сводя его заранее к нарицательному «противник».
- source_word: φρονεῖς
  choice: думаешь о
  rationale: В сочетании с противопоставленными объектами естественно выражает направленность мыслей и установок, а не только отдельный акт рассуждения.
- source_word: τὰ τοῦ θεοῦ
  choice: то, что Божье
  rationale: Сохраняет широту субстантивированного оборота и не сужает его до планов, интересов или дел Бога.
- source_word: τὰ τῶν ἀνθρώπων
  choice: то, что человеческое
  rationale: Точно передаёт обобщённое значение ἄνθρωποι — человечество и человеческая сфера — без ошибочного ограничения только мужчинами.
theological_decisions:
- issue: К кому относится обращение «сатана»
  choice: Иисус порицает Петра и непосредственно обращается к нему словом «сатана», не поясняя метафизическую природу этого отождествления.
  alternative: Иисус обращается к сатане, стоящему за Петром; либо «сатана» означает лишь нарицательное «противник».
  rationale: Грамматика прямо называет Петра адресатом порицания, а затем сохраняет резкое обращение. Перевод не отождествляет Петра с сатаной буквально и не отделяет сатану от Петра вопреки недосказанности текста.
- issue: Смысл противопоставления Божьего и человеческого
  choice: Сохранено широкое противопоставление «того, что Божье» и «того, что человеческое».
  alternative: Конкретизировать как «Божьи интересы» и «интересы людей» либо «Божьи замыслы» и «людские замыслы».
  rationale: Греческие субстантивированные обороты семантически широки; конкретизация устранила бы присущую тексту открытость.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Встань позади Меня» намеренно сохраняет пространственный образ оригинала; прописные местоимения при обращении к Иисусу соответствуют принятой русской библейской стилистике. Имя говорящего не добавлено, поскольку в данном стихе греческий текст использует местоименно подразумеваемый субъект.
