  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: ru
  text: И, оставив их, Он снова сел в лодку[a] и отправился на другую сторону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вновь сев в лодку, отправился на другую сторону». Наречие πάλιν может означать как «снова», так и «назад».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: оставив
  rationale: Аористное причастие ἀφίημι здесь означает, что Иисус покинул собеседников; русское деепричастие естественно передаёт связь с основным действием.
- source_word: αὐτοὺς
  choice: их
  rationale: Местоимение относится к фарисеям из ближайшего контекста; уточнение существительным не требуется.
- source_word: πάλιν
  choice: снова
  rationale: Передаёт повторность действия, не устраняя возможности понимать наречие как возвращение в лодку; эта смысловая особенность поясняется в сноске.
- source_word: ἐμβὰς
  choice: сел в лодку
  rationale: Причастие от ἐμβαίνω означает вход или посадку; лодка подразумевается контекстом. «Сел в лодку» — естественная современная русская формулировка.
- source_word: ἀπῆλθεν
  choice: отправился
  rationale: Глагол обозначает уход или отправление; выбранный вариант естественно сочетается с указанием направления.
- source_word: εἰς τὸ πέραν
  choice: на другую сторону
  rationale: Устойчиво и ясно обозначает противоположный берег озера, сохраняя характерное для Марка выражение.
