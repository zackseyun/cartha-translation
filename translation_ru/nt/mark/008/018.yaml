base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: ru
  text: Имея глаза, не видите и, имея уши, не слышите? И не помните?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Имея глаза
  rationale: Деепричастная конструкция близко передаёт греческий причастный оборот и сохраняет риторический параллелизм; уступительное «хотя у вас есть глаза» было бы более истолковывающим.
- source_word: βλέπετε
  choice: не видите
  rationale: Сохранено основное значение обычного глагола «видеть»; контекст позволяет услышать также переносный смысл «не воспринимаете», не закрепляя его в основном тексте.
- source_word: ὦτα ἔχοντες
  choice: Имея уши
  rationale: Форма последовательно воспроизводит параллельный греческий оборот и звучит естественно в риторическом вопросе.
- source_word: ἀκούετε
  choice: не слышите
  rationale: Передано прямое значение «слышать»; возможные оттенки понимания и послушания оставлены контексту.
- source_word: μνημονεύετε
  choice: не помните
  rationale: Естественно и точно передаёт настоящее время глагола в вопросе-упрёке о неспособности учеников удержать в памяти прежнее.
- source_word: καὶ
  choice: И / Имея
  rationale: Союз передан в начале последнего вопроса, а внутри тесно параллельной пары связь естественно выражена последовательностью конструкций без тяжеловесного повторения союза.
- source_word: οὐ / οὐκ
  choice: не
  rationale: Обычное отрицание сохранено во всех трёх риторических вопросах.
theological_decisions:
- issue: Буквально-чувственный или переносный смысл глаголов зрения и слуха
  choice: В основном тексте сохранены конкретные глаголы «видеть» и «слышать», а возможный смысл духовного невосприятия отмечен в сноске.
  alternative: Передать как «не воспринимаете» и «не понимаете».
  rationale: Греческий текст использует обычные глаголы зрения и слуха. Их буквальная передача сохраняет пророческий отзвук и смысловую напряжённость, не устраняя переносный смысл, возникающий из контекста.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой, нарастающей риторики греческого текста. Формы «Имея глаза» и «Имея уши» слегка возвышенны, но понятны и уместны для библейской речи.
