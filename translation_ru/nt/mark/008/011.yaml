  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: ru
  text: Фарисеи вышли и стали спорить с Ним, прося у Него знамения с неба[a] и испытывая Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знамение, исходящее с неба»; вероятнее всего, речь идёт о знамении небесного, то есть божественного, происхождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышли
  rationale: Аорист ἐξέρχομαι обозначает появление фарисеев в сцене; «вышли» естественно передаёт движение, не уточняя не названное в тексте исходное место.
- source_word: ἤρξαντο συζητεῖν
  choice: стали спорить
  rationale: Конструкция имеет начинательное значение, а συζητέω в контексте враждебного испытания означает не нейтральное обсуждение, а спор.
- source_word: αὐτῷ
  choice: с Ним
  rationale: Дательный падеж при συζητεῖν естественно передаётся конструкцией «спорить с Ним»; имя Иисуса, отсутствующее в греческом тексте, не добавляется.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: требуя от Него
  rationale: В данном конфликтном контексте ζητέω передаёт настойчивое требование, а παρά с родительным указывает на того, от кого ожидают знамения.
- source_word: σημεῖον
  choice: знамения
  rationale: «Знамение» сохраняет смысл удостоверяющего знака и не сводит выражение просто к чуду.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Устойчивое русское выражение сохраняет буквальный образ и допускает наиболее вероятный смысл небесного, то есть божественного, происхождения.
- source_word: πειράζοντες αὐτόν
  choice: испытывая Его
  rationale: πειράζω здесь означает враждебно подвергать проверке; «испытывая» не вносит более узкого значения соблазнения ко греху.
theological_decisions:
- issue: Смысл просьбы о знамении «с неба»
  choice: Сохранено буквальное «с неба», подразумевающее небесное, то есть божественное, происхождение или подтверждение.
  alternative: Знамение, буквально появляющееся в небе.
  rationale: Контекст Евангелия делает наиболее вероятным требование удостоверения от Бога, однако буквальная формулировка сохраняет образ и не устраняет полностью возможную пространственную окраску.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексемой «знамение». Формулировка краткая и естественная; причастные обороты передают одновременные действия и враждебную цель фарисеев. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
