  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: ru
  text: 'Подняв глаза, он сказал: «Я вижу людей: они ходят, но кажутся мне деревьями».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: Подняв глаза
  rationale: Передаёт естественное для данного контекста значение «посмотрев вверх / подняв взгляд», не смешивая его с возможным значением «прозрев».
- source_word: ὅτι
  choice: двоеточие с последующим описанием
  rationale: Здесь союз вводит пояснение того, каким именно было ещё неясное зрительное восприятие; буквальное «потому что» по-русски создало бы неестественную причинную связь.
- source_word: ὡς δένδρα
  choice: кажутся мне деревьями
  rationale: Сохраняет сравнение людей с деревьями и ясно передаёт ошибочность ещё неполного зрения.
- source_word: περιπατοῦντας
  choice: они ходят
  rationale: Причастие относится к людям; личная форма звучит естественно и сохраняет смысл наблюдаемого движения.
theological_decisions:
- issue: Постепенность восстановления зрения
  choice: Сохранено различение между распознаванием людей и их искажённым восприятием как деревьев
  alternative: «Вижу людей, словно деревья, ходящих»
  rationale: 'Выбранная формулировка естественнее по-русски и не устраняет повествовательное напряжение: человек уже видит, но пока неясно.'
translation_notes:
  register: Современный литературный русский язык; речь проста и достойна, без архаизмов. Перестройка синтаксиса устраняет двусмысленное прикрепление «ходящих» к деревьям, сохраняя содержание греческой фразы.
