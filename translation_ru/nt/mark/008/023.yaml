source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: ru
  text: 'И, взяв слепого за руку, Он вывел его из селения. Затем, плюнув ему на глаза[a] и положив руки на него, Он спросил: «Ты что-нибудь видишь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плюнув ему в глаза».'
    reason: Сноска сохраняет более буквальную передачу εἰς при естественном основном варианте и отмечает яркость исходного выражения.
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: взяв слепого за руку
  rationale: Оборот с родительным падежом означает, что Иисус взял человека за руку; русская формулировка естественна и сохраняет конкретность действия.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: вывел его из селения
  rationale: Глагол передаёт направленное движение наружу; поскольку Иисус держит слепого за руку, «вывел» точно и естественно описывает действие. κώμη — небольшое поселение, поэтому выбрано нейтральное «селение».
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: плюнув ему на глаза
  rationale: Сохранена резкая физическая конкретность действия. «На глаза» естественнее по-русски в описании исцеления, тогда как более буквальное «в глаза» может восприниматься прежде всего как оскорбительный жест; буквальный вариант отмечен в сноске.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: положив на него руки
  rationale: Формулировка прямо передаёт физическое прикосновение обеими руками, не добавляя специального ритуального смысла.
- source_word: ἐπηρώτα αὐτόν
  choice: Он спросил
  rationale: Имперфект допускает оттенок продолженности, однако в данном повествовательном контексте простое «спросил» ясно вводит прямой вопрос и не перегружает русский текст.
- source_word: Εἴ τι βλέπεις;
  choice: Ты что-нибудь видишь?
  rationale: Современный естественный вопрос, сохраняющий неопределённость τι и не уточняющий степень зрения.
theological_decisions:
- issue: Телесная конкретность исцеления
  choice: Сохранить упоминание плевка на глаза и прикосновения рук без смягчающего пересказа.
  alternative: Обобщить действия как прикосновение или совершение исцеления.
  rationale: Греческий текст намеренно описывает последовательность конкретных физических действий; их устранение изменило бы характер рассказа.
- issue: Возможный ритуальный оттенок возложения рук
  choice: 'Передать буквально и нейтрально: «положив на него руки».'
  alternative: Использовать формулу «возложив на него руки», способную сильнее ассоциироваться с формальным церковным действием.
  rationale: В данном контексте речь идёт о прикосновении при исцелении; перевод не должен сам по себе придавать ему более поздний обрядовый смысл.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Начальное «И» сохраняет связь стиха с предыдущим повествованием. Местоимение «Он» написано с прописной буквы в соответствии с принятым благоговейным библейским регистром, без добавления отсутствующих в источнике титулов.
