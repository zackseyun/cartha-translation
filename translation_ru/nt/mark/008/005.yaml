  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: ru
  text: 'И Он спросил их: «Сколько у вас хлебов?» Они сказали: «Семь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход, характерный для Марка, не добавляя более выраженного временного оттенка.
- source_word: ἠρώτα
  choice: спросил
  rationale: Хотя имперфект допускает передачу длительности или повторности, в данном повествовательном контексте естественное русское «спросил» точно передаёт единичный вопрос.
- source_word: αὐτούς
  choice: их
  rationale: Винительный падеж множественного числа относится к ученикам и прямо передаётся местоимением «их».
- source_word: Πόσους
  choice: сколько
  rationale: Естественное русское вопросительное слово для обозначения количества.
- source_word: ἔχετε
  choice: у вас
  rationale: Русская конструкция «сколько у вас…?» естественно передаёт значение греческого глагола обладания во втором лице множественного числа.
- source_word: ἄρτους
  choice: хлебов
  rationale: В контексте счёта множественное число обозначает отдельные хлебы или буханки; «хлебов» сохраняет библейскую лексику и звучит естественнее, чем уточняющее «буханок» для древнего вида хлеба.
- source_word: οἱ δὲ εἶπαν
  choice: Они сказали
  rationale: Конструкция обозначает отвечающую группу; отдельное русское предложение достаточно передаёт переход δέ, а «сказали» формально соответствует εἶπαν.
- source_word: Ἑπτά
  choice: Семь
  rationale: Прямая и однозначная передача количественного числительного.
theological_decisions: []
