base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: ru
  text: 'Когда Я преломил пять хлебов для пяти тысяч[a], сколько корзин, полных кусков, вы собрали[b]? Они ответили Ему: «Двенадцать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для пяти тысяч мужчин». Буквально: «для пяти тысяч».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «подняли» или «взяли». В данном контексте речь о собранных оставшихся кусках.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: Когда
  rationale: Естественно вводит придаточное времени и отсылает к насыщению множества людей.
- source_word: ἔκλασα
  choice: Я преломил
  rationale: Передаёт конкретное действие κλάω по отношению к хлебам; «преломил» сохраняет достоинство библейского повествования и понятно современному читателю.
- source_word: τοὺς πέντε ἄρτους
  choice: пять хлебов
  rationale: Ἄρτος здесь обозначает отдельные хлебы, что видно из числительного; русское «пять хлебов» естественно в контексте рассказа.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: для пяти тысяч
  rationale: Передаёт направленность действия к накормленной группе, не добавляя слова «мужчин», которого непосредственно в формулировке стиха нет.
- source_word: κοφίνους
  choice: корзин
  rationale: Общее и ясное обозначение сосудов для собранных остатков; излишняя конкретизация вида корзины не требуется.
- source_word: κλασμάτων πλήρεις
  choice: полных корзин кусков
  rationale: Сохраняет смысл корзин, наполненных кусками преломлённого хлеба, в естественном русском порядке слов.
- source_word: ἤρατε
  choice: вы собрали
  rationale: В данном контексте αἴρω относится к собиранию оставшихся кусков; «собрали» по-русски точнее и естественнее буквального «подняли».
- source_word: λέγουσιν αὐτῷ
  choice: Они ответили Ему
  rationale: Историческое настоящее передано прошедшим временем; поскольку реплика непосредственно отвечает на вопрос, «ответили» естественнее буквального «говорят».
- source_word: Δώδεκα
  choice: Двенадцать
  rationale: Краткий числовой ответ сохранён без поясняющего добавления.
theological_decisions:
- issue: Значение τοὺς πεντακισχιλίους
  choice: пяти тысяч
  alternative: пяти тысяч мужчин
  rationale: Форма мужского рода может обозначать мужчин, однако здесь служит кратким наименованием известного множества накормленных. Основной текст не уточняет пол без необходимости, а примечание сохраняет возможное более узкое понимание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Синтаксис вопроса сделан естественным, без устранения краткости исходного ответа.
