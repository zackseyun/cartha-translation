  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: ru
  text: И Он начал учить их, что Сыну Человеческому надлежит много пострадать, быть отвергнутым старейшинами, первосвященниками и книжниками, быть убитым и после трёх дней воскреснуть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через три дня». В греческом тексте буквально: «после трёх дней»; выражение «на третий день» в этом стихе было бы гармонизацией с параллельными формулировками.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: начал учить
  rationale: Сочетание ἄρχομαι с инфинитивом обозначает начало действия; «начал учить» естественно передаёт повествовательный переход.
- source_word: δεῖ
  choice: надлежит
  rationale: Передаёт сильную необходимость всей последующей цепи событий, не уточняя сверх греческого текста природу этой необходимости.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сыну Человеческому
  rationale: Сохраняет традиционное и узнаваемое наименование, а также его библейские связи; дательный обусловлен русской конструкцией с «надлежит».
- source_word: πολλὰ παθεῖν
  choice: много пострадать
  rationale: Естественная русская передача нейтрального множественного πολλά при πάσχω; сохраняет широту подразумеваемых страданий.
- source_word: ἀποδοκιμασθῆναι
  choice: быть отвергнутым
  rationale: Передаёт официальное неприятие и отвержение после оценки без излишнего разъяснения в основном тексте.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: старейшинами
  rationale: Обозначает признанную группу иудейских руководителей, а не просто пожилых людей.
- source_word: τῶν ἀρχιερέων
  choice: первосвященниками
  rationale: Устоявшееся русское обозначение ведущих представителей священнической верхушки во множественном числе.
- source_word: τῶν γραμματέων
  choice: книжниками
  rationale: Исторически конкретный и традиционно понятный русский эквивалент для знатоков и толкователей Закона.
- source_word: ἀποκτανθῆναι
  choice: быть убитым
  rationale: Прямо и точно передаёт страдательный инфинитив, не добавляя юридического оттенка выражения «предать смерти».
- source_word: μετὰ τρεῖς ἡμέρας
  choice: после трёх дней
  rationale: Прямо передаёт μετά с винительным падежом и сохраняет собственную формулировку Марка, не гармонизируя её с «на третий день» в параллельных местах.
- source_word: ἀναστῆναι
  choice: воскреснуть
  rationale: В контексте возвращения к жизни после смерти это естественный русский эквивалент непереходного инфинитива; он сохраняет действительную, а не страдательную конструкцию.
theological_decisions:
- issue: Необходимость страданий Сына Человеческого, выраженная δεῖ
  choice: надлежит
  alternative: должен
  rationale: «Надлежит» сохраняет богословский вес необходимости, но не объясняет её механизм и не добавляет доктринальных уточнений.
- issue: Временное выражение μετὰ τρεῖς ἡμέρας
  choice: после трёх дней
  alternative: на третий день
  rationale: Выбрана буквальная временная формулировка Марка; вариант «на третий день» был бы гармонизацией с параллельными местами.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет единую цепь инфинитивов при «надлежит». Заглавные буквы в титуле «Сын Человеческий» следуют устойчивой русской библейской практике. Сноска не добавлена: предоставленная английская сноска ошибочно стоит после «many things», хотя относится к временному выражению; сама альтернатива не требуется для ясности русского основного текста.'
