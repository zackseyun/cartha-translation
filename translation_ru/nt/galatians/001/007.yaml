  source_fidelity: 'Смысл ключевых слов в целом передан верно: ταράσσοντες — «приводят вас в смятение», θέλοντες — «хотят», μεταστρέψαι — «исказить», а τοῦ Χριστοῦ обоснованно передано как «Мессии». Однако «которое, впрочем, не иное» не передаёт эллиптическое ὃ οὐκ ἔστιν ἄλλο ясно и по-русски воспринимается как грамматически и смыслово неудачная характеристика неопределённого «которого». «Просто» ослабляет и разговорно переоформляет εἰ μή.'
