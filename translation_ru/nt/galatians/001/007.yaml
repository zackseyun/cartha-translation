  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: ru
  text: Но другого Евангелия нет; есть лишь люди, которые приводят вас в смятение и хотят исказить Евангелие Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа».'
    reason: Традиционная передача греческого титула Χριστός.
lexical_decisions:
- source_word: ἄλλο
  choice: иное
  rationale: Существительное «Евангелие» ясно подразумевается из Гал 1:6 и по-русски не требует повторения; «не иное» сохраняет сжатость и противопоставление греческого текста.
- source_word: εἰ μή
  choice: просто
  rationale: 'Оборот вводит не строгое исключение, а поясняющую оговорку: никакого другого Евангелия нет — есть лишь возмутители, искажающие истинное.'
- source_word: ταράσσοντες
  choice: приводят вас в смятение
  rationale: Передаёт не только беспокойство, но и замешательство общины, оставаясь естественным для современного литературного русского языка.
- source_word: θέλοντες
  choice: хотят
  rationale: Прямо и без усиления передаёт намерение, выраженное причастием.
- source_word: μεταστρέψαι
  choice: исказить
  rationale: Передаёт превращение вести в нечто противоположное или извращённое, но не звучит архаично.
- source_word: εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшийся русский богословский термин, здесь обозначающий возвещаемую благую весть.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Сохраняет титульное и иудейско-мессианское содержание Χριστός; родительный падеж допускает смысл вести, принадлежащей Мессии или повествующей о Нём.
theological_decisions:
- issue: Отношение «иного» к Евангелию в предыдущем стихе
  choice: не иное
  alternative: не другое Евангелие
  rationale: Греческий текст отрицает, что предлагаемая весть действительно является ещё одним Евангелием. Эллипсис сохранён, поскольку его референт в русском контексте понятен.
- issue: Значение родительного τοῦ Χριστοῦ
  choice: Евангелие Мессии
  alternative: Евангелие о Мессии
  rationale: 'Буквальная конструкция сохраняет подлинную неоднозначность: это может быть весть Мессии, весть, принадлежащая Ему, либо весть о Нём; уточнение «о» сузило бы смысл.'
- issue: Передача Χριστός как титула или имени
  choice: Мессия
  alternative: Христос
  rationale: В данной конструкции титульное значение остаётся содержательным; «Мессия» ясно передаёт исходный смысл, а традиционная форма дана в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. «Впрочем» связывает фразу с предшествующим стихом, а «просто» естественно передаёт поясняющую оговорку εἰ μή. Заглавная буква в «Евангелие» выбрана для устойчивого религиозного термина.
