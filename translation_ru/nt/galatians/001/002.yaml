lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Союз продолжает перечень отправителей, начатый в предыдущем стихе; строчная буква сохраняет синтаксическую связь со стихом 1.
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: все братья, которые со мной
  rationale: Передаёт полный состав греческого выражения и естественно обозначает находящихся вместе с Павлом единоверцев. «Братья» сохраняет грамматически мужскую форму оригинала; возможное включение женщин отмечено в сноске.
- source_word: ἐκκλησίαις
  choice: церквям
  rationale: В апостольском обращении «церкви» — устоявшееся и естественное обозначение местных общин.
- source_word: τῆς Γαλατίας
  choice: Галатии
  rationale: Родительный падеж непосредственно воспроизводит греческую конструкцию и в русском языке естественно указывает на область, к которой принадлежат церкви.
theological_decisions:
- issue: Может ли ἀδελφοί включать верующих обоих полов?
  choice: 'В основном тексте: «братья»; возможный широкий охват указан в сноске.'
  alternative: «братья и сёстры»
  rationale: Греческое слово имеет форму мужского рода множественного числа, но в таком контексте может обозначать группу единоверцев, включающую женщин. Перевод сохраняет форму оригинала, не устраняя смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской терминологией. Тире отделяет группу отправителей от адресата и делает продолжающееся со стиха 1 предложение ясным.
