base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: ru
  text: Но даже если мы сами станем возвещать вам благую весть[a] или ангел с неба станет возвещать вам весть, отличную от той, которую мы вам возвещали[b], — да будет он проклят[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станем проповедовать вам Евангелие». В греческом тексте употреблён глагол со значением «возвещать благую весть».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весть, вопреки той, которую мы вам возвещали»; возможно также: «весть сверх того, что мы вам возвещали».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «да будет он под проклятием»; традиционная передача: «да будет анафема».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Но даже если
  rationale: Передаёт сильное противопоставление ἀλλά, усиление καί и условность ἐάν естественным современным русским оборотом.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: мы сами или ангел с неба
  rationale: «Мы сами» передаёт выраженное местоимением эмфатическое самоотнесение Павла, а «ангел с неба» сохраняет буквальный и понятный образ небесного посланника.
- source_word: εὐαγγελίζηται
  choice: станет возвещать вам благую весть
  rationale: Передаёт греческий глагол как действие, не подменяя его существительным; условная форма естественно согласуется с «если».
- source_word: παρ’ ὃ
  choice: не ту, которую
  rationale: В контексте обозначает отклонение от уже возвещённой вести. Формулировка ясна по-русски и не устраняет диапазон значений «иную», «отличную», «выходящую за пределы».
- source_word: εὐηγγελισάμεθα
  choice: мы вам возвещали
  rationale: Сохраняет лексическую связь с εὐαγγελίζηται и избегает тяжеловесного повторения полного выражения «возвещать благую весть».
- source_word: ἀνάθεμα ἔστω
  choice: да будет он проклят
  rationale: Сохраняет торжественную и суровую силу формулы, оставаясь понятным современному читателю и не вводя позднейшего узкотехнического церковного смысла слова «анафема».
theological_decisions:
- issue: Смысл формулы ἀνάθεμα ἔστω
  choice: 'Реальное провозглашение проклятия над всяким, кто возвещает весть, отклоняющуюся от ранее возвещённой апостольской благой вести: «да будет он проклят».'
  alternative: «Да будет предан анафеме» с акцентом на церковном отлучении или «да будет под проклятием» как более описательная передача.
  rationale: Греческая формула имеет суровую судебно-проклинающую силу, но сам стих не уточняет позднейшую церковную процедуру; выбранная передача сохраняет эту силу без конфессионального уточнения.
- issue: Характер отклонения, выраженного παρ’ ὃ
  choice: «Не ту, которую» — весть, не совпадающая с ранее возвещённой.
  alternative: «Противоречащую той», «отличную от той» или «сверх того, что».
  rationale: В данном полемическом контексте речь идёт об отклонении от апостольской вести, однако предлог допускает оттенки противоположности, отличия и выхода за установленные пределы; примечание сохраняет этот смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным оборотом «да будет». Повтор корня «возвещать» сохраняет связь двух форм одного греческого глагола. Эмфатическое «мы сами» подчёркивает, что Павел включает и себя в условное предостережение.
