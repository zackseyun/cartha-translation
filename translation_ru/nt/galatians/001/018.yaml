lexical_decisions:
- source_word: Ἔπειτα
  choice: Затем
  rationale: Передаёт переход к следующему событию в последовательном рассказе Павла.
- source_word: μετὰ ἔτη τρία
  choice: через три года
  rationale: Естественно передаёт временной промежуток; греческое выражение само по себе не уточняет, от какого именно момента ведётся исчисление.
- source_word: ἀνῆλθον
  choice: отправился
  rationale: В русском языке направление в Иерусалим обычно не выражается глаголом «поднялся»; выбор сохраняет смысл путешествия без неестественного буквализма.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Общепринятая современная русская форма топонима.
- source_word: ἱστορῆσαι
  choice: чтобы лично познакомиться
  rationale: Редкий глагол обозначает личную встречу с целью познакомиться или установить непосредственное знакомство; «лично» помогает передать оттенок личного контакта, не сводя действие к обычному визиту.
- source_word: Κηφᾶν
  choice: Кифой
  rationale: Сохраняет употреблённое Павлом арамейское имя, не заменяя его именем Пётр; творительный падеж обусловлен русской конструкцией «познакомиться с».
- source_word: ἐπέμεινα πρὸς αὐτόν
  choice: пробыл у него
  rationale: Естественно передаёт продолжительное пребывание рядом с Кифой; «у него» может подразумевать пребывание вместе с ним, не утверждая наверняка проживание в его доме.
- source_word: ἡμέρας δεκαπέντε
  choice: пятнадцать дней
  rationale: Винительный падеж в греческом обозначает длительность времени; русская конструкция с «пробыл» передаёт её прямо и естественно.
theological_decisions:
- issue: Цель посещения Кифы и возможный оттенок получения сведений
  choice: чтобы лично познакомиться с Кифой
  alternative: чтобы посетить Кифу; чтобы расспросить Кифу
  rationale: ἱστορῆσαι допускает оттенки посещения, знакомства и получения сведений через личную встречу. Основной текст передаёт непосредственное знакомство, не утверждая, что Павел ездил получать у Кифы богословское наставление.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, повествовательным звучанием. Имя «Кифа» сохранено в соответствии с исходным текстом; редкий глагол ἱστορῆσαι передан понятно, но без устранения его смысловой широты, которая отмечена в сноске.
