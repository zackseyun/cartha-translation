id: GAL.1.17
reference: Galatians 1:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: ru
  text: И не пошёл я в Иерусалим к тем, кто был апостолом до меня, а отправился в Аравию и снова вернулся в Дамаск.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: И не
  rationale: Продолжает отрицание из предыдущего контекста и естественно связывает стих с предшествующим высказыванием.
- source_word: ἀνῆλθον
  choice: пошёл … в Иерусалим
  rationale: В контексте путешествия глагол обозначает восхождение или путь в Иерусалим; по-русски естественно передать его как «пошёл», поскольку направление выражено предлогом «в».
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: к тем, кто стал апостолом раньше меня
  rationale: Передаёт направленность πρός и ясно сохраняет временной смысл πρὸ ἐμοῦ, не подразумевая превосходства по рангу.
- source_word: ἀλλὰ ἀπῆλθον
  choice: а отправился
  rationale: «А» выражает противопоставление, а «отправился» естественно передаёт движение и оттенок удаления, присущий ἀπέρχομαι.
- source_word: Ἀραβίαν
  choice: Аравию
  rationale: Общепринятое русское название региона; его точные исторические границы стих не уточняет.
- source_word: καὶ πάλιν ὑπέστρεψα
  choice: после чего вновь вернулся
  rationale: Сохраняет последовательность событий, значение повторности πάλιν и значение возвращения у ὑποστρέφω без тяжеловесного «и снова возвратился».
- source_word: Δαμασκόν
  choice: Дамаск
  rationale: Общепринятое русское название города.
theological_decisions:
- issue: Смысл выражения «раньше меня» применительно к апостолам
  choice: 'Временное первенство: они стали апостолами до Павла'
  alternative: Превосходство над Павлом по положению или авторитету
  rationale: πρὸ ἐμοῦ естественнее всего указывает на временную предшественность. Формулировка не вводит отсутствующего в тексте утверждения об иерархии.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Инверсия «не пошёл я» умеренно подчёркивает контраст и сохраняет связность с предыдущим стихом; архаизмы и конфессионально окрашенные добавления исключены.
