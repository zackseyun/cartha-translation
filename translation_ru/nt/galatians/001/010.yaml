source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: ru
  text: Ибо чьего одобрения я теперь добиваюсь — людей или Бога?[a] Или я стараюсь угождать людям? Если бы я по-прежнему угождал людям, то не был бы рабом Мессии.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так людей ли я теперь убеждаю — или Бога?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабом Христа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: теперь
  rationale: Передаёт временной акцент и возможное противопоставление нынешнего служения Павла его прежней жизни.
- source_word: πείθω
  choice: добиваюсь одобрения
  rationale: В данном риторическом противопоставлении глагол может обозначать стремление склонить кого-либо на свою сторону или снискать расположение. Такое выражение естественно по-русски и связано со следующим вопросом об угождении; более буквальное «убеждаю» сохранено в сноске.
- source_word: ἀνθρώπους
  choice: людей
  rationale: Речь идёт о людях вообще, а не только о мужчинах.
- source_word: ζητῶ ἀνθρώποις ἀρέσκειν
  choice: стараюсь угождать людям
  rationale: Естественно передаёт целенаправленное стремление нравиться людям и получать их одобрение.
- source_word: εἰ ἔτι ... ἤρεσκον
  choice: если бы я по-прежнему угождал
  rationale: Сослагательная конструкция передаёт нереальное условие, а «по-прежнему» сохраняет значение ἔτι и намёк на прежний образ действий.
- source_word: δοῦλος
  choice: раб
  rationale: Сохраняет сильное значение принадлежности и полной подчинённости, существенное для противопоставления угождению людям.
- source_word: Χριστοῦ
  choice: Христа
  rationale: «Христос» — укоренившаяся русская передача титула Χριστός; родительный падеж выражает принадлежность раба Христу.
theological_decisions:
- issue: Смысл πείθω в противопоставлении людям и Богу
  choice: добиваюсь одобрения
  alternative: убеждаю
  rationale: Контекст угождения людям допускает смысл снискания расположения, однако буквальное значение «убеждать» не исключено и потому отмечено в сноске, без устранения смыслового напряжения.
- issue: Передача Χριστοῦ δοῦλος
  choice: раб Христа
  alternative: слуга Мессии
  rationale: «Раб» сохраняет идею полной принадлежности и верности, тогда как «слуга» ослабляет силу δοῦλος. «Христос» является традиционным русским титулом; его значение пояснено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской риторики. Два вопроса и условное заключение сохранены; выражение «В самом деле» естественно передаёт связующую функцию γάρ.
