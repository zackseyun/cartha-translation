lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, продолжающий повествование Павла.
- source_word: ἐδόξαζον
  choice: прославляли
  rationale: Глагол δοξάζω означает «воздавать славу, прославлять». Несовершенный вид греческой формы передаёт продолжавшееся или повторявшееся действие, что естественно выражено русским несовершенным видом.
- source_word: ἐν ἐμοὶ
  choice: из-за меня
  rationale: 'В данном контексте сочетание ἐν с местоимением естественно понимать в причинном или ассоциативном смысле: общины прославляли Бога в связи с тем, что произошло с Павлом. Более буквальный вариант сохранён в сноске.'
- source_word: τὸν θεόν
  choice: Бога
  rationale: Прямое дополнение при «прославляли»; стандартная и точная передача θεός.
theological_decisions:
- issue: Значение ἐν ἐμοὶ
  choice: 'причинное/ассоциативное: «из-за меня»'
  alternative: 'буквальное или сферическое: «во мне»'
  rationale: Контекст говорит об отклике общин на обращение Павла и известие о его служении. Основной вариант ясно передаёт причину прославления Бога, а сноска сохраняет подлинную неоднозначность греческого выражения.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Несовершенный вид «прославляли» сохраняет длительный или повторный оттенок греческого имперфекта.
