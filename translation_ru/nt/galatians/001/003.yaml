lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Устоявшееся русское соответствие сохраняет и форму апостольского приветствия, и богословскую насыщенность слова.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж естественно передаёт адресата благословения.
- source_word: εἰρήνη
  choice: мир
  rationale: Сохраняет обычное значение слова, фон библейского приветствия и идею целостного благополучия.
- source_word: ἀπό
  choice: от
  rationale: Предлог прямо обозначает источник благодати и мира.
- source_word: θεοῦ πατρὸς
  choice: Бога Отца
  rationale: В данном тексте ἡμῶν стоит после κυρίου, поэтому определение «нашего» отнесено к Господу, а θεοῦ πατρὸς передано как «Бога Отца».
- source_word: κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Сохраняет естественную синтаксическую связь местоимения ἡμῶν с непосредственно предшествующим κυρίου и титульную силу κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передан как титул «Мессия»; традиционный вариант «Иисус Христос» указан в сноске.
theological_decisions:
- issue: Следует ли относить ἡμῶν («нашего») к Богу Отцу или к Господу
  choice: «Бога Отца и нашего Господа»
  alternative: «Бога, нашего Отца, и Господа»
  rationale: В предоставленном тексте SBLGNT ἡμῶν следует непосредственно за κυρίου; однако отмеченная издателями перестановка слов объясняет распространённое альтернативное понимание, приведённое в сноске.
- issue: Передавать ли Χριστοῦ переводным титулом или традиционной формой «Христа»
  choice: «Мессии»
  alternative: «Христа»
  rationale: В сочетании Ἰησοῦ Χριστοῦ слово сохраняет мессианскую титульную силу; традиционная передача также возможна и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского благословения. Порядок «Бога Отца и нашего Господа» следует именно предоставленному греческому тексту, а не английскому консультационному слою. Формула «Иисуса Мессии» несколько менее привычна, но понятна и сохраняет титульный смысл; традиционная форма вынесена в сноску.
