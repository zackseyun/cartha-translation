id: GAL.1.4
reference: Galatians 1:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: ru
  text: который отдал себя за наши грехи, чтобы избавить нас от нынешнего злого века[a], по воле нашего Бога и Отца,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от нынешнего злого мира».'
    reason: 'Лексическая альтернатива: в данном контексте αἰών традиционно может передаваться словом «мир», хотя основное значение — «век» или «эпоха».'
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: отдал себя
  rationale: Передаёт добровольное действие Христа естественным современным русским языком; более буквальное «дал себя» звучит неестественно, а «предал себя» может привнести нежелательные оттенки.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: за наши грехи
  rationale: Кратко и естественно сохраняет искупительный смысл ὑπέρ, не уточняя сверх текста конкретный механизм искупления.
- source_word: ἐξέληται
  choice: избавить
  rationale: Глагол обозначает выведение из опасного или порабощающего положения; «избавить» точно и идиоматично передаёт этот смысл.
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: нынешнего злого века
  rationale: «Век» сохраняет временной и космический смысл αἰών лучше, чем «мир»; «нынешнего» естественно передаёт ἐνεστῶτος, а «злого» — нравственную характеристику πονηροῦ.
- source_word: κατὰ τὸ θέλημα
  choice: по воле
  rationale: Естественная русская формула, точно выражающая соответствие Божьему замыслу.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: нашего Бога и Отца
  rationale: Ясно показывает, что Бог и Отец — одно лицо, и естественно передаёт притяжательное ἡμῶν.
theological_decisions:
- issue: Следует ли конкретизировать смысл жертвы в выражении ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: за наши грехи
  alternative: ради наших грехов; из-за наших грехов
  rationale: Выбранная формулировка сохраняет искупительную силу выражения, но не навязывает тексту развёрнутую теорию искупления.
- issue: Передавать ли αἰών как «век» или как «мир»
  choice: нынешний злой век
  alternative: нынешний злой мир
  rationale: Здесь αἰών прежде всего обозначает настоящее время-порядок в противопоставлении грядущему веку. «Век» сохраняет эту эсхатологическую перспективу, тогда как «мир» может быть понят как физическое творение.
translation_notes:
  register: Современный литературный русский язык с dignified biblical register. Начальное «который» сохраняет связь с упомянутым в предыдущем стихе Иисусом Христом. Местоимение «себя» дано со строчной буквы в соответствии с нейтральной современной орфографической практикой; запятая в конце сохранена, поскольку стих синтаксически продолжается в Гал 1:5.
