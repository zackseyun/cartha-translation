  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: ru
  text: А то, что я пишу вам, — вот, перед Богом, я не лгу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ
  choice: в том, что
  rationale: Относительное местоимение среднего рода множественного числа обозначает содержание написанного; конструкция «в том, что я пишу» естественно связывает его с последующим отрицанием лжи.
- source_word: δὲ
  choice: а
  rationale: Частица отмечает мягкий переход или лёгкое противопоставление, не усиливая его до резкого «но».
- source_word: γράφω ὑμῖν
  choice: я пишу вам
  rationale: Настоящее время и дательный адресата прямо и естественно передаются по-русски.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет явный торжественный усилительный сигнал исходного текста; примечание поясняет его функцию.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Естественная современная формула, выражающая осознание Божьего присутствия и ответственности перед Ним, без превращения высказывания в более формальную клятву.
- source_word: ὅτι
  choice: двоеточие перед «я не лгу»
  rationale: Союз вводит содержание торжественного заверения; в русском его функцию естественно передаёт пунктуация.
- source_word: οὐ ψεύδομαι
  choice: я не лгу
  rationale: Краткое и прямое отрицание сохраняет настоящее время и силу самооправдания Павла.
theological_decisions:
- issue: Сила обращения к Богу как свидетелю
  choice: '«перед Богом: я не лгу» — торжественное заверение в осознании ответственности перед Богом'
  alternative: Понять выражение лишь как общее эмоциональное усиление или передать его как формальную клятву
  rationale: ἐνώπιον τοῦ θεοῦ придаёт утверждению серьёзность и связывает истинность слов Павла с Божьим присутствием, однако в греческом нет развёрнутой формулы клятвы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным оттенком. Слово «вот» сохранено как стилистически маркированный, но понятный эквивалент ἰδού; двоеточие делает структуру заверения ясной.
