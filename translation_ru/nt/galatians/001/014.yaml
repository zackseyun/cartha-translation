  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: ru
  text: И в иудаизме я преуспевал больше многих моих сверстников среди моего народа, проявляя гораздо больше ревности к отеческим преданиям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преданиям моих предков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: преуспевал
  rationale: Имперфект обозначает продолжавшееся в прошлом продвижение; «преуспевал» естественно передаёт развитие и сравнительный характер высказывания.
- source_word: Ἰουδαϊσμῷ
  choice: в иудаизме
  rationale: Краткий и общепонятный эквивалент, способный охватить религиозную традицию и связанный с ней образ жизни без избыточного пояснения.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: больше многих сверстников
  rationale: ὑπέρ выражает сравнение, а συνηλικιώτας означает людей одного возраста; «сверстников» точно и естественно передаёт возрастной аспект.
- source_word: ἐν τῷ γένει μου
  choice: из моего народа
  rationale: γένος здесь обозначает этническую и общественную принадлежность; «мой народ» ясно передаёт смысл, не привнося современного понятия расы.
- source_word: περισσοτέρως ζηλωτὴς ὑπάρχων
  choice: будучи гораздо ревностнее их
  rationale: Сохраняются причастная конструкция, усилительная степень и подразумеваемое сравнение со сверстниками.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: в отношении преданий моих предков
  rationale: πατρικός указывает на унаследованное от отцов или предков, а παραδόσεις — на переданные традиции; «предания» сохраняет религиозно-исторический оттенок.
theological_decisions:
- issue: Объект сравнительной степени в выражении περισσοτέρως ζηλωτὴς
  choice: «гораздо ревностнее их» — сравнение со сверстниками
  alternative: «чрезвычайно ревностный» — абсолютная характеристика степени ревности
  rationale: Контекст предыдущего сравнительного оборота поддерживает сравнение Павла с его сверстниками, хотя наречие может восприниматься и как простое усиление.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Предания» выбрано вместо более общего «традиции», поскольку оно естественно для религиозного контекста; архаические синтаксические обороты избегаются.
