  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: γὰρ («ведь»), прежний образ жизни (ἀναστροφήν ποτε), «в иудаизме», усиление καθ’ ὑπερβολήν («безмерно»), длительно-повторяющийся характер обоих имперфектов («преследовал», «разорял») и принадлежность общины Богу («церковь Божью»). Союз «как» естественно вводит содержание того, о чём адресаты слышали, и не меняет смысла ὅτι.'
  naturalness: Фраза звучит естественно на современном литературном русском. «Вы ведь слышали» хорошо сохраняет связующую и апеллятивную функцию γὰρ. «Разорял её» — сильное, ясное и стилистически уместное слово; оно не утверждает завершённого уничтожения.
  terminology: «Иудаизм» является устоявшимся и нейтральным соответствием Ἰουδαϊσμός. «Церковь Божью» корректно передаёт ἐκκλησία τοῦ θεοῦ в данном контексте и не навязывает конфессионального истолкования. Выбранные сноски привязаны к соответствующим словам и сообщают действительные лексические альтернативы.
