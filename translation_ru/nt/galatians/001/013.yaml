id: GAL.1.13
reference: Galatians 1:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: ru
  text: 'Вы ведь слышали о моём прежнем образе жизни в иудаизме[a]: как я безмерно преследовал церковь Божью и разорял её[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в иудейской религии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «старался уничтожить её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: прежнем образе жизни
  rationale: Сочетание передаёт как широкий смысл ἀναστροφή — образ жизни, поведение, — так и временное значение ποτε, указывающее на прошлое Павла.
- source_word: Ἰουδαϊσμῷ
  choice: иудаизме
  rationale: Это прямой и установившийся русский эквивалент, обозначающий здесь религиозную принадлежность и уклад жизни Павла до его призвания.
- source_word: καθ’ ὑπερβολὴν
  choice: безмерно
  rationale: 'Наречие естественно по-русски передаёт усиление: преследование было чрезвычайным, выходящим за обычные пределы.'
- source_word: ἐδίωκον
  choice: преследовал
  rationale: Несовершенный вид русского глагола сохраняет длительный и повторявшийся характер действия, выраженный греческим имперфектом.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: церковь Божью
  rationale: «Церковь» естественно обозначает здесь общину верующих; определение «Божью» сохраняет принадлежность, выраженную родительным τοῦ θεοῦ.
- source_word: ἐπόρθουν
  choice: разорял
  rationale: Глагол передаёт сильный образ опустошения и разрушения, а несовершенный вид отражает греческий имперфект, не уточняя, было ли разрушение доведено до конца.
theological_decisions:
- issue: Передача ἐκκλησία как «церковь» или «собрание»
  choice: церковь Божью
  alternative: собрание Божье
  rationale: В контексте имеется в виду узнаваемая община последователей Христа. «Церковь» ясно и идиоматично передаёт этот референт, не добавляя конфессиональных уточнений.
- issue: Степень результативности ἐπόρθουν
  choice: разорял её
  alternative: старался уничтожить её
  rationale: Греческий имперфект описывает продолжавшееся разрушительное действие, но сам по себе не требует ни утверждения полного уничтожения, ни явного обозначения одной лишь попытки. «Разорял» сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. «Вы ведь слышали» естественно передаёт γὰρ как связь с предшествующим рассуждением и апелляцию к известному читателям факту. Порядок слов слегка адаптирован ради русской плавности.
