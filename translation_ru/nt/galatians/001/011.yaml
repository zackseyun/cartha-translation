base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: ru
  text: 'Ибо, братья[a], хочу, чтобы вы знали: Евангелие, возвещённое мною, — не человеческого происхождения[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «братья» здесь может включать и братьев, и сестёр — всю общину верующих.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не по человеку»; этот оборот может также означать «не по человеческим меркам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: хочу, чтобы вы знали
  rationale: В данном контексте оборот вводит важное разъяснение. Такой перевод естественно передаёт его функцию в современном русском языке, не добавляя нового содержания.
- source_word: γὰρ
  choice: ибо
  rationale: Союз связывает утверждение с предшествующим рассуждением как его пояснение или обоснование; «ибо» сохраняет эту логическую связь и соответствует достоинству регистра.
- source_word: ἀδελφοί
  choice: братья
  rationale: Греческое слово стоит в мужском роде множественного числа и служит прямым обращением; у Павла оно нередко охватывает всю общину, что отражено в сноске.
- source_word: εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшийся русский богословский термин точно передаёт здесь специфическое значение возвещаемой Павлом Благой вести.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: которое я возвещал
  rationale: Передаёт совершавшееся Павлом публичное провозглашение Евангелия и звучит естественнее буквальной страдательной конструкции.
- source_word: κατὰ ἄνθρωπον
  choice: не человеческого происхождения
  rationale: В ближайшем контексте Павел отрицает, что получил Евангелие от человека или был научен ему человеком (1:12), поэтому значение происхождения наиболее вероятно; буквальный оборот и иная возможная трактовка сохранены в сноске.
theological_decisions:
- issue: Обозначает ли κατὰ ἄνθρωπον человеческое происхождение или соответствие человеческим меркам
  choice: не человеческого происхождения
  alternative: не по человеку; не по человеческим меркам
  rationale: Продолжение мысли в Гал 1:12 прежде всего говорит об источнике Евангелия, но греческий оборот допускает оттенок человеческой нормы или образца, поэтому эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского обращения. «Ибо» сохраняет причинно-пояснительную связь, двоеточие естественно вводит содержание сообщения, а активная конструкция «я возвещал» избегает тяжеловесности без потери смысла.
