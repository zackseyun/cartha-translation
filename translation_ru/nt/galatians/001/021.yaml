  text: ἔπειτα ἦλθον εἰς τὰ κλίματα τῆς Συρίας καὶ τῆς Κιλικίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/021.yaml
  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: ru
  text: Затем я отправился в области Сирии и Киликии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα
  choice: Затем
  rationale: Передаёт последовательность событий в рассказе Павла естественным современным русским языком.
- source_word: ἦλθον
  choice: я отправился
  rationale: Хотя глагол буквально может означать «пришёл», здесь он описывает перемещение рассказчика к следующему месту; «отправился» естественно передаёт этот повествовательный ракурс.
- source_word: εἰς
  choice: в
  rationale: Русский предлог «в» естественно выражает направление движения к названным областям; различие между «в» и «в пределы» не требует отдельной оговорки.
- source_word: κλίματα
  choice: области
  rationale: Обозначает географические области или края, а не отдельные города; «области» точно и понятно в современном русском.
- source_word: Συρίας
  choice: Сирии
  rationale: Общепринятая русская форма географического названия в требуемом падеже.
- source_word: Κιλικίας
  choice: Киликии
  rationale: Общепринятая русская форма географического названия в требуемом падеже.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. «Отправился» выбрано вместо более буквального «пришёл», поскольку по-русски оно естественнее описывает дальнейший путь от лица рассказчика. Стилистически допустимый вариант «края Сирии и Киликии» не вынесен в сноску, так как не меняет смысла.
