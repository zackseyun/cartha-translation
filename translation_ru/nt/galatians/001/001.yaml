id: GAL.1.1
reference: Galatians 1:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: ru
  text: Павел, апостол не от людей и не через человека, но через Иисуса — Мессию — и Бога Отца, воскресившего его из мёртвых,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: апостол
  rationale: Устоявшееся русское обозначение посланника, наделённого полномочиями; сохраняет формальный статус и богословский вес самопредставления Павла.
- source_word: ἀπ’ ἀνθρώπων
  choice: не от людей
  rationale: Предлог ἀπό с родительным указывает на источник или происхождение. Множественное число сохранено ради риторического противопоставления следующему единственному числу.
- source_word: δι’ ἀνθρώπου
  choice: не через человека
  rationale: διά с родительным выражает посредничество или действующее лицо. Буквальное «через» сохраняет отличие от «от людей», а единственное число — структуру греческой фразы.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: Повтор «через» воспроизводит διά и противопоставляет человеческому посредничеству истинное основание апостольства Павла. «Мессия» передаёт титульный смысл Χριστός; традиционное «Христос» дано в примечании.
- source_word: θεοῦ πατρὸς
  choice: Бога Отца
  rationale: Естественное для русского языка сочетание сохраняет единое управление предлогом «через» и координацию Иисуса Мессии с Богом Отцом.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: воскресившего его из мёртвых
  rationale: Причастный оборот относится к Богу Отцу. «Воскресившего» естественно передаёт ἐγείραντος в контексте воскресения, а «из мёртвых» сохраняет образ греческого выражения.
theological_decisions:
- issue: Передача Χριστοῦ в Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  alternative: Иисуса Христа
  rationale: В приветствии Χριστός сохраняет значение титула, поэтому «Мессия» делает его смысл прозрачным и не превращает в подобие фамилии. Более привычная церковная форма отмечена как допустимая лексическая альтернатива.
- issue: Связь διά с Иисусом Мессией и Богом Отцом
  choice: Сохранить общее значение «через» для обоих однородных членов
  alternative: Перестроить фразу как «по воле Иисуса Мессии и Бога Отца»
  rationale: Греческий предлог непосредственно управляет обоими именами. Хотя сочетание «через Бога Отца» менее обычно по-русски, оно сохраняет заявленное Павлом противопоставление человеческого и божественного посредничества, не сужая διά до одной лишь «воли».
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Синтаксический параллелизм «не от… не через… но через…» сохранён ради аргументативного акцента оригинала. Местоимение «его» дано со строчной буквы по нормам современного русского письма; его референтом является Иисус Мессия.
