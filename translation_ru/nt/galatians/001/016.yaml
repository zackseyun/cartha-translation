  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: ru
  text: явить во мне Своего Сына[a], чтобы я возвещал Его среди язычников, — я не стал сразу советоваться с плотью и кровью[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мне»; или: «через меня».'
    reason: alternative_reading
  - marker: b
    text: «Плоть и кровь» — устойчивое выражение, означающее человека или людей.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: открыть
  rationale: Инфинитив продолжает мысль предыдущего стиха о Божьем благоволении; «открыть» естественно передаёт смысл Божественного откровения.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Своего Сына
  rationale: Возвратное местоимение естественно по-русски соотносит Сына с действующим лицом предыдущего контекста — Богом; титул «Сын» сохранён.
- source_word: ἐν ἐμοὶ
  choice: во мне
  rationale: Буквально сохраняет предлог ἐν и не снимает неоднозначность между внутренним откровением и откровением, совершаемым через Павла; варианты вынесены в сноску.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: чтобы я возвещал Его
  rationale: 'Сохраняет личное местоимение как прямое дополнение: Павел возвещает Самого Сына, а не только в более общем виде весть о Нём.'
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди язычников
  rationale: В данном контексте ἔθνη обозначает нееврейские народы; «язычники» — традиционный и понятный русский эквивалент без смыслового расширения.
- source_word: εὐθέως
  choice: сразу
  rationale: Естественный современный эквивалент со значением непосредственности во времени.
- source_word: οὐ προσανεθέμην
  choice: я не стал советоваться
  rationale: Передаёт значение обращения к другим за советом или обсуждением; сочетание естественно управляет последующей формулой «с плотью и кровью».
- source_word: σαρκὶ καὶ αἵματι
  choice: с плотью и кровью
  rationale: Сохранён яркий семитский оборот, означающий человека или людей; его идиоматический смысл разъяснён в сноске.
theological_decisions:
- issue: Значение ἐν ἐμοὶ применительно к откровению Сына
  choice: Сохранить буквальное и неоднозначное «во мне» в основном тексте
  alternative: «мне» или «через меня»
  rationale: Фраза допускает понимание как внутреннего откровения Павлу, откровения ему или откровения через него. Основной текст не устраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены образность выражения «плоть и кровь» и неоднозначность «во мне»; прописные буквы в местоимениях «Своего», «Его» следуют принятой русской благоговейной орфографической практике.
