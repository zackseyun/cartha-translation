  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: ru
  text: 'Как мы уже говорили, так и теперь снова говорю: если кто возвещает вам благую весть вопреки тому, что вы приняли[a], да будет он проклят[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сверх того, что вы приняли»; греческое выражение может обозначать выход за пределы принятой вести или отклонение от неё.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да будет он под проклятием»; греч. ἀνάθεμα ἔστω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Как мы уже говорили
  rationale: Передаёт ранее высказанное предостережение и его сохраняющуюся значимость; по-русски звучит естественно и ясно.
- source_word: ἄρτι πάλιν λέγω
  choice: так и теперь снова говорю
  rationale: «Теперь» сохраняет указание на настоящий момент, а «снова» — повторность высказывания.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: если кто возвещает вам иную благую весть
  rationale: Глагол означает возвещение благой вести; слово «иную» в русском необходимо для естественной связи с последующим противопоставлением, хотя семантически отклонение выражено прежде всего оборотом παρ’ ὃ.
- source_word: παρ’ ὃ
  choice: вопреки той, которую
  rationale: В контексте выражает отклонение от принятой галатами вести. «Вопреки» сохраняет резкую полемическую силу, тогда как буквальное «сверх» могло бы быть понято лишь как дополнение.
- source_word: παρελάβετε
  choice: вы приняли
  rationale: В контексте получения и усвоения переданной вести русское «приняли» естественно передаёт παραλαμβάνω, не сводя смысл только к физическому получению.
- source_word: ἀνάθεμα ἔστω
  choice: да будет он проклят
  rationale: Сохраняет торжественную и судебную силу греческой формулы, не прибегая к менее понятной транслитерации «анафема».
theological_decisions:
- issue: Сила осуждения в ἀνάθεμα ἔστω
  choice: да будет он проклят
  alternative: да будет он под проклятием
  rationale: Формулировка передаёт всю строгость предупреждения Павла, но не добавляет отсутствующего в тексте уточнения о том, кем именно налагается проклятие.
- issue: Характер отклонения, выраженного παρ’ ὃ
  choice: вопреки той, которую вы приняли
  alternative: сверх того, что вы приняли
  rationale: Контекст указывает на несовместимость возвещаемой вести с уже принятой, однако альтернативу следует отметить, поскольку παρά может иметь оттенок выхода за пределы или отклонения от нормы.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой «да будет». «Благая весть» сохраняет словесную связь с глаголом εὐαγγελίζεται; «иная» делает противопоставление естественным по-русски. Все сноски отмечены в основном тексте.
