  yaml_path: translation/nt/galatians/001/005.yaml
  text: to whom be the glory forever and ever. Amen.
translation:
  language: ru
  text: Ему слава во веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: Ему
  rationale: Дательный падеж относительного местоимения вводит славословие и указывает на ближайший антецедент из предыдущего стиха — «Бога и Отца нашего». В русском краткое «Ему» естественнее буквального «Которому» и сохраняет связь с контекстом.
- source_word: ἡ δόξα
  choice: слава
  rationale: «Слава» — точный, привычный и стилистически уместный эквивалент в формуле славословия.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся русская библейская формула точно передаёт греческую идиому неограниченной длительности и остаётся понятной современному читателю.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная транслитерация торжественного подтверждения, завершающего славословие.
theological_decisions:
- issue: Подразумеваемая глагольная связка в славословии
  choice: Ему слава
  alternative: Ему да будет слава; Ему принадлежит слава
  rationale: В греческом тексте глагол отсутствует. Русская безглагольная формула сохраняет эту лаконичность и допускает присущую оригиналу смысловую широту между утверждением и пожеланием, не разрешая её искусственно.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой, торжественной формулы библейского славословия. Архаизирующая конструкция «во веки веков» оправдана как живая устойчивая идиома; иных архаизмов нет.
