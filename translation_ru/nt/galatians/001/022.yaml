lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Частица обозначает мягкий переход или лёгкое противопоставление; русское «А» естественно передаёт связь с предыдущим высказыванием.
- source_word: ἤμην ἀγνοούμενος τῷ προσώπῳ
  choice: не знали меня лично
  rationale: Греческая конструкция буквально описывает Павла как неизвестного «по лицу»; по-русски естественнее передать отсутствие личного знакомства активной конструкцией.
- source_word: ἐκκλησίαις
  choice: церкви
  rationale: В данном контексте речь идёт о местных общинах последователей Иисуса; «церкви» — ясный и привычный русский эквивалент.
- source_word: τῆς Ἰουδαίας
  choice: Иудеи
  rationale: Использовано традиционное русское географическое название.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός сохраняет силу титула «Помазанник / Мессия», а оборот ἐν Χριστῷ выражает определяющую связь общин с Мессией.
theological_decisions:
- issue: Передача Χριστῷ в выражении ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Перевод «Мессия» сохраняет титульное значение Χριστός. Традиционное «во Христе» также возможно и отмечено в сноске, без устранения смыслового напряжения формулы ἐν Χριστῷ.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского регистра. Порядок слов перестроен ради естественности: адресат греческого дательного сделан грамматическим подлежащим, при этом смысл личной неизвестности сохранён.'
