reference: Galatians 1:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: ru
  text: Других же апостолов я не видел, кроме Иакова[a], брата Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никакого другого апостола я не видел — только Иакова, брата Господа». При таком понимании Иаков здесь не обязательно причисляется к апостолам.'
    reason: Альтернативное синтаксическое прочтение сохраняет возможность понимать εἰ μὴ как присоединение Иакова без его включения в названную группу.
lexical_decisions:
- source_word: ἕτερον
  choice: других
  rationale: В сочетании с родительным множественного числа τῶν ἀποστόλων слово означает другого или иных из числа апостолов. Русское «других» естественно согласуется с отрицательной конструкцией.
- source_word: δέ
  choice: же
  rationale: Частица обозначает мягкое противопоставление или переход относительно предыдущего стиха; постпозитивное «же» передаёт это без излишне резкого контраста.
- source_word: ἀποστόλων
  choice: апостолов
  rationale: В данном контексте у Павла речь идёт об апостолах; общеупотребительный библейский термин точен и понятен.
- source_word: οὐκ εἶδον
  choice: я не видел
  rationale: Прямая передача отрицания и аориста, естественная для современного русского повествования.
- source_word: εἰ μὴ
  choice: кроме
  rationale: Здесь оборот вводит исключение, а не условие. «Кроме» наиболее естественно сохраняет синтаксическую связь с «других апостолов».
- source_word: Ἰάκωβον
  choice: Иакова
  rationale: Традиционная русская форма имени Ἰάκωβος, уместная в библейском тексте.
- source_word: ἀδελφὸν
  choice: брата
  rationale: Основное и непосредственное значение слова — «брат»; контекст не требует более широкого обозначения родства.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Кύριος передано традиционным титулом «Господь»; родительный оборот «брата Господа» точен и естественен.
theological_decisions:
- issue: Причисляет ли эта конструкция Иакова к апостолам
  choice: 'Основной текст следует наиболее естественному синтаксису: Иаков является исключением из числа «других апостолов», которых Павел не видел.'
  alternative: 'Возможно понимать фразу так: Павел не видел никакого другого апостола, а видел лишь Иакова, которого при таком прочтении не обязательно называть апостолом.'
  rationale: Оборот εἰ μὴ обычно вводит исключение к предшествующей группе. Однако формулировка допускает и иное пунктуационно-синтаксическое понимание, поэтому оно отмечено в сноске без разрешения богословского вопроса в самом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Порядок слов сохраняет акцент на том, что других апостолов Павел не видел, но остаётся естественным для русского читателя.
