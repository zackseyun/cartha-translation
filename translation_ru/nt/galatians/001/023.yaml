  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: ru
  text: 'Они только слышали: «Тот, кто прежде преследовал нас, теперь проповедует веру[a], которую когда-то стремился уничтожить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благую весть». Буквально: «веру»; здесь, вероятно, имеется в виду христианская весть или вера, которую Павел прежде стремился уничтожить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: только
  rationale: 'Передаёт ограничение: их знание о Павле сводилось к доходившему до них сообщению.'
- source_word: ἀκούοντες ἦσαν
  choice: слышали
  rationale: Перифрастический имперфект указывает на продолжавшееся или повторявшееся получение известий; в русском это естественно выражается формой «слышали» в сочетании с «только».
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: тот, кто прежде преследовал нас
  rationale: Субстантивированное причастие с ποτέ естественно передаётся описательным оборотом, указывающим на прежнюю деятельность Павла.
- source_word: νῦν εὐαγγελίζεται
  choice: теперь возвещает
  rationale: Глагол обозначает провозглашение благой вести; «возвещает» сохраняет этот оттенок и естественно сочетается с дополнением «веру».
- source_word: τὴν πίστιν
  choice: веру
  rationale: В данном контексте слово с артиклем, вероятнее всего, обозначает христианскую веру как возвещаемую весть или содержание веры, а не только личный акт доверия; буквальная лексема сохраняет смысловую напряжённость.
- source_word: ἣν ποτε ἐπόρθει
  choice: которую когда-то пытался уничтожить
  rationale: πορθέω означает разорять или уничтожать; такая формулировка ясно передаёт направленность прежних действий Павла, не утверждая, что вера действительно была уничтожена.
theological_decisions:
- issue: Значение τὴν πίστιν
  choice: «вера» как христианская весть или содержание исповедуемой веры, которое Павел теперь возвещает
  alternative: «вера» как акт верования; контекстуально также возможно «Благая весть»
  rationale: Противопоставлены прежнее преследование Павлом и нынешнее возвещение того, что он прежде стремился уничтожить. Артикль и функция прямого дополнения при εὐαγγελίζεται поддерживают объективный смысл, но примечание сохраняет допустимую контекстуальную альтернативу.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный и естественный синтаксис. Прямая речь сохраняет форму дошедшего до общин сообщения. Маркер сноски поставлен после всей цитаты, поскольку поясняет выражение «веру» внутри неё.
