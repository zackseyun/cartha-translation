base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: ru
  text: Но когда Тот, кто отделил меня от утробы матери моей[a] и призвал Своей благодатью, благоволил
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с самого рождения»; ср. язык пророческого призвания в Иеремии 1:5 и Исаии 49:1.'
    reason: Указывает возможную идиоматическую передачу выражения и его ветхозаветные параллели.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Но когда
  rationale: Передаёт временное значение ὅτε и мягкий противительно-переходный оттенок δέ, естественно связывая фразу с предыдущим контекстом.
- source_word: εὐδόκησεν
  choice: благоволил
  rationale: Сохраняет значение благого изволения, особенно уместное при описании Божьего действия, и не сводит его к простому решению. Незавершённость фразы отражает её продолжение в следующем стихе.
- source_word: ὁ ἀφορίσας με
  choice: Тот, Кто отделил меня
  rationale: Субстантивированное причастие передано определительной конструкцией. «Отделил» сохраняет идею особого предназначения, не добавляя прямо понятий избрания или назначения.
- source_word: ἐκ κοιλίας μητρός μου
  choice: ещё от утробы матери моей
  rationale: Сохраняет конкретный образ греческого текста и его связь с языком пророческого призвания. «Ещё» естественно подчёркивает исходный момент, не превращая выражение в более определённое «до рождения».
- source_word: καλέσας
  choice: призвал
  rationale: «Призвал» естественно передаёт божественный зов и сохраняет как личный, так и служебный оттенок выражения.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: Своей благодатью
  rationale: Творительный падеж естественно передаёт инструментальное значение διά с родительным; возвратное «Своей» ясно соотносит благодать с действующим лицом.
theological_decisions:
- issue: Следует ли передавать ἀφορίσας термином, прямо выражающим учение о предопределении или избрании
  choice: отделил меня
  alternative: избрал меня; предназначил меня; назначил меня
  rationale: Греческий текст говорит об отделении Павла для особого призвания и перекликается с пророческой речью, но сам по себе не требует более систематизированной формулировки.
- issue: Следует ли явно называть Бога там, где греческий текст использует субстантивированное причастие
  choice: Тот, Кто
  alternative: Бог, Который
  rationale: Из контекста действующее лицо ясно, однако его имя в данном фрагменте не выражено. Конструкция «Тот, Кто» сохраняет форму и степень явности оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Утроба» сохраняет образ оригинала и остаётся понятной; «благоволил» передаёт торжественный оттенок εὐδόκησεν. Синтаксическая незавершённость сохранена, поскольку предложение продолжается в Галатам 1:16.
