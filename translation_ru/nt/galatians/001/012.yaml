source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: ru
  text: Ведь я получил его не от человека и не через обучение, а через откровение Иисуса Мессии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение может означать как откровение, данное Иисусом Мессией, так и откровение об Иисусе Мессии.
    reason: alternative_reading
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: от человека
  rationale: Единственное число имеет обобщённый смысл и обозначает человеческий источник или посредничество, а не какого-либо определённого человека.
- source_word: παρέλαβον
  choice: получил
  rationale: Глагол уместно передаёт получение передаваемого учения или вести; местоимение «его» отсылает к Евангелию из контекста.
- source_word: ἐδιδάχθην
  choice: меня ему не учили
  rationale: 'Естественная современная русская конструкция сохраняет страдательный смысл: Павел отрицает, что Евангелие было преподано ему кем-либо.'
- source_word: δι’ ἀποκαλύψεως
  choice: через откровение
  rationale: Предлог διά с родительным падежом обозначает средство, а существительное указывает на акт раскрытия прежде сокрытого.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: 'Родительный падеж сохраняет грамматическую неоднозначность: Иисус Мессия может быть как дающим откровение, так и его содержанием. Χριστός передано титулом «Мессия».'
theological_decisions:
- issue: Значение родительного падежа в ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: Сохранить в основном тексте неоднозначное «откровение Иисуса Мессии»
  alternative: «откровение от Иисуса Мессии» или «откровение об Иисусе Мессии»
  rationale: Греческая конструкция допускает и субъектное/источниковое, и объектное понимание. Контекст поддерживает источник откровения, однако грамматика не исключает откровение об Иисусе, поэтому основной текст не сужает смысл, а сноска поясняет оба варианта.
translation_notes:
  register: Современный литературный русский язык. Повтор «я получил его» после тире естественно восполняет пропущенный в греческом сказуемый и ясно выражает противопоставление человеческого обучения откровению; формула «Иисус Мессия» сохраняет титульное значение Χριστός.
