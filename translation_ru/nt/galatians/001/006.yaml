  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: ru
  text: Меня поражает, что вы так быстро отходите от того, кто призвал вас в благодати Мессии[a][b], к иной благой вести[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодатью Мессии». Предлог может указывать как на сферу, так и на средство призвания.'
    reason: alternative_reading
  - marker: b
    text: В греческом тексте — «Христа»; здесь это слово переведено как «Мессия», поскольку оно употреблено как титул.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к другой благой вести».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Я поражён
  rationale: Передаёт не просто удивление, а потрясение и неодобрение Павла естественным современным русским языком.
- source_word: οὕτως ταχέως
  choice: так быстро
  rationale: Сохраняет акцент на поразительной быстроте происходящего; выражение может указывать как на краткость прошедшего времени, так и на поспешность перемены.
- source_word: μετατίθεσθε
  choice: отходите
  rationale: Настоящее время передаёт продолжающийся процесс, а глагол сохраняет смысл отступления от личности, призвавшей адресатов, без чрезмерно резкого добавочного оттенка слова «предаёте».
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: Того, кто призвал вас
  rationale: Сохраняет совершившийся ранее призыв и не называет прямо его субъекта, поскольку в греческом тексте он оставлен подразумеваемым.
- source_word: ἐν χάριτι Χριστοῦ
  choice: в благодати Мессии
  rationale: Формально сохраняет ἐν с дательным падежом и не сводит его значение исключительно к средству; родительный Χριστοῦ передан без устранения возможной смысловой ёмкости.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт смысл титула Χριστός и соответствует его функции в данном контексте.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: к иной Благой вести
  rationale: Предлог «к» выражает направленность перехода, а «иной» передаёт качественное отличие, которое далее раскрывается в стихе 7.
theological_decisions:
- issue: Кто именно является «призвавшим вас»
  choice: 'Субъект не назван прямо: «Того, кто призвал вас»'
  alternative: «Бога, призвавшего вас» или «Мессию, призвавшего вас»
  rationale: Греческий текст оставляет субъект причастия подразумеваемым; основной текст не должен преждевременно разрешать эту богословскую неоднозначность.
- issue: Значение ἐν в выражении ἐν χάριτι Χριστοῦ
  choice: «в благодати Мессии»
  alternative: «благодатью Мессии»
  rationale: Предлог может обозначать сферу или средство; основной текст сохраняет более прозрачную форму, а инструментальное понимание дано в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. «Благая весть» понятнее широкой аудитории, чем заимствованное «Евангелие», и здесь обозначает провозглашаемую весть. Заглавная буква в «Того» употреблена как уважительная графическая форма, не уточняя в основном тексте, Бог или Мессия непосредственно имеется в виду.
