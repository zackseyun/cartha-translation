  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: ru
  text: Ведь если я снова строю то, что разрушил[a], то сам делаю себя нарушителем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снёс»; «разобрал».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сам показываю себя нарушителем»; «сам доказываю, что я нарушитель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предыдущим рассуждением, а «если» сохраняет условную силу εἰ.
- source_word: ἃ ... ταῦτα
  choice: то, что
  rationale: Эта коррелятивная конструкция естественна в современном русском и передаёт соотнесённость греческих ἃ и ταῦτα без тяжеловесности.
- source_word: κατέλυσα
  choice: разрушил
  rationale: В паре со «строю» этот глагол сохраняет строительный образ. Вариант «упразднил» был бы более контекстуально истолковывающим.
- source_word: πάλιν οἰκοδομῶ
  choice: снова строю
  rationale: Сочетание сохраняет значение πάλιν и настоящее время οἰκοδομῶ, не превращая условие в завершённое действие.
- source_word: παραβάτην
  choice: преступником
  rationale: Слово передаёт нравственно-правовой оттенок παραβάτης и не сужает его явно до конкретного закона.
- source_word: ἐμαυτὸν συνιστάνω
  choice: сам показываю себя
  rationale: Формулировка передаёт значение «показывать, обнаруживать, представлять» и подчёркивает самообличающий характер возвратной конструкции, не усиливая её до однозначного «доказываю».
theological_decisions:
- issue: Что именно Павел ранее «разрушил» и теперь мог бы «снова строить»
  choice: 'Оставить объект неопределённым: «то, что разрушил»'
  alternative: Уточнить как «закон», «систему закона» или прежний образ жизни
  rationale: Греческий текст не называет объект прямо; его конкретизация сняла бы сохраняющуюся в контексте смысловую напряжённость и внесла бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно формальным звучанием. Сохранён строительный образ оригинала («разрушил» — «строю»), условная структура и неопределённость объекта. Все маркеры сносок включены в основной текст.
