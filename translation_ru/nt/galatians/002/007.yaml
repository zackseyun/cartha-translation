  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: ru
  text: Напротив, увидев, что мне вверено Евангелие для необрезанных, как Петру — для обрезанных[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Евангелие необрезания… обрезания», то есть Евангелие, вверенное для возвещения этим группам людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Напротив
  rationale: Сочетание выражает резкое противопоставление предыдущей мысли; одно слово «напротив» естественно передаёт усиленную противительную конструкцию по-русски.
- source_word: ἰδόντες
  choice: увидев
  rationale: Аористное причастие обозначает обстоятельство, предшествующее подразумеваемому основному действию в контексте; деепричастие сохраняет форму и связь с предыдущим стихом.
- source_word: πεπίστευμαι
  choice: мне вверено
  rationale: Перфект пассива здесь означает, что Павлу доверено определённое служение; краткая пассивная конструкция сохраняет и совершившееся поручение, и его продолжающуюся силу.
- source_word: τὸ εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшийся и понятный русский эквивалент, сохраняющий богословский вес термина в посланиях Павла.
- source_word: τῆς ἀκροβυστίας
  choice: для необрезанных
  rationale: Родительный падеж указывает на круг людей, которым Павел должен возвещать Евангелие. Передача через «для» естественна по-русски и сохраняет употреблённое Павлом обозначение.
- source_word: καθὼς
  choice: как
  rationale: Вводит прямое сопоставление поручений Павла и Петра; русское «как» ясно и естественно передаёт параллель.
- source_word: Πέτρος
  choice: Петру
  rationale: Имя передано в принятой русской форме; дательный падеж обусловлен восстановлением подразумеваемой конструкции «Петру вверено».
- source_word: τῆς περιτομῆς
  choice: для обрезанных
  rationale: Симметрично передаёт вторую группу, не заменяя собственную лексику Павла более толковательным словом «иудеи».
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: тире с подразумеваемым «вверено Евангелие»
  rationale: Греческий текст опускает повторяемые слова; русское тире естественно отмечает эллипсис без ненужного утяжеления фразы.
theological_decisions:
- issue: Передавать ли ἀκροβυστία / περιτομή этническими названиями или использованными Павлом обозначениями по признаку обрезания.
  choice: «необрезанные» / «обрезанные»
  alternative: «язычники» / «иудеи»; «необрезание» / «обрезание»
  rationale: Выбранная передача сохраняет заветно-этнические обозначения исходного текста и не сводит их безоговорочно к более широким этническим категориям.
- issue: Как передать перфект πεπίστευμαι.
  choice: «мне вверено»
  alternative: «мне было вверено»
  rationale: 'Настоящая результативная конструкция лучше сохраняет напряжение греческого перфекта: поручение было дано и остаётся в силе.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского послания. Синтаксис сохраняет зависимость стиха от предыдущего контекста; конечная запятая отражает продолжающееся предложение. Заглавное написание «Евангелие» подчёркивает его употребление как названия благой вести, не добавляя нового смысла.
