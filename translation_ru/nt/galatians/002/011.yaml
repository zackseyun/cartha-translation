  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: ru
  text: Но когда Кифа пришёл в Антиохию[a], я выступил против него прямо ему в лицо, потому что он был осуждён.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кифа — арамейское имя Петра.
    reason: cross_reference
  - marker: b
    text: 'Или: «потому что он был явно неправ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Но когда
  rationale: Передаёт временной переход и лёгкое противопоставление, выраженное δέ, естественным современным русским языком.
- source_word: Κηφᾶς
  choice: Кифа
  rationale: Сохраняет форму имени, стоящую в греческом тексте, не заменяя её более привычным именем Пётр; отождествление пояснено в сноске.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Прямой и естественный эквивалент глагола движения в данном контексте.
- source_word: εἰς Ἀντιόχειαν
  choice: в Антиохию
  rationale: Нормальное русское обозначение движения к городу.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: открыто
  rationale: В сочетании с «выступил против него» передаёт прямой, личный и не скрываемый характер противостояния, избегая неестественного буквального «в лицо ему».
- source_word: ἀντέστην
  choice: я выступил против него
  rationale: Точно и естественно выражает открытое противодействие Павла; «воспротивился» звучало бы более архаично.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание поступка Павла.
- source_word: κατεγνωσμένος ἦν
  choice: он заслуживал осуждения
  rationale: Передаёт состояние, обозначенное перифрастической пассивной конструкцией, не утверждая прямо, кем именно он уже был осуждён; альтернативный смысл отмечен в сноске.
theological_decisions:
- issue: Форма и отождествление имени Κηφᾶς
  choice: Сохранить в основном тексте имя «Кифа»
  alternative: Заменить его именем «Пётр» для большей узнаваемости
  rationale: Греческий текст содержит форму Κηφᾶς; её сохранение прозрачнее отражает источник, а отождествление с Петром можно сообщить в сноске.
- issue: Смысл κατεγνωσμένος ἦν
  choice: «он заслуживал осуждения»
  alternative: «он явно был неправ» или «он был осуждён»
  rationale: Выбранный вариант сохраняет судебно-оценочную силу выражения и результирующее состояние, не разрешая без необходимости вопрос о том, кем вынесено осуждение. Более контекстуальное понимание как явной неправоты дано в сноске.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. Формулировка сохраняет достоинство и прямоту повествования без архаизмов; «открыто выступил против него» естественно передаёт идиому личного противостояния.
