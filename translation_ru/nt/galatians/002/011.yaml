  naturalness: «Я выступил против него прямо ему в лицо» — естественная современная литературная формулировка, сохраняющая личную прямоту оригинала. Остальной синтаксис ясен и соответствует повествовательному регистру.
  terminology: «Кифа» верно воспроизводит Κηφᾶς; пояснение в сноске уместно. «Антиохия» и «осуждён» нормативны. Альтернативная сноска передаёт контекстуально возможное понимание, не подменяя основное чтение.
