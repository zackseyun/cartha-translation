source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: ru
  text: Ведь Тот, кто действовал через Петра для апостольского служения обрезанным[a], действовал и через меня — для язычников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для апостольства обрезания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: действовал / действовал
  rationale: Одинаковый перевод родственных форм сохраняет намеренный повтор и параллель между служением Петра и Павла, не уточняя без необходимости способ божественного действия.
- source_word: Πέτρῳ / ἐμοὶ
  choice: через Петра / через меня
  rationale: 'Дательный падеж в данном контексте понят инструментально: подразумеваемый деятель осуществлял Своё действие через Петра и Павла в их служении.'
- source_word: εἰς ἀποστολὴν
  choice: для апостольского служения
  rationale: Так передаются направленность εἰς и смысл ἀποστολή естественным современным русским языком, без сведения выражения лишь к должности или званию.
- source_word: τῆς περιτομῆς
  choice: обрезанным
  rationale: «Обрезание» употреблено метонимически по отношению к обрезанному еврейскому народу; перевод сохраняет противопоставление язычникам.
- source_word: τὰ ἔθνη
  choice: язычников
  rationale: В контексте противопоставления обрезанным речь идёт о нееврейских народах. «Язычники» ясно и традиционно передаёт этот смысл; буквальное «народы» отмечено в сноске.
theological_decisions:
- issue: Следует ли прямо назвать Бога субъектом действия
  choice: Тот, кто действовал
  alternative: Бог, действовавший
  rationale: Греческий текст содержит субстантивированное причастие ὁ ἐνεργήσας — «Тот, кто действовал», а не явно названное существительное θεός. Выбранный вариант сохраняет форму источника и не устраняет контекстуально подразумеваемый, но не названный прямо субъект.
- issue: Как понимать дательный падеж при глаголе ἐνεργέω
  choice: действовал через Петра / через меня
  alternative: действовал в Петре / во мне; содействовал Петру / мне
  rationale: Контекст сопоставляет действенность апостольского служения Петра и Павла, поэтому инструментальное понимание наиболее естественно. При этом перевод не добавляет более конкретного богословского объяснения механизма действия.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавное «Тот» указывает на подразумеваемого божественного деятеля, не вставляя в текст слово «Бог». Повтор «действовал» сохраняет структуру греческого предложения; тире облегчает чтение заключительной параллельной части.
