id: GAL.2.3
reference: Galatians 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Τίτος ὁ σὺν ἐμοί, Ἕλλην ὤν, ἠναγκάσθη περιτμηθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: ru
  text: Но даже Тита, который был со мной, хотя он и был греком[a], не принудили обрезаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «грек» здесь подразумевает, что Тит был необрезанным неиудеем, однако в тексте прямо сказано именно «грек», а не просто «язычник».
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление предыдущему контексту кратким и естественным русским союзом.
- source_word: οὐδὲ
  choice: даже … не
  rationale: Разнесённая русская конструкция естественно сохраняет усиленное отрицание, сосредоточенное на Тите.
- source_word: Τίτος
  choice: Тита
  rationale: Использована традиционная русская форма имени; винительный падеж обусловлен естественной русской безлично-личной конструкцией «не принудили», передающей греческий пассив.
- source_word: ὁ σὺν ἐμοί
  choice: который был со мной
  rationale: Ясно и без лишнего толкования передаёт определительное сочетание с артиклем.
- source_word: Ἕλλην ὤν
  choice: хотя он и был греком
  rationale: Контекстуальное уступительное значение причастного оборота передано естественной русской конструкцией; частица «и» подчёркивает уступку.
- source_word: Ἕλλην
  choice: греком
  rationale: Сохранено конкретное обозначение «грек», а не более широкое толковательное «язычник».
- source_word: ἠναγκάσθη
  choice: не принудили
  rationale: Передаёт внешнее давление и принуждение; русская неопределённо-личная конструкция звучит естественнее тяжёлого пассива «не был принуждён».
- source_word: περιτμηθῆναι
  choice: обрезаться
  rationale: Прямо и понятно передаёт совершение над Титом обряда обрезания.
theological_decisions:
- issue: Передача Ἕλλην как конкретного этнокультурного обозначения или как религиозной категории
  choice: грек
  alternative: язычник
  rationale: Исходный текст прямо называет Тита греком. В данном контексте это подразумевает его необрезанный неиудейский статус, но перевод не должен заменять исходное обозначение более широким толкованием.
- issue: Смысловая связь оборота Ἕλλην ὤν с главным утверждением
  choice: хотя он и был греком
  alternative: будучи греком
  rationale: 'В контексте оборот наиболее естественно имеет уступительный смысл: несмотря на то что Тит был греком, его не заставили обрезаться. При этом перевод не уточняет, кто именно мог оказывать давление.'
translation_notes:
  register: Современный литературный русский язык с естественным порядком слов. Безлично-личная форма «не принудили» сохраняет отсутствие названного деятеля и избегает стилистически тяжёлого русского пассива. Формулировка остаётся достойной и доступной широкому читателю.
