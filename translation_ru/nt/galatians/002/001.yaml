  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: ru
  text: Затем, спустя четырнадцать лет, я снова поднялся в Иерусалим вместе с Варнавой, взяв с собой и Тита.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Затем
  rationale: Передаёт последовательное продолжение рассказа Павла естественным и кратким русским связующим словом.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: спустя четырнадцать лет
  rationale: Временная конструкция διά с родительным падежом обозначает истекший промежуток до следующего события; «спустя» естественно передаёт этот смысл.
- source_word: πάλιν
  choice: снова
  rationale: Сохраняет указание на повторное путешествие.
- source_word: ἀνέβην
  choice: поднялся
  rationale: Сохраняет обычное для поездки в Иерусалим обозначение движения вверх, связанное с географией и устойчивым библейским словоупотреблением.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Естественно передаёт направление движения к месту назначения.
- source_word: μετὰ Βαρναβᾶ
  choice: вместе с Варнавой
  rationale: Прямо и ясно выражает сопровождение.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: взяв с собой и Тита
  rationale: 'Деепричастный оборот передаёт сопутствующее основному действию участие Тита, а «и» сохраняет добавочное значение καί: помимо Варнавы Павел взял Тита.'
