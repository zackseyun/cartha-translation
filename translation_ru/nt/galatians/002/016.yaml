id: GAL.2.16
reference: Galatians 2:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: ru
  text: Но, зная, что человек оправдывается не делами закона, а только через веру в Иисуса Мессию[a], и мы поверили в Мессию Иисуса, чтобы быть оправданными верой в Мессию[b], а не делами закона, потому что делами закона не оправдается никакая плоть[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через верность Иисуса Мессии».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «верностью Мессии».'
    reason: alternative_reading
  - marker: c
    text: То есть ни один человек.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: оправдывается / быть оправданными / не оправдается
  rationale: Последовательно сохранён судебно-богословский термин Павла; «оправдывать» передаёт признание праведным, не сводя смысл к нравственному исправлению.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Естественное русское обозначение любого представителя человечества сохраняет обобщающее значение греческого единственного числа.
- source_word: ἐξ ἔργων νόμου
  choice: делами закона
  rationale: Сохранена узнаваемая формула Павла без расширения до более общего понятия «добрые дела».
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: через веру в Иисуса Мессию
  rationale: В основном тексте генитив истолкован объективно, однако действительно возможное значение верности самого Иисуса Мессии вынесено в сноску.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: мы поверили в Мессию Иисуса
  rationale: Русское «поверить в» естественно передаёт πιστεύω εἰς; порядок титула и имени отражает Χριστὸν Ἰησοῦν.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: верой в Мессию
  rationale: Сохранено то же основное понимание спорной генитивной конструкции, что и в первой части стиха.
- source_word: Χριστός
  choice: Мессия
  rationale: Греческий титул переведён, а не передан традиционной транслитерацией, поскольку его титульный смысл здесь сохраняется.
- source_word: πᾶσα σάρξ
  choice: никакая плоть
  rationale: Сохранён библейский оборот и его ветхозаветное звучание; отрицательное «никакая» делает его смысл однозначным и естественным по-русски.
- source_word: εἰδότες δὲ
  choice: Но, зная
  rationale: Сохранены мягкое противопоставление δέ и причастная связь стиха с предшествующим высказыванием.
- source_word: ἐὰν μὴ
  choice: а только через
  rationale: 'В данном противопоставлении естественно выражает исключительную альтернативу: не делами закона, а через веру.'
theological_decisions:
- issue: Значение πίστεως Ἰησοῦ Χριστοῦ / πίστεως Χριστοῦ
  choice: 'объективный генитив: «вера в Иисуса Мессию» / «вера в Мессию»'
  alternative: 'субъективный генитив: «верность Иисуса Мессии» / «верность Мессии»'
  rationale: Обе трактовки грамматически возможны и широко обсуждаются. Основной текст следует обычному пониманию веры, направленной на Мессию, а сноски сохраняют альтернативу, не снимая богословского напряжения.
- issue: Смысл глагола δικαιόω
  choice: «оправдывать» в судебном смысле
  alternative: «признавать праведным»
  rationale: Традиционный русский термин краток, достоин по регистру и сохраняет характерную для Павла судебную силу выражения.
- issue: Референт πᾶσα σάρξ
  choice: библейская формула «никакая плоть»
  alternative: «ни один человек»
  rationale: Буквальная образность удерживает вероятный отзвук Писания, а сноска разъясняет, что речь идёт обо всех людях.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского оборота «никакая плоть». Синтаксис удерживает связь с предыдущим стихом; терминология последовательна и не привязана к конфессионально узкому толкованию.
