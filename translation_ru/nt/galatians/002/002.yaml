revisions:
- from: Я же отправился туда по откровению[a] и изложил им Евангелие, которое проповедую среди язычников, — но отдельно тем, кого считали влиятельными[b], — чтобы не оказалось, что я бегу или бежал напрасно[c].
  to: Я же отправился по откровению[a] и представил им Евангелие, которое проповедую среди язычников, а частным образом — тем, кого считали влиятельными[b], — как бы я не бежал или не бежал напрасно[c].
  rationale: Убрано невыраженное в стихе «туда». «Представил» хорошо передаёт ἀνεθέμην как изложение на рассмотрение, не подразумевая формального подчинения. Перестроена вставная конструкция для естественного русского синтаксиса и уточнена передача μή πως при сохранении образа бега и временного различия глаголов. Сноски сохранены на тех же якорях и согласованы с основным текстом.
