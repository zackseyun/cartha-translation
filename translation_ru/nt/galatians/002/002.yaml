source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: ru
  text: Я же отправился по откровению[a] и представил им Евангелие, которое проповедую среди язычников, а частным образом — тем, кого считали влиятельными[b], — как бы я не бежал или не бежал напрасно[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вследствие откровения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тем, кто казался влиятельным».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «опасаясь, как бы мои нынешние или прежние труды не оказались напрасными».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: отправился туда
  rationale: Глагол буквально означает «поднялся, пошёл вверх», но в данном контексте описывает отправление в упомянутое ранее место. «Отправился туда» естественно звучит по-русски и не добавляет прямо не названный в этом стихе Иерусалим.
- source_word: κατὰ ἀποκάλυψιν
  choice: по откровению
  rationale: Краткое русское выражение передаёт основание или побуждение к путешествию и сохраняет возможные оттенки «согласно откровению» и «вследствие откровения».
- source_word: ἀνεθέμην
  choice: изложил им
  rationale: Глагол означает представить нечто другим для рассмотрения. «Изложил им» не навязывает ни идеи формального подчинения, ни смысла простого уведомления.
- source_word: τὸ εὐαγγέλιον
  choice: Евангелие
  rationale: Устоявшийся и понятный русский эквивалент термина εὐαγγέλιον в посланиях Павла.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди язычников
  rationale: В данном контексте ἔθνη обозначает неевреев, а не политические народы или государства.
- source_word: κατ’ ἰδίαν
  choice: отдельно
  rationale: Передаёт частный характер беседы и её отличие от обращения ко всем присутствовавшим.
- source_word: τοῖς δοκοῦσιν
  choice: тем, кого считали влиятельными
  rationale: Формулировка сохраняет оттенок признанного положения этих людей, не решая за читателя, подтверждает ли Павел этот статус или слегка дистанцируется от него.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: чтобы не оказалось, что я бегу или бежал напрасно
  rationale: Сохранены метафора бега, опасение напрасности труда и различие между настоящим и прошедшим временем двух глаголов.
theological_decisions:
- issue: Подразумевает ли изложение Евангелия подчинение Павла решению апостолов
  choice: '«Изложил им» оставляет характер встречи открытым: Павел представил свою проповедь для рассмотрения, но текст не говорит прямо, что он просил официального утверждения.'
  alternative: «Представил им на одобрение» либо «лишь сообщил им».
  rationale: Греческий глагол допускает рассмотрение сказанного другими, однако сам по себе не устанавливает ни формального подчинения, ни полного отсутствия оценочного элемента.
- issue: Отношение Павла к статусу руководителей
  choice: «Тех, кого считали влиятельными» сохраняет дистанцию, возможную в τοῖς δοκοῦσιν, не превращая её в явную иронию.
  alternative: «Признанным руководителям» либо «тем, кто казался влиятельным».
  rationale: Греческая формулировка может обозначать людей с признанной репутацией, но в контексте также допускает риторическую сдержанность Павла.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет вставное противопоставление «но отдельно…» и метафору бега, несмотря на её некоторую необычность в русском, поскольку она значима для образной речи Павла.
