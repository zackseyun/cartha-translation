  text: μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: ru
  text: Только чтобы мы помнили о бедных — именно это я и старался делать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: только
  rationale: Передаёт единственное условие или просьбу, добавленную к достигнутому соглашению.
- source_word: τῶν πτωχῶν
  choice: о бедных
  rationale: Субстантивированное прилагательное обозначает бедных людей; конструкция «помнить о» естественно передаёт греческий родительный падеж при μνημονεύω.
- source_word: ἵνα μνημονεύωμεν
  choice: чтобы мы помнили
  rationale: Сохраняет значение ἵνα как указания на содержание просьбы и форму первого лица множественного числа, не сводя память только к материальной помощи.
- source_word: ὃ
  choice: именно это
  rationale: Относительное местоимение отсылает ко всей предшествующей просьбе; по-русски связь естественно выражается указательным местоимением.
- source_word: ἐσπούδασα
  choice: я и старался
  rationale: Передаёт усердное стремление и практические усилия; «старался» звучит естественно и не утверждает завершённость действия.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: именно это я и старался делать
  rationale: Сочетание αὐτὸ τοῦτο подчёркивает тождество действия с просьбой; «именно это ... и» сохраняет усиление.
theological_decisions:
- issue: Практический смысл «помнить о бедных»
  choice: Сохранена буквальная формулировка «помнили о бедных»
  alternative: «помогали бедным» или «заботились о бедных»
  rationale: Контекст предполагает деятельную заботу, но греческий текст использует μνημονεύω. Перевод не должен заменять подразумеваемое действие более узким толкованием.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная конструкция сохраняет сопоставление общей просьбы («мы») с личным усердием Павла («я»). Тире ясно отделяет просьбу от последующего авторского замечания.
