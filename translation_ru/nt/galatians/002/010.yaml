  source_fidelity: Текст точно передаёт единственное условие (μόνον), содержание просьбы в форме «мы» (ἵνα μνημονεύωμεν τῶν πτωχῶν) и личное усердие Павла в отношении именно этого дела (ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι). «Помнили о бедных» сохраняет исходную формулировку, не подменяя её более узким толкованием о материальной помощи.
  naturalness: Фраза естественна для современного литературного русского в своём контексте, продолжая предыдущее предложение. Тире хорошо отделяет условие от поясняющего личного замечания. Оборот «именно это я и старался делать» идиоматичен и сохраняет акцент αὐτὸ τοῦτο.
  terminology: «Бедные» — обычная и точная передача τῶν πτωχῶν. Выбор «помнили о» корректно соответствует μνημονεύω и сохраняет практический, но не чрезмерно конкретизированный смысл. Богословски нагруженных терминов, требующих иной унификации, нет.
