id: GAL.2.19
reference: Galatians 2:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω· Χριστῷ συνεσταύρωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: ru
  text: Ведь через закон я умер для закона, чтобы жить для Бога. Я распят вместе с Мессией.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущей мыслью естественно для современного русского языка.
- source_word: διὰ νόμου
  choice: через закон
  rationale: Сохраняет инструментальное значение διά с родительным падежом и намеренно не уточняет, каким именно образом закон привёл к этому результату.
- source_word: νόμῳ
  choice: для закона
  rationale: Русская конструкция «умереть для чего-либо» естественно передаёт прекращение прежнего отношения к сфере власти закона, не разворачивая краткую греческую формулу в толкование.
- source_word: ἀπέθανον
  choice: я умер
  rationale: Совершенный вид передаёт решительное событие, выраженное греческим аористом.
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно и естественно выражает цель.
- source_word: θεῷ ζήσω
  choice: жить для Бога
  rationale: В современном русском это наиболее естественная передача дательного θεῷ при ζάω; она сохраняет направленность жизни к Богу и не сводит выражение к одной лишь полезности.
- source_word: Χριστῷ
  choice: с Мессией
  rationale: Передаёт Χριστός как титул «Мессия»; предлог «с» обусловлен русской конструкцией «распят вместе с».
- source_word: συνεσταύρωμαι
  choice: я распят вместе
  rationale: Краткая результативная конструкция «я распят» передаёт совершившееся распятие с сохраняющимся результатом, выраженным перфектом; «вместе» явно передаёт значение приставки συν-.
theological_decisions:
- issue: Следует ли пояснять парадокс «через закон я умер для закона»
  choice: Сохранить краткую формулировку без поясняющего добавления.
  alternative: «Через осуждение закона я умер для закона» или «через закон я стал мёртв для соблюдения закона».
  rationale: Греческий текст намеренно краток и допускает богословски насыщенное толкование; добавление причины или конкретного вида отношения к закону сузило бы смысл.
- issue: Как передать перфект συνεσταύρωμαι
  choice: «Я распят вместе с Мессией».
  alternative: «Я был распят вместе с Мессией».
  rationale: Форма без связки в настоящем времени лучше сохраняет сочетание прошлого события и его продолжающегося результата, не превращая высказывание только в сообщение о прошлом.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и доступная. Синтаксическая плотность оригинала сохранена, а традиционное, но менее прозрачное «сораспялся» не использовано.
