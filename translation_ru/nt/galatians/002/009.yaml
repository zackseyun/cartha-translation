  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: ru
  text: И, узнав о благодати, данной мне, Иаков, Кифа и Иоанн, считавшиеся столпами, подали мне и Варнаве правые руки в знак единения[a], чтобы нам идти к язычникам[b], а им — к обрезанным[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дали мне и Варнаве правые руки единения». Это был жест взаимного признания и согласия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к народам»; здесь имеются в виду неевреи.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к обрезанию», то есть к иудеям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: узнав
  rationale: Аористное причастие указывает на предшествующее распознание и признание данной Павлу благодати; «узнав» естественно передаёт это по-русски.
- source_word: χάριν
  choice: благодати
  rationale: Сохраняет широкий богословский смысл Божьей милости и действия в апостольском призвании Павла, не сужая его до поручения.
- source_word: δοθεῖσάν μοι
  choice: данной мне
  rationale: Кратко и точно передаёт пассивное причастие и предшествование дара последующему соглашению.
- source_word: Κηφᾶς
  choice: Кифа
  rationale: Передаёт употреблённое в греческом тексте имя, не заменяя его более привычным именем Пётр.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: почитаемые столпами
  rationale: Передаёт их признанный авторитет, сохраняя оттенок общественной репутации и не придавая словам Павла пренебрежительного смысла.
- source_word: δεξιὰς ... κοινωνίας
  choice: подали ... правые руки в знак единения
  rationale: Сохраняет множественное число δεξιάς и ясно передаёт жест взаимного признания, согласия и участия в общем служении.
- source_word: ἔθνη
  choice: язычникам
  rationale: В контексте Галатам обозначает неевреев, а не политические нации.
- source_word: περιτομήν
  choice: обрезанным
  rationale: Передаёт метонимическое обозначение иудеев и сохраняет прямой контраст с язычниками.
theological_decisions:
- issue: Значение κοινωνίας в выражении δεξιὰς κοινωνίας
  choice: в знак единения
  alternative: в знак сотрудничества / общения
  rationale: Формула обозначает взаимное признание и согласие в общем апостольском деле. «Единение» сохраняет как общность, так и миссионерское сотрудничество, не сводя смысл только к дружескому общению или организационному партнёрству.
- issue: Направление служения, выраженное эллиптической конструкцией ἵνα ἡμεῖς εἰς... αὐτοὶ δὲ εἰς...
  choice: чтобы нам идти к язычникам, а им — к обрезанным
  alternative: чтобы мы были для язычников, а они — для обрезанных
  rationale: Глагол движения подразумевается контекстом распределения миссионерского труда, но перевод не добавляет идеи исключительной юрисдикции или богословского разделения двух миссий.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис сохраняет последовательность греческой фразы, но остаётся естественным; «Кифа» следует форме исходного текста, а «столпы» сохраняет образ оригинала.
