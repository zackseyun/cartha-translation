id: GAL.2.17
reference: Galatians 2:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: ru
  text: Но если, стремясь быть оправданными во Христе[a], мы и сами оказались грешниками, то неужели Христос — служитель греха? Ни в коем случае!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Христос — греческое титульное обозначение Мессии.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: стремясь
  rationale: Причастие передаёт действие, одновременное с основным, а «стремясь» естественно выражает целенаправленный поиск.
- source_word: δικαιωθῆναι
  choice: быть оправданными
  rationale: Сохранён страдательный залог и установленный богословский термин, не уточняя в основном тексте, идёт ли речь о признании праведными или об ином оттенке оправдания.
- source_word: ἐν Χριστῷ
  choice: во Христе
  rationale: «Христос» — естественное для современного русского языка титульное обозначение Мессии; предлог «во» сохраняет ёмкую и допускающую разные смысловые оттенки конструкцию ἐν Χριστῷ.
- source_word: εὑρέθημεν
  choice: оказались
  rationale: По-русски естественно передаёт результат обнаружения, выраженный греческим страдательным глаголом, без уточнения того, кем или каким образом это было установлено.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: мы и сами оказались грешниками
  rationale: «И сами» сохраняет усиление αὐτοὶ и сопоставительный оттенок καί; «грешниками» прямо передаёт именную часть сказуемого.
- source_word: ἁμαρτίας διάκονος
  choice: служитель греха
  rationale: «Служитель» сохраняет значение того, кто содействует или служит чему-либо, не вводя представления о формальной церковной должности.
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Сильное и естественное современное русское отрицание передаёт резкое неприятие Павлом сформулированного вывода.
theological_decisions:
- issue: Следует ли передать вопрос так, будто Христос действительно производит грех.
  choice: то неужели Христос — служитель греха?
  alternative: то, значит, Христос способствует греху?
  rationale: Греческий текст формулирует отвергаемый риторический вывод. «Служитель греха» сохраняет напряжение и образ исходного текста, не превращая вопрос в утверждение и не объясняя заранее природу предполагаемой связи.
- issue: Смысл выражения ἐν Χριστῷ.
  choice: во Христе
  alternative: через Христа
  rationale: Буквальная предложная конструкция сохраняет возможные оттенки сферы, связи и основания; вариант «через Христа» сузил бы смысл до средства.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской аргументации. Синтаксис сохраняет условную структуру и резкий риторический вопрос, оставаясь понятным при чтении вслух.
