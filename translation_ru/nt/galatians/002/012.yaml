    rationale: Контекст позволяет отнести его к язычникам, но греческий текст говорит, что Пётр отступал и отделял самого себя, не называя объект после ὑπέστελλεν. Более нейтральная русская формулировка лучше сохраняет синтаксическую недосказанность.
