  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: ru
  text: Ведь до того, как пришли некоторые люди от Иакова[a], он обычно ел вместе с язычниками; но когда они пришли, он стал отстраняться и держаться отдельно, боясь тех, кто был из обрезанных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «от Иакова» может также означать «из окружения Иакова»; греческий текст сам по себе не уточняет, послал ли их Иаков официально.
    reason: alternative_reading
  - marker: b
    text: 'Или: «тех, кто принадлежал к кругу обрезанных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν
  choice: Ведь до того, как пришли
  rationale: Естественно передаёт временную конструкцию с πρό и артиклевым инфинитивом, сохраняя связующую силу γάρ.
- source_word: τινας
  choice: некоторые люди
  rationale: Передаёт неопределённость местоимения и его контекстуально личное, мужское значение без излишней конкретизации.
- source_word: ἀπὸ Ἰακώβου
  choice: от Иакова[a]
  rationale: Буквально и кратко передаёт ἀπό с личным именем, не утверждая само по себе, что Иаков официально послал или уполномочил этих людей.
- source_word: μετὰ τῶν ἐθνῶν
  choice: вместе с язычниками
  rationale: В контексте Павла τὰ ἔθνη обозначает неевреев; слово «верующими» в оригинале отсутствует.
- source_word: συνήσθιεν
  choice: обычно ел
  rationale: Передаёт длительное или привычное действие, выраженное имперфектом.
- source_word: ὑπέστελλεν
  choice: стал сторониться их
  rationale: Передаёт начавшееся отступление и уклонение; местоимение «их» естественно указывает на язычников в русском контексте.
- source_word: ἀφώριζεν ἑαυτόν
  choice: держаться отдельно
  rationale: Сохраняет возвратный смысл и социальное отделение, не придавая глаголу специального религиозного оттенка.
- source_word: φοβούμενος
  choice: боясь
  rationale: Сохраняет компактную причастную конструкцию и её причинный оттенок.
- source_word: τοὺς ἐκ περιτομῆς
  choice: тех, кто из обрезанных[b]
  rationale: Близко передаёт греческое обозначение группы через обрезание, не добавляя более сильного понятия организованной «партии».
theological_decisions:
- issue: Следует ли понимать ἀπὸ Ἰακώβου как указание на официальное поручение Иакова
  choice: от Иакова
  alternative: посланные Иаковом; из окружения Иакова
  rationale: Греческое выражение указывает на источник или связь, но само по себе не устанавливает, что Иаков официально послал этих людей или одобрял их позицию.
- issue: Следует ли передавать τοὺς ἐκ περιτομῆς как название определённой партии
  choice: тех, кто из обрезанных
  alternative: сторонников обрезания; партию обрезанных
  rationale: Оригинал характеризует группу через обрезание, но явно не называет её организованной партией; буквальная формулировка сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. Синтаксис остаётся близким к греческому ходу мысли, но избегает тяжеловесности. Формулировки сохраняют неоднозначность отношений пришедших людей с Иаковом и не превращают «обрезанных» в явно названную партию.
