    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: вместе с ним стали лицемерить
  rationale: Передаёт совместное участие в лицемерном поведении, выраженное приставкой συν-, а не только внутреннюю неискренность.
- source_word: αὐτῷ
  choice: с ним
  rationale: Дательный падеж обозначает участие вместе с Петром; русский оборот естественно передаёт эту связь.
- source_word: λοιποὶ
  choice: остальные
  rationale: Указывает на оставшихся представителей уже упомянутой группы и подчёркивает их присоединение к Петру; возможное значение «другие» сохранено в примечании.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: В контексте речь идёт об этнорелигиозной группе, а не только о жителях Иудеи; «иудеи» — традиционное и точное русское обозначение в новозаветном контексте.
- source_word: συναπήχθη
  choice: был увлечён
  rationale: Сохраняет страдательную форму и образ человека, которого поведение других повлекло за собой под социальным и нравственным давлением.
- source_word: ὑποκρίσει
  choice: лицемерием
  rationale: Прямо называет притворное, непоследовательное поведение. Повтор слова сохраняет риторический акцент Павла.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским регистром. Конструкция «стали лицемерить» естественно передаёт совместное действие, а повтор «лицемерить / лицемерием» сохраняет подчёркнутую Павлом связь между поступком группы и влиянием на Варнаву.
