  terminology: «Истина Евангелия» — точное и устоявшееся соответствие ἡ ἀλήθεια τοῦ εὐαγγελίου. «Ни на миг» удачно передаёт идиому οὐδὲ πρὸς ὥραν. «Для вас» допустимо для πρὸς ὑμᾶς; вариант «у вас» уместно сохранить в сноске.
