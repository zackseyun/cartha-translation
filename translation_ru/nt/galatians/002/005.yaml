  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: ru
  text: Мы ни на миг не уступили им и не подчинились, чтобы истина Евангелия сохранилась для вас.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даже на час»; это выражение означает «даже на краткое время».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сохранилась у вас».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: им
  rationale: Дательный падеж относительного местоимения отсылает к людям, упомянутым в предыдущем стихе; в русском контексте естественно краткое «им».
- source_word: οὐδὲ πρὸς ὥραν
  choice: ни на миг
  rationale: Буквально выражение означает «даже на час», но идиоматически передаёт полное отсутствие даже кратковременной уступки.
- source_word: εἴξαμεν
  choice: не уступили
  rationale: Глагол означает «уступить, поддаться, дать дорогу»; перевод сохраняет деятельный отказ Павла, не сливая его со следующим словом о подчинении.
- source_word: τῇ ὑποταγῇ
  choice: подчинившись
  rationale: Дательный обозначает образ или сферу уступки. Деепричастная конструкция естественна по-русски и передаёт смысл уступки посредством подчинения, не уточняя её как только личную или институциональную.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит цель отказа уступить.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: истина Евангелия
  rationale: Сохраняется важное для Павла сочетание; «Евангелие» является понятным и укоренившимся русским соответствием εὐαγγέλιον.
- source_word: διαμείνῃ
  choice: сохранилась
  rationale: Глагол обозначает продолжение пребывания или сохранение; здесь «сохранилась» естественно передаёт намерение не допустить утраты или искажения истины.
- source_word: πρὸς ὑμᾶς
  choice: для вас
  rationale: Предлог с винительным может здесь выражать направленность или отношение к галатам, включая оттенок пользы; «у вас» также возможно и отмечено в сноске.
theological_decisions:
- issue: Характер отказа Павла уступить противникам
  choice: Павел говорит о полном отказе уступить им посредством подчинения, чтобы сохранить истину Евангелия.
  alternative: Понимать слова исключительно как отказ от личного подчинения или исключительно как отказ от институциональной уступки.
  rationale: Греческий текст не ограничивает заявление одной из этих сфер, поэтому перевод сохраняет его широту и напряжение.
- issue: Значение πρὸς ὑμᾶς
  choice: «для вас» — сохранение истины Евангелия ради адресатов.
  alternative: «у вас» — продолжение её присутствия среди адресатов.
  rationale: Оба оттенка допускаются конструкцией; основной текст передаёт направленность и пользу, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Ни на миг» естественно передаёт идиому; синтаксис остаётся компактным и сохраняет связь отказа Павла с целью — сохранением истины Евангелия.
