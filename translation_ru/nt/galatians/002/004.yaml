source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: ru
  text: Но из-за тайно введённых лжебратьев[a], которые проникли, чтобы тайно разузнать о нашей свободе, которую мы имеем в Иисусе Мессии[b], — чтобы поработить нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Лжебратья» сохраняет семейный образ оригинала и обозначает людей, представлявшихся братьями по вере.
    reason: cultural_note
  - marker: b
    text: 'Или: «во Христе Иисусе».'
    reason: alternative_translation
lexical_decisions:
- source_word: παρεισάκτους
  choice: тайно введённых
  rationale: Передаёт значение скрытого введения извне и отличает определение от следующего глагола παρεισῆλθον.
- source_word: ψευδαδέλφους
  choice: лжебратьев
  rationale: Сохраняет родственный образ, мужскую форму и резкую полемическую окраску выражения Павла.
- source_word: παρεισῆλθον
  choice: пробрались к нам
  rationale: Естественно выражает тайное, неправомерное проникновение и не дублирует дословно предыдущее определение.
- source_word: κατασκοπῆσαι
  choice: разведать, какой свободой мы обладаем
  rationale: Передаёт враждебное тайное наблюдение; развёрнутая конструкция звучит по-русски естественнее, чем буквальное «шпионить за свободой».
- source_word: ἐλευθερίαν
  choice: свободой
  rationale: Обычный современный эквивалент, сохраняющий богословскую и общественную силу понятия.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  rationale: Χριστός передан как титул «Мессия», а порядок перестроен ради естественного русского сочетания имени и титула.
- source_word: καταδουλώσουσιν
  choice: поработить
  rationale: Глагол ясно обозначает обращение в рабство; «поработить» сохраняет эту силу и подходит современному литературному регистру.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: и поработить нас
  rationale: Второй инфинитив зависит от «чтобы» и выражает цель проникновения без тяжёлого повтора союза.
theological_decisions:
- issue: Передача Χριστῷ как титула или закрепившегося имени
  choice: Иисусе Мессии
  alternative: Христе Иисусе
  rationale: Контекст позволяет слышать в Χριστός титул; вариант с «Мессией» сохраняет это значение, а традиционный вариант отмечен в сноске.
- issue: Кого Павел называет ψευδαδέλφοι
  choice: лжебратья
  alternative: ложные верующие
  rationale: Перевод не решает сверх текста вопрос об их внутренней вере, а сохраняет утверждение Павла о людях, выдававших себя за членов общины.
translation_notes:
  register: Современный литературный русский язык с сохранением незавершённой синтаксической связи стиха с контекстом; конечное тире отражает продолжающуюся мысль греческого текста.
