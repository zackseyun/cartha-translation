revisions:
- from: Но из-за тайно введённых лжебратьев[a], которые пробрались к нам, чтобы разведать, какой свободой мы обладаем в Иисусе Мессии[b], и поработить нас, —
  to: Но из-за тайно введённых лжебратьев[a], которые проникли, чтобы тайно разузнать о нашей свободе, которую мы имеем в Иисусе Мессии[b], — чтобы поработить нас.
  rationale: Исправление удаляет добавленное «к нам», передаёт κατασκοπῆσαι как тайное разузнавание о свободе без навязывания вопроса о её характере и ясно воспроизводит отдельную целевую конструкцию ἵνα («чтобы поработить нас»). Сноска о «лжебратьях» переформулирована для точности и ясности. Смысл, незавершённость фразы и титульное значение «Мессия» сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:00:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы скрытное внедрение, враждебная цель и сильное значение καταδουλόω («поработить»). Однако добавленное «к нам» отсутствует в греческом тексте, а «разведать, какой свободой мы обладаем» несколько сужает κατασκοπῆσαι τὴν ἐλευθερίαν: речь о тайном выслеживании/разузнавании относительно самой свободы, не обязательно о выяснении того, «какой» она является.'
  naturalness: «Тайно введённых лжебратьев» и «поработить нас» естественны в современном литературном, несколько возвышенном посланническом регистре. В исправлении устранено не имеющее опоры в источнике «к нам», а целевая конструкция сделана яснее. Конечное тире уместно, поскольку греческая фраза продолжается в следующем стихе.
  terminology: «Лжебратья» удачно сохраняет полемический семейный образ ψευδάδελφοι, не делая дополнительного вывода об их внутреннем состоянии. «Иисус Мессия» передаёт титульную силу Χριστός; вариант «Христос Иисус» корректно дан в сноске. Английская аудиторская запись, по-видимому, имеет переставленные привязки сносок, но в русском тексте привязки a и b соответствуют своим примечаниям.
  issues:
  - severity: medium
    issue: В перевод добавлено «к нам».
    rationale: παρεισῆλθον означает «проникли/пробрались [внутрь]», но местоимения «к нам» в греческом тексте нет. Добавление конкретизирует обстоятельство сверх источника.
  - severity: low
    issue: «Разведать, какой свободой мы обладаем» излишне интерпретирует объект тайного наблюдения.
    rationale: κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν обозначает тайное выслеживание или разузнавание о «нашей свободе»; формулировка с «какой» делает акцент на классификации свободы, которого текст прямо не выражает.
  - severity: low
    issue: Формулировка сноски a «буквально родственное обозначение» неудачна.
    rationale: Она неясно описывает составное слово и может быть прочитана как утверждение, будто весь русский комментарий является буквальным переводом. Лучше прямо сказать, что перевод сохраняет семейный образ оригинала.
  revised_text: Но из-за тайно введённых лжебратьев[a], которые проникли, чтобы тайно разузнать о нашей свободе, которую мы имеем в Иисусе Мессии[b], — чтобы поработить нас.
  revised_footnotes:
