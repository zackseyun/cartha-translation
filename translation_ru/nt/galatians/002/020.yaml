reference: Galatians 2:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: ru
  text: И уже не я живу, но во мне живёт Мессия. А ту жизнь, которой я теперь живу во плоти, я живу верой в Сына Божьего[a], полюбившего меня и отдавшего Себя за меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верностью Сына Божьего».'
    reason: 'Альтернативное грамматическое прочтение: τοῦ υἱοῦ τοῦ θεοῦ может обозначать не объект веры, а верность, проявленную Сыном Божьим.'
lexical_decisions:
- source_word: Χριστός
  choice: Мессия
  rationale: Передаёт Χριστός как титул, а не как имя; слово понятно современному русскому читателю и сохраняет мессианский смысл.
- source_word: ὃ δὲ νῦν ζῶ
  choice: ту жизнь, которой я теперь живу
  rationale: Греческая конструкция эллиптична; по-русски подразумеваемое «жизнь» необходимо выразить явно, не добавляя нового толкования.
- source_word: ἐν σαρκί
  choice: во плоти
  rationale: Сохраняет ключевой павловский термин и обозначает нынешнее телесное земное существование, не сводя σάρξ к «греховной природе».
- source_word: ἐν πίστει ζῶ τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: живу верой в Сына Божьего
  rationale: Основной текст передаёт генитив как объект веры — естественное и понятное русское прочтение; грамматически возможная альтернатива сохранена в сноске.
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: отдавшего Себя за меня
  rationale: Естественно передаёт добровольную самоотдачу и значение ὑπέρ в данном контексте.
theological_decisions:
- issue: Значение генитива в πίστει ... τοῦ υἱοῦ τοῦ θεοῦ
  choice: верой в Сына Божьего
  alternative: верностью Сына Божьего
  rationale: Греческая конструкция допускает как объективное понимание (вера, направленная на Сына), так и субъективное (верность Сына). Основной текст следует наиболее непосредственно понятному прочтению, а сноска сохраняет подлинную богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранены слова «Мессия» и «плоть» как значимые богословские термины; синтаксис слегка упрощён ради ясности. Форма «Себя» написана с прописной буквы в соответствии с распространённой русской религиозной письменной традицией.
