lexical_decisions:
- source_word: Ἡμεῖς
  choice: Мы
  rationale: Явное местоимение сохранено, чтобы передать личный и слегка подчёркнутый характер высказывания без избыточного усиления.
- source_word: φύσει
  choice: по рождению
  rationale: Здесь слово указывает на природное, этническое происхождение, а не на внутреннюю нравственную природу. Выражение «по рождению» естественно и ясно передаёт этот смысл.
- source_word: Ἰουδαῖοι
  choice: иудеи
  rationale: Это традиционное и понятное обозначение этнорелигиозной принадлежности, сохраняющее противопоставление язычникам.
- source_word: ἐξ ἐθνῶν
  choice: из язычников
  rationale: Сохранена предложная конструкция и этническое противопоставление иудеям; в данном контексте ἔθνη означает не просто народы, а неиудеев.
- source_word: ἁμαρτωλοί
  choice: грешники
  rationale: Сохранён прямой и богословски значимый термин Павла; его резкость не смягчается пояснительным пересказом.
theological_decisions:
- issue: Следует ли передать слова как утверждение Павла о нравственном превосходстве иудеев над язычниками
  choice: 'Сохранено краткое прямое противопоставление: «иудеи, а не грешники из язычников».'
  alternative: «не причисляемые к грешникам, как язычники»
  rationale: Греческий текст формулирует традиционное этническое противопоставление резко и без пояснений. Последующий контекст его переосмысливает, но это не следует заранее вносить в данный стих.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и риторической резкости оригинала. Союз «а» естественно выражает противопоставление καὶ οὐκ. Порядок маркеров [a][b] соответствует месту, к которому относятся оба примечания.
