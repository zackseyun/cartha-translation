  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: ru
  text: 'Но когда я увидел, что они поступают не в согласии с истиной Евангелия[a], то сказал Кифе перед всеми: «Если ты, будучи иудеем, живёшь по-язычески, а не по-иудейски, то как ты принуждаешь язычников жить по-иудейски?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не идут прямо по отношению к истине Евангелия».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный вариант: «принуждаешь язычников иудействовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: поступают не в согласии
  rationale: Глагол буквально рисует образ прямой ходьбы, но в контексте обозначает поведение, не соответствующее истине Евангелия. Формулировка естественна по-русски, а буквальный образ сохранён в сноске.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: в согласии с истиной Евангелия
  rationale: В сочетании с ὀρθοποδοῦσιν предлог πρός выражает соответствие или сообразность, а не просто направление.
- source_word: Κηφᾷ
  choice: Кифе
  rationale: Сохранено употреблённое Павлом арамейское имя в принятой русской библейской форме, без замены на Пётр.
- source_word: ἐθνικῶς
  choice: по-язычески
  rationale: Наречие передаёт образ жизни, подобный образу жизни язычников, и сохраняет параллель с по-иудейски.
- source_word: Ἰουδαϊκῶς
  choice: по-иудейски
  rationale: Наречная форма естественно и симметрично передаёт противопоставление ἐθνικῶς и Ἰουδαϊκῶς.
- source_word: ἀναγκάζεις
  choice: принуждаешь
  rationale: Слово сохраняет выраженный в греческом оттенок давления или понуждения, не ослабляя его до простого побуждения.
- source_word: Ἰουδαΐζειν
  choice: жить по-иудейски
  rationale: Передаёт принятие иудейского образа жизни без внесения позднейших полемических коннотаций термина иудаизировать.
theological_decisions:
- issue: Передача Ἰουδαΐζειν без привнесения позднейшей богословской полемики
  choice: жить по-иудейски
  alternative: иудаизироваться; соблюдать иудейские обычаи
  rationale: Контекст касается образа жизни, включая совместную трапезу и этнорелигиозные границы. Выбранная формулировка сохраняет широту выражения и не сводит его к заранее определённому набору обычаев.
- issue: Смысл вопросительного πῶς
  choice: как же ты принуждаешь
  alternative: как можешь ты принуждать
  rationale: Прямая передача πῶς сохраняет вопрос о фактическом поведении и его непоследовательности, не превращая вопрос в вопрос о возможности или праве.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис остаётся ясным для широкого читателя; симметрия «по-язычески — по-иудейски» сохраняет риторический контраст оригинала.
