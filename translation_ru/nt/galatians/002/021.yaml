id: GAL.2.21
reference: Galatians 2:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: ru
  text: Я не свожу на нет Божью благодать, ведь если праведность обретается через Закон, то Мессия умер напрасно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετῶ
  choice: отвергаю
  rationale: В данном контексте глагол означает отвергать или сводить на нет; «не отвергаю» естественно по-русски и сохраняет личную направленность высказывания Павла.
- source_word: χάριν
  choice: благодать
  rationale: Устоявшийся и точный эквивалент в богословской речи Павла, обозначающий незаслуженный Божий дар и расположение.
- source_word: διὰ νόμου
  choice: через Закон
  rationale: Передаёт διά с родительным падежом как средство; прописная буква показывает, что имеется в виду Закон в контексте Павловой аргументации, без добавления отсутствующего в греческом определённого артикля.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Наиболее естественный русский эквивалент в Павловом контексте оправдания и правильного положения перед Богом; не сужает выражение до одной лишь общественной справедливости.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт Χριστός как титул «Помазанник», а не просто как имя.
- source_word: δωρεὰν
  choice: напрасно
  rationale: В условном доводе Павла слово выражает тщетность и отсутствие смысла; «напрасно» точно и естественно передаёт эту силу.
theological_decisions:
- issue: Связь праведности и Закона в доводе Павла
  choice: Если праведность достигается через Закон, смерть Мессии была напрасной.
  alternative: Если понимать δικαιοσύνη преимущественно как «справедливость», акцент смещается к восстановлению справедливого порядка или отношений завета.
  rationale: Ближайший контекст говорит о праведности перед Богом не на основании дел Закона. Перевод сохраняет условную форму и резкость вывода, не разворачивая их в дополнительную доктринальную формулу.
- issue: Значение ἀθετῶ применительно к Божьей благодати
  choice: «Не отвергаю» — Павел не отбрасывает и не отменяет действенность благодати.
  alternative: «Не свожу на нет» сильнее подчёркивает практическое лишение благодати силы.
  rationale: Оба оттенка допустимы; «не отвергаю» лучше сохраняет естественный русский слог, тогда как последующий довод ясно показывает подразумеваемое обессмысливание благодати.
translation_notes:
  register: Современный литературный русский язык, сжатый и достойный по тону. Синтаксис сохраняет причинно-условную структуру греческого текста. «Закон» написан с прописной буквы как контекстуальное обозначение Моисеева Закона; «Мессия» сохраняет титульную функцию Χριστός.
