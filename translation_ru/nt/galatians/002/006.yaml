reference: Galatians 2:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: ru
  text: А что касается тех, кого считали значительными людьми[a], — кем бы они прежде ни были, для меня это не имеет значения; Бог не проявляет лицеприятия[b], — ведь те, кого считали значительными, ничего мне не добавили[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто казался значительным».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Бог не принимает лица человека» — идиома, означающая, что Бог не оказывает предпочтения на основании положения или внешних признаков.'
    reason: cultural_note
  - marker: c
    text: 'Или: «не возложили на меня ничего дополнительного». В греческом не уточняется, что именно они не добавили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: тех, кого считали кем-то значительным / эти уважаемые люди
  rationale: δοκέω указывает на признанное положение и репутацию. Формулировки сохраняют лёгкую риторическую дистанцию Павла, но не превращают его слова в презрительную оценку руководителей.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: кем бы они когда-то ни были
  rationale: Передаёт безразличие прежнего положения этих людей для довода Павла; «когда-то» естественно отражает ποτε, не усиливая временного противопоставления.
- source_word: οὐδέν μοι διαφέρει
  choice: для меня это не имеет значения
  rationale: Естественная русская передача идиомы, ясно выражающая мысль о том, что их статус не влияет на суждение Павла.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Бог не проявляет лицеприятия
  rationale: Передаёт смысл семитизированной идиомы о беспристрастности Бога, не вводя в основной текст непонятное буквальное выражение о принятии лица.
- source_word: ἐμοὶ γὰρ
  choice: эти … ничего мне
  rationale: Дательный ἐμοί сохранён словом «мне»; связь γάρ с предшествующим пояснением естественно выражена пунктуацией и общей структурой фразы, поскольку буквальное «ибо мне» по-русски было бы тяжеловесно.
- source_word: οὐδὲν προσανέθεντο
  choice: ничего мне не добавили
  rationale: 'Сохраняет краткость и некоторую неоднозначность глагола: речь может идти о том, что признанные руководители ничего не прибавили к вести или наставлению Павла и ничего дополнительного на него не возложили.'
theological_decisions:
- issue: Выражает ли Павел презрение к иерусалимским руководителям или независимость от их статуса
  choice: 'Сохранён сдержанно-дистанцированный тон: их общественное положение не определяет истинность благовестия Павла.'
  alternative: Более резкое «те, кто только казался важным» звучало бы как отрицание их подлинного авторитета; более мягкое «признанные руководители» ослабило бы риторическую напряжённость.
  rationale: Греческое οἱ δοκοῦντες допускает оттенок дистанции, но само по себе не доказывает, что Павел считал их руководство незаконным.
- issue: Что именно руководители «не добавили» Павлу
  choice: В основном тексте объект не уточняется, а возможные значения отмечены в сноске.
  alternative: 'Можно конкретизировать: «ничего не добавили к моей вести» либо «ничего больше на меня не возложили».'
  rationale: В греческом прямой объект не назван; уточнение в основном тексте преждевременно разрешило бы смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Длинная фраза и вставные конструкции отчасти сохранены, чтобы передать напряжённый ход мысли Павла; при этом синтаксис упорядочен для естественного русского чтения. «Лицеприятие» — традиционное, но по-прежнему понятное библейское слово, здесь раскрыто глагольной конструкцией и пояснено в сноске.
