  text: Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: ru
  text: Пусть тот, кого наставляют в слове, делится всем добрым с тем, кто его наставляет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делится с наставляющим его всеми благами»; вероятно, речь в том числе о материальной поддержке.'
    reason: Сохраняет возможный смысл πρακтического, в том числе материального, участия, но не сужает широкое значение «всех благ».
lexical_decisions:
- source_word: Κοινωνείτω
  choice: пусть… делится
  rationale: Настоящее повелительное наклонение выражает продолжающуюся практику. «Делиться» естественно передаёт κοινωνέω и сохраняет широту значения, не сводя его только к денежной помощи.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: δέ обозначает мягкий переход; в русском отдельное «же» здесь звучало бы тяжеловесно и могло бы создать излишний оттенок противопоставления.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: тот, кого наставляют в слове
  rationale: Передаёт настоящее страдательное причастие как получаемое наставление и сохраняет λόγος как «слово», не вводя позднейший специальный термин «оглашенный».
- source_word: τῷ κατηχοῦντι
  choice: с тем, кто его наставляет
  rationale: Естественно передаёт настоящее действительное причастие и сохраняет словесную связь с «кого наставляют»; местоимение «его» проясняет взаимное соотношение участников.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: всем добрым
  rationale: Русская конструкция «делиться всем добрым» естественно выражает участие во всяких благах и сохраняет широкий смысл, вероятно включающий материальную поддержку.
theological_decisions:
- issue: Характер предписанного участия
  choice: Ученик должен делиться всякими благами с наставляющим его в слове, вероятно включая материальную поддержку.
  alternative: Речь только об общем духовном общении, без материальной поддержки.
  rationale: Сочетание κοινωνέω с дательным обозначением участника и ἐν πᾶσιν ἀγαθοῖς указывает на практическое участие, но формулировка остаётся широкой и не ограничивает «доброе» деньгами или вещами.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная формулировка без архаизмов. Параллель «наставляют — наставляет» отражает однокоренные греческие причастия. Маркер сноски помещён после всего утверждения, к которому относится пояснение.
