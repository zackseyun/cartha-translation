  text: Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: ru
  text: Посмотрите, какими крупными буквами я написал вам собственноручно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посмотрите, какое длинное письмо я написал вам собственноручно».'
    reason: Сочетание πηλίκοις γράμμασιν допускает менее вероятное понимание, при котором речь идёт о длине послания, а не о размере букв.
lexical_decisions:
- source_word: Ἴδετε
  choice: Посмотрите
  rationale: Аористный императив множественного числа служит призывом обратить внимание; «Посмотрите» естественно и прямо передаёт эту функцию.
- source_word: πηλίκοις
  choice: какими крупными
  rationale: Слово указывает на величину или степень. В сочетании с γράμμασιν наиболее вероятно относится к размеру написанных знаков.
- source_word: γράμμασιν
  choice: буквами
  rationale: В данном контексте множественное число естественно обозначает буквы или письменные знаки, особенно ввиду следующего упоминания о собственноручном письме.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж передан как косвенное дополнение при глаголе «написал».
- source_word: ἔγραψα
  choice: я написал
  rationale: Аорист прямо и естественно передаётся русским прошедшим совершенного вида; форма не уточняет сама по себе, идёт ли речь только о заключительной части или обо всём послании.
- source_word: τῇ ἐμῇ χειρί
  choice: собственноручно
  rationale: Это естественная русская передача инструментального оборота с эмфатическим притяжательным местоимением; она подчёркивает, что Павел пишет своей рукой.
theological_decisions:
- issue: Толкование πηλίκοις γράμμασιν
  choice: физический размер букв
  alternative: 'длина письма: «какое длинное письмо»'
  rationale: Обычное значение γράμματα как букв или письменных знаков и непосредственное упоминание о письме собственной рукой делают указание на крупный почерк более вероятным. Однако грамматически и исторически засвидетельствованная возможность отнести величину ко всему письму сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; обращение во множественном числе, тон прямой и достойный. «Собственноручно» звучит естественнее буквального «своей рукой» и сохраняет эмфазу оригинала.
