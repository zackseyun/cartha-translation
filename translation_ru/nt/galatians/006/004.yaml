  footnotes:
  - marker: a
    text: 'Или: «похвальба», «предмет похвальбы» или «основание для похвальбы». Греческое слово может обозначать саму похвальбу либо её предмет или основание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργον
  choice: дело
  rationale: Единственное число сохранено; «дело» достаточно широко передаёт поступки и деятельность человека, не сводя речь к одному отдельному поступку.
- source_word: δοκιμαζέτω
  choice: пусть проверяет
  rationale: Передаёт повеление подвергать собственное дело испытанию и оценке, не предполагая заранее положительного результата.
- source_word: ἕκαστος
  choice: каждый
  rationale: Сохраняет распределительное значение и естественно сочетается в русском с последующими формами единственного числа.
- source_word: ἑαυτοῦ
  choice: своё собственное
  rationale: Возвратное местоимение передано естественным русским «своё», а «собственное» подчёркивает противопоставление чужому делу.
- source_word: καύχημα
  choice: основание хвалиться
  rationale: Формулировка передаёт возможное значение предмета или основания похвалы, сохраняя связь с глагольным понятием «хвалиться».
- source_word: εἰς ἑαυτὸν μόνον
  choice: только собой
  rationale: Естественно выражает направленность оценки на самого себя и исключает сравнительную похвалу за счёт другого.
- source_word: τὸν ἕτερον
  choice: другим человеком
  rationale: Уточняет, что субстантивированное «другой» обозначает другого человека, противопоставленного самому оценивающему.
- source_word: δέ
  choice: Но
  rationale: Передаёт мягкий контраст с предыдущей мыслью и вводит призыв к самооценке.
theological_decisions:
- issue: Значение καύχημα в контексте Павла
  choice: основание хвалиться
  alternative: похвала; предмет похвалы
  rationale: Перевод не превращает выражение в однозначно положительную «гордость» и не решает за читателя, одобряется ли такая похвала; акцент текста остаётся на оценке себя без сравнения с другим.
- issue: Форма обобщённого субъекта
  choice: каждый … у него
  alternative: каждый человек … у него; все … у них
  rationale: Русское единственное число сохраняет распределительную силу греческого ἕκαστος и последовательность форм оригинала, оставаясь естественным и обобщающим.
translation_notes:
  register: Современный литературный русский язык; синтаксис близок к структуре греческого текста, но остаётся естественным. Формулировка «основание хвалиться» сохраняет смысловую неоднозначность καύχημα, пояснённую сноской.
