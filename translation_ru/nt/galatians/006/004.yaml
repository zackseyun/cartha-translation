  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: ru
  text: Но пусть каждый проверяет своё собственное дело, и тогда основание для того, чтобы хвалиться, будет у него лишь в отношении самого себя, а не другого человека[a].
