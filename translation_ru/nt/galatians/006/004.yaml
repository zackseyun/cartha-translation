review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: δοκιμαζέτω — личное испытание/проверка своего дела, а будущее ἕξει — результат такой проверки. Однако «хвалиться только собой» в русском прежде всего означает, что человек хвалится именно собой как предметом хвастовства. Греческое εἰς ἑαυτὸν μόνον в данном противопоставлении обозначает сферу/отношение: основание для похвальбы относится только к самому человеку, не к другому. Исправление сохраняет это различие.'
  naturalness: '«Основание хвалиться» возможно, но без «для того, чтобы» звучит несколько сжато и менее естественно. Перестройка фразы делает современный литературный русский яснее и точнее. «Своё собственное дело» допустимо: «своё» передаёт возвратность, а «собственное» подчёркивает противопоставление чужому.'
  terminology: '«Дело» удачно передаёт ἔργον в широком смысле. «Хвалиться» сохраняет связь с καύχημα и не подменяет его современным психологическим понятием «гордость». Сноску следует уточнить: καύχημα — не «похвала» в смысле похвалы, получаемой от другого, а похвальба/предмет либо основание для неё.'
