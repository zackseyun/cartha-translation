revisions:
- from: Но пусть каждый проверяет своё собственное дело, и тогда у него будет основание хвалиться[a] только собой, а не другим человеком.
  to: Но пусть каждый проверяет своё собственное дело, и тогда основание для того, чтобы хвалиться, будет у него лишь в отношении самого себя, а не другого человека[a].
  rationale: 'Исправлена область действия «лишь»: она относится к основанию для похвальбы «в отношении самого себя», а не к тому, что человек хвалится собой как объектом. Уточнена сноска, чтобы не смешивать καύχημα с похвалой, получаемой от другого. Смысл, регистр и смысловая неоднозначность оригинала сохранены.'
