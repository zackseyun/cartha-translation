base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: ru
  text: 'Не обманывайтесь: Бога не высмеять, ибо что посеет человек, то и пожнёт.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Не обманывайтесь
  rationale: Настоящее страдательное повелительное наклонение во втором лице множественного числа передаёт прямое предостережение Павла; русская возвратная форма естественно выражает смысл «не позволяйте вводить себя в заблуждение» и может включать самообман.
- source_word: θεὸς
  choice: Бога
  rationale: Стандартная передача θεός; винительный падеж обусловлен естественной русской перестройкой безличного выражения «Бога не проведёшь».
- source_word: οὐ μυκτηρίζεται
  choice: не проведёшь
  rationale: Греческий глагол означает насмешливое пренебрежение, буквально связанное с презрительной гримасой. В данном контексте русское «Бога не проведёшь» естественно и ёмко передаёт мысль, что невозможно безнаказанно пренебречь Богом или обмануть его, сохраняя афористическую силу; буквальное «Бог поругаем не бывает» архаично, а «над Богом не насмехаются» может ошибочно звучать как отрицание самого факта человеческих насмешек.
- source_word: ὃ γὰρ ἐὰν
  choice: Что
  rationale: Неопределённо-относительная конструкция вводит общее условие; русская корреляция «что… то…» точно и естественно передаёт её универсальный смысл. Связь γάρ с предыдущим утверждением ясна из последовательности фраз и не требует тяжеловесного «ведь».
- source_word: σπείρῃ
  choice: посеет
  rationale: Сельскохозяйственная метафора сохранена буквально; совершенный вид естественен в русском обобщённо-условном изречении.
- source_word: ἄνθρωπος
  choice: человек
  rationale: ἄνθρωπος обозначает здесь любого представителя человечества. Русское «человек» точно сохраняет единственное число и общий смысл без ненужного ограничения мужчинами.
- source_word: τοῦτο καὶ θερίσει
  choice: то и пожнёт
  rationale: Корреляция «что… то и…» сохраняет указательную силу τοῦτο и усилительное καί, подчёркивая точное соответствие посева и жатвы.
theological_decisions:
- issue: Всеобщий смысл ἄνθρωπος
  choice: человек
  alternative: мужчина
  rationale: В контексте это родовое обозначение человека вообще, а не указание на мужской пол; русский эквивалент «человек» сохраняет и форму единственного числа, и универсальность принципа.
- issue: Смысл οὐ μυκτηρίζεται
  choice: Бога не проведёшь
  alternative: Бог поругаем не бывает / над Богом нельзя насмехаться
  rationale: Высказывание предупреждает, что Бога невозможно обмануть или безнаказанно презреть, что подтверждает последующая метафора посева и жатвы. Выбранная формулировка не утверждает, будто люди фактически никогда не насмехаются над Богом, и не вводит архаического оттенка.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным и афористичным строем. Параллель «что… то и…» сохраняет риторику оригинала; разговорно-пословичное «не проведёшь» понятно широкому читателю и уместно передаёт силу предупреждения.
