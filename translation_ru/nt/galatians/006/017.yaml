base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: ru
  text: Отныне пусть никто не доставляет мне хлопот, ибо я ношу на своём теле отметины Иисуса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клейма Иисуса». Это слово может обозначать отметины на теле, указывающие на принадлежность или верность кому-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Отныне
  rationale: 'Кратко и естественно передаёт временное значение выражения: «с этого времени», «впредь».'
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: пусть никто не причиняет мне беспокойства
  rationale: В сочетании κόπους παρέχειν речь идёт не о труде как таковом, а о причинении хлопот, затруднений или беспокойства. Такая формулировка сохраняет повелительный запрет и звучит достойно и современно.
- source_word: τὰ στίγματα
  choice: знаки
  rationale: Слово обозначает телесные отметины, в том числе клейма, указывающие на принадлежность. «Знаки» не сводит смысл только к шрамам или буквальному клеймению; более конкретный оттенок отражён в сноске.
- source_word: τοῦ Ἰησοῦ
  choice: Иисуса
  rationale: 'Простой родительный падеж сохраняет неоднозначность связи: это могут быть знаки, связанные с Иисусом, понесённые ради Него или свидетельствующие о принадлежности Ему.'
- source_word: ἐν τῷ σώματί μου
  choice: на своём теле
  rationale: Для телесных отметин русский язык естественно употребляет «на теле», хотя греческий предлог буквально может передаваться как «в».
- source_word: βαστάζω
  choice: ношу
  rationale: Передаёт значение постоянного ношения телесных знаков естественнее для современного русского, сохраняя физический и символический оттенки.
theological_decisions:
- issue: Характер τὰ στίγματα Павла
  choice: Нейтрально переведено как «знаки Иисуса» без уточнения их точной природы.
  alternative: «шрамы Иисуса» или «клейма Иисуса»
  rationale: Вероятно, имеются в виду следы перенесённых за Иисуса страданий, одновременно свидетельствующие о принадлежности Ему. Однако сам стих не требует выбрать только буквальные шрамы, клейма принадлежности или метафорическое обозначение апостольских страданий.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным завершительным тоном. Формулировка избегает архаизма «да не причиняет» и сохраняет смысловую неоднозначность телесных знаков.
