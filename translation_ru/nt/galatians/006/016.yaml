  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: ru
  text: И всем, кто будет держаться этого правила[a], — мир и милость им, и Израилю Божьему[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все, кто будет следовать этому мерилу». Глагол может передавать образ движения в одном строю, в соответствии с установленным правилом.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «Израиль Божий» понимают по-разному: как верующих иудеев, как всю церковь или, шире, как Божий народ. Перевод сохраняет формулировку греческого текста, не разрешая этот спор.'
    reason: alternative_reading
  - marker: c
    text: Последнее «и» может присоединять ещё одну группу («и Израилю Божьему») либо пояснять, по-иному называя ту же группу («то есть Израилю Божьему»).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: все, кто
  rationale: Естественно передаёт обобщающе-распределительное значение местоимения в современном русском языке.
- source_word: κανόνι
  choice: правила
  rationale: Здесь κανών означает норму или мерило, направляющее поведение; «правило» кратко и сохраняет традиционную образность.
- source_word: στοιχήσουσιν
  choice: будет держаться
  rationale: Передаёт смысл следования установленной норме. Буквальный образ движения в одном строю пояснён в сноске, поскольку «ходить по этому правилу» звучит в современном русском неестественно.
- source_word: εἰρήνη
  choice: мир
  rationale: Обычный русский эквивалент в формуле благословения.
- source_word: ἔλεος
  choice: милость
  rationale: Точно передаёт смысл ἔλεος и естественно сочетается со словом «мир» в благословении.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: им ... и Израилю
  rationale: Русский дательный падеж естественно выражает направленность благословения; повтор греческого предлога невозможно сохранить буквально без тяжеловесности.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: Израилю Божьему
  rationale: Формально прозрачная передача генитивной конструкции, не определяющая спорный круг людей, обозначенных этой фразой.
theological_decisions:
- issue: Кого обозначает «Израиль Божий»
  choice: Фраза сохранена без уточнения её референта.
  alternative: Уточнить как верующих иудеев, всю церковь либо весь Божий народ из иудеев и язычников.
  rationale: Греческий текст не требует однозначного решения, а уточняющий перевод внёс бы спорное богословское толкование.
- issue: Значение последнего καί перед «Израилем Божьим»
  choice: Передано нейтральным союзом «и».
  alternative: Передать как «то есть» или «даже», отождествляя Израиль Божий с ранее названной группой, либо явно представить его как отдельную группу.
  rationale: В контексте союз допускает как присоединительное, так и пояснительно-приложительное понимание; «и» сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным благословительным тоном. Синтаксис сделан естественным для русского, при этом сохранены повтор союза и богословская неоднозначность заключительной фразы.
