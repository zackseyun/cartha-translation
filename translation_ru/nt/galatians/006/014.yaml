    issue: Не вполне удачная передача μὴ γένοιτο и управления при καυχᾶσθαι
    rationale: «Ни за что не стану хвалиться ничем» содержит двойное усиление и придаёт высказыванию оттенок будущего решения. Греческий оптатив выражает категорическое отвержение; «Для меня немыслимо хвалиться чем-либо, кроме…» передаёт это точнее и естественнее. Творительный «крестом» также непосредственно соответствует обычному русскому управлению глагола «хвалиться» и ἐν.
  - severity: low
