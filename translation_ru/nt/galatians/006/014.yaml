base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: ru
  text: Но для меня немыслимо хвалиться чем-либо, кроме креста нашего Господа Иисуса, Мессии[a], через который[b] мир распят для меня, а я — для мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий титул «Христос» означает «Мессия»; возможно также традиционное: «Иисуса Христа».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «через которого», если местоимение относится к Господу Иисусу, Мессии, а не к кресту.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ни за что не стану
  rationale: Передаёт сильное личное отвержение самой мысли, выраженной греческим оптативом, естественным современным русским оборотом.
- source_word: καυχᾶσθαι
  choice: хвалиться
  rationale: Сохраняет обычное для Павла значение публичного превознесения или гордости своим основанием для уверенности.
- source_word: εἰ μὴ
  choice: ничем, кроме
  rationale: Ясно обозначает единственное допустимое основание для хвалы и естественно сочетается с русским отрицанием.
- source_word: σταυρῷ
  choice: креста
  rationale: Традиционный и точный русский эквивалент в контексте распятия Иисуса.
- source_word: κυρίου
  choice: Господа
  rationale: Соответствует новозаветному титулу κύριος и принятому литературному русскому употреблению.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт смысл греческого титула Χριστός, а не только его традиционную транслитерацию «Христос».
- source_word: δι’ οὗ
  choice: через который
  rationale: В основном тексте местоимение отнесено к ближайшему существительному «крест» и выражает средство; грамматически возможное отнесение к Иисусу Мессии сохранено в сноске.
- source_word: κόσμος
  choice: мир
  rationale: Сохраняет широту метафоры и не сужает её толкованием вроде «мирового порядка».
- source_word: ἐσταύρωται
  choice: распят
  rationale: Краткая форма русского причастия естественно передаёт совершившееся распятие и сохраняющийся результат греческого перфекта.
- source_word: κἀγὼ κόσμῳ
  choice: а я — для мира
  rationale: Сохраняет эллипсис глагола и резкий параллелизм исходного текста; тире естественно обозначает пропущенное «распят».
theological_decisions:
- issue: Передача титула Χριστός
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: «Мессия» раскрывает значение греческого титула, не добавляя конфессионального толкования; традиционная форма отмечена в сноске.
- issue: Антецедент δι’ οὗ
  choice: 'крест: «через который»'
  alternative: 'Господь Иисус Мессия: «через которого»'
  rationale: И «крест», и мужское личное обозначение в греческом допускают согласование с οὗ. Ближайшим антецедентом и наиболее непосредственным средством в синтаксисе служит «крест», но подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством и риторической силой. Оборот «ни за что не стану» естественно передаёт сильное отрицание; финальный параллелизм сохранён без избыточного повторения глагола.
