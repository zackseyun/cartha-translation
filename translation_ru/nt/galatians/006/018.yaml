source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: ru
  text: Благодать Господа нашего Иисуса Мессии[a] да будет с вашим духом, братья[b]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции: «Иисуса Христа». Греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: lexical_alternative
  - marker: b
    text: 'Слово «братья» здесь обращено ко всей общине верующих и может включать как мужчин, так и женщин; возможный перевод: «братья и сёстры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся русский эквивалент для ключевого павловского термина; сохраняет смысл незаслуженной Божьей милости и естественно звучит в заключительном благословении.
- source_word: κυρίου
  choice: Господа
  rationale: Передаёт κύριος как исповедальный титул Иисуса и соответствует естественному русскому библейскому словоупотреблению.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет значение титула — «Мессия», а не передаётся только традиционной транслитерацией; привычный вариант «Иисуса Христа» указан в сноске.
- source_word: μετὰ
  choice: да будет с
  rationale: В греческом благословение безглагольное; русская формула «да будет с» естественно восполняет подразумеваемое пожелание.
- source_word: πνεύματος ὑμῶν
  choice: вашим духом
  rationale: Буквально сохраняет πνεῦμα и примечательное сочетание единственного числа «дух» с обращением ко всей общине.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужское обращение исходного текста; то, что им может обозначаться вся община, включая женщин, поясняется в сноске.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная и общепонятная передача литургического заключения.
theological_decisions:
- issue: Передача Χριστός в заключительном павловском благословении
  choice: Мессия
  alternative: Христос
  rationale: Смысл греческого титула передан непосредственно, тогда как традиционная русская форма сохранена в сноске; это не превращает титул в простую часть имени.
- issue: Передача ἀδελφοί при обращении ко всей общине
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет мужскую форму греческого обращения, не исключая его вероятного собирательного употребления; инклюзивный охват пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого апостольского благословения. Частица «да» сохраняет пожелательный характер фразы; синтаксис остаётся ясным и естественным.
