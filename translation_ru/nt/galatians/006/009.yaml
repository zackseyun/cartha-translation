id: GAL.6.9
reference: Galatians 6:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: ru
  text: Не будем же падать духом, делая добро[a], ведь в своё время[b] мы пожнём, если не ослабеем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будем уставать делать то, что хорошо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в надлежащее время».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не ослабевая»; возможно также: «если не изнеможем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: делая добро
  rationale: Сочетание субстантивированного прилагательного τὸ καλόν с ποιέω означает «делать добро / делать то, что хорошо». «Делая добро» естественно по-русски и сохраняет нравственный смысл и длительный характер действия.
- source_word: μὴ ἐγκακῶμεν
  choice: не будем же падать духом
  rationale: Глагол обозначает утрату мужества, уныние или изнеможение, ведущее к отступлению. «Не будем падать духом» передаёт призыв не терять решимости и позволяет отличить это выражение от μὴ ἐκλυόμενοι.
- source_word: καιρῷ ... ἰδίῳ
  choice: в своё время
  rationale: καιρός указывает на подходящий или назначенный срок, а ἴδιος — на присущий, соответствующий ему момент. Русское «в своё время» кратко и естественно сохраняет этот смысл.
- source_word: θερίσομεν
  choice: мы пожнём
  rationale: Будущее время сохраняет уверенное обещание, а «пожнём» продолжает земледельческий образ предшествующего контекста.
- source_word: μὴ ἐκλυόμενοι
  choice: если не ослабеем
  rationale: Причастие может обозначать изнеможение, ослабление или утрату стойкости. Условная передача естественна в данном контексте и сохраняет связь между будущей жатвой и непрекращающейся стойкостью.
theological_decisions:
- issue: 'Соотношение двух выражений о стойкости: ἐγκακῶμεν и ἐκλυόμενοι'
  choice: 'Передать их различно, но близко по смыслу: «не будем падать духом» и «если не ослабеем».'
  alternative: «не будем уставать» и «если не сдадимся»; либо «не будем унывать» и «не изнемогая».
  rationale: Павел употребляет два близких, но не тождественных выражения. Различная передача сохраняет риторическое развитие мысли, не превращая текст в утверждение какой-либо особой доктринальной системы.
- issue: Условный оттенок μὴ ἐκλυόμενοι
  choice: 'Передать явно: «если не ослабеем».'
  alternative: 'Сохранить форму обстоятельственного причастия: «не ослабевая».'
  rationale: Греческое причастие допускает обстоятельственный, в данном контексте условный смысл. Явное «если» делает связь понятной по-русски, не определяя сверх текста богословскую природу этой связи.
translation_notes:
  register: Современный литературный русский язык с ясным, увещательным и достойным звучанием. Частица «же» передаёт δέ как переход и продолжение мысли. Сохранён земледельческий образ жатвы; два близких глагола стойкости намеренно не сведены к одному выражению.
