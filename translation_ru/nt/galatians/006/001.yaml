    rationale: Глагол означает восстанавливать или приводить в надлежащее состояние. «Восстанавливайте» лучше выражает цель бережного возвращения человека, не сводя действие к выговору или коррекции.
  - severity: medium
    issue: «Кого-то застанут» фиксирует лишь значение обнаружения в проступке.
    rationale: προλημφθῇ может обозначать быть застигнутым, настигнутым или захваченным врасплох. «Будет застигнут» оставляет в основном тексте большую часть этой неоднозначности, а сноска должна формулировать альтернативы грамматически ясно.
