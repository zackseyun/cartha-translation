review_pass:
  verdict: revise
  source_fidelity: Основной смысл передан, однако «застанут» чрезмерно привязывает προλημφθῇ к обнаружению человека другими. Греческий пассив допускает также, что человека «настиг» проступок или он был захвачен врасплох. Кроме того, καταρτίζετε прежде всего означает восстановить, привести в должное состояние, а не просто исправить чью-либо ошибку. В заключении πειρασθῇ — пассивное «быть искушённым»; это лучше сохранить.
  naturalness: Текст в целом понятен, но сочетание множественного повеления «исправляйте» с прямым единственным «следи» заметно резче, чем необходимо в русском. Сохранить личную направленность греческого σεαυτόν можно посредством «следя за собой, чтобы и ты сам…». «В каком-нибудь проступке» естественнее современного «в каком-либо проступке».
  terminology: «Братья и сёстры» ясно раскрывает вероятно смешанный состав адресатов, но добавляет в основной текст слово, которого нет в ἀδελφοί, и расходится с английским аудит-трейлом, сохраняющим «Brothers» с пояснением в сноске. «Братья» с примечанием является более точным решением. «Восстанавливайте» удачно передаёт καταρτίζετε; «в духе кротости» сохраняет допустимую неоднозначность πνεύματι.
