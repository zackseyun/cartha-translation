    rationale: Форма ἀδελφοί — мужское множественное обращение; она, вероятно, охватывает всю общину, но это следует пояснить в сноске, а не добавлять «сёстры» в основной текст. Такой выбор также согласует русский текст с английским аудит-трейлом.
  - severity: medium
