source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: ru
  text: Братья,[a] даже если кто-то будет застигнут в каком-нибудь проступке,[b] вы, духовные, восстанавливайте такого человека в духе кротости, следя за собой, чтобы и ты сам не был искушён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая форма буквально означает «братья». Мужская форма множественного числа может обращаться ко всей общине, включая женщин.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет настигнут каким-нибудь проступком»; возможно также: «будет застигнут врасплох в каком-нибудь проступке».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Братья и сёстры
  rationale: Форма мужского рода множественного числа служит обращением к общине и в данном контексте естественно охватывает верующих обоих полов; русское парное обращение ясно передаёт адресата.
- source_word: ἐὰν καὶ
  choice: даже если
  rationale: Передаёт уступительный оттенок условной конструкции.
- source_word: προλημφθῇ
  choice: застанут
  rationale: Естественно передаёт возможность того, что человека обнаружили вовлечённым в проступок, не исключая оттенка внезапного захвата, отмеченного в сноске.
- source_word: ἄνθρωπος
  choice: кого-то
  rationale: В данном условном высказывании существительное употреблено обобщённо; неопределённое местоимение естественно по-русски и не сужает смысл до мужчины.
- source_word: ἔν τινι παραπτώματι
  choice: в каком-либо проступке
  rationale: «Проступок» сохраняет нравственную серьёзность παράπτωμα, а «каком-либо» передаёт неопределённость τινι.
- source_word: οἱ πνευματικοὶ
  choice: вы, духовные
  rationale: Сохраняет краткость и смысловую открытость греческого субстантивированного прилагательного, не уточняя самовольно, идёт ли речь прежде всего о зрелости или о жизни по Духу.
- source_word: καταρτίζετε
  choice: исправляйте
  rationale: Передаёт повеление восстановить человека в должном состоянии; в русском контексте слово указывает на исправление с целью восстановления, а не наказания.
- source_word: τὸν τοιοῦτον
  choice: такого человека
  rationale: Ясно отсылает к только что упомянутому человеку и сохраняет единственное число.
- source_word: ἐν πνεύματι πραΰτητος
  choice: в духе кротости
  rationale: Формально и естественно сохраняет возможную двусмысленность между внутренним настроем и качеством, произведённым Божьим Духом.
- source_word: σκοπῶν σεαυτόν
  choice: При этом следи за собой
  rationale: Передаёт сопутствующее предостережение; переход к единственному числу отражает греческое σεαυτόν и лично обращает предупреждение к каждому восстанавливающему.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: чтобы и тебе не подвергнуться искушению
  rationale: Сохраняет значение морального искушения и подчёркивает общую уязвимость исправляющего и согрешившего.
theological_decisions:
- issue: Адресат Ἀδελφοί и обобщённое ἄνθρωπος
  choice: «Братья и сёстры» и «кого-то»
  alternative: «Братья» и «человека» либо «мужчину»
  rationale: В обращении к галатийским общинам мужское множественное число может включать женщин, а ἄνθρωπος здесь обозначает любого человека. Современный русский текст выражает эту референцию явно, не приписывая наставлению ограничение по полу.
- issue: Значение προλημφθῇ
  choice: «застанут» с примечанием об альтернативе «настигнет»
  alternative: «будет застигнут врасплох» или «будет настигнут»
  rationale: Глагол допускает как обнаружение человека в проступке, так и образ проступка, внезапно настигшего его. Основной текст остаётся понятным, а сноска сохраняет смысловую неоднозначность.
- issue: Значение πνεύματι в выражении ἐν πνεύματι πραΰτητος
  choice: «в духе кротости»
  alternative: «с кротостью» или «в кротости, даруемой Духом»
  rationale: Такой перевод не решает без достаточных оснований, означает ли πνεῦμα человеческий настрой или подразумевает действие Святого Духа.
- issue: Число в предостережении σκοπῶν σεαυτόν
  choice: Переход от множественного «исправляйте» к единственному «следи»
  alternative: «следя каждый за собой»
  rationale: Смена числа присутствует в греческом тексте и усиливает личную ответственность каждого; её следует сохранить, несмотря на небольшую стилистическую резкость.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Сохранены прямое обращение, повелительная сила καταρτίζετε и заметный переход от множественного числа к личному предостережению в единственном числе. Сноски [a] и [b] стоят в основном тексте.
