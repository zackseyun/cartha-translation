source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: ru
  text: Ведь тот, кто сеет в угоду собственной плоти[a], от плоти пожнёт тление[b], а тот, кто сеет в угоду Духу[c], от Духа пожнёт вечную жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в угоду собственной греховной природе». Греческое слово σάρξ может буквально означать «плоть», а в этических противопоставлениях у Павла — падшую человеческую направленность, противящуюся Духу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гибель» или «разложение». Греческое слово может обозначать порчу, разрушение, гибель или распад.'
    reason: lexical_alternative
  - marker: c
    text: То есть Святому Духу. Возможно также написание «дух» со строчной буквы, однако в Послании к галатам это противопоставление обычно относится к Божьему Духу.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит обоснование предшествующего наставления. «Ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: ὁ σπείρων
  choice: тот, кто сеет
  rationale: Субстантивированное причастие настоящего времени имеет обобщающий смысл; эта конструкция сохраняет характер изречения и звучит естественно по-русски.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: для собственной плоти
  rationale: При глаголе «сеять» εἰς указывает, ради чего или в расчёте на что совершается действие. «Плоть» сохраняет терминологию Павла, а «собственной» передаёт усиление ἑαυτοῦ.
- source_word: ἐκ τῆς σαρκὸς
  choice: от плоти
  rationale: Предлог ἐκ обозначает источник результата. «От плоти» сохраняет параллель с выражением «от Духа».
- source_word: θερίσει
  choice: пожнёт
  rationale: Глагол продолжает земледельческий образ посева и жатвы; совершенный вид естественно выражает будущий итог.
- source_word: φθοράν
  choice: тление
  rationale: Слово может обозначать порчу, распад или гибель. «Тление» сохраняет широту образа и эсхатологическую серьёзность, не сводя смысл только к уничтожению или физическому разложению.
- source_word: ὁ δὲ σπείρων
  choice: а тот, кто сеет
  rationale: δέ вводит противопоставление; повтор конструкции сохраняет уравновешенный параллелизм двух частей стиха.
- source_word: εἰς τὸ πνεῦμα
  choice: для Духа
  rationale: В контексте Послания к галатам противопоставление плоти и πνεῦμα наиболее естественно относится к Божьему Духу; прописная буква указывает на этот вероятный референт.
- source_word: ἐκ τοῦ πνεύματος
  choice: от Духа
  rationale: ἐκ обозначает источник; одинаковый предлог сохраняет смысловой и синтаксический параллелизм с «от плоти».
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устойчивое и точное русское соответствие, передающее жизнь, принадлежащую грядущему веку и не имеющую конца.
theological_decisions:
- issue: Передача σάρξ в этическом противопоставлении у Павла
  choice: плоть
  alternative: греховная природа
  rationale: Хотя здесь σάρξ обозначает падшую человеческую направленность, противящуюся Духу, слово «плоть» сохраняет богословскую лексику Павла и присущую ей смысловую напряжённость, не подменяя термин толкованием.
- issue: Референт πνεῦμα
  choice: Дух
  alternative: дух
  rationale: В ближайшем и более широком контексте Послания к галатам противопоставление плоти и Духа обычно относится к Святому Духу. При этом сноска отмечает формальную возможность написания со строчной буквы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Параллелизм «сеет — пожнёт» и «от плоти — от Духа» сохранён; архаические синтаксические формы устранены, но ключевые термины «плоть», «Дух», «тление» оставлены ради смысловой и богословской точности.
