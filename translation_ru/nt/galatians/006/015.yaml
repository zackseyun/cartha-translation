  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: ru
  text: Ибо ни обрезание ничего не значит[a], ни необрезание, а новое творение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничего собой не представляет»; «не имеет никакого значения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «новое создание»; в данном контексте менее вероятно: «новое существо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Ибо ни
  rationale: «Ибо» сохраняет пояснительную связь γάρ с предыдущим рассуждением, а «ни» вводит первую часть парной конструкции οὔτε… οὔτε.
- source_word: περιτομή
  choice: обрезание
  rationale: Обычное и точное обозначение как самого обряда, так и связанного с ним религиозно-этнического статуса.
- source_word: τί ἐστιν
  choice: ничего не значит
  rationale: Передаёт контекстуальный смысл греческой идиомы — отсутствие решающего значения или ценности — естественным современным русским языком.
- source_word: οὔτε ἀκροβυστία
  choice: ни необрезание
  rationale: Сохраняет симметричное противопоставление обрезанию и обозначает состояние или статус необрезанного человека, не сводя выражение к буквальному анатомическому значению.
- source_word: ἀλλὰ
  choice: а
  rationale: Русский противительный союз ясно и естественно обозначает резкий переход от двух отрицаемых оснований к тому, что действительно существенно.
- source_word: καινὴ κτίσις
  choice: новое творение
  rationale: «Творение» сохраняет широту κτίσις и допускает как реальность нового Божьего творения, так и, в меньшей степени, новое сотворённое существо; «новое» передаёт качественную новизну καινή.
theological_decisions:
- issue: Значение противопоставления обрезания, необрезания и нового творения
  choice: Павел отрицает решающее значение обоих состояний по сравнению с реальностью нового творения.
  alternative: Понимать слова лишь как уравнивание социальных признаков либо как признание двух равноценных путей.
  rationale: Греческий текст одинаково отрицает значимость обоих состояний и противопоставляет им «новое творение». Перевод сохраняет это напряжённое противопоставление, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, с сохранением афористической сжатости греческого текста. Парная конструкция «ни… ни…» воспроизводит синтаксический баланс оригинала.
