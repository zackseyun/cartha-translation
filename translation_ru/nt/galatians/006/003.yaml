id: GAL.6.3
reference: Galatians 6:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: ru
  text: Ведь если кто-то считает себя чем-то, будучи ничем, он обманывает самого себя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводит самого себя в заблуждение».'
    reason: Лексический вариант для φρεναπατᾷ, подчёркивающий заблуждение в собственных мыслях.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» передаёт пояснительную силу γάρ и естественно связывает стих с предыдущим наставлением, а «если» сохраняет условное значение εἰ.
- source_word: δοκεῖ
  choice: считает
  rationale: Здесь глагол обозначает собственную оценку человека, а не то, каким он кажется окружающим.
- source_word: τις
  choice: кто-то
  rationale: Неопределённое местоимение имеет обобщающий смысл; «кто-то» естественно передаёт его в русском языке.
- source_word: εἶναί τι
  choice: считает себя чем-то
  rationale: Сохранён лаконичный образ «быть чем-то», подразумевающий представление о собственной значимости, без поясняющего расширения в основном тексте.
- source_word: μηδὲν ὤν
  choice: будучи ничем
  rationale: Причастная конструкция близко передаёт греческое выражение и сохраняет резкий контраст между «чем-то» и «ничем», не усиливая уступительный оттенок словом «хотя».
- source_word: φρεναπατᾷ
  choice: обманывает
  rationale: Глагол означает вводить в заблуждение, в данном контексте — относительно собственной оценки; «обманывает» ясно и естественно передаёт основное значение.
- source_word: ἑαυτόν
  choice: самого себя
  rationale: Возвратное местоимение относится к обобщённому субъекту в единственном числе; форма «самого себя» подчёркивает направленность самообмана на самого человека.
theological_decisions:
- issue: Обобщённое указание на человека
  choice: кто-то… себя… он… самого себя
  alternative: человек… себя или множественное «они… себя»
  rationale: Греческий текст использует обобщённый субъект в единственном числе. Русская конструкция с «кто-то» и согласованным мужским родом сохраняет число и не ограничивает смысл только мужчинами.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и назидательная. Параллелизм «чем-то — ничем» сохранён, как и неопределённость того, в чём именно человек считает себя значимым.
