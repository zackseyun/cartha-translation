id: GAL.6.10
reference: Galatians 6:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: ru
  text: Итак, пока у нас есть возможность[a], будем делать добро всем, особенно тем, кто принадлежит к семье веры[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока у нас есть для этого время». Греческое слово καιρός обозначает подходящее или благоприятное время, а не просто время вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к домашним по вере», «к членам семьи веры». В греческом тексте верующие представлены как принадлежащие к одному дому или семье.'
    reason: lexical_alternative
  - marker: c
    text: «Вера» здесь может означать также общую исповедуемую веру — «эту веру».
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание выводных частиц связывает призыв с предшествующим рассуждением; «итак» естественно и ясно передаёт этот логический переход.
- source_word: ὡς καιρὸν ἔχομεν
  choice: пока у нас есть возможность
  rationale: καιρός обозначает подходящее, благоприятное время, а не просто время вообще. Такая формулировка передаёт как временную ограниченность, так и возможность действовать.
- source_word: ἐργαζώμεθα τὸ ἀγαθὸν
  choice: будем делать добро
  rationale: Увещательное сослагательное наклонение призывает общину к продолжающемуся действию. «Делать добро» — естественное русское выражение для субстантивированного τὸ ἀγαθόν.
- source_word: πρὸς πάντας
  choice: всем
  rationale: В данном контексте πρός указывает на людей, к которым направлено доброе действие. Дательный падеж естественно передаёт это значение по-русски, не сужая всеобщего охвата.
- source_word: μάλιστα δὲ
  choice: особенно
  rationale: μάλιστα устанавливает особый приоритет внутри общего призыва и не исключает остальных людей.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: тем, кто принадлежит к семье веры
  rationale: οἰκεῖοι обозначает принадлежащих к дому или семье. Перевод сохраняет семейную метафору и при этом звучит понятнее современному читателю, чем «домочадцы веры».
- source_word: πίστεως
  choice: веры
  rationale: Основное значение πίστις здесь сохранено без уточнения, идёт ли речь прежде всего о личной вере или об общей исповедуемой вере.
theological_decisions:
- issue: Охват и приоритет дел добра
  choice: Призыв относится ко всем людям, но особо выделяет принадлежащих к сообществу веры.
  alternative: Ограничить призыв только верующими либо не передавать особой ответственности перед ними.
  rationale: πρὸς πάντας прямо задаёт всеобщий охват, а μάλιστα вводит особый приоритет, не отменяя общего призыва.
- issue: Значение τῆς πίστεως
  choice: В основном тексте сохранено широкое «веры».
  alternative: Передать как «общей веры» или «исповедуемой веры», придав выражению более явно конфессиональный смысл.
  rationale: Родительный падеж связывает семью с верой, но сам по себе не требует сужать значение до формализованного исповедания; возможный оттенок общей веры отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным увещательным тоном. Формулировка «семья веры» сохраняет образ исходного текста, не прибегая к архаичному «домочадцы»; универсальный призыв и особый приоритет переданы без противопоставления.
