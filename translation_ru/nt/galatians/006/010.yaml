  naturalness: Текст звучит естественно на современном литературном русском языке. «Будем делать добро всем» — ясная и идиоматичная увещательная формулировка; «особенно тем, кто принадлежит к семье веры» понятна и сохраняет метафору без архаизации.
  terminology: «Вера» обоснованно сохраняет широту πίστεως и не навязывает конфессионально суженного толкования. «Семья веры» передаёт образ общины как дома/семьи; сноски корректно отмечают варианты и возможное понимание πίστεως как общей исповедуемой веры.
