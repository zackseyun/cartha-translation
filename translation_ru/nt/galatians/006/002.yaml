id: GAL.6.2
reference: Galatians 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: ru
  text: Несите тяготы друг друга — так вы исполните закон Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон Христа».'
    reason: Традиционная передача титула Χριστός; основной текст раскрывает его значение как «Мессия».
lexical_decisions:
- source_word: ἀλλήλων
  choice: друг друга
  rationale: Взаимное местоимение указывает на взаимную заботу внутри общины; это естественное и точное русское соответствие.
- source_word: τὰ βάρη
  choice: тяготы
  rationale: Передаёт метафорические тяжести, трудности и испытания, которые несёт человек. Слово «тяготы» современно, понятно и сохраняет образ веса.
- source_word: βαστάζετε
  choice: несите
  rationale: Форма настоящего повелительного наклонения во множественном числе призывает к продолжающемуся действию. «Несите» сохраняет образ ноши без пояснительного добавления «помогайте».
- source_word: οὕτως
  choice: так
  rationale: 'Кратко и естественно связывает исполнение заповеди с последующим результатом: именно таким образом адресаты исполнят названный закон.'
- source_word: ἀναπληρώσετε
  choice: вы исполните
  rationale: Будущее изъявительное обозначает результат исполнения повеления. В сочетании с «законом» глагол «исполните» идиоматичен и сохраняет юридико-этическую окраску.
- source_word: τὸν νόμον
  choice: закон
  rationale: Прямое соответствие νόμος, сохраняющее намеренную формулировку Павла и её богословское напряжение; более расплывчатое «принцип» не требуется.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь выступает как титул в родительном падеже и определяет принадлежность или характер закона. «Мессии» передаёт значение титула и его иудейский контекст.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В словосочетании «закон Мессии» слово Χριστός функционирует как титул. Основной текст передаёт значение титула, а традиционное «Христа» сохраняется в примечании как допустимый вариант.
- issue: Смысл выражения «закон Мессии»
  choice: Сохранить без поясняющего истолкования
  alternative: заповедь Мессии; принцип Мессии
  rationale: Греческий текст не уточняет, идёт ли речь о законе, данном Мессией, принадлежащем ему или характеризуемом им. Буквальная родительная конструкция сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и легко понятной формулировкой. Тире естественно передаёт смысловую связь между повелением и его результатом. Сохранены метафора ноши, взаимность действия и будущее время греческого текста.
