id: GAL.6.12
reference: Galatians 6:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: ru
  text: Те, кто хотят хорошо выглядеть по плоти[a], принуждают вас принять обрезание — только для того, чтобы не подвергаться гонениям за крест Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выгодно выглядеть внешне».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «крест Христа»; также возможно: «не подвергаться гонениям из-за креста Мессии».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: те, кто
  rationale: Естественно по-русски обозначает всю описываемую группу, сохраняя обобщающий смысл.
- source_word: θέλουσιν
  choice: хочет
  rationale: Прямо и современно передаёт волю и намерение действующих лиц.
- source_word: εὐπροσωπῆσαι
  choice: произвести хорошее впечатление
  rationale: Передаёт стремление выгодно представить себя и подчеркнуть внешнюю благопристойность.
- source_word: ἐν σαρκί
  choice: по плоти
  rationale: Сохраняет богословски значимый термин Павла и допускает как телесный, так и внешне-религиозный оттенок; пояснение дано в сноске.
- source_word: οὗτοι
  choice: принуждают
  rationale: В русском отдельное «именно они» утяжеляло бы фразу; подлежащее «те, кто» уже ясно выделяет эту группу.
- source_word: ἀναγκάζουσιν
  choice: принуждают
  rationale: Передаёт продолжающееся давление и сильнее нейтрального «убеждают».
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: вас принять обрезание
  rationale: Естественная русская формулировка, сохраняющая конкретный обряд и направленное на адресатов принуждение.
- source_word: μόνον ἵνα
  choice: только для того, чтобы
  rationale: Ясно выражает приписываемую им единственную цель.
- source_word: τῷ σταυρῷ
  choice: за крест
  rationale: Кратко сохраняет возможную связь гонений с верностью вести о кресте; причинное значение остаётся доступным из контекста.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет титульное значение; «Мессия» передаёт его смысл, а не только традиционную транслитерацию.
- source_word: μὴ διώκωνται
  choice: не подвергаться гонениям
  rationale: Естественно передаёт пассивный залог и цель избежать преследования.
theological_decisions:
- issue: Передача Χριστοῦ в выражении τῷ σταυρῷ τοῦ Χριστοῦ
  choice: крест Мессии
  alternative: крест Христа
  rationale: Титульный смысл слова здесь остаётся значимым; «Мессия» раскрывает его, не внося конфессионального толкования.
- issue: Смысл ἐν σαρκί
  choice: по плоти
  alternative: внешне; в том, что касается тела
  rationale: Основной текст сохраняет характерную для Павла многозначность σάρξ, тогда как сноска поясняет наиболее вероятный в данном контексте внешний и телесный аспект.
- issue: Связь дательного τῷ σταυρῷ с διώκωνται
  choice: подвергаться гонениям за крест
  alternative: подвергаться гонениям из-за креста
  rationale: Формулировка «за крест» сохраняет компактность и допускает как причинный оттенок, так и идею преследования за приверженность вести о кресте.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Сохранён термин «плоть», но синтаксис сделан естественным; тире подчёркивает разоблачение истинного мотива.
