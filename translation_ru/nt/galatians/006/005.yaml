  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: ru
  text: Ибо каждый понесёт свою ношу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет нести собственное бремя». Здесь употреблено греческое слово φορτίον («ноша», «груз»), отличное от βάρη («бремена», «тяжести») в стихе 2.'
    reason: Лексическая альтернатива и значимое различие слов в ближайшем контексте.
lexical_decisions:
- source_word: ἕκαστος
  choice: каждый
  rationale: Распределительное местоимение в единственном числе подчёркивает личную ответственность каждого человека.
- source_word: γὰρ
  choice: ибо
  rationale: Пояснительный союз связывает стих с предшествующей мыслью; «ибо» ясно передаёт логическую связь и соответствует dignified современному литературному регистру.
- source_word: τὸ ἴδιον
  choice: свою
  rationale: Возвратно-притяжательное «свою» естественно по-русски передаёт принадлежность ноши самому действующему лицу и сохраняет единственное число.
- source_word: φορτίον
  choice: ношу
  rationale: «Ноша» передаёт конкретный образ груза, который несут, и позволяет сохранить отличие от βάρη («бремена», «тяжести») в стихе 2, не превращая это различие в жёсткое богословское противопоставление.
- source_word: βαστάσει
  choice: понесёт
  rationale: Форма будущего времени передана совершенным будущим «понесёт»; сочетание «понесёт свою ношу» естественно и сохраняет образ несения груза.
theological_decisions:
- issue: Соотношение Галатам 6:5 с 6:2
  choice: Сохранить лексическое различие между «бременами» в стихе 2 и «ношей» здесь, не устраняя напряжение поясняющим толкованием.
  alternative: Передать оба греческих существительных одним словом «бремя» либо прямо истолковать стих как указание на окончательный суд.
  rationale: В ближайшем контексте Павел употребляет разные существительные. Перевод сохраняет мысль как о взаимной помощи, так и о личной ответственности, но не уточняет сверх греческого текста, относится ли будущее время именно к эсхатологическому ответу.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. «Ибо» сохраняет явную пояснительную связь, а «ноша» остаётся понятным обычному читателю словом и поддерживает конкретную метафору.
