base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: ru
  text: Ведь даже сами обрезанные не соблюдают закон, но хотят, чтобы вы были обрезаны, чтобы хвалиться вашей плотью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто подвергается обрезанию». В греческом тексте употреблено субстантивированное причастие настоящего времени; в данном контексте оно характеризует группу как обрезанных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Ведь даже… не
  rationale: «Ведь» передаёт пояснительную связь γάρ с предыдущей мыслью, а сочетание «даже… не» — усиленное отрицание οὐδέ.
- source_word: οἱ περιτεμνόμενοι
  choice: обрезывающиеся
  rationale: Субстантивированное причастие настоящего времени обозначает людей через совершаемое или принимаемое ими обрезание, не превращая выражение в истолковывающую формулировку «сторонники обрезания».
- source_word: αὐτοὶ
  choice: сами
  rationale: 'Сохраняет эмфатическое выделение субъекта: именно они сами не соблюдают закон.'
- source_word: νόμον φυλάσσουσιν
  choice: соблюдают закон
  rationale: Естественное русское выражение для исполнения требований закона; точнее по контексту, чем буквальное «хранят закон».
- source_word: ἀλλὰ θέλουσιν
  choice: но хотят
  rationale: Прямо и естественно передаёт волевое значение θέλουσιν.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: чтобы вы обрезывались
  rationale: Передаёт зависимый инфинитив и сохраняет тот же глагольный образ, что и в обозначении первой группы.
- source_word: ἵνα
  choice: дабы
  rationale: Ясно выражает цель и поддерживает достойный литературный регистр.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: вашей плотью
  rationale: Русский творительный естественно выражает основание или предмет похвальбы, соответствуя греческому ἐν в данном обороте; «плоть» сохраняет буквальную телесную отсылку к обрезанию.
- source_word: καυχήσωνται
  choice: хвалиться
  rationale: Передаёт характерное для Павла значение похвальбы без разговорного оттенка слова «хвастаться».
theological_decisions:
- issue: Значение σάρξ в данном контексте
  choice: буквальная «плоть», то есть тело с физическим знаком обрезания
  alternative: метафорическая «греховная природа»
  rationale: Непосредственный контекст посвящён обрезанию, поэтому речь идёт о телесном знаке, которым эти люди хотят хвалиться; метафорическое толкование здесь не обосновано.
- issue: Смысл причастия περιτεμνόμενοι
  choice: «обрезывающиеся» как описательное обозначение группы
  alternative: «обрезанные» или «сторонники обрезания»
  rationale: Настоящее причастие формально допускает процессуальный либо характеризующий оттенок. Основной текст сохраняет эту форму, а сноска указывает возможную статусную передачу, не сводя выражение к богословски истолкованному названию партии.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис сохраняет аргументативную связь и контраст оригинала; термин «плоть» оставлен из-за его буквального телесного значения в контексте обрезания.
