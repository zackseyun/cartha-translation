  source_fidelity: 'Основной недостаток — «обрезывающиеся»: это слово в современном русском обычно воспринимается как возвратное, процессуальное действие («те, кто обрезают себя») и неудачно передаёт субстантивированное греческое причастие, обозначающее группу «обрезанных / подвергшихся обрезанию». «Обрезанные» точно передаёт характеризующее значение формы в данном контексте и не добавляет идеи, что они лишь сторонники обрезания. Остальные смысловые связи сохранены: γάρ и οὐδέ переданы как «Ведь даже», αὐτοί — «сами», цель ἵνα — «чтобы», а σάρξ остаётся буквальной «плотью».'
  naturalness: '«Даже сами обрезанные» естественно и ясно для современного литературного русского. «Чтобы ... чтобы» не требуется: «но хотят, чтобы вы были обрезаны, чтобы...» — нормативная, прозрачная конструкция. «Хвалиться вашей плотью» сохраняет литературный регистр и естественно выражает предмет похвальбы.'
  terminology: «Закон», «обрезанные» и «плоть» уместны. «Плоть» не следует заменять на «греховную природу», поскольку здесь имеется в виду телесный знак обрезания. Сноска должна отражать реальную лексико-грамматическую альтернативу, а не поддерживать неестественный основной вариант.
