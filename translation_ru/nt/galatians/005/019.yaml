lexical_decisions:
- source_word: φανερὰ
  choice: очевидны
  rationale: Передаёт значение чего-то явного, легко распознаваемого; это естественное и современное русское слово.
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход или контраст. В русском кратком перечислении отдельное «но» могло бы чрезмерно усилить противопоставление, а «теперь» внесло бы отсутствующий временной оттенок; связь сохраняется контекстом.
- source_word: τὰ ἔργα
  choice: дела
  rationale: Сохраняет обычное значение ἔργα и важное противопоставление между «делами плоти» и «плодом Духа» в ближайшем контексте.
- source_word: τῆς σαρκός
  choice: плоти
  rationale: Сохраняет метафору Павла и богословское напряжение противопоставления плоти и Духа, не подменяя исходный образ его истолкованием.
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: Двоеточие естественно вводит последующий перечень и по-русски передаёт функцию выражения «которые суть» без тяжеловесного повтора.
- source_word: πορνεία
  choice: разврат
  rationale: Широкое и понятное обозначение недозволенного сексуального поведения; не сужает значение до супружеской неверности или добрачной связи.
- source_word: ἀκαθαρσία
  choice: нечистота
  rationale: Сохраняет нравственный образ нечистоты и соответствует контексту пороков, не ограничивая слово физической нечистоплотностью.
- source_word: ἀσέλγεια
  choice: распущенность
  rationale: Передаёт бесстыдное, необузданное потворство желаниям, особенно в сексуальном поведении; звучит современно и остаётся достаточно широким.
theological_decisions:
- issue: Передача σάρξ в этическом контексте Павла
  choice: плоть
  alternative: греховная природа
  rationale: «Плоть» сохраняет собственную метафору Павла и связь с противопоставлением Духу. Вариант «греховная природа» объясняет смысл, но одновременно закрепляет одно истолкование многозначного термина, поэтому вынесен в примечание.
