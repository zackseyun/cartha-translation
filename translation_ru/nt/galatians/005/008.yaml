  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: ru
  text: Это убеждение — не от того, кто призывает вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это влияние — не от того, кто призывает вас».'
    reason: 'Лексическая альтернатива: редкое слово πεισμονή может обозначать не только убеждение или убеждённость, но и убеждающее воздействие.'
lexical_decisions:
- source_word: πεισμονὴ
  choice: убеждение
  rationale: Редкое существительное может обозначать убеждение, воздействие убеждения или состояние убеждённости. «Убеждение» сохраняет абстрактность выражения и не уточняет сверх текста, идёт ли речь прежде всего о доводах лжеучителей или о том, что галаты им поддались.
- source_word: ἐκ
  choice: от
  rationale: Предлог указывает на источник или происхождение; конструкция «не от» естественна по-русски и точно передаёт отрицание такого источника.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: того, кто призывает вас
  rationale: Субстантивированное причастие настоящего времени передано личной конструкцией, сохраняющей значение продолжающегося призыва. Хотя в контексте подразумевается Бог, имя не добавлено, поскольку в греческом тексте его здесь нет.
- source_word: οὐκ
  choice: не
  rationale: Прямо передаёт категорическое отрицание.
theological_decisions:
- issue: Кто назван «тем, кто призывает вас»
  choice: Оставить описательное выражение «того, кто призывает вас», не добавляя слово «Бог» и не используя прописную букву как однозначное толкование.
  alternative: «Бога, который призывает вас» или «Того, Кто призывает вас».
  rationale: Контекст Послания к галатам указывает на Бога как наиболее вероятного референта, однако сам стих содержит только причастное выражение. Перевод сохраняет форму и допускает понимание референта из контекста.
translation_notes:
  register: Современный литературный русский язык; краткая именная конструкция с тире сохраняет сжатость и выразительность греческой фразы. Местоименное выражение не перегружено конфессиональной терминологией.
