  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: πεισμονή передано абстрактным «убеждение», οὐκ ἐκ — естественным «не от», а субстантивированное причастие τοῦ καλοῦντος ὑμᾶς — выражением «того, кто призывает вас». Неявный в греческом референт не добавлен.'
  naturalness: Фраза «Это убеждение — не от того, кто призывает вас» нормативна, ясна и естественна для современного литературного русского. Тире уместно в кратком именном сказуемом и сохраняет лаконичность оригинала.
  terminology: «Убеждение» является допустимым эквивалентом редкого πεισμονή и не навязывает более узкого толкования. Сноска с вариантом «влияние» уместно отражает возможный оттенок убеждающего воздействия. Строчное «того, кто» обоснованно не предрешает отождествление с Богом посредством графического оформления.
