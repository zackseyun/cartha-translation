  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: ru
  text: Но если вы кусаете и пожираете друг друга, смотрите, как бы вы не были уничтожены друг другом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: εἰ вводит условие, а δέ обозначает мягкое противопоставление или переход от предшествующего наставления; «но если» естественно передаёт оба значения.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Взаимное местоимение указывает на обоюдные действия внутри общины; русский оборот «друг друга» сохраняет эту взаимность.
- source_word: δάκνετε
  choice: кусаете
  rationale: Глагол буквально означает «кусать». Настоящее время изображает происходящее или характерное действие, а буквальный образ сохраняет резкость предупреждения.
- source_word: κατεσθίετε
  choice: пожираете
  rationale: Усиленный глагол означает «съедать, пожирать»; выбранное слово продолжает образ хищнической жестокости и естественно сочетается с «кусаете».
- source_word: βλέπετε
  choice: берегитесь
  rationale: Повелительная форма призывает к настороженности. «Берегитесь» в современном русском языке кратко и ясно передаёт срочное предостережение.
- source_word: μὴ ... ἀναλωθῆτε
  choice: как бы вам не уничтожить
  rationale: μή с сослагательной формой выражает предостережение от возможного результата. Безлично-инфинитивная русская конструкция естественно передаёт предупреждение, хотя ради идиоматичности переводит греческий пассив взаимной активной конструкцией.
- source_word: ὑπ’ ἀλλήλων
  choice: друг друга
  rationale: В греческом оборот с ὑπό обозначает деятеля при страдательном залоге. В русском взаимная активная конструкция яснее выражает тот же смысл обоюдного уничтожения.
- source_word: ἀναλωθῆτε
  choice: уничтожить
  rationale: Здесь ἀναλίσκω означает довести до полного истощения или гибели. «Уничтожить» передаёт итоговый смысл и не смешивает этот глагол с κατεσθίετε, переведённым как «пожираете».
theological_decisions:
- issue: Образ взаимного насилия внутри христианской общины
  choice: Сохранить буквальные образы «кусаете» и «пожираете», завершив их предупреждением о взаимном уничтожении.
  alternative: 'Передать всё предложение обобщённо: «если вы причиняете друг другу вред и губите друг друга».'
  rationale: Речь Павла намеренно резка и изображает конфликт как хищническое взаимное нападение. Смягчение до общей лексики вреда ослабило бы нравственную настойчивость и образ саморазрушения общины.
translation_notes:
  register: Современный литературный русский язык; тон краткий, серьёзный и предостерегающий. Яркая животная метафора оригинала сохранена без конфессионального истолкования.
