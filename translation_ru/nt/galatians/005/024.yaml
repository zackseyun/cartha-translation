  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: ru
  text: Те же, кто принадлежит Мессии[a], распяли плоть[b] вместе с её страстями и желаниями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христу».'
    reason: alternative_reading
  - marker: b
    text: «Плоть» здесь означает падшую человеческую природу, противящуюся Духу; в некоторых переводах — «греховная природа».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: Те же, кто принадлежит Мессии
  rationale: 'Субстантивированная конструкция с родительным падежом обозначает людей, принадлежащих Мессии. Частица δέ передана как «же»: она естественно выражает мягкое противопоставление или переход, не вводя отсутствующего в греческом тексте временного «теперь».'
- source_word: σάρκα
  choice: плоть
  rationale: Слово употреблено метафорически в противопоставлении Духу, однако «плоть» сохраняет терминологию Павла и не устраняет её богословскую напряжённость пояснительным переводом.
- source_word: ἐσταύρωσαν
  choice: распяли
  rationale: Совершенный вид передаёт решительное совершённое действие; образ распятия сохранён прямо, без ослабления до общего «умертвили».
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: вместе с её страстями и желаниями
  rationale: σύν выражает совместность. В данном нравственном контексте παθήματα означает страсти или аффективные побуждения, а ἐπιθυμίαι — сильные желания; местоимение «её» ясно связывает их с плотью.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христу
  rationale: Здесь обозначена принадлежность Иисусу как Помазаннику; «Мессия» сохраняет титульное значение Χριστός. Вариант «Христу» возможен при понимании слова как закрепившегося именования и дан в сноске.
- issue: Передача σάρξ в этическом противопоставлении у Павла
  choice: плоть
  alternative: греховная природа
  rationale: «Плоть» сохраняет собственную лексику Павла и допускаемую исходным текстом смысловую напряжённость. «Греховная природа» является разъясняющим толкованием и потому вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и общедоступным синтаксисом. «Те же» передаёт мягкий контраст δέ с предыдущим контекстом; термин «плоть» сохранён без конфессионально обусловленного истолкования.
