source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: ru
  text: Ведь вы, братья[a], призваны к свободе; только не превращайте свободу в повод для плоти[b][c], но любовью служите[d] друг другу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово имеет форму мужского рода («братья»), но в этом послании такое обращение относится ко всей верующей общине, включая женщин.
    reason: lexical_alternative
  - marker: b
    text: «Плоть» здесь означает не просто физическое тело, а падшие человеческие побуждения; возможная смысловая передача — «греховная природа».
    reason: alternative_reading
  - marker: c
    text: 'Или: «не превращайте свободу в удобный случай для плоти»; то есть не используйте её как возможность действовать под влиянием направленных на себя греховных желаний.'
    reason: lexical_alternative
  - marker: d
    text: 'Глагол «служите» родствен греческому слову «раб» и несёт более сильный оттенок: отдавайте себя на служение друг другу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: вы
  rationale: Явное местоимение сохраняет лёгкое смысловое выделение адресатов, не усиливая его добавочным «сами».
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно для современного русского языка передаёт пояснительную связь с предыдущим рассуждением.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: к свободе
  rationale: Оборот передаёт свободу как состояние и цель призвания; это также естественное сочетание с глаголом «призвать».
- source_word: ἐκλήθητε
  choice: призваны
  rationale: Страдательная форма сохраняет богословски значимое понятие призвания, не уточняя явно подразумеваемого Призывающего.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняется грамматически мужская форма греческого обращения; охват всей общины пояснён в сноске.
- source_word: μόνον
  choice: только
  rationale: Передаёт ограничение и важную оговорку к утверждению о свободе.
- source_word: μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί
  choice: не обращайте свободу в повод для плоти
  rationale: В греческом обороте глагол подразумевается. «Обращать во что-либо» естественно восполняет эллипсис, а «повод» сохраняет значение отправной точки или возможности для действия.
- source_word: σάρξ
  choice: плоть
  rationale: Сохраняется многозначный и богословски насыщенный термин Павла, а его этический смысл поясняется в сноске.
- source_word: διὰ τῆς ἀγάπης
  choice: любовью
  rationale: 'Творительный падеж естественно по-русски передаёт инструментальное значение διά с родительным: любовь является средством и способом служения.'
- source_word: δουλεύετε
  choice: служите
  rationale: Императив «служите» естественен в данном взаимном призыве; связь глагола с рабским служением отмечена в сноске.
- source_word: ἀλλήλοις
  choice: друг другу
  rationale: Обычный и точный русский эквивалент взаимного местоимения.
theological_decisions:
- issue: Обращение ἀδελφοί к общине, включающей мужчин и женщин
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматическую форму оригинала, а подразумеваемый охват всей верующей общины разъясняется в сноске.
- issue: Значение σάρξ в нравственном контексте Павла
  choice: плоть
  alternative: греховная природа
  rationale: '«Плоть» сохраняет образность и богословскую напряжённость термина: речь не просто о теле, но перевод не сводит многозначное понятие к одному толкованию.'
- issue: Сила рабской метафоры в δουλεύετε
  choice: служите друг другу
  alternative: будьте рабами друг другу
  rationale: «Служите» звучит естественно и точно передаёт повеление, тогда как более буквальное «будьте рабами» может создать в русском тексте лишнее впечатление о социальном статусе; более сильный оттенок отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Синтаксис сохраняет единое движение греческой фразы и её контраст между свободой и добровольным служением. Термины «плоть» и «призваны» сохранены как значимые элементы Павловой речи; неявный греческий глагол восполнен естественным русским оборотом «обращать в повод».
