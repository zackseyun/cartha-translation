  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: ru
  text: 'Я уверен в Господе относительно вас: вы не станете мыслить иначе[a]. А тот, кто смущает вас, не избежит суда, кем бы он ни был[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что вы не примете иной точки зрения». Греческий глагол может обозначать не только мышление вообще, но и определённый образ мыслей, позицию или суждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто бы он ни был» или «неважно, кто он». Оборот в греческом тексте подчёркивает, что личность этого человека не меняет сказанного.'
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: я уверен
  rationale: Перфект πείθω выражает устойчивое состояние уверенности; настоящее «я уверен» естественно передаёт этот смысл по-русски.
- source_word: εἰς ὑμᾶς
  choice: относительно вас
  rationale: При πέποιθα оборот указывает, к кому относится уверенность Павла. Такой перевод точен и не приписывает галатам роль основания этой уверенности.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула, обозначающая сферу или основание уверенности.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: вы не станете мыслить иначе
  rationale: φρονέω может обозначать образ мыслей, позицию или суждение. Формулировка естественно передаёт отрицание иной позиции, не сужая значение до одного конкретного мнения.
- source_word: ὁ ταράσσων ὑμᾶς
  choice: тот, кто вносит среди вас смуту
  rationale: ταράσσω означает тревожить, смущать, приводить в расстройство. В данном общинном контексте «вносит среди вас смуту» ясно выражает продолжающееся пагубное воздействие.
- source_word: βαστάσει
  choice: понесёт
  rationale: Сохраняется образ несения возложенного бремени или последствия.
- source_word: τὸ κρίμα
  choice: осуждение
  rationale: κρίμα может обозначать судебное решение, осуждение или его последствие. «Осуждение» сохраняет серьёзность предупреждения, не уточняя вид или окончательный характер наказания.
- source_word: ὅστις ἐὰν ᾖ
  choice: кем бы он ни был
  rationale: Неопределённо-уступительная конструкция подчёркивает, что личность или положение возмутителя ничего не меняют.
theological_decisions:
- issue: Характер уверенности Павла в отношении галатов
  choice: Уверенность Павла касается их будущего образа мыслей и укоренена в Господе.
  alternative: Безусловная гарантия стойкости всех галатов либо всего лишь человеческий оптимизм Павла.
  rationale: Текст одновременно содержит личную уверенность Павла, её основание «в Господе» и ожидание будущей позиции галатов; перевод не устраняет это напряжение.
- issue: Смысл τὸ κρίμα
  choice: Осуждение, которое понесёт возмутитель, без уточнения его конкретной формы.
  alternative: Непременно вечное осуждение либо только церковное взыскание или общественные последствия.
  rationale: Сам стих не определяет форму и окончательный характер суда, поэтому перевод не конкретизирует их.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. «Относительно вас» слегка формально, но точно разграничивает основание уверенности («в Господе») и тех, кого она касается. Все примечания отмечены в основном тексте.
