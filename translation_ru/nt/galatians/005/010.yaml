  - severity: low
    issue: ὁ ταράσσων ὑμᾶς передано как «кто вносит среди вас смуту».
    rationale: Это допустимо контекстуально, но греческое «вас» непосредственно обозначает людей, которых тревожат/смущают. «Кто смущает вас» точнее без утраты естественности.
