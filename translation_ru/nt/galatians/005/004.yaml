base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: ru
  text: Вы, которые пытаетесь оправдаться законом[a], отделены от Христа[b]; вы отпали от благодати.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «оправдываетесь на основании закона» или «оправдываетесь законом». Греческая форма настоящего времени в страдательном залоге допускает такую передачу; основной текст выражает подразумеваемую в контексте попытку получить оправдание на основании закона.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «лишены связи со Христом», «отсечены от Христа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε
  choice: отделены
  rationale: В сочетании с ἀπὸ Χριστοῦ глагол обозначает прекращение связи, отделение от Христа. «Отделены» сохраняет резкость высказывания, но не привносит церковно-правового оттенка слова «отлучены» и не усиливает образ до безусловной окончательности, возможной в «отсечены».
- source_word: ἀπὸ Χριστοῦ
  choice: от Христа
  rationale: Предлог ἀπό выражает отделение. В современном русском библейском и литературном употреблении Χριστός естественно передаётся как «Христос»; это сохраняет и имяобразное употребление, и мессианский титул.
- source_word: οἵτινες
  choice: Вы, кто
  rationale: Оборот выделяет среди адресатов тех, к кому относится предостережение, и одновременно сохраняет прямое обращение второго лица.
- source_word: ἐν νόμῳ
  choice: законом
  rationale: Оборот указывает на основание или средство искомого оправдания. Творительный падеж естественно передаёт эту связь без добавления отсутствующего в греческом тексте определённого артикля.
- source_word: δικαιοῦσθε
  choice: пытается оправдаться
  rationale: Форма настоящего времени в страдательном залоге буквально допускает «оправдываетесь», однако в контексте Павел говорит о притязании на оправдание на основании закона, а не подтверждает, что оно действительно достигнуто. Конативная передача делает аргумент ясным; более формальная возможность отмечена в сноске.
- source_word: τῆς χάριτος
  choice: от благодати
  rationale: Родительный падеж при ἐκπίπτω обозначает то, от чего отпадают. Русское «отпасть от благодати» точно и идиоматично передаёт конструкцию.
- source_word: ἐξεπέσατε
  choice: отпали
  rationale: Аорист выражает решительный результат, а глагол сохраняет метафору падения или утраты положения по отношению к благодати. «Отпали» передаёт это кратко и без дополнительного догматического толкования.
theological_decisions:
- issue: Следует ли переводом решать спор о потере спасения или лишь об отказе от принципа благодати
  choice: 'Сохранено прямое предостережение: «отделены от Христа; вы отпали от благодати».'
  alternative: Ослабить до «отдалились от Христа» либо истолковать как «оставили путь благодати».
  rationale: Греческий текст говорит резко и описывает отношение и ко Христу, и к благодати, но сам по себе не формулирует систематического вывода о природе или окончательности отпадения. Перевод сохраняет эту богословскую напряжённость.
- issue: Означает ли δικαιοῦσθε действительное оправдание законом или стремление получить его
  choice: «пытается оправдаться законом»
  alternative: «оправдывается законом» или «оправдываетесь законом»
  rationale: Контекст послания не позволяет понимать фразу как утверждение успешного оправдания законом. Основной текст отражает конативный смысл настоящего времени, а формально более близкая передача сохранена в сноске как реальная грамматическая возможность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-серьёзным строем. Сохранены параллельность двух утверждений и резкость предостережения; избегнуты архаизмы, конфессионально окрашенное «отлучены» и догматически уточняющие добавления.
