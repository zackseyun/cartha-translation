  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: ru
  text: Малая закваска заквашивает всё тесто[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Немного закваски заквашивает весь замес».'
    reason: 'Лексико-стилистический вариант: μικρὰ можно передать как «немного», а φύραμα — как «замес», подчёркивая массу замешанного теста.'
lexical_decisions:
- source_word: μικρὰ
  choice: малая
  rationale: Прилагательное указывает на небольшое количество закваски. «Малая» сохраняет краткую, пословичную форму исходного высказывания; смысл — даже небольшое количество оказывает широкое действие.
- source_word: ζύμη
  choice: закваска
  rationale: «Закваска» точно передаёт древний ферментирующий агент и сохраняет библейскую образность лучше, чем современное и несколько более узкое «дрожжи».
- source_word: ὅλον
  choice: всё
  rationale: Передаёт полноту охвата и естественно согласуется в русском языке со словом «тесто».
- source_word: φύραμα
  choice: тесто
  rationale: Слово обозначает замешанную массу теста. «Тесто» ясно и естественно передаёт конкретный образ, тогда как «ком» в современном русском звучал бы неясно.
- source_word: ζυμοῖ
  choice: заквашивает
  rationale: Прямо передаёт действие закваски и сохраняет словесную связь «закваска — заквашивает», а также лаконичность греческой пословицы.
theological_decisions:
- issue: Метафорический смысл пословицы
  choice: Сохранить конкретный образ закваски и теста, не поясняя его применение в основном тексте.
  alternative: Немного ложного учения распространяется по всей общине.
  rationale: В данном стихе Павел приводит пословицу, а не формулирует её истолкование. Сохранение образа не устраняет возможные оттенки его применения и не вносит контекстуальное объяснение непосредственно в перевод.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и достоинства пословичного изречения. Формула «малая закваска» поддерживает библейскую межтекстовую узнаваемость, оставаясь понятной современному читателю.
