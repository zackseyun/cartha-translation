  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: ru
  text: О, если бы те, кто приводит вас в смятение[b], даже изувечили себя[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отсекли бы себя». В контексте Павел, вероятно, имеет в виду, чтобы поборники обрезания пошли ещё дальше и оскопили себя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возмущает вас», «сеет среди вас смуту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: О, если бы
  rationale: Частица выражает сильное желание; эта русская конструкция естественно передаёт его эмоциональную и нереальную направленность.
- source_word: καὶ
  choice: и вовсе
  rationale: 'В данном контексте καί усиливает резкость пожелания: речь идёт о том, чтобы не ограничиваться обрезанием, а пойти ещё дальше.'
- source_word: ἀποκόψονται
  choice: изувечили себя
  rationale: Глагол буквально связан с отсечением. На фоне спора об обрезании он, вероятнее всего, содержит резкую игру слов и намёк на самооскопление; «изувечили себя» сохраняет телесный смысл, не делая спорное уточнение единственно возможным прямо в тексте.
- source_word: οἱ ἀναστατοῦντες
  choice: те, кто приводит вас в смятение
  rationale: Причастие обозначает людей, вызывающих беспокойство, расстройство и смуту; формулировка передаёт их разрушительное воздействие на галатов.
- source_word: ὑμᾶς
  choice: вас
  rationale: Местоимение второго лица множественного числа относится ко всей общине галатов.
theological_decisions:
- issue: Смысл резкого пожелания Павла в контексте обрезания
  choice: Павел с язвительной гиперболой желает, чтобы сторонники обрезания пошли ещё дальше и изувечили себя, вероятно — оскопили себя.
  alternative: Павел желает, чтобы они отсекли себя от общины, либо говорит об их устранении в общем смысле.
  rationale: Непосредственный контекст посвящён обрезанию, поэтому телесная игра слов наиболее обоснована. Вместе с тем основной текст не сужает значение до явного «оскопили», а сноска сохраняет буквальную и контекстуальную альтернативы.
translation_notes:
  register: Современный литературный русский язык с сохранением эмоциональной резкости и язвительной силы оригинала. Восклицательная конструкция передаёт напряжённое пожелание, а сноска поясняет телесную игру слов, не устраняя возможную двусмысленность.
