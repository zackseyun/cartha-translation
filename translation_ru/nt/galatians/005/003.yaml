id: GAL.5.3
reference: Galatians 5:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: ru
  text: 'И ещё раз свидетельствую каждому человеку, принимающему обрезание: он обязан исполнить весь Закон[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергающемуся обрезанию» или «позволяющему себя обрезать». Греческое причастие допускает эти близкие варианты; в контексте речь идёт о человеке, принимающем обрезание в рамках данного спора.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «он должник, обязанный исполнить весь Закон». Речь идёт не о денежном долге, а об обязательстве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: свидетельствую
  rationale: Передаёт торжественное личное заверение Павла, сохраняя формальную силу глагола и не усиливая его до прямого «предупреждаю».
- source_word: δὲ πάλιν
  choice: И ещё раз
  rationale: δέ мягко связывает фразу с предыдущим стихом, а πάλιν выражает повторное, подчёркнутое утверждение.
- source_word: παντὶ ἀνθρώπῳ
  choice: каждому человеку
  rationale: В данном контексте ἄνθρωπος имеет обобщённое значение; по-русски «каждому человеку» естественно передаёт единственное число и распределительный смысл.
- source_word: περιτεμνομένῳ
  choice: принимающему обрезание
  rationale: Настоящее причастие в контексте спора указывает на человека, подвергающегося обрезанию; формулировка не утверждает прямо ни его личной инициативы, ни конкретной мотивации.
- source_word: ὀφειλέτης ἐστὶν
  choice: он обязан
  rationale: Греческое существительное буквально обозначает должника, то есть человека, находящегося под обязательством. Русское «обязан» ясно передаёт смысл без возможной ассоциации только с денежным долгом.
- source_word: ὅλον τὸν νόμον
  choice: весь Закон
  rationale: Сохраняет акцент на полноте Закона. Заглавная буква обозначает здесь Моисеев Закон как определённую религиозно-правовую реальность.
- source_word: ποιῆσαι
  choice: исполнить
  rationale: При сочетании с νόμος глагол означает выполнить требования Закона. «Исполнить» естественно и точно передаёт требуемое послушание, не добавляя идеи успешного завершения всей жизни.
theological_decisions:
- issue: К кому относится утверждение об обрезании и обязательстве перед Законом
  choice: К человеку, принимающему обрезание в обсуждаемой Павлом ситуации, что влечёт обязанность исполнить весь Закон.
  alternative: К любому обрезанному мужчине вообще, в том числе обрезанному в младенчестве.
  rationale: Контекст Гал 5:2–3 обращён к тем, кто рассматривает обрезание как религиозно необходимый шаг. Однако мотив не выражен в самом причастии, поэтому перевод его прямо не добавляет.
- issue: Образ должника в ὀφειλέτης
  choice: Передать смысл обязательства в основном тексте словом «обязан», а буквальный образ отметить в сноске.
  alternative: Сохранить в тексте буквальное «он должник».
  rationale: Образ долга реален, но без пояснения современный читатель может понять его как финансовый долг. Сноска сохраняет формальную особенность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апостольским тоном. Синтаксис близок к греческому, но естественен по-русски. «Закон» написан с заглавной буквы как обозначение Моисеева Закона; двоеточие ясно вводит содержание свидетельства.
