lexical_decisions:
- source_word: εἰδωλολατρία
  choice: идолопоклонство
  rationale: Точное и естественное обозначение поклонения идолам; сохраняет религиозно-нравственный смысл.
- source_word: φαρμακεία
  choice: колдовство
  rationale: В перечне пороков слово обозначает оккультные действия, в том числе связанные с зельями и чарами, а не врачевание вообще.
- source_word: ἔχθραι
  choice: вражда
  rationale: Передаёт устойчивые или проявляемые враждебные отношения; собирательное единственное число естественно для русского перечня.
- source_word: ἔρις
  choice: распри
  rationale: Передаёт конфликтность, ссоры и противоборство; множественное число хорошо соответствует характеру перечня.
- source_word: ζῆλος
  choice: ревность
  rationale: В отрицательном контексте означает ревнивое соперничество; выбор сохраняет смысловую связь с более широким значением греческого слова, не подменяя его завистью.
- source_word: θυμοί
  choice: вспышки гнева
  rationale: Множественное число указывает на повторяющиеся бурные проявления гнева, что яснее выражено словосочетанием, чем отвлечённым «гнев».
- source_word: ἐριθεῖαι
  choice: своекорыстие
  rationale: Передаёт стремление к собственной выгоде и продвижению через соперничество; уместно как название порочного мотива и поведения.
- source_word: διχοστασίαι
  choice: раздоры
  rationale: Обозначает разделение людей на противостоящие стороны и естественно звучит в русском перечне общественных пороков.
- source_word: αἱρέσεις
  choice: группировки
  rationale: Передаёт первичный здесь смысл обособившихся партий и фракций, не внося более позднего технического значения «ереси».
theological_decisions:
- issue: Передача αἱρέσεις
  choice: группировки
  alternative: секты; ереси
  rationale: В ближайшем контексте перечисляются пороки, разрушающие отношения и единство общины. Поэтому предпочтителен социальный смысл — образование противоборствующих партий; «ереси» могло бы анахронично внести позднейшее догматическое употребление.
translation_notes:
  register: Современный литературный русский язык; краткий ритмичный перечень, продолжающий предложение из предыдущего стиха. Термины понятны широкому читателю, но сохраняют смысловые различия оригинала. Запятая в конце показывает продолжение перечня в следующем стихе.
