  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: ru
  text: Если мы живём Духом[a], будем и поступать в согласии с Духом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если мы живём в Духе, будем и идти в ногу с Духом».'
    reason: Передаёт возможное локативно-сферическое понимание дательного πνεύματι и более образный оттенок στοιχῶμεν — «держаться строя, идти в ногу».
lexical_decisions:
- source_word: εἰ
  choice: Если
  rationale: Сохраняет условную форму греческого текста и увещательную логику Павла; контекстуальное «раз» возможно, но сильнее истолковывает условие.
- source_word: ζῶμεν
  choice: мы живём
  rationale: Естественно передаёт настоящее время ζάω; в контексте речь идёт о жизни, источником которой является Дух.
- source_word: πνεύματι
  choice: Духом
  rationale: Творительный падеж естественно передаёт дательный со значением источника или средства. Контраст плоти и Духа в Гал 5 указывает на Святого Духа; написание с прописной буквы отражает этот контекст.
- source_word: καὶ
  choice: и
  rationale: 'В конструкции «то будем и...» частица передаёт присоединительно-усилительное значение: образ жизни должен соответствовать источнику жизни.'
- source_word: στοιχῶμεν
  choice: будем поступать в согласии с
  rationale: Увещательный конъюнктив передан русской конструкцией первого лица множественного числа. Выражение сохраняет специфический смысл στοιχέω — держаться установленного направления, сообразовывать свои шаги, — не смешивая его с περιπατέω из Гал 5:16.
theological_decisions:
- issue: К кому относится πνεύματι
  choice: к Святому Духу
  alternative: к человеческому духу
  rationale: Непосредственный контраст между плотью и Духом в Гал 5:16–24 убедительно указывает на Святого Духа; прописная буква выражает этот контекстуальный вывод.
- issue: Связь жизни и поведения
  choice: поведение должно соответствовать жизни, данной Духом
  alternative: общее призывание «ходить Духом» без подчёркнутого соответствия
  rationale: Повтор πνεύματι и значение στοιχέω связывают источник жизни с упорядоченным, согласованным с Духом поведением.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Формулировка «поступать в согласии с Духом» естественна для нравственного увещания и точнее передаёт στοιχέω, чем обычное «ходить», тогда как образ «идти в ногу» сохранён в сноске.
