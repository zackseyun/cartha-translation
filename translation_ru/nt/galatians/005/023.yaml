  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: ru
  text: кротость, самообладание; против такого нет закона[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против таких людей нет закона». Греческая форма может относиться и к людям, хотя в данном контексте вероятнее указание на перечисленные качества.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможное понимание: «против такого нет Закона», то есть Моисеева закона. Однако греческое слово стоит без артикля и может иметь более общее значение.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: πραΰτης
  choice: кротость
  rationale: Слово обозначает мягкость, смиренную незлобивость и отсутствие резкости. «Кротость» — устоявшееся и по-прежнему понятное обозначение этой нравственной черты; оно точнее, чем более общее «мягкость».
- source_word: ἐγκράτεια
  choice: самообладание
  rationale: Речь идёт о власти над собственными желаниями и побуждениями. «Самообладание» естественно передаёт широкий этический смысл, тогда как «воздержание» может быть понято слишком узко.
- source_word: κατὰ τῶν τοιούτων
  choice: против такого
  rationale: Форма τοιούτων допускает отнесение как к перечисленным качествам, так и к проявляющим их людям. В контексте наиболее вероятна отсылка к перечисленному плоду Духа; русское «против такого» кратко и естественно указывает на всё перечисленное, не добавляя отсутствующего в греческом существительного.
- source_word: νόμος
  choice: закон
  rationale: Существительное употреблено без артикля. Строчное «закон» сохраняет обобщённую, афористическую силу высказывания и не исключает связи с Моисеевым законом.
theological_decisions:
- issue: К чему относится выражение κατὰ τῶν τοιούτων
  choice: 'К перечисленным качествам: «против такого»'
  alternative: 'К людям, проявляющим эти качества: «против таких людей»'
  rationale: Ближайший контекст — перечень плода Духа, поэтому вероятнее отсылка к названным качествам. Однако грамматическая форма допускает личное значение, которое отмечено в сноске.
- issue: Объём значения νόμος
  choice: Обобщённое «закон»
  alternative: «Закон» как специальное указание на Моисеев закон
  rationale: 'В Послании к галатам Моисеев закон составляет важный фон, однако отсутствие артикля позволяет услышать более широкое утверждение: никакой закон не направлен против таких качеств. Перевод не устраняет эту богословскую многозначность.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным завершением перечня. «Кротость» сохраняет достоинство библейского регистра, а «самообладание» звучит современно и передаёт широкий смысл контроля над побуждениями.
