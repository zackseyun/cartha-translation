id: GAL.5.2
reference: Galatians 5:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: ru
  text: 'Смотрите: я, Павел, говорю вам, что если вы примете обрезание[a], Мессия[b] не принесёт вам никакой пользы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если вы подвергнетесь обрезанию»; возможно также: «если вы позволите себя обрезать».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «Христос»; здесь переведено как «Мессия», поскольку Χριστός употреблено как титул.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: 'Смотрите:'
  rationale: Форма служит настойчивым призывом обратить внимание. «Смотрите» естественно передаёт риторическую силу предупреждения, не прибегая к архаичному «вот» в значении частицы внимания.
- source_word: ἐγὼ Παῦλος
  choice: я, Павел,
  rationale: Сохранены и явное местоимение, и имя, чтобы передать подчёркнутое личное заявление Павла.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямое и близкое к греческому выражение, естественное в современном русском языке.
- source_word: ἐὰν περιτέμνησθε
  choice: если вы примете обрезание[a]
  rationale: Передаёт совершение обряда над адресатами и в данном контексте — их согласие принять его. В сноске сохранены более формально близкие варианты пассивной конструкции.
- source_word: Χριστὸς
  choice: Мессия[b]
  rationale: Здесь Χριστός сохраняет смысл титула Иисуса; «Мессия» передаёт этот титульный смысл, а традиционное соответствие отмечено в сноске.
- source_word: οὐδὲν ὠφελήσει
  choice: не принесёт вам никакой пользы
  rationale: Естественно и ясно выражает полное отсутствие пользы, сохраняя категоричность будущего утверждения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В предупреждении о значении обрезания титульный смысл остаётся существенным. Сноска сохраняет знакомое традиционное соответствие и указывает греческую форму.
- issue: Смысл предупреждения об обрезании
  choice: Формулировка говорит о принятии обрезания в рамках обсуждаемого Павлом требования, не расширяя утверждение до безусловного осуждения обряда во всех обстоятельствах.
  alternative: Понимать слова как осуждение любого обрезания независимо от цели и контекста.
  rationale: Сам стих сформулирован резко, и эта резкость сохранена; при этом перевод не добавляет уточнений, которые разрешали бы богословское напряжение или распространяли тезис за пределы аргумента послания.
translation_notes:
  register: Современный литературный русский язык с прямой, торжественно-наставительной интонацией. Порядок «я, Павел» и категоричное «никакой пользы» сохраняют риторический акцент исходного текста.
