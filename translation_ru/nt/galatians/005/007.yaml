  footnotes:
  - marker: a
    text: 'Или: «Кто помешал вам быть убеждёнными истиной?» Греческий глагол может означать как «повиноваться», так и «быть убеждённым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Вы бежали
  rationale: Имперфект обозначает продолжавшееся в прошлом действие; буквальный образ бега сохраняет спортивную метафору Павла без добавления отсутствующего в греческом тексте слова «поприще».
- source_word: καλῶς
  choice: хорошо
  rationale: Наречие характеризует бег и естественно передаёт мысль о правильном, успешном продвижении.
- source_word: τίς
  choice: Кто
  rationale: Вопросительное местоимение указывает здесь на того, кто воспрепятствовал галатам.
- source_word: ἐνέκοψεν
  choice: помешал
  rationale: Глагол означает воспрепятствовать, преградить путь; выбранное слово ясно передаёт смысл, а образ помехи бегущему поддерживается контекстом.
- source_word: τῇ ἀληθείᾳ
  choice: истине
  rationale: Дательный падеж связан с πείθεσθαι; определённость понятия в русском языке естественно выражается без отдельного артикля.
- source_word: μὴ πείθεσθαι
  choice: повиноваться
  rationale: В данном контексте πείθεσθαι может обозначать послушный отклик на истину; при этом возможное значение «убеждаться, поддаваться убеждению» сохранено в сноске.
theological_decisions:
- issue: Значение πείθεσθαι при τῇ ἀληθείᾳ
  choice: повиноваться истине
  alternative: быть убеждёнными истиной / внимать истине
  rationale: Контекст говорит не только о признании истины, но и о практическом отклике на благую весть. Основной вариант сохраняет аспект послушания, а смысловую неоднозначность глагола не устраняет, но отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и риторически энергичная. Спортивная метафора передана прямо, без поясняющих добавлений. Маркер сноски поставлен после всего вопроса, к которому относится лексическая альтернатива.
