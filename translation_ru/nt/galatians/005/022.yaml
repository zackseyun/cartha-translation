id: GAL.5.22
reference: Galatians 5:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: ru
  text: Плод же Духа — любовь, радость, мир, долготерпение, доброта, благость, вера[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность». Греческое слово πίστις может означать веру, доверие или верность; в этом перечне качеств значение «верность» также вполне возможно.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт противопоставление предшествующему перечню дел плоти, сохраняя естественный для русского порядка слов переход.
- source_word: καρπὸς
  choice: плод
  rationale: 'Сохраняет метафору и единственное число: перечисленные качества представлены как единый плод.'
- source_word: τοῦ πνεύματός
  choice: Духа
  rationale: В ближайшем контексте Послания к галатам речь идёт о Святом Духе, противопоставленном плоти.
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямой, современный и широкий эквивалент греческого существительного.
- source_word: χαρά
  choice: радость
  rationale: Обычный и точный русский эквивалент, естественный в перечне качеств.
- source_word: εἰρήνη
  choice: мир
  rationale: Сохраняет широту значения, не ограничивая его только внутренним спокойствием или отношениями между людьми.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Точно выражает длительную выдержку по отношению к людям и сохраняет отличие от более общего терпения; слово остаётся понятным в современном литературном русском.
- source_word: χρηστότης
  choice: доброта
  rationale: Естественно передаёт благожелательное и доброе отношение к другим.
- source_word: ἀγαθωσύνη
  choice: благость
  rationale: Позволяет отличить это широкое нравственное качество от предшествующей χρηστότης, переведённой как «доброта».
- source_word: πίστις
  choice: вера
  rationale: Основное и традиционное соответствие πίστις; контекст перечня качеств допускает также значение «верность», которое сохранено в сноске.
theological_decisions:
- issue: К кому относится πνεῦμα
  choice: Святой Дух
  alternative: человеческий дух
  rationale: Непосредственное противопоставление плоти и Духа в Гал 5, а также общий ход рассуждения Павла указывают на действие Святого Духа.
- issue: Значение πίστις в перечне качеств
  choice: вера
  alternative: верность
  rationale: Греческое слово может обозначать веру, доверие или верность. Основной текст сохраняет широкое и традиционное «вера», не исключая контекстуально вероятного значения «верность».
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Синтаксис сохраняет краткость греческого перечня; единственное число «плод» и смысловая неоднозначность πίστις удержаны.
