  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: ru
  text: 'Но я говорю: поступайте по Духу — и вы ни в коем случае не исполните желания плоти.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «греховной природы». Греческое слово буквально означает «плоть»; у Павла оно может обозначать падшую человеческую природу в её противостоянии Духу.'
    reason: Альтернативная смысловая передача слова σάρξ.
lexical_decisions:
- source_word: Λέγω δέ
  choice: Но я говорю
  rationale: δέ здесь вводит мягкий риторический поворот; «но» сохраняет связь и умеренное противопоставление предыдущему наставлению.
- source_word: πνεύματι
  choice: по Духу
  rationale: Дательный падеж может обозначать руководство, средство или сферу действия. «Поступайте по Духу» естественно по-русски передаёт жизнь под водительством Святого Духа, не устраняя полностью многогранность конструкции.
- source_word: περιπατεῖτε
  choice: поступайте
  rationale: Буквально глагол означает «ходите», но здесь это устойчивый образ образа жизни и поведения. «Поступайте» ясно и естественно передаёт смысл современному читателю.
- source_word: ἐπιθυμίαν
  choice: желания
  rationale: Нейтральное по форме «желание» сохраняет широту греческого слова; отрицательный смысл определяется дополнением «плоти».
- source_word: σαρκὸς
  choice: плоти
  rationale: Сохранён Павлов термин «плоть», чтобы не сводить его богословски напряжённое значение к одному толкованию вроде «греховной природы».
- source_word: οὐ μὴ τελέσητε
  choice: ни в коем случае не исполните
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание. Формулировка передаёт эту эмфазу, а «исполните» означает осуществление желания на деле.
theological_decisions:
- issue: Кого обозначает πνεύματι
  choice: Святого Духа
  alternative: человеческий дух или общий духовный принцип
  rationale: Непосредственный контекст Гал 5 противопоставляет Дух плоти и указывает на действие Святого Духа. Прописная буква отражает этот контекстуальный вывод.
- issue: Значение σάρξ
  choice: плоть
  alternative: греховная природа
  rationale: Хотя здесь слово имеет нравственно отрицательный смысл, буквальный термин сохраняет Павлову категорию и не устраняет её смысловую и богословскую напряжённость.
- issue: Связь повеления и усиленного отрицания
  choice: повеление следовать Духу сопровождается решительным отрицанием осуществления желания плоти
  alternative: абсолютное обещание без связи с предшествующим повелением
  rationale: Союз καί связывает обе части высказывания; перевод сохраняет обусловленную ходом фразы связь, не добавляя явного «если».
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Поступайте» предпочтено буквальному «ходите» ради естественности; термин «плоть» сохранён как значимый Павлов образ. Тире подчёркивает тесную связь наставления и результата.
