  verdict: approve
  source_fidelity: Текст точно передаёт греческое εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον. «Но» уместно отражает δέ; «если вас ведёт Дух» сохраняет условность, настоящее время и пассивную направленность ἄγεσθε; «вы не под законом» точно и лаконично передаёт οὐκ ἐστὲ ὑπὸ νόμον.
  naturalness: 'Фраза звучит естественно на современном литературном русском: «Но если вас ведёт Дух, то вы не под законом». Частица «то» нормативна и помогает ясно оформить условную конструкцию, не добавляя нового смыслового компонента.'
  terminology: Прописное «Дух» обоснованно передаёт контекстуально определённый референт πνεύματι, не добавляя слова «Святой», отсутствующего в оригинале. «Под законом» сохраняет намеренно краткий павловский оборот и не навязывает конфессионального истолкования. Примечания корректно поясняют пассивную форму и смысл образа власти/юрисдикции.
