id: GAL.5.18
reference: Galatians 5:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: ru
  text: Но если вас ведёт Дух[a], то вы не под законом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если вы ведомы Духом». Греческая форма может подчёркивать продолжающееся действие: «если Дух продолжает вести вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «под законом», то есть под его властью или юрисдикцией; ср. Гал 5:23.'
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: если
  rationale: Передаёт условный союз без усиления или ослабления условия.
- source_word: δὲ
  choice: но
  rationale: Выражает мягкое противопоставление предшествующему рассуждению о плоти и Духе.
- source_word: πνεύματι
  choice: Дух
  rationale: По ближайшему контексту Гал 5:16–25 речь идёт о Божьем Духе; творительный падеж естественно обозначает действующее лицо при пассивном глаголе.
- source_word: ἄγεσθε
  choice: вас ведёт
  rationale: 'Естественная русская конструкция сохраняет пассивный смысл греческой формы: верующие являются теми, кого ведёт Дух. Настоящее время допускает продолжающееся действие.'
- source_word: οὐκ ἐστὲ
  choice: вы не
  rationale: В сочетании с предложной конструкцией по-русски естественно передаётся без отдельной связки настоящего времени.
- source_word: ὑπὸ νόμον
  choice: под законом
  rationale: Сохраняет краткую метафору подчинения закону как власти или режиму, не разворачивая её в толкование.
theological_decisions:
- issue: Референт πνεύματι
  choice: Святой Дух, переданный как «Дух» с прописной буквы
  alternative: человеческий дух
  rationale: Последовательное противопоставление плоти и Духа в Гал 5:16–25 указывает на Божьего Духа; слово «Святой» не добавлено, поскольку его нет в греческом тексте.
- issue: Смысл ὑπὸ νόμον
  choice: «под законом» — в сфере его власти или юрисдикции
  alternative: под законом вообще, безотносительно к Моисееву закону
  rationale: Контекст Послания к галатам указывает прежде всего на Моисеев закон как управляющий порядок, однако основной текст сохраняет лаконичность и напряжение исходной формулировки.
translation_notes:
  register: Современный литературный русский язык. Формулировка краткая и ритмичная; «вас ведёт Дух» понятнее обычному читателю, чем более книжное «вы ведомы Духом», которое сохранено в примечании. Строчная буква в слове «законом» не превращает термин в название и соответствует обычной русской практике.
