lexical_decisions:
- source_word: φθόνοι
  choice: зависть
  rationale: Передаёт недоброжелательное чувство, вызванное чужим благополучием; в русском языке естественно употребляется здесь как собирательное обозначение порока, несмотря на множественное число греческого слова.
- source_word: μέθαι
  choice: пьянство
  rationale: Ясное современное обозначение опьянения и пьяных излишеств; форма единственного числа естественна для русского перечня пороков.
- source_word: κῶμοι
  choice: разгульные пиршества[a]
  rationale: Передаёт шумные, невоздержанные празднества, нередко связанные с пьянством, не сужая значение до сексуальных оргий.
- source_word: τὰ ὅμοια τούτοις
  choice: и тому подобное
  rationale: 'Естественно сохраняет открытый характер перечня: названными пороками он не исчерпывается.'
- source_word: ἃ προλέγω ὑμῖν
  choice: Я предупреждаю вас об этом
  rationale: В нравственном увещании προλέγω имеет силу заблаговременного предостережения; отдельное предложение делает длинную греческую конструкцию ясной по-русски.
- source_word: καθὼς προεῖπον
  choice: как уже предупреждал
  rationale: Сохраняет отсылку к прежнему предостережению и лексическую связь с предыдущим глаголом.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: те, кто предаётся подобным делам
  rationale: Русское выражение естественно указывает на характерную практику, а не обязательно на единичный проступок, не вводя чрезмерно категоричного уточнения вроде «постоянно».
- source_word: βασιλείαν θεοῦ
  choice: Царства Бога
  rationale: Прямо передаёт родительный θεοῦ и сохраняет устойчивый новозаветный богословский образ царства.
- source_word: οὐ κληρονομήσουσιν
  choice: не унаследуют
  rationale: Сохраняет прямой образ наследования и будущую, эсхатологическую направленность предупреждения.
theological_decisions:
- issue: Относится ли предупреждение к единичным поступкам или к устойчивому образу поведения
  choice: «те, кто предаётся подобным делам»
  alternative: «те, кто делает подобное»
  rationale: Настоящее причастие πράσσοντες в контексте перечня пороков естественно обозначает характерное поведение. Выбранная формулировка сохраняет серьёзность предупреждения, но не утверждает, что речь непременно идёт о каждом единичном падении.
translation_notes:
  register: Современный литературный русский язык с ясным, серьёзным и общедоступным звучанием. Длинная греческая конструкция разделена на два предложения ради естественности; повтор «предупреждаю — предупреждал» сохранён. Маркер сноски поставлен при κῶμοι, к которому относится пояснение.
