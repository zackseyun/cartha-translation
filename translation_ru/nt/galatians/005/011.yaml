source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: ru
  text: Я же, братья[a], если всё ещё проповедую обрезание, почему же меня всё ещё преследуют? Тогда устранено то, что делает крест камнем преткновения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово «братья» может быть обращено ко всей общине, включая женщин.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «тогда устранено преткновение креста».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямое соответствие форме мужского рода во множественном числе; в обращении слово может охватывать всю общину, включая женщин, что пояснено в сноске.
- source_word: περιτομήν
  choice: обрезание
  rationale: Обычное и точное обозначение обрезания; в контексте Послания к галатам подразумевается также его проповедь как религиозного требования.
- source_word: ἔτι
  choice: всё ещё
  rationale: Повторено в обеих частях фразы, как и в греческом тексте, и передаёт продолжающееся действие.
- source_word: κηρύσσω
  choice: проповедую
  rationale: Естественно передаёт публичное возвещение, выраженное глаголом κηρύσσω.
- source_word: διώκομαι
  choice: меня преследуют
  rationale: Естественная русская активная конструкция с сохранением пассивной роли Павла как объекта гонений.
- source_word: ἄρα
  choice: тогда
  rationale: Передаёт вывод, следующий из условного предположения.
- source_word: κατήργηται
  choice: больше не служит
  rationale: 'Передаёт результат совершённого устранения действенности: при таком предположении крест перестал бы быть причиной преткновения.'
- source_word: σκάνδαλον
  choice: камень преткновения
  rationale: Сохраняет образ препятствия, вызывающего падение или неприятие, и в современном русском яснее, чем многозначное «соблазн».
- source_word: σταυροῦ
  choice: крест
  rationale: Стандартное обозначение креста в богословском контексте Павла.
theological_decisions:
- issue: Обращение ἀδελφοί к смешанной по полу общине
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматическую форму источника, а сноска разъясняет, что обращение может включать женщин.
- issue: Смысл выражения σκάνδαλον τοῦ σταυροῦ
  choice: крест больше не служит камнем преткновения
  alternative: устранено преткновение креста; устранено то, чем крест вызывает неприятие
  rationale: Формулировка сохраняет образ σκάνδαλον и мысль о кресте как причине неприятия, не сводя выражение только к эмоциональной обиде. Перфектный результат κατήργηται передан словами «больше не служит».
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской речи. Повтор «всё ещё» сохранён ради логики довода. Последнее предложение слегка перестроено для естественности по-русски при сохранении образа камня преткновения и результирующего значения греческого перфекта.
