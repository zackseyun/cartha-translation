lexical_decisions:
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение сохраняет лёгкое противопоставительное ударение греческого текста и естественно звучит по-русски.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью Павла естественнее для современного русского, чем отдельное «ибо».
- source_word: πνεύματι
  choice: Духом
  rationale: Творительный падеж сохраняет вероятное значение средства — действие совершается посредством Святого Духа; прописная буква отражает наиболее вероятный контекстуальный референт.
- source_word: ἐκ πίστεως
  choice: по вере
  rationale: Передаёт веру как основание или исходную почву ожидания, не утяжеляя фразу буквальным «из веры».
- source_word: ἐλπίδα δικαιοσύνης
  choice: праведности, на которую надеемся
  rationale: Естественно выражает по-русски надежду, направленную на ожидаемую праведность, а неоднозначное строение греческого сочетания отмечено в сноске.
- source_word: ἀπεκδεχόμεθα
  choice: с нетерпением ожидаем
  rationale: Передаёт усиленное, устремлённое вперёд ожидание, выраженное составным глаголом.
theological_decisions:
- issue: Референт πνεύματι
  choice: Святой Дух
  alternative: человеческий дух
  rationale: Контраст Духа, плоти и закона в ближайшем контексте Послания к галатам убедительно указывает на Святого Духа.
- issue: Значение дательного πνεύματι
  choice: посредством Духа
  alternative: в сфере Духа
  rationale: Русский творительный «Духом» кратко передаёт инструментальное понимание, а возможное значение сферы действия сохранено в сноске.
- issue: Связь ἐλπίδα δικαιοσύνης
  choice: праведность как предмет надежды
  alternative: надежда, связанная с праведностью, или надежда, порождённая праведностью
  rationale: В контексте речь вероятнее всего идёт об ожидаемой праведности, однако буквальное сочетание допускает более одного смыслового отношения, что оговорено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ведь» сохраняет ход рассуждения без архаичного «ибо»; порядок слов подчёркивает «мы», а тяжеловесная буквальная конструкция «надежду праведности» раскрыта естественно и снабжена сноской.
