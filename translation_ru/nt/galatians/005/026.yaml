  source_fidelity: «Не будем становиться» точно передаёт запретительное увещание μὴ γινώμεθα, включая процессуальный оттенок γίνομαι. «Тщеславными» адекватно передаёт κενόδοξοι; деепричастия «провоцируя» и «завидуя» сохраняют параллельную форму и взаимную направленность действий в ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
  naturalness: Формулировка краткая, естественная для современного литературного русского и соответствует увещательному регистру послания. «Провоцируя друг друга» несколько шире и современнее, но приемлемо передаёт вызывающий, сопернический оттенок προκαλούμενοι без неоправданного сужения смысла.
  terminology: «Тщеславными» — удачный литературный эквивалент κενόδοξοι. Сноска корректно даёт допустимую альтернативу «заносчивыми» и поясняет мотив «пустой славы», не навязывая богословского истолкования.
