  text: μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: ru
  text: Не будем становиться тщеславными[a], провоцируя друг друга и завидуя друг другу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заносчивыми». Греческое слово указывает на стремление к пустой славе и преувеличенное чувство собственной значимости.'
    reason: Лексическая альтернатива поясняет смысл редкого греческого слова κενόδοξος и его связь с «пустой славой».
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Не будем становиться
  rationale: Сочетание μή с формой первого лица множественного числа сослагательного наклонения выражает совместное предостережение. «Не будем становиться» сохраняет и побудительный смысл, и оттенок вхождения в состояние у γίνομαι.
- source_word: κενόδοξοι
  choice: тщеславными
  rationale: κενόδοξος обозначает стремление к пустой славе и необоснованное самомнение. «Тщеславными» естественно и точно передаёт этот порок в современном русском языке.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: друг друга / друг другу
  rationale: Падежные формы русского взаимного местоимения естественно передают соответственно винительный и дательный падежи греческого ἀλλήλων.
- source_word: προκαλούμενοι
  choice: провоцируя
  rationale: Причастие обозначает вызывающее поведение, побуждающее другого к ответу или противостоянию. «Провоцируя» сохраняет широту значения и причастную связь с главным призывом.
- source_word: φθονοῦντες
  choice: завидуя
  rationale: φθονέω означает испытывать зависть к другому. «Завидуя» кратко и естественно сохраняет параллелизм причастных конструкций.
theological_decisions:
- issue: Связь причастий с главным призывом
  choice: Причастные обороты «провоцируя друг друга и завидуя друг другу» представлены как сопутствующие проявления тщеславия.
  alternative: Можно понимать их почти как дополнительные повеления либо как указание на способ, которым люди становятся тщеславными.
  rationale: Греческий синтаксис наиболее естественно ставит κενόδοξοι в роли основной именной части сказуемого после γινώμεθα, а причастия описывают сопутствующее поведение. Русский перевод сохраняет эту синтаксическую открытость, не уточняя причинную или временную связь.
translation_notes:
  register: Современный литературный русский язык; краткая, увещательная формулировка. Причастный параллелизм оригинала сохранён без искусственного утяжеления.
