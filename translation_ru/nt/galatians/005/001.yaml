base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: ru
  text: Для свободы Мессия освободил нас[a]. Поэтому стойте твёрдо и не подпадайте снова под ярмо рабства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В свободе Мессия освободил нас». Начальный дательный оборот сжат и допускает несколько близких по смыслу толкований.'
    reason: alternative_reading
  - marker: b
    text: 'Возможный перевод: «не оказывайтесь снова под ярмом рабства». Греческий глагол может означать попадание под власть чего-либо, подчинение ему или связанность, подобную попаданию в ловушку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: для свободы
  rationale: Дательный падеж в этой сжатой конструкции, вероятнее всего, выражает цель или результат. Формулировка сохраняет смысловой акцент и созвучие с глаголом «освободил».
- source_word: Χριστὸς
  choice: Мессия
  rationale: Χριστός передаёт титул Помазанника; «Мессия» раскрывает его значение и сохраняет иудейский мессианский контекст.
- source_word: ἠλευθέρωσεν
  choice: освободил
  rationale: Прямо передаёт значение ἐλευθερόω и сохраняет однокоренную связь с существительным «свобода».
- source_word: στήκετε
  choice: стойте твёрдо
  rationale: Настоящее повелительное наклонение призывает сохранять стойкость; выражение естественно для современного литературного русского языка.
- source_word: οὖν
  choice: поэтому
  rationale: Ясно обозначает вывод из предшествующего утверждения.
- source_word: ζυγῷ δουλείας
  choice: под ярмо рабства
  rationale: Сохраняет конкретную метафору ярма и сильное значение δουλεία — состояния порабощения.
- source_word: ἐνέχεσθε
  choice: не подпадайте
  rationale: Передаёт смысл попадания под власть или подчинение чему-либо и естественно сочетается по-русски с образом ярма.
- source_word: πάλιν
  choice: снова
  rationale: Прямо указывает на возвращение к прежнему состоянию.
theological_decisions:
- issue: Передача Χριστός как титула или как ставшего именем традиционного обозначения
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово обозначает мессианский титул Того, кто освобождает; перевод титула сохраняет его исходное значение, не добавляя конфессионального толкования.
- issue: Степень силы при передаче δουλεία
  choice: рабство
  alternative: неволя
  rationale: «Рабство» наиболее прямо сохраняет резкое противопоставление свободе и реальное состояние подчинённости, выраженное греческим словом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным увещевательным ритмом. Сохранены повтор «свобода — освободил», метафора ярма и неоднозначность начального дательного оборота; архаизмы и конфессионально окрашенные пояснения не вводились.
