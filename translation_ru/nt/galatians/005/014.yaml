base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: ru
  text: 'Ведь весь закон исполнен в одном изречении: «Люби ближнего твоего, как самого себя»[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одном слове». Греческое λόγος здесь может означать слово, высказывание или изречение; далее имеется в виду одна заповедь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, с оттенком перфекта: «уже исполнен»; по смыслу возможно: «сводится». Греческая форма говорит об исполнении, результат которого сохраняется.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Ведь
  rationale: γάρ поясняет и обосновывает предыдущее наставление; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: πᾶς νόμος
  choice: весь закон
  rationale: Сочетание с артиклем и существительным в единственном числе представляет закон как единое целое, а πᾶς подчёркивает его полноту.
- source_word: ἐν ἑνὶ λόγῳ
  choice: в одном изречении
  rationale: λόγος здесь обозначает не одно отдельное слово, а единое высказывание — далее цитируемую заповедь. «Изречение» сохраняет краткость и возвышенный библейский регистр.
- source_word: πεπλήρωται
  choice: исполнен
  rationale: Перфект страдательного залога выражает достигнутое исполнение с сохраняющимся результатом. «Исполнен» точнее, чем истолковывающее «сводится» или «заключается».
- source_word: ἐν τῷ
  choice: ':'
  rationale: Оборот вводит содержание изречения; в русском языке это естественно и ясно передаётся двоеточием перед цитатой.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Форма будущего времени в цитате из Лев 19:18 имеет силу повеления. Русский императив естественно передаёт заповедь, не меняя её содержания.
- source_word: τὸν πλησίον σου
  choice: ближнего твоего
  rationale: «Ближний» — точный и укоренённый русский эквивалент πλησίον в этическом контексте; порядок слов сохраняет достоинство цитаты, оставаясь понятным.
- source_word: ὡς σεαυτόν
  choice: как самого себя
  rationale: Передаёт сравнение точно и естественно; «самого» явно соотносит возвратное местоимение с адресатом заповеди.
theological_decisions:
- issue: Отношение всего закона к заповеди любви к ближнему
  choice: Закон как целое назван исполненным в этой заповеди.
  alternative: Весь закон лишь кратко подытожен или выражен этой заповедью.
  rationale: πληρόω означает прежде всего «исполнять, доводить до полноты», а не просто «подытоживать». Перевод сохраняет сильную формулировку Павла, но не делает дополнительного вывода об отмене закона и не ограничивает слово «закон» только нравственными предписаниями.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Изречение» избегает ложного впечатления, будто цитата состоит из одного отдельного слова; «Люби» естественно передаёт силу заповеди.
