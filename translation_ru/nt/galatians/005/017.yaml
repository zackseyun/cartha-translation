source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: ru
  text: Ведь плоть желает того, что противно Духу[a], а Дух — того, что противно плоти; они противятся друг другу, так что вы не делаете того, чего хотите.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духу», если имеется в виду человеческий дух, а не Святой Дух.'
    reason: alternative_reading
lexical_decisions:
- source_word: σάρξ
  choice: плоть
  rationale: Сохраняет ключевую метафору Павла и не сводит её заранее к толкованию «греховная природа»; в данном контексте слово имеет более широкий нравственный смысл, чем просто физическое тело.
- source_word: ἐπιθυμεῖ
  choice: желает
  rationale: Естественно передаёт направленное стремление; враждебная направленность выражена сочетанием κατά с родительным падежом.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: того, что противно Духу / того, что противно плоти
  rationale: Такое восполнение делает фразу естественной по-русски и сохраняет противительный смысл греческой конструкции.
- source_word: πνεῦμα
  choice: Дух
  rationale: Контекст Гал 5 преимущественно указывает на Святого Духа, противопоставленного плоти; прописная буква отражает это вероятное понимание.
- source_word: ἀλλήλοις ἀντίκειται
  choice: противятся друг другу
  rationale: Передаёт взаимное противостояние кратко и близко к форме греческого текста.
- source_word: ἵνα μὴ
  choice: так что ... не
  rationale: Сохраняет возможный оттенок следствия или практического результата, не утверждая слишком жёстко исключительно целевое значение.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: вы делаете не то, чего хотели бы
  rationale: Естественная русская передача неопределённой относительной конструкции; сослагательная форма «хотели бы» выражает желание, которому препятствует внутреннее противостояние.
theological_decisions:
- issue: Значение σάρξ в нравственном контексте Павла
  choice: В основном тексте сохранено слово «плоть» как богословски значимая метафора Павла.
  alternative: греховная природа
  rationale: Контекст явно нравственный, однако парафраз «греховная природа» сужает многозначность σάρξ и преждевременно закрепляет одно толкование.
- issue: Референт πνεῦμα
  choice: «Дух», то есть, вероятнее всего, Святой Дух.
  alternative: «дух», то есть человеческий дух
  rationale: Ближайший контекст Гал 5 говорит о водительстве Духа и плоде Духа, поэтому Святой Дух — наиболее вероятный референт; возможное иное понимание отмечено в сноске.
- issue: Смысл ἵνα μὴ и свобода человеческого действия
  choice: «так что вы делаете не то, чего хотели бы»
  alternative: «чтобы вы не делали того, чего хотите»
  rationale: Формулировка передаёт практический результат взаимного противостояния плоти и Духа, не превращая стих в утверждение о полном отсутствии способности действовать.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и ясный. Сохранена павловская метафора «плоть», а эллипсис второй части раскрыт минимально. Все сноски имеют маркеры в основном тексте.
