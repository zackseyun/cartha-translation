review_pass:
  verdict: revise
  source_fidelity: 'Начальная часть в целом точно передаёт греческий текст: «плоть», «Дух», взаимное противостояние и причинно-следственная связь сохранены. Однако «вы делаете не то, чего хотели бы» меняет значение ἃ ἐὰν θέλητε ταῦτα ποιῆτε: греческий текст говорит о том, что адресаты не делают того, чего хотят (или захотят), а не о том, что они делают нечто иное. Кроме того, сослагательное «хотели бы» неоправданно ослабляет настоящее/обобщённое θέλητε.'
  naturalness: Исправленный текст звучит естественно на современном литературном русском. Оборот «не делаете того, чего хотите» прямой, ясный и не добавляет отсутствующего в оригинале противопоставления «не то».
  terminology: «Плоть» обоснованно сохраняет павловский образ σάρξ; «Дух» с прописной буквы хорошо соответствует контексту Гал 5, при этом альтернативное понимание отмечено. Сноска b в проекте привязана к «друг другу», но разъяснение в ней избыточно и её формулировка «противолежат» не является удачным русским буквальным эквивалентом ἀντίκειται. Английская аудиторская сноска b относится к возможному пониманию πνεῦμα, поэтому обе альтернативы следует отразить при первом упоминании «Дух».
