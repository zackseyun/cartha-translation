  rationale: Исправлена заключительная часть стиха, чтобы точно передать отрицание и объект ποιῆτε без добавления мысли о совершении «чего-то другого». Убрана неточная и избыточная сноска к взаимному противостоянию; сохранена необходимая сноска об альтернативном понимании πνεῦμα.
