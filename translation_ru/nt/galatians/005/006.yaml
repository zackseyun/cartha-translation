  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: ru
  text: Ведь в Мессии[a] Иисусе ни обрезание, ни необрезание ничего не значат, но важна вера[b], действующая через любовь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе». Греческое Χριστός — титул со значением «Мессия».'
    reason: alternative_reading
  - marker: b
    text: Греческое πίστις можно также перевести как «верность» или «доверие».
    reason: lexical_alternative
  - marker: c
    text: 'Возможны также переводы: «проявляющая себя через любовь», «становящаяся действенной через любовь» или «приводимая в действие через любовь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог ἐν передан буквально, чтобы сохранить характерный для Павла язык пребывания «в» Мессии; Χριστός передан как титул «Мессия», а не как часть имени.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущей мысли; русское «ведь» естественно выражает пояснительно-причинную связь.
- source_word: περιτομή ... ἀκροβυστία
  choice: обрезание ... необрезание
  rationale: Сохранены параллельные существительные и их буквальный, заветный и социально-идентификационный смысл без поясняющего расширения.
- source_word: τι ἰσχύει
  choice: не имеет силы
  rationale: ἰσχύει обозначает силу, действенность или значимость. Формулировка сохраняет оттенок действенности и позволяет подразумевать тот же глагол после противопоставительного «а».
- source_word: πίστις
  choice: вера
  rationale: «Вера» — основное и наиболее узнаваемое соответствие; возможные оттенки верности и доверия отмечены в сноске.
- source_word: δι’ ἀγάπης
  choice: через любовь
  rationale: διά с родительным падежом выражает посредство или средство; «через любовь» сохраняет эту связь, не уточняя её сверх текста.
- source_word: ἐνεργουμένη
  choice: действующая
  rationale: Причастие допускает средний или страдательный оттенок. «Действующая» естественно передаёт активность веры, не разворачивая выражение в богословское толкование.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном сочетании слово сохраняет функцию титула; основной текст передаёт его значение, а традиционный русский вариант приведён в сноске.
- issue: Передача πίστις
  choice: вера
  alternative: верность; доверие
  rationale: Контекст говорит о вере, действующей через любовь, однако лексический диапазон слова не позволяет исключить оттенки доверия и верности; они сохранены как варианты.
- issue: Залог ἐνεργουμένη
  choice: действующая
  alternative: проявляющая себя; приводимая в действие; становящаяся действенной
  rationale: Греческая форма морфологически может пониматься как средняя или страдательная. Основной перевод не вводит явно внешний источник действия, а сноска сохраняет возможные прочтения.
translation_notes:
  register: 'Современный литературный русский язык с краткой, торжественной синтаксической структурой. Эллипсис после «а вера» воспроизводит компактность греческого противопоставления: сила отрицается у обрезания и необрезания и подразумевается у веры. Все примечания привязаны к соответствующим словам основного текста.'
