  source_fidelity: В черновике точно переданы ἀνόητοι, Γαλάται, βασκαίνω и предикативное ἐσταυρωμένος. Однако повтор «вас — вас, у которых» неестественен и создаёт тяжёлую, искусственно перестроенную относительную конструкцию. Предлагаемое деление на риторический вопрос и поясняющее утверждение сохраняет смысловую связь οἷς κατ’ ὀφθαλμοὺς, не приписывая способ «публичного изображения».
  naturalness: «О неразумные галаты!» соответствует современному литературному, несколько торжественному регистру. «Перед вашими глазами» естественнее, чем «вас, у которых перед глазами», а «наглядно представлен как распятый» передаёт образ открыто и отчётливо поставленного перед адресатами распятого Иисуса без излишне буквальной ассоциации с картиной.
  terminology: «Иисус Мессия» оправданно раскрывает титульное значение Χριστός; традиционное «Иисус Христос» следует отметить в примечании. «Околдовал» сохраняет намеренно яркую метафору βασκαίνω и не сводит её к нейтральному обману.
