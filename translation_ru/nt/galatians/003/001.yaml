  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: ru
  text: О неразумные галаты! Кто околдовал вас? Ведь перед вашими глазами Иисус Мессия[a] был наглядно представлен как распятый[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Иисус Христос». Греческое «Христос» означает «Мессия».'
    reason: Поясняет передачу титула Χριστός.
  - marker: b
    text: 'Или: «был ясно изображён распятым»; «был открыто представлен распятым».'
    reason: Передаёт смысловой диапазон προεγράφη, не уточняя способ такого представления.
lexical_decisions:
- source_word: ἀνόητοι
  choice: неразумные
  rationale: Передаёт упрёк в недостатке понимания, не усиливая его до нравственного осуждения; естественно звучит в современном литературном русском.
- source_word: Γαλάται
  choice: галаты
  rationale: Устоявшееся русское название жителей Галатии и традиционная форма обращения в этом послании.
- source_word: ἐβάσκανεν
  choice: околдовал
  rationale: Сохраняет яркий образ пагубного колдовского воздействия, заложенный в глаголе βασκαίνω; более нейтральное «обманул» ослабило бы риторику Павла.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: у которых перед глазами
  rationale: Передаёт относительную конструкцию и образ непосредственной, наглядной представленности.
- source_word: Ἰησοῦς Χριστός
  choice: Иисус Мессия
  rationale: Χριστός передан как значимый титул «Мессия», а не как фамильное имя; в русском сочетание без артикля естественно и сохраняет порядок греческого текста.
- source_word: προεγράφη
  choice: был ясно изображён
  rationale: Передаёт смысл открытого и наглядного представления; «изображён» допускает риторическое возвещение, не навязывая идею буквальной картины или письменного плаката.
- source_word: ἐσταυρωμένος
  choice: распятым
  rationale: Творительный предикативный естественно передаёт причастие как состояние, в котором Иисус был наглядно представлен.
theological_decisions:
- issue: Передача Χριστός в сочетании Ἰησοῦς Χριστός
  choice: Иисус Мессия
  alternative: Иисус Христос
  rationale: Выбор раскрывает титульное значение Χριστός и не превращает его в воспринимаемую как собственное имя форму; традиционный вариант указан в примечании.
- issue: Характер «изображения» распятого Иисуса
  choice: ясно изображён распятым
  alternative: публично представлен распятым
  rationale: Греческое προεγράφη может обозначать открытое, наглядное представление; формулировка сохраняет образность и не уточняет без основания, шла ли речь о проповеди, письменном объявлении или ином способе представления.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной интонацией. Восклицание сохраняет резкость обращения, а единая вопросительная конструкция отражает греческий синтаксис. Повтор «вас — вас» помогает естественно присоединить относительное οἷς после вопросительного местоимения и избежать двусмысленного «перед чьими глазами».
