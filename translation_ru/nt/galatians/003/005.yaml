source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: ru
  text: Итак, Тот, кто даёт вам Духа и совершает среди вас чудеса[a], делает это через дела Закона или через слышание с верой?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «через слышание, соединённое с верой»; возможно также: «через весть, услышанную с верой».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: даёт
  rationale: Настоящее причастие указывает на продолжающееся действие; «даёт» естественно по-русски передаёт снабжение или дарование, не добавляя идеи однократности.
- source_word: τὸ πνεῦμα
  choice: Духа
  rationale: В контексте речь идёт о Божьем Духе; прописная буква ясно обозначает личностную референцию без добавления отсутствующего в греческом слова «Святого».
- source_word: ἐνεργῶν δυνάμεις
  choice: совершает чудеса
  rationale: Сочетание обозначает совершение могущественных сверхъестественных деяний; «совершает чудеса» — ясный и естественный русский эквивалент.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Передаёт вероятный общинный смысл наблюдаемых чудес в галатийских церквях; буквальная возможность «в вас» сохранена в сноске.
- source_word: ἐξ ἔργων νόμου
  choice: благодаря делам Закона
  rationale: Предлог ἐκ указывает здесь на основание или средство. «Благодаря» естественно поддерживает риторический вопрос; «дела Закона» сохраняет устойчивое выражение Павла.
- source_word: νόμου
  choice: Закона
  rationale: В контексте аргумента Павла имеется в виду Моисеев закон; прописная буква помогает обозначить эту конкретную референцию без тяжеловесного пояснения в тексте.
- source_word: ἀκοῆς πίστεως
  choice: услышанному с верой
  rationale: Передаёт слышание или услышанную весть, соединённую с верой, и естественно противопоставляется делам Закона. Сжатость и неоднозначность греческого генитива отмечены в сноске.
- source_word: πίστεως
  choice: верой
  rationale: В данном противопоставлении πίστις естественнее всего означает веру или доверие, а не верность.
theological_decisions:
- issue: Синтаксически сжатое выражение ἀκοῆς πίστεως допускает несколько близких пониманий.
  choice: услышанному с верой
  alternative: слышанию веры; вести, услышанной с верой
  rationale: Основной вариант ясно передаёт противопоставление дел Закона и услышанной вести, принятой с верой, но не выдаёт одну трактовку генитива за единственно возможную; альтернативы сохранены в сноске.
- issue: ἐν ὑμῖν может обозначать действие как внутри адресатов, так и среди них в общине.
  choice: среди вас
  alternative: в вас
  rationale: Контекст чудес в общинах делает «среди вас» наиболее естественным основным вариантом, однако внутреннее действие в людях грамматически возможно и потому отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Риторическая форма единого вопроса сохранена. Местоимение «Тот» написано с прописной буквы как прозрачная отсылка к Богу, действующему через Духа; конфессионально специфические уточнения не добавлены.
