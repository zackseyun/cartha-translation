  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: ru
  text: 'Но закон не от веры; напротив: «Тот, кто исполняет их, будет жить благодаря им[a]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет жить в них».'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Левит 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: закон
  rationale: Строчная буква сохраняет широту выражения Павла, тогда как контекст по-прежнему позволяет видеть здесь Моисеев закон.
- source_word: ἐκ πίστεως
  choice: от веры
  rationale: Близкая к греческому конструкция сохраняет противопоставление источника или принципа действия, не сводя его к пояснительному пересказу «основан на вере».
- source_word: ἀλλ’
  choice: напротив
  rationale: Передаёт резкое противопоставление и естественно вводит следующую цитату.
- source_word: ὁ ποιήσας αὐτά
  choice: тот, кто исполняет их
  rationale: Обобщающая конструкция передаёт субстантивированное причастие; «исполняет» естественно относится к предписаниям закона, а местоимение «их» не делает подразумеваемый объект излишне явным.
- source_word: ζήσεται ἐν αὐτοῖς
  choice: будет жить ими
  rationale: Сохраняет образную краткость цитаты и передаёт возможное значение средства или основания; более буквальное пространственное прочтение отмечено в сноске.
theological_decisions:
- issue: Противопоставление закона и веры у Павла
  choice: «закон — не от веры»
  alternative: «закон не основан на вере» / «закон действует не по принципу веры»
  rationale: Выбранная формулировка сохраняет богословское напряжение исходного текста и не уточняет сверх сказанного, в каком именно смысле закон «не от» веры.
- issue: Смысл ἐν αὐτοῖς в цитате
  choice: «будет жить ими»
  alternative: «будет жить в них»
  rationale: Творительный падеж допускает понимание заповедей как средства или основания жизни, но буквальная альтернатива сохранена в сноске без окончательного устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и слегка возвышенным ритмом библейской цитаты. Формулировка «не от веры» намеренно близка к оригиналу; архаизмы и конфессионально окрашенные пояснения исключены.
