source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: ru
  text: Для чего же закон? Он был добавлен из-за преступлений[a] до тех пор, пока не придёт семя[b], которому было дано обещание, — установленный через ангелов при посредстве посредника[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «из-за преступлений» может означать, что закон был добавлен в связи с преступлениями, чтобы выявлять или сдерживать их; греческий текст не уточняет этого более определённо.
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «потомство» или «потомок».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «устроенный», «предписанный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Для чего же закон?
  rationale: Эллиптический вопрос в контексте относится к назначению закона, а не к определению его сущности; такой перевод естественно передаёт ход рассуждения Павла.
- source_word: νόμος
  choice: закон
  rationale: В данном контексте имеется в виду Моисеев закон как известная участникам рассуждения реальность; строчная буква соответствует нормам современного русского текста и не ослабляет определённости значения.
- source_word: τῶν παραβάσεων χάριν
  choice: из-за преступлений
  rationale: Сочетание χάριν с родительным падежом допускает указание как на причину, так и на цель. Перевод сохраняет краткость и не уточняет, должен ли был закон обуздывать, выявлять или иным образом рассматривать преступления.
- source_word: προσετέθη
  choice: был добавлен
  rationale: Пассивный аорист προστίθημι прямо указывает на добавление закона; формулировка сохраняет его дополнительное место в аргументации.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: пока не придёт
  rationale: Оборот обозначает предел действия, связанный с ожидаемым будущим событием; в русском это естественно передаётся конструкцией «пока не» с будущим временем.
- source_word: τὸ σπέρμα
  choice: Потомок
  rationale: В русском «семя» в значении лица звучит архаично и может затемнять смысл. «Потомок» передаёт собирательно-единственное σπέρμα и сохраняет связь с обещанием Аврааму; заглавная буква уместна, поскольку в ближайшем контексте Павел отождествляет этого Потомка с Христом (Гал 3:16).
- source_word: ᾧ ἐπήγγελται
  choice: которому было дано обещание
  rationale: Формулировка явно передаёт дательный адресата и пассивное значение перфекта, а слово «обещание» естественно восполняет содержание глагола из контекста.
- source_word: διαταγεὶς
  choice: установлен
  rationale: Причастие διατάσσω описывает закон как официально учреждённый или устроенный; «установлен» передаёт это без излишне конфессиональной окраски.
- source_word: δι’ ἀγγέλων
  choice: через ангелов
  rationale: διά с родительным падежом обозначает посредствующую роль ангелов.
- source_word: ἐν χειρὶ μεσίτου
  choice: рукой посредника
  rationale: Сохраняется конкретный греческий оборот, выражающий посредствующее действие, при этом фраза остаётся понятной по-русски.
theological_decisions:
- issue: Значение выражения «из-за преступлений»
  choice: Сохранена широкая формулировка без уточнения функции закона.
  alternative: «чтобы обуздывать преступления», «чтобы выявлять преступления» или «в связи с преступлениями»
  rationale: Греческий текст не определяет точнее, указывает ли выражение на причину, выявление, умножение или сдерживание преступлений; перевод не разрешает эту богословскую напряжённость за автора.
- issue: Передача σπέρμα в аргументе Павла
  choice: «Потомок» в основном тексте
  alternative: «семя» или «потомство»
  rationale: «Потомок» ясно передаёт личное и единственное прочтение в ближайшем контексте, тогда как сноска сохраняет лексическую широту слова и его связь с формулировкой обетования.
- issue: Посредничество при установлении закона
  choice: «через ангелов рукой посредника»
  alternative: «при посредстве ангелов через посредника»
  rationale: Перевод сохраняет две ступени посредничества и конкретный образ «руки», не уточняя личность посредника, которую сам стих не называет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Эллиптический вопрос сохранён, но выражен естественно; архаичные слова и тяжёлая калька по возможности устранены. Тире выделяют временное ограничение, не меняя синтаксической связи основной фразы.
