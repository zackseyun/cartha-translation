base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: ru
  text: 'Итак, знайте: люди веры — вот сыновья Авраама.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: знайте
  rationale: 'Форма может пониматься как повелительное наклонение («знайте») или изъявительное («вы знаете»). В данном аргументативном контексте естественно звучит призыв сделать вывод: «Итак, знайте».'
- source_word: ἄρα
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения.
- source_word: οἱ ἐκ πίστεως
  choice: те, кто от веры
  rationale: Сохраняет необычную, но богословски значимую конструкцию ἐκ πίστεως — принадлежность к сфере веры или происхождение из веры — не сводя её к более толковательному «верующие».
- source_word: οὗτοι
  choice: они
  rationale: Отдельное указательное местоимение подчёркнуто передано возобновляющим «они» после темы «те, кто от веры».
- source_word: υἱοί
  choice: сыновья
  rationale: Сохраняет родовое существительное и образ сыновства Аврааму, не заменяя его более широким «дети» или толковательным «потомки».
theological_decisions:
- issue: Кого Павел называет сыновьями Авраама
  choice: «те, кто от веры» прямо отождествлены с сыновьями Авраама
  alternative: «верующие являются духовными потомками Авраама»
  rationale: Перевод сохраняет краткое и категоричное утверждение текста, не добавляя отсутствующее в стихе определение «духовные» и не заменяя сыновство понятием потомства.
- issue: Значение ἐκ πίστεως
  choice: сохранена формулировка «от веры»
  alternative: «верующие» / «полагающиеся на веру»
  rationale: Греческая конструкция допускает смысл характеристики людей на основании веры; буквальная русская формула сохраняет эту смысловую напряжённость и связь с повторяющимся выражением в контексте.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Двоеточие и конструкция «те, кто… — они…» передают тематическое выделение οἱ… οὗτοι. Формулировка «от веры» намеренно несколько необычна, поскольку отражает греческую конструкцию и терминологию аргумента Павла.
