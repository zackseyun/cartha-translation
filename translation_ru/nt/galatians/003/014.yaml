  naturalness: Фраза соответствует современному литературному русскому и сохраняет возвышенный, но не архаичный библейский регистр. Повтор «чтобы» оправдан синтаксисом оригинала. Порядок «через веру получили» естественен и ясно связывает «через веру» с получением.
