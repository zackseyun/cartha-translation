id: GAL.3.14
reference: Galatians 3:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: ru
  text: чтобы благословение Авраама пришло к язычникам[a] в Мессии Иисусе[b], чтобы мы через веру получили обещание Духа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к народам».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «во Христе Иисусе».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «получили обещанного Духа».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Оба употребления вводят целевые придаточные; повтор «чтобы» сохраняет двухчастную структуру греческого текста.
- source_word: εἰς τὰ ἔθνη
  choice: к язычникам
  rationale: В данном контексте речь идёт о неевреях, а не о политических образованиях; направление, выраженное εἰς, передано предлогом «к».
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: благословение Авраама
  rationale: Естественно и близко передаёт благословение, связанное с Авраамом и данным ему обещанием.
- source_word: γένηται
  choice: пришло
  rationale: В сочетании с εἰς τὰ ἔθνη глагол γίνομαι идиоматично передан как распространение благословения к адресатам без тяжеловесного буквального «стало».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Сохраняет предлог ἐν и передаёт Χριστός как титул «Мессия», актуальный в рассуждении Павла об Авраамовом обещании.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: обещание Духа
  rationale: Генитивная конструкция сохранена без однозначного решения, означает ли она обещание о Духе или обещание, связанное с Духом.
- source_word: λάβωμεν
  choice: мы получили
  rationale: Форма сослагательного наклонения под ἵνα естественно передаётся русским целевым придаточным с «чтобы» и прошедшей формой глагола.
- source_word: διὰ τῆς πίστεως
  choice: через веру
  rationale: Передаёт инструментальное значение διά и сохраняет обычное богословское значение πίστις.
theological_decisions:
- issue: Передача Χριστῷ как титула или традиционного имени-подобного обозначения
  choice: в Мессии Иисусе
  alternative: во Христе Иисусе
  rationale: В контексте аргумента об Аврааме и обещании титульный смысл остаётся заметным; основной текст переводит титул, а традиционный вариант дан в сноске.
- issue: Смысл генитива τοῦ πνεύματος
  choice: обещание Духа
  alternative: обещанного Духа
  rationale: Основной текст сохраняет формальную и смысловую неоднозначность греческого генитива; вероятное контекстуальное понимание Духа как обещанного дара вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Повтор «чтобы» намеренно сохраняет параллель двух целевых конструкций; порядок слов «через веру получили» выбран ради естественного русского звучания. Все смысловые альтернативы, требующие пояснения, отмечены в тексте и вынесены в сноски.
