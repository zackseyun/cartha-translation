  naturalness: «Посредник же не бывает только при одном» сохраняет краткость и некоторую трудность оригинала, но в современном русском яснее обозначает ограничительное «одном» и не звучит как утверждение о случайном присутствии. Порядок «Бог же один» воспроизводит второй δέ без искусственного усиления противопоставления.
  terminology: Термин «посредник» и исповедальная формула «Бог один» сохранены. В сноске следует говорить об «одном» без превращения его непременно в «сторону», поскольку греческий генитив допускает дискуссию о точной связи этого слова с «посредником».
