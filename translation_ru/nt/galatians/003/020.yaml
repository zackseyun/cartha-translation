  text: ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: ru
  text: Посредник же не бывает только при одном[a], Бог же один[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посредник не есть одного». Это сжатое и трудное выражение может означать, что посредник не бывает связан лишь с одним участником; возможно также: «не действует только для одного» или «не бывает только у одной стороны».'
    reason: alternative_reading
  - marker: b
    text: Слова «Бог один», вероятно, перекликаются с исповеданием единого Бога Израиля; ср. Второзаконие 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: посредник
  rationale: Обычное и точное русское обозначение того, кто стоит между сторонами; сохраняет договорно-правовой оттенок контекста.
- source_word: ἑνὸς οὐκ ἔστιν
  choice: не бывает при одном
  rationale: Передаёт предельно сжатую греческую формулировку естественнее, чем буквальное «не есть одного», но не уточняет, кто именно подразумевается под «одним» и какова его связь с посредником.
- source_word: δὲ … δὲ
  choice: же … а
  rationale: «Же» отмечает связь с предшествующим рассуждением без добавления временного значения, а «а» передаёт сопоставление двух утверждений.
- source_word: ὁ θεὸς εἷς ἐστιν
  choice: Бог один
  rationale: Краткий прямой перевод, сохраняющий выразительную простоту греческого текста и вероятный отголосок исповедания единства Бога.
theological_decisions:
- issue: Смысл сжатого утверждения о посреднике
  choice: Сохранить формулировку «не бывает при одном», лишь минимально проясняя, что посредничество предполагает не одного.
  alternative: '«Не для одной стороны»; «не принадлежит одному»; буквально: «не есть одного».'
  rationale: Стих допускает множество толкований. Перевод не связывает его прямо ни с Моисеем, ни со Христом, ни с конкретной теорией завета и сохраняет напряжение исходного рассуждения.
- issue: Утверждение «Бог один»
  choice: Оставить без поясняющей вставки «единый Бог».
  alternative: «Бог един»; «есть один Бог».
  rationale: «Бог один» наиболее непосредственно соответствует θεὸς εἷς ἐστιν и допускает как исповедальный, так и аргументативный оттенок в контексте.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и намеренно несколько загадочным построением, соответствующим сжатости греческого текста. «При одном» понятно из общего значения слова «посредник», но не превращает спорную фразу в развёрнутое толкование.
