base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: ru
  text: Итак, закон стал нашим опекуном до Мессии[a], чтобы мы были оправданы верой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к Мессии»; выражение можно также понять как «ведущим к Мессии».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Союз вводит вывод из предшествующего рассуждения; «итак» естественно передаёт следствие, а не цель.
- source_word: ὁ νόμος
  choice: закон
  rationale: В контексте Послания к галатам речь идёт о Моисеевом законе как известной категории.
- source_word: παιδαγωγὸς
  choice: опекун
  rationale: В греко-римском доме παιδαγωγός был надзиравшим за несовершеннолетним домашним попечителем, а не прежде всего школьным учителем. «Опекун» кратко и понятно передаёт эту роль.
- source_word: ἡμῶν
  choice: нашим
  rationale: Родительный падеж обозначает отношение к παιδαγωγός и естественно передаётся притяжательной формой.
- source_word: γέγονεν
  choice: стал
  rationale: Русский совершенный вид естественно передаёт возникшее состояние; буквальное «сделался» звучало бы менее современно.
- source_word: εἰς Χριστόν
  choice: вплоть до Мессии
  rationale: В контексте εἰς указывает на Мессию как цель или предел временной попечительной роли закона. «Вплоть до» сохраняет направленно-временной оттенок лучше, чем простое «до».
- source_word: Χριστόν
  choice: Мессии
  rationale: Χριστός здесь передан как титул — «Мессия», а не как ставшее именем «Христос».
- source_word: ἵνα
  choice: чтобы
  rationale: Союз естественно вводит цель.
- source_word: ἐκ πίστεως
  choice: верой
  rationale: Творительный падеж идиоматично передаёт средство или основание оправдания, не добавляя объекта веры, которого в греческом тексте нет.
- source_word: δικαιωθῶμεν
  choice: мы были оправданы
  rationale: Страдательная конструкция сохраняет судебно-правовой образ греческого глагола и целевую модальность после ἵνα.
theological_decisions:
- issue: Значение εἰς Χριστόν в описании роли закона
  choice: «вплоть до Мессии» — Мессия представлен как цель и предел временной роли закона
  alternative: «к Мессии» или «ведущим к Мессии»
  rationale: Ближайший контекст подчёркивает действие закона до прихода веры, однако εἰς сохраняет также направленность к цели. Основной текст передаёт временно-телеологический смысл, а сноска сохраняет возможное прочтение направления.
- issue: Передача δικαιωθῶμεν
  choice: «были оправданы»
  alternative: «были признаны праведными»
  rationale: Традиционный глагол «оправдать» сохраняет юридический оттенок и не сужает богословское содержание до пояснительного парафраза.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Опекун» выбран вместо традиционного «детоводитель», которое архаично и может ошибочно создавать образ учителя; отдельная сноска для этого слова не требуется. Маркер [a] поставлен непосредственно после спорного выражения.
