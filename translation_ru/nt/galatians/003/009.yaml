  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: ru
  text: Итак, те, кто верит, благословляются вместе с верующим Авраамом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с верным Авраамом». Слово πιστός может означать как «верующий», так и «верный»; в ближайшем контексте особо подчёркивается вера Авраама.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает этот стих с контекстом.
- source_word: οἱ ἐκ πίστεως
  choice: те, кто верит
  rationale: Естественно для современного русского языка передаёт людей, определяемых верой; буквальное «те, кто от веры» звучало бы неясно и искусственно.
- source_word: πίστεως
  choice: верит / вера
  rationale: В данном контексте πίστις обозначает веру, а не прежде всего верность; в русском предложении значение передано глагольной конструкцией.
- source_word: εὐλογοῦνται
  choice: благословляются
  rationale: Сохраняет настоящее время и страдательный залог, подчёркивая, что благословение принимают, а не заслуживают.
- source_word: σὺν
  choice: вместе с
  rationale: Ясно передаёт совместное участие в благословении.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: с верным Авраамом
  rationale: Передаёт обычное значение πιστός как «верный», не устраняя контекстуальную возможность значения «верующий»; эта возможность отмечена в сноске.
theological_decisions:
- issue: Значение πιστός применительно к Аврааму в рассуждении о вере
  choice: верный Авраам
  alternative: верующий Авраам; Авраам, который поверил
  rationale: πιστός может указывать как на верность, так и на веру. Основной текст сохраняет ёмкое определение «верный», а сноска показывает возможное прочтение, особенно уместное в контексте Гал 3.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Конструкция «те, кто верит» предпочтена буквальному, но неестественному «те, кто от веры».
