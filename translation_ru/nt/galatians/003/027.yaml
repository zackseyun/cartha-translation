base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: ru
  text: Ибо все вы, кто были крещены в Мессию, облеклись в Мессию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Христа» — в обоих случаях.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: все вы, кто
  rationale: Передаёт соотносительное значение «все те, кто» и учитывает обращение во втором лице множественного числа, выраженное формами глаголов.
- source_word: γὰρ
  choice: ибо
  rationale: Сохраняет пояснительную связь с предыдущим рассуждением; слово уместно в современном литературном библейском стиле.
- source_word: εἰς
  choice: в
  rationale: Наиболее прямо передаёт направленность и идею приобщения в выражении о крещении, не разрешая позднейшие богословские споры.
- source_word: Χριστόν
  choice: Мессию
  rationale: Передаёт титульный смысл греческого Χριστός («Помазанник»); традиционный вариант «Христос» указан в сноске.
- source_word: ἐβαπτίσθητε
  choice: крестился
  rationale: Русский возвратный глагол является естественным соответствием греческой страдательной форме в данном контексте и не уточняет способ совершения крещения.
- source_word: ἐνεδύσασθε
  choice: облеклись в
  rationale: Сохраняет образ одежды и значение греческой средней формы, оставаясь ясным и достойным по стилю.
theological_decisions:
- issue: Следует ли формулировкой уточнять действенность или способ крещения.
  choice: крестился в Мессию
  alternative: был погружён в Мессию; крестился по отношению к Мессии
  rationale: Греческий текст говорит о крещении «в» Мессию и приобщении к Нему, но сам по себе не разрешает последующие споры о сакраментальной действенности или физическом способе крещения.
- issue: Следует ли ослабить метафору надевания одежды.
  choice: облеклись в Мессию
  alternative: соединились с Мессией; стали принадлежать Мессии
  rationale: Прямой образ одежды важен для смысла текста; объяснительные варианты неоправданно снимают его многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ибо» и «облеклись» сохраняют достоинство и образность оригинала, не делая фразу непонятной обычному читателю.
