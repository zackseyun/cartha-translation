id: GAL.3.8
reference: Galatians 3:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: ru
  text: 'Писание же, предвидя, что Бог оправдывает народы[a] по вере, заранее возвестило Аврааму благую весть[b]: «В тебе будут благословлены все народы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «язычников»; греческое ἔθνη может означать как «народы», так и «язычников».
    reason: lexical_alternative
  - marker: b
    text: Или «заранее благовествовало Аврааму».
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: предвидя
  rationale: Деепричастие естественно передаёт предшествующее видение и сохраняет олицетворение Писания.
- source_word: ἡ γραφή
  choice: Писание
  rationale: В контексте Павла это устоявшееся обозначение Священного Писания, представленного как действующее лицо.
- source_word: ἐκ πίστεως
  choice: по вере
  rationale: Оборот естественен для современного русского библейского языка и сохраняет значение основания или принципа оправдания, не уточняя его сверх греческого текста.
- source_word: δικαιοῖ
  choice: оправдывает
  rationale: Передаёт стандартное для Павла значение δικαιόω кратко и без пояснительного расширения.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: народы ... все народы
  rationale: Единообразный перевод сохраняет лексический повтор и явную связь утверждения Павла с обетованием Аврааму; возможное значение «язычники» отмечено в сноске.
- source_word: προευηγγελίσατο
  choice: заранее возвестило ... благую весть
  rationale: Передаёт как временную приставку προ-, так и смысловую основу εὐαγγελ-, оставаясь понятным современному читателю.
- source_word: τῷ Ἀβραὰμ
  choice: Аврааму
  rationale: Дательный падеж естественно передаёт косвенное дополнение.
- source_word: Ἐνευλογηθήσονται
  choice: будут благословлены
  rationale: Прямо передаёт будущее время и пассивный залог, избегая архаичного «благословятся».
- source_word: ἐν σοὶ
  choice: В тебе
  rationale: Сохраняет форму цитаты и смысловую открытость предлога ἐν, не подменяя её толкованием.
theological_decisions:
- issue: Передача ἔθνη как «народы» или «язычники»
  choice: «народы» в обоих случаях
  alternative: «язычники» в первом случае и «народы» в цитате либо «язычники» в обоих случаях
  rationale: «Народы» сохраняет повтор греческого слова и делает прозрачной связь оправдания по вере с обетованием Аврааму; допустимое значение «язычники» не исключается и указано в сноске.
- issue: Характер оправдания в настоящем времени δικαιοῖ
  choice: «Бог оправдывает»
  alternative: «Бог оправдает» или «Бог объявляет праведными»
  rationale: Настоящее время сохраняет формулировку исходного текста и не сужает её до исключительно будущего события; традиционный глагол «оправдывает» не навязывает дополнительного разъяснения механизма оправдания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет олицетворение Писания и последовательность мысли оригинала; архаичные формы вроде «благословятся» не используются.
