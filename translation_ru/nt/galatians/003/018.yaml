revisions:
- from: Ведь если наследство — от Закона, то оно уже не от обещания; но Бог по Своей милости даровал его Аврааму посредством обещания.[a]
  to: Ведь если наследство — от Закона, то оно уже не от обещания; но Бог даровал его Аврааму через обещание.
  rationale: Исправление устраняет добавленное эксплицитное указание на Божью милость, сохраняя благодатный оттенок в глаголе «даровал». «Через обещание» точно и естественно передаёт δι’ ἐπαγγελίας; сноска удалена, поскольку предложенный вариант меняет оттенок связи и не требуется для передачи текста.
