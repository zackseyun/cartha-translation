source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: ru
  text: Ведь если наследство — от Закона, то оно уже не от обещания; но Бог даровал его Аврааму через обещание.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομία
  choice: наследство
  rationale: Обычное русское соответствие, сохраняющее образ получения чего-либо наследником и связь с аргументом Павла.
- source_word: ἐκ νόμου
  choice: от Закона
  rationale: Предлог «от» сохраняет значение источника или основания и параллель с «от обещания»; прописная буква указывает на Моисеев Закон в данном контексте.
- source_word: ἐξ ἐπαγγελίας
  choice: от обещания
  rationale: Сохраняет формальную и смысловую антитезу «от Закона — от обещания», не превращая её в более узкое толкование.
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно по-русски выражает логическое исключение одного основания другим.
- source_word: δι’ ἐπαγγελίας
  choice: посредством обещания
  rationale: Передаёт инструментальное значение διά и отличает средство дарования от его источника; вариант «по обещанию» отмечен в сноске.
- source_word: κεχάρισται
  choice: по Своей милости даровал
  rationale: «Даровал» естественно передаёт безвозмездное наделение, а «по Своей милости» сохраняет благодатный оттенок χαρίζομαι. Русское прошедшее время уместно передаёт совершившееся дарование с сохраняющейся силой результата.
- source_word: τῷ Ἀβραὰμ
  choice: Аврааму
  rationale: Дательный падеж прямо и естественно обозначает получателя Божьего дара.
theological_decisions:
- issue: Следует ли явно передавать оттенок милости в κεχάρισται
  choice: «по Своей милости даровал»
  alternative: «даровал» или «дал»
  rationale: Так сохраняется заложенный в глаголе оттенок свободного, милостивого дара и усиливается присущее самому тексту противопоставление Закона и обещания без добавления конфессиональной формулы.
- issue: Характер связи наследства с Законом и обещанием
  choice: Сохранена симметрия «от Закона — от обещания»
  alternative: «основано на Законе — основано на обещании»
  rationale: Более буквальная симметрия сохраняет широту греческого ἐκ и не решает однозначно, идёт ли речь об источнике, основании или принципе получения.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Синтаксический параллелизм греческого текста сохранён; «Ведь» естественно связывает стих с предшествующим доводом. Формы «Закон» и «Своей» оформлены по принятой русской библейской орфографии.
