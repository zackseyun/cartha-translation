  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: ru
  text: Если же вы принадлежите Мессии[a], значит, вы — семя Авраама[b], наследники по обещанию[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принадлежите Христу». Греческий родительный падеж выражает принадлежность; буквально по конструкции: «вы — Христовы».'
    reason: lexical_alternative
  - marker: b
    text: То есть потомство, потомки. В греческом тексте стоит слово «семя» в единственном числе, повторяющее формулировку Павла ранее в этой главе.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «согласно обещанию». Оборот может указывать на соответствие обещанию или на него как на основание наследования.'
    reason: ambiguity
lexical_decisions:
- source_word: Χριστοῦ
  choice: принадлежите Мессии
  rationale: Родительный падеж выражает принадлежность. По-русски это естественно передаётся глагольной конструкцией; Χριστός здесь сохраняет значение титула «Мессия».
- source_word: σπέρμα
  choice: семя
  rationale: Сохранено собирательное существительное в единственном числе, чтобы не потерять словесную связь с рассуждением Павла о «семени» Авраама ранее в этой главе.
- source_word: κληρονόμοι
  choice: наследники
  rationale: Естественный русский эквивалент в семейном и заветном контексте.
- source_word: κατ’ ἐπαγγελίαν
  choice: по обещанию
  rationale: Краткая конструкция сохраняет смысл греческого оборота, не уточняя однозначно, обозначает ли κατά основание, соответствие или способ.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Если же вы ... значит
  rationale: Передаёт лёгкую связь δέ и явно выраженный условный вывод ἄρα современным естественным русским синтаксисом.
theological_decisions:
- issue: Сохранить ли буквальное «семя» или заменить его более прозрачным обозначением потомков.
  choice: семя
  alternative: потомство; потомки
  rationale: «Семя» сохраняет единственное число и важную связь с Гал 3:16, тогда как «потомки» могли бы сгладить намеренное повторение Павлом одного и того же слова.
- issue: Передавать ли Χριστός как «Мессия» или как более привычное имя «Христос».
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово сохраняет титульное значение; «Мессия» делает его прозрачным, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Конструкция «принадлежите Мессии» яснее для обычного читателя, чем архаичное «вы — Христовы»; термин «семя» намеренно сохранён ради внутренней связи аргумента.
