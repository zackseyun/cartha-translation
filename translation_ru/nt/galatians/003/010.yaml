source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: ru
  text: 'Ведь все, кто полагается на дела закона[a], находятся под проклятием, потому что написано: «Проклят всякий, кто не соблюдает всего, что написано в книге закона[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все, кто из дел закона».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «кто не остаётся во всём написанном в книге закона, чтобы исполнять всё это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Ведь все, кто
  rationale: «Все, кто» сохраняет множественное и всеобщее значение ὅσοι, а «ведь» естественно передаёт пояснительную силу γάρ.
- source_word: ἐξ ἔργων νόμου
  choice: исходит из дел закона
  rationale: Относительно буквальная формулировка сохраняет необычный оборот Павла и не сводит его сразу к одному толкованию — «полагается на» или «надеется на» дела закона.
- source_word: ὑπὸ κατάραν
  choice: под проклятием
  rationale: Естественный русский оборот, выражающий подчинённость действию проклятия; отсутствие артикля в греческом не требует уточнения «тем самым проклятием».
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся формула введения авторитетной цитаты из Писания, соответствующая греческому перфекту пассивного залога.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Проклят всякий, кто
  rationale: Передаёт универсальность πᾶς и сохраняет торжественный, но современно понятный регистр цитаты.
- source_word: ἐμμένει πᾶσιν τοῖς γεγραμμένοις
  choice: придерживается всего написанного
  rationale: ἐμμένω здесь означает постоянное следование предписаниям; «придерживается» естественно передаёт это значение без пространственного и неестественного «остаётся во всём».
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: в книге закона
  rationale: «Книга закона» — понятное современное обозначение письменного свода; исторически возможное «свиток» здесь излишне конкретизирует форму носителя.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: и не исполняет этого
  rationale: По-русски отрицание при главном глаголе естественно распространяется на инфинитивную конструкцию; «исполняет» ясно выражает требуемое практическое совершение написанного.
theological_decisions:
- issue: Смысл выражения ἐξ ἔργων νόμου
  choice: Сохранён относительно буквальный оборот «исходит из дел закона».
  alternative: «полагается на дела закона» / «надеется на исполнение закона»
  rationale: Выражение богословски нагружено и может указывать на источник, основание или определяющую принадлежность. Основной текст не превращает эту многозначность в готовое доктринальное толкование; более разъясняющий вариант дан в примечании.
- issue: Объём требования в цитате из закона
  choice: «всего написанного… и не исполняет этого»
  alternative: «не исполняет всего написанного»
  rationale: Сохранена подчеркнутая всеохватность πᾶσιν и различие между постоянной приверженностью написанному и его исполнением, без смягчения абсолютного требования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром библейской цитаты. Необычность оборота «исходит из дел закона» намеренно сохранена ради исходной неоднозначности и пояснена в сноске; остальная часть передана естественным русским синтаксисом.
