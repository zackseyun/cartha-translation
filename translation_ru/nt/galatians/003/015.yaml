  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: ru
  text: 'Братья[a], я говорю по-человечески: даже завет, утверждённый человеком, никто не отменяет и не добавляет к нему ничего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Словом «братья» переведена греческая форма мужского рода во множественном числе; Павел обращается к верующим, среди которых, вероятно, были и женщины.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Братья
  rationale: Сохранена грамматически мужская форма обращения; в данном контексте она, вероятно, охватывает всех верующих адресатов, включая женщин, что поясняется в сноске.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: приведу пример из человеческой жизни
  rationale: Идиома вводит понятную человеческую аналогию. Такой перевод естественно передаёт её функцию, не превращая выражение в утверждение о сугубо человеческой точке зрения.
- source_word: ὅμως
  choice: даже
  rationale: 'Частица усиливает довод: установленный принцип действует даже применительно к обычному человеческому соглашению.'
- source_word: ἀνθρώπου
  choice: человеком
  rationale: Конкретная форма единственного числа сохранена, но русское «человеком» естественно и не указывает без необходимости на пол.
- source_word: κεκυρωμένην
  choice: утверждённого
  rationale: Перфектное страдательное причастие обозначает документ или установление, официально подтверждённое и сохраняющее силу.
- source_word: διαθήκην
  choice: завета
  rationale: В ближайшем контексте речь идёт о Божьем завете и обещании Аврааму. При этом возможное юридическое значение «завещание» отмечено в сноске.
- source_word: ἀθετεῖ
  choice: отменяет
  rationale: Передаёт юридическую идею лишения силы ясно и современно.
- source_word: ἐπιδιατάσσεται
  choice: ничего к нему не добавляет
  rationale: Глагол означает внесение дополнительных распоряжений или условий; выбранная формулировка естественна и сохраняет юридический смысл.
theological_decisions:
- issue: Передача διαθήκη как «завет» или «завещание»
  choice: завет
  alternative: завещание
  rationale: В Гал 3 Павел рассуждает об обещании Аврааму и Божьем завете, поэтому «завет» лучше сохраняет контекстуальную и богословскую связь. Реальное юридическое значение «завещание» не исключается и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка «приведу пример из человеческой жизни» передаёт функцию греческой идиомы, а юридическая лексика остаётся понятной неспециалисту.
