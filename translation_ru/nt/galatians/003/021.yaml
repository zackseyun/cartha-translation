id: GAL.3.21
reference: Galatians 3:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: ru
  text: Итак, неужели закон противен Божьим обещаниям? Ни в коем случае! Ведь если бы был дан закон, способный давать жизнь, тогда праведность действительно была бы от закона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость».'
    reason: Лексическая альтернатива для δικαιοσύνη; она сохраняет многозначность термина, не подменяя его контекстуальным богословским истолкованием.
lexical_decisions:
- source_word: νόμος
  choice: закон
  rationale: Строчная форма сохраняет общий характер рассуждения о законе как таковом, не исключая подразумеваемого Моисеева закона.
- source_word: κατὰ
  choice: противен
  rationale: С родительным падежом выражает противостояние; в русском риторическом вопросе естественно звучит краткое прилагательное «противен».
- source_word: ἐπαγγελιῶν
  choice: обещаниям
  rationale: Сохранено явно выраженное в греческом тексте множественное число и связь с ранее упомянутыми Божьими обещаниями.
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Современная и сильная русская формула категорического отрицания, естественно передающая павловское возражение.
- source_word: ἐδόθη
  choice: был дан
  rationale: Пассивная форма сохранена; в русском условном предложении простой прошедший естественнее буквального плюсквамперфекта.
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: способный давать жизнь
  rationale: Передаёт способность закона сообщать жизнь, сохраняя длительно-категориальный оттенок без излишней буквальности.
- source_word: ὄντως
  choice: действительно
  rationale: Ясно передаёт усиление вывода.
- source_word: ἐκ νόμου
  choice: от закона
  rationale: Сохраняет исходное значение ἐκ — источник или основание, не сводя выражение только к средству.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Обычный и контекстуально уместный русский эквивалент в рассуждении Павла; возможный смысл «оправдание» отмечен в сноске, чтобы не устранять смысловую напряжённость.
theological_decisions:
- issue: Значение δικαιοσύνη в аргументе Павла
  choice: праведность
  alternative: оправдание; справедливость
  rationale: «Праведность» сохраняет широкий богословский диапазон термина и не решает заранее, идёт ли речь прежде всего о качестве, статусе перед Богом или Божьем правосудии. Контекстуально вероятное «оправдание» дано как вариант в сноске.
- issue: Отношение закона к Божьим обещаниям
  choice: риторический вопрос и категорическое отрицание сохранены
  alternative: разъясняющая передача вроде «закон не отменяет обещаний»
  rationale: Исходный текст ставит вопрос именно о противостоянии закона обещаниям, а не формулирует разъяснительный тезис; такая напряжённость должна быть сохранена.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис следует логике греческого условного периода, но остаётся естественным для обычного читателя. Маркер сноски поставлен после всего утверждения, к которому относятся оба варианта.
