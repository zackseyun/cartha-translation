  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: ru
  text: Но теперь, когда пришла вера[a], мы уже не под опекой воспитателя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «когда пришла эта вера»; в контексте речь может идти о наступлении времени, определяемого верой.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово παιδαγωγός обозначало приставленного к несовершеннолетнему домашнего воспитателя, сопровождающего и надзирателя, а не прежде всего школьного учителя.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: теперь, когда пришла
  rationale: Аористное причастие в конструкции genitivus absolutus естественно передаётся временным придаточным; формулировка обозначает наступивший переход, последствия которого сохраняются в настоящем.
- source_word: δὲ
  choice: но
  rationale: Частица выражает мягкое противопоставление прежнему положению, описанному в предыдущем стихе.
- source_word: πίστεως
  choice: вера
  rationale: Основное значение πίστις здесь уместно передать словом «вера», сохранив возможность понимать его как веру вообще или как наступление эпохи веры.
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно и точно обозначает прекращение прежнего состояния.
- source_word: ὑπὸ παιδαγωγόν
  choice: под надзором опекуна
  rationale: Передаёт состояние подчинения и историческую функцию παιδαγωγός как приставленного к несовершеннолетнему домашнего надзирателя, не создавая впечатления, что речь прежде всего о школьном учителе.
- source_word: ἐσμεν
  choice: мы
  rationale: В русском настоящем времени связка «быть» обычно опускается; конструкция «мы уже не под надзором» естественно передаёт ἐσμεν.
theological_decisions:
- issue: Смысл выражения «пришла вера»
  choice: В основном тексте оставлено «пришла вера».
  alternative: «пришла эта вера» или «наступила эпоха веры»
  rationale: Контекст допускает спасительно-исторический смысл — наступление нового периода, — однако явное добавление «эпоха» разрешило бы сохраняемую греческим текстом смысловую напряжённость. Возможное контекстуально определённое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Оборот «под надзором опекуна» сохраняет образ подчинённого положения и одновременно поясняет историческую роль παιδαγωγός.
