  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: ru
  text: Но Писание заключило всё под властью греха[a], чтобы обещание через веру в Иисуса Мессию[b] было дано верующим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «заключило всё под грех».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обещание благодаря верности Иисуса Мессии». Греческое выражение может обозначать как веру в Иисуса Мессию, так и верность Иисуса Мессии.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: заключило
  rationale: Передаёт образ заточения и ограничения, оставаясь естественным в современном русском; менее истолковательно, чем «поработило».
- source_word: ἡ γραφή
  choice: Писание
  rationale: Сохраняет единственное число и олицетворение Писания как действующего свидетеля.
- source_word: τὰ πάντα
  choice: всё
  rationale: Сохраняет широкий охват среднего рода множественного числа, не сужая значение только до людей.
- source_word: ὑπὸ ἁμαρτίαν
  choice: под властью греха
  rationale: В русском буквальное «под грехом» звучит не вполне ясно; добавление «властью» естественно выражает подчинение, подразумеваемое предлогом ὑπό.
- source_word: ἡ ἐπαγγελία
  choice: обещанное
  rationale: В данном синтаксисе обещание «даётся» верующим, поэтому субстантивированное «обещанное» естественно передаёт обещанный дар, не конкретизируя его содержание.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: через веру в Иисуса Мессию
  rationale: Основной текст принимает распространённое объективное понимание родительного падежа; «через» естественно передаёт ἐκ в русском контексте. Альтернативное понимание сохранено в сноске.
- source_word: Χριστοῦ
  choice: Мессию
  rationale: Передаёт Χριστός как титул Иисуса, а не как имя.
- source_word: δοθῇ
  choice: было дано
  rationale: Пассивная форма после ἵνα передана русской конструкцией цели «чтобы… было дано».
- source_word: τοῖς πιστεύουσιν
  choice: верующим
  rationale: Естественно и кратко передаёт субстантивированное причастие настоящего времени — тех, кто верит.
theological_decisions:
- issue: Родительная конструкция πίστεως Ἰησοῦ Χριστοῦ
  choice: 'объектное понимание: «через веру в Иисуса Мессию»'
  alternative: 'субъектное понимание: «благодаря верности Иисуса Мессии»'
  rationale: Греческая конструкция допускает оба анализа. В основном тексте выбрано распространённое объектное понимание, а реальная богословская и грамматическая неоднозначность сохранена в сноске.
- issue: Значение ἡ ἐπαγγελία
  choice: «обещанное»
  alternative: «обещание»
  rationale: Греческое слово буквально означает «обещание», однако пассивное «дано» позволяет понимать его метонимически как обещанный дар. Русское «обещанное» обеспечивает ясность, не уточняя, что именно даруется.
translation_notes:
  register: Современный литературный русский, сдержанный и понятный. Сохранены олицетворение Писания, всеобщий охват «всё» и неоднозначность πίστεως Ἰησοῦ Χριστοῦ; богословски нагруженные уточнения не внесены в основной текст.
