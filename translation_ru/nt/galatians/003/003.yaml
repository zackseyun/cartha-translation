  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: ru
  text: Неужели вы так неразумны? Начав Духом[a], неужели вы теперь совершенствуетесь плотью[b]?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начав в Духе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или по смыслу: «человеческими усилиями»; возможно также: «греховной природой».'
