  source_fidelity: 'Основной смысл передан верно: риторический упрёк, противопоставление начала «Духом» нынешнему завершению «плотью» и временное «теперь» сохранены. Однако «достигаете совершенства» делает ἐπιτελεῖσθε слишком активным и несколько меняет образ: форма допускает средне-пассивное значение, поэтому в русском лучше сохранить направленность процесса на адресатов.'
  naturalness: '«Неужели вы так неразумны?» — естественно и соответствует современному литературному регистру. Формулировка «Начав Духом, теперь вы доводитесь до завершения плотью?» грамматически возможна, но тяжеловесна. Более естественно: «Начав Духом, неужели вы теперь совершенствуетесь плотью?»'
  terminology: '«Духом» с прописной буквы уместно по ближайшему контексту. «Плотью» правильно сохраняет павловский термин без преждевременной интерпретации. «Совершенствуетесь» лучше, чем «достигаете совершенства»: оно сохраняет связь с ἐπιτελεῖσθε и не добавляет явно активного достижения.'
