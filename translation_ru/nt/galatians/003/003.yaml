  - marker: c
    text: 'Или: «теперь вы завершаетесь плотью?»; возможно также: «теперь завершаете плотью?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: так
  rationale: 'В риторическом вопросе указывает прежде всего на степень: «так неразумны».'
- source_word: ἀνόητοί
  choice: неразумны
  rationale: Передаёт недостаток понимания и рассудительности, сохраняя резкость упрёка без излишне грубого «глупы».
- source_word: ἐναρξάμενοι
  choice: начав
  rationale: 'Деепричастие естественно передаёт действие, предшествующее основному: начало противопоставлено нынешнему продолжению.'
- source_word: πνεύματι
  choice: Духом
  rationale: Контекст Гал 3 указывает на Святого Духа; творительный падеж передаёт наиболее вероятное значение средства или действующей силы.
- source_word: νῦν
  choice: теперь
  rationale: Ясно сохраняет временное противопоставление между началом и нынешним положением.
- source_word: σαρκὶ
  choice: плотью
  rationale: Сохраняет многозначный павловский термин и прямое противопоставление Духу, не сводя смысл только к человеческим усилиям или греховной природе.
- source_word: ἐπιτελεῖσθε
  choice: достигаете совершенства
  rationale: Передаёт движение к завершению или зрелости и допускаемую формой направленность действия на адресатов; более буквальная пассивная формулировка по-русски была бы тяжеловесной.
theological_decisions:
- issue: Кого обозначает πνεύματι
  choice: Святого Духа
  alternative: человеческий дух или духовное начало
  rationale: Ближайший контекст говорит о получении Духа, Его действии и вере, поэтому заглавная буква контекстуально оправданна.
- issue: Значение σάρξ в противопоставлении Духу
  choice: плоть
  alternative: человеческие усилия; греховная природа
  rationale: Основной текст сохраняет богословски насыщенный и многозначный образ Павла; возможные смысловые пояснения вынесены в сноску.
- issue: Залог и оттенок ἐπιτελεῖσθε
  choice: достигаете совершенства
  alternative: доводитесь до совершенства; завершаете
  rationale: Греческая форма допускает среднее или пассивное понимание. Естественная русская формулировка не должна окончательно разрешать вопрос о залоге; альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с прямым, но не грубым риторическим упрёком. Сохранены краткость, параллелизм «начав — теперь» и напряжённое противопоставление «Духом — плотью».
