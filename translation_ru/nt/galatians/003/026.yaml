lexical_decisions:
- source_word: πάντες
  choice: все вы
  rationale: В сочетании с глаголом второго лица множественного числа слово подчёркивает, что утверждение относится ко всей общине.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим рассуждением естественно для современного русского языка.
- source_word: υἱοὶ θεοῦ
  choice: сыны Божьи
  rationale: Сохраняет прямо выраженное в греческом тексте сыновство и связанную с ним в контексте мысль о статусе наследников; форма охватывает всю названную группу, включая женщин.
- source_word: διὰ τῆς πίστεως
  choice: через веру
  rationale: Передаёт διά с родительным как средство, посредством которого обретается названный статус.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисуса Мессию
  rationale: В основном тексте предложное сочетание естественно связано с «верой» как указание на её объект. В сноске сохранена возможная трактовка ἐν как сферы пребывания или единения; Χριστός переведено как титул «Мессия».
theological_decisions:
- issue: Гендерно маркированный язык сыновства
  choice: сыны Божьи
  alternative: дети Божьи
  rationale: Греческое υἱοί буквально означает «сыновья/сыны» и в данном контексте подготавливает тему наследования; сноска поясняет, что обращение относится ко всем верующим без различия пола.
- issue: Синтаксическая связь ἐν Χριστῷ Ἰησοῦ
  choice: через веру в Иисуса Мессию
  alternative: через веру, в единении с Иисусом Мессией
  rationale: Греческая конструкция допускает связь с «верой» как её объектом, но также может обозначать пребывание «в Мессии». Основной текст выбирает наиболее естественную русскую формулировку, а сноска сохраняет значимую альтернативу.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Χριστός является греческим соответствием титула «Мессия»; перевод передаёт его смысл, тогда как традиционная форма указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формой «сыны Божьи». Тире делает именную конструкцию ясной, а «ведь» естественно связывает стих с предыдущим доводом.
