id: GAL.3.16
reference: Galatians 3:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: ru
  text: 'Обетования были даны Аврааму и его потомку[a]. Не сказано: «И потомкам», — как о многих, но как об одном: «И твоему потомку», который есть Мессия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семени». Греческое слово стоит в единственном числе, но может иметь собирательное значение; именно его форма важна для рассуждения Павла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: были даны
  rationale: В сочетании с «обетованиями» по-русски естественно сказать «были даны»; это передаёт речевой акт обещания, хотя буквально глагол означает «были сказаны».
- source_word: ἐπαγγελίαι
  choice: обетования
  rationale: Устоявшийся, понятный в библейском регистре эквивалент для Божьих обещаний.
- source_word: σπέρμα / σπέρματι
  choice: потомок / потомку
  rationale: Единственное число сохраняет грамматическую основу аргумента Павла и звучит естественнее современного буквального «семя» применительно к человеку.
- source_word: τοῖς σπέρμασιν
  choice: потомкам
  rationale: Форма множественного числа должна быть явно видна, поскольку противопоставление единственного и множественного числа составляет суть рассуждения.
- source_word: ὡς ἐπὶ πολλῶν / ὡς ἐφ’ ἑνός
  choice: как о многих / как об одном
  rationale: Кратко, естественно и симметрично передаёт пояснение Павла.
- source_word: Χριστός
  choice: Мессия
  rationale: 'Здесь слово имеет явную функцию титула: Павел отождествляет обещанного потомка с Помазанником.'
theological_decisions:
- issue: Значение Χριστός в формуле отождествления
  choice: Мессия
  alternative: Христос
  rationale: Перевод «Мессия» раскрывает титульное значение греческого Χριστός и не превращает его лишь в имя собственное.
- issue: Единственное число σπέρμα как основа аргумента Павла
  choice: потомок
  alternative: семя / потомство
  rationale: «Потомок» позволяет русскому читателю непосредственно увидеть единственное число и последующее отождествление с Мессией; сноска сохраняет буквальный и собирательный оттенок исходного слова.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сохраняет риторическое противопоставление Павла, не вводя отсутствующего в греческом временного маркера. Цитаты оформлены ясно, а намеренно значимое различие между «потомку» и «потомкам» сохранено.
