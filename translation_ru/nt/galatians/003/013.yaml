    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Мессия
  rationale: Передаёт греческий титул по смыслу и подчёркивает его мессианское значение; традиционное «Христос» дано как допустимая альтернатива.
- source_word: ἐξηγόρασεν
  choice: искупил
  rationale: Сохраняет представление об освобождении ценой выкупа и естественно передаёт богословскую силу слова в данном контексте.
- source_word: κατάρας / κατάρα
  choice: проклятия / проклятием
  rationale: Прямо сохраняет повтор одного и того же греческого существительного, а также юридическую и заветную остроту формулировки.
- source_word: νόμου
  choice: закона
  rationale: Строчная буква сохраняет формальную неопределённость греческого письма, хотя из контекста ясно, что имеется в виду Моисеев закон.
- source_word: γενόμενος
  choice: став
  rationale: Естественно передаёт обстоятельственное причастие и связь между искуплением и тем, что Мессия стал проклятием.
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: Краткая и естественная русская формулировка сохраняет значение действия ради нашего блага, не сводя предлог к одной теории искупления.
- source_word: ὅτι γέγραπται
  choice: потому что написано
  rationale: Передаёт причинно-пояснительную связь с последующей цитатой; вариант «ведь написано» также возможен.
- source_word: Ἐπικατάρατος
  choice: Проклят
  rationale: Прямой и выразительный эквивалент, соответствующий языку ветхозаветной цитаты.
- source_word: πᾶς ὁ κρεμάμενος
  choice: всякий, кто висит
  rationale: Естественно передаёт обобщающую конструкцию с причастием, не уточняя сверх текста, кем человек был повешен.
- source_word: ξύλου
  choice: дереве
  rationale: Сохраняет формулировку и межтекстовую связь с цитатой из Второзакония; греческое слово буквально может обозначать дерево, древесину или деревянный предмет.
theological_decisions:
- issue: Значение ὑπὲρ ἡμῶν в языке искупления
  choice: за нас
  alternative: ради нас; возможно, вместо нас
  rationale: Основной вариант сохраняет и благодеяние, и представительный оттенок, но не закрепляет в самом переводе более узкое заместительное толкование.
- issue: Предикативное существительное κατάρα
  choice: став проклятием
  alternative: став проклятым
  rationale: Существительное сохранено как существительное, чтобы не смягчать намеренно резкую формулировку Павла и не устранять её богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Синтаксис остаётся компактным и сохраняет резкий повтор слова «проклятие». Формулировки не вводят конфессионально специфического толкования.
