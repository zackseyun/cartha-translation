  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: ru
  text: 'Я хочу узнать от вас только одно: получили ли вы Духа благодаря делам закона или благодаря слышанию с верой[a][b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря слышанию веры»; выражение может также означать, что они приняли услышанную весть с верой.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово, переведённое здесь как «верой», обычно означает «вера» или «доверие»; менее вероятен оттенок «верность».
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: Только одно
  rationale: Сохраняет вынесенное вперёд смысловое ударение и естественно звучит по-русски.
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: хочу узнать от вас
  rationale: Передаёт личный и заострённо-вопросительный тон; «узнать» естественно соответствует μαθεῖν в данном контексте.
- source_word: ἐξ ἔργων νόμου
  choice: благодаря делам закона
  rationale: Передаёт ἐκ как основание или средство получения и сохраняет устойчивое для Павла выражение «дела закона» без добавления толкования.
- source_word: τὸ πνεῦμα
  choice: Духа
  rationale: Контекст Гал 3 указывает на Божьего Духа; прописная буква обозначает этот референт, а слово «Святого» не добавляется, поскольку его нет в греческом тексте.
- source_word: ἐλάβετε
  choice: вы получили
  rationale: Совершенный вид естественно передаёт состоявшееся в прошлом получение, к которому обращается риторический вопрос Павла.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: благодаря тому, что услышали и поверили
  rationale: 'Естественно передаёт наиболее вероятный смысл сжатой генитивной конструкции: услышанное сопровождалось верой. Возможная более буквальная передача сохранена в примечании.'
- source_word: πίστεως
  choice: поверили
  rationale: Глагольная форма естественно выражает здесь πίστις как веру или доверие; менее вероятный оттенок верности отмечен отдельно.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Божьего, то есть Святого, Духа
  alternative: духовный опыт или духовную силу в более общем смысле
  rationale: Непосредственный контекст Гал 3 говорит о получении верующими Божьего Духа; при этом в основной текст не добавляется отсутствующее в греческом слово «Святой».
- issue: Связь ἀκοῆς и πίστεως
  choice: услышать и поверить
  alternative: «слышание веры» либо услышанное свидетельство о вере
  rationale: Греческая генитивная конструкция сжата и допускает несколько способов анализа; основной вариант ясно передаёт вероятный контраст между делами закона и откликом веры, не устраняя альтернативу из примечания.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет риторическую резкость вопроса Павла; богословски значимая неоднозначность выражения ἀκοῆς πίστεως вынесена в примечания.
