  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: ru
  text: Нет ни иудея, ни грека; нет ни раба, ни свободного; нет мужчины и женщины[a], потому что все вы — одно в Мессии Иисусе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом: «нет мужчины и женщины». В отличие от двух предыдущих пар, здесь употреблён союз «и»; это, вероятно, повторяет формулу из Бытия 1:27.'
    reason: Сохранить необычный союз «и» и отметить вероятную межтекстовую отсылку.
  - marker: b
    text: 'По-гречески: «во Христе Иисусе»; здесь Χριστός передано как титул «Мессия».'
    reason: Пояснить титульный перевод «Мессия» и порядок слов, соответствующий греческой формуле и естественный для русского языка.
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: нет
  rationale: Русское «нет» естественно передаёт повторяющееся экзистенциальное отрицание и позволяет сохранить выразительный параллелизм.
- source_word: Ἰουδαῖος οὐδὲ Ἕλλην
  choice: ни иудея, ни грека
  rationale: 'Сохранена конкретная этнорелигиозная пара: Ἕλλην означает здесь «грек», а не более широкое «язычник».'
- source_word: δοῦλος οὐδὲ ἐλεύθερος
  choice: ни раба, ни свободного
  rationale: «Раб» прямо передаёт несвободный социально-правовой статус δοῦλος и образует точную пару со «свободным».
- source_word: ἄρσεν καὶ θῆλυ
  choice: мужчины и женщины
  rationale: Слова переданы как обозначения пола; союз «и» сохранён, поскольку в греческом здесь καὶ, а не οὐδὲ, что, вероятно, отсылает к Бытие 1:27.
- source_word: πάντες γὰρ ὑμεῖς εἷς ἐστε
  choice: потому что все вы — одно
  rationale: «Все вы» сохраняет обращённость и коллективный акцент, а «одно» — краткость и грамматический средний род греческого εἷς без пояснительного добавления «один человек» или «едины».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  rationale: Χριστός передан как титул «Мессия»; порядок изменён ради естественного русского выражения, ясно показывающего, что «Мессия» — титул Иисуса.
theological_decisions:
- issue: Передача смены οὐδὲ на καὶ в паре ἄρσεν καὶ θῆλυ
  choice: нет мужчины и женщины
  alternative: нет ни мужчины, ни женщины
  rationale: Несколько необычная конструкция сохраняет союз «и» и вероятную отсылку к формуле творения в Бытие 1:27, не сглаживая значимую особенность греческого текста.
- issue: Толкование εἷς ἐστε
  choice: все вы — одно
  alternative: все вы едины
  rationale: Буквальная предикативная формула сохраняет утверждение о единстве, не уточняя сверх текста, означает ли оно одну личность, общность или согласие.
- issue: Передача Χριστός как титула
  choice: Иисус Мессия
  alternative: Христос Иисус
  rationale: «Мессия» сохраняет титульную силу Χριστός и не превращает его без пояснения в имя; русский порядок делает титул прозрачным.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским ритмом. Трёхчастный параллелизм сохранён точками с запятой; архаизмы и конфессионально маркированные пояснения не вводятся.
