id: GAL.3.11
reference: Galatians 3:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: ru
  text: Ясно, что законом никто не оправдывается перед Богом, потому что «праведный будет жить верой»[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведный будет жить благодаря верности». Возможен также перевод: «тот, кто праведен благодаря вере, будет жить».'
    reason: lexical_alternative
  - marker: b
    text: Павел цитирует Аввакума 2:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Ясно, что
  rationale: Частица δὲ обозначает мягкий переход в рассуждении; по-русски отдельный союз здесь не требуется, а связь естественно передаётся построением фразы.
- source_word: ἐν νόμῳ
  choice: законом
  rationale: В данном юридическом контексте ἐν указывает на средство или основание; творительный падеж естественно передаёт смысл «посредством закона».
- source_word: οὐδεὶς
  choice: никто
  rationale: Сохраняет всеобщий характер отрицания.
- source_word: δικαιοῦται
  choice: не оправдывается
  rationale: 'Передаёт юридический смысл глагола: признание праведным перед Божьим судом, не сводя его к нравственному исправлению.'
- source_word: παρὰ τῷ θεῷ
  choice: перед Богом
  rationale: Передаёт положение человека по отношению к Божьему суду и сохраняет судебный оттенок выражения.
- source_word: δῆλον
  choice: ясно
  rationale: Краткий и естественный русский эквивалент без излишнего усиления.
- source_word: Ὁ δίκαιος
  choice: праведный
  rationale: Субстантивированное прилагательное естественно передаётся по-русски словом «праведный».
- source_word: ἐκ πίστεως
  choice: верой
  rationale: Творительный падеж даёт естественное русское выражение и сохраняет основное значение πίστις как веры; возможное значение «верность» вынесено в примечание.
- source_word: ζήσεται
  choice: будет жить
  rationale: Точно и современно передаёт форму будущего времени.
theological_decisions:
- issue: Смысл и синтаксическая связь выражения Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: «праведный будет жить верой»
  alternative: «тот, кто праведен благодаря вере, будет жить»; «праведный будет жить благодаря верности»
  rationale: Основной текст следует наиболее естественному прочтению цитаты у Павла, связывая «верой» с «будет жить». Греческое выражение допускает иную синтаксическую связь, а πίστις — значение «верность»; эти возможности не используются для однозначного догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным звучанием. Сохранена юридическая лексика Павлова рассуждения; цитата оформлена естественно для современного читателя без архаизации.
