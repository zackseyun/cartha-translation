id: GAL.3.17
reference: Galatians 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: ru
  text: 'Вот что я имею в виду: закон, появившийся четыреста тридцать лет спустя, не отменяет[a] завет, прежде утверждённый Богом, так, чтобы лишить обещание силы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не аннулирует».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделать обещание недействительным» или «отменить обещание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Вот что я имею в виду
  rationale: Естественно вводит пояснение Павла; частица δέ передана связностью всей вводной формулы без добавления временного «теперь».
- source_word: διαθήκην
  choice: завет
  rationale: В контексте речь идёт о Божьем обещании Аврааму и установленных Богом отношениях; «завет» точнее, чем «завещание» или общее «соглашение».
- source_word: προκεκυρωμένην
  choice: прежде утверждённый
  rationale: Передаёт как предшествование, выраженное приставкой προ-, так и сохраняющийся результат утверждения, заключённый в форме перфекта.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Богом
  rationale: Прямая передача действующего лица без добавочного усиления.
- source_word: ὁ ... γεγονὼς νόμος
  choice: закон, появившийся
  rationale: Передаёт историческое появление закона позднее завета и звучит естественно по-русски.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: четыреста тридцать лет спустя
  rationale: Ясно выражает указанный в тексте временной промежуток и последующее появление закона.
- source_word: οὐκ ἀκυροῖ
  choice: не отменяет
  rationale: Сохраняет юридический оттенок глагола ἀκυρόω и остаётся понятным современному читателю.
- source_word: εἰς τὸ καταργῆσαι
  choice: так, чтобы лишить ... силы
  rationale: Передаёт целевой или результативный оттенок конструкции εἰς τό с инфинитивом, не сводя её однозначно только к цели либо только к результату.
- source_word: τὴν ἐπαγγελίαν
  choice: обещание
  rationale: Контекстуально точное обозначение Божьего обещания, данного Аврааму.
theological_decisions:
- issue: Значение διαθήκη в доводе Павла
  choice: завет
  alternative: завещание; юридическое распоряжение
  rationale: Ближайший контекст сосредоточен на Божьем обещании Аврааму; «завет» сохраняет библейско-историческую направленность довода, не превращая его в рассуждение исключительно о человеческом завещании.
- issue: Отношение закона к ранее данному обещанию
  choice: закон не отменяет завет и не лишает обещание силы
  alternative: закон заменяет прежнее установление
  rationale: Перевод сохраняет прямое утверждение Павла о непреходящей силе ранее утверждённого завета и не добавляет конфессионального объяснения того, как именно соотносятся закон и обещание.
- issue: Смысл εἰς τὸ καταργῆσαι
  choice: так, чтобы лишить обещание силы
  alternative: в результате чего обещание было бы упразднено; с целью упразднить обещание
  rationale: Формулировка сохраняет возможное сочетание цели и результата в греческой конструкции и не устраняет её смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Юридические оттенки лексики завета сохранены без перегруженности специальными терминами; порядок частей предложения сделан естественным для русского языка.
