  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: ru
  text: Но прежде чем пришла вера[a], мы находились под Законом и содержались под стражей[b], заключённые[c] до того времени, когда предстояло открыться вере.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде чем пришла эта вера». В греческом перед словом «вера» стоит артикль; выражение может указывать на эпоху веры, наступившую с приходом Христа.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «были под охраной». Греческий глагол допускает как охранительный смысл, так и значение содержания под стражей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «запертые»; возможно также: «лишённые свободы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ δὲ ἐλθεῖν
  choice: Но прежде чем пришла
  rationale: Конструкция πρό с артиклевым инфинитивом выражает предшествование во времени; «прежде чем пришла» естественно передаёт её по-русски, а «но» отражает мягкое противопоставление, выраженное δέ.
- source_word: τὴν πίστιν
  choice: вера
  rationale: Основное значение πίστις в данном контексте — «вера». Артикль может указывать не только на личную веру, но и на наступившую с Христом эпоху веры; эта смысловая широта сохранена без поясняющей вставки в основной текст.
- source_word: ὑπὸ νόμον
  choice: под Законом
  rationale: Выражение обозначает пребывание под властью или порядком Моисеева Закона. Раздельная конструкция «находились под Законом» не превращает Закон в непосредственного исполнителя действия «содержались под стражей».
- source_word: ἐφρουρούμεθα
  choice: содержались под стражей
  rationale: Имперфект пассивного залога передаёт продолжавшееся состояние в прошлом. Выражение сохраняет как охранительный, так и ограничительный оттенок глагола φρουρέω.
- source_word: συγκλειόμενοι
  choice: заключённые
  rationale: Причастие обозначает состояние замкнутости или ограничения и усиливает образ содержания под стражей, не уточняя буквально тюрьму.
- source_word: εἰς
  choice: до того времени, когда
  rationale: В данном контексте εἰς направляет описанное состояние к будущему откровению веры и естественно передаётся как временный предел.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: когда должна была открыться вера
  rationale: Оборот сохраняет будущую направленность μέλλουσαν и пассивно-откровенный смысл ἀποκαλυφθῆναι, избегая тяжёлого буквального сочетания «вера, которой предстояло быть открытой».
theological_decisions:
- issue: Означает ли πίστις личную веру или исторически наступившую реальность веры, связанную с приходом Христа
  choice: «вера» с сохранением возможного историко-спасительного смысла
  alternative: «эта вера» или «эпоха веры»
  rationale: Артикль и контекст Гал 3 допускают указание на новую эпоху, однако добавление слова «эпоха» разрешило бы сохраняемую греческим текстом смысловую напряжённость.
- issue: Как представить роль Закона в образе охраны и заключения
  choice: «находились под Законом и содержались под стражей»
  alternative: «Закон держал нас под стражей»
  rationale: Греческое ὑπὸ νόμον означает «под Законом», но грамматически не называет Закон прямым действующим лицом пассивного глагола. Выбранная формулировка не усиливает агентность Закона сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкой аудитории; повтор слова «вера» сохранён вслед за греческим текстом, а различие между пребыванием под Законом и содержанием под стражей выражено явно.
