  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: ru
  text: Подобно тому как Авраам поверил Богу, это было засчитано ему как праведность[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость».'
    reason: Лексическая альтернатива для δικαιοσύνη.
lexical_decisions:
- source_word: καθὼς
  choice: Так
  rationale: Вводит пример Авраама, непосредственно поясняющий предыдущее утверждение; по-русски в данной синтаксической связи естественно «Так», при сохранении сопоставительной силы греческого слова.
- source_word: Ἀβραὰμ
  choice: Авраам
  rationale: Традиционная русская передача библейского имени.
- source_word: ἐπίστευσεν
  choice: поверил
  rationale: Аорист πιστεύω передан совершенным видом; «поверил Богу» прямо отражает конструкцию с дательным и не добавляет значения «верил в существование Бога».
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный при πιστεύω означает, что Авраам принял Божье слово как истинное; русское «поверил Богу» точно сохраняет эту конструкцию.
- source_word: ἐλογίσθη
  choice: было вменено
  rationale: Передаёт пассивную форму λογίζομαι и её значение засчитывания или приписывания; традиционный богословский термин остаётся понятным в контексте.
- source_word: αὐτῷ
  choice: ему
  rationale: Сохраняет дательный лица, которому было вменено названное.
- source_word: εἰς δικαιοσύνην
  choice: в праведность
  rationale: Формально сохраняет εἰς и устойчивую русскую формулу цитаты Бытия, не уточняя сверх текста механизм или характер вменения.
theological_decisions:
- issue: Значение δικαιοσύνη в цитате Павла
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» соответствует контексту признанного Богом статуса и традиции цитаты Бытия; возможное более широкое значение «справедливость» сохранено в примечании, чтобы не скрывать семантический диапазон.
- issue: Подлежащее пассивного ἐλογίσθη
  choice: это было вменено ему
  alternative: вера была вменена ему
  rationale: Греческий текст не называет существительное «вера» подлежащим; местоименное «это» сохраняет анафорическую отсылку к тому, что Авраам поверил, не делая её более узкой, чем оригинал.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой библейской формулы. Запятая в конце отражает синтаксическое продолжение мысли в следующем стихе.
