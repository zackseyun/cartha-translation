  text: τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: ru
  text: Неужели вы столько претерпели напрасно? Если только и в самом деле напрасно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели вы столько пережили напрасно?»'
    reason: Лексема ἐπάθετε может обозначать не только страдание, но и пережитый опыт вообще.
lexical_decisions:
- source_word: τοσαῦτα
  choice: столько
  rationale: Передаёт неопределённо-множественный объём пережитого без громоздкого «столько всего».
- source_word: ἐπάθετε
  choice: претерпели
  rationale: В данном контексте естественно выражает перенесённые страдания и испытания, сохраняя возможность более широкого значения, указанного в сноске.
- source_word: εἰκῇ
  choice: напрасно
  rationale: Точно передаёт идею тщетности и отсутствия результата; повтор сохранён ради риторического эффекта.
- source_word: εἴ γε καὶ
  choice: если только и в самом деле
  rationale: Сохраняет условную, несколько оговорочную силу εἴ γε и усилительный оттенок καὶ, не превращая фразу в категорическое утверждение.
theological_decisions:
- issue: Считает ли Павел пережитое галатами окончательно напрасным
  choice: 'Сохранена условная оговорка: «Если только и в самом деле напрасно»'
  alternative: «Впрочем, неужели действительно напрасно?»
  rationale: Греческий текст выражает риторическое опасение с оговоркой, а не однозначный вывод; перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой риторикой. «Претерпели» здесь понятно и уместно в возвышенном апостольском обращении, но не чрезмерно архаично.
