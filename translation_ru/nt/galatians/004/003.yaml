  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: ru
  text: Так и мы, когда были детьми, были в рабстве под властью стихий мира[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основных начал мира» или «элементов мира». Греческое слово может обозначать основные начала или элементы, а также космические духовные силы.'
    reason: Альтернативное понимание многозначного выражения τὰ στοιχεῖα τοῦ κόσμου.
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Так и
  rationale: Передаёт аналогию с предшествующим примером наследника и естественно связывает рассуждение.
- source_word: ἡμεῖς
  choice: мы
  rationale: Сохраняет явно выраженное и потому акцентированное местоимение первого лица множественного числа.
- source_word: ὅτε ἦμεν νήπιοι
  choice: пока были детьми
  rationale: Передаёт временное значение и состояние несовершеннолетия в продолжающейся аналогии; «детьми» звучит естественнее юридического «несовершеннолетними».
- source_word: ὑπὸ τὰ στοιχεῖα τοῦ κόσμου
  choice: у начал мира
  rationale: Оборот «в рабстве у» естественно выражает подчинённость, а «начала мира» сохраняет смысловую широту спорного στοιχεῖα, не сводя его заранее ни к принципам, ни к духовным силам.
- source_word: ἤμεθα δεδουλωμένοι
  choice: находились в рабстве
  rationale: Сохраняет сильную лексику рабства и передаёт длительное состояние, выраженное перифрастической глагольной формой.
theological_decisions:
- issue: Значение τὰ στοιχεῖα τοῦ κόσμου
  choice: «начала мира» в основном тексте
  alternative: «стихийные силы мира», «основополагающие принципы мира» или «стихии мира»
  rationale: Греческое выражение допускает понимание как основных элементов или принципов, так и космических духовных сил. Более широкое «начала мира» сохраняет эту неоднозначность, а сноска обозначает основные варианты.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и достойная по тону. «Находились в рабстве у» звучит естественно и сохраняет образ подчинения; «начала мира» намеренно не устраняет неоднозначность оригинала.
