    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Итак
  rationale: Передаёт вывод из предшествующего аллегорического рассуждения и естественно звучит по-русски.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет мужскую форму обращения в греческом; в данном контексте она может представительно охватывать всю общину, что отмечено в сноске.
- source_word: οὐκ ἐσμὲν
  choice: мы … не
  rationale: Точно передаёт настоящее время и простое отрицание без добавления отсутствующего значения «уже не».
- source_word: παιδίσκης
  choice: рабыни
  rationale: Существительное обозначает женщину в рабском или зависимом положении; «рабыня» ясно сохраняет существенный для контраста статус Агари.
- source_word: τέκνα
  choice: дети
  rationale: Передаёт гендерно инклюзивное значение потомства и естественно сочетается с родительным падежом.
- source_word: ἀλλὰ
  choice: а
  rationale: В русской отрицательно-противительной конструкции «не …, а …» это наиболее естественный эквивалент.
- source_word: τῆς ἐλευθέρας
  choice: свободной женщины
  rationale: Субстантивированное прилагательное женского рода относится к Сарре; существительное делает референта ясным и сохраняет противопоставление рабству.
theological_decisions:
- issue: Насколько явно передать аллегорическое противопоставление Агари и Сарры
  choice: «рабыни … свободной женщины»
  alternative: «служанки … свободной»
  rationale: Формулировка сохраняет центральное для Павлова рассуждения противопоставление рабства и свободы, не добавляя сверх текста иных богословских выводов.
- issue: Как передать ἀδελφοί при обращении к смешанной общине
  choice: «братья» в основном тексте со сноской
  alternative: «братья и сёстры»
  rationale: Сохраняется грамматическая форма оригинала, а возможный представительный охват мужчин и женщин разъясняется читателю.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественно-сдержанная формулировка. Конструкция «не …, а …» естественно передаёт греческое противопоставление. Повтор слова «женщина» в первой части опущен как избыточный по-русски, но женский референт ясно выражен словом «рабыня».
