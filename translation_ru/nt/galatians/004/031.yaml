  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: ru
  text: Итак, братья[a], мы не дети рабыни[b], а свободной женщины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово буквально означает «братья», но может служить обращением ко всей общине, включая женщин.'
