  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: οἴδατε — «вы знаете», причинное δι’ ἀσθένειαν — «из-за ... болезни», телесный смысл τῆς σαρκὸς, возвещение εὐηγγελισάμην адресатам ὑμῖν и указание на первоначальный случай τὸ πρότερον — «в первый раз». «Телесная болезнь» обоснованно отражает наиболее вероятный контекстуальный смысл, не исключая в примечании значения «слабость».'
