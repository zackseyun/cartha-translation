  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: ru
  text: Но вы знаете, что из-за телесной болезни[a] я в первый раз возвестил вам Радостную весть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за телесной слабости». Буквально: «из-за слабости (или болезни) плоти».'
    reason: Существительное ἀσθένεια может означать как болезнь, так и слабость, а τῆς σαρκὸς буквально значит «плоти».
lexical_decisions:
- source_word: οἴδατε
  choice: вы знаете
  rationale: Форма οἶδα имеет настоящее значение; естественно передаёт обращение Павла к известным галатам обстоятельствам.
- source_word: δὲ
  choice: но
  rationale: Обозначает мягкий контраст и переход от предшествующей мысли.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: из-за телесной болезни
  rationale: διά с винительным указывает на причину, а сочетание ἀσθένεια с σάρξ здесь, вероятнее всего, означает физический недуг. В сноске сохранена возможная широта значения «слабость».
- source_word: εὐηγγελισάμην
  choice: возвестил Радостную весть
  rationale: Передаёт действие глагола εὐαγγελίζω понятным современным языком, сохраняя смысл благовестия.
- source_word: ὑμῖν
  choice: вам
  rationale: Естественная передача дательного падежа адресата.
- source_word: τὸ πρότερον
  choice: в первый раз
  rationale: В данном контексте выражение указывает на первый случай пребывания и благовестия Павла у галатов; формулировка также оставляет возможным последующее посещение.
theological_decisions:
- issue: Значение σάρξ в выражении ἀσθένειαν τῆς σαρκὸς
  choice: физический, телесный смысл
  alternative: общая слабость; нравственно понимаемая «плоть»
  rationale: Контекст говорит об обстоятельствах первого благовестия Павла и реакции галатов на его телесное состояние (ср. следующий стих), поэтому нравственный смысл здесь неуместен. При этом сноска сохраняет лексическую неоднозначность между болезнью и телесной слабостью.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной формулировкой. «Радостная весть» выбрана как понятная передача содержания εὐαγγελίζω; прописная буква указывает на конкретную весть о Христе без введения конфессиональной терминологии.
