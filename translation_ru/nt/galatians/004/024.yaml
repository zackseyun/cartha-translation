base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: ru
  text: 'Всё это истолковывается иносказательно[a]: эти женщины — два завета. Один — от горы Синай, рождающий детей в рабство[b]; этот завет — Агарь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё это имеет иносказательный смысл»; или: «всё это является иносказанием». Греческое выражение указывает, что Павел истолковывает предшествующее повествование иносказательно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для рабства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Всё это
  rationale: Средний род множественного числа отсылает к предшествующему повествованию; «всё это» естественно передаёт анафорическую связь.
- source_word: ἀλληγορούμενα
  choice: истолковывается иносказательно
  rationale: Перифрастическая пассивная конструкция указывает на способ истолкования или использования повествования, не отрицая его исторической основы.
- source_word: αὗται
  choice: эти женщины
  rationale: Форма женского рода множественного числа отсылает к Сарре и Агари; существительное добавлено для ясности.
- source_word: διαθῆκαι
  choice: завета
  rationale: В контексте Синая διαθήκη обозначает завет, а не завещание или обычное соглашение.
- source_word: μία μὲν ἀπὸ ὄρους Σινᾶ
  choice: Один — от горы Синай
  rationale: Передаёт первый член противопоставления, продолжение которого следует далее, и сохраняет указание на происхождение завета.
- source_word: εἰς δουλείαν
  choice: в рабство
  rationale: Предлог εἰς выражает направленность или результат, а δουλεία — состояние рабства.
- source_word: γεννῶσα
  choice: рождает детей
  rationale: Сохраняет материнский образ аллегорического сопоставления и длительное значение причастия настоящего времени.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: представлен Агарью
  rationale: Передаёт отождествление завета с Агарью в рамках иносказательного истолкования, избегая неестественного русского «который есть Агарь».
theological_decisions:
- issue: Характер использования Павлом повествования о Сарре и Агари
  choice: «истолковывается иносказательно» — указание на способ прочтения и риторического использования повествования
  alternative: «является аллегорией» или понимание этих слов как отрицания историчности рассказа
  rationale: ἀλληγορούμενα обозначает аллегорическое истолкование; формулировка не утверждает и не отрицает историчность действующих лиц сверх сказанного текстом.
- issue: Смысл δουλεία
  choice: рабство
  alternative: неволя; зависимость; служение
  rationale: В противопоставлении двух заветов существенна именно несвобода; «рабство» сохраняет силу греческого слова.
- issue: Отождествление первого завета с Агарью
  choice: «представлен Агарью»
  alternative: «он и есть Агарь»
  rationale: Выбранная формулировка ясно сохраняет иносказательное соответствие, не превращая его в буквальное тождество.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Иносказательно» понятно широкому читателю и передаёт аллегорический способ истолкования. Двоеточие английского слоя заменено разделением на предложения ради естественного русского синтаксиса; связь между женщинами и заветами выражена словом «представляют».
