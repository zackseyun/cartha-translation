  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: ru
  text: Но хорошо, когда вас всегда ревностно добиваются с добрыми намерениями[b][a], а не только тогда, когда я с вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хорошо всегда ревностно стремиться к доброму» / «проявлять рвение к доброму». Греческий инфинитив ζηλοῦσθαι можно понимать по-разному, однако пассивное значение хорошо согласуется с предыдущим стихом, где другие ревностно добиваются галатов.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в добром». Это выражение может указывать на добрую направленность стремления, добрые намерения или доброе дело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: хорошо
  rationale: Предикативное прилагательное при инфинитиве естественно передаётся по-русски безличной конструкцией «хорошо, когда…».
- source_word: δὲ
  choice: но
  rationale: Союз обозначает противопоставление дурным намерениям людей, упомянутых в предыдущем стихе.
- source_word: ζηλοῦσθαι
  choice: когда вас… ревностно ищут
  rationale: Форма является инфинитивом настоящего времени в пассивном залоге. В контексте стихов 17–18 речь, вероятнее всего, о том, что галатов настойчиво добиваются; добавленное «вас» ясно выражает подразумеваемый объект и связь с предыдущим стихом.
- source_word: ἐν καλῷ
  choice: ради доброго дела
  rationale: Буквально «в добром»; русская формулировка передаёт благую цель или нравственно добрый характер стремления, не сводя выражение только к внутренним мотивам.
- source_word: πάντοτε
  choice: всегда
  rationale: Кратко и естественно передаёт постоянство, противопоставленное присутствию Павла лишь в определённое время.
- source_word: καὶ μὴ μόνον
  choice: а не только
  rationale: В русском контексте сочетание естественно вводит противопоставление временного ограничения.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: тогда, когда я нахожусь у вас
  rationale: Конструкция с артиклевым инфинитивом выражает время; «нахожусь у вас» естественно передаёт личное присутствие Павла среди галатов.
theological_decisions:
- issue: Залог и смысл ζηλοῦσθαι
  choice: 'пассивное значение: галатов ревностно ищут другие'
  alternative: «ревновать о добром» / «проявлять рвение»
  rationale: Пассивная форма и непосредственный контекст стиха 17, где другие ревностно добиваются галатов, поддерживают пассивное прочтение. Однако греческая формулировка допускает понимание, при котором речь идёт о проявлении рвения, поэтому оно сохранено в примечании.
- issue: Смысл ἐν καλῷ
  choice: ради доброго дела
  alternative: «в добром» / «с добрыми намерениями»
  rationale: Выражение допускает оттенки сферы, способа, мотива или цели. Основной текст передаёт благую направленность стремления, а примечание сохраняет буквальную широту.
translation_notes:
  register: Современный литературный русский язык; тон простой и достойный. Формулировка «ревностно ищут» сохраняет связь с повтором греческого корня ζηλόω в стихах 17–18, хотя по-русски она несколько менее идиоматична, чем более истолковывающее «настойчиво добиваются».
