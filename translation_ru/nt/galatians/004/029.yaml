id: GAL.4.29
reference: Galatians 4:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: ru
  text: Но как тогда рождённый по плоти преследовал рождённого по Духу[a][b], так и теперь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рождённый обычным человеческим путём»; буквально: «рождённый по плоти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «того, кто по Духу»; слово «рождённого» восполнено из первой части для ясности параллели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Кратко и естественно передаёт противопоставление предыдущему рассуждению.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: как тогда ... так и теперь
  rationale: Сохраняет греческую соотносительную конструкцию и временное сопоставление без ненужного восполнения сказуемого.
- source_word: ὁ ... γεννηθεὶς
  choice: рождённый
  rationale: Субстантивированное страдательное причастие естественно передаётся по-русски причастием; пропущенное во второй части слово повторено для ясности параллели.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет ключевую лексику Павла и противопоставление «плоть — Дух», не сводя выражение ни к греховной природе, ни исключительно к способу зачатия.
- source_word: ἐδίωκε
  choice: преследовал
  rationale: Передаёт в данном контексте враждебное притеснение; несовершенный вид естественно соответствует длительному или повторявшемуся действию имперфекта.
- source_word: τὸν κατὰ πνεῦμα
  choice: рождённого по Духу
  rationale: Слово «рождённого» восполнено из первой части, чтобы ясно сохранить параллелизм; «по Духу» не сужает значение κατά до одного лишь обозначения средства.
- source_word: πνεῦμα
  choice: Дух
  rationale: Контекст Послания к галатам и связь с обещанием указывают прежде всего на Святого Духа; прописная буква отражает это понимание.
- source_word: νῦν
  choice: теперь
  rationale: Естественный современный русский эквивалент, противопоставленный «тогда».
theological_decisions:
- issue: Значение κατὰ σάρκα в противопоставлении Измаила и Исаака
  choice: «по плоти» — рождение обычным человеческим путём, в отличие от рождения, связанного с обещанием и действием Духа
  alternative: «по греховной природе» или «обычным человеческим способом» в основном тексте
  rationale: Непосредственный контекст Гал 4:23, 29 говорит о двух рождениях. Буквальное выражение сохраняет богословскую напряжённость и словесную связь с Павловым противопоставлением плоти и Духа, а примечание поясняет наиболее вероятный смысл.
- issue: Кого обозначает πνεῦμα
  choice: Святого Духа
  alternative: человеческий дух или безличное духовное начало
  rationale: В контексте обещания и идентичности верующих у Павла речь, вероятнее всего, идёт о Божьем Духе. При этом формулировка «по Духу» сохраняет неоднозначность отношения κατά — происхождение, соответствие или определяющая сфера.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и риторического параллелизма оригинала. Формулы «по плоти» и «по Духу» оставлены как значимые термины Павла; примечания помогают обычному читателю, не устраняя смысловую напряжённость.
