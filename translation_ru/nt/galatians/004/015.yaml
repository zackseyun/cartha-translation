base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: ru
  text: 'Куда же делось ваше блаженство?[a] Ведь я свидетельствую вам: если бы это было возможно, вы вырвали бы свои глаза[b] и отдали их мне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда делось ваше ощущение благословения?» Греческое слово может обозначать блаженное состояние или признание кого-либо блаженным.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выкопав (выколов) свои глаза». Это, вероятно, гипербола, выражающая прежнюю преданность галатов, хотя некоторые видят здесь намёк на телесный недуг Павла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Куда же делось
  rationale: Риторический вопрос в контексте спрашивает, что стало с прежним отношением галатов; такая передача естественно выражает смысл ποῦ и связующую силу οὖν.
- source_word: μακαρισμὸς ὑμῶν
  choice: ваше блаженство
  rationale: μακαρισμός может обозначать блаженное состояние, признание кого-либо блаженным или ощущение благословения. «Блаженство» сохраняет эту смысловую широту, не сводя выражение только к радости.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Ведь я свидетельствую о вас
  rationale: Передаёт торжественный, удостоверяющий оттенок μαρτυρέω; дательный ὑμῖν здесь естественно понимать как указание на тех, в чью пользу Павел свидетельствует.
- source_word: εἰ δυνατὸν
  choice: если бы это было возможно
  rationale: Русская условная форма ясно передаёт фактически нереальное условие, оставаясь близкой к краткому греческому выражению.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: вы вырвали бы свои глаза
  rationale: Сохраняется конкретный и предельно сильный образ оригинала; «вырвали» естественно по-русски передаёт значение ἐξορύσσω в данном контексте.
- source_word: ἐδώκατέ μοι
  choice: и отдали их мне
  rationale: Прямо передаёт главное действие аориста; местоимение «их» ясно отсылает к глазам.
theological_decisions:
- issue: Следует ли понимать упоминание глаз буквально, как намёк на телесный недуг Павла, или как гиперболу о преданности галатов
  choice: 'В основном тексте сохранён буквальный образ: «вырвали бы свои глаза и отдали их мне».'
  alternative: 'Обобщить: «вы отдали бы мне всё» или истолковать слова как прямое указание на болезнь глаз у Павла.'
  rationale: Греческий текст прямо называет глаза и употребляет сильный глагол. Перевод не должен ни ослаблять образ, ни решать, является ли он только гиперболой или также намёком на состояние Павла.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Риторическая острота вопроса и нарочито сильный образ сохранены; синтаксис сделан естественным для обычного современного читателя.
