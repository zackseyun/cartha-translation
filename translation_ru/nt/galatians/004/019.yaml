  text: Дети мои, ради которых я снова испытываю родовые муки[c], пока в вас не сформируется Мессия[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». «Христос» — привычная русская передача титула Χριστός.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «среди вас», если речь идёт прежде всего об общине в целом.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «я снова мучаюсь родами» или «снова испытываю родовые муки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Дети мои
  rationale: Ласковое обращение во множественном числе; «дети мои» естественно передаёт близость, не добавляя уменьшительного оттенка, которого само τέκνα не требует.
- source_word: οὓς
  choice: ради вас
  rationale: Формально это «которых», но в сочетании с метафорой родовых мук по-русски естественнее выразить отношение как «ради вас», сохранив смысл направленного на галатов страдания Павла.
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторность действия.
- source_word: ὠδίνω
  choice: терплю родовые муки
  rationale: Сохраняет яркую метафору родов и передаёт продолжающееся мучительное усилие без архаизма.
- source_word: μέχρις οὗ
  choice: пока не
  rationale: Естественно вводит временной предел и ожидаемый результат.
- source_word: μορφωθῇ
  choice: не сформируется
  rationale: 'Передаёт пассивное значение аориста конъюнктива: Мессия должен обрести форму в адресатах; русская возвратная конструкция звучит естественнее буквального «не будет сформирован».'
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт титул Χριστός его смысловым русским соответствием; привычный вариант «Христос» указан в сноске.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Сохраняет наиболее прямое значение предлога и допускает как личностный, так и общий для всей общины оттенок.
theological_decisions:
- issue: Смысл выражения «Мессия сформируется в вас»
  choice: Сохранена метафора внутреннего формирования Мессии в адресатах без сведения её к определённому догматическому механизму.
  alternative: Понимать выражение преимущественно корпоративно — как формирование Мессии среди общины — либо исключительно как образ обращения и нового рождения.
  rationale: Греческое множественное ὑμῖν допускает личный и общинный аспекты. Перевод «в вас» сохраняет эту напряжённость, а сноска отмечает возможное «среди вас».
translation_notes:
  register: Современный литературный русский язык; тон тёплый и пастырский, но метафора родовых мук сохранена во всей её выразительности. Порядок слов слегка адаптирован ради естественности русской речи.
