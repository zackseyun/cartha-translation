  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: ru
  text: Но сын рабыни родился по плоти[a], а сын свободной — по обещанию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обычным человеческим путём»; буквально: «по плоти».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть в силу Божьего обещания, а не только вследствие обычного человеческого зачатия. Возможный перевод: «благодаря обещанию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: рабыня
  rationale: Слово прямо передаёт несвободное положение Агари, существенное для противопоставления в доводе Павла, и звучит естественно в современном русском языке.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохранён ключевой для Павла термин «плоть». Здесь он обозначает обычное человеческое рождение, а не греховность тела; смысловая альтернатива дана в сноске.
- source_word: γεγέννηται
  choice: родился
  rationale: Естественный русский эквивалент греческого перфекта в данном повествовательном противопоставлении; форма «был рождён» была бы тяжеловесной.
- source_word: ἐλευθέρα
  choice: свободная
  rationale: Субстантивированное прилагательное передаёт общественное положение Сарры и сохраняет прямой контраст с рабыней.
- source_word: δι’ ἐπαγγελίας
  choice: по обещанию
  rationale: Предлог διά с родительным указывает на средство или основание осуществления рождения. «По обещанию» естественно по-русски и сохраняет лаконичность греческой фразы без внесения отсутствующего артикля.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: сын ... а сын
  rationale: Подразумеваемое существительное «сын» восполнено в обеих частях ради ясности русского текста; противительная конструкция передана союзом «а».
theological_decisions:
- issue: Противопоставление κατὰ σάρκα и δι’ ἐπαγγελίας
  choice: «по плоти» противопоставлено «по обещанию» как обычное человеческое рождение — рождению, совершившемуся в силу Божьего обещания
  alternative: «обычным человеческим путём» и «благодаря Божьему обещанию»
  rationale: Основной текст сохраняет терминологию и напряжение формулировки Павла, не представляя телесное рождение греховным. Контекстуальный смысл пояснён в сносках.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественно-нейтральный. Сохранены парность конструкции и богословски значимый термин «плоть», а смысловые пояснения вынесены в сноски.
