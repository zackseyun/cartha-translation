source:
  edition: SBLGNT
  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: ru
  text: Но мне хотелось бы сейчас быть с вами и изменить свой тон, потому что я в недоумении относительно вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изменить свой голос»; вероятно, имеется в виду изменить тон или манеру речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: как бы мне хотелось
  rationale: Имперфект θέλω здесь естественно передаёт смягчённое, пока неосуществимое желание Павла; русская конструкция сохраняет эту модальность.
- source_word: δὲ
  choice: но
  rationale: Передаёт лёгкий контраст и переход от предшествующего обращения к выражению личного желания.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: быть с вами
  rationale: Естественно передаёт личное присутствие Павла среди адресатов без тяжеловесного буквализма.
- source_word: ἄρτι
  choice: сейчас
  rationale: Выражает непосредственность желания; в данном порядке слов звучит естественно и достаточно настойчиво.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: говорить с вами иначе
  rationale: Буквально выражение означает «изменить мой голос», но в контексте речь, вероятно, идёт о тоне или манере обращения. Формулировка передаёт смысл, не ограничивая его только акустическим голосом.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит причину высказанного желания.
- source_word: ἀποροῦμαι
  choice: я в недоумении
  rationale: Сохраняет оттенок растерянности и неспособности понять, как поступить или что думать, не усиливая его до отчаяния.
- source_word: ἐν ὑμῖν
  choice: из-за вас
  rationale: Передаёт отнесённость недоумения Павла к галатам. Возможен более нейтральный вариант «насчёт вас», однако «из-за вас» естественно выражает вызванную их состоянием растерянность.
theological_decisions:
- issue: Значение φωνή в выражении ἀλλάξαι τὴν φωνήν μου
  choice: Изменить тон или манеру обращения к галатам
  alternative: Изменить свой буквальный голос
  rationale: Контекст пастырского увещевания указывает прежде всего на иной способ разговора при личной встрече. Сноска сохраняет буквальное значение и тем самым не устраняет лексическую неоднозначность.
- issue: Направленность выражения ἀποροῦμαι ἐν ὑμῖν
  choice: Павел находится в недоумении из-за состояния и поведения галатов
  alternative: Павел сомневается непосредственно в самих галатах
  rationale: Греческая конструкция допускает оттенки «насчёт вас», «в отношении вас» и «из-за вас»; перевод не превращает недоумение в однозначное осуждение их веры или спасения.
translation_notes:
  register: Современный литературный русский язык с тёплой, пастырски обеспокоенной интонацией. Конструкция «как бы мне хотелось» передаёт неосуществимое желание, а «говорить с вами иначе» звучит естественнее буквального «изменить голос»; буквальный образ сохранён в сноске.
