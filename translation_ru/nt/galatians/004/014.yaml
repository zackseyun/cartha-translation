id: GAL.4.14
reference: Galatians 4:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: ru
  text: И хотя моё телесное состояние стало для вас испытанием[a], вы не отнеслись ко мне с презрением и не отвергли меня с отвращением[b], но приняли меня как ангела Божьего, как Мессию Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен буквальный перевод: «ваше испытание в моей плоти». Греческая фраза допускает разные синтаксические толкования.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «не выплюнули» — образное выражение отвращения или отвержения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: испытанием
  rationale: В данном контексте речь идёт не об искушении ко греху, а о тяжёлом испытании, которым для галатов стало физическое состояние Павла.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: моё телесное состояние стало для вас испытанием
  rationale: 'Фраза в греческом тексте синтаксически трудна: буквально она близка к «ваше испытание в моей плоти». Выбранная формулировка естественно передаёт наиболее вероятный смысл, не истолковывая σάρξ в нравственно-богословском значении.'
- source_word: ἐξουθενήσατε
  choice: не отнеслись ко мне с презрением
  rationale: Глагол обозначает презрительное отношение, при котором человека считают ничтожным или недостойным внимания.
- source_word: ἐξεπτύσατε
  choice: не отвергли меня с отвращением
  rationale: Глагол буквально связан с плевком и выражает резкое отвращение или отвержение; образ сохранён в сноске.
- source_word: ἐδέξασθέ
  choice: приняли меня
  rationale: Русское «приняли» естественно выражает личный и благожелательный приём Павла галатами.
- source_word: ἄγγελον θεοῦ
  choice: ангела Божьего
  rationale: Хотя ἄγγελος может означать посланника, возвышенное сопоставление с Мессией Иисусом поддерживает значение «ангел».
- source_word: Χριστὸν Ἰησοῦν
  choice: Мессию Иисуса
  rationale: Χριστός здесь сохраняет силу титула, поэтому передан словом «Мессия», а не как ставшее именоподобным «Христос».
theological_decisions:
- issue: Смысл сравнения «как ангела Божьего, как Мессию Иисуса»
  choice: Обороты описывают исключительно почтительный приём Павла галатами.
  alternative: Второе сравнение риторически усиливает первое.
  rationale: Два оборота с ὡς указывают, как галаты приняли Павла, но не отождествляют его ни с ангелом, ни с Иисусом.
- issue: Значение σάρξ
  choice: Физическое, телесное состояние Павла.
  alternative: Греховная природа.
  rationale: Контекст говорит о слабости или недуге Павла, а не о нравственной склонности ко греху.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Начальная конструкция передана идиоматично, а подлинная синтаксическая неоднозначность исходного текста сохранена в сноске.
