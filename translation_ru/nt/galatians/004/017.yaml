id: GAL.4.17
reference: Galatians 4:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: ru
  text: Они усердно добиваются вашего расположения[a], но не с добрыми намерениями. Напротив, они хотят отделить вас[b], чтобы и вы добивались их расположения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревнуют о вас»; греческий глагол может означать горячее стремление к кому-либо, настойчивое искание его расположения или желание привлечь его на свою сторону.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исключить вас», «отгородить вас». Вероятно, речь идёт о намерении отдалить галатов от Павла и его соработников, чтобы галаты искали расположения этих учителей.'
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν … ζηλοῦτε
  choice: добиваются вашего расположения … добивались их расположения
  rationale: 'Глагол ζηλόω может выражать горячее стремление к человеку, желание привлечь его на свою сторону или снискать его расположение. Повтор одного и того же русского оборота сохраняет риторическую симметрию: они добиваются расположения галатов, чтобы галаты добивались их расположения.'
- source_word: οὐ καλῶς
  choice: не с добрыми намерениями
  rationale: В контексте выражение оценивает не саму ревность, а её недобрую направленность или мотив. Перевод звучит естественно по-русски, не сводя смысл только к неумелому образу действий.
- source_word: ἀλλὰ
  choice: Напротив
  rationale: Передаёт сильное противопоставление и вводит объяснение подлинной цели противников.
- source_word: ἐκκλεῖσαι
  choice: отделить
  rationale: Передаёт идею устранения или исключения из прежнего круга отношений, но не добавляет в основной текст не названный в греческом оригинале объект отделения.
- source_word: θέλουσιν
  choice: хотят
  rationale: Прямой и естественный современный эквивалент глагола волеизъявления.
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно передаёт целевое значение придаточного предложения.
theological_decisions:
- issue: От кого или от чего противники хотят отделить галатов
  choice: Не уточнять объект отделения в основном тексте
  alternative: «отделить вас от нас», то есть от Павла и его соработников
  rationale: Контекст, вероятно, указывает на попытку разорвать отношения галатов с Павлом и перенаправить их преданность к соперникам, однако сам стих не называет объект отделения. Формулировка сохраняет эту недосказанность и не превращает вероятное контекстуальное толкование в прямое утверждение текста.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным звучанием. Повтор «добиваться расположения» сохраняет словесную перекличку двух форм ζηλόω. Формулировка «отделить вас» намеренно оставляет невыраженным объект отделения, как и греческий текст.
