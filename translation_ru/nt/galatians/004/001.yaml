lexical_decisions:
- source_word: Λέγω δέ
  choice: Вот что я говорю
  rationale: Оборот вводит дальнейшее пояснение; δέ обозначает мягкий переход, а не обязательно резкое противопоставление. Русская формулировка естественно передаёт пояснительную функцию без добавления временного «теперь».
- source_word: ἐφ’ ὅσον χρόνον
  choice: пока
  rationale: Идиома обозначает продолжительность до определённого предела; «пока» кратко и естественно передаёт этот смысл.
- source_word: ὁ κληρονόμος
  choice: наследник
  rationale: Обычное и точное русское обозначение человека, которому предназначено наследство.
- source_word: νήπιός
  choice: ребёнок
  rationale: Слово может обозначать малолетнего или незрелого ребёнка; в контексте наследования подчёркивается недостижение возраста самостоятельного распоряжения имуществом.
- source_word: οὐδὲν διαφέρει
  choice: ничем не отличается
  rationale: Точно и естественно передаёт отсутствие практического различия.
- source_word: δούλου
  choice: раба
  rationale: В сравнении существенна несвобода человека, находящегося под властью другого; «раб» сохраняет силу греческого δοῦλος лучше, чем более мягкое «слуга».
- source_word: κύριος πάντων ὤν
  choice: хотя и является хозяином всего
  rationale: Причастный оборот имеет уступительный смысл. Здесь κύριος указывает на владение и положение наследника, а не служит божественным титулом; «хозяин всего» естественнее по-русски, чем буквальное «господин всего».
theological_decisions:
- issue: Передача δοῦλος в сравнении Павла
  choice: раб
  alternative: слуга
  rationale: Смысл сравнения основан на фактическом отсутствии свободы и самостоятельности; «раб» сохраняет социальную и риторическую остроту исходного слова.
- issue: Значение κύριος πάντων применительно к наследнику
  choice: хозяин всего
  alternative: господин всего
  rationale: 'В данном контексте речь идёт о праве на всё имущество и будущем распоряжении им, а не о божественном титуле. Выбор не устраняет парадокс: наследник уже занимает положение владельца, но пока практически не отличается от раба.'
translation_notes:
  register: Современный литературный русский язык; пояснительный переход передан естественно, юридическая образность сохранена без излишней терминологичности. Формулировка остаётся понятной широкому кругу читателей и удерживает парадокс между нынешним положением наследника и его правом на всё.
