  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: ru
  text: Но тогда, не зная Бога, вы находились в рабстве у тех, кто по природе не является богами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но прежде, когда вы не знали Бога, вы служили тем, кто в действительности не является богами».'
    reason: 'Лексико-синтаксическая альтернатива: τότε может означать «прежде», а ἐδουλεύσατε — «служили»; φύσει подчёркивает действительную природу названных богами.'
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предшествующему рассуждению естественно и без усиления.
- source_word: τότε μὲν
  choice: тогда
  rationale: Указывает на прежний период жизни галатов; частица μέν подготавливает контраст со следующим стихом.
- source_word: οὐκ εἰδότες θεὸν
  choice: не зная Бога
  rationale: Сохраняет причастную конструкцию и естественно выражает их прежнее состояние; «знать» соответствует контексту познания истинного Бога.
- source_word: ἐδουλεύσατε
  choice: вы были рабами
  rationale: Сохраняет сильный смысл рабской зависимости, важный для сквозной темы рабства и свободы в Послании к галатам.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: тех, кто ... не является богами
  rationale: Не уточняет, идёт ли речь об идолах, духовных существах или иных объектах почитания, поскольку сам текст этого здесь не определяет.
- source_word: φύσει μὴ
  choice: по природе не
  rationale: 'Передаёт онтологическое отрицание: речь о том, чем эти объекты в действительности не являются.'
- source_word: θεοῖς
  choice: богами
  rationale: Прямо передаёт множественное число и сохраняет контраст с Богом.
theological_decisions:
- issue: Природа прежних объектов поклонения
  choice: «тех, кто по природе не является богами»
  alternative: «тех, кто на самом деле не боги» / «существ, ложно называемых богами»
  rationale: Основной текст сохраняет утверждение Павла о том, чем эти объекты не являются по природе, не отождествляя их специально ни с идолами, ни с демоническими силами.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. «Были рабами» предпочтено более слабому «служили» ради сохранения темы рабства; местоимение «кто» употреблено как естественное русское обозначение неопределённых одушевлённых или персонифицированных объектов без решения вопроса об их точной природе.
