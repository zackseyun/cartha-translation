lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт противопоставление нынешнему Иерусалиму из предыдущего стиха.
- source_word: ἄνω
  choice: свыше
  rationale: Сохраняет пространственно-трансцендентный образ оригинала и не сводит его истолкование только к значению «небесный».
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Общепринятая русская форма библейского топонима.
- source_word: ἐλευθέρα
  choice: свободен
  rationale: Предикативное прилагательное сохраняет противопоставление рабства и свободы в окружающем контексте; мужской род обусловлен русским грамматическим родом слова «Иерусалим».
- source_word: ἥτις
  choice: он
  rationale: Личное местоимение естественно продолжает олицетворение, однако в русском согласуется с грамматически мужским словом «Иерусалим»; более формальная относительная конструкция приведена в сноске.
- source_word: μήτηρ
  choice: мать
  rationale: Прямо сохраняет материнский образ, центральный для рассуждения Павла о Сарре, Агари и двух Иерусалимах.
- source_word: ἡμῶν
  choice: наша
  rationale: Естественная русская передача притяжательного значения.
theological_decisions:
- issue: Олицетворение Иерусалима свыше как матери
  choice: «он — наша мать»
  alternative: «который является нашей матерью»
  rationale: Перевод сохраняет олицетворение и материнскую метафору, не добавляя к ним отдельного богословского толкования. Мужское «он» отражает грамматику русского названия «Иерусалим», тогда как женский род греческого местоимения согласован с Ἰερουσαλήμ.
translation_notes:
  register: Современный литературный русский с умеренно библейским оборотом «Иерусалим свыше». Точка с запятой ясно разделяет два предикативных утверждения, а тире подчёркивает образное отождествление Иерусалима с матерью.
