  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: ru
  text: Вы же, братья[a], подобно Исааку, — дети обещания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «братья» здесь стоит в форме мужского рода множественного числа как обращение ко всей общине и, вероятно, включает как мужчин, так и женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: вы
  rationale: Местоимение второго лица множественного числа выражено явно и сохранено; в русском оно также поддерживает смысловое выделение адресатов.
- source_word: δέ
  choice: же
  rationale: Передаёт мягкий переход и сопоставление с предшествующим рассуждением, не добавляя временного значения.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма обращения — мужской род, множественное число; у Павла она может представительно относиться ко всей общине, включая женщин, что пояснено в сноске.
- source_word: κατὰ Ἰσαὰκ
  choice: подобно Исааку
  rationale: 'κατά здесь обозначает соответствие образцу: адресаты подобны Исааку в том, что являются детьми обещания.'
- source_word: ἐπαγγελίας
  choice: обещания
  rationale: Родительный падеж в выражении «дети обещания» сохранён ради точности и богословской насыщенности формулировки Павла.
- source_word: τέκνα
  choice: дети
  rationale: Нейтральное по отношению к полу обозначение потомков или тех, кто обладает положением детей; естественно соответствует греческому τέκνα.
- source_word: ἐστέ
  choice: —
  rationale: Настоящее время связки «быть» в русском обычно выражается нулевой связкой; тире ясно оформляет именное сказуемое.
theological_decisions:
- issue: Соотнесение адресатов с Исааком в аллегорическом рассуждении Павла
  choice: «подобно Исааку, — дети обещания»
  alternative: «обещанные дети, как Исаак»
  rationale: Избранный вариант сохраняет Исаака как образец сравнения, а «дети обещания» — как сказуемое, не превращая выражение в утверждение лишь о том, что сами дети были заранее обещаны.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Частица «же» естественно передаёт δέ, а оборот «подобно Исааку» яснее буквального «по Исааку».
