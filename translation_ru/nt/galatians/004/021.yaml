  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: ru
  text: 'Скажите мне, вы, желающие быть под законом: разве вы не слушаете закон?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве вы не слышите закон?» Греческий глагол может означать и «слышать», и «слушать». Под законом, вероятно, имеется в виду Моисеев закон, в особенности повествование Писания, на которое Павел ссылается далее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Скажите мне
  rationale: Настоящее повелительное наклонение множественного числа вводит прямой риторический вызов; «Скажите мне» естественно передаёт его силу по-русски.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: вы, желающие быть под законом
  rationale: Субстантивированное причастие обозначает адресатов, которых характеризует это желание. Оборот «под законом» сохраняет павловскую юридико-заветную формулировку.
- source_word: νόμον / τὸν νόμον
  choice: законом / закон
  rationale: Один и тот же русский корень сохраняет смысловую перекличку между пребыванием «под законом» и обращением к закону как к Писанию; строчная буква не снимает многозначности раньше времени.
- source_word: οὐκ ἀκούετε
  choice: разве вы не слышите, что говорит
  rationale: ἀκούω допускает значения «слышать» и «слушать». В контексте последующей ссылки на повествование Писания дополнение «что говорит» естественно выражает внимание к содержанию закона, не сводя глагол только к послушанию.
theological_decisions:
- issue: Значение слова «закон»
  choice: Сохранено «закон» со строчной буквы в обоих случаях; во втором случае он представлен как говорящий текст Писания.
  alternative: «Закон» с прописной буквы как однозначное обозначение Моисеева Закона; либо «слушаетесь закона» как акцент на повиновении.
  rationale: Павел использует νόμος одновременно как порядок, под которым адресаты хотят находиться, и как авторитетный текст, из которого далее приводится повествование. Перевод сохраняет эту смысловую напряжённость, не ограничивая термин одним аспектом.
- issue: Смысл ἀκούετε
  choice: «слышите, что говорит»
  alternative: «слушаете» или «слушаетесь»
  rationale: Формулировка удерживает буквальный образ слышания и контекстуальную мысль о внимании к содержанию Писания. Вариант «слушаетесь» слишком определённо вводил бы идею повиновения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Риторическая острота вопроса сохранена частицей «разве»; лексическая перекличка двух употреблений νόμος передана словом «закон».
