id: GAL.4.9
reference: Galatians 4:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: ru
  text: Теперь же, познав Бога — или, лучше сказать, будучи познаны Богом, — как вы снова возвращаетесь к слабым и бедным началам[a] и хотите снова, с самого начала, стать их рабами?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стихиям», «элементарным основам», «первоначалам»; возможно также понимание как духовных сил.'
    reason: Лексическое и богословское значение στοιχεῖα в этом контексте остаётся спорным, поэтому сноска сохраняет основные возможности.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: познав Бога
  rationale: Аористное причастие передано деепричастием, естественно выражающим предшествующее вступление в познание Бога и сохраняющим связь с главным вопросом.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: или, лучше сказать, будучи познаны Богом
  rationale: Оборот μᾶλλον δέ имеет корректирующую силу; страдательная конструкция сохранена, чтобы передать первенство Божьего действия, не добавляя к тексту богословской системы.
- source_word: πῶς
  choice: как
  rationale: В риторическом вопросе «как» естественно передаёт изумление и упрёк Павла без замены вопроса о немыслимости вопросом о причине.
- source_word: ἐπιστρέφετε πάλιν
  choice: снова возвращаетесь
  rationale: Настоящее время передаёт происходящий процесс, а сочетание наречия и глагола сохраняет усиленный акцент на возвращении назад.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: немощным и бедным началам
  rationale: '«Начала» оставляет στοιχεῖα семантически открытым: речь может идти об основных началах, стихиях либо о связанных с ними силах. «Немощные и бедные» близко передаёт оценочные прилагательные, хотя выражение намеренно резко.'
- source_word: πάλιν ἄνωθεν
  choice: опять ... с самого начала
  rationale: 'Переданы оба компонента сочетания: повторность πάλιν и значение нового начала/возврата к исходной точке в ἄνωθεν.'
- source_word: δουλεύειν θέλετε
  choice: хотите ... поработиться
  rationale: Формулировка сохраняет волевое значение θέλετε и образ рабской зависимости в δουλεύειν, важный для контекста Послания к галатам.
theological_decisions:
- issue: Значение στοιχεῖα в Галатам 4:9
  choice: начала
  alternative: стихии; элементарные основы; первоначала; духовные силы
  rationale: Термин допускает предметное, религиозно-педагогическое и космическое прочтение. Основной текст не конкретизирует его как исключительно безличные правила или личные духи; варианты отмечены в сноске.
- issue: Смысл выражения «познаны Богом»
  choice: сохранена корректирующая пассивная формулировка
  alternative: сделать акцент только на взаимных отношениях, не выражая первенства Божьего действия
  rationale: μᾶλλον δέ действительно поправляет предыдущее «познав Бога». Перевод отражает эту текстовую асимметрию, но не выводит из неё более широких доктринальных положений.
- issue: Отношение нового подчинения к прежнему состоянию
  choice: «опять поработиться им с самого начала»
  alternative: «служить им заново»
  rationale: 'Рабская метафора сохранена. Фраза подчёркивает парадокс: адресаты рискуют вновь оказаться в зависимости, хотя конкретная форма этой зависимости может отличаться от прежней.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Синтаксис сохраняет последовательность мысли Павла и риторическую напряжённость; архаичное по оттенку «поработиться» оправдано ключевым для контекста образом рабства.
