    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: дни
  rationale: Прямой перевод формы множественного числа ἡμέρα; календарно-религиозный оттенок определяется контекстом, а не добавлением определения в основной текст.
- source_word: παρατηρεῖσθε
  choice: тщательно соблюдаете
  rationale: Настоящее время передаёт продолжающуюся практику; глагол в данном контексте обозначает внимательное, скрупулёзное соблюдение установленных календарных сроков.
- source_word: μῆνας
  choice: месяцы
  rationale: Прямой перевод μήν в составе последовательности календарных единиц.
- source_word: καιρούς
  choice: времена
  rationale: Сохраняет широту καιρός как особого или установленного времени, не уточняя преждевременно, что речь именно о праздниках.
- source_word: ἐνιαυτούς
  choice: годы
  rationale: Прямой перевод ἐνιαυτός, естественно завершающий восходящий перечень календарных периодов.
- source_word: καὶ
  choice: и
  rationale: Союзы переданы так, чтобы сохранить накопительный ритм греческого перечня; в русском перед последними двумя членами естественно поставить один союз.
theological_decisions:
- issue: Следует ли явно назвать перечисленные сроки иудейскими или религиозными установлениями
  choice: Оставить в основном тексте простые названия временных единиц.
  alternative: «особые дни», «религиозные дни» или «праздники»
  rationale: В самом греческом тексте перечислены временные категории без таких определений. Контекст указывает на календарные обряды, но перевод не должен добавлять конфессионально или исторически более узкое толкование.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественно-нейтральная. «Соблюдаете» естественно выражает религиозно-календарную практику, а «тщательно» передаёт оттенок внимательного соблюдения в παρατηρεῖσθε.
