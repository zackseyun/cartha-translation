base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: ru
  text: Итак, ты уже не раб, а сын[a]. А если сын, то и наследник — по Божьему установлению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «ребёнок». В греческом тексте — «сын»; это слово сохраняет связь с усыновлением и правом наследования, хотя Павел говорит о положении всех верующих — и мужчин, и женщин.
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «наследник Божий через Христа» (или «через Мессию») вместо «наследник — по Божьему установлению».'
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка способом.
- source_word: οὐκέτι εἶ
  choice: ты уже не
  rationale: Сохраняет второе лицо единственного числа и указывает на изменение прежнего положения.
- source_word: δοῦλος
  choice: раб
  rationale: Передаёт состояние несвободы, которое Павел противопоставляет сыновству и наследованию; «слуга» ослабило бы этот контраст.
- source_word: υἱός
  choice: сын
  rationale: Сохраняет мужской род греческого слова и юридическую логику сыновства и наследования в контексте, при этом статус относится ко всем верующим.
- source_word: κληρονόμος
  choice: наследник
  rationale: Обычное и точное обозначение лица, получающего наследство; соответствует теме усыновления в отрывке.
- source_word: διὰ θεοῦ
  choice: благодаря Богу
  rationale: Естественно передаёт посредствующую или действенную роль Бога, выраженную διά с родительным падежом, не добавляя отсутствующих в принятом греческом тексте слов.
theological_decisions:
- issue: Гендерно маркированное слово υἱός
  choice: сын
  alternative: ребёнок; дитя
  rationale: «Сын» сохраняет связь с усыновлением и правом наследования в древнем контексте. Применимость этого положения ко всем верующим поясняется в сноске, а не устраняется нейтрализацией основного текста.
- issue: Текст в конце стиха
  choice: благодаря Богу
  alternative: наследник Божий через Христа; наследник Божий через Мессию
  rationale: Основной текст следует чтению SBLGNT διὰ θεοῦ. Более пространные чтения отдельных рукописей отмечены в сноске, но не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Единственное число «ты» сохраняет грамматику греческого текста и лично обращённый характер вывода; короткие предложения передают последовательность аргумента.
