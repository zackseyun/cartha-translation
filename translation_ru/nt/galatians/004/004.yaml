    issue: «рождённого женщиной»
    rationale: Творительный падеж («женщиной») в нормальном русском выражает производителя действия; он означает, что женщина родила Сына, а не что Сын родился от женщины. Для ἐκ γυναικός необходимо «от женщины».
  - severity: medium
    issue: «рождённого под законом»
    rationale: Фраза может быть понята как «родившегося в условиях/месте под законом» и искусственно делает «под законом» характеристикой рождения. γενόμενον ὑπὸ νόμον описывает вхождение в положение под законом; «оказавшегося под законом» передаёт это без добавления идеи добровольного подчинения.
  - severity: low
    issue: Буквальная формулировка сноски b
    rationale: «Произошедшего от женщины» менее буквально отражает γενόμενον, чем «ставшего/оказавшегося от женщины», и пояснение о богословском значении можно заменить нейтральным лексическим пояснением.
  revised_text: Но когда настала полнота времени[a], Бог послал Своего Сына, родившегося от женщины[b] и оказавшегося под законом[c].
