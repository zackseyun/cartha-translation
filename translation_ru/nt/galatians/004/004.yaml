  source_fidelity: 'Оборот «рождённого женщиной» неверно распределяет роли: творительный падеж в русском обычно обозначает деятеля («женщина родила [его]»), тогда как ἐκ γυναικός означает происхождение «от женщины». Второй причастный оборот γενόμενον ὑπὸ νόμον точнее передать как положение, в котором Сын оказался, а не как обстоятельство рождения.'
  naturalness: «Настала полнота времени» и «Бог послал Своего Сына» естественны для современного литературного русского с библейской интонацией. «Родившегося от женщины и оказавшегося под законом» ясно, грамматически естественно и не создаёт впечатления, что «закон» является местом рождения.
  terminology: «Полнота времени», «Сын» и «под законом» сохранены. Сноска уточняет, что в контексте речь идёт о Моисеевом законе, не перегружая основной текст. Формулировка не вносит конфессиональных выводов.
