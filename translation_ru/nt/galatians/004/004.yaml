lexical_decisions:
- source_word: ὅτε δὲ
  choice: Но когда
  rationale: Передаёт временную связь ὅτε и мягкий переход или контраст, выраженный δέ, не усиливая его сверх контекста.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: настала полнота времени
  rationale: Естественная русская формулировка, сохраняющая образ времени, достигшего назначенной полноты; аорист передан завершённым наступлением момента.
- source_word: ἐξαπέστειλεν
  choice: послал
  rationale: В современном русском «послал» естественно передаёт направление Сына Богом на миссию; буквальное «выслал» могло бы ошибочно подразумевать изгнание или административную отправку.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Своего Сына
  rationale: Возвратное притяжательное местоимение естественно при подлежащем «Бог»; прописная буква ясно обозначает уникального Сына в данном контексте.
- source_word: γενόμενον ἐκ γυναικός
  choice: рождённого женщиной
  rationale: В этой конструкции γενόμενον идиоматически указывает на рождение, а ἐκ — на происхождение; формулировка ясно утверждает подлинное человеческое рождение.
- source_word: γενόμενον ὑπὸ νόμον
  choice: рождённого под законом
  rationale: Повтор сохраняет параллелизм двух причастных оборотов; «под законом» передаёт положение под его властью или юрисдикцией.
theological_decisions:
- issue: Предсуществование Сына и Его подлинная человечность
  choice: Сохранить сочетание «Бог послал Своего Сына» и «рождённого женщиной».
  alternative: Передать γενόμενον буквально как «ставшего от женщины» или сгладить формулировку до «родившегося».
  rationale: Текст одновременно говорит о Сыне как о посланном Богом и о Его действительном человеческом рождении; перевод не устраняет это богословское напряжение.
- issue: Значение νόμος в выражении ὑπὸ νόμον
  choice: 'Перевести компактно: «под законом», а связь с Моисеевым законом пояснить в сноске.'
  alternative: В основном тексте раскрыть как «под Моисеевым законом» либо понимать закон в общем смысле.
  rationale: Контекст Послания к галатам указывает на Моисеев закон, однако основной текст сохраняет лаконичность и форму греческого выражения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены повтор «рождённого» и образ «полноты времени»; избегнуты архаизмы и конфессионально окрашенные расширения.
