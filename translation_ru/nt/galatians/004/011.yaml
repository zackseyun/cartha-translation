id: GAL.4.11
reference: Galatians 4:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: ru
  text: 'Боюсь за вас[a]: как бы не оказалось, что я напрасно трудился ради вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Боюсь за вас — не напрасно ли я трудился ради вас».'
    reason: Возможен более прямой способ передать содержание опасения, сохранив его неопределённость.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: Боюсь
  rationale: Настоящее время передаёт нынешнюю тревогу Павла; русское «боюсь за вас» естественно выражает опасение за состояние адресатов, а не страх перед ними.
- source_word: ὑμᾶς
  choice: за вас
  rationale: В сочетании с φοβοῦμαι винительный обозначает объект тревоги; «за вас» ясно передаёт пастырскую обеспокоенность.
- source_word: μή πως
  choice: как бы не оказалось, что
  rationale: Оборот вводит содержание опасения и сохраняет оттенок неуверенности, естественно звуча по-русски.
- source_word: εἰκῇ
  choice: напрасно
  rationale: Передаёт значение отсутствия результата или пользы.
- source_word: κεκοπίακα
  choice: трудился
  rationale: Глагол обозначает напряжённый труд; прошедшее время в придаточном после «как бы не оказалось» естественно передаёт совершённый труд с актуальным результатом, не превращая греческий индикатив в самостоятельную модальную форму.
- source_word: εἰς ὑμᾶς
  choice: ради вас
  rationale: Передаёт направленность вложенного труда на галатов и его совершение ради их блага; «над вами» могло бы звучать покровительственно или двусмысленно.
theological_decisions:
- issue: Характер опасения Павла
  choice: Павел выражает пастырскую тревогу о том, не оказался ли бесплодным его напряжённый труд ради галатов.
  alternative: Слова можно понять как более общее личное беспокойство Павла без особого акцента на возможной безрезультатности его служения.
  rationale: Сочетание φοβοῦμαι, μή πως и εἰκῇ κεκοπίακα связывает тревогу именно с возможной тщетностью уже совершённого труда, не утверждая окончательно, что он действительно был тщетным.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и достойная. Сохранены пастырская тревога, неопределённость исхода и напряжённый характер труда.
