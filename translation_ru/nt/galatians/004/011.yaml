  verdict: approve
  source_fidelity: «Боюсь за вас» точно передаёт φοβοῦμαι ὑμᾶς как обеспокоенность состоянием адресатов. Оборот «как бы не оказалось, что» адекватно выражает опасение, вводимое μή πως, не утверждая тщетность труда как факт. «Напрасно трудился» передаёт εἰκῇ κεκοπίακα и сохраняет смысл уже совершённого напряжённого труда; «ради вас» приемлемо передаёт направленность εἰς ὑμᾶς.
  naturalness: Текст звучит естественно и литературно по-русски. Двоеточие удачно связывает пастырскую тревогу с её содержанием. Формулировка ясна, кратка и не содержит неуместной архаики.
  terminology: Существенных терминологических проблем нет. «Боюсь за вас» не создаёт ошибочного смысла страха перед адресатами, а «напрасно» точно передаёт возможную безрезультатность труда.
