  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: ru
  text: 'Станьте такими, как я[a], потому что и я — как вы[b], братья[c]. Прошу вас: вы ничем меня не обидели.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте как я».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза не содержит глагола. Возможно также: «ведь и я стал таким, как вы».'
    reason: alternative_reading
  - marker: c
    text: Обращение «братья» здесь, вероятно, относится ко всей общине верующих, включая женщин.
    reason: cultural_note
lexical_decisions:
- source_word: Γίνεσθε ὡς ἐγώ
  choice: Станьте такими, как я
  rationale: Императив Γίνεσθε выражает призыв перейти к определённому состоянию или образу поведения; «станьте» точнее передаёт эту динамику, чем статичное «будьте». Оборот «такими, как я» естественно выражает сравнение.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание призыва Павла. «Потому что» ясно передаёт причинную связь, не сводя фразу к простому пояснению.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: и я — как вы
  rationale: В греческом предложении нет выраженного глагола. Русская эллиптическая конструкция с тире сохраняет эту недосказанность и допускает как указание на нынешнее отождествление Павла с адресатами, так и контекстуально возможный смысл «я стал таким, как вы».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена мужская форма звательного обращения греческого текста; вероятный охват всей верующей общины пояснён в сноске.
- source_word: δέομαι ὑμῶν
  choice: Прошу вас
  rationale: δέομαι обозначает настойчивую, личную просьбу. В современном русском «прошу вас» передаёт серьёзность обращения без излишне архаичного или чрезмерно эмоционального оттенка.
- source_word: οὐδέν με ἠδικήσατε
  choice: вы ничем меня не обидели
  rationale: Оборот передаёт отрицание любого причинённого Павлу ущерба или несправедливости. «Ничем меня не обидели» — естественная русская формулировка, сохраняющая прямую направленность действия на Павла.
theological_decisions:
- issue: Смысл эллиптического оборота κἀγὼ ὡς ὑμεῖς
  choice: 'Сохранить в основном тексте эллипсис: «и я — как вы»'
  alternative: «и я стал таким, как вы»
  rationale: Греческий текст не повторяет глагол. Хотя контекст позволяет подразумевать прежнее уподобление Павла язычникам, явное добавление «стал» снимало бы подлинную грамматическую неоднозначность.
- issue: Охват обращения ἀδελφοί
  choice: «братья» с пояснением в сноске
  alternative: «братья и сёстры»
  rationale: Форма источника — мужское множественное число, но в обращении она, вероятно, относится ко всей общине. Основной текст сохраняет форму оригинала, а сноска разъясняет её вероятный широкий охват.
translation_notes:
  register: Современный литературный русский язык; тон личный, настойчивый и достойный. Эллипсис оригинала сохранён естественным для русского языка тире. Пунктуация отделяет просьбу от заверения, не изменяя последовательности мысли.
