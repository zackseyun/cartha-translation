lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Союз вводит вывод из предшествующего рассуждения; «итак» естественно передаёт логический и риторический переход.
- source_word: ἐχθρὸς ὑμῶν
  choice: вашим врагом
  rationale: Предикативное существительное с родительным местоимением естественно передаётся по-русски как «вашим врагом».
- source_word: γέγονα
  choice: я стал
  rationale: Перфект γίνομαι обозначает наступившее состояние, сохраняющее значение в настоящем; русское «стал» в данном вопросе естественно передаёт этот результат.
- source_word: ἀληθεύων ὑμῖν
  choice: говоря вам правду
  rationale: Причастие может обозначать правдивую речь или сообщение истины; оборот «говоря вам правду» сохраняет способ или основание предполагаемого отчуждения и звучит естественно.
theological_decisions:
- issue: Смысл ἀληθεύων в риторическом вопросе Павла
  choice: Павел спрашивает, не стал ли он их врагом из-за того, что говорит им правду.
  alternative: Павел спрашивает, не стал ли он их врагом, поступая с ними правдиво или будучи с ними правдивым.
  rationale: Контекст указывает на прямую правдивую речь Павла к галатам, однако более широкая лексическая возможность отмечена в сноске без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос сохранён. Частица «неужели» естественно выражает удивление и болезненную напряжённость вопроса, не снимая его открытого характера.
