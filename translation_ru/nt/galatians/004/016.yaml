  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: ru
  text: Итак, неужели я стал вашим врагом, говоря вам правду?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говоря с вами правдиво». Греческое ἀληθεύων может означать как «говоря правду», так и «говоря правдиво».'
