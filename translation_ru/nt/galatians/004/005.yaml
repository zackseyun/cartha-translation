id: GAL.4.5
reference: Galatians 4:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: ru
  text: чтобы искупить тех, кто под Законом, чтобы мы получили усыновление[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает принятие в положение сыновей — с полным сыновним статусом и правами наследников. Этот статус получают все верующие — и женщины, и мужчины.
    reason: Поясняет юридический и наследственный смысл гендерно маркированного термина υἱοθεσία и его включающий всех верующих референт.
lexical_decisions:
- source_word: ἵνα … ἵνα
  choice: чтобы … чтобы
  rationale: Повтор союза сохраняет две параллельные целевые конструкции исходного текста и естественно звучит по-русски.
- source_word: τοὺς ὑπὸ νόμον
  choice: тех, кто под Законом
  rationale: Передаёт субстантивированное выражение без добавления отсутствующего в греческом глагола; прописная буква указывает на Моисеев Закон, что наиболее вероятно в данном контексте.
- source_word: ἐξαγοράσῃ
  choice: искупить
  rationale: Сохраняет одновременно смысл освобождения ценой выкупа и устойчивую богословскую лексику, оставаясь понятным современному читателю.
- source_word: τὴν υἱοθεσίαν
  choice: усыновление
  rationale: Это естественный русский эквивалент юридического принятия в статус сына; примечание поясняет связанный с мужским термином полный сыновний статус и права наследника.
- source_word: ἀπολάβωμεν
  choice: мы получили
  rationale: Передаёт значение получения; оттенок «получить обратно» в данном контексте не является обязательным.
theological_decisions:
- issue: Гендерно маркированный смысл υἱοθεσία
  choice: усыновление с пояснительным примечанием
  alternative: положение сыновей; принятие в Божью семью
  rationale: «Усыновление» сохраняет сыновнюю и наследственную образность Павла, а примечание ясно показывает, что обещанный статус относится ко всем верующим, не подменяя исходный образ нейтральной формулировкой.
- issue: Кого обозначают «те, кто под Законом»
  choice: Формулировка оставлена без явного уточнения референта; «Закон» понимается прежде всего как Моисеев Закон
  alternative: те, кто под властью Моисеева Закона; все находящиеся под законом
  rationale: Контекст Гал 4:4–5 прежде всего указывает на людей под властью Торы, однако сам стих не добавляет определения «Моисеев»; краткая формулировка сохраняет возможную широту Павлова рассуждения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Повтор «чтобы» намеренно сохраняет риторическую структуру греческого текста. «Закон» написан с прописной буквы как контекстуальное обозначение Моисеева Закона.
