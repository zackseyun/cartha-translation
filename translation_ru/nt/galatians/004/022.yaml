source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: ru
  text: 'Ведь написано, что у Авраама было два сына: один — от рабыни[a], а другой — от свободной женщины.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанки». Греческое слово παιδίσκη может обозначать служанку или рабыню; здесь перевод «рабыня» подчёркивает противопоставление рабства и свободы в рассуждении Павла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: Сохраняет обычную формулу ссылки на авторитетный текст Писания и значение греческого перфекта с сохраняющимся результатом.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно передаёт пояснительно-обосновывающую связь с предшествующим рассуждением Павла.
- source_word: δύο υἱοὺς
  choice: два сына
  rationale: Точно передаёт мужской род и конкретное значение υἱούς.
- source_word: ἔσχεν
  choice: было
  rationale: Русское выражение «у Авраама было» естественно передаёт родительское отношение без избыточно конкретизирующего «родил» или «стал отцом».
- source_word: ἕνα ... καὶ ἕνα
  choice: один ... а другой
  rationale: Передаёт параллельное противопоставление двух сыновей естественной современной русской конструкцией.
- source_word: ἐκ
  choice: от
  rationale: В контексте происхождения русское «от» естественно указывает, от какой матери был рождён каждый сын.
- source_word: παιδίσκης
  choice: рабыни
  rationale: Слово может обозначать служанку или рабыню; здесь выбор «рабыня» ясно сохраняет значимый для дальнейшего довода контраст рабства и свободы.
- source_word: ἐλευθέρας
  choice: свободной женщины
  rationale: Субстантивированное прилагательное обозначает женщину со статусом свободной; явное существительное делает выражение понятным и сохраняет социально-правовой контраст.
theological_decisions:
- issue: Контраст социального статуса, лежащий в основе дальнейшего рассуждения Павла
  choice: «рабыня» / «свободная женщина»
  alternative: «служанка» / «свободная женщина»
  rationale: «Рабыня» не добавляет нового богословского утверждения, а отчётливо передаёт присутствующий в контексте контраст рабства и свободы; примечание сохраняет допустимый более мягкий лексический вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «написано». Двоеточие и парная конструкция «один — …, а другой — …» обеспечивают ясность и естественный ритм.
