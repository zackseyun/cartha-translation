source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: ru
  text: 'Ведь написано: «Возвеселись, бесплодная, не рождающая; воскликни и возгласи, не испытывающая родовых мук, потому что у оставленной больше детей, чем у имеющей мужа».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата из Исаии 54:1.
    reason: cross_reference
lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся формула введения цитаты из Писания; русская форма естественно передаёт сохраняющуюся силу написанного.
- source_word: Εὐφράνθητι
  choice: возвеселись
  rationale: Повеление радоваться; слово сохраняет возвышенный пророческий тон цитаты и остаётся понятным современному читателю.
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: бесплодная, не рождающая
  rationale: Субстантивированное прилагательное и причастный оборот переданы кратко и близко к греческому, с сохранением поэтического параллелизма.
- source_word: ῥῆξον καὶ βόησον
  choice: воскликни и возгласи
  rationale: Сочетание выражает внезапный громкий радостный крик; выбранная пара сохраняет два повелительных глагола и пророческую ритмику.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: не знавшая родовых мук
  rationale: Передаёт отсутствие родовых схваток и сохраняет материнский образ; прошедшая по форме характеристика естественна в русской поэтической речи, не утверждая отдельной временной последовательности.
- source_word: τῆς ἐρήμου
  choice: у оставленной
  rationale: В данном образном контексте ἔρημος означает женщину, оказавшуюся без мужа или покинутую, а не буквально находящуюся в пустыне; «оставленная» сохраняет намеренную широту между покинутостью и одиночеством.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: больше детей, чем
  rationale: Естественная русская сравнительная конструкция точно передаёт мысль о большей численности потомства.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: у имеющей мужа
  rationale: Близко воспроизводит греческую конструкцию и сохраняет противопоставление оставленной женщине, не сводя выражение просто к юридическому статусу замужества.
theological_decisions:
- issue: Ветхозаветная цитата и аллегорический контекст Гал 4
  choice: Передать Ис 54:1 как самостоятельный пророческий образ, не вводя в текст цитаты отождествления с Саррой или вышним Иерусалимом.
  alternative: Сделать формулировку более явно указывающей на Сарру или вышний Иерусалим.
  rationale: Павел приводит прямую цитату из Писания, а её применение раскрывает окружающий контекст. Внесение толкования внутрь цитаты устранило бы присущую тексту образность и богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией, уместной для пророческой цитаты. Сохранены параллелизм, женские образы и контраст между оставленной и имеющей мужа; избегнуты как архаизмы вроде «нераждающая», так и клиническое «неплодная».
