  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: ru
  text: но он подчинён опекунам и управляющим хозяйством[a] до срока, назначенного отцом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управляющим»; греческое слово обозначает тех, кто управлял домашним хозяйством или имением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до назначенного отцом времени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: 'Противительный союз продолжает сопоставление с предыдущим стихом: наследник по положению является господином всего, но, пока он ребёнок, фактически подчинён другим.'
- source_word: ὑπὸ
  choice: под
  rationale: С винительным падежом выражает подчинение власти или надзору; русское «под» естественно сохраняет этот образ.
- source_word: ἐπιτρόπους
  choice: опекунами
  rationale: Речь идёт о лицах, которым поручен надзор за несовершеннолетним наследником; «опекуны» точно и понятно передаёт личную заботу и юридическую ответственность.
- source_word: ἐστὶ
  choice: находится
  rationale: Подлежащее подразумевается из предыдущего стиха — наследник. Глагол «находится» естественно сочетается с конструкцией «под опекунами».
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз связывает две группы лиц, осуществляющих надзор и управление.
- source_word: οἰκονόμους
  choice: распорядителями
  rationale: Термин обозначает тех, кто ведает домом, хозяйством или имением. «Распорядители» отличает управление имуществом от личной опеки и не звучит чрезмерно архаично.
- source_word: ἄχρι
  choice: вплоть до
  rationale: Обозначает временную границу установленного порядка; «вплоть до» ясно подчёркивает его продолжительность до определённого срока.
- source_word: τῆς προθεσμίας
  choice: срока, назначенного
  rationale: Существительное означает заранее установленный срок или момент. Такая формулировка передаёт как временную определённость, так и предварительное назначение.
- source_word: τοῦ πατρός
  choice: отцом
  rationale: Родительный падеж естественно понимается как указание на того, кто назначил срок. Творительный падеж в обороте «назначенного отцом» ясно выражает это по-русски.
theological_decisions:
- issue: Значение родительного падежа в τοῦ πατρός
  choice: Срок представлен как назначенный отцом.
  alternative: 'Более буквально: «до назначенного срока отца».'
  rationale: В образе несовершеннолетнего наследника отец, по всей вероятности, выступает тем, кто определяет срок окончания опеки. Перевод сохраняет бытовой и юридический смысл сравнения, не добавляя богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Опекуны» передаёт надзор за несовершеннолетним, а «распорядители» — управление домом или имуществом; различие между двумя ролями сохранено. Строчная буква в начале обусловлена тем, что стих синтаксически продолжает предыдущую фразу.
