base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: ru
  text: А Агарь — это гора Синай в Аравии[a]; она соответствует нынешнему Иерусалиму, потому что находится в рабстве вместе со своими детьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «А эта Агарь — гора Синай в Аравии». Перед именем «Агарь» в греческом тексте стоит артикль, из-за чего конструкция допускает разные синтаксические толкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: А Агарь
  rationale: δέ передано как мягкий переход «а»; трудный артикль τὸ не выражен непосредственно в основном тексте, чтобы сохранить естественный русский синтаксис, но отмечен в сноске.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: это гора Синай в Аравии
  rationale: Сохранено прямое отождествление, выраженное связкой ἐστίν, без поясняющего «олицетворяет» или «означает»; географическое название передано без уточнения границ древней Аравии.
- source_word: συστοιχεῖ
  choice: соответствует
  rationale: Глагол обозначает принадлежность к тому же ряду или смысловое соответствие в развиваемом Павлом сопоставлении.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: нынешнему Иерусалиму
  rationale: νῦν передано временно и противопоставляет земной Иерусалим времени Павла «вышнему Иерусалиму» следующего стиха.
- source_word: δουλεύει
  choice: находится в рабстве
  rationale: Передано именно состояние рабства, а не общее служение, что сохраняет ключевое для контекста противопоставление рабства и свободы.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: вместе со своими детьми
  rationale: μετά с родительным выражает совместность, а τέκνα сохраняет семейно-аллегорический образ детей.
theological_decisions:
- issue: Аллегорическое отождествление Агари с Синаем и соотнесение с Иерусалимом
  choice: 'Сохранить прямую формулировку: «А Агарь — это гора Синай…; она соответствует нынешнему Иерусалиму».'
  alternative: 'Передать толковательно: «Агарь олицетворяет гору Синай».'
  rationale: Греческий текст использует прямую связку ἐστίν, а затем отдельный глагол соответствия συστοιχεῖ. Перевод не смягчает риторическое отождествление и не добавляет толкования.
- issue: Состояние нынешнего Иерусалима
  choice: «находится в рабстве вместе со своими детьми»
  alternative: «порабощён вместе со своими детьми»
  rationale: Настоящее время δουλεύει описывает продолжающееся состояние; нейтральная формулировка сохраняет метафору рабства, не уточняя не названного в тексте поработителя.
translation_notes:
  register: Современный литературный русский язык с ясным, но торжественным библейским звучанием. Прямое отождествление сохранено; тяжеловесная греческая конструкция вынесена в сноску. Точка с запятой помогает различить отождествление и последующее соответствие.
