  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: ru
  text: 'А поскольку вы — сыны[a], Бог послал в наши[c] сердца Духа Своего Сына, взывающего: «Авва[b], Отец!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны» сохраняет здесь язык усыновления и наследования у Павла; это обозначение относится ко всем верующим, а не только к мужчинам.
    reason: cultural_note
  - marker: b
    text: Авва — арамейская форма обращения к отцу; она сохранена в тексте вслед за оригиналом.
    reason: lexical_alternative
  - marker: c
    text: 'В некоторых рукописях: «в ваши сердца».'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι δέ
  choice: А поскольку
  rationale: ὅτι указывает на основание последующего утверждения, а δέ придаёт фразе мягкую связующую силу; «А поскольку» естественно передаёт обе функции.
- source_word: ἐστε
  choice: вы —
  rationale: Настоящее время εἰμί обозначает нынешнее состояние адресатов; в русском именная связка передана тире.
- source_word: υἱοί
  choice: сыны
  rationale: Форма означает именно «сыновья/сыны» и в Гал 3–4 связана с усыновлением и правом наследования. «Сыны» сохраняет эту образную и юридическую связь и при этом в данном контексте относится ко всем верующим.
- source_word: ἐξαπέστειλεν
  choice: послал
  rationale: Естественно передаёт завершённое действие Бога без стилистически избыточного «ниспослал» или «отправил».
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: Духа Своего Сына
  rationale: Сохраняет родительную связь исходного выражения и ясно обозначает принадлежность; прописные буквы соответствуют достоинству религиозного регистра русского текста.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: в наши сердца
  rationale: Прямая и естественная передача библейского антропологического образа без его истолкования как «внутреннего существа».
- source_word: κρᾶζον
  choice: взывающего
  rationale: Причастие согласуется с «Духом» и сохраняет Духа как грамматического субъекта сильного, явного обращения; «взывающего» dignified and natural in literary Russian.
- source_word: Αββα
  choice: Авва
  rationale: Сохраняет арамейскую форму обращения, уже традиционно транслитерируемую по-русски как «Авва».
- source_word: ὁ πατήρ
  choice: Отец
  rationale: Артикль входит в греческую форму, но выражение имеет смысл прямого обращения; русский вокативный контекст естественно требует «Отец», а не «Отец этот» или обязательного артиклевого эквивалента.
theological_decisions:
- issue: Передача υἱοί в контексте усыновления и наследования
  choice: сыны
  alternative: дети
  rationale: «Сыны» сохраняет ключевую для аргумента Павла связь статуса сына с наследованием. Смысл включает всех верующих независимо от пола, что пояснено в сноске, но не подменяет исходный образ более общим словом.
- issue: Разночтение притяжательного местоимения при слове «сердца»
  choice: наши сердца
  alternative: ваши сердца
  rationale: 'Основной текст следует предоставленному SBLGNT: ἡμῶν, «наши». Известное разночтение ὑμῶν, «ваши», отмечено в сноске.'
- issue: Кто взывает
  choice: Дух взывает
  alternative: верующие взывают посредством Духа
  rationale: Средний род единственного числа κρᾶζον грамматически согласован с τὸ πνεῦμα, поэтому непосредственным субъектом назван Дух. Возможная сопричастность верующих этому обращению не исключается, но не подставляется вместо грамматики стиха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис близок к греческому, но естественен по-русски. Маркеры всех трёх сносок должны быть видимы в основном тексте; разночтение относится к слову «наши».
