base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: ru
  text: Но что говорит Писание? «Прогони рабыню[a] и ее сына, потому что сын рабыни ни в коем случае не будет наследовать[c] вместе с сыном свободной женщины»[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невольницу». Греческое слово обозначает женщину-рабыню или несвободную служанку; в этом отрывке существенно противопоставление рабства и свободы.'
    reason: lexical_alternative
  - marker: b
    text: Цитата перекликается с Бытие 21:10.
    reason: cross_reference
  - marker: c
    text: 'В греческом тексте стоит усиленное отрицание: «ни в коем случае не будет наследовать»; также возможно: «никак не будет наследовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт контрастный переход от предшествующего рассуждения просто и естественно.
- source_word: τί λέγει ἡ γραφή
  choice: что говорит Писание
  rationale: Сохраняет настоящее время и олицетворённую формулу ссылки на авторитетный текст.
- source_word: Ἔκβαλε
  choice: Прогони
  rationale: Передаёт повеление и резкий смысл удаления; сильнее, чем нейтральное «отошли», но естественно для современного русского языка.
- source_word: παιδίσκην
  choice: рабыню
  rationale: Греческое слово обозначает женщину несвободного положения; «рабыня» ясно сохраняет ключевое для контекста противопоставление рабства и свободы.
- source_word: υἱὸν αὐτῆς
  choice: сына её
  rationale: Точно передаёт притяжательную конструкцию и соответствует несколько торжественному регистру цитаты.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: потому что ... ни в коем случае не будет наследовать
  rationale: Оборот «ни в коем случае не» передаёт усиленное греческое отрицание οὐ μή, не ослабляя категоричности высказывания.
- source_word: μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας
  choice: вместе с сыном свободной
  rationale: Сохраняет значение совместного участия в наследовании; субстантивированное прилагательное «свободной» естественно подразумевает женщину и поддерживает противопоставление с рабыней.
theological_decisions:
- issue: Передача παιδίσκη в аллегорическом противопоставлении Агари и Сарры
  choice: рабыня
  alternative: служанка
  rationale: В ближайшем контексте Павел прямо противопоставляет рабство и свободу. «Служанка» могла бы скрыть юридическую несвободу, тогда как «рабыня» сохраняет смысл текста без добавления конфессионального толкования.
- issue: Сила отрицания οὐ μή при будущем времени
  choice: ни в коем случае не будет наследовать
  alternative: не будет наследовать
  rationale: Двойное греческое отрицание выражает категорическое исключение; усиленная русская формулировка сохраняет эту силу, не уточняя богословский объём образа за пределами стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром, уместным для прямой цитаты из Писания. Синтаксис остаётся близким к греческому, но читается естественно; ключевое противопоставление «рабыня — свободная» сохранено явно.
