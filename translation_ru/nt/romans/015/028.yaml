  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: ru
  text: Итак, завершив это дело и удостоверив печатью передачу им этого плода[a][b], я отправлюсь к вам по пути в Испанию[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надёжно передав им этот плод». Образ печати, вероятно, означает официально удостоверенную или обеспеченную передачу собранного дара получателям.'
    reason: lexical_alternative
  - marker: b
    text: Под «этим плодом» имеется в виду денежное пожертвование, собранное верующими из других народов для святых в Иерусалиме.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «через вас». Павел намеревается направиться в Испанию через римскую общину; это выражение может также подразумевать её содействие его дальнейшему путешествию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Итак, завершив это дело
  rationale: «Итак» передаёт выводно-переходное значение οὖν. Причастная конструкция сохраняет предшествование завершения поручения будущему отъезду; «это дело» естественно отсылает к обсуждаемому сбору и его доставке.
- source_word: σφραγισάμενος
  choice: скрепив … печатью
  rationale: Сохранён конкретный образ глагола σφραγίζω — «запечатывать, скреплять печатью», хотя в контексте он, вероятно, указывает на надёжную или официально подтверждённую передачу пожертвования.
- source_word: αὐτοῖς
  choice: для них
  rationale: Дательный падеж относится к получателям в Иерусалиме. «Для них» естественнее сочетается по-русски с образом скрепления дара печатью и не исключает оттенка передачи им.
- source_word: τὸν καρπὸν τοῦτον
  choice: этот плод
  rationale: 'Сохранена метафора Павла: пожертвование — осязаемый плод щедрости верующих из других народов.'
- source_word: ἀπελεύσομαι
  choice: я отправлюсь
  rationale: Будущая форма естественно выражает дальнейший отъезд Павла к следующему месту назначения.
- source_word: δι’ ὑμῶν
  choice: через вас
  rationale: Буквально сохраняет пространственное значение διά с родительным падежом, не уточняя сверх текста, идёт ли речь только о пути через Рим или также о содействии римских верующих.
- source_word: εἰς Σπανίαν
  choice: в Испанию
  rationale: Обычное современное русское обозначение направления и пункта назначения.
theological_decisions:
- issue: Смысл образа «скрепив печатью этот плод» применительно к сбору для Иерусалима
  choice: Сохранить в основном тексте образ печати.
  alternative: «надёжно доставив им это пожертвование»
  rationale: Метафора не является догматическим тезисом, но её устранение скрыло бы необычный выбор слова у Павла. Сноска сообщает вероятный смысл, не выдавая его за единственно возможный.
- issue: Значение δι’ ὑμῶν в плане путешествия Павла
  choice: «через вас»
  alternative: «через ваши места» или «побывав у вас»
  rationale: 'Буквальный вариант сохраняет возможную многозначность: путь через общину в Риме мог подразумевать как посещение, так и помощь в дальнейшем путешествии.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского письма. Необычные образы «скрепить печатью плод» и «через вас» сохранены ради прозрачности исходного текста и пояснены в сносках.
