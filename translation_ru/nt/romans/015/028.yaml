  - severity: medium
    issue: «Я отправлюсь через вас в Испанию» неестественно в современном русском.
    rationale: При обращении к людям «через вас» обычно не обозначает маршрут через их город/общину. Более идиоматичное «к вам по пути в Испанию» передаёт предполагаемое посещение римских адресатов и направление дальнейшего пути; буквальность отмечается в сноске.
