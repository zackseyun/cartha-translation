  rationale: Исправление делает две конструкции естественными для современного литературного русского, не снимая текстовой образности. «Удостоверив печатью передачу» передаёт и буквальный мотив σφραγίζω, и его контекстуальную направленность к получателям. Маршрутная формулировка передаёт δι’ ὑμῶν без буквального, но неидиоматичного «через вас»; спорные или дополнительные оттенки оставлены в сносках.
