  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: ru
  text: Ведь Македония и Ахайя сочли за благо сделать пожертвование для бедных среди святых в Иерусалиме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проявить участие»; греческое выражение подчёркивает общность и участие, проявленные в материальной поддержке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: сочли за благо
  rationale: Передаёт и добровольное решение, и благожелательное расположение, выраженные аористом εὐδοκέω.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно вводит по-русски пояснение или основание к предшествующей мысли.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: Македония и Ахайя
  rationale: 'Сохраняет метонимию оригинала: названия областей обозначают находящиеся там христианские общины, не добавляя прямо слов «церкви» или «верующие».'
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: собрать пожертвование
  rationale: В данном контексте κοινωνία обозначает общность и участие, получающие материальное выражение; русское сочетание ясно передаёт сбор помощи. Неопределённость τινά не выражена отдельным словом, поскольку «некоторое пожертвование» звучит неестественно и может ошибочно восприниматься как умаление дара.
- source_word: εἰς τοὺς πτωχοὺς
  choice: для бедных
  rationale: Передаёт направленность и назначение помощи в пользу её получателей.
- source_word: τῶν ἁγίων
  choice: среди святых
  rationale: Генитив указывает, что бедные принадлежат к более широкой группе святых; «среди» ясно передаёт это отношение.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Кратко и естественно передаёт определение, относящееся к святым.
theological_decisions:
- issue: Передача ἅγιοι в посланиях Павла
  choice: святые
  alternative: святой народ; верующие
  rationale: «Святые» сохраняет устойчивое павловское обозначение всех принадлежащих Богу верующих и не ограничивает слово позднейшим значением канонизированных лиц.
- issue: Материальный и общинный смысл κοινωνία
  choice: пожертвование с пояснением в сноске об участии и общении
  alternative: участие; общение; совместная помощь
  rationale: 'Контекст сбора требует ясного материального значения, однако сноска сохраняет более широкий оттенок κοινωνία: общность, проявленную в материальной поддержке.'
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Сочли за благо» сохраняет достоинство и положительную добровольность решения; «собрать пожертвование» естественно описывает организованную материальную помощь.
