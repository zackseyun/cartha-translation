source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: ru
  text: Ведь всё, что было написано прежде, было написано для нашего наставления, чтобы благодаря стойкости и ободрению Писаний[a] у нас была надежда.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утешению Писаний»; слово παράκλησις может означать ободрение, утешение или увещание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы мы имели надежду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: всё, что
  rationale: Передаёт всеохватное значение среднего рода множественного числа и естественно звучит по-русски.
- source_word: προεγράφη
  choice: было написано прежде
  rationale: Сохраняет временное значение приставки προ- и не привносит неуместного здесь смысла публичного объявления.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: для нашего наставления
  rationale: Передаёт значение цели и формирующего обучения; «наставление» уместно в современном литературном и библейском регистре.
- source_word: ἐγράφη
  choice: было написано
  rationale: Сохраняет повтор глагола γράφω и риторическое ударение оригинала.
- source_word: διὰ τῆς ὑπομονῆς
  choice: благодаря стойкости
  rationale: ὑπομονή обозначает терпеливую стойкость в испытаниях; «благодаря» естественно выражает средство, не делая фразу тяжеловесной.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: ободрению Писаний
  rationale: «Ободрение» передаёт укрепляющую функцию παράκλησις, а родительный оборот сохраняет непосредственную связь с Писаниями.
- source_word: τῶν γραφῶν
  choice: Писаний
  rationale: В контексте речь идёт о признанных священных текстах; прописная буква ясно обозначает этот референт.
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: у нас была надежда
  rationale: Естественная русская конструкция цели после «чтобы», точно передающая обладание надеждой без искусственной буквальности.
theological_decisions:
- issue: Как Писания связаны со стойкостью, ободрением и надеждой
  choice: Родительный оборот «Писаний» непосредственно отнесён к «ободрению», а вся формулировка показывает, что прежние Писания служат наставлению и ведут к надежде.
  alternative: Понимать и стойкость, и ободрение как то, что дают Писания.
  rationale: Порядок и синтаксис греческого текста непосредственно связывают τῶν γραφῶν с παρακλήσεως, но допускают более широкую смысловую связь со всей парой. Перевод не разрешает эту неоднозначность догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор «было написано» сохранён ради риторической структуры оригинала; формулировка остаётся понятной обычному читателю.
