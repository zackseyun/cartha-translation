  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: ru
  text: А теперь я иду в Иерусалим, служа святым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы послужить святым». По контексту речь, вероятно, идёт о доставке собранной помощи верующим в Иерусалиме (см. Рим. 15:26).'
    reason: Лексическая альтернатива и контекстуальное пояснение значения διακονῶν.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: А теперь
  rationale: νυνί подчёркивает настоящее время, а δέ обозначает мягкий переход с оттенком противопоставления; «А теперь» естественно передаёт обе функции.
- source_word: πορεύομαι
  choice: я иду
  rationale: Настоящее время обозначает предстоящее или уже начатое движение к месту назначения; «иду» прямо и естественно передаёт это без излишнего уточнения способа путешествия.
- source_word: εἰς Ἰερουσαλὴμ
  choice: в Иерусалим
  rationale: εἰς с названием города указывает направление и место назначения; нормативный русский эквивалент — «в Иерусалим».
- source_word: διακονῶν
  choice: чтобы послужить
  rationale: Причастие выражает обстоятельство и, в данном контексте, цель поездки. Инфинитивная конструкция естественна по-русски и сохраняет широкий смысл практического служения, не сводя его прямо к доставке пожертвования.
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: В посланиях Павла οἱ ἅγιοι обычно обозначает верующих как Божий святой народ. Традиционное «святым» лексически точно и не заменяет исходное выражение толкованием.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: Сохранено слово «святым»; в контексте это верующие в Иерусалиме, особенно нуждающиеся среди них.
  alternative: 'Передать описательно: «верующим в Иерусалиме» или «Божьему народу».'
  rationale: Сам стих употребляет общее обозначение «святые», тогда как ближайший контекст уточняет адресатов помощи. Основной текст сохраняет формулировку источника и не подменяет её контекстуальным пояснением.
- issue: Характер служения Павла
  choice: «чтобы послужить» с пояснением в сноске о вероятной доставке собранной помощи.
  alternative: «чтобы доставить помощь» или «неся помощь».
  rationale: διακονῶν само по себе шире доставки пожертвования, хотя следующий стих ясно связывает поездку со сбором для бедных. Перевод сохраняет лексическую широту и одновременно позволяет читателю увидеть конкретный контекст.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и достойная по тону. «Послужить» сохраняет библейскую лексику, оставаясь понятным современному читателю; церковная должность или особый сан не подразумеваются.
