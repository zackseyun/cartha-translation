  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: ru
  text: Каждый из нас пусть угождает ближнему ради его блага[a] и для его созидания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради добра»; «для блага». Греческое выражение указывает на благую и полезную цель, а не просто на удовлетворение желаний ближнего.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для созидания». Греческое слово использует образ строительства в значении укрепления и развития другого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: каждый из нас
  rationale: Передаёт дистрибутивное единственное число с родительным целого и сохраняет личную направленность увещания ко всей общине.
- source_word: τῷ πλησίον
  choice: ближнему
  rationale: Естественный и этически ёмкий русский эквивалент для πλησίον; по контексту обозначает другого человека, находящегося рядом с нами.
- source_word: ἀρεσκέτω
  choice: пусть угождает
  rationale: Конструкция «пусть» с формой третьего лица передаёт повелительную силу греческого императива. «Угождать» здесь ограничено следующими указаниями на благо и укрепление, поэтому не означает безусловного человекоугодия.
- source_word: εἰς τὸ ἀγαθὸν
  choice: ради его блага
  rationale: 'Передаёт целевую направленность фразы: речь идёт о пользе ближнего, а не просто о том, чтобы доставить ему удовольствие. Местоимение «его» естественно восполняется из контекста.'
- source_word: πρὸς οἰκοδομήν
  choice: чтобы укреплять его
  rationale: Передаёт метафорическое значение οἰκοδομή — созидание и укрепление человека — ясным современным русским языком; объект восполнен из «ближнему».
theological_decisions:
- issue: Границы требования угождать ближнему
  choice: Угождение ограничено благом и укреплением ближнего.
  alternative: Понимать фразу как безусловное приспособление к желаниям других людей.
  rationale: 'Обе целевые конструкции в греческом тексте определяют характер угождения: оно должно приносить благо и служить созиданию, а не выражать неограниченное стремление получить одобрение.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. «Пусть угождает» сохраняет императив и традиционно понятную лексику, а целевые обороты не дают услышать в нём призыв к человекоугодию. Маркеры сносок расположены непосредственно после соответствующих выражений.
