  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: ru
  text: Бог же, дающий стойкость и ободрение, пусть дарует вам быть единомысленными друг с другом[a] в соответствии с Мессией Иисусом[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мыслить одинаково»; «иметь один и тот же настрой».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «согласно Мессии Иисусу»; также: «в согласии с Мессией Иисусом».'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Бог же
  rationale: δέ мягко связывает молитвенное пожелание с предыдущей мыслью; частица «же» естественно передаёт этот переход, не создавая резкого противопоставления.
- source_word: τῆς ὑπομονῆς
  choice: дающий стойкость
  rationale: ὑπομονή обозначает стойкое терпение и выдержку под давлением. Генитив допускает понимание Бога как источника этого качества; явное «дающий» делает выражение естественным по-русски.
- source_word: τῆς παρακλήσεως
  choice: ободрение
  rationale: παράκλησις может означать утешение, ободрение или увещание; в связи с 15:4 «ободрение» сохраняет широкий смысл духовной поддержки.
- source_word: δῴη
  choice: пусть даст
  rationale: Аористный оптатив в молитвенном пожелании передан конструкцией «пусть даст», сохраняющей желательное значение без архаизации.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: быть единомысленными
  rationale: φρονεῖν относится к настрою и образу мыслей. «Быть единомысленными» естественно передаёт общность настроя, не обязательно подразумевая полное совпадение мнений во всём.
- source_word: ἐν ἀλλήλοις
  choice: друг с другом
  rationale: Фраза обозначает взаимную, общинную сферу единомыслия; «друг с другом» звучит естественно в современном русском.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: в соответствии с Мессией Иисусом
  rationale: κατά указывает на соответствие норме или образцу, а Χριστός сохраняет значение титула «Мессия».
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия Иисус
  alternative: Христос Иисус
  rationale: Слово Χριστός здесь сохраняет смысл мессианского титула, поэтому переведено как «Мессия», а не оставлено в традиционной транслитерированной форме.
- issue: Смысл τὸ αὐτὸ φρονεῖν
  choice: быть единомысленными
  alternative: думать одинаково
  rationale: Выражение передаёт общность настроя и направленности среди верующих, не усиливая его до требования одинакового мнения по каждому вопросу.
- issue: Генитивы τῆς ὑπομονῆς καὶ τῆς παρακλήσεως
  choice: Бог, дающий стойкость и ободрение
  alternative: Бог стойкости и ободрения
  rationale: Греческая конструкция допускает источник или характерную принадлежность. В русском явное «дающий» естественно выражает вероятный смысл источника, согласующийся с последующим δῴη, хотя буквальная конструкция остаётся возможной.
translation_notes:
  register: Современный литературный русский с умеренно торжественным молитвенным звучанием. Конструкция «Бог же… пусть даст» сохраняет связь с контекстом и силу пожелания; избегаются как архаизмы, так и разговорность.
