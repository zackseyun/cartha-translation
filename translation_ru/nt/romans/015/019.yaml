  footnotes:
  - marker: a
    text: 'Или: «силой Святого Духа».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Благую весть о Мессии»; греческий родительный падеж может указывать как на содержание вести, так и на её источник или принадлежность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: силой
  rationale: Повторённое сочетание обозначает средство и действенную силу; краткая форма «силой» естественна по-русски и сохраняет параллелизм.
- source_word: σημείων καὶ τεράτων
  choice: знамений и чудес
  rationale: Устойчивое библейское сочетание обозначает необычайные деяния, свидетельствующие о Божьем действии.
- source_word: πνεύματος
  choice: Духа
  rationale: В данном контексте наиболее вероятна ссылка на Божьего Духа; прописная буква передаёт этот референт, не добавляя отсутствующего в основном греческом тексте слова «Святого».
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: от Иерусалима и по всей округе
  rationale: Наречие κύκλῳ указывает не только на прямой маршрут, но и на охваченные служением окрестные области.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: вплоть до Иллирика
  rationale: Передаёт географический предел распространения служения Павла.
- source_word: πεπληρωκέναι
  choice: во всей полноте возвестил
  rationale: В сочетании с «Благой вестью» глагол указывает на полное осуществление её возвещения в названном пространстве; перевод избегает неестественного русского оборота «исполнил Благую весть».
- source_word: τὸ εὐαγγέλιον
  choice: Благую весть
  rationale: Передаёт значение существительного понятным современным русским выражением, сохраняя его содержание как провозглашаемой вести.
- source_word: τοῦ Χριστοῦ
  choice: о Мессии
  rationale: Χριστός здесь сохраняет титульное значение. Предлог «о» естественно связывает родительный оборот с содержанием возвещаемой вести, хотя греческий родительный допускает и иные отношения.
theological_decisions:
- issue: Референт πνεύματος
  choice: Духа, то есть Божьего Святого Духа
  alternative: духа в более общем смысле; по варианту чтения — Святого Духа
  rationale: Контекст знамений, чудес и апостольского служения убедительно указывает на Святого Духа, но основной текст не разворачивает греческое слово дополнительным определением.
- issue: Смысл πεπληρωκέναι τὸ εὐαγγέλιον
  choice: во всей полноте возвестил Благую весть
  alternative: исполнил служение Благой вести; довёл возвещение Благой вести до полноты
  rationale: Оборот говорит о полном осуществлении миссии по распространению вести, а не о том, что сама весть нуждалась в исполнении как пророчество.
- issue: Отношение родительного τοῦ Χριστοῦ
  choice: Благая весть о Мессии
  alternative: Благая весть Мессии
  rationale: Контекст естественно допускает понимание Мессии как содержания вести, однако греческий родительный сам по себе не исключает понимания Мессии как её источника или принадлежности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повтор «силой… силой…» сохранён ради риторического акцента. «По всей округе» передаёт широкий географический охват, а не обязательно круговой маршрут. Конечная запятая сохранена, поскольку данный фрагмент является частью продолжающегося предложения.
