  - severity: medium
    issue: «Благая весть о Мессии» в основном тексте сужает значение τοῦ Χριστοῦ.
    rationale: Греческий родительный может выражать содержание, принадлежность или источник. Перевод «Благая весть Мессии» сохраняет эту компактную неоднозначность; пояснение можно вынести в сноску.
  - severity: low
