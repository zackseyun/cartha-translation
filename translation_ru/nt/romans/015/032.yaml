    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит целевое придаточное и сохраняет связь с предшествующей просьбой Павла.
- source_word: ἐν χαρᾷ
  choice: с радостью
  rationale: Передаёт обстоятельство образа действия естественным современным русским выражением и сохраняет существительное «радость».
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: мне ... прийти к вам
  rationale: Аористное причастие подчинено основной глагольной форме; русский инфинитив в конструкции с «чтобы мне» ясно передаёт желаемый приход Павла.
- source_word: διὰ θελήματος θεοῦ
  choice: по воле Бога
  rationale: Обычное русское выражение, передающее совершение прихода согласно Божьей воле, без излишнего уточнения оттенка διά.
- source_word: συναναπαύσωμαι
  choice: вместе с вами обрести отдых
  rationale: Передаёт значение совместного отдыха и ободрения, заложенное в приставке συν-, сохраняя образ отдыха и не сводя его только к эмоциональному «ободриться».
theological_decisions:
- issue: Взаимность ожидаемого общения Павла с римскими верующими
  choice: вместе с вами обрести отдых
  alternative: получить подкрепление вместе с вами
  rationale: Формулировка показывает, что Павел надеется не только послужить общине, но и разделить с ней отдых и восстановление; при этом она не превращает возможный взаимный оттенок в более категоричное утверждение.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и понятный. Формулировка сохраняет целевую связь с предыдущим стихом и совместный характер ожидаемого отдыха.
