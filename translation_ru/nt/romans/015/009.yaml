  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: ru
  text: 'а язычники — чтобы прославить Бога за Его милость[a], как написано: «Потому буду славить Тебя среди народов и воспевать имя Твоё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за милость». По смыслу речь идёт о Божьей милости. Греческие слова ἔθνη и ἔθνεσι, переданные здесь как «язычники» и «народы», могут означать и «народы»; Павел применяет цитату к язычникам.'
    reason: Уточняет подразумеваемого носителя милости и сохраняет лексическую связь и смысловой диапазон двух употреблений ἔθνη/ἔθνεσι.
lexical_decisions:
- source_word: τὰ δὲ ἔθνη
  choice: а язычники
  rationale: В контексте Послания к римлянам ἔθνη обозначает прежде всего нееврейские народы в отличие от Израиля; «язычники» передаёт это противопоставление и сохраняет связь с предыдущим стихом.
- source_word: ὑπὲρ ἐλέους
  choice: за Его милость
  rationale: ὑπέρ с родительным падежом выражает основание благодарного прославления. Местоимение «Его» проясняет, что речь идёт о Божьей милости, не меняя смысла.
- source_word: δοξάσαι
  choice: прославить
  rationale: Аористный инфинитив синтаксически продолжает конструкцию стиха 8; русский инфинитив сохраняет зависимость от предыдущего контекста без искусственного превращения фрагмента в самостоятельное предложение.
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Естественная и устоявшаяся русская формула введения цитаты из Писания.
- source_word: ἐξομολογήσομαί σοι
  choice: буду славить Тебя
  rationale: В данном богослужебном контексте глагол означает открыто воздавать Богу хвалу или благодарение, а не исповедовать грех; «славить» естественно сочетается с последующим «воспевать».
- source_word: ἐν ἔθνεσι
  choice: среди народов
  rationale: В самой цитате множественное ἔθνεσι естественно сохраняет более широкий ветхозаветный смысл «народы». Это также позволяет не стирать смысловой диапазон слова, хотя Павел применяет цитату к язычникам.
- source_word: ψαλῶ
  choice: воспевать
  rationale: Передаёт пение хвалы Богу естественным современным литературным языком и не ограничивает действие исполнением только канонических псалмов.
- source_word: τῷ ὀνόματί σου
  choice: имя Твоё
  rationale: При русском переходном глаголе «воспевать» винительный падеж естественно передаёт объект хвалы, сохраняя библейский образ Божьего имени.
theological_decisions:
- issue: Синтаксическая зависимость начальной части стиха
  choice: 'Сохранить продолжение мысли стиха 8: «а язычники — прославить Бога»'
  alternative: 'Оформить как самостоятельное утверждение: «а язычники прославляют Бога» или «чтобы язычники прославили Бога»'
  rationale: Греческий инфинитив δοξάσαι зависит от предшествующей конструкции. Тире помогает русскому читателю увидеть эллиптический параллелизм и не вводит лишнего временного или модального значения.
- issue: Соотношение значений ἔθνη в авторском рассуждении и цитате
  choice: В авторской части — «язычники», в цитате — «народы»
  alternative: В обоих случаях «язычники» либо в обоих случаях «народы»
  rationale: Так сохраняются одновременно конкретное применение Павла к неевреям и более широкий смысл исходной цитаты; богословское напряжение не снимается унификацией.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией цитаты. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Начальная строчная буква показывает, что стих синтаксически продолжает предыдущий.
