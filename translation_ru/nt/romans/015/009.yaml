review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: τὰ ἔθνη в рассуждении Павла обоснованно передано как «язычники», ὑπὲρ ἐλέους — как «за Его милость», а в цитате сохранено более широкое «среди народов». Цитатные глаголы «славить» и «воспевать» удачно передают ἐξομολογήσομαι и ψαλῶ. Однако русская конструкция «а язычники — прославить Бога» слишком фрагментарна и с тире воспринимается как синтаксический сбой; зависимое значение инфинитива следует выразить естественным русским союзом «чтобы».'
  naturalness: «А язычники — прославить Бога» не является естественным современным литературным русским даже при учёте продолжения из предыдущего стиха. «А язычники — чтобы прославить Бога» сохраняет зависимость от стиха 8 и делает фразу читаемой. В цитате «Потому буду славить» звучит естественнее, чем несколько неопределённое «За это буду славить».
  terminology: «Язычники» в авторской части верно передаёт контекстуальное значение ἔθνη как нееврейских народов. «Среди народов» в цитате оправданно сохраняет лексический диапазон ἔθνεσι. «Его милость» — допустимое и смыслово точное прояснение подразумеваемого в греческом референта. Сноска должна яснее назвать альтернативу «народы» и связь обоих употреблений ἔθνη/ἔθνεσι.
  issues:
  - severity: medium
    issue: Неестественная эллиптическая конструкция в начале стиха
    rationale: Инфинитив δοξάσαι синтаксически зависит от предыдущего стиха, но русское «а язычники — прославить» без союза не воспроизводит эту зависимость идиоматично. «Чтобы прославить» передаёт подчинённую целевую/результативную функцию, не превращая её в самостоятельное утверждение.
  - severity: low
    issue: Неудачная связка «За это» в цитате
    rationale: Διὰ τοῦτο означает «поэтому», «вследствие этого». «Потому» естественнее выражает основание последующего славословия и не меняет смысла.
  - severity: low
    issue: Сноска неполно обозначает лексическую альтернативу
    rationale: Следует прямо указать, что ἔθνη/ἔθνεσι может означать «народы», а не только сказать, что слово в цитате «также может быть передано как “язычники”».
  revised_text: 'а язычники — чтобы прославить Бога за Его милость[a], как написано: «Потому буду славить Тебя среди народов и воспевать имя Твоё».'
