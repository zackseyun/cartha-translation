  rationale: Исправление ограничено русским синтаксисом зависимого инфинитива, более естественной причинной связкой в цитате и уточнением сноски. Оно сохраняет связь стиха с предшествующим контекстом, различение между павловским применением к язычникам и более широким смыслом цитаты, а также единственный исходный якорь сноски.
