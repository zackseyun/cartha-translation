  terminology: «Бог надежды» точно сохраняет образ и не сужает генитив до одной интерпретации. «Святой Дух» передан в принятой русской форме и соответствует πνεύματος ἁγίου. «Во всей полноте» ясно распространяет полноту радости и мира на оба члена, не меняя смысла.
