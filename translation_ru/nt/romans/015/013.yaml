  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: ru
  text: Пусть же Бог надежды наполнит вас радостью и миром во всей полноте в вере, чтобы вы изобиловали надеждой силой Святого Духа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Бог же, дающий надежду
  rationale: δὲ передано мягким связующим «же». Генитив τῆς ἐλπίδος допускает характеристику Бога через надежду; выражение «дающий надежду» естественно по-русски обозначает Бога как её источник, не исключая того, что надежда обращена к Нему.
- source_word: πληρώσαι
  choice: пусть наполнит
  rationale: Аорист оптатива выражает молитвенное пожелание или благословение; «пусть наполнит» естественно передаёт эту функцию и сохраняет образ полноты.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: всякой радостью и миром
  rationale: Родительные после πληρόω обозначают содержание наполнения. «Всякой» сохраняет всеохватность πάσης и грамматически относится к обоим однородным понятиям.
- source_word: ἐν τῷ πιστεύειν
  choice: в вере
  rationale: Оборот ἐν с артиклевым инфинитивом обозначает сферу или обстоятельство верования. Краткое русское «в вере» здесь естественно и передаёт продолжающееся состояние доверия, хотя формально греческий текст использует глагольный инфинитив.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: чтобы вы изобиловали
  rationale: εἰς τὸ с инфинитивом может выражать цель или результат; «чтобы» сохраняет эту допустимую смысловую широту в молитвенном контексте.
- source_word: ἐν τῇ ἐλπίδι
  choice: надеждой
  rationale: Русский творительный после «изобиловать» идиоматически передаёт сферу или содержание изобилия и сохраняет лексическую связь с первым упоминанием надежды.
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: силой Святого Духа
  rationale: ἐν δυνάμει здесь естественно имеет инструментальный оттенок; русский творительный ясно выражает средство. πνεύματος ἁγίου обозначает Святого Духа.
theological_decisions:
- issue: Смысл выражения θεὸς τῆς ἐλπίδος
  choice: Бог, дающий надежду
  alternative: Бог надежды
  rationale: Генитив может характеризовать Бога как источник надежды и как Того, на Кого она направлена. Выбранный вариант ясен современному читателю и подчёркивает источник, не добавляя конфессиональной конкретизации.
- issue: Передача πνεύματος ἁγίου
  choice: Святого Духа
  alternative: святого духа
  rationale: В контексте Павла речь идёт о Божьем Святом Духе; прописные буквы естественно обозначают этот референт по-русски, не разворачивая дополнительных догматических утверждений.
- issue: Цель или результат в εἰς τὸ περισσεύειν
  choice: чтобы вы изобиловали
  alternative: так что вы будете изобиловать
  rationale: Конструкция допускает оттенки цели и результата. «Чтобы» уместно в благословении и не требует жёстко отделять желаемый результат от цели.
translation_notes:
  register: Современный литературный русский язык; молитвенно-благословительный тон сохранён без архаических форм. Синтаксис плавный и понятный обычному читателю.
