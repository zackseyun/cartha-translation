source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: ru
  text: чтобы мне быть служителем Мессии Иисуса для язычников[a], совершая священное служение возвещения Божьей Благой Вести[b], дабы приношение язычников[c] стало приемлемым, освящённым Святым Духом[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для народов». Здесь речь идёт о нееврейских народах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «священнодействующим Божью Благую Весть»; то есть совершающим священное, подобное священническому служение при возвещении Божьей Благой Вести.'
    reason: lexical_alternative
  - marker: c
    text: 'Вероятнее всего, сами язычники представлены Богу как приношение; возможно также: «приношение, принесённое язычниками».'
    reason: alternative_reading
  - marker: d
    text: 'Или: «освящённым в Святом Духе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: служителем
  rationale: Слово обозначает совершающего общественное или священное служение. «Служитель» естественно передаёт служение и не превращает метафору Павла в утверждение о формальной священнической должности.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет титульное значение; «Мессия» передаёт его смысл, а русский порядок имён соответствует греческому обороту.
- source_word: εἰς τὰ ἔθνη
  choice: среди язычников
  rationale: В контексте Послания к римлянам ἔθνη обычно означает неевреев. Предлог εἰς при обозначении направленности служения естественно передаётся как «среди»; буквальная альтернатива отмечена в сноске.
- source_word: ἱερουργοῦντα
  choice: священнодействующим
  rationale: Глагол имеет отчётливо культовый, священнический оттенок. «Священнодействующим» сохраняет образ и связь с последующим «приношением».
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ради Божьей Благой Вести
  rationale: При ἱερουργέω винительный может обозначать то, в отношении чего совершается священное служение. Такая формулировка сохраняет метафору, но не представляет саму Благую Весть жертвой; более формальная передача дана в сноске.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: приношение язычников
  rationale: Греческая родительная конструкция допускает понимание язычников как самого приношения и, менее вероятно, приношения, сделанного ими. Неоднозначность сохранена в тексте и пояснена в сноске.
- source_word: εὐπρόσδεκτος
  choice: угодным Богу
  rationale: В контексте приношения слово означает благоприятно принятое, угодное. Добавление «Богу» делает подразумеваемого принимающего ясным из контекста и звучит естественно по-русски.
- source_word: ἡγιασμένη
  choice: освящённым
  rationale: Совершенное пассивное причастие выражает состояние, наступившее вследствие освящения; «освящённым» сохраняет богословский регистр и согласуется с «приношением».
- source_word: ἐν πνεύματι ἁγίῳ
  choice: Святым Духом
  rationale: ἐν естественно понимать инструментально — Дух является совершающим освящение. Возможное значение сферы, «в Святом Духе», сохранено в сноске.
theological_decisions:
- issue: Священническое самоописание Павла
  choice: 'Сохранена метафора священного служения: Павел служит среди язычников, а итог миссии представлен как приношение Богу.'
  alternative: Понимать слова как утверждение о формальной священнической должности Павла либо устранить культовую образность и говорить лишь об общем служении.
  rationale: Сочетание λειτουργός, ἱερουργέω и προσφορά требует сохранить священнический образ, однако речь идёт о благовестии и язычниках как приношении, а не об искупительной жертве Павла.
- issue: Что означает «приношение язычников»
  choice: Наиболее вероятно, сами язычники представлены Богу как приношение — плод служения Павла.
  alternative: Приношение, сделанное язычниками.
  rationale: Миссионерский контекст и последовательная культовая метафора поддерживают первое понимание, но форма греческого родительного падежа не исключает второго, поэтому неоднозначность не устранена из основного текста.
- issue: Значение ἐν в освящении
  choice: Святой Дух понимается как совершающий освящение.
  alternative: Освящение происходит «в Святом Духе», то есть в сфере Его действия или присутствия.
  rationale: Инструментальное понимание хорошо соответствует пассивному «освящённым», но греческий предлог допускает также сферическое значение.
translation_notes:
  register: Современный литературный русский с достоинством апостольского текста. «Священнодействующим» намеренно сохраняет плотную культовую образность оригинала; «Благая Весть» понятнее широкому кругу читателей, чем одно лишь церковное «Евангелие». Все четыре сноски отмечены в основном тексте.
