id: ROM.15.29
reference: Romans 15:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: ru
  text: И я знаю, что, когда приду к вам, приду во всей полноте благословения Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа».'
    reason: Альтернативная традиционная передача титула Χριστός.
lexical_decisions:
- source_word: οἶδα
  choice: я знаю
  rationale: Передаёт уверенное знание Павла без ослабления до значения «полагаю» или «надеюсь».
- source_word: δὲ
  choice: И
  rationale: Здесь частица служит мягкой связкой с предыдущей мыслью; «и» естественно продолжает рассуждение, не создавая лишнего противопоставления.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: когда приду к вам
  rationale: Причастие имеет временное значение по отношению к будущему глаголу; придаточное с «когда» естественно по-русски.
- source_word: ἐλεύσομαι
  choice: приду
  rationale: Прямо передаёт форму будущего времени ἔρχομαι и сохраняет повтор корня, выражающий уверенность Павла в характере своего прихода.
- source_word: ἐν πληρώματι
  choice: во всей полноте
  rationale: Сохраняет образ полноты и завершённой меры; добавление «всей» делает русское выражение естественным, не меняя смысла.
- source_word: εὐλογίας
  choice: благословения
  rationale: 'Родительный падеж определяет содержание полноты: речь идёт о полноте благословения.'
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь передано как титул со значением «Мессия», а не как личное имя.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Перевод «Мессии» раскрывает значение греческого титула и следует его функции в данном контексте; традиционное «Христа» сохранено в примечании как допустимый вариант передачи.
- issue: Связь родительного Χριστοῦ с εὐλογίας
  choice: благословения Мессии
  alternative: мессианского благословения
  rationale: 'Родительный оборот сохраняет возможную смысловую широту: благословение может пониматься как исходящее от Мессии или принадлежащее ему; прилагательное сильнее истолковывало бы связь.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «приду… приду» сохранён вслед за греческой конструкцией как риторический акцент.
