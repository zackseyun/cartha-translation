id: ROM.15.21
reference: Romans 15:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: ru
  text: 'но, как написано:

    «Те, кому не возвещали о Нём, увидят,

    и те, кто не слышал, поймут».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Павел цитирует Исайю 52:15. В контексте Исайи местоимение «Нём» относится к Рабу; здесь Павел применяет эти слова к своему возвещению Благой вести.
    reason: cross_reference
  - marker: b
    text: 'Или: «Те, кому ничего не было возвещено о Нём, увидят, и те, кто не слышал, поймут».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт противопоставление предыдущему высказыванию Павла о цели его служения.
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Естественная русская формула введения цитаты, сохраняющая значение греческого перфекта.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Те, кому не возвещали о Нём
  rationale: Сохраняет дательный относительного местоимения и возвышенную лексику пророческой цитаты; «о Нём» точно передаёт περὶ αὐτοῦ без истолковывающего уточнения.
- source_word: ὄψονται
  choice: увидят
  rationale: Прямо передаёт будущее время ὁράω и не подменяет образное «увидят» толкованием «осознают».
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: те, кто не слышал
  rationale: По-русски прошедшее совершенного вида естественно выражает состояние тех, до кого весть прежде не дошла.
- source_word: συνήσουσιν
  choice: поймут
  rationale: Ясно и естественно передаёт будущее время συνίημι.
theological_decisions:
- issue: К кому относится местоимение αὐτοῦ в цитате из Исаии
  choice: Сохранено местоимение «о Нём» без пояснения в основном тексте.
  alternative: «о Мессии» или «о Христе»
  rationale: Греческий текст содержит местоимение, а не явное наименование. Сохранение местоимения не устраняет связь с образом Раба в контексте Исаии и не вносит толкование непосредственно в цитату.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным звучанием библейской цитаты. Инверсия и архаизмы избегаются; «возвещали» сохранено как понятное и уместное для публичного провозглашения.
