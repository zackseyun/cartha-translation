  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: ru
  text: Ибо я говорю, что Мессия стал служителем для обрезанных ради истины Божьей[a], чтобы утвердить обещания, данные отцам,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради верности Бога» — то есть Его верности данным Им обещаниям.'
    reason: 'Лексическая альтернатива: ἀλήθεια θεοῦ может подчёркивать Божью истинность и верность завету.'
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Ибо я говорю
  rationale: γάρ вводит объяснение предыдущей мысли, а λέγω естественно передаётся как «я говорю».
- source_word: Χριστόν
  choice: Мессия
  rationale: В контексте истории спасения и обещаний Израилю Χριστός выступает как титул.
- source_word: διάκονον
  choice: служителем
  rationale: Слово обозначает того, кто исполняет служение; «служитель» сохраняет ролевой смысл и не сводит его к церковной должности.
- source_word: γεγενῆσθαι
  choice: стал
  rationale: Перфектный инфинитив указывает на состоявшееся вступление в роль с сохраняющимся результатом; по-русски это естественно выражается формой «стал».
- source_word: περιτομῆς
  choice: обрезанных
  rationale: Генитив обозначает людей обрезания, то есть иудеев; сочетание «служителем обрезанных» близко к форме оригинала и понятно в контексте.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: ради истины Божьей
  rationale: ὑπέρ выражает основание или цель служения; ἀλήθεια θεοῦ допускает значение как Божьей истины, так и Божьей верности.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: чтобы утвердить
  rationale: Конструкция выражает цель, а βεβαιόω означает сделать твёрдым, подтвердить или утвердить.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: обещания, данные отцам
  rationale: 'Такой оборот естественно передаёт объективный генитив: речь идёт об обещаниях, обращённых к праотцам Израиля.'
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь титульный смысл особенно заметен из-за упоминания обрезанных и обещаний отцам.
- issue: Значение ἀλήθεια θεοῦ
  choice: истина Божья
  alternative: верность Бога
  rationale: Основной текст сохраняет широкое значение «истина», а сноска отмечает сильный контекстуальный оттенок Божьей верности данным обещаниям.
- issue: Отношение διάκονον к περιτομῆς
  choice: служителем обрезанных
  alternative: служителем для обрезанных
  rationale: Генитив оригинала формально допускает тесную связь «служитель обрезания/обрезанных»; выбранный вариант сохраняет её, не исключая направленности служения к иудеям.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Божьей» понятно современному читателю, а «отцам» сохраняет связь с праотцами Израиля. Конечная запятая сохранена, поскольку стих синтаксически продолжается в Римлянам 15:9.
