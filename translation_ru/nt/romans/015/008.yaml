  to: Ибо я говорю, что Мессия стал служителем для обрезанных ради истины Божьей[a], чтобы утвердить обещания, данные отцам,
  rationale: Исправлена только двусмысленная связь «служителем обрезанных». Новый вариант передаёт направленность служения, подразумеваемую контекстом и отражённую в английском аудиторском следе, сохраняя термин «обрезанные» и не подменяя его интерпретативным «иудеи».
