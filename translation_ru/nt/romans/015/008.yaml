  source_fidelity: 'Греческое διάκονον περιτομῆς в данном контексте означает служение Мессии по отношению к людям обрезания, то есть к иудеям; «служителем обрезанных» по-русски может быть понято как служитель, принадлежащий к группе обрезанных. «Для обрезанных» ясно передаёт контекстуальную направленность служения, не вводя лишнего толкования. Остальные элементы переданы точно: целевой оборот εἰς τὸ βεβαιῶσαι, обещания, данные отцам, и незавершённая синтаксическая связь со следующим стихом сохранены.'
  naturalness: «Служителем для обрезанных» звучит в современном литературном русском естественнее и устраняет двусмысленность исходного варианта. «Ибо я говорю», «ради истины Божьей» и «чтобы утвердить обещания, данные отцам» соответствуют умеренно торжественному библейскому регистру.
