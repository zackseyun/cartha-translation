  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: ru
  text: Но теперь, когда в этих краях для меня уже не осталось места и я уже много лет хочу прийти к вам,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Но теперь
  rationale: Естественно передаёт временной переход и противопоставительную силу δέ.
- source_word: μηκέτι τόπον ἔχων
  choice: когда для меня уже не осталось места для служения
  rationale: Передаёт не отсутствие физического места, а отсутствие дальнейшего поприща для деятельности Павла; добавление «для служения» делает подразумеваемый миссионерский смысл ясным.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: в этих краях
  rationale: Современное и естественное обозначение географических областей.
- source_word: ἐπιποθίαν δὲ ἔχων
  choice: а желание ... я имею
  rationale: Сохраняет второе δέ и выражает сильное, устойчивое желание без стилистически тяжёлого буквального причастного оборота.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: прийти к вам
  rationale: Прямо передаёт содержание желания, не добавляя более узкого значения «посетить».
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: уже много лет
  rationale: Идиоматично выражает длительность желания от прошлого до настоящего.
theological_decisions:
- issue: Значение τόπον ἔχων в миссионерском контексте
  choice: места для служения
  alternative: места / возможности
  rationale: Контекст Рим 15:19–24 указывает на завершение Павлом служения в данных областях. Формулировка не утверждает, что там буквально не осталось географического места, но делает контекстуальный смысл явным; сноска сохраняет лексическую широту образа.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет незавершённый синтаксис стиха, который продолжается в Рим 15:24. «В этих краях» звучит естественнее, чем более административное «в этих областях».
