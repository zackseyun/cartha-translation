id: ROM.15.10
reference: Romans 15:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: ru
  text: 'И ещё сказано: «Радуйтесь, язычники[a], вместе с его народом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы».'
    reason: Лексема ἔθνη может означать как язычников, то есть неевреев, так и народы вообще.
lexical_decisions:
- source_word: πάλιν
  choice: ещё
  rationale: В формуле введения очередной цитаты πάλιν означает, что приводится ещё одно свидетельство Писания. «Ещё» естественно звучит по-русски и передаёт последовательность цитат.
- source_word: λέγει
  choice: говорит
  rationale: 'Настоящее время сохранено: Писание представлено как говорящее сейчас. Отсутствующий в греческом тексте явно названный субъект не добавлен, поэтому русская формулировка сохраняет допустимую неоднозначность.'
- source_word: Εὐφράνθητε
  choice: радуйтесь
  rationale: Форма повелительного наклонения передаёт призыв радоваться. «Радуйтесь» сочетает точность, понятность и достойный регистр.
- source_word: ἔθνη
  choice: язычники
  rationale: В непосредственном контексте Рим 15 речь идёт о присоединении неевреев к хвале Бога вместе с Его народом. «Язычники» ясно передаёт это противопоставление, а более общее «народы» сохранено в сноске.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: вместе с его народом
  rationale: μετά с родительным падежом выражает совместность. «Вместе с его народом» естественно по-русски и не уточняет сверх текста, что под народом подразумевается Израиль.
- source_word: λαοῦ
  choice: народом
  rationale: λαός обозначает народ, нередко Божий народ завета. Перевод «народом» сохраняет прямое значение, не внося пояснение «Израилем» в основной текст.
theological_decisions:
- issue: Передача ἔθνη в цитате о единстве иудеев и неевреев
  choice: язычники
  alternative: народы
  rationale: Контекст Рим 15 подчёркивает участие язычников в прославлении Бога вместе с Его народом. При этом ἔθνη и ветхозаветный источник допускают более широкое значение «народы», поэтому оно отмечено в сноске.
- issue: Неявный субъект глагола λέγει
  choice: говорит — без добавления местоимения
  alternative: он говорит; сказано; Писание говорит
  rationale: В греческом предложении субъект прямо не назван. Русская конструкция без местоимения сохраняет формулу цитирования и не решает без необходимости, относится ли действие к Богу, автору цитируемого текста или Писанию.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой цитаты. Местоимение «его» дано со строчной буквы в соответствии с обычной современной орфографией; богословское содержание от этого не меняется.
