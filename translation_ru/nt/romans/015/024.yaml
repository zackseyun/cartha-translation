source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: ru
  text: когда я отправлюсь в Испанию[a], ибо надеюсь по пути увидеться с вами и чтобы вы помогли мне продолжить путь туда[b], если прежде хотя бы отчасти удовлетворюсь общением с вами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда бы я ни отправился в Испанию». Греческая конструкция указывает на неопределённое будущее время.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы вы проводили меня туда» или «чтобы вы помогли мне в дальнейшем пути туда». Глагол может подразумевать помощь или сопровождение на следующем этапе пути.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «если прежде отчасти насыщусь вами». Вероятно, имеется в виду удовлетворение от общения с ними перед продолжением пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι εἰς τὴν Σπανίαν
  choice: когда отправлюсь в Испанию
  rationale: Сочетание ὡς ἄν с сослагательным наклонением обозначает неопределённое будущее время. Русское «когда отправлюсь» естественно передаёт будущую, ещё не определённую по времени поездку.
- source_word: ἐλπίζω γὰρ
  choice: то надеюсь
  rationale: «Надеюсь» передаёт ожидание, соединённое с желанием. Частица γάρ объясняет подразумеваемое продолжение мысли; в естественном русском синтаксисе эту связь выражает конструкция «когда… то…».
- source_word: διαπορευόμενος θεάσασθαι ὑμᾶς
  choice: по пути увидеться с вами
  rationale: Причастие обозначает посещение Рима по дороге к дальнейшему месту назначения. В данном личном контексте взаимное «увидеться с вами» звучит естественнее буквального «увидеть вас» и не превращает встречу в официальный визит.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: с вашей помощью продолжить путь туда
  rationale: προπέμπω может подразумевать содействие, снабжение или сопровождение на следующем этапе пути. Формулировка сохраняет общий смысл помощи, не уточняя её вид.
- source_word: ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ
  choice: после того как хотя бы отчасти утешусь общением с вами
  rationale: ἐμπίμπλημι выражает насыщение или удовлетворение, а генитив ὑμῶν указывает на личное общение с адресатами. «Утешусь общением» естественно передаёт образ желанного насыщения присутствием верующих; «хотя бы отчасти» сохраняет ограничение ἀπὸ μέρους.
theological_decisions:
- issue: Характер помощи римских верующих в дальнейшем путешествии Павла
  choice: с вашей помощью продолжить путь туда
  alternative: чтобы вы проводили меня туда
  rationale: Глагол допускает как сопровождение, так и иное практическое содействие. Перевод не сводит его значение к финансовой поддержке, официальному посланию или личному сопровождению.
- issue: Смысл ожидаемого Павлом «насыщения» римскими верующими
  choice: хотя бы отчасти утешусь общением с вами
  alternative: хотя бы отчасти насыщусь вами
  rationale: Буквальный образ насыщения в русском выражении «насыщусь вами» звучит неестественно и может вызвать неверные ассоциации. Выбранный вариант передаёт желанное удовлетворение от личного общения, сохраняя частичность и не определяя её как длительность либо неполноту радости.
- issue: Условность планов Павла
  choice: когда отправлюсь… надеюсь
  alternative: всякий раз, когда отправлюсь
  rationale: Греческая конструкция указывает на неопределённое будущее событие, а не на неоднократные поездки. Русское «когда» сохраняет незаданность времени без ложной повторяемости.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского письма. Синтаксис завершён точкой, поскольку стих представлен отдельно, хотя в греческом тексте мысль типографически продолжается тире. Формулировки избегают церковного канцелярита и сохраняют неопределённость относительно времени поездки и вида дорожной помощи.
