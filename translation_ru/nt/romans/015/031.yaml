  - severity: low
    issue: «Непокорных» звучит как устойчивое свойство группы и несколько менее прозрачно, чем греческое причастие.
    rationale: Формулировка «тех, кто не повинуется» естественнее в современном русском и оставляет открытым контекстуальный диапазон между неповиновением и отказом верить.
  revised_text: чтобы я был избавлен от тех, кто не повинуется в Иудее[a], и чтобы моё служение для Иерусалима оказалось приемлемым для святых,
