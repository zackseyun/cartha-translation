id: ROM.15.31
reference: Romans 15:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: ru
  text: чтобы я был избавлен от тех, кто не повинуется в Иудее[a], и чтобы моё служение для Иерусалима оказалось приемлемым для святых,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от неверующих в Иудее». Греческое причастие может обозначать тех, кто отказывается верить и потому не повинуется.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: чтобы … и чтобы
  rationale: Союз вводит две однородные цели молитвы; повторение «чтобы» ясно и естественно передаёт две согласованные формы сослагательного наклонения.
- source_word: ῥυσθῶ
  choice: я был избавлен
  rationale: Пассивная форма передаёт избавление от грозящей опасности, не уточняя в самом тексте, кем именно оно будет совершено.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: от непокорных
  rationale: «Непокорных» сохраняет значение отказа повиноваться и не сводит выражение исключительно к интеллектуальному неверию; возможное значение «неверующих» вынесено в сноску.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: в Иудее
  rationale: Устоявшееся современное русское название области.
- source_word: διακονία
  choice: служение
  rationale: Слово сохраняет широкий смысл служения, включая подразумеваемое контекстом доставление пожертвований, но не вводит это уточнение непосредственно в стих.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: Иерусалиму
  rationale: Русский дательный естественно выражает направленность служения к Иерусалиму и его общине.
- source_word: εὐπρόσδεκτος
  choice: угодно
  rationale: Передаёт благосклонное принятие и положительную оценку служения со стороны святых.
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: Сохраняет обычное для Павла обозначение верующих и его богословскую ёмкость.
- source_word: γένηται
  choice: было
  rationale: В сочетании «было угодно» естественно передаёт желаемый результат — чтобы служение оказалось приемлемым, — без тяжеловесного буквализма.
theological_decisions:
- issue: Значение ἀπειθούντων применительно к противникам Павла в Иудее
  choice: «непокорных» в основном тексте
  alternative: «неверующих»
  rationale: Причастие может обозначать как неверие или отказ поверить, так и вытекающее из него неповиновение. Основной вариант сохраняет более широкий смысл, а контекстуально вероятная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской просьбы о молитве. Синтаксический параллелизм двух целей сохранён; термин «святые» оставлен как характерное для Павла обозначение верующих.
