  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: ru
  text: Они охотно сделали это, и они в долгу перед ними. Ведь если язычники[a] стали причастны к их духовным благам[b], то должны и послужить им материальными средствами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы». Здесь имеются в виду люди нееврейского происхождения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к их духовным вещам».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в плотских вещах». Здесь имеются в виду материальная помощь и обеспечение телесных нужд, в противоположность духовным благам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: сделали это по доброй воле
  rationale: Глагол выражает благосклонное решение и добровольное желание; само действие — сбор пожертвований — ясно из предыдущего стиха. Формулировка также сохраняет напряжение между добровольностью и следующей за ней обязанностью.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: в долгу они перед ними
  rationale: Естественное современное выражение, сохраняющее мысль о нравственном обязательстве язычников перед получателями помощи.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном контексте речь идёт о верующих нееврейского происхождения в отличие от иудейских верующих; «язычники» передаёт это точнее, чем буквальное «народы».
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: к их духовным благам
  rationale: Субстантивированное прилагательное обозначает полученное духовное достояние. «Блага» делает выражение естественным по-русски, а буквальная форма отмечена в сноске.
- source_word: ἐκοινώνησαν
  choice: стали причастны к
  rationale: Передаёт участие и получение доли, выраженные κοινωνέω с дательным падежом.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: материальными средствами
  rationale: В контексте денежного сбора выражение относится к телесным и материальным нуждам, а не к греховности; творительный падеж естественно передаёт средство служения.
- source_word: λειτουργῆσαι
  choice: послужить
  rationale: Сохраняет возвышенный оттенок служения, не создавая ошибочного впечатления о специальном церковном чине.
theological_decisions:
- issue: Значение σαρκικοῖς в противопоставлении πνευματικοῖς
  choice: материальными средствами
  alternative: плотскими вещами
  rationale: Непосредственный контекст — денежная помощь нуждающимся святым в Иерусалиме; поэтому речь идёт о материальном и телесном обеспечении, а не о греховной природе.
- issue: К кому относятся αὐτῶν и αὐτοῖς
  choice: к иерусалимским верующим, прежде всего иудейского происхождения
  alternative: к Израилю или иудеям в более широком смысле
  rationale: В стихах 25–26 непосредственно говорится о помощи святым в Иерусалиме. При этом довод Павла имеет более широкий историко-спасительный фон, поэтому перевод оставляет местоимения без уточняющей вставки.
- issue: Соотношение добровольности и долга
  choice: 'сохранены обе стороны: «по доброй воле» и «в долгу»'
  alternative: свести высказывание либо к добровольному дару, либо исключительно к обязательной выплате
  rationale: Греческий текст намеренно ставит рядом добровольное решение и реальную обязанность; перевод не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского рассуждения. Оборот «да и в долгу» естественно связывает добровольность пожертвования с нравственной обязанностью; «послужить» сохраняет служебно-сакральный оттенок λειτουργέω без клерикального сужения.
