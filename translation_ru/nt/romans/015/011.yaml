  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: ru
  text: 'И ещё: «Хвалите Господа[a], все народы[b], и пусть все племена восхвалят Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ГОСПОДА». В еврейском тексте цитаты стоит личное имя Бога, которое в греческом переводе передано словом κύριος («Господь»).'
    reason: alternative_reading
  - marker: b
    text: 'Или: «все язычники». Греческое ἔθνη может означать как «народы», так и «язычников»; здесь цитата имеет всеобщий смысл и вместе с тем соответствует рассуждению Павла о язычниках.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: И ещё
  rationale: Естественно вводит очередную цитату Писания и передаёт как καί, так и πάλιν.
- source_word: Αἰνεῖτε
  choice: Хвалите
  rationale: Прямо и естественно передаёт повелительное наклонение второго лица множественного числа.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: В самой цитате выражение имеет широкий, всеобщий смысл; при этом возможное значение «язычники» важно для рассуждения Павла и отмечено в сноске.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Стандартно передаёт греческое κύριος в новозаветной цитате; связь с именем Яхве в еврейском источнике сохранена в сноске.
- source_word: ἐπαινεσάτωσαν
  choice: пусть восхваляют
  rationale: Конструкция с «пусть» естественно передаёт повелительное наклонение третьего лица; «восхваляют» сохраняет близкий повтор с первым глаголом и небольшое лексическое различие.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение ясно отсылает к Господу и не требует неоправданного повторения существительного.
- source_word: πάντες οἱ λαοί
  choice: все племена
  rationale: Позволяет сохранить различие между ἔθνη и λαοί и поэтический параллелизм цитаты, не повторяя «все народы».
theological_decisions:
- issue: Передача κύριος в ветхозаветной цитате, где речь идёт о Боге Израиля
  choice: Господа
  alternative: ГОСПОДА
  rationale: Основной текст следует греческой форме κύριος и обычному новозаветному словоупотреблению; вариант с прописными буквами отражает стоящее в еврейском источнике личное имя Бога и указан в сноске.
- issue: Передача ἔθνη в контексте рассуждения Павла об иудеях и язычниках
  choice: все народы
  alternative: все язычники
  rationale: «Все народы» лучше сохраняет всеобщий призыв цитаты, тогда как «все язычники» яснее выявляет связь с ближайшим контекстом Послания; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Синтаксис оставлен ясным и ритмичным; различие между ἔθνη и λαοί передано словами «народы» и «племена». Маркеры сносок размещены непосредственно после соответствующих выражений.
