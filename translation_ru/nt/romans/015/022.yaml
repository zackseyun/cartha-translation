lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения Павла и естественно связывает стих с контекстом.
- source_word: καὶ
  choice: не выражено отдельно
  rationale: В русском предложении добавочное значение καὶ достаточно передаётся связью «Поэтому» с предыдущим контекстом; отдельное «также» звучало бы тяжеловесно и могло бы создать неясное сопоставление.
- source_word: ἐνεκοπτόμην
  choice: мне не удавалось
  rationale: Передаёт продолжительное или повторявшееся препятствие в прошлом, не уточняя его источник; это естественная современная русская конструкция.
- source_word: τὰ πολλὰ
  choice: много раз
  rationale: Наречное идиоматическое выражение здесь обозначает неоднократность; «много раз» ясно сохраняет повторяемость, тогда как «по большей части» в данном контексте менее вероятно.
- source_word: τοῦ ἐλθεῖν
  choice: прийти
  rationale: Инфинитив после глагола препятствия обозначает действие, совершению которого мешали; русская конструкция «не удавалось прийти» передаёт эту связь без лишнего уточнения.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: Передаёт направленность движения к адресатам; цель посещения понятна из контекста и не добавляется в текст.
