  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: ru
  text: Настоятельно прошу вас, братья[a], ради нашего Господа Иисуса, Мессии[b], и ради любви Духа[c] подвизаться вместе со мной в молитвах к Богу за меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово имеет форму мужского рода «братья», но здесь может обозначать всю общину верующих — братьев и сестёр.
    reason: lexical_alternative
  - marker: b
    text: Или «Христа». Греческое слово «Христос» — титул со значением «Помазанник», то есть «Мессия».
    reason: alternative_reading
  - marker: c
    text: 'Или «любви самого Духа» либо «любви, которую производит Дух»: греческая форма допускает несколько пониманий.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Настоятельно прошу
  rationale: Передаёт серьёзность и настойчивость обращения, не усиливая его до «умоляю» и не используя книжное «увещеваю».
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица отмечает переход к призыву, а не явное противопоставление; в современном русском такой переход естественно передаётся без начального «но» или «теперь».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму обращения; возможный охват всей общины пояснён в сноске.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: ради нашего Господа Иисуса Мессии
  rationale: «Ради» естественно выражает основание настойчивой просьбы и позволяет сохранить повтор предлога διά; Χριστός передан как титул «Мессия».
- source_word: διὰ τῆς ἀγάπης τοῦ πνεύματος
  choice: ради любви Духа
  rationale: 'Формулировка сохраняет повтор διά и неоднозначность родительного оборота: это может быть любовь самого Духа или любовь, которую производит Дух.'
- source_word: συναγωνίσασθαί μοι
  choice: бороться вместе со мной
  rationale: Сохраняет образ напряжённой совместной борьбы и значение приставки συν-, оставаясь понятным в контексте молитвы.
- source_word: ἐν ταῖς προσευχαῖς … πρὸς τὸν θεόν
  choice: молясь Богу
  rationale: Естественно передаёт сферу совместной борьбы — молитву, направленную к Богу; множественное число в греческом не требует неестественного русского «в молитвах».
- source_word: ὑπὲρ ἐμοῦ
  choice: за меня
  rationale: Кратко и естественно выражает ходатайство за Павла.
theological_decisions:
- issue: Кого обозначает «Дух»
  choice: Святой Дух, обозначенный прописной буквой
  alternative: человеческий дух или дух в безличном смысле
  rationale: В данном контексте Павлово употребление и параллель с Господом Иисусом наиболее естественно указывают на Святого Духа, однако слово «Святой» в основной текст не добавлено.
- issue: Смысл выражения «любовь Духа»
  choice: сохранён неоднозначный родительный оборот
  alternative: «любовь самого Духа» или «любовь, которую даёт Дух»
  rationale: Греческий родительный падеж допускает как субъектное, так и производящее понимание; перевод не должен молча выбирать одно из них.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Χριστός является титулом со значением «Помазанник»; традиционный русский эквивалент указан в сноске.
- issue: Адресаты слова ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет мужскую форму источника, а вероятный общинный, включающий женщин смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством апостольского обращения. «Настоятельно прошу» передаёт силу призыва без архаики, а «бороться вместе со мной, молясь» сохраняет метафору напряжённого совместного усилия и при этом звучит понятно для обычного читателя.
