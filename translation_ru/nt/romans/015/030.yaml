  to: Настоятельно прошу вас, братья[a], ради нашего Господа Иисуса, Мессии[b], и ради любви Духа[c] подвизаться вместе со мной в молитвах к Богу за меня.
  rationale: Исправлены естественность русского титульного приложения и синтаксическая передача ἐν ταῖς προσευχαῖς. Вариант «подвизаться» передаёт напряжённое совместное усилие συναγωνίσασθαι без неуместной в данном контексте окраски физической борьбы. Все исходные смысловые неоднозначности и сносковые привязки сохранены.
