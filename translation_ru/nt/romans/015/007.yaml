reference: Romans 15:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: ru
  text: Поэтому принимайте друг друга, как и Христос принял вас, во славу Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради славы Бога»; греческое выражение может обозначать цель или результат и может относиться как к призыву принимать друг друга, так и к тому, что Христос принял вас.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и ясно связывает стих с контекстом.
- source_word: προσλαμβάνεσθε … προσελάβετο
  choice: принимайте … принял
  rationale: 'Одинаковый русский глагол сохраняет намеренный словесный параллелизм: верующие должны относиться друг к другу так, как Христос отнёсся к ним. «Принимать» естественно выражает включающее личное принятие и не сужает смысл до гостеприимства.'
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Естественно передаёт взаимность действия.
- source_word: καθὼς καὶ
  choice: как и
  rationale: Сохраняет сравнительную связь и добавочное значение καί в естественной русской форме.
- source_word: ὁ Χριστός
  choice: Христос
  rationale: В современном русском библейском и литературном употреблении «Христос» узнаваемо передаёт мессианский титул, не требуя искусственной конструкции с артиклем.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт прямое дополнение во втором лице множественного числа.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: во славу Бога
  rationale: Краткая естественная формула, сохраняющая возможный оттенок цели или результата у εἰς; неоднозначность уточнена в сноске.
theological_decisions:
- issue: Значение Χριστός
  choice: Христос
  alternative: Мессия
  rationale: Оба варианта передают титул; «Христос» наиболее естественен и достоин в русском тексте Нового Завета, при этом не превращается здесь в особое конфессиональное толкование.
- issue: Объём значения προσλαμβάνομαι в общинном контексте
  choice: принимайте друг друга
  alternative: радушно встречайте друг друга
  rationale: «Принимать» охватывает не только встречу или гостеприимство, но и взаимное признание и включение в общение, соответствуя контексту Рим 14–15.
- issue: Связь εἰς δόξαν τοῦ θεοῦ
  choice: сохранить синтаксическую неоднозначность формулой «во славу Бога»
  alternative: «чтобы прославить Бога» или «так Бог будет прославлен»
  rationale: Греческая фраза может выражать цель либо результат и может относиться к призыву принимать друг друга или к принятию Христом; перевод не должен молча закреплять только одно толкование.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Повтор «принимайте — принял» намеренно сохраняет риторическую связь оригинала.
