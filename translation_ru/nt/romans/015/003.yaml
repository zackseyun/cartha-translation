  terminology: «Мессия» обоснованно передаёт титульное употребление ὁ Χριστός. «Оскорбления» — современное и точное соответствие ὀνειδισμοί. Перевод не навязывает идентичность говорящего в цитате сверх того, что выражено текстом.
