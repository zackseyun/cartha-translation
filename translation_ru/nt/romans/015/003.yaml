id: ROM.15.3
reference: Romans 15:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: ru
  text: 'Ведь и Мессия не Себе угождал, но, как написано: «Оскорбления тех, кто оскорбляет Тебя, пали на Меня».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата из Псалма 68:10 (в иной нумерации — 69:9).
    reason: Указание источника ветхозаветной цитаты и различия в нумерации псалмов.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь и
  rationale: Передаёт обоснование предыдущего призыва и одновременно подчёркивает пример Мессии.
- source_word: ὁ Χριστός
  choice: Мессия
  rationale: Артикль и контекст примера указывают на титульное употребление Χριστός; «Мессия» естественно передаёт его значение.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: не Себе угождал
  rationale: Близко сохраняет глагол «угождать» и возвратное местоимение, а также связь с лексикой ближайшего контекста.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: но, как написано
  rationale: Устоявшаяся и естественная формула введения цитаты из Писания; настоящее состояние результата перфекта передано формой «написано».
- source_word: ὀνειδισμοί
  choice: оскорбления
  rationale: Современное и понятное соответствие, охватывающее словесное поношение и унижение без излишней архаичности.
- source_word: τῶν ὀνειδιζόντων σε
  choice: тех, кто оскорбляет Тебя
  rationale: Естественно передаёт субстантивированное причастие и сохраняет однокоренной повтор греческого текста.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: пали на Меня
  rationale: Прямо воспроизводит образ падения чего-либо на говорящего и передаёт аорист прошедшим временем.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово имеет отчётливую функцию титула в аргументе Павла; перевод «Мессия» раскрывает титульное значение, не добавляя конфессиональной интерпретации.
- issue: Личность говорящего в цитате
  choice: Не уточнять её сверх текста цитаты
  alternative: Прямо обозначить говорящего как Мессию или Христа
  rationale: Павел применяет слова псалма к Мессии, однако сама цитата сохраняет первое лицо и не требует поясняющей вставки, которая сняла бы присущую тексту напряжённость.
- issue: Временная форма ὀνειδιζόντων
  choice: кто оскорбляет Тебя
  alternative: кто оскорблял Тебя
  rationale: Греческое причастие настоящего времени допускает характеристику таких людей через продолжающееся или типичное действие; настоящее время сохраняет эту форму, тогда как основное событие ἐπέπεσαν передано прошедшим.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Не Себе угождал» сохраняет компактность оригинала и связь с контекстом Рим 15:1–2. Местоимения, относящиеся к Богу и Мессии, написаны с прописной буквы согласно распространённой русской библейской издательской норме.
