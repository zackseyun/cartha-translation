  source_fidelity: 'Перевод точно передаёт греческий текст: καὶ γὰρ — «Ведь и», ὁ Χριστός — «Мессия», οὐχ ἑαυτῷ ἤρεσεν — «не Себе угождал», а цитата сохраняет повтор «оскорбления / оскорбляет» и образ «пали на Меня». Настоящее время «оскорбляет» правомерно передаёт причастие настоящего времени, а «пали» — аорист.'
