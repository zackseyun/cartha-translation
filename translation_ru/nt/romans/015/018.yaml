base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: ru
  text: Ведь я не осмелюсь говорить ни о чём, кроме того, что Христос совершил через меня, чтобы язычники[a] повиновались словом и делом[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях отсутствует «ни о чём»; тогда: «Ведь я не осмелюсь говорить о том, чего Христос не совершил через меня...»'
    reason: textual_variant
lexical_decisions:
- source_word: οὐ γὰρ τολμήσω
  choice: Ведь я не осмелюсь
  rationale: Будущее время и отрицание передают заявленную Павлом решимость не отваживаться говорить о чём-либо ином; «не осмелюсь» естественно звучит по-русски.
- source_word: τι λαλεῖν ὧν οὐ
  choice: говорить ни о чём, кроме того, что
  rationale: Отрицательно-относительная конструкция имеет ограничительный смысл; по-русски он ясно и естественно выражается оборотом «ни о чём, кроме того, что».
- source_word: κατειργάσατο
  choice: совершил
  rationale: Глагол обозначает действенное осуществление или достижение результата; «совершил» сохраняет этот смысл без излишнего уточнения.
- source_word: Χριστὸς
  choice: Христос
  rationale: В современном русском библейском употреблении «Христос» — естественная и узнаваемая передача Χριστός; контекст при этом сохраняет его мессианское значение.
- source_word: δι’ ἐμοῦ
  choice: через меня
  rationale: διά с родительным падежом представляет Христа главным действующим лицом, а Павла — его орудием.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: приводя язычников к послушанию
  rationale: Передаёт направленность действия к послушанию среди неевреев и естественно связывает цель служения с совершённым Христом.
- source_word: λόγῳ καὶ ἔργῳ
  choice: словом и делом
  rationale: Устойчивое русское сочетание сохраняет инструментальный смысл дательных форм и охватывает как возвещение, так и действие.
theological_decisions:
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: Для русского читателя «Христос» является обычным титульным обозначением Иисуса и не требует превращать греческий титул в менее привычную форму; мессианский смысл не исключается.
- issue: Значение ἐθνῶν
  choice: язычников
  alternative: народов
  rationale: В рассуждении Послания к римлянам слово обозначает прежде всего неевреев в отличие от иудеев; «язычники» точнее передаёт это контекстуальное противопоставление.
- issue: Связь λόγῳ καὶ ἔργῳ
  choice: словом и делом отнесено к приведению язычников к послушанию через служение Павла
  alternative: словом и делом можно непосредственно характеризовать то, что совершил Христос
  rationale: Греческий порядок допускает близкую связь с совершённым Христом через Павла, но в обоих случаях слово и дело осуществляются в Павловом служении; перевод не вводит отдельного субъекта и сохраняет эту смысловую близость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным для обычного читателя; запятая в конце сохранена, поскольку стих продолжается в следующем предложении. Все сноски отмечены в основном тексте.
