id: ROM.15.14
reference: Romans 15:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: ru
  text: Я и сам убеждён относительно вас, братья мои,[a] что и вы сами полны доброты, исполнены всякого знания и способны наставлять друг друга[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «братья», может быть обращением ко всем верующим, включая мужчин и женщин.
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «вразумлять друг друга» или «предостерегать друг друга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: убеждён
  rationale: Перфектная форма выражает устойчивое состояние уверенности; краткая форма «убеждён» естественно и точно передаёт этот смысл.
- source_word: δέ
  choice: и
  rationale: Здесь частица обозначает мягкий переход, а не резкое противопоставление; союз «и» сохраняет связь с предшествующим контекстом.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохранены обращение и притяжательное местоимение; в церковном обращении множественное «братья» может относиться ко всей общине, что пояснено в сноске.
- source_word: καὶ αὐτὸς ἐγώ
  choice: и сам
  rationale: Сочетание частиц и местоимений подчёркивает личную убеждённость Павла; «и сам» передаёт как присоединительный, так и усилительный оттенок.
- source_word: περὶ ὑμῶν
  choice: относительно вас
  rationale: Формулировка прямо передаёт περί с родительным падежом и сохраняет несколько формальный, достойный регистр послания.
- source_word: καὶ αὐτοί
  choice: и вы сами
  rationale: «И» сохраняет присоединительное значение καί, а «сами» — эмфатическую силу αὐτοί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: полны доброты
  rationale: «Полны» буквально передаёт μεστοί с родительным падежом; «доброта» выражает нравственную благость и доброжелательность ἀγαθωσύνη без излишнего уточнения.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: исполнены всякого знания
  rationale: Причастие «исполнены» сохраняет образ полноты и состояние, выраженное греческим перфектом; «всякого знания» формально передаёт πάσης γνώσεως, не сужая его объём.
- source_word: δυνάμενοι
  choice: способны
  rationale: Слово ясно выражает способность, вытекающую из названных качеств общины.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычное и естественное русское соответствие взаимному местоимению.
- source_word: νουθετεῖν
  choice: наставлять
  rationale: «Наставлять» охватывает поучение, в том числе исправляющее, и естественно звучит в похвальном контексте; более резкие оттенки указаны в сноске.
theological_decisions:
- issue: Обращение ἀδελφοί к смешанной по составу общине
  choice: братья мои
  alternative: братья и сёстры мои
  rationale: В основном тексте сохранена грамматически мужская форма исходного обращения, а его возможный собирательный охват мужчин и женщин разъяснён в сноске, без внесения расширенной формулы в сам перевод.
- issue: Смысловой диапазон νουθετεῖν
  choice: наставлять друг друга
  alternative: вразумлять друг друга; предостерегать друг друга
  rationale: Глагол допускает как общее наставление, так и исправление или предупреждение. В похвальном контексте выбрана широкая формулировка «наставлять», а более корректирующие оттенки сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным эпистолярным регистром. Синтаксис следует ходу греческой фразы, но остаётся понятным современному читателю; богословская и лексическая неоднозначность не снимается, а отмечается в сносках.
