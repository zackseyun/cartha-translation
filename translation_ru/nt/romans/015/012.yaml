source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: ru
  text: 'И ещё Исаия говорит: «Будет корень Иессея, и Тот, кто восстанет, чтобы править народами; на него будут надеяться народы».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί
  choice: Будет корень Иессея
  rationale: Сохраняет форму будущего времени ἔσται и образ «корня Иессея», не подменяя его более привычным, но иным образом «потомка» или «отрасли».
- source_word: ὁ ἀνιστάμενος
  choice: Тот, Кто восстанет
  rationale: Передаёт субстантивированное причастие и сохраняет возможный диапазон значения «поднимется/восстанет», не сводя его однозначно к воскресению.
- source_word: ἄρχειν ἐθνῶν
  choice: чтобы править народами
  rationale: Инфинитив цели естественно передан конструкцией «чтобы»; ἔθνη здесь переведено как «народы», что соответствует контексту включения неевреев и сохраняет повтор слова далее.
- source_word: ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν
  choice: на Него народы будут надеяться
  rationale: «Надеяться на» — естественный русский эквивалент ἐλπίζειν ἐπί с дательным; будущее время и повтор ἔθνη сохранены.
theological_decisions:
- issue: Отношение выражений «корень Иессея» и «Тот, Кто восстанет»
  choice: Соединить их тире как пояснительно-соотносительные обозначения одной личности
  alternative: 'Передать буквальным соединением «и»: «Будет корень Иессея, и Тот, Кто восстанет…»'
  rationale: Греческое καί формально сохранено в структуре перечисления, но буквальное русское «и» может создать впечатление двух разных субъектов. Тире естественно показывает, что речь идёт об одной мессианской личности, не добавляя слова «то есть».
- issue: Может ли ἀνιστάμενος прямо обозначать воскресение
  choice: «восстанет» без уточнения «из мёртвых»
  alternative: «воскреснет»
  rationale: Контекст допускает мессианский оттенок возвышения или появления для правления, однако в тексте нет дополнения «из мёртвых»; перевод не должен устранять эту неоднозначность.
- issue: Передача ἔθνη
  choice: «народы»
  alternative: «язычники»
  rationale: «Народы» точнее сохраняет лексический образ цитаты и избегает современного религиозно-оценочного оттенка слова «язычники», хотя в контексте подразумеваются народы вне Израиля.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Синтаксис слегка приподнят, но понятен обычному читателю. Заглавные местоимения относятся к мессианской личности как редакционная норма благоговейного регистра, не меняя смысла исходного текста.
