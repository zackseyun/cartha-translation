  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: ru
  text: Мы же, сильные, должны нести слабости немощных[a], а не угождать самим себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «недостатки немощных». Греческое слово может обозначать слабости, ограничения или недостатки; здесь, вероятно, имеются в виду ограничения совести, о которых говорится в предыдущей главе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: должны
  rationale: Передаёт нравственную обязанность, выраженную изъявительной формой, и естественно звучит в наставлении.
- source_word: δὲ
  choice: же
  rationale: Обозначает мягкий переход и связь с предыдущим рассуждением без усиления до резкого противопоставления.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: мы же, сильные
  rationale: Сохраняет эмфатическое местоимение и контекстуальное обозначение верующих, чья совесть допускает большую свободу.
- source_word: τὰ ἀσθενήματα
  choice: слабости
  rationale: Широкое слово, способное обозначать ограничения и немощи совести без обязательного осуждения их как нравственных проступков.
- source_word: τῶν ἀδυνάτων
  choice: немощных
  rationale: Сохраняет противопоставление «сильных» и «немощных» и указывает на недостаток внутренней свободы или силы совести, а не обязательно на физическую слабость.
- source_word: βαστάζειν
  choice: нести на себе
  rationale: Сохраняет образ несения чужого бремени и выражает деятельную поддержку, а не простую терпимость.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: а не угождать самим себе
  rationale: Естественно передаёт рефлексивный смысл и этическое противопоставление заботе о слабостях других.
theological_decisions:
- issue: Значение обозначений «сильные» и «немощные»
  choice: Речь прежде всего о верующих с разной мерой свободы и твёрдости совести в контексте Рим 14.
  alternative: Речь о социально влиятельных и бессильных либо о физически сильных и слабых.
  rationale: Непосредственный контекст посвящён разногласиям о пище и днях, поэтому эти слова характеризуют отношение совести, не исключая более широкого нравственного применения.
- issue: Характер «слабостей»
  choice: Слово оставлено широким и обозначает ограничения или немощи, которые сильные должны помогать нести.
  alternative: Перевести как «недостатки» или «проступки», подчеркнув нравственную вину.
  rationale: Греческое слово допускает оттенок недостатков, однако в данном контексте более обвинительное выражение могло бы неоправданно представить ограниченную совесть как грех.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Немощные» сохранено ради ясного противопоставления «сильным» и связи с контекстом; выражение «нести на себе» делает образ деятельной поддержки явным.
