  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: ru
  text: Бог мира да будет со всеми вами. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Здесь δέ имеет слабую связующую или переходную функцию. В русском заключительное благословение естественно звучит без отдельного союза; «но» было бы чрезмерно противопоставительным, а «теперь» вносило бы отсутствующее в греческом временное значение.
- source_word: θεὸς τῆς εἰρήνης
  choice: Бог мира
  rationale: Прямо передаёт греческое генитивное именование и сохраняет узнаваемое богословское выражение Павла.
- source_word: εἰρήνης
  choice: мира
  rationale: «Мир» — обычное и ёмкое соответствие εἰρήνη, включающее отсутствие вражды, целостность и благополучие без поясняющего расширения в основном тексте.
- source_word: μετὰ πάντων ὑμῶν
  choice: да будет со всеми вами
  rationale: В греческом глагол опущен. Русская благословительная формула с «да будет» естественно выражает пожелание-молитву, а «со всеми вами» точно сохраняет полноту πάντων ὑμῶν.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная литургическая передача заключительного подтверждения, естественная и понятная современному русскому читателю.
theological_decisions:
- issue: Понимать ли безглагольную фразу как утверждение или как благословительное пожелание
  choice: 'Благословение: «Бог мира да будет со всеми вами»'
  alternative: 'Утверждение: «Бог мира со всеми вами»'
  rationale: Хотя в греческом нет выраженного глагола в оптативе или императиве, эпистолярная заключительная формула естественно функционирует как молитвенное пожелание. Частица «да» передаёт эту функцию, не превращая её в категорическое утверждение.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная формула благословения. Архаизирующий порядок слов и лишний начальный союз не используются.
