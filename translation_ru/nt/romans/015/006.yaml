source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: ru
  text: чтобы вы единодушно, едиными устами прославляли Бога и Отца нашего Господа Иисуса Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Иисуса Христа». Греческое Χριστός означает «Мессия», то есть «Помазанник».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт цель или ожидаемый результат увещания предыдущего стиха и естественно вводит русское придаточное.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Выражает единство настроя и устремления общины, не дублируя полностью следующий образ единых уст.
- source_word: ἐν ἑνὶ στόματι
  choice: едиными устами
  rationale: Сохраняет яркую телесную метафору греческого текста; множественное «устами» с определением «едиными» звучит по-русски естественнее буквального «одними устами».
- source_word: δοξάζητε
  choice: прославляли
  rationale: Сослагательная форма после «чтобы» естественно передаёт греческий презенс конъюнктива в целевой конструкции.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: Бога и Отца
  rationale: Сохраняет тесно связанную формулу с одним артиклем перед двумя существительными, не устраняя возможную аппозиционность.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Прямо и традиционно передаёт родительный оборот, сохраняя κύριος как титул «Господь».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Имя передано как «Иисус», а Χριστός — по смыслу как титул «Мессия»; русская конструкция не требует добавочного артикля.
theological_decisions:
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  alternative: Иисуса Христа
  rationale: Χριστός исторически является греческим титулом со значением «Помазанник, Мессия». Перевод раскрывает смысл титула, а сноска сохраняет знакомую традиционную форму.
- issue: Связь τὸν θεὸν καὶ πατέρα с τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Бога и Отца нашего Господа Иисуса Мессии
  alternative: Бога, то есть Отца нашего Господа Иисуса Мессии
  rationale: Сохранена формальная координация греческого выражения без внесения пояснительного «то есть», которое однозначно истолковало бы синтаксис.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, пригодным для богослужебного чтения звучанием. «Единодушно, едиными устами» намеренно сохраняет два взаимодополняющих выражения единства из оригинала.
