  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: ru
  text: И при этом я ставлю себе целью возвещать Благую весть не там, где Христос уже был возвещён[a], чтобы не строить на чужом основании[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не там, где Христос был назван».'
    reason: literal_rendering
  - marker: b
    text: 'Образ строительства: не продолжать работу на основании, заложенном другим.'
    reason: metaphor_clarification
lexical_decisions:
- source_word: οὕτως δὲ
  choice: И при этом
  rationale: Связывает стих с предшествующим описанием служения Павла и естественно продолжает мысль без чрезмерно сильного противопоставления.
- source_word: φιλοτιμούμενον
  choice: я ставлю себе целью
  rationale: Передаёт личное, целенаправленное стремление Павла; по-русски звучит естественно и сохраняет волевой оттенок.
- source_word: εὐαγγελίζεσθαι
  choice: возвещать Благую весть
  rationale: Сохраняет глагольный смысл публичного провозглашения благой вести и остаётся понятным современному читателю.
- source_word: οὐχ ὅπου
  choice: не там, где
  rationale: Точно и естественно передаёт отрицательную локативную конструкцию.
- source_word: ὠνομάσθη Χριστός
  choice: где имя Христа уже известно
  rationale: Передаёт идиоматический смысл места, где Христос уже был назван и стал известен через проповедь; «уже» проясняет подразумеваемую контекстом предшествующую деятельность.
- source_word: ἵνα μὴ
  choice: чтобы не
  rationale: Естественно передаёт отрицательную цель.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: на чужом основании
  rationale: Близко передаёт буквальный строительный образ и не добавляет отсутствующего в греческом указания на пол другого служителя.
- source_word: οἰκοδομῶ
  choice: строить
  rationale: Сохраняет строительную метафору, согласованную со словом «основание».
theological_decisions:
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: В русском новозаветном употреблении «Христос» здесь естественно воспринимается и как титул, и как привычное обозначение Иисуса; примечание сохраняет титульный смысл греческого слова.
- issue: Значение формулы ὠνομάσθη Χριστός
  choice: имя Христа уже известно
  alternative: Христос уже был назван
  rationale: Буквальная пассивная конструкция по-русски может звучать так, будто речь идёт о наречении именем. Основной текст передаёт контекстуальный смысл уже совершившегося возвещения, а примечание отмечает буквальную форму.
- issue: Характер миссионерского принципа Павла
  choice: личная цель Павла
  alternative: всеобщий запрет служить там, где о Христе уже знают
  rationale: Форма первого лица и глагол стремления описывают собственную миссионерскую установку Павла, не превращая её в универсальное предписание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Благая весть» доступнее конфессионально нагруженного «Евангелие» и сохраняет словесный характер εὐαγγελίζεσθαι. Строительная метафора оставлена без раскрытия в основном тексте.
