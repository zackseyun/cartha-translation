  source_fidelity: 'Основной текст в целом верно передаёт синтаксис и образ: личное стремление Павла, провозглашение, отрицание места, где Христос уже был назван, и цель не строить на чужом основании. Однако сноска a содержит критическую ошибку: при основном тексте «где имя Христа уже известно» она заявляет буквальное «где Христос не был назван», хотя в греческом стоит οὐχ ὅπου ὠνομάσθη Χριστός — «не там, где Христос был назван». Это переворачивает отрицание и создаёт противоречие основному тексту.'
  naturalness: '«И при этом я ставлю себе целью» и «возвещать Благую весть» литературны и понятны. «Где имя Христа уже известно» естественно, но несколько ослабляет пассивное «был назван» и смещает его к общему знанию; допустимо как контекстуальная передача, однако более прямо и естественно здесь: «где Христос уже был возвещён».'
  terminology: «Христос» — нормативное и естественное русское соответствие Χριστός в данном новозаветном контексте; не требуется заменять его на «Мессию». «Благая весть» уместна для εὐαγγελίζεσθαι. «Чужое основание» точно сохраняет образ ἀλλότριον θεμέλιον, не вводя невыраженного лица или пола.
