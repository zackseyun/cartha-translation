base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: ru
  text: Итак, я имею основание хвалиться[a] в Мессии Иисусе[b] в том, что относится к Богу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имею хваление»; или: «у меня есть повод для хваления».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «в Христе Иисусе»; Χριστός передано как титул «Мессия».
    reason: alternative_reading
  - marker: c
    text: 'Или: «в делах, касающихся Бога»; выражение может относиться к служению Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: я могу
  rationale: В сочетании с существительным καύχησις форма ἔχω передаёт наличие основания или возможности хвалиться; по-русски естественнее выразить это глагольной конструкцией. Буквальное «имею» отмечено в сноске.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения Павла и естественно связывает стих с контекстом.
- source_word: καύχησιν
  choice: хвалиться
  rationale: Сохраняет характерную для Павла лексику хвалы и хваления, не заменяя её более узким понятием личной гордости.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог ἐν сохранён как «в», поскольку он может обозначать сферу или единение, а не только средство; Χριστός здесь передан как действующий титул «Мессия».
- source_word: τὰ πρὸς τὸν θεόν
  choice: тем, что относится к Богу
  rationale: Широко передаёт дела и вопросы, связанные с Богом, не сужая выражение исключительно до священнического служения.
- source_word: θεόν
  choice: Богу
  rationale: Обычный эквивалент θεός в данном контексте; дательный падеж обусловлен русской конструкцией «относится к».
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь Χριστός сохраняет значение титула, поэтому переводится как «Мессия», а не просто воспроизводится традиционной формой «Христос».
- issue: Характер хваления Павла
  choice: Сохранить хваление, ограниченное выражениями «в Мессии Иисусе» и «тем, что относится к Богу»
  alternative: Передать как общую личную уверенность или самостоятельную заслугу Павла
  rationale: Греческий текст допускает утверждение о хвалении, но одновременно связывает его с Мессией и делами Божьими; перевод сохраняет это богословское напряжение, не превращая стих ни в самовосхваление, ни лишь в субъективную радость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Глагольная конструкция «могу хвалиться» выбрана ради естественности, а буквальная именная форма сохранена в сноске. Порядок слов удерживает логическую связь хваления с Мессией Иисусом и с делами, относящимися к Богу.
