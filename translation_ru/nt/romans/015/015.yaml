  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: ru
  text: Но я написал вам несколько смелее[a], отчасти напоминая вам вновь, — благодаря благодати, данной мне Богом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «написал вам несколько смелее — по некоторым вопросам». Греческое выражение допускает отнесение этих слов либо к степени смелости Павла, либо к отдельным затронутым им вопросам.'
    reason: lexical_alternative
  - marker: b
    text: Здесь данная Павлу благодать связана с порученным ему Богом апостольским служением, особенно среди других народов (см. ст. 16).
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: довольно смело
  rationale: Передаёт сравнительно-усилительный оттенок наречия естественным современным русским выражением; возможное строго сравнительное понимание отмечено в сноске.
- source_word: δὲ
  choice: Но
  rationale: Обозначает мягкий контраст с предшествующей похвалой римским верующим.
- source_word: ἔγραψα
  choice: я написал
  rationale: Естественно передаёт аорист в контексте самого послания.
- source_word: ἀπὸ μέρους
  choice: отчасти
  rationale: 'Сохраняет неопределённость: речь может идти либо о степени смелости, либо об отдельных вопросах; это отражено в сноске.'
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: словно вновь напоминая вам
  rationale: «Словно» передаёт ὡς без чрезмерно жёсткого определения отношения оборота, а «вновь напоминая» отражает значение сложного глагола ἐπαναμιμνῄσκω.
- source_word: διὰ τὴν χάριν
  choice: по благодати
  rationale: Передаёт основание, на котором Павел пишет, и сохраняет обычный богословски ёмкий эквивалент χάρις.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: данной мне Богом
  rationale: Точно передаёт пассивную конструкцию и личного деятеля при ὑπό с родительным падежом.
theological_decisions:
- issue: Значение χάρις в данном контексте
  choice: Сохранено слово «благодать», при этом сноска указывает на связанную с нею апостольскую миссию Павла.
  alternative: Передать прямо как «поручение» или «служение».
  rationale: Стихи 15–16 связывают данную Павлу благодать с его служением народам, однако основной текст не должен сужать более широкое значение χάρις.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный эпистолярный тон. Синтаксис сохраняет ход греческой мысли, но остаётся понятным; подлинная неоднозначность ἀπὸ μέρους вынесена в сноску.
