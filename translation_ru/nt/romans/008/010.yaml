id: ROM.8.10
reference: Romans 8:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: ru
  text: Но если Мессия в вас, то тело мертво[b] из-за греха, а дух[a] — жизнь благодаря праведности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух — жизнь». Греческое слово может обозначать как человеческий дух, оживотворённый Богом, так и Святого Духа.'
    reason: alternative_reading
  - marker: b
    text: «Тело мертво» можно также понимать как «тело обречено на смерть» или «тело смертно».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «благодаря справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт титульное значение Χριστός и остаётся понятным современному читателю.
- source_word: σῶμα
  choice: тело
  rationale: Точно передаёт σῶμα и сохраняет прямое противопоставление духу.
- source_word: νεκρὸν
  choice: мертво
  rationale: Сохраняет сильную и непосредственную формулировку греческого прилагательного, не заменяя её толкованием о смертности.
- source_word: διὰ ἁμαρτίαν
  choice: из-за греха
  rationale: Естественно передаёт причинное значение διά с винительным падежом.
- source_word: πνεῦμα
  choice: дух
  rationale: Строчная буква сохраняет возможное противопоставление человеческого духа телу, не исключая связи со Святым Духом.
- source_word: ζωὴ
  choice: жизнь
  rationale: Сохраняет именную форму ζωή и сжатое выражение Павла, не превращая его в «жив» или «оживлён».
- source_word: διὰ δικαιοσύνην
  choice: благодаря праведности
  rationale: Передаёт причинное значение оборота и обычное для Павла значение δικαιοσύνη; «благодаря» здесь естественно при положительной причине.
theological_decisions:
- issue: К кому относится πνεῦμα
  choice: дух
  alternative: Дух
  rationale: Греческое слово допускает понимание как человеческого духа, оживотворённого Богом, так и Святого Духа; основной текст не должен окончательно устранять эту неоднозначность.
- issue: Смысл νεκρὸν при σῶμα
  choice: тело мертво
  alternative: тело обречено на смерть; тело смертно
  rationale: Основной текст сохраняет буквальную силу νεκρόν, а возможный смысл смертности указывается в примечании.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» лучше сохраняет широкий богословский диапазон δικαιοσύνη у Павла, хотя лексически возможно и значение справедливости.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет краткость и напряжённое противопоставление исходного текста. Тире естественно передаёт опущенную связку во второй части. Маркеры примечаний поставлены после всей фразы, поскольку первое относится к слову «дух», а второе — к выражению «тело мертво».
