id: ROM.8.26
reference: Romans 8:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: ru
  text: Так и Дух приходит нам на помощь в нашей немощи. Ведь мы не знаем, о чём молиться, как должно, но Сам Дух ходатайствует за нас воздыханиями, которые невозможно выразить словами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безмолвными воздыханиями»; или: «невыразимыми воздыханиями».'
    reason: Греческое ἀλαλήτοις может указывать на воздыхания, не облечённые в слова, либо на воздыхания, которые невозможно выразить словами.
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: Так и
  rationale: Кратко и естественно связывает помощь Духа с предшествующей мыслью Павла, сохраняя сравнительно-продолжительный переход.
- source_word: συναντιλαμβάνεται
  choice: приходит нам на помощь
  rationale: Передаёт усиленный смысл совместного принятия бремени лучше, чем общее «помогает», не воспроизводя неестественно внутреннюю форму греческого глагола.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: в нашей немощи
  rationale: Сохраняет собирательное единственное число и широкий смысл человеческой слабости и ограниченности.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: Ведь мы не знаем, о чём молиться как должно
  rationale: Делиберативное сослагательное наклонение естественно передано конструкцией «о чём молиться»; «как должно» сохраняет оттенок надлежащего содержания или образа молитвы, не разрешая эту неоднозначность.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Сам Дух
  rationale: Передаёт эмфатическое αὐτό и личное действие Духа, не вводя в русский текст грамматически неуместное местоимение среднего рода.
- source_word: ὑπερεντυγχάνει
  choice: ходатайствует за нас
  rationale: «Ходатайствует» точно передаёт заступническое действие; «за нас» делает подразумеваемую направленность понятной по-русски и согласуется с контекстом.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: воздыханиями, которые невозможно выразить словами
  rationale: Передаёт ἀλάλητος как невыразимость или отсутствие слов, сохраняя возможный диапазон смысла и звуча естественно в современном русском.
theological_decisions:
- issue: Личная субъектность Духа при грамматически среднем роде πνεῦμα
  choice: Сам Дух
  alternative: само духовное начало / сам дух
  rationale: Глаголы помощи и ходатайства представляют Духа как действующего субъекта; русское «Дух» мужского рода и эмфатическое «Сам» естественно отражает αὐτό без отдельного догматического пояснения.
- issue: Кому принадлежат воздыхания
  choice: Не уточнять сверх синтаксиса, что это воздыхания самого Духа
  alternative: передать как человеческие воздыхания, через которые ходатайствует Дух
  rationale: Греческий текст непосредственно связывает воздыхания с ходатайством Духа, но не объясняет механизм и не требует исключать участие молящегося; перевод сохраняет эту напряжённость.
- issue: 'Смысл καθὸ δεῖ: содержание или способ молитвы'
  choice: как должно
  alternative: о чём следует молиться
  rationale: Формулировка оригинала допускает связь как с предметом молитвы, так и с надлежащим образом молитвы; русский перевод не сужает смысл до одного варианта.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. «Немощь», «ходатайствует» и «воздыхания» сохраняют богословскую и риторическую весомость, оставаясь понятными в контексте; синтаксис упрощён до естественной русской фразы без устранения смысловой неоднозначности.
