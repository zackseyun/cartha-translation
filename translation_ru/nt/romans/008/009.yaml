  source_fidelity: В первой части исходное ἐν σαρκὶ ... ἐν πνεύματι обозначает «во плоти ... в Духе». Формулировка «живёте не по плоти, а по Духу» переводит это в иной, хотя и связанный, павловский оборот и добавляет глагол «живёте». Исправление сохраняет пространственно-сферическую метафору оригинала. εἴπερ точнее передано как «если действительно», без оттенка ограничительного «только».
  naturalness: «Вы не во плоти, а в Духе» — устойчивое и понятное в современном литературном библейском русском выражение; последующий контекст не позволяет понять «плоть» просто как физическое тело. «Живёт в вас» естественно для οἰκεῖ.
  terminology: 'Сохранены ключевые соответствия: σάρξ — «плоть», πνεῦμα — «Дух», Χριστός как титул — «Мессия». Строчное «ему» сохраняет местоименную форму и не снимает возможную в исходнике референциальную связь сверх необходимого.'
