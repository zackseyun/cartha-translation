source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: ru
  text: Но вы не во плоти, а в Духе,[a] если действительно Дух Бога живёт в вас. Если же у кого нет Духа Мессии,[b] тот не принадлежит ему.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы не во плоти, а в Духе».'
    reason: Сохраняет пространственно-сферическую формулировку греческого текста.
  - marker: b
    text: 'Или: «Духа Христа». Греческое слово «Христос» означает «Помазанник», то есть «Мессия».'
    reason: Даёт традиционное русское соответствие титулу Χριστός и поясняет выбранный перевод.
  - marker: c
    text: 'Буквально: «тот не его».'
    reason: Показывает краткий греческий оборот принадлежности, не уточняя референт местоимения сверх текста.
lexical_decisions:
- source_word: σάρξ
  choice: плоть
  rationale: Сохранён ключевой термин Павла и противопоставление плоти и Духа; конструкция «жить по плоти» естественно передаёт образ сферы и образа существования, не сводя σάρξ лишь к телу или «греховной природе».
- source_word: πνεῦμα
  choice: Дух
  rationale: Написание с прописной буквы обусловлено поясняющими выражениями «Дух Бога» и «Дух Мессии», указывающими здесь на Божьего Духа.
- source_word: οἰκεῖ
  choice: живёт
  rationale: Современное и естественное русское соответствие идее пребывания внутри; вариант «обитает» точнее сохраняет оттенок постоянного пребывания, но звучит более книжно.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός употреблено как титул; «Мессия» сохраняет его смысл, не превращая автоматически в имя собственное.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: Ему не принадлежит
  rationale: Естественно передаёт греческий оборот принадлежности; местоимение оставлено без замены существительным, чтобы не уточнять сверх текста его референт.
- source_word: εἴπερ
  choice: если только
  rationale: Передаёт условную форму и её усиливающий оттенок; контекст допускает подразумеваемую уверенность Павла, но перевод не превращает условие в прямое утверждение.
- source_word: Ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение сохранено, а его контрастное ударение поддержано начальным «Но вы».
- source_word: οὗτος
  choice: тот
  rationale: Русская соотносительная конструкция «у кого… тот» естественно передаёт указательное местоимение с обобщающим значением.
theological_decisions:
- issue: Противопоставление «во плоти» и «в Духе»
  choice: Передано естественным русским выражением «живёте не по плоти, а по Духу» с сохранением терминов «плоть» и «Дух».
  alternative: 'Формально: «вы не во плоти, а в Духе»; истолковательно: «вы живёте не под властью греховной природы, а под властью Духа».'
  rationale: Буквальное «во плоти» в современном русском легко понимается только как телесное существование. Выбранная формулировка передаёт образ жизни или сферу существования, но не заменяет Павлову «плоть» узким толкованием «греховная природа».
- issue: Референт местоимения в «Ему не принадлежит»
  choice: Местоимение сохранено; прописная буква указывает на божественную личность, но не заменяет его именем.
  alternative: «Не принадлежит Мессии» или, по более широкому контексту, «не принадлежит Богу».
  rationale: Ближайший грамматический референт — Мессия, однако взаимосвязь выражений «Дух Бога» и «Дух Мессии» не требует устранять местоименную неоднозначность исходного текста.
- issue: Соотношение «Духа Бога» и «Духа Мессии»
  choice: Одинаковое слово «Дух» сохранено в обеих фразах без добавочного объяснения.
  alternative: Разъяснить их тождество или различие в самом переводе.
  rationale: Текст сближает эти выражения, но перевод не должен вносить более развёрнутую тринитарную формулу, чем дано в стихе.
translation_notes:
  register: Современный литературный русский, понятный при публичном чтении. Тон достоинственный, без архаизмов. «Живёте … по» выбрано ради естественности русского языка, а сноска сохраняет буквальную пространственную метафору. Все сноски отмечены в основном тексте.
