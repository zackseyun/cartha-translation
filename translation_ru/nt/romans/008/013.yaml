source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: ru
  text: Ведь если вы живёте по плоти[a], вам предстоит умереть; но если Духом умерщвляете дела тела, то будете жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «По плоти» — то есть в соответствии с греховными человеческими устремлениями; речь не просто о физическом теле.
    reason: Поясняет контекстуальный смысл σάρξ, сохраняя буквальный павловский образ в основном тексте и не отождествляя плоть с телом.
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь стиха с предшествующим рассуждением и естественно звучит по-русски.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет ключевой для Павла образ и прямое соответствие конструкции κατά с винительным падежом, не сводя σάρξ ни только к телу, ни к полностью истолкованному понятию «греховная природа».
- source_word: ζῆτε
  choice: живёте
  rationale: Настоящее время соответствует греческому презенсу в условной конструкции.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: вам предстоит умереть
  rationale: Передаёт ожидаемое или грядущее событие, выраженное μέλλω с инфинитивом, без чрезмерного акцента на немедленности.
- source_word: πνεύματι
  choice: Духом
  rationale: 'Творительный падеж передаёт инструментальное значение дательного: умерщвление совершается силой Духа.'
- source_word: τὰς πράξεις τοῦ σώματος
  choice: дела тела
  rationale: Сохраняет конкретность πράξεις и явную родительную связь с σώματος, а также различие между «плотью» и «телом» в самом стихе.
- source_word: θανατοῦτε
  choice: умерщвляете
  rationale: Точно передаёт сильную метафору предания смерти и остаётся понятным в современном литературном русском.
- source_word: ζήσεσθε
  choice: будете жить
  rationale: Прямо и естественно передаёт форму будущего времени.
theological_decisions:
- issue: Относится ли πνεύματι к Святому Духу или к человеческому духу
  choice: 'Святой Дух, обозначенный прописной буквой: «Духом»'
  alternative: человеческим духом или намеренно двусмысленное «духом»
  rationale: Контекст Римлянам 8, особенно ближайшие упоминания Божьего Духа, убедительно указывает на Святого Духа как действующую силу, хотя в греческом существительное здесь употреблено без артикля.
- issue: Смысл σάρξ в нравственном противопоставлении
  choice: сохранить «плоть» в основном тексте и пояснить её контекстуальный смысл в сноске
  alternative: «греховная природа»
  rationale: «Плоть» сохраняет павловский термин, связь с исходным образом и богословское напряжение, тогда как «греховная природа» сразу закрепляет одно толкование и может создать впечатление отдельной сущности внутри человека.
translation_notes:
  register: Современный литературный русский с кратким, весомым синтаксисом. Союз «ведь» поддерживает связь с предыдущим аргументом; параллель «предстоит умереть — будете жить» сохраняет резкость противопоставления. Термин «умерщвляете» несколько возвышенный, но понятный и оправдан силой исходной метафоры.
