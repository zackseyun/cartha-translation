  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: ru
  text: Что же скажем на это?[a] Если Бог за нас,[b] кто против нас?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что же скажем обо всём этом?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Раз Бог за нас, кто против нас?»'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Что же скажем
  rationale: «Что» прямо передаёт вопросительное Τί, «же» естественно выражает выводно-переходную силу οὖν, а форма «скажем» сохраняет совещательно-риторическое значение будущего ἐροῦμεν.
- source_word: πρὸς ταῦτα
  choice: на это
  rationale: В сочетании с глаголом речи современное русское «сказать на это» естественно передаёт мысль об ответе на всё сказанное выше, не перегружая фразу.
- source_word: εἰ
  choice: Если
  rationale: Сохраняет условную форму греческого текста и риторическое напряжение; контекст показывает, что благоволение Бога не ставится под сомнение.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое и естественное соответствие подлежащему; определённый артикль отдельно по-русски не передаётся.
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: Кратко и естественно выражает благоприятную позицию, поддержку и действие в нашу пользу.
- source_word: τίς καθ’ ἡμῶν
  choice: кто против нас
  rationale: Сохраняет лаконичную риторическую антитезу ὑπέρ / κατά — «за / против».
theological_decisions:
- issue: Условная сила εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: «Если Бог за нас»
  alternative: «Раз Бог за нас»
  rationale: Основной текст сохраняет формальное условие εἰ и не устраняет риторическую напряжённость. В данном контексте это не сомнение в Божьей поддержке, поэтому в сноске дано допустимое причинно-утвердительное прочтение.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и риторически выразительная. Параллелизм «за нас — против нас» сохранён.
