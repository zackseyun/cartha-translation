base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: ru
  text: Ведь творение с нетерпением ожидает явления сыновей Божьих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей Божьих». В греческом тексте сказано «сыновей»; это слово может также подчёркивать сыновний статус и право наследования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью естественным для современного русского языка способом.
- source_word: ἀποκαραδοκία
  choice: с горячим ожиданием
  rationale: Передаёт напряжённое, устремлённое вперёд ожидание; наречное сочетание позволяет избежать тяжеловесной буквальной конструкции.
- source_word: κτίσεως
  choice: всё творение
  rationale: Контекст указывает на творение как совокупный сотворённый мир; «всё» естественно подчёркивает этот собирательный смысл, не меняя объёма понятия.
- source_word: ἀποκάλυψιν
  choice: явления
  rationale: В данном контексте речь идёт о будущем явном обнаружении тех, чей статус теперь сокрыт; «явление» звучит естественно и достойно.
- source_word: υἱῶν
  choice: сыновей
  rationale: Сохраняет мужской род греческого слова и возможный оттенок сыновнего статуса и наследования; охват женщин пояснён в сноске.
- source_word: θεοῦ
  choice: Бога
  rationale: Прямо передаёт родительный падеж отношения в выражении «сыновья Бога».
- source_word: ἀπεκδέχεται
  choice: ждёт
  rationale: Направленность и напряжённость ожидания уже выражены сочетанием «с горячим ожиданием», поэтому простой глагол избегает избыточного повтора.
theological_decisions:
- issue: Передавать ли υἱῶν θεοῦ как «сыновей Бога» или инклюзивно как «детей Бога».
  choice: сыновей Бога
  alternative: детей Бога
  rationale: Греческий текст употребляет существительное мужского рода «сыновья»; этот вариант также сохраняет возможный смысл сыновнего положения и наследования в рассуждении Павла. При этом выражение может относиться ко всем Божьим детям, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Конструкция сохраняет пояснительное γὰρ, напряжённость ожидания и богословски значимое буквальное «сыновей», не устраняя возможного инклюзивного смысла.
