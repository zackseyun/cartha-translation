  source_fidelity: Греческое οἱ ... ὄντες ἐν σαρκί означает «те, кто находится/пребывает во плоти», то есть характеризует состояние. Вариант «живущие по плоти» близок по контекстуальному смыслу, но переводит выражение более истолковательно и смещает его к образу поведения («жить по плоти»), тогда как в оригинале стоит «быть во плоти». «Не могут угодить Богу» точно передаёт θεῷ ἀρέσαι οὐ δύνανται. Союз «а» уместно передаёт δέ в контексте.
