    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: живущие
  rationale: Субстантивированное причастие обозначает группу людей, пребывающих в определённом состоянии; русское «живущие» естественно выражает не просто местонахождение, а образ существования в данном контексте.
- source_word: δὲ
  choice: А
  rationale: Частица продолжает и одновременно подчёркивает противопоставление предыдущему высказыванию; союз «а» естественно передаёт эту связь по-русски.
- source_word: ἐν σαρκὶ
  choice: по плоти
  rationale: Сохранён ключевой для Павла термин «плоть» и его связь с ближайшим контекстом. Оборот «по плоти» в данном контексте естественнее буквального «во плоти» и не сводит значение к одной интерпретации.
- source_word: θεῷ ἀρέσαι
  choice: угодить Богу
  rationale: Устойчивое современное русское соответствие конструкции с дательным падежом; передаёт значение ἀρέσκω без добавочного толкования.
- source_word: οὐ δύνανται
  choice: не могут
  rationale: Кратко и точно передаёт отрицание способности.
theological_decisions:
- issue: Передача σάρξ в богословски значимом контексте Римлянам 8
  choice: по плоти
  alternative: во власти греховной природы
  rationale: Основной текст сохраняет многозначный павловский термин «плоть», не отождествляя его безоговорочно с телом или с истолковательной категорией «греховная природа». Возможное контекстуальное понимание вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Формулировка краткая и выразительная; термин «плоть» сохранён ради смысловой связи с контекстом и присущей оригиналу богословской напряжённости.
