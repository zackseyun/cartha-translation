id: ROM.8.29
reference: Romans 8:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: ru
  text: Потому что тех, кого Он предузнал[a], Он и предопределил быть подобными образу Своего Сына, чтобы Сын был первенцем среди многих братьев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знал заранее»; некоторые понимают это слово в смысле заранее установленного личного отношения — «заранее обратил на них Своё благоволение».'
    reason: alternative_reading
  - marker: b
    text: В греческом тексте употреблено грамматически мужское слово «братья»; в Божьей семье оно может относиться и к мужчинам, и к женщинам.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание для предшествующего утверждения; «потому что» ясно передаёт пояснительно-причинную связь.
- source_word: προέγνω
  choice: предузнал
  rationale: Сохраняет временную приставку и богословскую ёмкость греческого глагола, не сводя его ни к простому предварительному знанию, ни к заранее проявленному особому отношению.
- source_word: προώρισεν
  choice: предопределил
  rationale: Точно передаёт предварительное определение и целевую направленность действия; это устоявшийся русский эквивалент.
- source_word: συμμόρφους τῆς εἰκόνος
  choice: быть подобными образу
  rationale: Передаёт соответствие образу и подразумеваемое преображение естественнее по-русски, чем буквальное «сообразными образу».
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Своего Сына
  rationale: Возвратное притяжательное местоимение естественно связывает Сына с действующим Богом; прописная буква сохраняет значение христологического титула.
- source_word: εἰς τὸ εἶναι
  choice: чтобы ... был
  rationale: Передаёт целевой оттенок конструкции с членным инфинитивом, не исключая сопутствующего оттенка результата.
- source_word: πρωτότοκον
  choice: первенцем
  rationale: Сохраняет исходную метафору и её библейско-богословское значение, включая первенство, не заменяя её толкованием.
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: среди многих братьев
  rationale: «Среди» естественно передаёт ἐν в данном контексте, а «братьев» сохраняет грамматически мужскую форму исходного текста.
theological_decisions:
- issue: Следует ли истолковывать προέγνω как простое предварительное знание или как заранее установленное личное отношение.
  choice: «предузнал» с пояснительной сноской
  alternative: «знал заранее»; «заранее обратил на них Своё благоволение»
  rationale: Основной текст сохраняет лексическую форму и богословское напряжение греческого выражения, не закрепляя конфессионально обусловленное толкование.
- issue: Следует ли передавать ἀδελφοῖς гендерно-инклюзивной формой в основном тексте.
  choice: «братьев» с пояснительной сноской
  alternative: «братьев и сестёр»; «детей одной семьи»
  rationale: Мужская грамматическая форма представлена прямо, а вероятное включение мужчин и женщин разъясняется без изменения образа родства в основном тексте.
- issue: Цель или результат в εἰς τὸ εἶναι.
  choice: «чтобы Сын был»
  alternative: «так что Сын стал»; «для того, чтобы Ему быть»
  rationale: Выбрано естественное целевое выражение, при этом конструкция контекста не требует жёстко исключать оттенок результата.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис сделан ясным для обычного читателя; повтор «Он и» сохраняет риторическую связь греческих καί, а повтор «Сын» вместо местоимения устраняет возможную русскую двусмысленность относительно того, кто должен быть первенцем.
