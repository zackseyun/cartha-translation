    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает стих с контекстом.
- source_word: ἀδελφοί
  choice: братья и сёстры
  rationale: Греческая форма буквально означает «братья», но как обращение к общине включает верующих обоих полов; это значение ясно передано в основном тексте, а буквальная форма отмечена в сноске.
- source_word: ὀφειλέται ἐσμέν
  choice: мы должники
  rationale: Сохраняет образ долга в ὀφειλέται и выражает нравственную обязанность, а не финансовую задолженность.
- source_word: τῇ σαρκί / σάρκα
  choice: плоти / по плоти
  rationale: Сохраняет повтор и богословски значимую лексику Павла, не сводя многозначное σάρξ к одному толкованию.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: чтобы жить по плоти
  rationale: Естественно передаёт поясняющий инфинитив и сохраняет характерное для контекста выражение «по плоти».
theological_decisions:
- issue: Следует ли истолковывать σάρξ как «греховную природу» в основном тексте
  choice: плоть
  alternative: греховная человеческая природа
  rationale: «Плоть» сохраняет терминологию Павла, её повтор в стихе и смысловое напряжение между плотью и Духом; возможное метафорическое понимание указано в сноске.
- issue: Охват обращения ἀδελφοί
  choice: братья и сёстры
  alternative: братья
  rationale: В обращении к верующей общине форма мужского рода имеет инклюзивный охват. Сноска сохраняет прозрачность относительно буквальной греческой формы.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Повтор «плоть… по плоти» намеренно сохранён как важная черта исходного текста.
