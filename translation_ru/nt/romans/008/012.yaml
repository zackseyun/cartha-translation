  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: ru
  text: Итак, братья и сёстры[a], мы должники — но не плоти[b], чтобы жить по плоти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «братья»; греческое слово употреблено как обращение ко всей общине верующих.'
