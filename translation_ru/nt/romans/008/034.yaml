  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: ru
  text: Кто осуждает? Христос[a] — тот, кто умер, более того — был воскрешён[b]. Он также находится по правую руку Бога[c] и ходатайствует за нас[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Мессия.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воскрес». Греческая форма страдательного залога буквально означает «был воскрешён».'
    reason: alternative_reading
  - marker: c
    text: «По правую руку Бога» — библейское выражение, обозначающее положение высшей чести и власти.
    reason: cultural_note
  - marker: d
    text: 'Или: «заступается за нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: осуждает
  rationale: Субстантивированное причастие настоящего времени естественно передано личной формой в риторическом вопросе; глагол сохраняет судебный оттенок вынесения обвинительного приговора.
- source_word: Χριστός
  choice: Христос
  rationale: В современном русском библейском регистре «Христос» узнаваемо передаёт титул Мессии и здесь точно соответствует представленному греческому тексту, в котором имя Ἰησοῦς отсутствует.
- source_word: ἀποθανών
  choice: Тот, Кто умер
  rationale: Причастие аориста передано относительной конструкцией, обозначающей завершившееся историческое событие.
- source_word: μᾶλλον δὲ
  choice: более того
  rationale: Выражение усиливает мысль, переходя от смерти Христа к Его воскресению, без противопоставления этих событий.
- source_word: ἐγερθείς
  choice: был воскрешён
  rationale: 'Сохранён пассивный залог греческой формы: воскресение представлено как совершённое над Христом действие.'
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: находится по правую руку Бога
  rationale: Передано традиционное библейское обозначение почётного положения и власти, но без архаичного «одесную».
- source_word: ἐντυγχάνει ὑπὲρ ἡμῶν
  choice: ходатайствует за нас
  rationale: «Ходатайствует» передаёт заступничество перед Богом, а «за нас» естественно выражает значение ὑπέρ в данном контексте.
theological_decisions:
- issue: Передача Χριστός как титула
  choice: Христос
  alternative: Мессия
  rationale: «Христос» является укоренившейся русской формой того же мессианского титула; сноска раскрывает его значение, не превращая титул в личное имя и не добавляя отсутствующее в данном исходном тексте имя «Иисус».
- issue: Залог ἐγερθείς
  choice: был воскрешён
  alternative: воскрес
  rationale: Пассивная формулировка следует греческой грамматике и сохраняет представленное текстом действие Бога, не исключая при этом иных новозаветных формулировок о воскресении.
- issue: Образ правой руки Бога
  choice: по правую руку Бога
  alternative: одесную Бога
  rationale: Сохранён библейский образ высшей чести и власти без антропоморфного уточнения и без излишне архаичной лексики.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксический параллелизм повторного «Он и…» сохраняет риторическое нарастание оригинала; архаизм «одесную» и узкоконфессиональная терминология не используются.
