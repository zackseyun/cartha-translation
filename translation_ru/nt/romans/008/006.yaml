  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: ru
  text: Ведь образ мыслей плоти[a] — смерть, а образ мыслей Духа[b] — жизнь и мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «греховной природы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «духа».'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим рассуждением естественно для современного русского языка.
- source_word: φρόνημα
  choice: помышления
  rationale: Обозначает устойчивую направленность мыслей и устремлений, а не только отдельную мысль; повтор сохраняет параллелизм оригинала.
- source_word: σάρξ
  choice: плоть
  rationale: Сохраняет ключевой термин Павла и присущую ему богословскую напряжённость, не сводя значение сразу к толкованию «греховная природа».
- source_word: θάνατος
  choice: смерть
  rationale: Прямо передаёт краткую и весомую антитезу оригинала.
- source_word: πνεῦμα
  choice: Дух
  rationale: Контекст Римлянам 8 преимущественно указывает на Святого Духа; прописная буква отражает это понимание, а возможная альтернатива отмечена в сноске.
- source_word: ζωή
  choice: жизнь
  rationale: Прямой эквивалент, сохраняющий противопоставление смерти.
- source_word: εἰρήνη
  choice: мир
  rationale: Стандартный широкий библейский эквивалент, естественно сочетающийся со словом «жизнь».
theological_decisions:
- issue: Имеется ли в виду под πνεῦμα Святой Дух или человеческий дух
  choice: Святой Дух (Дух с прописной буквы)
  alternative: человеческий дух или дух в более общем смысле
  rationale: В ближайшем контексте Римлянам 8 плоть неоднократно противопоставляется Духу как божественному источнику жизни; при этом грамматическая форма сама по себе не устраняет альтернативу.
- issue: Следует ли истолковывать σάρξ как «греховную природу» непосредственно в тексте
  choice: плоть
  alternative: греховная природа
  rationale: Буквальное «плоть» сохраняет терминологию Павла и не разрешает за читателя весь спектр его значения; поясняющий вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом. Конструкция с тире сохраняет именную форму и лаконичность греческого текста. «Помышления» выбрано как понятное библейское слово, передающее устойчивую внутреннюю направленность.
