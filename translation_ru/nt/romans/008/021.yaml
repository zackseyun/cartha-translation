id: ROM.8.21
reference: Romans 8:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: ru
  text: потому что и само творение будет освобождено от рабства тлению и обретёт славную свободу детей Божьих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в свободу славы детей Божьих».'
    reason: Более буквальная передача греческой цепочки родительных падежей сохраняет её неоднозначность.
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз истолкован как причинный: он объясняет основание надежды, о которой говорится в предыдущем стихе.'
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: и само творение
  rationale: «И» сохраняет присоединительное значение καί, а «само» передаёт усиление αὐτή; κτίσις в контексте обозначает сотворённый мир в целом.
- source_word: ἐλευθερωθήσεται
  choice: будет освобождено
  rationale: 'Будущее время и страдательный залог сохранены: творение станет объектом грядущего освобождения.'
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: от рабства тлению
  rationale: Сильная метафора δουλεία передана словом «рабство», а φθορά здесь означает тление, разрушение и смертную бренность сотворённого мира, а не прежде всего нравственную испорченность.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: обретёт … свободу
  rationale: Греческое εἰς выражает переход в новое состояние; русское «обретёт свободу» естественно передаёт итог освобождения, не воспроизводя неестественную конструкцию «в свободу».
- source_word: τῆς δόξης
  choice: славную
  rationale: Родительный падеж передан определением для естественности русского текста; буквальная и более неоднозначная конструкция приведена в сноске.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: детей Божьих
  rationale: τέκνα означает «дети», без ограничения мужским полом; выражение сохраняет семейный образ и привычно для современного русского библейского стиля.
theological_decisions:
- issue: Передача цепочки родительных падежей τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: славную свободу детей Божьих
  alternative: свободу славы детей Божьих
  rationale: 'Основной вариант естественен по-русски и понимает δόξα как характеристику будущей свободы. Сноска сохраняет буквальную цепочку и её смысловую открытость: речь может идти о свободе, отмеченной славой, либо о свободе, принадлежащей славному состоянию Божьих детей.'
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. «Тление» сохранено как точный и укоренённый богословский термин; синтаксис упрощён ради естественности без устранения исходной смысловой неоднозначности, отмеченной сноской.
