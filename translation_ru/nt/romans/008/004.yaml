  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: ru
  text: чтобы праведное требование Закона[a] исполнилось в нас — живущих не по плоти[b], а по Духу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «требование Закона».'
    reason: lexical_alternative
  - marker: b
    text: «Плоть» здесь означает падшую человеческую природу или жизнь, направленную не к Богу; иногда переводится как «греховная природа».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «духу»; в контексте Римлянам 8 здесь, вероятнее всего, имеется в виду Святой Дух.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое и результативное значение греческого союза.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: праведное требование Закона
  rationale: Сохраняет как нормативно-правовой, так и нравственный оттенок δικαίωμα; речь идёт о справедливом требовании Закона, а не обязательно об отдельном постановлении.
- source_word: πληρωθῇ
  choice: исполнилось
  rationale: Передаёт аорист пассивного залога в придаточном с ἵνα, не уточняя деятеля.
- source_word: ἐν ἡμῖν
  choice: в нас
  rationale: Прямо сохраняет значение предлога ἐν и не подменяет его более интерпретирующим «нами».
- source_word: περιπατοῦσιν
  choice: живущих
  rationale: В современном русском метафорическое «ходящих» здесь менее естественно; «живущих» ясно передаёт образ жизни и сохраняет этический смысл.
- source_word: σάρξ
  choice: плоть
  rationale: Сохраняет многозначный павловский термин без сведения его к более узкому толкованию «греховная природа».
- source_word: πνεῦμα
  choice: Дух
  rationale: Контекст Римлянам 8 преимущественно указывает на Святого Духа; возможное чтение «дух» отмечено в сноске.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: по плоти… по Духу
  rationale: Кратко и естественно передаёт повторяющуюся конструкцию κατά и сохраняет параллелизм.
theological_decisions:
- issue: Относится ли πνεῦμα к человеческому духу или к Святому Духу
  choice: Дух
  alternative: дух
  rationale: Ближайший контекст Римлянам 8 подчёркивает действие и сферу Святого Духа, однако сама греческая форма допускает более общее прочтение, поэтому оно сохранено в сноске.
- issue: Означает ли ἐν ἡμῖν исполнение «в нас» или «нами»
  choice: в нас
  alternative: нами; среди нас
  rationale: Буквальное «в нас» не приписывает людям агентность, которой греческий текст прямо не выражает, и оставляет открытым преобразующий смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Закон» написан с прописной буквы как обозначение Моисеева Закона. Причастная конструкция заменена естественным «живущих», а павловские термины «плоть» и «Дух» сохранены. Маркер [a] не использован, поскольку русская формулировка «праведное требование» уже непосредственно выражает предусмотренную английской сноской лексическую альтернативу, и отдельная русская сноска была бы тавтологичной.
