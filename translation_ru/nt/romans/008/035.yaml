id: ROM.8.35
reference: Romans 8:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: ru
  text: Кто отлучит нас от любви Мессии?[a] Скорбь ли, или теснота, или гонение, или голод, или нагота, или опасность, или меч?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «от нашей любви к Мессии». Греческая конструкция допускает такое понимание, хотя контекст скорее говорит о любви Мессии к нам.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Кто
  rationale: Личное вопросительное местоимение передано прямо; оно сохраняет риторическую форму вопроса Павла.
- source_word: χωρίσει
  choice: отлучит
  rationale: Глагол обозначает отделение, разрыв связи. «Отлучит» естественно сочетается в русском с конструкцией «от любви» и сохраняет серьёзный регистр.
- source_word: ἀγάπης
  choice: любви
  rationale: Прямое и обычное соответствие греческому слову ἀγάπη.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός употреблено как титул; «Мессия» ясно передаёт его смысл. Родительный падеж сохранён, не устраняя присущую греческой конструкции неоднозначность.
- source_word: θλῖψις
  choice: скорбь
  rationale: Передаёт тяжёлое давление, бедствие и страдание; слово понятно современному читателю и соответствует возвышенному регистру отрывка.
- source_word: στενοχωρία
  choice: теснота
  rationale: Сохраняет образ стеснения и безвыходного положения, а также отличает это слово от более общего θλῖψις.
- source_word: διωγμός
  choice: гонение
  rationale: Устоявшееся и точное русское обозначение преследования за веру или принадлежность к группе.
- source_word: λιμός
  choice: голод
  rationale: В данном перечне означает тяжёлую нехватку пищи; «голод» естественнее для современного русского, чем более описательные варианты.
- source_word: γυμνότης
  choice: нагота
  rationale: Сохраняет конкретный образ отсутствия одежды и возможной крайней нужды, не заменяя его толкованием.
- source_word: κίνδυνος
  choice: опасность
  rationale: Прямой и современный эквивалент, охватывающий угрозу жизни и безопасности.
- source_word: μάχαιρα
  choice: меч
  rationale: Сохраняет буквальный образ оружия и подразумеваемую угрозу насильственной смерти.
theological_decisions:
- issue: Значение родительного падежа в τοῦ Χριστοῦ
  choice: любовь Мессии, то есть любовь Мессии к нам
  alternative: наша любовь к Мессии
  rationale: В греческом родительный падеж допускает как субъектное, так и объектное понимание. Контекст Римлянам 8:31–39 преимущественно указывает на любовь Мессии к верующим, поэтому это понимание принято в основном тексте, а менее вероятное сохранено в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Повтор «или» сохраняет ритм и нарастающую силу греческого перечисления; «скорбь» и «теснота» оставлены разными словами, чтобы не сглаживать различие исходных терминов.
