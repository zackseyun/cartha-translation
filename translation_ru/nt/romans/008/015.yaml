  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: ru
  text: 'Ведь вы получили не дух рабства, снова ведущий к страху, а дух усыновления[a], в котором[b] мы взываем: «Авва! Отец!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух усыновления»; в контексте выражение может относиться к Святому Духу.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в котором»; греческое местоимение среднего рода согласуется со словом «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: дух рабства
  rationale: Сохраняет образ рабского состояния и прямое противопоставление «духу усыновления»; отсутствие артикля в греческом не требует неопределённого местоимения в русском.
- source_word: πάλιν εἰς φόβον
  choice: снова ведущий к страху
  rationale: Передаёт как πάλιν («снова»), так и направленность εἰς φόβον («к страху»), не превращая оборот в отдельное утверждение.
- source_word: πνεῦμα υἱοθεσίας
  choice: дух усыновления
  rationale: «Усыновление» естественно передаёт юридический и семейный смысл υἱοθεσία, включая статус сына и связанные с ним права наследника.
- source_word: ἐν ᾧ
  choice: в котором
  rationale: Формально и естественно соответствует греческому обороту. В русском мужской род слова «дух» позволяет не решать искусственно, следует ли понимать Духа лично или выражение более отвлечённо.
- source_word: κράζομεν
  choice: мы взываем
  rationale: Передаёт громкий, настойчивый и эмоциональный характер глагола, сохраняя достойный литературный регистр.
- source_word: Αββα ὁ πατήρ
  choice: Авва! Отец!
  rationale: «Авва» транслитерирует арамейское обращение, а «Отец» передаёт его греческое пояснение; восклицательные знаки отражают силу возгласа.
theological_decisions:
- issue: Обозначает ли πνεῦμα υἱοθεσίας непосредственно Святого Духа или «дух» как дарованное состояние сыновства
  choice: В основном тексте сохранено «дух усыновления» со строчной буквы, а вероятное личное понимание как Святого Духа отмечено в сноске.
  alternative: «Дух усыновления»
  rationale: Контекст Рим 8 ясно указывает на действие Святого Духа, однако синтаксический параллелизм с «духом рабства» оставляет выражению смысловую напряжённость. Русское «в котором» позволяет не устранять её преждевременно.
translation_notes:
  register: Современный литературный русский язык с ясной, торжественной интонацией. Сохранены образ рабства, юридико-семейный смысл усыновления и эмоциональная сила обращения к Отцу; формулировка не устраняет неоднозначность слова πνεῦμα.
