  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: ru
  text: Ведь все, кого ведёт Дух Божий, — сыны Божьи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети Божьи». Слово «сыны» сохраняет греческую формулировку и связанную с контекстом мысль об усыновлении и наследстве; здесь оно относится ко всем Божьим детям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: все, кого
  rationale: Естественно передаёт множественную соотносительную конструкцию и её всеохватный смысл.
- source_word: γὰρ
  choice: ведь
  rationale: Выражает пояснительную связь с предшествующим рассуждением и звучит естественно в современном русском языке.
- source_word: πνεύματι θεοῦ
  choice: Дух Божий
  rationale: При глаголе в страдательном залоге творительный смысл передан русской конструкцией «кого ведёт Дух Божий»; сохранено Павлово обозначение «Дух Божий».
- source_word: ἄγονται
  choice: ведёт
  rationale: Активная русская конструкция естественно передаёт настоящее время и пассивный смысл греческого «ведомы» без архаичности.
- source_word: οὗτοι
  choice: —
  rationale: Указательное выделение греческого οὗτοι передано синтаксическим акцентом после конструкции «все, кого…»; добавление «именно те» было бы тяжеловесным.
- source_word: υἱοί
  choice: сыны
  rationale: Сохраняет явно мужскую форму греческого слова и контекстуальные оттенки усыновления и наследования; возможный инклюзивный смысл пояснён в сноске.
- source_word: θεοῦ
  choice: Божий / Божьи
  rationale: Естественно передаёт оба генитива, сохраняя повтор имени Бога в русском притяжательном прилагательном.
theological_decisions:
- issue: Передавать ли υἱοί θεοῦ как «сыны Божьи» или более инклюзивно как «дети Божьи».
  choice: сыны Божьи
  alternative: дети Божьи; сыновья и дочери Бога
  rationale: Греческий текст содержит мужское множественное υἱοί, а в контексте Рим 8 образ сыновства связан с усыновлением и наследством. «Сыны» сохраняет эту текстуру, тогда как сноска отмечает, что обозначение охватывает всех Божьих детей.
translation_notes:
  register: Современный литературный и ясный регистр. «Ведь» естественно связывает стих с предыдущим рассуждением. Форма «сыны» слегка возвышенна, но уместна для сохранения библейского образа сыновства; устаревшее «водимы» не используется.
