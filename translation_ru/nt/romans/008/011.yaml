  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: ru
  text: Если же Дух Того, кто воскресил Иисуса из мёртвых, живёт в вас, то Тот, кто воскресил из мёртвых Христа Иисуса[a], оживит и ваши смертные тела благодаря Своему Духу, живущему в вас.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Христос» — титул со значением «Мессия», то есть «Помазанник».
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «посредством Своего Духа, живущего в вас». Такой перевод отражает инструментальное понимание выражения; оно также поддерживается вариантом греческого текста с родительным падежом.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Дух
  rationale: В обоих случаях речь в контексте идёт о Святом Духе; прописная буква ясно передаёт личного божественного Референта.
- source_word: ἐγείραντος / ἐγείρας
  choice: воскресил
  rationale: В контексте воскресения Иисуса русское «воскресил» естественнее и точнее, чем буквальное «поднял».
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устойчивая русская формулировка, сохраняющая смысл возвращения из состояния и среды мёртвых.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: живёт / живущему
  rationale: «Живёт» ясно и естественно передаёт постоянное пребывание Духа; повтор корня сохраняет лексическую связь двух выражений.
- source_word: Χριστὸν Ἰησοῦν
  choice: Христа Иисуса
  rationale: Сохранены порядок греческих слов и титульное значение Χριστός; форма «Христа Иисуса» укоренена в русском библейском стиле и остаётся понятной.
- source_word: ζῳοποιήσει
  choice: оживит
  rationale: Кратко и непосредственно передаёт будущее дарование жизни смертным телам.
- source_word: θνητὰ σώματα
  choice: смертные тела
  rationale: Точное и естественное соответствие, сохраняющее телесную конкретность и указание на смертность.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: благодаря Своему Духу, живущему в вас
  rationale: Основной текст следует διά с винительным падежом в указанном тексте SBLGNT и передаёт наиболее прямой причинный смысл; местоимение «Своему» недвусмысленно относится к воскресившему Богу.
theological_decisions:
- issue: Причинное или инструментальное значение διὰ в заключительной части стиха
  choice: благодаря Своему Духу, живущему в вас
  alternative: посредством Своего Духа, живущего в вас
  rationale: При чтении διά с винительным падежом наиболее непосредственно выражена причина или основание. Инструментальное понимание широко известно и связано с вариантом формы, поэтому оно сохранено в примечании, а не исключено.
- issue: Передача Χριστός как титула
  choice: Христос с пояснением титульного смысла
  alternative: Мессия
  rationale: В современном литературном русском «Христос Иисус» звучит естественнее, чем «Мессия Иисус», но примечание сохраняет значение титула «Мессия, Помазанник» и не превращает его в фамилию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; сохранены повтор «воскресил» и телесная конкретность обещания. Причинное чтение заключительной фразы оставлено в основном тексте, а подлинная грамматико-текстовая неоднозначность отмечена в сноске.
