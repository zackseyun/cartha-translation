source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: ru
  text: 'Ибо то, чего закон не мог сделать[a], поскольку был бессилен из-за плоти[b], сделал Бог: послав Своего Сына в подобии греховной плоти[d] и в связи с грехом[c], Он осудил грех во плоти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бессилие закона» или «невозможное для закона».'
    reason: lexical_alternative
  - marker: b
    text: «Плоть» здесь, вероятно, означает человека в его падшей слабости; перевод «греховная природа» был бы более истолковывающим.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как жертву за грех». Греческое выражение «в связи с грехом» в библейском употреблении может иметь жертвенный смысл.'
    reason: alternative_reading
  - marker: d
    text: Слова «в подобии греховной плоти» утверждают подлинную человечность Сына, но не называют Его Самого грешным.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: то, чего закон не мог сделать
  rationale: Безличная субстантивированная конструкция обозначает неспособность закона совершить необходимое; такой перевод естественен по-русски и сохраняет смысл бессилия.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: поскольку был бессилен из-за плоти
  rationale: Оборот поясняет причину неспособности закона. «Из-за плоти» передаёт причинно-посредствующую силу διά, не заменяя многозначное σάρξ толкованием «греховная природа».
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: Своего Сына
  rationale: Возвратное местоимение сохраняет усиление ἑαυτοῦ и естественно выражает принадлежность при подлежащем «Бог».
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: в подобии греховной плоти
  rationale: Формулировка близко передаёт греческое выражение, одновременно утверждая подлинную человеческую телесность Сына и не приписывая Ему грех.
- source_word: περὶ ἁμαρτίας
  choice: ради греха
  rationale: Основной текст сохраняет широкий смысл греческого выражения, не делая жертвенное толкование единственно возможным; вероятный смысл «как жертву за грех» вынесен в примечание.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: осудил грех
  rationale: Прямо передаёт судебную силу глагола κατακρίνω.
- source_word: ἐν τῇ σαρκί
  choice: во плоти
  rationale: Сохраняет краткость и неоднозначность оригинала, который не добавляет местоимения «Его».
theological_decisions:
- issue: Значение σάρξ в стихе
  choice: В обоих случаях сохранено слово «плоть».
  alternative: «греховная природа» в первом случае или более истолковывающая формулировка
  rationale: 'У Павла здесь наслаиваются телесный и антропологический смыслы: закон бессилен из-за падшей человеческой плоти, а грех осуждён в сфере плоти через воплощение. Перевод не должен заранее сужать это напряжение.'
- issue: Значение περὶ ἁμαρτίας
  choice: «ради греха» в основном тексте
  alternative: «как жертву за грех»
  rationale: В библейском греческом оборот часто имеет жертвенный смысл, но сама краткая формула допускает более общее понимание. Основной текст сохраняет широту, а жертвенное прочтение отмечено в сноске.
- issue: Христологический смысл выражения «в подобии греховной плоти»
  choice: Сохранены и «подобие», и «греховная плоть».
  alternative: Разъясняющий перевод, прямо называющий Сына безгрешным или ослабляющий реальность Его человечности
  rationale: Греческая формулировка одновременно говорит о реальном вхождении Сына в человеческую плоть и осторожно не отождествляет Его с грехом; перевод сохраняет это напряжение без догматической вставки.
- issue: Референт выражения ἐν τῇ σαρκί
  choice: «во плоти» без добавления притяжательного местоимения
  alternative: «в Его плоти»
  rationale: Контекст допускает отнесение к плоти Сына, однако греческий текст не уточняет это местоимением; компактная формулировка сохраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сохраняет ход греческой мысли, но подразумеваемое действие выражено словом «сделал» ради ясности. Термин «плоть» сохранён как значимый и намеренно многослойный; конфессионально окрашенные разъяснения в основной текст не внесены.
