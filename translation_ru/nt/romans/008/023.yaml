language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: ru
  text: И не только оно, но и мы сами, имеющие начаток Духа[a], — мы тоже в самих себе стонем, с нетерпением ожидая усыновления[b] — искупления нашего тела[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «Дух как начаток».'
    reason: alternative_reading
  - marker: b
    text: Греческое слово буквально связано с получением положения сына и наследника; здесь оно относится ко всем верующим.
    reason: lexical_alternative
  - marker: c
    text: 'В греческом тексте стоит единственное число: «нашего тела»; оно может иметь распределительное значение — тела каждого из нас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: И не только творение, но и
  rationale: В греческом дополнение после «не только» подразумевается из предыдущего стиха; «творение» делает связь ясной по-русски, не меняя противопоставления.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: и мы сами / и мы
  rationale: Сохраняется усиленное включение верующих в общий стон, но буквальный повтор «сами» смягчён ради естественного русского синтаксиса.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: начаток Духа
  rationale: Традиционное и ёмкое русское выражение сохраняет образ первой доли будущего урожая и неоднозначность родительного падежа.
- source_word: ἔχοντες
  choice: имеющие
  rationale: Причастная конструкция естественно передаёт греческое причастие и характеризует «мы».
- source_word: ἐν ἑαυτοῖς
  choice: в глубине души
  rationale: Передаёт внутренний, сокровенный характер стона современным и понятным русским выражением.
- source_word: στενάζομεν
  choice: стонем
  rationale: Сохраняет словесную связь со стоном творения в ближайшем контексте.
- source_word: υἱοθεσίαν
  choice: усыновления
  rationale: Стандартный русский богословский эквивалент сохраняет образ получения статуса сына и наследника; референт включает всех верующих.
- source_word: ἀπεκδεχόμενοι
  choice: с нетерпением ожидая
  rationale: Передаёт усиленное, напряжённое ожидание, выраженное приставочным греческим глаголом.
- source_word: τὴν ἀπολύτρωσιν
  choice: искупления
  rationale: Сохраняет ключевую богословскую лексику Павла и эсхатологическую направленность высказывания.
- source_word: τοῦ σώματος ἡμῶν
  choice: нашего тела
  rationale: Следует грамматическому числу греческого текста; единственное число имеет распределительное значение.
theological_decisions:
- issue: Означает ли τὴν ἀπαρχὴν τοῦ πνεύματος дар, происходящий от Духа, или самого Духа как начаток
  choice: начаток Духа
  alternative: Духа как начаток
  rationale: Основной текст сохраняет формальную неоднозначность греческого родительного падежа, а возможное приложительное понимание отмечено в сноске.
- issue: Как передать υἱοθεσίαν, сохранив образ сыновства и наследования и не сузив круг до мужчин
  choice: усыновление
  alternative: принятие в Божью семью
  rationale: «Усыновление» сохраняет лексический образ статуса сына-наследника у Павла; по контексту этот статус относится ко всем верующим, и это поясняется в сноске.
- issue: Соотношение уже полученного статуса детей Божьих и будущего усыновления
  choice: с нетерпением ожидая усыновления — искупления нашего тела
  alternative: ожидая полноты усыновления
  rationale: 'Не добавляется слово «полнота»: напряжение между уже данным и ещё ожидаемым усыновлением сохраняется, а сам стих отождествляет ожидаемое с искуплением тела.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского рассуждения. Сохранены образы начатка, стона, усыновления и искупления. Тире перед «искуплением» передаёт пояснительное приложение. Явно добавленное «творение» восстанавливает подразумеваемый член сопоставления из Рим 8:22 и предотвращает неясное русское «не только».
