review_pass:
  verdict: revise
  source_fidelity: 'Основная мысль передана точно: Λογίζομαι — «я полагаю», γάρ — «ибо», страдания нынешнего времени противопоставлены будущей славе. «Не идут ни в какое сравнение с» удачно и естественно выражает несоизмеримость, подразумеваемую οὐκ ἄξια ... πρὸς. «Грядущая слава» сохраняет значение μέλλουσαν. Однако «которой предстоит открыться нам» оформляет ἀποκαλυφθῆναι как возвратное действие самой славы, тогда как в греческом стоит страдательный инфинитив: слава должна быть открыта/явлена. Более точная русская пассивная конструкция устраняет это небольшое смещение.'
  naturalness: Текст звучит современно, литературно и уместно возвышенно. Связка «ибо» понятна и соответствует аргументативному переходу. Замена на «которая будет открыта нам» остаётся естественной, хотя несколько более формальной, и лучше отражает залог подлинника.
  terminology: «Страдания», «нынешнее время» и «грядущая слава» выбраны удачно. Сноска корректно сохраняет существенную, но спорную возможность понимания εἰς ἡμᾶς как «в нас», не навязывая богословского истолкования.
  issues:
  - severity: low
    issue: Возвратная конструкция «которой предстоит открыться нам»
    rationale: ἀποκαλυφθῆναι имеет страдательный залог («быть открытой/явленной»). Русское «открыться» может быть понятно в контексте, но грамматически представляет славу как самостоятельно открывающуюся, а не как открываемую.
  revised_text: Ибо я полагаю, что страдания нынешнего времени не идут ни в какое сравнение с грядущей славой, которая будет открыта нам[a].
  revised_footnotes:
