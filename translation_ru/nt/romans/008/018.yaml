  to: Ибо я полагаю, что страдания нынешнего времени не идут ни в какое сравнение с грядущей славой, которая будет открыта нам[a].
  rationale: 'Сохранены все удачные лексические и стилистические решения черновика. Изменены только глагольная конструкция и согласованная с ней формулировка сноски: «будет открыта» прямо передаёт страдательный залог ἀποκαλυφθῆναι и будущее раскрытие славы; «грядущая» продолжает отдельно передавать μέλλουσαν.'
