id: ROM.8.18
reference: Romans 8:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: ru
  text: Ибо я полагаю, что страдания нынешнего времени не идут ни в какое сравнение с грядущей славой, которая будет открыта нам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открыта в нас».'
    reason: Сохраняется возможное значение εἰς ἡμᾶς, при котором слава проявляется в верующих, а не только открывается им.
lexical_decisions:
- source_word: Λογίζομαι
  choice: я полагаю
  rationale: Передаёт обдуманное суждение Павла, а не субъективное ощущение; выражение естественно для современного литературного русского языка.
- source_word: γὰρ
  choice: ибо
  rationale: Сохраняет пояснительно-обосновывающую связь с предшествующей мыслью; «ибо» уместно в достойном библейском регистре и остаётся понятным современному читателю.
- source_word: οὐκ ἄξια … πρὸς
  choice: не идут ни в какое сравнение с
  rationale: Естественно выражает подразумеваемую греческой конструкцией несоизмеримость, не превращая речь в утверждение о нравственной «достойности» страданий.
- source_word: τὰ παθήματα
  choice: страдания
  rationale: Прямой и общепонятный эквивалент, обозначающий переживаемые бедствия и мучения.
- source_word: τοῦ νῦν καιροῦ
  choice: нынешнего времени
  rationale: Сохраняет временное значение καιρός без добавления явно не выраженного существительного «век».
- source_word: τὴν μέλλουσαν δόξαν
  choice: грядущей славой
  rationale: Передаёт направленность μέλλουσαν в будущее кратко и естественно, сохраняя «славу» как ключевое богословское понятие.
- source_word: ἀποκαλυφθῆναι
  choice: которой предстоит открыться
  rationale: Передаёт будущее пассивно-смысловое раскрытие славы и её предстоящее явление, не называя прямо действующее лицо.
- source_word: εἰς ἡμᾶς
  choice: нам
  rationale: Естественно передаёт направленность откровения к верующим; возможный смысл «в нас» сохранён в примечании.
theological_decisions:
- issue: Значение εἰς ἡμᾶς при откровении славы
  choice: открыться нам
  alternative: открыться в нас
  rationale: Предлог εἰς допускает здесь близкие значения направленности к верующим и проявления в них. Основной текст выбирает наиболее естественное русское выражение, а значимая богословская возможность участия верующих в славе не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной связкой «ибо». Идиома «не идут ни в какое сравнение» ясно и естественно передаёт резкую несоизмеримость нынешних страданий и грядущей славы.
