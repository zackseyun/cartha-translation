  source_fidelity: 'Текст точно передаёт греческий оригинал: сохранены повтор νόμος («закон»), генитивные сочетания «Духа жизни» и «греха и смерти», локативное «в Мессии Иисусе», а также чтение второго лица единственного числа («тебя»). Совершенный глагол «освободил» адекватно передаёт ἠλευθέρωσεν.'
