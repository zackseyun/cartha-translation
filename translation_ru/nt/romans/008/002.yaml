  terminology: «Закон», «Дух», «жизнь», «грех», «смерть» употреблены последовательно. «Мессия Иисус» обоснованно передаёт титульный характер Χριστός; традиционный вариант «Христос Иисус» корректно отмечен. Сноска о варианте «меня» верно отражает текстологическую неопределённость. Лексическая сноска о «действующем принципе» не заменяет основной образ «закона» и сохраняет его в обоих вхождениях.
