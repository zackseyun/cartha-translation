id: ROM.8.2
reference: Romans 8:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: ru
  text: Потому что закон Духа жизни в Мессии Иисусе освободил тебя[b] от закона греха и смерти.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действующий принцип»: «принцип Духа жизни… от принципа греха и смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «меня» вместо «тебя».'
    reason: textual_variant
  - marker: c
    text: 'Традиционный перевод: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: закон
  rationale: В обоих случаях сохранено одно и то же существительное, чтобы передать повтор и напряжение Павловой метафоры; значение «действующий принцип» отмечено в сноске.
- source_word: πνεύματος
  choice: Духа
  rationale: Контекст Римлянам 8 указывает на Святого Духа как подателя жизни; прописная буква ясно передаёт это понимание.
- source_word: ζωῆς
  choice: жизни
  rationale: Прямой перевод родительного падежа сохраняет краткое выражение «Дух жизни» без пояснительного расширения.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог «в» сохраняет язык единения с Мессией, а Χριστός передан как титул «Мессия»; традиционный вариант дан в сноске.
- source_word: ἠλευθέρωσέν
  choice: освободил
  rationale: Естественный русский глагол передаёт совершившееся действие; контекст подразумевает его сохраняющийся результат.
- source_word: σε
  choice: тебя
  rationale: Переведено чтение второго лица единственного числа, напечатанное в SBLGNT; вариант «меня» указан в сноске.
- source_word: ἁμαρτίας
  choice: греха
  rationale: Стандартный перевод сохраняет возможность понимать грех и как абстрактную реальность, и как порабощающую силу.
- source_word: θανάτου
  choice: смерти
  rationale: Стандартный перевод сохранён в тесном сочетании с «грехом».
theological_decisions:
- issue: Относится ли πνεύματος к Святому Духу или к человеческому духу либо безличному духовному принципу
  choice: Святой Дух («Дух» с прописной буквы)
  alternative: человеческий дух или духовный принцип
  rationale: В Римлянам 8 противопоставление плоти, греху и смерти, а также животворящая роль Духа наиболее естественно указывают на Святого Духа.
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» прозрачно передаёт титульное значение греческого Χριστός; привычная церковная передача сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Сохранены компактность, повтор слова «закон» и богословски значимая конструкция «в Мессии Иисусе». Маркеры размещены непосредственно при соответствующих выражениях.
