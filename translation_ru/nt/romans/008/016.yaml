  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: ru
  text: Сам Дух свидетельствует вместе с нашим духом[a], что мы — Божьи дети.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствует нашему духу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Сам Дух
  rationale: Возвратное αὐτό при артикле и существительном усиливает подлежащее. Русское «Сам Дух» естественно передаёт это ударение; грамматический род слова «Дух» позволяет сохранить личностное обозначение без дополнительных пояснений.
- source_word: συμμαρτυρεῖ
  choice: свидетельствует вместе с
  rationale: Глагол с приставкой συν- выражает совместное или согласующееся свидетельство. Формулировка сохраняет этот смысл и звучит ясно в современном русском языке.
- source_word: τῷ πνεύματι ἡμῶν
  choice: с нашим духом
  rationale: Дательный падеж наиболее естественно понимать как обозначение соучастника свидетельства при συμμαρτυρεῖ. Возможное понимание адресата свидетельства вынесено в примечание.
- source_word: ὅτι ἐσμὲν
  choice: что мы —
  rationale: ὅτι вводит содержание свидетельства, а именная конструкция с тире естественно передаёт утверждение в русском языке.
- source_word: τέκνα θεοῦ
  choice: Божьи дети
  rationale: τέκνα обозначает детей без ограничения по полу; притяжательная форма «Божьи» естественно передаёт родительный θεοῦ и сохраняет семейный образ.
theological_decisions:
- issue: Характер свидетельства Духа по отношению к человеческому духу
  choice: Дух свидетельствует вместе с нашим духом
  alternative: Дух свидетельствует нашему духу
  rationale: Приставка συν- в συμμαρτυρεῖ поддерживает значение совместного свидетельства, однако форма дательного падежа допускает традиционное понимание человеческого духа как адресата. Альтернатива отмечена, чтобы не скрывать экзегетическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная без архаизмов. Заглавная буква в слове «Дух» указывает на Святого Духа по контексту, а «дух» со строчной — на человеческий дух.
