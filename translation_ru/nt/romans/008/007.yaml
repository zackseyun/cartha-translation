  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: ru
  text: 'потому что образ мыслей плоти[a] — это вражда против Бога[b]: ведь он не подчиняется Божьему закону и даже не способен на это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «греховной природы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «враждебность к Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: потому что
  rationale: Передаёт причинное значение союза и естественно связывает стих с предыдущим утверждением.
- source_word: τὸ φρόνημα
  choice: образ мыслей
  rationale: Передаёт не только деятельность разума, но устойчивую направленность и склад мышления; выражение понятно современному читателю.
- source_word: τῆς σαρκὸς
  choice: плоти
  rationale: Сохраняет ключевой для Павла образ и неоднозначность термина σάρξ, не подменяя его в основном тексте истолкованием «греховная природа».
- source_word: ἔχθρα εἰς θεόν
  choice: вражда против Бога
  rationale: 'Именная конструкция сохраняет категоричность греческого текста: речь идёт не просто о враждебном настроении, а о вражде, направленной против Бога.'
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: не подчиняется Божьему закону
  rationale: Естественно передаёт идею неподчинения или отсутствия покорности закону Бога.
- source_word: οὐδὲ γὰρ δύναται
  choice: и даже не способен на это
  rationale: Передаёт усиление οὐδέ и прямое указание δύναται на неспособность; «на это» ясно отсылает к подчинению Божьему закону.
theological_decisions:
- issue: Следует ли передавать σάρξ буквально как «плоть» или истолковывать как «греховную природу»
  choice: В основном тексте сохранено «плоть», а истолковательный вариант дан в сноске.
  alternative: греховная природа
  rationale: Контекст указывает на человеческую направленность в противлении Богу, однако слово «плоть» сохраняет павловский образ и не сужает его смысл до одного истолкования.
- issue: Следует ли смягчать заключительное утверждение о неспособности
  choice: 'Сохранено прямое утверждение: «даже не способен на это».'
  alternative: не хочет подчиняться
  rationale: δύναται обозначает способность, а не желание. Перевод сохраняет богословское напряжение текста, не дополняя его выводами какой-либо системы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Образ мыслей» выбран вместо более архаичного «помышление»; именная формула «это вражда» сохраняет силу и форму исходного утверждения.
