  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: ru
  text: Ибо я убеждён, что ни смерть, ни жизнь, ни ангелы, ни власти[a], ни настоящее, ни будущее, ни силы,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальства»; возможно, имеются в виду космические или духовные власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: я убеждён
  rationale: Перфект передаёт устойчивое состояние уверенности; эта формулировка естественна в современном русском языке.
- source_word: γὰρ
  choice: ибо
  rationale: Союз вводит обоснование предыдущего утверждения и сохраняет логическую связь без расширительного пересказа.
- source_word: οὔτε ... οὔτε
  choice: ни ... ни
  rationale: Повторяющаяся конструкция сохраняет ритм и нарастающий характер греческого перечисления.
- source_word: θάνατος
  choice: смерть
  rationale: Прямое соответствие, образующее антитезу со словом «жизнь».
- source_word: ζωή
  choice: жизнь
  rationale: Прямое соответствие, образующее антитезу со словом «смерть».
- source_word: ἄγγελοι
  choice: ангелы
  rationale: Хотя слово может означать посланников, контекст сверхчеловеческих и космических реалий указывает на ангелов.
- source_word: ἀρχαὶ
  choice: власти
  rationale: Слово может обозначать правящие силы или космические власти. «Власти» понятно современному читателю и не сводит смысл исключительно к определённому классу духовных существ.
- source_word: ἐνεστῶτα
  choice: настоящее
  rationale: Субстантивированное причастие обозначает существующие ныне реалии; «настоящее» кратко и естественно передаёт временную категорию.
- source_word: μέλλοντα
  choice: будущее
  rationale: Субстантивированное причастие обозначает грядущие реалии; «будущее» сохраняет параллелизм с «настоящим».
- source_word: δυνάμεις
  choice: силы
  rationale: Прямой перевод сохраняет неоднозначность между личными или духовными силами и силами в более широком смысле.
theological_decisions:
- issue: Следует ли передавать ἀρχαὶ и δυνάμεις как специальные наименования классов духовных существ
  choice: В основном тексте употреблены широкие обозначения «власти» и «силы».
  alternative: «начала и силы» либо «начальства и силы»
  rationale: Контекст, вероятно, включает космические или духовные силы, однако греческие слова не требуют сведения смысла к одной разработанной классификации. Перевод сохраняет широту и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; повтор «ни» сохраняет риторический ритм оригинала. Конечная запятая оставлена, поскольку стих грамматически продолжается в Римлянам 8:39.
