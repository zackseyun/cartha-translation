id: ROM.8.28
reference: Romans 8:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: ru
  text: И мы знаем, что для любящих Бога всё содействует ко благу[a] — для тех, кто призван согласно замыслу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Бог всё направляет ко благу».'
    reason: textual_variant
  - marker: b
    text: 'Или: «согласно Его замыслу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: мы знаем
  rationale: Настоящее время передаёт устойчивое, разделяемое знание; это естественная современная русская формулировка.
- source_word: δὲ
  choice: И
  rationale: Частица мягко продолжает рассуждение и здесь не требует усиленного противопоставления.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: для любящих Бога
  rationale: Дательный падеж обозначает тех, в отношении кого действует сказанное; конструкция кратка и естественна по-русски.
- source_word: πάντα
  choice: всё
  rationale: Сохраняет всеохватность греческого среднего рода множественного числа без ненужного уточнения «все обстоятельства».
- source_word: συνεργεῖ
  choice: содействует
  rationale: Передаёт совместную направленность всего к результату и не вводит в основной текст явно названного субъекта «Бог», отсутствующего в данном чтении SBLGNT.
- source_word: εἰς ἀγαθόν
  choice: ко благу
  rationale: Передаёт направленность к доброму результату; выражение естественно для достойного литературного регистра.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: для тех, кто призван согласно замыслу
  rationale: Сохраняет повторное обозначение той же группы и не добавляет отсутствующее в греческом притяжательное местоимение.
- source_word: πρόθεσιν
  choice: замыслу
  rationale: В контексте обозначает намеренную цель или план; «замысел» звучит естественнее самостоятельного русского «цель» после «согласно» и не требует добавлять «Его».
- source_word: κλητοῖς
  choice: призван
  rationale: «Призван» — точный и устойчивый в русском языке эквивалент павловского термина, не раскрывающий сверх текста характер призвания.
theological_decisions:
- issue: Неявный субъект συνεργεῖ
  choice: 'В основном тексте: «всё содействует ко благу».'
  alternative: «Бог всё направляет ко благу».
  rationale: Предоставленный текст SBLGNT не называет Бога субъектом этой части предложения. Вариант с явным θεός отражён в сноске, чтобы сохранить текстологическую и богословскую неоднозначность.
- issue: Притяжательное значение в κατὰ πρόθεσιν
  choice: «согласно замыслу» без добавления «Его».
  alternative: «согласно Его замыслу».
  rationale: Контекст подразумевает Божий замысел, но притяжательное местоимение в греческой фразе отсутствует; основной текст не делает подразумеваемое явным, а естественная альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Содействует ко благу» сохраняет компактность и формальную открытость исходной конструкции; тире ясно показывает, что заключительная фраза повторно характеризует любящих Бога.
