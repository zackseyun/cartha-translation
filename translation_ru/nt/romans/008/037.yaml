  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: ru
  text: Но во всём этом мы одерживаем полную победу через Того, кто возлюбил нас.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы с избытком побеждаем».'
    reason: lexical_alternative
  - marker: b
    text: То есть по ближайшему контексту, вероятнее всего, Христа.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт сильное противопоставление перечисленным прежде бедствиям и предполагаемому поражению.
- source_word: ἐν τούτοις πᾶσιν
  choice: во всём этом
  rationale: Формально близко передаёт предложную конструкцию и связывает стих со всеми испытаниями, перечисленными в предыдущем стихе.
- source_word: ὑπερνικῶμεν
  choice: одерживаем полную победу
  rationale: 'Сохраняет глагольную форму и усилительное значение ὑπέρ- при νικάω: речь идёт о решительной, всецелой победе.'
- source_word: διὰ
  choice: благодаря
  rationale: С родительным падежом выражает посредство или действенную причастность того, через кого достигается победа; по-русски «благодаря» здесь звучит естественно.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: Тому, Кто возлюбил нас
  rationale: Субстантивированное причастие передано без добавления имени; прописные буквы уместны как уважительное указание на божественное лицо, но не устраняют контекстуальную неопределённость между явным именованием Христа и более общим указанием на Бога.
- source_word: ἀγαπήσαντος
  choice: возлюбил
  rationale: Совершенный вид естественно передаёт аорист как целостное совершившееся действие и сохраняет возвышенный, но понятный библейский регистр.
theological_decisions:
- issue: Кто назван «возлюбившим нас»
  choice: В основном тексте сохранено описательное «Тому, Кто возлюбил нас» без добавления имени.
  alternative: Прямо назвать Христа либо Бога во Христе.
  rationale: Ближайший контекст, особенно Рим. 8:35, вероятнее всего указывает на Христа, однако сам греческий текст этого стиха имени не называет; перевод сохраняет данную текстом меру определённости.
- issue: Характер победы
  choice: «одерживаем полную победу»
  alternative: «мы больше чем победители»; «мы с избытком побеждаем»
  rationale: Греческий текст употребляет усиленный глагол, а не существительное; выбранная формулировка передаёт действие и его решительный характер, не превращая его в утверждение о статусе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка ясна для широкого читателя; синтаксис и богословская неопределённость оригинала сохранены.
