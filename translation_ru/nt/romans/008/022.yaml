base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: ru
  text: Ведь мы знаем, что всё творение разом стонет и испытывает родовые муки доныне[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё сотворённое»; возможно также: «каждое сотворённое существо», хотя в данном контексте более вероятен широкий смысл — весь сотворённый мир.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «испытывает родовые муки» передаёт образ родовых схваток: это не просто страдание, а боль, связанная с рождением и новой жизнью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Хотя οἶδα исторически имеет форму перфекта, в койне оно обычно выражает настоящее состояние знания; «мы знаем» естественно передаёт общее, твёрдо установленное знание.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно вводит пояснение к предыдущей мысли и сохраняет аргументативную связь стиха с контекстом.
- source_word: πᾶσα ἡ κτίσις
  choice: всё творение
  rationale: Сочетание πᾶσα с артиклем здесь имеет собирательный смысл. «Всё творение» сохраняет широкий, космический охват контекста Рим 8:19–23.
- source_word: συστενάζει
  choice: вместе стонет
  rationale: Перевод сохраняет значение стона и совместность, выраженную приставкой συν-.
- source_word: συνωδίνει
  choice: вместе мучится в родах
  rationale: Глагол обозначает именно родовые муки, а не страдание вообще; перевод сохраняет образ рождения и совместность, выраженную приставкой συν-.
- source_word: ἄχρι τοῦ νῦν
  choice: доныне
  rationale: Краткое и естественное для литературного русского языка выражение продолжающегося до настоящего времени состояния.
theological_decisions:
- issue: Следует ли передавать κτίσις как «творение» или как «создание / сотворённое существо».
  choice: всё творение
  alternative: всё сотворённое; каждое сотворённое существо
  rationale: 'В Рим 8:19–23 Павел олицетворяет сотворённый порядок в широком масштабе: он покорён тщете и ожидает освобождения. «Всё творение» сохраняет этот широкий смысл, не сводя речь к отдельным существам.'
- issue: Следует ли понимать συνωδίνει как обычное страдание или сохранять образ родов.
  choice: мучится в родах
  alternative: страдает вместе
  rationale: Греческий глагол прямо обозначает родовые муки. Сохранение образа передаёт не только боль, но и возможную направленность этой боли к рождению, не уточняя сверх текста, что именно должно родиться.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Доныне» сохраняет достоинство и краткость, оставаясь понятным. Повтор «вместе» намеренно передаёт приставку συν- в обоих греческих глаголах и подчёркивает совместность переживания всего творения.
