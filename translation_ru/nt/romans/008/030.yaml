id: ROM.8.30
reference: Romans 8:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: ru
  text: А тех, кого Он предопределил[a], Он и призвал; тех, кого призвал, Он и оправдал; а тех, кого оправдал, Он и прославил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заранее предназначил».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте стоит прошедшее время — «прославил»; некоторые понимают его здесь как указание на будущую славу, настолько несомненную, что о ней говорится как об уже совершившейся.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: предопределил
  rationale: Глагол означает заранее определить или предназначить. «Предопределил» кратко и точно передаёт временную предшествованность решения, не уточняя спорный богословский механизм.
- source_word: ἐκάλεσεν
  choice: призвал
  rationale: «Призвал» — естественный русский эквивалент καλέω в этом контексте; он сохраняет связь звеньев Павловой последовательности и не конкретизирует способ призвания.
- source_word: ἐδικαίωσεν
  choice: оправдал
  rationale: В употреблении Павла δικαιόω обычно имеет судебно-правовой оттенок. «Оправдал» передаёт его кратко и традиционно, не разворачивая перевод в толкование «объявил праведными».
- source_word: ἐδόξασεν
  choice: прославил
  rationale: Греческая форма — аорист изъявительного наклонения, поэтому в основном тексте сохранено прошедшее время. Возможное отнесение к будущей славе отмечено в сноске.
- source_word: οὓς ... τούτους
  choice: тех, кого ... Он
  rationale: Повторяющаяся соотносительная конструкция указывает на одну и ту же группу на каждом этапе. Русская формула «тех, кого… Он» естественно сохраняет эту цепь.
- source_word: καὶ
  choice: и
  rationale: В каждой части καί имеет присоединительно-усилительное значение. Русское «и» в позиции перед сказуемым естественно передаёт смысл «также» и сохраняет ритм перечисления.
- source_word: δὲ
  choice: а
  rationale: δέ служит мягкой связкой, а не выражает сильное противопоставление. «А» естественно вводит начальную и заключительную части цепи в русском синтаксисе.
theological_decisions:
- issue: Следует ли смягчать προώρισεν во избежание конфессиональных ассоциаций
  choice: предопределил
  alternative: заранее предназначил; заранее определил
  rationale: Греческий текст прямо говорит о предварительном определении. Перевод сохраняет это значение, но не добавляет объяснений, разрешающих последующие богословские споры.
- issue: Передавать ли ἐδόξασεν прошедшим или будущим временем
  choice: прославил
  alternative: прославит
  rationale: В греческом стоит аорист изъявительного наклонения, поэтому основной текст сохраняет прошедшее время. Понимание этой формы как указания на будущее событие, представленное как несомненное, вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены повтор, цепная структура и прошедшие формы оригинала; местоимение «Он» написано с прописной буквы как уважительное указание на Бога.
