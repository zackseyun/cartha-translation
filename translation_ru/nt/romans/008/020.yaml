  terminology: «Творение», «тщета», «подчинено» и «надежда» удачны. «Тщета» соответствует ματαιότης и сохраняет библейский регистр; сноска корректно даёт доступные смысловые альтернативы. Личность «того, кто подчинил» не названа, как и в оригинале.
