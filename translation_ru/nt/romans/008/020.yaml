  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: ru
  text: Ведь творение было подчинено тщете[a] не по своей воле, а по причине того, кто его подчинил[b], — в надежде[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суете», «бесплодности» или «бессмысленности».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте прямо не сказано, кто именно подчинил творение.
    reason: alternative_reading
  - marker: c
    text: 'Или: «с надеждой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: тщете
  rationale: «Тщета» передаёт состояние бессилия достичь должной цели, пустоту и бесплодность, не сводя значение к нравственному злу.
- source_word: κτίσις
  choice: творение
  rationale: В контексте Рим. 8:19–22 слово обозначает сотворённый мир в совокупности, а не отдельное существо.
- source_word: ὑπετάγη
  choice: было подчинено
  rationale: Пассивная форма сохраняет мысль о навязанном творению состоянии подчинённости.
- source_word: οὐχ ἑκοῦσα
  choice: не по своей воле
  rationale: Естественно по-русски выражает отсутствие добровольного участия творения.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: по воле того, кто его подчинил
  rationale: Передаёт причинное значение διά с винительным падежом и личный характер действующего лица, не называя его прямо.
- source_word: ἐφ’ ἑλπίδι
  choice: в надежде
  rationale: Кратко сохраняет направленность к ожидаемому будущему; связь оборота допускает некоторую синтаксическую неоднозначность.
theological_decisions:
- issue: Кто подчинил творение тщете
  choice: В основном тексте оставлено неопределённое «тот, кто его подчинил».
  alternative: Можно понимать как Бога, подвергшего творение суду с надеждой на будущее освобождение; падение Адама также рассматривается как повод для этого подчинения.
  rationale: Греческий текст прямо не называет действующее лицо, поэтому перевод не должен устранять эту сдержанность.
- issue: Синтаксическая связь ἐφ’ ἑλπίδι
  choice: Оборот «в надежде» отделён тире и отнесён к подчинению творения.
  alternative: Возможен перевод «с надеждой», теснее связывающий надежду с тем, кто подчинил творение.
  rationale: Греческий оборот компактен и допускает различия в оттенке и синтаксической привязке; основной текст сохраняет эту напряжённость без развёрнутого толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. «Тщета» несколько возвышенно, но общеупотребительно в библейском контексте; сноска раскрывает более современные смысловые варианты. Порядок маркеров приведён в последовательность [a], [b], [c].
