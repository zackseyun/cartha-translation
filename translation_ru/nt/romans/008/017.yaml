review_pass:
  verdict: revise
  source_fidelity: 'Смысловой состав стиха в целом передан верно: сохраняются сыновний статус, наследование от Бога, совместность с Христом, условное εἴπερ и связь совместного страдания с будущим прославлением. Однако «сонаследники Христу» не соответствует нормативной валентности слова «сонаследник» и потому не может быть оставлено. «Сонаследники Христа» — устоявшееся и грамматически корректное русское выражение, которое в данном контексте означает сонаследников вместе со Христом, а не тех, кто наследует самого Христа. Пассивное συνδοξασθῶμεν точнее передать личной пассивной конструкцией «были прославлены».'
  naturalness: После замены дательного падежа на родительный текст звучит естественно в современном литературном русском. Личная конструкция «чтобы и мы были прославлены вместе с Ним» также яснее передаёт подлежащее и пассивный залог, чем инфинитивное «прославиться».
  terminology: «Дети», «наследники», «Бога», «Христос» и «сонаследники» уместны. Сноска о титульном значении Χριστός допустима и сохраняет возможность прочесть традиционное «Христос» как титул «Мессия/Помазанник».
