id: ROM.8.17
reference: Romans 8:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: ru
  text: А если мы дети, то и наследники — наследники Бога и сонаследники Христа[a], если действительно страдаем вместе с Ним, чтобы и мы были прославлены вместе с Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мессии (Помазаннику)».'
    reason: Передаёт титульное значение Χριστός, тогда как «Христос» является традиционной русской формой этого титула.
lexical_decisions:
- source_word: τέκνα
  choice: дети
  rationale: Форма среднего рода во множественном числе обозначает детей без указания пола; в контексте речь идёт о положении в Божьей семье.
- source_word: κληρονόμοι
  choice: наследники
  rationale: Естественный русский юридико-семейный термин, точно передающий право на наследство.
- source_word: θεοῦ
  choice: Бога
  rationale: Прямо сохраняет греческий родительный падеж и не устраняет возможную смысловую насыщенность выражения «наследники Бога».
- source_word: συγκληρονόμοι
  choice: сонаследники
  rationale: Приставка συν- указывает на совместное участие в наследстве; «сонаследники» кратко и точно передаёт этот смысл.
- source_word: Χριστοῦ
  choice: Христу
  rationale: Дательный падеж после «сонаследники» ясно выражает совместное наследование с Христом, а не получение Христа в наследство.
- source_word: εἴπερ
  choice: если действительно
  rationale: Сохраняет реальное условие и одновременно риторическую уверенность, не ослабляя его до «поскольку».
- source_word: συμπάσχομεν
  choice: страдаем вместе с Ним
  rationale: Передаёт как страдание, так и значение совместности, выраженное приставкой συν-; местоимение раскрывает подразумеваемую связь со Христом.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное отношение между совместным страданием и прославлением.
- source_word: συνδοξασθῶμεν
  choice: вместе с Ним и прославиться
  rationale: Возвратная форма русского инфинитива здесь естественно передаёт греческий пассив, а «вместе с Ним» сохраняет значение приставки συν-.
theological_decisions:
- issue: Представляет ли εἴπερ συμπάσχομεν страдание как заслуживающее награду условие или как участие в пути Христа
  choice: 'Сохранено настоящее условие: «если действительно страдаем вместе с Ним», без утверждения, что страдание заслуживает прославление.'
  alternative: «Поскольку мы страдаем вместе с Ним» либо формулировка, представляющая страдание заслугой.
  rationale: εἴπερ имеет условную силу с оттенком уверенности; контекст говорит о совместном участии со Христом, но не называет страдание основанием заслуги.
- issue: Как передать совместное наследование с Χριστοῦ
  choice: «сонаследники Христу»
  alternative: «сонаследники Христа» или «наследуем вместе со Христом»
  rationale: Дательный падеж в современном русском яснее показывает, что Христос — Тот, вместе с Кем верующие наследуют, сохраняя краткость греческого выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повтор «вместе с Ним» намеренно сохраняет параллелизм греческих глаголов с приставкой συν-. Формулировка не снимает условной силы εἴπερ и не превращает страдание в заслугу.
