  terminology: «Исследует сердца», «Дух», «ходатайствует» и «святые» удачны и согласованы с традиционной библейской терминологией, не будучи излишне архаичными. «Образ мыслей Духа» передаёт φρόνημα точнее, чем множественное «помышления».
