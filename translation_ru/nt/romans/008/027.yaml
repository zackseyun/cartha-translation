  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: ru
  text: А Тот, Кто исследует сердца, знает, каков образ мыслей Духа, потому что Дух ходатайствует за святых по Богу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно Божьей воле».'
    reason: Лексико-синтаксическая альтернатива для κατὰ θεόν; слово «воля» подразумевается по смыслу, но прямо в греческом тексте не выражено.
lexical_decisions:
- source_word: ἐραυνῶν
  choice: исследует
  rationale: Передаёт активное, проникающее действие настоящего причастия и естественно сочетается с библейским образом сердец.
- source_word: καρδίας
  choice: сердца
  rationale: Сохраняет исходную антропологическую метафору без поясняющего пересказа.
- source_word: τί τὸ φρόνημα τοῦ πνεύματος
  choice: каковы помышления Духа
  rationale: «Помышления» передаёт направленность мысли и внутреннее устремление φρόνημα, сохраняет связь с контекстом Рим 8 и звучит естественнее буквального «что есть образ мыслей».
- source_word: τοῦ πνεύματος
  choice: Духа
  rationale: Контекст Рим 8 указывает на Святого Духа, поэтому употреблена прописная буква.
- source_word: ἐντυγχάνει
  choice: ходатайствует
  rationale: Точно выражает молитвенное заступничество Духа в связи с предыдущим стихом.
- source_word: ὑπὲρ ἁγίων
  choice: за святых
  rationale: Естественная русская передача ὑπέρ с родительным падежом в значении действия в чью-либо пользу.
- source_word: κατὰ θεὸν
  choice: согласно Богу
  rationale: Сохраняет компактность и необычность греческого выражения, не добавляя отсутствующего в тексте слова «воля».
theological_decisions:
- issue: Следует ли раскрывать κατὰ θεὸν как указание на Божью волю
  choice: согласно Богу
  alternative: согласно Божьей воле
  rationale: По смыслу выражение, вероятно, указывает на соответствие Божьей воле, однако слово «воля» в греческом тексте отсутствует. Основной текст сохраняет формальную и богословскую сдержанность, а более явное толкование вынесено в сноску.
- issue: К кому относится подразумеваемое подлежащее ἐντυγχάνει
  choice: Дух ходатайствует
  alternative: Он ходатайствует
  rationale: В греческом глаголе подлежащее подразумевается; ближайший референт — Дух. Повтор существительного в русском устраняет возможную двусмысленность, будто ходатайствует Исследующий сердца, и согласуется с непосредственным контекстом стиха 26.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейской речи. «Тот, Кто» обозначает Бога без вставки имени; прописная буква отражает референта. Синтаксис слегка прояснён повтором «Дух», а непривычное «согласно Богу» сохранено ради исходной богословской напряжённости и снабжено сноской.
