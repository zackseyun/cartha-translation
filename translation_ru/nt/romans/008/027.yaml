  rationale: 'Исправлены число и смысловой охват φρόνημα: «образ мыслей» передаёт единое умонастроение, сохраняя вопросительное τί. «По Богу» заменяет неестественное «согласно Богу», при этом не добавляет в основной текст отсутствующее слово «воля». Якорь сноски перенесён к выражению, которое она поясняет. Остальная формулировка верно передаёт синтаксис и контекст стиха.'
