  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: ru
  text: ни высота, ни глубина, ни какое-либо иное творение[a] не сможет отделить нас от Божьей любви в Иисусе Мессии, нашем Господе[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничто иное из сотворённого» или «никакое другое создание».'
    reason: lexical_alternative
  - marker: b
    text: «Мессия» — титул, означающий «Помазанник»; традиционная передача — «Христос».
    reason: lexical_alternative
  - marker: c
    text: Под «Божьей любовью» здесь, вероятнее всего, подразумевается любовь Бога к нам.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: высота
  rationale: В паре с βάθος слово имеет пространственный смысл и образует выразительное противопоставление крайних измерений.
- source_word: βάθος
  choice: глубина
  rationale: Прямое и естественное соответствие в паре «высота — глубина».
- source_word: τις κτίσις ἑτέρα
  choice: какое-либо иное творение
  rationale: Передаёт неопределённость τις, значение ἑτέρα («иное, другое») и смысл κτίσις как чего-либо сотворённого, не сужая его только до живого существа.
- source_word: δυνήσεται
  choice: не сможет
  rationale: Будущее время сохраняет значение будущей способности; отрицание определяется рядом οὔτε.
- source_word: χωρίσαι
  choice: отделить
  rationale: Точно передаёт невозможность разлучить или отсечь верующих от Божьей любви.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: Божья любовь
  rationale: Естественная русская передача греческого генитива; формулировка сохраняет некоторую грамматическую открытость, хотя контекст прежде всего указывает на любовь Бога к людям.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  rationale: Χριστός передан как титул «Мессия», а не как утратившее прозрачность заимствование; перестановка имени и титула делает выражение естественнее по-русски, сохраняя значение ἐν.
- source_word: κυρίῳ ἡμῶν
  choice: нашем Господе
  rationale: Традиционное и точное соответствие κύριος в данном христологическом контексте.
theological_decisions:
- issue: Значение генитива в выражении ἀγάπη τοῦ θεοῦ
  choice: В основном тексте сохранено «Божья любовь»; по контексту — любовь Бога к нам.
  alternative: Наша любовь к Богу либо намеренно широкое сочетание обоих смыслов.
  rationale: В Римлянам 8:31–39 речь сосредоточена на Божьих действиях ради Его народа, поэтому объектный смысл наиболее вероятен. Однако перевод не заменяет исходную конструкцию однозначной перифразой.
- issue: Смысл ἐν Χριστῷ Ἰησοῦ
  choice: Сохранена конструкция «в Иисусе Мессии».
  alternative: «Явленная через Иисуса Мессию», «заключённая в Иисусе Мессии».
  rationale: Более разъясняющие варианты разрешают многозначность ἐν и добавляют отсутствующие в греческом тексте смысловые оттенки.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Повтор «ни» сохраняет риторический ряд оригинала. Тире после относительного местоимения помогает естественно прочитать необычную, но богословски значимую конструкцию «любовь, которая — в Иисусе Мессии», не подменяя предлог ἐν толкованием.
