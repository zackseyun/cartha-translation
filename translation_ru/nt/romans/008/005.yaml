  source_fidelity: 'Основная структура и противопоставление переданы верно: κατὰ σάρκα / κατὰ πνεῦμα отражено как «по плоти / по Духу», а φρονοῦσιν — как устойчиво направленное мышление. Однако «о духовном» в конце может означать духовное вообще и недостаточно явно передаёт родительный оборот τὰ τοῦ πνεύματος — «то, что относится к Духу».'
  naturalness: Фраза естественна для современного литературного русского и сохраняет краткий параллелизм. Уточнённый повтор «то, что относится к …» несколько развёрнутее, но остаётся плавным и яснее удерживает связь второй части именно с Духом.
  terminology: «Плоть», «по плоти» и «по Духу» сохранены как устоявшиеся, богословски ёмкие термины. Не добавляется слово «Святой», отсутствующее в греческом тексте; прописная буква «Дух» сохраняет контекстуальную отнесённость к Божьему Духу.
