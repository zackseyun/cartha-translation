source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: ru
  text: Ведь те, кто живёт по плоти, помышляют о том, что относится к плоти, а те, кто живёт по Духу, — о том, что относится к Духу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... κατὰ σάρκα ὄντες
  choice: те, кто живёт по плоти
  rationale: Буквально оборот означает «сущие/находящиеся по плоти», но в данном противопоставлении естественное русское «живёт по плоти» передаёт образ жизни и направленность существования, не сводя σάρξ просто к телу.
- source_word: φρονοῦσιν
  choice: помышляют
  rationale: Глагол обозначает устойчивую направленность мыслей, интересов и устремлений; «помышляют» сохраняет эту широту и параллелизм стиха.
- source_word: τὰ τῆς σαρκὸς
  choice: о плотском
  rationale: Субстантивированное «плотское» естественно передаёт буквально «то, что относится к плоти» и сохраняет ёмкость выражения.
- source_word: οἱ ... κατὰ πνεῦμα
  choice: те, кто живёт по Духу
  rationale: Эллиптическая вторая часть восстанавливается по первой. Заглавная буква отражает контекст Рим 8, где πνεῦμα относится к Божьему Духу.
- source_word: τὰ τοῦ πνεύματος
  choice: о духовном
  rationale: Передаёт «то, что относится к Духу», сохраняя краткий антитетический параллелизм; связь с Духом ясна из непосредственно предшествующего «по Духу».
theological_decisions:
- issue: Значение σάρξ
  choice: плоть / плотское
  alternative: греховная природа / относящееся к греховной природе
  rationale: Сохранён многозначный павловский термин «плоть», чтобы не сужать его до одной богословской интерпретации и удержать связь с контекстом.
- issue: Референт πνεῦμα
  choice: Дух
  alternative: дух
  rationale: В контексте Рим 8 противопоставление жизни по плоти жизни по Духу указывает на Святого Духа; это отмечено прописной буквой без добавления отсутствующего в греческом определения «Святой».
- issue: ὄντες как состояние или образ жизни
  choice: живёт по
  alternative: находится в соответствии с / существует по
  rationale: «Живёт по» естественно по-русски выражает устойчивую ориентацию человека, однако не добавляет конкретных поступков и сохраняет смысл исходного оборота.
translation_notes:
  register: Современный литературный русский, краткий и ритмически параллельный. Лексика «плоть», «по Духу», «помышляют» сохраняет достоинство библейского регистра и богословскую ёмкость без архаической перегруженности.
