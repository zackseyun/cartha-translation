review_pass:
  verdict: revise
  source_fidelity: Основная мысль и риторический вопрос переданы точно. Однако «уже» в «уже не надежда» не имеет прямого соответствия в греческом тексте (οὐκ ἔστιν ἐλπίς) и слегка усиливает временной вывод. Его следует убрать. Аорист ἐσώθημεν безопаснее передать прошедшим временем «были спасены», а не формой настоящего состояния «спасены».
  naturalness: «Ведь» и вопросительная конструкция звучат естественно в современном литературном русском. «Надежда, которую видят» понятна, хотя «видимая надежда» компактнее; исходная придаточная конструкция вполне приемлема и сохраняет синтаксический акцент оригинала.
  terminology: «Спасены», «надежда» и «видят» терминологически точны. Вариант в сноске «надеждой мы спасены» корректно представляет возможное инструментальное понимание дательного, не навязывая его основному тексту.
  issues:
  - severity: low
    issue: Добавлено слово «уже» в предикате «уже не надежда».
    rationale: В греческом οὐκ ἔστιν ἐλπίς нет временного наречия. Контекст допускает логический вывод, но основной текст должен сохранять формулировку без этого усиления.
  - severity: low
    issue: «Мы спасены» может читаться как описание нынешнего состояния, а не как прошедшее событие.
    rationale: ἐσώθημεν — аорист страдательного залога; «мы были спасены» яснее воспроизводит прошедшую форму, сохраняя пассив без указания деятеля.
  revised_text: Ведь мы были спасены в надежде.[a] Но надежда, которую видят, — не надежда,[b] потому что кто надеется на то, что видит?
