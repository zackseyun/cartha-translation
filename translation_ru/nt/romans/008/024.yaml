  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: ru
  text: Ведь мы были спасены в надежде.[a] Но надежда, которую видят, — не надежда,[b] потому что кто надеется на то, что видит?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надеждой мы спасены».'
    reason: alternative_reading
  - marker: b
    text: То есть надежда относится к тому, чего пока не видно.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: в надежде
  rationale: 'Дательный падеж передан как указание на сферу или состояние: спасение уже реально, но его полнота ещё остаётся предметом надежды. Такой перевод не представляет надежду причиной спасения.'
- source_word: ἐσώθημεν
  choice: мы спасены
  rationale: Краткое страдательное причастие естественно передаёт совершившееся спасение и сохраняет пассивную форму, не уточняя прямо действующее лицо.
- source_word: ἐλπὶς ... βλεπομένη
  choice: надежда, которую видят
  rationale: Причастная конструкция передана естественным русским определительным придаточным, сохраняя противопоставление надежды и видения.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: уже не надежда
  rationale: 'Частица «уже» естественно раскрывает подразумеваемую логику: когда ожидаемое стало видимым, оно перестало быть предметом надежды; отрицание греческого текста сохранено.'
- source_word: ὃ ... βλέπει
  choice: то, что видит
  rationale: Средний род относительного местоимения относится к видимому предмету; русская конструкция «то, что» точно и естественно передаёт этот смысл.
- source_word: τίς ἐλπίζει
  choice: кто надеется
  rationale: Риторический вопрос и настоящее время переданы прямо, без добавочного аспектуального оттенка.
theological_decisions:
- issue: Связь спасения и надежды в τῇ ἐλπίδι ἐσώθημεν
  choice: «мы спасены в надежде» — надежда обозначает сферу нынешнего переживания спасения, полнота которого ещё не видима
  alternative: «надеждой мы спасены» — надежда понимается более инструментально
  rationale: Контекст сохраняет напряжение между уже совершившимся спасением и его ещё не явленной полнотой. Основной вариант не делает надежду действующей причиной спасения.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. «Ведь» естественно передаёт пояснительное γάρ, а риторический вопрос сохранён. Формулировка избегает конфессионального уточнения природы или этапов спасения.
