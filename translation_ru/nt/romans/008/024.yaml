revisions:
- from: Ведь мы спасены в надежде.[a] Но надежда, которую видят, — уже не надежда,[b] потому что кто надеется на то, что видит?
  to: Ведь мы были спасены в надежде.[a] Но надежда, которую видят, — не надежда,[b] потому что кто надеется на то, что видит?
  rationale: Удалено невыраженное в оригинале «уже» и форма глагола приведена к естественной русской передаче греческого аориста. Остальные элементы, включая сохранение «в надежде» в основном тексте и альтернативное инструментальное прочтение в сноске, оставлены без изменений.
