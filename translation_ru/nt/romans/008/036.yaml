  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: ru
  text: 'Как написано: «Ради Тебя нас умерщвляют весь день; нас сочли овцами на заклание».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нас посчитали овцами для заклания».'
    reason: Лексико-синтаксическая альтернатива для ἐλογίσθημεν ὡς πρόβατα σφαγῆς; «посчитали» передаёт значение „сочли/признали“, а «для заклания» — возможное оформление образа πρόβατα σφαγῆς.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Естественная и традиционная формула введения цитаты из Писания; настоящее состояние результата передаёт сохраняющуюся значимость написанного.
- source_word: Ἕνεκεν σοῦ
  choice: Ради Тебя
  rationale: Передаёт причинно-целевую связь и сохраняет прямое обращение к Богу в цитате.
- source_word: θανατούμεθα
  choice: нас умерщвляют
  rationale: Настоящее пассивное значение указывает на продолжающееся подвергание смерти; формулировка сохраняет торжественный вес текста.
- source_word: ὅλην τὴν ἡμέραν
  choice: весь день
  rationale: Естественно передаёт длительность и постоянство угрозы в данном контексте.
- source_word: ἐλογίσθημεν
  choice: нас сочли
  rationale: Кратко и точно выражает пассивное значение оценки или причисления.
- source_word: ὡς πρόβατα σφαγῆς
  choice: овцами, обречёнными на заклание
  rationale: Передаёт образ овец, предназначенных для убоя, сохраняя возвышенный библейский регистр и не добавляя специального жертвенного толкования.
theological_decisions:
- issue: Цитата из Псалма 43:23 (по нумерации Септуагинты) в контексте страдания
  choice: Сохранить коллективный и продолжающийся характер смертельного преследования без уточнения, что речь идёт исключительно о мученичестве.
  alternative: Истолковать выражение как прямое указание только на мученическую смерть верующих.
  rationale: Греческий текст передаёт общинный плач и образ постоянной подверженности смерти, не ограничивая его одним видом страдания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, уместным для прямой цитаты из Писания. Местоимение «Тебя» написано с прописной буквы как обращение к Богу. Маркер сноски поставлен после всей цитаты, поскольку относится к её заключительной части.
