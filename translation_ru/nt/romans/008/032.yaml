id: ROM.8.32
reference: Romans 8:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: ru
  text: Ведь Он не пощадил Своего Сына, но предал Его за всех нас[a] — как же Он вместе с Ним не дарует нам всё?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради всех нас»; выражение также может означать «в пользу всех нас».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅς γε
  choice: Тот, кто
  rationale: Относительное местоимение указывает на Бога из предыдущего контекста, а γε усиливает всё последующее утверждение. Русская конструкция «Тот, кто» естественно сохраняет связь и эмфатическую силу без тяжеловесного «Он ведь».
- source_word: τοῦ ἰδίου υἱοῦ
  choice: Своего Сына
  rationale: Возвратное притяжательное «Своего» естественно передаёт принадлежность субъекту и силу ἴδιος; прописная буква обозначает конкретного референта — Иисуса.
- source_word: οὐκ ἐφείσατο
  choice: не пощадил
  rationale: Устойчивый и точный эквивалент φείδομαι, сохраняющий суровый контекст предания на страдание и смерть и библейское эхо.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: за всех нас
  rationale: Естественно передаёт действие ради и в пользу всех нас, не превращая ὑπέρ в более узкую техническую формулу.
- source_word: παρέδωκεν αὐτόν
  choice: предал Его
  rationale: «Предал» сохраняет сильное значение передачи во власть других, на страдание и смерть; в данном контексте оно точнее мягкого «отдал».
- source_word: πῶς οὐχὶ καὶ
  choice: как же Он ... не
  rationale: Сохраняет форму риторического вопроса и усиленное уверенное умозаключение от большего дара к меньшему.
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Прямо и естественно передаёт σύν и подчёркивает, что последующие дары не отделены от Сына.
- source_word: τὰ πάντα
  choice: всего остального
  rationale: В контексте уже названного дара Сына русское «всего остального» естественно выражает τὰ πάντα как все прочие дары, не ограничивая их перечнем.
- source_word: ἡμῖν χαρίσεται
  choice: дарует нам
  rationale: «Дарует» передаёт безвозмездный, милостивый оттенок χαρίζομαι и соответствует достоинству русского библейского регистра.
theological_decisions:
- issue: Следует ли при переводе ὑπὲρ ἡμῶν πάντων прямо уточнять заместительный характер действия
  choice: за всех нас
  alternative: ради всех нас; в пользу всех нас
  rationale: Греческое выражение ясно указывает на действие ради нас и допускает жертвенные обертоны, но само по себе не требует разворачивать их в техническую формулу искупления.
- issue: Означает ли τὰ πάντα буквально всё без каких-либо контекстуальных границ
  choice: всего остального
  alternative: всё
  rationale: Риторика говорит обо всех дарах, следующих вместе с высшим даром Сына. «Всего остального» сохраняет широкую формулировку, но не навязывает идею безусловного получения каждым верующим вообще всего мыслимого.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной синтаксической формой. Сохранены риторический вопрос, контраст и богословская напряжённость; избегнуты как архаизмы вроде «собственного Сына», так и излишне разговорные обороты.
