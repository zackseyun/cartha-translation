  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: ru
  text: Итак, теперь нет никакого осуждения для тех, кто в Мессии Иисусе[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых более поздних рукописях добавлено: «которые живут не по плоти». Наиболее ранние греческие свидетельства поддерживают здесь краткое чтение.'
    reason: textual_variant
  - marker: b
    text: 'Или: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: никакого
  rationale: 'В сочетании с «нет осуждения» естественно и выразительно передаёт полное отрицание: никакого осуждения.'
- source_word: ἄρα
  choice: итак
  rationale: Обозначает вывод из предшествующего рассуждения Павла и естественно связывает стих с контекстом.
- source_word: νῦν
  choice: теперь
  rationale: Явно сохраняет указание на наступившую ныне реальность.
- source_word: κατάκριμα
  choice: осуждения
  rationale: Передаёт судебный смысл неблагоприятного приговора, а не просто субъективное чувство вины.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: для тех, кто в Мессии Иисусе
  rationale: Оборот с «для тех» естественен по-русски при конструкции «нет осуждения», а буквальное «в» сохраняет павловский язык принадлежности Мессии и единения с Ним.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Передаёт значение титула Χριστός, не превращая его без необходимости в часть имени; традиционный вариант «Христос» указан в примечании.
- source_word: Ἰησοῦ
  choice: Иисусе
  rationale: Принятая русская форма личного имени, поставленная в предложном падеже после «в».
theological_decisions:
- issue: Значение выражения «в Мессии Иисусе»
  choice: Сохранён оборот «в Мессии Иисусе», указывающий на принадлежность Ему и единение с Ним.
  alternative: 'Передать более однозначно: «благодаря Мессии Иисусу».'
  rationale: Предлог ἐν здесь несёт богатый павловский смысл участия и единения; причинный пересказ неоправданно сузил бы его.
- issue: Наличие уточнения о жизни не по плоти
  choice: В основной текст не включено.
  alternative: 'Добавить: «которые живут не по плоти».'
  rationale: Краткое чтение поддерживается наиболее ранними греческими свидетельствами; позднейшее добавление отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. «Никакого» подчёркивает полноту отрицания, а оборот «кто в Мессии Иисусе» намеренно сохраняет богословскую ёмкость оригинала.
