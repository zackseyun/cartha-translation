  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: ru
  text: Если же мы надеемся на то, чего не видим, то терпеливо и стойко[a] ожидаем этого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с терпением»; также возможно: «с выдержкой».'
    reason: lexical_alternative
  - marker: b
    text: Глагол может также передавать оттенок напряжённого, устремлённого ожидания.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Если же
  rationale: Сохраняет условное значение εἰ и мягко противопоставляющую либо продолжающую функцию δέ; по-русски естественно связывает стих с предыдущей мыслью.
- source_word: ὃ οὐ βλέπομεν
  choice: того, чего не видим
  rationale: Естественно передаёт средний род относительного местоимения и настоящее время βλέπομεν, не добавляя значения невозможности видеть.
- source_word: ἐλπίζομεν
  choice: надеемся на то
  rationale: Соответствует управлению русского глагола «надеяться» и сохраняет направленность надежды на ещё не видимое.
- source_word: δι’ ὑπομονῆς
  choice: терпеливо и стойко
  rationale: Передаёт не только терпение при ожидании, но и стойкость под давлением или при задержке, заключённую в ὑπομονή.
- source_word: ἀπεκδεχόμεθα
  choice: ожидаем этого
  rationale: Передаёт продолжающееся ожидание будущего исполнения; указательное местоимение ясно отсылает к «тому, чего не видим», не конкретизируя объект сверх текста.
theological_decisions:
- issue: Объект христианской надежды и ожидания
  choice: Сохранено неопределённое «то, чего не видим»
  alternative: Конкретизировать как спасение, искупление тела или воскресение
  rationale: Контекст помогает понять подразумеваемое, однако сам стих выражает объект относительным оборотом. Перевод не вносит в текст более узкую богословскую конкретизацию.
- issue: Оттенок ἀπεκδεχόμεθα
  choice: 'Основной текст: «ожидаем»; оттенок напряжённого ожидания вынесен в примечание'
  alternative: Перевести в основном тексте «с нетерпением ожидаем» или «с горячим ожиданием ждём»
  rationale: Глагол может обозначать устремлённое, напряжённое ожидание, но «с нетерпением» в современном русском способно ошибочно противоречить ὑπομονή — терпеливой стойкости.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Конструкция сохраняет параллель надежды и ожидания. Сочетание «терпеливо и стойко» выбрано ради полноты значения ὑπομονή без тяжеловесного «с терпеливой стойкостью».
