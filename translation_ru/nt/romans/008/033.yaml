  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: ru
  text: Кто выдвинет обвинение против избранных Богом? Бог — Тот, Кто оправдывает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь «оправдывает» употреблено в судебном смысле: Бог объявляет праведными.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Кто
  rationale: Прямое и естественное соответствие вопросительному местоимению, вводящему риторический вопрос.
- source_word: ἐγκαλέσει
  choice: выдвинет обвинение
  rationale: 'Передаёт юридический смысл глагола: предъявить кому-либо обвинение.'
- source_word: κατὰ
  choice: против
  rationale: В сочетании с глаголом обвинения естественно обозначает направленность обвинения против кого-либо.
- source_word: ἐκλεκτῶν θεοῦ
  choice: избранных Богом
  rationale: Субстантивированное прилагательное передано доступно и без излишне технической богословской окраски; родительный θεοῦ естественно раскрыт как указание на Того, Кто избрал.
- source_word: θεὸς ὁ δικαιῶν
  choice: Бог — Тот, Кто оправдывает
  rationale: Сохраняет краткость, эмфатическую постановку слова «Бог» и субстантивную силу причастия; «оправдывает» сохраняет судебный смысл.
theological_decisions:
- issue: Передача ἐκλεκτῶν без навязывания позднейшей догматической системы
  choice: избранных Богом
  alternative: избранников Божьих
  rationale: Выбранная формулировка ясно указывает на Божье избрание, но звучит в современном русском менее терминологично и более непосредственно.
- issue: Синтаксическая и смысловая сила θεὸς ὁ δικαιῶν
  choice: Бог — Тот, Кто оправдывает
  alternative: Бог оправдывает
  rationale: Именная конструкция сохраняет акцент оригинала на Боге как на оправдывающем и не превращает фразу в менее выразительное простое утверждение.
- issue: Судебный смысл δικαιόω
  choice: оправдывает с пояснением в сноске
  alternative: объявляет праведными
  rationale: Традиционный и естественный русский глагол сохраняет лаконичность текста, а сноска предотвращает понимание исключительно как нравственного преобразования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены риторический вопрос, судебная образность и эмфатическая краткость греческого текста.
