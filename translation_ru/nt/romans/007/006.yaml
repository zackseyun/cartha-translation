  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: ru
  text: Но теперь мы освобождены от закона, умерев для того, чем мы были связаны[a], чтобы служить в новизне Духа[b], а не в ветхости буквы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умерев для того, что держало нас в плену».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «духа».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «писаного предписания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: мы освобождены от закона
  rationale: Пассивная форма с ἀπό обозначает освобождение от связывающей власти закона, а не прекращение существования самого закона. Настоящее «теперь» и результат совершившегося действия естественно переданы краткой формой «освобождены».
- source_word: ἀποθανόντες
  choice: умерев
  rationale: Деепричастие сохраняет отнесённость действия к подразумеваемому субъекту «мы» и показывает, что умерли верующие, а не закон.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: для того, что удерживало нас
  rationale: Формулировка передаёт прежнее состояние связанности и при этом не перегружает русское предложение буквальным «в том, в чём мы удерживались». Возможный инструментальный оттенок сохранён в примечании.
- source_word: δουλεύειν
  choice: служить
  rationale: Глагол сохраняет смысл подчинённого служения, но в данном сопоставлении способов служения естественное русское «служить» точнее, чем чрезмерно эксплицитное «быть рабами».
- source_word: καινότητι πνεύματος
  choice: в новизне Духа
  rationale: Абстрактное существительное «новизна» сохраняет форму и риторическую симметрию греческого текста; прописная буква отражает наиболее вероятное указание на Святого Духа.
- source_word: παλαιότητι γράμματος
  choice: в ветхости буквы
  rationale: Перевод сохраняет параллель между καινότης и παλαιότης и павловское противопоставление Духа и буквы, не подменяя «букву» толкованием.
theological_decisions:
- issue: 'Кто умер: закон или верующие'
  choice: 'Умерли верующие: «мы освобождены… умерев».'
  alternative: Закон умер по отношению к нам.
  rationale: ἀποθανόντες стоит в именительном падеже множественного числа и относится к подразумеваемому «мы»; перевод сохраняет эту грамматическую связь.
- issue: Обозначает ли πνεύματος Святого Духа или человеческий дух
  choice: «Духа» — Святого Духа.
  alternative: «духа» — внутренний человеческий дух или духовный образ служения.
  rationale: Контраст Духа и буквы в контексте Павла скорее указывает на действие Святого Духа, однако грамматически возможное более общее понимание отмечено в сноске.
- issue: Означает ли освобождение от закона, что сам закон упразднён
  choice: Верующие освобождены от связывающей власти закона.
  alternative: Сам закон прекратил существование или был уничтожен.
  rationale: Сочетание κατηργήθημεν ἀπὸ τοῦ νόμου описывает изменившееся отношение верующих к закону и не требует вывода, что закон перестал существовать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Слова «новизна», «ветхость» и «буква» сохраняют абстрактную симметрию и напряжение греческого противопоставления; сноски поясняют реальные лексические и смысловые альтернативы без внесения конфессионального толкования.
