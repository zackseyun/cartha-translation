  source_fidelity: 'Основная мысль передана верно: «мы» освобождены от закона, умерли именно верующие, а не закон; сохранено противопоставление новизны Духа и ветхости буквы. Однако оборот «умерев для того, что удерживало нас» в современном русском семантически и синтаксически неудачен: «для того» здесь легко понимается как указание на цель, тогда как греческий текст говорит о том, по отношению к чему (или чем) они были удерживаемы.'
  naturalness: Начало и заключительное противопоставление звучат литературно и имеют уместную библейскую возвышенность. Заменённый оборот «умерев для того, чем мы были связаны» сохраняет намеренно сжатую, несколько парадоксальную формулу Павла, но по-русски ясно выражает прекращение прежней связанности.
  terminology: «Закон», «служить», «новизна Духа», «ветхость буквы» удачно сохраняют ключевую терминологию и параллелизм. Прописная буква в «Духа» допустима как предпочтительное контекстуальное понимание; возможность строчного «духа» правильно оставлена в примечании. «Ветхость» несколько возвышенно, но нормативно и уместно для данного риторического контраста.
  issues:
