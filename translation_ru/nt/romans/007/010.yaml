  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: ru
  text: А я умер; и заповедь, предназначенная для жизни, — именно она оказалась для меня ведущей к смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανον
  choice: я умер
  rationale: Аорист передаёт прямое утверждение о наступившем результате; простой прошедший вид сохраняет краткость и силу греческого выражения.
- source_word: εὑρέθη μοι
  choice: оказалась для меня
  rationale: Так естественно передаётся пассивная конструкция с дательным μοι и сохраняется смысл обнаружившегося на опыте результата.
- source_word: ἐντολή
  choice: заповедь
  rationale: Обычный и уместный русский эквивалент для ἐντολή в контексте Божьего закона; не добавляет отсутствующего в греческом слова «закон».
- source_word: ἡ εἰς ζωὴν
  choice: предназначенная вести к жизни
  rationale: Передаёт направленность εἰς ζωή, не утверждая излишне конкретный механизм и оставаясь понятным современному читателю.
- source_word: αὕτη
  choice: та самая
  rationale: Сохраняет указательное и подчёркивающее значение αὕτη.
- source_word: εἰς θάνατον
  choice: путём к смерти
  rationale: Передаёт направленность к смерти и поддерживает контраст с направленностью к жизни, избегая более причинного «привела меня к смерти».
theological_decisions:
- issue: Следует ли прямо сказать, что заповедь причинила смерть
  choice: оказалась для меня путём к смерти
  alternative: привела меня к смерти
  rationale: Греческий текст говорит об обнаружившемся исходе «к смерти», но не формулирует причинность настолько прямо, как глагол «привела»; выбранный вариант сохраняет богословское напряжение контекста.
translation_notes:
  register: Современный литературный русский язык; формулировка естественная и достойная, с сохранением подчёркивающей силы αὕτη и смыслового противопоставления жизни и смерти.
