  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: ru
  text: Но теперь уже не я совершаю это[a], а живущий во мне грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это уже не я совершаю, а грех, живущий во мне».'
    reason: Возможный вариант порядка слов, ещё явнее передающий смысловое выделение местоимения ἐγώ и определительный характер причастного оборота.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Но теперь
  rationale: Передаёт и логический контраст с предшествующим рассуждением, и временной оттенок выражения.
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно передаёт прекращение или отстранение, выраженное греческим наречием.
- source_word: ἐγὼ
  choice: я
  rationale: Личное местоимение сохранено явно, поскольку в греческом оно выражено отдельно и несёт смысловое ударение; русская конструкция «не я» естественно передаёт этот акцент.
- source_word: κατεργάζομαι
  choice: совершаю
  rationale: В данном контексте глагол обозначает осуществление упомянутого поступка; «совершаю» сохраняет весомость выражения и звучит естественно.
- source_word: αὐτὸ
  choice: это
  rationale: Местоимение отсылает к уже названному действию; в русском контексте «это» является прямой и ясной передачей.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: живущий во мне грех
  rationale: Причастная конструкция сохраняет яркую персонификацию греха и близко следует синтаксису оригинала.
- source_word: οἰκοῦσα
  choice: живущий
  rationale: «Живущий» понятно современному читателю и передаёт устойчивое внутреннее присутствие; более буквальное «обитающий» здесь звучало бы тяжелее.
theological_decisions:
- issue: Резкое разграничение между «я» и живущим во мне грехом может восприниматься как уклонение от ответственности.
  choice: Сохранить резкое разграничение текста без поясняющего сглаживания.
  alternative: Перефразировать стих так, чтобы подчеркнуть внутренний конфликт или явно оговорить личную ответственность.
  rationale: Греческий текст намеренно формулирует противопоставление резко. Перевод сохраняет эту богословскую напряжённость и не разрешает её посредством толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формулировка близка к структуре греческого текста, но не звучит искусственно; персонификация греха сохранена.
