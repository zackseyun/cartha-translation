  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: ru
  text: Ведь я знаю, что во мне, то есть в моей плоти[a], не живёт ничего доброго. Ведь желание у меня есть, а совершать добро — нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в моей греховной природе».'
    reason: Лексическая альтернатива для σάρξ; основной текст сохраняет буквальное «плоть».
lexical_decisions:
- source_word: οἶδα
  choice: я знаю
  rationale: Перфектная форма имеет настоящее значение; «знаю» — естественный и точный русский эквивалент.
- source_word: οἰκεῖ
  choice: живёт
  rationale: Передаёт образ пребывания внутри и при этом звучит естественнее по-русски, чем более формальное «обитает».
- source_word: ἀγαθόν
  choice: ничего доброго
  rationale: Отрицание οὐ при субстантивированном прилагательном естественно передаётся русской конструкцией «не живёт ничего доброго».
- source_word: σάρξ
  choice: плоть
  rationale: Буквальный термин сохраняет собственную формулировку Павла и её богословскую напряжённость, не подменяя её толкованием «греховная природа».
- source_word: τὸ θέλειν παράκειταί μοι
  choice: желание добра у меня есть
  rationale: Естественно передаёт субстантивированный инфинитив и идею наличия или близости желания; объект «добра» ясен из параллельной второй части и по-русски необходим для плавности.
- source_word: τὸ δὲ κατεργάζεσθαι τὸ καλὸν οὔ
  choice: но совершить добро я не могу
  rationale: Передаёт эллиптическое противопоставление между желанием и осуществлением. Добавление «не могу» раскрывает подразумеваемую невозможность наличного исполнения, однако отмечено сноской как интерпретирующее восполнение.
theological_decisions:
- issue: Значение σάρξ в нравственно окрашенном контексте
  choice: плоть
  alternative: греховная природа
  rationale: «Плоть» сохраняет термин Павла и не разрешает заранее вопрос о точном антропологическом смысле слова.
- issue: Восполнение эллипсиса в последней части стиха
  choice: совершить добро я не могу
  alternative: а совершения добра — нет
  rationale: Основной вариант понятен современному читателю и выражает резкое противопоставление желания и дела; сноска сохраняет более буквальную возможность, поскольку греческое οὔ само по себе эллиптично.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранены павловское понятие «плоть» и противопоставление желания и поступка; синтаксис слегка сглажен для естественности.
