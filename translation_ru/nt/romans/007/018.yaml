  source_fidelity: 'Первая часть передана точно: οἰκεῖ и ἀγαθόν естественно отражены как «не живёт ничего доброго», а пояснительное «то есть в моей плоти» сохраняет аппозицию греческого текста. Однако «я не могу» в конце прямо выражает модальность невозможности, которой в эллиптическом οὔ нет: греческий текст лишь отрицает наличие/доступность «совершать добро». Это интерпретирующее восполнение следует убрать из основного текста.'
