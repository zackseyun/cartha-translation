  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: ru
  text: Ведь грех, получив через заповедь повод[a], обманул меня и через неё[b] убил меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспользовавшись заповедью как поводом».'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «неё» относится к заповеди.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим высказыванием естественным для современного русского языка способом.
- source_word: ἁμαρτία
  choice: грех
  rationale: Сохраняет обычное значение слова и олицетворённую активность греха как субъекта всех действий в стихе.
- source_word: ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς
  choice: воспользовавшись заповедью как поводом
  rationale: Естественно передаёт смысл использования возможности или повода посредством заповеди, не ослабляя активной роли греха.
- source_word: ἐξηπάτησέν με
  choice: обманул меня
  rationale: Ясно передаёт значение глагола; усилительный оттенок приставки не преувеличивается отдельным наречием.
- source_word: δι’ αὐτῆς
  choice: через неё
  rationale: Сохраняет инструментальное значение предлога и местоименную отсылку к заповеди.
- source_word: ἀπέκτεινεν
  choice: убил меня
  rationale: Современное и прямое соответствие; повторение «меня» естественно в русском и проясняет подразумеваемое дополнение второго глагола.
theological_decisions:
- issue: Степень олицетворения греха
  choice: 'Грех представлен активным деятелем: он пользуется поводом, обманывает и убивает.'
  alternative: Передать грех как безличную причину или абстрактное влияние.
  rationale: Греческий текст делает грех грамматическим субъектом последовательных действий; перевод сохраняет эту риторическую и богословскую напряжённость без поясняющей надстройки.
- issue: Роль заповеди
  choice: Заповедь передана как повод и средство, которым воспользовался грех.
  alternative: Сформулировать так, будто сама заповедь непосредственно обманывает и убивает.
  rationale: Субъектом действий остаётся грех, тогда как διὰ с родительным указывает на посредствующую роль заповеди.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет краткость, достоинство и выразительное олицетворение греха. Формулировка «воспользовавшись заповедью как поводом» выбрана ради естественного русского синтаксиса при сохранении инструментального смысла греческого текста.
