  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: ru
  text: Благодарение Богу через Иисуса Мессию, нашего Господа! Итак, я сам умом служу Божьему закону, а плотью[a] — закону греха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «греховной природой» вместо «плотью».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «принципу греха» вместо «закону греха».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Благодарение Богу
  rationale: В этой восклицательной конструкции χάρις с дательным падежом выражает благодарность Богу, а не обозначает благодать как качество или дар.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: через Иисуса Мессию, нашего Господа
  rationale: διά с родительным передано как «через»; Χριστός сохранено как титул «Мессия», а приложение оформлено естественно для русского языка.
- source_word: Ἄρα οὖν
  choice: Итак
  rationale: Кратко и естественно передаёт итогово-выводную функцию сочетания частиц.
- source_word: αὐτὸς ἐγώ
  choice: я сам
  rationale: Сохраняет явное эмфатическое выделение говорящего.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: умом ... а плотью
  rationale: Творительный падеж естественно выражает аспект или средство служения и сохраняет резкое противопоставление νοῦς и σάρξ.
- source_word: δουλεύω
  choice: служу
  rationale: Передаёт подчинённость, не усиливая без необходимости значение до «нахожусь в рабстве»; форма глагола в греческом одна и относится к обеим параллельным частям.
- source_word: νόμῳ θεοῦ
  choice: Божьему закону
  rationale: Сохраняет νόμος как «закон» и естественно передаёт генитив принадлежности.
- source_word: νόμῳ ἁμαρτίας
  choice: закону греха
  rationale: Лексический повтор «закон» сохранён, поскольку он образует намеренный параллелизм с Божьим законом.
- source_word: σαρκί
  choice: плотью
  rationale: Буквальный термин сохраняет павловскую антропологическую и богословскую напряжённость, не подменяя его толкованием «греховная природа».
theological_decisions:
- issue: Значение σάρξ в нравственно окрашенном контексте
  choice: плоть
  alternative: греховная природа
  rationale: Греческий текст употребляет σάρξ, а не явное обозначение греховной природы. «Плоть» сохраняет неоднозначность и противопоставление ума и плоти.
- issue: Значение νόμος в выражении νόμος ἁμαρτίας
  choice: закон греха
  alternative: принцип греха
  rationale: «Закон» сохраняет лексическую связь и контраст с «Божьим законом», тогда как «принцип» уже истолковывает метафору.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сделан компактным; тире во второй части естественно восполняет общий глагол «служу». Маркеры сносок поставлены непосредственно после соответствующего итогового высказывания; обе сноски относятся к выражениям в его второй половине.
