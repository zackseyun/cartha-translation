  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: ru
  text: Ведь я не делаю того доброго, чего хочу, но совершаю именно то злое, чего не хочу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблены два близких по значению глагола: сначала «делаю» (ποιῶ), затем «совершаю» (πράσσω). Оба в данном контексте могут передаваться словом «делаю»; различие между ними не следует понимать как резкое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: хочу
  rationale: Естественно передаёт волеизъявление в современном русском языке, не придавая ему излишне философского оттенка.
- source_word: ποιῶ
  choice: делаю
  rationale: Простое и точное соответствие; позволяет по возможности отразить смену глагола далее в стихе.
- source_word: ἀγαθόν
  choice: того доброго
  rationale: Передаёт субстантивированное прилагательное как нравственную категорию и сохраняет параллель с «то злое».
- source_word: κακὸν
  choice: то злое
  rationale: Сохраняет сильный нравственный контраст с «добрым», не ослабляя его до просто нежелательного или плохого.
- source_word: πράσσω
  choice: совершаю
  rationale: Естественный русский глагол действия, который отличает πράσσω от ποιῶ, не преувеличивая различие их значений.
- source_word: τοῦτο
  choice: то
  rationale: Явно сохраняет указательное местоимение, подчёркивающее именно нежелаемое злое действие.
- source_word: οὐ γὰρ
  choice: ведь ... не
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предшествующим рассуждением.
theological_decisions:
- issue: Следует ли смягчать нравственный контраст между ἀγαθόν и κακόν
  choice: Сохранить прямые нравственные категории «доброе» и «злое».
  alternative: «правильное» и «неправильное» либо «хорошее» и «плохое»
  rationale: Греческие слова выражают весомый нравственный контраст; более слабая лексика могла бы свести его к практической оценке.
- issue: Следует ли уточнять, о каком состоянии говорящего идёт речь
  choice: Не добавлять толкований к первому лицу и внутреннему конфликту.
  alternative: Уточнить в тексте, говорит ли Павел о возрождённом или невозрождённом человеке.
  rationale: Сам стих этого прямо не определяет; перевод должен сохранять богословское напряжение контекста, а не разрешать его вставным толкованием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Порядок частей и повтор относительного оборота сохраняют настойчивый параллелизм оригинала; различие между ποιῶ и πράσσω обозначено без искусственного усиления.
