id: ROM.7.4
reference: Romans 7:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: ru
  text: Итак, братья мои[a], и вы были умерщвлены для Закона посредством тела Мессии[b], чтобы стать принадлежащими другому[c] — тому, кто был воскрешён из мёртвых, — чтобы мы приносили плод Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое «братья» могло служить обращением ко всей общине, включая женщин.
    reason: lexical_alternative
  - marker: b
    text: 'Греч. Χριστός — «Мессия», то есть «Помазанник»; возможно также: «Христос».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «чтобы вы стали другому»; дательный падеж в данном контексте выражает принадлежность. Эти слова продолжают брачную аналогию из предшествующего контекста.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующей аналогии естественным для русского повествования связующим словом.
- source_word: ἀδελφοί μου
  choice: братья мои
  rationale: Сохраняет грамматически мужскую форму прямого обращения; возможный охват смешанной группы отмечен в сноске.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: вы умерли для Закона
  rationale: Русское «были умерщвлены для Закона» формально отражало бы пассив, но звучало бы неестественно. «Умерли для Закона» сохраняет образ смерти и отношение, выраженное дательным падежом, не подменяя его более толковательным «освободились от Закона».
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: через тело Мессии
  rationale: Передаёт инструментально-посредническое значение διά с родительным падежом и сохраняет телесный образ.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет титульный смысл — Помазанник; «Мессия» естественно передаёт его по-русски.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: чтобы принадлежать Другому
  rationale: Ясно и естественно продолжает брачную аналогию, буквально связанную с тем, чтобы «стать другого».
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: Тому, Кто был воскрешён из мёртвых
  rationale: Сохраняет пассивную форму причастия и идентифицирует «Другого» без добавления субъекта воскресения.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: дабы нам приносить плод Богу
  rationale: Сохраняет целевое значение ἵνα, метафору плодоношения и заметную смену лица с «вы» на «мы».
theological_decisions:
- issue: Значение Χριστοῦ в аргументации Павла
  choice: Мессии
  alternative: Христа
  rationale: Титульное «Мессия» сохраняет значение «Помазанник», не вводя дополнительного конфессионального толкования.
- issue: Связь верующих с Законом после смерти через тело Мессии
  choice: умерли для Закона
  alternative: были умерщвлены для Закона
  rationale: Выбран естественный русский оборот, сохраняющий богословски значимый образ прекращения прежней связи с Законом; при этом не используется более интерпретирующее «освободились от Закона».
- issue: Брачная метафора в γενέσθαι ὑμᾶς ἑτέρῳ
  choice: принадлежать Другому
  alternative: стать принадлежащими Другому
  rationale: Формулировка сохраняет переход к иной принадлежности в контексте брачной аналогии, не уточняя сверх текста характер этого союза.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Прописные «Закон», «Другому», «Тому, Кто» помогают обозначить конкретные референты и облегчают чтение; архаизирующее, но понятное «дабы» разграничивает две последовательные целевые конструкции и сохраняет смену «вы» на «мы».
