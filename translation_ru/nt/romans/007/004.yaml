  - severity: low
    issue: Сноска c формулирует буквальный перевод как «чтобы стать Другого».
    rationale: Эта русская конструкция неграмматична и не объясняет, что ἑτέρῳ стоит в дательном и в контексте выражает принадлежность другому.
  - severity: low
    issue: Прописные «Другому» и «Тому, Кто» не отражают различия в греческом тексте.
    rationale: Оригинал не маркирует эти слова прописной буквой; строчное написание сохраняет референтную связь с Мессией, не добавляя типографского толкования.
