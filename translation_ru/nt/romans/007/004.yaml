review_pass:
  verdict: revise
  source_fidelity: В черновике точно переданы выводное «итак», обращение, отношение к Закону, посредническое «через тело Мессии», обе целевые конструкции, воскресение и смена лица с «вы» на «мы». Однако «вы умерли» заменяет аористный пассив ἐθανατώθητε активным/непереходным русским оборотом и тем самым ослабляет существенную грамматическую черту оригинала.
  naturalness: Предлагаемая правка сохраняет современный литературный регистр. «Были умерщвлены для Закона» несколько возвышенно, но ясно и оправданно точностью пассива. Строчные «другому — тому, кто» избегают не обусловленной оригиналом интерпретирующей прописной буквы и выглядят естественнее в современном литературном тексте.
  terminology: «Мессия» правомерно передаёт титульный смысл Χριστός; «Закон» уместен в данном павловом контексте. «Принадлежащими другому» эксплицирует заложенное в греческом дательном отношение принадлежности, не добавляя характера этого отношения. Сноска c должна избегать неестественного и неточного русского псевдобуквального «стать Другого».
