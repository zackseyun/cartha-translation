id: ROM.7.21
reference: Romans 7:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: ru
  text: 'Итак, я обнаруживаю такой закон[a]: когда я хочу делать добро, зло находится рядом со мной.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «закономерность»; или «правило».
    reason: Слово νόμος здесь может обозначать не Моисеев Закон, а действующий принцип или устойчивую закономерность.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: я обнаруживаю
  rationale: Настоящее время передаёт продолжающееся осознание; «обнаруживаю» естественно выражает вывод Павла из описанного им опыта.
- source_word: ἄρα
  choice: итак
  rationale: Слово обозначает вывод из предшествующего рассуждения; «итак» ясно сохраняет эту логическую связь.
- source_word: τὸν νόμον
  choice: такой закон
  rationale: Основной текст сохраняет νόμος как «закон», не устраняя возможную перекличку с другими употреблениями этого слова у Павла. Указательное «такой» естественно вводит последующее пояснение содержания закона.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: когда я хочу делать добро
  rationale: Так передан смысл трудной дательной конструкции без неестественной русской кальки; сохранены желание и направленность на добро.
- source_word: τὸ καλὸν
  choice: добро
  rationale: Субстантивированное прилагательное естественно и точно передаётся русским существительным «добро».
- source_word: τὸ κακὸν
  choice: зло
  rationale: Субстантивированное прилагательное естественно передаётся существительным «зло».
- source_word: παράκειται
  choice: находится рядом со мной
  rationale: Формулировка сохраняет образ чего-то лежащего или присутствующего поблизости, а также повторное ἐμοί, не прибегая к излишне разговорному «тут как тут».
theological_decisions:
- issue: Означает ли νόμον Моисеев Закон или действующую закономерность
  choice: В основном тексте сохранено «закон», а контекстуальное значение закономерности отмечено в сноске.
  alternative: «закономерность» или «правило»
  rationale: Слово νόμος может здесь обозначать наблюдаемую закономерность, однако перевод «закон» сохраняет словесные связи и богословское напряжение в рассуждении Павла, не сводя смысл заранее к одному толкованию.
translation_notes:
  register: Современный литературный русский язык; фраза звучит ясно и достойно. Синтаксически трудная греческая конструкция передана естественным придаточным времени, а неоднозначность слова νόμος сохранена в основном тексте и пояснена сноской.
