  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: ru
  text: Ведь мы знаем, что закон духовен, а я — плотской[a], продан в рабство греху[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из плоти».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «продан под грех», то есть отдан под власть греха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: мы знаем
  rationale: Передаёт устойчивое, разделяемое Павлом и читателями знание прямо и естественно.
- source_word: ὁ νόμος
  choice: закон
  rationale: Сохраняет греческую формулировку, не уточняя в самом тексте сверх необходимого, хотя в контексте Послания речь часто идёт о Моисеевом законе.
- source_word: πνευματικός
  choice: духовен
  rationale: Естественно сохраняет противопоставление закону, относящемуся к духовной сфере, и человеку «из плоти», не вынуждая выбирать более узкое толкование «дан Духом».
- source_word: σάρκινός
  choice: из плоти
  rationale: Передаёт значение прилагательного σάρκινος и сохраняет образ плоти, не подменяя его толкованиями «грешный» или «обладающий греховной природой».
- source_word: πεπραμένος
  choice: продан в рабство
  rationale: Совершенный пассив выражает состояние, наступившее вследствие продажи; добавление «в рабство» делает подразумеваемую метафору продажи человека ясной современному русскому читателю.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: греху
  rationale: В сочетании «продан в рабство греху» естественно выражает подчинение греху, заключённое в греческой конструкции, без расширенного богословского пересказа.
theological_decisions:
- issue: Степень истолкования языка плоти у Павла
  choice: Сохранить в основном тексте выражение «из плоти».
  alternative: «плотский», «грешный», «обладающий греховной природой»
  rationale: Так сохраняются образ и напряжённое противопоставление πνευματικός и σάρκινος, а антропология Павла не сводится к более поздней догматической формуле.
- issue: Сила метафоры подчинения греху
  choice: Передать πεπραμένος как «продан в рабство греху».
  alternative: '«продан греху»; буквально: «продан под грех»'
  rationale: Русская формулировка ясно передаёт метафору рабской продажи и власть греха, не утверждая сверх того, что выражено образом в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная без архаизмов. Тире после «я» подчёркивает греческое противопоставление ἐγὼ δὲ. Образ «плоти» сохранён, а рабская метафора сделана понятной без конфессионально обусловленного толкования.
