id: ROM.7.8
reference: Romans 7:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: ru
  text: Но грех, воспользовавшись представившимся через заповедь случаем[b], породил во мне всякое желание[a], ведь без закона грех мёртв.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «всякого рода желания»; в данном контексте речь прежде всего о желании чужого.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «получив повод через заповедь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν λαβοῦσα
  choice: воспользовавшись… как поводом
  rationale: Передаёт образ греха, который использует заповедь как удобный случай или отправную точку для действия; русская конструкция естественна и сохраняет активный характер причастного оборота.
- source_word: ἡ ἁμαρτία
  choice: грех
  rationale: Сохраняет олицетворение греха как действующей силы без поясняющего истолкования.
- source_word: διὰ τῆς ἐντολῆς
  choice: заповедью
  rationale: Творительный падеж передаёт средство, которым воспользовался грех; единственное число указывает на заповедь, только что приведённую в контексте.
- source_word: κατειργάσατο
  choice: породил
  rationale: Выражает достижение или возникновение результата и хорошо сочетается с олицетворённым грехом.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: всякого рода желания
  rationale: Сохраняет широкое значение ἐπιθυμία и связь с глаголом «желать» в процитированной ранее заповеди; контекстуальный смысл желания чужого отмечен в сноске.
- source_word: χωρὶς γὰρ νόμου
  choice: ведь без закона
  rationale: «Ведь» естественно передаёт пояснительное γάρ, а «без закона» кратко и точно выражает χωρὶς νόμου.
- source_word: νεκρά
  choice: мёртв
  rationale: Сохраняет резкую метафору исходного текста, не заменяя её толкованием вроде «бездействует».
theological_decisions:
- issue: Олицетворение греха и значение выражения «грех мёртв»
  choice: Сохранить грех как действующего субъекта и буквально передать νεκρά словом «мёртв».
  alternative: Представить грех как отвлечённое явление и истолковать «мёртв» как «бездействует».
  rationale: Греческий текст изображает грех действующей силой и оставляет метафору без разъяснения; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным библейского текста синтаксисом. Избегнуто слово «похоть», которое в современной речи часто понимается слишком узко, преимущественно в сексуальном смысле.
