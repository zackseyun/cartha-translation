  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: ru
  text: Ведь замужняя женщина по закону связана с мужем, пока он жив; но если муж умрёт, она освобождена от закона, связывавшего её с мужем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от закона мужа». Вероятно, имеется в виду законная брачная связь, соединявшая её с мужем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: замужняя женщина
  rationale: Сочетание обозначает женщину, состоящую в браке; этот вариант естественно передаёт брачно-правовой смысл.
- source_word: τῷ ζῶντι ἀνδρί
  choice: с мужем, пока он жив
  rationale: Передаёт ключевое для сравнения указание на то, что брачная связь действует при жизни мужа, и звучит естественнее буквального «с живым мужем».
- source_word: δέδεται
  choice: связана
  rationale: Перфект страдательного залога обозначает сохраняющееся состояние, возникшее вследствие установления связи; русская краткая форма точно передаёт этот результат.
- source_word: νόμῳ
  choice: по закону
  rationale: Безартиклевое существительное здесь имеет общий правовой смысл, а не обязательно прямо обозначает Моисеев закон.
- source_word: κατήργηται
  choice: освобождена
  rationale: В данном правовом контексте глагол означает прекращение обязательной силы или освобождение от неё; форма также передаёт результирующее состояние.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: от закона, связывавшего её с мужем
  rationale: Так естественно раскрывается сжатая греческая конструкция и устраняется ошибочное впечатление, будто муж сам установил этот закон; буквальная неоднозначность сохранена в сноске.
theological_decisions:
- issue: Обозначает ли νόμῳ / τοῦ νόμου непосредственно Моисеев закон или общий правовой принцип брака
  choice: правовая норма, связывающая женщину с мужем в браке
  alternative: Моисеев закон в его применении к браку
  rationale: Непосредственный брачный контекст и безартиклевое νόμῳ в первой части стиха благоприятствуют общему правовому смыслу. При этом перевод не отрицает более широкую связь аналогии Павла с Моисеевым законом.
