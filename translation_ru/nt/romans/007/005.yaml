  terminology: «Плоть», «Закон», «греховные страсти», «члены» и «смерть» сохранены как значимые павловские термины. Пояснение к «членам» оставляет как телесный, так и функциональный аспект. Формулировка примечания к «плоти» смягчена, чтобы не превращать образ в исчерпывающую доктринальную формулу.
