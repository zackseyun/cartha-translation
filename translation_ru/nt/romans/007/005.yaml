  to: Ведь когда мы были во плоти[a], греховные страсти, действовавшие через Закон, проявлялись в членах нашего тела[b], чтобы принести плод смерти.
  rationale: Исправление восстанавливает более прямое соответствие ἐν τῇ σαρκί и устраняет стилистически неудачное повторение без изменения смысла, образов или богословской неоднозначности оригинала. Инфинитив «принести» передаёт целевую направленность аориста καρποφορῆσαι; «плод смерти» сохраняет сжатую и намеренно многозначную связь со смертью.
