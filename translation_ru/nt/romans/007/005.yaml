  source_fidelity: 'Основные соответствия сохранены: «греховные страсти» удачно передаёт τὰ παθήματα τῶν ἁμαρτιῶν, «через Закон» сохраняет неоднозначную инструментально-причинную функцию διὰ τοῦ νόμου, а образ плодоношения для смерти не утрачивается. Однако «жили по плоти» переводит не только ἐν τῇ σαρκί («были/находились во плоти»), но и добавляет оттенок образа жизни «по плоти».'
