  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: ru
  text: Ведь когда мы были во плоти[a], греховные страсти, действовавшие через Закон, проявлялись в членах нашего тела[b], чтобы принести плод смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были во плоти». Здесь «плоть» обозначает прежнее человеческое состояние, подверженное греху.'
    reason: alternative_reading
  - marker: b
    text: «Члены» — части и способности тела как орудия действия.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: жили по плоти
  rationale: Русское «были во плоти» обычно означает телесное существование и здесь способно ввести в заблуждение. «Жили по плоти» естественно передаёт состояние и образ жизни в прежнем человеческом порядке, сохраняя ключевой термин «плоть» и его богословское напряжение.
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: греховные страсти
  rationale: Родительный оборот качественно характеризует страсти как связанные с грехом. Такое выражение по-русски яснее и естественнее буквального «страсти грехов».
- source_word: διὰ τοῦ νόμου
  choice: через Закон
  rationale: Сохраняет инструментально-причинную неоднозначность διά и не добавляет более определённого «возбуждённые Законом», которого прямо нет в тексте.
- source_word: ἐνηργεῖτο
  choice: действовали
  rationale: Передаёт продолжительное действие в прошлом; множественное число согласуется с подлежащим «страсти».
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: в членах нашего тела
  rationale: «Члены» сохраняют характерную для Павла образность, а добавление «нашего тела» делает значение понятным современному читателю и не даёт принять слово за обозначение участников сообщества.
- source_word: καρποφορῆσαι τῷ θανάτῳ
  choice: чтобы приносить плод смерти
  rationale: Сохраняет метафору плодоношения и естественно передаёт направленность или результат, связанный со смертью.
theological_decisions:
- issue: Смысл выражения ἐν τῇ σαρκί
  choice: жили по плоти
  alternative: были во плоти; находились во власти греховной природы
  rationale: Выбранный вариант не сводит σάρξ к физическому телу и вместе с тем не заменяет многозначную павловскую метафору готовой антропологической формулой.
- issue: Связь греховных страстей с Законом
  choice: действовавшие через Закон
  alternative: возбуждённые Законом
  rationale: Греческий текст утверждает действие посредством Закона, но не уточняет здесь его механизм. Более сильное «возбуждённые» допустимо по контексту, однако было бы истолковывающим.
- issue: Значение дательного τῷ θανάτῳ
  choice: плод смерти
  alternative: плод для смерти; плод, ведущий к смерти
  rationale: Формулировка сохраняет возможные оттенки принадлежности, результата и направленности, не выбирая один из них чрезмерно однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Павловские образы «плоти», «членов» и «плода» сохранены, но синтаксис сделан понятным обычному читателю.
