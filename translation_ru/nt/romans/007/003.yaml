id: ROM.7.3
reference: Romans 7:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: ru
  text: Итак, пока её муж жив, она будет называться прелюбодейкой, если станет женой другого мужчины[a]. Но если муж умрёт, она свободна от закона[b], так что, став женой другого мужчины, она не является прелюбодейкой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также передачи: «станет принадлежать другому мужчине» или «соединится с другим мужчиной». То же выражение повторяется в конце стиха.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «закон» непосредственно относится к обязательству, связывающему женщину с мужем в браке.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание частиц вводит вывод из предшествующего рассуждения; «итак» естественно и ясно передаёт эту логическую связь.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: пока её муж жив
  rationale: Генитив абсолютный обозначает одновременное обстоятельство. Притяжательное местоимение восполняется из контекста замужней женщины.
- source_word: μοιχαλὶς
  choice: прелюбодейка
  rationale: Существительное прямо обозначает женщину, виновную в супружеской неверности; выбран точный и традиционно понятный русский эквивалент.
- source_word: χρηματίσει
  choice: будет называться
  rationale: В данном контексте глагол означает, что женщину будут называть или считать таковой; формулировка сохраняет будущее время и не вводит внешнего субъекта оценки.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ
  choice: если станет женой другого мужчины
  rationale: Оборот γίνομαι с дательным обозначает вступление в отношение с другим мужчиной. В брачно-правовом контексте это естественно передаётся как «стать женой», а менее определённая форма исходного выражения отмечена в сноске.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: она свободна от закона
  rationale: Перевод сохраняет образ освобождения от связывающего требования и намеренно не заменяет νόμος более узким толкованием в основном тексте.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: поэтому ... она не будет прелюбодейкой
  rationale: Артикулярный инфинитив передаёт следствие освобождения от закона; русская конструкция ясно выражает этот логический результат.
- source_word: γενομένην ἀνδρὶ ἑτέρῳ
  choice: став женой другого мужчины
  rationale: Причастный оборот повторяет ту же перемену брачного статуса; сохранена смысловая последовательность с первым употреблением выражения.
theological_decisions:
- issue: Объём значения νόμος в брачной аналогии
  choice: В основном тексте сохранено «закон», а сноска указывает на непосредственную связь с брачными обязательствами.
  alternative: «брачный закон» или более широкое понимание закона в богословии Павла
  rationale: Ближайший контекст говорит о правовой связи женщины с мужем, однако само слово Павла шире уточняющего перевода «брачный закон». Такой вариант сохраняет формулировку и не снимает возможного более широкого отзвука.
- issue: Характер отношения в γένηται ἀνδρὶ ἑτέρῳ
  choice: «станет женой другого мужчины» с указанием менее определённых вариантов в сноске
  alternative: «будет принадлежать другому мужчине» или «соединится с другим мужчиной»
  rationale: Контекст законного брака после смерти мужа поддерживает брачное понимание, но греческий оборот прямо не содержит слова «жена»; сноска сохраняет эту лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис сделан естественным для широкого читателя; термин «прелюбодейка» сохранён ради точности, а неоднозначность брачного оборота и объёма слова «закон» не скрыта.
