  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: ru
  text: 'Но в членах моего тела я вижу иной закон[a]: он воюет против закона моего ума и берёт меня в плен, отдавая во власть закона греха[b], находящегося в членах моего тела.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принцип» или «сила» — здесь и в других случаях употребления слова «закон» в этом стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «берёт меня в плен в законе греха». Выражение «отдавая во власть» передаёт смысл подчинения его власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: я вижу
  rationale: Простое настоящее время сохраняет живое, непосредственное описание того, что говорящий обнаруживает в себе.
- source_word: ἕτερον
  choice: иной
  rationale: «Иной» естественно передаёт противопоставление ранее упомянутому закону, не усиливая его до полного качественного различия.
- source_word: νόμον / νόμῳ
  choice: закон
  rationale: Повтор одного и того же слова сохраняет риторический рисунок Павла и напряжение между законом ума и законом греха; толкования «принцип» или «сила» вынесены в примечание.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: в членах моего тела
  rationale: Так сохраняется конкретный образ частей тела, а добавление «тела» делает традиционное слово «члены» понятным современному читателю.
- source_word: ἀντιστρατευόμενον
  choice: воюет против
  rationale: Передаёт военную образность исходного глагола ясно и естественно.
- source_word: τοῦ νοός μου
  choice: моего ума
  rationale: «Ум» кратко и непосредственно обозначает здесь внутреннюю способность разуметь и желать, не сводя её только к рассудку.
- source_word: αἰχμαλωτίζοντά με
  choice: берёт меня в плен
  rationale: Сохраняет образ войны и пленения, связанный с предыдущим глаголом.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: отдавая во власть закона греха
  rationale: Русская формулировка естественно выражает подчинение пленника власти закона греха; буквальная конструкция с ἐν отмечена в сноске.
- source_word: ἁμαρτίας
  choice: греха
  rationale: Обычный и точный русский эквивалент в данном контексте.
theological_decisions:
- issue: Передавать ли νόμος как «закон» или истолковывать как «принцип» либо «сила».
  choice: Во всех случаях в основном тексте употреблено слово «закон».
  alternative: Передать одно или несколько употреблений как «принцип» или «сила».
  rationale: Повтор νόμος намеренно связывает и одновременно противопоставляет закон ума и действующий в телесных членах закон греха. Единообразный перевод сохраняет это богословское напряжение, не разрешая его за читателя.
- issue: Как передать ἐν при образе пленения.
  choice: «Берёт меня в плен, отдавая во власть закона греха».
  alternative: 'Буквально: «берёт меня в плен в законе греха»; возможно также «порабощает закону греха».'
  rationale: Выбранная конструкция сохраняет образ пленения и ясно выражает переход под власть закона греха, не превращая сам закон однозначно в орудие пленения.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной военной образности. Выражение «члены моего тела» оставляет конкретную павловскую метафору, но проясняет потенциально устаревшее самостоятельное «члены».
