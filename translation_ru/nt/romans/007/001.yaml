id: ROM.7.1
reference: Romans 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: ru
  text: Или вы не знаете, братья[a], — ведь я говорю тем, кто знает закон, — что закон властвует над человеком, пока тот жив?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Словом «братья» переведено греческое существительное мужского рода во множественном числе; в этом обращении оно, вероятно, включает и женщин среди слушателей Павла.
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: Или
  rationale: Сохраняет связь риторического вопроса с предшествующим рассуждением Павла.
- source_word: ἀγνοεῖτε
  choice: вы не знаете
  rationale: Естественно передаёт риторический вопрос и обращение к общему знанию читателей.
- source_word: ἀδελφοί
  choice: братья
  rationale: Передаёт форму мужского рода во множественном числе; в данном обращении слово, вероятно, охватывает и женщин, что пояснено в сноске.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: ведь я говорю тем, кто знает закон
  rationale: Сохраняет пояснительное значение γάρ и естественно передаёт субстантивированное причастие.
- source_word: νόμον / ὁ νόμος
  choice: закон
  rationale: Не сужает значение до одного лишь Моисеева закона и сохраняет широту греческой формулировки.
- source_word: κυριεύει
  choice: властвует над
  rationale: Передаёт господство и власть, выраженные глаголом κυριεύω, в краткой и понятной русской форме.
- source_word: τοῦ ἀνθρώπου
  choice: над человеком
  rationale: ἄνθρωπος употреблено обобщённо, без указания исключительно на мужчину.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: пока тот жив
  rationale: Естественно передаёт временной предел действия закона и устраняет в русском двусмысленность относительно того, кто жив — закон или человек.
theological_decisions:
- issue: Объём значения νόμος
  choice: Переведено просто как «закон» без уточняющего определения.
  alternative: «Моисеев закон» или «закон как общий правовой принцип»
  rationale: В ближайшем контексте особенно значим Моисеев закон, однако сама формулировка допускает более общее понимание; перевод сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Вставное пояснение выделено парными тире; «властвует над» сохраняет сильный оттенок κυριεύει.
