id: ROM.7.15
reference: Romans 7:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: ru
  text: 'Ведь я не понимаю, что делаю: я поступаю не так, как хочу, а делаю то, что ненавижу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: делаю
  rationale: В данном контексте глагол обозначает то, что человек фактически производит или осуществляет; естественное русское «делаю» сохраняет смысл и связь с последующим противопоставлением.
- source_word: γινώσκω
  choice: понимаю
  rationale: Здесь речь не о простом отсутствии знания о собственном поступке, а о неспособности постичь или признать характер совершаемого; «не понимаю» естественно передаёт контекст.
- source_word: θέλω
  choice: хочу
  rationale: Прямо передаёт волю и намерение говорящего без добавления богословской интерпретации.
- source_word: πράσσω
  choice: совершаю
  rationale: Передаёт практическое осуществление желаемого и позволяет сохранить некоторое лексическое различие между πράσσω и ποιῶ.
- source_word: μισῶ
  choice: ненавижу
  rationale: Точное и стилистически уместное соответствие сильному значению исходного глагола.
- source_word: ποιῶ
  choice: делаю
  rationale: Обычное значение ποιέω; завершает резкое противопоставление между желанием и фактическим действием.
theological_decisions:
- issue: Причинная или пояснительная связь второго γάρ
  choice: двоеточие после «что делаю»
  alternative: «потому что» / «ведь»
  rationale: Второе γάρ поясняет, в чём состоит заявленное непонимание. Двоеточие естественно выражает эту связь по-русски, не усиливая её до однозначно причинной.
- issue: Тождество говорящего и его состояние
  choice: не уточнять
  alternative: добавить указание на возрождённого или невозрождённого человека
  rationale: Сам стих не разрешает этот богословский спор; перевод сохраняет напряжение текста без конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены повтор, контраст между желанием и поступком и различие двух греческих глаголов действия, насколько это естественно по-русски.
