  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: ru
  text: Бедный я человек! Кто избавит меня от этого тела смерти?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «от тела этой смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: бедный
  rationale: В данном возгласе слово выражает глубокое несчастье и мучительное положение; «бедный я человек» естественно и эмоционально звучит по-русски, не сводя смысл к материальной бедности.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Обычный русский эквивалент, здесь относящийся к самому Павлу; пол говорящего уже понятен из формы «бедный».
- source_word: τίς
  choice: кто
  rationale: Вопрос направлен на личного избавителя, поэтому «кто» точно передаёт греческое местоимение.
- source_word: ῥύσεται
  choice: избавит
  rationale: Глагол означает спасение или освобождение от опасности либо тяжёлого состояния; «избавит» естественно сочетается с конструкцией «от» и сохраняет силу вопроса.
- source_word: ἐκ
  choice: от
  rationale: При русском глаголе «избавить» отделение от чего-либо нормативно выражается предлогом «от».
- source_word: σώματος
  choice: тела
  rationale: Сохраняется конкретный телесный образ исходного текста без истолковывающего пересказа.
- source_word: τοῦ θανάτου τούτου
  choice: этого тела смерти
  rationale: Положение указательного местоимения в греческой группе допускает синтаксическую неоднозначность. Основной текст использует естественную русскую конструкцию «это тело смерти», а более буквальное соотнесение «этой» со смертью отмечено в сноске.
theological_decisions:
- issue: Синтаксическое соотнесение указательного местоимения τούτου в заключительной фразе
  choice: этого тела смерти
  alternative: тела этой смерти
  rationale: Основной вариант естественнее по-русски и сохраняет связь тела со смертью, не объясняя богословски природу этой связи. Более формальное и неоднозначное прочтение приведено в сноске.
- issue: Истолкование «тела смерти»
  choice: сохранить образ буквально
  alternative: перефразировать как смертное тело или тело, обречённое на смерть
  rationale: Греческий текст не уточняет, означает ли выражение смертность, власть смерти или иную связь; буквальный образ сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; краткий, напряжённый возглас. Инверсия «Бедный я человек!» передаёт эмоциональную силу и порядок основных элементов греческой фразы, оставаясь естественной и понятной.
