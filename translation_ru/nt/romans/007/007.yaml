revisions:
- from: 'Что же скажем? Неужели закон — грех? Ни в коем случае! Напротив, я не узнал бы греха иначе как через закон. Я не знал бы, что такое covet? Wait Russian. Need exact. "пожелание"? For epithymia and command Exod: не пожелай. Natural: что такое греховное желание? But footnote broader. English footnote mismatched marker on contrary while says coveting. Need all markers. Place after "желания" [a]. Text: Ведь я не знал бы, что такое желание[a], если бы закон не говорил: «Не пожелай». But this could imply all desire. More specific "алчное желание" unnatural. "пожелание чужого" imports object absent in verse but command context. Russian Bible standard похоть is archaic/sexual narrowed. "желание обладать чужим" specific. The noun cognate citation. Let''s craft: "я не знал бы и желания завладеть чужим[a], если бы закон не говорил: «Не пожелай»". Yet Greek no чужим, though Decalogue full citation supplies. Better preserve: "я не знал бы, что такое запретное желание[a]" adds forbidden. Hmm.

