  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: ru
  text: 'Что же скажем? Неужели закон — это грех? Ни в коем случае! Напротив, я не узнал бы греха иначе как через закон. Ведь я не знал бы, что такое пожелание[a], если бы закон не говорил: «Не пожелай».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желание»; слово ἐπιθυμία может обозначать желание вообще, но следующая за ним цитата заповеди поддерживает здесь более конкретный, запретный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν;
  choice: Что же скажем?
  rationale: Сохраняет характерную для Павла риторическую формулу перехода и естественно звучит по-русски.
- source_word: ὁ νόμος ἁμαρτία;
  choice: Неужели закон — это грех?
  rationale: Передаёт вопрос об отождествлении закона с грехом, а не о том, является ли закон лишь греховным.
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Современное и сильное русское отрицание, соответствующее резкости греческой формулы.
- source_word: ἀλλὰ
  choice: Напротив
  rationale: Ясно выражает корректирующее противопоставление после решительного отрицания.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: я не узнал бы греха иначе как через закон
  rationale: Условная форма естественно передаёт контрфактический смысл; «узнал» сохраняет прямую связь с идеей познания.
- source_word: ἐπιθυμίαν
  choice: что значит желать чужого
  rationale: Непосредственная цитата десятой заповеди подсказывает здесь конкретный смысл стремления завладеть принадлежащим другому; сноска сохраняет более широкую лексическую возможность.
- source_word: οὐκ ᾔδειν
  choice: я не знал бы
  rationale: Передаёт значение знания и поддерживает смысловой параллелизм с предыдущей фразой, не стирая полностью различие русских форм «узнал» и «знал».
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Не пожелай
  rationale: Устоявшаяся, краткая и достойная русская формулировка запрета Декалога.
theological_decisions:
- issue: Соотношение закона и греха
  choice: Неужели закон — это грех? Ни в коем случае!
  alternative: Неужели закон греховен?
  rationale: Именное сказуемое в греческом ставит вопрос об отождествлении закона с грехом; перевод не смягчает богословскую остроту вопроса.
- issue: Роль закона в познании греха
  choice: я не узнал бы греха иначе как через закон
  alternative: я узнал грех только через закон
  rationale: Выбранная условная формулировка сохраняет напряжение утверждения Павла, не превращая его в исчерпывающее систематическое учение о всяком возможном знании греха.
translation_notes:
  register: Современный литературный русский язык с достойной библейской интонацией. Избегнуто слово «похоть», которое в современном русском часто имеет преимущественно сексуальный и стилистически устаревший оттенок. Маркер [a] поставлен непосредственно после выражения, к которому относится лексическая сноска.
