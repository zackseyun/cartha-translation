  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: ru
  text: Но если я делаю то, чего не хочу, то признаю, что закон добр.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: Передаёт условное значение εἰ и мягкое противопоставление, выраженное δέ, естественным русским оборотом.
- source_word: ὃ … τοῦτο
  choice: то, чего
  rationale: Соотносительная греческая конструкция естественно передаётся по-русски сочетанием «то, чего» при сохранении смыслового выделения объекта действия.
- source_word: θέλω
  choice: хочу
  rationale: Прямо и современно передаёт внутреннее желание, противопоставленное совершаемому действию.
- source_word: ποιῶ
  choice: делаю
  rationale: Простая форма настоящего времени соответствует прямой формулировке Павла и сохраняет связь с предыдущим контекстом.
- source_word: σύμφημι
  choice: соглашаюсь с
  rationale: Передаёт согласие с оценкой закона; дательный τῷ νόμῳ естественно выражается конструкцией «с законом».
- source_word: τῷ νόμῳ
  choice: с законом
  rationale: Определённость понятна из контекста; строчная буква не превращает слово в стилизованное собственное название.
- source_word: καλός
  choice: добр
  rationale: Кратко передаёт положительное нравственное качество закона и естественно согласуется с существительным мужского рода «закон».
theological_decisions:
- issue: Подразумевает ли высказывание положительную оценку самого закона
  choice: «соглашаюсь с законом, что он добр»
  alternative: «признаю, что закон хорош»
  rationale: 'Выбранный вариант сохраняет структуру исходного текста: говорящий соглашается с законом и признаёт его добрым, не снимая напряжения между добротой закона и собственным действием.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Сохранены условность, личное признание говорящего и положительная оценка закона без конфессионального уточнения его природы.
