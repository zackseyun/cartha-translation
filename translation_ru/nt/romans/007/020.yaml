  source_fidelity: Перевод точно передаёт условно-противительное εἰ δέ («Но если»), соотносительную конструкцию «делаю то, чего не хочу», значение οὐκέτι («уже не») и противопоставление между «я» и грехом, пребывающим во мне. «Совершаю это» адекватно передаёт κατεργάζομαι αὐτό, не смешивая его полностью с предшествующим ποιῶ.
  naturalness: Фраза звучит естественно и литературно на современном русском. Повтор «то» в «Но если… то…» нормативен и ясно оформляет условное предложение. Порядок слов «живущий во мне грех» плавный и сохраняет образ персонифицированного греха.
  terminology: «Грех» — точное соответствие ἁμαρτία; добавления вроде «греховная природа» отсутствуют. «Живущий во мне» удачно передаёт οἰκοῦσα ἐν ἐμοί без богословского истолкования сверх текста.
