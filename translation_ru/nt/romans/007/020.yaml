source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: ru
  text: Но если я делаю то, чего не хочу, то уже не я совершаю это, а живущий во мне грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: Передаёт условие и мягкое противопоставление, продолжая ход рассуждения Павла.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: я делаю то, чего не хочу
  rationale: Естественно по-русски передаёт соотносительную конструкцию и сохраняет прямое значение ποιῶ.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: то уже не я совершаю это
  rationale: «Уже не» передаёт οὐκέτι, явное «я» сохраняет смысловое ударение, а «совершаю» отличает κατεργάζομαι от предшествующего ποιῶ без неестественной тяжеловесности.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: живущий во мне грех
  rationale: Сохраняет образ греха как обитающего внутри и не подменяет ἁμαρτία выражениями вроде «греховная природа».
theological_decisions:
- issue: Соотношение личной ответственности говорящего и действующего в нём греха
  choice: Сохранить прямое противопоставление «не я… а живущий во мне грех».
  alternative: Пояснительно перефразировать так, чтобы ослабить личную ответственность или представить грех лишь как безличную склонность.
  rationale: Греческий текст намеренно сохраняет напряжение между «я» и обитающим в человеке грехом; перевод не должен разрешать этот богословский спор за читателя.
translation_notes:
  register: Современный литературный русский; синтаксис ясный и достойный, без архаизмов. «Живущий» естественнее в данном контексте, чем более буквальное, но стилистически тяжёлое «обитающий».
