id: ROM.7.13
reference: Romans 7:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: ru
  text: Так неужели доброе стало для меня смертью? Ни в коем случае! Нет, грех — чтобы он проявился как грех — производя мне смерть посредством доброго, сделал это, чтобы через заповедь грех стал безмерно греховным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: доброе
  rationale: Субстантивированное прилагательное среднего рода передано естественно и сохраняет связь с доброй заповедью из контекста.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: стало для меня смертью
  rationale: Сохранены дательный личной отнесённости и предикативная конструкция γίνομαι с θάνατος без причинной конкретизации.
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Сильное и современное русское отрицание, соответствующее резкому риторическому возражению Павла.
- source_word: ἡ ἁμαρτία
  choice: грех
  rationale: Сохраняется абстрактное значение и олицетворённая действующая роль греха.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: чтобы обнаружилось, что он грех
  rationale: Передаёт эллиптическую предикативную конструкцию и поясняет местоименную отсылку, не добавляя богословского толкования.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: посредством доброго
  rationale: Инструментальное διά и повтор substantivированного ἀγαθός сохранены.
- source_word: μοι κατεργαζομένη θάνατον
  choice: производил во мне смерть
  rationale: Передана результативная сила κατεργάζομαι; «во мне» естественно выражает личную затронутость и согласуется с контекстом.
- source_word: ἵνα γένηται
  choice: чтобы ... стал
  rationale: Сохранена вторая целевая конструкция и глагол становления.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: безмерно греховным
  rationale: Русское наречие ясно передаёт значение чрезмерной степени, сохраняя намеренно повторяющуюся игру «грех — греховный».
- source_word: διὰ τῆς ἐντολῆς
  choice: через заповедь
  rationale: Сохраняются инструментальная конструкция и традиционно понятное в данном контексте значение ἐντολή.
theological_decisions:
- issue: Защита доброты заповеди и субъект, производящий смерть
  choice: Смерть производит грех, действующий посредством доброго; доброе само не объявляется виновной причиной смерти.
  alternative: Можно было бы перестроить фразу так, что заповедь непосредственно «причинила» смерть, однако это размыло бы противопоставление греческого текста.
  rationale: 'После решительного μὴ γένοιτο подлежащим подразумеваемой конструкции становится ἡ ἁμαρτία; синтаксис возлагает действующую ответственность на грех, сохраняя напряжение: он использует доброе как средство.'
- issue: Оттенок двух конструкций ἵνα
  choice: Обе переданы целевым «чтобы», без сведения их исключительно к результату.
  alternative: 'Обе конструкции можно понимать и передавать более результативно: «так что» или «и тем самым».'
  rationale: ἵνα допускает контекстуальные целевые и результативные оттенки; буквальная целевая форма сохраняет формальную структуру и не определяет сверх текста, чья именно цель имеется в виду.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической силой. Синтаксис слегка сглажен тире, чтобы ясно обозначить контраст «не доброе, но грех», при этом сохранены повторения «грех / греховным» и обе конструкции «чтобы».
