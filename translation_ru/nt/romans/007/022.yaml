lexical_decisions:
- source_word: συνήδομαι
  choice: нахожу радость в
  rationale: Передаёт радостное одобрение и внутреннее согласие, а не только интеллектуальное признание; оборот естественен для современного русского языка.
- source_word: νόμῳ τοῦ θεοῦ
  choice: в Божьем законе
  rationale: «Закон» сохраняет устойчивое и богословски весомое значение νόμος у Павла; притяжательная конструкция естественна по-русски и точно передаёт τοῦ θεοῦ.
- source_word: κατὰ τὸν ἔσω ἄνθρωπον
  choice: по внутреннему человеку
  rationale: Близко передаёт значение κατά («согласно», «со стороны», «в отношении») и сохраняет характерный павловский образ «внутреннего человека», не добавляя отсутствующего в греческом местоимения «моему».
theological_decisions:
- issue: Антропологический смысл выражения «внутренний человек»
  choice: Сохранён образ «по внутреннему человеку» без его доктринального уточнения.
  alternative: «в глубине души»; «внутренним своим существом»
  rationale: Греческое выражение обозначает внутреннюю сторону личности, но само по себе не формулирует техническую модель состава человека. Буквенно-образная передача сохраняет богословскую напряжённость и связь с павловским словоупотреблением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «по внутреннему человеку я» позволяет яснее отнести оборот к субъекту и не создать впечатления, будто речь идёт о некой внутренней части закона.
