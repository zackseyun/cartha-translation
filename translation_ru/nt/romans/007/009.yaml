  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: ru
  text: Я некогда был жив без закона, но когда пришла заповедь, грех ожил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грех снова ожил».'
    reason: Лексема ἀναζάω допускает как общее значение оживания, так и более явный оттенок возвращения к жизни.
lexical_decisions:
- source_word: ἔζων
  choice: был жив
  rationale: Передаёт состояние жизни и сохраняет контраст жизни и смерти, развиваемый в ближайшем контексте, точнее, чем простое «жил».
- source_word: χωρὶς νόμου
  choice: без закона
  rationale: Естественно передаёт отделительное значение χωρίς и не уточняет сверх текста, идёт ли речь исключительно о Моисеевом законе.
- source_word: ποτέ
  choice: некогда
  rationale: Кратко и литературно передаёт отнесённость к прежнему времени.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: когда пришла заповедь
  rationale: Естественная русская временная конструкция, сохраняющая событийный образ прихода заповеди.
- source_word: ἐντολῆς
  choice: заповедь
  rationale: Соответствует библейскому контексту и ясно отличается от более широкого понятия закона.
- source_word: ἁμαρτία
  choice: грех
  rationale: Сохраняет единственное число и олицетворение греха у Павла.
- source_word: ἀνέζησεν
  choice: ожил
  rationale: Передаёт образ ожившего, олицетворённого греха; возможный оттенок повторного оживания отмечен в сноске.
theological_decisions:
- issue: Следует ли прямо определить слова Павла как автобиографические, представительные или относящиеся к истории спасения
  choice: Сохранено простое высказывание от первого лица без поясняющего расширения.
  alternative: Истолковать «я» исключительно как самого Павла либо как представителя Израиля или человечества.
  rationale: Сам греческий текст этого стиха не разрешает данный вопрос, поэтому перевод сохраняет его богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Строчная буква в слове «закон» не навязывает читателю более узкое толкование, чем позволяет данный стих.
