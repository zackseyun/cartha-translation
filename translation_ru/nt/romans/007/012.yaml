id: ROM.7.12
reference: Romans 7:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: ru
  text: Итак, закон свят, и заповедь свята, праведна и добра.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка связующим словом.
- source_word: νόμος
  choice: закон
  rationale: Сохраняет формулировку Павла без излишнего уточнения; в контексте речь идёт о Моисеевом законе.
- source_word: ἅγιος / ἁγία
  choice: свят / свята
  rationale: Стандартно передаёт святость как принадлежность Богу и нравственную чистоту; согласование отражает разные роды русских существительных.
- source_word: ἐντολή
  choice: заповедь
  rationale: Естественное библейское обозначение конкретного предписания внутри закона.
- source_word: δικαία
  choice: праведна
  rationale: Сохраняет нравственно-богословскую характеристику заповеди и лексическую связь с темой праведности у Павла.
- source_word: ἀγαθή
  choice: добра
  rationale: Кратко сохраняет значение нравственной благости, не исключая благотворного характера заповеди.
- source_word: μὲν
  choice: не выражено отдельно
  rationale: Частица придаёт лёгкий акцент, но при отсутствии соответствующего δέ её отдельная передача по-русски была бы тяжеловесной.
theological_decisions:
- issue: Объём значения νόμος
  choice: закон
  alternative: Закон
  rationale: Строчная буква сохраняет подлинную формальную неоднозначность и не навязывает графически более узкое толкование, хотя контекст указывает на Моисеев закон.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и ясная формулировка. Параллелизм и тройная характеристика заповеди сохранены.
