revisions:
- from: Ведь, умерев, Он умер для греха раз и навсегда[a], а живя, живёт для Бога.
  to: Ведь Он умер для греха[a] раз и навсегда, а живёт Он для Бога.
  rationale: Устранены неестественные деепричастные повторы и исправлена пунктуация. Повтор «Он ... Он» передаёт противопоставление между смертью и жизнью, не навязывая спорного толкования относительных конструкций. Маркер сноски перенесён к неоднозначному выражению «для греха»; параллелизм «для греха / для Бога» сохранён.
  reviewer_model: gpt-5.6-terra
