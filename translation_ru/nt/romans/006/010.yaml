  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: ru
  text: Ведь Он умер для греха[a] раз и навсегда, а живёт Он для Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умер за грех»; или: «умер по отношению к греху».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: Ведь, умерев
  rationale: Нейтральное ὃ с повторённым глаголом образует идиоматическую конструкцию со значением «в том, что Он умер»; русский деепричастный оборот естественно передаёт событие смерти, а «ведь» сохраняет пояснительную функцию γάρ.
- source_word: τῇ ἁμαρτίᾳ
  choice: для греха
  rationale: Дательный падеж выражает отношение к греху. Формулировка сохраняет параллель с «для Бога» и не уточняет сверх текста, означает ли это «по отношению к греху» или «ради греха».
- source_word: ἀπέθανεν
  choice: умер
  rationale: Аорист обозначает завершившееся событие смерти и естественно передаётся русским прошедшим временем совершенного вида.
- source_word: ἐφάπαξ
  choice: раз и навсегда
  rationale: Передаёт однократность и окончательный, неповторимый характер действия.
- source_word: ὃ δὲ ζῇ
  choice: а живя, живёт
  rationale: Русская конструкция передаёт симметрию идиоматического греческого оборота и противопоставление смерти и жизни без неестественного буквального «что живёт».
- source_word: τῷ θεῷ
  choice: для Бога
  rationale: Дательный выражает направленность и отношение; перевод сохраняет формальную параллель с τῇ ἁμαρτίᾳ.
theological_decisions:
- issue: Может ли τῇ ἁμαρτίᾳ быть понято как указание на личный грех Христа
  choice: умер для греха
  alternative: умер за грех; умер по отношению к греху
  rationale: Основной текст сохраняет краткость и противопоставление «для греха / для Бога», не приписывая Христу личного греха и не сводя неоднозначный дательный падеж только к жертвенному значению.
translation_notes:
  register: Современный литературный русский язык; сдержанный, возвышенный библейский регистр. Местоимение «Он» написано с прописной буквы как ясная отсылка ко Христу. Деепричастные обороты позволяют естественно сохранить параллелизм двух греческих относительных конструкций.
