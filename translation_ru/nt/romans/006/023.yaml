id: ROM.6.23
reference: Romans 6:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: ru
  text: Ведь плата за грех — смерть, а дар[a] Бога — вечная жизнь в Мессии Иисусе, нашем Господе.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар благодати».'
    reason: Лексема χάρισμα подчёркивает, что дар исходит из благодати.
  - marker: b
    text: 'Традиционно: «во Христе Иисусе, нашем Господе».'
    reason: Сноска указывает традиционную передачу титула Χριστός и помогает соотнести формулировку со знакомой церковной лексикой.
lexical_decisions:
- source_word: ὀψώνια
  choice: плата
  rationale: Слово обозначает выдаваемое содержание или жалованье, а в данном контексте — заработанную плату. «Плата» естественно передаёт противопоставление заслуженного воздаяния незаслуженному дару.
- source_word: τῆς ἁμαρτίας
  choice: за грех
  rationale: Краткая русская конструкция сохраняет связь платы с грехом, не уточняя сверх текста, мыслится ли грех как тот, кто платит, или как основание воздаяния.
- source_word: θάνατος
  choice: смерть
  rationale: Прямой эквивалент сохраняет как обычный смысл слова, так и его богословскую весомость, не конкретизируя в основном тексте вид смерти.
- source_word: χάρισμα
  choice: дар
  rationale: «Дар» звучит естественно и ясно противопоставлен заработанной плате; присущий слову оттенок благодати отмечен в сноске.
- source_word: ζωὴ αἰώνιος
  choice: вечная жизнь
  rationale: Устойчивое и точное русское соответствие, передающее длительность и богословский смысл выражения.
- source_word: ἐν
  choice: в
  rationale: Сохранён пространственно-сферический предлог Павла, чтобы не сводить выражение лишь к орудию или посредничеству.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Χριστός передан как титул «Мессия», а не как ставшее непрозрачным имя; падеж обусловлен предлогом «в».
- source_word: κυρίῳ
  choice: Господе
  rationale: «Господь» сохраняет исповедальное и богословское значение κύριος и естественно звучит в современном литературном русском.
theological_decisions:
- issue: Значение ἐν Χριστῷ Ἰησοῦ
  choice: «в Мессии Иисусе»
  alternative: «через Мессию Иисуса»
  rationale: Греческое ἐν естественнее обозначает сферу или единение с Мессией, а не только посредничество. Буквальное «в» сохраняет богословскую многозначность.
- issue: Передача Χριστός
  choice: «Мессия» как титул
  alternative: «Христос» как традиционная транслитерация
  rationale: В данном сочетании титульный смысл остаётся значимым; сноска даёт читателю традиционную форму, не подменяя ею смысл основного текста.
translation_notes:
  register: Современный литературный русский с ясным ритмическим противопоставлением двух частей. Тире перед именными сказуемыми делает афористическую структуру стиха прозрачной. «Ведь» естественно передаёт пояснительное γάρ в связи с предыдущей мыслью; «Бога» выбрано вместо более приподнятого «Божий», чтобы сохранить современную нейтрально-достоинную речь.
