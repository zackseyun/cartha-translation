source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: ru
  text: И не отдавайте части своего тела греху как оружие неправедности[a], но отдайте себя Богу, как живых из мёртвых, и части своего тела — Богу как оружие праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «орудия неправедности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: не предоставляйте / предоставьте
  rationale: «Предоставлять» естественно передаёт помещение себя или своего тела в чьё-либо распоряжение и сохраняет повтор одного греческого глагола; различие вида императивов отражено формами «не предоставляйте» и «предоставьте».
- source_word: μέλη
  choice: части вашего тела
  rationale: В данном контексте речь идёт о частях тела, посредством которых человек действует. Это яснее для современного читателя, чем буквальное, но устаревающее «члены».
- source_word: ὅπλα
  choice: оружие
  rationale: Слово может обозначать оружие или более широко орудия; «оружие» сохраняет яркий образ борьбы, а более широкая возможность отмечена в сноске.
- source_word: ἀδικίας
  choice: неправедности
  rationale: «Неправедность» сохраняет нравственно-богословское значение и образует точную смысловую пару с «праведностью».
- source_word: ἁμαρτίᾳ
  choice: греху
  rationale: Прямой перевод сохраняет олицетворение греха в контексте главы, не раскрывая его добавочным толкованием как «власть греха».
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: как оживших из мёртвых
  rationale: Фраза сохраняет сравнительное «как» и контраст смерти и жизни, оставаясь естественной по-русски. «Оживших» передаёт состояние живых после пребывания среди мёртвых, не уточняя сверх текста способ оживления.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: В этом нравственно-богословском противопоставлении «праведность» естественно соответствует «неправедности»; возможное значение «справедливость» сохранено в сноске.
theological_decisions:
- issue: Противопоставление греха и Бога как тех, в чьё распоряжение человек отдаёт себя
  choice: Сохранены прямые отношения «греху» и «Богу» без поясняющего добавления «на служение».
  alternative: «Не отдавайте ... на служение греху, но отдайте ... на служение Богу».
  rationale: Дательный падеж и глагол уже передают направленность и подчинение; эксплицитное «на служение» излишне разрешало бы образ.
- issue: Воскресный образ в выражении ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: «как оживших из мёртвых»
  alternative: «как живых среди мёртвых» или «как воскрешённых из мёртвых»
  rationale: Выбранный вариант сохраняет воскресную направленность образа, но не вводит отсутствующий в греческом тексте глагол «воскресить» и не превращает ἐκ («из») в «среди».
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Повтор «предоставляйте / предоставьте» и «части вашего тела» намеренно сохранён ради структуры противопоставления. Маркеры сносок поставлены непосредственно после слов, к которым относятся варианты.
