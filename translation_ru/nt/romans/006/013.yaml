review_pass:
  verdict: revise
  source_fidelity: Фраза «как оживших из мёртвых» передаёт воскресный контекст, но «оживших» выражает становление живыми, тогда как ζῶντας прямо характеризует адресатов как живых. Более точное «как живых из мёртвых» сохраняет эллиптическую, воскресно окрашенную формулу оригинала без добавления способа или момента оживления. Глагольный контраст передан приемлемо, однако «отдавать» естественнее в русском при значении предоставления в чьё-либо распоряжение.
  naturalness: «Части вашего тела» — ясное современное выражение, но притяжательное «вашего» лучше заменить на естественное «своего». «Отдавайте / отдайте» звучит более идиоматично и сохраняет намеренный контраст императивов. Формула «как живых из мёртвых» несколько приподнята, но уместна для современного литературного библейского регистра и точнее, чем «оживших».
  terminology: «Греху», «Богу», «оружие», «неправедности» и «праведности» адекватно отражают текст и его образный строй. Сноска к ὅπλα должна давать множественное «орудия», поскольку греческое ὅπλα стоит во множественном числе; вариант «справедливости» для δικαιοσύνη уместен.
  issues:
