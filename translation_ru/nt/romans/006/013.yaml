    issue: «Оживших» вместо ζῶντας
    rationale: Оригинал имеет причастие настоящего времени «живущих/живых», а не причастие со значением «оживших». Хотя контекст воскресный, переводу не следует превращать характеристику состояния в утверждение о событии.
  - severity: low
    issue: Сноска a употребляет единственное число «орудие»
    rationale: 'Лексическая альтернатива должна согласовываться с множественным числом греческого ὅπλα и с обозначаемыми «частями тела»: «орудия неправедности».'
