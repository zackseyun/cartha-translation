id: ROM.6.19
reference: Romans 6:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: ru
  text: Я говорю по-человечески из-за слабости вашей плоти[a]. Ведь как вы отдали части вашего тела в рабство нечистоте и беззаконию — к беззаконию, так и теперь отдайте части вашего тела в рабство праведности[b] — к освящению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «вашей греховной природы»; однако греческое выражение шире.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Я говорю по-человечески
  rationale: Передаёт идиому как речь, приспособленную к обычному человеческому пониманию, не сужая её до значения «привожу человеческую аналогию».
- source_word: ἀσθένειαν
  choice: немощи
  rationale: Сохраняет широкое значение слабости и ограниченности; в данном контексте звучит естественно и достойно.
- source_word: σάρξ
  choice: плоть
  rationale: Сохраняет широту греческого слова и не сводит выражение заранее к более узкому толкованию «греховная природа».
- source_word: παρεστήσατε / παραστήσατε
  choice: отдавали / отдайте
  rationale: Повтор одного русского глагола воспроизводит связь между прежним поведением и нынешним призывом; сочетание «отдать в рабство» естественно передаёт направленность действия.
- source_word: μέλη
  choice: члены своего тела
  rationale: Уточнение «тела» делает павловское «члены» понятным современному читателю, сохраняя указание на телесные способности и действия человека.
- source_word: δοῦλα
  choice: в рабство
  rationale: Сохраняет сильный образ рабской подчинённости, центральный для контекста Рим 6, а не ослабляет его до простого служения.
- source_word: ἀκαθαρσίᾳ
  choice: нечистоте
  rationale: Традиционное и понятное обозначение нравственной нечистоты.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: беззаконию / к беззаконию
  rationale: Сохраняет намеренный лексический повтор и мысль о том, что беззаконие порождает дальнейшее беззаконие.
- source_word: εἰς τὴν ἀνομίαν
  choice: что вело к беззаконию
  rationale: Естественно выражает направленность или результат εἰς, не устраняя возможной смысловой связи со всем предшествующим действием.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: Лучше всего соответствует этическому противопоставлению нечистоте и беззаконию; возможное значение «справедливость» сохранено в сноске.
- source_word: εἰς ἁγιασμόν
  choice: что ведёт к освящению
  rationale: 'Передаёт направленность и результат: подчинение праведности приводит к процессу и состоянию освящения.'
theological_decisions:
- issue: Значение σάρξ в выражении διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν
  choice: плоть
  alternative: греховная природа
  rationale: Контекст допускает мысль о человеческой подверженности греху, однако греческое слово остаётся шире и может охватывать человеческую немощь в телесном, падшем существовании. Основной текст не разрешает эту напряжённость истолковательным переводом.
- issue: Значение δικαιοσύνη в этическом противопоставлении
  choice: праведность
  alternative: справедливость
  rationale: В контексте призыва к новой жизни «праведность» естественно противопоставлена нечистоте и беззаконию. «Справедливость» лексически возможна, но здесь менее полно передаёт павловскую этическую категорию.
- issue: Сила метафоры δοῦλα
  choice: в рабство
  alternative: на служение
  rationale: Образ господства и принадлежности составляет основу рассуждения в Рим 6; ослабление до «служения» уменьшило бы богословскую и риторическую силу текста.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Немощь», «плоть», «праведность» и «освящение» сохранены как понятные богословские термины; синтаксис сделан плавным для чтения вслух. Маркеры сносок согласованы с теми словами, к которым относятся: [a] — к «плоти», [b] — к «праведности».'
