id: ROM.6.9
reference: Romans 6:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: ru
  text: зная, что Мессия[a], будучи воскрешён из мёртвых, уже не умирает; смерть больше не господствует над ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастие сохраняет форму причастия исходного текста и связывает этот стих с предшествующим рассуждением, не уточняя причинное значение сверх выраженного по-гречески.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Здесь Χριστός сохраняет смысл титула Помазанника; «Мессия» естественно передаёт этот титул по-русски. В сноске дан традиционный вариант «Христос».
- source_word: ἐγερθεὶς
  choice: будучи воскрешён
  rationale: Переданы страдательный залог и действие, предшествующее утверждению «уже не умирает», без превращения воскресения в действие самого субъекта.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устойчивое и точное русское соответствие выражению о воскресении из среды умерших.
- source_word: οὐκέτι
  choice: уже не / больше не
  rationale: Два естественных русских соответствия в разных синтаксических окружениях передают прекращение прежнего положения и окончательность утверждения.
- source_word: ἀποθνῄσκει
  choice: умирает
  rationale: 'Настоящее время передано настоящим временем и выражает неизменную реальность: Мессия более не подвержен смерти.'
- source_word: θάνατος
  choice: смерть
  rationale: Прямое соответствие сохраняет олицетворение смерти как действующей власти.
- source_word: κυριεύει
  choice: господствует над
  rationale: Выражение передаёт власть и владычество смерти, сохраняя сильный образ Павла и оставаясь понятным современному читателю.
theological_decisions:
- issue: Передача Χριστός в посланиях Павла
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово можно понимать как значимый титул, а не только как ставшую именем форму. Основной текст передаёт смысл титула, при этом традиционное чтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Синтаксис по возможности сохраняет структуру греческого предложения; точка с запятой подчёркивает тесную связь двух утверждений. Местоимение «ним» оставлено со строчной буквы согласно обычным правилам современного русского языка.
