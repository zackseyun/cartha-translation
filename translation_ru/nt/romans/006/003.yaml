  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: ru
  text: Или вы не знаете, что все мы были крещены в Мессию Иисуса — были крещены в Его смерть?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа Иисуса». Греч. Χριστὸν Ἰησοῦν.'
    reason: Лексический вариант передачи титула Χριστός.
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Сохраняет связь риторического вопроса с предыдущим рассуждением Павла.
- source_word: ἀγνοεῖτε
  choice: вы не знаете
  rationale: Естественно передаёт риторический вопрос настоящего времени и обращение к общему знанию читателей.
- source_word: ὅσοι
  choice: все мы, ...-ся
  rationale: Передаёт полный охват выражения в сочетании с формой первого лица множественного числа.
- source_word: ἐβαπτίσθημεν
  choice: крестившиеся / крестились
  rationale: Обычная русская библейская формулировка передаёт совершившееся событие, не добавляя конфессионального толкования крещения.
- source_word: εἰς
  choice: в
  rationale: Прямое русское соответствие в оборотах «креститься в Мессию» и «в Его смерть» сохраняет образ приобщения, не уточняя его богословский механизм.
- source_word: Χριστὸν Ἰησοῦν
  choice: Мессию Иисуса
  rationale: Передаёт Χριστός как титул «Мессия», сохраняя греческий порядок слов.
- source_word: τὸν θάνατον αὐτοῦ
  choice: Его смерть
  rationale: Кратко и точно передаёт существительное с притяжательным местоимением.
theological_decisions:
- issue: 'Значение εἰς в языке крещения: действенное сакраментальное приобщение, символическое отождествление или иной вид единения.'
  choice: Оба употребления εἰς переведены предлогом «в».
  alternative: «для единения с»; «по отношению к»
  rationale: Формулировка «креститься в» сохраняет сильный образ направленности и приобщения в греческом тексте, не закрепляя одну конфессиональную модель.
- issue: Передача Χριστός как титула или традиционного именования.
  choice: «Мессия Иисус» в соответствующих падежных формах.
  alternative: «Христос Иисус»
  rationale: «Мессия» раскрывает титульное значение Χριστός; сноска сохраняет знакомый традиционный вариант.
translation_notes:
  register: 'Современный литературный русский язык с достоинством новозаветного обращения. Синтаксис сделан естественным для русского: причастный оборот избегает тяжеловесного «все из нас, которые», а повтор глагола сохраняет риторический параллелизм оригинала.'
