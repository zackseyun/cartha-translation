id: ROM.6.2
reference: Romans 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: ru
  text: Ни в коем случае! Мы умерли для греха — как же нам и дальше жить в нём?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да не будет этого!» — сильное выражение решительного отрицания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Сильное идиоматическое отрицание, естественное для современного русского языка и передающее резкое неприятие высказанной мысли.
- source_word: οἵτινες
  choice: Мы
  rationale: 'Местоимение характеризует тех же людей, к которым Павел относит себя; по-русски связь естественно выражается двумя смежными предложениями: «Мы умерли…».'
- source_word: ἀπεθάνομεν
  choice: умерли
  rationale: Аорист обозначает совершившийся факт; простое прошедшее время сохраняет краткость и категоричность исходного образа.
- source_word: τῇ ἁμαρτίᾳ
  choice: для греха
  rationale: Дательный при глаголе «умирать» выражает отношение к греху. Формула «умерли для греха» сохраняет метафору, не сводя её к пояснительному пересказу.
- source_word: πῶς ἔτι
  choice: как же нам и дальше
  rationale: «Как же» передаёт риторическое недоумение, а «и дальше» — временной смысл ἔτι, то есть продолжение прежней жизни.
- source_word: ζήσομεν
  choice: жить
  rationale: Будущее изъявительное имеет здесь риторическую силу; русская конструкция «как же нам… жить» естественно передаёт этот смысл.
- source_word: ἐν αὐτῇ
  choice: в нём
  rationale: Местоимение отсылает к слову «грех» и сохраняет представление о грехе как сфере существования.
theological_decisions:
- issue: Описывает ли «умерли для греха» постепенное нравственное улучшение или решительный разрыв с властью греха
  choice: Сохранена прямая метафора «умерли для греха» без её догматического истолкования.
  alternative: «стали невосприимчивы к греху» или «отвернулись от греха»
  rationale: Греческий текст непосредственно говорит о смерти по отношению к греху. Сохранение метафоры удерживает богословское напряжение и не уточняет механизм освящения сверх сказанного.
translation_notes:
  register: Современный литературный русский язык; энергичная риторика Павла сохранена без архаизации. «Ни в коем случае» звучит естественно и резко, а «и дальше жить в нём» ясно передаёт продолжительное пребывание в сфере греха.
