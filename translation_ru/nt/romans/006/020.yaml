  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: ru
  text: Ведь когда вы были рабами греха, вы были свободны в отношении праведности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были свободны от праведности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: рабами
  rationale: Передаёт реальную зависимость и сохраняет ключевой для Рим. 6 контраст двух видов рабства; более мягкое «слугами» ослабило бы образ.
- source_word: ἁμαρτίας
  choice: греха
  rationale: 'Родительный падеж естественно выражает принадлежность и власть: грех представлен как господин рабов.'
- source_word: ἐλεύθεροι
  choice: свободны
  rationale: Сохраняет резкую и намеренно парадоксальную формулировку Павла.
- source_word: τῇ δικαιοσύνῃ
  choice: по отношению к праведности
  rationale: Передаёт дательный отношения и не создаёт впечатления, будто праведность сама была угнетающей силой.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: В данном контексте Павла «праведность» точнее передаёт нравственно-богословский смысл, чем «справедливость».
- source_word: γὰρ
  choice: ведь
  rationale: Естественно по-русски сохраняет пояснительную связь с предшествующим рассуждением.
theological_decisions:
- issue: Как выразить отношение прежнего состояния к праведности
  choice: вы были свободны по отношению к праведности
  alternative: вы были свободны от праведности
  rationale: Основной вариант сохраняет напряжение греческого текста, но не представляет праведность как порабощающую силу; более буквальная трактовка отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка лаконична и достойна, а образ рабства сохранён без смягчения.
