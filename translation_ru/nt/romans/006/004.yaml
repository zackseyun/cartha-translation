id: ROM.6.4
reference: Romans 6:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: ru
  text: Итак, мы были погребены вместе с Ним через крещение в смерть, чтобы, как Мессия[a] был воскрешён из мёртвых славой Отца, так и мы тоже вели новую жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Альтернативная традиционная передача титула Χριστός.
lexical_decisions:
- source_word: συνετάφημεν
  choice: мы были погребены вместе с Ним
  rationale: Аорист пассивного залога передаёт совершившееся действие, а приставка συν- естественно выражена словами «вместе с Ним».
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения Павла и естественно звучит в современном русском.
- source_word: διὰ τοῦ βαπτίσματος
  choice: через крещение
  rationale: Сохраняет инструментальное значение διά с родительным падежом, не навязывая конкретного конфессионального понимания крещения.
- source_word: εἰς τὸν θάνατον
  choice: в смерть
  rationale: Сохраняет направительное значение εἰς и связь крещения со смертью, не сводя выражение к более общей причинной формулировке.
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно передаёт целевое значение придаточного предложения.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт титульное значение Χριστός; традиционный вариант «Христос» указан в сноске.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Точно и идиоматично передаёт воскресение из среды мёртвых.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: славой Отца
  rationale: Творительный падеж естественно передаёт инструментальное значение διά, сохраняя δόξα как «слава», а не сужая его до «силы».
- source_word: περιπατήσωμεν
  choice: мы жили
  rationale: В русском библейская метафора «ходить в…» здесь звучит менее естественно; «жили» передаёт её устойчивое переносное значение — образ жизни.
- source_word: ἐν καινότητι ζωῆς
  choice: обновлённой жизнью
  rationale: Естественная русская формулировка, сохраняющая смысл нового качества жизни; она избегает тяжеловесного буквального выражения «в обновлении жизни».
theological_decisions:
- issue: Следует ли формулировать διὰ τοῦ βαπτίσματος так, чтобы из перевода следовало определённое сакраментальное учение
  choice: через крещение
  alternative: крещением
  rationale: Выбранный вариант сохраняет грамматическую инструментальность, но не усиливает её до конфессионального вывода о том, каким именно образом крещение соединяет человека со смертью Мессии.
- issue: Как передать Χριστός в данном контексте
  choice: Мессия
  alternative: Христос
  rationale: Основной текст сохраняет титульный смысл греческого слова, а привычное русское соответствие дано в сноске без изменения богословского содержания.
translation_notes:
  register: 'Современный литературный русский с достоинством и ясностью. Синтаксис слегка перестроен ради естественности: «через крещение в смерть» поставлено перед сказуемым, при этом смысловые связи греческого текста сохранены. Местоимение «Ним» написано с прописной буквы по устойчивой русской библейской традиции.'
