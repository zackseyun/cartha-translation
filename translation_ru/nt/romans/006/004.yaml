- from: Итак, через крещение в смерть мы были погребены вместе с Ним, чтобы, как Мессия[a] был воскрешён из мёртвых славой Отца, так и мы жили обновлённой жизнью.
  to: Итак, мы были погребены вместе с Ним через крещение в смерть, чтобы, как Мессия[a] был воскрешён из мёртвых славой Отца, так и мы тоже вели новую жизнь.
  rationale: Исправлена только заключительная формула ради естественного современного русского и более точной передачи метафоры «ходить» как вести определённый образ жизни. Остальная структура сохранена; двусмысленные или богословски значимые связи текста не уточнялись сверх оригинала.
