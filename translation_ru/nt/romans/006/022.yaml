review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: сохранены контраст «но теперь», освобождение от греха, сильный образ рабской принадлежности Богу, направленность к освящению и вечная жизнь как конечный результат. Однако «став рабами Бога» ослабляет пассивный аорист δουλωθέντες («будучи сделаны/порабощены»), а «вы приносите плод» заменяет ἔχετε («имеете») активным глаголом, меняя образ и синтаксическое соотношение.'
  naturalness: 'Фраза в целом литературна, но «вы имеете плод ваш, ведущий к освящению» в русском звучит тяжеловесно. «Вы пожинаете плод, ведущий к освящению» естественнее, но вносит образ жатвы, которого нет в греческом. Безопаснее сохранить «вы имеете плод, ведущий к освящению» как намеренно близкую передачу, слегка улучшив порядок слов: «плод, ведущий к освящению».'
  terminology: «Грех», «рабы Бога», «освящение» и «вечная жизнь» удачны. «Итог» допустим для τέλος, но «конечный результат» точнее объясняет контекст и естественнее сочетается с «вечная жизнь»; при этом вариант «конец» следует оставить в сноске.
  issues:
  - severity: medium
    issue: Пассивный смысл δουλωθέντες передан недостаточно явно.
    rationale: «Став рабами Бога» может описывать лишь состояние или переход в него, не выражая полученного действия. «Став порабощёнными Богу» неестественно, поэтому «будучи сделаны рабами Бога» сохраняет пассив и сильную метафору.
  - severity: medium
    issue: ἔχετε τὸν καρπὸν ὑμῶν передано как активное «вы приносите плод».
    rationale: Греческое ἔχετε означает «имеете», а не «приносите». Активное «приносите» меняет словесный образ, хотя общий смысл результата сохраняется.
  revised_text: Но теперь, освободившись от греха и будучи сделаны рабами Бога, вы имеете плод, ведущий к освящению[a], а конечный результат[b] — вечная жизнь.
