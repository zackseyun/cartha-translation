- from: Но теперь, освободившись от греха и став рабами Бога, вы приносите плод, ведущий к освящению[a], а итог[b] — вечная жизнь.
  to: Но теперь, освободившись от греха и будучи сделаны рабами Бога, вы имеете плод, ведущий к освящению[a], а конечный результат[b] — вечная жизнь.
  rationale: 'Исправлены две смысловые неточности: сохранён пассивный характер δουλωθέντες и прямое значение ἔχετε. «Конечный результат» передаёт τέλος как достигнутый исход, не исключая более буквального «конец» в сноске. Сноски привязаны к соответствующим словам и сохраняют уместные лексические альтернативы.'
