  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: ru
  text: Но теперь, освободившись от греха и будучи сделаны рабами Бога, вы имеете плод, ведущий к освящению[a], а конечный результат[b] — вечная жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к святости».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а конец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Но теперь
  rationale: Передаёт сильное противопоставление прежнему состоянию, продолжая ход мысли Павла.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: освободившись от греха
  rationale: Деепричастная конструкция естественно передаёт предшествующее завершённое действие; единственное число «грех» сохраняет представление о грехе как господствующей силе.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: став рабами Бога
  rationale: 'Сохраняет намеренно резкий образ рабства и пассивный смысл: верующие были приведены в новое состояние принадлежности Богу.'
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: вы приносите плод
  rationale: Естественная русская передача сохраняет образ плода, не заменяя его отвлечённым словом «польза».
- source_word: εἰς ἁγιασμόν
  choice: ведущий к освящению
  rationale: Передаёт направленность или результат, выраженные εἰς, и сохраняет богословски значимое понятие освящения.
- source_word: τὸ δὲ τέλος
  choice: а итог
  rationale: В данном контексте τέλος обозначает конечный результат описанного пути; «итог» ясно передаёт этот смысл в современном русском языке.
- source_word: ζωὴν αἰώνιον
  choice: вечная жизнь
  rationale: Устоявшаяся и точная передача выражения, сохраняющая его богословское значение.
theological_decisions:
- issue: Образ рабства по отношению к Богу
  choice: став рабами Бога
  alternative: поступив в служение Богу
  rationale: Павел намеренно противопоставляет рабство греху рабской принадлежности Богу; смягчение до одного лишь «служения» ослабило бы аргумент.
- issue: Значение ἁγιασμός
  choice: освящение
  alternative: святость
  rationale: «Освящение» позволяет сохранить оттенок процесса или результата, тогда как возможное значение «святость» отмечено в сноске.
- issue: Значение τέλος
  choice: итог
  alternative: конец
  rationale: «Итог» лучше выражает конечный результат, но буквальное «конец» остаётся возможным и поэтому указано в сноске.
translation_notes:
  register: Современный литературный русский язык; тон достоинственный и доступный. Сохранены сельскохозяйственный образ плода и резкий образ рабства, а синтаксис сделан естественным для русского читателя.
