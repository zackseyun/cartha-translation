id: ROM.6.12
reference: Romans 6:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: ru
  text: Итак, не позволяйте греху царствовать в вашем смертном теле, приводя вас к повиновению его желаниям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «к повиновению желаниям греха».'
    reason: В форме αὐτοῦ местоимение грамматически естественнее относится к слову «тело» (σῶμα, средний род), а не к слову «грех» (ἁμαρτία, женский род); однако контекстуальное понимание как желаний олицетворённого греха возможно.
lexical_decisions:
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и ясно связывает призыв с контекстом.
- source_word: Μὴ ... βασιλευέτω
  choice: не позволяйте ... царствовать
  rationale: Сохраняет запретительную силу повелительной формы и образ греха как царствующей власти; по-русски такая конструкция звучит естественно.
- source_word: ἡ ἁμαρτία
  choice: грех
  rationale: Прямой эквивалент сохраняет олицетворение греха, выраженное глаголом «царствовать», без дополнительных doctrинальных пояснений.
- source_word: θνητῷ
  choice: смертном
  rationale: Кратко и точно обозначает тело как подверженное смерти.
- source_word: σώματι
  choice: теле
  rationale: Прямой перевод без неоправданного сужения до одного лишь физического аспекта.
- source_word: εἰς τὸ ὑπακούειν
  choice: чтобы не повиноваться
  rationale: Греческая конструкция обозначает следствие или направленность царствования греха. В русском отрицание выражено при зависимом инфинитивном содержании, чтобы ясно передать область действия запрета и избежать ошибочного смысла, будто нецарствование греха ведёт к повиновению желаниям.
- source_word: ἐπιθυμίαις
  choice: желаниям
  rationale: Сохраняет широкий смысл слова и не сводит его исключительно к сексуальной похоти.
- source_word: αὐτοῦ
  choice: его
  rationale: Местоимение формально согласуется с существительным среднего рода σῶμα («тело»); русское «его» также позволяет отнести желания к телу, не перегружая текст повтором.
theological_decisions:
- issue: Представлен ли грех только как поступки или также как властвующая сила
  choice: 'Сохранено олицетворение: грех может «царствовать».'
  alternative: Передать смысл как господство греховного поведения без образа царствования.
  rationale: Царская метафора содержится в самом глаголе βασιλεύω и важна для аргумента Павла о господстве и повиновении.
- issue: К чему относится αὐτοῦ («его»)
  choice: В основном тексте «его желаниям» относится к смертному телу.
  alternative: Понимать выражение как «желаниям греха».
  rationale: Форма αὐτοῦ естественно согласуется со средним родом σῶμα, тогда как ἁμαρτία имеет женский род. Однако контекстуальная связь желаний с олицетворённым грехом возможна и отмечена в сноске.
- issue: Область действия отрицания в конструкции Μὴ ... εἰς τὸ ὑπακούειν
  choice: 'По-русски отрицание явно распространено на повиновение: «чтобы не повиноваться».'
  alternative: 'Формально воспроизвести без второго отрицания: «чтобы повиноваться».'
  rationale: Греческое отрицание запрещает царствование греха, итогом которого становится повиновение желаниям. Буквальная русская конструкция без второго «не» могла бы ошибочно представить повиновение как цель запрета, поэтому синтаксис прояснён без изменения мысли.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Образ царствования сохранён, а устаревшие «да не царствует» и «похоти» заменены более ясными современными выражениями.
