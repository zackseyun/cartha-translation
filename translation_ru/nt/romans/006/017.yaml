source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: ru
  text: Но благодарение Богу за то, что, хотя вы были рабами греха, вы от всего сердца послушались того образца учения[a], которому были переданы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «формы учения» или «мерила учения».
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «в который были переданы».'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Но благодарение Богу!
  rationale: В этой идиоматической конструкции χάρις выражает благодарность, обращённую к Богу. Отдельное восклицание естественно по-русски и позволяет ясно связать благодарение с последующим переходом от прежнего рабства к послушанию.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: рабами греха
  rationale: Слово δοῦλοι здесь обозначает рабское подчинение и принадлежность господствующей силе. «Рабы греха» сохраняет развёрнутую в Рим 6 метафору рабства и её резкость.
- source_word: ὑπηκούσατε
  choice: послушались
  rationale: Глагол означает деятельное повиновение, а не только слушание. Совершенный вид естественно передаёт аорист и обозначает состоявшийся поворот к послушанию.
- source_word: ἐκ καρδίας
  choice: от всего сердца
  rationale: Выражение сохраняет образ сердца и естественно обозначает искреннее, внутреннее и целостное послушание.
- source_word: τύπον διδαχῆς
  choice: образца учения
  rationale: τύπος может обозначать образец, форму или мерило. «Образец учения» понятно современному читателю и сохраняет метафору нормы, формирующей жизнь верующих.
- source_word: παρεδόθητε
  choice: были переданы
  rationale: 'Сохранён страдательный залог и необычный образ: не учение было передано верующим, а сами они были переданы образцу учения.'
- source_word: εἰς ὃν
  choice: которому
  rationale: Местоимение соотнесено именно с «образцом». Дательный падеж после «переданы» естественен по-русски, тогда как более буквальное пространственное «в который» сохранено в примечании.
theological_decisions:
- issue: Передавать ли δοῦλοι смягчённо как «слуги» или прямо как «рабы»
  choice: рабы греха
  alternative: слуги греха
  rationale: Контекст строится на господстве, принадлежности и противопоставлении двух видов рабства. «Слуги» ослабило бы эту богословски значимую метафору.
- issue: Перестроить ли страдательную конструкцию так, будто учение было передано верующим
  choice: образец учения, которому были переданы верующие
  alternative: учение, которое было передано верующим
  rationale: Греческий текст представляет самих верующих как переданных образцу учения. Эта необычная направленность сохранена без уточнения, кем именно они были переданы.
- issue: Как понимать образ τύπος в сочетании с εἰς
  choice: образец как нормативная форма, которой переданы верующие
  alternative: форма или словно литейная форма, в которую они были помещены
  rationale: Основной текст не превращает метафору в развёрнутое толкование. Примечание сохраняет возможность более пространственного понимания εἰς и образа формы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Восклицание после формулы благодарения устраняет тяжеловесную синтаксическую двусмысленность, не скрывая контраста δέ. Необычная пассивная метафора «были переданы образцу учения» намеренно сохранена; все маркеры примечаний присутствуют в основном тексте.
