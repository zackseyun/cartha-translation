  source_fidelity: 'Текст точно передаёт основные синтаксические и смысловые элементы греческого оригинала: γνώσκοντες естественно развёрнуто как «Мы знаем», συνεσταυρώθη — как «был распят вместе с Ним», а две целевые конструкции сохранены через «чтобы». «Тело греха» бережно сохраняет неоднозначность τὸ σῶμα τῆς ἁμαρτίας; «лишилось силы» удачно передаёт καταργηθῇ как утрату действенности, не предполагая уничтожения. «Не были рабами греха» верно выражает образ δουλεύειν.'
  naturalness: Фраза звучит как современный литературный русский и читается ясно. «Наш прежний человек» несколько менее традиционно, чем «ветхий человек», но является понятным современным соответствием и сохраняет образ единственного «человека», не сужая его до одной внутренней способности или сущности. Употребление прописного «Ним» соответствует заявленному библейскому регистру.
