id: ROM.6.6
reference: Romans 6:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: ru
  text: Мы знаем, что наш прежний человек[a] был распят вместе с Ним, чтобы тело греха лишилось силы[b] и мы больше не были рабами греха[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наша прежняя сущность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «было упразднено» или «было сведено на нет».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не служили греху».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: мы знаем
  rationale: Причастный оборот указывает на знание, связывающее этот довод с предыдущим контекстом. В русском самостоятельном стихе личная форма звучит естественно, не превращая оборот в явно причинное придаточное.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: наш прежний человек
  rationale: Сохранён антропологический образ Павла и единственное число; «прежний» передаёт состояние человека до описываемого перелома и звучит современнее традиционного «ветхий».
- source_word: συνεσταυρώθη
  choice: был распят вместе с Ним
  rationale: «Вместе с» явно передаёт значение приставки συν- и совместность распятия, не прибегая к неестественному сложному глаголу.
- source_word: καταργηθῇ
  choice: лишилось силы
  rationale: Выражение передаёт прекращение действенной власти или способности, не утверждая однозначно полного уничтожения; иные возможные оттенки отмечены в сноске.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: тело греха
  rationale: Сохранена компактная родительная конструкция греческого текста, чтобы не решать заранее, означает ли она греховное тело, тело под властью греха или тело в иной связи с грехом.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: и мы больше не были рабами греха
  rationale: Образ рабства передаёт сильное значение δουλεύω и власть греха как господина; союз «и» естественно связывает эту конечную цель с предшествующей.
theological_decisions:
- issue: Антропологический смысл выражения ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: наш прежний человек
  alternative: наша прежняя сущность
  rationale: Основной текст сохраняет образ человека и грамматическое единственное число, не сводя выражение лишь к внутренней природе или отдельной части личности.
- issue: Сила глагола καταργηθῇ применительно к телу греха
  choice: лишилось силы
  alternative: было упразднено; было сведено на нет
  rationale: Так передаётся прекращение действенной власти греха без навязывания более сильного утверждения о полном уничтожении тела; лексическая широта сохранена в сноске.
- issue: Образ δουλεύειν как рабства или служения
  choice: не были рабами греха
  alternative: не служили греху
  rationale: В контексте господства греха образ рабской зависимости особенно выразителен, однако более общее значение служения остаётся возможным и указано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением ключевых павловских образов. Традиционное «ветхий человек» заменено более понятным «прежний человек»; буквальное «тело греха» оставлено ради подлинной смысловой неоднозначности. Местоимение «Ним» пишется с прописной буквы по устойчивой русской библейской издательской норме.
