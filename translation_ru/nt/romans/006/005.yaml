  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: ru
  text: Ведь если мы стали едины с Ним в подобии Его смерти[a], то, несомненно, будем едины с Ним и в подобии Его воскресения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «срослись с Ним в подобии Его смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Дословно: «но и воскресения будем»; слова «едины с Ним в подобии Его» подразумеваются из первой части предложения.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: соединились с Ним
  rationale: Передаёт органическое единение и совместное участие, не сводя образ ни к чисто физическому «срастанию», ни к отвлечённому сходству.
- source_word: γεγόναμεν
  choice: соединились
  rationale: Русская форма совершенного вида естественно выражает возникшее в прошлом единение с сохраняющимся результатом; значение становления передано самим глаголом.
- source_word: τῷ ὁμοιώματι
  choice: в подобии
  rationale: Сохраняет намеренно не до конца определённое отношение дательного падежа и ключевое указание Павла на подобие.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: Его смерти
  rationale: Прямо и естественно передаёт греческую родительную конструкцию.
- source_word: ἀλλὰ καὶ
  choice: то, несомненно, ... и
  rationale: В условной конструкции ἀλλά усиливает соответствие второй части первой; «несомненно» передаёт эмфатический характер связи без неестественного русского «но и».
- source_word: τῆς ἀναστάσεως
  choice: в подобии Его воскресения
  rationale: Для ясного русского параллелизма восстановлены подразумеваемые слова из первой части; «Его» относится ко Христу и следует из ближайшего контекста.
- source_word: ἐσόμεθα
  choice: будем соединены с Ним
  rationale: Греческое «будем» требует восполнить подразумеваемое сказуемое σύμφυτοι; страдательная форма по-русски ясно выражает состояние единения.
theological_decisions:
- issue: Характер единения со Христом в смерти и воскресении
  choice: Сохранено «соединились с Ним в подобии... будем соединены с Ним в подобии»
  alternative: «срослись с Ним», «приобщились к смерти и воскресению», «стали подобны Ему»
  rationale: Формулировка сохраняет одновременно реальность единения и ограничивающее слово «подобие», не навязывая сакраментального, мистического либо только метафорического толкования.
- issue: Будущее значение воскресения
  choice: «будем соединены с Ним и в подобии Его воскресения»
  alternative: «таковы же будем и в воскресении»
  rationale: Восстановление эллипсиса делает фразу понятной, но не уточняет, идёт ли речь исключительно о будущем телесном воскресении или также о нынешней обновлённой жизни; эта смысловая напряжённость сохраняется.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавное «Ним/Его» использовано для прозрачной отсылки ко Христу. Порядок сносок приведён в последовательность [a], [b], и каждый маркер присутствует в основном тексте.
