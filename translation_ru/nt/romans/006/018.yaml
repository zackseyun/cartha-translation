lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: освободившись
  rationale: Аористное страдательное причастие обозначает полученное адресатами освобождение как свершившийся факт; русская возвратная форма естественна в этом контексте, хотя формально менее явно выражает страдательный залог.
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкую связку и лёгкое противопоставление в развитии мысли Павла, не утяжеляя фразу.
- source_word: ἁμαρτίας
  choice: греха
  rationale: Единственное число с артиклем допускает понимание греха и как реальности, и как персонифицированной господствующей силы.
- source_word: ἐδουλώθητε
  choice: стали рабами
  rationale: Сохраняет резкую метафору рабства и аористную завершённость перемены господства; по-русски звучит естественнее буквального «были порабощены праведности».
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: Сохраняет широкий павловский смысл δικαιοσύνη, включая нравственный и судебно-заветный оттенки; дательный падеж передаёт нового господина или сферу подчинения.
theological_decisions:
- issue: Передача метафоры δουλόω
  choice: вы стали рабами праведности
  alternative: вы были порабощены праведности
  rationale: Метафора рабства остаётся явной и не смягчается до «служения», но выбран естественный русский оборот без устранения богословского напряжения между освобождением и новым рабством.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» лучше сохраняет широкий и устойчивый павловский смысл; реальная лексическая альтернатива «справедливость» указана в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная формулировка. Сохранены параллелизм освобождения и рабства и намеренно резкая метафора Павла.
