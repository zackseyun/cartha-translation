  terminology: «Грех», «праведность» и «рабство» последовательно передают ἁμαρτία, δικαιοσύνη и δουλόω. Сноска «справедливости» уместно отмечает возможную лексическую альтернативу для δικαιοσύνη. Предлог «в рабство» требует родительного падежа («праведности») и естественно выражает принадлежность новому господину.
