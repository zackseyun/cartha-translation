  source_fidelity: 'В исходном тексте оба глагольных элемента стоят в страдательном залоге: ἐλευθερωθέντες («будучи/после того как были освобождены») и ἐδουλώθητε («были обращены в рабство»). Черновое «освободившись» обычно означает действие самих адресатов и потому не сохраняет страдательный залог первого элемента; «стали рабами» передаёт результат, но ослабляет страдательность второго. Исправленный текст сохраняет пассивность и последовательность перехода от греха к праведности.'
