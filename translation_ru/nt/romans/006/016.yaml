id: ROM.6.16
reference: Romans 6:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: ru
  text: 'Разве вы не знаете, что кому бы вы ни отдавали себя в рабы, чтобы повиноваться, вы рабы того, кому повинуетесь: либо греха, ведущего к смерти, либо послушания, ведущего к праведности[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости».'
    reason: Лексически возможный вариант передачи δικαιοσύνη.
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: отдавая себя
  rationale: Передаёт образ добровольного предоставления себя в распоряжение другого и звучит естественно по-русски.
- source_word: δούλους / δοῦλοί
  choice: в рабы / рабами
  rationale: Сохраняет выраженную в контексте принадлежность и подчинённое положение, не ослабляя δοῦλος до общего «слуга».
- source_word: εἰς ὑπακοήν
  choice: чтобы повиноваться
  rationale: Естественно передаёт целевое значение εἰς и смысл существительного ὑπακοή; глагольная конструкция позволяет избежать тяжеловесного «для послушания».
- source_word: ᾧ ὑπακούετε
  choice: того, кому повинуетесь
  rationale: Сохраняет личную соотнесённость относительного местоимения и не добавляет отсутствующего в греческом слова «господин».
- source_word: ἁμαρτίας
  choice: греха
  rationale: Сохраняет прямое наименование; олицетворение греха уже выражено образом рабства.
- source_word: εἰς θάνατον
  choice: ведущего к смерти
  rationale: Передаёт направленность и результат, выраженные εἰς, ясным современным языком.
- source_word: ὑπακοῆς
  choice: послушания
  rationale: Сохраняет абстрактное существительное и намеренную симметрию между грехом и послушанием как двумя противопоставленными началами.
- source_word: δικαιοσύνην
  choice: праведности
  rationale: В данном нравственно-богословском противопоставлении «праведность» лучше сохраняет широкий смысл δικαιοσύνη, чем более узкое «справедливость».
theological_decisions:
- issue: Передача δικαιοσύνη в противопоставлении греху и смерти
  choice: праведности
  alternative: справедливости
  rationale: «Праведность» сохраняет характерный для Павла нравственно-богословский диапазон понятия; возможное значение «справедливость» отмечено в сноске, чтобы не скрывать лексическую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской риторики. Конструкция «отдавая себя кому-либо в рабы» сохраняет образ добровольного предоставления себя в распоряжение господствующей силы; повтор «рабами» намеренно удерживает настойчивость греческого текста.
