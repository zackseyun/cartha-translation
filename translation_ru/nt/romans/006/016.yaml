  source_fidelity: 'Основной образ и лексика переданы верно: δοῦλος сохранено как «раб», ἁμαρτία — «грех», а направленность εἰς θάνατον / εἰς δικαιοσύνην адекватно выражена словами «ведущий к». Однако «вы становитесь рабами» вносит оттенок становления, тогда как δοῦλοί ἐστε означает «вы рабы»; это следует исправить.'
