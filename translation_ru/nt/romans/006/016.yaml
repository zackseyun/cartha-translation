- from: 'Разве вы не знаете, что, отдавая себя кому-либо в рабы, чтобы повиноваться, вы становитесь рабами того, кому повинуетесь: либо греха, ведущего к смерти, либо послушания, ведущего к праведности[a]?'
  to: 'Разве вы не знаете, что кому бы вы ни отдавали себя в рабы, чтобы повиноваться, вы рабы того, кому повинуетесь: либо греха, ведущего к смерти, либо послушания, ведущего к праведности[a]?'
  rationale: Исправлено только «становитесь» на «вы рабы», чтобы сохранить настоящее утверждение греческого текста. Оборот «кому бы вы ни отдавали себя» передаёт соотнесённость ᾧ ... ᾧ без добавления слова «господин» и остаётся естественным в современном литературном русском.
