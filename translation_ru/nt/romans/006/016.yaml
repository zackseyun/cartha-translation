  terminology: «Рабы», «грех», «послушание» и «праведность» уместны и последовательно сохраняют богословскую и риторическую лексику Павла. Сноска «справедливости» корректно отмечает возможный лексический вариант δικαιοσύνη, не подменяя основной перевод.
