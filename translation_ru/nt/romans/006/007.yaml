revisions:
- from: Ведь умерший освобождён от греха.[a]
  to: Ведь тот, кто умер, оправдан от греха.[a]
  rationale: Судебное значение δεδικαίωται восстановлено в основном тексте как «оправдан», в соответствии с исходной лексикой и английской аудиторской фиксацией альтернативы «justified». Примечание сохраняет контекстуально обоснованное значение «освобождён», не смешивая его с неточным образом снятого обвинения.
  reviewer_model: gpt-5.6-terra
