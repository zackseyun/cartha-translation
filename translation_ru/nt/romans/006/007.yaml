    rationale: В Рим 6 освобождение от господства греха несомненно существенно, но выбран именно глагол δικαιόω. Основной текст должен сохранять эту лексическую особенность; «освобождён» уместен как альтернатива в примечании.
  - severity: medium
    issue: Примечание «с него снято обвинение греха» семантически неточно.
    rationale: Греческое выражение говорит об оправдании/освобождении «от греха», а не о снятии некоего обвинения, исходящего от греха.
  revised_text: Ведь тот, кто умер, оправдан от греха.[a]
