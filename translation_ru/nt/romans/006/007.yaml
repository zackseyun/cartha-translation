translation:
  language: ru
  text: Ведь тот, кто умер, оправдан от греха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «освобождён от греха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: умерший
  rationale: Артикль с аористным причастием употреблён субстантивированно. «Умерший» естественно и кратко передаёт значение «тот, кто умер», не уточняя пол сверх грамматических требований русского языка.
- source_word: γὰρ
  choice: ведь
  rationale: γάρ поясняет и обосновывает предыдущее утверждение. «Ведь» естественно сохраняет пояснительно-причинную связь.
- source_word: δεδικαίωται
  choice: освобождён
  rationale: Перфект передаёт достигнутое состояние. Хотя δικαιόω обычно имеет судебное значение «оправдывать», сочетание с ἀπό и контекст Рим 6 указывают на прекращение власти или притязаний греха. «Освобождён» ясно передаёт контекстуальный результат, а судебная грань сохранена в примечании.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: от греха
  rationale: ἀπό обозначает отделение или освобождение. В русском «от греха» естественно и не сужает смысл исключительно до вины либо власти греха.
theological_decisions:
- issue: Передавать ли δικαιόω исключительно судебно («оправдан») или в контекстуальном смысле освобождения.
  choice: 'В основном тексте: «освобождён от греха».'
  alternative: «оправдан от греха»; «с него снято обвинение греха».
  rationale: В Рим 6 речь идёт об освобождении от господства греха, однако необычный выбор глагола δικαιόω сохраняет судебный оттенок. Основной текст передаёт понятный контекстуальный смысл, а примечание сохраняет подлинную лексическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и общепонятная формулировка. Причастное существительное «умерший» соответствует сжатости греческого текста.
