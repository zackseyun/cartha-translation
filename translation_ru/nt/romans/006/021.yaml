  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: ru
  text: Какой же плод вы имели тогда от того, чего теперь стыдитесь? Ведь конец всего этого — смерть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «итог всего этого — смерть».'
    reason: Лексическая альтернатива для τέλος, которое может обозначать как конец, так и итог или исход.
lexical_decisions:
- source_word: τίνα
  choice: какой
  rationale: Вводит риторический вопрос о характере или ценности прежнего плода; «какой» естественно передаёт эту силу.
- source_word: καρπὸν
  choice: плод
  rationale: Сохраняет метафору Павла о результате, который приносит образ жизни, не сводя её к абстрактной «пользе».
- source_word: εἴχετε
  choice: вы имели
  rationale: Передаёт прежнее состояние, противопоставленное нынешнему стыду; русский контекст с «тогда» ясно выражает временной план.
- source_word: τότε
  choice: тогда
  rationale: Кратко и ясно сохраняет временной контраст с νῦν — «теперь».
- source_word: ἐφ’ οἷς
  choice: от дел, которых
  rationale: Предлог ἐπί здесь допускает связь плода с прежними поступками; «от дел» естественно выражает источник плода, а «которых» — объект нынешнего стыда. Существительное «дел» добавлено для ясности подразумеваемого референта.
- source_word: νῦν
  choice: теперь
  rationale: Естественно подчёркивает противопоставление прежней жизни нынешней оценке.
- source_word: ἐπαισχύνεσθε
  choice: стыдитесь
  rationale: Передаёт сильный нравственный смысл глагола точнее, чем более слабое «смущаетесь».
- source_word: τέλος
  choice: конец
  rationale: Сохраняет диапазон значения — завершение и итоговое следствие — не разрешая неоднозначность в пользу одного толкования.
- source_word: ἐκείνων
  choice: их
  rationale: Местоимение естественно отсылает к упомянутым делам и избегает тяжеловесного повтора.
- source_word: θάνατος
  choice: смерть
  rationale: Прямой и традиционно точный эквивалент, сохраняющий богословскую весомость выражения.
theological_decisions:
- issue: Передача τέλος как «конец» или более истолковывающее «итог»
  choice: конец
  alternative: итог
  rationale: «Конец» сохраняет как значение конечной точки, так и значение последствия; вариант «итог» возможен, но несколько сужает смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены риторический вопрос, метафора плода и резкий контраст «тогда — теперь». «Дела» эксплицирует подразумеваемый референт, не вводя конфессионального толкования.
