  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: ru
  text: Если же мы умерли со Христом[a], то верим, что и будем жить с Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с Мессией». Греческое Χριστός означает «Помазанник», то есть Мессия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Если … то
  rationale: Условие εἰ естественно передано конструкцией «если … то»; отдельный перевод δέ здесь не требуется, поскольку переход мысли ясен из условной конструкции и контекста.
- source_word: ἀπεθάνομεν
  choice: мы умерли
  rationale: Аорист изъявительного наклонения обозначает уже совершившуюся смерть верующих вместе со Христом, о которой Павел говорил выше.
- source_word: σὺν Χριστῷ
  choice: со Христом
  rationale: σύν выражает совместность и единение. В современном русском библейском и литературном употреблении Χριστός естественно передаётся как «Христос», сохраняя мессианский титул.
- source_word: πιστεύομεν
  choice: верим
  rationale: Прямое и естественное соответствие πιστεύομεν; русское местоимение «мы» можно не повторять, поскольку лицо ясно из формы глагола.
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание веры и прозрачно сохраняет структуру греческой фразы.
- source_word: καὶ
  choice: и
  rationale: Передаёт соответствие между совместной смертью со Христом и совместной жизнью с Ним.
- source_word: συζήσομεν αὐτῷ
  choice: жить будем с Ним
  rationale: Составной глагол συζάω и дательное αὐτῷ вместе выражают будущую жизнь с Ним. Такой порядок слов естественен и сохраняет акцент на совместности, не уточняя сверх текста характер этой жизни.
theological_decisions:
- issue: Передача Χριστῷ
  choice: Христом
  alternative: Мессией
  rationale: «Христос» — укоренившаяся русская передача греческого титула Χριστός и в данном контексте звучит естественно, не превращая титул в частное доктринальное толкование. Сноска раскрывает буквальное значение титула.
- issue: Характер будущей жизни в συζήσομεν αὐτῷ
  choice: жить будем с Ним
  alternative: воскреснем и будем жить с Ним
  rationale: Перевод сохраняет широту исходного утверждения о совместной будущей жизни и не ограничивает его одним предполагаемым механизмом или временным этапом.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Конструкция краткая и ритмичная; заглавное «Ним» соответствует распространённой русской библейской традиции почтительного обозначения Христа.
