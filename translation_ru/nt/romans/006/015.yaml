  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: ru
  text: Что же? Будем ли грешить, потому что мы не под законом, а под благодатью? Ни в коем случае![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Станем ли грешить?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Да не будет этого!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Что же?
  rationale: Кратко и естественно передаёт выводный переход в рассуждении Павла, не добавляя отсутствующих в греческом тексте слов.
- source_word: ἁμαρτήσωμεν
  choice: Будем ли грешить
  rationale: Форма аориста сослагательного наклонения первого лица множественного числа имеет здесь совещательный оттенок; русский вопрос естественно передаёт рассматриваемую возможность. Альтернатива отмечена в сноске.
- source_word: ὅτι
  choice: потому что
  rationale: 'Передаёт основание для предполагаемого вывода: возможность грешить якобы следует из того, что верующие не под законом, а под благодатью.'
- source_word: ὑπὸ νόμον
  choice: под законом
  rationale: Устойчивая и понятная русская формулировка сохраняет юридико-богословскую метафору и не сужает νόμος до явно названного Моисеева закона.
- source_word: ὑπὸ χάριν
  choice: под благодатью
  rationale: Сохраняет установленное богословское значение χάρις и параллельную конструкцию с выражением «под законом».
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Современное, сильное и достойное по стилю категорическое отрицание; более буквальная идиоматическая альтернатива приведена в сноске.
theological_decisions:
- issue: Объём значения νόμος в противопоставлении Павла
  choice: «под законом» без поясняющего уточнения
  alternative: «под Моисеевым законом»
  rationale: Греческий текст не уточняет референт и употребляет νόμος без артикля. Перевод сохраняет богословскую широту и напряжение выражения, не решая экзегетический вопрос в основном тексте.
translation_notes:
  register: Современный литературный русский язык; краткий риторический вопрос и энергичное отрицание сохраняют ход аргументации Павла. Формулировки понятны широкому читателю и не вводят конфессиональных уточнений.
