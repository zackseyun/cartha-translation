  source_fidelity: 'Текст точно передаёт оба γάρ: «Ведь» сохраняет связь с предшествующим рассуждением, а «потому что» — объяснительное основание. «Грех не будет господствовать над вами» адекватно передаёт ἁμαρτία ... οὐ κυριεύσει, включая олицетворение греха как властвующей силы. Противопоставление ὑπὸ νόμον / ὑπὸ χάριν точно сохранено как «под законом, а под благодатью» без неоправданного уточнения закона.'
