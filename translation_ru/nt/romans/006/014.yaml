  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: ru
  text: Ведь грех не будет господствовать над вами, потому что вы не под законом, а под благодатью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁμαρτία
  choice: грех
  rationale: Стандартное соответствие в посланиях Павла. Строчная буква не добавляет отсутствующего в греческом тексте толкования, тогда как глагол сохраняет образ греха как властвующей силы.
- source_word: κυριεύσει
  choice: не будет господствовать над вами
  rationale: Передаёт значение осуществления власти или господства и сохраняет олицетворение греха; формулировка естественна для современного литературного русского языка.
- source_word: ὑπὸ νόμον
  choice: под законом
  rationale: Сохраняет краткую павловскую формулу и её смысл нахождения под властью или режимом закона, не уточняя в основном тексте больше, чем сказано по-гречески.
- source_word: χάριν
  choice: под благодатью
  rationale: «Благодать» — устойчивое и контекстуально точное соответствие χάρις в противопоставлении закону; повтор предлога делает русскую фразу ясной.
- source_word: γὰρ … γάρ
  choice: ведь … потому что
  rationale: Первое γὰρ связывает утверждение с предшествующим контекстом, а второе вводит его основание; русские связки естественно отражают разные дискурсивные функции.
theological_decisions:
- issue: Нужно ли усиливать олицетворение греха прописной буквой или более явным образом властителя
  choice: Оставить «грех» со строчной буквы и перевести κυριεύσει как «не будет господствовать над вами».
  alternative: «Грех не будет властвовать над вами» или «Грех не будет вашим господином».
  rationale: Греческий текст представляет грех как властвующую силу, но не требует типографического выделения или превращения метафоры в прямое наименование. Выбранная формулировка сохраняет образ и богословское напряжение без дополнительной доктринальной конкретизации.
- issue: Следует ли прямо определить νόμος как Моисеев закон
  choice: Перевести просто «под законом».
  alternative: «Под властью Моисеева закона».
  rationale: В контексте Послания к римлянам вероятна отсылка к Моисееву закону и связанному с ним порядку, однако сам стих не содержит уточнения «Моисеев». Краткий перевод сохраняет объём исходной формулы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет причинную структуру двух γὰρ; терминология соответствует устойчивому библейскому употреблению без архаизмов и конфессиональных добавлений.
