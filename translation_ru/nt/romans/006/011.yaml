  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: ru
  text: Так и вы считайте себя мёртвыми для греха, но живыми для Бога в Мессии Иисусе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе Иисусе»; греческое слово Χριστός означает титул «Мессия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Так и
  rationale: Естественно передаёт вывод из предшествующего рассуждения и сохраняет связку «так же и вы».
- source_word: λογίζεσθε
  choice: считайте
  rationale: Передаёт значение осознанно признавать или полагать нечто истинным; в современном русском сохраняет оттенок мысленного исчисления без канцелярской тяжеловесности.
- source_word: ἑαυτοὺς εἶναι
  choice: себя
  rationale: Русская конструкция «считайте себя мёртвыми… живыми» естественно передаёт рефлексивное местоимение и подразумеваемую связку «быть»; отдельное «быть» здесь не требуется.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: мёртвыми для греха
  rationale: Сохраняет образ смерти и наиболее естественно передаёт дательный отношения; противопоставление μέν…δέ выражено союзом «но».
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: но живыми для Бога
  rationale: Прилагательное «живыми» создаёт точную и естественную антитезу к «мёртвыми», передавая причастие ζῶντας по смыслу.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Предлог «в» сохраняет характерный для Павла язык пребывания и единения, а Χριστός передан как значимый титул «Мессия».
theological_decisions:
- issue: Передача Χριστῷ как титула или как закрепившейся формы имени
  choice: Мессии
  alternative: Христе
  rationale: В данном выражении титульный смысл остаётся значимым; «Мессия» делает его прозрачным, не добавляя конфессионального толкования.
- issue: Смысл ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  alternative: через Мессию Иисуса
  rationale: Буквальное «в» сохраняет возможный смысл сферы или единения и не сводит неоднозначное отношение к средству либо причине.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и понятная. Сохранены павловская антитеза «мёртвые — живые» и богословски значимый предлог «в».
