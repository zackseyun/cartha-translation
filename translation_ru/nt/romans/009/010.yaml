- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: И не только это, но и
  rationale: Естественно передаёт соотносительную конструкцию и сохраняет поступательное развитие довода Павла.
- source_word: Ῥεβέκκα
  choice: Ревекка
  rationale: Традиционная и общепонятная русская форма имени библейской праматери.
- source_word: ἐξ ἑνός
  choice: от одного
  rationale: Сохраняет лаконичность и некоторую недосказанность греческого выражения; следующий оборот прямо указывает, что речь об Исааке.
- source_word: κοίτην ἔχουσα
  choice: зачала
  rationale: Передаёт контекстуальный смысл идиомы, буквально связанной с брачным ложем и половым союзом, естественным современным русским языком.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: Исаака, отца нашего
  rationale: Сохраняет имя и прямое обозначение общего предка; порядок «отца нашего» придаёт фразе достойное библейское звучание без архаизации.
theological_decisions:
- issue: Степень явности при передаче идиомы зачатия и единого отцовства в рассуждении об избрании
  choice: «Ревекка зачала от одного — Исаака»
  alternative: «Ревекка разделила ложе с одним — Исааком» или «Ревекка зачала от одного мужчины»
  rationale: Выбранный вариант ясно передаёт зачатие от одного отца, но не добавляет отсутствующее в тексте слово «детей» и не превращает идиому в излишне буквальное упоминание ложа. Тире естественно раскрывает, кто назван «одним», не устраняя полностью сжатость оригинала.
translation_notes:
