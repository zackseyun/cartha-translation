  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: ru
  text: Итак, кого хочет, того милует, а кого хочет, того ожесточает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делает упорным». Греческий текст использует активный глагол; его не следует смягчать до значения «лишь позволяет ожесточиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание выводных частиц вводит заключение из предшествующего рассуждения; «итак» естественно и ясно передаёт эту логическую связь.
- source_word: ὃν θέλει
  choice: кого хочет, того
  rationale: Эта русская конструкция естественно передаёт неопределённо-относительный оборот и сохраняет прямое указание на волю Бога; повтор во второй части воспроизводит параллелизм греческого текста.
- source_word: ἐλεεῖ
  choice: милует
  rationale: Глагол означает проявление милости. «Милует» кратко, достойно по регистру и сохраняет активную глагольную форму.
- source_word: ὃν δὲ θέλει
  choice: а кого хочет, того
  rationale: Противительный союз «а» ясно передаёт контраст δέ между милостью и ожесточением, сохраняя симметрию двух частей.
- source_word: σκληρύνει
  choice: ожесточает
  rationale: Активный глагол означает «делает жёстким, упорным». «Ожесточает» сохраняет активную субъектность, межтекстовую связь с повествованием о фараоне и богословское напряжение стиха.
theological_decisions:
- issue: Божественная воля в θέλει
  choice: Сохранено прямое «кого хочет» в обеих частях.
  alternative: Смягчить формулировку словами «кого решает» или истолковать её как простое допущение.
  rationale: Греческий текст прямо говорит о воле субъекта; перевод не должен разрешать спор о предопределении и человеческой ответственности.
- issue: Субъектность действия в σκληρύνει
  choice: 'Переведено активно: «ожесточает».'
  alternative: «Позволяет ожесточиться» или «оставляет в ожесточении».
  rationale: В оригинале стоит активный глагол, прямо приписывающий действие субъекту. Формулировка через позволение была бы толкованием и смягчала бы текст.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Параллелизм двух частей сохранён; местоименный субъект не добавлен, поскольку в контексте и по форме глаголов он однозначно подразумевается.
