id: ROM.9.24
reference: Romans 9:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: ru
  text: нас[a], которых он и призвал, — не только из иудеев, но и из язычников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально порядок слов можно передать так: «которых он и призвал, нас». Павел отождествляет «нас» с упомянутыми ранее сосудами милости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из народов»; здесь, в противопоставлении иудеям, имеются в виду неиудеи, то есть язычники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: нас, которых
  rationale: Относительное местоимение οὓς относится к упомянутым ранее «сосудам милости», а ἡμᾶς поясняет, кто именно имеется в виду. Перестановка в русском языке сохраняет эту связь и делает фразу естественной.
- source_word: καὶ ἐκάλεσεν
  choice: и призвал
  rationale: 'Καί имеет присоединительно-усилительный оттенок: Бог не только приготовил их к славе, но и призвал. «Призвал» сохраняет устойчивое для Павла богословски значимое употребление καλέω.'
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: не только ... но и
  rationale: Стандартная русская соотносительная конструкция точно передаёт греческое противопоставление с добавлением второй группы.
- source_word: ἐξ Ἰουδαίων
  choice: из иудеев
  rationale: Ἐξ обозначает происхождение или принадлежность к группе; «из иудеев» естественно передаёт этот смысл и сохраняет историко-этническое обозначение.
- source_word: ἐξ ἐθνῶν
  choice: из язычников
  rationale: В непосредственном противопоставлении иудеям ἔθνη означает неиудеев. «Язычники» — традиционное и понятное русское обозначение этой группы в данном контексте.
theological_decisions:
- issue: Связь призванных с «сосудами милости» из предыдущего стиха
  choice: нас, которых он и призвал
  alternative: которых он и призвал, то есть нас
  rationale: Выбранный порядок слов ясно отождествляет «нас» с ранее названными объектами милости, не добавляя выводов о природе избрания или призвания сверх сказанного в тексте.
- issue: Значение ἐθνῶν в противопоставлении иудеям
  choice: язычников
  alternative: народов
  rationale: Контраст Ἰουδαίων и ἐθνῶν указывает на различие между иудеями и неиудеями, а не просто на совокупность политических или этнических народов.
translation_notes:
  register: Современный литературный русский язык; фрагментарное начало сохранено, поскольку стих синтаксически продолжает предыдущее предложение. Строчная форма местоимения «он» следует обычной русской орфографии и не вносит отсутствующего в греческом тексте конфессионального оформления.
