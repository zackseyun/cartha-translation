  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: ru
  text: 'Ведь Писание говорит фараону: «Именно для этого Я воздвиг тебя[a], чтобы явить на тебе Мою силу и чтобы Моё имя[b] было возвещено по всей земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранил тебя», «поставил тебя»; греческий глагол допускает более широкий смысл — дать кому-либо выступить или устоять в определённой роли.'
    reason: lexical_alternative
  - marker: b
    text: «Имя» здесь означает не только именование, но и явленную славу и известность Бога.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: Ведь Писание говорит фараону
  rationale: Сохранены пояснительное γὰρ, настоящее время λέγει и олицетворение Писания; формулировка естественна для современного литературного русского языка.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Именно для этого
  rationale: Передаёт целевое значение и эмфатическую силу αὐτὸ без тяжеловесности.
- source_word: ἐξήγειρά σε
  choice: Я воздвиг тебя
  rationale: «Воздвиг» сохраняет широкий смысл Божьего выдвижения и поставления фараона, не сводя его однозначно ни к сотворению, ни только к сохранению жизни.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: чтобы явить на тебе Мою силу
  rationale: «Явить» передаёт публичное обнаружение силы, а «на тебе» естественно обозначает фараона как того, на ком она проявляется, не смещая смысл к добровольному посредничеству.
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: и чтобы Моё имя было возвещено
  rationale: Пассивная конструкция сохраняет неопределённого распространителя вести и публичный характер διαγγέλλω.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: по всей земле
  rationale: Передаёт широкий, универсальный охват и звучит естественно по-русски.
theological_decisions:
- issue: Значение ἐξήγειρά σε в связи с фараоном и Божьим владычеством
  choice: Я воздвиг тебя
  alternative: Я сохранил тебя; Я поставил тебя; Я дал тебе устоять
  rationale: Выбранная формулировка сохраняет широкое утверждение о Божьем выдвижении фараона для данной цели, но не разрешает за текстом богословское напряжение между Божьим владычеством и ответственностью человека.
- issue: Смысл ἐν σοὶ при явлении Божьей силы
  choice: на тебе
  alternative: в тебе; через тебя
  rationale: «На тебе» хорошо соответствует контексту суда над фараоном и сохраняет его как объект проявления силы; «через тебя» могло бы излишне представить его как посредника, а буквальное «в тебе» по-русски допускает нежелательный смысл внутреннего действия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Прописные местоимения в прямой речи отражают принятую русскую издательскую практику. Маркер [a] поставлен непосредственно после спорного выражения, а [b] — после всей цитаты, поскольку поясняет выражение «Моё имя» внутри неё.
