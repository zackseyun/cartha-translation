  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: ru
  text: Но не так, будто слово Божье утратило силу. Ведь не все происходящие от Израиля[a] — Израиль[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «происходящие из Израиля»; греческое выражение указывает на происхождение.'
    reason: lexical_alternative
  - marker: b
    text: Второе имя «Израиль» употреблено в более узком смысле, чем первое; Павел противопоставляет происхождение от Израиля и это второе употребление имени.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Но это не значит, что
  rationale: Естественная русская формула, отрицающая возможный вывод из предыдущего рассуждения; передаёт корректирующий характер греческого оборота.
- source_word: ἐκπέπτωκεν
  choice: не исполнилось
  rationale: В сочетании со «словом Божьим» передаёт мысль о том, что Божье слово не оказалось недействительным и не осталось без осуществления; совершенный вид отражает результативность греческого перфекта.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет широкое значение λόγος и не сужает его заранее до «обещания», хотя в контексте подразумевается Божье слово, содержащее обетование.
- source_word: οὐ γὰρ πάντες
  choice: Ведь не все
  rationale: «Ведь» естественно вводит объяснение предыдущего утверждения и передаёт функцию γάρ.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: происходящие от Израиля
  rationale: Передаёт выраженное предлогом ἐξ происхождение, оставляя открытым вопрос о конкретном характере этой связи.
- source_word: οὗτοι Ἰσραήλ
  choice: — Израиль
  rationale: Краткая именная конструкция сохраняет резкое противопоставление двух употреблений имени «Израиль» без добавления толкования в основной текст.
theological_decisions:
- issue: Значение второго употребления имени «Израиль»
  choice: Оставить в основном тексте более узкий смысл второго «Израиля» без его прямого определения
  alternative: Передать как «истинный Израиль», «избранные из Израиля» или «народ Божий»
  rationale: Контекст различает происхождение от Израиля и более полный смысл принадлежности к Израилю в Божьем замысле, но точный богословский объём этого понятия не следует закреплять переводческим дополнением.
- issue: Смысл неудачи Божьего слова
  choice: «слово Божье не исполнилось»
  alternative: «слово Божье потерпело неудачу» или «утратило силу»
  rationale: Выбранная формулировка естественна по-русски применительно к Божьему слову и обещанию, не заменяя λόγος словом «обещание».
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная, но общепонятная формулировка. Тире перед вторым «Израиль» естественно оформляет русское именное сказуемое и подчёркивает парадокс исходной фразы.
