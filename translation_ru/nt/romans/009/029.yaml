source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: ru
  text: 'И, как ранее сказал Исаия: «Если бы Господь Воинств[a] не оставил нам потомства[b], мы стали бы как Содом и были бы уподоблены Гоморре».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь Саваоф». Греческое Σαβαώθ транслитерирует еврейское слово в Божьем титуле, обычно передаваемом как «Господь Воинств» или «Господь Сил».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «семени»; здесь — уцелевших потомков.'
    reason: lexical_alternative
  - marker: c
    text: Цитата из Исайи 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: И как
  rationale: Естественно связывает стих с предшествующим рассуждением и сохраняет сравнительную силу καθὼς.
- source_word: προείρηκεν
  choice: прежде сказал
  rationale: Передаёт ранее произнесённое и сохраняющее значение высказывание, не превращая его без необходимости в предсказание.
- source_word: κύριος Σαβαὼθ
  choice: Господь Воинств
  rationale: Переводит смысл транслитерированного еврейского титула и сохраняет образ Бога как Владыки небесных воинств; традиционная форма «Господь Саваоф» указана в примечании.
- source_word: ἐγκατέλιπεν
  choice: не оставил
  rationale: Близко передаёт значение оставления в живых или сохранения некоторого потомства без добавления отсутствующего в тексте слова «остаток».
- source_word: σπέρμα
  choice: потомства
  rationale: В данном контексте буквальное «семя» означает уцелевших потомков; «потомство» ясно и естественно по-русски.
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: мы стали бы как Содом
  rationale: Условная форма передаёт нереальное следствие, а «стали бы» точно отражает γίνομαι.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: были бы уподоблены Гоморре
  rationale: Сохраняет пассивную форму ὁμοιόω и отличие второго глагола от предшествующего «стали бы».
theological_decisions:
- issue: Передача Божьего титула κύριος Σαβαώθ
  choice: Господь Воинств
  alternative: Господь Саваоф
  rationale: Основной текст раскрывает значение титула, тогда как примечание сохраняет знакомую русскую транслитерацию и указывает на форму греческого текста.
- issue: Следует ли переводить σπέρμα словом «остаток»
  choice: потомство
  alternative: остаток; семя
  rationale: Контекст действительно связан с уцелевшим остатком, однако в самой цитате стоит σπέρμα — «семя, потомство». Выбор не подменяет слово богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис условного периода сохранён ясным и естественным; пара глаголов ἐγενήθημεν / ὡμοιώθημεν намеренно не сведена к одному выражению.
