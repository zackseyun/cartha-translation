base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: ru
  text: 'Как и у Осии он говорит: «„Не Мой народ“ назову „Моим народом“, и нелюбимую[a] — любимой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально здесь стоит форма женского рода единственного числа: «ту, которая не была любима».'
    reason: source_form
  - marker: b
    text: 'Возможно также: «возлюбленной». В греческом употреблено слово из той же семьи, что и глагол «любить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: как … и
  rationale: Передаёт сравнительно-подтверждающую связь с предыдущим рассуждением и естественно вводит ещё одно свидетельство Писания.
- source_word: ἐν τῷ Ὡσηὲ
  choice: у Осии
  rationale: Естественная русская формула ссылки на книгу пророка Осии; она не требует пояснительного добавления «в книге».
- source_word: λέγει
  choice: он говорит
  rationale: 'Сохраняет личную форму греческого текста: подразумевается Бог, говорящий в Писании.'
- source_word: Καλέσω
  choice: назову
  rationale: В данном контексте καλέω означает дать имя или обозначить принадлежность. «Назову» естественно сочетается с двойным винительным и сохраняет мотив переименования у Осии.
- source_word: τὸν οὐ λαόν μου
  choice: Не Мой народ
  rationale: Сохраняет формально единственное, но собирательное выражение и его связь с пророческим именем; в русском слово «народ» естественно имеет коллективное значение.
- source_word: λαόν μου
  choice: Моим народом
  rationale: Передаёт устойчивую формулу отношений завета и грамматически соответствует конструкции с «назову».
- source_word: τὴν οὐκ ἠγαπημένην
  choice: нелюбимую
  rationale: Сохраняет женский род, единственное число и пассивный смысл причастия, существенные для цитаты из Осии.
- source_word: ἠγαπημένην
  choice: любимой
  rationale: Передаёт того, кто является предметом любви, и сохраняет прямой словесный контраст с «нелюбимую».
theological_decisions:
- issue: Собирательное или индивидуальное значение первой части цитаты
  choice: Сохранено единственное по форме выражение «Не Мой народ», естественно понимаемое собирательно.
  alternative: «Тех, кто не был Моим народом, назову Моим народом».
  rationale: Греческая форма единственного числа относится к народу как целому. Русское «народ» уже имеет собирательное значение и позволяет не устранять пророческую форму именования.
- issue: Женский род во второй части цитаты
  choice: «нелюбимую — любимой»
  alternative: Нейтрализованное «того, кто не был любим, — любимым».
  rationale: Женский род явно выражен в греческом тексте и связывает формулировку Павла с образом из Осии; его следует сохранить без уточнения личности или аллегорического референта.
- issue: Говорящий в формуле цитирования
  choice: «он говорит»
  alternative: «сказано» или «Писание говорит».
  rationale: Личная форма сохраняет представление о Боге как говорящем через Писание, но строчная буква не добавляет отсутствующего в оригинале типографского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Краткая симметричная конструкция сохраняет пророческий характер именования, собирательное значение слова «народ» и явно выраженный женский род второй пары. Заглавные буквы внутри цитаты обозначают прямую речь Бога и принадлежность Ему, а местоимение автора цитаты перед кавычками оставлено со строчной буквы, чтобы не вносить дополнительного толкования.
