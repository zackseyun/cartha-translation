  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: ru
  text: Ибо Господь исполнит Своё слово[a] на земле[b], доведя его до конца и сократив[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнит дело»; возможно также: «приведёт в исполнение приговор».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в стране». Такой перевод отражает контекст слов Исайи, тогда как греческий текст Послания к римлянам буквально говорит «на земле».'
    reason: cross_reference
  - marker: c
    text: «Сократив» можно также понять как «урезав» или, по смыслу, «исполнив в краткий срок».
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: Своё слово
  rationale: В сочетании с ποιήσει существительное λόγος обозначает сказанное или объявленное Господом, которое Он осуществит. «Своё» естественно поясняет принадлежность слова субъекту, не добавляя нового референта; варианты «дело» и «приговор» сохранены в примечании.
- source_word: γὰρ
  choice: ибо
  rationale: Союз вводит основание или пояснение к предыдущему утверждению Павла; «ибо» кратко и уместно передаёт аргументативную связь в литературном русском языке.
- source_word: συντελῶν
  choice: доведя его до конца
  rationale: Передаёт значение завершения и достижения намеченного итога, а деепричастная конструкция выражает сопутствующий образ действия Господа.
- source_word: καὶ συντέμνων
  choice: и сократив
  rationale: Сохраняет буквальный и выразительный смысл «сокращать, урезать», не сводя его без необходимости к толкованию «быстро исполнить».
- source_word: ποιήσει
  choice: исполнит
  rationale: С объектом «слово» глагол означает осуществить сказанное. Русское «исполнит слово» естественно передаёт эту связь и сохраняет декларативный оттенок λόγος.
- source_word: κύριος
  choice: Господь
  rationale: Устоявшееся и контекстуально точное обозначение Бога в цитате из Писания.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Наиболее прямое значение греческой фразы в тексте Послания к римлянам. Более узкое «в стране» возможно с учётом исходного контекста Исайи и отмечено в примечании.
theological_decisions:
- issue: Характер действия Господа в цитате из Исайи
  choice: Господь решительно осуществит сказанное Им, доведя его до завершения и сократив.
  alternative: Господь быстро приведёт в исполнение судебный приговор.
  rationale: В словах λόγος и συντέμνω возможны судебные оттенки и представление о быстром исполнении, однако греческий текст не требует явно закреплять только это толкование. Основной перевод сохраняет образность и богословское напряжение.
translation_notes:
  register: Современный литературный и возвышенный, но общепонятный русский язык. Формулировка сохраняет компактность цитаты, последовательность образов завершения и сокращения, а также неоднозначность слов λόγος и συντέμνω.
