translation:
  language: ru
  text: Они — израильтяне; им принадлежат усыновление[c], слава[b], заветы, дарование Закона, богослужение[d] и обещания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Под «славой», вероятно, подразумевается явленное присутствие Бога среди Израиля.
    reason: cross_reference
  - marker: c
    text: 'Или: «принятие в сыновья»; или: «сыновство».'
    reason: lexical_alternative
  - marker: d
    text: То есть установленное заветом поклонение и служение Израиля Богу.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: то есть израильтяне
  rationale: Оборот поясняет, кем являются упомянутые ранее соплеменники Павла. «То есть» естественно передаёт пояснительно-качественную силу οἵτινες, не утяжеляя русскую фразу.
- source_word: ὧν
  choice: Им принадлежат
  rationale: Родительное относительное местоимение выражает принадлежность; такая конструкция ясна и естественна в современном русском языке.
- source_word: υἱοθεσία
  choice: усыновление
  rationale: Сохраняет метафору принятия в сыновнее положение и в данном контексте обозначает заветный статус Израиля как народа.
- source_word: δόξα
  choice: слава
  rationale: Передаёт краткость и богословскую насыщенность греческого выражения, не вводя толкование прямо в основной текст.
- source_word: διαθῆκαι
  choice: заветы
  rationale: Сохраняет множественное число исходного текста и обычную библейскую терминологию.
- source_word: νομοθεσία
  choice: дарование Закона
  rationale: Обозначает не просто Закон, а событие и акт его дарования; прописная буква указывает на Моисеев Закон.
- source_word: λατρεία
  choice: богослужение
  rationale: Естественно передаёт установленное Богом культовое служение Израиля, не сужая его исключительно до храмовых или священнических действий.
- source_word: ἐπαγγελίαι
  choice: обещания
  rationale: Сохраняет множественное число и ясно указывает на данные Израилю Божьи обещания.
theological_decisions:
- issue: Значение υἱοθεσία применительно к Израилю
  choice: «усыновление» как заветное сыновнее положение Израиля
  alternative: «сыновство» или «принятие в сыновья»
  rationale: Контекст перечисляет исторические преимущества Израиля как народа. «Усыновление» сохраняет метафору, не сводя её к индивидуальному спасению.
- issue: Референт ἡ δόξα
  choice: Оставлено «слава»
  alternative: «Божественная слава» или «явленное присутствие Бога»
  rationale: Вероятно, имеется в виду явленная среди Израиля слава Бога, однако исходный текст говорит просто «слава»; неоднозначность сохранена в основном тексте и пояснена в сноске.
- issue: Объём значения λατρεία
  choice: «богослужение»
  alternative: «храмовое служение» или «служение Богу»
  rationale: Слово обозначает установленное заветом поклонение и служение Богу; выбранный вариант сохраняет культовый смысл без неоправданного сужения.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным библейским регистром. Перечень сохранён ритмичным и компактным; архаизмы и конфессионально окрашенные уточнения исключены. Маркер [a] из английского консультационного слоя не перенесён, поскольку его содержание там не соответствует собственной формулировке основного текста и, по-видимому, возникло из-за смещения сноски.
