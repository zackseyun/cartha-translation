  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: ru
  text: Говорю истину в Мессии[a], не лгу; моя совесть свидетельствует вместе со мной[b] в Святом Духе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе». Греческое Χριστός может употребляться как титул «Мессия» и как закрепившееся именование «Христос».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «причём моя совесть свидетельствует вместе со мной»; греческая причастная конструкция обозначает сопутствующее подтверждение.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «в святом духе», если понимать это как освящённый человеческий дух; однако у Павла здесь естественнее видеть указание на Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Я говорю истину
  rationale: Прямо передаёт идиоматическое сочетание «говорить истину» и сохраняет торжественный характер утверждения.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός исторически является титулом «Помазанник / Мессия»; вариант сохраняет его титульный смысл и конструкцию с ἐν.
- source_word: οὐ ψεύδομαι
  choice: и не лгу
  rationale: Краткая современная формулировка точно передаёт усиленное отрицание неправды.
- source_word: συμμαρτυρούσης
  choice: а ... свидетельствует вместе со мной
  rationale: Передаёт сопутствующее свидетельство совести и сохраняет значение приставки συν- — «вместе, совместно»; союз «а» естественно присоединяет подтверждение к отрицанию.
- source_word: τῆς συνειδήσεώς μου
  choice: моя совесть
  rationale: Обычный и ясный русский эквивалент συνείδησις с естественной передачей притяжательного местоимения.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: В контексте Павла выражение естественнее всего относится к Святому Духу; «в» сохраняет ἐν и не сужает его до исключительно инструментального значения.
theological_decisions:
- issue: Титульное или именное употребление Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Перевод «Мессия» явно передаёт смысл титула, но сноска сохраняет традиционное и вполне возможное в данном контексте «Христос».
- issue: Референт πνεύματι ἁγίῳ
  choice: Святой Дух
  alternative: святой дух, то есть освящённый человеческий дух
  rationale: В словоупотреблении Павла наиболее вероятен божественный Святой Дух, однако отсутствие артикля само по себе не устраняет менее вероятную альтернативу.
- issue: Связь свидетельства совести с утверждением Павла
  choice: совесть свидетельствует вместе с Павлом
  alternative: совесть сама выступает сопутствующим свидетелем его слов
  rationale: Формулировка сохраняет совместное значение συμμαρτυρέω, не определяя точнее, чем греческий текст, характер этого совместного свидетельства.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной интонацией. Сохранены повторное заверение Павла, титульное прочтение Χριστός, совместный оттенок συμμαρτυρούσης и конструкция «в Святом Духе» без излишнего догматического уточнения.
