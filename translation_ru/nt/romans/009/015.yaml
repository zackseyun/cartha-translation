  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: ru
  text: 'Ибо Он говорит Моисею: «Помилую, кого помилую, и пожалею, кого пожалею».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Цитата из Исхода 33:19. Или: «Явлю милость тому, кому являю милость, и проявлю сострадание к тому, к кому проявляю сострадание».'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: Моисею
  rationale: Дательный падеж обозначает адресата речи после λέγει; имя передано в общепринятой русской библейской форме.
- source_word: γὰρ
  choice: Ибо
  rationale: Союз вводит обоснование предыдущего утверждения Павла; «ибо» ясно сохраняет логическую связь и соответствует достойному литературному регистру.
- source_word: λέγει
  choice: Он говорит
  rationale: Сохранено настоящее время формулы цитирования. Местоимение указывает на Бога, непосредственно говорящего Моисею в контексте Исхода, но не вставляет имя, отсутствующее в греческом тексте.
- source_word: Ἐλεήσω ... ἐλεῶ
  choice: Помилую, кого помилую
  rationale: Повтор одного русского глагола воспроизводит лексический повтор и напряжённую, подчёркнутую формулу оригинала, не добавляя идеи выбора, которой в тексте прямо нет.
- source_word: ὃν ἂν
  choice: кого
  rationale: В сочетании с формами глагола конструкция естественно передаётся по-русски относительным местоимением «кого»; неопределённость и открытость объекта сохраняются самой повторной формулой.
- source_word: οἰκτιρήσω ... οἰκτίρω
  choice: пожалею, кого пожалею
  rationale: «Пожалею» сохраняет отличие οἰκτίρω от ἐλεέω и передаёт сострадательное отношение. Повтор воспроизводит параллелизм греческого текста.
theological_decisions:
- issue: Кто говорит в формуле цитирования
  choice: «Он говорит», то есть Бог, говорящий Моисею
  alternative: «Писание говорит Моисею» или безличное «сказано Моисею»
  rationale: В греческом подлежащее не выражено, однако прямая речь в Исх. 33:19 принадлежит Богу. Личное «Он» сохраняет контекст, не делая Писание отдельным подразумеваемым субъектом.
- issue: Свобода Бога в милости и сострадании
  choice: Сохранить повторную формулу без пояснительного расширения
  alternative: «Помилую того, кого захочу помиловать»
  rationale: Слова «захочу» в греческом тексте нет. Буквенная повторность сохраняет подлинное богословское напряжение и не предрешает споры об избрании.
- issue: Различие между ἐλεέω и οἰκτίρω
  choice: Передать как «помилую» и «пожалею»
  alternative: Передать оба глагола через близкие обороты «явлю милость» и «окажу милосердие»
  rationale: 'Разные русские глаголы отражают лексическое различие оригинала: первый акцентирует милость, второй — сострадание. «Пожалею» здесь означает проявлю сострадание, а не буду сожалеть.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Ибо» поддерживает аргументативную связь, а краткие повторные конструкции сохраняют риторическую силу цитаты. Маркер сноски поставлен после всей цитаты, к которой относятся и ссылка, и лексическая альтернатива.
