  text: А Израиль, стремясь к закону праведности[a], этого закона не достиг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к закону справедливости».'
    reason: lexical_alternative
  - marker: b
