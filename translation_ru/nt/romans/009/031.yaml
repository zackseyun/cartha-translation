    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Общепринятая русская форма имени; в контексте рассуждения Павла обозначает Израиль как народ.
- source_word: δέ
  choice: А
  rationale: Передаёт противопоставление предшествующему высказыванию о язычниках естественнее для русского контекста, чем более резкое «но».
- source_word: διώκων
  choice: стремясь
  rationale: Причастие выражает настойчивое движение к цели. Деепричастная конструкция сохраняет сопутствующее действие, не добавляя явно уступительного значения «хотя».
- source_word: νόμον δικαιοσύνης
  choice: к закону праведности
  rationale: Сохраняет сжатую родительную конструкцию греческого текста и не уточняет без необходимости, является ли это законом, характеризующимся праведностью или относящимся к ней.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: В данном контексте Послания к римлянам «праведность» естественно сохраняет богословскую широту термина; возможное «справедливость» отмечено в сноске.
- source_word: εἰς νόμον
  choice: этого закона
  rationale: Указательное «этого» естественно связывает повторное νόμον с уже названным законом, а конструкция с глаголом «достиг» передаётся русским родительным падежом. Сжатость и неоднозначность оборота отмечены в сноске.
- source_word: οὐκ ἔφθασεν
  choice: не достиг
  rationale: Точно выражает недостижение намеченной цели и естественно сочетается в русском языке с родительным падежом.
theological_decisions:
- issue: Значение δικαιοσύνη в контексте рассуждения Павла
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» лучше сохраняет связь с общей темой Послания о правом положении перед Богом, однако лексически возможно и значение «справедливость», поэтому оно приведено в сноске.
- issue: Связь второго νόμον с первым
  choice: этого закона
  alternative: закона / до закона
  rationale: Такой перевод передаёт вероятное возобновление ранее названного понятия, но не разворачивает фразу в богословски истолкованное «цели закона»; иные синтаксические способы понимания отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык, сдержанный и пригодный для публичного чтения. Повтор слова «закон» сохранён ради связи с греческим текстом; уступительное «хотя» не добавлено, поскольку оно не выражено явно.
