  source_fidelity: В черновике точно переданы формула введения цитаты, «на Сионе», «камень преткновения» и будущее страдательное «не будет посрамлён». Однако выражение πέτραν σκανδάλου заменено развернутым «скалу, о которую споткнутся», вследствие чего не передан второй генитивный образ и утрачено соответствие двум параллельным словосочетаниям греческого текста. Личное «в Него» допустимо в контексте Павлова применения, но заглавная буква снимает образно-грамматическую неоднозначность αὐτῷ, которая в самой цитате может относиться к «камню».
  naturalness: «Скала соблазна» — несколько традиционное, но понятное в современном литературном библейском регистре выражение; оно предпочтительнее динамического перифраза, поскольку сохраняет структуру и образность оригинала. «Верующий в него» естественно в пределах образа; примечание поясняет возможное личное прочтение, не навязывая его в основном тексте.
  terminology: «Камень преткновения» и «скала соблазна» сохраняют различие προσκόμματος и σκανδάλου. «Не будет посрамлён» удачно передаёт καταισχυνθήσεται. Сион и Мессия оформлены нормативно; в основном тексте местоимение намеренно не пишется с заглавной буквы, поскольку греческий текст не устраняет референтную неоднозначность.
