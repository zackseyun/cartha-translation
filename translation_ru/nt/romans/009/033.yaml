  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: ru
  text: 'Как написано: «Вот, Я полагаю на Сионе камень преткновения и скалу соблазна[a], и верующий в него[b] не будет посрамлён».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Павел соединяет здесь слова из Ис. 8:14 и 28:16.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «на нём». Местоимение может относиться к камню; в контексте Павел применяет этот образ к Мессии, поэтому возможно и прочтение: «в Него». Также: «не будет разочарован».'
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Устойчивая и естественная по-русски формула введения цитаты из Писания; передаёт результат совершённого написания.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современный литературный эквивалент, сохраняющий указательную и привлекающую внимание силу слова без архаизма.
- source_word: τίθημι
  choice: Я полагаю
  rationale: Сохраняет настоящее время и хорошо сочетается с образом закладываемого камня; чуть торжественнее разговорного «кладу».
- source_word: ἐν Σιὼν
  choice: на Сионе
  rationale: В русском библейском и географическом употреблении Сион осмысляется как место/гора, поэтому «на Сионе» естественнее буквального «в Сионе».
- source_word: λίθον προσκόμματος
  choice: камень преткновения
  rationale: Точно передаёт генитивную конструкцию и является понятным, укоренившимся русским выражением.
- source_word: πέτραν σκανδάλου
  choice: скалу, о которую споткнутся
  rationale: Передаёт скалу как причину падения и сохраняет отличие от «камня преткновения». Конструкция раскрывает образ яснее, чем потенциально двусмысленная «скала соблазна».
- source_word: ὁ πιστεύων
  choice: верующий
  rationale: Естественно и кратко передаёт субстантивированное причастие в обобщённом единственном числе.
- source_word: ἐπ’ αὐτῷ
  choice: в Него
  rationale: Русское управление «веровать в» естественно передаёт смысл греческого πιστεύω ἐπί; личная форма соответствует христологическому применению образа в контексте Павла.
- source_word: οὐ καταισχυνθήσεται
  choice: не будет посрамлён
  rationale: Сохраняет будущую пассивную форму и публичный оттенок стыда/позора, не сводя смысл к субъективному разочарованию.
theological_decisions:
- issue: Референт αὐτῷ в составной цитате из Исаии
  choice: «в Него» — личное отнесение образа камня к Мессии
  alternative: «в него» или «на него» — грамматическое отнесение к камню без явной персонализации
  rationale: В ближайшем контексте Рим 9:32–33 и в повторном цитировании в Рим 10:11 Павел применяет этот образ к Христу. При этом примечание сохраняет буквальную особенность греческой конструкции и не скрывает образный характер антецедента.
- issue: Соотношение образов προσκόμματος и σκανδάλου
  choice: «камень преткновения и скала, о которую споткнутся»
  alternative: «камень преткновения и скала соблазна»
  rationale: Выбранный вариант передаёт оба близких образа падения, но не вносит современное узкое понимание «соблазна» как нравственного искушения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Устойчивые выражения «как написано», «камень преткновения» и «не будет посрамлён» сохранены ради точности и узнаваемости; менее прозрачный оборот «скала соблазна» раскрыт динамически.
