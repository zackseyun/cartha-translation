  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: ru
  text: 'Ты скажешь мне тогда: «Почему же Он всё ещё порицает? Ведь кто воспротивился Его воле[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замыслу», «намерению». Греческое βούλημα может означать волю, намерение или замысел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: ты скажешь
  rationale: Будущее время естественно передаёт риторическое предвосхищение возражения собеседника.
- source_word: μοι
  choice: мне
  rationale: Сохраняет явно выраженный в греческом тексте дательный адресата.
- source_word: οὖν ... οὖν
  choice: тогда ... же
  rationale: 'Обе частицы отражены естественными русскими средствами: первая связывает возражение с предшествующим рассуждением, вторая усиливает вопрос.'
- source_word: Τί οὖν ἔτι
  choice: Почему же ... ещё
  rationale: В сочетании с глаголом порицания τί естественно означает «почему», а ἔτι — «ещё».
- source_word: μέμφεται
  choice: винит
  rationale: Кратко и естественно передаёт значение «обвинять, порицать, ставить в вину»; подразумеваемым субъектом в контексте остаётся Бог.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: Его воле
  rationale: βούλημα обозначает волю, намерение или замысел; «воля» здесь естественно сочетается с «противостоять» и не устраняет смысловую широту, отмеченную в сноске.
- source_word: ἀνθέστηκεν
  choice: противостоял
  rationale: Передаёт совершенную форму и значение стойкого сопротивления или противодействия.
theological_decisions:
- issue: Передача βούλημα в контексте Божьего владычества и человеческой ответственности
  choice: Его воле
  alternative: Его замыслу; Его намерению
  rationale: «Воля» — естественный и достаточно широкий русский эквивалент; сноска сохраняет лексическую неоднозначность. Формулировка не разрешает заложенное в возражении напряжение между Божьей волей и ответственностью человека.
- issue: Неявный субъект μέμφεται
  choice: Он
  alternative: Бог
  rationale: Местоимение сохраняет форму исходного возражения и связь с ближайшим контекстом, не добавляя имени, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос передан кратко и достойно. Прописные местоимения «Он», «Его» обозначают Бога согласно принятой русской библейской стилистике.
