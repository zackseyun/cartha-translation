  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: ru
  text: Итак[a], это зависит не от желающего и не от бегущего[b], а от Бога, Который милует.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Итак, не от желающего и не от бегущего, а от милующего Бога». В греческом предложении подразумеваемое сказуемое не выражено; его смысл определяется контекстом Божьего замысла и милости.'
    reason: lexical_alternative
  - marker: b
    text: «Бегущего» — буквально; вероятно, бег здесь служит образом человеческого усилия или старания.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание выводных частиц подводит итог предшествующему рассуждению; «итак» естественно и ясно передаёт этот логический переход.
- source_word: οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος
  choice: всё зависит не от желающего и не от бегущего
  rationale: Субстантивированные причастия переданы буквально и симметрично. Добавление «всё зависит» восполняет греческий эллипсис, не называя прямо спасение, избрание или иной более узкий референт.
- source_word: τοῦ θέλοντος
  choice: желающего
  rationale: «Желающего» сохраняет волевой оттенок θέλω и звучит в современном литературном русском естественнее, чем «хотящего».
- source_word: τοῦ τρέχοντος
  choice: бегущего
  rationale: Сохраняется буквальный образ бега; возможный переносный смысл человеческого старания поясняется в сноске, а не подменяет исходный образ в тексте.
- source_word: ἀλλὰ τοῦ ἐλεῶντος θεοῦ
  choice: а от Бога, Который милует
  rationale: Сильное противопоставление передано союзом «а», а причастная конструкция — действием Бога, что сохраняет словесный характер ἐλεῶντος.
theological_decisions:
- issue: Эллиптическая конструкция и предмет зависимости
  choice: «всё зависит» без прямого упоминания спасения, избрания или Божьего решения
  alternative: «это не от желающего»; «спасение зависит не от человеческого желания»; «Божий выбор зависит не от человеческой воли»
  rationale: В греческом тексте сказуемое или определяемое понятие не выражено прямо. Контекст связан с Божьим замыслом и милостью, однако конкретизация в основном тексте сузила бы подлинную смысловую напряжённость фразы.
- issue: Соотношение человеческого желания, усилия и Божьей милости
  choice: Сохранить абсолютную форму противопоставления Павла
  alternative: Смягчить утверждение добавлением «только» или пояснить совместное действие Бога и человека
  rationale: Такие уточнения отсутствуют в исходном тексте и могли бы привнести конфессиональное толкование.
translation_notes:
  register: Современный литературный русский с сохранением краткости, риторического параллелизма и торжественной ясности оригинала. Заглавная буква в относительном местоимении «Который» соответствует принятому уважительному оформлению упоминаний о Боге; синтаксис остаётся понятным обычному читателю.
