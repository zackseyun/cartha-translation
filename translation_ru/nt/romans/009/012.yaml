base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: ru
  text: 'не от дел, а от Того, Кто призывает[a], ей было сказано: «Старший[c] будет служить младшему»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не на основании дел, а на основании Того, Кто призывает».'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Быт. 25:23.
    reason: cross_reference
  - marker: c
    text: 'Буквально: «Больший будет служить меньшему»; перевод «старший… младшему» отражает контекст Иакова и Исава.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: не от дел
  rationale: Предлог ἐκ с родительным обозначает источник или основание. Краткая формулировка сохраняет плотный контраст Павла и связь с предыдущим стихом; более разъясняющий вариант вынесен в сноску.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: а от Того, Кто призывает
  rationale: Субстантивированное причастие настоящего времени передано естественным русским оборотом. Настоящее время сохраняет аспект καλοῦντος, а местоименное выражение не добавляет имени Бога, отсутствующего в греческом тексте.
- source_word: ἐρρέθη αὐτῇ
  choice: ей было сказано
  rationale: Безличная пассивная конструкция точно передаёт аорист пассивного залога и не вводит явно названного говорящего.
- source_word: ὅτι
  choice: двоеточие и кавычки
  rationale: Здесь ὅτι вводит прямую речь; в современном русском это естественно выражается пунктуацией.
- source_word: Ὁ μείζων
  choice: Старший
  rationale: Хотя буквально сравнительная форма может означать «больший», в контексте Исава и Иакова речь идёт о старшем из братьев. Буквальная возможность отмечена в сноске.
- source_word: δουλεύσει
  choice: будет служить
  rationale: Глагол может обозначать рабское служение или подчинение, однако нейтральное «служить» сохраняет смысл цитаты, не усиливая без необходимости оттенок рабства.
- source_word: τῷ ἐλάσσονι
  choice: младшему
  rationale: В паре с μείζων и в контексте братьев слово естественно означает младшего; буквальное «меньшему» отмечено как возможная передача греческой формы.
theological_decisions:
- issue: Следует ли развернуть противопоставление дел и Призывающего в явное утверждение о безусловном избрании
  choice: Сохранено краткое противопоставление без богословского пояснения внутри текста.
  alternative: «не вследствие дел, а вследствие решения Бога, Который призывает»
  rationale: Стих противопоставляет дела Божьему призванию, но более широкие выводы формируются из контекста. Их не следует вносить в перевод этого выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Начальная строчная буква сохраняет синтаксическую зависимость фрагмента от предыдущего стиха. Оборот «Тот, Кто призывает» естественнее буквального субстантивированного причастия и сохраняет референцию к Богу без добавочного толкования.
