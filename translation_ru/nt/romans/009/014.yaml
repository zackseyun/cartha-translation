  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: ru
  text: Что же скажем? Неужели Бог несправедлив?[a] Ни в коем случае![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Неужели у Бога есть несправедливость?»; возможный перевод: «Неужели Бог неправеден?»'
