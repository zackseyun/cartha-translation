lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Что же скажем?
  rationale: Естественно передаёт обычную для Павла формулу перехода к выводу или возможному возражению и сохраняет значение будущего времени ἐροῦμεν.
- source_word: μὴ
  choice: Неужели
  rationale: В прямом вопросе частица μή предполагает отрицательный ответ; русское «неужели» естественно передаёт риторический характер вопроса.
- source_word: ἀδικία
  choice: несправедлив
  rationale: Существительное ἀδικία здесь обозначает несправедливость или неправедность. Предикативное прилагательное делает вопрос естественным на современном русском, не меняя его нравственно-судебного смысла.
- source_word: παρὰ τῷ θεῷ
  choice: Бог несправедлив
  rationale: Оборот указывает на несправедливость со стороны Бога. Личная конструкция по-русски звучит яснее, чем буквальное «у Бога есть несправедливость».
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Передаёт резкое и категорическое отрицание Павла естественным современным русским выражением; буквальная форма «Пусть этого не будет!» приведена в примечании.
theological_decisions:
- issue: Следует ли пояснять, каким образом Бог не является несправедливым в контексте рассуждения об избрании.
  choice: Сохранён краткий риторический вопрос и его категорическое отрицание без дополнительных богословских пояснений.
  alternative: Можно было бы расширить перевод упоминанием Божьего избрания, справедливости или права распоряжаться милостью.
  rationale: Греческий текст этого стиха лишь формулирует возражение и решительно отвергает его; добавление объяснения преждевременно разрешило бы напряжение аргумента.
translation_notes:
  register: Современный литературный русский язык; краткая, энергичная риторическая форма. «Ни в коем случае!» сохраняет сильную эмоциональную окраску ответа без архаичности.
