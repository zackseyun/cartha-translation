id: ROM.9.8
reference: Romans 9:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: ru
  text: То есть не дети по плоти являются детьми Божьими, но дети обещания считаются потомством.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: То есть
  rationale: Вводит пояснение к предыдущему утверждению Павла; это естественная и точная русская формула.
- source_word: τέκνα
  choice: дети
  rationale: Передаёт все три употребления гендерно нейтрально и сохраняет их риторическое единство.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: дети по плоти
  rationale: Сохраняет значимый для Павла термин «плоть» и одновременно естественно указывает на происхождение по рождению.
- source_word: τέκνα τοῦ θεοῦ
  choice: дети Божьи
  rationale: Естественно передаёт принадлежность Богу и сохраняет контраст между двумя группами детей.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: дети обещания
  rationale: Сохраняет образное генитивное выражение Павла, не сводя его заранее ни к детям, которым обещано, ни к детям, рождённым в исполнение обещания.
- source_word: λογίζεται
  choice: считаются
  rationale: Передаёт смысл признания или причисления; грамматически подразумеваемого деятеля не добавляет.
- source_word: εἰς σπέρμα
  choice: потомством
  rationale: В контексте Авраама σπέρμα означает потомство; творительный падеж после «считаются» естественно передаёт классифицирующее значение εἰς.
theological_decisions:
- issue: Противопоставление физического происхождения и линии обещания
  choice: Сохранено противопоставление «детей по плоти» и «детей обещания» без уточнения более широкой богословской системы.
  alternative: Явно истолковать стих только в корпоративно-историческом либо индивидуально-предестинарианском ключе.
  rationale: Греческий текст утверждает само различие, но в этом стихе не разрешает все богословские вопросы Рим 9; перевод не должен вносить такое разрешение.
- issue: Кто считает детей обещания потомством
  choice: Деятель не назван, как и в греческой пассивной конструкции.
  alternative: Добавить «Бог считает».
  rationale: Божественное действие вероятно подразумевается, однако его эксплицирование в основном тексте устранило бы формальную недосказанность оригинала.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно возвышенный. Формула «по плоти» сохраняет павловскую лексику, а «потомством» делает генеалогический смысл σπέρμα понятным без архаичного «семя».
