source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: ru
  text: 'Но кто ты, человек, чтобы перечить Богу? Разве скажет созданное тому, кто его создал: «Почему ты сделал меня таким?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Почему ты сделал меня так?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Но
  rationale: Частица усиливает возражение и вносит поправочный оттенок; «но» естественно передаёт резкий поворот в современном русском, не перегружая фразу.
- source_word: ὦ ἄνθρωπε
  choice: человек
  rationale: Прямое обращение в единственном числе обозначает человека как представителя человечества; русское «человек» сохраняет и общий смысл, и риторическую остроту.
- source_word: σὺ τίς εἶ
  choice: кто ты
  rationale: Риторический вопрос выражает вызов притязанию человека, а не просьбу представиться.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: чтобы перечить Богу
  rationale: Глагол означает не просто отвечать, а возражать, противоречить; «перечить» кратко и естественно передаёт эту направленность.
- source_word: μὴ ἐρεῖ
  choice: Разве скажет
  rationale: μή в вопросе предполагает отрицательный ответ; русская конструкция с «разве» ясно сохраняет это ожидание.
- source_word: τὸ πλάσμα
  choice: изделие
  rationale: Существительное обозначает сформированную или вылепленную вещь. «Изделие» сохраняет контраст между созданным предметом и создателем, хотя образ формирования остаётся шире конкретного ремесла.
- source_word: τῷ πλάσαντι
  choice: тому, кто его создал
  rationale: Причастие называет сформировавшего предмет; перевод сохраняет личную соотнесённость создателя и изделия и звучит естественно по-русски.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Почему ты сделал меня таким?
  rationale: Передаёт буквальный смысл «почему ты сделал меня так/таким?» в естественной современной форме.
theological_decisions:
- issue: Представительное значение ἄνθρωπε
  choice: «человек» как обращение к отдельному представителю человечества
  alternative: «о человек» или гендерно маркированное «мужчина»
  rationale: Греческое слово здесь относится к человеку вообще, а не специально к лицу мужского пола; русское «человек» точно сохраняет эту универсальность.
- issue: Риторическая сила упрёка
  choice: «перечить Богу»
  alternative: Более нейтральное «отвечать Богу»
  rationale: ἀνταποκρίνομαι выражает возражение или ответ наперекор; перевод не смягчает подчёркнутое различие между человеком и Богом.
- issue: Отрицательно ожидаемый ответ в μὴ ἐρεῖ
  choice: Передать вопросом с «разве»
  alternative: Нейтральное «скажет ли»
  rationale: Форма вопроса предполагает ответ «нет»; «разве» делает эту прагматическую силу явной, не превращая вопрос в утверждение.
translation_notes:
  register: Современный литературный русский язык с кратким, резким риторическим строем. Обращение «человек» оставлено без архаизирующего «о». Образ созданного предмета и его создателя сохранён без добавления прямого упоминания горшечника, которого в данном стихе нет.
