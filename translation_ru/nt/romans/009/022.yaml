  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: ru
  text: Но что, если Бог[a], желая показать свой гнев и явить своё могущество[b], с великим терпением сносил сосуды гнева, приготовленные к погибели[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но если». В греческом тексте здесь начинается риторическое условное предложение, которое продолжается в следующем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «то, что Ему возможно»; по смыслу — Его сила или могущество.'
    reason: lexical_alternative
  - marker: c
    text: 'Пассивная форма «приготовленные к погибели» не указывает, кто их приготовил. Её понимают по-разному: как действие Бога, как результат собственного ожесточения людей или просто как обозначение их готовности к суду.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но что, если
  rationale: Передаёт риторическое условие, синтаксически продолжающееся в следующем стихе, и не превращает его в законченное утверждение.
- source_word: θέλων
  choice: желая
  rationale: Сохраняет значение причастия намерения или желания, не уточняя без необходимости его логическую связь с главным глаголом.
- source_word: ἐνδείξασθαι τὴν ὀργήν
  choice: показать Свой гнев
  rationale: Естественно передаёт целенаправленное проявление Божьего гнева и сохраняет его судебно-богословский оттенок.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: явить Своё могущество
  rationale: Контекстуально передаёт субстантивированное τὸ δυνατόν как Божью силу; «явить» сохраняет каузативный смысл «сделать известным».
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: с великим долготерпением терпел
  rationale: Передаёт длительное терпеливое перенесение; «долготерпение» уместно в dignified modern literary register, а «терпел» ясно выражает функцию ἤνεγκεν.
- source_word: σκεύη ὀργῆς
  choice: сосуды гнева
  rationale: Сохраняет образ гончара и сосудов из ближайшего контекста, не истолковывая генитив более узко.
- source_word: κατηρτισμένα εἰς ἀπώλειαν
  choice: приготовленные к погибели
  rationale: Сохраняет пассивную форму без указания деятеля; «к погибели» передаёт направленность или итог, не конкретизируя механизм.
theological_decisions:
- issue: Кто приготовил сосуды к погибели в κατηρτισμένα
  choice: 'Оставить деятеля неназванным: «приготовленные к погибели».'
  alternative: «приготовленные Богом», «сделавшие себя готовыми» или «годные к погибели».
  rationale: Греческое перфектное пассивное причастие обозначает состояние приготовленности, но в данном стихе не называет действующего лица; перевод сохраняет эту богословскую напряжённость.
- issue: Незавершённое условное построение с εἰ
  choice: «Но что, если…» с запятой в конце стиха, поскольку мысль продолжается в стихе 23.
  alternative: «Но если…» либо превращение стиха в самостоятельное утвердительное предложение.
  rationale: Риторическая условная конструкция охватывает следующий стих; её незавершённость не следует сглаживать внутри стиха 22.
- issue: Логическая функция θέλων
  choice: Передать нейтральным деепричастием «желая».
  alternative: «хотя желал» (уступка) или «поскольку желал» (причина).
  rationale: Само причастие допускает контекстуальное определение связи, но явно не маркирует ни уступку, ни причину; нейтральный перевод не снимает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образ «сосудов», термин «гнев» и незавершённость условной конструкции; архаичные формы и конфессионально окрашенные уточнения не вводятся.
