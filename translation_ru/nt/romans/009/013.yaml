lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Естественная и устоявшаяся в русском библейском стиле формула введения цитаты; передаёт сравнительное καθὼς и перфектное пассивное γέγραπται.
- source_word: Ἰακὼβ
  choice: Иакова
  rationale: Традиционная русская форма имени; винительный падеж обусловлен греческой конструкцией с вынесенным прямым дополнением.
- source_word: ἠγάπησα
  choice: Я полюбил
  rationale: Прямо передаёт аорист ἀγαπάω; форма совершенного вида естественно звучит в русском и сохраняет утверждение цитаты.
- source_word: δὲ
  choice: а
  rationale: В данном параллельном противопоставлении русский союз «а» звучит естественнее, чем более резкое «но», и ясно сохраняет контраст.
- source_word: Ἠσαῦ
  choice: Исава
  rationale: Традиционная русская форма имени в винительном падеже.
- source_word: ἐμίσησα
  choice: возненавидел
  rationale: Сохраняет прямое и сильное значение μισέω, не заменяя его истолкованиями «отверг» или «полюбил меньше».
theological_decisions:
- issue: Следует ли смягчать выражение «Исава возненавидел» ввиду споров о Божьем избрании и возможном семитском сравнительном употреблении
  choice: Сохранить в основном тексте прямой перевод «возненавидел»
  alternative: «отверг» или «полюбил меньше»
  rationale: Греческая цитата употребляет сильный глагол μισέω. Прямой перевод сохраняет богословское напряжение, тогда как более мягкие варианты уже закрепляют определённое толкование; они отмечены в сноске.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и краткости формулы цитирования. Порядок с вынесенными дополнениями («Иакова… Исава…») сохраняет риторический параллелизм оригинала. Местоимение «Я» добавлено для естественности русского синтаксиса и выделено прописной буквой по принятой русской библейской издательской традиции.
