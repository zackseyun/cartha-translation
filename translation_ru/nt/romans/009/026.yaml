  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: ru
  text: 'И будет так: в том месте, где им было сказано[b]: «Вы не Мой народ», — там их назовут сынами живого Бога[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детьми живого Бога». В греческом тексте буквально: «сынами»; это слово сохранено в основном тексте, чтобы передать язык сыновства и возможный оттенок наследования.'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Ос. 1:10 (2:1 в греческой Септуагинте).
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἔσται
  choice: И будет
  rationale: Сохраняет простой соединительный союз и будущую формулу, вводящую продолжение цитаты; по-русски звучит естественно и торжественно.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: на том самом месте, где
  rationale: Передаёт τόπος и подчёркнутое соответствие между местом прежнего отвержения и будущего восстановления, не меняя смысла.
- source_word: ἐρρέθη αὐτοῖς
  choice: им было сказано
  rationale: Сохраняет безличную пассивную конструкцию и не называет подразумеваемого говорящего.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Вы не Мой народ
  rationale: Естественный русский порядок слов сохраняет ветхозаветную формулу заветной принадлежности «Мой народ».
- source_word: ἐκεῖ
  choice: там
  rationale: Кратко сохраняет акцент на обращении приговора именно в том же месте.
- source_word: κληθήσονται
  choice: их назовут
  rationale: Естественная русская неопределённо-личная форма передаёт греческий пассив, не уточняя подразумеваемого деятеля.
- source_word: υἱοὶ
  choice: сынами
  rationale: Точно передаёт мужской род и множественное число греческого слова, сохраняя возможные ассоциации сыновства и наследования; более широкое по референции «детьми» дано в примечании.
- source_word: θεοῦ ζῶντος
  choice: живого Бога
  rationale: Устоявшееся и точное соответствие, сохраняющее библейское противопоставление живого Бога идолам.
theological_decisions:
- issue: Передача υἱοὶ как репрезентативного множественного числа
  choice: сынами
  alternative: детьми; сыновьями и дочерьми
  rationale: В греческом стоит именно υἱοὶ, а не нейтральное τέκνα. «Сынами» сохраняет форму источника и оттенки сыновства и наследования, тогда как примечание поясняет возможность более широкого понимания референтов.
- issue: Заветная идентичность в выражении λαός μου
  choice: Мой народ
  alternative: принадлежащий Мне народ
  rationale: «Мой народ» — узнаваемая и лаконичная формула завета из контекста Осии; её не следует разворачивать в толкование.
- issue: Подразумеваемый деятель при κληθήσονται
  choice: их назовут
  alternative: Бог назовёт их
  rationale: Греческий текст оставляет деятеля невыраженным. Русская неопределённо-личная конструкция сохраняет эту неопределённость и не вносит явного субъекта.
translation_notes:
  register: Современный литературный русский с умеренно торжественным ритмом библейской цитаты. Заглавная буква в «Мой» обозначает речь Бога и соответствует принятой русской библейской практике. Тире после цитаты помогает ясно связать противопоставленные высказывания.
