  source_fidelity: 'Основной смысл передан точно: сохранены будущее время, безличный пассив («им было сказано»), формула «Мой народ», повторное указание на место и пассивное «их назовут». Однако «на том самом месте» добавляет акцент «самом/very», которого в греческом тексте нет: ἐν τῷ τόπῳ означает «в том месте», тогда как ἐκεῖ отдельно передаётся словом «там».'
  naturalness: 'Конструкция «И будет: на том самом месте» несколько тяжеловесна для современного литературного русского. «И будет так: в том месте, где…» естественнее, при этом сохраняет торжественный цитатный ритм и синтаксическую связь.'
  terminology: «Мой народ» точно сохраняет заветную формулу. «Сынами живого Бога» корректно передаёт υἱοὶ θεοῦ ζῶντος; примечание с вариантом «детьми» уместно. Заглавная буква в «Мой» допустима как оформление божественной речи. Сноска b должна называть этот текст цитатой, а не неопределённо «цитатой или отсылкой», поскольку формулировка соответствует Ос. 1:10 (2:1 LXX).
