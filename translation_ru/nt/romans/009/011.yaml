    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: Ведь ещё до того, как они родились
  rationale: Передаёт временное значение μήπω в составе родительного самостоятельного оборота и сохраняет пояснительную связь γάρ с предыдущим стихом.
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: и сделали что-либо доброе или дурное
  rationale: В конструкции после «до того, как» отрицательный смысл естественно выражается всей временной конструкцией. «Дурное» образует идиоматичную пару с «доброе», не усиливая φαῦλον до однозначно «злого».
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет наиболее естественное целевое значение союза, не исключая контекстуального оттенка результата.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: Божий замысел, основанный на избрании
  rationale: «Замысел» естественно передаёт πρόθεσις, а формулировка с «избранием» сохраняет структуру κατ’ ἐκλογήν и её богословский вес без уточнения предмета или механизма избрания.
- source_word: μένῃ
  choice: оставался в силе
  rationale: Передаёт значение продолжающегося, устойчивого действия Божьего замысла; буквальное «оставался» возможно, но по-русски здесь требует смыслового дополнения.
theological_decisions:
- issue: Значение ἵνα в контексте избрания
  choice: целевая конструкция «чтобы ...»
  alternative: результативное «так что ...»
  rationale: Греческий синтаксис естественно допускает цель; перевод не разворачивает её в систему предопределения и не снимает богословского напряжения.
- issue: Передача ἐκλογή
  choice: избрание
  alternative: выбор
  rationale: «Избрание» сохраняет устойчивый для Павловой лексики термин и не уточняет сверх текста, относится ли выражение к акту выбора, его принципу или результату.
- issue: Отношение κατ’ ἐκλογὴν к πρόθεσις
  choice: «замысел, основанный на избрании» с примечанием о более буквальном варианте
  alternative: «замысел избрания» / «избирающий замысел»
  rationale: Основной вариант понятен современному читателю, а сноска сохраняет структурную неоднозначность греческого выражения и не делает «избрание» однозначно содержанием либо действием замысла.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Стих представляет собой незавершённую часть длинного предложения, поэтому сохранены тире и конечная запятая, связывающие его с продолжением в Рим 9:12. Все сноски отмечены в основном тексте.
