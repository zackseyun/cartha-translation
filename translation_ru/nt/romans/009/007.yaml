    text: 'Или: «Через Исаака будет названо твоё потомство». Греческое выражение допускает смысл обозначения или признания линии потомства; это цитата из Бытия 21:12.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα
  choice: И не все дети только потому, что они — потомство Авраама
  rationale: Передаёт дополнительное отрицание οὐδέ и причинную силу ὅτι естественным современным русским синтаксисом. «Потомство» сохраняет собирательное значение единственного числа σπέρμα, а «дети» точно передаёт гендерно нейтральное τέκνα.
- source_word: ἀλλ’
  choice: Напротив
  rationale: Выражает резкое противопоставление и исправление предыдущего предположения.
- source_word: Ἐν Ἰσαὰκ
  choice: В Исааке
  rationale: Формально сохраняет ἐν и узнаваемую формулировку цитаты Бытия 21:12, не заменяя её заранее истолкованным «через Исаака».
- source_word: κληθήσεταί σοι σπέρμα
  choice: наречётся тебе потомство
  rationale: «Наречётся» сохраняет пассивное значение καλέω и библейский характер прямой цитаты; дательное σοι передано как «тебе», без превращения в более истолковывающее «твоим» или «будет считаться».
theological_decisions:
- issue: Соотношение физического происхождения от Авраама и статуса детей
  choice: Стих отрицает, что все физические потомки Авраама тем самым являются детьми в подразумеваемом контекстом смысле.
  alternative: Прямо добавить «дети Божьи», «дети обетования» или систематическое объяснение избрания.
  rationale: В самом стихе сказано лишь τέκνα; уточнение развивается в ближайшем контексте. Перевод сохраняет напряжение и не вносит богословское толкование в текст.
- issue: Смысл κληθήσεται в цитате
  choice: наречётся
  alternative: будет считаться; будет признано; произойдёт через Исаака
  rationale: Формальное «наречётся» сохраняет многозначность называния, обозначения и признания линии потомства, не разрешая её за читателя.
translation_notes:
  register: Основной текст написан современным литературным русским языком. В самой ветхозаветной цитате сохранено умеренно возвышенное «наречётся», уместное для цитатной формулы и позволяющее передать неоднозначность καλέω. Маркер сноски поставлен непосредственно после цитаты.
