  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: ru
  text: Почему? Потому что не на основании веры[a], а как будто на основании дел[b]. Они споткнулись о камень преткновения[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не верой». Буквально: «не от веры».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а словно от дел». Греческое выражение сохраняет оттенок «как будто».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «камень, о который спотыкаются»; возможен также перевод «камень соблазна».'
    reason: lexical_alternative
  - marker: d
    text: Отсылка к Ис. 8:14; ср. также Ис. 28:16 в следующем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: διὰ τί;
  choice: Почему?
  rationale: Краткий естественный вопрос сохраняет риторическую силу греческого выражения.
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит прямой ответ с указанием причины.
- source_word: οὐκ ἐκ πίστεως
  choice: не от веры
  rationale: Сохраняет значение предлога ἐκ («из, от») и ключевой для контекста термин πίστις, не сужая его до одной интерпретации.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: а словно от дел
  rationale: «Словно» передаёт ограничивающий оттенок ὡς и не превращает выражение в более категоричное «по делам».
- source_word: προσέκοψαν
  choice: они споткнулись
  rationale: Передаёт конкретный образ столкновения с препятствием и поддерживает словесную связь с последующим «камнем преткновения».
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: о камень преткновения
  rationale: Устойчивое и понятное русское библейское выражение сохраняет образ камня, вызывающего падение.
theological_decisions:
- issue: Значение πίστις в противопоставлении веры и дел
  choice: вера
  alternative: доверие; верность
  rationale: В контексте Послания к римлянам «вера» естественно сохраняет богословски значимый термин Павла, не навязывая более узкого смысла.
- issue: Сила выражения ὡς ἐξ ἔργων
  choice: словно от дел
  alternative: как будто на основании дел; по делам
  rationale: Частица ὡς требует сохранить оттенок «как если бы»; перевод «по делам» устранил бы эту существенную оговорку.
- issue: Значение πρόσκομμα
  choice: преткновение
  alternative: соблазн; препятствие
  rationale: «Преткновение» сохраняет физический образ спотыкания и связь с глаголом προσέκοψαν, не сводя смысл к внутреннему оскорблению или соблазну.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и риторического движения оригинала. Традиционное выражение «камень преткновения» понятно современному читателю и поддерживает исходную словесную игру; более прозрачный вариант дан в сноске.
