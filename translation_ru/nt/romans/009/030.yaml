  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: ru
  text: Что же скажем? Язычники[b], не стремившиеся к праведности[a], достигли праведности — праведности от веры[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости»; греч. δικαιοσύνη может обозначать праведность, правоту или справедливость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «народы». Здесь имеются в виду нееврейские народы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «праведности, приходящей через веру»; менее вероятно здесь: «праведности, исходящей из верности».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Что же скажем?
  rationale: Сохраняет характерную для Павла переходную формулу и совещательный оттенок будущего времени, оставаясь естественным по-русски.
- source_word: ἔθνη
  choice: язычники
  rationale: В данном контексте слово обозначает неевреев в противопоставлении Израилю; «язычники» яснее буквального «народы».
- source_word: τὰ μὴ διώκοντα
  choice: не стремившиеся
  rationale: Передаёт длительную или характерную направленность действия настоящего причастия, не предполагая, что речь лишь об одном завершённом поступке.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: Сохраняет устойчивый и богословски ёмкий русский эквивалент, не сужая значение до одного лишь юридического статуса или нравственного качества.
- source_word: κατέλαβεν
  choice: достигли
  rationale: По смыслу контекста глагол означает обретение или достижение того, к чему прежде не стремились; согласование во множественном числе естественно для русского собирательного обозначения людей.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: праведности — праведности, которая от веры
  rationale: Повтор существительного и тире передают уточняющее приложение. Такая формулировка сохраняет ἐκ как «от» и не превращает δέ в более сильное противопоставление, чем требует контекст.
- source_word: πίστεως
  choice: веры
  rationale: В этой конструкции наиболее вероятно значение веры или доверия; буквальная связь «от веры» оставляет богословскую формулировку без лишнего расширения.
theological_decisions:
- issue: Значение δικαιοσύνη в рассуждении Павла
  choice: праведность
  alternative: справедливость; правое положение перед Богом; статус принадлежности к завету
  rationale: «Праведность» сохраняет широту термина у Павла и не навязывает стиху единственное конфессиональное объяснение.
- issue: Смысл ἐκ πίστεως
  choice: от веры
  alternative: через веру; исходящая из верности
  rationale: Близкая к греческой конструкции передача не добавляет выражения «только верой» и сохраняет возможную смысловую напряжённость.
- issue: Функция δέ в заключительной фразе
  choice: уточнение посредством тире
  alternative: но праведности, которая от веры
  rationale: Здесь повторное δικαιοσύνη с определяющей конструкцией прежде всего уточняет, какого рода праведность была достигнута. Тире естественно передаёт это в русском, не исключая лёгкого корректирующего оттенка δέ.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксический повтор «праведности — праведности» намеренно сохранён как риторическое уточнение оригинала; архаические формы и конфессионально нагруженные добавления исключены.
