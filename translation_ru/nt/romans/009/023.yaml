review_pass:
  verdict: revise
  source_fidelity: '«Над сосудами милости» в русском языке обычно обозначает положение или превосходство над кем-либо и потому неточно передаёт ἐπὶ с винительным в данном контексте. «На сосудах милости» сохраняет образ проявления славы на её носителях и ближе к направленному употреблению ἐπί. Остальные элементы точно отражают греческий текст: целевое ἵνα, «богатство Его славы», действительный аорист «Он заранее приготовил» и εἰς δόξαν.'
  naturalness: Начальная незавершённая связка «и чтобы» уместна, поскольку стих продолжает синтаксис предыдущего. «Явить ... на сосудах милости» несколько возвышенно, но естественно для современного литературного библейского регистра и яснее, чем «над сосудами милости».
  terminology: «Сосуды милости» последовательно сохраняет павловскую метафору σκεύη ἐλέους. «Слава» и «заранее приготовил для славы» переданы без богословских добавлений.
  issues:
  - severity: medium
    issue: «над сосудами милости»
    rationale: Русское «над» добавляет пространственный либо иерархический оттенок, которого в данном употреблении ἐπὶ нет. Более точное «на сосудах милости» передаёт проявление богатства славы на этих «сосудах», не превращая их в объект господства.
  revised_text: и чтобы явить богатство Своей славы на сосудах милости, которые Он заранее приготовил для славы,
