  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: ru
  text: и чтобы явить богатство Своей славы на сосудах милости, которые Он заранее приготовил для славы,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσῃ
  choice: явить
  rationale: Передаёт значение «сделать известным, показать» естественно и торжественно; в данном контексте речь идёт о раскрытии Божьей славы.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: богатство Своей славы
  rationale: Сохраняет образ богатства и принадлежность славы Богу; возвратное «Своей» естественно при подлежащем «Он» в контексте.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: над сосудами милости
  rationale: Сохраняет направленность и образ греческого ἐπί с винительным, не заменяя его более толковательным «для»; «сосуды милости» воспроизводит метафору Павла.
- source_word: προητοίμασεν
  choice: заранее приготовил
  rationale: Точно передаёт временную приставку προ- и действие подготовки.
- source_word: εἰς δόξαν
  choice: для славы
  rationale: Естественно выражает цель или предназначение, заложенные в εἰς, не уточняя сверх текста, идёт ли речь исключительно о будущей славе.
theological_decisions:
- issue: Связь Божьего действия с «сосудами милости»
  choice: «над сосудами милости»
  alternative: «для сосудов милости» / «по отношению к сосудам милости»
  rationale: Формулировка удерживает образ проявления богатства славы над/на людях, не сводя ἐπί лишь к выгоде получателей.
- issue: Предварительное приготовление к славе
  choice: «которые Он заранее приготовил для славы»
  alternative: «которые были заранее приготовлены для славы»
  rationale: Греческий глагол стоит в действительном залоге и подразумевает Бога как действующее лицо; перевод сохраняет это, не добавляя объяснения о механизме или основаниях приготовления.
translation_notes:
  register: Современный литературный русский с сохранением павловской метафоры «сосуды милости» и синтаксической связи со стихом 22; начальное «и чтобы» намеренно отражает незавершённую конструкцию исходного предложения.
