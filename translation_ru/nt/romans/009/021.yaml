id: ROM.9.21
reference: Romans 9:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: ru
  text: Или разве горшечник не властен над глиной[a][d], чтобы из одной и той же массы[b] сделать один сосуд для чести, а другой — для бесчестия[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве горшечник не имеет права распоряжаться глиной».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из одного и того же кома» или «из одного и того же замеса».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «один сосуд для почётного употребления, а другой — для обычного».'
    reason: alternative_reading
  - marker: d
    text: 'Этот образ перекликается с ветхозаветными текстами о горшечнике и глине: Ис. 29:16; 45:9; Иер. 18:1–6.'
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит следующий риторический вопрос и естественно продолжает ход рассуждения Павла без добавочного усиления.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: разве ... не властен
  rationale: Передаёт законное право распоряжаться и власть, а не только физическую способность; по-русски естественно сочетается с «над глиной».
- source_word: ὁ κεραμεὺς
  choice: горшечник
  rationale: Точное современное обозначение мастера, работающего с глиной; сохраняет ветхозаветный образ.
- source_word: τοῦ πηλοῦ
  choice: над глиной
  rationale: Родительный падеж при ἐξουσία выражает сферу власти; русская конструкция «властен над» естественно передаёт это отношение.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: из одной и той же массы
  rationale: φύραμα обозначает замешанную массу или ком материала. «Масса» ясно относится к глине и не вызывает посторонней ассоциации с отдельным комком.
- source_word: ποιῆσαι
  choice: сделать
  rationale: Прямой и естественный эквивалент общего глагола «делать»; контекст горшечника уже подразумевает придание формы.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: один ... а другой
  rationale: Естественно воспроизводит сопоставление и контраст μέν...δέ.
- source_word: εἰς τιμὴν
  choice: для почётного назначения
  rationale: Сохраняет значение чести и достоинства, а слово «назначение» естественно передаёт направленность εἰς, не сводя образ исключительно к бытовому употреблению.
- source_word: σκεῦος
  choice: сосуд
  rationale: Точный и узнаваемый эквивалент в образе горшечника.
- source_word: εἰς ἀτιμίαν
  choice: для непочётного
  rationale: Сохраняет прямую противоположность τιμή и ἀτιμία, не усиливая смысл до позора и не сужая его до обыденного употребления.
theological_decisions:
- issue: Передача ἐξουσία в тексте, связанном с вопросами Божьей власти и человеческой ответственности
  choice: властен
  alternative: имеет право; имеет власть
  rationale: «Властен» включает правомерную свободу распоряжения, но не превращает метафору в развёрнутую догматическую формулу и сохраняет напряжение контекста.
- issue: Следует ли понимать εἰς τιμὴν / εἰς ἀτιμίαν как конкретные виды употребления сосудов
  choice: для почётного назначения ... для непочётного
  alternative: для чести ... для бесчестия; для почётного употребления ... для обычного
  rationale: Перевод сохраняет противопоставление чести и отсутствия чести, одновременно делая русскую фразу естественной. Он не ограничивает смысл только домашними функциями сосудов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Риторический вопрос сохранён. «Сосуд» уместен в метафоре и не воспринимается как ненужно архаичный; «почётное/непочётное назначение» проясняет русскую синтаксическую связь, не устраняя смысловую открытость греческого выражения.
