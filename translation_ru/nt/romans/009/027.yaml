source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: ru
  text: 'А Исаия восклицает об Израиле: «Даже если число сынов Израиля[a] будет как песок морской[b], спасётся лишь остаток[c][d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей Израиля», то есть израильтян. Буквально: «сынов Израиля» — традиционное обозначение народа завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более буквально: «Если число сынов Израиля будет как песок морской». В данном контексте условный оборот имеет уступительный оттенок.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «остаток спасётся». Слово «лишь» передаёт подразумеваемое противопоставление многочисленности народа и спасению остатка.'
    reason: translation_clarity
  - marker: d
    text: 'Или: «будет избавлен». Эти слова перекликаются с пророчеством Исаии об уцелевшем остатке.'
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передаёт переход с лёгким противопоставлением к предшествующей мысли, не делая его чрезмерно резким.
- source_word: κράζει
  choice: восклицает
  rationale: Сохраняет образную силу глагола и настоящее время; речь идёт о громком, настойчивом пророческом провозглашении.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: об Израиле
  rationale: В контексте введения цитаты ὑπέρ естественно означает тему высказывания, а не действие в защиту Израиля.
- source_word: Ἐὰν ᾖ
  choice: Даже если … будет
  rationale: Естественно передаёт условную конструкцию с уступительным оттенком и сохраняет её формальную условность лучше, чем однозначное «хотя».
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохраняет традиционное заветное обозначение и формальный образ исходного текста; более привычные современные соответствия даны в примечании.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: как песок морской
  rationale: Передаёт узнаваемый библейский образ в естественной и торжественной русской формулировке.
- source_word: τὸ ὑπόλειμμα
  choice: остаток
  rationale: Точный и устоявшийся термин для уцелевшей части народа в пророческом контексте.
- source_word: σωθήσεται
  choice: спасётся
  rationale: Сохраняет основной смысл глагола в контексте Послания к римлянам и его богословскую весомость, не исключая оттенка избавления в цитируемом пророчестве.
theological_decisions:
- issue: Смысл условного оборота Ἐὰν ᾖ
  choice: «Даже если … будет» — условная форма с уступительным оттенком
  alternative: «Если … будет» или «Хотя число … будет»
  rationale: Такой перевод ясно выражает противопоставление многочисленного Израиля и спасающегося остатка, но не устраняет условную форму греческого текста.
- issue: Значение σωθήσεται
  choice: «спасётся»
  alternative: «будет избавлен» или «уцелееет»
  rationale: «Спасётся» наиболее естественно в ближайшем контексте Рим 9–11 и сохраняет богословскую напряжённость; пророческий оттенок избавления отмечен в сноске.
- issue: Ограничительный смысл выражения τὸ ὑπόλειμμα
  choice: «спасётся лишь остаток»
  alternative: 'Более формально: «остаток спасётся»'
  rationale: «Лишь» естественно раскрывает подразумеваемое противопоставление огромного числа и остатка, не определяя состав остатка и не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка «песок морской» сохраняет узнаваемость цитаты, а «восклицает» — силу пророческой речи. Все неоднозначности, значимые для смысла, вынесены в краткие примечания.
