  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: ru
  text: Им принадлежат праотцы, и от них по плоти[a] — Мессия, который над всем, — Бог, благословенный во веки[b]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по человеческому происхождению». Буквально: «по плоти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, если понимать последнюю часть как отдельное славословие: «Да будет благословен во веки Бог, сущий над всем. Аминь», а не как характеристику Мессии.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: отцы
  rationale: 'Сохраняет близкий к греческому тексту заветно-исторический смысл: речь о почитаемых предках Израиля. «Праотцы» было бы яснее в некоторых контекстах, но несколько сужало бы выражение.'
- source_word: ἐξ ὧν
  choice: от них
  rationale: Естественно по-русски передаёт происхождение Мессии из среды израильтян, к которым относится местоимение.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Здесь Χριστός употреблено как титул и связано с перечислением преимуществ Израиля; «Мессия» ясно передаёт этот титульный смысл.
- source_word: τὸ κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет формулировку Павла и обозначает земное, человеческое происхождение, не подразумевая здесь греховность. Поясняющий смысл дан в сноске.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: который превыше всего
  rationale: Естественно передаёт продолженное описание Мессии и смысл верховенства; буквальное «сущий над всем» в современном русском звучит менее естественно.
- source_word: θεὸς εὐλογητὸς
  choice: Бог, благословенный
  rationale: Передаёт θεός как приложение к предшествующему описанию и сохраняет значение εὐλογητός, не превращая выражение в отдельное славословие в основном тексте.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткий, традиционный и понятный русский эквивалент устойчивой доксологической формулы.
- source_word: ἀμήν
  choice: Аминь
  rationale: Сохраняется общепринятая русская транслитерация литургического подтверждения.
theological_decisions:
- issue: Описывает ли оборот «ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας» Мессию или представляет собой отдельное славословие Богу
  choice: 'Основной текст продолжает описание Мессии: «который превыше всего, Бог, благословенный вовеки».'
  alternative: 'Последнюю часть можно понимать как отдельное славословие: «Бог, сущий над всем, да будет благословен вовеки».'
  rationale: Синтаксически артиклевое причастие ὁ ὢν естественно соотносится с непосредственно предшествующим ὁ χριστός и продолжает его характеристику. Однако древнейшие рукописи не дают современной пунктуации, а отдельное славословие остаётся известным грамматически возможным прочтением, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Формула «по плоти» сохранена ради павловской образности и пояснена в сноске; «который превыше всего» выбрано вместо более архаичного «сущий над всем» в основном тексте. Пунктуация делает предпочтительное синтаксическое прочтение ясным, не скрывая альтернативы.
