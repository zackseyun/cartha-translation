id: ROM.9.3
reference: Romans 9:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: ru
  text: Ибо я сам желал бы быть под проклятием и отделённым от Мессии[a] ради моих братьев[b], моих сородичей по плоти[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «быть проклятым от Мессии» или «быть под проклятием, вдали от Мессии». Греческое выражение тесно связывает проклятие с отделением от Мессии.'
    reason: lexical_alternative
  - marker: b
    text: Греч. «моих братьев»; из контекста ясно, что Павел говорит о своих соплеменниках-израильтянах.
    reason: cultural_note
  - marker: c
    text: «По плоти» здесь означает физическое происхождение, этническое родство, а не «греховную природу».
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: я сам желал бы
  rationale: Имперфект εὔχομαι в данном контексте передаёт напряжённое, потенциальное или гипотетическое желание, а не просто действие в прошлом. Условная форма «желал бы» естественно сохраняет эту модальность.
- source_word: γὰρ
  choice: ибо
  rationale: Сохраняет пояснительную связь с предшествующим рассуждением Павла и соответствует возвышенному, но понятному регистру послания.
- source_word: ἀνάθεμα
  choice: под проклятием
  rationale: Слово обозначает состояние под проклятием, с оттенком обречённости. Выражение прозрачно для современного читателя и не требует заимствованного термина «анафема».
- source_word: αὐτὸς ἐγὼ
  choice: я сам
  rationale: Сохраняет усиление, создаваемое сочетанием усилительного местоимения с явно выраженным личным местоимением.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: отделённым от Мессии
  rationale: Предлог ἀπό выражает удаление или отделение. «Отделённым» ясно передаёт эту семантику, не привнося узкого церковно-дисциплинарного смысла слова «отлучённым».
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь естественно воспринимается как титул; «Мессия» сохраняет его исходный мессианский смысл.
- source_word: ὑπὲρ
  choice: ради
  rationale: Кратко и естественно передаёт значение действия ради блага других в контексте жертвенной готовности.
- source_word: τῶν ἀδελφῶν μου
  choice: моих братьев
  rationale: Формально передаёт мужской род греческого существительного; контекстуальное указание на соплеменников поясняется в сноске.
- source_word: τῶν συγγενῶν μου
  choice: моих сородичей
  rationale: В контексте речь идёт не только о близких родственниках, а об этнически родственном Павлу народе; «сородичи» точно и естественно выражает коллективное родство.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет характерную для Павла формулировку, тогда как сноска уточняет, что здесь имеется в виду телесное происхождение и этническое родство.
theological_decisions:
- issue: Выражает ли ηὐχόμην действительную молитву или гипотетическое желание
  choice: 'Гипотетическое или потенциальное желание: «желал бы»'
  alternative: «желал», «молился бы»
  rationale: Такая передача не утверждает, что Павел действительно просил об отделении от Мессии, но сохраняет крайнюю силу его переживания за Израиль.
- issue: Соотношение ἀνάθεμα и ἀπὸ τοῦ Χριστοῦ
  choice: 'Переданы как тесно связанные стороны одного предполагаемого состояния: «под проклятием и отделённым от Мессии»'
  alternative: «проклятым от Мессии»; «под проклятием, вдали от Мессии»
  rationale: Греческая конструкция допускает буквальное сближение «проклятие от Христа», однако в контексте ἀπό естественно выражает отделение. Союз делает смысл ясным по-русски, а сноска сохраняет формальную неоднозначность.
- issue: Χριστός как титул или имяобразное обозначение
  choice: «Мессия»
  alternative: «Христос»
  rationale: В данном контексте титульное значение уместно и остаётся богословски прозрачным без сведения Χριστός к обычному имени.
- issue: Значение σάρξ в κατὰ σάρκα
  choice: Физическое происхождение и этническое родство
  alternative: Греховная природа
  rationale: Павел уточняет своё родство с израильтянами, а не характеризует их нравственную природу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апостольским регистром. «Ибо» сохраняет ход аргументации; «сородичи» точно передаёт этническое родство. Формула «по плоти» сохранена ради павловской межтекстовой последовательности и разъяснена в сноске.
