lexical_decisions:
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание торжественного утверждения Павла в предыдущем стихе; причинное «потому что» здесь менее вероятно.
- source_word: λύπη
  choice: печаль
  rationale: Передаёт глубокую скорбь и сохраняет различие со следующим словом ὀδύνη; это естественное и понятное слово в современном русском языке.
- source_word: μοί ἐστιν
  choice: у меня
  rationale: Дательный падеж с εἰμί обозначает переживаемое состояние; русская конструкция «у меня» передаёт его естественно, без буквального «есть мне».
- source_word: μεγάλη
  choice: великая
  rationale: Сохраняет прямое усиление существительного λύπη и уместно в dignified библейском повествовании.
- source_word: καὶ
  choice: и
  rationale: Простое соединение двух выражений внутреннего страдания.
- source_word: ἀδιάλειπτος
  choice: непрестанная
  rationale: Передаёт постоянный, не прекращающийся характер боли и сохраняет силу греческого определения.
- source_word: ὀδύνη
  choice: боль
  rationale: Обозначает тяжёлое внутреннее страдание; «боль» звучит прямо и естественно, тогда как «мука» несколько сильнее интерпретирует оттенок.
- source_word: τῇ καρδίᾳ μου
  choice: в сердце
  rationale: Сохраняет библейский образ сердца как средоточия внутренней жизни и естественно передаёт греческий дательный падеж по-русски.
