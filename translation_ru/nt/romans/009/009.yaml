source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: ru
  text: 'Ведь обещание таково: «В это время Я приду[a], и у Сарры будет сын».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я вернусь». В греческом тексте здесь стоит: «Я приду», хотя некоторые переводы, следуя формулировке Книги Бытия, передают: «вернусь».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: обещания
  rationale: 'Родительный падеж определяет λόγος: речь идёт о слове, содержащем обещание. В русском сочетание «слово обещания» сохраняет форму и смысл греческого выражения, а также связь с темой Божьего обещания в контексте.'
- source_word: λόγος
  choice: слово
  rationale: Здесь существительное обозначает само цитируемое изречение; «слово» передаёт это кратко и без расширительного толкования.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего утверждения. «Ведь» естественно передаёт пояснительно-причинную связь в современном русском.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: в это время
  rationale: Выражение указывает на определённое время исполнения обещания и сохраняет формулировку греческого текста без добавления слова «назначенное».
- source_word: ἐλεύσομαι
  choice: Я приду
  rationale: Форма будущего времени от ἔρχομαι прямо означает «приду». Вариант «вернусь» возможен с учётом ветхозаветного фона, но не выражен самим глаголом в данном греческом тексте.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: у Сарры будет сын
  rationale: Греческая конструкция принадлежности, буквально «Сарре будет сын», естественно передаётся по-русски конструкцией «у Сарры будет сын».
- source_word: Σάρρᾳ
  choice: Сарры
  rationale: Использована принятая русская библейская форма имени Сара в требуемом падеже.
- source_word: υἱός
  choice: сын
  rationale: Существительное обозначает именно сына, что существенно для содержания обещания Аврааму и Сарре.
theological_decisions:
- issue: Цитирование обещания Аврааму и действие Бога
  choice: 'Передать обещание как прямую речь Бога: «Я приду», без пояснительных добавлений.'
  alternative: «Я вернусь» — в соответствии с некоторыми переводами текста Бытия.
  rationale: Аргумент Павла основан на Божьем обещании как основании рождения Исаака. Перевод сохраняет эту силу и следует непосредственно греческой формулировке Послания к римлянам, а альтернативу отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формула «слово обещания» намеренно сохраняет компактность и структуру оригинала; цитата изложена естественно и ясно.
