reference: Romans 4:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: ru
  text: Ведь что говорит Писание? «Авраам поверил Богу, и это было зачтено[a] ему как праведность[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вменено»; «признано».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: Писание
  rationale: С определённым артиклем в речи Павла слово обозначает авторитетное Священное Писание, а не просто некий письменный текст.
- source_word: Ἐπίστευσεν
  choice: поверил
  rationale: Форма аориста передаёт совершившийся акт веры; «поверил» естественно по-русски и не добавляет толкования, отсутствующего в исходном тексте.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж при πιστεύω здесь означает, что Авраам поверил Богу — принял как истинное сказанное им; перевод «уверовал в Бога» был бы более интерпретирующим.
- source_word: ἐλογίσθη
  choice: было зачтено
  rationale: Сохранён страдательный залог. «Зачтено» понятно современному читателю и передаёт признание или отнесение чего-либо на чей-либо счёт без чрезмерно узкого финансового оттенка.
- source_word: εἰς δικαιοσύνην
  choice: как праведность
  rationale: 'Оборот передаёт результат или статус: вера была зачтена Аврааму как праведность. «Праведность» сохраняет устойчивое значение δικαιοσύνη в данном контексте Павла, не устраняя возможный оттенок справедливости.'
theological_decisions:
- issue: Значение δικαιοσύνη в контексте оправдания у Павла
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» точнее сохраняет богословскую и библейскую многозначность термина в рассуждении Павла. Возможное лексическое значение «справедливость» отмечено в сноске, но не подменяет основной смысл в данном контексте.
- issue: Что подразумевается под субъектом ἐλογίσθη
  choice: это
  alternative: вера Авраама
  rationale: В греческом тексте субъект прямо не назван. Местоимение «это» естественно отсылает к только что сказанному о вере Авраама, не превращая подразумеваемое в явное толкование.
translation_notes:
  register: Современный литературный и достоинственный русский язык. Вопрос сохранён в прямой форме, а ветхозаветная цитата выделена кавычками. «Поверил Богу» выбрано вместо привычного, но менее точного «уверовал в Бога». Термин «зачтено» понятнее широкому читателю, чем более традиционное «вменено», которое сохранено в сноске.
