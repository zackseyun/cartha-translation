  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: ru
  text: Ведь не через закон было дано Аврааму или его потомству[a] обещание, что он станет наследником мира, а через праведность веры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально «семени». Греческое слово стоит в единственном числе, но может иметь собирательное значение: «потомство» или «потомки».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «через праведность по вере» или «через праведность, получаемую благодаря вере». Греческое выражение сжато и не уточняет однозначно характер связи между праведностью и верой.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία
  choice: обещание
  rationale: Обычное русское соответствие для данного Павлова контекста; передаёт данное Богом обещание и его заветный смысл.
- source_word: σπέρματι
  choice: потомству
  rationale: Греческое существительное стоит в единственном числе, но имеет собирательное значение. «Потомству» естественно по-русски и сохраняет эту особенность лучше, чем множественное «потомкам».
- source_word: κληρονόμον ... κόσμου
  choice: наследником мира
  rationale: Сохраняет образ наследования и широкий смысл κόσμος, не сужая объём обещания.
- source_word: διὰ νόμου
  choice: через закон
  rationale: Передаёт инструментально-посредническое значение διά. Хотя артикля при νόμου нет, в ходе рассуждения Павла естественно подразумевается закон, прежде всего Моисеев.
- source_word: δικαιοσύνης
  choice: праведность
  rationale: «Праведность» сохраняет характерную для Павла богословскую и судебно-заветную многозначность слова δικαιοσύνη; «справедливость» здесь была бы уже и менее естественна.
- source_word: πίστεως
  choice: вера
  rationale: В этом противопоставлении закону πίστις естественнее всего означает веру или доверие; основной вариант «вера» не устраняет возможный оттенок доверия или верности.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: через праведность веры
  rationale: Компактная родительная конструкция сохраняет сжатость греческого текста и не решает однозначно, означает ли она праведность, получаемую через веру, основанную на вере или характеризуемую верой.
theological_decisions:
- issue: Связь между δικαιοσύνη и πίστις в выражении δικαιοσύνης πίστεως
  choice: «через праведность веры»
  alternative: «через праведность, получаемую по вере»; «через праведность на основании веры»
  rationale: Греческий родительный оборот допускает несколько близких толкований. Формально компактный перевод сохраняет богословское напряжение и не вводит причинно-инструментальную связь, выраженную яснее, чем в оригинале.
- issue: К кому относится αὐτόν в выражении «ему быть наследником мира»
  choice: «что он станет наследником мира» с ближайшим естественным отнесением к Аврааму
  alternative: Понимать местоимение в свете собирательного «потомства» или как включающее Авраама вместе с его потомством
  rationale: Местоимение мужского рода единственного числа грамматически естественнее относится к Аврааму, однако упоминание потомства оставляет обещанию корпоративный охват; перевод не добавляет уточнения, отсутствующего в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Порядок фразы слегка перестроен ради естественного русского синтаксиса; союз «ведь» передаёт γάρ. Сохранены традиционные и понятные термины «закон», «праведность», «вера», «наследник».
