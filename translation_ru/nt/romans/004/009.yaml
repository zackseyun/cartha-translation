id: ROM.4.9
reference: Romans 4:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: ru
  text: 'Итак, это благословение — только для обрезанных или также для необрезанных? Ведь мы говорим: «Вера была зачтена Аврааму как праведность[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость».'
    reason: Лексическая альтернатива для δικαιοσύνη; в данном контексте основным вариантом остаётся «праведность».
lexical_decisions:
- source_word: μακαρισμός
  choice: благословение
  rationale: В данном контексте слово отсылает к провозглашённому блаженству в Рим. 4:6–8; «благословение» естественно передаёт смысл и связь с предыдущими стихами.
- source_word: περιτομή
  choice: обрезанные
  rationale: Буквально «обрезание», но здесь существительное метонимически обозначает людей, принадлежащих к обрезанным.
- source_word: ἀκροβυστία
  choice: необрезанные
  rationale: Буквально «необрезание», но в противопоставлении περιτομή слово метонимически обозначает необрезанных людей.
- source_word: πίστις
  choice: вера
  rationale: Обычное и контекстуально уместное соответствие, сохраняющее формулировку цитаты и ход аргумента Павла.
- source_word: ἐλογίσθη
  choice: была вменена
  rationale: Передаёт пассивную форму и расчётно-оценочный оттенок λογίζομαι, сохраняя традиционную и понятную богословскую лексику без дополнительного истолкования.
- source_word: εἰς δικαιοσύνην
  choice: в праведность
  rationale: Формально близко передаёт εἰς и сохраняет характерную формулировку цитаты, не уточняя сверх текста точный механизм соотнесения веры и праведности.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: В контексте рассуждения Павла о положении Авраама перед Богом «праведность» точнее, чем «справедливость»; лексическая альтернатива отмечена в сноске.
theological_decisions:
- issue: Соотношение веры Авраама и праведности
  choice: «Вера была вменена Аврааму в праведность»
  alternative: «Вера была зачтена Аврааму как праведность»
  rationale: Выбранная формулировка сохраняет напряжение исходного текста и не добавляет систематического объяснения того, каким именно образом вера соотносится с праведностью.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Добавленные слова «только для» естественно выражают противопоставление групп, подразумеваемое греческой конструкцией; кавычки отмечают цитату из Быт. 15:6.
