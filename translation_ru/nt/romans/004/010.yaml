  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: ru
  text: Как же это было вменено ему?[a] Когда он был обрезанным или необрезанным? Не тогда, когда был обрезанным, а когда был необрезанным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зачтено», «засчитано».'
    reason: Лексические альтернативы для греческого ἐλογίσθη («было вменено»).
lexical_decisions:
- source_word: πῶς οὖν
  choice: Как же
  rationale: Естественно передаёт вопросительное πῶς и связующую, выводную силу οὖν в ходе рассуждения Павла.
- source_word: ἐλογίσθη
  choice: было вменено
  rationale: «Вменено» точно передаёт пассив λογίζομαι в контексте Быт 15:6 и сохраняет связь с формулировкой предыдущих стихов; подразумеваемое подлежащее определяется контекстом.
- source_word: ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ
  choice: Когда он был обрезан или когда был необрезан?
  rationale: Греческие обозначения состояния переданы естественной русской временной конструкцией; местоимение относится к Аврааму.
- source_word: οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ
  choice: Не после обрезания, а до обрезания
  rationale: В данном риторическом ответе состояния Авраама естественно и ясно выражены относительно события обрезания; резкий контраст οὐκ…ἀλλά сохранён.
theological_decisions:
- issue: Что именно было вменено Аврааму
  choice: Сохранить безличную форму «это было вменено»
  alternative: «Праведность была вменена ему»
  rationale: В греческом стихе объект прямо не повторён и восстанавливается из ближайшего контекста. Безличная формулировка не добавляет явного существительного и сохраняет связность вопроса.
- issue: Хронологический смысл противопоставления обрезания и необрезанности
  choice: «после обрезания… до обрезания»
  alternative: «будучи обрезанным… будучи необрезанным»
  rationale: Речь идёт о состоянии Авраама в момент вменения. Русская формулировка ясно раскрывает подразумеваемую временную последовательность, не меняя аргумента Павла.
translation_notes:
  register: Современный литературный русский; риторические вопросы и краткий категоричный ответ сохранены. Термин «вменено» выбран как понятный в библейском контексте и обеспечивающий лексическую связь с рассуждением Рим 4.
