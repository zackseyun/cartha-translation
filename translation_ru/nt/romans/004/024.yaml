review_pass:
  verdict: approve
  source_fidelity: Текст точно передаёт связку ἀλλὰ καὶ («но и»), отнесённость δι’ ἡμᾶς («для нас»), будущую направленность μέλλει λογίζεσθαι («будет зачтено») и намеренно сохраняет невыраженный объект λογίζεσθαι через нейтральное «это». Конструкция «верующих в Того, кто воскресил из мёртвых Иисуса, нашего Господа» верно воспроизводит τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν. Порядок «воскресил из мёртвых Иисуса» несколько отмечен библейским регистром, но вполне грамматичен и не искажает смысл.
  naturalness: Перевод литературный, ясный и сохраняет достойный библейский регистр. Повтор «для нас» несколько эксплицитнее греческого, но удачно проясняет, что «верующих» поясняет тех же «нас», а не вводит новую группу. Тире и конечная запятая оправданы продолжающимся синтаксисом следующего стиха.
  terminology: «Зачтено» удачно сохраняет учётно-расчётный образ λογίζομαι, не навязывая в самом стихе явно подразумеваемое слово «праведность». «Верующих в», «воскресил из мёртвых» и «наш Господь» — устойчивые современные русские соответствия. Сноски корректно дают допустимые лексические альтернативы и привязаны к соответствующим словам.
