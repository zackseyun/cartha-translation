  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: ru
  text: но и для нас[a], которым это будет зачтено, — для нас, верующих[b] в Того, кто воскресил из мёртвых Иисуса, нашего Господа,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полагающихся на Того».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: но и
  rationale: Передаёт одновременно противопоставление предыдущему ограничению и распространение сказанного на верующих.
- source_word: δι’ ἡμᾶς
  choice: для нас
  rationale: В данном контексте διά с винительным указывает, что написанное относится также к нам; «для нас» звучит естественно и не создаёт ложного причинного смысла.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: которым это будет зачтено
  rationale: Будущее «будет» передаёт направленность μέλλει, а «зачтено» сохраняет расчётно-учётную метафору λογίζομαι. Местоимение «это» воспроизводит подразумеваемый из контекста объект, не называя его прямо.
- source_word: τοῖς πιστεύουσιν
  choice: для нас, верующих
  rationale: Повтор «для нас» ясно связывает субстантивированное причастие с предыдущим ἡμᾶς и сохраняет включённость Павла и адресатов.
- source_word: πιστεύουσιν ἐπὶ
  choice: верующих в
  rationale: Обычное современное выражение направленной веры в личность; возможный оттенок доверия отмечен в сноске.
- source_word: τὸν ἐγείραντα
  choice: Того, кто воскресил
  rationale: Передаёт субстантивированное причастие через естественную русскую относительную конструкцию и сохраняет характеристику Бога через Его действие.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Иисуса, нашего Господа
  rationale: Сохраняет приложение и естественный для русского языка порядок слов.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устоявшаяся и точная русская формула, передающая воскресение из состояния и среды умерших.
theological_decisions:
- issue: Подразумеваемый объект при λογίζεσθαι
  choice: которым это будет зачтено
  alternative: которым будет зачтена праведность
  rationale: В греческом объект не выражен и восстанавливается из предшествующего контекста. «Это» делает фразу грамматически полной по-русски, но не вставляет в сам стих явно отсутствующее слово «праведность».
- issue: Оттенок πιστεύω ἐπί
  choice: верующих в
  alternative: полагающихся на
  rationale: «Верующих в» сохраняет основное значение и привычно в современном русском; оттенок личного доверия не исключается и указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксический повтор «для нас» помогает передать греческое приложение без неясной смены лица; запятая в конце сохранена, поскольку стих синтаксически продолжается в Римлянам 4:25.
