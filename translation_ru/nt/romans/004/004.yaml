  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: ru
  text: Тому, кто трудится, плата засчитывается не как дар[a], а как то, что причитается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по благодати».'
    reason: Буквально сохраняет выражение κατὰ χάριν; в контексте противопоставления заработанной плате оно означает получение как дара, а не по заслуге.
  - marker: b
    text: 'Или: «как долг»; букв.: «по долгу».'
    reason: Ὀφείλημα обозначает то, что должно быть выплачено, то есть обязательную выплату.
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: тому, кто трудится
  rationale: Субстантивированное причастие настоящего времени обобщённо обозначает человека, который трудится; такая формулировка естественна по-русски и сохраняет деятельный смысл.
- source_word: μισθὸς
  choice: плата
  rationale: В контексте труда слово обозначает причитающееся вознаграждение. «Плата» ясно передаёт связь между работой и расчётом и согласуется с формой единственного числа греческого текста.
- source_word: λογίζεται
  choice: засчитывается
  rationale: Глагол передаёт бухгалтерский образ начисления или занесения на счёт. «Засчитывается» сохраняет этот образ и звучит естественно в данном противопоставлении.
- source_word: κατὰ χάριν
  choice: по благодати
  rationale: Формально и ясно сохраняет ключевое слово χάρις и конструкцию κατά, не сводя её заранее только к понятию подарка.
- source_word: ὀφείλημα
  choice: как долг
  rationale: Существительное означает то, что причитается или должно быть уплачено. «Как долг» естественно выражает обязанность выплатить заработанное.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица отмечает переход и лёгкое противопоставление; в русском связь достаточно ясно передана строением фразы и контекстом, поэтому вводное «но» или «итак» могло бы излишне усилить оттенок.
theological_decisions:
- issue: Передача χάρις в противопоставлении заработанной плате
  choice: по благодати
  alternative: как дар
  rationale: «По благодати» сохраняет богословски значимый и при этом обычный для Павла термин, а контраст с долгом сам показывает незаслуженный характер благодати. В сноске дано более контекстуально явное «как дар».
- issue: Передача ὀφείλημα
  choice: как долг
  alternative: как то, что причитается
  rationale: «Долг» сохраняет сильный юридико-финансовый образ оригинала, не уточняя сверх текста, кто именно является должником.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, афористичная и сохраняет финансово-расчётный образ оригинала. Термин «благодать» оставлен в основном тексте как понятный в библейском контексте и значимый для аргумента Павла.
