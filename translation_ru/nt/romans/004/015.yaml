  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: ru
  text: Ведь закон[a] вызывает гнев, а где нет закона, там нет и преступления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Закон».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «нарушение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: закон
  rationale: Строчная буква сохраняет широту греческого термина и не ограничивает его заранее исключительно Законом Моисея; вместе с тем контекст допускает и эту отсылку.
- source_word: ὀργή
  choice: гнев
  rationale: «Гнев» передаёт судебно-богословскую весомость слова в рассуждении Павла, не уточняя прямо, чей это гнев, поскольку греческий текст этого не указывает.
- source_word: κατεργάζεται
  choice: вызывает
  rationale: 'Современное и естественное русское соответствие с причинным значением: закон приводит к возникновению гнева.'
- source_word: οὗ δὲ
  choice: а где
  rationale: Передаёт как местно-условный смысл конструкции, так и мягкое противопоставление, выраженное δέ.
- source_word: παράβασις
  choice: преступление
  rationale: Слово обозначает переход установленной границы, то есть нарушение известного предписания; «преступление» сохраняет эту смысловую связь с законом.
theological_decisions:
- issue: Объём значения νόμος в аргументации Павла
  choice: закон
  alternative: Закон Моисея
  rationale: Основной текст сохраняет общий принцип о связи закона и преступления, не устраняя возможную отсылку к Закону Моисея.
- issue: Чей гнев обозначен словом ὀργή
  choice: не уточнять
  alternative: Божий гнев
  rationale: В контексте Послания возможен Божий судебный гнев, однако в самом стихе субъект гнева прямо не назван; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и весомая. Повтор слова «закон» сохранён, а добавленное «там» естественно оформляет русскую соотносительную конструкцию «где… там».
