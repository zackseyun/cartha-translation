lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» передаёт пояснительно-аргументативную связь γάρ с предыдущей мыслью, а «если» сохраняет условную конструкцию εἰ.
- source_word: Ἀβραὰμ
  choice: Авраам
  rationale: Использована общепринятая русская форма библейского имени.
- source_word: ἐξ ἔργων
  choice: делами
  rationale: Краткая и естественная русская формулировка, передающая дела как основание оправдания; она сохраняет характерную для Павла лексику.
- source_word: ἐδικαιώθη
  choice: был оправдан
  rationale: Передаёт страдательный аорист и сохраняет юридико-богословскую ёмкость глагола δικαιόω. Пояснительный вариант «был признан праведным» дан в сноске.
- source_word: ἔχει καύχημα
  choice: ему есть чем хвалиться
  rationale: Естественно по-русски передаёт наличие основания или предмета для похвалы, сохраняя компактность мысли.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: но не перед Богом
  rationale: «Перед Богом» естественно передаёт πρὸς θεόν в контексте Божьей оценки и не уточняет смысл сверх сказанного в греческом тексте.
theological_decisions:
- issue: Следует ли представить условие как реальное или как заведомо нереальное
  choice: 'Прямое условие: «если Авраам был оправдан делами»'
  alternative: «если бы Авраам был оправдан делами»
  rationale: Греческая конструкция εἰ с индикативом прямо вводит условную посылку. Перевод не добавляет контрфактического оттенка и сохраняет напряжение аргумента Павла, не предрешая его вывод.
