source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: ru
  text: 'Он, вопреки надежде[a], с надеждой поверил, чтобы стать отцом многих народов[b], согласно сказанному: «Таким будет твоё потомство»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за пределами надежды»; «несмотря на безнадёжность».'
    reason: lexical_alternative
  - marker: b
    text: Ср. Бытие 17:5.
    reason: cross_reference
  - marker: c
    text: 'Цитата из Бытия 15:5. Буквально: «Таким будет твоё семя»; греческое слово употреблено в единственном числе и имеет собирательное значение.'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: вопреки надежде
  rationale: 'Передаёт парадокс: с человеческой точки зрения оснований надеяться не было, однако Авраам поверил. Формулировка сохраняет силу παρά с винительным падежом.'
- source_word: ἐπ’ ἐλπίδι
  choice: с надеждой
  rationale: Естественно по-русски передаёт состояние или основание надежды и сохраняет риторический контраст с «вопреки надежде».
- source_word: ἐπίστευσεν
  choice: поверил
  rationale: Прямо передаёт аорист πιστεύω и сохраняет характерную для Павла лексику веры без пояснительного расширения.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: чтобы стать
  rationale: Сохраняет возможное целевое значение конструкции εἰς τό с инфинитивом и её направленность к обещанному исходу; контекст допускает также оттенок результата.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: отцом многих народов
  rationale: «Народов» соответствует ветхозаветному обещанию и не сужает ἔθνη до значения «язычники».
- source_word: κατὰ τὸ εἰρημένον
  choice: согласно сказанному
  rationale: Краткая и достойная русская формулировка сохраняет отсылку к ранее произнесённому и продолжающему действовать Божьему слову.
- source_word: Οὕτως ἔσται
  choice: Таким будет
  rationale: Передаёт смысл библейской цитаты современным литературным русским языком без излишней архаизации.
- source_word: τὸ σπέρμα σου
  choice: твоё потомство
  rationale: «Потомство» естественно по-русски передаёт собирательное единственное число σπέρμα; буквальный образ «семени» отмечен в сноске.
theological_decisions:
- issue: Значение πολλῶν ἐθνῶν в Авраамовом обещании
  choice: «многих народов»
  alternative: «многих язычников»
  rationale: В аллюзии на Бытие речь идёт о народах в составе Авраамова обещания. «Язычников» преждевременно вносило бы более узкое противопоставление иудеев и неиудеев.
- issue: Целевой или результативный оттенок εἰς τὸ γενέσθαι
  choice: «чтобы стать»
  alternative: «и потому стал»
  rationale: Греческая конструкция допускает цель и результат. Выбранный вариант сохраняет перспективную направленность веры к исполнению обещания, не утверждая исключительно причинно-результативное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом. Парадокс двух выражений с ἐλπίς сохранён повтором слова «надежда». Местоимение «Он» оставлено для связи с предшествующим контекстом; цитата оформлена естественно, без архаического «таково будет».
