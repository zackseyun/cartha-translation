lexical_decisions:
- source_word: διό
  choice: И потому
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает стих с контекстом.
- source_word: ἐλογίσθη
  choice: было зачтено
  rationale: Сохраняет страдательную форму и ключевой для Рим. 4 образ учёта, не добавляя специальной догматической терминологии.
- source_word: αὐτῷ
  choice: ему
  rationale: Естественно передаёт дательный падеж и сохраняет отсылку к Аврааму.
- source_word: εἰς
  choice: как
  rationale: В сочетании с λογίζομαι естественно обозначает, в качестве чего нечто было зачтено.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: В данном контексте это наиболее точное и привычное обозначение праведного статуса; более общее значение «справедливость» отмечено в сноске.
theological_decisions:
- issue: Передача образа вменения или учёта без внесения дополнительной догматической формулировки
  choice: было зачтено ему как праведность
  alternative: было вменено ему в праведность
  rationale: Выбранная формулировка сохраняет бухгалтерско-оценочный образ греческого глагола и его страдательную форму, но не уточняет сверх текста ни действующее лицо, ни механизм такого зачтения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формулировка краткая, сохраняет логическую связь с предыдущим стихом и терминологическую напряжённость текста.
