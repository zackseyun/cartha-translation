  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: ru
  text: Блаженны те, чьи беззакония[a] прощены и чьи грехи покрыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконные дела».'
    reason: Лексическая альтернатива, явно передающая деятельностный оттенок слова ἀνομίαι.
lexical_decisions:
- source_word: Μακάριοι
  choice: Блаженны
  rationale: Сохраняет торжественный библейский смысл провозглашённого Богом благополучия и не сводит его к субъективному ощущению счастья.
- source_word: ἀφέθησαν
  choice: прощены
  rationale: Передаёт страдательную форму со значением прощения или отпущения; краткая форма естественна по-русски и указывает на совершившийся результат.
- source_word: ἀνομίαι
  choice: беззакония
  rationale: Сохраняет связь с нарушением закона и отличается от последующего слова «грехи», не создавая при этом чрезмерно узкого толкования.
- source_word: ἐπεκαλύφθησαν
  choice: покрыты
  rationale: Сохраняет исходную метафору цитируемого псалма, не заменяя её толкованием вроде «скрыты» или «не вменены».
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Прямой, общепонятный и контекстуально точный русский эквивалент.
theological_decisions:
- issue: Соотношение слов «беззакония» и «грехи»
  choice: Передать их двумя различными русскими словами
  alternative: Оба греческих слова перевести общим словом «грехи»
  rationale: Так сохраняются поэтический параллелизм и лексическое различие оригинала без навязывания более строгого богословского разграничения, чем допускает сам текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского провозглашения. Синтаксис прост и понятен; традиционные слова «блаженны», «беззакония» и метафора «покрыты» сохранены как прозрачные в данном контексте.
