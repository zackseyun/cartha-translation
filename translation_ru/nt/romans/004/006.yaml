id: ROM.4.6
reference: Romans 4:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: ru
  text: Так же и Давид говорит о блаженстве человека, которому Бог вменяет праведность независимо от дел:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «засчитывает».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «без дел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ καὶ
  choice: Так и
  rationale: 'Естественно вводит подтверждающее сравнение с предыдущим рассуждением и передаёт добавочное значение καί: Давид также выступает свидетелем.'
- source_word: λέγει τὸν μακαρισμόν
  choice: говорит о блаженстве
  rationale: Русская конструкция естественно передаёт смысл высказывания о блаженном состоянии; настоящее время сохраняет форму цитирования.
- source_word: τοῦ ἀνθρώπου
  choice: человека
  rationale: «Человек» в современном русском языке естественно передаёт единичное ἄνθρωπος в обобщённом, представительном смысле без ограничения только мужчинами.
- source_word: λογίζεται
  choice: вменяет
  rationale: Передаёт расчётно-судебную метафору глагола λογίζομαι и устойчиво сочетается с «праведностью»; более общеупотребительный вариант «засчитывает» дан в сноске.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: В данном контексте Павла «праведность» сохраняет богословскую и судебную смысловую напряжённость лучше, чем «справедливость».
- source_word: χωρὶς ἔργων
  choice: независимо от дел
  rationale: Ясно выражает отсутствие дел как основания для Божьего вменения, не утверждая отсутствия дел вообще.
theological_decisions:
- issue: Обобщённое значение ἀνθρώπου
  choice: человека
  alternative: мужа
  rationale: Контекст говорит о любом человеке, которому Бог вменяет праведность; русское «человек» сохраняет единственное число и представительское значение исходного слова.
- issue: Значение λογίζεται в контексте праведности
  choice: вменяет
  alternative: засчитывает
  rationale: «Вменяет» сохраняет традиционно узнаваемый судебно-расчётный оттенок, тогда как сноска предлагает более прозрачный современный эквивалент без разрешения богословской дискуссии о точном механизме.
- issue: Павлово δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» является естественным термином для этого контекста и охватывает статус/качество правоты перед Богом; «справедливость» здесь сужала бы и смещала смысл.
- issue: Связь χωρὶς ἔργων с вменением
  choice: независимо от дел
  alternative: без дел
  rationale: Выбранная формулировка подчёркивает, что дела не служат основанием вменения, сохраняя лаконичность и не добавляя конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис краток и близок к греческому, но естественен по-русски. Термины «блаженство», «вменяет» и «праведность» сохраняют смысловую плотность исходного текста; потенциально менее прозрачное «вменяет» пояснено сноской.
