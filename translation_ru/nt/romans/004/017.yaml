  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: ru
  text: 'как написано: «Я поставил тебя отцом многих народов»[a]. Он — отец многих народов перед Богом, в Которого уверовал, перед Тем, Кто оживляет мёртвых и называет несуществующее существующим[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое слово может также означать «язычников», однако в этой цитате из книги Бытие вероятнее более широкое значение: «народы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более истолковательно: «призывает к бытию то, чего нет».'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Устойчивая формула ссылки на Писание; русская форма естественно передаёт сохраняющую силу написанного.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: отцом многих народов
  rationale: В цитате из Бытия ἐθνῶν обозначает народы в широком смысле, а не только язычников в противопоставлении иудеям.
- source_word: τέθεικά σε
  choice: Я поставил тебя
  rationale: «Поставил» передаёт совершённое Богом установление и сохраняющийся результат, не сужая смысл до простого назначения на должность.
- source_word: κατέναντι
  choice: пред Богом
  rationale: Краткое и естественное выражение со значением «перед лицом, в присутствии»; оно сохраняет связь отцовства Авраама с Божьим взглядом и обещанием.
- source_word: οὗ ἐπίστευσεν
  choice: Которому поверил
  rationale: При глаголе πιστεύω с родительным падежом речь идёт о доверии лицу; русское «поверил Богу» близко передаёт конструкцию без добавления отсутствующего предлога.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: Кто оживляет мёртвых
  rationale: Естественно передаёт причастие настоящего времени и характеризует Бога как дающего мёртвым жизнь.
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: называет несуществующее существующим
  rationale: Текстово близкая формулировка сохраняет сжатость и неоднозначность греческого оборота, не превращая его прямо в утверждение о приведении к бытию.
theological_decisions:
- issue: Следует ли понимать заключительную фразу как прямое утверждение о творении из ничего.
  choice: называет несуществующее существующим
  alternative: призывает к бытию то, чего нет
  rationale: Греческий текст допускает указание на творческую силу Бога, но буквально остаётся более сжатым. Основной текст сохраняет эту напряжённость, а более истолковывающий вариант вынесен в сноску.
- issue: К чему синтаксически относится выражение «пред Богом».
  choice: Он — отец пред Богом, Которому поверил
  alternative: в присутствии Бога, в Которого он поверил
  rationale: В контексте Рим 4:16–17 подразумеваемым субъектом остаётся Авраам; добавление «Он — отец» делает трудную греческую конструкцию понятной по-русски, не вводя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис слегка прояснён добавлением «Он — отец», поскольку буквальное воспроизведение греческой конструкции по-русски было бы неясным. Заглавные буквы в относительных местоимениях при обращении к Богу соответствуют принятой русской библейской традиции.
