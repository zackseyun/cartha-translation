  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: ru
  text: и был полностью уверен, что Он силен исполнить обещанное.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был совершенно убеждён»; «обрёл полную уверенность».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте субъект не назван; из контекста ясно, что речь идёт о Боге.
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: был полностью уверен
  rationale: Причастие выражает состояние полной убеждённости; эта формулировка естественна в современном русском языке и сохраняет силу греческого слова.
- source_word: ὅτι
  choice: что
  rationale: Естественно вводит содержание уверенности Авраама.
- source_word: ὃ ἐπήγγελται
  choice: обещанное
  rationale: Субстантивированное причастие естественно передаёт относительную конструкцию «то, что Он обещал»; смысл совершённого обещания с сохраняющейся силой ясен из контекста.
- source_word: δυνατός ἐστιν
  choice: силен
  rationale: Сохраняет настоящее время греческого текста и обозначает присущую Богу способность, не сводя выражение только к прошлому повествования.
- source_word: καὶ ποιῆσαι
  choice: исполнить
  rationale: В сочетании с обещанием «исполнить» по-русски естественнее буквального «сделать»; καί передаётся смысловой связью между обещанием и его исполнением, без тяжеловесного «также».
theological_decisions:
- issue: Неявный субъект обещания и способности
  choice: Местоимение «Он» сохранено в основном тексте и написано с прописной буквы по норме русского религиозного регистра.
  alternative: 'Прямо назвать Бога: «Бог силен исполнить обещанное».'
  rationale: В самом стихе субъект грамматически не выражен, но ближайший контекст однозначно указывает на Бога; местоимение не добавляет имени, отсутствующего в греческом тексте.
- issue: Время выражения δυνατός ἐστιν
  choice: «силен» — настоящее время
  alternative: «был способен» или «мог» — согласование с прошедшим временем повествования
  rationale: Греческое настоящее ἐστιν может подчёркивать не только способность Бога в тот момент, но и Его неизменную силу; русский язык допускает сохранение этой временной перспективы.
translation_notes:
  register: Современный литературный русский, сжатый и торжественный без архаизмов. Порядок слов сделан естественным для русского языка; сохранены полная уверенность Авраама, неявное указание на Бога и настоящее время Его способности.
