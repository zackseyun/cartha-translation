lexical_decisions:
- source_word: ἐγράφη
  choice: написано
  rationale: Безличная пассивная конструкция естественна по-русски и сохраняет прямую связь с записанным текстом Писания.
- source_word: δὲ
  choice: но
  rationale: 'Союз продолжает рассуждение Павла и одновременно подчёркивает противопоставление: написанное относится не только к Аврааму.'
- source_word: δι’ αὐτὸν μόνον
  choice: не только ради него
  rationale: 'Передаёт διά с винительным и сохраняет смысл: эти слова были записаны не с одним лишь Авраамом в виду.'
- source_word: ὅτι
  choice: что
  rationale: Вводит содержание написанного без добавочного толкования.
- source_word: ἐλογίσθη
  choice: было вменено
  rationale: «Вменено» сохраняет расчётно-юридический оттенок λογίζομαι в рассуждении Павла, тогда как примечание предлагает более общеупотребительные соответствия.
- source_word: αὐτῷ
  choice: ему
  rationale: Естественно передаёт дательный падеж при пассивной форме «было вменено».
theological_decisions:
- issue: Передача λογίζομαι в контексте оправдания
  choice: было вменено
  alternative: было засчитано; было сочтено
  rationale: Выбор сохраняет характерную для Рим 4 идею отнесения или зачёта, но не уточняет сверх текста, что именно подразумевается в этой эллиптической формулировке.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским и юридическим оттенком слова «вменено». Порядок слов сохраняет акцент оригинала на том, что написанное относится не только к Аврааму. Местоимение «это» естественно восполняет подразумеваемое содержание предыдущей цитаты.
