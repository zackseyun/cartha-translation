id: ROM.4.12
reference: Romans 4:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: ru
  text: и отцом обрезанных — тех, кто не только обрезаны, но и следуют по следам веры нашего отца Авраама, которую он имел, когда был необрезан.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: отцом обрезанных
  rationale: Родительный περιτομῆς формально означает «обрезания», но в контексте обозначает людей, принадлежащих к обрезанным; так по-русски яснее и естественнее, без представления, будто Авраам — отец самого обряда.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: кто не только обрезан
  rationale: Буквальное «не только из обрезания» в современном русском неестественно. Передан смысл принадлежности к обрезанным, причём внешнего знака самого по себе недостаточно.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: идёт по следам
  rationale: Сохраняется образ движения по оставленным следам и мысль о следовании образцу; выражение естественно для современного литературного русского.
- source_word: πίστεως
  choice: веры
  rationale: В данном рассуждении речь идёт о вере Авраама, то есть о его доверии Божьему обещанию; «вера» сохраняет ключевой термин контекста.
- source_word: ἐν ἀκροβυστίᾳ
  choice: когда был необрезан
  rationale: Состояние Авраама до обрезания передано естественной временной конструкцией, не меняющей последовательности аргумента.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: которую имел наш отец Авраам
  rationale: 'Греческая родительная конструкция развёрнута ради ясности: вера принадлежит Аврааму; общинное наименование «наш отец» сохранено.'
theological_decisions:
- issue: Относится ли отцовство Авраама ко всем обрезанным безусловно или к тем, чьё обрезание сопровождается верой по его примеру
  choice: Определение отнесено к обрезанным, которые не ограничиваются обрезанием, но следуют вере Авраама.
  alternative: Авраам является отцом всех обрезанных независимо от их веры.
  rationale: 'Конструкция οὐκ… μόνον ἀλλὰ καί ограничивает названную группу: не только принадлежность к обрезанным, но и следование по следам веры Авраама.'
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Сохранена метафора следов; синтаксис слегка развёрнут ради естественности. Стих начинается со строчной буквы и союза, поскольку грамматически продолжает предыдущий стих.
