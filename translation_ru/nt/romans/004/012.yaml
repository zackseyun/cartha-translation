  rationale: Исправлена синтаксическая связь определения с группой обрезанных и согласование числа. Сохранены ограничительный смысл конструкции «не только... но и...», образ следов, принадлежность веры Аврааму и указание на его необрезанное состояние. Добавление «он» устраняет возможную двусмысленность русского относительного оборота без изменения смысла.
