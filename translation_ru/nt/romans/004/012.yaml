  - severity: low
    issue: Единственное число в «кто не только обрезан, но и идёт»
    rationale: При соотнесении с множественной группой «обрезанных» множественные формы «обрезаны» и «следуют» делают фразу яснее и литературно ровнее.
  revised_text: и отцом обрезанных — тех, кто не только обрезаны, но и следуют по следам веры нашего отца Авраама, которую он имел, когда был необрезан.
