  verdict: approve
  source_fidelity: «Что же, скажем мы, обрёл Авраам, наш праотец по плоти?» точно передаёт риторический вопрос Τί οὖν ἐροῦμεν, перфектный инфинитив εὑρηκέναι и явно сохраняет «наш». «По плоти» в основном тексте естественно связано с «наш праотец», при этом реальная альтернативная связь с «обрёл» добросовестно отмечена в сноске.
  naturalness: Фраза звучит как современный литературный русский в умеренно высоком библейском регистре. Порядок слов с вводным «скажем мы» несколько риторичен, но вполне естествен для павловского вопроса. «Праотец по плоти» ясен в контексте и не создаёт впечатления, что речь идёт о греховной природе.
  terminology: «Праотец» удачно передаёт προπάτωρ в данном контексте; «обрёл» корректно выражает достигнутый результат εὑρηκέναι. Формула «по плоти» сохраняет важную павловскую лексику, а сноска a даёт понятное нетехническое пояснение. Сноска b не навязывает толкования и сохраняет синтаксическую неоднозначность оригинала.
