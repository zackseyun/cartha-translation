  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: ru
  text: Что же, скажем мы, обрёл Авраам, наш праотец по плоти?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более пояснительно: «наш предок по телесному происхождению».'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «по плоти» можно отнести и к глаголу «обрёл»: «что Авраам обрёл по плоти», то есть человеческими силами или с человеческой точки зрения.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Что же, скажем мы
  rationale: Сохраняет риторический переход и совещательный оттенок будущего времени, оставаясь естественным для современного литературного русского языка.
- source_word: εὑρηκέναι
  choice: обрёл
  rationale: Передаёт смысл достигнутого результата, выраженный перфектным инфинитивом. «Нашёл» возможно, но «обрёл» естественнее в рассуждении о том, чего достиг Авраам.
- source_word: Ἀβραὰμ τὸν προπάτορα ἡμῶν
  choice: Авраам, наш праотец
  rationale: «Праотец» передаёт мужской род, единственное число и особое положение Авраама как родоначальника; местоимение «наш» сохранено явно.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет характерную для Павла формулировку и в основном прочтении обозначает телесное, родовое происхождение, а не греховную природу.
theological_decisions:
- issue: Синтаксическая связь κατὰ σάρκα
  choice: Фраза относится к «наш праотец» и указывает на происхождение по плоти.
  alternative: 'Фраза может относиться к «обрёл»: «что Авраам обрёл по плоти», то есть человеческими силами или с человеческой точки зрения.'
  rationale: Положение при приложении «Авраам, наш праотец» естественно допускает связь с родством, однако греческий порядок слов оставляет реальную синтаксическую неоднозначность, которая отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Формула «по плоти» сохранена ради точности и связи с языком Павла; её смысл пояснён в сноске. Вводное «скажем мы» позволяет передать греческую риторическую конструкцию без добавления толкования.
