  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: ru
  text: Но, что касается Божьего обещания, он не поколебался в неверии, а был укреплён в вере[a], воздав славу Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был укреплён верой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Но в отношении Божьего обещания
  rationale: εἰς с винительным падежом имеет здесь значение отношения («в отношении»), а δέ обозначает контраст с предшествующим контекстом. «Божье обещание» естественно и точно передаёт принадлежность обещания Богу.
- source_word: οὐ διεκρίθη
  choice: не поколебался
  rationale: В данном контексте διακρίνω обозначает внутреннее колебание или раздвоенность, а не просто интеллектуальное сомнение.
- source_word: τῇ ἀπιστίᾳ
  choice: в неверии
  rationale: Дательный падеж допускает понимание сферы или состояния; формулировка сохраняет параллель с «в вере».
- source_word: ἀλλὰ ἐνεδυναμώθη
  choice: а укрепился
  rationale: Русская возвратная форма естественно передаёт греческий пассив без уточнения деятеля, которого текст прямо не называет.
- source_word: τῇ πίστει
  choice: в вере
  rationale: Передаёт πίστις обычным для проекта словом «вера» и сохраняет антитезу «в неверии — в вере»; возможен также инструментальный смысл.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: воздав славу Богу
  rationale: Деепричастный оборот сохраняет сопутствующий характер аористного причастия; устойчивое русское выражение «воздать славу» соответствует смыслу греческой фразы.
theological_decisions:
- issue: Передавать ли реакцию Авраама как простое сомнение или как более широкое колебание
  choice: не поколебался в неверии
  alternative: не усомнился из-за неверия
  rationale: «Не поколебался» лучше сохраняет широту διακρίνω и его риторический контраст с укреплением в вере, не сводя речь только к интеллектуальному сомнению.
- issue: Понимать ли τῇ πίστει как сферу или средство укрепления
  choice: укрепился в вере
  alternative: был укреплён верой
  rationale: Дательный падеж допускает оба понимания. Основной текст сохраняет параллель с «в неверии», а сноска отмечает возможное инструментальное прочтение.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис близок к греческому ходу мысли, но остаётся естественным для обычного читателя. Подлинная неоднозначность дательного падежа при τῇ πίστει сохранена в сноске.
