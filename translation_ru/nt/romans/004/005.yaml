  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: ru
  text: А тому, кто не совершает дел[a], но верит в Того, Кто оправдывает нечестивого[b], его вера засчитывается как праведность[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не работающему» или «не делающему».'
    reason: Сохраняет форму и базовое значение греческого причастия без добавления интерпретации.
  - marker: b
    text: 'Или: «признаёт праведным», «объявляет праведным».'
    reason: Передаёт возможный судебный оттенок δικαιόω, сохраняя в основном тексте ключевой термин «оправдывает».
  - marker: c
    text: 'Или: «считается праведностью», «вменяется как праведность». В павловом употреблении δικαιοσύνη также может передаваться словом «справедливость».'
    reason: Отмечает варианты для λογίζεται εἰς δικαιοσύνην и сохраняет лексическую альтернативу для δικαιοσύνη, указанную в английском аудите.
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: тому, кто не полагается на дела
  rationale: В контексте противопоставления работнику и верующему (ст. 4–5) речь идёт не о бездействии вообще, а об отказе основывать праведность на делах. Такая передача естественна по-русски и не превращает фразу в осуждение всякого труда; более буквальный вариант отмечен в сноске.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: но верит в
  rationale: Конструкция πιστεύω ἐπί выражает веру, направленную на Бога и опирающуюся на Него. «Верит в» сохраняет связь с группой слов πίστις/πιστεύω и звучит естественно в современном русском.
- source_word: τὸν δικαιοῦντα
  choice: Того, Кто оправдывает
  rationale: «Оправдывает» сохраняет ключевой для аргумента Павла термин и его судебно-богословскую ёмкость, не сводя смысл только к одной конфессиональной модели.
- source_word: τὸν ἀσεβῆ
  choice: нечестивого
  rationale: «Нечестивый» точно передаёт ἀσεβής как человека, не почитающего Бога, и соответствует достоинству библейского регистра.
- source_word: λογίζεται
  choice: засчитывается
  rationale: Глагол передаёт признание или вменение чего-либо в определённом качестве. «Засчитывается» понятно современному читателю и сохраняет образ учёта.
- source_word: ἡ πίστις αὐτοῦ
  choice: вера его
  rationale: «Вера» — наиболее прямой эквивалент πίστις здесь; параллель с πιστεύοντι показывает, что имеется в виду вера человека, а не его верность.
- source_word: εἰς δικαιοσύνην
  choice: как праведность
  rationale: В сочетании с λογίζεται оборот указывает, в качестве чего засчитывается вера; «как праведность» ясно передаёт эту синтаксическую связь.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: «Праведность» сохраняет лексическую и богословскую связь с «оправдывает» и лучше «справедливости» подходит к данному контексту Послания к римлянам.
theological_decisions:
- issue: Смысл μὴ ἐργαζομένῳ в противопоставлении вере
  choice: не полагается на дела
  alternative: не делающему / тому, кто не трудится
  rationale: Контекст ст. 4–5 противопоставляет расчёт на вознаграждение за сделанное вере в оправдывающего Бога. Основной текст передаёт контекстуальный смысл, а буквальная форма сохраняется в сноске, чтобы не скрывать структуру греческого текста.
- issue: Передача δικαιοῦντα в богословски напряжённом контексте
  choice: оправдывает
  alternative: признаёт праведным / объявляет праведным
  rationale: «Оправдывает» сохраняет традиционный ключевой термин и допускает присущую глаголу судебную силу, не разрешая в переводе более широкий спор о природе оправдания.
- issue: Соотношение πίστις и πιστεύω
  choice: вера / верит
  alternative: доверие / полагается на
  rationale: Однокоренная русская пара сохраняет заметную связь греческих слов и ход рассуждения Павла. Оттенок доверия подразумевается конструкцией и может быть выражен как лексическая альтернатива.
- issue: Значение λογίζεται εἰς δικαιοσύνην
  choice: засчитывается как праведность
  alternative: вменяется в праведность / считается праведностью
  rationale: Выбранная формулировка сохраняет образ учёта и грамматически не уточняет сверх текста механизм или основание вменения.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Заглавные буквы в «Того, Кто» использованы как русская издательская норма для явного указания на Бога, без добавления отсутствующего в греческом имени. Порядок фразы сохраняет контраст «не… но…» и краткость аргумента Павла.
