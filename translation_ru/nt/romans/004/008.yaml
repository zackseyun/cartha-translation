lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Сохраняет вес библейской формулы благословения; «счастлив» звучало бы преимущественно как описание субъективного состояния.
- source_word: ἀνήρ
  choice: человек
  rationale: В данном изречении мужской род имеет обобщающий, представительский смысл. Русское «человек» естественно передаёт его без ограничения только мужчинами.
- source_word: οὗ
  choice: которому
  rationale: Родительный относительного местоимения естественно передан русской конструкцией «которому… поставить в счёт».
- source_word: οὐ μὴ
  choice: никогда не
  rationale: Передаёт усиленное отрицание, образованное οὐ μή с сослагательным наклонением, на ясном современном русском языке.
- source_word: λογίσηται
  choice: поставит … в счёт
  rationale: Сохраняет расчётно-учётный образ глагола и его связь с темой всей главы, не прибегая к более узкому богословскому термину.
- source_word: κύριος
  choice: Господь
  rationale: Обычное и уместное соответствие в контексте цитаты из Писания.
- source_word: ἁμαρτίαν
  choice: грех
  rationale: Сохраняет единственное число и обобщённое значение греческого существительного.
theological_decisions:
- issue: Обобщающий мужской род
  choice: «человек» в основном тексте
  alternative: «муж»
  rationale: Греческое ἀνήρ грамматически мужского рода, но здесь обозначает представителя человечества, а не исключительно мужчину; русское «человек» точно и естественно сохраняет этот смысл.
- issue: Сила отрицания οὐ μή
  choice: «никогда не поставит»
  alternative: «ни в коем случае не поставит»
  rationale: Оба варианта передают усиленное отрицание. «Никогда не» естественнее в основном тексте и не снимает категоричности высказывания.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. Формула «Блажен человек» узнаваема и понятна, а выражение «поставить грех в счёт» сохраняет важный для Римлянам 4 образ учёта без излишней конфессиональной терминологии.
