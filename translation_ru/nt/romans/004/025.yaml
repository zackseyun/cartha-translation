  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: ru
  text: Который был предан за наши преступления и воскрешён для нашего оправдания[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по причине нашего оправдания».'
    reason: alternative_reading
  - marker: b
    text: «Оправдание» можно также передать как «признание праведными» или «оправдательный приговор».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: был предан
  rationale: Пассивная форма сохраняет греческую конструкцию и допускает подразумеваемое действие Бога; «предан» естественно и ёмко звучит по-русски в контексте смерти Христа.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: за наши преступления
  rationale: διά с винительным здесь естественно передаёт причинную связь; русское «за» сохраняет и причинный, и жертвенный оттенок, не перегружая текст пояснением.
- source_word: παραπτώματα
  choice: преступления
  rationale: Слово обозначает нравственные проступки и нарушения; «преступления» точнее и литературнее, чем обобщённое «грехи», хотя может иметь также юридический оттенок.
- source_word: ἠγέρθη
  choice: воскрешён
  rationale: Страдательная форма отражает греческий аорист пассива и подразумевает воскресившего Бога, не называя его прямо.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: для нашего оправдания
  rationale: Основной текст передаёт конструкцию целевым выражением, согласующимся с контекстом; грамматически возможное причинное понимание сохранено в сноске.
- source_word: δικαίωσιν
  choice: оправдание
  rationale: Устоявшийся и точный русский эквивалент, сохраняющий судебный смысл признания праведным и богословскую связь с ближайшим контекстом Послания.
theological_decisions:
- issue: Означает ли διὰ τὴν δικαίωσιν ἡμῶν цель/результат («для нашего оправдания») или причину («по причине нашего оправдания»).
  choice: для нашего оправдания
  alternative: по причине нашего оправдания
  rationale: Целевое прочтение естественно связывает воскресение Христа с осуществлением оправдания верующих. Однако διά с винительным допускает причинное прочтение, поэтому оно отмечено в сноске без разрешения подлинной неоднозначности.
translation_notes:
  register: Современный литературный и достоинственный русский язык. Синтаксический параллелизм двух пассивных глаголов сохранён; богословский термин «оправдание» оставлен в основном тексте, а более прозрачные варианты даны в сноске.
