source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: ru
  text: Поэтому оно даётся по вере, чтобы всё было по благодати и чтобы обещание было надёжным для всех потомков — не только для тех, кто связан с Законом, но и для тех, кто верит, как Авраам, который является отцом всех нас,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и естественно передаёт логический вывод из предшествующего рассуждения.
- source_word: ἐκ πίστεως
  choice: по вере
  rationale: Сохраняет сжатость греческого выражения и указывает на основание получения обещания, не добавляя отсутствующего в оригинале сказуемого.
- source_word: ἵνα κατὰ χάριν
  choice: чтобы было по благодати
  rationale: Сохраняет эллиптичность исходного текста и явную связь между верой и благодатью.
- source_word: βεβαίαν τὴν ἐπαγγελίαν
  choice: обещание было твёрдым
  rationale: «Твёрдым» передаёт надёжность и незыблемость обещания; «обещание» естественно соответствует ἐπαγγελία.
- source_word: παντὶ τῷ σπέρματι
  choice: для всех потомков
  rationale: σπέρμα употреблено собирательно; «потомки» ясно передаёт смысл без неестественного буквального «семя».
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: не только для тех, кто от Закона
  rationale: Русское множественное число естественно раскрывает собирательный смысл греческого единственного числа, а «от Закона» сохраняет конструкцию ἐκ.
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: для тех, кто разделяет веру Авраама
  rationale: Делает сжатую греческую конструкцию понятной по-русски, сохраняя возможное значение веры Авраама как веры, характеризующей этих людей.
- source_word: πατὴρ πάντων ἡμῶν
  choice: отец всех нас
  rationale: Точно и естественно сохраняет семейно-заветный образ исходного текста.
theological_decisions:
- issue: Как передать эллиптическое начальное ἐκ πίστεως без явно выраженного подлежащего и сказуемого.
  choice: «Поэтому — по вере»
  alternative: «Поэтому обещание даётся по вере»
  rationale: Тире обозначает пропуск, присутствующий и в греческом тексте, и не вводит толковательное сказуемое «даётся».
- issue: Относится ли πίστις Ἀβραάμ к вере самого Авраама или допускает иное понимание родительного падежа.
  choice: «кто разделяет веру Авраама»
  alternative: «кто от веры Авраама»
  rationale: В контексте Рим 4 естественнее речь о людях, характеризуемых такой же верой, как у Авраама; примечание сохраняет более буквальную форму и не превращает толкование в бесспорный факт.
- issue: Единственное число τῷ как коллективное обозначение группы.
  choice: множественное «для тех»
  alternative: единственное «для того»
  rationale: Множественное число ясно выражает коллективный референт по-русски, а формальная особенность оригинала отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Закон» написан с прописной буквы как обозначение Моисеева Закона в данном контексте. Эллиптичность начала сохранена с помощью тире; финальная запятая отражает незавершённость предложения, продолжающегося в следующем стихе.
