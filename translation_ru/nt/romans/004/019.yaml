  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: ru
  text: И, не ослабев в вере, он принял во внимание своё уже омертвевшее тело — ведь ему было около ста лет — и омертвение утробы Сарры.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В иной текстовой традиции: «он не принял во внимание своё уже омертвевшее тело».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀσθενήσας
  choice: не ослабев
  rationale: Деепричастие естественно передаёт аористное причастие и указывает, что Авраам не утратил силы в вере.
- source_word: πίστει
  choice: в вере
  rationale: В контексте речь идёт о доверии Авраама Божьему обещанию; традиционное «вера» точно и понятно передаёт πίστις.
- source_word: κατενόησεν
  choice: принял во внимание
  rationale: Передаёт сознательное принятие факта к сведению, не подразумевая ни беглого взгляда, ни чрезмерно аналитического рассмотрения.
- source_word: νενεκρωμένον
  choice: уже омертвевшее
  rationale: Сохраняет образ смерти и результативное состояние, выраженное перфектным причастием, при этом контекст ясно ограничивает смысл способностью к деторождению.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: ведь ему было около ста лет
  rationale: «Около» передаёт смягчающее πού, а пояснительная конструкция естественно связывает возраст с состоянием тела.
- source_word: νέκρωσιν
  choice: омертвение
  rationale: Сохраняет намеренный повтор родственной лексики смерти в описании тела Авраама и утробы Сарры, не заменяя образ толкованием «бесплодие».
- source_word: μήτρας Σάρρας
  choice: утробы Сарры
  rationale: Конкретный телесный образ греческого μήτρα передан естественной русской родительной конструкцией.
theological_decisions:
- issue: Следует ли смягчить образ репродуктивного омертвения словами «бесплодие» или «неспособность к деторождению»
  choice: 'Сохранить лексику смерти: «омертвевшее тело» и «омертвение утробы»'
  alternative: «неспособное к деторождению тело» и «бесплодие Сарры»
  rationale: Павел намеренно сопоставляет состояние Авраама и Сарры посредством родственных слов νενεκρωμένον и νέκρωσις; этот образ подчёркивает невозможность, преодолённую Божьим обещанием.
- issue: Текстуальный вариант с отрицанием при κατενόησεν
  choice: 'Основной текст SBLGNT: «он принял во внимание»'
  alternative: 'В иной текстовой традиции: «он не принял во внимание своё уже омертвевшее тело»'
  rationale: Основной текст следует указанному изданию SBLGNT, где μή относится к ἀσθενήσας; значимый вариант с отрицанием перед κατενόησεν отмечен в сноске без смешения чтений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Формулировка сохраняет синтаксическую связь причастий, приблизительность возраста и повтор образа омертвения. Слово «утроба» выбрано как понятное и возвышенно-нейтральное обозначение μήτρα.
