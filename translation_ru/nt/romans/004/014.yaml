base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: ru
  text: Ведь если наследниками являются те, чьё положение определяется Законом[a], то вера оказалась пустой[b], а обещание утратило силу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто принадлежит Закону»; возможно также: «те, кто живёт по Закону».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вера оказалась лишена смысла». Буквально здесь сохраняется образ опустошения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обещание стало недействительным» или «оказалось безрезультатным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: те, кто от Закона
  rationale: 'Сохраняет краткое и намеренно широкое выражение Павла: эти люди определяются своим отношением к Закону. Перевод не сужает смысл до одного лишь соблюдения Закона.'
- source_word: κληρονόμοι
  choice: наследники
  rationale: Обычный и точный русский эквивалент в контексте наследства и обещания.
- source_word: κεκένωται
  choice: стала пустой
  rationale: Передаёт образ опустошения и результативное значение перфекта, не заменяя метафору одним только толкованием «бессмысленна» или «тщетна».
- source_word: πίστις
  choice: вера
  rationale: В контексте Римлянам 4 речь идёт о вере в противопоставлении Закону как основании получения наследства; «вера» естественно сохраняет ход рассуждения.
- source_word: κατήργηται
  choice: утратило силу
  rationale: Передаёт приведение обещания к бездействию или недействительности, не создавая впечатления его уничтожения.
- source_word: ἡ ἐπαγγελία
  choice: обещание
  rationale: Современное и ясное обозначение конкретного Божьего обещания, обсуждаемого в контексте.
theological_decisions:
- issue: Значение πίστις в противопоставлении νόμος
  choice: вера
  alternative: верность; доверие
  rationale: Ближайший и более широкий контекст противопоставляет получение обещанного наследства через веру получению его через Закон. «Вера» сохраняет это противопоставление, не уточняя его сверх текста.
- issue: Кого обозначает οἱ ἐκ νόμου
  choice: те, кто от Закона
  alternative: те, кто живёт по Закону; те, кто принадлежит Закону
  rationale: Буквально близкая формулировка сохраняет неоднозначность отношения этих людей к Закону и не сводит его заранее ни к соблюдению предписаний, ни к этнической принадлежности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским синтаксисом. Слово «Закон» написано с прописной буквы как обозначение Моисеева Закона в данном рассуждении. Формулировка «те, кто от Закона» необычна, но намеренно сохраняет компактность и смысловую открытость греческого выражения; варианты пояснены в сноске.
