id: ROM.4.11
reference: Romans 4:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: ru
  text: И он получил знак обрезания как печать праведности по вере, которой он обладал, будучи ещё необрезанным, чтобы стать отцом всех верующих, будучи необрезанными[a], и чтобы праведность была вменена также им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через необрезание»; то есть будучи необрезанными.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «засчитана» либо «поставлена в счёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: знак
  rationale: Прямо и естественно передаёт внешний знак, которым в данном рассуждении служит обрезание.
- source_word: περιτομή
  choice: обрезание
  rationale: Общепринятое и точное обозначение обряда.
- source_word: σφραγίς
  choice: печать
  rationale: Сохраняет метафору удостоверения и подтверждения, не сводя её к отвлечённому толкованию.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: В контексте аргумента Павла это наиболее точный и укоренившийся эквивалент; «справедливость» здесь могла бы сузить смысл до беспристрастности или правосудия.
- source_word: πίστις
  choice: вера
  rationale: Передаёт основное значение в данном контексте; генитивная конструкция выражена естественным русским сочетанием «праведность по вере».
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: будучи ещё необрезанным
  rationale: Ясно передаёт состояние Авраама в тот момент, когда у него уже была вера; «ещё» подчёркивает последовательность, явную из контекста.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: отцом всех верующих
  rationale: Естественная русская формулировка, сохраняющая представительное значение отцовства в рассуждении Павла.
- source_word: δι’ ἀκροβυστίας
  choice: хотя они и не обрезаны
  rationale: Передаёт контекстуальный смысл состояния необрезанных верующих и избегает ошибочного впечатления, будто необрезание является средством веры.
- source_word: λογισθῆναι
  choice: была вменена
  rationale: Сохраняет учётно-судебный оттенок λογίζομαι и связь с терминологией предыдущих стихов; более нейтральные варианты разъяснены в сноске.
- source_word: καί
  choice: также
  rationale: 'Сохраняет включающий акцент: праведность вменяется и необрезанным верующим.'
theological_decisions:
- issue: Отношение обрезания к праведности
  choice: Обрезание представлено как знак и печать уже имевшейся у Авраама праведности по вере, а не как средство её приобретения.
  alternative: Можно сформулировать фразу так, что обрезание будет звучать как средство сообщения праведности.
  rationale: Греческая конструкция связывает печать с праведностью веры, которая была у Авраама в необрезании; перевод сохраняет эту последовательность, не вводя позднейших конфессиональных формулировок.
- issue: Значение δι’ ἀκροβυστίας
  choice: Оборот понят как указание на веру людей, остающихся необрезанными.
  alternative: Буквальное «через необрезание» можно понять инструментально, будто необрезание производит веру или служит её средством.
  rationale: В ходе аргумента Павла речь идёт о включении необрезанных верующих; русская уступительная конструкция ясно передаёт этот смысл, а буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет единство длинного греческого предложения, но причинно-целевые связи выражены ясно. Термин «вменена» выбран ради точности и связи с контекстом Рим 4; сноска предлагает более общеупотребительные соответствия.
