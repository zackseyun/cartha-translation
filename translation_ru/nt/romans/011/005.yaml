  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: ru
  text: Итак, и в нынешнее время появился остаток по избранию благодати[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по благодатному избранию»; или: «по избранию, основанному на благодати».'
    reason: Лексико-синтаксические варианты передачи κατ’ ἐκλογὴν χάριτος.
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Так и
  rationale: Сочетание подводит итог примеру из дней Илии и проводит параллель с настоящим временем. Русское «Так и» естественно передаёт и вывод, и эту параллель; значение οὖν ясно из итоговой конструкции.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: в нынешнее время
  rationale: καιρός обозначает данный период или эпоху. «В нынешнее время» сохраняет временное противопоставление дням Илии и звучит современно.
- source_word: λεῖμμα
  choice: остаток
  rationale: «Остаток» — укоренившийся библейский термин для сохранившейся части народа; он точно передаёт λεῖμμα и связь с предшествующей цитатой.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: по избранию благодати
  rationale: Формулировка сохраняет оба значимых понятия — «избрание» и «благодать» — и не сужает неоднозначную связь генитива χάριτος до одного толкования.
- source_word: γέγονεν
  choice: появился
  rationale: Перфект γίνομαι указывает на возникновение с сохраняющимся результатом. «Появился» передаёт становление естественнее, чем буквальное «стал существовать», и не подменяет его глаголом «сохранился».
theological_decisions:
- issue: Передача ἐκλογή в богословски спорном контексте
  choice: избрание
  alternative: выбор
  rationale: «Избрание» сохраняет стандартный и весомый термин Павла, не встраивая фразу в определённую конфессиональную систему.
- issue: Связь благодати с избранием в κατ’ ἐκλογὴν χάριτος
  choice: по избранию благодати
  alternative: по благодатному избранию; по избранию, основанному на благодати
  rationale: Родительный оборот оставляет открытым, характеризует ли благодать источник, основание или качество избрания, и тем самым сохраняет смысловую ёмкость греческой фразы.
translation_notes:
  register: Современный литературный русский с библейски узнаваемыми терминами «остаток», «избрание» и «благодать». Тире помогает естественно выделить компактный греческий оборот, не превращая его связь с основной мыслью в однозначное пояснение.
