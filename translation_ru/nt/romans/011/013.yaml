  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: ru
  text: 'Вам же, язычникам[a], говорю: поскольку я апостол язычников, я возвеличиваю своё служение[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народам»; так можно перевести греческое слово, переданное как «язычникам» и «язычников» в этом стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прославляю своё служение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Вам же, язычникам, говорю
  rationale: Дательный ὑμῖν передаёт прямое обращение, τοῖς ἔθνεσιν уточняет адресатов, а δέ обозначает мягкий переход или сопоставление; частица «же» естественно сохраняет эту связь без добавления временного «теперь».
- source_word: ἔθνεσιν / ἐθνῶν
  choice: язычникам / язычников
  rationale: В контексте Рим 9–11 речь идёт о нееврейских народах в противопоставлении Израилю. Русское «язычники» ясно передаёт это традиционное этнорелигиозное значение, хотя исходное слово также допускает буквальное «народы».
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: поскольку
  rationale: Оборот указывает на основание или меру сказанного. «Поскольку» естественно передаёт логическую связь; отдельное воспроизведение обеих частиц μὲν οὖν сделало бы русскую фразу перегруженной.
- source_word: ἀπόστολος
  choice: апостол
  rationale: Здесь имеется в виду апостольское призвание Павла, а не просто посланник в общем смысле.
- source_word: τὴν διακονίαν μου
  choice: своё служение
  rationale: διακονία обозначает порученное Павлу апостольское служение. Возвратное «своё» естественно соотносит его с подлежащим «я».
- source_word: δοξάζω
  choice: возвеличиваю
  rationale: Глагол означает прославлять, чтить, придавать славу или подчёркивать значимость. «Возвеличиваю» сохраняет сильную риторическую окраску и не превращает слова Павла в утверждение о самопрославлении.
theological_decisions:
- issue: Смысл возвеличивания служения Павлом
  choice: Павел подчёркивает высокую значимость порученного ему служения, а не прославляет самого себя.
  alternative: «Прославляю своё служение» или понимание этих слов как похвалы своим достижениям.
  rationale: Прямым дополнением δοξάζω является «моё служение». Контекст связывает его значимость с Божьим замыслом о язычниках и Израиле, однако перевод не устраняет силу глагола и сохраняет возможность оттенка прославления.
- issue: Значение ἔθνη
  choice: «Язычники» — нееврейские народы.
  alternative: «Народы».
  rationale: В Рим 9–11 основное противопоставление проходит между Израилем и остальными народами. Основной вариант ясно передаёт эту связь, а буквальная лексическая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены прямое обращение, логическая связь и незавершённость фразы, продолжающейся в следующем стихе; архаические и конфессионально окрашенные добавления не вводились.
