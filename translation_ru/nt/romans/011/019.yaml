  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: ru
  text: 'Тогда ты скажешь: «Ветви были отломлены, чтобы меня привили».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: ты скажешь
  rationale: Будущее время, действительный залог, второе лицо единственного числа. Передаёт прямое обращение Павла к воображаемому собеседнику.
- source_word: οὖν
  choice: тогда
  rationale: Связка отмечает вывод и продолжение рассуждения; «тогда» естественно звучит в русском диалогическом контексте.
- source_word: Ἐξεκλάσθησαν
  choice: были отломлены
  rationale: Аорист пассивного залога от ἐκκλάω. «Отломлены» сохраняет конкретный образ ветвей маслины и пассивную конструкцию.
- source_word: κλάδοι
  choice: ветви
  rationale: Прямой и естественный перевод существительного в развёрнутом образе маслины.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результативное отношение, не устраняя присущую конструкции смысловую широту.
- source_word: ἐγὼ
  choice: я
  rationale: Явно выраженное греческое местоимение имеет смысловое ударение; в русском оно сохраняется как отдельное подлежащее.
- source_word: ἐγκεντρισθῶ
  choice: был привит
  rationale: Аорист пассивного залога, сослагательное наклонение. В русском садоводческом употреблении ветвь «прививают»; мужской род согласуется с воображаемым собеседником, к которому обращено «ты».
theological_decisions:
- issue: Следует ли пояснять, что говорит воображаемый собеседник
  choice: Сохранить прямое обращение во втором лице без поясняющей вставки
  alternative: «Тогда кто-нибудь скажет» или «Тогда ты можешь сказать»
  rationale: Греческий текст непосредственно говорит «ты скажешь»; характер диатрибы раскрывается контекстом и не требует добавления в сам стих.
- issue: Следует ли представлять придаточное с ἵνα как одобренное Павлом утверждение о Божьем замысле
  choice: 'Передать слова собеседника прямо: «чтобы я был привит»'
  alternative: Добавить пояснение или смягчить причинно-целевую связь
  rationale: Это реплика воображаемого собеседника. Перевод сохраняет её формулировку, не приписывая Павлу без оговорок содержащийся в ней вывод.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, с сохранением образа прививки и диалогической структуры оригинала. Кавычки показывают границы реплики.
