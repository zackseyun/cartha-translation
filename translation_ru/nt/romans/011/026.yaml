id: ROM.11.26
reference: Romans 11:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: ru
  text: 'И таким образом весь Израиль будет спасён[a], как написано: «Придёт с Сиона Избавитель; Он отвратит нечестие от Иакова»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И так весь Израиль будет спасён». Греческое οὕτως может означать «так», но здесь, вероятно, указывает на образ действия — на только что описанный ход событий.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «весь Израиль» толкуют по-разному: как весь этнический Израиль, как верующий остаток Израиля или как полноту народа Божьего. Перевод сохраняет греческую формулировку, не выбирая одно из этих толкований. Греческое «с Сиона» можно также перевести «из Сиона».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: таким образом
  rationale: Передаёт значение образа действия и естественно указывает на описанный выше ход событий, не сводя фразу лишь к следствию.
- source_word: πᾶς Ἰσραήλ
  choice: весь Израиль
  rationale: Прямо и естественно передаёт греческое выражение, не уточняя спорный референт.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: Сохраняет обычный для Павла сотериологический смысл будущего страдательного залога от σῴζω.
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Устойчивое и ясное русское соответствие формуле введения цитаты.
- source_word: Ἥξει
  choice: Придёт
  rationale: Естественная русская форма, уместная в пророческой цитате.
- source_word: ἐκ Σιὼν
  choice: с Сиона
  rationale: Идиоматично передаёт исходное движение от Сиона; более буквальное «из Сиона» также возможно.
- source_word: ὁ ῥυόμενος
  choice: Избавитель
  rationale: Передаёт субстантивированное причастие как весомое обозначение лица и хорошо соответствует библейскому регистру.
- source_word: ἀποστρέψει
  choice: отвратит
  rationale: Сохраняет образ поворота прочь и каузативную направленность глагола, не заменяя его более толковательным «удалит».
- source_word: ἀσεβείας
  choice: нечестие
  rationale: Русское единственное собирательное существительное естественно передаёт множественное число ἀσεβείας как проявления безбожия и сохраняет религиозно-нравственный смысл.
- source_word: ἀπὸ Ἰακώβ
  choice: от Иакова
  rationale: Сохраняет имя Иаков и формулировку цитаты, не гармонизируя её с предшествующим словом «Израиль».
theological_decisions:
- issue: Кого обозначает выражение «весь Израиль»
  choice: Сохранено буквальное выражение «весь Израиль» без поясняющего расширения.
  alternative: Весь этнический Израиль; верующий остаток Израиля; полнота народа Божьего, включая язычников.
  rationale: Само греческое выражение не разрешает однозначно богословский спор, поэтому перевод сохраняет его открытость.
- issue: Титульный характер слова «Избавитель»
  choice: Слово написано с прописной буквы как обозначение конкретной мессианской личности в применяемой Павлом цитате.
  alternative: «избавитель» со строчной буквы; «тот, кто избавляет».
  rationale: Прописная буква в русском тексте уместно показывает титульное употребление, не добавляя отдельного имени или доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром библейской цитаты. «Отвратит нечестие» сохраняет образность оригинала и достоинство стиля, оставаясь понятным современному читателю.
