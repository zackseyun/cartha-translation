  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: ru
  text: Ибо всё — из Него, через Него и к Нему. Ему слава вовеки[a]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во веки»; греческий оборот обозначает нескончаемую длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ибо
  rationale: Союз вводит основание предшествующего славословия; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному, но понятному регистру.
- source_word: ἐξ αὐτοῦ
  choice: из Него
  rationale: Предлог ἐξ указывает на источник или происхождение. «Из Него» передаёт исходную метафору без добавления поясняющего глагола.
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: διά с родительным падежом выражает посредство или средство; «через Него» кратко и точно сохраняет этот смысл.
- source_word: εἰς αὐτόν
  choice: к Нему
  rationale: εἰς обозначает направление, цель или конечный итог. «К Нему» сохраняет направленность и не сужает её до одного лишь значения предназначения.
- source_word: τὰ πάντα
  choice: всё
  rationale: Субстантивированное среднее множественное имеет всеохватный смысл. Русское «всё» естественно передаёт космический охват выражения.
- source_word: αὐτῷ ἡ δόξα
  choice: Ему слава
  rationale: Безглагольная формула передана столь же лаконичным русским славословием без искусственного добавления связки.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Это устойчивое обозначение нескончаемой длительности; «вовеки» сохраняет торжественный библейский регистр и остаётся понятным современному читателю.
- source_word: ἀμήν
  choice: Аминь
  rationale: Сохранена общепринятая русская форма литургического подтверждения.
theological_decisions:
- issue: К кому относятся повторяющиеся местоимения αὐτοῦ/αὐτόν/αὐτῷ
  choice: Местоимения сохранены как «Него/Нему»; из ближайшего контекста их референтом является Бог.
  alternative: Прямо заменить местоимения словом «Бог».
  rationale: Контекст Рим 11:33–35 указывает на Бога, однако сохранение местоимений воспроизводит риторическую форму греческого текста и не вносит лишнего уточнения.
- issue: Смысл εἰς αὐτόν
  choice: «к Нему», с сохранением образа конечной направленности всего сущего
  alternative: «для Него», с явным акцентом на предназначении
  rationale: Греческий предлог допускает оттенки направления, цели и предназначения. «К Нему» сохраняет эту смысловую ёмкость, не разрешая неоднозначность преждевременно.
- issue: Форма славословия αὐτῷ ἡ δόξα
  choice: «Ему слава»
  alternative: «Ему да будет слава» или «Ему принадлежит слава»
  rationale: В греческом нет выраженного глагола. Русская безглагольная формула передаёт и хвалебное пожелание, и признание славы, не выбирая исключительно одно из них.
translation_notes:
  register: Современный литературный русский язык с лаконичным и торжественным ритмом славословия. Заглавные буквы в местоимениях использованы как принятая русская reverential convention; они не заменяют контекстуальное определение референта. Тире обозначает подразумеваемую связку в безглагольном греческом предложении.
