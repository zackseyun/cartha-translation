  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: ru
  text: Но что говорит ему Божий ответ[a]? «Я сохранил для Себя[b] семь тысяч мужчин, которые не преклонили колена перед Ваалом».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ответ от Бога»; возможно также: «изречение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я оставил для Себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: Божий ответ
  rationale: В данном контексте слово обозначает авторитетный ответ Бога Илии. Такой перевод ясно передаёт источник ответа и звучит естественнее, чем «оракул» или «изречение».
- source_word: Κατέλιπον
  choice: Я оставил
  rationale: Аорист передан прошедшим временем; в контексте результат действия сохраняется — эти люди остаются верными Богу. Более буквальное «оставил» также сохраняет связь с образом остатка.
- source_word: ἐμαυτῷ
  choice: Себе
  rationale: Возвратное местоимение в дательном падеже показывает, что Бог оставил этих людей для Себя.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: семь тысяч мужчин
  rationale: Греческое ἄνδρας является явно мужским обозначением, поэтому оно не нейтрализовано словом «людей».
- source_word: οἵτινες
  choice: которые
  rationale: Относительное местоимение вводит характеристику семи тысяч; русское «которые» естественно передаёт эту связь без избыточного усиления.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: не преклонили колена
  rationale: Перевод сохраняет телесный образ поклонения и устойчиво звучит в современном литературном русском языке.
- source_word: τῇ Βάαλ
  choice: перед Ваалом
  rationale: Русское управление «преклонить колено перед кем-либо» естественно передаёт направленность поклонения; артикль при имени божества отдельно не воспроизводится.
theological_decisions:
- issue: Следует ли явно указать, что ответ исходит от Бога
  choice: «Божий ответ»
  alternative: «ответ» или «изречение»
  rationale: Контекст и ветхозаветная цитата показывают, что отвечает Бог. Уточнение передаёт смысл χρηματισμός, не добавляя к тексту конфессионального толкования.
- issue: Передача мужского рода в ἄνδρας
  choice: «мужчин»
  alternative: «людей»
  rationale: Исходный текст употребляет обозначение мужчин, и перевод сохраняет эту конкретность.
- issue: Временной оттенок Κατέλιπον
  choice: «Я оставил»
  alternative: «Я сохранил» или «Я оставил за Собой»
  rationale: Прошедшее время прямо отражает аорист, тогда как контекст позволяет читателю увидеть продолжающийся результат. Формулировка не превращает этот оттенок в явно выраженный перфект.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для обычного читателя; выражение «преклонили колена» сохраняет исходный образ поклонения.
