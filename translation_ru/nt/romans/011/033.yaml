id: ROM.11.33
reference: Romans 11:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: ru
  text: О, бездна богатства, мудрости и знания Бога![a] Как непостижимы Его решения и как неисследимы Его пути![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «О, бездна богатства мудрости и знания Бога!» Греческий синтаксис допускает более тесную связь слова «богатство» с последующей парой; в основном тексте богатство, мудрость и знание представлены как три принадлежащие Богу качества.'
    reason: alternative_reading
  - marker: b
    text: Слово, переведённое как «неисследимы», буквально указывает на то, что невозможно выследить или проследить до конца; оно отличается от слова «непостижимы» в первой части фразы.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: О
  rationale: Восклицательная частица передаёт благоговейное изумление; «О» естественно для возвышенной современной русской речи.
- source_word: βάθος
  choice: бездна
  rationale: В данном образном и славословном контексте «бездна» ярко передаёт неизмеримую глубину и сохраняет форму существительного.
- source_word: πλούτου
  choice: богатства
  rationale: Сохраняет павловский образ изобилия и не сводит его к материальному достатку.
- source_word: σοφίας
  choice: мудрости
  rationale: Передаёт Божью мудрость как отдельное понятие, не сливая её со знанием.
- source_word: γνώσεως
  choice: знания
  rationale: Прямой и ясный эквивалент, сохраняющий отличие от мудрости.
- source_word: θεοῦ
  choice: Бога
  rationale: 'Родительный падеж сохранён; в основном тексте он отнесён ко всему ряду: богатству, мудрости и знанию.'
- source_word: ὡς
  choice: Как
  rationale: Естественно вводит восклицание о непостижимости Божьих решений и путей.
- source_word: ἀνεξεραύνητα
  choice: непостижимы
  rationale: Передаёт невозможность исследовать и полностью постичь Божьи κρίματα, оставаясь понятным современному читателю.
- source_word: κρίματα
  choice: решения
  rationale: Передаёт Божьи определения и вердикты без возможной в современном русском языке ассоциации слова «суды» с судебными учреждениями.
- source_word: ἀνεξιχνίαστοι
  choice: неисследимы
  rationale: Сохраняет образ того, что невозможно проследить или разведать до конца, и отличается от «непостижимы».
- source_word: ὁδοὶ
  choice: пути
  rationale: Сохраняет библейскую метафору образа действий Бога.
- source_word: αὐτοῦ
  choice: Его
  rationale: Повтор притяжательного местоимения сохранён в обеих частях высказывания.
theological_decisions:
- issue: К каким существительным относится родительный θεοῦ
  choice: '«Бога» относится ко всему трёхчленному ряду: богатству, мудрости и знанию.'
  alternative: «Богатство мудрости и знания Бога», где мудрость и знание раскрывают содержание богатства.
  rationale: Греческий синтаксис допускает оба понимания. Основной текст следует наиболее естественному в контексте накоплению трёх принадлежащих Богу качеств, а подлинная неоднозначность отмечена в сноске.
- issue: Различение ἀνεξεραύνητα и ἀνεξιχνίαστοι
  choice: «непостижимы» и «неисследимы»
  alternative: Передать оба прилагательных одним близким по смыслу словом, например «непостижимы».
  rationale: Два разных русских слова сохраняют риторическое различие греческих прилагательных, не превращая его в жёсткое богословское разграничение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным славословным звучанием. Образы «бездна» и «пути» сохранены; архаический порядок слов и чрезмерно церковнославянская лексика не используются. Повтор «как» делает параллелизм естественным по-русски.
