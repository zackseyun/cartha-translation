  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: ru
  text: Пусть их глаза помрачатся[a], чтобы они не видели, и постоянно сгибай их спину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ослепнут». Буквально по-гречески: «помрачатся»; это сохраняет образ тьмы в цитируемом тексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всегда». Выражение обозначает постоянную, непрерывную длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: пусть … помрачатся
  rationale: Пассивный императив третьего лица передан побудительной конструкцией с «пусть». Глагол «помрачатся» сохраняет образ тьмы, не сводя его сразу к истолкованию «ослепнут».
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: их глаза
  rationale: Прямо передаёт принадлежность и сохраняет телесный образ исходного текста.
- source_word: τοῦ μὴ βλέπειν
  choice: чтобы они не видели
  rationale: Естественно передаёт целевое или результативное значение конструкции с артиклевым инфинитивом, не устраняя присущую ей смысловую неоднозначность.
- source_word: τὸν νῶτον αὐτῶν
  choice: их спину
  rationale: Сохраняет единственное число греческого существительного и остаётся естественным в русском при собирательном отношении к группе лиц.
- source_word: διὰ παντός
  choice: навсегда
  rationale: В сочетании с аористным повелительным «согни» естественно выражает неограниченную длительность получившегося состояния. Возможное значение постоянной, непрерывной длительности отмечено в сноске.
- source_word: σύγκαμψον
  choice: согни
  rationale: Аористный активный императив передан прямым совершенным повелительным наклонением; физический образ согнутой спины сохранён без пояснительного расширения.
theological_decisions:
- issue: Проклятие-мольба и действие Бога
  choice: 'Сохранена побудительно-повелительная форма: «Пусть … помрачатся … и согни…»'
  alternative: Передать как предсказание («их глаза помрачатся») либо как безличное последствие («их спина будет согнута»).
  rationale: Форма цитаты выражает суровую мольбу или воззвание о суде. Перевод не смягчает её до простого предсказания и не устраняет подразумеваемого адресата второго повеления.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией, уместной для поэтической библейской цитаты. Порядок слов остаётся естественным, а повелительная сила и телесные образы оригинала сохранены.
