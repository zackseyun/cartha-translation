  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: ru
  text: Ибо кто познал ум Господа? Или кто стал Его советником?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Павел перекликается с Ис 40:13, где греческий текст сходным образом спрашивает, кто познал ум Господа или стал Его советником.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос; простое «кто» естественно и точно.
- source_word: γὰρ
  choice: ибо
  rationale: Союз обосновывает предыдущее утверждение; «ибо» сохраняет пояснительную связь и возвышенный ритм цитаты.
- source_word: ἔγνω
  choice: познал
  rationale: Аорист γινώσκω в риторическом вопросе передан совершенным видом; «познал» сохраняет значение знания, не сужая его до понимания.
- source_word: νοῦν
  choice: ум
  rationale: Прямой эквивалент, охватывающий мысль, замысел и разумение Господа и сохраняющий связь с Ис 40:13.
- source_word: κυρίου
  choice: Господа
  rationale: Обычный эквивалент κύριος; форма родительного падежа естественна в сочетании «ум Господа».
- source_word: ἢ
  choice: или
  rationale: Сохраняет разделительную связь между параллельными риторическими вопросами.
- source_word: σύμβουλος
  choice: советником
  rationale: Точно обозначает того, кто дает совет; творительный падеж обусловлен русской конструкцией со словом «стал».
- source_word: αὐτοῦ
  choice: Его
  rationale: Передает принадлежность и ясно указывает на Господа; прописная буква соответствует принятому благоговейному русскому употреблению.
- source_word: ἐγένετο
  choice: стал
  rationale: Естественно передает значение «стал, сделался» без добавления отсутствующего в тексте временного уточнения.
theological_decisions:
- issue: К кому относится «Господь» в цитате из Исаии
  choice: Сохранено «Господь» без дальнейшего уточнения; в контексте речь идет о Боге.
  alternative: Передать ветхозаветное имя как «Яхве» или типографически выделить «ГОСПОДЬ».
  rationale: В греческом тексте стоит κυρίου. Перевод сохраняет новозаветную форму цитаты и не вносит в основной текст уточнение из еврейского фона.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, соответствующим библейской цитате строем. Синтаксический параллелизм двух риторических вопросов сохранен.
