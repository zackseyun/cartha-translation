id: ROM.11.28
reference: Romans 11:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: ru
  text: По отношению к Благой вести они враги ради вас[a], а по отношению к избранию — возлюблены ради отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за вас». Греческое выражение может указывать как на причину, так и на то, ради кого или на чью пользу сложилось такое положение.'
    reason: lexical_alternative
  - marker: b
    text: «Отцы» — патриархи Израиля, прежде всего Авраам, Исаак и Иаков.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: По отношению к Благой вести
  rationale: κατά с винительным падежом обозначает здесь аспект или сферу рассмотрения. Формулировка сохраняет противопоставление μέν…δέ и естественно звучит по-русски.
- source_word: εὐαγγέλιον
  choice: Благая весть
  rationale: Передаёт смысл провозглашаемой вести о Мессии и остаётся понятным современному читателю; прописная буква указывает на употребление выражения как обозначения христианской вести.
- source_word: ἐχθροὶ
  choice: враги
  rationale: Предикативное прилагательное передано существительным в сказуемом, что сохраняет сильный реляционный смысл и не превращает выражение в утверждение, будто Бог их безусловно ненавидит.
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: διά с винительным может обозначать основание или то, ради кого нечто происходит. «Ради вас» естественно связано с мыслью Павла о пользе для язычников, не устраняя полностью причинного оттенка.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: а по отношению к избранию
  rationale: Повтор сохраняет параллельную контрастную структуру оригинала; «избрание» точно передаёт богословски значимое ἐκλογή без поясняющего расширения.
- source_word: ἀγαπητοὶ
  choice: возлюблены
  rationale: Краткая форма естественно передаёт состояние тех, кто любим, и сохраняет напряжение с «враги». Она не добавляет прямо названного деятеля, которого нет в греческом тексте.
- source_word: διὰ τοὺς πατέρας
  choice: ради отцов
  rationale: Сохраняет краткое заветное обозначение патриархов и допускаемый διά оттенок основания или отношения ради них, не подменяя исходное выражение толкованием.
theological_decisions:
- issue: К кому относится подразумеваемое «они»
  choice: К Израилю, еврейскому народу, рассматриваемому совокупно в ходе рассуждения Римлянам 9–11
  alternative: Только к неверующим иудеям времени Павла
  rationale: Русский текст, как и греческий, допускает восстановление субъекта из контекста и не сужает его искусственно, хотя непосредственная историческая ситуация связана с неверием многих из Израиля.
- issue: Смысл слова «враги»
  choice: Оно описывает их положение по отношению к Благой вести и сохраняет его в напряжении с тем, что они возлюблены
  alternative: Оно означает, что Бог безусловно ненавидит их, либо лишь то, что они проявляют общественную враждебность
  rationale: Сам стих сопоставляет «враги» и «возлюблены»; перевод не снимает ни одну из сторон этого парадокса.
- issue: Значение выражения «отцы»
  choice: Патриархи Израиля, прежде всего Авраам, Исаак и Иаков
  alternative: Предки вообще, только в этническом смысле
  rationale: В контексте Римлянам 9–11 это выражение вызывает в памяти патриархов и данные им обещания, однако основной текст сохраняет буквальное «отцы».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Параллелизм «по отношению к… а по отношению к…» сохраняет структуру и богословское напряжение оригинала; «возлюблены» избегает как разговорной плоскости, так и лишнего уточнения «Богом».
