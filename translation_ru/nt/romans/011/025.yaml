review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: причинное «ибо», апостольское обращение, раскрываемая «тайна», предостережение против самонадеянности, частичный характер ожесточения и временная граница до вхождения полноты язычников сохранены. Однако «Израиль ... подвергся ожесточению» вводит пассивную конструкцию с оттенком внешнего деятеля, которого греческое πώρωσις ... γέγονεν прямо не называет. Номинальная конструкция точнее передаёт, что состояние ожесточения наступило для Израиля.'
  naturalness: В исходном тексте вставка обращения между «в неведении» и «об этой тайне» несколько разрывает русское управление. Перенос обращения после «не хочу» делает фразу естественнее. «Частичное ожесточение постигло Израиль» — современная литературная и ясная формулировка; она не уточняет спорный вопрос, относится ли частичность прежде всего к охвату народа или к состоянию.
  terminology: «Тайна», «ожесточение», «Израиль», «язычники» и «полнота» соответствуют контексту Павла и сохраняют богословскую терминологию без конфессионального истолкования. Сноска к «полноте» уместно оставляет альтернативу «полное число язычников».
  issues:
  - severity: medium
    issue: Пассивное «Израиль ... подвергся ожесточению»
    rationale: Греческий текст говорит, что ожесточение «случилось/наступило» для Израиля, а не формулирует действие неуказанного субъекта над Израилем. Пассивная русская конструкция может излишне обозначать внешнее причинение.
  - severity: low
    issue: Позиция обращения «братья»
    rationale: Сочетание «в неведении, братья, об этой тайне» тяжеловесно и разрывает зависимые компоненты. Перестановка сохраняет смысл и улучшает русский синтаксис.
