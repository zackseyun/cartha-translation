revisions:
- from: 'Ибо не хочу, чтобы вы оставались в неведении, братья[a], об этой тайне, — чтобы вы не считали себя мудрыми: Израиль отчасти подвергся ожесточению до тех пор, пока не войдёт полнота язычников[b].'
  to: 'Ибо я не хочу, братья[a], чтобы вы оставались в неведении об этой тайне, — чтобы вы не считали себя мудрыми: частичное ожесточение постигло Израиль до тех пор, пока не войдёт полнота язычников[b].'
  rationale: Исправлены только синтаксис обращения и передача πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν. «Частичное ожесточение постигло Израиль» точнее следует номинальной конструкции оригинала, не добавляя подразумеваемого деятеля и не разрешая экзегетическую неоднозначность «отчасти». Все сноски, маркеры и богословская открытость исходного варианта сохранены.
