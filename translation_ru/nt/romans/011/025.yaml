id: ROM.11.25
reference: Romans 11:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: ru
  text: 'Ибо я не хочу, братья[a], чтобы вы оставались в неведении об этой тайне, — чтобы вы не считали себя мудрыми: частичное ожесточение постигло Израиль до тех пор, пока не войдёт полнота язычников[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; греческое слово буквально означает «братья», но может быть обращением к смешанной группе.
    reason: lexical_alternative
  - marker: b
    text: Или «полное число язычников».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: оставались в неведении
  rationale: Естественно передаёт устойчивую формулу οὐ θέλω ὑμᾶς ἀγνοεῖν без уничижительного оттенка слова «невежество».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму обращения; вероятный охват женщин разъяснён в сноске.
- source_word: μυστήριον
  choice: тайна
  rationale: В языке Павла обозначает прежде сокрытый, а теперь открываемый Божий замысел; «тайна» сохраняет богословский регистр.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: чтобы вы не считали себя мудрыми
  rationale: Современное и ясное русское выражение, передающее предостережение против самомнения.
- source_word: πώρωσις
  choice: ожесточение
  rationale: Устоявшийся русский эквивалент для духовной нечувствительности и упорства в данном контексте.
- source_word: ἀπὸ μέρους
  choice: отчасти
  rationale: 'Сохраняет неоднозначность в отношении масштаба: ожесточение затронуло Израиль не полностью, без утверждения о его длительности.'
- source_word: τῷ Ἰσραὴλ γέγονεν
  choice: Израиль отчасти подвергся ожесточению
  rationale: Передаёт перфект как наступившее состояние с продолжающимся результатом и звучит естественно по-русски.
- source_word: πλήρωμα
  choice: полнота
  rationale: Сохраняет широкую семантику слова и не решает спорный вопрос, означает ли оно полное число, полноту включения или завершение.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В противопоставлении Израилю обозначает неевреев; это точнее контекстуального значения, чем буквальное «народов».
- source_word: εἰσέλθῃ
  choice: не войдёт
  rationale: После «до тех пор, пока» естественно передаёт аорист сослагательного наклонения как событие, обозначающее предел нынешнего состояния.
theological_decisions:
- issue: Значение выражения «полнота язычников»
  choice: В основном тексте сохранено «полнота язычников» без уточнения.
  alternative: «полное число язычников» или «полное вхождение язычников»
  rationale: Греческое выражение допускает несколько богословски значимых толкований; перевод не должен преждевременно выбирать одно из них.
- issue: Объём обращения ἀδελφοί
  choice: В основном тексте оставлено «братья».
  alternative: «братья и сёстры»
  rationale: Основной текст сохраняет мужскую форму греческого обращения, а вероятный инклюзивный смысл для смешанной общины отмечен в сноске.
- issue: Характер ожесточения Израиля
  choice: «отчасти подвергся ожесточению»
  alternative: «ожесточение постигло часть Израиля»
  rationale: Формулировка сохраняет естественную связь ἀπὸ μέρους с объёмом ожесточения, не определяя точнее, относится ли частичность к части народа или к степени состояния.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Синтаксис слегка упрощён для ясности, но причинная связь, цель предостережения и богословская неоднозначность ключевых выражений сохранены.
