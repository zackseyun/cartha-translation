id: ROM.11.1
reference: Romans 11:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: ru
  text: 'Итак, я спрашиваю: неужели Бог отверг Свой народ? Ни в коем случае![a] Ведь и я израильтянин, из потомства Авраама,[b] из колена Вениамина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Да не будет!» — решительное выражение отрицания; также можно перевести: «Безусловно, нет!»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из семени Авраама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Итак, я спрашиваю
  rationale: λέγω вводит риторический вопрос, а οὖν связывает его с предшествующим рассуждением; такой перевод естественно передаёт обе функции.
- source_word: μὴ ἀπώσατο
  choice: неужели ... отверг
  rationale: Вопрос с μή предполагает отрицательный ответ, а ἀπωθέομαι означает отвергать или отталкивать; «неужели» ясно передаёт риторический характер вопроса.
- source_word: τὸν λαὸν αὐτοῦ
  choice: Свой народ
  rationale: Возвратное притяжательное местоимение естественно по-русски указывает на принадлежность народа Богу и сохраняет заветный оттенок без поясняющих добавлений.
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Устойчивое современное выражение передаёт решительное Павлово отрицание, более сильное, чем простое «нет».
- source_word: καὶ γὰρ ἐγὼ
  choice: Ведь и я
  rationale: γάρ вводит обоснование, καί имеет значение «также/и», а явное ἐγώ подчёркивает самого Павла как свидетельство.
- source_word: Ἰσραηλίτης
  choice: израильтянин
  rationale: Прямое и понятное обозначение этнической и заветной принадлежности.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: из потомства Авраама
  rationale: «Потомство» естественно передаёт родословное значение σπέρμα; буквальное «семя» сохранено в примечании как традиционная лексическая альтернатива.
- source_word: φυλῆς Βενιαμίν
  choice: из колена Вениамина
  rationale: «Колено» — устоявшееся и понятное русское обозначение племенного подразделения Израиля.
theological_decisions:
- issue: Подразумевает ли вопрос окончательное или полное отвержение Израиля
  choice: 'Передать без уточняющих наречий: «неужели Бог отверг Свой народ?»'
  alternative: «неужели Бог навсегда/полностью отверг Свой народ?»
  rationale: В греческом тексте нет слов «навсегда» или «полностью»; объём и характер возможного отвержения раскрываются дальнейшим контекстом, поэтому богословское напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Риторический вопрос передан естественно, без добавления богословских уточнений; традиционное «колено Вениамина» сохранено как общеупотребительное библейское выражение.
