source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: ru
  text: Ведь Бог заключил всех в непослушание[a][b][c], чтобы всех помиловать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предал всех непослушанию»; возможны также варианты «замкнул всех» или «держал всех в заключении».'
    reason: lexical_alternative
  - marker: b
    text: Слово «непослушание» в некоторых контекстах может означать также «неверие», но здесь, вероятно, имеется в виду более широкий смысл — отказ повиноваться.
    reason: lexical_alternative
  - marker: c
    text: Повторение слова «всех» сохраняет формулировку Павла; не следует заранее сужать её смысл. В контексте речь идёт об иудеях и язычниках вместе.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: заключил
  rationale: Глагол συγκλείω означает «заключать, запирать, держать взаперти». «Заключил» сохраняет образ ограниченности и подчинённости, не усиливая его до явно карательного «заточил» и не сводя к более отвлечённому «предал».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит объяснение предшествующего рассуждения. «Ведь» естественно передаёт эту связь в современном русском языке.
- source_word: τοὺς πάντας
  choice: всех
  rationale: Одинаковый оборот дважды переведён одинаково, чтобы сохранить широту и риторическую симметрию греческого текста, не уточняя в самом переводе его объём.
- source_word: εἰς ἀπείθειαν
  choice: в непослушание
  rationale: «Непослушание» передаёт ἀπείθεια как отказ повиноваться и сохраняет более широкий смысл, чем одно лишь интеллектуальное неверие. Предлог «в» следует направительно-результативному оттенку εἰς и поддерживает метафору заключения.
- source_word: ἵνα
  choice: чтобы
  rationale: «Чтобы» естественно выражает целевое значение ἵνα и не делает русскую фразу тяжеловесной.
- source_word: ἐλεήσῃ
  choice: помиловать
  rationale: «Помиловать» ясно и кратко передаёт действие ἐλεάω — проявить милость. Инфинитив после «чтобы» при общем субъекте грамматически естественен по-русски и не выражает сомнения в Божьем намерении.
theological_decisions:
- issue: Объём значения «всех» в обеих частях стиха
  choice: В обоих случаях сохранить «всех», не сужая и не расширяя референт в основном тексте.
  alternative: «всех людей»; «и иудеев, и язычников»; контекстуально ограниченное обозначение обеих обсуждаемых групп
  rationale: Греческий текст дважды повторяет τοὺς πάντας. Контекст говорит об иудеях и язычниках, однако сам стих сформулирован широко. Перевод сохраняет эту симметрию и богословское напряжение, не решая средствами перевода вопрос о всеобщем спасении.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью апостольского рассуждения. Конструкция «заключил всех в непослушание» намеренно сохраняет исходную метафору, хотя она менее разговорна, чем «предал всех непослушанию».
