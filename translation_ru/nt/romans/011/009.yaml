lexical_decisions:
- source_word: Δαυὶδ
  choice: Давид
  rationale: Традиционная русская форма библейского имени.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время передано литературным настоящим при введении цитаты.
- source_word: Γενηθήτω
  choice: пусть … станет
  rationale: Передаёт побудительно-желательное значение греческого императива и не превращает суровое пожелание в простое предсказание.
- source_word: τράπεζα
  choice: стол
  rationale: Сохранён конкретный образ исходного текста без поясняющего расширения до «пира» или «трапезы».
- source_word: παγίδα
  choice: силок
  rationale: Естественное обозначение средства поимки, позволяющее отличить этот образ от следующего близкого по смыслу слова.
- source_word: θήραν
  choice: ловушка
  rationale: В данном ряду слово связано с охотой и поимкой; «ловушка» естественно передаёт контекстуальный смысл, сохраняя близость к παγίδα.
- source_word: σκάνδαλον
  choice: камень преткновения
  rationale: Устоявшееся и понятное выражение, сохраняющее образ причины падения, а не только субъективной обиды.
- source_word: ἀνταπόδομα
  choice: воздаяние
  rationale: Передаёт ответное возмещение или отплату; контекст допускает карательный оттенок, но слово не устраняет смысловую широту полностью.
- source_word: αὐτοῖς
  choice: для них
  rationale: 'Дательный падеж отнесён ко всему ряду именных сказуемых: стол становится всем перечисленным для них; такая позиция естественна по-русски и сохраняет возможную синтаксическую связь.'
theological_decisions:
- issue: Проклятийное пожелание в цитате из Псалма 68:23 по русской нумерации
  choice: 'Сохранено прямое пожелание: «Пусть их стол станет…»'
  alternative: «Их стол станет…» или «Да станет их стол…»
  rationale: Греческий императив требует сохранить силу пожелания, а не смягчать его до предсказания; конструкция «пусть» современна и одновременно достойна по регистру.
- issue: Характер ἀνταπόδομα
  choice: воздаяние
  alternative: отплата; возмездие
  rationale: «Воздаяние» сохраняет идею ответного возмещения и не делает карательную трактовку более однозначной, чем греческое слово, хотя суровый контекст её поддерживает.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Перечень оформлен без многократного союза «и», что естественно для русского синтаксиса, при сохранении всех четырёх образов. Маркер [a] присутствует в основном тексте.
