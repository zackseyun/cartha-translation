base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: ru
  text: Так и они теперь проявили непослушание, чтобы благодаря милости, оказанной вам,[a] они тоже теперь были помилованы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря вашей милости». Греческое выражение допускает такое более буквальное понимание, однако в контексте, вероятнее всего, речь идёт о милости, которую Бог оказал вам.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ οὗτοι
  choice: так и они
  rationale: Передаёт сопоставление с предыдущим стихом и отсылает к Израилю, не создавая неестественного русского оборота «эти».
- source_word: νῦν ἠπείθησαν
  choice: теперь проявили непослушание
  rationale: Сохраняет временной акцент и широкий смысл ἀπειθέω, включающий неверие и неповиновение, не сводя его лишь к интеллектуальному неверию.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: по милости, оказанной вам
  rationale: Передаёт сжатую дательную конструкцию как указание на Божью милость, полученную адресатами, что соответствует ходу мысли в Рим 11:30–32.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное отношение, не устраняя присущую конструкции смысловую широту.
- source_word: καὶ αὐτοὶ νῦν ἐλεηθῶσιν
  choice: и им теперь быть помилованными
  rationale: Сохраняет включающее усиление καὶ αὐτοὶ, второе νῦν и страдательную форму, подразумевающую Бога как подателя милости.
theological_decisions:
- issue: Относится ли «ваша милость» к милосердию, проявляемому верующими из язычников, или к Божьей милости, оказанной им
  choice: по милости, оказанной вам
  alternative: через вашу милость
  rationale: Контекст Рим 11:30–32 последовательно говорит о Божьем помиловании прежде непокорных групп. Основной текст отражает наиболее вероятную связь, а буквальная и грамматически возможная альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет плотность и параллелизм аргумента Павла. «Проявили непослушание» звучит естественнее буквального «были непослушны», а «быть помилованными» сохраняет богословски значимый пассив.
