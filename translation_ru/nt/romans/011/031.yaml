  verdict: revise
  source_fidelity: 'Основной смысл передан верно: сопоставление с предыдущим стихом, нынешнее непослушание, связь с милостью, полученной адресатами, и последующее помилование сохранены. Однако инфинитивный оборот «и им теперь быть помилованными» после «чтобы» грамматически и стилистически неудачен; греческий ἵνα с аористным сослагательным страдательного залога естественнее передать личной формой «чтобы ... были помилованы».'
  naturalness: «Так и они теперь проявили непослушание» приемлемо в современном литературном русском. Замена «по милости» на «благодаря милости» яснее выражает инструментально-каузальную связь и звучит естественнее. Личная форма «были помилованы» устраняет тяжеловесную и ненормативную конструкцию с инфинитивом.
  terminology: «Непослушание» адекватно передаёт ἀπειθέω, не сужая его до одного лишь неверия. «Помилованы» точно передаёт страдательный залог ἐλεηθῶσιν и сохраняет подразумеваемого Подателя милости. Примечание корректно сохраняет грамматически возможное прочтение τῷ ὑμετέρῳ ἐλέει без догматического навязывания.
