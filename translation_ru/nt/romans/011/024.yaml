source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: ru
  text: Ведь если ты был отсечён от дикой по природе маслины и, вопреки природе, привит к культурной маслине, то тем более они — ветви по природе[a] — будут привиты[b] к своей маслине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они, те, кто по природе»; слово «ветви» восполнено из контекста метафоры маслины.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «будут снова привиты к своей маслине». Возвращение подразумевается контекстом, хотя слово «снова» в греческом глаголе прямо не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: был отсечён
  rationale: Глагол ἐκκόπτω означает «отсекать, срезать». «Отсечён» сохраняет образ намеренного отделения ветви и точнее, чем «отломлен».
- source_word: ἀγριελαίου
  choice: дикой ... маслины
  rationale: Существительное обозначает дикую маслину; русское «маслина» естественно передаёт как дерево, так и название растения в данном садоводческом образе.
- source_word: κατὰ φύσιν
  choice: по природе
  rationale: Сохраняет прямой контраст с παρὰ φύσιν («вопреки природе») и относится к естественной принадлежности к дикой маслине.
- source_word: παρὰ φύσιν
  choice: вопреки природе
  rationale: Естественная современная формулировка, сохраняющая риторическое противопоставление выражению κατὰ φύσιν.
- source_word: ἐνεκεντρίσθης
  choice: привит к
  rationale: Точный садоводческий термин в страдательном залоге; предлог «к» естественно описывает присоединение привоя к дереву.
- source_word: καλλιέλαιον
  choice: культурной маслине
  rationale: Καλλιέλαιος обозначает окультуренную, садовую маслину в противопоставлении дикой. «Культурная маслина» кратко и без оценочного оттенка передаёт это различие.
- source_word: πόσῳ μᾶλλον
  choice: тем более
  rationale: Обычная русская передача усиленного умозаключения от менее вероятного к более вероятному.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: они — ветви по природе
  rationale: Слово «ветви» подразумевается развёрнутой метафорой ближайшего контекста, хотя в самом стихе отсутствует. Оборот «по природе» сохраняет форму греческого выражения и не заменяет её явным этническим обозначением.
- source_word: ἐγκεντρισθήσονται
  choice: будут привиты
  rationale: Передаёт будущее время и страдательный залог. Значение возвращения следует из контекста, но приставочное «снова» не включено в основной текст, поскольку его нет в самом глаголе.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: к своей маслине
  rationale: 'Возвратное местоимение естественно передаёт подчёркнутую принадлежность: это их собственная маслина. Повтор слова «собственной» по-русски был бы избыточен.'
theological_decisions:
- issue: Следует ли прямо назвать «их» Израилем или иудеями
  choice: 'Сохранить неявное указание: «они — ветви по природе».'
  alternative: «эти израильтяне» или «эти иудеи»
  rationale: В контексте Рим 11 речь идёт об Израиле, однако сам стих продолжает метафору маслины и не употребляет этнического названия. Такая передача сохраняет образ и не делает подразумеваемое явным без необходимости.
- issue: Следует ли вставить отсутствующее в греческом тексте слово «ветви»
  choice: Вставить «ветви» с пояснением в сноске.
  alternative: «они, те, кто по природе»
  rationale: Контекст однозначно подразумевает ветви, а без дополнения русская фраза была бы тяжеловесной и неясной. Сноска честно отмечает, что это контекстуальное восполнение.
- issue: Следует ли явно выразить возвращение словом «снова»
  choice: Не добавлять «снова» в основной текст, но указать возможную передачу в сноске.
  alternative: «будут снова привиты к своей маслине»
  rationale: Возвращение ясно подразумевается предшествующим отсечением природных ветвей, однако приставочное значение «снова» не выражено самим греческим глаголом. Это сохраняет различие между сказанным прямо и подразумеваемым контекстом.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной, но понятной библейской интонации. Синтаксис подчёркивает противопоставление «по природе — вопреки природе» и ход рассуждения «тем более». Термины «дикая маслина», «культурная маслина» и «привит» удерживают цельность садоводческой метафоры.
