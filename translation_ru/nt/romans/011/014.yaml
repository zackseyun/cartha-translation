  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: ru
  text: чтобы как-нибудь вызвать ревность у моих соплеменников и спасти некоторых из них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мою плоть»; то есть моих соплеменников — иудеев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: чтобы как-нибудь
  rationale: В связи с предыдущим контекстом выражает цель, сопряжённую с надеждой и неуверенностью в результате; «как-нибудь» сохраняет эту оттенённую неопределённость.
- source_word: παραζηλώσω
  choice: возбудить ревность
  rationale: Передаёт каузативное значение глагола и сохраняет связь с темой ревности Израиля в ближайшем контексте.
- source_word: μου τὴν σάρκα
  choice: в моих соплеменниках
  rationale: Буквально «мою плоть»; здесь это устойчивое обозначение людей одного с Павлом происхождения. «Соплеменники» естественно и точно передаёт этническое родство, а буквальный образ отмечен в сноске.
- source_word: σώσω
  choice: спасти
  rationale: Сохраняет обычный для Павла сотериологический смысл глагола.
- source_word: τινὰς ἐξ αὐτῶν
  choice: некоторых из них
  rationale: Точно передаёт неопределённое число лиц, выделяемых из ранее названной группы.
theological_decisions:
- issue: Значение σάρξ применительно к народу Павла
  choice: соплеменники
  alternative: моя плоть
  rationale: В данном контексте σάρξ обозначает не греховную природу, а природное и этническое родство Павла с Израилем. Перевод раскрывает референт, не добавляя конфессионального толкования; буквальная метафора сохранена в сноске.
- issue: Участие Павла в спасении некоторых
  choice: спасти некоторых из них
  alternative: содействовать спасению некоторых из них
  rationale: Греческий текст прямо ставит Павла субъектом σώσω. Формулировка сохраняет напряжение исходного текста и не ослабляет его поясняющим богословским перефразированием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Причинно-целевая конструкция согласована с контекстом предыдущего стиха; сохранены неопределённость εἴ πως и сильная формулировка σώσω.
