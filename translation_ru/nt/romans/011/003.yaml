  source_fidelity: 'Перевод точно передаёт все смысловые компоненты греческого текста: обращение к Богу, убийство пророков, разрушение жертвенников, исключительное положение говорящего и продолжающееся посягательство на его жизнь. «Ищут моей жизни» — удачная русская передача идиомы ζητοῦσιν τὴν ψυχήν μου; сноска корректно отмечает буквальную альтернативу без навязывания иного антропологического смысла.'
