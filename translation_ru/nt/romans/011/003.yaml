id: ROM.11.3
reference: Romans 11:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: ru
  text: «Господи, они убили Твоих пророков, разрушили Твои жертвенники; я один остался, и они ищут моей жизни[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ищут моей души»; здесь это выражение означает, что они хотят лишить его жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος в прямом обращении к Богу естественно и традиционно передаётся русским «Господи».
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Нейтрально и точно передаёт действие ἀποκτείνω, не добавляя юридического или нравственного оттенка слова «убили» сверх контекста.
- source_word: τὰ θυσιαστήριά σου
  choice: Твои жертвенники
  rationale: «Жертвенники» точно обозначает алтари для жертвоприношений и сохраняет библейский, но понятный современному читателю регистр.
- source_word: κατέσκαψαν
  choice: разрушили
  rationale: В контексте жертвенников передаёт смысл снесения или уничтожения сооружения; буквальное «раскопали до основания» было бы тяжеловесным.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: я один остался
  rationale: Естественная русская формулировка сохраняет числовую исключительность μόνος и результативный смысл пассивного аориста.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: ищут моей жизни
  rationale: Сохраняет греческий и библейский образ угрозы жизни, не превращая ψυχή в антропологический термин «душа» и не разворачивая выражение в более истолковывающее «пытаются меня убить».
theological_decisions:
- issue: Значение ψυχή в формуле угрозы
  choice: моей жизни
  alternative: моей души; хотят убить меня
  rationale: Здесь ψυχή означает жизнь человека, на которую покушаются, а не нематериальную душу. Выбор сохраняет образность исходного выражения и не вносит постороннего учения о составе человека.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения при обращении к Богу написаны с прописной буквы. Точка с запятой делает длинную цитату яснее, не меняя её синтаксической связи.
