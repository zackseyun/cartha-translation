  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: ru
  text: Если же некоторые из ветвей были отломлены, а ты, будучи дикой маслиной, был привит среди них и стал вместе с ними причастен корню и богатству маслины[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение можно также понять как «стал причастен богатому корню маслины»; более буквально: «корню и туку маслины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: Если же
  rationale: Естественно передаёт условие εἰ и мягкое противопоставление или продолжение мысли, выраженное δέ.
- source_word: τινες τῶν κλάδων
  choice: некоторые из ветвей
  rationale: Сохраняет неопределённое τινες и партитивное значение родительного τῶν κλάδων.
- source_word: ἐξεκλάσθησαν
  choice: были отломлены
  rationale: Точно сохраняет образ ветвей, удалённых с дерева; «отсечены» было бы менее буквально для ἐκκλάω.
- source_word: ἀγριέλαιος ὢν
  choice: будучи дикой маслиной
  rationale: Сохраняет буквальный образ дикой маслины, не заменяя его истолкованием «язычник». Оборот с «будучи» передаёт обстоятельственное значение причастия без чрезмерного усиления уступительности.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: был привит среди них
  rationale: «Привит» является обычным садоводческим соответствием ἐγκεντρίζω, а «среди них» естественно относит место прививки к оставшимся ветвям.
- source_word: συγκοινωνὸς ... ἐγένου
  choice: вместе с ними стал причастен
  rationale: Передаёт переход в новое состояние и совместное участие, заложенное в συν-; современное «причастен» звучит естественнее тяжеловесного «сопричастник».
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: корню и живительной силе маслины
  rationale: Передаёт корень и питающее богатство дерева понятным современным языком, не используя архаичное буквальное «тук маслины». Сложность связи греческих родительных отражена в примечании.
theological_decisions:
- issue: Кого обозначает дикая маслина
  choice: 'Сохранить садоводческий образ: «будучи дикой маслиной».'
  alternative: 'Передать истолковательно: «будучи язычником» или уточнить «ветвь дикой маслины».'
  rationale: Павел сам раскрывает богословский смысл через образ маслины; перевод не должен преждевременно заменять метафору её конфессиональным или этническим толкованием.
- issue: Связь корня и πιότης маслины
  choice: 'В основном тексте представить их как совместно разделяемые блага: «корню и живительной силе маслины», отметив синтаксическую неоднозначность.'
  alternative: «питающему корню маслины» или буквально и архаично «корню и туку маслины».
  rationale: Нагромождение родительных допускает понимание πιότης как питающего богатства, связанного с корнем, либо как отдельного предмета участия. Примечание сохраняет эту напряжённость, не превращая один разбор в единственно возможный.
translation_notes:
  register: Современный литературный русский язык с сохранением развернутой метафоры маслины. Синтаксис оставлен незавершённым запятой, поскольку стих составляет условную часть предложения, продолжающегося в Рим 11:18. Архаизм «тук» вынесен только в примечание как буквальная лексическая возможность.
