  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: ru
  text: Что же? Израиль не достиг того, к чему стремится, а избранные[a] достигли; остальные же были ожесточены[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «избрание достигло». Греческое слово ἐκλογή означает «избрание» или «выбор», но здесь, вероятно, обозначает избранных людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были сделаны нечувствительными». Глагол может обозначать ожесточение, огрубение или утрату духовной восприимчивости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Что же?
  rationale: Естественная русская формула, сохраняющая риторический переход Павла к выводу из предшествующего рассуждения.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: того, к чему стремится Израиль
  rationale: Глагол ἐπιζητέω обозначает настойчивое искание или стремление; настоящее время передано как продолжающееся стремление. В основном тексте порядок слов перестроен ради естественного русского синтаксиса.
- source_word: τοῦτο οὐκ ἐπέτυχεν ... ἐπέτυχεν
  choice: не достиг ... достигли
  rationale: Повтор одного русского глагола сохраняет выразительный контраст исходного текста. «Достиг» естественно сочетается с оборотом «к чему стремится».
- source_word: ἡ δὲ ἐκλογὴ
  choice: а избранные
  rationale: Хотя существительное буквально означает «избрание» или «выбор», здесь оно, вероятнее всего, метонимически обозначает избранных людей, противопоставленных «остальным».
- source_word: οἱ δὲ λοιποὶ
  choice: остальные же
  rationale: Кратко и точно обозначает оставшуюся часть Израиля в противопоставлении избранным.
- source_word: ἐπωρώθησαν
  choice: были ожесточены
  rationale: Пассивная конструкция сохраняет неуказанность действующего лица и библейский образ духовного ожесточения или утраты восприимчивости.
theological_decisions:
- issue: Значение ἡ ἐκλογὴ
  choice: Передано как «избранные», то есть люди, являющиеся предметом избрания.
  alternative: «избрание»
  rationale: Противопоставление «остальным» указывает на группу людей, однако буквальное абстрактное значение сохранено в примечании как подлинная лексическая возможность.
- issue: Действующее лицо при ἐπωρώθησαν
  choice: 'Сохранён пассив: «были ожесточены».'
  alternative: «Бог ожесточил их» или «они ожесточились»
  rationale: Греческий текст в этом стихе не называет действующее лицо. Перевод не разрешает явно напряжение между Божьим действием и человеческой ответственностью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; повтор «достиг — достигли» передаёт структуру и контраст оригинала.
