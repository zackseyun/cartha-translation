source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: ru
  text: Ведь если их отвержение означает примирение мира, то что же тогда их принятие, если не жизнь из мёртвых?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «жизнь из мёртвых» может образно означать необычайное духовное оживление или указывать на воскресение; Павел оставляет его кратким и многозначным.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: отвержение
  rationale: Передаёт контекстуальный смысл устранения или неприятия и образует ясную смысловую противоположность слову «принятие».
- source_word: καταλλαγὴ
  choice: примирение
  rationale: Обычный для Павла термин, обозначающий восстановление отношений; русский эквивалент точен и естествен.
- source_word: κόσμου
  choice: миру
  rationale: Сохраняет широту греческого κόσμος и не сужает его в основном тексте до язычников.
- source_word: πρόσλημψις
  choice: принятие
  rationale: Естественно противопоставляется «отвержению» и допускает смысл принятия обратно, не конкретизируя явно действующее лицо.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: жизнью из мёртвых
  rationale: Близко передаёт сжатый и выразительный греческий оборот, сохраняя открытым вопрос о духовном оживлении или воскресении.
- source_word: εἰ μὴ
  choice: как не
  rationale: В русском риторическом вопросе естественно передаёт ожидаемый усиленный ответ.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно обозначает пояснительную связь с предшествующим рассуждением.
theological_decisions:
- issue: Значение выражения «жизнь из мёртвых»
  choice: Сохранить открытое эсхатологическое выражение без уточнения его смысла.
  alternative: Истолковать как великое духовное оживление, окончательное воскресение либо как выражение, объединяющее оба смысла.
  rationale: Формулировка Павла кратка и многозначительно выразительна; перевод не должен устранять заложенное в ней богословское напряжение.
- issue: Связь отвержения с примирением мира
  choice: 'Передать конструкцию как результат: «принесло миру примирение».'
  alternative: 'Более формально: «их отвержение — примирение мира».'
  rationale: В греческой именной конструкции подразумевается смысловое соответствие или следствие; динамичная русская формулировка делает мысль понятной, не утверждая, что само отвержение тождественно примирению по своей сущности.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет риторическую форму и достоинство апостольского рассуждения. «Ведь» естественнее книжного начального «ибо», а «как не» хорошо передаёт силу риторического εἰ μὴ.
