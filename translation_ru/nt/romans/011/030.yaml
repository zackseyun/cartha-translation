    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: Передаёт и пояснительную силу γάρ, и сравнительную конструкцию ὥσπερ, которая продолжается в следующем стихе.
- source_word: ὑμεῖς
  choice: вы
  rationale: Сохраняет второе лицо множественного числа, не добавляя прямо отсутствующее в стихе уточнение «язычники».
- source_word: ποτε
  choice: некогда
  rationale: Естественно и достойно обозначает прежнее состояние в противопоставлении νῦν — «теперь».
- source_word: ἠπειθήσατε τῷ θεῷ
  choice: были непослушны Богу
  rationale: Глагол может включать оттенки неверия и неповиновения; «были непослушны» сохраняет нравственно-реляционный смысл и связь с существительным ἀπείθεια далее.
- source_word: νῦν δὲ
  choice: а теперь
  rationale: Ясно передаёт временное и контрастное противопоставление.
- source_word: ἠλεήθητε
  choice: помилованы
  rationale: Сохраняет пассивную форму и подразумеваемое действие Бога без добавления отсутствующего в греческом подлежащего.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: вследствие их непослушания
  rationale: Передаёт причинно-инструментальный дательный, не утверждая более точный механизм, чем позволяет греческий текст; τούτων по контексту естественно выражено местоимением «их».
theological_decisions:
- issue: Значение ἀπειθέω / ἀπείθεια в контексте рассуждения Павла о спасении
  choice: непослушны / непослушание
  alternative: не верили / неверие
  rationale: Оба греческих слова могут соединять значения неверия и неповиновения. Основной перевод сохраняет их однокоренную связь и не сводит смысл только к интеллектуальному неверию; примечание отмечает подлинную смысловую широту.
- issue: Связь непослушания Израиля с милостью к адресатам
  choice: вследствие их непослушания
  alternative: через их непослушание
  rationale: Так сохраняется причинная связь, выраженная дательным падежом, без чрезмерного уточнения того, является ли непослушание непосредственным средством или историческим обстоятельством.
