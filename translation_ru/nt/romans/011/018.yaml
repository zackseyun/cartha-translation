  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: ru
  text: Не превозносись над ветвями[a]. Но если превозносишься, то не ты держишь корень, а корень — тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не превозносись против ветвей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не ты поддерживаешь корень, а корень поддерживает тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: превозносись над / превозносишься
  rationale: Глагол выражает хвастливое возвышение над кем-либо или против кого-либо. «Превозноситься над» естественно передаёт превосходство, подразумеваемое приставкой κατά, а повтор того же глагола сохраняет связь между запретом и условием.
- source_word: κλάδων
  choice: ветвями
  rationale: Определённость восстанавливается из контекста уже развёрнутого образа маслины; русская форма без отдельного артикля естественна и указывает на конкретные ветви.
- source_word: ῥίζαν / ῥίζα
  choice: корень
  rationale: Одинаковый перевод в обоих случаях сохраняет цельность образа и подчёркивает обратную зависимость привитой ветви от корня.
- source_word: βαστάζεις
  choice: держишь
  rationale: «Держать» сохраняет предметный образ дерева и одновременно естественно выражает поддерживающую функцию корня; в сноске дан более явный смысловой вариант «поддерживать».
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: не ты держишь корень, а корень — тебя
  rationale: Прямое противопоставление с ударными «ты» и «корень» передаёт греческий эмфазис; эллиптическое тире во второй части звучит по-русски естественно и сохраняет резкость разворота.
- source_word: μὴ
  choice: не превозносись
  rationale: Прямой запрет в настоящем времени передан естественной русской формой без избыточного уточнения аспектуального оттенка.
theological_decisions:
- issue: Образный смысл корня и ветвей в метафоре маслины
  choice: Сохранить образы корня и ветвей без пояснения, кого именно они обозначают.
  alternative: Прямо отождествить корень с патриархами, Авраамом или заветными обещаниями.
  rationale: Греческий текст оставляет образ без такого уточнения. Конкретное отождествление в основном тексте превратило бы перевод в толкование и сузило бы сохраняемую Павлом смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, назидательным и достойным звучанием. «Превозноситься» несколько возвышенно, но общеупотребительно в нравственном контексте. Предметное «держишь» сохраняет живость метафоры, а смысл «поддерживаешь» вынесен в сноску.
