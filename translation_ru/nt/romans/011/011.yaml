source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: ru
  text: 'Итак, я спрашиваю: неужели они преткнулись, чтобы упасть?[a] Ни в коем случае! Но вследствие их проступка спасение пришло к язычникам,[b] чтобы вызвать у них ревность.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так что упали». Греческий текст различает «преткнуться» и «упасть»; вопрос предполагает ответ «нет».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к народам»; в данном контексте имеются в виду нееврейские народы. Или: «вследствие их прегрешения».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы побудить их к ревности». Речь может включать побуждение искать то же спасение.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Итак, я спрашиваю
  rationale: В данном контексте λέγω вводит риторический вопрос, а οὖν связывает его с предыдущим рассуждением. По-русски «Итак, я спрашиваю» естественно передаёт обе функции.
- source_word: μὴ ἔπταισαν
  choice: неужели они преткнулись
  rationale: Вопрос с μή предполагает отрицательный ответ; «неужели» естественно выражает это ожидание. «Преткнулись» сохраняет образ и отличие πταίω от последующего πίπτω.
- source_word: ἵνα πέσωσιν
  choice: чтобы окончательно упасть
  rationale: «Чтобы ... упасть» сохраняет возможную целевую или результативную силу ἵνα. Наречие «окончательно» поясняет контекстуальный контраст с «преткнулись», не утверждая необратимой гибели как отдельного значения глагола; буквальная форма отмечена в сноске.
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Устойчивое, современное и сильное русское отрицание, естественно передающее резкое Павлово возражение.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: из-за их проступка
  rationale: παράπτωμα обозначает ложный шаг или прегрешение; «проступок» сохраняет нравственную весомость и связь с образом преткновения. Дательный падеж допускает причинно-инструментальное понимание, естественно выраженное через «из-за».
- source_word: ἡ σωτηρία
  choice: спасение
  rationale: Стандартный и контекстуально точный эквивалент σωτηρία в Послании к римлянам.
- source_word: τοῖς ἔθνεσιν
  choice: к другим народам
  rationale: ἔθνη буквально означает «народы», но в противопоставлении Израилю указывает на нееврейские народы. Добавление «другим» ясно передаёт это отношение без менее общеупотребительного конфессионального термина «язычники».
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: чтобы возбудить в них ревность
  rationale: Оборот с εἰς и субстантивированным инфинитивом передаёт цель или результат. «Возбудить ... ревность» сохраняет неоднозначность между завистью и побуждением желать того же блага.
theological_decisions:
- issue: Представлено ли преткновение Израиля как окончательное и необратимое падение
  choice: Риторический вопрос отрицает, что преткновение привело к окончательному падению.
  alternative: 'Можно перевести буквально: «преткнулись, чтобы упасть», не уточняя характер падения.'
  rationale: Различие между πταίω и πίπτω сохранено. Слово «окончательно» делает понятным смысловой контраст в русском, однако в сноске дана более буквальная форма, чтобы не превращать контекстуальный вывод в лексическое значение πέσωσιν.
- issue: Смысл ревности в истории спасения
  choice: Спасение других народов должно возбудить в Израиле ревность.
  alternative: Речь может идти либо о негативной зависти, либо о ревности, побуждающей искать то же спасение.
  rationale: παραζηλόω допускает оба оттенка. Основной текст не уточняет нравственный характер этой ревности и тем самым сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского рассуждения. Риторическая структура и контраст образов сохранены; редкие или потенциально неясные церковные термины вынесены в варианты сносок.
