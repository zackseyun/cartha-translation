source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: ru
  text: 'как написано: «Бог дал им дух оцепенения[a], глаза, чтобы не видеть, и уши, чтобы не слышать, до сегодняшнего дня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух глубокого сна». Выражение перекликается с Ис. 29:10, хотя употреблённое здесь греческое слово означает притуплённость, оцепенение.'
    reason: Альтернативный перевод и пояснение ветхозаветной переклички.
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Естественная и устоявшаяся по-русски формула введения цитаты из Писания; передаёт καθώς без ненужного утяжеления.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Бог дал им
  rationale: Прямо сохраняет Бога как подлежащее и передаёт аорист простой формой прошедшего времени.
- source_word: πνεῦμα κατανύξεως
  choice: дух оцепенения
  rationale: «Оцепенение» передаёт состояние притуплённости и нечувствительности, выраженное κατάνυξις, и понятно современному читателю; связь с глубоким сном отмечена в сноске.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: глаза, чтобы не видеть
  rationale: Сохраняет образ и инфинитивную конструкцию цели или результата, не сводя её однозначно к описанию неспособности.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: уши, чтобы не слышать
  rationale: Передаёт параллельную греческую конструкцию и сохраняет значение физического и духовного восприятия, заложенное в ἀκούειν.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: вплоть до сегодняшнего дня
  rationale: Ясно передаёт временной предел ἕως и подчёркнутое указание на настоящее время.
theological_decisions:
- issue: Божественное действие в духовном ожесточении и нечувствительности
  choice: «Бог дал им дух оцепенения»
  alternative: «Бог допустил, чтобы ими овладел дух оцепенения»
  rationale: В греческом тексте Бог прямо назван субъектом глагола «дал». Перевод не ослабляет это до простого попущения и одновременно не добавляет богословского объяснения, которого нет в стихе.
- issue: Оттенок конструкции τοῦ μὴ с инфинитивом
  choice: «чтобы не видеть… чтобы не слышать»
  alternative: «неспособные видеть… неспособные слышать»
  rationale: Выбранная формулировка сохраняет присущую конструкции напряжённость между целью и результатом; вариант с «неспособные» истолковал бы её только как состояние.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой библейской цитаты. Сохранены параллелизм и прямое указание на действие Бога.
