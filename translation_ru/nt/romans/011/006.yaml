  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: ru
  text: Но если по благодати, то уже не от дел; иначе благодать уже перестаёт быть благодатью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: по благодати
  rationale: Передаёт основание и способ избрания как действие незаслуженной Божьей благодати, сохраняя краткость греческого выражения.
- source_word: ἐξ ἔργων
  choice: за дела
  rationale: Естественное русское выражение для противопоставления благодати воздаянию на основании совершённых дел; предлог ἐκ указывает на основание или источник.
- source_word: γίνεται
  choice: становится
  rationale: 'Сохраняет явный глагол греческого текста и парадоксальную формулировку: при смешении с делами благодать перестаёт быть тем, чем она является.'
theological_decisions:
- issue: Соотношение благодати и дел как оснований избрания
  choice: 'Сохранено категорическое противопоставление: «если по благодати, то уже не за дела»'
  alternative: «если по благодати, то не вследствие дел»
  rationale: Текст противопоставляет два основания, не уточняя здесь характер дел и не вводя дополнительных конфессиональных категорий.
- issue: Буквальность выражения οὐκέτι γίνεται χάρις
  choice: «благодать уже не становится благодатью»
  alternative: «благодать уже не была бы благодатью»
  rationale: Выбранный вариант сохраняет необычное γίνεται («становится») и вслед за исходным текстом оставляет напряжённую, парадоксальную формулировку, хотя альтернативный вариант звучал бы по-русски идиоматичнее.
translation_notes:
  register: Современный литературный русский, краткий и афористичный синтаксис. Сохранены логическая симметрия стиха и намеренно парадоксальное повторение слова «благодать».
