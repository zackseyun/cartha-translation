id: ROM.11.12
reference: Romans 11:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: ru
  text: Если же их проступок — богатство для мира, а их умаление[a] — богатство для язычников, то насколько больше богатства принесёт их полнота[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их потеря», «их поражение» или «их сокращение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их полное число» или «их полное вхождение».'
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: проступок
  rationale: Передаёт образ неверного шага и нравственный смысл нарушения, не усиливая его до более узкого «преступления».
- source_word: πλοῦτος
  choice: богатство
  rationale: Сохраняет метафору обилия благословений и естественно звучит в обеих параллельных частях стиха.
- source_word: κόσμου
  choice: мира
  rationale: Соответствует широкому значению κόσμος и не сводит его заранее только к одной группе людей.
- source_word: ἥττημα
  choice: умаление
  rationale: Редкое греческое слово допускает значения потери, поражения и уменьшения. «Умаление» сохраняет идею сокращения или ущерба, не решая окончательно, какой оттенок здесь главный.
- source_word: ἐθνῶν
  choice: язычников
  rationale: В контексте Послания к римлянам обозначает нееврейские народы в противопоставлении Израилю; «язычники» ясно передаёт это различие современному читателю.
- source_word: πόσῳ μᾶλλον
  choice: насколько большим
  rationale: Естественно передаёт усиленное сопоставление a fortiori; подразумеваемое «богатством» выражено в русском для ясности.
- source_word: πλήρωμα
  choice: полнота
  rationale: Сохраняет широту греческого слова и не выбирает между полным числом, полным вхождением и восстановлением.
theological_decisions:
- issue: Значение выражения τὸ πλήρωμα αὐτῶν
  choice: их полнота
  alternative: их полное число; их полное вхождение; их восстановление во всей полноте
  rationale: Греческая формулировка сжата и допускает количественный и качественный оттенки. Основной текст не разрешает спорный вопрос о точном характере будущей полноты Израиля.
translation_notes:
  register: Современный литературный русский язык с приподнятым, но понятным регистром. Параллелизм греческого предложения сохранён; связка во второй части раскрывает подразумеваемое «богатство», чтобы риторический вывод естественно звучал по-русски. Частица δέ передана сочетанием «если же» без добавления временного маркера.
