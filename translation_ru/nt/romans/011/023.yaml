  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: ru
  text: Но и они, если не останутся в неверии[a], будут привиты; ведь Бог может снова привить их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если не будут упорствовать в неверии». Слово также может иметь оттенок неверности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «привить их обратно». В греческом слово «снова» явно употреблено во второй части предложения.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: Но и они
  rationale: 'Передаёт как противопоставление δέ предыдущему предостережению, так и добавочное значение καί при ἐκεῖνοι: речь вновь идёт об отпавших ветвях, то есть об израильтянах.'
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: если не останутся
  rationale: Естественно передаёт условную конструкцию с настоящим сослагательным и продолженность пребывания в определённом состоянии.
- source_word: τῇ ἀπιστίᾳ
  choice: в неверии
  rationale: В ближайшем контексте Рим 11 существительное ἀπιστία противопоставлено вере и обозначает неверие; предложное сочетание естественно передаёт дательный падеж при ἐπιμένω.
- source_word: ἐγκεντρισθήσονται
  choice: будут привиты
  rationale: Сохраняет будущее страдательное значение и образ прививки к маслине, не добавляя в первой части значения возвращения, которое выражено далее словом πάλιν.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: ведь Бог силён
  rationale: Краткая и естественная русская конструкция передаёт основание, вводимое γάρ, и способность Бога совершить названное действие.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: снова привить их
  rationale: πάλιν явно выражает повторное, восстановительное действие; повтор глагола сохраняет словесную связь с первой частью стиха.
theological_decisions:
- issue: Значение ἀπιστία в данном контексте
  choice: «неверие» как отказ верить
  alternative: «неверность»
  rationale: В рассуждении Павла о маслине включение и отсечение непосредственно связаны с верой и неверием. При этом сноска сохраняет возможный более широкий оттенок слова.
- issue: Где явно выразить восстановительный характер прививки
  choice: В первой части — «будут привиты», во второй — «снова привить их»
  alternative: Уже в первой части перевести «будут привиты обратно»
  rationale: В греческом πάλιν («снова») стоит только во второй части. Выбранный перевод сохраняет расположение смыслового элемента и не вносит его преждевременно.
- issue: Условность возвращения прежде отсечённых ветвей
  choice: 'Сохранено прямое условие: «если не останутся в неверии»'
  alternative: Разъяснить как обязательное обращение или покаяние
  rationale: Текст формулирует условие через прекращение пребывания в неверии; богословски более подробное объяснение здесь было бы истолкованием, а не переводом.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства апостольского рассуждения. «Привиты» понятно в развёрнутом образе маслины; «силён» естественно передаёт способность без тяжеловесного «способен». Все маркеры сносок размещены в основном тексте.
