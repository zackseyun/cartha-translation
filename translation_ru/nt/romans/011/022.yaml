base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: ru
  text: 'Итак, обрати внимание на доброту[a] и строгость Бога: строгость — к тем, кто пал, а к тебе — Божья доброта, если будешь оставаться в его доброте; иначе и ты будешь отсечён[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «благость». Греческое χρηστότης может означать доброту, благость или благожелательность.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «отломлен». Глагол буквально означает «отсечь», а вариант «отломить» подчёркивает образ ветвей оливкового дерева в окружающем контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: обрати внимание
  rationale: Повелительная форма призывает не просто увидеть, а вдумчиво рассмотреть сказанное; этот оборот естественен в современном русском языке.
- source_word: χρηστότητα / χρηστότης
  choice: доброта
  rationale: Слово обозначает благожелательность и милостивую доброту Бога. «Доброта» ясно передаёт личностный оттенок и сохраняет контраст со «строгостью».
- source_word: ἀποτομίαν / ἀποτομία
  choice: строгость
  rationale: Существительное выражает суровую решительность в суде. «Строгость» передаёт этот смысл, не усиливая его сверх исходного текста.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: к тем, кто пал
  rationale: Предлог передан как направленность отношения, а субстантивированное причастие — естественной русской придаточной конструкцией. «Пал» сохраняет связь с образом отпадения ветвей.
- source_word: ἐπὶ δὲ σὲ
  choice: а к тебе
  rationale: Сохраняет параллель с предыдущим оборотом и прямое обращение к адресату в единственном числе.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: если будешь оставаться в Его доброте
  rationale: Условная конструкция и значение продолжения сохранены без уточнения, относится ли предупреждение прежде всего к отдельному человеку или к группе. Местоимение «Его» проясняет, что речь идёт о Божьей доброте.
- source_word: ἐπεὶ
  choice: иначе
  rationale: В данном условном контексте союз вводит последствие невыполнения условия; «иначе» естественно передаёт логику предупреждения.
- source_word: ἐκκοπήσῃ
  choice: будешь отсечён
  rationale: Будущее страдательного залога передано прямо. «Отсечён» отражает основное значение глагола и соответствует образу ветвей оливкового дерева.
theological_decisions:
- issue: Условное предупреждение о Божьей доброте и суде
  choice: 'Сохранено прямое условие: Божья доброта обращена к адресату, если он будет оставаться в ней; иначе он будет отсечён.'
  alternative: Ослабить предупреждение как чисто гипотетическое либо истолковать его в рамках определённого учения о неотступности или отпадении.
  rationale: Греческий текст формулирует реальное условие и предупреждение, но сам по себе не разрешает последующие богословские споры и не уточняет окончательно индивидуальный или коллективный характер обращения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; прямое обращение в единственном числе сохранено. Тире делает контраст двух сторон Божьего отношения естественным по-русски, не добавляя нового смысла.
