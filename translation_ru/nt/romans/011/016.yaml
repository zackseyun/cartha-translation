id: ROM.11.16
reference: Romans 11:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: ru
  text: Если начаток свят, то и всё тесто[a]; и если корень свят, то и ветви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вся масса теста». Греческое φύραμα означает замешанную массу теста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: начаток
  rationale: «Начаток» сохраняет связь с первой частью, посвящаемой Богу, и культово-заветный оттенок выражения; в контексте образа теста это также перекликается с ветхозаветным приношением начатка.
- source_word: ἁγία
  choice: свят
  rationale: «Свят» прямо сохраняет библейскую категорию святости и параллелизм обеих частей стиха, не уточняя её богословский характер.
- source_word: φύραμα
  choice: всё тесто
  rationale: Греческое слово обозначает замешанную массу теста. «Всё тесто» естественно по-русски передаёт целое, противопоставленное начатку.
- source_word: ῥίζα
  choice: корень
  rationale: Точное и естественное соответствие ботаническому образу, который продолжается в последующем рассуждении.
- source_word: κλάδοι
  choice: ветви
  rationale: Стандартное современное обозначение частей дерева, согласующееся с образом маслины в контексте Римлянам 11.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Если ... то и ...; и если ... то и ...
  rationale: Конструкция сохраняет условную форму и краткий параллелизм греческого текста; связка «то и» естественно восполняет подразумеваемое сказуемое. Частица δέ не передана отдельным словом, поскольку здесь достаточно самого перехода к условному высказыванию.
theological_decisions:
- issue: Характер святости начатка, теста, корня и ветвей
  choice: Сохранить слово «свят», не определяя, является ли святость заветной, представительской или спасительной.
  alternative: Передать как «посвящён Богу» либо истолковать святость в узком сотериологическом смысле.
  rationale: Сам стих утверждает производную связь между начатком и целым, корнем и ветвями, но не раскрывает точный характер этой святости. Перевод не должен заранее разрешать богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным параллелизмом оригинала. «Начаток» сохранён как узнаваемый библейский термин, тогда как «всё тесто» делает бытовой образ прозрачным для современного читателя.
