  source_fidelity: 'Текст точно передаёт оба условно-параллельных образа греческого оригинала: ἀπαρχή — «начаток», φύραμα — «всё тесто», ῥίζα — «корень», κλάδοι — «ветви». Подразумеваемое сказуемое во вторых частях («[свято]») естественно опущено, как и в греческом, без добавления толкования характера святости.'
