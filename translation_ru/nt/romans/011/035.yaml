    rationale: καὶ — обычное «и», а ἀνταποδοθήσεται — будущее страдательное «будет воздано/будет отплачено». Черновик превращает вторую часть в придаточное цели и вводит активный субъект «Он», модальную обязанность и прошедшее время.
