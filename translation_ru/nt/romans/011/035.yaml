  naturalness: «Или кто прежде дал Ему, и ему будет воздано?» — естественная для современного литературного русского, краткая и торжественная формулировка. Оборот «будет воздано» несколько возвышен, но уместен в данном риторико-библейском регистре и хорошо сохраняет безлично-пассивную форму оригинала.
  terminology: «Дал», «прежде» и «воздано» точно передают ключевые элементы без конфессиональных добавлений. Местоимение «Ему» сохраняет форму греческого текста; его референт ясен из ближайшего контекста.
