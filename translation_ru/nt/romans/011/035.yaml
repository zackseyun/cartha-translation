  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: ru
  text: Или кто прежде[a] дал Ему, и ему будет воздано?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заранее».'
    reason: Лексическая альтернатива для προέδωκεν; основной текст передаёт оттенок первенства словом «прежде».
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит следующий риторический вопрос в последовательности; краткий союз естественно передаёт греческую связь.
- source_word: τίς
  choice: кто
  rationale: Вопросительное местоимение относится к человеку и естественно передаётся словом «кто».
- source_word: προέδωκεν
  choice: прежде дал
  rationale: 'Сохраняет значение предшествующего, первичного дара: никто не дал Богу раньше так, чтобы поставить Его в положение должника.'
- source_word: αὐτῷ
  choice: Ему / ему
  rationale: Первое местоимение относится к Богу, второе — к предполагаемому давшему; прописная буква в первом случае проясняет различие референтов в русском тексте.
- source_word: καὶ
  choice: чтобы
  rationale: В данном риторическом построении союз связывает первичный дар с последующим воздаянием; русское «чтобы» естественно выражает подразумеваемое следствие, не изменяя смысла.
- source_word: ἀνταποδοθήσεται
  choice: Он должен был воздать
  rationale: Передаёт идею ответного возмещения. Конструкция с «должен был» ясно выражает подразумеваемую обязанность, на которой основан риторический вопрос, хотя в греческом стоит будущее страдательного залога.
theological_decisions:
- issue: К кому относится первое αὐτῷ
  choice: Сохранено местоимение «Ему», относящееся к Богу из контекста.
  alternative: Заменить местоимение существительным «Богу».
  rationale: Греческий текст использует местоимение; его сохранение ближе к форме оригинала, а прописная буква помогает читателю увидеть референта.
- issue: Оттенок προέδωκεν и обязанность Бога возместить дар
  choice: «прежде дал Ему, чтобы Он должен был воздать»
  alternative: «дал Ему заранее, и ему будет воздано»
  rationale: 'Выбранная формулировка естественно по-русски раскрывает логику риторического вопроса: никто не может опередить Бога своим даром и тем самым сделать Его должником. Это не добавляет отдельного доктринального утверждения, а передаёт подразумеваемую связь частей греческой фразы.'
- issue: Залог и субъект ἀνταποδοθήσεται
  choice: 'Активная русская конструкция с Богом как подразумеваемым субъектом: «Он должен был воздать».'
  alternative: 'Формально сохранить страдательный залог: «и будет ему воздано».'
  rationale: Страдательная конструкция формальнее следует греческому, но в современном русском звучит менее ясно. Контекст однозначно предполагает Бога как Того, кто воздаёт; при этом смысл обязательного ответного возмещения сохранён.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный риторический вопрос. Формулировка понятна широкому читателю; «воздать» сохраняет библейскую возвышенность, оставаясь общеупотребительным словом.
