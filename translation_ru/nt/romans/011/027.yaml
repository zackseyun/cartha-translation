review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: διαθήκη — «завет», αὐτοῖς естественно выражено как «с ними», а ἀφέλωμαι — «удалю». Однако «И вот Мой завет с ними: когда...» в современном русском оставляет временное придаточное без явной опоры и менее точно передаёт эллиптическую пророческую формулу, для которой уместно восполнить «будет». Сноска неточно связывает направление «от Меня к ним» со всем оборотом: παρ’ ἐμοῦ относится к «завету» и значит «от Меня».'
  naturalness: «И таков будет Мой завет с ними, когда Я удалю их грехи» — естественная, краткая и торжественная формулировка современного литературного русского. Она сохраняет пророческий регистр без синтаксической незавершённости.
  terminology: «Завет» — верный и устоявшийся эквивалент διαθήκη в данном библейско-цитатном контексте. «Удалю их грехи» точно передаёт устранение грехов и не навязывает богословского объяснения механизма этого действия.
