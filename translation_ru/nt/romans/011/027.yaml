lexical_decisions:
- source_word: καὶ αὕτη
  choice: И вот
  rationale: В пророческой цитате эллиптическое καὶ αὕτη естественно передаётся по-русски формулой «И вот», которая не требует добавлять отсутствующую в греческом тексте связку и сохраняет указательный характер выражения.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: Мой завет
  rationale: διαθήκη в контексте цитирования Писания означает установленный Богом завет, а оборот παρ’ ἐμοῦ указывает на его происхождение от Бога. «Мой завет» — естественная русская передача; буквальный оттенок указан в сноске.
- source_word: αὐτοῖς
  choice: с ними
  rationale: Хотя форма дательного падежа буквально допускает «им», русское словоупотребление требует сочетания «завет с ними» для обозначения сторон заветных отношений.
- source_word: ὅταν
  choice: когда
  rationale: Союз вводит момент осуществления пророческого обещания, а не неопределённо повторяющиеся случаи; «когда» сохраняет и временной смысл, и уверенность обещания.
- source_word: ἀφέλωμαι
  choice: удалю
  rationale: Средняя форма аориста сослагательного наклонения от ἀφαιρέω здесь обозначает устранение грехов. «Удалю» точно и естественно передаёт действие, не уточняя сверх текста способ прощения или очищения.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: их грехи
  rationale: Прямая и ясная передача множественного числа сохраняет нравственно-богословский смысл исходного выражения.
theological_decisions:
- issue: Значение διαθήκη в пророческой цитате Павла
  choice: завет
  alternative: завещание; договор
  rationale: «Завет» сохраняет ветхозаветный контекст Божьего обязательства и обещания, тогда как «завещание» вводило бы чуждый этому месту юридический смысл, а «договор» ослаблял бы библейскую окраску.
- issue: Временная сила ὅταν ἀφέλωμαι
  choice: когда Я удалю их грехи
  alternative: всякий раз, когда Я удаляю их грехи
  rationale: Контекст представляет определённое исполнение спасительного обещания. «Когда» сохраняет эту направленность, не устанавливая точного времени и не превращая высказывание в общее повторяющееся условие.
- issue: Отношение между заветом и удалением грехов
  choice: двоеточие перед придаточным времени
  alternative: запятая без пояснительной связи
  rationale: Двоеточие естественно показывает, что последующая фраза раскрывает осуществление названного завета, но не навязывает более узкого догматического определения их логической связи.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Заглавные «Мой» и «Я» употреблены как традиционные местоименные обозначения Бога; синтаксис краток и понятен обычному читателю.
