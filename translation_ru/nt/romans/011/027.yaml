    rationale: 'Фраза «И вот Мой завет с ними: когда Я удалю их грехи» возможна как стилизация, но в современном литературном русском придаточное «когда» обычно требует сказуемого в главной части. Греческий контекст пророческой цитаты допускает восполнение будущего «будет».'
  - severity: low
    issue: Сноска «завет от Меня к ним» неточно отражает синтаксис греческого оборота.
    rationale: παρ’ ἐμοῦ означает «от Меня» и определяет «завет»; αὐτοῖς отдельно передано в основном тексте как «с ними». Формула «от Меня к ним» создаёт впечатление единого буквального направления, которого греческий текст не выражает.
  revised_text: И таков будет Мой завет с ними[a], когда Я удалю их грехи.
