base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: ru
  text: 'Верно[a]: они были отломлены из-за неверия, а ты стоишь благодаря вере[b]. Не превозносись[c], но бойся[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хорошо»; «Это верно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верой»; «доверием».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «не будь высокомерен»; «не думай о себе свысока».'
    reason: lexical_alternative
  - marker: d
    text: То есть бойся Бога со смиренным благоговением и осторожностью, не впадая в самоуверенность.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Верно
  rationale: Слово выражает согласие с утверждением собеседника в предыдущем стихе; «Верно» естественно и кратко передаёт одобрительный ответ.
- source_word: ἀπιστίᾳ
  choice: из-за неверия
  rationale: Дательный падеж в контексте указывает на причину или основание отломления; «неверие» сохраняет прямое противопоставление вере.
- source_word: ἐξεκλάσθησαν
  choice: были отломлены
  rationale: Перевод сохраняет образ ветвей маслины и точнее передаёт метафору, чем более общее «были отсечены».
- source_word: πίστει
  choice: верой
  rationale: Дательный падеж обозначает средство или основание, благодаря которому адресат стоит; «вера» сохраняет противопоставление неверию.
- source_word: ἕστηκας
  choice: стоишь
  rationale: Перфект выражает достигнутое и продолжающееся состояние; настоящее время «стоишь» естественно передаёт этот результат в русском языке.
- source_word: ὑψηλὰ φρόνει
  choice: не превозносись
  rationale: Греческое выражение запрещает высокомерное мнение о себе; «не превозносись» ясно передаёт предупреждение и подходит к возвышенному, но современному регистру.
- source_word: φοβοῦ
  choice: бойся
  rationale: Краткий императив сохраняет резкость призыва и не ослабляет его до одного лишь уважения; характер страха уточняется контекстом и сноской.
theological_decisions:
- issue: Значение πίστις в противопоставлении ἀπιστία
  choice: вера
  alternative: доверие; верность
  rationale: Непосредственное противопоставление неверию указывает прежде всего на человеческую веру или доверие. Перевод «вера» сохраняет традиционный богословский термин, не исключая оттенка доверия.
- issue: Смысл повеления φοβοῦ
  choice: бойся
  alternative: страшись; пребывай в благоговейном страхе
  rationale: Прямое «бойся» сохраняет богословское напряжение предупреждения и не сводит страх ни к панике, ни к простому почтению.
translation_notes:
  register: Современный литературный русский язык с кратким, выразительным синтаксисом. Сохранены метафора отломленных ветвей, противопоставление неверия и веры, а также резкость заключительного повеления.
