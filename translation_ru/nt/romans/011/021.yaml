base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: ru
  text: Ведь если Бог не пощадил природных ветвей[a], то не пощадит и тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «естественных ветвей»; буквально: «ветвей по природе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» естественно передаёт пояснительное γάρ и сохраняет связь с предшествующим предостережением; «если» передаёт условное εἰ.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Обычное и точное соответствие θεός; артикль обозначает определённого субъекта и отдельно не переводится.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: природных ветвей
  rationale: Передаёт буквальный смысл «ветвей по природе» и сохраняет метафору маслины, не подменяя её прямым указанием на Израиль.
- source_word: οὐκ ἐφείσατο
  choice: не пощадил
  rationale: Точно передаёт φείδομαι и сохраняет строгость предупреждения, а также словесный параллелизм со второй частью стиха.
- source_word: οὐδὲ σοῦ φείσεται
  choice: то не пощадит и тебя
  rationale: «То» естественно оформляет следствие условной конструкции, а «и тебя» передаёт присоединительно-отрицательную силу οὐδέ. Единственное число σοῦ сохранено.
theological_decisions:
- issue: Кого обозначают «природные ветви» в метафоре маслины
  choice: Метафора сохранена без прямого пояснения в основном тексте.
  alternative: Перевести с явным указанием на этнический Израиль.
  rationale: Контекст указывает на Израиль, однако сам Павел выражается метафорически; перевод не должен заменять образ его истолкованием.
- issue: Смысл предупреждения, обращённого к «тебе»
  choice: Передано прямое предупреждение в единственном числе без догматических уточнений.
  alternative: Уточнить его в рамках определённого учения об отступничестве, избрании или сохранении верующего.
  rationale: Греческий текст содержит реальное предупреждение, но сам по себе не разрешает более широких конфессиональных споров; обращение к собеседнику в единственном числе сохранено.
translation_notes:
  register: Современный литературный русский язык с ясной, строгой и естественной формулировкой. «Природные ветви» несколько необычно, но уместно в развёрнутой метафоре и близко к κατὰ φύσιν; сноска поясняет буквальный оборот.
