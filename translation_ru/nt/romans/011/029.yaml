  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: ru
  text: Ведь Божьи дары и призвание неотменимы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вызывают сожаления»; или: «не берутся назад». В старых переводах также: «непреложны».'
    reason: 'Лексическая альтернатива: ἀμεταμέλητα может подчёркивать отсутствие сожаления либо то, что данное не отзывается.'
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: неотменимы
  rationale: Прилагательное обозначает то, о чём не сожалеют и что не берут назад. В сочетании с Божьими дарами и призванием «неотменимы» естественно передаёт мысль о том, что Бог их не отзывает, не расширяя значение до отвлечённой «неизменности».
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание или пояснение к предыдущему утверждению. Русское «ведь» кратко и естественно сохраняет эту пояснительную связь.
- source_word: τὰ χαρίσματα
  choice: дары
  rationale: χάρισμα означает дар, данный по благодати. «Дары» сохраняет множественное число и не вносит лишнего истолкования.
- source_word: ἡ κλῆσις
  choice: призвание
  rationale: Слово сохраняет характерный для Павла богословский вес Божьего призыва, не уточняя в самом переводе его действие или адресата.
- source_word: τοῦ θεοῦ
  choice: Божьи
  rationale: Притяжательное прилагательное естественно по-русски связывает Бога и с дарами, и с призванием, оставляя открытым точный оттенок греческого родительного падежа — источник или принадлежность.
theological_decisions:
- issue: Объём выражения «Божьи дары и призвание» в контексте
  choice: Сохранить формулировку без уточнения, относится ли она только к преимуществам и призванию Израиля или выражает более общий принцип.
  alternative: Явно указать на Израиль либо сформулировать универсальное учение о всяком Божьем даре и призвании.
  rationale: Ближайший контекст Римлянам 9–11 посвящён Израилю, однако сам греческий текст стиха прямо не называет объект даров и призвания. Перевод не должен устранять эту содержательную напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. «Ведь» естественно связывает стих с предшествующим рассуждением, а «неотменимы» ясно передаёт смысл без конфессионального уточнения.
