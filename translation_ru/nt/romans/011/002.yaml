source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: ru
  text: 'Бог не отверг Свой народ, который Он предузнал.[a] Или вы не знаете, что говорит Писание в отрывке об Илии: как он обращается к Богу против Израиля?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который Он знал заранее». Греческое слово также понимают в более сильном смысле — «который Он заранее избрал», однако сам перевод не разрешает эту богословскую неоднозначность.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «как он обращается к Богу против Израиля»; возможно также: «как он взывает к Богу против Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: не отверг
  rationale: Глагол означает «отвергнуть, отринуть». «Не отверг» ясно и естественно передаёт отрицание того, что Бог отступился от Своего народа.
- source_word: τὸν λαὸν αὐτοῦ
  choice: Свой народ
  rationale: Сохраняет заветный оттенок выражения, не добавляя в первую часть стиха слово «Израиль», которое прямо названо далее.
- source_word: προέγνω
  choice: предузнал
  rationale: Передаёт значение предварительного знания и сохраняет богословскую напряжённость, не подменяя глагол более сильным толкованием «предызбрал».
- source_word: ἢ οὐκ οἴδατε
  choice: Или вы не знаете
  rationale: Естественно передаёт вводный риторический вопрос Павла.
- source_word: ἐν Ἠλίᾳ
  choice: в повествовании об Илии
  rationale: Греческий оборот буквально звучит как «в Илии», но указывает на раздел Писания, посвящённый Илии.
- source_word: ἡ γραφή
  choice: Писание
  rationale: В данном контексте обозначает священное Писание и естественно передаётся традиционным русским термином.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: как он обращается к Богу с жалобой
  rationale: ἐντυγχάνω здесь обозначает обращение или просьбу к Богу, направленную против Израиля; слово «жалоба» ясно выражает контекст, не создавая положительного оттенка ходатайства.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: на Израиль
  rationale: При выражении «обращается с жалобой» русский предлог «на» естественно передаёт направленность жалобы против Израиля.
theological_decisions:
- issue: Значение προέγνω в связи с Божьим избранием
  choice: предузнал
  alternative: знал заранее; заранее избрал
  rationale: Перевод сохраняет лексическую связь со знанием наперёд и не разрешает неоднозначность в пользу определённого учения об избрании.
- issue: Характер обращения Илии к Богу
  choice: обращается к Богу с жалобой на Израиль
  alternative: ходатайствует перед Богом против Израиля; взывает к Богу против Израиля
  rationale: Контекст явно направлен против Израиля, поэтому положительно окрашенное «ходатайствует» могло бы ввести читателя в заблуждение; «обращается с жалобой» сохраняет смысл обвинительного обращения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Свой» употреблено как возвратное притяжательное; обращение к читателям передано формой множественного числа «вы». Синтаксис риторического вопроса сохранён, а непрозрачный греческий оборот ἐν Ἠλίᾳ раскрыт по смыслу.
