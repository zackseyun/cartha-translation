  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: ru
  text: Ведь каждый, кто призовёт имя Господа, будет спасён[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Павел цитирует Иоил. 2:32. У Иоиля имеется в виду Яхве — имя, обычно передаваемое как «ГОСПОДЬ»; здесь, судя по контексту, Павел применяет эти слова к Иисусу.
    reason: cross_reference
  - marker: b
    text: 'Или: «кто воззовёт к имени Господа». Греческое выражение означает призвать Господа, взывая к Нему или обращаясь к Нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: каждый, кто
  rationale: 'Сочетание передаёт обобщённое и всеохватное значение: речь идёт о любом человеке. «Каждый, кто» естественно звучит по-русски и сохраняет структуру греческой фразы.'
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит подтверждение предыдущей мысли цитатой из Писания. «Ведь» ясно и естественно передаёт её пояснительно-обосновывающую функцию.
- source_word: ἐπικαλέσηται
  choice: призовёт
  rationale: В сочетании с «именем» глагол означает обратиться к Господу, взывая к Нему по имени. «Призовёт» сохраняет библейскую идиому и допускает оттенки молитвенного обращения, исповедания и просьбы о помощи.
- source_word: τὸ ὄνομα
  choice: имя
  rationale: Буквальный перевод сохраняет библейское выражение, указывающее на явленную личность и власть того, к кому обращаются.
- source_word: κυρίου
  choice: Господа
  rationale: Греческий текст содержит κύριος без поясняющего имени. Перевод не добавляет «Иисуса», сохраняя формулировку цитаты и её межтекстовую напряжённость.
- source_word: σωθήσεται
  choice: будет спасён
  rationale: Будущее страдательного залога здесь выражает спасение в павловском смысле; традиционная и понятная формулировка точно передаёт это значение.
theological_decisions:
- issue: К кому относится слово «Господь» в цитате из Иоиля
  choice: В основном тексте оставить «Господа» без уточнения, а связь с Иисусом объяснить в сноске.
  alternative: «Господа Иисуса» или «ГОСПОДА» (Яхве).
  rationale: В греческом тексте стоит κυρίου. В Иоил. 2:32 это имя Яхве, тогда как контекст Рим. 10 применяет данный текст к Иисусу. Добавление имени в основной текст устранило бы значимую межтекстовую и христологическую связь вместо её сохранения.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой библейской идиомы. «Ведь» звучит естественнее начального «ибо», не ослабляя логической связи; «призовёт имя Господа» сохраняет достоинство и межтекстовую форму цитаты.
