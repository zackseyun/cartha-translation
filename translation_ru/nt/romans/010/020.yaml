base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: ru
  text: 'А Исаия смело говорит: «Меня нашли те, кто Меня не искал[a]; Я стал явным для тех, кто обо Мне не спрашивал[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я был найден среди тех, кто Меня не искал».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я открылся тем, кто обо Мне не спрашивал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: говорит ещё смелее
  rationale: Глагол выражает особую дерзновенность или смелость; в контексте сопоставления с предыдущей цитатой естественное русское «говорит ещё смелее» передаёт усиление и сохраняет настоящее время.
- source_word: Εὑρέθην
  choice: Меня нашли
  rationale: Активная русская конструкция естественно передаёт греческий аорист пассива первого лица и сохраняет Бога как объект человеческого нахождения.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: те, кто Меня не искал
  rationale: Хотя ἐν буквально допускает «среди», при εὑρέθην оборот идиоматически обозначает людей, нашедших Бога. Вариант с «среди» сохранён в сноске.
- source_word: ζητοῦσιν
  choice: искал
  rationale: «Искать» точно и естественно передаёт ζητέω и сохраняет библейскую смысловую насыщенность.
- source_word: ἐμφανὴς ἐγενόμην
  choice: Я открылся
  rationale: Естественное современное русское выражение для «стал явным/явился», передающее проявление Бога без добавления идеи видимости исключительно для зрения.
- source_word: ἐπερωτῶσιν
  choice: спрашивал обо Мне
  rationale: Передаёт значение «спрашивать, осведомляться» и не вносит более специального смысла «призывать».
- source_word: δὲ
  choice: А
  rationale: Русское «А» естественно отмечает переход и контраст с предшествующим ходом рассуждения.
- source_word: Ἠσαΐας
  choice: Исаия
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
theological_decisions:
- issue: Передача Божьего самораскрытия в цитате из Исаии
  choice: Я открылся тем, кто обо Мне не спрашивал
  alternative: Я стал явным для тех, кто обо Мне не спрашивал
  rationale: «Я открылся» естественно передаёт ἐμφανὴς ἐγενόμην как Божье явление людям, не утверждая сверх текста конкретный способ откровения. Более формальный вариант дан в сноске.
- issue: Субъект нахождения Бога
  choice: Меня нашли те, кто Меня не искал
  alternative: Я был найден среди тех, кто Меня не искал
  rationale: Основной текст отражает идиоматический смысл конструкции, а сноска сохраняет формальную возможность понимания ἐν как «среди».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Заглавное «Меня/Я/Мне» внутри прямой речи обозначает Божье самоназывание по принятой русской религиозно-издательской норме. Параллелизм «не искал / не спрашивал» сохранён.
