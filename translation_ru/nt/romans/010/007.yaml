id: ROM.10.7
reference: Romans 10:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: ru
  text: 'или: «Кто сойдёт в бездну[a]?» (то есть чтобы поднять Мессию[b] из мёртвых).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «в глубину». Павел перекликается со Второзаконием 30:13, но здесь говорит о «бездне», связывая этот образ с поднятием Мессии из мёртвых.
    reason: lexical_alternative
  - marker: b
    text: Греч. «Христа»; здесь переведено «Мессию», поскольку Χριστός употреблено как титул.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: или
  rationale: Простой разделительный союз естественно вводит вторую часть противопоставления и точно передаёт греческое ἤ.
- source_word: καταβήσεται
  choice: сойдёт
  rationale: Будущее время сохранено; «сойдёт» передаёт движение вниз и соответствует возвышенному риторическому строю вопроса.
- source_word: εἰς τὴν ἄβυσσον
  choice: в бездну
  rationale: «Бездна» прямо передаёт ἄβυσσος и сохраняет образ глубины, не сужая его до могилы или царства мёртвых.
- source_word: τοῦτ’ ἔστιν
  choice: то есть
  rationale: Обычная и естественная пояснительная формула, соответствующая греческому выражению.
- source_word: Χριστόν
  choice: Мессию
  rationale: Здесь Χριστός выступает как титул Помазанника; «Мессия» передаёт значение титула, а не просто воспроизводит традиционную транслитерацию.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устойчивое русское выражение точно передаёт исходное словосочетание и оставляет его собирательный смысл.
- source_word: ἀναγαγεῖν
  choice: поднять
  rationale: Глагол сохраняет направленность движения вверх в противопоставлении «сойти»; контекст связывает это движение с возвращением Мессии из мёртвых.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессию
  alternative: Христа
  rationale: В данном пояснении слово сохраняет титульный смысл «Помазанник»; перевод «Мессия» делает этот смысл явным без добавления конфессионального толкования.
- issue: Смысл «бездны» в пояснении Павла
  choice: Сохранить слово «бездна» без истолкования в основном тексте
  alternative: глубина; царство мёртвых; ад
  rationale: Так сохраняются аллюзия на Второзаконие 30:13, пространственный образ и богословское напряжение текста; более узкие варианты преждевременно разрешили бы неоднозначность.
- issue: Передача ἀναγαγεῖν
  choice: поднять
  alternative: вывести наверх; воскресить
  rationale: «Поднять» удерживает пространственную образность греческого глагола. «Воскресить» точнее формулировало бы подразумеваемое событие, но было бы более истолковательным.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным риторическим вопросом. Синтаксис пояснения сохранён близким к греческому, а скобки помогают ясно отделить авторское толкование цитаты.
