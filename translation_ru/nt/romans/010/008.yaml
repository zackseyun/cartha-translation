  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: ru
  text: Но что сказано? «Слово близко к тебе — в твоих устах и в твоём сердце»[a]. Это и есть слово веры, которое мы возвещаем.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Втор. 30:14. Павел использует слова этого места Писания и применяет их к возвещаемой вести.
    reason: cross_reference
  - marker: b
    text: «Слово веры» можно также передать как «весть веры» или «весть о вере»; греч. πίστις в некоторых контекстах может означать «доверие» или «верность».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Естественно вводит противопоставление предшествующему рассуждению.
- source_word: τί λέγει
  choice: что говорит Писание?
  rationale: Греческий текст буквально не называет подлежащее, однако в русском без него вопрос звучит неестественно и неясно; контекст прямой цитаты позволяет эксплицировать подразумеваемое Писание.
- source_word: Ἐγγύς σου τὸ ῥῆμά ἐστιν
  choice: Близко к тебе слово
  rationale: Сохраняет краткость, порядок образов и формулировку цитаты из Второзакония.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: в твоих устах и в твоём сердце
  rationale: «Уста» естественно передают телесный образ и лучше сочетаются с присутствием слова, тогда как «сердце» сохраняет библейское обозначение внутреннего человека.
- source_word: τοῦτ’ ἔστιν
  choice: Это и есть
  rationale: Ясно вводит Павлово пояснение цитаты, не превращая его в свободный пересказ.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: слово веры
  rationale: Сохраняет повтор ῥῆμα и компактность неоднозначной родительной конструкции, не решая чрезмерно, означает ли она содержание, характер или призыв к вере.
- source_word: ὃ κηρύσσομεν
  choice: которое мы возвещаем
  rationale: Передаёт публичное провозглашение κηρύσσω в современном литературном и достойном регистре.
theological_decisions:
- issue: Значение πίστις в сочетании τὸ ῥῆμα τῆς πίστεως
  choice: вера
  alternative: доверие; верность; «весть о вере»
  rationale: «Вера» является естественным и широким эквивалентом здесь; буквальное «слово веры» сохраняет богословскую и грамматическую ёмкость выражения, не навязывая узкой трактовки родительного падежа.
- issue: Связь цитаты с Второзаконием 30:14
  choice: Сохранить формулировку цитаты и пояснить аллюзию в сноске
  alternative: Встроить ссылку или истолкование в основной текст
  rationale: Павел применяет язык Второзакония к возвещаемому слову, но само указание источника отсутствует в греческом тексте стиха и уместнее в примечании.
translation_notes:
  register: Современный литературный русский с сохранением краткости и достоинства цитаты. «Писание» эксплицировано ради русской синтаксической ясности; архаичное «уста» сохранено как укоренённый и понятный библейский образ. Все сноски отмечены в основном тексте.
