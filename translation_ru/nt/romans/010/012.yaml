  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: ru
  text: Ибо нет различия между иудеем и греком[a], ибо один и тот же Господь — Господь всех[b], щедр ко всем, кто призывает Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В оригинале: «грек»; здесь пара «иудей — грек» противопоставляет иудея неиудею. Возможный контекстуальный перевод: «между иудеем и язычником».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «один и тот же Господь над всеми».'
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: различие
  rationale: Передаёт отсутствие разграничения между двумя группами без добавления идеи ценностного превосходства.
- source_word: Ἰουδαίου τε καὶ Ἕλληνος
  choice: между иудеем и греком
  rationale: Сохраняет буквальную пару исходного текста; в данном контексте она противопоставляет иудея неиудею.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: один и тот же Господь — Господь всех
  rationale: Повтор «Господь» естественно раскрывает именное предложение и сохраняет возможный смысл принадлежности или власти над всеми.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет христологически значимый титул в ближайшем контексте Рим 10.
- source_word: πλουτῶν εἰς πάντας
  choice: щедрый ко всем
  rationale: Естественная русская передача образа изобилия, направленного ко всем названным далее людям; буквальное «богатый ко всем» здесь звучало бы неясно.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: кто призывает Его
  rationale: «Призывать Господа» — ясное и устойчивое библейское выражение, согласующееся с непосредственным контекстом стиха 13.
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: Не уточнять референта внутри перевода; ближайший контекст указывает на Иисуса как Господа и сохраняет отзвук цитаты о призывании Господа.
  alternative: Явно добавить имя «Иисус» или понимать слово только как общее обозначение Бога.
  rationale: Исходный текст употребляет только κύριος. Добавление имени сняло бы заложенную контекстом богословскую напряжённость.
- issue: Объём значения «всех»
  choice: Сохранить ограничивающую фразу «кто призывает Его».
  alternative: Понять «всех» как безусловное утверждение обо всех людях.
  rationale: Греческий субстантивированный причастный оборот прямо определяет тех, к кому обращена щедрость Господа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Иудей» и «призывает Его» сохраняют устойчивую библейскую лексику; «щедрый ко всем» обеспечивает ясность без утраты образа изобильного богатства.
