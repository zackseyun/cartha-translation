  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: ru
  text: 'Но не все послушались Благой вести[a]. Ведь Исаия говорит: «Господи, кто поверил нашей вести[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелию».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нашему сообщению»; буквально: «нашему слышанию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Кратко и естественно передаёт противопоставление предыдущему рассуждению.
- source_word: οὐ πάντες
  choice: не все
  rationale: Сохраняет частичное отрицание греческого текста и не создаёт впечатления, будто Благую весть отвергли абсолютно все.
- source_word: ὑπήκουσαν
  choice: покорились
  rationale: Передаёт значение послушания, заложенное в ὑπακούω, а не сводит отклик лишь к слушанию. Управление дательным падежом звучит по-русски естественно.
- source_word: τῷ εὐαγγελίῳ
  choice: Благой вести
  rationale: Прозрачно передаёт основное значение εὐαγγέλιον; традиционный вариант «Евангелию» указан в сноске.
- source_word: Ἠσαΐας
  choice: Исаия
  rationale: Общепринятая русская форма имени пророка.
- source_word: γὰρ
  choice: Ведь
  rationale: Естественно вводит подтверждение предыдущего утверждения цитатой из Писания.
- source_word: λέγει
  choice: говорит
  rationale: Сохраняет настоящее время и характерное для Нового Завета представление Писания как звучащего ныне свидетельства.
- source_word: Κύριε
  choice: Господи
  rationale: Нормальная современная русская форма звательного обращения к Господу.
- source_word: τίς ἐπίστευσεν
  choice: кто поверил
  rationale: Естественно передаёт риторический вопрос и аорист без внесения отсутствующих в греческом тексте временных оттенков.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: нашей вести
  rationale: В контексте цитаты ἀκοή обозначает услышанное сообщение или возвещение. «Наша весть» ясно передаёт этот смысл, тогда как буквальное «нашему слышанию» по-русски неясно.
theological_decisions:
- issue: Характер отклика на Благую весть в выражении ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: «покорились Благой вести»
  alternative: «послушались Благой вести»; «вняли Благой вести»
  rationale: Перевод сохраняет прямое значение послушания в глаголе ὑπακούω и связь веры с послушным откликом, не уточняя конфессионально механизм спасения.
- issue: Значение ἀκοή в цитате из Исаии
  choice: «нашей вести»
  alternative: «нашему сообщению»; «тому, что услышали от нас»; буквально «нашему слышанию»
  rationale: Слово допускает значения слышания и услышанного сообщения. В данном контексте предметом веры является возвещённая весть; альтернативная образность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. «Покорились» сохраняет силу греческого глагола, а «Благая весть» делает смысл εὐαγγέλιον прозрачным для обычного читателя. Цитата оформлена естественно, без архаизации.
