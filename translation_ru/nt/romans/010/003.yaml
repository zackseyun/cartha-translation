base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: ru
  text: Ибо не зная праведности[a] Божьей[b] и стремясь утвердить собственную праведность, они не подчинились праведности Божьей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости» (в обоих случаях употребления слова «праведность»). У Павла δικαιοσύνη может означать праведность, справедливость или Божий праведный способ сделать людей правыми перед Ним.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «праведность Божья» можно также понимать как «праведность от Бога» или «праведность, принадлежащая Богу». Греческая конструкция допускает несколько смысловых оттенков.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: не зная
  rationale: Настоящее причастие обозначает продолжающееся незнание или непризнание как обстоятельство их поступка; формулировка не усиливает смысл до сознательного отвержения.
- source_word: γὰρ
  choice: ибо
  rationale: Передаёт пояснительную связь с предыдущим утверждением и сохраняет достойный литературный регистр.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: праведность
  rationale: В контексте Павла слово может включать праведность, справедливость, правый статус и Божий способ оправдания людей. «Праведность» сохраняет широту богословского употребления; «справедливость» отмечена в сноске.
- source_word: τοῦ θεοῦ
  choice: Божья / Божьей
  rationale: Естественная русская конструкция, которая не вынуждает однозначно выбирать между принадлежностью Богу, происхождением от Бога и Божьим праведным действием.
- source_word: ἰδίαν
  choice: собственную праведность
  rationale: Прилагательное употреблено эллиптически, а существительное δικαιοσύνη подразумевается из предыдущей фразы. В русском повтор существительного проясняет смысл и звучит естественно.
- source_word: ζητοῦντες
  choice: стремясь
  rationale: Сохраняет длительный характер настоящего причастия и передаёт целенаправленное усилие без лишнего уточнения мотива.
- source_word: στῆσαι
  choice: утвердить
  rationale: Передаёт идиоматическое значение ἵστημι — установить или сделать действительным — в рассуждении о собственной праведности.
- source_word: ὑπετάγησαν
  choice: не покорились
  rationale: 'Форма пассивного аориста имеет здесь возвратно-средний смысл: они не подчинились Божьей праведности. «Не покорились» естественно передаёт это волевое неподчинение.'
theological_decisions:
- issue: Смысл выражения «праведность Божья»
  choice: Сохранено выражение «праведность Божья» без сведения его к одному значению.
  alternative: «праведность от Бога»; «праведность, принадлежащая Богу»; «Божье праведное спасительное действие»
  rationale: Греческий родительный падеж допускает оттенки принадлежности, источника и действия. Основной текст сохраняет многослойность выражения и не навязывает узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Ибо» уместно передаёт логическую связь; синтаксис остаётся ясным для обычного современного читателя.
