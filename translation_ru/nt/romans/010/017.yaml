  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: ru
  text: Итак, вера приходит от слышания, а слышание — через слово Мессии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через слово о Мессии» / «через весть о Мессии». Греческий родительный падеж допускает разные понимания этой связи.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает стих с контекстом.
- source_word: πίστις
  choice: вера
  rationale: В контексте Рим 10:14–16 речь идёт об ответе человека на услышанную весть; «вера» сохраняет обычное для Павла богословское значение без сужения до одной лишь верности.
- source_word: ἐξ ἀκοῆς
  choice: приходит от слышания
  rationale: Предлог ἐκ указывает на источник; добавленный глагол «приходит» естественно передаёт смысл безглагольной греческой фразы.
- source_word: ἀκοή
  choice: слышание
  rationale: Слово может обозначать как акт слышания, так и услышанную весть. «Слышание» сохраняет повтор исходного слова и не устраняет полностью эту смысловую широту.
- source_word: δὲ
  choice: а
  rationale: Здесь частица мягко продолжает и развивает мысль, не выражая резкого противопоставления; русское «а» естественно связывает две части.
- source_word: διὰ
  choice: через
  rationale: διά с родительным падежом выражает средство или посредство; «через» прямо сохраняет эту связь.
- source_word: ῥήματος
  choice: слово
  rationale: ῥῆμα означает произнесённое слово или высказывание. «Слово» сохраняет лексическую форму и традиционное звучание, оставаясь понятным.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь выступает как титул. Родительный падеж передан формально как «Мессии», а возможное объективное значение разъяснено в сноске.
theological_decisions:
- issue: Значение πίστις в данном контексте
  choice: вера
  alternative: доверие; верность
  rationale: Ближайший контекст говорит о человеческом отклике на возвещённую благую весть, поэтому «вера» наиболее точно и нейтрально передаёт смысл.
- issue: Смысл родительного Χριστοῦ после ῥήματος
  choice: слово Мессии
  alternative: слово о Мессии; весть о Мессии
  rationale: Греческий родительный допускает понимание слова как исходящего от Мессии либо как слова о Мессии. Основной текст формально сохраняет конструкцию, а сноска отражает другой возможный разбор.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная, с сохранением параллелизма исходного текста и подлинной неоднозначности выражения «слово Мессии».
