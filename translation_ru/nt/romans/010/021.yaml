  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: ru
  text: 'А об Израиле Он говорит[a]: «Весь день Я простирал руки Мои к народу непокорному[b] и возражающему[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А Израилю Он говорит». Греческую конструкцию можно понять и как слова, обращённые к Израилю, и как высказывание об Израиле.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «неверующему», «не желающему поверить»; это слово может обозначать как непослушание, так и отказ быть убеждённым.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «противоречащему», «говорящему против», «противящемуся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: А об Израиле
  rationale: Конструкция с πρός при λέγει допускает значение «об Израиле» наряду с «Израилю». Основной текст естественно передаёт тематическое отношение, а альтернативное понимание сохраняется в сноске.
- source_word: λέγει
  choice: Он говорит
  rationale: Настоящее время сохраняет характерную для Павла живую формулу цитирования. Местоимение написано с прописной буквы, поскольку из контекста цитаты подразумевается Бог, хотя в греческом подлежащее прямо не названо.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Весь день
  rationale: Естественная русская передача винительного длительности, сохраняющая идею непрестанного действия в течение дня.
- source_word: ἐξεπέτασα
  choice: Я простирал
  rationale: Несовершенный вид по-русски естественно выражает длительность и повторность призыва, подчеркнутые словами «весь день», не превращая аорист механически в однократное действие.
- source_word: τὰς χεῖράς μου
  choice: руки Мои
  rationale: Сохранён образ протянутых рук как выражение обращения и призыва; порядок слов поддерживает достоинство библейской цитаты без архаизации всего стиха.
- source_word: πρὸς λαὸν
  choice: к народу
  rationale: Предлог «к» естественно передаёт направленность жеста к тем, к кому обращён Божий призыв.
- source_word: ἀπειθοῦντα
  choice: непокорному
  rationale: Слово выражает непослушание и отказ поверить или подчиниться. «Непокорному» хорошо передаёт волевое сопротивление, а смысловой оттенок неверия отмечен в сноске.
- source_word: ἀντιλέγοντα
  choice: прекословящему
  rationale: 'Причастие буквально связано с речью против кого-либо: возражением, противоречием, оспариванием. «Прекословящему» сохраняет этот активный речевой оттенок точнее общего «противящемуся».'
theological_decisions:
- issue: Характер ответа Израиля на Божье обращение
  choice: «к народу непокорному и прекословящему»
  alternative: «к народу неверующему и противящемуся»
  rationale: 'Два причастия сохраняются раздельно: первое обозначает отказ послушаться или поверить, второе — активное возражение. Перевод удерживает напряжение между продолжительным Божьим обращением и человеческим сопротивлением, не делая более широких выводов о положении Израиля.'
- issue: Кому или о ком произносится высказывание
  choice: «об Израиле Он говорит»
  alternative: «Израилю же Он говорит»
  rationale: Греческая конструкция допускает как тематическое, так и адресное понимание. В основном тексте выбран естественный тематический вариант, а подлинная неоднозначность прямо сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, подобающим пророческой цитате. Формы «простирал» и «прекословящему» точны и понятны в библейском контексте; синтаксис остаётся ясным для широкого круга читателей.
