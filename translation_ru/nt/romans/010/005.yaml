  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: ru
  text: 'Ведь Моисей пишет о праведности, которая от Закона: «Человек, исполнивший её, будет жить ею».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о справедливости».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет жить в ней»; здесь слышен отголосок Лев 18:5.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим рассуждением Павла естественным для современного русского языка способом.
- source_word: γράφει
  choice: пишет
  rationale: Сохраняет настоящее время и обычную формулу ссылки на Писание.
- source_word: δικαιοσύνην
  choice: праведность
  rationale: В контексте Послания к римлянам сохраняет богословскую связь с противопоставлением праведности от Закона и праведности от веры; возможное значение «справедливость» отмечено в сноске.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: от Закона
  rationale: Предлог ἐκ указывает на источник; прописная буква помогает обозначить Моисеев Закон как известную категорию.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: человек, исполнивший её
  rationale: Причастие аориста передано совершенным видом. Местоимение «её» восполняет подразумеваемое дополнение и соотносится с «праведностью», не вводя отсутствующего в данном греческом тексте множественного «это» или «заповеди».
- source_word: ζήσεται
  choice: будет жить
  rationale: Прямо передаёт будущее время и сохраняет формулировку библейской цитаты.
- source_word: ἐν αὐτῇ
  choice: ею
  rationale: Сохраняет единственное число женского рода и естественно выражает средство или основание жизни; более буквальное «в ней» приведено в сноске.
theological_decisions:
- issue: Значение δικαιοσύνη в противопоставлении Павла
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет устойчивую связь терминологии в ближайшем контексте Рим 10 и её судебно-религиозный оттенок, не исключая более общего значения слова.
- issue: Референт и смысл ἐν αὐτῇ
  choice: будет жить ею
  alternative: будет жить в ней
  rationale: Форма αὐτῇ — женского рода, единственного числа — естественно соотносится с δικαιοσύνη («праведностью»). Перевод не заменяет её множественным числом, хотя формулировка перекликается с Лев 18:5 и допускает понимание жизни через исполнение предписаний Закона.
- issue: Обобщающее значение ἄνθρωπος
  choice: человек
  alternative: тот, кто
  rationale: Русское «человек» здесь естественно имеет обобщающее значение и относится к любому человеку, поэтому не требует отдельного гендерного пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Порядок слов делает контраст «праведности от Закона» заметным, но остаётся естественным. Кавычки обозначают цитируемое Моисеем изречение; добавленные слова сведены к минимуму.
