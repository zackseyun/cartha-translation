id: ROM.10.14
reference: Romans 10:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: ru
  text: Как же они призовут Того, в Кого не уверовали? Как поверят в Того, о Ком не слышали?[a] Как услышат, если никто не проповедует?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как поверят в Того, Кого не слышали?»'
    reason: Греческий родительный падеж при глаголе «слышать» может означать как слышание вести о ком-либо, так и непосредственное слышание самого этого лица.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Как же
  rationale: «Как же» естественно передаёт выводное значение οὖν и сохраняет последовательность риторических вопросов.
- source_word: ἐπικαλέσωνται
  choice: призовут
  rationale: Глагол передаёт обращение с призывом или мольбой и сохраняет связь с цитатой о призывании имени Господа в предыдущем стихе.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: Того, в Кого не уверовали
  rationale: Предлог «в» естественно передаёт направленность веры, выраженную εἰς; «уверовали» здесь указывает на состоявшееся обращение к вере и хорошо вписывается в причинную цепочку.
- source_word: πιστεύσωσιν
  choice: поверят
  rationale: Будущее время естественно передаёт оттенок греческого конъюнктива в риторическом вопросе и сохраняет обычную лексику веры.
- source_word: οὗ οὐκ ἤκουσαν
  choice: о Ком не слышали
  rationale: Так по-русски естественно выражается вероятный смысл — услышать весть о Христе. Возможность понимать оборот как непосредственное слышание Самого Христа сохранена в сноске.
- source_word: ἀκούσωσιν
  choice: услышат
  rationale: 'Прямой эквивалент сохраняет повтор корня и ход рассуждения Павла: вера предполагает слышание.'
- source_word: χωρὶς κηρύσσοντος
  choice: если никто не проповедует
  rationale: Естественная русская передача конструкции «без проповедующего»; она подчёркивает действие провозглашения, не превращая причастие в обозначение церковной должности.
theological_decisions:
- issue: Лексика πιστεύω
  choice: уверовали / поверят
  alternative: доверились / будут верить
  rationale: Выбраны обычные русские соответствия языку веры; более истолковывающее «доверились» не вводится.
- issue: Объект слышания в οὗ οὐκ ἤκουσαν
  choice: о Ком не слышали
  alternative: Кого не слышали
  rationale: Греческий родительный при ἀκούω допускает понимание как слышания о Христе, так и слышания Самого Христа. Основной текст использует наиболее естественное в данном контексте русское выражение, а альтернативу сохраняет в сноске, не устраняя богословского напряжения.
translation_notes:
  register: Современный литературный русский язык; торжественность сохраняется без архаизмов. Три кратких риторических вопроса воспроизводят нарастающую логику исходного текста. Местоимения, относящиеся ко Христу, написаны с прописной буквы в соответствии с устойчивой русской библейской традицией.
