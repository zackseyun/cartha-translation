  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: ru
  text: 'Но я спрашиваю: разве Израиль не знал?[a] Первым говорит Моисей: «Я возбужу в вас ревность не народом[b]; неразумным народом вызову у вас гнев».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве Израиль не понял?» Греческий глагол может означать как знание, так и понимание; здесь речь может идти об осмыслении услышанной вести.'
    reason: lexical_alternative
  - marker: b
    text: Цитата из Второзакония 32:21. Выражение «не народом» может обозначать людей, которых не считают настоящим народом, то есть язычников.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: разве Израиль не знал?
  rationale: Сохраняет обычное значение ἔγνω («знал») и риторическую форму вопроса; в контексте возможно значение «не понял», отмеченное в сноске.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Первым говорит Моисей
  rationale: Передаёт наречное πρῶτος, представляющее Моисея как первого приводимого свидетеля Писания, и сохраняет историческое настоящее λέγει.
- source_word: παραζηλώσω ὑμᾶς
  choice: Я возбужу в вас ревность
  rationale: 'Естественно передаёт каузативный смысл глагола: вызвать или возбудить ревность.'
- source_word: ἐπ’ οὐκ ἔθνει
  choice: теми, кто не народ
  rationale: Сохраняет парадоксальную формулировку цитаты и не определяет прямо её референта; множественное «теми» естественно по-русски обозначает людей, мыслимых собирательно как «не народ».
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: народом неразумным
  rationale: «Неразумным» близко передаёт отсутствие понимания в ἀσυνέτῳ и сохраняет связь с темой знания и понимания.
- source_word: παροργιῶ ὑμᾶς
  choice: вызову у вас гнев
  rationale: Передаёт каузативное значение «побуждать к гневу, раздражать» без чрезмерного усиления.
theological_decisions:
- issue: Кого обозначают «не народ» и «народ неразумный»
  choice: Не уточнять референта в основном тексте и сохранить формулировку цитаты
  alternative: Прямо назвать язычников либо народ, который Израиль не считает настоящим народом
  rationale: Павел цитирует Второзаконие 32:21; сохранение образной формулировки позволяет не вносить толкование в сам текст и удерживает его богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм цитаты сохранён; архаизмы и конфессионально окрашенные пояснения исключены.
