- from: Потому что Мессия — конец Закона, ведущий к праведности каждого верующего.[a][b]
  to: Ведь Мессия — конец[a] Закона для праведности[b] каждого верующего.
  rationale: Заменён оборот «ведущий к праведности каждого верующего», поскольку он менял синтаксическую связь и звучал двусмысленно по-русски. Формулировка «для праведности каждого верующего» сохраняет сжатость и направленность εἰς, не навязывая способ получения праведности. Маркеры сносок перенесены к поясняемым словам; в сноску о τέλος добавлено «исполнение», присутствующее среди значимых лексических возможностей.
