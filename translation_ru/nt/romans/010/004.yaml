  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: ru
  text: Ведь Мессия — конец[a] Закона для праведности[b] каждого верующего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «цель», «завершение» или «исполнение»; греческое слово, переведённое как «конец», может означать прекращение, цель, итог или исполнение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «справедливость» вместо «праведности»; греческое слово допускает оба смысловых оттенка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: конец
  rationale: 'Сохраняет смысловую многозначность греческого слова: завершение, цель или высшая точка; альтернативные оттенки указаны в сноске.'
- source_word: νόμου
  choice: Закона
  rationale: В контексте Послания к римлянам речь идёт о Моисеевом Законе как известной заветной категории; прописная буква помогает обозначить это референциальное значение.
- source_word: Χριστὸς
  choice: Мессия
  rationale: 'Здесь явно значим титульный смысл: Павел связывает Иисуса с Законом и надеждами Израиля.'
- source_word: εἰς δικαιοσύνην
  choice: ведущий к праведности
  rationale: Передаёт направленность εἰς как цель или результат, не определяя жёстко синтаксическую связь оборота.
- source_word: δικαιοσύνην
  choice: праведности
  rationale: Обычное и богословски ёмкое соответствие в павловском контексте; возможное значение «справедливость» сохранено в сноске.
- source_word: παντὶ τῷ πιστεύοντι
  choice: каждого верующего
  rationale: Естественно передаёт охват каждого человека, который верит, и согласуется с русским управлением оборота «ведущий к».
- source_word: γὰρ
  choice: Потому что
  rationale: Передаёт пояснительно-причинную связь с предшествующим рассуждением яснее, чем книжное «ибо».
theological_decisions:
- issue: Значение τέλος νόμου по отношению к Моисееву Закону
  choice: «конец Закона» в основном тексте с сохранением многозначности в сноске
  alternative: «цель Закона», «завершение Закона», «исполнение Закона»
  rationale: Греческое τέλος допускает как значение прекращения или конечной точки, так и значение цели, итога либо кульминации. Основной текст не снимает это богословское напряжение.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Контекст отношений Иисуса с Законом и историей Израиля делает титульное значение особенно заметным.
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет традиционный и широкий павловский смысл, тогда как «справедливость» могла бы неоправданно сузить восприятие стиха.
- issue: Синтаксическая связь εἰς δικαιοσύνην
  choice: «ведущий к праведности» как определение результата или направленности всего утверждения
  alternative: «чтобы праведность получил каждый верующий»
  rationale: Сжатый греческий оборот не уточняет всех логических связей. Выбранная формулировка сохраняет компактность и не вводит отсутствующий в оригинале глагол получения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля, но без архаичного «ибо». Формулировка остаётся краткой и сохраняет неоднозначность ключевого слова τέλος.
