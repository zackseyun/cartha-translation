lexical_decisions:
- source_word: καρδίᾳ
  choice: сердцем
  rationale: Творительный падеж естественно передаёт дательный орудия или отношения и сохраняет акцент на внутреннем человеке.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим высказыванием естественным для современного русского языка союзом.
- source_word: πιστεύεται
  choice: веруют
  rationale: Неопределённо-личная конструкция передаёт обобщённое значение греческой формы без введения отсутствующего в тексте подлежащего.
- source_word: εἰς δικαιοσύνην
  choice: к праведности
  rationale: Предлог «к» сохраняет краткое указание на направленность или результат, не уточняя спорным образом характер связи.
- source_word: δικαιοσύνην
  choice: праведности
  rationale: «Праведность» сохраняет широкий павловский смысл, включая судебные и нравственные оттенки; возможное «справедливость» вынесено в сноску.
- source_word: στόματι
  choice: устами
  rationale: Творительный падеж сохраняет параллель с «сердцем» и обозначает внешнее словесное исповедание.
- source_word: δὲ
  choice: а
  rationale: Союз передаёт мягкое сопоставление внутренней веры и внешнего исповедания, не превращая их в противоположности.
- source_word: ὁμολογεῖται
  choice: исповедуют
  rationale: Неопределённо-личная форма соответствует обобщённому строю первой части, а «исповедуют» в контексте стиха 9 точно передаёт открытое признание Иисуса Господом.
- source_word: εἰς σωτηρίαν
  choice: ко спасению
  rationale: Форма «ко спасению» естественна по-русски, сохраняет направленность или результат и формальную параллель с «к праведности».
- source_word: σωτηρίαν
  choice: спасению
  rationale: Это обычный и контекстуально точный русский эквивалент в павловском сотериологическом употреблении.
theological_decisions:
- issue: Связь веры и исповедания с праведностью и спасением
  choice: 'Сохранить две параллельные формулировки: вера направлена к праведности, исповедание — ко спасению.'
  alternative: Истолковать исповедание лишь как свидетельство уже полученного спасения либо как дополнительное дело, заслуживающее спасение.
  rationale: Греческий текст использует параллельные обороты с εἰς и не раскрывает здесь механический порядок оправдания и спасения; перевод не должен устранять эту богословскую напряжённость.
translation_notes:
