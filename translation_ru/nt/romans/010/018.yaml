id: ROM.10.18
reference: Romans 10:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: ru
  text: 'Но я спрашиваю: разве они не слышали? Конечно, слышали: «По всей земле разнёсся их голос[a], и до краёв обитаемого мира[b] — их слова».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их звук».'
    reason: lexical_alternative
  - marker: b
    text: 'Или короче: «мира»; греческое слово обозначает обитаемый мир.'
    reason: lexical_alternative
  - marker: c
    text: Павел цитирует Псалом 18:5 (в иной нумерации — 19:4) и применяет его образный язык к распространению вести.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: разве они не слышали?
  rationale: Двойное отрицание вводит риторический вопрос, предполагающий утвердительный ответ. «Разве они не слышали?» естественно передаёт эту функцию и сохраняет форму вопроса.
- source_word: μενοῦνγε
  choice: Конечно, слышали
  rationale: Частица выражает усиленное подтверждение. В русском ответе подразумеваемый глагол повторён для ясности и естественности.
- source_word: φθόγγος
  choice: голос
  rationale: В поэтической цитате слово обозначает распространяющийся звук или голос. «Голос» естественно сочетается со «словами» во второй части параллелизма; вариант «звук» отмечен в сноске.
- source_word: γῆ
  choice: земля
  rationale: Универсальный контекст цитаты указывает на всю землю, а не на отдельную страну или территорию.
- source_word: ἐξῆλθεν
  choice: разнёсся
  rationale: Греческий аорист описывает совершившееся распространение. Русский глагол «разнёсся» естественно передаёт движение голоса по всей земле и уместен в поэтическом контексте.
- source_word: πέρατα
  choice: края
  rationale: «До краёв» — естественный русский эквивалент пространственной идиомы и сохраняет поэтический параллелизм.
- source_word: οἰκουμένης
  choice: обитаемого мира
  rationale: Перевод сохраняет буквальный оттенок οἰκουμένη — мира как населённой, обитаемой земли, хотя в русском возможно и более краткое «мира».
- source_word: ῥήματα
  choice: слова
  rationale: Прямой эквивалент сохраняет параллелизм с «голосом» и не вводит более толковательное «весть» или «послание».
theological_decisions:
- issue: К кому относится местоимение «их» в цитате из псалма
  choice: Сохранить местоимение без поясняющей подстановки
  alternative: Прямо назвать небеса из исходного контекста псалма либо проповедников Благой вести в применении Павла
  rationale: Павел использует слова псалма в рассуждении о распространении услышанной вести. Перевод сохраняет межтекстовую неоднозначность и не решает спорный вопрос за читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием цитаты. Риторический вопрос и энергичный утвердительный ответ переданы ясно; поэтический параллелизм двух частей сохранён.
