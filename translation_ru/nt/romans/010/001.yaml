  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: ru
  text: Братья[a], желание моего сердца и моя молитва к Богу о них направлены к их спасению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; в греческом употреблена форма мужского рода во множественном числе, которая может служить обращением к смешанной группе.'
    reason: Лексическая альтернатива и пояснение возможного включительного значения обращения.
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Братья
  rationale: Звательная форма множественного числа передана традиционным и естественным русским обращением мужского рода; в данном контексте оно может относиться ко всей общине, что отмечено в сноске.
- source_word: εὐδοκία
  choice: желание
  rationale: В контексте слово обозначает сердечное стремление Павла, а не отвлечённое благоволение или удовольствие.
- source_word: τῆς ἐμῆς καρδίας
  choice: моего сердца
  rationale: Сохранена генитивная связь оригинала в естественном русском выражении «желание моего сердца».
- source_word: δέησις
  choice: молитва
  rationale: Слово подразумевает настойчивую просьбу, обращённую к Богу; «молитва» здесь ясно и естественно передаёт смысл.
- source_word: πρὸς τὸν θεόν
  choice: к Богу
  rationale: Предлог πρός с винительным указывает на направленность молитвы; по-русски естественно «молитва к Богу».
- source_word: ὑπὲρ αὐτῶν
  choice: о них
  rationale: ὑπέρ выражает просьбу ради их блага; в сочетании с «молитва» нормативное русское управление — «о них».
- source_word: αὐτῶν
  choice: них
  rationale: Сохранено местоимение оригинала; его референт определяется предшествующим контекстом и не заменён поясняющим существительным.
- source_word: εἰς σωτηρίαν
  choice: об их спасении
  rationale: εἰς обозначает цель молитвы. Русская конструкция ясно связывает спасение с теми, о ком молится Павел, не представляя его как уже достигнутый результат.
- source_word: μὲν
  choice: отдельно не передано
  rationale: Частица имеет лёгкую дискурсивную функцию и не получает здесь явной пары с δέ; отдельный русский эквивалент сделал бы фразу неестественно тяжёлой.
theological_decisions:
- issue: Род обращения Ἀδελφοί
  choice: Братья
  alternative: Братья и сёстры
  rationale: Основной текст сохраняет грамматически мужскую форму греческого обращения, а вероятный охват всей смешанной общины отмечается в сноске.
- issue: Направленность εἰς σωτηρίαν
  choice: об их спасении
  alternative: ко спасению
  rationale: Передана цель ходатайственной молитвы без утверждения, что спасение уже стало её результатом; принадлежность спасения местоименному референту ясна из конструкции.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис близок к оригиналу, но тире делает составное высказывание ясным и естественным. Местоименная отсылка и смысловая напряжённость просьбы о спасении сохранены.
