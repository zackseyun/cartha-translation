    issue: Целевое значение εἰς σωτηρίαν передано как предметное «об их спасении».
    rationale: Предлог εἰς здесь обозначает цель/направленность желания и молитвы. Формулировка «направлены к их спасению» яснее сохраняет это значение, не утверждая, что спасение уже совершилось.
  - severity: low
    issue: При слове «молитва» не выражена принадлежность Павлу.
    rationale: В греческом общий контекст и конструкция связывают оба существительных с говорящим; русское «моя молитва» устраняет возможную формальную неясность и естественно оформляет фразу.
