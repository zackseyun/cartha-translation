  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: ru
  text: 'Ибо я свидетельствую о них: они проявляют рвение к Богу[a], но это рвение не основано на знании[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рвение Божье». Греческий родительный падеж допускает более буквальную передачу, но здесь, вероятнее всего, речь идёт о рвении, направленном к Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не по знанию»; или: «не с полным знанием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: я свидетельствую
  rationale: Настоящее время и первое лицо переданы прямо; выражение сохраняет доказательную силу утверждения Павла и естественно звучит по-русски.
- source_word: γὰρ
  choice: ибо
  rationale: Передаёт пояснительную связь с предыдущим стихом и соответствует достоинству аргументативного стиля послания.
- source_word: αὐτοῖς
  choice: о них
  rationale: При μαρτυρέω дательный падеж здесь обозначает тех, о ком даётся свидетельство, а не адресатов свидетельства.
- source_word: ζῆλον θεοῦ
  choice: рвение к Богу
  rationale: «Рвение» естественно передаёт ζῆλος, а «к Богу» отражает наиболее вероятное понимание родительного падежа как указания на объект этого рвения, не приписывая его самому Богу.
- source_word: ἔχουσιν
  choice: у них есть
  rationale: Прямо и естественно передаёт форму настоящего времени со значением обладания.
- source_word: ἀλλ’ οὐ κατ’ ἐπίγνωσιν
  choice: но не в соответствии со знанием
  rationale: Сохраняет конструкцию κατά с винительным падежом и не уточняет без необходимости, идёт ли речь о полном, истинном или надлежащем знании.
theological_decisions:
- issue: Характер рвения Израиля
  choice: рвение направлено к Богу, но не соответствует знанию
  alternative: «рвение Бога» либо неопределённое религиозное рвение
  rationale: Контекст признаёт искреннюю направленность к Богу, одновременно отрицая правильность лежащего в её основе понимания. Так сохраняется богословское напряжение текста без отождествления искренности с истинностью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. «Ибо» сохраняет логическую связь Павлова рассуждения; «рвение к Богу» понятнее современному читателю, чем традиционное, но архаичное «ревность по Боге».
