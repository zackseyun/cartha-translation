  terminology: «Рвение к Богу» удачно и не создаёт ложного впечатления, будто речь идёт о рвении, принадлежащем Богу. «Знание» сохраняет без доктринального уточнения возможный оттенок надлежащего, полного или действительного знания в ἐπίγνωσις.
