  source_fidelity: 'Передача основных элементов точна: μαρτυρῶ — «свидетельствую», дательный αὐτοῖς — «о них», а ζῆλον θεοῦ обоснованно передан как рвение, направленное к Богу. Однако «но не в соответствии со знанием» формально воспроизводит κατά, но в русском предложении неясно, к чему именно относится это обстоятельство; требуется явно соотнести отрицание с рвением.'
