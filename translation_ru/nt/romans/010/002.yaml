- from: Ибо я свидетельствую о них, что у них есть рвение к Богу[a], но не в соответствии со знанием[b].
  to: 'Ибо я свидетельствую о них: они проявляют рвение к Богу[a], но это рвение не основано на знании[b].'
  rationale: Переработана только русская формулировка для ясной и естественной связи между рвением и его недостатком знания. «Не основано на знании» передаёт смысл οὐ κατ’ ἐπίγνωσιν без добавления того, каким именно должно быть это знание. Сноска b сохраняет более буквальный вариант «не по знанию» и возможное значение полноты знания.
