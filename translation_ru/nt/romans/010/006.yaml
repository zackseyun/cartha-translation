  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: ru
  text: 'Но праведность от веры говорит так: «Не говори в своём сердце: „Кто взойдёт на небо?“» — то есть низвести Мессию.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «Христа». Здесь Павел отсылает ко Второзаконию 30:12 и применяет эти слова к Мессии.
    reason: Лексическая альтернатива и указание на ветхозаветную отсылку.
lexical_decisions:
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Основное русское соответствие в богословском контексте Послания к римлянам; сохраняет нравственный и судебно-заветный диапазон слова.
- source_word: ἐκ πίστεως
  choice: от веры
  rationale: Передаёт значение ἐκ и сохраняет контраст с праведностью, основанной на исполнении закона, в ближайшем контексте.
- source_word: οὕτως λέγει
  choice: говорит так
  rationale: Естественно по-русски и сохраняет олицетворение праведности как говорящего субъекта.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Не говори в своём сердце
  rationale: Близко передаёт формулировку цитаты и внутренний характер мысли или намерения.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Кто взойдёт на небо?
  rationale: «Взойдёт» соответствует возвышенному библейскому регистру ἀναβήσεται, оставаясь понятным современному читателю.
- source_word: Χριστόν
  choice: Мессию
  rationale: Здесь Χριστός выступает как титул в мессианском истолковании Писания, поэтому перевод раскрывает его значение.
- source_word: καταγαγεῖν
  choice: низвести
  rationale: Кратко передаёт направленное движение вниз и сохраняет торжественный регистр; подразумеваемый объект выражен словом «Мессию».
theological_decisions:
- issue: Олицетворение праведности от веры
  choice: 'Сохранено: «праведность от веры говорит так»'
  alternative: «Вот что говорится о праведности по вере»
  rationale: В греческом δικαιοσύνη является подлежащим при λέγει; олицетворение составляет часть риторического противопоставления Павла.
- issue: Значение Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном объяснении отрывка из Второзакония слово функционирует прежде всего как титул. В сноске отмечено буквальное греческое обозначение.
- issue: Связь пояснительного инфинитива с вопросом
  choice: «то есть чтобы низвести Мессию»
  alternative: «то есть свести Христа с неба»
  rationale: Сохранена сжатость греческого τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν без добавления отсутствующего в тексте «с неба», хотя направление ясно из контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранены олицетворение, внутренняя речь и сжатое пояснение Павла; добавления, снимающие неоднозначность, избегались.
