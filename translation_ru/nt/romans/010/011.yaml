id: ROM.10.11
reference: Romans 10:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: ru
  text: 'Ведь Писание говорит: «Всякий, кто верит в Него, не будет посрамлён».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не испытает стыда».'
    reason: 'Лексическая альтернатива: καταισχυνθήσεται может передавать как объективное посрамление, так и переживание стыда.'
lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время естественно передаётся обычной для цитирования формулой «Писание говорит».
- source_word: γὰρ
  choice: ведь
  rationale: Частица обосновывает предыдущее утверждение; «ведь» естественно сохраняет ход аргументации Павла.
- source_word: ἡ γραφή
  choice: Писание
  rationale: В формуле цитирования слово обозначает священное Писание, а не просто письменный текст.
- source_word: Πᾶς ὁ πιστεύων
  choice: всякий, кто верит
  rationale: Передаёт обобщающее и всеохватное значение конструкции, не придавая грамматическому мужскому роду исключительно мужского смысла.
- source_word: πιστεύων
  choice: верит
  rationale: Прямой и естественный русский эквивалент глагола πιστεύω; сочетание с «в Него» также выражает доверие и упование.
- source_word: ἐπ’ αὐτῷ
  choice: в Него
  rationale: При πιστεύω сочетание ἐπί с дательным указывает на направленную к личности веру и упование; по-русски это естественно выражается словами «верит в Него».
- source_word: καταισχυνθήσεται
  choice: не будет посрамлён
  rationale: Сохраняет будущее время и страдательный залог, а также оттенок окончательного публичного стыда или краха ожиданий в контексте цитаты из Исаии.
theological_decisions:
- issue: Обобщающее мужское выражение Πᾶς ὁ πιστεύων
  choice: всякий, кто верит
  alternative: каждый верующий
  rationale: Мужской род в греческом здесь имеет обобщающее, а не исключительно мужское значение. Формулировка сохраняет универсальный охват.
- issue: Референт αὐτῷ
  choice: Него
  alternative: Господа / Христа
  rationale: Местоимение сохранено без поясняющей подстановки имени, чтобы не расширять форму цитаты и не устранять связь, устанавливаемую контекстом.
- issue: Значение καταισχυνθήσεται
  choice: не будет посрамлён
  alternative: не постыдится
  rationale: Страдательная формулировка точнее сохраняет грамматическую форму и смысл Божьего оправдания уповающего; вариант «не постыдится» может восприниматься как описание внутреннего чувства.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. «Ведь» сохраняет аргументативную связь без архаичности; «посрамлён» несколько возвышенно, но понятно и точно передаёт страдательную форму.
