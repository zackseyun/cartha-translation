  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: ru
  text: 'И как им возвещать, если они не будут посланы? Как написано: «Как прекрасны[a] ноги тех, кто несёт благую весть о добром![b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «как желанны» или «как своевременны». Греческое слово может указывать не только на красоту, но и на желанный, уместный приход вестника.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тех, кто возвещает блага»; греческое выражение содержит слово «блага» во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: возвещать
  rationale: Глагол обозначает публичное провозглашение. «Возвещать» сохраняет широкий смысл и не ограничивает речь формальной проповедью.
- source_word: ἀποσταλῶσιν
  choice: не будут посланы
  rationale: Страдательная форма сохраняет зависимость вестников от того, кто их посылает; будущее время естественно передаёт греческий аорист конъюнктива после ἐὰν μή.
- source_word: καθὼς γέγραπται
  choice: Как написано
  rationale: Традиционная и естественная формула введения цитаты из Писания.
- source_word: ὡραῖοι
  choice: прекрасны
  rationale: Передаёт основной смысл красоты и приятности в контексте прихода вестника; оттенки желанности и своевременности отмечены в сноске.
- source_word: πόδες
  choice: ноги
  rationale: Сохранён конкретный образ из цитаты, обозначающий прибытие вестников.
- source_word: εὐαγγελιζομένων
  choice: тех, кто несёт благую весть
  rationale: Выражение естественно для образа прибывающих вестников и не вносит более позднюю церковную терминологию.
- source_word: τὰ ἀγαθά
  choice: о добром
  rationale: Передаёт субстантивированное «благое, доброе» и сохраняет отличие этой фразы от самого действия благовествования, не создавая неестественного русского сочетания «добрые вещи».
theological_decisions:
- issue: Связь цитаты о вестниках с возвещением Евангелия
  choice: Сохранить широкий образ посланных вестников, приносящих благую весть.
  alternative: Передать оба глагола как «проповедовать» и тем самым теснее связать стих с формальным церковным служением.
  rationale: Контекст говорит о возвещении и посланничестве, но сама цитата прославляет приход носителей благой вести и не называет определённой церковной должности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. «Возвещать» и «несёт благую весть» различают публичное провозглашение в первой части и образ прибывающего вестника во второй; синтаксис остаётся ясным для широкого круга читателей.
