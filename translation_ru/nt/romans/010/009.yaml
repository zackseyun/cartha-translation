  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: ru
  text: Ведь если ты устами исповедуешь, что Иисус — Господь[a], и сердцем веришь, что Бог воскресил Его из мёртвых, то будешь спасён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исповедуешь Иисуса как Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: В контексте вводит основание предшествующего утверждения; причинное «потому что» естественно передаёт связь.
- source_word: ἐὰν
  choice: если
  rationale: Обычная условная частица при сослагательном наклонении; в русском естественно передаётся союзом «если».
- source_word: ὁμολογήσῃς
  choice: исповедуешь
  rationale: Сохраняет смысл открытого словесного признания веры и верности, не сводя его к нейтральному «признаешь».
- source_word: ἐν τῷ στόματί σου
  choice: устами
  rationale: Естественный и достойный русский эквивалент инструментального оборота, обозначающего словесное исповедание.
- source_word: κύριον Ἰησοῦν
  choice: что Иисус — Господь
  rationale: Явно выражает содержание исповедания и сохраняет предикативный смысл κύριον, не превращая сочетание в одно лишь титульное именование.
- source_word: πιστεύσῃς
  choice: веришь
  rationale: Прямо передаёт значение глагола в конструкции с придаточным содержания.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: сердцем
  rationale: Инструментальное «сердцем» естественно по-русски передаёт внутреннюю, искреннюю убеждённость и сохраняет параллель с «устами».
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Бог воскресил Его
  rationale: «Воскресил» — устойчивый русский глагол для действия Бога, возвратившего Иисуса к жизни; аорист передан прошедшим временем.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устоявшееся и точное библейское выражение воскресения из числа умерших.
- source_word: σωθήσῃ
  choice: будешь спасён
  rationale: Будущее страдательное в контексте спасения прямо и естественно передаётся этой формой.
theological_decisions:
- issue: Передача κύριος в формуле исповедания
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет значение верховной власти и библейские отзвуки ближайшего контекста, не сужая смысл до «господина» или «владыки».
- issue: Синтаксическая форма κύριον Ἰησοῦν
  choice: что Иисус — Господь
  alternative: Иисуса Господом
  rationale: Основной вариант ясно выражает содержание исповедания. Альтернатива грамматически возможна и отмечена в сноске, поскольку греческая конструкция допускает более компактную передачу.
- issue: Смысл σωθήσῃ
  choice: будешь спасён
  alternative: будешь избавлен
  rationale: Контекст Послания к римлянам говорит о спасении; «избавлен» было бы шире и могло бы ослабить сотериологическую силу выражения.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и узнаваемой библейской лексики. Единственное число «ты» следует греческим формам второго лица. Параллель «устами… сердцем» передана компактно и естественно; прописная буква в «Его» соответствует принятому благоговейному русскому библейскому оформлению, не добавляя нового содержания.
