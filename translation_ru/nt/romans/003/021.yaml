id: ROM.3.21
reference: Romans 3:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: ru
  text: Но теперь независимо от закона явлена праведность Божья[a], о которой свидетельствуют Закон и Пророки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость Божья»; возможно также: «праведность от Бога».'
    reason: 'Слово δικαιοσύνη может обозначать праведность или справедливость, а форма θεοῦ допускает понимание источника: «от Бога».'
  - marker: b
    text: «Закон и Пророки» — принятое обозначение Писания, то есть ветхозаветного свидетельства.
    reason: Поясняет каноническое значение устойчивого выражения.
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Но теперь
  rationale: Передаёт и временной смысл νυνί, и резкий контраст, вводимый δέ, естественным современным русским оборотом.
- source_word: χωρὶς νόμου
  choice: независимо от закона
  rationale: χωρίς обозначает отдельность, обособленность. Формулировка передаёт явление праведности вне действия закона, не создавая неестественного русского оборота «без закона»; строчная буква сохраняет возможность слышать как Моисеев закон, так и более общий оттенок слова в аргументации Павла.
- source_word: δικαιοσύνη θεοῦ
  choice: праведность Божья
  rationale: '«Праведность» — устойчивый и ёмкий русский эквивалент δικαιοσύνη. Притяжательная конструкция сохраняет неоднозначность генитива θεοῦ: речь может идти о Божьей собственной праведности и спасительном действии, не исключая смысла праведности, исходящей от Бога.'
- source_word: πεφανέρωται
  choice: явлена
  rationale: Перфект указывает на совершившееся обнаружение с сохраняющимся результатом. Краткая форма «явлена» звучит торжественно, но современно, и близко передаёт пассивное «стала явной».
- source_word: μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: о которой свидетельствуют Закон и Пророки
  rationale: Естественная русская активная конструкция точно передаёт пассивное причастие и сохраняет смысл продолжающегося свидетельства. Заглавные буквы обозначают устойчивое наименование Писания — «Закон и Пророки».
theological_decisions:
- issue: Значение генитива в δικαιοσύνη θεοῦ
  choice: праведность Божья
  alternative: праведность от Бога; Божья справедливость
  rationale: Основной текст не сводит выражение исключительно к источнику дара или исключительно к качеству Бога, а сохраняет значимую для Павла богословскую многозначность.
- issue: Соотношение праведности и закона
  choice: независимо от закона
  alternative: без закона; отдельно от закона
  rationale: 'Перевод сохраняет парадокс: праведность явлена независимо от закона, однако именно Закон и Пророки свидетельствуют о ней. Эта напряжённость не устраняется поясняющим толкованием.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для обычного читателя; при этом сохранены контраст «но теперь», богословская неоднозначность выражения «праведность Божья» и парадокс её независимости от закона при свидетельстве Закона и Пророков.
