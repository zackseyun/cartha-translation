source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: ru
  text: праведность Бога[a] через веру в Иисуса Мессию[b] для всех верующих, ибо нет различия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «через верность Иисуса Мессии — для всех верующих».'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη θεοῦ
  choice: праведность Бога
  rationale: 'Сохраняет прямую генитивную конструкцию и смысловую широту выражения: речь может идти о Божьей праведности, Его праведном действии и даруемом Им праведном положении. Вариант «справедливость Бога» отмечен в сноске.'
- source_word: διὰ πίστεως
  choice: через веру
  rationale: Обычный и естественный русский эквивалент, сохраняющий богословски значимое понятие πίστις.
- source_word: Ἰησοῦ Χριστοῦ
  choice: в Иисуса Мессию
  rationale: 'В основном тексте спорный генитив истолкован объектно: вера направлена на Иисуса. Χριστός передано как титул «Мессия», а русская падежная форма обеспечивает естественность выражения.'
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: для всех верующих
  rationale: Естественно передаёт направленность и всеобщий охват греческой фразы, сохраняя причастное значение τοὺς πιστεύοντας.
- source_word: διαστολή
  choice: различия
  rationale: В данном контексте обозначает отсутствие различия между группами людей перед Богом; форма единственного числа соответствует греческому тексту.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: веру в Иисуса Мессию
  alternative: верность Иисуса Мессии
  rationale: Генитив допускает как объектное понимание («вера в Иисуса»), так и субъектное («верность Иисуса»). В основном тексте дано более распространённое объектное прочтение, а подлинная неоднозначность сохранена в сноске.
- issue: δικαιοσύνη θεοῦ
  choice: праведность Бога
  alternative: справедливость Бога
  rationale: «Праведность» лучше сохраняет традиционный и широкий павловский смысл, не сводя выражение только к судебной справедливости; возможный оттенок справедливости указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Начальная строчная буква отражает синтаксическое продолжение мысли предыдущего стиха. Тире естественно связывает раскрытие адресатов с предшествующим выражением и избегает тяжеловесной запятой.
