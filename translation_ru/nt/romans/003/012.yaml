source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: ru
  text: Все уклонились, все вместе стали негодными[a]. Нет делающего добро[b], нет ни одного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали бесполезными»; возможно также: «испортились».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «творящего благость»; слово χρηστότητα может также означать доброту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Все
  rationale: Сохраняет всеобщий охват греческого множественного числа, не добавляя отсутствующего в тексте существительного.
- source_word: ἐξέκλιναν
  choice: уклонились
  rationale: Естественно передаёт нравственное отступление и соответствует образу отклонения от верного пути.
- source_word: ἅμα
  choice: все вместе
  rationale: 'Передаёт собирательный смысл: все без исключения оказались в одном состоянии.'
- source_word: ἠχρεώθησαν
  choice: стали негодными
  rationale: Сохраняет результативный смысл аориста и сильную отрицательную оценку; слово может также означать бесполезность или испорченность.
- source_word: ποιῶν
  choice: делающего
  rationale: Причастная конструкция близко воспроизводит греческую форму и естественно сочетается с безличным «нет».
- source_word: χρηστότητα
  choice: добро
  rationale: Ясно передаёт общий нравственный смысл, при этом в сноске сохраняется возможный оттенок доброты или благости.
- source_word: οὐκ ἔστιν
  choice: нет
  rationale: Краткая и естественная современная русская конструкция, сохраняющая категорическое отрицание.
- source_word: ἕως ἑνός
  choice: ни одного
  rationale: 'Передаёт идиоматическое усиление заключительной фразы: исключений нет.'
theological_decisions:
- issue: Всеобщность нравственного отступления
  choice: «Все… нет ни одного»
  alternative: Конкретизировать как «все люди»
  rationale: Текст подчёркивает универсальность утверждения, но существительное «люди» в греческом отсутствует; перевод сохраняет и охват, и лаконичность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмической краткостью цитируемого ветхозаветного текста. Повтор «все» делает собирательную силу ἅμα явной; «нет ни одного» сохраняет заключительное усиление.
