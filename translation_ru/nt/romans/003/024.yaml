  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: ru
  text: получая оправдание даром, по Его благодати, через искупление в Иисусе Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Христе Иисусе».'
    reason: Традиционный русский эквивалент титула Χριστός.
lexical_decisions:
- source_word: δικαιούμενοι
  choice: получая оправдание
  rationale: Настоящее страдательное причастие сохраняется как деепричастный оборот, связанный с предыдущим стихом. Формулировка передаёт действие Бога и стандартный для Павла смысл оправдания, не сводя его без пояснения к одной интерпретационной формуле.
- source_word: δωρεὰν
  choice: даром
  rationale: 'Наречие обозначает безвозмездность оправдания: оно даётся как дар, а не заслуживается.'
- source_word: τῇ αὐτοῦ χάριτι
  choice: по Его благодати
  rationale: «Благодать» — укоренившийся и точный эквивалент χάρις в данном контексте; предлог «по» естественно выражает основание или источник.
- source_word: ἀπολυτρώσεως
  choice: искупление
  rationale: «Искупление» сохраняет смысл освобождения ценой выкупа и является понятным библейско-богословским термином.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Χριστός здесь сохраняет титульное значение; «Мессия» передаёт его смысл, а не просто транслитерирует традиционную форму.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: которое — в Иисусе Мессии
  rationale: Оборот относится к «искуплению» и сохраняет ёмкую греческую формулу ἐν, не подменяя её более узким толкованием вроде «совершённого» или «обретённого».
theological_decisions:
- issue: Язык оправдания у Павла
  choice: получая оправдание
  alternative: будучи признаны праведными
  rationale: Основной вариант сохраняет традиционный юридико-заветный термин и пассивный смысл Божьего действия. Альтернатива допустима как пояснение, но в основном тексте сильнее сужала бы многозначность δικαιόω.
- issue: Значение ἐν в выражении ἐν Χριστῷ Ἰησοῦ
  choice: в Иисусе Мессии
  alternative: обретённое в Иисусе Мессии
  rationale: Буквально-естественная формула сохраняет богословскую ёмкость связи искупления с Мессией и не уточняет без необходимости способ этой связи.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Деепричастная конструкция намеренно сохраняет синтаксическую связь с Рим. 3:23; прописное «Его» соответствует распространённой русской издательской традиции при указании на Бога.
