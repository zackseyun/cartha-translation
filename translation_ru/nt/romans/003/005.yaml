id: ROM.3.5
reference: Romans 3:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: ru
  text: Но если наша неправедность показывает праведность Бога[a], что скажем? Неужели Бог несправедлив, обрушивая гнев? (Я говорю по-человечески.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наша несправедливость показывает справедливость Бога».'
    reason: Лексическая альтернатива для ἀδικία и δικαιοσύνη, сохраняющая их судебно-правовой оттенок.
lexical_decisions:
- source_word: ἀδικία
  choice: неправедность
  rationale: Сохраняет нравственный и богословский контраст с δικαιοσύνη; контекстуально возможное «несправедливость» дано в сноске.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Передаёт обычное для Павла широкое значение слова, не сужая его исключительно до судебной справедливости; вариант «справедливость» сохранён в сноске.
- source_word: συνίστησιν
  choice: показывает
  rationale: Естественно передаёт значение «делает очевидным, обнаруживает» без излишне сильного оттенка формального доказательства.
- source_word: μὴ ἄδικος
  choice: Неужели Бог несправедлив
  rationale: Частица μή предполагает отрицательный ответ; русское «неужели» естественно сохраняет риторическую направленность вопроса.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: когда обрушивает гнев
  rationale: Передаёт действие Бога как наведение гнева или кары, не добавляя отсутствующего в греческом тексте притяжательного местоимения.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Я говорю по-человечески
  rationale: Кратко и идиоматично передаёт оговорку Павла о человеческом способе рассуждения.
theological_decisions:
- issue: Риторический вопрос о справедливости Бога в суде
  choice: «Неужели Бог несправедлив, когда обрушивает гнев?»
  alternative: «Разве Бог несправедлив, обрушивая гнев?»
  rationale: «Неужели» сохраняет ожидаемый отрицательный ответ, обозначенный μή, но не устраняет напряжение самого возражения и не превращает его в прямое утверждение.
- issue: Соотношение праведности и справедливости
  choice: В основном тексте «неправедность / праведность»
  alternative: «несправедливость / справедливость»
  rationale: Основной вариант сохраняет широкий нравственно-реляционный смысл противопоставления у Павла, а судебно-правовой оттенок не отвергается и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаизмов. Скобки сохранены как авторская оговорка. Риторическая сила μή передана словом «неужели».
