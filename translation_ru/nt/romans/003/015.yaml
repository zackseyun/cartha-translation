  rationale: Прямой перевод сохраняет телесный образ и естественно передаёт принадлежность, выраженную родительным местоимением.
- source_word: ἐκχέαι
  choice: на пролитие
  rationale: Глагол буквально означает «излить»; в сочетании с кровью русское «пролитие крови» является устойчивым и точным соответствием.
- source_word: αἷμα
