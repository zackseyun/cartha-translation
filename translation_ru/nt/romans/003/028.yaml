lexical_decisions:
- source_word: λογιζόμεθα
  choice: мы считаем
  rationale: Глагол выражает обоснованное суждение, к которому Павел приходит в ходе рассуждения. «Мы считаем» естественно звучит по-русски и не ослабляет аргументативный характер высказывания.
- source_word: γάρ
  choice: итак
  rationale: В данном контексте частица связывает стих с предшествующим рассуждением и вводит итоговый вывод. Русское «итак» естественно передаёт эту функцию, хотя греческое γάρ нередко имеет пояснительное значение «ведь» или «ибо».
- source_word: δικαιοῦσθαι
  choice: оправдывается
  rationale: Традиционный и точный термин в контексте Павлова рассуждения; пассивная форма сохраняет представление о действии, совершаемом над человеком, не уточняя здесь деятеля.
- source_word: πίστει
  choice: верой
  rationale: Творительный падеж естественно передаёт средство или основание, выраженное греческим дательным, и сохраняет богословски значимый термин «вера».
- source_word: ἄνθρωπον
  choice: человек
  rationale: Существительное употреблено родовым образом и относится к человеку вообще, а не только к мужчине. Русское «человек» точно сохраняет этот общий смысл.
- source_word: χωρὶς
  choice: независимо от
  rationale: Оборот ясно передаёт исключение дел закона из основания оправдания. Он естественен в современном литературном русском и сохраняет противопоставление веры и дел.
- source_word: ἔργων νόμου
  choice: дел закона
  rationale: Формулировка сохраняет устойчивое Павлово выражение и его связь с понятием закона, не сужая смысл до добрых поступков вообще или лишь отдельных предписаний.
theological_decisions:
- issue: Смысл δικαιοῦσθαι в Павловом употреблении
  choice: оправдывается
  alternative: признаётся праведным
  rationale: Основной текст сохраняет традиционный судебно-богословский термин, а примечание поясняет возможный декларативный оттенок, не сводя многозначность глагола к одному толкованию.
- issue: Родовое значение ἄνθρωπον
  choice: человек
  alternative: мужчина
  rationale: Контекст говорит о любом человеке. Русское слово «человек» грамматически мужского рода, но семантически универсально и не создаёт ненужного ограничения по полу.
- issue: Связь оправдания с делами закона
  choice: независимо от дел закона
  alternative: без дел закона
  rationale: Перевод сохраняет категорическое разграничение, выраженное χωρὶς, но не уточняет сверх текста, о каких именно аспектах закона или видах дел идёт речь.
translation_notes:
  register: Современный литературный русский язык, краткий и аргументативный. Сохранена традиционная богословская лексика («оправдывается», «вера», «дела закона»), при этом синтаксис остаётся понятным широкому читателю.
