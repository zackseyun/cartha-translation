  rationale: Обозначает тяжёлое страдание и несчастье; в данной паре звучит естественно и сохраняет объективный оттенок постигшего людей бедствия.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: на путях их
  rationale: Сохраняет конкретный образ дороги и одновременно допускает переносный смысл образа жизни и поступков. Постпозиция местоимения поддерживает достоинство и краткость библейской формулы без архаической грамматики.
- source_word: καὶ
  choice: и
  rationale: Обычный соединительный союз между двумя однородными существительными.
