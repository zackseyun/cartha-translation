lexical_decisions:
- source_word: τάφος
  choice: могила
  rationale: Естественное современное соответствие, сохраняющее образ смерти и разложения; «гробница» звучала бы более архитектурно и книжно.
- source_word: ἀνεῳγμένος
  choice: открытая
  rationale: Причастие перфекта передаёт состояние, возникшее в результате открытия; по-русски это естественно выражается сочетанием «открытая могила».
- source_word: λάρυγξ
  choice: горло
  rationale: Ясное и обычное русское соответствие, сохраняющее телесный образ исходного текста.
- source_word: ἐδολιοῦσαν
  choice: обманывали
  rationale: Имперфект указывает на продолжительное или повторяющееся действие; форма прошедшего времени сохраняет этот аспект и согласуется с греческим текстом цитаты.
- source_word: ἰὸς
  choice: яд
  rationale: В контексте ядовитых змей русское «яд» точно и естественно; отдельного общеупотребительного эквивалента английскому различию poison/venom русский не требует.
- source_word: ἀσπίδων
  choice: гадюк
  rationale: Точное определение конкретного вида древнегреческого ἀσπίς не вполне уверенно; «гадюки» естественно передаёт образ ядовитых змей, не навязывая спорной видовой идентификации.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: под их губами
  rationale: Прямой и естественный перевод, сохраняющий яркий телесный образ.
