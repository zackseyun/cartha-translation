  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: ru
  text: Его Бог представил как искупительную жертву[a] через веру в Его кровь[b], чтобы показать Свою праведность[c] ввиду оставления без наказания прежде совершённых грехов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как умилостивление»; возможно также: «как место умилостивления» — то есть как крышку ковчега завета, которую окропляли кровью в обряде очищения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «через веру, посредством Его крови». Греческий оборот допускает понимание как «через веру в Его кровь», так и указание на кровь как на средство искупления.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «Свою справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: представил
  rationale: Передаёт действие Бога, Который открыто явил или выставил Христа перед людьми; русский глагол естественен и не сводит значение к одному лишь предвечному замыслу.
- source_word: ἱλαστήριον
  choice: искупительную жертву
  rationale: Доступно передаёт жертвенный и устраняющий грех смысл, не закрепляя в основном тексте исключительно идею умилостивления; предметное значение «место умилостивления / крышка ковчега» сохранено в сноске.
- source_word: διὰ πίστεως
  choice: через веру
  rationale: Сохраняет обычное для πίστις значение и посредствующую конструкцию διά с родительным падежом.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: в Его кровь
  rationale: 'В основном тексте фраза отнесена к вере: «через веру в Его кровь». Возможная инструментальная связь — «Его кровью» — вынесена в сноску.'
- source_word: εἰς ἔνδειξιν
  choice: чтобы показать
  rationale: Естественно выражает целевую силу оборота и сохраняет идею явного доказательства или обнаружения.
- source_word: δικαιοσύνης
  choice: праведность
  rationale: Передаёт широкий павловский смысл δικαιοσύνη; возможный акцент на Божьей справедливости отмечен в сноске.
- source_word: πάρεσιν
  choice: оставлял без наказания
  rationale: Отражает временное оставление или пропущение прежних грехов и не смешивает πάρεσις с полным прощением.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: прежде совершённые грехи
  rationale: Ясно и естественно передаёт временную предшественность причастия προγεγονότων.
theological_decisions:
- issue: Значение ἱλαστήριον
  choice: искупительная жертва
  alternative: умилостивление; место умилостивления (крышка ковчега)
  rationale: Контекст допускает жертвенное, направленное на устранение греха прочтение, но форма слова также вызывает связь с крышкой ковчега, окропляемой кровью. Основной текст остаётся понятным, а конкурирующие оттенки не скрыты.
- issue: Синтаксическая связь διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι
  choice: через веру в Его кровь
  alternative: через веру, Его кровью
  rationale: Основной вариант понимает кровь Христа как объект веры; сноска сохраняет возможность считать кровь средством искупительного действия.
- issue: Смысл δικαιοσύνη применительно к Богу
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет более широкий богословский диапазон слова, тогда как «справедливость» точнее выражает судебный оттенок, возможный в данном контексте.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю, с достоинством библейского стиля. Местоимения, относящиеся к Богу и Христу, написаны с прописной буквы. Порядок фразы слегка перестроен ради естественности, при этом богословски значимые неоднозначности отмечены сносками.
