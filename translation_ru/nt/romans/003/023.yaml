lexical_decisions:
- source_word: πάντες
  choice: все
  rationale: Кратко и точно передаёт всеобщий охват греческого слова в контексте, не добавляя отсутствующего в тексте существительного.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно для современного русского языка выражает пояснительную связь с предшествующим рассуждением Павла.
- source_word: ἥμαρτον
  choice: согрешили
  rationale: Совершенный вид передаёт суммарно констатируемый факт греха всех людей; русская форма прошедшего времени не требует искусственного уточнения временного оттенка аориста.
- source_word: ὑστεροῦνται
  choice: лишены
  rationale: Передаёт продолжающееся состояние недостатка или отсутствия; форма настоящего времени сохраняет контраст с предшествующим аористом. Возможный оттенок «не достигают» отмечен в сноске.
- source_word: δόξης
  choice: славы
  rationale: «Слава» — точный, укоренённый и богословски открытый эквивалент δόξα, сохраняющий многозначность выражения.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Прямо передаёт родительный падеж и не решает заранее, означает ли выражение собственную славу Бога, славу от Бога или славу, предназначенную людям.
theological_decisions:
- issue: Значение выражения «слава Бога»
  choice: Сохранено нейтральное «слава Бога» без поясняющего расширения.
  alternative: «слава, даруемая Богом»; «слава, которую люди должны были отражать»; «собственная слава Бога»
  rationale: Греческий генитив допускает несколько смысловых связей. Основной текст сохраняет эту богословскую напряжённость, а возможные понимания перечислены в сноске.
- issue: Смысл ὑστεροῦνται в отношении славы
  choice: «лишены»
  alternative: «не достигают»; «им недостаёт»
  rationale: Глагол обозначает недостаток, нехватку или недостижение. «Лишены» естественно передаёт наличное состояние, не уточняя его причину; альтернативы приведены в сноске.
translation_notes:
  register: 'Современный литературный русский язык, краткий и достойный по тону. «Ведь» естественнее русского «ибо» и сохраняет пояснительную функцию γάρ. Порядок сносок соответствует месту смысловых вопросов: сначала значение глагола, затем многозначность выражения «слава Бога».'
