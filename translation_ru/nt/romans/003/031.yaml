  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: ru
  text: Итак, не упраздняем ли мы закон верой? Ни в коем случае! Напротив, мы утверждаем закон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устанавливаем закон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: закон
  rationale: В контексте Послания к римлянам речь идёт об определённом понятии Закона, прежде всего Торы; русский язык не требует артикля.
- source_word: οὖν
  choice: итак
  rationale: Передаёт выводный характер риторического вопроса и естественно связывает его с предшествующим рассуждением.
- source_word: καταργοῦμεν
  choice: упраздняем
  rationale: Передаёт идею лишения силы или действенности и образует ясный контраст с «утверждаем», не ограничивая смысл формальной отменой.
- source_word: διὰ τῆς πίστεως
  choice: верой
  rationale: Творительный падеж естественно передаёт инструментальное значение διά с родительным и сохраняет ключевой для контекста термин «вера».
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Современное, сильное и достойное по стилю категорическое отрицание, соответствующее силе греческой формулы.
- source_word: ἀλλὰ
  choice: Напротив
  rationale: Ясно выражает резкое исправляющее противопоставление.
- source_word: ἱστάνομεν
  choice: утверждаем
  rationale: Сохраняет широкий смысл «ставить прочно, утверждать, поддерживать силу» и хорошо противопоставляется глаголу «упразднять».
theological_decisions:
- issue: Соотношение веры и закона
  choice: «мы утверждаем закон»
  alternative: «мы поддерживаем силу закона» / «мы упрочиваем закон»
  rationale: Греческое ἱστάνομεν допускает значения «утверждаем», «подтверждаем», «поддерживаем». Формулировка не уточняет сверх текста, каким именно образом вера утверждает закон, и потому сохраняет богословское напряжение аргумента Павла.
translation_notes:
  register: Современный литературный русский язык с риторической силой оригинала. Синтаксис краток и достоин; категорическое отрицание передано естественной современной формулой.
