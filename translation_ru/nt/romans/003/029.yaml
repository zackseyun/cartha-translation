  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: ru
  text: Или Бог — Бог только иудеев? Разве Он не Бог и других народов? Да, и других народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит следующую риторическую альтернативу в рассуждении Павла и естественно связывает стих с предшествующим контекстом.
- source_word: Ἰουδαίων
  choice: иудеев
  rationale: Родительный падеж непосредственно зависит от слова «Бог»; это точное и привычное обозначение еврейского народа в новозаветном контексте.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Стандартная передача θεός; во втором вопросе слово повторено по-русски для ясности подразумеваемого греческого сказуемого.
- source_word: μόνον
  choice: только
  rationale: Прямо передаёт исключительное значение и сохраняет силу риторического вопроса.
- source_word: οὐχὶ
  choice: Разве Он не
  rationale: Передаёт вопрос, предполагающий утвердительный ответ, естественными средствами современного русского языка.
- source_word: ἐθνῶν
  choice: других народов
  rationale: В противопоставлении иудеям обозначает нееврейские народы. Такая передача яснее современному читателю, чем конфессионально окрашенное или менее общеупотребительное «язычники», и сохраняет множественное число исходного текста.
- source_word: ναὶ
  choice: Да
  rationale: Кратко и точно передаёт прямой утвердительный ответ.
- source_word: καὶ
  choice: и; тоже
  rationale: Передаёт включение нееврейских народов наряду с иудеями; в заключительной фразе «тоже» звучит естественно и сохраняет добавочное значение.
theological_decisions:
- issue: Передача ἐθνῶν в противопоставлении Ἰουδαίων
  choice: других народов
  alternative: язычников / народов
  rationale: Контекст указывает на все нееврейские народы, а не на государства и не обязательно на людей, характеризуемых их религиозными верованиями. Слово «других» ясно выражает подразумеваемое противопоставление иудеям, не добавляя конфессионального истолкования.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный. Риторическая структура оригинала сохранена: два вопроса и краткий утвердительный ответ. Местоимение «Он» употреблено для естественности русского вопроса.'
