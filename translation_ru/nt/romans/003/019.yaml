  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: ru
  text: 'Мы знаем: всё, что гласит закон, он говорит тем, кто под законом[a], чтобы все уста умолкли[b] и весь мир оказался под судом Бога[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тем, кто в законе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы все уста были заграждены», то есть чтобы никто не мог возражать или оправдываться.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стал подотчётен Богу», «подлежал Божьему суду»; возможное, но более сильное выражение: «стал виновен перед Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Мы знаем
  rationale: Настоящее время передаёт общее, признанное знание. Частица δέ здесь служит связке с предыдущим рассуждением; отдельное «но» могло бы создать в русском тексте излишне резкое противопоставление.
- source_word: ὅσα ὁ νόμος λέγει
  choice: всё, что гласит закон
  rationale: «Гласит» естественно употребляется по-русски о нормативном тексте и позволяет сохранить различие между λέγει и последующим λαλεῖ.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: тем, кто под законом
  rationale: Буквально выражение означает «тем, кто в законе», но в данном контексте указывает на людей, находящихся в сфере действия и власти закона. Основной текст передаёт это естественным русским оборотом, а буквальная форма отмечена в сноске.
- source_word: λαλεῖ
  choice: говорит
  rationale: Сохраняется образ закона как говорящего и словесное отличие от переданного глаголом «гласит» λέγει.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результирующее значение греческого союза, не устраняя возможного смыслового напряжения между ними.
- source_word: πᾶν στόμα φραγῇ
  choice: чтобы всякие уста умолкли
  rationale: Сохранён конкретный образ уст, тогда как естественный русский глагол передаёт прекращение всяких возражений или самооправдания. Более буквальный пассив приведён в сноске.
- source_word: ὑπόδικος
  choice: под судом
  rationale: 'Передаёт судебный смысл: мир подотчётен Богу и подлежит Его суду. Формулировка не усиливается до уже вынесенного приговора о виновности.'
- source_word: γένηται
  choice: оказался
  rationale: Передаёт переход в явное положение под Божьим судом, выраженный формой γένηται, и естественно звучит в современном русском языке.
- source_word: πᾶς ὁ κόσμος
  choice: весь мир
  rationale: Сохраняет всеобщий охват высказывания.
- source_word: τῷ θεῷ
  choice: Бога
  rationale: В сочетании «под судом Бога» русская родительная конструкция естественно передаёт дательный объект, перед которым или которому мир подотчётен.
theological_decisions:
- issue: Судебная сила слова ὑπόδικος
  choice: весь мир оказался под судом Бога
  alternative: весь мир стал виновен перед Богом; весь мир стал ответчиком перед Богом
  rationale: Выбранная формулировка сохраняет образ Божьего суда и всеобщую подотчётность, но не превращает само прилагательное ὑπόδικος в более определённое указание на уже вынесенный обвинительный приговор.
- issue: Круг тех, к кому обращается закон
  choice: тем, кто под законом
  alternative: тем, кто в законе
  rationale: Основной текст обозначает нахождение под властью закона, не сужая адресатов до какой-либо поздней конфессиональной категории; буквальная неоднозначность греческого оборота сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Судебная образность сохранена без архаизмов «пред Богом» и «да заградятся». Повтор греческих λέγει/λαλεῖ передан различными русскими глаголами «гласит» и «говорит».
