lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Прямой сочинительный союз сохраняет связь с продолжающейся цепью обвинений в цитатной подборке Павла.
- source_word: ὁδὸν
  choice: пути
  rationale: «Путь» естественно передаёт как образ дороги, так и переносный смысл образа жизни или направления поступков.
- source_word: εἰρήνης
  choice: мира
  rationale: «Мир» — обычный и ясный эквивалент εἰρήνη; родительный падеж характеризует путь как ведущий к миру или отмеченный миром, не устраняя этой смысловой широты.
- source_word: ἔγνωσαν
  choice: не познали
  rationale: Аорист передан совершенным видом в прошедшем времени. «Не познали» сохраняет смысл отсутствия подлинного знакомства и распознавания, оставаясь уместным в возвышенном, но понятном библейском регистре.
theological_decisions:
- issue: Смысл сочетания ὁδὸν εἰρήνης
  choice: путь мира
  alternative: путь к миру
  rationale: Родительная конструкция допускает характеристику пути миром и направленность к миру. Формулировка «путь мира» сохраняет эту неоднозначность и не сужает её до одной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов «пути мира они не познали» сохраняет акцент на объекте и ритм краткого обвинительного высказывания.
