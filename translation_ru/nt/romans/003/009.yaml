id: ROM.3.9
reference: Romans 3:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: ru
  text: Итак, что же? Есть ли у нас преимущество? Нисколько[a]. Ведь мы уже обвинили и иудеев, и греков в том, что все они находятся под властью греха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве мы лучше? Ни в коем случае».'
    reason: alternative_reading
  - marker: b
    text: 'Букв.: «под грехом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Итак, что же?
  rationale: Кратко и естественно передаёт вопрос и сохраняет выводное значение οὖν в ходе рассуждения Павла.
- source_word: προεχόμεθα
  choice: Есть ли у нас преимущество?
  rationale: Глагол допускает разные толкования; в контексте Рим 3:1–9 речь идёт о сравнительном положении иудеев. Формулировка естественна по-русски и не утверждает, будто прежние преимущества вообще отсутствуют.
- source_word: οὐ πάντως
  choice: Нисколько
  rationale: Передаёт решительное отрицание кратко и современно.
- source_word: προῃτιασάμεθα
  choice: мы уже обвинили
  rationale: Сохраняет судебно-обвинительный оттенок глагола и указание на ранее выдвинутое обвинение.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: и иудеев, и греков
  rationale: Передаёт парную конструкцию τε καὶ и сохраняет исходное обозначение «греки», не заменяя его более широким толкованием «язычники».
- source_word: πάντας
  choice: все они
  rationale: Ясно относит всеобщность к обеим названным группам.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: находятся под властью греха
  rationale: Раскрывает метафору подчинения, выраженную ὑπό с винительным падежом, сохраняя грех как господствующую силу.
theological_decisions:
- issue: Смысл первого лица множественного числа в προεχόμεθα
  choice: «Есть ли у нас преимущество?» — вопрос о сравнительном положении иудеев.
  alternative: «Разве мы лучше?» — вопрос о нравственном превосходстве.
  rationale: Контекст связан как с преимуществом иудеев (3:1–2), так и с общей виновностью (3:9). Основной текст сохраняет тему преимущества, а сноска отмечает возможный смысл нравственного превосходства.
- issue: Смысл выражения ὑφ’ ἁμαρτίαν
  choice: «под властью греха»
  alternative: «под грехом»
  rationale: Выбранный вариант естественнее в современном русском и выражает подчинение греху, не сводя фразу только к наличию вины; более буквальный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский; аргументативный и судебный оттенок сохранён. «Иудеи» и «греки» оставлены в соответствии с греческим текстом. Конечная точка поставлена по нормам отдельной цитаты, хотя стих в исходном контексте продолжается.
