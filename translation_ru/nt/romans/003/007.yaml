  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: ru
  text: Но если Божья правдивость[a] через мою ложь[b] стала ещё очевиднее во славу Его[c], то почему же и я всё ещё подвергаюсь суду как грешник?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истина Бога»; «Божья истина».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в моей лжи»; «посредством моей лжи».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к Его славе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: верность Бога
  rationale: В контексте Рим. 3:4–7 выражение противопоставлено человеческой лжи и обозначает правдивость и надёжность Бога. «Верность Бога» естественно передаёт личностно-нравственный оттенок, не исключая более общего смысла истины.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: благодаря моей лжи
  rationale: Предлог ἐν здесь вероятнее всего указывает на средство или обстоятельство, посредством которого Божья верность становится заметнее; «благодаря» естественно передаёт парадоксальную логику возражения.
- source_word: ψεύσματι
  choice: лжи
  rationale: Прямой и общеупотребительный русский эквивалент, сохраняющий контраст с Божьей верностью.
- source_word: ἐπερίσσευσεν
  choice: проявилась ещё полнее
  rationale: Глагол выражает изобилие или умножение. В сочетании с абстрактным качеством русская формулировка «проявилась ещё полнее» звучит естественно и передаёт мысль о более явном обнаружении Божьей верности.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: к Его славе
  rationale: Сохраняет направительный оттенок εἰς и намеренную двусмысленность результата или цели.
- source_word: τί ἔτι
  choice: почему же ... всё ещё
  rationale: Передаёт риторическое усиление τί и временной оттенок продолжающегося действия в ἔτι.
- source_word: κἀγὼ
  choice: и я
  rationale: Сохраняет добавочное значение καί в стяжении κἀγώ, важное для риторического вопроса.
- source_word: κρίνομαι
  choice: подвергаюсь суду
  rationale: Передаёт настоящее страдательное значение, не сужая смысл до окончательного осуждения.
- source_word: ὡς ἁμαρτωλὸς
  choice: как грешник
  rationale: Прямо и естественно передаёт характеристику лица, в качестве которого его судят.
theological_decisions:
- issue: Следует ли понимать ἀλήθεια τοῦ θεοῦ как абстрактную «истину Бога» или как Его правдивость и верность.
  choice: верность Бога
  alternative: истина Бога; Божья правдивость
  rationale: Ближайший контекст противопоставляет Бога, Который истинен, людям-лжецам. «Верность» передаёт нравственно-личностный смысл, но не превращает его в конфессионально обусловленное толкование.
- issue: Означает ли κρίνομαι судебное разбирательство вообще или уже осуждение.
  choice: подвергаюсь суду
  alternative: осуждаюсь
  rationale: Более широкое значение сохраняет неопределённость греческого глагола и не предрешает исход суда.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос сохранён. Формулировка dignified, но понятна широкому читателю. Заглавная буква в местоимении «Его» соответствует принятому благоговейному русскому библейскому регистру.
