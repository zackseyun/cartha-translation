- from: Но если верность Бога благодаря моей лжи проявилась ещё полнее к Его славе, то почему же и я всё ещё подвергаюсь суду как грешник?
  to: Но если Божья правдивость[a] через мою ложь[b] стала ещё очевиднее во славу Его[c], то почему же и я всё ещё подвергаюсь суду как грешник?
  rationale: Замена «верность» на «правдивость» точнее сохраняет противопоставление Божьей ἀλήθεια человеческой лжи. «Через» устраняет положительную окраску «благодаря». Формулировка «стала ещё очевиднее» передаёт, что в риторическом допущении Божья правдивость проявляется с большей очевидностью; она не предполагает, будто Божье свойство само по себе изменилось. Добавлены сноски с альтернативами, а риторический вопрос, добавочное «и я», продолжающееся «всё ещё» и непредрешающее «подвергаюсь суду» сохранены.
