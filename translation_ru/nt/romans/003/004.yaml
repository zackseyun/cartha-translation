id: ROM.3.4
reference: Romans 3:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: ru
  text: 'Ни в коем случае! Напротив, пусть Бог будет правдив, а каждый человек — лжец, как написано:


    «Чтобы Ты был оправдан[a] в Своих словах

    и одержал победу, когда Тебя судят»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы была признана Твоя правота» или «чтобы Ты оказался прав».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда Ты судишь». Этот вариант непосредственнее отражает еврейский текст Псалма 50:6 (51:4), тогда как греческий текст Послания к римлянам естественнее понимать как «когда Тебя судят».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Ни в коем случае!
  rationale: Передаёт категорическое Павлово отрицание естественным и сильным современным русским выражением.
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: Напротив, пусть Бог будет правдив
  rationale: Сохраняет побудительную форму γινέσθω и противопоставление правдивого Бога человеку-лжецу; «правдив» здесь естественнее соотносится с личностью, чем «истинен».
- source_word: πᾶς δὲ ἄνθρωπος
  choice: а каждый человек
  rationale: Передаёт обобщённое, не ограниченное полом значение ἄνθρωπος и распределительное значение πᾶς.
- source_word: ψεύστης
  choice: лжец
  rationale: Прямой и выразительный эквивалент существительного, обозначающего того, кто лжёт.
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Естественная русская формула введения авторитетной цитаты Писания.
- source_word: δικαιωθῇς
  choice: был оправдан
  rationale: Сохраняет судебную образность греческого глагола; в отношении Бога означает признание Его правоты, а не приобретение Им праведности.
- source_word: ἐν τοῖς λόγοις σου
  choice: в Своих словах
  rationale: Близко передаёт греческую формулировку и сохраняет связь оправдания с Божьими словами.
- source_word: νικήσεις
  choice: одержал победу
  rationale: Передаёт значение победы в контексте разбирательства и звучит естественно по-русски.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: когда Тебя судят
  rationale: Отражает наиболее естественное пассивное прочтение греческого инфинитива κρίνεσθαι, не устраняя известное отличие от еврейской формы псалма.
theological_decisions:
- issue: Смысл δικαιωθῇς применительно к Богу
  choice: «был оправдан» в смысле признания правоты Бога
  alternative: «оказался прав» / «была признана Твоя правота»
  rationale: Контекст утверждает Божью правдивость вопреки человеческой лжи. Речь не о том, что Бог становится праведным, а о том, что Его правота подтверждается.
- issue: Залог κρίνεσθαί в цитате из Псалма 50:6 (51:4)
  choice: 'Пассивное: «когда Тебя судят»'
  alternative: 'Активное: «когда Ты судишь»'
  rationale: Греческий текст Послания естественнее понимается как пассивный, тогда как активный вариант непосредственнее отражает еврейский текст псалма; различие сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Заглавные местоимения в цитате ясно указывают на обращение к Богу. Поэтическая разбивка сохраняет структуру цитируемого псалма без архаизации.
