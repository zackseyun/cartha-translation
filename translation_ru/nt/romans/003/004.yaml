  source_fidelity: Перевод точно передаёт emphатическое μὴ γένοιτο, побудительный оттенок γινέσθω, антитезу между Божьей правдивостью и человеческой ложью, а также судебную образность цитаты. «Когда Тебя судят» обоснованно отражает наиболее естественное пассивное понимание κρίνεσθαί σε.
  naturalness: Текст звучит естественно на современном литературном русском. «Ни в коем случае!» уместно передаёт категорическое отрицание; «пусть Бог будет правдив» ясно и стилистически нормально в данном противопоставлении. Поэтическая разбивка цитаты не мешает чтению.
  terminology: «Лжец», «оправдан», «в Своих словах» и «одержал победу» сохраняют смысл и регистр оригинала. Примечание к «оправдан» корректно поясняет судебно-оправдательный, а не морально-преобразующий смысл. Примечание к варианту «когда Ты судишь» корректно фиксирует различие с еврейской формой псалма.
