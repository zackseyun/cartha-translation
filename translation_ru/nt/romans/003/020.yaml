id: ROM.3.20
reference: Romans 3:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: ru
  text: потому что делами закона не оправдается перед Ним ни один человек, ведь через закон приходит осознание греха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: делами закона
  rationale: Естественно и достаточно формально передаёт средство или основание, выраженное ἐξ, сохраняя устойчивую для Павла формулировку.
- source_word: οὐ δικαιωθήσεται
  choice: не оправдается
  rationale: Сохраняет судебно-богословский смысл пассивного глагола δικαιόω и допускаемую греческой формой ориентацию на будущее.
- source_word: πᾶσα σὰρξ
  choice: ни один человек
  rationale: В данном отрицательном контексте семитизм «всякая плоть» означает всё человечество; современная русская формулировка ясно передаёт смысл, не создавая ложного акцента на телесности.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед Ним
  rationale: Передаёт личное предстояние перед Богом; прописная буква ясно указывает на референта местоимения в русском контексте.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: осознание греха
  rationale: Передаёт не просто наличие сведений, а распознавание и ясное понимание греха, производимое законом.
theological_decisions:
- issue: Функция закона
  choice: «через закон приходит осознание греха»
  alternative: «через закон познаётся грех»
  rationale: Выбранная формулировка сохраняет утверждение Павла о раскрывающей грех функции закона, не добавляя вывода о том, что закон сам является причиной греха.
- issue: Объём выражения πᾶσα σὰρξ
  choice: «ни один человек»
  alternative: «никакая плоть»
  rationale: Контекст говорит об универсальной невозможности человеческого оправдания делами закона; выбор передаёт эту универсальность без конфессионального уточнения состава «дел закона».
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, dignified и понятная. Сохранены причинные связи двух предложений посредством «потому что» и «ведь», а также богословская напряжённость между оправданием и познавательной функцией закона.
