  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: ru
  text: при Божьем долготерпении — для явления его праведности[a] в нынешнее время, чтобы он был праведен и оправдывал верующего в Иисуса.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «того, кто [оправдывается] благодаря верности Иисуса». Греческое выражение может обозначать как веру в Иисуса, так и верность Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: долготерпении
  rationale: Передаёт сознательное удержание Богом немедленного суда; слово понятно в современном литературном русском и сохраняет торжественный регистр контекста.
- source_word: ἔνδειξιν
  choice: показать
  rationale: Глагольная конструкция естественнее отвлечённого существительного «доказательство» и сохраняет смысл явного, убедительного обнаружения Божьей праведности.
- source_word: δικαιοσύνης
  choice: праведность
  rationale: Сохраняет обычное для Павла широкое значение δικαιοσύνη; судебный оттенок «справедливость» отмечен в сноске.
- source_word: νῦν καιρῷ
  choice: в нынешнее время
  rationale: Естественно передаёт временной акцент νῦν καιρός без архаичного «ныне».
- source_word: δίκαιον
  choice: праведен
  rationale: Соответствует δίκαιος и вместе с «оправдывал» частично воспроизводит однокоренную связь δίκαιον — δικαιοῦντα.
- source_word: δικαιοῦντα
  choice: оправдывал
  rationale: Передаёт субстантивированное причастие в судебном смысле и сохраняет русскую однокоренную связь с понятием праведности.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: верующего в Иисуса
  rationale: Основной текст следует распространённому объективному пониманию генитива и выражает его естественно по-русски; возможное значение «верность Иисуса» сохранено в сноске.
theological_decisions:
- issue: Значение ἐκ πίστεως Ἰησοῦ
  choice: верующего в Иисуса
  alternative: того, кто опирается на верность Иисуса
  rationale: Объективное и субъективное понимания генитива грамматически обсуждаемы. Основной текст выбирает наиболее понятное традиционное прочтение, не устраняя альтернативу.
- issue: Соотношение Божьей праведности и оправдания верующего
  choice: праведен и оправдывал
  alternative: справедлив и объявлял праведным
  rationale: 'Однокоренные русские формы сохраняют напряжение мысли Павла: Бог остаётся праведным, одновременно оправдывая верующего; перевод не объясняет и не сглаживает это утверждение.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Начальная строчная буква и синтаксическая незавершённость сохранены, поскольку данный стих начинается продолжением мысли предыдущего контекста. Местоимения, относящиеся к Богу, даны со строчной буквы по современной издательской норме.
