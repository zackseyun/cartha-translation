  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: ru
  text: 'И почему бы не сказать — как нас злословят и как некоторые утверждают, будто мы говорим: «Будем делать зло, чтобы пришло добро»? Их осуждение справедливо.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «И не — как нас злословят и как некоторые говорят, будто мы говорим: “Будем делать зло, чтобы пришло добро”?» Греческое выражение в начале стиха эллиптично и продолжает мысль предыдущего стиха.'
    reason: lexical_alternative
  - marker: b
    text: «Их осуждение» относится к тем, кто выдвигает или одобряет это обвинение и это рассуждение.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: нас злословят
  rationale: В данном контексте глагол означает порочащую речь и ложное представление учения Павла; «злословят» сохраняет силу исходного слова и естественно звучит по-русски.
- source_word: φασίν τινες
  choice: некоторые утверждают
  rationale: Передаёт сообщение о враждебном обвинении несколько точнее, чем нейтральное «говорят».
- source_word: ἡμᾶς λέγειν
  choice: будто мы говорим
  rationale: Сохраняет прямое значение инфинитива λέγειν; «будто» естественно обозначает приписываемые Павлу слова, не признавая обвинение истинным.
- source_word: Ποιήσωμεν
  choice: Будем делать
  rationale: Передаёт побудительный оттенок аористного конъюнктива первого лица множественного числа в естественной русской форме.
- source_word: τὰ κακὰ
  choice: зло
  rationale: Субстантивированное прилагательное во множественном числе идиоматично передаётся собирательным русским существительным «зло».
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: чтобы пришло добро
  rationale: Сохраняет целевое или результативное значение ἵνα и образ наступающего добра.
- source_word: κρίμα
  choice: осуждение
  rationale: В контексте обозначает неблагоприятный судебный приговор, а не просто нейтральное суждение.
- source_word: ἔνδικόν
  choice: справедливо
  rationale: Передаёт как юридическую правомерность, так и нравственную обоснованность приговора.
- source_word: καὶ μὴ
  choice: И почему бы не сказать
  rationale: Греческая фраза эллиптична и продолжает вопрос предыдущего стиха; дополнение «почему бы» ясно выражает подразумеваемую связь, не меняя аргумента.
theological_decisions:
- issue: К кому относится местоимение ὧν в выражении ὧν τὸ κρίμα
  choice: «Их» относится к людям, распространяющим или принимающим приписываемое Павлу рассуждение.
  alternative: Отнести осуждение шире ко всем, кто следует принципу «делать зло ради добра».
  rationale: Ближайший грамматический референт — «некоторые», которые утверждают, будто Павел и его соработники так говорят; однако сжатость греческой фразы допускает более широкое применение, поэтому это поясняется в примечании без изменения основного текста.
translation_notes:
  register: Современный литературный русский язык с достойным, но общедоступным звучанием. Синтаксис сохраняет резкую риторическую структуру греческого текста; кавычки и тире помогают ясно отделить ложное обвинение от слов автора.
