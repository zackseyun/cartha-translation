  to: Итак, где же хвастовство? Оно исключено. По какому закону? По закону дел? Нет, по закону веры.
  rationale: Убрана ненужная смысловая экспликация «основание для», чтобы непосредственно передать καύχησις. Формулировка с «по какому закону» делает русский текст естественным и сохраняет повтор слова «закон», контраст «дел» и «веры», а также краткую риторическую структуру греческого текста.
