source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: ru
  text: Итак, где же хвастовство? Оно исключено. По какому закону? По закону дел? Нет, по закону веры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: основание для хвастовства
  rationale: Передаёт не только сам акт похвальбы, но и притязание на него; в данном контексте речь о том, есть ли у человека повод ставить себе в заслугу оправдание.
- source_word: ἐξεκλείσθη
  choice: устранено
  rationale: Аорист страдательного залога означает, что хвастовству закрыт доступ или оно исключено; «устранено» естественно звучит по-русски и сохраняет категоричность.
- source_word: διὰ ποίου νόμου
  choice: посредством какого закона
  rationale: διά с родительным выражает средство; ποίου спрашивает о характере или разновидности закона, а не просто о его идентичности.
- source_word: νόμου ... τῶν ἔργων
  choice: закона дел
  rationale: Сохраняет краткую павловскую формулу и связь с ближайшим контекстом о делах закона.
- source_word: νόμου πίστεως
  choice: закона веры
  rationale: Буквально сохраняет намеренно напряжённое сочетание «закон» и «вера», не подменяя его толкованием вроде «принцип веры».
theological_decisions:
- issue: Значение νόμος в выражениях «закон дел» и «закон веры»
  choice: В обоих случаях сохранено слово «закон».
  alternative: «Принцип дел» / «принцип веры» или «путь дел» / «путь веры».
  rationale: Греческий текст повторяет νόμος и создаёт риторический контраст. Перевод не должен заранее решать, употреблено ли слово в строгом, расширенном или риторическом смысле.
- issue: Что именно исключено
  choice: «основание для хвастовства» устранено.
  alternative: «Хвастовство исключено» или «похвала исключена».
  rationale: Контекст отрицает возможность человеческой заслуги перед Богом; формулировка сохраняет это направление, не вводя конфессионально специфического объяснения.
translation_notes:
  register: Современный литературный русский язык, с сохранением сжатой цепочки риторических вопросов и павловского парадокса «закон веры».
