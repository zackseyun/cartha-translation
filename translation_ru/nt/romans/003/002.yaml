  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: ru
  text: Велико во всех отношениях. Ибо прежде всего им были вверены Божьи изречения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺ
  choice: велико
  rationale: Наречное по функции слово отвечает на подразумеваемый вопрос о преимуществе и естественно согласуется с «преимущество» из предыдущего стиха.
- source_word: κατὰ πάντα τρόπον
  choice: во всех отношениях
  rationale: Передаёт всеохватность идиомы и естественно звучит в современном литературном русском.
- source_word: πρῶτον μὲν γὰρ
  choice: прежде всего
  rationale: Обозначает первый и главный названный пункт; отдельное «ведь» по-русски здесь утяжеляло бы краткий ответ, тогда как пояснительная связь ясна из построения фразы.
- source_word: ἐπιστεύθησαν
  choice: им были вверены
  rationale: Пассивная форма здесь выражает поручение и доверение, а не веру; безлично-пассивная русская конструкция сохраняет это значение.
- source_word: τὰ λόγια
  choice: изречения
  rationale: Обозначает авторитетные божественные речения; «изречения» точнее простого «слова» и понятнее архаичного «глаголы».
- source_word: τοῦ θεοῦ
  choice: Божьи
  rationale: Естественно передаёт родительный принадлежности или источника, не устраняя полностью возможный оттенок происхождения от Бога.
theological_decisions:
- issue: Объём выражения «Божьи изречения»
  choice: Сохранена широкая формулировка без уточнения состава или объёма вверенного откровения.
  alternative: Уточнить как «Писания» или «закон».
  rationale: Греческое λόγια не ограничивает здесь референт одним разделом Писания; уточнение внесло бы лишнее богословское толкование.
translation_notes:
  register: Современный литературный русский, краткий и достоинственный. Синтаксис соотнесён с вопросом Рим 3:1; сохранены лаконичность ответа и оттенок доверенного служения.
