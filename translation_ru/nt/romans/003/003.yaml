id: ROM.3.3
reference: Romans 3:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: ru
  text: Что же? Если некоторые оказались неверны, неужели их неверность сведёт на нет верность Бога?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если некоторые не поверили, неужели их неверие сведёт на нет веру Бога?» Греческие слова могут обозначать как неверность и верность, так и неверие и веру; в данном контексте вероятнее говорится о человеческой неверности и Божьей верности.'
    reason: Лексическая неоднозначность ἀπιστέω, ἀπιστία и πίστις, а также спорная передача выражения πίστις τοῦ θεοῦ.
lexical_decisions:
- source_word: τί γάρ
  choice: Что же?
  rationale: Краткая и естественная формула вводит следующий поворот рассуждения Павла, не добавляя отсутствующего в греческом тексте содержания.
- source_word: ἠπίστησάν
  choice: оказались неверны
  rationale: Глагол может означать неверие или неверность. Здесь его связь с ἀπιστία и противопоставление Божьей πίστις делают значение «быть неверным» наиболее вероятным; «оказались» естественно передаёт констатацию факта, не усиливая её.
- source_word: τινες
  choice: некоторые
  rationale: Точно и естественно передаёт неопределённое множественное местоимение.
- source_word: ἀπιστία
  choice: неверность
  rationale: Сохраняет словесную связь с «оказались неверны» и контраст с Божьей верностью. Возможное значение «неверие» отмечено в сноске.
- source_word: πίστιν τοῦ θεοῦ
  choice: верность Бога
  rationale: В данном противопоставлении πίστις естественно означает надёжность, верность Бога. Форма «верность Бога» также сохраняет явную генитивную связь, не уточняя её сверх текста.
- source_word: καταργήσει
  choice: упразднит
  rationale: Передаёт смысл лишения силы или действенности и уместно звучит в риторическом вопросе.
- source_word: μὴ ... καταργήσει
  choice: неужели ... упразднит
  rationale: Частица μή в таком вопросе предполагает отрицательный ответ; «неужели» естественно обозначает это ожидание по-русски.
theological_decisions:
- issue: Значение πίστις в выражении πίστιν τοῦ θεοῦ
  choice: верность Бога
  alternative: вера Бога / Божья вера
  rationale: Контраст с человеческой ἀπιστία указывает прежде всего на Божью верность и надёжность. Поскольку буквальная конструкция допускает передачу через «веру», альтернативное прочтение сохраняется в сноске.
- issue: Значение группы ἀπιστέω / ἀπιστία
  choice: быть неверным / неверность
  alternative: не верить / неверие
  rationale: Выбранная передача сохраняет параллелизм и противопоставление Божьей верности, но не исключает семантически возможной темы неверия, указанной в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, энергичная форма риторического вопроса сохраняет ход аргументации. «Неужели» передаёт ожидаемый отрицательный ответ, а «верность Бога» звучит ясно и достойно без конфессионального уточнения.
