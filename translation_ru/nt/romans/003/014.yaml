translation:
  language: ru
  text: Их уста полны проклятий и горечи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: их
  rationale: Родительное относительное местоимение связывает строку с людьми из предыдущего контекста; по-русски естественно продолжить описание притяжательным местоимением «их».
- source_word: τὸ στόμα
  choice: уста
  rationale: Единственное число употреблено собирательно. «Уста» сохраняет образ органа речи и соответствует возвышенному, но понятному регистру библейской поэзии.
- source_word: ἀρᾶς
  choice: проклятий
  rationale: Существительное обозначает проклятие или речь, призывающую зло; множественное число естественно в русском обороте «полны проклятий» и передаёт характер речи.
- source_word: πικρίας
  choice: горечи
  rationale: Прямой и прозрачный эквивалент, сохраняющий как образный смысл, так и нравственную характеристику речи.
- source_word: γέμει
  choice: полны
  rationale: Настоящее время и состояние наполненности естественно переданы кратким прилагательным в русском обороте «уста полны».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и образности ветхозаветной цитаты. «Уста» выбрано вместо более разговорного «рот» ради достоинства регистра без архаической перегруженности.
