  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: ru
  text: Нет понимающего, нет ищущего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настойчиво ищущего Бога»; также возможно: «разыскивающего Бога».'
    reason: 'Лексическая альтернатива: приставочный глагол ἐκζητέω может выражать усиленный или тщательный поиск.'
lexical_decisions:
- source_word: συνίων
  choice: понимающего
  rationale: Субстантивированное причастие передано естественной русской формой; она сохраняет значение понимания и проницательного постижения без добавочного толкования.
- source_word: ἐκζητῶν
  choice: ищущего
  rationale: Глагол означает настойчиво искать, разыскивать; в основном тексте простое «ищущего» звучит естественно, а возможный усилительный оттенок отмечен в сноске.
- source_word: οὐκ ἔστιν
  choice: нет
  rationale: Повторённое «нет» кратко и точно передаёт категорическое отрицание и параллелизм греческого текста.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: понимающего / ищущего
  rationale: Субстантивированные причастия естественно передаются по-русски родительным падежом после «нет», с сохранением симметрии исходной конструкции.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Обычное русское обозначение единого Бога в данном контексте; винительный падеж исходного текста закономерно становится родительным при отрицательной конструкции с «нет».
theological_decisions:
- issue: Объём категорического отрицания в цитате Павла
  choice: Сохранить абсолютную формулировку «нет… нет…» без смягчающих наречий.
  alternative: «Никто по-настоящему не понимает, никто истинно не ищет Бога».
  rationale: Греческий текст содержит прямое категорическое отрицание и не даёт оснований добавлять толковательные ограничения вроде «по-настоящему» или «истинно».
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная формулировка сохраняет поэтический параллелизм ветхозаветной цитаты и категоричность греческого текста.
