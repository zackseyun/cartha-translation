    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: поскольку
  rationale: В контексте εἴπερ вводит основание вывода, опирающееся на разделяемое убеждение о единстве Бога, а не выражает реальную неуверенность; условный оттенок отмечен в сноске.
- source_word: εἷς ὁ θεός
  choice: Бог один
  rationale: Сохраняет выразительное монотеистическое утверждение и естественно звучит по-русски.
- source_word: δικαιώσει
  choice: оправдает
  rationale: Передаёт богословски значимый глагол δικαιόω и сохраняет будущее время.
- source_word: περιτομήν
  choice: обрезанных
  rationale: Абстрактное существительное «обрезание» употреблено метонимически о людях; перевод не сужает значение до этнического обозначения «иудеи».
- source_word: ἐκ πίστεως
  choice: на основании веры
  rationale: Передаёт ἐκ как указание на основание и позволяет сохранить отличие от следующего выражения с διά.
- source_word: ἀκροβυστίαν
  choice: необрезанных
  rationale: Существительное «необрезание» метонимически обозначает людей; вариант не вводит более узкое толкование «язычники» непосредственно в текст.
- source_word: διὰ τῆς πίστεως
  choice: через веру
  rationale: Сохраняет отдельный предлог διά и естественно передаёт средство; артикль перед πίστις не требует здесь перевода определительной формой.
- source_word: πίστεως
  choice: вера
  rationale: В данном контексте обычное значение «вера» ясно и не связано со спорной субъектно-объектной конструкцией родительного падежа.
theological_decisions:
- issue: Выражает ли различие между ἐκ πίστεως и διὰ τῆς πίστεως богословское противопоставление
  choice: Сохранить различие как «на основании веры» и «через веру», не утверждая резкого доктринального противопоставления.
  alternative: 'Передать оба оборота одинаково: «по вере» или «через веру».'
  rationale: В греческом тексте стоят разные предлоги, поэтому различие уместно отразить; однако контекст не позволяет уверенно превращать его в самостоятельное богословское разграничение.
- issue: Условное или причинное значение εἴπερ
  choice: 'Передать причинно: «поскольку Бог один».'
  alternative: «если действительно Бог один»
  rationale: Аргумент Павла исходит из исповедуемого единства Бога, а не ставит его под сомнение; вместе с тем формальная условность греческого выражения сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «На основании веры» несколько формальнее разговорного «по вере», но точно сохраняет отличие ἐκ от διά. Все три примечания отмечены в основном тексте.
