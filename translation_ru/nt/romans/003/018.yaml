lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Нет
  rationale: Естественная русская безлично-экзистенциальная конструкция точно передаёт отрицание наличия.
- source_word: φόβος θεοῦ
  choice: страха Божьего
  rationale: Сохраняет прямое значение φόβος и устойчивый библейский оборот; возможный смысл почтения указан в сноске, а не подменяет основной образ.
- source_word: ἀπέναντι
  choice: перед
  rationale: Передаёт пространственно-метафорическое значение греческого предлога и естественно сочетается с образом глаз.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: их глазами
  rationale: Сохраняет конкретный библейский образ глаз, связанный с восприятием и нравственной направленностью.
theological_decisions:
- issue: Значение выражения φόβος θεοῦ
  choice: страх Божий
  alternative: благоговение перед Богом
  rationale: Основной текст сохраняет более прямое и многозначное «страх», не сводя его заранее только к почтению; смысловой оттенок благоговения отмечен в сноске.
translation_notes:
  register: Современный литературный русский с сохранением лаконизма и библейского образа исходного текста. Форма «Божьего» понятна современному читателю и звучит достойно; синтаксис намеренно близок к афористической формуле цитируемого псалма.
