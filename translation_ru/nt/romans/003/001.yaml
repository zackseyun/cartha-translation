id: ROM.3.1
reference: Romans 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: ru
  text: Итак, в чём преимущество иудея? Или какая польза от обрезания?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Или в чём ценность обрезания?»'
    reason: lexical_alternative
  - marker: b
    text: «Иудей» здесь употреблено в единственном числе как обозначение любого представителя иудейского народа.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: Итак, в чём
  rationale: Передаёт логический переход οὖν и естественно вводит риторический вопрос по-русски.
- source_word: τὸ περισσὸν
  choice: преимущество
  rationale: В данном контексте обозначает особое преимущество или выгоду, не утверждая превосходства иудеев как народа.
- source_word: τοῦ Ἰουδαίου
  choice: иудея
  rationale: Сохраняет родительный падеж и репрезентативное единственное число греческого текста.
- source_word: ἢ τίς
  choice: Или какая
  rationale: Сохраняет параллельную структуру второго риторического вопроса.
- source_word: ἡ ὠφέλεια
  choice: польза
  rationale: Естественный современный эквивалент со значением пользы или практической ценности; позволяет отличить этот термин от περισσόν.
- source_word: τῆς περιτομῆς
  choice: от обрезания
  rationale: По-русски конструкция «польза от» звучит естественнее буквального «польза обрезания», при этом прямо называет обряд.
theological_decisions:
- issue: Передача Ἰουδαίου как родового, репрезентативного единственного числа
  choice: иудея
  alternative: иудеев; иудейского человека
  rationale: Павел употребляет форму мужского рода в единственном числе как обозначение представителя категории. Сохранение единственного числа передаёт его риторическую форму и не превращает выражение в отвлечённый или множественный парафраз.
translation_notes:
  register: Современный литературный русский язык; риторический параллелизм сохранён. «Иудей» выбран как традиционное и точное обозначение в библейском контексте, а не как современная этническая маркировка.
