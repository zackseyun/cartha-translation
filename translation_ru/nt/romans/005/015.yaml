id: ROM.5.15
reference: Romans 5:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: ru
  text: Но дар не таков, как проступок. Ведь если из-за проступка одного человека умерли многие, то тем более благодать Бога и дар по благодати одного человека — Иисуса Мессии[a] — в изобилии распространились среди многих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: проступок
  rationale: Передаёт конкретный неправедный поступок Адама и сохраняет нравственно-правовой оттенок, не прибегая к более узкому или тяжеловесному термину.
- source_word: χάρισμα
  choice: дар
  rationale: Ясно сохраняет противопоставление между проступком и Божьим даром; связь дара с благодатью прямо выражена далее в стихе.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: многие / на многих
  rationale: Сохраняет павловское противопоставление одного и многих, не заменяя «многих» на «всех» и не разрешая тем самым богословское напряжение текста.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: благодать Бога
  rationale: Современная и ясная формулировка, передающая греческий родительный оборот и поддерживающая параллель со следующим упоминанием благодати.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: дар по благодати
  rationale: 'Передаёт инструментально-ассоциативную силу ἐν: дар приходит по благодати и неотделим от неё, при этом русская фраза остаётся естественной.'
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: одного человека
  rationale: Сохраняет ключевое для контекста противопоставление одного человека и многих.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Передаёт Χριστός как значимый титул, а не как фамилию; привычный вариант «Иисуса Христа» указан в примечании.
- source_word: ἐπερίσσευσεν
  choice: в изобилии излились
  rationale: Выражает идею избытка и соответствует усилению πολλῷ μᾶλλον; множественное число естественно согласует в русском языке однородные подлежащие «благодать» и «дар».
theological_decisions:
- issue: Объём значения выражения «многие» в сопоставлении Адама и Христа
  choice: Сохранить «многие» и «на многих»
  alternative: Передать как «все»
  rationale: В данном стихе Павел строит риторику на противопоставлении одного и многих. Замена на «всех» преждевременно разрешила бы смысловой и богословский вопрос посредством перевода.
- issue: Соотношение благодати Бога, дара и благодати одного человека
  choice: Сохранить координацию «благодать Бога и дар по благодати одного человека»
  alternative: Перестроить фразу так, чтобы благодать однозначно относилась только к Богу или только к Иисусу
  rationale: Греческая конструкция тесно связывает Божью благодать, дар и благодать одного человека — Иисуса Мессии. Перевод не устраняет эту насыщенную связь пояснительной перефразировкой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Синтаксис сохраняет павловское противопоставление «один — многие», но избегает архаизмов вроде «преизобиловал». Тире выделяет приложение «Иисуса Мессии» и облегчает восприятие длинной фразы.
