- from: Но дар не таков, как проступок. Ведь если из-за проступка одного человека умерли многие, то тем более благодать Бога и дар по благодати одного человека — Иисуса Мессии[a] — в изобилии излились на многих.
  to: Но дар не таков, как проступок. Ведь если из-за проступка одного человека умерли многие, то тем более благодать Бога и дар по благодати одного человека — Иисуса Мессии[a] — в изобилии распространились среди многих.
