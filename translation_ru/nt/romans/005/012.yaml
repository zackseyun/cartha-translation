id: ROM.5.12
reference: Romans 5:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: ru
  text: Поэтому, как через одного человека грех вошёл в мир, а через грех — смерть, так и смерть распространилась на всех людей, потому что все согрешили[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному пониманию: «в нём все согрешили».'
    reason: Альтернативное толкование ἐφ’ ᾧ, имеющее существенное богословское значение.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод или переход от предшествующего рассуждения кратко и естественно.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: через одного человека
  rationale: Сохраняет посредническое значение διά с родительным падежом и указание на одного человека, Адама.
- source_word: ἡ ἁμαρτία
  choice: грех
  rationale: Стандартно и без неоправданного расширения передаёт персонифицированное у Павла понятие греха.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: вошёл в мир
  rationale: Естественно передаёт направленность εἰς и образ вхождения.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: а через грех — смерть
  rationale: 'Сохраняет параллелизм: грех вошёл через человека, смерть — через грех; тире восполняет подразумеваемый глагол.'
- source_word: οὕτως
  choice: так и
  rationale: Естественно вводит соответствующую часть сравнения.
- source_word: εἰς πάντας ἀνθρώπους
  choice: на всех людей
  rationale: Передаёт всеобщий охват человечества и сочетается с русским глаголом «распространилась».
- source_word: ὁ θάνατος διῆλθεν
  choice: смерть распространилась
  rationale: Ясно выражает движение смерти, охватившей всё человечество.
- source_word: ἐφ’ ᾧ
  choice: потому что
  rationale: Причинное понимание грамматически и контекстуально естественно, но допускает традиционную альтернативу, отмеченную в сноске.
- source_word: πάντες ἥμαρτον
  choice: все согрешили
  rationale: Простое прошедшее время соответствует аористу и не добавляет к нему иной аспект.
theological_decisions:
- issue: Значение ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'причинное: «потому что все согрешили»'
  alternative: 'представительное/корпоративное: «в нём все согрешили»'
  rationale: Причинное понимание наиболее естественно в данном синтаксисе и не вводит в основной текст более узкую догматическую формулировку. Богословски значимая традиционная трактовка сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; достоинство и риторический параллелизм оригинала сохранены. Конечное тире оставлено, поскольку в греческом стих представляет незавершённую сравнительную конструкцию, продолжающуюся далее.
