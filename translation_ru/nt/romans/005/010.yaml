revisions:
- from: Ведь если, когда мы были врагами, мы были примирены с Богом через смерть Его Сына, то тем более теперь, примирившись, будем спасены Его жизнью.[a]
  to: Ведь если мы, будучи врагами, были примирены с Богом через смерть Его Сына, то тем более, будучи примирены, будем спасены Его жизнью.[a]
  rationale: Убрано не выраженное в оригинале «теперь» и заменено активообразное «примирившись» на страдательное «будучи примирены». Остальные решения сохранены, включая отмеченную в примечании неоднозначность ἐν τῇ ζωῇ αὐτοῦ.
