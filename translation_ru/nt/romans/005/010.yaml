id: ROM.5.10
reference: Romans 5:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: ru
  text: Ведь если мы, будучи врагами, были примирены с Богом через смерть Его Сына, то тем более, будучи примирены, будем спасены Его жизнью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем спасены в Его жизни».'
    reason: Греческое ἐν может обозначать как средство («Его жизнью»), так и сферу или сопричастность («в Его жизни»).
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Ведь если
  rationale: «Ведь» передаёт пояснительно-аргументативную функцию γάρ, а «если» сохраняет условную форму εἰ, не превращая её в прямое утверждение.
- source_word: ἐχθροὶ ὄντες
  choice: когда мы были врагами
  rationale: Передаёт одновременное обстоятельство состояния и прямой реляционный смысл ἐχθροί; «врагами» естественно и сохраняет силу противопоставления примирению.
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: мы были примирены с Богом
  rationale: Пассивная конструкция сохраняет форму κατηλλάγημεν, а русское «примирены с Богом» идиоматично передаёт отношение, выраженное дательным τῷ θεῷ.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: через смерть Его Сына
  rationale: «Через» передаёт διά с родительным в значении средства; «Его Сына» точно сохраняет сыновнее обозначение без поясняющего расширения.
- source_word: πολλῷ μᾶλλον
  choice: тем более
  rationale: Естественно передаёт усиленный аргумент Павла a fortiori и связывает вывод с условной посылкой.
- source_word: καταλλαγέντες
  choice: теперь, примирившись
  rationale: Деепричастие передаёт предшествование аористного причастия будущему σωθησόμεθα; «теперь» ясно обозначает новое состояние после примирения, не меняя смысла.
- source_word: σωθησόμεθα
  choice: будем спасены
  rationale: Сохраняет будущую и пассивную форму, а также привычное богословское значение σῴζω без дополнительного уточнения характера спасения.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: Его жизнью
  rationale: Творительный падеж естественно передаёт вероятное инструментальное значение ἐν и сохраняет контраст между смертью Сына как средством примирения и Его жизнью как основанием или средством будущего спасения.
theological_decisions:
- issue: Значение ἐν τῇ ζωῇ αὐτοῦ
  choice: 'инструментальное: «Его жизнью»'
  alternative: 'локативное или ассоциативное: «в Его жизни»'
  rationale: 'Контраст с «через смерть Его Сына» поддерживает инструментальное понимание: примирение произошло через Его смерть, а будущее спасение совершается Его жизнью. Альтернатива сохранена в примечании, поскольку предлог ἐν допускает более локативное или сферическое прочтение.'
translation_notes:
  register: Современный литературный русский язык; тон краткий, достоинственный и аргументативный. Пассив «были примирены» сохранён ради точности исходного текста, а условная форма не сглажена до причинного утверждения.
