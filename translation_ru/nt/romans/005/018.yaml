source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: ru
  text: Итак, подобно тому как одно преступление повлекло за собой осуждение для всех людей, так и один праведный поступок[a] повлек за собой оправдание, ведущее к жизни, для всех людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «через один акт праведности — для всех людей к оправданию жизни».'
    reason: Лексическая альтернатива для более буквальной передачи δικαίωμα и конструкции δικαίωσιν ζωῆς.
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Итак
  rationale: Естественно передаёт итогово-выводное значение сочетания частиц в современном русском языке.
- source_word: παραπτώματος
  choice: преступления
  rationale: Передаёт конкретный проступок, нарушающий Божью волю, и сохраняет противопоставление единственному праведному поступку.
- source_word: κατάκριμα
  choice: осуждение
  rationale: Сохраняет судебный смысл греческого слова и его противопоставление оправданию.
- source_word: δικαιώματος
  choice: праведному поступку
  rationale: В данном контексте единственное число указывает на решающее деяние Христа; формулировка естественна по-русски и не уточняет сверх текста, каким именно событием было это деяние.
- source_word: δικαίωσιν ζωῆς
  choice: оправдание, ведущее к жизни
  rationale: Ясно выражает вероятное результативное отношение родительного падежа, одновременно сохраняя судебный смысл оправдания и связь с жизнью.
- source_word: πάντας ἀνθρώπους
  choice: всем людям
  rationale: Точно и инклюзивно передаёт повторяющуюся греческую фразу в обеих половинах сопоставления.
theological_decisions:
- issue: Следует ли сузить значение второго πάντας ἀνθρώπους, чтобы исключить кажущийся всеобщим охват оправдания
  choice: В обеих частях сохранено «всем людям» без добавочного ограничения.
  alternative: «всем верующим» или «всем оправданным» во второй части
  rationale: Греческий текст дословно повторяет одну и ту же фразу. Добавление ограничения разрешило бы богословское напряжение средствами перевода, хотя сам стих оставляет его для более широкого контекста.
- issue: Как понять родительный падеж в δικαίωσιν ζωῆς
  choice: «оправдание, ведущее к жизни»
  alternative: «оправдание жизни»
  rationale: Выбранный вариант передаёт вероятный результат оправдания на понятном русском языке, не отождествляя оправдание и жизнь и не отделяя их друг от друга.
translation_notes:
  register: Современный литературный русский язык с ясной параллельной конструкцией. В обеих половинах восполнен подразумеваемый греческим текстом глагол «пришло», что делает эллиптическое предложение понятным и сохраняет риторическую симметрию.
