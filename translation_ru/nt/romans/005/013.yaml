  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: ru
  text: Ибо до Закона грех был в мире, но грех не засчитывается[a], когда нет закона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вменяется»; «не ставится в счёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι
  choice: до
  rationale: Передаёт временной предел, относящийся в данном контексте к дарованию Закона; по-русски «до Закона» звучит естественно.
- source_word: νόμου
  choice: Закона / закона
  rationale: В первом случае контекст Рим. 5:14 указывает на Моисеев Закон, поэтому употреблена прописная буква; во втором утверждение сформулировано как общее условие отсутствия закона.
- source_word: ἁμαρτία
  choice: грех
  rationale: Сохраняет абстрактное значение единственного числа и возможный оттенок олицетворения, характерный для Павла.
- source_word: ἐν κόσμῳ
  choice: в мире
  rationale: Прямой и естественный эквивалент, обозначающий человеческий мир, в котором присутствовал грех.
- source_word: ἐλλογεῖται
  choice: не ставится в счёт
  rationale: Ясно передаёт расчётно-учётный оттенок глагола, не превращая основной текст в узкобогословскую формулу.
- source_word: μὴ ὄντος νόμου
  choice: когда нет закона
  rationale: Естественно передаёт генитив абсолютный как условно-временное обстоятельство отсутствия закона.
theological_decisions:
- issue: К чему относится νόμος
  choice: «Закон» в первой части с подразумеваемой ссылкой на Моисеев Закон
  alternative: «закон» в общем смысле
  rationale: Ближайший контекст противопоставляет период от Адама до Моисея последующему времени, однако перевод не добавляет отсутствующего в греческом тексте имени Моисея.
- issue: Смысл ἐλλογεῖται
  choice: «не ставится в счёт»
  alternative: «не вменяется» / «не засчитывается»
  rationale: Основной вариант сохраняет образ учёта и не навязывает конкретную доктрину вменения; более терминологичные возможности указаны в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная по тону. Прописная буква в первом употреблении различает исторически подразумеваемый Моисеев Закон и общее утверждение об отсутствии закона во второй части.
