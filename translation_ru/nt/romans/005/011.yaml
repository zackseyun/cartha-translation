  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: οὐ μόνον δέ — «И не только это», καυχώμενοι ἐν τῷ θεῷ — «хвалимся Богом», διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ — «через нашего Господа Иисуса Мессию», и δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν — «через которого мы теперь получили примирение». «Хвалимся Богом» сохраняет смысл καυχάομαι без ложного оттенка самовосхваления; «примирение» верно передаёт καταλλαγή.'
