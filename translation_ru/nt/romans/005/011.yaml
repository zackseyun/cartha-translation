id: ROM.5.11
reference: Romans 5:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: ru
  text: И не только это, но мы также хвалимся Богом через нашего Господа Иисуса Мессию[a], через которого мы теперь получили примирение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. Христос; традиционный перевод — «Христос».
    reason: alternative_reading
lexical_decisions:
- source_word: καυχώμενοι
  choice: хвалимся
  rationale: Передаёт прямое значение глагола — выражать уверенную похвалу или торжество; дополнение «Богом» ясно показывает, что речь не о самовосхвалении.
- source_word: ἐν τῷ θεῷ
  choice: Богом
  rationale: Русский творительный естественно выражает объект и основание хвалы при глаголе «хвалиться».
- source_word: κυρίου
  choice: Господа
  rationale: Обычное и контекстуально уместное обозначение Иисуса в новозаветном христологическом употреблении.
- source_word: Χριστοῦ
  choice: Мессию
  rationale: Передаёт смысл титула Χριστός, то есть Помазанник; в русском после имени титул употреблён естественно, без добавления отсутствующего в греческом артикля.
- source_word: καταλλαγὴν
  choice: примирение
  rationale: Обозначает восстановление отношений; определённость греческого сочетания в русском достаточно выражена контекстом и не требует указательного слова.
- source_word: ἐλάβομεν
  choice: теперь получили
  rationale: Сохраняет аорист ἐλάβομεν и наречие νῦν, указывая на уже совершившееся получение примирения с актуальным результатом.
theological_decisions:
- issue: Передача Χριστοῦ как христологического титула
  choice: Мессию
  alternative: Христа
  rationale: «Мессия» прозрачно передаёт титульное значение греческого Χριστός и не превращает его лишь в привычную часть имени.
- issue: Характер хвалы в καυχώμενοι ἐν τῷ θεῷ
  choice: хвалимся Богом
  alternative: ликуем в Боге
  rationale: 'Сохранено напряжение лексемы καυχάομαι: это не только радость, но открытая уверенная хвала, объектом и основанием которой является Бог.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксическая связь с предыдущим рассуждением сохранена оборотом «И не только это». Формулировка «хвалимся Богом» намеренно сохраняет выразительность Павлова καυχάομαι, не подменяя её более узким «радуемся».
