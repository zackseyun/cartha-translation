  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: ru
  text: а стойкость вырабатывает испытанный характер[a], а испытанный характер — надежду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «характер, прошедший проверку»; возможно также: «одобрение».'
    reason: Лексема δοκιμή может обозначать подтверждённое испытанием качество либо результат проверки — одобрение.
lexical_decisions:
- source_word: ὑπομονή
  choice: стойкость
  rationale: Передаёт устойчивое перенесение испытаний и упорство, оставаясь естественным и понятным современному русскому читателю.
- source_word: δοκιμή
  choice: испытанный характер
  rationale: В данной последовательности обозначает качество человека, которое прошло проверку и подтвердило свою подлинность, а не просто сам процесс испытания.
- source_word: ἐλπίς
  choice: надежда
  rationale: Прямой и естественный русский эквивалент; контекст Послания к римлянам наполняет его смыслом ожидания, основанного на Боге, без необходимости добавлять это в текст.
- source_word: δὲ
  choice: а
  rationale: Связывает очередные звенья последовательности без выраженного противопоставления; повтор «а» естественно сохраняет цепочечное построение греческой фразы.
- source_word: ellipsis of verb (κατεργάζεται supplied from Romans 5:3)
  choice: вырабатывает; во второй части — тире
  rationale: Глагол восстанавливается из предыдущего стиха. В первой части он выражен явно для ясности, а во второй естественная русская эллиптическая конструкция сохраняет сжатость оригинала.
theological_decisions:
- issue: Значение δοκιμή в последовательности духовного формирования
  choice: качество характера, испытанное и подтвердившее свою подлинность
  alternative: процесс испытания или полученное одобрение
  rationale: Здесь δοκιμή выступает результатом стойкости, поэтому «испытанный характер» передаёт итог проверки, не внося дополнительных конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и ритмичная. «Стойкость» понятнее архаичного «терпение» в значении упорного перенесения испытаний, а «испытанный характер» естественнее отвлечённых вариантов «испытанность» и «опытность».
