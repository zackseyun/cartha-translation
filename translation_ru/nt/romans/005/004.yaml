  terminology: «Надежда» — прямой и нейтральный эквивалент ἐλπίς. Выбор «испытанный характер» согласован с английским аудит-следом («proven character») и не навязывает богословского толкования. Сноска корректно отмечает существенные лексические альтернативы для δοκιμή и её привязка [a] поставлена верно.
