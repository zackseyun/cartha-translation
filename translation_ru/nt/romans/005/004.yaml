  source_fidelity: 'Перевод точно передаёт последовательность греческого текста: ὑπομονή ведёт к δοκιμή, а δοκιμή — к ἐλπίς. «Стойкость» уместно передаёт устойчивое перенесение испытаний; «испытанный характер» сохраняет результативный смысл δοκιμή как качества, проверенного и показавшего себя подлинным. Восстановление глагола «вырабатывает» по контексту ст. 3 оправдано, а тире во второй части естественно передаёт эллипсис.'
