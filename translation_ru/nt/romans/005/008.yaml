source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: ru
  text: Но Бог показывает свою любовь к нам[a] тем, что, когда мы ещё были грешниками, Мессия[b] умер за нас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по отношению к нам» или «направленную к нам».'
    reason: lexical_alternative
  - marker: b
    text: Греч. Христос; титул со значением «Мессия», то есть Помазанник.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ради нас», «ради нашего блага».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: показывает
  rationale: Настоящее время передаёт продолжающееся, действенное явление любви Бога; «показывает» звучит естественно и сохраняет смысл наглядного подтверждения, не усиливая его до логического «доказывает».
- source_word: δὲ
  choice: но
  rationale: Союз отмечает мягкое противопоставление предыдущей мысли; русское «но» ясно передаёт поворот рассуждения.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: свою любовь
  rationale: Возвратное «свою» естественно соотносит любовь с подлежащим «Бог» и передаёт значение ἑαυτοῦ без тяжеловесного сочетания «свою собственную любовь».
- source_word: εἰς ἡμᾶς
  choice: к нам
  rationale: Предлог εἰς обозначает направленность Божьей любви; «к нам» точнее сохраняет этот образ и не смешивает его с последующим ὑπὲρ ἡμῶν.
- source_word: ὅτι
  choice: тем, что
  rationale: Оборот вводит содержание и способ, посредством которого Бог показывает любовь; русская конструкция естественно связывает обе части высказывания.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: когда мы ещё были грешниками
  rationale: Родительный самостоятельный оборот передан временным придаточным; «ещё» сохраняет силу ἔτι, а существительное «грешниками» — личностную форму греческого выражения.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Здесь Χριστός сохраняет значение мессианского титула; перевод «Мессия» раскрывает его для современного читателя, не сводя к неразъяснённой традиционной форме.
- source_word: ὑπὲρ ἡμῶν
  choice: за нас
  rationale: «За нас» кратко и естественно передаёт направленность смерти Мессии на наше благо, не определяя точнее спорный оттенок представительства или замещения.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямая передача простого аориста; завершённость события в русском языке ясна из формы прошедшего времени и контекста.
theological_decisions:
- issue: Передача Χριστός в речи Павла
  choice: Мессия
  alternative: Христос
  rationale: В данном месте слово функционирует как христологический титул. «Мессия» сохраняет его исходное титульное содержание; традиционный вариант отмечен в сноске.
- issue: Смысл ὑπὲρ ἡμῶν
  choice: за нас
  alternative: ради нас; вместо нас
  rationale: Греческое выражение несомненно указывает, что смерть Мессии совершилась ради нашего блага, но само по себе здесь не требует сузить смысл до одной модели искупления. Поэтому основной текст сохраняет более широкую формулировку.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. Структура аргумента сохранена, но греческий родительный самостоятельный оборот преобразован в естественное русское придаточное. Местоимение «свою» написано со строчной буквы согласно общелитературной норме и во избежание конфессионально-редакционной маркированности.
