lexical_decisions:
- source_word: καυχώμεθα
  choice: радуемся
  rationale: В данном контексте слово выражает уверенное ликование, основанное на Божьем действии, а не самодовольное хвастовство. «Радуемся» естественно звучит по-русски и сохраняет положительную направленность высказывания.
- source_word: θλίψεσιν / θλῖψις
  choice: в скорбях / скорбь
  rationale: «Скорбь» передаёт переживание давления, бедствий и страданий. Сохранён переход от множественного числа в описании переживаемых обстоятельств к единственному числу в общем утверждении.
- source_word: ὑπομονήν
  choice: стойкость
  rationale: «Стойкость» передаёт терпеливую способность не отступать под давлением и звучит естественно в современном русском языке.
- source_word: κατεργάζεται
  choice: производит
  rationale: 'Глагол ясно передаёт причинно-результативный смысл: скорбь приводит к формированию стойкости.'
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастная конструкция прямо отражает греческое причастие и не уточняет сверх текста логический оттенок связи.
theological_decisions:
- issue: Значение καυχώμεθα в духовно положительном контексте
  choice: радуемся
  alternative: хвалимся / торжествуем
  rationale: Выбор передаёт положительную уверенность в том, что Бог совершает через скорбь, и избегает возможного в современном русском языке оттенка самолюбивого хвастовства. Лексическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис близок к греческому, но остаётся естественным и понятным. «Скорбь» употреблено в широком смысле бедствий и страданий. Подлинная смысловая широта καυχώμεθα сохранена в основном выборе без конфессионального истолкования.
