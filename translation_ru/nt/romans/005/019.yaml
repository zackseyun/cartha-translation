  source_fidelity: 'Перевод точно воспроизводит синтаксический параллелизм оригинала: «через непослушание — через послушание», аорист в первой части и будущее в второй («стали — станут»), а также не раскрывает интерпретативно объём οἱ πολλοί. «Стали грешниками / станут праведными» является естественной русской передачей пассивных форм καθίστημι и не подменяет их термином «оправдать». Эллипсис ἀνθρώπου во второй части корректно сохранён.'
