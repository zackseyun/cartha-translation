  terminology: «Непослушание», «послушание», «грешники» и «праведные» точно и последовательно передают ключевую лексику. Перевод не навязывает ни судебного («объявлены праведными»), ни преобразующего истолкования и соответствует осторожности английского аудиторского следа.
