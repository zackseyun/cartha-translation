id: ROM.5.19
reference: Romans 5:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: ru
  text: Ибо как через непослушание одного человека многие стали грешниками[a], так и через послушание одного[b] многие станут праведными[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были поставлены в положение грешников».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «одного»; слово «человека» подразумевается из первой части предложения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будут поставлены в положение праведных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: непослушание
  rationale: Прямо передаёт отказ повиноваться и сохраняет смысловой контраст с ὑπακοή — «послушанием».
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: одного человека
  rationale: Естественно по-русски передаёт выражение, которое в контексте указывает на Адама, не заменяя его имя толкованием.
- source_word: ἁμαρτωλοὶ
  choice: грешниками
  rationale: Прилагательное употреблено предикативно; существительное в творительном падеже ясно и естественно передаёт его функцию после «стали».
- source_word: κατεστάθησαν
  choice: стали
  rationale: Передаёт переход или поставление в определённое положение естественным современным русским языком; более буквальная возможность отмечена в сноске.
- source_word: οἱ πολλοί
  choice: многие
  rationale: Русский язык не имеет артикля; «многие» естественно передаёт выражение, не расширяя его толковательно до «все».
- source_word: ὑπακοῆς
  choice: послушание
  rationale: Сохраняет прямой лексический и риторический контраст с «непослушанием».
- source_word: τοῦ ἑνὸς
  choice: одного
  rationale: Вторая часть по-гречески опускает ἀνθρώπου; русское «одного» естественно отсылает к «одному человеку» в первой части и сохраняет эллипсис.
- source_word: δίκαιοι
  choice: праведными
  rationale: Точно передаёт δίκαιοι в контексте Павлова употребления корня δικ- и не подменяет его более узким толкованием.
- source_word: κατασταθήσονται
  choice: станут
  rationale: Сохраняет будущую форму и параллель с «стали», не подменяя глагол καθίστημι глаголом «оправдывать».
theological_decisions:
- issue: Объём выражения οἱ πολλοί
  choice: многие
  alternative: все; множество людей
  rationale: Перевод сохраняет формулировку Павла и не разрешает толковательно вопрос о её объёме.
- issue: Характер праведности в κατασταθήσονται δίκαιοι
  choice: станут праведными
  alternative: будут объявлены праведными; будут поставлены в положение праведных
  rationale: В оригинале употреблён καθίστημι, а не δικαιόω; выбранный перевод сохраняет формулировку и не навязывает исключительно судебного либо преобразующего истолкования.
translation_notes:
  register: 'Современный литературный русский язык с сохранением симметрии двух частей стиха: «непослушание — послушание», «стали — станут», «грешниками — праведными». Союз «ибо» поддерживает аргументативный характер контекста; оборот «через» одинаково передан в обеих частях.'
