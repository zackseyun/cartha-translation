  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: ru
  text: Итак, оправданные верой[b], мы имеем[a] мир с Богом через нашего Господа Иисуса Мессию[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «будем же иметь мир с Богом».'
    reason: textual_variant
  - marker: b
    text: 'Или: «на основании веры».'
    reason: lexical_alternative
  - marker: c
    text: 'Греч. Христос — «Мессия»; традиционно: «Христос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: оправданные
  rationale: Аористное страдательное причастие передаёт совершившееся оправдывающее действие над людьми, не уточняя его механизм и не заменяя текст более узким толкованием вроде «объявленные праведными» или «сделанные праведными».
- source_word: οὖν
  choice: итак
  rationale: Естественно и ясно обозначает вывод из предшествующего рассуждения Павла.
- source_word: ἐκ πίστεως
  choice: по вере
  rationale: Передаёт основание оправдания и сохраняет характерную для русского библейского языка краткость; вариант «на основании веры» дан в сноске как более развёрнутое выражение.
- source_word: εἰρήνην
  choice: мир
  rationale: Сохраняет прямое значение существительного и широту образа восстановленных отношений с Богом, не сужая его до внутреннего спокойствия или истолковывающего термина «примирение».
- source_word: ἔχομεν
  choice: мы имеем
  rationale: Следует чтению издания SBLGNT с формой изъявительного наклонения; известное сослагательное чтение отражено в сноске.
- source_word: πρὸς τὸν θεὸν
  choice: с Богом
  rationale: При слове «мир» это естественное русское выражение отношений мира между людьми и Богом.
- source_word: κυρίου
  choice: Господа
  rationale: Обычный и уместный в данном контексте эквивалент κύριος, сохраняющий значение титула.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  rationale: Χριστός передан по смыслу как титул «Мессия», а не как непрозрачное заимствование; русское падежное согласование делает форму «Иисуса Мессию» грамматически естественной.
theological_decisions:
- issue: Значение Δικαιωθέντες в богословии Павла
  choice: Передано как «оправданные» без развёртывания в законченную вероучительную формулу.
  alternative: «объявленные праведными» или «сделанные праведными»
  rationale: Сам стих утверждает совершившееся оправдывающее действие, но не разрешает здесь все вопросы о его характере; краткий традиционный термин сохраняет эту богословскую напряжённость.
- issue: Смысл выражения «мир с Богом»
  choice: Сохранено прямое выражение «мир с Богом», прежде всего указывающее на отношения с Богом.
  alternative: «внутренний мир от Бога» или явное «примирение с Богом»
  rationale: Греческий текст говорит именно о мире по отношению к Богу. Перевод не сводит его к субъективному чувству и не подменяет более истолковывающим словом.
- issue: Текстуальный вариант ἔχομεν / ἔχωμεν
  choice: 'Основной текст следует ἔχομεν: «мы имеем».'
  alternative: 'ἔχωμεν: «будем же иметь» / «да будем иметь»'
  rationale: Предоставленный текст SBLGNT печатает изъявительное наклонение. Значимое побудительное чтение сохранено в сноске, а не устранено.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет причинно-логическую связь греческого причастного оборота, оставаясь понятным обычному читателю. Термины «оправданные», «мир» и «Мессия» переданы кратко, без конфессионально обусловленного расширения.
