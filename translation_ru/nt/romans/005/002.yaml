  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: ru
  text: через Него мы также получили верой доступ к этой благодати, в которой стоим, и хвалимся[a] надеждой на славу Божью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радуемся»; или: «ликуем».'
    reason: Лексические альтернативы для καυχώμεθα передают его положительную эмоциональную окраску, но несколько смягчают буквальный смысл «хвалимся».
lexical_decisions:
- source_word: δι’ οὗ
  choice: через Него
  rationale: Контекст указывает на Иисуса Христа из предыдущего стиха. Личное местоимение делает продолжение фразы естественным по-русски; предлог «через» сохраняет посреднический смысл греческого оборота.
- source_word: προσαγωγή
  choice: доступ
  rationale: «Доступ» естественно передаёт возможность войти в дарованное Богом положение благодати; варианты «вход» и «представление» здесь менее точны или менее естественны.
- source_word: τῇ πίστει
  choice: верой
  rationale: 'Творительный падеж естественно передаёт инструментальное значение дательного: доступ получен верой.'
- source_word: χάρις
  choice: благодать
  rationale: «Благодать» — ясный и устойчивый русский эквивалент в контексте данного Богом незаслуженного расположения.
- source_word: ἑστήκαμεν
  choice: стоим
  rationale: Греческий перфект обозначает достигнутое и сохраняющееся состояние; настоящее время «стоим» естественно выражает его продолжающийся результат.
- source_word: καυχώμεθα
  choice: хвалимся
  rationale: «Хвалимся» сохраняет намеренно напряжённую лексику Павла и связь с другими употреблениями того же глагола, не сглаживая её до одной лишь радости.
- source_word: ἐπ’ ἐλπίδι
  choice: надеждой
  rationale: Творительный падеж после «хвалимся» естественно передаёт надежду как содержание и основание хвалы, не вынуждая выбирать только одно из этих близких значений.
- source_word: δόξης τοῦ θεοῦ
  choice: славу Божью
  rationale: Передаёт прозрачную родительную конструкцию «слава Бога» естественным и торжественным русским выражением.
theological_decisions:
- issue: Передача καυχώμεθα с сохранением богословского напряжения
  choice: хвалимся
  alternative: радуемся; ликуем
  rationale: Более мягкие варианты хорошо передают положительную эмоциональную окраску, но ослабляют характерную для Павла парадоксальную мысль о допустимой хвале, направленной на Божье действие и обещание.
- issue: Смысл совершенного вида в ἐσχήκαμεν и ἑστήκαμεν
  choice: получили доступ … стоим
  alternative: имеем доступ … утвердились
  rationale: Так сохраняются как предшествующее получение доступа, так и нынешнее устойчивое положение в благодати, без добавления идеи человеческой заслуги или самостоятельного утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов упрощён ради ясности, при этом сохранены логические связи греческого текста. Прописная буква в «Него» служит традиционным русским указанием на Христа в контексте предыдущего стиха.
