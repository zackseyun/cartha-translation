  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: ru
  text: А надежда не постыжает[a], потому что Божья любовь[b] излита в наших сердцах через данного нам Святого Духа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не разочаровывает».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, что менее вероятно: «любовь к Богу».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: надежда
  rationale: Обычный и точный русский эквивалент; артикль имеет обобщающее значение и не требует указательного уточнения.
- source_word: δέ
  choice: А
  rationale: Передаёт лёгкую связь с предыдущей мыслью, не усиливая её до резкого противопоставления.
- source_word: καταισχύνει
  choice: не постыжает
  rationale: Сохраняет основное значение, связанное со стыдом и позором, а не сводит его лишь к несбывшимся ожиданиям.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: Божья любовь
  rationale: Естественно передаёт греческое сочетание; контекст прежде всего указывает на любовь Бога к людям, но формальная неоднозначность генитива отмечена в сноске.
- source_word: ἐκκέχυται
  choice: излита
  rationale: Результативная форма естественно передаёт совершившееся действие с сохраняющимся результатом; образ излияния сохранён.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: в наши сердца
  rationale: С глаголом «излита» русский винительный направления естественно выражает внесение любви внутрь сердец; смысл греческого ἐν сохраняется.
- source_word: διὰ πνεύματος ἁγίου
  choice: через Святого Духа
  rationale: Передаёт посредническое или инструментальное значение διά с родительным падежом и личный божественный референт.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: данного нам
  rationale: Причастный оборот прямо относится к Святому Духу и позволяет естественно избежать тяжеловесного придаточного предложения.
theological_decisions:
- issue: Значение родительного оборота в ἡ ἀγάπη τοῦ θεοῦ
  choice: Божья любовь, то есть преимущественно любовь Бога к нам
  alternative: наша любовь к Богу
  rationale: Причинная связь с надеждой и упоминание дара Святого Духа поддерживают понимание любви как исходящей от Бога. Однако грамматически возможное объектное понимание не устранено и приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Не постыжает» несколько возвышенно, но понятно и сохраняет смысловую область греческого глагола; более разговорное «не разочаровывает» дано в сноске. Порядок слов упрощён для естественного русского звучания без утраты причинной связи.
