id: ROM.5.17
reference: Romans 5:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: ru
  text: Ведь если из-за проступка одного человека смерть воцарилась через него одного, то тем более те, кто получает изобилие благодати и дар праведности[a], будут царствовать в жизни через одного человека — Иисуса Христа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар справедливости».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисуса Мессию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: проступка
  rationale: «Проступок» передаёт нарушение или ложный шаг, сохраняя связь с противопоставлением Адама и Христа и не приобретая излишне юридического оттенка.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: воцарилась / будут царствовать
  rationale: Сохранена единая царская метафора и намеренная параллель между господством смерти и будущим царствованием получающих дар.
- source_word: περισσείαν
  choice: изобилие
  rationale: Передаёт полноту, превышающую обычную меру, и естественно сочетается в русском языке с «благодатью».
- source_word: χάριτος
  choice: благодати
  rationale: Устоявшийся и уместный в контексте Павла эквивалент, выражающий незаслуженный Божий дар и благоволение.
- source_word: δωρεᾶς
  choice: дар
  rationale: Кратко и точно передаёт безвозмездно данное; идея незаслуженности уже поддержана словом «благодать».
- source_word: δικαιοσύνης
  choice: праведности
  rationale: В контексте сопоставления Адама и Христа «праведность» сохраняет оправдательный и реляционный смысл; возможный оттенок справедливости отмечен в сноске.
- source_word: λαμβάνοντες
  choice: те, кто получает
  rationale: Причастие характеризует людей как получающих благодать и дар; настоящее время и активное получение сохранены без добавления идеи заслуги.
- source_word: ἐν ζωῇ
  choice: в жизни
  rationale: Сохранено краткое греческое выражение и его прямое противопоставление царствованию смерти.
- source_word: διὰ τοῦ ἑνός
  choice: через него одного / через одного человека
  rationale: Повторение «одного» сохранено как важная часть параллели Адам—Христос; местоимение в первой части делает русский текст естественнее, не устраняя референта.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В русском сочетание функционирует как устойчивое имя с титулом; мессианское значение Χριστός сохранено как вариант в сноске.
theological_decisions:
- issue: Значение δικαιοσύνης в выражении τῆς δωρεᾶς τῆς δικαιοσύνης
  choice: дар праведности
  alternative: дар справедливости
  rationale: «Праведность» лучше соответствует непосредственному контексту оправдания и противопоставлению Адама и Христа, но более широкий смысл справедливости не исключён и указан в сноске.
- issue: Передача Χριστοῦ в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  alternative: Иисуса Мессию
  rationale: В данном сочетании Χριστός в русском естественно воспринимается как устойчивый титул при имени; буквальное раскрытие титула «Мессия» дано как допустимый вариант.
- issue: Референт τοῦ ἑνός в первой и второй половинах стиха
  choice: В первой половине — один человек, Адам; во второй — один человек, Иисус Христос
  alternative: Сохранить только субстантивированное «одного» без слова «человек»
  rationale: Слово «человек» подразумевается контекстом Рим 5 и необходимо для ясного современного русского, при этом повтор «одного» и богословская параллель не устранены.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизмов. Сохранены повтор слова «один», царская метафора и напряжённое противопоставление смерти и жизни. Добавленное для естественности слово «человек» явно следует ближайшему контексту и не вводит нового толкования.
