  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: ru
  text: чтобы, как грех царствовал в смерти, так и благодать царствовала через праведность[a] к вечной жизни через Иисуса Христа, нашего Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза с последующим сослагательным наклонением, не устраняя присущую конструкции смысловую широту.
- source_word: ἐβασίλευσεν
  choice: царствовал
  rationale: Сохраняет царскую метафору Павла и передаёт аорист изъявительного наклонения естественной русской формой прошедшего времени.
- source_word: ἐν τῷ θανάτῳ
  choice: в смерти
  rationale: Буквально и компактно сохраняет вероятное значение сферы у ἐν, не заменяя его более толковательным «через смерть».
- source_word: ἡ χάρις
  choice: благодать
  rationale: Общепринятый русский библейский эквивалент, сохраняющий олицетворение и противопоставление греху.
- source_word: βασιλεύσῃ
  choice: воцарилась
  rationale: Сослагательная форма после «чтобы» естественно передаёт греческий аорист конъюнктива; глагол сохраняет образ царствования, а приставка делает русскую фразу идиоматичной.
- source_word: διὰ δικαιοσύνης
  choice: через праведность
  rationale: «Праведность» сохраняет широкий павловский смысл δικαιοσύνη, а «через» передаёт διά с родительным как средство или посредство.
- source_word: εἰς ζωὴν αἰώνιον
  choice: к вечной жизни
  rationale: Сохраняет направительное значение εἰς и не сводит отношение к простому результату.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В современном литературном русском «Иисус Христос» — естественная и прозрачная форма титула Χριστός; искусственная конструкция «Иисус Мессия» здесь не требуется.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Точно передаёт приложение с притяжательным местоимением и сохраняет традиционное достоинство обращения.
theological_decisions:
- issue: Значение δικαιοσύνη в павловском контексте
  choice: через праведность
  alternative: через справедливость / правосудие
  rationale: Основной текст сохраняет привычный и широкий богословский смысл «праведность», тогда как примечание отмечает этико-судебную сторону слова, не навязывая единственного истолкования.
- issue: Статус Χριστός как титула
  choice: Иисуса Христа
  alternative: Иисуса Мессии
  rationale: Русское «Христос» остаётся узнаваемым титулом и является естественным соответствием греческому Χριστός; вариант «Мессия» семантически возможен, но в данной формуле менее идиоматичен.
- issue: Цель или результат в ἵνα ... βασιλεύσῃ
  choice: чтобы ... воцарилась
  alternative: так что ... воцарилась
  rationale: «Чтобы» сохраняет грамматически выраженную цель, одновременно не исключая результативного оттенка, возникающего из контекста.
translation_notes:
  register: Современный литературный русский с сохранением торжественной царской метафоры и компактного синтаксиса оригинала. «В смерти» намеренно оставлено без поясняющего расширения; повтор образа царствования передан парой «царствовал — воцарилась».
