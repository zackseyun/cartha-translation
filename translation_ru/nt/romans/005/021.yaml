  source_fidelity: 'Основная структура и лексические соответствия точны: ἵνα передано союзом «чтобы», ἐν τῷ θανάτῳ — как «в смерти», а διά δικαιοσύνης и εἰς ζωὴν αἰώνιον сохранены без излишнего толкования. Однако «воцарилась» обычно обозначает вступление на царство, тогда как βασιλεύσῃ продолжает метафору царствования и не выражает начала правления.'
  naturalness: «Чтобы ... благодать царствовала» — естественная для современного литературного русского конструкция и лучше сохраняет параллелизм с «грех царствовал». «К вечной жизни» несколько формально, но уместно и передаёт направленность εἰς.
  terminology: «Благодать», «праведность», «вечная жизнь», «Иисус Христос» и «наш Господь» нормативны для современного русского библейского регистра. В сноске достаточно дать «справедливость» как лексическую альтернативу; «правосудие» чрезмерно сужает значение δικαιοσύνη и не требуется источником.
