  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: ru
  text: 'И дар не подобен тому, что произошло через одного согрешившего[a]: судебное решение из-за одного преступления[b] привело к осуждению, а дар благодати после многих преступлений — к оправданию[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через одного человека, который согрешил».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от одного»; возможно также понимание: «от одного человека».'
    reason: source_ambiguity
  - marker: c
    text: 'Или: «к оправдательному приговору».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: дар
  rationale: Передаёт значение данного дара без избыточного добавления «бесплатный»; в первом полустишии сохраняет лаконичность греческого текста.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: через одного согрешившего
  rationale: Сохраняет личную отсылку к одному человеку и сжатость греческой конструкции; подразумеваемое последствие выражено нейтральным «то, что произошло».
- source_word: κρίμα
  choice: суд
  rationale: Обозначает судебное решение или акт суда и естественно вводит противопоставление осуждению и оправданию.
- source_word: ἐξ ἑνὸς
  choice: за одно преступление
  rationale: Средний род ἑνός в противопоставлении «многим преступлениям» вероятнее всего подразумевает одно преступление; предлог «за» естественно выражает основание судебного решения по-русски.
- source_word: κατάκριμα
  choice: осуждение
  rationale: Точно передаёт отрицательный судебный исход и сохраняет связь с традиционной, но современной русской юридико-богословской лексикой.
- source_word: χάρισμα
  choice: дар благодати
  rationale: Отражает связь χάρισμα с благодатью и отличает это слово от более общего δώρημα в первой части стиха.
- source_word: παραπτωμάτων
  choice: преступлений
  rationale: Передаёт нарушения, имеющие нравственный и судебный характер; в данном контексте звучит яснее, чем архаичное «прегрешений».
- source_word: δικαίωμα
  choice: оправдание
  rationale: В судебном противопоставлении κατάκριμα обозначает положительный исход, противоположный осуждению; при этом альтернативный оттенок оправдательного приговора отмечен в сноске.
theological_decisions:
- issue: Судебное значение δικαίωμα в противопоставлении κατάκριμα
  choice: оправдание как судебный исход, противоположный осуждению
  alternative: оправдательный приговор; признание праведным
  rationale: Структура стиха строится на судебной антитезе. «Оправдание» сохраняет богословски значимый термин Павла, не исключая более конкретного смысла оправдательного решения.
- issue: Референт ἐξ ἑνὸς
  choice: одно преступление
  alternative: один человек
  rationale: Ближайшее структурное противопоставление ἐκ πολλῶν παραπτωμάτων указывает на одно преступление, хотя эллиптичность греческого текста допускает понимание «от одного».
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-богословского контекста. Синтаксический параллелизм «суд… к осуждению / дар благодати… к оправданию» сохраняет риторическую структуру оригинала; эллипсис во второй части передан тире.
