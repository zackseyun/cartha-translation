  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: ru
  text: Закон же был введён дополнительно[a], чтобы умножилось преступление[b]; но где умножился грех, там благодать преизобиловала[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вошёл наряду с этим»; греческий глагол указывает на вхождение в дополнение к чему-либо уже существующему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проступок»; также возможно: «нарушение».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стала несравненно изобильнее».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: закон
  rationale: С артиклем и в контексте Послания к римлянам речь естественнее всего идёт о Моисеевом законе; в русском тексте строчная буква соответствует обычной издательской норме.
- source_word: παρεισῆλθεν
  choice: вошёл следом
  rationale: Передаёт не просто вхождение, но присоединение к уже существовавшему положению, сохраняя оттенок приставки παρα- и связь с предшествующим рассуждением об Адаме.
- source_word: ἵνα πλεονάσῃ
  choice: чтобы умножилось
  rationale: Сохраняет целевую конструкцию ἵνα с сослагательным наклонением и не снимает богословского напряжения фразы.
- source_word: τὸ παράπτωμα
  choice: преступление
  rationale: Передаёт конкретный проступок или нарушение; единственное число сохранено в соответствии с греческим текстом и контекстом Адамова преступления.
- source_word: οὗ δὲ
  choice: но где ... там
  rationale: Естественная русская конструкция, ясно передающая относительное наречие οὗ и противопоставление δέ.
- source_word: ἡ ἁμαρτία
  choice: грех
  rationale: Устоявшийся и контекстуально точный эквивалент ἁμαρτία.
- source_word: ὑπερεπερίσσευσεν
  choice: преизобиловала
  rationale: 'Редкое, но понятное и достойное по регистру слово передаёт усиленное значение сложного глагола: благодать не просто умножилась, а стала несравненно изобильнее.'
- source_word: ἡ χάρις
  choice: благодать
  rationale: Устоявшийся русский богословский эквивалент χάρις, понятный в павловском контексте.
theological_decisions:
- issue: Следует ли передавать ἵνα как цель или смягчать до результата, чтобы избежать мысли о Божьем намерении умножить преступление?
  choice: чтобы умножилось преступление
  alternative: так что преступление умножилось
  rationale: Греческая конструкция прямо выражена через ἵνα с сослагательным наклонением. Перевод сохраняет целевую силу и присущее высказыванию богословское напряжение, не добавляя утверждения о нравственном одобрении греха.
- issue: Относится ли τὸ παράπτωμα к одному Адамову преступлению или к нарушениям вообще?
  choice: 'единственное число: «преступление»'
  alternative: «преступления» или «нарушения»
  rationale: Форма греческого текста стоит в единственном числе и перекликается с неоднократным употреблением παράπτωμα в ближайшем контексте об Адаме; перевод не устраняет возможную более широкую обобщающую силу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Союз «же» передаёт δέ без добавления отсутствующего в оригинале временного «теперь». Лексема «преизобиловала» слегка возвышенна, однако прозрачна по смыслу и точно сохраняет усиление в ὑπερεπερίσσευσεν.
