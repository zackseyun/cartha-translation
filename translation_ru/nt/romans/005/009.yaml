  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: ru
  text: Итак, тем более теперь, когда мы оправданы Его кровью[a], мы будем спасены через Него от гнева[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Его кровь».'
    reason: lexical_alternative
  - marker: b
    text: То есть от Божьего гнева, подразумеваемого контекстом.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: И потому тем более
  rationale: Передаёт как логический вывод οὖν, так и усиление πολλῷ ... μᾶλλον; двоеточие естественно вводит основание последующего утверждения.
- source_word: δικαιωθέντες νῦν
  choice: теперь, когда мы оправданы
  rationale: Передаёт предшествующее и уже состоявшееся действие аористного страдательного причастия и сохраняет νῦν без тяжеловесной русской причастной конструкции.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: Его кровью
  rationale: Творительный падеж естественно выражает средство или основание; буквальное «в Его крови» в современном русском здесь менее ясно.
- source_word: σωθησόμεθα
  choice: мы будем спасены
  rationale: Будущее страдательное наклонение сохранено прямо, включая будущую направленность спасения в данном контексте.
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: Точно передаёт διά с родительным как посредство или действие через Христа.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: от гнева
  rationale: Сохраняет лаконичность греческого текста и не добавляет явно не названного обладателя гнева; определённость в русском не требует отдельного артикля.
theological_decisions:
- issue: Смысл δικαιωθέντες
  choice: оправданы
  alternative: признаны праведными
  rationale: «Оправданы» сохраняет устойчивый павловский термин и его богословскую ёмкость, не сводя значение к одной пояснительной формуле.
- issue: К чему относится ἡ ὀργή
  choice: от гнева
  alternative: от Божьего гнева
  rationale: Контекст подразумевает Божий гнев, однако слово «Божьего» отсутствует в греческом тексте, поэтому оно не внесено в основной перевод.
- issue: Функция ἐν в выражении о крови
  choice: Его кровью
  alternative: через Его кровь
  rationale: Творительный передаёт средство или основание естественным русским способом, не уточняя сверх текста механизм искупления.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Синтаксис облегчён придаточным оборотом «когда мы оправданы», при этом логика, временная перспектива и богословская напряжённость оригинала сохранены.
