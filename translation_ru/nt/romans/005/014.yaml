  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: ru
  text: Но смерть царствовала от Адама до Моисея даже над теми, кто не совершил греха, подобного преступлению Адама. Адам — прообраз[a] Грядущего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «образец», «образ».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть: «того, кто должен был прийти». В данном контексте речь идёт о Христе.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущему утверждению и естественно звучит по-русски.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: смерть царствовала
  rationale: Сохраняет образ смерти как царствующей силы и метафору βασιλεύω.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: от Адама до Моисея
  rationale: Ясно и естественно обозначает временной промежуток.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: даже над теми, кто не согрешил
  rationale: «Даже» передаёт усилительное значение καί, а «над» обозначает область господства смерти.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: подобно преступлению Адама
  rationale: Передаёт сравнение без уточнения того, в каком именно отношении грех этих людей отличался от поступка Адама; несколько тяжеловесная буквальная конструкция по-русски устранена.
- source_word: παράβασις
  choice: преступление
  rationale: Выражает нарушение установленной заповеди или границы и соответствует контексту поступка Адама.
- source_word: τύπος
  choice: прообраз
  rationale: В русском библейском и литературном употреблении естественно передаёт типологическое соответствие, не сводя его просто к примеру или сходству.
- source_word: τοῦ μέλλοντος
  choice: Грядущего
  rationale: Сохраняет субстантивированное обозначение будущей фигуры, не вставляя имя Христа непосредственно в основной текст.
theological_decisions:
- issue: К кому относится «Грядущий»
  choice: В тексте оставлено «Грядущего», с контекстуальным указанием на Христа в сноске.
  alternative: Прямо перевести «Христа» или оставить менее определённое «того, кому предстояло прийти».
  rationale: Рим 5:12–21 указывает на Христа как соответствующую Адаму фигуру, однако греческий текст здесь не называет его по имени; перевод сохраняет и референцию, и формальную сдержанность оригинала.
- issue: Характер сходства между грехом других людей и преступлением Адама
  choice: Сохранено общее выражение «не согрешил подобно преступлению Адама».
  alternative: 'Уточнить: «не нарушил прямой заповеди, как Адам» или «не согрешил точно так же, как Адам».'
  rationale: Оригинал утверждает отсутствие подобия, но не раскрывает его основание; перевод не навязывает конкретное богословское объяснение.
translation_notes:
  register: Современный литературный русский язык с сохранением павловского образа царствующей смерти. «Грядущий» имеет возвышенную, но понятную библейскую окраску; разбиение последней части на отдельное предложение устраняет двусмысленное присоединение относительного местоимения и естественно для русского синтаксиса.
