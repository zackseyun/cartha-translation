  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: ru
  text: Ведь когда мы были ещё бессильны, Мессия в назначенное время умер за нечестивых[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради нечестивых».'
    reason: 'Сохраняется смысловой диапазон предлога ὑπέρ: действие ради кого-либо, ему во благо или за него.'
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передано переводным титулом, а не традиционной транслитерацией «Христос», в соответствии с титульным употреблением Χριστός.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: когда мы были ещё бессильны
  rationale: Генитив абсолютный естественно передан временным придаточным; «бессильны» выражает неспособность и беспомощность, не сводя смысл к физической слабости.
- source_word: ἔτι
  choice: ещё
  rationale: Наречие обозначает продолжавшееся состояние; одного явного «ещё» достаточно для естественного русского текста, несмотря на текстуальное повторение в греческой традиции.
- source_word: κατὰ καιρὸν
  choice: в назначенное время
  rationale: Фраза указывает на надлежащее, определённое время; формулировка сохраняет эту мысль без дальнейшего догматического уточнения.
- source_word: ὑπὲρ
  choice: за
  rationale: В контексте смерти естественное русское «умер за» сохраняет пользу, представительство и возможный заместительный оттенок, не фиксируя единственную богословскую модель.
- source_word: ἀσεβῶν
  choice: нечестивых
  rationale: Передаёт нравственно-религиозный смысл людей, не почитающих Бога, и соответствует современному литературному библейскому регистру.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямое соответствие аористной форме без неоправданного расширения.
theological_decisions:
- issue: Смысл смерти Мессии, выраженный ὑπὲρ ἀσεβῶν
  choice: за нечестивых
  alternative: ради нечестивых / на благо нечестивых
  rationale: «За» естественно и ёмко передаёт, что смерть была ради них и в их пользу, сохраняя открытым точный оттенок представительства или замещения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Порядок слов сделан естественным для русского; причинно-пояснительное γάρ передано как «ведь».
