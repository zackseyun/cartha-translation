  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: ru
  text: Ведь едва ли кто-нибудь умрёт за праведного человека[a], а за доброго человека кто-нибудь, быть может, и решится умереть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, Павел намеренно различает «праведного» и «доброго» человека, а не просто употребляет близкие по смыслу слова.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: едва ли
  rationale: Передаёт крайне малую вероятность поступка и естественно звучит в русском обобщающем высказывании.
- source_word: ὑπὲρ
  choice: за
  rationale: В данном контексте обозначает смерть ради другого, в его пользу; русское «за» кратко и естественно передаёт этот смысл.
- source_word: δικαίου
  choice: праведного человека
  rationale: Субстантивированное прилагательное обозначает человека, отличающегося праведностью. Добавление «человека» ясно передаёт обобщённое значение, не ограничивая его мужчиной.
- source_word: ἀποθανεῖται
  choice: умрёт
  rationale: Прямо сохраняет будущее время греческой формы в общем утверждении.
- source_word: τοῦ ἀγαθοῦ
  choice: доброго человека
  rationale: 'Сохраняет возможное смысловое различие между δικαίου и ἀγαθοῦ: праведностью и добротой, не сводя второе без достаточных оснований к специальному значению «благодетель».'
- source_word: τάχα
  choice: возможно
  rationale: Передаёт осторожное указание на возможность и соответствует сдержанному тону фразы.
- source_word: καὶ
  choice: и
  rationale: 'В конструкции «и решится» имеет усилительное значение, соответствующее восходящему καί: кто-нибудь даже может отважиться на это.'
- source_word: τολμᾷ
  choice: решится
  rationale: Естественно передаёт идею готовности отважиться на исключительный поступок; в сочетании с «возможно» сохраняет модальную осторожность оригинала.
- source_word: ἀποθανεῖν
  choice: умереть
  rationale: Прямой перевод инфинитива, сохраняющий повтор мотива смерти в обеих частях стиха.
theological_decisions:
- issue: Сохранять ли различие между δικαίου и ἀγαθοῦ
  choice: 'Передать разными выражениями: «праведного человека» и «доброго человека».'
  alternative: Рассматривать оба слова как стилистические синонимы и сгладить различие.
  rationale: 'Различие может быть намеренным: первый термин подчёркивает праведность или справедливость, второй — положительную доброту человека. Перевод сохраняет возможное напряжение, не навязывая точного объяснения.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и доступным синтаксисом. Повтор «человека» сохранён ради прозрачного сопоставления двух нравственных характеристик; частица «и» в выражении «и решится» передаёт усиление.
