base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: ru
  text: 'Поэтому Бог предал их постыдным страстям: ибо даже их женщины сменили естественные отношения на противоестественные[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «естественное употребление»; далее: «на то, что против природы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь с предшествующим рассуждением.
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: Бог предал их
  rationale: Сохраняет сильное значение παραδίδωμι — отдать, предать — и судебный оттенок контекста.
- source_word: πάθη ἀτιμίας
  choice: постыдным страстям
  rationale: Передаёт нравственно-оценочную силу ἀτιμία, не усиливая её дополнительным толкованием.
- source_word: αἵ τε γὰρ θήλειαι αὐτῶν
  choice: даже их женщины
  rationale: «Женщины» естественно для современного русского языка; частицы τε γάρ в контексте вводят подтверждающий пример, выраженный по-русски словом «даже» после двоеточия.
- source_word: μετήλλαξαν
  choice: заменили
  rationale: Передаёт намеренную смену одного другим; по-русски здесь звучит естественнее буквального «обменяли».
- source_word: τὴν φυσικὴν χρῆσιν
  choice: естественные отношения
  rationale: Контекстуально передаёт сексуальный смысл χρῆσις, избегая в русском неестественного и потенциально объективирующего буквального «употребления».
- source_word: εἰς τὴν παρὰ φύσιν
  choice: противоестественными
  rationale: Кратко и точно передаёт противопоставление φυσικός и παρὰ φύσιν; субстантивированное выражение восполняется из предыдущего словосочетания.
theological_decisions:
- issue: Следует ли усиливать или смягчать нравственную оценку Павла
  choice: Сохранить выражения «постыдным страстям» и «противоестественными» без поясняющей парафразы.
  alternative: Смягчить оценку либо конкретизировать её посредством современных категорий, которых греческий текст прямо не называет.
  rationale: Исходный текст содержит явную оценку, которую перевод должен сохранить, но не должен выходить за рамки формулировок Павла.
- issue: Как передать τὴν φυσικὴν χρῆσιν
  choice: «естественные отношения»
  alternative: Буквальное «естественное употребление» или «естественное использование».
  rationale: Буквальные варианты по-русски неясны и звучат так, будто речь идёт об использовании человека; «отношения» сохраняет подразумеваемый контекст без излишней конкретизации.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный. Синтаксис сохраняет причинную связь и риторическое противопоставление оригинала; двоеточие естественно вводит подтверждающий пример.
