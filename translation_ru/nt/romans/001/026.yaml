  source_fidelity: 'Основной смысл передан точно: сохранены причинная связь, действие Бога («предал»), оценка «постыдные страсти» и противопоставление естественного тому, что против природы. Однако γάρ в αἵ τε γὰρ требует явного причинно-пояснительного союза («ибо»); одного «даже» недостаточно. Формулировка «заменили ... противоестественными» возможна, но «сменили ... на ...» яснее передаёт εἰς («на, взамен»).'
