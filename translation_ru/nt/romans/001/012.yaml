  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: ru
  text: то есть чтобы мы взаимно ободрились среди вас благодаря общей для нас вере — вашей и моей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: то есть
  rationale: Оборот поясняет предыдущее высказывание; «то есть» естественно передаёт его уточняющую функцию.
- source_word: συμπαρακληθῆναι
  choice: вместе с вами получить ободрение
  rationale: Сложный глагол обозначает совместное, взаимное ободрение. Такая формулировка сохраняет перспективу Павла, заданную контекстом, но не сводит действие к одностороннему воздействию.
- source_word: ἐν ὑμῖν
  choice: с вами
  rationale: В данном социально-локативном контексте речь идёт об ободрении в общении с римскими верующими; по-русски «с вами» звучит естественнее буквального «среди вас».
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: от веры друг друга
  rationale: Предлог διά с родительным указывает на средство или основание ободрения, а ἐν ἀλλήλοις выражает взаимность. Русское «от веры друг друга» сохраняет эту взаимную направленность.
- source_word: πίστεως
  choice: веры
  rationale: Здесь πίστις означает веру Павла и адресатов, а не преимущественно верность.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: вашей и моей
  rationale: Формулировка сохраняет уравновешенное указание как на веру адресатов, так и на веру Павла.
theological_decisions:
- issue: Одностороннее апостольское укрепление или взаимное ободрение Павла и римских верующих
  choice: взаимное ободрение Павла и адресатов
  alternative: преимущественно укрепление адресатов Павлом
  rationale: Компонент συν- в συμπαρακληθῆναι и заключительное «вашей и моей» указывают на совместность и взаимность; перевод не должен превращать служение в одностороннее.
- issue: Грамматически выраженный субъект инфинитива
  choice: сохранить контекстуальную перспективу Павла без явного местоимения «мы»
  alternative: «чтобы нам вместе ободриться»
  rationale: У инфинитива нет морфологически выраженного числа или лица; субъект восстанавливается из контекста. Безличная инфинитивная конструкция по-русски сохраняет подлинную неоднозначность между личной перспективой Павла и совместным действием.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, достойная по тону и естественная. «Получить ободрение» понятнее обычному читателю, чем книжное «соутешиться», а «вместе с вами» передаёт совместность, не вводя в греческий текст явно отсутствующего местоимения «мы».
