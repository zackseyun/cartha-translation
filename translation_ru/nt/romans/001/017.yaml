source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: ru
  text: 'Ведь в нём открывается праведность Божья[a] — от веры к вере[b], как написано: «Праведный будет жить верой»[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость Божья»; возможен также смысл: «праведность от Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение «от веры к вере» допускает разные толкования. Возможные переводы: «от веры для веры», «верой от начала до конца» или «через веру — для веры».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «Тот, кто праведен по вере, будет жить».'
    reason: alternative_reading
  - marker: d
    text: 'Возможный перевод с союзом: «Но праведный будет жить верой».'
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: праведность
  rationale: «Праведность» сохраняет традиционный и богословски ёмкий смысл слова δικαιοσύνη; возможный смысл «справедливость» отмечен в сноске.
- source_word: θεοῦ
  choice: Божья
  rationale: Притяжательная конструкция естественна по-русски и не разрешает спор о том, обозначает ли родительный падеж собственную праведность Бога, праведность от Бога или иную связь с Богом.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Местоимение среднего рода отсылает к Евангелию в Рим 1:16; русское «в нём» сохраняет эту связь.
- source_word: ἀποκαλύπτεται
  choice: открывается
  rationale: Настоящее время и страдательное значение переданы естественным русским глаголом без излишнего уточнения вида действия.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: от веры к вере
  rationale: Переданы обе греческие предлоговые конструкции и повтор слова πίστις; двусмысленность трудного выражения не снимается толкованием.
- source_word: δίκαιος
  choice: праведный
  rationale: Субстантивированное прилагательное в единственном числе передано кратко и в соответствии с традиционным русским языком библейской цитаты.
- source_word: ἐκ πίστεως
  choice: верой
  rationale: Творительный падеж естественно передаёт модальное или инструментальное значение, сохраняя возможность различного синтаксического присоединения.
- source_word: ζήσεται
  choice: жив будет
  rationale: Будущее время сохранено; порядок слов придаёт цитате достоинство и узнаваемость, оставаясь понятным современному читателю.
theological_decisions:
- issue: Значение δικαιοσύνη θεοῦ
  choice: праведность Божья
  alternative: справедливость Божья; праведность от Бога
  rationale: Греческий родительный падеж богословски неоднозначен. Основной текст сохраняет формальную связь с Богом, не сводя её к происхождению дара или только к Божьей справедливости.
- issue: Смысл ἐκ πίστεως εἰς πίστιν
  choice: от веры к вере
  alternative: от веры для веры; верой от начала до конца; через веру — к вере
  rationale: Буквально-направительная передача сохраняет обе предлоговые формы и риторический повтор, не выбирая одну из спорных интерпретаций.
- issue: Синтаксическое присоединение ἐκ πίστεως в цитате из Аввакума
  choice: Праведный верой жив будет
  alternative: Тот, кто праведен по вере, будет жить
  rationale: Русская формулировка сохраняет компактность греческой цитаты и допускает отнесение «верой» как к праведности, так и к жизни; альтернативный разбор дан в сноске.
- issue: Передача частицы δὲ
  choice: не выражать отдельным союзом в основном тексте
  alternative: Но праведный верой жив будет
  rationale: В данном контексте цитата подтверждает предыдущее утверждение, поэтому русское «но» могло бы создать чрезмерно резкое противопоставление; формальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным регистром. «Ведь» естественно передаёт пояснительное γάρ. В цитате сохранён традиционно-библейский, но понятный порядок слов «жив будет». Все подлинные лексические и синтаксические неоднозначности вынесены в сноски.
