  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: ru
  text: среди них и вы — призванные, принадлежащие Иисусу Мессии[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призванные Иисусом Мессией». Дословно греческая конструкция: «призванные Иисуса Мессии»; родительный падеж может указывать на принадлежность или на того, кто призывает.'
    reason: Греческий родительный падеж допускает как понимание принадлежности Иисусу Мессии, так и агентное понимание.
lexical_decisions:
- source_word: ἐν οἷς
  choice: среди них
  rationale: Местоимение во множественном числе относится к народам из предыдущего стиха; «среди них» естественно выражает включённость адресатов в эту группу.
- source_word: ἐστε καὶ ὑμεῖς
  choice: и вы
  rationale: Русская именная конструкция позволяет не передавать связку ἐστε отдельным словом; «и вы» сохраняет подчёркнутое включение римских верующих.
- source_word: κλητοὶ
  choice: призванные
  rationale: «Призванные» передаёт значение κλητοί и сохраняет богословскую весомость слова без уточнения, отсутствующего в самом прилагательном.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисусу Мессии
  rationale: Ἰησοῦ передано личным именем «Иисус», а Χριστοῦ — титулом «Мессия»; падеж обусловлен естественной русской передачей отношения принадлежности.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: призванные принадлежать Иисусу Мессии
  rationale: Греческий родительный падеж выражает сжатое отношение, вероятнее всего принадлежность или связь. В русском добавление «принадлежать» делает эту связь понятной, а другие возможные толкования сохранены в примечании.
theological_decisions:
- issue: Характер связи в выражении κλητοὶ Ἰησοῦ Χριστοῦ
  choice: призванные принадлежать Иисусу Мессии
  alternative: 'призванные Иисусом Мессией; буквально: призванные Иисуса Мессии'
  rationale: Основной текст естественно выражает принадлежность Мессии, не сводя родительный падеж к указанию на деятеля. Поскольку греческая конструкция допускает и иное понимание, неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; тире ясно связывает «и вы» с определением «призванные». Формулировка сохраняет достоинство апостольского стиля и остаётся понятной обычному читателю.
