  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: ru
  text: Ведь хотя они и знали Бога, они не прославили Его как Бога и не воздали Ему благодарности, но их размышления стали пустыми[a], а их неразумное сердце омрачилось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их мысли стали тщетными», «их рассуждения оказались пустыми».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте слово «сердце» стоит в единственном числе.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью и естественно звучит в начале русского предложения.
- source_word: γνόντες τὸν θεὸν
  choice: хотя они и знали Бога
  rationale: 'Контекстуально передаёт уступительное значение причастия: вопреки знанию Бога они не откликнулись должным образом.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: не прославили Его как Бога
  rationale: Сохраняет значение δοξάζω и мысль о славе, подобающей Богу именно как Богу.
- source_word: ἢ ηὐχαρίστησαν
  choice: и не возблагодарили
  rationale: В отрицательной русской конструкции соединение «и не» естественно передаёт второй однородный компонент греческого οὐχ … ἢ; объект понятен из контекста.
- source_word: ἐματαιώθησαν
  choice: предались пустым
  rationale: В сочетании с «рассуждениям» выражает наступившую тщетность мыслительной деятельности, не уточняя внешнего деятеля пассива.
- source_word: ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: пустым рассуждениям
  rationale: διαλογισμοί допускает значения рассуждений, мыслей и умствований; «рассуждения» сохраняет интеллектуальный оттенок и остаётся понятным современному читателю.
- source_word: ἐσκοτίσθη
  choice: омрачилось
  rationale: Сохраняет пассивно-результативный смысл и образ наступившей тьмы.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: их неразумное сердце
  rationale: «Неразумное» передаёт отсутствие понимания, не сводя выражение к низкому интеллекту; единственное число «сердце» сохранено как в греческом тексте.
theological_decisions:
- issue: Уступительное значение γνόντες
  choice: хотя они и знали Бога
  alternative: знав Бога / когда они познали Бога
  rationale: Контекст подчёркивает ответственность людей вопреки имевшемуся у них знанию; перевод сохраняет эту грамматико-контекстуальную напряжённость, не уточняя природу или полноту данного знания.
- issue: Залог и причинность ἐματαιώθησαν
  choice: предались пустым рассуждениям
  alternative: стали тщетны в своих рассуждениях / были обращены к суете в своих рассуждениях
  rationale: Формулировка передаёт результат без введения явно названного причинителя, которого греческий текст здесь не указывает.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. «Возблагодарили» слегка возвышенно, но общепонятно; синтаксис сохраняет единое причинно-контрастное движение греческого предложения.
