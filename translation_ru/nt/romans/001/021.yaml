  source_fidelity: 'Основная структура и ключевые термины переданы верно: уступительное значение γνόντες, «прославили ... как Бога», образ омрачённого сердца и единственное число «сердце» сохранены. Однако «предались пустым рассуждениям» не передаёт ἐματαιώθησαν: это возвратная активная формулировка, предполагающая добровольное обращение к рассуждениям, тогда как греческий пассив описывает их рассуждения/мышление как ставшие тщетными, без указания причины или деятеля.'
