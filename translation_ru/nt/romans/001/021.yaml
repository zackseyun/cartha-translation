  terminology: «Прославили», «Бога», «воздали ... благодарность», «размышления», «неразумное сердце» уместны и сохраняют богословски значимые элементы без конфессиональной интерпретации. «Воздать благодарность» ясно выражает направленность ηὐχαρίστησαν к Богу.
