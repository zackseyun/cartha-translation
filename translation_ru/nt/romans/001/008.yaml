id: ROM.1.8
reference: Romans 1:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: ru
  text: Прежде всего я благодарю моего Бога через Иисуса Мессию за всех вас, потому что о вашей вере[a] возвещают по всему миру.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верности»; возможно также: «доверии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Прежде всего
  rationale: Естественно обозначает начальный пункт рассуждения; частица μὲν отдельно не передаётся, поскольку ожидаемое продолжение формально не выражено.
- source_word: εὐχαριστῶ τῷ θεῷ μου
  choice: я благодарю моего Бога
  rationale: Сохраняет прямое значение глагола и личный характер выражения τῷ θεῷ μου.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: διά с родительным падежом выражает посредство; Χριστός передан как титул «Мессия», а не как утратившая прозрачность транслитерация.
- source_word: περὶ πάντων ὑμῶν
  choice: за всех вас
  rationale: В контексте благодарения περί естественно передаётся русским «за».
- source_word: ἡ πίστις ὑμῶν
  choice: вашей вере
  rationale: «Вера» — наиболее вероятное значение в контексте известности веры римских христиан; возможные оттенки доверия и верности отмечены в сноске.
- source_word: καταγγέλλεται
  choice: возвещают
  rationale: Неопределённо-личная конструкция естественно передаёт греческий пассив и продолжающееся публичное распространение вести.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: по всему миру
  rationale: Идиоматично передаёт широкий риторический охват выражения, относящегося к известному Павлу миру.
theological_decisions:
- issue: Передача Χριστοῦ в διὰ Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессию
  alternative: Иисуса Христа
  rationale: Χριστός здесь сохраняет силу мессианского титула; «Мессия» передаёт его значение непосредственно и естественно по-русски.
- issue: Значение πίστις в ἡ πίστις ὑμῶν
  choice: вера
  alternative: верность; доверие
  rationale: В контексте наиболее вероятна вера римлян, ставшая широко известной, но полисемия πίστις не устраняется и отмечается в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достойным, ясным библейским регистром. Порядок фразы слегка перестроен ради естественности: «о вашей вере возвещают», при этом пассивный смысл и публичный характер καταγγέλλεται сохранены.'
