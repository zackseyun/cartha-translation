lexical_decisions:
- source_word: Παῦλος
  choice: Павел
  rationale: Устоявшаяся русская форма имени.
- source_word: δοῦλος
  choice: раб
  rationale: Передаёт принадлежность господину и подчинённое положение, выраженные греческим словом, точнее, чем более мягкое «слуга».
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Сохраняет порядок греческих слов и передаёт Χριστός как титул со значением «Мессия», а не только как привычную часть имени.
- source_word: κλητὸς ἀπόστολος
  choice: призванный апостол
  rationale: Близко передаёт сочетание прилагательного и существительного, не разворачивая его однозначно в «призванный быть апостолом».
- source_word: ἀφωρισμένος
  choice: отделённый
  rationale: Сохраняет пассивное причастие и смысл выделения для особого назначения.
- source_word: εἰς
  choice: для
  rationale: Кратко и естественно выражает направленность и назначение.
- source_word: εὐαγγέλιον θεοῦ
  choice: Божьей Благой вести
  rationale: «Благая весть» ясно передаёт исходное значение εὐαγγέλιον, а притяжательное прилагательное естественно выражает греческий родительный падеж.
theological_decisions:
- issue: Степень подчинения в δοῦλος
  choice: раб
  alternative: слуга
  rationale: «Раб» сохраняет сильный смысл принадлежности и зависимости; «слуга» мог бы неоправданно ослабить выражение.
- issue: Передача Χριστός в самообозначении Павла
  choice: Мессия
  alternative: Христос
  rationale: В сочетании сохраняется титульный смысл слова Χριστός. Традиционное «Христос» дано в примечании как допустимая привычная передача.
- issue: Смысл κλητὸς ἀπόστολος
  choice: призванный апостол
  alternative: призванный быть апостолом
  rationale: Основной текст сохраняет сжатость и некоторую синтаксическую неоднозначность оригинала, не добавляя инфинитив «быть».
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского вступления. Сохранена цепочка определений, относящихся к Павлу, а также незавершённость фразы, продолжающейся в следующих стихах. Заглавные буквы в «Благой вести» подчёркивают устойчивое обозначение евангельской вести, не превращая его в добавочное богословское толкование.
