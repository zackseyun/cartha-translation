id: ROM.1.28
reference: Romans 1:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: ru
  text: И как они не сочли нужным сохранять знание о Боге[a], так Бог предал их негодному разуму[b] — делать то, чего делать не следует.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сочли нужным признавать Бога»; буквальнее: «иметь Бога в познании».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое «негодному» (ἀδόκιμον) родственно глаголу, переданному выше словами «не сочли нужным» (ἐδοκίμασαν): в оригинале здесь игра слов со значением одобрения или прохождения проверки.'
    reason: wordplay
lexical_decisions:
- source_word: καθὼς
  choice: как … так
  rationale: Передаёт сопоставление между человеческим отказом и последовавшим Божьим судом, не исключая причинного оттенка контекста.
- source_word: ἐδοκίμασαν
  choice: не сочли нужным
  rationale: Выражает осознанную оценку и отказ признать что-либо достойным или уместным; звучит естественно по-русски.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: сохранять знание о Боге
  rationale: Передаёт образ обладания Богом в познании и возможный оттенок удержания знания, избегая неестественного буквального оборота «иметь Бога в познании».
- source_word: παρέδωκεν
  choice: предал их
  rationale: Сохраняет судебный оттенок глагола и его повторяющуюся роль в контексте Рим 1.
- source_word: ἀδόκιμον νοῦν
  choice: негодному разуму
  rationale: «Негодный» передаёт значение не прошедшего проверки или не заслужившего одобрения и частично сохраняет смысловую перекличку с «не сочли нужным», не усиливая выражение до позднейшего богословского термина.
- source_word: ποιεῖν
  choice: делать
  rationale: Инфинитив оставлен достаточно открытым для оттенков цели и результата после «предал».
- source_word: τὰ μὴ καθήκοντα
  choice: то, чего делать не следует
  rationale: Естественно передаёт поступки, которые не подобают и не соответствуют должному.
theological_decisions:
- issue: Насколько усиливать нравственно-богословскую окраску выражения ἀδόκιμον νοῦν
  choice: негодному разуму
  alternative: развращённому разуму; порочному уму; отверженному уму
  rationale: Выбранный вариант сохраняет образ непригодности или непрохождения проверки и не привносит более сильную систематическую характеристику, чем позволяет само прилагательное.
- issue: Передавать ли παρέδωκεν как активное Божье судебное действие или как простое оставление
  choice: Бог предал их
  alternative: Бог оставил их во власти
  rationale: Греческий глагол прямо называет Бога действующим субъектом; перевод сохраняет эту богословскую напряжённость, не поясняя сверх текста характер действия.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского рассуждения. Конструкция «как … так» сохраняет риторическое соответствие оригинала; тире позволяет оставить инфинитив «делать» без искусственного уточнения, выражает ли он цель или результат.
