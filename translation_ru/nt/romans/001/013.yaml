id: ROM.1.13
reference: Romans 1:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: ru
  text: 'Не хочу, братья[a], чтобы вы оставались в неведении: я много раз намеревался прийти к вам — но до сих пор мне в этом мешали, — чтобы и среди вас обрести некоторый плод[b], как и среди прочих язычников[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть братья и сёстры, принадлежащие к общине верующих.
    reason: lexical_alternative
  - marker: b
    text: «Плод» здесь означает результаты служения Павла среди них.
    reason: cultural_note
  - marker: c
    text: 'Или: «среди других народов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: Не хочу ... чтобы вы оставались в неведении
  rationale: Сохраняет отрицательную форму греческого оборота и звучит ясно и естественно по-русски.
- source_word: ἀδελφοί
  choice: братья
  rationale: Передаёт грамматически мужскую форму обращения; подразумеваемый смешанный состав общины пояснён в сноске.
- source_word: πολλάκις προεθέμην
  choice: я много раз намеревался
  rationale: Точно передаёт неоднократно возникавшее у Павла намерение и не придаёт ему оттенка окончательно составленного плана.
- source_word: ἐκωλύθην
  choice: мне препятствовали
  rationale: Сохраняет пассивный смысл внешнего препятствия, не называя не указанного в тексте деятеля.
- source_word: ἄχρι τοῦ δεῦρο
  choice: до сих пор
  rationale: Естественная русская передача временного выражения.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: чтобы ... обрести некоторый плод
  rationale: Сохраняет метафору плода и неопределённость τινά, не сводя смысл к конкретному виду служения.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В контексте речь идёт о плоде служения в римской общине; это естественнее буквального «в вас».
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: среди прочих язычников
  rationale: В данном контексте ἔθνη обозначает неевреев как поле апостольского служения Павла; «прочих» включает римских адресатов в эту более широкую группу.
theological_decisions:
- issue: 'Значение ἔθνη: «язычники» или «народы»'
  choice: язычники
  alternative: другие народы
  rationale: Контекст послания и миссии Павла делает значение «неевреи» наиболее вероятным, однако лексически возможная передача «народы» сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского обращения. Синтаксис остаётся близким к ходу греческой мысли, но избегает тяжеловесных буквальных оборотов; сельскохозяйственная метафора «плода» сохранена.
