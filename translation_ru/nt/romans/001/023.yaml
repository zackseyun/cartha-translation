id: ROM.1.23
reference: Romans 1:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: ru
  text: и променяли славу нетленного Бога на подобие образа тленного человека, птиц, четвероногих и пресмыкающихся[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «на изображения, подобные тленному человеку…».'
    reason: Греческое выражение ἐν ὁμοιώματι εἰκόνος допускает более идиоматическую передачу, однако основной текст сохраняет его необычное сочетание слов и единственное число.
  - marker: b
    text: 'Или: «ползучих существ».'
    reason: Слово ἑρπετά может обозначать ползающих или пресмыкающихся существ шире современной зоологической категории рептилий.
lexical_decisions:
- source_word: ἤλλαξαν
  choice: променяли
  rationale: Передаёт намеренную замену одного другим и естественно сочетается с конструкцией «променяли… на…».
- source_word: δόξαν
  choice: славу
  rationale: Точно и традиционно передаёт многозначное δόξα, сохраняя богословскую насыщенность слова.
- source_word: ἀφθάρτου
  choice: нетленного
  rationale: Сохраняет прямое противопоставление слову φθαρτοῦ и указывает на неподверженность тлению.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: на подобие образа
  rationale: Сохраняет наложение понятий «подобие» и «образ» и единственное число исходного текста, не устраняя его необычную формулировку.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: тленного человека
  rationale: Формально сохраняет единственное число и явную антитезу «нетленный Бог — тленный человек».
- source_word: πετεινῶν
  choice: птиц
  rationale: Естественный и точный русский эквивалент.
- source_word: τετραπόδων
  choice: четвероногих
  rationale: Передаёт буквальный смысл и в данном перечислении естественно употребляется как субстантивированное прилагательное.
- source_word: ἑρπετῶν
  choice: пресмыкающихся
  rationale: Сохраняет образ существ, передвигающихся ползком, и является устойчивым русским соответствием в таком перечислении.
theological_decisions:
- issue: Противопоставление нетленного Бога и тленного творения
  choice: нетленного Бога… тленного человека
  alternative: бессмертного Бога… смертного человека
  rationale: Выбранные однокоренные слова точнее воспроизводят лексическую антитезу ἀφθάρτου — φθαρτοῦ, не сводя её только к смертности.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно формальной библейской лексикой. Слова «нетленный» и «тленный» сохранены ради точной антитезы; необычная конструкция «подобие образа» намеренно отражает формулировку греческого текста, а её более естественное понимание дано в сноске.
