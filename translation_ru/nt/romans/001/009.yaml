  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: ru
  text: Ведь Бог, Которому я служу своим духом в возвещении благой вести Его Сына, — мой свидетель, что я непрестанно упоминаю вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делаю упоминание о вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: свидетель
  rationale: В формуле торжественного заверения Бог призывается как свидетель истинности слов Павла; прямое русское соответствие сохраняет силу выражения.
- source_word: λατρεύω
  choice: служу
  rationale: Глагол обозначает религиозное служение Богу; «служу» естественно по-русски и не сужает смысл исключительно до богослужебного поклонения.
- source_word: ἐν τῷ πνεύματί μου
  choice: всем своим духом
  rationale: Выражение указывает на внутреннюю, личную вовлечённость Павла в служение. «Всем своим духом» естественно передаёт образ действия, не отождествляя πνεῦμα со Святым Духом.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: возвещая Радостную весть о Его Сыне
  rationale: Второе ἐν раскрывает сферу или способ служения. Русское деепричастие устраняет тяжёлое повторение «в»; «о Его Сыне» естественно передаёт объективное понимание родительного, хотя греческая форма допускает более широкое «Радостная весть Его Сына».
- source_word: ἀδιαλείπτως
  choice: непрестанно
  rationale: Передаёт постоянный, регулярно продолжающийся характер упоминания и сохраняет возвышенный, но понятный регистр.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: упоминаю вас
  rationale: Это близкая и естественная передача греческой идиомы «делаю упоминание о вас», не расширяющая её до общего «помню о вас».
theological_decisions:
- issue: Относится ли πνεύματί μου к человеческому духу Павла или к Святому Духу
  choice: своим духом
  alternative: в Духе
  rationale: Притяжательное местоимение μου прямо указывает на дух Павла. Перевод не исключает действия Святого Духа, но и не вносит его в текст без явного основания.
- issue: Значение родительного τοῦ υἱοῦ αὐτοῦ при εὐαγγελίῳ
  choice: Радостную весть о Его Сыне
  alternative: Радостную весть Его Сына
  rationale: Контекст Послания к римлянам поддерживает понимание Сына как содержания вести, однако родительный в греческом краток и потенциально шире; альтернативу отмечать в основном тексте не требуется, поскольку выбранная передача наиболее ясна по-русски.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апостольского заверения. Конструкция перестроена ради ясности: относительное придаточное поставлено между обращением к Богу как свидетелю и содержанием свидетельства; тире помогает удержать основную синтаксическую линию.'
