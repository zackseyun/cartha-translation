id: ROM.1.32
reference: Romans 1:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: ru
  text: 'Они знают праведное постановление Бога[a]: поступающие так достойны смерти. И всё же они не только сами так поступают, но и одобряют тех, кто так поступает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведное установление», «праведное требование» или «праведный приговор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: они
  rationale: Относительное местоимение продолжает характеристику людей из предыдущего контекста; в самостоятельном русском стихе естественнее начать с «они», сохранив связь по смыслу.
- source_word: δικαίωμα
  choice: праведное постановление
  rationale: Передаёт одновременно нормативно-судебный смысл и справедливый характер Божьего решения; последующая фраза раскрывает его как приговор о достойности смерти.
- source_word: ἐπιγνόντες
  choice: знают
  rationale: Передаёт осознанное знание; уступительный оттенок причастия выражен отдельным оборотом «И всё же».
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: поступающие так
  rationale: Естественная современная формулировка, обозначающая характерное, продолжающееся поведение, а не единичный поступок.
- source_word: ἄξιοι θανάτου
  choice: достойны смерти
  rationale: Прямо сохраняет судебную силу греческого выражения, не уточняя природу смерти сверх сказанного в тексте.
- source_word: ποιοῦσιν
  choice: сами так поступают
  rationale: «Сами» подчёркивает противопоставление собственных действий одобрению действий других; «так поступают» ясно отсылает к перечисленному ранее.
- source_word: συνευδοκοῦσιν
  choice: одобряют
  rationale: Передаёт согласие и положительную санкцию чужого поведения, а не простое безучастное допущение.
- source_word: τοῖς πράσσουσιν
  choice: тех, кто так поступает
  rationale: Сохраняет повтор и значение продолжающейся практики, оставаясь естественным для современного русского языка.
theological_decisions:
- issue: Смысл выражения «достойны смерти»
  choice: Сохранён общий смысл Божьего судебного приговора без уточнения вида смерти.
  alternative: Понимать это прежде всего как гражданскую смертную казнь либо конкретно как эсхатологическую смерть.
  rationale: Сам стих не определяет полный объём понятия «смерть», поэтому перевод не сужает его богословский смысл.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный регистр. Греческая длинная конструкция разделена на два предложения для естественности, при этом уступительная логика и нарастающее обвинение сохранены.
