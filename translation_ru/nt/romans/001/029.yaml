translation_notes:
  register: Современный литературный русский язык с достоинством апостольского перечня. Синтаксический фрагмент и конечная запятая сохранены, поскольку стих продолжает предложение и список из контекста. Различие между двумя выражениями полноты и близкими по смыслу названиями пороков по возможности сохранено.
