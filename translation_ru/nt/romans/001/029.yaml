lexical_decisions:
- source_word: πεπληρωμένους
  choice: исполнены
  rationale: Передаёт результирующее состояние, выраженное перфектным страдательным причастием, и сохраняет возвышенный, но понятный регистр.
- source_word: πάσῃ ἀδικίᾳ
  choice: всякой неправедности
  rationale: Сохраняет широкий нравственный смысл ἀδικία и всеохватность πάσῃ, не ограничивая значение одной социальной несправедливостью.
- source_word: πονηρίᾳ
  choice: порочности
  rationale: Обозначает общую нравственную испорченность и позволяет отличить это слово от κακία.
- source_word: πλεονεξίᾳ
  choice: жадности
  rationale: Современное и ясное обозначение ненасытного стремления иметь больше.
- source_word: κακίᾳ
  choice: злобы
  rationale: Передаёт более направленную против других недоброжелательность и не сливает термин с πονηρία.
- source_word: μεστοὺς
  choice: полны
  rationale: Естественно передаёт полноту и сохраняет лексическое отличие от πεπληρωμένους.
- source_word: φθόνου
  choice: зависти
  rationale: Точный и обычный русский эквивалент данного порока.
- source_word: φόνου
  choice: убийства
  rationale: Сохраняет нравственно отрицательное и конкретное значение термина в перечне пороков.
- source_word: ἔριδος
  choice: раздоров
  rationale: Передаёт враждебную распрю и конфликт; множественное число естественно для русского перечисления.
- source_word: δόλου
  choice: обмана
  rationale: Ясно передаёт намеренное введение в заблуждение.
- source_word: κακοηθείας
  choice: злонамеренности
  rationale: Передаёт дурную направленность характера и злой умысел, сохраняя отличие от κακία.
- source_word: ψιθυριστάς
  choice: они тайно злословят
  rationale: Передаёт скрытый, исподтишка совершаемый характер порочащей речи; глагольная формулировка звучит по-русски естественнее существительного «шептуны».
