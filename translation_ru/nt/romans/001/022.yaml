  text: φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/022.yaml
  text: Claiming to be wise[a], they became fools[b],
translation:
  language: ru
  text: Называя себя мудрыми[a], они стали глупцами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утверждая, что они мудры».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стали глупыми»; возможно также: «были сделаны глупыми».'
    reason: lexical_and_voice_alternative
lexical_decisions:
- source_word: φάσκοντες
  choice: называя себя
  rationale: Причастие передаёт заявление о самих себе; этот естественный русский оборот сохраняет ироническое противопоставление без добавления смысла.
- source_word: εἶναι
  choice: себя
  rationale: Содержание заявления встроено в русский оборот «называть себя кем-либо»; отдельный инфинитив в таком построении не требуется.
- source_word: σοφοὶ
  choice: мудрыми
  rationale: Предикативное прилагательное прямо передаёт заявляемое ими качество и сохраняет краткость греческого текста.
- source_word: ἐμωράνθησαν
  choice: стали глупцами
  rationale: Форма допускает пассивное либо непереходное понимание; «стали» естественно передаёт наступивший результат, а «глупцами» сохраняет резкий риторический контраст с «мудрыми».
theological_decisions:
- issue: Передавать ли ἐμωράνθησαν как качество, личное обозначение или пассивное действие
  choice: стали глупцами
  alternative: стали глупыми; были сделаны глупыми
  rationale: Выбранный вариант сохраняет острую антитезу Павла и не уточняет деятеля там, где греческая форма его не называет; возможные оттенки вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и выразительная. «Глупцы» передаёт резкость греческой антитезы, а примечание сохраняет неоднозначность залога ἐμωράνθησαν.
