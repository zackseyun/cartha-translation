  source_fidelity: '«Называя себя мудрыми, они стали глупцами» точно передаёт конструкцию φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν: заявление о собственной мудрости и итоговое ироническое превращение в глупцов. Оборот «называя себя» является допустимой естественной передачей φάσκοντες εἶναι.'
