lexical_decisions:
- source_word: Ἕλλησίν
  choice: греками
  rationale: Передаёт этнокультурное обозначение в форме дательного падежа и сохраняет первое противопоставление стиха.
- source_word: βαρβάροις
  choice: варварами
  rationale: Сохраняет историческое греческое обозначение тех, кто не принадлежал к греческому языковому и культурному миру; сноска предупреждает современное понимание слова как указания на дикость.
- source_word: σοφοῖς
  choice: мудрыми
  rationale: Прямой и естественный эквивалент, сохраняющий симметричное противопоставление с ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: неразумными
  rationale: Передаёт отсутствие разумения и сохраняет контраст с «мудрыми», не сужая значение до необразованности и не усиливая его до оскорбительного «глупыми».
- source_word: ὀφειλέτης
  choice: в долгу
  rationale: Сохраняет метафору должника, естественно выражая нравственное и апостольское обязательство, а не денежную задолженность.
- source_word: τε ... καὶ / τε ... καὶ
  choice: и перед ... и перед ... / и перед ... и перед ...
  rationale: Повторяющаяся русская конструкция сохраняет две уравновешенные пары греческого текста.
