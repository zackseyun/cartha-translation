  terminology: «Мужчины / женщина» — допустимый литературный эквивалент биологически маркированных ἄρσενες / θηλείας в русском; сноска должна объяснять маркированность, не приписывая исходнику несуществующее буквальное выражение. «Естественные отношения с женщиной», «постыдное» и «должное воздаяние» сохраняют смысл без излишней конкретизации.
