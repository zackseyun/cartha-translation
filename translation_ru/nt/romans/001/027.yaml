source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: ru
  text: Так же и мужчины[a], оставив естественные отношения с женщиной[b], воспылали желанием друг к другу[c], мужчины с мужчинами, совершая постыдное[d] и получая в самих себе должное воздаяние за своё заблуждение[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово обозначает мужской пол; то же обозначение повторено далее в выражении «мужчины с мужчинами».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «естественное употребление женщины», то есть естественную половую связь с женщиной.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «воспылали похотью друг к другу».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «делали то, что постыдно».'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «надлежащее возмездие за своё заблуждение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: мужчины / женщина
  rationale: Греческие слова подчёркивают различие полов. В русском «самцы / самка» применительно к людям звучало бы уничижительно и не соответствовало бы достоинству исходного текста, поэтому выбран естественный эквивалент с пояснением в сноске.
- source_word: ἀφέντες
  choice: оставив
  rationale: Деепричастие передаёт действие, предшествующее основному, и сохраняет прямой смысл греческого причастия.
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: естественные отношения с женщиной
  rationale: В данном контексте χρῆσις имеет сексуальный смысл. Буквальное «употребление женщины» по-русски неестественно и несёт нежелательный оттенок овеществления; «отношения» ясно передаёт смысл, а более буквальный вариант отмечен в сноске.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: разгорелись во влечении
  rationale: «Разгорелись» сохраняет образ огня в глаголе, а «влечение» передаёт ὄρεξις, не усиливая его до однозначного «похоть».
- source_word: εἰς ἀλλήλους
  choice: друг к другу
  rationale: Естественная русская передача взаимного направления желания.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: мужчины с мужчинами
  rationale: Сохранены повтор и обозначение пола, важные для риторического строения греческой фразы.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: совершали постыдное
  rationale: Передаёт нравственную оценку существительного ἀσχημοσύνη, не конкретизируя действие сверх сказанного в тексте.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: должное воздаяние
  rationale: Сочетание сохраняет идею соответствующего, надлежащего последствия; «воздаяние» шире, чем «наказание», и поэтому не снимает смысловую напряжённость.
- source_word: τῆς πλάνης αὐτῶν
  choice: за своё заблуждение
  rationale: «Заблуждение» естественно передаёт πλάνη как отход от верного пути или ошибку, не уточняя здесь её точный характер.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: получали в самих себе
  rationale: Сохранена рефлексивная формулировка источника без уточнения способа или формы воздаяния.
theological_decisions:
- issue: Передача биологически маркированных обозначений пола
  choice: мужчины ... женщина ... мужчины с мужчинами
  alternative: самцы ... особь женского пола ... самцы с самцами
  rationale: Выбранная формулировка сохраняет противопоставление полов, но не привносит в русский текст уничижительного зоологического оттенка.
- issue: Степень конкретизации нравственной оценки
  choice: совершали постыдное
  alternative: совершали гомосексуальные акты
  rationale: Греческий текст даёт нравственную оценку посредством ἀσχημοσύνη, но не употребляет позднейший категориальный термин; перевод не должен добавлять его.
- issue: Характер воздаяния
  choice: должное воздаяние
  alternative: заслуженное наказание
  rationale: «Воздаяние» сохраняет широту ἀντιμισθία и не определяет точную природу полученного последствия, тогда как «наказание» могло бы чрезмерно сузить смысл.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет последовательность греческой фразы, но избегает неестественного для русского буквального оборота «употребление женщины». Нравственная оценка и неопределённость природы воздаяния сохранены без дополнительной конфессиональной конкретизации.
