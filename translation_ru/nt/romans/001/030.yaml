  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: ru
  text: клеветники, ненавистники Бога[a], наглые, надменные, хвастливые, изобретатели зла, непокорные родителям,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ненавистные Богу».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλάλους
  choice: клеветники
  rationale: Слово обозначает тех, кто злонамеренно говорит против других; «клеветники» ясно и ёмко передаёт нравственную тяжесть выражения.
- source_word: θεοστυγεῖς
  choice: ненавистники Бога
  rationale: Активное понимание называет людей, ненавидящих Бога, и естественно вписывается в перечень человеческих пороков; возможное пассивное понимание сохранено в сноске.
- source_word: ὑβριστάς
  choice: наглые
  rationale: Передаёт дерзкую, оскорбительную самоуверенность, не сужая значение исключительно до физического насилия.
- source_word: ὑπερηφάνους
  choice: надменные
  rationale: Передаёт высокомерное отношение к другим и позволяет отличить это качество от следующего обозначения хвастовства.
- source_word: ἀλαζόνας
  choice: хвастливые
  rationale: Передаёт склонность выставлять себя напоказ и похваляться, включая оттенок претенциозности.
- source_word: ἐφευρετὰς κακῶν
  choice: изобретательные на зло
  rationale: Естественное русское выражение передаёт мысль о людях, находчиво придумывающих новые способы делать зло.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: непокорные родителям
  rationale: Точно и естественно передаёт непослушание и сопротивление родительской власти.
theological_decisions:
- issue: Значение θεοστυγεῖς
  choice: 'активное: «ненавистники Бога»'
  alternative: 'пассивное: «ненавистные Богу»'
  rationale: Активное значение лучше соответствует перечню человеческих склонностей и поступков. Поскольку форма исторически понималась и пассивно, эта реальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный перечень пороков. Сохранена синтаксическая незавершённость фрагмента стиха и итоговая запятая, поскольку данный отрывок продолжает перечень из соседнего контекста.
