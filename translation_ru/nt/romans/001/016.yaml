  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: ru
  text: 'Ведь я не стыжусь доброй вести[a], потому что она — Божья сила ко спасению каждого, кто верит: прежде всего иудея, а также грека[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Евангелие».'
    reason: lexical_alternative
  - marker: b
    text: 'Слово «грек» здесь может иметь более широкое значение: язычник, то есть неиудей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: не стыжусь
  rationale: Точно и естественно передаёт отсутствие стыда и нежелания отступать из-за общественного давления.
- source_word: εὐαγγέλιον
  choice: Радостная весть
  rationale: Прозрачно передаёт исходное значение слова и звучит естественно в современном литературном русском; традиционный вариант отмечен в сноске.
- source_word: δύναμις
  choice: сила
  rationale: Сохраняет прямой смысл слова и выражает действенную Божью силу, ведущую к спасению.
- source_word: εἰς σωτηρίαν
  choice: ко спасению
  rationale: Передаёт направленность и результат, выраженные предлогом εἰς, без излишнего толкования.
- source_word: παντὶ τῷ πιστεύοντι
  choice: каждого верующего
  rationale: Сохраняет всеобщий и одновременно индивидуально-распределительный смысл греческого оборота.
- source_word: Ἰουδαίῳ
  choice: иудея
  rationale: В данном противопоставлении обозначает представителя еврейского народа в религиозно-историческом смысле.
- source_word: πρῶτον
  choice: прежде
  rationale: Передаёт первенство в историческом порядке, не уточняя его основание и не превращая его в превосходство по ценности.
- source_word: Ἕλληνι
  choice: грека
  rationale: Сохраняет конкретное слово исходного текста; возможное более широкое значение пояснено в сноске.
- source_word: τε ... καί
  choice: а затем и
  rationale: По-русски естественно выражает присоединение второй группы после обозначенного словом πρῶτον первенства первой.
theological_decisions:
- issue: Значение Ἕλληνι в противопоставлении «иудею… греку»
  choice: «грек» в основном тексте с пояснением более широкого употребления в сноске
  alternative: «язычник» в основном тексте
  rationale: Так сохраняется лексическая форма исходного текста и одновременно признаётся, что у Павла слово может шире обозначать неиудея.
- issue: Характер первенства в πρῶτον
  choice: сохранить краткое «прежде», не объясняя вид первенства
  alternative: развернуть как «сначала по историческому порядку»
  rationale: Стих утверждает первенство иудея, но сам по себе не раскрывает здесь всех его аспектов; перевод не должен снимать эту богословскую напряжённость добавленным толкованием.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Начальное γάρ передано словом «ведь», второе γάρ — причинным союзом «потому что». Двоеточие делает заключительную пару групп естественной по-русски, не устраняя её краткости и напряжения.
