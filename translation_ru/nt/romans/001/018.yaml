  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: ru
  text: Ибо с неба открывается гнев Бога против всякого нечестия и неправедности людей, которые подавляют истину своей неправедностью[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые сдерживают истину».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подавляют истину в неправедности». Греческое выражение может указывать как на средство подавления, так и на сферу, в которой оно происходит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: открывается
  rationale: Настоящее время страдательного залога передано естественной русской формой, допускающей как происходящее ныне, так и общее настоящее; добавление «постоянно» или «ныне» необоснованно сузило бы смысл.
- source_word: γὰρ
  choice: ибо
  rationale: Союз вводит основание предшествующего утверждения и сохраняет явную логическую связь в аргументации Павла.
- source_word: ὀργὴ θεοῦ
  choice: гнев Бога
  rationale: Прямо передаёт личный и судебный характер ὀργή, не сводя его к безличным последствиям зла; конструкция ясна современному читателю.
- source_word: ἀπ’ οὐρανοῦ
  choice: с неба
  rationale: Естественно передаёт источник или происхождение того, что открывается.
- source_word: πᾶσαν ἀσέβειαν
  choice: всякого нечестия
  rationale: «Нечестие» сохраняет направленность ἀσέβεια на непочтение к Богу и согласуется с управлением предлога «против».
- source_word: ἀδικίαν
  choice: неправедности
  rationale: Сохраняет широкий нравственный и отношенческий смысл слова и важный для стиха повтор корня, не сужая значение до одной лишь социальной несправедливости.
- source_word: ἀνθρώπων
  choice: людей
  rationale: Греческое слово обозначает здесь людей вообще, а не только мужчин.
- source_word: τῶν ... κατεχόντων
  choice: которые подавляют
  rationale: В данном контексте κατέχω означает препятствовать действию истины, сдерживать или подавлять её; «подавляют» ясно выражает этот смысл.
- source_word: τὴν ἀλήθειαν
  choice: истину
  rationale: Прямой эквивалент без неоправданного уточнения содержания истины.
- source_word: ἐν ἀδικίᾳ
  choice: своей неправедностью
  rationale: Творительный падеж естественно выражает средство или образ действия; местоимение «своей» делает связь с действующими людьми ясной, не устраняя возможного понимания неправедности как сферы их поведения.
theological_decisions:
- issue: Следует ли смягчать ὀργὴ θεοῦ до безличного нравственного последствия
  choice: «гнев Бога» обозначает собственный судебный гнев Бога
  alternative: безличный процесс неизбежных нравственных последствий
  rationale: Генитивная конструкция и ход рассуждения Павла говорят о личной реакции Бога. Перевод сохраняет богословскую силу выражения, не добавляя объяснений к тексту.
- issue: Как понимать ἐν ἀδικίᾳ
  choice: 'как средство или образ действия: «своей неправедностью»'
  alternative: 'как сферу состояния или поведения: «в неправедности»'
  rationale: Оба понимания грамматически возможны. В основном тексте выбран наиболее естественный по-русски вариант, а подлинная неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством апостольской аргументации. «Ибо» сохраняет явную причинно-объяснительную связь; лексика понятна широкому читателю. Повтор «неправедности — неправедностью» намеренно сохраняет повтор ἀδικία в греческом тексте.
