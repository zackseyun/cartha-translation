id: ROM.1.2
reference: Romans 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: ru
  text: которое Он заранее обещал через Своих пророков в святых Писаниях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в святых писаниях».'
    reason: 'Лексическая альтернатива: греческое γραφαῖς может быть понято более буквально как «письменные тексты», хотя в данном контексте оно, вероятнее всего, означает Писания.'
lexical_decisions:
- source_word: ὃ
  choice: которое
  rationale: Относительное местоимение среднего рода отсылает к слову «Евангелие» в Римлянам 1:1 и сохраняет синтаксическую связь с предыдущим стихом.
- source_word: προεπηγγείλατο
  choice: заранее обещал
  rationale: Передаёт как значение обещания, так и временной смысл приставки προ-; выражение естественно для современного русского языка.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: через Своих пророков
  rationale: Предлог с родительным падежом обозначает посредничество; «Своих» ясно относит пророков к Богу, субъекту глагола.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: в святых Писаниях
  rationale: В данном контексте γραφαί обозначает священные письменные тексты; множественное число сохраняет форму греческого выражения, а отсутствие артикля не требует неопределённости в русском.
theological_decisions:
- issue: Передача γραφαῖς ἁγίαις как признанного корпуса Писаний или как святых письменных текстов вообще
  choice: в святых Писаниях
  alternative: в святых писаниях / в священных текстах
  rationale: У Павла γραφαί обычно относится к Писанию, поэтому прописная буква передаёт устойчивый библейский смысл. Сноска сохраняет более буквальную лексическую возможность без навязывания позднейшего определения канона.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, но понятная. Прописные «Он» и «Своих» соответствуют принятому русскому библейскому почтительному написанию и не меняют смысла исходного текста.
