id: ROM.1.25
reference: Romans 1:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: ru
  text: Они заменили истину Божью ложью и почитали творение и служили ему вместо Творца, который благословен вовеки. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: заменили
  rationale: Передаёт сознательную подмену одного другим в конструкции с ἐν, естественно звуча по-русски.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: истину Божью
  rationale: 'Сохраняет неоднозначность родительного: это может быть истина о Боге или принадлежащая Богу истина.'
- source_word: ἐν τῷ ψεύδει
  choice: ложью
  rationale: Определённый артикль допускает «ложью» или «той ложью»; без указательного слова русский текст остаётся естественным и не уточняет сверх оригинала.
- source_word: ἐσεβάσθησαν
  choice: почитали
  rationale: Передаёт религиозное благоговение, не сливая значение глагола со следующим «служили».
- source_word: ἐλάτρευσαν
  choice: служили
  rationale: В данном контексте означает культовое, религиозное служение.
- source_word: τῇ κτίσει
  choice: творение ... ему
  rationale: Единственное собирательное «творение» сохраняет противопоставление созданного Творцу; местоимение делает координацию глаголов ясной по-русски.
- source_word: παρὰ τὸν κτίσαντα
  choice: вместо Творца
  rationale: В контексте противопоставления передаёт предпочтение творения Творцу, не ограничиваясь пространственным или сравнительным смыслом.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: благословен вовеки
  rationale: Сохраняет традиционную форму славословия и буквальный временной смысл.
theological_decisions:
- issue: Значение παρὰ в противопоставлении творения Творцу
  choice: вместо Творца
  alternative: более Творца / вопреки Творцу
  rationale: «Вместо» лучше всего выражает контекстуальную замену должного объекта почитания и служения, не вводя идеи, что Творцу также служили, но в меньшей степени.
- issue: Различение ἐσεβάσθησαν и ἐλάτρευσαν
  choice: почитали ... и служили
  alternative: поклонялись и служили
  rationale: «Почитали» сохраняет различие между благоговейным отношением и культовым служением; «поклонялись» могло бы семантически сблизить оба действия.
- issue: Отнесение придаточного ὅς ἐστιν εὐλογητός
  choice: к Творцу
  alternative: к творению
  rationale: Мужской род относительного местоимения ὅς согласуется с субстантивированным τὸν κτίσαντα, а не со средним τῇ κτίσει.
translation_notes:
  register: Современный литературный русский с достоинством библейского славословия. Синтаксис упрощён ровно настолько, чтобы координация двух глаголов с одним объектом была прозрачной; богословская напряжённость между творением и Творцом сохранена.
