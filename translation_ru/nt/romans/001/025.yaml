  source_fidelity: 'Текст точно передаёт основные смысловые элементы греческого оригинала: замену истины Бога ложью, два различных действия по отношению к творению («почитали» и «служили»), противопоставление Творцу и заключительное славословие. «Истина Божья» не снимает намеренную генитивную многозначность τῆς ἀληθείας τοῦ θεοῦ. «Вместо Творца» уместно передаёт παρὰ в данном контексте как предпочтение творения Творцу.'
