  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: ru
  text: Ведь я горячо желаю увидеть вас, чтобы поделиться с вами каким-нибудь духовным даром и тем укрепить вас,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «чтобы вы были укреплены».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: горячо желаю
  rationale: Передаёт сильное личное стремление естественным современным русским языком, без архаического оттенка.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно обозначает пояснительную связь с предшествующим контекстом.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Сохраняет прямое значение глагола; подразумеваемый визит не вводится в текст явно.
- source_word: ἵνα
  choice: чтобы
  rationale: Ясно и идиоматично выражает цель.
- source_word: τι
  choice: каким-нибудь
  rationale: Сохраняет неопределённость греческого местоимения и не создаёт впечатления заранее названного конкретного дара.
- source_word: μεταδῶ
  choice: поделиться с вами
  rationale: Передаёт значение уделить или дать от того, чем располагает говорящий, и звучит естественнее, чем буквальное «передать».
- source_word: χάρισμα ... πνευματικὸν
  choice: духовным даром
  rationale: Сохраняет широкое значение выражения и не сужает его до определённого чудесного дара или технической категории.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: и тем укрепить вас
  rationale: Естественно выражает цель или предполагаемый результат, тогда как страдательная форма оригинала отмечена в сноске.
theological_decisions:
- issue: Следует ли понимать «духовный дар» как конкретную чудесную харизму или шире — как духовное благо
  choice: каким-нибудь духовным даром
  alternative: каким-нибудь даром Духа; каким-нибудь благодатным духовным благом
  rationale: Греческое выражение не требует узкого технического понимания; выбранный вариант сохраняет смысловую открытость и не вносит конфессионального толкования.
- issue: Кто непосредственно укрепляет адресатов
  choice: и тем укрепить вас
  alternative: чтобы вы укрепились; чтобы вы были укреплены
  rationale: Контекст связывает укрепление с тем, чем Павел намерен поделиться, однако страдательный инфинитив не называет деятеля прямо; эта грамматическая открытость сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, тёплый и достойный по тону. «Горячо желаю» сохраняет эмоциональную силу; «поделиться» избегает канцелярского или архаического звучания. Единственная сноска отражает значимую страдательную форму греческого текста; маркер помещён после относящейся к ней фразы.
