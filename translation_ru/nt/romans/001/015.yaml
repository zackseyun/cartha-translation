lexical_decisions:
- source_word: οὕτως
  choice: Итак
  rationale: В данном контексте слово подводит итог предшествующему объяснению Павла и вводит вывод о его намерении; «итак» естественно передаёт эту связующую функцию.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: что до меня, я готов
  rationale: Греческий оборот эллиптичен и буквально выражает готовность или усердное желание со стороны Павла. Русская идиома сохраняет личную направленность κατ’ ἐμέ и передаёт πρόθυμον без тяжеловесности.
- source_word: καὶ ὑμῖν
  choice: и вам
  rationale: «И» подчёркивает включение римских адресатов наряду с людьми в других местах, где Павел желает возвещать Благую весть.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: находящимся в Риме
  rationale: Причастный оборот естественно уточняет адресатов и близко передаёт греческую конструкцию с артиклем и предложной группой.
- source_word: εὐαγγελίσασθαι
  choice: возвещать Радостную Весть
  rationale: Глагол означает сообщать благую весть, возвещать Евангелие. Выбранная формулировка понятна современному читателю и не сужает действие до формальной церковной проповеди.
