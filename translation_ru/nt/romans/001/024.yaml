  source_fidelity: 'Требуется исправление залога в заключительной части. Греч. τοῦ ἀτιμάζεσθαι содержит инфинитив страдательного залога: речь о бесчещении их тел, а не прямо о том, что «они бесчестили» их. «Предал их во власти желаний их сердец нечистоте» передаёт βασовую смысловую связь παρέδωκεν, ἐν... и εἰς ἀκαθαρσίαν, хотя оборот несколько тяжеловесен.'
  naturalness: 'Предлагаемая правка сохраняет современный литературный строй: «так что их тела были обесчещены среди них» естественнее, чем попытка сделать «тела» взаимными действующими лицами. Формулировка «во власти желаний их сердец» допустима и понятна, хотя эксплицирует действенный оттенок ἐν.'
