source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: ru
  text: Поэтому Бог предал их во власти желаний их сердец нечистоте, так что их тела были обесчещены среди них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между ними»; возможно: «в самих себе».'
    reason: Греческое ἐν αὐτοῖς допускает групповое, взаимное или рефлексивное понимание.
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения и сохраняет явную логическую связь.
- source_word: παρέδωκεν
  choice: предал
  rationale: Сохраняет сильный смысл передачи людей во власть определённого состояния, не добавляя толкований «оставил» или «покарал».
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: во власти желаний их сердец
  rationale: Естественно по-русски передаёт сферу и действенную силу внутренних желаний; «сердец» сохраняет библейскую антропологическую лексику.
- source_word: ἐπιθυμίαις
  choice: желаний
  rationale: Не сужает значение заранее до половой похоти, хотя дальнейший контекст приобретает половую направленность.
- source_word: ἀκαθαρσίαν
  choice: нечистоте
  rationale: Передаёт нравственную нечистоту привычным и понятным библейским термином без архаической перегруженности.
- source_word: τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν
  choice: так что они бесчестили свои тела
  rationale: Результативная конструкция естественна в современном русском; глагол «бесчестили» сохраняет значение лишения чести, а «тела» — телесный акцент Павла.
- source_word: ἐν αὐτοῖς
  choice: друг с другом
  rationale: Передаёт наиболее вероятный взаимный, социальный смысл компактного и неоднозначного греческого выражения; иные возможности отмечены в сноске.
theological_decisions:
- issue: Следует ли усиливать παρέδωκεν пояснениями вроде «оставил их» или «в наказание предал»
  choice: Бог предал их
  alternative: Бог оставил их; Бог в наказание предал их
  rationale: Формулировка сохраняет судебную и богословскую весомость действия Бога, но не вносит в стих развёрнутое доктринальное истолкование.
- issue: Связь τοῦ ἀτιμάζεσθαι с преданием нечистоте
  choice: 'результат: «так что они бесчестили»'
  alternative: 'цель: «чтобы они бесчестили»; буквальная именная конструкция «для бесчестия тел»'
  rationale: Греческий артиклевый инфинитив допускает оттенки цели и результата. Русская результативная конструкция читается естественно и не утверждает, что бесчестие тел было самостоятельной целью Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены термины «сердца», «нечистота» и «тела»; тяжёлая буквальная конструкция с отглагольным существительным заменена естественным результативным оборотом.
