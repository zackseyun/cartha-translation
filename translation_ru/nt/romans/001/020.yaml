id: ROM.1.20
reference: Romans 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: ru
  text: 'Ведь Его невидимые свойства[a] — Его вечная сила и божественность[b] — ясно видны от сотворения мира: их постигают разумом через то, что создано. Поэтому им нет оправдания.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что невидимо в Нём».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «божественная природа». Здесь употреблено греческое слово θειότης, обозначающее божественное качество, а не более сильное слово θεότης («Божество»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: Его невидимые свойства
  rationale: Средний род множественного числа обозначает невидимое в Боге, доступное познанию по творению. «Свойства» естественно выражает эту мысль, не превращая оборот в обозначение невидимых предметов.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: от сотворения мира
  rationale: 'Сохраняет временное значение ἀπό: это ясно видно начиная с сотворения мира.'
- source_word: τοῖς ποιήμασιν
  choice: через то, что создано
  rationale: 'Дательный падеж имеет инструментальное значение: созданное служит средством, через которое человек приходит к пониманию невидимого.'
- source_word: νοούμενα
  choice: их постигают разумом
  rationale: 'Передаёт когнитивный оттенок νοέω: речь не только о зрении, но и об осмыслении наблюдаемого творения.'
- source_word: καθορᾶται
  choice: ясно видны
  rationale: Передаёт усилительное значение глагола и сохраняет намеренное напряжение между «невидимыми» свойствами и тем, что они ясно распознаются по творению.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: Его вечная сила
  rationale: Аппозиция поясняет, какие именно невидимые свойства имеются в виду; ἀΐδιος естественно передаётся словом «вечная».
- source_word: θειότης
  choice: божественность
  rationale: «Божественность» обозначает божественное качество или природу и не усиливает θειότης до более онтологически насыщенного θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: Поэтому им нет оправдания
  rationale: 'Передаёт результат: доступное через творение знание оставляет упомянутых людей без оправдания.'
theological_decisions:
- issue: Передача θειότης без усиления смысла
  choice: божественность
  alternative: божественная природа; Божество
  rationale: «Божественность» сохраняет указание на божественное качество и позволяет не стирать различие между θειότης в этом стихе и более сильным θεότης.
- issue: Связь откровения в творении с отсутствием оправдания
  choice: результативное «Поэтому им нет оправдания»
  alternative: «так что они безответны»; «чтобы они были без оправдания»
  rationale: Контекст и конструкция εἰς τό допускают естественное понимание результата; формулировка не уточняет сверх текста меру или содержание доступного людям знания.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Тире оформляет пояснительную аппозицию, а двоеточие делает связь между ясной видимостью и разумным постижением естественной. Намеренный парадокс «невидимые свойства — ясно видны» сохранён.
