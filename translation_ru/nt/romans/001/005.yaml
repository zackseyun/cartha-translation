  verdict: revise
  source_fidelity: 'В черновике верно переданы посредническое δι’ οὗ, первое лицо множественного числа ἐλάβομεν, два координированных дополнения «благодать и апостольское служение», а также неоднозначность выражения ὑπακοὴν πίστεως. Однако преобразование ἐν πᾶσιν τοῖς ἔθνεσιν в прямое дополнение при добавленном глаголе «привести» меняет синтаксическую связь: в греческом тексте речь о послушании веры «среди всех народов», а не прямо о приведении всех народов к нему.'
