  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: ru
  text: через Которого мы получили благодать и апостольское служение для послушания веры[a] среди всех народов[b] ради Его имени,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для послушания, проистекающего из веры»; или: «для послушания, состоящего в вере».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «среди всех язычников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: через Которого
  rationale: διά с родительным падежом указывает на посредничество; относительная конструкция сохраняет связь с Иисусом Христом в предыдущем стихе.
- source_word: ἐλάβομεν
  choice: мы получили
  rationale: Сохранены первое лицо множественного числа и аорист греческого текста без сведения смысла к одному Павлу.
- source_word: χάριν καὶ ἀποστολὴν
  choice: благодать и апостольское служение
  rationale: Сохранены два однородных существительных; «апостольское служение» естественнее в современном русском, чем отвлечённое «апостольство», и передаёт порученную роль.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: чтобы привести … к послушанию веры
  rationale: εἰς передаёт цель, а родительная конструкция «послушание веры» сохраняет смысловую неоднозначность греческого сочетания.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: все народы
  rationale: В сочетании с глагольным раскрытием цели выражение естественно включено как объект «привести»; ἔθνη в основном тексте передано широко как «народы».
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: ради Его имени
  rationale: ὑπέρ здесь выражает цель или мотив; формулировка сохраняет библейский смысл служения ради чести и славы Христа.
theological_decisions:
- issue: Значение ὑπακοὴν πίστεως
  choice: послушание веры
  alternative: послушание, проистекающее из веры; послушание, состоящее в вере
  rationale: Сжатая конструкция может обозначать как послушание, порождённое верой, так и послушание, заключающееся в вере; основной текст не устраняет эту богословски значимую неоднозначность.
- issue: Число в ἐλάβομεν
  choice: мы получили
  alternative: я получил
  rationale: Греческий текст имеет первое лицо множественного числа; возможное риторическое употребление множественного числа не разрешается переводом.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавные местоимения «Которого», «Его» применены по принятой русской религиозно-издательской норме. Порядок маркеров соответствует месту относящихся к ним выражений в русском тексте.
