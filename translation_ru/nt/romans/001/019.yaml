id: ROM.1.19
reference: Romans 1:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: ru
  text: потому что то, что можно знать о Боге, явно среди них[a], ведь Бог явил им это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в них»; возможно также: «внутри них».'
    reason: Греческое ἐν αὐτοῖς может обозначать как присутствие среди людей, так и внутреннюю данность.
lexical_decisions:
- source_word: διότι
  choice: потому что
  rationale: Передаёт причинную связь с предшествующим утверждением естественно и ясно.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: то, что можно знать о Боге
  rationale: Субстантивированное прилагательное допускает значение доступного познанию; оборот «о Боге» естественно передаёт объективный генитив.
- source_word: φανερόν ἐστιν
  choice: явно
  rationale: Кратко и естественно выражает очевидность или открытость знания, сохраняя смысловую связь с последующим ἐφανέρωσεν.
- source_word: ἐν αὐτοῖς
  choice: среди них
  rationale: Передаёт возможный общественный, доступный в их среде характер откровения; внутренняя локализация сохранена в сноске.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: ведь Бог явил им это
  rationale: «Ведь» естественно вводит обоснование, а «явил» точно передаёт действие ἐφανέρωσεν и поддерживает связь со словом «явно».
theological_decisions:
- issue: Значение ἐν αὐτοῖς
  choice: среди них
  alternative: в них / внутри них
  rationale: Греческое выражение допускает как общественную, так и внутреннюю локализацию. Основной текст выбирает контекстуально вероятное «среди них», не устраняя иной смысл, указанный в сноске.
- issue: Значение τὸ γνωστὸν
  choice: то, что можно знать
  alternative: то, что известно
  rationale: Форма допускает оттенки «познаваемого» и «известного». Выбранный вариант подчёркивает доступность знания о Боге и согласуется с последующим указанием на Божье раскрытие.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и достойная по тону. Повтор корня «явно — явил» намеренно сохраняет смысловую связь φανερόν — ἐφανέρωσεν.
