  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: ru
  text: 'Всем находящимся в Риме, возлюбленным Богом и призванным быть святыми[a][c]: благодать вам и мир от Бога, нашего Отца, и Господа Иисуса Мессии[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призванным святым»; буквально здесь стоят два определения без отдельного слова «быть».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христа».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможный более буквальный вариант: «возлюбленным Богом, призванным святым».'
    reason: previous_rendering
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: Всем находящимся в Риме
  rationale: Передаёт всеобщность обращения и местонахождение адресатов, сохраняя структуру греческой именной группы и естественное русское звучание.
- source_word: ἀγαπητοῖς θεοῦ
  choice: возлюбленным Богом
  rationale: Сохраняет определительный характер прилагательного ἀγαπητοῖς и ясно обозначает Бога как действующее лицо; формулировка возвышенная, но понятная современному читателю.
- source_word: κλητοῖς ἁγίοις
  choice: призванным быть святыми
  rationale: Идиоматически передаёт сочетание двух прилагательных в дательном падеже. Слово «быть» не выражено отдельно в греческом, поэтому более буквальный вариант вынесен в сноску.
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся русский эквивалент, сохраняющий и форму приветствия, и богословскую насыщенность слова.
- source_word: εἰρήνη
  choice: мир
  rationale: Прямой и естественный эквивалент, сохраняющий как приветственный, так и богословский смысл.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Бога, нашего Отца
  rationale: Естественно передаёт греческое сочетание и недвусмысленно связывает определение «нашего Отца» с Богом.
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет обычное библейское наименование и христологическую значимость κύριος.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт значение титула Χριστός, а не только его традиционную транслитерацию; в русском языке после имени артикль или иной дополнительный показатель определённости не требуется.
theological_decisions:
- issue: Следует ли понимать κλητοῖς ἁγίοις как «призванным быть святыми» или как два непосредственно соположенных определения
  choice: призванным быть святыми
  alternative: призванным святым
  rationale: Основной вариант естественнее по-русски и отражает призвание адресатов к святости, но греческий текст не содержит отдельного эквивалента слова «быть»; формально более близкий вариант сохранён в сноске.
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Перевод значения титула делает его смысл доступным современному читателю, тогда как традиционный вариант приведён в сноске без отрицания его допустимости.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Синтаксис сохраняет длинное обращение оригинала, но союз «и» помогает естественно связать два определения адресатов. Термины «благодать», «мир», «Господь» сохранены как понятные и укоренённые в русской библейской речи.
