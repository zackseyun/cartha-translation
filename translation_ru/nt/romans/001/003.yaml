  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из семени Давида».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «по плоти» здесь указывает на человеческое происхождение, земную родословную, а не на греховную природу.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: о
  rationale: Предлог естественно вводит содержание благой вести, названной в предыдущем стихе, и сохраняет связь с продолжающимся предложением.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Его Сыне
  rationale: Передаёт принадлежность Сына Богу без добавочного истолкования; прописная буква обеспечивает ясность референции в русском тексте.
- source_word: τοῦ γενομένου
  choice: Который произошёл
  rationale: Передаёт происхождение и появление в человеческой родословной, не сводя причастие ни к одному лишь рождению, ни к отвлечённой генеалогической формуле.
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: из рода Давида
  rationale: Естественно и ясно выражает давидово происхождение; буквальный образ «семени Давида» сохранён в сноске.
- source_word: κατὰ σάρκα
  choice: по плоти
  rationale: Сохраняет богословски весомую и намеренно краткую формулу Павла; пояснение её значения в данном контексте вынесено в сноску.
theological_decisions:
- issue: Соотношение сыновства Богу и происхождения от Давида
  choice: 'Сохранить рядом оба утверждения: «Его Сыне» и «произошёл из рода Давида по плоти».'
  alternative: Истолковать выражение как «по Своей человеческой природе» или сгладить его до «был потомком Давида».
  rationale: Греческий текст одновременно утверждает сыновство и подлинное человеческое происхождение от Давида, не разъясняя здесь их метафизическое соотношение. Перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохранён как часть длинного предложения Рим. 1:1–7; формула «по плоти» оставлена в основном тексте ради точности и богословской многозначности.
