  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: ru
  text: и был объявлен[a] Сыном Божьим в силе, по Духу святости[b], через воскресение из мёртвых, — Иисус Мессия, наш Господь,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был определён»; «был назначен»; «был обозначен Сыном Божьим в силе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по Святому Духу»; возможно также: «по духу святости».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: был явлен как
  rationale: Ὁρίζω здесь допускает значения «определить», «назначить», «обозначить, явить». Формулировка «был явлен как» естественна по-русски и не утверждает, будто Иисус лишь при воскресении впервые стал Сыном Божьим; основные более буквальные варианты сохранены в сноске.
- source_word: υἱοῦ θεοῦ
  choice: Сын Божий
  rationale: Прямой и традиционно понятный перевод христологического титула.
- source_word: ἐν δυνάμει
  choice: в силе
  rationale: Сохраняет тесную связь выражения с «Сын Божий» и не сводит его к наречию «могущественно».
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: по Духу святости
  rationale: Необычная греческая формула передана прозрачно, без преждевременного решения, означает ли она непосредственно Святого Духа или противопоставленную плоти сферу духовной святости.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: через воскресение из мёртвых
  rationale: «Через» естественно выражает основание или событие, посредством которого статус Сына Божьего в силе был явлен; «из мёртвых» сохраняет конструкцию источника/выхода в греческом тексте.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисус Мессия
  rationale: Χριστός передан как титул «Мессия», а не как непрозрачная транслитерация; русская конструкция без артикля естественна.
- source_word: κυρίου ἡμῶν
  choice: наш Господь
  rationale: Передаёт обычное для Павла исповедальное и христологическое значение κύριος.
theological_decisions:
- issue: Означает ли ὁρισθέντος, что Иисус стал Сыном Божьим только при воскресении
  choice: «был явлен как Сын Божий в силе»
  alternative: «был определён / назначен Сыном Божьим в силе»
  rationale: Основной текст не вводит утверждение о начале сыновства при воскресении, но сохраняет связь явления Сына «в силе» с воскресением. Более буквальные и богословски напряжённые варианты отмечены в сноске.
- issue: Относится ли πνεῦμα ἁγιωσύνης непосредственно к Святому Духу
  choice: «по Духу святости»
  alternative: «по Святому Духу» или «по духу святости»
  rationale: Заглавная буква отражает вероятное личное понимание Духа, тогда как необычная форма «Дух святости» сохраняет неоднозначность оригинала; варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского вступления. Синтаксис сохраняет зависимость от предшествующего контекста, поэтому стих начинается со строчной буквы и завершается запятой. Необычное выражение «Дух святости» намеренно сохранено; «Мессия» передаёт титульное значение Χριστός.
