  source_fidelity: 'В черновике точно переданы постоянство молитв, надежда на успешное прибытие и зависимость этого от Божьей воли. Однако εἴ πως («не удастся ли каким-нибудь образом / как-нибудь») не выражено: условие «если будет на то воля Бога» передаёт ἐν τῷ θελήματι τοῦ θεοῦ, но не греческое εἴ πως. Кроме того, «по воле Бога» ближе к исходной предложной конструкции, чем добавляющее будущую условность «если будет».'
