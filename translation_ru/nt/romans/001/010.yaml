  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: ru
  text: всегда в моих молитвах прося о том, не удастся ли мне наконец каким-нибудь образом, по воле Бога, прийти к вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет ли мне дарован успех в пути к вам».'
    reason: Глагол εὐοδόομαι может обозначать успешное осуществление намерения вообще, а в данном контексте — благополучное совершение пути; страдательная форма допускает мысль о дарованном успехе.
lexical_decisions:
- source_word: πάντοτε ἐπὶ τῶν προσευχῶν μου
  choice: всегда в молитвах моих
  rationale: Сохраняет связь с предыдущим стихом и передаёт постоянство молитвенной практики; порядок слов остаётся ясным и литературным.
- source_word: δεόμενος
  choice: прося
  rationale: Причастие выражает молитвенную просьбу; контекст уже прямо указывает на молитву, поэтому нейтральное «прося» естественно и достаточно.
- source_word: εἴ πως
  choice: чтобы мне… удалось
  rationale: В контексте зависимой просьбы оборот передаёт надежду на возможность, не превращая её в уверенность; оттенок неопределённости поддерживается условием о Божьей воле.
- source_word: ἤδη ποτὲ
  choice: наконец
  rationale: Передаёт накопившееся ожидание Павла и его надежду, что возможность теперь всё же появится.
- source_word: εὐοδωθήσομαι
  choice: удалось
  rationale: В данном контексте глагол означает успешное осуществление намерения прийти; выбор избегает современного финансового оттенка слова «преуспеть».
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: если будет на то воля Бога
  rationale: Естественно по-русски выражает Божью волю как определяющее условие поездки, не утверждая, что Павлу она уже известна.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: прийти к вам
  rationale: Прямо и без добавочного толкования передаёт движение к адресатам.
theological_decisions:
- issue: Соотношение намерения Павла и воли Бога
  choice: если будет на то воля Бога
  alternative: по воле Бога
  rationale: Условная формулировка сохраняет напряжение между настойчивым желанием Павла и зависимостью его осуществления от Божьей воли.
translation_notes:
  register: Современный литературный русский с достоинством и умеренным сохранением порядка греческой фразы. Стих синтаксически продолжает Рим. 1:9, поэтому начало со строчной буквы уместно в данном фрагменте.
