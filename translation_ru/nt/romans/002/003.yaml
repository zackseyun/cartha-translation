revisions:
- from: Но неужели ты думаешь, человек[a], — ты, который судишь тех, кто совершает подобное, а сам делаешь то же, — что избежишь суда Божьего?
  to: Но думаешь ли ты, человек[a], судящий тех, кто делает такое, и сам делающий то же, что избежишь Божьего суда?
  rationale: Перестроена фраза так, чтобы обращение «человек» и характеризующие его причастные обороты следовали структуре оригинала и звучали естественно по-русски. Риторический вопрос сохранён без дополнительной частицы «неужели», а «такое» выбрано как более обычное современное соответствие τὰ τοιαῦτα. Значение и богословская терминология не изменены.
