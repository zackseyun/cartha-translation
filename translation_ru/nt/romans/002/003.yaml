review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан в целом верно: λογίζῃ отражено как «думаешь», κρίνων — как «судишь», противопоставление судящего другим и поступающего так же сохранено, а τὸ κρίμα τοῦ θεοῦ точно передано как «Божьего суда». Однако вводное «неужели» и разрыв обращения конструкцией «человек[a], — ты, который» делают синтаксис менее прямым, чем греческое обращение с двумя определяющими причастиями.'
  naturalness: Текст понятен, но пунктуация «человек[a], — ты, который ... , —» тяжеловесна и не вполне естественна для современного литературного русского. Более плавно сохранить обращение и причастную характеристику в одной конструкции.
  terminology: «Судить», «делать», «Божий суд» — удачные и нейтральные соответствия. «Такое» естественнее, чем субстантивированное «подобное», и хорошо передаёт τὰ τοιαῦτα. Сноска должна говорить именно о греческом слове, не создавая впечатления, будто русское «человек» воспроизводит греческую грамматическую форму.
