id: ROM.2.3
reference: Romans 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: ru
  text: Но думаешь ли ты, человек[a], судящий тех, кто делает такое, и сам делающий то же, что избежишь Божьего суда?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. ἄνθρωπε — форма мужского рода единственного числа; здесь это обращение к отдельному человеку как представителю людей вообще.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: неужели ты думаешь
  rationale: Глагол обозначает мысленное заключение или предположение. Частица «неужели» естественно передаёт обличительную силу риторического вопроса, не меняя его содержания.
- source_word: ἄνθρωπε
  choice: человек
  rationale: Форма звательного обращения направлена к отдельному человеку как к типичному представителю людей. Русское «человек» сохраняет прямоту и возвышенно-полемический характер обращения.
- source_word: κρίνων
  choice: судишь
  rationale: Прямо передаёт нравственную оценку других; более сильное «осуждаешь» могло бы неоправданно сузить значение.
- source_word: πράσσοντας
  choice: совершает
  rationale: Передаёт совершаемые поступки и позволяет сохранить умеренное лексическое различие с последующим ποιῶν.
- source_word: ποιῶν αὐτά
  choice: сам делаешь то же
  rationale: «Делаешь» передаёт ποιῶν, «то же» ясно отсылает к подобным поступкам, а «сам» естественно выражает контраст между судящим и его собственным поведением.
- source_word: ἐκφεύξῃ
  choice: избежишь
  rationale: Точно и естественно обозначает надежду уклониться от грядущего Божьего суда.
- source_word: κρίμα τοῦ θεοῦ
  choice: суда Божьего
  rationale: «Суд» сохраняет широкий судебный смысл κρίμα, не ограничивая его только приговором или наказанием.
theological_decisions:
- issue: Характер Божьего κρίμα
  choice: суд Божий
  alternative: приговор Божий
  rationale: Контекст допускает судебный результат, но слово здесь может охватывать Божье судебное решение в целом; перевод «суд» не устраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с сохранением прямого диатрибического обращения Павла. Конструкция с парными тире удерживает длинную рамку греческого риторического вопроса, оставаясь понятной при чтении вслух.
