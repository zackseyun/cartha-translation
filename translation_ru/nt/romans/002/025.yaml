id: ROM.2.25
reference: Romans 2:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: ru
  text: Обрезание действительно приносит пользу, если ты исполняешь закон; но если ты нарушаешь закон, твоё обрезание стало необрезанием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть нарушение закона лишает обрезание его значения как знака принадлежности к завету; физически обрезанный человек не становится необрезанным.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: Обрезание
  rationale: Сохранён конкретный богословско-заветный термин и его прямое противопоставление слову ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: действительно
  rationale: Передаёт утвердительную первую часть противопоставления μὲν…δὲ без неестественного накопления русских частиц.
- source_word: ὠφελεῖ
  choice: приносит пользу
  rationale: Естественно выражает реальную, но поставленную под условие пользу; формулировка яснее буквального «полезно» при таком подлежащем.
- source_word: ἐὰν νόμον πράσσῃς
  choice: если ты исполняешь закон
  rationale: Русское «исполнять закон» естественно передаёт деятельное соблюдение, выраженное πράσσω, не сводя смысл к одному лишь знанию или согласию.
- source_word: παραβάτης νόμου ᾖς
  choice: если ты нарушаешь закон
  rationale: Греческая именная конструкция передана естественной русской глагольной формой с сохранением прямого обращения и значения нарушения установленной границы закона.
- source_word: ἀκροβυστία
  choice: необрезание
  rationale: В данном контексте слово обозначает заветную противоположность обрезанию; «необрезание» сохраняет резкий параллелизм Павла лучше, чем анатомический эквивалент.
- source_word: γέγονεν
  choice: стало
  rationale: Форма передаёт наступившее изменение и сохраняющийся результат, не ослабляя утверждение добавлением «считается» или «как бы».
theological_decisions:
- issue: Понимать ли заключительную фразу как буквальное изменение физического состояния или как риторическое лишение заветного преимущества
  choice: Сохранить буквальную по форме фразу «твоё обрезание стало необрезанием» и пояснить её образный заветный смысл в сноске.
  alternative: «твоё обрезание считается необрезанием»
  rationale: Греческое γέγονεν выражает более сильный риторический переворот, чем простая оценка. Разъясняющий перевод в основном тексте преждевременно снял бы намеренную напряжённость формулировки.
translation_notes:
  register: Современный литературный русский язык с прямым обращением на «ты», соответствующим греческим формам второго лица. Сохранён резкий параллелизм «обрезание — необрезание» и условно-противительная структура стиха.
