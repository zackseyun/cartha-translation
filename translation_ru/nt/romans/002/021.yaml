  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: ru
  text: 'Итак, ты, кто учишь другого, не учишь самого себя? Ты, кто провозглашаешь: «Не кради», — крадёшь?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: итак
  rationale: Передаёт выводный переход от предшествующего рассуждения и естественно звучит в русском риторическом вопросе.
- source_word: διδάσκων
  choice: учащий
  rationale: Субстантивированное причастие сохраняет характеристику адресата и параллельную структуру греческой фразы.
- source_word: ἕτερον
  choice: другого
  rationale: Сохраняет единственное число и противопоставление другому человеку — самому себе.
- source_word: σεαυτὸν
  choice: самого себя
  rationale: Полная возвратная форма подчёркивает резкий риторический контраст.
- source_word: οὐ διδάσκεις;
  choice: не учишь?
  rationale: Сохраняет отрицательный риторический вопрос и обличительную силу оригинала.
- source_word: κηρύσσων
  choice: проповедующий
  rationale: Передаёт публичное провозглашение; в библейском контексте это естественное и достаточно широкое русское соответствие.
- source_word: μὴ κλέπτειν
  choice: «Не кради»
  rationale: Инфинитивное содержание провозглашения естественно передано прямым запретом, созвучным формулировке заповеди.
- source_word: κλέπτεις;
  choice: крадёшь?
  rationale: Простой вопрос в настоящем времени сохраняет прямоту и обвинительный характер Павловой риторики.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткой, параллельной и обличительной риторики оригинала. «Проповедующий» употреблено не в узкоконфессиональном смысле, а как обозначение публичного провозглашения.
