id: ROM.2.16
reference: Romans 2:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: ru
  text: в тот день, когда Бог через Мессию Иисуса[a] будет судить сокровенное в людях, согласно моей Благой вести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Христа Иисуса».'
    reason: Альтернативная традиционная передача титула Χριστός.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: в тот день, когда
  rationale: Естественно передаёт временную конструкцию и сохраняет указание на определённый день суда.
- source_word: κρίνει
  choice: будет судить
  rationale: Греческая форма — настоящее время, однако контекст указывает на будущий эсхатологический суд; в русском придаточном с «когда» будущее время звучит естественно и ясно.
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: сокровенное в людях
  rationale: Передаёт скрытые стороны внутренней жизни человека, не ограничивая смысл только тайными сведениями; множественное число греческого субстантивированного прилагательного естественно выражено собирательным единственным числом.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: согласно моей Благой вести
  rationale: Сохраняет личное притяжательное местоимение Павла; «Благая весть» понятно передаёт εὐαγγέλιον, а «согласно» оставляет возможным смысл соответствия суда провозглашаемой вести.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: через Мессию Иисуса
  rationale: διά с родительным падежом указывает на посредство или действующее лицо; Χριστός здесь передано как титул «Мессия».
theological_decisions:
- issue: Передача Χριστοῦ как титула или традиционного обозначения
  choice: через Мессию Иисуса
  alternative: через Христа Иисуса
  rationale: Χριστός сохраняет титульный смысл «Мессия»; традиционная передача «Христос» дана в сноске, поскольку в данном сочетании возможна и более именноподобная трактовка.
- issue: Связь оборота «согласно моей Благой вести»
  choice: сохранить в конце предложения
  alternative: переставить ближе к глаголу суда или развернуть как «как возвещает моя Благая весть»
  rationale: 'Конечная позиция следует греческому порядку и сохраняет неоднозначность: выражение может характеризовать как сам суд через Иисуса Мессию, так и содержание Павлова благовестия.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Формулировка избегает архаичного «тайное человеческое» и сохраняет посредническое значение «через». Маркер [a] помещён непосредственно после соответствующего имени.
