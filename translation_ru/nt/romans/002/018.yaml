lexical_decisions:
- source_word: γινώσκεις
  choice: знаешь
  rationale: Настоящее время изъявительного наклонения прямо выражает знание; «знаешь» естественно и точно передаёт глагол.
- source_word: τὸ θέλημα
  choice: Его волю
  rationale: В греческом буквально «волю», без притяжательного местоимения, однако из контекста подразумевается воля Бога; в русском «Его волю» звучит естественно.
- source_word: δοκιμάζεις
  choice: умеешь распознавать
  rationale: Глагол означает испытывать, проверять и в результате признавать достойным; в сочетании с τὰ διαφέροντα эта формулировка передаёт способность нравственного различения.
- source_word: τὰ διαφέροντα
  choice: лучшее
  rationale: Оборот допускает буквальное значение «то, что различается», но идиоматически может означать «лучшее, превосходнейшее»; контекст знания Божьей воли поддерживает последнее, при этом неоднозначность отмечена в сноске.
- source_word: κατηχούμενος
  choice: наставляемый
  rationale: Причастие настоящего времени страдательного залога сохраняется как причастный оборот и передаёт систематическое обучение.
- source_word: ἐκ τοῦ νόμου
  choice: Законом
  rationale: ἐκ указывает на источник наставления — Закон; русский творительный падеж естественно выражает средство или основание обучения, а более буквальный вариант приведён в сноске.
theological_decisions:
- issue: Неуказанный обладатель «воли»
  choice: Его волю
  alternative: волю
  rationale: Бог является очевидным референтом по контексту предыдущего стиха, но отсутствие местоимения в греческом отмечено в сноске, чтобы не скрывать формальную особенность текста.
- issue: Значение τὰ διαφέροντα
  choice: лучшее
  alternative: то, что различается
  rationale: Выбрано вероятное контекстуальное значение морально превосходного, однако подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, сохраняющий достоинство и синтаксическую связь с продолжающимся предложением. «Закон» написан с прописной буквы как обозначение данного Богом Закона в иудейском контексте.
