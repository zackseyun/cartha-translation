  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: ru
  text: и знаешь Его[a] волю, и различаешь лучшее[b], получая наставление из Закона,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «волю»; в греческом тексте притяжательное местоимение не выражено явно, хотя по контексту имеется в виду Бог.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «то, что отличается»; буквальнее: «испытываешь то, что различается».'
