lexical_decisions:
- source_word: πέποιθάς
  choice: уверен
  rationale: Перфект передаёт устойчивую, сложившуюся уверенность; «уверен» естественно выражает самоуверенный тон перечисления.
- source_word: τε
  choice: и
  rationale: Частица продолжает связанное перечисление из предыдущего контекста; простой союз не перегружает фразу.
- source_word: σεαυτόν
  choice: ты сам
  rationale: Сохраняет выразительный акцент возвратного местоимения на собственной оценке адресата.
- source_word: ὁδηγόν
  choice: проводник
  rationale: Точно и естественно передаёт образ человека, ведущего тех, кто не видит пути.
- source_word: τυφλῶν
  choice: слепых
  rationale: Родительный падеж естественно зависит от слова «проводник» и сохраняет обобщённый характер греческого выражения.
- source_word: φῶς
  choice: свет
  rationale: Сохраняет метафору духовного просвещения без ненужного пояснения.
- source_word: τῶν ἐν σκότει
  choice: для находящихся во тьме
  rationale: Передаёт субстантивированное выражение лично и естественно, сохраняя метафору тьмы.
