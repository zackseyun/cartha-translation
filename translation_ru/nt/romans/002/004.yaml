source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: ru
  text: Или ты пренебрегаешь богатством Его доброты, снисхождения и долготерпения[a], не зная, что доброта Бога ведёт тебя к покаянию?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благости» в обоих случаях; также возможны: «сдержанности» вместо «снисхождения» и «терпения» вместо «долготерпения».'
    reason: Лексические альтернативы для χρηστότης (в обоих употреблениях), ἀνοχή и μακροθυμία; основной текст сохраняет повтор «доброта» и различает два близких обозначения терпения.
lexical_decisions:
- source_word: πλούτου
  choice: богатством
  rationale: Сохраняет метафору изобилия и родительную конструкцию Павла, естественно звуча по-русски.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: доброты
  rationale: Одинаковый перевод в обоих случаях сохраняет лексическую связь и передаёт благожелательное отношение Бога; «благость» возможно, но менее обычно в современной речи.
- source_word: ἀνοχῆς
  choice: снисхождения
  rationale: Передаёт то, что Бог удерживается от немедленного суда, не внося современных ассоциаций слова «терпимость».
- source_word: μακροθυμίας
  choice: долготерпения
  rationale: Различает это качество с ἀνοχή и передаёт длительное терпение; слово сохраняет достоинство библейского регистра и остаётся понятным.
- source_word: καταφρονεῖς
  choice: пренебрегаешь
  rationale: Естественно и достаточно резко выражает отношение к Божьей доброте как к чему-то не заслуживающему должного внимания; «презираешь» было бы ещё резче.
- source_word: ἀγνοῶν
  choice: не понимая
  rationale: Передаёт отсутствие осознания без необоснованного указания на намеренное игнорирование.
- source_word: εἰς μετάνοιάν
  choice: к покаянию
  rationale: Сохраняет направленность εἰς и передаёт μετάνοια привычным, содержательно точным русским богословским словом.
- source_word: ἄγει
  choice: ведёт
  rationale: Прямо сохраняет настоящее время и образ Божьего действия, направляющего человека к покаянию.
theological_decisions:
- issue: Передача χρηστότης / χρηστόν как личной доброты или более общего блага
  choice: Оба употребления переведены словом «доброта».
  alternative: «Благость» в одном или обоих случаях.
  rationale: Контекст подчёркивает благожелательное и милостивое отношение Бога к грешнику; единообразие также сохраняет повтор исходного слова.
- issue: Характер действия Бога в выражении εἰς μετάνοιάν σε ἄγει
  choice: «ведёт тебя к покаянию»
  alternative: «побуждает тебя покаяться»
  rationale: «Ведёт» сохраняет метафору и не уточняет сверх текста, является ли это действие принуждающим, исключительно внутренним или только приглашающим.
translation_notes:
  register: Современный литературный русский с достоинством апостольского увещания. Обращение оставлено в единственном числе («ты»), как в греческом тексте. Повтор «доброта» намеренно сохраняет повтор χρηστότης / χρηστόν.
