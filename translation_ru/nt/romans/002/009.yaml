  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: ru
  text: Скорбь и страдание постигнут душу каждого человека, делающего зло, — иудея прежде всего, а также грека[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном противопоставлении «иудей — грек» слово «грек» обозначает неиудея.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: скорбь
  rationale: Передаёт тяжёлое бедствие и сохраняет торжественный библейский регистр, оставаясь понятным современному читателю.
- source_word: στενοχωρία
  choice: теснота
  rationale: Сохраняет образ стеснённости и смысловое усиление в паре со «скорбью»; более буквальное и выразительное соответствие, чем обобщённое «страдание».
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: душу каждого человека
  rationale: Сохраняет конкретное слово ψυχή и одновременно ясно передаёт родовое значение ἀνθρώπου; оборот относится ко всякому человеку.
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: делающего зло
  rationale: Естественно и близко к греческому передаёт субстантивированное причастие и обобщённое τὸ κακόν, не усиливая его до значения привычной практики.
- source_word: Ἰουδαίου
  choice: иудея
  rationale: Передаёт этнорелигиозное обозначение в характерном для Послания к римлянам противопоставлении.
- source_word: Ἕλληνος
  choice: грека
  rationale: Сохраняет буквальное обозначение Павла и его устойчивую пару «иудей — грек», не заменяя её толковательным «язычник».
- source_word: πρῶτον
  choice: прежде
  rationale: Естественно выражает приоритет или последовательность, не уточняя сверх текста характер этого первенства.
theological_decisions:
- issue: Как передать безглагольную греческую фразу как утверждение о грядущем суде
  choice: Скорбь и теснота постигнут...
  alternative: Скорбь и теснота — на всякую душу...
  rationale: Русское будущее время естественно восстанавливает подразумеваемую предикацию из контекста суда и не добавляет отдельного богословского утверждения.
- issue: Следует ли истолковывать Ἕλλην как общее обозначение неиудея
  choice: грек
  alternative: язычник / неиудей
  rationale: Буквальный вариант сохраняет формулировку и напряжение текста; пояснение о функции слова в паре вынесено в сноску.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной торжественностью. Синтаксис сделан естественным для русского языка; сохранены образ «души», парное усиление «скорбь и теснота» и буквальное противопоставление «иудей — грек».
