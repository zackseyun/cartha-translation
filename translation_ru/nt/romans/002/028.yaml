  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: ru
  text: Ведь не тот иудей, кто таков внешне,[a] и не то обрезание, которое совершается внешне, на плоти.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в явном», то есть в том, что видно.'
    reason: lexical_alternative
  - marker: b
    text: «На плоти» означает здесь физическое, телесное обрезание.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: иудей
  rationale: В данном контексте речь идёт прежде всего о принадлежности к народу завета, а не о географическом происхождении; «иудей» — точный и привычный русский библейский термин.
- source_word: ἐν τῷ φανερῷ
  choice: внешне
  rationale: Передаёт видимый, наружный аспект и естественно подготавливает противопоставление внутреннему в следующем стихе.
- source_word: περιτομή
  choice: обрезание
  rationale: Стандартное и точное обозначение обсуждаемого знака завета.
- source_word: ἐν σαρκί
  choice: на плоти
  rationale: Здесь σάρξ обозначает буквальную телесную плоть; сочетание «обрезание на плоти» ясно указывает на физический обряд и сохраняет образ исходного текста.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно для современного русского языка выражает пояснительную связь с предшествующим рассуждением.
theological_decisions:
- issue: Соотношение внешней и подлинной иудейской идентичности
  choice: Стих отрицает достаточность одной лишь внешней идентичности и телесного обрезания, не отрицая саму иудейскую идентичность.
  alternative: Понимать стих как полное отрицание иудейской идентичности или её замену исключительно духовной категорией.
  rationale: Греческая конструкция противопоставляет внешнее внутреннему, раскрываемому в стихе 29; перевод не должен преждевременно устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, достойной библейской интонацией. Повтор «иудей» добавлен во второй части первой конструкции ради ясности естественного русского синтаксиса; эллиптическая вторая половина раскрыта относительным оборотом без богословского расширения.
