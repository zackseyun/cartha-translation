  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: ru
  text: И мы знаем, что Божий суд над теми, кто поступает так, соответствует истине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по истине»; то есть Божий суд соответствует тому, что истинно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: мы знаем
  rationale: Форма οἶδα имеет настоящее значение; «мы знаем» прямо и естественно передаёт смысл.
- source_word: δέ
  choice: и
  rationale: Здесь δέ продолжает рассуждение, не выражая сильного противопоставления.
- source_word: τὸ κρίμα τοῦ θεοῦ
  choice: Божий суд
  rationale: κρίμα обозначает судебное решение или суд Бога; «суд» сохраняет широкий смысл и не сужает его до одного лишь осуждения.
- source_word: κατὰ ἀλήθειαν
  choice: по истине
  rationale: Формулировка сохраняет явную связь Божьего суда с истиной и передаёт соответствие тому, что истинно, не заменяя это более толковательным «справедлив».
- source_word: ἐπὶ
  choice: над
  rationale: В сочетании с «суд» русское «над теми» естественно обозначает людей, на которых направлен Божий суд.
- source_word: τὰ τοιαῦτα
  choice: так
  rationale: В обороте «поступает так» это естественная русская отсылка к перечисленным ранее делам.
- source_word: πράσσοντας
  choice: кто поступает
  rationale: Настоящее причастие указывает на совершаемое или характерное поведение; «поступает» звучит естественно и не требует искусственного «практикует такие дела».
theological_decisions:
- issue: Следует ли передать κατὰ ἀλήθειαν более толковательно как указание на справедливость суда или сохранить прямое упоминание истины.
  choice: по истине
  alternative: справедлив / в соответствии с истиной
  rationale: '«По истине» сохраняет богословскую насыщенность исходной фразы: Божий суд соответствует истине и действительности. Перевод «справедлив» верен по смыслу, но устраняет явное слово «истина».'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Конструкция «Божий суд… совершается по истине» сохраняет исходную мысль и избегает двусмысленного впечатления, будто «по истине» относится к поведению людей.
