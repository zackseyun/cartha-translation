review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: οἴδαμεν, Божий суд, адресаты суда и отсылка к подобным поступкам сохранены. Однако «суд ... совершается по истине» неоправданно превращает простую именную конструкцию ἐστιν κατὰ ἀλήθειαν в описание совершения события и звучит менее точно по-русски.'
  naturalness: Фраза «Божий суд ... совершается по истине» тяжеловесна и неестественна для современного литературного русского. «Божий суд ... соответствует истине» ясно и естественно передаёт κατὰ ἀλήθειαν, не приписывая дополнительного временного или процессуального оттенка.
  terminology: «Божий суд» удачно передаёт τὸ κρίμα τοῦ θεοῦ. «Над теми, кто поступает так» естественно передаёт судебную направленность ἐπί и сохраняет отсылку τὰ τοιαῦτα; настоящее время «поступает» может выражать характерное поведение.
  issues:
  - severity: medium
    issue: Неестественное и несколько избыточное «совершается по истине».
    rationale: В греческом тексте стоит ἐστιν («есть»), а не глагол совершения. Русское «совершается» меняет построение высказывания и создаёт ненужный процессуальный оттенок; «соответствует истине» точнее передаёт значение κατὰ ἀλήθειαν в современном русском.
  revised_text: И мы знаем, что Божий суд над теми, кто поступает так, соответствует истине[a].
  revised_footnotes:
  - marker: a
    text: 'Или: «по истине»; то есть Божий суд соответствует тому, что истинно.'
