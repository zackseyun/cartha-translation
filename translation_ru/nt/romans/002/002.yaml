revisions:
- from: И мы знаем, что Божий суд над теми, кто поступает так, совершается по истине[a].
  to: И мы знаем, что Божий суд над теми, кто поступает так, соответствует истине[a].
  rationale: Заменено «совершается по истине» на «соответствует истине», чтобы сохранить значение κατὰ ἀλήθειαν («в соответствии с истиной») в естественном современном русском и не добавлять к ἐστιν оттенок происходящего действия. Сноска сохраняет более буквальный вариант «по истине».
