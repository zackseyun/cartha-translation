source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: ru
  text: А тем, кто движим своекорыстным честолюбием[a], не повинуется истине, но повинуется неправедности[b], — гнев и ярость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руководствуется своекорыстным соперничеством».'
    reason: Лексема ἐριθεία может подчёркивать не только эгоистичное честолюбие, но и соперничающее, партийное стремление.
  - marker: b
    text: 'Или: «несправедливости».'
    reason: ἀδικία может обозначать как неправедность вообще, так и несправедливость.
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: движим своекорыстием
  rationale: Оборот ἐξ указывает на источник или побуждение; перевод передаёт корыстный, эгоистически-соперничающий мотив и естественно звучит по-русски.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: не повинуется истине
  rationale: Глагол ἀπειθέω здесь выражает сознательное неповиновение, а не только неверие; сохранено управление с дательным падежом.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: но повинуется неправде
  rationale: Перевод сохраняет смысловой и грамматический параллелизм с неповиновением истине, а δέ передаётся противопоставлением «но».
- source_word: ἀδικίᾳ
  choice: неправде
  rationale: «Неправда» сохраняет широкий нравственный и богословский смысл ἀδικία как противоположности истине и праведности; более узкое «несправедливость» дано в примечании.
- source_word: ὀργὴ
  choice: гнев
  rationale: Слово передаёт торжественный и судебный характер Божьего гнева в контексте суда.
- source_word: θυμός
  choice: ярость
  rationale: В сочетании с ὀργή усиливает выражение и передаёт пылкую силу гнева.
- source_word: implicit verbal ellipsis
  choice: тире перед «гнев и ярость» без добавления глагола
  rationale: В греческом тексте сказуемое не выражено; русское тире сохраняет краткость и напряжённость конструкции, не добавляя отсутствующего в стихе глагола.
theological_decisions:
- issue: Передача ἀδικία в контексте Божьего суда
  choice: неправда
  alternative: несправедливость
  rationale: «Неправда» шире и сохраняет нравственно-богословское противопоставление истине, тогда как «несправедливость» может быть понята преимущественно как нарушение общественной справедливости.
translation_notes:
  register: Современный литературный русский язык с торжественной краткостью. Единственное число после относительного местоимения «кто» является нормативным русским соответствием греческим формам множественного числа. Эллиптическая концовка оригинала сохранена.
