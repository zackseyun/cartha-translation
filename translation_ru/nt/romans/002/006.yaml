  text: who will repay each one according to his works[a][b].
translation:
  language: ru
  text: Который воздаст каждому по его делам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально «его»; здесь в обобщающем смысле: «по делам каждого человека».'
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Который
  rationale: Относительное местоимение прямо связывает высказывание с Богом в предшествующем контексте; «Который» естественно продолжает русское предложение.
- source_word: ἀποδώσει
  choice: воздаст
  rationale: Глагол означает дать в ответ, отплатить или возместить; «воздаст» сохраняет судебный смысл воздаяния и соответствует достоинству контекста.
- source_word: ἑκάστῳ
  choice: каждому
  rationale: Передаёт распределительное значение формы единственного числа и подчёркивает личную ответственность каждого человека.
- source_word: κατὰ
  choice: по
  rationale: В сочетании «по его делам» естественно выражает меру или основание, соответствующее греческому κατὰ с винительным падежом.
- source_word: τὰ ἔργα
  choice: делам
  rationale: «Дела» — прямой и устойчивый русский эквивалент ἔργα, сохраняющий значимую для Павла лексику.
- source_word: αὐτοῦ
  choice: его
  rationale: Формально передаёт греческое местоимение мужского рода единственного числа; его обобщающее значение разъяснено в сноске.
theological_decisions:
- issue: Суд по делам
  choice: 'Сохранена формулировка судебного воздаяния: «воздаст каждому по его делам».'
  alternative: Ослабить смысл словами «поступит» или сузить его до положительной «награды».
  rationale: Греческий текст прямо говорит о воздаянии в соответствии с делами. Перевод сохраняет это богословское напряжение и не гармонизирует стих с другими рассуждениями Павла об оправдании.
translation_notes:
  register: 'Современный литературный русский язык с краткой, торжественной и естественной библейской формулировкой. «Воздаст» сохраняет судебно-нравственный оттенок без излишней архаизации. Отдельная сноска о варианте «поступкам» не нужна: русское «делам» ясно и лексически точно.'
