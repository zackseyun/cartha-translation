  terminology: «Нетление» удачно сохраняет широту ἀφθαρσία, не сводя термин к биологическому бессмертию. «Вечная жизнь», «слава» и «честь» нормативны. Множественное «в добрых делах» — естественный русский способ выразить обобщённую практику добра; смысл единственного ἔργου не изменяется.
