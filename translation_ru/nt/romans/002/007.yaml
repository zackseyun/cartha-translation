  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: ru
  text: вечную жизнь — тем, кто, проявляя стойкость в добрых делах, ищет славы, чести и нетления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: упорно делая добро
  rationale: Передаёт постоянство и стойкость (ὑπομονή), а также естественно выражает смысл сочетания ἔργου ἀγαθοῦ без тяжеловесного «в добром деле».
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: славы, чести и нетления
  rationale: Сохраняет три однородных объекта поиска и передаёт ἀφθαρσία как «нетление», не сужая его до одной лишь физической бессмертности.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшийся и точный русский эквивалент, сохраняющий эсхатологическое содержание выражения.
theological_decisions:
- issue: Связь вечной жизни с упорством в добрых делах
  choice: Сохранить прямую формулировку стиха без поясняющей богословской оговорки
  alternative: Добавить формулировку, исключающую понимание дел как основания воздаяния
  rationale: Греческий текст непосредственно связывает вечную жизнь с теми, кто проявляет стойкость в добре; перевод не должен заранее разрешать напряжение с другими высказываниями Послания.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и dignified, синтаксически продолжает Рим 2:6. «Упорно» выбрано как понятная передача постоянства, а «нетление» сохраняет библейскую точность.
