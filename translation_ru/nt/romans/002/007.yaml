  source_fidelity: 'Греческое καθ’ ὑπομονὴν ἔργου ἀγαθοῦ обозначает поиск, совершаемый «с постоянством/стойкостью в добром деле (делании добра)». «Упорно делая добро» в целом передаёт смысл, но «упорно» может иметь оттенок упрямства и менее прямо выражает существительное ὑπομονή. Остальные элементы переданы точно: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν — «славы, чести и нетления», ζωὴν αἰώνιον — «вечную жизнь».'
