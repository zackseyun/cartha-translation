reference: Romans 2:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: ru
  text: Но иудей — тот, кто внутренне является иудеем, и обрезание — обрезание сердца, по Духу[a], а не по букве. Такому хвала не от людей, а от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в духе, а не в букве». Сочетание ἐν πνεύματι может означать действие Святого Духа либо внутреннюю духовную сферу; греческий текст не устраняет эту неоднозначность полностью.'
    reason: Сохраняет альтернативное понимание ἐν πνεύματι, не предрешая спорный вопрос о его референте.
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: внутри
  rationale: Передаёт внутреннюю, скрытую реальность в противопоставлении внешним признакам; по-русски звучит естественнее, чем буквальное «в сокровенном».
- source_word: Ἰουδαῖος
  choice: иудей
  rationale: В данном контексте речь идёт о религиозно-заветной принадлежности, а не просто о жителе Иудеи.
- source_word: περιτομὴ καρδίας
  choice: обрезание сердца
  rationale: Сохраняет библейскую метафору и ясно указывает на внутренний характер описываемого обрезания.
- source_word: ἐν πνεύματι
  choice: по Духу
  rationale: Естественно выражает действие или сферу Святого Духа в павловском противопоставлении Духа и буквы, при этом неоднозначность отмечена в сноске.
- source_word: οὐ γράμματι
  choice: не по букве
  rationale: Сохраняет ключевую лексему «буква» и естественное для русского языка противопоставление «по Духу — по букве».
- source_word: οὗ ὁ ἔπαινος
  choice: Такому хвала
  rationale: Ясно связывает относительное местоимение с человеком, который является иудеем внутри, и избегает тяжеловесного «чья хвала».
- source_word: ἐξ ἀνθρώπων
  choice: от людей
  rationale: Точно передаёт обобщённое значение множественного числа без ограничения только мужчинами.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Прямое и естественное соответствие греческому выражению.
theological_decisions:
- issue: Относится ли πνεύματι к Святому Духу или к человеческому духу, то есть внутренней духовной реальности
  choice: 'Святой Дух: «по Духу»'
  alternative: «в духе» или «духовное, а не буквальное»
  rationale: Павловское противопоставление Духа и буквы вероятнее всего указывает на действие Святого Духа. Поскольку грамматика допускает и более общее понимание внутренней духовной реальности, оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но доступным строем. Эллиптическая структура греческого текста слегка прояснена повтором «иудей» и указательным «такому», без добавления конфессионально обусловленного толкования.
