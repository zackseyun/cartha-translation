  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: ru
  text: Ибо все, кто согрешили без Закона, без Закона и погибнут; и все, кто согрешили под Законом, будут судимы по Закону[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Закон». «Без Закона» в обеих частях также можно передать: «беззаконно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: не имея Закона
  rationale: Передаёт не просто беззаконное поведение, а отсутствие Моисеева Закона у первой группы и сохраняет противопоставление тем, кто находится под Законом.
- source_word: ἥμαρτον
  choice: согрешил
  rationale: Естественно передаёт аорист без излишнего уточнения вида или характера совершённых грехов.
- source_word: ἀπολοῦνται
  choice: погибнут
  rationale: Сохраняет общий смысл будущей гибели, не уточняя её природу и не подменяя глагол прямым указанием на осуждение или уничтожение.
- source_word: ἐν νόμῳ
  choice: под Законом
  rationale: Естественно выражает нахождение в сфере действия и юрисдикции Моисеева Закона; буквальное «в Законе» по-русски менее ясно.
- source_word: διὰ νόμου
  choice: посредством Закона
  rationale: Передаёт διά с родительным как средство или основание судебного разбирательства и отличает эту фразу от ἐν νόμῳ.
- source_word: κριθήσονται
  choice: будут судимы
  rationale: Сохраняет нейтральное судебное значение и не заменяет его более узким «будут осуждены».
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: все, кто… и все, кто
  rationale: Сохраняет распределительный смысл и параллелизм двух групп.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно связывает стих с предшествующим рассуждением как его обоснование.
theological_decisions:
- issue: Значение νόμος
  choice: Моисеев Закон, обозначенный словом «Закон»
  alternative: закон в общем нравственном смысле
  rationale: Контраст между не имеющими Закона и находящимися под ним в контексте Рим 2 прежде всего относится к язычникам и иудеям. Прописная буква помогает обозначить Моисеев Закон без добавления толкования в основной текст.
- issue: Смысл ἀπολοῦνται в отношении окончательного суда
  choice: «погибнут» без уточнения характера гибели
  alternative: «будут осуждены» или «будут уничтожены»
  rationale: Сам стих не определяет способ и природу окончательной гибели; перевод сохраняет богословскую напряжённость и не разрешает её в пользу конкретной доктрины.
- issue: Суд посредством Закона
  choice: «будут судимы посредством Закона»
  alternative: «будут осуждены по Закону»
  rationale: κρίνω обозначает судебное рассмотрение, а не обязательно выраженное самим глаголом осуждение; формулировка также сохраняет инструментальный оттенок διά.
translation_notes:
  register: Современный литературный русский язык с ясным параллелизмом двух частей. Повтор «не имея Закона» намеренно сохранён вслед за двукратным ἀνόμως. «Под Законом» идиоматично передаёт сферу его действия, а «посредством Закона» сохраняет отличие предлогов ἐν и διά.
