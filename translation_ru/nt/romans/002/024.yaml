  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: γὰρ («Ведь») сохраняет пояснительную связь; δι’ ὑμᾶς передано причинным «из-за вас»; настоящее страдательное βλασφημεῖται — «хулится»; ἐν τοῖς ἔθνεσιν адекватно передано как «среди язычников» с сохранением варианта «среди народов» в сноске; καθὼς γέγραπται — «как написано».'
  naturalness: Фраза естественна для современного литературного русского. «Ведь» и «как написано» уместны в связном апостольском рассуждении; «хулится» — ясное, сдержанно высокое слово, соответствующее регистру.
  terminology: «Имя Бога» и «хулится» точно сохраняют библейскую терминологию без излишнего толкования. «Язычники» соответствует контексту противопоставления иудеев и неевреев; сноска корректно отмечает более широкое лексическое значение «народы». Сноска о библейском фоне не выдает аллюзию за дословную цитату одного определённого места.
