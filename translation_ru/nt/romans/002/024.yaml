id: ROM.2.24
reference: Romans 2:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: ru
  text: Ведь из-за вас имя Бога хулится среди язычников[b][a], как написано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди народов».'
    reason: lexical_alternative
  - marker: b
    text: Павел перекликается с Писанием, прежде всего с Ис. 52:5; сходная тема звучит также в Иез. 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим обличением естественно для современного русского языка.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: имя Бога
  rationale: Сохраняет прямую библейскую формулировку; возможный оттенок репутации не вводится в основной текст как поясняющий пересказ.
- source_word: δι’ ὑμᾶς
  choice: из-за вас
  rationale: διά с винительным падежом здесь выражает причину и подчёркивает обвинение Павла.
- source_word: βλασφημεῖται
  choice: хулится
  rationale: Настоящее пассивное передано кратко и с сохранением сильного религиозного значения глагола.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди язычников
  rationale: В иудейско-языческом контексте Послания речь естественнее всего идёт о неевреях; буквальная альтернатива отмечена в сноске.
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Устойчивая и естественная русская формула введения ссылки на Писание, достаточно передающая καθώς.
theological_decisions:
- issue: Смысл ἔθνη
  choice: язычники
  alternative: народы
  rationale: Контекст противопоставляет иудеев и неевреев, однако лексическая широта слова сохранена в сноске.
- issue: Характер ссылки на Писание
  choice: общая формула «как написано» с пояснительной сноской
  alternative: ввести прямую ссылку на Исаию в основной текст
  rationale: Греческий текст не называет книгу, поэтому основной текст не уточняет источник сверх оригинала.
translation_notes:
  register: Современный литературный русский; краткая, весомая обличительная фраза. «Хулится» сохраняет библейское достоинство и остаётся понятным без конфессионально окрашенного толкования.
