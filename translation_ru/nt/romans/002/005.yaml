revisions:
- from: Но из-за своего упорства и нераскаянного сердца ты сам копишь себе гнев на день гнева и откровения праведного суда Божьего[a].
  to: Но из-за своей ожесточённости и нераскаянного сердца ты копишь себе гнев на день гнева и откровения праведного суда Божьего[a].
  rationale: 'Исправлены два места для более точной передачи греческого текста: σκληρότης передано как «ожесточённость», а не как потенциально нейтральное «упорство»; не имеющее прямого основания усилительное «сам» удалено. Именная конструкция о дне гнева и откровении суда сохранена без превращения в придаточное предложение.'
