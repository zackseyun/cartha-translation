id: ROM.2.5
reference: Romans 2:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: ru
  text: Но из-за своей ожесточённости и нераскаянного сердца ты копишь себе гнев на день гнева и откровения праведного суда Божьего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливого суда Божьего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Но из-за
  rationale: Передаёт мягкое противопоставление δέ и причинный оттенок κατά с винительным падежом естественным современным русским языком.
- source_word: σκληρότης
  choice: упорство
  rationale: В данном нравственном контексте обозначает ожесточённое нежелание измениться; «упорство» звучит естественнее буквальной «жестокости» и не смешивает это понятие с причинением страданий другим.
- source_word: ἀμετανόητον καρδίαν
  choice: нераскаянное сердце
  rationale: Сохраняет образ сердца и прямо передаёт отсутствие покаяния.
- source_word: θησαυρίζεις
  choice: копишь
  rationale: Сохраняет метафору постепенного накопления, при этом естественно сочетается с отрицательным объектом «гнев».
- source_word: σεαυτῷ
  choice: сам копишь себе
  rationale: «Себе» передаёт возвратный дательный, а «сам» подчёркивает личную ответственность, заложенную в σεαυτῷ.
- source_word: ὀργή
  choice: гнев
  rationale: Устоявшийся и точный эквивалент в контексте Божьего суда, сохраняющий его тяжесть.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: на день гнева и откровения
  rationale: «На день» естественно по-русски связывается с накоплением и одновременно указывает на день, когда накопленный гнев проявится; координация существительных сохранена.
- source_word: δικαιοκρισία
  choice: праведный суд
  rationale: Передаёт составное значение справедливого, соответствующего правде суда и сохраняет характерную библейскую лексику.
- source_word: τοῦ θεοῦ
  choice: Божьего
  rationale: Естественная русская притяжательная конструкция, ясно относящая суд к Богу.
theological_decisions:
- issue: Следует ли превращать именную конструкцию «день гнева и откровения» в придаточное времени.
  choice: 'Сохранена именная конструкция: «на день гнева и откровения праведного суда Божьего».'
  alternative: «на день гнева, когда откроется праведный суд Божий»
  rationale: В греческом тексте нет личной глагольной формы «откроется»; сохранение координированных существительных не устраняет исходную синтаксическую напряжённость.
- issue: Как передать δικαιοκρισία τοῦ θεοῦ.
  choice: «праведного суда Божьего»
  alternative: «справедливого суда Бога»
  rationale: Оба варианта передают справедливость суда; основной вариант ближе к библейскому регистру, а более общеупотребительный лексический эквивалент указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Обращение во втором лице единственного числа сохранено. Формулировка остаётся близкой к греческой именной структуре, но звучит естественно для обычного современного читателя.
