lexical_decisions:
- source_word: γάρ
  choice: Потому что
  rationale: Союз вводит основание для предшествующего утверждения и естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: προσωπολημψία
  choice: лицеприятие
  rationale: Слово обозначает пристрастное отношение к человеку из-за его положения или внешних признаков. «Лицеприятие» точно передаёт нравственно-судебный смысл и сохраняет связь с библейской речью.
- source_word: παρὰ τῷ θεῷ
  choice: у Бога
  rationale: В данном сочетании παρά с дательным указывает на то, что свойственно или имеет место у Бога; русское «у Бога» близко к греческой конструкции и звучит естественно.
- source_word: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ
  choice: Потому что у Бога нет лицеприятия.
  rationale: Сохранена экзистенциальная конструкция греческого текста, а не введено отсутствующее в нём активное действие «Бог не проявляет».
theological_decisions:
- issue: Выражение Божьего нелицеприятия
  choice: 'Сформулировать как общее утверждение: «у Бога нет лицеприятия».'
  alternative: «Бог никому не оказывает предпочтения».
  rationale: Оба варианта выражают мысль текста, но выбранный точнее сохраняет греческую экзистенциальную конструкцию и не сужает её до конкретного действия.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Лицеприятие» менее разговорно, но точно и понятно по контексту; сноска предлагает более общеупотребительный эквивалент.
