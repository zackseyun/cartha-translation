id: ROM.2.13
reference: Romans 2:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: ru
  text: Ведь не слушающие закон праведны перед Богом, но исполняющие закон будут оправданы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут признаны праведными»; возможный перевод: «их правота будет подтверждена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: слушающие
  rationale: Субстантивированное причастие естественно передаёт тех, кто слышит закон, и сохраняет прямое противопоставление исполняющим его.
- source_word: νόμου
  choice: закон
  rationale: Хотя в греческом существительное употреблено без артикля, контекст указывает на уже обсуждаемый закон; по-русски определённость не требует отдельного показателя.
- source_word: δίκαιοι
  choice: праведны
  rationale: Сохраняет судебно-нравственный смысл и терминологическую связь с лексикой оправдания в Послании к римлянам.
- source_word: παρὰ τῷ θεῷ
  choice: перед Богом
  rationale: Естественно выражает положение человека в Божьей оценке или на Божьем суде.
- source_word: ποιηταὶ
  choice: исполняющие
  rationale: В данном контексте речь идёт не просто о совершающих отдельные действия, а о тех, кто исполняет требования закона; формулировка ясна современному читателю.
- source_word: δικαιωθήσονται
  choice: будут оправданы
  rationale: Передаёт будущее страдательного залога и сохраняет значимую для Послания к римлянам терминологическую связь с δικαιόω.
theological_decisions:
- issue: Передача δικαιωθήσονται без сужения его судебного и богословского смысла
  choice: будут оправданы
  alternative: будут признаны праведными; их правота будет подтверждена
  rationale: «Будут оправданы» сохраняет традиционный термин и грамматический пассив, не решая однозначно, следует ли понимать глагол как объявление праведным или подтверждение правоты; альтернативы вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык; краткая, риторически уравновешенная конструкция сохраняет противопоставление между слушанием и исполнением закона. Термин «оправданы» выбран ради лексической и богословской связности Послания к римлянам.
