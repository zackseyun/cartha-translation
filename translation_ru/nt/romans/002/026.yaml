  source_fidelity: 'Основной смысл передан верно: ἀκροβυστία в первом случае метонимически обозначает необрезанного человека, δικαιώματα — требования Закона, а вопрос сохраняет ожидаемый утвердительный ответ. Однако «будет вменено ему» добавляет в русском тексте адресата действия, которого в греческом нет: подлежащее λογισθήσεται — «его необрезание», а αὐτοῦ является притяжательным определением. Более точна безлично-пассивная конструкция без «ему».'
