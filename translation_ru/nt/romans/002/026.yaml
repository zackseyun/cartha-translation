  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: ru
  text: Итак, если необрезанный соблюдает требования Закона, разве его необрезание не будет засчитано за обрезание?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если необрезание соблюдает… разве его необрезание не будет засчитано за обрезание?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: необрезанный / его необрезание
  rationale: Первое употребление метонимически указывает на необрезанного человека, что естественно передано субстантивированным прилагательным; второе, с αὐτοῦ, обозначает его состояние и потому передано буквально как «его необрезание».
- source_word: δικαιώματα
  choice: требования
  rationale: В данном контексте множественное число обозначает то, что предписывает Закон; «требования» ясно передаёт смысл без излишней терминологичности.
- source_word: νόμου
  choice: Закона
  rationale: Речь идёт о Законе в контексте Павлова рассуждения о Моисеевом Законе; прописная буква помогает обозначить этот конкретный религиозно-исторический референт.
- source_word: φυλάσσῃ
  choice: соблюдает
  rationale: Это естественный современный русский глагол для исполнения предписаний закона.
- source_word: λογισθήσεται
  choice: будет вменено
  rationale: «Вменено» сохраняет расчётно-оценочный оттенок λογίζομαι и характерную для Павла лексику признания чего-либо за кем-либо.
- source_word: εἰς περιτομήν
  choice: как обрезание
  rationale: 'Предлог εἰς здесь указывает на итоговый статус или категорию: необрезание засчитывается как обрезание.'
- source_word: οὐχ
  choice: разве ... не
  rationale: Такая форма естественно передаёт риторический вопрос, предполагающий утвердительный ответ.
theological_decisions:
- issue: Отношение необрезания к обрезанию
  choice: Сохранена формулировка о вменении необрезания как обрезания
  alternative: Пояснить как признание необрезанного равным обрезанному перед Богом
  rationale: Текст говорит о засчитывании статуса и не уточняет здесь все богословские последствия; перевод не должен разрешать эту напряжённость поясняющей парафразой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского дискурса. «Необрезанный» понятно обозначает человека без добавления слова «мужчина», а «вменено» сохраняет важный смысловой оттенок исходного глагола.
