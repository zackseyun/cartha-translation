  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: ru
  text: Но если ты называешь себя иудеем[a], полагаешься на Закон[b] и хвалишься Богом,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «носишь имя иудея»; или: «именуешься иудеем».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «опираешься на Закон»; возможно также: «находишь покой в Законе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Но если
  rationale: Сохраняет условное значение εἰ и лёгкий противопоставительный оттенок δέ в продолжающемся рассуждении Павла.
- source_word: Ἰουδαῖος
  choice: иудей
  rationale: В Послании к римлянам слово обозначает прежде всего этнорелигиозную принадлежность, а не только происхождение из Иудеи.
- source_word: ἐπονομάζῃ
  choice: называешь себя
  rationale: 'Средний залог допускает возвратное понимание: человек сам относит к себе это почётное наименование. Выражение естественно по-русски и сохраняет риторическую остроту.'
- source_word: ἐπαναπαύῃ
  choice: полагаешься на
  rationale: Передаёт смысл уверенной опоры, а не буквального покоя, и естественно сочетается с упоминанием Закона.
- source_word: νόμῳ
  choice: Закон
  rationale: Контекст указывает на Моисеев Закон как известную религиозно-заветную категорию; прописная буква помогает ясно передать эту отсылку без добавления отсутствующих слов.
- source_word: καυχᾶσαι
  choice: хвалишься
  rationale: Сохраняет характерный для Павла глагол со смыслом гордости или похвалы, не решая заранее, положительна или порочна эта похвала.
- source_word: ἐν θεῷ
  choice: Богом
  rationale: Русский творительный падеж после «хвалиться» естественно передаёт конструкцию ἐν θεῷ и сохраняет Бога как основание похвалы.
theological_decisions:
- issue: Характер отношения к Закону в ἐπαναπαύῃ νόμῳ
  choice: полагаешься на Закон
  alternative: находишь покой в Законе
  rationale: Выбранный вариант передаёт доверие и опору, которые важны для хода аргумента, но не добавляет явной оценки как «ложной» или «самонадеянной», поскольку она становится ясна из контекста.
translation_notes:
  register: Современный литературный русский язык с прямым обращением на «ты», соответствующим греческому σὺ. Синтаксис сохранён как начало длинного условного периода, продолжающегося в следующих стихах. «Иудей» и «Закон» выбраны как привычные библейские термины; формулировка остаётся понятной без архаизации.
