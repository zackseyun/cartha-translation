source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: ru
  text: наставника неразумных, учителя младенцев, имеющего в Законе образец[a] знания и истины —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «форму знания и истины».'
    reason: Лексическая неоднозначность слова μόρφωσις.
lexical_decisions:
- source_word: παιδευτὴν
  choice: наставник
  rationale: Слово обозначает того, кто обучает и воспитывает; «наставник» естественно передаёт образовательный смысл, не выдвигая на первый план наказание.
- source_word: ἀφρόνων
  choice: неразумных
  rationale: Передаёт отсутствие разумения и сохраняет пренебрежительный оттенок самоописания говорящего; в современном русском звучит естественнее, чем «безрассудных» в этой учебной паре.
- source_word: διδάσκαλον
  choice: учитель
  rationale: Прямой и общеупотребительный эквивалент.
- source_word: νηπίων
  choice: младенцев
  rationale: Сохраняет буквальный образ совсем малых детей и его риторическую резкость, не подменяя возможное переносное значение толкованием «незрелых».
- source_word: ἔχοντα
  choice: имеющий
  rationale: Сохраняет причастную конструкцию и её связь с предшествующим рядом характеристик.
- source_word: μόρφωσιν
  choice: воплощение
  rationale: Здесь слово может обозначать форму, выражение или воплощение. «Воплощение» естественно передаёт мысль о Законе как конкретном выражении знания и истины, хотя лексическая неоднозначность остаётся существенной.
- source_word: γνώσεως
  choice: знания
  rationale: Прямой эквивалент, естественно образующий пару с «истиной».
- source_word: ἀληθείας
  choice: истины
  rationale: Прямой эквивалент, сохраняющий характерную смысловую пару со знанием.
- source_word: ἐν τῷ νόμῳ
  choice: в Законе
  rationale: Предлог передан буквально; прописная буква ясно указывает на иудейский Закон в данном контексте без дополнительного истолкования.
theological_decisions:
- issue: Характер обладания μόρφωσις в Законе
  choice: воплощение знания и истины
  alternative: форму знания и истины
  rationale: Контекст передаёт заявленное преимущество знающего Закон, но сам стих не решает, означает ли μόρφωσις полноценное воплощение или лишь форму/очертание. Основной текст выбирает естественное контекстуальное значение, не добавляя конфессионального вывода.
translation_notes:
  register: Современный литературный русский с достоинством и сохранением риторического ряда. «Младенцев» оставлено буквально ради образности; «Закон» написан с прописной буквы как обозначение иудейского Закона. Конечное тире сохраняет незавершённость синтаксического ряда, продолжающегося из предыдущего стиха и ведущего к следующему.
