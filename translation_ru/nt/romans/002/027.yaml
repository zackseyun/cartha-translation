  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: ru
  text: И тот, кто от природы необрезан[a] и исполняет закон, будет судить тебя — нарушителя закона, хотя у тебя есть писаный закон[b] и обрезание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «необрезание»; здесь имеется в виду необрезанный человек.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «через букву»; «буква» здесь, вероятно, обозначает закон в его письменной форме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: тот, кто… необрезан
  rationale: Греческое существительное буквально означает «необрезание», но здесь метонимически обозначает необрезанного человека. Личная конструкция естественна по-русски и не подменяет слово более широким этническим обозначением «язычник».
- source_word: ἐκ φύσεως
  choice: от природы
  rationale: Сохраняет прямой смысл выражения и противопоставление природного состояния обладанию обрезанием.
- source_word: τελοῦσα
  choice: исполняет
  rationale: Причастие τελοῦσα передаёт реальное исполнение закона. Личная форма нужна из-за естественной русской конструкции «тот, кто»; союз «но» ясно выражает контраст, подразумеваемый контекстом.
- source_word: νόμον
  choice: закон
  rationale: В контексте речь идёт о конкретно известном Божьем законе; строчная буква соответствует обычной современной русской библейской стилистике.
- source_word: διὰ γράμματος
  choice: хотя у тебя есть писаный закон
  rationale: Буквальное «через букву» в современном русском здесь неясно. Оборот передаёт наличие закона в письменной форме и контраст между обладанием им и его нарушением; более буквальный вариант указан в сноске.
- source_word: περιτομῆς
  choice: обрезание
  rationale: Прямое и устоявшееся обозначение знака завета.
- source_word: παραβάτην νόμου
  choice: преступника закона
  rationale: Сохраняет явную связь существительного «преступник» с νόμος, не сворачивая выражение до общего «нарушитель».
theological_decisions:
- issue: Следует ли передать ἀκροβυστία этническим словом «язычник»
  choice: 'Сохранено более узкое обозначение: «тот, кто от природы необрезан».'
  alternative: «язычник»
  rationale: Контекст касается иудеев и язычников, однако само слово в данном стихе подчёркивает противопоставление обрезания и необрезания. Перевод не делает этническую отсылку более явной, чем греческий текст.
- issue: Смысл διὰ γράμματος καὶ περιτομῆς при характеристике нарушителя закона
  choice: 'Передано уступительно: «хотя у тебя есть писаный закон и обрезание».'
  alternative: «через букву и обрезание» / «при букве и обрезании»
  rationale: Греческий предлог допускает инструментальное звучание, но мысль в контексте состоит в том, что обладание письменным законом и обрезанием не предотвращает преступления закона. Уступительная формулировка делает эту связь понятной, не приписывая самим закону и обрезанию причинной силы.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным синтаксисом. Тире выделяет приложение «преступника закона». Формулировка избегает как архаичного «при Писании», так и неясного буквального оборота «через букву», сохраняя последний в сноске.
