  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: ru
  text: Ты, хвалящийся законом, бесчестишь Бога, нарушая закон?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: законом
  rationale: Творительный падеж естественно передаёт предмет или основание похвальбы в выражении καυχᾶσαι ἐν, не сводя смысл к простому разговору «о законе».
- source_word: καυχᾶσαι
  choice: хвалящийся
  rationale: Сохраняет критический оттенок καυχάομαι и согласуется с формой обращения во втором лице единственного числа.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: нарушая закон
  rationale: Деепричастный оборот естественно по-русски передаёт средство или основание бесчестия. Хотя греческий использует существительное παράβασις, буквальное «через нарушение закона» звучало бы тяжеловесно.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Определённый референт естественно выражается русским именем «Бог» без передачи греческого артикля отдельным элементом.
- source_word: ἀτιμάζεις
  choice: бесчестишь
  rationale: Точно сохраняет значение лишения чести и резкий риторический контраст между похвальбой законом и его нарушением.
theological_decisions:
- issue: Значение νόμος в контексте Павловой аргументации
  choice: закон
  alternative: Закон как графически выделенное название Моисеева закона
  rationale: Контекст указывает на данный Израилю закон, однако греческое написание само по себе не требует превращать слово в формальное собственное название. Строчная буква сохраняет естественный русский узус и не снимает контекстуальную определённость.
- issue: Связь между похвальбой и бесчестием Бога
  choice: сохранён риторический вопрос без добавления противительного союза
  alternative: «но… бесчестишь Бога»
  rationale: Противопоставление ясно из содержания, но союза «но» в греческом тексте нет; его добавление сделало бы подразумеваемую связь более явной, чем в источнике.
translation_notes:
  register: Современный литературный русский язык; обращение звучит торжественно и обличительно, но остаётся понятным. Причастный оборот сохраняет структуру греческого относительного обращения, а деепричастие делает вторую половину фразы естественной по-русски.
