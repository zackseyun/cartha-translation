source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: ru
  text: Ведь когда язычники[a], не имеющие закона, по природе[b] исполняют то, что предписывает закон[c], они, не имея закона, сами себе закон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «естественным образом»; возможный, но более узкий перевод — «инстинктивно».'
    reason: lexical_alternative
  - marker: c
    text: 'Букв.: «делают то, что относится к закону».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἔθνη
  choice: язычники
  rationale: В данном контексте Павел противопоставляет их иудеям, имеющим Моисеев закон; «язычники» яснее передаёт этнорелигиозный смысл, чем более широкое «народы».
- source_word: νόμον / νόμου / νόμος
  choice: закон
  rationale: 'Единообразный перевод сохраняет повтор и игру смыслов: речь идёт о законе, которого язычники не имеют, о его предписаниях и, наконец, о том, что они «сами себе закон».'
- source_word: φύσει
  choice: по природе
  rationale: Формально и открыто передаёт греческое слово, не сводя его заранее к инстинкту, врождённому нравственному знанию или обычаю.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: исполняют то, что предписывает закон
  rationale: Естественная русская формулировка передаёт действие в соответствии с содержанием закона; буквальная структура приведена в сноске.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: сами себе закон
  rationale: Кратко и идиоматично передаёт дательный ἑαυτοῖς и сохраняет метафорическую силу фразы, не добавляя идеи сознательного самозаконодательства.
theological_decisions:
- issue: Насколько явно истолковывать φύσει в связи с нравственным знанием и совестью
  choice: Сохранить выражение «по природе» без пояснения механизма такого поведения.
  alternative: «Инстинктивно» или «следуя врождённому нравственному чувству».
  rationale: Само слово φύσει не определяет однозначно, говорит ли Павел о врождённом нравственном знании, естественном состоянии или ином основании; перевод сохраняет богословскую открытость.
- issue: Как понимать заключение «сами себе закон»
  choice: Сохранить метафорическую формулу без развёртывания.
  alternative: «Тем самым заменяют себе закон» или «устанавливают закон для самих себя».
  rationale: Развёрнутые варианты могли бы ошибочно представить язычников как заменяющих Моисеев закон либо самостоятельно создающих нравственные нормы; греческий текст этого прямо не утверждает.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. «Ведь» естественно вводит обоснование, а повтор слова «закон» намеренно сохранён. Строчная буква не навязывает типографическое решение о том, является ли каждое употребление формальным наименованием Моисеева закона.
