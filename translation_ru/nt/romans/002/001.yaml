  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: ru
  text: Поэтому нет тебе оправдания, человек[a], — кем бы ты ни был, если судишь другого. Ведь, судя другого, ты осуждаешь самого себя, потому что ты, судящий, делаешь то же самое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Человек» — прямое обращение к любому человеку; выражение «кем бы ты ни был» передаёт всеобщий охват греческого текста.
    reason: Пояснение обобщающего значения греческого обращения ὦ ἄνθρωπε и конструкции πᾶς ὁ κρίνων.
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего рассуждения Павла.
- source_word: ἀναπολόγητος
  choice: нет тебе оправдания
  rationale: Естественно по-русски передаёт отсутствие допустимого оправдания или защиты и сохраняет судебный оттенок.
- source_word: ὦ ἄνθρωπε πᾶς ὁ κρίνων
  choice: человек, — кем бы ты ни был, судящий другого
  rationale: «Человек» сохраняет прямое обращение в единственном числе, а «кем бы ты ни был» выражает всеохватность πᾶς. Причастный оборот сохраняет характеристику адресата как судящего.
- source_word: ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον
  choice: Ведь, судя другого
  rationale: 'Деепричастный оборот естественно сочетает временной и инструментальный оттенки: человек осуждает себя самим актом суда над другим.'
- source_word: κατακρίνεις
  choice: ты осуждаешь
  rationale: Передаёт более сильное, обвинительно-судебное значение по сравнению с κρίνεις.
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: потому что ... делаешь то же самое
  rationale: Сохраняет причинную связь и тождество поступков; настоящее время допускает повторяющийся или характерный образ действий.
- source_word: ὁ κρίνων
  choice: ты, судящий
  rationale: Сохраняет повторное риторическое обозначение адресата, присутствующее в греческом тексте.
theological_decisions:
- issue: Обобщающее обращение в мужском роде
  choice: Сохранить обращение «человек» и пояснить его всеобщий смысл формулой «кем бы ты ни был» и сноской.
  alternative: «любой человек, судящий другого»
  rationale: Греческое ἄνθρωπε стоит в форме единственного числа и служит прямым риторическим обращением к любому человеку; русский «человек» естественно сохраняет и форму, и обобщающий смысл.
- issue: Связь суда над другим с самоосуждением
  choice: «судя другого, ты осуждаешь самого себя»
  alternative: «тем, чем судишь другого, осуждаешь себя»
  rationale: Выбранная формулировка сохраняет намеренную связь между актом суда и самоосуждением, не сужая неоднозначное ἐν ᾧ только до основания или критерия суда.
translation_notes:
  register: Современный литературный русский язык с сохранением напряжённой риторики прямого обращения. Порядок слов и повтор «судящий» намеренно удерживают обвинительный акцент оригинала; архаическое «о человек» не используется.
