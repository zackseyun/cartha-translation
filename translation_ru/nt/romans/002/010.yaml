  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: ru
  text: 'Но слава, честь и мир — каждому, кто делает добро[a]: прежде всего иудею, а также греку[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что хорошо».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «грек», вероятно, означает неиудея вообще, то есть язычника.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: слава
  rationale: Прямой и устойчивый библейский эквивалент, сохраняющий смысл почести и эсхатологического воздаяния.
- source_word: τιμή
  choice: честь
  rationale: Естественно передаёт значение почёта в ряду со «славой» и «миром».
- source_word: εἰρήνη
  choice: мир
  rationale: Сохраняет широкий библейский смысл, не сужая его до внутреннего спокойствия или внешнего благополучия.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: каждому, кто делает
  rationale: Естественная современная формулировка, передающая человека, для которого такое действие характерно.
- source_word: τὸ ἀγαθόν
  choice: добро
  rationale: Идиоматично передаёт субстантивированное прилагательное; буквальное «то, что хорошо» отмечено как возможная передача.
- source_word: Ἰουδαίῳ
  choice: иудею
  rationale: Прямой традиционный эквивалент; единственное число имеет обобщённый характер, как и в греческом тексте.
- source_word: πρῶτον
  choice: прежде
  rationale: Сохраняет краткость и смысл первенства или очерёдности, не поясняя его богословски.
- source_word: Ἕλληνι
  choice: греку
  rationale: Сохраняет буквальное выражение Павла в паре «иудей — грек»; более широкий смысл поясняется в сноске.
- source_word: δὲ
  choice: но
  rationale: Передаёт контраст с гневом и бедствием, о которых говорится в предыдущем стихе.
theological_decisions:
- issue: Значение Ἕλληνι в противопоставлении иудея и грека
  choice: В основном тексте — «греку», с пояснением более широкого значения в сноске.
  alternative: язычнику
  rationale: Буквально слово означает «грек», однако в данном противопоставлении оно, вероятно, охватывает неиудеев вообще. Основной текст сохраняет форму источника, а сноска — смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной структурой. Тире делает перечисление воздаяния естественным по-русски; порядок греческого текста и контраст с предыдущим стихом сохранены.
