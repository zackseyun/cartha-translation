  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: ru
  text: 'Ты, говорящий: «Не прелюбодействуй», — прелюбодействуешь? Ты, гнушающийся идолами, — грабишь храмы?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более широком смысле: «совершаешь святотатство?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Ты, говорящий
  rationale: Субстантивированное причастие передано прямым обращением к собеседнику; причастная форма сохраняет параллелизм греческого текста.
- source_word: μὴ μοιχεύειν
  choice: Не прелюбодействуй
  rationale: Инфинитив с μή передаёт содержание запрета. Русская форма повелительного наклонения естественно воспроизводит цитируемую заповедь.
- source_word: μοιχεύεις
  choice: прелюбодействуешь
  rationale: Настоящее время в риторическом вопросе имеет обобщённо-обличительный смысл и прямо повторяет корень цитируемого запрета.
- source_word: ὁ βδελυσσόμενος
  choice: Ты, гнушающийся
  rationale: Глагол выражает сильное религиозно-нравственное отвращение; «гнушаться» точно и достойно передаёт эту интенсивность.
- source_word: τὰ εἴδωλα
  choice: идолами
  rationale: В контексте речь идёт о предметах языческого почитания; «идолы» — ясный и традиционно точный русский эквивалент.
- source_word: ἱεροσυλεῖς
  choice: грабишь храмы
  rationale: Выбран конкретный смысл присвоения храмового имущества, поддерживающий резкую иронию сопоставления с отвращением к идолам; более широкий смысл отмечен в сноске.
theological_decisions:
- issue: Объём значения ἱεροσυλεῖς
  choice: грабишь храмы
  alternative: совершаешь святотатство
  rationale: Греческое слово допускает как конкретное ограбление храмов, так и более широкое святотатство. Основной текст сохраняет конкретный исторический образ, а сноска — смысловую широту без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской риторики. Две параллельные конструкции и повтор глагола «прелюбодействовать» сохраняют обличительный ритм оригинала; тире помогают естественно прочитать распространённые обращения.
