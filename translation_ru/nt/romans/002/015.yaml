  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: ru
  text: Они показывают, что дело Закона[a] написано у них в сердцах; об этом свидетельствует и их совесть, а их мысли обвиняют их или даже защищают[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «требования Закона»; или: «то, чего требует Закон».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте буквально присутствует взаимное выражение «между собой», относящееся к мыслям; возможен перевод: «а их мысли между собой то обвиняют, то даже защищают их».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: показывают
  rationale: Передаёт доказательную направленность глагола без усиления до строгого «доказывают».
- source_word: τὸ ἔργον τοῦ νόμου
  choice: дело Закона
  rationale: Сохраняет единственное число и компактность греческого выражения, не подменяя его сразу толкованием «требования Закона».
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: написано у них в сердцах
  rationale: Естественно передаёт метафору внутренней записи и множественное число греческого текста.
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: об этом свидетельствует и их совесть
  rationale: Плавно передаёт независимый родительный оборот и подтверждающий смысл составного глагола.
- source_word: τῶν λογισμῶν
  choice: их мысли
  rationale: В данном контексте λογισμοί — внутренние рассуждения или суждения человека; краткое «мысли» остаётся понятным и не сужает значение чрезмерно.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: обвиняют их или даже защищают
  rationale: «Защищают» точнее отражает ἀπολογέομαι, чем «оправдывают», а «даже» передаёт усилительное καί после ἤ.
theological_decisions:
- issue: Означает ли τὸ ἔργον τοῦ νόμου «дело Закона» или прямо «требования Закона»?
  choice: В основном тексте сохранено «дело Закона».
  alternative: «требования Закона»; «то, чего требует Закон»
  rationale: Греческий текст использует более сжатое и менее истолковывающее выражение в единственном числе; буквальная формулировка сохраняет богословскую напряжённость.
- issue: К чему относится взаимное выражение μεταξὺ ἀλλήλων и кого обвиняют либо защищают мысли?
  choice: Основной текст понимает причастия как обвинение или защиту самих людей, а взаимность относит к внутреннему взаимодействию мыслей.
  alternative: «мысли обвиняют или даже защищают друг друга»; «мысли между собой то обвиняют, то защищают»
  rationale: Синтаксис сжат и допускает различную расстановку связей. В основном тексте выбран наиболее естественный по контексту смысл, а формальная взаимность греческого выражения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным синтаксисом. Заглавная буква в слове «Закон» указывает на Моисеев Закон в ближайшем контексте, не добавляя конфессионального толкования.
