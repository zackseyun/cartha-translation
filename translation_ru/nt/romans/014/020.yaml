    rationale: Греческий текст не называет другого человека и не выражает прямо «становясь преткновением». Хотя такое прочтение хорошо поддержано ближайшим контекстом, альтернативное понимание — еда вопреки собственной совести — остается возможным и отмечено самой сноской. Основной текст должен не закрывать эту неоднозначность.
