  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: ru
  text: Не разрушай Божьего дела ради пищи. Всё, конечно, чисто, но плохо тому, кто ест с преткновением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «кто ест через преткновение». Оборот может означать, что еда человека становится для другого преткновением; возможно также понимание: человек ест вопреки сомнениям собственной совести.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: ради пищи
  rationale: Кратко и естественно передаёт причину или мотив, выраженные ἕνεκεν с родительным падежом, и подчёркивает несоразмерность пищи причиняемому вреду.
- source_word: κατάλυε
  choice: не разрушай
  rationale: Глагол сохраняет образ разрушения того, что созидает Бог; форма с μή передана запретительным повелением.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: Божьего дела
  rationale: 'Сохраняет широту выражения: речь может идти и о Божьем действии в отдельном верующем, и в общине.'
- source_word: πάντα μὲν καθαρά
  choice: Всё, конечно, чисто
  rationale: «Всё» сохраняет формальную широту πάντα, контекст связывает его с пищей, а «чисто» удерживает лексику ритуальной чистоты. Частица μέν передана словом «конечно», подготавливающим последующее противопоставление.
- source_word: κακὸν
  choice: плохо
  rationale: В предикативной конструкции «плохо человеку» это естественный современный русский эквивалент с нравственной оценкой; «зло человеку» звучало бы неестественно и могло бы означать причинённый ему вред.
- source_word: τῷ ἀνθρώπῳ
  choice: человеку
  rationale: Русское «человек» точно передаёт обобщающее ἄνθρωπος и не сужает смысл до мужчины.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: который ест, становясь преткновением для другого
  rationale: Передаёт связь еды с πρόσκομμα и оставляет допустимую смысловую неоднозначность оборота; добавление «для другого» ясно выражает межличностный контекст, не превращая саму пищу в преткновение.
theological_decisions:
- issue: Объём утверждения πάντα μὲν καθαρά в связи с пищевыми предписаниями
  choice: «Всё, конечно, чисто» — широкая формулировка, которую непосредственный контекст относит к пище.
  alternative: «Всякая пища чиста» или «всё позволительно».
  rationale: Греческий текст не содержит существительного «пища» во второй фразе и говорит именно о чистоте, а не прямо о дозволенности. Широкий перевод сохраняет богословскую напряжённость между чистотой пищи и обязанностью не вредить ближнему.
- issue: Направленность διὰ προσκόμματος
  choice: Основной текст понимает оборот как еду, при которой человек становится причиной преткновения для другого.
  alternative: «Который ест, несмотря на сомнения совести» — еда через собственное преткновение.
  rationale: Синтаксис допускает обсуждение оттенка, а контекст 14:13, 15, 21 особенно поддерживает межличностное понимание. Сноска сохраняет более буквальную формулировку и связанную с ней неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис краткий и афористичный; термин «преткновение» сохранён ради павловского образа, а его смысл пояснён в сноске.
