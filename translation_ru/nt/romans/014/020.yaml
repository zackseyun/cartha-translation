review_pass:
  verdict: revise
  source_fidelity: Первая часть передана точно. «Всё, конечно, чисто» удачно сохраняет широту πάντα и лексику чистоты. Однако «становясь преткновением для другого» делает человека прямым преткновением и однозначно выбирает межличностное толкование, тогда как διὰ προσκόμματος синтаксически и контекстуально допускает также связь еды с преткновением собственной совести. Более нейтральная формулировка сохраняет эту спорную неоднозначность.
  naturalness: «Плохо тому, кто ест с преткновением» несколько отмечено библейским регистром, но ясно в контексте и естественнее, чем буквальная калька «ест через преткновение». Такой регистр оправдан павловской терминологией и поддерживается сноской.
  terminology: «Божье дело», «чисто» и «преткновение» сохраняют существенные образы и термины оригинала. «Человек» в исходном проекте правильно передаёт обобщающее ἄνθρωπος; в пересмотре конструкция «тому, кто» столь же инклюзивна и не сужает референт до мужчины.
