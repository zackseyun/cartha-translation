revisions:
- from: Не разрушай Божьего дела ради пищи. Всё, конечно, чисто, но плохо человеку, который ест, становясь преткновением для другого.[a]
  to: Не разрушай Божьего дела ради пищи. Всё, конечно, чисто, но плохо тому, кто ест с преткновением.[a]
  rationale: Заменена формулировка, представлявшая едока как прямое «преткновение для другого», на более нейтральное «ест с преткновением». Она сохраняет образ πρόσκομμα и не предрешает, относится ли преткновение к другому человеку или к совести самого едока. Сноска объясняет оба возможных направления без внесения их в основной текст.
