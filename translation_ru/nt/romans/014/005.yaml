  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: ru
  text: Кто-то считает один день важнее другого[a], а кто-то считает все дни одинаковыми[b]. Пусть каждый будет полностью убеждён в собственном мнении[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считает один день особым по сравнению с другим».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый день»; по смыслу противопоставления — не делая различия между днями.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будет совершенно уверен»; «будет вполне удостоверен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: считает
  rationale: В данном контексте глагол означает оценивать или рассматривать определённым образом, а не осуждать. «Считает» естественно передаёт это значение по-русски.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: один день важнее другого
  rationale: Оборот с παρά выражает сравнительное различие между днями. Перевод сохраняет сравнение, не уточняя, о каких именно днях идёт речь.
- source_word: πᾶσαν ἡμέραν
  choice: все дни одинаковыми
  rationale: Буквально сказано «каждый день», однако противопоставление первой части подразумевает отсутствие различия между днями. «Одинаковыми» делает этот смысл ясным.
- source_word: ἕκαστος
  choice: каждый
  rationale: Сохраняет единственное число и распределительный акцент греческого слова.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: в собственном мнении
  rationale: νοῦς обозначает ум, понимание или внутреннее суждение. В русском контексте убеждённости «в собственном мнении» звучит естественно и не вводит дополнительного богословского смысла.
- source_word: πληροφορείσθω
  choice: пусть будет полностью убеждён
  rationale: Форма повелительного наклонения выражает призыв к полной, устойчивой уверенности; перевод сохраняет эту силу и допускаемую пассивную оттеночность.
theological_decisions:
- issue: Какие именно дни имеются в виду
  choice: 'Оставить обозначение общим: «день», без уточнения.'
  alternative: Назвать субботы, иудейские праздники или дни поста.
  rationale: Павел не определяет здесь природу этих дней, поэтому перевод не должен снимать оставленную текстом неоднозначность.
- issue: Характер убеждённости каждого человека
  choice: Передать личную убеждённость без утверждения, что всякое мнение объективно верно.
  alternative: Сформулировать как одобрение любого личного выбора.
  rationale: Стих требует полноты убеждения, но сам по себе не объявляет все позиции одинаково истинными.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный регистр без конфессионально окрашенной терминологии. Общий характер упоминания дней сохранён.
