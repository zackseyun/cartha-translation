  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: ru
  text: Я знаю и убеждён в Господе Иисусе, что ничто само по себе не является нечистым; кроме как для того, кто считает что-либо нечистым[a], — для него оно нечисто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обычным». Греческое слово здесь может обозначать то, что считается ритуально осквернённым или профанным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Я знаю
  rationale: Прямой и естественный эквивалент глагола знания в современном литературном русском.
- source_word: πέπεισμαι
  choice: убеждён
  rationale: Передаёт достигнутую и сохраняющуюся твёрдую уверенность, выраженную перфектом.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: в Господе Иисусе
  rationale: Сохраняет греческий предлог и не сужает неоднозначную связь до значения «от Господа» или «благодаря Господу».
- source_word: κοινόν
  choice: нечисто
  rationale: В контексте пищи и представлений о чистоте слово обозначает то, что считается осквернённым или непригодным; буквальная альтернатива отмечена в сноске.
- source_word: δι’ ἑαυτοῦ
  choice: само по себе
  rationale: Естественно передаёт отсутствие внутренне присущей предмету нечистоты.
- source_word: τῷ λογιζομένῳ
  choice: если кто считает
  rationale: Передаёт оценочное суждение человека и естественно встраивается в условную конструкцию εἰ μή.
- source_word: τι
  choice: что-либо
  rationale: Поддерживает обобщённый характер утверждения.
- source_word: ἐκείνῳ κοινόν
  choice: для того оно нечисто
  rationale: Сохраняет индивидуальную применимость высказывания и не добавляет объяснения того, каким именно образом оно становится нечистым.
theological_decisions:
- issue: Значение κοινός применительно к пище и чистоте
  choice: нечистый
  alternative: обычный; общий; осквернённый
  rationale: В данном контексте «нечистый» ясно передаёт категорию воспринимаемой ритуальной нечистоты, тогда как слова «обычный» и «общий» в современном русском затемнили бы смысл. При этом фраза «само по себе» сохраняет отрицание внутренне присущей нечистоты.
- issue: Смысл ἐν κυρίῳ Ἰησοῦ
  choice: в Господе Иисусе
  alternative: от Господа Иисуса; благодаря Господу Иисусу
  rationale: Буквально-естественная формулировка сохраняет возможный смысл убеждённости в сфере отношений со Христом и не превращает оборот однозначно в указание на источник откровения.
- issue: Статус нечистоты для совести человека
  choice: для того оно нечисто
  alternative: тот оскверняется этим
  rationale: Перевод не развивает мысль дальше греческого текста и сохраняет напряжение между объективным утверждением «ничто не нечисто само по себе» и субъективной оценкой человека.
translation_notes:
  register: Современный литературный русский с достоинством апостольского утверждения. Синтаксис сделан естественным для русского языка, при этом сохранены повтор «нечисто» и богословская неоднозначность оборота «в Господе Иисусе».
