  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: ru
  text: Итак, пусть то доброе, что у вас есть, не подвергается злословию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не подвергается поношению»; «не хулится». Греческий глагол означает оскорбительную или порочащую речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: пусть … не подвергается злословию
  rationale: Отрицание μή с настоящим пассивным императивом выражает запрет. Конструкция «пусть … не» естественно передаёт его в современном русском языке, а «подвергается злословию» сохраняет пассивный смысл.
- source_word: βλασφημείσθω (βλασφημέω)
  choice: не подвергается злословию
  rationale: Здесь глагол обозначает оскорбительную, порочащую речь. Поскольку объектом является «доброе», а не Бог, перевод «не подвергается злословию» уместнее узкорелигиозного «не хулится» и не сужает значение до юридически окрашенной клеветы.
- source_word: οὖν
  choice: Итак
  rationale: Союз вводит вывод из предшествующего наставления; «итак» ясно и естественно передаёт логическую связь.
- source_word: ὑμῶν
  choice: что у вас есть
  rationale: Родительный ὑμῶν выражает принадлежность или связь. Оборот «то доброе, что у вас есть» звучит по-русски естественнее буквального «ваше доброе» и не уточняет референт сверх греческого текста.
- source_word: τὸ ἀγαθόν
  choice: то доброе
  rationale: Субстантивированное прилагательное среднего рода означает «доброе» или «благо». Формулировка сохраняет широту выражения и не подменяет его конкретным толкованием вроде «свобода» или «преимущество».
theological_decisions:
- issue: К чему относится τὸ ἀγαθόν («то доброе, что у вас есть»)
  choice: Оставить обозначение широким, не уточняя конкретный референт.
  alternative: «ваша свобода», «ваше преимущество», «ваше доброе свидетельство»
  rationale: Греческая формулировка лаконична и допускает связь с благом, убеждением или свободой верующих в обсуждаемых вопросах. Конкретизация устранила бы сохраняемую Павлом смысловую широту.
translation_notes:
  register: Современный литературный русский язык, сдержанный и наставительный. «То доброе, что у вас есть» выбрано ради естественности и сохранения смысловой широты; «злословие» передаёт речевой характер действия без излишне узкого религиозного оттенка.
