source:
  edition: SBLGNT
  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: ru
  text: Того, кто слаб в вере, принимайте не для споров о мнениях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не для разбирательства суждений»; возможно также: «не для споров о рассуждениях».'
    reason: Греческое выражение διακρίσεις διαλογισμῶν допускает как оттенок оценочного разбирательства, так и полемических споров.
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: слабого
  rationale: Субстантивированное причастие обозначает человека, который слаб; контекстуальное уточнение «в совести» в исходном тексте отсутствует.
- source_word: τῇ πίστει
  choice: в вере
  rationale: Дательный указывает на область, в которой человек слаб. Формулировка не превращает πίστις в объективный свод учения и сохраняет обычное значение «вера».
- source_word: προσλαμβάνεσθε
  choice: принимайте
  rationale: Императив означает принимать человека к себе, в своё общение; русский глагол естественно передаёт как личное, так и общинное принятие.
- source_word: μὴ εἰς
  choice: но не для того, чтобы
  rationale: Оборот выражает недопустимую цель принятия; развёрнутая русская конструкция ясна и естественна.
- source_word: διακρίσεις διαλογισμῶν
  choice: спорить о мнениях
  rationale: Сочетание допускает оттенки разбирательства, суждения и споров вокруг рассуждений или мнений. Основной вариант передаёт контекстуальный смысл без чрезмерного буквального усложнения.
- source_word: δὲ
  choice: но
  rationale: Частица связывает увещание с контекстом и здесь естественно вводит противопоставление между принятием человека и неверной целью такого принятия.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: убеждённость; доверие
  rationale: «Вера» сохраняет ключевой богословский термин и его неоднозначность. Контекст может подразумевать недостаточную внутреннюю убеждённость в спорных практиках, но это не следует вносить в основной текст как явное уточнение.
- issue: Характер запрещённых διακρίσεις διαλογισμῶν
  choice: споры о мнениях
  alternative: разбирательство суждений; осуждение спорных мнений
  rationale: Греческое сочетание неоднозначно и может указывать как на ссоры, так и на оценочное разбирательство чужих рассуждений. Основной текст передаёт наиболее вероятный практический смысл, а альтернативы сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык; краткое апостольское увещание передано ясно и достойно. «Принимайте» сохраняет общинный оттенок, а местоимение «его» не добавлено в основной текст, поскольку оно отсутствует в греческом.
