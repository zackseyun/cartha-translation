  source_fidelity: 'Основной смысл передан верно: ἀσθενοῦντα τῇ πίστει — «того, кто слаб в вере», προσλαμβάνεσθε — «принимайте», а конечный оборот запрещает принимать такого человека с целью споров/разбирательств. Однако «но» передаёт δέ как противопоставление между принятием и его целью, тогда как μὴ εἰς вводит отрицательно обозначенную цель без необходимости такого противительного союза.'
  naturalness: «Того, кто слаб в вере, принимайте не для споров о мнениях» — естественный современный литературный русский и сохраняет краткий увещевательный регистр. Вариант «Слабого в вере» понятен, но несколько менее ясен без существительного «человека»; придаточное с «того, кто» звучит нейтральнее.
  terminology: «Вера» верно сохраняет πίστις без интерпретирующего добавления «совесть» или «убеждённость». «Споры о мнениях» приемлемо как основное решение для διακρίσεις διαλογισμῶν, при условии что примечание сохраняет также оттенок разбирательства/оценки рассуждений.
