  source_fidelity: 'Смысл и синтаксическая структура в целом переданы верно: οὖν — «Итак», Μηκέτι ... κρίνωμεν — призыв прекратить взаимное осуждение, а δεύτεое κρίνατε — призыв принять решение. Однако «ставить брату претыкания» не является естественной русской конструкцией и делает образ πρόσκομμα менее ясным. «Камень преткновения» точно сохраняет метафору исходного текста; «соблазн» оставлен для σκάνδαλον, с пояснением в сноске.'
