id: ROM.14.13
reference: Romans 14:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: ru
  text: 'Итак, не будем больше судить друг друга, а лучше решите вот что: не ставить брату[a] на пути камень преткновения или соблазн[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «брату или сестре»; в греческом тексте стоит слово «брат» в единственном числе, которое здесь относится к единоверующему.
    reason: alternative_reading
  - marker: b
    text: Или «повод к падению» или «ловушку»; здесь «соблазн» — то, что может привести другого к греху, а не просто задеть его чувства.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι
  choice: не будем больше
  rationale: Передаёт прекращение продолжающейся практики и вместе с сослагательным κρίνωμεν образует естественный русский призыв.
- source_word: οὖν
  choice: Итак
  rationale: Сохраняет выводный переход от предшествующего рассуждения; в современном русском звучит естественнее, чем более тяжеловесное «следовательно».
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычный и точный русский эквивалент взаимного местоимения.
- source_word: κρίνωμεν
  choice: не будем ... судить
  rationale: Передаёт побудительное сослагательное и сохраняет корень, который риторически повторяется в κρίνατε.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Лучше рассудите так
  rationale: '«Рассудите» сохраняет игру однокоренных слов с «судить», но показывает иной смысл второго употребления: принять обдуманное решение о собственном поведении. «Лучше» передаёт μᾶλλον.'
- source_word: τὸ μὴ τιθέναι
  choice: не ставить
  rationale: Инфинитив выражает содержание решения; «ставить» сохраняет образ намеренно помещаемого на пути препятствия.
- source_word: πρόσκομμα
  choice: претыкание
  rationale: Сохраняет образ того, обо что спотыкаются, и отличается от более сильного σκάνδαλον; значение пояснено примечанием к паре терминов.
- source_word: τῷ ἀδελφῷ
  choice: брату
  rationale: Точно передаёт мужской род и единственное число греческого текста; в контексте речь идёт о единоверце, что пояснено в сноске.
- source_word: ἢ
  choice: или
  rationale: Сохраняет разделительный союз греческого текста, не сводя два близких образа в один.
- source_word: σκάνδαλον
  choice: соблазна
  rationale: В библейском этическом контексте обозначает то, что становится причиной падения или вовлечения в грех, а не просто вызывает обиду.
theological_decisions:
- issue: Представительное употребление ἀδελφῷ в мужском роде единственного числа
  choice: брату
  alternative: брату или сестре; единоверцу
  rationale: Основной текст сохраняет грамматическую форму оригинала, а сноска уточняет, что в данном контексте слово относится к собрату по вере вообще.
- issue: Смысл σκάνδαλον в нравственном наставлении
  choice: соблазна
  alternative: ловушки; причины падения
  rationale: «Соблазн» сохраняет традиционный и богословски ёмкий русский эквивалент, однако сноска исключает современное понимание как простой обиды или привлекательного искушения.
- issue: Соотношение πρόσκομμα и σκάνδαλον
  choice: претыкания или соблазна
  alternative: препятствия или причины падения
  rationale: Сохранены два близких, но не полностью тождественных образа оригинала без искусственного проведения чрезмерно строгого различия между ними.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор «судить — рассудите» воспроизводит риторическую игру κρίνωμεν — κρίνατε. Термины «претыкание» и «соблазн» сохраняют образы оригинала, а сноски делают их понятными современному читателю.
