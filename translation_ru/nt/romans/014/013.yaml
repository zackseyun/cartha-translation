  to: 'Итак, не будем больше судить друг друга, а лучше решите вот что: не ставить брату[a] на пути камень преткновения или соблазн[b].'
  rationale: Исправление ограничено естественностью современного русского и ясностью образа. «Камень преткновения» буквально воспроизводит конкретную метафору πρόσκομμα; «или соблазн» сохраняет ἢ и отдельный термин σκάνδαλον. Сноски привязаны к соответствующим словам и уточняют как представительное «брат», так и нравственно-практический смысл «соблазна».
