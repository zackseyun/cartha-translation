  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: ru
  text: Итак, каждый из нас даст отчёт о себе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественным и ясным русским союзом.
- source_word: ἕκαστος ἡμῶν
  choice: каждый из нас
  rationale: Точно сохраняет распределительное значение ἕκαστος и частичный родительный ἡμῶν.
- source_word: περὶ ἑαυτοῦ
  choice: о себе
  rationale: Прямо передаёт περί с родительным в значении «о, относительно»; русское «себе» естественно согласуется с распределительным «каждый» и не требует выражения грамматического рода.
- source_word: λόγον δώσει
  choice: даст отчёт
  rationale: Передаёт устойчивое сочетание со значением предоставления отчёта, особенно в контексте суда или оценки.
theological_decisions:
- issue: Кому будет дан отчёт
  choice: Богу
  alternative: 'не называть адресата: «даст отчёт о себе»'
  rationale: Адресат явно назван в непосредственно предшествующем стихе и подразумевается судебным контекстом, однако в данном греческом предложении слово θεῷ текстуально не представлено; поэтому это контекстуальное восполнение отмечено сноской.
- issue: Распределительное единственное число в περὶ ἑαυτοῦ
  choice: о себе
  alternative: за себя
  rationale: «О себе» сохраняет основное значение περί с родительным и оставляет акцент на содержании отчёта; «за себя» более идиоматично выражает личную ответственность, но несколько дальше от формы оригинала.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. «Даст отчёт» естественно передаёт судебно-оценочный оттенок, а «о себе» сохраняет лексическую форму оригинала без искусственного гендерного маркирования.
