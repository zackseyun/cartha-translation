  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: ru
  text: Ибо тот, кто так служит Христу, угоден Богу и пользуется одобрением людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: так
  rationale: Указывает на описанный в предыдущем стихе образ служения — в праведности, мире и радости в Святом Духе. Краткое «так» естественно передаёт смысл, не сужая возможную отсылку.
- source_word: δουλεύων τῷ Χριστῷ
  choice: служит Христу
  rationale: Передаёт значение посвящённого служения и сохраняет дательный объект при глаголе.
- source_word: εὐάρεστος τῷ θεῷ
  choice: угоден Богу
  rationale: Устойчивое и точное русское соответствие со значением того, кто вызывает Божье благоволение.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: пользуется одобрением у людей
  rationale: δόκιμος обозначает признанного достойным после оценки; выражение передаёт общественное признание, а τοῖς ἀνθρώποις здесь относится к людям в общем смысле.
theological_decisions:
- issue: Отсылка ἐν τούτῳ
  choice: так
  alternative: в этом
  rationale: «Так» связывает служение Христу с образом жизни из Рим. 14:17 и сохраняет естественность русского текста; оно не определяет искусственно, относится ли указание к одному качеству или ко всей триаде.
- issue: Характер человеческого одобрения
  choice: пользуется одобрением у людей
  alternative: испытан людьми
  rationale: В контексте речь идёт о признании такого служителя людьми, а не о формальном испытании; перевод не утверждает всеобщего одобрения каждого человека.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка без архаизмов. Причинный γάρ естественно не выражен отдельным союзом, поскольку стих в русском издании может читаться как самостоятельное предложение, а логическая связь сохраняется контекстом.
