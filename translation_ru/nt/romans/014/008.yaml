id: ROM.14.8
reference: Romans 14:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: ru
  text: Ведь если мы живём[a], то живём для Господа, и если умираем, то умираем для Господа. Итак, живём ли мы или умираем[b] — мы Господни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В повторяющихся выражениях «живём для Господа» и «умираем для Господа» возможен также перевод: «живём Господу» и «умираем Господу». Греческий дательный падеж может выражать отношение, направленность или действие на благо кого-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы принадлежим Господу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Ведь если
  rationale: «Ведь» передаёт пояснительную функцию γάρ и связывает стих с предыдущей мыслью; «если» естественно вводит первую часть условной пары ἐάν τε.
- source_word: ζῶμεν / ζῶμεν
  choice: мы живём / живём
  rationale: Обе формы ζάω последовательно переданы глаголом «жить»; различие между сослагательной формой в придаточной части и изъявительной в главной по-русски естественно выражается конструкцией с «если».
- source_word: τῷ κυρίῳ
  choice: для Господа
  rationale: Дательный падеж выражает отношение и направленность жизни и смерти к Господу. «Для Господа» звучит естественно по-русски, сохраняя повтор и достаточно широкий смысл, хотя может восприниматься как указание на цель или благо; альтернативный оттенок отмечен в сноске.
- source_word: κύριος
  choice: Господь
  rationale: Титул κύριος передан традиционным и богословски ёмким словом «Господь» без дополнительного уточнения референта.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: умираем / умираем
  rationale: Настоящие формы обозначают смерть в общем условном утверждении, а не обязательно продолжающийся процесс; «умираем» естественно сохраняет параллелизм с «живём».
- source_word: οὖν
  choice: Итак
  rationale: «Итак» ясно передаёт вывод, следующий из двух предшествующих параллельных утверждений.
- source_word: τοῦ κυρίου ἐσμέν
  choice: мы Господни
  rationale: Краткая именная конструкция сохраняет притяжательный смысл греческого родительного падежа и подчёркивает принадлежность Господу; более явное «мы принадлежим Господу» дано как допустимая альтернатива.
theological_decisions:
- issue: Референт и смысл κύριος
  choice: Сохранён титул «Господь» без уточнения в самом переводе.
  alternative: «Владыка» или прямое уточнение «Господь Иисус».
  rationale: Ближайший контекст Рим 14:9 указывает на Христа, однако сам стих употребляет только κύριος. Перевод не должен ни ослаблять титул, ни добавлять отсутствующее уточнение.
- issue: Оттенок выражения τῷ κυρίῳ при глаголах жизни и смерти
  choice: «живём для Господа… умираем для Господа» как естественное русское выражение направленности и отношения.
  alternative: «живём Господу… умираем Господу» или «живём и умираем, принадлежа Господу».
  rationale: Греческий дательный допускает оттенки отношения, направленности и пользы. Основной текст сохраняет параллелизм и естественность, а сноска предупреждает против чрезмерного сужения смысла до одной лишь цели или служения.
- issue: Притяжательная сила τοῦ κυρίου ἐσμέν
  choice: «мы Господни».
  alternative: «мы принадлежим Господу».
  rationale: Форма «мы Господни» близка к греческой притяжательной конструкции и сохраняет сильное, но не разъяснённое далее утверждение о принадлежности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Параллелизм оригинала сохранён; «мы Господни» выбрано как краткое, понятное и выразительное завершение.
