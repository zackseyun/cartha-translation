base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: ru
  text: Тот, кто соблюдает день[a], соблюдает его для Господа. И кто ест, тот ест для Господа, потому что благодарит Бога; а кто не ест, тот не ест для Господа и благодарит Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считается с днём», «придаёт значение дню»; греческий глагол может означать направлять на что-либо мысли или уделять чему-либо особое внимание. Здесь, вероятно, имеется в виду соблюдение дня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: чтит / чтит его
  rationale: В сочетании с «днём» глагол означает уделять дню особое внимание, соблюдать или почитать его. «Чтит» естественно передаёт практическое отношение к дню и сохраняет связь со значением направленности ума, не сводя выражение лишь к размышлению.
- source_word: τὴν ἡμέραν
  choice: этот день
  rationale: Артикль указывает на день, о котором идёт речь в контексте. Указательное «этот» по-русски естественно передаёт такую контекстуальную определённость, не уточняя, какой именно день имеется в виду.
- source_word: κυρίῳ
  choice: для Господа
  rationale: Дательный падеж выражает направленность и цель поступка. «Для Господа» ясно и естественно передаёт действие ради Господа и с оглядкой на Него.
- source_word: ἐσθίων / ἐσθίει
  choice: кто ест / ест
  rationale: Настоящее время описывает обычную практику в спорном вопросе о пище; простая форма настоящего времени сохраняет параллелизм.
- source_word: εὐχαριστεῖ
  choice: благодарит
  rationale: Русский глагол естественно передаёт явное действие благодарения, направленное к Богу.
- source_word: τῷ θεῷ
  choice: Бога
  rationale: После русского «благодарить» требуется винительный падеж; смысл направленности благодарности сохраняется средствами русского управления.
- source_word: ὁ μὴ ἐσθίων
  choice: кто не ест
  rationale: Прямая и ясная передача отрицательного причастного оборота сохраняет симметрию с «кто ест».
theological_decisions:
- issue: Значение почитания «дня»
  choice: Общее указание на особое отношение к определённому дню в спорной практике Рим 14 без уточнения вида дня.
  alternative: Суббота, иудейский праздник или день поста.
  rationale: Формулировка Павла остаётся общей; перевод не должен вводить более узкое историческое или конфессиональное толкование.
- issue: Референт κύριος
  choice: Господь
  alternative: Бог
  rationale: В данном контексте у Павла κύριος естественнее всего относится к Господу Иисусу, тогда как благодарность прямо обращена к Богу. Перевод сохраняет это словесное различие.
translation_notes:
  register: Современный литературный русский язык; краткий, dignified синтаксис и сохранённый трёхчастный параллелизм. «Этот день» отсылает к обсуждаемому в контексте дню, не определяя его как субботу, праздник или день поста.
