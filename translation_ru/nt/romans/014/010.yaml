id: ROM.14.10
reference: Romans 14:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: ru
  text: А ты почему судишь своего брата[a]? Или и ты почему презираешь своего брата? Ведь все мы предстанем перед судом Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «своего брата или сестру»; по-гречески — «своего брата».
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «перед судом Христа».'
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: А ты
  rationale: Передаёт противопоставление δέ и подчёркнутое местоимение σύ естественным современным русским оборотом.
- source_word: τί κρίνεις
  choice: почему судишь
  rationale: В риторическом вопросе τί естественно означает «почему»; «судишь» сохраняет значение κρίνω, не сужая его до «осуждаешь».
- source_word: τὸν ἀδελφόν σου
  choice: своего брата
  rationale: Сохраняет мужской род и единственное число греческого ἀδελφός; возвратное «своего» естественно при подлежащем «ты».
- source_word: ἢ καὶ σὺ
  choice: Или и ты
  rationale: Сохраняет разделительное ἤ, присоединительное καί и повторное подчёркивание собеседника посредством σύ.
- source_word: τί ἐξουθενεῖς
  choice: почему презираешь
  rationale: «Презираешь» передаёт сильное значение ἐξουθενέω — считать другого ничтожным, относиться к нему с пренебрежением.
- source_word: πάντες γὰρ
  choice: Ведь все мы
  rationale: «Ведь» естественно передаёт пояснительно-обосновывающую функцию γάρ, а «все мы» сохраняет включение Павла и адресатов.
- source_word: παραστησόμεθα
  choice: предстанем перед
  rationale: Передаёт будущее судебное явление перед лицом судьи, выраженное формой παρίστημι.
- source_word: τῷ βήματι
  choice: судом
  rationale: В данном контексте βῆμα обозначает судейское место и, метонимически, судебное разбирательство; «суд» ясно передаёт этот образ без архаизма «судилище».
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Прямо передаёт родительный падеж и следует чтению SBLGNT τοῦ θεοῦ.
theological_decisions:
- issue: Перед чьим судом предстанут все
  choice: перед судом Бога
  alternative: перед судом Христа
  rationale: Основной текст следует представленному чтению SBLGNT τοῦ θεοῦ. Вариант «Христа» засвидетельствован частью рукописей и потому отмечен в сноске, а не внесён в основной текст посредством гармонизации.
translation_notes:
  register: Современный литературный русский язык с прямой риторической интонацией. Сохранены повтор «своего брата» и противопоставление двух действий — судить и презирать. «Суд Бога» выбран вместо архаичного «судилища Божия»; формулировка остаётся ясной и торжественной.
