  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: ru
  text: Веру[a], которую имеешь, храни для себя перед Богом. Блажен тот, кто не осуждает себя[b] тем, что одобряет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Убеждённость, которая у тебя есть». Здесь греческое πίστις («вера») может обозначать личную убеждённость относительно спорных вопросов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не судит себя тем, что одобряет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: веру
  rationale: Сохраняет обычное соответствие πίστις — «вера», тогда как в данном контексте слово обозначает личную убеждённость относительно спорных вопросов; этот оттенок отмечен в сноске.
- source_word: κατὰ σεαυτὸν ἔχε
  choice: имей при себе
  rationale: Передаёт призыв не навязывать другим свою убеждённость, сохраняя при этом её как личную позицию; выражение не означает скрывать её от Бога.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: пред Богом
  rationale: Естественная для литературного русского языка формула, выражающая осознанную ответственность в Божьем присутствии.
- source_word: μακάριος
  choice: блажен
  rationale: Сохраняет нравственный и богословский вес слова, в отличие от более субъективного «счастлив».
- source_word: κρίνων ἑαυτὸν
  choice: осуждает себя
  rationale: В данном контексте κρίνω указывает не просто на оценку, а на самоосуждение, возникающее из-за поступка вопреки совести.
- source_word: ἐν ᾧ δοκιμάζει
  choice: в том, что одобряет
  rationale: Сохраняет конструкцию ἐν ᾧ и передаёт δοκιμάζω как одобрение после оценки или проверки.
theological_decisions:
- issue: Значение πίστις в контексте спорных практик
  choice: «вера» в смысле личной убеждённости пред Богом по обсуждаемому вопросу
  alternative: общая вера или упование на Бога
  rationale: Ближайший контекст посвящён спорным практикам и совести. Основной текст сохраняет ключевой термин «вера», а сноска поясняет его контекстуальный оттенок.
- issue: Смысл κρίνων ἑαυτὸν
  choice: «осуждает себя»
  alternative: «судит себя»
  rationale: Контекст подразумевает обвинительный итог для совести, но сноска сохраняет более формально близкую лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «пред Богом». Синтаксис сохраняет обращение во втором лице в первой части и обобщённое третье лицо во второй. Подлинная смысловая широта πίστις и κρίνω отражена сносками.
