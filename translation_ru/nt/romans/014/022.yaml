review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: πίστις сохранено как «вера» с пояснением контекстуального значения, а κρίνων ἑαυτόν уместно передано как «осуждает себя». Однако «имей при себе пред Богом» звучит неестественно для современного литературного русского и не вполне ясно связывает два греческих обстоятельства. Также сноска b, относящаяся к κρίνων ἑαυτόν, должна быть привязана к «осуждает себя», а не к концу предложения.'
  naturalness: «Храни для себя перед Богом» естественнее и яснее передаёт личный, но сознательно обращённый к Богу характер убеждённости. «Перед Богом» более нейтрально-современно, чем «пред Богом», при сохранении литературного регистра. Во второй части «тем, что одобряет» ясно выражает связь самоосуждения с одобряемым действием/практикой.
  terminology: «Вера», «блажен» и «осуждает себя» допустимы и соответствуют контексту. Сноска a корректно отмечает «убеждённость» как контекстуальную альтернативу. Сноска b должна предлагать формально более широкое «не судит себя» и стоять у соответствующего выражения.
  issues:
  - severity: medium
    issue: Неестественная формулировка «имей при себе пред Богом».
    rationale: Сочетание «при себе» и «пред Богом» в такой конструкции воспринимается тяжеловесно и не вполне ясно; «храни для себя перед Богом» естественно передаёт κατὰ σεαυτὸν ... ἐνώπιον τοῦ θεοῦ.
  - severity: medium
    issue: Неверное расположение якоря сноски b.
    rationale: Сноска b поясняет κρίνων ἑαυτόν («осуждает себя» / «судит себя»), поэтому якорь должен следовать непосредственно за этим выражением, а не за «одобряет».
  - severity: low
    issue: «В том, что одобряет» менее ясно передаёт инструментально-обусловливающую связь ἐν ᾧ.
    rationale: «Тем, что одобряет» в русском естественно показывает, что самоосуждение связано с тем, что человек одобряет.
  revised_text: Веру[a], которую имеешь, храни для себя перед Богом. Блажен тот, кто не осуждает себя[b] тем, что одобряет.
