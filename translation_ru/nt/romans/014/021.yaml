  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: ru
  text: Хорошо не есть мясо, не пить вина и не делать ничего такого, от чего твой брат[a] спотыкается, соблазняется или ослабевает.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В данном контексте также: «твой брат или сестра», то есть другой верующий.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых древних рукописях нет слов «соблазняется или ослабевает».
    reason: textual_variant
lexical_decisions:
- source_word: καλὸν
  choice: хорошо
  rationale: Здесь слово оценивает воздержание как нравственно достойный и уместный образ действий; «хорошо» естественно и сохраняет широту значения.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: не есть мяса
  rationale: Артиклированный инфинитив обозначает действие вообще; русская неопределённая форма естественно передаёт эту конструкцию, а κρέα в пищевом контексте означает мясо.
- source_word: μηδὲ πιεῖν οἶνον
  choice: не пить вина
  rationale: Повтор отрицательной инфинитивной конструкции ясно передаёт ещё один вид добровольного воздержания.
- source_word: μηδὲ ἐν ᾧ
  choice: и не делать ничего такого, от чего
  rationale: 'Греческая конструкция эллиптична: после «и не» подразумевается поступок. В русском необходимо восполнить его; формулировка не ограничивает смысл конкретным действием.'
- source_word: ὁ ἀδελφός σου
  choice: твой брат
  rationale: Сохранены мужской род и единственное число греческого выражения; в контексте речь идёт о брате по вере, а возможный представительный, инклюзивный смысл отмечен в сноске.
- source_word: προσκόπτει
  choice: спотыкается
  rationale: Сохранена метафора препятствия, приводящего человека к нравственному или духовному падению.
- source_word: σκανδαλίζεται
  choice: соблазняется
  rationale: 'Так переданы пассивная форма и близкая к образу западни идея: поступок другого становится для человека соблазном. При этом глагол не сливается с προσκόπτει.'
- source_word: ἀσθενεῖ
  choice: ослабевает
  rationale: В контексте веры и совести слово обозначает ослабление, не уточняя сверх текста, является ли оно исключительно нравственным или духовным.
theological_decisions:
- issue: Представительное значение ἀδελφός
  choice: твой брат
  alternative: твой брат или сестра; другой верующий
  rationale: Основной текст сохраняет грамматически мужское единственное число оригинала. Контекст допускает применение ко всякому единоверцу, поэтому этот смысл сообщён в сноске, а не подставлен вместо исходного образа.
- issue: Различение προσκόπτει и σκανδαλίζεται
  choice: спотыкается, соблазняется
  alternative: спотыкается, становится причиной преткновения; спотыкается, оскорбляется
  rationale: 'Два близких, но не тождественных глагола переданы различно: первый сохраняет образ преткновения, второй — попадания в соблазн. «Оскорбляется» могло бы ошибочно свести смысл к задетым чувствам.'
- issue: Текстуальная неустойчивость заключительных слов
  choice: соблазняется или ослабевает — в основном тексте со сноской
  alternative: опустить эти слова из основного текста
  rationale: Предоставленный текст SBLGNT включает слова ἢ σκανδαλίζεται ἢ ἀσθενεῖ, но отмечает единицу текстуального разночтения. Они переведены, а рукописная неопределённость сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с простой, достойной синтаксической структурой. Повтор «не есть… не пить… не делать» передаёт риторическое накопление оригинала. Термины «спотыкается», «соблазняется» и «ослабевает» сохраняют три параллельных глагола и не устраняют их смысловое пересечение.
