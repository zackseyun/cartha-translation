source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: ru
  text: 'Ибо написано: «Живу Я, — говорит Господь, — предо Мною преклонится всякое колено, и всякий язык исповедует Бога[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признает Бога»; возможно также: «воздаст хвалу Богу». Греческий глагол может обозначать исповедание, признание или хвалу — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся русская формула введения цитаты из Писания; передаёт сохраняющуюся силу написанного текста.
- source_word: Ζῶ ἐγώ
  choice: Живу Я
  rationale: Сохраняет торжественную формулу клятвенного заверения от Божьего имени и её библейскую краткость, не разворачивая её в пояснительный пересказ.
- source_word: κύριος
  choice: Господь
  rationale: Прямое и традиционное соответствие греческому κύριος; перевод не подменяет его формой имени Бога, отсутствующей в греческом тексте.
- source_word: ἐμοὶ
  choice: предо Мною
  rationale: При глаголе «преклониться» это естественное русское выражение направленности и почтительного подчинения; буквальное «Мне преклонится» не соответствует современной русской норме.
- source_word: κάμψει πᾶν γόνυ
  choice: преклонится всякое колено
  rationale: Сохраняет телесный образ и торжественное звучание, естественное для русской речи и библейской цитаты.
- source_word: πᾶσα γλῶσσα
  choice: всякий язык
  rationale: Сохраняет исходную метонимию и связь с формой ветхозаветной цитаты, не заменяя образ пояснением «каждый человек».
- source_word: ἐξομολογήσεται
  choice: исповедует
  rationale: Передаёт публичное признание и торжественное исповедание; поскольку глагол допускает также оттенки признания и хвалы, они отмечены в сноске.
- source_word: τῷ θεῷ
  choice: Бога
  rationale: Русское управление глагола «исповедовать» требует винительного падежа; смысловая направленность действия к Богу сохраняется без неестественной конструкции.
theological_decisions:
- issue: Соотношение слов «Господь», «предо Мною» и «Бога» внутри цитаты
  choice: Сохранить переход от речи Господа в первом лице («предо Мною») к формулировке «исповедует Бога».
  alternative: Сгладить параллелизм формой «исповедует Меня» либо прямо выразить в переводе христологическое отождествление.
  rationale: Греческий текст сохраняет этот переход, и перевод не должен ни устранять его, ни вносить в саму формулировку богословский вывод, выходящий за пределы её грамматической формы.
translation_notes:
  register: Современный литературный русский язык с торжественным регистром, уместным для цитаты из Писания. Инверсия «Живу Я» и выражение «всякое колено» намеренно сохраняют краткость и образность оригинала, не переходя в архаизацию.
