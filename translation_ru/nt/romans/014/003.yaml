  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: ru
  text: Тот, кто ест, пусть не презирает того, кто не ест[a]; а тот, кто не ест, пусть не судит того, кто ест[b], ведь Бог принял его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть не относится с презрением к тому, кто не ест».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть не выносит суждений о том, кто ест».'
    reason: lexical_alternative
  - marker: c
    text: Глагол также может означать «принять в общение»; возможны также переводы «принял» и «принял его».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: тот, кто ест
  rationale: Субстантивированное причастие настоящего времени обозначает человека, для которого характерно употребление обсуждаемой пищи. Такой оборот естественен по-русски и сохраняет обобщённость греческого выражения.
- source_word: τὸν μὴ ἐσθίοντα
  choice: того, кто не ест
  rationale: Перевод сохраняет прямое противопоставление тому, кто ест, не добавляя в сам стих уточнений о видах пищи или причинах воздержания.
- source_word: ἐξουθενείτω
  choice: пусть не презирает
  rationale: Глагол означает считать кого-либо незначительным, относиться к нему с презрением. «Не презирает» кратко и точно передаёт силу запрета.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: а тот, кто не ест
  rationale: Союз «а» естественно передаёт контраст, выраженный δέ, и подчёркивает взаимность двух предостережений.
- source_word: κρινέτω
  choice: пусть не судит
  rationale: Широкое значение κρίνω здесь связано с вынесением оценки другому верующему. «Не судит» сохраняет эту широту, тогда как «не осуждает» могло бы чрезмерно сузить смысл.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно вводит по-русски основание для обоих предшествующих запретов.
- source_word: αὐτὸν
  choice: его
  rationale: Сохранено местоимение единственного числа без пояснения его референта, что передаёт грамматику и риторическую ёмкость оригинала.
- source_word: προσελάβετο
  choice: принял
  rationale: В данном контексте глагол означает принять человека, в том числе в общение. «Принял» естественно звучит по-русски и оставляет этот relational смысл доступным из контекста.
theological_decisions:
- issue: Смысл противопоставления «ест — не ест»
  choice: Передать противопоставление буквально и обобщённо, без уточнения видов пищи и причин воздержания.
  alternative: Разъяснить в основном тексте как употребление любой пищи в противоположность воздержанию от некоторых продуктов.
  rationale: Хотя контекст главы касается разногласий о пище, сам стих не называет конкретные продукты и не объясняет мотивов. Перевод не должен вносить в стих отсутствующее уточнение.
- issue: Референт местоимения αὐτόν
  choice: Сохранить форму «его», не разрешая явно, относится ли она непосредственно к тому, кто ест, или риторически применима к любой из сторон.
  alternative: Перевести «этого человека» либо прямо обозначить одну из сторон.
  rationale: 'Ближайший грамматический референт — тот, кто ест, однако взаимная структура увещания допускает более широкое применение основания: Бог принял другого участника спора. Местоимение сохраняет подлинную смысловую напряжённость.'
- issue: Характер Божьего действия в προσελάβετο
  choice: Перевести «Бог принял его».
  alternative: «Бог радушно принял его» или «Бог принял его в общение».
  rationale: «Принял» передаёт основное значение и не исключает оттенка принятия в общение, но не превращает контекстуальный оттенок в явное дополнение к тексту.
translation_notes:
  register: Современный литературный русский язык; симметричное построение сохраняет риторический параллелизм оригинала. Формы «пусть не…» передают запретительные императивы без архаизации. Пунктуация делает две взаимные заповеди ясными, а местоимение «его» намеренно сохраняет неоднозначность исходного текста.
