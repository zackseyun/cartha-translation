  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: ru
  text: Один уверен, что ему можно есть всё[a], а слабый[b] ест овощи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верит, что ему можно есть всё».'
    reason: lexical_alternative
  - marker: b
    text: В контексте речь идёт о слабости в вере в вопросах пищи (см. Рим. 14:1).
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: Один
  rationale: Естественно передаёт первого участника противопоставления и сохраняет обобщённое единственное число без излишнего указания на пол.
- source_word: πιστεύει
  choice: уверен
  rationale: При инфинитиве здесь слово выражает убеждённость человека относительно допустимости пищи, а не прямо спасительную веру. «Уверен» естественно передаёт эту конструкцию по-русски.
- source_word: φαγεῖν πάντα
  choice: что можно есть всё
  rationale: Греческий инфинитив с πάντα обозначает содержание убеждения. «Можно» передаёт подразумеваемую контекстом допустимость, а «всё» сохраняет всеохватность выражения.
- source_word: ὁ δὲ
  choice: а
  rationale: Союз вводит второго участника контраста; русское «а» естественно выражает сопоставление без чрезмерно резкого противопоставления.
- source_word: ἀσθενῶν
  choice: слабый
  rationale: Субстантивированное причастие обозначает человека, характеризуемого как слабый. Краткая передача сохраняет формулировку стиха и не добавляет прямо отсутствующее здесь уточнение «в вере».
- source_word: λάχανα
  choice: овощи
  rationale: Слово обозначает огородную растительную пищу; «овощи» — ясный и современный русский эквивалент, тогда как «травы» было бы уже и архаичнее.
- source_word: ἐσθίει
  choice: ест
  rationale: Простой глагол настоящего времени передан прямо. Слово «только» не добавлено, поскольку исключительность подразумевается контрастом, но не выражена в греческом тексте.
theological_decisions:
- issue: Характер слабости в ἀσθενῶν
  choice: «слабый» без уточнения в основном тексте
  alternative: «слабый в вере»
  rationale: Контекст Рим. 14:1 связывает слабость с верой или совестью в вопросах пищи, однако в самом стихе 14:2 уточнение отсутствует. Перевод сохраняет эту степень недосказанности и позволяет контексту раскрыть смысл.
- issue: Значение πιστεύει в связи с пищей
  choice: «уверен»
  alternative: «верит»
  rationale: Здесь речь идёт о личной убеждённости относительно того, что допустимо есть. «Уверен» предотвращает ошибочное прочтение как прямого указания на спасительную веру, не устраняя связи с темой веры в контексте.
translation_notes:
  register: Современный литературный русский язык; лаконичная, ритмически уравновешенная конструкция. Сохранён контраст между двумя людьми, не добавлено отсутствующее в оригинале «только», а контекстуальное значение слабости вынесено в примечание.
