id: ROM.14.9
reference: Romans 14:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: ru
  text: Ибо для того Мессия умер и ожил[a], чтобы господствовать и над мёртвыми, и над живыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жил»; по смыслу также возможно: «снова стал жить» или «воскрес». В контексте речь идёт о жизни после смерти.'
    reason: 'Лексическая альтернатива: греческое ἔζησεν буквально означает «жил», тогда как последовательность «умер и жил» указывает на воскресение.'
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: для того
  rationale: Оборот выражает цель; «для того» естественно по-русски вводит последующее придаточное с «чтобы».
- source_word: γὰρ
  choice: ибо
  rationale: Союз поясняет и обосновывает предыдущее утверждение Павла; «ибо» сохраняет эту связь и соответствует достоинству литературного регистра.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Χριστός употреблено как титул Помазанника. «Мессия» передаёт значение титула и не превращает его молча в личное имя.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямое и точное соответствие аористу ἀποθνῄσκω; расширение не требуется.
- source_word: ἔζησεν
  choice: ожил
  rationale: Сам глагол означает «жил», но после «умер» контекст указывает на возвращение к жизни. Русское «ожил» кратко и естественно передаёт это, а буквальная форма отмечена в сноске.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение придаточного предложения естественным современным русским языком.
- source_word: νεκρῶν
  choice: мёртвыми
  rationale: Субстантивированное прилагательное во множественном числе сохраняет общий охват группы и контраст с живыми.
- source_word: ζώντων
  choice: живыми
  rationale: Субстантивированное причастие естественно передаётся парным выражением «живыми» в противопоставлении мёртвым.
- source_word: κυριεύσῃ
  choice: господствовать
  rationale: Глагол означает властвовать, быть господином над кем-либо. «Господствовать» сохраняет и действие власти, и слышимую связь со словом «Господь», не превращая глагол в титул.
theological_decisions:
- issue: Смысл ἔζησεν после ἀπέθανεν
  choice: «ожил», то есть вернулся к жизни после смерти
  alternative: «жил»; «воскрес»
  rationale: Сочетание «умер и жил» и последующее упоминание власти над мёртвыми и живыми подразумевают жизнь после смерти. «Ожил» выражает это естественно, но не подменяет общий глагол более специальным «воскрес»; буквальная возможность сохранена в сноске.
- issue: Христологическая сила κυριεύσῃ
  choice: «господствовать … над»
  alternative: «быть Господом … для/над»; «властвовать над»
  rationale: Глагольный перевод сохраняет грамматическую форму и утверждение о власти Мессии, а также лексическую связь с «господством», не добавляя отсутствующего в греческом существительного-титула.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ибо» поддерживает связность рассуждения; парная конструкция «и над мёртвыми, и над живыми» ясно передаёт καὶ…καὶ. Текст избегает конфессионально специфической терминологии и сохраняет целевую логику греческого предложения.
