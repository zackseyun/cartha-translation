  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: ru
  text: А тот, кто сомневается, если ест, осуждён, потому что делает это не по вере.[a] А всё, что не по вере, — грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что делает это не из убеждённости». Буквально: «не из веры»; здесь речь может включать поступок, совершаемый с твёрдой убеждённостью перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: кто сомневается
  rationale: В контексте сомнений относительно пищи причастие обозначает внутреннее колебание, а не спор с другими; эта формулировка естественна по-русски.
- source_word: ἐὰν φάγῃ
  choice: если ест
  rationale: Передаёт условное значение конструкции ἐάν с аористом сослагательного наклонения без неестественного усложнения.
- source_word: κατακέκριται
  choice: осуждён
  rationale: Сохраняет результирующее состояние, выраженное перфектом страдательного залога, и не уточняет не названного в греческом тексте деятеля.
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: потому что поступает не по вере
  rationale: Причинный союз передан прямо; добавленное по смыслу «поступает» делает эллиптическое греческое выражение понятным по-русски, сохраняя ключевое слово «вера».
- source_word: πᾶν ... ὃ
  choice: всё, что
  rationale: Естественно и полно передаёт обобщающую конструкцию среднего рода единственного числа.
- source_word: ἁμαρτία ἐστίν
  choice: грех
  rationale: Именная конструкция «— грех» сохраняет категоричность утверждения, не ослабляя его до «греховно».
theological_decisions:
- issue: Значение πίστις в нравственном контексте
  choice: вера
  alternative: убеждённость; уверенность перед Богом
  rationale: «Вера» сохраняет широкую богословскую лексику Павла и буквальный образ ἐκ πίστεως, тогда как примечание раскрывает обусловленный контекстом оттенок внутренней убеждённости.
- issue: Характер осуждения в κατακέκριται
  choice: осуждён
  alternative: сам себя осуждает; осуждён Богом
  rationale: Греческий страдательный залог не называет субъекта осуждения, поэтому перевод не решает, идёт ли речь о Божьем суде, суде совести или обоих.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественно-сдержанный. «По вере» сохраняет павловскую формулировку, а подразумеваемое действие прояснено глаголом «поступает».
