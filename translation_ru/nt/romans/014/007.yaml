  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: ru
  text: Ведь никто из нас не живёт для себя[a], и никто не умирает для себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «себе». Греческий возвратный дательный допускает такое более буквальное прочтение; здесь, вероятно, имеется в виду, что человек не является конечной целью собственной жизни или смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: никто
  rationale: Естественно передаёт всеобщее отрицание и сохраняет параллелизм обеих частей.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью естественным для современного русского языка способом.
- source_word: ἡμῶν
  choice: из нас
  rationale: Точно и естественно передаёт партитивный генитив при οὐδεὶς.
- source_word: ἑαυτῷ
  choice: для себя
  rationale: 'Передаёт дательный отношения или направленности: человек не является конечной целью собственной жизни или смерти. Более буквальное «себе» отмечено в сноске.'
- source_word: ζῇ
  choice: живёт
  rationale: Настоящее время выражает общее положение и соответствует видовременной форме греческого текста.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простую сочинительную связь и параллелизм.
- source_word: ἀποθνῄσκει
  choice: умирает
  rationale: Настоящее время передаёт общее положение и образует ясную параллель с «живёт».
theological_decisions:
- issue: Значение возвратного дательного ἑαυτῷ в обеих частях
  choice: для себя
  alternative: себе; ради себя самого
  rationale: В контексте следующего стиха речь идёт о направленности жизни и смерти не на самого человека, а на Господа. «Для себя» сохраняет этот смысл, не добавляя отсутствующих в тексте богословских уточнений.
- issue: Род и обобщающий характер формы ἑαυτῷ
  choice: себя
  alternative: самого себя
  rationale: Русское возвратное местоимение не маркирует род и естественно относится к каждому человеку, сохраняя обобщающий смысл греческой формы без искусственного уточнения.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмически параллельная формулировка. «Ведь» выбрано вместо более книжного «ибо», чтобы ясно передать пояснительную функцию γὰρ без архаизации.
