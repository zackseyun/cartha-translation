  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: ru
  text: Кто ты такой, чтобы судить чужого домашнего раба? Перед своим господином он стоит или падает. Но он будет поставлен на ноги, ибо Господь может поставить его на ноги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Кто ты такой, чтобы судить
  rationale: Риторический вопрос с подчёркнутым σὺ передан естественным русским оборотом, сохраняющим прямой укор; субстантивированное причастие идиоматично выражено конструкцией «чтобы судить».
- source_word: ἀλλότριον οἰκέτην
  choice: чужого домашнего раба
  rationale: οἰκέτης обозначает раба или слугу из состава домашнего хозяйства; «домашний раб» сохраняет как бытовую принадлежность, так и несвободный социальный статус. ἀλλότριον передано кратким и естественным «чужого».
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: перед своим господином
  rationale: Дательный обозначает того, перед кем и применительно к чьей оценке раб стоит или падает. «Господин» естественен в бытовой аналогии и сохраняет связь с последующим «Господь» через общий русский корень.
- source_word: στήκει ἢ πίπτει
  choice: он стоит или падает
  rationale: Сохранены контраст и образность исходного текста без поясняющего истолкования.
- source_word: σταθήσεται
  choice: он будет поставлен на ноги
  rationale: Будущая пассивная форма передана явно пассивно, сохраняя подразумеваемое действие со стороны Господа и связь с последующим στῆσαι. Русский оборот «поставлен на ноги» здесь естественнее буквального «поставлен стоять».
- source_word: δυνατεῖ γὰρ ὁ κύριος
  choice: ведь Господь силён
  rationale: γάρ вводит основание уверенности, а δυνατεῖ выражает способность и силу. «Силён» звучит естественно и достойно в современном русском.
- source_word: στῆσαι αὐτόν
  choice: поставить его
  rationale: Сохранена каузативная сила инфинитива и словесная связь со σταθήσεται; дополнение «на ноги» из предыдущей части не повторяется, но ясно подразумевается.
theological_decisions:
- issue: К кому относится ὁ κύριος в заключительной части
  choice: «Господь» — богословский титул, вероятнее всего относящийся ко Христу в контексте рассуждения Павла
  alternative: «господин» — хозяин раба внутри бытовой аналогии
  rationale: Артикль, контекст ответственности верующего перед Господом и утверждение о силе поставить человека указывают на богословское употребление. При этом переход от «господина» к «Господу» сохраняет намеренную словесную связь и не устраняет полностью образную двуплановость.
- issue: Смысл стояния и падения
  choice: Сохранить метафору без уточнения, означает ли она одобрение, устойчивость или оправдание на суде
  alternative: 'Передать истолковательно: «будет одобрен или осуждён» либо «устоит или потерпит падение»'
  rationale: Греческий текст допускает взаимосвязанные оттенки; конкретизация сузила бы подлинную смысловую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Синтаксис прямой и доступный. Различие «господин / Господь» естественно отражает переход от бытовой аналогии к богословскому смыслу, сохраняя корневую связь κύριος. Стих не требует сносок: основные лексические и богословские нюансы можно сохранить непосредственно в тексте.'
