revisions:
- from: Кто ты такой, чтобы судить чужого домашнего раба? Перед своим господином он стоит или падает. И он будет поставлен на ноги, ведь Господь силён поставить его.
  to: Кто ты такой, чтобы судить чужого домашнего раба? Перед своим господином он стоит или падает. Но он будет поставлен на ноги, ибо Господь может поставить его на ноги.
  rationale: Сохранены все ключевые образы и намеренная лексическая связь между будущим пассивом σταθήσεται и каузативом στῆσαι. Добавление «на ноги» в заключительной части устраняет русскую двусмысленность «поставить его» и делает повтор образа явным. «Но» передаёт δέ, а «ибо» — обосновывающий γάρ.
