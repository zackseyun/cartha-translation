review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы риторический вопрос, образ «стоять или падать», различие «господин / Господь» и богословский референт заключительного ὁ κύριος. Однако в исходном тексте повтор каузативного «поставить» не вполне прозрачен: без «на ноги» заключительное «поставить его» может означать назначение или помещение, а не дать устоять.'
  naturalness: «Кто ты такой» и «перед своим господином» естественны для современного литературного русского. «Будет поставлен на ноги» понятно, но требует повторить тот же образ в заключительной части, чтобы сохранить связность и избежать двусмысленности.
  terminology: «Домашний раб» адекватно передаёт οἰκέτης и не затушёвывает несвободный статус. «Господин» в аналогии и «Господь» в заключении удачно передают игру на κύριος без излишнего догматического уточнения.
