id: ROM.14.17
reference: Romans 14:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: ru
  text: Ведь Царство Божье — не еда и питьё, а праведность[a], мир и радость в Святом Духе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: 'Устоявшееся и естественное русское соответствие, сохраняющее широту понятия: и Божье царствование, и область Его владычества.'
- source_word: βρῶσις καὶ πόσις
  choice: еда и питьё
  rationale: Естественная русская пара, передающая предмет споров о том, что едят и пьют; более буквальное «ядение и питие» в современном русском звучит архаично.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Основное соответствие в контексте Павловых посланий; возможное значение «справедливость» сохранено в примечании.
- source_word: εἰρήνη
  choice: мир
  rationale: Передаёт как отсутствие вражды, так и согласие между людьми, существенное для контекста главы.
- source_word: χαρά
  choice: радость
  rationale: Прямое и естественное соответствие греческому слову.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: Сохраняет предлог ἐν и присущую ему неоднозначность сферы и действия; контекст Павловых посланий указывает на Святого Духа.
- source_word: γάρ
  choice: ведь
  rationale: Естественно передаёт пояснительную связь с предыдущим рассуждением.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет устойчивое богословское употребление термина у Павла, тогда как «справедливость» остаётся реальной лексической возможностью и указана в примечании.
- issue: Значение ἐν в выражении ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  alternative: Святым Духом
  rationale: Буквальное «в» не сводит выражение только к орудию действия и сохраняет возможный смысл сферы, источника или действия Духа.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Тире естественно оформляет именную конструкцию; «Божье» понятно широкому кругу читателей и звучит современнее формы «Божие».
