  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: ru
  text: Итак, будем стремиться к тому, что ведёт к миру и служит взаимному созиданию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «к тому, что относится к миру, и к тому, что служит созиданию друг друга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание выводных частиц подводит итог предшествующему рассуждению; «итак» естественно и ёмко передаёт этот переход в современном русском языке.
- source_word: τὰ τῆς εἰρήνης
  choice: к тому, что ведёт к миру
  rationale: Субстантивированное сочетание во множественном числе обозначает всё содействующее миру. Такой перевод передаёт смысл греческой идиомы без тяжеловесного буквального «того, что относится к миру».
- source_word: διώκωμεν
  choice: будем стремиться
  rationale: Увещательный конъюнктив первого лица множественного числа призывает общину к постоянному, деятельному усилию. «Будем стремиться» сохраняет побудительность и энергичность глагола.
- source_word: τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους
  choice: к тому, что служит взаимному созиданию
  rationale: οἰκοδομή метафорически означает укрепление и созидание людей или общины, а εἰς ἀλλήλους подчёркивает взаимную направленность. Формулировка естественна по-русски и сохраняет строительную метафору.
theological_decisions:
- issue: Сфера и взаимность созидания
  choice: 'Призыв обращён к верующим как к общине: они должны стремиться к миру и взаимному созиданию.'
  alternative: Понимать созидание преимущественно как личное нравственное совершенствование каждого.
  rationale: Первое лицо множественного числа διώκωμεν и взаимное местоимение ἀλλήλους указывают на совместную жизнь и взаимное укрепление, особенно в контексте разногласий, обсуждаемых в Рим 14.
translation_notes:
  register: Современный литературный русский язык; увещательный, достойный и общепонятный тон. Сохранены выводный переход, деятельная сила призыва и метафора созидания; громоздкая греческая структура передана естественной русской конструкцией.
