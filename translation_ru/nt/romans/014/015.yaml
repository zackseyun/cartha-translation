base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: ru
  text: Ведь если твой брат огорчается из-за пищи[a], то ты уже не поступаешь по любви. Не губи[c] своей пищей того, за кого умер Мессия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твой брат или сестра»; греческое слово «брат» может обозначать любого единоверца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христос». Греческое слово означает «Помазанник», то есть «Мессия».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не разрушай» или «не доводи до погибели». Греческий глагол силён по смыслу и может обозначать тяжёлый духовный вред; сам стих не уточняет его точного богословского следствия.'
    reason: alternative_reading
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: пища / своей пищей
  rationale: Слово обозначает пищу вообще, а не только мясо; творительный падеж естественно передаёт средство или повод.
- source_word: ἀδελφός
  choice: брат
  rationale: Сохранена грамматически мужская форма единственного числа; возможное представительное употребление пояснено в сноске.
- source_word: λυπεῖται
  choice: огорчается
  rationale: Передаёт причиняемую человеку скорбь или душевную боль, не уточняя её характер сверх исходного текста.
- source_word: κατὰ ἀγάπην περιπατεῖς
  choice: поступаешь по любви
  rationale: Выражение естественно по-русски передаёт нравственный образ хождения и норму, задаваемую любовью.
- source_word: ἀπόλλυε
  choice: не губи
  rationale: Сильный русский глагол сохраняет предупреждение о тяжёлом вреде, но не решает вопрос о его окончательном богословском смысле.
- source_word: ὑπὲρ οὗ
  choice: за кого
  rationale: Естественно передаёт действие в пользу или ради названного человека.
- source_word: Χριστός
  choice: Мессия
  rationale: Здесь слово сохраняет значение титула; «Мессия» прозрачно передаёт греческое Χριστός.
- source_word: εἰ γὰρ
  choice: ведь если
  rationale: Сохраняет и связь с предшествующим доводом, и условную форму высказывания.
theological_decisions:
- issue: Сила глагола ἀπόλλυε применительно к брату
  choice: не губи
  alternative: не разрушай; не доводи до погибели
  rationale: Перевод сохраняет серьёзность предупреждения, не уточняя, идёт ли речь о тяжёлом духовном ущербе или окончательной погибели.
- issue: Референт ἀδελφός
  choice: брат
  alternative: брат или сестра; единоверец
  rationale: Основной текст отражает мужской род и единственное число оригинала, а возможное более широкое представительное значение отмечено в сноске.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово функционирует как титул; выбран смысловой перевод без изменения христологического содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Поступаешь по любви» звучит естественнее буквального «ходишь по любви», сохраняя нравственный смысл метафоры. Краткое «не губи» удерживает силу греческого запрета и его богословскую напряжённость.
