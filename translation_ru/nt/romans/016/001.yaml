base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: ru
  text: Рекомендую вам Фиву, нашу сестру, которая также является диаконом[a] церкви в Кенхреях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служительница церкви в Кенхреях»; возможно также: «служит церкви в Кенхреях». Греческое слово διάκονος может обозначать как человека, исполняющего признанное служение в общине, так и того, кто служит в более общем смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Представляю вам
  rationale: В контексте рекомендательного письма глагол означает благожелательно представить человека адресатам, тем самым поручаясь за него. «Представляю вам» естественно по-русски и сохраняет эпистолярную функцию выражения.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица отмечает мягкий переход к новой теме, а не противопоставление; в современном русском такой переход естественно передаётся без отдельного союза.
- source_word: Φοίβην
  choice: Фиву
  rationale: Использована традиционная русская библейская форма имени в винительном падеже.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: нашу сестру
  rationale: Прямо сохраняет семейную лексику общины; в контексте речь идёт о сестре по вере, но пояснение не добавлено в основной текст.
- source_word: οὖσαν καὶ
  choice: которая также служит
  rationale: Относительное предложение естественно передаёт причастную конструкцию и сохраняет добавочное значение καί.
- source_word: διάκονον
  choice: служит диаконом
  rationale: Форма «диаконом» сохраняет возможность обозначения признанного служения при церкви, а глагол «служит» не позволяет воспринимать слово лишь как позднейший формальный титул. Лексическая неоднозначность отмечена в сноске.
- source_word: τῆς ἐκκλησίας
  choice: церкви
  rationale: В посланиях Павла ἐκκλησία обычно означает местную христианскую общину; «церковь» — ясное и общепринятое русское соответствие.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: в Кенхреях
  rationale: Передаёт определительную предложную конструкцию и использует традиционную русскую форму географического названия.
theological_decisions:
- issue: Обозначает ли διάκονον общее служение или признанную роль в общине
  choice: служит диаконом
  alternative: является служительницей; служит церкви
  rationale: Связь с конкретной церковью допускает признанную роль в местной общине, однако само греческое слово может обозначать служителя в более широком смысле. Основной текст сохраняет возможный церковный статус без привнесения поздней конфессиональной структуры, а альтернативы вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены церковно-общинная семейная лексика и неоднозначность διάκονος; тяжеловесное начальное «Теперь» для δέ не добавлено.
