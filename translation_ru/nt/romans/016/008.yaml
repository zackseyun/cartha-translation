  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: ru
  text: Приветствуйте Амплиата[a], моего возлюбленного в Господе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописных традициях имя представлено в более краткой форме — «Амплий»; чтению SBLGNT здесь соответствует «Амплиат».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, императив среднего залога, 2-е лицо множественного числа; в эпистолярном контексте это обычное повеление передать приветствие. «Приветствуйте» — краткий и естественный русский эквивалент.
- source_word: Ἀμπλιᾶτον
  choice: Амплиата
  rationale: Личное имя передано транслитерацией формы, поддерживаемой SBLGNT. Греческий аккузатив естественно передаётся русским винительным падежом от формы «Амплиат».
- source_word: τὸν ἀγαπητόν μου
  choice: моего возлюбленного
  rationale: Передаёт и принадлежность местоимения μου, и сердечную теплоту ἀγαπητός, сохраняя компактность и достоинство греческой формулировки.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерное для Павла выражение, обозначающее отношения и общность жизни, определяемые Господом. Добавление имени «Иисус» не оправдано греческим текстом.
theological_decisions:
- issue: Связь выражения «в Господе» с обозначением Амплиата как возлюбленного
  choice: «моего возлюбленного в Господе» — христианская любовь и общность Павла с Амплиатом осмыслены в их отношении к Господу.
  alternative: Понимать выражение как характеристику самого приветствия либо как простое обозначение личного друга без выраженного богословского смысла.
  rationale: Порядок слов естественнее всего связывает ἐν κυρίῳ с τὸν ἀγαπητόν μου и самим Амплиатом. Буквальное сохранение «в Господе» не снимает присущего выражению богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с традиционной, но понятной библейской формулировкой. Слово «возлюбленного» сохраняет теплоту и возвышенный регистр оригинала; падеж имени согласован с русским синтаксисом.
