  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: повеление во множественном числе, имена в винительном падеже, определение «наш соработник», выражение ἐν Χριστῷ и личное «мой возлюбленный». Добавлений или смысловых сужений нет.'
  naturalness: «Приветствуйте Урбана, нашего соработника в Мессии, и Стахия, моего возлюбленного» грамматически корректно и выдержано в современном литературном, сдержанно-библейском регистре. «Соработник» несколько возвышенно-церковное, но уместно в апостольском перечне и не препятствует пониманию.
  terminology: «Мессия» последовательно передаёт титульный аспект Χριστός в соответствии с предоставленной англоязычной аудиторской политикой. «Возлюбленный» хорошо сохраняет теплоту ἀγαπητός, не приписывая характер отношений сверх текста. Формы имён «Урбан» и «Стахий» нормативно и естественно склонены по-русски.
