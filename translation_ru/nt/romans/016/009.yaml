id: ROM.16.9
reference: Romans 16:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: ru
  text: Приветствуйте Урбана, нашего соработника в Мессии, и Стахия, моего возлюбленного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Форма повелительного наклонения во множественном числе в перечне приветствий естественно передаётся кратким и современным «Приветствуйте».
- source_word: Οὐρβανὸν
  choice: Урбана
  rationale: Имя передано традиционной русской транслитерацией греко-латинского имени Urbanus.
- source_word: συνεργὸν ἡμῶν
  choice: нашего соработника
  rationale: «Соработник» точно выражает совместный труд и сохраняет достойный библейский регистр; ἡμῶν передано притяжательным «нашего».
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός здесь сохраняет титульный смысл, а ἐν обозначает сферу принадлежности и единения; буквальная конструкция не устраняет заложенную в греческом выражении смысловую ёмкость.
- source_word: Στάχυν
  choice: Стахия
  rationale: Имя передано традиционной русской формой «Стахий» в винительном падеже.
- source_word: ἀγαπητόν μου
  choice: моего возлюбленного
  rationale: Передаёт теплоту личного отношения и сохраняет связь ἀγαπητός с лексической группой любви, не добавляя отсутствующего в тексте уточнения.
theological_decisions:
- issue: Передача Χριστῷ в выражении ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: В данном кратком обозначении принадлежности Χριστός можно понимать как титул; «Мессия» делает этот смысл прозрачным. При этом смысловая напряжённость выражения ἐν Χριστῷ — сфера, принадлежность или единение — не конкретизируется сверх оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным звучанием апостольского перечня приветствий. Синтаксис близок к греческому, но естественен по-русски.
