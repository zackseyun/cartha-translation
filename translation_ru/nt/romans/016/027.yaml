  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: ru
  text: единому мудрому Богу через Иисуса Христа, которому слава во веки. Аминь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих завершает заключительное славословие (Римлянам 16:25–27). В ранних рукописях место этого славословия и само его наличие заметно различаются; здесь оно приводится в соответствии с византийской традицией большинства рукописей.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: единому
  rationale: Дательный падеж согласован с «Богу»; слово подчёркивает исключительность Бога как единственно мудрого.
- source_word: σοφῷ θεῷ
  choice: мудрому Богу
  rationale: Прямо передаёт греческое сочетание и сохраняет торжественный характер славословия.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Христа
  rationale: Предлог διά с родительным падежом выражает посредство; «Христос» — естественная для современного русского передача титула Χριστός.
- source_word: ᾧ
  choice: которому
  rationale: Относительное местоимение сохраняет греческую конструкцию и её небольшую неоднозначность в отношении того, относится ли оно к Богу или к Иисусу Христу.
- source_word: εἰς τοὺς αἰῶνας
  choice: во веки
  rationale: Устойчивое русское выражение для греческой идиомы «в века», означающей вечность; соответствует возвышенному регистру славословия.
theological_decisions:
- issue: Антецедент местоимения ᾧ
  choice: Сохранено относительное «которому» без явного уточнения.
  alternative: «Ему слава» или явное указание «Богу слава».
  rationale: Греческая форма допускает синтаксическое напряжение между ближайшим упоминанием Иисуса Христа и основным адресатом — Богом; перевод не должен молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом славословия. Начальная строчная буква сохраняет связь стиха с синтаксически продолжающимся предложением в Римлянам 16:25–27; «во веки» употреблено как понятная и укоренённая формула высокого регистра.
