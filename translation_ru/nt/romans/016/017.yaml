id: ROM.16.17
reference: Romans 16:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: ru
  text: Прошу вас, братья[a], остерегаться тех, кто вызывает разделения и создаёт поводы к преткновению вопреки учению, которое вы усвоили. Уклоняйтесь от них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; по-гречески буквально «братья», но обращение, вероятно, относится ко всей общине.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: прошу
  rationale: Передаёт настойчивое пастырское обращение естественным современным русским языком, не усиливая его до мольбы и не делая излишне официальным.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; вероятное обращение ко всей общине пояснено в сноске.
- source_word: σκοπεῖν
  choice: остерегаться
  rationale: В данном контексте глагол требует не только замечать таких людей, но и быть настороже по отношению к ним; русское «остерегаться» естественно выражает эту предупредительную силу.
- source_word: διχοστασίας
  choice: разделения
  rationale: Прямо и ясно обозначает расколы и разлад, создаваемые внутри общины.
- source_word: σκάνδαλα
  choice: поводы к преткновению
  rationale: Сохраняет образ препятствия, из-за которого человек спотыкается или падает, не сводя значение лишь к оскорблению чувств или искушению.
- source_word: παρὰ τὴν διδαχήν
  choice: вопреки учению
  rationale: Παρά с винительным падежом здесь выражает отклонение от принятого учения или противоречие ему.
- source_word: ἐμάθετε
  choice: которое вы усвоили
  rationale: Передаёт уже состоявшееся научение и звучит по-русски естественнее буквального «которому вы научились» применительно к учению.
- source_word: ποιοῦντας
  choice: кто вызывает … и создаёт
  rationale: Причастие обозначает тех, кто производит названные последствия; относительное предложение естественно для русского синтаксиса.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: уклоняйтесь от них
  rationale: Сохраняет повелительную силу и пространственный образ намеренного удаления от таких людей.
theological_decisions:
- issue: Кого охватывает обращение ἀδελφοί
  choice: В основном тексте сохранить «братья», а вероятное обращение ко всей общине пояснить в сноске.
  alternative: Передать в основном тексте как «братья и сёстры».
  rationale: Греческий текст употребляет мужское множественное число, которое в обращении Павла, вероятно, включает всю общину. Сноска сохраняет одновременно форму источника и её вероятный объём.
- issue: Смысл σκάνδαλα
  choice: Сохранить метафору падения в выражении «поводы к преткновению».
  alternative: Передать как «соблазны», «препятствия» или «ловушки».
  rationale: Греческое слово допускает образ препятствия или ловушки, приводящей к падению. Выбранное выражение сохраняет богословски значимую неоднозначность, не уточняя без основания, идёт ли речь прежде всего об искушении, нравственном падении или отпадении от веры.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Поводы к преткновению» сохраняет метафору источника, а короткое заключительное предложение подчёркивает самостоятельную повелительную силу ἐκκλίνετε.
