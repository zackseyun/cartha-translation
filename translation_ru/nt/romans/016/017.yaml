  source_fidelity: 'Перевод точно передаёт синтаксическую и смысловую структуру греческого текста: Παρακαλῶ — «Прошу вас», обращение ἀδελφοί сохранено как «братья», σκοπεῖν передано предупредительным «остерегаться», а самостоятельный императив ἐκκλίνετε ἀπ’ αὐτῶν ясно выражен фразой «Уклоняйтесь от них». «Вопреки учению, которое вы усвоили» верно отражает παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε. Связь «разделений и поводов к преткновению» с деятельностью названных людей сохранена.'
  naturalness: Текст звучит естественно в современном литературном русском языке и сохраняет уместный сдержанно-библейский регистр. «Поводы к преткновению» несколько возвышенно, но это осознанно сохраняет образ σκάνδαλα и вполне понятно в данном жанре. Разделение последнего повеления на отдельное предложение удачно и ясно.
  terminology: «Разделения», «поводы к преткновению», «учение» и «уклоняйтесь» последовательно и без конфессионально обусловленного сужения передают соответствующие греческие выражения. Сноска к «братья» корректно отмечает вероятный охват всей общины, не подменяя форму исходного текста.
