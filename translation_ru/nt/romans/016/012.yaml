  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: ru
  text: Приветствуйте Трифену и Трифосу, которые трудились[a] в Господе. Приветствуйте Персиду, возлюбленную[b], которая много трудилась в Господе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «которые усердно трудились в Господе» или «которые потрудились в Господе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возлюбленную»; в греческом тексте нет слова «мою».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Форма повелительного наклонения во множественном числе в перечне личных приветствий естественно и точно передаётся словом «приветствуйте».
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Трифену и Трифосу
  rationale: Личные имена переданы в традиционной русской форме с учётом греческого винительного падежа.
- source_word: τὰς κοπιώσας
  choice: которые трудились
  rationale: Артикль с причастием характеризует обеих женщин. Прошедшее время передаёт аористное причастие, не навязывая мысли о полном завершении их служения.
- source_word: κοπιάω
  choice: трудились / трудилась
  rationale: Повтор одного русского корня сохраняет лексический повтор κοπιάω в обеих частях стиха и выражает напряжённый, усердный труд.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула, допускающая оттенки как сферы единения с Господом, так и служения ему, без сужения смысла до одного лишь «для Господа».
- source_word: Περσίδα
  choice: Персиду
  rationale: Имя передано в традиционной русской форме и поставлено в винительный падеж по синтаксису предложения.
- source_word: τὴν ἀγαπητήν
  choice: возлюбленную
  rationale: Определённое прилагательное передано без добавления притяжательного местоимения «мою», отсутствующего в греческом тексте.
- source_word: ἥτις
  choice: которая
  rationale: Относительное местоимение естественно вводит характеристику Персиды; более усиленные варианты были бы избыточны.
- source_word: πολλὰ
  choice: много
  rationale: Наречное употребление винительного падежа указывает на значительность или объём труда Персиды.
- source_word: ἐκοπίασεν
  choice: трудилась
  rationale: Прошедшее время обобщённо описывает известный адресатам труд Персиды и сохраняет связь с однокоренным выражением в первой части стиха.
theological_decisions:
- issue: Смысл формулы ἐν κυρίῳ применительно к служению
  choice: в Господе
  alternative: для Господа; служа Господу
  rationale: 'Буквальная и естественная формула сохраняет богословскую многозначность: труд совершается в сфере отношений с Господом и в принадлежности ему, а не только ради него.'
- issue: Наличие притяжательного значения в τὴν ἀγαπητήν
  choice: возлюбленную
  alternative: мою возлюбленную
  rationale: В греческом тексте нет μου («мою»), поэтому притяжательное местоимение не добавлено. Формулировка оставляет открытым, кем именно Персида названа возлюбленной.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярно-библейского стиля. Формулировки просты и понятны; сохранены повтор глагола «трудиться» и богословски ёмкое выражение «в Господе».
