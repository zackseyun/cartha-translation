  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: ru
  text: Ведь такие люди служат не нашему Господу Мессии[a], а собственному чреву[b] и вкрадчивыми речами и лестью обманывают сердца простодушных[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашему Господу Христу».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «собственному чреву» — яркий образ собственных побуждений и стремления к самоудовлетворению.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «невинных», «не подозревающих обмана»; греческое слово может обозначать людей без злого умысла, не ожидающих обмана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ τοιοῦτοι
  choice: такие люди
  rationale: Естественно отсылает к упомянутым в предыдущем стихе людям, вызывающим разделения, и сохраняет указательную силу выражения.
- source_word: τῷ κυρίῳ ἡμῶν Χριστῷ
  choice: нашему Господу Мессии
  rationale: Передаёт κύριος как «Господь», а Χριστός — как титул «Мессия»; отсутствующее в греческом имя «Иисус» не добавляется.
- source_word: δουλεύουσιν
  choice: служат
  rationale: Передаёт служение и подчинённость, сохраняя естественное противопоставление между служением Господу и собственному чреву.
- source_word: τῇ ἑαυτῶν κοιλίᾳ
  choice: собственному чреву
  rationale: Сохраняет конкретный и резкий образ Павла; «аппетитам» яснее истолковало бы метафору, но сузило бы её смысл.
- source_word: χρηστολογίας
  choice: вкрадчивыми речами
  rationale: Выражает приятную, убедительную и располагающую речь, которая в данном контексте служит обману.
- source_word: εὐλογίας
  choice: лестью
  rationale: В этом сочетании слово обозначает не подлинное благословение, а хвалебную, льстивую речь; перевод сохраняет отличие от χρηστολογία.
- source_word: ἐξαπατῶσι
  choice: обманывают
  rationale: Естественно передаёт усиленное значение введения в заблуждение без тяжеловесного «полностью обманывают».
- source_word: τὰς καρδίας
  choice: сердца
  rationale: Сохраняет библейский образ внутреннего человека, не сводя значение только к рассудку.
- source_word: τῶν ἀκάκων
  choice: простодушных
  rationale: Передаёт отсутствие злого умысла и уязвимость перед обманом; возможные оттенки «невинные» и «неподозревающие» отмечены в сноске.
theological_decisions:
- issue: Передача Χριστός в титульном выражении Павла
  choice: Мессия
  alternative: Христос
  rationale: Χριστός здесь сохраняет значение титула Помазанника. Традиционный вариант «Христос» приведён в сноске, чтобы не скрывать принятую церковную форму.
- issue: Образ служения собственному чреву
  choice: Сохранить конкретную метафору
  alternative: служат собственным желаниям / аппетитам
  rationale: Греческий текст намеренно противопоставляет Господа и «чрево» как господина; буквальный образ сохраняет силу и широту нравственного обвинения, не ограничивая его одной конкретной страстью.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Чрево» сознательно сохранено ради павловского образа; «вкрадчивые речи и лесть» различают два параллельных греческих существительных. Порядок фразы сделан естественным для русского языка без устранения исходного противопоставления.
