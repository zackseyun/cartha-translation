  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: ru
  text: которые за мою жизнь подставили под удар свои шеи[a]. Не только я благодарю их, но и все церкви из язычников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положили собственную шею»; в греческом тексте слово «шея» стоит в единственном числе. Это образное выражение означает, что они подвергли себя смертельной опасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все церкви из народов».'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: которые
  rationale: Относительное местоимение продолжает характеристику Приски и Акилы из предыдущего стиха; русское «которые» естественно сохраняет эту связь.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: ради моей жизни
  rationale: В контексте смертельной опасности ψυχή обозначает жизнь Павла, а не нематериальную душу.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: подставили под удар собственные шеи
  rationale: 'Перевод сохраняет конкретный образ шеи и одновременно проясняет идиоматический смысл: они подвергли себя смертельной опасности. Множественное число естественно по-русски при двух лицах.'
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: Не только я благодарю их, но и
  rationale: 'Такая конструкция естественно передаёт подчёркнутое противопоставление: благодарен не один Павел.'
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: все церкви
  rationale: Передаёт определённое множественное число и широкий круг общин.
- source_word: τῶν ἐθνῶν
  choice: из язычников
  rationale: В данном контексте ἔθνη означает неевреев; оборот «церкви из язычников» ясно указывает на состав общин и не создаёт впечатления, будто речь идёт о языческих религиозных собраниях.
theological_decisions:
- issue: Значение ψυχή
  choice: жизнь
  alternative: душа
  rationale: Речь идёт о конкретной смертельной опасности и действиях ради сохранения жизни Павла; антропологический смысл «душа» здесь не требуется.
- issue: Значение ἐθνῶν
  choice: язычников, то есть неевреев
  alternative: народов
  rationale: В посланиях Павла слово часто обозначает неевреев в отличие от иудеев; этот смысл особенно уместен в контексте Послания к римлянам, но буквальная возможность «народов» отмечена в сноске.
- issue: Образ τράχηλον ὑπέθηκαν
  choice: сохранить образ шеи и пояснить подразумеваемую опасность словами «под удар»
  alternative: рисковали своей жизнью
  rationale: Выбранный вариант не сглаживает яркую метафору оригинала, но остаётся понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с ясной, но dignified формулировкой. Синтаксическая связь с предыдущим стихом сохранена начальным «которые»; второе длинное греческое предложение разделено для естественности русского чтения.
