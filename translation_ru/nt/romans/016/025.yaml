  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: ru
  text: '[a] Тому же, кто может укрепить вас согласно моему благовестию и проповеди Иисуса Мессии, согласно откровению тайны, о которой было умолчано в течение веков,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стихи 25–27 образуют заключительное славословие, которое в древних рукописях располагается в разных местах. В византийской традиции большинства рукописей оно находится в конце 14-й главы, в древнейшем сохранившемся папирусе — после 15-й главы, а здесь, в конце 16-й главы, — в важных рукописях IV века и латинской традиции. Некоторые рукописи помещают его более чем в одном месте, а в немногих оно вовсе отсутствует. Большинство современных переводов сохраняет его здесь как заключение Послания Павла.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: укрепить
  rationale: Передаёт утверждение и упрочение верующих в вере, сохраняя естественное современное русское выражение.
- source_word: εὐαγγέλιόν
  choice: благовестию
  rationale: «Благовестие» — понятный литературный библейский термин для вести, которую возвещает Павел; притяжательное «моему» сохранено без предположения, будто эта весть принадлежит ему по происхождению.
- source_word: κήρυγμα Ἰησοῦ Χριστοῦ
  choice: проповеди Иисуса Мессии
  rationale: 'Русский родительный падеж сохраняет возможную неоднозначность греческой конструкции: речь может идти о проповеди об Иисусе Мессии либо о проповеди, связанной с ним как возвещателем. Χριστός передано титулом «Мессия».'
- source_word: σεσιγημένου
  choice: о которой было умолчано
  rationale: Сохраняет образ молчания в греческом глаголе, а перфектная пассивная форма отражена результативным безличным оборотом; не вводится прямо не названный субъект сокрытия.
- source_word: χρόνοις αἰωνίοις
  choice: от вечных времён
  rationale: Сохраняет сильное временное выражение оригинала и его некоторую смысловую напряжённость, не сводя его однозначно лишь к «долгим векам».
theological_decisions:
- issue: Значение родительного оборота Ἰησοῦ Χριστοῦ при κήρυγμα
  choice: «проповеди Иисуса Мессии» — неоднозначность сохранена
  alternative: «проповеди об Иисусе Мессии»
  rationale: Греческий родительный падеж сам по себе допускает как объектное, так и субъектное прочтение; контекст благовестия благоприятствует объектному, но не требует устранять грамматическую неоднозначность.
- issue: Связь κατὰ с благовестием и откровением
  choice: в обоих случаях «согласно»
  alternative: «по» / «в соответствии с»
  rationale: 'Повтор помогает сохранить параллельную структуру оригинала: способность Бога укрепить адресатов соотнесена и с благовестием, и с откровением тайны.'
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным звучанием, уместным для славословия. Начальная дательная конструкция «Тому же» намеренно остаётся незавершённой в пределах стиха: её синтаксическое завершение находится в стихе 27. Союз δέ передан частицей «же», без добавления временного «ныне».'
