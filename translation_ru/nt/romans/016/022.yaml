revisions:
- from: Приветствую вас в Господе я, Тертий, написавший это послание.[a]
  to: Я, Тертий, записавший письмо, приветствую вас в Господе.[a]
  rationale: Исправлен не выраженный в оригинале указательный элемент «это», а «написавший» заменено на «записавший», чтобы точнее обозначить Тертия как записавшего письмо. Порядок слов сделан естественнее для современного литературного русского. Неоднозначность связи «в Господе» сохранена в сноске.
  reviewer_model: gpt-5.6-terra
