base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: ru
  text: Я, Тертий, записавший письмо, приветствую вас в Господе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, хотя и менее вероятно: «Я, Тертий, записавший письмо в Господе, приветствую вас». Греческое выражение «в Господе» можно связать со словом «записавший», однако естественнее относить его к приветствию.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: приветствую
  rationale: Обычное значение глагола в заключительных приветствиях; настоящее время и первое лицо переданы прямо и естественно.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт форму второго лица множественного числа без добавочного уточнения.
- source_word: ἐγὼ Τέρτιος
  choice: я, Тертий
  rationale: Явное местоимение вместе с именем подчёркивает, что теперь от собственного лица говорит писец Тертий.
- source_word: ὁ γράψας
  choice: написавший
  rationale: Причастие аориста определяет Тертия как человека, физически записавшего послание; русское причастие сохраняет сжатую структуру оригинала.
- source_word: τὴν ἐπιστολήν
  choice: это послание
  rationale: В данном контексте определённый артикль указывает на находящееся перед читателями послание. «Послание» естественно для апостольского письма и сохраняет достоинство регистра.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранено характерное для Павла выражение, обозначающее сферу христианского общения; вероятнее всего, оно относится к приветствию.
theological_decisions:
- issue: Синтаксическая связь выражения ἐν κυρίῳ
  choice: «в Господе» отнесено к глаголу «приветствую»
  alternative: 'Отнести выражение к «написавший это послание»: «написавший это послание в Господе»'
  rationale: Конечная позиция допускает обе связи, однако в контексте заключительных приветствий естественнее понимать выражение как характеристику приветствия и общения во Господе. Альтернатива сохранена в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного библейского регистра. Необычный, но ясный порядок слов сохраняет акцент оригинала на самопредставлении Тертия и позволяет поставить «в Господе» рядом с «приветствую».
