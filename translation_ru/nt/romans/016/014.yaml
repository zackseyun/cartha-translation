  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: ru
  text: Приветствуйте Асинкрита, Флегонта, Ерма, Патрова, Ермию и братьев с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, медиальный императив второго лица множественного числа; в заключительном перечне приветствий у Павла естественно передаётся кратким русским повелительным «Приветствуйте».
- source_word: Ἀσύγκριτον
  choice: Асинкрита
  rationale: Личное имя передано в традиционной русской библейской форме с учётом винительного падежа.
- source_word: Φλέγοντα
  choice: Флегонта
  rationale: Личное имя передано в традиционной русской библейской форме с учётом винительного падежа.
- source_word: Ἑρμῆν
  choice: Ерма
  rationale: Личное имя передано в традиционной русской библейской форме; оно отличено от следующего имени Ἑρμᾶν.
- source_word: Πατροβᾶν
  choice: Патрова
  rationale: Личное имя передано в традиционной русской библейской форме с учётом винительного падежа.
- source_word: Ἑρμᾶν
  choice: Ермия
  rationale: Выбрана традиционная русская библейская форма, позволяющая ясно отличить это имя от предшествующего Ἑρμῆν («Ерм»).
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: братьев, которые с ними
  rationale: ἀδελφούς — грамматически мужское множественное число и здесь обозначает братьев по вере; относительная конструкция естественно и точно передаёт σὺν αὐτοῖς.
theological_decisions:
- issue: Передача ἀδελφούς в приветствии общине
  choice: братьев
  alternative: братьев и сестёр; единоверцев
  rationale: Греческая форма прямо выражена мужским множественным числом, а контекст не требует явно инклюзивного расширения. «Братьев» сохраняет форму и возможный объём значения оригинала, не решая молча вопрос о составе группы.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён; синтаксис простой, ясный и достойный. Подлинная неопределённость состава группы при названных мужчинах сохранена словом «братьев» без поясняющего расширения.
