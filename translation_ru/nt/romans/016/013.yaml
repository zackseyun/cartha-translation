  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: ru
  text: Приветствуйте Руфа[a], избранного в Господе, и его мать — и мою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отличившегося в Господе», «выдающегося в Господе». Греческое слово может означать как «избранный», так и «отборный, превосходный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Форма повелительного наклонения во множественном числе призывает передать приветствие; это естественный и точный русский эквивалент в заключительных приветствиях Павла.
- source_word: Ῥοῦφον
  choice: Руфа
  rationale: Личное имя передано традиционной русской транслитерацией и поставлено в винительный падеж по синтаксису предложения.
- source_word: ἐκλεκτὸν
  choice: избранного
  rationale: Передаёт основное значение «избранный», не сводя его ни к узкотехническому догматическому термину, ни к одному лишь значению «выдающийся».
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохраняет характерную для Павла формулу, выражающую принадлежность, отношение или сферу жизни во Христе, без добавления отсутствующего в тексте имени «Иисус».
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: его мать — и мою
  rationale: Сохраняет греческий эллипсис буквально и естественно по-русски; тире подчёркивает тёплое личное добавление Павла, не превращая его в разъясняющий пересказ.
theological_decisions:
- issue: Значение ἐκλεκτὸν ἐν κυρίῳ
  choice: «избранного в Господе» — формулировка оставляет открытым оттенок Божьего избрания и особого положения Руфа в Господе.
  alternative: «выдающегося в Господе» или технически окрашенное «предызбранного Господом».
  rationale: Греческое ἐκλεκτός может означать «избранный», а в некоторых контекстах — «отборный, выдающийся». Основной текст сохраняет традиционное и наиболее прямое значение, а примечание отмечает реальную лексическую неоднозначность.
- issue: Смысл слов «его мать — и мою»
  choice: Сохранено буквальное родственное обозначение, которое в контексте естественно понимать как выражение близости и материнской заботы о Павле.
  alternative: 'Разъясняющий перевод: «его мать, которая была и мне как мать».'
  rationale: Пересказ сделал бы подразумеваемый переносный смысл явным и тем самым устранил бы лаконичный, эмоционально выразительный эллипсис оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью апостольского приветствия. Формула «в Господе» сохранена как узнаваемая библейская конструкция; тире делает заключительную фразу естественной и передаёт личную теплоту без пояснительного расширения.
