source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: ru
  text: чтобы вы приняли её в Господе, как подобает святым, и помогли ей в любом деле, в котором она будет нуждаться в вашей помощи, ведь она и сама стала покровительницей многих[a], в том числе и самого меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодетельницей»; также возможно: «помощницей». Греческое слово обозначает женщину, оказывавшую другим поддержку или покровительство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: приняли
  rationale: В контексте рекомендации Фивы глагол означает благожелательно принять её в общину; «приняли» естественно передаёт и приём, и признание.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула, обозначающая общность и отношения во Христе.
- source_word: ἀξίως τῶν ἁγίων
  choice: как подобает святым
  rationale: Естественная русская формулировка, передающая значение достойного, надлежащего для святых образа приёма.
- source_word: παραστῆτε αὐτῇ
  choice: помогли ей
  rationale: В данном контексте παρίστημι означает оказать поддержку или прийти на помощь; «помогли» ясно и современно, не уточняя форму содействия.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: во всяком деле, в котором она будет нуждаться в вас
  rationale: Формулировка сохраняет широкое значение πρᾶγμα («дело, вопрос») и необычное, но значимое указание на нужду именно в адресатах и их содействии.
- source_word: προστάτις
  choice: покровительницей
  rationale: Слово указывает не просто на эпизодическую помощь, а на заметную роль женщины, оказывавшей другим поддержку и, вероятно, покровительство.
- source_word: ἐμοῦ αὐτοῦ
  choice: в том числе и меня
  rationale: 'Переданы присоединительное καί и эмфатическое αὐτοῦ: Павел особо включает самого себя в число получивших её поддержку.'
theological_decisions:
- issue: Обозначение роли Фивы словом προστάτις
  choice: покровительница
  alternative: благодетельница; помощница; защитница
  rationale: «Покровительница» сохраняет социально весомый характер её поддержки и личную инициативу, не превращая это обозначение в название церковной должности. Более общее «помощница» ослабляет смысл, а «защитница» неоправданно сужает его.
translation_notes:
  register: Современный литературный русский с достоинством апостольского наставления. Синтаксис сделан ясным для обычного читателя; традиционная формула «в Господе» и павловское наименование верующих «святые» сохранены.
