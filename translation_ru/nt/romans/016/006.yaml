  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: ru
  text: Приветствуйте Мариам[a], которая много потрудилась для вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «для нас» или «среди вас» вместо «для вас».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, средний залог, повелительное наклонение, второе лицо множественного числа; в эпистолярном контексте это обычная просьба передать приветствие. «Приветствуйте» кратко и естественно передаёт смысл.
- source_word: Μαριάμ
  choice: Мариам
  rationale: Форма «Мариам» близко передаёт греческое личное имя и соответствует сложившейся русской библейской передаче имени этой женщины в Рим 16:6.
- source_word: ἥτις
  choice: которая
  rationale: Относительное местоимение вводит характеристику Мариам. Русское «которая» естественно передаёт эту связь; лёгкий качественный оттенок ἥτις не требует отдельного выражения.
- source_word: πολλὰ
  choice: много
  rationale: Употреблено наречно при ἐκοπίασεν и указывает на значительный объём и напряжённость труда.
- source_word: ἐκοπίασεν
  choice: потрудилась
  rationale: Глагол κοπιάω обозначает усердный, утомительный труд. «Потрудилась» сохраняет этот оттенок и звучит естественно и достойно в современном русском тексте.
- source_word: εἰς ὑμᾶς
  choice: для вас
  rationale: В принятом тексте εἰς с обозначением лиц здесь естественно выражает направленность труда на благо адресатов. «Для вас» ясно передаёт этот смысл.
theological_decisions:
- issue: Текстовый вариант в заключительной фразе
  choice: для вас
  alternative: для нас; среди вас
  rationale: 'Основной текст следует SBLGNT: εἰς ὑμᾶς («для вас»). В других рукописях стоят εἰς ἡμᾶς («для нас») или ἐν ὑμῖν («среди вас»); эти значимые варианты сохранены в сноске без предпочтительного богословского истолкования.'
translation_notes:
  register: Современный литературный русский язык; краткая эпистолярная формула и достойная, понятная лексика. Выражение «много потрудилась» сохраняет как объём, так и напряжённость труда.
