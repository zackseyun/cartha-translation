  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: ru
  text: Приветствуйте Приску[a] и Акилу, моих соработников в Мессии Иисусе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Приска — форма имени в греческом тексте; Прискилла — более привычная форма имени той же женщины, употребляемая в других местах.
    reason: alternative_reading
  - marker: b
    text: 'Или: «во Христе Иисусе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аористный императив второго лица множественного числа выражает обычное для посланий поручение передать приветствие; «приветствуйте» — точный и естественный русский эквивалент.
- source_word: Πρίσκαν
  choice: Приску
  rationale: Передана именно форма имени Πρίσκα, стоящая в греческом тексте; более привычная форма «Прискилла» указана в сноске.
- source_word: Ἀκύλαν
  choice: Акилу
  rationale: Стандартная русская передача личного имени Ἀκύλας с требуемым винительным падежом.
- source_word: συνεργούς μου
  choice: моих соработников
  rationale: Слово обозначает людей, совместно трудящихся с Павлом; «соработники» сохраняет идею общего служения и не приобретает современного корпоративного оттенка.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Мессии Иисусе
  rationale: Передача сохраняет порядок греческих слов, титульное значение Χριστός и неоднозначность ἐν, которое может указывать на сферу, принадлежность или единение.
theological_decisions:
- issue: Передача Χριστῷ в формуле ἐν Χριστῷ Ἰησοῦ
  choice: Мессии
  alternative: Христе
  rationale: Здесь Χριστός сохраняет мессианское титульное содержание. В основном тексте оно выражено словом «Мессия», а традиционная передача «Христос» сохранена в сноске без устранения богословской многозначности оборота.
- issue: Смысл предлога ἐν
  choice: в
  alternative: в единении с
  rationale: Буквальное «в» не сводит выражение исключительно к мистическому единению или к сфере служения и тем самым сохраняет широту формулы Павла.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным эпистолярным звучанием. Необычный оборот «в Мессии Иисусе» сознательно сохраняет порядок и титульность исходного текста; традиционный вариант дан в сноске.
