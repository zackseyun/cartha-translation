base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: ru
  text: Вас приветствует Гаий, оказывающий гостеприимство мне и всей церкви. Вас приветствует городской казначей[a] Эраст, а также брат Кварт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «городской управляющий». Греческое слово могло обозначать городского распорядителя или администратора в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: приветствует
  rationale: Обычное эпистолярное значение глагола в заключительных приветствиях Павла; по-русски звучит естественно и сохраняет прямую форму исходного текста.
- source_word: ξένος
  choice: принимающий у себя
  rationale: В данном контексте слово обозначает не «чужеземца» или «гостя», а человека, оказывающего гостеприимство. Описательный оборот естественнее по-русски, чем двусмысленное «хозяин», и применим как к Павлу, так и ко всей церкви.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: всю церковь
  rationale: Передаёт христианскую общину и сохраняет усиление ὅλης — «всю, целиком».
- source_word: οἰκονόμος τῆς πόλεως
  choice: городской казначей
  rationale: В гражданском контексте οἰκονόμος обозначает городского распорядителя или администратора; «казначей» передаёт вероятную должность, а более широкое значение отмечено в сноске.
- source_word: ἀδελφός
  choice: брат
  rationale: Сохраняет мужской род и семейное обозначение Кварта как единоверца без добавления отсутствующего в греческом тексте местоимения «наш».
theological_decisions:
- issue: Передача ἐκκλησία в приветствии
  choice: церковь
  alternative: община; собрание
  rationale: У Павла слово здесь обозначает христианское сообщество; «церковь» — точный и привычный русский эквивалент, не требующий дополнительного конфессионального толкования.
- issue: Значение братского обозначения ἀδελφός
  choice: брат
  alternative: единоверец; наш брат
  rationale: Исходный текст использует существительное мужского рода с артиклем, но без притяжательного местоимения. Перевод сохраняет образ духовного родства и не добавляет «наш».
translation_notes:
  register: 'Современный литературный русский язык с ясной, достойной формой. Повтор «вас приветствует» сохранён вслед за структурой греческого текста. Имена переданы в традиционной русской библейской форме: Гаий, Эраст, Кварт.'
