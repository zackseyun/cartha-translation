- from: Ведь о вашем послушании стало известно всем.[a] Поэтому я радуюсь за вас,[b] но хочу, чтобы вы были мудры в добре и чисты перед злом.[c]
  to: Ведь о вашем послушании стало известно всем.[a] Поэтому я радуюсь за вас,[b] но хочу, чтобы вы были мудры в добре и не испорчены злом.[c]
  rationale: Исправлен только заключительный оборот и согласована с ним сноска. «Не испорчены злом» естественно передаёт ἀκέραιοι как незапятнанность, а «в добре» сохраняет параллельную сферу εἰς τὸ ἀγαθόν. Смысл, объём риторического «всем» и расположение сносок сохранены.
