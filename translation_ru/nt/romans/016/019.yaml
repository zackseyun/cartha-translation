    issue: Оборот «чисты перед злом»
    rationale: Он стилистически неудачен в современном литературном русском и не вполне передаёт смысл ἀκεραίους εἰς τὸ κακόν — нравственную цельность/незапятнанность в отношении зла, а не положение «перед злом».
  - severity: low
    issue: Сноска c частично дублирует основной выбор
    rationale: При основном чтении «чисты перед злом» вариант «неиспорченны» уже ближе к требуемой смысловой коррекции. После уточнения основного текста сноску следует привести в соответствие и оставить в ней действительно альтернативные оттенки.
