  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: ru
  text: Ведь о вашем послушании стало известно всем.[a] Поэтому я радуюсь за вас,[b] но хочу, чтобы вы были мудры в добре и не испорчены злом.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваше послушание достигло всех».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «радуюсь из-за вас».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чисты» или «простодушны в отношении зла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: послушание
  rationale: В контексте Павловых посланий слово обозначает послушный отклик, а не просто слышание.
- source_word: εἰς πάντας ἀφίκετο
  choice: стало известно всем
  rationale: Греческое выражение буквально говорит, что их послушание «достигло всех»; по-русски естественнее передать подразумеваемую широкую известность, сохранив буквальный образ в сноске.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: радуюсь за вас
  rationale: Сочетание χαίρω с ἐπί и дательным падежом указывает на повод или основание радости; русский оборот естественен и сохраняет личную направленность высказывания.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: мудры в добре
  rationale: Сохраняет практический смысл мудрости, направленной к добру, и параллелизм с последующей фразой.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: чисты перед злом
  rationale: ἀκέραιος означает неиспорченный, беспримесный, чистый или простодушный. «Чисты перед злом» передаёт нравственную незапятнанность, не внушая наивности или полного незнания зла.
theological_decisions:
- issue: Объём πάντας
  choice: «всем» как риторическое указание на широкую известность
  alternative: «всем людям» как буквальная абсолютная всеобщность
  rationale: Контекст содержит похвалу широкой известности послушания римских верующих, но не требует математически всеобщего утверждения.
- issue: Контраст σοφούς и ἀκεραίους
  choice: «мудры в добре и чисты перед злом»
  alternative: «мудры для добра и простодушны относительно зла»
  rationale: Формулировка сохраняет напряжение между деятельной нравственной рассудительностью и незапятнанностью злом, не превращая вторую часть в призыв к неведению или наивности.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Причинно-следственные связки переданы ясно; параллелизм добра и зла сохранён без тяжеловесной буквальности.
