  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: ru
  text: Приветствуйте друг друга святым поцелуем[a]. Все общины Мессии приветствуют вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Святой поцелуй» был принятым в культуре того времени приветствием, выражавшим святую привязанность и общение между верующими.
    reason: cultural_note
  - marker: b
    text: 'Или: «Все церкви Христа приветствуют вас».'
    reason: translation_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аористный императив ἀσπάζομαι передаёт прямое побуждение приветствовать; это естественный и точный русский эквивалент.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Обычное современное русское соответствие взаимному местоимению.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: святым поцелуем
  rationale: Предлог ἐν с дательным здесь указывает на способ приветствия; φίλημα означает «поцелуй», а ἁγίῳ характеризует его как святой, чистый знак общения верующих.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: Приветствуют вас
  rationale: Сохраняет настоящее время и эпистолярный смысл глагола без ненужного добавления «передают привет».
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: все общины
  rationale: Передаёт определённую совокупность «всех общин»; «общины» в данном контексте ясно обозначают местные собрания верующих и звучат естественно по-русски.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός исторически и семантически является титулом «Мессия»; родительный падеж обозначает принадлежность или связь общин с Мессией.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: «Мессия» сохраняет титульное значение греческого Χριστός. Традиционное «Христос» также лексически допустимо и приведено в примечании, чтобы не скрывать вариант передачи.
- issue: Значение ἐκκλησίαι
  choice: общины
  alternative: церкви
  rationale: Во множественном числе речь идёт о местных собраниях верующих, а не о зданиях; «общины» делает этот смысл прозрачным, не отрицая традиционного перевода «церкви».
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Синтаксис двух греческих предложений сохранён; формулировки понятны без церковнославянизмов.
