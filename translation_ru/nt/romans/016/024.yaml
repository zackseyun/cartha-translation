  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: ru
  text: ⸂Благодать Господа нашего Иисуса Христа да будет со всеми вами.⸃[a] Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В одних рукописях этот стих есть, в других он отсутствует; во многих современных критических изданиях он отмечен как текстуально спорный в заключительной части Послания к римлянам.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: 'Традиционное и семантически ёмкое соответствие в павловском благословении: передаёт незаслуженную милость и благой дар Бога.'
- source_word: κυρίου
  choice: Господа
  rationale: В составе христологического титула естественно выражает господство Иисуса; родительный падеж соответствует греческой конструкции.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: В современном литературном русском «Иисус Христос» — устойчивое и общепонятное именование; форма «Христос» сохраняет традиционный титул, исторически означающий Мессию.
- source_word: μετὰ πάντων ὑμῶν
  choice: со всеми вами
  rationale: Естественно передаёт μετά с родительным падежом и подчёркивает включённость всех адресатов.
- source_word: Ἀμήν
  choice: Аминь
  rationale: Устоявшаяся русская литургическая транслитерация заключительного подтверждения.
theological_decisions:
- issue: Передача Χριστός в сочетании Ἰησοῦ Χριστοῦ
  choice: Христос
  alternative: Мессия
  rationale: В русском языке «Иисус Христос» является естественным устойчивым сочетанием, при этом «Христос» сохраняет титульное значение «Помазанник / Мессия» и не требует искусственной формы «Иисус Мессия».
- issue: Грамматическая сила эллиптического благословения
  choice: да будет
  alternative: пребудет / будет
  rationale: В греческом именная часть сказуемого опущена; русское пожелательное «да будет» естественно воспроизводит благословение, не превращая его в простое предсказание.
- issue: Текстуальный статус всего стиха
  choice: стих сохранён и отмечен критическими скобками с примечанием
  alternative: опустить стих из основного текста
  rationale: SBLGNT печатает слова стиха как текстуально спорные; сохранение с явным примечанием передаёт как засвидетельствованное чтение, так и существенную неопределённость рукописной традиции.
translation_notes:
  register: Современный литературный русский с сохранением достоинства апостольского благословения. «Да будет» ясно выражает пожелание; порядок «со всеми вами» естественен и сохраняет всеохватность πάντων. Критические скобки источника сохранены, а маркер примечания поставлен непосредственно после спорного текста.
