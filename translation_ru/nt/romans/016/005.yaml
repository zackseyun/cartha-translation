  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: ru
  text: Приветствуйте также церковь в их доме[a]. Приветствуйте моего возлюбленного Епенета, который — первый плод из Асии для Мессии[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «церковь, которая собирается в их доме».'
    reason: lexical_alternative
  - marker: b
    text: Асия — римская провинция на западе Малой Азии, а не современная часть света Азия.
    reason: cultural_note
  - marker: c
    text: 'То есть, вероятно: «который первым в Асии обратился к Мессии».'
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: церковь в их доме
  rationale: Передаёт собрание верующих, связанное с их домом или собирающееся в нём, сохраняя краткость и структуру греческого выражения.
- source_word: ἀσπάσασθε
  choice: приветствуйте
  rationale: Обычное и естественное соответствие глаголу в перечне эпистолярных приветствий.
- source_word: Ἐπαίνετον
  choice: Епенета
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; винительный падеж обусловлен глаголом «приветствуйте».
- source_word: ἀγαπητόν μου
  choice: моего возлюбленного
  rationale: Сохраняет выражение личной сердечной привязанности и возвышенный, но понятный регистр.
- source_word: ἀπαρχὴ
  choice: первый плод
  rationale: Сохраняет метафору первых плодов, не сводя её в основном тексте к пояснению «первый обращённый».
- source_word: τῆς Ἀσίας
  choice: Асии
  rationale: Передаёт родительный падеж оригинала; форма «Асия» позволяет отличить римскую провинцию от современного континента, что дополнительно пояснено в сноске.
- source_word: εἰς Χριστόν
  choice: для Мессии
  rationale: Предлог передаёт направленность или отношение первого плода к Мессии; формулировка сохраняет образ и неоднозначность конструкции.
theological_decisions:
- issue: Передача Χριστόν
  choice: Мессии
  alternative: Христа
  rationale: Здесь Χριστός сохраняет значение титула; «Мессия» явно передаёт его смысл, не добавляя конфессионального толкования.
- issue: Смысл ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: первый плод Асии для Мессии
  alternative: первый в Асии, кто обратился к Мессии
  rationale: Основной текст сохраняет метафору Павла и допускаемое греческой конструкцией отношение к Асии и Мессии; более разъясняющее понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным, метафора ἀπαρχή сохранена, а историко-географическое и смысловое пояснения вынесены в сноски.
