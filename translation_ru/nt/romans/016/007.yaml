  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: ru
  text: Приветствуйте Андроника и Юнию[a], моих сородичей и соузников. Они примечательны среди апостолов[b] и ещё до меня были в Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Юния: возможно также мужское имя «Юний»; однако греческая форма и историческое употребление с большей вероятностью указывают на женское имя.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «выдающиеся среди апостолов»; выражение также можно понимать как «хорошо известны апостолам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Стандартный эпистолярный императив со значением передачи приветствия; русский глагол сохраняет прямую повелительную форму.
- source_word: Ἀνδρόνικον
  choice: Андроника
  rationale: Общепринятая русская передача личного имени в требуемой винительной форме.
- source_word: Ἰουνίαν
  choice: Юнию
  rationale: Греческая форма наиболее естественно соответствует хорошо засвидетельствованному женскому имени Юния; исторически влиятельная мужская интерпретация вынесена в примечание.
- source_word: συγγενεῖς μου
  choice: моих сородичей
  rationale: «Сородичи» сохраняет возможность как родственного, так и более широкого этнического смысла и не сужает значение до близких родственников или прямо до иудеев.
- source_word: συναιχμαλώτους μου
  choice: соузников
  rationale: Кратко и точно передаёт людей, разделявших с Павлом заключение; слово уместно в современном литературном и библейском регистре.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: известны среди апостолов
  rationale: Передаёт заметность или известность, не устраняя полностью спор о том, входят ли Андроник и Юния в число апостолов или лишь пользуются известностью у них; варианты разъяснены в примечании.
- source_word: πρὸ ἐμοῦ
  choice: ещё до меня
  rationale: Естественно выражает временное предшествование и подчёркивает, что они были в Мессии раньше Павла.
- source_word: γέγοναν ἐν Χριστῷ
  choice: были в Мессии
  rationale: Сохраняет павловское выражение «в Мессии» и результирующий смысл перфекта, не заменяя его разъясняющей формулой об обращении.
theological_decisions:
- issue: Пол и имя Ἰουνίαν
  choice: Женское имя «Юния»
  alternative: Мужское имя «Юний»
  rationale: Форма и историческое употребление лучше поддерживают женское имя. Мужская интерпретация сохраняется в примечании ввиду её роли в истории толкования.
- issue: Смысл ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: «известны среди апостолов»
  alternative: «выдающиеся среди апостолов» или «хорошо известны апостолам»
  rationale: Греческое выражение допускает спор как о силе прилагательного, так и о значении предложной конструкции. Основной текст оставляет формулировку сдержанной, а примечание открыто показывает варианты и их значение для вопроса о принадлежности к кругу апостолов.
- issue: Передача Χριστός
  choice: «Мессия»
  alternative: «Христос»
  rationale: Передача как титула «Мессия» делает исходное значение Χριστός прозрачным и сохраняет формулу «в Мессии» без конфессионального расширения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского послания. Формулировка краткая и естественная; «сородичи» и «известны среди апостолов» намеренно сохраняют смысловую неоднозначность исходного текста, а «в Мессии» сохраняет павловскую идиому.
