review_pass:
  verdict: revise
  source_fidelity: 'Основной текст в целом верно передаёт греческий текст: императив, имена, «сородичей», «соузников», временное «до меня» и формулу «в Мессии». Однако «известны среди апостолов» в русском языке менее точно передаёт ἐπίσημοι: оно может звучать как простая известность, тогда как прилагательное выражает заметность, выдающееся положение или признанность. «Примечательны среди апостолов» ближе к исходнику и столь же не снимает синтаксическую дискуссию.'
  naturalness: «Приветствуйте», «сородичей», «соузников» и «были в Мессии» приемлемы в современном литературно-библейском регистре. «Примечательны среди апостолов» звучит естественно и точнее, чем «известны среди апостолов».
  terminology: Юния корректно передана как наиболее вероятное женское имя, с сохранением мужского варианта в примечании. «Мессия» последовательно передаёт Χριστός согласно заданной политике. Примечание b следует сформулировать так, чтобы основной вариант не дублировался как альтернативный и чтобы оба реально обсуждаемых понимания были ясны.
  issues:
  - severity: medium
    issue: Слабая передача ἐπίσημοι
    rationale: «Известны» передаёт лишь узнаваемость и несколько ослабляет оценочный смысл ἐπίσημοι. «Примечательны» сохраняет диапазон «заметны/выдающиеся», не решая спор о включённости в число апостолов.
  - severity: low
    issue: Неудачная структура примечания b
    rationale: 'Текущая формула «возможно также: они выдающиеся среди апостолов» противопоставляет основному тексту близкий по смыслу, но более точный вариант. Лучше дать «выдающиеся среди апостолов» как усиленный оттенок и отдельно сохранить вариант «хорошо известны апостолам».'
