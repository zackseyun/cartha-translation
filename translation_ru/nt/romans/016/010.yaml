  source_fidelity: «Испытанного» передаёт лишь компонент прохождения испытания, тогда как δόκιμος обозначает того, кто испытан и признан подлинным/одобренным. «Проверенного» в русском включает результат проверки и точнее сохраняет похвальный смысл. Повтор императива, имена и оборот о людях дома Аристовула переданы верно.
  naturalness: «Приветствуйте Апеллеса, проверенного в Мессии» — краткая литературная формула, более естественная и семантически полная, чем «испытанного в Мессии». «Тех, кто из дома Аристовула» понятно и сохраняет сдержанность оригинала относительно характера их связи с Аристовулом.
  terminology: «Мессия» обоснованно передаёт титул Χριστός; традиционное «во Христе» корректно вынесено в сноску. Имя «Апеллес» и «Аристовул» переданы последовательно. «Дом Аристовула» допустимо обозначает его домочадцев или зависимое окружение, не утверждая, что сам Аристовул присутствовал среди адресатов.
