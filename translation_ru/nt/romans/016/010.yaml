  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: ru
  text: Приветствуйте Апеллеса, проверенного в Мессии.[a] Приветствуйте тех, кто из дома Аристовула.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционной передаче: «во Христе».'
    reason: Альтернативная, традиционно принятая передача выражения ἐν Χριστῷ.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Повторённый императив во множественном числе естественно и кратко передаётся русским «приветствуйте».
- source_word: Ἀπελλῆν
  choice: Апеллеса
  rationale: Личное имя передано традиционной русской транслитерацией и поставлено в винительный падеж.
- source_word: τὸν δόκιμον
  choice: испытанного
  rationale: δόκιμος обозначает человека, прошедшего испытание и доказавшего свою подлинность или верность. «Испытанного» сохраняет ёмкость греческого выражения, не уточняя без необходимости, кем и каким образом он был испытан.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Предлог ἐν сохранён, чтобы не снимать характерную для Павла смысловую напряжённость выражения; Χριστός передан как титул «Мессия».
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: тех, кто из дома Аристовула
  rationale: Греческий оборот указывает на людей, относящихся к дому или окружению Аристовула, не обязательно включая его самого. Русское «из дома» ясно и не перегружает текст.
theological_decisions:
- issue: Передача ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: «В Мессии» сохраняет титульный смысл Χριστός и павловский язык принадлежности или единения, не сводя его к пояснительному выражению вроде «как верующего». Традиционный вариант отмечен в сноске.
- issue: Смысл δόκιμος применительно к Апеллесу
  choice: испытанного
  alternative: одобренного; доказавшего верность
  rationale: Греческое слово может соединять идеи испытанности и полученного одобрения. Выбранный вариант сохраняет эту ёмкость и не определяет прямо ни субъекта одобрения, ни конкретное испытание.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой приветствия. Синтаксический параллелизм двух повелений сохранён; богословски насыщенное выражение «в Мессии» не разъясняется внутри стиха.
