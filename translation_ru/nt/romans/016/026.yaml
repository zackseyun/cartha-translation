  verdict: revise
  source_fidelity: 'Черновик в целом верно передаёт основные элементы греческого текста: нынешнее откровение тайны, роль пророческих Писаний, повеление вечного Бога, все народы и «послушание веры». Однако «чтобы они пришли к» добавляет эксплицитное действие и субъект, которых в εἰς ὑπακοὴν πίστεως нет, и несколько сужает/истолковывает лаконичную конструкцию оригинала.'
  naturalness: Форма «открыта ... возвещена» грамматически не согласована с подразумеваемой «тайной» из Римлянам 16:25, тогда как греческие причастия стоят в родительном падеже и продолжают зависеть от слова «тайны». Согласование следует сохранить и по-русски; фрагментарность здесь оправдана продолжающимся синтаксисом славословия.
  terminology: «Пророческие Писания», «повеление вечного Бога» и «всем народам» удачны. «Послушание веры» сохраняет намеренную сжатость и неоднозначность греческой генитивной конструкции, а также перекличку с Римлянам 1:5.
  issues:
