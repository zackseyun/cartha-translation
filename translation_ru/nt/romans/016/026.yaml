    rationale: φανερωθέντος и γνωρισθέντος — причастия родительного падежа, относящиеся к μυστήριον в Римлянам 16:25. Русские формы «открыта» и «возвещена» стоят в именительном падеже; нужны «открытой» и «возвещённой».
  - severity: medium
