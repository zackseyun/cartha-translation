    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: открыта
  rationale: Причастие относится к «тайне» из стиха 25 и передаёт явление прежде сокрытого; женский род сохраняет эту синтаксическую связь.
- source_word: γραφαῖς προφητικαῖς
  choice: пророческие Писания
  rationale: Сочетание обозначает священные пророческие тексты; прописная буква ясно передаёт специальное значение «Писаний».
- source_word: ἐπιταγήν
  choice: повелению
  rationale: Слово обозначает властное распоряжение; «повеление» естественно и достойно звучит в данном контексте.
- source_word: γνωρισθέντος
  choice: возвещена
  rationale: В контексте сообщения тайны всем народам глагол передаёт не только познание, но и доведение её до сведения; женский род связывает его с «тайной».
- source_word: ὑπακοὴν πίστεως
  choice: послушанию веры
  rationale: Сохранена ёмкая и намеренно неоднозначная родительная конструкция, перекликающаяся с Римлянам 1:5.
- source_word: ἔθνη
  choice: народы
  rationale: Передаёт всеобщий охват, не сужая значение до противопоставления язычников и иудеев.
theological_decisions:
- issue: Значение εἰς ὑπακοὴν πίστεως
  choice: «чтобы они пришли к послушанию веры»
  alternative: «ради послушания, проистекающего из веры» / «чтобы все покорились вере»
  rationale: Греческая родительная конструкция допускает несколько смысловых оттенков. Формулировка сохраняет связь веры и послушания, не определяя жёстко характер этой связи.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского текста. Начальное «а» показывает продолжение синтаксически незавершённого славословия. Порядок частей слегка адаптирован для ясности, при этом сохранены все смысловые связи греческого текста.
