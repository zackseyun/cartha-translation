  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: ru
  text: Бог же мира вскоре сокрушит Сатану под вашими ногами. Благодать Господа нашего Иисуса Христа да будет с вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Бог же мира
  rationale: Сохранён характерный для Павла титул «Бог мира»; частица δέ передана естественным русским «же».
- source_word: συντρίψει
  choice: сокрушит
  rationale: Будущее время выражает определённое грядущее действие, а «сокрушит» естественно сочетается с образом поверженного врага под ногами.
- source_word: τὸν Σατανᾶν
  choice: сатану
  rationale: Передано общепринятое в русском языке собственное имя без поясняющего истолкования «противник».
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: под вашими ногами
  rationale: Сохранены образ победы и множественное число обращения ко всей общине.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: В данном контексте выражение естественнее всего указывает на близость события, а не только на быстроту самого действия.
- source_word: ἡ χάρις
  choice: Благодать
  rationale: Сохранён ключевой павловский термин и естественная форма заключительного благословения.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Господа нашего
  rationale: Родительный падеж передаёт принадлежность благодати Господу; порядок слов соответствует возвышенной, но понятной русской формуле благословения.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: «Христос» — укоренившееся русское соответствие греческому Χριστός, сохраняющее мессианский титул и естественно звучащее в формуле благословения.
- source_word: μεθ’ ὑμῶν
  choice: да будет с вами
  rationale: В греческом глагол подразумевается; по-русски он восстановлен как «да будет», что естественно выражает благословение.
theological_decisions:
- issue: Соотношение Божьего действия и участия верующих в победе над сатаной
  choice: «Бог… сокрушит сатану под вашими ногами»
  alternative: «Бог сокрушит сатану под Своими ногами»
  rationale: 'Сохранено напряжение исходного текста: действие совершает Бог, но сатана оказывается под ногами адресатов; местоимение ὑμῶν нельзя заменять указанием на Божьи ноги.'
- issue: Передача Χριστοῦ в заключительном благословении
  choice: Христа
  alternative: Мессии
  rationale: В современном литературном русском «Иисус Христос» — естественная и общепринятая форма, при этом слово «Христос» исторически и семантически сохраняет титул Помазанника и не требует искусственной замены.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис краток и понятен; традиционные богословские выражения сохранены там, где они остаются прозрачными для современного читателя.
