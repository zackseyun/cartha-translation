  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: ru
  text: Приветствуйте Филолога и Юлию[a], Нерея и его сестру, Олимпа и всех святых, которые с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, мужчину по имени Юлиас; греческую форму обычно понимают как женское имя «Юлия».
    reason: Альтернативное понимание пола личного имени, встречающееся в истории перевода.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, медиальный императив второго лица множественного числа; в контексте послания это естественное и точное указание передать приветствие.
- source_word: Φιλόλογον
  choice: Филолога
  rationale: Личное имя передано в принятой русской форме с учётом винительного падежа греческого текста.
- source_word: Ἰουλίαν
  choice: Юлию
  rationale: Форма естественнее всего понимается как винительный падеж женского имени Юлия; менее вероятное мужское толкование отмечено в сноске.
- source_word: Νηρέα
  choice: Нерея
  rationale: Личное имя передано русской транслитерацией и поставлено в винительный падеж.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: его сестру
  rationale: ἀδελφή означает «сестра», а αὐτοῦ указывает на Нерея; современный русский порядок слов звучит естественно.
- source_word: Ὀλυμπᾶν
  choice: Олимпа
  rationale: Личное имя передано в традиционной русской форме Олимп и поставлено в винительный падеж.
- source_word: τοὺς σὺν αὐτοῖς
  choice: которые с ними
  rationale: Сочетание σύν с дательным выражает совместность; относительная конструкция ясно связывает эту группу со всеми ранее названными людьми.
- source_word: πάντας ἁγίους
  choice: всех святых
  rationale: В посланиях Павла ἅγιοι — обычное обозначение верующих как принадлежащих Богу; «святых» сохраняет термин и не добавляет пояснений в основной текст.
theological_decisions:
- issue: Передача ἅγιοι в приветствии Павла
  choice: святых
  alternative: верующих; святого народа Божьего
  rationale: Здесь слово обозначает собратьев по вере, а не людей, позднее официально канонизированных. Традиционный термин сохраняет характерную для Павла лексику и богословскую смысловую связь со святостью.
- issue: Пол имени Ἰουλίαν
  choice: Юлия, женское имя
  alternative: Юлий, мужское имя
  rationale: Ударение и обычное ономастическое употребление греческой формы лучше поддерживают женское имя. Поскольку в истории переводов предлагалось и мужское понимание, оно сохранено в сноске без изменения наиболее вероятного основного чтения.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой эпистолярного приветствия. Имена адаптированы к русскому склонению; синтаксис сделан прозрачным без устранения отмеченной неоднозначности имени Юлия.
