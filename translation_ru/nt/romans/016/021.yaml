source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: ru
  text: Вас приветствует Тимофей, мой соработник, а также Луций, Иасон и Сосипатр, мои сородичи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои родственники»; возможно также: «мои соплеменники-иудеи». Греческое слово может обозначать как кровных родственников, так и людей, связанных более широким родством или общим происхождением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: приветствует
  rationale: В эпистолярном контексте ἀσπάζομαι означает «приветствовать» или «передавать привет». Форма единственного числа согласуется с ближайшим подлежащим «Тимофей», а последующие лица присоединены союзами.
- source_word: ὑμᾶς
  choice: вас
  rationale: Местоимение второго лица множественного числа обращено ко всей римской общине; русское «вас» точно передаёт число и падеж.
- source_word: συνεργός
  choice: соработник
  rationale: Слово обозначает человека, совместно участвующего в общем труде. «Соработник» естественно для контекста служения и сохраняет идею совместной работы без современного корпоративного оттенка.
- source_word: Λούκιος
  choice: Луций
  rationale: Традиционная и нормативная русская передача греческого личного имени.
- source_word: Ἰάσων
  choice: Иасон
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Ἰάσων.
- source_word: Σωσίπατρος
  choice: Сосипатр
  rationale: Передаёт полную форму имени в данном стихе; она не подменяется сокращённой формой «Сопатр», встречающейся в другом месте.
- source_word: συγγενεῖς
  choice: сородичи
  rationale: «Сородичи» допускает как родственную, так и более широкую этническую связь и потому лучше сохраняет неоднозначность греческого слова, чем узкое «родственники» или пояснительное «соплеменники-иудеи».
theological_decisions:
- issue: Значение выражения οἱ συγγενεῖς μου у Павла
  choice: мои сородичи
  alternative: мои родственники; мои соплеменники-иудеи
  rationale: Сам стих не уточняет, говорит ли Павел о кровных родственниках или о более широком родстве по народу. Основной текст сохраняет эту смысловую открытость, а варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Порядок фразы сделан естественным для русского языка; повторное сказуемое перед перечнем не добавлено, поскольку союзная конструкция ясно показывает, что все названные лица передают привет.
