  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: ru
  text: Приветствуйте Иродиона, моего сородича[a]. Приветствуйте тех, кто принадлежит Наркиссу и кто в Господе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «родственника», или «соплеменника»: греческое слово может обозначать кровного родственника либо человека одного с Павлом народа.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеются в виду верующие из дома, окружения или имения Наркисса.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Форма повелительного наклонения во множественном числе в контексте завершающих приветствий письма естественно передаётся как «Приветствуйте».
- source_word: Ἡρῳδίωνα
  choice: Иродиона
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: συγγενῆ μου
  choice: моего сородича
  rationale: «Сородич» сохраняет широту греческого слова, которое может обозначать как родственника, так и человека одного народа, не вынуждая выбрать только одно значение.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: тех из людей Наркисса
  rationale: Формулировка естественно указывает на людей, связанных с Наркиссом, но не вводит прямо отсутствующее в греческом тексте слово «дом» или «домашние».
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: кто в Господе
  rationale: Сохранено характерное для Павла выражение «в Господе» с его богословской ёмкостью; поясняющие варианты вроде «кто верует в Господа» были бы уже истолкованием.
- source_word: κυρίῳ
  choice: Господе
  rationale: κύριος в устойчивом павловом выражении ἐν κυρίῳ передано традиционным и семантически уместным словом «Господь».
theological_decisions:
- issue: Значение συγγενής в приветствии Павла
  choice: сородича
  alternative: родственника; соплеменника
  rationale: Контекст не позволяет уверенно решить, называет ли Павел Иродиона кровным родственником или своим соплеменником-иудеем. Основной текст сохраняет эту неоднозначность.
- issue: Круг людей, связанных с Наркиссом
  choice: тех из людей Наркисса
  alternative: тех из дома Наркисса; домашних Наркисса
  rationale: Греческое выражение обозначает принадлежность или связь с Наркиссом, но не содержит существительного «дом». Вероятный смысл, связанный с его домом или имением, вынесен в примечание.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой апостольского приветствия. Павлово выражение «в Господе» сохранено без разъясняющего перифраза; неоднозначные связи Иродиона и людей Наркисса не конкретизированы сверх исходного текста.
