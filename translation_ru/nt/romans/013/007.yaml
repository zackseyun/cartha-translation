id: ROM.13.7
reference: Romans 13:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: ru
  text: 'Отдавайте всем должное: кому налог — налог, кому пошлину — пошлину, кому страх — страх, кому честь — честь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Отдавайте
  rationale: Передаёт повеление вернуть или предоставить то, что причитается; сохраняет связь с последующим «должное» и звучит естественно по-русски.
- source_word: ὀφειλάς
  choice: должное
  rationale: Собирательно передаёт «то, что причитается, обязательства» и позволяет сохранить лаконичную структуру перечня.
- source_word: φόρον
  choice: налог
  rationale: Обозначает обязательный прямой налог или дань; современное «налог» понятно читателю и уместно в данном контексте.
- source_word: τέλος
  choice: пошлину
  rationale: Отличает сбор или пошлину от φόρος и сохраняет два разных финансовых обязательства исходного текста.
- source_word: φόβον
  choice: страх
  rationale: Сохраняет прямое значение греческого слова и намеренную напряжённость текста, не заменяя его толкованием «уважение».
- source_word: τιμήν
  choice: честь
  rationale: Точно передаёт признание достоинства и почёт, сохраняя отличие от φόβος.
theological_decisions:
- issue: Значение φόβος по отношению к властям и другим адресатам обязательств
  choice: страх
  alternative: уважение / почтение
  rationale: Исходный текст употребляет φόβος, а затем отдельно τιμή; буквальное «страх» сохраняет различие между понятиями и не снимает возможную богословскую напряжённость посредством интерпретации.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественно-наставительным звучанием. Повтор существительных и параллельная конструкция сохранены вслед за греческим оригиналом; архаичные «дань» и «оброк» не использованы.
