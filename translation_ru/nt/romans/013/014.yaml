base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: ru
  text: Но облекитесь в Господа Иисуса Христа и не заботьтесь о плоти так, чтобы удовлетворять её желания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о греховной природе». Греческое слово буквально означает «плоть»; у Павла оно нередко обозначает падшие человеческие побуждения в противопоставлении жизни, направляемой Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: облекитесь
  rationale: Возвратный императив сохраняет образ одежды и в современном литературном русском естественно выражает призыв принять образ жизни и принадлежность, связанные с Господом Иисусом Христом.
- source_word: κύριον
  choice: Господа
  rationale: В данном христологическом контексте это титул Иисуса; традиционный русский эквивалент сохраняет его богословский вес.
- source_word: Χριστόν
  choice: Христа
  rationale: В устойчивом русском сочетании «Господа Иисуса Христа» слово сохраняет титульное значение Помазанника и звучит естественнее, чем пояснительное «Мессию» внутри этой формулы.
- source_word: πρόνοιαν
  choice: заботьтесь заранее
  rationale: Слово обозначает предусмотрительность, предварительную заботу или приготовление. Наречие «заранее» передаёт компонент заблаговременного устройства, не сводя выражение только к материальному обеспечению.
- source_word: σάρξ
  choice: плоть
  rationale: Буквальный термин сохраняет характерную для Павла многозначность и напряжение между телесностью и падшими человеческими побуждениями; более толковательный вариант вынесен в сноску.
- source_word: ποιεῖσθε
  choice: не заботьтесь
  rationale: В сочетании с πρόνοιαν глагол образует выражение о проявлении или осуществлении предварительной заботы; по-русски оно естественно передаётся одним глагольным оборотом.
- source_word: εἰς ἐπιθυμίας
  choice: ради её желаний
  rationale: Предлог εἰς допускает целевое или результирующее понимание. Формулировка сохраняет связь приготовления для плоти с её желаниями, не добавляя прямо отсутствующий в греческом глагол «удовлетворять».
theological_decisions:
- issue: Значение σάρξ в нравственном увещании Павла
  choice: плоть
  alternative: греховная природа
  rationale: Контекст указывает на неупорядоченные человеческие желания, однако вариант «греховная природа» сужает и систематизирует значение термина. Основной текст сохраняет слово «плоть», а возможное толкование отмечено в сноске.
- issue: Передача Χριστός в формуле κύριον Ἰησοῦν Χριστόν
  choice: Господа Иисуса Христа
  alternative: Господа Иисуса Мессию
  rationale: «Христос» в русском языке является традиционным титулом-переводом «Помазанник» и в данной устойчивой формуле не обязательно воспринимается как фамилия. Этот вариант одновременно точен и естественен для современного литературного русского.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного библейского образа «облекитесь». Синтаксис близок к греческому, но остаётся понятным обычному читателю; многозначность слов «плоть» и εἰς намеренно не устранена толкованием.
