  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: ru
  text: Не оставайтесь никому ничего должны, кроме того, чтобы любить друг друга; ведь любящий другого исполнил закон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Не оставайтесь никому ничего должны
  rationale: Передаёт всеохватную формулу «никому ничего» и сохраняет значение долга или обязательства. Несовершенный вид естественно выражает продолжающееся состояние задолженности, не превращая стих в однозначный запрет любого заимствования.
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: кроме взаимной любви
  rationale: Кратко и естественно передаёт единственное продолжающееся обязательство — любить друг друга; существительное «любовь» в сочетании с «взаимной» сохраняет взаимность ἀλλήλους.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: ведь любящий
  rationale: Субстантивированное причастие передано обобщённо и без архаического местоимения; γάρ естественно выражено словом «ведь».
- source_word: τὸν ἕτερον
  choice: другого
  rationale: Буквально сохраняет значение «другого», не подменяя его более конкретным «ближнего», которого в этой фразе нет.
- source_word: νόμον πεπλήρωκεν
  choice: исполнил закон
  rationale: Русский перфектив передаёт завершённость действия греческого перфекта и его сохраняющийся результат; «исполнил закон» — точная и устойчивая библейская формулировка.
theological_decisions:
- issue: Объём запрета задолженности
  choice: Сохранить прямой призыв не оставаться должным, не уточняя, запрещает ли он всякое заимствование.
  alternative: Передать как абсолютный запрет любых займов либо только как метафору нравственного обязательства.
  rationale: Греческий текст говорит о долге и тут же выделяет любовь как исключение; перевод не должен заранее разрешать более широкий этический спор.
- issue: Характер обязательства любви
  choice: Передать любовь как единственный долг, который остаётся постоянным и взаимным.
  alternative: Истолковать исключение как долг, который можно однажды полностью погасить.
  rationale: Инфинитив настоящего времени и взаимное местоимение естественно указывают на продолжающуюся взаимную любовь.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и доступная. Сохранены риторический параллелизм «никому ничего» и напряжение между запретом долга и непрекращающимся обязательством любви.
