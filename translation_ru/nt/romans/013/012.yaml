id: ROM.13.12
reference: Romans 13:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: ru
  text: Ночь уже на исходе[a], а день приблизился. Поэтому отбросим дела тьмы и облечёмся в доспехи света[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ночь далеко продвинулась». Греческий глагол изображает ночь как продвинувшуюся вперёд, то есть большей частью уже миновавшую.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оружие света».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ νὺξ
  choice: ночь
  rationale: Сохраняет буквальный временной образ и его противопоставление дню, не сводя метафору только к нравственной тьме.
- source_word: προέκοψεν
  choice: уже на исходе
  rationale: Глагол буквально описывает продвижение вперёд; в современном русском выражение «ночь уже на исходе» естественно передаёт мысль, что ночь далеко продвинулась и большей частью миновала.
- source_word: ἡ ἡμέρα
  choice: день
  rationale: Буквально сохраняет временное и нравственное противопоставление ночи.
- source_word: ἤγγικεν
  choice: приблизился
  rationale: 'Передаёт перфект: день подошёл близко и теперь находится рядом; формулировка сохраняет динамику приближения.'
- source_word: ἀποβαλώμεθα
  choice: отбросим
  rationale: Увещевательный аористный конъюнктив передан формой совместного призыва. Глагол сохраняет энергичный образ снятия и отбрасывания, соотнесённый с последующим «облечёмся».
- source_word: τὰ ἔργα
  choice: дела
  rationale: Естественный русский эквивалент стандартного павловского термина, обозначающий нравственные поступки.
- source_word: τοῦ σκότους
  choice: тьмы
  rationale: Сохраняет образное родительное сочетание без истолковывающей замены словом «зло».
- source_word: ἐνδυσώμεθα
  choice: облечёмся
  rationale: Передаёт увещевательный конъюнктив и сохраняет образ надевания одежды или снаряжения; высокий, но понятный библейский регистр.
- source_word: τὰ ὅπλα
  choice: доспехи
  rationale: В сочетании с глаголом «облечься» слово естественно обозначает надеваемое боевое снаряжение. При этом греческое слово может также означать оружие, что отмечено в сноске.
- source_word: τοῦ φωτός
  choice: света
  rationale: Буквально сохраняет нравственный и эсхатологический образ, противопоставленный тьме.
theological_decisions:
- issue: Эсхатологический образ ночи и дня
  choice: Сохранены буквальные образы «ночь» и «день», а их нравственный и спасительно-исторический смысл оставлен имплицитным.
  alternative: 'Истолковывающий перевод: «тёмный век почти закончился, новый день близок».'
  rationale: Греческий текст создаёт одновременно временное, нравственное и эсхатологическое напряжение; явная расшифровка сузила бы многозначность образа.
- issue: Значение ὅπλα τοῦ φωτός
  choice: «доспехи света» в основном тексте.
  alternative: «оружие света».
  rationale: Глагол «облечёмся» поддерживает значение надеваемого боевого снаряжения, однако широкое значение ὅπλα не исключает оружия, поэтому вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Пара «отбросим — облечёмся» сохраняет единство призыва и образ смены одежды; «доспехи» поддерживает военную метафору без архаической тяжеловесности.
