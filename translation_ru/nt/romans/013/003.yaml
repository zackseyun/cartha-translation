source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: ru
  text: Ведь правители внушают страх не за доброе дело[a], а за злое. Хочешь не бояться власти?[b] Делай добро — и получишь от неё похвалу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не за добрые поступки, а за злые». Греческий текст в общем нравственном смысле противопоставляет доброе злому.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также условный перевод: «Если же хочешь не бояться власти, делай добро».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: Обозначает тех, кто правит или занимает властное положение; «правители» естественно и достаточно широко передаёт политический контекст.
- source_word: φόβος
  choice: страшны
  rationale: Предикативное существительное выражает причину или предмет страха. Русская конструкция «страшны для» естественно передаёт смысл без излишнего усиления.
- source_word: τῷ ἀγαθῷ ἔργῳ ... τῷ κακῷ
  choice: для доброго дела ... для злого
  rationale: Сохраняет формальное противопоставление доброго и злого и единственное число ἔργῳ; субстантивированное τῷ κακῷ восполняется словом «дела» по контексту.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Хочешь не бояться
  rationale: Сохраняет риторический вопрос и структуру θέλεις с инфинитивом и отрицанием, оставаясь естественным по-русски.
- source_word: τὴν ἐξουσίαν
  choice: власти
  rationale: Единственное число указывает на правящую власть как институт; русское «власть» передаёт это без уточнения конкретной должности.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Делай добро
  rationale: Субстантивированное прилагательное обозначает добро как нравственную категорию; краткая русская формула естественна и точно передаёт повеление.
- source_word: ἕξεις ἔπαινον
  choice: получишь похвалу
  rationale: Хотя буквально сказано «будешь иметь похвалу», по-русски «получишь похвалу» естественно выражает ожидаемое одобрение.
- source_word: ἐξ αὐτῆς
  choice: от неё
  rationale: Местоимение женского рода отсылает к ἐξουσία; русское «от неё» сохраняет эту явную связь с властью.
theological_decisions:
- issue: Охват утверждения Павла о правителях и похвале
  choice: Передать прямое утверждение о нормальной функции правящей власти, не превращая его в более сильное заявление о безусловно справедливом поведении каждого правителя.
  alternative: Понять слова как абсолютное утверждение, что все правители всегда поощряют добро и наказывают зло, либо как иронию.
  rationale: В тексте нет явных показателей ни абсолютного уточнения, ни иронии; перевод сохраняет напряжение прямой формулировки в её контексте.
translation_notes:
  register: Современный литературный русский язык; тон сжатый, наставительный и достойный. Сохранён риторический вопрос оригинала и прямое противопоставление доброго и злого.
