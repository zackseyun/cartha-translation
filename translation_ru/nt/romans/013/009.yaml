  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: ru
  text: 'Ибо сказано: «Не прелюбодействуй, не убивай[a], не кради, не желай чужого», — и, если есть какая-либо другая заповедь, всё это сводится в этом изречении[b]: «Люби ближнего твоего, как самого себя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол обозначает убийство, то есть преступное лишение жизни, а не всякое лишение жизни.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в этом слове». В данном контексте греческое слово может означать также «высказывание» или «изречение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Ведь заповеди
  rationale: Артикль среднего рода вводит содержание перечисляемых заповедей; добавление слова «заповеди» делает синтаксис естественным по-русски, а «ведь» сохраняет пояснительную силу γάρ.
- source_word: μοιχεύσεις
  choice: не прелюбодействуй
  rationale: Будущее изъявительного наклонения в цитате выполняет функцию запрета. Русская отрицательная форма повелительного наклонения естественно сохраняет законодательный характер и связь с Декалогом.
- source_word: φονεύσεις
  choice: не убивай
  rationale: В цитатной форме это наиболее узнаваемая и естественная русская передача заповеди; сноска уточняет, что греческий глагол обозначает преступное лишение жизни, а не всякое причинение смерти.
- source_word: κλέψεις
  choice: не кради
  rationale: Краткая запретительная форма соответствует функции греческого будущего времени в цитате и звучит естественно в современном русском языке.
- source_word: ἐπιθυμήσεις
  choice: не желай чужого
  rationale: В контексте Декалога глагол означает стремление завладеть принадлежащим другому. Слово «чужого» передаёт этот более узкий смысл без архаичного «возжелай».
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: и любая другая заповедь
  rationale: Передаёт неопределённый и всеохватывающий смысл конструкции; русское «любая» естественнее буквального условного оборота и не меняет объёма утверждения.
- source_word: ἀνακεφαλαιοῦται
  choice: сводятся
  rationale: Глагол обозначает сведение воедино или под общий итог. Множественное число согласовано с явным русским «заповеди» и передаёт смысл всего перечисления.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: к одному изречению
  rationale: λόγος здесь обозначает не отдельное слово, а словесно выраженное положение, которое далее цитируется. «Изречение» ясно и достойно передаёт этот смысл; возможная более буквальная передача отмечена в сноске.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Форма прямого повеления естественна в современном русском и сохраняет обязательную силу цитаты из Левита.
- source_word: πλησίον
  choice: ближнего
  rationale: Традиционный и точный русский эквивалент, сохраняющий межтекстовую связь с Левитом.
- source_word: ὡς σεαυτόν
  choice: как самого себя
  rationale: Прямо и естественно передаёт краткое греческое сравнение, не добавляя толкования.
theological_decisions:
- issue: Форма цитируемых запретов Декалога
  choice: 'Отрицательное повелительное наклонение: «не прелюбодействуй…»'
  alternative: 'Форма будущего времени: «не будешь…»'
  rationale: Хотя в греческом употреблено будущее время, в цитате оно имеет повелительную силу. Русское повелительное наклонение понятно современному читателю и сохраняет характер заповеди и межтекстовую связь.
- issue: Объём значения φονεύω
  choice: «не убивай» с уточняющей сноской о преступном убийстве
  alternative: «не совершай убийства»
  rationale: Основной текст сохраняет узнаваемую форму заповеди, но сноска не позволяет истолковать греческий глагол как безусловное обозначение всякого лишения жизни.
- issue: Значение λόγος в обобщающей формуле
  choice: «изречение», то есть итоговая словесная формулировка
  alternative: «слово» или «высказывание»
  rationale: Речь идёт не об одном лексическом слове, а о следующей далее формулировке. Выбор не превращает её в отвлечённый богословский принцип и сохраняет функцию цитаты.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой библейских заповедей. Архаичное «возжелай» заменено понятным «желай чужого»; синтаксис слегка перестроен ради ясности, при этом перечисление и итоговая цитата сохранены.
