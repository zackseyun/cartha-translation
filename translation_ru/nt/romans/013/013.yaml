  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: ru
  text: 'Будем вести себя благопристойно, как днём[a]: не предаваться разгулу и пьянству, не жить в половой распущенности и бесстыдстве, не ссориться и не ревновать[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как при свете дня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не завидовать»; греческое слово может означать как ревность, так и зависть, причём здесь оно употреблено в отрицательном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: как при свете дня
  rationale: Естественно передаёт образ поведения на виду, уместного днём, и сохраняет контраст дня и тьмы из ближайшего контекста.
- source_word: εὐσχημόνως
  choice: благопристойно
  rationale: Передаёт достойный, приличный и общественно уместный характер поведения; слово литературно, но понятно современному читателю.
- source_word: περιπατήσωμεν
  choice: будем вести себя
  rationale: Передаёт увещательный сослагательный оборот и метафорическое значение «ходить» как образа жизни без неестественной для современного русского буквальности.
- source_word: κώμοις
  choice: разгулу
  rationale: Обозначает буйные увеселения и пирушки, обычно связанные с пьянством; «разгул» сохраняет широту смысла и не сужает его до сексуальных оргий.
- source_word: μέθαις
  choice: пьянству
  rationale: Прямо и естественно передаёт состояния или случаи опьянения.
- source_word: κοίταις
  choice: жить в половой распущенности
  rationale: Буквально слово означает «ложа», но здесь идиоматически указывает на недозволенные половые связи; перевод по смыслу устраняет неясность.
- source_word: ἀσελγείαις
  choice: бесстыдстве
  rationale: Передаёт бесстыдное, необузданное поведение, нередко имеющее сексуальный оттенок, но не ограничивает значение только сексуальной сферой.
- source_word: ἔριδι
  choice: ссориться
  rationale: Передаёт раздоры, препирательство и враждебную конфликтность естественным русским глаголом.
- source_word: ζήλῳ
  choice: ревновать
  rationale: В перечне пороков слово имеет отрицательный смысл и может обозначать ревность или зависть; «ревновать» хорошо сочетается с предшествующими ссорами, а альтернатива отмечена в сноске.
theological_decisions:
- issue: Метафорический контраст дня и тьмы в нравственном призыве
  choice: Сохранён образ «как при свете дня» без дополнительного догматического истолкования.
  alternative: как днём; словно уже наступил день
  rationale: Стих продолжает контекстуальную метафору дня и ночи, однако сам перевод не должен разворачивать её в отсутствующее в тексте богословское объяснение.
- issue: Идиоматическое значение κοίταις
  choice: Передано по смыслу как жизнь в половой распущенности.
  alternative: не в ложах
  rationale: Буквальное «ложа» в современном русском затемнило бы явно сексуальный нравственный смысл выражения, тогда как перевод по смыслу его сохраняет.
- issue: Отрицательное значение ζήλῳ
  choice: ревновать
  alternative: завидовать
  rationale: Греческое слово допускает оба отрицательных оттенка; контекст перечня пороков исключает положительное «рвение», но не позволяет полностью устранить различие между ревностью и завистью.
translation_notes:
  register: Современный литературный русский язык с достойным увещательным тоном. Трёхчастное повторение μή передано повтором «не», а греческие именные обозначения пороков местами преобразованы в естественные русские глагольные конструкции.
