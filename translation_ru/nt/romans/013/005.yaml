id: ROM.13.5
reference: Romans 13:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: ru
  text: Поэтому необходимо подчиняться[a] не только из-за гнева[b], но и ради совести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быть в подчинении».'
    reason: lexical_alternative
  - marker: b
    text: 'Или по смыслу: «из-за наказания». Греческий текст буквально говорит «из-за гнева»; это может относиться к карающему действию правителя или, шире, к Божьему гневу, действующему через гражданскую власть.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод, следующий из рассуждения о властях в предыдущих стихах.
- source_word: ἀνάγκη
  choice: необходимо
  rationale: Сохраняет безличное выражение необходимости и его смысловую силу.
- source_word: ὑποτάσσεσθαι
  choice: подчиняться
  rationale: Естественно передаёт требуемое отношение к властям, не добавляя идеи безусловного повиновения во всём.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: не только ... но и
  rationale: Стандартно и ясно воспроизводит греческую соотносительную конструкцию.
- source_word: διὰ τὴν ὀργὴν
  choice: из-за гнева
  rationale: Сохраняет прямое значение ὀργή и причинный смысл διά, не уточняя, идёт ли речь о карающем действии власти или о Божьем гневе, действующем через неё.
- source_word: διὰ τὴν συνείδησιν
  choice: ради совести
  rationale: Естественная русская формулировка, обозначающая совесть как внутреннее основание подчинения; буквальное «из-за совести» звучит менее естественно.
theological_decisions:
- issue: К кому относится «гнев» (ὀργή)
  choice: Оставлено общее слово «гнев»
  alternative: наказание со стороны правителя; Божий гнев
  rationale: Ближайший контекст допускает связь как с карающим действием правителя, так и с Божьим установлением власти; сам стих прямо не называет носителя гнева.
- issue: Смысл ὑποτάσσεσθαι по отношению к властям
  choice: подчиняться
  alternative: быть в подчинении
  rationale: Выражает требуемую установку по отношению к власти, но не расширяет её до утверждения об абсолютном повиновении.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Необходимо» сохраняет силу исходного выражения, а «ради совести» звучит естественнее буквального «из-за совести».
