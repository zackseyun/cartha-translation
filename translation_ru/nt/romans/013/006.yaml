  source_fidelity: 'Текст точно передаёт логику греческого оригинала: διὰ τοῦτο γὰρ отражено словом «Поэтому», καὶ — усилительным «и», φόρους τελεῖτε — естественным «платите налоги». «Власти — служители Бога» адекватно передаёт λειτουργοὶ γὰρ θεοῦ εἰσιν в контексте Рим 13:1–5. «Постоянно занятые именно этим» передаёт длительно-продолжительный оттенок προσκαρτεροῦντες и сохранённую в εἰς αὐτὸ τοῦτο отсылку к непосредственному контексту.'
