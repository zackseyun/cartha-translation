id: ROM.13.6
reference: Romans 13:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: ru
  text: 'Поэтому вы и платите налоги: ведь власти — служители Бога, постоянно занятые именно этим.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: платите налоги
  rationale: Передаёт обычное значение выражения — уплату прямых государственных налогов — естественным современным русским языком.
- source_word: λειτουργοὶ θεοῦ
  choice: служители Бога
  rationale: Сохраняет смысл лиц, исполняющих общественное служение по отношению к Богу, не придавая слову исключительно церковного значения.
- source_word: προσκαρτεροῦντες
  choice: постоянно занятые
  rationale: Передаёт настойчивую, продолжающуюся посвящённость указанному делу без неестественного буквализма.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее εἰσιν и причастие προσκαρτεροῦντες
  choice: «власти» — служители Бога, постоянно занятые этим
  alternative: «они» — служители Бога, посвящающие себя этому
  rationale: Подлежащее восстанавливается из ближайшего контекста (начальствующие власти в ст. 3–4), а не вводит новую группу; слово «власти» делает связь ясной, не снимая утверждения об их служебной роли перед Богом.
- issue: Объём выражения εἰς αὐτὸ τοῦτο
  choice: именно этим
  alternative: ради этой самой цели
  rationale: 'Сохранена некоторая смысловая открытость: выражение может указывать как на исполнение властями своей общественной функции, так и конкретнее на дело, связанное со сбором налогов.'
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Двоеточие естественно выражает пояснительное γάρ. Исключена двусмысленность русского «они» за счёт контекстуального восстановления слова «власти».
