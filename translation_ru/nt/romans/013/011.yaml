source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: ru
  text: 'И поступайте так, зная время: уже настал час вам пробудиться ото сна[a], потому что теперь наше спасение ближе, чем тогда, когда мы уверовали[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «нам пробудиться» вместо «вам пробудиться».'
    reason: textual_variant
  - marker: b
    text: 'Или: «чем тогда, когда мы впервые уверовали». В греческом тексте сказано просто: «когда мы уверовали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: И поступайте так
  rationale: Оборот отсылает к предшествующим нравственным наставлениям; по-русски естественно восполнить подразумеваемое действие, не добавляя нового содержания.
- source_word: εἰδότες τὸν καιρόν
  choice: понимая, какое ныне время
  rationale: Причастие сохраняется деепричастным оборотом, а καιρός передаётся не просто как хронологическое время, но как значимый, решающий момент.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: уже настал час вам
  rationale: Передаёт срочность ἤδη и образную силу ὥρα; второе лицо множественного числа соответствует основному тексту SBLGNT.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: пробудиться от сна
  rationale: Сохраняет метафору и звучит естественно в современном литературном русском языке.
- source_word: νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: потому что теперь наше спасение ближе
  rationale: γάρ выражает основание призыва, а формулировка сохраняет представление о спасении как принадлежащем верующим и одновременно приближающемся.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: чем тогда, когда мы уверовали
  rationale: Не добавляется отсутствующее в греческом слово «впервые»; аорист передан естественным русским совершенным видом.
theological_decisions:
- issue: Спасение названо более близким, чем в момент уверования
  choice: «наше спасение» без дополнительного уточнения
  alternative: «окончательное спасение» или «полнота спасения»
  rationale: Так сохраняется эсхатологическое напряжение между уже обретённым отношением к спасению и его ещё предстоящим осуществлением, без навязывания конкретной догматической схемы.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием; синтаксис сделан ясным для обычного читателя, при этом сохранены метафора сна, срочность часа и богословская неоднозначность слова «спасение».
