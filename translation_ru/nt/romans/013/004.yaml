source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: ru
  text: 'Ведь она — Божья служительница тебе во благо. Но если делаешь зло, бойся: она не напрасно[a] носит меч. Ведь она — Божья служительница, воздающая гневом тому, кто творит зло.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понапрасну».'
    reason: lexical_alternative
  - marker: b
    text: Выражение может подразумевать, что власть осуществляет Божий гнев, однако слово «Божий» в этой части греческого текста прямо не повторено.
    reason: theological_ambiguity
lexical_decisions:
- source_word: διάκονός
  choice: служительница
  rationale: Слово обозначает того, кто служит или исполняет поручение. Женский род обусловлен подразумеваемым словом ἐξουσία («власть») из контекста; «служительница» сохраняет идею подчинённого Богу служения без узкоцерковного оттенка.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: тебе во благо
  rationale: Передаёт значение пользы и цели, сохраняя обращение во втором лице единственного числа.
- source_word: τὸ κακὸν ποιῇς
  choice: делаешь зло
  rationale: Естественно передаёт нравственный смысл κακόν и условный характер высказывания.
- source_word: φοβοῦ
  choice: бойся
  rationale: Прямой и естественный русский императив, соответствующий греческой форме.
- source_word: εἰκῇ
  choice: напрасно
  rationale: Передаёт отсутствие основания или цели; возможный оттенок «без причины» отмечен в сноске.
- source_word: τὴν μάχαιραν φορεῖ
  choice: носит меч
  rationale: Сохраняет конкретный образ меча и значение постоянного обладания им как знаком карательной власти.
- source_word: ἔκδικος
  choice: исполнительница возмездия
  rationale: Передаёт не личную мстительность, а функцию осуществления справедливого воздаяния.
- source_word: εἰς ὀργὴν
  choice: несущая гнев
  rationale: Сохраняет упоминание гнева, не добавляя в основной текст отсутствующее в этой фразе определение «Божий».
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: на того, кто творит зло
  rationale: Субстантивированное причастие описывает человека по его продолжающейся или характерной деятельности; «творит зло» передаёт этот оттенок.
- source_word: γὰρ
  choice: ведь
  rationale: «Ведь» естественно выражает пояснительно-обосновывающую связь в рассуждении Павла.
theological_decisions:
- issue: Связь карательной роли власти с гневом
  choice: «несущая гнев» без уточнения, чей именно это гнев
  alternative: «исполняющая Божий гнев» или «карающая»
  rationale: Контекст связывает власть с Божьим служением, но в самой фразе εἰς ὀργὴν слово «Божий» не повторено. Формулировка сохраняет эту связь и одновременно не устраняет неоднозначность греческого текста.
- issue: Характер возмездия, выраженного словом ἔκδικος
  choice: «исполнительница возмездия»
  alternative: «мстительница»
  rationale: Выбранный вариант сохраняет карательно-судебный смысл, не создавая впечатления личной или пристрастной мести со стороны власти.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным звучанием. Синтаксис сохраняет повтор «Божья служительница», важный для аргументации Павла. Метафора меча оставлена без поясняющей конкретизации.
