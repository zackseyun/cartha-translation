  source_fidelity: 'Начальная часть точно передаёт греческий текст: повтор «Божья служительница», личное «тебе во благо», условие «если делаешь зло», повеление «бойся» и конкретный образ меча сохранены. В заключительной части «несущая гнев на» звучит так, будто власть просто переносит гнев, тогда как ἔκδικος εἰς ὀργὴν обозначает её карательно-воздающую функцию по отношению к делающему зло. Формулировка «воздающая гневом тому» лучше выражает эту конструкцию, не уточняя, чей именно гнев имеется в виду.'
  naturalness: «Исполнительница возмездия, несущая гнев на того» тяжеловесно и не вполне естественно для современного литературного русского. «Воздающая гневом тому, кто творит зло» компактнее, синтаксически яснее и сохраняет возвышенно-нейтральный регистр.
  terminology: «Божья служительница» уместно передаёт διάκονος применительно к подразумеваемой власти (ἐξουσία). «Меч» и «напрасно» сохранены. «Воздающая гневом» передаёт ἔκδικος εἰς ὀργὴν без конфессионального истолкования и без неестественного буквального образа «несущая гнев».
