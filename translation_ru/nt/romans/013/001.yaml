  - severity: low
    issue: «Поставлены Богом» по отношению к властям
    rationale: Глагол допустим, но может преимущественно восприниматься как назначение отдельных должностных лиц. «Установлены Богом» естественно охватывает как носителей, так и сами существующие властные порядки и хорошо передаёт τεταγμέναι.
