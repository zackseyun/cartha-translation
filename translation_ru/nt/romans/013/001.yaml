  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: ru
  text: Пусть каждый человек подчиняется властям, стоящим над ним[a], ибо нет власти, которая не была бы от Бога, а существующие власти установлены Богом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высшим властям»; или: «властям, занимающим более высокое положение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «назначены Богом»; или: «приведены Богом в установленный порядок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: каждый человек
  rationale: Буквально «всякая душа», но в данном идиоматическом употреблении ψυχή обозначает человека. Перевод сохраняет распределительное значение πᾶσα и не создаёт ложного впечатления, будто речь идёт о душе как отдельной части человека.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: стоящим над ним властям
  rationale: ἐξουσία означает власть или носителей власти, а ὑπερέχω — положение выше других. Такая формулировка естественно передаёт властные отношения и не сужает выражение до какого-либо одного государственного учреждения.
- source_word: ὑποτασσέσθω
  choice: пусть … подчиняется
  rationale: Настоящее повелительное наклонение выражает требование находиться в упорядоченном подчинении. «Подчиняется» передаёт средне-пассивную форму без усиления до идеи безусловного одобрения любых действий властей.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: потому что нет власти не от Бога
  rationale: Русская конструкция «нет … не от» естественно передаёт исключительное εἰ μή, а «от Бога» обозначает источник власти, не уточняя сверх текста характер Божьего действия.
- source_word: αἱ δὲ οὖσαι
  choice: существующие власти
  rationale: Женский род множественного числа отсылает к ἐξουσίαις. Повтор слова «власти» делает референт ясным по-русски.
- source_word: τεταγμέναι
  choice: поставлены
  rationale: Перфект страдательного залога от τάσσω указывает на сохраняющееся состояние, возникшее вследствие Божьего упорядочивающего действия. «Поставлены» передаёт назначение и расположение в определённом порядке, не утверждая нравственного одобрения каждого поступка правителей.
theological_decisions:
- issue: Объём утверждения о властях и Боге
  choice: Стих говорит как о реальных властях, так и о происхождении и упорядоченности власти от Бога, но перевод не расширяет это до безусловного Божьего одобрения каждого режима или каждого действия правителя.
  alternative: Понимать слова либо как положительное одобрение Богом всякого режима и всякого его действия, либо только как отвлечённое утверждение о принципе власти без отнесения к существующим властям.
  rationale: Греческий текст конкретно упоминает «существующие» власти и употребляет τεταγμέναι, но сам по себе не говорит, что все их действия нравственно одобрены Богом. Формулировка сохраняет это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достойным, общедоступным звучанием. Избегаются архаичное «всякая душа» и устаревшее «властям предержащим». Повтор «власти» выбран ради ясности связи αἱ δὲ οὖσαι с предшествующим существительным.
