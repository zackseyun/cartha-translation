  source_fidelity: 'Основной смысл передан верно: πᾶσα ψυχή относится к каждому человеку; ἐξουσίαις ὑπερεχούσαις — к властям, занимающим высшее положение; τεταγμέναι выражает их установленное Богом состояние. Однако «нет власти не от Бога» хотя и встречается в библейской традиции, в современном русском из-за двойного отрицания менее прозрачно передаёт исключительное εἰ μή. Формулировка с относительным придаточным сохраняет исходный смысл яснее.'
  naturalness: «Властям, стоящим над ним» естественно и понятно в современном литературном русском. «Ибо нет власти, которая не была бы от Бога» устраняет потенциально тяжёлое восприятие двойного отрицания. «Установлены Богом» несколько естественнее по отношению к институтам власти, чем «поставлены Богом», при этом не снимает оттенок божественного упорядочения.
  terminology: «Власти» — удачный нейтральный эквивалент ἐξουσίαι. «Подчиняется» адекватно передаёт ὑποτασσέσθω, не добавляя утверждения о нравственном одобрении всех поступков власти. «Установлены» для τεταγμέναι сохраняет мысль об установленном/упорядоченном положении без конфессионального истолкования.
  issues:
