source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: ru
  text: Поэтому тот, кто противится власти, выступает против Божьего установления; а выступившие против навлекут на себя суд[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получат суд». Слово «суд» может также означать «осуждение» или «приговор», однако греческий текст не требует понимать его здесь как окончательное осуждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Поэтому
  rationale: Передаёт вывод из предыдущего стиха естественным для современного русского языка союзным наречием.
- source_word: ὁ ἀντιτασσόμενος
  choice: тот, кто противится
  rationale: Субстантивированное причастие настоящего времени обозначает всякого, кто занимает позицию сопротивления; формулировка сохраняет обобщённый характер.
- source_word: τῇ ἐξουσίᾳ
  choice: власти
  rationale: Сохраняет единственное число и опирается на непосредственный контекст Рим 13:1, где речь идёт о правящих властях.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: против установленного Богом
  rationale: διαταγή здесь указывает на установленный Богом порядок. Субстантивированное «установленное» естественно по-русски и не превращает выражение в конкретный письменный указ.
- source_word: ἀνθέστηκεν
  choice: восстаёт против
  rationale: Передаёт решительное противостояние и сохраняет смысловую связь с первым глаголом; русский вид в обобщающем утверждении звучит естественнее буквального перфекта.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: а восставшие
  rationale: Причастная форма кратко обозначает тех, кто уже занял позицию противостояния; «а» передаёт продолжение с оттенком следствия, не усиливая противопоставление.
- source_word: ἑαυτοῖς
  choice: на себя
  rationale: Рефлексивный дательный показывает, что последствие обращается на самих противящихся.
- source_word: κρίμα
  choice: суд
  rationale: Сохраняет широту греческого слова и не утверждает без необходимости окончательное осуждение.
- source_word: λήμψονται
  choice: навлекут
  rationale: В сочетании «навлекут на себя суд» естественно передаёт получение неблагоприятного последствия и рефлексивный оттенок конструкции.
theological_decisions:
- issue: Объём значения κρίμα
  choice: суд
  alternative: осуждение; приговор
  rationale: Греческое слово допускает более сильные варианты, но сам стих не уточняет, что речь непременно идёт об окончательном осуждении.
- issue: К чему относится ἐξουσία
  choice: власть, понимаемая в контексте как правящая власть
  alternative: власть в широком, отвлечённом смысле
  rationale: Непосредственный контекст Рим 13:1 говорит о правящих властях, однако в тексте сохранено общее слово «власть», без лишнего поясняющего добавления.
- issue: Смысл τῇ τοῦ θεοῦ διαταγῇ
  choice: установленное Богом
  alternative: Божье установление; Божье постановление
  rationale: Выбранный вариант указывает на Божье устроение порядка власти, не утверждая, что любое отдельное действие властителя является особым Божьим повелением.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный без архаизмов. Смысловая пара «противится — восстаёт» передаёт повтор греческого корня без тяжеловесной буквальности. Маркер сноски помещён после предложения, к слову «суд».
