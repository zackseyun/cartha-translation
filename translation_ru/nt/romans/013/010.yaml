id: ROM.13.10
reference: Romans 13:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: ru
  text: Любовь не причиняет ближнему зла[a]; итак, любовь — исполнение закона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не делает ближнему зла».'
    reason: Лексико-синтаксический вариант для κακὸν οὐκ ἐργάζεται.
  - marker: b
    text: 'Или: «полнота закона».'
    reason: Более буквальный лексический вариант для πλήρωμα.
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: любовь
  rationale: Естественный современный эквивалент, сохраняющий повтор ключевого слова в обеих частях стиха.
- source_word: τῷ πλησίον
  choice: ближнему
  rationale: Дательный падеж обозначает человека, которого затрагивает действие; «ближнему» естественно передаёт обобщённый этический смысл.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: не причиняет … зла
  rationale: Сочетание означает, что любовь не совершает и не производит зла в отношении другого человека. Формулировка сохраняет слово «зло» и при этом звучит естественно по-русски.
- source_word: πλήρωμα
  choice: исполнение
  rationale: В данном рассуждении слово указывает на то, что осуществляет требования закона и приводит их к полноте; «исполнение» ясно передаёт эту мысль, не превращая именную конструкцию в глагольную.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод, который Павел делает из предыдущего утверждения.
- source_word: νόμου
  choice: закона
  rationale: Контекст указывает на закон как известную читателям категорию; русская форма без дополнительного уточнения естественна и не сужает значение сверх контекста.
theological_decisions:
- issue: Отношение любви к закону
  choice: любовь — исполнение закона
  alternative: любовь — полнота закона; любовь исполняет закон
  rationale: Именная конструкция греческого текста сохранена. Она выражает богословское утверждение Павла, но не уточняет сверх текста, каким именно образом любовь осуществляет или завершает требования закона.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура оригинала сохранена. Лексика общеупотребительная и достойная по регистру, без конфессионально окрашенных уточнений.
