id: ROM.12.3
reference: Romans 12:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: ru
  text: 'Ибо по данной мне благодати я говорю каждому из вас: не думайте о себе выше, чем следует думать, но мыслите здраво[a], сообразно мере веры, которую Бог уделил каждому[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но мыслите так, чтобы быть рассудительными».'
    reason: Греческое выражение подчёркивает здравомыслие, трезвую рассудительность и самообладание; в нём также звучит игра однокоренных слов, которую невозможно полностью воспроизвести по-русски.
  - marker: b
    text: 'Возможны также переводы: «мере доверия», «мере верности» или «той мере веры». Греческое выражение указывает на данную Богом меру, связанную с верой, не уточняя точного оттенка.'
    reason: Конструкция μέτρον πίστεως допускает несколько смысловых связей и не определяет однозначно значение πίστις в данном контексте.
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: по данной мне благодати
  rationale: Передаёт διά с родительным как основание и полномочие речи Павла, не разворачивая явно апостольский смысл.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: каждому из вас
  rationale: Естественно передаёт распределительное παντί и принадлежность адресатов к общине.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: не думайте о себе выше, чем следует думать
  rationale: Сохраняет значение завышенной самооценки и повтор корня, соответствующий игре слов φρονέω.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: но судите о себе здраво
  rationale: Естественно выражает трезвость, рассудительность и самообладание, заключённые в σωφρονεῖν; объект «о себе» восстанавливается из контраста с завышенной самооценкой.
- source_word: ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν
  choice: которую Бог уделил каждому
  rationale: «Уделил» передаёт распределительный смысл μερίζω; относительная конструкция делает русскую фразу плавной.
- source_word: μέτρον πίστεως
  choice: мере веры
  rationale: Сохраняет широкий смысл выражения, не уточняя, идёт ли речь о степени веры, мере служения или ином данном Богом соотношении.
- source_word: πίστεως
  choice: веры
  rationale: Основное значение πίστις уместно в контексте и сохраняет богословскую неоднозначность генитивной конструкции.
theological_decisions:
- issue: Значение μέτρον πίστεως
  choice: мера веры
  alternative: мера доверия; мера верности; вера как общая мера или мерило
  rationale: Контекст даров в 12:4–8 допускает связь со способностью или сферой служения, однако сама греческая фраза этого не конкретизирует. Перевод не отождествляет её исключительно со спасительной верой или духовным даром.
- issue: Связь ὡς с Божьим распределением
  choice: сообразно мере веры, которую Бог уделил каждому
  alternative: поскольку Бог уделил каждому меру веры
  rationale: «Сообразно» естественно передаёт нормативное или сравнительное значение ὡς в призыве к здравой самооценке, сохраняя Бога как того, кто распределяет меру.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Императив во множественном числе согласован с русским обращением «каждому из вас» и избегает тяжеловесной цепочки инфинитивов. Повтор «думать» частично сохраняет греческую игру слов; «судите о себе здраво» обеспечивает естественность и ясность.
