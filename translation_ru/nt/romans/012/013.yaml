lexical_decisions:
- source_word: χρείαις
  choice: нуждах
  rationale: Слово обозначает практические нужды и жизненные потребности; «нужды» естественно звучит по-русски и не ограничивает помощь только деньгами.
- source_word: ἁγίων
  choice: святых
  rationale: В посланиях Павла это обычное обозначение всех верующих как освящённого Божьего народа, а не особой позднейшей категории канонизированных лиц.
- source_word: κοινωνοῦντες
  choice: участвуйте
  rationale: Глагол выражает участие, общность и содействие. В сочетании с «нуждами» речь идёт о деятельном участии в их восполнении; перевод сохраняет более широкий смысл, чем одно лишь денежное пожертвование.
- source_word: φιλοξενίαν
  choice: оказывать гостеприимство
  rationale: Это естественное русское обозначение радушного приёма, при этом примечание сохраняет присущий греческому слову акцент на принятии незнакомых и чужеземцев.
- source_word: διώκοντες
  choice: ревностно стремитесь
  rationale: Глагол буквально передаёт настойчивое преследование цели. Такой перевод сохраняет его деятельную направленность и силу лучше, чем более слабое «практикуйте».
theological_decisions:
- issue: Кого обозначают «святые»
  choice: всех верующих, святой Божий народ
  alternative: канонизированные святые в позднейшем церковном смысле
  rationale: В данном контексте и в обычном словоупотреблении Павла οἱ ἅγιοι — христиане как община Божьего народа. Традиционный эквивалент «святые» сохраняет богословски значимое наименование, не подменяя его толкованием.
- issue: Характер участия в нуждах
  choice: деятельное участие в восполнении нужд, не сведённое исключительно к деньгам
  alternative: только материальные или денежные пожертвования
  rationale: κοινωνέω допускает значение содействия и пожертвования, но шире выражает участие и общность; перевод не сужает наставление без необходимости.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной формой. Сохранён традиционный павловский термин «святые»; слегка книжное «участвуйте в нуждах» передаёт лексическую широту κοινωνέω, а «ревностно стремитесь» воспроизводит усиленную, целенаправленную силу διώκω.
