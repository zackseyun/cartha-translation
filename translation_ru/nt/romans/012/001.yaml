reference: Romans 12:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: ru
  text: Итак, братья[a], призываю вас, ввиду милостей Божьих, представить ваши тела как живую, святую и угодную Богу жертву — ваше разумное служение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; в греческом стоит слово «братья», которое нередко служит обращением к группе, включающей и мужчин, и женщин.
    reason: alternative_reading
  - marker: b
    text: Или «духовное поклонение» или «разумное служение»; греческое выражение может обозначать разумное, подобающее или духовное служение Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: призываю
  rationale: Передаёт настойчивое апостольское увещание естественным современным русским языком, без архаического оттенка слова «умоляю».
- source_word: οὖν
  choice: итак
  rationale: Сохраняет вывод из предшествующего рассуждения в Римлянам 1–11 и естественно открывает увещательную часть.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму греческого обращения; вероятное включение женщин в адресованную общину поясняется в сноске.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: по милосердию Божьему
  rationale: Передаёт основание призыва и собирательный смысл греческого множественного οἰκτιρμῶν; буквальное «по милостям» в современном русском звучит неестественно.
- source_word: παραστῆσαι
  choice: представить
  rationale: Сохраняет значение посвящения и предоставления Богу, а также связь с жертвенной образностью.
- source_word: τὰ σώματα ὑμῶν
  choice: ваши тела
  rationale: Следует конкретному греческому слову σώματα, не заменяя его более широким толкованием «самих себя».
- source_word: θυσίαν ζῶσαν
  choice: как живую жертву
  rationale: Естественно оформляет именную группу при глаголе «представить» и сохраняет парадоксальный образ живой жертвы.
- source_word: ἁγίαν
  choice: святую
  rationale: Стандартно и ёмко передаёт посвящённость жертвы Богу.
- source_word: εὐάρεστον τῷ θεῷ
  choice: угодную Богу
  rationale: Естественное русское соответствие со значением того, что приятно и приемлемо для Бога.
- source_word: λογικὴν
  choice: разумное
  rationale: Сохраняет связь с разумностью, осмысленностью и подобающим характером служения, не сводя спорное слово исключительно к значению «духовное».
- source_word: λατρείαν
  choice: служение
  rationale: Передаёт обращённое к Богу культовое служение и хорошо сочетается с жертвенной образностью; значение поклонения отражено в сноске.
theological_decisions:
- issue: Обращение ἀδελφοί к общине смешанного состава
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет форму источника, а сноска сообщает о том, что в данном контексте обращение, вероятно, охватывает всю общину.
- issue: Значение λογικὴν λατρείαν
  choice: разумное служение
  alternative: духовное поклонение; осмысленное богослужение
  rationale: Греческое выражение допускает оттенки разумного, подобающего или духовного служения. Основной вариант близок к форме источника, а сноска сохраняет существенные альтернативы и не снимает неоднозначность.
- issue: Связь заключительной фразы с принесением тел в жертву
  choice: как ваше разумное служение
  alternative: это и есть ваше разумное служение
  rationale: Добавленное «как» ясно показывает приложение к предшествующему действию, не превращая фразу в отдельное догматическое определение.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского увещания. Синтаксис сохраняет ход греческой фразы, но разгружен тире; архаизмы и конфессионально маркированные термины избегаются.
