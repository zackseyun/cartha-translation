  verdict: revise
  source_fidelity: 'В целом смысл передан точно: сохранены выводное «итак», увещательный характер παρακαλῶ, буквальные «тела», жертвенная образность и определения жертвы. Однако «по милосердию Божьему» несколько размывает основание увещания и скрывает множественное число οἰκτιρμῶν; «ввиду милостей Божьих» точнее передаёт этот оборот. Повтор «как» перед заключительной фразой неудачно оформляет её как приложение.'
  naturalness: Основной текст понятен, но сочетание «как живую жертву — святую, угодную Богу, — как ваше разумное служение» синтаксически тяжеловесно и содержит неоправданный повтор. Перестройка определений и заключительное тире создают естественную современную литературную фразу.
  terminology: «Братья», «тела», «живая жертва», «святая», «угодная Богу» и «разумное служение» уместны и сохраняют терминологические и образные связи оригинала. Сноска к λογικήν λατρείαν должна включать близкую альтернативу «разумное служение» и не выдавать «богослужение» за нейтральный эквивалент, поскольку оно может сузить смысл до церковного обряда.
