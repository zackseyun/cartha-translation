  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: ru
  text: так и мы, хотя нас много, — одно тело в Мессии[a], а по отдельности — члены друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе». Греческий титул Χριστός можно передать обоими способами; здесь выбрано слово «Мессия», чтобы сохранить его титульный смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: так и
  rationale: Связывает вывод со сравнением о теле и его членах в предыдущем стихе; по-русски естественно передаёт сопоставительно-выводное значение.
- source_word: οἱ πολλοὶ
  choice: мы, хотя нас много
  rationale: Артиклированное выражение обозначает множество участников, а форма ἐσμεν прямо задаёт первое лицо; оборот сохраняет единство при множественности.
- source_word: ἓν σῶμά
  choice: одно тело
  rationale: Прямо и ясно сохраняет телесную метафору и акцент на единстве.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Передаёт Χριστός как титул и сохраняет характерное для Павла выражение единения с Мессией.
- source_word: τὸ δὲ καθ’ εἷς
  choice: а каждый в отдельности
  rationale: Передаёт распределительное значение идиомы «что касается каждого по одному»; δέ обозначает переход от общего единства к отдельным людям.
- source_word: ἀλλήλων
  choice: друг друга
  rationale: Естественно передаёт взаимное отношение, выраженное взаимным местоимением в родительном падеже.
- source_word: μέλη
  choice: члены
  rationale: Сохраняет части тела в метафоре и одновременно естественно обозначает участников единого целого.
theological_decisions:
- issue: Передача Χριστῷ в выражении ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Греческое Χριστός остаётся титулом «Мессия»; выбранный вариант раскрывает титульный смысл, не устраняя богословскую идею единения, выраженную предлогом ἐν. Традиционный русский вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Тире помогают прочитать именные сказуемые и не добавляют нового смыслового содержания.
