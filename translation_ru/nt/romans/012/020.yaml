base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: ru
  text: Но если твой враг голоден, накорми его; если он хочет пить, напои его; ведь, поступая так, ты нагребёшь ему на голову горящие угли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «угли огня». Этот образ может указывать на стыд, ведущий к раскаянию, на мучительное нравственное обличение или на грядущий суд; в основном тексте греческая метафора сохранена без истолкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Но если
  rationale: ἀλλά противопоставляет это повеление предшествующему запрету мстить, а ἐάν вводит условие; «но если» естественно передаёт обе функции.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: твой враг голоден
  rationale: Сохранены единственное число и личное обращение; именная конструкция естественна для современного русского языка.
- source_word: ψώμιζε αὐτόν
  choice: накорми его
  rationale: Императив ψώμιζε означает давать пищу; «накорми» кратко и ясно передаёт конкретное действие.
- source_word: ἐὰν διψᾷ
  choice: если он хочет пить
  rationale: Идиоматическое русское выражение точно передаёт состояние жажды, не добавляя указания на конкретный напиток.
- source_word: πότιζε αὐτόν
  choice: дай ему напиться
  rationale: ποτίζω означает давать пить; выбранная формулировка естественна по-русски и не сужает смысл до воды.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Ведь, поступая так
  rationale: Передаёт пояснительную силу γάρ и обстоятельственное значение причастного оборота.
- source_word: ἄνθρακας πυρὸς
  choice: горящие угли
  rationale: Буквальное «угли огня» по-русски звучит неестественно; «горящие угли» сохраняет конкретный огненный образ.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: ты соберёшь ему на голову
  rationale: «Соберёшь» передаёт накопление или нагромождение, выраженное σωρεύσεις, а конструкция «ему на голову» естественно сохраняет образ и личную направленность действия.
theological_decisions:
- issue: Смысл метафоры о горящих углях на голове врага
  choice: Сохранить метафору без истолкования в основном тексте.
  alternative: Передать её как стыд, ведущий к раскаянию, мучительное нравственное обличение или грядущий суд.
  rationale: Образ допускает несколько толкований, и сам греческий текст их не разграничивает. Прямое воспроизведение метафоры сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным, прямым и достойным звучанием. Единственное число и обращение на «ты» сохранены. Точка между двумя смысловыми частями облегчает чтение, не меняя логической связи, выраженной γάρ.
