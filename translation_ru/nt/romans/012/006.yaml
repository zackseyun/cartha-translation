  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: ru
  text: 'И, имея различные дары по данной нам благодати: если кому-то дано пророчество, пусть пророчествует сообразно вере[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соразмерно своей вере»; возможный вариант: «в согласии с верой». Греческое выражение может указывать либо на меру веры пророчествующего, либо на соответствие пророчества содержанию христианской веры.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: И, имея
  rationale: Причастная конструкция продолжает мысль предыдущего стиха; союз δέ здесь обозначает мягкий переход, естественно передаваемый как «и».
- source_word: χαρίσματα ... διάφορα
  choice: различные дары
  rationale: Сохраняет обычное для Павла значение χάρισμα и ясно выражает разнообразие даров.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: по данной нам благодати
  rationale: Кратко передаёт соответствие даров данной Богом благодати, не сводя χάρις к общему понятию благосклонности.
- source_word: εἴτε προφητείαν
  choice: если это пророчество
  rationale: Восполняет эллиптическую греческую конструкцию ровно настолько, насколько требуется для естественного русского синтаксиса.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: сообразно вере
  rationale: Передаёт идею соответствия или соразмерности, не определяя в основном тексте, идёт ли речь о мере личной веры или о согласии с содержанием веры.
theological_decisions:
- issue: Значение κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: сообразно вере
  alternative: соразмерно своей вере; в согласии с верой
  rationale: Греческая формулировка допускает как указание на меру веры пророчествующего, так и на соответствие пророчества христианской вере. Основной текст сохраняет эту неоднозначность, а варианты поясняются в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет достоинство апостольского наставления и его эллиптическую последовательность, но слегка восполняет синтаксис ради ясности.
