id: ROM.12.8
reference: Romans 12:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: ru
  text: кто увещевает — пусть увещевает[a]; кто делится[b] — с щедростью[c]; кто руководит[d] — с усердием[e]; кто оказывает милость — с радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто ободряет — пусть ободряет». Греческие однокоренные слова παρακαλέω и παράκλησις могут обозначать как увещевание, так и ободрение. Буквально вторая часть: «в увещевании».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто даёт»; «кто жертвует».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «с искренностью»; «в простоте». Греческое ἁπλότης может выражать простоту и цельность намерения либо щедрость; здесь последнее значение наиболее вероятно по контексту.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «кто управляет»; «кто заботится о других».'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «со рвением»; «со всей серьёзностью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ παρακαλῶν … ἐν τῇ παρακλήσει
  choice: кто увещевает — пусть увещевает
  rationale: Передаёт однокоренной повтор и эллиптическое побуждение Павла естественным современным русским языком. Глагол может также означать ободрение, что отмечено в сноске.
- source_word: ὁ μεταδιδοὺς
  choice: кто делится
  rationale: Передаёт участие другого в собственных средствах или имуществе, не сужая значение до формального пожертвования.
- source_word: ἐν ἁπλότητι
  choice: с щедростью
  rationale: При глаголе, обозначающем передачу средств другим, контекстуально наиболее вероятно значение щедрости; возможный оттенок простоты и искренности сохранён в сноске.
- source_word: ὁ προϊστάμενος
  choice: кто руководит
  rationale: Широкое обозначение руководства или попечения без превращения причастия в название определённой церковной должности.
- source_word: ἐν σπουδῇ
  choice: с усердием
  rationale: Естественно передаёт деятельную старательность и серьёзность; близкий оттенок рвения отмечен в сноске.
- source_word: ὁ ἐλεῶν
  choice: кто оказывает милость
  rationale: 'Сохраняет активный характер причастия: речь идёт не только о внутреннем сочувствии, но и о милосердном поступке.'
- source_word: ἐν ἱλαρότητι
  choice: с радостью
  rationale: Передаёт радостную готовность, с которой следует оказывать милость, современно и без разговорной окраски.
theological_decisions:
- issue: Характер выражения ὁ προϊστάμενος
  choice: Общее «кто руководит»
  alternative: «предстоятель», «начальствующий» или указание на конкретную церковную должность
  rationale: В греческом тексте употреблено широкое причастие без названия должности; перевод не вводит определённую модель церковного управления.
- issue: Значение ἁπλότης при передаче средств
  choice: «с щедростью»
  alternative: «с искренностью» или «в простоте»
  rationale: Связь с μεταδίδωμι делает значение щедрости наиболее вероятным, однако лексическая многозначность не устраняется и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным перечислением. Повтор «увещевает — пусть увещевает» намеренно сохраняет однокоренную конструкцию оригинала, но делает греческий эллипсис понятным по-русски. Термины не привязаны к какой-либо конфессиональной системе должностей.
