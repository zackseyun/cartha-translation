base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: ru
  text: Пусть любовь будет нелицемерной[a]. Отвращайтесь от зла, держитесь добра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть любовь будет искренней». Буквально: «Любовь без лицемерия».'
    reason: Лексическая альтернатива и пояснение безглагольной греческой конструкции.
lexical_decisions:
- source_word: ἀγάπη
  choice: любовь
  rationale: Естественный современный эквивалент, сохраняющий нравственный и межличностный смысл слова.
- source_word: ἀνυπόκριτος
  choice: нелицемерной
  rationale: Передаёт буквальный смысл — любовь без притворства и лицемерия; согласование обусловлено добавленной связкой «да будет».
- source_word: ἀποστυγοῦντες
  choice: отвращайтесь
  rationale: Выражает сильное нравственное неприятие и звучит естественно как увещевание; контекст придаёт причастию побудительную силу.
- source_word: τὸ πονηρόν
  choice: зла
  rationale: Субстантивированное прилагательное обозначает зло как широкую нравственную категорию; родительный падеж требуется глаголом «отвращаться».
- source_word: κολλώμενοι
  choice: держитесь
  rationale: Передаёт настойчивую приверженность, заключённую в образе тесного соединения, и естественно звучит по-русски.
- source_word: τῷ ἀγαθῷ
  choice: добра
  rationale: Субстантивированное прилагательное сохранено как широкая нравственная категория и образует ясную параллель со «злом».
theological_decisions:
- issue: Побудительная сила безглагольной первой фразы и причастий
  choice: 'Передать стих как ряд увещеваний: «да будет… Отвращайтесь… держитесь…»'
  alternative: «Любовь нелицемерна, отвращающиеся от зла, держащиеся добра» или фрагментарное «Любовь без лицемерия; отвращаясь…»
  rationale: В контексте Рим 12 эти формы входят в последовательность нравственных наставлений. Побудительная передача делает функцию текста ясной, не устраняя краткость и напряжённость греческого выражения.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный и доступный стиль. Сохранена риторическая параллель «зло — добро» и сильная увещевательная интонация.
