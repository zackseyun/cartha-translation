reference: Romans 12:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: ru
  text: Будьте единомысленны друг с другом; не помышляйте о высоком[a], но сближайтесь с людьми скромного положения[b]. Не становитесь мудрыми в собственных глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будьте высокомерны»; возможно также: «не стремитесь к высокому положению».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «держитесь смиренных». Греческое выражение может относиться как к людям незнатным или смиренным, так и к скромным делам или обстоятельствам.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Будьте единомысленны друг с другом
  rationale: Греческий оборот выражает взаимную согласованность настроя и стремление к согласию в общине, а не обязательное совпадение всех мнений. Формулировка естественна для современного литературного русского языка.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: не помышляйте о высоком
  rationale: Передаёт образ греческого выражения «не мыслить о высоком» и не сужает его ни исключительно до гордости, ни исключительно до стремления к высокому положению.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: но сближайтесь с людьми скромного положения
  rationale: В данном общественном контексте συναπαγόμενοι естественно передаётся как добровольное общение и сближение, а τοῖς ταπεινοῖς — как люди невысокого положения. Возможное отнесение выражения к непритязательным делам сохранено в сноске.
- source_word: μὴ γίνεσθε
  choice: Не становитесь
  rationale: 'Сохраняет процессуальный оттенок γίνομαι: предостережение не усваивать такой образ мыслей.'
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: мудрыми в собственных глазах
  rationale: Русский идиоматический оборот точно выражает самодовольную уверенность в собственной мудрости.
theological_decisions:
- issue: Соотношение τὰ ὑψηλά и τοῖς ταπεινοῖς в увещании к смирению
  choice: Основной текст сочетает запрет устремляться к «высокому» со сближением с людьми скромного общественного положения.
  alternative: «Не будьте высокомерны, но держитесь скромного» или «не стремитесь к высокому, но беритесь за непритязательные дела».
  rationale: Контекст взаимных отношений поддерживает социальное понимание, однако грамматическая форма допускает также отнесение τοῖς ταπεινοῖς к скромным вещам, занятиям или обстоятельствам. Сноски сохраняют обе смысловые возможности и не сводят призыв только к внутреннему настрою либо только к общественным связям.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Единомысленны» и «в собственных глазах» сохраняют достоинство стиля, оставаясь понятными; социальная формулировка в середине стиха уточняется сносками, чтобы не скрыть грамматическую неоднозначность оригинала.
