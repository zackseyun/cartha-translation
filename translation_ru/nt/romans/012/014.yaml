  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: ru
  text: Благословляйте тех, кто вас преследует[a]; благословляйте, а не проклинайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто гонится за вами». Греческий глагол может означать «гнаться, преследовать», но здесь, вероятнее всего, речь идёт о враждебном преследовании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Форма повелительного наклонения во множественном числе. «Благословляйте» естественно передаёт религиозно-нравственный смысл пожелания и призывания добра; повтор глагола сохранён ради выразительного акцента оригинала.
- source_word: τοὺς διώκοντας
  choice: тех, кто вас преследует
  rationale: 'Причастие с артиклем употреблено субстантивированно: «преследующих». В данном контексте речь, вероятнее всего, о враждебном преследовании. Местоимение «вас» не выражено отдельно в греческом тексте, но ясно подразумевается контекстом наставления и необходимо для естественного русского выражения.'
- source_word: καὶ μὴ καταρᾶσθε
  choice: а не проклинайте
  rationale: В контексте καί связывает повторённое положительное повеление с противопоставленным запретом. По-русски конструкция «а не» естественнее простого «и не» и ясно сохраняет контраст между благословением и проклятием.
theological_decisions:
- issue: Значение διώκω в контексте
  choice: Передано как враждебное преследование
  alternative: «тех, кто гонится за вами»
  rationale: Хотя διώκω может означать просто «преследовать, гнаться», в этических наставлениях Павла и в раннехристианском контексте оно часто обозначает гонение. Противопоставление благословения проклятию также указывает на враждебное отношение, однако более широкая лексическая возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, краткий и назидательный тон. Сохранены повтор «благословляйте» и повелительная форма множественного числа. «А не проклинайте» передаёт контраст естественнее для современного русского, не меняя смысла греческой связи.
