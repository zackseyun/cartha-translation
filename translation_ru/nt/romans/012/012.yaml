translation:
  language: ru
  text: Радуйтесь в надежде, будьте стойки в скорби[a], будьте постоянны в молитве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в бедствии». Греческое слово может обозначать сильное давление, тяжёлые обстоятельства, страдание или скорбь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неотступно пребывайте в молитве»; греческое слово подчёркивает постоянство и усердную преданность молитве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: в надежде
  rationale: Дательный с артиклем естественно передаётся по-русски предложным сочетанием; «надежда» сохраняет значение упования и ожидания, не уточняя объект, который в греческом тексте не назван.
- source_word: χαίροντες
  choice: радуйтесь
  rationale: Хотя в греческом стоит причастие настоящего времени, в данном ряду наставлений русское повелительное наклонение естественно передаёт его увещательный смысл и продолжающийся характер действия.
- source_word: θλίψει
  choice: в скорби
  rationale: θλῖψις обозначает давление, бедствие и страдание. «Скорбь» — ёмкое и понятное слово, сохраняющее серьёзность переживания; более широкий оттенок отмечен в сноске.
- source_word: ὑπομένοντες
  choice: будьте стойки
  rationale: ὑπομένω выражает стойкое перенесение трудностей. Такая передача естественна по-русски и не добавляет более узкого оттенка пассивного терпения.
- source_word: προσευχῇ
  choice: в молитве
  rationale: Существительное обозначает молитву как постоянную практику; артикль отдельно не воспроизводится, поскольку это было бы неестественно по-русски.
- source_word: προσκαρτεροῦντες
  choice: будьте постоянны
  rationale: προσκαρτερέω означает неотступно продолжать, усердно держаться или посвящать себя чему-либо. «Будьте постоянны» сохраняет устойчивость и длительность действия, а оттенок преданности практике указан в сноске.
