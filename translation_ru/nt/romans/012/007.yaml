  yaml_path: translation/nt/romans/012/007.yaml
  text: if service[a], in service; if the one teaching, in teaching[b];
translation:
  language: ru
  text: если тебе дано служение — служи; если учишь — учи;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε
  choice: если
  rationale: В этом кратком перечислении даров и функций εἴτε вводит очередной условный элемент; «если» естественно сохраняет параллельную и эллиптическую структуру.
- source_word: διακονίαν
  choice: служение
  rationale: διακονία обозначает служение, помощь или исполнение поручения. «Служение» сохраняет широту значения и в данном контексте не обязательно называет церковную должность.
- source_word: ἐν τῇ διακονίᾳ
  choice: пребывай в служении
  rationale: Греческий оборот предельно краток и буквально повторяет существительное с ἐν. Добавленное по смыслу «пребывай» делает наставление понятным по-русски, не сужая его содержания.
- source_word: ὁ διδάσκων
  choice: кто учит
  rationale: Субстантивированное причастие настоящего времени указывает на человека, занятого обучением; «кто учит» сохраняет функциональный, а не должностной характер выражения.
- source_word: διδασκαλίᾳ
  choice: учении
  rationale: Здесь διδασκαλία обозначает деятельность обучения. «Учение» в конструкции «в учении» передаёт греческий параллелизм, хотя по-русски возможно и более явно деятельностное «обучение».
theological_decisions:
- issue: Следует ли передавать διακονία специальным церковным термином
  choice: служение
  alternative: помощь; исполнение служения
  rationale: Текст перечисляет дары или функции и не требует понимания слова как названия формальной церковной должности. «Служение» оставляет возможным как практический, так и более широкий церковный смысл.
- issue: Следует ли понимать ὁ διδάσκων как название установленной должности
  choice: кто учит
  alternative: учитель
  rationale: Причастная форма подчёркивает совершаемое действие и сама по себе не устанавливает должностного статуса; перевод не должен вносить более развитую церковную структуру, чем выражено в тексте.
- issue: Как восполнить эллипсис ἐν τῇ διακονίᾳ и ἐν τῇ διδασκαλίᾳ
  choice: явно добавить «пребывай» только в первой части, подразумевая его во второй
  alternative: 'буквально: «если служение — в служении; если учащий — в учении»'
  rationale: Греческий текст намеренно краток, а управляющая мысль восстанавливается из контекста. Минимальное восполнение делает русский текст ясным и сохраняет ритмический эллипсис второй части, не определяя сверх текста, означает ли это усердие, сосредоточенность или постоянство.
translation_notes:
  register: Современный литературный русский, сжатый и наставительный. Сохранён параллелизм греческого перечня; один глагол восполнен из контекста ради естественности и понятности. Точка с запятой соответствует незавершённому месту внутри более длинного предложения.
