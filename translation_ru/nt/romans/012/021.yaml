  source_fidelity: '«Не будь побеждён злом, но побеждай зло добром» точно передаёт обе формы νικάω: пассивный запрет μὴ νικῶ и активное повеление νίκα. Творительный падеж («злом», «добром») естественно выражает соответственно действующую силу при пассиве и средство действия во второй части. Отвлечённые «зло» и «добро» корректно передают субстантивированные прилагательные среднего рода, не навязывая персонализацию.'
