  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: ru
  text: Не будь побеждён злом[a], но побеждай зло добром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не позволяй тому, что зло, победить тебя, но побеждай то, что зло, тем, что добро». В греческом тексте употреблены субстантивированные прилагательные среднего рода, которые могут обозначать как «зло» и «добро» вообще, так и «то, что зло» и «то, что добро».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Не будь побеждён
  rationale: Настоящее повелительное наклонение в страдательном залоге с μή выражает запрет, обращённый к одному человеку. Формулировка сохраняет образ поражения и естественно звучит по-русски.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: злом
  rationale: ὑπό с родительным обозначает действующую силу. Субстантивированное прилагательное среднего рода может означать как отвлечённое «зло», так и «то, что зло»; краткое «злом» естественно передаёт общий нравственный смысл.
- source_word: ἀλλὰ νίκα
  choice: но побеждай
  rationale: ἀλλά вводит резкое противопоставление, а νίκα — повелительное наклонение действительного залога. Повтор корня «побеждён / побеждай» сохраняет словесную перекличку греческого νικάω.
- source_word: ἐν τῷ ἀγαθῷ
  choice: добром
  rationale: 'ἐν с дательным здесь указывает на средство: зло следует побеждать посредством добра. Русский творительный «добром» выражает это кратко и естественно.'
- source_word: τὸ κακόν
  choice: зло
  rationale: Субстантивированное прилагательное среднего рода имеет общий нравственный смысл. «Зло» сохраняет лаконичную антитезу со словом «добро».
theological_decisions:
- issue: Следует ли понимать κακόν и ἀγαθόν как отвлечённые нравственные понятия или персонализировать зло
  choice: Передать как «зло» и «добро»
  alternative: «то, что зло» и «то, что добро»; для κακόν — персонализированное «злой»
  rationale: Средний род и ближайший контекст нравственного наставления естественно допускают отвлечённое или качественное значение, но не требуют видеть здесь личного носителя зла. Перевод не вносит более узкого богословского уточнения.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная антитеза и повтор «побеждён / побеждай» передают риторическую силу оригинала. Единственное число сохранено.
