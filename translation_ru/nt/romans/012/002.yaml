reference: Romans 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: ru
  text: И не подстраивайтесь под нынешний век[a], но преображайтесь через обновление вашего ума, чтобы распознавать[b], какова воля Бога — благая, угодная[c] и совершенная.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот мир». Греческое αἰών точнее означает «век», то есть нынешнюю эпоху или существующий порядок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы испытывать и одобрять». Греческий глагол может включать как проверку, так и признание испытанного достойным одобрения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «приемлемая». «Угодная» может означать «угодная Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: подстраивайтесь
  rationale: Глагол обозначает принятие внешнего образца или формы. «Подстраивайтесь под» естественно передаёт запрет позволять нынешнему веку задавать образ жизни и сохраняет противопоставление внутреннему преображению.
- source_word: αἰῶνι τούτῳ
  choice: нынешний век
  rationale: αἰών здесь обозначает нынешнюю эпоху и её порядок, а не сотворённый мир как таковой. «Нынешний век» ясно передаёт временно-нравственный смысл.
- source_word: μεταμορφοῦσθε
  choice: преображайтесь
  rationale: Глагол говорит о глубоком изменении облика или состояния. «Преображайтесь» сохраняет силу исходного слова и контраст с внешним приспособлением.
- source_word: τῇ ἀνακαινώσει
  choice: через обновление
  rationale: Дательный падеж выражает средство преображения. Оборот «через обновление» передаёт процесс и звучит естественно по-русски.
- source_word: τοῦ νοός
  choice: вашего ума
  rationale: νοῦς — способность мыслить и нравственно распознавать. Притяжательное «вашего» не выражено отдельным словом, но естественно следует из обращения к читателям во множественном числе.
- source_word: εἰς τὸ δοκιμάζειν
  choice: чтобы распознавать
  rationale: Конструкция выражает цель или результат, а δοκιμάζω включает проверку, распознавание и одобрение испытанного. «Распознавать» понятно передаёт итог действия, не представляя человека судьёй над Божьей волей; более полный оттенок отмечен в сноске.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: какова воля Бога
  rationale: Формулировка сохраняет вопросительное τί и естественно вводит последующие определения Божьей воли.
- source_word: ἀγαθὸν
  choice: благая
  rationale: Стандартное и контекстуально точное определение Божьей воли.
- source_word: εὐάρεστον
  choice: угодная
  rationale: Передаёт значение того, что доставляет довольство или одобряется; возможная подразумеваемая отнесённость к Богу и вариант «приемлемая» указаны в сноске.
- source_word: τέλειον
  choice: совершенная
  rationale: Естественно передаёт полноту и безупречность Божьей воли, не сужая значение до одной лишь зрелости.
theological_decisions:
- issue: Этический смысл αἰών
  choice: нынешний век
  alternative: этот мир; нынешний миропорядок
  rationale: Такой перевод сохраняет временно-нравственное противопоставление нынешней эпохи Божьему обновляющему действию и не превращает его в осуждение сотворённого мира.
- issue: Значение δοκιμάζειν применительно к Божьей воле
  choice: распознавать
  alternative: испытывать; испытывать и одобрять
  rationale: Обновлённый ум узнаёт Божью волю как выдерживающую проверку и достойную одобрения. Основной текст сохраняет доступность, а сноска — более широкий оценочный оттенок глагола.
- issue: Связь определений ἀγαθὸν, εὐάρεστον, τέλειον
  choice: 'приложение к «воле Бога»: «благая, угодная и совершенная»'
  alternative: «что благо, угодно и совершенно»
  rationale: Согласование по женскому роду ясно связывает три определения с Божьей волей и отражает греческое приложение, не добавляя повторного сказуемого.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Избегается архаичное «сообразуйтесь»; пара «подстраивайтесь — преображайтесь» ясно передаёт контраст внешнего уподобления и глубокого изменения. Синтаксис остаётся близким к греческому, но читается естественно.
