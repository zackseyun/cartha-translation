  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: ru
  text: Ведь как в одном теле у нас много членов[a], но не все члены выполняют одну и ту же функцию[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много частей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «одну и ту же деятельность». Греческое слово может обозначать деятельность или функцию; в образе тела и в контексте различных служений «функцию» передаёт смысл наиболее естественно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Ведь как
  rationale: Передаёт одновременно пояснительную связь γάρ с предыдущей мыслью и сравнительную силу καθάπερ; сравнение завершается в следующем стихе.
- source_word: ἐν ἑνὶ σώματι
  choice: в одном теле
  rationale: Прямо сохраняет телесный образ и единственность тела, не называя церковь раньше, чем это делает ход рассуждения.
- source_word: πολλὰ μέλη
  choice: много членов
  rationale: «Члены» — традиционное и уместное в литературном русском обозначение частей тела, которое также сохраняет возможность дальнейшего общинного применения метафоры.
- source_word: ἔχομεν
  choice: у нас много членов
  rationale: Естественная русская конструкция для греческого «имеем много членов»; смысл обладания сохранён без тяжеловесности.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: но не у всех членов
  rationale: 'Ясно передаёт область действия отрицания: речь не о том, что все члены лишены общего назначения, а о том, что их назначения различны.'
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: одно и то же назначение
  rationale: В контексте частей тела πρᾶξις обозначает выполняемую функцию или деятельность; «назначение» естественно звучит по-русски и поддерживает метафору.
theological_decisions:
- issue: Экклезиологический смысл образа тела
  choice: Сохранить простую метафору «одно тело» и «много членов», не добавляя прямого упоминания церкви.
  alternative: «В одном теле — церкви — у нас много членов».
  rationale: В этом стихе Павел формулирует первую часть сравнения, а его применение к общине следует далее. Перевод сохраняет последовательность текста и не вносит пояснение в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. «Члены» сохранено ради точности телесной метафоры; «назначение» выбрано как понятный и достойный эквивалент πρᾶξις. Конечная запятая показывает, что синтаксическое сравнение продолжается в Римлянам 12:5.
