  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: ru
  text: Радуйтесь с радующимися; плачьте с плачущими.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: Радуйтесь
  rationale: Инфинитив настоящего времени в ряду увещаний имеет повелительную силу. «Радуйтесь» естественно передаёт и призыв, и значение радости.
- source_word: μετὰ
  choice: с
  rationale: Предлог μετά с родительным падежом обозначает совместность; русское «с» точно и естественно передаёт это значение.
- source_word: χαιρόντων
  choice: радующимися
  rationale: Субстантивированное причастие настоящего времени во множественном числе передано причастием, что сохраняет лаконичность и словесный параллелизм оригинала.
- source_word: κλαίειν
  choice: плачьте
  rationale: Инфинитив употреблён как побуждение. «Плачьте» точнее, чем более широкое «скорбите», передаёт конкретный смысл κλαίω и образует ясную параллель с «радуйтесь».
- source_word: κλαιόντων
  choice: плачущими
  rationale: Субстантивированное причастие передано естественным русским причастием и сохраняет строгий параллелизм обеих частей стиха.
theological_decisions:
- issue: Повелительная сила инфинитивов в ряду увещаний
  choice: 'Передать оба инфинитива формами повелительного наклонения: «Радуйтесь…; плачьте…»'
  alternative: «Радоваться с радующимися; плакать с плачущими»
  rationale: В контексте Рим 12:9–21 инфинитивы выполняют функцию наставлений. Повелительные формы естественно передают эту функцию по-русски, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и симметричная формулировка. Причастные формы понятны обычному читателю и сохраняют тесный словесный параллелизм греческого текста.
