reference: Romans 12:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: ru
  text: 'Не мстите за себя, возлюбленные, но дайте место гневу[a], ведь написано: «Мне принадлежит возмездие; Я воздам, — говорит Господь»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставьте место гневу»; судя по следующей цитате, вероятнее всего, имеется в виду Божий гнев.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «Мне отмщение, Я воздам».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Не мстите за себя
  rationale: Передаёт запретительное значение причастия с μή и сохраняет возвратный смысл ἑαυτούς; по-русски звучит естественно и ясно.
- source_word: ἀγαπητοί
  choice: возлюбленные
  rationale: Сохраняет сердечное обращение и его богословскую теплоту, оставаясь в dignified библейском регистре.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: но дайте место гневу
  rationale: Близко передаёт греческую идиому и не добавляет прямо слово «Божьему», которого нет в исходном тексте; вероятный смысл пояснён в сноске.
- source_word: γέγραπται γάρ
  choice: ведь написано
  rationale: Естественно передаёт устойчивую формулу введения цитаты из Писания и причинную связь γάρ.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Мне принадлежит возмездие
  rationale: Передаёт выраженное дательным местоимением обладание и сохраняет судебный оттенок ἐκδίκησις; традиционный вариант отмечен в сноске.
- source_word: ἐγὼ ἀνταποδώσω
  choice: Я воздам
  rationale: Краткий, точный и укоренённый в русском библейском языке эквивалент обещанного справедливого воздаяния.
- source_word: λέγει κύριος
  choice: говорит Господь
  rationale: Естественная русская формула речи с обычной передачей κύριος как «Господь».
theological_decisions:
- issue: К кому относится «гнев» в τῇ ὀργῇ
  choice: Сохранить краткое «гневу», пояснив в сноске вероятное указание на Божий гнев
  alternative: Явно перевести «Божьему гневу» либо понимать как человеческий гнев вообще
  rationale: Следующая цитата о принадлежащем Богу возмездии делает Божий гнев наиболее вероятным референтом, однако в греческом тексте слово «Божий» отсутствует; основной текст не должен устранять эту неявность.
- issue: Характер Божьего возмездия
  choice: «Мне принадлежит возмездие; Я воздам»
  alternative: «Мне отмщение, Я воздам»
  rationale: Формулировка сохраняет исключительное право Господа на суд и воздаяние, не привнося конфессионального толкования; традиционный вариант дан как текстовая альтернатива перевода.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Синтаксическая сжатость оригинала сохранена; архаичное «отмщение» вынесено в сноску.
