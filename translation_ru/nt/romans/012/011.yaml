base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: ru
  text: Не ослабевайте в усердии; духом пламенейте[a]; служите Господу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пламенейте Духом», если речь идёт о Святом Духе, а не о духе человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: в усердии
  rationale: «Усердие» передаёт деятельную ревность и старание; сочетание с запретом лениться сохраняет прямое противопоставление греческого текста.
- source_word: ὀκνηροί
  choice: не ленитесь
  rationale: Глагольная форма естественна для русского увещевания и передаёт леность, медлительность и нерадивость, которым здесь противопоставлено усердие.
- source_word: πνεύματι
  choice: духом
  rationale: Форма без уточняющего определения сохраняет возможное указание на человеческий дух или внутренний настрой; иной вариант, относящий выражение к Святому Духу, дан в сноске.
- source_word: ζέοντες
  choice: пламенейте
  rationale: Греческое слово буквально связано с кипением и образно обозначает горячность и внутренний пыл. «Пламенейте» сохраняет живую метафору и повелительную силу увещевания.
- source_word: κυρίῳ
  choice: Господу
  rationale: Обычное новозаветное соответствие титулу κύριος; в контексте Павла наиболее вероятно указание на Господа Иисуса, но перевод не делает это явным сверх исходного текста.
- source_word: δουλεύοντες
  choice: служите
  rationale: Хотя глагол связан с рабским служением, в данном увещевании «служите» естественно выражает преданность и послушание Господу.
theological_decisions:
- issue: К кому или чему относится πνεύματι в τῷ πνεύματι ζέοντες
  choice: человеческий дух / внутренний настрой
  alternative: Святой Дух
  rationale: Отсутствие артикля и ряд нравственных увещеваний допускают понимание человеческого духа, однако греческая форма не исключает отнесения к Святому Духу. Альтернатива сохранена в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным строением увещевания. Инверсия «духом пламенейте» сохраняет смысловую выразительность и параллелизм исходного текста, не прибегая к архаическим словам.
