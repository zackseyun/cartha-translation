lexical_decisions:
- source_word: μηδενὶ
  choice: никому
  rationale: Дательный падеж при ἀποδιδόντες передаёт адресата действия; «никому» естественно по-русски и сохраняет всеобщий охват.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: злом за зло
  rationale: Устойчивое русское выражение точно передаёт нравственный смысл κακόν и значение воздаяния, выраженное ἀντί.
- source_word: ἀποδιδόντες
  choice: не воздавайте
  rationale: Причастие в контексте ряда наставлений имеет побудительную силу. «Воздавайте» передаёт ответное действие и сохраняет достойный, но понятный регистр.
- source_word: προνοούμενοι
  choice: заботьтесь
  rationale: Глагол обозначает предусмотрительное внимание и заботу о чём-либо. «Заботьтесь» звучит естественно и не сужает смысл до материального обеспечения.
- source_word: καλὰ
  choice: то, что хорошо
  rationale: Субстантивированное прилагательное охватывает доброе, достойное и благородное; основной вариант сохраняет широту значения.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: в глазах всех людей
  rationale: Оборот передаёт публичную оценку и видимость поведения для окружающих; «людей» соответствует родовому значению ἀνθρώπων.
theological_decisions:
- issue: Нравственный и общественный оттенки καλά
  choice: то, что хорошо
  alternative: то, что достойно / благородно
  rationale: Основной текст сохраняет широкий нравственный смысл, не сводя наставление лишь к общественной репутации; оттенок достойного и благородного отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; прямое наставление передано императивами, естественными для контекста. Сохранены нравственная сила выражения «злом за зло» и смысл публично признаваемого добра.
