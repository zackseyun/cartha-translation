  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: ru
  text: Никому не воздавайте злом за зло. Старайтесь делать то, что хорошо[a] в глазах всех людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что достойно» или «то, что благородно».'
