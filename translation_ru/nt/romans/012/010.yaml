  source_fidelity: 'Первое наставление передано по смыслу: φιλαδελφία — братская любовь, φιλόστοργοι — тёплая, семейная сердечность по отношению друг к другу. Во второй части «опережайте друг друга» допустимо передаёт προηγούμενοι («идти впереди, проявлять инициативу»), сохраняя взаимный и побудительный характер выражения. Однако «оказывая честь» несколько переформулирует исходное отвлечённое τῇ τιμῇ («в почтении/чести»).'
