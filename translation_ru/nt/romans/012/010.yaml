  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: ru
  text: В братской любви будьте сердечны друг к другу; в почтении опережайте друг друга.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: в братской любви
  rationale: Передаёт любовь между членами христианской общины как между братьями и сёстрами, сохраняя семейный образ исходного слова.
- source_word: φιλόστοργοι
  choice: будьте нежны
  rationale: Слово обозначает тёплую, естественную семейную привязанность; «нежны» передаёт сердечность и близость без громоздкого пояснения.
- source_word: προηγούμενοι
  choice: опережайте
  rationale: 'Сохраняет соревновательный оттенок возможного значения: первыми и более других проявлять почтение, а не просто пассивно предпочитать другого.'
- source_word: τιμῇ
  choice: оказывая честь
  rationale: Передаёт здесь практическое выражение почтения, а не отвлечённое понятие чести.
theological_decisions:
- issue: Взаимное почтение или предпочтение другого себе
  choice: оказывая честь, опережайте друг друга
  alternative: в почтительности отдавайте предпочтение друг другу
  rationale: Причастие προηγούμενοι допускает толкования «идти впереди, опережать» и «ставить впереди, предпочитать». Выбранный вариант сохраняет энергичный призыв и взаимность, не добавляя прямо отсутствующего в тексте «себе».
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Параллелизм двух наставлений сохранён; «друг к другу / друг друга» естественно отражает повтор ἀλλήλους.
