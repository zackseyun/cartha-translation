  terminology: «Братская любовь» сохраняет семейно-общинный образ φιλαδελφία. «Сердечны» удачно передаёт φιλόστοργοι без деноминационного уточнения. «Почтение» соответствует τιμή и не навязывает спорное толкование προηγούμενοι как «ставить другого выше себя».
