  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: ru
  text: Если возможно[a], насколько это зависит от вас, живите в мире со всеми людьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если это возможно с вашей стороны, живите в мире со всеми людьми».'
    reason: 'Лексико-синтаксическая альтернатива: εἰ δυνατόν и τὸ ἐξ ὑμῶν можно теснее объединить в одну оговорку.'
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Если возможно
  rationale: 'Кратко и естественно передаёт условную оговорку: достижение мира возможно не во всех обстоятельствах.'
- source_word: τὸ ἐξ ὑμῶν
  choice: насколько это зависит от вас
  rationale: Идиоматично выражает предел личной возможности и ответственности адресатов, не превращая увещание в безусловную гарантию результата.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: со всеми людьми
  rationale: Передаёт универсальный и гендерно общий смысл ἄνθρωποι.
- source_word: εἰρηνεύοντες
  choice: живите в мире
  rationale: Причастие в контексте имеет побудительную силу; выбранная форма естественно передаёт продолжающийся образ жизни.
theological_decisions:
- issue: Объём и ограничение призыва к миру
  choice: Сохраняются и всеобщий охват призыва, и ограничение ответственности человека тем, что от него действительно зависит.
  alternative: Передать призыв как безусловное требование всегда достигать мира либо как обещание, что мир непременно будет достигнут при правильном поведении верующего.
  rationale: Сочетание εἰ δυνατόν и τὸ ἐξ ὑμῶν явно ограничивает достижимость результата, тогда как μετὰ πάντων ἀνθρώπων сохраняет всеобщую направленность увещания.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная, достойная и естественная. Повтор оговорок сохранён ради смыслового напряжения оригинала.
