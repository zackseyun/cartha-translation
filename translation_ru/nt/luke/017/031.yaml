  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: ru
  text: В тот день тот, кто будет на крыше[a], а его вещи — в доме, пусть не спускается в дом, чтобы забрать их; и тот, кто будет в поле, пусть также не возвращается назад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт о плоской крыше дома, на которую можно было выходить и которой обычно пользовались как дополнительным пространством.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: В тот день
  rationale: Естественный русский временной оборот, сохраняющий указательное значение ἐκείνῃ.
- source_word: ὃς ἔσται
  choice: тот, кто будет
  rationale: Сохраняет форму будущего времени и обобщающий характер относительной конструкции.
- source_word: ἐπὶ τοῦ δώματος
  choice: на крыше
  rationale: В данном контексте δῶμα обозначает плоскую, доступную крышу дома; краткий русский эквивалент естественен, а культурная особенность поясняется в сноске.
- source_word: τὰ σκεύη αὐτοῦ
  choice: его вещи
  rationale: σκεύη здесь означает находящееся в доме имущество; «вещи» ясно и без излишнего уточнения передаёт широкий смысл слова.
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: пусть не спускается забрать их
  rationale: Третье лицо повелительного наклонения естественно передано запретом с «пусть не»; «забрать» выражает направленное изъятие вещей из дома.
- source_word: ὁ ἐν ἀγρῷ
  choice: тот, кто будет в поле
  rationale: Восстанавливает подразумеваемую глагольную связь и сохраняет параллелизм с первой частью.
- source_word: ὁμοίως
  choice: также
  rationale: Естественно связывает два параллельных запрета.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: пусть не возвращается назад
  rationale: Передаёт запрет на возвращение или движение обратно. Русское «назад» сохраняет направительное значение εἰς τὰ ὀπίσω без неестественного овеществления выражения.
theological_decisions:
- issue: Эсхатологическая срочность образа
  choice: Сохранены конкретные запреты не спускаться за вещами и не возвращаться назад.
  alternative: Передать общий смысл как призыв не держаться за имущество.
  rationale: Греческий текст рисует конкретную ситуацию «того дня». Такое воспроизведение сохраняет срочность предупреждения и не превращает его в добавленное переводчиком нравственное обобщение.
- issue: Референт выражения εἰς τὰ ὀπίσω
  choice: Не уточнять, возвращается ли человек именно за оставленным имуществом.
  alternative: «Пусть не возвращается за тем, что осталось позади».
  rationale: Сам греческий оборот указывает на возвращение назад, но не называет прямо предмет или цель возвращения; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык; сдержанный, ясный и достойный библейский регистр. Повелительная конструкция «пусть не» сохраняет форму греческого запрета, а порядок частей поддерживает параллелизм стиха.
