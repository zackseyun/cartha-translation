source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: ru
  text: 'Затем Он сказал ученикам: «Настанут дни, когда вы захотите увидеть один из дней Сына Человеческого[a], и не увидите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «дни Сына Человеческого» может относиться ко времени Его присутствия и служения или, более конкретно, к Его будущему явлению; греческая формулировка не сужает значение до одного из этих вариантов.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Затем Он сказал
  rationale: δέ — мягкая повествовательная связка; «затем» естественно продолжает повествование, не придавая ей излишне противительного значения.
- source_word: πρὸς τοὺς μαθητάς
  choice: ученикам
  rationale: В греческом тексте стоит определённый артикль, но нет притяжательного местоимения; русский контекст естественно допускает форму без «Своим».
- source_word: Ἐλεύσονται ἡμέραι
  choice: Настанут дни
  rationale: Естественная для русского пророческого и повествовательного стиля передача будущего наступления определённого времени.
- source_word: ἐπιθυμήσετε
  choice: захотите
  rationale: Передаёт сильное желание в ясном современном русском; в данном контексте сила желания дополнительно выражена оборотом «хотя бы один».
- source_word: μίαν τῶν ἡμερῶν
  choice: хотя бы один из дней
  rationale: Сохраняет партитивную конструкцию «один из дней», а «хотя бы» естественно передаёт контекстуальный оттенок стремления увидеть хотя бы один такой день.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Традиционная и содержательно точная передача титула, сохраняющая его библейские и богословские связи.
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: увидеть… но не увидите
  rationale: Повтор корня естественно воспроизводит два греческих глагола зрения; «но» ясно передаёт контекстуальное противопоставление, выраженное связкой καί.
theological_decisions:
- issue: Значение выражения «дни Сына Человеческого»
  choice: Сохранить буквальную и эсхатологически насыщенную формулировку без сужения значения
  alternative: Понимать её исключительно как дни земного служения Иисуса либо исключительно как время Его будущего явления и суда
  rationale: Греческая формулировка допускает связь как с присутствием и деятельностью Иисуса, так и с будущим откровением Сына Человеческого; ближайший контекст придаёт ей эсхатологическую напряжённость, но не требует устранить смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краткий и ясный; традиционный титул «Сын Человеческий» сохранён. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской практике.
