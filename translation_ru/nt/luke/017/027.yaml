  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: ru
  text: Они ели, пили, женились и выходили замуж[a] до того дня, когда Ной вошёл в ковчег, и пришёл потоп и погубил всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблены два разных глагола: первый — в активной форме («женились»), второй — в страдательно-каузативной («были отдаваемы в брак»). Русское «выходили замуж» естественно передаёт эту традиционную пару выражений.'
    reason: Поясняет сохранённое различие активного и страдательно-каузативного греческих глаголов, не утяжеляя основной текст неестественной буквальной конструкцией.
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: ели, пили
  rationale: Русский несовершенный вид естественно передаёт длительные или обычные действия, выраженные греческими имперфектами, без тяжеловесного повтора «продолжали».
- source_word: ἐγάμουν
  choice: вступали в брак
  rationale: Нейтральная современная формулировка передаёт активный глагол, не ограничивая его значение только мужчинами.
- source_word: ἐγαμίζοντο
  choice: их выдавали замуж
  rationale: Конструкция сохраняет страдательно-каузативный смысл отдельного греческого глагола и его отличие от предшествующего «вступали в брак».
- source_word: ἄχρι ἧς ἡμέρας
  choice: до того дня, когда
  rationale: Естественно и точно обозначает временной предел продолжающихся действий.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Ной вошёл в ковчег
  rationale: Лаконично передаёт завершённое повествовательное действие и традиционное значение κιβωτός в рассказе о Ное.
- source_word: κατακλυσμός
  choice: потоп
  rationale: Общепринятое и ясное русское обозначение потопа в аллюзии на Бытие.
- source_word: ἀπώλεσεν πάντας
  choice: погубил их всех
  rationale: Передаёт уничтожение всех упомянутых людей и явно сохраняет всеохватность πάντας.
theological_decisions:
- issue: Передача двух различных глаголов о браке
  choice: вступали в брак, и их выдавали замуж
  alternative: женились и выходили замуж
  rationale: Основной текст сохраняет различие между активным и страдательно-каузативным выражением, не придавая этой паре дополнительного богословского смысла.
- issue: Вид начальной серии глаголов
  choice: 'несовершенный вид: «ели, пили, вступали… выдавали»'
  alternative: добавление «продолжали» к перечислению
  rationale: Несовершенный вид русского глагола достаточно передаёт продолжающийся и обычный характер действий перед внезапным судом.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. Несовершенный вид передаёт обычное течение жизни; «тогда» естественно подчёркивает наступивший вслед за этим потоп, не добавляя нового причинного смысла.
