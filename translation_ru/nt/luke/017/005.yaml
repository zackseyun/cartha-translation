  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: ru
  text: 'И апостолы сказали Господу: «Умножь в нас веру».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Добавь нам веры». Здесь греческий глагол «добавить» означает увеличить, умножить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз без добавления явно не выраженного временного оттенка.
- source_word: εἶπαν
  choice: сказали
  rationale: Аорист передан обычной формой прошедшего времени совершенного вида, естественной для повествования.
- source_word: οἱ ἀπόστολοι
  choice: апостолы
  rationale: Устоявшееся и точное обозначение посланных Иисусом учеников в Евангелии от Луки.
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: Передаёт обращение к Иисусу и сохраняет богословскую значимость титула κύριος.
- source_word: Πρόσθες
  choice: Умножь
  rationale: Глагол буквально означает «добавь», но в сочетании с верой выражает просьбу сделать её больше; «умножь» естественно и достойно передаёт этот смысл.
- source_word: ἡμῖν
  choice: в нас
  rationale: Дательный ἡμῖν буквально означает «нам»; русское «умножь в нас веру» естественно обозначает возрастание принадлежащей им внутренней веры.
- source_word: πίστιν
  choice: веру
  rationale: Основное контекстуальное значение — вера или доверие; значение «верность» здесь менее вероятно.
theological_decisions:
- issue: Передача κύριος применительно к Иисусу
  choice: Господь
  alternative: господин / Учитель
  rationale: «Господь» сохраняет как уважительное обращение, так и христологическое звучание титула в повествовании Луки.
- issue: Значение πίστις
  choice: вера
  alternative: доверие; менее вероятно — верность
  rationale: В просьбе апостолов речь естественнее всего идёт об их вере и доверии; перевод не сводит слово к одному лишь психологическому доверию.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и общепонятной формулировкой. Сохранён традиционный библейский термин «апостолы» и титул «Господь»; буквальная конструкция пояснена в сноске.
