base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: ru
  text: Он пал ниц у ног Иисуса и благодарил Его. И он был самарянином.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: пал ниц
  rationale: Устойчивое современное русское выражение точно передаёт падение лицом вниз как жест глубокого почтения, не перегружая фразу пояснениями.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: у ног Иисуса
  rationale: «У ног» естественно передаёт положение простёршегося человека. Имя «Иисуса» проясняет местоименную связь в русском предложении и устраняет возможное ошибочное понимание «у своих ног».
- source_word: εὐχαριστῶν αὐτῷ
  choice: и благодарил Его
  rationale: Настоящее причастие обозначает сопутствующее действие; личная форма с союзом звучит естественно по-русски и сохраняет одновременность благодарения.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: А он был самарянином
  rationale: Противительный оттенок «А» естественно выделяет неожиданное сообщение о личности исцелённого, тогда как местоимение «он» сохраняет акцент αὐτός без пояснительного расширения.
theological_decisions:
- issue: Повествовательный акцент на происхождении исцелённого
  choice: А он был самарянином
  alternative: И он был самарянином
  rationale: Формулировка сохраняет сдержанное, но заметное раскрытие того, что благодарный человек принадлежал к самарянам, не добавляя оценки его положения или богословского комментария.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified повествовательная фраза. «Пал ниц» понятно в библейском регистре и точно передаёт телесную позу. Заглавная буква в «Его» следует принятой русской традиции почтительного обозначения Иисуса.
