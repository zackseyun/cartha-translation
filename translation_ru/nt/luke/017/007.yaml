  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: ru
  text: 'Кто же из вас, имея раба[a], который пашет или пасёт стадо, скажет ему, когда тот придёт с поля: «Сейчас же подойди и возляг за столом[b]»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу»; греческое δοῦλος обозначает зависимого работника, находящегося во власти хозяина, а не наёмного работника.'
    reason: alternative_reading
  - marker: b
    text: '«Возляг за столом» отражает древний обычай принимать пищу полулёжа; по смыслу: «садись есть».'
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: раба
  rationale: Греческое слово обозначает человека, находящегося во власти хозяина, а не наёмного работника. «Раб» сохраняет существенную для примера социальную и риторическую асимметрию.
- source_word: ἀροτριῶντα
  choice: пашет
  rationale: Прямо передаёт конкретную сельскохозяйственную работу и естественно звучит в современном русском языке.
- source_word: ποιμαίνοντα
  choice: пасёт стадо
  rationale: Передаёт труд пастуха; добавление «стадо» делает непереходное в данном контексте русское выражение ясным, не уточняя вид животных.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: когда тот вернётся с поля
  rationale: Передаёт временное значение причастия и завершённое возвращение работника с поля перед обращёнными к нему словами.
- source_word: Εὐθέως
  choice: сейчас же
  rationale: Естественно и непосредственно передаёт требование немедленного действия.
- source_word: παρελθὼν
  choice: подойди
  rationale: В сочетании с повелением занять место за трапезой причастие выражает сопутствующее движение; «подойди» сохраняет его без неестественной буквальности.
- source_word: ἀνάπεσε
  choice: возляг за стол
  rationale: Сохраняет исторический обычай принимать пищу полулёжа и при этом понятно современному читателю.
theological_decisions:
- issue: Передача δοῦλος в домашнем контексте притчи
  choice: раб
  alternative: слуга / невольник
  rationale: «Раб» сохраняет заложенную в рассуждении власть хозяина над работником и не смягчает социальную реальность текста; при этом перевод сам по себе не привносит позднейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией. Риторический вопрос сохранён; историческая реалия трапезы передана в тексте и кратко разъяснена в сноске.
