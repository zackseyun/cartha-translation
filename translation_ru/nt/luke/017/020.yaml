source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: ru
  text: 'Когда фарисеи спросили Его, когда придёт Царство Божье, Он ответил им: «Царство Божье приходит не так, чтобы его можно было заметить[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с явными признаками», «так, чтобы за его приходом можно было проследить» или «посредством внимательного наблюдения».'
    reason: Лексическая неоднозначность выражения μετὰ παρατηρήσεως.
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Когда фарисеи спросили Его
  rationale: Аористное страдательное причастие передаёт обстоятельство, предшествующее ответу. Активная конструкция естественнее по-русски и сохраняет фарисеев как действующих лиц; δέ здесь обозначает мягкий переход и не требует отдельного слова.
- source_word: πότε ἔρχεται
  choice: когда придёт
  rationale: Настоящее ἔρχεται в вопросе имеет направленность в будущее; совершенный вид «придёт» естественно выражает ожидаемое наступление.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся, ясное и стилистически достойное русское обозначение Божьего царствования; заглавная буква сохраняет узнаваемость библейского выражения.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: Он ответил им
  rationale: Греческая формула буквально содержит «ответил и сказал», но в современном русском удвоение тяжеловесно; один глагол полно передаёт речевое действие.
- source_word: Οὐκ ἔρχεται
  choice: приходит не так
  rationale: Настоящее время сохранено как общее утверждение о характере прихода Царства.
- source_word: μετὰ παρατηρήσεως
  choice: чтобы это можно было заметить
  rationale: παρατήρησις допускает значения наблюдения, высматривания и внимательного отслеживания. Формулировка естественна по-русски и не сводит неоднозначное выражение исключительно к особым знамениям.
theological_decisions:
- issue: Характер отрицания в словах о приходе Царства
  choice: Отрицание относится к способу прихода, который можно распознать посредством внешнего наблюдения или отслеживания.
  alternative: Царство приходит без наблюдаемых знамений; либо его вообще невозможно наблюдать.
  rationale: μετὰ παρατηρήσεως неоднозначно. Перевод сохраняет связь с наблюдением, не утверждая ни полного отсутствия всяких эсхатологических знамений, ни невозможности какого-либо восприятия Царства.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. Речь Иисуса лаконична и достойна; традиционное выражение «Царство Божье» сохранено без архаичной синтаксической тяжеловесности.
