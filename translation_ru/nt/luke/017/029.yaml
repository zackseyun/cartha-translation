id: LUK.17.29
reference: Luke 17:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: ru
  text: но в тот день, когда Лот вышел из Содома, с неба пролились огонь и сера и погубили всех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: но в тот день, когда
  rationale: Дательный оборот имеет временное значение; «но» передаёт лёгкое противопоставление предыдущему стиху, а конструкция с «когда» естественна для современного русского языка.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Сохраняет конкретное значение движения у ἐξέρχομαι без более отвлечённого «покинул».
- source_word: Λὼτ
  choice: Лот
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: ἀπὸ Σοδόμων
  choice: из Содома
  rationale: Естественная русская передача исходного пункта движения; название города дано в традиционной форме единственного числа.
- source_word: ἔβρεξεν πῦρ καὶ θεῖον
  choice: пролились огонь и сера
  rationale: Безличное греческое выражение передано естественным русским глаголом, сохраняющим образ дождя; «сера» — современное прямое соответствие θεῖον.
- source_word: ἀπ’ οὐρανοῦ
  choice: с неба
  rationale: В данном описании падения огня и серы русское «с неба» естественно и не устраняет возможного библейского смысла небесной сферы.
- source_word: ἀπώλεσεν πάντας
  choice: погубили всех
  rationale: Множественное сказуемое согласовано с составным подлежащим «огонь и сера»; «всех» сохраняет подразумеваемый человеческий референт πάντας.
theological_decisions:
- issue: Передача θεῖον в контексте суда
  choice: сера
  alternative: сера горючая
  rationale: «Сера» прямо и понятно передаёт вещество, названное в греческом тексте, не усиливая выражение традиционной или конфессионально окрашенной формулой.
- issue: Передача οὐρανός
  choice: небо
  alternative: небеса
  rationale: «Небо» сохраняет смысл источника бедствия свыше и звучит естественно в современном русском языке; число и форма не навязывают дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественно-сдержанный повествовательный регистр. Образ дождя сохранён глаголом «пролились», без архаизирующей лексики.
