lexical_decisions:
- source_word: μνημονεύετε
  choice: Помните
  rationale: Форма настоящего времени, действительного залога, повелительного наклонения, 2-го лица множественного числа передаёт прямой призыв помнить и не упускать из виду предостерегающий пример.
- source_word: τῆς γυναικὸς
  choice: жену
  rationale: γυνή может означать «женщина» или «жена»; родительный падеж имени Λώτ указывает здесь на семейное отношение. Русская конструкция «жена Лота» естественна и близка к греческой.
- source_word: Λώτ
  choice: Лота
  rationale: Имя передано в традиционной русской библейской форме и поставлено в родительный падеж согласно синтаксису предложения.
theological_decisions:
- issue: Форма предостережения и ветхозаветная аллюзия
  choice: 'Сохранён краткий прямой призыв: «Помните жену Лота».'
  alternative: «Вспоминайте о жене Лота».
  rationale: Краткая повелительная форма сохраняет силу слов Иисуса и отсылку к Быт. 19:26, не добавляя истолкования причины или характера поступка жены Лота.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и торжественно-сдержанная. Множественное число повелительного наклонения соответствует греческому тексту.
