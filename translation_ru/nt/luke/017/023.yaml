  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: ru
  text: 'И вам скажут: «Вот там!» или: «Вот здесь!» Не уходите и не гонитесь за ними[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте объект глагола «гонитесь» не назван; возможно также: «Не уходите и не устремляйтесь следом».'
    reason: Сохранение синтаксической неопределённости оригинала.
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: вам скажут
  rationale: Будущее время λέγω естественно передаётся совершенным будущим «скажут»; порядок слов остаётся современным и выразительным.
- source_word: Ἰδοὺ ἐκεῖ· Ἰδοὺ ὧδε
  choice: '«Вот там!» или: «Вот здесь!»'
  rationale: «Вот» служит естественным современным указательным возгласом и сохраняет краткое противопоставление ἐκεῖ и ὧδε. Союз «или» ясно передаёт альтернативные указания, подразумеваемые парой возгласов.
- source_word: μὴ ἀπέλθητε
  choice: Не уходите
  rationale: ἀπέρχομαι обозначает уход или отправление прочь. «Не уходите» сохраняет прямой запрет без добавления конкретного места назначения.
- source_word: μηδὲ διώξητε
  choice: и не гонитесь за ними
  rationale: διώκω здесь означает устремляться следом, преследовать. Русское «гонитесь за ними» естественно выражает практический смысл предупреждения; местоимение восполняет не названный в греческом объект и поэтому отмечено сноской.
theological_decisions:
- issue: Не названный объект при διώξητε
  choice: «не гонитесь за ними» с пояснительной сноской
  alternative: «и не преследуйте»; «и не устремляйтесь следом»
  rationale: В греческом тексте объект отсутствует, поэтому нельзя догматически определить, имеются ли в виду говорящие, претенденты или сами сообщения. Основной текст остаётся естественным по-русски, а сноска сохраняет подлинную неопределённость.
- issue: Характер двух указательных возгласов
  choice: '«Вот там!» или: «Вот здесь!»'
  alternative: «Вот там! Вот здесь!»
  rationale: Передача через «или» делает понятной альтернативность ложных указаний, не уточняя их эсхатологический смысл сверх контекста.
translation_notes:
  register: Современный литературный русский язык; краткая, настойчивая форма предупреждения. Архаичное «се» не используется. Повтор «Вот» сохраняет непосредственность исходных возгласов.
