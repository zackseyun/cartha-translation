  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: ru
  text: Разве не нашлось никого, кто вернулся, чтобы воздать славу Богу, кроме этого чужеземца?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этого человека из другого народа» или «этого иноплеменника»; греческое слово обозначает чужеземца, человека, не принадлежащего к Израилю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: не нашлось никого
  rationale: В риторическом вопросе аорист пассивного залога естественно передаётся по-русски безличной конструкцией, сохраняющей смысл отсутствия других людей.
- source_word: ὑποστρέψαντες
  choice: кто возвратился бы
  rationale: Причастие обозначает возвращение как действие, предшествующее воздаянию славы; придаточное предложение звучит естественно в современном русском языке.
- source_word: δοῦναι δόξαν
  choice: воздал славу
  rationale: Сохранена традиционная библейская идиома, буквально соответствующая греческому выражению и не сводящая его лишь к словесной хвале.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж прямо и естественно передаёт адресата славы.
- source_word: εἰ μὴ
  choice: кроме
  rationale: В исключительной конструкции это краткий и идиоматичный русский эквивалент.
- source_word: ἀλλογενής
  choice: иноплеменника
  rationale: Слово обозначает человека из другого народа, чужого по отношению к Израилю; «иноплеменник» сохраняет этнический оттенок точнее, чем общее «чужеземец» или «незнакомец».
- source_word: οὗτος
  choice: этого
  rationale: Указательное местоимение сохраняет эмфатическое указание на единственного вернувшегося.
theological_decisions:
- issue: Положение исцелённого как этнического и религиозного чужака
  choice: этого иноплеменника
  alternative: этого чужеземца; этого человека из другого народа
  rationale: 'Формулировка сохраняет иронию повествования: славу Богу воздал человек, не принадлежавший к Израилю. При этом в текст не добавляется пояснение, что он самарянин, хотя это известно из ближайшего контекста.'
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской формулой «воздать славу Богу». «Иноплеменник» несколько возвышенно, но понятно и точно передаёт принадлежность к другому народу. Риторический характер вопроса усилен естественной частицей «неужели».
