  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: ru
  text: И как было во дни Ноя, так будет и во дни Сына Человеческого[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сына человека». Традиционный титул «Сын Человеческий», вероятно, перекликается с Дан 7 и сохраняет мессианское и апокалиптическое звучание этого выражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: как
  rationale: В паре с «так» естественно и точно вводит сопоставление двух времён.
- source_word: ἐγένετο
  choice: было
  rationale: Передаёт событийное значение γίνομαι в краткой и естественной русской форме; содержание происходившего раскрывается последующим контекстом.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: во дни Ноя
  rationale: Устоявшееся и понятное временное выражение, сохраняющее структуру и возвышенный регистр греческого оборота.
- source_word: οὕτως
  choice: так
  rationale: Образует естественную русскую сравнительную конструкцию «как… так…».
- source_word: ἔσται
  choice: будет
  rationale: Точно сохраняет краткое будущее значение греческого глагола без добавочного истолкования того, что именно произойдёт.
- source_word: καὶ
  choice: и
  rationale: В сочетании «так будет и» сохраняет присоединительно-усилительную функцию второго καί.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Традиционное русское наименование Иисуса, сохраняющее словесную форму выражения и его вероятный отзвук Дан 7.
theological_decisions:
- issue: Передача выражения τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  alternative: сына человека
  rationale: Традиционный титул сохраняет христологическое и апокалиптическое звучание выражения, не устраняя при этом его буквальной связи с обозначением человека; буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «во дни». Симметрия «как… так…» сохраняет ясность и ритм исходного сравнения.
