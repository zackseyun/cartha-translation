base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: ru
  text: Но один из них, увидев, что исцелён, вернулся, громким голосом прославляя[a] Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хваля Бога». Греческий глагол может означать «прославлять», «воздавать славу» или «хвалить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Но один из них
  rationale: Частичная конструкция означает «один из них»; δέ здесь естественно передаётся союзом «но», подчёркивающим повествовательный контраст с остальными.
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие сохраняет форму и плавность греческого аористного причастия, не уточняя временную последовательность сверх текста.
- source_word: ὅτι ἰάθη
  choice: что исцелён
  rationale: Аорист пассива ἰάομαι обозначает совершившееся исцеление; краткая русская форма естественно выражает результат, который человек осознал.
- source_word: ὑπέστρεψεν
  choice: вернулся
  rationale: В повествовательном контексте ὑποστρέφω обычно означает возвращение; «вернулся» — точная и естественная русская передача.
- source_word: μετὰ φωνῆς μεγάλης
  choice: громким голосом
  rationale: Греческое выражение означает громкое возглашение или речь; творительный падеж звучит естественно в современном русском языке.
- source_word: δοξάζων τὸν θεόν
  choice: прославлял Бога
  rationale: «Прославлял» сохраняет связь δοξάζω с понятием славы и в данном контексте включает хвалу Богу.
theological_decisions:
- issue: Передача τὸν θεόν
  choice: Бога
  alternative: —
  rationale: Текст прямо говорит, что исцелённый прославлял Бога; богословское расширение не требуется.
- issue: Видовое значение δοξάζων при глаголе возвращения
  choice: вернулся и громким голосом прославлял
  alternative: вернулся, громким голосом прославляя
  rationale: Личная форма «прославлял» естественнее по-русски передаёт сопутствующее и продолжающееся действие причастия, не утверждая, что прославление началось лишь после возвращения.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и достоинственный. «Исцелён» без повторного местоимения естественен и однозначен в контексте. Маркер сноски поставлен после выражения, к которому относится лексическая альтернатива.
