  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: ru
  text: 'Напротив, разве он не скажет ему: «Приготовь мне ужин, подпояшься[a] и прислуживай мне, пока я не поем и не выпью[b], а после этого сам поешь и выпьешь»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть приведи одежду в порядок для работы: длинные полы одежды подвязывали поясом, чтобы они не мешали.'
    reason: cultural_note
  - marker: b
    text: Греческие формы подчёркивают здесь завершение еды и питья до того, как наступит очередь другого человека.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Напротив, разве ... не
  rationale: Передаёт противопоставление и риторический вопрос, предполагающий утвердительный ответ.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Приготовь мне ужин
  rationale: Идиоматично передаёт распоряжение приготовить то, что говорящий съест за вечерней трапезой.
- source_word: περιζωσάμενος
  choice: подпояшься
  rationale: 'Сохраняет конкретный образ: длинную одежду подпоясывали, готовясь к работе; культурный смысл пояснён в сноске.'
- source_word: διακόνει μοι
  choice: прислуживай мне
  rationale: В данном контексте речь идёт об обслуживании за столом; слово не получает искусственно церковного оттенка.
- source_word: ἕως φάγω καὶ πίω
  choice: пока я не поем и не выпью
  rationale: 'Совершенный вид глаголов и естественная русская конструкция с «пока не» передают достижение предела: сначала хозяин заканчивает есть и пить.'
- source_word: μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ
  choice: а после этого сам поешь и выпьешь
  rationale: Будущее время сохранено, а «сам» естественно передаёт подчёркнутое греческое σύ и противопоставляет очередь собеседника очереди хозяина.
theological_decisions:
- issue: Обозначение социальной роли в притче
  choice: Не добавлять в этот стих существительные «слуга» или «раб».
  alternative: Для ясности вставить «слуге» либо «рабу».
  rationale: Хотя в предыдущем стихе назван δοῦλος, здесь греческий текст использует только местоимения и формы обращения. Перевод не вводит отсутствующее существительное, а отношения участников остаются ясны из приказаний и обслуживания за столом.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Подпояшься» сохраняет исторический образ, но поясняется сноской; «прислуживай» естественно обозначает обслуживание за столом. Риторическая форма и подчёркнутое противопоставление участников сохранены.
