id: LUK.17.34
reference: Luke 17:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: ru
  text: 'Говорю вам: в ту ночь двое будут на одной постели; одного возьмут[a], а другого оставят[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьмут с собой». Сам глагол здесь не уточняет, будет ли человек взят ради избавления или для суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оставят позади». В основном тексте употреблено более краткое «оставят», чтобы не привносить позднейших эсхатологических ассоциаций, прямо не выраженных в греческом тексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Говорю вам
  rationale: Естественная для современного русского языка формула прямого и подчёркнутого обращения, близкая к форме греческого настоящего времени.
- source_word: ταύτῃ τῇ νυκτί
  choice: в ту ночь
  rationale: Временной дательный с указательным местоимением обозначает определённую ночь; «в ту ночь» естественно передаёт это по-русски.
- source_word: ἔσονται δύο
  choice: двое будут
  rationale: Субстантивированное числительное обозначает двух людей; собирательное «двое» звучит естественно и не уточняет их пол.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: на одной постели
  rationale: κλίνη может означать постель или ложе; ночной контекст поддерживает «постель», а «на» близко передаёт ἐπί.
- source_word: παραλημφθήσεται
  choice: возьмут
  rationale: Неопределённо-личная форма естественно передаёт греческий страдательный залог. Сам глагол здесь не уточняет, берут ли человека ради избавления или суда.
- source_word: ὁ ἕτερος
  choice: другого
  rationale: В парном противопоставлении «одного… другого» это наиболее естественное русское соответствие.
- source_word: ἀφεθήσεται
  choice: оставят
  rationale: В противопоставлении глаголу «возьмут» ἀφίημι означает «оставить». Краткая форма не привносит современных эсхатологических ассоциаций выражения «оставить позади».
theological_decisions:
- issue: Следует ли уточнять, что взятый спасён, а оставленный осуждён, или наоборот
  choice: 'Сохранена нейтральная формулировка: «одного возьмут, а другого оставят».'
  alternative: Уточнить, что одного заберут для спасения либо для суда.
  rationale: Сами греческие глаголы в этом стихе не определяют участь каждого человека; перевод сохраняет исходную богословскую напряжённость и неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественно-сдержанный синтаксис. Сохранены парное противопоставление и богословская неоднозначность исходного текста.
