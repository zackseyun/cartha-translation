source:
  edition: robinson-pierpont-2005-byzantine
  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: ru
  text: 'Двое[a] будут в поле: одного возьмут, а другого оставят.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этот стих отсутствует в древнейших греческих рукописях, в том числе в Синайском и Ватиканском кодексах IV века, а также в ранних коптских переводах. Он присутствует в западной текстовой традиции (например, в кодексе Безы V века), в большинстве византийских рукописей и в латинской Вульгате. Вероятно, позднее переписчики добавили его для согласования с Матфея 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: παραληφθήσεται
  choice: возьмут
  rationale: Будущая пассивная форма παραλαμβάνω здесь означает, что одного из двух возьмут; перевод сохраняет краткость и не уточняет намеренно не названного действующего лица.
- source_word: ἀφεθήσεται
  choice: оставят
  rationale: Будущая пассивная форма ἀφίημι в прямом противопоставлении παραληφθήσεται означает, что другого оставят; формулировка не добавляет спорного уточнения «позади».
- source_word: ὁ ἕτερος
  choice: другого
  rationale: Обозначает второго из двух упомянутых людей; русская форма естественно согласуется с конструкцией «одного… другого».
- source_word: δύο
  choice: двое
  rationale: Субстантивированное числительное без выраженного существительного передано собирательным «двое», естественно обозначающим двух людей и не добавляющим отсутствующее в греческом тексте слово «мужчины».
theological_decisions:
- issue: Смысл противопоставления «возьмут / оставят»
  choice: Не уточнять, означает ли взятие спасение или суд
  alternative: Явно истолковать взятого как спасённого либо осуждённого
  rationale: Сам стих не называет ни действующего лица, ни участи каждого; буквальное противопоставление сохраняет присущую контексту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный синтаксис оригинала сохранён. Пассивные формы переданы естественными для русского неопределённо-личными конструкциями.
