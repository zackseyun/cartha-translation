  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: ru
  text: Лучше было бы ему, если бы ему на шею повесили мельничный жернов[a] и бросили его в море, чем если бы он ввёл в грех одного из этих малых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «большой мельничный жернов». Греческое выражение может обозначать тяжёлый жернов, использовавшийся на мельнице.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стал причиной падения одного из этих малых». Греческий глагол может означать побудить человека к греховному падению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: лучше было бы ему
  rationale: Передаёт значение предпочтительности одного исхода другому и естественно звучит в данном условно-сравнительном построении.
- source_word: λίθος μυλικὸς
  choice: мельничный жернов
  rationale: Точный и понятный русский эквивалент; возможный оттенок большого тяжёлого жернова отмечен в сноске.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: ему повесили на шею
  rationale: Естественно передаёт результирующее состояние в условной конструкции, не воспроизводя буквально тяжеловесную греческую форму.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: бросили его в море
  rationale: Передаёт завершённое пассивное действие и согласуется с параллельной условной конструкцией.
- source_word: σκανδαλίσῃ
  choice: ввёл в грех
  rationale: В контексте глагол обозначает причинение нравственного или духовного падения. Русское «заставил споткнуться» хуже передаёт смысл без пояснения; образный вариант сохранён в сноске.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: одного из этих малых
  rationale: Сохраняет неопределённость греческого выражения и не сужает круг обозначенных лиц до детей либо учеников.
- source_word: ἢ ἵνα
  choice: чем если бы
  rationale: Ясно и естественно выражает сравнение двух исходов.
theological_decisions:
- issue: Кого обозначают «эти малые»
  choice: эти малые
  alternative: эти дети; эти смиренные верующие или ученики
  rationale: Греческий текст не уточняет референта; перевод сохраняет широту и богословскую напряжённость выражения.
- issue: Смысл σκανδαλίζω
  choice: ввести в грех
  alternative: стать причиной преткновения; погубить духовно
  rationale: Основной текст ясно передаёт причинение греховного падения, не сводя действие лишь к оскорблению чувств; образный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Синтаксис сделан естественным для русского читателя; «эти малые» намеренно сохраняет смысловую широту оригинала.
