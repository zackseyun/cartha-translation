source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: ru
  text: Следите за собой. Если твой брат[a] согрешит[b], обличи его, и если он покается, прости его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово «брат» стоит в мужском роде и единственном числе, но здесь может обозначать и другого ученика в более широком смысле.
    reason: cultural_note
  - marker: b
    text: 'В некоторых рукописях: «Если твой брат согрешит против тебя, обличи его».'
    reason: textual_variant
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Следите за собой
  rationale: Настоящее повелительное наклонение передаёт призыв к постоянной бдительности, а возвратное местоимение сохраняет направленность внимания на самих себя. Формулировка естественна для современного русского языка и не устраняет возможный как личный, так и общинный оттенок.
- source_word: ἁμάρτῃ
  choice: согрешит
  rationale: В принятом греческом тексте нет дополнения «против тебя», поэтому перевод сохраняет более широкое значение. Совершенный вид уместно передаёт условно мыслимый поступок.
- source_word: ὁ ἀδελφός σου
  choice: твой брат
  rationale: Перевод сохраняет мужской род и единственное число греческого выражения. Возможное более широкое обозначение другого ученика пояснено в сноске.
- source_word: ἐπιτίμησον αὐτῷ
  choice: обличи его
  rationale: Глагол выражает прямое и серьёзное словесное указание на проступок. «Обличи» сохраняет эту силу, не сводя действие к мягкому совету.
- source_word: μετανοήσῃ
  choice: покается
  rationale: «Покаяться» является ясным и устойчивым русским соответствием для нравственного и духовного обращения, подразумеваемого μετανοέω.
- source_word: ἄφες αὐτῷ
  choice: прости его
  rationale: В межличностном контексте ἀφίημι означает прощение; эта формулировка естественна и непосредственно понятна по-русски.
theological_decisions:
- issue: Следует ли включать слова «против тебя» после «согрешит»
  choice: Не включать их в основной текст
  alternative: «Если твой брат согрешит против тебя…»
  rationale: В предоставленном тексте SBLGNT сказано лишь ἐὰν ἁμάρτῃ ὁ ἀδελφός σου, без εἰς σέ или равнозначного дополнения. Более пространное чтение отмечено в сноске как текстовый вариант, но не внесено в основной текст.
- issue: Передача мужского рода в ἀδελφός
  choice: «твой брат»
  alternative: «твой брат или сестра»; «другой верующий»
  rationale: Греческое существительное имеет мужской род и стоит в единственном числе. Основной текст сохраняет эту форму, а возможный более широкий круг учеников указан в пояснительной сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным звучанием. Обращение во второй части сохранено в единственном числе вслед за греческими формами σου и повелительными формами единственного числа. «Следите за собой» передаёт множественное число ἑαυτοῖς и общий призыв всей группе.
