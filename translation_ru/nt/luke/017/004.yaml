  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: ru
  text: 'И если он семь раз за день согрешит против тебя и семь раз обратится[a] к тебе со словами: «Я раскаиваюсь», — прости его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернётся к тебе». Глагол может означать как возвращение, так и обращение к кому-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты простишь его». В греческом тексте употреблена форма будущего времени, которая здесь имеет силу повеления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: семь раз за день
  rationale: «Семь раз» точно передаёт наречие ἑπτάκις, а «за день» естественно выражает греческий родительный времени, не добавляя идеи конкретного календарного дня.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: согрешит против тебя
  rationale: Сочетание ἁμαρτάνω с εἰς σέ обозначает грех или проступок, направленный против собеседника; формулировка сохраняет нравственный вес слова «согрешить».
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: обратится к тебе
  rationale: ἐπιστρέφω допускает значения «обратиться», «повернуться» и «вернуться». В данном контексте «обратится к тебе» естественно описывает повторное обращение виновного и не предполагает обязательного физического ухода и возвращения.
- source_word: λέγων
  choice: со словами
  rationale: Эта конструкция естественно по-русски передаёт причастие λέγων и связывает обращение виновного с его признанием.
- source_word: Μετανοῶ
  choice: Я раскаиваюсь
  rationale: Настоящее время и нравственно-религиозный смысл μετανοέω переданы прямо; «раскаиваюсь» сильнее и точнее, чем простое «сожалею».
- source_word: ἀφήσεις αὐτῷ
  choice: прости его
  rationale: Будущее изъявительное ἀφήσεις в данном наставлении имеет повелительную силу. Русское повелительное наклонение ясно и естественно передаёт требование; местоимение «его» соответствует мужскому референту αὐτῷ.
theological_decisions:
- issue: Сила будущего изъявительного ἀφήσεις
  choice: 'Передано как прямое предписание: «прости его»'
  alternative: «ты простишь его» / «ты должен простить его»
  rationale: Контекст требует понимания формы как повеления, а не простого предсказания. «Прости» естественно выражает эту силу; сноска сохраняет сведения о греческой форме, не усиливая её добавленным модальным словом «должен».
- issue: Смысл Μετανοῶ
  choice: «Я раскаиваюсь»
  alternative: «Мне жаль» / «Я изменил своё мнение»
  rationale: Речь идёт о покаянии и нравственном обращении, а не только о сожалении или интеллектуальной перемене мнения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет условную структуру оригинала; лексика «согрешит», «раскаиваюсь», «прости» удерживает нравственную и богословскую напряжённость текста без конфессиональных добавлений.
