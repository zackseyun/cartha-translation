  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: ru
  text: Разве он благодарит раба за то, что тот исполнил приказанное?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу». Греч. δοῦλος — «раб»; в зависимости от контекста может передаваться словом «слуга».'
    reason: Лексическая альтернатива; сноска уточнена, чтобы не добавлять чрезмерно категоричного социально-правового определения.
lexical_decisions:
- source_word: μὴ
  choice: разве
  rationale: Частица μή при изъявительном наклонении вводит риторический вопрос, предполагающий отрицательный ответ; «разве» естественно передаёт это ожидание по-русски.
- source_word: ἔχει χάριν
  choice: благодарит
  rationale: Выражение ἔχειν χάριν τινί здесь означает испытывать или выражать благодарность кому-либо; глагол «благодарит» краток и естественен.
- source_word: δούλῳ
  choice: раба
  rationale: В ситуации отношений господина и раба слово δοῦλος обозначает несвободного и обязанного повиноваться человека; «раб» сохраняет социальную асимметрию и силу довода.
- source_word: ὅτι
  choice: за то, что
  rationale: ὅτι указывает основание предполагаемой благодарности; русская конструкция «благодарить за то, что» звучит естественнее буквального «потому что».
- source_word: ἐποίησεν
  choice: исполнил
  rationale: В сочетании с приказанным ποιέω означает выполнение распоряжения; «исполнил» точно и идиоматично передаёт действие.
- source_word: τὰ διαταχθέντα
  choice: приказанное
  rationale: Субстантивированное страдательное причастие означает «то, что было приказано»; «приказанное» сохраняет пассивный смысл и лаконичность.
theological_decisions:
- issue: Передача δοῦλος в контексте притчи об отношениях господина и раба
  choice: раб
  alternative: слуга, невольник
  rationale: Логика стиха опирается на подчинённое положение человека, обязанного исполнять приказы. «Раб» не смягчает предполагаемую текстом социальную реальность и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Риторический вопрос с «разве» ясно предполагает отрицательный ответ, не превращая его в прямое утверждение.
