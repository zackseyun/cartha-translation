source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: ru
  text: Кто постарается сохранить свою жизнь[a], тот потеряет её, а кто потеряет её, тот сохранит её в живых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душу». Здесь греческое слово ψυχή, вероятнее всего, означает жизнь человека или его самого.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сохранит в живых»; возможный перевод: «оставит её в живых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: постарается
  rationale: В данном условном высказывании глагол передаёт целенаправленное стремление, а не простое желание; «постарается» естественно выражает попытку добиться результата.
- source_word: ψυχήν
  choice: жизнь
  rationale: В контексте утраты и сохранения речь прежде всего идёт о жизни человека, а не специально о нематериальной душе.
- source_word: περιποιήσασθαι
  choice: сохранить
  rationale: Средний залог передаёт стремление уберечь или обеспечить жизнь для себя; «сохранить» ясно и естественно выражает этот смысл.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: потеряет
  rationale: Одинаковый перевод обеих форм сохраняет парадокс и словесный повтор оригинала, не добавляя идеи добровольной жертвы там, где она прямо не выражена.
- source_word: ζῳογονήσει
  choice: сохранит её живой
  rationale: Глагол означает сохранить или оставить в живых. Такое выражение удерживает буквальный образ жизни и отличается от более общего «спасёт».
- source_word: ὃς ἐὰν … ὃς δ’ ἂν
  choice: кто … тот … а кто … тот
  rationale: Эта русская конструкция естественно передаёт обобщённое условие и подчёркнутое противопоставление двух частей.
theological_decisions:
- issue: Значение ψυχή в парадоксальном изречении
  choice: «жизнь»
  alternative: «душа»
  rationale: Контекст говорит о попытке уберечь себя перед лицом суда и об утрате жизни; перевод «душа» мог бы неоправданно сузить смысл до учения о нематериальной части человека.
- issue: Передача ζῳογονήσει
  choice: «сохранит её живой»
  alternative: «спасёт её»
  rationale: В оригинале употреблён не обычный глагол со значением «спасать», а глагол, буквально связанный с сохранением в живых. Выбранный вариант сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Повтор «потеряет её» и симметрия «кто … тот» сохранены ради риторической силы изречения; необычное, но ясное «сохранит её живой» отражает лексику оригинала.
