  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: ru
  text: 'В ответ они сказали Ему: «Где, Господи?» Он ответил им: «Где тело[b], там и соберутся стервятники[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «орлы». Греческое слово обычно означает орлов, но в данном контексте может обозначать питающихся падалью птиц.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «мёртвое тело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: они спросили
  rationale: Сочетание причастия со сказуемым вводит ответную реплику. По-русски естественнее передать её одним глаголом «спросили», поскольку сама реплика является вопросом; греческий исторический презенс не требуется механически сохранять.
- source_word: Ποῦ
  choice: где
  rationale: Кратко и точно передаёт вопрос о месте.
- source_word: κύριε
  choice: Господи
  rationale: Естественная русская звательная форма обращения к Иисусу, соответствующая κύριε.
- source_word: Ὅπου
  choice: где
  rationale: Сохраняет краткую форму и обобщённый, пословичный характер изречения.
- source_word: σῶμα
  choice: тело
  rationale: Основное значение слова передано прямо, без добавления толкования; контекст допускает значение мёртвого тела, отмеченное в сноске.
- source_word: ἀετοὶ
  choice: стервятники
  rationale: Хотя слово обычно обозначает орлов, образ птиц, собирающихся у тела, вероятнее указывает на питающихся падалью птиц. «Стервятники» ясно передаёт этот смысл современному читателю, а буквальная альтернатива сохранена в сноске.
- source_word: ἐπισυναχθήσονται
  choice: соберутся
  rationale: Естественная русская передача будущего времени в данном образном изречении. Формально пассивное «будут собраны» здесь звучало бы тяжеловесно и могло бы неоправданно подчеркнуть не названного в тексте деятеля.
theological_decisions:
- issue: Толкование образа тела и стервятников
  choice: Передать образ без пояснения его конкретного исторического или эсхатологического референта.
  alternative: Уточнить, что речь идёт о последнем суде, римских войсках либо общем принципе неизбежного суда.
  rationale: Сам греческий текст не называет референт образа; конкретизация устранила бы намеренную смысловую напряжённость и внесла бы спорное толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык; речь краткая, торжественно-сдержанная и сохраняет пословичный характер заключительного образа. Заглавные местоимения при обращении к Иисусу использованы согласно устойчивой русской библейской издательской традиции.
