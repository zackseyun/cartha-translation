id: LUK.17.10
reference: Luke 17:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: ru
  text: 'Так и вы, когда исполните всё, что вам повелено, говорите: «Мы недостойные рабы[a]; мы сделали то, что обязаны были сделать[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «бесполезные рабы», «ничего не стоящие рабы»; по смыслу возможно: «рабы, не заслуживающие награды». Греческое слово может обозначать бесполезность или отсутствие основания притязать на вознаграждение.'
    reason: lexical_alternative
  - marker: b
    text: Или «мы сделали то, что было нашим долгом».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так и вы
  rationale: Кратко и естественно связывает обращённый к ученикам вывод с предшествующим примером.
- source_word: ὅταν ποιήσητε
  choice: когда исполните
  rationale: Сочетание ὅταν с аористом сослагательного наклонения указывает на действие, завершённое перед повелением «говорите»; «исполните» также естественно сочетается с приказанием.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: всё, что вам повелено
  rationale: Передаёт властный характер διατάσσω, не смягчая его до значения простого поручения.
- source_word: λέγετε
  choice: говорите
  rationale: Настоящее повелительное наклонение естественно передаётся формой «говорите», допускающей обычное или повторяющееся действие.
- source_word: Δοῦλοι
  choice: рабы
  rationale: В непосредственном контексте изображены отношения господина и раба, поэтому «рабы» точнее сохраняет социальную и риторическую силу образа, чем «слуги».
- source_word: ἀχρεῖοί
  choice: недостойные
  rationale: В данном контексте слово указывает на отсутствие заслуги и права требовать награды. «Недостойные» сохраняет краткость и богословское напряжение, а буквальные и поясняющие варианты приведены в сноске.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: то, что обязаны были сделать
  rationale: Передаёт выраженное глаголом ὀφείλω значение обязанности или долга без архаичного оборота.
- source_word: πεποιήκαμεν
  choice: мы сделали
  rationale: Русская форма совершенного вида естественно передаёт завершённость действия и его актуальный результат.
theological_decisions:
- issue: Передача δοῦλοι в наставлении об ученичестве
  choice: рабы
  alternative: слуги
  rationale: Пример прямо построен на положении раба по отношению к господину. Выбор «рабы» сохраняет зависимый статус участников образа и не добавляет конфессионального толкования.
- issue: Смысл ἀχρεῖοι
  choice: недостойные
  alternative: бесполезные; ничего не стоящие; не заслуживающие награды
  rationale: Фраза подчёркивает, что исполнение обязанности не даёт особой заслуги и не ставит господина в долг. «Недостойные» не сводит значение к утверждению о полной бесполезности, но сноска сохраняет реальный диапазон греческого слова.
translation_notes:
  register: Современный литературный русский язык; речь краткая и назидательная. Сохранены властный оттенок повеления, жёсткость образа рабства и неоднозначность ἀχρεῖοι, при этом основной текст остаётся понятным обычному читателю.
