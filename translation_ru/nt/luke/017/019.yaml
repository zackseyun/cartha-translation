  text: καὶ εἶπεν αὐτῷ· Ἀναστὰς πορεύου· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: ru
  text: 'И Он сказал ему: «Встань и иди. Твоя вера[a] спасла тебя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «доверие». Греческое слово может обозначать веру, доверие или верность; здесь «вера» является наиболее естественным переводом.
    reason: lexical_alternative
  - marker: b
    text: Или «исцелила тебя» или «сделала тебя здоровым». Греческий глагол может обозначать спасение, избавление или исцеление.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: сказал
  rationale: Обычная и естественная передача повествовательной формы λέγω без дополнительной интерпретации.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж местоимения прямо указывает на исцелённого самарянина; добавлять слово «человеку» нет необходимости.
- source_word: Ἀναστὰς
  choice: встань
  rationale: Аористное причастие употреблено вместе с последующим повелением и естественно передаётся по-русски первым однородным повелительным глаголом.
- source_word: πορεύου
  choice: иди
  rationale: Кратко и естественно передаёт повелительную форму πορεύομαι, не добавляя отсутствующего в греческом тексте значения «своей дорогой».
- source_word: πίστις
  choice: вера
  rationale: Основное соответствие в данном контексте; сохраняет религиозный смысл и допускает оттенок личного доверия, отмеченный в сноске.
- source_word: σέσωκέν
  choice: спасла
  rationale: Передаёт широкий смысл σῴζω и не сводит высказывание только к телесному исцелению. Русское прошедшее время здесь естественно выражает совершившееся действие с сохраняющимся результатом.
- source_word: σε
  choice: тебя
  rationale: Естественная передача прямого дополнения во втором лице единственного числа.
theological_decisions:
- issue: Значение σέσωκέν σε в рассказе об исцелении
  choice: спасла тебя
  alternative: исцелила тебя; сделала тебя здоровым
  rationale: Глагол σῴζω может обозначать как спасение, так и исцеление. Поскольку телесное очищение получили все десять, а эти слова обращены к вернувшемуся и прославившему Бога человеку, основной текст сохраняет более широкое «спасла», не исключая медицинского оттенка.
- issue: Оттенок πίστις
  choice: вера
  alternative: доверие
  rationale: В данном контексте речь идёт о доверительном отклике человека на Иисуса. «Вера» остаётся наиболее ёмким соответствием, а возможный оттенок «доверия» указан в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным звучанием прямой речи. Местоимение «Он» написано с прописной буквы как традиционное указание на Иисуса, без добавления Его имени. Две греческие повелительные формы переданы естественной парой «Встань и иди».
