base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: ru
  text: 'И они громко воскликнули[a]: «Иисус, Наставник[b], помилуй нас!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подняли голос».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово ἐπιστάτα означает обращение к тому, кто обладает властью и руководит; это не обычное слово «Господь» (кюриос).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз естественно продолжает повествование, не добавляя временного оттенка.
- source_word: αὐτοὶ
  choice: выражено формой глагола «воскликнули»
  rationale: Самостоятельное «они» в русском здесь необязательно; контекст и форма множественного числа ясно указывают на действующих лиц. Усилительное значение местоимения не требует неестественного «они сами».
- source_word: ἦραν φωνὴν
  choice: громко воскликнули
  rationale: Греческое выражение буквально означает «подняли голос» и идиоматически описывает громкий призыв. Выбран естественный современный русский оборот, а буквальный образ сохранён в сноске.
- source_word: λέγοντες
  choice: введено прямой речью после «воскликнули»
  rationale: Отдельное «говоря» после «воскликнули» звучало бы по-русски тяжеловесно; содержание причастия естественно передано прямой речью.
- source_word: Ἰησοῦ
  choice: Иисус
  rationale: Форма обращения личного имени передана традиционным русским написанием.
- source_word: ἐπιστάτα
  choice: Наставник
  rationale: В Евангелии от Луки это обращение к тому, кто обладает руководящей властью. «Наставник» передаёт уважение и авторитет, не смешивая данный титул с κύριος — «Господь».
- source_word: ἐλέησον ἡμᾶς
  choice: помилуй нас
  rationale: Краткая, настойчивая просьба о сострадательной помощи; русский глагол сохраняет как смысл милости, так и прямой объект.
theological_decisions:
- issue: Передача обращения ἐπιστάτα к Иисусу
  choice: Наставник
  alternative: Господь; Учитель
  rationale: В источнике стоит ἐπιστάτης, а не κύριος. Поэтому «Господь» неоправданно стирало бы лексическое различие и усиливало бы титул сверх значения данного слова. «Наставник» естественно выражает признание авторитета; «Учитель» могло бы смешать ἐπιστάτης с διδάσκαλος.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Эмоциональная настойчивость передана восклицанием; громкость, заложенная в идиоме, выражена наречием «громко».
