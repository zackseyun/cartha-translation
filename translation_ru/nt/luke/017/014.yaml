  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: ru
  text: 'Увидев их, Он сказал им: «Пойдите, покажитесь священникам».[a] И пока они шли, очистились.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Повеление показаться священникам связано с предписанным Законом осмотром человека, очистившегося от кожной болезни; см. Левит 14.
    reason: cross_reference
  - marker: b
    text: 'Или: «стали чистыми». Греческий глагол может обозначать очищение и в телесном, и в ритуальном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Увидев их
  rationale: Аористное причастие передаёт действие, предшествующее словам Иисуса; местоимение «их» естественно восполняется из ближайшего контекста.
- source_word: Πορευθέντες
  choice: Пойдите
  rationale: Причастие употреблено в сочетании с повелительной формой ἐπιδείξατε и по-русски естественно передаётся отдельным повелением.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: покажитесь
  rationale: Возвратная форма ясно и естественно передаёт требование предстать перед священниками для осмотра.
- source_word: τοῖς ἱερεῦσιν
  choice: священникам
  rationale: Речь идёт о священниках, проводивших предписанный Законом осмотр; русский язык здесь не требует отдельного эквивалента греческого артикля.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: пока они шли
  rationale: 'Оборот обозначает одновременность: очищение произошло в пути.'
- source_word: ἐκαθαρίσθησαν
  choice: очистились
  rationale: Глагол καθαρίζω в данном контексте соединяет телесное избавление от болезни и восстановление ритуальной чистоты; «очистились» сохраняет обе стороны смысла.
theological_decisions:
- issue: Передача языка очищения в контексте кожной болезни и священнического осмотра
  choice: очистились
  alternative: исцелились
  rationale: Греческий текст говорит именно об очищении, а не использует обычный глагол исцеления. Выбранный вариант сохраняет связь как с телесным восстановлением, так и с ритуальной чистотой, не сводя смысл лишь к одному из них.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и повествовательный. Заглавное «Он» употреблено как традиционная русская ссылка на Иисуса без добавления имени, отсутствующего в стихе. Маркеры сносок размещены при тех выражениях, которые они поясняют.
