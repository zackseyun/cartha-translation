  source_fidelity: 'Текст точно передаёт греческий оригинал: временное причастие ἰδών передано как «Увидев их», повелительная конструкция Πορευθέντες ἐπιδείξατε — естественным «Пойдите, покажитесь», а ἐν τῷ ὑπάγειν ... ἐκαθαρίσθησαν — «пока они шли, очистились». «Очистились» обоснованно сохраняет как телесный, так и ритуальный оттенок καθαρίζω, не подменяя его более узким «исцелились».'
