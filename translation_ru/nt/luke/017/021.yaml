  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: ru
  text: 'И не скажут: «Вот, здесь!» — или: «Там!» Ведь вот Царство Божье — среди вас[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутри вас». Греческое выражение может указывать как на внутреннее пребывание, так и на присутствие среди группы людей.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: И не скажут
  rationale: Продолжает отрицание предыдущей мысли; по-русски это звучит естественнее, чем более тяжеловесное «И также не скажут».
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: '«Вот, здесь!» — или: «Там!»'
  rationale: Сохраняет указательный характер ἰδού и симметрию пространственных наречий ὧδε и ἐκεῖ в естественной русской форме.
- source_word: ἰδοὺ γὰρ
  choice: Ведь вот
  rationale: «Ведь» передаёт пояснительную функцию γάρ, а «вот» — привлечение внимания посредством ἰδού без архаичного «се».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшийся, прозрачный и современный русский эквивалент, сохраняющий царственную и эсхатологическую многозначность выражения.
- source_word: ἐντὸς ὑμῶν
  choice: среди вас
  rationale: При обращении к группе собеседников выражение естественно допускает корпоративно-пространственный смысл «среди вас». Возможное внутреннее значение сохранено в сноске.
- source_word: ἐστιν
  choice: — среди вас
  rationale: В русском настоящем времени связка «есть» обычно опускается; тире ясно передаёт именную конструкцию и акцентирует местонахождение.
theological_decisions:
- issue: Значение ἐντὸς ὑμῶν
  choice: Царство Божье — среди вас
  alternative: Царство Божье — внутри вас
  rationale: Греческое выражение допускает как значение внутреннего нахождения, так и значение присутствия среди группы. Контекст обращения к множеству людей и разговор о наблюдаемом местонахождении поддерживают основной вариант «среди вас», однако подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, но без архаизмов. «Вот» сохранено как естественный эквивалент ἰδού; «Царство Божье» выбрано вместо более книжного «Царство Бога».
