id: LUK.17.30
reference: Luke 17:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: ru
  text: Так будет и в тот день, когда откроется Сын Человеческий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так же будет»; «Подобным образом будет». Греческий оборот отсылает к предшествующим примерам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Так будет и
  rationale: 'Оборот отсылает к предшествующим примерам — дням Ноя и Лота — и выражает соответствие: тогда будет так же. Формулировка естественна по-русски и вместе с ἔσται сохраняет направленность в будущее.'
- source_word: ἔσται
  choice: будет
  rationale: Будущая форма εἰμί прямо передана русским будущим временем.
- source_word: ᾗ ἡμέρᾳ
  choice: в тот день, когда
  rationale: Дательный времени передан естественным русским оборотом, сохраняющим указание на определённый день.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохранено традиционное евангельское наименование Иисуса, узнаваемое в русской библейской речи и связанное с образом из Дан 7.
- source_word: ἀποκαλύπτεται
  choice: откроется
  rationale: Русский возвратный глагол естественно передаёт пассивное значение раскрытия или явления и не подменяет его идеей простого прихода.
theological_decisions:
- issue: Передача эсхатологического титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Сын человека; Человеческий Сын
  rationale: Традиционная форма сохраняет узнаваемость титула и его связь с Дан 7, не сводя выражение к общему обозначению человека.
- issue: Значение ἀποκαλύπτεται в контексте
  choice: откроется
  alternative: явится; придёт
  rationale: Выбранный вариант сохраняет идею откровения и открытого обнаружения. «Придёт» вводило бы значение движения, которого сам греческий глагол не выражает; «явится» возможно, но слабее передаёт лексическую связь с откровением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Инверсия устранена ради ясности; традиционный титул «Сын Человеческий» сохранён.
