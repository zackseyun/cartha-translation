id: LUK.17.25
reference: Luke 17:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: ru
  text: Но прежде Ему надлежит много пострадать и быть отвергнутым этим поколением.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: прежде
  rationale: Наречие выражает временную последовательность; «прежде» естественно связывает предстоящие страдания с событиями, о которых сказано ранее.
- source_word: δὲ
  choice: но
  rationale: Передаёт лёгкое противопоставление между будущим явлением Сына Человеческого и необходимыми до него страданиями.
- source_word: δεῖ
  choice: надлежит
  rationale: Сохраняет сильное значение необходимости, характерное для Луки, не добавляя прямо не названного указания на Божий замысел.
- source_word: αὐτὸν
  choice: Ему
  rationale: Дательный при безличной конструкции «Ему надлежит» естественно передаёт греческий винительный субъекта при инфинитивах; прописная буква указывает на ранее названного Сына Человеческого.
- source_word: πολλὰ παθεῖν
  choice: много пострадать
  rationale: По-русски это естественно и ёмко передаёт широкий объём предстоящих страданий; буквальное «претерпеть многое» звучит менее современно.
- source_word: ἀποδοκιμασθῆναι
  choice: быть отвергнутым
  rationale: Передаёт отвержение после непринятия или отрицательной оценки, не вводя излишне технического оттенка.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: этим поколением
  rationale: При страдательном глаголе ἀπό обозначает источник или действующее лицо отвержения; творительный падеж естественно выражает это по-русски, а «поколение» сохраняет временную соотнесённость γενεά.
theological_decisions:
- issue: Смысл необходимости в δεῖ применительно к страданиям Сына Человеческого
  choice: «надлежит» — необходимость сохранена без явного пояснения её источника
  alternative: «должен»; «необходимо, чтобы Он»; прямое уточнение «по Божьему замыслу»
  rationale: У Луки δεῖ нередко указывает на необходимость в рамках Божьего замысла, особенно в предсказаниях страданий. Перевод сохраняет этот богословский вес, но не превращает подразумеваемое в прямое пояснение.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской возвышенностью. «Надлежит» несколько торжественнее разговорного «должен», но остаётся понятным и точно передаёт безличную конструкцию необходимости. Местоимение «Ему» оформлено с прописной буквы согласно распространённой русской библейской издательской норме.
