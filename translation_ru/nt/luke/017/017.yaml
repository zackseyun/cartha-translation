  text: 'Тогда Иисус сказал в ответ: «Разве не десять были очищены? Где же девять?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Тогда Иисус сказал в ответ
  rationale: Причастие ἀποκριθείς вместе с εἶπεν образует обычную формулу введения речи. «Сказал в ответ» естественно передаёт её по-русски без буквального и тяжеловесного «отвечая, сказал»; начальное δέ обозначает развитие повествования и передано словом «тогда».
- source_word: Οὐχὶ
  choice: Разве не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; русское «разве не» сохраняет это ожидание.
- source_word: οἱ δέκα
  choice: все десять
  rationale: Субстантивированное числительное с артиклем указывает на всю ранее названную группу из десяти человек. Слово «все» делает эту отсылку естественной и ясной по-русски, хотя формально отдельного πᾶς в греческом нет.
- source_word: ἐκαθαρίσθησαν
  choice: очистились
  rationale: Пассивная форма καθαρίζω означает «были очищены, стали чистыми». Русское «очистились» естественно выражает результат и сохраняет как телесный, так и обрядовый оттенок, не сводя значение только к исцелению.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Где же остальные девять?
  rationale: Второе δέ выделяет контраст между вернувшимся человеком и девятью другими; «же» передаёт этот контраст, а «остальные» естественно обозначает девятерых из уже известной группы.
theological_decisions:
- issue: Значение καθαρίζω при исцелении прокажённых
  choice: очистились
  alternative: исцелились
  rationale: Глагол обозначает очищение и в данном контексте охватывает восстановление от болезни вместе со статусом чистоты. Вариант «исцелились» неоправданно сужает значение до физического выздоровления.
translation_notes:
  register: Современный литературный русский язык; риторические вопросы переданы кратко и выразительно. Формула речи звучит естественно, а ключевой образ очищения сохранён.
