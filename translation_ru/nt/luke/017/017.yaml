  verdict: revise
  source_fidelity: Текст в целом точно передаёт риторические вопросы и повествовательное δέ. Однако «все десять» добавляет эксплицитное «все», которого в греческом нет, а «остальные девять» заменяет простое «девять» уточнением, отсутствующим в оригинале. «Очистились» несколько ослабляет страдательный залог ἐκαθαρίσθησαν; в данном контексте более точно «были очищены».
  naturalness: «Тогда Иисус сказал в ответ» — естественная современная формула. «Разве не десять были очищены? Где же девять?» звучит литературно, кратко и сохраняет выразительную риторику оригинала.
  terminology: «Были очищены» сохраняет терминологическую связь с καθαρίζω и его физико-ритуальный оттенок, не сужая смысл до «исцелились».
