  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: ru
  text: 'Затем Он сказал Своим ученикам: «Невозможно, чтобы не приходили соблазны[a], но горе тому, через кого они приходят!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ловушки», «поводы ко греху» или «то, что приводит к падению». Греческое слово σκάνδαλα обозначает то, обо что человек спотыкается в нравственном или духовном отношении и что может привести его ко греху.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Затем Он сказал
  rationale: Частица δέ здесь служит лёгкой связкой в повествовании; «затем» естественно передаёт переход, не придавая ему сильного противопоставления.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: Своим ученикам
  rationale: Так естественно по-русски передаётся обращение к ученикам Иисуса с сохранением выраженного в греческом тексте притяжательного αὐτοῦ.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Невозможно
  rationale: Слово ἀνένδεκτον выражает невозможность; следующая конструкция с отрицанием показывает, что речь идёт о невозможности полного отсутствия соблазнов.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: чтобы не приходили соблазны
  rationale: Конструкция с субстантивированным инфинитивом и μή обозначает то, что невозможно. Русское придаточное предложение ясно и естественно сохраняет отрицательную форму оригинала.
- source_word: σκάνδαλα
  choice: соблазны
  rationale: «Соблазны» — ёмкое русское библейское слово для того, что становится ловушкой, приводит к греху или духовному падению. Примечание раскрывает метафору и сохраняет широту значения.
- source_word: πλὴν οὐαὶ
  choice: но горе
  rationale: πλήν вводит резкий переход от неизбежности таких явлений к ответственности человека, через которого они приходят; «но горе» кратко и точно передаёт этот поворот.
- source_word: δι’ οὗ
  choice: тому, через кого
  rationale: Сохраняется личное местоименное выражение в единственном числе и значение посредничества, выраженное διά.
- source_word: ἔρχεται
  choice: они приходят
  rationale: Хотя греческий глагол стоит в единственном числе, по смыслу он относится к τὰ σκάνδαλα; русское множественное число требуется грамматическим согласованием с «соблазны».
theological_decisions:
- issue: Значение σκάνδαλα в нравственном наставлении
  choice: В основном тексте употреблено «соблазны» с пояснением в сноске.
  alternative: «ловушки», «поводы ко греху», «то, что приводит к падению»
  rationale: Греческое слово может обозначать ловушку, препятствие, повод ко греху или то, что приводит человека к нравственному и духовному падению. «Соблазны» сохраняет принятую библейскую ёмкость термина, а сноска предотвращает его чрезмерно узкое бытовое понимание.
- issue: Неизбежность соблазнов и личная ответственность
  choice: 'Сохранено противопоставление: их отсутствие невозможно, однако виновный всё равно подлежит осуждению.'
  alternative: Переформулировать как простое утверждение, что соблазны неизбежны.
  rationale: Отрицательная форма оригинала и союз πλὴν удерживают богословское напряжение между неизбежностью появления соблазнов и ответственностью того, через кого они приходят; перевод не пытается это напряжение снять.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и понятным синтаксисом. «Соблазны» сохраняет библейскую узнаваемость и смысловую широту, а сноска поясняет его без конфессионального истолкования.
