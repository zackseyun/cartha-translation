  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: ru
  text: Когда Он входил в одно селение, Его встретили десять мужчин, поражённых проказой[a]. Они стояли поодаль[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, традиционно переводимое как «проказа», могло обозначать различные кожные заболевания, а не только болезнь Хансена в современном медицинском смысле.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вдали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Когда Он входил
  rationale: Генитив абсолютный с причастием настоящего времени обозначает действие, происходящее одновременно с действием главного предложения; несовершенный вид «входил» сохраняет эту длительность.
- source_word: εἴς τινα κώμην
  choice: в одно селение
  rationale: Местоимение τινα имеет неопределённое значение. Русское «одно селение» естественно передаёт его, не предполагая, что селение было ранее названо или известно читателю.
- source_word: ἀπήντησαν
  choice: встретили
  rationale: Глагол означает «встретить» или «выйти навстречу». «Встретили» кратко и естественно, при этом не добавляет к тексту лишнего описания движения.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: десять мужчин, поражённых проказой
  rationale: Так сохраняются и существительное ἄνδρες «мужчины», и описательная характеристика λεπροί. Формулировка остаётся понятной современному читателю, а сноска предупреждает против неоправданно точного современного диагноза.
- source_word: οἳ ἔστησαν
  choice: Они остановились
  rationale: В данном контексте ἵστημι указывает на то, что мужчины заняли положение и остались стоять. Отдельное предложение звучит по-русски естественнее тяжёлого относительного оборота, не меняя связи с предшествующим подлежащим.
- source_word: πόρρωθεν
  choice: поодаль
  rationale: Наречие обозначает пространственную удалённость. «Поодаль» — ясный и естественный современный русский эквивалент.
theological_decisions:
- issue: Передача обозначения болезни λεπροί
  choice: мужчин, поражённых проказой
  alternative: прокажённых мужчин; мужчин с проказой
  rationale: Древнегреческое λεπρός обозначало человека с тяжёлым кожным заболеванием, но не обязательно задавало точный современный диагноз болезни Хансена. Основной текст сохраняет традиционно узнаваемое «проказа», а сноска удерживает историко-медицинскую неопределённость исходного термина.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным строем. Местоимение «Он» написано с прописной буквы как устоявшееся уважительное обозначение Иисуса. Синтаксис слегка разгружен разделением на два предложения; смысл и последовательность греческого текста сохранены.
