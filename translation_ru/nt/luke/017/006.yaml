  source_fidelity: 'Основная передача образов и лексики точна: «Господь», «вера», «шелковица», повеления дереву и его повиновение соответствуют греческому тексту. Однако «Если бы у вас была» придаёт протасису явно контрфактический характер, тогда как в SBLGNT стоит εἰ ἔχετε, настоящее изъявительное «если у вас есть». Условная потенциальность выражена ἄν в последующих глаголах.'
  naturalness: Исправленный вариант сохраняет современный литературный строй. Сочетание настоящего условия с условным следствием допустимо и передаёт гипотетический характер изречения без добавления утверждения, что веры у адресатов нет.
  terminology: «Шелковица» — точное и понятное современное название для συκάμινος (тутового дерева), не смешиваемое с συκομορέα. В сноске традиционное название следует дать в словарной форме «сикомина», а не в форме «сикомине».
