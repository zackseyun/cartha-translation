  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: ru
  text: 'Господь сказал: «Если у вас есть вера, как горчичное зерно, вы сказали бы этой шелковице[a]: „Будь вырвана с корнем и посажена в море“, — и она послушалась бы вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сикомина» — традиционная передача греческого названия тутового дерева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Передаёт устойчивый повествовательный и христологический титул в Евангелии от Луки без ослабления до «Учитель» или «Господин».
- source_word: πίστιν
  choice: вера
  rationale: В данном изречении обозначает доверие Богу; «вера» сохраняет широкий смысл греческого слова и не сужает его до одной лишь субъективной уверенности.
- source_word: ὡς κόκκον σινάπεως
  choice: как горчичное зерно
  rationale: Сохраняет открытое сравнение, не добавляя отсутствующего в греческом тексте слова «мала» и не сводя образ исключительно к размеру.
- source_word: συκαμίνῳ
  choice: шелковица
  rationale: Современное и понятное русское название тутового дерева, соответствующее συκάμινος; традиционный вариант отмечен в сноске.
- source_word: ἐλέγετε ἂν
  choice: вы сказали бы
  rationale: Условное наклонение естественно передаёт потенциально-контрфактическую конструкцию с ἄν.
- source_word: Ἐκριζώθητι
  choice: Будь вырвана с корнем
  rationale: Сохраняет пассивный императив и образ полного искоренения.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: посажена в море
  rationale: Передаёт глагол «сажать» и сохраняет намеренно парадоксальный образ, не заменяя его более объяснительным «пересажена».
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: она послушалась бы вас
  rationale: Передаёт повиновение приказу и согласуется с естественным для русского языка женским родом слова «шелковица».
theological_decisions:
- issue: Значение πίστις в изречении о чуде
  choice: вера
  alternative: доверие; верность
  rationale: Контекст говорит о доверии Богу, связанном с невозможным для человека действием, однако слово «вера» сохраняет присущую πίστις смысловую широту и не превращает стих в формулу о психологической уверенности.
- issue: Условный характер высказывания
  choice: Если бы у вас была… вы сказали бы… она послушалась бы
  alternative: Если у вас есть… вы могли бы сказать… она послушалась бы
  rationale: Так по-русски естественно передаётся сочетание εἰ с формами, содержащими ἄν, как гипотетическое условие. Перевод не утверждает отдельно ни наличие, ни отсутствие у учеников веры.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельской речи. Синтаксис условного предложения сделан естественным для русского; буквальная пассивная форма повеления сохранена ради необычного и сильного образа оригинала.
