source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: ru
  text: По пути в Иерусалим Иисус проходил[a] между Самарией и Галилеей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проходил по пограничной области Самарии и Галилеи». Греческое выражение может означать движение между двумя областями или через разделяющую их пограничную местность.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν τῷ πορεύεσθαι
  choice: По пути
  rationale: Луканская повествовательная формула и конструкция одновременности естественно переданы по-русски без архаического «и случилось»; сохраняется обстоятельство продолжающегося пути.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: εἰς обозначает направление к месту назначения; это обычная русская форма для движения к городу.
- source_word: αὐτός
  choice: Иисус
  rationale: Явное местоимение указывает на главного участника повествования; имя делает отдельный русский стих ясным, не придавая искусственного усиления «сам».
- source_word: διήρχετο
  choice: проходил
  rationale: Несовершенный вид передаёт продолжавшееся движение и естественно сочетается с обозначением маршрута.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: между Самарией и Галилеей
  rationale: Оборот допускает понимание движения между двумя областями или по пограничной зоне; основной текст выбирает краткую и естественную формулировку, а неоднозначность отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование изложено просто и достойно. Архаическая калька «и случилось» опущена ради естественного русского синтаксиса, а географическая неоднозначность исходного текста сохранена посредством сноски.
