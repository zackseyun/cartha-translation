id: LUK.17.35
reference: Luke 17:35
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: ru
  text: 'Две женщины будут молоть вместе[a]: одну возьмут[b], а другую оставят.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одном месте». Греческое выражение может означать как совместное действие, так и нахождение в одном месте.'
    reason: lexical_alternative
  - marker: b
    text: Слова «возьмут» сами по себе не уточняют, идёт ли речь о спасении или о суде; это определяется более широким контекстом.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο ἀλήθουσαι
  choice: Две женщины будут молоть
  rationale: Форма женского рода ἀλήθουσαι показывает, что речь идёт о двух женщинах; будущее время передано естественной русской конструкцией «будут молоть».
- source_word: ἐπὶ τὸ αὐτό
  choice: вместе
  rationale: Выражение обозначает совместное нахождение или действие в одном месте; «вместе» естественно передаёт оба оттенка в данном контексте.
- source_word: παραλημφθήσεται
  choice: возьмут
  rationale: Будущее страдательное значение передано неопределённо-личной конструкцией, естественной для русского языка; она не уточняет, взята ли женщина ради спасения или суда.
- source_word: ἡ δὲ ἑτέρα
  choice: а другую
  rationale: «А» ясно выражает сопоставление двух женщин, не усиливая его до резкого противопоставления.
- source_word: ἀφεθήσεται
  choice: оставят
  rationale: Прямое и нейтральное соответствие, не добавляющее значений «бросят» или «оставят позади».
theological_decisions:
- issue: Означает ли пара παραλημφθήσεται / ἀφεθήσεται спасение взятой и суд над оставленной или наоборот?
  choice: «одну возьмут, а другую оставят» без пояснения исхода
  alternative: «одну заберут на суд, а другую пощадят» либо «одну возьмут для спасения, а другую оставят для суда»
  rationale: Сам стих говорит о разделении, но не определяет однозначно богословское значение каждого действия; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и торжественно нейтральная. Неявное в греческом подлежащее пассивных форм передано русскими неопределённо-личными глаголами.
