  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: ru
  text: 'Так же было и во дни Лота[a]: люди ели, пили, покупали, продавали, сажали и строили.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подобно тому, как было во дни Лота».'
    reason: Сохраняет более явное раздельное выражение сравнительных значений ὁμοίως и καθὼς.
lexical_decisions:
- source_word: ὁμοίως καθὼς ἐγένετο
  choice: Так же было и
  rationale: Передаёт двойную сравнительную связь («подобным образом, как было») естественной современной русской конструкцией, не утяжеляя фразу буквальным повтором.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: во дни Лота
  rationale: Устойчивый и понятный библейский временной оборот; сохраняет достоинство стиля без архаической перегруженности.
- source_word: ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν
  choice: люди ели, пили, покупали, продавали, сажали и строили
  rationale: Русский несовершенный вид естественно передаёт длительные и привычные действия, выраженные греческими имперфектами. Слово «люди» проясняет подразумеваемое подлежащее множественного числа.
