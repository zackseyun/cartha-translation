  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: ru
  text: Ведь как молния, сверкая от одного края неба до другого[a], сияет, так будет и Сын Человеческий в свой день[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «из одной области под небом в другую область под небом». В греческом тексте выражение «под небом» повторяется.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «в день Его». Речь идёт о времени, связанном с Сыном Человеческим; выражение намеренно оставлено широким.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь как
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «как» естественно вводит сравнение.
- source_word: ἡ ἀστραπὴ ἀστράπτουσα
  choice: молния, сверкая
  rationale: Сохраняются образ молнии и причастная форма, передающая яркое действие.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν
  choice: от одного края неба до другого
  rationale: Это естественный русский эквивалент пространственного выражения; буквальное повторение «под небом» поясняется в сноске.
- source_word: λάμπει
  choice: сияет
  rationale: Отдельный глагол отличает λάμπει от предшествующего ἀστράπτουσα и сохраняет два связанных, но не тождественных действия.
- source_word: οὕτως ἔσται
  choice: так будет
  rationale: Прямо сохраняет структуру сравнения и форму будущего времени.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся и прозрачная передача титула без истолковывающего пересказа.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: в свой день
  rationale: Сохраняет принадлежность дня Сыну Человеческому и намеренно не уточняет, идёт ли речь о пришествии, суде или ином аспекте эсхатологического события.
theological_decisions:
- issue: Значение выражения «Сын Человеческий в свой день» в эсхатологическом контексте
  choice: Сохранено широкое выражение «в свой день».
  alternative: «при Своём пришествии» или «в день суда»
  rationale: Греческий текст не уточняет здесь ни пришествие, ни суд; более конкретная формулировка разрешила бы оставленную текстом богословскую широту.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Идиоматическое пространственное выражение вынесено в основной текст, а необычная буквальная структура греческого сохранена в сноске. Местоимение «свой» написано со строчной буквы согласно нейтральной современной орфографической практике.
