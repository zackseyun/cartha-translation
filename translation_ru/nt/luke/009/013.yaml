source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: ru
  text: 'Но Он сказал им: «Вы[a] дайте им поесть». Они же ответили: «У нас не больше пяти хлебов и двух рыб — разве что нам самим пойти и купить еды для всего этого народа[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным подчёркиванием: «Дайте им поесть вы сами».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для всей этой толпы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: Вы дайте им поесть
  rationale: Передаёт повеление естественным современным русским оборотом, а явное ὑμεῖς — постановкой «Вы» перед глаголом, сохраняя его эмфатическую силу.
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: У нас не больше
  rationale: Точно передаёт отрицательное ограничение количества и естественно звучит по-русски.
- source_word: ἄρτοι πέντε
  choice: пять хлебов
  rationale: ἄρτοι обозначает отдельные хлебы; традиционное русское «пять хлебов» не уточняет без достаточных оснований их форму как буханки или лепёшки.
- source_word: ἰχθύες δύο
  choice: две рыбы
  rationale: Прямой и естественный эквивалент греческого множественного числа в данном контексте.
- source_word: εἰ μήτι
  choice: разве что
  rationale: Сохраняет значение исключения, а также оттенок предположительности или практического возражения, не усиливая эмоциональный тон.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: нам самим пойти и купить
  rationale: Причастие естественно передано однородным инфинитивом; «самим» отражает явное ἡμεῖς и подчёркивает, что покупать пришлось бы ученикам.
- source_word: εἰς πάντα τὸν λαὸν τοῦτον βρώματα
  choice: еды для всего этого народа
  rationale: «Еда» естественно передаёт βρώματα, а «весь этот народ» сохраняет коллективное значение λαός и указательное местоимение.
theological_decisions:
- issue: Степень подчёркнутости повеления Иисуса и тон ответа учеников
  choice: Прямое повеление «Вы дайте им поесть» и практическое возражение без добавленной резкости
  alternative: «Дайте им поесть вы сами» и более эмоционально окрашенный ответ
  rationale: Явное ὑμεῖς требует смыслового акцента, но греческий текст сам по себе не обозначает ни упрёка Иисуса, ни раздражения учеников.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формы «поесть», «еды» и «пойти и купить» общеупотребительны и ясны; «пять хлебов» сохраняет предметность оригинала и библейскую естественность без излишней архаизации.
