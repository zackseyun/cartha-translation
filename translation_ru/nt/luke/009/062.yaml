  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: ru
  text: 'Но Иисус сказал: «Никто, положивший руку на плуг и оглядывающийся назад, не пригоден для Царства Божьего».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не подходит для Царства Божьего»; возможно также: «не полезен Царству Божьему». Греческое слово обозначает пригодность или соответствие назначению.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление и ответ Иисуса на предшествующие слова.
- source_word: Οὐδεὶς
  choice: Никто
  rationale: Естественно передаёт универсальное отрицание без ненужного указания на пол.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: положивший руку на плуг
  rationale: Сохраняет конкретный земледельческий образ и начальное действие, выраженное аористным причастием.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: оглядывающийся назад
  rationale: Причастие настоящего времени передаёт продолжающееся или характерное действие; формулировка сохраняет буквальный образ и смысл разделённой решимости.
- source_word: εὔθετός
  choice: пригоден
  rationale: Передаёт значение пригодности или соответствия назначению, не добавляя идеи морального достоинства либо прямого утверждения о конечном спасении.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: для Царства Божьего
  rationale: Дательный падеж при εὔθετος естественно выражен сочетанием «пригоден для»; традиционное «Царство Божье» ясно и сохраняет смысловую широту βασιλεία.
theological_decisions:
- issue: Смысл εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: Передано как «не пригоден для Царства Божьего» — утверждение о пригодности и цельности ученичества.
  alternative: «недостоин войти в Царство Божье» или «не полезен в служении Царству Божьему»
  rationale: Греческий текст говорит о пригодности или соответствии, но не уточняет, имеется ли в виду вхождение в Царство, служение ему или окончательный статус спасения; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксис сохраняет афористичность и земледельческий образ оригинала; «оглядывающийся назад» звучит естественнее буквального «смотрящий на то, что позади».
