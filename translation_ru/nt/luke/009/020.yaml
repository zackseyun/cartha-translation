source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: ru
  text: 'Он сказал им: «А вы кем считаете Меня?» Пётр ответил: «Божьим Мессией[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божьим Христом».'
    reason: Лексическая альтернатива для χριστός.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение имеет контрастное ударение; в русском оно естественно передаётся сочетанием «А вы».
- source_word: τίνα με λέγετε εἶναι
  choice: кем считаете Меня
  rationale: Конструкция λέγετε с винительным и инфинитивом буквально означает «кем вы говорите Меня быть»; «кем считаете Меня» естественно передаёт вопрос об идентичности, хотя возможен более формальный вариант «за кого вы Меня принимаете».
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Сочетание аористного причастия с личной формой глагола речи идиоматично свёрнуто в один русский глагол.
- source_word: χριστός
  choice: Мессия
  rationale: Здесь слово употреблено как титул в исповедании Петра; «Мессия» передаёт значение «Помазанник», а не превращает титул в личное имя.
- source_word: τοῦ θεοῦ
  choice: Божий
  rationale: Русское притяжательное прилагательное естественно и точно передаёт родительный τοῦ θεοῦ в выражении «Божий Мессия».
- source_word: δέ
  choice: Он сказал / А вы / Пётр ответил
  rationale: Первое и третье δέ выполняют связующую повествовательную функцию и не требуют отдельного союза; второе передано контрастным «А».
theological_decisions:
- issue: Передача χριστός в исповедании Петра
  choice: Мессия
  alternative: Христос
  rationale: Контекст представляет χριστός как титул ожидаемого Божьего Помазанника. Перевод «Мессия» ясно сохраняет титульный смысл; традиционный вариант «Христос» указан в сноске.
- issue: Отношение в выражении τοῦ θεοῦ
  choice: Божий Мессия
  alternative: Мессия от Бога
  rationale: Греческий родительный допускает широкое отношение принадлежности или происхождения. «Божий Мессия» сохраняет эту компактность и не уточняет её сверх текста.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Прописная буква в «Меня» соответствует принятой русской библейской орфографии; «Божьим Мессией» согласовано с творительным падежом после «считаете».
