  text: But he turned and rebuked them[a].
translation:
  language: ru
  text: Но Он, обернувшись, упрекнул их[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых поздних рукописях добавлено: «И сказал: „Не знаете, какого вы духа; ведь Сын Человеческий пришёл не губить жизни людей, а спасать их“».'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: обернувшись
  rationale: Аористное причастие от στρέφω обозначает, что Иисус повернулся к ученикам перед тем, как обратиться к ним; деепричастие естественно передаёт сопутствующее предшествующее действие.
- source_word: δὲ
  choice: Но
  rationale: Частица δέ здесь выражает мягкое противопоставление просьбе учеников в предыдущем стихе; русское «но» ясно передаёт этот переход.
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: Глагол ἐπιτιμάω означает строго одёрнуть, укорить или запретить. В библейском повествовательном стиле «запретил им» естественно выражает резкое словесное порицание, не добавляя содержания самой речи.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения относится к Иакову и Иоанну, названным непосредственно перед этим, либо шире к ученикам; русский дательный «им» сохраняет греческую конструкцию и её референциальную широту.
theological_decisions:
- issue: Пространное добавление в поздних рукописях
  choice: 'В основном тексте переведено только краткое чтение SBLGNT: «Но Он, обернувшись, запретил им».'
  alternative: '«Но Он, обернувшись, запретил им и сказал: „Не знаете, какого вы духа; ведь Сын Человеческий пришёл не губить человеческие жизни, а спасать их“».'
  rationale: Пространное высказывание отсутствует в предоставленном греческом тексте и не должно включаться в основной текст. Поскольку оно известно по поздней рукописной традиции и истории переводов, оно приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Он» написано с прописной буквы согласно распространённой русской издательской традиции; синтаксис краток и соответствует лаконичности греческого текста.
