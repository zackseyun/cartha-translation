  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: ru
  text: 'Когда они уходили от Него, Пётр сказал Иисусу: «Наставник, хорошо нам здесь быть. Давайте сделаем три шатра[a]: один для Тебя, один для Моисея и один для Илии», — не зная, что говорит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кущи», «палатки»; традиционно: «скинии». Греческое слово означает временный шатёр или укрытие и, возможно, перекликается с библейскими образами праздника Кущей.'
    reason: Лексические варианты и возможная, но не выраженная прямо в стихе библейско-праздничная ассоциация.
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Когда они стали удаляться от Него
  rationale: Оборот ἐγένετο ἐν τῷ с инфинитивом вводит одновременное обстоятельство; «когда… стали» естественно передаёт начало отделения Моисея и Илии от Иисуса, а «удаляться от Него» сохраняет значение разделения и направление, выраженное ἀπό.
- source_word: Ἐπιστάτα
  choice: Наставник
  rationale: Уважительное обращение, характерное для Луки, указывает на авторитет Иисуса. «Наставник» звучит естественно и не сводит слово исключительно к функции учителя.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: хорошо нам здесь быть
  rationale: Сохраняет прямую оценку καλόν и близко передаёт инфинитивную конструкцию естественным литературным русским.
- source_word: ποιήσωμεν
  choice: Давайте сделаем
  rationale: Побудительный аорист сослагательного наклонения выражает предложение совместного действия. «Сделаем» не добавляет значения строительства, отсутствующего в ποιέω.
- source_word: σκηνὰς
  choice: шатра
  rationale: σκηνή обозначает шатёр или временное укрытие. «Шатёр» понятен современному читателю и лучше, чем «куща», сохраняет образ временного сооружения; возможные библейско-праздничные ассоциации отмечены в сноске.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: не понимая, что говорит
  rationale: Причастный оборот описывает состояние Петра в момент речи. «Не понимая» естественно выражает не только отсутствие фактического знания, но и непонимание смысла собственного предложения; настоящее «говорит» отражает λέγει.
theological_decisions:
- issue: Передача σκηνάς в контексте преображения и возможной связи с праздником Кущей
  choice: шатры
  alternative: кущи; палатки; скинии
  rationale: Сам стих прямо не связывает предложение Петра ни с праздником Кущей, ни со скинией. Нейтральное «шатры» не навязывает такого толкования, но сноска сохраняет традиционные варианты и возможный библейский отголосок.
- issue: Характер заключительной оценки слов Петра
  choice: не понимая, что говорит
  alternative: не зная, что говорит
  rationale: Фраза не уточняет, в чём именно состояло непонимание Петра. Перевод сохраняет эту открытость и не приписывает ему конкретной богословской ошибки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по русской издательской традиции. Синтаксис сделан плавным, но последовательность событий и незавершённое понимание Петра сохранены.
