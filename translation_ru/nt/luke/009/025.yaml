  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: ru
  text: Ибо какая польза человеку, если он приобретёт весь мир, а самого себя погубит или утратит?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «потеряет самого себя или лишится самого себя». В греческом тексте буквально говорится о самом человеке — «себя», а не употребляется обычное слово «душа» или «жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Ибо какая человеку польза
  rationale: Передаёт пояснительную силу γὰρ и естественно формулирует риторический вопрос о выгоде или пользе.
- source_word: ἄνθρωπος
  choice: человеку
  rationale: ἄνθρωπος здесь обозначает человека вообще; русское «человеку» сохраняет обобщающий характер без ненужного уточнения пола.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: если он приобретёт весь мир
  rationale: Условная конструкция естественно передаёт обстоятельственное значение причастия; «приобретёт» сохраняет образ обретения выгоды и хорошо сочетается с «весь мир».
- source_word: ἑαυτὸν δὲ ἀπολέσας
  choice: а себя погубит
  rationale: Сохраняет прямое значение возвратного местоимения «себя», не заменяя его словами «душа» или «жизнь»; «погубит» передаёт более сильную возможность значения ἀπόλλυμι, чем простое «потеряет».
- source_word: ἢ ζημιωθείς
  choice: или повредит себе
  rationale: Передаёт разделительное ἢ и пассивную идею понесённого ущерба, сохраняя отличие от предшествующего «погубит».
theological_decisions:
- issue: Значение ἑαυτόν применительно к участи человека
  choice: себя
  alternative: свою душу; свою жизнь
  rationale: В греческом тексте стоит возвратное местоимение, а не ψυχή. «Себя» сохраняет широкую антропологическую формулировку и не сводит смысл только к душе или земной жизни.
- issue: Соотношение ἀπολέσας и ζημιωθείς
  choice: погубит или повредит себе
  alternative: потеряет или лишится себя
  rationale: 'Перевод сохраняет два координированных, но не полностью тождественных выражения: полную погибель и понесённый ущерб, не превращая их в одну заранее определённую доктринальную категорию.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Ибо» сохраняет связь с предыдущим высказыванием; синтаксис риторического вопроса остаётся ясным для широкого читателя.
