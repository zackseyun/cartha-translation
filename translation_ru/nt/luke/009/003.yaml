base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: ru
  text: 'И сказал им: «Ничего не берите в дорогу: ни посоха, ни дорожной сумы[a], ни хлеба, ни денег[b]; и не имейте по две туники[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сумы для дорожных припасов.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «серебра»; здесь имеются в виду деньги.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческое выражение имеет распределительный смысл: «по две каждому». Хитон — одежда, которую носили непосредственно на теле, под верхней одеждой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Ничего не берите в дорогу
  rationale: Естественная русская передача запрета и идиоматического указания на дорожные приготовления.
- source_word: ῥάβδον
  choice: посоха
  rationale: В контексте путешествия речь, вероятнее всего, о посохе путника; слово точно и привычно для библейского повествования.
- source_word: πήραν
  choice: дорожной сумы
  rationale: πήρα — сумка для припасов, которую брали в путь; «дорожная сума» сохраняет конкретный исторический образ без чрезмерной описательности.
- source_word: ἄρτον
  choice: хлеба
  rationale: Прямая и естественная передача названного в греческом тексте продукта без обобщения до «еды».
- source_word: ἀργύριον
  choice: денег
  rationale: Буквально слово обозначает серебро, но здесь функционально означает деньги; это значение ясно передаёт практический смысл наставления.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: не имейте по две нижние одежды
  rationale: «По две» явно сохраняет распределительное значение ἀνά, а «нижняя одежда» передаёт историческую функцию χιτών понятнее современному читателю, чем малознакомая «туника».
