  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: ru
  text: 'Но Иисус сказал ему: «Не препятствуйте ему[a], ведь кто не против вас, тот за вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не мешайте ему»; или: «Не запрещайте ему».'
    reason: Лексема κωλύω допускает значения «препятствовать», «мешать» и «запрещать»; в данном контексте все они возможны.
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Но Иисус сказал ему
  rationale: δέ здесь слегка противопоставляет ответ Иисуса предшествующим словам Иоанна; «но» естественно передаёт эту связь. Местоимение «ему» сохраняет формулировку греческого текста, не заменяя его именем Иоанна.
- source_word: Μὴ κωλύετε
  choice: Не препятствуйте ему
  rationale: κωλύω означает препятствовать, мешать или запрещать. Множественное число повелительной формы сохранено; объект «ему», подразумеваемый из контекста, необходим для естественного русского выражения.
- source_word: ὃς γὰρ
  choice: ведь кто
  rationale: γάρ вводит основание для повеления, а конструкция с относительным местоимением выражает общий принцип; «ведь кто» передаёт обе функции естественно и без излишней конкретизации.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: не против вас
  rationale: κατά с родительным падежом выражает противодействие. «Вас» сохраняет второе лицо множественного числа исходного текста.
- source_word: ὑπὲρ ὑμῶν ἐστιν
  choice: тот за вас
  rationale: ὑπέρ здесь обозначает поддержку или нахождение на чьей-либо стороне. «За вас» сохраняет краткую антитезу «против вас — за вас».
theological_decisions:
- issue: Объём общего высказывания Иисуса
  choice: «кто не против вас, тот за вас» как общий принцип
  alternative: «тот, кто не против вас, за вас» с более непосредственной отсылкой к упомянутому человеку
  rationale: Относительное местоимение может указывать на конкретный случай и одновременно формулировать более широкое правило. Конструкция «кто… тот…» сохраняет обобщающий характер, не развивая его в отдельное богословское положение.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная прямая речь. Синтаксический параллелизм «не против вас — за вас» сохранён. Множественное число обращения явно выражено формой «препятствуйте» и местоимением «вас».
