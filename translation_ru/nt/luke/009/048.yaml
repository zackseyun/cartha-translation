  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: ru
  text: 'И сказал им: «Кто примет[a] этого ребёнка во имя Моё[b], тот принимает Меня; а кто примет Меня, тот принимает Пославшего Меня. Ибо кто меньше всех среди вас, тот велик».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радушно примет», «приветствует»; греческий глагол может обозначать как принятие, так и гостеприимное радушие. Этот оттенок возможен во всех случаях употребления глагола в стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради Моего имени», «на основании Моего имени»; выражение указывает на принятие ребёнка в связи с именем, властью и принадлежностью Иисусу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: примет / принимает
  rationale: «Принимать» сохраняет повтор одного и того же глагола и допускает как смысл радушного приёма, так и признания или принятия человека.
- source_word: παιδίον
  choice: ребёнка
  rationale: Нейтральное современное соответствие; контекст не требует обязательного добавления «маленького».
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: во имя Моё
  rationale: Устойчивая и понятная формула, сохраняющая связь приёма ребёнка с именем, властью и представительством Иисуса; возможные смысловые оттенки отмечены в сноске.
- source_word: τὸν ἀποστείλαντά με
  choice: Пославшего Меня
  rationale: Субстантивированное причастие передано без добавления прямого наименования Отца или Бога, которого нет в греческом тексте.
- source_word: μικρότερος
  choice: меньше всех
  rationale: В данном контексте сравнительная форма обозначает низшее положение или малость в общине, а не физический размер и не обязательно возраст.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: среди вас
  rationale: Естественно передаёт положение внутри всей группы; значение πᾶσιν отражено конструкцией «меньше всех».
- source_word: ὑπάρχων
  choice: кто меньше всех
  rationale: Причастная конструкция естественно передана придаточным предложением без тяжеловесного буквального «будучи».
- source_word: οὗτός ἐστιν μέγας
  choice: тот велик
  rationale: 'Указательное местоимение сохраняет подчёркнутый вывод: именно такой человек является великим.'
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Кто ... а кто
  rationale: Передаёт обобщённо-условный характер обеих греческих конструкций и сохраняет их параллелизм.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: И сказал им
  rationale: Прямо отражает повествовательное καί, не добавляя отсутствующего в оригинале временного оттенка.
theological_decisions:
- issue: Кого обозначает выражение «Пославшего Меня»
  choice: Сохранено косвенное обозначение «Пославшего Меня».
  alternative: «Отца, Пославшего Меня» или «Бога, Пославшего Меня».
  rationale: Хотя в контексте подразумевается Отец/Бог, греческий текст прямо Его не называет; перевод не должен устранять эту форму выражения добавлением.
- issue: Смысл принятия ребёнка во имя Иисуса
  choice: Сохранена формула «во имя Моё», связывающая приём с именем, властью и представительством Иисуса.
  alternative: «ради Меня», «потому что он принадлежит Мне» или «на основании Моего имени».
  rationale: Основной текст сохраняет смысловую широту греческой фразы и не сводит её ни к общей доброте, ни к одному причинному оттенку.
- issue: Парадокс величия
  choice: «Кто меньше всех среди вас, тот велик».
  alternative: «Самый младший среди вас велик».
  rationale: Контекст говорит прежде всего о низком положении и смирении в общине, а не об одном лишь возрасте; парадоксальная переоценка величия сохранена без поясняющего расширения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «примет / принимает» намеренно сохранён как смысловой каркас изречения. Прописные буквы в местоимениях, относящихся к Иисусу, соответствуют традиционному русскому библейскому регистру и не изменяют содержания оригинала.
