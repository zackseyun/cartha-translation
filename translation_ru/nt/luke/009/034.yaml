  terminology: '«Облако» и «осенять» корректны. Терминологически или доктринально уточнять природу облака в основном тексте не следует. Добавлена осторожная контекстуальная сноска, соответствующая английскому аудиторскому следу: она отмечает вероятный ветхозаветный отзвук, но не утверждает его как прямое содержание стиха.'
