  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: ru
  text: Пока он это говорил, появилось облако и стало осенять их[a][b]. Когда они входили в облако, они испугались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «появилось облако и осенило их». Имперфект можно передать и без оттенка начала действия.'
    reason: lexical_alternative
  - marker: b
    text: Образ облака, вероятно, отсылает к ветхозаветным сценам явленного Божьего присутствия, хотя сам стих прямо этого не говорит.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ λέγοντος
  choice: Пока он это говорил
  rationale: Генитив абсолютный с причастием настоящего времени обозначает действие, происходящее одновременно; «это» естественно отсылает по-русски к предшествующим словам Петра, хотя греческое ταῦτα формально имеет множественное число.
- source_word: ἐγένετο νεφέλη
  choice: появилось облако
  rationale: Оборот вводит появление или возникновение облака, не уточняя его происхождения.
- source_word: ἐπεσκίαζεν
  choice: стало осенять
  rationale: Имперфект допускает начинательное или развёртывающееся действие; «осенять» сохраняет образ облака и возможный библейский резонанс, не объясняя его прямо.
- source_word: ἐφοβήθησαν
  choice: им стало страшно
  rationale: Естественно передаёт наступление страха, выраженное аористом.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς εἰς τὴν νεφέλην
  choice: Когда они вошли в облако
  rationale: Артиклевый инфинитив с ἐν выражает время; εἰς обозначает движение внутрь облака. «Когда» не навязывает более точной временной последовательности, чем позволяет конструкция.
theological_decisions:
- issue: Природа облака и смысл его действия
  choice: Описать облако и его действие без прямого отождествления с Божьим присутствием.
  alternative: Назвать его облаком Божьей славы или явно пояснить как проявление Божьего присутствия.
  rationale: Контекст вызывает ассоциации с ветхозаветными богоявлениями, однако сам стих такого истолкования прямо не формулирует.
- issue: Кого обозначает αὐτούς в выражении о вхождении в облако
  choice: Сохранить местоимение «они» без уточнения состава группы.
  alternative: 'Уточнить: «ученики» или «все они».'
  rationale: Греческое местоимение допускает контекстуальное обсуждение референта; перевод не должен устранять эту неоднозначность добавлением отсутствующего существительного.
translation_notes:
  register: Современный литературный русский язык с простым и достоинственным повествовательным строем. «Осенять» несколько возвышенно, но понятно в библейском контексте и сохраняет образность исходного глагола. Маркер сноски поставлен непосредственно после соответствующей фразы.
