  source_fidelity: 'Начало стиха передано точно: «Пока он это говорил» воспроизводит генитив абсолютный с одновременностью действия; «появилось облако» удачно передаёт ἐγένετο νεφέλη; «стало осенять» обоснованно отражает возможный начинательный/развёртывающийся оттенок имперфекта ἐπεσκίαζεν. Однако «Когда они вошли» несколько сильнее оформляет вхождение как уже завершённое событие, тогда как ἐν τῷ εἰσελθεῖν выражает страх в момент вхождения. «Когда они входили» точнее сохраняет эту временную связь, не решая вопрос о референте αὐτούς.'
