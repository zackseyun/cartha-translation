  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: ru
  text: Вложите эти слова себе в уши, ибо Сыну Человеческому предстоит быть переданным в руки людей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предстоит быть преданным в руки людей». Греческий глагол может означать «передать», «выдать» или, в некоторых контекстах, «предать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Вложите же эти слова себе в уши
  rationale: Сохранён яркий образ греческого выражения и подчёркнутое ὑμεῖς; частица «же» естественно передаёт усиленный прямой призыв в контексте.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: Прямое и естественное обозначение следующего высказывания Иисуса.
- source_word: ὁ γὰρ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Традиционная буквальная передача титула сохраняет его двусмысленность и ветхозаветные ассоциации; причинная связь γάρ передана двоеточием, естественным для русского пояснения.
- source_word: μέλλει παραδίδοσθαι
  choice: будет предан
  rationale: Будущее время передаёт предстоящее событие; «предан» в русском допускает как передачу во власть, так и оттенок предательства, не ограничивая смысл исключительно поступком Иуды.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: в руки людей
  rationale: Сохранена идиома перехода под чужую власть; «людей» точно передаёт родовое значение ἀνθρώπων и создаёт естественный контраст с титулом «Сын Человеческий».
theological_decisions:
- issue: Передача титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человеческий Сын / Сын человека
  rationale: Устоявшийся титул сохраняет христологическую и интертекстуальную насыщенность выражения без истолковывающего уточнения.
- issue: Смысл παραδίδοσθαι
  choice: будет предан
  alternative: будет отдан / будет выдан
  rationale: «Предан» сохраняет смысл передачи во власть и возможный оттенок предательства, оставляя намеренную широту греческого глагола.
- issue: Референт ἀνθρώπων
  choice: людей
  alternative: мужчин
  rationale: В данном месте существительное обозначает людей как человеческих агентов вообще; перевод «мужчин» неоправданно сузил бы значение.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной формальностью. Необычный образ «вложите… в уши» намеренно сохранён как выразительный призыв внимательно услышать и запомнить; двоеточие естественно выражает пояснительную функцию γάρ.
