  verdict: approve
  source_fidelity: Перевод точно передаёт εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς как возникновение спора внутри группы. «О том, кто из них больше» корректно передаёт содержание косвенного вопроса τὸ τίς ἂν εἴη μείζων αὐτῶν; сравнительная степень μείζων сохранена. Потенциальный оттенок ἂν с оптативом в данном русском косвенном вопросе может оставаться неэксплицированным без потери основного смысла.
  naturalness: Фраза краткая, грамматически чистая и естественная для современного литературного русского. Порядок слов «И возник у них спор» допустим в повествовательном регистре. «Кто из них больше» в данном контексте естественно читается как вопрос о первенстве, а не о физическом размере.
  terminology: «Спор» является оправданным контекстуальным выбором для διαλογισμός и соответствует английскому аудиторскому решению. Сноска надлежащим образом сохраняет возможные менее конфликтные значения («рассуждение», «обсуждение»), не выдавая их за единственно верное толкование. Богословски нагруженных терминов в стихе нет.
