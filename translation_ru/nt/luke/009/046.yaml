  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: ru
  text: И возник у них спор о том, кто из них больше[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возникло рассуждение»; возможно также: «началось обсуждение».'
    reason: Существительное διαλογισμός может обозначать как внутреннее рассуждение, так и обсуждение или спор внутри группы.
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: возник
  rationale: Буквально глагол означает «вошёл», однако в сочетании с διαλογισμός естественный русский эквивалент — «возник»; он сохраняет событийный характер выражения без неестественного буквализма.
- source_word: δὲ
  choice: И
  rationale: Слабый повествовательный соединительный элемент; «и» естественно продолжает рассказ, не придавая связи излишне строгого временного значения.
- source_word: διαλογισμὸς
  choice: спор
  rationale: Слово может обозначать рассуждение, обсуждение или спор. Состязательный вопрос о сравнительном положении учеников в данном контексте позволяет передать его как «спор», при этом альтернативы отмечены в сноске.
- source_word: ἐν αὐτοῖς
  choice: у них
  rationale: Буквально «в них/среди них»; русское «у них возник спор» естественно обозначает происходящее внутри группы, не решая окончательно, был ли процесс только внутренним или выраженным вслух.
- source_word: τὸ τίς ἂν εἴη
  choice: о том, кто ...
  rationale: Артикль с косвенным вопросом вводит содержание рассуждения. В русском конструкция «о том, кто» передаёт её естественно; потенциальность ἄν с оптативом здесь не требует отдельного модального слова.
- source_word: μείζων
  choice: больше
  rationale: Греческая форма сравнительной степени буквально означает «больше/более великий». Русское «кто из них больше» сохраняет сравнительную форму и намеренную тему ранга, не заменяя её без необходимости превосходной степенью.
- source_word: αὐτῶν
  choice: из них
  rationale: Родительный падеж обозначает группу, внутри которой проводится сравнение; «из них» является прямым и естественным русским соответствием.
theological_decisions:
- issue: Характер происходившего между учениками
  choice: спор
  alternative: рассуждение или обсуждение
  rationale: Контекст вопроса о первенстве допускает межличностный спор, однако само διαλογισμός может обозначать также размышление или обсуждение. Поэтому основной текст выбирает контекстуально вероятное «спор», а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая и естественная повествовательная фраза. Сравнительное «больше» сохраняет форму и напряжение греческого текста, а сноска отражает неоднозначность характера взаимодействия.
