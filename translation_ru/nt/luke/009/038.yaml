base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: ru
  text: 'И вот, мужчина из толпы закричал: «Учитель! Умоляю Тебя, обрати внимание на моего сына, ведь он у меня единственный[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он мой единственный сын». Греческое слово может указывать на единственного ребёнка или, с учётом уже названного сына, на единственного сына.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет функцию привлечения внимания и характерный для повествования Луки переход, оставаясь естественным в современном русском языке.
- source_word: ἀνὴρ ἀπὸ τοῦ ὄχλου
  choice: один человек из толпы
  rationale: Передаёт конкретного мужчину как одного из находившихся в толпе; в русском контексте слово «человек» естественно и не устраняет указание на пол, которое далее ясно из мужских форм речи.
- source_word: ἐβόησεν λέγων
  choice: закричал
  rationale: Глагол передаёт громкий, настойчивый возглас; отдельное «говоря» по-русски было бы тяжеловесным и не требуется для передачи смысла причастной конструкции.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое соответствие греческому обращению без добавочного оттенка господства, возможного у слова «Господин» или «Владыка».
- source_word: δέομαί σου
  choice: Умоляю Тебя
  rationale: Передаёт настойчивую, исполненную отчаяния просьбу, более сильную, чем простое «прошу».
- source_word: ἐπιβλέψαι ἐπὶ
  choice: обрати внимание на
  rationale: Выражение означает не просто посмотреть, а уделить заботливое внимание; выбранный вариант естественно передаёт эту смысловую полноту.
- source_word: τὸν υἱόν μου
  choice: моего сына
  rationale: Прямая и естественная передача исходного выражения.
- source_word: μονογενής μοί ἐστιν
  choice: он у меня единственный
  rationale: Сохраняет смысл единственности ребёнка и естественную русскую конструкцию принадлежности, не решая без необходимости, следует ли понимать слово как «единственный ребёнок» или «единственный сын».
