  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: ru
  text: Вернувшись, апостолы рассказали Ему обо всём, что сделали. Затем Он взял их с Собой и удалился с ними отдельно в город, называемый Вифсаидой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наедине», «в стороне». Здесь выражение означает удаление от других, а не то, что Иисус был совершенно один, поскольку апостолы были с Ним.'
    reason: Поясняет значение κατ’ ἰδίαν в контексте сопровождения апостолами, не изменяя ясного направления εἰς πόλιν («в город»).
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: вернулись
  rationale: Аористное причастие обозначает действие, предшествующее рассказу апостолов; в естественном русском последовательность ясно передаётся личной формой.
- source_word: οἱ ἀπόστολοι
  choice: апостолы
  rationale: В контексте Луки это устоявшееся обозначение посланных Иисусом Двенадцати.
- source_word: διηγήσαντο αὐτῷ
  choice: рассказали Ему
  rationale: Глагол означает изложить или подробно поведать; «рассказали» естественно передаёт отчёт о совершённом служении без излишне официального оттенка.
- source_word: ὅσα ἐποίησαν
  choice: обо всём, что сделали
  rationale: ὅσα охватывает совокупность совершённых ими действий.
- source_word: παραλαβὼν αὐτούς
  choice: взял их с Собой
  rationale: παραλαμβάνω здесь означает взять людей с собой как спутников.
- source_word: ὑπεχώρησεν
  choice: удалился
  rationale: Передаёт уход в сторону от публичности и толпы, а не бегство или отступление.
- source_word: κατ’ ἰδίαν
  choice: вместе с ними в уединённое место
  rationale: Контекст исключает абсолютное одиночество Иисуса, поскольку Он взял апостолов с Собой; формулировка выражает удаление от остальных людей.
- source_word: εἰς πόλιν καλουμένην Βηθσαϊδά
  choice: близ города, называемого Вифсаидой
  rationale: В данной синтаксической связи передаёт направление к Вифсаиде; «город» является обычным русским соответствием πόλις, а название дано в традиционной русской форме.
theological_decisions:
- issue: Значение κατ’ ἰδίαν при сопровождающих Иисуса апостолах
  choice: Удаление вместе с апостолами в уединённое место, то есть в сторону от других людей
  alternative: «наедине»; «отдельно»; «в частном порядке»
  rationale: Фраза указывает на отделение от толпы, но не на полное одиночество Иисуса. Перевод сохраняет это напряжение и не противоречит прямому указанию, что апостолы были с Ним.
- issue: Направление ухода относительно Вифсаиды
  choice: «близ города, называемого Вифсаидой»
  alternative: «в город, называемый Вифсаидой»
  rationale: Формулировка учитывает контекст последующего пребывания в безлюдном месте, хотя буквально εἰς с винительным может обозначать движение в город; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции. Формулировка избегает ошибочного впечатления, будто Иисус ушёл совершенно один.
