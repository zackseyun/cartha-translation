  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: ru
  text: Примерно через восемь дней[b] после этих слов[a] Иисус взял с собой Петра, Иоанна и Иакова и поднялся на гору помолиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после этих изречений». Греческое λόγους здесь можно передать как «слова» или «изречения».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение означает «примерно восемь дней»: ὡσεὶ указывает на приблизительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: не передано отдельным оборотом
  rationale: Здесь выражение служит повествовательным переходом. В современном русском отдельное «и случилось» звучало бы тяжеловесно, а явного слова со значением «теперь» в греческом тексте нет.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: после этих слов
  rationale: λόγους указывает на непосредственно предшествующую речь Иисуса. «Слов» естественно по-русски и сохраняет связь с произнесённым; возможное «изречений» отмечено в сноске.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: примерно через восемь дней
  rationale: ὡσεὶ выражает приблизительность, которую важно сохранить. Оборот «через восемь дней после» естественно передаёт временную последовательность по-русски.
- source_word: παραλαβὼν
  choice: взял с собой
  rationale: Причастие обозначает сопутствующее главному действию действие и естественно передаётся личной формой глагола; «с собой» ясно выражает сопровождение.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Петра, Иоанна и Иакова
  rationale: Имена переданы в принятой русской библейской форме; перечисление оформлено по нормам современного русского языка без механического повторения союза.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: поднялся на гору
  rationale: Перевод сохраняет значение восхождения и направление движения. Определённый артикль не требует здесь указательного оттенка.
- source_word: προσεύξασθαι
  choice: помолиться
  rationale: Инфинитив выражает цель восхождения. Совершенный вид естественно передаёт целевое значение аористного инфинитива, не подразумевая, что молитва была мгновенной.
- source_word: подразумеваемое подлежащее при παραλαβὼν и ἀνέβη
  choice: Иисус
  rationale: Имя восстановлено из ближайшего контекста ради ясности современного русского предложения; в греческом оно подразумевается формами глаголов.
theological_decisions:
- issue: Приблизительность хронологии в сопоставлении с параллельными повествованиями
  choice: примерно через восемь дней
  alternative: через восемь дней
  rationale: Греческое ὡσεὶ прямо указывает на приблизительность. Перевод не устраняет различие с формулировками параллельных мест и не гармонизирует их.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Повествовательная формула передана без архаичного «и случилось». Местоименное почтительное написание не введено; имя «Иисус» восстановлено из контекста для ясности.
