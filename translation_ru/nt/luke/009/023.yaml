  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: имперфект ἔλεγεν («говорил»), всеобщий адресат («всем»), обобщающее единственное число («если кто»), образное ὀπίσω μου ἔρχεσθαι («идти за Мной»), самоотречение, буквальный «крест», ежедневность и заключительное следование за Иисусом. Различие между «идти за Мной» и «следует за Мной» сохранено настолько, насколько это возможно в естественном русском.'
  naturalness: 'Фраза звучит естественно и ясно на современном литературном русском. Конструкция «пусть отречётся…, каждый день берёт… и следует…» нормативна: частица «пусть» распространяет побудительное значение на однородные сказуемые. «Каждый день берёт свой крест» удачно передаёт καθ’ ἡμέραν без тяжеловесности.'
  terminology: '«Отречётся от себя» — устоявшееся и точное соответствие ἀρνησάσθω ἑαυτόν; «свой крест» сохраняет конкретный образ σταυρός и не подменяет его толкованием. Написание «Он», «Мной» с прописной буквы соответствует заявленной русской библейской издательской конвенции. Сноска не требуется: в русском обобщающее «кто» не является специфически мужским и не создаёт неоднозначности, требующей пояснения.'
