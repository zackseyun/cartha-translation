source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: ru
  text: 'И Он говорил всем: «Если кто хочет идти за Мной, пусть отречётся от себя, каждый день берёт свой крест и следует за Мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающуюся или повторяющуюся речь; русское несовершенное прошедшее «говорил» естественно сохраняет этот аспект.
- source_word: πρὸς πάντας
  choice: всем
  rationale: Кратко и точно передаёт обращение ко всем присутствующим без сужения круга адресатов.
- source_word: Εἴ τις θέλει
  choice: Если кто хочет
  rationale: Оборот сохраняет неопределённое обобщающее единственное число и естественно звучит по-русски.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: идти за Мной
  rationale: Сохраняет образ движения за Иисусом и не сливает его полностью с последующим глаголом ἀκολουθέω.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: пусть отречётся от себя
  rationale: Передаёт повелительное значение третьего лица и сильный смысл отказа от притязаний собственного «я», не добавляя толкования.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ καθ’ ἡμέραν
  choice: каждый день берёт свой крест
  rationale: «Берёт крест» сохраняет конкретный образ σταυρός, а «каждый день» передаёт характерный для Луки акцент на постоянстве ученичества. Несовершенный вид естественен в русском при ежедневной повторяемости.
- source_word: ἀκολουθείτω μοι
  choice: следует за Мной
  rationale: Настоящее повелительное наклонение передано как продолжающееся следование; повелительная сила распространяется от «пусть» на однородные сказуемые.
theological_decisions:
- issue: Образ креста в ученичестве
  choice: Сохранить буквальное «свой крест»
  alternative: своё бремя; назначенные ему страдания
  rationale: σταυρός обозначает крест и одновременно несёт насыщенный метафорический смысл. Перевод не сводит этот образ только к страданию, бремени или жертве.
- issue: Обобщающее единственное число
  choice: «Если кто… пусть… себя… свой»
  alternative: «Если люди хотят… пусть отрекутся от себя…»
  rationale: Русская конструкция естественно сохраняет обобщающее единственное число греческого текста, не ограничивая высказывание мужчинами и не заменяя его множественным числом.
- issue: Соотношение первоначального решения и постоянного следования
  choice: «отречётся… каждый день берёт… и следует»
  alternative: «должен отрекаться… брать… следовать»
  rationale: Формулировка по возможности сохраняет напряжение между аористным повелением об отречении и выраженным настоящим временем продолжающимся следованием, при этом ежедневность взятия креста передана естественным для русского несовершенным видом.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет последовательность образов исходного текста: желание идти за Иисусом, самоотречение, ежедневное взятие креста и продолжающееся следование. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.'
