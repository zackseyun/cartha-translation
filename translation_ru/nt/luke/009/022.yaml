id: LUK.9.22
reference: Luke 9:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: ru
  text: 'сказав[a]: «Сыну Человеческому надлежит много пострадать, быть отвергнутым старейшинами, первосвященниками и книжниками, быть убитым и на третий день быть воскрешённым[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и сказал, что Сыну Человеческому надлежит…»'
    reason: Сочетание εἰπὼν ὅτι допускает передачу содержания как прямой, так и косвенной речью; основной текст выбирает более естественную здесь прямую речь.
  - marker: b
    text: Буквально — «быть поднятым»; здесь речь о воскрешении. Страдательная форма не называет прямо того, кто воскрешает.
    reason: Поясняет значение и сохраняемую пассивную форму ἐγερθῆναι, не заменяя её активным «воскреснуть».
lexical_decisions:
- source_word: εἰπὼν ὅτι
  choice: 'сказав:'
  rationale: Аористное причастие сохраняет связь с предшествующим повествованием, а двоеточие естественно вводит в русском языке содержание слов Иисуса. Союз ὅτι в таком контексте может вводить прямую речь.
- source_word: Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сыну Человеческому надлежит
  rationale: «Надлежит» передаёт необходимость, подразумеваемую греческим Δεῖ, и позволяет естественно сохранить безличную конструкцию, не называя прямо источник этой необходимости.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сыну Человеческому
  rationale: Устоявшееся обозначение сохраняет форму титула и его библейские взаимосвязи; падеж обусловлен естественной русской конструкцией с «надлежит».
- source_word: πολλὰ παθεῖν
  choice: много пострадать
  rationale: В современном русском это естественно и ёмко передаёт широкое значение πολλὰ при глаголе страдания, не уточняя характер страданий сверх текста.
- source_word: ἀποδοκιμασθῆναι
  choice: быть отвергнутым
  rationale: Передаёт пассивную форму и смысл официального неприятия после оценки.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: старейшинами, первосвященниками и книжниками
  rationale: Творительный падеж естественно обозначает действующих лиц при русском страдательном обороте; названия трёх групп сохранены раздельно.
- source_word: πρεσβυτέρων
  choice: старейшинами
  rationale: Сохраняет институциональное обозначение признанных руководителей народа.
- source_word: ἀρχιερέων
  choice: первосвященниками
  rationale: Традиционный и понятный русский эквивалент для представителей высшей священнической группы; множественное число соответствует греческому.
- source_word: γραμματέων
  choice: книжниками
  rationale: Прямой и узнаваемый евангельский термин, не расширенный толкованием «учителя закона».
- source_word: ἀποκτανθῆναι
  choice: быть убитым
  rationale: Прямо и без излишней юридической окраски передаёт пассивный инфинитив.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: на третий день
  rationale: Естественная передача временного дательного падежа и устойчивой формулы текста.
- source_word: ἐγερθῆναι
  choice: быть воскрешённым
  rationale: Сохраняет страдательный залог и воскресительный смысл ἐγείρω в данном контексте, не называя действующего лица, которого сам стих прямо не указывает.
theological_decisions:
- issue: Сила выражения Δεῖ
  choice: Сыну Человеческому надлежит
  alternative: Необходимо, чтобы Сын Человеческий
  rationale: Выбранная конструкция сохраняет безлично выраженную необходимость в Божьем замысле, но не объясняет её механизм и не вводит прямо не названного деятеля.
- issue: Страдательный залог глагола воскресения
  choice: быть воскрешённым
  alternative: воскреснуть
  rationale: Греческий текст имеет страдательный инфинитив ἐγερθῆναι. Страдательная русская форма сохраняет намёк на действие Бога, не делая подразумеваемого деятеля явным.
- issue: Связь страдания, отвержения, смерти и воскресения
  choice: единый ряд зависимых от «надлежит» инфинитивов
  alternative: разделить предсказание на несколько самостоятельных утверждений
  rationale: Единая синтаксическая цепь сохраняет греческое представление обо всех событиях как составляющих одной необходимости, не ослабляя богословского напряжения между смертью и воскресением.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Надлежит» несколько возвышенно, но понятно и уместно передаёт торжественную необходимость; остальная лексика проста и узнаваема. Синтаксис следует греческой цепи инфинитивов, оставаясь естественным по-русски.
