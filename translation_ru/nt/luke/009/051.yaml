  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: ru
  text: И вот, когда подходили к концу дни Его взятия[a], Он твёрдо решил[b] идти в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его вознесения». Греческое слово буквально означает «взятие вверх».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «утвердил Своё лицо» — образное выражение твёрдой решимости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Когда же
  rationale: Повествовательная формула и связка переданы естественным для современного русского переходом к новому этапу рассказа; отдельное «случилось» здесь утяжеляло бы фразу.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: подходили к концу дни
  rationale: Передаёт временную конструкцию и процесс приближения определённого периода к завершению, сохраняя образ «дней».
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: перед Его взятием
  rationale: Существительное ἀνάλημψις буквально обозначает взятие вверх. Формулировка намеренно не сужает смысл исключительно до вознесения и допускает взгляд на предстоящие смерть, воскресение и вознесение как на единое движение к прославлению.
- source_word: καὶ αὐτὸς τὸ πρόσωπον ἐστήρισεν
  choice: Он твёрдо решил
  rationale: Греческий оборот буквально говорит, что Иисус «утвердил лицо»; по-русски его смысл естественно выражается как твёрдая, решительная воля. Буквальный образ сохранён в сноске.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: идти в Иерусалим
  rationale: Естественно передаёт направленное движение и целевую связь инфинитива с решением Иисуса.
theological_decisions:
- issue: Объём значения ἀναλήμψεως αὐτοῦ
  choice: Его взятие
  alternative: Его вознесение; Его уход
  rationale: Основной текст сохраняет более широкое и буквальное значение греческого существительного, не ограничивая его заранее одним лишь вознесением. Традиционное понимание как вознесения указано в сноске.
- issue: Образное выражение τὸ πρόσωπον ἐστήρισεν
  choice: твёрдо решил
  alternative: утвердил Своё лицо; решительно направился
  rationale: Выбранная формулировка ясно передаёт решимость Иисуса на современном русском языке, а сноска сохраняет исходный образ и его литературный оттенок.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан естественным для русского читателя; подлинная смысловая широта слова ἀνάλημψις сохранена в основном тексте и пояснена в сноске.
