revisions:
- from: Когда же подходили к концу дни перед Его взятием[a], Он твёрдо решил[b] идти в Иерусалим.
  to: И вот, когда подходили к концу дни Его взятия[a], Он твёрдо решил[b] идти в Иерусалим.
  rationale: 'Исправлена неверная временная связь, внесённая словом «перед»: «дни Его взятия» воспроизводит генитивную связь оригинала и не сужает возможный объём ἀνάλημψις до одного момента. Добавлено «И вот» для естественной передачи повествовательного Ἐγένετο δέ. Решительность и направление движения сохранены; сноски остаются привязанными к соответствующим словам.'
