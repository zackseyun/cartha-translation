review_pass:
  verdict: revise
  source_fidelity: 'В основном верно переданы временное приближение к завершению периода и решительное намерение идти в Иерусалим. Однако «дни перед Его взятием» меняет синтаксическую связь: греческий текст говорит о днях/периоде Его взятия, а не о днях, предшествующих ему. Кроме того, в основном тексте желательно передать повествовательное Ἐγένετο δέ.'
  naturalness: «И вот, когда подходили к концу дни Его взятия, Он твёрдо решил идти в Иерусалим» — современная литературная фраза. Формула «И вот» естественно передаёт повествовательный переход, а «дни Его взятия» сохраняет намеренно широкую и несколько необычную, но понятную формулировку оригинала.
  terminology: «Взятие» в данном контексте сохраняет буквальную широту ἀνάλημψις; сноска указывает традиционный вариант «вознесение». «Твёрдо решил» адекватно передаёт смысл идиомы τὸ πρόσωπον ἐστήρισεν, а буквальный образ надлежащим образом объяснён в сноске.
  issues:
  - severity: high
    issue: «перед Его взятием»
    rationale: Предлог «перед» вносит значение предшествования, которого нет в конструкции τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ. Он также делает «взятие» отдельным будущим событием после описываемых дней, тогда как оригинал связывает завершающийся период непосредственно с этим взятием.
  - severity: medium
    issue: Не передано Ἐγένετο δέ
    rationale: Одно «Когда же» создаёт временное придаточное, но не передаёт формульное событие-переход «И случилось/и вот». В русском «И вот» передаёт эту повествовательную функцию без архаичного утяжеления.
  revised_text: И вот, когда подходили к концу дни Его взятия[a], Он твёрдо решил[b] идти в Иерусалим.
  revised_footnotes:
