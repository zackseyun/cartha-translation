  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: ru
  text: 'Но он сказал ему: «Пусть мёртвые хоронят своих мёртвых[a], а ты иди и возвещай Царство Божье».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Первое слово «мёртвые», вероятно, употреблено переносно — о духовно невосприимчивых людях, тогда как второе относится к физически умершим. В греческом тексте в обоих случаях употреблено одно и то же слово; перевод сохраняет этот эффект.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Пусть
  rationale: В сочетании с винительным и инфинитивом передаёт повеление не препятствовать и предоставить названное дело другим. Такая конструкция естественна по-русски и сохраняет резкость ответа.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: мёртвые ... своих мёртвых
  rationale: Повтор одного и того же обозначения сохраняет намеренный парадокс греческого текста, не вводя в основной текст толкование «духовно мёртвые».
- source_word: θάψαι
  choice: хоронят
  rationale: Обычное современное русское обозначение погребения; в конструкции с «пусть» греческий инфинитив естественно передан личной формой.
- source_word: ἑαυτῶν
  choice: своих
  rationale: Возвратное местоимение точно передаёт отнесённость умерших к тем, кто их хоронит.
- source_word: ἀπελθὼν
  choice: иди
  rationale: Греческое причастие обозначает действие, предшествующее или сопутствующее главному повелению. Русская последовательность «иди и возвещай» естественно передаёт эту связь.
- source_word: διάγγελλε
  choice: возвещай
  rationale: Настоящее повелительное наклонение подразумевает продолжающееся публичное объявление; «возвещай» сохраняет торжественный, но понятный характер поручения.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся и понятное библейское выражение, передающее царственное правление Бога без сведения смысла только к территории.
theological_decisions:
- issue: Значение слова «мёртвые» в двух употреблениях
  choice: Сохранить слово «мёртвые» в обоих случаях, не поясняя разные смыслы в основном тексте.
  alternative: «Пусть духовно мёртвые хоронят своих умерших»
  rationale: Первое употребление, вероятнее всего, метафорическое, а второе относится к физически умершим. Однако греческий текст использует одно и то же слово и создаёт намеренно резкий парадокс; явное добавление «духовно» устранило бы сохранённую оригиналом смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Конструкция «Пусть мёртвые хоронят своих мёртвых» звучит естественно, сохраняет краткость и парадокс оригинала. Местоимение «он» дано со строчной буквы согласно общим нормам современного русского текста.
