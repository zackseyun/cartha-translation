base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: ru
  text: Взяв пять хлебов и две рыбы, Он взглянул на небо, благословил их[a], разломил их и давал ученикам, чтобы они подавали народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произнёс над ними благословение». В греческом тексте буквально: «благословил их»; в некоторых параллельных повествованиях сказано: «воздал благодарение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: Взяв
  rationale: Аористное причастие вводит действие, предшествующее основным глаголам. Русское деепричастие естественно передаёт последовательность; слабая повествовательная связка δέ не требует отдельного слова в данном контексте.
- source_word: τοὺς πέντε ἄρτους
  choice: пять хлебов
  rationale: Ἄρτος здесь обозначает отдельные хлебы, предназначенные для раздачи, а не хлеб как вещество.
- source_word: τοὺς δύο ἰχθύας
  choice: две рыбы
  rationale: Прямое и естественное обозначение двух рыб в современном русском языке.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: взглянул на небо
  rationale: Передаёт направленный вверх взгляд; «небо» сохраняет и пространственный, и уместный в молитвенном контексте религиозный оттенок.
- source_word: εὐλόγησεν αὐτοὺς
  choice: благословил их
  rationale: Глагол означает «благословил», а местоимение мужского рода во множественном числе относится к хлебам и рыбам вместе. Перевод не подменяет глагол формулировкой из параллельных повествований.
- source_word: κατέκλασεν
  choice: разломил
  rationale: Глагол обозначает разламывание пищи для раздачи. Дополнение по-русски ясно из предыдущего «их» и контекста.
- source_word: ἐδίδου
  choice: стал давать
  rationale: Имперфект изображает продолжающуюся раздачу; сочетание «стал давать» естественно передаёт начало и дальнейшее течение действия.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Определённость понятна из контекста; притяжательное «Своим» в греческом тексте отсутствует.
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: чтобы они подавали народу
  rationale: Инфинитив выражает цель передачи пищи ученикам. «Подавали» естественно передаёт помещение пищи перед людьми для еды, а «народ» в данном повествовательном контексте звучит по-русски естественнее, чем повторное акцентирование физической толпы.
theological_decisions:
- issue: Значение οὐρανός при молитвенном жесте
  choice: небо
  alternative: небосвод
  rationale: «Небо» сохраняет богословский оттенок направленного к Богу взгляда, не исключая буквального пространственного смысла.
- issue: Передача εὐλόγησεν
  choice: благословил их
  alternative: возблагодарил за них
  rationale: В исходном тексте стоит εὐλογέω («благословлять»), а не εὐχαριστέω («благодарить»). Прямой перевод сохраняет особенность формулировки Луки и не гармонизирует её с параллельными местами.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Заглавное «Он» употреблено как традиционное уважительное обозначение Иисуса, не изменяющее содержания текста. Формулировка «благословил их» намеренно сохраняет прямую и несколько напряжённую конструкцию оригинала.
