  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: ru
  text: Они отправились и ходили по селениям[a], возвещая благую весть[b] и повсюду исцеляя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из селения в селение». Греческое выражение может подчёркивать последовательное движение по разным селениям.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проповедуя Евангелие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: отправились
  rationale: Аористное причастие обозначает начало действий после поручения Иисуса; «отправились» естественно передаёт выход в путь.
- source_word: δὲ
  choice: и
  rationale: Частица продолжает повествование и слегка продвигает его вперёд; русское «и» здесь звучит естественно, не усиливая причинно-следственную связь.
- source_word: διήρχοντο
  choice: переходили
  rationale: Имперфект передаёт продолжительное и повторяющееся движение по нескольким местам.
- source_word: κατὰ τὰς κώμας
  choice: из селения в селение
  rationale: Конструкция с κατά и винительным имеет распределительное значение и указывает на последовательное движение по селениям.
- source_word: εὐαγγελιζόμενοι
  choice: возвещая благую весть
  rationale: Передаёт публичное сообщение радостной вести ясным современным языком без излишне специализированной церковной терминологии.
- source_word: θεραπεύοντες
  choice: исцеляя больных
  rationale: В контексте посланнического служения глагол обозначает исцеление людей; дополнение «больных» естественно и ясно выражает подразумеваемый объект.
- source_word: πανταχοῦ
  choice: повсюду
  rationale: Точно и идиоматично передаёт широкий географический охват их служения.
theological_decisions:
- issue: Смысл εὐαγγελιζόμενοι в миссии учеников
  choice: возвещая благую весть
  alternative: проповедуя Евангелие
  rationale: Выбранный вариант сохраняет миссионерский смысл, но не навязывает слову позднейшее терминологическое значение или представление о письменном Евангелии.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Причастные обороты сохранены там, где они естественны по-русски; распределительный характер маршрута выражен идиомой «из селения в селение».
