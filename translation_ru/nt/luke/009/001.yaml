id: LUK.9.1
reference: Luke 9:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: ru
  text: Созвав двенадцать, Он дал им силу и власть над всеми бесами и для исцеления болезней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: Созвав
  rationale: Аористное причастие передаёт действие, предшествующее основному; приставочное значение совместного собирания естественно выражено русским «созвав».
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь это слабая повествовательная связка; в русском начале предложения её отсутствие звучит естественно и не утрачивает смысловой связи.
- source_word: τοὺς δώδεκα
  choice: двенадцать
  rationale: Сохраняет форму оригинала без добавления слов «учеников» или «апостолов».
- source_word: ἔδωκεν
  choice: дал
  rationale: Прямое и нейтральное соответствие аористу δίδωμι.
- source_word: δύναμιν
  choice: силу
  rationale: Передаёт способность совершать порученное и сохраняет отличие от следующего понятия власти.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Передаёт предоставленное право распоряжаться и действовать, не сливая его с δύναμις.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: над всеми бесами
  rationale: Предлог с винительным здесь обозначает власть над; множественное число и значение всеохватности сохранены.
- source_word: δαιμόνια
  choice: бесами
  rationale: Прямой и привычный в русском библейском регистре эквивалент, без замены на отсутствующее в оригинале «нечистые духи».
- source_word: νόσους
  choice: болезни
  rationale: Естественный современный эквивалент для физических недугов.
- source_word: θεραπεύειν
  choice: способность исцелять
  rationale: Инфинитив связан с данным им полномочием; добавление «способность» делает русскую синтаксическую координацию ясной, не меняя содержания.
theological_decisions:
- issue: Различие между δύναμις и ἐξουσία
  choice: «силу и власть»
  alternative: «силу и право»
  rationale: 'Сохраняются два самостоятельных аспекта поручения: действенная способность и предоставленная власть.'
- issue: Обозначение группы τοὺς δώδεκα
  choice: «двенадцать» без поясняющего существительного
  alternative: «двенадцать учеников» или «двенадцать апостолов»
  rationale: Оригинал не содержит слов «ученики» или «апостолы», поэтому перевод не вводит их из контекста.
- issue: Связь θεραπεύειν с данным поручением
  choice: «и способность исцелять болезни»
  alternative: «и исцелять болезни»
  rationale: Русская формулировка ясно показывает, что способность исцелять входит в то, что было дано, при этом не делает исцеление объектом власти «над».
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским словом «бесы». Местоимение «Он» написано с прописной буквы в соответствии с принятым благоговейным издательским регистром. Формулировка краткая и сохраняет различие между силой и властью.
