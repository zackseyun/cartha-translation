  terminology: «Сила и власть» удачно сохраняет различие δύναμις / ἐξουσία. «Бесы» — допустимый традиционный библейский термин в современном литературном регистре; «болезни» точно передаёт νόσους. Добавлять «учеников» или «апостолов» не следует.
