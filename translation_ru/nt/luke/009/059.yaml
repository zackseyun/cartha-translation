  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: ru
  text: 'А другому Он сказал: «Следуй за Мной». Тот ответил: «Господи, позволь мне сначала пойти и похоронить отца».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволь мне сначала уйти и похоронить отца».'
    reason: 'Возможная передача ἀπελθόντι πρῶτον: сначала уйти (пойти), а затем похоронить отца; порядок действий сохранён.'
lexical_decisions:
- source_word: ἕτερον
  choice: другому
  rationale: Передаёт значение «другому человеку» естественно и без ненужного уточнения личности.
- source_word: Ἀκολούθει μοι
  choice: Следуй за Мной
  rationale: Обычный и точный русский эквивалент призыва следовать за Иисусом; форма настоящего повелительного наклонения не требует искусственного «продолжай следовать».
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная форма обращения, сохраняющая одновременно уважительный и богословски значимый оттенки κύριος.
- source_word: ἐπίτρεψόν μοι
  choice: позволь мне
  rationale: Естественно передаёт просьбу о разрешении в современном литературном русском.
- source_word: ἀπελθόντι πρῶτον
  choice: сначала пойти
  rationale: Ясно выражает предварительное действие перед погребением, не утяжеляя русскую фразу.
- source_word: θάψαι τὸν πατέρα μου
  choice: похоронить отца
  rationale: Прямой и естественный перевод; принадлежность однозначно выражена контекстом «мне», поэтому русское «моего» избыточно.
theological_decisions:
- issue: Передача κύριος в обращении к Иисусу
  choice: Господи
  alternative: Господин / Учитель
  rationale: '«Господи» сохраняет присущую повествованию двойственность: это и почтительное обращение, и титул с возможным христологическим смыслом; более бытовые варианты сужают значение.'
translation_notes:
  register: Современный литературный русский, ясный и сдержанно возвышенный. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с принятым благоговейным библейским регистром. Реплика собеседника звучит уважительно, но без архаической тяжеловесности.
