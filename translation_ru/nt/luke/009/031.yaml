id: LUK.9.31
reference: Luke 9:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: ru
  text: Они явились в славе и говорили о Его исходе[a], который Ему предстояло совершить в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уходе». Здесь «исход» относится к предстоящим в Иерусалиме смерти, воскресению и вознесению Иисуса и, возможно, перекликается с исходом Израиля из Египта.'
    reason: Поясняет многозначность ἔξοδος, не сужая её в основном тексте.
lexical_decisions:
- source_word: ὀφθέντες ἐν δόξῃ
  choice: явились в славе
  rationale: Передаёт аористное причастие ὀφθέντες естественной русской формой и сохраняет обстоятельство ἐν δόξῃ.
- source_word: ἔλεγον
  choice: говорили
  rationale: Имперфект указывает на продолжавшуюся беседу.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: о Его исходе
  rationale: '«Исход» сохраняет многозначность ἔξοδος: уход/смерть Иисуса и вероятную отсылку к библейскому Исходу.'
- source_word: ἣν ἤμελλεν πληροῦν
  choice: который Ему предстояло совершить
  rationale: «Предстояло» передаёт ἤμελλεν, а «совершить» естественно сочетается с «исходом» и сохраняет оттенки осуществления и доведения до исполнения у πληροῦν.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Прямое и естественное обозначение места.
theological_decisions:
- issue: Значение ἔξοδος
  choice: исход
  alternative: уход / смерть
  rationale: Более широкое слово не сводит речь только к смерти и сохраняет возможную типологическую связь с Исходом.
- issue: Передача πληροῦν
  choice: совершить
  alternative: исполнить / завершить
  rationale: «Совершить исход» в русском звучит естественнее, чем «исполнить исход», не устраняя при этом смысла исполнения предначертанного события.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и торжественная без архаизации. Местоимение «Его» оформлено с прописной буквы по принятой русской библейской традиции.
