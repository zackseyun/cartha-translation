  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: ru
  text: 'Иисус же сказал в ответ: «О неверующее и извращённое поколение! Долго ли Мне ещё быть с вами и терпеть вас? Приведи сюда своего сына».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ ἄπιστος
  choice: неверующее поколение
  rationale: Передаёт отсутствие веры естественным современным русским языком; «поколение» сохраняет коллективный и несколько неоднозначный охват греческого γενεά.
- source_word: διεστραμμένη
  choice: извращённое
  rationale: Сохраняет образ нравственной искривлённости или искажённости, не сводя смысл к одному конкретному пороку.
- source_word: ἕως πότε ἔσομαι πρὸς ὑμᾶς
  choice: Долго ли Мне ещё быть с вами?
  rationale: Естественный русский вопрос передаёт буквальное «до каких пор буду с вами»; «ещё» ясно выражает длительность.
- source_word: ἀνέξομαι ὑμῶν
  choice: терпеть вас
  rationale: Точно и идиоматично передаёт идею вынесения или терпеливого перенесения людей и их поведения.
- source_word: προσάγαγε ὧδε τὸν υἱόν σου
  choice: Приведи сюда своего сына
  rationale: Сохраняет прямое повеление, указание места и обращение к отцу ребёнка.
theological_decisions:
- issue: К кому относится укор «неверующее и извращённое поколение»
  choice: Сохранён широкий коллективный смысл без уточнения адресатов
  alternative: Ограничить укор учениками, отцом мальчика или толпой
  rationale: Множественное ὑμᾶς и существительное γενεά допускают широкий круг адресатов; текст не требует однозначно сужать его.
- issue: Оттенок διεστραμμένη
  choice: «извращённое» как нравственно и духовно искажённое
  alternative: «испорченное», «развращённое» или «строптивое»
  rationale: Выбранный вариант сохраняет метафору отклонения от верного пути и не вносит специально сексуального смысла в данном контексте.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Частица «же» сохраняет повествовательную связь δέ; прописное «Мне» следует распространённой русской практике уважительного обозначения Христа.
