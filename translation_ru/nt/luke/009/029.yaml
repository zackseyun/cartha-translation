  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: ru
  text: Когда Он молился, вид Его лица изменился[a], а Его одежда была белой и сверкающей, словно молния[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицо Его стало иным на вид».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его одежда была белой и ослепительно сияла»; греческое причастие передаёт образ сверкающей молнии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: И когда Он молился
  rationale: Луканская конструкция обозначает событие, произошедшее во время молитвы. «И когда Он молился» естественно передаёт временное значение и сохраняет повествовательную связь καί.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: вид Его лица
  rationale: εἶδος здесь означает видимый облик, а πρόσωπον — лицо. Краткое сочетание «вид Его лица» точно и естественно в современном русском языке.
- source_word: ἕτερον
  choice: стал иным
  rationale: Буквально слово означает «иной, другой». Формулировка сохраняет сдержанность Луки и не привносит из параллельных повествований утверждение, что лицо сияло.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: Его одежда
  rationale: ἱματισμός обозначает одежду или одеяние; «одежда» понятно современному читателю и соответствует достойному повествовательному регистру.
- source_word: λευκὸς
  choice: белой
  rationale: Прямо передаёт значение λευκός; яркость выражена следующим причастием и не добавляется к самому прилагательному.
- source_word: ἐξαστράπτων
  choice: сверкающей, как молния
  rationale: Причастие связано с образом молнии и описывает яркое вспыхивающее сияние. Сравнительная формулировка сохраняет этот живой образ по-русски.
theological_decisions:
- issue: Описание преображения Иисуса
  choice: Передать видимое изменение лица как «вид Его лица стал иным»
  alternative: «Его лицо преобразилось» или «Его лицо засияло»
  rationale: Выбранный вариант следует сдержанной формулировке Луки, свидетельствует о реальном видимом изменении, но не гармонизирует стих с более определёнными выражениями синоптических параллелей.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Местоимение «Он» применительно к Иисусу написано с прописной буквы согласно распространённой русской библейской издательской традиции; синтаксис не перегружен архаизмами.
