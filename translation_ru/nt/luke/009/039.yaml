  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: ru
  text: И вот, дух овладевает им, и он вдруг вскрикивает; дух корчит его в судорогах, с пеной у рта, и едва отступает от него, терзая его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злой дух» или «демон»; в греческом тексте здесь сказано просто «дух».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Естественный для современного русского повествовательный маркер, сохраняющий живость и указательную силу греческого выражения.
- source_word: πνεῦμα
  choice: дух
  rationale: В греческом тексте стоит общее слово «дух» без определений «злой» или «нечистый» и без существительного «демон».
- source_word: λαμβάνει
  choice: овладевает
  rationale: Передаёт захват и подчинение человека духом; в данном контексте естественнее общего «берёт».
- source_word: ἐξαίφνης κράζει
  choice: тот внезапно вскрикивает
  rationale: Наречие передаёт внезапность, а местоимение «тот» ясно указывает на мальчика, не приписывая крик духу. «Вскрикивает» сохраняет резкость действия без излишнего усиления до «визжит».
- source_word: σπαράσσει αὐτὸν
  choice: дух бьёт его в судорогах
  rationale: Глагол описывает сильные судорожные движения; повтор субъекта устраняет неясность русского местоимения и остаётся верен контексту.
- source_word: μετὰ ἀφροῦ
  choice: так что у него идёт пена изо рта
  rationale: Естественно и ясно передаёт сопровождающее судороги появление пены; указание «изо рта» эксплицирует обычный смысл выражения для современного читателя.
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: с трудом отступает от него
  rationale: «С трудом» сохраняет возможный смысл неохотного или затруднённого ухода, а «отступает» подходит к враждебному духу и не предполагает окончательного изгнания.
- source_word: συντρῖβον αὐτόν
  choice: изнуряя его
  rationale: Причастие обозначает тяжёлое повреждающее воздействие. «Изнуряя» естественно по-русски и передаёт доведение мальчика до физического изнеможения, не утверждая буквального раздробления.
theological_decisions:
- issue: Следует ли прямо назвать πνεῦμα злым духом или демоном
  choice: дух
  alternative: злой дух; демон
  rationale: Хотя контекст ясно показывает враждебный сверхъестественный характер духа, сам стих употребляет только πνεῦμα. Основной текст сохраняет эту лексическую неопределённость, а примечание поясняет контекстуально возможные варианты.
- issue: Кто является подразумеваемым субъектом κράζει
  choice: 'мальчик: «тот внезапно вскрикивает»'
  alternative: дух кричит; дух заставляет его кричать
  rationale: После «овладевает им» наиболее естественно понимать субъектом крика мальчика. Формулировка не добавляет причинной конструкции «заставляет», которой в греческом тексте нет.
translation_notes:
  register: Современный литературный русский язык с живым, но достойным повествовательным ритмом. Точка с запятой помогает различить крик мальчика и последующие действия духа. Терминология не архаична и не привязана к конфессиональной традиции.
