  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: ru
  text: Но Иисус, зная их внутренние рассуждения[a], взял ребёнка и поставил его рядом с Собой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассуждение их сердца»; в греческом тексте слово «сердце» стоит в единственном числе, а местоимение «их» — во множественном.'
    reason: Сноска сохраняет образ сердца и отмечает необычное для русского сочетание единственного числа «сердце» с множественным притяжательным местоимением, тогда как основной текст естественно передаёт значение внутреннего рассуждения.
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Причастие обозначает осведомлённость или внутреннее восприятие; «зная» естественно передаёт утверждение текста, не уточняя, каким образом Иисус это знал.
- source_word: διαλογισμὸν
  choice: какие мысли
  rationale: В данном контексте слово обозначает внутренние размышления и рассуждения. Множественное «мысли» естественно по-русски передаёт содержание общего внутреннего рассуждения учеников.
- source_word: τῆς καρδίας αὐτῶν
  choice: у них на сердце
  rationale: Русская идиома сохраняет образ сердца как внутреннего мира человека и позволяет естественно передать греческое единственное число при местоимении во множественном числе.
- source_word: ἐπιλαβόμενος
  choice: взял
  rationale: Глагол может означать «взяться за» или «взять». Здесь нейтральное «взял» передаёт конкретное действие, не добавляя отсутствующего в тексте указания, например, на руку.
- source_word: παιδίον
  choice: ребёнка
  rationale: Обычное и ясное обозначение ребёнка; уменьшительное «дитя» или уточнение «маленького» не требуется исходным словом.
- source_word: ἔστησεν
  choice: поставил
  rationale: Каузативная форма означает «поставил, заставил встать»; «поставил» естественно сохраняет образ стоящего ребёнка.
- source_word: παρ’ ἑαυτῷ
  choice: рядом с Собой
  rationale: Точно и естественно передаёт положение ребёнка возле Иисуса, без возможной в иных языках двусмысленности.
theological_decisions:
- issue: Знание Иисусом внутренних мыслей учеников
  choice: Сказать, что Иисус знал их мысли, не объясняя происхождение этого знания.
  alternative: Истолковать это прямо как проявление сверхъестественного всеведения или как обычную человеческую проницательность.
  rationale: Лука утверждает факт знания, но в этом стихе не указывает его механизм; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным библейским звучанием. Выражение «у них на сердце» естественно передаёт внутреннюю сферу размышлений; прописная буква в «Собой» соответствует распространённой русской библейской издательской традиции.
