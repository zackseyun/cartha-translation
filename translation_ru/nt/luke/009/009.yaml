  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: ru
  text: 'Но Ирод сказал: «Иоанна я обезглавил. Кто же этот, о ком я слышу такое?» И он старался увидеть его.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он стремился увидеть его». Греческий имперфект может обозначать продолжавшееся или повторявшееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт связующий союз с лёгким противопоставлением предыдущим сообщениям и естественно вводит ответ Ирода.
- source_word: Ἡρῴδης
  choice: Ирод
  rationale: Устоявшаяся русская форма имени.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: Иоанна я обезглавил
  rationale: Порядок слов сохраняет акцент явного местоимения ἐγώ на участии и ответственности Ирода; ἀποκεφαλίζω прямо означает обезглавливание и не уточняет, совершил ли Ирод действие лично или распорядился его совершить.
- source_word: τίς δέ ἐστιν οὗτος
  choice: Кто же этот
  rationale: Сохраняет прямой вопрос и несколько отстранённое указательное οὗτος, не добавляя отсутствующее в греческом слово «человек».
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: о ком я слышу такое
  rationale: Естественная современная русская передача; «такое» сохраняет обобщённость τοιαῦτα и не превращает его явно в «слухи» или «сообщения».
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: он старался увидеть его
  rationale: Имперфект передаёт продолжавшееся стремление или повторявшиеся попытки, а ἰδεῖν сохраняет прямое значение «увидеть», без уточнения «встретиться».
theological_decisions:
- issue: Высказывание Ирода об Иоанне и его интерес к Иисусу
  choice: Передать как историческое утверждение, вопрос и продолжавшееся желание увидеть Иисуса без дополнительных объяснений.
  alternative: Явно добавить, что Ирод опасался воскресения Иоанна или пытался установить личность Иисуса.
  rationale: Сам стих не называет ни страха Ирода, ни воскресения причиной его вопроса; перевод сохраняет недосказанность и богословское напряжение контекста.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной повествовательной интонацией. Местоимение «его» оставлено со строчной буквы по общим нормам современного русского текста; формулировка не добавляет конфессионально обусловленного почтительного написания.
