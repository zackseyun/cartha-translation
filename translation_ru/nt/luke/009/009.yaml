  source_fidelity: 'Перевод точно передаёт греческий текст: «Иоанна я обезглавил» сохраняет эмфатическое ἐγώ и конкретное значение ἀπεκεφάλισα; вопрос «Кто же этот, о ком я слышу такое?» не добавляет подразумеваемых объяснений; заключительное «он старался увидеть его» приемлемо передаёт ἐζήτει ἰδεῖν αὐτόν как длительное стремление или повторные попытки.'
