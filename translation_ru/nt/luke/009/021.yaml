  text: Ὁ δὲ ἐπιτιμήσας αὐτοῖς παρήγγειλεν μηδενὶ ⸀λέγειν τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: ru
  text: Но Он строго предупредил их и повелел никому не говорить об этом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но Он укорил их и повелел никому не говорить об этом».'
    reason: 'Лексическая альтернатива: ἐπιτιμάω может означать «укорять, порицать», а в данном контексте также передаёт строгое предупреждение.'
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: строго предостерёг
  rationale: Причастие от ἐπιτιμάω передаёт резкое, властное предостережение. В данном контексте «строго предостерёг» естественнее по-русски, чем «упрекнул», поскольку речь идёт о запрете разглашать исповедание Петра, но сохраняет силу исходного глагола.
- source_word: παρήγγειλεν
  choice: повелел
  rationale: παραγγέλλω обозначает авторитетное распоряжение; «повелел» ясно передаёт обязательную силу указания и соответствует достоинству повествовательного регистра.
- source_word: μηδενὶ
  choice: никому
  rationale: Дательный падеж μηδείς обозначает адресата речи и естественно передаётся русским «никому».
- source_word: λέγειν
  choice: не говорить
  rationale: В сочетании с μηδενὶ и τοῦτο глагол означает не сообщать названное другим; русское «никому об этом не говорить» идиоматично передаёт конструкцию.
- source_word: τοῦτο
  choice: об этом
  rationale: Указательное местоимение отсылает к непосредственно предшествующему исповеданию Петра. «Об этом» сохраняет отсылку, не уточняя её сверх текста.
- source_word: δὲ
  choice: Но
  rationale: δέ выражает лёгкое противопоставление между исповеданием Петра и последовавшим запретом Иисуса; союз «но» естественно выявляет этот поворот.
theological_decisions:
- issue: Сила запрета Иисуса после исповедания Петра
  choice: Строгое предостережение и властное повеление никому не сообщать об этом
  alternative: Упрёк ученикам с последующим приказом никому этого не говорить
  rationale: Сочетание ἐπιτιμήσας и παρήγγειλεν указывает на сильный запрет, а не на необязательную просьбу. Перевод сохраняет напряжение повествования, не объясняя причин запрета и не привнося теорию «мессианской тайны».
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прописное «Он» следует традиционной русской библейской орфографии; формулировка избегает архаичного синтаксиса. Наречие «строго» сохраняет силу ἐπιτιμάω, тогда как «повелел» передаёт авторитетность παραγγέλλω.
