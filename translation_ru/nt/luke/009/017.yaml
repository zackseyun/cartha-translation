  text: И все поели и насытились, а оставшихся кусков собрали двенадцать корзин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: ели
  rationale: Аорист повествует о завершённом событии; простое прошедшее время естественно в русском рассказе.
- source_word: ἐχορτάσθησαν
  choice: насытились
  rationale: Передаёт значение полного утоления голода естественным и достойным современным русским языком.
- source_word: πάντες
  choice: все
  rationale: 'Сохраняет подчёркнутую всеобщность: поели все присутствующие.'
- source_word: ἤρθη
  choice: собрали
  rationale: В данном контексте пассив αἴρω обозначает, что остатки были подняты и собраны; русская неопределённо-личная конструкция звучит естественно.
- source_word: τὸ περισσεῦσαν
  choice: оставшиеся
  rationale: В сочетании с κλασμάτων естественно передаёт то, что осталось после еды.
- source_word: αὐτοῖς
  choice: не выражено отдельно
  rationale: Дательный αὐτοῖς синтаксически неоднозначен; отдельное «для них» в русском звучало бы неестественно и могло бы неоправданно закрепить спорную связь. Контекст участников сохраняется.
- source_word: κλασμάτων
  choice: куски
  rationale: Передаёт конкретные отломанные куски пищи без архаичного оттенка слова «обломки».
- source_word: κόφινοι δώδεκα
  choice: двенадцать корзин
  rationale: Ясное и обычное соответствие, не добавляющее неуказанный материал корзин.
