  source_fidelity: 'В исходном тексте аористы ἔφαγον и ἐχορτάσθησαν сообщают о завершённых событиях; «ели» (несовершенный вид) ослабляет это значение. Главное структурное затруднение черновика — «оставшиеся куски собрали — двенадцать корзин»: «двенадцать корзин» не может грамматически пояснять прямое дополнение «куски» и не выражает, что собранное количество составило двенадцать корзин. Перестройка с количественным оборотом точно передаёт τὸ περισσεῦσαν ... κλασμάτων κόφινοι δώδεκα. Неоднозначный датив αὐτοῖς безопасно не выражать отдельно по-русски, не закрепляя спорную синтаксическую связь.'
  naturalness: «И все поели и насытились, а оставшихся кусков собрали двенадцать корзин» — естественная, ясная и литературная русская повествовательная фраза. Количественный родительный падеж после «двенадцать корзин» здесь нормативен и устраняет неудачное тире.
  terminology: «Насытились», «куски» и «корзины» соответствуют контексту и современному литературному регистру. Добавлять материал корзин или уточнять вид пищи оснований нет.
