lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Аорист ἀποστέλλω означает «посылать»; в русском глагол «послал» естественно передаёт поручение и не требует добавления наречия.
- source_word: κηρύσσειν
  choice: возвещать
  rationale: κηρύσσω обозначает публичное провозглашение. «Возвещать» сохраняет эту смысловую силу и звучит достойно, не ограничивая действие церковной проповедью.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Царство Божье
  rationale: Традиционное и понятное русское соответствие сохраняет широту понятия, которое может указывать как на царство, так и на царствование Бога.
- source_word: ἰᾶσθαι
  choice: исцелять
  rationale: ἰάομαι в данном контексте означает восстановление здоровья; «исцелять» является естественным библейским и современным русским эквивалентом.
- source_word: τοὺς ἀσθενεῖς
  choice: больных
  rationale: Хотя ἀσθενής может означать «слабый», при глаголе «исцелять» речь идёт о больных.
theological_decisions:
- issue: Смысл выражения βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  alternative: царствование Бога
  rationale: Основной вариант сохраняет укоренившееся библейское выражение и его смысловую широту; сноска отмечает возможный акцент на действующем Божьем правлении, не подменяя им основной текст.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический параллелизм двух инфинитивов оригинала сохранён: «возвещать… и исцелять…».'
