lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Они ответили
  rationale: Сочетание причастия с личной формой глагола представляет собой обычный семитизированный оборот; по-русски его естественно и точно передаёт один глагол «ответили».
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Иоанн Креститель
  rationale: Это общепринятое русское именование Иоанна, точно передающее определительное прозвание βαπτιστής.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: другие ... а иные
  rationale: Так сохраняются повтор и сопоставление различных мнений, а русская фраза остаётся плавной.
- source_word: Ἠλίαν
  choice: Илия
  rationale: Традиционная и общеупотребительная русская форма имени ветхозаветного пророка.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: кто-то из древних пророков
  rationale: Местоимение τις сохраняет неопределённость, а родительный оборот естественно понимается как указание на одного из пророков древности.
- source_word: ἀνέστη
  choice: воскрес
  rationale: В данном контексте глагол может обозначать возвращение к жизни; «воскрес» сохраняет возможный оттенок воскресения и не заменяет его более толковательным выражением вроде «вернулся».
theological_decisions:
- issue: Следует ли явно передавать ἀνέστη как воскресение
  choice: воскрес
  alternative: восстал / явился вновь
  rationale: Толпа предполагает появление пророка из далёкого прошлого. «Воскрес» сохраняет наиболее вероятный здесь смысл и связь с языком воскресения, тогда как примечание отмечает более широкую возможность понимания глагола.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и устная по характеру, но сохраняет достоинство повествования. Тире передают подразумеваемое «говорят», не добавляя его непосредственно в текст.
