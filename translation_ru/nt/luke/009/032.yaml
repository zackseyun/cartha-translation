lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: были отягощены сном
  rationale: Сохраняет метафору тяжести и передаёт состояние людей, которых одолевал сон, сильнее, чем простое «хотели спать».
- source_word: διαγρηγορήσαντες
  choice: окончательно пробудившись
  rationale: Редкий глагол в данном контексте, вероятнее всего, указывает на переход к состоянию полной бодрости, а не на то, что ученики всё время не спали.
- source_word: δόξαν
  choice: славу
  rationale: Обычный библейский эквивалент δόξα, сохраняющий как зрительный, так и богословский смысл сцены преображения.
- source_word: τοὺς δύο ἄνδρας
  choice: двух мужчин
  rationale: Точно и естественно передаёт ἀνήρ применительно к Моисею и Илии.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: стоявших рядом с ним
  rationale: Передаёт зрительно воспринимаемое положение двух мужчин возле Иисуса и значение причастной конструкции.
- source_word: δὲ … δὲ
  choice: же … но
  rationale: Первое δέ мягко развивает повествование и переводит внимание на Петра и его спутников; второе выражает контраст между сонным состоянием и последующим видением.
theological_decisions:
- issue: Передача δόξα в контексте преображения
  choice: его славу
  alternative: его великолепие; его величие
  rationale: «Слава» сохраняет канонические и богословские связи слова, не добавляя в текст толкования о природе явления.
- issue: Толкование διαγρηγορήσαντες
  choice: окончательно пробудившись
  alternative: бодрствуя; не заснув
  rationale: Выбранный вариант согласуется с предшествующим указанием на тяжесть сна, но не скрывает переходный смысл редкого греческого глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Оборот «отягощены сном» сознательно сохраняет образ оригинала; «окончательно пробудившись» естественно выражает наиболее вероятный контекстуальный смысл редкого глагола. Местоимение «его» оставлено со строчной буквы в соответствии с обычной современной издательской практикой и формой исходного текста.
