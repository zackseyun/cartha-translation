  source_fidelity: 'Основной смысл передан верно: βεβαρημένοι ὕπνῳ сохраняет образ тяжести сна, δόξαν — «славу», а «двух мужчин» точно передаёт τοὺς δύο ἄνδρας. Однако «окончательно пробудившись» может означать необратимое или завершённое пробуждение, тогда как διαγρηγορήσαντες, вероятнее, говорит о том, что они стали вполне бодрствовать. «Стоявших рядом с ним» несколько сужает συνεστῶτας αὐτῷ, добавляя оттенок непосредственной близости; исходник допускает более нейтральное «стоявших с ним».'
