source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: ru
  text: Ибо кто постыдится Меня и Моих слов, того[a] постыдится Сын Человеческий, когда придёт в Своей славе и славе Отца и святых ангелов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «этого».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческую конструкцию можно также передать: «когда придёт в Своей славе, и в славе Отца и святых ангелов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Ибо кто
  rationale: Частица γάρ передаёт пояснительную связь словом «ибо», а неопределённо-относительная конструкция ὃς…ἄν имеет обобщающий смысл «кто» / «кто бы ни».
- source_word: ἐπαισχυνθῇ … ἐπαισχυνθήσεται
  choice: постыдится … постыдится
  rationale: Одинаковый глагол в обеих частях сохраняет намеренную взаимность греческой формулировки; варианты «отречётся» или «отвергнет» были бы более сильным толкованием.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: Меня и Моих слов
  rationale: «Слов» прямо передаёт λόγους и не сводит выражение к более вольному «того, что Я говорю».
- source_word: τοῦτον
  choice: того
  rationale: Указательное местоимение отсылает к обобщающему «кто»; русская соотносительная конструкция «кто… того» естественна и сохраняет единственное число.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся и прозрачная передача титула, сохраняющая его библейские и, в частности, данииловские ассоциации.
- source_word: ὅταν ἔλθῃ
  choice: когда придёт
  rationale: ὅταν с аористом сослагательного наклонения здесь указывает на будущее событие; «когда придёт» естественно передаёт этот смысл.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: в Своей славе
  rationale: Предлог ἐν обозначает сферу или явление славы, сопровождающее пришествие; возвратное «Своей» недвусмысленно относится к Сыну Человеческому.
- source_word: καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: и славе Отца и святых ангелов
  rationale: Повтор слова «славе» делает русскую координацию ясной, не превращая формулировку в толкование и сохраняя связь славы с Отцом и святыми ангелами.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: святых ангелов
  rationale: Прямая и естественная передача сочетания прилагательного ἅγιος с существительным ἄγγελος.
theological_decisions:
- issue: Ответное действие Сына Человеческого
  choice: постыдится
  alternative: отречётся / отвергнет
  rationale: Лексически одинаковая передача обоих употреблений ἐπαισχύνομαι сохраняет торжественную взаимность предупреждения и не усиливает его до явно выраженного отвержения.
- issue: Слава Сына Человеческого, Отца и святых ангелов
  choice: в Своей славе и славе Отца и святых ангелов
  alternative: в Своей славе, и в славе Отца и святых ангелов
  rationale: Выбранный вариант сохраняет тесную синтаксическую связь одной «славы» с тремя родительными определениями, но не решает сверх текста вопрос о точном характере этой общей или соотнесённой славы.
- issue: Обобщающее лицо в конструкции ὃς…τοῦτον
  choice: кто… того
  alternative: кто бы ни… этого человека
  rationale: Русская конструкция имеет обобщающий охват и не ограничивает предупреждение мужчинами, при этом сохраняет грамматическое единственное число исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Заглавные буквы в местоимениях «Меня», «Моих», «Своей» употреблены в соответствии с принятым русским благоговейным оформлением речи о Христе; синтаксис остаётся естественным для современного читателя.
