base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: ru
  text: А если вас не примут[a], то, выходя из того города[b], отряхните пыль с ног ваших в свидетельство против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не встретят радушно». Глагол может означать как принятие посланников, так и гостеприимный приём.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поселения». Греческое слово πόλις может обозначать город или иной населённый пункт в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: если где вас не примут
  rationale: Сочетание ὅσοι с ἄν имеет обобщённо-неопределённый смысл; по-русски в контексте наставления посланникам естественно передать его конструкцией «если где». «Не примут» сохраняет как принятие посланников, так и оттенок гостеприимного приёма.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: выходя из того города
  rationale: Причастие выражает действие, одновременное с повелением. πόλις может обозначать населённый пункт разного размера; традиционно понятное русское «город» не уточняет его величину, а ἐκείνης передано словом «того».
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ἀποτινάσσετε
  choice: отряхните пыль с ваших ног
  rationale: «Отряхните» естественно передаёт повеление о резком удалении пыли и сохраняет образ символического действия; «с ваших ног» прямо соответствует греческому обороту.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: это будет свидетельством против них
  rationale: Развёрнутая русская конструкция ясно выражает назначение действия. «Против них» сохраняет неблагоприятный, обличительный смысл свидетельства, не превращая его в явное объявление окончательного приговора.
theological_decisions:
- issue: Смысл символического отряхивания пыли
  choice: свидетельство против отвергших посланников
  alternative: нейтральный знак для них или прямое объявление окончательного Божьего суда
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς придаёт жесту обличительно-судебный оттенок, однако сам стих не раскрывает меру и окончательность суда. Перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; повеление звучит ясно и достойно. Синтаксис слегка перестроен ради естественности, при этом сохранены обобщённость условия, образ действия и обличительная сила заключительной фразы.
