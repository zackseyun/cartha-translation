  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: ru
  text: Когда же он ещё подходил, бес поверг его на землю и скрутил судорогами. Но Иисус запретил нечистому духу, исцелил мальчика и вернул его отцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Когда же он ещё подходил
  rationale: Генитив абсолютный с причастием настоящего времени обозначает одновременное продолжающееся действие; «же» служит мягким повествовательным переходом, не усиливая противопоставление.
- source_word: ἔρρηξεν αὐτὸν
  choice: поверг его на землю
  rationale: В данном контексте глагол передаёт насильственное бросание вниз; добавление «на землю» естественно выражает подразумеваемое направление действия по-русски.
- source_word: τὸ δαιμόνιον
  choice: бес
  rationale: Прямой и традиционный русский эквивалент для личного злого духовного существа; сохраняет отличие от последующего выражения «нечистый дух».
- source_word: συνεσπάραξεν
  choice: стал бить в судорогах
  rationale: Передаёт вызванные бесом сильные судороги естественным современным русским выражением, сохраняя каузативный смысл греческого глагола.
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: В евангельском контексте изгнания духов глагол означает властный словесный запрет; русское «запретил» ясно и традиционно передаёт эту силу.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: нечистому духу
  rationale: Точно сохраняет личностную духовную терминологию и оттенок нечистоты греческого выражения.
- source_word: ἰάσατο
  choice: исцелил
  rationale: Естественный библейский и современно понятный эквивалент глагола исцеления; сохраняет указанное текстом измерение исцеления наряду с изгнанием духа.
- source_word: τὸν παῖδα
  choice: мальчика
  rationale: Контекст указывает на ребёнка мужского пола; перевод конкретен, но не подставляет слово «сын», которого здесь нет.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: вернул его отцу
  rationale: Передаёт значение возвращения или восстановления кому-либо и звучит естественно по-русски.
theological_decisions:
- issue: Описание бесовского воздействия
  choice: Сохранить личностные обозначения «бес» и «нечистый дух»
  alternative: Обезличить как «злая сила» или свести описание к заболеванию
  rationale: Греческий текст представляет действующего личного духовного агента и затем называет его нечистым духом. Одновременно слово «исцелил» сохраняет лечебное измерение события, не смешивая и не противопоставляя его изгнанию духа.
- issue: Связь между «бесом» и «нечистым духом»
  choice: Передать оба разных греческих обозначения без поясняющей вставки
  alternative: Унифицировать оба обозначения или прямо добавить, что это один и тот же дух
  rationale: В контексте они имеют одного референта, однако перевод сохраняет лексическую вариативность оригинала и не добавляет отсутствующего пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Синтаксис сделан ясным для обычного читателя; архаичное «отрок» не используется. «Когда же» предпочтено чрезмерно контрастному «но», поскольку δέ здесь естественно понимать как повествовательный переход.
