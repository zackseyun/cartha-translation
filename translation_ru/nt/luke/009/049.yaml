base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: ru
  text: 'Тогда Иоанн сказал: «Наставник, мы видели, как один человек изгонял бесов Твоим именем, и пытались остановить его, потому что он не следует вместе с нами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не следует с нами». Возможно, этим подчёркивается, что он не принадлежал к кругу учеников.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Тогда Иоанн сказал
  rationale: Причастие ἀποκριθείς с δέ служит обычным повествовательным переходом и указывает на реплику в ответ на предшествующее; естественное русское «тогда… сказал» передаёт связь без тяжеловесного «отвечая».
- source_word: Ἐπιστάτα
  choice: Наставник
  rationale: Характерное для Луки обращение учеников к Иисусу выражает признание Его руководства и авторитета; «Наставник» звучит естественно и dignified, не сводя обращение лишь к преподаванию.
- source_word: εἴδομέν τινα
  choice: мы видели, как один человек
  rationale: Неопределённое τινα указывает на не названного человека; конструкция «видели, как…» естественно вводит наблюдаемое действие причастия ἐκβάλλοντα.
- source_word: ἐν τῷ ὀνόματί σου
  choice: Твоим именем
  rationale: Творительный падеж естественно передаёт действие посредством имени и опору на связанный с ним авторитет, сохраняя богословскую значимость выражения.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: изгонял бесов
  rationale: «Изгонять бесов» — точный, понятный и устойчивый русский эквивалент для экзорцистского употребления ἐκβάλλω.
- source_word: ἐκωλύομεν αὐτόν
  choice: пытались остановить его
  rationale: Имперфект допускает оттенок продолжавшейся или безуспешно предпринимавшейся попытки; эта формулировка сохраняет аспектуальный нюанс.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: потому что он не следует за Тобой вместе с нами
  rationale: Глагол ἀκολουθεῖ в контексте подразумевает следование за Иисусом, а μεθ’ ἡμῶν прямо означает «с нами». Восполнение «за Тобой» делает русскую фразу грамматически естественной, не стирая указания на неприсоединённость к группе учеников.
theological_decisions:
- issue: Неоднозначность жалобы о принадлежности к кругу учеников
  choice: «не следует за Тобой вместе с нами»
  alternative: «не следует с нами»; «не следует за нами»
  rationale: Греческое μεθ’ ἡμῶν подчёркивает, что человек не сопровождал группу учеников. Добавление подразумеваемого объекта «за Тобой» избегает неестественной русской конструкции и не создаёт впечатления, будто Иоанн требовал следовать за самими учениками. Сноска сохраняет более буквальную форму и её смысловой оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («бесы», «Твоим именем»). Обращение к Иисусу оформлено с прописной буквы по принятой русской библейской издательской традиции; синтаксис остаётся доступным обычному читателю.
