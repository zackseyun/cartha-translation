review_pass:
  verdict: revise
  source_fidelity: 'Основная передача точна: «изгонял бесов Твоим именем» хорошо соответствует ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, а «пытались остановить» удачно передаёт имперфект ἐκωλύομεν. Однако добавление «за Тобой» в последней части отсутствует в греческом тексте. Оно выбирает и делает явным возможный объект глагола ἀκολουθεῖ, тогда как μεθ’ ἡμῶν прямо означает «с нами» и оставляет формулировку менее определённой.'
  naturalness: Исправленный вариант остаётся естественным для современного литературного русского. «Не следует вместе с нами» несколько книжнее разговорной речи, но уместно в библейском повествовании и позволяет не добавлять объект «за Тобой».
  terminology: «Наставник» — подходящий русский эквивалент Ἐπιστάτα в лукановском обращении учеников. «Изгонял бесов» — точная и устойчивая библейская формулировка. Написание местоимения «Твоим» с прописной буквы последовательно в рамках выбранной издательской традиции.
  issues:
  - severity: medium
    issue: В основной текст добавлено «за Тобой» в выражении «он не следует за Тобой вместе с нами».
    rationale: В греческом ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν объект при ἀκολουθεῖ не назван; выражение буквально содержит «не следует с нами». Хотя контекст допускает понимание следования за Иисусом, перевод не должен устранять эту синтаксическую и смысловую сдержанность добавлением отсутствующего слова.
  - severity: low
    issue: Сноска категорично истолковывает выражение как принадлежность к сопровождавшей Иисуса группе.
    rationale: Такое понимание вероятно и согласуется с контекстом, но формулировка должна отмечать его как возможный смысловой акцент, а не как однозначное значение текста.
