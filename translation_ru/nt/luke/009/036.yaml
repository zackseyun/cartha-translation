base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: ru
  text: Когда прозвучал голос, Иисус оказался один.[a] Ученики молчали и в те дни никому не рассказали ничего из того, что видели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Иисус был найден один». Возможны также переводы: «остался один Иисус» или «виден был только Иисус».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Когда прозвучал голос
  rationale: Конструкция ἐν с артиклевым инфинитивом выражает время; «когда прозвучал голос» естественно передаёт наступление события и ясно указывает на небесный голос.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: оказалось, что Иисус один
  rationale: Греческое пассивное εὑρέθη буквально означает «был найден», но в данном повествовательном контексте сообщает обнаружившийся итог сцены. Русское «оказалось» сохраняет сдержанность формулировки, не уточняя, исчезли ли Моисей и Илия или ученики увидели только Иисуса.
- source_word: ἐσίγησαν
  choice: промолчали
  rationale: Аорист передаёт состоявшееся молчание учеников; «промолчали» естественно и лаконично звучит в современном русском повествовании.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: никому не рассказали
  rationale: ἀπαγγέλλω означает сообщать или рассказывать; в данном контексте нейтральное «рассказали» наиболее естественно.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в те дни
  rationale: Прямое и идиоматичное соответствие временному обороту.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: ничего из того, что видели
  rationale: Формулировка сохраняет отрицание и партитивное отношение относительной конструкции, оставаясь естественной по-русски.
theological_decisions:
- issue: Повествовательный смысл одиночного присутствия Иисуса после небесного голоса
  choice: «оказалось, что Иисус один» — описательно, без добавленного богословского толкования
  alternative: «остался один Иисус» или «они увидели только Иисуса»
  rationale: Греческий текст сообщает итог сцены, но не объясняет его богословское значение и не формулирует явно способ восприятия учениками. Перевод сохраняет эту сдержанность и неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Слово «ученики» добавлено вместо местоимения для естественной русской связности; референт однозначен из контекста.
