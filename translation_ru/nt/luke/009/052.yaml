  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: ru
  text: И послал перед Собой вестников. Они пошли и вошли в селение самарян[a], чтобы приготовить для Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самарянское селение». Буквально: «селение самарян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычное и точное соответствие аористу ἀποστέλλω в повествовательном контексте.
- source_word: ἀγγέλους
  choice: вестников
  rationale: Контекст ясно указывает на людей, посланных вперёд, а не на небесных ангелов.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: перед Собой
  rationale: Естественно передаёт идиому «перед лицом Его» и значение движения впереди Иисуса; возвратная форма ясно соотносится с подлежащим.
- source_word: πορευθέντες εἰσῆλθον
  choice: Они пошли и вошли
  rationale: Сочинительная конструкция естественна по-русски и сохраняет последовательность действий, выраженную аористным причастием перед личным глаголом.
- source_word: κώμην Σαμαριτῶν
  choice: селение самарян
  rationale: Сохраняет генитивную форму оригинала и обозначает небольшое поселение, населённое самарянами.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: чтобы всё приготовить для Него
  rationale: Передаёт значение цели. «Всё» естественно восполняет по-русски невыраженный объект приготовления, не уточняя его содержания.
