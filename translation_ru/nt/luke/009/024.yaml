  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: ru
  text: Ведь кто хочет спасти свою жизнь, тот потеряет её[a]; а кто потеряет свою жизнь ради меня, тот спасёт её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою душу» либо «самого себя»; греческое слово может в зависимости от контекста означать жизнь, душу или самого человека.'
    reason: Лексическая многозначность ψυχή.
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Ведь кто хочет
  rationale: Сочетание ὃς с ἄν и сослагательным наклонением выражает общее условие — «кто». Частица γάρ сохраняет пояснительную связь с предыдущими словами и естественно передаётся как «ведь»; θέλῃ обозначает желание или намерение.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: свою жизнь
  rationale: В данном парадоксе ψυχή прежде всего обозначает жизнь человека, хотя слово также может означать душу или самого человека. Возвратное «свою» естественно по-русски передаёт принадлежность подлежащему каждой части.
- source_word: σῶσαι / σώσει
  choice: спасти / спасёт
  rationale: Одинаковый перевод обеих форм σῴζω сохраняет словесный повтор и парадокс оригинала; в контексте глагол включает смысл сохранения жизни.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: потеряет / потеряет
  rationale: Здесь ἀπόλλυμι означает утрату жизни. Единообразный перевод сохраняет симметрию противопоставленных частей.
- source_word: ἕνεκεν ἐμοῦ
  choice: ради меня
  rationale: ἕνεκεν с родительным падежом указывает на причину или мотив; «ради меня» естественно выражает личную направленность ученичества.
- source_word: οὗτος
  choice: тот
  rationale: Указательное местоимение подчёркивает именно описанного человека. Русская соотносительная конструкция «кто… тот» естественно сохраняет этот акцент.
theological_decisions:
- issue: Значение ψυχή в парадоксе Иисуса
  choice: жизнь
  alternative: душа; сам человек, своё «я»
  rationale: Непосредственный контекст говорит о самоотречении и утрате либо сохранении жизни ради Иисуса. «Жизнь» передаёт основной смысл, не сводя ψυχή исключительно к нематериальной душе; широта значения отмечена в сноске.
- issue: Напряжение между земной утратой и окончательным спасением жизни
  choice: сохранён буквальный повтор «спасти — потерять — потерять — спасти»
  alternative: истолковать второе «спасёт» как исключительно вечное спасение
  rationale: Текст намеренно не поясняет временной или эсхатологический аспект парадокса, поэтому перевод не устраняет эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с ясной соотносительной конструкцией «кто… тот». «Ведь» передаёт пояснительную функцию γάρ без архаизации; строчная форма «меня» соответствует обычной современной орфографии и не вводит конфессиональной типографической традиции.
