source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: ru
  text: 'Когда они шли по дороге, кто-то сказал ему: «Я последую за тобой, куда бы ты ни пошёл[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «куда бы ты ни удалился» или «куда бы ты ни отправился».'
    reason: Лексическая альтернатива для ἀπέρχῃ, которое может означать не просто движение, а уход или удаление.
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: когда они шли
  rationale: Генитив абсолютный с причастием настоящего времени обозначает действие, происходящее одновременно с главным; эта формулировка естественно передаёт продолжающееся движение.
- source_word: ἐν τῇ ὁδῷ
  choice: по дороге
  rationale: Передаёт конкретную обстановку пути и при этом не устраняет характерный для Луки мотив путешествия.
- source_word: εἶπέν τις
  choice: кто-то сказал
  rationale: Неопределённое местоимение τις не указывает ни на конкретного человека, ни на его пол, поэтому слово «кто-то» точнее, чем «один человек» или «некий мужчина».
- source_word: πρὸς αὐτόν
  choice: сказал ему
  rationale: Естественная русская конструкция при глаголе речи; отдельный предлог в переводе не требуется.
- source_word: Ἀκολουθήσω σοι
  choice: Я последую за тобой
  rationale: Будущее время выражает заявленное намерение. Глагол «последую» сохраняет и буквальное значение движения вслед за кем-либо, и возможный смысл ученичества.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: куда бы ты ни пошёл
  rationale: Сочетание ὅπου с ἐάν и сослагательным наклонением имеет обобщённо-неопределённый смысл «куда бы ни». Глагол ἀπέρχομαι может подчёркивать удаление, но здесь естественное «пошёл» точно передаёт обещание следовать в любое место.
theological_decisions:
- issue: Ученический смысл глагола ἀκολουθέω
  choice: Я последую за тобой
  alternative: Я стану твоим учеником и пойду за тобой
  rationale: В контексте Луки глагол связан с ученичеством, однако добавление прямого пояснения сузило бы его значение. Выбранный перевод сохраняет одновременно буквальный и богословский оттенки.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. Местоимения, относящиеся к Иисусу, даны со строчной буквы согласно нейтральной современной издательской норме. Синтаксис сохраняет последовательность событий и не вносит отсутствующих в греческом тексте сведений о говорящем.
