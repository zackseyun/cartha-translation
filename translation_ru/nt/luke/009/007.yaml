base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: ru
  text: Тетрарх Ирод услышал обо всём, что происходило, и недоумевал, потому что некоторые говорили, что Иоанн был воскрешён из мёртвых[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскрес из мёртвых». Греческий глагол стоит в страдательном залоге; буквально: «был поднят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: услышал обо всём
  rationale: С ἀκούω и объектом, обозначающим происходящие события, русский оборот «услышал обо всём, что происходило» естественно передаёт получение известий.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит мягкой повествовательной связкой; в современном русском её естественно передать самим продолжением повествования, не вводя искусственного «теперь» или контрастного «но».
- source_word: ὁ τετραάρχης
  choice: тетрарх
  rationale: Сохранён конкретный историко-политический титул, а не более общее «правитель» и не неточное «царь».
- source_word: τὰ γινόμενα πάντα
  choice: обо всём, что происходило
  rationale: Передаёт всеохватность πάντα и продолжающийся характер событий в причастии γινόμενα естественным русским оборотом.
- source_word: διηπόρει
  choice: недоумевал
  rationale: Глагол обозначает состояние сильной озадаченности и неуверенности; «недоумевал» ясно и литературно передаёт это значение.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: потому что некоторые говорили
  rationale: Причинное значение конструкции с διά сохранено; пассивная форма преобразована в естественную для русского активную конструкцию с сохранением неопределённого субъекта τινων.
- source_word: ἠγέρθη
  choice: был воскрешён
  rationale: Страдательная форма греческого глагола сохранена, не заменяясь непереходным «воскрес».
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Это естественная и традиционно понятная русская формула воскресения, близко соответствующая греческому выражению.
theological_decisions:
- issue: Формулировка сообщения о воскресении Иоанна
  choice: был воскрешён из мёртвых
  alternative: воскрес из мёртвых
  rationale: Страдательный залог ἠγέρθη сохранён, чтобы не сглаживать формулировку источника и не заменять её активной непереходной конструкцией.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Исторический титул «тетрарх» сохранён. Конструкция проста и понятна обычному читателю; формулировка «будто» ясно показывает, что речь идёт о распространявшемся сообщении, а не об утверждении повествователя.
