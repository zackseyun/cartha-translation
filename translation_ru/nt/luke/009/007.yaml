  source_fidelity: 'Основной смысл передан точно: Ἤκουσεν отражено как получение известий, πάντα τὰ γινόμενα — как «обо всём, что происходило», διηπόρει — как «недоумевал», а ἠγέρθη сохраняет страдательный залог в «был воскрешён». Однако «будто» добавляет оттенок недоверия, которого в ὅτι нет; нейтральное «что» точнее. Конечная запятая сохранена, поскольку греческий текст продолжает перечисление сообщений в следующем стихе.'
