id: LUK.9.4
reference: Luke 9:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν οἰκίαν εἰσέλθητε, ἐκεῖ μένετε καὶ ἐκεῖθεν ἐξέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/004.yaml
  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: ru
  text: И в какой бы дом вы ни вошли, оставайтесь там и оттуда уходите.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκίαν
  choice: дом
  rationale: Обычное и точное обозначение дома или домашнего хозяйства; в данном контексте речь идёт о месте, где учеников принимают на постой.
- source_word: μένετε
  choice: оставайтесь
  rationale: Передаёт продолжительное пребывание и естественно выражает повеление не менять место проживания.
- source_word: ἐξέρχεσθε
  choice: уходите
  rationale: В контексте отправления из места пребывания русское «уходите» естественнее буквального «выходите», не добавляя явно не названного пункта назначения.
theological_decisions:
- issue: Откуда именно следует уходить
  choice: оттуда уходите
  alternative: из него уходите
  rationale: 'Сохранено наречие ἐκεῖθεν («оттуда») и присущая греческому тексту некоторая неоднозначность: это может относиться к дому как исходной точке при дальнейшем отправлении, без добавления отсутствующего в стихе указания на город или селение.'
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная формулировка сохраняет параллелизм ἐκεῖ… ἐκεῖθεν («там… оттуда») и повелительный характер речи.
