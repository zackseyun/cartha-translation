  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: «в какой бы дом вы ни вошли» соответствует εἰς ἣν ἂν οἰκίαν εἰσέλθητε; «оставайтесь там» — ἐκεῖ μένετε; «оттуда уходите» — ἐκεῖθεν ἐξέρχεσθε. Наречная пара «там… оттуда» сохранена, как и отсутствие уточнения о конкретном пункте дальнейшего пути.'
