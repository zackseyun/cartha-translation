base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: ru
  text: 'Но истинно говорю вам: среди стоящих здесь есть некоторые, которые не вкусят смерти[a], пока не увидят Царства Божьего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вкусить смерть» — образное выражение со значением «умереть».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Но истинно говорю вам
  rationale: Сохраняет противопоставительный или переходный оттенок δέ и наречное значение ἀληθῶς, следуя греческому порядку слов без неестественной буквальности.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: среди стоящих здесь есть некоторые
  rationale: Естественно передаёт экзистенциальную конструкцию и партитивный родительный; «здесь» выражает местное значение αὐτοῦ и указывает на присутствующих рядом с Иисусом.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: которые не вкусят смерти
  rationale: Сохраняет образное выражение с γεύομαι. Сочетание οὐ μή является усиленным отрицанием; в русском категоричность достаточно ясно выражена формой будущего времени в пророческом утверждении, без стилистически тяжёлого добавления.
- source_word: ἕως ἂν ἴδωσιν
  choice: пока не увидят
  rationale: Естественная русская передача будущего предела действия, выраженного ἕως ἄν с аористом сослагательного наклонения.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Традиционное и понятное обозначение βασιλεία τοῦ θεοῦ, сохраняющее широкий смысл царства и царствования Бога.
theological_decisions:
- issue: К чему относится выражение «увидят Царство Божье»
  choice: Фраза сохранена без истолковывающего уточнения.
  alternative: Уточнить, что речь идёт о преображении, воскресении и вознесении, разрушении Иерусалима либо распространении Церкви.
  rationale: Греческий текст не называет событие прямо, а контекст допускает различные исторические толкования. Перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для прямой речи Иисуса. Сохранены библейские выражения «вкусить смерть» и «Царство Божье», при этом синтаксис остаётся понятным современному читателю.
