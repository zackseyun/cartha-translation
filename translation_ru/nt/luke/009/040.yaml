  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: ru
  text: Я просил Твоих учеников изгнать его[a], но они не смогли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое местоимение, вероятнее всего, относится к духу; его также понимают как относящееся к мальчику. В русском оба варианта передаются словом «его».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: Я просил
  rationale: Глагол передаёт настойчивую просьбу; в данном контексте «просил» звучит естественно и сохраняет серьёзность обращения отца, не добавляя излишней эмоциональной окраски.
- source_word: τῶν μαθητῶν σου
  choice: Твоих учеников
  rationale: «Ученики» — устойчивый и точный русский эквивалент μαθηταί в евангельском контексте, сохраняющий отношение учеников к учителю.
- source_word: ἵνα ἐκβάλωσιν
  choice: изгнать
  rationale: Инфинитив естественно передаёт целевое значение конструкции ἵνα с сослагательным наклонением; «изгнать» соответствует обычному контексту освобождения от духа.
- source_word: αὐτό
  choice: его
  rationale: Русский язык требует местоимения мужского рода при вероятной отсылке к ранее названному духу (τὸ πνεῦμα — среднего рода по-гречески, но «дух» — мужского рода по-русски). При этом грамматически возможна отсылка к мальчику, что отмечено в сноске.
- source_word: οὐκ ἠδυνήθησαν
  choice: они не смогли
  rationale: Кратко и естественно передаёт отсутствие способности или успеха; явное подлежащее помогает сохранить противопоставление ученикам.
theological_decisions:
- issue: К кому относится αὐτό в контексте изгнания
  choice: 'Местоимение относится к духу: «его».'
  alternative: Местоимение может относиться к мальчику; по-русски форма также будет «его».
  rationale: В повествованиях об изгнании объектом ἐκβάλλω обычно является дух, и средний род αὐτό согласуется с πνεῦμα. Однако форма допускает контекстуальную отсылку к мальчику. Русский перевод не различает эти варианты местоимением, поэтому неоднозначность поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Обращение к Иисусу передано с традиционным прописным «Твоих». Формулировка сдержанная и естественная; подлинная неоднозначность референта местоимения сохранена посредством сноски.
