source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: ru
  text: 'И случилось, что, когда Он молился один[a], ученики были с Ним. Он спросил их: «За кого Меня считают толпы?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наедине». Выражение κατὰ μόνας может указывать на уединение, не обязательно на полное отсутствие других людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: И случилось, что
  rationale: Передаёт характерную для Луки повествовательную формулу естественным современным русским языком.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: когда Он молился
  rationale: Конструкция с артиклевым инфинитивом и ἐν обозначает одновременное обстоятельство; русское «когда Он молился» ясно и идиоматично.
- source_word: κατὰ μόνας
  choice: один
  rationale: Сохраняет основное значение уединённой молитвы; сноска отмечает возможный смысл «наедине», не снимающий присутствия учеников.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: ученики были с Ним
  rationale: Буквально и без поясняющей гармонизации передаёт присутствие учеников рядом с Иисусом.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: Он спросил их
  rationale: В современном русском причастие λέγων при глаголе речи естественно не воспроизводится отдельно.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: За кого почитают Меня толпы?
  rationale: Естественная русская конструкция, точно передающая вопрос о том, кем толпы считают Иисуса; «толпы» сохраняет конкретное значение οἱ ὄχλοι.
theological_decisions:
- issue: Кажущееся противоречие между молитвой Иисуса в одиночестве и присутствием учеников
  choice: 'Сохранить обе части прямо: Он молился один, а ученики были с Ним.'
  alternative: Перевести «молился наедине» либо добавить, что ученики находились неподалёку.
  rationale: Греческий текст оставляет напряжение между уединённостью молитвы и присутствием учеников; перевод не должен устранять его истолковывающим пояснением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимения, относящиеся к Иисусу, даны с прописной буквы по принятой русской библейской традиции; синтаксис упрощён там, где буквальное воспроизведение греческого причастия было бы неестественным.
