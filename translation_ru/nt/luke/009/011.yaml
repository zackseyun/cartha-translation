base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: ru
  text: Но толпы, узнав об этом, пошли за Ним. Он радушно принял их, говорил им о Царстве Божьем и исцелял тех, кто нуждался в лечении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто нуждался в исцелении». Греческое слово θεραπεία может означать как исцеление, так и лечение или уход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Но люди
  rationale: δέ передаёт мягкий контраст с попыткой Иисуса удалиться; множественное ὄχλοι здесь естественно обозначает множество людей, а буквальное «толпы» по-русски звучало бы тяжеловесно.
- source_word: γνόντες
  choice: узнав об этом
  rationale: Аористное причастие имеет обстоятельственно-временное значение и указывает, что люди узнали о местонахождении или перемещении Иисуса.
- source_word: ἠκολούθησαν αὐτῷ
  choice: пошли за Ним
  rationale: Передаёт конкретное физическое следование в данном повествовании, не исключая более широкого евангельского оттенка глагола ἀκολουθέω.
- source_word: ἀποδεξάμενος αὐτούς
  choice: радушно принял их
  rationale: ἀποδέχομαι означает благосклонно принять, приветствовать; «радушно принял» сохраняет положительный оттенок и естественно звучит по-русски.
- source_word: ἐλάλει αὐτοῖς
  choice: говорил им
  rationale: Несовершенный вид русского глагола естественно передаёт длительность имперфекта ἐλάλει.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: о Царстве Божьем
  rationale: Устоявшаяся и понятная передача ключевого евангельского выражения, сохраняющая его смысловую широту.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: тех, кто нуждался в лечении
  rationale: Сохраняет именную конструкцию и возможное значение θεραπεία как лечения или врачебной помощи, не дублируя буквально следующий глагол «исцелял».
- source_word: ἰᾶτο
  choice: исцелял
  rationale: Несовершенный вид передаёт продолжающееся или повторяющееся действие имперфекта ἰᾶτο.
theological_decisions:
- issue: Передача βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  alternative: Божье правление
  rationale: «Царство Божье» — укоренившееся и достаточно точное выражение, которое не сводит βασιλεία только к территории и сохраняет межтекстовую последовательность.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Несовершенный вид «говорил» и «исцелял» сохраняет длительность греческих имперфектов. Местоимение «Ним» оформлено с традиционной прописной буквы как ясная отсылка к Иисусу.
