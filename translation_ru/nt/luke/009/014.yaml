  source_fidelity: 'Текст точно передаёт греческий оригинал: γάρ отражено словом «Ведь», ὡσεὶ — «около» и «примерно», ἄνδρες — «мужчин», а распределительное ἀνά πεντήκοντα — «примерно по пятьдесят». Формулировка «Расположите их для трапезы» адекватно передаёт каузативный глагол κατακλίνω и его трапезный контекст, не создавая неестественной для современного русского команды «возлечь».'
