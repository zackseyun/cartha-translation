id: LUK.9.14
reference: Luke 9:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: ru
  text: 'Ведь мужчин было около пяти тысяч[a]. И Он сказал Своим ученикам: «Расположите их для трапезы группами примерно по пятьдесят»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте сказано именно «мужчин», то есть взрослых лиц мужского пола; женщины и дети в это число не входят.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Велите им возлечь группами примерно по пятьдесят». Греческий глагол обозначает положение, в котором обычно принимали пищу во время трапезы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: около / примерно
  rationale: Передаёт приблизительность обоих числовых указаний и звучит естественно по-русски.
- source_word: ἄνδρες
  choice: мужчин
  rationale: Греческое ἀνήρ здесь обозначает именно взрослых лиц мужского пола, а не людей вообще.
- source_word: πεντακισχίλιοι
  choice: пять тысяч
  rationale: Прямое соответствие количественному числительному, относящемуся к слову «мужчин».
- source_word: Κατακλίνατε
  choice: Расположите их для трапезы
  rationale: Глагол означает велеть людям возлечь или разместить их как участников трапезы; такой перевод сохраняет историческую реалистичность и избегает неестественного современного призыва «возлечь».
- source_word: κλισίας
  choice: группами
  rationale: Множественное число обозначает отдельные организованные группы; по-русски естественно передаётся творительным падежом.
- source_word: ἀνὰ πεντήκοντα
  choice: примерно по пятьдесят
  rationale: Предлог ἀνά с числительным выражает распределение, а ὡσεὶ указывает на приблизительность.
- source_word: γὰρ ... δὲ
  choice: Ведь ... И
  rationale: «Ведь» сохраняет пояснительную функцию γάρ, а «И» естественно продолжает повествование, передавая δέ без излишнего противопоставления.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: Своим ученикам
  rationale: Возвратно-притяжательное «Своим» естественно передаёт явное греческое αὐτοῦ при подлежащем «Он».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Формула «расположите их для трапезы» передаёт культурно-исторический смысл возлежания, не создавая у современного читателя впечатления, будто людям велено лечь на землю; более буквальный вариант сохранён в примечании.
