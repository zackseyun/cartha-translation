  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: ru
  text: 'И из облака раздался голос[a]: «Это Мой Сын, Избранный; слушайте Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Мой возлюбленный Сын» вместо «Мой Сын, Избранный».'
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: раздался голос
  rationale: Естественная русская передача событийной конструкции ἐγένετο с φωνή; сохраняет смысл возникновения звучащего голоса без буквального и неестественного «стал голос».
- source_word: ἐκ τῆς νεφέλης
  choice: из облака
  rationale: Предлог ἐκ указывает на источник; «из облака» точно и естественно передаёт направление голоса.
- source_word: λέγουσα
  choice: двоеточие перед прямой речью
  rationale: Содержание причастия «говорящий» в русском повествовании естественно выражается введением прямой речи, без тяжеловесного «говоривший».
- source_word: Οὗτός ἐστιν
  choice: Это
  rationale: В именной идентифицирующей конструкции русское «Это» естественно передаёт Οὗτός ἐστιν; связка настоящего времени опускается по нормам русского языка.
- source_word: ὁ υἱός μου
  choice: Мой Сын
  rationale: Прямо передаёт родственное обозначение с притяжательным местоимением. Прописные буквы уместны как обозначение Иисуса и как местоименная отсылка к Нему в библейском издательском регистре.
- source_word: ὁ ἐκλελεγμένος
  choice: Избранный
  rationale: Субстантивированное перфектное страдательное причастие означает того, кто избран. «Избранный» сохраняет отдельный титул в приложении к «Мой Сын» и не добавляет второго притяжательного местоимения, отсутствующего при самом причастии.
- source_word: αὐτοῦ ἀκούετε
  choice: слушайте Его
  rationale: ἀκούω с родительным лица и повелительным значением здесь означает внимать и следовать сказанному; «слушайте Его» естественно сохраняет силу продолжающегося повеления.
theological_decisions:
- issue: Вариант христологического определения в небесном голосе
  choice: ἐκλελεγμένος передано как «Избранный»
  alternative: 'ἀγαπητός: «возлюбленный» / «Мой возлюбленный Сын»'
  rationale: Основной текст следует SBLGNT и сохраняет характерное для данного чтения «Избранный», не гармонизируя стих с более привычной формулировкой синоптических параллелей. Альтернативное рукописное чтение отмечено в сноске.
- issue: Отношение определения «Избранный» к словам «Мой Сын»
  choice: «Мой Сын, Избранный»
  alternative: «Мой Сын, Мой Избранник»
  rationale: Греческий текст содержит μου при «Сын», но не повторяет притяжательное местоимение при ὁ ἐκλελεγμένος. Выбранная формулировка сохраняет приложение и не вносит отсутствующее в тексте второе «Мой».
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной повествовательной интонацией. Порядок слов и пунктуация приспособлены к нормам русской прямой речи; смысловые титулы сохранены без конфессионального уточнения.
