source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ru
  text: 'Иисус сказал ему: «У лис есть норы, и у небесных птиц — гнёзда[a], а Сыну Человеческому[b] негде склонить голову».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «логова».'
    reason: lexical_alternative
  - marker: b
    text: «Сын Человеческий» — самонаименование Иисуса, которое может перекликаться с Дан 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: лисы
  rationale: Прямое обозначение животного; контекст не требует обобщения или образного истолкования.
- source_word: φωλεούς
  choice: норы
  rationale: В сочетании с лисами естественно обозначает их укрытия или логова; «норы» — ясный и привычный современный русский эквивалент.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: небесные птицы
  rationale: Естественная русская передача буквального «птицы неба», сохраняющая образ и не смешивающая οὐρανός с воздухом.
- source_word: κατασκηνώσεις
  choice: гнёзда
  rationale: Слово обозначает места пребывания или укрытия; применительно к птицам «гнёзда» звучит естественно, хотя греческое слово несколько шире.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняется укоренившееся русское наименование, которым Иисус говорит о Себе; оно передаёт форму греческого выражения и оставляет открытым его возможный отзвук Дан 7:13–14.
- source_word: οὐκ ἔχει ποῦ
  choice: негде
  rationale: Естественно передаёт греческую отрицательную конструкцию со значением «не имеет места, где».
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: склонить голову
  rationale: Сохраняет конкретный образ и устойчиво выражает отсутствие места для отдыха или сна.
- source_word: δέ
  choice: а
  rationale: Русский противительный союз естественно подчёркивает контраст между укрытиями животных и положением Сына Человеческого.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Прямая и естественная передача повествовательной формулы; начальное καί не воспроизводится отдельным «и», поскольку связь с контекстом по-русски ясна без него.
theological_decisions:
- issue: Передача самонаименования Иисуса υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек / Человеческий Сын
  rationale: Традиционная и узнаваемая форма сохраняет как буквальную структуру выражения, так и его возможный мессианский и апокалиптический смысл, не сводя его к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Конструкция «Сыну Человеческому негде…» естественно передаёт греческое выражение обладания; «склонить голову» сохраняет образность исходного текста.
