  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: ru
  text: И они не приняли Его[a], потому что Он направлялся в Иерусалим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оказали Ему гостеприимства».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Его лицо было направлено в Иерусалим»; этот оборот указывает на направление Его пути и может подразумевать твёрдое намерение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: не приняли
  rationale: Глагол δέχομαι может означать «принимать», «приветствовать» или «оказывать приём». В данном контексте речь, вероятно, об отказе принять Иисуса и оказать Ему гостеприимство; «не приняли» сохраняет широту греческого выражения и естественно звучит по-русски.
- source_word: τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον
  choice: Он направлялся
  rationale: Буквально конструкция говорит, что «Его лицо шло/было направлено». Это семитизированный оборот, указывающий на направление пути. Буквальное русское «Его лицо шло» неестественно и может исказить смысл, поэтому в основном тексте употреблено ясное «Он направлялся», а образ исходного выражения отмечен в сноске.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Предлог εἰς обозначает движение к месту назначения; по-русски при глаголе «направлялся» естественно сказать «в Иерусалим».
- source_word: ὅτι
  choice: потому что
  rationale: ὅτι вводит причину отказа; «потому что» ясно передаёт причинную связь.
theological_decisions:
- issue: Смысл выражения «Его лицо было идущим в Иерусалим»
  choice: 'Передать в основном тексте направление пути без явного добавления решимости: «Он направлялся в Иерусалим».'
  alternative: «Он твёрдо решил идти в Иерусалим» или «Его лицо было обращено к Иерусалиму».
  rationale: Греческое πορευόμενον прямо выражает движение, тогда как решимость может подразумеваться контекстом, но не должна безоговорочно вноситься в этот стих. Перевод сохраняет повествовательную и богословскую напряжённость, не превращая намёк в утверждение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Местоимение «Его» в отношении Иисуса написано с прописной буквы согласно распространённой русской библейской традиции. Союз «Но» естественно связывает стих с предшествующим повествованием, передавая καί в контексте как смысловое противопоставление.
