  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: ru
  text: 'День стал клониться к вечеру, и двенадцать подошли к Иисусу и сказали: «Отпусти народ, чтобы они пошли в окрестные селения и сельскую местность, нашли ночлег и припасы[b], потому что мы здесь, в безлюдном месте[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пустынном месте». Греческое ἔρημος может обозначать необитаемую или малонаселённую местность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пищу». Греческое ἐπισιτισμός означает пищу или запас продовольствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: День стал клониться к вечеру
  rationale: Сохраняет греческий образ клонящегося дня и естественно передаёт приближение вечера; δέ передано переходным построением следующего предложения, без искусственного вводного «теперь».
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: Тогда двенадцать подошли к Иисусу
  rationale: «Подошли» точно передаёт προσέρχομαι; имя «Иисусу» естественно раскрывает местоимение αὐτῷ из контекста, а «двенадцать» сохраняет титульное обозначение группы.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Отпусти народ
  rationale: ἀπολύω здесь означает распустить или отослать собравшихся; «отпусти народ» звучит естественно и сохраняет повелительную форму.
- source_word: ἵνα πορευθέντες
  choice: чтобы люди пошли
  rationale: Целевая конструкция с причастием передана естественным русским придаточным цели; «люди» ясно указывает на собирательное «народ», не меняя референта.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: в окрестные селения и сельскую местность
  rationale: κύκλῳ передано словом «окрестные»; κώμαι — селения, а ἀγροί в данном контексте обозначает сельскую местность, включая расположенные там жилища и хозяйства, а не только возделанные поля.
- source_word: καταλύσωσιν
  choice: нашли ночлег
  rationale: В контексте καταλύω означает остановиться на ночлег или найти место для временного пребывания; русское выражение делает подразумеваемый смысл ясным.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: нашли … пищу
  rationale: ἐπισιτισμός означает пищу или продовольственные припасы; «пищу» кратко и точно передаёт основной смысл, а более широкая возможность отмечена в сноске.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: потому что мы здесь, в безлюдном месте
  rationale: Сохранены причинная связь, указание «здесь» и первое лицо множественного числа; «безлюдное место» передаёт отсутствие поселений и доступных ресурсов без неуместных ассоциаций со строго определённой пустыней.
theological_decisions:
- issue: Значение ἔρημος и возможные ассоциации с пустыней
  choice: безлюдное место
  alternative: пустынное место
  rationale: 'Выбран нейтральный пространственный смысл: речь может идти о малонаселённой или необитаемой местности, не обязательно о песчаной пустыне и без навязывания символического богословского значения.'
- issue: Кого включает местоимение ἐσμέν («мы находимся»)
  choice: мы здесь
  alternative: народ находится здесь
  rationale: Первое лицо оригинала сохранено без попытки уточнить, включает ли «мы» только говорящих с Иисусом или также собравшийся народ.
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным и достойным звучанием. Синтаксис упрощён ровно настолько, чтобы фраза естественно читалась вслух; образ клонящегося дня и ключевые смысловые отношения оригинала сохранены.
