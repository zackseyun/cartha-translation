review_pass:
  verdict: revise
  source_fidelity: 'Передача в целом верна: сохранены временное значение ἰδόντες, именование Иакова и Иоанна как учеников, обращение «Господи», небесный огонь и его действие. Однако «мы велим огню сойти» несколько сильнее и менее прямо отражает εἴπωμεν («скажем [чтобы]...»); естественная русская конструкция с «скажем, чтобы» точнее передаёт греческую форму и вопрос о разрешении.'
  naturalness: «Увидев это» и общий строй фразы естественны для современного литературного русского. Формулировка «хочешь, мы скажем, чтобы с неба сошёл огонь» звучит более идиоматично, чем «хочешь, мы велим огню сойти», сохраняя умеренно возвышенный библейский регистр.
  terminology: «Господи», «с неба» и «поглотил» уместны. «Поглотил» хорошо сохраняет образ огня; «истребил» допустимо указать как альтернативу в примечании. Примечание следует исправить, поскольку «скажем огню сойти» не является удачной буквальной передачей синтаксиса греческого текста.
  issues:
  - severity: medium
    issue: «Мы велим огню сойти»
    rationale: Греческое εἴπωμεν — «скажем», с инфинитивным содержанием предложения. В данном контексте оно, несомненно, выражает намерение вызвать огонь, но русский глагол «велеть» звучит как более прямой приказ огню и стилистически тяжеловесен. «Скажем, чтобы ...» передаёт и лексику, и синтаксическую силу без добавочного усиления.
  - severity: low
    issue: Буквальное пояснение в сноске
    rationale: 'Формула «скажем огню сойти» неудачна по-русски и не отражает того, что πῦρ является субъектом инфинитива. Лучше: «скажем: пусть огонь сойдет с неба и поглотит их».'
