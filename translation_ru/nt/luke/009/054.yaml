  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: ru
  text: 'Увидев это, ученики Иаков и Иоанн сказали: «Господи, хочешь, мы скажем, чтобы с неба сошёл огонь и поглотил их?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…и истребил их». Буквально: «скажем: пусть огонь сойдет с неба и поглотит их».'
    reason: Уточняет необычную для русского форму греческой конструкции с εἴπωμεν и указывает допустимый вариант перевода ἀναλῶσαι.
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев это
  rationale: Аористное причастие передано естественным русским деепричастным оборотом; местоимение «это» восполняет подразумеваемый из контекста объект — отказ самарян принять Иисуса в предыдущем стихе.
- source_word: δὲ
  choice: не передано отдельно
  rationale: Частица обозначает переход в повествовании; в сочетании с деепричастным оборотом отдельное «же» сделало бы русскую фразу тяжелее, не добавляя существенного смысла.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: ученики Иаков и Иоанн
  rationale: Сохранена аппозиционная конструкция, которая называет двух учеников.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская звательная форма традиционного и контекстуально уместного обращения к Иисусу.
- source_word: θέλεις
  choice: хочешь
  rationale: Передаёт желание и запрос на одобрение прямо и современно.
- source_word: εἴπωμεν
  choice: мы велим
  rationale: 'Хотя буквально глагол означает «скажем», в конструкции с инфинитивом он выражает побуждение: ученики предлагают повелеть огню сойти. «Велим» естественно по-русски и не усиливает фразу до заявления о собственной власти без согласия Иисуса.'
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: огню сойти с неба
  rationale: Сохранены образ небесного огня и направление движения; «сойти» соответствует возвышенному, но понятному регистру.
- source_word: ἀναλῶσαι
  choice: поглотить
  rationale: Глагол допускает значения «поглотить, истребить». «Поглотить» сохраняет связь с образом огня и не сводит выражение к нейтральному «уничтожить».
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к жителям самарянского селения, упомянутым в контексте.
theological_decisions:
- issue: Подразумеваемый объект причастия ἰδόντες
  choice: Добавлено «это», отсылающее к отказу самарян в предыдущем стихе.
  alternative: «Увидев» без выраженного объекта.
  rationale: Греческий текст не называет объект прямо, однако русское «увидев это» естественно связывает реакцию учеников с предшествующим событием, не добавляя нового содержания.
- issue: Сила предложения учеников
  choice: «мы велим огню сойти»
  alternative: «мы призовём огонь с неба» или буквальное «мы скажем огню сойти»
  rationale: Форма εἴπωμεν буквально связана с речью, но инфинитивная конструкция имеет побудительный смысл. Перевод сохраняет вопрос о разрешении Иисуса и не вводит отдельного глагола «призывать», отсутствующего в источнике.
- issue: Значение ἀναλῶσαι
  choice: «поглотить их»
  alternative: «истребить их» или «уничтожить их»
  rationale: Выбор удерживает одновременно образ действия огня и смысл гибели, не устраняя присущую греческому глаголу смысловую широту; альтернативы указаны в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис прост и понятен; формы «Господи» и «сойти с неба» сохраняют достоинство речи без архаизации.
