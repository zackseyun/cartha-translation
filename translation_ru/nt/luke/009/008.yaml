  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: ru
  text: а другие — что явился Илия, а третьи — что воскрес один из древних пророков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: другие — ... а третьи —
  rationale: С учётом эллиптического продолжения перечня из предыдущего стиха по-русски естественно передать источники мнений личными конструкциями; «третьи» ясно обозначает следующую группу после уже упомянутой ранее.
- source_word: δὲ ... δὲ
  choice: а ... а
  rationale: Частицы связывают и разграничивают мнения в перечне, не выражая сильного противопоставления.
- source_word: Ἠλίας
  choice: Илия
  rationale: Традиционная и общеупотребительная русская форма имени ветхозаветного пророка.
- source_word: ἐφάνη
  choice: явился
  rationale: Передаёт значение «стал видимым, появился» и сохраняет отличие от последующего ἀνέστη.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: один из древних пророков
  rationale: В данном контексте естественная русская передача неопределённого τις и партитивного родительного τῶν ἀρχαίων; речь идёт о неуточнённом пророке прежних времён.
- source_word: ἀνέστη
  choice: воскрес
  rationale: В контексте возвращения древнего пророка глагол означает восстание из мёртвых; «воскрес» точно и естественно сохраняет этот смысл без добавления пассивной конструкции.
theological_decisions:
- issue: Характер утверждения о древнем пророке
  choice: «воскрес»
  alternative: «восстал» / «был воскрешён» / «вернулся»
  rationale: Форма ἀνέστη допускает буквальное «встал», но контекст указывает на воскресение умершего пророка. Активное «воскрес» не уточняет деятеля и не превращает форму оригинала в пассив.
translation_notes:
  register: Современный литературный русский язык; сохранена краткая перечислительная структура, зависимая от предыдущего стиха. Формулировка ясная, достойная и пригодная для публичного чтения.
