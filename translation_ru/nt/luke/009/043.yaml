  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: ru
  text: 'И все поражались величию Бога[a]. Но пока все дивились всему, что он делал, он сказал своим ученикам:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могуществу Бога». Греческое слово μεγαλειότης означает величие, грандиозность или величественность; в основном тексте выбрано естественное для русского языка слово «величие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: поражались
  rationale: Передаёт сильное и продолжавшееся изумление, выраженное имперфектом, и звучит естественно в современном русском языке.
- source_word: πάντες
  choice: все
  rationale: Сохраняет подчёркнутую всеобщность реакции.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: величию Бога
  rationale: «Величие» естественно передаёт μεγαλειότης как проявленное величие, грандиозность или величественность Бога; конструкция с дательным падежом соответствует объекту и причине изумления.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Когда же все дивились
  rationale: Генитив абсолютный передан временным придаточным; «дивились» отличает θαυμάζω от более сильного ἐκπλήσσομαι в первой части стиха.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: всему, что он делал
  rationale: Сохраняет всеохватность πᾶσιν и длительный, разворачивающийся характер действий, выраженный имперфектом ἐποίει.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: он сказал своим ученикам
  rationale: Естественная русская передача повествовательной формулы и притяжательного местоимения.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее в οἷς ἐποίει и εἶπεν
  choice: Местоимение «он» относится к Иисусу
  alternative: Увидеть в первой фразе прежде всего непосредственное действие Бога из-за слов «величие Бога»
  rationale: В ближайшем повествовательном контексте действует и затем говорит Иисус. При этом текст называет явленное в его действиях величие величием Бога, не устраняя различия между Богом и Иисусом и не разрешая богословское напряжение сверх сказанного.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство библейского повествования без архаизмов. Местоимения, относящиеся к Иисусу, даны со строчной буквы по общим современным нормам. Двоеточие сохранено, поскольку стих вводит последующую прямую речь.
