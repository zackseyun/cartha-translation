  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: ru
  text: Но они не понимали сказанного[a]. Сказанное было скрыто от них[b], чтобы они не постигли его, и они боялись спросить Его об этом сказанном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этого слова»; греческое ῥῆμα может означать слово, высказывание или сказанное.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте сказано: «было скрыто от них», но не уточняется, кто это скрыл.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: не понимали
  rationale: В данном контексте глагол обозначает неспособность понять сказанное Иисусом, а не просто отсутствие сведений.
- source_word: ῥῆμα
  choice: эти слова / сказанное
  rationale: Здесь слово указывает на конкретное высказывание Иисуса. Русское «эти слова» звучит естественно; «сказанное» во втором предложении позволяет ясно отнести пассивную конструкцию к тому же высказыванию.
- source_word: ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν
  choice: было скрыто от них
  rationale: Сохранена пассивная конструкция и выраженное перфектом состояние сокрытости; действующее лицо не добавлено.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: чтобы они не постигли его
  rationale: «Постигли» передаёт осознание или постижение и сохраняет различие с предшествующим ἠγνόουν — «не понимали».
- source_word: ἐφοβοῦντο ἐρωτῆσαι
  choice: боялись спросить
  rationale: Естественно передаёт продолжительное состояние страха и намерение обратиться за разъяснением.
theological_decisions:
- issue: Кто скрыл сказанное от учеников
  choice: Сохранить безличную пассивную формулировку «было скрыто от них»
  alternative: Прямо назвать Бога действующим лицом либо представить непонимание как чисто психологическое
  rationale: Греческий текст не называет того, кто скрыл сказанное; перевод не должен устранять эту намеренную неопределённость.
- issue: Оттенок ἵνα в выражении о непостижении
  choice: «чтобы они не постигли его»
  alternative: «так что они не могли его постичь»
  rationale: Формулировка с «чтобы» сохраняет целевой оттенок греческого ἵνα и связанную с ним богословскую напряжённость, не сводя оборот только к результату.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным библейским звучанием. Местоимение «Его» написано с прописной буквы как традиционное уважительное обозначение Иисуса; синтаксис сохраняет последовательность греческого текста без искусственной буквальности.
