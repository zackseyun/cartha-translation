base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: ru
  text: 'И ещё один сказал: «Я последую за тобой, Господи, но прежде позволь мне проститься с теми, кто у меня дома[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с теми, кто в мой дом»; речь идёт о людях, находящихся дома или принадлежащих к домашнему кругу говорящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: И ещё один
  rationale: Передаёт как связь с предыдущим повествованием, так и появление ещё одного, отличного от прежних, собеседника; формулировка естественна по-русски.
- source_word: Ἀκολουθήσω σοι
  choice: Я последую за тобой
  rationale: Будущее время передаёт заявленное намерение говорящего; «последую за тобой» сохраняет образ ученичества и звучит литературно.
- source_word: κύριε
  choice: Господи
  rationale: Русская звательная форма естественна в прямом обращении к Иисусу и сохраняет диапазон смысла от почтительного обращения до богословского исповедания.
- source_word: πρῶτον δὲ ἐπίτρεψόν μοι
  choice: но прежде позволь мне
  rationale: «Но» передаёт противопоставление δέ, «прежде» — приоритет πρῶτον, а «позволь мне» естественно выражает просьбу о разрешении.
- source_word: ἀποτάξασθαι
  choice: проститься
  rationale: В данном контексте средний залог обозначает прощание перед уходом; русский глагол краток, точен и естественен.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: с теми, кто у меня дома
  rationale: Формулировка передаёт людей, находящихся в доме говорящего или принадлежащих к его домашнему кругу, не сужая значение исключительно до семьи или домочадцев.
theological_decisions:
- issue: Передача κύριε в обращении к Иисусу
  choice: Господи
  alternative: господин / Учитель
  rationale: «Господи» сохраняет возможный богословский вес обращения, не устраняя присущую контексту неоднозначность степени признания Иисуса; «господин» чрезмерно ослабило бы её, а «Учитель» внесло бы отсутствующий в слове функциональный смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохранён близким к греческому, но выражение о людях дома передано естественной русской конструкцией. Местоимение «тобой» дано со строчной буквы как нейтральная современная орфографическая практика, не добавляющая конфессионального стилевого признака.
