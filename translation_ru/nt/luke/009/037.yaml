  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: ru
  text: На следующий день[a], когда они спустились с горы, Его встретила большая толпа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «На другой день».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: не выражено отдельными словами
  rationale: Оборот служит повествовательным переходом. В современном русском начало «На следующий день» естественно передаёт переход без тяжеловесного «И случилось» и без добавления отсутствующего в источнике наречия «теперь».
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: На следующий день
  rationale: Дательный времени обозначает, когда произошло событие; выбран естественный и точный русский эквивалент.
- source_word: κατελθόντων αὐτῶν
  choice: когда они спустились
  rationale: Генитив абсолютный задаёт фоновое обстоятельство; аористическое причастие представляет спуск как завершённый по отношению к встрече.
- source_word: ἀπὸ τοῦ ὄρους
  choice: с горы
  rationale: Обычный русский эквивалент, естественный в сочетании с глаголом «спустились».
- source_word: συνήντησεν αὐτῷ
  choice: Его встретила
  rationale: Прямо передаёт значение встречи; порядок слов позволяет сохранить «большую толпу» как подлежащее и звучит естественно по-русски.
- source_word: ὄχλος πολύς
  choice: большая толпа
  rationale: Передаёт многочисленность собравшихся современным нейтральным выражением.
