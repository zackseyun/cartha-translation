lexical_decisions:
- source_word: καὶ
  choice: Они
  rationale: Начальный союз καί не передан отдельным словом, поскольку в русском стих естественно продолжает предыдущее повествование без обязательного «и»; местоимение ясно обозначает действующих лиц.
- source_word: ἐποίησαν οὕτως
  choice: так и сделали
  rationale: Устойчивое современное русское выражение естественно передаёт исполнение указания, данного в предыдущем стихе; частица «и» подчёркивает, что приказ был выполнен, не добавляя нового содержания.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое повествовательное соединение двух действий.
- source_word: κατέκλιναν
  choice: усадили
  rationale: Каузативное значение глагола — расположить людей для трапезы, в античном контексте обычно полулёжа. «Усадили» ясно и естественно передаёт действие по-русски, не создавая неуместного впечатления, будто всех буквально уложили.
- source_word: ἅπαντας
  choice: всех
  rationale: Передаёт полноту охвата и служит прямым дополнением при «усадили».
