  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: ru
  text: И вот, два человека разговаривали с Ним — это были Моисей и Илия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет характерный для Луки указатель внезапного привлечения внимания и при этом звучит естественно в современном литературном русском языке.
- source_word: ἄνδρες δύο
  choice: два человека
  rationale: В контексте речь идёт о двух мужчинах, Моисее и Илии; русское «два человека» естественно обозначает явившихся лиц, не создавая ненужного акцента на поле.
- source_word: συνελάλουν
  choice: разговаривали
  rationale: Имперфект передаёт продолжавшийся разговор, а глагол с приставкой συν- указывает на взаимное общение.
- source_word: αὐτῷ
  choice: с Ним
  rationale: При συλλαλέω дательный обозначает собеседника; «с Ним» точно передаёт взаимный характер разговора. Прописная буква соответствует принятому русскому библейскому оформлению местоимений, относящихся к Иисусу.
- source_word: οἵτινες ἦσαν
  choice: это были
  rationale: Естественно и прямо вводит идентификацию двух лиц, не усиливая смысл относительного местоимения οἵτινες сверх контекста.
- source_word: Μωϋσῆς
  choice: Моисей
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: Ἠλίας
  choice: Илия
  rationale: Устоявшаяся русская библейская форма имени пророка.
theological_decisions:
- issue: Отождествление двух лиц при преображении
  choice: Текст прямо называет их Моисеем и Илиёй.
  alternative: Добавить объяснение их символического или эсхатологического значения.
  rationale: Исходный текст лишь идентифицирует этих двух лиц; перевод не вносит отсутствующего в стихе богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Частица «и вот» сохраняет повествовательную выразительность оригинала; тире делает идентификацию естественной и ясной.
