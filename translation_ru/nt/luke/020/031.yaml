lexical_decisions:
- source_word: ὁ τρίτος ἔλαβεν αὐτήν
  choice: Третий тоже взял её в жёны
  rationale: Сохраняется эллиптическое «третий» без добавления слова «брат», а идиома ἔλαβεν αὐτήν естественно передана в брачном смысле. Частица καί выражена словом «тоже».
- source_word: ὡσαύτως δὲ καὶ οἱ ἑπτὰ
  choice: так же поступили и все семеро
  rationale: Формулировка естественно передаёт продолжение той же последовательности и охватывает всех семерых; глагол «поступили» контекстуально восполняет греческий эллипсис.
- source_word: οὐ κατέλιπον τέκνα
  choice: не оставили детей
  rationale: «Оставили детей» передаёт значение потомства, остающегося после смерти, точнее, чем просто «не имели детей».
- source_word: ἀπέθανον
  choice: умерли
  rationale: Прямой и нейтральный эквивалент греческого глагола без эвфемизма.
