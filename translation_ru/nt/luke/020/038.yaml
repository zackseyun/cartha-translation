  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: ru
  text: Он — не Бог мёртвых, а живых, ведь для Него все живы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь перед Ним все живы»; возможно также: «ведь все живут для Него».'
    reason: Греческий дательный αὐτῷ допускает несколько близких способов понимания.
lexical_decisions:
- source_word: θεὸς
  choice: Бог
  rationale: Несмотря на отсутствие артикля, в иудейском монотеистическом контексте слово имеет определённое значение; по-русски естественно «Бог».
- source_word: δὲ
  choice: же
  rationale: Частица мягко связывает фразу с предшествующим рассуждением; «же» сохраняет переход, не усиливая противопоставление, уже выраженное конструкцией οὐκ ... ἀλλά.
- source_word: νεκρῶν
  choice: мёртвых
  rationale: Субстантивированное прилагательное в родительном падеже естественно передаётся как «Бог мёртвых».
- source_word: ζώντων
  choice: живых
  rationale: Субстантивированное причастие передано кратко и симметрично слову «мёртвых».
- source_word: πάντες
  choice: все
  rationale: Сохраняет лаконичность и не сужает явно не определённый в самой фразе охват слова.
- source_word: αὐτῷ
  choice: для Него
  rationale: Дательный падеж семантически сжат. «Для Него» естественно по-русски выражает существование живыми в отношении к Богу, не превращая фразу в утверждение о жизни ради служения Ему.
- source_word: ζῶσιν
  choice: живы
  rationale: Русская именная конструкция «все живы» здесь естественнее буквального «все живут» и хорошо передаёт настоящее состояние, выраженное ζῶσιν.
theological_decisions:
- issue: Значение αὐτῷ в πάντες γὰρ αὐτῷ ζῶσιν
  choice: потому что для Него все живы
  alternative: потому что все живут для Него; потому что перед Ним все живы
  rationale: «Для Него все живы» сохраняет реляционный и несколько сжатый характер греческого дательного, поддерживает довод Иисуса о воскресении и не навязывает значение цели («живут ради Него») или только судебно-пространственный оттенок («перед Ним»).
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены краткое противопоставление «мёртвых — живых» и богословская неоднозначность заключительной фразы.
