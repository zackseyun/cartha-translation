  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: ru
  text: 'Тогда хозяин виноградника сказал[a]: «Что мне делать? Пошлю моего возлюбленного сына. Может быть, они проявят к нему уважение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «господин виноградника».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может также означать «устыдятся перед ним» или «проявят к нему почтение».
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: хозяин виноградника
  rationale: В контексте притчи речь идёт о владельце и распорядителе виноградника. «Хозяин» естественно передаёт эту роль по-русски и не навязывает слову κύριος титульное богословское значение.
- source_word: Τί ποιήσω;
  choice: Что мне делать?
  rationale: Естественно передаёт совещательный вопрос, который персонаж задаёт самому себе.
- source_word: πέμψω
  choice: Пошлю
  rationale: Будущее время выражает принятое хозяином решение; краткая форма соответствует прямой речи.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: моего возлюбленного сына
  rationale: «Сын» точно передаёт υἱός, а «возлюбленный» сохраняет смысл ἀγαπητός и возможную перекличку с другими местами у Луки, не разъясняя её внутри текста.
- source_word: ἴσως
  choice: может быть
  rationale: Передаёт ожидание без уверенности и естественно звучит в современной русской речи.
- source_word: τοῦτον
  choice: к нему
  rationale: Русская предложная конструкция требуется выбранным выражением «отнестись с уважением»; контекст ясно указывает на сына. Порядок слов «к нему они» отчасти сохраняет эмфазу указательного местоимения.
- source_word: ἐντραπήσονται
  choice: отнесутся с уважением
  rationale: В данном контексте средне-пассивная форма означает проявить почтение или уважение к кому-либо. Выбор звучит ясно и естественно, а буквальный оттенок стыда перед человеком отмечен в сноске.
theological_decisions:
- issue: Передача κύριος в притче, где хозяин может прообразно указывать на Бога
  choice: хозяин виноградника
  alternative: господин виноградника
  rationale: На непосредственном повествовательном уровне это владелец виноградника. «Хозяин» сохраняет смысл притчи, позволяя читателю увидеть богословскую аналогию без искусственного введения титула.
- issue: Возможный христологический оттенок выражения «возлюбленный сын»
  choice: моего возлюбленного сына
  alternative: моего любимого сына
  rationale: «Возлюбленный» точно и достойно передаёт ἀγαπητός и сохраняет возможную связь с формулировками о Сыне в повествовании Луки, не превращая намёк в явное толкование.
- issue: Смысл ἐντραπήσονται как уважения, почтения или стыда перед человеком
  choice: отнесутся с уважением
  alternative: постыдятся перед ним
  rationale: Основной текст передаёт прагматический смысл реакции на сына, а сноска сохраняет образную и лексическую неоднозначность греческого глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Возлюбленный» сохраняет значимую межтекстовую перекличку, тогда как остальная фраза остаётся понятной обычному современному читателю.
