  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: ru
  text: И, внимательно наблюдая за Ним, они послали подосланных людей, которые выдавали себя за праведников, чтобы поймать Его на слове[a] и затем передать Его под власть и полномочия правителя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ухватиться за Его слово».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «передать Его правлению и власти правителя». Два близких слова, вероятно, подчёркивают официальную сферу власти и полномочия правителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: выждав удобный момент
  rationale: В данном враждебном контексте глагол передаёт не простое наблюдение, а настороженное выслеживание подходящего случая; деепричастная форма сохраняет предшествование основному действию.
- source_word: ἐγκαθέτους
  choice: подосланных людей
  rationale: Слово обозначает тайно внедрённых лиц, поставленных для ловушки. Такой перевод естественнее по-русски, чем «лазутчиков», и ясно передаёт их роль.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: которые притворялись праведными
  rationale: Формулировка сохраняет обманную самопрезентацию и нравственно-религиозный оттенок δίκαιος.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: чтобы поймать Его на слове
  rationale: Устойчивое русское выражение естественно передаёт образ захвата на основании сказанного, не устраняя намеренной ловушки.
- source_word: ὥστε
  choice: и затем
  rationale: Передаёт целевой результат задуманной речевой ловушки в естественной русской последовательности.
- source_word: παραδοῦναι
  choice: предать
  rationale: Традиционный и точный глагол для передачи человека в руки враждебной судебно-политической власти.
- source_word: τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ
  choice: власти и полномочиям
  rationale: 'Различает сопряжённые понятия: правящую власть и законное право действовать, сохраняя усиление исходной пары.'
- source_word: τοῦ ἡγεμόνος
  choice: правителя
  rationale: Доступное обозначение римского должностного лица; не уточняет официальный титул сверх того, что выражено греческим словом.
theological_decisions:
- issue: Передача δίκαιος при притворной нравственно-религиозной репутации
  choice: праведными
  alternative: честными; справедливыми
  rationale: «Праведными» сохраняет религиозно-нравственную насыщенность слова и не сводит смысл к честности или юридической справедливости.
- issue: Соотношение ἀρχή и ἐξουσία
  choice: власти и полномочиям
  alternative: начальству и власти; юрисдикции и власти
  rationale: Перевод сохраняет два взаимосвязанных, но не тождественных аспекта официального господства, не превращая их в одно понятие.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. «Подосланные люди» передаёт скрытую провокацию без разговорного «подставные». Прописное «Его» соответствует распространённой русской библейской типографической традиции.
