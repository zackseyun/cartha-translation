  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: ru
  text: Крещение Иоанна было с небес или от людей?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Бога»; буквально по-гречески: «с неба». Это благоговейный способ указать на божественное происхождение или полномочие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: крещение
  rationale: Существительное обозначает связанное с Иоанном крещение как обряд и практику; «крещение» — точный и общепонятный русский эквивалент.
- source_word: Ἰωάννου
  choice: Иоанна
  rationale: Родительный падеж естественно передаёт связь крещения с Иоанном.
- source_word: ἐξ οὐρανοῦ
  choice: с небес
  rationale: Сохраняет буквальный образ и благоговейное иудейское обозначение божественного происхождения или полномочия.
- source_word: ἐξ ἀνθρώπων
  choice: от людей
  rationale: Передаёт общий, не ограниченный мужчинами смысл ἀνθρώπων и ясно выражает противопоставление человеческого источника небесному.
- source_word: ἦν
  choice: было
  rationale: Сохраняет греческую связку и естественную русскую конструкцию с указанием источника.
- source_word: ἢ
  choice: или
  rationale: Точно передаёт разделительный союз между двумя альтернативами.
theological_decisions:
- issue: Значение выражения «с небес» применительно к крещению Иоанна
  choice: Сохранить в основном тексте выражение «с небес».
  alternative: «от Бога»
  rationale: Выражение указывает на божественное происхождение или полномочие, однако греческий текст буквально говорит «с неба/небес». Сохранение образа не устраняет заложенную в формулировке благоговейную косвенность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, естественная и достойная. «От людей» предпочтено устаревающему и потенциально гендерно узкому «от человеков».
