  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: ru
  text: Итак, Давид называет его Господом; как же он его сын? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его потомок». В греческом тексте сказано буквально: «его сын»; слово «сын» здесь может иметь династический смысл и обозначать потомка царского рода.'
    reason: 'Лексическая альтернатива: сохраняет явное «сын» в основном тексте и поясняет возможный более широкий династический смысл.'
lexical_decisions:
- source_word: Δαυὶδ
  choice: Давид
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующей цитаты и естественно вводит риторический вопрос.
- source_word: αὐτὸν κύριον
  choice: называет его Господом
  rationale: Сохраняет прямой смысл конструкции и вес титула κύριος в мессианском рассуждении.
- source_word: καλεῖ
  choice: называет
  rationale: Прямо и естественно передаёт настоящее время греческого глагола.
- source_word: καὶ πῶς
  choice: как же
  rationale: Частица «же» естественно передаёт риторическое противопоставление, выраженное сочетанием καὶ πῶς.
- source_word: αὐτοῦ υἱός
  choice: его сыном
  rationale: Сохраняет явное слово υἱός и не снимает напряжения между титулом «Господь» и обозначением «сын».
- source_word: ἐστιν
  choice: может быть
  rationale: В русском риторическом вопросе оборот «как же он может быть» естественно выражает озадачивающую логическую связь, не отрицая самого родства.
theological_decisions:
- issue: Передача κύριος в мессианском аргументе
  choice: Господом
  alternative: господином
  rationale: «Господь» сохраняет традиционный титул и богословский вес цитаты, не добавляя сверх текста прямого определения природы Мессии.
- issue: Передача υἱός в династическом смысле
  choice: сыном
  alternative: потомком
  rationale: Греческий текст прямо говорит «сын»; это слово сохранено в основном тексте, а возможный более широкий родословный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная формулировка. Тире перед вопросом помогает передать переход от утверждения к риторическому выводу.
