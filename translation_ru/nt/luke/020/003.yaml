  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: ru
  text: 'Но Он сказал им в ответ: «И Я задам вам один вопрос, а вы ответьте Мне:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Но Он сказал им в ответ
  rationale: Естественно передаёт ответный характер причастия ἀποκριθείς, основное значение εἶπεν и лёгкое противопоставление δέ, не воспроизводя греческую конструкцию тяжеловесно.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ λόγον
  choice: И Я задам вам один вопрос
  rationale: κἀγώ подчёркивает встречный характер вопроса; λόγον в сочетании с ἐρωτάω идиоматически обозначает то, о чём спрашивают. «Один вопрос» естественно передаёт единственное число λόγον.
- source_word: καὶ εἴπατέ μοι
  choice: а вы ответьте Мне
  rationale: Императив εἴπατε буквально означает «скажите», но после упоминания вопроса по-русски естественнее «ответьте». Явное «вы» сохраняет настойчивость обращения к собеседникам; «а» ясно выражает соотношение двух действий.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь ясная, сдержанная и достойная. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской издательской традиции. Двоеточие сохранено, поскольку следующая реплика раскрывает содержание вопроса.
