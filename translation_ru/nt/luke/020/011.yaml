source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: ru
  text: Тогда он послал ещё одного раба. Но они и его избили, унизили и отослали ни с чем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθετο ... πέμψαι
  choice: тогда он послал ещё
  rationale: Греческая конструкция буквально выражает продолжение действия («продолжил, послав» / «снова послал»). В данном повествовательном контексте сочетание «тогда… ещё одного» естественно передаёт последовательность и повторность, не утяжеляя фразу.
- source_word: ἕτερον
  choice: ещё одного
  rationale: Передаёт появление следующего, отличного от первого, раба и естественно звучит по-русски.
- source_word: δοῦλον
  choice: раба
  rationale: В притче речь идёт о зависимом человеке, принадлежащем хозяину и исполняющем его поручение; «раб» сохраняет социально-правовой статус, выраженный словом δοῦλος.
- source_word: κἀκεῖνον
  choice: и его
  rationale: 'Сохраняет усиленную параллель с обращением с первым рабом: то же сделали и со следующим.'
- source_word: δείραντες
  choice: избили
  rationale: Точно и естественно передаёт физическое насилие, не конкретизируя его как бичевание.
- source_word: ἀτιμάσαντες
  choice: унизили
  rationale: Передаёт позорящее, бесчестящее обращение; в современном русском «унизили» здесь естественнее отвлечённого «обесчестили».
- source_word: ἐξαπέστειλαν κενόν
  choice: отослали ни с чем
  rationale: Идиоматически передаёт отправление обратно без ожидаемых плодов или иной передачи; объект не добавляется, поскольку в стихе он прямо не назван.
theological_decisions:
- issue: Передача δοῦλος в притче
  choice: раб
  alternative: слуга
  rationale: «Раб» сохраняет обозначенный греческим словом зависимый статус персонажа и отношения принадлежности хозяину, не добавляя богословских выводов.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный ритм и параллелизм сохранены. Формулировка «ни с чем» естественна для широкого круга читателей и не устраняет не названный прямо предмет ожидания.
