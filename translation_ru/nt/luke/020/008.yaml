base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: ru
  text: 'И Иисус сказал им: «И Я не скажу вам, какой властью Я это делаю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδὲ
  choice: И Я не скажу
  rationale: Частица связывает ответ Иисуса с отказом собеседников в предыдущем стихе. По-русски конструкция «И Я не скажу» естественно передаёт ответный отказ, не вводя отсутствующего в греческом тексте будущего времени как отдельного смыслового акцента.
- source_word: λέγω
  choice: скажу
  rationale: При адресате в дательном падеже и подразумеваемом содержании глагол означает сообщение ответа; русское «скажу вам» здесь естественнее буквального «говорю вам».
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: какой властью
  rationale: Творительный падеж естественно передаёт основание и полномочие, в силу которого совершаются действия. Формулировка сохраняет вопрос о правомерной власти, а не о физической силе.
- source_word: ἐξουσίᾳ
  choice: властью
  rationale: В контексте речь идёт о праве и полномочии действовать, поэтому «власть» точнее, чем «сила».
- source_word: ταῦτα
  choice: это
  rationale: Хотя греческое местоимение имеет форму множественного числа, в современном русском «это делаю» естественно охватывает совокупность обсуждаемых действий; «эти вещи» звучало бы неидиоматично.
- source_word: ποιῶ
  choice: делаю
  rationale: Настоящее время и общий характер действий естественно передаются русским несовершенным видом в настоящем времени.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: И Иисус сказал им
  rationale: Сохраняется простая повествовательная связь καί и прямо передаются глагол речи и адресат.
theological_decisions:
- issue: Отказ Иисуса ответить руководителям
  choice: Передать прямой отказ сообщить источник его власти без пояснения мотивов
  alternative: Представить ответ как уклонение либо прямо истолковать его как суд над неверием собеседников
  rationale: Сам стих сообщает лишь об отказе Иисуса назвать, какой властью он действует. Перевод не должен добавлять отсутствующую здесь нравственную или богословскую оценку.
translation_notes:
  register: 'Современный литературный русский язык; краткая, достойная и естественная реплика. Местоимение «Я» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией. Сноска не требуется: вариант «какой властью» достаточно полно передаёт греческую конструкцию.'
