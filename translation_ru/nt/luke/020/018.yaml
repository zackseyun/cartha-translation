source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: ru
  text: Всякий, кто упадёт на тот камень, разобьётся вдребезги[a], а на кого он упадёт, того раздавит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет разбит на части».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сотрёт в порошок» или «развеет, как мякину»; греческий глагол передаёт более сильное действие, чем простой удар.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Всякий, кто упадёт
  rationale: Субстантивированное причастие имеет обобщающее значение. «Всякий, кто» естественно по-русски передаёт универсальный охват и сохраняет конструкцию в единственном числе.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: на тот камень
  rationale: ἐπί с винительным после πίπτω обозначает движение на камень; указательное ἐκεῖνον передано словом «тот».
- source_word: συνθλασθήσεται
  choice: разобьётся вдребезги
  rationale: Глагол обозначает разрушение, разбивание на части. Русское «разобьётся вдребезги» ясно передаёт тяжёлый результат и звучит естественнее буквальной пассивной конструкции.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: а на кого он упадёт
  rationale: Относительная конструкция с ἄν и сослагательным наклонением выражает неопределённое условие — «на кого бы ни упал». Местоимение «он» относится к камню и сохраняет параллелизм двух частей.
- source_word: λικμήσει
  choice: раздавит
  rationale: 'В данном образе суда λικμάω выражает более сильное действие, чем простой удар: раздробление вплоть до превращения в пыль или развеивания. «Раздавит» понятно в основном тексте, а более точные образные оттенки отмечены в сноске.'
- source_word: αὐτόν
  choice: того
  rationale: Местоимение мужского рода единственного числа относится к обобщённо названному человеку. Коррелятивная русская конструкция «на кого… того» точно и естественно сохраняет эту связь.
theological_decisions:
- issue: Образ камня как орудия суда
  choice: Сохранить образ решительного разрушительного суда, не смягчая глаголы.
  alternative: Передать лишь преткновение, падение или лёгкое увечье.
  rationale: В контексте камень из предшествующей цитаты становится образом суда. Оба греческих глагола обозначают тяжёлое разрушение, поэтому метафору нельзя ослаблять, но и не следует истолковывать за пределами самого стиха.
- issue: Обобщающее обозначение человека в единственном числе
  choice: Передать конструкцией «всякий, кто… на кого… того».
  alternative: Перестроить обе части во множественном числе или употребить нейтральное описательное обозначение.
  rationale: Так сохраняются обобщающий смысл, грамматическое единственное число и тесный параллелизм оригинала без ненужного акцента на поле человека.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, выразительная и доступная. «Всякий» придаёт изречению достойный библейский тон, не делая его архаичным. Корреляция «на кого… того» обеспечивает естественный русский синтаксис.
