lexical_decisions:
- source_word: ἕως ἂν
  choice: пока не
  rationale: Сочетание указывает на будущий предел действия; русское «пока не» естественно передаёт этот смысл.
- source_word: θῶ
  choice: Я не положу
  rationale: Форма τίθημι буквально означает «положу, помещу»; здесь «положу ... подножием» сохраняет образ и звучит как торжественная библейская цитата.
- source_word: τοὺς ἐχθρούς σου
  choice: врагов Твоих
  rationale: Прямо передаёт винительный падеж и притяжательное местоимение без смягчения враждебности.
- source_word: ὑποπόδιον
  choice: подножием
  rationale: 'Творительный предикативный естественно передаёт результативный смысл: враги становятся подножием.'
- source_word: τῶν ποδῶν σου
  choice: для ног Твоих
  rationale: Так сохраняется буквальный образ «подножия ног» и одновременно достигается естественное русское выражение.
theological_decisions:
- issue: Образ покорения в цитате из Псалма 109:1 по нумерации Септуагинты
  choice: Сохранить метафору «положу врагов Твоих подножием для ног Твоих».
  alternative: «положу врагов Твоих под ноги Твои»
  rationale: Метафора подножия сохраняет царско-мессианский образ исходного текста и не заменяет его разъясняющей формулировкой о полном покорении.
translation_notes:
  register: Современный литературный русский с торжественным оттенком, уместным для прямой цитаты из Писания. Заглавные буквы в местоимениях сохраняют традиционное почтительное оформление обращения к Мессии; синтаксис остаётся понятным современному читателю.
