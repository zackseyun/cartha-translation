id: LUK.20.1
reference: Luke 20:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: ru
  text: И вот, в один из тех дней, когда Он учил народ в храме[a] и возвещал благую весть[b], к Нему подошли первосвященники и книжники вместе со старейшинами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
  - marker: b
    text: 'Или: «проповедовал Евангелие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: И вот
  rationale: Передаёт характерный для Луки повествовательный переход естественно для современного русского языка, без архаичного «и случилось».
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: в один из тех дней
  rationale: Сохраняет неопределённость и значение одного дня в рамках уже описываемого периода.
- source_word: διδάσκοντος αὐτοῦ
  choice: когда Он учил
  rationale: Передаёт обстоятельственное значение одновременности греческой абсолютной генитивной конструкции.
- source_word: τὸν λαὸν
  choice: народ
  rationale: λαός обозначает здесь народ в целом, а не только собравшуюся толпу.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Естественное русское обозначение храмового комплекса; необходимое историческое уточнение вынесено в сноску.
- source_word: εὐαγγελιζομένου
  choice: возвещал Благую весть
  rationale: Сохраняет значение провозглашения доброй вести и избегает излишне специального церковного оттенка.
- source_word: ἐπέστησαν
  choice: подошли к Нему
  rationale: Передаёт непосредственное приближение руководителей, не добавляя явно не выраженной в глаголе враждебности.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего священнического руководства во множественном числе.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Сохраняет историческое наименование данной группы знатоков и толкователей Закона.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: вместе со старейшинами
  rationale: Явно передаёт выраженное предлогом σύν совместное действие трёх групп руководителей.
theological_decisions:
- issue: Передача εὐαγγελιζομένου в повествовании о служении Иисуса
  choice: возвещал Благую весть
  alternative: проповедовал Евангелие
  rationale: Выбранный вариант передаёт смысл греческого глагола доступно и не превращает его без необходимости в более поздний церковный термин.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «И вот» сохраняет повествовательную связь, не звуча архаично; порядок слов остаётся ясным и естественным.
