source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: ru
  text: 'И они спросили Его: «Учитель, мы знаем, что Ты верно говоришь и учишь, не проявляешь пристрастия[a], а по истине[b] учишь Божьему пути».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не принимаешь лица» — идиома со значением «не оказываешь предпочтения» или «не судишь по положению и внешности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «истинно учишь Божьему пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: спросили
  rationale: Глагол означает «спросили» или «задали вопрос». Контекст раскрывает скрытое намерение испытать Иисуса, поэтому нет необходимости усиливать перевод словом «допрашивали».
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Естественная современная передача обращения к тому, кто наставляет; слово «Господин» или «Наставник» было бы менее точным.
- source_word: ὀρθῶς λέγεις καὶ διδάσκεις
  choice: верно говоришь и учишь
  rationale: «Верно» передаёт правильность сказанного, а сохранение обоих глаголов отражает структуру и риторическую полноту греческого текста.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: не проявляешь пристрастия
  rationale: Буквальное выражение «не принимаешь лица» является идиомой, означающей, что человек не оказывает предпочтения на основании положения или внешних признаков. Смысловой перевод понятен современному читателю.
- source_word: ἐπ’ ἀληθείας
  choice: по истине
  rationale: Выражение указывает, что учение соответствует истине. Такая передача сохраняет смысловую связь с истиной, а не только субъективной искренностью.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: пути Божьему
  rationale: Сохраняется образ пути как Божьей воли и образа жизни, которому учит Иисус; дательный падеж естественен при русском глаголе «учить».
theological_decisions:
- issue: Идиома о беспристрастии
  choice: не проявляешь пристрастия
  alternative: не смотришь на лица
  rationale: 'Смысл идиомы передан без неясного буквализма и без добавления конфессионального толкования: Иисус не руководствуется статусом или внешностью людей.'
- issue: Связь ἐπ’ ἀληθείας с глаголом «учишь»
  choice: по истине учишь
  alternative: истинно учишь; правдиво учишь
  rationale: Сохранено возможное указание как на истинность содержания учения, так и на соответствующий истине способ учить; перевод не сужает выражение до одной лишь искренности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Иисусу в прямом обращении, написаны с прописной буквы по принятой русской издательской практике. Формулировка сохраняет льстивый тон речи, не добавляя оценки говорящих в сам стих.
