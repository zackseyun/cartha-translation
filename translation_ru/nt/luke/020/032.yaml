  text: ὕστερον ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/032.yaml
  text: Later[a], the woman also died.
translation:
  language: ru
  text: Потом умерла и женщина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Впоследствии умерла и женщина».'
    reason: Лексический вариант для ὕστερον.
lexical_decisions:
- source_word: ὕστερον
  choice: Потом
  rationale: Наречие обозначает последующее событие в повествовательной последовательности; «потом» естественно и не уточняет время сверх сказанного в греческом тексте.
- source_word: καὶ
  choice: и
  rationale: 'В позиции перед подлежащим частица имеет присоединительно-усилительный смысл: женщина, как и братья, умерла. Русская конструкция «умерла и женщина» естественно передаёт значение «также».'
- source_word: ἡ γυνή
  choice: женщина
  rationale: В данном рассказе речь идёт о женщине, последовательно бывшей женой нескольких братьев; «женщина» ясно указывает на неё и не создаёт впечатления, будто подразумевается только один из браков.
- source_word: ἀπέθανεν
  choice: умерла
  rationale: Прямая передача аориста ἀποθνῄσκω без эвфемистического смягчения.
theological_decisions: []
