  text: κατανοήσας δὲ αὐτῶν τὴν πανουργίαν εἶπεν πρὸς ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: ru
  text: 'Но Он, распознав их коварство[a], сказал им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хитрость», «лукавство» или «обманный замысел». Греческое слово означает изощрённую, нечестную уловку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: распознав
  rationale: 'Причастие аориста передаёт предшествующее речи осознание: Иисус понял скрытый замысел собеседников. «Распознав» естественно сочетает замеченное с проницательным пониманием, не усиливая смысл до прямого утверждения о сверхъестественном знании.'
- source_word: δὲ
  choice: Но
  rationale: 'Частица обозначает мягкое противопоставление: замыслу собеседников противопоставлен ответ Иисуса.'
- source_word: αὐτῶν
  choice: их
  rationale: Родительный падеж местоимения естественно передаётся русским притяжательным определением.
- source_word: πανουργίαν
  choice: коварство
  rationale: Слово обозначает недобросовестную изобретательность, хитрый злонамеренный расчёт. «Коварство» сохраняет как нравственно отрицательную оценку, так и идею скрытого умысла.
- source_word: εἶπεν
  choice: сказал
  rationale: Обычная и естественная передача повествовательного аориста от λέγω.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: При глаголе речи πρός с винительным указывает на адресатов; по-русски краткое «сказал им» звучит естественно.
