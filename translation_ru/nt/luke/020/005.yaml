  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: ru
  text: 'Они же стали рассуждать между собой: «Если скажем: „С неба“, то Он скажет: „Почему вы ему не поверили?“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: стали рассуждать между собой
  rationale: Передаёт совместное обдумывание и обсуждение ответа внутри группы; «рассуждать между собой» естественно по-русски и сохраняет расчётливый характер их deliberation.
- source_word: λέγοντες
  choice: передано двоеточием перед прямой речью
  rationale: В русском повествовании содержание одновременного обсуждения естественнее вводится двоеточием; отдельное «говоря» было бы тяжеловесным.
- source_word: Ἐὰν εἴπωμεν
  choice: Если скажем
  rationale: Естественно передаёт условную конструкцию и сохраняет её открытый, предполагаемый характер.
- source_word: Ἐξ οὐρανοῦ
  choice: С небес
  rationale: Сохраняет греческую метонимию божественного происхождения и полномочия, не заменяя её толкованием «от Бога».
- source_word: ἐρεῖ
  choice: спросит
  rationale: Хотя буквально глагол означает «скажет», последующая прямая речь является вопросом; «спросит» по-русски естественно передаёт речевой акт без изменения его содержания.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: вы ему не поверили
  rationale: Конструкция с дательным обозначает доверие словам человека; «поверили ему» точнее контекста, чем конфессионально более нагруженное «уверовали в него».
theological_decisions:
- issue: Источник крещения Иоанна в выражении Ἐξ οὐρανοῦ
  choice: С небес
  alternative: От Бога
  rationale: Текст сохраняет почтительное косвенное обозначение Бога через «небеса». Перевод не раскрывает метонимию и тем самым не устраняет исходную формулировку.
- issue: Характер реакции на Иоанна в ἐπιστεύσατε αὐτῷ
  choice: поверили ему
  alternative: доверились ему / уверовали в него
  rationale: Речь прежде всего о признании истинности свидетельства и власти Иоанна; личностно-сотериологический оттенок «уверовали в него» синтаксисом не требуется.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Частица «же» сохраняет повествовательное противопоставление δέ. Заглавное «Он» употреблено как традиционное русское местоименное обозначение Иисуса в библейском тексте.
