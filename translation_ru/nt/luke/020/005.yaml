  terminology: «С неба» сохраняет библейскую метонимию божественного происхождения, не подменяя её толковательным «от Бога». «Не поверили ему» точно передаёт πιστεύω с дательным и не привносит значение «уверовали в него». Заглавное «Он» допустимо как редакционная библейская конвенция.
