  source_fidelity: 'В целом смысл передан точно: речь идёт о внутреннем обсуждении ответа, о происхождении «с неба» и о вере Иоанну. Однако ἐρεῖ означает «скажет», а не специально «спросит»; вопросительная форма последующей реплики не требует замены глагола. Частица «же» в «Почему же» не имеет прямой опоры в Διὰ τί. «С неба» точнее передаёт единственное число οὐρανοῦ, чем «С небес».'
