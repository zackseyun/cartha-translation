source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: ru
  text: 'Книжники и первосвященники старались в этот же час схватить Его[a], но побоялись народа, потому что поняли: эту притчу Он рассказал против них[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наложить на Него руки»; то есть схватить или арестовать Его.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к ним»; по контексту притча была направлена против них.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: хотели
  rationale: В сочетании с инфинитивом и последующим указанием на страх перед народом глагол передаёт намерение, не осуществлённое из-за препятствия. «Хотели» естественно выражает это по-русски, не утверждая, что попытка захвата началась.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и точный термин для знатоков и толкователей Закона в евангельском историческом контексте.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего священнического руководства; множественное число не означает одновременного служения нескольких действующих первосвященников.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: схватить Его
  rationale: Греческая идиома буквально означает «наложить на Него руки», но в данном враждебном контексте обозначает захват. «Схватить» звучит естественно и не сужает значение до формально-юридического ареста.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: в тот же час
  rationale: Сохраняет временной образ и подчёркнутую непосредственность реакции; более буквально, чем «тотчас», и естественно в повествовании.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: побоялись народа
  rationale: λαός обозначает народ, население, а не только находившуюся рядом толпу. Совершенный вид уместно передаёт страх как причину отказа от намерения.
- source_word: ἔγνωσαν
  choice: поняли
  rationale: В контексте обозначает распознание того, против кого направлена притча. «Поняли» естественнее русского «узнали» и точнее по смыслу, чем статичное «знали».
- source_word: πρὸς αὐτοὺς
  choice: против них
  rationale: 'Контекст реакции руководителей придаёт выражению направленно-враждебный смысл: они увидели осуждение самих себя. Возможная более буквальная передача отмечена в сноске.'
- source_word: παραβολὴν
  choice: притчу
  rationale: Устоявшийся и точный русский эквивалент παραβολή в синоптических Евангелиях.
theological_decisions:
- issue: Смысл πρὸς αὐτοὺς применительно к притче Иисуса
  choice: '«против них»: притча воспринимается как обличение религиозных руководителей'
  alternative: '«к ним» или «о них»: притча могла быть просто обращена к ним либо описывать их'
  rationale: Непосредственная попытка схватить Иисуса показывает, что руководители распознали в притче направленное против них осуждение. При этом формальная многозначность предлога сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной евангельской терминологией («книжники», «первосвященники», «притча»). Синтаксис сделан ясным и плавным; местоимение «Он» введено во второй части последнего предложения для естественного русского порядка слов. Все смысловые альтернативы, существенные для исходного текста, вынесены в маркированные сноски.
