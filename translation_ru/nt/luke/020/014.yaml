  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: ru
  text: 'Но виноградари[a], увидев его, рассуждали между собой: «Это наследник. Убьём его, чтобы наследство стало нашим».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арендаторы»; или: «земледельцы». Греческое слово обозначает работников, возделывающих землю; в этой притче они трудятся в винограднике.'
    reason: 'Лексические варианты: «арендаторы» передаёт роль персонажей в притче, а «земледельцы» — более общее значение греческого слова.'
lexical_decisions:
- source_word: γεωργοὶ
  choice: виноградари
  rationale: Существительное обозначает людей, возделывающих землю; поскольку в контексте притчи они обрабатывают виноградник, «виноградари» естественно передаёт конкретную сельскохозяйственную деятельность, не добавляя юридический оттенок аренды.
- source_word: διελογίζοντο
  choice: стали рассуждать
  rationale: Имперфект передаёт начавшееся и разворачивающееся совместное обдумывание; «рассуждать» сохраняет расчётливый, совещательный характер речи, не подразумевая спора.
- source_word: πρὸς ἀλλήλους
  choice: между собой
  rationale: Естественно передаёт взаимность обсуждения внутри группы.
- source_word: κληρονόμος
  choice: наследник
  rationale: Обычный и точный русский эквивалент, сохраняющий юридический и повествовательный смысл.
- source_word: ἀποκτείνωμεν
  choice: убьём его
  rationale: Аористный сослагательный в первом лице множественного числа имеет побудительное значение. Русская форма «убьём» кратко и естественно выражает совместное побуждение, не добавляя отдельной лексической оценки «совершим убийство».
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: чтобы наследство стало нашим
  rationale: Сохраняет целевое значение ἵνα и значение перехода в новое состояние у γένηται — «стало нашим».
- source_word: δὲ
  choice: но
  rationale: Передаёт лёгкий контраст и поворот повествования после появления сына.
- source_word: ἰδόντες
  choice: увидев его
  rationale: Деепричастный оборот естественно передаёт предшествующее обстоятельство, выраженное аористным причастием.
theological_decisions:
- issue: Обозначение γεωργοὶ в притче о винограднике
  choice: виноградари
  alternative: арендаторы; земледельцы
  rationale: Выбор исходит из лексического значения и непосредственного контекста виноградника. Хотя из всей притчи видно, что эти люди пользовались виноградником на условиях аренды, само существительное в данном стихе прямо не выражает их юридический статус.
translation_notes:
  register: Современный литературный русский язык; краткая прямая речь сохраняет напряжённость сцены. «Убьём его» звучит решительно, но не привносит дополнительной морально-юридической квалификации. Причастное λέγοντες естественно передано двоеточием перед прямой речью.
