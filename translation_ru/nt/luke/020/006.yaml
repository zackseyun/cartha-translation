  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: ru
  text: 'А если скажем: «От людей», — весь народ побьёт нас камнями, потому что убеждён, что Иоанн — пророк.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Иоанн был пророком». Греческий инфинитив сам по себе не уточняет временную отнесённость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: А если скажем
  rationale: Условная конструкция с ἐὰν и сослагательным наклонением передана естественным русским условным оборотом; δέ здесь продолжает рассуждение с оттенком противопоставления.
- source_word: Ἐξ ἀνθρώπων
  choice: От людей
  rationale: Краткая эллиптическая формулировка сохраняет параллель с вопросом об источнике крещения Иоанна и не добавляет отсутствующее в греческом тексте слово «власть» или «происхождение».
- source_word: ὁ λαὸς ἅπας
  choice: весь народ
  rationale: Передаёт собирательное значение λαός и усилительную полноту ἅπας естественным русским выражением.
- source_word: καταλιθάσει ἡμᾶς
  choice: побьёт нас камнями
  rationale: Устойчивое русское выражение точно передаёт побиение камнями, не уточняя сверх исходного текста смертельный исход.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: потому что убеждён
  rationale: 'Мужской род единственного числа согласован с собирательным существительным «народ» и сохраняет результативное значение перфекта: народ твёрдо убеждён.'
- source_word: Ἰωάννην προφήτην εἶναι
  choice: что Иоанн — пророк
  rationale: Именная конструкция с нулевой связкой естественна по-русски и не навязывает прошедшего времени там, где греческий инфинитив εἶναι сам по себе временной отнесённости не уточняет.
theological_decisions:
- issue: Временная отнесённость признания Иоанна пророком
  choice: что Иоанн — пророк
  alternative: что Иоанн был пророком
  rationale: Русская именная конструкция без выраженной связки сохраняет неопределённость греческого инфинитива εἶναι и одновременно естественно передаёт актуальную убеждённость народа, не разрешая вопрос о временном оттенке.
translation_notes:
  register: Современный литературный русский язык; речь краткая и напряжённая, как во внутреннем совещании противников Иисуса. Сохранены эллипсис «От людей» и собирательное «весь народ».
