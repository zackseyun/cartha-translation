  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: ru
  text: 'Иисус сказал им: «Люди этого века[a] женятся и выходят замуж».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны этого века» — обобщённое выражение о тех, кто принадлежит нынешнему веку.'
    reason: Пояснение буквальной мужской формы греческого выражения и его обобщённого значения.
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Простой повествовательный союз сохраняет связь с предшествующим контекстом, не добавляя временного оттенка.
- source_word: εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Иисус сказал им
  rationale: Передаёт обычное значение аориста λέγω и естественный для русского языка порядок слов; контекст ответа не требует заменять «сказал» на «ответил».
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: Сыны этого века
  rationale: Сохраняет образное мужское выражение оригинала и эсхатологическое значение αἰών как нынешнего века, а не физического мира. Здесь «сыны» употреблено обобщённо — о людях, принадлежащих этому веку.
- source_word: γαμοῦσιν
  choice: женятся
  rationale: Естественный русский эквивалент активной формы в брачной паре выражений.
- source_word: γαμίσκονται
  choice: выходят замуж
  rationale: Естественно передаёт противопоставленную активной форме брачную формулу и отражает подразумеваемое распределение по полу без тяжеловесного буквального «выдаются замуж».
theological_decisions:
- issue: Родовое выражение в обобщённом высказывании
  choice: Сыны этого века
  alternative: Люди этого века; принадлежащие этому веку
  rationale: Греческое υἱοί имеет форму мужского рода, но в данном контексте обозначает представителей нынешнего века вообще. Основной текст сохраняет исходный образ, а примечание поясняет его обобщённый смысл.
- issue: αἰών как эсхатологическая категория
  choice: этого века
  alternative: этого мира
  rationale: «Век» сохраняет важное для ближайшего контекста противопоставление нынешнего века и будущего века; «мир» мог бы быть понят как сотворённый мир или пространство.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «сыны этого века». Парная формула «женятся и выходят замуж» звучит естественно и передаёт различие двух греческих глагольных форм.
