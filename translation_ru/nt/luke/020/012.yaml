  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: ru
  text: И он послал третьего[a]; но они и его ранили и выгнали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прибавил послать третьего»; это греческий оборот со значением «послал ещё и третьего» или «затем послал третьего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: послал
  rationale: Конструкция προστίθημι с инфинитивом означает продолжение или очередное совершение действия. По-русски естественно передать её простым «послал»; последовательность уже выражена словом «третьего».
- source_word: τρίτον πέμψαι
  choice: послал третьего
  rationale: В греческом существительное опущено и подразумевается из контекста предыдущих посланных слуг. Русская субстантивация «третьего» ясна и сохраняет краткость оригинала.
- source_word: οἱ δὲ
  choice: но они
  rationale: δέ обозначает здесь переход с оттенком противопоставления между поступком хозяина и ответом виноградарей; местоимение отсылает к виноградарям из контекста.
- source_word: καὶ τοῦτον
  choice: и его
  rationale: 'καί передаёт повторение: с третьим поступили так же. Русское «и его» естественно сохраняет этот присоединительный акцент.'
- source_word: τραυματίσαντες
  choice: ранили
  rationale: τραυματίζω означает причинить рану; «ранили» прямо и точно передаёт действие, не добавляя отсутствующего в тексте способа насилия.
- source_word: ἐξέβαλον
  choice: выбросили вон
  rationale: ἐκβάλλω выражает насильственное удаление наружу. «Выбросили вон» передаёт и направленность, и резкость действия в современном литературном русском.
theological_decisions: []
translation_notes:
