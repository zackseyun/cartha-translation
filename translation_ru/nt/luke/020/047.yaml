    rationale: В данном контексте προφάσει означает действие под видом чего-либо, с притворным предлогом или прикрытием. «Напоказ» акцентирует показность, но может не передать аспект ложного предлога. «Для вида» передаёт оба оттенка без излишней интерпретации.
  - severity: low
