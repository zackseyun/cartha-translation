lexical_decisions:
- source_word: κατεσθίουσιν
  choice: разоряют
  rationale: Буквально глагол означает «пожирают», но здесь метафорически обозначает хищническое присвоение имущества; «разоряют» естественно передаёт смысл эксплуатации, не подразумевая буквального поедания.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: дома вдов
  rationale: Сохранено конкретное «дома»; в контексте оно может метонимически охватывать имущество и хозяйство вдов.
- source_word: προφάσει
  choice: напоказ
  rationale: Передаёт притворный внешний характер долгих молитв; значение предлога или повода, используемого как прикрытие, отмечено в сноске.
- source_word: μακρὰ προσεύχονται
  choice: подолгу молятся
  rationale: Естественная современная русская передача наречного μακρά, обозначающего продолжительность молитв.
- source_word: λήμψονται περισσότερον κρίμα
  choice: получат более суровый приговор
  rationale: «Приговор» сохраняет судебный оттенок κρίμα, а сравнительная конструкция передаёт усиленную строгость неблагоприятного решения.
theological_decisions:
- issue: Характер κρίμα в контексте
  choice: более суровый приговор
  alternative: большее осуждение
  rationale: Контекст ясно указывает на неблагоприятный Божий суд, однако «приговор» сохраняет судебную широту κρίμα и не сужает слово до одного богословского термина.
- issue: Связь προφάσει с долгой молитвой
  choice: напоказ подолгу молятся
  alternative: под предлогом подолгу молятся
  rationale: Основной текст естественно выражает лицемерную демонстративность, а возможный оттенок молитвы как прикрытия сохранён в сноске.
translation_notes:
  register: Современный литературный русский, краткий и обличительный. «Разоряют» звучит естественнее буквального «пожирают», сохраняя образ хищнической эксплуатации; «подолгу молятся» понятно широкому читателю.
