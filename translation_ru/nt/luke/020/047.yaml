  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: ru
  text: которые разоряют дома вдов и для вида подолгу молятся. Они получат более суровый приговор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они подвергнутся большему осуждению».'
