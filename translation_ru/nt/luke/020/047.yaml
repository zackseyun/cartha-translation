  verdict: revise
  source_fidelity: «Разоряют дома вдов» удачно передаёт метафорическое κατεσθίουσιν без буквального образа поедания. «Подолгу молятся» точно отражает μακρά. Однако «напоказ» несколько сужает προφάσει до демонстративности; слово прежде всего обозначает притворный предлог или внешнее прикрытие. «Для вида» сохраняет и естественную русскую идиоматику, и эту смысловую широту. «Более суровый приговор» допустимо передаёт περισσότερον κρίμα как усиленное неблагоприятное судебное решение.
  naturalness: Текст в целом краток, литературен и естественен. Замена «напоказ» на «для вида» звучит не менее естественно, но лучше выражает, что длительная молитва служит притворным прикрытием, а не только публичной демонстрацией.
  terminology: «Дома вдов» сохраняет οἰκίας и допускает контекстуальный метонимический смысл имущества/хозяйства. «Приговор» сохраняет юридическую образность κρίμα; сноска «большему осуждению» уместно даёт более явно карательный вариант. Следует привести обоснование основного варианта προφάσει в соответствие с текстом.
  issues:
