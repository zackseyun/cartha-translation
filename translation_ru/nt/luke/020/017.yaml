  to: 'Но Он посмотрел на них и сказал: «Что же это за написанное: “Камень, который отвергли строители, стал главой угла”[a]?»'
  rationale: Исправлен риторический вопрос, чтобы не добавлять толкование «что значат» и слово «Писания». Смягчена избыточная интенсивность взгляда. В цитате сохранён буквальный, но понятный образ «главой угла»; сноска по-прежнему отмечает спорность точной архитектурной референции.
