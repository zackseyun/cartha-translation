review_pass:
  verdict: revise
  source_fidelity: Проект точно передаёт строительную цитату, «отвергли» и результативное «стал». Однако «Что же значат эти слова Писания» превращает вопрос о том, что именно написано (τί ... τὸ γεγραμμένον τοῦτο), в прямой вопрос о значении текста и добавляет «Писания», которого в греческом тексте нет. Это интерпретационно возможно в контексте, но не оптимально-эквивалентно.
  naturalness: «Но Он посмотрел на них» — естественный современный литературный русский и не приписывает взгляду большую интенсивность, чем необходимо. «Что же это за написанное?» несколько необычно, но это наиболее краткий естественный способ сохранить субстантивированное «написанное» и риторическую форму подлинника. «Стал главой угла» яснее сохраняет предикативный строительный образ, чем «стал во главе угла».
  terminology: «Строители», «отвергли» и «главой угла» удачны. Сноска надлежащим образом сохраняет неразрешённость архитектурного образа; варианты «краеугольный камень» и «замковый камень» не следует переносить в основной текст. Заглавное «Он» соответствует принятому в проекте уважительному библейскому регистру.
