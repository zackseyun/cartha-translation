  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: ru
  text: 'Но Он посмотрел на них и сказал: «Что же это за написанное: “Камень, который отвергли строители, стал главой угла”[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главой угла». Возможно также: «краеугольным камнем» или «замковым камнем».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: пристально посмотрел
  rationale: Передаёт направленный, намеренный взгляд, выраженный причастием ἐμβλέψας, не преувеличивая его интенсивность.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Что же значат эти слова Писания
  rationale: Естественно передаёт риторический вопрос по-русски. Субстантивированное γεγραμμένον указывает на написанный священный текст, а вопрос в контексте касается смысла цитаты.
- source_word: Λίθον
  choice: Камень
  rationale: В цитате речь идёт об определённом, узнаваемом камне; русский язык не требует артикля.
- source_word: ἀπεδοκίμασαν
  choice: отвергли
  rationale: Кратко и точно передаёт признание камня непригодным и его отбрасывание.
- source_word: οἱ οἰκοδομοῦντες
  choice: строители
  rationale: Естественный русский эквивалент субстантивированного причастия, сохраняющий строительный образ.
- source_word: οὗτος
  choice: стал
  rationale: 'Отдельное указательное местоимение в русском избыточно: подлежащее «камень» остаётся ясным, а его эмфатическое возобновление естественно передаётся самой конструкцией цитаты.'
- source_word: ἐγενήθη εἰς
  choice: стал
  rationale: Идиоматично выражает переход в новое положение или назначение.
- source_word: κεφαλὴν γωνίας
  choice: во главе угла
  rationale: Устойчивая, понятная русская библейская формула, близкая к буквальному образу «главы угла» и не фиксирующая окончательно конкретную архитектурную функцию камня.
theological_decisions:
- issue: Архитектурный образ в цитате из Псалма 117:22
  choice: во главе угла
  alternative: краеугольным камнем; замковым камнем
  rationale: Основной текст сохраняет образ κεφαλὴ γωνίας в естественной русской библейской формуле, а примечание отмечает спорность точной архитектурной функции и не навязывает одно толкование.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавное «Он» употреблено как традиционное уважительное указание на Иисуса. Формулировка вопроса сделана естественной для русского языка, а неоднозначный строительный образ сохранён в основном тексте и пояснён в сноске.
