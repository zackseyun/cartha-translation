lexical_decisions:
- source_word: Ἀκούοντος
  choice: когда… слушал
  rationale: Настоящее причастие в родительном самостоятельном обороте обозначает одновременное, продолжающееся действие, на фоне которого Иисус обращается к ученикам.
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкую повествовательную связь без усиления противопоставления.
- source_word: παντὸς τοῦ λαοῦ
  choice: весь народ
  rationale: Сочетание πᾶς с существительным в единственном числе представляет народ как целое; «весь народ» естественно и сохраняет коллективный смысл.
- source_word: εἶπεν
  choice: Он сказал
  rationale: Обычная повествовательная передача аориста λέγω; прописная буква в местоимении соответствует принятому благоговейному русскому библейскому регистру.
- source_word: τοῖς μαθηταῖς
  choice: ученикам
  rationale: Точно передаёт адресатов; притяжательное «Своим» не добавлено, поскольку его нет в греческом тексте.
theological_decisions:
- issue: Различение слушателей и непосредственных адресатов
  choice: Иисус говорит ученикам, в то время как весь народ слушает.
  alternative: Иисус обращается непосредственно ко всему народу или говорит ученикам отдельно от народа.
  rationale: Родительный самостоятельный оборот задаёт публичную обстановку, а дательный τοῖς μαθηταῖς обозначает непосредственных адресатов. Перевод сохраняет оба элемента.
translation_notes:
  register: Современный литературный русский язык с естественным библейским достоинством. Синтаксис близок к греческому, но не тяжеловесен; двоеточие вводит последующую прямую речь.
