source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: ru
  text: И, выбросив его из виноградника, они убили его. Что же сделает с ними хозяин виноградника[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «господин виноградника»; возможен также перевод «владелец виноградника». Греческое κύριος часто переводится как «Господь», когда служит титулом, но здесь внутри притчи оно обозначает человека, которому принадлежит виноградник.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: выбросив
  rationale: Аористное причастие обозначает действие, предшествующее убийству; «выбросив» естественно передаёт насильственное изгнание.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: из виноградника
  rationale: Сочетание обозначает движение изнутри наружу; по-русски это естественно передаётся конструкцией «выбросив … из виноградника».
- source_word: ἀπέκτειναν
  choice: они убили его
  rationale: Глагол прямо означает лишение жизни; «убили» не добавляет юридической или нравственной характеристики, отсутствующей в самом слове.
- source_word: τί οὖν
  choice: Что же
  rationale: Частица «же» естественно передаёт выводно-переходную силу οὖν в русском вопросе.
- source_word: ποιήσει … αὐτοῖς
  choice: сделает с ними
  rationale: В данном контексте речь о том, как хозяин поступит с виноградарями; русская конструкция «что сделает с ними» ясно и естественно передаёт ποιήσει αὐτοῖς.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: хозяин виноградника
  rationale: Внутри притчи κύριος обозначает владельца или распорядителя виноградника, а не непосредственно божественный титул; «хозяин» точно и естественно передаёт этот смысл.
theological_decisions:
- issue: Передача κύριος при небожественном персонаже притчи
  choice: хозяин
  alternative: господин; владелец
  rationale: Контекст указывает на хозяина виноградника внутри повествования. Такой перевод не превращает обычное обозначение собственника в прямой божественный титул, при этом богословское значение притчи остаётся открытым для понимания из контекста.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и энергичный, соответствующий резкости действий в греческом тексте. Сохранены последовательность событий и открытый риторический вопрос.
