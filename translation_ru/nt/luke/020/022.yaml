  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: ru
  text: Позволено ли нам платить подать кесарю[a] или нет?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «налог». Греческое слово означает налог или дань, выплачиваемые господствующей власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: Позволено ли
  rationale: Передаёт вопрос о допустимости, не уточняя, идёт ли речь о римском праве или о Божьем законе.
- source_word: ἡμᾶς
  choice: нам
  rationale: Естественно передаёт субъект инфинитивной конструкции; этническое уточнение в греческом отсутствует.
- source_word: Καίσαρι
  choice: кесарю
  rationale: Сохраняет исторически конкретный титул римского правителя, а не обобщает его как «император».
- source_word: φόρον
  choice: подать
  rationale: Обозначает налог, выплачиваемый господствующей власти, и сохраняет оттенок политического подчинения.
- source_word: δοῦναι
  choice: платить
  rationale: В сочетании с названием налога современное русское «платить» естественно передаёт смысл греческого «давать».
- source_word: ἢ οὔ
  choice: или нет
  rationale: Стандартное и естественное оформление альтернативного вопроса по-русски.
theological_decisions:
- issue: Какой закон определяет допустимость уплаты
  choice: 'Оставить основание допустимости неуточнённым: «Позволено ли...»'
  alternative: «Разрешает ли римский закон...» или «Позволяет ли Божий закон...»
  rationale: Греческий текст не называет норму, по которой следует судить; контекст намеренно сохраняет религиозно-политическую напряжённость вопроса.
translation_notes:
  register: Современный литературный русский язык с достоинством и исторической окраской. «Подать» понятно в контексте и передаёт не просто налог, а обязательный платёж римской власти; «кесарь» сохраняет традиционную историческую конкретность.
