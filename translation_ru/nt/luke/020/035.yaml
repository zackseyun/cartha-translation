  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: ru
  text: А те, кого признали достойными[a] достичь того века[b] и воскресения из мёртвых, не женятся и не выходят замуж.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кого сочли достойными». Греческая форма страдательная и указывает на тех, кого признали достойными.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будущего века». Буквально: «того века».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: признан достойным
  rationale: 'Пассивное причастие передаёт оценку: этих людей признают достойными, а не просто описывают как обладающих внутренним достоинством. Единственное число согласовано с собирательной конструкцией «те, кто».'
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: того века
  rationale: Сохраняет указательное «того» и эсхатологическое противопоставление эпох, не подменяя его более истолковывающим выражением «будущего века».
- source_word: τυχεῖν
  choice: достичь
  rationale: Инфинитив с родительным падежом означает получить, обрести или достичь; «достичь» естественно связывается и с тем веком, и с воскресением.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: воскресения из мёртвых
  rationale: Точно и привычно передаёт ἐκ νεκρῶν, сохраняя образ выхода из среды мёртвых.
- source_word: γαμοῦσιν
  choice: женятся
  rationale: В паре с пассивным γαμίζονται форма традиционно относится к вступлению мужчин в брак; русское «женятся» естественно сохраняет это различие.
- source_word: γαμίζονται
  choice: выходят замуж
  rationale: В данном брачном противопоставлении передаёт положение женщин, которых по древнему обычаю выдавали замуж, но без неестественного для современного русского буквального пассива.
theological_decisions:
- issue: Подразумевает ли καταξιωθέντες заслуживание жизни воскресения
  choice: «признан достойным» сохраняет пассивную оценку, не утверждая, что человек заслужил воскресение собственными делами
  alternative: «достоин» или «оказался достойным»
  rationale: Греческий пассив указывает на признание или суждение о достоинстве. Перевод сохраняет богословское напряжение, не уточняя прямо, кто признаёт достойным и на каком основании.
translation_notes:
  register: 'Современный литературный русский с достоинством и ясностью. Формула «те, кто признан достойным» естественнее множественного «признанные достойными» и точно сохраняет пассив. Брачная пара передана идиоматически: «не женятся и не выходят замуж».'
