  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: ru
  text: Ведь они уже не могут умереть, потому что подобны ангелам и являются сынами Бога[a], будучи сынами воскресения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «сыны Бога» и «сыны воскресения»; мужская форма здесь обозначает статус и принадлежность и не ограничивает смысл только мужчинами.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: уже не могут умереть
  rationale: Передаёт значение способности при δύνανται и прекращение смертности при ἔτι; речь не просто о невозможности умереть повторно.
- source_word: ἰσάγγελοι
  choice: подобны ангелам
  rationale: Естественно передаёт сходство или равенство с ангелами, не отождествляя воскресших с ангелами.
- source_word: υἱοί ... θεοῦ
  choice: сыны Бога
  rationale: Сохраняет явный образ сыновства и его повтор в греческом тексте; форма обозначает статус и принадлежность, а не исключительно мужчин.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: будучи сынами воскресения
  rationale: Сохраняет метафору, повтор слова υἱοί и не сводит причастный оборот исключительно к причинному значению.
- source_word: γάρ ... γάρ
  choice: ведь ... потому что
  rationale: Первое γάρ связывает стих с предыдущим высказыванием, второе вводит объяснение; такая передача естественна по-русски.
theological_decisions:
- issue: Передача языка сыновства в эсхатологическом контексте
  choice: Сохранить «сыны Бога» и «сыны воскресения» в основном тексте
  alternative: «дети Бога» и «дети воскресения»
  rationale: Греческий текст дважды употребляет υἱοί, создавая смысловой и риторический параллелизм. Здесь сыновство выражает статус и принадлежность воскресших, а не ограничение по полу; это уточнено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Сыны» выбрано вместо более разговорного и гендерно нейтрального «дети», чтобы сохранить повторяющийся исходный образ; архаизация остального синтаксиса избегается.
