  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: ru
  text: Когда настало время, он послал к виноградарям раба[a], чтобы они отдали ему часть урожая виноградника. Но виноградари избили его и отослали ни с чем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу». Греческое слово может употребляться в обоих значениях, но здесь «раб» точнее передаёт зависимый статус.'
    reason: alternative_reading
lexical_decisions:
- source_word: καιρῷ
  choice: когда настало время
  rationale: Передаёт дательный времени и смысл подходящего, установленного срока, не уточняя сверх текста, что речь именно о времени сбора урожая.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Естественный русский эквивалент простого аориста ἀποστέλλω.
- source_word: γεωργούς
  choice: виноградарям
  rationale: Контекст виноградника позволяет естественно передать сельскохозяйственную специализацию, не добавляя прямо не выраженного словом юридического статуса арендаторов.
- source_word: δοῦλον
  choice: раба
  rationale: Сохраняет обозначенный греческим словом зависимый статус; «слуга» было бы возможным, но более мягким вариантом.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: чтобы они отдали ему
  rationale: Естественно передаёт цель посылки; «отдали» уместно обозначает передачу владельцу причитающейся части, не определяя её размер.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: часть урожая виноградника
  rationale: Передаёт партитивное значение ἀπό; «урожай» звучит по-русски естественнее буквального «плод» в данном хозяйственном контексте.
- source_word: ἐξαπέστειλαν
  choice: отослали
  rationale: Сохраняет усиленное значение отправления прочь, присущее составному глаголу.
- source_word: δείραντες
  choice: избили
  rationale: Точно и естественно передаёт нанесение побоев без чрезмерно конкретного «высекли».
- source_word: κενόν
  choice: ни с чем
  rationale: Идиоматически выражает контекстуальный смысл «пустым», то есть без какой-либо доли урожая.
