lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Покажите Мне
  rationale: Прямое повеление передано естественным современным русским выражением; местоимение сохранено, а прописная буква соответствует принятому благоговейному оформлению речи Иисуса.
- source_word: δηνάριον
  choice: динарий
  rationale: Историческое название римской монеты сохраняет конкретику исходного текста и привычно для русской библейской лексики.
- source_word: τίνος ἔχει
  choice: Чьё на нём
  rationale: Так естественно по-русски выражается вопрос о том, кому принадлежат или кого обозначают изображение и надпись на монете.
- source_word: εἰκόνα
  choice: изображение
  rationale: Нейтрально и точно передаёт образ или портрет, отчеканенный на монете, не сужая значение до одного лишь портрета.
- source_word: ἐπιγραφήν
  choice: надпись
  rationale: Обычное и точное русское обозначение текста, нанесённого на монету.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Они ответили
  rationale: Причастно-глагольная конструкция передана естественным русским повествовательным оборотом без избыточного буквального «ответив, сказали».
- source_word: Καίσαρος
  choice: Кесаря
  rationale: Краткий родительный ответ сохраняет эллиптичность греческого текста и естественно отвечает на вопрос «Чьё?».
