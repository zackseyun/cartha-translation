  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: ru
  text: Берегитесь книжников[a], которые хотят ходить в длинных одеждах[b] и любят приветствия на площадях, лучшие места в синагогах[c] и почётные места на пирах[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Остерегайтесь книжников».'
    reason: lexical_alternative
  - marker: b
    text: Длинные одежды были заметными одеяниями, подчёркивавшими общественное положение.
    reason: cultural_note
  - marker: c
    text: 'Или: «главные места в синагогах».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «лучшие места» или «главные места на пирах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Берегитесь
  rationale: Сочетание повелительного προσέχετε с ἀπό выражает предостережение. «Берегитесь» естественно и кратко передаёт призыв быть настороже по отношению к названной группе.
- source_word: γραμματέων
  choice: книжников
  rationale: «Книжники» — устоявшееся и достаточно точное обозначение знатоков и толкователей Писания в евангельском контексте; вариант «учителя закона» был бы более истолковывающим.
- source_word: τῶν θελόντων περιπατεῖν
  choice: которые хотят ходить
  rationale: Передаёт волевое значение θελόντων и публичный, демонстративный оттенок περιπατεῖν без его избыточного разъяснения в основном тексте.
- source_word: ἐν στολαῖς
  choice: в длинных одеждах
  rationale: στολή обозначает длинное, заметное одеяние, способное указывать на положение человека. «Длинные одежды» понятно современному читателю и не перегружено реконструкцией конкретного фасона.
- source_word: φιλούντων ἀσπασμοὺς
  choice: любят почтительные приветствия
  rationale: φιλούντων передаёт сильное расположение, а приветствия в данном общественном контексте связаны с признанием статуса. «Почтительные» делает этот прагматический оттенок понятным, не превращая выражение в простое «здороваться».
- source_word: ἐν ταῖς ἀγοραῖς
  choice: на площадях
  rationale: ἀγοραί были общественными рыночными площадями. В контексте публичных приветствий русское «на площадях» естественно передаёт место общественной жизни.
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: лучшие места в синагогах
  rationale: πρωτοκαθεδρίαι — наиболее почётные или главные сиденья. «Лучшие места» ясно передаёт стремление к престижу.
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: почётные места на праздничных трапезах
  rationale: πρωτοκλισίαι обозначает места высокого статуса за общей трапезой; δείπνα здесь указывает на устроенные приёмы или пиры. Формулировка передаёт социальную функцию мест и остаётся понятной современному читателю.
theological_decisions:
- issue: Объём критики книжников
  choice: Предостережение направлено против книжников, описанных как стремящиеся к внешним знакам положения и общественному почёту.
  alternative: Понимать стих как безусловное осуждение каждого книжника либо только как критику определённой одежды.
  rationale: Причастные обороты характеризуют названных книжников через конкретные формы поведения. Перевод сохраняет резкость предупреждения, но не расширяет его до утверждения, которого сам стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной, обличительной интонации. Синтаксис остаётся компактным и следует греческому перечислению; культурно обусловленные значения кратко пояснены в сносках.
