  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: ru
  text: И они ответили, что не знают, откуда оно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычное повествовательное соединение с предыдущим стихом; русский союз «и» естественно сохраняет последовательность рассказа без добавления явно не выраженного вывода.
- source_word: ἀπεκρίθησαν
  choice: они ответили
  rationale: Аорист депонентного ἀποκρίνομαι передаёт простой завершённый ответ в повествовании.
- source_word: μὴ εἰδέναι
  choice: что не знают
  rationale: Инфинитив с μή после глагола ответа передан естественной русской косвенной речью. Настоящее время «не знают» соответствует содержанию их ответа в момент речи.
- source_word: πόθεν
  choice: откуда он
  rationale: Наречие указывает на источник или происхождение; местоимение «он» естественно отсылает к упомянутому ранее крещению Иоанна, грамматически мужского рода в русском языке.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, естественная повествовательная фраза. Подлинная неопределённость πόθεν сохранена словом «откуда», без уточнения «с неба» или «от людей».
