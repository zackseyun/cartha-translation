  source_fidelity: 'Текст точно передаёт греческую конструкцию: δέ как «Но», πρὸς αὐτούς как «им», неопределённое λέγουσιν как «говорят», а инфинитив εἶναι — естественным русским придаточным с «что». «Мессия» корректно передаёт титульное τὸν χριστόν; «сын Давида» сохраняет исходную неуточнённость конструкции Δαυὶδ υἱόν.'
  naturalness: Фраза краткая, ясная и естественная для современного литературного русского. «Как же» уместно передаёт риторико-полемический характер вопроса, не добавляя отдельного смыслового утверждения.
  terminology: «Мессия» соответствует контексту мессианского ожидания и согласуется с английским аудиторским решением. Строчная буква в «сын Давида» не навязывает титульное прочтение, отсутствующее как явно заданная форма в греческом тексте.
