source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: ru
  text: 'Но Он сказал им: «Как же говорят, что Мессия — сын Давида[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сын Давида». Буквально: «Давидов сын».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Мягкий противительный переход уместен здесь, поскольку Иисус переходит к вопросу, ставящему общепринятое утверждение под сомнение.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: Естественная русская передача конструкции речи πρὸς αὐτούς; отдельное «к ним» было бы избыточно.
- source_word: Πῶς
  choice: Как же
  rationale: Передаёт не только вопрос о способе, но и вызывающий недоумение характер логического вопроса в контексте.
- source_word: λέγουσιν
  choice: говорят
  rationale: Сохраняет настоящее время и неопределённый субъект третьего лица множественного числа.
- source_word: τὸν χριστόν
  choice: Мессия
  rationale: В контексте ожидаемого царственного потомка Давида Χριστός употреблено как титул; «Мессия» ясно передаёт этот смысл.
- source_word: εἶναι
  choice: что … —
  rationale: Инфинитив в косвенной речи естественно передаётся по-русски придаточным с «что» и именным сказуемым.
- source_word: Δαυὶδ υἱόν
  choice: сын Давида
  rationale: Близко передаёт греческое сочетание без артикля и сохраняет родословную и богословскую напряжённость последующего рассуждения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Речь идёт о титуле ожидаемого Давидова избавителя, поэтому «Мессия» непосредственно выражает иудейский мессианский контекст.
- issue: Выражение сыновства по отношению к Давиду
  choice: сын Давида
  alternative: Сын Давида
  rationale: Строчная буква не превращает выражение в заранее установленный титул и сохраняет вопрос о происхождении Мессии в той форме, в какой он поставлен в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; речь краткая и торжественная без архаизации. «Как же» подчёркивает полемический поворот, не разрешая заранее вопрос, который Иисус развивает далее.
