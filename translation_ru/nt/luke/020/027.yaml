  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: ru
  text: 'Тогда к нему подошли некоторые из саддукеев, которые отрицают воскресение[a], и спросили его:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые утверждают, что воскресения нет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσελθόντες
  choice: подошли
  rationale: Аористное причастие обозначает движение к Иисусу, предшествующее основному действию; «подошли» естественно и точно передаёт это значение.
- source_word: δέ
  choice: Тогда
  rationale: Частица обозначает переход к следующему эпизоду, а не резкое противопоставление; «тогда» естественно связывает повествование.
- source_word: τινες τῶν Σαδδουκαίων
  choice: некоторые из саддукеев
  rationale: Сохраняет партитивную конструкцию греческого текста и ясно показывает, что речь идёт о части группы.
- source_word: οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι
  choice: которые отрицают воскресение
  rationale: Краткая и естественная русская формулировка передаёт их отрицательную позицию относительно воскресения, не добавляя уточнений о его характере.
- source_word: ἐπηρώτησαν αὐτόν
  choice: задали ему вопрос
  rationale: Передаёт обращённый к Иисусу вопрос и естественно подводит к прямой речи в следующем стихе; форма единственного числа допустима для одного совместно поставленного вопроса.
theological_decisions:
- issue: Передача позиции саддукеев относительно воскресения
  choice: которые отрицают воскресение
  alternative: которые утверждают, что воскресения нет
  rationale: Основной вариант кратко передаёт смысл греческой конструкции и сохраняет её богословское утверждение без дальнейшего толкования; более развёрнутый вариант дан в сноске как близкая синтаксическая передача.
translation_notes:
  register: Современный литературный русский язык, ясный и dignified по тону. Местоимение «ему» написано со строчной буквы, поскольку греческий текст не кодирует особой почтительной капитализации. Двоеточие отражает переход к содержанию вопроса в следующем стихе.
