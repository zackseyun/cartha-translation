  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: ru
  text: А что мёртвые воскресают, показал и Моисей в повествовании о кусте[a], где он называет Господа Богом Авраама, Богом Исаака и Богом Иакова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у куста». Греческое выражение может указывать либо на саму сцену у горящего куста, либо, как название раздела Писания, на повествование о нём (Исх. 3).'
    reason: lexical_alternative
  - marker: b
    text: Греч. «Господа»; это соответствует обычной передаче Божьего имени словом «Господь» в греческом переводе Исхода 3.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: воскресают
  rationale: Настоящее страдательное может буквально означать «воскрешаются», однако в современном русском «воскресают» — естественное библейское выражение, сохраняющее смысл воскресения и не исключающее подразумеваемого действия Бога.
- source_word: οἱ νεκροὶ
  choice: мёртвые
  rationale: Субстантивированное прилагательное естественно передаётся русским «мёртвые» и сохраняет собирательный смысл.
- source_word: ἐμήνυσεν
  choice: показал
  rationale: Глагол означает «дать знать, обнаружить, показать»; здесь «показал» ясно передаёт доказательную функцию ссылки Моисея, не превращая её в формальное провозглашение.
- source_word: ἐπὶ τῆς βάτου
  choice: в повествовании о кусте
  rationale: Выражение может обозначать как сцену у куста, так и раздел Писания о горящем кусте; основной перевод естественно передаёт вероятную ссылку на повествование Исх. 3, а неоднозначность отмечена в сноске.
- source_word: ὡς λέγει
  choice: где он называет
  rationale: Конструкция вводит формулу, в которой Моисей называет Господа Богом патриархов; такой перевод естественен по-русски и соответствует двойному винительному в греческом.
- source_word: κύριον
  choice: Господа
  rationale: Передаёт греческий божественный титул κύριος в цитатном контексте; заглавная буква указывает на Бога, не подменяя греческую форму реконструированным именем.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: Богом Авраама, Богом Исаака и Богом Иакова
  rationale: Повтор слова «Богом» сохранён ради ритма, акцента и структуры греческой формулы.
theological_decisions:
- issue: Форма высказывания о воскресении мёртвых
  choice: мёртвые воскресают
  alternative: мёртвые воскрешаются
  rationale: «Воскресают» звучит естественно и общепонятно в русском языке; при этом контекст не исключает Бога как действующего лица. Более буквальная страдательная форма возможна, но стилистически тяжеловеснее.
- issue: Передача κύριος в отсылке к Исходу 3
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Перевод следует непосредственно греческому κύριος и не вводит типографическое обозначение еврейского божественного имени, которого в данном греческом тексте нет; связь с традицией Септуагинты пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены повтор «Богом» и логический ход аргумента; синтаксис упрощён лишь настолько, чтобы стих был понятен при обычном чтении.
