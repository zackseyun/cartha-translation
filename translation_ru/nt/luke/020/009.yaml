base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: ru
  text: 'Затем Он начал рассказывать народу эту притчу: «Один человек насадил виноградник, сдал его в аренду виноградарям и уехал на долгое время[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уехал в другую страну надолго». Глагол может подразумевать отъезд из родных мест, в том числе за границу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Затем Он начал
  rationale: δέ обозначает переход к следующему действию в повествовании, а ἤρξατο — начало речевого действия; сочетание естественно передаёт оба элемента.
- source_word: πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην
  choice: рассказывать народу такую притчу
  rationale: После глагола речи πρός с винительным указывает на адресата; λαός передано как «народ», а παραβολή — традиционным и жанрово точным словом «притча». Русское «такую» естественно вводит последующее содержание притчи.
- source_word: Ἄνθρωπος
  choice: Один человек
  rationale: Формула естественно вводит нового персонажа мужского рода, не превращая неопределённость греческого существительного в излишне формальное «некий человек».
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: насадил виноградник
  rationale: «Насадил виноградник» точно передаёт действие φυτεύω и звучит естественно в библейском повествовательном контексте.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: сдал его в аренду виноградарям
  rationale: ἐκδίδωμι здесь обозначает передачу владения арендаторам для обработки. «Виноградари» контекстуально уточняет γεωργοί как возделывателей виноградника, а арендные отношения выражены глагольной конструкцией.
- source_word: ἀπεδήμησεν χρόνους ἱκανούς
  choice: уехал на довольно долгое время
  rationale: ἀποδημέω означает удалиться из родных мест и иногда подразумевает отъезд за границу; основной текст сохраняет более широкое значение. Множественное χρόνους с ἱκανούς указывает на значительную продолжительность.
theological_decisions:
- issue: Пол персонажа в слове Ἄνθρωπος
  choice: Один человек
  alternative: Один мужчина
  rationale: Греческая форма вводит конкретного персонажа мужского рода, однако в русском языке «человек» естественно сохраняет это значение; «мужчина» неоправданно подчёркивало бы пол.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Местоимение «Он» относится к Иисусу и оформлено по принятой в русском библейском стиле орфографической традиции. Маркер сноски поставлен при выражении, к которому относится лексическая альтернатива.
