  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ru
  text: 'Но Он сказал им: «Итак, отдайте кесарю кесарево, а Богу — Божье».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздайте кесарю… и Богу…». Глагол может означать дать, уплатить или возвратить то, что причитается.'
    reason: Лексическая альтернатива для ἀπόδοτε.
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Но Он сказал им
  rationale: δέ допускает лёгкое противопоставление или продолжение; «но» естественно передаёт поворот в ходе ответа. πρὸς αὐτούς при глаголе речи идиоматично передано как «им».
- source_word: Τοίνυν
  choice: Итак
  rationale: Передаёт выводный и возобновляющий характер частицы, сохраняя достоинство и естественность современной русской речи.
- source_word: ἀπόδοτε
  choice: отдайте
  rationale: Глагол означает дать, уплатить или возвратить то, что причитается. «Отдайте» сохраняет смысл должного и не сужает речь исключительно до уплаты налога.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: кесарю кесарево
  rationale: Устоявшаяся и краткая русская формула сохраняет широкое значение греческого субстантивированного оборота — принадлежащее кесарю — и его риторический параллелизм.
- source_word: Καίσαρος / Καίσαρι
  choice: кесарь / кесарю
  rationale: Традиционная русская передача императорского титула Καῖσαρ; она точнее сохраняет форму исходного наименования, чем пояснительное «император».
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: Богу — Божье
  rationale: 'Зеркально соответствует первой части и сохраняет ёмкость выражения: всё принадлежащее Богу, без искусственного уточнения его объёма.'
theological_decisions:
- issue: Политический и богословский объём высказывания Иисуса
  choice: Сохранено параллельное требование отдать кесарю принадлежащее кесарю, а Богу — принадлежащее Богу, без определения точных границ этих обязательств.
  alternative: Свести смысл к уплате налога, строгому разделению религии и государства либо признанию неограниченной государственной власти.
  rationale: Греческий текст формулирует широкий принцип, но не развивает исчерпывающую политическую теологию. Перевод сохраняет присущие изречению широту и напряжение.
translation_notes:
  register: Современный литературный русский с сохранением общеизвестной библейской формулы «кесарю кесарево, а Богу — Божье». Заглавные местоимения «Он» отражают принятый в русском библейском стиле почтительный регистр. Тире во второй части ясно отмечает пропуск повторяющегося глагола. Маркер сноски поставлен после всего изречения, к которому относится пояснение.
