  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: ru
  text: 'Он придёт, погубит этих виноградарей[a] и отдаст виноградник другим». Услышав это, они сказали: «Да не будет этого![b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земледельцев», «арендаторов». Греческое слово обозначает тех, кто обрабатывал землю, принадлежавшую другому.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ни в коем случае!» Греческое выражение передаёт решительное, эмоциональное отвержение; буквально: «Пусть этого не случится».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Он придёт
  rationale: Прямо передаёт будущее время ἔρχομαι и не добавляет подразумеваемого, но не выраженного в греческом тексте значения «вернётся».
- source_word: ἀπολέσει
  choice: погубит
  rationale: «Погубит» сохраняет суровость ἀπόλλυμι и допускает как уничтожение, так и гибель, не сужая смысл исключительно до физического убийства.
- source_word: γεωργοὺς
  choice: виноградарей
  rationale: В контексте притчи речь идёт о людях, обрабатывающих чужой виноградник; естественное русское «виноградари» сохраняет образ, а примечание уточняет их положение арендаторов.
- source_word: τούτους
  choice: этих
  rationale: Сохраняет указательную силу греческого местоимения и прямую отсылку к названным в притче виноградарям.
- source_word: δώσει
  choice: отдаст
  rationale: В данном контексте «отдаст» естественно выражает передачу виноградника другим, оставаясь близким к простому значению δίδωμι.
- source_word: τὸν ἀμπελῶνα
  choice: виноградник
  rationale: Обычный и точный русский эквивалент, сохраняющий образ притчи и его ветхозаветные ассоциации.
- source_word: ἄλλοις
  choice: другим
  rationale: Сохраняет неопределённость греческого текста относительно того, кому именно будет отдан виноградник.
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: Услышав это, они сказали
  rationale: Естественно передаёт временное отношение аористного причастия к основному глаголу; «это» ясно отсылает к только что сказанному.
- source_word: Μὴ γένοιτο
  choice: Да не будет этого!
  rationale: Устойчивое русское выражение передаёт сильное, эмоциональное отвержение и желательную форму греческого оптатива.
theological_decisions:
- issue: Сила ответа Μὴ γένοιτο
  choice: «Да не будет этого!» как эмоциональное пожелание-отвержение
  alternative: «Ни в коем случае!» или «Этого не должно случиться!»
  rationale: Выбранная формулировка сохраняет не просто отрицание, а потрясённую реакцию на объявленный суд, не уточняя сверх текста богословский смысл этой реакции.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественно-нейтральным библейским звучанием. «Виноградари» естественно для контекста, а примечание сохраняет социальный оттенок аренды. Формула «Да не будет этого!» несколько возвышенна, но понятна и точно воспроизводит силу греческого оптатива.
