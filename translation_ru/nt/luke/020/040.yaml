  text: For they no longer dared to ask him anything.
translation:
  language: ru
  text: Ведь они больше не осмеливались ни о чём спрашивать Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: больше не
  rationale: Передаёт прекращение действия с этого момента; это естественное современное русское соответствие временного значения наречия.
- source_word: γάρ
  choice: не выражено отдельным словом
  rationale: В данном контексте частица связывает стих с предшествующим повествованием; в русском эта пояснительно-следственная связь естественно передаётся продолжением с союзом «И», тогда как начальное «ибо» звучало бы излишне книжно.
- source_word: ἐτόλμων
  choice: не осмеливались
  rationale: Имперфект обозначает продолжавшееся в прошлом отсутствие решимости; несовершенный вид русского глагола сохраняет этот аспект.
- source_word: ἐπερωτᾶν
  choice: спрашивать
  rationale: Нейтрально и естественно передаёт вопрос, обращённый к Иисусу; «допрашивать» здесь было бы чрезмерно сильным.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому русскому библейскому оформлению уважительного местоимения.
- source_word: οὐδέν
  choice: ни о чём
  rationale: 'При отрицательном сказуемом русская конструкция с усилительным отрицательным местоимением естественно передаёт полный охват: они не решались задавать Ему никаких вопросов.'
