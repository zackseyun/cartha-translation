  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: ru
  text: Итак, при воскресении чьей женой она станет? Ведь семеро были её мужьями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ведь семеро имели её женой»; возможно также: «ведь семеро женились на ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνὴ
  choice: она
  rationale: Вопрос продолжает рассказ об уже названной женщине; местоимение естественно передаёт этот анафорический референт по-русски без ненужного повтора.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод, к которому саддукеи подводят своим примером.
- source_word: ἐν τῇ ἀναστάσει
  choice: при воскресении
  rationale: Естественный современный русский эквивалент, сохраняющий указание на обстоятельство воскресения без добавления слов «мёртвых».
- source_word: τίνος αὐτῶν γίνεται γυνή
  choice: чьей женой она станет
  rationale: Сохраняет вопрос об отношении принадлежности в τίνος и динамический оттенок γίνεται — «станет».
- source_word: οἱ γὰρ ἑπτὰ
  choice: ведь все семеро
  rationale: Определённая группа из семи братьев уже известна из контекста; «семеро» естественно для лиц мужского пола, а «все» ясно выражает охват всей названной группы.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: были её мужьями
  rationale: Идиоматично передаёт брачное отношение в русском языке; буквальная конструкция «имели её женой» звучит архаично и неестественно.
theological_decisions:
- issue: Смысл ἀνάστασις в вопросе саддукеев
  choice: «воскресение» без поясняющего дополнения
  alternative: «воскресение мёртвых»
  rationale: В самом стихе стоит только ἀνάστασις; добавление «мёртвых» сняло бы формальную краткость исходного вопроса и внесло бы слова из более широкого контекста.
- issue: Будущий брачный статус женщины
  choice: «станет»
  alternative: «будет»
  rationale: «Станет» сохраняет значение γίνομαι и форму гипотетического вопроса, не утверждая, что земные брачные отношения действительно продолжаются после воскресения.
translation_notes:
  register: Современный литературный русский язык. Формулировка вопроса ясная и естественная; архаичная калька «имели её женой» вынесена в примечание. Маркер примечания поставлен при соответствующей заключительной фразе.
