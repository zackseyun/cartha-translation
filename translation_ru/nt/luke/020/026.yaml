  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: ru
  text: И они не смогли поймать Его на слове перед народом[a]; изумившись Его ответу, они умолкли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ухватиться за Его слова в присутствии народа».'
    reason: Сохраняет более буквальный образ ἐπιλαβέσθαι и возможное понимание τοῦ ῥήματος как сказанных слов, тогда как основной текст использует естественную русскую идиому.
lexical_decisions:
- source_word: οὐκ ἴσχυσαν
  choice: не смогли
  rationale: Естественно и точно передаёт отсутствие способности достичь задуманного, не добавляя оттенка физической слабости.
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: поймать Его на слове
  rationale: Русское идиоматическое выражение передаёт образ попытки ухватиться за сказанное и уличить Иисуса Его собственными словами. Местоимение «Его» ясно восстанавливается из контекста.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: перед народом
  rationale: Сохраняет значение публичности — «перед, в присутствии народа» — и передаёт λαός словом «народ», а не более узким «толпа».
- source_word: θαυμάσαντες
  choice: изумившись
  rationale: Передаёт сильное удивление их ответом Иисуса и естественно оформляет предшествующее действие деепричастием.
- source_word: ἀποκρίσει
  choice: ответу
  rationale: Прямое и естественное соответствие в контексте спора и заданного вопроса.
- source_word: ἐσίγησαν
  choice: умолкли
  rationale: Передаёт наступление молчания после услышанного, сохраняя результативность аориста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Поймать на слове» понятно современному читателю; «умолкли» лаконично и достойно передаёт резкий переход к молчанию.
