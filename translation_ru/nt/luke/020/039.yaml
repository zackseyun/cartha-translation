  text: ἀποκριθέντες δέ τινες τῶν γραμματέων εἶπαν· Διδάσκαλε, καλῶς εἶπας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: ru
  text: 'Некоторые из книжников сказали в ответ: «Учитель, Ты хорошо сказал».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Учитель, Ты сказал верно»; также возможно: «Учитель, Ты правильно сказал».'
    reason: лексическая альтернатива для καλῶς
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: сказали в ответ
  rationale: Аористное причастие вводит реплику как отклик на предшествующие слова Иисуса; русское «сказали в ответ» естественно передаёт эту функцию.
- source_word: δέ
  choice: не выражено отдельно
  rationale: Частица обозначает мягкий переход; в русском связность достаточно передана порядком слов и выражением «сказали в ответ», а отдельное «тогда» могло бы излишне подчёркивать временную последовательность.
- source_word: τινες τῶν γραμματέων
  choice: некоторые из книжников
  rationale: Партитивная конструкция указывает лишь на часть книжников, что прямо сохраняется в переводе.
- source_word: γραμματέων
  choice: книжников
  rationale: «Книжники» — устоявшееся и узнаваемое обозначение знатоков и толкователей Закона в евангельском контексте.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и естественное соответствие звательной форме διδάσκαλος.
- source_word: καλῶς
  choice: хорошо
  rationale: Сохраняет широкую похвальную оценку, которая может относиться и к удачности, и к правильности сказанного.
- source_word: εἶπας
  choice: Ты сказал
  rationale: Простой прошедший вид естественно передаёт греческий аорист и непосредственную оценку только что произнесённых слов.
theological_decisions: []
