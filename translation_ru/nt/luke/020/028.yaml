  naturalness: Предлагаемая формулировка сохраняет современный литературный строй фразы и юридико-библейский регистр. «Брат, который женат и бездетен» естественно передаёт два условия; «произвести потомство для своего брата» ясно выражает цель предписания.
  terminology: «Учитель» и «Моисей написал нам» точны. «Взять его жену» сохраняет правовую формулу без ненужного пояснения «вдову». «Произвести потомство для своего брата» точнее, чем «продолжить род», а сноска сохраняет связь с традиционным библейским идиомом «воздвигнуть семя».
