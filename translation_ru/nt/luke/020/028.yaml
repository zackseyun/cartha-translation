  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: ru
  text: 'Они сказали: «Учитель! Моисей написал нам: если у кого-нибудь умрёт брат, который женат и бездетен[a], то его брат должен взять его жену и произвести потомство для своего брата[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умрёт, имея жену и будучи бездетным».'
    reason: lexical_alternative
  - marker: b
    text: 'Это правовое выражение отсылает к Второзаконию 25:5: потомство производится от имени умершего брата; буквально: «воздвигнуть семя брату».'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: Они сказали
  rationale: Причастие связывает реплику с предыдущим контекстом; в отдельном стихе личная форма естественно передаёт начало прямой речи.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое обращение к Иисусу; современный и точный эквивалент без архаического оттенка.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Моисей написал нам
  rationale: Дательный ἡμῖν указывает на закон, данный Израилю и относящийся к говорящим; «нам» сохраняет лаконичность оригинала.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: если у кого-нибудь умрёт брат
  rationale: Передаёт неопределённое и обобщённое τινος, сохраняя форму условного положения закона.
- source_word: ἔχων γυναῖκα
  choice: имевший жену
  rationale: Формально близко к греческому «имея жену» и естественно по-русски; возможное контекстуальное понимание «оставив после себя жену» вынесено в сноску.
- source_word: καὶ οὗτος ἄτεκνος ᾖ
  choice: и останется бездетным
  rationale: Местоимение относится к умершему брату. Такая формулировка естественно выражает его бездетность на момент смерти, не уточняя пол возможных детей.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: то его брат должен взять эту жену
  rationale: «Должен» передаёт предписание цитируемого закона, а «взять эту жену» сохраняет юридико-библейскую формулировку, не разворачивая её в пояснительный пересказ.
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: продолжить род своего брата
  rationale: Передаёт смысл юридического выражения о потомках, которые сохраняют имя и линию умершего; буквальный образ «воздвигнуть семя» разъяснён в сноске.
theological_decisions:
- issue: Передача правового языка левиратного брака без внесения позднейших конфессиональных толкований
  choice: «его брат должен взять эту жену и продолжить род своего брата»
  alternative: «его брат должен жениться на вдове и произвести для умершего брата потомство»
  rationale: Выбранный вариант сохраняет обязательный характер постановления и его цель, но не добавляет в основной текст пояснений, отсутствующих в греческом, и не устраняет библейскую правовую образность полностью.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Юридическая структура высказывания сохранена, но тяжеловесные и устаревшие обороты устранены. Сноски [a] и [b] поставлены непосредственно при выражениях, которые они поясняют.
