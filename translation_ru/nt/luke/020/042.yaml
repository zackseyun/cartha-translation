  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: ru
  text: 'Ведь сам Давид говорит в книге Псалмов: «Господь[a] сказал моему Господу: „Сядь по правую руку от Меня“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в соответствии с еврейским текстом Псалма 110:1 (109:1 в традиционной русской нумерации): «ГОСПОДЬ сказал моему Господу».'
    reason: Альтернативная передача отражает то, что в еврейском тексте Псалма на месте первого κύριος стоит божественное имя YHWH.
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Ведь сам
  rationale: γάρ вводит обоснование и естественно передаётся словом «ведь», а эмфатическое αὐτός — словом «сам».
- source_word: Δαυὶδ
  choice: Давид
  rationale: Использована общепринятая русская форма библейского имени.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохранено как естественная формула введения сохраняющего силу письменного свидетельства.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: в книге Псалмов
  rationale: Переданы существительное βίβλος и родительный множественного числа ψαλμῶν; написание отражает название библейской книги.
- source_word: Εἶπεν
  choice: сказал
  rationale: Аорист в цитате естественно передан русским прошедшим временем.
- source_word: κύριος
  choice: Господь
  rationale: Основной текст следует греческому κύριος; заглавная буква указывает, что первый титул относится к Богу, не подменяя греческое чтение реконструкцией еврейского текста.
- source_word: τῷ κυρίῳ μου
  choice: моему Господу
  rationale: Дательный падеж и притяжательное местоимение переданы прямо; «Господу» сохраняет значимый повтор κύριος и христологическое напряжение цитаты.
- source_word: Κάθου
  choice: Сядь
  rationale: Кратко и естественно передаёт повелительную форму κάθημαι.
- source_word: ἐκ δεξιῶν μου
  choice: по правую руку от Меня
  rationale: Устойчивый русский оборот передаёт почётное место справа от говорящего и сохраняет библейскую образность.
theological_decisions:
- issue: Первое κύριος в цитате, где еврейский текст Псалма содержит божественное имя YHWH
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной текст переводит непосредственно греческое κύριος. Написание «ГОСПОДЬ», отражающее еврейское YHWH, сохранено в примечании как важная межтекстовая особенность.
- issue: Второе κύριος в христологически значимой цитате
  choice: моему Господу
  alternative: моему господину
  rationale: «Господу» сохраняет повтор одного и того же греческого слова и вес аргумента Иисуса, не уточняя сверх текста, в каком именно смысле Давид так называет Мессию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка остаётся ясной для широкого читателя; повтор «Господь — Господу» намеренно сохранён.
