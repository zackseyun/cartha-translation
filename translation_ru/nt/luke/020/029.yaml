  text: ἑπτὰ οὖν ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος λαβὼν γυναῖκα ἀπέθανεν ἄτεκνος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: ru
  text: Итак, было семь братьев. Первый женился[a] и умер бездетным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взял жену» — греческое выражение со значением «женился».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ
  choice: семь
  rationale: Прямое соответствие количественному числительному, относящемуся к братьям.
- source_word: οὖν
  choice: итак
  rationale: Передаёт связующую и выводную функцию частицы в продолжении рассуждения, не придавая ей временного значения.
- source_word: ἀδελφοὶ
  choice: братьев
  rationale: Мужской род и контекст левиратного брака указывают именно на братьев-мужчин.
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Обозначает первого в последовательности, не утверждая прямо, что он был старшим по возрасту.
- source_word: λαβὼν γυναῖκα
  choice: женился
  rationale: Естественно передаёт греческую идиому «взять жену» и сохраняет её брачный смысл.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямой и стилистически нейтральный перевод аориста.
- source_word: ἄτεκνος
  choice: бездетным
  rationale: Кратко и точно выражает, что он умер, не оставив детей.
