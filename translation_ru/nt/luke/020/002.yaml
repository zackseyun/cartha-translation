  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: ru
  text: 'И сказали Ему: «Скажи нам, какой властью Ты всё это делаешь? Или кто дал Тебе эту власть?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз сохраняет связь с предыдущим повествованием, не добавляя временного оттенка.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: сказали Ему
  rationale: Естественная русская передача плеонастической греческой конструкции; адресат речи сохранён без неестественного «сказали, говоря Ему».
- source_word: Εἰπὸν ἡμῖν
  choice: Скажи нам
  rationale: Повелительная форма естественно и точно передаётся современным русским выражением «Скажи нам».
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: какой властью
  rationale: Творительный падеж естественно выражает основание и полномочие, с которым совершается действие.
- source_word: ταῦτα ποιεῖς
  choice: Ты это делаешь
  rationale: Русское собирательное «это» в данном вопросе естественно отсылает к совокупности недавних действий Иисуса; настоящее время сохранено.
- source_word: ἢ
  choice: Или
  rationale: Сохраняет вторую, альтернативно сформулированную часть требования.
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: кто дал Тебе
  rationale: По-русски краткая личная конструкция естественно передаёт смысл субстантивированного причастия без утраты вопроса об источнике полномочий.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: эту власть
  rationale: «Власть» здесь означает предоставленное право и полномочие, а указательное местоимение сохраняет ταύτην.
theological_decisions:
- issue: Значение ἐξουσία в споре о действиях Иисуса в храме
  choice: власть
  alternative: полномочие; право; сила
  rationale: Вопрос касается законности и источника права Иисуса действовать, а не просто Его способности или силы. «Власть» сохраняет как институциональный, так и богословский смысл.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и сохраняет официальный, вызывающий характер вопроса. Местоимения, относящиеся к Иисусу, оформлены с традиционной прописной буквы. Начальное «и» сохранено как повествовательная связь со стихом 1.
