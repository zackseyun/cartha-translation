  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: ru
  text: Свернув свиток[a] и вернув его служителю[b], он сел. Глаза всех в синагоге были устремлены на него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «книгу». Греческое слово может обозначать письменный документ вообще, но в синагоге того времени это был свиток.'
    reason: lexical_alternative
  - marker: b
    text: То есть служителю синагоги, который, среди прочего, отвечал за обращение со свитками.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: свернув
  rationale: В контексте свитка глагол обозначает его сворачивание; этот вариант исторически точнее, чем общее «закрыв».
- source_word: βιβλίον
  choice: свиток
  rationale: Хотя слово может обозначать книгу или письменный документ вообще, в синагоге I века книгу Исаии читали со свитка.
- source_word: ἀποδοὺς
  choice: вернув
  rationale: Глагол передаёт возвращение предмета тому, у кого он находился; «вернув» естественно и точно выражает этот смысл.
- source_word: ὑπηρέτῃ
  choice: служителю
  rationale: Здесь имеется в виду служитель синагоги, помогавший при богослужении и обращении со свитками; слово «служителю» сохраняет функциональное значение без внесения более узкого титула.
- source_word: ἐκάθισεν
  choice: он сел
  rationale: Прямо передаёт повествовательное действие, не добавляя в основной текст подразумеваемого обычая учить сидя.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: глаза всех
  rationale: Сохраняет яркий образ греческого текста и всеобщность внимания присутствующих.
- source_word: ἀτενίζοντες αὐτῷ
  choice: были устремлены на него
  rationale: Передаёт продолжительный, пристальный взгляд естественным литературным русским языком, не приписывая ему враждебности.
- source_word: συναγωγῇ
  choice: синагоге
  rationale: В данном контексте слово обозначает место собрания иудейской общины — синагогу.
theological_decisions:
- issue: Историческая форма βιβλίον при чтении в синагоге
  choice: свиток
  alternative: книга
  rationale: Выбор отражает материальную форму книги Исаии в синагоге I века и не меняет богословского смысла текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Образ «глаза всех… были устремлены» сохранён ради выразительности оригинала; местоимения, относящиеся к Иисусу, даны со строчной буквы согласно общим нормам современного русского текста.
