lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: отзывались о Нём одобрительно
  rationale: Оборот допускает значение свидетельства в Его пользу; в сочетании с последующим удивлением естественнее всего передаёт положительную оценку слушателей, не сводя выражение к формальному свидетельству.
- source_word: ἐθαύμαζον
  choice: удивлялись
  rationale: Русское «удивлялись» естественно передаёт продолжительную реакцию, выраженную имперфектом, и оставляет открытым оттенок восхищения либо изумления.
- source_word: ἐπὶ τοῖς λόγοις τῆς χάριτος
  choice: удивлялись благодатным словам
  rationale: ἐπί с дательным указывает на повод реакции, а родительный τῆς χάριτος качественно характеризует слова как исполненные благодати, благосклонности и привлекательности. «Благодатным словам» сохраняет богословскую ёмкость выражения и звучит достойно по-русски.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: исходившим из Его уст
  rationale: Сохраняет конкретный образ исходного текста и ясно связывает причастный оборот со «словами».
- source_word: Οὐχὶ
  choice: Разве это не
  rationale: Вопросительная конструкция ожидает утвердительного ответа; русское «разве это не» естественно сохраняет такую риторическую направленность.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: это не сын Иосифа
  rationale: Прямо передаёт восприятие собравшихся и не добавляет пояснений, отсутствующих в тексте.
theological_decisions:
- issue: Именование Иисуса сыном Иосифа в свете девственного зачатия
  choice: 'Передать слова собравшихся прямо: «сын Иосифа»'
  alternative: Добавить оговорку вроде «как они полагали» или иным образом дистанцировать рассказчика от их слов
  rationale: Текст сообщает мнение собравшихся, а не даёт авторского разъяснения происхождения Иисуса. Прямой перевод сохраняет повествовательное и богословское напряжение, не внося в реплику отсутствующего пояснения.
- issue: Значение τῆς χάριτος
  choice: благодатным словам
  alternative: приятным словам; словам о благодати
  rationale: Греческое выражение допускает качественный смысл — слова, отмеченные благодатью, благосклонностью или привлекательностью. «Благодатным» сохраняет эту широту; перевод «о благодати» неоправданно превращал бы характеристику слов в указание на их тему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Из Его уст» сохраняет образность оригинала; «отзывались о Нём одобрительно» ясно и естественно выражает благоприятную реакцию. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции.
