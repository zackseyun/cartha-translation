source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: ru
  text: Дух Господа на Мне, потому что Он помазал Меня возвещать добрую весть бедным. Он послал Меня провозгласить пленным освобождение[a] и слепым — возвращение зрения, отпустить угнетённых на свободу[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἄφεσις может также означать «прощение»; здесь упоминание пленных и угнетённых указывает прежде всего на освобождение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сломленных» или «сокрушённых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: Дух Господа на Мне
  rationale: Сохраняет генитивную конструкцию «Дух Господа», библейский ритм цитаты из Исаии и значение ἐπί; отсутствующая в греческом связка естественно опущена и в русском.
- source_word: οὗ εἵνεκεν
  choice: потому что
  rationale: Естественно передаёт причинное значение греческого оборота, не усложняя синтаксис.
- source_word: ἔχρισέν με
  choice: Он помазал Меня
  rationale: «Помазал» точно передаёт χρίω и сохраняет мессианский смысл; русское прошедшее время естественно выражает совершившееся поручение, результат которого продолжается.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: возвещать добрую весть бедным
  rationale: Передаёт значение объявления доброй вести без сужения до церковного термина «проповедовать Евангелие»; πτωχοί не уточняется как исключительно материальная или социальная категория.
- source_word: ἀπέσταλκέν με κηρύξαι
  choice: Он послал Меня провозгласить
  rationale: «Послал» передаёт совершившееся посланничество с продолжающейся силой, а «провозгласить» — публичный характер κηρύσσω.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: пленным освобождение
  rationale: В сочетании с пленными ἄφεσις прежде всего означает освобождение; предложный порядок сохраняет структуру и торжественный ритм греческой фразы.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: слепым — прозрение
  rationale: «Прозрение» кратко и естественно передаёт обретение или возвращение зрения; тире ясно обозначает подразумеваемый глагол.
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: отпустить угнетённых на свободу
  rationale: Русское «отпустить … на свободу» естественно передаёт сочетание ἀποστέλλω с ἐν ἀφέσει, а «угнетённых» выражает контекстуальный смысл буквально «сломленных» людей.
theological_decisions:
- issue: Значение ἄφεσις в цитате из Исаии
  choice: освобождение / свобода
  alternative: прощение
  rationale: Ближайший контекст говорит о пленных и угнетённых, поэтому образ освобождения здесь первичен. Поскольку в других местах у Луки ἄφεσις часто означает прощение, эта реальная смысловая возможность отмечена в сноске, а не устранена.
- issue: Смысл τεθραυσμένους
  choice: угнетённых
  alternative: сломленных / сокрушённых
  rationale: Форма буквально описывает тех, кто был сломлен или сокрушён; в контексте освобождения «угнетённых» ясно передаёт социально-личностный образ, не ограничивая его только внутренней подавленностью.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмом публичного чтения. Сохранены параллельные формулы поручения и мессианское «помазал»; синтаксис слегка сглажен там, где буквальное воспроизведение было бы неестественным. Прописные буквы в местоимениях следуют принятой русской библейской орфографии.
