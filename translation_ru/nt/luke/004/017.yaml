id: LUK.4.17
reference: Luke 4:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: ru
  text: 'Ему подали свиток пророка Исаии[a]. Развернув свиток, он нашёл место, где было написано:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «книгу». Греческое слово βιβλίον может обозначать письменный документ вообще, однако в данном контексте синагоги, скорее всего, имеется в виду свиток.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: подали
  rationale: Пассивная форма означает, что свиток дали или передали Иисусу; «ему подали» естественно передаёт действие в обстановке синагогального чтения.
- source_word: βιβλίον
  choice: свиток
  rationale: В контексте синагоги I века речь, вероятнее всего, идёт о свитке, а не о книге в форме кодекса.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: пророка Исаии
  rationale: Родительный оборот естественно обозначает принадлежность текста пророку Исаии и сохраняет его титул.
- source_word: ἀναπτύξας
  choice: развернув
  rationale: Причастие аориста обозначает действие, предшествующее основному; глагол «развернуть» точно соответствует обращению со свитком.
- source_word: εὗρεν
  choice: нашёл
  rationale: Прямой и естественный эквивалент, не добавляющий представления о трудности поиска.
- source_word: τόπον
  choice: место
  rationale: Сохраняет конкретное значение греческого слова и ясно указывает на место в тексте.
- source_word: οὗ ἦν γεγραμμένον
  choice: где было написано
  rationale: Естественно вводит последующую цитату и передаёт результат совершённого ранее написания без архаизации.
theological_decisions: []
