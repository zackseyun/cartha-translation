  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: ru
  text: 'Иисус ответил ему: «Написано: „Не хлебом одним будет жить человек“».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иисус цитирует Второзаконие 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: ответил ему
  rationale: Обычный и естественный русский эквивалент конструкции ἀποκρίνομαι с πρός и винительным падежом.
- source_word: Γέγραπται
  choice: Написано
  rationale: Устоявшаяся формула цитирования Писания; сохраняет смысл совершённого написания, сохраняющего силу.
- source_word: ὅτι
  choice: ':'
  rationale: Здесь слово вводит прямую цитату, что в современном русском естественно передаётся двоеточием.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: не хлебом одним
  rationale: Творительный падеж естественно выражает средство или основу поддержания жизни и сохраняет узнаваемую структуру цитаты.
- source_word: ζήσεται
  choice: будет жить
  rationale: Прямо и современно передаёт форму будущего времени.
- source_word: ὁ ἄνθρωπος
  choice: человек
  rationale: В контексте Второзакония это единичное существительное с обобщающим значением; русское «человек» естественно охватывает человечество без утраты формы оригинала.
theological_decisions:
- issue: Обобщающее значение ὁ ἄνθρωπος в цитате из Писания
  choice: человек
  alternative: люди / всякий человек
  rationale: «Человек» сохраняет единственное число и представительный, общечеловеческий смысл оригинала, не сужая его до мужчины и не превращая в абстрактное коллективное понятие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранена внутренняя цитата и узнаваемый порядок слов «не хлебом одним», без архаических форм.
