base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: ru
  text: 'И он начал говорить им: «Сегодня исполнилось это Писание, когда вы это слышите».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в ваших ушах».'
    reason: Сноска сохраняет конкретный образ греческого выражения ἐν τοῖς ὠσὶν ὑμῶν, переданного в основном тексте естественным русским оборотом.
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς
  choice: И он начал говорить им
  rationale: Оборот передаёт начало речи Иисуса; δέ обозначает плавное продолжение повествования и естественно передаётся союзом «и».
- source_word: Σήμερον
  choice: Сегодня
  rationale: Сохраняет начальную, смыслово выделенную позицию наречия и непосредственность исполнения.
- source_word: πεπλήρωται
  choice: исполнилось
  rationale: Совершенный вид естественно передаёт завершившееся исполнение с сохраняющимся результатом; возвратная форма не добавляет явно не названного деятеля.
- source_word: ἡ γραφὴ αὕτη
  choice: это Писание
  rationale: В контексте речь идёт о только что прочитанном священном тексте; формулировка сохраняет единственное число и указательное местоимение.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: которое вы только что услышали
  rationale: Естественно по-русски передаёт буквальный образ «в ваших ушах» и связь исполнения с прозвучавшим чтением, не утверждая сверх текста, что само слушание было средством исполнения.
theological_decisions:
- issue: Характер исполнения Писания
  choice: Оставить краткое заявление о том, что Писание исполнилось сегодня, без пояснения, кем и каким образом.
  alternative: «Сегодня это пророчество исполнилось во Мне»
  rationale: Контекст связывает исполнение с Иисусом, однако в самом греческом тексте стиха нет ни слова «пророчество», ни выражения «во Мне».
translation_notes:
  register: Современный литературный русский язык; речь краткая, торжественная и понятная. Прямая речь оформлена без архаизмов. Местоимение «он» не капитализируется, поскольку греческий текст не кодирует конфессиональную орфографическую норму.
