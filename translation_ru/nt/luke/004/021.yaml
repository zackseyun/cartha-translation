  revision_rationale: 'Убрано невыраженное в оригинале «только что» и уточнена синтаксическая связь последнего оборота: речь идёт об исполнении Писания в ситуации его слушания, а не только о ранее услышанном тексте. Смысл заявления не расширен словами «пророчество» или «во Мне».'
