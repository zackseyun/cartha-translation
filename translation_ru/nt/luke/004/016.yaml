  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: ru
  text: И пришёл Он в Назару[a], где вырос. По Своему обыкновению Он в субботу вошёл в синагогу и встал читать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Назарет». В греческом тексте здесь стоит форма «Назара».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Назара
  rationale: Передаёт именно греческую форму топонима в данном стихе, не гармонизируя её молча с более привычной формой «Назарет».
- source_word: τεθραμμένος
  choice: вырос
  rationale: Естественно передаёт здесь смысл воспитания и взросления в данном месте; результативный оттенок перфекта понятен из контекста.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: по Своему обыкновению
  rationale: Сохраняет значение установившейся привычки и звучит достойно и естественно в современном русском языке.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: в субботу
  rationale: Передаёт идиоматическое значение греческого выражения с формальным множественным числом σαββάτων.
- source_word: συναγωγήν
  choice: синагогу
  rationale: В данном иудейском контексте обозначает синагогу как место собрания и богослужения.
- source_word: ἀνέστη ἀναγνῶναι
  choice: встал, чтобы читать
  rationale: Точно передаёт действие и выраженную инфинитивом цель без уточнения вслух, которого в греческом тексте нет.
theological_decisions:
- issue: Передача топонима Ναζαρά
  choice: Назара
  alternative: Назарет
  rationale: Выбранная форма следует написанию исходного греческого текста этого стиха; привычная русская форма дана в примечании, чтобы не скрывать связь с Назаретом.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским достоинством. Местоимение «Он» и притяжательное «Своему» написаны с прописной буквы как уважительное обозначение Иисуса; синтаксис упрощён до естественного русского порядка без потери последовательности событий.
