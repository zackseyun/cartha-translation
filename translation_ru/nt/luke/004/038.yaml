base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: ru
  text: Выйдя из синагоги, Он вошёл в дом Симона. Тёща Симона была охвачена сильной лихорадкой, и Его просили за неё[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его спрашивали о ней». Греческое выражение буквально означает, что Его спрашивали или просили о ней; в данном контексте, вероятно, имеется в виду просьба помочь ей.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Выйдя из синагоги
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу. В контексте русское «выйдя» естественно передаёт и вставание, и последующий уход из синагоги, не создавая неясного образа простого вставания внутри здания.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: Он вошёл в дом Симона
  rationale: Сохраняется прямое значение движения внутрь помещения; конструкция звучит естественно по-русски.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: тёща Симона
  rationale: πενθερά обозначает мать жены, то есть тёщу. Родственная связь передана прямо, без дополнительных выводов.
- source_word: ἦν συνεχομένη
  choice: была охвачена
  rationale: Перифрастическая пассивная конструкция передаёт состояние человека, которого тяжело удерживает или сковывает болезнь. «Была охвачена» сохраняет этот образ и остаётся естественным выражением.
- source_word: πυρετῷ μεγάλῳ
  choice: сильной горячкой
  rationale: μέγας усиливает обозначение лихорадочного состояния. «Сильная горячка» ясно и литературно передаёт тяжесть болезни, не добавляя точного измерения температуры.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: Его просили за неё
  rationale: ἐρωτάω допускает значения «спрашивать» и «просить»; контекст указывает на обращённую к Иисусу просьбу ради больной. Формулировка не уточняет прямо, в чём именно должна состоять помощь.
theological_decisions:
- issue: Вывод о семейном положении Симона из слова πενθερά
  choice: Передать родство словом «тёща», не развивая подразумеваемые исторические или доктринальные выводы.
  alternative: Добавить пояснение о том, что Симон был женат.
  rationale: Текст прямо называет женщину тёщей Симона, но задача перевода — передать родственный термин, а не дополнять повествование выводами.
- issue: Характер просьбы в ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: «Его просили за неё»
  alternative: «Его попросили исцелить её» или «Его спросили о ней»
  rationale: Контекст предполагает просьбу о помощи, однако греческий текст не называет исцеление прямо. Выбранная формулировка сохраняет одновременно просьбу и её неуточнённое содержание; более буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» по традиции написано с прописной буквы как указание на Иисуса. «Горячка» сохраняет образ болезни и воспринимается естественнее, чем буквальное «великая лихорадка».
