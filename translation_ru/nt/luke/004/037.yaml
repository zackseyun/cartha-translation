  text: καὶ ἐξεπορεύετο ἦχος περὶ αὐτοῦ εἰς πάντα τόπον τῆς περιχώρου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/037.yaml
  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: ru
  text: И весть о Нём распространялась по всей округе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И молва о Нём расходилась по всем местам в окрестностях».'
    reason: Лексически возможный вариант сохраняет более буквальные оттенки ἦχος («молва») и ἐξεπορεύετο («расходилась»), а также явное πάντα τόπον («по всем местам»).
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: распространялась
  rationale: Имперфект передаёт продолжавшееся в прошлом действие; при подлежащем ἦχος естественное русское выражение «весть распространялась» сохраняет образ движения сообщения наружу.
- source_word: ἦχος
  choice: весть
  rationale: Хотя основное значение слова — «звук, шум», сочетание с περὶ αὐτοῦ в данном контексте обозначает известие или молву об Иисусе. «Весть» ясно и достойно передаёт контекстуальный смысл.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Прямо передаёт содержание вести; местоимение написано с прописной буквы согласно принятому русскому библейскому стилю при указании на Иисуса.
- source_word: εἰς πάντα τόπον
  choice: по всей
  rationale: Русская конструкция «по всей округе» естественно передаёт распространение во все места, сохраняя распределительное значение πάντα τόπον без тяжеловесного «в каждое место».
- source_word: τῆς περιχώρου
  choice: округе
  rationale: περίχωρος обозначает прилегающую местность или окружающий район; «округа» кратко и естественно выражает этот географический смысл.
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход и связь с предшествующим событием.
theological_decisions: []
