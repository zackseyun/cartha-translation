  source_fidelity: «И весть о Нём распространялась по всей округе» точно передаёт ἦχος περὶ αὐτοῦ как известие о Нём и имперфект ἐξεπορεύετο как продолжающееся распространение. «По всей округе» — естественный русский способ выразить охват всех мест окружающей местности (εἰς πάντα τόπον τῆς περιχώρου), без ненужной буквальности.
