  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: ru
  text: И Он спустился в Капернаум, город в Галилее. По субботам Он учил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῆλθεν
  choice: спустился
  rationale: Передаёт направленность глагола κατέρχομαι и естественно соответствует спуску к расположенному ниже Капернауму, не добавляя точки зрения, которой нет в тексте.
- source_word: Καφαρναοὺμ
  choice: Капернаум
  rationale: Употреблена общепринятая русская форма географического названия.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: город в Галилее
  rationale: Неопределённое πόλιν обозначает один из городов, а родительный τῆς Γαλιλαίας здесь естественно передаётся как указание местонахождения.
- source_word: ἦν διδάσκων
  choice: учил
  rationale: В сочетании с обстоятельством «по субботам» русский глагол несовершенного вида естественно передаёт длительное и повторяющееся действие перифрастической конструкции.
- source_word: αὐτοὺς
  choice: там людей
  rationale: Русское «их» без явного антецедента звучало бы неясно. «Людей» минимально проясняет подразумеваемых слушателей, а «там» обеспечивает естественную связь с Капернаумом, не уточняя место обучения сверх исходного текста.
- source_word: ἐν τοῖς σάββασιν
  choice: по субботам
  rationale: 'Естественная русская форма, точно передающая множественное число и вероятное значение повторяемости: в разные субботние дни.'
theological_decisions:
- issue: Передача множественного числа σάββασιν
  choice: по субботам
  alternative: в субботу
  rationale: Форма «по субботам» одновременно естественна по-русски и сохраняет вероятный итеративный смысл греческого множественного числа, представляя обучение как повторяющуюся практику.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и достойное. «По субботам» сохраняет аспект повторяемости без неестественной буквальности. Местоимение αὐτούς передано контекстуально как «людей», поскольку изолированное русское «их» в данном стихе не имеет ясного антецедента.
