lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: сорок дней
  rationale: Винительный длительности естественно передаётся по-русски без предлога; оборот продолжает синтаксис предыдущего стиха.
- source_word: πειραζόμενος
  choice: подвергаясь искушению
  rationale: Глагол допускает значения «искушать» и «испытывать»; при действующем лице — дьяволе — здесь наиболее уместен смысл враждебного искушения.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: со стороны дьявола
  rationale: Оборот ясно обозначает действующее лицо при пассивном причастии и звучит естественнее, чем двусмысленное «дьяволом» после существительного «искушение».
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: Он ничего не ел
  rationale: Прямо и естественно передаёт усиленное греческое отрицание.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: В те дни
  rationale: Краткий современный русский оборот обозначает тот же период и избегает ненужного повторения «в течение» сразу после «сорок дней».
- source_word: συντελεσθεισῶν αὐτῶν
  choice: когда они завершились
  rationale: Родительный самостоятельный оборот передан придаточным времени; местоимение относится к дням, а «завершились» сохраняет значение достижения конца.
- source_word: ἐπείνασεν
  choice: почувствовал голод
  rationale: Передаёт наступление состояния, выраженное аористом, естественнее, чем книжное «взалкал» или менее точное статическое «был голоден».
theological_decisions:
- issue: Смысл πειραζόμενος применительно к пребыванию Иисуса в пустыне
  choice: подвергаясь искушению
  alternative: подвергаясь испытанию
  rationale: Контекст с дьяволом как действующим лицом поддерживает значение «искушение», однако возможное лексическое значение «испытание» сохранено в примечании без догматического разрешения напряжения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Начало со строчной буквы сохраняет связь с синтаксисом Лк 4:1; местоимение «Он» написано с прописной буквы как традиционная уважительная норма, не добавляющая толкования.
