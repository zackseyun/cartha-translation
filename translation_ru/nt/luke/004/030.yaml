  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: ru
  text: Но Он прошёл посреди них и продолжил Свой путь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст описывает, как Иисус прошёл через середину толпы, не поясняя, каким образом это произошло.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Он
  rationale: Явно выраженное местоимение имеет некоторую эмфатическую силу; в русском подлежащее можно было бы опустить, поэтому «Он» сохраняет этот акцент без усиленного «Сам же Он».
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкое противопоставление враждебному намерению толпы в предыдущем стихе.
- source_word: διελθὼν
  choice: прошёл
  rationale: Причастная конструкция передана личной формой с однородными сказуемыми, что естественно для современного русского и сохраняет последовательность действий.
- source_word: διὰ μέσου αὐτῶν
  choice: посреди них
  rationale: Передаёт движение через середину собравшихся, не объясняя, каким образом это стало возможным.
- source_word: ἐπορεύετο
  choice: продолжил Свой путь
  rationale: Передаёт длительный либо продолжающийся характер имперфекта и звучит естественнее буквального «шёл».
theological_decisions:
- issue: Следует ли прямо обозначить уход Иисуса как чудесный
  choice: 'Описательно нейтральная формулировка: «прошёл посреди них и продолжил Свой путь»'
  alternative: Добавить указание, что Он прошёл чудесным или сверхъестественным образом
  rationale: Греческий текст сообщает о движении Иисуса через толпу, но не объясняет его механизм; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской религиозно-издательской практике.
