  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: ru
  text: Когда настал день, Иисус вышел и отправился в безлюдное место.[a] Толпы людей искали Его и, придя к Нему, старались удержать Его,[b] чтобы Он не уходил от них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в уединённое место»; греческое выражение обозначает незаселённое или удалённое от людей место.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удерживали Его». Смысл в том, что толпы старались не дать Ему уйти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Когда настал день
  rationale: Естественно передаёт временной генитив абсолютный и переход к событиям нового дня.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: Иисус вышел и отправился
  rationale: Последовательно передаёт предшествующее действие причастия и основное движение, избегая неестественного повтора «вышел и пошёл»; имя восстановлено из контекста ради ясности.
- source_word: εἰς ἔρημον τόπον
  choice: в безлюдное место
  rationale: ἔρημος здесь обозначает уединённое, незаселённое место, не обязательно пустыню в географическом смысле.
- source_word: οἱ ὄχλοι
  choice: люди
  rationale: В данном контексте естественное собирательное обозначение множества людей; буквальное «толпы» также возможно, но звучит тяжелее рядом с последующими местоимениями.
- source_word: ἐπεζήτουν αὐτόν
  choice: искали Его
  rationale: Имперфект передаёт продолжавшиеся поиски; русское несовершенное прошедшее сохраняет этот видовой оттенок.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: придя к Нему
  rationale: Передаёт достижение места, где находился Иисус, и естественно связывает действие со следующим сказуемым.
- source_word: κατεῖχον αὐτὸν
  choice: старались удержать Его
  rationale: Сохраняет значение попытки воспрепятствовать уходу, не утверждая непременно физического удерживания.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: чтобы Он не уходил от них
  rationale: Передаёт значение предотвращения, выраженное конструкцией с артиклевым инфинитивом и μή.
