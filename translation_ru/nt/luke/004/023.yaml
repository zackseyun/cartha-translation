  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: ru
  text: 'И Он сказал им: «Несомненно, вы скажете Мне эту пословицу: „Врач, исцели самого себя“. Всё, о чём мы слышали, что произошло в Капернауме[a], сделай и здесь, в Своём родном городе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально предлог εἰς означает «в, внутрь»; однако в данном контексте он употреблён в значении места: «в Капернауме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Конечно
  rationale: Передаёт уверенное ожидание Иисуса, выраженное усилительным наречием в сочетании с будущим временем.
- source_word: ἐρεῖτέ μοι
  choice: вы скажете Мне
  rationale: Сохраняет будущее изъявительное как предсказание и прямо передаёт конструкцию λέγω с дательным.
- source_word: παραβολὴν
  choice: пословицу
  rationale: Здесь речь идёт о кратком общеизвестном изречении, а не о развёрнутой повествовательной притче.
- source_word: Ἰατρέ
  choice: Врач
  rationale: Естественное современное обращение к тому, кто лечит; сохраняет форму и характер пословицы.
- source_word: θεράπευσον σεαυτόν
  choice: исцели самого себя
  rationale: Передаёт прямое повеление и подчёркнутое возвратное местоимение; «исцели» соответствует возвышенному библейскому регистру, не становясь непонятным.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: всё то, о чём мы слышали, что произошло
  rationale: 'Сохраняет значение произошедших событий и опосредованность знания жителей: им об этом сообщили. Формулировка не подменяет γενόμενα глаголом активного действия.'
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: в Капернауме
  rationale: При обозначении произошедшего εἰς употреблено в локативном смысле; по-русски естественно «в Капернауме». Необычная греческая конструкция отмечена в сноске.
- source_word: ποίησον καὶ ὧδε
  choice: Сделай и здесь
  rationale: Сохраняет широкий смысл ποιέω и добавочное значение καί, не конкретизируя действия как чудеса сверх сказанного в тексте.
- source_word: ἐν τῇ πατρίδι σου
  choice: у Себя на родине
  rationale: πατρίς обозначает родное место; контекст указывает на Назарет. Выражение естественно по-русски и не сужает значение исключительно до города.
theological_decisions:
- issue: Характер παραβολή в данном контексте
  choice: пословица
  alternative: притча; изречение
  rationale: «Врач, исцели самого себя» — краткое пословичное изречение, а не повествовательная притча.
- issue: Смысл требования жителей
  choice: Сохранено общее «Сделай», без явного добавления «чудеса»
  alternative: соверши такие же чудеса
  rationale: Контекст подразумевает дела Иисуса, однако греческое ποιέω остаётся широким по значению. Перевод не вводит отсутствующее существительное и сохраняет напряжение между услышанным и требуемым.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Заглавные формы местоимений «Он», «Мне», «Себя» использованы в соответствии с распространённой русской библейской традицией; синтаксис перестроен так, чтобы требование «Сделай и здесь» звучало естественно, при сохранении содержания и последовательности мысли.
