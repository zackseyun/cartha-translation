  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: ru
  text: И они поражались Его учению[a], потому что в Его слове была власть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тому, как Он учил».'
    reason: Греческое διδαχή может обозначать как содержание учения, так и само наставление.
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: поражались
  rationale: Имперфект передаёт продолжающуюся реакцию слушателей, а «поражались» естественно и достаточно сильно выражает изумление.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: Его учению
  rationale: Конструкция обозначает предмет или основание изумления; «учение» охватывает как содержание, так и сам процесс наставления.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину, по которой слушатели поражались.
- source_word: ἐν ἐξουσίᾳ
  choice: со властью
  rationale: Сохраняет образ и краткость греческого выражения, характеризующего силу и авторитет речи Иисуса, не объясняя источник этой власти.
- source_word: ὁ λόγος αὐτοῦ
  choice: слово Его
  rationale: Передаёт λόγος как произнесённую речь Иисуса и сохраняет компактность исходного выражения; местоимение после существительного поддерживает достоинство библейского повествования.
theological_decisions:
- issue: Характер власти в речи Иисуса
  choice: слово Его было со властью
  alternative: Его речь обладала властью; Он говорил властно
  rationale: Перевод прямо сохраняет утверждение текста об авторитетной силе речи Иисуса, но не добавляет отсутствующего в стихе объяснения происхождения этой власти.
translation_notes:
  register: Современный литературный русский с умеренно высоким, достойным регистром. Оборот «слово Его было со властью» намеренно сохраняет необычную выразительность оригинала, не сводя ἐξουσία лишь к манере говорить.
