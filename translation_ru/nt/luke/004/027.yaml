  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: ru
  text: И было много прокажённых в Израиле во времена пророка Елисея, и никто из них не был очищен, кроме Неемана, сирийца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: прокажённых
  rationale: Субстантивированное прилагательное передано традиционным и кратким библейским обозначением людей, страдавших проказой или относимыми к ней кожными заболеваниями; форма естественно сочетается с русской конструкцией «много было».
- source_word: ἐν τῷ Ἰσραὴλ
  choice: в Израиле
  rationale: Предложное сочетание естественно обозначает место или среду; перевод не уточняет без необходимости, идёт ли речь именно о земле или народе.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: во времена пророка Елисея
  rationale: ἐπί с родительным падежом здесь имеет временное значение. «Во времена» ясно и естественно передаёт смысл, сохраняя указание на Елисея как пророка.
- source_word: ἐκαθαρίσθη
  choice: очистился
  rationale: Глагол сохраняет библейский язык очищения от проказы и не сводит происходящее только к медицинскому исцелению.
- source_word: εἰ μὴ
  choice: кроме
  rationale: В данном отрицательном контексте оборот вводит единственное исключение.
- source_word: Ναιμὰν ὁ Σύρος
  choice: Неемана Сирийца
  rationale: Употреблено принятое русское библейское написание имени и сохранено определяющее этническое обозначение, подчёркивающее, что очищен был сириец.
theological_decisions:
- issue: Смысл языка очищения применительно к проказе
  choice: Передать ἐκαθαρίσθη как «очистился»
  alternative: «исцелился» или «был очищен»
  rationale: «Очистился» сохраняет физический и обрядовый оттенки библейского выражения, не добавляя отдельного богословского толкования; русская возвратная форма естественно передаёт греческий пассив результата.
- issue: Риторическая роль происхождения Неемана
  choice: Сохранить обозначение «Сириец» в основном тексте
  alternative: «сириец» как простое неопределённое описание
  rationale: Определяющее приложение в греческом выделяет известного Неемана как чужеземца и сохраняет напряжение между множеством людей в Израиле и единственным очищенным сирийцем.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис близок к греческому, но естественен по-русски; устаревшие обороты и избыточные пояснения исключены.
