revisions:
- from: И много было прокажённых в Израиле во времена пророка Елисея, и никто из них не очистился, кроме Неемана Сирийца.
  to: И было много прокажённых в Израиле во времена пророка Елисея, и никто из них не был очищен, кроме Неемана, сирийца.
  rationale: Исправлен залог при передаче ἐκαθαρίσθη и нормализовано написание этнонима. Запятая перед «сирийца» оформляет этническое обозначение как приложение, сохраняя его выделительную функцию, но не приписывая ему неестественный для русского статус титула.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:46:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: πολλοὶ λεπροί, временное ἐπὶ Ἐλισαίου, исключение εἰ μή и этническое обозначение Неемана сохранены. Однако ἐκαθαρίσθη — аористный пассив («был очищен»), тогда как «очистился» формально возвратное и может восприниматься как действие самого человека; пассивная форма точнее передаёт греческий текст.'
  naturalness: «И было много прокажённых в Израиле во времена пророка Елисея» — естественная для современного литературного русского фраза с уместным библейским достоинством. Пассив «не был очищен» здесь ясен и не звучит неестественно.
  terminology: '«Прокажённые» и «очищен» удачно сохраняют библейскую лексику без сведения смысла к одному медицинскому исцелению. Имя «Нееман» соответствует традиционной русской библейской передаче. Этноним следует писать со строчной буквы: «сириец».'
  issues:
  - severity: medium
    issue: Форма «никто из них не очистился» вместо пассивного «не был очищен».
    rationale: Греческое ἐκαθαρίσθη является пассивной формой. Русское «очистился» возможно в религиозном стиле, но создаёт менее точное возвратное значение; «не был очищен» сохраняет залог и смысл очищения.
  - severity: low
    issue: «Сирийца» написано с прописной буквы.
    rationale: В современном русском названия национальностей и этнические обозначения пишутся со строчной буквы. Греческий артикль не требует русской прописной буквы.
  revised_text: И было много прокажённых в Израиле во времена пророка Елисея, и никто из них не был очищен, кроме Неемана, сирийца.
