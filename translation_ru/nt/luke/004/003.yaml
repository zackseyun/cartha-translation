source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: ru
  text: 'Тогда дьявол сказал Ему[a]: «Если Ты Сын Божий, скажи этому камню, чтобы он стал хлебом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поскольку Ты Сын Божий». Греческое условие может подразумевать, что исходная посылка принимается ради самого испытания, однако в основном тексте сохранена условная форма.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Тогда
  rationale: Мягкая связка δέ здесь передаёт развитие повествования; «тогда» естественно связывает реплику с предшествующим эпизодом.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: В данном контексте это общепринятое личное обозначение противника; этимологические варианты вроде «клеветник» звучали бы неестественно и меняли бы функцию слова.
- source_word: Εἰ
  choice: Если
  rationale: Условная частица прямо передана словом «если», чтобы сохранить форму и напряжение испытания, не истолковывая условие как заранее утверждённый факт.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Сын Божий
  rationale: В этом христологическом контексте безартиклевое именное сказуемое имеет качественно-определённый смысл; традиционное и ясное русское наименование «Сын Божий» не предполагает неопределённого «один из сынов».
- source_word: εἰπὲ
  choice: вели
  rationale: Императив λέγω обращён к Иисусу и вводит требование, направленное на камень. Русское «вели этому камню» естественно выражает речевой акт; это несколько сильнее буквального «скажи», но конструкция «скажи этому камню стать» в современном русском менее естественна.
- source_word: τῷ λίθῳ τούτῳ
  choice: этому камню
  rationale: λίθος обозначает камень; указательное местоимение сохранено.
- source_word: ἵνα γένηται
  choice: стать
  rationale: После глагола речи ἵνα с сослагательным наклонением передаёт содержание веления; русский инфинитив естественно и точно выражает этот смысл.
- source_word: ἄρτος
  choice: хлебом
  rationale: ἄρτος здесь означает хлеб; варианты «пищей» и «буханкой» соответственно слишком широк и чрезмерно конкретен.
theological_decisions:
- issue: Смысл условия εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Если Ты Сын Божий
  alternative: Поскольку Ты Сын Божий
  rationale: Основной текст сохраняет грамматическую форму условия и напряжение сцены искушения, не отрицая сыновство Иисуса и не превращая условие в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимения, относящиеся к Иисусу в прямом обращении и повествовании, даны с прописной буквы согласно распространённой русской библейской издательской практике.
