- from: 'Но Он сказал им: «Мне нужно и другим городам возвещать благую весть о Царстве Божьем, потому что для этого Я был послан».'
  to: 'Но Он сказал им: «Я должен возвещать благую весть о Царстве Божьем и в других городах, потому что для этого Я был послан».'
  rationale: Исправлено только русское управление при «возвещать» и выбран более прямой эквивалент δεῖ. Добавочное καί сохранено союзом «и», ἑτέραις πόλεσιν — выражением «в других городах», а цель ἐπὶ τοῦτο и безлично названный отправитель в ἀπεστάλην остались без интерпретирующего расширения.
