  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: ru
  text: 'Но Он сказал им: «Я должен возвещать благую весть о Царстве Божьем и в других городах, потому что для этого Я был послан».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Но Он сказал им
  rationale: δέ передаёт мягкое противопоставление желанию людей удержать Иисуса; формулировка естественна для русского повествования.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: и другим городам
  rationale: καί имеет добавочное значение, а ἕτερος указывает на города помимо нынешнего; дательный падеж естественно сочетается с глаголом «возвещать».
- source_word: εὐαγγελίσασθαί
  choice: возвещать благую весть
  rationale: Передаёт значение объявления доброй вести, сохраняя глагольную силу выражения и не сводя его к узкому церковному термину.
- source_word: με δεῖ
  choice: Мне нужно
  rationale: Передаёт сильную необходимость, в контексте Луки связанную с миссией, и звучит естественно по-русски.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: о Царстве Божьем
  rationale: Устойчиво и прозрачно передаёт центральное для Луки выражение, не уточняя сверх текста, имеется ли в виду царствование или царство как сфера.
- source_word: ἐπὶ τοῦτο
  choice: для этого
  rationale: Кратко и естественно выражает цель, не добавляя отсутствующих в греческом тексте пояснений.
- source_word: ἀπεστάλην
  choice: Я был послан
  rationale: Сохраняет пассивную форму и миссионное значение глагола, не называя прямо подразумеваемого отправителя.
theological_decisions:
- issue: Характер необходимости миссии Иисуса
  choice: «Мне нужно» сохраняет сильную необходимость, не поясняя её как «Божью волю» прямо в тексте.
  alternative: «Я должен» или «Мне надлежит».
  rationale: δεῖ у Луки нередко выражает божественную необходимость, однако сам стих не раскрывает её формулой; перевод сохраняет эту богословскую напряжённость.
- issue: Кто послал Иисуса
  choice: Сохранён пассив «Я был послан» без указания отправителя.
  alternative: «Бог послал Меня».
  rationale: Форма ἀπεστάλην подразумевает пославшего, вероятнее всего Бога, но не называет Его; явное добавление разрешило бы оставленную текстом имплицитность.
- issue: Значение «Царства Божьего»
  choice: Традиционное ёмкое выражение «Царство Божье».
  alternative: «Божье царствование».
  rationale: Греческое βασιλεία допускает оттенки царской власти, правления и сферы царства; стандартное русское выражение сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Синтаксис близок к греческому смысловому ходу, но естественен по-русски. Местоимения, относящиеся к Иисусу, даны с прописной буквы согласно распространённой русской библейской издательской традиции.
