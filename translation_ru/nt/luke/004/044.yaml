lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: проповедовал
  rationale: Перифрастический имперфект передаёт продолжавшееся или повторявшееся действие в прошлом. Русский несовершенный вид естественно выражает эту длительность без избыточного уточнения «продолжал».
- source_word: κηρύσσων
  choice: проповедовал
  rationale: Глагол означает публично возвещать; в контексте служения в синагогах «проповедовал» — естественный современный эквивалент, сохраняющий смысл публичного провозглашения.
- source_word: εἰς τὰς συναγωγάς
  choice: в синагогах
  rationale: Хотя εἰς часто указывает направление, здесь оборот обозначает место или сферу проповеди; по-русски естественно «в синагогах».
- source_word: συναγωγάς
  choice: синагогах
  rationale: В данном контексте речь идёт об иудейских синагогах как местах собрания; это общепринятый и прозрачный русский термин.
- source_word: Ἰουδαίας
  choice: Иудеи
  rationale: Основной текст SBLGNT читает Ἰουδαίας, то есть «Иудеи». Возможное напряжение с галилейским контекстом не устраняется переводом, а отмечается в сноске.
theological_decisions:
- issue: Географическое указание τῆς Ἰουδαίας на фоне окружающего галилейского контекста
  choice: Иудеи
  alternative: Галилеи; либо понимание Иудеи в широком смысле как иудейской земли
  rationale: Перевод следует чтению SBLGNT и сохраняет текстовое и повествовательное напряжение, не гармонизируя географическое название с контекстом. Вариант «Галилеи» вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная формулировка. Заглавная буква в местоимении «Он» употреблена как традиционный знак почтения к Иисусу, не меняющий смысла исходного текста.
