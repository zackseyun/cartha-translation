  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: ru
  text: 'И Он сказал: «Истинно говорю вам: ни один пророк не бывает принят у себя на родине[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своём родном городе», «в родных местах». Греческое слово πατρίς может означать родной город, родную местность или родину; в данном контексте речь идёт о Назарете.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: И Он сказал
  rationale: δέ служит мягкой повествовательной связкой; союз «и» естественно продолжает речь, не усиливая противопоставление.
- source_word: Ἀμὴν
  choice: Истинно
  rationale: В речениях Иисуса ἀμήν вводит торжественное и достоверное утверждение; «истинно» сохраняет эту силу и соответствует достоинству библейской речи.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямая передача устойчивой формулы с обращением к слушателям; по-русски звучит естественно в сочетании «истинно говорю вам».
- source_word: οὐδεὶς προφήτης
  choice: ни один пророк
  rationale: Передаёт усиленное отрицание ясно и естественно; конструкция согласуется с последующим отрицательным сказуемым.
- source_word: δεκτός ἐστιν
  choice: не бывает принят
  rationale: δεκτός обозначает благосклонное принятие. Настоящее время в общем изречении передано формой «не бывает принят», выражающей закономерность, а не только единичный случай.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: у себя на родине
  rationale: πατρίς может обозначать родной город, родную местность или страну. Выражение «у себя на родине» сохраняет широту греческого слова, а контекст Назарета позволяет понимать его локально.
