id: LUK.4.34
reference: Luke 4:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: ru
  text: '«А![a] Что тебе до нас,[b] Иисус из Назарета?[c] Ты пришёл погубить нас?[d] Я знаю, кто ты: Святой Божий».[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ах!» Это междометие выражает внезапную тревогу или протест; по смыслу его можно передать: «Оставь нас в покое!»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Что нам и тебе?» Это оборот, выражающий отчуждение или враждебный протест.'
    reason: cultural_note
  - marker: c
    text: 'Или: «Иисус Назарянин».'
    reason: lexical_alternative
  - marker: d
    text: 'Кого именно обозначает «нас», в греческом тексте не уточняется: дух может говорить от лица иных злых духов либо включать в это «нас» себя и одержимого человека.'
    reason: alternative_reading
  - marker: e
    text: 'Возможный вариант: «Божий Святой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: А!
  rationale: Краткое междометие передаёт внезапный возглас тревоги или протеста, не разворачивая его в более толковательное «Оставь нас в покое!».
- source_word: τί ἡμῖν καὶ σοί
  choice: Что тебе до нас
  rationale: Естественная современная русская идиома выражает отчуждение и протест, соответствуя буквальному семитизированному обороту «что нам и тебе?».
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Иисус из Назарета
  rationale: Форма обращения указывает на связь Иисуса с Назаретом; выбранный вариант ясен и естественен по-русски, тогда как «Назарянин» также возможен.
- source_word: ἦλθες ἀπολέσαι
  choice: Ты пришёл погубить
  rationale: Аорист передан прошедшим временем с актуальным результатом прибытия; «погубить» сохраняет сильное значение ἀπόλλυμι и звучит уместно в данном контексте.
- source_word: ἡμᾶς
  choice: нас
  rationale: Множественное число сохранено без уточнения, кого именно включает говорящий, поскольку греческий текст этого не объясняет.
- source_word: οἶδά σε τίς εἶ
  choice: Я знаю, кто ты
  rationale: Естественно передаёт узнавание личности Иисуса без смыслового добавления.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Святой Божий
  rationale: Сохраняет краткую и весомую христологическую формулу, не раскрывая её богословский смысл сверх сказанного в стихе.
theological_decisions:
- issue: Множественное местоимение ἡμᾶς в речи нечистого духа
  choice: Сохранено «нас» без пояснения референта в основном тексте.
  alternative: Уточнить как «нас, бесов» либо понимать как духа вместе с одержимым человеком.
  rationale: Греческий текст не определяет состав множественного числа; перевод не должен устранять эту неоднозначность.
- issue: Титул ὁ ἅγιος τοῦ θεοῦ
  choice: Святой Божий
  alternative: Святой Бога; Божий Святой
  rationale: Выбран традиционно понятный и формально близкий русский титул без добавления мессианского или догматического толкования.
translation_notes:
  register: Современный литературный русский язык; реплика звучит резко и непосредственно. Сохранены краткость, напряжение и неоднозначность оригинала. Местоимения обращения к Иисусу даны со строчной буквы по современной общей орфографической норме.
