lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: Устойчивое русское введение цитаты из Писания; передаёт сохраняющую силу перфекта без неестественной буквальности.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно передаёт пояснительно-обосновывающую связь с предшествующими словами искусителя.
- source_word: ὅτι
  choice: ':'
  rationale: В русском после формулы «написано» содержание цитаты естественно вводится двоеточием.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: Своим ангелам
  rationale: Возвратное притяжательное местоимение ясно относит ангелов к подразумеваемому Богу и соответствует нормам русского языка.
- source_word: ἐντελεῖται
  choice: Он повелит
  rationale: Будущее время и значение распоряжения или повеления переданы прямо и литературно.
- source_word: περὶ σοῦ
  choice: о Тебе
  rationale: Формально передаёт περί с родительным как «о, относительно» и не сужает значение до «ради Тебя».
- source_word: τοῦ διαφυλάξαι σε
  choice: чтобы они оберегали Тебя
  rationale: Целевая связь артиклевого инфинитива выражена естественным русским придаточным; подразумеваемый субъект — ангелы. «Оберегали» сохраняет защитный смысл διαφυλάσσω.
theological_decisions:
- issue: Передача цитаты из Псалма в речи искусителя
  choice: Переводить только приведённые Лукой слова, не дополняя их продолжением псалма
  alternative: Восстановить полный или привычный богослужебный текст Псалма 90:11
  rationale: Текст должен отражать именно форму цитаты у Луки и не вносить отсутствующие в греческом оригинале слова.
- issue: Связь περὶ σοῦ и τοῦ διαφυλάξαι σε
  choice: «о Тебе, чтобы они оберегали Тебя»
  alternative: «оберегать Тебя» или «ради Тебя»
  rationale: Так сохраняются и отдельное значение «о Тебе», и целевая функция инфинитива, без искусственного устранения синтаксического напряжения.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизмов. Прописные местоимения в обращении к Иисусу использованы как принятая в русском библейском стиле графическая форма; они не устраняют того, что эти слова произносит искуситель.
