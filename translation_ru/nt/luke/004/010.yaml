  text: 'Ведь написано: «Он повелит Своим ангелам оберегать Тебя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «охранять Тебя»; также возможно: «сберегать Тебя».'
