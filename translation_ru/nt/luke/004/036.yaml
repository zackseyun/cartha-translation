  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: ru
  text: 'Всех охватило изумление, и они говорили между собой: «Что это за слово[a], что Он с властью и силой повелевает нечистым духам, и они выходят?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что это за весть?» Греческое слово λόγος может означать «слово», «весть» или «дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: изумление
  rationale: Передаёт сильное потрясение и удивление естественным современным русским словом.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: всех охватило
  rationale: Естественно передаёт греческий оборот о состоянии, постигшем всех присутствующих.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: они говорили друг другу
  rationale: Сохраняет взаимность и продолженный характер разговора без добавления идеи формального обсуждения.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Что это за слово?
  rationale: Русский оборот естественно выражает удивление характером и действенностью сказанного, сохраняя многозначность λόγος.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: с властью и силой
  rationale: Сохраняет порядок и различие между правом повелевать и действенной силой.
- source_word: ἐπιτάσσει
  choice: повелевает
  rationale: Передаёт властный приказ и сохраняет торжественный, но понятный регистр.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: нечистым духам
  rationale: Точно сохраняет евангельскую терминологию и фон ритуальной нечистоты.
- source_word: ἐξέρχονται
  choice: они выходят
  rationale: Прямо и естественно описывает уход духов из человека.
theological_decisions:
- issue: Обозначение демонических существ в рассказе об изгнании
  choice: нечистые духи
  alternative: злые духи; бесы
  rationale: Выбор следует греческому выражению, не сводит повествование к психологической метафоре и не заменяет авторскую категорию более узким толкованием.
- issue: Связь вопроса с последующим объяснением через ὅτι
  choice: разделение на вопрос и восклицательное пояснение
  alternative: 'единое предложение: «Что это за слово, что Он…?»'
  rationale: Так фраза звучит естественно по-русски, а пояснительная функция ὅτι передаётся контекстом без устранения смысловой связи.
translation_notes:
  register: Современный литературный русский язык; речь ясная и выразительная, без архаизмов. Сохранены повтор местоимения «они» и различие между «властью» и «силой».
