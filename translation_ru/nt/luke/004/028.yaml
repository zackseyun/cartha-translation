  text: καὶ ἐπλήσθησαν πάντες θυμοῦ ἐν τῇ συναγωγῇ ἀκούοντες ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: ru
  text: Услышав это, все находившиеся в синагоге исполнились гнева.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришли в ярость». Греческое слово θυμός может обозначать сильный гнев или ярость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: исполнились
  rationale: Аорист пассивного залога от πίμπλημι передаёт состояние наполненности; «исполнились» естественно сочетается с «гнева» и сохраняет образ исходного текста.
- source_word: πάντες
  choice: все находившиеся
  rationale: πάντες охватывает всех присутствовавших; добавление «находившиеся» естественно связывает «все» с указанием места, не сужая круг лиц сверх контекста.
- source_word: θυμοῦ
  choice: гнева
  rationale: θυμός обозначает сильный гнев, вплоть до ярости. «Гнев» — dignified and natural modern Russian equivalent; более интенсивная возможность отражена в сноске.
- source_word: ἐν τῇ συναγωγῇ
  choice: в синагоге
  rationale: Прямо передаёт местонахождение присутствующих.
- source_word: ἀκούοντες
  choice: услышав
  rationale: Причастие обозначает сопутствующее обстоятельство и повод для реакции. Деепричастие «услышав» естественно по-русски передаёт временно-причинную связь.
- source_word: ταῦτα
  choice: это
  rationale: Русское собирательное «это» естественно отсылает ко всему сказанному Иисусом и не вводит отсутствующее в греческом существительное «слова».
