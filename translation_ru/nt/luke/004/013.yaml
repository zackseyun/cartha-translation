id: LUK.4.13
reference: Luke 4:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: ru
  text: И, завершив все искушения[a], дьявол отошёл от Него до благоприятного времени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все испытания». Греческое слово может означать и «искушение», и «испытание», но здесь из-за роли дьявола более естественно «искушение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: завершив
  rationale: Аористное причастие относится к дьяволу и обозначает действие, предшествующее основному глаголу; деепричастие естественно и точно передаёт эту связь.
- source_word: πάντα πειρασμόν
  choice: все искушения
  rationale: Сочетание с πᾶς охватывает всю совокупность описанных искушений. Русское множественное число звучит естественно и сохраняет смысл полноты.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: В повествовании это личный сверхъестественный противник; выбран обычный и контекстуально точный русский эквивалент.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: отошёл от Него
  rationale: Передаёт удаление или отступление от Иисуса и сохраняет несколько более высокий повествовательный регистр, чем «оставил Его».
- source_word: ἄχρι καιροῦ
  choice: до благоприятного времени
  rationale: καιρός обозначает не просто момент по хронологии, а подходящее, удобное время; формулировка передаёт временный и стратегический характер ухода.
theological_decisions:
- issue: Смысл πειρασμός применительно к пережитому Иисусом
  choice: искушения
  alternative: испытания
  rationale: Слово может означать как искушение, так и испытание. Поскольку действующим лицом является дьявол и он побуждает Иисуса уклониться от верности Богу, в основном тексте естественнее «искушения»; подлинная смысловая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Заглавная буква в местоимении «Него» следует принятой русской библейской традиции и ясно указывает на Иисуса.
