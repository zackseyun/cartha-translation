lexical_decisions:
- source_word: σὺ
  choice: ты
  rationale: Явно выраженное местоимение сохраняет лёгкое смысловое ударение греческого текста и естественно звучит в прямом обращении.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод или следствие из предложения, высказанного в предыдущем стихе.
- source_word: ἐὰν
  choice: если
  rationale: Естественно передаёт условную конструкцию с сослагательным наклонением.
- source_word: προσκυνήσῃς
  choice: поклонишься
  rationale: Русский глагол может обозначать как телесное преклонение, так и религиозное поклонение; контекст следующего стиха выявляет религиозную тяжесть требования, не устраняя лексической многозначности.
- source_word: ἐνώπιον ἐμοῦ
  choice: мне
  rationale: В сочетании с глаголом «поклониться» дательный падеж естественно выражает того, кому воздаётся поклонение; буквальное «предо мной» в современном русском здесь звучало бы менее естественно.
- source_word: ἔσται σοῦ
  choice: будет твоим
  rationale: Естественная русская притяжательная конструкция точно передаёт будущее время и принадлежность.
- source_word: πᾶσα
  choice: всё это
  rationale: Форма отсылает к совокупности предложенного в предыдущем стихе; «всё это» ясно выражает эллиптическую отсылку, не добавляя нового существительного.
theological_decisions:
- issue: Передавать ли προσκυνέω как нейтральный телесный жест или как религиозное поклонение
  choice: поклонишься мне
  alternative: падёшь ниц предо мной
  rationale: В контексте искушения требуется почитание, подобающее одному Богу, что подтверждает ответ Иисуса в следующем стихе. При этом слово «поклонишься» сохраняет возможный оттенок физического преклонения.
translation_notes:
