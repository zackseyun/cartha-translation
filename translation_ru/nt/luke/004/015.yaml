  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: ru
  text: И Он учил в их синагогах, и все прославляли Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и все хвалили Его»; или: «и все почитали Его». Греческое слово может обозначать публичную хвалу или оказание чести; перевод «прославляли» сохраняет его связь с понятием славы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет связь с предшествующим повествованием, не добавляя явно не выраженного временного оттенка.
- source_word: αὐτὸς
  choice: Он
  rationale: Явное греческое местоимение обозначает Иисуса; прописная буква соответствует принятому в русском библейском стиле уважительному написанию.
- source_word: ἐδίδασκεν
  choice: учил
  rationale: Русская форма несовершенного вида передаёт продолжительное или обычное действие греческого имперфекта естественнее, чем громоздкое «был учащим».
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: в их синагогах
  rationale: Естественная локативная конструкция, сохраняющая притяжательное местоимение; по контексту речь идёт о синагогах Галилеи.
- source_word: δοξαζόμενος
  choice: и все прославляли Его
  rationale: Активная русская конструкция естественно передаёт пассивное причастие с указанным деятелем; «прославляли» сохраняет связь δοξάζω с языком славы, а сноска отмечает контекстуальные варианты «хвалили» и «почитали».
- source_word: ὑπὸ πάντων
  choice: все
  rationale: При преобразовании пассивной конструкции в активную греческое обозначение деятеля становится подлежащим; «все» кратко передаёт широкое всеобщее одобрение.
theological_decisions:
- issue: Значение δοξαζόμενος применительно к Иисусу
  choice: все прославляли Его
  alternative: все хвалили Его; все почитали Его
  rationale: Глагол может обозначать публичную хвалу или почёт. «Прославляли» сохраняет более сильную лексическую связь со славой, не утверждая сверх контекста особого богословского смысла; возможные более контекстуальные значения вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несовершенный вид «учил» передаёт длительность или повторяемость действия. Пассивное причастие перестроено в естественную русскую активную конструкцию без изменения участников действия.
