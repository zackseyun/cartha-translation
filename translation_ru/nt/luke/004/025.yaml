source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: ru
  text: 'Но истинно говорю вам: много вдов было в Израиле во дни Илии, когда небо было закрыто на три года и шесть месяцев и по всей земле настал великий голод.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: истинно
  rationale: Наречное выражение передано естественно и торжественно; оно подчёркивает достоверность последующего утверждения.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: небо замкнулось
  rationale: Сохранён образ закрытого неба, то есть прекращения дождя, без добавления отсутствующего в тексте пояснения.
- source_word: λιμὸς μέγας
  choice: великий голод
  rationale: Прямо сохраняет интенсивность греческого выражения и соответствует библейскому повествовательному регистру.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: по всей земле
  rationale: 'Сохраняет допустимую неоднозначность γῆ: речь может идти о всей упомянутой земле или стране; перевод не расширяет её до всего мира.'
theological_decisions:
- issue: Причина закрытия неба
  choice: 'Не указывать действующее лицо: «небо замкнулось»'
  alternative: «Бог заключил небо»
  rationale: Греческий текст использует пассивную форму и не называет действующее лицо; перевод сохраняет это умолчание.
- issue: Масштаб голода
  choice: «по всей земле»
  alternative: «по всей стране»
  rationale: Выбор сохраняет лексическую широту γῆ и не снимает контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Порядок фразы слегка перестроен ради естественности, при этом противопоставление δέ, заверение Иисуса и все фактические детали сохранены.
