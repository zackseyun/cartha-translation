    issue: Возвратный залог в выражении «небо замкнулось»
    rationale: ἐκλείσθη — аорист страдательного залога. «Было закрыто» сохраняет неназванного деятеля и не создаёт оттенка самопроизвольного действия.
  revised_text: 'Но истинно говорю вам: много вдов было в Израиле во дни Илии, когда небо было закрыто на три года и шесть месяцев и по всей земле настал великий голод.'
