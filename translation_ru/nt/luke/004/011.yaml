lexical_decisions:
- source_word: καὶ ὅτι
  choice: 'и:'
  rationale: καὶ продолжает цитату из предыдущего стиха, а ὅτι вводит её содержание; двоеточие естественно передаёт эту функцию по-русски.
- source_word: Ἐπὶ χειρῶν
  choice: на руках
  rationale: Естественное русское выражение, сохраняющее образ того, как ангелы несут человека на руках.
- source_word: ἀροῦσίν σε
  choice: они понесут Тебя
  rationale: Будущая форма αἴρω здесь означает поднять и нести; «понесут» ясно и современно передаёт оба оттенка в данном контексте.
- source_word: μήποτε
  choice: чтобы ... не
  rationale: Передаёт предупредительно-предохранительный смысл отрицательной придаточной конструкции естественным современным русским оборотом.
- source_word: προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: Ты не ударился ногой о камень
  rationale: Сохраняет конкретный образ удара ноги о камень, единственное число и обычное русское управление.
theological_decisions:
- issue: Передача образа защиты в цитате из Псалма
  choice: «понесут Тебя на руках»
  alternative: «подхватят Тебя на руки»
  rationale: Выбранный вариант ближе к форме греческого текста и сохраняет образ длительного несения, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Местоимения, относящиеся к Иисусу, написаны с прописной буквы. Кавычки показывают продолжение прямой цитаты; двоеточие передаёт вводное ὅτι.
