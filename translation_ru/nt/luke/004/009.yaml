reference: Luke 4:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: ru
  text: 'Затем он привёл Его в Иерусалим, поставил на выступе храмового комплекса[a][b] и сказал Ему: «Если Ты Сын Божий[c], бросься отсюда вниз».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на крыле храма». Греческое слово обозначает выступающую крайнюю часть сооружения; здесь — выступ или высокую точку храмового комплекса.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово ἱερόν означает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «Поскольку Ты Сын Божий». Греческая условная конструкция допускает такой смысл, однако перевод «если» сохраняет характер вызова в словах искусителя.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν δὲ
  choice: Затем он привёл
  rationale: δέ обозначает переход к следующему эпизоду, поэтому естественно передаётся словом «затем»; ἄγω здесь означает привести или повести к указанному месту.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: ἔστησεν
  choice: поставил
  rationale: 'Аорист ἵστημι употреблён каузативно: «поставил», «поместил». «Поставил» кратко и точно передаёт действие.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: на выступе
  rationale: πτερύγιον буквально связано с «крылом», но в архитектурном контексте обозначает выступающую крайнюю часть сооружения. «Выступ» понятен современному читателю и не утверждает без достаточных оснований, что это была самая высокая точка.
- source_word: τοῦ ἱεροῦ
  choice: храмового комплекса
  rationale: ἱερόν обозначает весь храмовый комплекс, в отличие от ναός — внутреннего святилища. В основном тексте значение выражено явно, а примечание поясняет различие.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Если Ты Сын Божий
  rationale: «Если» сохраняет условную форму и провокационный характер слов искусителя. «Сын Божий» — естественная и устоявшаяся русская передача титула.
- source_word: βάλε σεαυτὸν
  choice: бросься
  rationale: Повелительная форма βάλε с возвратным местоимением означает «брось себя»; русское «бросься» передаёт это естественно и энергично.
- source_word: ἐντεῦθεν κάτω
  choice: отсюда вниз
  rationale: Сочетание прямо указывает на движение вниз с того места, где находится Иисус.
theological_decisions:
- issue: Характер условия в словах искусителя о личности Иисуса
  choice: Если Ты Сын Божий
  alternative: Поскольку Ты Сын Божий
  rationale: εἰ с изъявительным наклонением иногда может приближаться по смыслу к «поскольку», однако «если» лучше сохраняет вызов и напряжение сцены, не подразумевая, что рассказчик сомневается в личности Иисуса.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным стилем. Прописные местоимения, относящиеся к Иисусу, соответствуют принятой русской библейской издательской традиции; речь искусителя остаётся прямой и напряжённой.
