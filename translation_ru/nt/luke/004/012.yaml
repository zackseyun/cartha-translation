base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: ru
  text: 'Иисус ответил ему: «Сказано[a]: „Не испытывай Господа[b], Бога твоего“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сказано». В традиционных переводах здесь нередко стоит: «Написано».'
    reason: alternative_reading
  - marker: b
    text: Цитата из Второзакония 6:16; в еврейском тексте там стоит Божье имя YHWH (Яхве), традиционно передаваемое как «ГОСПОДЬ».
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Сочетание причастия с личной формой глагола — обычный семитизированный оборот со значением «ответил»; естественный русский перевод не требует удвоения «отвечая, сказал».
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж местоимения указывает на собеседника Иисуса — дьявола в ближайшем контексте.
- source_word: ὅτι
  choice: не выражено отдельно
  rationale: После русского «ответил ему» содержание ответа естественно вводится двоеточием; отдельное «что» не требуется.
- source_word: Εἴρηται
  choice: Сказано
  rationale: Перфект пассивного залога от λέγω означает «сказано» / «было сказано» и здесь вводит авторитетную цитату Писания. Перевод сохраняет отличие от формулы «написано».
- source_word: Οὐκ ἐκπειράσεις
  choice: Не испытывай
  rationale: ἐκπειράζω означает подвергать испытанию, проверять. «Испытывай» ясно передаёт смысл и не создаёт ложного впечатления, будто речь идёт о склонении Бога ко греху.
- source_word: κύριον τὸν θεόν σου
  choice: Господа, Бога твоего
  rationale: Приложение сохраняется с запятой; порядок «Бога твоего» поддерживает торжественный регистр библейской цитаты, оставаясь понятным современному читателю.
theological_decisions:
- issue: Формула цитирования Писания (Εἴρηται)
  choice: Сказано
  alternative: Написано; Было сказано
  rationale: В греческом стоит форма от λέγω, а не γράφω. Основной текст следует непосредственно греческой формулировке, не ослабляя авторитет цитаты.
- issue: Передача κύριος в цитате из Второзакония 6:16
  choice: Господь
  alternative: Яхве
  rationale: Непосредственный греческий источник содержит κύριος. Примечание сообщает, что в еврейском тексте Второзакония стоит священное имя YHWH, не подменяя греческую форму в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно торжественным звучанием внутри ветхозаветной цитаты. Кавычки второго уровня отделяют цитату Писания от прямой речи Иисуса. Маркеры примечаний поставлены после всего стиха и соотносятся соответственно с формулой «Сказано» и именованием «Господь».
