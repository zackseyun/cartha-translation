lexical_decisions:
- source_word: διάβολος
  choice: дьявол
  rationale: В повествовании об искушении это устойчивое личное обозначение сатаны; перевод «дьявол» передаёт референта естественнее, чем этимологическое «клеветник».
- source_word: Σοὶ δώσω
  choice: Я дам Тебе
  rationale: Фронтированное Σοί выделяет адресата. Русский порядок слов остаётся естественным, а местоимение непосредственно после глагола сохраняет смысловой акцент без искусственной инверсии.
- source_word: ἐξουσίαν ταύτην ἅπασαν
  choice: всю эту власть
  rationale: ἐξουσία здесь означает власть или право распоряжаться и править, а сочетание ταύτην ἅπασαν подчёркивает её полноту.
- source_word: τὴν δόξαν αὐτῶν
  choice: их славу
  rationale: δόξα может обозначать славу, блеск или великолепие показанных царств. «Слава» сохраняет широкий смысл и библейскую лексическую связь; местоимение «их» относится к царствам из предыдущего стиха.
- source_word: ἐμοὶ παραδέδοται
  choice: она передана мне
  rationale: Перфект пассива указывает на совершившуюся передачу с сохраняющимся результатом. Формулировка не утверждает законность притязания дьявола, а лишь точно передаёт его слова.
- source_word: ᾧ ἂν θέλω δίδωμι αὐτήν
  choice: я даю её кому хочу
  rationale: Оборот выражает заявленную свободу распоряжения. Местоимение «её» сохраняет грамматически возможную соотнесённость с существительными женского рода и не устраняет неоднозначность насильно.
theological_decisions:
- issue: Следует ли переводом подтверждать или ослаблять притязание дьявола на власть над царствами
  choice: Передать слова прямо как утверждение самого дьявола, не добавляя редакционных оговорок
  alternative: Добавить дистанцирующее «как он утверждал», «якобы» или иным образом поставить притязание под сомнение
  rationale: Греческий текст даёт прямую речь и ясно называет говорящего дьяволом. Перевод не должен ни подтверждать его притязание как объективный факт, ни заранее опровергать его добавленными словами.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Маркер сноски поставлен непосредственно после слова «славу», к которому относится лексическая альтернатива.
