  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: ru
  text: 'И дьявол сказал Ему: «Я дам Тебе всю эту власть и их славу[a], потому что она передана мне, и я даю её кому хочу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их великолепие». Греческое слово здесь может означать славу, блеск или великолепие.'
