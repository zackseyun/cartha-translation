lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Когда заходило солнце
  rationale: Генитив абсолютный с причастием настоящего времени обозначает обстоятельство времени и одновременность действия; несовершенный вид «заходило» сохраняет процессуальность.
- source_word: ἅπαντες ὅσοι
  choice: все, у кого
  rationale: Передаёт всеохватность сочетания и естественно связывает людей, приносивших больных, с теми, кто находился на их попечении.
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: у кого были больные, страдавшие разными недугами
  rationale: Оборот с ἔχω передан без неоправданного уточнения родства или принадлежности к дому; причастие и дательный причины/сферы выражены ясной современной конструкцией.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: приводили их к Нему
  rationale: «Приводили» естественно передаёт ἄγω применительно к людям и сохраняет повторяющийся характер имперфекта.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: на каждого из них
  rationale: Сохраняет усиленную распределительность греческого выражения и подчёркивает индивидуальное внимание.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: возлагал руки
  rationale: Устойчивое и понятное русское соответствие конкретному жесту; множественное число «руки» сохранено.
- source_word: ἐθεράπευεν
  choice: исцелял
  rationale: Имперфект передан несовершенным видом, отражающим последовательное, повторявшееся действие по отношению к каждому больному.
theological_decisions:
- issue: Возложение рук
  choice: возлагал руки на каждого из них
  alternative: положив руки на каждого из них
  rationale: Перевод сохраняет описанный телесный жест и личное внимание Иисуса, не приписывая ему более позднего обрядового или конфессионального значения.
translation_notes:
