revisions:
- from: Когда заходило солнце[a], все, у кого были больные, страдавшие разными недугами, приводили их к Нему. Он же возлагал руки на каждого из них и исцелял их.
  to: Когда заходило солнце[a], все, у кого были люди, страдавшие различными болезнями, привели их к Нему. Он же, возлагая руки на каждого из них, исцелял их.
  rationale: Правка согласует русский перевод с аористом ἤγαγον, имперфектом ἐθεράπευεν и причастием настоящего времени ἐπιτιθείς, одновременно устраняя небольшую стилистическую тяжесть. Распределительное «на каждого из них» и неоднозначность того, кем именно больные приходились приносившим, сохранены.
