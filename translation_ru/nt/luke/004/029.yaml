source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: ru
  text: Поднявшись, они выгнали Его из города и повели к краю горы, на которой был построен их город, чтобы сбросить Его вниз.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы низвергнуть Его». Греческий глагол означает сбросить или низвергнуть с высоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: Поднявшись
  rationale: Аористное причастие передаёт начало решительного действия толпы; «поднявшись» естественно и сохраняет физический смысл.
- source_word: ἐξέβαλον
  choice: выгнали
  rationale: Глагол обозначает насильственное удаление; «выгнали» ясно передаёт враждебность без лишней конфессиональной окраски.
- source_word: πόλεως
  choice: города
  rationale: Обычное русское соответствие πόλις; в русском «город» применим и к небольшому населённому пункту и не требует контекстуального понижения до «поселения».
- source_word: ἤγαγον
  choice: повели
  rationale: Сохраняет широкий смысл ἄγω и не усиливает текст до «потащили», хотя контекст явно враждебный.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: к краю горы
  rationale: ὀφρύς буквально «бровь», а применительно к рельефу — край или выступ; «край горы» понятно современному читателю и не добавляет прямо не названного обрыва.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: на которой был построен их город
  rationale: Передаёт пассивный плюсквамперфект и сохраняет αὐτῶν как указание на принадлежность города местным жителям.
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: чтобы сбросить Его вниз
  rationale: Инфинитивная конструкция выражает намерение или предполагаемый результат; русский оборот естественно передаёт цель. «Вниз» отражает заложенное в κατακρημνίζω низвержение с высоты, не вводя слова «обрыв» в основной текст.
theological_decisions:
- issue: Степень насилия в действиях толпы
  choice: Передать насильственное изгнание и намерение сбросить Иисуса с высоты, не называя это прямо попыткой убийства.
  alternative: «Потащили Его на обрыв, чтобы убить, сбросив вниз».
  rationale: Смертельное намерение ясно следует из последовательности действий, однако перевод не должен добавлять способ передвижения, слово «обрыв» или прямое обозначение убийства, которых греческий текст здесь эксплицитно не употребляет.
- issue: Целевое или результативное значение ὥστε с инфинитивом
  choice: «чтобы» — намерение толпы.
  alternative: «так что» — фактический результат.
  rationale: Контекст показывает замысел, который в следующем стихе не осуществляется; целевое прочтение сохраняет повествовательное напряжение.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно торжественный. Заглавная буква в местоимении «Его» следует принятой русской библейской издательской норме. Синтаксис сохраняет стремительное развитие исходного предложения без архаизмов.
