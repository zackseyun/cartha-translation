lexical_decisions:
- source_word: συναγωγῇ
  choice: синагоге
  rationale: Обозначает иудейское место собрания и богослужения; «синагога» — точный и общепонятный русский эквивалент.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В данном повествовании речь идёт об отдельном человеке; русское «человек» естественно и не вносит лишних характеристик.
- source_word: ἔχων
  choice: в котором находился
  rationale: Передаёт буквальное «имеющий» естественным по-русски оборотом и не добавляет более сильного толкования «одержимый».
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: дух нечистого демона
  rationale: Сохраняет оба существительных — «дух» и «демон» — и отражает грамматическое согласование ἀκαθάρτου с δαιμονίου, не сводя выражение просто к «нечистому духу».
- source_word: ἀνέκραξεν
  choice: закричал
  rationale: Естественно передаёт резкий громкий возглас без излишнего усиления до «завопил».
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Сохраняет конкретный образ исходного выражения и звучит понятно в современном литературном русском.
theological_decisions:
- issue: Передача демонической терминологии
  choice: дух нечистого демона
  alternative: нечистый дух; нечистый демонический дух
  rationale: В греческом тексте прямо присутствуют и πνεῦμα («дух»), и δαιμόνιον («демон»). Выбранный вариант сохраняет оба понятия и не добавляет утверждения об «одержимости», которого нет в самом причастии ἔχων.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Конструкция «в котором находился» выбрана ради естественности и для сохранения смысловой сдержанности оригинала; двоеточие отражает переход к прямой речи в следующем стихе.
