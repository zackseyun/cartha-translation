source:
  edition: SBLGNT
  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: ru
  text: Подойдя к ней, Он встал над ней, запретил лихорадке, и она оставила её. Та тотчас встала и стала служить им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: склонившись над ней
  rationale: Оборот передаёт положение Иисуса непосредственно над лежащей женщиной. Русское «склонившись над ней» естественно описывает эту сцену, не добавляя действия прикосновения.
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: В евангельском контексте глагол выражает властное словесное пресечение. «Запретил» сохраняет обращённость действия к горячке и звучит естественнее по-русски, чем «упрекнул».
- source_word: τῷ πυρετῷ
  choice: горячке
  rationale: Дательный падеж обозначает объект властного запрета; перевод сохраняет необычное представление горячки как того, к чему обращена речь Иисуса.
- source_word: ἀφῆκεν αὐτήν
  choice: та оставила её
  rationale: Подразумеваемый субъект — горячка. Указательное местоимение ясно связывает действие с горячкой и сохраняет греческую образность.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт подчёркнутую немедленность полного восстановления в современном литературном и достойном регистре.
- source_word: ἀναστᾶσα
  choice: встала
  rationale: Прямо и естественно передаёт действие женщины после исцеления.
- source_word: διηκόνει
  choice: стала служить
  rationale: Такая передача несовершенного вида выражает начало продолжавшегося служения и не привносит специального церковного смысла.
- source_word: αὐτοῖς
  choice: им
  rationale: 'Множественное число сохранено: женщина служит всей присутствующей группе, а не только Иисусу.'
theological_decisions:
- issue: Следует ли понимать запрет горячке как указание на её демоническую природу или как олицетворение
  choice: Сохранить буквальную конструкцию «запретил горячке» без пояснения причины болезни
  alternative: 'Передать обобщённо: «приказал болезни отступить»'
  rationale: Греческий текст прямо называет горячку объектом запрета и подразумеваемым субъектом последующего ухода, но не объясняет её природу. Перевод сохраняет эту напряжённость, не вводя демонологического толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Синтаксис сохраняет последовательность и динамику греческого текста; архаизмы и конфессионально окрашенная терминология исключены.
