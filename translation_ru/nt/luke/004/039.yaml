  terminology: «Запретил лихорадке» сохраняет намеренно необычное в греческом тексте обращение к лихорадке как к объекту властного запрета, не решая вопроса о её природе. «Стала служить им» удачно передаёт начало/продолжение действия несовершенного διηκόνει.
