  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: ru
  text: Иисус, исполненный Святого Духа, возвратился от Иордана, и Дух[a] вёл Его в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Он был ведом в Духе в пустыне». Греческий оборот допускает такую передачу, но в данном контексте, вероятнее всего, означает, что Иисуса вёл Дух.'
    reason: Лексическая альтернатива для ἐν τῷ πνεύματι; сохраняет пассивный характер ἤγετο и локативное значение ἐν τῇ ἐρήμῳ.
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: исполненный Святого Духа
  rationale: Передаёт состояние полноты Духом, выраженное прилагательным πλήρης с родительным падежом, естественно и достойно для современного русского языка, не представляя его как новое разовое событие.
- source_word: ὑπέστρεψεν
  choice: возвратился
  rationale: Прямо и естественно передаёт обычное значение ὑποστρέφω в повествовании.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: от Иордана
  rationale: Сохраняет краткую форму греческого географического названия без добавления слова «река».
- source_word: ἤγετο
  choice: вёл Его
  rationale: Русская активная конструкция с Духом в роли действующего лица звучит естественнее буквального пассива; несовершенный вид «вёл» сохраняет длительность греческого имперфекта.
- source_word: ἐν τῷ πνεύματι
  choice: Дух вёл Его
  rationale: В контексте непосредственно упомянутого Святого Духа оборот естественно понимается как указание на Духа, ведущего Иисуса. Более буквальная пространственно-сферическая передача сохранена в сноске.
- source_word: ἐν τῇ ἐρήμῳ
  choice: по пустыне
  rationale: Передаёт действие, происходящее в безлюдной пустынной местности, и естественно сочетается по-русски с глаголом движения, не навязывая образ песчаной пустыни.
- source_word: δὲ
  choice: бессоюзное начало
  rationale: δέ обозначает мягкий повествовательный переход; в современном русском продолжение рассказа естественно передаётся без отдельного союза.
theological_decisions:
- issue: К кому относится πνεῦμα в ἐν τῷ πνεύματι
  choice: к Святому Духу, который ведёт Иисуса
  alternative: к внутреннему духовному состоянию Иисуса («в духе»)
  rationale: Непосредственно предшествующие слова «исполненный Святого Духа» и характерное для Луки изображение Духа как действующего лица делают первый смысл наиболее естественным, хотя формальная неоднозначность предлога ἐν отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка избегает архаичного «был водим», сохраняя длительный характер действия посредством несовершенного вида.
