  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: ru
  text: возвестить благоприятный год Господень[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвестить год благоволения Господа».'
    reason: Лексическая альтернатива, яснее раскрывающая, что δεκτός может указывать на Божье благоволение.
  - marker: b
    text: 'Традиционный перевод: «лето Господне благоприятное». Эти слова перекликаются с Исайей 61:2 и могут напоминать о юбилейном годе.'
    reason: Отсылка к Ис 61:2, сохранение традиционной формулировки и пояснение возможного юбилейного подтекста без внесения его в основной текст.
lexical_decisions:
- source_word: κηρύξαι
  choice: возвестить
  rationale: Аористный инфинитив продолжает целевой ряд из предыдущего стиха; «возвестить» передаёт публичный, глашатайский оттенок κηρύσσω и естественно звучит в данном пророческом контексте.
- source_word: ἐνιαυτὸν
  choice: год
  rationale: ἐνιαυτός обычно означает «год»; это слово сохранено ради прямой связи с Ис 61:2 и возможного юбилейного подтекста, не выраженного в греческом тексте прямо.
- source_word: κυρίου
  choice: Господень
  rationale: Краткая притяжательная форма естественно передаёт родительный падеж κυρίου в устойчивом библейском выражении и сохраняет возвышенный, но понятный регистр.
- source_word: δεκτόν
  choice: благоприятный
  rationale: В этом контексте δεκτός обозначает время благоволения и благоприятного принятия; «благоприятный» яснее современному читателю, чем буквальное «приемлемый».
theological_decisions:
- issue: Аллюзия на Исайю 61:2 и возможный юбилейный смысл
  choice: Сохранить в основном тексте слово «год», не добавляя «юбилейный».
  alternative: возвестить юбилей Господень
  rationale: Фраза перекликается с Ис 61:2 и может напоминать о юбилейном годе, однако κηρύξαι ἐνιαυτὸν κυρίου δεκτόν прямо не называет юбилей; перевод не должен превращать подтекст в явное утверждение.
- issue: Передача κύριος
  choice: Господень
  alternative: принадлежащий Господу / Господа
  rationale: «Господень» точно и естественно передаёт отношение к Господу в формуле, восходящей к Исайе, не вводя в основной текст отдельного решения о передаче тетраграмматона.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Возвестить» и «Господень» понятны современному читателю и уместны в пророческой цитате; архаическое «лето» вынесено в примечание.
