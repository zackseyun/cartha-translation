  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: ru
  text: 'Иисус сурово приказал ему: «Замолчи[a] и выйди из него!» Демон, бросив человека в самую середину, вышел из него, нисколько не повредив ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Будь в наморднике»; образно: «Замолчи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: строго приказал ему
  rationale: Глагол ἐπιτιμάω обозначает властное порицание или суровый приказ. В контексте изгнания беса сочетание «строго приказал» естественно передаёт силу речи Иисуса; местоимение мужского рода соответствует русскому слову «бес».
- source_word: Φιμώθητι
  choice: Замолчи
  rationale: Форма буквально связана с надеванием намордника, а в обращении означает резкий приказ прекратить говорить. «Замолчи» естественно и выразительно в современном русском; буквальный образ сохранён в сноске.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: выйди из него
  rationale: Прямо передаёт повеление и конструкцию с ἀπό без дополнительных толкований.
- source_word: ῥίψαν αὐτὸν εἰς τὸ μέσον
  choice: повергнув человека посреди всех
  rationale: ῥίπτω передаёт резкое бросание или повержение. «Человека» проясняет референт местоимения без изменения смысла, а «посреди всех» естественно выражает εἰς τὸ μέσον в сцене собрания.
- source_word: τὸ δαιμόνιον
  choice: бес
  rationale: «Бес» — прямое, общепонятное и стилистически уместное русское соответствие δαιμόνιον в повествовании об изгнании злого духа.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: нисколько ему не повредив
  rationale: Сохраняет отрицательную причастную конструкцию и подчёркивает, что при внешне резком падении человек не получил никакого вреда.
theological_decisions:
- issue: Характер δαιμόνιον в повествовании об изгнании
  choice: Передать как «бес» и сохранить изображение личностного злого духа, к которому Иисус обращается и который выходит из человека.
  alternative: Истолковать как безличную злую силу, болезнь или психическое расстройство.
  rationale: Греческий текст содержит прямое обращение, повеление выйти и сообщение о выходе беса; перевод не должен демифологизировать или иначе переосмысливать повествование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Краткие повеления переданы резко и властно; устаревшая синтаксическая тяжеловесность устранена. Слово «бес» понятно широкому читателю и соответствует жанру.
