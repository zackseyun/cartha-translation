id: LUK.4.41
reference: Luke 4:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: ru
  text: 'Из многих людей также выходили бесы, крича и говоря: «Ты — Сын Божий!» Но Он строго запрещал им говорить, потому что они знали, что Он — Мессия[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός означает «Мессия, Помазанник».'
    reason: Сохраняется традиционная альтернатива передачи титула Χριστός.
lexical_decisions:
- source_word: δαιμόνια
  choice: бесы
  rationale: Прямое и традиционно понятное обозначение демонов; выражение «нечистые духи» здесь отсутствует в греческом тексте.
- source_word: ἐξήρχετο
  choice: выходили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; русская форма несовершенного вида сохраняет этот оттенок.
- source_word: ἀπὸ πολλῶν
  choice: из многих людей
  rationale: В греческом определяемое слово подразумевается; добавление «людей» делает фразу естественной по-русски, не меняя очевидного контекстуального смысла.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: крича и говоря
  rationale: Сохраняет оба причастия и подчёркивает громкий характер возгласа без излишнего усиления.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Сохраняет устойчивую титульную формулу и её христологический вес.
- source_word: ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν
  choice: Он строго запрещал им говорить
  rationale: Естественно передаёт резкий властный запрет и продолжительный либо повторявшийся характер действия, не перегружая русскую фразу буквальным повтором «запрещал и не позволял».
- source_word: ᾔδεισαν
  choice: они знали
  rationale: Естественная русская передача статального значения формы οἶδα.
- source_word: τὸν χριστόν
  choice: Мессия
  rationale: Χριστός употреблено как титул Помазанника, а не как часть имени; вариант «Христос» отмечен в сноске.
theological_decisions:
- issue: Передача титула Χριστός в признании личности Иисуса
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово выступает как титул. «Мессия» раскрывает его историко-библейское значение, а традиционный вариант «Христос» сохраняется в сноске.
- issue: Соотношение титулов «Сын Божий» и «Мессия»
  choice: Сохранить оба титула как отдельные обозначения
  alternative: Объединить их в одно пояснительное наименование
  rationale: Греческий текст различает возглас бесов и последующее авторское объяснение; перевод не отождествляет и не противопоставляет эти титулы сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «Он» применительно к Иисусу написано с прописной буквы согласно распространённой русской библейской издательской традиции.
