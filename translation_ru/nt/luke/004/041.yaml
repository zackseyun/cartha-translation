  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: бесы выходили из многих людей; их возглас передан отдельно от авторского пояснения; несовершенный характер действий естественно выражен формами «выходили» и «запрещал». Добавленное «людей» обоснованно раскрывает подразумеваемый человеческий референт ἀπὸ πολλῶν и не вносит нового смысла.'
