revisions:
- from: И ни к одной из них не был послан Илия, а только в Сарепту Сидонскую[a], к женщине-вдове.
  to: И ни к одной из них не был послан Илия, а только в Сарепту Сидонскую — к вдове.
  rationale: Заменено стилистически неестественное «к женщине-вдове» на естественное «к вдове», без изменения референта или смысла. Необязательная сноска удалена, поскольку русское название уже совпадает с ветхозаветным и не требует пояснения. Пассивная конструкция и исключительный характер высказывания сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:46:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: сохранены пассив «не был послан», отрицательное исключение, Сарепта, связанная с Сидоном, и адресат — вдова. «Сарепту Сидонскую» — устоявшееся русское библейское обозначение и приемлемая передача Σάρεπτα τῆς Σιδωνίας.'
  naturalness: Начальная инверсия «И ни к одной из них не был послан Илия» возможна в литературно-библейском регистре и передаёт акцент оригинала. Однако «женщина-вдова» звучит по-русски канцелярски и неестественно; «к вдове» передаёт смысл χήρα без стилистической тяжеловесности.
  terminology: '«Илия» и «Сарепта Сидонская» соответствуют традиционному русскому библейскому употреблению. Сноска не нужна: в русском основном тексте уже употреблено ветхозаветное название «Сарепта», поэтому она не разъясняет переводческого расхождения; формулировка «близ Сидона» также менее точна, чем связь Сарепты с Сидоном, выраженная в греческом.'
  issues:
