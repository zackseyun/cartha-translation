    rationale: Русское сложное обозначение звучит административно, тогда как греческое приложение γυναῖκα χήραν в данном контексте естественно передаётся словом «вдова».
  - severity: low
    issue: Избыточная и неточно мотивированная сноска [a].
    rationale: В отличие от английского текста, русское «Сарепта» не нуждается в отождествлении с ветхозаветным названием. Сноска не добавляет необходимой информации для понимания текста и её формулировка «близ Сидона» не воспроизводит точно генитивную связь τῆς Σιδωνίας.
  revised_text: И ни к одной из них не был послан Илия, а только в Сарепту Сидонскую — к вдове.
