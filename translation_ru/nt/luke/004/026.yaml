  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: ru
  text: И ни к одной из них не был послан Илия, а только в Сарепту Сидонскую — к вдове.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέμφθη
  choice: не был послан
  rationale: 'Пассивная форма сохраняет не названного прямо деятеля: из контекста подразумевается Бог, однако перевод не делает это явным сверх греческого текста.'
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: ни к одной из них
  rationale: Передаёт направленность πρὸς к лицам и подчёркнутое отрицание οὐδεμίαν; местоимение женского рода соотносится со вдовами из предыдущего стиха.
- source_word: Ἠλίας
  choice: Илия
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: εἰ μὴ
  choice: а только
  rationale: В данной исключительной конструкции естественно передаёт значение «кроме как», сохраняя контраст после отрицания.
- source_word: Σάρεπτα τῆς Σιδωνίας
  choice: Сарепту Сидонскую
  rationale: Устоявшееся русское библейское название, естественно передающее связь города с Сидоном и узнаваемое по 3 Царств 17:9.
- source_word: γυναῖκα χήραν
  choice: к женщине-вдове
  rationale: Сохраняет оба компонента греческого приложения — «женщина, вдова» — в естественной и ясной русской форме.
theological_decisions:
- issue: Подразумеваемый отправитель Илии в пассивной конструкции
  choice: 'Сохранить пассив без названного деятеля: «не был послан Илия»'
  alternative: 'Сделать Бога явным субъектом: «Бог не послал Илию»'
  rationale: Хотя контекст подразумевает действие Бога, греческий текст не называет отправителя; перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальная конструкция «И ни к одной» сохраняет связь с предыдущим стихом и риторический акцент оригинала.
