  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: ru
  text: 'И Иисус ответил ему: «Написано: „Господу, Богу твоему, поклоняйся[a] и Ему одному служи“».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «склонись перед Господом, Богом твоим».'
    reason: lexical_alternative
  - marker: b
    text: Эта цитата перекликается со Второзаконием 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: И Иисус ответил ему
  rationale: Причастие ἀποκριθείς вместе с εἶπεν образует обычную повествовательную конструкцию ответа. По-русски она естественно и полно передаётся одним глаголом «ответил», а καί сохраняется как «И».
- source_word: Γέγραπται
  choice: Написано
  rationale: Перфект страдательного залога служит устойчивой формулой введения цитаты из Писания. «Написано» естественно передаёт и сам факт записи, и сохраняющуюся силу текста.
- source_word: Κύριον τὸν θεόν σου
  choice: Господу, Богу твоему
  rationale: «Господь» сохраняет богословский и библейский вес κύριος в цитате, относящейся к Богу. Приложение «Богу твоему» точно отражает греческую конструкцию; дательный обусловлен русским управлением глагола «поклоняться».
- source_word: προσκυνήσεις
  choice: поклоняйся
  rationale: В данном контексте глагол означает религиозное поклонение. Русское «поклоняйся» сохраняет связь как с почитанием, так и с буквальным преклонением; форма повелительного наклонения естественно передаёт предписывающую силу греческого будущего времени.
- source_word: λατρεύσεις
  choice: служи
  rationale: λατρεύω обозначает служение божеству. В окружении слов о поклонении и исключительной преданности «служи» звучит естественно и сохраняет культовый смысл.
- source_word: αὐτῷ μόνῳ
  choice: Ему одному
  rationale: 'Такой порядок слов ясно выражает исключительность: служение должно быть обращено только к Богу. Прописная буква в местоимении соответствует принятому благоговейному русскому оформлению речи о Боге.'
theological_decisions:
- issue: Передача κύριος в ветхозаветной цитате, относящейся к Богу
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: Непосредственный греческий текст Луки содержит κύριος. «Господь» сохраняет его обычное новозаветное значение, не подменяя греческую форму типографическим обозначением имени YHWH из еврейского текста.
- issue: Соотношение поклонения и служения в цитате
  choice: поклоняйся… и Ему одному служи
  alternative: пади ниц… и совершай священное служение лишь Ему
  rationale: Выбранный текст сохраняет два разных греческих глагола, не сливая их и не усиливая конфессионально окрашенной терминологией. Исключительность грамматически относится к служению, как в греческом αὐτῷ μόνῳ.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис краток и понятен; формула «Написано» и порядок «Господу, Богу твоему» сохраняют узнаваемый язык Писания без архаических форм.
