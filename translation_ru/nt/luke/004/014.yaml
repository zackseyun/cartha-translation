id: LUK.4.14
reference: Luke 4:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: ru
  text: Иисус возвратился в Галилею в силе Духа, и весть о Нём разошлась по всей округе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молва», «известие» или «слух». Греческое слово обозначает широко распространившуюся весть, само по себе не указывая, была ли она положительной или отрицательной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: возвратился
  rationale: Обычное повествовательное значение ὑποστρέφω; передаёт возвращение и естественно звучит в современном русском языке.
- source_word: ἐν τῇ δυνάμει
  choice: в силе
  rationale: Сохраняет образ и допускаемую греческим оборотом смысловую широту — состояние, сферу или образ действия, не сводя выражение только к орудию действия.
- source_word: τοῦ πνεύματος
  choice: Духа
  rationale: По ближайшему контексту речь идёт о Святом Духе; прописная буква ясно передаёт референт, тогда как отсутствующее в стихе определение «Святого» не добавляется.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Естественное русское обозначение направления движения.
- source_word: φήμη
  choice: весть
  rationale: Передаёт широко распространяющееся известие, не навязывая положительного оттенка «славы» или отрицательного оттенка «слуха».
- source_word: ἐξῆλθεν
  choice: разошлась
  rationale: Естественно передаёт метафору движения вести и её распространение, содержащуюся в сочетании φήμη ἐξῆλθεν.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: по всей округе
  rationale: Кратко и естественно передаёт распространение по всей прилегающей местности.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Обычный современный русский эквивалент περί с родительным падежом в данном контексте.
theological_decisions:
- issue: К кому относится πνεύματος
  choice: «Духа» относится к Святому Духу
  alternative: неконкретизированный дух
  rationale: В непосредственном контексте Лк. 4 πνεῦμα обозначает Святого Духа. Перевод сохраняет буквальное «Духа», не добавляя отсутствующее здесь слово «Святого».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «В силе Духа» намеренно сохраняет формулировку и смысловую открытость оригинала; «по всей округе» понятно широкому читателю и не перегружает фразу.
