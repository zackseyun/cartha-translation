  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: ru
  text: И, возведя Его наверх, дьявол показал Ему все царства обитаемого мира[a] в одно мгновение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мира». Греческое слово часто означает «обитаемый мир», а в некоторых контекстах — более узко цивилизованный мир или пределы империи.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «в мгновение времени»; также возможно: «вмиг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν αὐτὸν
  choice: подняв Его
  rationale: Передаёт аористное причастие ἀνάγω и движение вверх, не добавляя гору, которая в тексте Луки не названа.
- source_word: ἔδειξεν αὐτῷ
  choice: показал Ему
  rationale: Прямое и естественное соответствие обычному повествовательному значению δείκνυμι.
- source_word: πάσας τὰς βασιλείας
  choice: все царства
  rationale: Во множественном числе βασιλεία здесь обозначает царства или владения, а не отвлечённое царствование.
- source_word: τῆς οἰκουμένης
  choice: обитаемого мира
  rationale: Сохраняет смысловую конкретность οἰκουμένη — населённый, обитаемый мир — и не сужает значение до Римской империи.
- source_word: ἐν στιγμῇ χρόνου
  choice: в одно мгновение
  rationale: Естественно по-русски выражает предельно краткий промежуток времени, обозначенный сочетанием στιγμή с χρόνου.
theological_decisions:
- issue: Каким образом дьявол показал царства
  choice: Описать событие, не уточняя его механизм
  alternative: Видение, сверхъестественный показ или буквальный обзор с возвышенности
  rationale: Греческий текст сообщает лишь, что дьявол показал Иисусу все царства; перевод не должен определять, каким именно образом это произошло.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по распространённой русской издательской традиции. Подлежащее «дьявол» выражено явно для естественности русского повествования; оно восстанавливается из ближайшего контекста, тогда как греческая форма подразумевает его.
