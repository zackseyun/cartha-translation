  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: ru
  text: 'Иисус ответил им: «Не здоровым нужен врач, а больным».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: Иисус ответил им
  rationale: Сочетание причастия ἀποκριθείς с εἶπεν представляет обычную повествовательную формулу. Естественное русское «ответил им» сохраняет ответный характер реплики и адресата, не воспроизводя избыточное «ответив, сказал им».
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Не ... нужен
  rationale: Русская безличная конструкция естественно передаёт значение «не имеют нужды» и сохраняет афористическую краткость высказывания.
- source_word: οἱ ὑγιαίνοντες
  choice: здоровым
  rationale: Субстантивированное причастие обозначает людей, находящихся в здоровом состоянии; русское прилагательное в роли существительного точно и естественно передаёт эту группу.
- source_word: ἰατροῦ
  choice: врач
  rationale: Современное общеупотребительное слово, точно соответствующее ἰατρός и уместное в кратком образном изречении.
- source_word: οἱ κακῶς ἔχοντες
  choice: больным
  rationale: Греческое идиоматическое выражение буквально означает «тем, кому плохо», но в данном контексте однозначно указывает на больных; «больным» даёт естественный русский эквивалент и сохраняет противопоставление здоровым.
