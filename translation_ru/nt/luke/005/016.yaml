lexical_decisions:
- source_word: αὐτὸς
  choice: Он
  rationale: Явно выраженное местоимение сохраняет субъект; начальная прописная соответствует принятому русскому оформлению местоимений, относящихся к Иисусу, не усиливая его до «Сам».
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкое противопоставление предыдущему сообщению о растущей известности Иисуса; русское «а» здесь естественнее более резкого «но».
- source_word: ἦν ὑποχωρῶν
  choice: уходил
  rationale: Русский несовершенный вид в данном повествовательном контексте естественно выражает продолжавшееся или обычное, повторявшееся действие, передавая перифрастический имперфект.
- source_word: ἐν ταῖς ἐρήμοις
  choice: в безлюдные места
  rationale: Множественное число обозначает необитаемые, уединённые местности, а не обязательно пустыню как природную зону; при глаголе движения русский винительный естественно передаёт удаление туда.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое соединение двух связанных действий.
- source_word: προσευχόμενος
  choice: молился
  rationale: Согласованный несовершенный вид передаёт сопутствующее и привычное действие без излишне буквальной причастной конструкции.
theological_decisions:
- issue: Характер действий Иисуса во времени
  choice: Стих описывает обычное, повторявшееся удаление Иисуса для молитвы.
  alternative: Стих сообщает об одном конкретном случае удаления и молитвы.
  rationale: Конструкция ἦν с причастиями настоящего времени и русский несовершенный вид естественно допускают длительное или обычное действие; контекст поддерживает привычный характер, но примечание сохраняет грамматическую широту.
translation_notes:
  register: Современный литературный русский язык, простой и достойный. «Безлюдные места» избегает ошибочного впечатления о конкретной пустыне; несовершенные глаголы сохраняют повторяемость действий.
