source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: ru
  text: 'Однажды, когда Он находился в одном из городов, и вот, появился человек, весь покрытый проказой.[a] Увидев Иисуса, он пал ниц и взмолился: «Господи, если Ты захочешь, Ты можешь меня очистить».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полный проказы». Это выражение подчёркивает тяжесть его состояния. Слово «проказа» в древности могло обозначать различные кожные заболевания.'
    reason: lexical_alternative
  - marker: b
    text: Глагол «очистить» может относиться не только к избавлению от болезни, но и к очищению от ритуальной нечистоты.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: Когда Он находился
  rationale: Передаёт повествовательную формулу и временную конструкцию естественным современным русским языком, не воспроизводя буквально тяжеловесное «и случилось, когда Он был».
- source_word: μιᾷ τῶν πόλεων
  choice: в одном из городов
  rationale: Слово πόλις обозначает город или населённый пункт; нейтральное «город» не предполагает непременно крупного городского центра.
- source_word: ἰδοὺ
  choice: там, как оказалось, был
  rationale: Вводит неожиданно появляющуюся в повествовании фигуру и отчасти передаёт выделительную функцию ἰδού без архаичного «вот» в середине фразы.
- source_word: πλήρης λέπρας
  choice: весь покрытый проказой
  rationale: Естественно по-русски подчёркивает тяжесть и обширность поражения, выраженные буквально словами «полный проказы».
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: пал ниц
  rationale: Краткое и общепонятное выражение точно передаёт положение лицом к земле, указывающее на смирение и настойчивую мольбу.
- source_word: ἐδεήθη αὐτοῦ
  choice: стал умолять Его
  rationale: Передаёт настойчивую просьбу и хорошо сочетается с последующей прямой речью.
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская звательная форма уважительного обращения к Иисусу; сохраняет возможный христологический оттенок, не делая его однозначным.
- source_word: ἐὰν θέλῃς
  choice: если Ты захочешь
  rationale: Ясно выражает условие, относящееся к воле Иисуса, а не сомнение в Его способности.
- source_word: δύνασαί με καθαρίσαι
  choice: Ты можешь меня очистить
  rationale: Сохраняет как утверждение способности Иисуса, так и лексику очищения, включающую телесный и ритуально-социальный смысл.
theological_decisions:
- issue: Значение λέπρα и καθαρίζω в рассказе об исцелении
  choice: «проказа» и «очистить»
  alternative: «кожная болезнь» и «исцелить»
  rationale: Древнее слово λέπρα могло охватывать более широкий круг кожных поражений, чем современная болезнь Хансена, однако традиционное «проказа» остаётся узнаваемым. Глагол «очистить» сохраняет физический, ритуальный и общественный аспекты восстановления человека.
- issue: Обращение Κύριε к Иисусу
  choice: «Господи»
  alternative: «Господин» или «Учитель»
  rationale: «Господи» естественно передаёт почтительное обращение и сохраняет возможный более глубокий христологический смысл, не утверждая, что говорящий уже вкладывал в него полное исповедание веры.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «пал ниц» и «Господи» сохранены как понятные и уместные в контексте мольбы; архаичная синтаксическая калька повествовательной формулы устранена. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
