  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: ru
  text: 'Они сказали Ему: «Ученики Иоанна часто постятся и возносят молитвы; так же поступают и ученики фарисеев[a], а Твои[b] едят и пьют».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «те, что у фарисеев»; слово «ученики» подразумевается из предыдущей части фразы.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть Твои ученики. В греческом тексте буквально: «Твои».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Они сказали Ему
  rationale: δέ — мягкая связка; в русском отдельный союз здесь не требуется, а местоимение сохраняет продолжение повествования.
- source_word: μαθηταὶ Ἰωάννου
  choice: ученики Иоанна
  rationale: Естественная и точная передача генитива принадлежности или связи.
- source_word: νηστεύουσιν πυκνά
  choice: часто постятся
  rationale: πυκνά употреблено наречно и указывает на частоту повторяющегося действия.
- source_word: δεήσεις ποιοῦνται
  choice: возносят молитвы
  rationale: Передаёт устойчивое сочетание с существительным δεήσεις естественным современным русским языком, сохраняя оттенок молитвенных прошений.
- source_word: ὁμοίως καὶ οἱ τῶν Φαρισαίων
  choice: так же поступают и ученики фарисеев
  rationale: В греческом сказуемое и слово «ученики» подразумеваются; их восполнение необходимо для ясного и естественного русского предложения.
- source_word: οἱ δὲ σοὶ
  choice: а Твои
  rationale: Сохраняет греческий эллипсис и выраженный δέ контраст; из контекста ясно, что речь идёт об учениках Иисуса.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: едят и пьют
  rationale: Настоящее время описывает обычное поведение и естественно передаётся русским настоящим временем.
theological_decisions:
- issue: Следует ли явно восполнять слово «ученики» во второй и третьей частях
  choice: Во второй части восполнить «ученики», в третьей сохранить эллипсис «Твои»
  alternative: Сохранить эллипсис в обеих частях либо явно сказать «Твои ученики»
  rationale: Русское «те, кто у фарисеев» неестественно и менее ясно, поэтому существительное восполнено. «Твои» в контрастной позиции понятно по контексту и сохраняет краткость оригинала; сноски отмечают оба восполнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные формы «Ему» и «Твои» употреблены как традиционные местоименные обозначения Иисуса; синтаксис сделан естественным без устранения значимого эллипсиса в последней части.
