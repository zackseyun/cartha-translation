  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: частотность поста (πυκνά), совершение молитвенных прошений (δεήσεις ποιοῦνται), сопоставление с учениками фарисеев и контраст с учениками Иисуса, которые «едят и пьют». Восполнение «ученики» во второй части оправдано русской грамматикой и не меняет смысла; эллипсис «Твои» в заключительной части сохранён и прозрачен из контекста.'
