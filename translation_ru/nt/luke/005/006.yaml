  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: ru
  text: Сделав это, они захватили сетями огромное множество рыбы, и их сети рвались.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их сети начали рваться». Греческая форма изображает разрыв как происходящий процесс; она не обязательно означает, что сети полностью разорвались.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Сделав это
  rationale: Аористное причастие естественно передаёт действие, предшествующее основному; указательное «это» восстанавливается из контекста и соответствует греческому τοῦτο.
- source_word: συνέκλεισαν
  choice: захватили сетями
  rationale: Глагол означает «сомкнуть вокруг, заключить, охватить». В данном контексте «захватили сетями» сохраняет образ рыбы, окружённой сетями, и звучит естественно по-русски, не сводя выражение к нейтральному «поймали».
- source_word: πλῆθος ἰχθύων πολύ
  choice: огромное множество рыбы
  rationale: Сочетание πλῆθος и πολύ подчёркивает исключительное изобилие улова; собирательное единственное «рыбы» естественно для современного русского языка.
- source_word: διερρήσσετο
  choice: начали рваться
  rationale: Имперфект изображает разрыв как развивающийся процесс, а не как уже завершившийся результат. Средне-пассивная форма здесь естественно передаётся русским возвратным глаголом.
- source_word: τὰ δίκτυα αὐτῶν
  choice: сети их
  rationale: Сохранено явно выраженное в греческом тексте множественное число; постпозиция местоимения поддерживает сдержанный библейский регистр без архаизации.
