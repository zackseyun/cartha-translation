  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: θάμβος — «изумление», περιέσχεν — «охватило», а причинное ἐπὶ τῇ ἄγρᾳ — «из-за улова». Множественное число συνέλαβον сохранено в «они поймали». Собирательное русское «рыба» в сочетании «улов рыбы» естественно передаёт греческое τῶν ἰχθύων («рыб»).'
  naturalness: Фраза звучит естественно на современном литературном русском. Начальное «Ведь» уместно выражает пояснительную функцию γάρ и связывает стих с предшествующей репликой Симона. Инверсия «его и всех… охватило изумление» нормативна и повествовательно выразительна.
  terminology: Терминологически значимых богословских выражений в стихе нет. «Изумление», «улов рыбы» и «поймали» точны, ясны и соответствуют нейтральному литературному регистру.
