  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: ru
  text: Ведь его и всех, кто был с ним, охватило изумление из-за улова рыбы, которую они поймали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: изумление
  rationale: Слово обозначает сильное, внезапно охватившее человека удивление; «изумление» естественно передаёт интенсивность реакции на необычайный улов.
- source_word: γὰρ
  choice: ведь
  rationale: Союз поясняет причину реакции Симона в предыдущем стихе; «ведь» ясно и естественно сохраняет эту смысловую связь.
- source_word: περιέσχεν
  choice: охватило
  rationale: Глагол буквально выражает окружение или овладение; применительно к чувству русское «охватило» точно передаёт идиоматический смысл.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: всех, кто был с ним
  rationale: Передаёт полный охват группы спутников Симона и звучит естественно в современном русском повествовании.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: из-за улова рыбы
  rationale: ἄγρα здесь означает улов, а ἐπί указывает на причину изумления. Формулировка сохраняет прямой образ исходного текста.
- source_word: ὧν συνέλαβον
  choice: которую они поймали
  rationale: Относительное местоимение по смыслу относится к рыбе, а множественное число глагола показывает совместное участие группы. Женский род местоимения согласован с собирательным «рыба».
