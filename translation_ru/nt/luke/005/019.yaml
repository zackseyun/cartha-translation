source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: ru
  text: Не найдя, каким путём внести его внутрь из-за толпы[a], они поднялись на крышу и через кровельную черепицу[b] спустили его с его подстилкой[c] в середину, перед Иисусом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не найдя, как пронести его внутрь из-за толпы». Греческий оборот может указывать как на способ, так и на путь доступа.'
    reason: lexical_alternative
  - marker: b
    text: То есть через кровельную черепицу. Лука упоминает кровельную черепицу.
    reason: cultural_note
  - marker: c
    text: 'Или: «с небольшим ложем» либо «с носилками». Греческое слово обозначает небольшую постель или подстилку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας
  choice: как
  rationale: В эллиптическом обороте слово указывает на способ или путь, которым можно было внести человека. Русское «как» естественно сохраняет оба оттенка.
- source_word: εἰσενέγκωσιν αὐτόν
  choice: пронести его внутрь
  rationale: Глагол выражает внесение внутрь; «пронести» уместно передаёт, что человека несли, не перегружая фразу.
- source_word: διὰ τὸν ὄχλον
  choice: из-за толпы
  rationale: 'διά с винительным падежом имеет здесь причинное значение: толпа была препятствием.'
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: они поднялись на крышу
  rationale: Современная и ясная передача подъёма на плоскую кровлю дома.
- source_word: διὰ τῶν κεράμων
  choice: через черепицу
  rationale: Сохраняет конкретную архитектурную деталь Луки — кровельные плитки — без добавления прямо не названного действия по разбору крыши.
- source_word: καθῆκαν
  choice: спустили
  rationale: Глагол обозначает опускание сверху вниз; «спустили» естественно описывает это действие по-русски.
- source_word: σὺν τῷ κλινιδίῳ
  choice: вместе с подстилкой
  rationale: κλινίδιον обозначает небольшое ложе или постель. «Подстилка» понятна в данном контексте и не создаёт современного медицинского образа носилок.
- source_word: εἰς τὸ μέσον
  choice: прямо в середину
  rationale: Передаёт перемещение в центральное пространство собравшихся; «прямо» естественно связывает эту позицию со следующими словами «перед Иисусом».
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: перед Иисусом
  rationale: Точно и естественно передаёт пространственное положение человека относительно Иисуса.
