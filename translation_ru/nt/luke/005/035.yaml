  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: ru
  text: Но придут дни, и когда жених будет отнят от них[a], тогда они будут поститься в те дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет удалён от них». Греческий глагол подразумевает, что жениха отнимают, а не просто что он сам уходит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Но придут дни
  rationale: Сохраняет греческую идиому и мягкое противопоставление δέ предыдущей ситуации; по-русски звучит естественно и пророчески.
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с аористом сослагательного наклонения вводит ожидаемое будущее событие.
- source_word: ἀπαρθῇ
  choice: будет отнят
  rationale: Передаёт пассивную форму и оттенок насильственного удаления, не сводя смысл к добровольному уходу.
- source_word: ἀπ’ αὐτῶν
  choice: у них
  rationale: Естественно выражает отделение жениха от тех, с кем он находится.
- source_word: ὁ νυμφίος
  choice: жених
  rationale: Обычный и точный русский эквивалент νυμφίος, сохраняющий свадебный образ.
- source_word: τότε νηστεύσουσιν
  choice: тогда … они будут поститься
  rationale: Сохраняет временное следствие и религиозное значение глагола νηστεύω.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в те дни
  rationale: Сохраняет присутствующее в греческом тексте повторение и его смысловое ударение.
theological_decisions:
- issue: Следует ли смягчить пассивное ἀπαρθῇ до нейтрального ухода жениха
  choice: жених будет отнят у них
  alternative: жених уйдёт от них
  rationale: Греческий пассив указывает, что жениха удаляют, а не просто что он уходит. Такая передача сохраняет зловещий предвосхищающий оттенок, не истолковывая его прямо.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «придут дни» сохраняет исходный образ; конструкция «тогда, в те дни» удерживает греческое повторение, оставаясь понятной современному читателю.
