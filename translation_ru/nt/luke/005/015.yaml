id: LUK.5.15
reference: Luke 5:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: ru
  text: Но молва о Нём распространялась всё больше[a], и множество людей собиралось, чтобы слушать и исцеляться от своих болезней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «известие о Нём»; букв. «слово о Нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: распространялась
  rationale: Имперфект передаёт продолжавшееся распространение молвы; возвратная форма естественна для современного русского повествования.
- source_word: μᾶλλον
  choice: всё больше
  rationale: 'Сохраняет сравнительно-усилительное значение: известие распространялось в ещё большей мере.'
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: молва о Нём
  rationale: В данном контексте λόγος означает распространявшееся известие об Иисусе, а не богословский термин «Слово». «Молва» естественно обозначает широко расходящийся рассказ, не уточняя его точного содержания.
- source_word: συνήρχοντο ὄχλοι πολλοὶ
  choice: множество людей собиралось
  rationale: Передаёт продолжающееся или повторявшееся собирание многочисленных толп естественным русским выражением, избегая тяжеловесного «многие толпы».
- source_word: ἀκούειν
  choice: чтобы слушать
  rationale: Инфинитив цели передан придаточным с «чтобы»; «слушать» уместно для намеренного слушания Иисуса, при этом подразумеваемый объект не добавлен.
- source_word: θεραπεύεσθαι
  choice: исцеляться
  rationale: Передаёт пассивное получение исцеления без добавления субъекта действия; в сочетании с «собиралось» русский инфинитив естественно согласуется по смыслу со множеством людей.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: от своих болезней
  rationale: В контексте исцелений ἀσθένειαι обозначает телесные недуги; предлог «от» сохраняет образ освобождения от болезней, а «своих» естественно соотносит их с собравшимися людьми.
theological_decisions:
- issue: Характер исцеления
  choice: Передать θεραπεύεσθαι и ἀσθενειῶν как исцеление от телесных болезней.
  alternative: Использовать более широкое выражение, допускающее духовное восстановление.
  rationale: Ближайший контекст говорит о людях, приходящих слушать и получать исцеление от недугов; стих не утверждает здесь духовного исцеления.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Местоимение «Нём» написано с прописной буквы как традиционное уважительное обозначение Иисуса, без добавления отсутствующих в греческом титулов.
