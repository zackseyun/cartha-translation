  text: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινοὺς ⸀βλητέον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: ru
  text: Но молодое вино нужно наливать в новые мехи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «молодое вино нужно помещать в новые мехи». Для вина и мехов в греческом употреблены разные прилагательные: νέος — «молодой, новый по времени», а καινός — «новый, свежий по качеству или состоянию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление ошибочному действию, описанному в предыдущем стихе, правильному действию здесь.
- source_word: οἶνον νέον
  choice: молодое вино
  rationale: В русском выражение «молодое вино» естественно обозначает недавно изготовленное вино и точно передаёт временную новизну νέος.
- source_word: εἰς
  choice: в
  rationale: При глаголе движения «наливать» русский предлог «в» естественно выражает направление внутрь сосуда.
- source_word: ἀσκοὺς
  choice: мехи
  rationale: ἀσκός обозначает сосуд из шкуры для жидкостей; традиционное и понятное русское «мехи» сохраняет предметный образ.
- source_word: καινοὺς
  choice: новые
  rationale: Для мехов «новые» естественно передаёт καινός — новые по состоянию, ещё пригодные и эластичные. Отличие от νέος сохраняется выбором «молодое» для вина.
- source_word: βλητέον
  choice: нужно наливать
  rationale: Отглагольное прилагательное выражает безличную необходимость. С учётом вина и сосудов «наливать» по-русски естественнее буквального «класть» и сохраняет смысл действия.
theological_decisions:
- issue: Различение νέος и καινός в одном высказывании
  choice: «молодое вино» и «новые мехи»
  alternative: «новое вино» и «новые мехи» либо «молодое вино» и «свежие мехи»
  rationale: Греческий текст употребляет два разных прилагательных. Русское сочетание «молодое вино» естественно передаёт временной оттенок νέος, а «новые мехи» — новое, пригодное состояние, выраженное καινός, без неестественного сочетания «свежие мехи».
translation_notes:
  register: Современный литературный русский, ясный и достойный. Формулировка сохраняет краткость афоризма; «мехи» передаёт древний кожаный сосуд, а глагол «наливать» делает действие естественным для русского читателя.
