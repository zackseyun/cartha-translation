  source_fidelity: '«Но молодое вино нужно наливать в новые мехи» точно передаёт все смысловые компоненты греческого текста: ἀλλά как противопоставление, οἶνον νέον как «молодое вино», направление εἰς, ἀσκούς как кожаные мехи и необходимость, выраженную βλητέον. «Наливать» — естественная русская конкретизация действия помещения вина в сосуды и не меняет смысла.'
