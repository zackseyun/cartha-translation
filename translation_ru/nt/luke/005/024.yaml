source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: ru
  text: '«Но чтобы вы знали, что Сын Человеческий[a] имеет власть на земле прощать грехи…» — сказал Он парализованному человеку. — «Тебе говорю: встань, возьми свою подстилку[b] и иди домой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сын человека». Это самоназвание Иисуса сохраняет важные библейские ассоциации, особенно с Дан. 7.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «своё ложе». Греческое слово обозначает небольшую постель, тюфяк или подстилку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Но чтобы вы знали
  rationale: Передаёт мягкий контраст δέ и целевую конструкцию ἵνα с глаголом знания естественным современным русским оборотом.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет традиционное самоназвание Иисуса и его библейские, в частности данииловы, ассоциации, не сводя выражение к однозначному толкованию.
- source_word: ἐξουσίαν ἔχει
  choice: имеет власть
  rationale: ἐξουσία обозначает законное право и полномочие, а не только способность или силу.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Прямой и естественный перевод пространственного выражения без пояснительного расширения.
- source_word: ἀφιέναι ἁμαρτίας
  choice: прощать грехи
  rationale: В данном споре ἀφίημι означает отпускать, то есть прощать, грехи.
- source_word: τῷ παραλελυμένῳ
  choice: парализованному
  rationale: Субстантивированное причастие естественно передаётся обозначением человека по его состоянию; контекст ясно указывает на мужчину.
- source_word: Σοὶ λέγω
  choice: Тебе говорю
  rationale: Вынесенное вперёд местоимение сохраняет эмфатический порядок и прямоту обращения.
- source_word: ἔγειρε
  choice: встань
  rationale: Ясный современный императив, обозначающий немедленное поднятие.
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: возьми свою подстилку
  rationale: Причастие по функции передано однородным повелением; κλινίδιον обозначает небольшое ложе, тюфяк или подстилку.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: иди домой
  rationale: Естественно передаёт движение к своему дому без ненужной буквальной тяжеловесности.
theological_decisions:
- issue: Передача ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек / Тот, кто является человеком
  rationale: Традиционная титульная форма сохраняет христологическую и межтекстовую напряжённость выражения, особенно связь с Дан 7, не устраняя его человеческого смысла.
- issue: Смысл ἐξουσία применительно к прощению грехов
  choice: власть
  alternative: сила
  rationale: Контекст касается права и полномочия прощать грехи, а исцеление служит подтверждением этого права; «сила» могла бы сузить смысл до способности совершить чудо.
- issue: Отнесение ἐπὶ τῆς γῆς
  choice: на земле
  alternative: в земной сфере
  rationale: Буквенно-естественная формулировка сохраняет возможный объём связи выражения как с властью Сына Человеческого, так и с прощением, не добавляя толкования.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Традиционное «Сын Человеческий» сохранено как узнаваемое библейское наименование. Реплика оформлена естественной прямой речью; многоточие перед авторским пояснением отражает синтаксический разрыв исходной фразы.
