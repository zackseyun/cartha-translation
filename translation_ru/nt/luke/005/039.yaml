  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: ru
  text: 'И никто, выпив старого вина, не хочет молодого, ведь он говорит: «Старое — хорошее».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Старое лучше».'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: никто
  rationale: Естественно передаёт обобщённое отрицание без гендерного уточнения.
- source_word: πιὼν
  choice: выпив
  rationale: Деепричастие естественно выражает действие, предшествующее желанию, как и греческий аористный причастный оборот.
- source_word: παλαιὸν
  choice: старого вина
  rationale: Существительное «вино» подразумевается контекстом; в русском его необходимо добавить, чтобы субстантивированное прилагательное в родительном падеже звучало ясно и естественно.
- source_word: θέλει
  choice: не хочет
  rationale: θέλω здесь обозначает желание или предпочтение; «не хочет» — прямой и современный эквивалент.
- source_word: νέον
  choice: молодого
  rationale: В контексте вина естественная русская пара — «старое / молодое вино». Существительное оставлено подразумеваемым, вслед за греческим текстом.
- source_word: λέγει γάρ
  choice: потому что говорит
  rationale: Передаёт объяснительную функцию γάρ и естественно вводит прямую речь.
- source_word: Ὁ παλαιὸς
  choice: Старое
  rationale: 'Сохраняет греческий эллипсис: речь по контексту идёт о старом вине.'
- source_word: χρηστός
  choice: хорошее
  rationale: Передаёт положительную оценку «хорошее, приятное» без внесения сравнительной степени, которой в основном тексте SBLGNT нет.
theological_decisions:
- issue: Передача χρηστός в изречении о старом и молодом вине
  choice: хорошее
  alternative: лучше
  rationale: Основной греческий текст имеет положительную степень χρηστός, а не сравнительную. Вариант «лучше» не следует вводить в основной текст; его следует отметить в сноске как разночтение. Решение сохраняет смысловую напряжённость притчи и не навязывает её богословское истолкование.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. «Молодое вино» — естественное русское обозначение нового вина; конструкция «Старое — хорошее» намеренно сохраняет положительную, а не сравнительную оценку исходного текста.
