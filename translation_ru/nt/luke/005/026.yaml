base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: ru
  text: 'Всех охватило изумление, и они прославляли Бога. Они исполнились страха и говорили: «Сегодня мы видели необычайные вещи!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «необыкновенные вещи» или «удивительные вещи»; греческое слово означает то, что выходит за пределы обычных ожиданий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις ἔλαβεν ἅπαντας
  choice: Всех охватило изумление
  rationale: Передаёт яркую греческую конструкцию естественным современным русским языком; ἔκστασις здесь означает ошеломляющее изумление, а не мистический экстаз.
- source_word: ἐδόξαζον τὸν θεόν
  choice: они прославляли Бога
  rationale: Несовершенный вид «прославляли» отражает длительный характер имперфекта и сохраняет прямое значение δοξάζω.
- source_word: ἐπλήσθησαν φόβου
  choice: они исполнились страха
  rationale: Прямо передаёт пассивную конструкцию и не смягчает φόβος до одного лишь благоговения.
- source_word: λέγοντες
  choice: говорили
  rationale: Естественно вводит прямую речь и в контексте передаёт сопутствующее действие причастия.
- source_word: Εἴδομεν
  choice: мы видели
  rationale: Русское прошедшее время естественно выражает непосредственную реакцию на только что увиденное.
- source_word: παράδοξα
  choice: необычайное
  rationale: Субстантивированное прилагательное среднего рода множественного числа обозначает явления, выходящие за пределы обычного ожидания; русское собирательное единственное число звучит естественно.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямо сохраняет временную непосредственность высказывания.
theological_decisions:
- issue: Оттенок φόβος в реакции на действие Бога
  choice: страх
  alternative: благоговение, трепет
  rationale: Слово сохранено в его прямом значении, чтобы не устранять напряжение между страхом и прославлением Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Разделение первой греческой фразы на два русских предложения улучшает ясность без изменения смысловых связей.
