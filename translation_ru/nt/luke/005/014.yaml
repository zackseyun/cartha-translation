  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: ru
  text: И Он велел ему никому не рассказывать, а пойти, показаться священнику и принести за своё очищение то, что повелел Моисей[b], — как свидетельство для них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «им во свидетельство». Неясно, кого именно обозначает «им» и имеется ли в виду свидетельство для них или против них.'
    reason: alternative_reading
  - marker: b
    text: Предписания Моисеева закона об очищении после кожного заболевания и необходимых приношениях см. в Левит 14.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: велел
  rationale: Передаёт прямое авторитетное распоряжение естественным современным русским языком, не усиливая глагол наречием «строго».
- source_word: μηδενὶ εἰπεῖν
  choice: никому не рассказывать
  rationale: Идиоматично передаёт запрет сообщать о случившемся; инфинитив сохранён при глаголе распоряжения.
- source_word: ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: пойди, покажись священнику
  rationale: Естественно передаёт предшествующее движение и последующее повеление; «покажись» точно и по-русски выражает δεῖξον σεαυτόν.
- source_word: προσένεγκε περὶ τοῦ καθαρισμοῦ σου
  choice: принеси за своё очищение
  rationale: В культовом контексте προσφέρω означает принесение предписанного дара или жертвы; формулировка не добавляет предмет, не названный в данном стихе.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: то, что повелел Моисей
  rationale: По-русски ясно связывает повеление Моисея с требуемым приношением и сохраняет отсылку к Закону.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: как свидетельство для них
  rationale: Близко передаёт целевую конструкцию и оставляет неопределёнными как референт местоимения, так и благоприятный либо обличительный характер свидетельства.
theological_decisions:
- issue: Референт и смысл εἰς μαρτύριον αὐτοῖς
  choice: «как свидетельство для них» без уточнения, кто именно имеется в виду
  alternative: «как свидетельство священникам» или «как свидетельство против них»
  rationale: Греческий текст не называет группу и не определяет однозначно направленность свидетельства; перевод сохраняет эту подлинную неоднозначность.
- issue: Характер очищения
  choice: «очищение», а не поясняющее «очищение от проказы»
  alternative: «очищение от проказы»
  rationale: Контекст объясняет ситуацию, но сам стих использует общее τοῦ καθαρισμοῦ σου; конкретизация вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Прямая речь введена для естественной передачи перехода от косвенного запрета к греческим императивам; местоимение «Он» оформлено по принятой русской библейской традиции.
