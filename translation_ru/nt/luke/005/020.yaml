base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: ru
  text: 'Увидев их веру[a], Он сказал: «Человек, тебе прощены твои грехи[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверие». В греческом тексте — «вера».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая форма может подчёркивать нынешнее состояние как результат уже совершившегося действия: «твои грехи уже прощены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие сохраняет структуру греческой фразы и естественно передаёт обстоятельство, на фоне которого Иисус произносит слова.
- source_word: πίστιν
  choice: веру
  rationale: Стандартный и контекстуально уместный эквивалент; здесь речь о доверии, проявившемся в поступках.
- source_word: αὐτῶν
  choice: их
  rationale: Сохраняет множественное число и не сужает круг лиц до одних носильщиков или одного больного.
- source_word: Ἄνθρωπε
  choice: Человек
  rationale: Прямо передаёт обращение в звательном употреблении, не добавляя отсутствующей в оригинале теплоты слова «друг» или социальной окраски слова «господин».
- source_word: ἀφέωνταί
  choice: прощены
  rationale: Краткая русская форма естественно выражает достигнутое состояние, обозначенное греческим перфектом страдательного залога.
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Прямой общеупотребительный эквивалент, сохраняющий нравственно-богословский смысл.
- source_word: σοι ... σου
  choice: тебе ... твои
  rationale: 'Оба местоимения переданы по-русски: дательный указывает на того, кому даровано прощение, а притяжательное — чьи грехи прощены.'
theological_decisions:
- issue: Круг лиц в выражении «их вера»
  choice: Сохранено множественное «их» без уточнения, относится ли оно к больному вместе с сопровождавшими его или прежде всего к принёсшим его людям.
  alternative: Истолковать выражение исключительно как веру носильщиков либо как совместную веру всей группы.
  rationale: Греческое αὐτῶν имеет множественное число, но не разрешает вопрос о точном составе подразумеваемой группы; перевод сохраняет эту неоднозначность.
- issue: Временной и декларативный оттенок прощения
  choice: «прощены тебе» передаёт наличное состояние прощения, не уточняя его временную механику.
  alternative: «прощаются тебе» как подчёркнуто совершающееся действие или «были прощены» как явно предшествовавшее событие.
  rationale: Перфект страдательного залога указывает на состояние как результат совершённого действия, но сам по себе не требует догматически уточнять момент или механизм прощения.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной близостью к греческому синтаксису. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции; порядок «прощены тебе грехи твои» сохраняет личную направленность высказывания и звучит естественно в возвышенном повествовании.
