id: LUK.5.32
reference: Luke 5:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: ru
  text: Я пришёл призвать не праведников, а грешников к покаянию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для покаяния». Греческий оборот εἰς μετάνοιαν указывает на цель или направленность призыва.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Я пришёл
  rationale: Греческий перфект обозначает совершившийся приход с сохраняющимся результатом; в русском высказывании о цели миссии естественно и точно звучит «Я пришёл».
- source_word: καλέσαι
  choice: призвать
  rationale: Инфинитив выражает цель прихода. «Призвать» сохраняет смысл обращения-зова, не сводя его только к приглашению или приказу.
- source_word: δικαίους
  choice: праведников
  rationale: Субстантивированное прилагательное передано существительным; формулировка не уточняет, действительно ли эти люди праведны или лишь считаются таковыми.
- source_word: ἁμαρτωλούς
  choice: грешников
  rationale: Прямое и общепонятное соответствие греческому обозначению людей, характеризуемых как грешники.
- source_word: εἰς μετάνοιαν
  choice: к покаянию
  rationale: Оборот с εἰς выражает цель или направленность призыва. «К покаянию» естественно по-русски и сохраняет существительное μετάνοια, не сужая его до одного лишь интеллектуального изменения мнения.
theological_decisions:
- issue: Отрицает ли Иисус существование действительно праведных людей или говорит о тех, кто считается праведным
  choice: Сохранить прямое противопоставление «праведников» и «грешников» без поясняющих добавлений.
  alternative: «тех, кто считает себя праведным» или «тех, кого считают праведными»
  rationale: В самом стихе нет явного уточнения или маркера иронии; добавление разрешило бы сохраняемое оригиналом богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; лаконичная, достоинственная формулировка. «Покаяние» является естественным и семантически ёмким соответствием μετάνοια в данном контексте.
