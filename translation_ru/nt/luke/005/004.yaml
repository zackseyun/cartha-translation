lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: Когда он закончил говорить
  rationale: Оборот обозначает завершение продолжавшейся речи и переход к следующему событию; эта формулировка естественна для современного русского повествования.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: сказал Симону
  rationale: Прямая и нейтральная передача греческого оборота без усиления значения глагола.
- source_word: Ἐπανάγαγε
  choice: Отплыви
  rationale: В данном контексте глагол означает отвести лодку от берега; единственное число сохраняет обращение непосредственно к Симону.
- source_word: εἰς τὸ βάθος
  choice: на глубину
  rationale: Устойчивое русское выражение для движения лодки к глубокой воде; примечание сохраняет буквальный образ греческого текста.
- source_word: χαλάσατε
  choice: опустите
  rationale: Глагол описывает опускание сетей с лодки; множественное число сохраняет переход от повеления Симону к обращению к нескольким людям.
- source_word: τὰ δίκτυα ὑμῶν
  choice: ваши сети
  rationale: Явно передаёт притяжательное местоимение и множественное число исходного текста.
- source_word: εἰς ἄγραν
  choice: для улова
  rationale: Передаёт цель действия и рыболовный смысл существительного ἄγρα кратко и естественно.
