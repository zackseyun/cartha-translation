  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: ru
  text: 'Но Иисус, узнав их помыслы[a], сказал им в ответ: «Почему вы так рассуждаете в своих сердцах?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распознав их внутренние рассуждения».'
    reason: Лексическая альтернатива отражает более активный оттенок ἐπιγνοὺς и смысл διαλογισμούς как процесса рассуждения.
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: узнав
  rationale: Передаёт совершившееся осознание Иисусом их внутренних рассуждений, не уточняя, каким образом Он это узнал.
- source_word: δὲ
  choice: Но
  rationale: Обозначает мягкий контраст и переход от скрытых возражений книжников и фарисеев к ответу Иисуса.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: их помыслы
  rationale: «Помыслы» естественно обозначает внутренние, в данном контексте критические рассуждения и сохраняет связь с библейским языком сердца.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: сказал им в ответ
  rationale: Естественная современная русская передача греческой повествовательной формулы «ответив, сказал им» без тяжеловесного повтора.
- source_word: Τί διαλογίζεσθε
  choice: Почему вы так рассуждаете
  rationale: В данном вопросе τί имеет значение причины — «почему»; «так» естественно указывает на уже упомянутый ход их мыслей, не определяя его содержание сверх контекста.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: в своих сердцах
  rationale: Сохраняет библейское представление о сердце как центре мысли и воли, не сводя его лишь к чувствам.
theological_decisions:
- issue: Природа знания Иисуса о внутренних помыслах людей
  choice: Прямо сообщить, что Иисус узнал их помыслы, не объясняя способ этого знания.
  alternative: Уточнить, что Он сверхъестественно узнал их мысли, либо ослабить утверждение до догадки.
  rationale: Греческий текст утверждает осведомлённость Иисуса, но не раскрывает её механизм; перевод сохраняет эту богословскую недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Выражение «в своих сердцах» намеренно сохранено, а семитизированная формула «ответив, сказал» естественно передана как «сказал им в ответ».
