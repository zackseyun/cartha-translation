id: LUK.5.29
reference: Luke 5:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: ru
  text: Левий устроил для Него большой пир у себя в доме. Там возлежало за столом вместе с ними[a] множество сборщиков налогов и других людей.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с ними». Множественное местоимение может относиться к участникам трапезы как к группе; по смыслу возможна также передача «вместе с Ним», то есть с Иисусом.'
    reason: alternative_reading
  - marker: b
    text: Во время торжественных трапез в древнем Средиземноморье было принято не сидеть, а возлежать у стола.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: большой пир
  rationale: δοχή обозначает устроенный приём или праздничную трапезу; «большой пир» естественно и ёмко передаёт значительность события.
- source_word: αὐτῷ
  choice: для Него
  rationale: Местоимение относится к Иисусу из ближайшего контекста; сохранение местоимения соответствует связности греческого текста.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: у себя в доме
  rationale: Оборот ясно указывает на дом Левия; русское «у себя в доме» естественно передаёт возвратное отношение αὐτοῦ к подлежащему.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: множество сборщиков налогов
  rationale: ὄχλος πολύς означает многочисленную группу; «множество» в этом контексте звучит естественнее буквального «большая толпа», а «сборщики налогов» ясно передаёт τελῶναι.
- source_word: ἄλλων
  choice: других людей
  rationale: Субстантивированное «других» по-русски допускает двусмысленность; добавление общего слова «людей» проясняет грамматику, не уточняя их身份 или общественное положение.
- source_word: μετ’ αὐτῶν
  choice: вместе с ними
  rationale: Сохранено множественное местоимение греческого текста. Его точный круг референции не вполне однозначен, поэтому это отмечено в сноске.
- source_word: κατακείμενοι
  choice: возлежало за столом
  rationale: Глагол обозначает принятую в древности позу участников трапезы; выражение сохраняет историческую картину и явно указывает на застолье.
theological_decisions:
- issue: Референция местоимения μετ’ αὐτῶν
  choice: вместе с ними
  alternative: вместе с Ним
  rationale: Греческая форма имеет множественное число и потому должна быть сохранена в основном тексте. Возможное понимание трапезы как сосредоточенной вокруг Иисуса не следует превращать в единственное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Возлежало за столом» сохранено как исторически точное выражение и пояснено культурной сноской; синтаксис разделён на два предложения для естественного русского звучания.
