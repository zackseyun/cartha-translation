  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: ru
  text: И никто не наливает молодое вино в старые мехи[a]. Иначе молодое вино прорвёт мехи, само разольётся, и мехи будут испорчены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мехи — кожаные сосуды, обычно использовавшиеся для хранения вина.
    reason: historical_clarification
lexical_decisions:
- source_word: βάλλει
  choice: наливает
  rationale: Хотя глагол буквально имеет широкое значение «класть, помещать», применительно к вину и сосуду естественное русское соответствие — «наливать».
- source_word: οἶνον νέον
  choice: молодое вино
  rationale: В данном контексте νέος обозначает недавно приготовленное, ещё продолжающее бродить вино; по-русски это естественно передаётся как «молодое вино».
- source_word: ἀσκοὺς παλαιούς
  choice: старые мехи
  rationale: ἀσκός — сосуд из кожи для хранения жидкостей; традиционное и понятное русское название такого сосуда — «мех».
- source_word: εἰ δὲ μήγε
  choice: Иначе
  rationale: 'Кратко и естественно передаёт условное следствие: если всё же так поступить.'
- source_word: ῥήξει
  choice: прорвёт
  rationale: Глагол обозначает разрыв сосуда под воздействием вина; «прорвёт» ясно сохраняет причинную конструкцию, в которой вино выступает действующим субъектом.
- source_word: καὶ αὐτός
  choice: само
  rationale: Местоимение относится к вину и несёт усиление; форма «само» сохраняет это ударение без тяжеловесного повтора.
- source_word: ἐκχυθήσεται
  choice: разольётся
  rationale: Будущая пассивная форма описывает вытекание и потерю вина из прорванных мехов; русское возвратное «разольётся» естественно передаёт результат.
- source_word: ἀπολοῦνται
  choice: пропадут
  rationale: Для мехов глагол означает утрату, порчу и непригодность, а не буквальную гибель; «пропадут» сохраняет широкий оттенок уничтожения или потери.
- source_word: οὐδεὶς
  choice: никто
  rationale: Прямое и стилистически нейтральное соответствие, подходящее для формы общего изречения.
