source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: ru
  text: И вот однажды Он учил, а фарисеи и учители Закона сидели там; они пришли из всех селений Галилеи и Иудеи и из Иерусалима. И сила Господа была с Ним, чтобы Он исцелял.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «чтобы исцелять их».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: И вот однажды
  rationale: Естественно передаёт характерную для Луки формулу введения нового события без архаичного «и случилось в один из дней».
- source_word: αὐτὸς ἦν διδάσκων
  choice: Он учил
  rationale: Передаёт продолженное действие перифрастической конструкции; αὐτός здесь не требует усилительного «Сам».
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: фарисеи и учители Закона
  rationale: «Фарисеи» — устоявшееся название группы; «учители Закона» прямо передаёт составное существительное и сохраняет связь с Моисеевым Законом.
- source_word: ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: из всех селений Галилеи и Иудеи и из Иерусалима
  rationale: «Селения» соответствует κώμη и естественнее сочетается с обобщающим указанием на обе области; повтор «из» перед названием города проясняет географическую конструкцию.
- source_word: δύναμις κυρίου
  choice: сила Господа
  rationale: Сохраняет родительную конструкцию и богословскую весомость выражения, не сужая референт κυρίου сверх текста.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: была с Ним, чтобы исцелять
  rationale: Русская формулировка естественно связывает αὐτόν с Иисусом и передаёт целевую направленность εἰς τὸ с инфинитивом, не добавляя отсутствующего в принятом тексте объекта «их».
theological_decisions:
- issue: Смысл выражения δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Сила Господа была с Иисусом, чтобы Он исцелял; объект исцеления не назван.
  alternative: Сила Господа была, чтобы исцелять их.
  rationale: В SBLGNT стоит αὐτόν, а не множественное αὐτούς. Перевод не вводит «их» в основной текст и сохраняет представленную здесь связь силы Господа с исцеляющим служением Иисуса, не уточняя способ этой связи сверх синтаксиса.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Начальное «И вот однажды» сохраняет повествовательный переход без тяжеловесного буквализма. Заглавные буквы в «Он» и «Ним» следуют принятой русской библейской издательской традиции; «Закон» обозначает Моисеев Закон.
