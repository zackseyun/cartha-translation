source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: ru
  text: 'а также Иакова и Иоанна, сыновей Зеведея, которые были партнёрами Симона. Иисус сказал Симону: «Не бойся! Отныне ты будешь ловить людей живыми».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь брать людей живыми». Греческий глагол означает поймать или захватить живым, а не умертвить.'
    reason: lexical_alternative
  - marker: b
    text: 'Ср. Мф. 4:19; Мк. 1:17, где сказано: «Я сделаю вас ловцами людей». Здесь Лука употребляет иной глагол; перевод сохраняет отличие его формулировки от параллельных мест.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: а также
  rationale: Передаёт добавочное и сопоставительное значение оборота и естественно продолжает мысль предыдущего стиха, где говорится об изумлении Симона и бывших с ним.
- source_word: υἱοὺς Ζεβεδαίου
  choice: сыновей Зеведея
  rationale: Точно и естественно передаёт родственную связь и традиционную форму имени.
- source_word: κοινωνοὶ
  choice: партнёрами
  rationale: В контексте совместного рыбного промысла слово обозначает участников общего дела, а не просто друзей или спутников.
- source_word: Μὴ φοβοῦ
  choice: Не бойся!
  rationale: Естественная современная русская формула ободрения, сохраняющая силу греческого запрета.
- source_word: ἀπὸ τοῦ νῦν
  choice: Отныне
  rationale: Кратко и выразительно обозначает решительный переход к новому призванию Симона.
- source_word: ἀνθρώπους
  choice: людей
  rationale: Греческое слово здесь относится к людям вообще, а не только к мужчинам.
- source_word: ζωγρῶν
  choice: будешь ловить людей живыми
  rationale: Глагол означает брать или захватывать живыми; выбранная формулировка сохраняет образ ловли и присущий Луке оттенок сохранения жизни.
theological_decisions:
- issue: Передача метафоры ζωγρέω в обращении Иисуса к Симону
  choice: будешь ловить людей живыми
  alternative: будешь ловить людей; станешь ловцом людей
  rationale: Лука употребляет не обычное выражение о «ловцах людей», известное по параллельным местам, а глагол со значением «брать живыми». Перевод сохраняет своеобразие и напряжённость метафоры, не уподобляя её формулировке Матфея и Марка.
- issue: Передача общего значения ἀνθρώπους
  choice: людей
  alternative: мужчин; человеков
  rationale: В данном контексте речь идёт обо всех людях; современное русское «людей» точно передаёт реальный охват слова без ненужного ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с достойной, но понятной речью. Начальное «а также» намеренно сохраняет синтаксическую связь с предыдущим стихом. «Партнёрами» передаёт деловое сотрудничество в рыбном промысле; «живыми» удерживает характерный для Луки смысловой оттенок.
