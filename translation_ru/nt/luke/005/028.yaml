  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: ru
  text: И, оставив всё[a], он встал и последовал за Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и, оставив всё, встав, следовал за Ним».'
    reason: Сноска точно отражает два аористных причастия (καταλιπών, ἀναστάς) перед основным глаголом в имперфекте (ἠκολούθει), не выдавая чисто стилистическое опущение местоимения за переводческую альтернативу.
lexical_decisions:
- source_word: καταλιπὼν
  choice: оставив
  rationale: 'Аористное причастие передаёт действие, предшествующее основному: Левий оставил прежнее и затем последовал за Иисусом. Русское «оставив» естественно и не усиливает смысл до «бросив» или «отрёкшись».'
- source_word: πάντα
  choice: всё
  rationale: Средний род множественного числа с обобщающим значением передан кратким и естественным русским «всё».
- source_word: ἀναστὰς
  choice: встал
  rationale: В повествовательном контексте причастие от ἀνίστημι обозначает, что человек поднялся, чтобы действовать; «встал» точно и естественно.
- source_word: ἠκολούθει
  choice: последовал
  rationale: Имперфект может изображать начавшееся и продолжавшееся следование, однако в данном призывном эпизоде русское совершенное «последовал» естественно обозначает решительный переход к ученичеству, не вводя отдельного значения «начал», которого лексически нет.
- source_word: αὐτῷ
  choice: за Ним
  rationale: Глагол «следовать» в русском языке при указании лица естественно требует конструкции «за» с творительным падежом. Местоимение сохраняет связь с Иисусом из контекста без повторения имени.
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет непосредственную повествовательную связь с предыдущим призывом.
theological_decisions:
- issue: Объём отказа Левия ради следования за Иисусом
  choice: Сохранено всеобъемлющее «оставив всё» без уточнения длительности или имущественных последствий.
  alternative: «Оставив свою работу» либо формулировка о полном и постоянном отказе от всякой собственности.
  rationale: πάντα подчёркивает решительность ответа, но стих сам по себе не определяет, означает ли это постоянное отчуждение всего имущества или только оставление прежнего положения в данный момент.
translation_notes:
  register: Современный литературный русский язык, простой и достойный повествовательный стиль. Заглавная буква в местоимении «Ним» употреблена как традиционный знак уважения к Иисусу, не меняющий смысла исходного текста.
