  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: ru
  text: И увидел Он две лодки, стоявшие у озера; рыбаки же, выйдя из них, мыли сети.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: увидел
  rationale: Аорист ὁράω в повествовании естественно передаётся совершенным видом «увидел», без добавочного оттенка внезапности.
- source_word: δύο πλοῖα
  choice: две лодки
  rationale: В контексте рыбной ловли на озере πλοῖον означает лодку; «судна» было бы менее естественно для современного читателя.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: у берега озера
  rationale: Оборот описывает неподвижно находившиеся возле озера лодки. По-русски «стоявшие у озера» звучит неестественно, а «у берега озера» ясно и без излишней конкретизации передаёт положение лодок.
- source_word: οἱ δὲ ἁλιεῖς
  choice: рыбаки же
  rationale: Частица δέ обозначает лёгкое противопоставление или смену фокуса; постпозитивное «же» сохраняет это движение мысли без чрезмерно сильного «но».
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: выйдя из них
  rationale: Аористное причастие обозначает действие, предшествующее мытью сетей; деепричастный оборот естественно сохраняет греческую структуру, а местоимение относится к лодкам.
- source_word: ἔπλυνον
  choice: промывали
  rationale: Имперфект передаёт продолжающееся действие в описываемой сцене. «Промывали» идиоматично применительно к очистке рыболовных сетей и сохраняет значение πλύνω.
- source_word: τὰ δίκτυα
  choice: сети
  rationale: Определённый артикль не требует отдельного выражения по-русски; притяжательное «свои» в греческом тексте отсутствует.
