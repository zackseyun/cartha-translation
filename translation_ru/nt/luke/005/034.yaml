  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: ru
  text: 'Он же сказал им: «Разве вы можете заставить гостей на свадьбе[a] поститься, пока с ними жених?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов брачного чертога» — устойчивое выражение, обозначающее спутников жениха или участников свадебного торжества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Разве вы можете…?
  rationale: Вопрос с μή предполагает отрицательный ответ. Русская конструкция с «разве» естественно передаёт ожидаемое «нет», не превращая вопрос в утверждение.
- source_word: τοὺς υἱοὺς τοῦ νυμφῶνος
  choice: гостей на свадьбе
  rationale: Буквально «сынов брачного чертога» — семитический оборот, обозначающий участников свадебного торжества, прежде всего спутников жениха. Идиоматический перевод понятен современному читателю.
- source_word: νυμφίος
  choice: жених
  rationale: Прямой и естественный русский эквивалент, сохраняющий значимый для изречения свадебный образ.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: с ними
  rationale: Кратко и непосредственно передаёт присутствие жениха вместе с участниками свадебного торжества.
- source_word: ποιῆσαι νηστεῦσαι
  choice: заставить… поститься
  rationale: Сочетание ποιέω с инфинитивом имеет каузативный смысл. «Заставить… поститься» сохраняет его, в отличие от перевода, где говорится лишь о способности гостей поститься.
theological_decisions:
- issue: Метафорическое отождествление Иисуса с женихом
  choice: Сохранить образ жениха без богословского пояснения в основном тексте.
  alternative: Прямо пояснить, что Иисус говорит о Себе как о женихе.
  rationale: Само изречение подразумевает особую роль Иисуса, однако перевод должен сохранять метафору и не подменять её толкованием.
translation_notes:
  register: Современный литературный русский язык; речь естественная и понятная, но сохраняет достоинство евангельского повествования. Порядок «Он же сказал» передаёт связку ὁ δὲ без излишней архаизации.
