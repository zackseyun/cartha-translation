  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: ru
  text: 'Он также рассказал им притчу: «Никто не отрывает лоскут от новой одежды и не накладывает его на старую одежду[a]. Иначе он и новую одежду порвёт, и лоскут от новой не подойдёт к старой одежде[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Никто, оторвав лоскут от новой одежды, не накладывает его на старую». В греческом тексте перед основным глаголом стоит причастие со значением предшествующего действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет соответствовать старой одежде». Греческий глагол может указывать на отсутствие соответствия, пригодности или сочетаемости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: И ещё Он говорил
  rationale: Имперфект ἔλεγεν передаёт продолжающуюся речь в повествовании; сочетание δὲ καὶ естественно выражено как «и ещё».
- source_word: παραβολὴν
  choice: притчу
  rationale: «Притча» — общепринятый и понятный русский эквивалент, сохраняющий обозначенный Лукой жанр.
- source_word: ἐπίβλημα
  choice: лоскут
  rationale: В контексте починки одежды речь идёт о куске ткани, используемом как заплата; «лоскут» естественно сочетается с глаголом «наложить».
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: от новой одежды
  rationale: ἱμάτιον обозначает предмет одежды; широкое слово «одежда» не сужает значение до плаща или иной конкретной вещи.
- source_word: σχίσας
  choice: не отрывает
  rationale: Аористное причастие буквально обозначает предшествующее действие («оторвав»), но в русском отрицательном обобщении естественнее однородная глагольная конструкция.
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: чтобы наложить его на старую
  rationale: Передано буквальное значение «помещать/накладывать на» без добавления не названного прямо способа крепления, например шитья.
- source_word: εἰ δὲ μήγε
  choice: Иначе
  rationale: Кратко и естественно вводит последствия описанного неразумного действия.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: он и новую одежду порвёт
  rationale: 'Будущее активного залога сохраняет подразумеваемого человека как субъект: отрывая лоскут, он портит новую одежду.'
- source_word: οὐ συμφωνήσει
  choice: не подойдёт
  rationale: В данном контексте συμφωνέω обозначает несоответствие или непригодность; «не подойдёт» сохраняет смысловую широту, не сводя её только к цвету или внешнему виду.
