base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: ru
  text: Войдя в одну из лодок, принадлежавшую Симону, Иисус попросил его немного отплыть от берега[a]. Затем он сел и учил народ из лодки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от суши». В греческом тексте буквально: «от земли»; здесь это противопоставление лодке, находящейся на воде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: войдя
  rationale: Аористное причастие передаёт действие, предшествующее просьбе; «войдя» естественно и конкретно описывает посадку в лодку.
- source_word: πλοίων / πλοίου
  choice: лодок / лодки
  rationale: В контексте рыбной ловли на озере речь идёт о небольших судах; «лодка» точнее естественного русского контекста, чем «корабль».
- source_word: ὃ ἦν Σίμωνος
  choice: принадлежавшую Симону
  rationale: Родительный падеж Σίμωνος выражает принадлежность; оборот ясно и современно передаёт этот смысл.
- source_word: ἠρώτησεν
  choice: попросил
  rationale: В данном контексте ἐρωτάω означает просьбу совершить действие; «попросил» естественнее русского «спросил» с инфинитивом.
- source_word: ἐπαναγαγεῖν
  choice: отплыть
  rationale: В контексте лодки глагол означает отвести её от суши или выйти от берега; «отплыть» кратко и ясно передаёт движение по воде.
- source_word: ἀπὸ τῆς γῆς
  choice: от берега
  rationale: Буквально «от земли/суши», но в озёрном контексте естественное русское обозначение точки удаления — «от берега».
- source_word: ὀλίγον
  choice: немного
  rationale: Передаёт небольшую степень или расстояние, не уточняя его сверх греческого текста.
- source_word: καθίσας
  choice: затем Он сел
  rationale: Аористное причастие обозначает действие, предшествующее продолжающемуся учению; отдельная русская клауза естественно передаёт последовательность.
- source_word: ἐδίδασκεν
  choice: учил
  rationale: Русский несовершенный вид сам выражает продолжавшееся действие, поэтому дополнительная прогрессивная конструкция не нужна.
- source_word: τοὺς ὄχλους
  choice: народ
  rationale: Греческое множественное число обозначает собравшиеся массы людей; в современном русском «народ» естественно передаёт коллективную аудиторию без архаичного оттенка слова «толпы».
theological_decisions:
- issue: Явное называние подлежащего
  choice: Иисус
  alternative: Он
  rationale: В изолированном стихе греческое подлежащее подразумевается из контекста; имя «Иисус» делает русский текст понятным, не меняя референта.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет последовательность действий и несовершенный характер процесса обучения; специальных конфессиональных формулировок нет.
