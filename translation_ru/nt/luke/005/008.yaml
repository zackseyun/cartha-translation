  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: ru
  text: 'Увидев это, Симон Пётр припал к коленям Иисуса и сказал: «Отойди от меня, Господи, потому что я грешный человек».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: Увидев это
  rationale: Аористное причастие передано естественным русским деепричастием. Местоимение «это» восполняет подразумеваемый из контекста объект — чудесный улов.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица обозначает переход в повествовании; в русском связь естественно передаётся последовательностью событий без обязательного союза. «Но» создало бы более резкое противопоставление, чем в греческом.
- source_word: Σίμων Πέτρος
  choice: Симон Пётр
  rationale: Сохранены оба имени, присутствующие в греческом тексте.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: припал к коленям Иисуса
  rationale: «Припал» естественно и выразительно передаёт движение к человеку и смиренную позу; «к коленям Иисуса» сохраняет конкретную телесную деталь оригинала.
- source_word: λέγων
  choice: и сказал
  rationale: Сочинённая личная форма звучит в современном русском естественнее буквального «говоря» и передаёт сопутствующее речевое действие.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Отойди от меня
  rationale: Императив выражает настойчивую просьбу об удалении. «Отойди» современно и сохраняет пространственный образ, не привнося оттенка изгнания.
- source_word: ὅτι
  choice: потому что
  rationale: Прямо вводит причину просьбы Петра и естественно звучит в современной русской речи.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: я грешный человек
  rationale: Сохраняется именная конструкция и самоопределение Петра. Русское «человек» здесь естественно относится к говорящему мужчине; отдельное «мужчина» звучало бы неидиоматично.
- source_word: κύριε
  choice: Господи
  rationale: Звательная форма «Господи» традиционна, понятна современному читателю и сохраняет почтение вместе с возможной богословской глубиной обращения.
theological_decisions:
- issue: Передача κύριε в обращении Симона Петра к Иисусу
  choice: Господи
  alternative: господин; учитель
  rationale: Контекст чудесного знамения, страха и исповедания греховности требует сильного почтительного обращения. «Господи» сохраняет возможную богословскую глубину, не утверждая сверх того, насколько полно Пётр в этот момент осознаёт личность Иисуса.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю, с dignified библейским звучанием без архаической перегруженности. Порядок фразы слегка приспособлен к русскому синтаксису; конкретность жеста и напряжение признания сохранены.
