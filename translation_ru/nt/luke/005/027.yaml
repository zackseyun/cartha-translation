  terminology: «Сборщик налогов» адекватно передаёт τελώνης, не сужая значение до одного вида сборов. «Место сбора налогов» нейтрально передаёт τελώνιον; варианты в примечании обоснованно отражают возможность пошлинного или таможенного контекста. Имя «Левий» передано нормативно. Богословский смысл повеления не расширен сверх текста.
