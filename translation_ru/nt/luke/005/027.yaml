  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: ru
  text: 'После этого он вышел и увидел[a] сборщика налогов по имени Левий, сидевшего у места сбора налогов[b], и сказал ему: «Следуй за мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заметил», «внимательно посмотрел на»; греческий глагол может подразумевать нечто большее, чем мимолётный взгляд.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у места сбора пошлин», «у таможенного поста».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: После этого
  rationale: Естественный русский повествовательный переход, передающий временную последовательность; буквальное «после этих вещей» в современном русском звучало бы тяжеловесно.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Сохраняет конкретное значение движения, выраженное глаголом ἐξέρχομαι, без более общего «ушёл».
- source_word: ἐθεάσατο
  choice: увидел
  rationale: В контексте это ясный и естественный эквивалент; возможный оттенок внимательного взгляда сохранён в примечании.
- source_word: τελώνην
  choice: сборщика налогов
  rationale: Понятно передаёт общественную роль τελώνης без излишне узкого уточнения о конкретном виде пошлины.
- source_word: ὀνόματι Λευὶν
  choice: по имени Левий
  rationale: Естественно передаёт греческую конструкцию с дательным падежом при ὄνομα.
- source_word: καθήμενον
  choice: сидевшего
  rationale: Причастие сохраняет наглядность сцены и согласуется со словом «сборщика».
- source_word: ἐπὶ τὸ τελώνιον
  choice: у места сбора налогов
  rationale: Нейтрально передаёт место, где взимались налоги или пошлины, не определяя его точнее, чем позволяет контекст.
- source_word: Ἀκολούθει μοι
  choice: Следуй за мной
  rationale: Прямая и естественная передача повеления, сохраняющая буквальный образ следования и его контекстуальную силу призыва.
theological_decisions:
- issue: Сила повеления Иисуса как призыва к ученичеству
  choice: «Следуй за мной» без поясняющего расширения
  alternative: «Стань моим учеником»
  rationale: Контекст подразумевает призыв к ученичеству, однако перевод сохраняет формулировку греческого текста и не подменяет её богословским пояснением.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Местоимения, относящиеся к Иисусу, даны со строчной буквы в соответствии с нейтральной современной орфографической практикой. Терминология не уточняет вид взимавшихся платежей сверх данных греческого текста.
