  source_fidelity: Перевод точно передаёт последовательность повествования, конкретное «вышел», обозначение Левия как τελώνης, его нахождение при τελώνιον и прямое повеление Ἀκολούθει μοι. «После этого» — естественная русская передача μετὰ ταῦτα без ненужной буквальности. Формулировка «у места сбора налогов» сохраняет неопределённость τελώνιον, которое могло означать пункт взимания налогов или пошлин.
