revisions:
- from: Тогда они подали знак своим товарищам в другой лодке, чтобы те пришли им помочь[a]. Те пришли, и они наполнили обе лодки так, что лодки стали погружаться[b].
  to: Они подали знак своим товарищам в другой лодке, чтобы те пришли им помочь[a]. Те пришли и наполнили обе лодки так, что они стали тонуть[b].
  rationale: Убрано необязательное «Тогда», поскольку καί здесь лишь продолжает повествование. «Стали тонуть» точнее и идиоматичнее передаёт результат ὥστε βυθίζεσθαι. Местоимение «они» после «обе лодки» однозначно относится к лодкам; повтор слова не требуется. Примечание a исправлено в соответствии с фактической греческой формой и оставляет значение совместной помощи без излишней конкретизации.
