  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: ru
  text: Они подали знак своим товарищам в другой лодке, чтобы те пришли им помочь[a]. Те пришли и наполнили обе лодки так, что они стали тонуть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы те пришли и помогли им вместе взяться за дело».'
    reason: Лексема συλλαβέσθαι обозначает присоединение к совместному действию; в данном контексте — помощь при работе с уловом.
  - marker: b
    text: 'Или: «так что лодки уже тонули».'
    reason: Настоящий инфинитив βυθίζεσθαι описывает наступивший, продолжающийся процесс; возможна как начинательная, так и процессуальная передача.
lexical_decisions:
- source_word: κατένευσαν
  choice: подали знак
  rationale: Передаёт жест или иной видимый сигнал на расстоянии и естественно звучит в контексте лодок.
- source_word: μετόχοις
  choice: товарищам
  rationale: Слово обозначает тех, кто участвует в общем деле; «товарищи» сохраняет этот смысл, не утверждая формально-деловой характер отношений.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: в другой лодке
  rationale: Естественно обозначает вторую из двух лодок в данной сцене.
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: чтобы те пришли им помочь
  rationale: Целевая конструкция передана естественным русским придаточным; συλλαβέσθαι здесь означает присоединиться к работе и помочь.
- source_word: ἔπλησαν
  choice: наполнили
  rationale: Сохраняет прямой образ исходного глагола; чем именно были наполнены лодки, ясно из контекста.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: обе лодки
  rationale: Точно и кратко передаёт ἀμφότερα.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: так, что лодки стали погружаться
  rationale: Передаёт наступивший процесс, не утверждая, что лодки полностью затонули; повтор существительного устраняет неясность русского местоимения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Подали знак» звучит естественнее буквального «кивнули». «Товарищи» сохраняет открытым, были ли это деловые партнёры или просто участники общего промысла. Слово «лодки» повторено в конце ради однозначности.
