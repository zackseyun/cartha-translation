  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: ru
  text: 'И фарисеи и их книжники роптали, обращаясь к его ученикам[a]: «Почему вы едите и пьёте со сборщиками налогов и грешниками?»'
