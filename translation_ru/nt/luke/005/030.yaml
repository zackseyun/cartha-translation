    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: роптали
  rationale: Имперфект передаёт продолжавшееся или повторявшееся недовольство; «роптали» сохраняет оттенок негромкой, неодобрительной жалобы.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и исторически точный русский термин для данной религиозно-правовой группы, без сведения их роли только к учительству.
- source_word: αὐτῶν
  choice: их
  rationale: 'Местоимение естественно связывает книжников с фарисеями: «их книжники».'
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: на его учеников
  rationale: В сочетании с русским глаголом «роптать» управление «на кого» естественно передаёт направленность недовольства и речи к ученикам.
- source_word: Διὰ τί
  choice: Почему
  rationale: Прямой и естественный русский вопросительный эквивалент.
- source_word: τελωνῶν
  choice: мытарями
  rationale: Устоявшееся евангельское обозначение сборщиков налогов и пошлин, сохраняющее историческую и социальную окраску.
- source_word: ἁμαρτωλῶν
  choice: грешниками
  rationale: Прямой эквивалент, сохраняющий оценочную категорию говорящих без поясняющей интерпретации.
- source_word: ἐσθίετε καὶ πίνετε
  choice: едите и пьёте
  rationale: Сохраняет конкретность двух греческих глаголов и естественно звучит в вопросе о регулярно наблюдаемом поведении.
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход исходного текста.
theological_decisions:
- issue: Социально-религиозный смысл совместной трапезы с «мытарями и грешниками»
  choice: Конкретное обвинение сохранено без поясняющего расширения
  alternative: Явно указать на предполагаемое ритуальное или нравственное осквернение
  rationale: Текст сам выражает напряжение через названия групп и совместное принятие пищи; уточнение природы возражения добавило бы не выраженное прямо толкование.
translation_notes:
  register: Современный литературный русский с умеренно традиционной евангельской лексикой («книжники», «мытари»). Формулировка сохраняет достоинство и ясность, а также продолженный оттенок имперфекта без тяжеловесной конструкции.
