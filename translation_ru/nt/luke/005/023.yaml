  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: ru
  text: 'Что легче сказать: «Твои грехи прощены[a]», или сказать: «Встань и ходи»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои грехи были прощены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Что легче
  rationale: Естественная русская формулировка сравнительного вопроса, точно передающая значение τί с εὐκοπώτερον.
- source_word: εἰπεῖν
  choice: сказать
  rationale: Инфинитив вводит содержание двух сопоставляемых высказываний; «сказать» здесь наиболее естественно.
- source_word: Ἀφέωνταί
  choice: прощены
  rationale: В контексте ἀφίημι означает прощение грехов. Краткая форма «прощены» передаёт наличное состояние как результат совершённого действия, не уточняя явно действующего лица.
- source_word: σοι / αἱ ἁμαρτίαι σου
  choice: твои грехи
  rationale: Русская конструкция естественно передаёт личное обращение и принадлежность; отдельное воспроизведение дательного σοι сделало бы фразу тяжеловесной и избыточной.
- source_word: ἢ
  choice: или
  rationale: Точно передаёт разделительное сопоставление двух высказываний.
- source_word: Ἔγειρε
  choice: Встань
  rationale: Естественный и достойный по стилю русский императив, обозначающий подъём человека.
- source_word: καὶ περιπάτει
  choice: и ходи
  rationale: Передаёт буквальное хождение и сохраняет форму повеления с продолженным значением настоящего императива.
theological_decisions:
- issue: Передача совершённо-пассивной формы Ἀφέωνταί без привнесения дополнительного догматического смысла
  choice: Твои грехи прощены
  alternative: Твои грехи были прощены
  rationale: Формулировка сохраняет декларативную силу и состояние, возникшее в результате прощения, но не называет действующее лицо и не заставляет русскую временную форму нести больше богословской нагрузки, чем греческий контекст.
translation_notes:
  register: Современный литературный русский язык; лаконичная, ясная и достойная речь. Сохранена риторическая симметрия двух вариантов, при этом повтор «сказать» отражает структуру греческого текста.
