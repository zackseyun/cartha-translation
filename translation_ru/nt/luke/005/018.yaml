  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: ru
  text: И вот несколько мужчин несли на постели[a] человека, который был парализован, и старались внести его и положить перед ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «на носилках» или «на ложе»; греческое κλίνη может обозначать постель, ложе или носилки.
    reason: lexical_alternative
  - marker: b
    text: То есть перед Иисусом.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Естественный русский повествовательный оборот, сохраняющий функцию привлечения внимания и оживляющий сцену.
- source_word: ἄνδρες
  choice: мужчины
  rationale: Передаёт прямое указание на взрослых мужчин, не заменяя его более общим словом «люди».
- source_word: φέροντες
  choice: несли
  rationale: По контексту обозначает продолжающееся действие; русский несовершенный вид естественно передаёт его длительность.
- source_word: ἐπὶ κλίνης
  choice: на постели
  rationale: κλίνη обозначает постель, ложе или подобный предмет; «постель» понятно современному читателю и не навязывает более узкого толкования «носилки».
- source_word: ἄνθρωπον
  choice: человека
  rationale: Сохраняет отдельное от ἄνδρες обозначение несомого человека и естественно сочетается с последующим придаточным.
- source_word: παραλελυμένος
  choice: был парализован
  rationale: Передаёт состояние, выраженное перфектным страдательным причастием, без добавления не указанной в тексте медицинской конкретики.
- source_word: ἐζήτουν
  choice: старались
  rationale: Передаёт продолжавшуюся попытку, выраженную имперфектом, и звучит естественнее буквального «искали возможности».
- source_word: εἰσενεγκεῖν
  choice: внести его
  rationale: Точно передаёт направленное внутрь перемещение и учитывает, что человека несли.
- source_word: θεῖναι
  choice: положить
  rationale: Контекст постели делает «положить» естественным русским соответствием «поместить», хотя сам греческий глагол не уточняет позу.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед ним
  rationale: Сохраняет местоимение исходного текста; личность Иисуса как референта поясняется в сноске.
theological_decisions:
- issue: К кому относится αὐτοῦ в конце стиха
  choice: перед ним
  alternative: перед Иисусом
  rationale: Из контекста ясно, что речь об Иисусе, однако греческий текст использует местоимение. Перевод сохраняет эту форму и не устраняет формальную неоднозначность заменой на имя.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским повествовательным оборотом «и вот». Синтаксис близок к греческому, но остаётся ясным и естественным; местоимение «ним» не капитализировано, поскольку такое написание не выражено в исходном тексте.
