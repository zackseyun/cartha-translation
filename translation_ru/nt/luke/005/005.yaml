  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: ru
  text: 'Симон ответил: «Наставник, мы трудились всю ночь и ничего не поймали; но по твоему слову[a] я опущу сети».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на основании твоего слова»; греческое выражение указывает на слово Иисуса как основание для действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: сказал ему в ответ
  rationale: Естественно передаёт греческую формулу введения прямой речи, не воспроизводя буквально избыточное для русского «ответив, сказал».
- source_word: Ἐπιστάτα
  choice: Наставник
  rationale: У Луки это особое обращение к Иисусу, признающее его авторитет; «Наставник» не подменяет его словом «Господь» и звучит естественно по-русски.
- source_word: δι’ ὅλης νυκτὸς
  choice: всю ночь
  rationale: Кратко и идиоматично передаёт продолжительность действия на протяжении целой ночи.
- source_word: κοπιάσαντες
  choice: трудились
  rationale: Передаёт напряжённый, изнурительный труд; в данном контексте естественнее буквального «утруждались».
- source_word: οὐδὲν ἐλάβομεν
  choice: ничего не поймали
  rationale: В контексте рыбной ловли λαμβάνω означает поймать; дополнение «рыбы» не требуется.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: но по твоему слову
  rationale: Сохраняет смысл слова Иисуса как основания для действия и не устраняет возможный оттенок послушания его повелению.
- source_word: χαλάσω
  choice: я опущу
  rationale: Будущее время и действие опускания сетей в воду переданы прямо и естественно.
- source_word: τὰ δίκτυα
  choice: сети
  rationale: Сохранено множественное число основного текста SBLGNT.
theological_decisions:
- issue: Передача обращения Ἐπιστάτα
  choice: Наставник
  alternative: Господин; Учитель; Господь
  rationale: В оригинале стоит ἐπιστάτης, а не κύριος. «Наставник» выражает признанный авторитет Иисуса, не внося в этот титул более определённый христологический смысл, чем допускает исходное слово.
- issue: Основание действия в ἐπὶ τῷ ῥήματί σου
  choice: по твоему слову
  alternative: по одному твоему слову; потому что ты сказал
  rationale: 'Выражение сохраняет лаконичность и допускает взаимосвязанные смыслы: действие на основании сказанного Иисусом и в послушании его слову.'
translation_notes:
  register: Современный литературный русский язык с dignified, но доступной библейской интонацией. Местоимения, обращённые к Иисусу, даны со строчной буквы по общему современному издательскому принципу. Порядок фраз сохраняет контраст между бесплодным ночным трудом и готовностью Симона поступить по слову Иисуса.
