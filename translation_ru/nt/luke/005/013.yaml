    text: 'Или, в более широком смысле, «кожная болезнь»: греческое слово λέπρα в библейском употреблении могло обозначать различные кожные заболевания, а не только современную болезнь Хансена.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: протянув руку
  rationale: Естественно передаёт предшествующее основному действию движение и сохраняет причастную структуру греческого текста.
- source_word: ἥψατο αὐτοῦ
  choice: прикоснулся к нему
  rationale: Возвратная форма русского глагола и управление дательным падежом естественно передают греческое ἅπτομαι с родительным объектом.
- source_word: εἰπών
  choice: и сказал
  rationale: Сочинительная конструкция звучит в современном русском естественнее буквального «говоря», не меняя последовательности действий.
- source_word: Θέλω
  choice: Хочу
  rationale: Кратко и прямо передаёт настоящее время и выраженную Иисусом волю; в контексте ответ означает готовность исполнить просьбу, но перевод не разворачивает это в пояснительную фразу.
- source_word: καθαρίσθητι
  choice: Очистись
  rationale: Сохраняет значение очищения, включающее физическое исцеление и снятие ритуальной нечистоты; русская возвратная форма здесь естественно передаёт греческий страдательный императив.
- source_word: εὐθέως
  choice: тотчас
  rationale: Достоинный и понятный литературный эквивалент со значением немедленности.
- source_word: ἡ λέπρα
  choice: проказа
  rationale: Традиционный и узнаваемый эквивалент; историческая широта значения греческого термина пояснена в сноске.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: сошла с него
  rationale: Естественное русское выражение исчезновения болезни, сохраняющее пространственный образ греческого оборота.
theological_decisions:
- issue: Передача καθαρίσθητι при исцелении человека с проказой
  choice: Очистись
  alternative: Исцелись; стань чистым
  rationale: «Очистись» сохраняет одновременно телесный, обрядовый и общественный аспекты события, не сводя смысл только к медицинскому исцелению.
- issue: Передача Θέλω
  choice: Хочу
  alternative: Я готов; да, хочу
  rationale: «Хочу» наиболее непосредственно соответствует греческому настоящему времени и сохраняет лаконичность ответа, тогда как «Я готов» истолковывает волю как готовность, а «да» добавляет отсутствующий в тексте элемент.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным повествованием. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции; реплика сохранена краткой и властной.
