  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: ru
  text: 'И, протянув руку, Он прикоснулся к нему и сказал: «Хочу. Очистись!» И тотчас проказа[a] сошла с него.'
  philosophy: optimal-equivalence
  footnotes:
