id: LUK.5.11
reference: Luke 5:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: ru
  text: Вытащив лодки на берег, они оставили всё и последовали за Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: вытащив
  rationale: Аористное причастие обозначает действие, предшествующее основным действиям. В контексте рыбацких лодок «вытащив» естественно передаёт перемещение лодок из воды на сушу.
- source_word: τὰ πλοῖα
  choice: лодки
  rationale: В контексте галилейского рыболовства πλοῖα естественно обозначает лодки, а не крупные суда.
- source_word: ἐπὶ τὴν γῆν
  choice: на берег
  rationale: Буквально выражение означает «на землю/сушу»; по-русски применительно к лодкам естественно сказать «на берег».
- source_word: ἀφέντες
  choice: оставили
  rationale: Причастие ἀφέντες здесь означает оставить или покинуть. Сочинённая конструкция с личной формой ясна и естественна по-русски, сохраняя последовательность действий.
- source_word: πάντα
  choice: всё
  rationale: Форма среднего рода множественного числа имеет всеохватный смысл. «Всё» кратко и естественно передаёт эту полноту, не уточняя сверх текста, что именно было оставлено.
- source_word: ἠκολούθησαν αὐτῷ
  choice: последовали за Ним
  rationale: Оборот передаёт как буквальное следование за Иисусом, так и подразумеваемое ученичество, не разъясняя его сверх исходного текста.
theological_decisions:
- issue: Объём отказа, выраженного словом πάντα
  choice: они оставили всё
  alternative: они оставили всё, что у них было
  rationale: «Всё» сохраняет категоричность и богословское напряжение исходного текста, но не добавляет утверждения о составе имущества или окончательности отказа.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и dignified. Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
