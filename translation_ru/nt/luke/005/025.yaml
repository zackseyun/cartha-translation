  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: ru
  text: И тотчас он встал перед ними, поднял то, на чём лежал[a], и ушёл к себе домой, прославляя Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднял подстилку, на которой лежал». Буквально: «то, на чём лежал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт действие без промедления и сохраняет характерный для Луки акцент на мгновенном исцелении.
- source_word: ἀναστὰς
  choice: он встал
  rationale: Формально это аористное причастие, но в естественном русском повествовании последовательность действий яснее передаётся личной формой глагола.
- source_word: ἐνώπιον αὐτῶν
  choice: перед ними
  rationale: Кратко и точно обозначает, что исцелённый встал публично, в присутствии собравшихся, без усиления до «у них на глазах».
- source_word: ἄρας
  choice: поднял
  rationale: Глагол обозначает поднятие предмета; русский вариант естественен в данном контексте и не добавляет отсутствующего в греческом тексте названия предмета.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: то, на чём лежал
  rationale: Сохраняет относительную конструкцию оригинала, где предмет — постель, тюфяк или циновка — прямо не назван.
- source_word: κατέκειτο
  choice: лежал
  rationale: Русская форма естественно описывает прежнее продолжительное состояние; отдельное выражение предпрошедшего времени здесь не требуется.
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: В сочетании с направлением «к себе домой» естественно передаёт уход с места; буквальное «ушёл» также возможно, но несколько сильнее выделяет удаление.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: к себе домой
  rationale: Естественный современный русский эквивалент, передающий движение в собственный дом, а не просто направление к зданию.
- source_word: δοξάζων τὸν θεόν
  choice: прославляя Бога
  rationale: Сохраняет значение воздаяния Богу славы и не сужает его исключительно до словесной хвалы.
theological_decisions:
- issue: Следует ли прямо назвать предмет, который исцелённый поднял
  choice: В основном тексте сохранить «то, на чём лежал»
  alternative: «поднял свою подстилку» или «поднял постель, на которой лежал»
  rationale: В этом стихе греческий текст употребляет относительное выражение без существительного. Нейтральный основной текст избегает неоправданной конкретизации, а примечание поясняет вероятный предмет.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис передаёт быструю последовательность действий. Относительная конструкция оригинала сохранена, а возможная конкретизация предмета вынесена в примечание.
