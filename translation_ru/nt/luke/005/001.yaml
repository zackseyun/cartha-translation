  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: ru
  text: Однажды, когда народ теснился вокруг Него и слушал слово Божье, Он стоял у Геннисаретского озера[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геннисаретское озеро известно также как Галилейское море.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Однажды
  rationale: Лаконично и естественно вводит новый эпизод в повествовании Луки; δέ не требует отдельного тяжеловесного соответствия.
- source_word: ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ καὶ ἀκούειν
  choice: когда народ теснился вокруг Него и слушал
  rationale: Передаёт временную конструкцию и сохраняет оба одновременных действия; «теснился вокруг» естественно выражает физический напор толпы.
- source_word: τὸν ὄχλον
  choice: народ
  rationale: В данном повествовательном контексте это естественное современное обозначение собравшейся толпы без архаического оттенка.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: 'Сохраняет устойчивое библейское выражение и его смысловую широту: речь идёт о возвещаемом Божьем слове.'
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: Он стоял
  rationale: Естественно передаёт продолженное состояние, выраженное перифрастической конструкцией; αὐτός здесь не нуждается в усиленном «Сам».
- source_word: παρὰ τὴν λίμνην Γεννησαρέτ
  choice: у Геннисаретского озера
  rationale: Передаёт положение у озера и сохраняет употреблённое в греческом тексте географическое название в нормативной русской форме.
theological_decisions:
- issue: Передача τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  alternative: Божья весть
  rationale: Более формальное выражение сохраняет богословскую и межтекстовую насыщенность исходной фразы, не сужая её до одного значения.
- issue: Передача названия Γεννησαρέτ
  choice: Геннисаретское озеро
  alternative: Галилейское море
  rationale: Исходный текст называет водоём Геннисаретским озером; замена на другое известное название была бы пояснительной гармонизацией.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Синтаксис не перегружен буквальным воспроизведением греческой вводной формулы; традиционная библейская формула «слово Божье» сохранена.
