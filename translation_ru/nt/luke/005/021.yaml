  rationale: Исправлены не маркированная оригиналом почтительная прописная буква, ясность исключительного «μόνος» и стилистическая сочетаемость сказуемого с «богохульства». Смысл, повествовательное напряжение и намеренная неуточнённость характера рассуждения сохранены.
