  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: ru
  text: 'И книжники и фарисеи стали рассуждать: «Кто это такой, что произносит богохульства? Кто может прощать грехи, кроме одного лишь Бога?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: стали рассуждать
  rationale: Сочетание ἄρχομαι с инфинитивом передаёт начало действия, а διαλογίζομαι допускает как внутреннее обдумывание, так и обсуждение. «Стали рассуждать» сохраняет эту намеренную неоднозначность и естественно звучит по-русски.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и узнаваемый русский евангельский термин для знатоков и толкователей Закона; он ближе к греческому обозначению, чем пояснительное «учители Закона».
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшаяся русская передача названия религиозной группы.
- source_word: Τίς ἐστιν οὗτος
  choice: Кто Он такой
  rationale: Передаёт резкий вопрос без добавления отсутствующего в греческом слова «человек». Местоимение написано с прописной буквы согласно русской библейской издательской традиции, не меняя смысла реплики.
- source_word: ὃς λαλεῖ βλασφημίας
  choice: что говорит богохульства
  rationale: Союзное «что» естественно связывает характеристику с вопросом «Кто Он такой?». Множественное число «богохульства» сохраняет число греческого βλασφημίας и обвинительный тон.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: прощать грехи
  rationale: Это естественный русский эквивалент устойчивого греческого выражения об отпущении грехов.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: кроме одного Бога
  rationale: Передаёт исключительное значение εἰ μή и подчёркивающий смысл μόνος, оставаясь идиоматичным по-русски.
theological_decisions:
- issue: Подразумеваемая власть Иисуса прощать грехи
  choice: Прямо сохранить утверждение собеседников, что прощать грехи может только Бог.
  alternative: Смягчить исключительность утверждения либо явно добавить христологический вывод.
  rationale: Стих создаёт богословское напряжение, но ещё не формулирует вывод напрямую; перевод не должен ни ослаблять возражение, ни разрешать подразумеваемый вопрос за повествователя.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Сохранены традиционные понятные термины «книжники» и «фарисеи». Формулировка «стали рассуждать» не решает искусственно, происходило ли рассуждение только мысленно или также в разговоре.
