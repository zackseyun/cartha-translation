  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: ru
  text: И Он отошёл от них примерно на бросок камня[a] и, преклонив колени[b], молился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примерно на расстояние броска камня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «положив колени», то есть встав на колени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: отошёл
  rationale: Пассивная форма здесь идиоматически передаёт удаление Иисуса от учеников. «Отошёл» естественно звучит по-русски и не вносит идеи внешнего принуждения.
- source_word: ὡσεὶ λίθου βολήν
  choice: примерно на расстояние броска камня
  rationale: Сохраняет приблизительность ὡσεὶ и образное обозначение дистанции, оставаясь ясным для современного читателя.
- source_word: θεὶς τὰ γόνατα
  choice: преклонив колени
  rationale: Греческое выражение буквально означает «положив колени» и идиоматически описывает вставание на колени. Выбранная формулировка естественна, dignified и сохраняет телесную позу молитвы.
- source_word: προσηύχετο
  choice: молился
  rationale: Русский несовершенный вид передаёт продолженное действие греческого имперфекта без тяжеловесной конструкции «был молящимся».
- source_word: αὐτὸς
  choice: Он
  rationale: Отдельное местоимение сохраняет лёгкое акцентирование субъекта; прописная буква соответствует распространённой русской библейской издательской традиции, не добавляя содержания.
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет повествовательную связь без дополнительного толкования.
theological_decisions:
- issue: Молитвенная поза и христологическое изображение
  choice: Прямо передать, что Иисус отошёл, преклонил колени и молился, без богословских добавлений.
  alternative: Расширить описание devotional или догматическим толкованием.
  rationale: Стих повествует о действии и молитвенной позе Иисуса; перевод должен сохранить торжественность сцены, не привнося отсутствующих в тексте выводов.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и торжественным библейским регистром. Несовершенный вид «молился» сохраняет длительность действия; буквальные семитизированные или неестественные обороты устранены.
