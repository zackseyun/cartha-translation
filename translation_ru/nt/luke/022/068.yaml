  text: Но если Я спрошу, вы ни за что не ответите.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: если
  rationale: Вводит условное придаточное; простое «если» естественно передаёт условие без лишнего усиления.
- source_word: δὲ
  choice: а
  rationale: Передаёт противопоставление предыдущему высказыванию и естественно связывает части речи по-русски.
- source_word: ἐρωτήσω
  choice: Я спрошу
  rationale: Аорист конъюнктива после ἐὰν выражает условие, обращённое к возможному будущему действию; «спрошу» точно и естественно, не привнося оттенка формального допроса.
- source_word: οὐ μὴ
  choice: ни за что не
  rationale: Эмфатическое отрицание передано сильной современной русской конструкцией, сохраняющей категоричность исходного выражения.
- source_word: ἀποκριθῆτε
  choice: ответите
  rationale: Форма пассивная по морфологии, но глагол употреблён в значении «ответить»; выбран прямой и уместный в контексте эквивалент.
