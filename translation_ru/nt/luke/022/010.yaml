source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: ru
  text: 'Он сказал им: «Вот, когда вы войдёте в город, вам встретится человек, несущий кувшин с водой[a]. Следуйте за ним в тот дом, куда он войдёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глиняный кувшин с водой».'
    reason: Греческое κεράμιον может обозначать сосуд из обожжённой глины, однако материал сосуда не обязательно уточнять в основном тексте.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: «Вот» — естественный для современного русского языка возглас, привлекающий внимание и сохраняющий указательную силу греческого слова без архаизации.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: когда вы войдёте в город
  rationale: Родительный самостоятельный оборот передан временным придаточным, естественным по-русски и точно обозначающим обстоятельство встречи.
- source_word: συναντήσει ὑμῖν
  choice: вам встретится
  rationale: Передаёт будущее время и дательный объект; формулировка ясна и сохраняет оттенок предстоящей встречи.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В русском языке «человек» в данном контексте естественно обозначает конкретного мужчину, не требуя более узкого слова «мужчина».
- source_word: κεράμιον ὕδατος
  choice: кувшин с водой
  rationale: Это естественное русское обозначение сосуда, наполненного водой; возможное указание на глиняный материал вынесено в сноску, чтобы не перегружать основной текст.
- source_word: βαστάζων
  choice: несущий
  rationale: Причастие точно передаёт одновременное продолжающееся действие.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Следуйте за ним
  rationale: Прямое повеление передано ясной и стилистически нейтральной русской формой.
- source_word: εἰς τὴν οἰκίαν εἰς ἣν εἰσπορεύεται
  choice: в тот дом, куда он войдёт
  rationale: Формулировка сохраняет направительное значение εἰς и однозначно указывает на дом, в который войдёт человек.
