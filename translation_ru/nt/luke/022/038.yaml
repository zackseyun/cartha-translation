base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: ru
  text: 'Они сказали: «Господи, вот здесь два меча». Он сказал им: «Достаточно»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Довольно об этом». Возможно, Иисус прекращает разговор, а не говорит, что двух мечей достаточно.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Они же сказали
  rationale: Частица δέ здесь служит мягкой связкой; «же» естественно передаёт продолжение повествования, не создавая резкого противопоставления.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и по-прежнему естественная русская форма прямого обращения к Иисусу, сохраняющая значение κύριος как титула.
- source_word: ἰδοὺ
  choice: вот
  rationale: «Вот» кратко и естественно передаёт указательную функцию ἰδού в современной русской прямой речи.
- source_word: μάχαιραι
  choice: меча
  rationale: μάχαιρα обозначает клинковое оружие; «меч» сохраняет традиционное широкое обозначение, тогда как «короткий меч» или «кинжал» внесли бы излишнюю конкретизацию.
- source_word: ὧδε δύο
  choice: здесь два
  rationale: Передаёт указательное наречие ὧδε и числительное в естественном русском порядке слов.
- source_word: Ἱκανόν ἐστιν
  choice: Достаточно
  rationale: 'Краткая безличная формулировка близка греческому выражению и сохраняет двусмысленность: речь может идти как о достаточности двух мечей, так и о прекращении разговора.'
theological_decisions:
- issue: Смысл ответа Иисуса Ἱκανόν ἐστιν
  choice: Достаточно
  alternative: «Этого достаточно» или «Довольно об этом»
  rationale: Греческий текст допускает как буквальную оценку количества мечей, так и резкое завершение разговора. Основной текст не устраняет эту смысловую напряжённость, а примечание сообщает возможное толкование.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и сдержанно. Сохранены краткость ответа Иисуса и неоднозначность исходного текста.
