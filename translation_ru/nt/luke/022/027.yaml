  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: ru
  text: 'Ведь кто важнее: тот, кто возлежит за столом,[a] или тот, кто прислуживает? Разве не тот, кто возлежит за столом? А Я среди вас как тот, кто прислуживает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По древнему обычаю во время торжественной трапезы участники возлежали у низкого стола, а прислуживающие подавали им пищу.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Ведь кто важнее
  rationale: γάρ связывает вопрос с предшествующим наставлением и вводит его обоснование; μείζων в данном контексте обозначает более высокий общественный статус, поэтому естественное русское «важнее» передаёт смысл точнее, чем буквальное «больше».
- source_word: ὁ ἀνακείμενος
  choice: тот, кто возлежит за столом
  rationale: Причастие обозначает участника трапезы, который по древнему обычаю ел полулёжа. Уточнение «за столом» делает ситуацию ясной современному читателю, а «возлежит» сохраняет историческую реалиию.
- source_word: ὁ διακονῶν
  choice: тот, кто прислуживает
  rationale: Настоящее причастие выражает действие обслуживающего трапезу и непосредственно противопоставлено возлежащему. «Прислуживает» сохраняет бытовой контекст и не вносит церковно-должностного значения.
- source_word: οὐχὶ
  choice: Разве не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; эта форма естественна в современном русском языке.
- source_word: ἐγὼ δὲ
  choice: А Я
  rationale: δέ обозначает контраст между обычной иерархией за трапезой и поведением Иисуса. «А» естественно передаёт это противопоставление.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: Я среди вас
  rationale: Устойчивое выражение означает присутствие внутри группы; «среди вас» точно и естественно передаёт его без излишней буквальности.
- source_word: ὡς ὁ διακονῶν
  choice: как тот, кто прислуживает
  rationale: ὡς выражает роль или образ действия. Оборот сохраняет сравнение и глагольный характер причастия, не превращая его в существительное «слуга».
theological_decisions:
- issue: Передача самоописания Иисуса языком служения
  choice: А Я среди вас как тот, кто прислуживает.
  alternative: А Я среди вас как слуга.
  rationale: В греческом употреблено причастие διακονῶν, а не существительное δοῦλος. Глагольная передача сохраняет непосредственный образ обслуживания за трапезой и смирение Иисуса, не добавляя оттенка рабского статуса.
- issue: Значение сравнительной формы μείζων
  choice: кто важнее
  alternative: кто больше
  rationale: Вопрос касается признанного положения участников трапезы, а не физических размеров или отвлечённого величия. «Важнее» передаёт социально-статусный смысл, не определяя духовное величие отдельно от контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Историческое «возлежит» сохранено ради реалии древней трапезы и разъяснено сноской; более естественное «среди вас» предпочтено буквальному «посреди вас».
