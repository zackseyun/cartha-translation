  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: ru
  text: 'Но Он сказал им: «Цари народов господствуют над ними, и властвующие над ними называются благодетелями[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Благодетель» — почётный титул, которым называли правителей или влиятельных покровителей, считавшихся творящими общественное благо.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: цари
  rationale: Существительное конкретно обозначает царей, а не правителей вообще.
- source_word: τῶν ἐθνῶν
  choice: языческих народов
  rationale: В данном контексте выражение указывает на нееврейские народы; такой перевод сохраняет и значение «народы», и вероятный смысл «язычники».
- source_word: κυριεύουσιν
  choice: господствуют
  rationale: Глагол передаёт властное господство и подходит к контрасту с последующим наставлением Иисуса.
- source_word: ἐξουσιάζοντες
  choice: властвующие
  rationale: Причастная форма сохраняет активный смысл осуществления власти.
- source_word: εὐεργέται
  choice: благодетелями
  rationale: Это точный и естественный русский эквивалент почётного титула правителей и влиятельных покровителей.
- source_word: καλοῦνται
  choice: называются
  rationale: Прямо передаёт пассивную форму и указание на употребляемое звание.
- source_word: δὲ
  choice: Но
  rationale: Союз выражает мягкое противопоставление словам Иисуса предшествующему спору учеников.
theological_decisions:
- issue: Значение τῶν ἐθνῶν
  choice: языческих народов
  alternative: народов; язычников
  rationale: Формулировка обозначает нееврейские народы и одновременно избегает сведения многозначного ἔθνη исключительно к религиозной характеристике.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет параллелизм греческого текста. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской традицией.
