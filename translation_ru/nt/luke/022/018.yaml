base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: ru
  text: 'Ведь говорю вам: отныне Я больше не буду пить плод виноградной лозы[a], пока не придёт Царство Божье.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вина». В греческом тексте сказано «плод виноградной лозы» — более широкое выражение, которое, вероятно, обозначает содержимое чаши, но не употребляет обычного слова «вино».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Ведь говорю вам
  rationale: «Говорю вам» естественно передаёт формулу прямого обращения, а «ведь» сохраняет пояснительную связь, выраженную γάρ, без излишне книжного «ибо».
- source_word: οὐ μὴ πίω
  choice: Я больше не буду пить
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание будущего действия. Русское «больше не буду» естественно передаёт твёрдость и временную направленность отрицания в связи с последующим «пока».
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Краткое современное литературное соответствие, обозначающее начало периода с настоящего момента.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: от плода виноградной лозы
  rationale: γένημα означает произведённое, плод. Формулировка сохраняет образ и не сужает значение до слова «вино», которого в греческом тексте здесь нет.
- source_word: ἕως οὗ
  choice: пока не
  rationale: В русском языке «пока не» естественно обозначает временной предел отрицания и соответствует греческому ἕως οὗ.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшаяся, понятная современному читателю передача, сохраняющая как царственное, так и эсхатологическое измерение βασιλεία.
- source_word: ἔλθῃ
  choice: не придёт
  rationale: После «пока не» совершенный вид естественно передаёт будущее наступление события, выраженное аористом сослагательного наклонения.
theological_decisions:
- issue: Передача выражения γενήματος τῆς ἀμπέλου как «вино» или более буквально как «плод виноградной лозы»
  choice: плод виноградной лозы
  alternative: вино
  rationale: Греческое выражение шире обычного слова «вино» и, вероятно, обозначает содержимое чаши. Его сохранение не вносит в текст более узкого значения и удерживает торжественное звучание трапезной формулы.
- issue: Характер будущего прихода Царства Божьего
  choice: пока не придёт Царство Божье
  alternative: пока Царство Божье не придёт во всей полноте
  rationale: Текст устанавливает будущий временной предел, но не уточняет способ или стадию прихода Царства. Перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Ведь» выбрано вместо более книжного «ибо»; «Царство Божье» сохраняет традиционную узнаваемость, оставаясь естественным для современного читателя.
