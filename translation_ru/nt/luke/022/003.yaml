base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: ru
  text: Тогда Сатана вошёл в Иуду, называемого Искариотом, одного из двенадцати.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который был из числа двенадцати». Буквально: «из числа двенадцати».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Тогда … вошёл
  rationale: δέ обозначает переход к следующему событию, поэтому «тогда» естественно передаёт ход повествования; сочетание εἰσῆλθεν с εἰς требует сохранить образ вхождения.
- source_word: Σατανᾶς
  choice: Сатана
  rationale: Устоявшаяся русская передача личного имени или титула; прописная буква соответствует его употреблению здесь как обозначения конкретного действующего лица.
- source_word: εἰς Ἰούδαν
  choice: в Иуду
  rationale: Предлог εἰς прямо указывает, что Сатана вошёл в Иуду; перевод не ослабляет выражение до простого влияния.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: которого называли Искариотом
  rationale: Относительное придаточное естественно для современного русского языка и точно передаёт определительное причастие καλούμενον, не уточняя происхождение прозвания.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: который входил в число двенадцати
  rationale: Оборот сохраняет образ принадлежности к исчисленной группе и при этом звучит естественнее буквального «был из числа двенадцати».
theological_decisions:
- issue: Характер действия Сатаны в Иуде
  choice: «Сатана вошёл в Иуду»
  alternative: «Сатана повлиял на Иуду» / «Сатана овладел Иудой»
  rationale: Греческое εἰσῆλθεν … εἰς выражает вхождение. Перевод сохраняет сильную формулировку текста, но не добавляет учения о степени одержимости и не снимает вопрос о личной ответственности Иуды.
- issue: Статус группы двенадцати
  choice: «двенадцати» со строчной буквы
  alternative: «Двенадцати» как закреплённое наименование апостольской группы
  rationale: Греческий текст обозначает известную группу, но не кодирует различие прописной и строчной букв. Строчная буква сохраняет смысл без дополнительной стилистической интерпретации.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, без архаизмов. Повтор «которого … и который» выбран ради однозначной связи обоих определений с Иудой.
