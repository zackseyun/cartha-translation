base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: ru
  text: И они стали обсуждать между собой, кто же из них мог быть тем, кто собирался это сделать[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто же из них мог быть тем, кому предстояло это сделать». Из контекста ясно, что «это» означает предательство, о котором сказано в предыдущем стихе.'
    reason: лексическая альтернатива и контекстуальное пояснение
lexical_decisions:
- source_word: ἤρξαντο
  choice: стали
  rationale: Ингрессивный аорист с инфинитивом обозначает начало действия; «стали обсуждать» естественно передаёт это по-русски.
- source_word: συζητεῖν
  choice: обсуждать
  rationale: Глагол может означать совместное обсуждение или спор; нейтральное «обсуждать» не приписывает разговору излишне конфликтный тон.
- source_word: πρὸς ἑαυτούς
  choice: между собой
  rationale: Выражение указывает на взаимное общение внутри группы и естественно передаётся русским оборотом «между собой».
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: кто же из них может оказаться
  rationale: «Кто из них» сохраняет отбор одного человека из известной группы; частица «же» передаёт оттенок напряжённого вопроса, а «может оказаться» — неопределённость косвенного вопроса с оптативом.
- source_word: ὁ τοῦτο μέλλων πράσσειν
  choice: тем, кто собирается это сделать
  rationale: Конструкция с μέλλω указывает на предстоящее действие; «собирается» звучит естественно и не обязательно приписывает намерение сильнее, чем позволяет контекст.
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение отсылает к поступку, названному в предыдущем стихе; перевод сохраняет эту отсылку, не подставляя пояснение в основной текст.
theological_decisions:
- issue: Следует ли прямо назвать предательство
  choice: Сохранить общее выражение «это сделать».
  alternative: «предать Его»
  rationale: Хотя из предыдущего стиха ясно, что речь идёт о предательстве, греческий текст здесь использует τοῦτο («это»). Основной текст сохраняет данную формулировку, а контекст и сноска поясняют её референт.
translation_notes:
  register: Современный литературный русский язык; нейтральный, достойный повествовательный стиль. Сохранены неопределённость косвенного вопроса и непрямая отсылка к предательству.
