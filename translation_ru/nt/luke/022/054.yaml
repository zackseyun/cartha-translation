  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: ru
  text: Схватив Иисуса, они повели его и привели в дом первосвященника. Пётр же следовал за ним на некотором расстоянии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издали»; возможен также перевод: «следовал за ним, держась в отдалении».'
    reason: Лексическая альтернатива для μακρόθεν и различная естественная связь наречия с глаголом следования.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Схватив
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам. «Схватив» естественно передаёт взятие Иисуса под стражу, не вводя отсутствующей в тексте юридической терминологии.
- source_word: αὐτόν
  choice: Иисуса
  rationale: Имя восстанавливает референта местоимения из ближайшего контекста и делает русское повествование ясным; нового смыслового содержания не добавляет.
- source_word: ἤγαγον
  choice: повели его
  rationale: Передаёт движение человека, находящегося под стражей, и сохраняет отличие от следующего глагола с приставочным значением движения внутрь.
- source_word: εἰσήγαγον
  choice: привели в
  rationale: Передаёт направительное значение εἰσ- — введение внутрь дома — и естественно сочетается с предшествующим «повели».
- source_word: οἰκίαν
  choice: дом
  rationale: В данном контексте речь идёт о физическом месте; «дом» — прямое и естественное соответствие без излишне официального оттенка.
- source_word: ἀρχιερέως
  choice: первосвященника
  rationale: Устоявшееся и точное русское соответствие новозаветному титулу ἀρχιερεύς.
- source_word: ἠκολούθει
  choice: следовал за ним
  rationale: Несовершенный вид естественно передаёт продолженное действие имперфекта, не добавляя оценки мотивов Петра.
- source_word: μακρόθεν
  choice: на некотором расстоянии
  rationale: Передаёт пространственную удалённость. Формулировка сохраняет контекстуальную возможность понимать наречие как дистанцию, на которой Пётр следовал за Иисусом.
- source_word: δὲ
  choice: же
  rationale: Частица мягко выделяет и противопоставляет линию повествования о Петре действиям тех, кто вёл Иисуса; русское «же» делает это без чрезмерного усиления контраста.
theological_decisions:
- issue: Характер следования Петра за Иисусом во время ареста
  choice: «Пётр же следовал за ним на некотором расстоянии» без оценки его побуждений
  alternative: «Пётр держался вдали» или формулировка, подразумевающая страх и скрытность
  rationale: Текст сообщает о физической дистанции, но прямо не объясняет её психологически или нравственно; перевод сохраняет повествовательное напряжение.
- issue: Референт местоимения αὐτόν
  choice: В первом случае назван Иисус, далее употреблены местоимения
  alternative: Во всех случаях сохранить только «его/ним»
  rationale: Экспликация очевидного референта нужна для естественной самостоятельной русской цитаты и не меняет богословского содержания.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный повествовательный стиль. Сохранена последовательность двух глаголов движения и продолженный характер следования Петра; исключены добавочные психологические оценки.
