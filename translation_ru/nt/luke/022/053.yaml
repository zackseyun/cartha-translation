  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: ru
  text: Каждый день Я был с вами в храме, и вы не наложили на Меня рук[a]. Но это — ваш час и власть тьмы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы не протянули рук против Меня»; здесь речь идёт о враждебном действии — попытке схватить Иисуса.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сила тьмы».'
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Каждый день
  rationale: 'Естественно передаёт распределительное значение выражения: действие повторялось изо дня в день.'
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: когда Я был с вами
  rationale: Передаёт временное значение греческого абсолютного генитива естественной русской придаточной конструкцией.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс; традиционное и понятное русское «в храме» не сужает значение до внутреннего святилища.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: вы не поднимали на Меня рук
  rationale: Русская идиома сохраняет образ протянутых против Иисуса рук и ясно выражает враждебное действие в контексте ареста.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Но это — ваш час
  rationale: Сохраняет краткость и торжественную многозначность ὥρα как наступившего, определённого момента.
- source_word: ἐξουσία
  choice: власть
  rationale: Передаёт значение права, полномочия или действующего господства точнее, чем обозначение одной лишь силы.
- source_word: τοῦ σκότους
  choice: тьмы
  rationale: Сохраняет метафорическое и богословское содержание исходного текста без поясняющей подстановки «сатаны» или «зла».
theological_decisions:
- issue: Следует ли прямо определить «власть тьмы» как власть сатаны или господство зла
  choice: Сохранить выражение «власть тьмы» без истолковывающего уточнения.
  alternative: «сила тьмы», «власть сатаны», «господство зла»
  rationale: Греческий текст говорит именно о тьме и не называет сатану прямо; метафора сохраняет заложенную в стихе богословскую напряжённость.
- issue: Синтаксическая связь выражений «ваш час» и «власть тьмы»
  choice: 'Сохранить их координацию: «это — ваш час и власть тьмы».'
  alternative: 'Истолковать вторую часть как пояснение: «ваш час, то есть время власти тьмы».'
  rationale: Так перевод не устраняет неоднозначность исходного синтаксиса и не отождествляет людей с тьмой явнее, чем это делает греческий текст.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавная буква в местоимении «Меня» соответствует принятому уважительному библейскому регистру. Тире подчёркивает торжественную именную конструкцию, не добавляя отсутствующего в источнике толкования.
