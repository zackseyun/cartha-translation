  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: ru
  text: 'И сказал им: «Что вы спите? Встаньте и молитесь, чтобы не впасть в искушение[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать также «испытание».
    reason: Сохраняет семантическую широту πειρασμός, не навязывая контексту одно-единственное толкование.
lexical_decisions:
- source_word: Τί καθεύδετε;
  choice: Что вы спите?
  rationale: Передаёт прямой вопрос естественным современным русским языком, сохраняя укор исходного выражения.
- source_word: ἀναστάντες
  choice: Встаньте
  rationale: Причастие употреблено в побудительной конструкции и естественно передаётся повелительной формой.
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Настоящее повелительное наклонение передано обычной русской формой, допускающей продолжительное действие.
- source_word: ἵνα μὴ εἰσέλθητε εἰς πειρασμόν
  choice: чтобы не впасть в искушение
  rationale: Русское устойчивое выражение «впасть в искушение» естественно передаёт образ вхождения в ситуацию испытания или соблазна.
theological_decisions:
- issue: Значение πειρασμός
  choice: искушение
  alternative: испытание
  rationale: В данном контексте «искушение» является естественным и традиционно понятным соответствием, при этом греческое слово может также обозначать испытание; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; речь краткая, прямая и достойная. Для сохранения смысловой неоднозначности к слову «искушение» добавлена сноска.
