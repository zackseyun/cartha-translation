  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: ru
  text: 'После того как они закрыли Ему лицо[a], они всё спрашивали: «Пророчествуй: кто Тебя ударил?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завязав Ему глаза».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: Закрыв Его
  rationale: Причастие означает «закрыв, накрыв, скрыв покрывалом» и само по себе не уточняет способ. Формулировка сохраняет широту греческого слова, тогда как контекст подразумевает, что Иисусу закрыли глаза.
- source_word: ἐπηρώτων
  choice: они продолжали спрашивать
  rationale: Имперфект передаёт продолженное или повторявшееся действие; «продолжали спрашивать» естественно выражает этот оттенок.
- source_word: λέγοντες
  choice: 'спрашивать:'
  rationale: В русском языке содержание повторяющегося вопроса естественно вводится двоеточием; отдельное «говоря» было бы тяжеловесным и избыточным.
- source_word: Προφήτευσον
  choice: Пророчествуй
  rationale: Прямой повелительный призыв сохраняет насмешливый тон и отсылку к пророческому знанию.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: кто Тебя ударил?
  rationale: Субстантивированное причастие ὁ παίσας буквально указывает на «того, кто ударил»; краткая русская конструкция точно и естественно передаёт смысл.
theological_decisions:
- issue: Следует ли прямо сказать, что Иисусу завязали глаза
  choice: В основном тексте сохранить более широкое «Закрыв Его»
  alternative: «Завязав Ему глаза»
  rationale: Контекст подразумевает лишение возможности видеть, однако глагол περικαλύπτω обозначает покрытие или закрытие и не уточняет, что именно глаза были завязаны повязкой. Более конкретный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции. Двоеточие вместо буквального «говоря» делает фразу естественной, не устраняя содержания греческой конструкции.
