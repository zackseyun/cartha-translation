lexical_decisions:
- source_word: ἐχάρησαν
  choice: обрадовались
  rationale: Аорист χαίρω передаёт непосредственную эмоциональную реакцию. «Обрадовались» естественно звучит по-русски и сохраняет выраженную в греческом тексте радость.
- source_word: συνέθεντο
  choice: договорились
  rationale: Средняя форма συντίθεμαι здесь означает прийти к соглашению. «Договорились» кратко и точно передаёт взаимное соглашение, не усиливая значение до «пообещали».
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж местоимения обозначает косвенное дополнение при δοῦναι; русский дательный «ему» прямо сохраняет эту синтаксическую связь.
- source_word: ἀργύριον
  choice: деньги
  rationale: Хотя слово буквально обозначает серебро, в контексте расчёта оно употребляется в значении денег. Буквальный вариант сохранён в сноске.
- source_word: δοῦναι
  choice: дать
  rationale: Инфинитив раскрывает содержание соглашения. «Дать» является прямым соответствием и, в отличие от «заплатить», не добавляет контекстуального истолкования.
