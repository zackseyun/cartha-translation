base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: ru
  text: Он согласился и стал искать удобного случая, чтобы предать[a] Его им без толпы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдать». Греческий глагол буквально означает «передать, выдать», но применительно к поступку Иуды его можно перевести как «предать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: согласился
  rationale: В данном контексте глагол означает согласие Иуды с предложением первосвященников и начальников; «согласился» естественно передаёт этот смысл по-русски.
- source_word: ἐζήτει
  choice: стал искать
  rationale: Имперфект обозначает продолжавшееся действие, а в повествовательной последовательности может иметь начинательный оттенок; «стал искать» передаёт развитие событий.
- source_word: εὐκαιρίαν
  choice: удобного случая
  rationale: Выражение обозначает благоприятную, подходящую возможность для задуманного действия.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: чтобы предать Его
  rationale: Буквально глагол означает «передать, выдать», но применительно к поступку Иуды русское «предать» естественно и точно выражает контекстуальный смысл; буквальная альтернатива сохранена в примечании.
- source_word: ἄτερ ὄχλου
  choice: без ведома народа
  rationale: В контексте речь идёт о передаче Иисуса тогда, когда вокруг не будет собравшегося народа; русское выражение передаёт практический смысл отсутствия толпы, хотя буквально конструкция означает «без толпы».
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж указывает на получателей — первосвященников и начальников, упомянутых в ближайшем контексте.
theological_decisions:
- issue: Передача Иисуса Иудой
  choice: предать
  alternative: выдать / передать
  rationale: '«Предать» соответствует роли Иуды в повествовании, но не подменяет буквальный смысл: вариант «выдать» указан в сноске.'
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и повествовательный. Местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
