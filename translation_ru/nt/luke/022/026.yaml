  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: ru
  text: Но у вас пусть будет не так[a]. Напротив, тот, кто среди вас выше, пусть станет как младший[b], а тот, кто руководит, — как тот, кто служит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но с вами — не так». Греческая фраза краткая и эллиптическая; она резко противопоставляет учеников Иисуса только что описанному образцу господства и власти.'
    reason: alternative_reading
  - marker: b
    text: «Младший» здесь может означать не только более молодого по возрасту, но и человека, занимающего более низкое положение.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Но у вас пусть будет не так
  rationale: Передаёт резкое противопоставление предшествующему образу властителей и восполняет эллиптическую конструкцию естественным для русского языка побуждением, не превращая её в описание факта.
- source_word: ἀλλ’
  choice: Напротив
  rationale: Ясно обозначает сильный переход от отвергнутого образца поведения к положительному наставлению.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: кто из вас больше
  rationale: Сохраняет сравнительную степень μείζων и смысл более высокого положения внутри сообщества, не подменяя её превосходной степенью.
- source_word: γινέσθω
  choice: пусть станет
  rationale: Сохраняет повелительную силу и значение становления, принятия иной позиции, а не только статического состояния.
- source_word: ὡς ὁ νεώτερος
  choice: как младший
  rationale: Передаёт сравнительную степень и допускает как возрастной, так и социально-статусный оттенок; культурный смысл поясняется в сноске.
- source_word: ὁ ἡγούμενος
  choice: кто руководит
  rationale: Естественно передаёт субстантивированное причастие и значение ведущего или возглавляющего, не привнося поздней институциональной терминологии.
- source_word: ὡς ὁ διακονῶν
  choice: как тот, кто служит
  rationale: Сохраняет деятельный, глагольный характер выражения и подчёркивает реальное служение другим.
theological_decisions:
- issue: Характер наставления Иисуса о положении и руководстве
  choice: 'Передать этический переворот социальных ролей: более значимый должен уподобиться младшему, а руководящий — служащему.'
  alternative: Использовать более сильную институциональную лексику о должности или власти.
  rationale: Греческий текст противопоставляет более высокого по положению и руководящего младшему и служащему. Перевод сохраняет призыв к смиренному служению, не отрицая самого руководства и не привнося поздней церковной структуры.
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и достойный. Параллелизм двух частей сохранён, тире во второй части делает конструкцию естественной и ясной.
