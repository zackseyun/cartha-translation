lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз связывает стих с предшествующим описанием издевательств.
- source_word: ἕτερα πολλὰ
  choice: ещё много другого
  rationale: Передаёт как многочисленность, так и добавление к уже упомянутым оскорблениям.
- source_word: βλασφημοῦντες
  choice: хуля
  rationale: «Хулить» сохраняет широкий смысл злоречия и поношения, а также возможную религиозную весомость βλασφημέω, не сводя слово лишь к бытовому оскорблению.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид естественно передаёт греческий имперфект и длительный либо повторяющийся характер речи.
- source_word: εἰς αὐτόν
  choice: Его
  rationale: При глаголе «хулить» в русском языке прямое дополнение естественно выражает направленность враждебной речи против Иисуса.
theological_decisions:
- issue: Следует ли передать βλασφημοῦντες как общие оскорбления или сохранить более сильный смысл хулы
  choice: «хуля»
  alternative: «оскорбляя» / «понося»
  rationale: «Хуля» сохраняет полную силу греческого слова, которое может обозначать злоречие, поношение и богохульство, но не уточняет сверх текста, что говорившие осознавали божественное достоинство Иисуса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «говорили они» сохраняет плавную связь с обстоятельственным оборотом и не звучит архаично; местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
