  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: ru
  text: Тогда Ему явился ангел с неба[a] и укреплял Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
