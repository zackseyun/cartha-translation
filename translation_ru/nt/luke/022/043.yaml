lexical_decisions:
- source_word: ὤφθη
  choice: явился
  rationale: Аорист пассивного залога от ὁράω в формуле явления естественно передаётся русским «явился», а не буквальным «был увиден».
- source_word: δὲ
  choice: Тогда
  rationale: Здесь частица обозначает продвижение повествования; «тогда» естественно связывает стих с предыдущим эпизодом, не внося сильного противопоставления.
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж при ὤφθη указывает на того, кому явился ангел.
- source_word: ἄγγελος
  choice: ангел
  rationale: Небесный контекст однозначно указывает на ангела, а не на посланника-человека.
- source_word: ἀπ’ οὐρανοῦ
  choice: с неба
  rationale: Оборот указывает на небесное происхождение; «с неба» — естественное современное русское выражение.
- source_word: ἐνισχύων
  choice: и укреплял
  rationale: Причастие настоящего времени выражает сопутствующее и продолжающееся действие. Сочинительная конструкция звучит по-русски естественно и сохраняет аспект действия.
- source_word: αὐτόν
  choice: Его
  rationale: Прямое дополнение относится к Иисусу; прописная буква соответствует принятому благоговейному оформлению местоимений в русском библейском тексте.
theological_decisions:
- issue: Текстологический статус Луки 22:43
  choice: Стих включён в основной текст согласно предоставленному тексту SBLGNT.
  alternative: В некоторых рукописях стихи 43–44 отсутствуют.
  rationale: Перевод следует предоставленному греческому тексту, а существенное разночтение рукописной традиции отмечено в сноске без попытки разрешить текстологический вопрос.
