  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: ru
  text: 'Тогда все сказали: «Так, значит, Ты — Сын Божий?» Он сказал им: «Вы сами говорите, что Я»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Вы так говорите» или «Именно так». Ответ носит утвердительный характер, но греческая фраза намеренно кратка: буквально — «Вы сами говорите, что Я [есть]»; подразумеваемое продолжение связано с заданным вопросом.'
    reason: Альтернативная передача краткой греческой формулировки и пояснение её утвердительной силы без добавления титула в основной текст.
lexical_decisions:
- source_word: πάντες
  choice: все
  rationale: Субстантивированное прилагательное обозначает всю собравшуюся группу; «все» естественно и сохраняет коллективный акцент.
- source_word: οὖν
  choice: так, значит
  rationale: Частица выражает вывод из предшествующего разговора; сочетание «так, значит» ясно передаёт эту логическую связь в современном русском вопросе.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Сын Божий
  rationale: Устойчивое и достойное русское обозначение христологического титула, сохраняющее его определённость и вес.
- source_word: ἔφη
  choice: ответил
  rationale: Хотя глагол буквально означает «сказал», в данном диалоге он вводит непосредственный ответ на вопрос; «ответил» естественно передаёт функцию реплики.
- source_word: Ὑμεῖς
  choice: вы сами
  rationale: Явно выраженное местоимение имеет эмфатический оттенок и возвращает формулировку собеседникам Иисуса; «вы сами» сохраняет этот акцент.
- source_word: λέγετε
  choice: говорите
  rationale: Настоящее время и множественное число прямо и естественно передаются формой «говорите».
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание сказанного, не превращая ответ ни в причинное утверждение, ни в прямую цитату.
- source_word: ἐγώ εἰμι
  choice: Я — Он
  rationale: Русскому предложению требуется выраженное именное сказуемое; «Он» отсылает к названному в вопросе Сыну Божьему, сохраняя краткость ответа и не повторяя титул.
theological_decisions:
- issue: Следует ли передать ответ Иисуса как прямое подтверждение или как косвенную, сдержанную формулировку
  choice: «Вы сами говорите, что Я — Он»
  alternative: «Да, это так» / «Именно так» / «Вы говорите, что это так»
  rationale: Греческая фраза в контексте служит утвердительным ответом, но её форма возвращает утверждение спрашивающим. Основной текст сохраняет эту напряжённость, а примечание разъясняет утвердительную силу, не превращая реплику в более прямое признание, чем позволяет её форма.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплики краткие и естественные; прописные «Ты» и «Я» употреблены в соответствии с принятой русской библейской издательской традицией. Тире в «Я — Он» делает подразумеваемое сказуемое понятным без полного повторения титула.
