  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: ru
  text: 'Прошёл примерно час, и другой человек[a] настойчиво утверждал: «В самом деле, и этот был с Ним, ведь он тоже галилеянин».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто-то другой». Греческое выражение неопределённо; формы «другой» и «говоря» стоят в мужском роде, поэтому возможен и перевод «другой мужчина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Примерно через час
  rationale: Генитивная абсолютная конструкция обозначает истечение приблизительно часа; краткая русская формулировка естественно передаёт временной переход.
- source_word: ἄλλος τις
  choice: кто-то другой
  rationale: Греческое выражение неопределённо и само по себе не указывает пол говорящего; перевод сохраняет эту неопределённость.
- source_word: διϊσχυρίζετο
  choice: стал настойчиво утверждать
  rationale: Передаёт усиленный характер заявления и длительный оттенок имперфекта, не превращая его в однократную реплику.
- source_word: Ἐπ’ ἀληθείας
  choice: Точно
  rationale: Естественное современное русское заверение, выражающее уверенное утверждение истинности.
- source_word: οὗτος
  choice: этот
  rationale: Сохраняет указательную, несколько обвинительную силу местоимения по отношению к Петру.
- source_word: μετ’ αὐτοῦ ἦν
  choice: был с Ним
  rationale: Прямо передаёт связь и совместное пребывание, не уточняя сверх текста характер ученичества.
- source_word: καὶ γὰρ
  choice: ведь он тоже
  rationale: «Ведь» вводит основание утверждения, а «тоже» передаёт добавочное значение καί.
- source_word: Γαλιλαῖός ἐστιν
  choice: он тоже галилеянин
  rationale: Прямо и естественно обозначает региональное происхождение Петра как основание вывода говорящего.
