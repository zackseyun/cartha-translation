base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: ru
  text: 'Но Иисус сказал ему: «Иуда, ты предаёшь Сына Человеческого поцелуем?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Иуда, ты передаёшь Сына Человеческого поцелуем?»'
    reason: Лексическая альтернатива сохраняет более буквальный, нейтральный смысл παραδίδως — передачи человека в чужие руки.
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: 'Мягкая связка здесь имеет контрастный оттенок: Иисус отвечает на действие Иуды.'
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Явно передаёт местоимение αὐτῷ и естественно вводит обращение к Иуде.
- source_word: Ἰούδα
  choice: Иуда
  rationale: Форма обращения передана общепринятым русским именем; звательная функция ясна из пунктуации и контекста.
- source_word: φιλήματι
  choice: поцелуем
  rationale: Творительный падеж естественно передаёт дательный средства и сохраняет конкретный характер действия.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Традиционная русская передача устойчивого самообозначения Иисуса сохраняет буквальную структуру и ветхозаветные ассоциации.
- source_word: παραδίδως
  choice: предаёшь
  rationale: В данном враждебном контексте глагол означает не просто передачу в руки, но предательство; настоящее время передаёт совершающееся действие.
theological_decisions:
- issue: Передача τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  alternative: Сына человека
  rationale: Прописные буквы помогают распознать устойчивое христологическое самообозначение, не устраняя его буквальной связи с выражением «сын человека».
- issue: Смысл παραδίδως
  choice: предаёшь
  alternative: выдаёшь
  rationale: Контекст оправдывает значение «предавать», однако сноска сохраняет более конкретный оттенок передачи Иисуса в руки противников.
translation_notes:
  register: Современный литературный русский с dignified библейской интонацией. Необычный, но выразительный порядок «поцелуем ли ты» сохранён ради риторического акцента на знаке близости, превращённом в средство предательства.
