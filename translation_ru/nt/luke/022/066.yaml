  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: ru
  text: Когда настал день[a], собрался совет старейшин народа, в который входили первосвященники и книжники, и они отвели Его в свой совет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда рассвело»; букв.: «когда наступил день».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на своё заседание», «перед свой совет» или «в зал заседаний». Греческое слово συνέδριον может обозначать сам совет, его официальное заседание или место, где он заседал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: когда настал день
  rationale: Естественно передаёт временную конструкцию и сохраняет её глагольный характер; возможное указание на рассвет отмечено в сноске.
- source_word: συνήχθη
  choice: собрался
  rationale: Передаёт значение совместного собрания органа без излишне официального и более интерпретирующего «был созван».
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: совет старейшин народа
  rationale: Обозначает не отвлечённое старейшинство, а коллегиальный орган; формулировка ясна и естественна по-русски.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: первосвященники и книжники
  rationale: Устоявшиеся и прозрачные русские обозначения данных групп; тире показывает, что они характеризуют состав упомянутого совета.
- source_word: ἀπήγαγον
  choice: повели
  rationale: Передаёт направленное перемещение под конвоем, не добавляя отсутствующего в тексте указания на насилие.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: на своё заседание
  rationale: В данном контексте συνέδριον может означать сам совет, его официальное заседание или место собрания. «На своё заседание» естественно сочетается с εἰς и избегает сомнительной конкретизации как отдельного зала; неоднозначность указана в сноске.
theological_decisions:
- issue: Соотношение πρεσβυτέριον и συνέδριον
  choice: πρεσβυτέριον передано как «совет старейшин», а συνέδριον — как «заседание»
  alternative: Передать συνέδριον как «синедрион», «совет» или «зал совета»
  rationale: Греческий текст употребляет два разных, хотя и связанных термина. Выбранный вариант сохраняет различие и судебно-официальный контекст, но не утверждает без достаточных оснований, что речь непременно идёт либо об отдельном органе, либо о помещении.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис упрощён для ясности, а вставная конструкция поясняет состав совета без добавления историко-конфессиональной терминологии.
