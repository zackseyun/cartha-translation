  source_fidelity: 'Основной смысл передан верно: χρονологическое указание, собрание руководящего органа, упоминание первосвященников и книжников и препровождение Иисуса к их συνέδριον сохранены. Однако тире в исходной русской фразе создаёт слишком жёсткое отождествление «совета старейшин» исключительно с первосвященниками и книжниками. Кроме того, «на своё заседание» выбирает значение formal session, тогда как греческое συνέδριον здесь остаётся достаточно широким: совет, его заседание или место заседания.'
  naturalness: «Совет старейшин народа, в который входили первосвященники и книжники» звучит естественно в современном литературном русском и ясно выражает синтаксическую связь. «Отвели Его в свой совет» передаёт судебно-официальный контекст без не обоснованного уточнения о конкретном помещении либо исключительно о заседании.
  terminology: '«Совет старейшин народа», «первосвященники» и «книжники» уместны и сохраняют регистр. Для συνέδριον не следует безоговорочно вводить «синедрион» или «зал заседаний»: это соответственно импортирует традиционное название или чрезмерно конкретизирует значение. Сноска сохраняет допустимые варианты.'
