  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: ответ Иисуса, краткую повелительную реплику, прикосновение к уху и исцеление самого человека (αὐτόν), а не только его уха. «Довольно!» является допустимой контекстуальной передачей трудной и краткой фразы Ἐᾶτε ἕως τούτου; она не снимает спорную синтаксико-смысловую неоднозначность посредством чрезмерного толкования.'
