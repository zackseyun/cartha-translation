  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: ru
  text: 'Но Иисус сказал в ответ: «Довольно!» И, прикоснувшись к его уху, исцелил его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Но Иисус сказал в ответ
  rationale: Передаёт обычную греческую формулу ответа естественным современным русским языком; союз δέ обозначен как «но», поскольку слова Иисуса противопоставлены действиям учеников.
- source_word: Ἐᾶτε ἕως τούτου
  choice: Довольно!
  rationale: Кратко и естественно передаёт контекстуальный смысл прекращения происходящего. Буквальное «оставьте до этого» в русском неясно, а греческая фраза допускает оттенки «оставьте», «перестаньте», «довольно».
- source_word: ἁψάμενος τοῦ ὠτίου
  choice: прикоснувшись к его уху
  rationale: Сохраняет действие и конкретный предмет прикосновения; притяжательное «его» естественно отсылает к раненому человеку, выраженному местоимением αὐτόν далее.
- source_word: ἰάσατο αὐτόν
  choice: исцелил его
  rationale: 'Точно передаёт глагол ἰάομαι и мужское местоимение αὐτόν: Иисус исцелил человека, а не только ухо.'
theological_decisions:
- issue: Неоднозначность слов Ἐᾶτε ἕως τούτου
  choice: «Довольно!»
  alternative: «Оставьте, хватит!» / «Перестаньте!» / «Допустите и это»
  rationale: В контексте наиболее вероятен приказ прекратить насилие. Выбранная формулировка сохраняет краткость и силу реплики, не добавляя толкования о том, обращены ли слова исключительно к ученикам или также к пришедшей толпе.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная прямая речь и естественная деепричастная конструкция. Тон достоин повествовательного текста, без архаизмов и конфессионально окрашенной лексики.
