  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: ru
  text: 'Но вот: рука того, кто предаёт Меня, — со Мной на столе.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: 'Передаёт сильный противительный переход: несмотря на сказанное ранее, рядом находится предатель.'
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественный и dignified русский указательный возглас, привлекающий внимание к поразительному факту.
- source_word: τοῦ παραδιδόντος με
  choice: того, кто предаёт Меня
  rationale: Причастие настоящего времени сохранено как разворачивающееся действие, без преждевременного называния личности.
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: Прямо передаёт совместное присутствие предателя с Иисусом.
- source_word: ἐπὶ τῆς τραπέζης
  choice: за столом
  rationale: В данном контексте естественная русская идиома; выражение относится к совместному пребыванию за трапезой, а не требует буквальной картины руки, лежащей на поверхности стола.
theological_decisions:
- issue: Временной аспект предательства
  choice: кто предаёт Меня
  alternative: кто предаст Меня / предатель
  rationale: Настоящее причастие παραδιδόντος сохраняет напряжение уже совершающегося предательства и не сводит выражение только к будущему событию или устойчивому титулу.
- issue: Образ руки предателя
  choice: рука того, кто предаёт Меня, со Мной за столом
  alternative: рука предающего Меня — со Мной на столе
  rationale: Сохранён метонимический образ «руки», но русская формулировка избегает неестественного впечатления, будто речь главным образом о физическом положении руки на поверхности стола.
translation_notes:
  register: 'Современный литературный русский язык: краткая, торжественно-сдержанная реплика. Заглавные буквы в местоимениях «Меня», «Мной» следуют принятой русской библейской издательской традиции.'
