  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: ru
  text: Они пошли и нашли всё так, как Он им сказал, и приготовили Пасху.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасхальную трапезу»; или: «пасхального ягнёнка». Греческое слово может обозначать как празднование Пасхи в целом, так и пасхальную трапезу или пасхальную жертву.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ εὗρον
  choice: Они пошли и нашли
  rationale: Аористное причастие перед личной формой естественно передаётся в русском последовательностью однородных сказуемых; δέ служит мягкой повествовательной связкой и отдельно не выражено.
- source_word: καθὼς εἰρήκει αὐτοῖς
  choice: всё так, как Он им сказал
  rationale: καθώς выражает соответствие ранее сказанному; плюсквамперфект εἰρήκει указывает на предшествующую речь, что в русском ясно из контекста. Слово «всё» естественно восполняет подразумеваемое содержание находки, не сужая его до конкретного предмета.
- source_word: ἡτοίμασαν
  choice: приготовили
  rationale: Глагол означает подготовить или сделать готовым; «приготовили» точно и естественно в контексте пасхальной трапезы и обряда.
- source_word: τὸ πάσχα
  choice: Пасху
  rationale: πάσχα может обозначать праздник, пасхальную трапезу либо жертвенного ягнёнка. Широкое русское «Пасху» сохраняет неоднозначность исходного текста.
theological_decisions:
- issue: Объём значения πάσχα в данном контексте
  choice: Пасху
  alternative: пасхальную трапезу; пасхального ягнёнка
  rationale: Непосредственный контекст связан с приготовлением к вкушению Пасхи, однако греческое слово само по себе допускает как широкое, так и более узкие значения. Основной текст не должен преждевременно устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык; повествование простое и dignified. Местоимение «Он» оформлено с традиционной прописной буквы при указании на Иисуса. Формулировка сохраняет широкое значение слова πάσχα.
