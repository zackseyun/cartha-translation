source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: ru
  text: 'Тогда они сказали: «Зачем нам ещё свидетельство? Ведь мы сами слышали это из его уст».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Тогда они сказали
  rationale: δέ здесь служит мягкой повествовательной связкой; «тогда» естественно передаёт развитие и последовательность событий, не усиливая противопоставление.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: Зачем нам ещё свидетельство?
  rationale: Оборот τί ἔτι с χρείαν ἔχειν образует риторический вопрос о сохраняющейся необходимости; краткая русская формулировка естественна и сохраняет значение «ещё».
- source_word: μαρτυρίας
  choice: свидетельство
  rationale: В судебном контексте μαρτυρία обозначает свидетельство или показание; единственное собирательное «свидетельство» соответствует форме и звучит естественно.
- source_word: αὐτοὶ γὰρ ἠκούσαμεν
  choice: Ведь мы сами слышали
  rationale: «Ведь» передаёт обосновывающую функцию γάρ, а «мы сами» сохраняет эмфатическое αὐτοί. Прошедшее «слышали» непосредственно соответствует аористу и естественно по-русски.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: из его уст
  rationale: Устойчивое и достойное русское выражение передаёт прямой источник услышанного без излишнего добавления «собственных», поскольку эмфаза уже выражена словами «мы сами».
theological_decisions:
- issue: Следует ли уточнять, что услышанное было самообвиняющим заявлением Иисуса или свидетельством
  choice: Сохранить формально общее «слышали это из его уст»
  alternative: «слышали свидетельство из его уст» или «слышали его заявление из его уст»
  rationale: В греческом после ἠκούσαμεν прямое дополнение не выражено. Нейтральное местоимение «это» необходимо для естественного русского синтаксиса, но не определяет характер услышанного и сохраняет напряжение контекста.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная судебная реплика. Синтаксис естественный и понятный, при этом сохранены риторический вопрос, эмфаза «мы сами» и отсутствие уточнения содержания услышанного.
