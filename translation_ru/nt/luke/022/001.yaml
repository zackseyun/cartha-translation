  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: ru
  text: Приближался праздник Пресных хлебов[a], называемый Пасхой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пасха и праздник Пресных хлебов были тесно связанными празднованиями; в иудейской речи их названия могли употребляться совместно или относиться ко всему праздничному периоду.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: Приближался
  rationale: Имперфект передаёт продолжающееся приближение праздника; естественное русское соответствие сохраняет этот аспект.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь частица служит мягким повествовательным переходом; в современном русском отдельное «же» или «теперь» звучало бы избыточно, а связь передаётся порядком повествования.
- source_word: ἡ ἑορτὴ
  choice: праздник
  rationale: Нейтральное и естественное обозначение религиозного праздника в современном литературном русском.
- source_word: τῶν ἀζύμων
  choice: Пресных хлебов
  rationale: Устоявшееся русское название иудейского праздника; форма множественного числа отражает субстантивированное греческое ἄζυμα.
- source_word: ἡ λεγομένη
  choice: называемый
  rationale: Причастный оборот естественно передаёт пояснительное наименование и сохраняет структуру исходного текста.
- source_word: Πάσχα
  choice: Пасхой
  rationale: Устоявшееся русское название иудейского праздника; творительный падеж обусловлен глаголом «называть».
theological_decisions:
- issue: Соотношение праздника Пресных хлебов и Пасхи
  choice: 'Сохранить данное Лукой пояснительное отождествление: «праздник Пресных хлебов, называемый Пасхой»'
  alternative: Подчеркнуть строгое календарное различие между Пасхой и праздником Пресных хлебов
  rationale: Греческая формулировка представляет «Пасху» как употребляемое название этого праздничного периода. Перевод не устраняет историческое различие обрядов, но и не навязывает его там, где Лука использует пересекающиеся названия.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена лаконичная повествовательная конструкция; начальная частица δὲ не передана искусственным вводным словом.
