  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: ru
  text: И, находясь в мучительной борьбе, Он молился ещё напряжённее[a]. Его пот стал подобен каплям крови[b], падающим на землю.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё усерднее»; «ещё горячее».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «словно капли (или сгустки) крови». Это сравнение, а не прямое утверждение, что сам пот был кровью.
    reason: lexical_alternative
  - marker: c
    text: В некоторых рукописях Лк 22:43–44 отсутствуют, а в других присутствуют. В SBLGNT эти стихи выделены скобками, указывающими на текстуальную неопределённость.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: находясь в мучительной борьбе
  rationale: Оборот передаёт состояние крайнего внутреннего напряжения и страдания; «борьба» сохраняет присутствующий в ἀγωνία оттенок тяжёлого борения, не сводя его только к физической боли.
- source_word: ἐκτενέστερον
  choice: ещё напряжённее
  rationale: Сравнительная степень указывает на возросшую интенсивность молитвы. Частица «ещё» естественно выражает сравнительное значение в русском языке.
- source_word: προσηύχετο
  choice: молился
  rationale: Несовершенный вид русского глагола естественно передаёт продолжительный характер действия, выраженный греческим имперфектом.
- source_word: ἐγένετο
  choice: стал подобен
  rationale: Сочетание сохраняет значение наступившего состояния и вместе с ὡσεὶ ясно выражает сравнение.
- source_word: ἱδρὼς
  choice: пот
  rationale: Прямой и естественный русский эквивалент.
- source_word: ὡσεὶ
  choice: подобен
  rationale: Слово сохраняет сравнительный характер высказывания и не утверждает прямо, что пот был кровью.
- source_word: θρόμβοι αἵματος
  choice: капли крови
  rationale: В контексте падения на землю «капли крови» создают естественный русский образ; возможный оттенок густых капель или сгустков отмечен в сноске.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: падающим на землю
  rationale: Естественно передаёт направленное вниз движение, описанное причастием.
theological_decisions:
- issue: 'Характер сравнения: «подобен каплям крови»'
  choice: 'Сохранено сравнение: пот стал подобен каплям крови.'
  alternative: Пот был настоящей кровью.
  rationale: Частица ὡσεὶ прямо обозначает подобие. Перевод не должен превращать сравнение в недвусмысленное утверждение о составе пота.
- issue: Текстуальная неопределённость Лк 22:43–44
  choice: Стих переведён в основном тексте и снабжён текстологической сноской.
  alternative: Опустить стих или оставить без указания на рукописные разночтения.
  rationale: SBLGNT печатает этот фрагмент с обозначением текстуальной неопределённости; перевод сохраняет стих, открыто сообщая читателю о варианте рукописной традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Мучительная борьба» сохраняет тяжесть и внутреннюю напряжённость ἀγωνία без узкомедицинского толкования; синтаксис сделан ясным и естественным для обычного читателя.
