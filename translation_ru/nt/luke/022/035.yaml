  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: ru
  text: 'И Он сказал им: «Когда Я посылал вас без кошелька, дорожной сумки и сандалий, разве вы в чём-нибудь нуждались?» Они ответили: «Ни в чём».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄτερ
  choice: без
  rationale: Предлог обозначает отсутствие; «без» — точный и естественный русский эквивалент.
- source_word: βαλλαντίου
  choice: кошелька
  rationale: Слово обозначает вместилище для денег; «кошелёк» ясно передаёт значение в современном русском языке.
- source_word: πήρας
  choice: дорожной сумы
  rationale: πήρα — сумка для припасов в пути; «дорожная сума» передаёт и предмет, и его назначение, сохраняя достоинство библейского повествования.
- source_word: ὑποδημάτων
  choice: сандалий
  rationale: В контексте путешествий евангельской эпохи речь идёт о сандалиях; этот вариант конкретен и культурно уместен.
- source_word: ἀπέστειλα
  choice: посылал вас
  rationale: Глагол означает отправить с поручением; контекст уже ясно указывает на миссию, поэтому добавлять «в путь» или «на служение» не требуется.
- source_word: μή τινος ὑστερήσατε
  choice: разве вы в чём-нибудь нуждались?
  rationale: μή задаёт вопрос с ожидаемым отрицательным ответом, а ὑστερέω обозначает недостаток или нужду; «разве» естественно передаёт прагматику вопроса.
- source_word: Οὐθενός
  choice: Ни в чём
  rationale: Краткий ответ сохраняет родительный смысл греческого выражения и естественно соотносится с глаголом «нуждались».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской окраской. «Дорожная сума» употреблена как понятное обозначение сумки для припасов, а не как архаизм ради архаизма. Заглавные местоимения «Он», «Я» следуют принятой русской библейской издательской традиции, не добавляя толкования.
