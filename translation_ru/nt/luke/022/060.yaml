  source_fidelity: 'Текст точно передаёт греческий оригинал: δέ обоснованно передано как «Но», прямое обращение Ἄνθρωπε сохранено как «Человек», отрицание и содержание реплики не расширены. «Тотчас» передаёт παραχρῆμα, а «пока он ещё говорил» верно выражает генитивный абсолют ἔτι λαλοῦντος αὐτοῦ и его временное совпадение с криком петуха.'
