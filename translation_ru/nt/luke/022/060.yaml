  terminology: «Пропел петух» — нормативная и естественная русская передача ἐφώνησεν ἀλέκτωρ. Примечание корректно фиксирует более буквальную лексическую альтернативу «закричал петух»; оно не создаёт смыслового расхождения. Богословски нагруженных терминов в стихе нет.
