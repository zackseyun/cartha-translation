source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: ru
  text: 'Но Пётр сказал: «Человек, я не знаю, о чём ты говоришь». И тотчас, пока он ещё говорил, пропел петух[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «закричал петух».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Союз передаёт контраст между очередным обвинением и отрицанием Петра и естественно связывает фразу с предшествующим повествованием.
- source_word: Ἄνθρωπε
  choice: Человек
  rationale: Сохранено прямое и резкое обращение к мужчине без более вежливого и толковательного «господин» или разговорного «приятель».
- source_word: οὐκ οἶδα
  choice: я не знаю
  rationale: Форма οἶδα имеет настоящее значение; прямой русский эквивалент сохраняет категоричность отрицания.
- source_word: ὃ λέγεις
  choice: о чём ты говоришь
  rationale: Естественная русская передача выражения; она сохраняет прямой смысл и не усиливает его толковательным «что ты имеешь в виду».
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт действие без промедления и соответствует возвышенному, но понятному повествовательному регистру.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: пока он ещё говорил
  rationale: Передаёт одновременность действий и сохраняет подчёркнутое ἔτι — «ещё».
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: пропел петух
  rationale: Это обычное и ясное русское обозначение крика петуха; буквальная конструкция «закричал петух» сохранена в примечании.
