    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: Он сказал им
  rationale: Прямая и естественная передача обычной повествовательной формулы речи с πρός и винительным падежом.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Я очень желал
  rationale: Однокоренная усилительная конструкция выражает сильное желание. «Очень желал» естественно звучит по-русски и сохраняет усиление, не воспроизводя буквально неестественное «желанием желал».
- source_word: τοῦτο τὸ πάσχα
  choice: эту Пасху
  rationale: В контексте глагола «есть» имеется в виду пасхальная трапеза, однако основной текст сохраняет более широкое и формально близкое обозначение «Пасха».
- source_word: φαγεῖν
  choice: есть
  rationale: Прямая передача аористного инфинитива ἐσθίω без ненужного расширения.
- source_word: μεθ’ ὑμῶν
  choice: с вами
  rationale: Естественная и точная передача значения совместности.
- source_word: πρὸ τοῦ με παθεῖν
  choice: прежде чем Мне пострадать
  rationale: Конструкция с πρό и субстантивированным инфинитивом обозначает предшествование во времени. «Пострадать» сохраняет традиционное и понятное в данном контексте значение πάσχω, не уточняя сверх текста характер предстоящих страданий.
theological_decisions:
- issue: Значение πάσχα в данном контексте
  choice: В основном тексте сохранено «эту Пасху».
  alternative: эту пасхальную трапезу
  rationale: Контекст еды указывает на пасхальную трапезу, но греческое выражение допускает обозначение Пасхи в целом. Сохранение «Пасха» не сужает смысл без необходимости.
- issue: Сила выражения Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Я очень желал
  alternative: Я горячо желал; желанием желал
  rationale: Русский текст должен ясно передать усиленное личное желание Иисуса, сохранив естественность и не добавляя особой богословской интерпретации.
- issue: Значение πάσχω
  choice: Мне пострадать
  alternative: Мне претерпеть страдания
  rationale: Краткая формулировка сохраняет напряжённую направленность к предстоящим страданиям Иисуса, не конкретизируя в этом стихе их отдельные события.
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но доступной интонацией. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской норме. Порядок сносок соответствует месту поясняемых выражений: [a] после усиленного желания, [b] после «Пасху».'
