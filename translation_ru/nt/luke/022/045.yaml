  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: ru
  text: Поднявшись после молитвы, он пришёл к ученикам и нашёл их спящими от печали[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спящими из-за печали».'
    reason: Лексический вариант, более явно выражающий причинное значение ἀπό.
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: поднявшись после молитвы
  rationale: Аористное причастие обозначает действие, предшествующее приходу к ученикам. В современном русском сочетание «после молитвы» естественно передаёт исходную конструкцию с ἀπό, не создавая неясного оборота «поднявшись от молитвы».
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: он пришёл к ученикам
  rationale: Причастный оборот передаёт движение к ученикам; личная форма делает последовательность действий ясной и естественной по-русски.
- source_word: μαθητὰς
  choice: ученикам
  rationale: «Ученики» — общепринятый и точный эквивалент μαθηταί в контексте Евангелий.
- source_word: εὗρεν
  choice: нашёл
  rationale: Прямой и естественный эквивалент εὗρεν; здесь глагол означает, что он застал их в определённом состоянии.
- source_word: κοιμωμένους αὐτούς
  choice: их спящими
  rationale: Настоящее причастие описывает состояние или продолжающееся действие учеников в момент, когда он их нашёл.
- source_word: ἀπὸ τῆς λύπης
  choice: от печали
  rationale: Предлог ἀπό здесь естественно выражает причину. «От печали» сохраняет краткость и образ исходного выражения; более явный причинный вариант указан в сноске.
theological_decisions:
- issue: Причина сна учеников
  choice: Сон представлен как вызванный печалью.
  alternative: Ученики спали, находясь в печали, без подчёркнутой причинной связи.
  rationale: Оборот ἀπὸ τῆς λύπης наиболее естественно имеет причинное значение — «от/из-за печали». Перевод не добавляет психологического объяснения сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной библейской интонацией. Местоимение «он» дано со строчной буквы, поскольку греческий текст не кодирует особого почтительного написания.
