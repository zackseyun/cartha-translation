lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз без добавления более явного временного оттенка.
- source_word: ἐξελθὼν
  choice: выйдя
  rationale: Деепричастие естественно передаёт греческое аористное причастие и действие, предшествующее основному глаголу.
- source_word: ἔξω
  choice: наружу
  rationale: Передаёт пространственную направленность наречия и естественно сочетается с «выйдя».
- source_word: ἔκλαυσεν
  choice: заплакал
  rationale: Точно и естественно передаёт начало плача в данном повествовательном контексте; по-русски звучит современнее, чем «возрыдал».
- source_word: πικρῶς
  choice: горько
  rationale: Прямо передаёт наречие образа действия и силу переживания, не уточняя его богословски.
