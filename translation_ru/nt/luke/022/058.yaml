  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: ru
  text: 'Немного погодя другой, увидев его, сказал: «И ты из них». Но Пётр сказал: «Человек, я не из них».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «я не есть»; подразумевается: «я не из них».'
    reason: 'Сноска отмечает эллипсис греческого текста: отрицание не содержит явно выраженного дополнения, которое подразумевается из предшествующего обвинения.'
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: вскоре
  rationale: Естественно передаёт краткий промежуток времени и сохраняет динамику повествования.
- source_word: ἕτερος
  choice: другой
  rationale: Субстантивированное прилагательное обозначает другого человека; русское «другой» ясно в контексте и не требует добавления существительного.
- source_word: ἰδὼν αὐτόν
  choice: увидев его
  rationale: Деепричастный оборот кратко и точно передаёт аористное причастие как сопутствующее обстоятельство.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: И ты из них
  rationale: Сохраняет образ принадлежности к группе и краткий обвинительный тон оригинала.
- source_word: Ἄνθρωπε
  choice: Человек
  rationale: Передаёт прямое обращение в звательном употреблении и резкость защитной реплики Петра; «господин» было бы более вежливым, чем позволяет контекст.
- source_word: οὐκ εἰμί
  choice: я не из них
  rationale: По-русски самостоятельное «я не есть» невозможно, а «это не я» изменило бы смысл. Явное восстановление подразумеваемого сказуемого из предыдущей реплики естественно передаёт отрицание принадлежности.
theological_decisions:
- issue: Эллиптическое отрицание Петра οὐκ εἰμί
  choice: я не из них
  alternative: я не такой / нет, не я
  rationale: Греческий текст буквально оставляет дополнение подразумеваемым, однако русский требует смыслового восполнения. Выбранный вариант связывает ответ непосредственно с обвинением «ты из них», не усиливая и не ослабляя отречение.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и напряжённое. Обращение «Человек» намеренно сохраняет резкий тон, хотя в современной речи звучит маркированно.
