source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: ru
  text: 'Но он сказал ему: «Господи, я готов идти с тобой и в тюрьму, и на смерть».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Но он
  rationale: Артикль употреблён местоименно и указывает на Петра; δέ передаёт мягкое противопоставление словам Иисуса в предыдущем стихе.
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Прямо передаёт глагол λέγω с косвенным дополнением, не заменяя местоимение пояснением, которого нет в греческом тексте.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма прямого обращения, сохраняющая и уважительное, и титульное значение κύριος.
- source_word: μετὰ σοῦ
  choice: с тобой
  rationale: μετά с родительным падежом обозначает совместность и сопровождение.
- source_word: ἕτοιμός εἰμι
  choice: я готов
  rationale: Передаёт заявленную Петром готовность и его уверенность в себе кратко и естественно.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повторяющийся союз сохраняет параллелизм и подчёркивает оба названных исхода.
- source_word: εἰς φυλακὴν
  choice: в тюрьму
  rationale: φυλακή здесь означает заключение; «в тюрьму» естественно передаёт также направительное значение εἰς.
- source_word: εἰς θάνατον
  choice: на смерть
  rationale: Устойчивое русское выражение передаёт готовность последовать вплоть до смерти и сохраняет параллель с «в тюрьму».
- source_word: πορεύεσθαι
  choice: идти
  rationale: В сочетании с «готов» глагол естественно обозначает готовность сопровождать Иисуса по предстоящему пути.
theological_decisions:
- issue: Передача κύριος как обращения к Иисусу
  choice: Господи
  alternative: Учитель
  rationale: «Господи» сохраняет титульный и богословский оттенок κύριος, не сводя обращение лишь к роли наставника и не добавляя утверждений сверх текста.
translation_notes:
  register: Современный литературный русский язык; речь Петра звучит прямо, решительно и естественно. Местоимения, относящиеся к Иисусу, даны со строчной буквы как часть обычной современной орфографии перевода, без изменения степени уважительности исходного текста.
