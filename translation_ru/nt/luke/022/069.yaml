  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: ru
  text: Но отныне Сын Человеческий будет восседать по правую руку от силы Божьей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по правую руку от Силы»; «Сила» может быть благоговейным обозначением Бога. В этом варианте явное «Божьей» передано подразумеваемо.'
    reason: 'Лексическая альтернатива: δύναμις может пониматься как благоговейное иносказательное обозначение Бога; уточнение сохраняет прозрачность по отношению к явному τοῦ θεοῦ.'
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Устойчивое современное наречие точно передаёт исходный момент, с которого наступает названная реальность, и соответствует возвышенному контексту.
- source_word: δὲ
  choice: но
  rationale: Передаёт контрастный поворот в ответе Иисуса.
- source_word: ἔσται
  choice: будет
  rationale: Прямо передаёт будущее время глагола εἰμί и наступающее состояние возвышения.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет установленное самообозначение Иисуса и его связь с библейской апокалиптической образностью, не снимая смысловой многозначности.
- source_word: καθήμενος
  choice: восседать
  rationale: Передаёт не просто сидячее положение, а образ царского престола и власти; в современном русском это естественно для данного возвышенного контекста.
- source_word: ἐκ δεξιῶν
  choice: по правую руку
  rationale: Сохраняет библейскую идиому места особой чести и власти и её межтекстовые переклички.
- source_word: τῆς δυνάμεως
  choice: силы
  rationale: Буквально передаёт δύναμις и сохраняет возможность понимать слово как благоговейное обозначение Бога, не превращая это толкование в основной текст.
- source_word: τοῦ θεοῦ
  choice: Божьей
  rationale: Естественная русская форма родительного значения прямо указывает, чья сила имеется в виду, и сохраняет полную греческую формулировку.
theological_decisions:
- issue: Передача формулы возвышения и притязания на божественно дарованную власть
  choice: Сын Человеческий будет восседать по правую руку силы Божьей
  alternative: Сын Человеческий будет восседать по правую руку Силы
  rationale: Основной вариант сохраняет явное τοῦ θεοῦ и образ престольного возвышения с отголосками Псалма 109:1 и Даниила 7, не усиливая и не ослабляя утверждение текста. Альтернатива с «Силой» как благоговейным обозначением Бога отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Отныне» и «восседать» понятны широкому читателю и поддерживают торжественный характер высказывания; архаизм «одесную» не используется.
