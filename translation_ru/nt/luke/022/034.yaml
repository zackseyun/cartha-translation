    rationale: В современном русском «отречься» не присоединяет придаточное с «что» без опорной конструкции («отречься от того, что…»). Это делает фразу грамматически и стилистически дефектной. «Откажешься признать, что знаешь Меня» естественно передаёт отрицание знакомства, выраженное ἀπαρνήσῃ ... εἰδέναι.
