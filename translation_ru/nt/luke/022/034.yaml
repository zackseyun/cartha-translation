  source_fidelity: 'Основной смысл передан верно: Иисус обращается к Петру и предсказывает, что до петушиного крика тот трижды отвергнет факт знакомства с Ним. Однако сочетание «отречёшься, что знаешь Меня» не соответствует русскому управлению глагола «отречься»: требуется конструкция с «от» либо иной глагол речи/отрицания.'
  naturalness: «Сегодня петух не пропоёт» и «пока ты трижды не…» звучат естественно в современном литературном русском. Исправление необходимо только для управления и ясности заключительной части.
