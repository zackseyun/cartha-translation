source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: ru
  text: 'Но Он сказал: «Говорю тебе, Пётр: сегодня петух не пропоёт, пока ты трижды не откажешься признать, что знаешь Меня».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сегодня петух не пропоёт, прежде чем ты трижды откажешься признать, что знаешь Меня».'
    reason: 'Лексико-синтаксическая альтернатива: ἕως после отрицания можно естественно передать как «пока не» или «прежде чем»; «откажешься признать, что знаешь Меня» ясно выражает содержание ἀπαρνήσῃ εἰδέναι.'
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Но Он сказал
  rationale: δέ здесь передаёт переход с оттенком противопоставления в диалоге; «но» естественно выражает этот оттенок. Местоимение относится к Иисусу, поэтому в принятом библейском оформлении написано с прописной буквы.
- source_word: Λέγω σοι
  choice: Говорю тебе
  rationale: Прямая и естественная передача устойчивой формулы, сохраняющая настоящее время λέγω и торжественную краткость высказывания.
- source_word: Πέτρε
  choice: Пётр
  rationale: Традиционная и общеупотребительная русская форма имени, стоящая в звательном употреблении.
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: сегодня петух не пропоёт
  rationale: При ἀλέκτωρ глагол φωνέω обозначает крик петуха; «не пропоёт» естественно для русского языка и передаёт будущее время. Отсутствие артикля допускает обычное родовое обозначение «петух».
- source_word: ἕως
  choice: пока не
  rationale: 'В сочетании с отрицанием главной части эта русская конструкция естественно выражает предел времени: петух не пропоёт до предсказанного отречения. В сноске отмечена возможная передача «прежде чем».'
- source_word: τρίς
  choice: трижды
  rationale: Краткий, современный и литературный эквивалент наречия со значением «три раза».
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: ты ... не отречёшься, что знаешь Меня
  rationale: 'Передача сохраняет εἰδέναι и тем самым уточняет содержание отречения: Пётр откажется признать, что знает Иисуса. «Отречься» соответствует сильному значению ἀπαρνέομαι, а не сводит его к нейтральному отрицанию факта.'
theological_decisions:
- issue: Характер предсказанного отречения Петра
  choice: 'Сохранить прямое указание на отрицание знакомства с Иисусом: «отречёшься, что знаешь Меня».'
  alternative: «трижды отречёшься от Меня» или «трижды станешь отрицать, что знаешь Меня»
  rationale: В греческом тексте присутствует εἰδέναι («знать»), поэтому его нельзя опускать. Формулировка сохраняет конкретное содержание будущего отречения, не расширяя его до богословского утверждения о полном отказе от веры или принадлежности.
- issue: Временная связь, выраженная ἕως после отрицания
  choice: Передать как «не пропоёт, пока ... не».
  alternative: «не пропоёт, прежде чем...»
  rationale: Обе конструкции могут выражать предел, до которого сохраняется отрицание. Основной вариант ближе удерживает структуру с ἕως, а сноска сохраняет естественную альтернативу без искусственного разрешения нюанса.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью прямой речи. Сохранены традиционная форма имени «Пётр», выразительное «трижды» и конкретное указание на отрицание знакомства с Иисусом. Маркер сноски помещён в основном тексте.
