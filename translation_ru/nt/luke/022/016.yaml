base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: ru
  text: 'Ведь я говорю вам: я ни в коем случае не буду есть её[b][a], пока она не исполнится в Царстве Божьем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Я больше не буду есть её, пока она не исполнится в Царстве Божьем». Греческая конструкция решительно отрицает будущее вкушение; слово «больше» подразумевается из контекста, но прямо в греческом тексте не стоит.'
    reason: lexical_alternative
  - marker: b
    text: «Её» относится к Пасхе, упомянутой в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Ведь говорю вам
  rationale: «Говорю вам» естественно передаёт стандартную формулу речи, а «ведь» сохраняет пояснительную связь γάρ с предыдущим стихом.
- source_word: ὅτι
  choice: ':'
  rationale: В русском двоеточие естественно вводит содержание высказывания; отдельное «что» после формулы «говорю вам» здесь звучало бы менее гладко.
- source_word: οὐ μὴ φάγω
  choice: Я ни в коем случае не буду есть
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание будущего действия. Формула «ни в коем случае не буду» передаёт эту эмфазу современным русским языком.
- source_word: αὐτό
  choice: её
  rationale: Местоимение сохранено без внесения в основной текст явного существительного; женский род естественно соотносит его с Пасхой, упомянутой в предыдущем стихе.
- source_word: ἕως ὅτου
  choice: пока не
  rationale: В отрицательной конструкции русское «пока не» естественно обозначает временной предел и соответствует значению греческого оборота.
- source_word: πληρωθῇ
  choice: она не исполнится
  rationale: Пассивное «исполнится» сохраняет смысл осуществления или достижения полноты и не уточняет, каким именно образом произойдёт это исполнение.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: в Царстве Бога
  rationale: «Царство» сохраняет библейские оттенки и царствования, и сферы владычества; конструкция «Бога» прямо передаёт греческий родительный падеж.
theological_decisions:
- issue: Референт αὐτό
  choice: Местоимение «её» отсылает к Пасхе, упомянутой в предыдущем стихе, не сужая её непременно только до отдельных блюд трапезы.
  alternative: Явно перевести как «эту пасхальную трапезу» или понимать шире как пасхальное празднование.
  rationale: Ближайший контекст указывает на «эту Пасху» в стихе 15, однако греческий текст сохраняет местоименную краткость. Основной текст и сноска удерживают возможную широту референта.
- issue: Смысл исполнения в Царстве Бога
  choice: Сохранено неопределённое эсхатологическое выражение «исполнится в Царстве Бога».
  alternative: Уточнить как исполнение с наступлением Царства Бога либо в мессианском пире.
  rationale: Греческий текст говорит об исполнении, но не определяет его механизм или конкретное событие; перевод не должен разрешать эту богословскую напряжённость.
- issue: Подразумеваемое «снова»
  choice: В основном тексте «снова» не добавлено.
  alternative: «Я больше не буду есть её, пока…»
  rationale: Контекст может подразумевать последующее вкушение, однако соответствующего наречия в греческом нет. Усиленное отрицание передано непосредственно, а контекстуальная альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Усиленное отрицание передано ясно, без архаичного оборота; местоимение и формула исполнения сохраняют компактность и смысловую открытость греческого текста.
