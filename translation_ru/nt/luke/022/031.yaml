- from: Симон, Симон! Вот, Сатана потребовал отдать ему всех вас, чтобы просеять, как пшеницу.
  to: 'Симон, Симон! Смотри: Сатана потребовал получить всех вас, чтобы просеять вас, как пшеницу.'
  rationale: Исправление делает русскую фразу более прозрачной и полно воспроизводит объект инфинитива, не изменяя образ, число адресатов или степень утверждения исходного текста. Двоеточие после «Смотри» естественно оформляет вводное привлечение внимания ἰδού.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:42:29Z'
review_pass:
  verdict: revise
  source_fidelity: Греч. ἐξῃτήσατο ὑμᾶς означает «настойчиво потребовал вас / потребовал получить вас»; добавленное «отдать ему» допустимо как экспликация управления, но несколько усиливает оттенок передачи. Важно сохранены множественное «вас» и образ просеивания. Для σινιάσαι естественнее и точнее дать «просеять вас», поскольку объект инфинитива в русском иначе остаётся лишь подразумеваемым.
  naturalness: «Вот» в прямой речи возможно, но в современном литературном русском после обращения естественнее «Смотри» или «Послушай». «Смотри» хорошо передаёт привлечённое ἰδού без разговорной грубости. Конструкция «потребовал отдать ему всех вас» тяжеловесна; «потребовал вас» кратка, но может быть менее ясной. «Потребовал получить всех вас» сохраняет смысл и ясность.
  terminology: «Сатана» и «пшеница» переданы корректно. Не следует заменять «Сатана» описательным толкованием. Множественное число «всех вас» необходимо сохранять, хотя Иисус обращается к Симону в единственном числе.
  issues:
  - severity: low
    issue: Не выражен объект при «просеять».
    rationale: 'Греческий инфинитив σινιάσαι имеет объект ὑμᾶς; в русском его лучше повторить: «просеять вас, как пшеницу».'
  - severity: low
    issue: «Потребовал отдать ему» несколько интерпретирует глагол как передачу со стороны третьего лица.
    rationale: ἐξαιτέω сообщает о настойчивом требовании получить людей; «потребовал получить» передаёт это прямо, не уточняя, кто должен их отдавать.
  revised_text: 'Симон, Симон! Смотри: Сатана потребовал получить всех вас, чтобы просеять вас, как пшеницу.'
  revised_footnotes: []
  revision_rationale: Исправление делает русскую фразу более прозрачной и полно воспроизводит объект инфинитива, не изменяя образ, число адресатов или степень утверждения исходного текста. Двоеточие после «Смотри» естественно оформляет вводное привлечение внимания ἰδού.
