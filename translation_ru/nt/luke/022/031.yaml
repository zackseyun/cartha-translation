  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: ru
  text: 'Симон, Симон! Смотри: Сатана потребовал получить всех вас, чтобы просеять вас, как пшеницу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Сохраняет указательно-привлекающую внимание функцию греческого слова и звучит естественно в современном русском повествовании.
- source_word: ὁ Σατανᾶς
  choice: Сатана
  rationale: Передаёт личное наименование противника; прописная буква соответствует его употреблению здесь как обозначения конкретного лица.
- source_word: ἐξῃτήσατο ὑμᾶς
  choice: потребовал отдать ему всех вас
  rationale: Глагол выражает настойчивое требование получить кого-либо в своё распоряжение. «Всех вас» явно передаёт множественное число ὑμᾶς, противопоставленное непосредственному обращению к Симону.
- source_word: τοῦ σινιάσαι ὡς τὸν σῖτον
  choice: чтобы просеять, как пшеницу
  rationale: Сохраняет образ просеивания зерна и целевое значение инфинитивной конструкции, не раскрывая метафору сверх сказанного в источнике.
theological_decisions:
- issue: Подразумеваемое разрешение на действие Сатаны
  choice: потребовал отдать ему
  alternative: получил разрешение
  rationale: Текст сообщает о требовании Сатаны, но прямо не утверждает, что требование было удовлетворено; перевод не добавляет такого утверждения.
- issue: Круг тех, кого намерен просеять Сатана
  choice: всех вас
  alternative: тебя
  rationale: Греческое ὑμᾶς стоит во множественном числе, хотя обращение «Симон, Симон» — в единственном; перевод сохраняет это значимое различие.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Повтор имени и восклицание передают настойчивость обращения; образ пшеницы сохранён без поясняющего толкования.
