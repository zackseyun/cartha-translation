  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: ru
  text: И он ушёл и стал совещаться с первосвященниками и начальниками храмовой стражи о том, как ему выдать его им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предать его». Греческий глагол может означать «передать», «выдать» или, в данном контексте, «предать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθὼν
  choice: он пошёл
  rationale: Аористное причастие обозначает действие, предшествующее основному; в русском повествовании естественно передать его личной формой в последовательности действий.
- source_word: συνελάλησεν
  choice: договорился
  rationale: Глагол означает совместное обсуждение или совещание; в данном контексте речь идёт не просто о разговоре, а о согласовании замысла.
- source_word: ἀρχιερεῦσιν
  choice: с первосвященниками
  rationale: Устойчивое русское обозначение ведущих представителей священнической власти; множественное число не означает одновременного наличия нескольких действующих первосвященников.
- source_word: στρατηγοῖς
  choice: с начальниками храмовой стражи
  rationale: В луканском иерусалимском контексте это должностные лица, связанные с охраной храма, а не римские военачальники. Явное уточнение предотвращает ложное понимание.
- source_word: τὸ πῶς
  choice: как
  rationale: Естественно вводит содержание достигавшейся договорённости.
- source_word: παραδῷ
  choice: выдать
  rationale: Сохраняет конкретный смысл передачи человека в чужие руки и не сводит многозначный глагол исключительно к толкованию «предать».
- source_word: αὐτοῖς ... αὐτόν
  choice: им Иисуса
  rationale: Имя «Иисуса» вместо местоимения «его» делает русскую фразу ясной, поскольку рядом находятся несколько возможных мужских референтов; адресат «им» сохранён.
theological_decisions:
- issue: Передача παραδῷ в поступке Иуды
  choice: выдать им Иисуса
  alternative: предать его
  rationale: Контекст несомненно подразумевает предательство, однако сам греческий глагол шире и буквально обозначает передачу в чужие руки. Основной текст сохраняет этот оттенок, а богословски и контекстуально уместная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Выражение «начальники храмовой стражи» в основном тексте естественно раскрывает исторический референт στρατηγοῖς и не требует отдельной культурной сноски.
