  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: ru
  text: Выйдя, Он, по обыкновению, направился на Масличную гору; ученики тоже последовали за Ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Выйдя
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастие естественно передаёт последовательность событий по-русски.
- source_word: ἐπορεύθη
  choice: направился
  rationale: В данном контексте передаёт целенаправленное движение к названному месту и звучит естественнее, чем повтор глагола «пошёл» после «выйдя».
- source_word: κατὰ τὸ ἔθος
  choice: по обыкновению
  rationale: Кратко и естественно передаёт действие в соответствии с установившимся обычаем, не добавляя отсутствующего в греческом притяжательного местоимения.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: на Масличную гору
  rationale: Устоявшееся русское географическое наименование; предлог «на» нормативен при обозначении движения к горе.
- source_word: ἠκολούθησαν
  choice: последовали
  rationale: Сохраняет прямое значение ἀκολουθέω и одновременно допустимый в контексте оттенок отношений учеников с Иисусом.
- source_word: οἱ μαθηταί
  choice: ученики
  rationale: Определённость восстанавливается контекстом; добавлять «Его» перед существительным не требуется.
- source_word: καὶ ... δὲ ... καὶ
  choice: ; ... тоже
  rationale: Начальное καί связывает стих с предыдущим повествованием и не нуждается в отдельном «и» после деепричастия; δέ обозначает продолжение повествования, а второе καί имеет добавочное значение, переданное словом «тоже».
theological_decisions:
- issue: Следует ли явно назвать Иисуса носителем обычая
  choice: «Он, по обыкновению» без формулы «по Своему обыкновению»
  alternative: «как обычно» / «по Своему обыкновению»
  rationale: Контекст однозначно указывает на Иисуса, однако κατὰ τὸ ἔθος не содержит притяжательного местоимения. Выбранная формулировка естественна по-русски и не вносит лишнего уточнения.
translation_notes:
  register: Современный литературный русский язык, повествовательный и достойный регистр. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской издательской традиции. Точка с запятой облегчает чтение двух тесно связанных действий без избыточного союза.
