  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: ru
  text: Но вы — те, кто оставался со мной в моих испытаниях[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «в моих искушениях» или «в моих проверках». Греческое слово может обозначать как искушение, так и испытание; здесь, вероятно, имеются в виду тяжёлые обстоятельства, которые переживал Иисус.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: вы
  rationale: Личное местоимение вынесено в начало и имеет смысловое ударение; конструкция «вы — те, кто» передаёт эту эмфазу.
- source_word: δέ
  choice: но
  rationale: Союз обозначает контраст с предшествующими словами Иисуса.
- source_word: οἱ διαμεμενηκότες
  choice: те, кто оставался
  rationale: Субстантивированное причастие перфекта обозначает определённую группу учеников, которые продолжали быть с Иисусом вплоть до настоящего момента. Единственное число сказуемого естественно согласуется в русском с местоимением «кто».
- source_word: μετ’ ἐμοῦ
  choice: со мной
  rationale: Передаёт значение совместного пребывания и близости.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: в моих испытаниях
  rationale: πειρασμός может означать испытание, искушение или проверку. В данном контексте «испытания» естественно указывает на тяготы и противодействие, пережитые Иисусом, не устраняя полностью более широкого смысла исходного слова.
theological_decisions:
- issue: Значение πειρασμοῖς применительно к Иисусу
  choice: испытания, перенесённые Иисусом
  alternative: искушения, пережитые Иисусом
  rationale: Контекст подчёркивает верность учеников среди трудностей служения Иисуса. Однако греческое слово допускает и значение «искушения», поэтому эта смысловая возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная фраза без архаизмов. Строчная буква в местоимениях, относящихся к Иисусу, соответствует нейтральной современной орфографической практике.
