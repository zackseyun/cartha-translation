  source_fidelity: 'Нужна небольшая правка. Греческое τοῦ λόγου стоит в единственном числе: Пётр вспомнил конкретное «слово»/высказывание Господа. В черновике «вспомнил слова Господа» в современном русском обычно прочитывается как винительный падеж множественного числа и потому размывает это число. «Пристально посмотрел» возможно лексически, но несколько закрепляет усиленный оттенок ἐνέβλεψεν в основном тексте; нейтральное «посмотрел на» точнее сохраняет меру исходника и английской аудиторской версии, а вариант интенсивного взгляда следует дать в сноске.'
