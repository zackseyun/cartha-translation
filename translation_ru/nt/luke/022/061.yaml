  terminology: «Господь» верно передаёт κύριος как титул Иисуса. «Отречёшься от Меня» точно передаёт ἀπαρνήσῃ в данном контексте. «Пропоёт петух» — естественная русская передача ἀλέκτορα φωνῆσαι; «трижды» современно и точно.
