  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: ru
  text: 'Господь обернулся и посмотрел на Петра[a], и Пётр вспомнил слово Господа — то, что Он сказал ему: «Прежде чем сегодня пропоёт петух, ты трижды отречёшься от Меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пристально посмотрел на Петра»; греческий глагол может обозначать прямой, пристальный взгляд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: обернулся
  rationale: Аористное причастие обозначает действие, предшествующее взгляду. «Обернулся» естественно передаёт физический поворот в данном повествовательном контексте.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет обычный новозаветный титул Иисуса и его христологическую значимость.
- source_word: ἐνέβλεψεν
  choice: пристально посмотрел
  rationale: Глагол ἐμβλέπω обозначает прямой, сосредоточенный взгляд; это значение можно естественно выразить в основном тексте без избыточного толкования.
- source_word: ὑπεμνήσθη
  choice: вспомнил
  rationale: Хотя форма допускает оттенок «ему напомнилось», контекст сосредоточен на том, что Пётр вспомнил сказанное Иисусом; русский возвратный глагол здесь был бы менее естественен.
- source_word: τοῦ λόγου τοῦ κυρίου
  choice: слова Господа
  rationale: λόγος здесь означает конкретное высказывание. Родительный единственного числа «слова» естественен в русском обороте «вспомнил слова Господа» и не превращает его в неопределённое множество речений.
- source_word: ὡς εἶπεν αὐτῷ
  choice: сказанные ему
  rationale: Оборот вводит содержание воспоминания. Причастная конструкция ясна по-русски и сохраняет указание на то, что Господь ранее сказал это Петру.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Прежде чем сегодня пропоёт петух
  rationale: πρίν с инфинитивом выражает предшествование. Русское «пропоёт петух» идиоматично; отсутствие артикля в греческом не требует неопределённости, которую русский язык здесь обычно не маркирует.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямо передаёт временную непосредственность предсказания; положение в русском предложении выбрано ради ясности.
- source_word: ἀπαρνήσῃ
  choice: ты отречёшься от Меня
  rationale: «Отречься от» точно и традиционно передаёт ἀπαρνέομαι в контексте отказа признать связь с Иисусом.
- source_word: τρίς
  choice: трижды
  rationale: «Трижды» — краткое, понятное и сохраняющее достоинство стиля современное русское слово.
theological_decisions:
- issue: Передача κύριος как титула Иисуса
  choice: Господь
  alternative: Учитель / господин
  rationale: «Господь» сохраняет одновременно повествовательное употребление и богословскую весомость титула, не сужая его до значения наставника или почтительного обращения.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным ритмом. «Пристально посмотрел» передаёт вероятный оттенок прямого, сосредоточенного взгляда непосредственно в тексте, поэтому отдельная сноска не требуется. Местоимение «Меня» написано с прописной буквы в соответствии с принятым благоговейным библейским регистром.
