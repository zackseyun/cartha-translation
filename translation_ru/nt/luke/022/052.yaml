source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: ru
  text: 'Иисус же сказал первосвященникам, начальникам храмовой стражи и старейшинам, пришедшим против Него: «Вы вышли с мечами и дубинами, словно на разбойника[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бандита», «мятежника». Греческое слово может обозначать разбойника, вооружённого бандита или повстанца; Иисус говорит о том, что к Нему пришли с оружием, как для задержания опасного преступника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкое противопоставление и переход к словам Иисуса, сохраняя естественный русский повествовательный строй.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: пришедшим против Него
  rationale: ἐπί с винительным в контексте задержания обозначает направленное против Иисуса враждебное действие, а не просто приближение.
- source_word: ἀρχιερεῖς
  choice: первосвященникам
  rationale: Устоявшееся русское обозначение группы высших священнических руководителей; форма множественного числа соответствует греческому тексту.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: начальникам храмовой стражи
  rationale: Контекстуально ясно обозначает должностных лиц, руководивших охраной храма, не создавая ошибочного представления о военачальниках регулярной армии.
- source_word: πρεσβυτέρους
  choice: старейшинам
  rationale: Здесь речь идёт о признанных руководителях народа, а не просто о пожилых мужчинах.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: словно на разбойника
  rationale: Естественно передаёт оборот со значением выступления для задержания опасного преступника и сохраняет риторический характер вопроса.
- source_word: ἐξήλθατε
  choice: вы вышли
  rationale: Аорист обозначает совершённое ими действие; русское прошедшее время естественно звучит в вопросе о происходящем задержании.
- source_word: μαχαιρῶν
  choice: мечами
  rationale: Обычный и контекстуально уместный эквивалент оружия в сцене задержания.
- source_word: ξύλων
  choice: дубинами
  rationale: Хотя слово буквально связано с деревом или деревянными предметами, здесь оно обозначает используемые как оружие палки или дубины.
theological_decisions:
- issue: Характер обозначения λῃστής
  choice: разбойник с примечанием о более широком диапазоне значения
  alternative: мятежник или повстанец
  rationale: В контексте вооружённого задержания слово может обозначать не только грабителя, но также бандита или опасного повстанца. Основной текст сохраняет традиционно понятный эквивалент, а примечание не позволяет сузить смысл без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формулировка вопроса перестроена в естественный для русского порядок слов, при этом сохранены образ, упрёк и неоднозначность λῃστής.
