  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: ru
  text: И настал день Опресноков, когда надлежало принести в жертву пасхального ягнёнка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасхальную жертву». Греческое слово может обозначать Пасху как празднование, а в данном контексте — животное, приносимое в жертву.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: настал
  rationale: Аорист ἔρχομαι идиоматически обозначает наступление дня; «настал» естественно и литературно передаёт этот временной смысл.
- source_word: δὲ
  choice: И
  rationale: Здесь δέ служит связкой при развитии повествования; русское «И» сохраняет плавную последовательность без излишнего усиления хронологии.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: день Опресноков
  rationale: Сохраняется единственное число ἡ ἡμέρα; «Опресноки» — понятное традиционное название иудейского праздника.
- source_word: ᾗ
  choice: когда
  rationale: Относительное местоимение в дательном падеже имеет временное значение и относится к слову «день»; «когда» звучит естественнее буквального «в который».
- source_word: ἔδει
  choice: надлежало
  rationale: Имперфект безличного глагола выражает установленную необходимость; «надлежало» передаёт как необходимость, так и нормативный характер обряда.
- source_word: θύεσθαι
  choice: принести в жертву
  rationale: В культовом контексте θύω означает заклание как жертвоприношение; выбранная формулировка ясно передаёт ритуальный смысл и естественна по-русски.
- source_word: τὸ πάσχα
  choice: пасхального ягнёнка
  rationale: При θύεσθαι слово πάσχα обозначает пасхальную жертву; по-русски нельзя естественно сказать «принести в жертву Пасху», поэтому в основном тексте референт выражен явно, а более широкая лексическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Референт τὸ πάσχα в контексте жертвоприношения
  choice: «пасхального ягнёнка» в основном тексте
  alternative: «пасхальную жертву»; буквально «Пасху»
  rationale: πάσχα может обозначать праздник, трапезу или пасхальную жертву. Глагол θύεσθαι требует здесь жертвенного объекта. «Пасхальный ягнёнок» ясно и естественно передаёт контекстуальный смысл, тогда как сноска сохраняет более широкую семантику греческого слова и не скрывает альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. «Настал» и «надлежало» dignified, но общеупотребительны; синтаксис краток и понятен. Маркер сноски помещён непосредственно после выражения, которое она поясняет.
