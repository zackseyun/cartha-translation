lexical_decisions:
- source_word: Ἐγένετο
  choice: возник
  rationale: Глагол обозначает возникновение новой ситуации; «возник спор» естественно передаёт это в современном русском повествовании.
- source_word: δὲ καὶ
  choice: также
  rationale: «Также» передаёт добавочное значение καί; отдельный перевод δέ не требуется, поскольку в русском связность повествования сохраняется без искусственного вводного слова.
- source_word: φιλονεικία
  choice: спор
  rationale: Слово обозначает прение или распрю с оттенком соперничества; «спор» ясно и естественно подходит к дальнейшему вопросу о положении учеников.
- source_word: ἐν αὐτοῖς
  choice: между ними
  rationale: Предложное сочетание указывает на спор внутри группы.
- source_word: τὸ τίς αὐτῶν
  choice: о том, кто из них
  rationale: Артикль вводит содержание спора, выраженное косвенным вопросом.
- source_word: δοκεῖ
  choice: считается
  rationale: В контексте сравнения положения в группе глагол естественно передаёт оценку окружающих; возможное значение «кажется» сохранено в сноске.
- source_word: εἶναι μείζων
  choice: большим
  rationale: Сохранена сравнительная степень «больший», без усиления до превосходной степени «самый главный».
theological_decisions:
- issue: Сравнение положения учеников
  choice: большим
  alternative: самым большим; главнее; важнее
  rationale: Греческий текст употребляет сравнительную, а не превосходную степень. «Большим» сохраняет форму и напряжение исходного выражения, не уточняя самовольно, идёт ли речь о власти, почёте или значимости.
- issue: Значение δοκεῖ
  choice: считается
  alternative: кажется
  rationale: Основной текст передаёт социальную оценку внутри группы, а сноска сохраняет подлинную лексическую неоднозначность глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прост и понятен; сравнительное «большим» сохранено без конфессионального истолкования.
