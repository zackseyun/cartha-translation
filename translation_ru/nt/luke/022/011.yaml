  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: ru
  text: 'И скажите хозяину дома: «Учитель говорит тебе: „Где комната для гостей[a], в которой я смогу есть пасхальную трапезу с моими учениками?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помещение для ночлега». Греческое κατάλυμα означает место для размещения или комнату для гостей; здесь оно не означает именно гостиницу, а верхняя комната упоминается лишь в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: хозяину дома
  rationale: Передаёт главу или распорядителя домашнего хозяйства естественным современным русским выражением, не сводя значение непременно к юридическому собственнику.
- source_word: ὁ διδάσκαλος
  choice: Учитель
  rationale: Прямо передаёт титульное употребление διδάσκαλος и не привносит менее точное традиционное «Господин» или «Наставник».
- source_word: κατάλυμα
  choice: комната для гостей
  rationale: В домашнем контексте речь идёт о месте для размещения гостей; перевод не смешивает его с гостиницей и не опережает следующий стих, где помещение уточняется как верхняя комната.
- source_word: τὸ πάσχα
  choice: пасхальную трапезу
  rationale: При глаголе «есть» слово πάσχα обозначает прежде всего пасхальную трапезу; уточнение делает смысл ясным по-русски, сохраняя связь с праздником Пасхи.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: с моими учениками
  rationale: «Ученики» естественно передаёт μαθηταί как последователей, обучаемых Иисусом, и соответствует устойчивому евангельскому словоупотреблению.
- source_word: φάγω
  choice: я мог бы есть
  rationale: Сослагательная форма передаёт предполагаемое или намечаемое действие в вопросе о подходящем месте, не превращая его в категорическое утверждение будущего.
- source_word: ἐρεῖτε
  choice: скажите
  rationale: Будущее изъявительное в данном контексте имеет инструктивную силу; русский повелительный вид естественно передаёт речевое поручение ученикам.
theological_decisions:
- issue: Титульное самообозначение Иисуса ὁ διδάσκαλος
  choice: Учитель
  alternative: Наставник; Господин
  rationale: «Учитель» непосредственно передаёт греческий титул и сохраняет то, как хозяин дома должен узнать говорящего, без добавления христологического титула, отсутствующего в тексте.
translation_notes:
  register: Современный литературный русский с ясным, достойным синтаксисом. Прямая речь оформлена вложенными кавычками. Местоимения первого лица оставлены со строчной буквы, поскольку греческий текст не кодирует особого почтительного написания; титул «Учитель» написан с прописной как распознаваемое обозначение Иисуса.
