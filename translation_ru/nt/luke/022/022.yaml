  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: ru
  text: Ведь Сын Человеческий идёт, как определено, но горе тому человеку, через которого Его предают.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через которого Его передают». Греческий глагол, в зависимости от контекста, может означать как «предавать», так и «передавать (во власть других)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Частица вводит основание предыдущего высказывания; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача самоназвания Иисуса, сохраняющая его титульный характер и межтекстовые связи.
- source_word: μέν … πλὴν
  choice: … но
  rationale: Русское противопоставление естественно передаёт сочетание частиц; отдельная передача μέν здесь сделала бы фразу тяжеловесной.
- source_word: κατὰ τὸ ὡρισμένον
  choice: как определено
  rationale: Сохраняет смысл соответствия ранее принятому определению и безличную форму, не добавляя прямо не названного деятеля.
- source_word: πορεύεται
  choice: идёт
  rationale: Передаёт движение Иисуса по предстоящему Ему пути, включая контекстуальное движение к смерти, без пояснительного расширения.
- source_word: οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: горе тому человеку
  rationale: Сохраняет пророческую силу формулы οὐαί и конкретную мужскую референцию.
- source_word: δι’ οὗ
  choice: через которого
  rationale: Точно передаёт διά с родительным падежом и сохраняет оттенок посредничества.
- source_word: παραδίδοται
  choice: Он предаётся
  rationale: В контексте действий Иуды глагол означает предательство, но русская форма «предаётся» также сохраняет некоторую смысловую связь с передачей во власть других.
theological_decisions:
- issue: Соотношение предопределённого замысла и человеческой ответственности
  choice: Сохранены рядом утверждение «как определено» и возглас «горе тому человеку».
  alternative: Ослабить либо предшествующее определение, либо ответственность предающего.
  rationale: Греческий текст прямо ставит эти положения рядом и не объясняет их соотношение; перевод не должен устранять это богословское напряжение.
- issue: Неявный деятель в κατὰ τὸ ὡρισμένον
  choice: Безличное «как определено».
  alternative: «как определил Бог» или «по Божьему определению».
  rationale: Божественный замысел подразумевается контекстом, однако деятель в греческой фразе прямо не назван, поэтому в основном тексте он не добавлен.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным и компактным; традиционный титул «Сын Человеческий» сохранён. Заглавная буква в «Он» помогает ясно обозначить Иисуса без добавления имени.
