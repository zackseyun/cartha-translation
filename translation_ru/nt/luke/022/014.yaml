lexical_decisions:
- source_word: Καὶ ὅτε ἐγένετο ἡ ὥρα
  choice: И когда настал час
  rationale: Передаёт простую повествовательную связь καί и сохраняет слово «час», а также смысл наступления назначенного момента.
- source_word: ἀνέπεσεν
  choice: возлёг за столом
  rationale: Глагол обозначает принятую в древности позу за трапезой — полулёжа; добавление «за столом» естественно проясняет ситуацию для современного читателя.
- source_word: οἱ ἀπόστολοι
  choice: апостолы
  rationale: Прямо передаёт определённую, уже известную читателю группу, не добавляя отсутствующего в греческом притяжательного местоимения.
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Естественно и точно выражает совместное пребывание апостолов с Иисусом.
theological_decisions:
- issue: Положение участников за пасхальной трапезой
  choice: возлёг за столом
  alternative: сел за стол
  rationale: Сохранена исторически конкретная поза, выраженная глаголом ἀναπίπτω; она не заменена современным общим обозначением и не получает дополнительного доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Тире помогает естественно передать эллиптическое продолжение «и апостолы с Ним».
