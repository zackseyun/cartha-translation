  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: ru
  text: И когда настал час, Он возлёг за столом, и апостолы вместе с Ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть расположился за трапезой полулёжа, как было принято в то время.
