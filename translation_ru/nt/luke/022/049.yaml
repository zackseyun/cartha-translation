id: LUK.22.49
reference: Luke 22:49
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: ru
  text: 'Когда те, кто был рядом с Ним, увидели, что вот-вот произойдёт, они сказали: «Господи, ударить ли нам мечом[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клинком». Греческое слово μάχαιρα может обозначать меч, короткий меч или кинжал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: когда… увидели
  rationale: Аористное причастие передано временным придаточным, естественным для современного русского языка и сохраняющим связь с главным глаголом.
- source_word: οἱ περὶ αὐτὸν
  choice: те, кто был рядом с Ним
  rationale: Передаёт людей, окружавших Иисуса, не уточняя сверх греческого текста, что это были именно ученики или спутники.
- source_word: τὸ ἐσόμενον
  choice: что вот-вот произойдёт
  rationale: Субстантивированное причастие будущего времени указывает на близкое предстоящее событие; «вот-вот» ясно передаёт его непосредственную близость, не внося идеи предопределённой необходимости.
- source_word: εἶπαν
  choice: они сказали
  rationale: Сохраняет обычное значение λέγω; вопросительный характер следующей прямой речи не требует замены на «спросили».
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма прямого обращения, сохраняющая титул и его богословскую значимость.
- source_word: εἰ πατάξομεν
  choice: ударить ли нам
  rationale: Частица εἰ с будущим изъявительным образует совещательный вопрос; русская конструкция с «ли» точно и естественно передаёт просьбу о решении.
- source_word: ἐν μαχαίρῃ
  choice: мечом
  rationale: Творительный падеж естественно передаёт инструментальное ἐν; «меч» соответствует основному значению μάχαιρα в данном вооружённом контексте, хотя слово может обозначать и более короткий клинок.
theological_decisions:
- issue: Передача κύριος при обращении к Иисусу
  choice: Господи
  alternative: Учитель
  rationale: «Господи» сохраняет как почтительное обращение, так и титульно-богословское звучание κύριος; «Учитель» сузило бы значение и соответствовало бы иному греческому слову.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис прямой и доступный; сохранён глагол зрительного восприятия «увидели», а формула «вот-вот произойдёт» передаёт близость события без добавления идеи предопределения. Местоимение «Ним» оформлено с традиционной прописной буквы при указании на Иисуса.
