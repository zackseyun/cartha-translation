base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: ru
  text: 'Взяв хлеб и воздав благодарность, он преломил его, дал им и сказал: «Это — моё тело[c], которое отдаётся за вас[b]. Делайте это и впредь в память обо мне»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях отсутствуют слова: «которое отдаётся за вас. Делайте это и впредь в память обо мне».'
    reason: textual_variant
  - marker: b
    text: 'Или: «которое даётся за вас».'
    reason: lexical_alternative
  - marker: c
    text: Слова «Это — моё тело» переведены буквально; некоторые понимают их в смысле «Это означает моё тело», однако в самом греческом тексте стоит «есть».
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: взяв хлеб
  rationale: Деепричастный оборот естественно передаёт предшествующее действие и сохраняет плавную последовательность греческого повествования.
- source_word: εὐχαριστήσας
  choice: возблагодарив
  rationale: Передаёт благодарение, совершённое до преломления хлеба, не добавляя прямо не названного в тексте дополнения «Бога».
- source_word: ἔκλασεν
  choice: преломил его
  rationale: «Преломил» точно и уместно для хлеба; местоимение «его» делает подразумеваемое дополнение ясным по-русски.
- source_word: ἔδωκεν αὐτοῖς
  choice: подал им
  rationale: В контексте трапезы «подал им» звучит естественно и передаёт передачу хлеба ученикам.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Это — моё тело
  rationale: Прямая связочная формулировка сохраняет греческое ἐστιν («есть») и не разрешает переводом спор о характере этого утверждения.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: которое отдаётся за вас
  rationale: Относительное предложение естественно передаёт субстантивированное причастие; настоящее время и несовершенный вид сохраняют разворачивающееся действие, а «за вас» оставляет присущую ὑπέρ смысловую ёмкость.
- source_word: τοῦτο ποιεῖτε
  choice: И впредь делайте это
  rationale: Настоящее повелительное наклонение в данном контексте указывает на продолжаемую или повторяемую практику; «и впредь» делает эту силу явной и остаётся естественным русским выражением.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: в память обо мне
  rationale: Устойчивое и понятное русское выражение передаёт действие памятования, не сводя его лишь к внутреннему воспоминанию и не вводя специальной конфессиональной терминологии.
theological_decisions:
- issue: Смысл слов «Это — моё тело» в контексте Вечери
  choice: Сохранена прямая формулировка «Это — моё тело».
  alternative: «Это означает моё тело» или «Это символизирует моё тело».
  rationale: Греческий текст употребляет связку ἐστιν; перевод не должен заранее разрешать евхаристический спор посредством поясняющего парафраза.
- issue: Текстологический статус продолжения стиха
  choice: Спорное продолжение включено в основной текст и отмечено сноской.
  alternative: Краткий текст, заканчивающийся словами «Это — моё тело».
  rationale: SBLGNT печатает продолжение как рабочий текст, отмечая его текстологическую спорность; существенный краткий вариант следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимения, относящиеся к Иисусу, написаны со строчной буквы по общим современным правилам. Синтаксис сохраняет цепочку греческих действий, но избегает тяжеловесности; спорные богословские и текстологические вопросы не разрешаются молча.
