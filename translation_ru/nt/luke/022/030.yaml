source:
  edition: SBLGNT
  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: ru
  text: чтобы вы ели и пили за Моим столом в Моём Царстве, и вы сядете на престолах, судя[a] двенадцать колен Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управляя» или «правя».'
    reason: Лексема κρίνω может обозначать не только вынесение суда, но и осуществление правления или управления.
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение союза в связи с предшествующим обещанием.
- source_word: ἔσθητε καὶ πίνητε
  choice: вы ели и пили
  rationale: Сослагательная форма после ἵνα естественно передаётся русской конструкцией с «чтобы» и прошедшим временем, не обозначающим здесь прошлое.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: за Моим столом
  rationale: Устойчивое современное выражение для совместной трапезы; буквальное «на Моём столе» по-русски означало бы иное.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: в Моём Царстве
  rationale: Контекст трапезы и престолов поддерживает пространственно-царственное значение βασιλεία, не исключая смысла царствования.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: сидели на престолах
  rationale: Будущее καθήσεσθε оказывается в сфере единого «чтобы»; русское «сидели» естественно согласует части конструкции и сохраняет образ наделения царской или судебной властью.
- source_word: κρίνοντες
  choice: судя
  rationale: Прямо сохраняет судебное значение κρίνω, не сводя роль учеников только к осуждению или только к управлению.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: двенадцать колен Израиля
  rationale: Традиционное и понятное русское обозначение двенадцати племенных подразделений Израиля.
theological_decisions:
- issue: Характер будущей роли учеников по отношению к двенадцати коленам Израиля
  choice: судя
  alternative: управляя; правя
  rationale: κρίνω прежде всего выражает судебное действие, но в библейском контексте суд может включать управление. Основной текст сохраняет судебную формулировку, а примечание — более широкие возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Синтаксис сохраняет зависимость обеих частей от «чтобы», поэтому «сидели» передаёт греческое будущее в естественной русской целевой конструкции.
