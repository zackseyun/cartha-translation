  source_fidelity: 'Основной смысл передан точно: трапеза за столом Иисуса в Его Царстве, престолы и суд над двенадцатью коленами Израиля сохранены. Однако καθήσεσθε — будущее изъявительное («сядете / будете сидеть»), а не часть конструкции с ἵνα. В исходном варианте «сидели» неоправданно подчиняет эту часть союзу «чтобы» и стирает будущее обещание.'
  naturalness: «За Моим столом», «в Моём Царстве» и «двенадцать колен Израиля» естественны и соответствуют принятому литературно-библейскому регистру. Для современного русского будущую форму лучше передать как «вы сядете», сохранив при этом компактную структуру стиха.
  terminology: «Престолы» и «двенадцать колен Израиля» удачны. «Судя» точно оставляет κρίνω в судебной семантике, не предрешая, идет ли речь только об осуждении либо также об управлении. Примечание уместно сохраняет возможные управленческие оттенки; его маркер должен относиться к «судя», а не к «Царстве». В английской audit trail маркер [a] в тексте ошибочно поставлен после “kingdom”, хотя его объяснение относится к “judging”; русский проект корректно привязывает примечание к нужному слову.
