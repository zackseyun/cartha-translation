  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: ru
  text: 'А одна служанка, увидев его сидящим при свете[a] и пристально всмотревшись в него, сказала: «И этот был с Ним».'
  philosophy: optimal-equivalence
  footnotes:
