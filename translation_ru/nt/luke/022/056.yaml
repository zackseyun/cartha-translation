    text: 'Или: «у света». Греческое выражение может указывать как на положение возле источника света, так и на то, что он находился в освещённом месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: увидев
  rationale: Аористное причастие передаёт предшествующее восприятие и естественно звучит в русском повествовании.
- source_word: δὲ
  choice: А
  rationale: Частица отмечает продолжение повествования с лёгким сменением действующего лица, без сильного противопоставления.
- source_word: παιδίσκη τις
  choice: одна служанка
  rationale: παιδίσκη обозначает молодую служанку или рабыню; в данном контексте нейтральное «служанка» естественно, а τις передано словом «одна».
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: сидящим у огня
  rationale: Буквально речь идёт о сидящем у света; в ближайшем контексте источником света служит разведённый во дворе огонь, поэтому русское «у огня» естественно передаёт пространственное значение πρὸς.
- source_word: ἀτενίσασα αὐτῷ
  choice: пристально всмотревшись в него
  rationale: Глагол выражает сосредоточенный, внимательный взгляд; «всмотревшись» также передаёт попытку распознать человека при освещении огнём.
- source_word: Καὶ οὗτος
  choice: И этот
  rationale: Сохраняет указательную, несколько заострённую форму оригинала и значение καί «тоже, также» в естественной русской реплике.
- source_word: σὺν αὐτῷ ἦν
  choice: был с Ним
  rationale: Прямо передаёт значение совместности; местоимение оставлено без уточняющего существительного, как в греческом тексте.
