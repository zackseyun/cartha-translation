  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: ru
  text: Они развели огонь посреди двора и сели вместе, а Пётр сидел среди них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιαψάντων
  choice: развели
  rationale: Аористное причастие обозначает действие, предшествующее основной сцене; «развели огонь» — естественное современное русское выражение.
- source_word: πῦρ
  choice: огонь
  rationale: В данном контексте речь идёт о разведённом во дворе огне; в русском языке артикль не требуется.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: посреди двора
  rationale: Передаёт конкретное пространственное значение кратко и естественно; αὐλή здесь — внутренний двор при доме первосвященника.
- source_word: συγκαθισάντων
  choice: уселись вместе
  rationale: Аористное причастие параллельно περιαψάντων, а приставка συν- указывает на совместное расположение; «уселись вместе» сохраняет этот оттенок.
- source_word: ἐκάθητο
  choice: сидел
  rationale: Русский глагол несовершенного вида естественно передаёт длительный, фоновый характер греческого имперфекта.
- source_word: μέσος αὐτῶν
  choice: среди них
  rationale: Идиоматично передаёт положение Петра внутри собравшейся группы.
- source_word: δὲ
  choice: а
  rationale: Слабый повествовательный связующий союз здесь также мягко переводит внимание от группы к Петру.
theological_decisions: []
