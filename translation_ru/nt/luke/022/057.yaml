lexical_decisions:
- source_word: ἠρνήσατο
  choice: стал отрицать это
  rationale: Глагол означает «отрицать, отвергать». В греческом прямое дополнение не выражено; русское «это» естественно указывает на только что прозвучавшее утверждение, не уточняя сверх текста, что Пётр «отрёкся от Него».
- source_word: λέγων
  choice: говоря
  rationale: Деепричастие сохраняет связь причастия с содержанием отрицания и соответствует структуре греческой фразы.
- source_word: Οὐκ οἶδα
  choice: я не знаю
  rationale: Прямая и естественная передача отрицательной формы глагола «знать».
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; добавление «этого человека» отсутствует в греческом тексте. Заглавная буква следует принятой русской библейской издательской норме для местоимения, относящегося ко Христу.
- source_word: γύναι
  choice: женщина
  rationale: Звательная форма представляет собой прямое обращение к собеседнице. «Госпожа» или «сударыня» были бы смягчающими и более интерпретирующими вариантами.
theological_decisions:
- issue: Следует ли явно обозначить предмет отрицания Петра
  choice: «стал отрицать это» — подразумевается прозвучавшее обвинение
  alternative: «отрёкся, говоря» или «отрёкся от Него»
  rationale: В греческом при ἠρνήσατο дополнение отсутствует. «Это» делает русскую фразу естественной, сохраняя референт подразумеваемым; «от Него» сверх меры уточнило бы синтаксический объект и могло бы сместить акцент с отрицания заявления на прямое отречение от Иисуса.
- issue: Положение обращения γύναι
  choice: «Женщина» поставлено в начале прямой речи
  alternative: «Я не знаю Его, женщина»
  rationale: Греческий порядок ставит обращение в конце, однако в современном русском конечное «женщина» звучит заметно грубее и менее естественно. Перестановка сохраняет прямое обращение без добавления оттенка, не обязательно присутствующего в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Реплика проста и напряжённа; обращение передано прямо, без архаизации и без вежливого смягчения. Частица δέ передана союзом «но».
