  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: ru
  text: 'Ибо говорю вам: это написанное должно исполниться на Мне: «И к беззаконникам был причислен»[a]. Ведь то, что касается Меня, подходит к завершению[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «И к злодеям причтён был» (Ис. 53:12).'
    reason: alternative_reading
  - marker: b
    text: 'Возможные варианты: «имеет конец», «достигает исполнения» или «исполняется».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Ибо говорю вам
  rationale: «Ибо» сохраняет пояснительную связь γάρ с предшествующим контекстом, а «говорю вам» прямо и естественно передаёт λέγω ὑμῖν.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: написанное
  rationale: Субстантивированное причастие передаёт ссылку на записанный текст, не добавляя отсутствующего в греческом существительного «Писание»; указательность конструкции в русском контексте достаточно выражена последующей цитатой.
- source_word: δεῖ τελεσθῆναι
  choice: должно исполниться
  rationale: «Должно» сохраняет значение необходимости δεῖ, а «исполниться» естественно передаёт τελεσθῆναι применительно к пророческому тексту.
- source_word: ἐν ἐμοί
  choice: на Мне
  rationale: В русском библейском и литературном употреблении «исполниться на ком-либо» естественно выражает осуществление сказанного применительно к человеку; это не сужает смысл до простого упоминания об Иисусе.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: И к беззаконникам был причислен
  rationale: «Беззаконники» непосредственно передаёт ἀνόμων, а «был причислен» — пассивную форму ἐλογίσθη. Предлог «к» создаёт естественную русскую конструкцию со значением включения в их число.
- source_word: τὸ περὶ ἐμοῦ
  choice: то, что касается Меня
  rationale: Идиоматичный русский оборот точно передаёт субстантивированное выражение о том, что относится к Иисусу.
- source_word: τέλος ἔχει
  choice: подходит к завершению
  rationale: Формулировка сохраняет смысл движения к концу или полноте исполнения и не сводит неоднозначное выражение исключительно ни к прекращению, ни к исполнению пророчества.
theological_decisions:
- issue: Передача цитаты из Исаии 53:12 с учётом русской переводческой традиции
  choice: И к беззаконникам был причислен
  alternative: И к злодеям причтён был
  rationale: Основной текст следует греческому ἀνόμων («беззаконные»), тогда как узнаваемая традиционная формулировка сохранена в примечании, но не поставлена выше исходного текста.
- issue: Смысл выражения τέλος ἔχει
  choice: подходит к завершению
  alternative: имеет конец / исполняется
  rationale: В контексте страстей выражение указывает на приближение предначертанного к кульминации, однако допускает оттенки как окончания, так и исполнения. Основной вариант сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся близким к греческому, но не становится тяжеловесным. Местоимения, относящиеся к Иисусу в Его собственной речи, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
