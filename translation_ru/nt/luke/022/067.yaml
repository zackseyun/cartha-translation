  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: ru
  text: 'и говорили: «Если Ты Мессия[a], скажи нам». Но Он сказал им: «Если Я скажу вам, вы ни за что не поверите;»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос».'
    reason: Альтернативная традиционная передача титула ὁ χριστός.
lexical_decisions:
- source_word: λέγοντες
  choice: и говорили
  rationale: Причастие продолжает предшествующее повествование и вводит прямую речь; личная форма с союзом естественна в современном русском и сохраняет связь с контекстом.
- source_word: Εἰ σὺ εἶ
  choice: Если Ты
  rationale: Сохранена явная условная конструкция греческого текста, а не превращена в прямой вопрос.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: В обстановке допроса это титул, связанный с иудейскими мессианскими ожиданиями; «Мессия» передаёт смысл яснее, чем традиционное «Христос».
- source_word: εἰπὸν ἡμῖν
  choice: скажи нам
  rationale: Естественная русская передача повелительной формы с адресатом.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Но Он ответил им
  rationale: δέ обозначает лёгкое противопоставление, а «ответил» естественно передаёт речевую реакцию Иисуса в данном контексте.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Если Я скажу вам
  rationale: Сохранены условная форма и прямой порядок участников высказывания без излишней архаизации.
- source_word: οὐ μὴ πιστεύσητε
  choice: вы ни за что не поверите
  rationale: Оборот «ни за что не» естественно и выразительно передаёт усиленное отрицание οὐ μή с сослагательным наклонением.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Контекст совета и формулировка требования указывают на иудейский мессианский титул; вариант «Мессия» сохраняет эту историко-богословскую окраску, а альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Местоимения, относящиеся к Иисусу в прямом обращении и авторском обозначении, даны с прописной буквы согласно распространённой русской библейской традиции. Конечная точка с запятой сохранена, поскольку стих синтаксически продолжается в следующем стихе.
