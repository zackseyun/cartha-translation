id: LUK.22.50
reference: Luke 22:50
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: ru
  text: И один из них ударил раба первосвященника и отсёк ему правое ухо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу первосвященника». Греческое слово δοῦλος может в зависимости от контекста означать как раба, так и слугу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: ударил
  rationale: Глагол обозначает сильный удар; «ударил» естественно звучит по-русски и не вносит архаического оттенка.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: один из них
  rationale: Передаёт неопределённость и сохраняет анонимность действующего лица без неестественного буквального оборота.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: раба первосвященника
  rationale: δοῦλος здесь является буквальным обозначением подневольного социального положения; «раб» точнее сохраняет эту реалии, чем более широкое «слуга».
- source_word: ἀφεῖλεν
  choice: отсёк
  rationale: В контексте ранения уха глагол означает отделение части тела; «отсёк» ясно передаёт действие и результат.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: ему правое ухо
  rationale: Естественная русская конструкция с дательным принадлежности точно сохраняет указание на правую сторону.
theological_decisions:
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга
  rationale: В стихе слово употреблено в буквальном социальном смысле. Основной текст сохраняет вероятный подневольный статус, а более широкая передача отмечена в сноске без сглаживания неоднозначности слова.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, повествовательное и сдержанное. Выбрана естественная конструкция «отсёк ему правое ухо».
