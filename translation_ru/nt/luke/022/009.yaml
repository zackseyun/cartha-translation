- source_word: εἶπαν αὐτῷ
  choice: сказали Ему
  rationale: Буквально и естественно передаёт глагол речи и дательное дополнение; вопросительный характер выражен прямой речью.
- source_word: Ποῦ
  choice: Где
  rationale: Прямой современный эквивалент вопросительного наречия места.
- source_word: θέλεις
  choice: Ты хочешь
  rationale: Передаёт желание или намерение без архаического оттенка.
- source_word: ἑτοιμάσωμεν
  choice: чтобы мы всё приготовили
  rationale: Сослагательная конструкция после θέλεις естественно передаётся придаточным с «чтобы». «Всё» служит идиоматическим восполнением подразумеваемого приготовления пасхальной трапезы, не сужая его до одного предмета.
