base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: ru
  text: 'говоря: «Отец, если Ты хочешь, удали[a] от Меня эту чашу[b]. Однако пусть исполнится не Моя воля, а Твоя[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «пронеси эту чашу мимо Меня».'
    reason: lexical_alternative
  - marker: b
    text: В Библии «чаша» — образ назначенной кому-либо доли, нередко страдания или суда.
    reason: cross_reference
  - marker: c
    text: 'Возможный перевод: «пусть будет не то, чего хочу Я, а то, чего хочешь Ты».'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени вводит содержание молитвы и сохраняет синтаксическую связь с предшествующим повествованием.
- source_word: Πάτερ
  choice: Отец
  rationale: Звательная форма прямого обращения к Богу; современное русское «Отец» точно и не требует архаизирующей частицы.
- source_word: εἰ βούλει
  choice: если Ты хочешь
  rationale: Оборот выражает волю или желание Отца. Формулировка естественна для современного русского языка и сохраняет условный характер просьбы.
- source_word: παρένεγκε … ἀπ’ ἐμοῦ
  choice: удали от Меня
  rationale: Аористный императив в сочетании с ἀπ’ ἐμοῦ передаёт просьбу устранить чашу от Иисуса; «удали от Меня» ясно и естественно по-русски.
- source_word: τοῦτο τὸ ποτήριον
  choice: эту чашу
  rationale: Метафора сохранена без истолковывающей подмены, поскольку она несёт важные библейские ассоциации с предназначенной долей, страданием и судом.
- source_word: πλὴν
  choice: Однако
  rationale: Передаёт решительный уступительный переход от просьбы к подчинению воле Отца, оставаясь современным и достойным по стилю.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: не Моя воля, а Твоя
  rationale: Сохранены именные выражения оригинала и прямое противопоставление воли Иисуса воле Отца.
- source_word: γινέσθω
  choice: пусть исполнится
  rationale: Императив третьего лица выражает пожелание, чтобы воля Отца осуществилась. «Пусть исполнится» естественно сочетается с существительным «воля» и точно передаёт смысл.
theological_decisions:
- issue: Соотношение воли Иисуса и воли Отца
  choice: «не Моя воля, а Твоя»
  alternative: «не то, чего хочу Я, а то, чего хочешь Ты»
  rationale: Прямое различение двух воль и добровольное подчинение Иисуса сохранены без догматического пояснения или сглаживания напряжения текста.
- issue: Метафорический смысл чаши
  choice: Сохранить слово «чаша» в основном тексте
  alternative: «это страдание» или «это испытание»
  rationale: Истолковывающая замена сузила бы образ и ослабила его библейские связи; пояснение уместнее вынести в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Прописные местоимения в обращении к Богу соответствуют принятой русской библейской издательской практике; они не добавляют смыслового различия, отсутствующего в греческом тексте.
