source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: ru
  text: А первосвященники и книжники искали способ убить Его[a], потому что боялись народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предать Его смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: искали
  rationale: Имперфект передаёт продолжавшиеся в прошлом поиски способа действия; в русском контексте глагол несовершенного вида естественно сохраняет эту длительность.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего иерусалимского священства во множественном числе.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Прямой и традиционно понятный в евангельском контексте эквивалент; варианты «учители закона» и «знатоки закона» были бы более толковательными.
- source_word: τὸ πῶς
  choice: способ
  rationale: Субстантивированное πῶς означает «как, каким способом»; конструкция «искали способ» звучит по-русски естественнее буквального «искали, как».
- source_word: ἀνέλωσιν
  choice: убить
  rationale: В данном контексте ἀναιρέω прямо обозначает лишение жизни. Выбор не смягчает намерение руководителей и не навязывает представление о конкретной юридической процедуре.
- source_word: ἐφοβοῦντο
  choice: боялись
  rationale: Глагол несовершенного вида передаёт продолжавшееся состояние страха, выраженное греческим имперфектом.
- source_word: τὸν λαόν
  choice: народа
  rationale: λαός обозначает народ как коллективное целое; «толпа» неоправданно сузило бы значение до собравшейся группы.
theological_decisions:
- issue: Сила ἀνέλωσιν и намерение руководителей
  choice: «убить Его»
  alternative: «предать Его смерти» или «устранить Его»
  rationale: Фраза сохраняет ясно выраженное намерение лишить Иисуса жизни, не смягчая враждебность и не уточняя ещё не названную судебную процедуру.
- issue: Кого обозначает λαός
  choice: «народ»
  alternative: «толпа»
  rationale: 'Коллективное «народ» сохраняет широту греческого слова и повествовательное напряжение: руководители опасаются реакции людей.'
translation_notes:
  register: Современный литературный русский язык с привычной евангельской терминологией. Начальное καί передано союзом «А», который естественно связывает стих с предшествующим повествованием и отмечает переход к действиям религиозных руководителей. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
