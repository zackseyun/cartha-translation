base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: ru
  text: 'И, приняв чашу и воздав благодарение, Он сказал: «Возьмите эту чашу и разделите её между собой[a]».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распределите её между собой». Глагол может означать «разделить» или «распределить» в пределах группы.'
    reason: lexical_alternative
  - marker: b
    text: Слова «между собой» в некоторых рукописях отсутствуют.
    reason: textual_variant
lexical_decisions:
- source_word: δεξάμενος
  choice: приняв
  rationale: Аористное причастие передаёт действие, предшествующее главному глаголу; русское деепричастие естественно и точно сохраняет последовательность.
- source_word: ποτήριον
  choice: чашу
  rationale: В русском языке отсутствие артикля не требует неопределённости; в данном контексте винительный падеж без указательного определения звучит естественно и не превращает выражение в позднейший литургический термин.
- source_word: εὐχαριστήσας
  choice: воздав благодарение
  rationale: Передаёт совершённое перед речью благодарение и сохраняет возвышенный, но понятный повествовательный регистр, не используя технический термин «совершив Евхаристию».
- source_word: εἶπεν
  choice: Он сказал
  rationale: Сохраняет отсутствие явно названного адресата; местоимение восстанавливает подразумеваемого Иисуса по нормам русского повествования.
- source_word: Λάβετε
  choice: Возьмите
  rationale: Естественный русский императив для физического принятия чаши в застольной обстановке.
- source_word: τοῦτο
  choice: её
  rationale: Греческое указательное местоимение отсылает к чаше; в русском буквальное «это» после слова женского рода было бы неестественно, поэтому местоимение «её» ясно сохраняет референцию без повторения существительного.
- source_word: διαμερίσατε
  choice: разделите
  rationale: Сохраняет основной смысл деления или распределения; сочетание «между собой» уточняет взаимное распределение в группе.
- source_word: εἰς ἑαυτούς
  choice: между собой
  rationale: Естественно передаёт распределение внутри группы и не создаёт возможного оттенка личного присвоения, присущего варианту «для себя».
theological_decisions:
- issue: Следует ли использовать в переводе εὐχαριστήσας и ποτήριον специальную евхаристическую терминологию
  choice: 'Обычный повествовательный язык: «чашу» и «воздав благодарение»'
  alternative: «евхаристическую чашу» или «совершив Евхаристию»
  rationale: Греческий текст описывает действия Иисуса за трапезой, но сам по себе не употребляет позднейшую церковную терминологию; перевод не должен заранее разрешать богословскую интерпретацию сцены.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис близок к греческому, но естественен по-русски; специальная конфессиональная терминология не вводится.
