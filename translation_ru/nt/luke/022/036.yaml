  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: ru
  text: 'Но теперь: у кого есть кошелёк, пусть возьмёт его, а также дорожную сумку[a]; а у кого нет — пусть продаст свой плащ и купит меч[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дорожную суму»; греческое πήρα обозначает сумку или котомку путника.'
    reason: lexical_alternative
  - marker: b
    text: Греческое μάχαιρα может обозначать также короткий меч или крупный нож, употреблявшийся как оружие.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Но теперь
  rationale: Передаёт резкое противопоставление прежним наставлениям и временной акцент νῦν естественным современным русским выражением.
- source_word: ὁ ἔχων
  choice: у кого есть
  rationale: Обобщённо передаёт субстантивированное причастие, не добавляя указания на пол.
- source_word: βαλλάντιον
  choice: кошелёк
  rationale: Обозначает мешочек или сумку для денег; «кошелёк» ясно и естественно для современного читателя.
- source_word: ἀράτω
  choice: пусть возьмёт его
  rationale: В контексте приготовления к пути глагол означает взять с собой; местоимение делает русскую фразу связной.
- source_word: ὁμοίως καὶ πήραν
  choice: так же и дорожную сумку
  rationale: Передаёт параллелизм ὁμοίως и назначение πήρα как сумки путника без излишней архаизации.
- source_word: ὁ μὴ ἔχων
  choice: а у кого нет
  rationale: 'Сохраняет эллипсис греческого текста: предмет, которого нет, прямо не назван, хотя последующее повеление естественно указывает на меч.'
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: пусть продаст свой плащ
  rationale: ἱμάτιον здесь естественно передаётся как верхняя одежда — «плащ»; возвратное «свой» соответствует русской норме.
- source_word: ἀγορασάτω μάχαιραν
  choice: и купит меч
  rationale: Сохраняет прямую повелительную формулировку и не подменяет конкретное название оружия толкованием.
theological_decisions:
- issue: Следует ли смягчать или усиливать буквальный смысл повеления купить меч?
  choice: 'Передать прямо: «купит меч»'
  alternative: Передать как образное приготовление к опасности или заменить словом «оружие»
  rationale: В греческом тексте назван μάχαιρα и употреблено прямое повеление. Перевод сохраняет напряжение текста и не предрешает, буквально или образно следует понимать повеление в более широком контексте.
- issue: Как раскрыть неназванный объект в выражении ὁ μὴ ἔχων?
  choice: 'Сохранить эллипсис: «а у кого нет»'
  alternative: 'Уточнить: «а у кого нет меча»'
  rationale: Греческий текст не называет объект после «не имеющий». Хотя дальнейшее «пусть купит меч» позволяет понять его как меч, прямое добавление сняло бы подлинную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Двоеточие после «Но теперь» подчёркивает переход к новым наставлениям; тире сохраняет естественность эллиптической конструкции. Архаичное «сума» оставлено только как допустимый вариант в сноске.
