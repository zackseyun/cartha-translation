base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: ru
  text: 'Придя на то место, Он сказал им: «Молитесь, чтобы не впасть в искушение[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытание». Греческое слово может означать как нравственное искушение, так и испытание в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Придя на то место
  rationale: Оборот обозначает прибытие в уже известное из контекста место. Деепричастная конструкция естественно передаёт предшествование основному действию; δέ не требует отдельного выражения в русском тексте.
- source_word: εἶπεν αὐτοῖς
  choice: Он сказал им
  rationale: Прямо и без усиления передаёт нейтральное λέγω; местоимение делает смену от деепричастного оборота к главному предложению ясной.
- source_word: Προσεύχεσθε
  choice: Молитесь
  rationale: Настоящее повелительное наклонение допускает продолженное или обычное действие, однако простая русская форма повеления передаёт это естественно, без избыточного уточнения «продолжайте молиться».
- source_word: μὴ εἰσελθεῖν
  choice: чтобы не впасть
  rationale: Буквально конструкция означает «чтобы не войти», но по-русски устойчивое «впасть в искушение» естественно передаёт вхождение в ситуацию искушения и не означает непременно окончательной уступки ему.
- source_word: πειρασμόν
  choice: искушение
  rationale: В ближайшем контексте духовной уязвимости учеников «искушение» является наиболее естественным смыслом. Более широкие значения испытания сохранены в сноске.
theological_decisions:
- issue: Значение πειρασμός в предостережении Иисуса
  choice: искушение
  alternative: испытание
  rationale: Контекст предстоящего духовного падения учеников поддерживает значение «искушение», но греческое слово может обозначать и испытание шире; эта смысловая напряжённость не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным синтаксисом. Заглавное «Он» употреблено как традиционное уважительное обозначение Иисуса, без добавления толкования.
