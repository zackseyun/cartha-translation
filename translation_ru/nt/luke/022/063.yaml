  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: ru
  text: А мужчины, удерживавшие Иисуса, насмехались над Ним, избивая Его,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужчины, державшие Его под стражей».'
    reason: 'Лексическая альтернатива для συνέχοντες: в данном контексте глагол может быть передан с более явным указанием на содержание под стражей.'
lexical_decisions:
- source_word: συνέχοντες
  choice: державшие
  rationale: Причастие передаёт физическое удержание Иисуса под стражей; «державшие» сохраняет конкретность греческого слова, не вводя более узкого обозначения должности.
- source_word: ἐνέπαιζον
  choice: насмехались над Ним
  rationale: Глагол обозначает враждебную насмешку и издевательство; выбран естественный и литературный русский эквивалент.
- source_word: αὐτῷ
  choice: над Ним
  rationale: Русское управление глагола «насмехаться» требует предлога «над» с творительным падежом.
- source_word: δέροντες
  choice: били Его
  rationale: Причастие обозначает нанесение ударов как сопутствующее действие; «били» ясно передаёт смысл, не уточняя способ наказания как порку.
- source_word: ἄνδρες
  choice: мужчины
  rationale: Греческий текст прямо называет их мужчинами, а не стражниками или воинами; перевод не сужает значение по контексту.
- source_word: Καὶ
  choice: А
  rationale: В данном повествовательном переходе «А» естественно связывает стих с предыдущим контекстом, сохраняя простой соединительный характер частицы.
theological_decisions:
- issue: Кем были издевавшиеся над Иисусом
  choice: державшие Иисуса мужчины
  alternative: стражники, державшие Иисуса
  rationale: ἄνδρες означает «мужчины»; хотя контекст подразумевает лиц, державших Иисуса под стражей, перевод не добавляет отсутствующего в тексте должностного обозначения.
translation_notes:
  register: 'Современный литературный русский язык. Порядок «били Его и насмехались над Ним» выбран ради естественности: оба несовершенных глагола передают одновременные продолжающиеся действия греческого ἐνέπαιζον… δέροντες. Имя «Иисуса» использовано вместо первого местоимения для ясности вне контекста отдельного стиха.'
