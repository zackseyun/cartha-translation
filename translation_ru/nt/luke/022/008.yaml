lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямо передаёт аорист ἀποστέλλω и сохраняет простоту повествования.
- source_word: εἰπών
  choice: сказав
  rationale: Естественно сохраняет причастную связь с основным глаголом и вводит прямую речь.
- source_word: Πορευθέντες
  choice: Пойдите
  rationale: В сочетании с повелительным ἑτοιμάσατε причастие выражает предварительное сопутствующее действие; русское повелительное наклонение естественно передаёт его силу.
- source_word: ἑτοιμάσατε
  choice: приготовьте
  rationale: Ясно обозначает требуемые практические приготовления и естественно сочетается со словом «пасха» в значении праздничной трапезы.
- source_word: ἡμῖν
  choice: нам
  rationale: Передаёт дательный падеж заинтересованного лица без добавочного «для всех нас», отсутствующего в греческом тексте.
- source_word: τὸ πάσχα
  choice: пасху
  rationale: Сохраняет широту значения πάσχα, которое может обозначать праздник, пасхальную трапезу или связанное с ней жертвенное животное; контекст приготовления и еды указывает прежде всего на трапезу.
- source_word: ἵνα φάγωμεν
  choice: чтобы нам её съесть
  rationale: Передаёт цель, выраженную ἵνα с сослагательным наклонением; местоимение «её» естественно обозначает подразумеваемый объект еды.
theological_decisions:
- issue: Значение выражения τὸ πάσχα
  choice: пасху
  alternative: пасхальную трапезу; пасхального ягнёнка
  rationale: Контекст приготовления к еде особенно поддерживает значение трапезы, однако само греческое слово имеет более широкий диапазон. Основной текст не сужает его без необходимости, а примечание разъясняет контекст.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным библейским повествовательным регистром. Заглавное «Он» употреблено как традиционное указание на Иисуса, чей референт ясен из контекста. Слово «пасха» в основном тексте написано со строчной буквы, поскольку в данной синтаксической позиции оно прежде всего обозначает то, что готовят и едят, при сохранении смысловой связи с праздником.
