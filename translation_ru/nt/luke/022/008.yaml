  source_fidelity: 'Смысл греческого текста в целом передан точно: Иисус посылает Петра и Иоанна и велит им приготовить πάσχα с целью общей трапезы. Однако местоимение «её» после «пасху» в современном русском может ненужно закреплять женский грамматический род и звучит менее естественно, тогда как греческий текст не выражает отдельного местоименного объекта.'
  naturalness: '«Чтобы нам её съесть» грамматически возможно, но тяжеловесно и стилистически менее гладко. «Чтобы мы могли поесть» естественнее, но ослабляет явную связь с πάσχα. Наиболее ровно и точно: «чтобы мы могли есть»; однако русское «приготовить нам пасху, чтобы мы могли есть» всё же несколько неполно. Безопасное решение — «чтобы мы могли совершить пасхальную трапезу» — чрезмерно конкретизирует. Поэтому лучше сохранить прямой объект как «чтобы мы съели её», что естественнее исходного, хотя всё ещё связано с женским родом «пасхи».'
  terminology: «Пасха» в современном русском обычно пишется с прописной буквы как название праздника; в данном контексте она может метонимически обозначать пасхальную трапезу. Написание «пасха» со строчной буквы способно создать впечатление нарицательного названия блюда и не соответствует обычной библейской орфографии. Следует написать «Пасху» и оставить примечание, сохраняющее лексическую широту τὸ πάσχα.
