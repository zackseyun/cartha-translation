  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: ru
  text: 'Так же Он взял чашу после вечери и сказал: «Эта чаша — новый завет[a] в Моей крови, которая изливается за вас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «новое завещание». В данном библейском контексте греческое слово обычно означает «завет».'
    reason: alternative_reading
  - marker: b
    text: В греческом тексте слова «изливается за вас» стоят после всей предшествующей фразы и формально могут относиться к «чаше»; по смыслу естественнее всего понимать, что изливается кровь Иисуса.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ποτήριον
  choice: чаша
  rationale: Обычное и естественное обозначение сосуда для питья; не вносит излишне литургического оттенка слова «потир».
- source_word: ὡσαύτως
  choice: так же поступил Он
  rationale: Передаёт связь с предшествующим действием над хлебом и естественно восполняет греческий эллипсис в русском синтаксисе.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: после вечери
  rationale: Сохраняет временную последовательность и dignified библейский регистр; «вечеря» понятна в данном контексте и не чрезмерно архаична.
- source_word: λέγων
  choice: сказав
  rationale: Естественно передаёт сопутствующее речевое действие после восполнения эллиптической конструкции.
- source_word: καινὴ διαθήκη
  choice: новый завет
  rationale: «Завет» передаёт библейский смысл установленного Богом союзного отношения и ветхозаветный фон выражения о крови завета.
- source_word: ἐν τῷ αἵματί μου
  choice: в Моей крови
  rationale: Формально близко сохраняет многозначность предлога ἐν и не уточняет без необходимости, означает ли он средство, основание или сферу установления завета.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: которая изливается за вас
  rationale: По смыслу относит излияние к крови; «за вас» передаёт жертвенную направленность ὑπέρ, не навязывая более узкой догматической формулы.
theological_decisions:
- issue: Значение διαθήκη в евхаристическом контексте
  choice: новый завет
  alternative: новое завещание
  rationale: Контекст крови, устанавливающей завет, отсылает к библейской заветной традиции; «завещание» в современном русском прежде всего означает посмертное распоряжение имуществом.
- issue: К чему относится ἐκχυννόμενον
  choice: по смыслу к «Моей крови»
  alternative: формально к «чаше» или ко всей предшествующей формуле
  rationale: Греческая форма среднего рода допускает синтаксическую связь как с ποτήριον, так и с αἷμα, а оборот стоит после всей формулы. Однако в контексте изливается кровь, а не сосуд; основной текст передаёт этот наиболее естественный смысл, а примечание сохраняет сведения о строении оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Эллипсис оригинала восполнен выражением «поступил Он и с чашей», чтобы стих был грамматически завершён без добавления нового действия. Местоимение «Моей» написано с прописной буквы в соответствии с принятым благоговейным издательским регистром.
