  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: ru
  text: Пока Он ещё говорил, вот, появилась толпа. Впереди шёл[a] человек по имени Иуда, один из Двенадцати. Он приблизился к Иисусу, чтобы поцеловать Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вёл их за собой».'
    reason: Глагол может означать как движение впереди группы, так и ведение группы за собой.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Пока Он ещё говорил
  rationale: Родительный самостоятельный оборот передаёт продолжающееся действие, одновременное с последующим событием; такая формулировка естественна для современного русского языка.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет указательный дискурсивный маркер и повествовательную внезапность без архаичного «се».
- source_word: ὄχλος
  choice: появилась толпа
  rationale: Существительное означает «толпа»; глагол «появилась» естественно восполняет подразумеваемое прибытие и передаёт внезапность сцены.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: человек по имени Иуда
  rationale: Современное и ясное обозначение названного лица; слово «человек» эксплицирует подразумеваемого носителя имени, не добавляя оценочного оттенка.
- source_word: εἷς τῶν δώδεκα
  choice: один из двенадцати
  rationale: Точно сохраняет указание на принадлежность Иуды к кругу двенадцати и присущую повествованию напряжённость.
- source_word: προήρχετο αὐτούς
  choice: Впереди шёл … [a]
  rationale: Передаёт пространственное значение «идти впереди» и несовершенный вид имперфекта; возможный оттенок «вести за собой» отмечен в сноске.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: Он приблизился к Иисусу
  rationale: Естественно и точно передаёт направленное приближение, выраженное ἐγγίζω с дательным падежом.
- source_word: φιλῆσαι αὐτόν
  choice: чтобы поцеловать Его
  rationale: Сохраняет простое лексическое значение инфинитива цели, не добавляя прямо не выраженного здесь мотива предательства.
theological_decisions:
- issue: Повествовательное изображение поступка Иуды
  choice: Передать приближение и намерение поцеловать без добавления слова «предать».
  alternative: «чтобы предать Его поцелуем»
  rationale: Контекст раскрывает предательство, однако сам стих описывает приближение и предполагаемый поцелуй. Перевод не должен устранять повествовательное напряжение интерпретирующим расширением.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаичным звучанием. Местоимения, относящиеся к Иисусу, даны с прописной буквы согласно распространённой русской библейской издательской традиции. Длинное греческое предложение разделено на три русских для ясности и естественного повествовательного ритма.
