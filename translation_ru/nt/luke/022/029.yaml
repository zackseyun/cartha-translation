  text: И Я дарую вам Царство[a], как Отец Мой даровал его Мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я заключаю с вами завет о Царстве, как Отец заключил его со Мной». Греческий глагол может обозначать распоряжение, наделение или заключение завета.'
