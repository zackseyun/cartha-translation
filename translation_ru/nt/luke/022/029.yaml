    reason: source_structure
lexical_decisions:
- source_word: κἀγὼ
  choice: И Я
  rationale: Передаёт соединительное καί и подчёркнутое ἐγώ, связывая слова Иисуса с предшествующим контекстом.
- source_word: διατίθεμαι / διέθετό
  choice: передаю / передал
  rationale: «Передавать» естественно по-русски выражает распоряжение и наделение Царством, сохраняет единый глагол в обеих параллельных частях и не навязывает исключительно заветный или завещательный смысл.
- source_word: ὑμῖν / μοι
  choice: вам / Мне
  rationale: Дательные формы прямо обозначают получателей.
- source_word: καθὼς
  choice: как
  rationale: Ясно и естественно вводит соответствие между действием Иисуса и действием Отца.
- source_word: ὁ πατήρ μου
  choice: Мой Отец
  rationale: Современная литературная форма, сохраняющая личное сыновнее отношение.
- source_word: βασιλείαν
  choice: Царство
  rationale: В контексте следующего стиха речь идёт о даруемом царском уделе и участии в царской власти; «Царство» сохраняет также возможный смысл царствования.
theological_decisions:
- issue: Следует ли явно передавать διατίθεμαι языком завета или завещания
  choice: передаю
  alternative: завещаю; устанавливаю для вас по завету
  rationale: Глагол допускает значение распоряжения, наделения и заключения завета. Нейтральное «передаю» сохраняет основную мысль о даровании Царства, не устраняя возможный заветный оттенок, который отмечен в сноске.
- issue: Относится ли βασιλείαν к обоим глаголам
  choice: Повторно обозначить объект местоимением «его» во второй части
  alternative: 'Сохранить общий объект в конце: «передаю вам, как Мой Отец передал Мне, Царство»'
  rationale: В греческом один объект, стоящий в конце, грамматически относится к обоим глаголам. По-русски повтор местоимения делает эту связь ясной и сохраняет параллелизм без тяжёлого порядка слов.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Заглавные буквы в «Я», «Мне», «Мой Отец» следуют принятой в русском библейском стиле практике; «Царство» выделено как конкретное Царство в данном богословском контексте. Формулировка избегает архаичного «завещаваю» в основном тексте.
