  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: ru
  text: Но Я молился о тебе, чтобы твоя вера[a] не иссякла; а ты, когда вернёшься[b], укрепи своих братьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность» или «доверие». Греческое слово может совмещать эти смысловые оттенки.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «когда возвратишься» или «когда вернёшься назад». Эти слова подразумевают восстановление Петра после его предстоящего падения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: молился
  rationale: Глагол обозначает настойчивую просьбу в молитве. «Молился» естественно передаёт заступническую молитву Иисуса, не усиливая выражение до «умолял».
- source_word: περὶ σοῦ
  choice: о тебе
  rationale: При глаголе молитвы περί с родительным падежом указывает на того, за кого молятся; по-русски это естественно передаётся сочетанием «молиться о ком-либо».
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: чтобы … не иссякла
  rationale: ἐκλείπω означает иссякнуть, прекратиться, оказаться недостаточным. «Не иссякла» сохраняет образ постепенного прекращения и не утверждает прямо полную утрату веры.
- source_word: πίστις
  choice: вера
  rationale: «Вера» сохраняет широкое значение πίστις, включающее доверие и верность, и не сужает смысл до одного из этих оттенков.
- source_word: ποτε
  choice: когда
  rationale: В данном контексте ποτέ указывает на будущий момент после предстоящего падения Петра. «Когда» естественно связывает причастный оборот с последующим повелением.
- source_word: ἐπιστρέψας
  choice: когда вернёшься
  rationale: Глагол может означать возвращение или обращение назад. «Вернёшься» сохраняет направительный образ и подразумеваемое восстановление Петра, не вводя в основной текст более узкий термин «покаешься».
- source_word: στήρισον
  choice: укрепи
  rationale: Повеление означает сделать других стойкими, поддержать и утвердить их. «Укрепи» точно и естественно передаёт этот смысл.
- source_word: ἀδελφούς
  choice: братьев
  rationale: В непосредственном контексте речь идёт о других учениках Иисуса, мужчинах; поэтому сохраняется грамматически мужская форма исходного текста.
theological_decisions:
- issue: Значение πίστις в условиях испытания Петра
  choice: вера
  alternative: верность; доверие
  rationale: «Вера» сохраняет богословскую и смысловую широту греческого слова. Возможные оттенки верности и доверия указаны в сноске, но не подменяют основной смысл.
- issue: Смысл ἐπιστρέψας после будущего отречения Петра
  choice: когда вернёшься
  alternative: когда обратишься; когда снова повернёшься
  rationale: Формулировка указывает на восстановление после падения, однако сам греческий глагол не требует технического богословского значения «покаяться» или «обратиться». Перевод сохраняет эту напряжённость.
- issue: Круг лиц, обозначенных ἀδελφούς
  choice: братьев
  alternative: братьев и сестёр; единоверцев
  rationale: Ближайшими адресатами служения Петра здесь являются другие ученики-мужчины, поэтому инклюзивное расширение было бы контекстуально неоправданным.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи Иисуса. Порядок слов естественный, но ключевые образы исходного текста сохранены. Местоимение «Я» написано с прописной буквы по норме начала смыслового противопоставления, без дополнительной конфессиональной стилизации.
