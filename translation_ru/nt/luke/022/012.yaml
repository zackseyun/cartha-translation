  text: κἀκεῖνος ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον· ἐκεῖ ἑτοιμάσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: ru
  text: И он покажет вам большую верхнюю комнату, уже обставленную[a]. Там приготовьте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большую верхнюю комнату, уже приготовленную»; возможно также: «большую верхнюю комнату с уже расставленными ложами».'
    reason: Причастие ἐστρωμένον описывает помещение как уже устроенное для использования; в данном контексте оно может конкретнее подразумевать расставленные ложа или подготовленные места для трапезы.
lexical_decisions:
- source_word: κἀκεῖνος
  choice: И он
  rationale: Сочетание καί + ἐκεῖνος продолжает последовательность указаний и отсылает к ранее названному хозяину дома; «И он» звучит естественно и сохраняет связь с контекстом.
- source_word: ὑμῖν δείξει
  choice: покажет вам
  rationale: Будущее время δείκνυμι с дательным дополнением прямо и естественно передаётся как «покажет вам».
- source_word: ἀνάγαιον μέγα
  choice: большую верхнюю комнату
  rationale: ἀνάγαιον обозначает помещение на верхнем этаже, а μέγα — его большой размер; перевод не добавляет значения гостевой комнаты.
- source_word: ἐστρωμένον
  choice: уже обустроенную
  rationale: Перфектное страдательное причастие описывает комнату в готовом, устроенном состоянии, вероятно с разложенными принадлежностями для трапезы. «Уже обустроенную» сохраняет значение достигнутого состояния, не утверждая, что все пасхальные приготовления завершены.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: Там и приготовьте
  rationale: ἐκεῖ передано прямым указанием места, а аористный императив множественного числа — кратким повелением. Частица «и» естественно подчёркивает указанное место.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и повествовательный, тон достоин библейского наставления. Слово «горница» не использовано как менее прозрачное для части современных читателей.
