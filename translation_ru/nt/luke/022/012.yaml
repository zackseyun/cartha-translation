    issue: «Уже обустроенную» для ἐστρωμένον
    rationale: Слово «обустроенную» широко обозначает приведение помещения в порядок или оснащение и слабее отражает значение «устланную/обставленную, с приготовленными местами». Более точное «обставленную» остаётся естественным и не чрезмерно конкретизирует.
  - severity: low
    issue: Частица «и» в «Там и приготовьте»
    rationale: В ἐκεῖ ἑτοιμάσατε нет отдельной частицы, требующей такого усиления. Без неё русская фраза точнее передаёт простой локативный акцент.
  - severity: low
    issue: «Разложенные принадлежности» в примечании
    rationale: Формулировка неестественна по-русски и расплывчата. Вероятный конкретный образ — расставленные ложа или подготовленные места для трапезы.
