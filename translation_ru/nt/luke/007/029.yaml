  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: ru
  text: И весь народ, услышав это, — в том числе и сборщики налогов — признал правоту Бога[a], приняв крещение Иоанна.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оправдали Бога»; то есть признали, что Бог прав.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также причинное понимание: «потому что приняли крещение Иоанна».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Коллективное выражение передано естественным русским соответствием, сохраняющим широкий охват.
- source_word: ἀκούσας
  choice: услышав это
  rationale: Аористное причастие имеет временное значение; «это» естественно восполняет подразумеваемый из контекста объект.
- source_word: οἱ τελῶναι
  choice: сборщики налогов
  rationale: Современное и понятное обозначение людей, собиравших налоги и пошлины.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: признали правоту Бога
  rationale: Оборот означает, что люди признали Бога правым, а не сделали Его праведным. Формулировка сохраняет судебный оттенок и ясна современному читателю.
- source_word: βαπτισθέντες
  choice: приняв
  rationale: Нейтральный деепричастный оборот передаёт сопутствующее или предшествующее обстоятельство, не закрепляя однозначно причинное понимание.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: Иоанново крещение
  rationale: Кратко и естественно передаёт родительный оборот как установленное Иоанном и связанное с ним крещение, не утверждая непременно, что каждого лично крестил Иоанн.
theological_decisions:
- issue: Значение выражения ἐδικαίωσαν τὸν θεόν
  choice: Люди признали правоту Бога.
  alternative: 'Более буквально: «оправдали Бога».'
  rationale: Речь идёт о признании людьми Божьей правоты, а не об изменении статуса Бога. Основной вариант понятен и сохраняет судебную образность.
- issue: Смысловая связь причастия βαπτισθέντες с главным глаголом
  choice: Связь оставлена обстоятельственной и не уточнена как явно причинная.
  alternative: «Потому что приняли Иоанново крещение».
  rationale: Греческое причастие допускает причинное понимание, но само по себе его не требует; нейтральная передача сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. Сочетание «в том числе и» показывает, что сборщики налогов входят в названную совокупность, не добавляя отсутствующего в греческом тексте оттенка удивления. Согласование по смыслу во множественном числе после коллективного «весь народ» поддержано включением отдельной группы.
