  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: ru
  text: 'И сказал ей: «Твои грехи прощены».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на завершённое действие: «Твои грехи были прощены». Греческая форма может подчёркивать совершившееся действие и сохраняющийся результат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: сказал
  rationale: Аорист λέγω здесь естественно передаётся обычной повествовательной формой «сказал».
- source_word: δὲ
  choice: И
  rationale: δέ служит мягкой повествовательной связкой без обязательного противопоставления; «и» сохраняет связь с контекстом и звучит естественно.
- source_word: αὐτῇ
  choice: ей
  rationale: Дательный падеж обозначает адресата речи и непосредственно передаётся русским «ей».
- source_word: Ἀφέωνταί
  choice: прощены
  rationale: Перфект пассивного залога выражает совершившееся прощение и сохраняющийся результат; краткая форма «прощены» естественно обозначает установленное состояние.
- source_word: σου
  choice: твои
  rationale: Родительный падеж местоимения передан нормативной русской притяжательной формой, согласованной со словом «грехи».
- source_word: αἱ ἁμαρτίαι
  choice: грехи
  rationale: «Грехи» точно передаёт нравственные проступки перед Богом; артикль отдельно в русском не выражается.
theological_decisions:
- issue: Значение перфекта пассивного залога Ἀφέωνταί в провозглашении прощения
  choice: «Твои грехи прощены» — состояние как результат совершившегося действия
  alternative: «Твои грехи были прощены»
  rationale: Русское «прощены» естественно сохраняет одновременно завершённость прощения и его действующий результат, не уточняя сверх текста ни время, ни подразумеваемого деятеля.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная прямая речь. Мягкая связка δέ передана союзом «и», а порядок слов сохраняет повествовательную ясность.
