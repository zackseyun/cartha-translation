lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Противительный союз продолжает ряд риторических вопросов и противопоставляет этот вопрос предыдущему.
- source_word: τί
  choice: что
  rationale: Вопросительное местоимение является дополнением при «увидеть»; перевод «что» сохраняет форму греческого текста и не заменяет её более истолковывающим «кого».
- source_word: ἐξήλθατε
  choice: вы вышли
  rationale: Аорист, действительный залог, второе лицо множественного числа; речь идёт о совершённом выходе к Иоанну.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Инфинитив цели после «вышли»; «увидеть» естественно передаёт значение ὁράω и сохраняет направленность действия.
- source_word: προφήτην
  choice: Пророка
  rationale: Винительный падеж в кратком эллиптическом риторическом вопросе; это нарицательное обозначение, а прописная буква обусловлена началом отдельного вопроса.
- source_word: ναί
  choice: Да
  rationale: Прямой и сильный утвердительный ответ на риторический вопрос.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохранена обычная евангельская формула прямого утверждения без стилистического усиления.
- source_word: καὶ
  choice: и
  rationale: Союз присоединяет кульминационное сравнительное утверждение; простое «и» не привносит лишнего толкования.
- source_word: περισσότερον προφήτου
  choice: нечто большее, чем пророк
  rationale: 'Средний род сравнительной степени может употребляться субстантивированно: «нечто большее». Такая формулировка естественна по-русски и сохраняет сжатое сравнение с пророком.'
theological_decisions:
- issue: Статус Иоанна Крестителя в словах Иисуса
  choice: Иоанн назван пророком и одновременно «нечто большим, чем пророк», без пояснения в самом стихе, в чём именно состоит это превосходство.
  alternative: 'Передать смысл развёрнуто: «тем, кто превосходит всех пророков» или прямо назвать Иоанна эсхатологическим посланником.'
  rationale: Греческий текст утверждает превосходство над обычным статусом пророка, но не говорит здесь, что Иоанн величайший среди всех пророков, и не раскрывает основания его особого положения. Это поясняется дальнейшим контекстом, а не должно добавляться в перевод стиха.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой риторической структуры оригинала. Формула «говорю вам» звучит торжественно, но остаётся понятной; «нечто большее, чем пророк» сохраняет необычную и намеренно неразвёрнутую формулировку греческого текста.
