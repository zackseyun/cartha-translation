  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: ru
  text: 'И, повернувшись к женщине, Он сказал Симону: «Видишь эту женщину? Я вошёл в твой дом, а ты не дал Мне воды для ног[a]; она же намочила Мне ноги своими слезами и вытерла их своими волосами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не дал Мне воды на ноги». Речь идёт об обычном предоставлении воды для омовения ног.'
    reason: Сноска сохраняет более формальное значение оборота ἐπὶ πόδας и поясняет подразумеваемое назначение воды, не вводя его непосредственно в основной текст.
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: повернувшись к женщине
  rationale: Естественно передаёт аористное причастие и физический поворот Иисуса к женщине перед обращением к Симону.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Видишь эту женщину?
  rationale: Сохраняет прямой риторический вопрос и указательное местоимение, подчёркивающее женщину, о которой идёт речь.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Я вошёл в твой дом
  rationale: Точно и естественно передаёт аорист εἰσῆλθον и οἰκία без добавочного смыслового оттенка.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: ты не дал Мне воды для ног
  rationale: Передаёт прямо названное предоставление воды, не добавляя отсутствующего в греческом тексте глагола «омыть»; «для ног» естественно выражает назначение воды.
- source_word: αὕτη δὲ
  choice: она же
  rationale: Контрастная частица δέ передана конструкцией «же», подчёркивающей противопоставление поступка женщины без излишнего усиления.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: намочила Мне ноги своими слезами
  rationale: «Намочила» точно и современно передаёт βρέχω, а творительный падеж выражает инструментальное значение τοῖς δάκρυσιν.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: вытерла их своими волосами
  rationale: Естественно передаёт действие ἐκμάσσω; местоимение «их» недвусмысленно относится к ногам, а «своими» передаёт αὐτῆς.
