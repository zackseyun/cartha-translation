  source_fidelity: 'Требуется исправление согласования времён и синтаксической связи. Греческое ἐλήλυθεν («пришёл / явился») сопровождается причастиями ἐσθίων καὶ πίνων, обозначающими образ или сопутствующее обстоятельство прихода: «пришёл, вкушая и пия» в буквальной форме; в современном русском естественно «пришёл, ел и пил» или «пришёл, чтобы есть и пить». Сочетание «пришёл, ест и пьёт» без пояснения создаёт не мотивированное источником смешение прошедшего и настоящего времени. Наиболее точная и естественная передача здесь: «пришёл, ел и пил». Остальные ключевые соответствия верны; «обжора и пьяница» адекватно сохраняет характер враждебного обвинения.'
