  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: ru
  text: 'Сын Человеческий пришёл, ел и пил, а вы говорите: «Вот обжора и пьяница[a], друг сборщиков налогов и грешников!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вот человек, обжора и винопийца».'
    reason: 'Лексическая альтернатива: сноска сохраняет явное ἄνθρωπος и более буквальную передачу οἰνοπότης.'
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: пришёл
  rationale: Русское прошедшее совершенного вида естественно передаёт совершившийся приход и сохраняет его актуальность в описываемом противопоставлении.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача самообозначения Иисуса сохраняет титульный характер выражения и возможный отзвук Дан 7:13.
- source_word: ἐσθίων καὶ πίνων
  choice: ест и пьёт
  rationale: Настоящее время по-русски естественно передаёт образ поведения, сопровождающий приход Сына Человеческого, и сохраняет живую форму противопоставления.
- source_word: λέγετε
  choice: вы говорите
  rationale: Прямо передаёт настоящее время и обращение во втором лице множественного числа.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современное и естественное восклицательное указание без архаизации.
- source_word: ἄνθρωπος φάγος
  choice: обжора
  rationale: В основном тексте слово ἄνθρωπος естественно опускается в русской именной характеристике; φάγος передаётся резким существительным, соответствующим характеру обвинения.
- source_word: οἰνοπότης
  choice: пьяница
  rationale: Передаёт оскорбительную силу обвинения; более буквальное «любитель вина» приведено в сноске.
- source_word: φίλος
  choice: друг
  rationale: Прямая и естественная передача характеристики, поставленной в один ряд с обвинениями.
- source_word: τελωνῶν
  choice: сборщиков налогов
  rationale: Понятный современному читателю эквивалент исторической профессии без малоупотребительного слова «мытари».
- source_word: ἁμαρτωλῶν
  choice: грешников
  rationale: Прямая передача общественно-религиозного обозначения, употреблённого противниками Иисуса.
theological_decisions:
- issue: Передача титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человек / Человеческий Сын
  rationale: Устоявшаяся форма сохраняет христологическую и возможную межтекстовую значимость выражения, не сводя его к простому обозначению человека.
- issue: Сила обвинений φάγος καὶ οἰνοπότης
  choice: обжора и пьяница
  alternative: человек, обжора и любитель вина
  rationale: Речь передаёт враждебную клевету, а не авторскую нравственную оценку; основной текст сохраняет резкость обвинений, тогда как буквальная структура отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Форма «Сын Человеческий» сохранена как узнаваемый титул; «сборщики налогов» выбрано ради ясности, а обвинительные слова оставлены намеренно резкими.
