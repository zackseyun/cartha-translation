base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: ru
  text: У одного сотника был раб[a], который тяжело болел и был при смерти. Сотник очень дорожил им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга». Греческое слово δοῦλος может в зависимости от контекста означать раба или слугу; здесь слово «раб» передаёт подразумеваемое положение несвободного человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου δέ τινος
  choice: У одного сотника был
  rationale: Конструкция естественно вводит нового участника повествования, сохраняет неопределённость τινος и мягкий переход δέ без искусственного вводного слова.
- source_word: δοῦλος
  choice: раб
  rationale: В данном бытовом и социальном контексте слово обозначает несвободного человека, принадлежавшего сотнику; «слуга» могло бы скрыть эту сторону значения.
- source_word: κακῶς ἔχων
  choice: тяжело болел
  rationale: Греческий оборот означает, что человек был серьёзно нездоров; такой перевод естественен по-русски и соответствует близости смерти.
- source_word: ἤμελλεν τελευτᾶν
  choice: был при смерти
  rationale: Передаёт непосредственную близость смерти, выраженную μέλλω с инфинитивом, естественным русским оборотом.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: Сотник очень дорожил им
  rationale: ἔντιμος здесь указывает на высокую ценность раба для сотника. Активная русская конструкция яснее обозначает носителя отношения и не обязательно привносит избыточную сентиментальность.
theological_decisions:
- issue: Передача δοῦλος в контексте домашнего рабства
  choice: раб
  alternative: слуга
  rationale: «Раб» сохраняет исторически существенное отношение несвободы и принадлежности, тогда как «слуга» может быть понят как свободный наёмный работник. Альтернатива отмечена в сноске из-за диапазона употребления греческого слова.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Предложения разделены для естественного русского синтаксиса; смысловая связь и местоименная отсылка сохранены.
