id: LUK.7.28
reference: Luke 7:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: ru
  text: 'Говорю вам: среди рождённых женщинами нет никого более великого, чем Иоанн[a]. Но тот, кто меньше всех в Царстве Божьем, больше Иоанна.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «рождённые женщинами» означает людей вообще.
    reason: cultural_note
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Говорю вам
  rationale: Прямая и естественная передача обычной формулы речи с сохранением настоящего времени греческого глагола.
- source_word: μείζων
  choice: больше
  rationale: Сохраняет сравнительное значение, не уточняя, идёт ли речь о положении, значимости или иной форме величия.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: среди рождённых женщинами
  rationale: Достаточно буквально сохраняет семитскую идиому, обозначающую людей вообще.
- source_word: Ἰωάννου
  choice: Иоанна
  rationale: Традиционная русская форма имени; родительный падеж обусловлен сравнительной конструкцией.
- source_word: οὐδείς ἐστιν
  choice: нет никого
  rationale: Естественная русская передача греческой отрицательной экзистенциальной конструкции.
- source_word: ὁ δὲ μικρότερος
  choice: Но меньший
  rationale: Субстантивированное сравнительное прилагательное передано без добавления отсутствующего в греческом уточнения; «но» выражает противопоставление δέ.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: в Царстве Божьем
  rationale: Естественное современное русское выражение, сохраняющее локативный образ и традиционный библейский термин.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: больше его
  rationale: Краткая и естественная сравнительная конструкция; местоимение относится к Иоанну, а основание сравнения остаётся неуточнённым.
theological_decisions:
- issue: Смысл сравнения Иоанна с меньшим в Царстве Божьем
  choice: Сохранено парадоксальное сравнение без пояснения основания величия.
  alternative: Уточнить, что речь идёт о заветной привилегии, духовном достоинстве, историческом положении или риторической гиперболе.
  rationale: Греческий текст не определяет, в каком именно смысле меньший в Царстве больше Иоанна; уточнение внесло бы частное богословское толкование.
- issue: Референт выражения ὁ μικρότερος
  choice: Передано как «меньший», то есть субстантивированное сравнительное прилагательное.
  alternative: «Тот, кто меньше всех» или «самый малый».
  rationale: Форма μικρότερος является сравнительной; русское «меньший» сохраняет её и не превращает автоматически в превосходную степень.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейским звучанием. Сохранены лаконизм, сравнительные формы и богословская неоднозначность исходного текста.
