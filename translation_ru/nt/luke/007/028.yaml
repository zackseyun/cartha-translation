  rationale: Исправлены две русские стилистико-синтаксические трудности. Перевод по-прежнему сохраняет идиоматичность исходного выражения, сравнительный и парадоксальный характер высказывания, а также не объясняет, в каком именно смысле говорится о превосходстве.
