  source_fidelity: 'В целом смысл передан верно: сохранены формула «говорю вам», идиома о рождённых женщинами, сравнение с Иоанном и нераскрытое основание «величия». Однако «меньший» в русском без точки сравнения звучит незавершённо и не передаёт естественную для артикльного сравнительного форму греческого ὁ μικρότερος в значении «тот, кто меньше всех / наименьший».'
  naturalness: «Среди рождённых женщинами» допустимо и сохраняет намеренно необычную идиому. В первой сравнительной конструкции «нет никого больше Иоанна» разговорно-неоднозначно; «нет никого более великого, чем Иоанн» яснее и лучше соответствует возвышенному, но современному регистру.
  terminology: «Царство Божье» и «Иоанн» выбраны удачно. «Более великий» и «больше» оставляют основание сравнения неуточнённым и не навязывают богословского истолкования.
  issues:
  - severity: medium
    issue: «Но меньший в Царстве Божьем»
    rationale: Русское «меньший» обычно требует явно названного предмета или группы сравнения и здесь воспринимается стилистически шероховато. Конструкция «тот, кто меньше всех в Царстве Божьем» естественно передаёт субстантивированное ὁ μικρότερος, не уточняя, в каком отношении он «меньше».
  - severity: low
    issue: «нет никого больше Иоанна»
    rationale: Конструкция возможна, но «больше» может ассоциироваться с размером или количеством и не столь ясно оформляет сравнение. «Нет никого более великого, чем Иоанн» естественнее в литературном библейском регистре.
