base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: ru
  text: И вот, женщина, которая была в городе и была грешницей[a], узнав, что Он возлежит за столом в доме фарисея[b], принесла алебастровый сосуд с благовонием[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст говорит просто «грешница» и не уточняет, в чём состоял её грех.
    reason: lexical_alternative
  - marker: b
    text: То есть возлежит в принятой тогда позе участника трапезы.
    reason: cultural_note
  - marker: c
    text: 'Или: «алебастровый флакон с ароматическим маслом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет повествовательный указатель, вводящий неожиданное и значимое появление женщины, и звучит естественно в современном литературном русском.
- source_word: γυνὴ ἥτις ἦν ἐν τῇ πόλει
  choice: одна женщина из того города
  rationale: Передаёт введение нового лица и её связь с уже упомянутым городом. Русское «из того города» естественнее буквального «в городе», не предполагая сверх текста, что она непременно постоянно там жила.
- source_word: ἁμαρτωλός
  choice: была грешницей
  rationale: Сохраняет именную нравственную характеристику, не уточняя вид греха и не отождествляя женщину с блудницей.
- source_word: ἐπιγνοῦσα
  choice: узнав
  rationale: Естественно передаёт предшествующее по отношению к основному действию получение сведений.
- source_word: κατάκειται
  choice: возлежит за столом
  rationale: Передаёт настоящее время греческого глагола и принятую в древности позу участников трапезы; добавление «за столом» ясно обозначает контекст.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: в доме фарисея
  rationale: Прямое и естественное русское соответствие без ненужного уточнения личности хозяина.
- source_word: κομίσασα
  choice: принесла
  rationale: Кратко и идиоматично передаёт, что женщина принесла предмет с собой.
- source_word: ἀλάβαστρον μύρου
  choice: алебастровый сосуд с благовонием
  rationale: Сохраняет указание на характерный сосуд и ароматическое содержимое, не сужая форму ёмкости и консистенцию вещества сильнее, чем позволяет греческий текст.
theological_decisions:
- issue: Нравственная характеристика женщины
  choice: которая была грешницей
  alternative: грешная женщина; женщина дурного поведения; блудница
  rationale: Греческое ἁμαρτωλός называет её грешницей, но не сообщает, в чём именно состоял её грех. Перевод не вводит традиционное, но не высказанное в стихе отождествление с блудницей.
- issue: Неуказанный субъект κατάκειται
  choice: Он возлежит
  alternative: Иисус возлежит
  rationale: В греческом субъект подразумевается из контекста. Заглавная буква делает местоименную отсылку к Иисусу ясной, не добавляя имени в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «И вот» и «возлежит» сохраняют повествовательную выразительность и культурную конкретность; сноски поясняют нравственную характеристику женщины, обычай трапезы и возможную передачу названия сосуда и его содержимого.
