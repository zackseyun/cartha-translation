  source_fidelity: 'Основной смысл передан верно: женщина названа грешницей без конкретизации греха, узнаёт о трапезе в доме фарисея и приносит алебастровый сосуд с благовонием. Однако «из того города» сужает греческое ἐν τῇ πόλει («в городе»): текст не утверждает её происхождения из города и не содержит «того».'
  naturalness: 'Текст в целом литературный и естественный. «Одна женщина» здесь несколько менее удачно, чем простое «женщина»: греческое γυνή вводит персонажа неопределённо, но не обязательно подчёркивает числительную единичность. «Возлежит за столом» уместно в данном историческом контексте.'
  terminology: '«Грешница» точно передаёт ἁμαρτωλός и не вносит неуказанную сексуальную характеристику. «Алебастровый сосуд с благовонием» приемлемо для ἀλάβαστρον μύρου. В культурной сноске «праздничной» — неоправданное добавление: греческий текст говорит о трапезе, но не о праздничной трапезе.'
