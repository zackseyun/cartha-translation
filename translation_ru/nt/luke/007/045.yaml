  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: ru
  text: Ты не дал Мне поцелуя[a], а она с тех пор, как Я вошёл, не перестаёт целовать[b] Мои ноги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приветствовал Меня поцелуем»; поцелуй был обычным знаком приветствия и гостеприимства.'
    reason: cultural_note
  - marker: b
    text: 'Глагол может подразумевать нежные или многократные поцелуи: «не перестаёт осыпать Мои ноги поцелуями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά μοι οὐκ ἔδωκας
  choice: Ты не дал Мне поцелуя
  rationale: Передаёт существительное φίλημα и конструкцию с δίδωμι без добавления толкования о приветствии; фраза ясна по-русски и сохраняет форму контраста в греческом тексте.
- source_word: αὕτη δὲ
  choice: а она
  rationale: Естественно обозначает уже упомянутую женщину и ясно выражает противопоставление поведению хозяина.
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: с тех пор, как Я вошёл
  rationale: Передаёт временное значение оборота ἀφ’ ἧς и сохраняет простой смысл глагола εἰσέρχομαι.
- source_word: οὐ διέλιπεν
  choice: не перестаёт
  rationale: Настоящее время в русском естественно выражает действие, начавшееся при входе Иисуса и продолжающееся до момента речи.
- source_word: καταφιλοῦσά
  choice: целовать
  rationale: Основной текст остаётся естественным и не перегруженным; возможный усилительный оттенок — многократные или нежные поцелуи — отмечен в сноске.
- source_word: μου τοὺς πόδας
  choice: Мои ноги
  rationale: Сохраняет притяжательное местоимение и явно выраженное в греческом множественное число.
theological_decisions:
- issue: Поцелуй как обычай гостеприимного приветствия
  choice: 'В основном тексте действие названо прямо: «не дал Мне поцелуя».'
  alternative: «не приветствовал Меня поцелуем»
  rationale: Контекст подразумевает принятый знак гостеприимства, однако греческий текст прямо не употребляет слова «приветствовать». Культурное пояснение вынесено в сноску, чтобы не превращать подразумеваемое в сказанное.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Иисусу, соответствуют принятой русской издательской традиции и не меняют смысла исходного текста.
