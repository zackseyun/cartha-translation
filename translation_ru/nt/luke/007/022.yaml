  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: ru
  text: 'И Он ответил им: «Пойдите и сообщите Иоанну о том, что вы видели и слышали: слепые прозревают[a], хромые ходят, прокажённые очищаются, глухие слышат, мёртвые воскрешаются, бедным возвещается Благая весть[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова видят». Греческий глагол может обозначать возвращение зрения; здесь речь идёт об обретении способности видеть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бедным проповедуется Благая весть». В греческом употреблена страдательная форма: бедные — те, кому возвещают Благую весть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Он ответил им
  rationale: Естественная русская формула ответа передаёт смысл причастия ἀποκριθείς и личной формы εἶπεν без тяжеловесного буквального повтора «отвечая, сказал».
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Пойдите и сообщите
  rationale: Сопутствующее причастие перед повелительным наклонением естественно передаётся двумя однородными повелительными формами; «сообщите» выражает передачу Иоанну увиденного и услышанного.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: о том, что вы видели и слышали
  rationale: Формулировка точно и естественно передаёт относительное придаточное и свидетельский характер сообщения.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: слепые прозревают
  rationale: «Прозревают» кратко передаёт обретение или возвращение зрения и сохраняет узнаваемое звучание пророческой образности.
- source_word: χωλοὶ περιπατοῦσιν
  choice: хромые ходят
  rationale: Прямое и понятное соответствие греческой конструкции.
- source_word: λεπροὶ καθαρίζονται
  choice: прокажённые очищаются
  rationale: «Очищаются» сохраняет не только смысл исцеления, но и связанную с ним чистоту, не сводя выражение к медицинскому описанию.
- source_word: κωφοὶ ἀκούουσιν
  choice: глухие слышат
  rationale: При глаголе ἀκούουσιν прилагательное κωφοί однозначно обозначает глухих.
- source_word: νεκροὶ ἐγείρονται
  choice: мёртвые воскрешаются
  rationale: Возвратная пассивная форма сохраняет страдательный залог и не называет действующего лица, как и греческий текст.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: бедным возвещается Благая весть
  rationale: Безлично-пассивная русская конструкция передаёт, что бедные являются адресатами благой вести, и не вводит церковного жаргона.
theological_decisions:
- issue: Перечень чудес как свидетельство о личности и служении Иисуса
  choice: Передать действия как наблюдаемые факты восстановления, сохранив словесные отголоски пророческих текстов, но не добавляя прямого утверждения об их мессианском значении.
  alternative: Явно назвать эти события исполнением мессианских пророчеств.
  rationale: Сам стих предлагает дела Иисуса как ответ Иоанну, но не формулирует их истолкование прямо; перевод не должен добавлять его за текст.
- issue: Страдательный залог в перечне
  choice: Сохранить пассивный смысл в выражениях «очищаются», «воскрешаются» и «бедным возвещается».
  alternative: 'Назвать Бога или Иисуса действующим лицом: «Бог воскрешает мёртвых» или «Я возвещаю бедным Благую весть».'
  rationale: Греческие формы не называют действующего лица; его эксплицитное указание было бы богословским уточнением сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для обычного читателя; сохранены лаконичный ритм перечня, пророческие отголоски и неопределённость относительно действующего лица в пассивных формах. Местоимение «Он» написано с прописной буквы как принятое в русском библейском регистре, без добавления имени, отсутствующего в стихе.
