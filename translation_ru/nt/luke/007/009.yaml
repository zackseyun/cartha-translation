  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: ru
  text: 'Услышав это, Иисус удивился ему и, повернувшись к следовавшей за Ним толпе, сказал: «Говорю вам: даже в Израиле Я не нашёл такой веры[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столь великой веры»; слово, переведённое как «вера», может также означать «доверие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Услышав это
  rationale: Аористное причастие обозначает обстоятельство, предшествующее основному действию; «это» естественно обобщает множественное ταῦτα, относящееся к переданным словам сотника. δέ выражает слабый переход и отдельно не переводится.
- source_word: ἐθαύμασεν αὐτόν
  choice: удивился ему
  rationale: θαυμάζω передаёт удивление или восхищённое изумление; конструкция с дательным «ему» в современном русском естественно сохраняет личный объект αὐτόν, то есть сотника.
- source_word: στραφεὶς
  choice: повернувшись
  rationale: Причастная форма кратко и естественно передаёт сопутствующее действие без превращения его в отдельное равноправное событие.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: к следовавшей за Ним толпе
  rationale: Причастие настоящего времени указывает на продолжающееся следование; «следовать за» сохраняет обычный смысл ἀκολουθέω.
- source_word: Λέγω ὑμῖν
  choice: Говорю вам
  rationale: Сохранена прямая и несколько торжественная формула обращения Иисуса, естественная для литературного русского.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: даже в Израиле … не
  rationale: Русская рамочная конструкция естественно передаёт усилительное οὐδέ — «даже не / даже … не» — и сохраняет возможный смысл Израиля как народа.
- source_word: τοσαύτην πίστιν
  choice: такой веры
  rationale: τοσαύτην обозначает столь значительную меру или качество; «такой веры» сохраняет ёмкость выражения, а более явный вариант вынесен в сноску.
- source_word: εὗρον
  choice: Я не нашёл
  rationale: Греческий аорист непосредственно передан русским прошедшим временем; это естественно в контексте оценки встреченного до данного момента.
theological_decisions:
- issue: Передача πίστις
  choice: вера
  alternative: доверие
  rationale: В контексте речь идёт о доверии сотника власти Иисуса, однако «вера» остаётся широким и традиционно узнаваемым соответствием πίστις, не сужающим богословский смысл до одного оттенка.
- issue: Степень, выраженная τοσαύτην
  choice: такой веры
  alternative: столь великой веры
  rationale: Основной вариант сохраняет качественно-степенную неоднозначность местоимения; альтернатива яснее выражает величину, но слегка усиливает толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским тоном. Заглавные местоимения «Ним», «Я» соответствуют принятой русской издательской традиции, не добавляя толкования к исходному тексту.
