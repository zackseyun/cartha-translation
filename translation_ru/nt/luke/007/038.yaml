base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: ru
  text: И, став позади у Его ног и плача, она начала орошать Его ноги слезами, вытирала их волосами своей головы, целовала Его ноги[a] и умащала их благовонным маслом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не переставала целовать Его ноги»; греческий глагол может выражать усиленное или многократное действие, а форма имперфекта указывает на его продолжительность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благовонной мазью»; греческое слово обозначает ароматическое масло или мазь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: став
  rationale: Аористное причастие передаёт предшествующее, вводящее сцену действие; «став» естественно и точно по-русски.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: позади у Его ног
  rationale: Сохраняет одновременно значение ὀπίσω («позади») и пространственную близость παρά; положение объясняется возлежанием Иисуса за столом, но это пояснение не добавляется в текст.
- source_word: κλαίουσα
  choice: плача
  rationale: Передаёт продолжающийся плач без ослабления эмоциональной силы.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: начала орошать ... слезами
  rationale: «Начала» явно передаёт ἤρξατο, а «орошать» естественно сочетается со слезами и не усиливает βρέχειν до «заливать».
- source_word: ἐξέμασσεν
  choice: вытирала
  rationale: Имперфект выражает продолжавшееся действие; «вытирала» сохраняет сам процесс, не сводя его исключительно к результату «осушила».
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: волосами своей головы
  rationale: Сохраняет полную и наглядную формулировку греческого текста, оставаясь понятной по-русски.
- source_word: κατεφίλει
  choice: целовала
  rationale: Имперфект передан глаголом несовершенного вида; возможная интенсивность или повторяемость сложного глагола отмечена в сноске, а не истолкована в основном тексте.
- source_word: ἤλειφεν
  choice: умащала
  rationale: Несовершенный вид передаёт продолжающееся действие; «умащала» сохраняет культурную конкретность действия и возвышенный, но понятный регистр.
- source_word: τῷ μύρῳ
  choice: благовонным маслом
  rationale: μύρον обозначает ароматическое масло или благовонную мазь; этот вариант ясен современному читателю и не вызывает ассоциации с современными спиртовыми духами.
theological_decisions:
- issue: Изображение действий женщины у ног Иисуса
  choice: Сохранены конкретные телесные действия, их длительность и эмоциональная напряжённость без добавленного объяснения их духовного смысла.
  alternative: Передать всё обобщённо как выражение почтения или преданности.
  rationale: Греческий текст описывает поступки непосредственно; перевод не должен ни смягчать их, ни превращать повествование в богословский комментарий.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Прописное «Его» соответствует принятому русскому почтительному оформлению местоимений, относящихся к Иисусу. Структура последовательных действий сохранена, но синтаксис сделан естественным для русского повествования.
