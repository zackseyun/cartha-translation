  source_fidelity: 'Текст точно передаёт ключевые элементы греческого оригинала: ингрессивное ἤρξαντο («стали говорить»), участников трапезы, возлежавших с Иисусом, и усилительное καί («даже»). Вопросительная форма и удивление гостей сохранены без добавления ответа или толкования. «Кто Он такой» является естественным русским соответствием Τίς οὗτός ἐστιν и не добавляет слова «человек».'
