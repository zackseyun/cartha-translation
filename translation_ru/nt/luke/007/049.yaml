  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: ru
  text: 'И те, кто возлежал с Ним за столом, стали говорить между собой[a]: «Кто Он такой, что даже грехи прощает?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорить про себя». Греческий оборот может означать как размышление про себя, так и разговор гостей между собой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: стали
  rationale: Конструкция с ἤρξαντο и инфинитивом обозначает начало действия; «стали говорить» естественно передаёт это в современном русском языке.
- source_word: οἱ συνανακείμενοι
  choice: те, кто возлежал с Ним за столом
  rationale: Причастие обозначает участников трапезы, возлежавших вместе; формулировка сохраняет древний обычай и совместность действия, выраженную приставкой συν-.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: говорить между собой
  rationale: Оборот допускает как взаимное обсуждение, так и речь про себя; в основном тексте выбран естественный вариант для группы гостей, а неоднозначность отмечена в сноске.
- source_word: Τίς οὗτός ἐστιν
  choice: Кто Он такой
  rationale: Передаёт резкий вопрос без добавления отсутствующего в греческом слова «человек»; местоимение с прописной буквы соответствует русской библейской издательской традиции.
- source_word: καὶ
  choice: даже
  rationale: Здесь καί имеет усилительное значение и выражает удивление тем, что Он прощает грехи.
- source_word: ἁμαρτίας ἀφίησιν
  choice: грехи прощает
  rationale: В данном контексте ἀφίημι обозначает прощение грехов; сохранён порядок слов, естественно подчёркивающий объект удивления.
theological_decisions:
- issue: Подразумеваемая власть Иисуса прощать грехи
  choice: 'Сохранить вопрос гостей без поясняющего богословского вывода: «Кто Он такой, что даже грехи прощает?»'
  alternative: «Кто этот человек, который даже прощает грехи?»
  rationale: Стих ставит христологический вопрос, но сам не формулирует ответа. Перевод сохраняет удивление и напряжение повествования, не добавляя конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Возлежал за столом» сохраняет историческую обстановку трапезы и остаётся понятным; вопрос сформулирован естественно и без смыслового расширения.
