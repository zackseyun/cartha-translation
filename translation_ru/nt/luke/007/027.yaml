  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: ru
  text: 'Это тот, о ком написано: «Вот, я посылаю моего вестника перед лицом твоим[a], и он приготовит твой путь перед тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более плавно: «перед тобой». Греческий текст буквально говорит: «перед лицом твоим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Он — тот
  rationale: Естественно и с должным акцентом указывает на Иоанна как на человека, о котором говорится далее.
- source_word: περὶ οὗ γέγραπται
  choice: о ком написано
  rationale: Сохраняет обычную формулу введения цитаты и значение перфекта без неестественной тяжеловесности.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современное, понятное и вместе с тем торжественное введение пророческого высказывания.
- source_word: ἀποστέλλω
  choice: Я посылаю
  rationale: Настоящее время передаёт непосредственность пророческого речения; в русском языке простая форма естественнее прогрессивной конструкции.
- source_word: ἄγγελόν
  choice: вестника
  rationale: В данном контексте слово обозначает посланника-человека, Иоанна, а не небесного ангела.
- source_word: πρὸ προσώπου σου
  choice: перед лицом Твоим
  rationale: Сохраняет конкретный образ греческого выражения и ветхозаветную окраску цитаты; более плавный вариант указан в сноске.
- source_word: κατασκευάσει
  choice: приготовит
  rationale: Точно передаёт будущее действие по подготовке пути.
- source_word: τὴν ὁδόν σου
  choice: Твой путь
  rationale: «Путь» естественно передаёт как буквальный образ, так и пророческий метафорический смысл.
- source_word: ἔμπροσθέν σου
  choice: перед Тобой
  rationale: Естественно передаёт пространственное выражение и сохраняет его отличие от более образного «перед лицом Твоим».
theological_decisions:
- issue: Применение к Иоанну цитаты с местоимениями второго лица
  choice: Сохранить местоимения второго лица без поясняющего добавления
  alternative: Прямо уточнить, что вестник готовит путь Господу или Мессии
  rationale: Греческий текст сам не добавляет такого пояснения. Сохранение местоимений удерживает богословскую силу применения цитаты Иисусом, не разрешая её посредством толкования.
- issue: Значение ἄγγελος применительно к Иоанну
  choice: вестник
  alternative: ангел
  rationale: Контекст прямо относится к Иоанну как к человеческому посланнику; «ангел» в современном русском создал бы ложное впечатление о небесном существе.
translation_notes:
  register: Современный литературный русский с dignified библейской интонацией. Прописные буквы в местоимениях внутри прямой речи поддерживают традиционный русский издательский регистр обращения к Богу/Мессии, не добавляя новых слов к тексту.
