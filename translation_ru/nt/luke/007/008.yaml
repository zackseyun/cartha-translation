  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ru
  text: 'Ведь и я человек, поставленный под власть, и у меня есть воины в подчинении. Я говорю одному: «Ступай», — и он идёт; другому: «Приди», — и он приходит; а моему рабу[a]: «Сделай это», — и он делает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуге». Греческое δοῦλος обозначает человека в зависимом, несвободном положении, хотя в некоторых контекстах слово может передаваться более общо как «слуга».'
    reason: Альтернативный перевод социально значимого термина δοῦλος.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь и
  rationale: Сочетание вводит объяснение слов сотника; «ведь» естественно передаёт обосновывающую силу γάρ, а «и» сохраняет καί и связь с сопоставлением самого сотника с Иисусом.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: я человек
  rationale: Передаёт прямое самоопределение говорящего без избыточного добавления; явное местоимение сохраняет акцент греческого текста.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: поставленный под власть
  rationale: Причастная конструкция сохраняет пассивный смысл τασσόμενος и представление о месте в иерархии власти, существенное для военного контекста.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: у меня есть воины в подчинении
  rationale: Естественная русская формулировка ясно передаёт, что сотник сам обладает делегированной властью над подчинёнными, не добавляя идеи абсолютной власти.
- source_word: λέγω τούτῳ
  choice: говорю одному
  rationale: В русском «этому» без явного указания звучало бы неестественно; «одному» в паре с «другому» сохраняет структуру примера и различение лиц.
- source_word: Πορεύθητι
  choice: Ступай
  rationale: Краткое повеление передаёт приказ отправиться; «ступай» в данном контексте естественно отличает его от следующего приказа прийти.
- source_word: Ἔρχου
  choice: Иди сюда
  rationale: Передаёт направленность движения к говорящему, подразумеваемую ἔρχου, и образует ясную русскую пару со «Ступай».
- source_word: τῷ δούλῳ μου
  choice: моему рабу
  rationale: δοῦλος обозначает человека в несвободном, зависимом статусе; в иллюстрации об иерархии и повиновении этот оттенок существенен. Более общее «слуга» отмечено в сноске.
theological_decisions:
- issue: Передача δοῦλος в сравнении сотника
  choice: раб
  alternative: слуга
  rationale: Смысл иллюстрации основан на подчинённом положении, поэтому «раб» точнее сохраняет социально-правовой оттенок греческого слова. В отдельных контекстах возможен более общий перевод «слуга», поэтому он не исключён, а указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Сохранены параллелизм приказов и ответных действий, а также образ военной и домашней иерархии; синтаксис слегка адаптирован для естественного русского звучания.
