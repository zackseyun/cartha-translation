  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: ru
  text: 'Когда посланники Иоанна ушли, Иисус начал говорить народу об Иоанне: «На что вы ходили смотреть в пустыню? На тростник, колеблемый ветром?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Когда ... ушли
  rationale: Аористное причастие в родительном самостоятельном обороте выражает предшествующее обстоятельство времени; по-русски естественно передаётся придаточным с «когда».
- source_word: ἀγγέλων
  choice: посланники
  rationale: В данном контексте речь о людях, посланных Иоанном, а не о небесных ангелах.
- source_word: Ἰωάννου
  choice: Иоанна / об Иоанне
  rationale: Родительный падеж сначала обозначает принадлежность посланников Иоанну, а после περί — тему речи.
- source_word: ἤρξατο λέγειν
  choice: начал говорить
  rationale: Сохраняет начинательное значение конструкции и естественно вводит обращение к слушателям.
- source_word: πρὸς τοὺς ὄχλους
  choice: народу
  rationale: Греческое множественное число обозначает собравшиеся массы людей; русское собирательное «народу» здесь звучит естественно и не создаёт неуместного образа нескольких раздельных толп.
- source_word: περὶ Ἰωάννου
  choice: об Иоанне
  rationale: Прямо передаёт тему последующей речи.
- source_word: Τί ἐξήλθατε
  choice: На что вы ходили
  rationale: τί относится к объекту созерцания, а не спрашивает прежде всего о причине; оборот «на что ... смотреть» естественно связывает вопрос с последующим образом.
- source_word: εἰς τὴν ἔρημον
  choice: в пустыню
  rationale: Передаёт безлюдную, малонаселённую местность, связанную со служением Иоанна; это привычное евангельское словоупотребление.
- source_word: θεάσασθαι
  choice: смотреть
  rationale: Передаёт целенаправленное зрительное наблюдение без архаического оттенка.
- source_word: κάλαμον
  choice: тростник
  rationale: Сохраняет буквальный растительный образ и заложенную в нём ассоциацию с неустойчивостью.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: колеблемый ветром
  rationale: Точно и образно передаёт тростник, который ветер приводит в движение, сохраняя риторическую силу вопроса.
theological_decisions:
- issue: Метафорический смысл риторического вопроса об Иоанне
  choice: 'Сохранить буквальный образ: «На тростник, колеблемый ветром?»'
  alternative: 'Передать истолкованием: «На слабого и непостоянного человека?»'
  rationale: Сам текст не раскрывает метафору прямо; буквальный образ сохраняет заложенную неоднозначность и позволяет читателю вывести подразумеваемое противопоставление.
- issue: Неявный субъект ἤρξατο
  choice: Иисус
  alternative: он
  rationale: В греческом субъект определяется из контекста. Явное имя устраняет возможную русскую двусмысленность после упоминания Иоанна и его посланников, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сделан естественным для устной риторической речи; метафора сохранена без поясняющей конфессиональной интерпретации.
