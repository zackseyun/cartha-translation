  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: ru
  text: 'Увидев её, Господь сжалился над ней и сказал ей: «Не плачь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не надо плакать»; возможно также: «Перестань плакать». Греческое выражение может быть понято и как общий запрет, и как призыв прекратить уже начавшийся плач.'
    reason: Лексико-аспектуальная альтернатива
lexical_decisions:
- source_word: ἰδὼν
  choice: увидев
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: Господь сначала увидел женщину, а затем сжалился над ней. Деепричастие «увидев» естественно и точно передаёт эту связь.'
- source_word: ὁ κύριος
  choice: Господь
  rationale: В повествовании Луки это титул Иисуса, а не просто обращение к хозяину или господину; традиционное и контекстуально уместное соответствие — «Господь».
- source_word: ἐσπλαγχνίσθη
  choice: сжалился
  rationale: Глагол выражает глубокое внутреннее сострадание. «Сжалился» передаёт как чувство, так и его направленность на страдающего человека, оставаясь естественным для современного русского языка.
- source_word: ἐπ’ αὐτῇ
  choice: над ней
  rationale: При глаголе «сжалился» управление «над ней» идиоматично выражает человека, на которого направлено сострадание.
- source_word: εἶπεν αὐτῇ
  choice: сказал ей
  rationale: Формально и естественно соответствует обычному значению λέγω, не добавляя оттенков более развёрнутого наставления.
- source_word: Μὴ κλαῖε
  choice: Не плачь
  rationale: Настоящее повелительное наклонение с μή допускает как общий запрет, так и побуждение прекратить уже происходящий плач. Русское «Не плачь» сохраняет эту смысловую открытость.
theological_decisions:
- issue: Передача κύριος как титула Иисуса
  choice: Господь
  alternative: господин
  rationale: «Господь» сохраняет возвышенное христологическое словоупотребление повествователя у Луки, не уточняя сверх того, что выражено самим титулом.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, естественная и достойная по тону. Сохранены повествовательная последовательность, титул «Господь» и неоднозначность повелительной формы.
