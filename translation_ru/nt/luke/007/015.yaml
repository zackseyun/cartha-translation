    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: сел
  rationale: Глагол описывает переход из лежачего положения в сидячее. В данном контексте естественное русское «сел» точно передаёт действие, не добавляя отсутствующего в греческом тексте уточнения.
- source_word: ὁ νεκρός
  choice: мёртвый
  rationale: Субстантивированное прилагательное буквально означает «мёртвый». Контекст ясно указывает на умершего юношу, поэтому такое обозначение остаётся понятным и сохраняет лаконичность оригинала.
- source_word: ἤρξατο λαλεῖν
  choice: начал говорить
  rationale: Обычная конструкция с ἄρχομαι и инфинитивом обозначает начало действия; «начал говорить» естественно и соответствует повествовательному регистру.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: Он отдал его матери
  rationale: «Отдал» естественно передаёт δίδωμι в ситуации передачи человека матери и не выражает явно возвратность, хотя она подразумевается контекстом. Заглавное «Он» помогает однозначно соотнести подлежащее с Иисусом после упоминания мёртвого.
theological_decisions:
- issue: Следует ли прямо выразить, что Иисус вернул сына матери
  choice: Сохранить простое «Он отдал его матери»
  alternative: «Он вернул его матери» / «Он отдал его обратно матери»
  rationale: Контекст подразумевает возвращение ожившего сына матери, однако греческое δίδωμι само по себе означает «дал/отдал» и не содержит отдельного показателя возвратности. Основной текст не усиливает этот смысл, а варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным и dignified повествовательным звучанием. Порядок событий и повтор союза «и» сохранены в соответствии с греческим текстом.
