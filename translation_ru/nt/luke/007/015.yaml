  source_fidelity: 'Требуется передать притяжательное αὐτοῦ («его матери»). В исходном варианте «Он отдал его матери» слово «его» является прямым дополнением, а не указанием на мать умершего; принадлежность матери сыну остаётся лишь контекстуально выводимой. Повтор «его» в русском несколько тяжеловесен, но здесь точно отражает два греческих местоименных значения: αὐτόν и αὐτοῦ.'
