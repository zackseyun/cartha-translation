  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: ru
  text: Но фарисеи и знатоки Закона отвергли Божий замысел относительно самих себя[a], не приняв от него[b] крещения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божий замысел для них самих»; возможно также: «Божье решение против них самих».'
    reason: alternative_reading
  - marker: b
    text: То есть от Иоанна Крестителя.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: знатоки Закона
  rationale: В данном контексте слово обозначает людей, сведущих в Моисеевом законе. «Знатоки Закона» ясно передаёт смысл и не смешивает их с книжниками или современными юристами.
- source_word: βουλὴν
  choice: замысел
  rationale: Слово может означать замысел, намерение, решение или совет. «Замысел» естественно выражает здесь Божье намерение, не сводя его к простому совету.
- source_word: ἠθέτησαν
  choice: отвергли
  rationale: Глагол означает отвергнуть, пренебречь или устранить. «Отвергли» прямо и естественно передаёт сознательный отказ.
- source_word: εἰς ἑαυτούς
  choice: о них самих
  rationale: Оборот указывает на личную соотнесённость Божьего замысла с этими людьми. Такая передача сохраняет неоднозначность лучше, чем более истолковывающее «для себя» или «против себя».
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: не приняв крещения от него
  rationale: Передаёт отрицательное аористное страдательное причастие естественным русским оборотом, не делая причинное значение явным там, где греческий текст его прямо не выражает.
- source_word: αὐτοῦ
  choice: него
  rationale: Местоимение сохранено по греческому тексту; его отнесённость к Иоанну Крестителю поясняется в сноске.
- source_word: δὲ
  choice: Но
  rationale: Союз отмечает контраст с предшествующим утверждением о тех, кто принял Иоанново крещение.
theological_decisions:
- issue: Смысл Божьей βουλή по отношению к фарисеям и знатокам Закона
  choice: Божий замысел о них самих
  alternative: Божий замысел для них самих; Божье решение против них самих
  rationale: Формулировка показывает, что Божий замысел относился к ним лично, но не разрешает богословское напряжение утверждением о том, будто абсолютная Божья воля была сорвана, и не навязывает смысл «против себя».
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Закон» написан с прописной буквы как обозначение Моисеева закона. Причастная конструкция передана естественным деепричастным оборотом без излишнего уточнения логической связи.
