  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: ru
  text: 'Увидев это, пригласивший Его фарисей сказал про себя: «Если бы Он был пророком, то знал бы, кто она и что она за женщина[a], которая прикасается к Нему: ведь[b] она грешница».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто и какого рода эта женщина». В греческом тексте подчёркнуты и её личность, и её характер или репутация.'
    reason: lexical_alternative
  - marker: b
    text: 'Или ὅτι можно понимать как вводящее содержание того, что Он должен был знать: что она грешница, а не как объяснение оценки женщины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Увидев это
  rationale: Аористное причастие передаёт обстоятельство, предшествующее внутренней речи; «это» естественно отсылает к только что описанному действию. δέ не требует отдельного русского союза.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: пригласивший Его фарисей
  rationale: В контексте трапезы καλέω означает «пригласить»; причастная конструкция сохраняет определение лица без тяжеловесного придаточного.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: сказал про себя
  rationale: Естественная современная русская передача внутренней речи без буквального дублирования εἶπεν и λέγων.
- source_word: Οὗτος
  choice: Он
  rationale: В прямой речи русское «Он» звучит естественно; возможный оттенок дистанцирования в Οὗτος не усиливается искусственно выражением «этот человек».
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: Если бы Он был пророком, то знал бы
  rationale: Конструкция с εἰ, имперфектами и ἄν выражает условие, которое говорящий считает не соответствующим действительности.
- source_word: τίς καὶ ποταπὴ
  choice: кто и что за
  rationale: 'Сохраняются оба вопросительных элемента: личность женщины и её характер либо репутация; «что за» естественно и передаёт оценочный оттенок.'
- source_word: ἥτις ἅπτεται αὐτοῦ
  choice: женщина прикасается к Нему
  rationale: Настоящее время передаёт продолжающееся в сцене действие; «прикасается» соответствует достоинству регистра.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: ведь она грешница
  rationale: «Ведь» естественно передаёт причинное обоснование мысли фарисея, при этом сноска сохраняет возможное понимание ὅτι как союза изъяснения.
theological_decisions:
- issue: Смысл условного высказывания о пророческом статусе Иисуса
  choice: 'Условие, которое фарисей считает не соответствующим действительности: «Если бы Он был пророком, то знал бы…»'
  alternative: 'Более нейтральное условие: «Если Он пророк, то должен знать…»'
  rationale: εἰ ἦν ... ἐγίνωσκεν ἂν естественно выражает скептическое нереальное условие. Перевод передаёт мнение фарисея, не подтверждая его оценку.
- issue: Связь ὅτι ἁμαρτωλός ἐστιν с предыдущей фразой
  choice: 'Причина оценки женщины: «ведь она грешница»'
  alternative: 'Содержание знания: «что она грешница»'
  rationale: Обе синтаксические связи возможны; основной текст выбирает естественное причинное прочтение, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю; внутренняя речь передана естественно, но с сохранением скептического тона фарисея и синтаксической неоднозначности заключительной части.
