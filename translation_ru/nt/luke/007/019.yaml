  source_fidelity: Перевод точно передаёт синтаксис и смысл греческого текста. «Он послал их» восполняет подразумеваемое дополнение из непосредственного контекста (учеников Иоанна) и не меняет смысла. «К Господу», «Ты ли», «Грядущий» и «нам ожидать другого» соответствуют πρὸς τὸν κύριον, Σὺ εἶ, ὁ ἐρχόμενος и ἄλλον προσδοκῶμεν. Оборот «с вопросом» естественно передаёт функцию λέγων перед прямым вопросом.
