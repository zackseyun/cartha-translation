base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: ru
  text: 'Он послал их к Господу с вопросом: «Ты ли Грядущий[a], или нам ожидать другого?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто приходит». Греческое выражение можно понять описательно, но здесь оно, вероятно, употреблено как мессианский титул.'
    reason: Лексическая альтернатива и сохранение смысловой неоднозначности ὁ ἐρχόμενος.
lexical_decisions:
- source_word: ἔπεμψεν
  choice: Он послал их
  rationale: Аорист передаёт завершённое повествовательное действие. Местоимение «их» естественно восполняет подразумеваемое дополнение из ближайшего контекста и необходимо для ясности по-русски.
- source_word: πρὸς τὸν κύριον
  choice: к Господу
  rationale: Предлог πρός с винительным указывает направление к лицу; κύριος передано как «Господь», сохраняя обычный у Луки титул Иисуса и его христологическую весомость.
- source_word: λέγων
  choice: с вопросом
  rationale: Причастие вводит содержание послания. В русском контексте оборот «с вопросом» естественнее буквального «говоря» и точно отражает вопросительную форму прямой речи.
- source_word: Σὺ εἶ
  choice: Ты ли
  rationale: Частица «ли» естественно передаёт по-русски альтернативный вопрос и сохраняет эмфатическое местоимение Σὺ.
- source_word: ὁ ἐρχόμενος
  choice: Грядущий
  rationale: Субстантивированное причастие с артиклем здесь может функционировать как известное эсхатологическое или мессианское обозначение. «Грядущий» кратко сохраняет и образ прихода, и титульную силу выражения.
- source_word: ἄλλον προσδοκῶμεν
  choice: нам ожидать другого
  rationale: Настоящее время προσδοκῶμεν обозначает продолжающееся ожидание; безлично-модальная русская конструкция естественно передаёт совещательный оттенок вопроса, не добавляя определённости относительно личности «другого».
theological_decisions:
- issue: Передача κύριος как титула Иисуса
  choice: Господь
  alternative: господин / наставник
  rationale: «Господь» соответствует устойчивому употреблению κύριος применительно к Иисусу у Луки и не ослабляет возможную христологическую значимость титула.
- issue: Титульное или описательное значение ὁ ἐρχόμενος
  choice: Грядущий
  alternative: тот, кто приходит / тот, кто должен прийти
  rationale: Контекст допускает понимание выражения как признанного мессианского обозначения, однако греческая форма остаётся причастным описанием. Основной текст передаёт вероятную титульность, а сноска сохраняет описательную возможность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Грядущий» намеренно сохраняет достоинство и титульную силу выражения; менее привычное для повседневной речи значение пояснено в сноске.
