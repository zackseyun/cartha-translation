  terminology: «Господь» последовательно передаёт κύριος. «Грядущий» сохраняет вероятную титульную, мессианскую функцию ὁ ἐρχόμενος, не превращая её в догматическое утверждение. Сноска корректно сообщает описательную альтернативу и отмечает вероятностный характер титульного прочтения.
