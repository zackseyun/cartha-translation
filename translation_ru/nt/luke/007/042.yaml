  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: ru
  text: А так как им нечем было расплатиться, он простил им долги.[a] Итак, кто из них будет любить его больше?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он списал долги обоим». Греческий глагол может означать даровать безвозмездно, простить или списать то, что причитается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: так как им нечем было расплатиться
  rationale: Генитив абсолютный передаёт обстоятельство и причину; «нечем было расплатиться» естественно выражает отсутствие средств вернуть долг.
- source_word: ἀμφοτέροις
  choice: обоим
  rationale: Форма прямо указывает на двух должников, упомянутых в притче.
- source_word: ἐχαρίσατο
  choice: простил долг
  rationale: В контексте задолженности глагол означает безвозмездно освободить от выплаты. «Простил долг» сохраняет как финансовый образ, так и связь с темой прощения.
- source_word: τίς οὖν αὐτῶν
  choice: Итак, кто из них
  rationale: «Итак» передаёт вывод, вводимый οὖν, в достойном и современном русском регистре.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: будет любить его больше
  rationale: Прямо передаёт будущее время ἀγαπήσει и сравнительное значение πλεῖον, не уточняя природу любви сверх исходного текста.
theological_decisions:
- issue: Передача χαρίζομαι в притче о долгах
  choice: простил долг обоим
  alternative: аннулировал долги обоих; милостиво простил обоим
  rationale: Выбранный вариант удерживает финансовое значение ремиссии долга и одновременно естественную для более широкого контекста тему прощения. Добавление наречия «милостиво» сделало бы оттенок благодеяния явным, но утяжелило бы русскую фразу.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и сохраняет достоинство притчевой речи. «Расплатиться» ясно обозначает долговой контекст, а «простил долг» сохраняет богословски значимую связь между списанием долга и прощением.
