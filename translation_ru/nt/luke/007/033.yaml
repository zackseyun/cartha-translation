base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: ru
  text: 'Ведь пришёл Иоанн Креститель — он не ест хлеба и не пьёт вина, — а вы говорите: «В нём бес»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Он одержим бесом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: пришёл
  rationale: Русское прошедшее совершенного вида естественно передаёт совершившееся явление Иоанна и сохраняющуюся значимость его прихода в данном рассуждении.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит пояснение к предшествующему высказыванию; «ведь» естественно выражает эту связь в современном русском языке.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Иоанн Креститель
  rationale: Устоявшееся русское наименование исторической личности; оно понятно читателю и соответствует функции греческого титула.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: не ест хлеба и не пьёт вина
  rationale: Настоящее время по-русски естественно описывает образ жизни Иоанна после его прихода. Конкретные слова «хлеб» и «вино» сохранены без обобщения до «пищи» и «спиртного».
- source_word: λέγετε
  choice: вы говорите
  rationale: Сохраняет настоящее время и передаёт характерную реакцию адресатов.
- source_word: Δαιμόνιον ἔχει
  choice: В нём бес
  rationale: Передаёт обвинение в наличии демона без замены на отличное исходное выражение «нечистый дух»; по-русски звучит естественнее буквального «имеет беса», сохраняя при этом образ исходной конструкции.
theological_decisions:
- issue: Передача δαιμόνιον в обвинении против Иоанна
  choice: бес
  alternative: нечистый дух
  rationale: В греческом тексте стоит δαιμόνιον, а не выражение πνεῦμα ἀκάθαρτον; поэтому терминология не гармонизируется. «Бес» — традиционное и понятное русское соответствие в данном контексте.
- issue: Характер обвинения Δαιμόνιον ἔχει
  choice: В нём бес
  alternative: Он одержим бесом
  rationale: Выбранная формулировка ближе к прямой конструкции «имеет демона» и не усиливает её до более истолковывающего обозначения одержимости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Ведь» и «а вы говорите» обеспечивают естественную связь и риторический контраст; конкретность слов «хлеб» и «вино» сохранена.
