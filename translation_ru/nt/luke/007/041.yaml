id: LUK.7.41
reference: Luke 7:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: ru
  text: 'У одного заимодавца было два должника: один был должен ему пятьсот динариев[a], а другой — пятьдесят.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарий — распространённая римская серебряная монета; обычно его связывают примерно с дневной платой наёмного работника.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: должника
  rationale: Существительное обозначает людей, имеющих денежный долг; «должники» — прямой и естественный русский эквивалент.
- source_word: δανιστῇ τινι
  choice: у одного заимодавца
  rationale: δανιστής обозначает того, кто даёт деньги взаймы; «заимодавец» точно передаёт смысл и уместен в современном литературном повествовании. Местоимение τινι естественно передано оборотом «у одного».
- source_word: ὤφειλεν
  choice: был должен
  rationale: Имперфект описывает существовавшее долговое обязательство; русский оборот «был должен» естественно выражает это состояние.
- source_word: δηνάρια
  choice: динариев
  rationale: Сохранено историческое название конкретной римской монеты и расчётной единицы; пояснение дано в сноске.
- source_word: πεντακόσια
  choice: пятьсот
  rationale: Прямая передача количественного числительного.
- source_word: ἕτερος
  choice: другой
  rationale: В паре с «один» это наиболее естественная русская передача противопоставления.
- source_word: πεντήκοντα
  choice: пятьдесят
  rationale: Прямая передача числительного; слово «динариев» во второй части понятно из контекста и не повторяется.
theological_decisions: []
