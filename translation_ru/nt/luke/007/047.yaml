  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: ru
  text: 'Поэтому говорю тебе: прощены её многочисленные грехи, потому что она много любила.[a] А кому мало прощается, тот мало любит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поэтому она много любила». Греческую связь можно понимать так, что её любовь свидетельствует о полученном прощении, а не является его причиной.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Поэтому
  rationale: Естественно передаёт причинно-выводное значение оборота и связывает изречение с предшествующей притчей.
- source_word: ἀφέωνται
  choice: прощены
  rationale: Краткая русская форма страдательного причастия передаёт совершившееся прощение и сохраняющийся результат греческого перфекта.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: её многочисленные грехи
  rationale: Естественный современный порядок слов, точно передающий усиленное определение αἱ πολλαί.
- source_word: ὅτι
  choice: потому что
  rationale: Сохраняет явную причинную форму греческого текста и присущую контексту смысловую напряжённость, не заменяя её толкующим следствием.
- source_word: ἠγάπησεν πολύ
  choice: она проявила большую любовь
  rationale: По-русски это яснее и естественнее, чем буквальное «она много любила», и соответствует проявленной в поступках любви в данном эпизоде.
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: А кому мало прощается
  rationale: Сохраняет обобщённую конструкцию без ненужного указания пола и передаёт настоящее время страдательного глагола.
- source_word: ὀλίγον ἀγαπᾷ
  choice: тот мало любит
  rationale: Сохраняет лаконичный параллелизм и афористическую силу заключения.
theological_decisions:
- issue: Представляет ли ὅτι любовь женщины причиной прощения или свидетельством уже полученного прощения
  choice: В основном тексте сохранено «потому что», а в сноске отмечено возможное понимание любви как свидетельства прощённого состояния.
  alternative: 'Передать выводом: «поэтому она проявила большую любовь».'
  rationale: Так перевод следует явной форме ὅτι и не устраняет богословскую напряжённость; притча и ст. 50 позволяют понимать любовь как следствие и подтверждение прощения, а не как заслуживающую его заслугу.
translation_notes:
  register: Современный литературный русский язык; достоинство и афористический параллелизм сохранены. Формулировка «проявила большую любовь» делает связь с поступками женщины естественной для русского читателя, не вводя дополнительного богословского толкования.
