base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: ru
  text: 'Подойдя, Иисус прикоснулся к погребальным носилкам[a]. Несшие их остановились, и Он сказал: «Юноша, тебе говорю: встань!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «к погребальному ложу». Греческое слово означает носилки или открытое ложе, на котором умершего несли в погребальной процессии.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Подойдя
  rationale: Аористное причастие передаёт предшествующее действие Иисуса и естественно звучит в современном русском повествовании.
- source_word: ἥψατο
  choice: прикоснулся
  rationale: В данном контексте форма ἅπτω означает прикосновение; перевод не усиливает действие до значения «схватился».
- source_word: σοροῦ
  choice: погребальным носилкам
  rationale: σορός обозначает погребальные носилки или открытое ложе, на котором несли умершего; современное слово «гроб» могло бы ошибочно подразумевать закрытый ящик.
- source_word: οἱ δὲ βαστάζοντες
  choice: Несшие их
  rationale: Причастная конструкция кратко и ясно обозначает людей, нёсших погребальные носилки; местоимение согласовано с русским множественным числом.
- source_word: ἔστησαν
  choice: остановились
  rationale: В контексте похоронной процессии глагол означает прекращение движения; «остановились» естественнее русского буквального «стали».
- source_word: Νεανίσκε
  choice: Юноша
  rationale: Точная и достойная передача обращения к молодому мужчине, уместная в современном литературном русском.
- source_word: σοὶ λέγω
  choice: тебе говорю
  rationale: Сохраняет подчёркнутое местоимение σοὶ, прямоту и торжественную силу обращения.
- source_word: ἐγέρθητι
  choice: встань
  rationale: Естественный русский императив, который в контексте ясно выражает повеление умершему подняться, не навязывая спорного грамматического оттенка «будь воскрешён».
theological_decisions:
- issue: Тон и залог повеления ἐγέρθητι
  choice: «встань»
  alternative: «поднимись»; «будь воскрешён»
  rationale: Форма допускает морфологическое описание как пассивная, однако в употреблении повеление естественно означает «встань/поднимись». «Встань» сохраняет властность и торжественность слов Иисуса, не добавляя догматического пояснения о механизме чуда.
- issue: Явное называние Иисуса в русском предложении
  choice: «Иисус прикоснулся»
  alternative: «Он прикоснулся»
  rationale: Русский отрывок, публикуемый как отдельный стих, требует ясного субъекта; имя восстанавливается из непосредственного контекста и не меняет смысла греческого текста.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Термин «погребальные носилки» выбран ради исторической ясности; менее привычное значение пояснено сноской. Прямая речь лаконична и торжественна.
