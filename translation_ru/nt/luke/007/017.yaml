  terminology: Иудея передана традиционно и точно. «Округа» корректно обозначает прилегающую местность и не навязывает современного административного смысла. Написание «Нём» соответствует принятому в данном переводческом оформлении уважительному написанию местоимения, относящегося к Иисусу.
