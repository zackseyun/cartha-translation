  source_fidelity: «И весть о Нём разошлась по всей Иудее и по всей округе» точно передаёт смысл греческого καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ καὶ πάσῃ τῇ περιχώρῳ. «Весть» уместно передаёт λόγος в значении сообщения/известия; «разошлась» естественно выражает распространение ἐξῆλθεν. Оба географических охвата и повтор καί сохранены.
