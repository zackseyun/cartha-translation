id: LUK.7.17
reference: Luke 7:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: ru
  text: И весть о Нём разошлась по всей Иудее и по всей округе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слух о Нём»; или: «это слово о Нём».'
    reason: Слово λόγος допускает здесь значения распространяющегося сообщения, слуха или слова.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: разошлась
  rationale: В контексте распространяющейся вести русский глагол «разошлась» естественно передаёт движение и распространение, выраженные ἐξῆλθεν.
- source_word: ὁ λόγος οὗτος
  choice: весть
  rationale: Здесь λόγος означает распространяющееся сообщение о совершённом Иисусом, а не отдельное слово; «весть» звучит естественно и сохраняет смысловую широту.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: по всей Иудее
  rationale: Сочетание «разошлась по всей Иудее» идиоматично передаёт распространение по всей названной области.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Прямой и естественный эквивалент περί с родительным падежом; заглавная буква соответствует принятому русскому библейскому оформлению местоимений, относящихся к Иисусу.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: по всей округе
  rationale: «Округа» кратко и естественно обозначает всю прилегающую местность, не придавая ей излишне административного оттенка.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Повтор союза сохраняет кумулятивное соединение двух географических областей в греческом тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и понятная широкому кругу читателей. Сохранён начальный союз «И» и повторное соединение географических областей.
