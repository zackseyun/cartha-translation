id: LUK.7.25
reference: Luke 7:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: ru
  text: Но на что вы вышли посмотреть? На человека, одетого в мягкие одежды?[a] Вот, те, кто носит роскошные одежды и живёт в неге, находятся в царских дворцах.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тонкие одежды». Речь идёт о мягкой, дорогой одежде, связанной с роскошью, а не о слабости характера.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «при царских дворах». Греческое слово может обозначать царские резиденции или придворную среду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление и продолжает ряд риторических вопросов.
- source_word: ἐξήλθατε ἰδεῖν
  choice: вы вышли посмотреть
  rationale: Сохраняет аористное действие в прошлом контексте и инфинитив цели; по-русски вопрос естественно выражается без вспомогательного глагола.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Передаёт конкретного человека мужского пола, подразумеваемого в риторическом вопросе.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: одетого в мягкие одежды
  rationale: Сохраняет конкретный образ мягкой, тонкой одежды и состояние человека, выраженное перфектным причастием.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественная современная русская частица, привлекающая внимание к пояснению.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: носит роскошные одежды
  rationale: ἔνδοξος здесь указывает на великолепие и высокий социальный статус одежды; «роскошные» ясно передаёт смысл в данном контексте.
- source_word: τρυφῇ ὑπάρχοντες
  choice: живёт в неге
  rationale: Передаёт не просто обладание роскошью, а образ изнеженной, обеспеченной жизни; единственное число согласуется с русским «те, кто».
- source_word: ἐν τοῖς βασιλείοις
  choice: в царских дворцах
  rationale: Передаёт множественное число и значение царских резиденций.
theological_decisions:
- issue: Значение μαλακοῖς в контексте
  choice: Буквальная мягкая, тонкая одежда, связанная с роскошью
  alternative: Изнеженная или женоподобная одежда
  rationale: Контекст противопоставляет пустынную строгость придворной роскоши; нравственная характеристика человека здесь не выражена.
- issue: Социальная обстановка βασιλείοις
  choice: царские дворцы
  alternative: царские дворы
  rationale: Слово допускает представление о царских резиденциях или придворной среде; «царские дворцы» естественно передаёт основное пространственное значение, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с сохранением риторической структуры и конкретных образов оригинала. «Вот» передаёт ἰδοὺ без архаического «се»; «живёт в неге» звучит dignified и передаёт τρυφή как роскошный, изнеженный образ жизни.
