  source_fidelity: 'Оборот «Мне нужно кое-что тебе сказать» вносит значение необходимости, которого в греческом ἔχω σοί τι εἰπεῖν нет. Греческий оборот означает «у Меня есть что сказать тебе / Я хочу (намерен) сказать тебе кое-что». Остальные элементы точно переданы: обращение «Симон», Διδάσκαλε как «Учитель», императив εἰπέ и повествовательное φησίν.'
