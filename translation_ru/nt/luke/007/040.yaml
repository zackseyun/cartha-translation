  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: ru
  text: 'Иисус сказал ему в ответ: «Симон, Я хочу тебе кое-что сказать». — «Учитель, говори», — ответил тот.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν πρὸς αὐτόν
  choice: сказал ему в ответ
  rationale: Передаёт обычное греческое повествовательное сочетание причастия ἀποκριθείς с глаголом речи, сохраняя значение ответа и избегая тяжеловесного буквального оборота «отвечая, сказал».
- source_word: Σίμων
  choice: Симон
  rationale: Традиционная русская передача личного имени.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: Мне нужно кое-что тебе сказать
  rationale: Естественно по-русски выражает намерение говорящего и явно передаёт σοί «тебе». Оборот «у Меня есть что-то сказать тебе» был бы формальнее, но менее естественен.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и общеупотребительное соответствие διδάσκαλος; не вносит более сильного оттенка власти, возможного у слова «Господин».
- source_word: εἰπέ
  choice: говори
  rationale: Краткий естественный русский императив, приглашающий Иисуса продолжить речь; сохраняет открытость между значениями «скажи» и «говори».
- source_word: φησίν
  choice: ответил тот
  rationale: Историческое настоящее передано прошедшим временем согласно нормам русского повествования; местоимение «тот» ясно указывает на Симона и позволяет избежать повтора.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь краткая, достоинственная и естественная. Диалог оформлен так, чтобы сохранить повествовательную динамику и не перегружать стих буквальным воспроизведением греческих речевых формул.
