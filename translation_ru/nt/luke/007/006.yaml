  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: ru
  text: 'Иисус пошёл с ними. Когда же Он был уже недалеко от дома, сотник послал друзей сказать Ему: «Господи[a], не утруждай Себя, ведь я недостоин[b], чтобы Ты вошёл под мою крышу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин». Греческое κύριε может быть почтительным обращением и в то же время допускать признание власти Иисуса.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «я не гожусь», «я недостаточно достоин». Греческое выражение может обозначать достаточность, пригодность или достоинство; здесь оно передаёт смирение сотника перед Иисусом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: пошёл
  rationale: Естественно передаёт продолжавшееся движение Иисуса в повествовании; русский совершенный вид здесь не отрицает процессуального оттенка греческого имперфекта.
- source_word: σὺν αὐτοῖς
  choice: с ними
  rationale: Прямая и естественная передача значения сопровождения.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: когда же Он был уже недалеко от дома
  rationale: Передаёт временное значение генитивной абсолютной конструкции и сохраняет отрицательную формулировку οὐ μακράν.
- source_word: ἔπεμψεν φίλους ὁ ἑκατοντάρχης
  choice: сотник послал к Нему друзей
  rationale: «Сотник» — укоренившееся и понятное обозначение ἑκατοντάρχης; «друзей» непосредственно передаёт φίλους без добавления неопределённого местоимения.
- source_word: λέγων αὐτῷ
  choice: сказать
  rationale: Инфинитив после «послал» естественно передаёт порученную друзьям речь, формально приписанную сотнику как отправителю.
- source_word: Κύριε
  choice: Господи
  rationale: Сохраняет обычное титульное обращение к Иисусу и возможную глубину признания Его власти, не исключая значения почтительного обращения.
- source_word: μὴ σκύλλου
  choice: не утруждай Себя
  rationale: Современная уважительная русская формулировка, передающая просьбу не причинять себе дальнейших хлопот.
- source_word: οὐ γὰρ ἱκανός εἰμι
  choice: ведь я недостоин
  rationale: В контексте смирения сотника ἱκανός обозначает достаточность, пригодность или достоинство; «недостоин» естественно выражает этот смысл по-русски.
- source_word: ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς
  choice: чтобы Ты вошёл под мой кров
  rationale: Сохраняет образ вхождения под крышу дома; «кров» остаётся понятным литературным словом и естественнее буквального «под мою крышу» в данном обращении.
theological_decisions:
- issue: Передача κύριος в обращении к Иисусу
  choice: Господи
  alternative: господин
  rationale: «Господи» сохраняет титул и возможное признание власти Иисуса, но само по себе не навязывает сотнику полностью сформулированного христологического исповедания.
- issue: Смысл ἱκανός в словах сотника
  choice: недостоин
  alternative: не гожусь / недостаточно пригоден
  rationale: Выбрано естественное для контекста выражение смирения; сноска сохраняет более широкий диапазон греческого слова и не сводит его исключительно к нравственному достоинству.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формы местоимений, относящихся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции. Образ «под мой кров» сохранён как естественный литературный эквивалент греческой идиомы.
