  naturalness: «И всё же мудрость оправдана всеми её детьми» — грамматически правильная, ясная и афористичная фраза современного литературного русского языка. Формулировка «оправдана» несколько отмечена библейско-книжным употреблением, но здесь это уместно и пояснено сноской.
