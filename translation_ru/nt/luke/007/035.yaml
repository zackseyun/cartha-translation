  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: ru
  text: И всё же мудрость оправдана всеми её детьми[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признана правой»; «её правота подтверждена».'
    reason: lexical_alternative
  - marker: b
    text: «Дети» — образ тех, чья реакция или жизнь свидетельствует о правоте мудрости.
    reason: lexical_alternative
  - marker: c
    text: 'В Мф. 11:19 сказано: «мудрость оправдана своими делами».'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: И всё же
  rationale: В данном контексте καί связывает изречение с предшествующей критикой поколения и допускает лёгкий противительный оттенок; «И всё же» естественно передаёт связь и контраст.
- source_word: ἐδικαιώθη
  choice: оправдана
  rationale: Аорист пассива от δικαιόω здесь означает, что правота мудрости признана или подтверждена. «Оправдана» сохраняет пассивную форму и допускает пояснение в сноске, не привнося специально павловский судебный смысл.
- source_word: ἡ σοφία
  choice: мудрость
  rationale: Прямое соответствие σοφία; женский род русского существительного естественно сохраняет олицетворение.
- source_word: ἀπὸ πάντων
  choice: всеми
  rationale: При пассивном глаголе ἀπό может обозначать источник или действующих лиц. Творительный падеж естественно передаёт, кем подтверждается правота мудрости.
- source_word: τῶν τέκνων αὐτῆς
  choice: её детьми
  rationale: Сохраняется буквальный образ «детей» мудрости и относящееся к ней местоимение женского рода, без истолкования метафоры непосредственно в тексте.
theological_decisions:
- issue: Смысл выражения «дети мудрости»
  choice: 'Сохранить метафору буквально: «её детьми».'
  alternative: Передать как «последователями», «плодами» или гармонизировать с «делами» в Мф. 11:19.
  rationale: 'В тексте Луки стоит τέκνων («детей»). Буквальная передача сохраняет олицетворение и богословскую многозначность: это могут быть люди, принимающие Божью мудрость, либо проявляющиеся в них результаты мудрости.'
- issue: Смысл ἐδικαιώθη
  choice: «оправдана» в значении «её правота подтверждена».
  alternative: «признана правой» или «доказала свою правоту».
  rationale: Выбранный вариант сохраняет пассив греческого текста и краткую афористичность, а сноска предотвращает ошибочное сужение до учения о судебном оправдании.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и афористичной формой. «И всё же» передаёт контекстуальный контраст; «оправдана» сохраняет форму и напряжение оригинала, а значение уточняется в сноске.
