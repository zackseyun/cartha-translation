  source_fidelity: Сравнение, место действия, взаимное обращение и обе пары действий в целом переданы верно. Однако «кричат» неоправданно усиливает προσφωνοῦσιν («обращаются, окликают»), а «пели плачевную песню» тяжеловесно и менее точно передаёт θρηνέω, означающее «причитали, оплакивали, исполняли плач».
  naturalness: «Перекликаются» естественно передаёт сцену взаимных окликов без обязательного оттенка крика. «Причитали» — современно понятное литературное слово в данном контексте; оно хорошо контрастирует с «не плакали». «На площади» допустимо для ἀγορά и не требует изменения.
  terminology: «Свирель» является литературным, традиционно понятным обозначением духового инструмента и не выдаёт αὐλός за точно установленный современный инструмент; сноска корректно сообщает вариант «флейта». «Плясали» уместно в образе детской игры. Погребальный оттенок θρηνέω сохранён в сноске как возможный, а не обязательный.
