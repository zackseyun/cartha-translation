source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: ru
  text: 'Они подобны детям, которые сидят на площади и перекликаются друг с другом: «Мы играли вам на свирели[a], а вы не плясали; мы причитали[b], а вы не плакали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на флейте». Греческий глагол обозначает игру на духовом инструменте типа флейты или свирели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы исполняли плач» или «мы оплакивали». Возможен смысл погребального плача.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Они подобны
  rationale: Естественно и точно вводит сравнение, сохраняя несколько более торжественный библейский регистр.
- source_word: παιδίοις
  choice: детям
  rationale: Передаёт широкое обозначение детей без неоправданного уточнения возраста или пола.
- source_word: ἐν ἀγορᾷ
  choice: на площади
  rationale: ἀγορά здесь обозначает общественное открытое место, служившее также рынком; «на площади» естественно для сцены детской игры и не сужает смысл до торговых рядов.
- source_word: καθημένοις
  choice: которые сидят
  rationale: Прямо передаёт причастие и звучит естественно по-русски.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: кричат друг другу
  rationale: Передаёт обращение голосом на расстоянии и взаимность ἀλλήλοις; в сцене на площади естественнее формального «обращаются».
- source_word: ἃ λέγει
  choice: '[передано двоеточием перед прямой речью]'
  rationale: 'Греческая конструкция текстуально и грамматически необычна: нейтральное множественное ἃ и единственное λέγει. Русское двоеточие естественно вводит содержание возгласа, не создавая искусственного согласования.'
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Мы играли вам на свирели
  rationale: αὐλέω конкретно означает игру на духовом инструменте типа флейты или свирели; «свирель» сохраняет древний образ и ясно обозначает инструмент.
- source_word: ὠρχήσασθε
  choice: вы не плясали
  rationale: Прямо передаёт танец; «плясали» естественно сочетается с народной игрой на свирели.
- source_word: ἐθρηνήσαμεν
  choice: мы пели плачевную песню
  rationale: Сохраняет исполнительский характер θρηνέω и контраст с игрой на свирели, не сводя действие к внутренней скорби.
- source_word: ἐκλαύσατε
  choice: вы не плакали
  rationale: Простое современное соответствие κλαίω, сохраняющее конкретную реакцию в образе.
theological_decisions:
- issue: Сохранение образного противопоставления без истолкования его применения
  choice: 'Конкретные действия: игра на свирели, пляска, плачевная песня и плач'
  alternative: Передать смысл отвлечённо как «мы веселились — вы не радовались; мы скорбели — вы не печалились»
  rationale: Стих формулирует сравнение, а не разъясняет его. Конкретная образность сохраняет богословскую напряжённость и не навязывает толкование.
translation_notes:
  register: Современный литературный русский язык с dignified, но понятным синтаксисом. «Площадь» передаёт общественное пространство ἀγορά; «свирель» и «плачевная песня» сохраняют конкретную игровую сцену и её контраст. Все маркеры сносок присутствуют в основном тексте.
