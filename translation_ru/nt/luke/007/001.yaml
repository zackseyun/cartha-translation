id: LUK.7.1
reference: Luke 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: ru
  text: Когда Он закончил говорить всё это народу, Он вошёл в Капернаум.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Когда
  rationale: В данном повествовательном контексте союз вводит временное придаточное и обозначает действие, предшествующее входу в Капернаум.
- source_word: ἐπλήρωσεν
  choice: закончил говорить
  rationale: В сочетании с ῥήματα глагол означает завершение речи; такое выражение естественно передаёт смысл по-русски, не привнося значения «исполнил».
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: всё это
  rationale: Оборот буквально означает «все Свои слова» и указывает на только что завершённую речь; «всё это» естественно выражает данную отсылку в современном русском языке.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: народу
  rationale: Буквально «в слух народа», то есть так, чтобы народ слышал. Дательный адресата кратко и естественно передаёт коммуникативный смысл, хотя делает менее явным образ слуха.
- source_word: λαοῦ
  choice: народу
  rationale: λαός здесь обозначает собравшийся народ как коллектив; перевод не сужает значение до «толпы».
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Прямое и естественное соответствие глаголу движения внутрь названного места.
- source_word: Καφαρναούμ
  choice: Капернаум
  rationale: Устоявшаяся русская форма географического названия.
theological_decisions: []
