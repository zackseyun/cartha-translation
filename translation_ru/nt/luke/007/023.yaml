id: LUK.7.23
reference: Luke 7:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: ru
  text: И блажен тот, кто не преткнётся из-за Меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не соблазнится из-за Меня»; или: «не отпадёт из-за Меня».'
    reason: 'Лексические варианты глагола σκανδαλίζω: он может обозначать преткновение, соблазн или отпадение.'
lexical_decisions:
- source_word: μακάριος
  choice: блажен
  rationale: «Блажен» естественно для евангельского изречения и сохраняет религиозный вес слова, в отличие от более бытового «счастлив».
- source_word: ὃς ἐὰν μὴ
  choice: тот, кто не
  rationale: Так по-русски естественно передаётся субстантивированное относительное местоимение с общим условием, без архаического оборота.
- source_word: σκανδαλισθῇ
  choice: не преткнётся
  rationale: Глагол обозначает вызванное препятствием падение или отступление. Возвратная русская форма сохраняет образ преткновения, хотя не воспроизводит греческий пассив буквально.
- source_word: ἐν ἐμοί
  choice: из-за Меня
  rationale: В данном обороте ἐν ἐμοί указывает на Иисуса как повод или причину преткновения; буквальное «во Мне» по-русски было бы неясно.
theological_decisions:
- issue: Смысл преткновения о личности и служении Иисуса
  choice: Сохранить образ преткновения и причинную связь «из-за Меня»
  alternative: «Кто не соблазнится обо Мне» или «кто не отпадёт из-за Меня»
  rationale: «Преткнётся» удерживает напряжение между неприятием Иисуса и возможным отпадением, не сводя смысл ни к эмоциональной обиде, ни однозначно к окончательной утрате веры.
translation_notes:
  register: Современный литературный русский с традиционной, но понятной библейской лексикой. Местоимение «Меня» написано с прописной буквы по принятой русской библейской издательской норме.
