reference: Luke 7:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: ru
  text: Услышав об Иисусе, он послал к Нему иудейских старейшин, прося Его прийти и спасти своего раба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугу». Греческое слово δοῦλος может обозначать слугу или раба; здесь «раб» точнее передаёт его зависимое положение.'
    reason: Альтернативный перевод многозначного социального термина.
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: Услышав об Иисусе
  rationale: Аористное причастие обозначает обстоятельство, предшествующее основному действию. Дословно не выраженное δέ здесь служит мягкой связкой и в естественном русском не требует отдельного перевода.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: он послал к Нему
  rationale: Сохраняется прямое значение глагола «послал»; кого именно послали, уточняет следующий оборот. Местоимение относится к Иисусу.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: иудейских старейшин
  rationale: Речь идёт о признанных руководителях местной иудейской общины, а не просто о пожилых людях. Такая формулировка естественна по-русски и не приписывает им более узкого институционального статуса.
- source_word: ἐρωτῶν αὐτὸν ὅπως ἐλθὼν
  choice: прося Его прийти
  rationale: Причастие передаёт сопровождающую отправление просьбу, а конструкция с ὅπως — её содержание и цель. Русский инфинитивный оборот передаёт это ясно и естественно.
- source_word: διασώσῃ
  choice: спасти
  rationale: Глагол может означать «спасти», «избавить», «сохранить» и в контексте болезни — «исцелить». «Спасти» сохраняет более широкий смысл исходного слова, тогда как контекст указывает на избавление от смертельной болезни.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: своего раба
  rationale: δοῦλος обозначает зависимого человека, находящегося под властью хозяина. «Раб» сохраняет социально-правовую несвободу, подразумеваемую словом; возвратное «своего» по нормам русского языка однозначно связывает его с субъектом «он».
theological_decisions:
- issue: Передача δοῦλος в повествовании о доме сотника
  choice: раб
  alternative: слуга
  rationale: В данном историческом контексте слово указывает не только на служение, но и на зависимый статус человека. Перевод «раб» сохраняет эту неприятную, но существенную реальность текста; традиционный вариант «слуга» приведён в сноске и не исключается как контекстуальный оттенок.
- issue: Значение διασώζω при смертельной болезни
  choice: спасти
  alternative: исцелить
  rationale: Контекст явно связан с телесной болезнью, однако исходный глагол шире обычного слова «исцелить». Поэтому выбран вариант, сохраняющий смысл избавления от смертельной опасности без внесения дополнительного богословского значения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. Синтаксис близок к исходному, но не калькирован. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией. Маркер сноски поставлен непосредственно после слова «раба», к которому относится примечание.
