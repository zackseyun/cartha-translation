  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: ru
  text: 'Симон ответил: «Полагаю[a], тот, кому он простил больший долг[b]». Он сказал ему: «Ты рассудил верно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Думаю», «предполагаю»; греческое слово выражает осторожный вывод.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «списал бо́льшую сумму долга»; греческий глагол может означать милостиво простить или отменить долг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: ответил
  rationale: Причастие с глаголом речи образует обычную греческую формулу ответа; по-русски естественно передать её одним глаголом.
- source_word: Ὑπολαμβάνω
  choice: Полагаю
  rationale: Передаёт осторожный, предположительный вывод Симона, не превращая его ответ в уверенное утверждение.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: тот, кому он простил больший долг
  rationale: В контексте притчи речь идёт о двух денежных долгах разной величины; «больший долг» естественно передаёт сравнительный смысл τὸ πλεῖον и сохраняет образ прощения долга.
- source_word: Ὀρθῶς
  choice: верно
  rationale: Точно выражает положительную оценку ответа Симона и естественно сочетается с «рассудил».
- source_word: ἔκρινας
  choice: ты рассудил
  rationale: Сохраняет значение оценки и вынесения суждения, оставаясь естественным в современной русской речи.
theological_decisions:
- issue: Смысл ἐχαρίσατο в образе должников
  choice: простил больший долг
  alternative: списал бо́льшую сумму долга; оказал бо́льшую милость
  rationale: Контекст прямо говорит о долгах, которые заимодавец простил. Формулировка связывает долговой образ с темой прощения в отрывке, но не устраняет образ долга и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; речь краткая и dignified, с сохранением осторожности ответа Симона. «Простил больший долг» выбрано вместо менее естественного «простил больше», чтобы ясно удержать долговой контекст притчи.
