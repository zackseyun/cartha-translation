  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: ru
  text: 'Придя к Иисусу, они настойчиво просили Его: «Он достоин того, чтобы Ты сделал это для него».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: придя
  rationale: Аористное причастие обозначает прибытие к Иисусу и естественно передаётся русским деепричастием, выражающим предшествующее действие.
- source_word: παρεκάλουν
  choice: стали просить
  rationale: Глагол в имперфекте передаёт продолжающуюся настойчивую просьбу; «просить» сохраняет уважительный характер обращения без чрезмерного усиления.
- source_word: σπουδαίως
  choice: настойчиво
  rationale: Наречие выражает серьёзность и усердие ходатайства; «настойчиво» естественно сочетается с «просить» и передаёт интенсивность обращения.
- source_word: Ἄξιός
  choice: достоин
  rationale: Прямой эквивалент сохраняет оценочное утверждение посланников о сотнике.
- source_word: ᾧ
  choice: для него
  rationale: Дательный относительного местоимения указывает на лицо, в пользу которого должно быть совершено действие.
- source_word: παρέξῃ
  choice: Ты сделал
  rationale: В данном контексте παρέχω означает оказать или сделать просимое для кого-либо. Русская конструкция «достоин того, чтобы Ты сделал это для него» точно и естественно передаёт смысл, не уточняя сверх текста характер благодеяния.
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение отсылает к просьбе об исцелении, сохраняя лаконичность исходного текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с уважительным и настойчивым тоном ходатайства. Местоимение «Ты» при обращении к Иисусу написано с прописной буквы согласно распространённой русской библейской традиции; это орфографический знак почтения, а не добавочное толкование.
