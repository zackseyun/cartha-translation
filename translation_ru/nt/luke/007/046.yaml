  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: ru
  text: Ты не помазал мне голову маслом, а она помазала мне ноги душистым маслом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благовонной мазью»; традиционно: «миром».'
    reason: Лексема μύρον обозначает ароматическое масло или мазь; «миро» — традиционный церковнославяно-русский вариант, способный иметь специальный церковный оттенок.
lexical_decisions:
- source_word: ἐλαίῳ
  choice: маслом
  rationale: Дательный падеж средства от ἔλαιον. «Маслом» — естественная передача без излишнего уточнения «оливковым».
- source_word: ἤλειψας / ἤλειψεν
  choice: помазал / помазала
  rationale: Глагол ἀλείφω обозначает нанесение масла или мази. «Помазать» естественно передаёт и обычай почтить гостя, и параллельное действие женщины, не придавая ему само по себе значения формального посвящения.
- source_word: τὴν κεφαλήν μου
  choice: Мне голову
  rationale: Естественная русская конструкция с дательным принадлежности точно передаёт смысл «мою голову».
- source_word: αὕτη δὲ
  choice: а она
  rationale: Сохраняет прямое противопоставление между хозяином и присутствующей женщиной; союз «а» в современном русском естественно выражает этот контраст.
- source_word: μύρῳ
  choice: благовонием
  rationale: μύρον обозначает ароматическое масло, мазь или благовоние. «Благовонием» ясно отличает ценное ароматическое средство от обычного масла и не требует архаичного слова в основном тексте.
- source_word: τοὺς πόδας μου
  choice: Мне ноги
  rationale: Естественная русская конструкция с дательным принадлежности передаёт буквальный смысл «мои ноги» и сохраняет множественное число.
theological_decisions:
- issue: Контраст почтения к гостю в упрёке Иисуса
  choice: Передать противопоставление прямо, используя обычный глагол «помазать».
  alternative: Использовать более ритуально окрашенную лексику, предполагающую формальное посвящение.
  rationale: В непосредственном контексте отсутствие обычного знака гостеприимства противопоставлено исключительному почтению женщины. Перевод не должен самостоятельно добавлять к этому действию сакраментальный или иной специальный богословский смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Формы «Мне» написаны с прописной буквы согласно распространённой русской библейской орфографической традиции. Порядок слов сделан естественным для русского языка при сохранении параллелизма двух частей.
