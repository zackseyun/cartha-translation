- from: Ты не помазал Мне голову маслом, а она помазала Мне ноги благовонием[a].
  to: Ты не помазал мне голову маслом, а она помазала мне ноги душистым маслом[a].
  rationale: Заменено «благовонием» на «душистым маслом», чтобы передать μύρον как наносимое ароматическое средство и сохранить контраст с обычным маслом в первой части. Орфография местоимения приведена к нейтральной современной норме. Временная форма, параллелизм и прямое противопоставление сохранены.
