lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: рассказали
  rationale: Глагол обозначает передачу известий или сообщение сведений; «рассказали» естественно для современного русского повествования и не придаёт сообщению излишне официального оттенка.
- source_word: Ἰωάννῃ ... αὐτοῦ
  choice: ученики Иоанна рассказали ему
  rationale: Притяжательное местоимение раскрыто именем «Иоанна», а дательный объект передан местоимением «ему»; это устраняет неестественную для русского двусмысленность, сохраняя участников и синтаксические отношения исходного текста.
- source_word: οἱ μαθηταὶ
  choice: ученики
  rationale: «Ученики» — устойчивое и точное евангельское соответствие, передающее отношение к наставнику.
- source_word: περὶ πάντων τούτων
  choice: обо всём этом
  rationale: Сохраняет предлог περί, полноту πάντων и указательное значение τούτων в естественной русской форме.
- source_word: προσκαλεσάμενος
  choice: подозвав
  rationale: Средний аористный причастный оборот передаёт действие Иоанна, который позвал избранных учеников к себе; «подозвав» выражает это кратко и естественно.
- source_word: δύο τινὰς
  choice: двоих
  rationale: В данном сочетании τινάς имеет слабое неопределённое значение; русское «двоих из своих учеников» естественно передаёт выбор двух лиц из более широкой группы без тяжеловесного «неких двоих».
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: из своих учеников
  rationale: Предлог «из» ясно передаёт партитивный генитив, а возвратное «своих» однозначно относит учеников к Иоанну.
- source_word: ὁ Ἰωάννης
  choice: Тогда Иоанн
  rationale: Явно названный субъект сохранён; «тогда» естественно связывает второй καί с последующим действием, не добавляя причинного значения.
