  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: ru
  text: 'Когда эти мужчины пришли к нему, они сказали: «Иоанн Креститель послал нас к тебе, чтобы спросить: „Ты ли тот, кто должен прийти[a], или нам ожидать другого?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Грядущий».'
    reason: Лексическая альтернатива, передающая возможное титульное звучание ὁ ἐρχόμενος.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Когда эти люди пришли к нему
  rationale: Аористное причастие передаёт обстоятельство, предшествующее речи посланников; конструкция с «когда» естественна для современного русского повествования. Местоимение сохраняет отсутствие имени в греческом тексте.
- source_word: οἱ ἄνδρες
  choice: эти люди
  rationale: В контексте речь идёт о конкретных мужчинах-посланниках. Русское «эти люди» звучит естественнее, чем акцентированное «мужчины», при этом указание на уже известных участников сохраняется.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Иоанн Креститель
  rationale: Традиционное, общеупотребительное и понятное русское обозначение Иоанна.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: послал нас к тебе спросить
  rationale: По-русски инфинитив цели естественно передаёт поручение и вводит последующий прямой вопрос, не меняя содержания греческой конструкции с λέγων.
- source_word: ὁ ἐρχόμενος
  choice: Тот, кто должен прийти
  rationale: Формулировка сохраняет определённость и ожидаемый характер прихода, а прописная буква у «Тот» позволяет услышать титульный оттенок, не превращая выражение в более узкий догматический термин.
- source_word: ἄλλον προσδοκῶμεν
  choice: нам ожидать другого
  rationale: «Ожидать» точно передаёт προσδοκάω, а дательный субъект в безлично-инфинитивной вопросительной конструкции естественно выражает совещательное значение формы.
theological_decisions:
- issue: Мессианский оттенок выражения ὁ ἐρχόμενος
  choice: Тот, кто должен прийти
  alternative: Грядущий
  rationale: Основной вариант сохраняет буквальный образ прихода и естественно звучит по-русски, не разъясняя прямо, кого именно ожидают. Более краткий титульный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимения, относящиеся к Иисусу, написаны со строчной буквы как нейтральная современная норма; титульный оттенок выражения «Тот, кто должен прийти» отмечен прописной буквой и сноской.
