lexical_decisions:
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Прямо передаёт настоящее время и силу глагола ἀγαπάω, не ослабляя его до простого благожелательного отношения.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно вводит по-русски обоснование просьбы старейшин, высказанной в предыдущем стихе.
- source_word: τὸ ἔθνος ἡμῶν
  choice: наш народ
  rationale: В устах иудейских старейшин выражение обозначает их этнорелигиозную общность; «народ» здесь звучит естественнее современного русского «нация».
- source_word: τὴν συναγωγήν
  choice: синагогу
  rationale: Сохраняет конкретное иудейское учреждение; определённость в русском контексте передаётся без артикля.
- source_word: αὐτός
  choice: сам
  rationale: Сохраняет эмфатическое выделение сотника как того, кто предпринял или обеспечил строительство.
- source_word: ᾠκοδόμησεν
  choice: построил
  rationale: Передаёт простой аорист без добавленного уточнения о способе участия; возможное значение патроната отмечено в сноске.
- source_word: ἡμῖν
  choice: для нас
  rationale: 'Передаёт дательный заинтересованного лица: синагога построена на благо их общины.'
