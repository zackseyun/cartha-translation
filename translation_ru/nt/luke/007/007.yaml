  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: ru
  text: Поэтому я даже не счёл себя достойным прийти к Тебе. Но скажи слово — и пусть исцелится мой слуга[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой мальчик»; возможно также: «мой ребёнок». Греческое слово может обозначать ребёнка, юношу или слугу — в зависимости от контекста.'
    reason: Лексическая многозначность слова παῖς.
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего высказывания и сохраняет логическую связь.
- source_word: οὐδὲ
  choice: и себя не
  rationale: 'В сочетании с отрицанием подчёркивает: говорящий не только не позвал Иисуса к себе, но и себя не счёл достойным прийти.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: я и себя не счёл достойным
  rationale: ἀξιόω означает «считать достойным»; возвратное местоимение передано естественной русской конструкцией.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: прийти к Тебе
  rationale: Прямо передаёт личное приближение к Иисусу; местоимение оформлено в традиционном для библейского русского текста почтительном написании.
- source_word: ἀλλὰ
  choice: Но
  rationale: Ясно вводит противопоставленную просьбу.
- source_word: εἰπὲ λόγῳ
  choice: скажи слово
  rationale: Передаёт дательный образа/средства как властное речевое действие, не добавляя отсутствующего в греческом тексте определённого артикля.
- source_word: ἰαθήτω
  choice: пусть исцелится
  rationale: Сохраняет форму и силу аористного страдательного императива третьего лица, не заменяя её будущим изъявительным.
- source_word: ὁ παῖς μου
  choice: мой слуга
  rationale: В повествовании о сотнике контекст власти и домашнего служения поддерживает значение «слуга», тогда как более широкий диапазон слова отмечен в сноске.
theological_decisions:
- issue: Значение παῖς в рассказе о сотнике
  choice: мой слуга
  alternative: мой мальчик; мой ребёнок
  rationale: Слово семантически многозначно, однако повествовательный контекст отношений власти лучше всего поддерживает значение «слуга». Возможная возрастная или ласковая окраска не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным и естественным; тире подчёркивает непосредственную связь властного слова с исцелением. Сохранён императив «пусть исцелится», а неоднозначность παῖς вынесена в сноску.
