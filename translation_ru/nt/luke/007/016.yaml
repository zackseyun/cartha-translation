  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: ru
  text: 'И всех охватил страх, и они прославляли Бога, говоря: «Среди нас появился великий пророк[a], и Бог посетил Свой народ[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был воздвигнут среди нас» — такая передача яснее подчёркивает, что пророка воздвиг Бог.'
    reason: lexical_alternative
  - marker: b
    text: В библейской речи Божье «посещение» означает, что Бог обратил внимание на Свой народ и пришёл действовать ради него.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: всех охватил страх
  rationale: Передаёт греческую конструкцию, в которой страх представлен как внезапно овладевшая всеми сила. Слово «страх» сохраняет напряжение исходного текста и не сводит его заранее к благоговейному трепету.
- source_word: δὲ
  choice: И
  rationale: Мягко связывает стих с предшествующим повествованием, не придавая союзу излишнего противительного или временного значения.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: они прославляли Бога
  rationale: Имперфект передан формой несовершенного вида, выражающей продолжавшееся действие; «прославляли» сохраняет прямую связь с δοξάζω точнее, чем более общее «хвалили».
- source_word: λέγοντες
  choice: говоря
  rationale: Естественно вводит слова, которыми люди прославляли Бога.
- source_word: Προφήτης μέγας
  choice: Великий пророк
  rationale: Прямой и естественный русский эквивалент, сохраняющий оценочную силу μέγας.
- source_word: ἠγέρθη
  choice: восстал
  rationale: Сохраняет образ появления пророка среди народа и допускает подразумеваемую мысль о том, что Бог воздвиг его, не делая эту причинность явной в основном тексте.
- source_word: ἐν ἡμῖν
  choice: среди нас
  rationale: 'Естественно передаёт общинный смысл выражения: пророк появился в их среде.'
- source_word: Ἐπεσκέψατο
  choice: посетил
  rationale: Сохраняет библейский язык Божьего посещения, включающий внимание, заботу и действенное вмешательство, но не сводит его к одному толкованию.
- source_word: τὸν λαὸν αὐτοῦ
  choice: Свой народ
  rationale: Возвратное притяжательное местоимение естественно по-русски указывает на принадлежность народа Богу и сохраняет заветный оттенок выражения.
theological_decisions:
- issue: Значение φόβος после чуда
  choice: страх
  alternative: благоговейный трепет
  rationale: «Страх» непосредственно соответствует φόβος и сохраняет сильную, неоднозначную реакцию людей; контекст позволяет читателю распознать в ней благоговение, не подменяя перевод толкованием.
- issue: Значение ἠγέρθη применительно к пророку
  choice: восстал
  alternative: был воздвигнут
  rationale: Основной вариант сохраняет естественную для библейской речи формулу появления пророка, тогда как альтернатива яснее выражает возможное подразумеваемое действие Бога. Пассивную и богословскую окраску отмечает сноска.
- issue: Смысл Божьего действия в Ἐπεσκέψατο
  choice: Бог посетил Свой народ
  alternative: Бог пришёл на помощь Своему народу
  rationale: «Посетил» сохраняет богатую библейскую тему Божьего внимательного и действенного обращения к народу, не ограничивая её только помощью или избавлением.
- issue: Соотношение двух высказываний с ὅτι ... καὶ ὅτι
  choice: одно связное высказывание внутри кавычек
  alternative: два отдельных цитируемых возгласа
  rationale: Греческий текст допускает восприятие двух параллельных положений как единого содержания речи. Единая цитата естественна по-русски и не меняет смысловой параллели.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис остаётся простым и понятным; ключевые слова «страх», «прославляли», «восстал» и «посетил» сохраняют смысловые связи и напряжение греческого текста.
