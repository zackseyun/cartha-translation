  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы греческого текста: указание на следующий день, путь Иисуса в город Наин, а также совместное движение учеников и многочисленной толпы. Повествовательная формула Καὶ ἐγένετο естественно включена в русское построение без утраты смысловой функции. Сноска корректно отражает текстовый вариант.'
  naturalness: Фраза звучит естественно на современном литературном русском. Разделение греческого предложения на два русских улучшает читаемость. «Множество народа» несколько более книжно, чем «большая толпа», но вполне нормативно и соответствует сдержанному библейскому повествовательному регистру.
  terminology: «Ученики» точно передаёт μαθηταί; «город, называемый Наин» верно воспроизводит πόλιν καλουμένην Ναΐν. Написание «Наин» является общепринятым. Прописные буквы в местоимениях, относящихся к Иисусу, допустимы в заявленной русской библейской традиции и не изменяют смысла.
