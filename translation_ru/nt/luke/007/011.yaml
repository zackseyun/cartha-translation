source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: ru
  text: На следующий день[a] Иисус пошёл в город, называемый Наин. Вместе с Ним шли Его ученики и множество народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «вскоре после этого».'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: На следующий день…
  rationale: Луканская повествовательная формула вводит новое событие; отдельное «и случилось» в современном русском звучало бы тяжеловесно, поэтому её функция естественно передана построением фразы.
- source_word: ἐν τῷ ἑξῆς
  choice: На следующий день
  rationale: В данном контексте выражение естественно указывает на следующий день; иной вариант текста отражён в сноске.
- source_word: ἐπορεύθη
  choice: пошёл
  rationale: Обычная и естественная передача глагола движения πορεύομαι в повествовании.
- source_word: εἰς πόλιν
  choice: в город
  rationale: πόλις обозначает населённый пункт городского типа; «город» — традиционная и естественная русская передача без необходимости уточнять размеры Наина.
- source_word: καλουμένην Ναΐν
  choice: называемый Наин
  rationale: Сохраняет значение причастия καλουμένην и общепринятую русскую форму географического названия.
- source_word: συνεπορεύοντο αὐτῷ
  choice: Вместе с Ним шли
  rationale: Передаёт совместное движение и длительный вид несовершенного времени.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Его ученики
  rationale: Естественная и устоявшаяся передача μαθηταί в евангельском контексте.
- source_word: ὄχλος πολύς
  choice: множество народа
  rationale: Естественно передаёт многочисленную толпу и сохраняет достойный повествовательный регистр.
- source_word: implicit subject of ἐπορεύθη
  choice: Иисус
  rationale: В греческом подлежащее подразумевается из контекста; явное имя устраняет неестественную для отдельного русского стиха неопределённость, не меняя референта.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным звучанием. Длинное греческое предложение разделено на два для естественности; смысловые связи сохранены. Местоимения, относящиеся к Иисусу, даны с прописной буквы согласно распространённой русской библейской традиции.
