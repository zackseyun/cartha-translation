source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: ru
  text: Вернувшись в дом, посланные нашли раба[a] здоровым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «слугу». Греческое слово δοῦλος может означать «раб» или «слуга» в зависимости от контекста.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Вернувшись
  rationale: Аористное причастие передаёт действие, предшествующее основному глаголу; деепричастие естественно сохраняет последовательность событий.
- source_word: εἰς τὸν οἶκον
  choice: в дом
  rationale: Предлог εἰς с винительным обозначает движение к месту или внутрь него; «в дом» естественно и не превращает конкретное место в более широкое понятие «домой».
- source_word: οἱ πεμφθέντες
  choice: посланные
  rationale: Субстантивированное страдательное причастие сохраняет пассивное значение и не добавляет отсутствующего в греческом тексте существительного «посланники».
- source_word: εὗρον
  choice: нашли
  rationale: Обычное повествовательное соответствие глаголу εὑρίσκω.
- source_word: τὸν δοῦλον
  choice: раба
  rationale: В контексте римского сотника δοῦλος обозначает зависимого человека, находящегося под властью хозяина; «раб» точнее сохраняет социальный статус, чем более широкое «слуга».
- source_word: ὑγιαίνοντα
  choice: здоровым
  rationale: Причастие ὑγιαίνοντα означает пребывание в здоровом состоянии; «здоровым» передаёт результат, не заменяя его более толковательным «исцелённым».
theological_decisions:
- issue: Передача δοῦλος в рассказе об исцелении
  choice: раб
  alternative: слуга
  rationale: Текст подчёркивает отношения власти и подчинения, а δοῦλος допускает прямое социальное значение «раб». Вариант «слуга» сохранён в сноске как традиционное и контекстуально возможное соответствие.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный синтаксис. Деепричастный оборот естественно передаёт временную связь, а конструкция «нашли раба здоровым» сохраняет предикативный смысл греческого причастия.
