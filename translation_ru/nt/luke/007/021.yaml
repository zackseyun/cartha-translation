base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: ru
  text: В тот час Он исцелил многих от болезней, тяжких страданий и злых духов[a] и многим слепым даровал зрение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мучительных недугов». Греческое слово буквально означает «удары бича», а переносно — тяжкие, мучительные страдания или болезни.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «даровал видеть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: В тот час
  rationale: Сохраняет временную конкретность греческого выражения и естественно звучит по-русски; контекст допускает оттенок непосредственности.
- source_word: ἐθεράπευσεν πολλοὺς ἀπό
  choice: исцелил многих от
  rationale: Передаёт значение исцеления и отделения от названных бедствий, выраженное предлогом ἀπό.
- source_word: νόσων
  choice: болезней
  rationale: Прямой и естественный русский эквивалент в контексте исцелений.
- source_word: μαστίγων
  choice: тяжких страданий
  rationale: Буквально слово может означать удары бича, но здесь метафорически обозначает мучительные телесные недуги или бедствия; выбранный вариант понятен современному читателю.
- source_word: πνευμάτων πονηρῶν
  choice: злых духов
  rationale: Точно сохраняет личностно-духовный смысл выражения и значение прилагательного πονηρός — «злой».
- source_word: τυφλοῖς πολλοῖς
  choice: многим слепым
  rationale: Естественно передаёт дательный падеж получателей дара, не вводя отсутствующего в греческом тексте ограничения по полу.
- source_word: ἐχαρίσατο βλέπειν
  choice: даровал зрение
  rationale: Передаёт благодетельный оттенок χαρίζομαι и выражает буквальное «даровал видеть» естественным русским оборотом.
theological_decisions:
- issue: Характер власти Иисуса над πνεύματα πονηρά
  choice: Сохранено прямое обозначение «злых духов» как самостоятельной духовной реальности.
  alternative: Истолковать выражение как образное обозначение психических или телесных заболеваний.
  rationale: Греческий текст прямо говорит о злых духах; перевод не демифологизирует выражение и не отождествляет его без основания с болезнями.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Синтаксис близок к греческому, но естественен по-русски; «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
