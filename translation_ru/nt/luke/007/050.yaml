lexical_decisions:
- source_word: εἶπεν δὲ
  choice: И сказал
  rationale: δέ обозначает простое продолжение повествования; русское «И» естественно сохраняет связь с предыдущим контекстом, а аорист εἶπεν передан обычным повествовательным прошедшим временем.
- source_word: πρὸς τὴν γυναῖκα
  choice: женщине
  rationale: В данном контексте γυνή означает участницу сцены, женщину, а не жену; русский дательный падеж естественно передаёт конструкцию «сказал женщине».
- source_word: Ἡ πίστις σου
  choice: Твоя вера
  rationale: πίστις здесь обозначает доверительную веру женщины. «Вера» сохраняет основной богословский и лексический смысл; «доверие» возможно как поясняющий оттенок, тогда как «верность» здесь менее вероятна.
- source_word: σέσωκέν σε
  choice: спасла тебя
  rationale: Перфект σῴζω указывает на совершившееся действие с сохраняющимся результатом. В контексте прощения грехов «спасла» предпочтительнее чисто терапевтического «исцелила».
- source_word: πορεύου εἰς εἰρήνην
  choice: Иди с миром
  rationale: Это естественное и достойное русское соответствие семитизированному греческому выражению; оно передаёт уход в состоянии мира, не калькируя буквально предлог εἰς как «в».
theological_decisions:
- issue: Значение σῴζω в связи с прощением и спасением
  choice: «спасла тебя»
  alternative: «исцелила тебя» / «сделала тебя здоровой»
  rationale: Ближайший контекст Лк 7:36–50 сосредоточен на прощении грехов, любви и вере женщины, а не на телесном исцелении. При этом сноска сохраняет более широкий лексический диапазон глагола.
- issue: Роль πίστις
  choice: «вера»
  alternative: «доверие»; менее вероятно «верность»
  rationale: Формулировка сохраняет прямое утверждение текста о вере женщины как средстве, с которым связано спасение, не разъясняя сверх текста природу этой связи.
translation_notes:
  register: Современный литературный русский язык с традиционно узнаваемой, но не архаичной формулой «Иди с миром». Порядок слов сохраняет краткость и торжественную простоту оригинала.
