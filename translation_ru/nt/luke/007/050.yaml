  text: 'И сказал женщине: «Твоя вера[a] спасла тебя[b]. Иди с миром».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё доверие спасло тебя»; менее вероятно: «Твоя верность спасла тебя».'
