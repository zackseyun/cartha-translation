  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: ru
  text: Один из фарисеев просил Иисуса поесть с ним[a]. Войдя в дом фарисея, Иисус возлёг за столом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «просил Его, чтобы Он поел с ним».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть Он принял обычную для трапезы позу: не сидел прямо, а возлежал.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: просил
  rationale: Русский глагол несовершенного вида передаёт длительный характер имперфекта и остаётся ближе к греческому выражению, чем более истолковывающее «пригласил».
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Здесь это слабая повествовательная связка; в современном русском начале эпизода она естественно передаётся самим переходом к новому предложению без искусственного «теперь».
- source_word: τις … τῶν Φαρισαίων
  choice: один из фарисеев
  rationale: Естественно передаёт неопределённое местоимение с партитивным родительным падежом.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: поесть с ним
  rationale: Инфинитивная конструкция естественно передаёт цель просьбы, не добавляя более узкого значения «обедать» или «пировать».
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: войдя в дом фарисея
  rationale: Деепричастная конструкция сохраняет предшествование действия главному глаголу и звучит естественно по-русски.
- source_word: κατεκλίθη
  choice: возлёг за столом
  rationale: Передаёт принятую в древности позу участника трапезы, а не современное сидение за столом; добавление «за столом» ясно указывает на контекст еды.
