  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: ru
  text: Когда же Он приблизился к городским воротам, вот, из города выносили умершего — единственного сына своей матери; она была вдовой, и с нею была немалая городская толпа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Когда же Он приблизился
  rationale: Временное значение ὡς передано естественной русской конструкцией «когда», а δέ — частицей «же», сохраняющей переход в повествовании.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: к городским воротам
  rationale: Естественный современный эквивалент греческого выражения «к воротам города»; множественное число «ворота» соответствует русскому употреблению.
- source_word: καὶ ἰδοὺ
  choice: то увидел
  rationale: ἰδού привлекает внимание к неожиданно открывшейся сцене. Контекстуальное «то увидел» передаёт этот повествовательный эффект естественнее, чем архаичное «вот» или «се».
- source_word: ἐξεκομίζετο
  choice: выносили
  rationale: Имперфект пассива описывает происходившее в тот момент действие. Неопределённо-личная русская конструкция естественно передаёт пассив в контексте похоронной процессии.
- source_word: τεθνηκώς
  choice: умершего
  rationale: Перфектное причастие обозначает человека, находящегося в состоянии смерти; «умершего» точно и достойно по регистру.
- source_word: μονογενὴς υἱός
  choice: единственного сына
  rationale: В семейном контексте μονογενής означает единственного сына; перевод не переносит сюда особые богословские оттенки употребления этого слова в иных контекстах.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: у своей матери
  rationale: Дательный падеж выражает отношение сына к матери. Русская конструкция «единственный сын у матери» ясно передаёт, что у неё не было другого сына.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: а она была вдовой
  rationale: Местоимение сохраняет акцент на тяжёлом положении матери; союз «а» естественно вводит дополнительное обстоятельство.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: немалая толпа из города
  rationale: ἱκανός указывает на значительное число людей, не обязательно требуя усиленного «огромная». «Немалая» звучит естественно и сдержанно.
- source_word: ἦν σὺν αὐτῇ
  choice: Вместе с ней шла
  rationale: Смысл сопровождения раскрыт с учётом похоронной процессии; глагол «шла» естественно передаёт движение толпы вместе с вдовой.
theological_decisions:
- issue: Значение μονογενής вне христологического контекста
  choice: единственного сына
  alternative: единородного сына
  rationale: Здесь слово описывает семейное положение вдовы и означает её единственного сына. Основной текст избегает архаичного «единородный», которое в русском языке может вызвать неуместные для этого контекста христологические ассоциации.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Архаичное «се» и конфессионально окрашенное «единородный» не использованы в основном тексте. Заглавное «Он» соответствует принятому русскому библейскому оформлению местоимения, относящегося к Иисусу.
