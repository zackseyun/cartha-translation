source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: ru
  text: С чем же Мне сравнить людей этого поколения? И на что они похожи?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι … ὁμοιώσω
  choice: С кем … сравнить
  rationale: Греческое τίς в дательном с ὁμοιόω естественно передаётся по-русски конструкцией «с кем сравнить»; вопросительная форма сохранена.
- source_word: τοὺς ἀνθρώπους
  choice: людей
  rationale: ἄνθρωποι обозначает людей в целом; русское «людей» точно и не вносит неоправданного ограничения только на мужчин.
- source_word: τῆς γενεᾶς ταύτης
  choice: этого поколения
  rationale: Прямой и естественный эквивалент, сохраняющий возможный смысл как современников Иисуса, так и характеризуемого поколения.
- source_word: τίνι εἰσὶν ὅμοιοι
  choice: Кого они напоминают?
  rationale: Идиоматическая русская передача вопроса о сходстве; местоимение «они» относится к людям этого поколения.
theological_decisions:
- issue: Объём значения ἄνθρωποι
  choice: людей
  alternative: мужчин
  rationale: Контекст характеризует представителей поколения в целом, а не лиц мужского пола; родовое значение греческого существительного лучше сохраняется словом «людей».
- issue: Значение γενεά
  choice: поколения
  alternative: рода
  rationale: «Поколение» является наиболее прямым соответствием в данном контексте и не сужает фразу до родословной или этнического рода.
translation_notes:
  register: Современный литературный русский язык; речь звучит естественно и достойно. Два параллельных греческих вопроса сохранены как два русских вопросительных предложения. Заглавная буква в «Мне» соответствует принятой в русской библейской традиции почтительной передаче речи Иисуса.
