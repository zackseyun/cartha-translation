  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: ru
  text: 'И сказал: «Истинно говорю вам: эта бедная вдова положила больше всех[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «больше, чем все остальные».'
    reason: Уточнение возможного понимания πάντων как сравнения со всеми прочими жертвователями.
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Истинно
  rationale: Передаёт торжественное и подчёркнутое введение авторитетного утверждения Иисуса; в современном литературном русском сохраняет библейскую весомость, не будучи непонятным.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо и естественно передаёт обращение к слушателям и авторитетную силу формулы.
- source_word: ἡ χήρα ἡ πτωχὴ αὕτη
  choice: эта бедная вдова
  rationale: Сохраняет указательное значение αὕτη, значение бедности у πτωχή и естественный для русского языка порядок слов.
- source_word: πλεῖον πάντων
  choice: больше всех
  rationale: Кратко и естественно передаёт сравнительную конструкцию; в контексте речь идёт обо всех остальных жертвователях, но формулировка не добавляет объяснения из следующего стиха.
- source_word: ἔβαλεν
  choice: положила
  rationale: В контексте храмовой сокровищницы означает внесение денег; «положила» звучит современно и нейтрально, не создавая лишнего образа броска.
theological_decisions:
- issue: Смысл сравнения дара вдовы
  choice: «положила больше всех»
  alternative: «положила больше, чем все остальные»
  rationale: Сохранено прямое количественное сравнение πλεῖον πάντων без преждевременного пояснения, что оценка основана на доле имущества или жертвенности; это раскрывается в следующем стихе.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Сохранена торжественная формула «Истинно говорю вам»; синтаксис слегка упрощён для естественного звучания, без устранения смыслового напряжения.
