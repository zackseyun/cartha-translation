    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: как западня
  rationale: παγίς обозначает ловушку, западню или силок. «Западня» естественно передаёт образ внезапной и трудноизбежной опасности и сохраняет сравнительное ὡς.
- source_word: ἐπεισελεύσεται
  choice: он обрушится
  rationale: Будущая форма ἐπεισέρχομαι означает наступление на людей или их внезапное постижение. Местоимение «он» отсылает к «дню» из предыдущего стиха; «обрушится» естественно передаёт внезапность угрозы, не делая подразумеваемое подлежащее явным существительным.
- source_word: γὰρ
  choice: ведь
  rationale: γάρ обосновывает предыдущее предостережение. «Ведь» сохраняет пояснительно-причинную связь и естественно звучит по-русски.
- source_word: ἐπὶ πάντας
  choice: на всех
  rationale: ἐπί с винительным указывает на направленность наступающего события на всех людей; «на всех» естественно сочетается с глаголом «обрушится».
- source_word: τοὺς καθημένους
  choice: живущих
  rationale: Хотя κάθημαι буквально означает «сидеть», в данном выражении причастие имеет идиоматический смысл постоянного пребывания или проживания. «Живущих» ясно передаёт этот смысл.
- source_word: ἐπὶ πρόσωπον
  choice: по лицу
  rationale: Выражение буквально обозначает пребывание на поверхности земли и отражает семитизированный библейский оборот. «По лицу» сохраняет образ и торжественный регистр.
- source_word: πάσης τῆς γῆς
  choice: всей земли
  rationale: γῆ может означать как землю вообще, так и определённую страну. В сочетании со «всеми живущими по лицу» универсальный смысл «всей земли» наиболее вероятен.
theological_decisions:
- issue: Масштаб значения γῆ в эсхатологическом предостережении
  choice: всей земли
  alternative: всей страны
  rationale: Лексема γῆ допускает оба значения, поэтому альтернатива отмечена в сноске. Однако сочетание с «всеми живущими по лицу» в контексте наступления дня лучше поддерживает всемирный охват, не требуя привнесения какой-либо конфессиональной схемы.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного библейского образа «по лицу всей земли». Идиоматическое «живущих» предпочтено буквальному «сидящих». Местоимение «он» сохраняет грамматическую отсылку к «дню» из предыдущего стиха; стих представляет собой продолжение предложения.
