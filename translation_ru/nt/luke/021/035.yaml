  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: ru
  text: как западня[a]. Ибо он настигнет всех, живущих по лицу всей земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как ловушка»; возможно также: «как силок».'
    reason: lexical_alternative
  - marker: b
