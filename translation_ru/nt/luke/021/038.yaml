  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: «весь народ» соответствует πᾶς ὁ λαός, несовершенное «приходил» уместно отражает повторяемое действие ὤρθριζεν, «к Нему» передаёт πρὸς αὐτόν, а целевой оборот «чтобы слушать Его» — ἀκούειν αὐτοῦ. Оборот «с раннего утра» адекватно выражает раннее время прихода.'
