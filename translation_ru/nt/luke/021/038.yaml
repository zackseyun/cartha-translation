source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: ru
  text: И весь народ с раннего утра приходил к Нему в храм, чтобы слушать Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἱερόν означает весь храмовый комплекс или его дворы, а не только внутреннее святилище.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Естественно передаёт собирательный и широкий смысл выражения, не требуя понимания как буквально каждого человека без исключения.
- source_word: ὤρθριζεν
  choice: с раннего утра приходил
  rationale: Глагол указывает на раннее время, а имперфект — на повторяющееся, обычное действие; такая формулировка передаёт оба оттенка.
- source_word: πρὸς αὐτόν
  choice: к Нему
  rationale: Передаёт направленность движения к Иисусу и сохраняет местоименную отсылку исходного текста.
- source_word: ἐν τῷ ἱερῷ
  choice: в храм
  rationale: Краткий и естественный русский эквивалент; значение всего храмового комплекса, а не только святилища, уточнено в примечании.
- source_word: ἀκούειν αὐτοῦ
  choice: чтобы слушать Его
  rationale: Инфинитив выражает цель прихода; «слушать» в данном контексте естественно обозначает внимательное восприятие учения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и доступным синтаксисом. Повторяемость действия передана формой «приходил», раннее время — оборотом «с раннего утра».
