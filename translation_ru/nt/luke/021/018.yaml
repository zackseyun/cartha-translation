  text: And not a hair from your head will perish[a].
translation:
  language: ru
  text: И ни один волос с вашей головы не пропадёт.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и волос с вашей головы ни в коем случае не пропадёт»; в греческом употреблено усиленное отрицание, выражающее твёрдую уверенность.'
    reason: Пояснение усиленного греческого отрицания и более буквальной формы.
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз сохраняет связь с предыдущим контекстом, не добавляя отсутствующего в греческом противопоставления.
- source_word: θρὶξ
  choice: ни один волос
  rationale: Единственное число передано естественной русской идиомой; в сочетании с отрицанием она выражает полноту сохранности.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: с вашей головы
  rationale: Передаёт исходное значение ἐκ и естественно звучит при обращении к нескольким людям с собирательным единственным числом «головы».
- source_word: οὐ μὴ
  choice: не погибнет
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание; по-русски его сила естественно поддерживается конструкцией «ни один… не».
- source_word: ἀπόληται
  choice: погибнет
  rationale: Глагол сохраняет торжественную многозначность ἀπόλλυμι между гибелью и утратой и не сводит высказывание лишь к физическому повреждению.
theological_decisions:
- issue: Кажущееся противоречие с ближайшим предсказанием о том, что некоторых учеников убьют
  choice: 'Сохранить образное и категоричное обещание: «ни один волос… не погибнет», не объясняя его прямо в основном тексте.'
  alternative: Передать как буквальное обещание полной физической невредимости или истолковать непосредственно как обещание окончательного спасения.
  rationale: Контекст одновременно говорит о смерти некоторых учеников и об их сохранности. Перевод должен удержать эту напряжённость, не устраняя её добавленным толкованием.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и понятная. Конструкция «ни один… не» естественно передаёт усиленное отрицание без архаизмов. Маркер сноски поставлен непосредственно после предложения.
