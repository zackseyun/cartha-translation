  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: ru
  text: Это обернётся для вас свидетельством[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Это даст вам возможность свидетельствовать».'
    reason: 'Лексико-синтаксическая альтернатива: εἰς μαρτύριον может обозначать результат в виде случая или возможности дать свидетельство.'
lexical_decisions:
- source_word: ἀποβήσεται
  choice: обернётся
  rationale: Будущая форма ἀποβαίνω здесь обозначает итог или результат предшествующих событий; «обернётся» естественно передаёт это значение по-русски.
- source_word: ὑμῖν
  choice: для вас
  rationale: Дательный падеж указывает, чем происходящее станет для учеников; сочетание «для вас» идиоматично в русском языке.
- source_word: εἰς
  choice: — творительный падеж в сочетании «обернётся свидетельством»
  rationale: Предлог εἰς выражает результат или направленность; в русском это естественно передаётся конструкцией «обернуться чем».
- source_word: μαρτύριον
  choice: свидетельством
  rationale: Слово может обозначать свидетельство, даваемое учениками, либо свидетельство как доказательство. Выбор сохраняет существительное и не устраняет эту смысловую широту.
theological_decisions:
- issue: Смысл преследований и выступления учеников перед властями
  choice: Происходящее станет для учеников свидетельством, с сохранением открытости относительно точного характера этого свидетельства.
  alternative: Происходящее даст ученикам возможность свидетельствовать; либо послужит свидетельством против их противников.
  rationale: Контекст благоприятствует пониманию как свидетельствованию учеников об Иисусе, однако краткая греческая формулировка прямо не уточняет ни адресата, ни судебной или благовестнической функции. Основной текст сохраняет эту неоднозначность, а сноска поясняет вероятный смысл.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Обернётся» передаёт итоговый смысл ἀποβήσεται без излишнего толкования, а «свидетельством» сохраняет юридический и публичный оттенок μαρτύριον.
