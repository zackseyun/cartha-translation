id: LUK.21.31
reference: Luke 21:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: ru
  text: 'Так и вы, когда увидите, что всё это происходит, знайте: Царство Бога[a] близко.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царствование Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Так и вы
  rationale: Передаёт применение предшествующего сравнения и сохраняет лёгкое смысловое выделение явно выраженного местоимения ὑμεῖς.
- source_word: ὅταν ἴδητε
  choice: когда увидите
  rationale: Естественно передаёт будущую обусловленность конструкции ὅταν с аористом сослагательного наклонения.
- source_word: ταῦτα γινόμενα
  choice: что всё это происходит
  rationale: Оборот ясно указывает на совершающиеся события, описанные выше; «всё это» естественно передаёт собирательную отсылку ταῦτα.
- source_word: γινώσκετε
  choice: знайте
  rationale: Прямо передаёт повелительное наклонение и призыв понять значение увиденных признаков.
- source_word: ἐγγύς ἐστιν
  choice: близко
  rationale: Сохраняет образ близости, не уточняя сверх текста, является ли она временной, пространственной или образной.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Бога
  rationale: Современная и ясная передача устойчивого библейского понятия, сохраняющая возможные значения царства и царствования.
theological_decisions:
- issue: Значение выражения «Царство Бога» в эсхатологическом контексте
  choice: Сохранить выражение «Царство Бога» без поясняющего расширения.
  alternative: «царствование Бога» или «приближение полноты Божьего правления»
  rationale: Текст связывает близость Царства с описанными признаками, но не уточняет, идёт ли речь прежде всего о его явлении, завершении или торжестве. Перевод не разрешает эту богословскую напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Двоеточие после «знайте» естественно вводит содержание того, что следует знать. Архаические формы «Божие» и «познайте» не используются.
