id: LUK.21.33
reference: Luke 21:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ru
  text: Небо и земля пройдут, но Мои слова никогда не пройдут.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: небо
  rationale: В устойчивой паре с «землёй» обозначает сотворённое небо как часть мироздания, а не только видимый небосвод.
- source_word: ἡ γῆ
  choice: земля
  rationale: В сочетании «небо и земля» имеет вселенский смысл и не обозначает отдельную страну или территорию.
- source_word: παρελεύσονται
  choice: пройдут
  rationale: Передаёт здесь значение прекращения существования; повтор одного и того же глагола сохранён ради контраста и риторического параллелизма.
- source_word: δὲ
  choice: но
  rationale: Ясно выражает противопоставление преходящего творения и непреходящих слов Иисуса.
- source_word: οἱ λόγοι μου
  choice: Мои слова
  rationale: Прямо и естественно передаёт сказанные Иисусом слова, сохраняя торжественность утверждения.
- source_word: οὐ μὴ
  choice: никогда не
  rationale: Сочетание οὐ μή с будущим временем является усиленным отрицанием; «никогда не» естественно и недвусмысленно передаёт его категорическую силу по-русски.
theological_decisions:
- issue: Категоричность утверждения Иисуса о непреходящем характере Его слов
  choice: «Мои слова никогда не пройдут»
  alternative: «Мои слова ни в коем случае не пройдут»
  rationale: Перевод сохраняет абсолютный характер усиленного греческого отрицания οὐ μή и резкий контраст с преходящими небом и землёй, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой. Синтаксический параллелизм и повтор глагола сохранены. Заглавная буква в «Мои» употреблена как принятая в русском библейском стиле форма почтительного обозначения слов Иисуса.
