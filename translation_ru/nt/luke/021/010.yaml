  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: ru
  text: 'Тогда Он сказал им: «Народ восстанет против народа, и царство — против царства».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественный временной указатель, связывающий слова Иисуса с предшествующим контекстом.
- source_word: ἔλεγεν
  choice: Он сказал
  rationale: Имперфект вводит прямую речь; в русском повествовании совершенный вид здесь звучит естественно и не привносит излишнего акцентирования длительности или повторности.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж передан естественным русским косвенным дополнением.
- source_word: Ἐγερθήσεται
  choice: восстанет
  rationale: В контексте враждебного столкновения передаёт значение будущей формы ἐγείρω естественно и сохраняет образ выступления одной политической общности против другой.
- source_word: ἔθνος
  choice: народ
  rationale: Здесь слово обозначает этнополитическую общность; «народ» — ясный и естественный русский эквивалент, не ограничивающий смысл современным национальным государством.
- source_word: ἐπ’ ἔθνος
  choice: против народа
  rationale: ἐπί с винительным падежом в данной формуле выражает враждебное противостояние.
- source_word: βασιλεία
  choice: царство
  rationale: В этом параллелизме слово означает конкретное политическое владение или государство под царской властью, а не отвлечённое царствование.
- source_word: ἐπὶ βασιλείαν
  choice: против царства
  rationale: Повтор предлога передан как враждебное противостояние; эллиптическая русская конструкция с тире сохраняет параллелизм без ненужного повторения глагола.
theological_decisions:
- issue: Апокалиптическая формула о междоусобных конфликтах
  choice: Передать слова как прямое предсказание столкновений народов и царств, не уточняя их эсхатологическую схему.
  alternative: Ограничить предсказание исключительно падением Иерусалима либо истолковать его как подробную хронологию конца.
  rationale: Сам стих сообщает о политических потрясениях, но не определяет здесь их точные исторические границы или место в конкретной системе толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранён краткий параллелизм оригинала; «восстанет против» ясно выражает конфликтный смысл формулы.
