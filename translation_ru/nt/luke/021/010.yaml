review_pass:
  verdict: approve
  source_fidelity: '«Тогда Он сказал им» точно передаёт τότε ἔλεγεν αὐτοῖς в естественной русской повествовательной форме. «Народ восстанет против народа, и царство — против царства» верно воспроизводит обе параллельные конфликтные формулы: ἔθνος / βασιλεία и ἐπί с винительным в значении враждебного противостояния. «Восстанет» уместно передаёт идиоматическое значение Ἐγερθήσεται, не навязывая внешнего деятеля.'
  naturalness: Текст краток, ритмичен и звучит как современный литературный русский с уместной библейской торжественностью. Тире во второй части хорошо передаёт русский эллипсис и сохраняет параллелизм без тяжеловесного повтора глагола.
  terminology: «Народ» адекватно передаёт ἔθνος как этнополитическую общность и не сужает его до современного государства-нации. «Царство» точно соответствует βασιλεία в данном политическом контексте. Термины не вносят конфессионального или эсхатологически-системного толкования.
