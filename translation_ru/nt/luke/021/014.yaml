  source_fidelity: 'В целом переданы выводное οὖν, повелительный характер θέτε и запрет на предварительное продумывание защиты. Однако «как вам защищаться» вводит вопросительное «как», которого в греческом тексте нет: infinitive ἀπολογηθῆναι прямо обозначает выступление с защитой.'
  naturalness: «Положите себе на сердце» понятно, но для современного литературного русского несколько архаично и может означать скорее «принять близко к сердцу», чем принять внутреннее решение. «Решите в своих сердцах» сохраняет исходный образ и яснее передаёт смысл.
  terminology: «Защита» точно передаёт судебно-публичную окраску ἀπολογηθῆναι. «Обдумывать заранее» приемлемо для προμελετᾶν; с прямым дополнением «свою защиту» фраза не добавляет невыраженного в оригинале вопроса «как».
