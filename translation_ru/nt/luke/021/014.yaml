lexical_decisions:
- source_word: θέτε
  choice: положите
  rationale: Аористный императив от τίθημι в сочетании с «в сердце» выражает твёрдое внутреннее решение. Русский оборот «положить себе на сердце» сохраняет образ исходного текста и повелительную силу.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующих слов и естественно связывает наставление с контекстом.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: себе на сердце
  rationale: Естественный русский идиоматический эквивалент, сохраняющий образ сердца как средоточия внутреннего решения; грамматическое число по-русски выражено распределительно.
- source_word: μὴ προμελετᾶν
  choice: не обдумывать заранее
  rationale: Глагол означает заранее продумывать или отрабатывать предстоящую речь. «Не обдумывать заранее» ясно передаёт заблаговременную подготовку, не добавляя оттенка общего запрета на всякую готовность.
- source_word: ἀπολογηθῆναι
  choice: как вам защищаться
  rationale: Передаёт судебно-публичный смысл глагола ἀπολογέομαι — выступать с ответом или защитой — и средний залог без тяжеловесной канцелярской формулы.
theological_decisions:
- issue: Характер запрета на предварительную подготовку
  choice: не обдумывать заранее, как вам защищаться
  alternative: не готовиться заранее к защите
  rationale: Формулировка сохраняет направленность запрета именно на заблаговременное продумывание защитительной речи в предстоящем преследовании и не превращает стих в универсальный запрет любой подготовки.
translation_notes:
  register: Современный литературный русский с сохранением библейского образа сердца. Оборот «положите себе на сердце» звучит достойно и понятно, а продолжение уточняет, что речь идёт о заблаговременном продумывании защиты.
