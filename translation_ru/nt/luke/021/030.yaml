  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: ru
  text: когда они уже пускают побеги[a], вы сами, видя это, знаете, что лето уже близко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «дают рост». В греческом тексте не уточняется, что именно появляется на деревьях; из контекста подразумевается новая поросль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Естественно вводит временное придаточное с оттенком ожидаемого условия; «всякий раз, когда» здесь излишне подчёркивало бы повторяемость.
- source_word: προβάλωσιν
  choice: пускают побеги
  rationale: В контексте смоковницы и других деревьев глагол обозначает появление новой поросли. «Пускают побеги» передаёт ботанический смысл, не добавляя прямо не названные в греческом тексте листья.
- source_word: ἤδη
  choice: уже
  rationale: Оба употребления наречия сохранены, чтобы передать наступившую очевидность признака и близость сезона.
- source_word: βλέποντες
  choice: видя это
  rationale: Деепричастная конструкция сохраняет обстоятельственное значение причастия; «это» естественно отсылает к появлению побегов.
- source_word: ἀφ’ ἑαυτῶν
  choice: вы сами
  rationale: Передаёт самостоятельное распознавание по собственному наблюдению, а не знание, сообщённое кем-либо ещё.
- source_word: γινώσκετε
  choice: знаете
  rationale: 'Прямой и естественный эквивалент настоящего времени: наблюдающие уверенно распознают приближение сезона.'
- source_word: ἐγγὺς
  choice: близко
  rationale: Сохраняет обычное временное значение близости.
- source_word: θέρος
  choice: лето
  rationale: Простой современный эквивалент названия сезона.
