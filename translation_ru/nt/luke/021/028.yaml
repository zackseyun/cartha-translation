id: LUK.21.28
reference: Luke 21:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: ru
  text: Но когда всё это начнёт происходить, выпрямитесь и поднимите головы, потому что приближается ваше искупление[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваше избавление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: Но когда всё это начнёт происходить
  rationale: Родительный самостоятельный оборот передаёт временное обстоятельство; «начнёт происходить» естественно сохраняет значение начала событий, а δέ обозначает переход с оттенком противопоставления к ободрению.
- source_word: ἀνακύψατε
  choice: выпрямитесь
  rationale: Глагол означает распрямиться, подняться из согнутого положения; этот вариант сохраняет телесный образ и переносный оттенок обретённой уверенности.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: поднимите головы
  rationale: Естественное русское выражение, сохраняющее образ надежды и уверенности.
- source_word: διότι
  choice: потому что
  rationale: Ясно и современно передаёт причинное значение союза.
- source_word: ἐγγίζει
  choice: приближается
  rationale: Настоящее время изображает искупление как приближающееся, а не только как статически близкое.
- source_word: ἀπολύτρωσις
  choice: искупление
  rationale: «Искупление» сохраняет богословскую ёмкость слова, которое может подразумевать освобождение, не сводя его к одному лишь избавлению от непосредственной опасности.
theological_decisions:
- issue: Значение выражения «ваше искупление» в эсхатологической речи
  choice: Сохранено «ваше искупление» как приближающееся окончательное освобождение и оправдание учеников Иисуса.
  alternative: «ваше избавление», понимаемое только как спасение от ближайшего исторического кризиса
  rationale: Будущий и апокалиптический контекст указывает на окончательное спасение, однако перевод не уточняет его механизм и сохраняет смысловую ёмкость ἀπολύτρωσις.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ободряющая и торжественная. Порядок действий и образ поднятых голов сохранены без архаизации.
