  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: ru
  text: И тогда увидят Сына Человеческого, грядущего в облаке с силой и великой славой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на облаке». В греческом тексте стоит единственное число — буквально «в облаке», однако этот образ перекликается с Даниилом 7 и другими местами, где Сын Человеческий приходит с облаками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: увидят
  rationale: Будущая форма глагола ὁράω обозначает зрительное восприятие; «увидят» естественно и точно передаёт смысл без лишней экспрессии.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшаяся передача титульного выражения, сохраняющая его связь с образом из Даниила 7 и его христологическое значение.
- source_word: ἐρχόμενον
  choice: грядущего
  rationale: Причастие передаёт явление Сына Человеческого как совершающееся действие. «Грядущего» сохраняет эсхатологический оттенок исходного контекста и остаётся понятным в современном литературном русском языке.
- source_word: ἐν νεφέλῃ
  choice: в облаке
  rationale: Греческий текст употребляет ἐν с дательным падежом и существительное в единственном числе; «в облаке» формально отражает эту конструкцию, не гармонизируя её с параллельными местами.
- source_word: μετὰ δυνάμεως
  choice: с силой
  rationale: μετά с родительным падежом выражает сопровождение; «с силой» — ясная и прямая передача.
- source_word: δόξης πολλῆς
  choice: великой славой
  rationale: В данном сочетании πολλῆς естественно передаётся словом «великой», сохраняя возвышенный смысл без неестественного оборота «со многой славой».
theological_decisions:
- issue: Передача христологического титула τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  alternative: Сына человека / Человеческого Сына
  rationale: Традиционная титульная форма сохраняет узнаваемость выражения и его связь с Даниилом 7, не сводя его к общему обозначению человека.
- issue: Облачная образность и отсылка к Даниилу 7
  choice: в облаке
  alternative: на облаке / с облаками
  rationale: Перевод следует именно формулировке Луки — единственному числу νεφέλῃ и предлогу ἐν, — не подменяя её формой из родственных апокалиптических текстов; возможная отсылка при этом сохраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Форма «грядущего» выбрана как понятная, устоявшаяся в эсхатологическом контексте и более естественная здесь, чем буквальное «идущего».
