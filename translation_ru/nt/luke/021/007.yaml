lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: спросили
  rationale: Аорист передаёт однократное действие в прошлом; «спросили» — естественный современный эквивалент в контексте прямого вопроса.
- source_word: δὲ
  choice: нулевой перевод
  rationale: Частица служит мягкой повествовательной связкой; в русском переход естественно выражается без отдельного союза.
- source_word: λέγοντες
  choice: введено двоеточием
  rationale: Причастие вводит содержание вопроса; буквальное «говоря» в современном русском избыточно, а двоеточие точно передаёт его функцию.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Передаёт прямое значение обращения и не усиливает его до «Господин» или «Владыка».
- source_word: πότε οὖν
  choice: когда же
  rationale: «Когда» выражает вопрос о времени, а частица «же» естественно передаёт выводный оттенок οὖν в русском вопросе.
- source_word: ταῦτα ἔσται
  choice: это будет
  rationale: Краткая и естественная русская формулировка, близкая к греческой конструкции с будущей формой εἰμί.
- source_word: σημεῖον
  choice: знак
  rationale: Обычный и ясный эквивалент для указания, по которому можно распознать наступление значимого события.
- source_word: ὅταν
  choice: что
  rationale: В конструкции «знак того, что» временное отношение естественно перестраивается в изъяснительное, не меняя смысла вопроса.
- source_word: μέλλῃ
  choice: вот-вот
  rationale: Передаёт возможный оттенок близкого, надвигающегося наступления события, не уточняя его абсолютные сроки.
- source_word: γίνεσθαι
  choice: произойдёт
  rationale: Естественно обозначает совершение или наступление событий в данном контексте.
theological_decisions:
- issue: Эсхатологическая формулировка и временной оттенок μέλλῃ
  choice: Сохранён оттенок предстоящего, близящегося события посредством «вот-вот произойдёт».
  alternative: Более общее «должно произойти» или «произойдёт».
  rationale: Так сохраняется напряжение греческого μέλλῃ без привязки слов Иисуса к конкретной эсхатологической схеме; примечание указывает на допустимую более общую передачу.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-достоинный. Причастная формула «говоря» устранена как неестественная для текущей русской речи; синтаксическая связь передана прямой речью. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
