lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Но следите за собой
  rationale: Императив призывает к бдительности по отношению к собственному состоянию. «Следите за собой» естественно передаёт сочетание προσέχετε с возвратным местоимением; δὲ обозначено словом «но» как переходом к предостережению.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: чтобы ваши сердца не отяжелели
  rationale: Сохранены образ тяжелеющего сердца и предупредительная направленность μήποτε. «Сердца» здесь обозначают внутреннюю жизнь и духовно-нравственную восприимчивость, но перевод не раскрывает образ толкованием.
- source_word: κραιπάλῃ
  choice: разгула[a]
  rationale: Слово связано с неумеренным употреблением алкоголя и может указывать как на пьяный разгул, так и на его тяжёлые последствия. «Разгул» достаточно широко передаёт основную мысль, а сноска сохраняет лексическую неоднозначность.
- source_word: μέθῃ
  choice: пьянства
  rationale: Прямой и естественный эквивалент существительного, обозначающего состояние или практику опьянения.
- source_word: μερίμναις βιωτικαῖς
  choice: житейских забот
  rationale: Выражение относится к тревогам и заботам обычной земной жизни. «Житейские заботы» ясно и кратко передаёт смысл без добавочного осуждения самой повседневной жизни.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: не застал вас внезапно
  rationale: Глагол описывает наступление дня на людей, а прилагательное αἰφνίδιος — его внезапность. Русское «застал вас внезапно» естественно передаёт и неожиданное приближение, и предупредительный тон.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: тот день
  rationale: Сохранено лаконичное указательное выражение исходного текста без поясняющего добавления «суда».
theological_decisions:
- issue: Эсхатологический смысл выражения «тот день»
  choice: тот день
  alternative: тот день суда
  rationale: В контексте речи Иисуса выражение имеет эсхатологическую направленность, однако греческий текст не добавляет слова «суда». Перевод сохраняет формулировку и её контекстуальную напряжённость.
- issue: Сфера действия предостережения μήποτε
  choice: 'два связанных последствия: отяжеление сердец и внезапное наступление того дня'
  alternative: понимать вторую часть как отдельное независимое утверждение
  rationale: 'Синтаксис естественно связывает оба сослагательных глагола с предостережением: нужно следить за собой, чтобы сердца не отяжелели и чтобы тот день не застал внезапно. Повтор «и чтобы» делает эту связь ясной по-русски.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены метафора отяжелевшего сердца, прямое предостережение и нерасширенное выражение «тот день». Синтаксис слегка перестроен для естественного русского звучания, без устранения смысловой напряжённости оригинала.
