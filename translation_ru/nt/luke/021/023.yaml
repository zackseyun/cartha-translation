id: LUK.21.23
reference: Luke 21:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: ru
  text: Горе беременным и кормящим грудью в те дни! Ибо великое бедствие постигнет землю[a], и гнев обрушится на этот народ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на земле» в более широком смысле — «по всей земле» или «в мире». Греческое слово γῆ может означать как определённую землю, страну, так и землю вообще; здесь выбран местный смысл ввиду контекста Иерусалима и Иудеи.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблён дательный падеж; возможно также: «гнев против этого народа» или «гнев для этого народа».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: горе
  rationale: Сохраняет сильное пророческое восклицание, выражающее одновременно скорбь и угрозу суда.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: беременным
  rationale: Естественная и точная современная передача буквального выражения «имеющим во чреве».
- source_word: ταῖς θηλαζούσαις
  choice: кормящим грудью
  rationale: Современное и ясное обозначение женщин, кормящих младенцев; дополнение «младенцев» в русском тексте не требуется.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: в те дни
  rationale: Краткая, естественная и близкая к греческой конструкции временная формула.
- source_word: ἀνάγκη μεγάλη
  choice: великое бедствие
  rationale: В контексте осады и разорения ἀνάγκη означает тяжёлое бедствие, крайнюю нужду и мучительные обстоятельства, а не отвлечённую необходимость.
- source_word: ἐπὶ τῆς γῆς
  choice: постигнет эту землю
  rationale: γῆ допускает значения «земля» и «вся земля/мир»; ближайший контекст Иерусалима и Иудеи поддерживает местное значение. Глагольная формулировка естественно передаёт направленность бедствия на землю.
- source_word: ὀργὴ
  choice: гнев
  rationale: Сохраняет прямое лексическое значение и тяжесть грядущего воздаяния, не заменяя его более толковательным словом «суд».
- source_word: τῷ λαῷ τούτῳ
  choice: обрушится на этот народ
  rationale: Передаёт дательный падеж как указание на народ, подвергающийся гневу; указательное местоимение сохранено.
theological_decisions:
- issue: Референт и масштаб γῆ и выражения «этот народ»
  choice: Основной текст говорит «эта земля», соотнося выражение прежде всего с Иудеей/землёй Израиля в контексте участи Иерусалима.
  alternative: «Вся земля» или «мир», то есть универсальный масштаб.
  rationale: Непосредственный контекст посвящён окружению и разорению Иерусалима. При этом сноска сохраняет реальную лексическую возможность более широкого понимания γῆ.
- issue: Источник ὀργή
  choice: Передано просто как «гнев», без добавления «Божий».
  alternative: «Божий гнев» или толковательное «суд».
  rationale: В контексте гнев может пониматься как Божий, но в самом греческом тексте его носитель прямо не назван; перевод не должен устранять эту сдержанность.
- issue: Отношение гнева к народу
  choice: «Гнев обрушится на этот народ».
  alternative: «Гнев будет этому народу» или «гнев против этого народа».
  rationale: Выбранная формулировка естественна по-русски и выражает поражающее действие гнева, тогда как сноска отмечает более буквальную неопределённость дательной конструкции.
translation_notes:
  register: 'Современный литературный русский язык с торжественной библейской интонацией. Синтаксис сделан естественным для русского: две греческие безглагольные конструкции переданы глаголами «постигнет» и «обрушится». Слово «гнев» оставлено без явно названного субъекта, а неоднозначность γῆ вынесена в сноску.'
