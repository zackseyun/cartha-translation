id: LUK.21.5
reference: Luke 21:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: ru
  text: 'Когда некоторые говорили о том, что храм[a] украшен прекрасными камнями и дарами, посвящёнными Богу[b], он сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово обозначает не только внутреннее святилище, но храм и его территорию в целом.
    reason: cultural_note
  - marker: b
    text: 'То есть дары, посвящённые Богу и выставленные в храме; также можно перевести: «посвятительными приношениями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: когда некоторые говорили
  rationale: Родительный самостоятельный оборот передан естественным русским придаточным времени; несовершенный вид «говорили» сохраняет длительность действия.
- source_word: τοῦ ἱεροῦ
  choice: храм
  rationale: Ἱερόν обозначает храм в широком смысле, включая весь храмовый комплекс; общеупотребительное «храм» звучит естественно, а точный объём значения пояснён в сноске.
- source_word: λίθοις καλοῖς
  choice: прекрасными камнями
  rationale: Передаёт положительную оценку καλοῖς и подчёркивает впечатляющий вид камней без усиления смысла.
- source_word: ἀναθήμασιν
  choice: дарами, посвящёнными Богу
  rationale: Описательный перевод ясно передаёт культовое значение даров, посвящённых Богу и находившихся при храме; он понятнее современному читателю, чем специальное «вотивные приношения».
- source_word: κεκόσμηται
  choice: украшен
  rationale: 'Краткое страдательное причастие естественно передаёт результирующее состояние, выраженное перфектом: храм был украшен и оставался таким.'
- source_word: εἶπεν
  choice: он сказал
  rationale: Сохранён невыраженный явно субъект греческого глагола без добавления имени Иисуса; двоеточие соответствует переходу к прямой речи в следующем стихе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис перестроен в естественную конструкцию «говорили о том, что…», без добавления подразумеваемого восхищения. Строчная форма местоимения «он» соответствует обычной современной орфографии и не вводит конфессиональной практики почтительного написания.
