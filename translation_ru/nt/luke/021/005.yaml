  source_fidelity: Перевод точно передаёт генитивный абсолют («Когда некоторые говорили»), предмет разговора, совершенное страдательное состояние κεκόσμηται («украшен»), а также переход к последующей прямой речи («он сказал:»). «Дарами, посвящёнными Богу» является ясной и допустимой передачей ἀναθήμασιν; добавочного смыслового утверждения в основном тексте нет.
