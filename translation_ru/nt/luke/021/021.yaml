  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: ru
  text: Тогда те, кто будет в Иудее, пусть бегут в горы; те, кто будет в Иерусалиме[a], пусть выходят из него; а те, кто будет в окрестностях, пусть не входят в него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте местоимения в выражениях «в её середине» и «в неё» стоят в женском роде. По контексту они относятся к Иерусалиму; в русском местоимение согласуется с названием города мужского рода.
    reason: Уточнение референта и грамматического различия между греческим и русским текстом без неверного указания, будто первое местоимение означает «из неё».
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Кратко и естественно обозначает временную последовательность по отношению к предшествующему знамению.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: те, кто будет в Иудее
  rationale: Передаёт людей, находящихся в Иудее в описываемый момент; будущее время естественно для русского контекста предсказания.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: пусть бегут в горы
  rationale: Сохраняет настоятельную силу повелительного наклонения и прямое указание направления.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: те, кто будет в Иерусалиме
  rationale: Местоимение по ближайшему контексту относится к Иерусалиму. Явное название города делает фразу понятной по-русски, не меняя референта.
- source_word: ἐκχωρείτωσαν
  choice: пусть выходят
  rationale: Глагол означает уход или удаление из места; «выходят» естественно выражает требование покинуть город.
- source_word: οἱ ἐν ταῖς χώραις
  choice: те, кто будет в окрестностях
  rationale: χῶραι здесь обозначает местность вне города; «в окрестностях» естественно передаёт этот контраст, не сужая смысл до возделанных полей.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: пусть не входят в него
  rationale: Сохраняет запретительную силу повелительного наклонения; местоимение относится к Иерусалиму и в русском согласуется с названием города в мужском роде.
theological_decisions:
- issue: Референт αὐτῆς / αὐτήν и грамматический род местоимений
  choice: Передать референт как Иерусалим и употребить русское местоимение мужского рода «него»
  alternative: 'Сохранить женское олицетворение: «из неё… в неё»; либо понять местоимения как относящиеся к Иудее'
  rationale: Непосредственный контекст (Лк 21:20) называет Иерусалим, и именно город логично покидают и в него не входят. В греческом женский род допускает олицетворение города, тогда как по-русски название «Иерусалим» требует мужского согласования. Примечание сохраняет сведения о форме оригинала и не превращает грамматический род в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык; торжественность и настоятельность речи сохранены без архаизмов. Параллельное построение трёх повелений передано повтором «те, кто будет… пусть…».
