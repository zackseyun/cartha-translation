id: LUK.21.20
reference: Luke 21:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: ru
  text: 'Но когда увидите Иерусалим, окружённый войсками[a], тогда знайте: приблизилось его запустение[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военными лагерями». Греческое слово может обозначать лагеря либо расположившиеся лагерем войска; здесь имеются в виду силы, осаждающие Иерусалим.'
    reason: lexical_alternative
  - marker: b
    text: Слово «запустение» перекликается с пророческим языком суда; ср. сходные выражения в Мф. 24:15 и Мк. 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ ἴδητε
  choice: Но когда увидите
  rationale: Передаёт будущую ситуацию с условно-временным оттенком; δὲ обозначает мягкий переход или противопоставление.
- source_word: κυκλουμένην
  choice: окружённый
  rationale: Естественно передаёт настоящее страдательное причастие и состояние осаждаемого города.
- source_word: ὑπὸ στρατοπέδων
  choice: войсками
  rationale: στρατόπεδον может означать военный лагерь или расположившееся лагерем войско; в данном контексте речь идёт о силах, осаждающих город.
- source_word: τότε γνῶτε
  choice: тогда знайте
  rationale: Сохраняет временную последовательность и повелительную силу аориста γνῶτε.
- source_word: ἤγγικεν
  choice: приблизилось
  rationale: 'Передаёт перфект как наступившее состояние: запустение уже стало близким.'
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: его запустение
  rationale: «Запустение» сохраняет пророческую лексику опустошения и суда; местоимение «его» согласуется в русском с названием города Иерусалима.
theological_decisions:
- issue: Характер грядущего суда над Иерусалимом
  choice: «запустение» без уточнения эсхатологической схемы
  alternative: «разрушение» или прямая привязка в основном тексте к «мерзости запустения»
  rationale: Стих говорит о приближении запустения Иерусалима при его окружении войсками. Выбранная формулировка сохраняет пророческий вес слова, не вводя толкование, которого сам стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и сдержанно торжественная. Сохранены повелительное «знайте» и пророчески значимое «запустение».
