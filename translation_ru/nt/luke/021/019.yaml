    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: стойкостью
  rationale: Ὑπομονή обозначает стойкое, терпеливое постоянство перед лицом испытаний. «Стойкость» естественно звучит по-русски и хорошо соответствует контексту гонений.
- source_word: κτήσασθε
  choice: обретите
  rationale: В тексте SBLGNT стоит аористный императив среднего залога. «Обретите» передаёт повелительную форму и значение достижения или приобретения, не сводя его заранее к простому физическому выживанию.
- source_word: ψυχὰς
  choice: свою жизнь
  rationale: В данном контексте ψυχή может означать жизнь, самого человека или душу. Русское распределительное единственное число «свою жизнь» естественнее буквального «свои жизни» и сохраняет целостный смысл слова.
- source_word: ἐν
  choice: стойкостью
  rationale: Предлог ἐν с дательным здесь естественно понимать как указание на средство. Русский творительный падеж кратко и ясно передаёт значение «посредством стойкости».
theological_decisions:
- issue: Значение ψυχή в эсхатологическом контексте гонений
  choice: целостное «жизнь»
  alternative: «душа» или «самих себя»
  rationale: «Жизнь» сохраняет широкий смысл ψυχή и не навязывает узкого противопоставления тела и нематериальной души. При этом обещание не истолковывается как гарантия избавления от физической смерти, поскольку ближайший контекст допускает мученичество.
- issue: Повелительная или будущая форма κτάομαι
  choice: повелительное «обретите» по основному тексту SBLGNT
  alternative: будущее «обретёте» по другому чтению
  rationale: Основной текст SBLGNT содержит κτήσασθε, форму императива. Вариант с будущим временем имеет весомую рукописную поддержку и отражён в примечании, но не подменяет исходный текст издания.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой. Творительный «стойкостью» передаёт инструментальное значение ἐν; местоимение «своей» соотнесено с подразумеваемым множественным адресатом, а распределительное «свою жизнь» избегает неестественного русского «свои жизни».
