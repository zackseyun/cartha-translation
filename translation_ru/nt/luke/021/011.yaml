source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: ru
  text: Будут сильные землетрясения, а в разных местах — голод и эпидемии. Будут также явления, наводящие ужас, и великие знамения с неба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с небес». Греческое слово οὐρανός может обозначать как видимое небо, так и небеса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί τε μεγάλοι
  choice: сильные землетрясения
  rationale: σεισμοί обычно означает буквальные землетрясения; μεγάλοι здесь естественно передаёт их большую силу или тяжесть. По-русски «сильные землетрясения» точнее и естественнее, чем буквальное «великие».
- source_word: κατὰ τόπους
  choice: в разных местах
  rationale: Оборот указывает на распределённость событий по разным местностям; выбран естественный современный эквивалент.
- source_word: λιμοὶ
  choice: голод
  rationale: Греческое множественное число обозначает случаи голода в разных местах; в современном русском при перечислении бедствий собирательное «голод» звучит естественно и не ослабляет смысла.
- source_word: λοιμοὶ
  choice: эпидемии
  rationale: Слово обозначает эпидемические болезни, мор или поветрия. «Эпидемии» ясно и современно передаёт смысл без архаизма.
- source_word: φόβητρα
  choice: явления, наводящие ужас
  rationale: Редкое существительное во множественном числе обозначает то, что вызывает страх. Описательный перевод сохраняет предметный смысл и звучит естественнее, чем отвлечённые «ужасы».
- source_word: σημεῖα
  choice: знамения
  rationale: В апокалиптическом контексте «знамения» передаёт не просто распознаваемые знаки, а значимые необычные явления, не уточняя их природу.
- source_word: ἀπ’ οὐρανοῦ
  choice: с неба
  rationale: οὐρανός может означать как небо в видимом, пространственном смысле, так и небеса в богословском смысле. В сочетании с наблюдаемыми знамениями «с неба» естественно по-русски, при этом неоднозначность отмечена в сноске.
- source_word: μεγάλα
  choice: великие
  rationale: Сочетание «великие знамения» сохраняет силу прилагательного и уместный возвышенный библейский регистр.
- source_word: ἔσονται / ἔσται
  choice: будут
  rationale: Экзистенциальное «будут» прямо и естественно передаёт обе формы будущего времени εἰμί.
theological_decisions:
- issue: Значение οὐρανός в апокалиптическом контексте
  choice: с неба
  alternative: с небес
  rationale: Контекст допускает видимые небесные явления и богословский оттенок их небесного происхождения. Основной текст использует наиболее естественное русское выражение, а сноска сохраняет альтернативу, не определяя заранее природу знамений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Два греческих предложения сохранены как две ритмически связанные фразы; тире помогает естественно оформить распределительное «в разных местах».
