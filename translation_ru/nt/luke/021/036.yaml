  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: ru
  text: Но бодрствуйте во всякое время и молитесь, чтобы у вас хватило сил избежать всего того, чему предстоит произойти,[a][b] и предстать перед Сыном Человеческим.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «чтобы вы удостоились избежать всего того…» — вместо: «чтобы у вас хватило сил избежать всего того…».'
    reason: textual_variant
  - marker: b
    text: 'Или: «всего того, что должно произойти».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «предстать перед Сыном Человеческим» может подразумевать, что человек будет принят или оправдан перед Ним, но в греческом тексте это прямо не сказано.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: бодрствуйте
  rationale: Естественный для современного литературного русского языка повелительный призыв сохранять духовную бдительность; сохраняет образ бодрствования.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкое противопоставление предшествующим предостережениям.
- source_word: ἐν παντὶ καιρῷ
  choice: во всякое время
  rationale: Передаёт распределительное значение выражения и постоянный характер призыва, сохраняя достоинство библейского регистра.
- source_word: δεόμενοι
  choice: молитесь
  rationale: В контексте означает молитвенно просить; личная форма естественно сочетается с предшествующим повелением и не утрачивает значения греческого причастия.
- source_word: ἵνα κατισχύσητε
  choice: чтобы у вас хватило сил
  rationale: κατισχύω означает оказаться достаточно сильным, суметь или превозмочь; эта передача естественно связывается с последующим инфинитивом и не смешивает основной текст с вариантом «удостоиться».
- source_word: ἐκφυγεῖν
  choice: избежать
  rationale: Точно и естественно передаёт успешное избавление от грядущих событий; здесь уместнее, чем буквальное «убежать от».
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: всего того, чему предстоит произойти
  rationale: Передаёт и будущность, и возможный оттенок близости μέλλω, не усиливая категорически идею предопределённости.
- source_word: σταθῆναι
  choice: предстать
  rationale: В сочетании с ἔμπροσθεν естественно передаёт положение человека перед Сыном Человеческим; не добавляет явно ни оправдания, ни осуждения.
- source_word: ἔμπροσθεν
  choice: перед
  rationale: Прямой и естественный русский эквивалент пространственно-судебного отношения.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сыном Человеческим
  rationale: Устоявшаяся передача титула, сохраняющая его евангельское и ветхозаветное звучание.
theological_decisions:
- issue: Значение κατισχύσητε в связи с эсхатологическим испытанием
  choice: «чтобы у вас хватило сил»
  alternative: «чтобы вы удостоились»
  rationale: В SBLGNT стоит κατισχύσητε, выражающее силу или способность преодолеть, тогда как «удостоились» отражает значимый текстовый вариант. Вариант вынесен в сноску.
- issue: Смысл σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: «предстать перед Сыном Человеческим» без пояснения результата
  alternative: «предстать оправданными перед Сыном Человеческим»; «устоять перед Сыном Человеческим»
  rationale: Фраза может подразумевать принятие или оправдание на суде, однако греческий текст не выражает этого прямо. Основной текст сохраняет смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Бодрствуйте» и «Сын Человеческий» сохраняют узнаваемую библейскую образность; синтаксис упрощён до естественной русской координации повелений. Все смысловые и текстовые альтернативы, способные повлиять на толкование, вынесены в сноски.
