lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Союз продолжает повествование без добавления временного оттенка.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: Он рассказал им притчу
  rationale: По-русски сочетание «рассказал притчу» естественно передаёт конструкцию со значением речи и прямым дополнением, сохраняя адресатов «им».
- source_word: Ἴδετε
  choice: Посмотрите на
  rationale: Императив призывает направить внимание на наглядный пример; «посмотрите на» звучит естественно и точно.
- source_word: τὴν συκῆν
  choice: смоковницу
  rationale: Слово обозначает фиговое дерево; «смоковница» — точный, общеупотребительный в библейском контексте русский эквивалент.
- source_word: πάντα τὰ δένδρα
  choice: все деревья
  rationale: Передаёт все элементы греческой фразы без добавления отсутствующего в оригинале слова «остальные».
