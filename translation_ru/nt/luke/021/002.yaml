lexical_decisions:
- source_word: εἶδεν
  choice: увидел
  rationale: Прямо передаёт аорист ὁράω и сохраняет простое повествовательное движение.
- source_word: δέ
  choice: и
  rationale: Здесь δέ служит мягкой повествовательной связкой; «и» не усиливает контраст.
- source_word: τινα
  choice: одну
  rationale: Передаёт неопределённость лица естественным для русского языка способом, без тяжеловесного «некую».
- source_word: χήραν πενιχρὰν
  choice: бедную вдову
  rationale: χήρα означает «вдова», а πενιχρά указывает на скудость средств; «бедная» точно и естественно, тогда как «нищая» могло бы чрезмерно усилить смысл.
- source_word: βάλλουσαν
  choice: которая клала
  rationale: В контексте внесения денег βάλλω естественно передаётся глаголом «класть», без буквального и менее уместного «бросать».
- source_word: ἐκεῖ
  choice: туда
  rationale: Место уже определено предшествующим контекстом; при глаголе движения русское «туда» естественнее буквального «там».
- source_word: λεπτὰ δύο
  choice: две лепты
  rationale: Сохраняет историческое название монет; сноска поясняет их размер, материал и малую ценность, не перегружая основной текст.
