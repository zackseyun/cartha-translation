id: LUK.21.15
reference: Luke 21:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: ru
  text: Ведь Я дам вам слова и мудрость, которым не смогут противостоять или возразить все ваши противники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: слова
  rationale: Буквально «уста», но в данном контексте это метонимия дара говорить; «слова» естественно передаёт смысл по-русски и соответствует консультационному слою.
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямой и устойчивый эквивалент, сохраняющий отличие мудрости от самих слов.
- source_word: ἀντιστῆναι
  choice: противостоять
  rationale: Передаёт идею успешного сопротивления доводам учеников, не сужая значение до одного лишь словесного спора.
- source_word: ἀντειπεῖν
  choice: возразить
  rationale: Точно передаёт словесное противодействие и сохраняет смысловое различие с «противостоять».
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: ваши противники
  rationale: Естественная русская передача субстантивированного причастия со значением тех, кто выступает против учеников.
theological_decisions:
- issue: Объект двух инфинитивов и относительное местоимение ᾗ
  choice: «словам и мудрости, которым не смогут противостоять или возразить»
  alternative: «так что все ваши противники не смогут ни противостоять вам, ни возразить»
  rationale: Сохраняется грамматическая связь относительного местоимения с дарованными словами и мудростью, не добавляя отсутствующее в этой части фразы «вам».
- issue: Объём обещания
  choice: Неспособность противников успешно противостоять или возразить дарованной речи и мудрости
  alternative: Обещание отсутствия гонений либо неизменной физической безопасности
  rationale: Контекст стиха относится к свидетельству и ответу учеников; перевод не расширяет обещание за пределы сказанного.
translation_notes:
  register: Современный литературный русский язык; торжественность сохранена без архаизмов. Прописная «Я» указывает на говорящего Христа по принятой русской библейской норме. Конструкция с двумя инфинитивами сохраняет риторическую парность оригинала.
