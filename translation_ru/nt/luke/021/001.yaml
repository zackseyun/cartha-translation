  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: ru
  text: Подняв глаза, Иисус увидел богатых людей, которые клали свои дары[a] в сокровищницу[b].
  philosophy: optimal-equivalence
