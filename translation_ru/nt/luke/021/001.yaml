lexical_decisions:
- source_word: Ἀναβλέψας
  choice: Подняв глаза
  rationale: Передаёт конкретное движение взгляда вверх и естественно звучит в современном русском повествовании.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Слабый повествовательный связующий элемент; последовательность событий в русском языке ясно передаётся без отдельного «и» или «тогда».
- source_word: εἶδεν
  choice: увидел
  rationale: Прямо передаёт значение глагола восприятия, не добавляя оттенка намеренного наблюдения.
- source_word: τοὺς βάλλοντας
  choice: людей, которые клали
  rationale: Субстантивированное причастие раскрыто естественной русской придаточной конструкцией; «клали» уместнее буквального «бросали» в контексте пожертвований.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: в храмовую сокровищницу
  rationale: Термин связан с храмовым местом хранения пожертвований или установленными там приёмниками; «храмовую» делает культурный контекст понятным, не сводя значение только к ящику.
- source_word: τὰ δῶρα αὐτῶν
  choice: свои дары
  rationale: «Дары» сохраняет основное значение δῶρα, а возвратное «свои» естественно соотносит их с действующими лицами.
- source_word: πλουσίους
  choice: богатых людей
  rationale: Передаёт субстантивированное прилагательное ясно и без оттенка устойчивого классового обозначения.
theological_decisions:
- issue: Явное называние Иисуса как подлежащего
  choice: Иисус увидел
  alternative: он увидел
  rationale: В греческом подлежащее подразумевается и определяется предшествующим контекстом; имя устраняет возможную неясность отдельного стиха, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык, простой и достойный повествовательный стиль. Сохранена лексическая широта слова «дары», а неоднозначность γαζοφυλάκιον разъяснена в сноске.
