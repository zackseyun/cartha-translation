  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: ru
  text: Потому что это дни возмездия, чтобы исполнилось всё написанное.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предшествующего наставления; «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: ἡμέραι ἐκδικήσεως
  choice: дни возмездия
  rationale: Сохраняется образ «дней» и судебный смысл ἐκδίκησις — заслуженного воздаяния, без оттенка личной мстительности, который может иметь слово «месть».
- source_word: αὗταί εἰσιν
  choice: это
  rationale: В составе именного сказуемого естественное русское «это» передаёт указание на только что названные дни.
- source_word: τοῦ πλησθῆναι
  choice: когда исполнится
  rationale: Конструкция с τοῦ и инфинитивом допускает целевой и результативный оттенки. В русском придаточное с «когда» естественно связывает исполнение написанного с этими днями и не делает цель единственно возможным толкованием.
- source_word: πάντα τὰ γεγραμμένα
  choice: всё написанное
  rationale: Субстантивированное причастие передано кратко и естественно; формулировка не сужает референт до явно названного корпуса Писаний.
theological_decisions:
- issue: Характер ἐκδικήσεως в пророчестве Иисуса
  choice: «возмездия» — судебного воздаяния
  alternative: «мести»; «воздаяния»; «наказания»
  rationale: «Возмездие» сохраняет строгость судебного смысла и связь с исполнением написанного, но меньше, чем «месть», предполагает человеческую злопамятность.
- issue: Смысл τοῦ с инфинитивом
  choice: Не разграничивать жёстко цель и результат; передать временно-результативной связью «когда исполнится»
  alternative: «чтобы исполнилось»; «для исполнения»
  rationale: Греческая конструкция способна выражать цель или результат. Основной текст сохраняет связь событий с исполнением написанного, а примечание указывает более явно целевую передачу.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской торжественности. «Дни возмездия» звучит весомо и понятно; порядок слов остаётся естественным для русского текста.
