base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: ru
  text: 'А о том, на что вы смотрите: придут дни, когда не останется камня на камне — всё будет разрушено.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет оставлен камень на камне, который не будет разрушен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: А о том, на что вы смотрите
  rationale: Начальное Ταῦτα имеет тематическое выделение, а θεωρεῖτε обозначает внимательное зрительное восприятие и может передаваться как «смотрите». Формулировка естественна по-русски и сохраняет направленность внимания на видимые храмовые сооружения из контекста.
- source_word: ἐλεύσονται ἡμέραι
  choice: придут дни
  rationale: Сохранён обычный греческий оборот о наступлении будущего времени без добавления определённого артикля, которого в исходном тексте нет.
- source_word: ἐν αἷς
  choice: когда
  rationale: Относительное выражение имеет временное значение; «когда» звучит в современном русском естественнее буквального «в которые».
- source_word: οὐκ ἀφεθήσεται
  choice: не останется
  rationale: Пассивная форма ἀφίημι в данном контексте означает, что ничего не будет оставлено или не сохранится; русское «не останется» ясно передаёт результат разрушения.
- source_word: λίθος ἐπὶ λίθῳ
  choice: камня на камне
  rationale: Устойчивый русский оборот точно соответствует греческому образу полного разрушения.
- source_word: ὃς οὐ καταλυθήσεται
  choice: всё будет разрушено
  rationale: 'Греческое относительное предложение буквально относится к каждому камню: не останется такого, который не будет разрушен. Перестройка устраняет тяжеловесное двойное отрицание и сохраняет значение всеохватности.'
theological_decisions:
- issue: Характер предсказания о храмовых сооружениях
  choice: Передать конкретное предсказание полного физического разрушения
  alternative: Истолковать слова преимущественно символически или связать их с определённой эсхатологической системой
  rationale: Текст прямо говорит о видимых предметах и разрушении камней. Перевод сохраняет конкретный смысл, не добавляя богословской схемы, которой в самом стихе нет.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Оборот «камня на камне» привычен и понятен широкому читателю; двоеточие и тире передают тематическое выделение и итоговую полноту разрушения.
