    rationale: Она звучит как утверждение о детях вообще и не вполне точно описывает лексическую альтернативу. Следует прямо указать, что форма может включать сестёр.
  revised_text: Но вас выдадут даже родители, братья[a], родственники и друзья, и некоторых из вас убьют.
