    issue: «Вас будут предавать» для παραδοθήσεσθε
    rationale: Русское «предавать» возможно в контексте близких людей, но недостаточно ясно выражает базовое значение παραδίδωμι — выдавать или передавать кому-либо; несовершенный вид также может неоправданно подразумевать длительность либо повторяемость. «Вас выдадут» точнее и идиоматичнее.
  - severity: low
