source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: ru
  text: Но вас выдадут даже родители, братья[a], родственники и друзья, и некоторых из вас убьют.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое существительное мужского рода во множественном числе иногда может включать сестёр.'
    reason: 'Лексическая альтернатива: ἀδελφῶν может относиться не только к братьям, но и к братьям и сёстрам.'
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: вас будут предавать
  rationale: Будущая пассивная форма передаёт действие, при котором учеников отдают в руки властей или противников. «Предавать» естественно для данного контекста близких отношений и сохраняет оттенок измены, не сводя значение только к эмоциональному предательству.
- source_word: δὲ
  choice: но
  rationale: Частица продолжает речь и отмечает умеренный контраст с предшествующим обещанием.
- source_word: καὶ
  choice: даже
  rationale: 'После δὲ частица имеет усилительный смысл: учеников будут выдавать не только посторонние, но даже самые близкие.'
- source_word: ὑπὸ
  choice: — подразумеваемый деятель при форме «будут предавать»
  rationale: В греческом ὑπό обозначает деятеля при пассивном глаголе. Русская неопределённо-личная конструкция позволяет естественно назвать деятелей без отдельного предлога «кем».
- source_word: γονέων
  choice: родители
  rationale: Обозначает отца и мать собирательно; «родители» — точное и современное соответствие.
- source_word: ἀδελφῶν
  choice: братья
  rationale: Мужской род множественного числа передан непосредственно; возможное включение сестёр отмечено в сноске.
- source_word: συγγενῶν
  choice: родственники
  rationale: Современное широкое обозначение людей того же рода или семьи.
- source_word: φίλων
  choice: друзья
  rationale: Прямое и естественное соответствие φίλοι.
- source_word: θανατώσουσιν
  choice: убьют
  rationale: Глагол означает причинить смерть. В данном русском предложении «убьют» звучит естественнее, чем более официальный оборот «предадут смерти», и не уточняет способ убийства.
- source_word: ἐξ ὑμῶν
  choice: некоторых из вас
  rationale: Идиома означает часть группы, а не всех адресатов.
theological_decisions:
- issue: Значение ἀδελφῶν в перечне родственников
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматически мужскую форму источника, а реальную возможность смешанной группы родных детей одной семьи указывает сноска, не разрешая неоднозначность молча.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Цепочка близких людей сохранена, а повтор союзов слегка упрощён в соответствии с естественным русским синтаксисом.
