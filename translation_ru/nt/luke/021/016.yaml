review_pass:
  verdict: revise
  source_fidelity: Греческое παραδοθήσεσθε — будущее страдательное «вас выдадут / передадут». В данном контексте «выдадут» точнее передаёт передачу в руки враждебных лиц или властей, чем «будут предавать», которое в русском прежде всего обозначает измену и к тому же создаёт ненужный оттенок повторяемости. Перечень лиц, усилительное «даже» и ἐξ ὑμῶν («некоторых из вас») сохранены.
  naturalness: '«Но вас выдадут даже родители, братья, родственники и друзья, и некоторых из вас убьют» — естественная, современная и сдержанная русская фраза. Будущее совершенного вида не предполагает, что это случится с каждым адресатом: последующее «некоторых из вас» ограничивает лишь второе действие, как и в греческом.'
  terminology: «Родители», «братья», «родственники», «друзья» — точные современные соответствия. Сноска к «братья» уместно сохраняет возможное более широкое референтное значение ἀδελφῶν, не заменяя мужскую форму основного текста нейтральным словом.
  issues:
