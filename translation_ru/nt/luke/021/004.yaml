base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: ru
  text: Ведь все они вносили пожертвования[a] из своего избытка, а она из своего недостатка[b] внесла всё, что имела на жизнь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дары»; в данном контексте имеются в виду пожертвования в храме.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из своей бедности»; также возможно: «из своей нужды».'
    reason: lexical_alternative
  - marker: c
    text: То есть все средства к существованию, а не всю жизнь в смысле её продолжительности.
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Ведь все они
  rationale: «Ведь» естественно передаёт пояснительное γάρ и сохраняет связь с предыдущим высказыванием; πάντες οὗτοι передано без лишнего расширения.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: от своего избытка
  rationale: Передаёт то, что у жертвователей было сверх необходимого, и создаёт ясный контраст с нуждой вдовы.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: клали в пожертвования
  rationale: Глагол сохраняет конкретный образ внесения денег, а «пожертвования» естественно обозначает храмовые дары в данном контексте, не уточняя сверх греческого текста место их внесения.
- source_word: αὕτη δὲ
  choice: а она
  rationale: Местоимение естественно отсылает к уже упомянутой вдове, а «а» выражает противопоставление.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: от своей нужды
  rationale: ὑστέρημα означает недостаток, нужду; формулировка сохраняет контраст с «избытком», не сводя значение исключительно к социальной категории бедности.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: всё, что имела на жизнь
  rationale: В денежном контексте βίος означает средства к существованию. Русская формулировка ясна современному читателю и не создаёт впечатления, будто речь идёт обо всей продолжительности её жизни.
- source_word: ἔβαλεν
  choice: положила
  rationale: Передаёт физическое действие внесения монет и сохраняет связь с тем же греческим глаголом в первой части стиха.
theological_decisions:
- issue: Значение βίος в даре вдовы
  choice: 'Материальные средства для жизни: «всё, что имела на жизнь»'
  alternative: «всю свою жизнь»; «все средства к существованию»
  rationale: Контекст денежных пожертвований и употребление βίος указывают на средства для существования, а не на жизнь как существование или её продолжительность.
- issue: Значение τὰ δῶρα
  choice: «пожертвования»
  alternative: «дары»; «храмовая сокровищница»
  rationale: В храмовом контексте «пожертвования» естественно передаёт пожертвованные дары. Перевод «сокровищница» добавил бы обозначение места, которого в данном стихе непосредственно нет.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным синтаксисом. Сохранены пояснительная связь с предыдущим стихом, контраст между избытком и нуждой и конкретный образ внесения денег. Терминология не привязана к конфессиональной традиции.
