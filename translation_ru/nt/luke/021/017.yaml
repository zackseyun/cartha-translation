  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: καὶ — «И», ἔσεσθε μισούμενοι — естественной русской пассивной по смыслу конструкцией «будут ненавидеть вас», ὑπὸ πάντων — «все», а διὰ τὸ ὄνομά μου — «из-за Моего имени». Неопределённо-личная конструкция не меняет субъектно-объектные отношения: враждебность исходит от «всех» и направлена на учеников.'
