  text: And you will be hated by all because of my name[a].
translation:
  language: ru
  text: И все будут ненавидеть вас из-за Моего имени[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за Меня». Выражение «Моё имя» может указывать на личность Иисуса, Его власть и исповедание верности Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: будут ненавидеть вас
  rationale: Сочетание будущей формы εἰμί с пассивным причастием естественно передаётся по-русски неопределённо-личной конструкцией будущего времени; она сохраняет значение пассива и избегает тяжеловесного «вы будете ненавидимы».
- source_word: ὑπὸ πάντων
  choice: все
  rationale: 'Ὑπό с родительным обозначает деятеля, а πάντων — всеобщность. В неопределённо-личной русской конструкции деятель естественно ставится в именительном падеже: «все будут ненавидеть вас».'
- source_word: διὰ
  choice: из-за
  rationale: Διά с винительным выражает причину. «Из-за» ясно и естественно передаёт причинное значение в современном русском языке.
- source_word: τὸ ὄνομά μου
  choice: Моего имени
  rationale: Буквальное выражение сохраняет многозначность слова «имя», способного указывать на личность Иисуса, Его власть и открытое исповедание верности Ему.
theological_decisions:
- issue: Значение выражения «Моего имени» в контексте гонений на учеников
  choice: Сохранено буквальное «из-за Моего имени»
  alternative: «из-за Меня»; «за то, что вы принадлежите Мне»
  rationale: Греческий текст прямо говорит «из-за Моего имени». Буквальная передача сохраняет характерную для Луки — Деяний смысловую полноту имени как указания на личность, власть и исповедание Иисуса, не сужая выражение до одного толкования.
translation_notes:
  register: Современный литературный русский язык. Неопределённо-личная конструкция «все будут ненавидеть вас» звучит естественнее формально-пассивного «вы будете ненавидимы всеми», сохраняя смысл исходного текста. Прописная буква в «Моего» соответствует традиционному уважительному оформлению местоимений, относящихся к Иисусу.
