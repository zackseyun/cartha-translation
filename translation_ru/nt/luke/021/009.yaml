id: LUK.21.9
reference: Luke 21:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: ru
  text: Но когда услышите о войнах и беспорядках[a], не ужасайтесь, ибо всё это должно произойти прежде, но конец не наступит сразу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «волнениях», «потрясениях» или «смутах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но конец наступит не сразу». Буквально: «но не сразу конец».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Но когда
  rationale: ὅταν вводит неопределённо-временное придаточное о будущем, а δέ мягко развивает и противопоставляет мысль предшествующему предостережению.
- source_word: ἀκούσητε
  choice: услышите о
  rationale: В сочетании с сообщениями о событиях русское «услышите о» естественно передаёт смысл глагола.
- source_word: πολέμους
  choice: войнах
  rationale: Прямое соответствие множественному числу πόλεμος — вооружённые конфликты.
- source_word: ἀκαταστασίας
  choice: смутах
  rationale: Слово обозначает беспорядки, волнения и общественную нестабильность; «смуты» достаточно широко и ёмко передаёт этот спектр.
- source_word: μὴ πτοηθῆτε
  choice: не ужасайтесь
  rationale: Передаёт сильный испуг и состояние паники, выраженные πτοέω, сохраняя форму запрета.
- source_word: δεῖ γὰρ
  choice: потому что ... должно
  rationale: δεῖ выражает необходимость, а γάρ объясняет предшествующий призыв не страшиться.
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: всё это должно произойти прежде
  rationale: Передаёт наступление событий и их временное предшествование концу; «прежде» естественно связывает фразу с последующим противопоставлением.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: но конец не наступит сразу
  rationale: В безглагольной греческой фразе подразумевается наступление конца; явный глагол необходим для ясного современного русского и сохраняет временной смысл εὐθέως.
theological_decisions:
- issue: Время наступления конца
  choice: Войны и смуты должны произойти прежде, однако конец не наступит сразу.
  alternative: Эти события относятся к периоду перед концом, но сами по себе не означают его немедленного наступления.
  rationale: Перевод сохраняет предостережение против отождествления общественных потрясений с немедленным концом, не вводя определённой эсхатологической системы.
translation_notes:
  register: Современный литературный русский, понятный широкому кругу читателей. «Смуты» употреблено во множественном числе в общем, не как название конкретного исторического периода; «не ужасайтесь» сохраняет сильную эмоциональную окраску оригинала.
