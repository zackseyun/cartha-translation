  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: ru
  text: люди будут падать в обморок от страха и ожидания того, что надвигается на обитаемый мир[a], ибо силы небес[b] будут поколеблены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «мир» или «землю»; буквально: «обитаемый мир».'
    reason: lexical_alternative
  - marker: b
    text: Или «небесные силы» или «силы неба». Выражение может в широком смысле обозначать космические или небесные силы.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων
  choice: будут падать в обморок
  rationale: Причастие передаёт утрату сил или сознания под воздействием ужаса. «Будут падать в обморок» естественно для современного русского языка и сохраняет телесно-психологическую выразительность, не прибегая к устаревшему «издыхать».
- source_word: ἀνθρώπων
  choice: люди
  rationale: Форма имеет обобщённое значение и относится к людям вообще, а не только к мужчинам.
- source_word: ἀπὸ φόβου
  choice: от страха
  rationale: Предлог ἀπό с родительным падежом указывает здесь на причину; «от страха» точно и идиоматично.
- source_word: προσδοκίας
  choice: ожидания
  rationale: Слово обозначает ожидание предстоящего. Зловещий характер ожидания ясен из контекста, поэтому значение не сужено до «предчувствия беды».
- source_word: τῶν ἐπερχομένων
  choice: того, что надвигается
  rationale: Субстантивированное причастие обозначает грядущие события. Единственная в русском придаточная конструкция естественна, а глагол «надвигается» передаёт угрожающий контекст без добавления конкретных событий.
- source_word: τῇ οἰκουμένῃ
  choice: на населённый мир
  rationale: οἰκουμένη обозначает обитаемый людьми мир. «Населённый мир» сохраняет этот оттенок и не создаёт современного значения «вселенная».
- source_word: αἱ ... δυνάμεις τῶν οὐρανῶν
  choice: силы небес
  rationale: Близкая к греческому выражению формулировка сохраняет возможность понимать её широко — как космические или небесные силы — и не сводит смысл только к светилам либо духовным существам.
- source_word: σαλευθήσονται
  choice: поколеблются
  rationale: Будущее страдательное значение передано традиционным и понятным глаголом, сохраняющим образ космического потрясения.
theological_decisions:
- issue: Значение выражения «силы небес» в апокалиптическом контексте
  choice: Сохранить неоднозначное космическое выражение «силы небес».
  alternative: «небесные светила» или «небесные духовные силы»
  rationale: Греческое выражение может вызывать представление о космическом порядке, небесных светилах или небесных силах. Перевод не ограничивает его одним толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан естественным для чтения вслух; архаизмы вроде «издыхать» и двусмысленное в современном языке «вселенная» не использованы.
