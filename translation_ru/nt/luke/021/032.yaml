  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: ru
  text: 'Истинно говорю вам: это поколение[a] ни в коем случае не пройдёт, пока всё[b] не произойдёт[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «этот народ» или «этот век»; греческое слово допускает разные понимания, хотя «поколение» — наиболее прямая передача.'
    reason: alternative_reading
  - marker: b
    text: 'В некоторых переводах: «всё это», с добавлением указательного слова из контекста; в греческом тексте здесь сказано просто «всё».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «случится», «совершится».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: Передаёт торжественное и авторитетное подтверждение естественным для литературного русского языка библейским оборотом.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямая и естественная передача устойчивой формулы речи без ненужного перефразирования.
- source_word: οὐ μὴ παρέλθῃ
  choice: ни в коем случае не пройдёт
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание; выбранная формулировка сохраняет эту категоричность.
- source_word: ἡ γενεὰ αὕτη
  choice: это поколение
  rationale: Наиболее прямое значение γενεά в данном контексте. Спорный вопрос о том, кого именно обозначает выражение, в основном тексте не разрешается.
- source_word: ἕως ἂν
  choice: пока … не
  rationale: Естественная русская временная конструкция, обозначающая предел действия главного высказывания.
- source_word: πάντα
  choice: всё
  rationale: Точно передаёт субстантивированное нейтральное множественное число без добавления отсутствующего в греческом указательного слова «это».
- source_word: γένηται
  choice: произойдёт
  rationale: Передаёт значение наступления событий и не вносит более узкого богословского оттенка «исполнится».
theological_decisions:
- issue: Значение выражения «это поколение» в эсхатологическом изречении
  choice: Сохранить прямую передачу «это поколение», не уточняя его референт.
  alternative: «этот народ», «этот век» либо истолковательное «поколение, которое увидит эти события»
  rationale: Само греческое выражение лексически передано ясно, однако его конкретный референт остаётся предметом споров. Перевод сохраняет присущую тексту богословскую напряжённость и не закрепляет одно толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксис остаётся ясным для широкого читателя; усиленное отрицание сохранено без архаизмов, а спорные эсхатологические толкования вынесены в примечание.
