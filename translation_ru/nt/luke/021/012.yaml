  source_fidelity: 'Основной смысл передан верно: речь идёт о действиях, предшествующих описанным событиям, о враждебном захвате, гонениях, выдаче, доставлении к властям и причине — имени Иисуса. Однако «прежде всего этого» в современном русском обычно означает «главнее всего этого», а не временное «прежде, чем всё это произойдёт». Конструкцию с «передавая в синагоги и тюрьмы» также следует сделать грамматически полной и естественной.'
