  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: ru
  text: Но прежде чем всё это произойдёт, вас схватят[a] и будут преследовать, будут отдавать вас в синагоги и тюрьмы и водить к царям и правителям из-за Моего имени[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возложат на вас свои руки» — греческая идиома, обозначающая враждебный захват, задержание или насилие.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод: «ради Моего имени» или, с пояснением смысла, «из-за Меня». Выражение «Моё имя» связывает имя Иисуса с Его личностью и властью.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Но прежде всего этого
  rationale: Предлог πρό с родительным падежом выражает временное предшествование; δέ передаёт переход с оттенком противопоставления, а πάντων сохраняется словом «всего».
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: вас схватят[a]
  rationale: Греческое выражение буквально говорит о возложении рук, но в данном контексте является идиомой враждебного задержания или насилия. «Вас схватят» естественно и недвусмысленно передаёт смысл; буквальный образ сохранён в сноске.
- source_word: διώξουσιν
  choice: будут преследовать
  rationale: В контексте враждебных действий против учеников глагол обозначает гонение и преследование, а не нейтральную погоню.
- source_word: παραδιδόντες
  choice: передавая
  rationale: Причастие описывает способ преследования и сохраняет оттенок выдачи во власть враждебных учреждений.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: в синагоги и тюрьмы
  rationale: Сохранены названия учреждений без поясняющего расширения до «судов при синагогах»; εἰς передано естественной русской конструкцией движения «в».
- source_word: ἀπαγομένους
  choice: отводя
  rationale: Страдательное причастие относится к ученикам, которых уводят или доставляют к властям. В русской фразе деепричастная конструкция с подразумеваемым субъектом гонителей естественно продолжает ряд их действий.
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: к царям и правителям
  rationale: В сочетании с глаголом движения ἐπί указывает на доставление к властителям, фактически для разбирательства перед ними. «К» сохраняет движение, не делая судебную функцию более явной, чем в исходном тексте.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: из-за Моего имени[b]
  rationale: ἕνεκεν выражает причину или основание. Формулировка сохраняет библейское понятие имени Иисуса, не сводя его прямо к пояснению «из-за Меня».
theological_decisions:
- issue: Значение выражения «Моё имя» в контексте гонений
  choice: Сохранить выражение «из-за Моего имени»
  alternative: «из-за Меня» или «за то, что вы принадлежите Мне»
  rationale: «Имя» в библейском употреблении связано с личностью, властью и исповеданием Иисуса. Сохранение исходного выражения удерживает эту богословскую насыщенность и не ограничивает смысл одним толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохранён как последовательность враждебных действий, но буквальная идиома о руках вынесена в сноску, поскольку по-русски «наложить руки» легко воспринимается как церковное рукоположение или звучит архаично. Местоимение «Моего» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией.
