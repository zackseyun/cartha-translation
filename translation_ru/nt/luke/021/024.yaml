id: LUK.21.24
reference: Luke 21:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: ru
  text: И падут они от острия меча, и будут уведены в плен ко всем народам[a]. Иерусалим будут попирать народы[b], пока не исполнятся времена народов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди всех народов»; возможна также передача: «среди всех язычников». Греческое ἔθνη может означать как «народы», так и «язычников».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иерусалим будут попирать язычники».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «пока не исполнятся времена язычников».'
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: падут
  rationale: Будущее время от πίπτω в контексте войны; «падут» естественно передаёт гибель от оружия, не устраняя образ исходного текста.
- source_word: στόματι μαχαίρης
  choice: от острия меча
  rationale: Буквально «устами меча»; русское выражение «от острия меча» сохраняет конкретный образ и передаёт орудие гибели без неестественного буквализма.
- source_word: αἰχμαλωτισθήσονται
  choice: будут уведены в плен
  rationale: Будущая пассивная форма передаёт как пленение, так и последующее насильственное перемещение пленников.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: ко всем народам
  rationale: εἰς с винительным выражает направленность движения; «ко всем народам» естественно по-русски передаёт рассеяние среди народов, сохраняя повтор ключевого слова ἔθνη.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: πατουμένη
  choice: будут попирать
  rationale: Перифрастическая конструкция ἔσται πατουμένη обозначает продолжающееся положение в будущем; русский несовершенный вид сохраняет длительность и образ унижения и подчинения.
- source_word: ὑπὸ ἐθνῶν
  choice: народы
  rationale: Активная русская конструкция естественнее пассивной «будет попираем народами» и сохраняет значение ἔθνη, а также лексическую связь с другими употреблениями слова в стихе.
- source_word: ἄχρι οὗ
  choice: пока не
  rationale: Естественная русская временная конструкция, обозначающая предел продолжающегося действия.
- source_word: πληρωθῶσιν
  choice: не исполнятся
  rationale: «Исполнятся» сохраняет смысл достижения назначенной полноты или завершения, не уточняя искусственно, кем определён этот срок.
- source_word: καιροὶ ἐθνῶν
  choice: времена народов
  rationale: «Времена» передаёт значимые или назначенные периоды и сохраняет неоднозначность родительного оборота, не навязывая конкретную эсхатологическую схему.
theological_decisions:
- issue: Передача ἔθνη в трёх местах стиха
  choice: народы
  alternative: язычники
  rationale: Единая передача словом «народы» сохраняет лексическую связность и не решает заранее, идёт ли речь преимущественно о политических народах или о неиудеях. Традиционное и контекстуально возможное «язычники» указано в сносках.
- issue: Смысл выражения καιροὶ ἐθνῶν
  choice: времена народов исполнятся
  alternative: времена язычников завершатся
  rationale: Основной вариант сохраняет пассивно-эсхатологическую окраску πληρόω и неопределённость связи времён с народами, не привязывая слова к определённой системе толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Падут» и «острие меча» сохраняют образность без архаизмов; активное «Иерусалим будут попирать народы» звучит естественнее тяжёлой пассивной конструкции. Все три употребления ἔθνη в основном тексте последовательно переданы словом «народы».
