revisions:
- from: 'Он сказал: «Смотрите, чтобы вас не ввели в заблуждение. Ведь многие придут под Моим именем и будут говорить: „Это Я“[a] и „Время приблизилось“. Не идите за ними».'
  to: 'Он сказал: «Смотрите, чтобы вас не ввели в заблуждение. Ведь многие придут от Моего имени и будут говорить: „Это я“[a] и „Время приблизилось“. Не идите за ними».'
  rationale: Исправлено написание местоимения в словах самозванцев, чтобы не создавать богословской маркировки их ложного заявления. Примечание сделано нейтральнее и ближе к эллиптичности греческого текста. «От Моего имени» избрано как более естественный современный эквивалент χωρίς уточнения, выдают ли эти люди себя за Иисуса или выступают с притязанием на Его имя и полномочия.
