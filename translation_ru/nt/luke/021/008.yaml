  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: ru
  text: 'Он сказал: «Смотрите, чтобы вас не ввели в заблуждение. Ведь многие придут от Моего имени и будут говорить: „Это я“[a] и „Время приблизилось“. Не идите за ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я есть»; то есть человек выдаёт себя за того, кого ожидают, возможно за Мессию.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: Смотрите, чтобы вас не ввели в заблуждение
  rationale: Передаёт повеление быть настороже и страдательную форму πλανηθῆτε, не сводя смысл лишь к интеллектуальному обману.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: придут под Моим именем
  rationale: Оборот указывает на притязание на имя, полномочия или личность Иисуса; «под Моим именем» естественно передаёт такое самозваное выступление.
- source_word: Ἐγώ εἰμι
  choice: Это Я
  rationale: Сохраняет краткость и некоторую неоднозначность греческого самоотождествления, не добавляя прямо отсутствующее в тексте слово «Мессия».
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Время приблизилось
  rationale: «Время» передаёт καιρός как решающий срок, а «приблизилось» отражает перфект ἤγγικεν и его наличный результат.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Не идите за ними
  rationale: Сохраняет образ движения вслед за кем-либо и одновременно естественно выражает запрет следовать за обманщиками.
theological_decisions:
- issue: Самоотождествление Ἐγώ εἰμι в устах лжепретендентов
  choice: Это Я
  alternative: Я — Мессия; Я есмь
  rationale: Контекст предполагает притязание на ожидаемую личность, возможно Мессию, однако сказуемое в греческом не выражено. Перевод не конкретизирует его в основном тексте и сохраняет напряжение посредством примечания.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно торжественная. Заглавная буква в «Моим» следует принятому русскому библейскому оформлению обращения к Иисусу, без добавления в текст отсутствующих титулов.
