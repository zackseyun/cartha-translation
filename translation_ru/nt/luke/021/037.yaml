  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: ru
  text: Днём Он учил в храме[a], а по ночам выходил на гору, называемую Елеонской, и ночевал там[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает весь храмовый комплекс, включая дворы, а не только внутреннее святилище.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проводил ночь»; греческий глагол может также подразумевать ночлег под открытым небом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: Он учил
  rationale: Описательная конструкция с имперфектом выражает продолжавшееся и обычное действие; в сочетании с «днём» русское несовершенное прошедшее естественно передаёт повторяемость.
- source_word: τὰς ἡμέρας
  choice: днём
  rationale: Винительный времени обозначает период, в течение которого совершалось действие. «Днём» естественно передаёт обычное действие и сохраняет противопоставление ночи.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище; традиционное русское «в храме» понятно, а точный объём значения пояснён в сноске.
- source_word: τὰς δὲ νύκτας
  choice: а на ночь
  rationale: Фраза обозначает повторявшееся ночное пребывание и противопоставлена дневному учению; «а на ночь» также естественно сочетается с глаголом выхода.
- source_word: ἐξερχόμενος
  choice: выходил
  rationale: Причастие описывает сопутствующее повторявшееся действие. Личная глагольная форма естественна по-русски и подразумевает выход из города или храмовой местности без излишнего уточнения.
- source_word: ηὐλίζετο
  choice: оставался
  rationale: Глагол означает проводить ночь или располагаться на ночлег, возможно под открытым небом. «Оставался» в контексте «на ночь» звучит современно и не уточняет способ ночлега сверх текста.
- source_word: εἰς τὸ ὄρος
  choice: на горе
  rationale: Хотя εἰς обычно указывает направление, при глаголе ночлега оно подразумевает достигнутое место пребывания; русское «оставался на горе» передаёт этот смысл естественно.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: называемой Елеонской
  rationale: Ἐλαιῶν — родительный множественного числа со значением «олив/маслин». «Елеонская гора» — укоренившееся русское географическое название; конструкция сохраняет явное «называемой».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Симметрия «днём… а на ночь…» передаёт обычный распорядок. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской практике.
