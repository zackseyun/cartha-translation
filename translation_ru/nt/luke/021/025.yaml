  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: ru
  text: И будут знамения в солнце, луне и звёздах, а на земле народы будут охвачены смятением, не находя выхода, при шуме моря и волнении,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за шума моря и волнения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: знамения
  rationale: «Знамения» — естественный библейский эквивалент, обозначающий необычные явления, имеющие значение, но не уточняющий заранее, буквальны они или символичны.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: на солнце, луне и звёздах
  rationale: Предлог «на» естественно сочетается в русском со знамениями, наблюдаемыми в небесных светилах; отсутствие повторяющихся артиклей передано компактным перечислением.
- source_word: συνοχὴ ἐθνῶν
  choice: смятение народов
  rationale: «Смятение» передаёт состояние тяжёлой стеснённости и тревоги, охватывающее народы; родительная связь сохранена.
- source_word: ἐν ἀπορίᾳ
  choice: не знающих, что делать
  rationale: Описательный оборот ясно передаёт ἀπορία как беспомощность и отсутствие выхода, а не только интеллектуальное недоумение.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: из-за рёва моря и волнения
  rationale: '«Рёв моря» идиоматично передаёт грозный шум, а «волнение» сохраняет неопределённость σάλος: оно может относиться к бурному движению моря без добавления отсутствующего в греческом слова «волны».'
theological_decisions:
- issue: Характер космических знамений
  choice: Передать образы прямо, не определяя, являются ли они буквальными астрономическими событиями, символами или сочетают оба аспекта.
  alternative: Истолковать их непосредственно в переводе как исключительно буквальные либо исключительно символико-политические явления.
  rationale: Сам стих не разрешает этот эсхатологический вопрос, поэтому перевод сохраняет исходную богословскую напряжённость.
- issue: Связь смятения народов с шумом и волнением моря
  choice: 'Передать ἐν причинно-ситуативно: «из-за».'
  alternative: Более формальное «при рёве моря и волнении».
  rationale: Контекст допускает понимание шума и волнения моря как причины растерянности народов, однако буквальная конструкция менее определённа; это отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Тире делает сложную структуру прозрачнее; выражение «не знающих, что делать» доступно обычному читателю и передаёт беспомощность, заложенную в ἀπορία. Финальная запятая сохранена как указание на продолжение предложения в следующем стихе.
