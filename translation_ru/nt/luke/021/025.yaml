revisions:
- from: И будут знамения на солнце, луне и звёздах, а на земле — смятение народов, не знающих, что делать, из-за рёва моря и волнения,[a]
  to: И будут знамения в солнце, луне и звёздах, а на земле народы будут охвачены смятением, не находя выхода, при шуме моря и волнении,[a]
  rationale: Редакция делает локативное ἐν в небесных светилах явным, передаёт συνοχή как охватывающее народы бедственное смятение, а ἀπορία — как отсутствие выхода. «При» не закрепляет спорное причинное истолкование заключительной конструкции; оно сохранено как вариант в сноске. Финальная запятая оставлена, поскольку предложение продолжается в следующем стихе.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:40:42Z'
review_pass:
  verdict: revise
  source_fidelity: '«На солнце, луне и звёздах» допустимо по-русски, но греческое ἐν точнее и без лишней локативной конкретизации передаётся как «в солнце, луне и звёздах». Оборот «не знающих, что делать» верно передаёт ἀπορίᾳ, но грамматически несколько смещает акцент: в оригинале в состоянии бедственного смятения и растерянности находятся народы. «Из-за» выбирает причинное отношение там, где ἐν допускает также ситуативное «при».'
  naturalness: Предлагаемая редакция сохраняет современный литературный строй и апокалиптическую торжественность. «Охвачены смятением, не находя выхода» естественно выражает тяжёлое стеснённое состояние (συνοχή) и беспомощность (ἀπορία), не сводя последнее к простому интеллектуальному недоумению.
  terminology: «Знамения» уместно для σημεῖα. «Шум моря и волнение» не чрезмерно конкретизирует ἦχος и σάλος; «волнение» в сочетании с морем ясно относится к его бурному движению. Сноска фиксирует возможное причинное прочтение без навязывания его основному тексту.
  issues:
  - severity: medium
    issue: Причинное «из-за» для ἐν ἀπορίᾳ ἤχους θαλάσσης καὶ σάλου
    rationale: Такое понимание возможно, но сама конструкция может обозначать и обстоятельство, в котором народы пребывают в растерянности. Основной текст должен сохранить эту неопределённость; причинное прочтение лучше дать в сноске.
  - severity: low
    issue: «На солнце, луне и звёздах»
    rationale: Русское «на» возможно, однако «в солнце, луне и звёздах» ближе к ἐν и лучше сохраняет широкий характер знамений, не представляя их непременно как знаки на поверхности светил.
  - severity: low
    issue: «Смятение народов, не знающих, что делать»
    rationale: Смысл передан, но относительное определение несколько утяжеляет фразу и менее прямо отражает сочетание συνοχή и ἀπορία как состояний народов. Более компактная редакция сохраняет оба компонента.
  revised_text: И будут знамения в солнце, луне и звёздах, а на земле народы будут охвачены смятением, не находя выхода, при шуме моря и волнении,[a]
  revised_footnotes:
