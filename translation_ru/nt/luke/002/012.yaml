  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: «знак» (σημεῖον), будущее «вы найдёте» (εὑρήσετε), «младенца» (βρέφος), состояние «спелёнатого и лежащего» (ἐσπαργανωμένον καὶ κείμενον) и местонахождение «в яслях» (ἐν φάτνῃ). Эллиптическое «И вот вам знак» уместно передаёт конструкцию καὶ τοῦτο ὑμῖν τὸ σημεῖον, не навязывая оттенок чуда или доказательства.'
