  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: ru
  text: 'И вот вам знак: вы найдёте младенца, спелёнатого и лежащего в яслях[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в кормушке для скота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: знак
  rationale: Передаёт опознавательный знак, данный пастухам, не уточняя сверх текста, является ли он также чудесным подтверждением.
- source_word: εὑρήσετε
  choice: вы найдёте
  rationale: Прямо и естественно передаёт форму будущего времени второго лица множественного числа.
- source_word: βρέφος
  choice: младенца
  rationale: Точно обозначает совсем маленького ребёнка и соответствует современному литературному русскому регистру.
- source_word: ἐσπαργανωμένον
  choice: спелёнатого
  rationale: Ёмко и естественно обозначает младенца, обёрнутого пеленами; сохраняет конкретный образ исходного текста.
- source_word: κείμενον
  choice: лежащего
  rationale: Передаёт состояние и положение младенца, а не предшествующее действие укладывания.
- source_word: φάτνῃ
  choice: в яслях
  rationale: «Ясли» — традиционное и понятное русское обозначение кормушки для скота в данном контексте; лексическая конкретизация дана в сноске.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: И вот вам знак
  rationale: Естественно передаёт эллиптическую греческую конструкцию и вводит последующее описание как знак для пастухов, не добавляя отсутствующего в греческом явного глагола будущего времени.
theological_decisions:
- issue: Характер знака, данного пастухам
  choice: Опознавательный знак без явного определения его как чуда
  alternative: Божественное подтверждение с более широким богословским значением
  rationale: Текст прежде всего сообщает, как пастухи узнают младенца. Слово «знак» сохраняет возможность более глубокого богословского смысла, но не навязывает его.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «И вот вам знак» звучит естественно и сохраняет вводную силу καὶ τοῦτο ὑμῖν τὸ σημεῖον. «Спелёнатого» понятно современному читателю и менее громоздко, чем «завёрнутого в пелены».
