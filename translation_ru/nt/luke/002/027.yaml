    text: 'Буквально: «родители». Лука использует здесь обычное семейное обозначение Марии и Иосифа, заботившихся об Иисусе.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: в Духе
  rationale: Форма с артиклем и ближайший контекст (Лк 2:25–27) указывают на Святого Духа. Передача «в Духе» сохраняет греческую предложную конструкцию и её оттенок, не сводя смысл только к направляющему действию Духа.
- source_word: ἱερόν
  choice: храм
  rationale: Ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище; «храм» — естественный и достаточно широкий русский эквивалент.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: когда ... внесли
  rationale: Конструкция с артиклевым инфинитивом имеет временное значение. Русское придаточное с «когда» естественно передаёт его.
- source_word: γονεῖς
  choice: родители
  rationale: Это прямое значение слова и обычное повествовательное обозначение Марии и Иосифа как земной семьи, заботившейся об Иисусе.
- source_word: παιδίον Ἰησοῦν
  choice: Младенца Иисуса
  rationale: По контексту παιδίον обозначает младенца; сочетание сохраняет имя при обозначении ребёнка.
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: чтобы совершить над Ним
  rationale: Родители являются смысловым субъектом целевого инфинитива, а действие совершается в отношении Иисуса. Такая перестройка ясна по-русски.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: то, что полагалось по обычаю Закона
  rationale: Εἰθισμένον означает установленное обычаем или принятое предписание. Формулировка передаёт нормативный характер действия без излишней конкретизации.
theological_decisions:
- issue: Кого обозначает πνεῦμα в действии Симеона
  choice: Святого Духа
  alternative: собственный дух или внутренний настрой Симеона
  rationale: Повторные упоминания Святого Духа в непосредственном контексте убедительно поддерживают это понимание; прописная буква отражает его, а сама предложная конструкция сохраняет оттенок оригинала.
- issue: Обозначение Марии и Иосифа словом «родители»
  choice: прямо перевести γονεῖς как «родители»
  alternative: «опекуны» или «Иосиф и Мария»
  rationale: Лука использует обычный язык семейных отношений. Перевод не должен ослаблять или расширять его формулировку; она описывает социальную и семейную роль Марии и Иосифа и сама по себе не является утверждением о биологическом отцовстве Иосифа.
translation_notes:
  register: Современный литературный и благоговейный русский язык. Сохранено несколько приподнятое «в Духе», пояснённое в сноске. Прописные буквы в «Младенца», «Ним» и «Закона» соответствуют традиционному библейскому регистру; синтаксис оставляет фразу открытой, как и греческий стих, поскольку предложение продолжается далее.
