    rationale: Греческое καθὼς ἐλαλήθη πρὸς αὐτούς означает «как было сказано им» и не содержит ни явного «всё было», ни усилительного «именно». Смысл соответствия контекстуально понятен, но его не следует дополнительно усиливать.
