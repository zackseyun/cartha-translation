  source_fidelity: Заключительное «всё было именно так» эксплицирует подразумеваемое соответствие и добавляет усиление «именно», которого нет в καθὼς. Более близкая русская конструкция может сохранить сравнительную оговорку без такого добавления.
  naturalness: «Возвратились, прославляя и восхваляя Бога» — литературно, понятно и уместно. Заключительный оборот естественнее передать без вставного пояснительного предложения.
  terminology: «Пастухи», «прославляя», «восхваляя», «Бога» точно и последовательно передают лексику оригинала; два глагола хвалы сохранены раздельно.
  issues:
