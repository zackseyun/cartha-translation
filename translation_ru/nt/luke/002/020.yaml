  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: ru
  text: И пастухи возвратились, прославляя и восхваляя Бога за всё, что услышали и увидели, как им было сказано.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: возвратились
  rationale: Аорист обозначает возвращение пастухов после посещения; «возвратились» естественно и уместно в литературном повествовании.
- source_word: οἱ ποιμένες
  choice: пастухи
  rationale: Обычное современное русское обозначение людей, пасущих стада; речь идёт о пастухах, уже упомянутых ранее.
- source_word: δοξάζοντες
  choice: прославляя
  rationale: Деепричастие передаёт сопутствующее и продолжающееся действие, сохраняя связь с понятием славы.
- source_word: αἰνοῦντες
  choice: восхваляя
  rationale: Сохраняет отдельный, хотя и близкий по значению, глагол хвалы и не сливает два причастия в одно действие.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Прямое дополнение при обоих причастиях; нормативное написание в данном библейском контексте.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: за всё, что
  rationale: ἐπί с дательным указывает на основание или повод для прославления; «за всё, что» кратко и естественно по-русски.
- source_word: ἤκουσαν καὶ εἶδον
  choice: услышали и увидели
  rationale: Совершенный вид естественно передаёт греческие аористы и завершённые события без необходимости вводить особую форму предпрошедшего времени.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: всё было именно так, как им было сказано
  rationale: Формулировка естественно связывает заключительную сравнительную оговорку со всем услышанным и увиденным, сохраняет безлично-пассивную конструкцию и не называет подразумеваемого говорящего.
theological_decisions:
- issue: Следует ли прямо назвать ангела или ангелов источником сказанного пастухам
  choice: 'Сохранить неопределённого деятеля: «как им было сказано»'
  alternative: «как сказал им ангел» или «как сказали им ангелы»
  rationale: Греческий пассив ἐλαλήθη не называет действующее лицо. Хотя контекст указывает на ангельское возвещение, перевод не должен добавлять отсутствующего в данном стихе деятеля.
- issue: К чему относится заключительное καθώς
  choice: Передать соответствие всего услышанного и увиденного ранее сказанному
  alternative: Связать оборот только с ближайшим глаголом «увидели»
  rationale: Греческий порядок допускает широкое отнесение к паре «услышали и увидели»; русская формулировка ясно выражает это, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Парные действия «прославляя и восхваляя» сохранены, несмотря на смысловую близость. Заключительная фраза слегка перестроена ради ясности и естественности русского синтаксиса; подлежащее говорения оставлено невыраженным.
