  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: ru
  text: И была там Анна, пророчица, дочь Фануила, из колена Асира. Она достигла преклонного возраста[a], прожив с мужем семь лет с тех пор, как оставила девичество[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «продвинулась во многих днях» — греческое выражение, означающее преклонный возраст.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «после своего девичества». Греческое выражение указывает, что семь лет супружеской жизни отсчитываются от времени оставления девичества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: пророчица
  rationale: Существительное женского рода прямо называет Анну женщиной-пророком; «пророчица» — точное, краткое и общеупотребительное русское соответствие.
- source_word: θυγάτηρ Φανουήλ
  choice: дочь Фануила
  rationale: Прямо передаёт родственную связь и естественно звучит как приложение к имени Анны.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: из колена Асирова
  rationale: Предлог ἐκ указывает на происхождение или принадлежность; традиционное библейское выражение «из колена Асирова» понятно современному читателю.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: достигла преклонного возраста
  rationale: Греческое «продвинулась во многих днях» является идиомой глубокой старости. Русское выражение передаёт её смысл естественно, а буквальный образ сохранён в примечании.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: прожив с мужем
  rationale: В контексте речь идёт о супружеской жизни, а не просто о совместном проживании. Русское «с мужем» естественно выражает этот смысл.
- source_word: ἔτη ἑπτὰ
  choice: семь лет
  rationale: Точная передача указанной продолжительности.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: после своего девичества
  rationale: Сохраняет исходное указание на девичество как начальную точку отсчёта, не превращая пояснительное понимание — со времени вступления в брак — в основной текст.
theological_decisions:
- issue: Статус Анны как προφῆτις
  choice: Анна прямо названа пророчицей
  alternative: Ослабить значение до почётного звания или обозначения благочестивой женщины
  rationale: Греческий текст употребляет обычное существительное женского рода со значением «пророчица»; оснований ослаблять это утверждение нет.
- issue: Описание возраста Анны
  choice: Передать идиоматический смысл как «достигла преклонного возраста»
  alternative: Буквально перевести «продвинулась во многих днях» либо внести сюда расчёт возраста из следующего стиха
  rationale: Так сохраняется смысл греческой идиомы без неестественной русской кальки и без преждевременного уточнения хронологии.
- issue: Отсчёт семи лет от девичества
  choice: Сохранить выражение «после своего девичества» с пояснением в сноске
  alternative: Однозначно перевести «после замужества»
  rationale: Фраза подразумевает супружескую жизнь после оставления девичества, однако основной текст сохраняет образ и некоторую сжатость оригинала, не подменяя их разъяснением.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Колено Асирово» сохраняет привычную библейскую родословную лексику; синтаксис остаётся ясным для обычного современного читателя. Конечная запятая сохранена, поскольку стих представляет собой незавершённую часть предложения, продолжающегося в Лк 2:37.
