  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: ru
  text: 'И внезапно с ангелом появилось многочисленное небесное воинство[a], восхвалявшее Бога и говорившее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многочисленное небесное войско».'
    reason: Лексическая альтернатива для στρατιᾶς οὐρανίου; «войско» более прямо выражает военную образность, сохранённую в «воинстве».
lexical_decisions:
- source_word: ἐξαίφνης
  choice: внезапно
  rationale: Естественно передаёт неожиданность события и сохраняет повествовательную выразительность.
- source_word: ἐγένετο
  choice: появилось
  rationale: В данной конструкции глагол вводит внезапное присутствие множества; «появилось» естественно по-русски, не уточняя способ явления.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: рядом с ангелом
  rationale: Передаёт сопровождение и совместное присутствие; выражение естественно в контексте внезапного появления небесного множества.
- source_word: πλῆθος
  choice: многочисленное
  rationale: В сочетании с собирательным существительным «воинство» передаёт большое число, избегая тяжеловесного «множество воинства».
- source_word: στρατιᾶς οὐρανίου
  choice: небесное воинство
  rationale: Сохраняет образ организованного небесного войска и традиционную возвышенность выражения, не заменяя его общим словом «ангелы».
- source_word: αἰνούντων τὸν θεὸν
  choice: восхвалявшее Бога
  rationale: Точно передаёт продолжающееся действие причастия и его прямой объект.
- source_word: καὶ λεγόντων
  choice: и говорившее
  rationale: Сохраняет параллельность двух причастий и вводит прямую речь следующего стиха.
theological_decisions:
- issue: Передача στρατιᾶς οὐρανίου
  choice: небесное воинство
  alternative: небесное войско
  rationale: «Воинство» сохраняет военную образность и библейскую возвышенность, не предполагая, что в этой сцене небесные существа ведут бой; вариант «войско» делает военный оттенок более прямым.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для русского языка; двоеточие сохраняет переход к словам хвалы в следующем стихе.
