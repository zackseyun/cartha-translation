source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: ru
  text: 'Симеон благословил их и сказал Марии, его матери: «Вот, он поставлен для падения и подъёма многих в Израиле и как знамение, которому будут противиться.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «знамение, которому противоречат».'
    reason: Передаёт прямую связь греческого ἀντιλεγόμενον со словом «знамение» и сохраняет речевой образ оригинала.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Прямой и естественный эквивалент, сохраняющий религиозный смысл глагола.
- source_word: οὗτος κεῖται
  choice: он предназначен
  rationale: В данном обороте κεῖμαι передаёт установленное предназначение; буквальное «лежит» по-русски исказило бы смысл.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: падения и восстания
  rationale: 'Сохраняется резкое противопоставление и смысловая широта ἀνάστασις: поднятие, восстановление или воскресение; перевод не сводит выражение к одному толкованию.'
- source_word: σημεῖον ἀντιλεγόμενον
  choice: знамение, которому будут противиться
  rationale: Передаёт образ знамения и направленное против него несогласие; будущее время естественно по-русски выражает предсказательный контекст.
theological_decisions:
- issue: Смысл «падения и восстания многих»
  choice: Сохранить без уточнения, относятся ли падение и восстание к разным людям или к одним и тем же.
  alternative: «Чтобы многие в Израиле пали, а многие поднялись»
  rationale: Греческий текст не распределяет эти два действия по отдельным группам, поэтому такое уточнение было бы истолкованием.
- issue: Значение ἀνάστασις
  choice: «восстание»
  alternative: «подъём» или «воскресение»
  rationale: Выбранный вариант сохраняет традиционную богословскую насыщенность слова и не исключает ни образ поднятия после падения, ни возможный отзвук воскресения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Вот» естественно передаёт ἰδού; местоимения, относящиеся к Иисусу, набраны со строчной буквы в соответствии с обычной современной орфографией и без внесения конфессионального типографического предпочтения.
