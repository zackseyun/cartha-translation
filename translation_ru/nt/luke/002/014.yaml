  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: ru
  text: Слава Богу в вышних, и на земле мир среди людей, к которым Он благоволит.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «среди людей благоволения». Подразумевается Божье благоволение.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «и на земле мир, среди людей благоволение».'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Слава
  rationale: Сохраняет форму торжественного возгласа, в котором слава воздаётся Богу, и его богословско-литургическую весомость.
- source_word: ἐν ὑψίστοις
  choice: в вышних
  rationale: Краткое и укоренённое в русском библейском стиле обозначение высшей небесной сферы; оно также сохраняет пространственное противопоставление земле.
- source_word: θεῷ
  choice: Богу
  rationale: Дательный падеж естественно передаёт направленность славы Богу без добавления предлога.
- source_word: ἐπὶ γῆς
  choice: на земле
  rationale: Прямой и естественный пространственный эквивалент, противопоставленный выражению «в вышних».
- source_word: εἰρήνη
  choice: мир
  rationale: Передаёт широкий библейский смысл слова без неоправданного сужения.
- source_word: ἐν ἀνθρώποις
  choice: среди людей
  rationale: В данном контексте множественное ἄνθρωποι обозначает людей вообще; современное русское «людей» точно и естественно передаёт этот смысл.
- source_word: εὐδοκίας
  choice: к которым Он благоволит
  rationale: Идиоматично передаёт родительный падеж как характеристику людей, являющихся объектами благоволения; местоимение проясняет подразумеваемого носителя благоволения, которым в контексте является Бог.
theological_decisions:
- issue: Значение родительного εὐδοκίας в ангельском славословии
  choice: Мир среди людей, к которым Бог благоволит
  alternative: «На земле мир, в людях благоволение» при чтении именительного εὐδοκία; либо более формально «среди людей благоволения»
  rationale: Принятый текст SBLGNT содержит εὐδοκίας в родительном падеже, поэтому «благоволение» характеризует людей, среди которых возвещается мир, а не выступает третьим самостоятельным членом возгласа. Перевод не уточняет, на каком основании Бог благоволит к этим людям, и тем самым не привносит отдельной доктринальной системы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Традиционное «в вышних» сохранено как понятное и торжественное выражение; архаичные «мужи» или родовое «человеки» не используются. Маркеры сносок размещены после той части стиха, к которой относятся.
