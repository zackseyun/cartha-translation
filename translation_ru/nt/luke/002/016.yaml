  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: ru
  text: Они поспешили туда и нашли Марию, Иосифа и Младенца, лежащего в яслях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в кормушке для животных. Греческое слово φάτνη может обозначать ясли или кормушку.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν σπεύσαντες
  choice: поспешили туда
  rationale: Сочетание глагола движения с причастием передаёт прибытие к указанному месту и срочность. Естественная русская формулировка избегает тяжеловесного «пришли, поспешив».
- source_word: ἀνεῦραν
  choice: нашли
  rationale: Глагол обозначает успешное нахождение, в том числе после поисков; «нашли» естественно передаёт это в повествовании.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Марию, Иосифа
  rationale: Имена переданы в их общепринятой русской библейской форме; частица τε естественно выражена перечислением.
- source_word: τὸ βρέφος
  choice: Младенца
  rationale: βρέφος означает совсем маленького ребёнка, здесь новорождённого Иисуса. «Младенец» точно, понятно и соответствует достойному повествовательному регистру.
- source_word: κείμενον
  choice: лежащего
  rationale: Причастие описывает состояние и положение Младенца, а не действие того, кто положил Его.
- source_word: ἐν τῇ φάτνῃ
  choice: в яслях
  rationale: φάτνη обозначает кормушку для животных; «ясли» — точный и укоренившийся русский эквивалент в этом контексте.
- source_word: καὶ ... καὶ ... καὶ
  choice: и ... , ... и ...
  rationale: Связность греческого перечисления сохранена в естественном для современного русского языка синтаксисе без механического повторения каждого союза.
