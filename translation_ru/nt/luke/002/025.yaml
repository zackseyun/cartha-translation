id: LUK.2.25
reference: Luke 2:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: ru
  text: И вот, в Иерусалиме был человек по имени Симеон. Он был праведен и благочестив, ожидал утешения Израиля[a], и Святой Дух был на нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утешения для Израиля». Речь об ожидаемых от Бога утешении и восстановлении Его народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «и святой дух был на нём»; однако в контексте Евангелия от Луки здесь наиболее естественно понимать Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет вводный повествовательный маркер Луки, привлекающий внимание к новому значимому лицу, и при этом естественно звучит по-русски.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Обычное и точное обозначение Симеона как конкретного человека; его мужской пол ясен из имени и местоимений.
- source_word: ᾧ ὄνομα Συμεών
  choice: по имени Симеон
  rationale: Естественная русская передача греческой конструкции называния.
- source_word: δίκαιος
  choice: праведен
  rationale: Передаёт нравственный и религиозно-заветный оттенок характеристики Симеона.
- source_word: εὐλαβής
  choice: благочестив
  rationale: Кратко и естественно передаёт почтительное отношение к Богу и тщательность в вере.
- source_word: προσδεχόμενος
  choice: ожидал
  rationale: Передаёт продолжающееся, исполненное надежды ожидание без добавления отсутствующей в тексте степени эмоциональной напряжённости.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: утешения Израиля
  rationale: Сохраняет библейский образ обещанного Богом утешения и восстановления Израиля, не сводя его к одному частному событию.
- source_word: πνεῦμα ἅγιον
  choice: Святой Дух
  rationale: Хотя в греческом сочетание без артикля, ближайший контекст Луки 2:26–27 и словоупотребление Луки наиболее естественно указывают на Святого Духа.
- source_word: ἐπ’ αὐτόν
  choice: был на нём
  rationale: Прямо сохраняет библейский образ пребывания Духа на человеке, не уточняя характер действия сверх сказанного в тексте.
theological_decisions:
- issue: Значение выражения παράκλησις τοῦ Ἰσραήλ
  choice: утешение Израиля
  alternative: восстановление Израиля
  rationale: «Утешение» сохраняет формальный образ и его вероятный отзвук пророческих обещаний, а примечание поясняет, что речь не только об эмоциональном облегчении.
- issue: Референт πνεῦμα ἅγιον
  choice: Святой Дух
  alternative: святой дух
  rationale: Контекст непосредственно связывает это выражение с откровением Духа и водительством Духа в последующих стихах, поэтому личностный референт наиболее вероятен; формальная неоднозначность конструкции отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности; ключевые образы «утешение Израиля» и «Дух был на нём» сохранены без конфессионального уточнения.
