  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: ru
  text: И ангел Господень предстал перед ними[a], и слава Господня осветила их со всех сторон, и их охватил великий страх[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказался рядом с ними». Греческий глагол может обозначать как внезапное появление, так и то, что кто-либо встал рядом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они испугались великим страхом» — греческий оборот, выражающий очень сильный страх.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: ангел Господень
  rationale: В повествовательном контексте ἄγγελος означает небесного ангела. Русская безартиклевая конструкция не вынуждает выбирать между определённостью и неопределённостью, а традиционное «Господень» естественно передаёт родительный оборот κυρίου.
- source_word: ἐπέστη αὐτοῖς
  choice: вдруг перед ними предстал
  rationale: ἐφίστημι здесь обозначает внезапное появление и близкое присутствие. «Предстал перед ними» сохраняет конкретность глагола, а «вдруг» передаёт присущий контексту оттенок внезапности.
- source_word: δόξα κυρίου
  choice: слава Господня
  rationale: Передаёт δόξα как явленную божественную славу, не сводя её только к физическому свету.
- source_word: περιέλαμψεν αὐτούς
  choice: озарила их
  rationale: Глагол περιλάμπω означает «осиять, озарить со всех сторон». Краткое русское «озарила их» естественно выражает окружившее пастухов сияние.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: они сильно испугались
  rationale: Греческий глагол с однокоренным винительным усиливает выражение страха. По-русски смысл идиоматично и точно передаётся наречием «сильно»; буквальное «убоялись великим страхом» звучало бы архаично и неестественно.
theological_decisions:
- issue: Передача κύριος в выражениях ἄγγελος κυρίου и δόξα κυρίου
  choice: Господень / Господня
  alternative: принадлежащий Господу / слава Господа
  rationale: В обоих оборотах речь идёт о Боге. Прилагательное «Господень» сохраняет богословский вес κύριος и образует естественные, торжественные русские сочетания без добавления конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Ангел Господень» и «слава Господня» сохраняют узнаваемую сакральную лексику; финальная фраза намеренно передана естественным современным оборотом.
