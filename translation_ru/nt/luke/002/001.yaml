  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: ru
  text: В те дни вышел указ от кесаря Августа о проведении переписи во всём обитаемом мире.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всему римскому миру»; или: «по всей империи». Греческое слово часто обозначает обитаемый мир, мыслимый в рамках Римской империи.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις
  choice: В те дни
  rationale: Начальная повествовательная формула и слабый связующий δὲ естественно передаются по-русски кратким временным оборотом без архаичного «случилось же».
- source_word: ἐξῆλθεν δόγμα
  choice: вышел указ
  rationale: Сохраняет образ официального распоряжения, исходящего от власти, и звучит естественно в современном литературном русском.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: от кесаря Августа
  rationale: Предлог παρά с родительным обозначает источник; «от» прямо передаёт происхождение указа.
- source_word: ἀπογράφεσθαι
  choice: провести перепись
  rationale: В контексте официального распоряжения глагол означает регистрацию населения; «провести перепись» ясно и естественно, не уточняя её налоговую цель.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: по всей обитаемой земле
  rationale: Передаёт буквальный объём οἰκουμένη и сохраняет возможную широту выражения, не подменяя его в основном тексте более узким «Римская империя».
theological_decisions:
- issue: Объём значения οἰκουμένη
  choice: вся обитаемая земля
  alternative: весь римский мир; вся империя
  rationale: Выражение может обозначать обитаемый мир в целом, но в имперском контексте часто относится к римскому миру. Основной текст сохраняет лексическую широту, а примечание сообщает контекстуальные варианты.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования; синтаксис упрощён естественным для русского свёртыванием вводной формулы, без архаизмов и конфессионально окрашенных уточнений.
