  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: ru
  text: И Он спустился вместе с ними, пришёл в Назарет и был им послушен[a]. А Его мать хранила все эти слова[b] в своём сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подчинялся им». Греческая конструкция указывает на продолжающееся послушание или подчинение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё это»; «всё сказанное». Греческое ῥήματα может обозначать слова, изречения или то, о чём говорится.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: спустился
  rationale: Передаёт топографическое движение вниз из Иерусалима естественным современным русским глаголом.
- source_word: μετ’ αὐτῶν
  choice: вместе с ними
  rationale: Точно и естественно передаёт простое значение совместного движения.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: пришёл в Назарет
  rationale: Сохраняет последовательность повествовательного движения; русское «пришёл» допустимо при взгляде из пункта назначения.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: был им послушен
  rationale: Естественно выражает постоянное послушание родителям; перифрастический имперфект указывает на продолжающееся состояние или образ действий.
- source_word: διετήρει
  choice: хранила
  rationale: Передаёт бережное сохранение в памяти без усиления толкованием вроде «сокровенно обдумывала».
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: все эти слова
  rationale: Сохраняет прозрачную связь ῥήματα с произнесёнными словами, не исключая того, что речь может идти и о событиях или обстоятельствах.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: в своём сердце
  rationale: Сохраняет библейский образ внутренней памяти и размышления в естественной русской форме.
theological_decisions:
- issue: Отношение Иисуса к Его земным родителям
  choice: был им послушен
  alternative: подчинялся им
  rationale: Формулировка прямо сохраняет утверждение о продолжающемся послушании Иисуса Марии и Иосифу, не добавляя догматических пояснений и не снимая богословского напряжения повествования.
translation_notes:
  register: Современный литературный русский язык с простым, dignified повествовательным синтаксисом. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции. Смысловые сноски поставлены непосредственно после соответствующих выражений.
