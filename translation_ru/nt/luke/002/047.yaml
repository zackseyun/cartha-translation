  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες αὐτοῦ ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: ru
  text: И все, кто слушал Его, изумлялись Его пониманию и ответам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поражались». Греческий глагол выражает сильное удивление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: изумлялись
  rationale: Имперфект передаёт продолжавшуюся реакцию сильного удивления; «изумлялись» естественно и достойно звучит по-русски, не прибегая к вводящей в заблуждение буквальности.
- source_word: δὲ
  choice: И
  rationale: Немаркированная повествовательная связь; союз «и» естественно продолжает рассказ.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: все, кто слушал Его
  rationale: Передаёт всеобщий охват πάντες и одновременный характер причастия ἀκούοντες естественной русской конструкцией.
- source_word: ἐπὶ τῇ συνέσει
  choice: Его пониманию
  rationale: ἐπί с дательным указывает на основание изумления, а σύνεσις означает понимание, способность постигать смысл.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: Его ответам
  rationale: «Ответы» точно передают ἀποκρίσεις и соответствуют описанной в контексте беседе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; ясная, естественная и вместе с тем достойная повествовательная формулировка. Местоимение «Его» применительно к Иисусу написано с прописной буквы согласно распространённой русской библейской традиции.
