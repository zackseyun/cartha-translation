  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: ru
  text: 'И он взял Его на руки[a], благословил Бога и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принял Его в объятия». Греческий глагол может означать «принять» или «радушно встретить», но в сочетании со словами «на руки» здесь естественнее передать физическое действие глаголом «взял».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξατο
  choice: взял
  rationale: Глагол δέχομαι обычно означает «принимать», однако в сочетании с εἰς τὰς ἀγκάλας естественное русское выражение «взял на руки» точно передаёт физическое действие и не исключает оттенка принятия.
- source_word: αὐτό
  choice: Его
  rationale: Местоимение среднего рода согласуется с подразумеваемым παιδίον («Дитя, Младенец»), но указывает на младенца Иисуса; личное местоимение мужского рода естественно и недвусмысленно в русском языке.
- source_word: εἰς τὰς ἀγκάλας
  choice: на руки
  rationale: Множественное ἀγκάλαι обозначает руки как объятие или место, где держат ребёнка. Русское «взять на руки» является естественным соответствием; принадлежность рук Симеону ясна из конструкции и контекста.
- source_word: εὐλόγησεν τὸν θεόν
  choice: благословил Бога
  rationale: Перевод сохраняет прямое значение εὐλογέω при Боге как объекте и понятную библейскую формулировку; «прославил Бога» было бы допустимым смысловым, но менее формальным соответствием.
- source_word: καὶ εἶπεν
  choice: 'и сказал:'
  rationale: Простое продолжение повествования. Двоеточие естественно вводит последующую прямую речь.
- source_word: αὐτός
  choice: он
  rationale: Местоимение обозначает действующее лицо с лёгким выделением; «сам» в русском здесь придало бы избыточное противопоставление.
theological_decisions:
- issue: Референт местоимения среднего рода αὐτό
  choice: Личное местоимение «Его» относится к младенцу Иисусу.
  alternative: Формально-грамматическое «его» или «это» с ориентацией на средний род названия ребёнка; последнее по-русски звучало бы обезличивающе.
  rationale: Грамматический род местоимения определяется обозначением ребёнка, тогда как референтом является личность Иисуса. Русский перевод следует референту и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «взял Его на руки» естественна для сцены с младенцем; «благословил Бога» сохраняет прозрачную библейскую лексику. Прописная буква в «Его» следует принятому русскому благоговейному оформлению личного местоимения, относящегося к Иисусу.
