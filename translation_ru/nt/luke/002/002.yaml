lexical_decisions:
- source_word: αὕτη
  choice: Это была
  rationale: Указательное местоимение отсылает к упомянутой в предыдущем стихе регистрации; по-русски связка с именной частью сказуемого звучит естественно.
- source_word: ἀπογραφὴ
  choice: регистрация населения
  rationale: Передаёт официальный административный учёт людей, не сводя значение исключительно к статистической переписи; более традиционный вариант «перепись» сохранён в примечании.
- source_word: πρώτη
  choice: первая
  rationale: Сохранено наиболее прямое порядковое значение слова; спорное временно-сравнительное понимание «до» вынесено в примечание.
- source_word: ἐγένετο
  choice: состоялась
  rationale: Естественно передаёт осуществление административного мероприятия; отдельное предложение устраняет тяжеловесность русской конструкции.
- source_word: ἡγεμονεύοντος
  choice: когда ... управлял
  rationale: Передаёт одновременность, выраженную родительным самостоятельным оборотом, и не приписывает Квиринию более узкий официальный титул, чем позволяет глагол.
- source_word: τῆς Συρίας
  choice: Сирией
  rationale: Творительный падеж естественно употребляется при русском глаголе «управлять».
- source_word: Κυρηνίου
  choice: Квириний
  rationale: Устоявшаяся русская передача имени Κυρήνιος.
