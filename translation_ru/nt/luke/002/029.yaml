  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: ru
  text: Теперь Ты отпускаешь раба Своего, Владыка, по слову Твоему, с миром.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Речь, вероятно, о готовности Симеона уйти из жизни с миром, однако буквально сказано: «отпускаешь».'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Теперь
  rationale: Передаёт наступивший момент исполнения обещанного; в современной русской речи здесь естественнее, чем стилистически возвышенное «ныне».
- source_word: ἀπολύεις
  choice: отпускаешь
  rationale: Сохраняет образ освобождения или разрешения уйти, не превращая подразумеваемую смерть в прямое утверждение.
- source_word: τὸν δοῦλόν σου
  choice: раба Своего
  rationale: «Раб» прямо передаёт δοῦλος и сохраняет подчёркнутую сочетанием с обращением «Владыка» связь принадлежности и служения.
- source_word: δέσποτα
  choice: Владыка
  rationale: Передаёт обращение к обладающему властью господину и естественно сочетается в русском библейском регистре со словом «раб».
- source_word: κατὰ τὸ ῥῆμά σου
  choice: по слову Твоему
  rationale: Кратко и естественно выражает соответствие ранее данному слову или обещанию.
- source_word: ἐν εἰρήνῃ
  choice: с миром
  rationale: Устойчивое русское выражение для мирного ухода; сохраняет библейское звучание и не ограничивает смысл лишь душевным спокойствием.
theological_decisions:
- issue: Следует ли прямо назвать смерть Симеона
  choice: Сохранить образ отпускания, оставив смерть подразумеваемой
  alternative: «Теперь Ты позволяешь рабу Своему умереть с миром»
  rationale: Контекст указывает на готовность Симеона уйти из жизни, однако ἀπολύω означает «отпускать, освобождать», а не прямо «давать умереть».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Формы «Ты», «Своего», «Твоему» и обращение «Владыка» поддерживают торжественный характер речи, не затемняя её смысл.
