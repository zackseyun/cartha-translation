source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: ru
  text: И родила она сына, своего первенца, запеленала его[a] и положила в кормушку для животных[b], потому что в гостевой комнате[c] не было для них места.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обернула его пеленами».'
    reason: Лексическая альтернатива, поясняющая конкретный способ пеленания младенца.
  - marker: b
    text: 'Или: «в ясли». Греческое слово обозначает место или ёмкость, откуда кормят животных.'
    reason: Сохранён традиционный русский эквивалент и пояснено предметное значение греческого слова.
  - marker: c
    text: 'Традиционно: «в гостинице». Греческое κατάλυμα может означать гостевую комнату или место для ночлега; говоря о коммерческой гостинице в Лк. 10:34, Лука употребляет другое слово.'
    reason: Отмечен традиционный вариант и сохранена смысловая неоднозначность исходного слова.
lexical_decisions:
- source_word: ἔτεκεν
  choice: родила
  rationale: Обычное и точное современное обозначение рождения ребёнка, без архаического оттенка.
- source_word: τὸν υἱὸν αὐτῆς τὸν πρωτότοκον
  choice: сына, своего первенца
  rationale: Передаёт и родство, и указание на порядок рождения; слово «первенец» естественно в современном литературном русском и не добавляет к повествованию позднейших богословских выводов.
- source_word: ἐσπαργάνωσεν
  choice: запеленала его
  rationale: Глагол непосредственно обозначает пеленание младенца; это краткая, ясная и естественная русская формулировка.
- source_word: ἀνέκλινεν
  choice: положила
  rationale: В данном контексте глагол означает, что младенца положили; буквальное «возложила» звучало бы неестественно и стилистически перегруженно.
- source_word: φάτνῃ
  choice: кормушку для скота
  rationale: Передаёт конкретное значение места или ёмкости для корма животных и понятнее современному читателю, чем традиционные «ясли», которые теперь часто ассоциируются с детским учреждением.
- source_word: τόπος
  choice: места
  rationale: Прямой и естественный эквивалент, сохраняющий широкий смысл наличия свободного места.
- source_word: καταλύματι
  choice: комнате для гостей
  rationale: κατάλυμα может обозначать гостевое помещение или место для ночлега; у Луки для коммерческой гостиницы в 10:34 употреблено другое слово, а в 22:11 κατάλυμα явно означает гостевую комнату.
theological_decisions:
- issue: Следует ли понимать κατάλυμα как коммерческую гостиницу или как помещение для гостей
  choice: комната для гостей
  alternative: гостиница; место для ночлега
  rationale: Греческое слово не требует представления о коммерческой гостинице. Выбранный вариант учитывает словоупотребление Луки и не вводит в сцену традиционную деталь, которой сам текст однозначно не утверждает.
translation_notes:
  register: Современный литературный русский с dignified повествовательным ритмом. Инверсия «родила она» слегка возвышает стиль, не делая его архаичным. Конкретное «кормушка для скота» выбрано ради ясности, а традиционные «ясли» вынесены в примечание.
