  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: ru
  text: А Иисус продолжал возрастать в мудрости, росте[a] и благоволении у Бога и людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возрасте» или «зрелости». Греческое слово ἡλικία допускает эти значения наряду с телесным ростом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: продолжал возрастать
  rationale: Имперфект передаёт продолжавшееся во времени развитие; выражение естественно по-русски и сохраняет идею подлинного роста.
- source_word: σοφίᾳ
  choice: в мудрости
  rationale: Прямое и естественное соответствие, обозначающее понимание и рассудительность в широком смысле.
- source_word: ἡλικίᾳ
  choice: росте
  rationale: Слово может обозначать телесный рост, возраст или зрелость. В основном тексте «рост» ясно передаёт видимое человеческое развитие Иисуса, а подлинная лексическая неоднозначность отмечена в сноске.
- source_word: χάριτι
  choice: благоволении
  rationale: В сочетании с Богом и людьми речь естественнее всего идёт о благосклонности и добром отношении, а не о богословски отвлечённом понятии благодати.
- source_word: παρὰ θεῷ
  choice: у Бога
  rationale: Παρά с дательным выражает отношение или положение в чьих-либо глазах; «у Бога» — естественное русское соответствие, параллельное «у людей».
- source_word: ἀνθρώποις
  choice: людей
  rationale: Ἄνθρωποι здесь обозначает людей вообще; русское «людей» точно передаёт обобщённый смысл без ложного ограничения только мужчинами.
theological_decisions:
- issue: Человеческое развитие Иисуса и христологическое напряжение
  choice: Прямо сказать, что Иисус продолжал возрастать в мудрости, физическом развитии и благоволении.
  alternative: Смягчить или затушевать утверждение о развитии Иисуса ради устранения богословского напряжения.
  rationale: Греческий текст недвусмысленно описывает реальное продолжающееся развитие Иисуса. Перевод сохраняет это свидетельство о Его подлинной человечности и не разрешает заложенное в тексте богословское напряжение посредством парафраза.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Продолжал возрастать» передаёт длительность имперфекта; «благоволение» сохраняет возвышенный, но понятный регистр. Союз «А» естественно связывает стих с предшествующим повествованием.
