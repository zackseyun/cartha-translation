  text: чтобы зарегистрироваться вместе с Марией, обручённой с ним[a] и беременной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помолвленной с ним». Греческое слово обозначает официальное обручение — более прочную юридическую и общественную связь, чем обычно подразумевает современная помолвка.'
    reason: lexical_alternative
  - marker: b
