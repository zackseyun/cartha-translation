    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: чтобы зарегистрироваться
  rationale: Аористный инфинитив среднего залога выражает цель путешествия Иосифа в контексте переписи; возвратная форма «зарегистрироваться» естественно передаёт административный смысл.
- source_word: σὺν Μαριὰμ
  choice: вместе с Марией
  rationale: Предлог σύν выражает сопровождение; «вместе с» ясно и естественно связывает Марию с регистрацией.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: обручённой с ним
  rationale: Перфектное страдательное причастие обозначает установленное обручение — более прочную юридическую и общественную связь, чем современные помолвка или договорённость о браке.
- source_word: οὔσῃ ἐγκύῳ
  choice: и беременной
  rationale: Причастный оборот указывает на состояние Марии в то время; краткая однородная конструкция естественна по-русски и сохраняет связь обоих определений с Марией.
theological_decisions:
- issue: Брачный статус Марии по отношению к Иосифу
  choice: обручённой с ним
  alternative: помолвленной с ним; его женой
  rationale: Греческое μνηστεύομαι прямо обозначает обручение. «Его женой» усилило бы формулировку исходного текста, а «помолвленной» может вызвать представление о менее обязательной современной помолвке.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаического «непраздная». Причастная конструкция сохраняет компактность греческого текста.
