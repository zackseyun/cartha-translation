  footnotes:
  - marker: a
    text: 'Или: «изумились».'
    reason: Лексический вариант для ἐθαύμασαν, передающий более сильный оттенок удивления.
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой повествовательный союз сохраняет связь с предыдущим стихом.
- source_word: πάντες οἱ ἀκούσαντες
  choice: все, кто это слышал
  rationale: Субстантивированное причастие передано естественным русским придаточным оборотом. Местоимение «это» восстановлено из контекста и указывает на рассказ пастухов.
- source_word: ἐθαύμασαν
  choice: удивлялись
  rationale: Глагол выражает удивление и изумление от услышанного, не уточняя, сопровождалась ли эта реакция верой.
- source_word: περὶ τῶν λαληθέντων
  choice: тому, что … рассказали
  rationale: Оборот с περί указывает на предмет реакции, а форма от λαλέω — на содержание сказанного; по-русски это естественно выражается конструкцией «удивлялись тому, что…».
- source_word: ὑπὸ τῶν ποιμένων
  choice: пастухи
  rationale: В греческой пассивной конструкции ὑπό с родительным обозначает действующее лицо; в естественной русской активной конструкции оно передано подлежащим.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: Местоимение сохраняет отсылку к упомянутым слушателям без излишнего уточнения их состава.
theological_decisions:
- issue: Характер реакции, выраженной глаголом ἐθαύμασαν
  choice: Передано как удивление без указания на веру или неверие.
  alternative: Понимать реакцию как положительный отклик веры либо лишь как любопытство.
  rationale: Сам глагол сообщает об эмоциональной реакции на услышанное, но не определяет ее дальнейшего духовного результата; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык. Активная конструкция «им рассказали пастухи» выбрана вместо более буквального, но тяжеловесного «было сказано им пастухами»; смысл и участники действия сохранены.
