  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: ru
  text: которое Ты приготовил на виду у всех народов,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед всеми народами»; греческий оборот может означать: «на виду у всех».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: которое
  rationale: Относительное местоимение среднего рода, единственного числа; согласуется со словом «спасение» в предыдущем стихе.
- source_word: ἡτοίμασας
  choice: Ты приготовил
  rationale: Аорист действительного залога, второе лицо единственного числа, в обращении к Богу. Простое прошедшее время естественно передаёт форму и смысл.
- source_word: κατὰ πρόσωπον
  choice: перед лицом
  rationale: Сохраняет образность греческого оборота и выражает открытое явление перед взором всех, оставаясь понятным в возвышенном современном русском.
- source_word: πάντων τῶν λαῶν
  choice: всех народов
  rationale: Передаёт множественное число λαῶν и не сужает значение до языческих народов, поскольку дальнейшее уточнение следует в стихе 32.
theological_decisions:
- issue: Объём значения λαῶν в связи со следующим стихом
  choice: всех народов
  alternative: всех людей; всех наций
  rationale: Множественное число указывает на совокупность народов. Выбор сохраняет широкую формулировку и позволяет следующему стиху отдельно назвать язычников и Израиль.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Заглавная буква в «Ты» отмечает прямое обращение к Богу; пунктуация учитывает продолжение предложения из предыдущего стиха.
