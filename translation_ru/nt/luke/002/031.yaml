  source_fidelity: «Которое Ты приготовил» точно передаёт ὃ ἡτοίμασας и сохраняет связь со «спасением» в предыдущем стихе. «Всех народов» адекватно передаёт πάντων τῶν λαῶν, сохраняя множественное число и широкий охват. Однако «перед лицом всех народов» в современном русском может звучать как буквальная калька и не вполне ясно выражает значение κατὰ πρόσωπον — открыто, на виду у всех.
  naturalness: «На виду у всех народов» — естественный современный литературный оборот с уместной библейской возвышенностью; он ясно передаёт публичную явленность, подразумеваемую греческим идиоматическим выражением.
  terminology: «Народы» сохраняет множественное число λαοί и не предрешает различение между язычниками и Израилем, которое последует в следующем стихе. Заглавное «Ты» уместно как обращение к Богу.
