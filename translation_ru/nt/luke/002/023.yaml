  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: ru
  text: 'как написано в Законе Господа: «Всякий мужского пола, открывающий утробу, будет назван святым для Господа»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: как написано
  rationale: Устойчивая и естественная по-русски формула ссылки на Писание, передающая сохраняющую силу перфекта γέγραπται.
- source_word: ἐν νόμῳ κυρίου
  choice: в Законе Господа
  rationale: Речь идёт о Законе как признанном корпусе Божьих установлений; прописная буква помогает обозначить это значение. κύριος передано как «Господь» в соответствии с греческим текстом.
- source_word: ὅτι
  choice: ':'
  rationale: В данном контексте ὅτι вводит содержание прямой цитаты. В современном русском двоеточие перед цитатой передаёт эту функцию естественнее, чем союз «что».
- source_word: Πᾶν ἄρσεν
  choice: всякий младенец мужского пола
  rationale: Греческое выражение буквально означает «всякий мужского пола»; существительное «младенец» восстановлено из контекста рождения для ясного и грамматически естественного русского текста, при этом половая определённость сохранена.
- source_word: διανοῖγον μήτραν
  choice: открывающий утробу
  rationale: Сохранён библейский образ первого ребёнка, открывающего материнскую утробу, без замены самого выражения словом «первенец».
- source_word: ἅγιον τῷ κυρίῳ
  choice: святым для Господа
  rationale: Слово ἅγιον передано прямо как «святым», а не истолковано в основном тексте как «посвящённым»; дательный τῷ κυρίῳ выражает принадлежность и посвящение Господу.
- source_word: κληθήσεται
  choice: будет назван
  rationale: Прямо передаёт будущее время и пассивный залог, сохраняя формулировку законодательной цитаты.
theological_decisions:
- issue: Передача κύριος в цитате из Закона Израиля
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Перевод следует непосредственно греческому κύριος. Хотя за цитируемым местом Исхода стоит еврейское Божье имя, его особое графическое обозначение не вносится в греческий текст задним числом.
- issue: Святость или истолкование как посвящение
  choice: святым для Господа
  alternative: посвящённым Господу
  rationale: Основной текст сохраняет явное ἅγιον и тем самым связь с лексикой святости; смысл посвящения пояснён в сноске, а не подставлен вместо исходного слова.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным регистром библейской цитаты. Синтаксис сделан естественным для русского: содержание написанного введено двоеточием и кавычками. Выражение «открывающий утробу» сохранено ради образности и связи с формулировкой Закона; его значение пояснено в сноске.'
