  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: ru
  text: А ребёнок рос и укреплялся, наполняясь мудростью[a], и Божье благоволение[b] было на нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях слова «наполняясь мудростью» отсутствуют.
    reason: 'Текстологическая неопределённость: выражение πληρούμενον σοφίᾳ заключено в SBLGNT в текстологические скобки.'
  - marker: b
    text: 'Или: «Божья благодать».'
    reason: Лексема χάρις допускает здесь перевод как «благоволение» и как «благодать».
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: А ребёнок
  rationale: παιδίον обозначает ребёнка; «ребёнок» точно и естественно передаёт возрастное обозначение в данном контексте. δέ имеет лёгкую повествовательную связующую функцию, для которой здесь подходит «а».
- source_word: ηὔξανεν
  choice: рос
  rationale: Имперфект αὐξάνω изображает продолжающийся рост; русское «рос» естественно передаёт этот процесс.
- source_word: ἐκραταιοῦτο
  choice: укреплялся
  rationale: Имперфект κραταιόομαι указывает на постепенное обретение силы. «Укреплялся» сохраняет процессуальность и не ограничивает смысл только физическим развитием.
- source_word: πληρούμενον σοφίᾳ
  choice: исполняясь мудростью
  rationale: Причастие настоящего времени описывает сопутствующий продолжающийся процесс, а дательный σοφίᾳ обозначает содержание. «Исполняясь мудростью» сохраняет и причастную форму, и смысл наполнения.
- source_word: χάρις θεοῦ
  choice: Божье благоволение
  rationale: χάρις здесь может означать благодать или благосклонность, благоволение. В повествовательном описании Божьего благосклонного присутствия «Божье благоволение» ясно передаёт контекстуальный смысл, а традиционный вариант «благодать» сохранён в сноске.
- source_word: ἦν ἐπ’ αὐτό
  choice: было на нём
  rationale: Сочетание εἰμί с ἐπί выражает пребывание на ком-либо. «Было на нём» сохраняет образ и естественную библейскую выразительность.
theological_decisions:
- issue: Передача χάρις θεοῦ в описании человеческого взросления Иисуса
  choice: Божье благоволение
  alternative: Божья благодать
  rationale: «Благоволение» непосредственно выражает Божью благосклонность к ребёнку, не устраняя при этом более широкого значения χάρις. Лексически допустимое и традиционное «благодать» дано в сноске, чтобы сохранить смысловую широту оригинала без навязывания определённого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность и плавность греческой фразы; устаревшие «дитя», «возрастал» и добавление отсутствующего в SBLGNT слова «духом» не используются.
