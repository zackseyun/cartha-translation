  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: ru
  text: И отец Его, и мать дивились тому, что о Нём говорили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески: «отец Его». В повествовании так назван Иосиф в обычном семейном и правовом смысле; в некоторых переводах стоит «Иосиф и мать Его», чтобы избежать недоразумения ввиду ранее изложенного Лукой девственного зачатия Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: отец Его
  rationale: Прямо передаёт греческое выражение «его отец», не заменяя его именем Иосиф и не устраняя присущую повествованию напряжённость.
- source_word: μήτηρ
  choice: мать
  rationale: Обычный и естественный русский эквивалент; вместе с «отец Его» образует парное обозначение родителей.
- source_word: ἦν ... θαυμάζοντες
  choice: дивились
  rationale: Русское несовершенное прошедшее передаёт продолженное состояние/действие перифрастического имперфекта и сохраняет оттенок изумления.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: тому, что говорили
  rationale: Естественно передаёт содержание высказываний. Неопределённо-личная конструкция сохраняет отсутствие названного деятеля в греческой пассивной форме.
- source_word: περὶ αὐτοῦ
  choice: о Нём
  rationale: Стандартный контекстуальный эквивалент περί с родительным падежом; местоимение оформлено с прописной буквы по русской библейской издательской традиции.
theological_decisions:
- issue: Название Иосифа «отцом» Иисуса при ранее изложенном девственном зачатии
  choice: Сохранить в основном тексте буквальное «отец Его» и пояснить обычный семейно-правовой смысл в сноске.
  alternative: «Иосиф и мать Его» или пояснение «Его отец, то есть Иосиф» непосредственно в тексте.
  rationale: Греческий текст прямо называет его «отцом». Лука употребляет это семейное обозначение в повествовательном смысле, не отменяя ранее сообщённого девственного зачатия; перевод не должен молча гармонизировать формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Дивились» звучит естественно и несколько возвышенно, но остаётся понятным широкому читателю. Порядок «И отец Его, и мать» сохраняет явное καὶ ... καὶ и подчёркивает обоих участников.
