  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: ru
  text: 'и чтобы принести жертву, как сказано в Законе Господа: «пару горлиц или двух молодых голубей»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как было сказано в Законе Господа».'
    reason: Возможная передача временного оттенка греческого перфектного причастия.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: чтобы принести жертву
  rationale: Артикулированный инфинитив выражает цель, а сочетание δίδωμι с θυσία естественно передаётся по-русски устойчивым выражением «принести жертву».
- source_word: κατὰ τὸ εἰρημένον
  choice: как сказано
  rationale: Перфектное страдательное причастие указывает на сказанное, сохраняющее силу; настоящее «как сказано» естественно выражает это применительно к тексту Закона и не добавляет толкования «предписано».
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: в Законе Господа
  rationale: νόμος здесь обозначает Моисеев Закон как Писание; κύριος передано традиционным и прозрачным словом «Господь».
- source_word: ζεῦγος τρυγόνων
  choice: пару горлиц
  rationale: ζεῦγος означает пару, а τρυγών — именно горлицу; видовое значение сохранено.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: двух молодых голубей
  rationale: νοσσός обозначает молодую птицу, а περιστερά — голубя; формулировка ясна и соответствует языку жертвоприношения.
theological_decisions:
- issue: Передача κύριος в формуле, относящейся к Божьему Закону
  choice: Господа
  alternative: ГОСПОДА
  rationale: Греческий текст содержит κύριος; «Господа» сохраняет обычную новозаветную передачу, не подменяя её реконструкцией древнееврейского тетраграмматона.
- issue: Временной оттенок κατὰ τὸ εἰρημένον
  choice: как сказано
  alternative: как было сказано
  rationale: Перфект допускает акцент как на предшествующем высказывании, так и на его сохраняющейся силе. Основной текст естественно подчёркивает действующий текст Закона, а альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Цитата из Закона выделена кавычками; синтаксическая связь с предыдущим стихом сохранена начальным «и чтобы».
