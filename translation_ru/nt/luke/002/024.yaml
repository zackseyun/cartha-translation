  source_fidelity: Текст точно передаёт целевое значение артиклированного инфинитива τοῦ δοῦναι («и чтобы принести»), жертвенный смысл θυσίαν и формулу κατὰ τὸ εἰρημένον («как сказано»). «В Законе Господа» соответствует ἐν τῷ νόμῳ κυρίου. «Пару горлиц или двух молодых голубей» верно отражает ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν, сохраняя различие между горлицами и молодыми голубями.
