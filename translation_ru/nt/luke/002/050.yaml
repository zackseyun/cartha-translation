  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: ru
  text: А они не поняли сказанного им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слова», «высказывания» или «того, о чём Он говорил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Но
  rationale: В данном контексте простой греческий связующий союз вводит реакцию родителей, контрастирующую с предшествующими словами Иисуса; русское «но» естественно передаёт этот дискурсивный переход, не меняя содержания.
- source_word: αὐτοὶ
  choice: они
  rationale: Местоимение относится к родителям Иисуса. Отдельное «сами» в русском придало бы ненужное усиление.
- source_word: οὐ συνῆκαν
  choice: не поняли
  rationale: Прямой и естественный эквивалент, выражающий отсутствие понимания без смягчения до «не вполне поняли» и без подмены неприятием.
- source_word: τὸ ῥῆμα
  choice: сказанного
  rationale: Субстантивированное «сказанного» естественно обозначает конкретные только что произнесённые слова Иисуса; при этом сноска сохраняет более широкий диапазон значения ῥῆμα.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: им
  rationale: Смысл относительного оборота «которое Он сказал им» естественно и без потери референции включён в русское «сказанного им», что позволяет избежать тяжеловесного повтора.
theological_decisions:
- issue: Реакция родителей Иисуса на Его слова
  choice: Прямо сказано, что они не поняли сказанного им.
  alternative: «Они не вполне поняли» или «они не приняли Его слов».
  rationale: Греческий текст утверждает отсутствие понимания, не уточняя его степень и не говоря о неприятии. Формулировка сохраняет повествовательное и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная формулировка. Относительное предложение свёрнуто в причастную конструкцию без смысловой потери.
