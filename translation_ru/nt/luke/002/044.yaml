base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: ru
  text: Полагая, что Он находится в группе путников[a], они прошли дневной путь и стали искать Его[b] среди родственников и знакомых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в караване» — то есть в группе людей, путешествовавших вместе.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий имперфект также можно передать: «они искали Его», подчёркивая длительность поисков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: полагая
  rationale: Передаёт сделанное Марией и Иосифом предположение, не представляя его как уверенное знание.
- source_word: δὲ
  choice: же
  rationale: Мягко обозначает развитие повествования и контраст с тем, что Иисус в действительности остался в Иерусалиме.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: находится среди путников
  rationale: Естественно передаёт пребывание в группе людей, совместно совершающих путь, без лишних культурных ассоциаций слова «караван».
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: прошли дневной путь
  rationale: Кратко и естественно передаёт греческий оборот о расстоянии, преодолённом за один день пути.
- source_word: ἀνεζήτουν
  choice: стали искать
  rationale: Имперфект допускает начинательное прочтение и одновременно подразумевает продолжавшиеся поиски.
- source_word: συγγενεῦσιν
  choice: родственников
  rationale: Точно и нейтрально обозначает широкий круг родных.
- source_word: γνωστοῖς
  choice: знакомых
  rationale: Передаёт людей, которых они знали, не сужая значение до близких друзей.
