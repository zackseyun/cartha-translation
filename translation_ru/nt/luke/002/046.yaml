id: LUK.2.46
reference: Luke 2:46
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: ru
  text: 'Через три дня они нашли Его в храме[a]: Он сидел среди учителей, слушал их и задавал им вопросы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает весь храмовый комплекс, а не только внутреннее святилище.
    reason: cultural_note
  - marker: b
    text: 'Или: «расспрашивал их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: не передано отдельным оборотом
  rationale: Луканская повествовательная формула в данном контексте естественно выражается по-русски самим продолжением рассказа; буквальное «и случилось» было бы тяжеловесным.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: через три дня
  rationale: Точно и естественно передаёт временную последовательность, обозначенную μετά с винительным падежом.
- source_word: εὗρον
  choice: нашли
  rationale: Прямое и естественное соответствие повествовательному аористу.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Обычное русское обозначение храмового комплекса; примечание уточняет отличие ἱερόν от внутреннего святилища.
- source_word: καθεζόμενον
  choice: Он сидел
  rationale: Передаёт наблюдаемое продолжающееся положение Иисуса в момент, когда Его нашли.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: среди учителей
  rationale: Сохраняет общность греческого διδάσκαλοι и не добавляет отсутствующее в тексте уточнение «Закона».
- source_word: ἀκούοντα αὐτῶν
  choice: слушал их
  rationale: Передаёт внимательное участие, а не только физическое восприятие речи.
- source_word: ἐπερωτῶντα αὐτούς
  choice: задавал им вопросы
  rationale: Естественно передаёт продолжающееся вопрошание без ненужного оттенка допроса или конфронтации.
theological_decisions:
- issue: Характер общения Иисуса с учителями
  choice: «слушал их и задавал им вопросы»
  alternative: «расспрашивал их» или «вопрошал их»
  rationale: Формулировка показывает активное участие в беседе, не умаляя мудрости Иисуса и не представляя Его поведение как спор или испытание учителей.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двоеточие естественно связывает обнаружение Иисуса с описанием того, что Он делал. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции, без добавления толковательного содержания.
