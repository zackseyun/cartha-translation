id: LUK.2.3
reference: Luke 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: ru
  text: И все отправлялись на перепись, каждый в свой город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: отправлялись
  rationale: Имперфект передаёт происходившее в тот период массовое движение; форма множественного числа естественно согласуется с «все».
- source_word: πάντες
  choice: все
  rationale: Прямое и естественное соответствие греческому πάντες без добавления отсутствующего в тексте существительного.
- source_word: ἀπογράφεσθαι
  choice: на перепись
  rationale: В контексте указа о переписи оборот ясно обозначает официальную регистрацию и по-русски звучит естественнее буквального «чтобы зарегистрироваться».
- source_word: ἕκαστος
  choice: каждый
  rationale: 'Сохраняет дистрибутивный смысл: все отправлялись по отдельности в соответствующий им город.'
- source_word: ἑαυτοῦ
  choice: свой
  rationale: Русское возвратно-притяжательное местоимение точно соотносит город с подлежащим «каждый», не требуя отдельного указания грамматического рода.
- source_word: πόλιν
  choice: город
  rationale: Обычное соответствие πόλις; более толковательное «родной город» добавляло бы отсутствующее определение.
theological_decisions:
- issue: Род и число в выражении ἕκαστος ... ἑαυτοῦ
  choice: «каждый в свой город»
  alternative: «каждый в его собственный город»
  rationale: Греческая конструкция имеет мужской род и единственное число, однако русское «каждый в свой» сохраняет и единственное число, и грамматический мужской род, оставаясь при этом естественным. Вариант с «его» по-русски двусмыслен и менее точен.
- issue: Характер города, в который направлялся каждый
  choice: «свой город»
  alternative: «родной город» или «город предков»
  rationale: Сам стих говорит лишь τὴν ἑαυτοῦ πόλιν. Уточнения «родной» и «предков» толковательны и потому не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет дистрибутивную структуру оригинала. «Отправлялись на перепись» понятно обычному читателю и соответствует официальному контексту, не перегружая стих канцелярским оборотом.
