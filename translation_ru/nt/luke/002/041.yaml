id: LUK.2.41
reference: Luke 2:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: ru
  text: Каждый год его родители ходили в Иерусалим на праздник Пасхи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: ходили
  rationale: Имперфект в сочетании с κατ’ ἔτος выражает обычное, регулярно повторявшееся действие в прошлом. Русское «ходили» естественно передаёт такую привычную поездку, не обязательно указывая на пешее передвижение.
- source_word: γονεῖς
  choice: родители
  rationale: Прямое и естественное соответствие греческому существительному во множественном числе.
- source_word: κατ’ ἔτος
  choice: каждый год
  rationale: 'Естественно передаёт распределительное значение оборота: действие повторялось из года в год.'
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
- source_word: τῇ ἑορτῇ
  choice: на праздник
  rationale: В контексте движения дательный падеж обозначает повод и цель путешествия; «на праздник» идиоматично выражает это по-русски.
- source_word: τοῦ πάσχα
  choice: Пасхи
  rationale: Устоявшееся русское название иудейского праздника; родительный падеж зависит от слова «праздник».
theological_decisions:
- issue: Обозначение членов семьи Иисуса
  choice: его родители
  alternative: его отец и мать
  rationale: Греческий текст прямо говорит «его родители». Такой перевод сохраняет обычный повествовательный смысл и не вводит дополнительных уточнений в отношении девственного зачатия, о котором Лука говорит в другом месте.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная формулировка. Порядок слов слегка перестроен ради русской идиоматики, при этом повторяемость действия и цель ежегодного пути сохранены.
