  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: ru
  text: И ему было открыто Святым Духом, что он не увидит смерти, прежде чем увидит Мессию Господа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «Христа Господня».'
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: было открыто
  rationale: Пассивная форма обозначает полученное свыше сообщение; по-русски «было открыто» естественно передаёт откровение, а прямо названный далее Святой Дух указывает на его источник.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: Святым Духом
  rationale: ὑπό с родительным падежом обозначает личного деятеля; русский творительный падеж естественно и точно передаёт эту функцию.
- source_word: μὴ ἰδεῖν θάνατον
  choice: не увидит смерти
  rationale: Сохранён образный оборот исходного текста; он понятен и допустим в современном литературном русском языке.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: прежде чем увидит
  rationale: Конструкция обозначает событие, которое должно произойти раньше смерти Симеона; данная формулировка естественно передаёт временную последовательность и будущую направленность.
- source_word: τὸν χριστὸν κυρίου
  choice: Господнего Мессию
  rationale: Χριστός здесь является мессианским титулом и передаётся словом «Мессия»; зависимость от κυρίου естественно выражена прилагательным «Господнего», без устранения возможного оттенка принадлежности или посланничества.
- source_word: κυρίου
  choice: Господнего
  rationale: Форма сохраняет значение «принадлежащий Господу / посланный Господом» и звучит естественнее буквального «Мессию Господа».
theological_decisions:
- issue: Передача Χριστός как мессианского титула
  choice: Мессия
  alternative: Христос
  rationale: В сочетании τὸν χριστὸν κυρίου слово функционирует как титул Помазанника Господа, а не как имя; «Мессия» ясно сохраняет этот ветхозаветно-мессианский смысл. Традиционная передача указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён понятный образ «увидеть смерть»; порядок слов сделан естественным для русского языка.
