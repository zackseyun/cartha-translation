source:
  edition: SBLGNT
  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: ru
  text: А Мария бережно хранила все эти слова[a], размышляя над ними в своём сердце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё это»; греческое слово может обозначать как сказанные слова, так и связанные с ними события или обстоятельства.'
    reason: lexical_alternative
  - marker: b
    text: Буквально выражение может подразумевать, что Мария сопоставляла эти слова или складывала их воедино в своём сердце.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Передаёт мягкий переход и оттенок противопоставления между общей реакцией окружающих и внутренней реакцией Марии; в современном русском повествовании звучит естественнее, чем более резкое «но».
- source_word: Μαρία
  choice: Мария
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: πάντα συνετήρει
  choice: бережно хранила все
  rationale: Имперфект συνετήρει указывает на продолжающееся действие, а глагол — на внимательное сохранение. «Бережно хранила» передаёт не простое запоминание, а заботливое удержание в памяти и внутренней жизни.
- source_word: τὰ ῥήματα ταῦτα
  choice: эти слова
  rationale: В ближайшем контексте речь идёт о сообщении пастухов; «слова» прямо передаёт речевое значение ῥήματα, при этом в сноске сохранено возможное более широкое значение «всё это».
- source_word: συμβάλλουσα
  choice: размышляя над ними
  rationale: Естественно передаёт внутреннее обдумывание, не утверждая, что Мария уже полностью поняла смысл. Возможный образ сопоставления и соединения отдельных сведений сохранён в сноске.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: в своём сердце
  rationale: Сохраняет библейскую метафору сердца как средоточия мысли, памяти и чувства и при этом понятно современному читателю.
theological_decisions:
- issue: Характер реакции Марии
  choice: Мария бережно сохраняет услышанное и продолжает размышлять над ним.
  alternative: Мария лишь запомнила события или уже полностью постигла их значение.
  rationale: Сочетание συνετήρει и συμβάλλουσα говорит как о сохранении, так и об осмыслении, но не утверждает ни простого воспоминания, ни полного понимания. Перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; традиционный образ сердца сохранён, а менее очевидные оттенки греческих слов вынесены в краткие сноски.
