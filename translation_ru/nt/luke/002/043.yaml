    rationale: Греческое ἐν τῷ ὑποστρέφειν обозначает обстоятельство, на фоне которого Иисус остался; «когда они возвращались» ближе к исходной конструкции, чем «они отправились в обратный путь».
  - severity: low
    issue: Слово «отрок» не вполне соответствует заявленному современному литературному регистру.
    rationale: Хотя оно традиционно для библейского стиля, в современном русском оно архаично. «Мальчик» передаёт ὁ παῖς без потери возрастного смысла.
  - severity: low
    issue: Маркер лексической альтернативы стоит после названия места, а не при переводе ὑπέμεινεν.
    rationale: Примечание «задержался» поясняет глагол «остался», поэтому его следует поставить сразу после этого слова.
