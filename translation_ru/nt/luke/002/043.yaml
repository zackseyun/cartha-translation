base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: ru
  text: После окончания праздничных дней, когда они возвращались, мальчик Иисус остался[a] в Иерусалиме, а Его родители этого не знали.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «задержался».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Его родители». Обычный семейный язык Луки здесь не отрицает девственного зачатия, о котором сказано ранее в Евангелии.'
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: когда праздничные дни закончились
  rationale: Генитив абсолютный обозначает завершившееся обстоятельство, предшествующее основному действию. Слово «праздничные» ясно передаёт подразумеваемые дни Пасхи из ближайшего контекста, не уточняя их число.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: и они отправились в обратный путь
  rationale: Конструкция с ἐν и субстантивированным инфинитивом выражает одновременность; по-русски начало возвращения естественно передаётся как отправление в обратный путь.
- source_word: ὑπέμεινεν
  choice: остался
  rationale: В данном контексте глагол означает, что Иисус остался в Иерусалиме, когда остальные ушли; вариант «задержался» сохранён в примечании как возможный смысловой оттенок.
- source_word: ὁ παῖς
  choice: отрок
  rationale: В непосредственном контексте Иисусу двенадцать лет. «Отрок» точно обозначает мальчика этого возраста и сохраняет достоинство библейского повествования, хотя имеет слегка возвышенную окраску.
- source_word: ἐν Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: Обычное локативное употребление ἐν с названием места.
- source_word: οὐκ ἔγνωσαν
  choice: этого не знали
  rationale: 'Здесь γινώσκω означает знать или сознавать факт. Указательное «этого» естественно восполняет подразумеваемое содержание: родители не знали, что Иисус остался.'
- source_word: οἱ γονεῖς αὐτοῦ
  choice: Его родители
  rationale: Прямое соответствие греческому γονεῖς; сохраняет обычный семейный язык Луки без богословской гармонизации.
theological_decisions:
- issue: Наименование Марии и Иосифа родителями Иисуса
  choice: Его родители
  alternative: Его мать и Иосиф
  rationale: Греческий текст прямо говорит «Его родители». Такой перевод сохраняет формулировку Луки и напряжение с ранее утверждённым девственным зачатием, не устраняя его поясняющей заменой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским тоном. «Отрок» выбрано как возрастно уместное и достойное обозначение двенадцатилетнего Иисуса. Маркеры обоих примечаний включены в основной текст.
