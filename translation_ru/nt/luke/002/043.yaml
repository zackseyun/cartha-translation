revisions:
- from: Когда праздничные дни закончились и они отправились в обратный путь, отрок Иисус остался в Иерусалиме[a], а Его родители этого не знали.[b]
  to: После окончания праздничных дней, когда они возвращались, мальчик Иисус остался[a] в Иерусалиме, а Его родители этого не знали.[b]
  rationale: Перевод уточнён для передачи одновременного временного значения конструкции «когда они возвращались». «Отрок» заменён на современное литературное «мальчик». Маркер примечания a перенесён к слову, которое оно поясняет, а формулировка самой альтернативы сокращена до непосредственного соответствия глаголу; смысл текста не изменён.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:45:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: речь идёт об окончании праздничных дней, возвращении родителей, пребывании Иисуса в Иерусалиме и их неосведомлённости. Однако «они отправились в обратный путь» несколько сильнее подчёркивает начало пути и ослабляет одновременное значение греческой конструкции ἐν τῷ ὑποστρέφειν («когда/в то время как они возвращались»).'
  naturalness: Текст в целом понятен, но «отрок» имеет заметно архаическую и церковнославянизированную окраску. Для современного литературного русского возрастно и стилистически естественнее «мальчик».
  terminology: «Его родители» точно передаёт οἱ γονεῖς αὐτοῦ и должно быть сохранено. Примечание b корректно поясняет, а не заменяет формулировку текста. Альтернативу к ὑπέμεινεν следует привязать непосредственно к слову «остался».
