  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: ru
  text: 'Он сказал им: «Зачем вы искали Меня? Разве вы не знали, что Мне надлежит быть в доме Моего Отца?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Мне надлежит заниматься делами Моего Отца»; букв. «быть в том, что принадлежит Моему Отцу». Греческое выражение эллиптично и может указывать как на дом Отца, так и на Его дела.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Зачем
  rationale: Греческий оборот вводит вопрос о причине. «Зачем» естественно звучит по-русски в данном контексте и передаёт вопросительный смысл.
- source_word: ἐζητεῖτέ
  choice: вы искали Меня
  rationale: ζητέω здесь обозначает поиски пропавшего человека; «искали» — прямой и естественный русский эквивалент.
- source_word: οὐκ ᾔδειτε
  choice: Разве вы не знали
  rationale: Отрицательный риторический вопрос естественно передаётся частицей «разве» и сохраняет значение знания или осведомлённости.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: в доме Моего Отца
  rationale: Выражение эллиптично, буквально — «в [том, что принадлежит] Моему Отцу». Храмовый контекст поддерживает значение «в доме Моего Отца», а иное возможное понимание сохранено в сноске.
- source_word: δεῖ
  choice: Мне надлежит
  rationale: δεῖ выражает необходимость, в данном контексте имеющую особый, вероятно божественный характер. «Надлежит» сохраняет вес этой необходимости и соответствует достоинству речи.
- source_word: εἶναί με
  choice: быть
  rationale: Инфинитив с субъектом в винительном падеже после δεῖ естественно передаётся конструкцией «Мне надлежит быть».
- source_word: πατρός μου
  choice: Моего Отца
  rationale: В храмовом контексте Иисус называет Отцом Бога, а не Иосифа. Прописная буква соответствует русской религиозной письменной традиции и ясно передаёт эту отсылку.
theological_decisions:
- issue: Эллиптическое выражение ἐν τοῖς τοῦ πατρός μου
  choice: 'В основном тексте: «в доме Моего Отца»'
  alternative: «заниматься делами Моего Отца» / «быть среди того, что принадлежит Моему Отцу»
  rationale: Непосредственный контекст храма поддерживает пространственное понимание, однако грамматически выражение допускает также значение дел или забот Отца. Подлинная неоднозначность отмечена в сноске.
- issue: Кого обозначает «Мой Отец»
  choice: Бога
  alternative: Иосифа
  rationale: Место действия — храм — и противопоставление родителям, искавшим Иисуса, указывают, что здесь Он говорит о Боге как о Своём Отце. Перевод не добавляет дальнейшего догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Иисусу и Богу, написаны с прописной буквы в соответствии с принятой русской религиозной традицией. Маркер сноски поставлен непосредственно после неоднозначного выражения.
