  source_fidelity: Первая деепричастная конструкция «не найдя Его» точно передаёт μὴ εὑρόντες. Однако «и стали искать Его» превращает ἀναζητοῦντες, настоящее причастие сопутствующего действия, в новое последующее действие с оттенком начала; также исходный связующий καί в переводе не отражён. Лучше сохранить поиск как действие, сопровождающее возвращение.
  naturalness: «И, не найдя Его, они вернулись в Иерусалим, разыскивая Его» — литературная и ясная русская фраза. Повтор местоимения соответствует оригиналу и не звучит неестественно в кратком повествовательном контексте.
  terminology: «Иерусалим» и «разыскивая» употреблены точно. Прописное «Его» сохраняет принятое в данном проекте библейское оформление и не вносит богословского истолкования.
