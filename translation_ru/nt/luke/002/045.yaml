lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Союз передаёт простой повествовательный переход; по-русски его естественно присоединить к сказуемому «стали искать».
- source_word: μὴ εὑρόντες
  choice: не найдя
  rationale: Краткий деепричастный оборот естественно передаёт обстоятельственное значение аористного причастия и последовательность событий.
- source_word: ὑπέστρεψαν
  choice: вернулись
  rationale: Точно и литературно передаёт значение возвращения.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Нормальное русское обозначение направления движения к городу.
- source_word: ἀναζητοῦντες
  choice: стали искать
  rationale: Передаёт продолжающееся после возвращения целенаправленное разыскивание; глагол ἀναζητέω здесь конкретен, а русская конструкция естественна для повествования.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому достоинственному библейскому оформлению, не меняя смысла оригинала.
