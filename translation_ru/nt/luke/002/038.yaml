  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: ru
  text: И в тот самый час[a], подойдя, она благодарила Бога[b] и говорила о нём[c] всем, кто ожидал искупления Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тот же час».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий глагол может обозначать и благодарение, и хвалу; возможно: «воздавала хвалу Богу».'
    reason: lexical_alternative
  - marker: c
    text: По контексту «о нём», вероятнее всего, относится к младенцу Иисусу, хотя ближайшее явно названное в греческом тексте лицо — Бог.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: в тот самый час
  rationale: Временной дательный указывает на момент действия, а αὐτῇ подчёркивает совпадение во времени и непосредственность происходящего.
- source_word: ἐπιστᾶσα
  choice: подойдя
  rationale: Причастие аориста описывает появление Анны у происходящего; «подойдя» естественно передаёт приближение, не уточняя лишних деталей.
- source_word: ἀνθωμολογεῖτο
  choice: благодарила
  rationale: Имперфект передаёт продолжавшееся действие; глагол допускает значения благодарения и хвалы. «Благодарила Бога» естественно сочетается с дательным τῷ θεῷ и не добавляет прямо не выраженное значение начала действия.
- source_word: τῷ θεῷ
  choice: Бога
  rationale: Русское управление глагола «благодарить» требует винительного падежа; греческий артикль отдельно не передаётся.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: говорила о нём
  rationale: Имперфект обозначает продолжавшуюся речь. Местоимение сохранено, чтобы не устранять неоднозначность его отнесения.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: всем, кто ожидал
  rationale: προσδέχομαι здесь выражает исполненное надежды ожидание; простой русский оборот сохраняет этот смысл в контексте.
- source_word: λύτρωσιν
  choice: искупления
  rationale: λύτρωσις означает освобождение или избавление и несёт богословски значимый оттенок искупления; выбранное слово сохраняет широту ожидания Божьего спасительного действия.
- source_word: Ἰερουσαλήμ
  choice: Иерусалима
  rationale: Нормальная русская форма географического названия в родительном падеже после «искупления».
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении «говорила о нём»
  choice: Местоимение сохранено без замены на имя; по контексту наиболее естественным референтом является младенец Иисус.
  alternative: Местоимение можно соотнести с Богом как с ближайшим явно названным референтом.
  rationale: Сохранение местоимения следует греческому тексту и не снимает реальной синтаксической неоднозначности, тогда как повествовательный контекст сосредоточен на младенце.
- issue: Смысл выражения «искупление Иерусалима»
  choice: Фраза передана буквально и ёмко как «искупление Иерусалима».
  alternative: Возможно «избавление Иерусалима», с акцентом на освобождение.
  rationale: Греческое выражение допускает общинный, спасительный и эсхатологический смысл; перевод не сужает его до исключительно политического или исключительно духовного истолкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным библейским звучанием. Формы «подойдя», «благодарила» и «говорила» доступны широкому читателю; местоимение написано со строчной буквы, чтобы не вносить в графику дополнительного толкования его референта.
