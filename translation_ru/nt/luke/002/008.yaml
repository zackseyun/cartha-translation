  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: ru
  text: В той же местности были пастухи, которые ночевали под открытым небом[a] и несли ночную стражу[b] у своего стада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жили в поле». Греческий глагол подчёркивает, что пастухи проводили ночь вне помещения, под открытым небом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «соблюдали ночные стражи у своего стада». Это выражение может подразумевать дежурство по сменам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: пастухи
  rationale: Обычное и точное русское обозначение людей, пасущих овец; более широкое «скотоводы» здесь менее уместно.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: в той же местности
  rationale: χώρα обозначает местность, округ или сельскую область; «местность» естественно связывает сцену с окрестностями, упомянутыми ранее.
- source_word: ἀγραυλοῦντες
  choice: ночевали под открытым небом
  rationale: Глагол указывает на пребывание ночью вне дома, в поле; перевод сохраняет ночной и открытый характер стоянки без излишней конкретизации.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτός
  choice: по ночам поочерёдно стерегли
  rationale: Однокоренная конструкция буквально говорит о несении ночных страж; «поочерёдно» естественно передаёт вероятный смысл смен ночного караула, отмеченный в примечании.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: своё стадо
  rationale: В сочетании с «стерегли» русский винительный оборот естественно передаёт наблюдение и охрану стада, находившегося под их попечением.
- source_word: Καὶ
  choice: опущено как самостоятельный союз
  rationale: В современном русском повествовании начало новой сцены без «и» звучит естественнее, при этом связь с предшествующим контекстом сохраняется выражением «в той же местности».
- source_word: ἦσαν
  choice: были
  rationale: Экзистенциальное значение εἰμί передано естественной русской конструкцией «были пастухи».
