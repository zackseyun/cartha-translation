id: LUK.2.10
reference: Luke 2:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: ru
  text: 'И ангел сказал им: «Не бойтесь, ибо вот, я возвещаю вам великую радость, которая будет всему народу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем людям». Буквально по-гречески: «всему народу»; у Луки слово «народ» в подобных контекстах нередко обозначает определённый народ.'
    reason: Альтернативное понимание объёма παντὶ τῷ λαῷ.
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: ангел
  rationale: Определённость устанавливается предшествующим контекстом; в русском языке при отсутствии артикля она передаётся контекстуально, без добавления указательного слова.
- source_word: Μὴ φοβεῖσθε
  choice: Не бойтесь!
  rationale: Естественный современный русский запрет, точно передающий форму множественного числа и смысл греческого императива с μή.
- source_word: ἰδοὺ γὰρ
  choice: Вот,
  rationale: «Вот» сохраняет функцию ἰδού как торжественного маркера привлечения внимания; причинная связь γάρ понятна из контекста и естественно выражена бессоюзным пояснением после призыва не бояться.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: я возвещаю вам
  rationale: «Возвещаю» передаёт объявление благой вести в достойном, но понятном регистре; дательное ὑμῖν выражено словом «вам».
- source_word: χαρὰν μεγάλην
  choice: великую радость
  rationale: Сохраняет прямой объект греческого глагола и торжественную силу определения μεγάλην; в данном контексте смысл благой вести раскрывается как великая радость.
- source_word: ἥτις ἔσται
  choice: которая будет
  rationale: Сохраняет относительную конструкцию и будущность, не уточняя сверх текста, каким именно образом эта радость будет принадлежать народу.
- source_word: παντὶ τῷ λαῷ
  choice: всему народу
  rationale: Сохраняет определённый, собирательный смысл греческого выражения; в ближайшем повествовательном контексте вероятнее имеется в виду весь народ Израиля, а не прямо все народы человечества.
theological_decisions:
- issue: Объём значения παντὶ τῷ λαῷ
  choice: всему народу
  alternative: всем людям
  rationale: Артикль при λαός и словоупотребление Луки поддерживают отнесение к определённому народу, вероятнее всего к Израилю в ближайшем контексте. Перевод не должен преждевременно универсализировать эту фразу, хотя более широкая тема спасения народов раскрывается далее у Луки.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Возвещаю» предпочтено разговорному «сообщаю», а «великую радость» — стилистически плоскому «большую радость». Пунктуация подчёркивает утешительное восклицание и последующее объяснение.
