lexical_decisions:
- source_word: Ἀνέβη
  choice: поднялся
  rationale: Сохраняет греческое обозначение движения «вверх» при путешествии из Галилеи в Иудею и не сводит его к нейтральному «отправился».
- source_word: δὲ καὶ
  choice: И … также
  rationale: Передаёт лёгкую повествовательную связь δὲ и добавочное значение καὶ без чрезмерного усиления.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: из Галилеи, из города Назарета
  rationale: Сохраняет последовательное указание области и конкретного населённого пункта; «город» соответствует πόλις и звучит естественно в данном обороте.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: в Иудею
  rationale: Стандартное современное название исторической области римского времени.
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: в город Давида, называемый Вифлеемом
  rationale: Сохраняет связь Вифлеема с Давидом и пояснительную функцию относительной конструкции, но выражает её естественным русским причастным оборотом.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: потому что происходил
  rationale: Передаёт причинное значение конструкции с διά и инфинитивом; глагол «происходил» естественно вводит указание на родовую принадлежность.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: из дома и рода Давида
  rationale: 'Различает два связанных понятия: династический «дом» и родовое происхождение; краткая формулировка сохраняет их параллелизм.'
theological_decisions:
- issue: Давидово происхождение Иосифа
  choice: из дома и рода Давида
  alternative: принадлежал к дому и родовой линии Давида
  rationale: Сохранены оба греческих термина, οἶκος и πατριά, без их слияния и без добавления выводов о значении происхождения Иосифа за пределами самого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Поднялся» сохраняет географический оттенок исходного глагола, а «дом и род» — краткость и династическую окраску греческой формулировки.
