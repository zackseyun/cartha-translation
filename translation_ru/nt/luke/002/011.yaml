  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: ru
  text: потому что сегодня в городе Давида родился для вас Спаситель — Мессия, Господь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции: «Христос Господь». Греческие титулы χριστὸς κύριος буквально означают «Мессия, Господь»; возможно также понимание «Мессия Господень».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт пояснительно-причинную связь с ангельской вестью предыдущего стиха; естественно для современного русского языка.
- source_word: ἐτέχθη
  choice: родился
  rationale: Аорист пассива от τίκτω в данном контексте естественно передаётся русским глаголом прошедшего времени «родился».
- source_word: ὑμῖν
  choice: для вас
  rationale: Дательный обозначает пользу для адресатов; «для вас» яснее передаёт благую весть, чем «вам».
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой и современный эквивалент временного наречия.
- source_word: σωτήρ
  choice: Спаситель
  rationale: Устоявшийся и точный русский эквивалент, сохраняющий смысл избавления и мессианское звучание.
- source_word: ὅς ἐστιν
  choice: —
  rationale: В русском именная идентификация естественно выражается тире без явной связки «есть»; смысл относительного оборота сохраняется.
- source_word: χριστός
  choice: Мессия
  rationale: Здесь слово выступает как титул Давидова Помазанника, а не как личное имя; «Мессия» раскрывает его значение современному читателю.
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет титул власти и его сильный богословский вес; «господин» в данном исповедальном контексте недостаточно точно.
- source_word: ἐν πόλει Δαυίδ
  choice: в городе Давида
  rationale: Формально и естественно передаёт предложную конструкцию и сохраняет связь с Давидовой царской линией.
theological_decisions:
- issue: Передача χριστὸς κύριος
  choice: Мессия, Господь
  alternative: Христос Господь; Мессия Господень
  rationale: Два именительных титула наиболее прямо понимаются как приложения к «Спаситель». Запятая по-русски ясно показывает два соотнесённых титула и не превращает сочетание в неестественное «Мессия Господь». Вариант «Мессия Господень» возможен как иное синтаксическое истолкование, но менее непосредственно следует форме греческого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского провозглашения. Порядок «в городе Давида» поставлен перед сказуемым ради естественного присоединения заключительных титулов к слову «Спаситель»; тире устраняет тяжеловесное «который есть».
