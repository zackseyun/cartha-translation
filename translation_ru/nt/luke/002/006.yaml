  text: Пока они были там, настало ей время родить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Пока…
  rationale: Оборот служит для перехода к следующему событию; отдельное «и случилось» в современном русском было бы тяжеловесным. Связь повествования естественно передаётся временной конструкцией.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: Пока они были там
  rationale: Конструкция с ἐν и субстантивированным инфинитивом выражает одновременность; этот перевод точен и естественен по-русски.
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: настало … время
  rationale: Греческая идиома буквально говорит, что «исполнились дни». В данном контексте естественный русский эквивалент сообщает о наступлении срока, не добавляя богословского толкования.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: ей время родить
  rationale: Субъект инфинитива αὐτήν передан местоимением «ей», а τίκτω — ясным и современным глаголом «родить».
theological_decisions:
- issue: Возможный оттенок назначенного или провиденциального срока в ἐπλήσθησαν αἱ ἡμέραι
  choice: настало ей время родить
  alternative: исполнились дни, когда ей надлежало родить
  rationale: Выбранный перевод передаёт завершение срока беременности и не превращает возможный оттенок исполнения в явное утверждение о предопределении. Более буквальный вариант звучит по-русски архаично и может необоснованно усиливать модальность.
translation_notes:
  register: Современный литературный русский; краткая, плавная повествовательная фраза без архаизмов. Смысл греческой временной конструкции сохранён, а идиома о «наполнившихся днях» передана естественным русским выражением.
