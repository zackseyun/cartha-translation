base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: ru
  text: и была вдовой в возрасте восьмидесяти четырёх лет[a]. Она не отходила от храма[b], служа Богу постами и мольбами[c] ночь и день.
  philosophy: optimal-equivalence
  footnotes:
