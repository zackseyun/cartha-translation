    text: 'Или: «и была вдовой восемьдесят четыре года». Греческий текст может указывать либо на возраст Анны, либо на продолжительность её вдовства.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово обозначает весь храмовый комплекс с его дворами, а не только внутреннее святилище.
    reason: cultural_note
  - marker: c
    text: 'Или: «прошениями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: вдовой
  rationale: Обычное обозначение женщины, чей муж умер; здесь продолжает характеристику Анны из предыдущего стиха.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: до восьмидесяти четырёх лет
  rationale: Сжатая греческая конструкция в основном тексте понята как указание на возраст Анны; формулировка по-русски остаётся естественной, а возможное указание на продолжительность вдовства вынесено в сноску.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: не отходила от храма
  rationale: Имперфект передаёт постоянный, привычный образ жизни; выражение не обязательно означает непрерывное физическое пребывание в храмовом комплексе.
- source_word: ἱεροῦ
  choice: храма
  rationale: ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; обычное русское «храм» сохранено в тексте, уточнение дано в сноске.
- source_word: νηστείαις
  choice: постами
  rationale: Множественное число передаёт неоднократную практику поста и сохраняет форму оригинала.
- source_word: δεήσεσιν
  choice: мольбами
  rationale: Слово обозначает молитвенные просьбы, прошения; «мольбы» естественно передаёт более узкий оттенок, чем общее «молитвы».
- source_word: λατρεύουσα
  choice: служа Богу
  rationale: Причастие описывает религиозное служение и поклонение; добавление подразумеваемого объекта «Богу» делает русскую фразу ясной и соответствует контексту.
- source_word: νύκτα καὶ ἡμέραν
  choice: ночь и день
  rationale: Сохранён порядок греческого текста и устойчивое обозначение постоянной, усердной преданности.
theological_decisions:
- issue: Возраст Анны или продолжительность её вдовства
  choice: Основной текст понимает фразу как указание на то, что Анна достигла восьмидесяти четырёх лет.
  alternative: Она оставалась вдовой восемьдесят четыре года.
  rationale: Греческая синтаксическая конструкция допускает оба толкования. Альтернативное чтение сохранено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет связь с предыдущим стихом; «не отходила» передаёт устойчивость служения, а не навязывает буквальное круглосуточное пребывание. Все сноски размещены непосредственно после соответствующих выражений.
