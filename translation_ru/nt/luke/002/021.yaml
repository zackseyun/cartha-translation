  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: ru
  text: Когда исполнилось восемь дней и настало время обрезать его[a], ему дали имя Иисус[b] — имя, которым назвал его ангел ещё до того, как он был зачат во чреве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда завершились восемь дней, положенные до обрезания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его нарекли Иисусом».'
    reason: lexical_alternative
  - marker: c
    text: То есть во чреве Марии.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: когда исполнилось восемь дней
  rationale: Передаёт завершённость указанного срока и сохраняет характерный для Луки глагол «исполнилось», оставаясь естественным по-русски.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: и настало время обрезать его
  rationale: Артиклевый инфинитив указывает на назначение восьмидневного срока. Такой перевод естественно выражает эту связь по-русски, не превращая действие в отвлечённое существительное.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: ему дали имя Иисус
  rationale: Естественная русская формула наречения сохраняет явное упоминание имени и страдательный смысл греческой конструкции.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Употреблена традиционная и общепринятая русская форма новозаветного личного имени.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: имя, которым назвал его ангел
  rationale: Причастие соотнесено с существительным «имя»; повтор корня «назвал» отражает повтор глагола καλέω, а определённость слова «ангел» сохраняет связь с предшествующим повествованием.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: ещё до того, как он был зачат во чреве
  rationale: Точно передаёт пассивную конструкцию и контекстуальное значение κοιλία как материнского чрева, не добавляя позднейшей богословской терминологии.
theological_decisions:
- issue: Смысл фразы о зачатии Иисуса
  choice: до того, как он был зачат во чреве
  alternative: до его зачатия во чреве
  rationale: Перевод прямо говорит о человеческом зачатии Иисуса в соответствии с греческим текстом, не внося дополнительных христологических уточнений и не устраняя богословскую глубину контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Форма «во чреве» сохранена как понятная и уместная в данном контексте; местоимения, относящиеся к Иисусу, написаны со строчной буквы в соответствии с нейтральной современной издательской практикой и без добавления отсутствующего в греческом тексте конфессионального акцента.
