lexical_decisions:
- source_word: φῶς
  choice: свет
  rationale: Сохраняет образ и естественно звучит в поэтическом описании Младенца; в русском языке артикль не требуется.
- source_word: εἰς ἀποκάλυψιν
  choice: к просвещению
  rationale: Предлог «к» передаёт направленность или предназначение εἰς, а «просвещение» в данном контексте естественно выражает раскрытие истины и сохраняет связь с образом света.
- source_word: ἐθνῶν
  choice: народов
  rationale: Это прямое и ёмкое соответствие греческому слову; контраст с Израилем позволяет понимать здесь народы вне Израиля, не устраняя более широкого лексического значения.
- source_word: δόξαν
  choice: славу
  rationale: Сохраняет смысл славы, чести и величия, а также библейскую богословскую насыщенность слова.
- source_word: λαοῦ σου Ἰσραήλ
  choice: народа Твоего, Израиля
  rationale: Передаёт принадлежность народа Богу и аппозиционное уточнение, что этот народ — Израиль.
- source_word: καὶ
  choice: и
  rationale: Сохраняет параллельную связь между просвещением народов и славой Израиля.
theological_decisions:
- issue: Значение ἐθνῶν в сопоставлении с Израилем
  choice: народов
  alternative: язычников
  rationale: Контекст действительно противопоставляет Израиль прочим народам, однако «народов» точнее сохраняет лексическую широту греческого слова. Сноска поясняет вероятный контекстуальный смысл, не подменяя его в основном тексте.
- issue: Связь ἀποκάλυψις с образом света
  choice: к просвещению
  alternative: для откровения
  rationale: «Просвещение» естественно сочетается со «светом» и в данном контексте выражает открытие истины народам. Вариант «для откровения» формальнее, но по-русски может звучать отвлечённо и оставлять неясным, кому или чему служит откровение.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма песни Симеона. Местоимение «Твоего» написано с прописной буквы как традиционное уважительное обращение к Богу; пунктуация ясно представляет «Израиля» как приложение к слову «народа».
