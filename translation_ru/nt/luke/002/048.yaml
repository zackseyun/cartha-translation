source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: ru
  text: 'Когда они увидели его, то изумились, и мать сказала ему: «Сын, почему ты так поступил с нами? Вот, отец твой и я, страдая[a], искали тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мучаясь»; греческое слово выражает душевную боль и сильную тревогу во время поисков.'
    reason: Лексическая альтернатива, поясняющая эмоциональную силу ὀδυνώμενοι.
lexical_decisions:
- source_word: ἰδόντες
  choice: когда они увидели
  rationale: Аористное причастие естественно передано временным придаточным, сохраняющим последовательность событий.
- source_word: ἐξεπλάγησαν
  choice: изумились
  rationale: Передаёт сильное удивление и при этом звучит естественно в современном литературном русском языке.
- source_word: Τέκνον
  choice: Сын
  rationale: В данном контексте это естественное материнское обращение к мальчику; оно передаёт близость обращения без архаичного «чадо» и без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: почему ты так поступил с нами?
  rationale: Идиоматически передаёт вопрос-упрёк и сохраняет значение οὕτως и направленность действия по отношению к родителям.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественно вводит эмоционально подчёркнутое указание в прямой речи, не прибегая к архаичному «се».
- source_word: ὁ πατήρ σου
  choice: отец твой
  rationale: Сохраняет прямое обозначение Иосифа в словах Марии без истолковывающего уточнения «земной».
- source_word: ὀδυνώμενοι
  choice: страдая
  rationale: Сохраняет причастную форму и явно передаёт эмоциональную боль, а не только беспокойство во время поисков.
- source_word: ἐζητοῦμέν σε
  choice: искали тебя
  rationale: Русский несовершенный вид естественно выражает продолжавшийся в прошлом поиск, завершившийся к моменту речи.
theological_decisions:
- issue: Наименование Иосифа «отцом» Иисуса в связи с божественным сыновством Иисуса
  choice: Сохранить без уточнения слова Марии «отец твой».
  alternative: «твой земной отец»
  rationale: Греческий текст передаёт обычное семейное обозначение Иосифа устами Марии. Добавление «земной» устранило бы намеренное повествовательное напряжение и внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с естественной прямой речью. Местоимения, относящиеся к Иисусу, написаны со строчной буквы как обычные местоимения повествовательного текста; это не выражает богословской оценки. Архаизмы «чадо» и «се» исключены.
