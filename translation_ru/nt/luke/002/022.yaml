  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: ru
  text: Когда же исполнились дни их очищения по закону Моисея[a], они принесли Его в Иерусалим, чтобы представить Господу,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «её очищения».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: исполнились
  rationale: В отношении установленного срока глагол указывает на достижение днями полной меры; «исполнились» сохраняет временной и несколько торжественный оттенок греческого выражения.
- source_word: καθαρισμοῦ
  choice: очищения
  rationale: В контексте закона после рождения ребёнка речь идёт о ритуальном очищении; «очищение» естественно и точно передаёт культово-правовой смысл.
- source_word: αὐτῶν
  choice: их
  rationale: Основной текст SBLGNT содержит местоимение множественного числа, поэтому перевод сохраняет его, не устраняя возникающее в контексте напряжение.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: по закону Моисея
  rationale: Оборот ясно выражает соответствие предписаниям Моисеева закона и естественно звучит по-русски.
- source_word: ἀνήγαγον
  choice: принесли
  rationale: Глагол обозначает доставление ребёнка в Иерусалим; направление вверх не выражено отдельно, поскольку в современном русском «принесли Его в Иерусалим» звучит естественнее, а географически-религиозный оттенок восхождения не требует буквального воспроизведения.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: παραστῆσαι
  choice: представить
  rationale: В данном культово-правовом контексте глагол означает официально представить ребёнка перед Богом; «представить Господу» точно и естественно.
- source_word: κυρίῳ
  choice: Господу
  rationale: Кύριος здесь обозначает Бога; традиционное написание с прописной буквы уместно в современном русском библейском тексте.
theological_decisions:
- issue: Число местоимения в выражении «дни их очищения»
  choice: Сохранить множественное число «их» в основном тексте
  alternative: «дни её очищения»
  rationale: Предоставленный греческий текст читает αὐτῶν («их»). Единственное число согласуется с некоторыми рукописями и непосредственным фоном Лев 12, но не должно молча подменять исходное чтение; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов делает оборот «по закону Моисея» ясным и не перегружает начало стиха; прописное «Его» отражает принятую русскую издательскую традицию в отношении Иисуса.
