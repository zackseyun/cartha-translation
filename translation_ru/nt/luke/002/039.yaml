base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: ru
  text: Когда они совершили всё согласно закону Господа[a], они возвратились в Галилею, в свой город — Назарет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что предписывал закон Господа».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «город»; Назарет был небольшим поселением, поэтому возможен также перевод «городок».
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: когда
  rationale: В сочетании с аористом вводит момент, после которого последовало главное действие; «когда» естественно передаёт временную последовательность, не подчёркивая немедленности.
- source_word: ἐτέλεσαν
  choice: исполнили
  rationale: Здесь глагол означает доведение до конца предписанных действий. «Исполнили» естественно сочетается с законом и не требует добавлять отсутствующее в греческом тексте слово «требования».
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: всё по закону Господа
  rationale: Кратко и близко к греческой конструкции передаёт совокупность того, что соответствовало предписаниям закона; возможный более разъяснительный вариант вынесен в сноску.
- source_word: νόμον κυρίου
  choice: закону Господа
  rationale: Сохраняет библейскую формулу и прямое значение генитивной конструкции.
- source_word: κυρίου
  choice: Господа
  rationale: В данном контексте обозначает Бога как Законодателя; традиционное написание с прописной буквы ясно передаёт референцию, не подменяя κύριος тетраграмматоном.
- source_word: ἐπέστρεψαν
  choice: возвратились
  rationale: Точно передаёт возвращение к прежнему месту и соответствует достоинству повествовательного регистра.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: в Галилею
  rationale: Обычная русская конструкция для обозначения направления движения.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: в свой город
  rationale: Формально сохраняет πόλις как «город» и передаёт возвратное притяжательное ἑαυτῶν словом «свой»; исторический масштаб Назарета поясняется в сноске.
- source_word: Ναζαρέθ
  choice: Назарет
  rationale: Устоявшаяся русская форма географического названия.
theological_decisions:
- issue: Кого обозначает «Господь» в выражении «закон Господа»
  choice: «Господь» относится к Богу, чей закон дан в Писании.
  alternative: Существенной богословской альтернативы в данном контексте нет.
  rationale: Это обычное иудейско-библейское выражение. Перевод сохраняет акцент текста на исполнении семьёй предписаний закона, не добавляя дальнейших догматических выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, библейски уместным регистром. Синтаксис остаётся ясным для широкого читателя; «возвратились» выбрано вместо более разговорного «вернулись», а «город» сохраняет формальную связь с πόλις при пояснении исторического масштаба в сноске.
