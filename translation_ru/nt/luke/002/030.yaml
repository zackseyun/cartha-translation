  text: because my eyes have seen your salvation[a]
translation:
  language: ru
  text: потому что мои глаза увидели Твоё спасение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в контексте: «Твоего Спасителя». В греческом тексте: «Твоё спасение»; Божье спасение здесь явлено в лице Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: В данном контексте союз вводит причину предшествующих слов Симеона о том, что Владыка отпускает его с миром; «потому что» ясно передаёт причинную связь.
- source_word: εἶδον
  choice: увидели
  rationale: Русское прошедшее совершенного вида естественно передаёт греческий аорист как завершённое событие, значимое для настоящего момента.
- source_word: οἱ ὀφθαλμοί μου
  choice: мои глаза
  rationale: Сохранён явный и выразительный образ греческого текста, а не заменён нейтральным «я».
- source_word: τὸ σωτήριόν σου
  choice: Твоё спасение
  rationale: 'σωτήριον здесь означает спасение или избавление, а не является обычным личным наименованием σωτήρ («Спаситель»). Формулировка сохраняет смысловую глубину: Божье спасение предстало перед Симеоном в лице Иисуса.'
theological_decisions:
- issue: Передавать ли τὸ σωτήριόν σου отвлечённым существительным «спасение» или личным наименованием «Спаситель»
  choice: Твоё спасение
  alternative: Твоего Спасителя
  rationale: Греческий текст использует σωτήριον, а не σωτήρ. Перевод «спасение» сохраняет исходную формулировку и не снимает богословское напряжение между Божьим спасительным действием и его воплощённым присутствием в Младенце Иисусе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимение «Твоё» написано с прописной буквы как обращённое к Богу; синтаксис сохраняет связь с предыдущим стихом.
