lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: Ему исполнилось двенадцать лет
  rationale: Греческая идиома γίνομαι с обозначением возраста естественно передаётся по-русски как достижение указанного возраста.
- source_word: ἀναβαινόντων αὐτῶν
  choice: они… пошли в Иерусалим
  rationale: Причастный оборот обозначает их восхождение; в русском повествовании естественна личная глагольная форма. Направление к Иерусалиму ясно из предыдущего стиха и из обычного значения глагола в паломническом контексте.
- source_word: κατὰ τὸ ἔθος τῆς ἑορτῆς
  choice: по обычаю праздника
  rationale: Кратко и близко к греческому выражению передаёт следование установленному праздничному обычаю.
