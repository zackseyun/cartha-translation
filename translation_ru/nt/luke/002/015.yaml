  terminology: '«Ангелы», «пастухи», «Вифлеем» и «Господь» употреблены правильно. Для ἐγνώρισεν нейтральное «дал нам знать» точнее, чем «возвестил»: последнее может неоправданно приписывать способ сообщения самому Господу, хотя в контексте весть передана ангелами.'
