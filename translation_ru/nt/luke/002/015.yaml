source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: ru
  text: 'И вот, когда ангелы ушли от них на небо, пастухи стали говорить друг другу: «Пойдём же в Вифлеем и увидим то, что произошло[a] и о чём Господь дал нам знать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это событие, которое произошло». Буквально: «это слово (или дело), произошедшее»; греческое ῥῆμα может означать «слово», «сообщение», «дело» или «событие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Когда
  rationale: Луканская повествовательная формула естественно включена в придаточное времени; буквальное «и случилось» в современном русском здесь звучало бы тяжеловесно.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: отошли от них на небо
  rationale: Передаёт удаление ангелов и направление движения; «небо» сохраняет религиозно-пространственное значение οὐρανός.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: стали говорить друг другу
  rationale: Естественно вводит прямую речь и позволяет передать оттенок несовершенного вида ἐλάλουν без чрезмерного акцента на длительности.
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: Пойдём же в Вифлеем
  rationale: Побудительное сослагательное передано формой совместного призыва; «же» отражает настойчивость δὴ, а «в Вифлеем» естественно выражает движение до указанного места.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: что там произошло
  rationale: В контексте ῥῆμα обозначает сообщённое дело или событие; конструкция избегает неестественного «это случившееся дело». «Там» контекстуально связывает событие с Вифлеемом.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: о чём возвестил нам Господь
  rationale: ἐγνώρισεν означает «дал знать, сообщил»; «возвестил» уместно в контексте ангельского сообщения и не превращает глагол в технический термин откровения.
theological_decisions:
- issue: Кого обозначает ὁ κύριος
  choice: Господь
  alternative: Бог
  rationale: 'Титул сохранён без уточнения лица: непосредственный контекст указывает на Бога как источник вести, но само слово κύριος не требует более узкой формулировки.'
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный повествовательный стиль. Начальная семитизированная формула сглажена ради естественности, при этом последовательность событий сохранена.
