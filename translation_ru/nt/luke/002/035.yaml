lexical_decisions:
- source_word: σοῦ δὲ αὐτῆς τὴν ψυχήν
  choice: и тебе самой… сквозь душу
  rationale: Сочетание σοῦ с усилительным αὐτῆς подчёркивает личное обращение к Марии. Русское «тебе самой» естественно передаёт этот акцент, а «душу» сохраняет образ внутреннего, глубочайшего страдания.
- source_word: διελεύσεται
  choice: пройдёт сквозь
  rationale: Глагол буквально означает «пройти через, сквозь». Формулировка сохраняет исходный образ и не подменяет его более истолковывающим «пронзит».
- source_word: ῥομφαία
  choice: меч
  rationale: Слово обозначает большой меч; в современном русском «меч» достаточно точно и естественно передаёт образ без ненужного уточнения вида оружия.
- source_word: ὅπως ἂν ἀποκαλυφθῶσιν
  choice: чтобы открылись
  rationale: Передаёт целевое или результативное значение оборота и пассивно-медиальную идею обнаружения того, что было скрыто.
- source_word: ἐκ πολλῶν καρδιῶν διαλογισμοί
  choice: помыслы многих сердец
  rationale: «Помыслы» естественно обозначают внутренние мысли и намерения, не навязывая им исключительно отрицательной окраски. Родительная конструкция по-русски передаёт их происхождение из глубины сердец.
theological_decisions:
- issue: Смысл образа меча и страдания Марии
  choice: Сохранить метафору без уточнения конкретного события или механизма исполнения
  alternative: Прямо связать меч со скорбью Марии при распятии либо с разделяющим воздействием служения Иисуса
  rationale: Греческий текст ясно предрекает Марии глубокое личное страдание, но не поясняет здесь, как именно исполнится пророчество. Перевод сохраняет эту напряжённость и недосказанность.
- issue: Связь страдания с обнаружением помыслов
  choice: Передать ὅπως как «чтобы», сохранив формальную связь предложений
  alternative: Ослабить связь формулировкой «и тогда» или однозначно истолковать её только как результат
  rationale: Оборот допускает целевой оттенок и оттенок результата; «чтобы» сохраняет заявленную текстом тесную связь, не раскрывая её сверх сказанного.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Инверсия «тебе самой меч пройдёт сквозь душу» сохраняет акцент на личном обращении к Марии и звучит как пророческая речь. Образ меча не снабжён в тексте толковательной сноской о скорби, поскольку это верное, но уже интерпретирующее пояснение; лексическая альтернатива отмечена.
