  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: ru
  text: Увидев это[a], они сообщили о том, что[b] было сказано им об этом ребёнке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте дополнение не названо; по контексту речь может идти о ребёнке или обо всей увиденной сцене.
    reason: implicit_object
  - marker: b
    text: 'Буквально: «о слове»; возможно также: «о высказывании» или «о сообщении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев его
  rationale: Аористное причастие передаёт действие, предшествующее основному глаголу. Дополнение в греческом тексте не выражено; местоимение «его» естественно восполняется из контекста и относится к ребёнку.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит слабой повествовательной связкой. В русском последовательность событий ясно передаётся деепричастным оборотом, а отдельное «и» или «тогда» утяжелило бы фразу.
- source_word: ἐγνώρισαν
  choice: они рассказали
  rationale: Глагол означает «сделать известным, сообщить». «Рассказали» естественно передаёт сообщение другим людям, не превращая его в формальное провозглашение.
- source_word: περὶ τοῦ ῥήματος
  choice: о том, что
  rationale: ῥῆμα может обозначать слово, высказывание или сообщение. Конструкция «о том, что» ясно указывает на содержание сказанного и звучит естественно по-русски; буквальная возможность отмечена в сноске.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: было сказано им
  rationale: Сохранены пассивный залог и предшествование сообщения тому, как пастухи рассказали о нём другим.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: об этом ребёнке
  rationale: παιδίον обозначает ребёнка; «об этом ребёнке» точно и естественно передаёт выражение без стилистически маркированного уменьшения.
theological_decisions:
- issue: Передача ῥῆμα в связи с вестью ангела
  choice: о том, что было сказано
  alternative: о слове / о сообщении
  rationale: Выбранный оборот передаёт содержание ангельской вести, не придавая существительному специального богословского значения. Буквальная лексическая связь со «словом» сохранена в сноске.
- issue: Неявное дополнение при ἰδόντες
  choice: его
  alternative: увидев [это] / увидев ребёнка
  rationale: Греческий текст не называет объекта видения. По ближайшему контексту естественнее всего понимать ребёнка, однако эта контекстуальная вставка отмечена сноской, чтобы не скрывать форму оригинала.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Строчная буква в слове «ребёнок» соответствует обычной современной норме и не добавляет в исходный текст отсутствующей там почтительной капитализации.
