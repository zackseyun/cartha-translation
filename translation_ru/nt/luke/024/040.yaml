lexical_decisions:
- source_word: καὶ
  choice: не передано отдельно
  rationale: В русском повествовании связь с предыдущим стихом естественно выражена последовательностью действий; начальное «и» здесь необязательно и утяжеляло бы фразу.
- source_word: τοῦτο εἰπὼν
  choice: Сказав это
  rationale: Деепричастный оборот естественно передаёт действие, предшествующее основному глаголу, без избыточного уточнения временной последовательности.
- source_word: ἔδειξεν
  choice: показал
  rationale: Прямой и естественный эквивалент со значением видимого предъявления.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж естественно передаёт косвенное дополнение.
- source_word: τὰς χεῖρας καὶ τοὺς πόδας
  choice: Свои руки и ноги
  rationale: Возвратно-притяжательное «Свои» ясно указывает, что это руки и ноги Иисуса, и соответствует естественной русской норме там, где в греческом употреблён определённый артикль.
theological_decisions:
- issue: Текстологический статус всего стиха
  choice: Стих включён в основной текст и снабжён сноской о разночтении
  alternative: Не включать предложение в основной текст
  rationale: В SBLGNT всё предложение заключено в двойные квадратные скобки, что указывает на значительную текстологическую неуверенность. Поскольку слова приведены в заданном исходном тексте, они переведены, а факт их отсутствия в части рукописей открыт читателю в сноске.
