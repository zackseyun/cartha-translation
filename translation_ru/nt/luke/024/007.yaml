  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: ru
  text: говоря, что Сыну Человеческому надлежит быть преданным в руки грешных людей, быть распятым и на третий день воскреснуть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий глагол стоит в действительном залоге: «воскреснуть», а не «быть воскрешённым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Деепричастие сохраняет связь с формулой воспоминания в предыдущем стихе и передаёт греческое причастие настоящего времени.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сыну Человеческому
  rationale: Устоявшееся русское обозначение сохраняет титульный характер выражения и его библейские связи; дательный падеж естественно обусловлен безличной конструкцией «надлежит».
- source_word: ὅτι δεῖ
  choice: что… надлежит
  rationale: «Надлежит» выражает необходимость, связанную в Евангелии от Луки с исполнением Божьего замысла, а не простое предсказание.
- source_word: παραδοθῆναι
  choice: быть преданным
  rationale: Передаёт пассивный инфинитив со значением передачи во власть других; слово не сужается до одного лишь предательства Иуды.
- source_word: εἰς χεῖρας
  choice: в руки
  rationale: Естественно сохраняет образное греческое выражение о передаче под чью-либо власть.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: грешных людей
  rationale: Точно передаёт оба компонента греческого словосочетания без неестественного для русского языка акцентирования грамматического мужского рода множественного числа.
- source_word: σταυρωθῆναι
  choice: быть распятым
  rationale: Стандартно и точно передаёт пассивный инфинитив, обозначающий распятие.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: на третий день
  rationale: Естественная русская передача дательного времени без поясняющего расширения.
- source_word: ἀναστῆναι
  choice: воскреснуть
  rationale: Активный инфинитив передан активным русским глаголом; «воскреснуть» в данном контексте означает возвращение к жизни и не превращает форму в пассивную «быть воскрешённым».
theological_decisions:
- issue: Смысл δεῖ в предсказании страданий Иисуса
  choice: «надлежит», выражающее необходимость
  alternative: «предстоит» как простое предсказание будущего
  rationale: У Луки δεῖ обычно указывает на необходимость исполнения Божьего спасительного замысла; перевод сохраняет этот смысл, не поясняя сверх текста, кем именно установлена необходимость.
- issue: Залог ἀναστῆναι
  choice: активное «воскреснуть»
  alternative: пассивное «быть воскрешённым»
  rationale: Греческая форма активна. Пассивная формулировка богословски возможна в других местах, но здесь изменила бы грамматический ракурс исходного текста.
- issue: Передача ἀνθρώπων ἁμαρτωλῶν
  choice: «грешных людей»
  alternative: «грешников» или «грешных мужчин»
  rationale: «Грешных людей» сохраняет существительное ἀνθρώπων и естественно звучит по-русски; «грешников» устраняет этот компонент, а «мужчин» создаёт не выраженный лексически акцент на поле.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Надлежит» выбрано ради смысловой силы δεῖ, а «быть преданным в руки» сохраняет исходный образ, оставаясь понятным современному читателю.
