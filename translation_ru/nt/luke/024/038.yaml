  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: ru
  text: 'И Он сказал им: «Почему вы встревожены и почему в ваших сердцах возникают сомнения[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мысли» или «рассуждения».'
    reason: Лексема διαλογισμοί может обозначать мысли или рассуждения вообще, хотя в данном контексте имеет оттенок сомнения.
lexical_decisions:
- source_word: Τί τεταραγμένοι ἐστέ
  choice: Что вы так встревожены
  rationale: Τί в этой конструкции спрашивает о причине состояния. Русское «что вы так…» естественно передаёт вопрос «почему», сохраняя живую прямую речь; «встревожены» выражает наличное состояние, обозначенное перфектным причастием τεταραγμένοι.
- source_word: διαλογισμοὶ
  choice: сомнения
  rationale: В контексте реакции учеников на явление воскресшего Иисуса слово обозначает внутренние колебания и недоверчивые рассуждения. «Сомнения» естественно передаёт контекстуальный отрицательный оттенок, тогда как более широкое значение отмечено в сноске.
- source_word: ἀναβαίνουσιν
  choice: возникают
  rationale: Буквально глагол означает «поднимаются», но применительно к внутренним мыслям естественное русское соответствие — «возникают».
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: в ваших сердцах
  rationale: Греческое единственное число καρδίᾳ при множественном ὑμῶν имеет распределительное значение. Русское множественное число звучит естественно применительно к группе и сохраняет образ сердца как средоточия мыслей и чувств.
theological_decisions:
- issue: Антропологическое значение καρδία
  choice: сердца
  alternative: умы; внутренний мир
  rationale: «Сердце» сохраняет библейское представление о внутреннем человеке, включающее мышление, волю и чувства; перевод «ум» неоправданно сузил бы смысл.
- issue: Контекстуальный смысл διαλογισμοί
  choice: сомнения
  alternative: мысли; рассуждения
  rationale: Контекст подчёркивает внутреннюю неуверенность учеников, однако более широкая лексическая возможность не устраняется и вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык; речь естественная и понятная, но сохраняет достоинство библейского повествования. Заглавное «Он» употреблено как традиционная уважительная отсылка к Иисусу.
