source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: ru
  text: 'И пока они всё ещё не верили от радости и изумлялись[a], Он сказал им: «Есть ли у вас здесь что-нибудь поесть?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не верили из-за радости и удивлялись».'
    reason: 'Лексическая альтернатива: ἀπὸ τῆς χαρᾶς выражает причину, а θαυμάζω может передаваться как «изумляться» или «удивляться».'
lexical_decisions:
- source_word: ἔτι δὲ
  choice: И пока они всё ещё
  rationale: ἔτι передаёт продолжение состояния («всё ещё»), а δέ служит мягкой связкой; вместе с родительным абсолютным оборотом естественно передаётся конструкцией «И пока…».
- source_word: ἀπιστούντων
  choice: не верили
  rationale: Причастие настоящего времени обозначает продолжающуюся реакцию учеников. «Не верили» звучит естественно и не превращает их временное недоверие в характеристику закоренелого неверия.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: от радости
  rationale: 'ἀπό указывает здесь на причину или источник. Русское «от радости» кратко и естественно сохраняет парадокс: именно радость мешала им поверить в происходящее.'
- source_word: θαυμαζόντων
  choice: изумлялись
  rationale: Глагол передаёт продолжающееся состояние удивления и благоговейного изумления; «изумлялись» сохраняет его силу и согласуется по виду с предшествующим оборотом.
- source_word: Ἔχετέ
  choice: Есть ли у вас
  rationale: Идиоматическая русская форма вопроса о наличии чего-либо.
- source_word: τι βρώσιμον
  choice: что-нибудь поесть
  rationale: Буквально выражение означает «что-нибудь съедобное»; выбранная формулировка естественна в живой речи и точно передаёт просьбу о пище.
- source_word: ἐνθάδε
  choice: здесь
  rationale: Прямой и естественный эквивалент наречия места.
theological_decisions:
- issue: Характер реакции учеников на воскресшего Иисуса
  choice: Они всё ещё не верят от переполняющей их радости и одновременно изумляются.
  alternative: Они остаются неверующими или скептически отвергают увиденное.
  rationale: Греческая фраза связывает их продолжающееся неверие с радостью и изумлением. Перевод сохраняет напряжение между неверием и радостью, не представляя эту реакцию ни как сознательное отвержение, ни как уже достигнутую полную уверенность.
translation_notes:
  register: Современный литературный русский язык; фраза построена естественно и вместе с тем сохраняет длительность обеих реакций, причинную связь с радостью и эмоционально-богословское напряжение оригинала.
