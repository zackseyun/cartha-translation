id: LUK.24.39
reference: Luke 24:39
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: ru
  text: 'Посмотрите на Мои руки и ноги: это Я Сам[a]. Ощупайте Меня[b] и посмотрите: у духа[c] нет плоти и костей, а у Меня, как видите, есть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что это Я Сам»; возможно также: «ведь это Я Сам». Греческое выражение подчёркнуто указывает на личную тождественность.'
    reason: Сохраняет синтаксическую неоднозначность первого ὅτι и эмфазу ἐγώ εἰμι αὐτός.
  - marker: b
    text: 'Или: «потрогайте Меня» или «прикоснитесь ко Мне».'
    reason: Отмечает менее конкретные способы передать ψηλαφάω, подразумевающее удостоверение посредством осязания.
  - marker: c
    text: 'Или: «призрака». Буквально: «духа».'
    reason: Отмечает контекстуально возможное понимание без замены прямого эквивалента в основном тексте.
lexical_decisions:
- source_word: ἴδετε
  choice: посмотрите
  rationale: Аористный императив во множественном числе призывает к непосредственному зрительному удостоверению; «посмотрите» естественно и точно передаёт это в современном русском.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: Мои руки и ноги
  rationale: Конкретные обозначения частей тела переданы прямо; их упоминание служит удостоверению телесной и личной тождественности Иисуса.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: это Я Сам
  rationale: Сочетание ἐγώ и αὐτός эмфатически подчёркивает личную тождественность. Русское «это Я Сам» естественно сохраняет акцент без привнесения особого богословского смысла в формулу ἐγώ εἰμι.
- source_word: ψηλαφήσατέ με
  choice: прикоснитесь ко Мне
  rationale: Глагол означает осязать, ощупывать или удостоверяться прикосновением. «Прикоснитесь» ясно передаёт физическую проверку и звучит достойно; более буквальная возможность отмечена в сноске.
- source_word: πνεῦμα
  choice: дух
  rationale: Это прямой лексический эквивалент. В контексте имеется в виду бестелесное существо; перевод «призрак» был бы более истолковывающим.
- source_word: σάρκα καὶ ὀστέα
  choice: плоти и костей
  rationale: Буквальное телесное выражение сохранено; здесь σάρξ обозначает материальную плоть, а не употребляется метафорически.
- source_word: θεωρεῖτε
  choice: как видите
  rationale: Глагол обозначает наблюдение или созерцание; в данном контексте естественное русское «видите» сохраняет обращение к непосредственному восприятию.
- source_word: ἔχοντα
  choice: а у Меня ... есть
  rationale: Причастие, относящееся к ἐμέ, естественно развёрнуто в русскую личную конструкцию. Добавленное противительное «а» явно выражает уже присутствующее смысловое сопоставление, не меняя содержания.
theological_decisions:
- issue: Телесная реальность воскресшего Иисуса
  choice: Сохранено прямое утверждение о плоти и костях, подтверждаемое зрением и прикосновением.
  alternative: Смягчить противопоставление тела и духа более отвлечённой формулировкой.
  rationale: Греческий текст настойчиво обращается к зрению и осязанию и прямо говорит о плоти и костях. Перевод сохраняет это свидетельство телесности, не добавляя дальнейшего догматического объяснения.
- issue: Значение ὅτι после первого ἴδετε
  choice: 'Передано как содержание узнавания: «это Я Сам».'
  alternative: 'Причинное понимание: «ведь это Я Сам».'
  rationale: В данном синтаксисе ὅτι естественно может вводить то, в чём ученики должны удостовериться. Пунктуация делает русский текст плавным, сохраняя возможную смысловую близость к причинному оттенку.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Заглавные местоимения при обращении Иисуса к Себе применены в соответствии с распространённой русской библейской традицией. Двоеточия естественно оформляют пояснительные отношения и позволяют избежать тяжеловесного буквального синтаксиса.
