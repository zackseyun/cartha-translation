lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет связь заключительного стиха с предыдущим повествованием.
- source_word: ἦσαν
  choice: были
  rationale: Имперфект передаёт продолжавшееся состояние; длительность дополнительно выражена словом «постоянно».
- source_word: διὰ παντός
  choice: постоянно
  rationale: Идиома означает непрерывность или регулярную повторяемость; «постоянно» естественно и ясно передаёт этот смысл по-русски.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс в целом, а не только внутреннее святилище; краткое «в храме» соответствует обычному русскому употреблению.
- source_word: εὐλογοῦντες
  choice: благословляя
  rationale: Передаёт основной лексический смысл εὐλογέω и сохраняет библейское выражение о благословении Бога, не подменяя его более общим «прославляя».
- source_word: τὸν θεόν
  choice: Бога
  rationale: Прямое дополнение к причастию εὐλογοῦντες; стандартный и точный перевод.
theological_decisions:
- issue: Передача обращённого к Богу действия εὐλογοῦντες τὸν θεόν
  choice: благословляя Бога
  alternative: прославляя Бога
  rationale: Греческий текст использует εὐλογέω («благословлять», «говорить доброе»), а не обычный глагол со значением «хвалить». Формулировка «благословляя Бога» сохраняет лексику оригинала и остаётся понятной в русском библейском стиле; функциональный смысл может быть передан как прославление.
translation_notes:
  register: Современный литературный русский язык с достоинством заключительной богослужебной сцены. Синтаксис близок к греческому, но естественен по-русски; сохранено лексически значимое «благословляя» с пояснением альтернативы в сноске.
