source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: ru
  text: А мы надеялись, что Он и есть Тот, Кому предстоит искупить Израиль[a]. Но вдобавок ко всему этому[b] вот уже третий день с тех пор, как всё это произошло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Он был Тем, Кто должен был искупить Израиль». В греческом тексте внутри содержания их прежней надежды сохраняется настоящее время: «есть».'
    reason: alternative_reading
  - marker: b
    text: 'Выражение «вдобавок ко всему этому» усиливает мысль: к уже названному добавляется ещё одно обстоятельство — прошло уже три дня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: А мы
  rationale: Передаёт противопоставление, выраженное δέ, и смысловое выделение местоимения ἡμεῖς, не утяжеляя русскую фразу.
- source_word: ἠλπίζομεν
  choice: надеялись
  rationale: Русская форма несовершенного вида естественно передаёт продолжительную надежду в прошлом, которая в контексте выглядит несбывшейся.
- source_word: ὅτι αὐτός ἐστιν
  choice: что Он и есть Тот
  rationale: Сохраняет настоящее время ἐστιν внутри содержания прежней надежды; частица «и» передаёт выделительное значение αὐτός.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: Кому предстоит искупить
  rationale: Передаёт ожидаемое, предстоящее действие μέλλων с инфинитивом и сохраняет направленность надежды в будущее, не превращая её безоговорочно в утверждение лишь о прошлом.
- source_word: λυτροῦσθαι
  choice: искупить
  rationale: Сохраняет смысл избавления и выкупа, а также возможный заветный и мессианский оттенок; более узкое «освободить» могло бы преждевременно свести смысл к политическому освобождению.
- source_word: τὸν Ἰσραήλ
  choice: Израиль
  rationale: Прямая передача названия народа как совокупного объекта ожидаемого искупления.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Но вдобавок ко всему этому
  rationale: Естественно передаёт усиленное противопоставление и добавление ещё одного обстоятельства к уже сказанному.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: сегодня уже третий день
  rationale: Передаёт идиоматическое указание на достигнутый временной рубеж ясным современным русским выражением.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: с тех пор, как всё это произошло
  rationale: Точно и естественно обозначает начальную точку отсчёта времени.
theological_decisions:
- issue: Смысл выражения «искупить Израиль»
  choice: Сохранить «искупить Израиль», не уточняя вид избавления.
  alternative: «освободить Израиль» или явно обозначить политическое либо духовное спасение
  rationale: Фраза выражает широкую мессианскую надежду, а сам текст не определяет, имеется ли в виду политическое освобождение, духовное спасение или оба аспекта.
- issue: Временное значение ἐστιν после ἠλπίζομεν
  choice: 'Сохранить настоящее время: «Он и есть Тот, Кому предстоит».'
  alternative: «Он был Тем, Кто должен был искупить»
  rationale: Греческий текст сохраняет настоящее ἐστιν внутри содержания надежды, высказанной глаголом прошедшего времени. Такой перевод удерживает грамматическое напряжение текста, тогда как контекст сам указывает на разочарование говорящих.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Необычное сочетание прошедшего «надеялись» с настоящим «Он и есть» сохранено намеренно ради формы и смыслового напряжения греческого текста. Оба примечания поставлены непосредственно после выражения, к которому относятся.
