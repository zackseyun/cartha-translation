lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно передаёт временную последовательность повествования.
- source_word: διήνοιξεν
  choice: открыл
  rationale: Сохраняет конкретную метафору греческого глагола διανοίγω и не сводит действие к пояснению или способности.
- source_word: αὐτῶν τὸν νοῦν
  choice: их разум
  rationale: νοῦς обозначает способность мыслить и понимать; единственное число «разум» сохраняет форму исходного текста и естественно сочетается с «открыл».
- source_word: τοῦ συνιέναι
  choice: чтобы они понимали
  rationale: Артикулярный инфинитив допускает целевое или результативное прочтение; придаточное с «чтобы» естественно по-русски, не устраняя этой смысловой близости.
- source_word: τὰς γραφάς
  choice: Писания
  rationale: В данном контексте речь идёт о священных писаниях Израиля; прописная буква передаёт устойчивое религиозное обозначение.
theological_decisions:
- issue: Характер действия Иисуса, открывшего разум учеников
  choice: Сохранить прямую формулировку «Он открыл их разум» без догматического пояснения.
  alternative: «Он дал им способность понимать» или «Он объяснил им Писания».
  rationale: Греческий текст прямо говорит, что Он открыл их разум для понимания Писаний; перевод сохраняет это утверждение и не отождествляет действие лишь с объяснением.
- issue: Цель или результат конструкции τοῦ συνιέναι
  choice: «чтобы они понимали»
  alternative: «для понимания» или «так что они смогли понять»
  rationale: Греческая конструкция может выражать цель или результат. Русское «чтобы» звучит естественно и оставляет их близость без излишнего уточнения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции. Сохранена метафора открытия разума и не добавлено конфессиональное истолкование.
