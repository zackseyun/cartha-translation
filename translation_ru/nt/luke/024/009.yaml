  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: ru
  text: Вернувшись от гробницы, они рассказали обо всём этом одиннадцати и всем остальным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Вернувшись
  rationale: Аористное действительное причастие женского рода множественного числа обозначает предшествующее основному действию возвращение женщин; деепричастие естественно передаёт эту связь по-русски.
- source_word: μνημείου
  choice: гробницы
  rationale: В контексте погребения и воскресения Иисуса слово обозначает высеченное или устроенное место погребения; «гробница» точнее, чем «могила», и естественно для данного повествования.
- source_word: ἀπήγγειλαν
  choice: рассказали
  rationale: Глагол означает сообщить, передать известие. «Рассказали» звучит естественно в повествовании и не придаёт действию излишне официального или публичного характера.
- source_word: ταῦτα πάντα
  choice: обо всём этом
  rationale: Формулировка сохраняет и указательное значение ταῦτα, и всеохватность πάντα, оставаясь естественной для современного русского языка.
- source_word: τοῖς ἕνδεκα
  choice: одиннадцати
  rationale: Сохранено данное в греческом тексте условное обозначение группы без добавления отсутствующего существительного «апостолам».
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: всем остальным
  rationale: Передаёт весь более широкий круг людей помимо одиннадцати, не уточняя его состав сверх исходного текста.
theological_decisions:
- issue: Референт причастия женского рода и глагола во множественном числе
  choice: Местоимение «они» относится к женщинам, пришедшим к гробнице, как следует из предшествующего контекста.
  alternative: Явно добавить «женщины».
  rationale: Греческое причастие указывает на женский род, но имя субъекта восстанавливается из контекста. Русское «они» позволяет не добавлять отсутствующее в стихе существительное, не меняя референта.
- issue: Обозначение апостольской группы
  choice: «одиннадцати» без поясняющего добавления
  alternative: «одиннадцати апостолам»
  rationale: Исходный текст использует устойчивое обозначение «одиннадцать» и не содержит слова «апостолы»; расширение было бы разъясняющим добавлением.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза ясная и сдержанно-достоинственная. Деепричастный оборот сохраняет структуру греческого предложения без неестественной буквальности.
