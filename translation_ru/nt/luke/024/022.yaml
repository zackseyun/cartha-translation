lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Но и
  rationale: Передаёт одновременно противительный переход от предшествующего разочарования и добавление неожиданного обстоятельства.
- source_word: γυναῖκές τινες ἐξ ἡμῶν
  choice: некоторые женщины из нашей среды
  rationale: Естественно обозначает женщин, принадлежавших к кругу учеников; «из нашей среды» точнее простого «из нас».
- source_word: ἐξέστησαν ἡμᾶς
  choice: поразили нас
  rationale: Передаёт сильное изумление и возможную растерянность, не уточняя, поверили ли говорящие сообщению женщин.
- source_word: γενόμεναι ὀρθριναὶ ἐπὶ τὸ μνημεῖον
  choice: рано утром они пришли к гробнице
  rationale: Естественно раскрывает греческую конструкцию с причастием и предикативным прилагательным; ἐπί с винительным допускает направительное значение.
theological_decisions:
- issue: Смысл ἐξέστησαν в рассказе о воскресении
  choice: поразили нас
  alternative: привели нас в изумление; озадачили нас
  rationale: 'Формулировка сохраняет повествовательное напряжение: реакция учеников была сильной, однако текст сам по себе ещё не сообщает ни об их вере, ни о неверии.'
translation_notes:
  register: Современный литературный русский язык; речь естественная и достойная. Двоеточие делает связь с последующим пояснением прозрачной. Лексическая неоднозначность ἐξέστησαν сохранена словом «поразили».
