  verdict: approve
  source_fidelity: '«Но и некоторые женщины из нашей среды поразили нас: рано утром они пришли к гробнице» точно передаёт все основные элементы греческого текста: противительно-добавочное ἀλλὰ καί, неопределённое γυναῖκές τινες, принадлежность к кругу говорящих в ἐξ ἡμῶν, сильную реакцию в ἐξέστησαν ἡμᾶς и раннее посещение гробницы. «Пришли к гробнице» оправданно раскрывает направительный смысл ἐπὶ с винительным в данном контексте.'
  naturalness: Текст естественен для современного литературного русского. Начальное «Но и» несколько маркированно, но уместно сохраняет связку с предыдущей репликой. Двоеточие ясно вводит обстоятельство, лежащее в основе удивления, без ненужной тяжеловесности.
  terminology: «Женщины из нашей среды» точно и нейтрально обозначает принадлежность к кругу учеников. «Поразили нас» передаёт сильное изумление ἐξέστησαν, не навязывая ни веры, ни неверия. «Гробница» подходит для μνημεῖον в повествовании о погребении Иисуса.
