  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: ru
  text: Пётр же встал и побежал к гробнице; наклонившись, он видит только льняные полотна; затем ушёл к себе, дивясь тому, что произошло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые древние рукописи не содержат этого стиха.
    reason: В SBLGNT весь стих отмечен как текстологически спорный; примечание сообщает читателю о существенном варианте рукописной традиции.
lexical_decisions:
- source_word: μνημεῖον
  choice: гробница
  rationale: Обозначает высеченное или устроенное место погребения; «гробница» ясно и естественно передаёт реалии повествования.
- source_word: παρακύψας
  choice: наклонившись
  rationale: Причастие описывает наклон, чтобы заглянуть внутрь; дополнение «заглянуть» подразумевается последующим «видит».
- source_word: τὰ ὀθόνια μόνα
  choice: только льняные полотна
  rationale: Сохраняется значение погребальных льняных полотен и акцент μόνα на том, что там были лишь они.
- source_word: βλέπει
  choice: он видит
  rationale: Сохранён исторический презенс греческого текста, делающий сцену более непосредственной.
- source_word: πρὸς αὑτὸν θαυμάζων
  choice: дивясь про себя
  rationale: Естественно передаёт вероятную связь πρὸς αὑτόν с внутренним изумлением Петра, не превращая оборот в буквальное и неясное «к себе».
theological_decisions:
- issue: Текстологический статус всего стиха
  choice: Стих включён в основной текст с примечанием о рукописной традиции.
  alternative: Опустить стих или заключить его в скобки.
  rationale: SBLGNT печатает стих, но обозначает весь фрагмент как значимый текстологический вариант; поэтому основной текст сохраняется, а неопределённость сообщается читателю.
- issue: Что именно осознал Пётр
  choice: Сохранено нейтральное «тому, что произошло».
  alternative: Уточнить, что Пётр уверовал в воскресение.
  rationale: Греческий текст говорит лишь об изумлении перед случившимся и не утверждает здесь, что Пётр уже пришёл к определённому богословскому выводу.
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Историческое настоящее «видит» намеренно сохранено вслед за греческим текстом, хотя окружающие глаголы стоят в прошедшем времени.
