review_pass:
  verdict: revise
  source_fidelity: Требуется поправка оборота πρὸς ἑαυτόν. В данном контексте он естественно означает, что Пётр ушёл к себе (то есть домой), а не что он «дивился про себя». Историческое настоящее βλέπει и нейтральное τὸ γεγονός переданы удачно. Текстологическое примечание соответствует тому, что весь стих в SBLGNT отмечен как спорный.
  naturalness: Текст в целом современный и литературный. «Ушёл к себе, дивясь тому, что произошло» естественно по-русски и сохраняет синтаксическое соотнесение греческих оборотов без ненужного толкования.
  terminology: «Гробница» для μνημεῖον и «льняные полотна» для ὀθόνια уместны. «Только» адекватно передаёт μόνα. Не следует уточнять содержание изумления Петра как веру в воскресение.
  issues:
  - severity: medium
    issue: πρὸς ἑαυτόν передано как «про себя»
    rationale: Оборот относится к ἀπῆλθεν («ушёл к себе/домой»), тогда как «про себя» в русском привязывает его к «дивясь» и изменяет сообщаемое направление ухода.
  revised_text: Пётр же встал и побежал к гробнице; наклонившись, он видит только льняные полотна; затем ушёл к себе, дивясь тому, что произошло.[a]
