revisions:
- from: Пётр же встал и побежал к гробнице. Наклонившись, он видит только льняные полотна. И он ушёл, дивясь про себя тому, что произошло.[a]
  to: Пётр же встал и побежал к гробнице; наклонившись, он видит только льняные полотна; затем ушёл к себе, дивясь тому, что произошло.[a]
  rationale: 'Исправлено только значение и синтаксическая привязка πρὸς ἑαυτόν: Пётр уходит «к себе», а его изумление выражено отдельным деепричастным оборотом. Сохранены историческое настоящее «видит», акцент «только» и нейтральное «тому, что произошло».'
