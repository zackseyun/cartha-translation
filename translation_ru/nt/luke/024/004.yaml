  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: ru
  text: И когда они недоумевали об этом, вот, рядом с ними встали двое мужчин в одеждах, сверкавших, как молния.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в ослепительно сияющих, словно молния, одеждах».'
    reason: Более идиоматичный вариант передачи ἐν ἐσθῆτι ἀστραπτούσῃ; сохраняет образ молниеподобного сияния.
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἀπορεῖσθαι
  choice: И пока они недоумевали
  rationale: 'Луканская повествовательная формула вместе с временной конструкцией естественно передаётся по-русски без буквального «и случилось»: союз «и» сохраняет ход рассказа, а «пока» выражает одновременность; «недоумевали» передаёт состояние растерянности, а не простое любопытство.'
- source_word: περὶ τούτου
  choice: об этом
  rationale: Естественная современная отсылка к только что описанному обстоятельству.
- source_word: ἰδοὺ
  choice: вдруг
  rationale: В данном повествовательном контексте передаёт внезапность и привлекающую внимание смену сцены естественнее, чем архаичное «вот» или «се», хотя элемент внезапности выводится из дискурсивной функции слова.
- source_word: ἄνδρες δύο
  choice: два мужа
  rationale: Сохраняет представление персонажей именно как мужчин и при этом поддерживает достойный библейский регистр; не подменяет их обозначением «ангелы».
- source_word: ἐπέστησαν αὐταῖς
  choice: рядом с ними предстали
  rationale: Передаёт внезапное появление и пространственную близость; «предстали» естественнее по-русски, чем буквальное «встали возле них».
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: в одежде, сверкавшей, словно молния
  rationale: Сохраняет явный образ молниеподобного сияния, заложенный в ἀστραπτούσῃ, и звучит естественно и зримо.
theological_decisions:
- issue: Кем были два явившихся персонажа
  choice: два мужа
  alternative: два ангела
  rationale: Сам стих называет их ἄνδρες, поэтому перевод не вносит в основной текст их истолкование из более широкого контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. «Мужа» выбрано вместо разговорно-нейтрального «мужчины» ради библейского регистра, без архаизации синтаксиса. Маркер сноски поставлен непосредственно после относящегося к нему описания одежды.
