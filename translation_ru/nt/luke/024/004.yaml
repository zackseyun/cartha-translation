- from: И пока они недоумевали об этом, вдруг рядом с ними предстали два мужа в одежде, сверкавшей, словно молния.[a]
  to: И когда они недоумевали об этом, вот, рядом с ними встали двое мужчин в одеждах, сверкавших, как молния.[a]
  rationale: Правка заменяет устаревающее и потенциально двусмысленное «два мужа» на современное «двое мужчин», уточняет пространственное значение ἐπέστησαν через «встали рядом» и делает сноску лексически более полезной. «Вот» сохраняет выделительную повествовательную функцию ἰδού без добавления богословского истолкования.
