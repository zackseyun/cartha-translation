  verdict: revise
  source_fidelity: 'Основной смысл передан точно: γυναины находятся в недоумении, рядом с ними внезапно оказываются два персонажа, названные мужчинами, а их одежда описана через образ молниеподобного сверкания. Однако «предстали» несколько сдвигает ἐπέστησαν к значению явления перед кем-либо, тогда как глагол прежде всего обозначает то, что они оказались/встали рядом. «Вдруг» передаёт один аспект ἰδού, но «вот» точнее сохраняет функцию указательного повествовательного маркера.'
  naturalness: «Два мужа» в современном литературном русском преимущественно вызывает значение супругов и звучит архаично. «Двое мужчин» ясно, современно и сохраняет обозначение ἄνδρες. Описание одежды естественнее согласовать с двумя мужчинами во множественном числе.
  terminology: 'Не следует заменять «мужчин» на «ангелов»: стих говорит именно о двух мужчинах. Образ ἀστραπτούσῃ следует сохранять в основном тексте как сверкание, подобное молнии; сноска может давать более идиоматичный вариант без утраты этого образа.'
