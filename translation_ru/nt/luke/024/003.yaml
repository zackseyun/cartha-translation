base_translation:
  language: en
  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: ru
  text: Но, войдя внутрь, они не нашли тела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «тела Господа Иисуса».'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: войдя внутрь
  rationale: Аористное действительное причастие женского рода множественного числа относится к женщинам и обозначает действие, предшествующее основному. Деепричастие естественно передаёт эту связь; «внутрь» ясно указывает на вход в гробницу из контекста, не называя её повторно.
- source_word: δὲ
  choice: Но
  rationale: 'Частица отмечает продолжение повествования с лёгким противопоставлением ожидаемому: женщины вошли, но тела там не оказалось.'
- source_word: οὐχ εὗρον
  choice: они не нашли
  rationale: Простая и естественная передача отрицательной формы аориста глагола «находить», сохраняющая повествовательный характер текста.
- source_word: τὸ σῶμα
  choice: тела
  rationale: Слово σῶμα означает «тело». Родительный падеж обусловлен русским отрицанием «не нашли»; вариант «трупа» был бы стилистически более резким и добавлял бы нежелательную окраску.
theological_decisions:
- issue: Следует ли уточнить, чьё это тело
  choice: тела
  alternative: тела Господа Иисуса
  rationale: В предоставленном тексте SBLGNT стоит только τὸ σῶμα. Более пространное чтение засвидетельствовано частью рукописей и вынесено в примечание, а не включено в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified повествовательная формулировка. Деепричастный оборот сохраняет компактность греческой конструкции, а местоимение «они» делает субъект основного действия явным.
