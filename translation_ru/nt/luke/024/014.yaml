lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход без добавления временного оттенка.
- source_word: αὐτοὶ
  choice: они
  rationale: Явно передаёт греческое местоимение; усилительное «сами» здесь не требуется и звучало бы избыточно.
- source_word: ὡμίλουν
  choice: разговаривали
  rationale: Естественно обозначает продолжавшуюся в прошлом беседу; несовершенный вид русского глагола передаёт длительность греческого имперфекта.
- source_word: πρὸς ἀλλήλους
  choice: друг с другом
  rationale: Идиоматично передаёт взаимный характер разговора.
- source_word: περὶ πάντων
  choice: обо всём
  rationale: Кратко и естественно передаёт тему разговора и полноту охватываемых событий.
- source_word: τῶν συμβεβηκότων τούτων
  choice: что произошло
  rationale: Передаёт совершившиеся события, остающиеся значимыми в данной повествовательной ситуации, без архаического оборота.
