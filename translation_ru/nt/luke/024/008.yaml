  yaml_path: translation/nt/luke/024/008.yaml
  text: And they remembered his words,[a]
translation:
  language: ru
  text: И они вспомнили Его слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказанное Им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь с предыдущим стихом, не добавляя более выраженного временного оттенка.
- source_word: ἐμνήσθησαν
  choice: вспомнили
  rationale: Естественно и прямо передаёт аористную форму μιμνῄσκομαι с активным значением в данном контексте.
- source_word: τῶν ῥημάτων
  choice: слова
  rationale: ῥῆμα здесь обозначает произнесённые слова; русский вариант «слова» точен, естественен и сохраняет возможность понимать выражение как сказанное Им.
- source_word: αὐτοῦ
  choice: Его
  rationale: Передаёт родительное местоимение без замены его имени; прописная буква указывает на Иисуса согласно ясному контексту и русской библейской издательской традиции.
