  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: ru
  text: Но они, встревоженные и охваченные страхом, думали, что видят духа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призрака». Греческое слово πνεῦμα буквально означает «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: испугавшись
  rationale: Передаёт внезапный испуг, выраженный аористным причастием, не усиливая его до «ужаснувшись».
- source_word: δὲ
  choice: но
  rationale: Обозначает поворот от явления Иисуса к испуганной реакции учеников.
- source_word: ἔμφοβοι γενόμενοι
  choice: придя в страх
  rationale: Сохраняет значение вхождения в состояние страха и отличает этот оборот от предшествующего внезапного испуга.
- source_word: ἐδόκουν
  choice: подумали
  rationale: Естественно передаёт ошибочное предположение учеников; видовое значение несовершенного времени раскрывается контекстом воспринимаемого ими зрелища.
- source_word: πνεῦμα
  choice: духа
  rationale: Прямой и богословски нейтральный эквивалент; в данном контексте речь о предполагаемом бесплотном существе.
- source_word: θεωρεῖν
  choice: видят
  rationale: Настоящее время в придаточном после «подумали» естественно передаёт одновременное, продолжающееся зрительное восприятие.
theological_decisions:
- issue: Передача πνεῦμα в рассказе о явлении воскресшего Иисуса
  choice: духа
  alternative: призрака
  rationale: '«Дух» ближе к греческому πνεῦμα и не вводит фольклорных оттенков слова «призрак». Сноска сохраняет уместную контекстуальную альтернативу, не устраняя напряжение повествования: ученики ошибочно принимают телесно воскресшего Иисуса за бесплотное существо.'
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, повествовательным тоном. Последовательность двух реакций сохранена без тяжеловесного буквального калькирования; «придя в страх» выбрано ради различения πτοηθέντες и ἔμφοβοι γενόμενοι.
