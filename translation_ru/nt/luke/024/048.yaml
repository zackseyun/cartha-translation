  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: ru
  text: Вы — свидетели этих событий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы — свидетели этого». Греческое указательное местоимение отсылает к событиям, о которых Иисус только что говорил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Вы
  rationale: Личное местоимение выражено явно и потому имеет смысловое ударение. В русском это естественно передаётся явным «Вы» и интонационным тире, без более тяжеловесного «именно вы».
- source_word: ἐστε
  choice: —
  rationale: Настоящее время связки «быть» в русском обычно опускается; тире естественно обозначает именную связку и подчёркивает утверждение.
- source_word: μάρτυρες
  choice: свидетели
  rationale: В данном контексте речь идёт о тех, кто свидетельствует о страданиях и воскресении Иисуса. «Свидетели» передаёт обычный смысл слова, не привнося более позднюю ассоциацию с мученичеством.
- source_word: τούτων
  choice: этих событий
  rationale: Указательное местоимение во множественном числе отсылает к только что названным событиям. Добавление «событий» делает эту отсылку ясной и естественной по-русски.
theological_decisions:
- issue: Смысл роли учеников как μάρτυρες
  choice: Ученики названы свидетелями событий, о которых только что говорил Иисус.
  alternative: Усмотреть здесь также позднейшее значение «мученики».
  rationale: Непосредственный контекст говорит о свидетельстве о страданиях, воскресении и возвещаемой вести; позднейшее значение не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная формулировка. Интонационное тире сохраняет акцент на явно выраженном местоимении.
