  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: ru
  text: 'Тогда один из них, по имени Клеопа, сказал ему в ответ: «Неужели ты один здесь, в Иерусалиме, как приезжий и не знаешь, что произошло там в эти дни?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Тогда … сказал … в ответ
  rationale: Причастие ἀποκριθείς вводит ответную реплику, а δέ служит мягкой повествовательной связкой. Такая конструкция естественно передаёт оба элемента по-русски.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: один из них, по имени Клеопа
  rationale: «Из них» ясно восстанавливает из контекста принадлежность к двум ученикам; ὀνόματι передано обычным русским оборотом «по имени».
- source_word: εἶπεν πρὸς αὐτόν
  choice: сказал ему
  rationale: Сохраняет местоимение исходного текста и не добавляет имени Иисуса.
- source_word: Σὺ μόνος
  choice: Неужели ты единственный
  rationale: «Неужели» естественно выражает удивлённо-вопросительную силу реплики, а «единственный» сохраняет акцент μόνος.
- source_word: παροικεῖς Ἰερουσαλήμ
  choice: приезжий в Иерусалиме
  rationale: παροικέω обозначает пребывание в месте в качестве чужеземца или временного жителя. «Приезжий» понятно современному читателю и сохраняет смысл человека не из местных; более буквальный оттенок отмечен в сноске.
- source_word: οὐκ ἔγνως
  choice: не знает
  rationale: Аорист здесь выражает сохраняющуюся неосведомлённость о недавних событиях; настоящее время естественно в русском вопросе.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: что произошло там
  rationale: Субстантивированное причастие передано естественным придаточным; «там» относится к Иерусалиму.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: в эти дни
  rationale: Близко передаёт временное выражение и указывает на непосредственно предшествующие дни.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с ясным, но достойным повествовательным тоном. Реплика передаёт удивление Клеопы без разговорной фамильярности; неоднозначность конструкции с μόνος и παροικεῖς сохранена с помощью сноски.
