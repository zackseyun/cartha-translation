  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: ru
  text: 'говоривших: «Господь действительно воскрес[a] и явился Симону!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь действительно был воскрешён». Греческий глагол стоит в страдательном залоге; в русском языке в этом контексте естественно также сказать «воскрес».'
    reason: Сохранение залоговой неоднозначности и близкой лексической альтернативы.
lexical_decisions:
- source_word: λέγοντας
  choice: говоривших
  rationale: Причастие настоящего времени, винительный падеж мужского рода множественного числа; форма сохраняет связь с участниками предшествующего контекста и естественно продолжается прямой речью.
- source_word: ὅτι
  choice: двоеточие и кавычки
  rationale: Союз вводит содержание речи; в современном русском прямая речь естественно передаётся пунктуацией без отдельного «что».
- source_word: ὄντως
  choice: действительно
  rationale: Передаёт усиленное подтверждение фактической реальности события без архаического оттенка.
- source_word: ἠγέρθη
  choice: воскрес
  rationale: В русском языке это обычная и точная передача новозаветной пассивной формы в контексте воскресения; буквальное «был воскрешён» возможно, но здесь звучит тяжелее.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохраняет титульное и христологическое значение κύριος.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз между утверждением о воскресении и сообщением о явлении.
- source_word: ὤφθη
  choice: явился
  rationale: Идиоматически передаёт пассивную форму ὁράω в повествованиях о явлениях воскресшего Иисуса.
- source_word: Σίμωνι
  choice: Симону
  rationale: Точно передаёт дательный падеж имени; уточнение «Петру» в греческом тексте отсутствует.
theological_decisions:
- issue: Залог глагола воскресения
  choice: воскрес
  alternative: был воскрешён
  rationale: Хотя ἠγέρθη формально является пассивом, русское «воскрес» — устойчивый непереходный эквивалент в данном контексте. Сноска сохраняет формальную альтернативу и не устраняет возможный божественный пассив.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет традиционный и современно понятный христологический титул без ослабления его значения.
- issue: Значение ὤφθη
  choice: явился
  alternative: был увиден
  rationale: «Явился» естественно передаёт формулу явления воскресшего; буквальное «был увиден» в русском менее естественно и способно сместить акцент.
translation_notes:
  register: Современный литературный русский, торжественный, но без архаизмов. Двоеточие отражает продолжение предложения из предыдущего стиха; восклицательный знак передаёт живое подтверждение вести.
