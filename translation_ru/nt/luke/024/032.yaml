base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: ru
  text: 'И они сказали друг другу: «Разве не горело у нас сердце, когда Он говорил с нами по дороге[a] и раскрывал нам Писания[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пути».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «открывал нам Писания», то есть раскрывал их смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: друг другу
  rationale: Естественное русское взаимное выражение, точно передающее разговор между двумя учениками.
- source_word: Οὐχὶ
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: ἡ καρδία ἡμῶν
  choice: наше сердце
  rationale: Сохраняет грамматическое единственное число греческого текста и образ общего внутреннего переживания учеников.
- source_word: καιομένη ἦν ἐν ἡμῖν
  choice: горело в нас
  rationale: Сохраняет метафору горения и длительный характер состояния, не сводя его только к эмоции или озарению.
- source_word: ὡς ἐλάλει ἡμῖν
  choice: когда Он говорил с нами
  rationale: Имперфект передан как продолжавшаяся речь; русское «когда» естественно выражает сопутствующее обстоятельство.
- source_word: ἐν τῇ ὁδῷ
  choice: по дороге
  rationale: Контекстуально естественно обозначает время и место разговора во время пути в Эммаус.
- source_word: ὡς διήνοιγεν ἡμῖν τὰς γραφάς
  choice: и раскрывал нам Писания
  rationale: «Раскрывал» сохраняет метафору διανοίγω и одновременно естественно указывает на прояснение смысла священных текстов; имперфект передаёт продолжающееся действие.
theological_decisions:
- issue: Образ горящего сердца
  choice: Сохранить выражение «горело в нас наше сердце»
  alternative: «наши сердца были глубоко тронуты» или «мы ощущали внутри огонь»
  rationale: Исходный текст не уточняет, было ли переживание преимущественно эмоциональным, духовным или познавательным; сохранение метафоры не устраняет эту многозначность.
- issue: Значение раскрытия Писаний
  choice: Сохранить метафору «раскрывал нам Писания»
  alternative: «объяснял нам Писания»
  rationale: Глагол διανοίγω буквально связан с открытием и в контексте подразумевает прояснение смысла; метафорический перевод сохраняет образ без лишнего истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для устной реплики; прописное «Он» употреблено как традиционная уважительная орфографическая норма, не добавляющая отдельного толкования.
