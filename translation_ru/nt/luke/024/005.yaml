  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: ru
  text: 'Когда женщины в страхе склонили лица к земле, они сказали женщинам: «Почему вы ищете Живого среди мёртвых?[a]»'
  philosophy: optimal-equivalence
  footnotes:
