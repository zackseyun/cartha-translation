    text: 'Буквально: «Что вы ищете Живого с мёртвыми?» По смыслу в данном контексте: «Почему вы ищете Живого среди мёртвых?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων δὲ γενομένων αὐτῶν
  choice: когда женщины пришли в ужас
  rationale: Генитив абсолютный передаёт обстоятельство, предшествующее главному действию; ἔμφοβος вместе с γενομένων выражает наступление сильного страха. Местоимение женского рода для ясности передано как «женщины», поскольку два местоимения в русском иначе создают неестественную двусмысленность.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: склонили лица к земле
  rationale: Сохраняется конкретный образ движения, вызванного страхом или благоговением; совершенный вид естественно передаёт последовательность действий в русском повествовании.
- source_word: εἶπαν πρὸς αὐτάς
  choice: те сказали им
  rationale: Указательное «те» различает говорящих и женщин без добавления отсутствующего здесь существительного; «им» сохраняет местоименную форму αὐτάς.
- source_word: Τί ζητεῖτε
  choice: Почему вы ищете
  rationale: Хотя τί буквально означает «что», в данном вопросе оно указывает на неуместность поисков и естественно передаётся по-русски словом «почему».
- source_word: τὸν ζῶντα
  choice: Живого
  rationale: Субстантивированное причастие стоит в единственном числе и обозначает конкретное лицо. «Живого» сохраняет личный характер и контраст с мёртвыми; прописная буква указывает на мессианского референта в данном контексте, не добавляя имени.
- source_word: μετὰ τῶν νεκρῶν
  choice: среди мёртвых
  rationale: μετά с родительным может значить «с» или «среди»; контекстуально и идиоматически по-русски здесь уместно «среди мёртвых».
theological_decisions:
- issue: Смысл τὸν ζῶντα в контексте воскресения
  choice: Живого
  alternative: живого / Того, Кто жив
  rationale: Формулировка указывает на Иисуса как живого в противопоставлении мёртвым, сохраняя богословскую силу текста без поясняющего добавления о воскресении.
- issue: Передача вопроса Τί ζητεῖτε
  choice: Почему вы ищете
  alternative: Что вы ищете Живого с мёртвыми?
  rationale: Основной текст передаёт контекстуальный смысл вопроса, а сноска сохраняет буквальную форму и реальную лексическую возможность.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и торжественный. Для естественности и ясного различения участников первое местоимение раскрыто как «женщины», а говорящие обозначены словом «те».
