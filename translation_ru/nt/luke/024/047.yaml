  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: ru
  text: и чтобы во имя Его было возвещено всем народам покаяние для прощения грехов[a][b], начиная с Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покаяние и прощение грехов»; греческий текст допускает понимание этих слов как двух однородных элементов возвещаемой вести.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «всем язычникам»; соответствующее греческое слово в некоторых контекстах может обозначать языческие народы, то есть неевреев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: было возвещено
  rationale: Аористный пассивный инфинитив в контексте исполнения Писания передан конструкцией долженствования; «возвещено» сохраняет смысл публичного провозглашения и не ограничивает его формальной проповедью.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: во имя Его
  rationale: Естественная русская передача оборота, указывающего на полномочие и основание в личности и власти Иисуса.
- source_word: μετάνοιαν
  choice: покаяние
  rationale: Общепонятный и точный русский эквивалент, обозначающий внутренний поворот и перемену направленности, а не только интеллектуальную перемену мнения.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: для прощения грехов
  rationale: Передача связывает покаяние с прощением, как допускает синтаксис и контекст, не разворачивая эту связь в более подробную богословскую схему; координативная возможность отмечена в сноске.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: всем народам
  rationale: Передаёт всемирный охват поручения; «народы» сохраняет основное значение ἔθνη, не сужая его исключительно до язычников.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: начиная с Иерусалима
  rationale: Естественно передаёт причастный оборот и исходную точку возвещения, выраженную ἀπό.
theological_decisions:
- issue: Соотношение покаяния и прощения в содержании возвещения
  choice: «покаяние для прощения грехов»
  alternative: «покаяние и прощение грехов» как два однородных элемента возвещаемой вести
  rationale: Основной текст сохраняет тесную смысловую связь между покаянием и прощением, но не определяет подробный порядок спасения; грамматически возможное координативное прочтение сохранено в сноске.
- issue: Значение ἔθνη
  choice: «всем народам»
  alternative: «всем язычникам»
  rationale: Контекст воскресения и поручения указывает на всемирный охват. «Народы» сохраняет лексическую широту и включает язычников, не исключая иных групп.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Местоимение «Его» написано с прописной буквы по устойчивой русской библейской традиции. Порядок сносок в тексте соответствует последовательности поясняемых выражений.
