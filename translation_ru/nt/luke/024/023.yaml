  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: ru
  text: и, не найдя Его тела, они пришли и рассказали, что также видели ангелов в видении, которые говорят, что Он жив.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «они пришли и рассказали, что также видели ангелов в видении и что они говорят, что Он жив»; в таком понимании «говорят» относится к женщинам, а не к ангелам.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: не найдя
  rationale: Аористное причастие женского рода множественного числа относится к женщинам; русское деепричастие естественно и точно передаёт предшествующее обстоятельство с сохранением отрицания.
- source_word: τὸ σῶμα αὐτοῦ
  choice: Его тела
  rationale: Обычное значение σῶμα в контексте погребения и воскресения; местоимение однозначно относится к Иисусу.
- source_word: ἦλθον λέγουσαι
  choice: они пришли и рассказали
  rationale: ἦλθον передано буквально как «пришли», без добавления подразумеваемого «вернулись». Причастие λέγουσαι естественно выражено однородным сказуемым «рассказали», вводящим содержание их сообщения.
- source_word: καὶ ὀπτασίαν ἀγγέλων
  choice: также ангелов в видении
  rationale: καί добавляет к сообщению о пропавшем теле ещё одно необычайное обстоятельство. Формулировка «ангелов в видении» избегает возможной русской двусмысленности сочетания «видение ангелов», которое может быть понято как видение, принадлежавшее ангелам.
- source_word: ἑωρακέναι
  choice: видели
  rationale: Перфектный инфинитив входит в косвенную речь; в современном русском прошедшее время естественно передаёт увиденное до момента рассказа без тяжеловесного «увидели ранее».
- source_word: οἳ λέγουσιν
  choice: которые говорят
  rationale: Мужской род множественного числа οἳ грамматически соотносится с ангелами, а настоящее время λέγουσιν сохранено как «говорят».
- source_word: αὐτὸν ζῆν
  choice: что Он жив
  rationale: Инфинитивная конструкция естественно передана придаточным предложением; «жив» ясно выражает утверждение о продолжающейся жизни, не добавляя толкования.
theological_decisions:
- issue: К кому относится οἳ λέγουσιν
  choice: 'Относительное предложение относится к ангелам: «которые говорят, что Он жив».'
  alternative: 'Отнести слова к женщинам: «они говорят, что Он жив».'
  rationale: Ближайший антецедент — ἀγγέλων; кроме того, мужское οἳ согласуется с подразумеваемыми ангелами, тогда как женщины обозначены формами женского рода. Поэтому основной текст следует ясной греческой синтаксической связи, не вводя богословского уточнения извне.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю; достоинство повествования сохранено без архаизмов. Заглавные буквы в местоимениях «Его» и «Он» употреблены как принятая русская издательская норма при указании на Иисуса.
