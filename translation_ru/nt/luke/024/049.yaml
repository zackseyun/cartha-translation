source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: ru
  text: И вот, Я посылаю на вас обещание Моего Отца. Вы же оставайтесь в городе, пока не облечётесь силой свыше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: И вот
  rationale: Естественно передаёт указательно-эмфатическую частицу, привлекающую внимание, без архаичного «се».
- source_word: ἐξαποστέλλω
  choice: Я посылаю
  rationale: Настоящее время сохранено; глагол передаёт действие отправления или ниспослания, а в данном контексте естественно звучит «посылаю».
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: обещанное Моим Отцом
  rationale: Греческое существительное буквально означает «обещание», но здесь метонимически указывает на то, что Отец обещал; русская субстантивированная форма ясна и естественна.
- source_word: ἐφ’ ὑμᾶς
  choice: на вас
  rationale: Сохраняет направленность обещанного дара на учеников и соответствует образности исходного текста.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: оставайтесь в городе
  rationale: В контексте καθίζω означает оставаться, пребывать на месте; буквальное «сидите» по-русски могло бы создать неверный образ позы.
- source_word: ἐνδύσησθε
  choice: облечётесь
  rationale: Сохраняет метафору надевания одежды и пассивно-медиальную форму, не уточняя прямо действующего лица.
- source_word: ἐξ ὕψους δύναμιν
  choice: силой свыше
  rationale: Традиционно и точно передаёт источник силы «с высоты/свыше», сохраняя возвышенный, но понятный регистр.
theological_decisions:
- issue: Значение «обещания Отца»
  choice: обещанное Моим Отцом
  alternative: обещание Моего Отца
  rationale: Выбранный вариант показывает, что на учеников посылается исполнение обещанного, не добавляя здесь явного отождествления со Святым Духом сверх формулировки самого стиха.
- issue: Образ получения силы
  choice: пока не облечётесь силой свыше
  alternative: пока сила свыше не сойдёт на вас
  rationale: Сохранена исходная метафора облачения и не заменена иной библейской образностью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные буквы в местоимениях «Я», «Моим» следуют принятой русской издательской традиции при прямой речи Иисуса; архаизмы исключены.
