  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: ru
  text: Это были Мария Магдалина, Иоанна, Мария, мать Иакова[a], и другие женщины, бывшие с ними. Они рассказывали апостолам об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мария Иакова». Вероятнее всего, имеется в виду мать Иакова, но возможно и значение «жена Иакова».'
    reason: Греческий текст оставляет точный характер родства невыраженным.
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Это были
  rationale: Такая конструкция естественно вводит и перечисляет уже упомянутых в контексте женщин; слабый переходный оттенок δέ передаётся связностью повествования без добавления искусственного «теперь».
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Мария Магдалина
  rationale: Устоявшаяся и понятная русская форма имени и прозвания.
- source_word: Ἰωάννα
  choice: Иоанна
  rationale: Традиционная русская передача личного имени.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Мария, мать Иакова
  rationale: Краткая греческая конструкция буквально обозначает Марию через её связь с Иаковом. Материнство наиболее вероятно по евангельскому словоупотреблению, однако неоднозначность отмечена в сноске.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: другие женщины, бывшие с ними
  rationale: Женский род множественного числа позволяет естественно восстановить подразумеваемое «женщины», а σὺν αὐταῖς передано без добавления отсутствующего в тексте указания на приход.
- source_word: ἔλεγον
  choice: рассказывали
  rationale: Несовершенный вид передаёт продолженное или повторявшееся сообщение; глагол естественен для рассказа о событиях и вести.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: апостолам
  rationale: Дательный падеж естественно передаёт адресата речи, а «апостолы» — точный и общепринятый термин.
- source_word: ταῦτα
  choice: обо всём этом
  rationale: Выражение естественно отсылает к совокупности только что описанных событий и сохраняет множественный объём греческого указательного местоимения.
theological_decisions:
- issue: Кем Иаков приходился Марии в выражении Μαρία ἡ Ἰακώβου
  choice: Мария, мать Иакова
  alternative: Мария, жена Иакова; более буквально — «Мария Иакова»
  rationale: Греческий родительный падеж не называет родство прямо. По евангельским формулам именования наиболее вероятно, что речь о матери Иакова, но вариант «жена Иакова» грамматически возможен, поэтому неопределённость источника сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Традиционные формы библейских имён и термин «апостолы» сохранены; синтаксис сделан естественным без устранения подлинной неоднозначности.
