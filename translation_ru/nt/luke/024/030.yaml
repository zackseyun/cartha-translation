  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: ru
  text: И когда Он возлёг с ними за столом[a], то взял хлеб, благословил, преломил и стал подавать им[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть расположился с ними за трапезой полулёжа, согласно древнему обычаю.
    reason: cultural_note
  - marker: b
    text: 'Или: «подавал им». Греческая форма может подчёркивать продолжающееся действие; «стал подавать» указывает на его начало.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: и когда… то
  rationale: Луканская повествовательная формула естественно передана русской конструкцией «и когда… то»; это сохраняет переход и структуру события без архаичного «и было».
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: когда Он возлёг с ними за столом
  rationale: Оборот с артиклевым инфинитивом имеет временное значение. «Возлёг… за столом» точно отражает античный обычай принимать пищу полулёжа, оставаясь понятным в современном литературном русском.
- source_word: λαβὼν τὸν ἄρτον
  choice: взял хлеб
  rationale: Причастие передано личной формой для естественного русского синтаксиса; определённость хлеба ясна из ситуации и не требует указательного слова.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Глагол передаёт произнесение благословения над хлебом; дополнение не повторяется, поскольку оно ясно из контекста. Перевод не подменяет εὐλογέω глаголом «благодарить».
- source_word: κλάσας
  choice: преломил
  rationale: Аористное причастие обозначает действие, предшествующее раздаче. Последовательность сохраняется цепью однородных сказуемых; «преломил» — естественное и dignified обозначение разламывания хлеба.
- source_word: ἐπεδίδου
  choice: стал подавать им
  rationale: Имперфект допускает процессное или начинательное понимание. «Стал подавать» передаёт начало продолжающейся раздачи и хорошо соответствует развитию сцены.
theological_decisions:
- issue: Возможные евхаристические или сакраментальные ассоциации последовательности действий
  choice: Сохранить обычный язык трапезы без добавленного сакраментального истолкования
  alternative: Усилить словесные ассоциации с Вечерей Господней
  rationale: Последовательность «взял — благословил — преломил — стал подавать» может вызывать богословские ассоциации, но сам стих прямо не называет происходящее таинством. Перевод сохраняет формулировки действий и не разрешает этот вопрос конфессионально.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Возлёг» и «преломил» сохраняют историческую и повествовательную окраску, а сноски поясняют культурную реалии и аспектуальную неоднозначность.
