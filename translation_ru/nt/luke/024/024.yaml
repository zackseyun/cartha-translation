  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: ru
  text: Некоторые из тех, кто был с нами, пошли к гробнице и нашли всё именно так, как сказали женщины, но Его не увидели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: пошли
  rationale: Аорист ἀπέρχομαι здесь просто обозначает движение к названному месту; «пошли» естественно передаёт повествовательный смысл, не делая лишнего акцента на уходе.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: некоторые из тех, кто был с нами
  rationale: Формулировка близко передаёт структуру греческого выражения и не уточняет характер принадлежности этих людей к группе сверх сказанного в тексте.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: к гробнице
  rationale: В данном контексте μνημεῖον означает место погребения Иисуса; «гробница» точно и привычно для евангельского повествования.
- source_word: εὗρον
  choice: нашли
  rationale: Прямое и стилистически нейтральное соответствие простому повествовательному глаголу.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: нашли всё именно так, как сказали женщины
  rationale: «Именно так, как» передаёт соответствие, выраженное οὕτως καθὼς. Слово «всё» естественно восполняет подразумеваемое положение дел, не добавляя конкретных деталей. Частица καί перед «женщины» отдельно не выражена, поскольку её добавочный оттенок уже естественно отражён сравнительной конструкцией.
- source_word: αὐτὸν
  choice: Его
  rationale: Сохранено местоимение, относящееся к Иисусу, без поясняющей замены именем; прописная буква соответствует принятой русской библейской издательской традиции.
- source_word: δὲ
  choice: но
  rationale: Союз ясно передаёт мягкое противопоставление между подтверждением рассказа женщин и тем, что Иисуса не увидели.
- source_word: οὐκ εἶδον
  choice: не увидели
  rationale: Передаёт именно значение ὁράω — «видеть», не подменяя его глаголом «найти»; субъект понятен из первой части предложения.
theological_decisions:
- issue: Формулировка повествования о воскресении
  choice: Посетившие гробницу подтвердили сообщение женщин о положении дел, однако самого Иисуса не увидели.
  alternative: Уточнить, какие именно детали они подтвердили, или согласовать стих с параллельными рассказами.
  rationale: Перевод сохраняет разграничение самого греческого текста между обнаруженным в гробнице и отсутствием встречи с Иисусом, не привнося гармонизирующих подробностей.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза ясна обычному читателю и сохраняет достоинство библейского регистра. «Гробница» выбрана как точное контекстуальное обозначение места погребения; синтаксис слегка перестроен ради естественности русского языка.
