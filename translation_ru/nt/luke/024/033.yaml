  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: ru
  text: И, встав в тот же час, они возвратились в Иерусалим и нашли Одиннадцать и тех, кто был с ними, собравшимися вместе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собранными вместе». Греческое причастие описывает их как уже находившихся вместе в тот момент, когда их нашли.'
    reason: Лексическая альтернатива и пояснение результирующего состояния, выраженного греческим причастием.
lexical_decisions:
- source_word: ἀναστάντες
  choice: они встали
  rationale: Аористное причастие обозначает действие, предшествующее возвращению. Личная форма с последующим однородным сказуемым естественна в современном русском повествовании и сохраняет физическое действие.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: в тот же час
  rationale: Передаёт как указание на конкретный момент, так и подчёркнутую безотлагательность, не заменяя временной образ наречием «немедленно».
- source_word: ὑπέστρεψαν
  choice: возвратились
  rationale: Обычное значение глагола в контексте возвращения в прежнее место; слово соответствует dignified narrative register.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: εὗρον
  choice: нашли
  rationale: Прямое и естественное соответствие повествовательному употреблению εὑρίσκω.
- source_word: ἠθροισμένους
  choice: собравшимися вместе
  rationale: Передаёт результирующее состояние обеих названных групп в момент, когда их нашли. Возвратная форма естественна по-русски, а «вместе» сохраняет коллективный оттенок глагола.
- source_word: τοὺς ἕνδεκα
  choice: одиннадцать
  rationale: Сохраняет данное в греческом тексте устойчивое обозначение основной группы учеников после отпадения Иуды, не добавляя отсутствующего существительного «апостолы» или «ученики».
- source_word: τοὺς σὺν αὐτοῖς
  choice: тех, кто был с ними
  rationale: Ясно обозначает других присутствовавших вместе с одиннадцатью, не уточняя их статус сверх сказанного в тексте.
theological_decisions:
- issue: Обозначение группы как «одиннадцать», хотя точный состав присутствовавших может вызывать вопросы
  choice: Сохранить «одиннадцать» как групповое обозначение без гармонизации.
  alternative: «одиннадцать апостолов» или «оставшиеся ученики»
  rationale: Греческий текст употребляет τοὺς ἕνδεκα. Прямой перевод не решает за читателя вопрос о точном числе присутствовавших и не добавляет названия группы, которого в стихе нет.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Порядок слов сохраняет последовательность действий, а положение оборота «собравшимися вместе» показывает, что он относится и к одиннадцати, и к тем, кто был с ними.
