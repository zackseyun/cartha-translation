  source_fidelity: 'Смысл греческого текста в целом передан точно: действие немедленного возвращения, Иерусалим, группа «Одиннадцать», другие находившиеся с ними и уже состоявшееся собрание сохранены. Однако «одиннадцать» следует писать с прописной буквы как устойчивое групповое обозначение τοὺς ἕνδεκα, а не как простое числительное.'
  naturalness: Фраза с краткой последовательностью личных форм понятна, но деепричастный оборот «Встав в тот же час» более естественно связывает предшествующее действие с возвращением и не создаёт тяжеловесного ряда «встали, возвратились». Оборот «нашли ... собравшимися вместе» допустим в литературном повествовательном регистре и удачно передаёт результирующее состояние причастия.
  terminology: «Одиннадцать» с прописной буквы сохраняет традиционное в тексте наименование группы без добавления слова «апостолы» или иной интерпретации. «Иерусалим» и «возвратились» уместны по регистру.
