  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: ru
  text: 'И сказал им: «Так написано: Мессия[a] пострадает и воскреснет из мёртвых[b] на третий день».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Христос». Греческое Χριστός означает «Помазанник» и здесь употреблено как титул.
    reason: alternative_reading
  - marker: b
    text: 'Буквальнее: «из числа мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: 'Перфект пассива служит устойчивой формулой ссылки на Писание: речь идёт о том, что написано и остаётся в силе.'
- source_word: παθεῖν
  choice: пострадает
  rationale: Инфинитив передаёт содержание написанного; русская форма будущего времени естественно звучит в придаточном с «что» и не добавляет прямо не выраженной модальности «должен» или «надлежит».
- source_word: τὸν χριστόν
  choice: Мессия
  rationale: Артикль показывает, что Χριστός здесь выступает как титул; «Мессия» сохраняет иудейский и библейский контекст Помазанника.
- source_word: ἀναστῆναι
  choice: воскреснет
  rationale: Активный инфинитив употреблён непереходно; перевод сохраняет активную формулировку, не заменяя её пассивным «будет воскрешён».
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Это естественное и традиционно понятное русское выражение о воскресении; более буквальное пространственное значение отмечено в сноске.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: на третий день
  rationale: Дательный падеж имеет временное значение, которое естественно передаётся этим русским оборотом.
- source_word: οὕτως
  choice: так
  rationale: Кратко и точно сохраняет вводную формулу, указывающую на содержание написанного.
- source_word: ὅτι
  choice: что
  rationale: Союз естественно вводит по-русски содержание того, что написано, сохраняя синтаксическую связь исходного текста.
theological_decisions:
- issue: Передача Χριστός в кратком изложении страданий и воскресения
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово употреблено как титул обещанного Помазанника, а не как часть имени; основной перевод сохраняет этот титульный и библейский оттенок.
- issue: Залог глагола ἀναστῆναι
  choice: воскреснет
  alternative: будет воскрешён
  rationale: В греческом стоит активный инфинитив с непереходным значением. Перевод не подменяет его пассивной формой, хотя в других местах Новый Завет говорит и о том, что Бог воскресил Иисуса.
- issue: Модальность страданий Мессии
  choice: пострадает
  alternative: должен пострадать
  rationale: В этом предложении нет отдельного модального глагола со значением необходимости. Будущее время естественно передаёт содержание Писания, не устраняя подразумеваемого исполнения замысла и не усиливая грамматику.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Конструкция «написано, что» естественно передаёт содержание письменного свидетельства; формы будущего времени позволяют избежать искусственного инфинитивного оборота и не добавляют прямо не выраженного значения необходимости. Маркеры сносок поставлены непосредственно после слов, к которым относятся.
