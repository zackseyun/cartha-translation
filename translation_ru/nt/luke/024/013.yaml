  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: ru
  text: И вот, в тот самый день двое из них шли в селение под названием Эммаус, находившееся в шестидесяти стадиях[a] от Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стадия — древняя мера расстояния; шестьдесят стадий — примерно 11 километров.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет повествовательный сигнал Луки и привлекает внимание к новой сцене, оставаясь естественным для современного литературного русского языка.
- source_word: δύο ἐξ αὐτῶν
  choice: двое из них
  rationale: Естественно передаёт партитивное выражение, не уточняя сверх текста, к какой именно группе они принадлежали.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: в тот самый день
  rationale: Передаёт подчёркнутое указание на тот же день и связь событий по времени.
- source_word: ἦσαν πορευόμενοι
  choice: шли
  rationale: Передаёт продолжавшееся движение в прошлом; простая русская форма звучит естественнее буквального перифрастического оборота.
- source_word: εἰς κώμην
  choice: в селение
  rationale: «Селение» точно и достойно передаёт κώμη без современного административного оттенка слова «посёлок».
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: находившееся в шестидесяти стадиях от Иерусалима
  rationale: Сохраняет древнюю меру расстояния и явно передаёт значение причастия ἀπέχουσαν; современный эквивалент вынесен в примечание.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: под названием Эммаус
  rationale: Естественно по-русски передаёт греческую конструкцию «которому имя Эммаус» без стилистической тяжеловесности.
