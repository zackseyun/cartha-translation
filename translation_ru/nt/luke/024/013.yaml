translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским повествовательным тоном. Порядок компонентов слегка перестроен ради естественности: название селения дано перед указанием расстояния. Маркер [a] помещён непосредственно после древней меры.'
