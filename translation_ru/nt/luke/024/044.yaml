id: LUK.24.44
reference: Luke 24:44
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: ru
  text: 'Затем Он сказал им: «Это Мои слова, которые Я говорил вам, когда ещё был с вами: должно исполниться всё написанное[a] обо Мне[c] в Законе Моисея, Пророках и Псалмах[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё то, что написано».'
    reason: lexical_alternative
  - marker: b
    text: «Закон Моисея, Пророки и Псалмы», вероятно, обозначают основные разделы Писания Израиля. «Псалмы» могут означать собственно Псалтирь или, шире, раздел Писаний.
    reason: cultural_note
  - marker: c
    text: 'Или: «касающееся Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Затем Он сказал им
  rationale: δέ — мягкая повествовательная связка; «затем» естественно продолжает рассказ, не придавая ей сильного противительного значения. πρός с глаголом речи передано обычным русским «им».
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Вот слова, которые Я говорил вам
  rationale: «Вот слова» естественно передаёт указательную конструкцию οὗτοι οἱ λόγοι; притяжательное μου раскрывается последующим «Я говорил», что позволяет избежать тяжеловесного «вот Мои слова, которые Я говорил».
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: которые Я говорил вам
  rationale: Сохраняется относительное придаточное и обычное значение λαλέω — «говорить».
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: ещё когда был с вами
  rationale: Причастный оборот передан временным придаточным; «ещё» отражает ἔτι, а «с вами» — σύν с дательным падежом.
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: должно исполниться
  rationale: Передаёт необходимость, выраженную δεῖ, и привычный для связи с Писанием смысл πληρόω, не объясняя сверх текста природу этой необходимости.
- source_word: πάντα τὰ γεγραμμένα
  choice: всё написанное
  rationale: Сохраняет всеохватность πάντα и результативный смысл перфектного причастия γεγραμμένα; выражение естественно для современного русского языка.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: в Законе Моисея, у Пророков и в Псалмах
  rationale: 'Названия переданы как обозначения частей Писания. Вариативные русские предлоги обеспечивают естественность: текст находится «в Законе» и «в Псалмах», тогда как «у Пророков» идиоматично обозначает пророческие книги и их авторов, не меняя референта.'
- source_word: περὶ ἐμοῦ
  choice: обо Мне
  rationale: Кратко и естественно передаёт значение περί с родительным падежом — предмет или отнесённость написанного.
theological_decisions:
- issue: Сила необходимости исполнения Писания
  choice: «должно исполниться»
  alternative: «надлежало исполниться» / «предстояло исполниться»
  rationale: Настоящее δεῖ выражает необходимость. Выбранный вариант сохраняет её богословский вес, но не вводит определённой теории пророчества или предопределения.
- issue: Статус Закона, Пророков и Псалмов
  choice: Передать их как названия частей Писания и пояснить возможный объём слова «Псалмы» в сноске
  alternative: Однозначно истолковать «Псалмы» как весь раздел Писаний либо только как Псалтирь
  rationale: Формулировка может указывать на крупные разделы Писания Израиля, однако объём третьего обозначения остаётся предметом толкования; основной текст не разрешает эту неоднозначность.
- issue: Отнесённость написанного ко Христу
  choice: «всё написанное обо Мне»
  alternative: «всё, что касается Меня»
  rationale: «Обо Мне» прямо передаёт περὶ ἐμοῦ, не уточняя, идёт ли речь только о прямых предсказаниях или также о более широких образах и закономерностях Писания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, но без архаизмов вроде «надлежит» и «речённое». Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской издательской норме. Все сноски отмечены непосредственно при соответствующих выражениях.
