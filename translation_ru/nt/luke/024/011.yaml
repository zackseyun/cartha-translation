translation:
  language: ru
  text: И эти слова показались им бессмыслицей[a], и они не верили женщинам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нелепицей»; возможно также: «бессвязной речью». Греческое слово λῆρος обозначает речь, которую считают бессмысленной, нелепой или похожей на бред.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν
  choice: показались
  rationale: 'В сочетании со сравнительным оборотом ὡσεὶ λῆρος глагол передаёт оценку услышанного: слова «показались» им бессмыслицей.'
- source_word: ἐνώπιον αὐτῶν
  choice: им
  rationale: Буквально «перед ними», но при глаголе восприятия и оценки естественный русский эквивалент — «им».
- source_word: ὡσεὶ λῆρος
  choice: бессмыслицей
  rationale: λῆρος обозначает речь, которую считают бессвязной, нелепой или пустой; творительный падеж после «показались» естественно передаёт сравнение, выраженное ὡσεὶ.
- source_word: τὰ ῥήματα ταῦτα
  choice: эти слова
  rationale: Прямой и естественный эквивалент греческого словосочетания, не заменяющий его более толковательным «рассказом» или «сообщением».
- source_word: ἠπίστουν
  choice: не верили
  rationale: Имперфект выражает продолжавшееся неверие; «не верили» передаёт это без добавочного оттенка сознательного отказа верить.
- source_word: αὐταῖς
  choice: женщинам
  rationale: Местоимение имеет форму женского рода во множественном числе и отсылает к названным в ближайшем контексте женщинам. Явное существительное устраняет неясность русского «им», не добавляя нового референта.
