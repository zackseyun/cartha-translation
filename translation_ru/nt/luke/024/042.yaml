lexical_decisions:
- source_word: οἱ δὲ
  choice: А они
  rationale: Субстантивированное οἱ указывает на собравшихся учеников, а δέ служит мягкой связкой. «А они» естественно продолжает повествование, не создавая резкого противопоставления.
- source_word: ἐπέδωκαν
  choice: подали
  rationale: Аорист ἐπιδίδωμι здесь означает дать или передать. В ситуации, где Иисусу дают пищу, русское «подали» звучит естественно и конкретно.
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж обозначает косвенный объект. Прописная буква сохраняет принятую в русской библейской традиции уважительную передачу местоимения, относящегося к Иисусу.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: кусок печёной рыбы
  rationale: μέρος — главное слово со значением «кусок, часть», а родительный оборот ἰχθύος ὀπτοῦ уточняет, из чего он состоял. «Кусок печёной рыбы» точно и естественно передаёт конструкцию.
- source_word: ὀπτοῦ
  choice: печёной
  rationale: ὀπτός обозначает пищу, приготовленную жарением или запеканием на огне. «Печёной» — ясный современный эквивалент без излишне узкого указания на конкретный способ приготовления.
theological_decisions:
- issue: Текстовая форма Луки 24:42
  choice: 'Переведён только текст SBLGNT: «кусок печёной рыбы».'
  alternative: 'В некоторых поздних рукописях добавлено: «и сотового мёда».'
  rationale: Предоставленный критический греческий текст заканчивается словом μέρος и не содержит более пространного чтения. Вариант отмечен в сноске ради текстологической прозрачности.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная формулировка. Сохранена мягкая связность δέ и не уточняется способ приготовления точнее, чем позволяет ὀπτός.
