id: LUK.24.16
reference: Luke 24:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: ru
  text: Но их глаза были удержаны, так что они не узнали Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их глаза были удерживаемы, чтобы они не узнали Его»; также возможно: «их глазам не давали узнать Его». В греческом тексте не сказано, кто или что мешало им узнать Иисуса.'
    reason: Передать возможные оттенки страдательной конструкции и сохранить неназванным действующее лицо.
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: 'Мягкий противительный переход подчёркивает контраст: Иисус подошёл к ученикам, однако они Его не узнали.'
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: их глаза
  rationale: Сохранён конкретный телесный образ исходного текста; перевод не заменяет его отвлечённым «они не могли».
- source_word: ἐκρατοῦντο
  choice: были удержаны
  rationale: Страдательная форма передаёт состояние удерживания или сдерживания и не называет действующее лицо, как и греческий текст.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: так что они не узнали
  rationale: Оборот с артиклевым инфинитивом и μή допускает оттенок результата или цели. В данном контексте ἐπιγινώσκω означает распознать, опознать знакомого человека; по-русски естественно «узнать».
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому русскому библейскому оформлению личных местоимений, относящихся к Богу и Христу.
theological_decisions:
- issue: Кто не позволил ученикам узнать Иисуса
  choice: 'Сохранить страдательную конструкцию без указания действующего лица: «глаза были удержаны».'
  alternative: Прямо назвать Бога действующим лицом или передать фразу только как неспособность учеников узнать Иисуса.
  rationale: В греческом тексте субъект, удерживающий их глаза, не назван. Перевод не должен устранять эту намеренную неопределённость или прямо приписывать действие Богу.
translation_notes:
  register: Современный литературный русский с сохранением несколько необычного, но значимого образа удержанных глаз. Порядок слов естественный для современного русского; конструкция остаётся достаточно буквальной, чтобы не скрыть безличный пассив и богословскую неопределённость.
