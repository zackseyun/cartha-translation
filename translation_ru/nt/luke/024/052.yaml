lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход без добавления временного оттенка.
- source_word: αὐτοὶ
  choice: они
  rationale: Передаёт явно выраженное местоимение; усиленное «они сами» звучало бы в современном русском неоправданно подчёркнуто.
- source_word: προσκυνήσαντες αὐτόν
  choice: поклонившись Ему
  rationale: Деепричастие естественно передаёт предшествующее действие аористного причастия. «Поклонившись» сохраняет присущую προσκυνέω смысловую широту — телесное преклонение, почитание или поклонение — не снимая богословского напряжения контекста.
- source_word: ὑπέστρεψαν
  choice: возвратились
  rationale: Точно и в достойном повествовательном регистре передаёт значение возвращения.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Естественное русское обозначение направления движения к городу.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: с великой радостью
  rationale: Сохраняет существительное χαρά и усиление прилагательным μεγάλη; оборот естественен для литературного библейского повествования.
theological_decisions:
- issue: Значение προσκυνέω по отношению к воскресшему Иисусу
  choice: поклонившись Ему
  alternative: воздав Ему поклонение
  rationale: Русское «поклонившись» позволяет сохранить реальную лексическую неоднозначность между преклонением, почитанием и поклонением. Контекст возвышения Иисуса допускает сильный богословский смысл, но сам перевод не должен принудительно устранять широту греческого слова.
- issue: Текстуально неустойчивая фраза [προσκυνήσαντες αὐτόν]
  choice: включена в основной текст с примечанием
  alternative: опустить фразу
  rationale: SBLGNT приводит слова в скобках как текстуально сомнительные. Их следует перевести в основном тексте и сообщить читателю об их отсутствии в некоторых рукописях.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным звучанием. Заглавная буква в «Ему» используется как принятая русская почтительная графическая норма; она не меняет содержания исходного местоимения. Лексическая неоднозначность προσκυνέω сохранена словом «поклонившись», поэтому отдельное примечание с лексической альтернативой не требуется.
