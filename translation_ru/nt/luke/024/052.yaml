  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: ru
  text: И они, поклонившись Ему[a], возвратились в Иерусалим с великой радостью.
  philosophy: optimal-equivalence
