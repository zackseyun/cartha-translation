lexical_decisions:
- source_word: Ταῦτα
  choice: об этом
  rationale: Указательное местоимение среднего рода во множественном числе отсылает к только что обсуждавшимся событиям. По-русски естественное собирательное «об этом» передаёт эту дискурсивную связь без тяжеловесного «об этих вещах».
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: Пока они говорили
  rationale: Генитив абсолютный с причастием настоящего времени обозначает одновременное продолжающееся действие; «пока» естественно выражает временное отношение. Отдельный перевод δέ не требуется, поскольку его переходная функция передана всей конструкцией.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Явно выраженное местоимение имеет усилительный оттенок; «Он Сам» сохраняет акцент на личном присутствии Иисуса.
- source_word: ἔστη
  choice: встал
  rationale: Аорист ἵστημι прямо обозначает занятие стоячего положения. «Встал» не добавляет идеи появления или движения, которой глагольная форма сама по себе не выражает.
- source_word: ἐν μέσῳ αὐτῶν
  choice: посреди них
  rationale: Точно и естественно передаёт положение внутри собравшейся группы; несколько буквальнее греческого оборота, чем «среди них», и соответствует достоинству повествовательного регистра.
theological_decisions:
- issue: 'Включать ли более длинное чтение: «и сказал им: „Мир вам!“»'
  choice: Не включать в основной текст, следуя предоставленному тексту SBLGNT.
  alternative: 'Включить: «и сказал им: „Мир вам!“»'
  rationale: Предоставленный греческий текст заканчивается словами «посреди них». Значимое более длинное чтение сохраняется в сноске, без гармонизации основного текста с иной рукописной традицией.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный повествовательный стиль. Заглавные буквы в «Он Сам» служат также усилению местоимения; грамматически перевод не устраняет внезапность события, но и не вводит отсутствующий в греческом глагол «явился».
