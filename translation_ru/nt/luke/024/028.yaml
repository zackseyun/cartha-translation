  verdict: approve
  source_fidelity: 'Текст точно передаёт все основные элементы греческого: приближение к селению (ἤγγισαν εἰς τὴν κώμην), место назначения пути (οὗ ἐπορεύοντο) и то, что Иисус создал впечатление, будто продолжает путь дальше (προσεποιήσατο πορρώτερον πορεύεσθαι). Временное «Когда» несколько сглаживает исходное сочинительное καί, но не меняет смысла или последовательности повествования.'
  naturalness: Фраза звучит естественно и кратко в современном литературном русском. «Сделал вид, что идёт дальше» — ясная, идиоматичная передача; настоящее время после «сделал вид, что» нормативно и передаёт видимое, представленное действие.
  terminology: «Селение» уместно для κώμη и сохраняет отличие от города. «Сделал вид» корректно передаёт προσποιέομαι без неоправданного усиления до обвинения в обмане. Прописное «Он» соответствует принятой в русском библейском регистре уважительной практике и не затрагивает смысл оригинала. Сноска даёт допустимые лексические альтернативы и правильно привязана к выражению.
