source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: ru
  text: Когда они приблизились к селению, куда шли, Он сделал вид, что идёт дальше.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притворился, будто собирается идти дальше»; или: «показал вид, что пойдёт дальше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: приблизились
  rationale: Аорист ἐγγίζω обозначает приближение к месту; «приблизились» естественно и точно передаёт движение.
- source_word: κώμην
  choice: селению
  rationale: κώμη означает небольшое поселение; «селение» сохраняет масштаб, не подразумевая города.
- source_word: οὗ ἐπορεύοντο
  choice: куда шли
  rationale: Относительное наречие с имперфектом πορεύομαι указывает на место назначения продолжающегося пути; краткая русская формулировка естественна.
- source_word: προσεποιήσατο
  choice: сделал вид
  rationale: Средняя форма προσποιέομαι здесь означает создать впечатление намерения или действия. «Сделал вид» сохраняет повествовательную неоднозначность, не усиливая формулировку до прямого обвинения в обмане.
- source_word: πορρώτερον
  choice: дальше
  rationale: Сравнительное наречие обозначает продолжение пути на большее расстояние; «дальше» естественно в данном контексте.
- source_word: πορεύεσθαι
  choice: идёт
  rationale: Инфинитив зависит от προσεποιήσατο и выражает видимое продолжение движения; в русском после «сделал вид, что» естественна личная форма настоящего времени.
theological_decisions:
- issue: Передача προσεποιήσατο применительно к поступку Иисуса
  choice: Он сделал вид, что идёт дальше
  alternative: Он притворился, будто собирается идти дальше
  rationale: Выбранная формулировка передаёт, что Иисус создал впечатление намерения продолжить путь, но не навязывает более сильного вывода о намеренном обмане. Напряжение исходного повествования сохраняется.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и понятная. Местоимение «Он» написано с прописной буквы как традиционное уважительное обозначение Иисуса, без добавления отсутствующего в греческом имени.
