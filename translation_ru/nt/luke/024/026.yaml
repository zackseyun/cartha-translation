  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: ru
  text: Разве не надлежало Мессии претерпеть всё это и войти в Свою славу?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христу». Греческий титул Χριστός здесь переведён словом «Мессия», чтобы сохранить его смысл в контексте исполнения Писаний.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: ταῦτα
  choice: всё это
  rationale: Указывает на уже упомянутые страдания; добавление «всё» идиоматично передаёт собирательный смысл греческого множественного числа.
- source_word: ἔδει
  choice: надлежало
  rationale: Выражает необходимость, связанную в контексте с Божьим замыслом и исполнением Писаний, не сводя её к внешнему принуждению.
- source_word: παθεῖν
  choice: претерпеть
  rationale: Точно и достойно передаёт перенесение названных страданий; объект «всё это» делает формулировку естественной.
- source_word: τὸν χριστὸν
  choice: Мессии
  rationale: Χριστός здесь является титулом в контексте исполнения Писаний; «Мессия» раскрывает его смысл для современного русского читателя.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое сочинение двух инфинитивов, не добавляя явно выраженной временной последовательности.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: войти в Свою славу
  rationale: Сохраняет образ вхождения и притяжательное местоимение; «Свою» естественно соотносит славу с подлежащим «Мессия».
- source_word: δόξαν
  choice: славу
  rationale: Традиционное и семантически точное соответствие δόξα в контексте воскресения и возвышения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте слово выступает как титул и связано с исполнением Писаний; перевод «Мессия» сохраняет это значение. Альтернатива отмечена в сноске.
- issue: Смысл ἔδει
  choice: надлежало
  alternative: нужно было / должен был
  rationale: «Надлежало» передаёт обусловленную Божьим замыслом необходимость, но не вводит её объяснение непосредственно в текст.
- issue: Отношение страдания к славе
  choice: простое соединение союзом «и»
  alternative: «а затем войти»
  rationale: Греческий καί не требует добавления «затем»; вероятная последовательность сохраняется без её усиленного истолкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Надлежало» и «претерпеть» понятны широкому читателю и сохраняют достоинство и лаконизм исходного риторического вопроса.
