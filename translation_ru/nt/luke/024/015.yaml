lexical_decisions:
- source_word: ἐγένετο
  choice: И вот
  rationale: Луканская повествовательная формула естественно передаётся современным русским оборотом, вводящим новое событие, без архаичного «и случилось».
- source_word: ἐν τῷ ὁμιλεῖν αὐτοὺς
  choice: пока они разговаривали
  rationale: Конструкция с ἐν и субстантивированным инфинитивом имеет временное значение; «пока» ясно передаёт одновременность действий.
- source_word: συζητεῖν
  choice: спорили
  rationale: Глагол может обозначать совместное обсуждение с оттенком прения. В сочетании с более нейтральным «разговаривали» слово «спорили» сохраняет нарастание интенсивности, не обязательно подразумевая враждебную ссору.
- source_word: αὐτὸς Ἰησοῦς
  choice: сам Иисус
  rationale: «Сам» сохраняет выраженное местоимением αὐτός смысловое ударение на личности подошедшего.
- source_word: ἐγγίσας
  choice: приблизившись
  rationale: Деепричастие естественно передаёт аористное причастие и обозначает приближение, предшествующее или сопутствующее основному действию.
- source_word: συνεπορεύετο
  choice: пошёл вместе с ними
  rationale: Передаёт совместное движение по дороге; русский глагол совершенного вида естественно описывает присоединение Иисуса к путникам, хотя греческий имперфект также допускает акцент на продолжающемся пути.
theological_decisions:
- issue: Повествовательное ударение на личности приблизившегося
  choice: сам Иисус
  alternative: Иисус
  rationale: 'Сохранено грамматическое усиление αὐτός: к ученикам приблизился именно воскресший Иисус. Никакого дополнительного богословского вывода в перевод не внесено.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «И вот» сохраняет живой переход к событию; «сам Иисус» передаёт исходное ударение. Порядок действий оставлен ясным и естественным для русского читателя.
