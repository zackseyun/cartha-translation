  naturalness: Предлагаемая редакция сохраняет современный литературный, повествовательный русский. «И вот» уместно передаёт луканский переход к событию без архаизации; «шёл вместе с ними» естественно выражает длительное сопровождение.
  terminology: «Сам Иисус» адекватно сохраняет эмфазу αὐτός. Нейтральное «обсуждали» соответствует συζητεῖν; возможность более напряжённого «спорили» следует оставить в сноске, не навязывая её как единственное значение.
