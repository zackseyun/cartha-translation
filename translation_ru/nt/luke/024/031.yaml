id: LUK.24.31
reference: Luke 24:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: ru
  text: Тогда у них открылись глаза, и они узнали его; и он стал невидим для них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он исчез у них из виду»; «он скрылся от их глаз».'
    reason: Лексические варианты передачи ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: открылись
  rationale: Аорист пассивного залога от διανοίγω передан естественной русской возвратной формой с пассивным значением; она сохраняет мысль о том, что способность увидеть и понять была им дана, а не возникла лишь по их собственной инициативе.
- source_word: οἱ ὀφθαλμοὶ
  choice: у них ... глаза
  rationale: Русская конструкция «у них открылись глаза» естественно передаёт греческое сочетание родительного местоимения αὐτῶν с подлежащим οἱ ὀφθαλμοί и сохраняет также переносный оттенок прозрения.
- source_word: ἐπέγνωσαν
  choice: узнали
  rationale: В данном контексте ἐπιγινώσκω означает опознание человека, которого прежде не распознали; «узнали» — естественный и точный русский эквивалент.
- source_word: ἄφαντος
  choice: невидим
  rationale: Прилагательное означает «невидимый, не видимый». Такой перевод не уточняет механизм события и не усиливает текст до утверждения о физическом исчезновении.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: стал ... для них
  rationale: Сочетание γίνομαι с ἄφαντος и ἀπό выражает наступившую для учеников невозможность видеть Иисуса. «Стал невидим для них» сохраняет относительный характер греческого выражения и звучит естественно по-русски.
- source_word: δὲ
  choice: Тогда
  rationale: Здесь δέ продвигает повествование вперёд; «тогда» ясно и естественно связывает событие с предшествующим действием.
theological_decisions:
- issue: Характер того, как Иисус перестал быть видим ученикам
  choice: он стал невидим для них
  alternative: он исчез у них из виду
  rationale: Греческое ἄφαντος ἐγένετο буквально указывает на то, что он стал невидимым для них, не объясняя, каким образом это произошло. Перевод сохраняет эту богословскую и повествовательную недосказанность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Строчная передача местоимений «его», «он» соответствует обычной современной русской орфографии и не вводит конфессионально обусловленной капитализации.
