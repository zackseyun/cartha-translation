  source_fidelity: '«Тогда у них открылись глаза, и они узнали его; и он стал невидим для них» точно передаёт структуру и смысл греческого текста: διηνοίχθησαν — открылись, ἐπέγνωσαν — узнали/опознали, ἄφαντος ἐγένετο ἀπ’ αὐτῶν — стал невидим для них. Перевод не определяет механизм того, как он перестал быть видимым.'
  naturalness: Фраза звучит как современный литературный русский в сдержанном библейском повествовательном регистре. Конструкция «у них открылись глаза» естественна и уместно сохраняет образное значение прозрения. «Стал невидим для них» несколько книжно, но вполне естественно в данном регистре и предпочтительно своей смысловой точностью.
  terminology: Местоимения и ключевые глаголы переданы последовательно и без конфессионально обусловленных добавлений. Строчные «его» и «он» соответствуют современной нейтральной орфографической норме. Сноска уместно отмечает более идиоматические альтернативы, не выдавая их за единственно возможное толкование.
