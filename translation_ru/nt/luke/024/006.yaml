  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: ru
  text: 'Его здесь нет — Он был воскрешён. Вспомните, что Он говорил вам, когда ещё был в Галилее:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Его здесь нет
  rationale: В греческом подлежащее не выражено, но из контекста ясно, что речь об Иисусе. Русская безлично-генитивная конструкция естественно передаёт отсутствие в данном месте.
- source_word: ἀλλὰ
  choice: —
  rationale: Противопоставление естественно выражено тире между краткими торжественными утверждениями; значение союза «но» при этом сохраняется без тяжеловесности.
- source_word: ἠγέρθη
  choice: Он воскрешён
  rationale: Аорист пассивного залога от ἐγείρω передан русским пассивом, чтобы сохранить форму исходного текста и подразумеваемое действие Бога.
- source_word: μνήσθητε
  choice: Вспомните
  rationale: Прямое повеление в совершенном виде естественно и выразительно передаёт аорист императива.
- source_word: ὡς
  choice: как
  rationale: Вводит воспоминание о том, что и каким образом Иисус говорил; «как» сохраняет некоторую широту греческой конструкции.
- source_word: ἐλάλησεν ὑμῖν
  choice: Он говорил вам
  rationale: Нейтрально передаёт λαλέω и адресованность речи, не конкретизируя её содержание сверх исходного текста.
- source_word: ἔτι ὢν
  choice: ещё находясь
  rationale: Естественная деепричастная конструкция сохраняет одновременность и значение ἔτι — «ещё».
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: в Галилее
  rationale: Стандартная передача местного значения и принятого русского названия области.
theological_decisions:
- issue: Передача ἠγέρθη в возвещении о воскресении
  choice: Он воскрешён
  alternative: Он воскрес
  rationale: Пассивная форма основного текста сохраняет грамматический залог греческого глагола и оттенок подразумеваемого Божьего действия, не отрицая воскресения Иисуса. Более привычный русский непереходный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык; краткое торжественное возвещение сочетается с ясным прямым призывом. Прописное «Он» употреблено по принятой русской библейской традиции. Конечное двоеточие отражает продолжение прямого напоминания в следующем стихе.
