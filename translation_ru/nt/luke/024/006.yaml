revisions:
- from: 'Его здесь нет — Он воскрешён.[a] Вспомните, как Он говорил вам, ещё находясь в Галилее:'
  to: 'Его здесь нет — Он был воскрешён. Вспомните, что Он говорил вам, когда ещё был в Галилее:'
  rationale: Заменены неестественная и аспектуально неточная форма «Он воскрешён» на «Он был воскрешён», сохраняющую аористное завершённое событие и пассивный залог. «Как» заменено на «что», поскольку речь идёт о припоминании сказанного, а не манеры речи. Сноска сохранена по существу и согласована с основным текстом.
