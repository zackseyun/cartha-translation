  timestamp: '2026-07-14T20:45:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Требуется исправление передачи ἠγέρθη: «Он воскрешён» в современном русском обычно обозначает происходящее действие либо неестественное состояние и не передаёт завершённое событие аориста. «Он был воскрешён» ясно сохраняет пассивный залог греческого текста. Для ὡς в данном контексте «что» точнее: далее следует содержание ранее сказанного Иисусом, тогда как «как Он говорил» по-русски преимущественно отсылает к манере речи.'
  naturalness: Исправленный текст звучит как современное литературное русское библейское возвещение. Формулировка «когда Он ещё был в Галилее» естественнее, чем деепричастный оборот после «говорил вам», и однозначно связывает временное обстоятельство с пребыванием Иисуса в Галилее.
  terminology: «Был воскрешён» сохраняет пассив исходного ἠγέρθη без навязывания толкования; вариант «воскрес» уместно оставить в сноске как естественную русскую альтернативу. «Галилея» передана нормативно.
  issues:
  - severity: high
    issue: «Он воскрешён» для ἠγέρθη
    rationale: 'Форма звучит как настоящее страдательное причастие/состояние либо как незавершённое действие и неестественна в данном пасхальном возвещении. Греческий аорист пассива требует передачи завершённого события: «Он был воскрешён».'
  - severity: medium
    issue: «Вспомните, как Он говорил вам» для ὡς ἐλάλησεν ὑμῖν
    rationale: В русском «как говорил» обычно означает способ речи. В контексте повеление отсылает к содержанию сказанного, которое раскрывается в следующем стихе; «что Он говорил вам» передаёт это без ненужного смещения смысла.
  revised_text: 'Его здесь нет — Он был воскрешён. Вспомните, что Он говорил вам, когда ещё был в Галилее:'
