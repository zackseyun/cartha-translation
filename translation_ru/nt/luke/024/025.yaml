  rationale: Исправлен только неестественный синтаксис. «Как вы медлительны сердцем, чтобы поверить» сохраняет образ καρδία и упрёк в βραδεῖς, а «поверить всему» ясно выражает направленность веры на полноту пророческих слов. Восклицательная перестройка естественна по-русски и соответствует силе Ὦ.
