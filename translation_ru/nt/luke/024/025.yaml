  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: ru
  text: 'И Он сказал им: «О, неразумные! Как вы медлительны сердцем, чтобы поверить всему, что сказали пророки!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: И Он сказал им
  rationale: Сохраняет последовательное повествовательное καί и прямо передаёт обращение к двум ученикам; отдельное усиление αὐτός по-русски здесь не требуется.
- source_word: Ὦ
  choice: О
  rationale: Передаёт торжественную и укоризненную силу греческого междометия при прямом обращении.
- source_word: ἀνόητοι
  choice: неразумные
  rationale: Указывает прежде всего на недостаток понимания и рассудительности, не сводя упрёк ни к одной лишь нравственной порочности, ни к недостатку интеллекта.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: медлительные сердцем
  rationale: Сохраняет образ сердца как внутреннего человека и значение внутренней медлительности, не заменяя его пояснительным пересказом.
- source_word: τοῦ πιστεύειν
  choice: в том, чтобы верить
  rationale: Передаёт зависимость инфинитива от «медлительные» и делает необычную греческую конструкцию приемлемой по-русски.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: всему, что
  rationale: Естественно передаёт всеохватность πᾶσιν и связь веры с содержанием пророческих слов.
- source_word: ἐλάλησαν
  choice: сказали
  rationale: Прямо передаёт аорист глагола речи без внесения в основной текст более специального оттенка возвещения.
- source_word: οἱ προφῆται
  choice: пророки
  rationale: Обычное и точное обозначение пророческого свидетельства Писания.
theological_decisions:
- issue: Характер упрёка Иисуса
  choice: Упрёк касается одновременно недостатка понимания и внутренней медлительности верить всему пророческому свидетельству.
  alternative: Передать слова либо как исключительно нравственное осуждение, либо как указание лишь на интеллектуальную ошибку.
  rationale: Сочетание ἀνόητοι с βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν связывает понимание, внутреннюю расположенность и веру; сохранение слов «сердцем» и «верить» удерживает эту напряжённость.
- issue: Объём пророческого свидетельства
  choice: «всему, что сказали пророки»
  alternative: Ограничить смысл только теми пророчествами, которые прямо говорят о страданиях Мессии.
  rationale: В стихе стоит πᾶσιν — «всему»; более узкое тематическое ограничение появляется из контекста следующего стиха, но не должно подменять формулировку данного стиха.
translation_notes:
  register: Современный литературный русский с сохранением торжественного прямого обращения и библейского образа сердца. Необычность оборота «медлительные сердцем» оставлена намеренно, а зависимость инфинитива прояснена словами «в том, чтобы».
