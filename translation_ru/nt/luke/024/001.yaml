base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: ru
  text: Но в первый день недели[a], очень рано, на рассвете, они пришли к гробнице, неся приготовленные ими благовония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в первый [день] суббот»; это устойчивый оборот, означающий первый день недели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Но в первый день недели
  rationale: Это обычный семитский оборот в греческом языке, обозначающий первый день недели. Буквальная передача со словом «суббот» была бы неясной и могла бы создать не предусмотренный текстом календарный смысл.
- source_word: ὄρθρου βαθέως
  choice: на самом рассвете
  rationale: Оборот указывает на самое раннее время рассвета. Такая передача сохраняет усиление, заложенное в βαθέως, и звучит естественно по-русски.
- source_word: ἐπὶ τὸ μνῆμα
  choice: к гробнице
  rationale: При глаголе движения ἐπί указывает направление. «Гробница» естественно обозначает место погребения и не смешивается с могильной ямой.
- source_word: ἦλθον
  choice: они пришли
  rationale: Аорист просто сообщает об их прибытии к гробнице; «пришли» естественно передаёт повествовательное движение к названному месту.
- source_word: φέρουσαι
  choice: неся
  rationale: Причастие женского рода множественного числа описывает одновременное с приходом действие женщин. Русское деепричастие естественно передаёт эту связь.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: приготовленные ими благовония
  rationale: ἀρώματα здесь означает ароматические вещества для погребального обряда. Перестройка относительного оборота в причастный сохраняет смысл и даёт плавную русскую фразу.
theological_decisions:
- issue: Временной оборот τῇ μιᾷ τῶν σαββάτων в повествовании о воскресении
  choice: в первый день недели
  alternative: в первый из суббот
  rationale: Выбран общепринятый идиоматический смысл греческого оборота. Буквализм мог бы ошибочно внушить особую календарную или конфессиональную трактовку, которой сам текст не требует.
translation_notes:
  register: Современный литературный русский язык с ясным и достойным повествовательным стилем. «На самом рассвете» передаёт усиленное указание на раннее время без неестественного буквального выражения «глубоким рассветом».
