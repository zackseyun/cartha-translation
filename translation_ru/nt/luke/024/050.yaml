lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: вывел
  rationale: Глагол ἐξάγω обозначает движение наружу; «вывел» естественно и точно передаёт направительное значение приставки ἐξ-.
- source_word: δὲ
  choice: Затем
  rationale: Здесь δέ служит переходом к следующему событию повествования, а не выражает резкое противопоставление.
- source_word: ἕως πρὸς Βηθανίαν
  choice: к Вифании
  rationale: Сочетание ἕως πρός указывает на движение вплоть до Вифании или её окрестностей. В основном тексте выбрана естественная русская формулировка, а неоднозначность отражена в сноске.
- source_word: Βηθανίαν
  choice: Вифания
  rationale: Устоявшаяся русская форма географического названия; после предлога употреблён дательный падеж «Вифании».
- source_word: ἐπάρας
  choice: подняв
  rationale: Аористное причастие обозначает действие, предшествующее благословению; деепричастие «подняв» естественно передаёт эту последовательность.
- source_word: τὰς χεῖρας αὐτοῦ
  choice: руки
  rationale: Множественное число сохранено как существенная деталь жеста; принадлежность ясна из подлежащего деепричастного оборота.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Обычное и точное соответствие εὐλογέω в контексте произнесения благословения над учениками.
- source_word: αὐτούς
  choice: их
  rationale: Прямое местоименное дополнение, относящееся к ученикам.
theological_decisions:
- issue: Характер благословения учеников Иисусом
  choice: «благословил их» без поясняющего расширения
  alternative: «произнёс над ними благословение»
  rationale: Простая глагольная формулировка сохраняет действие исходного текста, не вводя позднейших литургических или священнических категорий и не сводя благословение к простому пожеланию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Он» написано с прописной буквы по принятой русской библейской традиции; синтаксис остаётся простым и понятным.
