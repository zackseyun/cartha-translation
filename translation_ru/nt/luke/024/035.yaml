base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: ru
  text: И они сами рассказывали о том, что произошло по дороге, и о том, как Он стал им известен[a] при преломлении хлеба[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как они узнали Его». В греческом употреблён пассивный глагол; он может указывать как на их узнавание, так и на то, что Он стал им известен.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «при преломлении хлеба». Греческое выражение может пониматься более обобщённо; в контексте оно относится к описанной выше трапезе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: они, в свою очередь
  rationale: 'Самостоятельное местоимение имеет контекстуальное ударение: теперь двое учеников со своей стороны сообщают пережитое. Такой оборот естественнее буквального «они сами» и не создаёт ложного противопоставления.'
- source_word: ἐξηγοῦντο
  choice: рассказывали
  rationale: Имперфект передаёт продолжавшийся рассказ; «рассказывали» естественно выражает изложение событий, не придавая глаголу оттенка формального толкования.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: о том, что произошло в пути
  rationale: Эллиптическая греческая фраза по-русски требует естественного восполнения подразумеваемого события. «В пути» соответствует рассказу о дороге в Эммаус.
- source_word: ὡς
  choice: как
  rationale: Вводит содержание сообщения, сохраняя оттенок того, каким образом Иисус стал им известен.
- source_word: ἐγνώσθη
  choice: Он открылся им
  rationale: Передаёт пассивную направленность события и сохраняет напряжение между узнаванием учениками и тем, что Иисус стал им явлен, не сводя фразу только к человеческому восприятию.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: при преломлении хлеба
  rationale: Естественный и достоинственный русский оборот, обозначающий обстоятельство, при котором произошло узнавание; контекст указывает на конкретную трапезу.
theological_decisions:
- issue: Передавать ли ἐγνώσθη как простое человеческое узнавание или сохранить пассивный богословский оттенок
  choice: Он открылся им
  alternative: они узнали Его
  rationale: Пассивная форма и ближайший контекст (Лк 24:31) допускают как узнавание учениками, так и то, что Иисус был им явлен. Основной текст сохраняет эту направленность, а примечание фиксирует прямую альтернативу.
- issue: Имеет ли «преломление хлеба» здесь специальное обрядовое значение
  choice: Не уточнять сверх текста; оставить выражение в контексте конкретной трапезы
  alternative: Передать как название установленного церковного обряда
  rationale: Стих описывает действие за трапезой, но сам по себе не требует конфессионально определённого истолкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Синтаксис естественный, при этом сохранены эмфаза αὐτοὶ и неоднозначность пассивного ἐγνώσθη. Все маркеры примечаний помещены непосредственно после соответствующих выражений.
