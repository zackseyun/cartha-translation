  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: ru
  text: 'Он сказал им: «Что это вы обсуждаете между собой на ходу?» И они остановились с печальным видом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: Он сказал им
  rationale: Нейтральное «сказал» сохраняет обычное значение λέγω; вопросительная форма реплики сама передаёт функцию вопроса. δέ естественно выражено продолжением повествования без отдельного союза.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: О чём это
  rationale: В данном контексте λόγοι обозначает предмет разговора, а не отдельные «слова»; современная русская вопросительная конструкция естественно передаёт смысл, не утяжеляя речь буквальным оборотом.
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: вы спорите между собой
  rationale: Редкий глагол ἀντιβάλλω указывает на взаимный обмен репликами, возможно с оттенком разногласия. «Спорите» кратко и естественно передаёт оживлённое обсуждение, однако не обязательно подразумевает враждебную ссору.
- source_word: περιπατοῦντες
  choice: по дороге
  rationale: Причастие описывает разговор во время ходьбы. В контексте путешествия русское «по дороге» звучит естественно и сохраняет одновременность действий.
- source_word: ἐστάθησαν
  choice: они остановились
  rationale: Форма ἵστημι здесь означает прекращение движения; «остановились» точнее для современного русского, чем буквальное «стали».
- source_word: σκυθρωποί
  choice: с печальными лицами
  rationale: Прилагательное описывает видимое мрачное, печальное выражение лица. Такой оборот ясно передаёт значение без добавления мотива или внутреннего состояния сверх текста.
