translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно в устной речи, а повествование сохраняет сдержанный и dignified библейский регистр. Подлинная лексическая широта ἀντιβάλλω передана словом «спорите», понимаемым здесь как обмен мнениями, а не обязательно конфликт.
