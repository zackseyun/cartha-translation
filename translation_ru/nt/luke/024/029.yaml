  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: ru
  text: 'Но они настойчиво просили Его[a]: «Останься с нами, потому что близится вечер и день уже на исходе[b]». И Он вошёл, чтобы остаться с ними.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настойчиво упрашивали Его»; традиционно: «принудили Его».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «день уже склонился»; то есть день подходит к концу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: стали настойчиво уговаривать Его
  rationale: Средняя форма передаёт настойчивое побуждение, но в данном контексте не обязательно физическое принуждение. Такой перевод сохраняет силу выражения и естественно звучит по-русски.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Останься с нами
  rationale: В контексте приглашения к гостеприимству μένω естественно передаётся глаголом «остаться», а μετά с родительным — сочетанием «с нами».
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: потому что уже близится вечер
  rationale: Оборот πρὸς ἑσπέραν указывает на приближение вечера, а не просто констатирует, что вечер уже наступил. «Уже» естественно согласует эту фразу с последующим ἤδη.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: день уже на исходе
  rationale: Современная русская идиома передаёт образ дня, который уже склонился к завершению, и результативный оттенок перфекта κέκλικεν.
- source_word: εἰσῆλθεν
  choice: Он вошёл
  rationale: Прямо передаёт действие входа в подразумеваемое жилище или место ночлега.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: чтобы остаться с ними
  rationale: Артикулярный инфинитив естественно понимать как выражение цели; повтор глагола «остаться» связывает действие Иисуса с просьбой учеников.
