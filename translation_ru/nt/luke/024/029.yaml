  source_fidelity: 'В целом смысл передан точно: настойчивая просьба остаться, приближение вечера, завершение дня и вход Иисуса, чтобы остаться с ними. Однако «стали настойчиво уговаривать» неоправданно добавляет начинательный оттенок («стали»), которого в аористе παρεβιάσαντο нет. Кроме того, «уже» при «близится вечер» не имеет отдельной опоры в греческом тексте; ἤδη относится к следующему высказыванию о дне.'
