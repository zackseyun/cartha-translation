lexical_decisions:
- source_word: καὶ
  choice: (не передано отдельным словом)
  rationale: Связь с предыдущим стихом естественно выражена последовательностью действий; начальное «и» в изолированном русском стихе звучало бы тяжелее, не добавляя смысла.
- source_word: λαβὼν
  choice: Взяв это
  rationale: Аористное причастие передаёт действие, предшествующее основному. Местоимение «это» восполняет подразумеваемый объект из предыдущего стиха — кусок рыбы.
- source_word: ἐνώπιον αὐτῶν
  choice: у них на глазах
  rationale: Естественное современное выражение, подчёркивающее, что действие происходило в их присутствии и было ими видимо.
- source_word: ἔφαγεν
  choice: Он съел всё
  rationale: Совершенный вид соответствует завершённому повествовательному действию. «Всё» указывает на ранее упомянутый кусок пищи, не меняя референта.
theological_decisions:
- issue: Следует ли явно назвать подразумеваемый объект при причастии и основном глаголе
  choice: Объект обозначен местоимениями «это» и «всё»
  alternative: «И, взяв, Он съел у них на глазах»
  rationale: В греческом объект опущен как ясный из предыдущего стиха. По-русски без него фраза неестественна; местоименное восполнение сохраняет контекстуальную связь, не превращая подразумеваемое слово в часть явного греческого текста.
translation_notes:
  register: Современный литературный русский язык; выражение «у них на глазах» естественно и сохраняет свидетельский, наглядный характер сцены. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
