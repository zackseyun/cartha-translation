  text: И, взяв его, Он съел его у них на глазах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «взяв, съел»; прямое дополнение подразумевается из предыдущего стиха — кусок рыбы.'
