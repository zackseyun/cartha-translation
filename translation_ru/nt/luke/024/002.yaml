  text: И обнаружили, что камень отвален от гробницы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: увидели
  rationale: Аорист действительного залога, 3-е лицо множественного числа; подразумеваемое подлежащее — женщины из предыдущего стиха. В этой конструкции εὑρίσκω передаёт обнаружение состояния предмета; по-русски естественно «увидели, что…».
- source_word: δὲ
  choice: И
  rationale: Здесь δέ служит мягкой повествовательной связкой без выраженного противопоставления.
- source_word: τὸν λίθον
  choice: камень
  rationale: В контексте погребения речь идёт о камне, закрывавшем вход в гробницу; определённость ясно задаётся контекстом и не требует отдельного выражения в русском.
- source_word: ἀποκεκυλισμένον
  choice: отвален
  rationale: Перфектное страдательное причастие обозначает достигнутое и сохраняющееся состояние камня. «Отвален» естественно передаёт как перемещение посредством откатывания, так и его результат.
- source_word: ἀπὸ τοῦ μνημείου
  choice: от гробницы
  rationale: μνημεῖον в евангельском рассказе о погребении означает гробницу, а ἀπό указывает, что камень был удалён от неё.
theological_decisions:
- issue: Подразумеваемое подлежащее в греческом тексте
  choice: Глагол «увидели» оставлен без местоимения
  alternative: «Они увидели»
  rationale: Русская форма множественного числа естественно отсылает к женщинам из предыдущего стиха; добавление «они» не требуется и могло бы создать ненужное смысловое ударение.
- issue: Передача состояния камня
  choice: «увидели, что камень отвален»
  alternative: «нашли камень отваленным»
  rationale: Оба варианта грамматически возможны, но выбранный вариант современнее и яснее выражает результативное состояние, не уточняя, кем камень был отвален.
translation_notes:
  register: Современный литературный русский язык; краткое, повествовательное и достоинственное изложение. Синтаксис естественен для широкого круга читателей, при этом сохранены пассивность и результативность греческого причастия.
