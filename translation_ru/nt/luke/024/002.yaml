  to: И обнаружили, что камень отвален от гробницы.
  rationale: 'Заменено «увидели» на «обнаружили», чтобы передать εὗρον без излишнего оттенка простого зрительного восприятия. Остальные элементы сохранены: мягкая повествовательная связка «И», подразумеваемый субъект из предыдущего стиха, камень, гробница и результативное страдательное состояние камня.'
