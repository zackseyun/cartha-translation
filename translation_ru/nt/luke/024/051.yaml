  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: ru
  text: И случилось, что, пока Он благословлял их, Он отдалился от них и возносился на небо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях слова «и возносился на небо» отсутствуют.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: И случилось, что
  rationale: Передаёт характерную для Луки повествовательную формулу современным литературным русским языком без архаичного оборота «и было».
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: пока Он благословлял их
  rationale: Конструкция с ἐν и субстантивированным инфинитивом выражает одновременное, продолжающееся действие; «пока» ясно сохраняет это временное отношение.
- source_word: εὐλογεῖν
  choice: благословлял
  rationale: Прямой и естественный эквивалент, не добавляющий не выраженных в греческом тексте подробностей.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: Он отдалился от них
  rationale: Передаёт пространственное отделение и удаление, не сводя выражение только к прощанию или обычному уходу.
- source_word: ἀνεφέρετο
  choice: стал возноситься
  rationale: Передаёт восходящее движение и незавершённый вид имперфекта. Возвратная русская форма естественна в данном контексте, хотя менее явно передаёт формальную пассивность греческого глагола.
- source_word: εἰς τὸν οὐρανόν
  choice: на небо
  rationale: В контексте вознесения οὐρανός означает небо как небесную сферу; русский узус требует сочетания «возноситься на небо».
theological_decisions:
- issue: Текстуальная неопределённость слов καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: Включить «и стал возноситься на небо» в основной текст с примечанием
  alternative: Опустить эти слова
  rationale: В SBLGNT фраза заключена в критические скобки, указывающие на сомнение в её исходности. Её включение при явном указании варианта сохраняет как представленное чтение, так и реальную текстологическую неопределённость.
- issue: Залог и аспект ἀνεφέρετο
  choice: стал возноситься
  alternative: был возносим
  rationale: Форма может формально восприниматься как пассивная, однако русское «был возносим» неестественно. Выбранный вариант сохраняет процессуальность имперфекта и не называет действующее лицо, но и не настаивает на явно выраженной пассивной семантике.
translation_notes:
  register: Современный литературный, ясный и достойный регистр. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской традицией; синтаксис остаётся доступным обычному читателю.
