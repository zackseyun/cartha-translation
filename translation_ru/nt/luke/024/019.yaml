lexical_decisions:
- source_word: Ποῖα
  choice: О чём?
  rationale: Краткий и естественный русский вопрос; множественное значение восстанавливается из контекста упомянутых событий.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: О том, что касается Иисуса
  rationale: Передаёт конструкцию с περί без добавления прямо не выраженного в греческом слова «произошло».
- source_word: Ναζαρηνοῦ
  choice: Назарянина
  rationale: Сохраняет греческое обозначение Иисуса как Назарянина; географический вариант дан в сноске.
- source_word: ἐγένετο ἀνὴρ προφήτης
  choice: был мужем-пророком
  rationale: Глагол γίνομαι здесь естественно передан как «был», а сочетание «муж-пророк» сохраняет оба существительных и их тесную аппозиционную связь, не создавая впечатления, будто Иисус лишь тогда стал человеком.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: сильным в деле и слове
  rationale: Точно и в достойном библейском регистре передаёт силу, проявлявшуюся как в поступках, так и в речи.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: пред Богом и всем народом
  rationale: Передаёт значение открытости перед Богом и народом; «пред» уместно в возвышенном, но понятном русском регистре.
theological_decisions:
- issue: Передача ἀνὴρ в описании Иисуса
  choice: мужем-пророком
  alternative: пророком
  rationale: Слово ἀνήρ явно присутствует в греческом тексте. Его сохранение отражает человеческую природу Иисуса и формулировку самих говорящих, не превращая этот стих в исчерпывающее христологическое определение.
- issue: Значение ἐγένετο при ἀνὴρ προφήτης
  choice: был
  alternative: стал
  rationale: Буквальное «стал мужем-пророком» по-русски может ошибочно подразумевать достижение зрелого возраста или начало человеческого существования именно в этот момент. «Был» здесь идиоматично передаёт греческий оборот; более буквальный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенными библейскими формами «муж-пророк» и «пред Богом». Диалог передан просто и естественно; структура описания Иисуса сохраняет необычность и неоднозначность греческой формулировки.
