id: LUK.24.27
reference: Luke 24:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: ru
  text: И, начав с Моисея и всех Пророков[a], он истолковал[b] им во всех Писаниях то, что касалось его самого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Моисей и все Пророки» — обозначение связанных с Моисеем книг и пророческого раздела Писания.
    reason: cultural_note
  - marker: b
    text: 'Или: «разъяснил», «объяснил». Греческий глагол может обозначать подробное истолкование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: начав
  rationale: Деепричастие естественно передаёт аористное причастие и сохраняет связь с основным действием.
- source_word: ἀπὸ Μωϋσέως
  choice: с Моисея
  rationale: Предлог ἀπό обозначает исходную точку истолкования; русское «начав с Моисея» звучит естественно и не исключает подразумеваемых книг Моисея.
- source_word: πάντων τῶν προφητῶν
  choice: всех Пророков
  rationale: Прописная буква указывает на раздел Писания, стоящий рядом с Моисеем, не сводя выражение лишь к отдельным пророческим личностям.
- source_word: διερμήνευσεν
  choice: истолковал
  rationale: Глагол означает объяснение или развёрнутое толкование; «истолковал» сохраняет экзегетический оттенок и остаётся понятным современному читателю.
- source_word: αὐτοῖς
  choice: им
  rationale: Естественная передача дательного косвенного дополнения без ненужного расширения.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: во всех Писаниях
  rationale: γραφή в данном контексте обозначает священные Писания, а «во всех» сохраняет широту формулировки, не утверждая, что речь идёт о каждом стихе без исключения.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: то, что касалось его самого
  rationale: Формулировка передаёт широкий круг относящихся к Иисусу мест, тем или свидетельств, не сужая их до одних прямых предсказаний; «самого» отражает возвратное ἑαυτοῦ.
theological_decisions:
- issue: Объём и характер христологического истолкования Писаний
  choice: Иисус истолковал в Писаниях то, что относилось к нему самому, без уточнения единственного вида таких мест
  alternative: Только прямые мессианские предсказания либо утверждение, что каждый отдельный отрывок непосредственно говорит об Иисусе
  rationale: Греческий текст утверждает широкое свидетельство Писаний об Иисусе, но не ограничивает его прямыми предсказаниями и не требует понимать каждое место Писания как непосредственное указание на него.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Прописные буквы в «Пророках» и «Писаниях» обозначают признанные части священного корпуса; местоимения, относящиеся к Иисусу, оставлены со строчной буквы как нейтральная современная издательская норма.
