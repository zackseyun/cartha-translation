    issue: «Предали Его»
    rationale: В современном употреблении это слово преимущественно означает измену; здесь греческое παραδίδωμι означает выдачу или передачу для судебного разбирательства и казни.
  - severity: low
    issue: «Наши начальники»
    rationale: «Начальники» может обозначать непосредственных служебных руководителей; «правители» точнее передаёт ἄρχοντες в контексте властей народа.
  - severity: low
    issue: Содержание сноски выходит за пределы текстовой альтернативы
    rationale: Утверждение о непосредственных исполнителях казни является историческим пояснением, а не вариантом перевода. Прямая форма основного текста уже отражает греческую атрибуцию действия; достаточно кратко отметить возможный причинительный перевод.
