  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: ru
  text: и как наши первосвященники и правители выдали Его на смертный приговор и распяли Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добились Его распятия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: и как
  rationale: ὅπως вводит продолжение рассказа о случившемся, а τε связывает эту фразу с предыдущей; «и как» естественно передаёт обе функции.
- source_word: παρέδωκαν
  choice: предали
  rationale: Здесь παραδίδωμι означает передачу Иисуса властям для судебного осуждения и казни. «Предали» сохраняет юридический и повествовательный смысл, не ограничивая его значением личного предательства.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение высшего священнического руководства иудеев; множественное число не подразумевает нескольких одновременно действующих первосвященников в узком смысле.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: наши начальники
  rationale: ἄρχοντες обозначает руководителей, наделённых властью. «Начальники» передаёт властно-общественный статус и сохраняет ἡμῶν — «наши».
- source_word: εἰς κρίμα θανάτου
  choice: на осуждение к смерти
  rationale: κρίμα в данном судебном контексте означает приговор или осуждение, ведущее к смерти. Формулировка сохраняет юридическую направленность εἰς и не сглаживает конструкцию до одного лишь «на смерть».
- source_word: ἐσταύρωσαν αὐτόν
  choice: распяли Его
  rationale: Активная форма прямо приписывает действие названным руководителям. Русское «распяли» сохраняет риторическую ответственность, не добавляя в основной текст исторического пояснения о непосредственных исполнителях.
theological_decisions:
- issue: Ответственность за распятие Иисуса
  choice: «распяли Его» — прямая активная формулировка
  alternative: «добились Его распятия» / «велели распять Его»
  rationale: Греческий текст употребляет активный глагол с первосвященниками и начальниками в качестве подлежащего. Прямая передача сохраняет приписанную им ответственность; альтернативы яснее обозначают посредничество римской власти, но добавляют не выраженную глаголом причинительную конструкцию.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой. Юридическая формула намеренно сохранена несколько весомой, без конфессионального уточнения.
