base_translation:
  language: en
  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: ru
  text: Но Пилат снова обратился к ним[a], желая отпустить Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова воззвал к ним».'
    reason: 'Лексическая альтернатива: προσφωνέω может подчёркивать громкое публичное обращение, а не просто факт речи.'
lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Наречие указывает на повторение действия; «снова» естественно и кратко передаёт это значение.
- source_word: δὲ
  choice: но
  rationale: Союз обозначает лёгкое противопоставление реакции Пилата требованию толпы; в данном контексте естественно русское «но».
- source_word: ὁ Πιλᾶτος
  choice: Пилат
  rationale: Традиционная русская форма имени; греческий артикль перед именем отдельно не передаётся.
- source_word: προσεφώνησεν
  choice: обратился к ним
  rationale: Глагол προσφωνέω означает обратиться к кому-либо или окликнуть; нейтральное «обратился к ним» сохраняет адресованность речи, подразумеваемую контекстом.
- source_word: θέλων
  choice: желая
  rationale: Причастие настоящего времени выражает одновременное с основным действием намерение Пилата; деепричастная конструкция близко сохраняет синтаксическую связь.
- source_word: ἀπολῦσαι
  choice: отпустить
  rationale: В контексте содержания под стражей глагол означает освободить или отпустить; «отпустить» звучит естественно и сохраняет юридико-ситуативный смысл.
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Традиционная русская форма имени в винительном падеже; артикль отдельно не передаётся.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Формулировка сохраняет причастную структуру и не усиливает желание Пилата до решимости или официального постановления.
