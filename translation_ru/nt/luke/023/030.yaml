  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: ru
  text: 'Тогда начнут говорить горам[a]: «Обрушьтесь на нас!» — и холмам[b]: «Покройте нас!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова перекликаются с пророческим описанием суда, особенно с Ос 10:8.
    reason: cross_reference
  - marker: b
    text: 'Или: «укройте нас», «спрячьте нас». Буквально: «покройте нас»; в данном контексте речь идёт об укрытии от грядущего суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт временную последовательность и связь с предшествующим контекстом.
- source_word: ἄρξονται λέγειν
  choice: начнут говорить
  rationale: Сохраняет начинательное значение конструкции с ἄρχομαι и инфинитивом.
- source_word: τοῖς ὄρεσιν
  choice: горам
  rationale: Передаёт ὄρος и сохраняет отличие от следующих βουνοῖς.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Обрушьтесь на нас
  rationale: В контексте обращения к горам естественно передаёт повеление упасть сверху на людей; буквальное «упадите на нас» по-русски менее естественно.
- source_word: τοῖς βουνοῖς
  choice: холмам
  rationale: Передаёт βουνός и сохраняет лексическое различие между горами и холмами.
- source_word: Καλύψατε ἡμᾶς
  choice: Скройте нас
  rationale: Глагол καλύπτω буквально означает «покрыть», но здесь обозначает укрытие от грядущего суда; «скройте» естественно в современном русском и сохраняет образ.
theological_decisions:
- issue: Пророческий язык суда и межтекстовая связь
  choice: Сохранён конкретный призыв к горам и холмам без поясняющего добавления о суде в основном тексте.
  alternative: 'Передать просьбу развёрнуто: «скройте нас от грядущего суда».'
  rationale: Стих перекликается с Ос 10:8; буквальный образ сохраняет пророческую напряжённость и не вносит толкование непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык; речь краткая, торжественная и эмоционально напряжённая. «Обрушьтесь» выбрано как естественное обращение к горам, а «скройте» — как контекстуально точная передача καλύπτω.
