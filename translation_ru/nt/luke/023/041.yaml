source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: ru
  text: Мы-то справедливо получаем по заслугам за то, что сделали; а этот человек не сделал ничего дурного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαίως
  choice: справедливо
  rationale: Наречие передаёт признание того, что наказание заслуженно, и сохраняет судебный оттенок.
- source_word: ἄξια γὰρ ὧν ἐπράξαμεν
  choice: потому что получаем по заслугам за то, что сделали
  rationale: Естественно передаёт соразмерность нынешнего воздаяния совершённым поступкам, не устраняя причинную связь, выраженную γάρ.
- source_word: ἀπολαμβάνομεν
  choice: получаем
  rationale: Настоящее время указывает на происходящее сейчас воздаяние; русский несовершенный вид сохраняет эту актуальность.
- source_word: οὗτος
  choice: Он
  rationale: В русском контексте личное местоимение звучит естественнее буквального «этот», а прописная буква ясно указывает на Иисуса согласно принятой издательской норме.
- source_word: οὐδὲν ἄτοπον
  choice: ничего дурного
  rationale: Передаёт широкое значение чего-либо неправильного или предосудительного, не сужая высказывание до строго юридического преступления.
- source_word: ἔπραξεν
  choice: не сделал
  rationale: Аорист естественно передаётся совершенным видом и охватывает поступки Иисуса, о которых говорит распятый рядом человек.
theological_decisions:
- issue: Свидетельство распятого преступника о невиновности Иисуса
  choice: а Он не сделал ничего дурного
  alternative: а этот человек не совершил ничего предосудительного
  rationale: Перевод прямо сохраняет свидетельство о невиновности Иисуса в данном судебном контексте, не расширяя его до не выраженного здесь доктринального утверждения.
translation_notes:
  register: Современный литературный русский язык; речь краткая, достойная и естественная. Добавлен подразумеваемый сказуемый «осуждены», чтобы первая часть не была грамматически обрывочной по-русски; контекст распятия однозначно задаёт смысл. «По заслугам» сохраняет идею соразмерного воздаяния.
