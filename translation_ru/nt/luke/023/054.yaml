  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: ru
  text: Был день Приготовления, и начиналась суббота[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «суббота рассветала». Греческий глагол может обозначать рассвет или наступление; здесь речь идёт о наступлении субботы вечером.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: день Приготовления
  rationale: В иудейско-греческом употреблении παρασκευή обозначает день приготовления к субботе. Прописная буква передаёт устойчивое календарное название, не заменяя его более толковательным «пятница».
- source_word: σάββατον
  choice: суббота
  rationale: По контексту имеется в виду определённая еженедельная суббота; в русском языке это ясно без артикля.
- source_word: ἐπέφωσκεν
  choice: уже начиналась
  rationale: Глагол буквально связан с наступлением рассвета, но здесь обозначает наступление субботы вечером. «Начиналась» ясно передаёт временной смысл, а «уже» естественно выражает процесс, который был на подходе или уже наступал.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Был день Приготовления
  rationale: Формулировка близка к греческой конструкции и звучит естественно и достойно по-русски.
- source_word: καὶ
  choice: и
  rationale: Союз между частями сохранён как простая повествовательная связь; начальное καί не воспроизведено, поскольку изолированное русское «И» здесь тяжеловесно и не требуется для связи в современном повествовании.
theological_decisions:
- issue: Значение ἐπέφωσκεν при наступлении субботы
  choice: Суббота начиналась вечером
  alternative: «суббота рассветала / наступал рассвет субботы»
  rationale: По иудейскому счёту суток суббота наступала вечером, что согласуется с контекстом погребения до субботнего покоя. Перевод не создаёт ошибочного впечатления, будто речь идёт об утре, но буквальный образ отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Название «день Приготовления» сохранено как историко-календарный термин; фраза не заменена на «пятница». Маркер сноски поставлен непосредственно после утверждения, которое она поясняет.
