base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: ru
  text: Но и Ирод вместе со своими воинами обошёлся с Ним презрительно и насмеялся над Ним. Облачив Его в блистательную одежду[a], он отослал Его обратно к Пилату.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в яркую одежду»; слово λαμπράν может означать также «яркую». Такая одежда, вероятно, была частью насмешки Ирода, создавая видимость почёта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: выказал Ему презрение
  rationale: Передаёт не только внутреннее пренебрежение, но и открытое унизительное обращение; деепричастная цепочка греческого текста преобразована в естественную русскую глагольную конструкцию.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: вместе со своими воинами
  rationale: В данном повествовательном контексте στράτευμα обозначает людей Ирода как воинов; «воинами» звучит естественно и достойно.
- source_word: ἐμπαίξας
  choice: насмеялся над Ним
  rationale: Точно передаёт издевательскую насмешку; форма единственного числа сохраняет Ирода как грамматический субъект при участии воинов.
- source_word: περιβαλὼν
  choice: одев Его в
  rationale: Естественно передаёт действие облачения человека в одежду.
- source_word: ἐσθῆτα λαμπρὰν
  choice: блистательную одежду
  rationale: «Одежда» не уточняет фасон сверх греческого текста, а «блистательная» сохраняет диапазон λαμπρός — яркая, великолепная, нарядная — и иронию показной почести.
- source_word: ἀνέπεμψεν
  choice: отослал Его обратно
  rationale: Передаёт направление к прежней судебной власти; «обратно» проясняет контекстуальный смысл приставочного глагола.
- source_word: τῷ Πιλάτῳ
  choice: к Пилату
  rationale: После глагола «отослал» русский дательный направления естественно передаётся конструкцией «к Пилату».
- source_word: δὲ καὶ ὁ Ἡρῴδης
  choice: Но и Ирод
  rationale: 'Сохраняет соединительно-контрастный переход δέ и включающее καί: Ирод также принял участие в унижении Иисуса.'
theological_decisions:
- issue: Характер насмешки посредством одежды
  choice: Сохранить образ блистательной одежды и иронию мнимой почести, не называя её прямо царской мантией.
  alternative: Уточнить как «царскую» или «роскошную мантию».
  rationale: Контекст ясно указывает на насмешку, однако греческое ἐσθῆτα λαμπράν не определяет одежду как царскую мантию и допускает значения яркой, великолепной или нарядной одежды.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по устойчивой русской библейской традиции. Синтаксис сделан естественным для русского языка без устранения иронии и неопределённости греческого обозначения одежды.
