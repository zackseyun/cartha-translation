  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: ru
  text: И в тот самый день Ирод и Пилат стали друзьями[a], потому что прежде враждовали друг с другом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали дружелюбны друг к другу».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «прежде находились во вражде друг с другом».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐγένοντο
  choice: стали
  rationale: Аорист γίνομαι обозначает изменение отношений; «стали» естественно передаёт переход в новое состояние.
- source_word: φίλοι
  choice: друзьями
  rationale: Предикативное существительное прямо называет возникшие отношения, не уточняя, были ли это личная дружба или политический союз.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Ирод и Пилат
  rationale: Парная конструкция объединяет обоих участников; по-русски это естественно выражается простым соединением имён союзом «и».
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: в тот самый день
  rationale: «Самый» сохраняет эмфатическое указание на конкретный день.
- source_word: μετ’ ἀλλήλων
  choice: друг с другом
  rationale: Обычное современное русское выражение взаимности.
- source_word: προϋπῆρχον
  choice: прежде
  rationale: В сочетании со сказуемым «враждовали» передаёт предшествующее и продолжавшееся состояние без тяжеловесной конструкции.
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: враждовали друг с другом
  rationale: Естественно передаёт взаимную вражду; несовершенный вид отражает длительное прежнее состояние.
theological_decisions:
- issue: Характер изменения отношений между Иродом и Пилатом
  choice: стали друзьями
  alternative: стали дружелюбны друг к другу; примирились
  rationale: Греческое φίλοι прямо допускает «друзьями», однако стих не определяет глубину отношений и не требует понимать их как искреннюю личную дружбу или как формальный политический союз.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сглажен для естественного чтения; смысл взаимности, прежней длительной вражды и подчёркнутое указание на тот же день сохранены.
