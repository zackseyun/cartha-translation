  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: ru
  text: Когда Ирод увидел Иисуса, он очень обрадовался, ибо уже давно хотел увидеть Его, потому что много слышал о Нём, и надеялся увидеть, как Он совершит какое-нибудь знамение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какое-нибудь чудо, которое Он совершит». Греческое слово означает «знамение» и может обозначать чудесное действие, воспринимаемое как значимый знак.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης
  choice: Когда Ирод
  rationale: δέ обозначает продолжение повествования и не требует отдельного русского соответствия; вместе с аористным причастием ἰδών естественно передаётся придаточным времени.
- source_word: ἐχάρη λίαν
  choice: он очень обрадовался
  rationale: Современное и естественное соответствие сочетанию χαίρω с усилителем λίαν, сохраняющее высокую степень радости.
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  choice: уже давно хотел Его увидеть
  rationale: Описательная конструкция ἦν + причастие выражает длительное желание, а идиома ἐξ ἱκανῶν χρόνων — значительный промежуток времени без уточнения числа лет.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: он много слышал о Нём
  rationale: διά с артиклевым инфинитивом выражает причину; настоящее ἀκούειν допускает повторяющееся или продолжавшееся получение известий. «Много слышал» естественно передаёт это по-русски.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: надеялся увидеть какое-нибудь знамение
  rationale: «Знамение» сохраняет смысл σημεῖον как значимого удостоверяющего действия и не сужает его до общего слова «чудо».
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: совершённое Им
  rationale: Форма передаёт действие знамения и явно сохраняет личную агентность, выраженную ὑπό; по-русски это естественнее буквального «происходящее от Него».
theological_decisions:
- issue: Значение σημεῖον
  choice: знамение
  alternative: чудо
  rationale: «Знамение» сохраняет богословски и повествовательно значимый исходный термин, хотя в данном контексте Ирод, вероятно, ожидает чудесного действия.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный повествовательный стиль. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
