  text: And Pilate decided that their demand should be granted[a].
translation:
  language: ru
  text: И Пилат постановил, чтобы их требование было исполнено.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «Пилат вынес решение, что их просьба должна быть исполнена».'
    reason: 'Лексическая альтернатива: «вынес решение» яснее раскрывает судебный оттенок ἐπέκρινεν, а «просьба» передаёт другое допустимое значение αἴτημα.'
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный повествовательный союз, связывающий решение Пилата с предшествующей сценой без добавления временного или причинного оттенка.
- source_word: Πιλᾶτος
  choice: Пилат
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: ἐπέκρινεν
  choice: постановил
  rationale: Глагол обозначает вынесение решения, в данном контексте — официального судебного постановления. «Постановил» сохраняет юридический оттенок и при этом естественно звучит по-русски.
- source_word: γενέσθαι
  choice: исполнить
  rationale: В сочетании с ἐπέκρινεν инфинитив выражает осуществление того, о чём просили. Русское «исполнить требование» естественно передаёт эту конструкцию, не уточняя способ исполнения.
- source_word: τὸ αἴτημα
  choice: требование
  rationale: Слово может означать просьбу, прошение или требование. Контекст настойчивого давления толпы оправдывает «требование», не выходя за пределы значения греческого слова.
- source_word: αὐτῶν
  choice: их
  rationale: Притяжательное местоимение относится к тем, кто добивался от Пилата этого решения.
theological_decisions:
- issue: Юридический характер решения Пилата
  choice: Пилат постановил исполнить их требование
  alternative: Пилат вынес решение, чтобы их просьба была исполнена
  rationale: Выбранный вариант сохраняет официальный характер действия Пилата, но не сужает его до формального вынесения уголовного приговора и не добавляет богословских выводов.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной повествовательной формулировкой. «Постановил» передаёт судебный оттенок, а «исполнить их требование» остаётся понятным широкому кругу читателей.
