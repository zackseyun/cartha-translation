  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: ru
  text: 'Но Иисус, повернувшись к ним, сказал: «Дочери Иерусалима[a], не плачьте обо Мне; а плачьте о себе и о своих детях».


    [a] Или: «Женщины Иерусалима». Буквально: «Дочери Иерусалима» — образное обращение, характерное для пророческой речи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Женщины Иерусалима». Буквально: «Дочери Иерусалима» — образное обращение, характерное для пророческой речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Но Иисус, повернувшись к ним
  rationale: Аористное причастие передаёт физический поворот Иисуса к женщинам; деепричастная конструкция естественна по-русски. δέ обозначено мягким противительным переходом «но».
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Дочери Иерусалима
  rationale: Буквально и с сохранением пророческой, библейской формы обращения; более общее «женщины Иерусалима» ослабило бы её образность и межтекстовый оттенок.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: не плачьте обо Мне
  rationale: Настоящее повелительное наклонение с μή передано без неоправданного уточнения «перестаньте»; сочетание «плакать о ком-либо» естественно выражает объект скорби.
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: плачьте лучше о себе
  rationale: 'πλήν вводит корректирующее противопоставление: плакать следует не об Иисусе, а о себе. «Лучше» естественно передаёт эту силу в современном русском языке.'
- source_word: τὰ τέκνα ὑμῶν
  choice: своих детях
  rationale: τέκνα означает детей в семейном смысле; возвратное «своих» естественно соотносит детей с адресатами и не меняет смысла греческого ὑμῶν.
theological_decisions:
- issue: Передача обращения Θυγατέρες Ἰερουσαλήμ
  choice: Дочери Иерусалима
  alternative: Женщины Иерусалима
  rationale: Сохранена буквальная родственная и коллективная метафора, характерная для пророческой речи Писания, без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прописная буква в местоимении «Мне» следует принятой русской традиции уважительного обозначения Иисуса; синтаксис остаётся ясным и доступным.
