  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: ru
  text: 'Но он в третий раз сказал им: «Какое же зло сделал этот человек?[a] Я не нашёл в нём никакой вины, заслуживающей смерти.[b] Поэтому, наказав его,[c] отпущу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Да за что? Какое зло сделал этот человек?» Начальное τί можно понимать как краткий протест, предваряющий полный вопрос.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ничего, за что следовало бы предать его смерти»; «никаких оснований для смертного приговора».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «подвергнув его наказанию»; возможно, конкретнее: «подвергнув его бичеванию». Греческое слово обозначает дисциплинарное или карательное воздействие, но само по себе не уточняет его вид.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: в третий раз
  rationale: Наречное винительное указывает на повторение действия; этот оборот естественен в современном русском языке и сохраняет повествовательный акцент.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Какое же зло сделал этот человек?
  rationale: «Какое же» естественно передаёт вопросительное τί и возражающий оттенок γάρ; «зло» сохраняет нравственную силу κακόν, а «этот человек» передаёт указательное οὗτος.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: никакой вины, заслуживающей смерти
  rationale: В судебном контексте αἴτιον обозначает вину или основание для приговора. Формулировка ясно передаёт отсутствие основания для смертной казни, не превращая «смерть» прямо в «казнь» в основном тексте.
- source_word: εὗρον ἐν αὐτῷ
  choice: Я не нашёл в нём
  rationale: Оборот сохраняет образ греческого ἐν αὐτῷ и по-русски естественно выражает актуальный вывод Пилата.
- source_word: παιδεύσας
  choice: наказав его
  rationale: В данном контексте παιδεύω означает подвергнуть дисциплинарному наказанию. «Наказав» передаёт карательный смысл, но не уточняет его форму сверх сказанного в греческом тексте.
- source_word: ἀπολύσω
  choice: отпущу
  rationale: В судебном контексте глагол означает освободить или отпустить; краткое «отпущу» естественно продолжает речь Пилата.
theological_decisions:
- issue: Характер предложенного Пилатом наказания (παιδεύσας)
  choice: Передать обобщённо как «наказав», не уточняя вид наказания.
  alternative: «подвергнув бичеванию» или «высекши»
  rationale: Пилат объявляет, что Иисус не заслуживает смерти, но предлагает подвергнуть Его меньшему наказанию. Сам глагол допускает карательный смысл, однако безусловно не называет конкретную процедуру, поэтому возможное бичевание отмечено лишь в сноске.
- issue: Судебный смысл οὐδὲν αἴτιον θανάτου
  choice: «никакой вины, заслуживающей смерти»
  alternative: «никаких оснований для смертного приговора»
  rationale: Выбранный вариант сохраняет судебный смысл и одновременно не устраняет напряжение между признанием отсутствия смертной вины и намерением всё же наказать Иисуса.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной сцены. Синтаксис краткий и ясный; «наказав» звучит естественнее буквального «дисциплинировав» и не вносит неуказанную в тексте форму телесного наказания.
