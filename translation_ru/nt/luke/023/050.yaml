  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: ru
  text: И вот, человек по имени Иосиф, член совета, человек добрый и праведный —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет повествовательный переход и привлекающую внимание частицу ἰδού, оставаясь естественным для современного литературного русского языка.
- source_word: ἀνὴρ
  choice: человек
  rationale: В данном контексте речь идёт о взрослом мужчине, однако русское «человек по имени Иосиф» естественно и точно вводит действующее лицо; пол однозначно выражен именем и последующим контекстом.
- source_word: ὀνόματι Ἰωσὴφ
  choice: по имени Иосиф
  rationale: Естественная русская передача дательного оборота ὀνόματι с сохранением формулы представления лица.
- source_word: βουλευτὴς ὑπάρχων
  choice: член совета
  rationale: Передаёт принадлежность Иосифа к совету без добавления в основной текст уточнения, которое в данном стихе не выражено прямо; причастная конструкция естественно оформлена приложением.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: человек добрый и праведный
  rationale: Повтор ἀνήρ сохранён как авторское повторное обозначение Иосифа; ἀγαθός передано как «добрый», а δίκαιος — как «праведный», что сохраняет нравственно-религиозный оттенок.
theological_decisions:
- issue: Передача δίκαιος в характеристике Иосифа
  choice: праведный
  alternative: справедливый
  rationale: δίκαιος допускает этический и судебно-правовой оттенки. Здесь это общая положительная характеристика Иосифа, поэтому «праведный» лучше сохраняет библейскую нравственно-религиозную глубину, не превращая слово в технический догматический термин.
translation_notes:
  register: Современный литературный, умеренно возвышенный повествовательный стиль. Сохранены вводное «И вот», повтор слова ἀνήρ и незавершённость синтаксиса стиха посредством тире, поскольку предложение продолжается в следующем стихе.
