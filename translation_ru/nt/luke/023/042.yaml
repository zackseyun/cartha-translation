  source_fidelity: 'Основной текст точно передаёт SBLGNT: «И сказал» естественно воспроизводит повествовательный имперфект ἔλεγεν, обращение «Иисус» соответствует Ἰησοῦ, а «вспомни обо мне» — μνήσθητί μου. Оборот «когда придёшь в Своём Царстве» сохраняет ἐν τῇ βασιλείᾳ σου и не подменяет его направительным «в Царство».'
