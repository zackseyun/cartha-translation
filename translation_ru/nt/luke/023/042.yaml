  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: ru
  text: 'И сказал: «Иисус, вспомни обо мне, когда придёшь в Своём Царстве».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «когда войдёшь в Своё Царство». В ряде рукописей направление выражено более явно («в Царство»), тогда как текст SBLGNT буквально говорит «в Твоём Царстве».'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἔλεγεν
  choice: И сказал
  rationale: Простая повествовательная связка и естественная по-русски передача имперфекта речи; длительность здесь не требуется выражать явно.
- source_word: Ἰησοῦ
  choice: Иисус
  rationale: Форма прямого обращения; в современном русском имя при обращении формально не изменяется.
- source_word: μνήσθητί μου
  choice: вспомни обо мне
  rationale: Естественно передаёт просьбу помнить говорящего; возможный оттенок благосклонного действия не разворачивается в толкование.
- source_word: ὅταν ἔλθῃς
  choice: когда придёшь
  rationale: Передаёт будущее событие, выраженное ὅταν с сослагательным наклонением, без уточнения его сроков.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: в Своём Царстве
  rationale: Непосредственно сохраняет предлог ἐν («в») и смысл царства/царского владычества; прописная буква соответствует достоинству речи о Божьем Царстве, не сужая значения βασιλεία.
theological_decisions:
- issue: Эсхатологический смысл просьбы
  choice: Просьба относится к будущему пришествию Иисуса в Его Царстве.
  alternative: «Когда войдёшь в Своё Царство» или «когда придёшь со Своим Царством».
  rationale: Греческий текст утверждает связь будущего пришествия Иисуса с Его Царством, но не определяет здесь ни хронологию, ни точную пространственную или инструментальную связь.
- issue: Значение ἐν при глаголе движения
  choice: «в Своём Царстве»
  alternative: «в Своё Царство»
  rationale: 'Основной текст SBLGNT содержит ἐν, поэтому сохранена подлинная неоднозначность: Иисус может мыслиться приходящим в царском достоинстве/владычестве, тогда как направительное прочтение также возможно и отражено в примечании.'
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная прямая речь. Местоимение «Своём» употреблено как естественное возвратное притяжательное при совпадении обладателя с подлежащим.
