id: LUK.23.53
reference: Luke 23:53
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: ru
  text: Сняв Его, он обернул Его льняным полотном и положил в высеченной в скале гробнице[a], где ещё никто не был положен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в высеченной гробнице»; или: «в гробнице, вырубленной в камне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «где ещё никто никогда не лежал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: сняв Его
  rationale: Аористное причастие καθαιρέω обозначает снятие тела Иисуса с креста перед последующими действиями; деепричастие естественно передаёт последовательность без лишнего уточнения.
- source_word: ἐνετύλιξεν
  choice: обернул
  rationale: Глагол означает завернуть или обернуть в ткань; «обернул» ясно и естественно в погребальном контексте.
- source_word: σινδόνι
  choice: льняным полотном
  rationale: Дательный падеж передаёт средство действия; σινδών — льняное полотно, в данном контексте погребальное, однако слово «саван» было бы несколько более интерпретирующим.
- source_word: ἔθηκεν
  choice: положил
  rationale: τίθημι здесь означает поместить тело в гробницу; «положил» естественно, точно и стилистически достойно.
- source_word: μνήματι
  choice: в гробнице
  rationale: μνῆμα обозначает место погребения; «гробница» хорошо соответствует и историческому контексту, и описанию высеченного помещения.
- source_word: λαξευτῷ
  choice: высеченной в скале
  rationale: λαξευτός означает высеченный или вырубленный; формулировка ясно передаёт тип гробницы и звучит естественно по-русски.
- source_word: οὗ
  choice: где
  rationale: Относительное наречие относится к гробнице; «где» — наиболее естественный русский эквивалент.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: где ещё никто не был положен
  rationale: Конструкция подчёркивает, что до этого в гробнице никого не полагали; пассивная формулировка естественна в русском погребальном контексте и сохраняет оттенок οὔπω «ещё не».
theological_decisions:
- issue: Описание погребения и типа гробницы
  choice: Иосиф положил Иисуса в высеченной в скале гробнице, прежде никем не использованной.
  alternative: Иосиф положил Иисуса в высеченной гробнице, где никто никогда не лежал.
  rationale: Текст носит описательный характер. Перевод сохраняет исторические детали погребения, не добавляя сведений из параллельных повествований и не усиливая их богословской интерпретацией.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской традицией, без добавления имени, отсутствующего в стихе.
