  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: ru
  text: 'Но другой, укоряя его, сказал: «Неужели и ты не боишься Бога, ведь ты под тем же приговором?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Но другой в ответ
  rationale: Оборот естественно вводит противопоставленную реакцию второго преступника; «в ответ» передаёт значение причастия без тяжеловесного «отвечая».
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: стал укорять его
  rationale: ἐπιτιμάω обозначает порицание или упрёк; конструкция передаёт сопровождающее речь действие и звучит естественно в современном русском повествовании.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Неужели и ты не боишься Бога
  rationale: «Бояться Бога» сохраняет прямую силу библейского выражения, а «и ты» передаёт усиление οὐδέ и явно выраженного σὺ.
- source_word: ὅτι
  choice: ведь
  rationale: Частица вводит основание упрёка; «ведь» естественно выражает причинно-пояснительную связь в прямой речи.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: ты под тем же приговором
  rationale: В контексте казни κρίμα указывает на судебный приговор и его карательный результат; русское «под приговором» ясно сохраняет юридический образ.
theological_decisions:
- issue: Значение страха перед Богом
  choice: боишься Бога
  alternative: чтишь Бога; благоговеешь перед Богом
  rationale: Прямое выражение сохраняет нравственно-религиозную весомость φοβέομαι, не сводя его ни к простому испугу, ни к более узкому толкованию как почтения.
- issue: Значение κρίμα в общей участи распятых
  choice: под тем же приговором
  alternative: под тем же осуждением; на том же суде
  rationale: Контекст поддерживает значение вынесенного судебного решения с общей карательной участью; формулировка не утверждает, что нравственная вина всех распятых одинакова.
translation_notes:
  register: Современный литературный русский язык; речь краткая, напряжённая и достойная. Сохранён риторический упрёк и юридический оттенок κρίμα без конфессионально обусловленных пояснений.
