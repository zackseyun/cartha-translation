  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: ru
  text: 'Увидев происшедшее, сотник прославил Бога и сказал: «Воистину, этот человек был праведен[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невиновен»; возможно также: «справедлив». Греческое слово может обозначать как нравственную праведность, так и юридическую невиновность в данном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: увидев
  rationale: Аористное причастие естественно передаёт предшествующее обстоятельство и сохраняет связь с главным действием.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабая повествовательная связка; в русском отдельное «же» здесь звучало бы тяжеловесно и могло бы создать лишний оттенок противопоставления.
- source_word: ὁ ἑκατοντάρχης
  choice: сотник
  rationale: Традиционное, точное и понятное русское обозначение римского офицера, командовавшего примерно сотней воинов.
- source_word: τὸ γενόμενον
  choice: происшедшее
  rationale: Субстантивированное причастие обозначает увиденное событие; форма лаконична и естественна для литературного русского языка.
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: прославил Бога
  rationale: Простое прошедшее время естественно передаёт действие в повествовании; искусственное «начал прославлять» добавило бы не выраженную однозначно начинательность.
- source_word: λέγων
  choice: и сказал
  rationale: Сочинительная конструкция естественнее русского буквального «говоря» и ясно вводит содержание речи.
- source_word: Ὄντως
  choice: Воистину
  rationale: Передаёт сильное заверение и сохраняет торжественный, но понятный регистр высказывания.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: этот человек
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: δίκαιος
  choice: праведен
  rationale: Сохраняет основной нравственно-богословский смысл слова, не исключая юридического оттенка невиновности, указанного в сноске.
- source_word: ἦν
  choice: был
  rationale: Прямое соответствие форме прошедшего времени глагола εἰμί.
theological_decisions:
- issue: Значение δίκαιος в словах сотника
  choice: праведен
  alternative: невиновен; справедлив
  rationale: «Праведен» сохраняет нравственный и богословский вес греческого слова. В контексте суда и казни возможно также юридическое значение «невиновен»; сноска сохраняет эту значимую неоднозначность, не разрешая её догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Сотник» и «воистину» сохраняют достоинство повествования, оставаясь понятными широкому читателю.
