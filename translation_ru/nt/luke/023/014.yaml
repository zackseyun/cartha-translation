  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: ru
  text: 'Он сказал им: «Вы привели ко мне этого человека как того, кто вводит народ в заблуждение; и вот, допросив его при вас, я не нашёл в этом человеке никаких оснований для обвинений, которые вы против него выдвигаете.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я не нашёл за этим человеком никакой вины в том, в чём вы его обвиняете».'
    reason: Допустимая более краткая передача судебного αἴτιον как «вина» и греческой относительной конструкции.
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Вы привели ко мне
  rationale: Передаёт завершённое действие аориста, прямое обращение и судебный контекст естественным современным русским языком.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: этого человека
  rationale: Точно обозначает конкретного мужчину, не внося пренебрежительного оттенка, возможного у слова «мужчина» в такой конструкции.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: обвиняя его в том, что он совращает народ
  rationale: ὡς вводит основание, на котором обвинители привели Иисуса; ἀποστρέφω допускает значения «отвращать, сбивать с пути». «Совращает» сохраняет обвинительный смысл, не усиливая его до прямого призыва к мятежу.
- source_word: ἰδοὺ
  choice: Но вот
  rationale: Естественный русский указательный маркер, привлекающий внимание к результату расследования; «но» уместно выражает контраст с предъявленным обвинением.
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: я допросил его при вас
  rationale: ἀνακρίνω в судебном контексте означает расследовать или допрашивать; «допросил» сохраняет юридическую окраску, а «при вас» — открытый характер разбирательства.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: не нашёл за ним никакой вины
  rationale: αἴτιον в судебной речи может обозначать вину или основание для обвинения. Русская формула «не нашёл за ним никакой вины» ясно передаёт юридическое заключение и сохраняет привязку к этому человеку.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: в том, в чём вы его обвиняете
  rationale: Сохраняет относительную конструкцию греческого текста и юридический смысл κατηγορέω без ненужной номинализации.
theological_decisions:
- issue: Характер заявления Пилата
  choice: Передать его как судебное заключение об отсутствии вины по предъявленным обвинениям.
  alternative: «Не нашёл никаких оснований для ваших обвинений против него».
  rationale: Юридическая лексика стиха указывает на итог допроса, а не на отвлечённое утверждение о полной нравственной безгрешности. Связь «в том, в чём вы его обвиняете» удерживает вердикт в непосредственном судебном контексте.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным и судебным регистром. Синтаксис слегка упрощён ради ясности, но ход греческой мысли сохранён. Маркер сноски поставлен после относящегося к ней судебного заключения.
