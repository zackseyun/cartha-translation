    issue: «Совращает народ»
    rationale: Хотя значение «сбивать с пути» исторически возможно, в современном русском «совращать» преимущественно относится к сексуальному или нравственному развращению; это создаёт неуместный смысловой оттенок.
  - severity: low
    issue: «Но вот»
    rationale: ἰδού — указательный маркер; противительный союз «но» в источнике не выражен и не нужен для естественного русского контраста.
  - severity: low
    issue: «Не нашёл за ним никакой вины»
    rationale: Это допустимая интерпретация αἴτιον, но основное чтение лучше прямо отразит судебное «основание/причину обвинения» и связь с последующей относительной конструкцией.
