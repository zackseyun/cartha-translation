  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: ru
  text: Он не был согласен с их решением и поступком[a] — был родом из Аримафеи, города иудеев, и ожидал Царства Божьего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не дал согласия на их решение и дело».'
    reason: Лексическая альтернатива для συγκατατεθειμένος, βουλή и πρᾶξις.
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: не согласился
  rationale: Перифрастическая конструкция с ἦν указывает на ранее занятую и сохранявшую значение позицию несогласия. Русское «не согласился» естественно передаёт отказ присоединиться к решению, не предполагая конкретной процедуры голосования.
- source_word: βουλῇ
  choice: решением
  rationale: В данном контексте слово обозначает итог совета или принятое намерение, а не сам руководящий орган. «Решение» ясно отделяет замысел от последующего поступка.
- source_word: πράξει
  choice: поступком
  rationale: Слово обозначает совершённое действие и поставлено в пару с βουλή. Единственное число «поступком» сохраняет грамматическую форму и различие между решением и его осуществлением.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: из Аримафеи, иудейского города
  rationale: Передана аппозиционная структура оригинала. «Иудейского» сохраняет возможную связь как с иудеями, так и с Иудеей, не перегружая основной текст буквальной, но менее естественной формой «города иудеев».
- source_word: προσεδέχετο
  choice: ожидал
  rationale: Имперфект выражает продолжительное, исполненное надежды ожидание. «Ожидал» естественно по-русски и не превращает это состояние в активные поиски.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Устоявшееся и понятное русское выражение сохраняет богословскую значимость и связь с лексикой Евангелия от Луки.
- source_word: οὗτος
  choice: Он
  rationale: В русском контексте указательное местоимение, возобновляющее упоминание Иосифа из предыдущего стиха, естественнее передать личным местоимением; «этот человек» здесь звучало бы избыточно.
theological_decisions:
- issue: Характер непричастности Иосифа к роли синедриона в смерти Иисуса
  choice: Сообщить, что Иосиф не согласился с их решением и поступком, не уточняя форму принятия решения.
  alternative: «Не голосовал за их решение» или «не одобрил их замысел и дело».
  rationale: Греческий текст утверждает его несогласие с βουλή и πρᾶξις, но не описывает процедуру голосования. Перевод ясно показывает его непричастность, не добавляя исторической реконструкции.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным синтаксисом. Длинная греческая конструкция разделена на два предложения ради естественности и доступности; смысловые связи и последовательность сведений сохранены.
