  verdict: revise
  source_fidelity: 'В основном смысл передан верно: сохранены несогласие Иосифа с решением и действием других, его происхождение из Аримафеи и ожидание Царства Божьего. Однако «не согласился» несколько сужает перфрастический перфект ἦν συγκατατεθειμένος до разового акта; «не был согласен» лучше передаёт устойчивую позицию. «Иудейского города» может означать город в Иудее, тогда как τῶν Ἰουδαίων буквально характеризует город как город иудеев.'
