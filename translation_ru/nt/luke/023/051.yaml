  - severity: medium
    issue: «Иудейского города» неоднозначно в ином направлении, чем греческое τῶν Ἰουδαίων.
    rationale: В современном русском «иудейский город» легко читается как город в Иудее; буквальная конструкция исходного текста — «город иудеев». Следует предпочесть точное основное чтение, не оставляя существенную характеристику лишь в сноске.
