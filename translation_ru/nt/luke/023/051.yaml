  terminology: «Царство Божье» сохранено как традиционное и понятное соответствие βασιλεία τοῦ θεοῦ. «Решение и поступок» адекватно сохраняет различие βουλή и πρᾶξις. Указание «город иудеев» не подменяет этническо-историческую формулировку оригинала географическим «иудейский».
