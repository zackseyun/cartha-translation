source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: ru
  text: 'Иисус громко воскликнул: «Отец, в Твои руки вверяю Мой дух».[a] Сказав это, Он испустил дух.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова перекликаются с Пс 30:6 (в иной нумерации — Пс 31:5): «В Твою руку вверяю дух мой».'
    reason: cross_reference
  - marker: b
    text: То есть умер; греческий глагол буквально связан с выдыханием.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: громко воскликнул
  rationale: Естественная русская передача сочетания причастия φωνήσας с дательным образа действия φωνῇ μεγάλῃ; сохраняет силу и слышимость возгласа без тяжеловесного повтора «возгласив громким голосом».
- source_word: Πάτερ
  choice: Отец
  rationale: Передаёт прямое обращение без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: εἰς χεῖράς σου
  choice: в Твои руки
  rationale: Сохраняет множественное число и узнаваемую формулировку, перекликающуюся с Пс 30:6 в русской нумерации.
- source_word: παρατίθεμαι
  choice: вверяю
  rationale: Глагол в среднем залоге выражает сознательную передачу на попечение; «вверяю» естественно и точно передаёт этот смысл.
- source_word: τὸ πνεῦμά μου
  choice: Мой дух
  rationale: В молитвенном обращении πνεῦμα лучше передать как «дух», сохранив богословскую ёмкость выражения и не сводя его к физиологическому дыханию.
- source_word: τοῦτο δὲ εἰπών
  choice: Сказав это
  rationale: Кратко и естественно обозначает действие, предшествующее главному глаголу.
- source_word: ἐξέπνευσεν
  choice: испустил дух
  rationale: Устойчивое и понятное русское выражение смерти, сохраняющее образ выдыхания, заключённый в греческом глаголе.
theological_decisions:
- issue: Значение πνεῦμά μου в последнем изречении Иисуса
  choice: Мой дух
  alternative: Моё дыхание
  rationale: Сознательное обращение к Отцу и глагол вверения указывают на более широкое значение, чем физическое дыхание; перевод сохраняет богословскую глубину, не уточняя природу духа сверх сказанного в тексте.
- issue: Значение παρατίθεμαι
  choice: вверяю
  alternative: предаю
  rationale: «Вверяю» ясно выражает добровольную передачу в руки и на попечение Отца, не привнося значения предательства, возможного у современного русского «предаю» вне устойчивого библейского контекста.
- issue: Передача ἐξέπνευσεν
  choice: испустил дух
  alternative: умер
  rationale: Выбранная формулировка сохраняет образность исходного глагола и одновременно однозначно сообщает о смерти Иисуса.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Заглавные буквы в местоимениях, относящихся к Отцу и Иисусу, соответствуют принятому благоговейному издательскому регистру. Порядок слов перестроен ради естественности русского повествования без потери акцента на громком возгласе.
