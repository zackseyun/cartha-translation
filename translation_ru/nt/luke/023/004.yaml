  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: ru
  text: 'Тогда Пилат сказал первосвященникам и народу: «Я не нахожу никаких оснований для обвинения этого человека».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не нахожу в этом человеке никакой вины». Греческое αἴτιον может означать «вина», но здесь употреблено в судебном смысле — как основание для обвинения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Тогда
  rationale: Мягкая повествовательная связка; «тогда» естественно передаёт развитие событий, не усиливая противопоставление.
- source_word: ἀρχιερεῖς
  choice: первосвященникам
  rationale: Устоявшееся русское обозначение высшего священнического руководства; множественное число сохранено.
- source_word: ὄχλους
  choice: народу
  rationale: В данном эпизоде обозначает присутствующую массу людей; «народу» звучит естественно по-русски, хотя греческое слово стоит во множественном числе.
- source_word: Οὐδὲν εὑρίσκω αἴτιον
  choice: Я не нахожу никакой вины
  rationale: 'Передаёт судебный смысл заявления Пилата: он не обнаруживает вины, дающей основание для обвинения.'
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: за этим человеком
  rationale: Русский юридически окрашенный оборот естественно передаёт греческое сочетание со значением вины, обнаруживаемой в отношении человека.
