  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: ru
  text: 'И они начали обвинять Его, говоря: «Мы обнаружили, что этот человек вводит в заблуждение[a] наш народ, запрещает нам платить налоги кесарю[b] и говорит, что он сам — Мессия[c], царь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сбивает с пути»; также: «искажает» или «развращает наш народ».'
    reason: lexical_alternative
  - marker: b
    text: Греческое φόρους означает налоги или дань, выплачиваемые римскому правителю.
    reason: cultural_note
  - marker: c
    text: 'Или: «Христос». Здесь это слово употреблено как титул и означает «Помазанник».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: И они начали обвинять Его
  rationale: Сохраняется начинательное значение ἤρξαντο и судебный смысл κατηγορεῖν; русское управление глагола «обвинять» естественно передаёт родительный αὐτοῦ прямым дополнением.
- source_word: Τοῦτον εὕραμεν
  choice: Мы обнаружили, что этот человек
  rationale: «Обнаружили» передаёт εὕραμεν и естественно вводит в русском языке содержание предъявляемого обвинения; «этот человек» сохраняет указательную, потенциально пренебрежительную силу Τοῦτον.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: вводит в заблуждение наш народ
  rationale: Формулировка передаёт обвинение в пагубном влиянии, не сводя неоднозначное διαστρέφω исключительно к политическому мятежу; ἔθνος в обращении к Пилату уместно передано словом «народ».
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: запрещает нам платить налоги кесарю
  rationale: «Запрещает» точно выражает κωλύοντα в данном обвинении, подразумеваемое «нам» делает русскую конструкцию ясной, а «налоги» является современным понятным соответствием φόρους.
- source_word: λέγοντα αὑτὸν
  choice: говорит, что он сам
  rationale: Сохраняется нейтральное значение λέγοντα и эмфатическая сила возвратного αὑτόν посредством «он сам».
- source_word: χριστὸν βασιλέα εἶναι
  choice: Мессия, царь
  rationale: Χριστός передан как титул «Мессия» в политически окрашенном обвинении; приложение «царь» сохраняет два сказуемых обозначения без их слияния в единый составной титул.
theological_decisions:
- issue: Передача χριστόν в политически окрашенном обвинении
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово функционирует как иудейский титул помазанного правителя, а не как ставшее именем обозначение; «Мессия» сохраняет этот смысл.
- issue: Соотношение χριστόν и βασιλέα
  choice: Мессия, царь
  alternative: Мессия и царь; Мессия-царь
  rationale: В греческом оба слова являются именными частями конструкции без союза. Приложение сохраняет напряжение между мессианским и царским обозначениями, не объединяя и не разводя их сильнее, чем это делает источник.
translation_notes:
  register: Современный литературный русский язык с ясной судебной формулировкой. Сохранены повторяющиеся элементы обвинительной речи и подчёркнутое «он сам»; неоднозначность политической силы διαστρέφω вынесена в примечание. Прописное «Его» следует принятой русской библейской орфографической традиции, тогда как внутри речи обвинителей «он сам» оставлено со строчной буквы как обычное местоимение.
