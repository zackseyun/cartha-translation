  text: Ἀνάγκην δὲ εἶχεν ἀπολύειν αὐτοῖς κατὰ ἑορτὴν ἕνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/017.yaml
  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: ru
  text: Пилат же был обязан отпускать им на праздник одного узника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В ряде древнейших греческих рукописей, в том числе в папирусе 75 (III век) и Ватиканском кодексе (IV век), а также в ранних коптских переводах весь этот стих отсутствует. Он присутствует в других важных древних рукописях, например в Синайском кодексе (IV век), в латинской традиции и в большинстве более поздних византийских рукописей. Вероятно, переписчики добавили его, чтобы согласовать рассказ Луки с упоминанием обычая отпускать узника в Матфея 27:15 и Марка 15:6. В некоторых рукописях это предложение помещено после стиха 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: был обязан
  rationale: Греческий оборот означает, что человек находится под необходимостью или обязательством; естественное русское «был обязан» передаёт обусловленную обычаем обязанность без неуклюжего буквализма.
- source_word: ἀπολύειν
  choice: отпускать
  rationale: В данном судебно-пенитенциарном контексте глагол обозначает освобождение находящегося под стражей.
- source_word: κατὰ ἑορτήν
  choice: на праздник
  rationale: Обычное современное выражение для действия, совершавшегося по случаю праздника; в контексте имеется в виду Пасха.
- source_word: ἕνα
  choice: одного узника
  rationale: В греческом тексте стоит субстантивированное «одного»; слово «узника» восстанавливается из контекста и делает русский текст ясным, не меняя смысла.
- source_word: δὲ
  choice: же
  rationale: Сохраняет лёгкую связующую и противопоставительную функцию частицы без внесения отсутствующего в оригинале временного «теперь».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Подлежащее «Пилат» выражено явно из контекста, поскольку отдельное русское «он» при наличии нескольких участников могло бы звучать двусмысленно. Маркер сноски поставлен после всего стиха, так как примечание относится к тексту стиха целиком.
