  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: ru
  text: Пилат же, созвав первосвященников, начальников и народ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Пилат
  rationale: Устоявшаяся русская форма личного имени.
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий переход к следующему действию в повествовании, не усиливая противопоставление.
- source_word: συγκαλεσάμενος
  choice: созвав
  rationale: 'Деепричастие естественно передаёт предшествующее обстоятельственное действие аористного причастия: Пилат собрал названные группы, прежде чем обратиться к ним.'
- source_word: ἀρχιερεῖς
  choice: первосвященников
  rationale: Устоявшееся русское обозначение ведущих представителей храмовой священнической власти во множественном числе.
- source_word: ἄρχοντας
  choice: начальников
  rationale: Сохраняет значение лиц, облечённых властью, и естественно звучит в данном перечне; более широкое «руководителей» менее официально, а «правителей» может ошибочно подразумевать самостоятельных государей.
- source_word: λαὸν
  choice: народ
  rationale: Прямо передаёт собирательное значение λαός, не сужая его до случайной толпы.
