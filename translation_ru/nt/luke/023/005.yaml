source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: ru
  text: 'Но они продолжали настаивать: «Он будоражит народ[a], уча по всей Иудее[b], начиная от Галилеи и до этого места[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подстрекает народ». Греческий глагол может означать возбуждать или будоражить людей, особенно с намёком на беспорядки.'
    reason: lexical_alternative
  - marker: b
    text: Название «Иудея» может обозначать собственно область Иудеи или, в более широком употреблении, всю рассматриваемую иудейскую землю; здесь выражение подчёркивает широту деятельности Иисуса.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «досюда» или «до этого места»; речь идёт о протяжённости от Галилеи до места, где Иисус теперь находится перед Пилатом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: продолжали настойчиво утверждать
  rationale: Имперфект передаёт длительное или повторяющееся усиленное настаивание; сочетание сохраняет как продолженность, так и нажим обвинителей.
- source_word: Ἀνασείει
  choice: возмущает
  rationale: Глагол обозначает приведение людей в возбуждение или смятение, особенно с подразумеваемым нарушением порядка; «возмущает» естественно звучит как обвинение, не превращая его в техническое указание на мятеж.
- source_word: τὸν λαὸν
  choice: народ
  rationale: Здесь λαός означает население в широком смысле, а не отдельную собравшуюся толпу.
- source_word: διδάσκων
  choice: уча
  rationale: Деепричастие сохраняет обстоятельственный характер причастия и допускает связь учительства со способом предполагаемого возмущения народа.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: по всей Иудее
  rationale: Передаёт пространственно-распределительное значение κατά с родительным и подчёркивает широкий охват деятельности.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: начав от Галилеи
  rationale: Сохраняет выраженную предлогом ἀπό исходную точку деятельности; оборот относится к Иисусу, как и мужское причастие оригинала.
- source_word: ἕως ὧδε
  choice: дойдя до этого места
  rationale: Естественно передаёт протяжённость от Галилеи до места, где обвинители находятся перед Пилатом, сохраняя указательную силу ὧδε.
theological_decisions:
- issue: Характер обвинения против Иисуса
  choice: «возмущает народ» — обвинение в общественно опасном возбуждении людей без уточнения состава политического преступления
  alternative: «подстрекает народ» или «поднимает народ на мятеж»
  rationale: Ἀνασείει имеет явно отрицательный оттенок в устах обвинителей, однако само по себе не требует технического смысла вооружённого мятежа. Перевод сохраняет остроту обвинения, не усиливая её сверх греческого текста.
- issue: Связь учительства с обвинением
  choice: сохранить причастную конструкцию «уча», не уточняя, является ли учительство способом возмущения или сопутствующей деятельностью
  alternative: «возмущает народ своими учениями»
  rationale: Греческое διδάσκων допускает обстоятельственную связь, но не выражает инструментальность настолько явно, чтобы добавлять «своими учениями».
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-повествовательного контекста. Формулировка обвинения энергична, но не использует архаизмов и не вводит более узкого политико-правового смысла, чем допускает оригинал.
