source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: ru
  text: Но и Ирод тоже не признал Его виновным, ведь он отправил Его обратно к нам.[a] И вот, Он не совершил ничего, заслуживающего смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «ведь я посылал вас к нему».'
    reason: 'Текстуальный вариант: вместо чтения о том, что Ирод отправил Иисуса к Пилату, часть рукописной традиции говорит, что Пилат посылал обвинителей к Ироду.'
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: И Ирод тоже не признал Его виновным
  rationale: 'В греческом после «и Ирод тоже не» подразумевается сказуемое из контекста: Ирод, как и Пилат, не установил вины Иисуса. В русском оно восстановлено для ясности; формулировка сохраняет судебный характер речи.'
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: ведь он отослал Его обратно к нам
  rationale: ἀναπέμπω в данном повествовательном и судебном контексте обозначает отправление обратно; γάρ вводит обоснование, а πρὸς ἡμᾶς указывает направление «к нам».
- source_word: καὶ ἰδοὺ
  choice: И вот
  rationale: «И вот» естественно передаёт указательный, привлекающий внимание оборот ἰδού в современном литературном русском без архаизации.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: ничего, заслуживающего смерти
  rationale: Сочетание обозначает отсутствие поступка, за который полагалась бы смертная казнь, и сохраняет судебный смысл высказывания.
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: Он не совершил
  rationale: 'Перфектная конструкция передаёт совершённое действие с актуальным результатом, а дательный αὐτῷ наиболее естественно понимается как указание на деятеля: речь идёт о том, что сделал Иисус.'
theological_decisions:
- issue: Значение αὐτῷ при πεπραγμένον
  choice: 'Иисус является деятелем: «Он не совершил»'
  alternative: «в Нём не найдено» или, менее вероятно, «с Ним не сделано»
  rationale: 'Судебный контекст требует оценки поступков, вменяемых Иисусу. При этом перевод не расширяет оправдательный вывод за пределы сказанного: речь непосредственно идёт о деянии, заслуживающем смерти.'
- issue: Восстановление пропущенного сказуемого после οὐδὲ Ἡρῴδης
  choice: «не признал Его виновным»
  alternative: Буквально эллиптическое «и Ирод тоже не»
  rationale: Греческий оборот опирается на предшествующую речь Пилата; в русском буквальная недоговорённость звучала бы неестественно. Восстановлен судебный смысл, не приписывающий Ироду отдельной прямой формулы приговора.
translation_notes:
  register: Современный литературный русский с достоинством судебной речи. Местоимение «Его/Он» написано с прописной буквы по принятой в русском библейском стиле традиции; архаическое «се» не используется.
