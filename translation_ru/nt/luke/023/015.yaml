  naturalness: Исправленный текст сохраняет современный литературный и судебный регистр. «Отправил обратно» нейтральнее и естественнее, чем «отослал обратно» в данном контексте.
  terminology: «Виновным» и «заслуживающего смерти» корректно сохраняют судебную направленность. Имя «Ирод» передано по устоявшейся русской библейской форме. Текстуальная сноска соответствует отмеченному варианту и поставлена после затронутой фразы.
