lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Обычный сочинительный союз, связывающий эту причастную конструкцию с предыдущим повествованием.
- source_word: λέγοντες
  choice: говорили
  rationale: Причастие настоящего времени мужского рода множественного числа относится к действующим лицам предыдущего стиха. Личная форма естественна по-русски и не добавляет прямо в глагол подразумеваемую контекстом насмешку.
- source_word: Εἰ
  choice: если
  rationale: Сохраняет условную и вызывающую форму насмешки; перевод «поскольку» необоснованно представлял бы слова как признание притязания.
- source_word: σὺ εἶ
  choice: ты —
  rationale: Местоимение передаёт выраженное в греческом тексте подлежащее, а тире естественно подчёркивает именную часть сказуемого в русском предложении.
- source_word: ὁ βασιλεὺς
  choice: Царь
  rationale: Определённый артикль указывает на конкретный царский титул, который насмешливо обращают против Иисуса. Заглавная буква сохраняет восприятие слов как титула в данном повествовательном контексте.
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: Родительный множественного числа передан непосредственно. В рассказе о Страстях это устойчивое политико-мессианское наименование; возможный региональный смысл отмечен в сноске.
- source_word: σῶσον
  choice: спаси
  rationale: Аорист повелительного наклонения второго лица единственного числа естественно передаётся краткой формой «спаси» и сохраняет связь с более широким употреблением глагола σῴζω у Луки.
- source_word: σεαυτόν
  choice: себя
  rationale: Прямое возвратное дополнение точно и естественно передано русским местоимением «себя» без избыточного усиления.
theological_decisions:
- issue: Передача насмешливого царского титула βασιλεὺς τῶν Ἰουδαίων
  choice: Царь иудеев
  alternative: Царь жителей Иудеи
  rationale: Основной вариант сохраняет традиционно узнаваемый и контекстуально уместный политико-мессианский титул, не устраняя иронию сцены. Регионально-географическое понимание Ἰουδαίων остаётся возможным и вынесено в сноску.
