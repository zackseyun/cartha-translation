  source_fidelity: Текст точно передаёт Πιλᾶτος δὲ ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν. «Пилат же» адекватно передаёт повествовательное δέ; «услышав это» сохраняет обстоятельственное значение аористного причастия; «спросил, галилеянин ли этот человек» естественно передаёт косвенный вопрос с εἰ. Связка ἐστιν в русском именном сказуемом нормативно не выражается.
