  terminology: «Пилат» — закреплённая русская форма имени; «галилеянин» точно передаёт обозначение региональной принадлежности. «Этот человек» в данном контексте является естественным русским способом отослать к уже обсуждаемому человеку и не вводит имени или богословского истолкования.
