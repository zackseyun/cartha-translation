  text: Пилат же, услышав это, спросил, галилеянин ли этот человек.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Пилат
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: δὲ
  choice: же
  rationale: Передаёт мягкий повествовательный переход без излишне сильного противопоставления, которое мог бы создать союз «но».
- source_word: ἀκούσας
  choice: услышав это
  rationale: Деепричастие сохраняет обстоятельственное значение греческого аористного причастия; «это» естественно восполняет подразумеваемый из контекста объект.
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Прямой и естественный современный эквивалент глагола со значением вопроса или выяснения.
- source_word: εἰ
  choice: ли
  rationale: Русская частица естественно вводит косвенный общий вопрос.
- source_word: ὁ ἄνθρωπος
  choice: этот человек
  rationale: Хотя буквально выражение означает «человек», указательное слово в русском ясно обозначает уже упомянутого участника и не заменяет его именем Иисус.
- source_word: Γαλιλαῖός
  choice: галилеянин
  rationale: Точно передаёт прилагательное региональной принадлежности в субстантивном русском выражении.
- source_word: ἐστιν
  choice: галилеянин ли
  rationale: Настоящее время греческой связки естественно остаётся невыраженным в русском именном сказуемом; сдвиг во времени не требуется.
