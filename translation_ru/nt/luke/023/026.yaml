id: LUK.23.26
reference: Luke 23:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: ru
  text: Когда Его повели прочь, они схватили некоего Симона Киринеянина, шедшего с поля[a], и возложили на него крест[b], чтобы он нёс его за Иисусом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шедшего из сельской местности». Греческое слово может обозначать как конкретное поле, так и сельскую местность за пределами города.'
    reason: lexical_alternative
  - marker: b
    text: Некоторые понимают здесь «крест» более конкретно как «поперечную перекладину креста», однако в греческом тексте сказано просто «крест».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: повели прочь
  rationale: Передаёт значение ἀπάγω — уводить или вести прочь — и сохраняет картину конвоирования Иисуса.
- source_word: ἐπιλαβόμενοι
  choice: схватили
  rationale: В данном контексте причастие обозначает решительное физическое задержание; «схватили» естественно передаёт принудительный характер действия.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: некоего Симона Киринеянина
  rationale: «Некоего» передаёт неопределённость τινα, а «Киринеянина» ясно обозначает происхождение Симона из Кирены.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: шедшего с поля
  rationale: Краткое и естественное выражение, сохраняющее обычное значение ἀγρός; более широкое значение «из сельской местности» отмечено в сноске.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: возложили на него крест
  rationale: «Возложили» точно передаёт помещение тяжести на человека и сохраняет принудительно назначенное бремя.
- source_word: τὸν σταυρὸν
  choice: крест
  rationale: σταυρός прямо означает «крест»; более узкое «поперечная перекладина» не выражено отдельным словом в греческом тексте.
- source_word: φέρειν
  choice: чтобы он нёс
  rationale: Инфинитив обозначает цель возложения креста; конструкция с «чтобы» естественна в современном русском языке.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: за Иисусом
  rationale: Передаёт пространственное положение Симона позади Иисуса в движущейся процессии, не добавляя переносного толкования.
theological_decisions:
- issue: Следует ли конкретизировать σταυρός как поперечную перекладину креста
  choice: крест
  alternative: поперечная перекладина
  rationale: Греческий текст употребляет общее слово σταυρός и не уточняет часть конструкции; перевод «крест» сохраняет формулировку источника и не вводит историческую реконструкцию.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным повествовательным стилем. Порядок действий и принудительный характер происходящего сохранены; местоимение «Его» написано с прописной буквы в соответствии с принятой русской библейской издательской нормой.
