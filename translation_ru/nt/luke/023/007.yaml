  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: ru
  text: Узнав, что Иисус — из области, подвластной Ироду[a], Пилат послал Его к Ироду, который и сам был в Иерусалиме в те дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находится под властью Ирода». Греческое выражение указывает на принадлежность Иисуса к области, находившейся под административно-судебной властью Ирода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Узнав
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: Пилат сначала выяснил принадлежность Иисуса к области власти Ирода, а затем послал Его к Ироду.'
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Иисус находится под юрисдикцией Ирода
  rationale: Оборот обозначает административно-судебную власть Ирода над областью, откуда происходил Иисус. «Под юрисдикцией» точно передаёт смысл в данном судебном контексте.
- source_word: ἀνέπεμψεν αὐτὸν
  choice: Пилат послал Его
  rationale: Глагол может иметь оттенок передачи дела вышестоящему или компетентному правителю, однако нейтральное «послал» естественно и точно; имена Пилата и Иисуса восстановлены из контекста для ясности по-русски.
- source_word: πρὸς Ἡρῴδην
  choice: к Ироду
  rationale: Предлог πρός с винительным падежом обозначает направленность к лицу.
- source_word: ὄντα καὶ αὐτὸν
  choice: который ... тоже был
  rationale: Причастный оборот относится к Ироду, а καὶ αὐτόν подчёркивает, что и Ирод находился в Иерусалиме.
- source_word: ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Обычная современная русская форма географического названия.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: в те дни
  rationale: Буквально «в эти дни»; в русском повествовании естественное дейктическое соответствие — «в те дни».
theological_decisions:
- issue: Политико-правовой смысл ἐξουσία применительно к Ироду
  choice: юрисдикция
  alternative: власть; область власти
  rationale: Здесь речь идёт не о богословском понятии власти, а об административной и судебной компетенции Ирода Антипы в отношении уроженца подвластной ему области. «Юрисдикция» сохраняет этот контекстуальный смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции; имена участников восстановлены вместо двух местоимений для устранения неестественной по-русски двусмысленности.
