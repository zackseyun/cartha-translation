  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: ru
  text: И всё их собрание встало и повело Его к Пилату.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё их множество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Обычный повествовательный союз сохраняет последовательное течение рассказа, не добавляя оттенка, которого нет в греческом тексте.
- source_word: ἀναστὰν
  choice: поднялось
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу; личная форма естественна по-русски и передаёт переход всего собрания к действию.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: всё их собрание
  rationale: πλῆθος означает множество или собравшуюся группу; в контексте завершившегося разбирательства «собрание» не создаёт образ случайной толпы и при этом не превращает группу в более строго определённый официальный орган. ἅπαν и αὐτῶν переданы словами «всё» и «их».
- source_word: ἤγαγον
  choice: повело
  rationale: Аорист ἄγω здесь означает вести или отвести кого-либо к месту либо лицу; «повело» согласуется с собирательным существительным «собрание» и сохраняет смысл сопровождения Иисуса.
- source_word: αὐτὸν
  choice: Его
  rationale: Прямое дополнение относится к Иисусу; местоимение передано без смыслового расширения.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: к Пилату
  rationale: ἐπί с винительным после глагола движения указывает на направленность к лицу. «К Пилату» непосредственно передаёт движение, тогда как «пред Пилата» сильнее подчёркивало бы судебное представление.
- source_word: Πιλᾶτον
  choice: Пилату
  rationale: Имя передано в традиционной и современной русской форме с требуемым дательным падежом.
theological_decisions:
- issue: Передача собирательного субъекта в судебном контексте
  choice: всё их собрание
  alternative: всё их множество; вся их толпа
  rationale: «Собрание» отражает организованный характер группы в данном контексте, но не уточняет её официальный статус сверх сказанного в греческом тексте. Лексическая широта πλῆθος отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис краток и естественен; прописная буква в местоимении «Его» следует принятой русской библейской издательской норме и не меняет содержания оригинала.
