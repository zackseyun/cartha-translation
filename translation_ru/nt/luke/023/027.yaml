  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: ru
  text: За Ним шло множество народа, в том числе женщины, которые били себя в грудь и оплакивали Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: шло
  rationale: Имперфект передаёт продолжавшееся действие в ходе повествования; русское несовершенное прошедшее естественно сохраняет этот вид.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица служит связкой в повествовании; в современном русском отдельный союз здесь необязателен.
- source_word: αὐτῷ
  choice: за Ним
  rationale: Дательный падеж при ἀκολουθέω означает следование за Иисусом; русское управление требует предлога «за».
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: множество народа
  rationale: Передаёт большую массу людей и сохраняет собирательный характер греческого выражения без тяжеловесного буквального нанизывания родительных форм.
- source_word: καὶ γυναικῶν
  choice: в том числе женщины
  rationale: В контексте женщины представлены как особо выделенная часть сопровождавшего множества; формулировка также ясно связывает с ними последующее относительное предложение.
- source_word: αἳ
  choice: которые
  rationale: Женский род множественного числа недвусмысленно относит последующие действия именно к женщинам.
- source_word: ἐκόπτοντο
  choice: били себя в грудь
  rationale: В контексте скорби глагол обозначает ритуальный жест оплакивания — удары себя в грудь; явное выражение устраняет неясность буквального «били себя».
- source_word: ἐθρήνουν
  choice: оплакивали
  rationale: Глагол обозначает скорбное, часто звучащее вслух оплакивание; современное русское слово естественно передаёт этот смысл.
- source_word: αὐτόν
  choice: Его
  rationale: Прямое дополнение относится к Иисусу и естественно сочетается с русским глаголом «оплакивать».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Прописные местоимения, относящиеся к Иисусу, употреблены в соответствии с принятой русской библейской издательской традицией. Сохранена длительность трёх действий посредством глаголов несовершенного вида.
