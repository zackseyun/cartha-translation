  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: ru
  text: 'Народ стоял и смотрел. Но и начальники насмехались над Ним, говоря: «Других спасал — пусть спасёт Себя, если Он — Божий Мессия, Избранный».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если Он — Христос Божий, Избранный».'
    reason: Указывает допустимую традиционную передачу титула ὁ χριστὸς τοῦ θεοῦ; греческий текстовый вариант при этом не предполагается.
lexical_decisions:
- source_word: εἱστήκει
  choice: стоял
  rationale: Форма передаёт состояние и служит для описания сцены; «стоял» естественно сохраняет позу и длительный фон.
- source_word: θεωρῶν
  choice: смотрел
  rationale: Причастие обозначает продолжающееся наблюдение; сочетание «стоял и смотрел» ясно и естественно в современном русском.
- source_word: ἐξεμυκτήριζον
  choice: насмехались над Ним
  rationale: Глагол выражает презрительную насмешку; несовершенный вид передаёт продолжавшееся действие. Местоимение восполнено из контекста.
- source_word: ἄρχοντες
  choice: начальники
  rationale: В данном контексте слово обозначает представителей правящей религиозно-общественной верхушки; «начальники» сохраняет традиционную библейскую ясность, не сужая значение до конкретной должности.
- source_word: Ἄλλους ἔσωσεν
  choice: Других спасал
  rationale: «Спасал» сохраняет смысл σῴζω и создаёт естественную русскую насмешливую реплику, одновременно поддерживая повтор с «спасёт».
- source_word: σωσάτω ἑαυτόν
  choice: пусть спасёт Себя
  rationale: Такая конструкция прямо передаёт повелительную форму и сохраняет словесный повтор, на котором строится ирония.
- source_word: εἰ οὗτός ἐστιν
  choice: если Он —
  rationale: В русском указательное «этот» здесь звучало бы неестественно либо потребовало бы добавления «человек»; ударное «Он» в прямой речи передаёт указательно-пренебрежительный оттенок без лишнего пояснения.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: Божий Мессия
  rationale: Χριστός употреблено как титул Помазанника; «Мессия» понятно современному читателю, а притяжательное «Божий» естественно передаёт родительный τοῦ θεοῦ.
- source_word: ὁ ἐκλεκτός
  choice: Избранный
  rationale: Субстантивированное прилагательное передано как титул и сохраняет его христологический вес без добавочного толкования.
theological_decisions:
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово явно является титулом в формуле «Божий Мессия»; перевод «Мессия» раскрывает титульный смысл и не превращает его в личное имя.
- issue: Сила ὁ ἐκλεκτός
  choice: Избранный
  alternative: Избранник
  rationale: «Избранный» непосредственно передаёт греческое прилагательное, употреблённое субстантивно, и сохраняет торжественный титульный оттенок без уточнения природы избрания.
- issue: Ирония призыва спасти Себя
  choice: сохранён повтор «спасал — спасёт»
  alternative: «других избавлял — пусть избавит Себя»
  rationale: Повтор одного корня отражает повтор σῴζω в оригинале и оставляет богословское напряжение между прежним спасением других и отказом спасти Себя неразрешённым.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис короткий и доступный; прямая речь сохраняет насмешливую резкость. Прописные буквы в местоимениях о Христе и в мессианских титулах соответствуют принятому русскому библейскому оформлению.
