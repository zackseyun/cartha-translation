  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: ru
  text: 'Ибо вот, наступают дни, когда скажут: «Блаженны бесплодные, и утробы, которые не рождали, и груди, которые не кормили».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественный и достаточно выразительный русский указательный маркер, привлекающий внимание к грядущему событию.
- source_word: Μακάριαι
  choice: Блаженны
  rationale: Сохраняет форму провозглашения и намеренный парадокс исходного текста; слово понятно в современном литературном и библейском регистре.
- source_word: αἱ στεῖραι
  choice: бесплодные
  rationale: Передаёт субстантивированное прилагательное во множественном числе без добавления отсутствующего в греческом существительного «женщины».
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: утробы, которые не рождали
  rationale: Сохраняет образную метонимию и параллелизм оригинала, не сглаживая выражение до «женщины, которые не рожали».
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: груди, которые не кормили
  rationale: В контексте речь идёт о кормлении младенцев грудью; краткая формулировка сохраняет телесный образ и синтаксический параллелизм.
theological_decisions:
- issue: Парадоксальное объявление бесплодных блаженными
  choice: Сохранено прямое «Блаженны бесплодные»
  alternative: «Счастливы бездетные женщины»
  rationale: Иисус говорит о грядущем бедствии, при котором прежняя оценка будет перевёрнута. Перевод не должен ослаблять эту напряжённость или превращать высказывание в общее учение о бездетности.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Трёхчастный параллелизм оригинала сохранён; архаичное «се» не используется.
