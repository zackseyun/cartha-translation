  source_fidelity: 'Греческое ὅτι ἰδού требует причинно-объяснительной связки вместе с маркером привлечения внимания; «Потому что вот» передаёт смысл, но неудачно по-русски. Остальной трёхчленный параллелизм передан близко к оригиналу: сохранены «бесплодные», метонимические «утробы» и «груди», а также отрицания «не рождали / не кормили».'
  naturalness: Сочетание «Потому что вот» тяжеловесно и ненормативно для современного литературного библейского регистра. «Ибо вот» естественно в возвышенной речи и не является чрезмерной архаизацией. Формула «груди, которые не кормили» намеренно образна, но понятна в данном параллелизме.
  terminology: «Блаженны» точно передаёт Μακάριαι и сохраняет парадоксальный характер пророчества. «Бесплодные» корректно передаёт αἱ στεῖραι без ненужного добавления «женщины». Специальные сноски не требуются.
