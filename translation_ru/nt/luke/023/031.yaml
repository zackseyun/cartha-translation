base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: ru
  text: Ведь если так поступают с зелёным деревом[a], что же будет с сухим?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «с сырым (влажным) деревом». В противопоставлении сухому «зелёное» передаёт образ ещё не высохшей древесины.'
    reason: lexical_alternative
  - marker: b
    text: 'Образ, вероятно, строится по принципу «от меньшего к большему»: если так поступают с зелёным деревом, то чего ожидать сухому? Конкретные значения обоих образов в тексте не названы.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Ведь
  rationale: Союз вводит обоснование предшествующих слов Иисуса; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: с зелёным деревом
  rationale: Оборот сохранён как образ. «Зелёное дерево» по-русски естественно обозначает живую, ещё не высохшую древесину; предлог «с» позволяет передать широкое греческое ἐν без искусственного «в дереве».
- source_word: ὑγρῷ
  choice: зелёным
  rationale: Буквально слово может означать «влажный, сырой», но в противопоставлении сухому дереву «зелёный» естественно передаёт свежую, не высохшую древесину.
- source_word: ξύλῳ
  choice: деревом
  rationale: ξύλον допускает значения «дерево» и «древесина». Здесь «дерево» сохраняет ёмкость образа и звучит по-русски естественнее в паре «зелёное — сухое».
- source_word: ταῦτα ποιοῦσιν
  choice: так поступают
  rationale: Передаёт множественное ταῦτα обобщающим русским наречием «так» и сохраняет неопределённый субъект третьего лица множественного числа.
- source_word: ἐν τῷ ξηρῷ
  choice: с сухим
  rationale: 'Эллипсис воспроизведён естественно: существительное «дерево» не повторяется, но ясно подразумевается из первой части.'
- source_word: τί γένηται
  choice: что же будет
  rationale: Риторический вопрос указывает на ожидаемый исход; «что же будет» передаёт эту силу, не уточняя характера грядущего события.
theological_decisions:
- issue: Значение образа зелёного и сухого дерева
  choice: Сохранить образ без указания его конкретных референтов в основном тексте.
  alternative: Прямо отождествить зелёное дерево с Иисусом, а сухое — с Иерусалимом или его жителями.
  rationale: Вероятно, изречение движется от меньшего к большему и предупреждает о грядущем суде, однако сам греческий текст не называет референтов образа. Их уточнение в переводе сняло бы намеренную многозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная форма риторического вопроса. Образность оригинала сохранена, а буквально неестественная конструкция с ἐν передана русским «с».
