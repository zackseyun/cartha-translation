base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: ru
  text: 'Когда они пришли к месту, называемому Черепом[a], там распяли Его и преступников: одного справа, другого слева.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к месту, именуемому Черепом». Греческое название Κρανίον буквально означает «череп».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «одного с правой стороны, другого с левой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: пришли
  rationale: Аорист ἔρχομαι в повествовании естественно передаётся как «пришли»; это также сохраняет направительное значение последующего ἐπί с винительным падежом.
- source_word: ἐπὶ τὸν τόπον
  choice: на место
  rationale: При глаголе движения ἐπί с винительным обозначает направление; по-русски сочетание «пришли на место» звучит естественно.
- source_word: τὸν καλούμενον Κρανίον
  choice: называемое Череп
  rationale: Κρανίον буквально означает «череп» и здесь служит названием места. Перевод смыслового значения предпочтительнее транслитерации и не привносит название из параллельных Евангелий.
- source_word: ἐσταύρωσαν
  choice: распяли
  rationale: Стандартный, точный и понятный русский эквивалент σταυρόω, не добавляющий деталей, прямо не выраженных глаголом.
- source_word: κακούργους
  choice: преступников
  rationale: κακοῦργος обозначает преступника или злодея. «Преступники» — современное и контекстуально точное слово, не сужающее значение до «разбойников».
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: одного справа, другого слева
  rationale: Русская распределительная конструкция ясно передаёт греческое сопоставление μὲν… δὲ. Притяжательное «от Него» не добавлено, поскольку в греческом оно лишь подразумевается.
theological_decisions:
- issue: Передача Κρανίον
  choice: Череп
  alternative: Лобное место; место, называемое Черепом
  rationale: «Череп» сохраняет буквальный смысл греческого названия и не подменяет его традиционным названием из иной переводческой традиции. Именительный падеж после «называемое» подчёркивает функцию собственного наименования.
- issue: Обозначение двух распятых вместе с Иисусом
  choice: преступников
  alternative: злодеев; разбойников
  rationale: Лукино κακούργοι имеет более широкое значение, чем «разбойники». Выбор «преступников» избегает гармонизации с терминологией других Евангелий.
- issue: Положение распятых
  choice: одного справа, другого слева
  alternative: одного по правую руку от Него, другого по левую
  rationale: Основной текст сохраняет лаконичность и отсутствие явно выраженного αὐτοῦ при обозначении сторон, не устраняя понятную из контекста соотнесённость с Иисусом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прост и доступен; сохранены повтор «там» и последовательность греческого текста. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
