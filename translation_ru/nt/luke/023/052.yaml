  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: ru
  text: Он пришёл к Пилату и попросил тело Иисуса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение отсылает к Иосифу из Аримафеи, названному в предыдущем стихе. В связном русском повествовании естественнее употребить «он»; вариант «этот человек» был бы излишне тяжеловесным.
- source_word: προσελθὼν
  choice: пришёл к
  rationale: Аористное причастие обозначает действие, предшествующее просьбе. Сочинительная передача личной формой естественна по-русски и сохраняет последовательность действий; «подойдя к» звучало бы несколько буквальнее.
- source_word: τῷ Πιλάτῳ
  choice: к Пилату
  rationale: Дательный падеж при προσέρχομαι указывает на лицо, к которому пришли. Имя без добавления «Понтию» соответствует исходному тексту и контексту.
- source_word: ᾐτήσατο
  choice: попросил
  rationale: Средняя форма αἰτέω здесь означает просьбу о получении чего-либо. Русское «попросил тело» лаконично и естественно; «запросил» или «обратился с просьбой выдать» добавляли бы официальный оттенок.
- source_word: τὸ σῶμα
  choice: тело
  rationale: σῶμα прямо означает «тело». Хотя речь идёт об умершем Иисусе, слово «труп» было бы более резким и интерпретирующим.
- source_word: τοῦ Ἰησοῦ
  choice: Иисуса
  rationale: Родительный падеж естественно передаёт принадлежность и сохраняет простоту греческого выражения.
theological_decisions: []
