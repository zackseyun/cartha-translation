  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: ru
  text: 'И Он сказал ему: «Истинно говорю тебе: сегодня[a] ты будешь со Мной в раю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, что менее вероятно: «Истинно говорю тебе сегодня: ты будешь со Мной в раю». Древнегреческие рукописи не содержали современной пунктуации; при таком прочтении слово «сегодня» относится к «говорю», а не к «будешь».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Истинно
  rationale: В речениях Иисуса это слово служит торжественным подтверждением, вводящим авторитетное заявление. «Истинно» естественно для современного литературного русского и сохраняет его силу.
- source_word: σοι λέγω
  choice: говорю тебе
  rationale: Прямой и естественный перевод распространённой евангельской формулы, сохраняющий порядок и торжественный характер исходного выражения.
- source_word: σήμερον
  choice: сегодня
  rationale: 'В основном тексте наречие отнесено к будущему «будешь», что синтаксически наиболее естественно: обещание исполнится в тот же день. Иное возможное членение отражено в сноске.'
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: Прозрачно передаёт личное пребывание вместе с Иисусом. Прописная буква в местоимении соответствует принятому благоговейному библейскому регистру русского текста, не меняя смысла.
- source_word: ἔσῃ
  choice: ты будешь
  rationale: Точно и естественно передаёт форму будущего времени второго лица единственного числа.
- source_word: παραδείσῳ
  choice: в раю
  rationale: «Рай» — устоявшийся и точный русский эквивалент παράδεισος в эсхатологическом контексте.
theological_decisions:
- issue: Синтаксическая связь σήμερον («сегодня») в изречении, пунктуация которого влияет на понимание обещания
  choice: Отнести «сегодня» к словам «ты будешь со Мной в раю»
  alternative: '«Истинно говорю тебе сегодня: ты будешь со Мной в раю»'
  rationale: Древнегреческий текст первоначально не имел современной пунктуации. Связь «сегодня» с «будешь» наиболее естественна по синтаксису и ходу речи, однако альтернативное членение действительно возможно и потому сохранено в сноске без замалчивания богословской напряжённости.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Формулировка ясна обычному читателю; сохранены торжественность Ἀμήν и реальная пунктуационная неоднозначность.
