base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: ru
  text: 'Над Ним насмехались и воины: они подходили и предлагали Ему кислое вино,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уксус». Греческое слово означает кислое вино — дешёвый распространённый напиток.'
    reason: 'Лексическая альтернатива: традиционное «уксус» возможно, но для современного читателя может ошибочно подразумевать приправу, а не напиток.'
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: насмехались
  rationale: Глагол ἐμπαίζω обозначает враждебную насмешку, издевательство. «Насмехались» естественно и достойно передаёт это действие по-русски.
- source_word: δὲ … καὶ οἱ στρατιῶται
  choice: и воины
  rationale: Сочетание δέ и καί продолжает повествование и добавляет воинов к уже упомянутым насмешникам; русское «и воины» ясно передаёт значение «также» без тяжеловесности.
- source_word: οἱ στρατιῶται
  choice: воины
  rationale: В контексте казни речь идёт о римских солдатах. «Воины» — понятное и стилистически уместное библейское обозначение, не архаичное для литературного русского языка.
- source_word: προσερχόμενοι
  choice: они подходили
  rationale: Причастие обозначает приближение к Иисусу. Личная конструкция по-русски звучит естественнее и сохраняет одновременность действий.
- source_word: ὄξος
  choice: кислое вино
  rationale: ὄξος здесь означает дешёвое кислое вино или винный напиток, а не прежде всего современный столовый уксус. «Кислое вино» точнее передаёт предмет питья.
- source_word: προσφέροντες
  choice: подносили
  rationale: Глагол означает, что напиток подносили или предлагали Иисусу. «Подносили» сохраняет конкретное действие и не определяет его мотив.
- source_word: αὐτῷ
  choice: Ему
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому уважительному русскому библейскому оформлению.
theological_decisions:
- issue: Характер поднесения кислого вина
  choice: Действие передано нейтрально внутри сцены насмешки, без уточнения мотива воинов.
  alternative: Истолковать поднесение как милосердие либо исключительно как дополнительное издевательство.
  rationale: Контекст прямо называет поведение воинов насмешкой, однако само причастие προσφέροντες не раскрывает их психологический мотив. Перевод сохраняет эту напряжённость и не добавляет толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Двоеточие естественно связывает общее сообщение о насмешке с описанием действий воинов; повторяющееся действие греческих причастий передано глаголами несовершенного вида.
