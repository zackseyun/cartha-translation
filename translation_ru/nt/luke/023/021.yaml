  text: οἱ δὲ ἐπεφώνουν λέγοντες· ⸂Σταύρου σταύρου⸃ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: ru
  text: 'Но они продолжали кричать: «Распни! Распни Его!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более пояснительно: «Казни Его на кресте! Казни Его на кресте!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Но они
  rationale: Субстантивированное οἱ указывает на упомянутых в контексте людей, а δέ обозначает здесь противопоставление предшествующим словам Пилата.
- source_word: ἐπεφώνουν
  choice: продолжали кричать
  rationale: Имперфект передаёт продолжительное или повторяющееся действие, а ἐπιφωνέω — громкий возглас.
- source_word: λέγοντες
  choice: не передано отдельным словом; содержание введено двоеточием
  rationale: В современном русском оборот «кричать, говоря» тяжеловесен; двоеточие естественно вводит содержание крика, сохраняя функцию причастия.
- source_word: Σταύρου σταύρου
  choice: Распни! Распни
  rationale: Повтор повелительной формы сохранён и передаёт настойчивость требования; русский глагол «распять» точно обозначает казнь на кресте.
- source_word: αὐτόν
  choice: Его
  rationale: Прямое соответствие винительному местоимению; объект естественно поставлен после повторённых повелительных форм.
theological_decisions:
- issue: Передача требования σταύρου
  choice: Распни
  alternative: Казни на кресте
  rationale: «Распни» является точным, традиционно понятным и естественным русским соответствием, не добавляющим богословского истолкования.
translation_notes:
  register: Современный литературный русский язык; краткая, напряжённая реплика толпы. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
