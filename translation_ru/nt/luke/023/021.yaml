  terminology: «Распни» — точное и общеупотребительное русское соответствие σταύρου. Сноска корректно отмечает пояснительный, а не основной, вариант «Казни Его на кресте». Написание «Его» с прописной буквы соответствует заявленной библейской редакционной практике и не меняет смысла.
