  source_fidelity: '«Но они продолжали кричать: „Распни! Распни Его!“» точно передаёт δέ как «Но», имперфект ἐπεφώνουν как продолжающийся/повторяющийся крик, а повторённое повеление Σταύρου σταύρου — повтором «Распни! Распни». Конечное «Его» сохраняет позицию и синтаксическую область αὐτόν: объект относится к обоим повелениям.'
