  terminology: «Галилея», «гробница» и «тело» употреблены точно. Прописные «Ним» и «Его» являются последовательной издательской конвенцией и не вносят богословского истолкования. Сноска корректно отражает допустимую альтернативу «сопровождавшие Его из Галилеи».
