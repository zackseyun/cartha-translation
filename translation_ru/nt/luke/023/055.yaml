  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: известную группу женщин, их прибытие вместе с Иисусом из Галилеи, последование, осмотр гробницы и способ положения тела. «Пошли следом и увидели» — допустимая естественная передача аористного причастия κατακολουθήσασαι и основного глагола ἐθεάσαντο; смысловая последовательность сохранена. «Гробница» соответствует μνημεῖον в данном погребальном контексте.'
