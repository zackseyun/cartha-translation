  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: ru
  text: Женщины, пришедшие с Ним из Галилеи, пошли следом и увидели гробницу и то, как было положено Его тело.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сопровождавшие Его из Галилеи».'
    reason: 'Лексическая альтернатива для συνεληλυθυῖαι ... αὐτῷ: конструкция может быть выражена как совместный приход или сопровождение.'
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: пошли следом
  rationale: Аористное причастие передаёт действие, предшествующее наблюдению; личная форма в последовательности естественна по-русски и сохраняет ход событий.
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход в повествовании; в русском контексте связь естественно передаётся без вводного союза.
- source_word: αἱ γυναῖκες
  choice: женщины
  rationale: Речь идёт об уже известной из контекста группе; отдельное выражение определённости в русском не требуется.
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: пришедшие с Ним из Галилеи
  rationale: Сохраняются и исходная точка, и совместность движения; причастная конструкция естественна для современного литературного русского.
- source_word: ἐθεάσαντο
  choice: увидели
  rationale: Глагол может подразумевать внимательное наблюдение, но дополнение и последующая придаточная часть достаточно передают этот оттенок.
- source_word: τὸ μνημεῖον
  choice: гробницу
  rationale: В контексте погребения это точное и общепонятное обозначение высеченного или устроенного места захоронения.
- source_word: ὡς ἐτέθη
  choice: как было положено
  rationale: ὡς выражает образ действия, а пассив τίθημι — помещение тела в гробницу; формулировка сохраняет достоинство и близость к источнику.
- source_word: τὸ σῶμα αὐτοῦ
  choice: Его тело
  rationale: Естественная русская передача греческой именной группы с притяжательным местоимением.
theological_decisions:
- issue: Синтаксическая связь κατακολουθήσασαι с ἐθεάσαντο
  choice: 'Передано как последовательные личные глаголы: «пошли следом и увидели»'
  alternative: «последовав, увидели»
  rationale: Оба варианта допускаются грамматикой и не несут доктринального различия; выбранный вариант яснее передаёт последовательность действий в современном русском.
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный стиль. Местоимение «Ним/Его» применительно к Иисусу написано с прописной буквы согласно распространённой русской библейской издательской традиции; это не добавляет содержания к греческому тексту.
