base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: ru
  text: Он освободил того, кто был брошен в тюрьму за мятеж и убийство[a] и кого они просили освободить; а Иисуса отдал на их волю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был заключён в тюрьму». Греческое выражение буквально и образно: «был брошен в тюрьму».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: освободил
  rationale: Точно и естественно передаёт освобождение заключённого в данном судебном контексте.
- source_word: διὰ στάσιν καὶ φόνον
  choice: за мятеж и убийство
  rationale: Предлог διά с винительным указывает на причину заключения; στάσις здесь означает политический мятеж или восстание, а не просто спор.
- source_word: βεβλημένον εἰς φυλακήν
  choice: был брошен в тюрьму
  rationale: Сохраняет выразительность βάλλω и состояние, возникшее вследствие предшествующего заключения.
- source_word: ὃν ᾐτοῦντο
  choice: кого они просили освободить
  rationale: Имперфект передаёт продолжавшуюся просьбу; добавление «освободить» естественно восполняет подразумеваемое из контекста действие и устраняет неясность русского «просили».
- source_word: παρέδωκεν
  choice: отдал
  rationale: В сочетании «отдал на их волю» естественно передаёт передачу Иисуса для исполнения решения толпы, не добавляя способа казни.
- source_word: τῷ θελήματι αὐτῶν
  choice: на их волю
  rationale: Сохраняет волевой и нравственный вес θέλημα и воспроизводит смысловую связь передачи Иисуса с желанием толпы.
- source_word: δὲ ... δὲ
  choice: Он ...; а
  rationale: Первое δέ передано самим продолжением повествования без отдельного союза, второе — противопоставительным «а».
theological_decisions:
- issue: Контраст между освобождённым мятежником и Иисусом
  choice: Контраст сохранён синтаксически, без богословского пояснения.
  alternative: Добавить «вместо Иисуса» или истолковать сцену как прямое утверждение заместительной жертвы.
  rationale: Стих прямо сообщает о решении Пилата и воле толпы, но сам не формулирует богословского толкования этого контраста.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Сохранены резкий контраст двух решений Пилата и выразительность образа заключения; громоздкая последовательность причастных оборотов преобразована в естественное придаточное предложение.
