  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: ru
  text: 'Над Ним была также надпись: «Это Царь Иудейский».[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «табличка», «объявление» или «письменное обвинение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на Нём».'
    reason: lexical_alternative
  - marker: c
