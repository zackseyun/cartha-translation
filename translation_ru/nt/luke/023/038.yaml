    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: надпись
  rationale: В данном контексте слово обозначает помещённый на кресте письменный текст; «надпись» точно и естественно передаёт значение, не уточняя сверх текста, было ли это официальным обвинением.
- source_word: ἐπ’ αὐτῷ
  choice: над Ним
  rationale: В сцене распятия сочетание естественно указывает на расположение надписи относительно Иисуса; русский вариант «над Ним» ясен и идиоматичен.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Это Царь Иудейский
  rationale: Греческая именная конструкция не содержит выраженной связки, а οὗτος несёт указательное ударение. По-русски связка в настоящем времени также естественно опускается.
- source_word: Ἰουδαίων
  choice: Иудейский
  rationale: В устойчивом титуле при распятии традиционная русская формула «Царь Иудейский» точно передаёт этнополитический смысл и звучит естественнее, чем буквальное «Царь иудеев».
- source_word: δὲ καὶ
  choice: также
  rationale: Передаёт добавочный характер сообщаемой детали; связь с предшествующим повествованием сохраняется естественным русским порядком слов.
theological_decisions:
- issue: Характер надписи при распятии
  choice: Передать текст как надпись с титулом «Царь Иудейский», не определяя, является ли он обвинением, насмешкой или исповеданием.
  alternative: Назвать её официальным обвинением либо явно обозначить иронию и политический смысл.
  rationale: Сам стих сообщает о наличии и содержании надписи, но не разъясняет её функцию и богословский смысл; перевод сохраняет эту напряжённость без добавочной интерпретации.
translation_notes:
  register: 'Современный литературный русский язык с сохранением достоинства традиционной формулы «Царь Иудейский». Местоимение, относящееся к Иисусу, написано с прописной буквы по принятой русской библейской издательской норме. Отдельная сноска о варианте «иудеи/жители Иудеи» не добавлена: русское прилагательное «Иудейский» в этом устойчивом титуле передаёт требуемый смысл без существенной неоднозначности.'
