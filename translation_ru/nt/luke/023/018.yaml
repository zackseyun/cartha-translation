  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: ru
  text: 'Но все разом закричали: «Уберите этого человека[a], а нам отпустите Варавву!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Долой этого человека!»'
    reason: Сжатая передача резкого греческого повеления; основной текст яснее выражает требование удалить Иисуса.
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: закричали
  rationale: Глагол передаёт громкий, настойчивый возглас; «закричали» естественно и точно выражает его силу.
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает контраст с предшествующим развитием событий; русское «но» ясно передаёт этот поворот.
- source_word: παμπληθεὶ
  choice: все разом
  rationale: Наречие указывает на совместное выступление всей собравшейся толпы. «Все разом» передаёт коллективность, не усиливая текст до полного единодушия.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание возгласа; в естественном русском повествовании его значение лучше передаётся прямой речью после двоеточия.
- source_word: Αἶρε
  choice: Убери
  rationale: В данном контексте повелительная форма означает требование удалить Иисуса; «убери» сохраняет резкость и направленность требования, не делая подразумеваемую казнь явной.
- source_word: τοῦτον
  choice: Его
  rationale: Местоимение естественно по-русски указывает на Иисуса в непосредственном контексте. Буквальное «этого» звучало бы резче и менее естественно, хотя указательная сила частично ослабляется.
- source_word: ἀπόλυσον
  choice: отпусти
  rationale: Глагол означает освобождение из-под стражи; «отпусти» естественно звучит в судебной сцене и точно передаёт требуемое действие.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж обозначает тех, в чью пользу должен быть освобождён Варавва.
- source_word: τὸν Βαραββᾶν
  choice: Варавву
  rationale: Использована традиционная русская передача имени с требуемым винительным падежом.
theological_decisions:
- issue: Подразумевает ли требование Αἶρε прямой призыв к казни
  choice: Переведено нейтральнее как «Убери Его»
  alternative: «Долой Его!» или явное «Казни Его!»
  rationale: Контекст ведёт к казни, однако сам глагол прежде всего требует удаления. Перевод не делает подразумеваемый результат частью прямого лексического значения.
translation_notes:
  register: Современный литературный русский язык; реплика толпы передана резко и кратко. Заглавная буква в «Его» следует принятому в русском библейском тексте почтительному написанию местоимения, относящегося к Иисусу.
