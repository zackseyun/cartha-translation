  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: ru
  text: Солнце померкло[a], и завеса храма[b] разорвалась посередине[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «солнце перестало светить». Перевод «произошло солнечное затмение» конкретнее, чем требует греческий текст.'
    reason: alternative_reading
  - marker: b
    text: То есть завеса собственно храмового святилища.
    reason: lexical_clarification
  - marker: c
    text: 'Или: «разорвалась надвое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: солнце померкло
  rationale: Генитивный абсолют передан естественным русским предложением. «Померкло» сохраняет широкий смысл ἐκλείπω в данном контексте — свет солнца угас или ослаб, — не утверждая, что произошло астрономическое затмение.
- source_word: ἐσχίσθη
  choice: разорвалась
  rationale: Естественный русский эквивалент пассивной формы σχίζω применительно к ткани; русская возвратная форма не уточняет действующее лицо.
- source_word: δὲ
  choice: и
  rationale: Здесь δέ служит мягкой связкой между событиями и не требует противительного «но».
- source_word: τὸ καταπέτασμα
  choice: завеса
  rationale: «Завеса» — понятное современному читателю и устойчивое обозначение храмового полотнища-разделителя; оно точнее в данном культовом контексте, чем бытовое «занавес».
- source_word: τοῦ ναοῦ
  choice: храма
  rationale: «Храма» естественно передаёт ναός; в данном контексте имеется в виду собственно храмовое святилище, а не весь храмовый комплекс.
- source_word: μέσον
  choice: посередине
  rationale: Прямо сохраняет указание на место или линию разрыва, не делая явно выраженным подразумеваемый результат «надвое».
theological_decisions:
- issue: Значение ἐκλιπόντος применительно к солнцу
  choice: Неспециальное «солнце померкло»
  alternative: «солнце затмилось» или «произошло солнечное затмение»
  rationale: Греческий глагол описывает угасание или исчезновение солнечного света, но сам по себе не требует технического астрономического объяснения. Перевод сохраняет космический знак при смерти Иисуса, не конкретизируя его механизм.
- issue: Передача καταπέτασμα
  choice: «завеса»
  alternative: «занавес»
  rationale: «Завеса» остаётся современным и понятным словом, при этом точно обозначает разделяющее полотнище в храмовом святилище и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный повествовательный стиль. Синтаксис сделан естественным для русского читателя без утраты связи двух событий; астрономический механизм затемнения намеренно не уточняется.
