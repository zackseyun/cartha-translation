lexical_decisions:
- source_word: εἱστήκεισαν
  choice: стояли там
  rationale: Стативная форма прошедшего времени описывает их присутствие на месте в стоячем положении; «стояли там» естественно передаёт сценическую функцию глагола.
- source_word: δὲ
  choice: А
  rationale: Слабый повествовательный союз продолжает рассказ и слегка переводит внимание к обвинителям, не выражая резкого противопоставления.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение представителей высшей священнической знати; множественное число не означает одновременного существования нескольких носителей единственной должности первосвященника.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Прямой и традиционно понятный эквивалент евангельского обозначения знатоков и толкователей Закона.
- source_word: εὐτόνως
  choice: яростно
  rationale: Наречие выражает напряжённость и силу действия; в данном враждебном контексте «яростно» естественно передаёт энергичный характер обвинений.
- source_word: κατηγοροῦντες
  choice: обвиняли
  rationale: Причастие настоящего времени обозначает продолжающееся действие, сопутствующее их присутствию; русская однородная глагольная конструкция звучит естественнее буквального причастного оборота.
- source_word: αὐτοῦ
  choice: Его
  rationale: Родительный объект при κατηγορέω по-русски естественно передаётся прямым дополнением при глаголе «обвинять».
