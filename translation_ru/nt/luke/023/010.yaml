  source_fidelity: Греческое εἱστήκεισαν передаёт, что первосвященники и книжники стояли/находились там; наречия «там» в самом тексте нет. εὐτόνως означает «настойчиво, с большой силой/напором», но не обязательно «яростно», которое вносит оттенок гнева.
  naturalness: «А первосвященники и книжники стояли и настойчиво обвиняли Его» — естественная, литературная и ясная русская фраза. Однородные сказуемые хорошо передают сценическое состояние и продолжающееся действие.
  terminology: «Первосвященники» и «книжники» — уместные устоявшиеся соответствия ἀρχιερεῖς и γραμματεῖς. «Обвиняли Его» идиоматично передаёт κατηγοροῦντες αὐτοῦ. Написание «Его» соответствует заявленной библейской издательской конвенции.
