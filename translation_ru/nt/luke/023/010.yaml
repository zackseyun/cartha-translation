translation_notes:
  register: 'Современный литературный русский язык с достоинством евангельского повествования. Синтаксис сделан естественным для русского: два однородных сказуемых передают состояние и сопутствующее продолжающееся действие. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской традиции.'
