  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: ru
  text: 'А Иисус говорил[a]: «Отец, прости им, ведь они не знают, что делают». А они, деля между собой Его одежду, бросили жребий.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях отсутствуют слова: «Отец, прости им, ведь они не знают, что делают».'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолженное или повторявшееся действие; форма «говорил» сохраняет эту аспектуальную открытость лучше, чем однократное «сказал».
- source_word: Πάτερ
  choice: Отец
  rationale: Звательная форма прямого обращения; перевод не добавляет отсутствующее в греческом притяжательное местоимение «Мой».
- source_word: ἄφες
  choice: прости
  rationale: В молитвенном обращении к Богу о виновных глагол ἀφίημι естественно означает прощение.
- source_word: αὐτοῖς
  choice: им
  rationale: Местоимение не уточняет, к какой именно группе относятся слова Иисуса, поэтому перевод сохраняет неопределённость исходного текста.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: ведь они не знают, что делают
  rationale: «Не знают» прямо передаёт значение οἴδασιν, не усиливая его толковательным «не понимают»; «ведь» естественно выражает поясняющее γάρ.
- source_word: διαμεριζόμενοι
  choice: деля между собой
  rationale: Причастие настоящего времени описывает сопровождающее действие; добавление «между собой» естественно раскрывает распределительный смысл среднего залога в данном контексте.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: Его одежду
  rationale: Русское собирательное единственное число звучит естественно и передаёт несколько предметов одежды без архаичного или неидиоматичного «одежды».
- source_word: ἔβαλον κλήρους
  choice: бросили жребий
  rationale: Это устойчивое современное русское обозначение древнего способа распределения по жребию; аорист передан завершённой формой «бросили».
- source_word: δὲ
  choice: А / А
  rationale: В обоих случаях союз мягко обозначает переход и продолжение повествования; русское «а» сохраняет связь с контекстом без чрезмерно сильного противопоставления.
theological_decisions:
- issue: Текстуальная подлинность слов «Отец, прости им, ведь они не знают, что делают»
  choice: Слова включены в основной текст
  alternative: В некоторых рукописях эти слова отсутствуют
  rationale: SBLGNT печатает высказывание в основном тексте, одновременно отмечая значимое разночтение. Перевод следует данной исходной редакции, а свидетельство рукописей прозрачно отражает в сноске, не разрешая текстологический вопрос конфессионально.
translation_notes:
  register: Современный литературный русский язык с достоинством евангельского повествования. Синтаксис остаётся ясным для широкого читателя; местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
