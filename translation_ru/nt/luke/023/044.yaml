  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: ru
  text: Было уже около шестого часа[a], и по всей земле[b] настала тьма до девятого часа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть было около полудня; девятый час соответствовал примерно трём часам дня.
    reason: cultural_note
  - marker: b
    text: 'Или: «по всей стране». Греческое слово γῆ может означать «земля» или «страна», а также всю Землю.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: уже
  rationale: Передаёт достижение указанного момента в ходе повествования и естественно звучит по-русски.
- source_word: ὡσεὶ
  choice: около
  rationale: Сохраняет приблизительный характер указания времени.
- source_word: ὥρα ἕκτη
  choice: шестого часа
  rationale: Сохраняет древний способ счёта часов и форму исходного текста; современный временной эквивалент пояснён в сноске.
- source_word: σκότος
  choice: тьма
  rationale: Точное, естественное и стилистически достойное соответствие в данном контексте.
- source_word: ἐγένετο
  choice: настала
  rationale: По-русски естественно сочетается со словом «тьма» и передаёт наступление события без лишнего истолкования.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: по всей земле
  rationale: Русское «земля», подобно греческому γῆ, допускает как территориальное, так и более широкое понимание, благодаря чему исходная неоднозначность не устраняется.
- source_word: ἕως ὥρας ἐνάτης
  choice: до девятого часа
  rationale: Сохраняет выражение и систему отсчёта исходного текста в соответствии с «шестым часом».
theological_decisions:
- issue: Масштаб значения γῆ в сообщении о тьме
  choice: по всей земле
  alternative: по всей стране; по всей Земле
  rationale: Греческое γῆ может обозначать землю как область или сушу/мир в более широком смысле. Русская формулировка намеренно сохраняет эту смысловую открытость, не утверждая однозначно ни региональный, ни всемирный масштаб.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Древний способ обозначения времени сохранён в основном тексте и разъяснён в сноске.
