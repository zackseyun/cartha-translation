lexical_decisions:
- source_word: εἱστήκεισαν
  choice: стояли
  rationale: Русский глагол несовершенного вида передаёт продолжительное положение и служит естественным фоном сцены.
- source_word: δὲ
  choice: А
  rationale: Союз мягко обозначает переход и некоторое противопоставление предыдущему эпизоду, не делая контраст чрезмерно резким.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: все, кто знал Его
  rationale: Формулировка понятна современному читателю и сохраняет широкий смысл γνωστοί — людей, знакомых Иисусу или связанных с Ним, не сужая круг до близких друзей.
- source_word: μακρόθεν
  choice: вдали
  rationale: Кратко и естественно передаёт пространственную удалённость наблюдавших.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας
  choice: женщины, следовавшие за Ним из Галилеи
  rationale: Причастный оборот определяет известную по повествованию группу женщин и передаёт их продолжительное следование за Иисусом, начавшееся в Галилее.
- source_word: ὁρῶσαι ταῦτα
  choice: смотрели на всё это
  rationale: Несовершенный вид передаёт продолжающееся наблюдение, а «всё это» сохраняет множественное ταῦτα и охватывает происходившие события.
