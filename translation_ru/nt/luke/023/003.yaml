  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: ru
  text: 'Пилат спросил Его: «Ты Царь Иудейский?» Иисус ответил ему[a]: «Ты говоришь»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И, ответив ему, сказал».'
    reason: Сноска показывает более полную греческую конструкцию, которая ради естественности по-русски передана одним глаголом.
  - marker: b
    text: 'Возможный смысл: «Да, как ты говоришь». Краткий греческий ответ может выражать сдержанное, квалифицированное подтверждение.'
    reason: Сохранение смысловой неоднозначности и альтернативного понимания ответа.
lexical_decisions:
- source_word: δὲ
  choice: нулевая передача / связность через порядок предложений
  rationale: Здесь δέ служит слабой повествовательной связкой; отдельное «тогда» или «же» в современном русском не обязательно и могло бы добавить лишний оттенок.
- source_word: ἠρώτησεν αὐτὸν λέγων
  choice: спросил Его
  rationale: Русское «спросил» естественно вводит прямую речь; буквальное «спросил Его, говоря» было бы тяжеловесным и избыточным.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Царь Иудейский
  rationale: Устойчивое, понятное и контекстуально уместное обозначение предъявленного Иисусу царского притязания; оно сохраняет значение βασιλεύς и традиционную русскую формулу.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Иисус ответил ему
  rationale: Имя «Иисус» естественно проясняет подлежащее, выраженное в греческом артиклем и контекстом; «ответил ему» передаёт и причастие, и адресата без буквального дублирования глаголов речи.
- source_word: Σὺ λέγεις
  choice: Ты говоришь
  rationale: 'Краткая формула сохраняет непрямой и допускающий разные оттенки ответ: Иисус не отрицает титул, но оставляет его в формулировке Пилата.'
theological_decisions:
- issue: Сила ответа Иисуса Σὺ λέγεις
  choice: Сохранена краткая формула «Ты говоришь» как квалифицированное утверждение с намеренной неоднозначностью.
  alternative: «Да, ты верно говоришь» либо «Это говоришь ты».
  rationale: Греческая реплика допускает согласие, но не равна недвусмысленному простому «да»; более развёрнутый перевод разрешил бы риторическое и богословское напряжение за читателя.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Традиционная формула «Царь Иудейский» сохранена как естественная для библейского контекста; прописная буква подчёркивает титульное употребление, не добавляя пояснений к самой реплике.
