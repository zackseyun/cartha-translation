lexical_decisions:
- source_word: ἐπηρώτα
  choice: долго расспрашивал
  rationale: Имперфект передаёт продолжительное или повторяющееся действие; «расспрашивал» естественно выражает настойчивую череду вопросов, а «долго» передаёт протяжённость.
- source_word: δὲ
  choice: — / но
  rationale: Первое δέ оставлено без отдельного соответствия ради естественного начала русской фразы; второе передано союзом «но», подчёркивающим контраст между расспросами Ирода и молчанием Иисуса.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: долго
  rationale: Контекстуальный перевод выражения, буквально связанного со многими или пространными словами; он передаёт длительность словесного расспроса без неестественной кальки.
- source_word: αὐτὸς
  choice: Иисус
  rationale: Повтор имени устраняет возможную для русского местоимения двусмысленность между Иродом и Иисусом и сохраняет выраженный в греческом противопоставительный акцент.
- source_word: οὐδὲν ἀπεκρίνατο αὐτῷ
  choice: ничего ему не ответил
  rationale: Прямая, естественная русская передача отрицательного дополнения, глагола ответа и косвенного объекта.
