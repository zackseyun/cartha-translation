  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: ru
  text: Итак, наказав Его[a], я отпущу Его».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвергнув Его наказанию». Здесь глагол означает карательное воздействие; некоторые понимают его конкретнее как бичевание, однако само греческое слово имеет более широкое значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: наказав
  rationale: Аористное причастие передаёт действие, предшествующее освобождению. В судебном контексте глагол имеет значение наказания; широкий русский эквивалент не уточняет способ наказания сверх сказанного в греческом тексте.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод или переход в речи Пилата естественным современным русским языком.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятому благоговейному библейскому регистру.
- source_word: ἀπολύσω
  choice: я отпущу
  rationale: В контексте суда и содержания под стражей означает освободить, отпустить; «отпущу» звучит естественно в прямой речи.
theological_decisions:
- issue: Объём значения παιδεύω в предложении Пилата
  choice: наказав
  alternative: подвергнув наказанию; высекши
  rationale: Судебная обстановка требует карательного смысла, однако сам глагол не называет конкретный способ наказания. Поэтому перевод не вводит бичевание непосредственно в основной текст.
translation_notes:
  register: Современный литературный русский язык, краткая и достойная прямая речь. Порядок слов сохраняет связь наказания с последующим освобождением; лексика не конкретизирует вид наказания без прямого основания в греческом слове.
