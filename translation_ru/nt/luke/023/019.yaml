  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: ru
  text: который был брошен в тюрьму за некое восстание, произошедшее в городе[a], и за убийство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мятеж». Греческое слово στάσις может означать восстание, мятеж или бунт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: который
  rationale: Относительное местоимение относится к конкретно названному ранее Варавве; «который» естественно продолжает русское предложение.
- source_word: διὰ
  choice: за
  rationale: Предлог с винительным падежом обозначает причину заключения; «за» естественно сочетается как с восстанием, так и с убийством.
- source_word: στάσιν τινὰ
  choice: некое восстание
  rationale: «Восстание» передаёт политико-насильственный характер στάσις, а «некое» сохраняет неопределённость τινά.
- source_word: γενομένην ἐν τῇ πόλει
  choice: произошедшее в городе
  rationale: Причастный оборот прямо передаёт греческое причастие и не уточняет, какой именно город имеется в виду.
- source_word: φόνον
  choice: убийство
  rationale: Слово обозначает преступное лишение жизни, а не нейтральное «умерщвление».
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: был брошен в тюрьму
  rationale: Формулировка сохраняет силу пассивного причастия от βάλλω и естественна в современном русском языке.
