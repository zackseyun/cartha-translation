base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: ru
  text: Вместе с Ним вели на смерть и двух других — преступников[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злодеев», «лиходеев». Греческое слово обозначает людей, совершивших зло; здесь речь идёт об осуждённых преступниках.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы предать смерти», «на казнь». Сам греческий глагол здесь не уточняет способ умерщвления, хотя из контекста ясно, что речь идёт о распятии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: вели
  rationale: Имперфект пассивного залога передаёт продолжавшееся в прошлом действие. Русская неопределённо-личная конструкция «вели» естественно выражает пассивный смысл.
- source_word: δὲ
  choice: и
  rationale: Частица служит мягкой повествовательной связкой; союз «и» естественно продолжает рассказ, не вводя излишнего противопоставления.
- source_word: καὶ
  choice: и
  rationale: Передаёт включение ещё двух людей наряду с Иисусом; в русском эта добавочность выражена конструкцией «и двух других».
- source_word: ἕτεροι
  choice: других
  rationale: Указывает на других людей помимо Иисуса; форма «других» ясна и естественна в сочетании с числительным.
- source_word: κακοῦργοι
  choice: преступников
  rationale: Слово обозначает совершивших тяжкое зло и в данном контексте осуждённых как преступники. Этот вариант современен и точнее по ситуации, чем общее «злодеи».
- source_word: δύο
  choice: двух
  rationale: Числительное передано прямо с требуемым русским падежным оформлением.
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: Предлог σύν с дательным выражает сопровождение и совместность.
- source_word: ἀναιρεθῆναι
  choice: на смерть
  rationale: В контексте движения выражение «вели на смерть» естественно передаёт цель — быть преданными смерти, — не уточняя способ казни сверх значения греческого глагола.
theological_decisions:
- issue: Уточнять ли распятие в переводе ἀναιρεθῆναι
  choice: Сохранить более широкое «на смерть»
  alternative: «на распятие» или «чтобы распять»
  rationale: Контекст далее указывает на распятие, однако сам глагол означает лишение жизни и в этом стихе не называет способ казни.
- issue: Отнесение слова κακοῦργοι
  choice: Показать, что преступниками названы двое других, а не Иисус
  alternative: Пунктуационно неразличимая конструкция, способная отнести обозначение ко всей группе
  rationale: Греческое согласование связывает κακοῦργοι и δύο с ἕτεροι; тире ясно и без догматического расширения передаёт это отношение.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Инверсия «и двух других» сохраняет добавочный смысл καί, а «вели на смерть» остаётся понятным и не вводит в текст способ казни, не названный данным глаголом.
