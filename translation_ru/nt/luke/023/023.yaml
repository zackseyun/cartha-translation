  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: συνεχённое настойчивое давление (ἐπέκειντο), громкость голосов (φωναῖς μεγάλαις), содержание требования о распятии и повтор φωνή во второй части. «Брали верх» удачно передаёт процессуальный характер имперфекта κατίσχυον, не превращая его в однократное решение.'
  naturalness: Фраза понятна и соответствует современному литературному русскому. Сочетание «продолжали настойчиво требовать громкими голосами» несколько плотно по накоплению обстоятельств, но в торжественно-повествовательном контексте звучит приемлемо и сохраняет смысловые компоненты оригинала.
  terminology: «Распят» точно передаёт пассивный инфинитив σταυρωθῆναι. «Требовать» несколько сильнее нейтрального «просить», однако оправдано контекстом коллективного давления и значением ἐπέκειντο; оно не вводит чуждого богословского или исторического толкования. Повтор «голоса» обоснованно сохранён.
