  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: ru
  text: Но они продолжали настойчиво требовать громкими голосами[a], чтобы Он был распят, и их голоса брали верх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «громкими криками»; далее: «и их крики брали верх». В греческом тексте в обеих частях стиха повторено одно и то же слово, которое здесь может означать как «голоса», так и «крики».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: продолжали настойчиво требовать
  rationale: Имперфект передаёт продолжительное, упорное давление; сочетание сохраняет длительность и настойчивость действия.
- source_word: φωναῖς μεγάλαις
  choice: громкими голосами
  rationale: Так передаётся значение образа действия и сохраняется повтор существительного φωνή во второй части стиха.
- source_word: αἰτούμενοι
  choice: требовать
  rationale: Хотя αἰτέω буквально может означать «просить», в данном контексте настойчивого давления естественное русское «требовать» передаёт прагматическую силу, не усиливая её сверх контекста.
- source_word: αὐτὸν σταυρωθῆναι
  choice: чтобы Он был распят
  rationale: Придаточное изъяснительное естественно передаёт конструкцию с винительным падежом и инфинитивом, сохраняя пассивный залог.
- source_word: κατίσχυον
  choice: брали верх
  rationale: 'Имперфект изображает разворачивающийся процесс: голоса собравшихся всё больше одерживали верх.'
- source_word: αἱ φωναὶ αὐτῶν
  choice: их голоса
  rationale: Повтор слова «голоса» воспроизводит повтор φωνή в греческом тексте и подчёркивает силу звучавшего требования.
theological_decisions: []
