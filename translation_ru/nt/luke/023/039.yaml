- from: 'Один из повешенных преступников поносил Его, говоря: «Разве Ты не Мессия? Спаси Себя и нас!»'
  to: 'Один из висевших преступников поносил Его, говоря: «Разве Ты не Мессия[a]? Спаси Себя и нас!»'
  rationale: Заменено «повешенных» на «висевших», чтобы избежать русского значения казни через повешение и сохранить описательное значение греческого причастия. Добавлена сноска к титулу «Мессия» для отражения зафиксированного альтернативного перевода «Христос».
