source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: ru
  text: 'Один из висевших преступников поносил Его, говоря: «Разве Ты не Мессия[a]? Спаси Себя и нас!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греч. ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Один
  rationale: δέ обозначает мягкое развитие или противопоставление в повествовании; по-русски отдельный союз здесь не требуется, поскольку связь ясна из контекста.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: из повешенных преступников
  rationale: κακοῦργοι — «преступники, злодеи»; κρεμασθέντων буквально передаёт состояние повешенных и не вводит более конкретный глагол «распятых», которого в данной фразе нет.
- source_word: ἐβλασφήμει
  choice: поносил
  rationale: В контексте глагол обозначает оскорбительную, хулительную речь против Иисуса. Несовершенный вид русского глагола естественно передаёт длительное действие имперфекта.
- source_word: αὐτόν
  choice: Его
  rationale: Прямое дополнение, относящееся к Иисусу; прописная буква соответствует принятому благоговейному русскому библейскому употреблению.
- source_word: λέγων
  choice: говоря
  rationale: Естественная передача причастия, вводящего прямую речь.
- source_word: Οὐχὶ σὺ εἶ
  choice: Разве Ты не
  rationale: Вопрос с οὐχί предполагает утвердительный ответ и здесь звучит как насмешливый вызов; конструкция «разве… не» сохраняет эту риторическую силу.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: Χριστός употреблено как титул; «Мессия» передаёт его смысл и иудейский контекст ожиданий.
- source_word: σῶσον
  choice: Спаси
  rationale: Императив требует избавления от непосредственной смерти и сохраняет связь с более широким языком спасения.
- source_word: σεαυτὸν καὶ ἡμᾶς
  choice: Себя и нас
  rationale: Прямая и естественная передача обоих дополнений, сохраняющая насмешку и личную заинтересованность преступника.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В насмешливом вопросе слово функционирует как титул, а не как часть имени. «Мессия» яснее передаёт значение титула, не снимая богословского напряжения сцены.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка краткая и доступная; риторическая насмешка сохранена. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
