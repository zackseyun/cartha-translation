    issue: «повешенных преступников»
    rationale: В русском это обычно обозначает казнённых через повешение. Для κρεμασθέντων в данном повествовательном контексте точнее и естественнее «висевших преступников».
  - severity: low
    issue: Отсутствует сноска к «Мессия»
    rationale: Английский аудиторский след фиксирует вариант «Христос» для ὁ χριστός. Сноска должна быть сохранена и привязана к соответствующему слову в русском тексте.
