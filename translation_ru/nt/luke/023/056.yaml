base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: ru
  text: Вернувшись[a], они приготовили ароматические вещества и благовонные масла[b]. А в субботу они отдыхали согласно заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после возвращения». Греческое причастие обозначает действие, предшествовавшее приготовлению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благовонные мази» или «ароматические масла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: вернувшись
  rationale: Аористное причастие женского рода множественного числа относится к женщинам из предыдущего контекста и обозначает действие, предшествующее приготовлению; деепричастие естественно передаёт эту связь по-русски.
- source_word: δὲ
  choice: —
  rationale: Частица обозначает мягкое продолжение повествования; в русском её функцию достаточно передаёт последовательность предложений, поэтому отдельный союз не требуется.
- source_word: ἡτοίμασαν
  choice: приготовили
  rationale: Прямое и естественное обозначение подготовки веществ для последующего погребального помазания.
- source_word: ἀρώματα
  choice: благовония
  rationale: В погребальном контексте слово обозначает ароматические вещества или пряности; «благовония» понятно современному читателю и не сужает значение до пищевых специй.
- source_word: μύρα
  choice: душистые масла
  rationale: Слово обозначает ароматизированное масло или мазь; этот вариант сохраняет отличие от ἀρώματα и соответствует погребальному контексту.
- source_word: τὸ μὲν σάββατον
  choice: А в субботу
  rationale: Временное выражение передано естественно; «а» отражает лёгкий переход и подразумеваемое противопоставление дальнейшим событиям после субботы, не перегружая частицу μέν.
- source_word: ἡσύχασαν
  choice: пребывали в покое
  rationale: В контексте субботы глагол означает прекращение деятельности и покой; формулировка сохраняет этот смысл без сведения его к обычному отдыху.
- source_word: κατὰ τὴν ἐντολήν
  choice: согласно заповеди
  rationale: Сохраняет единственное число и значение соответствия предписанию, не добавляя в основной текст пояснений.
theological_decisions:
- issue: К какой заповеди относится выражение «согласно заповеди»
  choice: Оставить обобщённое «согласно заповеди»
  alternative: Развернуть как «согласно заповеди о субботе»
  rationale: Контекст указывает на заповедь Торы о субботнем покое, однако греческий текст не содержит поясняющего дополнения; краткая форма сохраняет формулировку и не вносит толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной повествовательной интонацией. «Пребывали в покое» звучит достойно и передаёт соблюдение субботнего покоя, а «душистые масла» остаётся понятным без архаического «масти».
