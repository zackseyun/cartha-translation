  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: ru
  text: И все толпы, собравшиеся на это зрелище[a], увидев, что произошло, возвращались, бия себя в грудь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посмотреть на это».'
    reason: lexical_alternative
  - marker: b
    text: Так выражали скорбь, горе или потрясение.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: собравшиеся
  rationale: Естественно передаёт людей, совместно пришедших к месту событий, не перегружая перевод буквальной передачей приставки σύν-.
- source_word: ὄχλοι
  choice: толпы
  rationale: Сохраняет множественное число греческого текста и звучит естественно в современном русском языке.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: на это зрелище
  rationale: Передаёт значение публично наблюдаемого события; более нейтральный вариант отмечен в сноске.
- source_word: θεωρήσαντες
  choice: увидев
  rationale: Деепричастие естественно выражает действие, предшествующее возвращению.
- source_word: τὰ γενόμενα
  choice: что произошло
  rationale: Ясно и идиоматично передаёт субстантивированное выражение со значением совершившихся событий.
- source_word: τύπτοντες τὰ στήθη
  choice: бия себя в грудь
  rationale: Сохраняет конкретный физический жест плача или потрясения, не приписывая толпе прямо не названного внутреннего состояния.
- source_word: ὑπέστρεφον
  choice: возвращались
  rationale: Несовершенный вид передаёт длительный или последовательный характер действия, соответствующий греческому имперфекту.
theological_decisions:
- issue: Эмоциональный и духовный смысл реакции толпы
  choice: Оставить жест без однозначного толкования как покаяния
  alternative: Передать, что люди каялись либо выражали только скорбь или ужас
  rationale: Греческий текст описывает физическое действие, но прямо не определяет внутреннее духовное состояние людей.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Оборот «бия себя в грудь» выбран как понятный и устойчивый, хотя слегка книжный; он хорошо соответствует торжественной сцене и сохраняет телесную конкретность оригинала.
