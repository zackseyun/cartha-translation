source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: ru
  text: И вдобавок ко всему этому[a], между нами и вами утверждена великая пропасть, так что желающие перейти отсюда к вам не могут, и оттуда к нам никто перейти не может.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И при всём этом». Греческий оборот допускает более буквальное понимание, хотя в контексте, вероятно, вводит дополнительное обстоятельство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: вдобавок ко всему этому
  rationale: В контексте оборот вводит ещё одно обстоятельство. Такой перевод естественен по-русски и сохраняет его добавочное значение.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: между нами и вами
  rationale: Прямо передаёт пространственно-относительное значение и множественное число местоимения ὑμῶν.
- source_word: χάσμα μέγα
  choice: великая пропасть
  rationale: «Пропасть» ясно передаёт широкое непреодолимое разделение, а «великая» сохраняет простую и возвышенную характеристику μέγα.
- source_word: ἐστήρικται
  choice: утверждена
  rationale: Перфект пассива указывает на установленное и сохраняющееся положение; «утверждена» передаёт устойчивость разделения без уточнения того, кем оно установлено.
- source_word: ὅπως
  choice: так что
  rationale: Естественно сохраняет возможный оттенок цели или результата, не принуждая контекст только к одному из них.
- source_word: οἱ θέλοντες
  choice: желающие
  rationale: Субстантивированное причастие передано кратко и естественно как обозначение тех, кто хочет перейти.
- source_word: διαβῆναι
  choice: перейти
  rationale: Обычный русский глагол точно выражает движение с одной стороны на другую.
- source_word: ἔνθεν πρὸς ὑμᾶς
  choice: отсюда к вам
  rationale: Сохраняет точку зрения говорящего и направление движения.
- source_word: μὴ δύνωνται
  choice: не могут
  rationale: Передаёт именно невозможность, а не запрет.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: и оттуда к нам никто перейти не может
  rationale: По-русски явно выраженный отрицательный субъект естественно восполняет подразумеваемых людей и сохраняет параллельную невозможность перехода в обратную сторону.
theological_decisions:
- issue: Характер разделения между двумя сторонами в притче
  choice: Передать разделение как установленное и непреодолимое, не превращая образ в более широкое догматическое утверждение.
  alternative: Истолковать пропасть как буквальную деталь устройства загробного мира либо ослабить её до чисто образного, потенциально преодолимого разделения.
  rationale: Сам стих подчёркивает устойчивость пропасти и невозможность перехода в обе стороны, но не объясняет далее природу этого образа.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. «Великая пропасть» сохраняет библейскую весомость без архаизации; синтаксис остаётся ясным для широкого круга читателей.
