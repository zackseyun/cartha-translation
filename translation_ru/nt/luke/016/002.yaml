  verdict: approve
  source_fidelity: Русский текст точно передаёт последовательность действий (φωνήσας... εἶπεν), риторический вопрос, требование предъявить отчёт и основание в виде невозможности далее исполнять управленческую функцию. «Представь отчёт о своём управлении» адекватно отражает ἀπόδος τὸν λόγον τῆς οἰκονομίας σου. Формулировка «больше не можешь управлять» сохраняет выраженную в греческом δύνῃ ἔτι οἰκονομεῖν невозможность, не превращая её в чрезмерно явное утверждение об увольнении.
  naturalness: Фраза звучит естественно на современном литературном русском. «Вызвал его», «Что это я слышу о тебе?» и «Представь отчёт» уместны в административно-повествовательном регистре. Повтор «управлении / управлять» оправдан когнатной связью οἰκονομία / οἰκονομεῖν и не создаёт стилистической тяжести.
  terminology: «Управление» и «управлять» последовательно передают терминологическое поле οἰκονομία / οἰκονομεῖν без архаизации и без конфессионально окрашенного толкования. Сноски корректно обозначают допустимые альтернативы «служба управляющего» и «оставаться управляющим». Якоря [a] и [b] стоят при соответствующих элементах текста.
