source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: ru
  text: 'Он вызвал его и сказал ему: «Что это я слышу о тебе? Представь отчёт о своём управлении[a], потому что ты больше не можешь управлять[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отчёт о своей службе управляющего».'
    reason: Лексема οἰκονομία может обозначать как само управление, так и обязанности или должность управляющего.
  - marker: b
    text: 'Или: «больше не можешь оставаться управляющим».'
    reason: Глагол οἰκονομεῖν может быть передан как выполнение обязанностей управляющего; этот вариант яснее выражает подразумеваемое отстранение от должности.
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: вызвал его
  rationale: Аористное причастие обозначает действие, предшествующее словам хозяина. «Вызвал его» естественно передаёт распоряжение явиться, не добавляя отсутствующих в тексте подробностей.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Что это я слышу о тебе?
  rationale: Сохранены риторическая форма вопроса и намеренно неопределённое τοῦτο; более конкретное «что за донесение» было бы истолкованием.
- source_word: ἀπόδος τὸν λόγον
  choice: представь отчёт
  rationale: В административном контексте λόγος означает отчёт или расчёт, а ἀπόδος — требование его предоставить. «Представь отчёт» естественно для современного русского языка.
- source_word: τῆς οἰκονομίας σου
  choice: о своём управлении
  rationale: οἰκονομία обозначает вверенное управление хозяйством или имуществом. Выбор сохраняет функциональный смысл без архаичного «домоправительство» и без добавления конкретного объекта управления.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: потому что ты больше не можешь управлять
  rationale: Переданы отрицание, ἔτι в значении «больше не» и глагольный смысл οἰκονομεῖν. Формулировка сохраняет некоторую неоднозначность между фактической невозможностью и лишением полномочий, которую проясняет контекст.
