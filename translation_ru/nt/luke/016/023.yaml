base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: ru
  text: И в Аиде[a], находясь в мучениях, он поднимает глаза и видит вдали Авраама и Лазаря на лоне Авраама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в царстве мёртвых». Здесь стоит греческое слово «Аид» (ᾅδης), а не «геенна», обозначающая окончательное место суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в его груди»; традиционно: «на лоне Авраама». Этот образ выражает особую близость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: в аде
  rationale: Сохраняет отдельный греческий термин ᾅδης; примечание поясняет его отличие от геенны и не отождествляет безоговорочно с окончательным местом суда.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: поднимает глаза
  rationale: Естественно передаёт образное греческое выражение и согласуется с ярким настоящим временем основного глагола.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: находясь в мучениях
  rationale: Передаёт обстоятельственный причастный оборот и множественное βασάνοις без ослабления тяжести страдания.
- source_word: ὁρᾷ
  choice: видит
  rationale: Сохранено настоящее время греческого повествования, придающее сцене наглядность.
- source_word: ἀπὸ μακρόθεν
  choice: вдали
  rationale: Краткое и естественное современное выражение, подчёркивающее пространственную разобщённость.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: у него на груди
  rationale: Передаёт образ тесной близости современным русским языком; традиционное «на лоне Авраама» сохранено в примечании.
theological_decisions:
- issue: Значение ᾅδης в связи с промежуточным состоянием и окончательным судом
  choice: ад с поясняющим примечанием
  alternative: царство мёртвых; преисподняя
  rationale: Основной текст сохраняет привычный русский библейский термин, а примечание удерживает лексическое отличие ᾅδης от геенны и не разрешает более широкий богословский вопрос за пределами стиха.
- issue: Образ κόλπος, традиционно называемый «лоном Авраама»
  choice: у него на груди
  alternative: на лоне Авраама; рядом с Авраамом
  rationale: Выбран современный и конкретный образ близости без архаизации; традиционная формула приведена в примечании, а простое «рядом» сочтено недостаточно выразительным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранено яркое настоящее время греческого повествования. Местоимение «у него» естественно относится к Аврааму; примечание устраняет возможную неясность и сохраняет традиционный оборот.
