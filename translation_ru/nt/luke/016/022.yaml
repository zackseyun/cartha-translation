id: LUK.16.22
reference: Luke 16:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: ru
  text: Случилось, что бедняк умер, и ангелы отнесли его на лоно Авраама[a]. Богач тоже умер, и его похоронили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «рядом с Авраамом». Буквально: «на лоно Авраама» — образ близости, почёта и общения.'
    reason: Лексическая альтернатива поясняет непривычный современному читателю образ, не устраняя его из основного текста.
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: Случилось, что … умер
  rationale: Луканская повествовательная конструкция ἐγένετο + инфинитив передана естественной русской формулой, без добавления явного временного наречия.
- source_word: τὸν πτωχὸν
  choice: бедняк
  rationale: πτωχός обозначает бедного, неимущего человека. «Бедняк» кратко и естественно; «нищий» могло бы сильнее подчеркнуть попрошайничество, прямо не выраженное этим словом в данном стихе.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: ангелы отнесли его
  rationale: Русская активная конструкция естественно передаёт греческий пассив и прямо сохраняет названных в тексте исполнителей действия — ангелов.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: на лоно Авраама
  rationale: Сохранён буквальный и традиционно узнаваемый образ κόλπος, не сведённый в основном тексте к его толкованию. Более прозрачный смысл указан в сноске.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Богач тоже умер
  rationale: «Тоже» естественно передаёт καί и подчёркивает общую для обоих людей участь — смерть.
- source_word: ἐτάφη
  choice: его похоронили
  rationale: Неопределённо-личная русская конструкция естественно соответствует греческому страдательному залогу и сохраняет краткость высказывания.
theological_decisions:
- issue: Значение выражения εἰς τὸν κόλπον Ἀβραάμ
  choice: на лоно Авраама
  alternative: рядом с Авраамом
  rationale: Буквальный образ сохраняет присущие выражению оттенки близости, почёта и общения и не превращает его без пояснения в обобщённое обозначение посмертного состояния.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Традиционный образ «лоно Авраама» сохранён, а его смысл пояснён в сноске; остальной синтаксис сделан простым и естественным.
