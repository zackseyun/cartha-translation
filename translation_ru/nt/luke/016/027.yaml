  source_fidelity: «Тогда он сказал» естественно передаёт повествовательное δέ. «Прошу тебя» точно передаёт Ἐρωτῶ, а «пошли его» корректно выражает содержание просьбы при ἵνα с сослагательным наклонением. Однако οὖν («итак/же», вывод из предшествующего) в нынешнем тексте не имеет явного соответствия; «тогда» уже занято как передача δέ и не восполняет этот оттенок.
