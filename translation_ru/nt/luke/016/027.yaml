  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: ru
  text: 'Тогда он сказал: «Прошу же тебя, отец, пошли его в дом моего отца,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Тогда он сказал
  rationale: δέ — мягкая повествовательная связка, продолжающая диалог; «тогда» естественно передаёт переход к следующей реплике.
- source_word: Ἐρωτῶ σε οὖν
  choice: Прошу тебя
  rationale: ἐρωτάω здесь выражает просьбу, а οὖν связывает её с предшествующим отказом. По-русски «прошу тебя» естественно передаёт и речевой акт, и его настойчивость; отдельное «итак» или «тогда» рядом с уже употреблённым повествовательным «тогда» было бы тяжеловесным.
- source_word: πάτερ
  choice: отец
  rationale: Обращение к Аврааму как к праотцу, а не титул Бога; строчная буква не создаёт лишнего богословского отождествления.
- source_word: ἵνα πέμψῃς αὐτόν
  choice: пошли его
  rationale: После глагола просьбы конструкция ἵνα с сослагательным наклонением передаёт содержание просьбы. Русский императив после «прошу тебя» звучит естественно и точно.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: в дом моего отца
  rationale: οἶκος означает дом или домашнее хозяйство; здесь речь о месте назначения, поэтому «в дом моего отца» точно и идиоматично.
theological_decisions:
- issue: Значение обращения πάτερ
  choice: отец
  alternative: Отец
  rationale: В притче богач обращается к Аврааму как к праотцу. Написание со строчной буквы сохраняет это значение и не представляет обращение как прямое обращение к Богу.
translation_notes:
  register: 'Современный литературный русский язык, сдержанный и ясный. Сохранена незавершённость синтаксической конструкции стиха: заключительная запятая указывает, что просьба продолжается в следующем стихе.'
