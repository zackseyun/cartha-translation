  terminology: «Отец» со строчной буквы верно сохраняет обращение к Аврааму, а не вводит божественный титул. «Дом моего отца» точно передаёт εἰς τὸν οἶκον τοῦ πατρός μου. Имена и специальные богословские термины в данном стихе отсутствуют.
