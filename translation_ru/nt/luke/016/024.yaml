base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: ru
  text: 'И он громко позвал: «Отец Авраам, сжалься надо мной и пошли Лазаря, чтобы он окунул кончик своего пальца в воду и охладил мой язык, потому что я мучаюсь в этом пламени».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что я испытываю муки в этом пламени». Греческий глагол обозначает сильную боль или тяжёлое страдание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: громко позвал
  rationale: Причастие от φωνέω передаёт громкий, настойчивый призыв; естественное русское выражение сохраняет интенсивность без излишнего усиления.
- source_word: ἐλέησόν με
  choice: сжалься надо мной
  rationale: Передаёт просьбу о милости и сострадании в естественной современной русской форме.
- source_word: πέμψον
  choice: пошли
  rationale: Прямое соответствие повелительной форме со значением отправить кого-либо.
- source_word: βάψῃ
  choice: окунул
  rationale: βάπτω обозначает краткое погружение; «окунул» точно подходит к образу кончика пальца.
- source_word: τὸ ἄκρον τοῦ δακτύλου αὐτοῦ
  choice: кончик пальца
  rationale: Точно и естественно передаёт обозначение крайней части пальца; притяжательность ясна из русского контекста.
- source_word: ὕδατος
  choice: в воду
  rationale: При глаголе «окунуть» родительный падеж греческого естественно передаётся русской конструкцией с «в».
- source_word: καταψύξῃ
  choice: охладил
  rationale: Сохраняет конкретный физический образ охлаждения, не заменяя его более общим «освежил».
- source_word: γλῶσσάν μου
  choice: мой язык
  rationale: Прямое и контекстуально ясное обозначение части тела.
- source_word: ὀδυνῶμαι
  choice: мучаюсь
  rationale: Передаёт сильную боль и страдание; в современном русском звучит естественно и не предполагает явно внешнего мучителя.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: в этом пламени
  rationale: φλόξ означает именно пламя; сохранён яркий образ и указательное местоимение.
- source_word: Πάτερ Ἀβραάμ
  choice: Отец Авраам
  rationale: Сохраняет прямое обращение и апелляцию к Аврааму как праотцу.
theological_decisions:
- issue: Характер страдания богача
  choice: потому что я мучаюсь в этом пламени
  alternative: потому что я испытываю муки в этом пламени
  rationale: «Мучаюсь» достаточно сильно передаёт ὀδυνῶμαι, но не уточняет причину или действующего мучителя и тем самым не вносит дополнительного доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Громко позвал» передаёт настойчивость φωνήσας без архаичного «возопил»; синтаксис остаётся ясным для обычного читателя.
