base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: ru
  text: 'Но Авраам сказал: «У них есть Моисей и Пророки[a]; пусть они их слушают[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Моисей и Пророки» — традиционное обозначение свидетельства Писания, связанного с Моисеем и пророческими книгами.
    reason: cross_reference
  - marker: b
    text: 'Или: «пусть они их услышат».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Но Авраам сказал
  rationale: Историческое настоящее передано естественным для русского повествования прошедшим временем. Союз δέ здесь отмечает переход к возражению, поэтому выбран умеренно противительный союз «но».
- source_word: Ἔχουσι
  choice: У них есть
  rationale: Простая и естественная передача настоящего времени со значением имеющегося у братьев доступа к свидетельству.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Моисей и Пророки
  rationale: Сохранена краткая иудейская формула, в которой Моисей и пророки метонимически обозначают соответствующее свидетельство Писания; слово «Пророки» написано с прописной буквы как обозначение корпуса священных книг.
- source_word: ἀκουσάτωσαν
  choice: пусть они их слушают
  rationale: Форма третьего лица повелительного наклонения передана конструкцией «пусть…». Глагол «слушают» выражает не только восприятие на слух, но и внимательное принятие свидетельства.
- source_word: αὐτῶν
  choice: их
  rationale: Местоимение отсылает к Моисею и Пророкам, то есть к их свидетельству; русский оборот сохраняет образ исходного текста без поясняющего развертывания.
theological_decisions:
- issue: Кого или что обозначает выражение «Моисей и Пророки»
  choice: В основном тексте сохранена буквальная традиционная формула, подразумевающая доступное братьям свидетельство Писания.
  alternative: Развернуть как «Закон Моисея и книги Пророков» либо понимать только как указание на исторических лиц.
  rationale: В иудейском и лукановском употреблении эта формула обычно обозначает Писания, однако развернутая передача внесла бы в основной текст слова, отсутствующие в греческом оригинале.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным повествовательным строем. Сохранены библейская формула и местоименная отсылка исходного текста; пояснение вынесено в сноску.
