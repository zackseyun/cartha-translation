source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: ru
  text: И господин[a] похвалил неправедного управляющего за то, что тот поступил предусмотрительно. Ведь сыны этого века[b] в своём поколении предусмотрительнее сынов света.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь похвалил неправедного управляющего». Здесь предпочтено слово «господин», поскольку в контексте κύριος естественнее всего обозначает хозяина из притчи.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сыны этого века» и «сыны света». Эти выражения противопоставляют людей, принадлежащих нынешнему веку, тем, кто принадлежит свету.'
    reason: lexical_alternative
  - marker: c
    text: 'Более буквально: «предусмотрительнее сынов света по отношению к своему поколению». Греческое выражение трудно для однозначного толкования; «в своём поколении» сохраняет его краткость и не уточняет, в чём именно проявляется эта предусмотрительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: господин
  rationale: В ближайшем контексте это естественнее всего хозяин из притчи. «Господин» сохраняет социальную роль персонажа; возможное прочтение «Господь» отмечено в сноске.
- source_word: οἰκονόμον
  choice: управляющий
  rationale: Современное и понятное обозначение человека, которому поручено управление хозяйством; оно точнее передаёт функцию, чем устаревающее «домоправитель».
- source_word: τῆς ἀδικίας
  choice: неправедного
  rationale: Родительный падеж характеризует управляющего с нравственной стороны. «Неправедный» сохраняет широту ἀδικία и не сводит её только к нечестности в конкретной сделке.
- source_word: φρονίμως / φρονιμώτεροι
  choice: предусмотрительно / предусмотрительнее
  rationale: Слова обозначают практическую рассудительность и умение позаботиться о результате. «Предусмотрительно» передаёт похвалу расчётливости поступка, не превращая её в безусловно нравственную «мудрость», и сохраняет лексическую связь между двумя частями стиха.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: сыны этого века
  rationale: Сохранён библейский образ принадлежности к нынешнему веку и формальный параллелизм с «сынами света».
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: сыны света
  rationale: Сохранено исходное метафорическое обозначение людей, принадлежащих свету, а также параллель с «сынами этого века».
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: в отношениях с людьми своего поколения
  rationale: Трудное греческое выражение допускает несколько оттенков. Основной текст естественно передаёт сферу, в которой сыны этого века проявляют предусмотрительность, а более буквальная форма приведена в сноске.
theological_decisions:
- issue: Кого обозначает ὁ κύριος в первой части стиха
  choice: господин, то есть хозяин внутри притчи
  alternative: Господь, то есть Иисус или Бог
  rationale: Непосредственный повествовательный контекст указывает на хозяина управляющего. Сноска сохраняет иную грамматически возможную отсылку, не устраняя неоднозначность полностью.
- issue: Нравственная оценка поступка управляющего
  choice: похвала его предусмотрительности, но не его неправедности
  alternative: одобрение поступка как нравственно мудрого либо одобрение самого обмана
  rationale: Текст одновременно называет управляющего неправедным и отмечает, что он поступил φρονίμως. Выбор «предусмотрительно» сохраняет это напряжение и не приписывает похвале нравственного одобрения неправедности.
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской образностью. «Управляющий» выбран вместо архаичного «домоправитель», тогда как пара «сыны этого века — сыны света» сохранена ради значимого параллелизма. Формулировка не снимает напряжения между неправедностью персонажа и похвалой его практической предусмотрительности.
