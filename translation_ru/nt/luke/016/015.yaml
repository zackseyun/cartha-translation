  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: ru
  text: 'И Он сказал им: «Вы — те, кто оправдывает себя перед людьми, но Бог знает ваши сердца. Ведь то, что высоко в глазах людей[a], — мерзость перед Богом[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что высоко ценится среди людей»; буквально: «то, что возвышенно среди людей».'
    reason: Передаёт возможное значение общественного признания, сохраняя в основном тексте более широкую метафору высоты в ὑψηλόν.
  - marker: b
    text: 'Или: «нечто отвратительное в глазах Бога».'
    reason: Даёт естественный описательный вариант для βδέλυγμα, сохраняя силу отрицательной Божьей оценки.
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτούς
  choice: сами оправдываете себя
  rationale: 'Сохраняет смысл глагола δικαιόω и возвратного местоимения: адресаты представляют себя правыми или праведными перед окружающими. Частица «сами» передаёт эмфатическое Ὑμεῖς и подчёркивает самооправдание, не сужая выражение до внешней видимости.'
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: перед людьми
  rationale: Естественно передаёт пространственно-оценочное «перед, в глазах»; слово ἄνθρωποι здесь обозначает людей вообще, что прямо выражается русским «людьми».
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: знает ваши сердца
  rationale: Сохраняет библейский образ сердца как внутреннего мира, включая намерения и мысли, без поясняющего расширения в основном тексте.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: то, что высоко ценится среди людей
  rationale: В данном контексте ὑψηλόν обозначает то, что пользуется высоким общественным признанием. Формулировка естественна по-русски; буквальный образ высоты сохранён в примечании.
- source_word: βδέλυγμα
  choice: мерзость
  rationale: Сильное существительное, соответствующее предметному значению βδέλυγμα — нечто отвратительное и неприемлемое для Бога; сохраняет резкость высказывания.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Сохраняет параллель с «перед людьми» и подчёркивает противопоставление человеческой и Божьей оценки.
theological_decisions:
- issue: Значение δικαιοῦντες ἑαυτούς
  choice: сами оправдываете себя
  alternative: выставляете себя праведными
  rationale: «Оправдываете себя» сохраняет юридико-нравственную многозначность δικαιόω и не сводит обвинение только к созданию внешнего впечатления.
- issue: Смысл τὸ ἐν ἀνθρώποις ὑψηλόν
  choice: то, что высоко ценится среди людей
  alternative: то, что возвышено среди людей
  rationale: Греческая фраза допускает оттенки общественного возвышения, почёта и высокой оценки. Основной вариант понятен современному читателю, а примечание сохраняет более буквальную метафору.
- issue: Сила βδέλυγμα
  choice: мерзость перед Богом
  alternative: отвратительно в глазах Бога
  rationale: «Мерзость» сохраняет сильную богословскую и нравственную оценку исходного существительного, не уточняя природу отвращения сверх текста.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Параллель «перед людьми — перед Богом» сохранена; синтаксис обвинения сделан прямым и естественным.
