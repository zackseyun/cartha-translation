  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: ru
  text: 'Он ответил: «Сто батов[a] оливкового масла». Управляющий сказал ему: «Возьми свою долговую расписку[b], скорее садись и напиши: пятьдесят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Бат — древняя мера жидкостей. В греческом тексте буквально: «сто батов оливкового масла».'
    reason: cultural_note
  - marker: b
    text: 'Или: «свои долговые документы». Буквально: «свои письмена»; здесь имеется в виду письменное долговое обязательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: батов
  rationale: Сохранено название конкретной древней меры жидкостей; значение поясняется в сноске.
- source_word: ἐλαίου
  choice: оливкового масла
  rationale: В данном хозяйственном контексте ἔλαιον обозначает оливковое масло; уточнение естественно и понятно современному читателю.
- source_word: Δέξαι
  choice: Возьми
  rationale: Императив обозначает взятие документа в руки; «возьми» естественно передаёт требуемое действие.
- source_word: τὰ γράμματα
  choice: свою долговую расписку
  rationale: Буквально это «письмена/документы», но в контексте речь идёт о письменном долговом обязательстве. Единственное число соответствует естественному русскому словоупотреблению, а исходная широта отмечена в сноске.
- source_word: καθίσας ταχέως
  choice: скорее садись
  rationale: Причастие передаёт сопутствующее действие перед повелением γράψον, а ταχέως — требование сделать это быстро. Такая конструкция естественна по-русски.
- source_word: γράψον πεντήκοντα
  choice: 'напиши: пятьдесят'
  rationale: Сохраняется прямое распоряжение вписать новую сумму без добавления отсутствующего в греческом тексте объекта.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной речью. Термин «бат» сохраняет конкретную древнюю единицу измерения, а «долговая расписка» естественно раскрывает функцию документа, не устраняя буквальную альтернативу из сноски.
