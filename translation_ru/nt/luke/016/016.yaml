  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: ru
  text: Закон и Пророки — до Иоанна; с тех пор Царство Божье возвещается как благая весть, и каждый с силой прорывается в него.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый настойчиво входит в него». Греческий глагол может обозначать движение с силой или напором; основной текст подчёркивает напряжённость вхождения в Царство.'
    reason: lexical_alternative
  - marker: b
    text: Некоторые понимают последнюю часть более отрицательно, учитывая похожее изречение в Матфея 11:12. Однако здесь подлежащее греческого глагола — «каждый», а не «Царство».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: Закон и Пророки
  rationale: Устойчивое обозначение двух частей Писания; прописные буквы показывают, что речь идёт не о законе вообще и не только об отдельных пророках.
- source_word: μέχρι Ἰωάννου
  choice: до Иоанна
  rationale: Кратко и естественно передаёт временную границу; из контекста подразумевается Иоанн Креститель.
- source_word: ἀπὸ τότε
  choice: с тех пор
  rationale: Естественно передаёт временной переход и продолжающееся положение дел.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Традиционное и понятное выражение, сохраняющее смысловой диапазон βασιλεία — царство и царствование.
- source_word: εὐαγγελίζεται
  choice: возвещается как Благая Весть
  rationale: Передаёт настоящее пассивное значение и явно сохраняет семантику благой вести, присущую глаголу εὐαγγελίζω.
- source_word: πᾶς
  choice: каждый
  rationale: Отражает обобщённое единственное число с распределительным значением.
- source_word: εἰς αὐτὴν
  choice: в него
  rationale: Местоимение относится к Царству и естественно передаёт направленность движения внутрь.
- source_word: βιάζεται
  choice: с силой прорывается
  rationale: Средне-пассивная форма допускает разные толкования; при подлежащем πᾶς и дополнении εἰς αὐτὴν эта формулировка передаёт напряжённое, энергичное вхождение, не превращая его в спокойное движение.
theological_decisions:
- issue: Значение βιάζεται по отношению к Царству
  choice: Люди с усилием и напором входят в Царство.
  alternative: Заключительную фразу можно понимать отрицательно, как указание на насильственное отношение к Царству.
  rationale: В данном предложении грамматическое подлежащее — πᾶς («каждый»), а εἰς αὐτὴν естественно указывает на движение в Царство. При этом сноска сохраняет существенную неоднозначность глагола и связь с похожим изречением в Мф. 11:12.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Именное предложение «Закон и Пророки — до Иоанна» сохраняет лаконичность греческого текста. «Благая Весть» прозрачно передаёт евангельскую семантику глагола, а «с силой прорывается» сохраняет трудную и напряжённую образность βιάζεται; альтернативы вынесены в сноски.
