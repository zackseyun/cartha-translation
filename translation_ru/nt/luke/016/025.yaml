  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: ru
  text: 'Но Авраам сказал: «Сын мой, вспомни: при жизни ты получил[a] свои блага, а Лазарь — беды. Теперь же он здесь утешается, а ты мучаешься[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получил сполна». Греческий глагол может подразумевать получение положенного или получение в полной мере.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «терзаешься», «испытываешь сильную боль». Греческое слово может обозначать как острую боль, так и глубокое страдание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Сын мой
  rationale: Ласковое или участливое обращение к мужчине, выражающее близость и одновременно старшинство говорящего; оно не обязательно указывает на буквальное сыновство. В современном русском «сын мой» естественнее, чем буквальное «дитя».
- source_word: μνήσθητι
  choice: вспомни
  rationale: Прямо и естественно передаёт повеление обратиться к памяти.
- source_word: ἀπέλαβες
  choice: получил
  rationale: Глагол обозначает получение и может подразумевать получение своей доли или получение сполна; нейтральный основной вариант сохраняет более широкий смысл, а усиленный оттенок отмечен в сноске.
- source_word: τὰ ἀγαθά σου
  choice: свои блага
  rationale: Передаёт субстантивированное множественное число со значением благоприятных и приятных вещей, не вводя более узкого богословского понятия «благословения».
- source_word: ἐν τῇ ζωῇ σου
  choice: при жизни
  rationale: Естественное русское временное выражение, ясно указывающее на земную жизнь богача.
- source_word: ὁμοίως τὰ κακά
  choice: а Лазарь — беды
  rationale: Эллиптическая конструкция сохраняет параллель и контраст; «беды» обозначают пережитые несчастья, а не совершённое нравственное зло.
- source_word: παρακαλεῖται
  choice: утешается
  rationale: В данном контексте пассивная форма означает, что Лазарь получает утешение; русская возвратная форма естественно передаёт это состояние.
- source_word: ὧδε
  choice: здесь
  rationale: Кратко и точно передаёт указание на место в изображаемой сцене.
- source_word: ὀδυνᾶσαι
  choice: мучаешься
  rationale: Передаёт сильную боль и страдание, не уточняя без необходимости, причиняются ли мучения внешней силой.
theological_decisions:
- issue: Характер посмертного страдания
  choice: а ты мучаешься
  alternative: а ты испытываешь сильную боль / а ты терзаешься
  rationale: Перевод сохраняет изображённое в стихе сознательное страдание, но не добавляет утверждения о его причине или способе причинения.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным повествовательным тоном. Эллипсис «Лазарь — беды» сохраняет лаконичный параллелизм оригинала; «Сын мой» передаёт участливое обращение без утверждения о буквальном родстве.
