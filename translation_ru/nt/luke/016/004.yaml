  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: ru
  text: Я знаю, что мне сделать, чтобы, когда меня отстранят от управления, они приняли меня в свои дома.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Знаю
  rationale: 'Аорист γινώσκω здесь передаёт достигнутое решение или внезапное осознание; русское настоящее «знаю» естественно выражает: «теперь я понял, как поступить».'
- source_word: τί ποιήσω
  choice: что сделаю
  rationale: Делиберативный конъюнктив выражает намечаемое действие; в контексте управляющий уже пришёл к решению, поэтому будущее «сделаю» уместнее нейтрального «что делать».
- source_word: ἵνα ὅταν
  choice: чтобы, когда
  rationale: Сочетание сохраняет и цель замысла, и ожидаемое будущее обстоятельство.
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: меня отстранят от управления
  rationale: Пассив μεθίστημι означает удаление с должности, а οἰκονομία — порученное управление домом или имуществом. Формулировка естественна по-русски и не привносит богословского оттенка слова «домостроительство».
- source_word: δέξωνταί με
  choice: они приняли меня
  rationale: δέχομαι здесь относится к оказанию гостеприимства и предоставлению приюта; «приняли меня» сохраняет смысл без усиления эмоционального оттенка до «радушно встретили».
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: в свои дома
  rationale: «Дома» естественно передаёт контекст гостеприимства, а возвратное ἑαυτῶν выражено русским «свои».
theological_decisions: []
