lexical_decisions:
- source_word: πτωχὸς
  choice: нищий
  rationale: В данном контексте слово обозначает крайне бедного, зависимого от чужой помощи человека. Русское «нищий» естественно передаёт тяжесть его положения, не обязательно утверждая, что он профессионально просил милостыню.
- source_word: τις
  choice: не выражено отдельно
  rationale: Неопределённость нового участника естественно передаётся русской конструкцией «нищий по имени…»; добавление «некий» здесь звучало бы излишне книжно.
- source_word: ὀνόματι Λάζαρος
  choice: по имени Лазарь
  rationale: Обычная и точная русская передача дательного оборота, вводящего имя персонажа.
- source_word: ἐβέβλητο
  choice: лежал
  rationale: Плюсквамперфект пассива описывает состояние, возникшее потому, что Лазаря поместили или бросили у ворот. В основном тексте «лежал» звучит естественно; пассивный оттенок и возможная резкость глагола сохранены в примечании.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: у его ворот
  rationale: Предлог с винительным указывает на местоположение возле ворот или въезда богатого человека; «у его ворот» естественно по-русски и сохраняет отсылку к нему.
- source_word: εἱλκωμένος
  choice: весь в язвах
  rationale: Причастие означает поражённого язвами. Русский оборот краток, нагляден и передаёт тяжёлое состояние без медицинской перегрузки.
