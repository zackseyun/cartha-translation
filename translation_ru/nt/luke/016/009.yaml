source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: ru
  text: 'И Я говорю вам: приобретите себе друзей с помощью неправедного богатства[a], чтобы, когда оно иссякнет[b], они приняли вас в вечные жилища[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «из маммоны неправедности». «Маммона» — традиционная передача греческого слова, означающего богатство или деньги.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «когда вы умрёте» или «когда оно закончится». Греческий текст прямо не называет подлежащее; чаще всего глагол относят к богатству.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «в вечные шатры».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: приобретайте себе друзей
  rationale: Передаёт повелительное ποιήσατε и возвратное ἑαυτοῖς естественным современным русским выражением, сохраняя мысль о сознательном обретении друзей.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: с помощью неправедного богатства
  rationale: Предлог «с помощью» передаёт контекстуальное значение средства. «Богатство» понятно современному читателю и не вносит дополнительной персонификации, возможной у традиционного слова «маммона».
- source_word: τῆς ἀδικίας
  choice: неправедного
  rationale: Сохраняет широкое значение ἀδικία и не сужает его до богатства, непременно нажитого обманом или преступлением.
- source_word: ὅταν ἐκλίπῃ
  choice: когда оно иссякнет
  rationale: Ближайший вероятный референт глагола — богатство; «иссякнет» естественно выражает прекращение или утрату его действенности. Неявность подлежащего в греческом отмечена в сноске.
- source_word: δέξωνται ὑμᾶς
  choice: они приняли вас
  rationale: «Приняли» сохраняет значение гостеприимного принятия и не уточняет оставленный в греческом тексте невыраженным субъект.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: в вечные жилища
  rationale: «Жилища» естественно передаёт здесь образ мест пребывания, тогда как буквальное «шатры» сохранено в сноске; αἰωνίους передано как «вечные».
theological_decisions:
- issue: Смысл выражения «неправедное богатство»
  choice: Богатство, принадлежащее нынешнему неправедному порядку и подверженное его нравственной испорченности; не обязательно только нажитое нечестно
  alternative: Нечестно приобретённое богатство; персонифицированная Маммона как соперничающий господин
  rationale: Формулировка не сужает изречение до использования краденых или добытых обманом денег и не навязывает полную персонификацию Маммоны, сохраняя смысловую напряжённость контекста.
- issue: Подлежащее при ἐκλίπῃ
  choice: Иссякает богатство
  alternative: Иссякаете вы, то есть умираете; либо заканчиваются земные средства вообще
  rationale: Ближайший и наиболее естественный референт — μαμωνᾶς, однако греческая форма прямо не называет подлежащее, поэтому иное понимание отмечено в сноске.
- issue: Кто обозначен словом «они»
  choice: Личность принимающих оставлена неуточнённой
  alternative: Друзья, приобретённые щедрым употреблением богатства; бедные или Божий народ; небесные существа
  rationale: В греческом подлежащее δέξωνται не выражено. Его конкретизация в переводе необоснованно разрешила бы намеренно или фактически сохраняющуюся неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис близок к греческому, но не калькирован; традиционные термины и буквальные образы вынесены в сноски там, где они могут быть непрозрачны современному читателю.
