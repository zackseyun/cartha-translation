  terminology: «Закон» с прописной буквы уместен для νόμος в данном контексте. «Чёрточка» — допустимое современное соответствие κεραία; сноска удачно уточняет, что речь о крошечном штрихе или выступе буквы. Не следует заменять это слово на «йоту», поскольку в греческом тексте стоит κεραία, а не ἰῶτα.
