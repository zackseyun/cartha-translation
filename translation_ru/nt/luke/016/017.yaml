  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: ru
  text: Но скорее исчезнут небо и земля, чем выпадет хотя бы одна чёрточка Закона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни одна мельчайшая черта буквы Закона не выпадет». Греческое слово обозначает крошечный штрих или выступ, отличающий один письменный знак от другого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: скорее
  rationale: В сравнительной конструкции с инфинитивами передаёт не степень лёгкости действия, а его большую мыслимую возможность; по-русски «скорее… чем» звучит естественно и сохраняет риторическую силу.
- source_word: δέ
  choice: Но
  rationale: Передаёт мягкое противопоставление предшествующему контексту.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: небо и земля
  rationale: Сохраняет библейскую меризму, обозначающую весь сотворённый мир.
- source_word: παρελθεῖν
  choice: пройдут
  rationale: Сохраняет традиционный образ прекращения существования мира без усиления до прямого «исчезнут».
- source_word: τοῦ νόμου
  choice: Закона
  rationale: Здесь имеется в виду данный Богом Закон как часть Писания, а не закон вообще; прописная буква ясно обозначает этот референт.
- source_word: μίαν κεραίαν
  choice: хотя бы одна чёрточка
  rationale: κεραία — мельчайший штрих или выступ письменного знака. «Чёрточка» понятно современному читателю и сохраняет конкретный письменный образ; «хотя бы» естественно выражает усилительный смысл μίαν в отрицательно-предельном сравнении.
- source_word: πεσεῖν
  choice: отпадёт
  rationale: Сохраняет образ «падения», одновременно естественно обозначая выпадение или утрату мельчайшей части текста.
theological_decisions:
- issue: Референт νόμος
  choice: Закон как данное Богом Писание
  alternative: закон вообще
  rationale: Контекст и упоминание мельчайшего письменного штриха указывают на Закон в библейском смысле; перевод не уточняет далее его объём и тем самым не снимает возможного напряжения контекста.
- issue: Смысл долговечности Закона
  choice: 'сохранён образ: чёрточка Закона не «отпадёт»'
  alternative: не утратит силу / не останется неисполненной
  rationale: Греческое πεσεῖν буквально означает «упасть». Более толковательные варианты преждевременно определили бы, говорит ли стих о сохранности текста, действенности или исполнении Закона.
- issue: Передача κεραία
  choice: чёрточка
  alternative: черта буквы / йота / титло
  rationale: Нейтральное современное слово передаёт крайне малую графическую деталь, не подменяя κεραία словом «йота» и не вводя архаизм.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой, торжественной сравнительной конструкции. «Скорее… чем» предпочтено буквальному, но тяжеловесному «легче… чем». Образность оригинала сохранена без догматического разъяснения глагола πεσεῖν.
