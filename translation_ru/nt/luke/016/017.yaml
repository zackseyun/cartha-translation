  source_fidelity: 'Основная сравнительная конструкция и смысл переданы верно: εὐκοπώτερον передано естественным русским «скорее… чем», а μίαν κεραίαν — как минимальная графическая деталь Закона. Однако «небо и земля пройдут» в современном русском может означать движение или течение времени и не вполне ясно передаёт παρελθεῖν в значении прекращения/исчезновения. «Отпадёт» сохраняет буквальный образ, но для чёрточки звучит менее естественно, чем «выпадет»; последнее сохраняет смысл утраты графического элемента.'
