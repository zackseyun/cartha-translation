  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: ru
  text: Ведь у меня пять братьев, чтобы он настоятельно предупредил их[a], чтобы и они не попали в это место мучений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даст им серьёзное свидетельство»; греческий глагол может означать торжественно свидетельствовать, настойчиво предостерегать или строго предупреждать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: ведь у меня
  rationale: γάρ объясняет предыдущую просьбу; «ведь» естественно передаёт эту связь, а конструкция «у меня» — обычный русский эквивалент ἔχω в значении обладания.
- source_word: πέντε ἀδελφούς
  choice: пять братьев
  rationale: Мужской род и контекст указывают именно на братьев, а не на братьев и сестёр вообще.
- source_word: ὅπως διαμαρτύρηται αὐτοῖς
  choice: пусть он настоятельно предупредит их
  rationale: ὅπως выражает цель просьбы, а διαμαρτύρομαι здесь по контексту означает настойчивое, серьёзное предостережение; конструкция с «пусть» звучит по-русски естественно.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: чтобы и они не попали
  rationale: ἵνα μή передаёт отрицательную цель, καὶ αὐτοί — «и они»; «не попали» естественно выражает нежелательное прибытие в названное место.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: в это место мучений
  rationale: εἰς обозначает движение в место, а βάσανος — тяжёлое мучение или страдание. Множественное «мучений» является естественным русским обозначением места, характеризуемого мучением.
theological_decisions:
- issue: Описание места посмертного пребывания в речи богача
  choice: это место мучений
  alternative: это место страдания
  rationale: Перевод сохраняет сильное значение βάσανος, но не добавляет к словам стиха более развёрнутого учения о посмертном состоянии.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Настоятельно предупредит» сохраняет серьёзность глагола без архаичного или конфессионально окрашенного оборота.
