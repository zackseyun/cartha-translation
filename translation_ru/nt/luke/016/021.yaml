lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: мечтал
  rationale: Причастие настоящего времени выражает продолжающееся сильное желание; «мечтал» естественно передаёт томительное стремление в данном контексте.
- source_word: χορτασθῆναι
  choice: насытиться
  rationale: Передаёт значение получения достаточного количества пищи и сохраняет оттенок полного утоления голода.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: тем, что падало
  rationale: Субстантивированное причастие передано без добавления прямо не названных «крошек» или «объедков»; несовершенный вид отражает продолжающееся действие.
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: со стола богача
  rationale: Естественная русская передача исходного оборота; субстантивированное прилагательное πλουσίου обозначает ранее упомянутого богача.
- source_word: ἀλλὰ καὶ
  choice: Но даже
  rationale: Сохраняет противопоставление и усилительное, неожиданное добавление.
- source_word: οἱ κύνες
  choice: собаки
  rationale: Прямая и нейтральная передача множественного числа.
- source_word: ἐρχόμενοι
  choice: приходили
  rationale: Обстоятельственное причастие естественно передано личной формой; несовершенный вид согласуется с повторяющейся сценой.
- source_word: ἐπέλειχον
  choice: лизали
  rationale: Несовершенный вид русского глагола передаёт длительный или повторяющийся характер греческого имперфекта.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: его язвы
  rationale: ἕλκη обозначает болезненные изъязвления или открытые поражения; «язвы» точно и понятно в современном литературном русском.
