  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: ru
  text: 'Никакой домашний слуга не может служить двум господам: ведь он либо одного будет ненавидеть, а другого любить, либо будет предан одному, а другого презрит. Не можете служить и Богу, и маммоне[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богатству», «деньгам». Маммона — слово, обозначающее богатство; здесь оно представлено как господин, соперничающий с Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: домашний слуга
  rationale: Передаёт более узкое значение человека в услужении при доме и сохраняет бытовой контекст, не смешивая этот термин с более общим δοῦλος.
- source_word: κυρίοις
  choice: господам
  rationale: В контексте отношений слуги и хозяев слово обозначает тех, кому служат; «господам» естественно сохраняет также связь с образом соперничающих властей.
- source_word: δουλεύειν
  choice: служить
  rationale: Естественно передаёт служение в подчинённом положении и позволяет сохранить повтор в заключительном противопоставлении Бога и маммоны.
- source_word: μισήσει / ἀγαπήσει
  choice: будет ненавидеть / любить
  rationale: Сохраняет прямую и резкую антитезу греческого текста, не сводя «ненавидеть» к более слабому «любить меньше».
- source_word: ἀνθέξεται
  choice: будет привязан
  rationale: Передаёт значение крепкой приверженности и верности одному из двух господ; русская формулировка естественна в данном параллелизме.
- source_word: καταφρονήσει
  choice: пренебрегать
  rationale: Передаёт презрительное невнимание и неуважение; форма хорошо сочетается с «будет привязан».
- source_word: θεῷ
  choice: Богу
  rationale: Прямое соответствие дательному объекту при глаголе «служить».
- source_word: μαμωνᾷ
  choice: маммоне
  rationale: Сохранение семитского заимствования поддерживает олицетворённый образ богатства как соперничающего господина; значение разъясняется в сноске.
theological_decisions:
- issue: Передача μαμωνᾷ в противопоставлении θεῷ
  choice: маммоне
  alternative: богатству; деньгам
  rationale: Транслитерация сохраняет риторическое олицетворение богатства как господина, соперничающего с Богом, не утверждая при этом, что маммона является буквальным божеством.
- issue: Сила противопоставления μισήσει и ἀγαπήσει
  choice: будет ненавидеть, а другого любить
  alternative: одного будет любить меньше, чем другого
  rationale: Буквальная антитеза сохраняет напряжённость и выразительность исходного изречения; возможный семитский оттенок предпочтения не следует молча подставлять вместо греческих слов.
- issue: Представительный мужской род в единственном числе
  choice: он ... одного ... другого
  alternative: такой слуга ... одного ... другого; множественное число
  rationale: Греческий текст использует единичный пример с формами мужского рода; русский «слуга» грамматически мужского рода, поэтому местоимение «он» точно и естественно.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified пословичным ритмом. Сохранены параллелизм, резкие глагольные противопоставления и повтор «служить». Термин «маммона» оставлен ради олицетворённой силы образа и пояснён сноской.
