  source_fidelity: В черновике точно переданы отрицание, обращение к Аврааму, неопределённый субъект, движение к адресатам и μετανοήσουσιν как «покаются». Однако союз ἀλλ’ («но», «напротив») опущен, вследствие чего ослаблено явное противопоставление предыдущему утверждению Авраама. Формулировка «из мёртвых придёт к ним» естественно передаёт ἀπὸ νεκρῶν, не уточняя спорным образом механизм возвращения.
