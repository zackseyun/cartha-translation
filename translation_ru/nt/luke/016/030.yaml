source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: ru
  text: 'Но он сказал: «Нет, отец Авраам, но если кто-нибудь из мёртвых придёт к ним, они покаются».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: Нет
  rationale: Сильное отрицание, естественно передающее возражение в прямой речи.
- source_word: πάτερ Ἀβραάμ
  choice: отец Авраам
  rationale: Обращение к Аврааму как к праотцу; строчная буква у слова «отец» не превращает обращение в официальный титул.
- source_word: ἀλλ’ ἐάν
  choice: Если
  rationale: После категорического «Нет» условная конструкция сама ясно выражает противопоставление; буквальное «но если» по-русски здесь звучало бы тяжеловесно.
- source_word: τις
  choice: кто-нибудь
  rationale: Естественная передача неопределённого местоимения в условном предложении.
- source_word: ἀπὸ νεκρῶν
  choice: от мёртвых
  rationale: Краткая и естественная русская передача исхода из среды или состояния мёртвых; контекст сохраняет подразумеваемое возвращение к живым.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: придёт к ним
  rationale: Хотя πορεύομαι означает движение «идти», русская дейктика естественно требует «придёт к ним», то есть достигнет тех, кому предназначено предупреждение.
- source_word: μετανοήσουσιν
  choice: они покаются
  rationale: В контексте Луки глагол обозначает нравственно-духовное обращение, а не просто перемену мнения.
theological_decisions:
- issue: Смысл μετανοήσουσιν
  choice: они покаются
  alternative: они изменят свои мысли / образ мыслей
  rationale: «Покаются» сохраняет обычную для Луки нравственно-духовную силу μετανοέω и не сводит требуемый отклик к интеллектуальному пересмотру.
- issue: Направление движения в πορευθῇ πρὸς αὐτούς
  choice: придёт к ним
  alternative: пойдёт к ним
  rationale: Оба варианта передают движение к братьям; «придёт к ним» естественнее в русской условной речи и не добавляет идеи воскресения, которой сам глагол прямо не выражает.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и сохраняет уважительное родственное обращение. Восклицательный знак после обращения подчёркивает сильное возражение Οὐχί без добавления новых слов.
