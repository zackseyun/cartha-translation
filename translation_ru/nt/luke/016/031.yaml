id: LUK.16.31
reference: Luke 16:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: ru
  text: 'Но он сказал ему: «Если они не слушают Моисея и Пророков[a], то не убедятся, даже если кто-нибудь воскреснет из мёртвых[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не слушают Моисея и Пророков». Здесь имеются в виду их слова, содержащиеся в Писании; «слушать» может также подразумевать внимать им.'
    reason: lexical_and_cultural_clarification
  - marker: b
    text: 'Или: «встанет из среды мёртвых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Но он сказал ему
  rationale: δέ передаёт лёгкое противопоставление ответу собеседника; русский порядок слов естественен для повествования.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Моисея и Пророков
  rationale: Фраза обозначает признанное свидетельство Писания, прежде всего Закон и Пророков; форма с прописной буквы указывает на корпус пророческих книг, не заменяя исходный образ словом «Писание».
- source_word: οὐκ ἀκούουσιν
  choice: не слушают
  rationale: ἀκούω здесь допускает как восприятие услышанного, так и внимательное, отзывчивое отношение; «не слушают» сохраняет обе стороны лучше, чем узкие «не слышат» или «не повинуются».
- source_word: οὐδ’ ἐάν
  choice: то не… даже если
  rationale: Конструкция усиливает отрицание и вводит условие; русское «то не убедятся, даже если» естественно передаёт её риторическую силу.
- source_word: τις
  choice: кто-нибудь
  rationale: Сохраняет неопределённое единственное лицо без дополнительной конкретизации.
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: воскреснет из мёртвых
  rationale: Естественная современная русская формула воскресения, сохраняющая исходное ἐκ νεκρῶν.
- source_word: πεισθήσονται
  choice: убедятся
  rationale: Будущее пассивное πείθω означает, что они будут убеждены; русское возвратное «убедятся» звучит естественно и не сужает смысл до специального богословского значения веры.
theological_decisions:
- issue: Значение выражения «Моисей и Пророки»
  choice: Сохранено как обозначение данного Израилю авторитетного свидетельства Писания
  alternative: Развернуть как «Писание» или понимать лишь как двух представителей
  rationale: В контексте это метонимическое обозначение письменного свидетельства, однако перевод сохраняет исходную формулу и не подменяет её толкованием.
- issue: Смысл πεισθήσονται
  choice: «не убедятся» — общее убеждение или признание истинности
  alternative: «не поверят» или «не покаются»
  rationale: Глагол не уточняет, что речь именно о спасительной вере или покаянии; более общий перевод сохраняет богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественный без архаизмов. Синтаксис сохраняет противопоставление и условную структуру греческого текста; «из мёртвых» оставлено как привычное библейское выражение.
