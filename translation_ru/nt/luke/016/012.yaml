  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: ru
  text: И если вы не были верны в том, что принадлежит другому[a][c], кто даст вам ваше собственное?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в чужом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «то, что принадлежит вам».'
    reason: lexical_alternative
  - marker: c
    text: Возможно, здесь противопоставлены верность в обращении с земным богатством сейчас и получение истинного или непреходящего богатства впоследствии; однако сам стих прямо этого не уточняет.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: в чужом
  rationale: Субстантивированное прилагательное среднего рода означает «в том, что принадлежит другому». Краткое русское «в чужом» естественно передаёт этот смысл и сохраняет неопределённость предмета.
- source_word: πιστοὶ
  choice: верны
  rationale: Здесь πιστός обозначает верность и надёжность в распоряжении вверенным, а не веру как убеждение.
- source_word: οὐκ ἐγένεσθε
  choice: не были
  rationale: Аорист γίνομαι в данном условном обороте естественно передаётся по-русски как пребывание или проявление себя в определённом качестве; «не были верны» звучит ясно и без лишнего истолкования.
- source_word: τὸ ὑμέτερον
  choice: ваше собственное
  rationale: Субстантивированное местоименное прилагательное означает «то, что ваше». Формулировка сохраняет прямое противопоставление чужому.
- source_word: δώσει ὑμῖν
  choice: даст вам
  rationale: Это прямое соответствие обычному значению δίδωμι. Вариант «доверит вам» подходил бы контексту управления имуществом, но добавлял бы толкование.
- source_word: καὶ εἰ
  choice: И если
  rationale: Сохраняет связь с предшествующим высказыванием и прямо вводит условие.
- source_word: τίς
  choice: кто
  rationale: Прямо и естественно передаёт риторический вопрос греческого текста.
theological_decisions:
- issue: Что именно обозначают «чужое» и «ваше собственное»
  choice: Не уточнять обозначаемые реалии в основном тексте.
  alternative: Понимать противопоставление как земное богатство и истинное или вечное богатство либо как чужое имущество и собственное наследие.
  rationale: Сам стих прямо не называет эти реалии. Сохранение открытого противопоставления не устраняет богословскую многозначность текста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и понятная. «В чужом» сохраняет лаконизм и смысловую открытость оригинала, а сноски разъясняют возможные лексические и контекстуальные значения.
