review_pass:
  verdict: revise
  source_fidelity: Греческое ἐν τῷ ἀλλοτρίῳ означает «в том, что принадлежит другому»; τὸ ὑμέτερον — «то, что ваше/ваше собственное». Условие, характеристика верности и риторический вопрос в проекте переданы точно. Однако «в чужом» в современном русском без пояснения может прежде всего восприниматься как «на чужой территории» или как неполное эллиптическое выражение, поэтому в основном тексте лучше явно передать субстантивированное прилагательное.
  naturalness: «И если вы не были верны… кто даст вам…?» — естественная литературная конструкция. Замена «в чужом» на «в том, что принадлежит другому» делает фразу однозначнее и нормативнее для современного литературного русского, не уточняя, о чём именно идёт речь.
  terminology: «Верны» корректно передаёт πιστοί в контексте надёжности и верности в распоряжении вверенным. «Ваше собственное» удачно сохраняет контраст с чужим. Не следует заменять «даст» на «доверит», поскольку это добавило бы интерпретацию.
