  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: ru
  text: Всякий, кто разводится со своей женой и женится на другой, совершает прелюбодеяние; и тот, кто женится на женщине, разведённой со своим мужем[a], совершает прелюбодеяние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «на отпущенной от мужа», то есть на женщине, находящейся в состоянии после развода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Всякий, кто
  rationale: Артиклевая конструкция с πᾶς выражает обобщение и всеобщий охват; этот русский оборот естественен и сохраняет категоричность высказывания.
- source_word: ἀπολύων
  choice: разводится
  rationale: В брачном контексте ἀπολύω означает расторгать брак, а не просто «отпускать».
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: со своей женой
  rationale: γυνή здесь означает «жена»; русское управление глагола «разводиться» требует предлога «с».
- source_word: γαμῶν ἑτέραν
  choice: женится на другой
  rationale: ἑτέραν обозначает другую женщину; существительное естественно подразумевается и в русском языке.
- source_word: μοιχεύει
  choice: совершает прелюбодеяние
  rationale: Передаёт действие глагола ясно и в dignified современном библейском регистре.
- source_word: ἀπολελυμένην ἀπὸ ἀνδρός
  choice: разведённой с мужем
  rationale: Совершенный страдательный причастный оборот описывает женщину, находящуюся в состоянии после развода; «с мужем» сохраняет исходное ἀπό и не заменяет его более толковательным «мужем» в значении действующего лица.
theological_decisions:
- issue: Сфера и категоричность изречения Иисуса о разводе
  choice: Передать стих как всеобщее нравственное утверждение без добавления исключений.
  alternative: Добавить подразумеваемое исключение на основании параллельных мест или сузить утверждение до отдельных незаконных разводов.
  rationale: В формулировке Луки исключение отсутствует. Перевод сохраняет напряжение текста и не вносит гармонизирующих уточнений.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным библейским звучанием. Повтор «совершает прелюбодеяние» сохранён ради риторической структуры оригинала.
