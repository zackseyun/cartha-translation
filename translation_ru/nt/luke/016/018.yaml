    rationale: Фраза «с которой муж развёлся» добавляет агентивный оттенок, тогда как исходная конструкция буквально обозначает женщину, разведённую/отпущенную от мужа.
  revised_text: Всякий, кто разводится со своей женой и женится на другой, совершает прелюбодеяние; и тот, кто женится на женщине, разведённой со своим мужем[a], совершает прелюбодеяние.
