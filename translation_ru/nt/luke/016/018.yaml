review_pass:
  verdict: revise
  source_fidelity: 'Первая часть передана точно: πᾶς ὁ сохраняет всеобщий характер, ἀπολύων — развод, γαμῶν ἑτέραν — последующий брак с другой женщиной, μοιχεύει — прелюбодеяние. Во второй части «разведённой с мужем» без уточнения звучит по-русски неудачно и может восприниматься как неполная конструкция. «Разведённой со своим мужем» естественнее и передаёт состояние после развода, не превращая ἀπό в однозначное указание на действующее лицо.'
  naturalness: «Всякий, кто» и повтор «совершает прелюбодеяние» соответствуют современному литературному библейскому регистру. Добавление «женщине» во второй части делает управление «женится на» ясным. Оборот «разведённой со своим мужем» нормативен и понятен.
  terminology: '«Разводится», «жена», «женится», «прелюбодеяние» употреблены последовательно и уместно. В примечании не следует толковательно утверждать, что именно муж развёлся с женщиной: греческое ἀπολελυμένην ἀπὸ ἀνδρός буквально говорит об «отпущенной/разведённой от мужа» и не требует такого уточнения.'
