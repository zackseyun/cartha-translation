  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: ru
  text: Жил один богатый человек. Он одевался в пурпур и тонкий лён и каждый день роскошно пировал.[a]
  philosophy: optimal-equivalence
  footnotes:
