    text: 'Или: «и каждый день блистательно веселился». Греческое выражение может обозначать праздничное веселье или пиршество и подчёркивать его пышность и роскошь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις ἦν πλούσιος
  choice: Жил один богатый человек
  rationale: Оборот естественно вводит нового участника повествования; «один» передаёт неопределённое τις, а δέ выполняет функцию мягкого повествовательного перехода и не требует отдельного союза.
- source_word: ἐνεδιδύσκετο
  choice: одевался
  rationale: Имперфект передаёт привычное, повторяющееся действие; в сочетании с общим описанием образа жизни русский несовершенный вид выражает это естественно.
- source_word: πορφύραν
  choice: пурпур
  rationale: Существительное метонимически обозначает дорогую одежду, окрашенную пурпуром; рядом с «одевался» название ткани или цвета понятно без добавления слова «одежда».
- source_word: βύσσον
  choice: тонкий лён
  rationale: βύσσος обозначает высококачественную льняную ткань; «тонкий лён» сохраняет значение материала и его дорогого качества.
- source_word: εὐφραινόμενος
  choice: пировал
  rationale: В контексте показной роскоши причастие указывает на праздничное наслаждение жизнью, вероятно включавшее богатые трапезы; «пировал» звучит естественно и соответствует контексту.
- source_word: καθ’ ἡμέραν
  choice: каждый день
  rationale: Прямой и естественный эквивалент устойчивого греческого выражения ежедневной повторяемости.
- source_word: λαμπρῶς
  choice: роскошно
  rationale: Наречие обозначает великолепие и пышность; применительно к образу жизни и пирам «роскошно» ясно передаёт контекстуальный смысл.
