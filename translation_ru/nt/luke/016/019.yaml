  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: неопределённое введение персонажа, его богатство, привычное ношение пурпура и тонкого льна, а также ежедневные роскошные пиры. «Жил один богатый человек» является естественным русским повествовательным введением для Ἄνθρωπος δέ τις ἦν πλούσιος и не вносит существенного дополнительного смысла. Несовершенный вид в «одевался» и «пировал» уместно передаёт имперфект ἐνεδιδύσκετο и общий привычный характер описания.'
