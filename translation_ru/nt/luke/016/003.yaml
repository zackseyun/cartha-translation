  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: ru
  text: 'Тогда управляющий сказал про себя: «Что мне делать? Ведь хозяин лишает меня управления имением[a]. Копать у меня не хватает сил, а мне стыдно просить милостыню».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домоправитель» и «ведение хозяйства». В греческом для самого человека и для вверенной ему должности употреблены однокоренные слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: управляющий / управление имением
  rationale: Однокоренные русские слова передают связь между человеком и вверенным ему делом; уточнение «имением» естественно обозначает круг его обязанностей в контексте притчи.
- source_word: ἐν ἑαυτῷ
  choice: сказал про себя
  rationale: Естественная современная русская передача внутренней речи.
- source_word: Τί ποιήσω
  choice: Что мне делать?
  rationale: Передаёт совещательный вопрос о предстоящем образе действий без излишне книжного оттенка.
- source_word: κύριός μου
  choice: хозяин
  rationale: В данном контексте речь идёт о человеческом владельце и начальнике управляющего, а не о божественном титуле.
- source_word: ἀφαιρεῖται
  choice: отстраняет меня от
  rationale: По смыслу хозяин лишает персонажа вверенной ему должности и полномочий; настоящее время передаёт уже принятое и осуществляемое решение.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: Копать у меня не хватает сил
  rationale: Сохраняет буквальное «копать» и выраженный глаголом ἰσχύω оттенок физической силы.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: просить милостыню стыдно
  rationale: ἐπαιτεῖν обозначает нищенство, просьбу о подаянии; формулировка звучит естественно и сохраняет чувство стыда.
theological_decisions:
- issue: Передача κύριος в небожественном контексте притчи
  choice: хозяин
  alternative: господин
  rationale: «Хозяин» ясно указывает на социально-имущественные отношения внутри притчи и не привносит намёка на божественный титул; «господин» также возможно, но в современном русском менее конкретно.
translation_notes:
  register: Современный литературный русский язык; речь персонажа краткая и естественная, но сохраняет достоинство библейского повествования. Союз «ведь» явно передаёт причинное ὅτι, а «а» — контраст между физической неспособностью и стыдом.
