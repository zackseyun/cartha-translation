  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: ru
  text: Итак, если вы не оказались верны в обращении с неправедным богатством[a], кто доверит вам истинное богатство[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в неправедном маммоне». Возможно также: «с нечестным богатством»; однако речь не обязательно только о богатстве, добытом нечестным путём.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «истинное»; существительное в греческом тексте не выражено. По контрасту с земным богатством подразумевается истинное богатство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: в обращении с неправедным богатством
  rationale: Оборот с ἐν обозначает сферу, в которой проявляется верность. Русское «в обращении с» естественно передаёт мысль об ответственном распоряжении. ἄδικος сохраняет нравственную окраску как «неправедный», не сужая смысл до богатства, приобретённого обманом; μαμωνᾶς передано широким словом «богатство», а не более узким «деньги».
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: не оказались верны
  rationale: Сочетание γίνομαι с предикативным прилагательным здесь означает проявить или показать себя каким-либо. «Не оказались верны» естественно выражает проверенную на деле надёжность распорядителя.
- source_word: τὸ ἀληθινὸν
  choice: истинное богатство
  rationale: Прилагательное среднего рода употреблено субстантивированно, без выраженного существительного. Контраст с μαμωνᾶς позволяет для ясности восполнить «богатство», а сноска сохраняет формальную неопределённость греческого выражения.
- source_word: πιστεύσει
  choice: доверит
  rationale: С дательным лица и винительным предмета πιστεύω означает «вверить, доверить кому-либо», а не «поверить».
theological_decisions:
- issue: Смысл субстантивированного τὸ ἀληθινὸν
  choice: «истинное богатство»
  alternative: «истинное» или «то, что истинно»
  rationale: Непосредственное противопоставление неправедному богатству делает подразумеваемое «богатство» наиболее вероятным, однако греческий текст не называет существительное прямо. Поэтому уточнение внесено в основной текст ради понятности, а буквальная форма отмечена в сноске без дальнейшего догматического определения природы этого блага.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Маммона» заменена общеупотребительным «богатство»; добавление «в обращении с» делает отношение ἐν естественным по-русски и сохраняет тему верности в управлении.
