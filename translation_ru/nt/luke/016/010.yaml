id: LUK.16.10
reference: Luke 16:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: ru
  text: Верный в самом малом верен и во многом, а неправедный в самом малом неправеден и во многом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечестный» или «несправедливый». Греческое слово имеет более широкий смысл, чем только финансовая нечестность, хотя в данном контексте присутствует и этот оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: верный
  rationale: В контексте управления доверенным имуществом слово обозначает надёжность и добросовестность, а не просто веру; «верный» естественно передаёт это качество и сохраняет параллелизм.
- source_word: ἐν ἐλαχίστῳ
  choice: в самом малом
  rationale: Оборот обозначает сферу или обстоятельства, связанные с чем-то крайне малым либо незначительным; выбранная формулировка естественна по-русски и точно противопоставлена «во многом».
- source_word: ἐν πολλῷ
  choice: во многом
  rationale: Субстантивированное прилагательное среднего рода выражает большую меру или значительность; формулировка сохраняет краткость и антитезу греческого текста.
- source_word: ἄδικος
  choice: неправедный
  rationale: 'Слово имеет широкое нравственное значение: несправедливый, поступающий неправильно, неправедный. «Неправедный» не сужает смысл до финансовой нечестности, хотя контекст допускает такой оттенок.'
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: верный ... неправедный
  rationale: Артикль с прилагательным употреблён субстантивно. В русском языке обобщённое значение естественно передаётся субстантивированными прилагательными без добавления местоимения.
- source_word: καὶ
  choice: и
  rationale: Повторяющийся союз связывает соответствующие элементы параллельных высказываний. Русское «и» естественно передаёт присоединительное значение и подчёркивает симметрию.
theological_decisions:
- issue: Значение ἄδικος в контексте управления имуществом
  choice: неправедный
  alternative: нечестный; несправедливый
  rationale: Высказывание формулирует общий нравственный принцип, а не ограничивается финансовой честностью. Выбор сохраняет широту греческого термина и напряжение между общим смыслом и денежным контекстом.
translation_notes:
  register: Краткое афористичное высказывание передано современным литературным русским языком. Сохранены параллелизм, повтор ключевых прилагательных и противопоставление «в самом малом — во многом».
