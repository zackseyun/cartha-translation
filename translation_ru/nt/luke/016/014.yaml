source:
  edition: SBLGNT
  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: ru
  text: А фарисеи, которые любили деньги, слышали всё это и насмехались над ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глумились над ним». Греческий глагол может обозначать открытую насмешку или презрительное издевательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: слышали
  rationale: Имперфект обозначает продолжавшееся или одновременное с происходящим действие; русская форма несовершенного вида «слышали» естественно передаёт этот аспект.
- source_word: δὲ
  choice: А
  rationale: Частица обозначает мягкий переход и одновременно оттеняет реакцию фарисеев на предшествующие слова Иисуса; русское «А» передаёт эту связь без чрезмерно сильного противопоставления.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Естественное русское соответствие, отсылающее ко всему предшествующему учению Иисуса.
- source_word: οἱ Φαρισαῖοι
  choice: фарисеи
  rationale: Общепринятое русское наименование данной религиозной группы.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: которые любили деньги
  rationale: Прямо передаёт устойчивую характеристику φιλάργυροι и остаётся понятнее современному читателю, чем книжное «сребролюбивые».
- source_word: ἐξεμυκτήριζον
  choice: насмехались
  rationale: Несовершенный вид передаёт продолжавшуюся реакцию, а глагол выражает открытое насмешливое презрение, не добавляя отсутствующих в тексте деталей.
- source_word: αὐτόν
  choice: над ним
  rationale: Местоимение относится к Иисусу; строчная буква соответствует обычной современной русской орфографии и не вносит в исходный текст дополнительного типографического почтения.
theological_decisions:
- issue: Характеристика фарисеев словом φιλάργυροι
  choice: которые любили деньги
  alternative: которые были жадными; сребролюбивые
  rationale: Греческое слово прямо обозначает любовь к деньгам. Выбранная формулировка сохраняет связь с предшествующим учением о богатстве и не расширяет смысл до более общего обвинения в жадности.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и повествовательный. Союз «А» сохраняет мягкую дискурсивную связь, две формы несовершенного вида передают одновременную и продолжавшуюся реакцию фарисеев.
