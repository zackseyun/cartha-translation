base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: ru
  text: 'И, подозвав к себе каждого из должников своего хозяина[a], он спросил первого: «Сколько ты должен моему хозяину?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое κύριος часто переводится как «Господь» или «господин», но здесь оно обозначает земного хозяина, которому служит управляющий.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: подозвав к себе
  rationale: Аористное причастие обозначает действие, предшествующее основному; выражение естественно передаёт также значение среднего залога — призвать к себе.
- source_word: ἕνα ἕκαστον
  choice: каждого
  rationale: Сочетание имеет усиленное распределительное значение. Русское «каждого» точно и естественно передаёт его без излишнего уточнения «по одному».
- source_word: χρεοφειλετῶν
  choice: должников
  rationale: Существительное прямо обозначает людей, имеющих долг; в хозяйственно-финансовом контексте это наиболее точное соответствие.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: своего хозяина
  rationale: κύριος здесь означает человека, которому подчинён управляющий, а ἑαυτοῦ отсылает к субъекту действия; «своего хозяина» ясно передаёт обе связи.
- source_word: ἔλεγεν
  choice: он спросил
  rationale: Имперфект вводит последовательный разговор с должниками; применительно к первому собеседнику естественное русское «спросил» передаёт речевой акт, хотя не воспроизводит видовую форму буквально.
- source_word: τῷ πρώτῳ
  choice: первого
  rationale: При русском глаголе «спросил» адресат естественно оформляется винительным падежом; порядковое значение сохранено.
- source_word: Πόσον
  choice: сколько
  rationale: В контексте долга вопросительное слово относится к величине суммы или объёму задолженности; «сколько» — прямой современный эквивалент.
- source_word: ὀφείλεις
  choice: ты должен
  rationale: Настоящее время и финансовое значение глагола естественно передаются обычной русской конструкцией «быть должным».
- source_word: τῷ κυρίῳ μου
  choice: моему хозяину
  rationale: Местоимение сохраняет точку зрения управляющего, а «хозяин» указывает на земного владельца и не вносит ошибочной божественной коннотации.
theological_decisions:
- issue: Передача κύριος в хозяйственно-экономическом контексте притчи
  choice: хозяин
  alternative: господин / Господь
  rationale: В данном стихе речь идёт о земном владельце, которому служит управляющий. «Хозяин» естественно обозначает эти отношения и не создаёт неуместной христологической или божественной коннотации; сноска фиксирует лексическую альтернативу.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный повествовательный стиль. Синтаксис слегка упрощён ради естественности: греческое «говорил первому» передано как «спросил первого», при этом последовательность действий и содержание вопроса сохранены.'
