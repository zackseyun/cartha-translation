  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: ru
  text: 'Затем он сказал другому: «А ты сколько должен?» Тот ответил: «Сто ко́ров пшеницы[a]». Он говорит ему: «Возьми свою долговую расписку[b] и напиши: восемьдесят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кор — древняя крупная мера объёма для зерна и других сыпучих продуктов.
    reason: cultural_note
  - marker: b
    text: 'Или: «свой письменный договор» либо «свои документы»; буквально по-гречески: «свои письмена» (τὰ γράμματα), то есть здесь письменный долговой документ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Затем
  rationale: Передаёт последовательный переход к следующему должнику естественным современным русским словом.
- source_word: ἑτέρῳ
  choice: другому
  rationale: Обозначает другого человека, отличного от первого должника, не добавляя отсутствующего в греческом тексте существительного.
- source_word: Σὺ δὲ
  choice: А ты
  rationale: Сохраняет подчёркнутое местоимение и мягкий переход или контраст, выраженный δέ.
- source_word: πόσον ὀφείλεις
  choice: сколько должен
  rationale: Естественно и точно передаёт денежно-хозяйственную задолженность в данном контексте.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Сто ко́ров пшеницы
  rationale: Сохраняет конкретную древнюю единицу сухой меры, а ударение предотвращает ошибочное прочтение как формы слова «корова»; значение поясняется в сноске.
- source_word: λέγει αὐτῷ
  choice: Он говорит ему
  rationale: Сохраняет историческое настоящее греческого текста и его повествовательную живость, не уточняя явно субъект сверх оригинала.
- source_word: Δέξαι
  choice: Возьми
  rationale: В контексте документа естественно передаёт повеление получить его в руки.
- source_word: σου τὰ γράμματα
  choice: свою долговую расписку
  rationale: Буквально это «твои письмена/документы», но в контексте долга выражение обозначает письменный долговой документ; русское единственное число функционально и естественно.
- source_word: γράψον ὀγδοήκοντα
  choice: 'напиши: восемьдесят'
  rationale: Сохраняет прямое повеление вписать новую сумму; двоеточие естественно вводит записываемое число.
