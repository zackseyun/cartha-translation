  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: ru
  text: 'Он также говорил ученикам: «У одного богатого человека был управляющий[a], и ему донесли[b], что тот растрачивает его имущество».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домоправитель» — человек, которому было доверено управление домом или имением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его обвинили перед хозяином»; греческий глагол может обозначать обвинение, донос или неблагоприятное сообщение, не обязательно доказанное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: говорил
  rationale: Имперфект задаёт продолжающуюся или фоновую речь; русское несовершенное «говорил» естественно сохраняет этот аспект.
- source_word: δὲ καὶ
  choice: также
  rationale: δέ обозначает переход, который в русском не обязательно выражать отдельным словом, а καί передано как «также», связывая эту речь с предыдущим повествованием.
- source_word: πρὸς τοὺς μαθητάς
  choice: ученикам
  rationale: Дательный адресата естественно передаёт πρὸς с винительным в значении направления речи; притяжательное «своим» не добавлено, поскольку его нет в греческом тексте.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: У одного богатого человека был
  rationale: Русская конструкция естественно вводит нового персонажа притчи и сохраняет неопределённость τις посредством «одного».
- source_word: οἰκονόμον
  choice: управляющий
  rationale: Слово обозначает доверенное лицо, ведавшее домом или имением; «управляющий» ясно и современно, тогда как «домоправитель» имеет более архаичный оттенок.
- source_word: οὗτος
  choice: тот
  rationale: Указательное местоимение подчёркнуто отсылает к управляющему; «тот» естественно сохраняет эту соотнесённость и устраняет двусмысленность.
- source_word: διεβλήθη αὐτῷ
  choice: ему донесли
  rationale: Пассив διαβάλλω допускает значение обвинения, неблагоприятного сообщения или доноса. Формулировка «ему донесли» сохраняет адресата и не представляет обвинение как доказанный факт.
- source_word: ὡς διασκορπίζων
  choice: что тот растрачивает
  rationale: ὡς с причастием передаёт содержание неблагоприятного сообщения. «Растрачивает» естественно выражает неразумное расходование в имущественном контексте.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: его имущество
  rationale: Субстантивированное выражение означает принадлежащее богатому человеку имущество; единственное собирательное «имущество» естественно по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис сделан естественным для русского, без добавления отсутствующего в оригинале притяжательного местоимения при «ученикам». Все сноски отмечены в основном тексте.
