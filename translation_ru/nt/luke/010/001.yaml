  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: ru
  text: После этого Господь назначил также семьдесят двух других[a] и послал их по двое впереди Себя в каждый город и всякое место, куда Он Сам собирался прийти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «семьдесят».'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: После этого
  rationale: Естественно передаёт временной переход и множественное ταῦτα без тяжеловесного буквального «после этих событий».
- source_word: ἀνέδειξεν
  choice: назначил
  rationale: Глагол обозначает назначение или избрание людей для определённого поручения.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Обычный и контекстуально ясный перевод титула κύριος, относящегося здесь к Иисусу.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: ещё семьдесят два человека
  rationale: «Ещё» передаёт добавочное значение καί и ἑτέρους; слово «человека» естественно восполняет подразумеваемое существительное. Основной текст следует чтению SBLGNT «семьдесят два».
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямой и нейтральный перевод, не привносящий дополнительного значения официального апостольского статуса.
- source_word: ἀνὰ δύο δύο
  choice: по двое
  rationale: Естественная русская дистрибутивная конструкция, точно передающая отправление парами.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: перед Собой
  rationale: В данном контексте означает отправить заранее, прежде собственного прибытия; возвратное «Собой» ясно связывает выражение с подлежащим «Господь».
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: во всякий город и место
  rationale: Сохраняет оба существительных исходного текста и обобщающее значение πᾶσαν; «город» является обычным соответствием πόλις.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: куда Сам собирался прийти
  rationale: «Собирался» передаёт намеченное ближайшее действие, а «Сам» сохраняет эмфазу αὐτός. Глагол «прийти» учитывает перспективу мест, куда Он направлялся.
theological_decisions:
- issue: Разночтение в числе назначенных учеников
  choice: семьдесят два
  alternative: семьдесят
  rationale: 'Основной текст следует SBLGNT: ἑβδομήκοντα δύο. Значимое древнее разночтение «семьдесят» сохранено в сноске без попытки богословски разрешить текстологический вопрос.'
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным библейским звучанием. Синтаксис сделан естественным для широкого круга читателей; при этом сохранены повторное указание на места назначения и эмфатическое «Сам».
