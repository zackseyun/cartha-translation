id: LUK.10.42
reference: Luke 10:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: ru
  text: Но нужно немногое — или одно[a]. Ведь Мария избрала благую долю[b], которая не будет отнята у неё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нужно только одно». В контексте трапезы греческие слова могут также означать: «нужно немного блюд — или всего одно».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «благую часть». Слово «доля» может одновременно напоминать о порции за столом и образно указывать на удел в том, что по-настоящему ценно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: Но нужно немногое — или одно
  rationale: Краткая русская формулировка сохраняет противопоставление «немногого» и «одного», а также не уточняет сверх греческого текста, идёт ли речь о блюдах в непосредственной ситуации или об одном действительно необходимом.
- source_word: Μαριὰμ
  choice: Мария
  rationale: Традиционная и общепонятная русская форма имени.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: благую долю
  rationale: «Доля» передаёт значение части или удела и сохраняет возможный смысловой отзвук доли за столом; «благую» прямо отражает ἀγαθή, не вводя отсутствующую в оригинале сравнительную степень «лучшую».
- source_word: ἐξελέξατο
  choice: избрала
  rationale: Средний залог подчёркивает личный выбор Марии; совершенный вид естественно передаёт состоявшееся действие с сохраняющимся результатом.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: которая не будет отнята у неё
  rationale: Формулировка естественно передаёт относительное местоимение, будущее страдательное значение и мысль о неотъемлемости избранной доли.
theological_decisions:
- issue: Связь слов «немногое — или одно» со служением Марфы и выбором Марии
  choice: Сохранить компактное «нужно немногое — или одно», не определяя предмет подразумеваемой необходимости.
  alternative: «Нужно лишь одно» либо «нужно немного блюд — или одно».
  rationale: Греческая формулировка допускает как практическую отсылку к приготовлению еды, так и более широкий смысл единственно необходимого. Перевод сохраняет эту неоднозначность.
- issue: Передача τὴν ἀγαθὴν μερίδα
  choice: «благую долю»
  alternative: «лучшую долю» или «хорошую часть»
  rationale: В оригинале стоит положительная, а не сравнительная степень. «Благая доля» не превращает прямое определение в явное сравнение и сохраняет образ удела.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Избрала» и «благая доля» слегка возвышенны, но прозрачны для широкого читателя; синтаксис остаётся кратким и сохраняет напряжение оригинала.
