source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: ru
  text: Однако не радуйтесь тому, что духи подчиняются вам, а радуйтесь тому, что ваши имена записаны на небесах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в небесах»; греческое слово стоит во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Однако
  rationale: Передаёт сильное ограничительное и противопоставительное значение, естественно вводя поправку к радости учеников.
- source_word: ἐν τούτῳ
  choice: тому
  rationale: В сочетании «не радуйтесь тому, что» естественно передаёт указание на основание радости без тяжеловесной буквальности.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: не радуйтесь ... а радуйтесь
  rationale: Повтор одного глагола сохраняет риторический параллелизм и контраст греческого текста.
- source_word: τὰ πνεύματα
  choice: духи
  rationale: Сохраняет общую лексику оригинала; контекст указывает на враждебных духов, но сам термин не означает непосредственно «бесы».
- source_word: ὑμῖν ὑποτάσσεται
  choice: подчиняются вам
  rationale: Ясно и естественно передаёт нахождение духов под властью учеников, сохраняя форму настоящего времени.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: ваши имена
  rationale: Естественная русская передача греческой конструкции с родительным местоимением.
- source_word: ἐγγέγραπται
  choice: записаны
  rationale: Краткая русская форма страдательного причастия естественно выражает совершившуюся запись и сохраняющийся результат греческого перфекта.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Сохраняет множественное число оригинала и соответствует устойчивому, современному и возвышенному русскому выражению.
theological_decisions:
- issue: Местонахождение записи имён
  choice: на небесах
  alternative: на небе
  rationale: Множественное число οὐρανοῖς сохранено в естественной русской форме, без сведения выражения к традиционному единственному числу.
- issue: Природа духов
  choice: духи
  alternative: бесы / злые духи
  rationale: Контекст подразумевает враждебных духовных существ, однако πνεύματα само по себе остаётся более широким обозначением, поэтому уточнение не внесено в основной текст.
- issue: Аспект ἐγγέγραπται
  choice: записаны
  alternative: были записаны
  rationale: Форма «записаны» по-русски естественно подчёркивает нынешнее состояние как результат совершённого действия, не превращая перфект в простое прошедшее.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским регистром. Конструкция «не радуйтесь тому, что… а радуйтесь тому, что…» сохраняет повтор и риторический контраст оригинала.
