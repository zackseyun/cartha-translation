  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: ru
  text: 'Он сказал ему: «Что написано в Законе? Как ты читаешь?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как ты это понимаешь?» Греческое выражение буквально означает «Как ты читаешь?» и может также подразумевать понимание или толкование прочитанного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Он
  rationale: Артикль употреблён местоименно и указывает на Иисуса; δέ — слабая повествовательная связка, которую по-русски естественно не выражать отдельно.
- source_word: εἶπεν πρὸς αὐτόν
  choice: сказал ему
  rationale: Прямо и естественно передаёт глагол речи и адресата без добавления отсутствующего в греческом оттенка ответа.
- source_word: Ἐν τῷ νόμῳ
  choice: в Законе
  rationale: Здесь νόμος означает признанный священный Закон Израиля; прописная буква ясно обозначает этот корпус Писания.
- source_word: τί γέγραπται
  choice: Что написано
  rationale: Естественная русская передача перфекта страдательного залога, подчёркивающего сохраняющий силу записанный текст.
- source_word: πῶς ἀναγινώσκεις
  choice: Как ты читаешь?
  rationale: Сохраняет основное значение ἀναγινώσκω («читать») и открытость вопроса, который в данном контексте может также касаться понимания и толкования.
theological_decisions:
- issue: Значение νόμος в вопросе Иисуса
  choice: Закон как данное Израилю и признанное Писание
  alternative: Тора; закон в общем смысле
  rationale: Контекст разговора со знатоком Закона указывает на священный Закон Израиля, но перевод не сужает значение до отдельной части или частной богословской системы.
- issue: Смысл πῶς ἀναγινώσκεις
  choice: Сохранить буквальное «Как ты читаешь?»
  alternative: «Как ты это понимаешь?» или «Как ты это толкуешь?»
  rationale: Вопрос может подразумевать понимание или толкование, однако сам греческий глагол означает «читать»; буквальная формулировка сохраняет риторическую и смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная речь. Местоимение «ты» соответствует форме единственного числа и прямому личному обращению.
