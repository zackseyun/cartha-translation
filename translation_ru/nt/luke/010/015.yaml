source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: ru
  text: И ты, Капернаум, неужели будешь вознесён до неба? До Аида[a] будешь низвергнут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до царства мёртвых». В греческом тексте — «Аид» (ᾅδης), не геенна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Капернаум
  rationale: Использована устоявшаяся русская форма библейского географического названия.
- source_word: μὴ ... ὑψωθήσῃ
  choice: неужели будешь вознесён
  rationale: Конструкция передана как риторический вопрос, предполагающий отрицательный ответ. «Вознесён» сохраняет пассивную форму и образ возвышения.
- source_word: ἕως οὐρανοῦ
  choice: до неба
  rationale: Предлог с родительным обозначает предел; перевод сохраняет пространственный образ и противопоставление нисхождению.
- source_word: ἕως τοῦ ᾅδου
  choice: до ада
  rationale: Русское «ад» здесь употреблено в его библейском значении царства мёртвых; примечание уточняет, что речь идёт об аде (ᾅδης), а не о геенне.
- source_word: καταβιβασθήσῃ
  choice: будешь низвергнут
  rationale: Передаёт будущую пассивную форму, вынужденное нисхождение и оттенок суда; «низойдёшь» ослабило бы каузативно-пассивный смысл.
theological_decisions:
- issue: Передача ᾅδης
  choice: ад с пояснительной сноской
  alternative: царство мёртвых
  rationale: В русском библейском употреблении «ад» может обозначать мир мёртвых, однако способен быть понят как место окончательного наказания. Сноска сохраняет различие между ᾅδης и геенной, не разрешая богословское значение сверх того, что выражено в греческом тексте.
- issue: Синтаксис μὴ ... ὑψωθήσῃ
  choice: 'риторический вопрос: «неужели будешь вознесён…?»'
  alternative: 'утверждение: «не будешь вознесён…»'
  rationale: Вопросительная пунктуация критического текста и частица μή естественно допускают вопрос, ожидающий отрицательного ответа; такая передача сохраняет риторическую силу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллель «до неба — до ада» сохраняет вертикальный образ оригинала; «неужели» ясно обозначает риторический вопрос.
