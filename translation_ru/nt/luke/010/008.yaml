  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: ru
  text: И в какой бы город вы ни вошли, если вас там примут, ешьте то, что вам подадут.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: в какой бы город
  rationale: Сочетание относительного местоимения с ἄν выражает неопределённо-обобщённое значение; русская конструкция «в какой бы город… ни» передаёт его естественно и сохраняет направление движения, выраженное εἰς.
- source_word: εἰσέρχησθε
  choice: вы ни вошли
  rationale: 'Настоящее сослагательное в обобщённой конструкции по-русски естественно передаётся формой совершенного вида с частицей «ни»: «в какой бы город вы ни вошли».'
- source_word: δέχωνται ὑμᾶς
  choice: если вас там примут
  rationale: δέχομαι допускает значения «принять» и «радушно встретить». «Примут» ближе к лексической форме оригинала, а «там» ясно связывает неопределённых действующих лиц с жителями города. Союз καί в этой конструкции естественно передан условным «если».
- source_word: ἐσθίετε
  choice: ешьте
  rationale: Простая форма повелительного наклонения точно и естественно передаёт наставление.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: то, что вам подадут
  rationale: В контексте трапезы παρατίθημι означает ставить перед кем-либо или подавать пищу. «То, что вам подадут» — естественная современная русская формулировка, сохраняющая пассивную направленность действия.
