  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: ru
  text: 'Но в какой бы город вы ни вошли, если вас не примут, выйдите на его улицы[a] и скажите:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на его площади»; греческое слово обозначает широкие открытые улицы или общественные площади.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: если вы войдёте в какой-нибудь город
  rationale: Неопределённо-относительная конструкция с ἄν описывает любой возможный случай. По-русски условная формулировка с «какой-нибудь город» естественно передаёт этот открытый, обобщённый смысл.
- source_word: εἰσέλθητε
  choice: войдёте
  rationale: Аорист конъюнктива в неопределённо-относительной конструкции передаёт предполагаемое вступление в город; «войдёте» кратко и естественно сохраняет направленность движения.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: вас там не примут
  rationale: δέχομαι здесь означает принять или приветить посланников. «Не примут» сохраняет широту смысла и миссионный контекст, а «там» естественно указывает на жителей названного города, не добавляя нового действующего лица.
- source_word: ἐξελθόντες
  choice: выйдите
  rationale: 'Причастие обозначает действие, предшествующее повелению εἴπατε. В русском естественно передать последовательность двумя однородными повелительными формами: «выйдите… и скажите».'
- source_word: τὰς πλατείας αὐτῆς
  choice: на его улицы
  rationale: πλατεῖαι обозначает широкие открытые улицы или общественные площади. «Улицы» естественно для основного текста, а публичный и открытый характер места сохранён в сноске.
- source_word: εἴπατε
  choice: скажите
  rationale: Прямое соответствие аористному императиву λέγω, вводящему речь в следующем стихе.
