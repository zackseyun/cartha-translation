reference: Luke 10:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: ru
  text: 'В тот же час Иисус возликовал в Святом Духе и сказал: «Прославляю Тебя[a], Отец, Господь неба и земли, за то, что Ты скрыл это от мудрых и разумных и открыл младенцам[b]. Да, Отец, ибо так было благоугодно Тебе[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благодарю Тебя». Греческий глагол в молитве может выражать как прославление, так и благодарность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «младенцам». Здесь это, вероятно, образ зависимых, смиренных или незначительных в глазах общества людей.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ибо такова была Твоя благая воля»; «ибо таково было Твоё благоволение».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: В тот же час
  rationale: Передаёт временной оборот и усиление указательным местоимением естественным современным русским языком.
- source_word: ἠγαλλιάσατο
  choice: возликовал
  rationale: Глагол обозначает сильную, торжествующую радость; «возликовал» сохраняет интенсивность лучше, чем нейтральное «обрадовался».
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: в Святом Духе
  rationale: Артикли при существительном и определении наиболее естественно указывают на Святого Духа; предлог «в» сохраняет возможный оттенок сферы действия, не исключая инструментального смысла дательного падежа.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Прославляю Тебя
  rationale: В обращённой к Отцу молитве глагол выражает хвалу и благодарение. Основной текст передаёт хвалу, а допустимое «благодарю» отмечено в сноске.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Отец, Господь неба и земли
  rationale: Сохранены два обращения в приложении и обычное богословски нейтральное соответствие κύριος — «Господь».
- source_word: σοφῶν καὶ συνετῶν
  choice: мудрых и разумных
  rationale: Точно и естественно передаёт пару характеристик, не сужая второе слово до образованности или учёности.
- source_word: ἀπεκάλυψας αὐτὰ νηπίοις
  choice: открыл младенцам
  rationale: «Открыл» сохраняет прямой контраст со «скрыл», а «младенцам» передаёт конкретный образ исходного слова, допускающий метафорическое понимание.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: так было благоугодно Тебе
  rationale: Естественный русский оборот, передающий Божье благоволение и соответствие Его воле без искусственной кальки «перед Тобой».
theological_decisions:
- issue: Референт τῷ πνεύματι τῷ ἁγίῳ
  choice: Святой Дух как личный божественный референт
  alternative: в духе / Своим духом
  rationale: Греческая конструкция с артиклями наиболее прямо обозначает Святого Духа. Формулировка не сводит выражение лишь к внутреннему эмоциональному состоянию Иисуса.
- issue: Причинность сокрытия и откровения
  choice: за то, что Ты скрыл… и открыл
  alternative: потому что Ты скрыл… и открыл
  rationale: Сохранено прямое утверждение о действии Отца без смягчения богословского напряжения; «за то, что» естественно связано с глаголом хвалы/благодарения.
- issue: Смысл εὐδοκία
  choice: было благоугодно Тебе
  alternative: такова была Твоя благая воля / таково было Твоё благоволение
  rationale: Основной вариант сохраняет идею Божьего благоволения и решения, не выбирая чрезмерно узко между удовольствием, одобрением и волей.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи-молитвы. Имя «Иисус» добавлено вместо местоимения, поскольку стих в отрыве от контекста требует ясного субъекта; оно не меняет референта. Прописные буквы в местоимениях обращения к Богу поддерживают традиционно-почтительный русский регистр, оставаясь редакционным, а не смысловым решением.
