  terminology: '«Перевязал», «раны», «оливковое масло», «вино», «животное», «гостиница» и «позаботился» уместны. Примечание a лучше формулировать как вариант перевода, а не как строгое буквальное соответствие: «обвязал» ближе к образу глагола, но не является единственно возможной буквальной передачей.'
