  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: ru
  text: Он подошёл, перевязал ему раны[a], поливая их оливковым маслом и вином. Затем он посадил его на своё животное[b], привёз в гостиницу и позаботился о нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обвязал ему раны».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обозначает животное, используемое для езды или перевозки грузов.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: подошёл
  rationale: Аористное причастие передаёт приближение самарянина к раненому; личная форма естественна для современного русского повествования.
- source_word: κατέδησεν τὰ τραύματα αὐτοῦ
  choice: перевязал ему раны
  rationale: Глагол означает обвязать или перевязать раны. Русское «перевязал» точно передаёт оказание первой помощи, а конструкция с «ему» звучит естественно.
- source_word: ἐπιχέων
  choice: поливая их
  rationale: Причастие обозначает сопутствующее действие и буквально указывает на наливание жидкостей на раны; местоимение «их» устраняет неясность.
- source_word: ἔλαιον
  choice: оливковым маслом
  rationale: В новозаветном греческом ἔλαιον обычно обозначает масло из оливок; конкретизация понятна современному читателю и соответствует историческому предмету.
- source_word: οἶνον
  choice: вином
  rationale: Прямой и естественный русский эквивалент без добавления в основной текст предполагаемой лечебной функции.
- source_word: ἐπιβιβάσας
  choice: посадил его на
  rationale: Естественно передаёт помещение раненого на верховое или вьючное животное.
- source_word: τὸ ἴδιον κτῆνος
  choice: своё животное
  rationale: «Своё» сохраняет усиленное указание на принадлежность, а «животное» не сужает более широкое значение κτῆνος до конкретного вида.
- source_word: πανδοχεῖον
  choice: гостиницу
  rationale: Обозначает постоялый двор или место, где принимали путников; «гостиница» — ясный современный эквивалент.
- source_word: ἐπεμελήθη αὐτοῦ
  choice: позаботился о нём
  rationale: Передаёт личную заботу и внимание к пострадавшему естественным современным русским выражением.
theological_decisions: []
