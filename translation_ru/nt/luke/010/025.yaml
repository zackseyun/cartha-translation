source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: ru
  text: 'И вот, один знаток Закона[a] встал и, испытывая его, спросил: «Учитель, что мне сделать, чтобы унаследовать вечную жизнь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человек, сведущий в Моисеевом законе и его толковании; греческое слово здесь не означает юриста в современном светском смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет повествовательный переход и привлекающую внимание силу ἰδού, оставаясь естественным для современного русского языка.
- source_word: νομικός τις
  choice: один знаток Закона
  rationale: Передаёт не современного юриста, а специалиста по Моисееву закону. Оборот «знаток Закона» понятнее современному читателю, чем книжное «законовед».
- source_word: ἀνέστη
  choice: встал
  rationale: Прямо и естественно передаёт действие, обозначенное аористом.
- source_word: ἐκπειράζων αὐτὸν
  choice: испытывая его
  rationale: Сохраняет смысл проверки или испытания, не усиливая его до попытки склонить к греху, что могло бы подразумевать слово «искушая».
- source_word: λέγων
  choice: спросил
  rationale: В русском повествовании естественно преобразует причастную конструкцию с последующим вопросом в личную форму глагола речи.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Точно и современно передаёт обращение Διδάσκαλε без архаического оттенка слова «Наставник» или возможной двусмысленности слова «Господин».
- source_word: τί ποιήσας
  choice: что мне сделать
  rationale: Естественно передаёт практический вопрос о действии, представленном как условие достижения результата, не добавляя богословского объяснения.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшийся и точный русский эквивалент, понятный без пояснений.
- source_word: κληρονομήσω
  choice: унаследовать
  rationale: Сохраняет важную метафору получения наследства и не сводит её к нейтральному «получить».
theological_decisions:
- issue: Значение νομικός в иудейском контексте
  choice: знаток Закона
  alternative: законовед; учитель Закона; юрист
  rationale: Речь идёт о человеке, сведущем в толковании Торы, а не о светском юристе современного типа. Выбранный вариант передаёт это прямо и без конфессиональной конкретизации.
- issue: Смысл конструкции τί ποιήσας ... κληρονομήσω
  choice: что мне сделать, чтобы унаследовать вечную жизнь?
  alternative: что мне делать, чтобы наследовать вечную жизнь?
  rationale: Формулировка сохраняет поставленный собеседником вопрос о требуемом действии и одновременно метафору наследования, не разрешая возникающее богословское напряжение от лица переводчика.
- issue: Оттенок ἐκπειράζων
  choice: испытывая его
  alternative: искушая его; желая проверить его
  rationale: Перевод сохраняет возможный оттенок недоброжелательной или испытующей проверки, но не утверждает более определённый мотив, чем выражен в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов и синтаксис сделаны естественными для устной реплики; метафора наследования и испытующий характер вопроса сохранены. Местоимение «его» дано со строчной буквы, поскольку в греческом тексте нет типографического различения для почтительного написания.
