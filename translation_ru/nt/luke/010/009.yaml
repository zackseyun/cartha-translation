source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: ru
  text: 'Исцеляйте больных в нём и говорите им: «Царство Божье приблизилось к вам».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Царство Божье уже близко к вам».'
    reason: Лексическая альтернатива, передающая настоящее состояние, возникшее в результате приближения, выраженного формой ἤγγικεν.
lexical_decisions:
- source_word: θεραπεύετε
  choice: исцеляйте
  rationale: Настоящее повелительное наклонение передаёт продолжающееся поручение. «Исцеляйте» естественно сочетается с больными и точнее контекста, чем более широкое «ухаживайте».
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: больных в нём
  rationale: В сочетании с θεραπεύετε прилагательное ἀσθενεῖς обозначает прежде всего больных. Местоимение αὐτῇ относится к упомянутому ранее городу; по-русски поэтому употреблено «в нём».
- source_word: λέγετε αὐτοῖς
  choice: говорите им
  rationale: Прямо и естественно передаёт повелительное λέγετε и сохраняет повторяющийся характер действия.
- source_word: Ἤγγικεν
  choice: приблизилось
  rationale: Совершенный вид передаёт совершившееся приближение с актуальным результатом, не сводя высказывание ни к полной осуществлённости, ни только к будущей близости.
- source_word: ἐφ’ ὑμᾶς
  choice: к вам
  rationale: При глаголе приближения ἐπί с винительным выражает направленность к адресатам. «К вам» — естественный современный русский эквивалент.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся, понятное современному читателю библейское выражение, сохраняющее широкий смысл Божьего царствования и царства.
theological_decisions:
- issue: Смысл возвещения о Царстве
  choice: Фраза возвещает, что Царство Божье приблизилось к слушателям, не уточняя, осуществилось ли оно уже во всей полноте.
  alternative: «Царство Божье уже полностью наступило» или «Царство Божье пока лишь ожидается в будущем».
  rationale: Перфект ἤγγικεν указывает на совершившееся приближение с нынешней значимостью, однако сам стих не разрешает напряжение между настоящим и будущим аспектами Царства.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Божье» выбрано как естественная современная форма; синтаксис сохраняет краткость и прямоту греческих повелений.
