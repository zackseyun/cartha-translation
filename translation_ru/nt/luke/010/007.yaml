id: LUK.10.7
reference: Luke 10:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: ru
  text: Оставайтесь в том же доме, ешьте и пейте то, что они дают, ведь работник достоин своей платы.[a] Не переселяйтесь из дома в дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «работник достоин полагающейся ему платы».'
    reason: 'Лексическая альтернатива: такая формулировка явно передаёт смысл платы, причитающейся работнику, тогда как основной текст ближе сохраняет форму τοῦ μισθοῦ αὐτοῦ.'
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: Оставайтесь в том же доме
  rationale: Сочетание с αὐτῇ отсылает к уже упомянутому дому и подчёркивает, что ученикам следует оставаться именно там, а не искать другое жильё.
- source_word: μένετε
  choice: Оставайтесь
  rationale: Настоящее повелительное наклонение выражает продолжающееся пребывание; «оставайтесь» естественно передаёт это в современном русском языке.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: ешьте и пейте
  rationale: Причастия обозначают действия, сопутствующие пребыванию. Координированные повелительные формы звучат по-русски естественнее буквальной причастной конструкции и сохраняют смысл.
- source_word: τὰ παρ’ αὐτῶν
  choice: то, что они дают
  rationale: Выражение означает пищу и питьё, предоставляемые хозяевами. Формулировка ясна и не добавляет отсутствующего в данном стихе уточнения «что поставят перед вами».
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: ведь работник достоин своей платы
  rationale: γάρ вводит основание для принятия гостеприимства; μισθός здесь означает плату за труд, а возвратное «своей» естественно передаёт αὐτοῦ при подлежащем «работник».
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Не переходите из дома в дом
  rationale: Запрет касается смены места проживания. «Переходить из дома в дом» точно и естественно передаёт образ греческого выражения.
theological_decisions:
- issue: Мужской род в выражении ὁ ἐργάτης … αὐτοῦ
  choice: работник достоин своей платы
  alternative: работающие достойны платы
  rationale: Греческий текст использует существительное и местоимение мужского рода в единственном числе. Русский перевод сохраняет эту грамматическую форму, не устраняя при этом общий характер изречения.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанная. Повеления переданы во множественном числе, соответственно обращению Иисуса к посланным ученикам.
