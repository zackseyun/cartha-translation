source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: ru
  text: '«Даже пыль из вашего города, прилипшую к нашим ногам, мы стираем, свидетельствуя против вас. Но знайте: Царство Божье приблизилось».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κονιορτός
  choice: пыль
  rationale: Существительное обозначает именно пыль; этот выбор также сохраняет символический смысл жеста.
- source_word: κολληθέντα
  choice: приставшую
  rationale: Причастие обозначает плотное прилипание; «приставшую» естественно описывает пыль на ногах.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: вашего города
  rationale: Родительный оборот с подразумеваемым происхождением естественно передаёт значение «из вашего города» без тяжеловесности.
- source_word: εἰς τοὺς πόδας
  choice: к нашим ногам
  rationale: В данном идиоматическом обороте фраза описывает пыль, приставшую к ногам посланников; местоимение «нашим» восстановлено из ἡμῖν.
- source_word: ἀπομασσόμεθα
  choice: мы вытираем
  rationale: Глагол конкретно означает «вытирать, стирать», а не обычное для параллельных мест «отряхивать».
- source_word: ὑμῖν
  choice: вам в знак осуждения
  rationale: Дательный падеж здесь указывает на направленность символического действия против отвергших весть. Развёрнутая формулировка ясна по-русски и не делает жест обычной передачей чего-либо адресатам.
- source_word: πλήν
  choice: но
  rationale: Краткий противительный союз естественно вводит истину, которая остаётся в силе несмотря на жест суда.
- source_word: γινώσκετε
  choice: знайте
  rationale: Повелительное наклонение прямо призывает признать и помнить сообщаемую истину.
- source_word: ἤγγικεν
  choice: приблизилось
  rationale: Русский совершенный вид передаёт наступившее приближение с сохраняющимся результатом, не утверждая окончательного осуществления.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устойчивое, понятное и стилистически достойное русское соответствие, сохраняющее образ царства без сведения его только к отвлечённому правлению.
theological_decisions:
- issue: Смысл вытирания пыли
  choice: Символическое свидетельство и знак осуждения отвергшему весть городу
  alternative: Чисто бытовое очищение ног после дороги
  rationale: Контекст наставления посланникам и дательный ὑμῖν придают жесту направленный, свидетельствующий характер; перевод обозначает это без догматического расширения.
- issue: Смысл приближения Божьего Царства
  choice: Царство уже приблизилось и остаётся близко в миссии и вести посланников Иисуса, даже если их отвергают
  alternative: Царство только скоро наступит либо уже полностью осуществилось
  rationale: Перфект ἤγγικεν выражает достигнутую близость с продолжающимся значением, сохраняя напряжение между уже наступившей близостью и будущей полнотой.
translation_notes:
  register: Современный литературный русский язык с прямой речью и умеренно торжественной библейской лексикой. Синтаксис сделан естественным для обычного читателя; «Царство Божье» сохраняет традиционную узнаваемость. Необычный глагол ἀπομασσόμεθα передан точно как «вытираем», а неоднозначность перфекта ἤγγικεν пояснена в сноске.
