  source_fidelity: Текст точно передаёт греческий оригинал. «Желая оправдать себя» корректно выражает θέλων δικαιῶσαι ἑαυτόν как мотив попытки представить себя правым. «Спросил Иисуса» — естественная русская передача εἶπεν πρὸς τὸν Ἰησοῦν в контексте прямого вопроса. «А кто мой ближний?» сохраняет и прямоту τίς ἐστίν μου πλησίον, и дискурсивную связь Καὶ.
  naturalness: Фраза звучит естественно и литературно по-русски. Порядок слов, «желая», «спросил» и начальное «А» уместны для краткого повествовательного контекста.
  terminology: «Оправдать себя» сохраняет лексическую связь с δικαιόω, не навязывая технического догматического смысла. «Ближний» — традиционный, понятный и контекстуально необходимый термин, сохраняющий связь с предшествующей заповедью.
