  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: ru
  text: 'Но он, желая оправдать себя, спросил Иисуса: «А кто мой ближний?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: желая
  rationale: Причастие настоящего времени передаёт мотив говорящего; «желая» естественно сохраняет обстоятельственный характер греческой формы.
- source_word: δικαιῶσαι ἑαυτόν
  choice: оправдать себя
  rationale: В данном контексте выражение означает попытку показать себя правым, не навязывая ему узкотехнический богословский смысл.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: спросил Иисуса
  rationale: Хотя буквально сказано «сказал Иисусу», форма прямой речи является вопросом, поэтому «спросил» естественно и точно передаёт речевое действие по-русски.
- source_word: Καὶ
  choice: А
  rationale: В начале уточняющего вопроса русское «А» естественно передаёт связь с предшествующей репликой и оттенок встречного уточнения.
- source_word: τίς ἐστίν μου πλησίον
  choice: кто мой ближний
  rationale: «Ближний» — укоренившийся и понятный эквивалент субстантивированного πλησίον, сохраняющий связь с цитатой из Торы.
theological_decisions:
- issue: Смысл δικαιῶσαι ἑαυτόν
  choice: Попытка показать себя правым
  alternative: Оправдать себя в более широком нравственном или техническом судебно-богословском смысле
  rationale: Непосредственный контекст представляет юридико-этический разговор. Формулировка «оправдать себя» сохраняет лексическую связь и повествовательную иронию, не превращая выражение в специальный термин учения об оправдании.
- issue: Объём понятия πλησίον
  choice: Сохранён прямой вопрос «кто мой ближний?»
  alternative: «Кого считать моим ближним?»
  rationale: Альтернатива явнее выражает подразумеваемое стремление установить границы понятия, но прямой перевод лучше сохраняет лаконичность и открытую напряжённость исходного вопроса.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная повествовательная формулировка. Устойчивое библейское слово «ближний» сохранено как понятное в контексте. Маркеры сносок не добавлены, поскольку основной текст не требует отдельной текстологической или смысловой оговорки.
