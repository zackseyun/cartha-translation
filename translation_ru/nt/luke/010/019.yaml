reference: Luke 10:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: ru
  text: Вот, Я дал вам власть наступать на змей и скорпионов и власть над всей силой врага[a], и ничто ни в коем случае не причинит вам вреда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В контексте под «врагом» может подразумеваться сатана, однако греческий текст прямо его не называет.
    reason: theological_ambiguity
  - marker: b
    text: 'Греческий текст содержит усиленное отрицание; также возможно: «ничто вам никак не повредит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Вот
  rationale: Естественный для современного русского языка указательно-побудительный маркер, сохраняющий привлечение внимания без излишней архаичности.
- source_word: δέδωκα
  choice: Я дал
  rationale: Русское прошедшее совершенного вида выражает совершённое действие с сохраняющимся результатом; буквальное «Я имею данною» неестественно.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Передаёт предоставленное полномочие и сохраняет отличие от δύναμις — «сила» — далее в стихе.
- source_word: τοῦ πατεῖν ἐπάνω
  choice: наступать на
  rationale: Сохраняет конкретный пространственный образ и звучит естественно; «попирать» было бы более архаичным и могло бы чрезмерно усилить значение.
- source_word: ὄφεων καὶ σκορπίων
  choice: змей и скорпионов
  rationale: Прямой современный эквивалент, сохраняющий буквальный образ и не навязывающий исключительно символическое прочтение.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: одолевать всю силу
  rationale: В данном контексте передаёт превосходство дарованной власти над силой врага и избегает неестественного русского сочетания «власть над всей силой» после однородного инфинитива.
- source_word: τοῦ ἐχθροῦ
  choice: врага
  rationale: Сохраняет единственное число и личностный оттенок, не уточняя в основном тексте, что речь идёт о сатане.
- source_word: οὐδὲν ὑμᾶς οὐ μὴ ἀδικήσῃ
  choice: ничто ни в коем случае не причинит вам вреда
  rationale: «Ни в коем случае» естественно передаёт усиленное отрицание οὐ μή; «причинит вред» соответствует контекстуальному значению ἀδικέω.
theological_decisions:
- issue: Кого обозначает «враг»
  choice: Оставлено общее обозначение «враг».
  alternative: «сатана» или «дьявол»
  rationale: Контекст указывает на сатанинское противодействие, однако сам греческий текст не называет врага прямо; перевод не должен устранять эту недосказанность.
- issue: Буквальный или символический смысл змей и скорпионов
  choice: В основном тексте сохранён буквальный образ.
  alternative: Прямо истолковать их как враждебные духовные силы.
  rationale: Лексически речь идёт о змеях и скорпионах, тогда как контекст допускает также образное прочтение; перевод сохраняет эту смысловую напряжённость.
- issue: Объём обещания о невредимости
  choice: Передано категорическое обещание стиха без добавочного ограничения.
  alternative: Уточнить его как обещание лишь духовной безопасности или безопасности только в данной миссии.
  rationale: Такие ограничения могут быть предметом толкования, но прямо в тексте не выражены; усиленное отрицание следует сохранить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. «Вот» сохраняет акцент ἰδού, а пара «власть — сила» отражает различие ἐξουσία и δύναμις. Местоимение «Я» написано с прописной буквы по принятой русской библейской традиции.
