  rationale: 'Заменено «одолевать всю силу врага» на «власть над всей силой врага», чтобы точно передать ἐπὶ πᾶσαν τὴν δύναμιν и сохранить различие между дарованной властью и силой врага. Повтор слова «власть» — безопасное для русского синтаксическое развёртывание подразумеваемого управления, не меняющее смысла. Сноска о враге смягчена: она отмечает контекстуальную возможность, а не утверждает вероятную идентификацию.'
