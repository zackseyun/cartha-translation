source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: ru
  text: 'И, обратившись к ученикам отдельно от других[a], сказал: «Блаженны глаза, видящие то, что вы видите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наедине».'
    reason: Лексический вариант для κατ’ ἰδίαν; идиома обозначает обращение к ученикам в отсутствие или отдельно от остальных.
lexical_decisions:
- source_word: στραφεὶς
  choice: повернувшись
  rationale: Аористное причастие обозначает действие Иисуса перед речью; русский деепричастный оборот естественно сохраняет эту связь.
- source_word: πρὸς τοὺς μαθητὰς
  choice: к ученикам
  rationale: Предлог πρὸς передаёт направленность поворота, а «ученики» является устойчивым и точным соответствием μαθηταί.
- source_word: κατ’ ἰδίαν
  choice: наедине
  rationale: Идиома означает речь отдельно от других; «наедине» кратко и естественно передаёт приватный характер обращения.
- source_word: Μακάριοι
  choice: Блаженны
  rationale: В формуле блаженства слово выражает признание особого благословенного положения, а не просто субъективное счастье.
- source_word: οἱ ὀφθαλμοὶ οἱ βλέποντες
  choice: глаза, которые видят
  rationale: Сохранён выразительный греческий образ глаз как носителей восприятия, без поясняющего расширения.
- source_word: ἃ βλέπετε
  choice: то, что видите вы
  rationale: Передаёт относительную конструкцию и сохраняет смысловое ударение на опыте самих учеников.
theological_decisions:
- issue: Смысл формулы блаженства
  choice: Провозглашение блаженного положения тех, кому дано видеть происходящее
  alternative: Высказывание лишь об эмоциональном счастье
  rationale: Μακάριοι в этой форме имеет характер провозглашения блаженства; перевод не уточняет сверх текста, какие именно дела или откровения имеются в виду.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской формулой «Блаженны». Порядок слов «видите вы» слегка маркирован и подчёркивает контраст, присутствующий в обращении к ученикам.
