base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: ru
  text: Идите! Вот, я посылаю вас, как ягнят[a] среди волков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — именно «ягнят», а не более общее «овец».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «посреди волков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάγετε
  choice: Идите
  rationale: Форма повелительного наклонения во втором лице множественного числа. Краткое «Идите» естественно передаёт поручение отправиться в путь.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Частица привлекает внимание к последующим словам. «Вот» сохраняет эту функцию и звучит естественно в современном литературном русском языке.
- source_word: ἀποστέλλω
  choice: посылаю
  rationale: Настоящее время первого лица единственного числа. «Посылаю» точно и без лишнего толкования передаёт действие Иисуса в контексте поручения.
- source_word: ὑμᾶς
  choice: вас
  rationale: Местоимение второго лица множественного числа; русская форма «вас» явно сохраняет множественное число.
- source_word: ὡς
  choice: как
  rationale: Вводит сравнение, а не утверждение тождества; «как» — прямой и естественный русский эквивалент.
- source_word: ἄρνας
  choice: ягнят
  rationale: Греческое слово обозначает именно ягнят, а не овец вообще; выбор сохраняет образ особой беззащитности.
- source_word: ἐν μέσῳ λύκων
  choice: среди волков
  rationale: Естественная русская передача выражения «посреди волков», сохраняющая образ окружения враждебными силами.
theological_decisions:
- issue: Метафорический образ учеников, отправляемых на служение
  choice: как ягнят среди волков
  alternative: как овец среди волков
  rationale: В исходном тексте стоит ἄρνας — «ягнят», а не более общее слово «овец». Сохранение этого образа подчёркивает уязвимость посланных и не гармонизирует стих с похожими изречениями в других местах.
translation_notes:
  register: Современный литературный русский язык с краткой, энергичной формой поручения. Восклицательный знак после «Идите» передаёт самостоятельность и настойчивость повеления; «Вот» сохраняет функцию привлечения внимания без архаичного оттенка. Местоимение «я» дано со строчной буквы согласно общим нормам современного русского письма.
