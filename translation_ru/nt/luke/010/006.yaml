  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: ru
  text: И если там найдётся человек мира[a], ваш мир останется с ним; если же нет, он вернётся к вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «сын мира» — семитское выражение; возможно, человек, открытый для мира.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: человек, готовый принять мир
  rationale: Семитское выражение буквально означает «сын мира», то есть человека, соответствующего возвещаемому миру или восприимчивого к нему. В современном русском буквальная калька «сын мира» малопонятна и может быть неверно понята, поэтому смысл идиомы передан в основном тексте, а буквальная форма сохранена в сноске.
- source_word: ἐπαναπαήσεται ἐπ’ αὐτόν
  choice: пребудет на нём
  rationale: Глагол передаёт образ мира, который обретает покой и остаётся на человеке. «Пребудет» естественно сочетается с «на нём» и сохраняет образ длительного пребывания.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: ваш мир
  rationale: Сохранена прямая притяжательная конструкция; речь идёт о произнесённом учениками приветствии или благословении мира, однако основной текст не сужает значение до одной лишь формулы приветствия.
- source_word: εἰ δὲ μήγε
  choice: если же нет
  rationale: Кратко и естественно передаёт усиленное отрицательное условие и противопоставление.
- source_word: ἀνακάμψει ἐφ’ ὑμᾶς
  choice: возвратится к вам
  rationale: Передаёт движение обратно; русское управление «возвратится к вам» звучит естественно, хотя предлог в греческом буквально означает «на».
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: И если там окажется
  rationale: Сохраняет соединительное «и», условность и локативное «там»; «окажется» естественно вводит наличие такого человека в доме.
theological_decisions:
- issue: Передача мужской семитской идиомы υἱὸς εἰρήνης
  choice: Смысловая передача «человек, готовый принять мир» в основном тексте с буквальным вариантом в сноске
  alternative: «сын мира»
  rationale: Буквальная форма сохраняет грамматический род и образ источника, но в современном русском непрозрачна. Смысловая передача не утверждает, что человек просто миролюбив, а связывает его с принятием возвещаемого мира; сноска позволяет увидеть исходную идиому и сохраняет её смысловую широту.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранены образ «вашего мира», пребывающего на человеке, и его возвращения; непрозрачная семитская идиома раскрыта без конфессионального истолкования.
