  verdict: revise
  source_fidelity: 'Основная проблема — «человек, готовый принять мир» слишком определённо истолковывает υἱὸς εἰρήνης как готовность принять возвещённый мир. В контексте это возможный смысл, но сама семитская идиома оставляет более широкое значение: человек, связанный с миром / восприимчивый к нему. «Человек мира» лучше сохраняет эту сжатую и намеренно образную характеристику. «Останется с ним» естественно передаёт образ мира, находящего на человеке покой, без не вполне современного «пребудет на нём».'
  naturalness: «Человек мира» и «ваш мир останется с ним» звучат по-современному литературно и сохраняют возвышенный, но не архаичный регистр высказывания. «Вернётся к вам» — естественное русское соответствие ἀνακάμψει ἐφ’ ὑμᾶς.
  terminology: «Мир» сохранён как ключевое слово и не подменён «приветствием» или «благословением». Сноска фиксирует буквальное «сын мира» и осторожно поясняет идиому, не превращая одно контекстуально вероятное толкование в единственно возможное.
