base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: ru
  text: 'И Он сказал им: «Жатвы много, а работников мало. Поэтому просите Господа жатвы, чтобы Он послал[a] работников на Свою жатву».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выслал» или «вытолкнул»; греческий глагол может передавать более энергичное действие, чем простое «послал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: сказал
  rationale: Хотя имперфект допускает перевод «говорил», в повествовательном введении естественное русское «сказал» передаёт смысл без существенной потери.
- source_word: δὲ
  choice: и
  rationale: Здесь δέ служит мягкой повествовательной связкой; союз «и» естественно продолжает рассказ.
- source_word: θερισμός
  choice: жатва
  rationale: Сохраняет сельскохозяйственный образ и его метафорический смысл.
- source_word: πολύς
  choice: много
  rationale: Сочетание «жатвы много» естественно по-русски выражает обилие и хорошо контрастирует с «работников мало».
- source_word: ἐργάται
  choice: работники
  rationale: Современное и ясное обозначение тех, кто трудится на жатве; менее архаично, чем «делатели».
- source_word: ὀλίγοι
  choice: мало
  rationale: Прямо и естественно выражает контраст с обилием жатвы.
- source_word: δεήθητε
  choice: просите
  rationale: Передаёт настойчивое обращение с просьбой; религиозный контекст ясно указывает на молитвенное прошение, не требуя добавления отсутствующего в греческом тексте слова «молитесь».
- source_word: οὖν
  choice: поэтому
  rationale: Ясно передаёт вывод, следующий из предыдущего утверждения.
- source_word: κύριος
  choice: Господин
  rationale: Передаёт власть и право распоряжаться жатвой, сохраняя метафорический титул и не уточняя его референта сверх сказанного в тексте.
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно вводит содержание и цель просьбы.
- source_word: ἐκβάλῃ
  choice: выслал
  rationale: Передаёт направленное отправление работников, а возможный более сильный оттенок глагола сохранён в сноске.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: на Свою жатву
  rationale: Естественное русское выражение сохраняет образ жатвы и притяжательное значение αὐτοῦ, не добавляя отсутствующего слова «поле».
theological_decisions:
- issue: Референт и смысл титула «Господин жатвы»
  choice: Сохранить метафорический титул без пояснения, к кому именно он относится.
  alternative: Прямо назвать Бога владельцем жатвы и распорядителем миссии либо усмотреть здесь утверждение власти Иисуса.
  rationale: Текст представляет обладающего властью Господина, Которому принадлежит жатва и Который направляет работников, но в этом стихе не раскрывает референт и возможные христологические следствия.
- issue: Прописные буквы в местоимениях «Он» и «Свою»
  choice: Использовать прописные буквы как согласование с титулом «Господин жатвы», не называя референта прямо.
  alternative: Писать «он» и «свою» со строчной буквы как в греческом письме.
  rationale: В современном русском религиозном регистре прописные буквы помогают избежать восприятия выражения как обозначения обычного землевладельца, при этом сам текст по-прежнему не уточняет референта.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула «жатвы много, а работников мало» проста и понятна; «Господин жатвы» сохраняет исходную метафору и богословскую напряжённость. Маркер [a] поставлен непосредственно после слова, к которому относится примечание.
