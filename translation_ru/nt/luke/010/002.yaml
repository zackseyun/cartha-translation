  terminology: 'κύριος следует передать как «Господь», а не «господин»: последнее в современном русском преимущественно обозначает обычного владельца или обращение и ослабляет титульный характер выражения. «Работники» и «жатва» удачно сохраняют исходный образ. Сноска должна отражать сильный оттенок ἐκβάλλω без неестественного «вытолкнул» в основном тексте.'
