  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: ru
  text: 'Но Господь сказал ей в ответ: «Марфа, Марфа, ты беспокоишься и тревожишься о многом,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Но Господь сказал ей в ответ
  rationale: Причастие ἀποκριθεὶς вместе с εἶπεν образует обычную повествовательную формулу ответа; по-русски она естественно передаётся как «сказал ей в ответ». δὲ выражает мягкое противопоставление жалобе Марфы и передано союзом «но».
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохраняет обычный для Луки повествовательный и христологический титул; вариант «господин» здесь недостаточно передаёт его смысловой вес.
- source_word: Μάρθα Μάρθα
  choice: Марфа, Марфа!
  rationale: Повтор обращения сохранён как выражение настойчивости и тёплого участия. Восклицательный знак естественно оформляет эмоционально окрашенное обращение, не усиливая содержание следующего высказывания.
- source_word: μεριμνᾷς
  choice: беспокоишься
  rationale: Передаёт внутреннюю озабоченность и тревогу естественным современным русским словом.
- source_word: θορυβάζῃ
  choice: тревожишься
  rationale: Передаёт состояние внутреннего смятения и сохраняет отличие от μεριμνᾷς, хотя значения двух глаголов частично перекрываются.
- source_word: περὶ πολλά
  choice: о многом
  rationale: Краткая и естественная русская передача множественного πολλά, сохраняющая широкий, неуточнённый круг забот.
theological_decisions:
- issue: Передача κύριος как титула Иисуса
  choice: Господь
  alternative: господин / учитель
  rationale: В повествовании Луки κύριος несёт не только уважительное, но и христологическое звучание; «Господь» сохраняет эту смысловую напряжённость без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис естественный, при этом повтор имени и два близких по смыслу глагола сохранены. Конечная запятая отражает продолжение прямой речи в следующем стихе.
