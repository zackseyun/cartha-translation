  text: Кто из этих троих, по-твоему, стал ближним тому, кто попал к разбойникам?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто из этих троих, как ты думаешь, оказался ближним тому, кто попал к разбойникам?» Греческий текст буквально говорит «стал ближним», подчёркивая поступок человека, который повёл себя как ближний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: Кто из этих троих
  rationale: В русском вопросительное «кто» естественно при выборе человека из определённой группы; партитивная конструкция передана как «из этих троих», без добавления отсутствующего в греческом слова «людей».
- source_word: πλησίον
  choice: ближним
  rationale: Субстантивированное πλησίον здесь означает человека, проявившего себя как ближний; традиционное русское «ближний» точно сохраняет связь с темой любви к ближнему.
- source_word: δοκεῖ σοι
  choice: по-твоему
  rationale: Естественная современная передача оценки адресата; она сохраняет σοι и вопросительный смысл δοκεῖ, не создавая в русском тяжеловесного «кажется тебе».
- source_word: γεγονέναι
  choice: стал
  rationale: Передаёт γίνομαι динамически, а не как статическое «был», сохраняя поворот вопроса от определения ближнего к тому, кто стал ближним своими действиями.
- source_word: τοῦ ἐμπεσόντος
  choice: тому, кто попал
  rationale: Артиклированное причастие обозначает пострадавшего; «тому, кто» не добавляет указания на пол, уже ясного из контекста.
- source_word: εἰς τοὺς λῃστάς
  choice: к разбойникам
  rationale: Русское устойчивое выражение «попасть к разбойникам» естественно передаёт идиому со значением оказаться в их власти; «разбойники» соответствует λῃσταί точнее, чем более широкое «грабители».
theological_decisions:
- issue: Этический акцент вопроса в притче о милосердном самарянине
  choice: «стал ближним»
  alternative: «был ближним»
  rationale: 'Динамическая передача γεγονέναι сохраняет смысловой поворот: речь не только о том, кого считать ближним, но и о том, кто сам стал ближним пострадавшему, проявив милосердие.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Обращение на «ты» соответствует единственному числу σοι и непосредственному диалогу. Формулировка краткая и естественная, при этом динамическое «стал ближним» сохраняет ключевую особенность греческого текста.
