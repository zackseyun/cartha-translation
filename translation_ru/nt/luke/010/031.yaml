- from: Случилось так, что по той дороге спускался один священник и, увидев его, прошёл мимо по другой стороне дороги[a].
  to: Случайно один священник спускался по той дороге и, увидев его, прошёл мимо него по другой стороне дороги[a].
  rationale: Заменено несколько расплывчатое вводное «Случилось так, что» на прямое «Случайно», соответствующее κατὰ συγκυρίαν. Оборот о прохождении мимо уточнён для естественности русского синтаксиса и сохранения пространственного значения ἀντιπαρῆλθεν. Сноска смягчена, чтобы не приписывать священнику намерение, не выраженное прямо в тексте.
