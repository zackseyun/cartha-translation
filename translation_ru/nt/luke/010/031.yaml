  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: ru
  text: Случайно один священник спускался по той дороге и, увидев его, прошёл мимо него по другой стороне дороги[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошёл мимо»; греческий глагол также может обозначать, что он прошёл по противоположной стороне дороги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: случилось так
  rationale: Передаёт случайное совпадение обстоятельств естественным современным русским выражением, не превращая повествовательную формулу в философское утверждение о случайности.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Это слабая повествовательная связка; в русском ход рассказа естественно передаётся построением фразы без добавления противительного «но» или временного «теперь».
- source_word: ἱερεύς τις
  choice: один священник
  rationale: «Один» естественно передаёт неопределённость τις и вводит конкретного, но не названного участника рассказа; «некий священник» звучало бы более отчуждённо.
- source_word: κατέβαινεν
  choice: спускался
  rationale: Несовершенный вид передаёт продолжавшееся движение, служащее фоном последующему действию.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: по той дороге
  rationale: Предлог «по» идиоматично описывает движение по дороге, а «той» сохраняет указательное значение ἐκείνῃ.
- source_word: ἰδὼν αὐτὸν
  choice: увидев его
  rationale: Деепричастный оборот кратко и естественно передаёт предшествующее обстоятельство аористного причастия.
- source_word: ἀντιπαρῆλθεν
  choice: прошёл мимо по другой стороне дороги
  rationale: Передаёт не только прохождение мимо, но и пространственный оттенок движения по противоположной стороне, содержащийся в сложном греческом глаголе.
theological_decisions:
- issue: Степень намеренности уклонения священника
  choice: 'Сохранён пространственный образ: «прошёл мимо по другой стороне дороги»'
  alternative: «обошёл его стороной»
  rationale: Глагол указывает на прохождение по противоположной стороне и подразумевает избегание, однако перевод не делает внутренний мотив священника более явным, чем это делает сам текст.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет повествовательную простоту притчи. Выражение «один священник» естественнее для широкого круга читателей, чем более книжное «некий священник».
