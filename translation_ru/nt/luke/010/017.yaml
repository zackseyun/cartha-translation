lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: вернулись
  rationale: Аорист ὑποστρέφω обозначает возвращение с порученного служения; «вернулись» естественно и точно передаёт действие.
- source_word: δὲ
  choice: связь передана последовательностью повествования без отдельного союза
  rationale: δέ отмечает развитие рассказа; в современном русском отдельное «тогда» здесь необязательно и могло бы придать излишний временной акцент.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: семьдесят два ученика
  rationale: Основной текст SBLGNT содержит число «семьдесят два». Слово «ученика» добавлено для естественности и ясности по непосредственному контексту обозначенной Иисусом группы, без изменения референта.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Сохраняет именную форму греческого выражения и звучит естественно по-русски.
- source_word: λέγοντες
  choice: и сказали
  rationale: Сочинённая конструкция естественнее русского буквального «говоря» и передаёт сопутствующую возвращению речь.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма обращения к Иисусу; традиционная и живая русская форма слова «Господь».
- source_word: καὶ
  choice: даже
  rationale: В восклицательном контексте καί имеет усилительно-присоединительное значение и выражает удивление учеников.
- source_word: τὰ δαιμόνια
  choice: бесы
  rationale: Прямое и общепонятное новозаветное обозначение враждебных духовных существ; не заменяется толковательным «злые духи».
- source_word: ὑποτάσσεται
  choice: подчиняются
  rationale: Настоящее время передаёт наблюдаемое подчинение; русская форма во множественном числе согласуется с переведённым подлежащим.
- source_word: ἡμῖν
  choice: нам
  rationale: Естественно передаёт дательный падеж лица, которому подчиняются.
- source_word: ἐν τῷ ὀνόματί σου
  choice: во имя Твоё
  rationale: Устойчивое русское выражение передаёт действие силой и властью имени Иисуса, не сводя многозначность оборота только к инструментальному значению.
theological_decisions:
- issue: Разночтение о числе посланных учеников
  choice: семьдесят два
  alternative: семьдесят
  rationale: Основной текст следует предоставленному SBLGNT; значимое древнее разночтение сохраняется в примечании, а не устраняется молча.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным повествовательным регистром. Прямая речь передаёт радостное удивление учеников; местоимение обращения к Иисусу написано с прописной буквы согласно принятой русской библейской стилистике.
