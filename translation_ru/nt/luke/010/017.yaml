  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: ru
  text: 'Семьдесят два вернулись с радостью[a] и сказали: «Господи, даже бесы подчиняются нам во имя Твоё!»'
  philosophy: optimal-equivalence
