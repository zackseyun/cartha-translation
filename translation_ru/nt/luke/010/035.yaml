source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: ru
  text: 'На следующий день он вынул два динария[a], отдал их хозяину гостиницы и сказал: «Позаботься о нём, а сколько ещё потратишь, я возмещу тебе, когда вернусь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Динарий — распространённая римская серебряная монета; обычно он соответствовал примерно дневной плате наёмного работника.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: на следующий день
  rationale: 'Устойчивое временное выражение передано естественно и точно: речь идёт о дне, следующем за описанными событиями.'
- source_word: ἐκβαλών
  choice: вынул
  rationale: В данном контексте причастие обозначает, что человек достал деньги; «вынул» естественно по-русски и не переносит сюда буквальный оттенок выбрасывания.
- source_word: δύο δηνάρια
  choice: два динария
  rationale: Сохранено историческое название римской монеты без замены его толковательным пересчётом в дневной заработок.
- source_word: τῷ πανδοχεῖ
  choice: хозяину гостиницы
  rationale: Слово обозначает человека, содержавшего постоялый двор или гостиницу. Этот вариант понятен современному читателю и точнее, чем устаревшее «содержателю постоялого двора».
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Позаботься о нём
  rationale: Передаёт повеление обеспечить пострадавшему внимательный уход; формулировка естественна, ясна и сохраняет силу императива.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: сколько ещё потратишь
  rationale: Переданы как неопределённый размер расходов, так и значение дополнительных трат сверх уже данных денег.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: когда вернусь
  rationale: Естественно передаёт временное значение конструкции с артиклевым инфинитивом.
- source_word: ἀποδώσω σοι
  choice: я возмещу тебе
  rationale: Точно выражает обещание покрыть понесённые дополнительные расходы и звучит естественно в финансовом контексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и достойной, но не архаичной речью. Местоимение «их» добавлено для естественной русской связности и однозначно относится к двум динариям. Маркер культурной сноски поставлен непосредственно после названия монеты, к которому относится пояснение.
