lexical_decisions:
- source_word: τῇδε
  choice: у неё
  rationale: Указательное местоимение в дательном падеже относится к Марфе из предыдущего стиха; оборот «у неё была» естественно передаёт греческую конструкцию принадлежности.
- source_word: ἀδελφὴ καλουμένη Μαριάμ
  choice: сестра по имени Мария
  rationale: Современный и естественный русский способ сообщить имя сестры, точно передающий καλουμένη.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: сев у ног
  rationale: Аористное причастие обозначает, что Мария заняла место у ног Иисуса; формулировка сохраняет образ ученицы и остаётся естественной по-русски.
- source_word: τοῦ Ἰησοῦ
  choice: Иисуса
  rationale: Предоставленный текст SBLGNT прямо читает Ἰησοῦ; перевод следует указанному оригинальному тексту, а не противоречивому английскому примечанию.
- source_word: ἤκουεν
  choice: слушала
  rationale: Несовершенный вид русского глагола естественно передаёт продолженное действие греческого имперфекта.
- source_word: τὸν λόγον αὐτοῦ
  choice: его слово
  rationale: Близко передаёт λόγος и сохраняет широту значения — речь, наставление или весть, — не сужая его до одного толкования.
theological_decisions:
- issue: Имя или титул в выражении «у ног…»
  choice: Иисуса
  alternative: Господа
  rationale: В предоставленном оригинальном тексте стоит τοῦ Ἰησοῦ. В английском консультационном слое имеются внутренне противоречивые сведения о варианте, поэтому основной русский текст следует непосредственно указанной греческой форме без конфессионального предпочтения титула.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и достойная по тону. Сохранены ученическая поза Марии и широкое значение слова λόγος.
