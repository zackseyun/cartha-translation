  text: Но один самарянин, который был в пути, подошёл к нему и, увидев его, сжалился.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαμαρίτης
  choice: самарянин
  rationale: Устоявшееся русское обозначение этнорелигиозной принадлежности; сохраняет общественный и повествовательный контраст притчи.
- source_word: δέ
  choice: но
  rationale: Передаёт противопоставление священнику и левиту из предыдущих стихов.
- source_word: τις
  choice: один
  rationale: Естественно передаёт неопределённое местоимение при существительном, не утяжеляя фразу оборотом «некий самарянин».
- source_word: ὁδεύων
  choice: бывший в пути
  rationale: Передаёт фоновое, продолжающееся действие причастия и звучит естественно в современном литературном русском.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: оказался рядом с ним
  rationale: Контекстуально передаёт прибытие к месту, где лежал пострадавший, без неестественного буквализма «пришёл по нему»; при этом не утверждает больше, чем позволяет конструкция.
- source_word: ἰδών
  choice: увидев его
  rationale: Деепричастный оборот естественно передаёт предшествующее обстоятельство аористного причастия.
- source_word: ἐσπλαγχνίσθη
  choice: сжалился
  rationale: Ёмкий и естественный русский глагол, выражающий глубокое сострадание, которое побуждает к действию.
theological_decisions:
- issue: Передача сострадательного отклика самарянина без привнесения позднейшего нравственного или доктринального истолкования
  choice: сжалился
  alternative: проникся состраданием
  rationale: Выбор сохраняет сильный эмоциональный отклик, обозначенный греческим глаголом, но не разворачивает его в богословское толкование о милости, благодати или любви к ближнему.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис сохраняет повествовательную последовательность оригинала; традиционное «самарянин» оставлено ради точности и узнаваемости.
