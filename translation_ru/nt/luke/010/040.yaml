  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: ru
  text: 'Марта же была отвлечена множеством забот о служении[a]. Подойдя, она сказала: «Господи, неужели Тебе нет дела до того, что моя сестра оставила меня одну прислуживать? Так скажи ей, чтобы она мне помогла».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была занята множеством хлопот, служа гостям».'
    reason: Передаёт оттенок περιεσπᾶτο как состояния занятости или отвлечённости и поясняет, что διακονία относится к бытовому гостеприимству.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: была поглощена
  rationale: 'Глагол в имперфекте описывает продолжительное состояние: множество дел отвлекало Марту и завладевало её вниманием. «Была поглощена» естественно передаёт это без добавления осуждающей оценки.'
- source_word: περὶ πολλὴν διακονίαν
  choice: множеством хлопот по служению
  rationale: В данном бытовом контексте διακονία означает практическое обслуживание, а не церковное служение. Формулировка сохраняет идею многочисленных дел и не сужает их исключительно до приготовления еды.
- source_word: ἐπιστᾶσα
  choice: подойдя
  rationale: Причастие обозначает приближение к собеседнику; «подойдя» кратко и естественно передаёт это действие.
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская форма прямого обращения κύριε к Иисусу, сохраняющая уважительный титул и более широкий богословский оттенок слова.
- source_word: οὐ μέλει σοι
  choice: неужели Тебе нет дела до того
  rationale: Передаёт вопрос о том, касается ли это Иисуса и заботит ли Его происходящее, сохраняя укор в словах Марты без чрезмерного усиления.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: оставила меня одну прислуживать
  rationale: Сохраняет и подчёркнутое «одну», и практический характер действия διακονεῖν. «Прислуживать» здесь естественнее, чем способное звучать церковно «служить».
- source_word: εἰπὲ οὖν αὐτῇ
  choice: так скажи ей
  rationale: Прямой императив сохранён, а «так» естественно передаёт выводный оттенок οὖν.
- source_word: συναντιλάβηται
  choice: чтобы она мне помогла
  rationale: Глагол означает присоединиться к усилиям другого и помочь ему; русское «помогла» ясно выражает смысл, а совместность очевидна из контекста.
theological_decisions:
- issue: Передача κύριος в обращении Марты к Иисусу
  choice: Господи
  alternative: Учитель
  rationale: «Господи» является стандартной передачей κύριε, уместно звучит как уважительное обращение и не устраняет характерную для Луки более широкую значимость этого титула.
translation_notes:
  register: Современный литературный русский язык с уважительным и естественным повествовательным тоном. Бытовой характер служения передан без церковно-административного оттенка; обращение к Иисусу оформлено традиционной заглавной буквой в местоимении.
