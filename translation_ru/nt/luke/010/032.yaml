base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: ru
  text: Так же и левит, придя на то место и увидев его, прошёл мимо по другой стороне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошёл мимо с противоположной стороны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Так же и
  rationale: Передаёт сопоставление с поступком священника и добавляет левита как второй сходный пример; слабая связка δέ отдельно не выражена.
- source_word: Λευίτης
  choice: левит
  rationale: Традиционное и исторически точное обозначение представителя колена Левия, сохраняющее социально-религиозную конкретность рассказа.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: оказавшись на том месте
  rationale: Естественно передаёт прибытие к уже упомянутому месту, не уточняя сверх исходного текста направление или точку движения.
- source_word: καὶ ἰδὼν
  choice: и увидев его
  rationale: Сохраняет последовательность обстоятельственных причастий; местоимение «его» восполняет понятный из контекста объект.
- source_word: ἀντιπαρῆλθεν
  choice: прошёл по другой стороне
  rationale: 'Передаёт значение сложного глагола: левит не просто миновал человека, а прошёл с противоположной стороны, уклоняясь от сближения.'
theological_decisions:
- issue: Социально-религиозная идентичность Λευίτης
  choice: левит
  alternative: служитель храма; представитель колена Левия
  rationale: Транслитерированное традиционное обозначение сохраняет историческую роль персонажа и параллель со священником, не добавляя толкования в основной текст.
- issue: Степень намеренности в ἀντιπαρῆλθεν
  choice: прошёл по другой стороне
  alternative: прошёл мимо
  rationale: Сложная форма глагола указывает на движение по противоположной стороне и предполагает избегание, однако перевод не добавляет явной оценки мотива.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и естественное. Синтаксис с деепричастиями сохраняет последовательность греческих причастий, а традиционное слово «левит» оставлено без поясняющей перифразы.
