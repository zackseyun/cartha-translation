  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: ru
  text: 'Говорю вам: в тот день[b] Содому будет легче[a], чем тому городу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «более терпимо». Греческое сравнительное слово означает, что участь будет легче перенести.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «в тот день» относится ко дню Божьего суда; в параллельных местах это сказано прямо.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Говорю вам
  rationale: Прямое и торжественное утверждение в настоящем времени; естественно и точно передаёт обращение к слушателям.
- source_word: Σοδόμοις
  choice: Содому
  rationale: Дательный падеж передан названием города как собирательным обозначением его жителей; это кратко, естественно и не добавляет отсутствующего в греческом тексте уточнения.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Обычное русское временное выражение, сохраняющее судебно-эсхатологический намёк без внесения слова «суд», которого в стихе нет.
- source_word: ἀνεκτότερον
  choice: легче
  rationale: В сравнительной конструкции «Содому будет легче» естественно передаёт смысл «будет более терпимо/переносимо» в современном русском языке.
- source_word: ἔσται
  choice: будет
  rationale: Простая форма будущего времени точно передаёт греческий футурум.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: чем тому городу
  rationale: Сохраняет сравнительную конструкцию, дательный падеж и указательное значение греческого выражения.
theological_decisions:
- issue: Смысл выражения «в тот день»
  choice: Оставить в основном тексте «в тот день»
  alternative: «в день суда»
  rationale: Контекст указывает на Божий суд, однако сам стих не содержит слова «суд»; буквальное выражение сохраняет подразумеваемый смысл, не делая его явным вопреки форме источника.
- issue: Сравнительная мера суда
  choice: «Содому будет легче, чем тому городу»
  alternative: «Содом будет осуждён менее строго, чем тот город»
  rationale: Исходный текст утверждает сравнительную переносимость участи, но не раскрывает её механизм; перевод не должен дополнительно определять характер или меру наказания.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. «Говорю вам» сохраняет прямоту заявления; «будет легче» звучит естественнее, чем формально возможное, но тяжеловесное «будет более переносимо». Маркеры сносок размещены при соответствующих выражениях в основном тексте.
