id: LUK.10.24
reference: Luke 10:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ru
  text: 'Ибо говорю вам: многие пророки и цари желали увидеть то, что видите вы, и не увидели, и услышать то, что слышите вы, и не услышали.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Ибо говорю вам
  rationale: Сохраняет объяснительную связь γάρ с предыдущим стихом; λέγω с дательным ὑμῖν естественно передано как «говорю вам».
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: многие пророки и цари
  rationale: Прямо передаёт исторические категории исходного текста, не расширяя «цари» до более общего «правители».
- source_word: ἠθέλησαν
  choice: желали
  rationale: Передаёт θέλω как сильное желание, не усиливая его до эмоционально более насыщенного «страстно желали».
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: увидеть то, что видите вы
  rationale: Естественная русская конструкция; конечная позиция «вы» отражает явное ὑμεῖς и подчёркивает контраст с пророками и царями.
- source_word: καὶ οὐκ εἶδαν
  choice: но не увидели
  rationale: Противительный союз естественно выражает смысловое противопоставление в русском; объект понятен из предшествующего придаточного и не требует местоимения.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: и услышать то, что слышите вы, но не услышали
  rationale: 'Сохраняет синтаксический параллелизм со зрением и различие временных форм: желаемое «услышать» и нынешнее «слышите».'
theological_decisions:
- issue: Кого обозначают «пророки и цари»
  choice: Сохранить исторические категории «пророки и цари» без поясняющего расширения.
  alternative: «пророки и правители» или «древние пророки и цари»
  rationale: Греческий текст прямо называет пророков и царей; добавление «древние» или обобщение до «правителей» внесло бы отсутствующее в тексте толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллель «увидеть… не увидели / услышать… не услышали» сохранена; инверсия «видите вы / слышите вы» естественно выделяет адресатов и воспроизводит контраст, заданный явным ὑμεῖς.
