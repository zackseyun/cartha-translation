base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: ru
  text: 'И Он сказал им: «Я видел, как Сатана падал с неба, словно молния».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я видел, как Сатана упал с неба, словно молния». Греческий глагол «видел» стоит в форме, которая может подчёркивать продолжающееся наблюдение.'
    reason: Аспектуальная и стилистическая альтернатива для Ἐθεώρουν; вариант не определяет, к какому времени относится падение Сатаны.
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: И Он сказал им
  rationale: Аорист εἶπεν естественно передаётся повествовательным прошедшим временем; δέ — мягкой связкой «и», а αὐτοῖς — косвенным дополнением «им».
- source_word: Ἐθεώρουν
  choice: Я видел, как
  rationale: Имперфект θεωρέω представляет восприятие в процессе; русская конструкция «видел, как» естественно выражает наблюдение разворачивающегося события, не вынуждая к тяжеловесному «наблюдал».
- source_word: τὸν Σατανᾶν
  choice: сатана
  rationale: Личное обозначение передано традиционным русским именованием; строчная буква соответствует современной русской библейской издательской практике для этого наименования.
- source_word: ὡς ἀστραπὴν
  choice: молнией
  rationale: Творительный сравнения кратко и естественно передаёт ὡς с образом молнии; образ может указывать на стремительность и/или яркость, и перевод не сужает его.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: В данном космологическом контексте οὐρανός означает небо; предлог «с» естественно сочетается в русском с глаголом падения.
- source_word: πεσόντα
  choice: упал
  rationale: Аористное причастие при глаголе зрительного восприятия естественно передаётся придаточным «как… упал», сохраняя событие падения без добавочного толкования.
theological_decisions:
- issue: Временная и аспектуальная отнесённость падения сатаны
  choice: «Я видел, как сатана… упал»
  alternative: «Я наблюдал, как сатана… падал»
  rationale: Греческий имперфект относится к акту видения/наблюдения, тогда как πεσόντα — аористное причастие события падения. Перевод не уточняет, идёт ли речь о первоначальном падении, поражении сатаны в служении учеников или пророческом видении.
- issue: Смысл сравнения с молнией
  choice: «молнией»
  alternative: «подобно молнии»
  rationale: Сжатое сравнение сохраняет подлинную неоднозначность образа — быстроту, внезапность или видимый блеск — и не превращает молнию в отдельное богословское объяснение.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Прямая речь передана естественно; сохранён яркий образ исходного текста и не зафиксирована спорная хронология падения сатаны.
