  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: ru
  text: 'Он ответил: «Люби Господа, Бога твоего, всем сердцем твоим[a], всей душой твоей, всей силой твоей и всем разумом твоим, и ближнего твоего — как самого себя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из всего сердца твоего». В первой части по-гречески стоит предлог «из», тогда как перед словами «душой», «силой» и «разумом» — предлог «в»; по-русски весь ряд естественно передаётся творительным падежом.'
    reason: Сохранить для читателя необычное различие предлогов в греческом тексте, не делая основной перевод неестественным.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Он ответил
  rationale: Естественная русская передача греческой конструкции с причастием и личной формой глагола без утраты смысла.
- source_word: Ἀγαπήσεις
  choice: Люби
  rationale: Будущее изъявительного наклонения в цитате выражает предписание. Русский императив ясно и естественно передаёт силу заповеди, не создавая неуместного обещательного оттенка формы «будешь любить».
- source_word: κύριον τὸν θεόν σου
  choice: Господа, Бога твоего
  rationale: «Господь» сохраняет значение божественного титула в цитате о Боге Израиля; приложение «Бога твоего» точно передаёт греческую конструкцию и её заветное звучание.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: всем сердцем твоим
  rationale: Хотя ἐξ буквально означает «из», в данном семитизированном выражении естественный русский эквивалент — «всем сердцем». Он передаёт полноту любви и избегает искусственного «из всего сердца».
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: всей душой твоей
  rationale: Сохраняет отдельный антропологический термин ψυχή и традиционную риторическую последовательность, не сводя «душу» к технически определённой части человека.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: всей силой твоей
  rationale: Прямо и понятно передаёт ἰσχύς как силу или мощь.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: всем разумом твоим
  rationale: «Разум» естественно обозначает мыслительную способность и сохраняет отличие διάνοια от «сердца» и «души».
- source_word: τὸν πλησίον σου
  choice: ближнего твоего
  rationale: Устоявшаяся и точная передача этического и библейского смысла πλησίον.
- source_word: ὡς σεαυτόν
  choice: как самого себя
  rationale: Естественная русская сравнительная конструкция, точно сохраняющая силу ὡς.
theological_decisions:
- issue: Божественный титул κύριος в цитате заповеди
  choice: Господь
  alternative: Владыка
  rationale: В контексте обращения к Богу Израиля «Господь» сохраняет каноническую связь и богословский вес титула без конфессионального уточнения.
- issue: Соотношение καρδία, ψυχή, ἰσχύς и διάνοια
  choice: 'Сохранить четыре выражения: сердце, душа, сила и разум'
  alternative: Обобщить как «всем своим существом»
  rationale: Перечень создаёт риторический образ всецелой преданности. Сохранение его частей не навязывает жёсткой антропологической схемы и не сглаживает исходный текст.
- issue: Предписывающая сила Ἀγαπήσεις
  choice: Люби
  alternative: Будешь любить
  rationale: Императив передаёт функцию заповеди в современном русском. Форма «будешь любить» формально ближе к греческому будущему времени, но в русском может восприниматься как предсказание или обещание.
translation_notes:
  register: Современный литературный русский с достоинством библейской заповеди. Синтаксис ясен для широкого читателя; четыре составляющие любви сохранены. Постпозиция притяжательного местоимения поддерживает возвышенный регистр и параллелизм, не переходя в архаику.
