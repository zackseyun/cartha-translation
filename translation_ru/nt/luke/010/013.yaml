source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: ru
  text: Горе тебе, Хоразин! Горе тебе, Вифсаида! Ведь если бы в Тире и Сидоне произошли те могущественные дела[a], которые произошли среди вас, то они давно бы покаялись, сидя во вретище и пепле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудеса»; греческое слово означает могущественные деяния, проявления силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Горе тебе
  rationale: Сохраняет одновременно пророческое обличение и оттенок скорби; естественно звучит в прямом обращении.
- source_word: Χοραζίν / Βηθσαϊδά
  choice: Хоразин / Вифсаида
  rationale: Использованы устоявшиеся русские библейские формы географических названий.
- source_word: δυνάμεις
  choice: могущественные дела
  rationale: Передаёт как совершённые деяния, так и проявленную в них силу, не сводя слово только к техническому понятию «чудеса».
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: совершились ... которые совершились
  rationale: Повтор корня отражает повторение форм γίνομαι; глагол указывает на произошедшие события, не называя прямо действующее лицо.
- source_word: ἐν ὑμῖν
  choice: у вас
  rationale: В контексте обращения к городам естественно обозначает место и среду, где происходили деяния.
- source_word: πάλαι
  choice: давно
  rationale: Кратко и естественно передаёт временное значение в нереальном условном высказывании.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: во вретище и пепле
  rationale: Сохраняет конкретный традиционный образ траура и покаяния; «вретище» является понятным устойчивым библейским термином.
- source_word: καθήμενοι
  choice: сидя
  rationale: Сохраняет выраженную причастием зримую позу скорбящих.
- source_word: μετενόησαν
  choice: покаялись
  rationale: Нормальный русский эквивалент μετανοέω в данном контексте, выражающий нравственно-духовный поворот.
theological_decisions:
- issue: Характер δυνάμεις в служении Иисуса
  choice: могущественные дела
  alternative: чудеса
  rationale: Выбранный вариант сохраняет смысл проявления силы и одновременно деяния, не делая термин более узким, чем греческий оригинал.
- issue: Образ покаяния
  choice: покаялись, сидя во вретище и пепле
  alternative: покаялись во вретище и пепле
  rationale: Сохранено самостоятельное значение καθήμενοι и конкретный пророческий образ, а не только обобщённое указание на покаяние.
- issue: Контрфактическое условие о Тире и Сидоне
  choice: если бы ... совершились, то они давно бы покаялись
  alternative: если бы ... произошли, они давно покаялись бы
  rationale: Русская условная конструкция ясно передаёт нереальный характер греческого высказывания, не разрешая богословское напряжение утверждения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сделан доступным, но сохранены повтор, прямое обличение и конкретный образ покаяния. Архаизм «вретище» оставлен как устойчивый и смыслово точный библейский термин; его значение проясняется сочетанием с пеплом.
