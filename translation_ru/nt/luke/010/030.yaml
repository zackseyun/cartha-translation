  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: ru
  text: 'Иисус сказал в ответ: «Один человек спускался из Иерусалима в Иерихон и попался разбойникам. Они раздели его, избили и ушли, оставив полумёртвым».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: сказал в ответ
  rationale: Передаёт ответную реплику Иисуса естественным современным русским языком, не перегружая её буквальным причастным оборотом.
- source_word: Ἄνθρωπός τις
  choice: один человек
  rationale: Естественное русское введение неопределённого персонажа рассказа; менее книжное, чем «некий человек».
- source_word: κατέβαινεν
  choice: спускался
  rationale: Сохраняет пространственный смысл движения вниз от расположенного выше Иерусалима к Иерихону.
- source_word: λῃσταῖς περιέπεσεν
  choice: попался разбойникам
  rationale: Передаёт внезапное столкновение с грабителями и последующую беспомощность жертвы без добавления отсутствующего в греческом тексте выражения «в руки».
- source_word: ἐκδύσαντες αὐτὸν
  choice: раздели его
  rationale: Прямо передаёт снятие с человека одежды; в контексте разбойного нападения подразумевается её присвоение.
- source_word: πληγὰς ἐπιθέντες
  choice: избили
  rationale: Естественно и точно передаёт нанесение множества ударов.
- source_word: ἡμιθανῆ
  choice: полумёртвым
  rationale: Сохраняет выразительный и этимологически прямой смысл греческого слова, не заменяя его толкованием «едва живым».
