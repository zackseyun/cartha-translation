base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: ru
  text: 'В какой бы дом вы ни вошли, сначала скажите: «Мир этому дому».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет мир этому дому»; это краткая формула приветствия и благословения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: В какой бы дом … ни
  rationale: Неопределённо-относительная конструкция с ἄν передана естественным русским оборотом «в какой бы… ни»; предлог «в» сохраняет направленность εἰς.
- source_word: εἰσέλθητε
  choice: вы ни вошли
  rationale: Аорист конъюнктива в неопределённо-относительном придаточном имеет обобщённое, перспективное значение; «вошли» точно передаёт действие и согласуется с русской конструкцией «какой бы… ни».
- source_word: οἰκίαν
  choice: дом
  rationale: Здесь речь прежде всего о жилище, куда входят ученики; «дом» также естественно связывает эту фразу с οἶκος в формуле благословения.
- source_word: πρῶτον
  choice: прежде
  rationale: Слово обозначает первоочерёдность действия. «Прежде скажите» звучит достойно и естественно, сохраняя краткость оригинала.
- source_word: λέγετε
  choice: скажите
  rationale: Повелительная форма передаёт предписание произнести установленное приветствие или благословение.
- source_word: Εἰρήνη
  choice: Мир
  rationale: Краткая именная формула сохраняет лаконичность греческого текста и семитский характер приветствия-благословения, не добавляя отсутствующего глагола.
- source_word: τῷ οἴκῳ τούτῳ
  choice: этому дому
  rationale: Дательный падеж естественно обозначает получателя благословения; «дому» сохраняет и конкретный смысл жилища, и возможное включение живущих в нём людей.
theological_decisions:
- issue: Характер формулы мира
  choice: 'Передать как произносимое благословение-приветствие: «Мир этому дому».'
  alternative: «Да будет мир этому дому» или «Мир дому сему».
  rationale: Греческая краткая формула имеет действенный характер приветствия и благословения. Выбранный вариант не сводит её к бытовому «здравствуйте», но и не добавляет в основной текст отсутствующий в греческом глагол.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным звучанием. «Прежде» подчёркивает первоочерёдность, не создавая архаического регистра; «Мир этому дому» сохраняет библейскую краткость формулы.
