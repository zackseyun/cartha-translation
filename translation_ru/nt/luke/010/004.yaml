  source_fidelity: 'Перевод точно передаёт три запрета с μὴ и заключительный запрет с μηδένα: «не берите с собой ни кошелька, ни дорожной сумки, ни сандалий и никого не приветствуйте в пути». «Кошелёк» адекватно передаёт βαλλάντιον, «дорожная сумка» — πήρα, а «сандалии» уместно конкретизирует ὑποδήματα в данном историческом контексте. «В пути» естественно и без потери смысла передаёт κατὰ τὴν ὁδόν. Формулировка не ослабляет прямой характер ἀσπάσησθε.'
  naturalness: Текст краток, ясен и соответствует современному литературному русскому. Сочетание «не берите с собой» естественно в наставлении отправляющимся в путь и хорошо передаёт практический смысл βαστάζετε. Координация с повтором «ни» и заключительное «и никого не приветствуйте в пути» грамматически и стилистически удачны.
  terminology: 'Выборы терминов последовательны и не вносят конфессиональных толкований. Примечание к сандалиям осторожно обозначает возможное понимание как запасной обуви, не выдавая его за значение, прямо выраженное греческим текстом. Примечание к приветствиям корректно сохраняет основной прямой запрет, а культурную вероятностную мотивировку выносит за пределы основного текста. В английском аудиторском следе маркеры сносок, по-видимому, не соответствуют их содержанию, но русские сноски привязаны содержательно и структурно правильно: [a] к «сандалиям», [b] к «приветствуйте».'
