  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: ru
  text: Не берите с собой ни кошелька, ни дорожной сумки, ни сандалий[a] и никого не приветствуйте в пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не несите… сандалий». Возможно, имеются в виду запасные сандалии, а не обувь, уже надетая на ноги.'
    reason: lexical_and_cultural_note
  - marker: b
    text: 'Вероятно, это не запрет обычной вежливости, а указание на срочность поручения: принятые в той культуре обстоятельные приветствия могли надолго задержать путника.'
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: не берите с собой
  rationale: В контексте наставлений отправляющимся в путь это естественно передаёт запрет нести или брать с собой дорожные принадлежности.
- source_word: βαλλάντιον
  choice: кошелёк
  rationale: Слово обозначает мешочек для денег; современное «кошелёк» ясно передаёт его назначение.
- source_word: πήραν
  choice: дорожная сумка
  rationale: πήρα — сумка для дорожных припасов. Выбран понятный современному читателю функциональный эквивалент.
- source_word: ὑποδήματα
  choice: сандалии
  rationale: Обозначает обувь, в данном историческом контексте прежде всего сандалии.
- source_word: κατὰ τὴν ὁδόν
  choice: в пути
  rationale: Естественное русское соответствие выражению о происходящем по дороге.
- source_word: ἀσπάσησθε
  choice: не приветствуйте
  rationale: ἀσπάζομαι здесь означает приветствовать встречных; прямой запрет сохранён без поясняющего смягчения в основном тексте.
theological_decisions:
- issue: Смысл запрета приветствовать встречных
  choice: 'Прямой запрет: «никого не приветствуйте в пути»'
  alternative: «Не задерживайтесь в пути ради приветствий»
  rationale: Греческий текст выражает прямой запрет. Вероятный акцент на срочности поручения и продолжительности принятых тогда приветствий вынесен в примечание, а не внесён в перевод.
- issue: Запрет брать сандалии
  choice: Сохранить «не берите с собой… сандалий»
  alternative: 'Уточнить в тексте: «не берите запасных сандалий»'
  rationale: Глагол «нести» допускает понимание запасной обуви, однако слово «запасных» прямо в греческом тексте отсутствует; уточнение поэтому дано только в примечании.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и повелительная. «Дорожная сумка» выбрана вместо более архаичной «сумы», а прямота запретов сохранена.
