  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ru
  text: Всё передано Мне Моим Отцом, и никто не знает, кто Сын, кроме Отца, и кто Отец, кроме Сына и того, кому Сын захочет открыть Отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: Всё
  rationale: Субстантивированное среднее множественное имеет всеохватный смысл; русское «всё» естественно и без неоправданного добавления слова «вещи».
- source_word: μοι παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: передано Мне Моим Отцом
  rationale: Аорист пассива передаёт совершившуюся передачу, а ὑπό с родительным указывает на действующее лицо. «Передано» сохраняет основной смысл без сужающего оттенка «доверено».
- source_word: γινώσκει
  choice: знает
  rationale: Прямой русский эквивалент сохраняет силу утверждения, не добавляя отсутствующего в греческом наречия «полностью».
- source_word: τίς ἐστιν ὁ υἱός / τίς ἐστιν ὁ πατήρ
  choice: кто Сын / кто Отец
  rationale: Такая конструкция естественно передаёт вопрос о личности и сохраняет личностно-реляционный характер фразы.
- source_word: εἰ μὴ
  choice: кроме
  rationale: В обоих параллельных оборотах «кроме» ясно и естественно выражает исключение.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: тому, кому Сын захочет Его открыть
  rationale: Оборот сохраняет неопределённость адресата, волю Сына и подразумеваемый объект откровения — Отца. «Открыть» здесь естественно означает сделать личность Отца известной.
theological_decisions:
- issue: Исключительное взаимное знание Отца и Сына
  choice: Сохранено прямое «никто не знает… кроме…» без усилительных добавлений.
  alternative: «Никто полностью не знает» или «никто по-настоящему не знает».
  rationale: Греческий текст утверждает уникальность взаимного знания самим синтаксисом; добавление «полностью» или «по-настоящему» выходило бы за его явную формулировку.
- issue: Воля Сына в откровении Отца
  choice: βούληται передано как «захочет», без смягчения самостоятельной роли Сына.
  alternative: «пожелает», «решит» либо пояснительная формулировка, ослабляющая инициативу Сына.
  rationale: Форма βούληται прямо связывает откровение Отца с волей Сына; перевод сохраняет это утверждение, не превращая его в систематическое богословское пояснение.
- issue: Подразумеваемый объект ἀποκαλύψαι
  choice: Добавлено местоимение «Его», относящееся к Отцу.
  alternative: 'Оставить объект формально невыраженным: «кому Сын захочет открыть».'
  rationale: В русском языке без дополнения фраза звучит неполно и может быть понята неверно; контекст однозначно предоставляет объект из предыдущего оборота — Отца.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной библейской интонацией. Заглавные буквы в титульных обозначениях «Сын», «Отец» и относящихся к ним местоимениях соответствуют русской библейской издательской традиции; синтаксический параллелизм греческого текста сохранён.
