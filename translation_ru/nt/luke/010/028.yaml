  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: ru
  text: 'Он сказал ему: «Ты правильно ответил. Делай так — и будешь жить[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В более широком контексте речь идёт о вечной жизни (см. Лк 10:25), однако по-гречески здесь сказано просто: «будешь жить».'
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Он сказал ему
  rationale: Простая повествовательная формула; частица δέ передана естественным для русского продолжением без излишнего подчёркивания противопоставления.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Ты правильно ответил
  rationale: Ὀρθῶς означает «правильно, верно», а аорист ἀπεκρίθης обозначает завершённый ответ; данная формулировка естественна в современной русской речи.
- source_word: τοῦτο ποίει
  choice: Делай так
  rationale: Настоящее повелительное ποίει допускает оттенок продолжающегося, постоянного исполнения; «делай так» передаёт и отсылку к сказанному, и этот аспект.
- source_word: καὶ ζήσῃ
  choice: и будешь жить
  rationale: Буквально сохраняет простое ζήσῃ, не добавляя отсутствующих здесь слов «унаследуешь вечную жизнь».
theological_decisions:
- issue: Смысл выражения «будешь жить» в контексте вопроса о вечной жизни
  choice: будешь жить
  alternative: унаследуешь вечную жизнь
  rationale: В Лк 10:25 речь идёт о вечной жизни, однако в самом стихе 10:28 по-гречески сказано лишь ζήσῃ — «будешь жить». Основной текст сохраняет эту краткость и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и естественная прямая речь. Тире перед следствием делает связь между повелением и обещанием ясной, не добавляя нового содержания.
