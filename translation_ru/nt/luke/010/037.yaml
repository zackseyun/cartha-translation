  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: ru
  text: 'Он ответил: «Тот, кто проявил к нему милосердие». Тогда Иисус сказал ему: «Иди и ты поступай так же».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Тот, кто проявил к нему милосердие
  rationale: Греческая идиома буквально означает «сотворивший милость с ним». Современное русское «проявил к нему милосердие» естественно передаёт поступок сострадания, сохраняя существительное «милосердие».
- source_word: Πορεύου
  choice: Иди
  rationale: Прямой повелительный призыв, естественно и точно переданный русским императивом.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: и ты поступай так же
  rationale: Явное σὺ сохранено отдельным местоимением «ты», а настоящее повелительное ποίει передано как продолжающаяся нравственная установка «поступай», не только единичное «сделай».
theological_decisions:
- issue: Сохранение подчёркнутого καὶ σὺ
  choice: Иди и ты поступай так же
  alternative: Иди и поступай так же
  rationale: В исходном тексте местоимение σὺ выражено явно и подчёркивает личное применение ответа к собеседнику; его следует сохранить без добавочного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная прямая речь. Синтаксис сохраняет последовательность ответа законника и повеления Иисуса.
