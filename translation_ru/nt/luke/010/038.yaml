  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: ru
  text: Когда они были в пути, он вошёл в одно селение, и женщина по имени Марфа приняла его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радушно приняла его как гостя». Греческий глагол подразумевает гостеприимный приём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Когда они были в пути
  rationale: Конструкция ἐν с субстантивированным инфинитивом обозначает одновременное действие; множественное αὐτούς относится ко всей группе. Частица δέ здесь лишь продолжает повествование и не требует отдельного русского соответствия.
- source_word: αὐτὸς
  choice: он
  rationale: Местоимение выделяет одного участника на фоне множественного «они». В контексте ясно, что речь об Иисусе, поэтому подстановка имени не требуется.
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: вошёл в одно селение
  rationale: κώμη обозначает небольшое поселение, а τινά придаёт ему неопределённость с оттенком конкретности; естественное русское соответствие — «одно селение».
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: и женщина по имени Марфа
  rationale: δέ вводит нового участника и естественно передаётся союзом «и». Неопределённость τις уже выражена конструкцией, а имя устраняет необходимость в тяжеловесном «некая женщина».
- source_word: ὑπεδέξατο αὐτὸν
  choice: приняла его
  rationale: ὑποδέχομαι означает принять человека, обычно гостеприимно, как гостя. Краткое «приняла его» сохраняет форму исходного текста, а гостеприимный оттенок поясняется в сноске без добавления отсутствующего в греческом слова «дом».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простым повествовательным синтаксисом. «Селение» сохраняет достоинство библейского повествования и точнее нейтрального «город» передаёт κώμη; местоимения в отношении Иисуса пишутся со строчной буквы по нормам современного издания.
