  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: ru
  text: Но Тиру и Сидону будет легче на суде, чем вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет более сносно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущему обличению естественно и без излишней книжности.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Тиру и Сидону
  rationale: Дательный падеж при сравнительной форме указывает, для кого суд окажется легче; русский дательный сохраняет греческую конструкцию.
- source_word: ἀνεκτότερον
  choice: легче
  rationale: В данном контексте означает «более переносимо»; «легче» — ясная современная сравнительная форма, не ослабляющая серьёзности суда.
- source_word: ἔσται
  choice: будет
  rationale: Прямо передаёт будущую форму связки εἰμί современным русским языком.
- source_word: ἐν τῇ κρίσει
  choice: на суде
  rationale: Естественная русская формулировка для определённого грядущего суда; сохраняет эсхатологический смысл, не разворачивая его в основном тексте.
- source_word: ἢ ὑμῖν
  choice: чем вам
  rationale: Естественно завершает сравнение и сохраняет дательный падеж греческого местоимения.
theological_decisions:
- issue: Характер κρίσις в контексте
  choice: «на суде» — указание на определённый грядущий Божий суд
  alternative: суд или осуждение в общем смысле
  rationale: Сопоставление участи нераскаявшихся городов с Тиром и Сидоном указывает на окончательный суд; перевод сохраняет это значение без поясняющего догматического добавления.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. «На суде» звучит естественнее буквального «в суде», а «будет легче» доступнее, чем книжное «будет терпимее».
