source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: ru
  text: Кто слушает вас, слушает Меня; кто отвергает вас,[a] отвергает Меня; а кто отвергает Меня, отвергает Пославшего Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пренебрегает»; возможный смысл: «отказывается признавать» (греч. ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Кто слушает
  rationale: Субстантивированное причастие настоящего времени имеет обобщающее значение. Русская конструкция «кто… тот…» естественно передаёт представительное единственное число и продолжающееся действие.
- source_word: ὑμῶν / ἐμοῦ
  choice: вас / Меня
  rationale: Родительный падеж при ἀκούω обозначает того, кого слушают. Личные местоимения сохраняют прямое отождествление принятия учеников с принятием Иисуса, не добавляя отсутствующего в тексте слова «весть».
- source_word: ἀκούει
  choice: слушает
  rationale: «Слушает» в современном русском лучше, чем нейтральное «слышит», выражает внимательное восприятие обращённой речи и позволяет сохранить повтор греческого глагола.
- source_word: ἀθετῶν / ἀθετεῖ
  choice: отвергает
  rationale: В данном контексте ἀθετέω обозначает отказ принять уполномоченных посланников и через них Иисуса. «Отвергает» естественно передаёт личностный смысл и сохраняет тройной риторический повтор; возможны также значения «пренебрегает» и «отказывается признавать».
- source_word: δὲ
  choice: а / же
  rationale: Частица отмечает переход и лёгкое противопоставление. В русском сочетание «а кто…; кто же…» ясно и естественно передаёт развитие мысли к заключительной части.
- source_word: τὸν ἀποστείλαντά με
  choice: Пославшего Меня
  rationale: Субстантивированное аористное причастие передано естественной русской формой. Заглавная буква указывает на Бога как на подразумеваемого референта, не добавляя слова «Отец», которого в греческом тексте нет.
theological_decisions:
- issue: Отождествление Иисуса с Его посланниками
  choice: 'Сохранена личная цепочка: слушать или отвергать учеников — значит слушать или отвергать Иисуса.'
  alternative: Передать смысл как принятие или отвержение только вести учеников.
  rationale: В греческом тексте стоят личные местоимения «вас» и «Меня», а не существительные «весть» или «учение». Это сохраняет смысл представительной власти, не сводя его лишь к отношению к содержанию проповеди.
- issue: Кого обозначает выражение «Пославшего Меня»
  choice: 'Референт не назван прямо: «Пославшего Меня».'
  alternative: 'Уточнить: «Отца, Пославшего Меня».'
  rationale: По контексту подразумевается Бог Отец, однако слово «Отец» в этом стихе отсутствует. Перевод сохраняет имплицитность исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным ритмом. Конструкция «кто… тот…» естественно воспроизводит параллелизм оригинала. Местоимение «Меня» и форма «Пославшего» написаны с прописной буквы согласно распространённой русской библейской традиции.
