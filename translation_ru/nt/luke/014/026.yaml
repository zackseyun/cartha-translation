source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: ru
  text: Если кто приходит ко Мне и не ненавидит своего отца и мать, жену и детей, братьев и сестёр, и даже собственную жизнь, тот не может быть Моим учеником.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не любит… меньше, чем Меня». Буквально употреблено слово «ненавидит», но здесь оно выражает требование ставить верность Иисусу выше даже самых близких семейных уз; ср. Мф. 10:37.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «собственную душу». В данном контексте слово ψυχή, вероятнее всего, означает жизнь человека как то, от чего он должен быть готов отказаться ради ученичества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: ненавидит
  rationale: Сохранено прямое и намеренно резкое значение греческого глагола. Возможный семитически окрашенный сравнительный смысл «любит меньше» указан в сноске, чтобы не сглаживать напряжённость высказывания в основном тексте.
- source_word: ἔρχεται πρός με
  choice: приходит ко Мне
  rationale: Прямо передаёт движение и обращённость к Иисусу, не подменяя исходное выражение формулой «идёт за Мной».
- source_word: πατέρα ἑαυτοῦ
  choice: своего отца
  rationale: Возвратное местоимение передано словом «своего», сохраняющим личный характер требования.
- source_word: γυναῖκα
  choice: жену
  rationale: В перечне ближайших членов семьи γυνή естественно означает супругу.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: братьев и сестёр
  rationale: Оба явно названных в греческом тексте родственных обозначения сохранены.
- source_word: ἔτι τε καὶ
  choice: и даже
  rationale: Передаёт усиление и кульминационный характер последнего элемента перечня.
- source_word: ψυχὴν ἑαυτοῦ
  choice: собственную жизнь
  rationale: В контексте цены ученичества ψυχή обозначает прежде всего собственную жизнь; вариант «душу» сохранён в сноске как формально возможный.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: тот не может быть Моим учеником
  rationale: Естественно и точно передаёт несовместимость описанной позиции с ученичеством, а не только запрет.
theological_decisions:
- issue: Следует ли смягчать μισεῖ сравнительным выражением в основном тексте
  choice: Сохранить «ненавидит» в основном тексте и пояснить смысл приоритета в сноске.
  alternative: Перевести в основном тексте как «не любит меньше».
  rationale: Греческое слово намеренно резко, и перевод должен сохранять это богословское напряжение. Контекстуальное понимание как требования поставить верность Иисусу выше ближайших семейных связей сообщается читателю без замены самого образа.
- issue: Значение ψυχή в данном стихе
  choice: Перевести как «жизнь».
  alternative: «душа» или «самого себя».
  rationale: Речь идёт о цене ученичества и отказе считать даже собственную жизнь высшей ценностью; «жизнь» ясно передаёт этот смысл, не навязывая узкого антропологического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Резкость слов Иисуса сохранена; синтаксис сделан естественным для русского. Местоимения, относящиеся к Иисусу, оформлены с прописной буквы в соответствии с распространённой русской библейской традицией.
