  text: И вот, перед ним был некий человек, страдавший водянкой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ὑδρωπικός обозначает человека с патологическими отёками, связанными с накоплением жидкости в организме. «Водянка» — традиционное общее название такого состояния, а не точный современный диагноз.
    reason: Поясняет значение греческого ὑδρωπικός и исторический характер слова «водянка», не смешивая его с отдельным симптомом и не навязывая конкретную медицинскую причину.
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: И вот
  rationale: Естественное русское повествовательное сочетание, сохраняющее связь с предыдущим контекстом и привлекающее внимание к неожиданному появлению человека.
- source_word: ἄνθρωπός τις
  choice: некий человек
  rationale: Передаёт указание на конкретного, но не названного человека; звучит естественно в литературном повествовании.
- source_word: ἦν
  choice: был
  rationale: Прямо передаёт имперфект εἰμί и в сочетании с обстоятельством «перед ним» естественно обозначает присутствие человека.
- source_word: ὑδρωπικὸς
  choice: страдавший водянкой
  rationale: Передаёт состояние человека, у которого из-за патологического скопления жидкости возникали отёки. Формулировка понятна в контексте и не навязывает более точный современный диагноз, которого греческое слово само по себе не устанавливает.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: перед ним
  rationale: Сохраняет пространственный смысл и одновременно допускает более широкое значение присутствия перед Иисусом, не устраняя присущую выражению смысловую широту.
