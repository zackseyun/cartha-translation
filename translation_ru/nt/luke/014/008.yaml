    rationale: Греческое слово указывает не просто на почётное, а на первое/самое почётное место за столом.
  - severity: low
    issue: «кого-то более почётного» стилистически и семантически менее удачно.
    rationale: В современном русском «почётный» чаще характеризует статус или звание; «более уважаемого» яснее выражает превосходство в чести или общественном положении.
