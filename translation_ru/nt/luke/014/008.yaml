base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: ru
  text: Когда кто-нибудь пригласит тебя на свадебный пир[a], не занимай самого почётного места[b], чтобы не оказалось, что он пригласил кого-то более уважаемого, чем ты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на свадьбу». Греческое слово во множественном числе может обозначать свадебные торжества, особенно пир.'
    reason: lexical_alternative
  - marker: b
    text: На торжественных трапезах в древности обычно не сидели, а возлежали за столом; речь идёт о самом почётном месте.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Когда кто-нибудь пригласит тебя
  rationale: Передаёт общую условно-временную ситуацию естественным современным русским языком; в контексте пира καλέω означает приглашение.
- source_word: εἰς γάμους
  choice: на свадебный пир
  rationale: Множественное γάμοι может обозначать свадебные торжества, особенно пир; ближайший контекст связан с размещением за столом.
- source_word: μὴ κατακλιθῇς
  choice: не занимай
  rationale: Греческий глагол буквально описывает возлежание за столом, но по-русски естественнее передать требуемое действие как занятие места; историческая реалия отмечена в сноске.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: почётного места
  rationale: πρωτοκλισία — наиболее почётное место за пиршественным столом; перевод передаёт социальный смысл без неестественного буквализма.
- source_word: μήποτε
  choice: чтобы не оказалось
  rationale: Естественно выражает предостережение и сохраняет оттенок возможного нежелательного обстоятельства.
- source_word: ἐντιμότερός σου
  choice: кого-то более почётного, чем ты
  rationale: Сохраняет сравнительное значение статуса и чести, существенное для сцены пира.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: он пригласил
  rationale: В составе русской конструкции «чтобы не оказалось, что» завершённое приглашение с актуальным результатом передаётся естественно; местоимение относится к пригласившему хозяину.
