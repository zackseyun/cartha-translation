translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Конструкция избегает архаичного «возляг» в основном тексте, но сохраняет культурную информацию в сноске. Неопределённость τινος и μήποτε передана естественными русскими средствами.
