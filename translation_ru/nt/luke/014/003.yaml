source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: ru
  text: 'Иисус в ответ сказал знатокам Закона[a] и фарисеям: «Позволительно ли исцелять в субботу или нет?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законоведам». Греческое слово обозначает специалистов по иудейскому Закону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: в ответ сказал
  rationale: Естественно передаёт греческую повествовательную конструкцию «ответив, сказал», сохраняя смысл ответа на сложившуюся ситуацию без тяжеловесного буквального повтора.
- source_word: νομικοὺς
  choice: знатокам Закона
  rationale: Обозначает специалистов по иудейскому, прежде всего Моисееву, Закону и не вызывает современной ассоциации с практикующими юристами.
- source_word: Φαρισαίους
  choice: фарисеям
  rationale: Устоявшееся русское наименование религиозной группы.
- source_word: Ἔξεστιν
  choice: Позволительно ли
  rationale: Передаёт нормативно-правовой смысл допустимости действия в контексте спора о соблюдении субботы.
- source_word: τῷ σαββάτῳ
  choice: в субботу
  rationale: Естественная русская передача дательного падежа со значением времени.
- source_word: θεραπεῦσαι
  choice: исцелять
  rationale: Точно передаёт θεραπεύω в евангельском контексте восстановления здоровья.
- source_word: ἢ οὔ
  choice: или нет
  rationale: Кратко и естественно сохраняет альтернативную форму вопроса.
theological_decisions:
- issue: Передача вопроса о допустимости исцеления в субботу без предвосхищения ответа Иисуса
  choice: «Позволительно ли исцелять в субботу или нет?»
  alternative: «Разрешено ли исцелять в субботу или нет?»
  rationale: Формулировка сохраняет правовой и богословский характер вопроса, не добавляя вывода о милосердии, необходимости или власти Иисуса.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. «Знатоки Закона» понятнее современному читателю, чем традиционное «законники», а «в ответ сказал» естественно воспроизводит греческую двойную речевую формулу.
