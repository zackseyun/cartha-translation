id: LUK.14.11
reference: Luke 14:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: ru
  text: Потому что всякий, кто возвышает себя, будет унижен, а кто смиряет себя, будет возвышен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание предшествующего наставления; «потому что» ясно сохраняет причинно-пояснительную связь.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: всякий, кто возвышает себя
  rationale: Субстантивированное причастие с πᾶς имеет обобщающий смысл; эта формулировка естественна по-русски и сохраняет всеобщий характер изречения.
- source_word: ὑψῶν
  choice: возвышает
  rationale: Здесь глагол метафорически обозначает самовозвышение и образует точную смысловую пару со «смиряет» и «будет возвышен».
- source_word: ταπεινωθήσεται
  choice: будет унижен
  rationale: Будущее страдательное сохраняет значение воздействия на человека и резкий контраст с его самовозвышением.
- source_word: καὶ
  choice: а
  rationale: Хотя καί обычно означает «и», в русском противопоставление двух параллельных половин естественнее выражается союзом «а» без изменения смысла.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: кто смиряет себя
  rationale: Обобщённое субстантивированное причастие передано естественной русской конструкцией; повтор слова «всякий» не требуется для сохранения универсального смысла.
- source_word: ὑψωθήσεται
  choice: будет возвышен
  rationale: Страдательная форма сохранена и зеркально соответствует активному «возвышает себя», не называя подразумеваемого деятеля.
theological_decisions:
- issue: Подразумеваемый деятель в будущих страдательных формах
  choice: Сохранить страдательные формы, не добавляя «Богом»
  alternative: будет унижен Богом; будет возвышен Богом
  rationale: Греческий текст не называет деятеля. Божественное действие вероятно подразумевается, однако его явное добавление устранило бы сохранённую в оригинале недосказанность.
- issue: Обобщённые формы мужского рода
  choice: Передать через русские обобщающие конструкции «всякий, кто…» и «кто…»
  alternative: каждый человек, который…; всякий, возвышающий самого себя…
  rationale: Русские формы мужского рода в «всякий» и кратких страдательных причастиях нормативно функционируют обобщённо и сохраняют грамматическое число и представительный характер оригинала.
translation_notes:
  register: Современный литературный русский язык; афористическая симметрия и торжественная сдержанность сохранены. «Смиряет себя» передаёт добровольное самоумаление, а «будет унижен» — претерпеваемое понижение. Слово «сам» не добавлено, поскольку возвратное «себя» уже ясно выражает значение ἑαυτόν.
