    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Но Он сказал ему
  rationale: δέ обозначает мягкий переход и здесь естественно передаётся союзом «но» как ответ на предшествующую реплику; местоимение «Он» относится к Иисусу.
- source_word: Ἄνθρωπός τις
  choice: Один человек
  rationale: Неопределённое τις в русском повествовательном и притчевом стиле естественно передаётся сочетанием «один человек», без излишне книжного «некий».
- source_word: ἐποίει
  choice: устроил
  rationale: В сочетании с обозначением торжественной трапезы ποιέω по-русски естественно передать как «устроил»; прошедшее совершенного вида вместе со следующим «пригласил» соответствует повествовательной норме русского языка, хотя греческий имперфект представляет действие в процессе или развитии.
- source_word: δεῖπνον μέγα
  choice: большой пир
  rationale: δεῖπνον обозначает главную трапезу дня, а μέγα — её значительный масштаб. «Большой пир» естественно передаёт формальную многолюдную трапезу в данном контексте.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: и пригласил многих
  rationale: В контексте трапезы καλέω означает «приглашать»; «многих» точно сохраняет πολλούς без ненужного добавления существительного.
