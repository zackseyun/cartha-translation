  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: ru
  text: Итак, каждый из вас, кто не отказывается от всего своего имущества[a], не может быть Моим учеником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не прощается со всем своим имуществом». Греческий глагол буквально может означать «прощаться»; здесь он выражает отказ от притязания на имущество как на безусловно своё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Так и
  rationale: Передаёт итоговый вывод из предшествующих примеров и одновременно соотносит с ними требование к каждому слушателю; по-русски звучит естественно и не перегруженно.
- source_word: πᾶς ἐξ ὑμῶν
  choice: всякий из вас
  rationale: 'Сохраняет распределительное значение: требование обращено лично к каждому.'
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: кто не отказывается
  rationale: ἀποτάσσομαι буквально может означать «прощаться», а здесь выражает решительный отказ от притязания на то, чем человек владеет. Русское «отказываться от» сохраняет силу требования, не сводя его безусловно к физической продаже имущества.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: от всего, что имеет
  rationale: Идиоматично передаёт всё принадлежащее человеку; конструкция естественнее для современного русского языка, чем «от всех своих владений», и сохраняет всеохватность πᾶσιν.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: не может быть Моим учеником
  rationale: Передаёт именно невозможность, а не простое неодобрение или запрет.
- source_word: μαθητής
  choice: ученик
  rationale: Устоявшееся и точное евангельское обозначение человека, который следует за Иисусом и учится у Него.
theological_decisions:
- issue: Характер требования в отношении имущества
  choice: «не отказывается от всего, что имеет»
  alternative: «не отдаёт всего своего имущества»
  rationale: Выбранная формулировка сохраняет радикальный отказ от права распоряжаться всем своим как безусловно собственным, но не разрешает однозначно заложенную в глаголе смысловую напряжённость в пользу обязательной физической раздачи имущества во всех случаях.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «Всякий» сохраняет индивидуализирующий характер обращения. Прописная буква в «Моим» соответствует традиционному русскому библейскому оформлению речи Христа.
