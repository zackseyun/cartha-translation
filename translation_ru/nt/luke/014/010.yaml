id: LUK.14.10
reference: Luke 14:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: ru
  text: 'Но когда тебя пригласят, пойди и расположись на самом последнем месте[a], чтобы пригласивший тебя, придя, сказал тебе: «Друг, пересядь повыше». Тогда тебе будет оказана честь перед всеми, кто возлежит с тобой за столом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возляг на самом последнем месте». В древности за праздничной трапезой обычно возлежали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: тебя пригласят
  rationale: В контексте трапезы глагол означает приглашение, а не просто призыв.
- source_word: πορευθεὶς ἀνάπεσε
  choice: пойди и расположись
  rationale: Причастие передано как сопутствующее повелению действие. «Расположись» естественно по-русски описывает занятие места за столом и не заслоняет древний обычай возлежать.
- source_word: εἰς τὸν ἔσχατον τόπον
  choice: на самом последнем месте
  rationale: Речь идёт о месте с наименьшим почётом; «последнее место» сохраняет пространственный образ и подразумеваемый общественный ранг.
- source_word: ὁ κεκληκώς σε
  choice: пригласивший тебя
  rationale: Сохраняется явное обозначение того, кто пригласил, без замены более толковательным словом «хозяин».
- source_word: Φίλε
  choice: Друг
  rationale: Прямое и естественное обращение, не добавляющее отсутствующего в греческом притяжательного оттенка.
- source_word: προσανάβηθι ἀνώτερον
  choice: пересядь повыше
  rationale: Выражение означает переход на более почётное место; «повыше» сохраняет образ движения вверх, а «пересядь» звучит естественно для современного читателя.
- source_word: δόξα
  choice: будет оказана честь
  rationale: В данном общественном контексте δόξα обозначает публичный почёт, а не божественную славу.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: перед всеми, кто возлежит с тобой за столом
  rationale: «Перед всеми» сохраняет публичность происходящего, а «возлежит… за столом» передаёт конкретный образ совместной трапезы.
theological_decisions:
- issue: Характер наставления
  choice: Сохранить прямое практическое наставление в рамках притчи о смирении и почёте, не уточняя природу награды сверх сказанного.
  alternative: Свести слова лишь к правилам этикета либо представить честь исключительно как эсхатологическую награду.
  rationale: Контекст допускает нравственный и более широкий богословский смысл, но сам стих не требует сводить высказывание только к одному из них.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступным синтаксисом. Образ возлежания сохранён в конце стиха и пояснён в сноске при первом обозначении занятия места; формулировка «пересядь повыше» естественно передаёт переход к более почётному месту.
