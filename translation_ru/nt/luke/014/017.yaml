lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычное и точное соответствие аористу ἀποστέλλω; не добавляет оттенка срочности или официальности.
- source_word: δοῦλον
  choice: слугу
  rationale: В контексте домашнего пира слово обозначает зависимого домашнего служителя и в первую очередь описывает его повествовательную роль. Вариант «раба» лексически возможен, но здесь звучал бы акцентированнее греческого контекста.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: когда настало время ужина
  rationale: Естественно по-русски передаёт наступление назначенного времени трапезы, сохраняя временное значение выражения.
- source_word: εἰπεῖν
  choice: сказать
  rationale: Инфинитив цели после «послал» и последующая прямая речь естественно передаются сочетанием «послал… сказать».
- source_word: τοῖς κεκλημένοις
  choice: тем, кто был приглашён
  rationale: Передаёт перфектное пассивное причастие и ясно указывает, что приглашение уже состоялось ранее.
- source_word: Ἔρχεσθε
  choice: Приходите
  rationale: Естественное русское приглашение во множественном числе, соответствующее повелительной форме.
- source_word: ὅτι
  choice: потому что
  rationale: 'Явно сохраняет причинную связь: прийти следует потому, что приготовления завершены.'
- source_word: ἤδη
  choice: уже
  rationale: Прямо передаёт достижение ожидаемого состояния к данному моменту.
- source_word: ἕτοιμά ἐστιν
  choice: всё готово
  rationale: Естественное русское коллективное выражение для греческого среднего рода множественного числа с подразумеваемым субъектом.
