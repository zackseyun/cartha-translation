base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: ru
  text: 'Ибо говорю вам: никто из тех приглашённых мужчин не вкусит моего ужина[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего пира»; традиционно: «моей вечери».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Ибо говорю вам
  rationale: Сохраняет объяснительное значение γάρ и прямое обращение ὑμῖν; формула звучит естественно и достойно в современном русском библейском повествовании.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: никто из тех
  rationale: Русское «никто из тех» точно передаёт категорическое отрицание и указание на ранее названных людей. Отдельное «мужей» здесь было бы тяжеловесным и ненужным, поскольку круг приглашённых уже определён контекстом.
- source_word: τῶν κεκλημένων
  choice: приглашённых
  rationale: В контексте трапезы перфектное страдательное причастие καλέω обозначает получивших приглашение; «приглашённых» точнее контекстуально, чем буквальное «призванных».
- source_word: γεύσεταί
  choice: не вкусит
  rationale: Сохраняет образ греческого γεύομαι и категоричность будущего времени, не сводя выражение к нейтральному «не поест».
- source_word: μου τοῦ δείπνου
  choice: моего ужина
  rationale: δεῖπνον обозначает главную, обычно вечернюю трапезу. «Ужин» естественно передаёт основной смысл, тогда как «пир» сильнее подчёркивает торжественный характер контекста.
theological_decisions:
- issue: Соотношение слов хозяина с богословским смыслом притчи
  choice: Сохранить повествовательное «моего ужина» без явного аллегорического истолкования.
  alternative: моего пира
  rationale: Греческий текст передаёт прямую речь хозяина внутри притчи. Перевод сохраняет первое лицо и образ трапезы, не подменяя их богословским объяснением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Ибо» сохраняет причинно-пояснительную связь γάρ; «вкусит» удерживает исходный образ, а примечание отражает допустимый диапазон значения δείπνον.
