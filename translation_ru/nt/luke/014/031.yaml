id: LUK.14.31
reference: Luke 14:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: ru
  text: Или какой царь, отправляясь на войну против другого царя, не сядет прежде и не обдумает, сможет ли он с десятью тысячами воинов противостоять тому, кто идёт на него с двадцатью тысячами?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит второй пример и естественно сохраняет связь с предыдущим рассуждением.
- source_word: τίς βασιλεὺς
  choice: какой царь
  rationale: Передаёт обобщённый риторический вопрос естественным современным русским языком.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: отправляясь на войну против другого царя
  rationale: Естественно передаёт целенаправленное движение к вооружённому столкновению; «против» ясно выражает контекст противоборства.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: не сядет прежде и не обдумает
  rationale: Сохраняет ожидаемый утвердительный ответ риторического вопроса, последовательность действий и образ обдуманного решения.
- source_word: εἰ δυνατός ἐστιν
  choice: сможет ли он
  rationale: Ясно выражает оценку реальной способности.
- source_word: ἐν δέκα χιλιάσιν
  choice: с десятью тысячами воинов
  rationale: Предлог имеет здесь значение наличных сил; добавление «воинов» делает подразумеваемое существительное явным и естественным по-русски.
- source_word: ὑπαντῆσαι
  choice: противостоять
  rationale: В военном контексте речь идёт не о нейтральной встрече, а о столкновении с наступающим войском.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: тому, кто идёт на него с двадцатью тысячами
  rationale: Сохраняет образ приближающегося противника и численное превосходство его войска.
