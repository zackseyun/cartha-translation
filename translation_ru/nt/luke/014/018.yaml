  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: ru
  text: 'Но все как один стали отказываться[a]. Первый сказал ему: «Я купил поле, и мне нужно пойти посмотреть его. Прошу тебя, извини меня»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали находить отговорки». Греческий глагол может означать отказ от приглашения, сопровождаемый объяснением или отговоркой.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть: «прошу тебя, прими мои извинения за отказ». Буквально: «считай меня извинённым».'
    reason: lexical_explanation
lexical_decisions:
- source_word: ἤρξαντο ... παραιτεῖσθαι
  choice: стали отказываться
  rationale: 'Передаёт начало действия и значение среднего залога: приглашённые отклоняют приглашение; последующие слова показывают, что отказ сопровождается объяснением.'
- source_word: ἀπὸ μιᾶς
  choice: как один
  rationale: Естественно передаёт идиому со значением общего, единодушного действия, не сохраняя непонятное буквальное «от одного».
- source_word: πάντες
  choice: все
  rationale: Сохраняет явный акцент на всеобщности отказа.
- source_word: Ἀγρόν
  choice: поле
  rationale: Прямое соответствие ἀγρός; более широкое «участок земли» возможно, но контекст не требует уточнения.
- source_word: ἠγόρασα
  choice: я купил
  rationale: Русское прошедшее совершенного вида естественно передаёт завершённую покупку с актуальным результатом.
- source_word: ἔχω ἀνάγκην
  choice: мне нужно
  rationale: Современная и естественная передача выражения необходимости.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: пойти посмотреть его
  rationale: Передаёт сопутствующее движение и цель без усиления значения до «осмотреть» или «проверить».
- source_word: ἐρωτῶ σε
  choice: прошу тебя
  rationale: Передаёт явную вежливую просьбу естественнее, чем буквальное «спрашиваю тебя».
- source_word: ἔχε με παρῃτημένον
  choice: считай, что я отказался
  rationale: Передаёт просьбу принять отказ как состоявшийся и сохраняет связь с παραιτεῖσθαι в первой части стиха.
- source_word: καὶ
  choice: но
  rationale: В контексте приглашения союз обозначает контрастный поворот; русское «но» ясно выражает эту дискурсивную функцию.
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Прямая и естественная передача субстантивированного порядкового числительного.
