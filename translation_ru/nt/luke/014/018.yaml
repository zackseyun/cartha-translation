  source_fidelity: 'Основной смысл передан точно: все приглашённые начали отклонять приглашение; первый ссылается на купленное поле и необходимость пойти посмотреть его. «Все как один» удачно передаёт ἀπὸ μιᾶς πάντες, а «стали отказываться» сохраняет начинательность ἤρξαντο. Однако заключительная формула ἔχε με παρῃτημένον — просьба хозяину считать говорящего извинённым/освобождённым от участия, а не просто констатация собственного отказа.'
