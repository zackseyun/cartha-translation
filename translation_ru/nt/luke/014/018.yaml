translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаизмов. Идиома ἀπὸ μιᾶς передана естественным русским выражением «как один». В прямой речи сохранена подчеркнуто вежливая, но очевидно отказывающая формула.
