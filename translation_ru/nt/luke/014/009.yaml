  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: ru
  text: 'И тот, кто пригласил и тебя, и его, придёт и скажет тебе: «Уступи ему место». И тогда тебе придётся со стыдом занять последнее место[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самое низкое место». Греческое выражение может обозначать последнее место по порядку, а в контексте пира — наименее почётное место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: подойдёт
  rationale: Аористное причастие обозначает действие, предшествующее будущему ἐρεῖ; в контексте устроитель подходит к гостю, поэтому личная форма будущего времени естественна по-русски.
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: тот, кто пригласил и тебя, и его
  rationale: Субстантивированное причастие обозначает пригласившего; повтор «и… и…» сохраняет явное сопоставление двух гостей.
- source_word: ἐρεῖ σοι
  choice: скажет тебе
  rationale: Прямая и естественная передача глагола речи без усиления значения.
- source_word: Δὸς τούτῳ τόπον
  choice: Уступи ему место
  rationale: В обстановке пира речь идёт не просто о предоставлении какого-либо места, а об освобождении занятого почётного места для другого гостя. «Уступи» естественно выражает этот смысл, а «ему» нормально передаёт указательное τούτῳ в русском контексте.
- source_word: ἄρξῃ
  choice: начнёшь
  rationale: Сохраняется выраженное в греческом тексте значение начала действия, хотя по-русски сочетание с последующим несовершенным инфинитивом несколько подчёркнуто.
- source_word: μετὰ αἰσχύνης
  choice: со стыдом
  rationale: Передаёт социальный позор и унижение, выраженные αἰσχύνη, не ослабляя их до простого смущения.
- source_word: τὸν ἔσχατον τόπον
  choice: последнее место
  rationale: Буквально сохраняет значение ἔσχατος и одновременно естественно указывает на самое низкое положение в порядке рассадки; возможный смысловой вариант пояснён в сноске.
- source_word: κατέχειν
  choice: занимать
  rationale: В контексте рассадки κατέχω означает занимать определённое место; несовершенный инфинитив позволяет сохранить конструкцию с «начнёшь».
