base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: ru
  text: Итак, соль хороша; но если даже соль станет безвкусной[a], чем её приправить?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол буквально может означать «стать глупой», но применительно к соли здесь имеется в виду стать безвкусной, пресной.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: хорошо
  rationale: Передаёт общую положительную оценку соли, не сужая смысл до одной лишь пользы.
- source_word: οὖν
  choice: итак
  rationale: Сохраняет выводный переход от предшествующего наставления и естественно звучит по-русски.
- source_word: ἅλας
  choice: соль
  rationale: Прямое соответствие, сохраняющее буквальный образ притчи.
- source_word: ἐὰν δὲ καὶ
  choice: но если даже
  rationale: «Но» передаёт противопоставление δέ, а «даже» — усилительное значение καί.
- source_word: μωρανθῇ
  choice: потеряет вкус
  rationale: В сочетании с «солью» глагол означает стать безвкусной, пресной; выбран естественный русский оборот, сохраняющий условный образ.
- source_word: ἐν τίνι
  choice: чем
  rationale: Естественно передаёт средство, о котором спрашивает риторический вопрос.
- source_word: ἀρτυθήσεται
  choice: её приправить
  rationale: Сохраняет кулинарный образ глагола ἀρτύω и смысл пассивной формы без истолковывающего расширения вроде «восстановить».
theological_decisions:
- issue: Метафорический смысл изречения о соли
  choice: Сохранить образ соли без пояснения его применения к ученикам в основном тексте.
  alternative: 'Развернуть метафору: «если ученики утратят свои отличительные качества…»'
  rationale: Применение образа раскрывается контекстом; его прямое истолкование в самом стихе сняло бы намеренную образность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; краткая пословичная форма сохранена. Конструкция «соль — это хорошо» звучит понятно и достойно, а риторический вопрос оставлен без разъясняющей вставки.
