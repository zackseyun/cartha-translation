  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: ru
  text: Кто не несёт своего креста[a] и идёт за Мной[b], тот не может быть Моим учеником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не носит на себе своего креста».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «идёт позади Меня»; ср. обычное выражение «следовать за Ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Кто
  rationale: Неопределённо-относительное местоимение вводит общее условие; русская конструкция «Кто… тот…» естественно передаёт универсальный смысл.
- source_word: βαστάζει
  choice: несёт
  rationale: Глагол означает «нести» или «носить». «Несёт» сохраняет конкретный образ переносимого креста и его метафорическую силу.
- source_word: τὸν σταυρόν
  choice: креста
  rationale: «Крест» — прямое и устойчивое соответствие; в контексте это орудие казни, образ цены и позора ученичества.
- source_word: ἑαυτοῦ
  choice: своего
  rationale: Возвратное местоимение подчёркивает принадлежность креста самому человеку. Русское «своего» точно сохраняет это значение без необходимости обозначать пол.
- source_word: ἔρχεται ὀπίσω μου
  choice: идёт за Мной
  rationale: Оборот буквально описывает движение позади Иисуса и одновременно служит языком ученичества. «Идёт за Мной» естественно сохраняет оба оттенка.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: не может быть Моим учеником
  rationale: Конструкция выражает невозможность или несовместимость, а не простой запрет; выбранная формулировка точно и естественно передаёт эту силу.
- source_word: μαθητής
  choice: учеником
  rationale: «Ученик» — стандартное и контекстуально точное обозначение последователя, обучающегося у наставника.
theological_decisions:
- issue: Универсальный смысл при грамматически мужском единственном числе
  choice: Передать конструкцией «Кто… тот…» и возвратным «своего»
  alternative: «Всякий, кто не несёт свой крест…»
  rationale: Греческая форма имеет обобщающий смысл. Русская конструкция не сужает высказывание до мужчин и не требует искусственной смены числа.
- issue: Связь несения креста с следованием за Иисусом
  choice: 'Сохранить два координированных условия: «не несёт… и не идёт»'
  alternative: Истолковать несение креста как пояснение к следованию
  rationale: Греческий текст соединяет два глагола союзом καί; перевод сохраняет синтаксическую и богословскую напряжённость, не сводя одно действие к другому.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Конструкция «Кто… тот…» естественна для общего условия. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции.
