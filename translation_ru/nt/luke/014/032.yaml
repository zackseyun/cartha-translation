  source_fidelity: Текст точно передаёт условный оборот εἰ δὲ μήγε, обстоятельство генитива абсолютного («пока тот царь ещё далеко»), отправку πρεσβείαν и просьбу о τὰ πρὸς εἰρήνην. Добавление «к нему» естественно раскрывает направление посольства, подразумеваемое контекстом, и не меняет смысла.
