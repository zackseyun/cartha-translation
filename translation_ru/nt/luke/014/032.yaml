id: LUK.14.32
reference: Luke 14:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: ru
  text: А если нет, то, пока тот царь ещё далеко, он посылает к нему посольство и просит об условиях мира.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «просит о том, что относится к миру», то есть об условиях, на которых можно заключить мир.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: А если нет
  rationale: Сохраняет условно-противительный смысл греческой конструкции и естественно продолжает вопрос предыдущего стиха.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: пока тот царь ещё далеко
  rationale: Генитив абсолютный передаёт одновременное обстоятельство; «тот царь» ясно указывает на противника из контекста, не оставляя двусмысленного местоимения.
- source_word: πρεσβείαν
  choice: посольство
  rationale: В данном военно-политическом контексте слово обозначает отправляемую официальную группу посланников; «посольство» естественно и точно передаёт эту функцию.
- source_word: ἀποστείλας
  choice: он посылает
  rationale: Аористное причастие естественно передано личной формой, связанной с последующим действием, с сохранением последовательности событий.
- source_word: ἐρωτᾷ
  choice: просит
  rationale: Здесь глагол означает обращение с просьбой, а не простой вопрос или выяснение сведений.
- source_word: τὰ πρὸς εἰρήνην
  choice: об условиях мира
  rationale: 'Контекстуальный эквивалент буквального «о том, что относится к миру»: речь идёт об условиях, на которых можно достичь мира.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательный синтаксис прост и достоин. Слово «царь» добавлено для ясности референта αὐτοῦ из ближайшего контекста притчи. Маркер сноски поставлен непосредственно после выражения, которое она поясняет.
