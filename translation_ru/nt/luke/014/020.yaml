  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: ru
  text: 'А другой сказал: «Я женился, и потому не могу прийти».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: другой
  rationale: Слово вводит следующего участника в последовательности отвечающих; «другой» естественно и точно передаёт эту функцию.
- source_word: Γυναῖκα ἔγημα
  choice: я женился
  rationale: В сочетании с γαμέω слово γυνή имеет значение «жена». Русское «я женился» естественно передаёт всё сочетание без нехарактерного для современного русского оборота «женился на жене».
- source_word: διὰ τοῦτο
  choice: и потому
  rationale: Оборот ясно обозначает причину заявленного отказа; «потому» сохраняет причинно-следственную связь и звучит естественно.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: не могу прийти
  rationale: Прямая и идиоматичная передача конструкции δύναμαι с инфинитивом, сохраняющая заявленную невозможность прийти.
