  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: ru
  text: Ведь кто из вас, желая построить башню, не сядет сначала и не подсчитает расходы, достаточно ли у него средств, чтобы завершить строительство?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть ли у него на завершение». То есть достаточно ли у него средств, чтобы закончить строительство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Ведь кто из вас
  rationale: Риторический вопрос прямо обращён к слушателям; «ведь» естественно передаёт связь γάρ с предшествующей мыслью.
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: желая построить башню
  rationale: Сохраняет значение причастия θέλων и конкретный образ башни без ненужного уточнения её вида.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: не сядет прежде
  rationale: Передаёт ожидаемый утвердительный ответ на риторический вопрос и предшествование действия, выраженное аористным причастием.
- source_word: ψηφίζει τὴν δαπάνην
  choice: не подсчитает расходы
  rationale: ψηφίζω здесь означает расчёт предстоящих затрат, а δαπάνη — расходы или стоимость; русское сочетание звучит естественно.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: чтобы узнать, хватит ли у него средств довести строительство до конца
  rationale: Греческая конструкция буквально говорит о наличии необходимого «для завершения»; перевод раскрывает подразумеваемую достаточность средств и объект завершения из контекста.
