  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: ru
  text: иначе, после того как он заложит основание, но не сможет завершить, все, кто это увидит, начнут смеяться над ним,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: иначе
  rationale: В контексте предостережения оборот вводит нежелательный исход; «иначе» естественно передаёт эту функцию по-русски.
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: если он заложит основание
  rationale: Генитив абсолютный обозначает действие, предшествующее возможному исходу; условно-временная конструкция естественна в русском контексте.
- source_word: μὴ ἰσχύοντος ἐκτελέσαι
  choice: но не сможет закончить
  rationale: ἰσχύω здесь означает способность, а ἐκτελέσαι — доведение строительства до конца.
- source_word: πάντες οἱ θεωροῦντες
  choice: все, кто это увидит
  rationale: θεωρέω передаёт наблюдение; «это» естественно отсылает к незавершённому строительству, не уточняя сверх контекста.
- source_word: ἄρξωνται αὐτῷ ἐμπαίζειν
  choice: начнут смеяться над ним
  rationale: Передаёт начало насмешек и значение ἐμπαίζω современным, понятным и стилистически уместным русским выражением.
