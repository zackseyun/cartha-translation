lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: шли вместе
  rationale: Имперфект передаёт продолжавшееся движение, а приставка συν- — сопровождение; естественное русское выражение «вместе с Ним шли» сохраняет оба оттенка.
- source_word: δὲ
  choice: не передано отдельным словом
  rationale: Здесь частица служит мягкой связкой повествования; в современном русском переход естественно выражается последовательностью предложений без добавления «теперь» или подчёркнутого противопоставления.
- source_word: αὐτῷ
  choice: с Ним
  rationale: Дательный падеж при συμπορεύομαι обозначает сопровождение; местоимение сохраняет форму оригинала и не повторяет имя без необходимости.
- source_word: ὄχλοι πολλοί
  choice: большие толпы народа
  rationale: Такой перевод естественно передаёт множество многочисленных групп людей, не сводя множественное число ὄχλοι к одной толпе.
- source_word: καὶ
  choice: граница предложений
  rationale: Простая повествовательная связь естественно передана новым предложением; смысловой последовательности это не усиливает и не меняет.
- source_word: στραφεὶς
  choice: Повернувшись
  rationale: Деепричастие точно и естественно передаёт предшествующее или сопутствующее действие аористного причастия, не добавляя более конкретного «обернувшись».
- source_word: εἶπεν
  choice: Он сказал
  rationale: Обычный повествовательный эквивалент аориста λέγω.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: Русский дательный падеж при «сказал» естественно обозначает адресатов и сохраняет местоименную отсылку к толпам.
