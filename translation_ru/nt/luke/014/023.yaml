  source_fidelity: 'Перевод точно передаёт синтаксис и основные лексические элементы греческого текста: «господин» уместно передаёт κύριος как персонажа притчи; «рабу» сохраняет социально-правовую силу δοῦλος; «выйди» отражает направленность ἔξελθε; «дороги» и «изгороди» соответствуют ὁδούς и φραγμούς. «Заставь их войти» адекватно сохраняет сильную семантику ἀνάγκασον, не снимая присущего тексту напряжения. Целевая конструкция «чтобы наполнился мой дом» верно передаёт ἵνα γεμισθῇ μου ὁ οἶκος.'
