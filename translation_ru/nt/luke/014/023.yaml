  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: ru
  text: 'И господин сказал рабу: «Выйди на дороги и к изгородям и заставь их войти[a], чтобы наполнился мой дом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настойчиво убеждай их войти». Греческий глагол имеет сильное значение — «принуждать, понуждать», однако в этой притче он не обязательно подразумевает физическую силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: господин
  rationale: В мире притчи это хозяин дома, а не прямое употребление божественного титула; «господин» естественно передаёт его положение по отношению к рабу.
- source_word: δοῦλον
  choice: рабу
  rationale: Слово δοῦλος обозначает человека в подневольном положении; «раб» сохраняет этот существенный социальный смысл без смягчения до «слуги».
- source_word: Ἔξελθε
  choice: выйди
  rationale: Повелительная форма сохраняет выраженное в глаголе движение наружу.
- source_word: ὁδοὺς
  choice: дороги
  rationale: В сочетании с изгородями речь идёт о путях за пределами ближайшего жилого пространства; «дороги» звучит естественно и точно.
- source_word: φραγμοὺς
  choice: изгороди
  rationale: φραγμός может означать ограду или живую изгородь; «изгороди» сохраняет образ пограничных мест, где следует искать людей.
- source_word: ἀνάγκασον
  choice: заставь
  rationale: Сильный глагол ἀναγκάζω означает принуждать или настойчиво понуждать. «Заставь» сохраняет силу греческого текста, а контекстуальная возможность настойчивого убеждения отмечена в сноске.
- source_word: εἰσελθεῖν
  choice: войти
  rationale: Инфинитив прямо передаёт движение внутрь дома и естественно сочетается с «заставь».
- source_word: ἵνα γεμισθῇ
  choice: чтобы наполнился
  rationale: Оборот с ἵνα выражает цель приказа; русская конструкция с «чтобы» сохраняет её.
- source_word: μου ὁ οἶκος
  choice: мой дом
  rationale: οἶκος здесь обозначает дом как место пира; буквальное «мой дом» ясно и уместно.
theological_decisions:
- issue: Передача κύριος в притче
  choice: господин
  alternative: Господь
  rationale: В непосредственном повествовательном мире притчи κύριος обозначает человеческого хозяина дома. «Господин» не превращает это слово само по себе в прямой божественный титул, но и не препятствует богословскому прочтению притчи в целом.
- issue: Сила ἀνάγκασον
  choice: заставь их войти
  alternative: настойчиво убеждай их войти
  rationale: Основной текст сохраняет силу греческого глагола и не ослабляет заложенное в нём напряжение. Сноска предупреждает, что в контексте приглашения на пир выражение не обязательно подразумевает физическое насилие.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого повествования. Синтаксис близок к греческому, но естественен по-русски; «на дороги и к изгородям» передаёт различное обычное управление при сохранении единого направления поиска.
