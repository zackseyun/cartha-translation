lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени связано с подразумеваемым подлежащим из предыдущего стиха; русское деепричастие естественно передаёт сопутствующую речь.
- source_word: ὅτι
  choice: двоеточие и кавычки
  rationale: Союз вводит содержание речи; в современном русском прямая речь здесь естественно оформляется пунктуационно.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Этот человек
  rationale: Точно передаёт указательное местоимение с существительным, сохраняя публичный и слегка насмешливый тон без дополнительной экспрессии.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: начал строить
  rationale: Естественно и близко передаёт конструкцию со значением начала действия.
- source_word: οὐκ ἴσχυσεν
  choice: не смог
  rationale: В данном контексте глагол обозначает недостаток способности или возможности довести дело до конца, а не обязательно физической силы.
- source_word: ἐκτελέσαι
  choice: закончить
  rationale: В контексте строительства означает довести начатое до завершения; «закончить» звучит естественно в современном русском.
