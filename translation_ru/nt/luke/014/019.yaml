  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: ru
  text: 'Другой сказал: «Я купил пять пар волов и иду испытать их. Прошу тебя, считай меня извинённым».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «считай меня освобождённым [от участия]»; то есть извини меня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: другой
  rationale: В последовательности ответов приглашённых слово обозначает ещё одного человека; «другой» кратко и естественно передаёт эту связь.
- source_word: Ζεύγη βοῶν … πέντε
  choice: пять пар волов
  rationale: ζεῦγος обозначает пару совместно работающих животных. Русское «пять пар волов» ясно передаёт количество — десять волов, сведённых в пять рабочих пар.
- source_word: ἠγόρασα
  choice: я купил
  rationale: Аорист сообщает о состоявшейся покупке; простое прошедшее время естественно по-русски и сохраняет непосредственную значимость действия.
- source_word: πορεύομαι
  choice: иду
  rationale: Настоящее время выражает предпринимаемое сейчас действие или непосредственное намерение; «иду» передаёт его сжато и естественно.
- source_word: δοκιμάσαι
  choice: испытать
  rationale: В данном контексте глагол означает проверить приобретённых рабочих животных на деле; «испытать» сохраняет целенаправленный характер проверки.
- source_word: ἐρωτῶ σε
  choice: прошу тебя
  rationale: Здесь ἐρωτάω вводит вежливую просьбу, а не вопрос; «прошу тебя» естественно передаёт речевой акт.
- source_word: ἔχε με παρῃτημένον
  choice: считай, что я отказался
  rationale: Конструкция ἔχω с перфектным страдательным причастием требует считать говорящего находящимся в состоянии отказа от приглашения. В русском «считай, что я отказался» звучит естественно и не создаёт ложного смысла просьбы освободить его от иной обязанности.
theological_decisions:
- issue: Значение παρῃτημένον в контексте приглашения
  choice: «отказался» — то есть отказался принять приглашение
  alternative: «извинён» / «считай меня извинённым»
  rationale: παραιτέομαι допускает оттенки просьбы об освобождении и отказа. Здесь приглашённый отклоняет приглашение, поэтому «отказался» яснее в современном русском; сноска сохраняет более буквальное устройство выражения.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранена прямая речь и последовательность действий оригинала; аграрное выражение передано понятным «пять пар волов».
