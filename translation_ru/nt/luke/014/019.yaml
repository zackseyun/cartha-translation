  terminology: '«Волы» и «пять пар волов» удачны: они сохраняют сельскохозяйственный образ и значение ζεύγη βοῶν. «Испытать» приемлемо для проверки рабочих животных. Для παρῃτημένον предпочтительно «извинённым», а не «отказался».'
