  naturalness: Исправленный текст остаётся современным литературным русским. «Однажды, в субботу» естественно передаёт повествовательное введение и временное обстоятельство без искусственного «и случилось».
  terminology: «Руководитель фарисеев» передаёт положение ἄρχων без анахроничного оттенка официальной должности. Формулировка о наблюдении не приписывает фарисеям намерения, которого стих прямо не называет.
