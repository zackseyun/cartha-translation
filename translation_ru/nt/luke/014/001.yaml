  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: ru
  text: Однажды, в субботу, Иисус пришёл в дом одного из руководителей фарисеев, чтобы поесть хлеба[a], а они пристально наблюдали за Ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «есть хлеб»; то есть принять пищу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «внимательно следили за Ним»; греческое слово может подразумевать подозрительное или враждебное наблюдение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: однажды
  rationale: Луканская повествовательная формула естественно вводится в современном русском словом «однажды»; громоздкое «и случилось» не требуется.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: Иисус пришёл
  rationale: Оборот с субстантивированным инфинитивом имеет временное значение. Имя «Иисус» естественно проясняет местоимение в отдельно цитируемом стихе.
- source_word: οἶκόν
  choice: дом
  rationale: Прямое и естественное соответствие греческому существительному в контексте приглашения на трапезу.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: одного из фарисейских начальников
  rationale: Сохраняет значение принадлежности к числу руководителей фарисеев, не сводя ἀρχόντων лишь к общественной влиятельности.
- source_word: σαββάτῳ
  choice: в субботу
  rationale: Естественная русская передача временного дательного падежа без неоправданного уточнения, была ли это какая-либо или конкретная суббота.
- source_word: φαγεῖν ἄρτον
  choice: разделить трапезу
  rationale: Греческое «есть хлеб» является идиомой совместной еды; русская формулировка передаёт значение и социальный контекст, а буквальный образ отмечен в сноске.
- source_word: παρατηρούμενοι
  choice: пристально наблюдали
  rationale: Передаёт внимательное, потенциально подозрительное наблюдение, не утверждая прямо враждебного умысла.
- source_word: αὐτοὶ
  choice: они
  rationale: Контрастное местоимение передано обычным русским подлежащим; усиление «они сами» здесь звучало бы неестественно и могло бы сместить акцент.
theological_decisions:
- issue: Предполагаемая враждебность наблюдавших за Иисусом фарисеев
  choice: пристально наблюдали за Ним
  alternative: следили за Ним, чтобы уличить
  rationale: παρατηρέω может подразумевать подозрительное или враждебное наблюдение, однако сам стих не называет их намерение. Выбранная формулировка сохраняет напряжение, не усиливая обвинение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Идиоматическое «разделить трапезу» сохраняет обстановку совместной еды; буквальная форма вынесена в сноску. Прописное «Ним» соответствует традиционной русской библейской орфографии при обозначении Иисуса.
