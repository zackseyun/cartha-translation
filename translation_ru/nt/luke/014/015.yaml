  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: ru
  text: 'Услышав это, один из возлежавших с ним за столом сказал ему: «Блажен тот, кто будет есть хлеб в Царстве Божьем».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Есть хлеб» может означать участие в общей трапезе; перевод сохраняет буквальный образ греческого текста.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство времени и сохраняет последовательность действий.
- source_word: δέ
  choice: не выражено отдельным словом
  rationale: Частица обозначает мягкий переход к ответной реплике; в русском повествовании этот переход естественно передаётся самой сменой говорящего, тогда как «но» создало бы излишне резкое противопоставление.
- source_word: τις τῶν συνανακειμένων
  choice: один из возлежавших с ним за столом
  rationale: Передаёт неназванного участника общей трапезы и сохраняет историческую деталь обычая возлежать за столом.
- source_word: ταῦτα
  choice: это
  rationale: В современном русском собирательное «это» естественно отсылает к предыдущим словам Иисуса.
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Прямое и точное воспроизведение повествовательной формулы без устранения местоимения.
- source_word: Μακάριος
  choice: Блажен
  rationale: Сохраняет форму и богословскую весомость изречения о Божьем благоволении, не сводя его к субъективному счастью.
- source_word: ὅστις
  choice: тот, кто
  rationale: Естественная современная русская конструкция с обобщающим значением.
- source_word: φάγεται
  choice: будет вкушать
  rationale: Будущее время сохранено; «вкушать» поддерживает торжественный регистр и уместно для образа участия в трапезе.
- source_word: ἄρτον
  choice: хлеб
  rationale: Сохраняет конкретный образ греческого текста, хотя выражение может обозначать участие в трапезе вообще.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: в Царстве Божьем
  rationale: Точно и естественно передаёт предложное сочетание, не добавляя прямо не названного пира.
theological_decisions:
- issue: Смысл Μακάριος в эсхатологическом высказывании о трапезе
  choice: Блажен тот, кто будет вкушать хлеб в Царстве Божьем
  alternative: Счастлив тот, кто будет есть в Царстве Бога
  rationale: «Блажен» сохраняет смысл благословенного состояния и Божьего благоволения; «счастлив» могло бы звучать преимущественно психологически.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Историческое «возлежавших» сохранено ради точности обстановки; «Царство Божье» соответствует естественному современному конфессионально нейтральному употреблению.
