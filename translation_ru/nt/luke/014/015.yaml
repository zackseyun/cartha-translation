  source_fidelity: 'Смысл передан точно: безымянный участник трапезы, услышав сказанное, произносит блаженство о будущем вкушении хлеба в Царстве Божьем. «Возлежавших с ним за столом» обоснованно сохраняет историческую деталь συνανακειμένων. Однако «будет вкушать» несколько усиливает торжественно-церемониальный оттенок по сравнению с нейтральным φάγεται («будет есть»).'
