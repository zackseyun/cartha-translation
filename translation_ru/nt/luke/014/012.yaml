- from: 'А пригласившему Его Он сказал: «Когда устраиваешь завтрак[a] или ужин, не зови ни друзей своих, ни братьев, ни родственников, ни богатых соседей, чтобы и они не пригласили тебя в ответ[b] и это не стало тебе воздаянием[c]».'
  to: 'А тому, кто пригласил Его, Он также сказал: «Когда устраиваешь обед[a] или ужин, не зови ни своих друзей, ни братьев, ни родственников, ни богатых соседей: как бы и они не пригласили тебя в ответ[b], и это не стало тебе воздаянием[c]».'
  rationale: Исправлены отрицания, добавленные русской конструкцией в предупреждении и его следствии. Формула «как бы ... не» передаёт μήποτε как опасение возможной взаимности, а «и это не стало» сохраняет желательное предотвращение того, что в греческом сформулировано как возможный результат. «Обед» выбран как современный основной эквивалент ἄριστον; вариант «завтрак» документирован в сноске.
