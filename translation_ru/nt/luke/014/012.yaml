source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: ru
  text: 'А тому, кто пригласил Его, Он также сказал: «Когда устраиваешь обед[a] или ужин, не зови ни своих друзей, ни братьев, ни родственников, ни богатых соседей: как бы и они не пригласили тебя в ответ[b], и это не стало тебе воздаянием[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завтрак». Греческое слово обозначает более раннюю трапезу, часто около полудня, а не обязательно завтрак в современном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как бы они не позвали тебя в ответ». Греческий глагол означает пригласить в ответ на приглашение.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и это стало тебе воздаянием». Возможен перевод: «и ты получил воздаяние».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: А ... Он сказал
  rationale: Имперфект в повествовательном контексте естественно передаётся русским совершенным видом как новое речевое действие; δὲ выражено мягким связующим «А», καὶ учтено контекстуально как обращение также к пригласившему.
- source_word: τῷ κεκληκότι αὐτόν
  choice: пригласившему Его
  rationale: Субстантивированное перфектное причастие точно обозначает человека, ранее пригласившего Иисуса, без добавления более интерпретирующего слова «хозяин».
- source_word: Ὅταν ποιῇς
  choice: Когда устраиваешь
  rationale: В сочетании с названиями трапез ποιέω означает устроить или дать угощение; «устраиваешь» естественно для русского языка и сохраняет обобщённый характер высказывания.
- source_word: ἄριστον
  choice: завтрак
  rationale: Обозначает более раннюю трапезу, нередко около полудня; традиционное и краткое «завтрак» сохранено с уточняющей сноской, поскольку современное значение может быть уже древнего.
- source_word: δεῖπνον
  choice: ужин
  rationale: Обозначает основную, обычно более позднюю трапезу и ясно противопоставляется ἄριστον.
- source_word: μὴ φώνει
  choice: не зови
  rationale: Хотя φωνέω буквально означает «звать», в контексте трапезы речь идёт о приглашении; «не зови» естественно и сохраняет образ исходного глагола.
- source_word: τοὺς ἀδελφούς σου
  choice: братьев
  rationale: Сохранена грамматически мужская форма оригинала без необоснованного расширения до «братьев и сестёр».
- source_word: τοὺς συγγενεῖς σου
  choice: родственников
  rationale: Современный нейтральный эквивалент для родни или сородичей.
- source_word: γείτονας πλουσίους
  choice: богатых соседей
  rationale: Прямо и естественно передаёт существительное с определяющим его прилагательным.
- source_word: μήποτε καὶ αὐτοὶ ἀντικαλέσωσίν σε
  choice: чтобы и они не пригласили тебя в ответ
  rationale: Конструкция передаёт предостережение от возможного взаимного приглашения; «в ответ» раскрывает возвратное значение приставки ἀντι-.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: и это не стало тебе воздаянием
  rationale: Сохранена необычная и богословски значимая формулировка оригинала о взаимном приглашении как уже полученном воздаянии, а не сглаженное «и ты получил бы отплату».
theological_decisions:
- issue: Характер запрета приглашать близких и богатых соседей
  choice: Сохранён прямой отрицательный императив без поясняющего смягчения.
  alternative: 'Передать как сравнительное предпочтение: «приглашай не только...»'
  rationale: Греческий текст формулирует резкое наставление посредством μὴ φώνει; превращение его в «не только» устранило бы риторическое напряжение и добавило бы отсутствующую оговорку.
- issue: ἀνταπόδομα как воздаяние
  choice: «воздаянием»
  alternative: «отплатой» или «наградой»
  rationale: «Воздаяние» сохраняет связь с темой ответного действия и допускает более широкий смысл, не сводя его ни к негативной отплате, ни исключительно к положительной награде.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Синтаксис упрощён до естественного русского порядка слов, но сохранены прямота наставления, четырёхчастное перечисление и напряжённая формула о взаимном воздаянии. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской практике.
