source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: ru
  text: Но когда устраиваешь пир[a], приглашай бедных, увечных[b], хромых, слепых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздничную трапезу»; «приём».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обозначает людей с телесными повреждениями или физическими ограничениями.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀλλ’
  choice: Но
  rationale: Передаёт противопоставление предыдущему наставлению о том, кого не следует приглашать.
- source_word: ὅταν
  choice: когда
  rationale: В сочетании с глаголом несовершенного вида и обобщённо-личной формой естественно выражает неопределённо-повторяющуюся ситуацию; «всякий раз, когда» возможно, но тяжелее.
- source_word: δοχὴν ποιῇς
  choice: устраиваешь пир
  rationale: Естественно передаёт идиому со значением устроить приём или праздничную трапезу, не сужая её до обычного обеда.
- source_word: κάλει
  choice: приглашай
  rationale: В контексте трапезы καλέω означает приглашать.
- source_word: πτωχούς
  choice: бедных
  rationale: Субстантивированное прилагательное сохраняет краткость и структуру греческого перечня.
- source_word: ἀναπείρους
  choice: увечных
  rationale: Обозначает людей с телесными повреждениями или ограничениями; «увечных» позволяет отличить эту более широкую категорию от следующих «хромых».
- source_word: χωλούς
  choice: хромых
  rationale: Точно обозначает людей с нарушением ходьбы и сохраняет различие с ἀναπείρους.
- source_word: τυφλούς
  choice: слепых
  rationale: Прямое и естественное соответствие субстантивированному прилагательному.
theological_decisions:
- issue: Передача обозначений людей с физическими ограничениями
  choice: 'Сохранить краткий четырёхчленный перечень: «бедных, увечных, хромых, слепых»'
  alternative: 'Передать описательно и в личной форме: «бедных людей, людей с инвалидностью, хромых и слепых»'
  rationale: Греческий текст перечисляет социально уязвимые группы краткими субстантивированными прилагательными. Выбранная формулировка сохраняет его ритм и различие между общим ἀναπείρους и более конкретным χωλούς, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной формой повеления. Синтаксис сохраняет противопоставление и перечислительную структуру оригинала; потенциально чувствительные обозначения употреблены как историко-контекстуальные категории текста.
