  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: ru
  text: 'И сказал им: «Если у кого из вас сын[a] или вол упадёт в колодец, разве он не вытащит его оттуда тотчас же в субботу?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «осёл».'
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Если у кого из вас
  rationale: В сочетании с будущими формами передаёт условно-риторический смысл греческого вопроса естественным современным русским языком.
- source_word: υἱὸς
  choice: сын
  rationale: Сохраняет конкретное значение существительного мужского рода, не обобщая его до «ребёнок».
- source_word: βοῦς
  choice: вол
  rationale: Традиционное и точное обозначение рабочего быка; в данном сельскохозяйственном образе понятно современному читателю.
- source_word: φρέαρ
  choice: колодец
  rationale: Основное значение слова в данном контексте; перевод не подменяет его более общими «яма» или «ров» и не гармонизирует с параллельными местами.
- source_word: πεσεῖται
  choice: упадёт
  rationale: Будущее время естественно сохраняется в русском условном обороте.
- source_word: εὐθέως
  choice: тотчас же
  rationale: Передаёт безотлагательность действия и соответствует достоинству повествовательного регистра.
- source_word: ἀνασπάσει αὐτόν
  choice: вытащит его оттуда
  rationale: Глагол обозначает вытягивание наверх; «оттуда» естественно уточняет направление, уже заданное падением в колодец.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: даже в субботу
  rationale: «В субботу» естественно передаёт временное выражение, а «даже» выявляет подразумеваемый уступительный акцент риторического вопроса без изменения его смысла.
theological_decisions:
- issue: Текстовый вариант предмета примера
  choice: сын или вол
  alternative: осёл или вол
  rationale: Основной текст следует представленному SBLGNT с υἱός («сын»). Вариант ὄνος («осёл»), засвидетельствованный частью рукописей, отмечен в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясной риторической конструкцией. Сохранены конкретность образов и напряжение вопроса о действии в субботу; синтаксис слегка перестроен ради естественности русского условного предложения.
