lexical_decisions:
- source_word: οἱ δὲ
  choice: Но они
  rationale: Субстантивированное οἱ указывает на собеседников Иисуса из предыдущего стиха, а δέ передаёт лёгкое противопоставление между Его вопросом и их молчанием.
- source_word: ἡσύχασαν
  choice: промолчали
  rationale: В данном контексте аорист ἡσυχάζω означает, что собеседники воздержались от ответа. «Промолчали» естественно и точно передаёт их реакцию на вопрос.
- source_word: ἐπιλαβόμενος
  choice: взяв больного за руку
  rationale: Причастие ἐπιλαμβάνομαι обозначает физическое прикосновение — «взяться, взять, ухватить». Уточнение «за руку» делает фразу естественной по-русски, не меняя основной картины личного физического контакта; слово «больного» ясно указывает на мужчину из контекста.
- source_word: ἰάσατο αὐτόν
  choice: исцелил его
  rationale: ἰάομαι в повествовании о физической болезни обычно означает «исцелять»; местоимение относится к больному мужчине.
- source_word: ἀπέλυσεν
  choice: отпустил
  rationale: ἀπολύω может означать «отпустить», «освободить» или «отослать». Нейтральное «отпустил» сохраняет широту значения и естественно звучит после исцеления.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции. Конструкция с «Тогда» естественно связывает молчание собеседников с последующим действием Иисуса.
