  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: ru
  text: 'Заметив, как приглашённые выбирали себе почётные места[a], он сказал им притчу:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «первые места» — самые почётные места на пире.'
    reason: Уточняет культурное значение πρωτοκλισίαι и сохраняет более буквальную лексическую альтернативу.
lexical_decisions:
- source_word: Ἔλεγεν
  choice: рассказал
  rationale: В сочетании с «притчу» глагол естественно передаётся по-русски как «рассказал»; имперфект служит фоном для последующей речи, однако русское повествование не требует здесь длительной формы.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Слабая повествовательная связка; переход естественно передан порядком частей предложения без добавления временного «теперь».
- source_word: τοὺς κεκλημένους
  choice: приглашённые
  rationale: Перфектное причастие обозначает людей, которые были приглашены и находятся среди гостей; субстантивированное русское причастие сохраняет эту смысловую направленность.
- source_word: παραβολήν
  choice: притчу
  rationale: Обычный евангельский термин для παραβολή; сохраняет авторскую характеристику последующего наставления.
- source_word: ἐπέχων
  choice: заметив
  rationale: Передаёт внимательное наблюдение, послужившее поводом для притчи, естественной русской деепричастной конструкцией.
- source_word: πῶς
  choice: как
  rationale: Прямо передаёт образ действия.
- source_word: πρωτοκλισίας
  choice: почётные места
  rationale: Речь идёт о наиболее престижных местах возлежания на трапезе; функциональный русский эквивалент яснее буквального «первые ложа».
- source_word: ἐξελέγοντο
  choice: выбирали себе
  rationale: Несовершенный вид передаёт наблюдавшееся действие, а «себе» естественно отражает средний залог и личную заинтересованность гостей.
- source_word: λέγων πρὸς αὐτούς
  choice: 'рассказал им…:'
  rationale: Причастная формула введения речи объединена с главным глаголом в естественную русскую конструкцию, а двоеточие вводит последующие слова.
theological_decisions:
- issue: Явное именование говорящего
  choice: Иисус
  alternative: он
  rationale: В изолированной русской строке местоимение звучит неясно; имя восстанавливает очевидного из контекста субъекта, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Перестановка обстоятельственного оборота в начало делает фразу естественной; двоеточие сохраняет её функцию введения прямой речи в следующем стихе.
