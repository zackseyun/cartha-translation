  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: ru
  text: 'И слуга сказал[a]: «Господин, исполнено то, что ты приказал, и ещё есть место».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: слуга
  rationale: В контексте притчи слово обозначает зависимого домашнего служителя; «слуга» звучит естественно по-русски, а возможное значение «раб» сохранено в примечании.
- source_word: Κύριε
  choice: Господин
  rationale: Это звательная форма обращения к хозяину дома внутри притчи. «Господин» естественно передаёт отношение подчинённого к хозяину, не создавая здесь излишне явного титульного отождествления.
- source_word: γέγονεν
  choice: исполнено
  rationale: Перфект γίνομαι сообщает о завершённом выполнении распоряжения с сохраняющимся результатом; безличное «исполнено» кратко и естественно передаёт этот смысл.
- source_word: ὃ ἐπέταξας
  choice: то, что ты приказал
  rationale: Оборот обозначает содержание прежнего распоряжения хозяина; «приказал» сохраняет властную силу ἐπιτάσσω.
- source_word: ἔτι
  choice: ещё
  rationale: Наречие показывает, что после выполнения приказа свободное место по-прежнему остаётся.
- source_word: τόπος
  choice: место
  rationale: В контексте пира речь идёт о наличии свободного места; русское «есть место» идиоматично и не уточняет сверх исходного текста, идёт ли речь о пространстве или вместимости.
theological_decisions:
- issue: Передача обращения Κύριε внутри притчи
  choice: Господин
  alternative: Господи
  rationale: Адресат на повествовательном уровне — хозяин дома, поэтому контекстуальное «Господин» сохраняет бытовую сцену и не вынуждает читателя заранее разрешать возможный богословский подтекст притчи.
translation_notes:
  register: Современный литературный русский язык; речь краткая и почтительная. Синтаксис близок к греческому, но естественен для устного сообщения слуги.
