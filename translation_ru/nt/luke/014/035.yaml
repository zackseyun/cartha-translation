base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: ru
  text: Она не годится ни для почвы, ни для навозной кучи[a]; её выбрасывают вон. У кого есть уши, чтобы слышать[b], пусть слышит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кучи навоза»; «навозной кучи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Кто имеет уши слышать, да слышит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: почвы
  rationale: В данном земледельческом образе γῆ означает почву, а не землю в космическом или территориальном смысле.
- source_word: κοπρίαν
  choice: навозной кучи
  rationale: κοπρία обозначает навоз или место его скопления; «навозная куча» ясно и конкретно передаёт сельскохозяйственный образ.
- source_word: εὔθετόν
  choice: не годится
  rationale: εὔθετος означает «пригодный, подходящий»; русское «не годится» естественно передаёт отрицательную конструкцию и оценку практической пригодности.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: её выбрасывают вон
  rationale: Сохранены активный глагол с неопределённым субъектом во множественном числе и конкретное наречие ἔξω; местоимение согласовано с подразумеваемой солью из предыдущего стиха.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: У кого есть уши, чтобы слышать, пусть слышит
  rationale: Формула передана современно и близко к греческой структуре; «пусть слышит» сохраняет побудительную силу ἀκουέτω.
theological_decisions:
- issue: Обобщающий мужской род в заключительном призыве
  choice: У кого есть уши, чтобы слышать, пусть слышит
  alternative: Кто имеет уши слышать, да слышит
  rationale: Форма «пусть слышит» сохраняет грамматическое единственное число и обобщающий смысл греческого мужского рода, не вводя гендерно-нейтрального множественного числа; при этом звучит естественно на современном русском.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. Сельскохозяйственный образ сохранён конкретным; заключительная формула остаётся торжественной, но не архаичной.
