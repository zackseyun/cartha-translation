  verdict: approve
  source_fidelity: 'Текст точно передаёт греческий оригинал: будущее «будешь блажен», причинное ὅτι, невозможность ответного воздаяния («им нечем воздать тебе»), будущий пассив без называния действующего лица и временную связь воздаяния с воскресением праведных. Неоднозначность эсхатологической формулировки сохранена.'
  naturalness: Русский текст звучит естественно в современном литературном библейском регистре. «Блажен» и «воздастся» имеют намеренно возвышенную, но понятную окраску и уместны в словах Иисуса. «Им нечем воздать тебе» ясно выражает отсутствие возможности или средств, а не отсутствие обязанности.
  terminology: «Блажен», «воздать/воздастся» и «праведных» последовательно передают ключевые термины и смысловую повторность ἀνταποδοῦναι / ἀνταποδοθήσεται. «При воскресении праведных» не навязывает конкретной схемы воскресений. Сноска корректно отмечает более буквальное «в воскресении».
