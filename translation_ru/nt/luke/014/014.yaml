id: LUK.14.14
reference: Luke 14:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: ru
  text: И ты будешь блажен, потому что им нечем воздать тебе; ведь тебе воздастся при воскресении праведных.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в воскресении праведных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: блажен
  rationale: «Блажен» сохраняет духовный и эсхатологический вес слова в речениях Иисуса; «счастлив» звучало бы преимущественно как обозначение субъективного чувства.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: им нечем воздать тебе
  rationale: Естественная русская передача буквального «они не имеют [возможности] воздать тебе»; выражает отсутствие средств или возможности, а не отсутствие обязанности.
- source_word: ἀνταποδοθήσεται γάρ σοι
  choice: ведь тебе воздастся
  rationale: Безлично-пассивная конструкция сохраняет будущий пассив греческого текста и смысловое повторение глагола «воздать», не уточняя прямо деятеля там, где он не назван.
- source_word: ἐν τῇ ἀναστάσει
  choice: при воскресении
  rationale: Предлог «при» естественно выражает временное значение ἐν в современном русском языке.
- source_word: τῶν δικαίων
  choice: праведных
  rationale: Субстантивированное прилагательное кратко и традиционно передаёт обозначение праведных людей.
theological_decisions:
- issue: Кто совершает будущее воздаяние
  choice: 'Сохранён пассив: «тебе воздастся»'
  alternative: «Бог воздаст тебе»
  rationale: Божественное действие подразумевается контекстом, однако деятель в греческом тексте прямо не назван; перевод не делает подразумеваемое явным.
- issue: Значение выражения «воскресение праведных»
  choice: «при воскресении праведных»
  alternative: «при воскресении праведников»
  rationale: Формулировка сохраняет связь будущего воздаяния с воскресением праведных, не определяя, идёт ли речь об особом воскресении или об аспекте всеобщего воскресения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского речения. «Блажен» и «воздастся» уместны в данном духовно-эсхатологическом контексте; синтаксис остаётся ясным для обычного читателя.
