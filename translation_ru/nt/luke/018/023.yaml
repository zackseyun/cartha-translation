  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: ru
  text: Но, услышав это, он глубоко опечалился, потому что был чрезвычайно богат.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: услышав
  rationale: Аористное причастие передаёт предшествующее обстоятельство и естественно выражается русским деепричастием.
- source_word: ταῦτα
  choice: это
  rationale: Средний род множественного числа указывает на сказанное Иисусом; в современном русском собирательное «это» звучит естественнее буквального «эти вещи».
- source_word: περίλυπος
  choice: глубоко опечалился
  rationale: Прилагательное обозначает сильную печаль или душевную скорбь; наречие «глубоко» сохраняет интенсивность.
- source_word: ἐγενήθη
  choice: опечалился
  rationale: Форма γίνομαι обозначает вхождение в состояние; русский возвратный глагол передаёт перемену состояния, а не просто пребывание в нём.
- source_word: πλούσιος
  choice: богат
  rationale: Прямой и естественный эквивалент прилагательного.
- source_word: σφόδρα
  choice: чрезвычайно
  rationale: Сильное наречное усиление сохранено без ослабления до обычного «очень».
- source_word: δὲ
  choice: Но
  rationale: Союз обозначает переход с оттенком контраста между требованием Иисуса и реакцией человека.
- source_word: γὰρ
  choice: потому что
  rationale: 'Ясно и естественно передаёт причинно-пояснительную связь: богатство объясняет его печаль.'
