source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: ru
  text: Когда Он подходил к Иерихону[a], у дороги сидел один слепой и просил милостыню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Он приближался к Иерихону».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: не передано отдельными словами
  rationale: Оборот служит повествовательным переходом. В русском отдельное «и случилось» здесь было бы тяжеловесным; связность естественно передаётся началом придаточного времени.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Когда Он подходил к Иерихону
  rationale: Конструкция с артиклевым инфинитивом выражает одновременность, а настоящее значение ἐγγίζειν — приближение к городу. «Подходил» сохраняет длительность процесса и естественно звучит по-русски.
- source_word: τυφλός τις
  choice: один слепой
  rationale: «Один» естественно передаёт слабую индивидуализирующую неопределённость τις, не создавая книжного оттенка выражения «некий слепой».
- source_word: ἐκάθητο
  choice: сидел
  rationale: Русский глагол несовершенного вида передаёт фоновое, продолжавшееся действие имперфекта.
- source_word: παρὰ τὴν ὁδὸν
  choice: у дороги
  rationale: Передаёт положение рядом с дорогой кратко и естественно; буквальное «возле дороги» также возможно.
- source_word: ἐπαιτῶν
  choice: просил милостыню
  rationale: Причастие обозначает занятие нищего. По-русски «просил милостыню» здесь яснее и идиоматичнее, чем деепричастное «попрошайничая».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Местоимение «Он» написано с прописной буквы как традиционное уважительное обозначение Иисуса, без добавления отсутствующего в стихе имени.
