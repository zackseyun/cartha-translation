    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: будет предан
  rationale: Будущее страдательное от παραδίδωμι обозначает передачу во власть других. «Будет предан» естественно сохраняет пассивную конструкцию и здесь не сужает смысл до предательства.
- source_word: γὰρ
  choice: потому что
  rationale: γάρ поясняет предшествующее предсказание; «потому что» ясно и естественно передаёт эту причинно-пояснительную связь.
- source_word: τοῖς ἔθνεσιν
  choice: язычникам
  rationale: В данном историческом контексте ἔθνη означает неевреев, во власть которых будет передан Сын Человеческий. Традиционное русское «язычникам» точно передаёт этот смысл, хотя буквально возможно «народам».
- source_word: ἐμπαιχθήσεται
  choice: над Ним будут насмехаться
  rationale: Будущее страдательное от ἐμπαίζω обозначает насмешку и издевательское осмеяние; выбранная конструкция естественна для современного русского языка.
- source_word: ὑβρισθήσεται
  choice: Его будут оскорблять
  rationale: ὑβρίζω может обозначать оскорбление, унижение или постыдное обращение. «Будут оскорблять» точно передаёт центральный смысл, не исключая более широкого унижения.
- source_word: ἐμπτυσθήσεται
  choice: будут плевать на Него
  rationale: Будущее страдательное от ἐμπτύω передаёт конкретное унизительное действие; русская личная конструкция звучит естественнее буквального страдательного оборота.
theological_decisions:
- issue: Подразумеваемое подлежащее страдательных глаголов
  choice: Местоимение «Он» отнесено к Сыну Человеческому из предыдущего стиха
  alternative: Оставить подлежащее грамматически невыраженным
  rationale: В греческом тексте отдельного подлежащего нет, однако формы глаголов стоят в третьем лице единственного числа, а референт однозначно задан в Лк 18:31. В русском языке явное местоимение обеспечивает естественность и не добавляет нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Цепочка будущих действий сохранена, но личные русские конструкции использованы вместо тяжеловесного повторения страдательных форм. Заглавные местоимения по отношению к Иисусу соответствуют принятому в русском библейском стиле благоговейному регистру.
