id: LUK.18.19
reference: Luke 18:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: ru
  text: 'Но Иисус сказал ему: «Почему ты называешь Меня добрым? Никто не добр, кроме одного — Бога».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкий контраст и характер ответной реплики Иисуса; «И» также возможно, но слабее выражает поворот в диалоге.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: Иисус сказал
  rationale: Прямо передаёт λέγω без дополнительного истолкования как «ответил».
- source_word: αὐτῷ
  choice: ему
  rationale: Сохраняет явно выраженное греческое местоимение, не заменяя его пояснительным «этому человеку».
- source_word: Τί
  choice: Почему
  rationale: 'В конструкции τί με λέγεις ἀγαθόν вопросительное τί естественно выражает причину: «Почему ты называешь Меня добрым?»'
- source_word: με λέγεις ἀγαθόν
  choice: ты называешь Меня добрым
  rationale: Естественно и достаточно близко передаёт λέγεις с предикативным прилагательным ἀγαθόν.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: добрым / добр
  rationale: Оба употребления переданы однокоренными формами без уточняющего добавления «нравственно», которого нет в исходном тексте.
- source_word: οὐδεὶς
  choice: Никто
  rationale: Ясно и естественно передаёт всеобщее отрицание.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: кроме одного Бога
  rationale: Передаёт конструкцию исключения и сохраняет акцент εἷς на единственности Бога как благого.
theological_decisions:
- issue: Христологический смысл вопроса Иисуса
  choice: Сохранить вопрос без поясняющего богословского парафраза
  alternative: Передать его либо как отрицание Иисусом собственной благости, либо как прямое заявление о Своей божественности
  rationale: Греческий текст ставит вопрос и утверждает, что благ только один Бог, но не формулирует здесь явно один из этих выводов. Перевод сохраняет исходное богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» соответствует форме единственного числа λέγεις и естественно для библейского диалога. Местоимение «Меня» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
