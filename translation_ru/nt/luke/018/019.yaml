  terminology: «Добрым / добр» последовательно передаёт ἀγαθός без богословского расширения. Имя «Иисус» и «Бог» оформлены верно. Вопрос Иисуса не истолковывается ни как отрицание собственной благости, ни как прямое догматическое утверждение.
