  source_fidelity: 'Первая часть точно передаёт греческий текст: δέ уместно передано как «Но», εἶπεν — как «сказал», а τί με λέγεις ἀγαθόν — как «Почему ты называешь Меня добрым?». Во второй части «кроме одного Бога» грамматически возможно, но в русском способно звучать так, будто речь идёт об «одном Боге» среди других. Греческое εἷς ὁ θεός выделяет «одного — Бога» как единственное исключение.'
