  source_fidelity: «Следует» несколько ослабляет δεῖν, выражающее необходимость. В остальном передача притчи, постоянной молитвы и ἐγκακεῖν («не падать духом») верна. Совершенный вид «рассказал» является допустимой русской повествовательной передачей вводного имперфекта ἔλεγεν, хотя не воспроизводит его аспект буквально.
  naturalness: Текст звучит естественно на современном литературном русском. Оборот «о том, что им необходимо...» ясен и не тяжеловесен.
