  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: ru
  text: Иисус рассказал им притчу о том, что им необходимо всегда молиться и не падать духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы показать, что им необходимо всегда молиться и не унывать».'
    reason: 'Лексико-синтаксическая альтернатива: πρὸς τὸ δεῖν может быть передано с более явным оттенком цели, а ἐγκακεῖν — как «унывать».'
lexical_decisions:
- source_word: Ἔλεγεν
  choice: рассказал
  rationale: Имперфект может обозначать развёртывающееся или фоновое действие; в русском повествовании естественнее совершенный вид «рассказал», поскольку речь идёт о введении одной притчи.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Слабый связующий союз здесь не требует отдельного русского соответствия; добавление «теперь» или «же» звучало бы тяжелее и могло бы переопределить переход.
- source_word: παραβολὴν
  choice: притчу
  rationale: Устоявшийся и точный русский эквивалент в синоптическом контексте.
- source_word: αὐτοῖς
  choice: им
  rationale: Прямо передаёт дательный падеж и указывает на слушателей Иисуса.
- source_word: πρὸς τὸ δεῖν
  choice: о том, что им следует
  rationale: Передаёт направленность притчи и необходимость, выраженную δεῖν, естественным современным русским оборотом.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой эквивалент, выражающий постоянство и настойчивость без обязательного смысла непрерывной словесной молитвы.
- source_word: προσεύχεσθαι
  choice: молиться
  rationale: Стандартное и контекстуально точное соответствие.
- source_word: μὴ ἐγκακεῖν
  choice: не падать духом
  rationale: Естественно передаёт утрату мужества и внутреннее уныние; сохраняет акцент на стойкости.
theological_decisions:
- issue: Степень обязательности постоянной молитвы
  choice: «им следует всегда молиться»
  alternative: «им необходимо всегда молиться» / «они должны всегда молиться»
  rationale: «Следует» сохраняет наставительный и обязательный оттенок δεῖν, не превращая его в более жёсткую формулу и не привнося учение о механизме действенности молитвы.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное. Имя «Иисус» эксплицирует подразумеваемого субъекта из контекста. Сохранены необходимость постоянной молитвы и призыв к стойкости без конфессионального уточнения.
