    rationale: «Им следует» обычно выражает совет или уместность, тогда как δεῖν обозначает необходимость. «Им необходимо» сохраняет требовательный смысл, не усиливая его до неуместно категоричного «обязаны».
  revised_text: Иисус рассказал им притчу о том, что им необходимо всегда молиться и не падать духом.[a]
