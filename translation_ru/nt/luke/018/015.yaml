source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: ru
  text: К нему приносили даже младенцев, чтобы он прикоснулся к ним[a]. Увидев это[c], ученики стали отчитывать их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельных повествованиях прикосновение Иисуса связано с благословением и возложением рук на детей (см. Мф. 19:13; Мк. 10:13, 16).
    reason: cross_reference
  - marker: b
    text: То есть тех, кто приносил младенцев к Иисусу.
    reason: lexical_alternative
  - marker: c
    text: То есть увидев, что младенцев приносят к Иисусу.
    reason: clarification
lexical_decisions:
- source_word: Προσέφερον
  choice: приносили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; «приносили» естественно выражает это в русском повествовании.
- source_word: δὲ
  choice: связь передана разделением предложений без отдельного союза
  rationale: Здесь частица служит мягким повествовательным переходом; отдельное «но» перед первым сообщением не требуется, а противопоставление действий ясно из контекста.
- source_word: καὶ τὰ βρέφη
  choice: даже младенцев
  rationale: καὶ имеет усилительный оттенок, а βρέφη обозначает совсем маленьких детей, младенцев.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: чтобы он прикоснулся к ним
  rationale: Сохраняется цель действия и прямое значение ἅπτομαι — «прикасаться»; благословение не вносится в основной текст.
- source_word: ἰδόντες
  choice: увидев это
  rationale: Деепричастный оборот естественно передаёт предшествующее обстоятельство; «это» обозначает наблюдаемое действие.
- source_word: ἐπετίμων
  choice: стали запрещать
  rationale: В данном контексте ἐπιτιμάω выражает строгий отпор; сочетание «стали запрещать» естественно по-русски и отражает процессуальный оттенок имперфекта.
- source_word: αὐτοῖς
  choice: им
  rationale: Местоимение сохранено, а примечание уточняет, что речь, вероятнее всего, о приносивших младенцев.
theological_decisions:
- issue: Характер действия Иисуса по отношению к младенцам
  choice: прикоснулся к ним
  alternative: благословил их; возложил на них руки
  rationale: У Луки непосредственно употреблён глагол ἅπτομαι — «прикасаться». Связь с благословением известна из параллельных повествований, но не должна подменять более сдержанную формулировку Луки.
- issue: Адресаты запрета учеников
  choice: местоимение «им» с пояснением в сноске
  alternative: 'явно указать в тексте: «тем, кто их приносил»'
  rationale: Греческий текст использует местоимение, наиболее естественно относящееся к приносившим младенцев; сохранение местоимения не устраняет формальную неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. «Младенцев» точно передаёт возрастную специфику βρέφη; «прикоснулся» сохраняет сдержанность оригинала. Порядок маркеров сделан последовательным: [a], [c], [b] в тексте соответствует месту поясняемых выражений, при этом все маркеры присутствуют.'
