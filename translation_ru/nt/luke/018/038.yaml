  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: ru
  text: 'И он закричал: «Иисус, Сын Давида[a], помилуй меня!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Сын Давида» — мессианский титул, отсылающий к обещанному Царю из рода Давида; возможен и более общий смысл: «потомок Давида».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: закричал
  rationale: Глагол обозначает громкий, настойчивый возглас; «закричал» естественно передаёт и силу голоса, и безотлагательность просьбы.
- source_word: λέγων
  choice: передано двоеточием
  rationale: В русском повествовании причастие «говоря» перед прямой речью здесь звучало бы тяжеловесно; двоеточие естественно выполняет ту же вводящую функцию.
- source_word: Ἰησοῦ
  choice: Иисус
  rationale: Звательная форма имени передана принятой русской формой обращения.
- source_word: υἱὲ Δαυίδ
  choice: Сын Давида
  rationale: Сохраняется буквальная форма и её царско-мессианское звучание в контексте Евангелия.
- source_word: ἐλέησόν με
  choice: помилуй меня
  rationale: Краткая и устойчивая русская формула точно передаёт настоятельную просьбу о милосердии.
theological_decisions:
- issue: Мессианская сила обращения υἱὲ Δαυίδ
  choice: Сын Давида
  alternative: потомок Давида
  rationale: В повествовательном контексте Луки это обращение несёт царско-мессианский смысл. Формулировка «Сын Давида» сохраняет его как титул, не превращая перевод в толкование.
translation_notes:
  register: Современный литературный русский язык; реплика краткая, громкая и настойчивая. Союз καί сохранён как «И», а λέγων естественно выражено пунктуацией.
