base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: ru
  text: И тотчас он прозрел[a] и следовал за Ним, прославляя Бога. И весь народ, увидев это, воздал хвалу Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал видеть»; возможно также: «снова стал видеть». Греческий глагол может обозначать обретение или восстановление зрения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт совершение действия без промедления и естественно звучит в русском повествовании.
- source_word: ἀνέβλεψεν
  choice: прозрел
  rationale: В контексте исцеления глагол означает обретение или восстановление зрения; «прозрел» передаёт это кратко и естественно, не уточняя, видел ли человек прежде.
- source_word: ἠκολούθει
  choice: пошёл за Ним
  rationale: Русская форма совершенного вида естественно обозначает начало последующего следования в повествовании; продолжительный характер имперфекта здесь достаточно выражен самим значением «идти за» и сопутствующим причастным оборотом.
- source_word: δοξάζων
  choice: прославляя
  rationale: Сохраняет отличие от αἶνον далее и передаёт сопутствующее действие, направленное к Богу.
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: Прямо передаёт собирательное выражение и естественно согласуется в русском языке с формой единственного числа.
- source_word: ἰδών
  choice: увидев это
  rationale: Деепричастие сохраняет обстоятельственное значение; «это» естественно указывает на только что описанные исцеление и отклик исцелённого.
- source_word: ἔδωκεν αἶνον
  choice: воздал хвалу
  rationale: Сохраняет греческую конструкцию «дал хвалу» в естественной и достойной русской форме.
- source_word: θεόν / θεῷ
  choice: Бога / Богу
  rationale: Стандартный русский эквивалент; повтор сохранён как смысловой акцент стиха.
theological_decisions:
- issue: Характер следования исцелённого за Иисусом
  choice: пошёл за Ним
  alternative: следовал за Ним
  rationale: Имперфект допускает акцент на продолжающемся действии, однако в русском повествовании «пошёл за Ним» естественно выражает непосредственный отклик и начало следования, не добавляя особого доктринального смысла.
- issue: Предмет увиденного народом
  choice: увидев это
  alternative: увидев его
  rationale: 'В греческом тексте прямое дополнение не выражено. «Это» оставляет ссылку достаточно широкой: народ увидел описанное событие — прозрение и последовавшее прославление Бога.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Ним» употреблено по принятой русской библейской традиции для ясной отсылки к Иисусу. Синтаксис сохранён компактным, а повтор слова «Бог» — в соответствии с акцентом оригинала.
