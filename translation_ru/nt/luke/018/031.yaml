source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: ru
  text: 'Отведя Двенадцать в сторону, Иисус сказал им: «Вот, мы восходим в Иерусалим, и исполнится всё написанное через пророков о Сыне Человеческом[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «исполнится всё написанное через пророков для Сына Человеческого»; греческий дательный падеж допускает такое понимание, хотя, вероятнее всего, здесь говорится о написанном относительно Него.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: Отведя … в сторону
  rationale: Причастие παραλαμβάνω передаёт действие Иисуса, который берёт Двенадцать с собой для отдельного наставления. Контекстуальный оттенок уединения естественно выражен по-русски оборотом «отведя … в сторону».
- source_word: τοὺς δώδεκα
  choice: Двенадцать
  rationale: Сохранено краткое наименование ближайшей группы учеников без поясняющего добавления «учеников». Прописная буква показывает, что это устойчивое обозначение группы.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: «Вот» естественно выполняет функцию маркера, привлекающего внимание, и не звучит архаично.
- source_word: ἀναβαίνομεν
  choice: мы восходим
  rationale: Глагол сохраняет значение движения вверх — как географического подъёма к Иерусалиму, так и принятого библейского способа говорить о пути туда.
- source_word: Ἰερουσαλήμ
  choice: Иерусалим
  rationale: Общепринятая русская форма названия города.
- source_word: τελεσθήσεται
  choice: исполнится
  rationale: Будущее страдательное передаёт достижение написанным предсказанного осуществления; «исполнится» естественно для контекста пророчеств.
- source_word: πάντα τὰ γεγραμμένα
  choice: всё написанное
  rationale: Кратко и естественно сохраняет всеохватность πάντα и результативный смысл перфектного причастия γεγραμμένα.
- source_word: διὰ τῶν προφητῶν
  choice: через пророков
  rationale: 'διά с родительным обозначает посредничество: пророки представлены как те, через кого было дано написанное.'
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: о Сыне Человеческом
  rationale: Дательный падеж в данном построении наиболее естественно понимается как указание на того, к кому относится написанное. Формулировка сохраняет титул и его межтекстовые ассоциации; формальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача христологического титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человеческий Сын / Человек
  rationale: Традиционная и понятная русская форма близко передаёт греческий титул, сохраняет возможную связь с Дан 7 и не сводит выражение к общему обозначению человека.
- issue: Отнесение написанного пророками к Сыну Человеческому
  choice: «написанное … о Сыне Человеческом»
  alternative: «написанное … для Сына Человеческого» / «исполнится Сыну Человеческому»
  rationale: Дательный τῷ υἱῷ допускает более формальную передачу «для/Сыну Человеческому», однако в связи с τὰ γεγραμμένα наиболее естественно обозначает предмет пророческого свидетельства. Альтернатива сохранена в сноске, чтобы не скрывать грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Восходим» сохраняет образ подъёма к Иерусалиму, а «Вот» передаёт призыв обратить внимание без архаизма. Имя «Иисус» названо явно вместо греческого местоимения, чтобы русское предложение после деепричастного оборота было однозначным и естественным.
