  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: ru
  text: 'Ему сказали: «Иисус Назарянин проходит мимо».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисус из Назарета проходит мимо». В греческом тексте буквально употреблено обозначение «Иисус Назарянин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: сказали
  rationale: Глагол означает сообщить или рассказать; в этом повествовательном контексте простое «сказали» естественно передаёт ответ слепому.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Частица служит мягкой повествовательной связкой; в современном русском её отдельная передача здесь была бы избыточной.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж прямо и естественно передаётся русским «ему».
- source_word: ὅτι
  choice: прямая речь
  rationale: Содержание сообщения оформлено прямой речью, что естественно по-русски и сохраняет смысл греческой конструкции.
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: ὁ Ναζωραῖος
  choice: Назарянин
  rationale: Греческое субстантивированное обозначение передано существительным, сохраняющим форму наименования и связь с Назаретом.
- source_word: παρέρχεται
  choice: проходит мимо
  rationale: Настоящее время описывает происходящее в данный момент движение мимо данного места; русский несовершенный вид передаёт эту актуальную длительность.
theological_decisions:
- issue: Передача обозначения Иисуса Ναζωραῖος
  choice: Назарянин
  alternative: из Назарета
  rationale: Это географическое или идентифицирующее обозначение, не требующее догматического расширения. «Назарянин» ближе сохраняет субстантивированную форму греческого текста, тогда как «из Назарета» явно выражает происхождение.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза с естественным порядком слов. Обозначение «Назарянин» сохраняет достоинство и формальную близость к оригиналу.
