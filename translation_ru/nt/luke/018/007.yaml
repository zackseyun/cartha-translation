  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: ru
  text: Так неужели Бог не восстановит справедливость для Своих избранных, которые взывают к Нему день и ночь? И разве Он будет долго медлить с их защитой?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хотя Он долготерпит по отношению к ним»; возможно также: «и разве Он долготерпит по отношению к ним?» Греческое выражение может говорить не о промедлении, а о терпении или долготерпении.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: восстановит справедливость
  rationale: В контексте притчи речь идёт о судебной защите и восстановлении справедливости, а не о личной мести; глагольная формулировка естественна по-русски.
- source_word: ἐκλεκτῶν
  choice: избранных
  rationale: Субстантивированное прилагательное обозначает людей, избранных Богом; традиционное русское слово понятно и не уточняет механизм избрания.
- source_word: βοώντων
  choice: которые взывают
  rationale: Передаёт настойчивое, напряжённое обращение за помощью и подходит к молитвенному контексту.
- source_word: ἡμέρας καὶ νυκτός
  choice: день и ночь
  rationale: Сохраняет образное временное выражение оригинала и подчёркивает постоянство обращений.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: станет долго медлить ради них
  rationale: В основном тексте выражение связано с возможной отсрочкой Божьего вмешательства, что соответствует переходу к уверению в скором восстановлении справедливости в следующем стихе. Неоднозначность значения μακροθυμέω отмечена в сноске.
- source_word: οὐ μὴ ποιήσῃ
  choice: неужели ... не восстановит
  rationale: Риторический вопрос ожидает утвердительного ответа, а усиленное отрицание естественно передаётся русской конструкцией «неужели ... не».
- source_word: θεὸς
  choice: Бог
  rationale: Стандартное и точное соответствие.
theological_decisions:
- issue: Значение μακροθυμεῖ ἐπ’ αὐτοῖς применительно к характеру и действию Бога
  choice: В основном тексте — вопрос о том, станет ли Бог долго медлить с действием ради избранных.
  alternative: «Хотя Он долготерпит по отношению к ним» или «И разве Он долготерпит по отношению к ним?»
  rationale: Греческое выражение допускает как контекстуальное понимание задержки, так и более обычное лексическое значение терпения или долготерпения. Основной текст следует риторическому движению к стиху 8, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Так неужели» передаёт связь с предшествующим сравнением и риторическую силу вопроса. «Своих» употреблено как естественный русский эквивалент притяжательного αὐτοῦ.
