  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ru
  text: 'Услышав это, Иисус сказал ему: «Одного тебе ещё недостаёт:[a] продай всё, что у тебя есть, и раздай бедным — и у тебя будет сокровище на небесах. Затем приходи и следуй за мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Тебе недостаёт ещё одного». Буквальнее: «Одно ещё недостаёт тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Услышав это, Иисус
  rationale: Аористное причастие естественно передаёт предшествующее действие; «это» ясно отсылает к сказанному ранее, не меняя смысла δέ, которое здесь выполняет связующую функцию.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Одного тебе ещё недостаёт
  rationale: Сохранена греческая конструкция, где «одно» является тем, чего недостаёт, а σοι обозначает лицо, для которого существует нехватка. Русская формулировка естественна и удерживает акцент на одном остающемся недостатке.
- source_word: πάντα ὅσα ἔχεις
  choice: всё, что у тебя есть
  rationale: Естественно передаёт всеохватность греческого выражения без избыточно формального «всё, чем ты владеешь».
- source_word: πώλησον
  choice: продай
  rationale: Прямой повелительный глагол сохраняет решительный характер аористного императива.
- source_word: διάδος πτωχοῖς
  choice: раздай бедным
  rationale: «Раздай» передаёт значение распределения между нуждающимися точнее, чем общее «дай»; подразумеваемый объект не конкретизируется сверх греческого текста.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: у тебя будет сокровище на небесах
  rationale: Передаёт обладание через естественную русскую конструкцию; «на небесах» сохраняет множественное число οὐρανοῖς и является обычным русским библейским выражением.
- source_word: δεῦρο
  choice: затем приходи
  rationale: «Приходи» естественно передаёт употреблённое как призыв наречие δεῦρο; «затем» ясно выражает последовательность после повелений продать и раздать, не превращая её в богословский вывод.
- source_word: ἀκολούθει μοι
  choice: следуй за мной
  rationale: Настоящий императив допускает длительное следование; обычная русская формула «следуй за мной» естественно несёт этот смысл без тяжеловесного уточнения продолжительности.
theological_decisions:
- issue: Связь отказа от имущества с ученичеством
  choice: Сохранены конкретные повеления этому собеседнику и завершающий призыв следовать за Иисусом.
  alternative: Истолковать слова либо как всеобщее требование полной продажи имущества, либо как чисто символический призыв.
  rationale: Сам стих содержит реальное экономическое требование, обращённое к конкретному человеку, но не формулирует здесь отдельно его универсальный объём. Перевод не ослабляет повеление и не расширяет его сверх текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и устно воспринимаемым синтаксисом. Местоимение «мной» написано со строчной буквы как грамматически нейтральное обозначение говорящего, без внесения конфессиональной типографской традиции.
