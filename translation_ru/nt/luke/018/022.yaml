  source_fidelity: 'Перевод точно передаёт синтаксическую последовательность и основные смысловые компоненты греческого текста: услышав сказанное, Иисус указывает на один остающийся недостаток, повелевает продать всё и раздать бедным, обещает сокровище «на небесах» и призывает следовать за Ним. «На небесах» обоснованно сохраняет множественное число οὐρανοῖς. «Раздай бедным» удачно передаёт распределительный оттенок διάδος. Добавленное по-русски «это» в начальном обороте естественно и контекстуально оправдано.'
  naturalness: Текст звучит естественно на современном литературном русском. Формула «Одного тебе ещё недостаёт» несколько возвышенна, но прозрачна, уместна в речи Иисуса и хорошо сохраняет устройство греческой фразы. «Затем приходи и следуй за мной» является допустимой связной передачей δεῦρο καὶ ἀκολούθει μοι; слово «затем» лишь делает явной последовательность повелений и не создаёт богословского вывода.
  terminology: 'Ключевые выражения переданы последовательно и в подходящем регистре: «бедные», «сокровище», «небеса», «следуй за мной». Не внесено конфессионально обусловленных толкований относительно объёма требования продать имущество. Строчная буква в «мной» соответствует заявленной нейтральной современной орфографической политике.'
