    issue: «Строго велели ему замолчать» для ἐπετίμων αὐτῷ
    rationale: ἐπιτιμάω означает строго упрекать, одёргивать, порицать; хотя в контексте это имеет целью заставить его замолчать, русский глагол «велели» делает действие прежде всего приказом. Кроме того, форма «велели» слабее обозначает продолжающееся/повторяемое действие имперфекта, чем «одёргивали».
  revised_text: 'И те, кто шёл впереди, строго одёргивали его, чтобы он замолчал, но он кричал ещё сильнее: «Сын Давида, помилуй меня!»'
