  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ru
  text: 'И те, кто шёл впереди, строго одёргивали его, чтобы он замолчал, но он кричал ещё сильнее: «Сын Давида, помилуй меня!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: те, кто шёл впереди
  rationale: Субстантивированное причастие настоящего времени обозначает людей, находившихся впереди в движущейся толпе; перевод сохраняет пространственный смысл, не приписывая им роли предводителей.
- source_word: ἐπετίμων αὐτῷ
  choice: строго велели ему
  rationale: Глагол передаёт резкий выговор или строгое приказание; в сочетании с целью замолчать естественный русский перевод выражает силу и направленность действия. Несовершенный вид «велели» допускает продолжавшееся или повторявшееся действие.
- source_word: ἵνα σιγήσῃ
  choice: замолчать
  rationale: Конструкция ἵνα с аористом сослагательного наклонения выражает цель; инфинитив после «велели» естественно передаёт требование прекратить говорить или кричать.
- source_word: αὐτὸς δὲ
  choice: но он
  rationale: Противительный союз и местоимение создают контраст с попыткой толпы заставить его замолчать; по-русски эмфаза достаточно передаётся сочетанием «но он».
- source_word: πολλῷ μᾶλλον
  choice: ещё сильнее
  rationale: Сравнительный усилитель означает «гораздо больше»; при глаголе крика «ещё сильнее» звучит естественно, не сводя смысл исключительно к громкости.
- source_word: ἔκραζεν
  choice: кричал
  rationale: Имперфект передаёт продолжительное или повторное действие. Русский несовершенный вид сохраняет эту аспектуальность.
- source_word: Υἱὲ Δαυίδ
  choice: Сын Давида
  rationale: Прямой перевод звательного обращения сохраняет его давидовское и мессианское значение.
- source_word: ἐλέησόν με
  choice: помилуй меня
  rationale: Краткая повелительная форма естественна для настойчивой мольбы и сохраняет библейско-богословскую насыщенность понятия милости.
theological_decisions:
- issue: Мессианское значение обращения Υἱὲ Δαυίδ
  choice: Передать в основном тексте как титул «Сын Давида».
  alternative: Понять как обычное почтительное обращение без мессианского оттенка.
  rationale: В повествовании Луки это обращение несёт давидовско-мессианский смысл. Прямой перевод сохраняет его, не добавляя в текст пояснительного толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, энергичным ритмом. Реплика передана как настойчивая мольба; архаические формы и конфессионально окрашенные добавления отсутствуют.
