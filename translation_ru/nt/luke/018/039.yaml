  source_fidelity: 'В целом смысл передан верно: люди впереди пытаются заставить слепого умолкнуть, а он продолжает взывать с большей силой. Однако «строго велели» несколько сдвигает ἐπετίμων от упрёка/одёргивания к прямому приказу и не так ясно передаёт несовершенный вид глагола.'
  naturalness: Текст звучит естественно на современном литературном русском. Формулировка «строго одёргивали его, чтобы он замолчал» столь же естественна и точнее передаёт действие в греческом.
  terminology: «Сын Давида» точно сохраняет титул и его давидовско-мессианскую значимость без добавочного толкования. «Помилуй меня» уместно и соответствует ἐλέησόν με.
