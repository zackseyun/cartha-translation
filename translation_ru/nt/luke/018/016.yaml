  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ru
  text: 'Но Иисус подозвал их к Себе и сказал: «Пусть дети приходят ко Мне, не препятствуйте им, потому что Царство Божье принадлежит таким, как они»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «ибо Царство Божье — таких».'
    reason: Передаёт компактную греческую конструкцию τῶν τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ без навязывания толкования её генитива.
lexical_decisions:
- source_word: προσεκαλέσατο αὐτά
  choice: подозвал их
  rationale: Средняя форма глагола передаёт призыв приблизиться к говорящему; «подозвал их» естественно и кратко выражает это по-русски.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Пусть дети приходят ко Мне
  rationale: Конструкция означает разрешение или требование не мешать детям идти к Иисусу. Настоящее время инфинитива естественно передаётся формой «приходят».
- source_word: μὴ κωλύετε αὐτά
  choice: не препятствуйте им
  rationale: κωλύω обозначает создание помех или воспрепятствование; перевод сохраняет прямой запрет без излишнего уточнения, идёт ли речь о продолжающемся действии.
- source_word: τῶν ... τοιούτων
  choice: таким, как они
  rationale: Выражение указывает не только на присутствующих детей, но и на представляемую ими категорию людей, не определяя здесь конкретного качества сходства.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся, понятное современному русскому читателю обозначение Божьего царствования и принадлежащей Богу сферы правления.
theological_decisions:
- issue: Смысл τῶν τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье принадлежит таким, как они
  alternative: у таких есть Царство Божье / таковых есть Царство Божье
  rationale: Формулировка естественно передаёт генитив принадлежности или соотнесённости и сохраняет открытым вопрос, в каком именно отношении люди должны быть подобны детям.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит просто и достойно. Заглавные буквы в «Мне» и «Царство Божье» соответствуют распространённой русской библейской орфографии.
