  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: ru
  text: 'Говорю вам: Он без промедления совершит правосудие в их пользу[a]. Но Сын Человеческий, когда придёт, найдёт ли веру[b] на земле?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быстро восстановит их права», «дарует им правосудие» или «оправдает их». Греческое выражение может обозначать судебное оправдание или совершение правосудия в чью-либо пользу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верность» или «доверие». Греческое слово может обозначать веру, доверие или верность; в основном тексте сохранено более широкое слово «вера».'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: восстановит справедливость для них
  rationale: Оборот обозначает совершение правосудия или судебное оправдание в пользу Божьих избранных. Эта формулировка сохраняет судебный смысл контекста и не усиливает оттенок возмездия.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: Выражение допускает смысл быстроты или отсутствия промедления. «Вскоре» естественно передаёт временной аспект, а неоднозначность отмечена в сноске.
- source_word: πλὴν
  choice: но
  rationale: Союз вводит сильный контраст между заверением в Божьем правосудии и последующим испытующим вопросом; краткое «но» естественно и выразительно по-русски.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшаяся передача титула, сохраняющая его библейские и мессианские связи.
- source_word: ἐλθὼν
  choice: когда придёт
  rationale: Аористное причастие здесь естественно понимать во временном значении по отношению к сказуемому «найдёт».
- source_word: ἆρα
  choice: ли
  rationale: Греческая частица придаёт вопросу размышляющий, испытующий характер. В русском этот оттенок естественно выражается вопросительной конструкцией с «ли»; добавление «действительно» было бы излишне подчёркнутым.
- source_word: τὴν πίστιν
  choice: веру
  rationale: «Вера» сохраняет широту πίστις и не сужает её заранее до доверия или верности; возможные оттенки отмечены в сноске.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Прямое и естественное соответствие, уместное для всеобщего эсхатологического масштаба высказывания.
theological_decisions:
- issue: Значение πίστις в контексте настойчивой молитвы
  choice: вера
  alternative: верность; доверие
  rationale: Основной текст сохраняет широкое значение греческого слова и богословское напряжение вопроса; более узкие контекстуальные варианты вынесены в сноску.
- issue: Временной оттенок ἐν τάχει
  choice: вскоре
  alternative: быстро; без промедления
  rationale: Греческий оборот может указывать как на скорое наступление, так и на быстроту действия. Основной текст выбирает естественную временную формулировку, не скрывая альтернативы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Риторический вопрос сохранён без добавления наречия «действительно», поскольку его испытующая сила естественно выражена русской конструкцией «найдёт ли». Все сноски обозначены в основном тексте.
