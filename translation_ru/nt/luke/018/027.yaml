base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: ru
  text: 'Но он сказал: «Невозможное для людей возможно для Бога».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: невозможное
  rationale: Субстантивированное прилагательное среднего рода во множественном числе естественно передаётся по-русски собирательным «невозможное», сохраняя обобщённый смысл.
- source_word: παρὰ ἀνθρώποις
  choice: для людей
  rationale: παρά с дательным обозначает сферу или точку отсчёта; «для людей» ясно передаёт человеческую неспособность и звучит естественно в современном русском языке.
- source_word: δυνατὰ
  choice: возможно
  rationale: Антоним ἀδύνατα в параллельной конструкции; краткая форма «возможно» точно и естественно сохраняет противопоставление.
- source_word: παρὰ τῷ θεῷ
  choice: для Бога
  rationale: Параллельно выражению παρὰ ἀνθρώποις эта фраза обозначает сферу божественной возможности; «для Бога» сохраняет симметрию высказывания.
- source_word: ὁ δὲ εἶπεν
  choice: Но он сказал
  rationale: 'δέ здесь имеет лёгкий противительный оттенок: ответ Иисуса противопоставлен только что выраженному человеческому недоумению.'
theological_decisions:
- issue: Объём утверждения о божественной возможности
  choice: Сохранено обобщённое противопоставление человеческой невозможности и Божьей возможности в контексте спасения.
  alternative: Истолковать фразу как отвлечённое философское утверждение об абсолютной возможности любого мыслимого действия.
  rationale: Греческий текст формулирует широкое утверждение, но ближайший контекст касается спасения и вхождения богатого в Царство Божье. Перевод не сужает высказывание и не добавляет к нему философского определения.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и легко понятная формулировка. Параллелизм «для людей — для Бога» передаёт структуру греческого текста без ненужной архаизации.
