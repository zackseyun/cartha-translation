  text: λέγων· Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: ru
  text: 'говоря: «В одном городе был некий судья, который не боялся Бога и не считался с людьми[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с человеком»; по смыслу также возможно: «не считался ни с кем».'
    reason: 'Лексическая альтернатива: в греческом стоит родовое единственное число ἄνθρωπον.'
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени вводит содержание притчи и сохраняет синтаксическую связь с предыдущим стихом.
- source_word: Κριτής τις
  choice: некий судья
  rationale: Неопределённое τις указывает на неназванного участника рассказа; «некий» естественно для повествовательного зачина.
- source_word: ἔν τινι πόλει
  choice: в одном городе
  rationale: Передаёт неопределённость второго τις современным и естественным русским оборотом без архаичного «в некоем городе».
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: не боялся Бога
  rationale: Сохраняет религиозно-нравственный смысл глагола φοβέομαι и передаёт постоянную характеристику судьи.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: не считался с людьми
  rationale: ἐντρέπομαι здесь означает проявлять уважение или считаться с кем-либо; множественное «с людьми» естественно передаёт родовое значение единственного ἄνθρωπον.
theological_decisions:
- issue: Родовое единственное число ἄνθρωπον в противопоставлении Богу
  choice: с людьми
  alternative: с человеком; ни с кем
  rationale: Русское «не считался с людьми» ясно передаёт обобщённый смысл и сохраняет противопоставление отношения к Богу и к другим людям. Буквальное единственное число может ошибочно восприниматься как указание на конкретного человека; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого повествования. Оборот «не считался с людьми» естественнее буквального «не уважал человека» и передаёт отсутствие уважения и внимания к людям.
