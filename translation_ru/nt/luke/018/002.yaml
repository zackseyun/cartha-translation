  terminology: '«Бог» передан последовательно и уместно. Формулировка о людях сохраняет нравственное противопоставление: судья не благоговеет перед Богом и не проявляет должного отношения к людям. Сноска верно объясняет родовое единственное число и даёт допустимый смысловой вариант.'
