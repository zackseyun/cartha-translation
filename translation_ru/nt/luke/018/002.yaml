  source_fidelity: Текст точно передаёт греческий оригинал. «Говоря» корректно сохраняет связь причастия λέγων с предыдущим контекстом. «Некий судья» и «в одном городе» адекватно отражают два неопределённых τις. «Не боялся Бога» хорошо передаёт τὸν θεὸν μὴ φοβούμενος, а «не считался с людьми» естественно выражает обобщённое ἄνθρωπον μὴ ἐντρεπόμενος без неоправданного сужения к одному человеку.
