  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: ru
  text: 'Он ответил: «Всё это я соблюдал с юности».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Он ответил
  rationale: В данном диалоге εἶπεν естественно передаётся как «ответил»; δέ служит мягкой связкой и не требует выраженного противопоставления.
- source_word: Ταῦτα πάντα
  choice: Всё это
  rationale: Передаёт греческое выражение без добавления слова «заповеди», которое подразумевается контекстом, но отсутствует в оригинале.
- source_word: ἐφύλαξα
  choice: я соблюдал
  rationale: В контексте заповедей φυλάσσω означает «соблюдать». Русский глагол несовершенного вида естественно выражает соблюдение на протяжении времени до момента речи.
- source_word: ἐκ νεότητος μου
  choice: с юности
  rationale: Естественная современная русская передача исходной временной точки; притяжательное местоимение в русском здесь избыточно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский; краткая и естественная реплика, сохраняющая смысловую неопределённость выражения «всё это».
