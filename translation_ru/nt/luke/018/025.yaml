base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: ru
  text: Ведь верблюду легче пройти сквозь игольное ушко, чем богатому войти в Царство Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предлагались толкования, согласно которым речь идёт об узких воротах под названием «Игольное ушко» или о «канате» вместо верблюда, однако в греческом тексте здесь стоит слово «верблюд».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: легче
  rationale: Сравнительное прилагательное при ἐστιν естественно передаётся по-русски предикативной формой «легче».
- source_word: γάρ
  choice: ведь
  rationale: «Ведь» естественно сохраняет пояснительную связь с предыдущими словами Иисуса.
- source_word: κάμηλον
  choice: верблюду
  rationale: Обычное и текстуально засвидетельствованное значение κάμηλος — «верблюд»; дательный падеж обусловлен естественной русской конструкцией «кому легче».
- source_word: διὰ τρήματος βελόνης
  choice: сквозь игольное ушко
  rationale: Передаёт отверстие иглы точно и идиоматично; «сквозь» подчёркивает прохождение через отверстие.
- source_word: εἰσελθεῖν
  choice: пройти / войти
  rationale: В первом образе «пройти» по-русски естественнее при прохождении сквозь отверстие, а во втором «войти» точно соответствует направлению εἰς и устойчивому выражению о Царстве Бога.
- source_word: πλούσιον
  choice: богатому
  rationale: Субстантивированное прилагательное мужского рода передано формой «богатому» без добавления отсутствующего в греческом существительного.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: войти в Царство Бога
  rationale: Сохраняет направительное значение εἰς и прозрачно передаёт ключевое библейское выражение βασιλεία τοῦ θεοῦ.
theological_decisions:
- issue: Толкование образа верблюда и игольного ушка
  choice: 'Сохранён буквальный гиперболический образ: верблюд проходит сквозь игольное ушко.'
  alternative: Узкие ворота под названием «Игольное ушко» либо «канат» вместо «верблюда».
  rationale: Предоставленный греческий текст читает κάμηλον, «верблюда», и не даёт оснований вводить позднейшие объяснения в основной текст. Нарочито невозможный образ сохраняет силу высказывания.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, выразительная и понятная. «Игольное ушко» — обычное русское название отверстия в игле. Заглавная буква в слове «Царство» отмечает устойчивое богословское понятие, не добавляя конфессионального толкования.
