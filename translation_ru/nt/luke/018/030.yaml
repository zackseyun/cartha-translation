  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: ru
  text: кто непременно получит во много раз больше в нынешнее время, а в грядущем веке — вечную жизнь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: непременно
  rationale: Сочетание с аористом конъюнктива выражает усиленное заверение. «Непременно получит» естественно передаёт эту уверенность по-русски без громоздкого двойного отрицания.
- source_word: ἀπολάβῃ
  choice: получит
  rationale: В контексте слово обозначает получение воздаяния; значение возврата подразумевается контекстом и не требует добавления «обратно».
- source_word: πολλαπλασίονα
  choice: во много раз больше
  rationale: Передаёт идею многократного, значительно превосходящего воздаяния современным и ясным русским выражением.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: уже в нынешнее время
  rationale: «Нынешнее время» естественно выражает указание на настоящее и сохраняет противопоставление грядущему веку; «уже» подчёркивает контекстуальный контраст, не меняя смысла.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: в грядущем веке
  rationale: Устойчиво и ясно сохраняет новозаветное противопоставление нынешнего времени и будущего эсхатологического века.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Общепонятный и контекстуально точный перевод устойчивого евангельского выражения.
- source_word: ὃς
  choice: кто
  rationale: Относительное местоимение продолжает начатую в предыдущем стихе конструкцию; «кто» естественно в русском синтаксисе.
theological_decisions:
- issue: Эсхатологическое выражение αἰῶνι τῷ ἐρχομένῳ
  choice: в грядущем веке
  alternative: в веке, который грядёт
  rationale: «Грядущий век» сохраняет двухвековую эсхатологическую перспективу текста и не сводит её просто к неопределённому будущему.
- issue: Характер обещанного воздаяния в настоящем
  choice: получит во много раз больше уже в нынешнее время
  alternative: не останется без многократного воздаяния в нынешнее время
  rationale: Прямая утвердительная формулировка передаёт уверенность усиленного греческого отрицания, не уточняя сверх текста конкретную форму земного воздаяния.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Тире перед «вечную жизнь» помогает обозначить смену объекта получения и ясно соотнести вечную жизнь с грядущим веком.
