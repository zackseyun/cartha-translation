  language: ru
  text: Пощусь два раза в неделю[a], отдаю десятую часть всего, что приобретаю».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дважды [в течение] субботы/недели»; это оборот со значением «два раза в неделю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Пощусь
  rationale: Настоящее время в самохарактеристике обозначает регулярное, обычное действие; русская форма настоящего времени естественно передаёт этот смысл.
- source_word: δὶς τοῦ σαββάτου
  choice: два раза в неделю
  rationale: Буквально «дважды [в течение] субботы/недели»; это койне-идиома, обозначающая частоту в пределах недели.
- source_word: ἀποδεκατῶ
  choice: отдаю десятую часть
  rationale: Глагол означает выделять или отдавать десятую часть; развёрнутая формулировка прозрачнее для современного читателя, чем церковный термин «даю десятину».
- source_word: πάντα ὅσα
  choice: всего, что
  rationale: Передаёт всеохватный смысл сочетания и естественно связывает его с последующим глаголом.
- source_word: κτῶμαι
  choice: приобретаю
  rationale: Средний залог здесь имеет значение «приобретать, получать в собственность», а не просто статическое «иметь».
theological_decisions:
- issue: Значение τοῦ σαββάτου в указании частоты поста
  choice: идиоматическое временное значение «в неделю»
  alternative: буквальное «субботы»
  rationale: Фраза указывает на частоту поста, а не утверждает, что говорящий постится именно в субботу; идиоматический перевод предотвращает ложное богословское заключение.
translation_notes:
  register: Современный литературный русский язык; речь краткая и самоуверенная, в соответствии с контекстом молитвы фарисея. Начальная строчная форма и заключительная кавычка предполагают включение стиха в продолжающуюся прямую речь.
