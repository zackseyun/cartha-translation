base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: ru
  text: 'Тогда Пётр сказал: «Вот, мы оставили всё своё[a] и последовали за Тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что было нашим»; или: «своё имущество». Греческое выражение имеет широкий смысл и не уточняет, что именно оставили Пётр и другие ученики.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: Тогда Пётр сказал
  rationale: δέ обозначает продолжение повествования с лёгким переходом; «тогда» естественно передаёт эту связь, а εἶπεν — нейтральное «сказал».
- source_word: Ἰδοὺ
  choice: Вот
  rationale: В данном контексте это слово привлекает внимание к заявлению Петра; «вот» звучит естественно и сохраняет его выразительность.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение имеет лёгкое смысловое ударение, естественно сохраняемое русским «мы».
- source_word: ἀφέντες τὰ ἴδια
  choice: оставили всё своё
  rationale: Субстантивированное τὰ ἴδια широко обозначает то, что принадлежало ученикам или было для них своим. «Всё своё» по-русски естественно и не ограничивает смысл только имуществом.
- source_word: ἠκολουθήσαμέν σοι
  choice: последовали за Тобой
  rationale: Глагол ἀκολουθέω с дательным обозначает следование за человеком и в этом контексте несёт ученический оттенок; стандартное русское соответствие — «последовали за Тобой».
theological_decisions: []
