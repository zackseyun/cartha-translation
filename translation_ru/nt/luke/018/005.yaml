  source_fidelity: 'Основной смысл передан верно: речь о настойчивости вдовы, судебном удовлетворении её требования и опасении судьи быть изнурённым её постоянными приходами. Однако «добьюсь для неё справедливости» неточно характеризует действие судьи: по-русски это скорее значит, что он будет добиваться справедливости у кого-то другого. Греческое ἐκδικήσω αὐτήν в данном судебном контексте означает, что судья сам предоставит ей правовую защиту/восстановит её права.'
  naturalness: «Не даёт мне покоя» и «изводила меня» естественны для современного литературного русского. Формулировка цели лучше звучит как «чтобы она, приходя без конца, не изводила меня», поскольку постоянное приходить является обстоятельством при «изводила», а не вторым равноправным действием.
  terminology: «Восстановлю её права» сохраняет юридическую направленность ἐκδικέω и не вносит идеи личной мести. Сноска к ὑπωπιάζῃ должна точнее обозначать буквальный образ как удар под глаз, а не как буквальное «не ударяла меня под глаз».
