  text: но раз уж эта вдова не даёт мне покоя, я восстановлю её права[a], чтобы она, приходя без конца, не изводила меня[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «защищу её права» или «вынесу решение в её пользу». В некоторых контекстах греческий глагол может означать «отомщу за неё», но здесь речь идёт о справедливом судебном решении.'
