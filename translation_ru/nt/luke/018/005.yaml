    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην
  choice: но поскольку эта вдова не даёт мне покоя
  rationale: διά с субстантивированным инфинитивом выражает причину, а γε усиливает её; настоящее παρέχειν передаёт продолжающееся действие. Русская идиома «не даёт мне покоя» естественно выражает причиняемые хлопоты и настойчивость вдовы.
- source_word: ἐκδικήσω αὐτήν
  choice: добьюсь для неё справедливости
  rationale: В судебном контексте глагол означает обеспечить законное воздаяние или защиту её прав, а не совершить личную месть. Такая формулировка также естественно предполагает действие судьи по её делу.
- source_word: εἰς τέλος ἐρχομένη
  choice: не ходила ко мне без конца
  rationale: 'Причастие настоящего времени в контексте обозначает повторные приходы, а εἰς τέλος передаёт перспективу судьи: этому не видно конца.'
- source_word: ὑπωπιάζῃ με
  choice: не изводила меня
  rationale: Буквально глагол связан с ударом под глаз, но здесь образно описывает изматывающее воздействие постоянной настойчивости. «Изводила» сохраняет силу выражения и звучит естественно по-русски.
theological_decisions:
- issue: Значение ἐκδικήσω в притче о молитве и справедливости
  choice: добьюсь для неё справедливости
  alternative: отомщу за неё; защищу её права
  rationale: Речь идёт о судебном удовлетворении требования вдовы. Выбор сохраняет связь со справедливым решением в ближайшем контексте и не привносит оттенка личной мести.
- issue: Степень буквальности ὑπωπιάζῃ
  choice: не изводила меня
  alternative: не поставила мне синяк под глаз; не измучила меня
  rationale: Контекст допускает яркую буквальную основу, но наиболее вероятно образное употребление о том, что настойчивость вдовы изматывает судью. Сноска сохраняет исходный образ и реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Реплика судьи звучит раздражённо, но без просторечия; сохранены судебная тема, длительность действий и яркость заключительной греческой идиомы через сноску.
