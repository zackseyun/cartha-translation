  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: ru
  text: '«Что ты хочешь, чтобы Я для тебя сделал?» Он ответил: «Господи[a], чтобы я снова видел[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое κύριε могло быть почтительным обращением, хотя обычно оно переводится как «Господи».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «чтобы я вновь обрёл зрение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί σοι θέλεις ποιήσω
  choice: Что ты хочешь, чтобы Я для тебя сделал?
  rationale: Передаёт прямой вопрос о желаемом действии; дательный σοι естественно выражен сочетанием «для тебя», а сослагательная конструкция — современным русским оборотом «чтобы Я… сделал».
- source_word: ὁ δὲ εἶπεν
  choice: Он ответил
  rationale: В данном диалоге εἶπεν естественно передаётся как «ответил»; частица δέ служит переходом к реплике и не требует противительного союза.
- source_word: Κύριε
  choice: Господи
  rationale: Сохраняет обычное соответствие κύριος — «Господь» и возможное христологическое звучание обращения, не исключая того, что слово могло служить почтительным обращением.
- source_word: ἵνα ἀναβλέψω
  choice: дай мне снова видеть
  rationale: После глагола волеизъявления ἵνα вводит содержание просьбы. В контексте исцеления ἀναβλέπω означает восстановление зрения; русская форма просьбы звучит естественно и сохраняет прямоту реплики.
theological_decisions:
- issue: Обращение κύριε к Иисусу
  choice: Господи
  alternative: Господин
  rationale: «Господи» сохраняет как почтительность, так и возможное признание более высокого статуса Иисуса. Простой перевод только как светское обращение снял бы присутствующую в греческом богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой евангельской речи. Прописная «Я» в словах Иисуса следует принятой русской библейской издательской традиции. Формулировка «дай мне снова видеть» естественнее буквального «чтобы я снова видел» как самостоятельный ответ-просьба.
