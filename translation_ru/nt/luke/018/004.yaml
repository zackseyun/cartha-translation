  text: καὶ οὐκ ⸀ἤθελεν ἐπὶ χρόνον, μετὰ ⸂ταῦτα δὲ⸃ εἶπεν ἐν ἑαυτῷ· Εἰ καὶ τὸν θεὸν οὐ φοβοῦμαι ⸂οὐδὲ ἄνθρωπον⸃ ἐντρέπομαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: ru
  text: 'Некоторое время он не хотел этого делать, но потом сказал себе: «Хотя я и Бога не боюсь, и ни с кем не считаюсь[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никого не уважаю». Буквально: «не почитаю человека»; родовое единственное число здесь обозначает людей вообще.'
    reason: Глагол ἐντρέπομαι в данном контексте означает считаться с кем-либо, проявлять к нему уважение или почтение.
lexical_decisions:
- source_word: ἤθελεν
  choice: не хотел этого делать
  rationale: Имперфект передаёт продолжавшееся нежелание судьи; добавление «этого делать» естественно восполняет подразумеваемое действие из контекста, не усиливая значение до окончательного «отказывался».
- source_word: ἐπὶ χρόνον
  choice: некоторое время
  rationale: Передаёт неопределённую продолжительность и естественно звучит в современном русском повествовании.
- source_word: μετὰ ταῦτα δὲ
  choice: но потом
  rationale: Сохраняет временную последовательность и лёгкое противопоставление.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: сказал себе
  rationale: Прямо и естественно вводит внутреннюю речь, не сводя её к общему «подумал».
- source_word: Εἰ καὶ
  choice: Хотя ... и
  rationale: Конструкция здесь уступительная, а не условная; русское «хотя ... и» ясно передаёт признание факта.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: Бога не боюсь
  rationale: Сохраняет прямое библейское выражение и нравственную резкость самооценки судьи, не сужая смысл до одного лишь почтения.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: и людей не стыжусь
  rationale: ἐντρέπομαι допускает оттенки стыда перед кем-либо, почтения и уважения; «не стыжусь людей» сохраняет характерный образ исходного глагола, тогда как множественное «людей» естественно передаёт родовое единственное ἄνθρωπον по-русски.
theological_decisions:
- issue: Значение ἐντρέπομαι в характеристике неправедного судьи
  choice: людей не стыжусь
  alternative: с людьми не считаюсь / людей не уважаю
  rationale: Выбранный вариант сохраняет присущую греческому глаголу связь со стыдом перед другим человеком и не устраняет его смысловую широту; примечание сообщает более идиоматические альтернативы.
- issue: Родовое единственное ἄνθρωπον
  choice: людей
  alternative: человека
  rationale: В данном отрицательном обороте множественное число естественно выражает обобщённый смысл «никого из людей» и не превращает родовое обозначение в указание на конкретного мужчину.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис сохраняет незавершённость стиха, поскольку реплика продолжается в следующем стихе.
