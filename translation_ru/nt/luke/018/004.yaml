  terminology: «Бога не боюсь» сохраняет библейски узнаваемое и контекстуально оправданное выражение. Для οὐδὲ ἄνθρωπον ἐντρέπομαι предпочтительно передать отсутствие считания с людьми/уважения к ним, не делая «стыд» основным значением. Родовой смысл ἄνθρωπον естественно выражен русским «ни с кем».
