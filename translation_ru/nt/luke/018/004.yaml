  source_fidelity: 'Основной смысл передан верно: длительное нежелание, последующее внутреннее высказывание и уступительная конструкция сохранены. Однако «людей не стыжусь» в современном русском прежде всего означает отсутствие чувства стыда перед людьми, тогда как ἐντρέπομαι здесь характеризует отсутствие уважения, почтения или оглядки на людей. Такой выбор заметно смещает характеристику судьи.'
