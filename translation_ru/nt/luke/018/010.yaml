  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: ru
  text: 'Два человека поднялись в храм помолиться[a]: один — фарисей, а другой — сборщик налогов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἱερόν означает весь храмовый комплекс, включая дворы, а не только внутреннее святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Два человека
  rationale: В русском «два человека» естественно обозначает двух мужчин, личности которых далее названы существительными мужского рода; вариант «двое мужчин» был бы более явно гендерным, но менее нейтральным по стилю.
- source_word: ἀνέβησαν
  choice: поднялись
  rationale: Сохраняет пространственное значение ἀναβαίνω и библейскую географическую идиому восхождения к храму.
- source_word: εἰς τὸ ἱερὸν
  choice: в храм
  rationale: ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище; «в храм» — естественная русская формулировка, а уточнение вынесено в сноску.
- source_word: προσεύξασθαι
  choice: помолиться
  rationale: Инфинитив цели передан естественной русской формой; совершенный вид уместно выражает намерение совершить молитву, не ограничивая её длительность.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: один ... а другой
  rationale: Естественно передаёт распределительное противопоставление двух лиц.
- source_word: Φαρισαῖος
  choice: фарисей
  rationale: Устоявшееся современное русское название представителя религиозного движения.
- source_word: τελώνης
  choice: сборщик налогов
  rationale: Передаёт занятие τελώνης понятным современным языком; «мытарь» традиционно, но архаично и менее прозрачно для обычного читателя.
theological_decisions:
- issue: Различение ἱερόν и ναός
  choice: храм с пояснением о храмовом комплексе
  alternative: храмовый двор / храмовый комплекс
  rationale: Текст говорит о пространстве всего храмового комплекса, а не обязательно о внутреннем святилище. Основной текст сохраняет естественное слово «храм», не создавая ложной конкретизации.
- issue: Гендерное значение ἄνθρωποι
  choice: два человека
  alternative: двое мужчин
  rationale: Контекст указывает на мужчин, однако русское «два человека» не скрывает этого и звучит естественнее; последующие наименования мужского рода устраняют возможную неопределённость.
- issue: Передача τελώνης без традиционно-конфессиональной окраски
  choice: сборщик налогов
  alternative: мытарь
  rationale: Современный функциональный эквивалент позволяет понять социальную роль персонажа без архаического термина и без добавления моральной оценки.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и достойная по тону. Двоеточие вводит пояснение о двух людях, а тире подчёркивают естественное противопоставление «один — ... другой — ...».
