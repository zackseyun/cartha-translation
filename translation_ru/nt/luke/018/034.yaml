source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: ru
  text: И они ничего из этого не поняли. Сказанное[a] было скрыто от них[b], и они не понимали того, о чём шла речь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это слово»; возможно также: «это изречение».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте не сказано, кем или чем сказанное было скрыто от них.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: не поняли
  rationale: Глагол обозначает умственное постижение предшествующих слов Иисуса; «не поняли» естественно и точно передаёт этот смысл.
- source_word: οὐδὲν τούτων
  choice: ничего из этого
  rationale: Оборот отсылает ко всему сказанному выше и сохраняет собирательную множественную отсылку.
- source_word: τὸ ῥῆμα τοῦτο
  choice: сказанное
  rationale: В данном контексте ῥῆμα означает произнесённое слово или высказывание. «Сказанное» звучит естественнее буквального «это слово», не сводя выражение лишь к отдельному слову.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: было скрыто от них
  rationale: Передаёт результирующее состояние перфектного страдательного причастия и сохраняет страдательную конструкцию без указания действующего лица.
- source_word: ἐγίνωσκον
  choice: не понимали
  rationale: Хотя основной диапазон γινώσκω связан со знанием и узнаванием, здесь контекст требует смысла осознания или понимания сказанного. Несовершенный вид передаёт длительный характер непонимания.
- source_word: τὰ λεγόμενα
  choice: того, о чём шла речь
  rationale: Естественный русский оборот передаёт содержание произносимого без тяжеловесного буквального «говоримых вещей».
theological_decisions:
- issue: Причина сокрытости сказанного от учеников
  choice: Сохранить безличную страдательную формулировку «было скрыто от них».
  alternative: Прямо назвать Бога скрывшим смысл либо объяснить сокрытость психологической растерянностью учеников.
  rationale: Греческий текст не называет того, кто или что скрыло сказанное; перевод не должен устранять эту богословскую и повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным ритмом. Трёхчастное описание непонимания сохранено; буквальные греческие конструкции сглажены лишь там, где они были бы неестественны по-русски.
