  source_fidelity: 'Смысл передан верно: речь идёт о реакции людей, слышавших предыдущее высказывание, и о возможности спасения. Однако «тогда» в вопросе несколько сильнее оформляет логический вывод, чем греческое καί; его можно передать русским «же» без добавления временно-выводного оттенка.'
