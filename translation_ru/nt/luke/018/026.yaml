  text: Then those who heard it said, “And who can be saved?”
translation:
  language: ru
  text: 'Те, кто это слышал, сказали: «Кто же может спастись?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: сказали
  rationale: Аорист изъявительного наклонения естественно передаётся формой прошедшего времени, обозначающей единичную реплику в повествовании.
- source_word: δὲ
  choice: связь передана порядком слов и ходом повествования
  rationale: Частица обозначает переход к реакции слушателей; отдельное «тогда» здесь могло бы неуместно дублировать русское «тогда» внутри вопроса.
- source_word: οἱ ἀκούσαντες
  choice: услышавшие это
  rationale: Субстантивированное причастие обозначает людей, услышавших предыдущее высказывание Иисуса; «это» естественно восполняет подразумеваемый из контекста объект.
- source_word: Καὶ τίς
  choice: кто же тогда
  rationale: Начальное καί выражает изумлённое следствие или продолжение мысли. В современном русском его силу естественнее передать сочетанием «же тогда», а не буквальным «и кто».
- source_word: δύναται
  choice: может
  rationale: Передаёт способность или возможность кратко и естественно.
- source_word: σωθῆναι
  choice: спастись
  rationale: В контексте речи о вхождении в Божье Царство глагол имеет сотериологический смысл; русское «спастись» является естественным и традиционно понятным соответствием пассивной форме.
theological_decisions:
- issue: Значение σωθῆναι в контексте
  choice: спастись
  alternative: быть спасённым; получить избавление
  rationale: Контекст говорит о вхождении в Божье Царство, поэтому речь идёт о спасении, а не только об избавлении от конкретной земной опасности. Возвратная русская форма не подразумевает самоспасения, а является обычным способом передать значение «получить спасение».
translation_notes:
  register: Современный литературный русский язык; реплика звучит естественно и передаёт изумление слушателей. Краткость греческого текста сохранена, конфессионально специфические толкования не добавлены.
