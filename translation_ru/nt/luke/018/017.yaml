  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ru
  text: 'Истинно говорю вам: кто не примет Царство Божье как ребёнок[a], тот ни в коем случае не войдёт в него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как дитя». Сравнение может подразумевать восприимчивость, доверие, смирение или зависимость, но греческий текст прямо не уточняет, какое именно качество имеется в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Истинно
  rationale: В начальной формуле Иисуса это слово служит торжественным подтверждением истинности последующего высказывания. «Истинно» естественно и понятно передаёт эту силу, не прибегая к менее прозрачной транслитерации «аминь».
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямое и естественное соответствие формуле обращения; сохраняет торжественный, но понятный современному читателю тон.
- source_word: ὃς ἂν
  choice: кто
  rationale: Сочетание выражает общее неопределённое условие. Русская конструкция «кто… тот…» передаёт его ясно и естественно.
- source_word: μὴ δέξηται
  choice: не примет
  rationale: δέχομαι здесь означает принять, согласившись получить. «Примет» естественно сочетается с «Царством Божьим» и не сужает образ до одного конкретного оттенка восприимчивости.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Устоявшееся и прозрачное русское обозначение Божьего царствования и царства; родительный падеж обусловлен отрицанием при глаголе «примет».
- source_word: ὡς παιδίον
  choice: как ребёнок
  rationale: Сохраняет неразъяснённое сравнение оригинала и не уточняет самовольно, идёт ли речь прежде всего о доверии, смирении, зависимости или восприимчивости.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: ни в коем случае не войдёт
  rationale: Двойное отрицание с аористом конъюнктива выражает решительное, усиленное отрицание. Эта русская формулировка сохраняет эмфатическую силу без добавления временного значения.
- source_word: εἰς αὐτήν
  choice: в него
  rationale: Местоимение отсылает к Царству; мужской род соответствует русскому существительному «Царство».
theological_decisions:
- issue: Смысл принятия Царства «как ребёнок»
  choice: Сравнение оставлено без указания конкретного детского качества.
  alternative: Передать как «с детским доверием», «с детским смирением», «в полной зависимости» или «будучи ребёнком».
  rationale: Греческий текст не называет точное качество, на котором строится сравнение. Перевод сохраняет возможные оттенки восприимчивости, доверия, смирения и зависимости, не превращая один из них в единственно верное толкование.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для прямой речи Иисуса. Конструкция «кто… тот…» обеспечивает ясность, а «ни в коем случае» передаёт усиленное отрицание без архаизации.
