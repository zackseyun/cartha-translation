  source_fidelity: 'Перевод точно передаёт греческий текст: деепричастие «увидев» соответствует Ἰδών, местоимение «его» сохраняет αὐτόν, а «Как трудно» передаёт восклицательную степень Πῶς δυσκόλως без усиления до невозможности. «Тем, у кого есть богатство» адекватно отражает οἱ τὰ χρήματα ἔχοντες, а «войти в Царство Божье» передаёт направление εἰς и глагол εἰσπορεύονται.'
