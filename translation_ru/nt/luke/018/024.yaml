  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: ru
  text: 'Иисус, увидев его, сказал: «Как трудно тем, у кого есть богатство, войти в Царство Божье!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: увидев
  rationale: Аористное причастие от ὁράω передано русским деепричастием, естественно и близко воспроизводящим обстоятельственную связь с основным глаголом.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь δέ служит слабой повествовательной связкой; в современном русском отдельное «и» или «же» утяжеляло бы фразу без существенной смысловой пользы.
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение относится к богатому начальнику из предыдущего контекста.
- source_word: Πῶς δυσκόλως
  choice: Как трудно
  rationale: Сочетание имеет восклицательное значение степени; «как трудно» естественно передаёт его силу, не превращая трудность в невозможность.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: тем, у кого есть богатство
  rationale: Передаёт субстантивированное причастие и широкое значение χρήματα — деньги, имущество, богатство — не сводя выражение к одному классовому обозначению «богатые».
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: в Царство Божье
  rationale: Устойчивое, ясное и естественное библейское выражение; предлог «в» вместе с глаголом движения передаёт направление εἰς.
- source_word: εἰσπορεύονται
  choice: войти
  rationale: Личная форма греческого глагола естественно перестроена в русский инфинитив при безличной конструкции «трудно тем... войти».
theological_decisions:
- issue: Сила высказывания Иисуса о состоятельных людях и Царстве Бога
  choice: Общее утверждение о трудности для владеющих богатством войти в Царство Божье
  alternative: Утверждение об абсолютной невозможности для богатых войти в Царство Божье
  rationale: Πῶς δυσκόλως означает «как трудно», а не «невозможно». Перевод сохраняет напряжение самого стиха, не усиливая его за пределы сказанного.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет причастную связь оригинала посредством естественного русского деепричастия; «богатство» выбрано как более широкое соответствие χρήματα.
