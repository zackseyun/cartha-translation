  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: ru
  text: 'И сказал Господь: «Послушайте, что говорит неправедный судья[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «судья неправедности»; возможно также: «несправедливый судья».'
    reason: Лексическая альтернатива и пояснение буквальной формы греческого выражения ὁ κριτὴς τῆς ἀδικίας.
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: И сказал
  rationale: Простой прошедший вид естественно передаёт аорист εἶπεν, а союз «и» сохраняет продолжительную повествовательную связь, выраженную δέ, не добавляя временного оттенка.
- source_word: ὁ κύριος
  choice: Господь
  rationale: В повествовании Луки это обозначение Иисуса имеет титульный вес; «Господь» сохраняет его, не сводя κύριος к социальному обращению «господин».
- source_word: Ἀκούσατε
  choice: Послушайте
  rationale: Повелительная форма призывает внимательно воспринять сказанное; «послушайте» звучит естественно в современном русском и сохраняет побудительную силу.
- source_word: τί
  choice: что
  rationale: Местоимение вводит содержание речи судьи, а не способ, каким он говорит.
- source_word: ὁ κριτὴς τῆς ἀδικίας
  choice: неправедный судья
  rationale: Качественный генитив τῆς ἀδικίας характеризует судью. «Неправедный» сохраняет широкий нравственный смысл ἀδικία, не ограничивая его только юридической несправедливостью.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет живость греческого изложения и естественно передаётся русским «говорит».
theological_decisions:
- issue: Передача κύριος применительно к Иисусу
  choice: Господь
  alternative: господин
  rationale: «Господь» сохраняет титульное и христологическое звучание слова в повествовании Луки, не внося дополнительного доктринального толкования.
- issue: Нравственная характеристика судьи
  choice: неправедный судья
  alternative: несправедливый судья
  rationale: «Неправедный» отражает более широкий нравственный диапазон ἀδικία; вариант «несправедливый» возможен, но может восприниматься преимущественно в юридическом смысле.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. «Послушайте» предпочтено более книжному «услышьте»; порядок слов остаётся естественным для русской повествовательной речи.
