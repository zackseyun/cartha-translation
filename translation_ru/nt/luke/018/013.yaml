id: LUK.18.13
reference: Luke 18:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: ru
  text: 'А сборщик налогов, стоя вдали, не хотел даже поднять глаза к небу, но всё бил себя в грудь и говорил: «Боже, будь милостив ко мне[a], грешнику!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умилостивись надо мной». Греческий глагол связан с языком умилостивления и искупления.'
    reason: Лексическая альтернатива сохраняет богословский оттенок ἱλάσκομαι, не перегружая основной текст специальным термином.
lexical_decisions:
- source_word: τελώνης
  choice: сборщик налогов
  rationale: Современное и понятное обозначение человека, собиравшего налоги и пошлины; точнее передаёт должность, чем устаревшее «мытарь», не стирая отрицательного общественного отношения к ней в контексте Евангелия.
- source_word: μακρόθεν
  choice: вдали
  rationale: Кратко и естественно передаёт пространственную удалённость; контекст позволяет читателю увидеть в ней также проявление смирения.
- source_word: ἑστὼς
  choice: стоя
  rationale: Естественно передаёт обстоятельственное причастие и сохраняет указание на позу.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: не хотел даже
  rationale: Передаёт волевое значение θέλω, а не физическую неспособность, и естественно звучит по-русски.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: поднять глаза к небу
  rationale: Сохраняет греческий образ и направление взгляда в естественной русской формулировке.
- source_word: ἔτυπτε
  choice: всё бил
  rationale: Имперфект указывает на продолжавшееся или повторявшееся действие; частица «всё» кратко выражает эту длительность.
- source_word: τὸ στῆθος αὐτοῦ
  choice: себя в грудь
  rationale: Это современная русская идиоматическая форма жеста скорби и раскаяния; возвратное местоимение естественно передаёт принадлежность.
- source_word: ἱλάσθητί μοι
  choice: будь милостив ко мне
  rationale: Ясно и естественно передаёт молитвенную просьбу о благосклонной милости Бога, тогда как связь глагола с умилостивлением и искуплением сохраняется в сноске.
- source_word: τῷ ἁμαρτωλῷ
  choice: грешнику
  rationale: Предикативное приложение после местоимения естественно по-русски и сохраняет самоопределение молящегося; определённый артикль может придавать выражению оттенок «тому самому грешнику», но буквальное «грешному» или «этому грешнику» было бы менее естественно и могло бы чрезмерно уточнить смысл.
theological_decisions:
- issue: Передача ἱλάσθητί μοι в молитве о Божьей милости
  choice: будь милостив ко мне
  alternative: умилостивись надо мной; яви мне милость, связанную с искуплением
  rationale: Глагол принадлежит к смысловой области умилостивления и искупления, однако в прямой молитве русское «будь милостив» понятно, достойно и не навязывает в основном тексте развёрнутую богословскую интерпретацию. Более специальный оттенок отмечен в сноске.
- issue: Определённость выражения τῷ ἁμαρτωλῷ
  choice: грешнику
  alternative: мне, грешному; мне, тому грешнику
  rationale: 'Греческий артикль способен подчёркивать самоосуждение: молящийся видит себя «тем самым грешником». Русский дательный «грешнику» сохраняет сильное самообозначение без неестественной буквальности и без решения вопроса о точной функции артикля.'
translation_notes:
  register: Современный литературный русский язык с простым, но достойным молитвенным регистром. «Сборщик налогов» выбран вместо традиционного, но для многих современных читателей непрозрачного слова «мытарь». Повторность жеста выражена оборотом «всё бил себя в грудь».
