  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: противопоставление, положение сборщика налогов вдали, его нежелание поднять глаза к небу, повторяющийся жест и молитву. «Грешнику» естественно передаёт дательный τῷ ἁμαρτωλῷ, не пытаясь искусственно воспроизвести функцию греческого артикля.'
  naturalness: Перевод звучит естественно на современном литературном русском. Обороты «стоя вдали», «поднять глаза к небу» и «бил себя в грудь» ясны и соответствуют сдержанному повествовательному и молитвенному регистру. «Всё бил» адекватно выражает имперфектную повторность ἔτυπτε.
  terminology: «Сборщик налогов» — понятный современный эквивалент τελώνης. «Будь милостив ко мне» верно и доступно передаёт ἱλάσθητί μοι; сноска уместно сохраняет более специальный оттенок умилостивления и связь с искупительной лексикой, не навязывая догматического истолкования.
