source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: ru
  text: 'И некий начальник спросил его: «Добрый Учитель, что мне сделать[a], чтобы унаследовать вечную жизнь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что, сделав, я унаследую вечную жизнь?»'
    reason: Сохраняет для читателя форму греческого причастного оборота и его возможный оттенок предварительного условия.
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: спросил
  rationale: Обычное и естественное русское соответствие глаголу со значением «спрашивать, задавать вопрос»; контекст не требует более формального «вопросил».
- source_word: τις ἄρχων
  choice: некий начальник
  rationale: «Некий» передаёт неопределённость τις, а «начальник» сохраняет широкое значение лица, обладающего властью, не уточняя его должность.
- source_word: λέγων
  choice: передано двоеточием перед прямой речью
  rationale: В русском повествовании после глагола «спросил» отдельное «говоря» было бы тяжеловесным; двоеточие естественно передаёт введение прямой речи.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Благой Учитель
  rationale: Сохраняется прямое обращение и значение ἀγαθός, важное для ответа Иисуса в следующем стихе. «Благой» звучит достоинно и применительно к человеку менее двусмысленно, чем современное «добрый», которое может означать прежде всего доброжелательность.
- source_word: τί ποιήσας
  choice: что мне сделать
  rationale: Естественно передаёт вопрос о действии или условии, выраженный аористным причастием, не превращая слова начальника в авторское утверждение о способе спасения.
- source_word: ζωὴν αἰώνιον
  choice: вечную жизнь
  rationale: Устоявшееся, точное и понятное соответствие, сохраняющее как длительность, так и богословское содержание выражения.
- source_word: κληρονομήσω
  choice: унаследовать
  rationale: Сохраняет образ наследования, заложенный в греческом глаголе, вместо более общего «получить».
theological_decisions:
- issue: Связь вечной жизни с человеческим действием в вопросе начальника
  choice: что мне сделать, чтобы унаследовать вечную жизнь
  alternative: что сделав, я унаследую вечную жизнь
  rationale: Перевод ясно сохраняет постановку вопроса самим начальником в категориях необходимого действия, но не выдаёт эту постановку за богословское утверждение повествователя и не разрешает заранее напряжение, раскрываемое далее.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «его» оставлено со строчной буквы по общим нормам современного русского текста; избыточное «говоря» опущено как неестественное после «спросил».
