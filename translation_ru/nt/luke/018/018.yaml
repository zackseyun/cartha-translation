  terminology: «Начальник» допустимо для ἄρχων как широкого обозначения лица, наделённого властью; оно не навязывает конкретную должность. «Унаследовать вечную жизнь» точно сохраняет κληρονομήσω и ζωὴν αἰώνιον. В сноске следует исправить пунктуацию буквального варианта, чтобы причастный оборот читался грамматически ясно.
