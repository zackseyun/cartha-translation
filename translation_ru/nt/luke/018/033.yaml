  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: ru
  text: И, подвергнув Его бичеванию, они убьют Его, и на третий день Он воскреснет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет воскрешён». Греческое слово непосредственно означает: «воскреснет».'
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: подвергнув Его бичеванию
  rationale: Аористное причастие обозначает действие, предшествующее убийству. «Подвергнув бичеванию» ясно передаёт жестокое наказание и сохраняет достоинство литературного регистра.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: убьют
  rationale: Будущее активного залога с подразумеваемыми деятелями; простое «убьют» точно передаёт смысл, не добавляя юридического или нравственного оттенка.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: на третий день
  rationale: Естественный и традиционный русский эквивалент дательного времени.
- source_word: ἀναστήσεται
  choice: Он воскреснет
  rationale: Будущая средняя форма здесь имеет непереходное значение. «Воскреснет» непосредственно передаёт греческое выражение и не вводит явно пассивную конструкцию.
theological_decisions:
- issue: Формулировка воскресения
  choice: Он воскреснет
  alternative: Он будет воскрешён
  rationale: Греческая форма — будущее среднего залога, а не пассивного; выбранный вариант сохраняет форму и напряжение исходного текста, не отрицая того, что в других местах Бог воскрешает Иисуса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные буквы в местоимениях «Его», «Он» употреблены как принятая в русском религиозном письме форма почтительности.
