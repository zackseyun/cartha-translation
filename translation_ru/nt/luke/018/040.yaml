  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: ru
  text: 'Иисус остановился и велел привести слепого к Нему[a]. Когда тот подошёл, Иисус спросил его:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подвести его к Нему». Глагол может означать как «вести», так и «приводить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: остановился
  rationale: Аористное причастие от ἵστημι здесь употреблено непереходно и указывает, что Иисус прекратил движение; естественное русское соответствие — «остановился».
- source_word: δὲ
  choice: связь передана последовательностью повествования без отдельного союза
  rationale: δέ — слабый повествовательный связующий элемент; в современном русском его отдельная передача здесь утяжелила бы фразу.
- source_word: ἐκέλευσεν
  choice: велел
  rationale: κελεύω выражает распоряжение; «велел» сохраняет властный оттенок и звучит естественно в повествовании.
- source_word: αὐτὸν ἀχθῆναι πρὸς αὐτόν
  choice: привести слепого к Нему
  rationale: Пассивный инфинитив ἀχθῆναι означает, что другие должны привести или подвести названного человека к Иисусу. «Слепого» ясно восстанавливает участника из контекста и устраняет неестественное скопление местоимений.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Когда тот подошёл
  rationale: Родительный самостоятельный оборот передаёт временное обстоятельство; «тот» однозначно отсылает к слепому, а «подошёл» естественно выражает приближение.
- source_word: ἐπηρώτησεν αὐτόν
  choice: Иисус спросил его
  rationale: ἐπερωτάω здесь имеет обычное значение «спросить»; повтор имени проясняет смену субъекта и соответствует нормам современного русского.
