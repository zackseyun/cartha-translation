  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: ru
  text: И ещё Он рассказал эту притчу некоторым, которые были уверены в собственной праведности и презирали остальных:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смотрели на остальных свысока»; буквально также возможно: «считали остальных ничтожными».'
    reason: Лексическая альтернатива для ἐξουθενοῦντας, передающая как отношение, так и оценочный оттенок глагола.
lexical_decisions:
- source_word: Εἶπεν
  choice: рассказал
  rationale: При прямом дополнении «притчу» естественное русское соответствие — «рассказал», сохраняющее речевое и повествовательное значение λέγω.
- source_word: δὲ καὶ
  choice: И ещё
  rationale: δὲ служит мягкой повествовательной связкой, а καὶ имеет добавочное значение; сочетание «И ещё» естественно передаёт оба элемента без усиления противопоставления.
- source_word: πρός τινας
  choice: некоторым
  rationale: πρός при глаголе речи обозначает адресатов; русский дательный падеж естественно передаёт «к некоторым / некоторым».
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι
  choice: которые были уверены в собственной праведности
  rationale: Перфектное причастие выражает устойчивую уверенность, направленную на самих себя. Формулировка сохраняет самооценку адресатов и ключевое понятие праведности, не называя её прямо ложной.
- source_word: ἐξουθενοῦντας
  choice: презирали
  rationale: Глагол означает считать ничтожными, презирать; «презирали» кратко и ясно передаёт сильную отрицательную оценку.
- source_word: τοὺς λοιπούς
  choice: остальных
  rationale: «Остальных» прямо передаёт τοὺς λοιπούς и сохраняет противопоставление адресатов всем прочим людям.
- source_word: τὴν παραβολὴν ταύτην
  choice: такую притчу
  rationale: В русском вводная формула перед последующим рассказом естественно звучит как «такую притчу»; παραβολή передано устойчивым жанровым термином «притча».
theological_decisions:
- issue: Передача δίκαιοι в контексте самоправедности
  choice: в собственной праведности
  alternative: что они праведны
  rationale: Выражение сохраняет богословски значимый корень «правед-» и показывает, что речь идёт об их собственной уверенности, не добавляя в сам термин отрицательной оценки; критику раскрывает контекст.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Порядок слов сохраняет адресную направленность притчи. Местоимение «Он» написано с прописной буквы по принятой русской библейской издательской традиции; в греческом подлежащее подразумевается формой глагола.
