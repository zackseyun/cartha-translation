lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохранена простая повествовательная связь без добавления значения следствия или временной последовательности.
- source_word: εἶπεν αὐτῷ
  choice: сказал ему
  rationale: Прямой и естественный перевод глагола речи с косвенным дополнением.
- source_word: Ἀνάβλεψον
  choice: Прозри
  rationale: В контексте исцеления повелительная форма означает обретение или восстановление зрения. «Прозри» кратко и естественно передаёт действенное повеление, а возможность значения «снова стань зрячим» отмечена в сноске.
- source_word: πίστις
  choice: вера
  rationale: В данном контексте речь идёт о доверии человека Иисусу; «вера» сохраняет обычную богословскую и повествовательную широту слова.
- source_word: σέσωκέν
  choice: спасла
  rationale: Глагол σῴζω может обозначать как спасение, так и исцеление. «Спасла» сохраняет возможную более широкую мысль Луки и не сводит высказывание только к физическому выздоровлению.
theological_decisions:
- issue: Смысл σῴζω в рассказе об исцелении
  choice: спасла
  alternative: исцелила; вернула здоровье
  rationale: Непосредственный контекст включает телесное исцеление, однако глагол допускает и более широкий смысл спасения. Основной текст сохраняет эту богословскую многозначность, а телесный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой прямой речи. «Прозри» понятно из контекста и сохраняет лаконичность греческого повеления; сноски удерживают лексическую и богословскую неоднозначность.
