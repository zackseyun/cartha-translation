  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: ru
  text: 'И Иисус сказал ему: «Прозри[a]; твоя вера спасла тебя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Снова стань зрячим». В контексте исцеления греческий глагол может означать восстановление зрения.'
