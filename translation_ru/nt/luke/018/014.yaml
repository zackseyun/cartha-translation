source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: ru
  text: 'Говорю вам: этот человек спустился к себе домой оправданным, а не тот[a]. Ибо всякий, кто возвышает себя, будет унижен, а кто смиряет себя, будет возвышен.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправданным по сравнению с тем человеком»; греческое выражение сопоставляет этого человека с другим молящимся.'
    reason: Лексическая альтернатива для сравнительно-противительного оборота παρ’ ἐκεῖνον.
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: оправданным
  rationale: Совершенный страдательный причастный оборот указывает на состоявшийся благоприятный приговор и сохраняющийся результат. «Оправданным» кратко передаёт судебный оттенок, не разворачивая его в более узкое богословское толкование.
- source_word: παρ’ ἐκεῖνον
  choice: в отличие от другого
  rationale: Оборот с παρά и винительным выражает сопоставление или противопоставление сборщика налогов другому молящемуся. Выбранная формулировка естественна по-русски и не усиливает сравнительный смысл до «более оправданным».
- source_word: κατέβη
  choice: спустился
  rationale: Сохраняет конкретное значение движения вниз, уместное при уходе из храмового комплекса; «вернулся» было бы естественнее, но устранило бы пространственный образ.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: к себе домой
  rationale: Идиоматично передаёт направление движения к собственному дому; буквальное «в свой дом» в сочетании со «спустился» менее естественно.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: всякий, кто возвышает себя
  rationale: Передаёт обобщающий смысл субстантивированного причастия и сохраняет возвратность исходного выражения.
- source_word: ταπεινωθήσεται
  choice: будет унижен
  rationale: Сохраняет будущее время и страдательный залог, не называя подразумеваемого деятеля.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: а кто смиряет себя
  rationale: Естественно передаёт противопоставление δέ и сохраняет параллелизм двух частей изречения.
- source_word: ὑψωθήσεται
  choice: будет возвышен
  rationale: Сохраняет будущее время, страдательный залог и лексическую связь с «возвышает себя».
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание предшествующего утверждения в современном русском языке.
- source_word: οὗτος
  choice: этот человек
  rationale: Ясно отсылает к сборщику налогов и подчёркивает его противопоставление фарисею.
theological_decisions:
- issue: Смысл δικαιόω в заключении притчи
  choice: судебный и благоприятный Божий приговор, переданный словом «оправданным»
  alternative: «признанным праведным» или «получившим оправдание»
  rationale: Контекст описывает положение кающегося человека перед Богом. «Оправданным» сохраняет богословскую значимость и судебный оттенок слова, но не вносит в стих развёрнутую систематическую формулу.
- issue: Смысл παρ’ ἐκεῖνον
  choice: 'контраст с другим молящимся: «в отличие от другого»'
  alternative: «скорее, чем тот», «по сравнению с тем» или «а не другой»
  rationale: Греческий оборот допускает сравнительный оттенок, однако контекст ясно противопоставляет двух людей. Основной текст сохраняет контраст, а примечание отмечает возможную сравнительную передачу.
- issue: Неуказанный деятель в будущих страдательных формах
  choice: сохранить пассивные формы «будет унижен» и «будет возвышен»
  alternative: 'эксплицировать: «Бог унизит» и «Бог возвысит»'
  rationale: Божественное действие вероятно подразумевается, но в греческом деятель прямо не назван; перевод не должен устранять эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранены пространственный образ ухода вниз, судебный оттенок «оправданным», параллелизм заключительной сентенции и неназванный деятель страдательных форм.
