lexical_decisions:
- source_word: Ἀμὴν
  choice: Истинно
  rationale: Традиционная и понятная передача вводной формулы Иисуса, выражающей торжественное заверение.
- source_word: οὐδείς ἐστιν ὃς ἀφῆκεν
  choice: всякий, кто оставил
  rationale: В контексте продолжающегося в следующем стихе обещания отрицательная конструкция «нет никого, кто… не…» естественно передаётся по-русски положительной формой без изменения смысла.
- source_word: οἰκίαν
  choice: дом
  rationale: Передаёт жилище или домашнее хозяйство без неоправданного уточнения.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: ради Царства Божьего
  rationale: Естественная современная передача причины или мотива; сохраняет традиционное и ясное наименование Божьего царства.
theological_decisions:
- issue: Характер оставления семьи и дома
  choice: оставил
  alternative: покинул / отказался от
  rationale: Нейтрально сохраняет формулировку источника и не уточняет, идёт ли речь о полном разрыве, физическом уходе или отказе от приоритета этих связей.
- issue: Отрицательная греческая конструкция, переходящая в обещание ст. 30
  choice: всякий, кто
  alternative: нет никого, кто оставил бы
  rationale: Положительная русская конструкция требует продолжения в ст. 30 и ясно выражает универсальность обещания; отдельный стих из-за этого синтаксически остаётся незавершённым, как и в источнике.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранён перечень семейных связей и незавершённость предложения на границе стиха; синтаксис слегка перестроен для естественности русского языка.
