  verdict: revise
  source_fidelity: 'Основной смысл передан точно: фарисей противопоставляет себя «прочим людям», перечисляет пороки и с презрением указывает на мытаря. Однако «встав отдельно» несколько неестественно и может создать впечатление, будто «отдельно» характеризует сам акт вставания, а не положение молящегося. Для σταθείς πρὸς ἑαυτόν точнее и естественнее: «стоя отдельно». Неоднозначность πρὸς ἑαυτόν надлежащим образом сохраняется в сноске.'
  naturalness: «Стоя отдельно» — современная и плавная русская передача позы и пространственного обособления. «Молился так» естественно вводит последующее содержание молитвы. В альтернативе следует избегать «про себя», так как в современном русском это прежде всего означает «беззвучно, мысленно», чего греческий текст не утверждает.
  terminology: «Фарисей», «Боже», «неправедные», «прелюбодеи» и «сборщик налогов» уместны по регистру и точны. «Грабители» приемлемо передаёт ἅρπαγες, не сводя слово исключительно к вымогательству. Написание «Тебя» соответствует заявленной редакционной конвенции.
