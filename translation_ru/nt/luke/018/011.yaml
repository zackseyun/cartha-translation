    rationale: 'Деепричастный оборот звучит менее естественно и синтаксически может отнести «отдельно» к моменту вставания. Греческое σταθείς в сочетании с πρὸς ἑαυτόν лучше передать как положение: «стоя отдельно».'
  - severity: medium
    issue: Альтернативное «молился про себя» в сноске
    rationale: В современном русском «про себя» обычно означает молча или мысленно. Альтернативное значение πρὸς ἑαυτόν — молитва, направленная к самому себе, а не беззвучная молитва; поэтому его следует объяснить без этой ложной коннотации.
