source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: ru
  text: 'Фарисей, стоя отдельно, молился так[a]: «Боже, благодарю Тебя, что я не такой, как прочие люди — грабители, неправедные, прелюбодеи, — или даже как этот сборщик налогов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Фарисей, стоя, молился самому себе так». Оборот πρὸς ἑαυτόν может означать, что он стоял отдельно, или относиться к самой молитве: она была обращена к нему самому; последнее понимание иногда имеет иронический оттенок.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: встав
  rationale: 'Аористное причастие обозначает сопутствующее действие и естественно передаётся русским деепричастием, сохраняя последовательность: он занял место и молился.'
- source_word: πρὸς ἑαυτὸν
  choice: отдельно
  rationale: 'В основном тексте избрано пространственное понимание: фарисей стоял особняком. Неоднозначность оборота сохранена в сноске.'
- source_word: ταῦτα προσηύχετο
  choice: молился так
  rationale: Естественная русская передача формулы, вводящей содержание молитвы; несовершенный вид глагола сохраняет длительный характер действия, хотя буквальное «молился об этом» по-русски могло бы неверно обозначить предмет просьбы.
- source_word: εὐχαριστῶ σοι
  choice: благодарю Тебя
  rationale: Прямая и современная передача устойчивого греческого выражения с дательным местоимением.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: как прочие люди
  rationale: Сохраняет значение λοιποί — «остальные, прочие» — и обобщённое значение ἄνθρωποι без ненужного ограничения только мужчинами.
- source_word: ἅρπαγες
  choice: грабители
  rationale: Слово обозначает людей, хищно присваивающих чужое; «грабители» понятно современному читателю и не сужает смысл исключительно до вымогательства.
- source_word: ἄδικοι
  choice: неправедные
  rationale: Передаёт не только юридическую несправедливость, но и широкую нравственную оценку, существенную для контекста притчи.
- source_word: μοιχοί
  choice: прелюбодеи
  rationale: Точная и устоявшаяся библейская передача существительного, обозначающего нарушителей супружеской верности.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: или даже как этот сборщик налогов
  rationale: «Даже» передаёт усиление καί и презрительную кульминацию сравнения; «сборщик налогов» ясно передаёт историческую должность τελώνης.
theological_decisions:
- issue: Значение πρὸς ἑαυτόν в описании молитвы фарисея
  choice: 'В основном тексте понято пространственно: «встав отдельно»'
  alternative: «встав, молился про себя так» или «молился самому себе»
  rationale: Греческий оборот допускает как пространственное значение, так и отнесение слов к самому молящемуся. Основной текст сохраняет естественную сцену молитвы, а сноска отмечает реальную неоднозначность, не превращая ироническое прочтение в однозначное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Местоимение «Тебя» в обращении к Богу написано с прописной буквы по распространённой русской издательской традиции. Синтаксис сделан ясным для чтения вслух; неоднозначность πρὸς ἑαυτόν вынесена в обязательную сноску.
