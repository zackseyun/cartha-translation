base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: ru
  text: 'Ты знаешь заповеди: не прелюбодействуй, не убивай[a], не кради, не лжесвидетельствуй, почитай отца своего и мать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть не совершай убийства: греческий глагол означает преступное лишение человека жизни, а не всякое лишение жизни вообще.'
    reason: lexical_clarification
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: заповеди
  rationale: В контексте перечисляются хорошо известные заповеди Десятисловия; «заповеди» сохраняет их библейский и нормативный характер.
- source_word: οἶδας
  choice: ты знаешь
  rationale: Формально перфект οἶδα в койне имеет настоящее значение; естественный русский эквивалент — «знаешь».
- source_word: Μὴ μοιχεύσῃς
  choice: не прелюбодействуй
  rationale: Точно передаёт запрет супружеской неверности и сохраняет узнаваемую связь с Десятисловием; слово остаётся понятным в современном литературном русском.
- source_word: Μὴ φονεύσῃς
  choice: не убивай
  rationale: Краткая и узнаваемая формулировка заповеди. Поскольку φονεύω обозначает преступное лишение жизни, смысловая точность уточнена в сноске.
- source_word: Μὴ κλέψῃς
  choice: не кради
  rationale: Прямой, естественный и точный русский запрет.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: не лжесвидетельствуй
  rationale: Передаёт значение ложного свидетельства и сохраняет интертекстуальную связь с формулировкой Десятисловия.
- source_word: Τίμα
  choice: почитай
  rationale: Передаёт требование оказывать родителям честь; «почитай» естественно звучит в формулировке заповеди и сильнее простого «уважай».
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: отца своего и мать
  rationale: Естественная русская формулировка, относящая притяжательное определение к обоим родителям без ненужного повтора.
theological_decisions:
- issue: Смысл запрета Μὴ φονεύσῃς
  choice: Сохранить узнаваемое «не убивай», уточнив в сноске значение преступного убийства.
  alternative: Не совершай убийства.
  rationale: Глагол φονεύω означает убийство человека, особенно преступное, а не любое лишение жизни. Основной вариант сохраняет связь с привычной формой Десятисловия, а сноска предотвращает неоправданное расширение смысла.
- issue: Форма запретов Десятисловия
  choice: Передать греческие запреты современными русскими отрицательными императивами.
  alternative: 'Использовать архаические формы: «не убий», «не укради» и т. п.'
  rationale: Греческие запретительные формы имеют прямую повелительную силу. Современные формы понятны читателю и не меняют богословского содержания.
translation_notes:
  register: Современный литературный русский с достоинством и краткостью формулировок Десятисловия. Устранены архаические формы вроде «не убий», но сохранены узнаваемые библейские термины «прелюбодействуй», «лжесвидетельствуй» и «почитай».
