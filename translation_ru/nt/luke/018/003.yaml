  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: ru
  text: 'В том городе жила вдова. Она всё приходила к нему и говорила: «Защити меня в споре с моим противником».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Добейся для меня справедливости в тяжбе с моим противником»; возможно также: «Восстанови моё право перед моим противником». Греческий глагол здесь может означать судебную защиту или восстановление справедливости, а не личную месть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: вдова
  rationale: Точное и естественное соответствие греческому слову; социальное положение вдовы существенно для контекста притчи.
- source_word: δὲ
  choice: опущено как отдельное слово
  rationale: Частица продолжает повествование; в русском языке связь с предыдущей фразой естественно передаётся без обязательного союза.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: В том городе жила
  rationale: Естественная русская передача экзистенциальной конструкции с указанием места.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: Она всё приходила к нему
  rationale: Имперфект в контексте указывает на повторяющееся, настойчивое действие; частица «всё» ясно и естественно передаёт эту длительную повторяемость.
- source_word: λέγουσα
  choice: и говорила
  rationale: Деепричастная форма по смыслу обозначает речь, сопровождавшую её повторные приходы; сочинительная конструкция звучит по-русски естественно.
- source_word: Ἐκδίκησόν με
  choice: Защити меня
  rationale: В судебном контексте глагол означает добиться для неё справедливости или восстановить её право, а не совершить личную месть.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: от моего противника
  rationale: ἀντίδικος обозначает противную сторону в споре, особенно судебном; «противник» сохраняет юридический оттенок, не сужая значение до обвинителя.
theological_decisions:
- issue: Характер просьбы вдовы
  choice: Защити меня от моего противника
  alternative: Отомсти за меня моему противнику
  rationale: Судебная обстановка требует значения правовой защиты или восстановления справедливости; перевод через месть внёс бы не обязательный для греческого текста смысл личного возмездия.
translation_notes:
  register: Современный литературный русский язык; повествование передано просто и достойно. Формула «всё приходила» сохраняет настойчивую повторяемость действия, а сноска раскрывает юридическую многозначность ключевого глагола.
