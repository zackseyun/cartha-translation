  yaml_path: translation/nt/luke/018/036.yaml
  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: ru
  text: И, услышав, что мимо проходит толпа, он стал спрашивать, что это такое.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он спрашивал, что бы это могло быть». Имперфект может указывать на продолжавшиеся или повторявшиеся расспросы, а оптатив в косвенном вопросе допускает несколько более предположительный оттенок.'
    reason: Сохранены возможные аспектуальные и модальные оттенки греческих форм.
lexical_decisions:
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие естественно передаёт аористное причастие с обстоятельственно-временным значением и сохраняет ход повествования.
- source_word: δὲ
  choice: и
  rationale: Здесь частица служит мягкой повествовательной связкой и не выражает сильного противопоставления.
- source_word: ὄχλου διαπορευομένου
  choice: что мимо проходит толпа
  rationale: Оборот передаёт воспринимаемое на слух продолжающееся движение толпы; «мимо проходит» естественно соответствует ситуации, не добавляя отсутствующего в греческом тексте слова «шум».
- source_word: ἐπυνθάνετο
  choice: стал спрашивать
  rationale: Имперфект допускает как длительное или повторявшееся, так и начинательное понимание; «стал спрашивать» естественно показывает начало расспросов в данной сцене.
- source_word: τί εἴη τοῦτο
  choice: что это такое
  rationale: Так естественно по-русски передаётся косвенный вопрос «что это было/могло быть»; оптатив после глагола прошедшего времени не обязательно выражает самостоятельную неуверенность.
