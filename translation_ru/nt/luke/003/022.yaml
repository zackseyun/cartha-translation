  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: ru
  text: 'и Святой Дух сошёл на Него в телесном облике, словно голубь, и с неба раздался голос: «Ты — Мой возлюбленный Сын; Я доволен Тобой».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Тобой Я был доволен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: сошёл
  rationale: Аористный инфинитив продолжает повествовательную последовательность и ясно передаёт движение сверху вниз.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Нормативное и понятное современному русскому читателю обозначение.
- source_word: σωματικῷ εἴδει
  choice: в телесном облике
  rationale: Передаёт видимый, телесно воспринимаемый характер явления, не утверждая воплощения Духа.
- source_word: ὡς περιστερὰν
  choice: словно голубь
  rationale: Сохраняет сравнительный смысл ὡς и не превращает образ в утверждение, что Дух буквально стал голубем.
- source_word: ἐπ’ αὐτόν
  choice: на Него
  rationale: Естественно передаёт направленность сошествия на Иисуса.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: с неба раздался голос
  rationale: Естественная русская событийная конструкция, точно передающая появление голоса с неба.
- source_word: Σὺ εἶ
  choice: Ты —
  rationale: Именная конструкция с тире естественно передаёт прямое и подчёркнутое обращение.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Мой возлюбленный Сын
  rationale: Сохраняет сыновнее именование и смысл особой любви; формулировка dignified и традиционно понятна.
- source_word: ἐν σοὶ εὐδόκησα
  choice: в Тебе Моя радость
  rationale: Идиоматично выражает Божье благоволение и удовлетворение Сыном, не навязывая русскому тексту исключительно прошлое состояние; формальный временной оттенок аориста отмечен в сноске.
theological_decisions:
- issue: Характер явления Святого Духа
  choice: Дух сошёл в видимом телесном облике, сравниваемом с голубем.
  alternative: Дух сошёл в виде настоящего голубя.
  rationale: Сочетание σωματικῷ εἴδει и ὡς περιστερὰν указывает на воспринимаемое явление и сравнение, но не требует утверждать буквальное превращение Духа в голубя.
- issue: Смысл и временной оттенок εὐδόκησα
  choice: «в Тебе Моя радость» в основном тексте с формальной альтернативой в сноске.
  alternative: «в Тебе Я обрёл радость» или «Тобой Я доволен».
  rationale: Аорист допускает более формально прошедшее выражение, однако декларация передаёт Божье благоволение. Именная русская конструкция звучит естественно и сохраняет ёмкость высказывания, а сноска делает временной оттенок прозрачным.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Местоимения, относящиеся к Богу и Иисусу в прямой речи, даны с прописной буквы согласно распространённой русской библейской традиции.
