revisions:
- from: 'и Святой Дух сошёл на Него в телесном облике, словно голубь, и с неба раздался голос: «Ты — Мой возлюбленный Сын; в Тебе Моя радость».[a]'
  to: 'и Святой Дух сошёл на Него в телесном облике, словно голубь, и с неба раздался голос: «Ты — Мой возлюбленный Сын; Я доволен Тобой».[a]'
  rationale: Правка заменяет отвлечённое «Моя радость» на личное глагольное высказывание, соответствующее εὐδόκησα. Основной текст сохраняет естественную русскую формулировку декларации, а сноска отмечает формально прошедший оттенок греческого аориста. Остальная формулировка не требует изменения.
