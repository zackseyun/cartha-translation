lexical_decisions:
- source_word: τοῦ
  choice: сын
  rationale: В родословии Луки повторяющийся артикль в родительном падеже перед каждым именем продолжает подразумеваемую формулу происхождения. Добавление слова «сын» ясно передаёт эллиптическую греческую конструкцию и естественно звучит по-русски.
- source_word: Σεροὺχ
  choice: Серух
  rationale: Традиционная русская библейская форма имени, позволяющая узнать одноимённого патриарха из Бытия.
- source_word: Ῥαγαὺ
  choice: Рагав
  rationale: Традиционная русская библейская форма имени этого патриарха, соответствующая принятому именованию в родословии Бытия.
- source_word: Φάλεκ
  choice: Фалек
  rationale: Традиционная русская библейская форма имени, сохраняющая связь с родословиями Ветхого Завета.
- source_word: Ἔβερ
  choice: Евер
  rationale: Устоявшаяся русская библейская форма имени патриарха из Бытия.
- source_word: Σαλὰ
  choice: Сала
  rationale: Традиционная русская библейская форма имени, соответствующая этому лицу в родословии Бытия.
