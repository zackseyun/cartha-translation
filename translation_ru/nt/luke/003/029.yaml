theological_decisions:
- issue: Эллиптическая формула родословия с повторением τοῦ
  choice: Сохранён ряд имён в родительном падеже без многократного добавления слова «сын».
  alternative: «сына Иисуса, сына Елиезера, сына Иорима, сына Матфата, сына Левия»
  rationale: В греческом тексте слово «сын» в этом стихе не выражено, а родительные формы продолжают конструкцию, начатую ранее. Русская эллиптическая передача сохраняет структуру и не добавляет отсутствующее слово в каждой позиции.
translation_notes:
