  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: ru
  text: при первосвященстве Анны и Каиафы[a] слово Божье пришло к Иоанну, сыну Захарии, в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово «первосвященник» стоит в единственном числе, хотя Лука называет Анну и Каиафу.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: при первосвященстве Анны и Каиафы
  rationale: 'ἐπί с родительным падежом задаёт временные рамки: «при, во время». Единственное число ἀρχιερέως передано существительным «первосвященство», благодаря чему сохраняется напряжение исходного текста: названы двое, хотя должность мыслится как одна.'
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: слово Бога пришло
  rationale: Это традиционная пророческая формула, обозначающая получение откровения. «Пришло» естественно передаёт событийное значение ἐγένετο, не превращая выражение в неидиоматическое «случилось».
- source_word: ἐπὶ Ἰωάννην
  choice: к Иоанну
  rationale: ἐπί с винительным после формулы откровения указывает на направленность к человеку или нисхождение на него. «К Иоанну» звучит естественно и не добавляет оттенка, отсутствующего в контексте.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: сыну Захарии
  rationale: Приложение уточняет, о каком Иоанне идёт речь. Форма «сыну Захарии» сохраняет повествовательный стиль и синтаксически согласуется с «к Иоанну».
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: ἔρημος обозначает безлюдную, необитаемую местность и не обязательно песчаную пустыню. В русском библейском и современном литературном употреблении «в пустыне» здесь естественно и узнаваемо.
theological_decisions:
- issue: Упоминание Анны и Каиафы при единственном числе ἀρχιερέως
  choice: 'Сохранить единственное число институционально: «при первосвященстве Анны и Каиафы»'
  alternative: «когда Анна и Каиафа были первосвященниками»
  rationale: Исходный текст употребляет ἀρχιερέως в единственном числе, но называет двух лиц. Перевод сохраняет эту историко-литературную напряжённость, не сглаживая и не объясняя её в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и ясный; пророческая формула сохранена без архаизации. Имена переданы в общепринятой русской библейской форме.
