    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: многими другими наставлениями
  rationale: Средний род множественного числа употреблён субстантивно, а подразумеваемый объект не назван. В русском основной текст естественно связывает выражение с последующим παρακαλῶν; неоднозначность отмечена в сноске.
- source_word: μὲν οὖν
  choice: Так
  rationale: Передаёт переход и итоговую связь с предшествующим рассказом, не перегружая русский текст буквальным воспроизведением обеих частиц.
- source_word: παρακαλῶν
  choice: наставлениями
  rationale: В контексте проповеди Иоанна слово обозначает увещание, призыв и нравственное наставление. «Наставлениями» звучит современно и достойно, сохраняя побудительную силу.
- source_word: εὐηγγελίζετο
  choice: возвещал ... добрую весть
  rationale: Передаёт значение благой вести и длительный характер имперфекта, избегая как церковно-специального «евангелизировал», так и более общего «проповедовал».
- source_word: τὸν λαόν
  choice: народу
  rationale: Точно передаёт λαός без сужения значения до толпы или явного добавления «Израиля».
theological_decisions:
- issue: Характер служения Иоанна, выраженный εὐηγγελίζετο
  choice: возвещал народу добрую весть
  alternative: проповедовал народу
  rationale: Греческий текст прямо характеризует увещательную проповедь Иоанна как возвещение доброй вести. Это богословское напряжение сохранено, а не сведено к нейтральной проповеди.
translation_notes:
  register: Современный литературный русский язык; краткая, плавная конструкция. «Добрая весть» понятна широкому читателю и сохраняет смысл εὐαγγελίζω. Местоимение или имя Иоанна не добавлено, поскольку субъект ясен из контекста.
