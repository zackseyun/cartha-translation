  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: ru
  text: И Самому Иисусу было около тридцати лет, когда Он начал[a]. Его считали сыном Иосифа[b], сына Илия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начиная». Греческий текст прямо не называет, что именно Он начал; по контексту, вероятно, речь идёт о начале Его общественной деятельности.'
    reason: lexical_alternative
  - marker: b
    text: То есть окружающие считали Иисуса сыном Иосифа.
    reason: clarification
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет повествовательную связь с предшествующей сценой крещения.
- source_word: αὐτὸς … Ἰησοῦς
  choice: Самому Иисусу
  rationale: 'Передаёт эмфатическое αὐτός, а дательная конструкция естественно сочетается с русским обозначением возраста: «Самому Иисусу … было».'
- source_word: ἀρχόμενος
  choice: когда Он начал
  rationale: Передаёт начало деятельности Иисуса, не добавляя отсутствующего в греческом тексте слова «служение».
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: было около тридцати лет
  rationale: Естественная русская формула возраста, сохраняющая приблизительность ὡσεὶ.
- source_word: ὢν υἱός, ὡς ἐνομίζετο, Ἰωσήφ
  choice: Его считали сыном Иосифа
  rationale: Естественно передаёт общественное представление, выраженное ὡς ἐνομίζετο, и не утверждает биологического отцовства Иосифа.
- source_word: τοῦ Ἠλί
  choice: сына Илия
  rationale: В родословной греческий родительный падеж эллиптически продолжает цепочку происхождения; в русском для ясности необходимо восстановить подразумеваемое слово «сына».
theological_decisions:
- issue: Отношение слов ὡς ἐνομίζετο к отцовству Иосифа
  choice: «Его считали сыном Иосифа»
  alternative: «Он был, как полагали, сыном Иосифа»
  rationale: Выбранный вариант ясно сохраняет различие между общественным мнением и утверждением рассказчика, не объясняя сверх того, что сказано в стихе.
- issue: Следует ли уточнять предмет глагола ἀρχόμενος
  choice: Не добавлять в основной текст слово «служение»
  alternative: «когда Он начал Своё служение»
  rationale: Контекст указывает на начало общественной деятельности Иисуса, однако соответствующего существительного в греческом тексте нет; неопределённость сохранена в тексте и пояснена в сноске.
- issue: К кому относится τοῦ Ἠλί
  choice: Передать как «сына Илия», относя к Иосифу
  alternative: Сохранить буквально-эллиптическое «Иосифа, Илия»
  rationale: Так обычно разворачивается родословная цепочка с повторяющимся родительным падежом; добавление подразумеваемого «сына» необходимо для понятного русского синтаксиса, но не вносит нового генеалогического утверждения.
translation_notes:
  register: Современный литературный русский язык. Первая часть перестроена в естественную русскую безличную конструкцию для обозначения возраста; вторая оформлена отдельным предложением, чтобы ясно и без тяжеловесной вложенности передать оговорку ὡς ἐνομίζετο. Местоимение «Он» написано с прописной буквы в соответствии с традиционным благоговейным библейским регистром.
