  rationale: Традиционная русская форма имени, сохраняющая узнаваемую связь с ветхозаветной родословной.
- source_word: Καϊνάμ
  choice: Каинан
  rationale: Передаёт имя, присутствующее в греческом тексте Луки, без устранения или молчаливого согласования с иной формой ветхозаветной родословной.
theological_decisions:
- issue: Эллипсис в цепочке греческих генитивов родословия
  choice: Перед каждым именем ставить «сын»
  alternative: Передать буквальной цепочкой родительных падежей без слова «сын»
  rationale: Контекст родословия однозначно задаёт отношение происхождения; явное «сын» делает русский текст понятным, не добавляя отдельного богословского утверждения.
- issue: Передача имени Καϊνάμ
  choice: Сохранить в основном тексте как «Каинан»
  alternative: Передать как «Кенан» либо согласовать родословие с отдельной ветхозаветной традицией
  rationale: SBLGNT содержит Καϊνάμ; имя следует сохранить, не гармонизируя исходный греческий текст.
