  text: the son of Simeon[a], the son of Judah, the son of Joseph, the son of Jonam, the son of Eliakim[b],
translation:
  language: ru
  text: сына Симеона, сына Иуды, сына Иосифа, сына Ионама[a], сына Елиакима,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях и переводческих традициях это имя передаётся как «Ионан».
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: сына
  rationale: Повторяющийся родительный артикль перед каждым именем эллиптически продолжает родословную формулу из контекста. Русское «сына» естественно и ясно передаёт подразумеваемое родство.
- source_word: Συμεὼν
  choice: Симеона
  rationale: Устоявшаяся русская форма библейского имени; родительный падеж обусловлен синтаксисом родословия.
- source_word: Ἰούδα
  choice: Иуды
  rationale: Греческая форма может обозначать имя Иуда; в русском языке одна и та же традиционная форма употребляется и для патриарха Иуды, и для других носителей этого имени, поэтому дополнительное разграничение невозможно и не требуется.
- source_word: Ἰωσὴφ
  choice: Иосифа
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: Ἰωνὰμ
  choice: Ионама
  rationale: Передаёт чтение SBLGNT Ἰωνάμ и сохраняет конечный согласный исходной формы.
- source_word: Ἐλιακὶμ
  choice: Елиакима
  rationale: Устоявшаяся русская форма семитского библейского имени, соответствующая греческому Ἐλιακίμ.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с традиционными, узнаваемыми формами библейских имён. Эллиптическая структура греческой родословной раскрыта словом «сына», как того требует естественный русский синтаксис. Отдельная сноска к имени Иуда не нужна: английская альтернатива Judah/Judas не имеет прямого соответствия в русском, где обе формы передаются как «Иуда».'
