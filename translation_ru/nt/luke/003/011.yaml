source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: ru
  text: 'В ответ он сказал им: «У кого две туники[a], пусть поделится с тем, у кого нет ни одной; и у кого есть пища, пусть поступит так же».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Туника — основная одежда того времени, которую носили непосредственно на теле; возможный перевод: «рубахи» или «одежды».'
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: В ответ он сказал им
  rationale: Естественная русская передача ответного причастия с основным глаголом речи; δέ здесь служит мягкой связкой и не требует отдельного перевода.
- source_word: Ὁ ἔχων
  choice: У кого
  rationale: Передаёт обобщённое значение субстантивированного причастия естественно для современного русского языка, без ненужной гендерной маркированности.
- source_word: δύο χιτῶνας
  choice: две туники
  rationale: Сохраняет исторически точное название основного предмета одежды; культурное значение пояснено в сноске.
- source_word: μεταδότω
  choice: пусть поделится
  rationale: Передаёт побудительную силу греческого императива третьего лица и значение предоставления части имеющегося другому.
- source_word: τῷ μὴ ἔχοντι
  choice: с тем, у кого нет ни одной
  rationale: Восполняет подразумеваемое из контекста слово «туника» и ясно выражает полное отсутствие названного предмета.
- source_word: βρώματα
  choice: пища
  rationale: Широкое и достойное современное обозначение еды, соответствующее множественному собирательному смыслу греческого слова.
- source_word: ὁμοίως ποιείτω
  choice: пусть поступит так же
  rationale: Сохраняет параллельную побудительную конструкцию и распространяет предыдущее требование делиться на пищу.
theological_decisions:
- issue: Обобщённое единственное число и грамматический род
  choice: У кого... с тем, у кого... и у кого...
  alternative: Тот, у кого... тот, у кого...
  rationale: Греческие причастия мужского рода употреблены обобщённо. Русская конструкция «у кого» естественно включает любого человека и не добавляет отсутствующего в смысле ограничения по полу.
- issue: Сила повеления
  choice: пусть поделится... пусть поступит
  alternative: должен поделиться... должен поступить
  rationale: Конструкция с «пусть» непосредственно и естественно передаёт императив третьего лица, не ослабляя наставления и не превращая его в отвлечённое утверждение обязанности.
translation_notes:
  register: Современный литературный русский язык с ясным, наставительным звучанием. Синтаксис естественный, но параллелизм двух повелений сохранён; исторический термин «туника» пояснён сноской.
