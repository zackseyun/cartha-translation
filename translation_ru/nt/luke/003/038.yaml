  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: ru
  text: сын Еноса[a], сын Сифа, сын Адама, сын Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально повторяется конструкция: «Еноса, Сифа, Адама, Бога»; слово «сын» восполнено из установленной структуры родословия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: сын Еноса
  rationale: Повторяющаяся конструкция с артиклем и родительным падежом продолжает генеалогическую формулу Луки; подразумеваемое слово «сын» восполнено для ясности. Имя Ἐνώς передано в принятой русской библейской форме «Енос».
- source_word: τοῦ Σὴθ
  choice: сын Сифа
  rationale: Родительный падеж в генеалогической цепи выражает подразумеваемое сыновнее отношение. Имя Σήθ передано в принятой русской форме «Сиф».
- source_word: τοῦ Ἀδὰμ
  choice: сын Адама
  rationale: Сохраняется та же подразумеваемая родственная связь. Ἀδάμ передано как личное имя «Адам», а не переведено нарицательным «человек».
- source_word: τοῦ θεοῦ
  choice: сын Бога
  rationale: Заключительный родительный падеж следует той же генеалогической модели, поэтому подразумеваемое «сын» восполнено и здесь. Форма «Бога» сохраняет кульминационное завершение цепи и не уточняет природу этого сыновства сверх текста.
theological_decisions:
- issue: Передача заключительного τοῦ θεοῦ в родословии Адама
  choice: сын Бога
  alternative: Божий; от Бога
  rationale: По форме греческий текст содержит только родительный падеж, однако в последовательной генеалогической конструкции подразумевается «сын». Выбранный вариант сохраняет литературный параллелизм и богословское напряжение, не приравнивая автоматически сыновство Адама к христологическому употреблению этого выражения.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Лаконичный ритм генеалогии сохранён; артикли перед каждым звеном, естественные для английского, в русском не воспроизводятся.
