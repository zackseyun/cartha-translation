lexical_decisions:
- source_word: ὄψεται
  choice: увидит
  rationale: Будущая форма ὁράω имеет здесь прямое значение будущего времени. «Увидит» естественно для современного русского языка и сохраняет конкретный зрительный образ.
- source_word: πᾶσα σὰρξ
  choice: всякая плоть
  rationale: Буквальное выражение сохраняет пророческую формулу и связь с Исайей 40:5; в данном контексте оно означает всех людей. Более явно идиоматический вариант указан в сноске.
- source_word: σωτήριον
  choice: спасение
  rationale: Субстантивированное прилагательное с артиклем передано установившимся словом «спасение», которое сохраняет широту значения Божьего спасительного действия.
- source_word: τοῦ θεοῦ
  choice: Божье
  rationale: Притяжательное прилагательное естественно передаёт греческий родительный падеж, не устраняя его возможной смысловой неоднозначности между принадлежностью и источником.
theological_decisions:
- issue: Значение выражения πᾶσα σὰρξ
  choice: 'Универсальный человеческий охват: все люди увидят Божье спасение.'
  alternative: Буквальное понимание «всякой плоти» как всех телесных существ.
  rationale: В цитате из Исайи выражение служит семитской пророческой идиомой, обозначающей человечество в целом; буквальная формулировка сохранена ради межтекстовой связи.
- issue: Значение родительного τοῦ θεοῦ
  choice: «Божье спасение», с сохранением открытости между принадлежностью и источником.
  alternative: «спасение от Бога», явно выражающее источник.
  rationale: Греческий родительный допускает понимание Бога как обладателя и как источника спасения; основной текст не должен без необходимости сужать смысл.
translation_notes:
  register: Современный литературный и достоинственный русский язык. Формула «всякая плоть» намеренно сохраняет возвышенный пророческий оттенок и межтекстовую связь; смысл пояснён в сноске. «Божье» выбрано как естественная современная форма, менее архаичная, чем «Божие».
