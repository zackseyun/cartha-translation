lexical_decisions:
- source_word: Ἰεσσαί
  choice: Иессей
  rationale: Традиционная и узнаваемая русская форма имени Иессей; в родительном падеже — «Иессея».
- source_word: Ἰωβήλ
  choice: Иовид
  rationale: Передаёт именно чтение SBLGNT Ἰωβήλ, не подменяя его более привычным ветхозаветным именем Овид; в родительном падеже — «Иовида».
- source_word: Βόος
  choice: Вооз
  rationale: Устоявшаяся русская библейская форма имени; в родительном падеже — «Вооза».
- source_word: Σαλά
  choice: Сала
  rationale: Прямая передача греческой формы имени; родительный падеж совпадает по форме — «Салы» в соответствии с русским склонением имени на -а.
- source_word: Ναασσών
  choice: Наассон
  rationale: Устоявшаяся русская передача греческой формы; в родительном падеже — «Наассона».
theological_decisions:
- issue: Форма генеалогической цепочки с повторяющимся τοῦ
  choice: Передать последовательностью имён в родительном падеже без повторения «сын».
  alternative: «сын Иессея, сын Иовида…»
  rationale: В греческом стих представляет продолжение генеалогической конструкции предыдущего контекста; русская цепочка родительных падежей естественно сохраняет синтаксическую зависимость и не добавляет отсутствующее в данном фрагменте слово υἱός.
- issue: Текстовый вариант Ἰωβήλ
  choice: Иовид
  alternative: Овид
  rationale: Сохранено чтение указанного издания SBLGNT, хотя параллельная ветхозаветная родословная делает форму «Овид» ожидаемой; исправлять исходный текст по параллели не следует.
translation_notes:
  register: 'Современный литературный русский с сохранением традиционных библейских форм имён. Стих оформлен как продолжение родословной: краткая цепочка родительных падежей, без искусственного повторения «сын».'
