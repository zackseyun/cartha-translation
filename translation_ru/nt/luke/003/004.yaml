id: LUK.3.4
reference: Luke 3:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ru
  text: 'как написано в книге слов пророка Исаии: «Голос взывающего в пустыне[a]: „Приготовьте путь Господу[b], сделайте прямыми Его тропы“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «в пустыне» можно относить к «взывающему», как в основном тексте, либо к следующему повелению: «Голос взывающего: „В пустыне приготовьте путь Господу“».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ГОСПОДУ». Здесь цитируется Ис 40:3, где в еврейском тексте стоит божественное имя YHWH.'
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: написано
  rationale: Устоявшаяся русская формула введения цитаты из Писания; передаёт сохраняющую силу результата, выраженную перфектом.
- source_word: βίβλῳ λόγων
  choice: в книге слов
  rationale: Сохраняет оба существительных греческого текста. Слово «книга» естественно по-русски, хотя в древности речь могла идти о свитке.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: пророка Исаии
  rationale: Естественная русская конструкция, определяющая, чьи пророческие слова содержит книга.
- source_word: Φωνὴ βοῶντος
  choice: Голос взывающего
  rationale: Передаёт безартиклевое φωνή и личное значение причастия βοῶντος, сохраняя торжественный пророческий регистр.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Обычное и контекстуально точное соответствие ἔρημος; в основном тексте оборот отнесён к «взывающему», как естественно подсказывает греческий порядок слов.
- source_word: Ἑτοιμάσατε
  choice: Приготовьте
  rationale: Прямо сохраняет повелительное наклонение и образ подготовки дороги.
- source_word: τὴν ὁδὸν κυρίου
  choice: путь Господу
  rationale: Русский дательный естественно выражает путь, приготовляемый для грядущего Господа, и не устраняет метафору дороги.
- source_word: κυρίου
  choice: Господу
  rationale: Следует греческому κύριος; связь с именем YHWH в Ис 40:3 отмечена в сноске, а не внесена в основной текст.
- source_word: εὐθείας ποιεῖτε
  choice: прямыми сделайте
  rationale: Сохраняет предикативное прилагательное, повелительную силу и параллелизм пророческой строки.
- source_word: τὰς τρίβους αὐτοῦ
  choice: Его тропы
  rationale: «Тропы» точно и естественно продолжает образ приготовления пути; местоимение сохраняет отсылку к Господу.
theological_decisions:
- issue: Передача κύριος в цитате из Ис 40:3, где еврейский текст содержит имя YHWH
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Основной текст переводит непосредственно греческое κύριος и сохраняет обычное новозаветное наименование «Господь». Сноска сообщает о ветхозаветном фоне, не снимая возможного христологического напряжения в контексте Луки.
- issue: Синтаксическая связь выражения ἐν τῇ ἐρήμῳ
  choice: «в пустыне» относится к «взывающему»
  alternative: «в пустыне» относится к повелению «приготовьте»
  rationale: Порядок слов в греческой цитате естественно допускает принятое в основном тексте прочтение, однако пунктуация древнего текста не была исходной, а текст Ис 40:3 позволяет иную синтаксическую разбивку; поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сохранены метафора приготовления дороги, параллелизм и подлинная синтаксическая неоднозначность цитаты; архаизмы по возможности не используются.
