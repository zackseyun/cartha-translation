base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ru
  text: 'Иоанн говорил толпам, выходившим к нему креститься: «Отродье гадюк![a] Кто предупредил вас бежать от грядущего гнева?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Порождения ехидн!»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от гнева, который придёт?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолженное или повторявшееся обращение; русское «говорил» естественно сохраняет этот аспект, не уточняя частотность.
- source_word: οὖν
  choice: не выражено отдельным словом
  rationale: Частица отмечает продолжение повествования; в русском связь с контекстом естественно передаётся самим ходом рассказа, тогда как «итак» здесь могло бы звучать излишне выводно.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: толпам, выходившим
  rationale: Причастный оборот передаёт движение людей из населённых мест к Иоанну и сохраняет множественное число ὄχλοις.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: к нему креститься
  rationale: Естественная русская конструкция цели сохраняет смысл принятия крещения от Иоанна; местоименная отсылка прояснена именем в подлежащем для связности.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Отродье гадюк
  rationale: «Отродье» передаёт происхождение и резкий обличительный оттенок γέννημα; «гадюк» точно обозначает ядовитых змей и звучит естественно по-русски.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Кто надоумил вас
  rationale: В данном риторическом вопросе ὑποδείκνυμι означает указать или подсказать образ действий. «Надоумил» сохраняет колкую силу вопроса, не утверждая, что предупреждение было принято искренне.
- source_word: φυγεῖν
  choice: бежать
  rationale: Передаёт конкретный образ бегства от опасности, а не только итоговое «избежать».
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: от грядущего гнева
  rationale: «Грядущего» передаёт μέλλουσα как предстоящее, а «гнев» сохраняет открытым вопрос о форме и времени Божьего суда.
theological_decisions:
- issue: Характер грядущего гнева
  choice: Сохранено общее выражение «грядущий гнев», указывающее на предстоящий Божий суд без его дальнейшего определения.
  alternative: Уточнить как исключительно эсхатологический суд либо как историческое временное наказание.
  rationale: Контекст связывает призыв к покаянию с Божьим судом, но сам стих не ограничивает значение одной конкретной богословской схемой.
- issue: Смысл риторического вопроса Иоанна
  choice: «Кто надоумил вас» сохраняет сомнение в подлинности мотива пришедших.
  alternative: «Кто предупредил вас» могло бы сильнее подчеркнуть сообщение об опасности.
  rationale: Греческое ὑποδείκνυμι допускает значения показа, наставления и предупреждения; контекст резкого обличения поддерживает риторическое «надоумил», не исключая смысла предупреждения.
translation_notes:
  register: Современный литературный русский с достоинством и резкостью пророческого обличения. «Отродье» намеренно сильное, но общеупотребительное; «грядущий гнев» сохраняет библейскую выразительность без конфессионального уточнения.
