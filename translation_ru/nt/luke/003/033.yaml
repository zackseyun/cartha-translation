  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: ru
  text: сына Аминадава[a], сына Админа, сына Арни, сына Есрома, сына Фареса, сына Иуды,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «сына Аминадава, сына Админа, сына Арама»; в других имя Админа опущено: «сына Аминадава, сына Арама».'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: сына
  rationale: Повторяющийся родительный артикль в родословии эллиптически продолжает формулу родства из предыдущего контекста; «сына» естественно и ясно передаёт подразумеваемую связь.
- source_word: Ἀμιναδάβ
  choice: Аминадава
  rationale: Традиционная и узнаваемая русская библейская форма имени в требуемом родительном падеже.
- source_word: Ἀδμίν
  choice: Админа
  rationale: Передаёт чтение Админ, напечатанное в SBLGNT; форма поставлена в родительный падеж.
- source_word: Ἀρνί
  choice: Арни
  rationale: Прямая передача чтения SBLGNT; имя несклоняемое. Вариант «Арам» отмечен в сноске.
- source_word: Ἑσρώμ
  choice: Есрома
  rationale: Узнаваемая русская библейская форма ветхозаветного имени, соответствующая греческому Ἑσρώμ.
- source_word: Φαρές
  choice: Фареса
  rationale: Традиционная русская библейская форма имени, обеспечивающая связь с ветхозаветным персонажем.
- source_word: Ἰούδα
  choice: Иуды
  rationale: Традиционная русская форма имени; генеалогический контекст ясно указывает на патриарха Иуду.
