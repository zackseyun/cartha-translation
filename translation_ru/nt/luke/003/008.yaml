  source_fidelity: Перевод точно передаёт логическую связь οὖν («Итак»), повеление ποιήσατε в естественном сочетании «приносите плоды», множественное число καρπούς и соответствие поступков покаянию. Конструкция μὴ ἄρξησθε λέγειν передана близко, а «между собой» обоснованно сохраняет один из возможных смыслов ἐν ἑαυτοῖς, с указанием альтернативы в сноске. «Отец у нас — Авраам» ясно выражает притязание на происхождение. «Бог может из этих камней воздвигнуть детей Аврааму» сохраняет образ и широту ἐγεῖραι, не навязывая более узкого толкования.
  naturalness: Текст звучит как современный литературный русский с уместным умеренно библейским регистром. «Приносите плоды» и «плоды, достойные покаяния» естественны в данном контексте. Несколько торжественное «воздвигнуть детей Аврааму» оправдано образным и афористичным характером высказывания; оно не является ошибкой.
