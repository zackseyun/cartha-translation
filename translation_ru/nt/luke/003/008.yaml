id: LUK.3.8
reference: Luke 3:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ru
  text: 'Итак, приносите плоды, достойные покаяния[a], и не начинайте говорить между собой[b]: «Отец у нас — Авраам». Ибо говорю вам: Бог может из этих камней воздвигнуть детей Аврааму.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плоды, соответствующие покаянию». В греческом тексте стоит множественное число; речь идёт о поступках, согласующихся с подлинным покаянием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «про себя» или «сами себе». Греческое выражение может обозначать как внутренние слова, так и разговор в своём кругу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: приносите
  rationale: В сочетании с «плодами» естественный русский библейский оборот; повелительная форма сохраняет прямой призыв к действию.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего предупреждения и естественно связывает стихи.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: плоды, достойные покаяния
  rationale: Сохраняет греческое множественное число и образ соответствия поступков подлинному покаянию, не представляя их платой за прощение.
- source_word: μὴ ἄρξησθε λέγειν
  choice: не начинайте говорить
  rationale: Близко передаёт конструкцию с ἄρξησθε и предостерегает даже от начала такого самооправдания.
- source_word: ἐν ἑαυτοῖς
  choice: между собой
  rationale: Естественно для множественного рефлексивного оборота, но неоднозначность между речью внутри группы и внутренними словами отмечена в сноске.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Отец у нас — Авраам
  rationale: Естественно и выразительно передаёт притязание на особое положение на основании происхождения от Авраама.
- source_word: λέγω γὰρ ὑμῖν
  choice: Ибо говорю вам
  rationale: Сохраняет причинную связь γάρ и торжественную формулу утверждения.
- source_word: δύναται ὁ θεὸς
  choice: Бог может
  rationale: Прямо и естественно выражает Божью способность и власть.
- source_word: ἐκ τῶν λίθων τούτων
  choice: из этих камней
  rationale: Точно передаёт ἐκ и указательное τούτων.
- source_word: ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: воздвигнуть детей Аврааму
  rationale: «Воздвигнуть» сохраняет образ и более широкий смысл ἐγείρω — вызвать к существованию или поставить, — не сводя его явно ни к рождению, ни к сотворению.
theological_decisions:
- issue: Смысл выражения «плоды, достойные покаяния»
  choice: Поступки должны соответствовать подлинному покаянию и свидетельствовать о нём.
  alternative: «Плоды, соответствующие покаянию» или собирательное «плод покаяния».
  rationale: Греческий текст подчёркивает согласованность поведения с покаянием, не утверждая, что поступки заслуживают прощение.
- issue: Значение происхождения от Авраама
  choice: Физическое происхождение от Авраама не является достаточным основанием для уверенности перед Богом.
  alternative: Добавить толкование о том, кто именно является «истинными» детьми Авраама.
  rationale: Текст отвергает упование на родословную и утверждает свободу и силу Бога, но не формулирует здесь развёрнутое определение истинного потомства.
- issue: Смысл ἐγεῖραι
  choice: Сохранить образное «воздвигнуть».
  alternative: «Произвести», «создать» или «сделать потомками».
  rationale: Глагол допускает смысл «поставить, вызвать к существованию»; выбранный вариант сохраняет образ и не устраняет его смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Приносите плоды» понятно и естественно; «воздвигнуть детей Аврааму» намеренно сохраняет образность оригинала. Все сносочные маркеры присутствуют в основном тексте.
