lexical_decisions:
- source_word: τοῦ
  choice: сын
  rationale: Повторяющийся родительный артикль входит в эллиптическую формулу родословия; слово «сын» восстанавливает подразумеваемую связь и естественно передаёт её по-русски.
- source_word: Ἰωανὰν
  choice: Иоаннан
  rationale: Имя передано транслитерацией греческой формы; написание отличает его от имени Иоанн.
- source_word: Ῥησὰ
