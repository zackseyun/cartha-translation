  rationale: Использована устоявшаяся русская библейская форма имени, позволяющая узнать ветхозаветное лицо.
- source_word: Σαλαθιὴλ
  choice: Салафииль
  rationale: Использована традиционная русская библейская форма греческого имени; она также узнаваема по русским переводам Ветхого Завета.
- source_word: Νηρὶ
  choice: Нирий
  rationale: Греческое имя передано в традиционной русской библейской форме и поставлено в родительный падеж после слова «сын».
theological_decisions:
- issue: Эллипсис в родословии
  choice: Перед каждым именем повторено слово «сын».
  alternative: Передать последовательность одними формами родительного падежа.
  rationale: Греческий текст повторяет τοῦ, а родственная связь подразумевается из конструкции родословия в ближайшем контексте. Её явное выражение делает русский текст понятным, не добавляя новой богословской мысли.
translation_notes:
