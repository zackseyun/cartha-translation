id: LUK.3.17
reference: Luke 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: ru
  text: У Него в руке веяльная лопата[a], чтобы полностью очистить Своё гумно и собрать пшеницу в Свою житницу[b], а мякину Он сожжёт неугасимым огнём[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «лопата для веяния»; традиционно также «веялка». Этим орудием подбрасывали зерно в воздух, отделяя его от мякины.
    reason: lexical_alternative
  - marker: b
    text: Или «хранилище для зерна».
    reason: lexical_alternative
  - marker: c
    text: То есть огнём, который невозможно погасить.
    reason: lexical_clarification
lexical_decisions:
- source_word: πτύον
  choice: веяльная лопата
  rationale: Так называлось орудие, которым подбрасывали обмолоченное зерно для отделения мякины. Этот вариант точно передаёт сельскохозяйственный образ и понятен современному читателю.
- source_word: διακαθᾶραι
  choice: полностью очистить
  rationale: Приставка усиливает значение глагола; перевод передаёт основательность и завершённость очистки гумна.
- source_word: ἅλωνα
  choice: гумно
  rationale: Традиционное и точное обозначение площадки, где зерно молотили и веяли; сохраняет цельность сельскохозяйственного образа.
- source_word: συναγαγεῖν
  choice: собрать
  rationale: Естественно обозначает собирание отделённого зерна в предназначенное для него хранилище.
- source_word: σῖτον
  choice: пшеницу
  rationale: Хотя слово может обозначать зерно вообще, в данном противопоставлении мякине естественно и контекстуально точно понимать его как пшеницу.
- source_word: ἀποθήκην
  choice: житницу
  rationale: Обозначает место хранения зерна. «Житница» сохраняет конкретный сельскохозяйственный образ и соответствует литературному регистру.
- source_word: ἄχυρον
  choice: мякину
  rationale: В контексте веяния речь идёт о лёгких непригодных остатках, отделяемых от зерна; «мякина» точнее, чем «солома».
- source_word: κατακαύσει
  choice: сожжёт
  rationale: Русский совершенный вид естественно передаёт полное сожжение, выраженное усиленным греческим глаголом, без стилистической перегрузки.
- source_word: πυρὶ ἀσβέστῳ
  choice: неугасимым огнём
  rationale: Точно передаёт огонь, который нельзя погасить, и сохраняет силу образа суда.
- source_word: οὗ
  choice: У Него
  rationale: Родительное относительное местоимение относится к грядущему Мессии. В русском самостоятельное начало «У Него» звучит естественно и сохраняет связь с предшествующим контекстом.
theological_decisions:
- issue: Образ суда и разделения
  choice: Сохранено решительное разделение пшеницы и мякины, а также образы спасения и суда без дальнейшей догматической конкретизации.
  alternative: Истолковать огонь исключительно как временный исторический суд либо развернуть выражение в систематическое учение о конечной участи нечестивых.
  rationale: Сам текст ясно говорит о разделении, собирании пшеницы и сожжении мякины неугасимым огнём, но не поясняет здесь всех обстоятельств и природы этого суда.
- issue: Референт местоимений αὐτοῦ
  choice: Местоимения переданы с прописной буквы как относящиеся к грядущему Христу.
  alternative: Писать местоимения со строчной буквы согласно общей современной орфографической практике.
  rationale: Контекст однозначно относит их к более сильному Грядущему; прописная буква поддерживает принятый в русском библейском стиле уважительный регистр, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и выразительности библейского образа. Термины «гумно», «житница» и «мякина» несколько традиционны, но точны, взаимно поддерживают цельную картину веяния зерна и поясняются там, где это полезно.
