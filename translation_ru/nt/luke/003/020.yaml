lexical_decisions:
- source_word: προσέθηκεν
  choice: прибавил
  rationale: Глагол выражает добавление ещё одного поступка к уже названным; «прибавил» естественно передаёт накопительный смысл.
- source_word: τοῦτο
  choice: ещё одно
  rationale: Указательное местоимение относится к следующему поступку; в сочетании с προσέθηκεν по-русски естественно передаётся как «ещё одно».
- source_word: ἐπὶ πᾶσιν
  choice: ко всем своим злым делам
  rationale: Оборот имеет значение «вдобавок ко всему»; контекст стихов 19–20 ясно указывает на злые дела Ирода. Слово «своим» обозначает принадлежность этих дел действующему лицу, не вводя нового содержания.
- source_word: κατέκλεισεν
  choice: заключил
  rationale: Глагол означает запереть или поместить под стражу; «заключил» естественно сочетается с «в темницу» и сохраняет конкретный смысл лишения свободы.
- source_word: Ἰωάννην
  choice: Иоанна
  rationale: Использована традиционная русская форма библейского имени.
- source_word: ἐν φυλακῇ
  choice: в темницу
  rationale: Здесь φυλακή обозначает место заключения; «темница» — понятное и достойное повествовательное соответствие, естественное в библейском контексте.
theological_decisions:
- issue: Смысл и референт ἐπὶ πᾶσιν
  choice: Ирод добавил заключение Иоанна ко всем своим ранее упомянутым злым делам.
  alternative: 'Более буквально: «прибавил и это ко всему».'
  rationale: Непосредственный контекст перечисляет злые дела Ирода, а затем представляет заключение Иоанна как ещё одно из них. Основной текст делает эту связь явной, а сноска сохраняет более буквальную форму и исходную недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Конструкция ясная и повествовательно энергичная; «темница» сохраняет достоинство стиля без архаичной синтаксической тяжеловесности.
