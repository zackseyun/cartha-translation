    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Он ответил
  rationale: δέ здесь служит мягкой связкой, а εἶπεν в контексте ответа на вопрос естественно передаётся русским «ответил»; местоимение сохраняет повествовательную связность.
- source_word: εἶπεν πρὸς αὐτούς
  choice: ответил им
  rationale: Оборот λέγω + πρός обозначает обращённую к ним речь; поскольку в предыдущем стихе они задали вопрос, «ответил им» естественно выражает дискурсивную функцию реплики.
- source_word: Μηδὲν πλέον
  choice: не … больше
  rationale: Сочетание выражает запрет превышать установленную меру; русская конструкция с «не» и сравнительным «больше» звучит ясно и естественно.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: чем вам предписано
  rationale: Причастие совершенного пассива от διατάσσω указывает на уже установленное официальное предписание. Безличная пассивная конструкция сохраняет эту нормативную окраску, не уточняя не названного в тексте распорядителя.
- source_word: πράσσετε
  choice: взимайте
  rationale: Хотя πράσσω обычно означает «делать, поступать», в данном контексте оно относится к деятельности сборщиков налогов и может обозначать взимание. «Взимайте» естественно передаёт подразумеваемое действие, не добавляя иной предмет речи.
theological_decisions:
- issue: Контекстуальное уточнение действия, выраженного πράσσετε
  choice: Передать как «взимайте», то есть применительно к сбору налогов.
  alternative: «Не делайте ничего сверх того, что вам предписано».
  rationale: Адресаты непосредственно названы сборщиками налогов в предыдущем стихе, поэтому уточнение действия обусловлено контекстом. Сноска сохраняет более формальный и широкий вариант, поскольку сам глагол лексически не ограничен взиманием налогов.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной формулировкой. «Взимайте» сохраняет официальный оттенок речи о налогах; «предписано» передаёт нормативный характер установленного порядка. Маркер сноски помещён после цитаты.
