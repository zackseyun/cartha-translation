lexical_decisions:
- source_word: τοῦ
  choice: сын
  rationale: В родословии повторяющийся родительный артикль эллиптически продолжает формулу родства из контекста. В русском тексте естественно явно повторить слово «сын».
- source_word: Ματταθίου
  choice: Маттафия
  rationale: Личное имя передано в традиционной русской библейской форме; родительный падеж обусловлен конструкцией со словом «сын».
- source_word: Ἀμὼς
  choice: Амоса
  rationale: Личное имя передано в привычной русской форме «Амос» и поставлено в родительный падеж.
- source_word: Ναοὺμ
  choice: Наума
  rationale: Личное имя передано в традиционной русской библейской форме «Наум» и поставлено в родительный падеж.
- source_word: Ἑσλὶ
  choice: Еслия
  rationale: Редкое личное имя передано как «Еслий», с естественной русской падежной формой «Еслия».
- source_word: Ναγγαὶ
  choice: Наггая
  rationale: Личное имя транслитерировано как «Наггай»; форма «Наггая» соответствует русскому родительному падежу.
