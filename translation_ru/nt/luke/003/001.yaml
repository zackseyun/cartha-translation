  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: ru
  text: В пятнадцатом году правления императора Тиберия[a], когда Понтий Пилат управлял Иудеей, Ирод был тетрархом Галилеи, его брат Филипп — тетрархом области Итуреи и Трахонитиды, а Лисаний — тетрархом Авилинеи[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в течение пятнадцатого года».'
    reason: lexical_alternative
  - marker: b
    text: Тетрарх — правитель области, подвластной Риму.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει ... πεντεκαιδεκάτῳ
  choice: В пятнадцатый год
  rationale: Естественная русская передача временной конструкции, сохраняющая хронологическую рамку; возможный оттенок продолжительности отмечен в сноске.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица служит мягким повествовательным переходом; в русском такой переход естественно передаётся самим началом нового предложения без добавления «итак» или «же».
- source_word: ἡγεμονίας
  choice: правления
  rationale: В сочетании с именем императора слово обозначает период его власти; «правление» звучит точно и естественно.
- source_word: Τιβερίου Καίσαρος
  choice: кесаря Тиберия
  rationale: Употреблена традиционная русская библейская форма титула Καῖσαρ и нормативная форма имени.
- source_word: ἡγεμονεύοντος
  choice: управлял
  rationale: Глагольная передача сохраняет значение причастия и не превращает его прямо в обозначение должности.
- source_word: τετρααρχοῦντος
  choice: был тетрархом
  rationale: Сохранён конкретный исторический титул, а не обобщённое «правил».
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: его брат Филипп
  rationale: Естественно передаёт приложение и относит местоимение к Ироду.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: области Итуреи и Трахонитиды
  rationale: Слово «область» передаёт χώρα как территорию и не создаёт впечатления независимого государства.
- source_word: τῆς Ἀβιληνῆς
  choice: Авилинеи
  rationale: Передано как название исторической области в традиционной русской форме.
theological_decisions:
- issue: Передача политического титула τετρααρχοῦντος
  choice: был тетрархом
  alternative: правил; был правителем
  rationale: Конкретный исторический титул сохранён ради точности; это не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Длинная синтаксическая конструкция оригинала сохранена, но упорядочена средствами русской пунктуации. Стих оканчивается запятой, поскольку греческое предложение продолжается в следующем стихе.
