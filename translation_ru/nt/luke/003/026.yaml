  rationale: Повторяющийся артикль родительного падежа употреблён эллиптически и продолжает генеалогическую формулу из контекста. Русское «сына» ясно передаёт подразумеваемую родственную связь, не перегружая текст.
- source_word: Μάαθ
  choice: Маата
  rationale: Личное имя передано принятой русской библейской транслитерацией; форма родительного падежа обусловлена словом «сына».
- source_word: Ματταθίου
  choice: Маттафия
  rationale: Греческое личное имя передано русской формой «Маттафий» в родительном падеже.
- source_word: Σεμεῒν
  choice: Семеина
  rationale: Имя транслитерировано непосредственно с греческой формы и поставлено в родительный падеж после «сына».
- source_word: Ἰωσὴχ
  choice: Иосиха
  rationale: Передаёт чтение SBLGNT Ἰωσήχ, включая конечный χ; русская форма поставлена в родительный падеж.
- source_word: Ἰωδὰ
  choice: Иоды
  rationale: Прямая передача греческого Ἰωδά без гармонизации с предполагаемой еврейской формой; употреблён родительный падеж.
