id: LUK.3.14
reference: Luke 3:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: ru
  text: 'Спрашивали его и воины: «А нам что делать?» Он ответил им: «Ни у кого ничего не вымогайте[a], никого не обвиняйте ложно и довольствуйтесь своим жалованьем[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может буквально передавать действие запугивания или «встряхивания» человека; здесь речь о принуждении ради выгоды, то есть о вымогательстве.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «платой»; греческое слово часто обозначало жалованье или содержание воинов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: воины
  rationale: Причастие обозначает людей, несущих военную службу; «воины» — естественное и достойное обозначение в данном историческом контексте.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: А нам что делать?
  rationale: 'Естественный русский вопрос сохраняет выделение καὶ ἡμεῖς: эта группа спрашивает, что следует делать также и ей.'
- source_word: διασείσητε
  choice: ни у кого ничего не вымогайте
  rationale: В контексте злоупотреблений властью глагол означает принуждение или запугивание ради получения выгоды; перевод передаёт смысл без разговорного оттенка.
- source_word: συκοφαντήσητε
  choice: никого не обвиняйте ложно
  rationale: Формулировка сохраняет юридико-нравственный смысл неправомерного или ложного обвинения, не сужая его до шантажа.
- source_word: ἀρκεῖσθε
  choice: довольствуйтесь
  rationale: Настоящее повелительное наклонение выражает постоянную установку удовлетворяться тем, что им положено.
- source_word: ὀψωνίοις
  choice: жалованьем
  rationale: В военном контексте слово обозначает плату или содержание военнослужащего; «жалованье» точно передаёт это значение и соответствует литературному регистру.
theological_decisions:
- issue: Нравственное наставление воинам
  choice: Передать конкретные запреты на злоупотребление властью и требование довольствоваться жалованьем, не добавляя повеления оставить службу.
  alternative: Истолковать ответ как подразумеваемое осуждение самой военной службы.
  rationale: Текст обращён к несущим военную службу и прямо предписывает им справедливое поведение; более широкий вывод о допустимости или недопустимости военной службы здесь не формулируется.
translation_notes:
  register: Современный литературный русский язык. Реплика «А нам что делать?» звучит естественно и сохраняет подчёркнутое «и мы». Слова «воины» и «жалованье» поддерживают достойный библейский регистр без излишней архаизации.
