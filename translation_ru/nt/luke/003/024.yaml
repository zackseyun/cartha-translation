lexical_decisions:
- source_word: τοῦ
  choice: сын
  rationale: Повторяющийся родительный артикль с именами эллиптически продолжает родословную формулу; в русском для ясности перед каждым именем восполняется подразумеваемое «сын».
- source_word: Μαθθὰτ
  choice: Матфата
  rationale: Традиционная и узнаваемая русская передача имени; родительный падеж обусловлен словом «сын».
- source_word: Λευὶ
  choice: Левия
  rationale: Устоявшаяся русская форма библейского имени в родительном падеже.
- source_word: Μελχὶ
  choice: Мелхия
  rationale: Русская передача греческой формы имени с естественным оформлением родительного падежа.
- source_word: Ἰανναὶ
  choice: Ианная
  rationale: Передача сохраняет греческую форму Ἰανναί и отличает её от иных возможных вариантов имени.
- source_word: Ἰωσὴφ
  choice: Иосифа
  rationale: Устоявшаяся русская форма библейского имени в родительном падеже.
theological_decisions:
- issue: Эллипсис в родословной
  choice: Перед каждым именем явно поставлено «сын»
  alternative: 'Сохранить формальную цепочку родительных падежей: «Матфата, Левия, Мелхия, Ианная, Иосифа»'
  rationale: Греческий текст продолжает синтаксическую конструкцию родословной и подразумевает родственную связь. Её явное выражение делает отдельный стих понятным по-русски, не добавляя новой богословской информации.
translation_notes:
  register: Современный литературный русский язык; сохранён торжественный, но понятный ритм родословной. Имена переданы в привычных русских библейских формах, а подразумеваемое отношение родства выражено явно.
