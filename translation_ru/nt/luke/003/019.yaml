id: LUK.3.19
reference: Luke 3:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: ru
  text: Ирод же, тетрарх, которого Иоанн обличал за Иродиаду, жену его брата, и за всё зло, которое он, Ирод, совершил,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τετραάρχης
  choice: тетрарх
  rationale: Сохранён конкретный историко-политический титул; слово понятно в современном литературном русском и не сводит должность к общему понятию «правитель».
- source_word: ἐλεγχόμενος
  choice: которого Иоанн обличал
  rationale: «Обличал» передаёт нравственное осуждение и выявление неправоты; несовершенный вид отражает продолжающееся или повторяющееся действие причастия настоящего времени.
- source_word: ὑπ’ αὐτοῦ
  choice: Иоанн
  rationale: Хотя в греческом стоит местоимение «им», по-русски оно могло бы двусмысленно отсылать к Ироду; явное имя восстанавливает очевидного из контекста деятеля без изменения смысла.
- source_word: περὶ Ἡρῳδιάδος
  choice: за Иродиаду
  rationale: В сочетании с «обличал» предлог «за» естественно обозначает основание обличения; повторение περὶ далее передано тем же строем.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: жену его брата
  rationale: Естественно передаёт греческую цепочку родительных падежей и сохраняет значимое указание на брачные отношения.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: и за всё зло, которое он, Ирод, совершил
  rationale: Русское собирательное «всё зло» естественно выражает совокупность злых поступков; повтор имени снимает возможную неоднозначность субъекта внутри придаточного.
- source_word: δὲ
  choice: же
  rationale: Постпозитивное «же» естественно отмечает переход и контраст, не усиливая его до резкого противопоставления.
theological_decisions:
- issue: Нравственная сила обличения Иродa Иоанном
  choice: «обличал»
  alternative: «укорял»; «изобличал»
  rationale: «Обличал» сохраняет пророческое нравственное осуждение и возможный оттенок выявления вины, не превращая фразу в юридическое обвинение и не добавляя богословских выводов.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-торжественный. Сохранён исторический титул «тетрарх». Синтаксис учитывает, что стих продолжается в Лк 3:20, поэтому в конце оставлена запятая.
