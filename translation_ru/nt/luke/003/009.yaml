  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ru
  text: Уже и топор лежит у корня деревьев. Итак, всякое дерево, не приносящее доброго плода, срубают и бросают в огонь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: Уже и
  rationale: Передаёт временную неотложность ἤδη и добавочное усиление καί; δέ продолжает предыдущее предостережение и не требует отдельного противительного союза.
- source_word: ἡ ἀξίνη
  choice: топор
  rationale: Естественное современное русское обозначение рубящего орудия; сохраняет образ суда.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων
  choice: у корней деревьев
  rationale: Передаёт положение топора непосредственно у основания деревьев и готовность начать рубку; множественное «корней» естественно согласуется в русском с множественным «деревьев».
- source_word: κεῖται
  choice: лежит
  rationale: Прямое и естественное соответствие глаголу положения; не добавляет прямо не выраженного значения «положен».
- source_word: πᾶν οὖν δένδρον
  choice: Поэтому всякое дерево
  rationale: οὖν выражает вывод из предшествующего предупреждения; «всякое» сохраняет обобщающий характер πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: не приносящее доброго плода
  rationale: В сочетании с плодом ποιέω по-русски естественно передаётся как «приносить»; «доброго» сохраняет качественную и нравственную окраску καλός.
- source_word: ἐκκόπτεται
  choice: срубают
  rationale: Настоящее страдательное передано неопределённо-личной конструкцией, естественной для русского языка; применительно к дереву «срубают» точнее и живее, чем «отсекают».
- source_word: εἰς πῦρ βάλλεται
  choice: бросают в огонь
  rationale: Сохраняет направление εἰς и суровость образа; неопределённо-личная форма параллельна «срубают».
theological_decisions:
- issue: Образ грядущего суда
  choice: Сохранить образ топора у корней, бесплодного дерева и огня без уточнения, какой именно суд обозначен огнём.
  alternative: Прямо истолковать огонь как ад либо ограничить образ историческим судом над Израилем.
  rationale: Текст ясно выражает близость и суровость суда, но сам стих не определяет исчерпывающе его временной и эсхатологический референт.
- issue: Время пассивных форм ἐκκόπτεται и βάλλεται
  choice: 'Передать настоящим временем: «срубают и бросают».'
  alternative: 'Передать будущим временем: «будет срублено и брошено».'
  rationale: Настоящее время усиливает живость и неотвратимость предупреждения, не превращая грамматическую форму в явно будущее утверждение.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественно-сдержанный. Синтаксис сохраняет краткость и резкость пророческого предупреждения; архаизмы и конфессионально окрашенные уточнения исключены.
