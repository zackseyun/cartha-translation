  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: ru
  text: Всякая долина наполнится[a], и всякая гора и холм понизятся; кривое станет прямым, и неровные пути — гладкими дорогами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякий овраг заполнится».'
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с Исайей 40:4 и рисуют подготовку дороги для Господа.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: всякая долина
  rationale: φάραγξ может обозначать долину, овраг или ущелье. «Долина» естественно звучит по-русски и сохраняет широкий образ выравнивания местности; более узкий вариант отмечен в сноске.
- source_word: πληρωθήσεται
  choice: наполнится
  rationale: Будущая пассивная форма πληρόω буквально передаёт заполнение углубления; русская возвратная конструкция естественно выражает тот же результат.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: всякая гора и холм
  rationale: Сохранены оба близких, но не тождественных обозначения возвышенности и поэтическая полнота греческого текста.
- source_word: ταπεινωθήσεται
  choice: понизятся
  rationale: В топографическом контексте ταπεινόω означает сделать ниже. «Понизятся» сохраняет физический образ, не подменяя его нравственным толкованием «смирятся».
- source_word: τὰ σκολιά εἰς εὐθείαν
  choice: кривое станет прямым
  rationale: Субстантивированные формы в греческом не называют прямо дорогу или место. Единственное число в русском сохраняет собирательную отвлечённость выражения и не вносит отсутствующее существительное.
- source_word: αἱ τραχεῖαι εἰς ὁδοὺς λείας
  choice: неровные пути — гладкими дорогами
  rationale: Женский род αἱ τραχεῖαι допускает подразумеваемое ὁδοί; «пути» естественно восполняет эллипсис, а явно выраженное ὁδοὺς λείας передано как «гладкими дорогами».
theological_decisions:
- issue: Пророческий образ из Исайи 40:4
  choice: Сохранить конкретную картину выравнивания местности и подготовки дороги.
  alternative: Передать образ как прямое нравственное или духовное утверждение о смирении гордых и возвышении униженных.
  rationale: Лука цитирует пророческий текст с конкретной дорожной и топографической образностью. Буквенный образ сохраняет поэтическую силу и не закрепляет в переводе лишь одно из возможных богословских применений.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским ритмом. Формы «всякая», «станет прямым» и параллельные конструкции сохраняют пророческую поэтичность; устаревшая и конфессионально окрашенная лексика не используется.
