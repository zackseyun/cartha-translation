- source_word: Μελχὶ
  choice: Мелхия
  rationale: Личное имя передано в принятой русской библейской форме и поставлено в родительный падеж после слова «сын».
- source_word: Ἀδδὶ
  choice: Аддия
  rationale: Личное имя транслитерировано в соответствии с русской библейской традицией и оформлено родительным падежом.
- source_word: Κωσὰμ
  choice: Косама
  rationale: Имя передано близко к греческой форме Κωσάμ и поставлено в родительный падеж.
- source_word: Ἐλμαδὰμ
  choice: Елмадама
  rationale: Имя транслитерировано с учетом современной русской библейской орфографии и оформлено родительным падежом.
- source_word: Ἢρ
  choice: Ира
  rationale: Использована устоявшаяся русская библейская форма имени; после слова «сын» она стоит в родительном падеже.
