  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: ru
  text: 'Даже сборщики налогов пришли креститься и сказали ему: «Учитель, что нам делать?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: пришли
  rationale: Аорист ἔρχομαι естественно передаётся простым прошедшим временем и обозначает состоявшееся действие.
- source_word: δὲ καὶ τελῶναι
  choice: даже сборщики налогов
  rationale: Сочетание δὲ с καὶ имеет присоединительно-усилительный оттенок; «даже» сохраняет подчёркнутое включение этой общественно презираемой группы.
- source_word: βαπτισθῆναι
  choice: креститься
  rationale: Пассивный инфинитив цели после ἦλθον передан естественной русской возвратной формой, означающей принятие крещения, а не совершение его над собой.
- source_word: εἶπαν πρὸς αὐτόν
  choice: сказали ему
  rationale: Сохранено прямое значение λέγω с πρὸς; вопросительный характер реплики ясен из последующих слов.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Точное и естественное обращение к наставнику без привнесения дополнительных оттенков власти или иудейского титула.
- source_word: τί ποιήσωμεν
  choice: что нам делать?
  rationale: Совещательное сослагательное наклонение выражает вопрос о должном практическом действии; эта формулировка естественна в современном русском языке.
theological_decisions:
- issue: Подчёркнутое включение сборщиков налогов среди откликнувшихся на призыв Иоанна
  choice: «даже сборщики налогов»
  alternative: «сборщики налогов тоже»
  rationale: «Даже» передаёт вероятную риторическую силу καὶ в контексте, не добавляя оценки их нравственного состояния сверх заложенного в повествовании.
translation_notes:
  register: Современный литературный русский язык; краткий, ясный и достойный повествовательный стиль. «Сборщики налогов» понятнее современному читателю, чем историзм «мытари», а «креститься» является естественным русским обозначением принятия крещения.
