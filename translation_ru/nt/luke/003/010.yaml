lexical_decisions:
- source_word: ἐπηρώτων
  choice: спрашивал
  rationale: Имперфект передаёт продолжавшийся или повторявшийся вопрос; в русском языке это естественно выражается несовершенным видом. Единственное число согласовано с собирательным существительным «народ».
- source_word: οἱ ὄχλοι
  choice: народ
  rationale: Хотя греческое слово стоит во множественном числе («толпы»), в данном контексте естественное русское «народ» обозначает собравшихся людей без оттенка хаотичной массы.
- source_word: λέγοντες
  choice: не выражено отдельно
  rationale: В русском языке содержание вопроса естественно присоединяется непосредственно после глагола «спрашивал»; буквальное «говоря» было бы тяжеловесным и ничего не добавляло бы к смыслу.
- source_word: Τί οὖν
  choice: Что же
  rationale: Частица «же» естественно передаёт вывод из предшествующего призыва Иоанна и сохраняет связь вопроса с контекстом.
- source_word: ποιήσωμεν
  choice: нам делать
  rationale: Совещательный аорист конъюнктива выражает вопрос о необходимом практическом действии. Русская конструкция «что нам делать?» точно и естественно передаёт этот смысл, не придавая ему излишне формального оттенка.
