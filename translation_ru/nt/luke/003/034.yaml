- source_word: Ναχώρ
  choice: Нахора
  rationale: Традиционная русская ветхозаветная форма имени того же лица, близкая греческой форме и узнаваемая читателю.
theological_decisions:
- issue: Передача подразумеваемого сыновнего отношения в эллиптической родословной
  choice: Повторить «сына» перед каждым именем
