  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: ru
  text: И он прошёл по всей окрестности Иордана, возвещая крещение покаяния для прощения грехов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: прошёл по всей окрестности Иордана
  rationale: В сочетании с обозначением всей области глагол движения и εἰς естественно передаются по-русски как движение по территории. «Окрестность Иордана» сохраняет связь с рекой и значение περίχωρος.
- source_word: κηρύσσων
  choice: возвещая
  rationale: Передаёт публичное провозглашение, выраженное κηρύσσω, и избегает более узкого современного церковного оттенка слова «проповедуя».
- source_word: βάπτισμα
  choice: крещение
  rationale: Стандартное и понятное соответствие для βάπτισμα в данном контексте.
- source_word: μετανοίας
  choice: покаяния
  rationale: Родительный падеж сохраняет тесную, но не истолкованную переводчиком связь между крещением и покаянием.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: для прощения грехов
  rationale: Естественно передаёт целевую конструкцию εἰς и обычное контекстуальное значение ἄφεσις, не уточняя механизм этой связи.
theological_decisions:
- issue: Связь крещения, покаяния и прощения
  choice: крещение покаяния для прощения грехов
  alternative: крещение как знак покаяния, ведущего к прощению; крещение, в котором выражается покаяние ради прощения
  rationale: Формулировка прозрачно сохраняет греческую конструкцию и её богословское напряжение, не определяя крещение как инструментальное, символическое или декларативное по отношению к прощению.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза с достоинством библейского стиля. «Прошёл по всей окрестности» звучит естественнее буквального «пришёл во всю окрестность» и передаёт охват всей области.
