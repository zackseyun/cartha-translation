  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: ru
  text: 'Произошло же так: когда весь народ принял крещение и Иисус, тоже приняв крещение, молился, небо открылось[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать как небесную сферу, так и видимое небо; здесь контекст прежде всего указывает на откровение свыше.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Произошло же так
  rationale: Передаёт характерную для Луки формулу перехода к новому событию; «же» сохраняет повествовательную связку δέ, не придавая ей резкого противопоставления.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: когда весь народ принял крещение
  rationale: Конструкция с ἐν и артиклевым инфинитивом имеет временное значение. «Принял крещение» естественно передаёт пассив βαπτισθῆναι и не создаёт впечатления, будто люди крестили сами себя.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: и Иисус, тоже приняв крещение
  rationale: «Тоже» передаёт присоединительное καί, а деепричастный оборот сохраняет предшествование крещения молитве без излишне жёсткой временной схемы.
- source_word: καὶ προσευχομένου
  choice: молился
  rationale: Передаёт продолжающееся действие, на фоне которого открылось небо.
- source_word: ἀνεῳχθῆναι
  choice: открылось
  rationale: Сохраняет пассивный смысл греческой формы без более сильного образа разрывания, характерного для иной формулировки.
- source_word: τὸν οὐρανὸν
  choice: небо
  rationale: Русское «небо» естественно обозначает и видимый небосвод, и небесную сферу, тем самым сохраняя смысловую ёмкость греческого οὐρανός; контекст указывает прежде всего на откровение свыше.
theological_decisions:
- issue: Значение οὐρανός в сцене крещения
  choice: небо, прежде всего как небесная сфера
  alternative: видимое небо, небосвод
  rationale: Последующие сошествие Духа и голос свыше придают выражению смысл божественного откровения, однако перевод «небо» не устраняет присущую греческому слову возможность пространственного образа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет связь крещения Иисуса с крещением народа и подчёркивает, что небо открылось во время Его молитвы.
