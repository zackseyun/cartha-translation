id: LUK.3.16
reference: Luke 3:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: ru
  text: 'Иоанн ответил всем: «Я крещу вас водой[a], но идёт тот, кто сильнее меня[b]. Я недостоин развязать ремень его сандалий. Он будет крестить вас в Святом Духе[c] и огне[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в воде». Греческий дательный падеж здесь может обозначать средство или стихию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тот, кто могущественнее меня».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Святым Духом и огнём». В греческом стоит предлог со значением «в»; здесь он может указывать на средство, сферу или стихию.'
    reason: lexical_alternative
  - marker: d
    text: «Огонь» можно понимать как очищение, как суд или как часть единого образа крещения Духом и огнём. Перевод оставляет это выражение без уточняющего толкования.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν
  choice: Иоанн ответил всем
  rationale: Обычная повествовательная формула ἀπεκρίνατο λέγων естественно передаётся по-русски одним глаголом «ответил»; πᾶσιν сохранено словом «всем». Отдельное «сказав» было бы избыточно и тяжеловесно.
- source_word: Ἐγὼ μὲν
  choice: Я … но
  rationale: Частица μέν подготавливает противопоставление, выраженное далее δέ. В современном русском это естественно передаётся конструкцией «Я … но», без неестественного «с одной стороны».
- source_word: ὕδατι
  choice: водой
  rationale: Дательный падеж может обозначать средство или стихию. Русский творительный «водой» наиболее естественен при глаголе «крестить», а вариант «в воде» отмечен в сноске.
- source_word: βαπτίζω / βαπτίσει
  choice: крещу / будет крестить
  rationale: «Крестить» — общепринятый и уместный в евангельском повествовании эквивалент. «Погружать» сузило бы смысл и могло бы внести конфессионально обусловленную конкретизацию.
- source_word: ἔρχεται
  choice: идёт
  rationale: Настоящее время передаёт приближение и близость прихода. «Идёт» естественно выражает это в русском контексте.
- source_word: ὁ ἰσχυρότερός μου
  choice: тот, кто сильнее меня
  rationale: Сравнительная степень ἰσχυρότερος передана прямо и ясно; конструкция сохраняет определённость греческого выражения, не добавляя имени или титула.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Я недостоин
  rationale: В формуле смирения ἱκανός обозначает не только способность, но и достоинство; «недостоин» естественно передаёт смысл в русском языке.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: развязать ремень его сандалий
  rationale: Передан конкретный образ низкого служения без архаизмов. Единственное число «ремень» следует форме τὸν ἱμάντα, а «сандалий» естественно передаёт множественное τῶν ὑποδημάτων.
- source_word: αὐτὸς
  choice: Он
  rationale: 'Местоимение имеет подчёркнутую, контрастную функцию: не Иоанн, а грядущий совершит это крещение. Русское «Он» после явного противопоставления передаёт контраст без утяжеления «Он Сам».'
- source_word: ἐν πνεύματι ἁγίῳ
  choice: в Святом Духе
  rationale: Предлог ἐν сохранён как «в», чтобы не решать однозначно, обозначает ли он средство, сферу или стихию. «Святой Дух» написано с прописных букв как обозначение Божьего Духа.
- source_word: καὶ πυρί
  choice: и огне
  rationale: Краткое греческое выражение сохранено без толкования. Общий предлог «в» относится и к «огне», как и в исходной конструкции.
theological_decisions:
- issue: Смысл крещения «в Святом Духе и огне»
  choice: Сохранить буквальную формулировку, не определяя, является ли огонь очищением, судом или частью единого образа крещения Духом и огнём.
  alternative: Истолковать огонь только как очищение либо распределить крещение Духом и крещение огнём между разными группами людей.
  rationale: Сам стих не разъясняет функцию огня, а ближайший контекст допускает разные прочтения. Перевод сохраняет богословское напряжение исходного текста.
- issue: Определение грядущего сильнейшего
  choice: Не добавлять в текст имя или мессианский титул.
  alternative: Передать как «Мессия» или прямо назвать Иисуса.
  rationale: Хотя в повествовательном контексте речь идёт об Иисусе, в самом высказывании Иоанна употреблено описательное выражение «тот, кто сильнее меня»; оно и сохранено.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис упрощён там, где буквальное воспроизведение греческой повествовательной формулы звучало бы тяжеловесно, но смысловые противопоставления и неоднозначность предлога ἐν сохранены. Местоимение «его» написано со строчной буквы согласно нейтральной современной издательской практике; «Он» начинается с прописной как первое слово предложения, без внесения особой конфессиональной системы почтительных прописных.
