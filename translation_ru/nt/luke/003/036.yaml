lexical_decisions:
- source_word: τοῦ
  choice: сына
  rationale: В родословной повторяющийся родительный артикль при каждом имени эллиптически обозначает происхождение; слово «сына» естественно и ясно передаёт эту связь по-русски.
- source_word: Καϊνὰμ
  choice: Каинана
  rationale: Имя передано в форме, традиционно узнаваемой в русском библейском употреблении; родительный падеж обусловлен построением родословной.
- source_word: Ἀρφαξὰδ
  choice: Арфаксада
  rationale: Передача отражает греческую форму имени у Луки и привычную русскую библейскую транслитерацию.
- source_word: Σὴμ
  choice: Сима
  rationale: Использована закрепившаяся в русском библейском употреблении форма имени, поставленная в родительный падеж.
- source_word: Νῶε
  choice: Ноя
  rationale: Использован общеупотребительный русский библейский эквивалент греческой формы имени.
- source_word: Λάμεχ
  choice: Ламеха
  rationale: Имя передано в традиционной и понятной русской форме, в родительном падеже.
theological_decisions:
- issue: Наличие Каинана в родословной между Арфаксадом и Симом
  choice: Каинан сохранён в основном тексте.
  alternative: В некоторых традициях Каинан здесь опускается ради большего соответствия некоторым формам ветхозаветной родословной.
  rationale: В тексте SBLGNT имя Καϊνάμ присутствует; перевод следует данному греческому тексту Луки, не гармонизируя его с отдельными формами родословной в Ветхом Завете.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого ритма родословной. Имена даны в привычных русских библейских формах; конструкция начинается со строчной буквы, поскольку стих продолжает синтаксическую цепь предыдущих стихов.
