id: LUK.3.15
reference: Luke 3:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: ru
  text: 'Народ был полон ожидания, и все размышляли в своих сердцах об Иоанне: не он ли Мессия[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греч. хо христос — «Помазанник».'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: был полон ожидания
  rationale: Генитив абсолютный задаёт фон, а προσδοκάω выражает напряжённое, исполненное надежд ожидание; русская формулировка естественно передаёт длительное состояние.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ служит мягкой связкой в развитии повествования. В русском переход естественно передаётся порядком фраз без добавления «теперь» или усиленного противопоставления.
- source_word: τοῦ λαοῦ
  choice: народ
  rationale: λαός обозначает народ как совокупность людей и в Луки может сохранять библейские, в том числе заветные, оттенки; «народ» точнее, чем «толпа».
- source_word: διαλογιζομένων πάντων
  choice: все размышляли
  rationale: διαλογίζομαι здесь означает внутренне рассуждать, обдумывать; πάντων передано прямо словом «все».
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: в своих сердцах
  rationale: Сохранён библейский образ сердца как средоточия мысли и внутреннего рассуждения, без сужения значения до одного лишь разума.
- source_word: περὶ τοῦ Ἰωάννου
  choice: об Иоанне
  rationale: Прямое и естественное соответствие конструкции περί с родительным падежом.
- source_word: μήποτε αὐτὸς εἴη
  choice: не он ли
  rationale: Русская косвенно-вопросительная конструкция естественно передаёт неуверенную возможность, выраженную μήποτε и оптативом εἴη; местоимение «он» сохраняет акцент αὐτός.
- source_word: ὁ χριστός
  choice: Мессия
  rationale: В контексте ожиданий народа Χριστός является титулом Помазанника, поэтому «Мессия» ясно передаёт иудейский мессианский смысл.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Речь идёт о том, не является ли Иоанн ожидаемым Помазанником; титульное значение лучше раскрывается словом «Мессия», тогда как «Христос» в современном русском часто воспринимается как имя или устойчивое именование Иисуса.
- issue: Степень уверенности народа
  choice: не он ли
  alternative: неужели он и есть
  rationale: Конструкция μήποτε с оптативом выражает осторожное предположение, а не убеждённость или сильное изумление; «не он ли» сохраняет неопределённость.
translation_notes:
  register: Современный литературный русский с сохранением библейского выражения «в своих сердцах». Синтаксис сделан плавным и понятным; двоеточие вводит содержание внутренних размышлений. Тон нейтральный и достойный, без конфессионально специфической терминологии.
