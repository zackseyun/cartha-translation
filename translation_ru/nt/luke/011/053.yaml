lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Когда Он вышел оттуда
  rationale: Генитивная абсолютная конструкция с аористным причастием обозначает обстоятельство, предшествующее основному действию; русское придаточное естественно передаёт и временную, и пространственную связь.
- source_word: ἤρξαντο
  choice: стали
  rationale: В сочетании с инфинитивами передаёт начало действия; «стали» звучит естественно в современном русском повествовании.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Устоявшееся и точное евангельское обозначение знатоков и толкователей Писания.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшаяся русская передача названия религиозной группы.
- source_word: δεινῶς ἐνέχειν
  choice: яростно теснить Его
  rationale: Сочетание выражает сильное, враждебное давление. «Теснить» сохраняет образ нажима, а «яростно» передаёт интенсивность δεινῶς.
- source_word: ἀποστοματίζειν αὐτὸν
  choice: допытываться у Него
  rationale: Редкий глагол, вероятно, означает настойчиво вызывать человека на ответы или добиваться от него неподготовленных высказываний. «Допытываться» естественно передаёт агрессивную настойчивость, не уточняя сверх меры её способ.
- source_word: περὶ πλειόνων
  choice: о многом
  rationale: В данном контексте выражение указывает на множество предметов или вопросов; краткое русское «о многом» передаёт это естественно.
