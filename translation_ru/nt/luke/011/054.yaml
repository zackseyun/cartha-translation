lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: подстерегая
  rationale: Причастие передаёт враждебное выжидание удобного момента для нападения или ловушки; «подстерегая» естественно сохраняет этот оттенок.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; имя не добавлено, поскольку в греческом тексте стоит местоимение.
- source_word: θηρεῦσαί
  choice: поймать
  rationale: Глагол вызывает образ охоты и поимки добычи; в сочетании «поймать на слове» этот образ естественно передаёт намерение устроить словесную ловушку.
- source_word: τι
  choice: на каком-нибудь слове
  rationale: Неопределённое местоимение указывает на любое высказывание, которое можно было бы использовать против Иисуса; по-русски это идиоматично выражается сочетанием «на каком-нибудь слове».
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: на каком-нибудь слове
  rationale: Буквальный образ «из Его уст» обозначает сказанное Им. Русское выражение «поймать на слове» передаёт смысл естественно, а конкретный образ оригинала отмечен в сноске.
