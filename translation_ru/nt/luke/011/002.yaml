base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: ru
  text: 'И Он сказал им: «Когда молитесь, говорите: „Отец! Пусть святится имя Твоё. Пусть придёт Царство Твоё“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Когда молитесь
  rationale: Общее временное условие и обычное, повторяющееся действие естественно передаются по-русски конструкцией «когда молитесь».
- source_word: λέγετε
  choice: говорите
  rationale: Настоящее повелительное наклонение выражает наставление для молитвы; «говорите» сохраняет прямую форму и естественно звучит по-русски.
- source_word: Πάτερ
  choice: Отец
  rationale: В предоставленном греческом тексте стоит только звательная форма «Отец», без «наш»; перевод не гармонизирует стих с Мф. 6:9.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: Пусть святится имя Твоё
  rationale: «Пусть святится» сохраняет пассивную форму и силу молитвенного прошения, оставаясь понятным и укоренённым в современном литературном русском языке.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: Пусть придёт Царство Твоё
  rationale: Конструкция с «пусть» естественно передаёт молитвенно-повелительную силу аористного императива; «Царство» сохраняет как идею Божьего правления, так и эсхатологическую перспективу.
theological_decisions:
- issue: Обращение к Богу без местоимения «наш»
  choice: Отец
  alternative: Отче наш
  rationale: Перевод следует SBLGNT, где читается Πάτερ, и не вносит формулировку из параллельного места Мф. 6:9.
- issue: Значение ἁγιασθήτω применительно к Божьему имени
  choice: Пусть святится имя Твоё
  alternative: Да будет свято имя Твоё
  rationale: Выбранная формулировка сохраняет грамматическую пассивность и богословскую напряжённость прошения, не уточняя сверх текста, кем и каким образом имя признаётся святым.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранён традиционно узнаваемый глагол «святится», который понятен в контексте и точнее передаёт пассив ἁγιασθήτω. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской практике.
