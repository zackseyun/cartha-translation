source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ru
  text: Ведь всякий, кто просит, получает; кто ищет, находит; и тому, кто стучит, будет открыто.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с явным указанием подразумеваемого по контексту: «тому, кто стучит, откроют дверь». В греческом тексте не сказано прямо, что именно будет открыто.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: всякий
  rationale: Передаёт дистрибутивное значение в сочетании с субстантивированным причастием и сохраняет всеобщий охват высказывания.
- source_word: γὰρ
  choice: ведь
  rationale: Естественно передаёт пояснительную связь с предшествующим призывом просить, искать и стучать.
- source_word: ὁ αἰτῶν
  choice: кто просит
  rationale: Современная и естественная передача субстантивированного причастия настоящего времени с обобщённым значением.
- source_word: λαμβάνει
  choice: получает
  rationale: Точно соответствует контексту просьбы и ответа и сохраняет настоящее время общей максимы.
- source_word: ὁ ζητῶν
  choice: кто ищет
  rationale: Передаёт обобщённое значение причастия настоящего времени без архаичности.
- source_word: εὑρίσκει
  choice: находит
  rationale: Прямой и естественный эквивалент в параллельном трёхчастном изречении.
- source_word: τῷ κρούοντι
  choice: тому, кто стучит
  rationale: Сохраняет дательный падеж греческой конструкции и обобщённый характер причастия.
- source_word: ἀνοιγήσεται
  choice: будет открыто
  rationale: Сохраняет будущее пассивное значение и не называет прямо отсутствующий в греческом тексте объект; средний род «открыто» естественно допускает подразумеваемое «дверь/вход» без его внесения в основной текст.
theological_decisions:
- issue: Охват и сила всеобщего обещания
  choice: Передать высказывание как общее и не ограниченное в самом стихе утверждение.
  alternative: Добавить условия вроде «кто просит правильно» или ослабить обещание, представив его лишь как гиперболическое ободрение.
  rationale: Греческий текст формулирует всеобщую максиму без явных оговорок. Перевод сохраняет эту богословскую напряжённость и не вводит отсутствующих условий.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого афористического изречения. Параллелизм трёх частей сохранён; точка с запятой делает структуру ясной. «Ведь» звучит естественнее формального «ибо», сохраняя пояснительную функцию γὰρ.
