review_pass:
  verdict: approve
  source_fidelity: Перевод точно передаёт пояснительное γάρ («Ведь»), всеобщий охват πᾶς и три параллельные конструкции настоящего времени. Будущее страдательное ἀνοιγήσεται адекватно отражено словами «будет открыто» без внесения в основной текст отсутствующего в греческом подлежащего (например, «дверь»).
  naturalness: Фраза звучит как современное литературное русское афористическое высказывание. Повтор «кто…» и точка с запятой хорошо сохраняют ритм и параллелизм оригинала. Несколько эллиптическое «будет открыто» уместно, поскольку намеренно сохраняет невыраженный объект греческого текста.
  terminology: Слова «просит», «получает», «ищет», «находит» и «стучит» точны, общеупотребительны и не вносят конфессиональных толкований. «Всякий» естественно выражает дистрибутивную всеобщность.
