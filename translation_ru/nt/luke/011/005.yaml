    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Предположим, у кого-нибудь из вас
  rationale: Греческое выражение вводит риторический вопрос-ситуацию. Такая формулировка естественно передаёт его в современном русском и подготавливает продолжение притчи, не превращая вопрос в утверждение.
- source_word: ἕξει
  choice: есть
  rationale: Формально это будущее время, однако в риторической постановке гипотетической ситуации русский язык естественно употребляет настоящее; временная особенность оригинала отмечена в сноске.
- source_word: φίλον / Φίλε
  choice: друг / Друг
  rationale: 'Сохраняется повтор одного и того же греческого слова: сначала как обозначения отношений, затем как обращения.'
- source_word: πορεύσεται πρὸς αὐτόν
  choice: пойдёт к нему
  rationale: Прямое и естественное обозначение движения без добавочных оттенков.
- source_word: μεσονυκτίου
  choice: в полночь
  rationale: Родительный падеж употреблён обстоятельственно и обозначает время; «в полночь» — точный современный эквивалент.
- source_word: εἴπῃ αὐτῷ
  choice: скажет
  rationale: Передаёт значение λέγω и согласуется с русской конструкцией гипотетической ситуации.
- source_word: χρῆσόν μοι
  choice: одолжи мне
  rationale: Глагол означает дать во временное пользование. «Одолжи» естественно передаёт просьбу о временной помощи; «дай взаймы» здесь звучало бы тяжелее.
- source_word: τρεῖς ἄρτους
  choice: три хлеба
  rationale: ἄρτος обозначает отдельный хлеб или каравай. Русское счётное «три хлеба» сохраняет предметность оригинала лучше, чем «три куска хлеба».
