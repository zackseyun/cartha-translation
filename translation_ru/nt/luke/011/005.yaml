  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: ru
  text: 'И Он сказал им[a]: «Предположим, у кого-нибудь из вас есть друг, и он пойдёт к нему в полночь и скажет: „Друг, одолжи мне три хлеба“».'
