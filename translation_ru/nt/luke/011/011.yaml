  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Кого из вас, отцов
  rationale: Передаёт обращённый к слушателям риторический вопрос и сохраняет слово «отцов», при этом звучит естественно по-русски.
- source_word: αἰτήσει
  choice: попросит
  rationale: Будущее время греческого глагола сохранено; управление родительным падежом естественно выражает просьбу дать что-либо.
- source_word: ὁ υἱὸς
  choice: сын
  rationale: В контексте ясно обозначено отношение сына к названному отцу, поэтому притяжательное местоимение в русском не требуется.
- source_word: ἰχθύν / ἰχθύος
  choice: рыбы / вместо рыбы
  rationale: Сохраняется конкретный образ пищи и повтор слова в конструкции замещения; русский родительный падеж после «попросит» и «вместо» не маркирует число, но контекст передан без потери смысла.
- source_word: ἀντὶ
  choice: вместо
  rationale: Точно и естественно передаёт значение замены одного предмета другим.
- source_word: ὄφιν
  choice: змею
  rationale: Обычное современное соответствие ὄφις; оно сохраняет конкретный образ и не усиливает символические оттенки.
- source_word: αὐτῷ ἐπιδώσει
  choice: даст ему
  rationale: Естественно передаёт значение вручения или передачи и сохраняет адресата действия.
