  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: ru
  text: Горе вам, потому что вы строите гробницы[a] пророков, а ваши отцы[b] убили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надгробные памятники». Греческое слово может обозначать как гробницу, так и памятник на могиле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Горе вам
  rationale: Устоявшаяся в русском библейском языке формула пророческого обличения, сохраняющая силу предупреждения о суде и прямое обращение.
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт причинное значение союза ясно и естественно для современного русского языка.
- source_word: οἰκοδομεῖτε
  choice: вы строите
  rationale: Настоящее время передано без излишнего уточнения вида действия; формулировка обозначает нынешнюю или характерную практику.
- source_word: τὰ μνημεῖα
  choice: гробницы
  rationale: В данном погребальном контексте слово обозначает гробницы или надгробные памятники; «гробницы» — наиболее ясный основной эквивалент.
- source_word: τῶν προφητῶν
  choice: пророков
  rationale: Родительный падеж естественно передаёт принадлежность или связь гробниц с пророками.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: а ваши отцы
  rationale: «А» сохраняет сопоставление двух действий, не усиливая δέ до резко выраженного противопоставления; «отцы» непосредственно передаёт родовой образ исходного текста.
- source_word: ἀπέκτειναν αὐτούς
  choice: убили их
  rationale: Прямо и без добавочной юридической квалификации передаёт убийство пророков и местоименную отсылку к ним.
theological_decisions:
- issue: Следует ли явно пояснять лицемерие или соучастие адресатов в поступках предков
  choice: 'Сохранить краткое сопоставление: адресаты строят гробницы, а их отцы убили пророков.'
  alternative: Передать как «вы строите гробницы пророков, которых убили ваши отцы» или добавить вывод о свидетельстве против отцов.
  rationale: Сам стих сополагает два действия, тогда как их смысл и вывод развиваются далее. Перевод не должен преждевременно разъяснять подразумеваемое обвинение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и пророческой силы высказывания. Формула «Горе вам» намеренно сохраняет узнаваемый библейский регистр; остальная синтаксическая конструкция проста и понятна современному читателю.
