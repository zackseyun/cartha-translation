source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: ru
  text: Когда сильный человек, во всеоружии, охраняет свой двор[a], его имущество в безопасности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «свою усадьбу» или «свой дом»: греческое слово может обозначать двор, а также дом или усадьбу с прилегающим двором.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в мире (покое)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Когда
  rationale: Естественно вводит обобщённую условно-временную ситуацию; возможное «всякий раз, когда» здесь излишне тяжеловесно.
- source_word: ὁ ἰσχυρός
  choice: сильный человек
  rationale: Субстантивированное прилагательное обозначает сильного человека и сохраняет мужской род единственного числа, не раскрывая метафору раньше контекста.
- source_word: καθωπλισμένος
  choice: вооружённый до зубов
  rationale: Перфектное причастие обозначает состояние полной вооружённости; устойчивое современное выражение ясно передаёт интенсивность приставки κατά-.
- source_word: φυλάσσῃ
  choice: охраняет
  rationale: Передаёт продолжающееся действие по защите и наблюдению без смыслового расширения.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: свой двор
  rationale: αὐλή прежде всего может обозначать двор или огороженное пространство при доме; «свой» естественно передаёт ἑαυτοῦ.
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: в безопасности
  rationale: В данном контексте идиома буквально «находится в мире/покое» говорит о сохранности и ненарушенном состоянии имущества; естественный русский требует смысловой передачи.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: его имущество
  rationale: Нейтрально и широко обозначает всё принадлежащее ему; собирательное единственное число естественно по-русски.
theological_decisions:
- issue: Метафорический смысл сильного человека
  choice: Сохранить образ сильного человека без прямого отождествления с сатаной
  alternative: Назвать сильного человека сатаной непосредственно в стихе
  rationale: Сам стих излагает образ, а его референт определяется окружающим контекстом; эксплицирование устранило бы намеренную образность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «Вооружённый до зубов» — общеупотребительное, образное, но не просторечное выражение. Синтаксис сохраняет условно-временную структуру греческого текста.
