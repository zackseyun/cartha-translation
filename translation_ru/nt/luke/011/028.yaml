  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: ru
  text: 'Он же сказал: «Вернее[a], блаженны те, кто слышит слово Божье и соблюдает его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да, но блаженны…»; возможно также: «Поистине блаженны…». Греческая частица может подтверждать сказанное и одновременно переносить акцент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Вернее
  rationale: Частица подтверждает сказанное, но одновременно переносит акцент на более глубокое основание блаженства. «Вернее» естественно передаёт это уточняющее перенаправление, не превращая ответ в резкое отрицание.
- source_word: μακάριοι
  choice: блаженны
  rationale: «Блаженны» сохраняет богословскую насыщенность слова и устойчивую форму изречений Иисуса; «счастливы» звучало бы преимущественно как описание субъективного состояния, а «удачливы» — как указание на обстоятельства.
- source_word: οἱ ἀκούοντες
  choice: те, кто слышит
  rationale: Субстантивированное причастие обозначает людей, для которых слушание Божьего слова является характерным действием. Русская конструкция естественна и не сужает смысл до простого физического восприятия звука.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Выражение сохраняет широкий смысл Божьей речи, вести и откровения, а также привычное библейское звучание; «весть Бога» неоправданно сузила бы значение λόγος.
- source_word: φυλάσσοντες
  choice: соблюдает его
  rationale: В данном контексте φυλάσσω означает не только хранить услышанное, но и следовать ему. «Соблюдает» передаёт деятельную верность слову, не сводя её лишь к охране или запоминанию.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Он же сказал
  rationale: Частица δέ слегка противопоставляет ответ предшествующему возгласу. Конструкция «Он же сказал» сохраняет переход и контраст без излишней резкости.
theological_decisions:
- issue: Характер ответа Иисуса на слова женщины о блаженстве его матери
  choice: Иисус переносит акцент с родственной связи на блаженство тех, кто слышит и соблюдает Божье слово, не отрицая прямо предшествующее высказывание.
  alternative: Понять ответ либо как полное отрицание слов женщины, либо как простое добавление ещё одного блаженства без какого-либо уточнения.
  rationale: Частица μενοῦν допускает одновременно подтверждающий и корректирующий оттенки. «Вернее» сохраняет это напряжение и не решает неоднозначность в пользу одной крайней трактовки.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и общепонятным синтаксисом. Местоимение «Он» в начале предложения написано с прописной буквы по обычному правилу, а не как конфессиональное обозначение почтения.
