  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: ru
  text: Неразумные! Разве тот, кто создал внешнее, не создал и внутреннее?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наружное… внутреннее». Эти слова могут относиться как к наружной и внутренней сторонам сосуда в ближайшем контексте, так и, в более широком смысле, к внешней и внутренней жизни человека.'
    reason: Лексическая альтернатива и сохранение смысловой многозначности.
lexical_decisions:
- source_word: ἄφρονες
  choice: Безрассудные!
  rationale: Субстантивированное прилагательное во множественном числе служит прямым резким обличением. «Безрассудные» передаёт недостаток разумения, не добавляя оттенка бранного слова.
- source_word: οὐχ ... ἐποίησεν;
  choice: Разве ... не сотворил?
  rationale: Отрицательный риторический вопрос предполагает утвердительный ответ; конструкция «разве ... не» естественно передаёт это ожидание по-русски.
- source_word: ὁ ποιήσας
  choice: Тот, Кто сотворил
  rationale: Субстантивированное причастие обозначает деятеля. Формулировка сохраняет не названную прямо отсылку к Богу, не вставляя слово «Бог» в основной текст.
- source_word: τὸ ἔξωθεν
  choice: внешнее
  rationale: Нейтральное субстантивированное обозначение внешней стороны сохраняет применимость и к сосуду из ближайшего контекста, и к внешней стороне человеческой жизни.
- source_word: τὸ ἔσωθεν
  choice: внутреннее
  rationale: Параллельное субстантивированное обозначение внутренней стороны сохраняет предметный и нравственно-духовный уровни смысла.
- source_word: καὶ
  choice: и
  rationale: В конструкции «не сотворил и внутреннее» частица естественно передаёт присоединительное значение «также» и подчёркивает единство Творца внешнего и внутреннего.
theological_decisions:
- issue: Кого обозначает «Тот, Кто сотворил»
  choice: Неявная отсылка к Богу как Творцу сохранена без поясняющей вставки имени Бога.
  alternative: Понимать выражение лишь как указание на изготовителя чаши или блюда.
  rationale: Высказывание связано с образом сосуда, но одновременно допускает более широкую отсылку к Творцу внешней и внутренней сторон человека. Перевод сохраняет оба смысловых уровня.
- issue: Объём значений «внешнего» и «внутреннего»
  choice: Сохранены широкие субстантивированные определения «внешнее» и «внутреннее».
  alternative: 'Уточнить в основном тексте: «внешнюю сторону чаши» и «её внутреннюю сторону» либо «внешность» и «душу».'
  rationale: Греческий текст не называет предмет и тем самым удерживает связь как с чашей и блюдом в контексте, так и с внешней и внутренней жизнью человека; уточнение сузило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткое и резкое обращение сочетается с возвышенным, но понятным обозначением Творца. Заглавные буквы в «Тот, Кто» помогают распознать неявную отсылку к Богу, не добавляя Его имени в текст.
