  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: ru
  text: Но если и Сатана разделился против самого себя, как устоит его царство? Ведь вы говорите, что Я изгоняю бесов силой Веельзевула[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. Веельзевул; в некоторых традициях — Веельзевуб.
    reason: alternative_reading
lexical_decisions:
- source_word: Σατανᾶς
  choice: сатана
  rationale: Устоявшаяся русская передача личного имени/титула; строчная буква соответствует принятой в современном русском библейском употреблении возможности обозначать противника как сатану.
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: разделился сам против себя
  rationale: Сохраняет образ внутреннего разделения и значение направленности против самого себя; аорист передан прошедшим временем в условной посылке.
- source_word: πῶς σταθήσεται ἡ βασιλεία αὐτοῦ
  choice: как устоит его царство?
  rationale: «Устоит» естественно сохраняет метафору стойкости и будущую форму; «царство» передаёт βασιλεία без сужения до одного лишь правления.
- source_word: ὅτι λέγετε
  choice: Ведь вы говорите
  rationale: «Ведь» естественно вводит основание риторического довода, сохраняя пояснительно-причинную силу ὅτι.
- source_word: ἐν Βεελζεβοὺλ
  choice: силой Веельзевула
  rationale: В данном контексте ἐν выражает средство или действующую силу. Такая передача ясна по-русски и раскрывает подразумеваемую инструментальность без дальнейшего богословского толкования.
- source_word: ἐκβάλλειν ... τὰ δαιμόνια
  choice: изгоняю бесов
  rationale: Устоявшееся, точное и понятное обозначение изгнания демонов в русском библейском языке.
- source_word: Βεελζεβοὺλ
  choice: Веельзевул
  rationale: Передаёт греческую форму Βεελζεβούλ; привычная альтернативная форма «Веельзевуб» отмечена в сноске.
theological_decisions:
- issue: Характер обвинения противников Иисуса
  choice: Обвинение передано как утверждение, что Иисус изгоняет бесов силой Веельзевула.
  alternative: «в Веельзевуле» или «с помощью Веельзевула»
  rationale: Контекстуальное инструментальное значение ἐν выражено естественно по-русски, но текст не расширен объяснением характера этой силы или связи.
translation_notes:
  register: Современный литературный русский язык с достоинством и сохранением библейской образности. «Устоит его царство» передаёт краткость и риторическую силу оригинала; местоимение «Я» написано с прописной буквы по устойчивой русской издательской традиции.
