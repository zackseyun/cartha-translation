id: LUK.11.52
reference: Luke 11:52
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: ru
  text: 'Горе вам, знатокам Закона[a]: вы забрали ключ к знанию[b]. Сами вы не вошли и помешали тем, кто входил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть специалистам по Закону Моисея, а не юристам в современном смысле.
    reason: lexical_clarification
  - marker: b
    text: 'Буквально: «ключ знания».'
    reason: literal_rendering
lexical_decisions:
- source_word: οὐαί
  choice: Горе вам
  rationale: Сохраняет силу пророческого обличения, а не просто выражает сожаление.
- source_word: νομικοῖς
  choice: знатокам Закона
  rationale: Обозначает специалистов по иудейскому Закону, а не современных юристов; прописная буква указывает на Закон Моисея.
- source_word: ἤρατε
  choice: забрали
  rationale: Передаёт здесь значение удаления и лишения доступа, сохраняя образ ключа.
- source_word: κλεῖδα τῆς γνώσεως
  choice: ключ к знанию
  rationale: Естественно передаёт по-русски генитивную конструкцию и метафору доступа к знанию, не уточняя его содержание сверх текста.
- source_word: αὐτοὶ
  choice: Сами вы
  rationale: Сохраняет эмфатическое противопоставление между адресатами и теми, кому они препятствовали.
- source_word: οὐκ εἰσήλθατε
  choice: не вошли
  rationale: Сохраняет метафору входа и не добавляет отсутствующий в греческом тексте объект.
- source_word: τοὺς εἰσερχομένους
  choice: тем, кто входил
  rationale: Передаёт продолжающееся действие причастия, не добавляя значения попытки.
- source_word: ἐκωλύσατε
  choice: помешали
  rationale: Выражает создание препятствия, не утверждая сильнее исходного текста, что вход был окончательно предотвращён.
theological_decisions:
- issue: К чему относятся «войти» и «ключ к знанию»
  choice: Образ доступа и входа сохранён без указания объекта входа.
  alternative: Уточнить как вхождение в Царство Божье либо в истинное познание Бога.
  rationale: Греческий текст прямо не называет, куда входят. Неуточнённая метафора сохраняет смысловую открытость и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык; тон торжественный и обличительный, но понятный широкому читателю. «Закон» написан с прописной буквы как обозначение Закона Моисея.
