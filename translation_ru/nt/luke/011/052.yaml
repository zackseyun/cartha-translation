  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: обличительное «Горе вам», адресатов как специалистов по Закону, устранение «ключа к знанию», эмфатическое «сами вы», а также сохранённый без поясняющих добавлений образ входа и препятствования входящим. «Помешали» удачно передаёт ἐκωλύσατε, не усиливая его до безусловного «не дали войти».'
  naturalness: Современный литературный русский звучит естественно и сохраняет торжественно-обличительный регистр. «Знатокам Закона» ясно в сочетании с примечанием; «ключ к знанию» — нормативная и понятная русская передача образа.
  terminology: «Закон» с прописной буквы и примечание к «знатокам Закона» корректно обозначают иудейский/Моисеев Закон, не вызывая ассоциации с современными адвокатами. Образные выражения не получают конфессионально ограниченного истолкования. В отличие от английского аудиторского следа, где примечание b по содержанию, по-видимому, привязано не к тому месту, русский текст правильно ставит примечание b после «знанию».
