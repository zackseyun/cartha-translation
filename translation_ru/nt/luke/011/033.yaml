source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: ru
  text: Никто, зажёгши светильник, не ставит его в скрытое место[a] или под мерный сосуд[b], а ставит на подставку для светильника, чтобы те, кто входит, видели свет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в погреб» либо «в тайник»; греческое слово может обозначать скрытое место, в том числе подземное помещение для хранения.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое слово обозначает меру сыпучих продуктов, а также сосуд такой вместимости; традиционно: «под сосуд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνον
  choice: светильник
  rationale: Речь идёт о переносном масляном светильнике, а не о свече; «светильник» точно и естественно передаёт предмет.
- source_word: ἅψας
  choice: зажёгши
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: сначала светильник зажигают, затем ставят.'
- source_word: εἰς κρύπτην
  choice: в укромное место
  rationale: κρύπτη может обозначать скрытое место, тайник или подземное помещение. Обобщённая формулировка сохраняет основной образ — светильник не прячут — и не уточняет архитектуру без необходимости.
- source_word: ὑπὸ τὸν μόδιον
  choice: под мерный сосуд
  rationale: μόδιος — мера сыпучих продуктов и одновременно сосуд такой вместимости. «Мерный сосуд» сохраняет эту особенность точнее, чем просто «корзина».
- source_word: ἐπὶ τὴν λυχνίαν
  choice: на подставку
  rationale: λυχνία — подставка для светильника. После упоминания светильника краткое «подставка» понятно и не создаёт тяжёлого повтора.
- source_word: οἱ εἰσπορευόμενοι
  choice: те, кто входит
  rationale: Субстантивированное причастие передано естественной современной русской конструкцией.
- source_word: τὸ φέγγος
  choice: свет
  rationale: В контексте зажжённого светильника φέγγος естественно означает видимый свет, сияние.
- source_word: βλέπωσιν
  choice: видели
  rationale: Сослагательное наклонение после ἵνα выражает цель; по-русски она естественно передаётся союзом «чтобы» и формой прошедшего времени.
theological_decisions:
- issue: Степень конкретизации κρύπτη
  choice: укромное место
  alternative: погреб; тайник; скрытое место
  rationale: Точный вид помещения несущественен для изречения, а значение слова допускает несколько вариантов. Общая формулировка сохраняет образ сокрытия света и исходную неопределённость.
- issue: Предмет, обозначенный μόδιος
  choice: мерный сосуд
  alternative: корзина; мера; сосуд вместимостью в модий
  rationale: Перевод сохраняет как функцию ёмкости, которой можно накрыть светильник, так и её связь с мерой объёма, не подменяя античную меру русской или английской.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Сохранена краткость афористического образа; причастие «зажёгши» допустимо в литературной речи и точно передаёт последовательность действий. Повтор глагола «ставит» во второй части делает противопоставление естественным и недвусмысленным.
