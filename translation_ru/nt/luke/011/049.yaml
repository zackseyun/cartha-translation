  choice: Выражение сохранено без прямого отождествления с Иисусом, Писанием или отдельной ипостасью.
  alternative: Олицетворённая божественная мудрость; мудрое Божье установление; косвенное самообозначение Иисуса.
  rationale: Греческая формулировка допускает несколько толкований. Прозрачный перевод сохраняет эту богословскую неоднозначность и не навязывает частного прочтения.
