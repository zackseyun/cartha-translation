- source_word: ἀποκτενοῦσιν
  choice: они убьют
  rationale: Прямая и современная передача будущего времени.
- source_word: διώξουσιν
  choice: будут преследовать
  rationale: В данном враждебном контексте передаёт значение гонения; аналитическое будущее звучит естественно по-русски.
theological_decisions:
