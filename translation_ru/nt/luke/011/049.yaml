- source_word: Ἀποστελῶ
  choice: Я пошлю
  rationale: Точно передаёт форму будущего времени и направленность действия.
- source_word: εἰς αὐτούς
  choice: к ним
  rationale: При глаголе посылания естественно выражает движение к адресатам.
- source_word: προφήτας
  choice: пророков
