  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ru
  text: Кто не со Мной, тот против Меня, и кто не собирает со Мной, тот рассеивает.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: кто не… тот
  rationale: Субстантивированное причастие обозначает любого человека, характеризуемого отсутствием единства с Иисусом. Русская соотносительная конструкция «кто… тот» естественно и точно передаёт обобщённое значение.
- source_word: μετ’ ἐμοῦ
  choice: со Мной
  rationale: μετά с родительным падежом выражает совместность и принадлежность к стороне Иисуса; «со Мной» сохраняет прямоту и личный характер высказывания.
- source_word: κατ’ ἐμοῦ
  choice: против Меня
  rationale: κατά с родительным здесь обозначает противостояние. «Против Меня» ясно сохраняет антитезу «со Мной — против Меня».
- source_word: συνάγων
  choice: собирает
  rationale: Глагол означает собирать воедино. «Собирает» сохраняет метафору и образует точную смысловую пару с «расточает».
- source_word: σκορπίζει
  choice: расточает
  rationale: Глагол означает разбрасывать, рассеивать. «Расточает» — понятное в данном афористическом контексте переходное употребление, сохраняющее подразумеваемый объект и традиционную выразительность противопоставления.
- source_word: καὶ
  choice: и
  rationale: Союз прямо соединяет две параллельные части изречения; русское «и» сохраняет их координацию.
theological_decisions:
- issue: Категоричность слов Иисуса о нейтралитете по отношению к Нему
  choice: 'Сохранено безусловное противопоставление: не быть с Иисусом означает быть против Него.'
  alternative: Смягчить смысл до простого отсутствия поддержки либо ограничить утверждение только ситуацией изгнания бесов.
  rationale: Греческая формулировка имеет абсолютный характер. Перевод сохраняет её напряжённость, не добавляя позднейших догматических уточнений и не сужая её явно выраженный смысл.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом. Заглавные буквы в местоимениях «Мной/Меня» применены как принятая в русском библейском издании форма почтительного обращения к Иисусу. Конструкция «кто… тот» звучит естественнее буквального «тот, кто» и не меняет обобщённого единственного значения.
