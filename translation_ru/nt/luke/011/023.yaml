  source_fidelity: 'Первая часть точно передаёт обобщённый субстантивированный оборот ὁ μὴ ὢν и антитезу «со Мной — против Меня». Во второй части «собирает со Мной» верно отражает συνάγων μετ’ ἐμοῦ. Однако «расточает» не является точным современным эквивалентом σκορπίζει: обычно оно означает «тратит/проматывает», а не «рассеивает, разгоняет».'
  naturalness: Конструкция «Кто не со Мной, тот против Меня» естественна, афористична и соответствует современному литературному библейскому регистру. Замена «расточает» на «рассеивает» устраняет архаически окрашенное и потенциально неверно понимаемое слово, сохраняя краткость параллелизма.
  terminology: Личные местоимения с прописной буквы последовательно оформлены в принятом для данного издания почтительном стиле. «Со Мной», «против Меня» и «собирает» точны. «Рассеивает» передаёт σκορπίζει и ясно противопоставлено «собирает», не вводя дополнительного объекта или толкования.
