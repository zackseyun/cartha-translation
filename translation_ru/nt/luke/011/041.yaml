  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: ru
  text: Но отдайте то, что внутри, в качестве милостыни[a], и вот, всё для вас чисто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что у вас есть, отдайте в качестве милостыни». Греческое выражение может обозначать как то, что находится внутри, так и имущество, имеющееся у человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт корректирующее противопоставление внешнему очищению, о котором говорится перед этим.
- source_word: τὰ ἐνόντα
  choice: то, что внутри
  rationale: Сохраняет буквальный и контекстуально мотивированный внутренний смысл выражения, связанный с противопоставлением внешней и внутренней стороны чаши; неоднозначность отмечена в сноске.
- source_word: δότε
  choice: отдавайте
  rationale: Естественно сочетается по-русски с «как милостыню» и передаёт побуждение к действию, не привнося дополнительного объекта.
- source_word: ἐλεημοσύνην
  choice: как милостыню
  rationale: Передаёт значение благотворительного подаяния и сохраняет греческую конструкцию «дать как милостыню».
- source_word: καὶ ἰδοὺ
  choice: и вот
  rationale: Сохраняет усиленное указание на последующий результат и звучит естественно в современном литературном русском.
- source_word: πάντα
  choice: всё
  rationale: Естественный русский способ передать всеохватное значение среднего рода множественного числа.
- source_word: καθαρὰ
  choice: чисто
  rationale: Сохраняет связь со спором об очищении и ритуальной чистоте в ближайшем контексте.
- source_word: ὑμῖν
  choice: для вас
  rationale: 'Передаёт дательный отношения: всё является чистым применительно к адресатам.'
theological_decisions:
- issue: Толкование τὰ ἐνόντα в связи с чистотой и милостыней
  choice: «то, что внутри» — внутренний, нравственный смысл
  alternative: «то, что у вас есть» — имеющееся имущество
  rationale: Ближайший контекст противопоставляет внешнюю и внутреннюю стороны чаши и блюда (Лк 11:39), поэтому основной текст сохраняет внутренний смысл обличения. Вместе с тем греческое выражение допускает понимание имеющегося имущества, и этот вариант вынесен в сноску, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «и вот». Формулировка сохраняет сжатость и синтаксическую напряжённость оригинала; маркер [a] помещён непосредственно после спорного выражения.
