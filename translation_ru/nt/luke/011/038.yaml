  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: ru
  text: Но фарисей, увидев это, удивился, что Иисус не совершил омовения[a] перед едой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не омылся». Греческий глагол часто употребляется в значении «крестить», но здесь он относится к ритуальному омовению по фарисейским правилам чистоты.'
    reason: Лексическая альтернатива и пояснение контекстуального значения.
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое повествовательное противопоставление реакции фарисея предшествующему действию Иисуса.
- source_word: Φαρισαῖος
  choice: фарисей
  rationale: Обычное современное обозначение представителя фарисейского движения; определённость выражается контекстом.
- source_word: ἰδὼν
  choice: увидев это
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство аористного причастия; «это» восполняет подразумеваемый объект из контекста.
- source_word: ἐθαύμασεν
  choice: удивился
  rationale: Передаёт неожиданную реакцию фарисея без архаичности и без чрезмерного усиления оттенка неодобрения.
- source_word: οὐ πρῶτον
  choice: не совершил ... перед
  rationale: Отрицание и временная последовательность естественно выражены сочетанием глагола с «перед едой»; значение πρῶτον в русском контексте уже содержится в предлоге «перед».
- source_word: ἐβαπτίσθη
  choice: не совершил омовения
  rationale: В контексте фарисейских правил чистоты глагол обозначает ритуальное омовение, а не христианское крещение; формулировка сохраняет ритуальный оттенок.
- source_word: πρὸ τοῦ ἀρίστου
  choice: перед едой
  rationale: Не уточняет без необходимости, была ли это утренняя или дневная трапеза, и звучит естественно по-русски.
theological_decisions:
- issue: Значение ἐβαπτίσθη в контексте трапезы у фарисея
  choice: ритуальное омовение перед едой
  alternative: крестился; погрузился в воду; просто вымыл руки
  rationale: Контекст связан с фарисейскими обычаями ритуальной чистоты, а не с христианским крещением. «Совершил омовение» не ограничивает действие прямо одними руками и не навязывает конкретный способ омовения.
- issue: Неявное подлежащее при ἐβαπτίσθη
  choice: Иисус
  alternative: он
  rationale: Греческий текст подразумевает Иисуса как того, кто не совершил омовения. Явное имя устраняет возможную русскую двусмысленность, будто речь идёт о самом фарисее.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Совершил омовение» сохраняет религиозно-обрядовый характер действия, а «перед едой» остаётся понятным обычному читателю.
