  source_fidelity: 'Текст точно передаёт греческий оригинал: δέ естественно выражено через «но», ἰδών — через «увидев это», а ἐθαύμασεν — через «удивился». «Иисус» правомерно восполняет подразумеваемое подлежащее из ближайшего контекста и устраняет неестественную для русского двусмысленность. «Не совершил омовения перед едой» адекватно передаёт οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου, не сужая омовение до мытья рук и не вводя идею христианского крещения.'
