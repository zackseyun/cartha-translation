base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: ru
  text: 'Но Он, зная их мысли, сказал им: «Всякое царство, разделившееся само против себя, опустошается, и один дом рушится на другой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одна семья рушится на другую». Греческое слово οἶκος может означать как дом-здание, так и семью или домочадцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Передаёт когнитивное значение причастия и естественно связывается с основным глаголом «сказал».
- source_word: διανοήματα
  choice: помыслы
  rationale: Обозначает внутренние мысли и рассуждения; «помыслы» сохраняет ёмкость греческого слова, не уточняя намерения сверх текста.
- source_word: Πᾶσα βασιλεία
  choice: всякое царство
  rationale: Сохраняет обобщающий и дистрибутивный характер изречения.
- source_word: ἐφ’ ἑαυτὴν
  choice: само против себя
  rationale: Передаёт внутреннее противостояние и согласуется с русским средним родом слова «царство».
- source_word: διαμερισθεῖσα
  choice: разделившееся
  rationale: Естественно выражает внутренний раскол, сохраняя причастную конструкцию оригинала.
- source_word: ἐρημοῦται
  choice: разоряется
  rationale: Передаёт настоящее время и значение опустошения или доведения до разорения без сведения образа лишь к физическому падению.
- source_word: οἶκος ἐπὶ οἶκον
  choice: дом рушится на дом
  rationale: Сохраняет сжатый и неоднозначный образ греческого текста; предлог «на» передаёт ἐπί с винительным падежом, а «рушится» делает сочетание понятным по-русски.
- source_word: πίπτει
  choice: рушится
  rationale: В контексте дома естественнее русского буквального «падает» и сохраняет образ обрушения.
theological_decisions:
- issue: Значение οἶκος во второй части изречения
  choice: В основном тексте — «дом»
  alternative: «домочадцы», «семья» или «один дом восстаёт против другого»
  rationale: οἶκος может обозначать как строение, так и семью или домочадцев. Основной текст сохраняет конкретный образ и подлинную неоднозначность, а социальное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского изречения. Заглавное «Он» употреблено как уважительное местоимение по отношению к Иисусу. Сжатость заключительной греческой фразы сохранена, а её неоднозначность пояснена в сноске.
