revisions:
- from: 'Но Он, зная их помыслы, сказал им: «Всякое царство, разделившееся само против себя, разоряется, и дом рушится на дом[a]».'
  to: 'Но Он, зная их мысли, сказал им: «Всякое царство, разделившееся само против себя, опустошается, и один дом рушится на другой[a]».'
  rationale: Исправлена сноска, чтобы она сохраняла образ πίπτει («рушится, падает»), а не вносила значение «восстаёт». «Опустошается» точнее передаёт ἐρημοῦται, а «мысли» — нейтральное значение διανοήματα. Добавление «один ... на другой» необходимо для естественного русского оформления сжатой греческой конструкции и не снимает неоднозначность οἶκος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:18:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Иисус знает их внутренние мысли и формулирует общее правило о саморазрушительном внутреннем разделении. Однако «разоряется» может в современном русском прежде всего означать имущественное разорение и слабее передаёт ἐρημοῦται («опустошается, приходит в запустение»). Сноска предлагает «восстаёт против», чего в πίπτει («падает, рушится») нет.'
  naturalness: «Дом рушится на дом» намеренно сохраняет сжатость оригинала, но по-русски несколько шероховато. «Один дом рушится на другой» делает образ понятным, не добавляя содержательного толкования. «Мысли» нейтральнее и современнее, чем «помыслы», которые могут придавать фразе не выраженный в греческом морально-религиозный оттенок.
  terminology: «Царство» и «дом» уместны. Заглавное «Он» соответствует выбранному уважительному оформлению. Лексическую неоднозначность οἶκος следует отмечать без замены глагола «рушится/падает» на «восстаёт».
  issues:
