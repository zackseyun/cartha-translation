  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: ru
  text: 'а тот изнутри скажет в ответ: «Не беспокой меня.[a] Дверь уже закрыта,[b] и дети мои со мной в постели.[c] Не могу я встать и дать тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не доставляй мне хлопот»; «Не надоедай мне». Греческое выражение буквально говорит о причинении хлопот.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Дверь уже закрыли». Греческая форма может подчёркивать как совершившееся действие, так и его нынешний результат.'
    reason: lexical_alternative
  - marker: c
    text: Речь идёт об общем месте для сна в доме, а не о супружеской близости.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: а тот изнутри скажет в ответ
  rationale: Сохраняет указание на второго участника, пространственный контраст и условно-повествовательную форму εἴπῃ; русское «скажет в ответ» естественно передаёт сочетание ἀποκριθεὶς εἴπῃ без тяжеловесного удвоения.
- source_word: Μή μοι κόπους πάρεχε
  choice: Не беспокой меня
  rationale: Естественная русская передача идиомы «доставлять хлопоты/неприятности», уместная в прямой речи и не чрезмерно разговорная.
- source_word: ἡ θύρα κέκλεισται
  choice: Дверь уже закрыта
  rationale: Передаёт результирующее состояние греческого перфекта, не добавляя отсутствующего в тексте значения «заперта на замок».
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: дети мои со мной на постели
  rationale: Передаёт совместное нахождение на общем месте для сна; «на постели» звучит естественно и не вносит интимного смысла.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Не могу я встать и дать тебе
  rationale: Сохраняет отсутствие выраженного дополнения у δοῦναί и передаёт причастие ἀναστὰς как предшествующее необходимое действие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством устной притчевой речи. Порядок «дети мои» и «Не могу я» слегка подчёркнут, но остаётся естественным. Неявное дополнение после «дать тебе» намеренно не восполнено, поскольку оно отсутствует в греческом тексте и восстанавливается из контекста.
