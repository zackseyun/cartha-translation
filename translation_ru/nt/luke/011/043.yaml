  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: ru
  text: Горе вам, фарисеи, потому что вы любите почётные места[a] в синагогах и приветствия[b] на площадях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первые места»; то есть места особого почёта.'
    reason: lexical_alternative
  - marker: b
    text: То есть публичные приветствия, выражавшие уважение и признание общественного положения.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: Горе
  rationale: Сохраняет силу пророческого обличения, выраженную междометием οὐαί, и естественно звучит в библейском русском языке.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: вам, фарисеи
  rationale: Передаёт прямое обращение с нормативной русской пунктуацией.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит причину провозглашённого горя.
- source_word: ἀγαπᾶτε
  choice: вы любите
  rationale: Прямо передаёт сильную привязанность и стремление к общественному почёту, не добавляя толкования.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: почётные места
  rationale: В данном контексте слово обозначает места первенства и особого статуса; этот вариант естественнее современного русского «первые кресла» и точнее раскрывает социальную функцию мест.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: в синагогах
  rationale: Стандартная и естественная передача места действия.
- source_word: τοὺς ἀσπασμοὺς
  choice: почтительные приветствия
  rationale: Существительное обозначает публичные приветствия; определение «почтительные» кратко передаёт подразумеваемое выражение уважения и признания.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: на площадях
  rationale: ἀγοραί были публичными городскими площадями, служившими также местами торговли; «на площадях» естественно передаёт общественный характер сцены.
theological_decisions:
- issue: Характер слов Иисуса
  choice: Пророческое провозглашение горя за любовь к общественному почёту
  alternative: Только социальная критика дурных манер
  rationale: οὐαί и последующее указание причины придают словам нравственно-духовную обличительную силу; перевод сохраняет её без дополнительного доктринального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис близок к греческому, но естественен по-русски; культурные оттенки кратко пояснены в сносках.
