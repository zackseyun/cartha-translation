lexical_decisions:
- source_word: ἄρτον
  choice: хлеб
  rationale: Сохраняет прямое значение существительного и традиционный конкретный образ основной пищи, не расширяя его в основном тексте до «пищи».
- source_word: ἡμῶν
  choice: наш
  rationale: Естественная передача притяжательного местоимения, относящегося к слову «хлеб».
- source_word: ἐπιούσιον
  choice: насущный
  rationale: Редкое и спорное прилагательное. «Насущный» сохраняет традиционную русскую формулировку и смысл необходимого для жизни хлеба, не исключая значений «на этот/наступающий день»; альтернативы указаны в сноске.
- source_word: δίδου
  choice: давай
  rationale: Настоящее повелительное наклонение может обозначать продолжающееся или повторяющееся действие; несовершенный вид «давай» вместе с «каждый день» передаёт эту регулярность.
- source_word: ἡμῖν
  choice: нам
  rationale: Прямая и естественная передача косвенного дополнения.
- source_word: τὸ καθ’ ἡμέραν
  choice: каждый день
  rationale: Ясно передаёт повторяющееся ежедневное дарование и характерный для Луки акцент на постоянной зависимости.
theological_decisions:
- issue: Значение ἐπιούσιον в молитве Господней
  choice: насущный
  alternative: «на наступающий день», «необходимый», реже — «сверхсущностный»
  rationale: Значение прилагательного остаётся спорным. Выражение τὸ καθ’ ἡμέραν у Луки связывает просьбу с ежедневным обеспечением, однако основной текст не должен полностью устранять лексическую неоднозначность или вводить в него сакраментальное либо метафизическое толкование.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранено традиционное «хлеб наш насущный», но устаревшее «подавай» заменено естественным «давай»; порядок слов следует русской молитвенной традиции и остаётся понятным современному читателю.
