  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: ru
  text: 'Когда Он говорил это, одна женщина из толпы возвысила голос[a] и сказала Ему: «Блаженна утроба, носившая Тебя[b], и груди, которые Ты сосал!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «громко воскликнула». Буквально: «подняла (возвысила) голос».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вынашивавшая Тебя». Греческий глагол означает «нести, носить» и здесь относится к ношению ребёнка во чреве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: Когда Он говорил это
  rationale: Конструкция ἐν τῷ с инфинитивом передаёт одновременное, продолжающееся действие. Начальное Ἐγένετο δὲ служит повествовательным переходом; в современном русском его отдельная передача как «и случилось» была бы тяжеловесной, поэтому переход естественно выражен придаточным времени.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: одна женщина ... возвысила голос
  rationale: Оборот ἐπαίρω φωνήν означает говорить громко, повысить или возвысить голос. «Возвысила голос» сохраняет образ исходного выражения и уместный литературный регистр; τις передано неопределённым «одна».
- source_word: ἐκ τοῦ ὄχλου
  choice: из толпы
  rationale: Естественно передаёт принадлежность женщины к собравшейся толпе и исходящий оттуда голос.
- source_word: Μακαρία
  choice: Блаженна
  rationale: В данном хвалебном восклицании слово обозначает особую благословенность, а не просто субъективное счастье. «Блаженна» сохраняет библейский оттенок без догматического усиления.
- source_word: ἡ κοιλία
  choice: утроба
  rationale: В материнском контексте κοιλία означает утробу, где вынашивают ребёнка. Это точнее и достойнее, чем общее «живот».
- source_word: ἡ βαστάσασά σε
  choice: носившая Тебя
  rationale: Причастие βαστάσασα здесь указывает на материнское ношение ребёнка во чреве. Русское «носившая Тебя» сохраняет этот образ и не сводит значение исключительно к моменту родов.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: груди, которые Ты сосал
  rationale: 'Перевод сохраняет множественное число и грамматическую направленность греческого текста: младенец сосал грудь. Конкретный материнский образ не смягчается и не заменяется отвлечённым выражением.'
theological_decisions:
- issue: Смысл μακαρία в восклицании о матери Иисуса
  choice: «Блаженна утроба, носившая Тебя»
  alternative: «Счастлива утроба…» / «Блаженна женщина, родившая Тебя…»
  rationale: «Блаженна» сохраняет почётную силу высказывания, но перевод не расширяет его до более поздних богословских формулировок. Телесный образ оригинала оставлен без замены прямым обозначением матери, чтобы не ослаблять и не усиливать смысл текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским, но не архаичным регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской издательской традиции. Конкретные материнские образы оригинала сохранены.
