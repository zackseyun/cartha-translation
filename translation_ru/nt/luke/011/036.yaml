  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: ru
  text: Итак, если всё твоё тело светло и в нём нет ни одной тёмной части, то оно будет целиком светлым, подобно тому как светильник озаряет тебя своим сиянием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобно тому как светильник озаряет тебя яркой вспышкой». Греческое слово может означать вспышку, блеск или молнию; здесь, вероятно, имеется в виду сияние светильника, а не буквальная молния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: тело
  rationale: Сохраняет буквальный телесный образ и связь с предшествующим изречением о глазе как светильнике тела, не превращая метафору в толкование о внутреннем состоянии.
- source_word: ὅλον / φωτεινόν
  choice: всё / целиком светло
  rationale: Передаёт повтор и всеохватность выражения; «светло» естественно противопоставлено «тёмной части».
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: нет в нём ни одной тёмной части
  rationale: Естественная русская конструкция сохраняет конкретный образ части тела, остающейся тёмной.
- source_word: λύχνος
  choice: светильник
  rationale: Обозначает конкретный переносной источник света, а не абстрактный свет или подставку.
- source_word: τῇ ἀστραπῇ
  choice: своим сиянием
  rationale: ἀστραπή может означать вспышку, блеск или молнию; при светильнике в роли подлежащего «сиянием» естественно передаёт его яркий свет.
- source_word: φωτίζῃ σε
  choice: озаряет тебя
  rationale: Передаёт значение «освещает, даёт свет» и сохраняет личное дополнение σε; «озаряет» звучит естественно и достойно в данном образном контексте.
theological_decisions:
- issue: Метафорический смысл тела и света
  choice: Сохранить образы тела, света и тьмы без поясняющего пересказа.
  alternative: Передать «тело» как «весь человек», а свет как нравственное или духовное состояние.
  rationale: Текст намеренно продолжает телесно-световой образ предыдущих стихов; конкретизация его как учения о душе или нравственности устранила бы присущую изречению смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксис сделан плавным, но повтор всеохватности и конкретные образы оригинала сохранены.
