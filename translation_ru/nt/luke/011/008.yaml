id: LUK.11.8
reference: Luke 11:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: ru
  text: 'Говорю вам: если он и не встанет и не даст ему потому, что тот его друг, то всё же из-за беззастенчивой настойчивости просителя[a] он встанет и даст ему всё, что нужно просителю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дерзости», «назойливости»; букв. «бесстыдства».'
    reason: Лексема ἀναίδεια допускает оттенки бесстыдства, дерзости и настойчивости; примечание сохраняет широту её значения.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Говорю вам
  rationale: Прямая и естественная для современной русской речи передача вводной формулы Иисуса с сохранением обращения к слушателям.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: если он и не встанет и не даст ему
  rationale: «Если и не» передаёт уступительное значение εἰ καί, не превращая риторическое условие в категорическое утверждение; оба действия выражены естественно для бытовой сцены.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: потому, что тот его друг
  rationale: Сохраняется причинная конструкция и личное отношение φίλον αὐτοῦ; указательное «тот» помогает различить двух участников сцены.
- source_word: διά γε
  choice: то всё же из-за
  rationale: 'Передаёт усиленный уступительно-противительный поворот: дружба сама по себе может не побудить хозяина, но другая причина побудит.'
- source_word: ἀναίδειαν
  choice: беззастенчивой настойчивости
  rationale: Сочетание сохраняет резкий буквальный оттенок отсутствия стыда и одновременно делает ясным контекстуальный смысл упорной, не смущающейся отказом просьбы.
- source_word: ἐγερθεὶς
  choice: он встанет
  rationale: В данной домашней сцене причастие означает, что хозяин поднимется с постели; русское «встанет» звучит естественно и согласуется с предшествующим ἀναστάς.
- source_word: ὅσων χρῄζει
  choice: всё, что ему нужно
  rationale: Передаёт совокупность необходимого и естественно звучит по-русски.
theological_decisions:
- issue: Смысл ἀναίδεια в притче
  choice: Беззастенчивая настойчивость просящего
  alternative: Дерзость, назойливость или буквальное бесстыдство
  rationale: Перевод не превращает слово лишь в положительную «смелость» и не утверждает, будто одобряется грубость как таковая. Он сохраняет напряжение между отрицательным буквальным оттенком слова и контекстом упорной просьбы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет уступительный ход греческой фразы, но остаётся понятным обычному читателю; конфессионально окрашенная терминология не используется.
