  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: ru
  text: Ведь как Иона стал знамением для ниневитян, так и Сын Человеческий будет знамением для этого поколения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так и Сын Человеческий будет для этого поколения»; слово «знамением» подразумевается благодаря параллели с Ионой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Ведь как
  rationale: «Ведь» естественно передаёт пояснительную силу γάρ, а «как» вводит сопоставление, выраженное καθώς.
- source_word: ἐγένετο
  choice: стал
  rationale: 'Передаёт результативный оттенок γίνομαι: Иона стал выполнять роль знамения, а не просто «был» им.'
- source_word: Ἰωνᾶς
  choice: Иона
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: τοῖς Νινευίταις
  choice: для ниневитян
  rationale: Дательный падеж выражает отношение к тем, для кого Иона стал знамением; по-русски «для ниневитян» звучит естественнее, чем «ниневитянам» при данном сказуемом.
- source_word: σημεῖον
  choice: знамением
  rationale: «Знамение» сохраняет раскрывающий, богословски значимый смысл σημεῖον и соответствует библейскому контексту Луки.
- source_word: οὕτως ... καὶ
  choice: так и
  rationale: Естественная русская соотносительная конструкция «как… так и…», точно передающая параллель.
- source_word: ἔσται
  choice: будет
  rationale: Прямо передаёт будущее время εἰμί; подразумеваемое сказуемое «знамением» восстановлено из первой части сравнения.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохраняет традиционное титульное выражение, его буквальную форму и межтекстовый богословский смысл.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: для этого поколения
  rationale: Передаёт дательный отношения; «поколение» сохраняет значение γενεά и его пророческую окраску у Луки.
theological_decisions:
- issue: Подразумеваемое сказуемое во второй части
  choice: 'Повторить «знамением» в основном тексте: «Сын Человеческий будет знамением».'
  alternative: 'Буквально сохранить: «Сын Человеческий будет для этого поколения».'
  rationale: Хотя σημεῖον во второй части по-гречески не повторяется, оно ясно подразумевается параллельной конструкцией. Восстановление слова делает русский текст понятным, а сноска сохраняет формальную особенность оригинала.
- issue: Значение выражения «Сын Человеческий»
  choice: Сохранить традиционный титул «Сын Человеческий» без поясняющего истолкования.
  alternative: «Человек» или «Человеческий Сын».
  rationale: Традиционная форма сохраняет одновременно буквальный, титульный и межтекстовый смысл выражения, не сводя его к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Конструкция «как… так и…» ясна обычному читателю; традиционные термины «знамение» и «Сын Человеческий» сохранены ради точности и межтекстовых связей.
