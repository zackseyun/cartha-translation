id: LUK.11.1
reference: Luke 11:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: ru
  text: 'Однажды Иисус молился в одном месте. Когда он закончил молиться, один из его учеников сказал ему: «Господи, научи нас молиться, как и Иоанн научил своих учеников».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Однажды
  rationale: Луканская повествовательная формула вводит новый эпизод. «Однажды» естественно выполняет эту функцию в современном русском, не воспроизводя архаичное «и случилось».
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: Иисус молился
  rationale: Конструкция обозначает продолжающееся действие, на фоне которого разворачивается эпизод. Русский глагол несовершенного вида «молился» сохраняет эту аспектуальность.
- source_word: ἐν τόπῳ τινὶ
  choice: в одном месте
  rationale: Передаёт намеренную неопределённость τινί естественным современным русским выражением, не уточняя место.
- source_word: ὡς ἐπαύσατο
  choice: когда он закончил молиться
  rationale: Глагол означает прекращение действия. В русском «закончил молиться» яснее и естественнее, чем «перестал», и контекстуально раскрывает подразумеваемое действие без изменения смысла.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: один из его учеников
  rationale: Естественно передаёт неопределённое лицо и партитивную конструкцию.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения «Господи» сохраняет обычный новозаветный титул κύριος и звучит естественно в прямой речи.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: научи нас молиться
  rationale: Прямо передаёт инфинитивное дополнение, не добавляя пояснительного «как».
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: как и Иоанн научил своих учеников
  rationale: «Как и» сохраняет сравнительную силу καθώς и добавочное значение καί; «своих» естественно указывает на учеников Иоанна.
theological_decisions:
- issue: Передача κύριος в обращении к Иисусу
  choice: Господи
  alternative: Учитель
  rationale: «Господи» сохраняет широкий смысловой диапазон титула κύριος — уважительное обращение и его возможную более глубокую христологическую значимость — не сводя его лишь к роли наставника.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Длинная греческая конструкция разделена на два предложения ради естественности и удобочитаемости; имя «Иисус» эксплицирует местоимение по контексту. Архаизмы и конфессионально маркированные формулировки не используются.
