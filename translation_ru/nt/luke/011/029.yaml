source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: ru
  text: 'По мере того как собиралось всё больше народа, Он начал говорить: «Это поколение — злое поколение. Оно ищет знамения, но знамения ему не будет дано, кроме знамения Ионы[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «знамение Ионы» может указывать на самого Иону как на знамение в его пророческой миссии; с учётом евангельских параллелей оно может также напоминать о прообразной связи со смертью и воскресением Иисуса.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: стал собираться всё теснее
  rationale: Причастие настоящего времени в родительном самостоятельном обороте передаёт продолжающееся стечение людей; приставка ἐπ- допускает оттенок всё большего скопления, естественно выраженный по-русски.
- source_word: ἤρξατο λέγειν
  choice: начал говорить
  rationale: Сохраняет начинательное значение греческой конструкции и звучит естественно в современном русском повествовании.
- source_word: ἡ γενεὰ αὕτη
  choice: нынешнее поколение
  rationale: Передаёт указание на современников Иисуса и корпоративный характер оценки, не сужая её до отдельных присутствующих противников.
- source_word: πονηρά
  choice: злое
  rationale: Прямое и понятное нравственное определение, соответствующее πονηρός и не смягчающее осуждение.
- source_word: σημεῖον
  choice: знамение
  rationale: Устоявшийся библейский термин, обозначающий значимое удостоверяющее событие и не сводящий его просто к чуду.
- source_word: ζητεῖ
  choice: ищет
  rationale: Близко передаёт буквальное значение глагола; требовательный и неодобрительный оттенок определяется контекстом.
- source_word: δοθήσεται
  choice: будет дано
  rationale: Точно сохраняет будущее время и страдательный залог.
- source_word: εἰ μὴ
  choice: кроме
  rationale: В отрицательной исключительной конструкции это естественный русский эквивалент со значением «за исключением».
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: знамения Ионы
  rationale: Родительный падеж намеренно оставлен смыслово открытым, не уточняя в основном тексте, идёт ли речь об Ионе как знамении, его миссии или типологическом соответствии.
theological_decisions:
- issue: Сила осуждения «нынешнего поколения»
  choice: Сохранена широкая корпоративная нравственная оценка современников Иисуса.
  alternative: Ограничить слова только конкретными противниками, находившимися рядом.
  rationale: Повтор γενεά и указательное αὕτη подчёркивают общее осуждение поколения; греческий текст не даёт оснований молча сужать круг подразумеваемых людей.
- issue: Смысл «знамения Ионы»
  choice: В основном тексте сохранена неоднозначная родительная конструкция.
  alternative: Однозначно истолковать её как проповедь Ионы либо как прообраз смерти и воскресения Иисуса.
  rationale: Ближайший контекст Луки связывает Иону со знамением для ниневитян, тогда как евангельские параллели допускают также типологическую связь со смертью и воскресением Иисуса; перевод не должен преждевременно устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Народ» употреблено как естественное собирательное обозначение множества людей; прописное «Он» следует распространённой русской библейской издательской традиции. Маркер сноски поставлен непосредственно после цитаты, к которой относится пояснение.
