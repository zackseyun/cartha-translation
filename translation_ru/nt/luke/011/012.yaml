  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: ru
  text: Или, если он попросит яйцо, неужели тот подаст ему скорпиона?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Или, если
  rationale: Вводит следующий параллельный пример в цепи риторических вопросов; союз καί здесь не требует отдельной передачи в естественном русском тексте.
- source_word: αἰτήσει
  choice: попросит
  rationale: Будущее изъявительное в условной конструкции естественно передаётся русским совершенным будущим и обозначает просьбу о чём-либо.
- source_word: ᾠόν
  choice: яйцо
  rationale: Прямое и общеупотребительное соответствие.
- source_word: ἐπιδώσει
  choice: подаст
  rationale: Глагол означает дать или вручить в ответ на просьбу; «подаст» естественно сочетается с конкретным предметом и сохраняет оттенок передачи просителю.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный падеж обозначает косвенный объект действия.
- source_word: σκορπίον
  choice: скорпиона
  rationale: Стандартное соответствие, сохраняющее резкий и намеренно нелепый контраст с яйцом.
theological_decisions:
- issue: Риторическая сила аналогии между отцом и ребёнком
  choice: Передать как прямой риторический вопрос с частицей «неужели», не добавляя слова «вместо».
  alternative: 'Сделать противопоставление явным: «неужели вместо него даст ему скорпиона?»'
  rationale: Греческий текст оставляет значение «вместо» подразумеваемым. Частица «неужели» естественно передаёт ожидаемый отрицательный ответ, не разъясняя богословский смысл сверх текста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Местоимение «тот» устраняет возможную двусмысленность двух форм «он» и сохраняет отсылку к отцу из контекста.
