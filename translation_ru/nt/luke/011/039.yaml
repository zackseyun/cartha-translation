id: LUK.11.39
reference: Luke 11:39
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: ru
  text: 'Но Господь сказал ему: «Вот вы, фарисеи, очищаете чашу и блюдо снаружи, а внутри у вас полно корысти[a] и зла».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грабежа», «хищения» или «вымогательства».'
    reason: Лексический диапазон ἁρπαγή включает как хищную корысть, так и конкретное насильственное или неправомерное присвоение чужого.
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет обычный новозаветный титул и соответствует функции слова в повествовании.
- source_word: Νῦν
  choice: Вот
  rationale: Передаёт здесь не столько время, сколько переход к резкому обличению; в современном русском «вот» звучит естественнее буквального «теперь».
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: вы, фарисеи
  rationale: Сохраняет выраженное местоимением логическое ударение и прямое обращение к группе.
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: чашу и блюдо снаружи
  rationale: Естественно передаёт наружную сторону обоих предметов, не сужая πίναξ до более конкретного вида посуды.
- source_word: καθαρίζετε
  choice: очищаете
  rationale: Передаёт настоящее время и сохраняет связь как с обычным мытьём посуды, так и с контекстом чистоты.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: а внутри у вас
  rationale: Сохраняет намеренный переход от внешней стороны сосудов к внутреннему состоянию людей, не подставляя толкования «сердце» или «душа».
- source_word: γέμει
  choice: полно
  rationale: Безличная русская конструкция естественно соответствует единственному числу греческого сказуемого и образу внутреннего пространства, наполненного пороками.
- source_word: ἁρπαγῆς
  choice: корысти
  rationale: Передаёт внутреннюю хищную алчность в данном нравственном обличении; более конкретные значения насильственного присвоения сохранены в примечании.
- source_word: πονηρίας
  choice: зла
  rationale: Широкое и серьёзное нравственное обозначение, не сужающее значение до одной лишь злобы или злонамеренности.
theological_decisions:
- issue: Образ внутренней стороны
  choice: «внутри у вас» без уточнения психологического или духовного органа
  alternative: «ваши сердца» или «ваша душа»
  rationale: Греческий текст противопоставляет внешнее очищение внутренней испорченности, но не называет сердце, разум или душу; перевод сохраняет эту образность и богословское напряжение.
- issue: Нравственный смысл ἁρπαγή
  choice: «корысть» в основном тексте с конкретными значениями в примечании
  alternative: «грабёж», «хищение» или «вымогательство» в основном тексте
  rationale: Контекст описывает внутреннее нравственное состояние, однако слово также допускает указание на присвоение чужого; примечание сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Конструкция «внутри у вас полно» намеренно сохраняет конкретную пространственную метафору оригинала, оставаясь естественной для обычного читателя.
