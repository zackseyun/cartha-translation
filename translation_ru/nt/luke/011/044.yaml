  source_fidelity: Текст точно передаёт οὐαὶ ὑμῖν как «Горе вам», сравнение с «неприметными гробницами» и образ людей, ходящих по ним, не осознавая этого. «Неприметным» удачно сохраняет диапазон ἄδηλα («незаметные, нераспознаваемые, неотмеченные»), не сужая его до одного спорного оттенка. Обобщающее «люди» верно передаёт ἄνθρωποι.
