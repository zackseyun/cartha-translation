  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: ru
  text: Горе вам, потому что вы подобны неприметным гробницам, по которым ходят люди, не зная об этом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Горе вам
  rationale: Устойчивая и точная передача пророческого возгласа осуждения.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: неприметным гробницам
  rationale: ἄδηλα означает невидимые, неявные или не имеющие заметного обозначения; «неприметные» естественно передаёт смысл гробниц, которые прохожие не распознают.
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: по которым ходят люди
  rationale: Сохраняет образ людей, проходящих непосредственно поверх гробниц, без ненужного гендерного сужения значения ἄνθρωποι.
- source_word: οὐκ οἴδασιν
  choice: не зная об этом
  rationale: Причастная конструкция по-русски естественно связывает незнание с тем, что люди ходят по гробницам.
theological_decisions:
- issue: Связь образа с ритуальной нечистотой
  choice: Не пояснять подразумеваемое осквернение в основном тексте
  alternative: Добавить, что люди невольно становятся нечистыми
  rationale: Греческий текст оставляет этот культурно-религиозный фон подразумеваемым; перевод сохраняет напряжение образа и не вносит эксплицитного утверждения, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет торжественный пророческий тон и при этом звучит естественно и ясно.
