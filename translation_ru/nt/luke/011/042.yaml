id: LUK.11.42
reference: Luke 11:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: ru
  text: Но горе вам, фарисеям! Вы отдаёте десятину с мяты, руты и всякой огородной зелени, но обходите стороной справедливость и любовь к Богу[a]. Это и следовало делать, не пренебрегая и тем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божью любовь». Греческое выражение может означать как любовь к Богу, так и любовь Бога.'
    reason: Сохраняет грамматическую неоднозначность родительного τοῦ θεοῦ.
lexical_decisions:
- source_word: ἀποδεκατοῦτε
  choice: отдаёте десятину с
  rationale: Передаёт практику выделения десятой части урожая естественным современным русским выражением.
- source_word: πᾶν λάχανον
  choice: всякой огородной зелени
  rationale: В данном контексте слово обозначает выращиваемые съедобные растения или травы вообще, а не только современное русское «овощи».
- source_word: παρέρχεσθε
  choice: обходите стороной
  rationale: Сохраняет образное значение греческого глагола — проходить мимо, оставлять без внимания, — не сводя его к более общему «пренебрегаете».
- source_word: τὴν κρίσιν
  choice: справедливость
  rationale: В этическом перечне κρίσις означает правосудие, справедливый суд и справедливость; выбранное слово наиболее естественно и ёмко по-русски.
- source_word: μὴ παρεῖναι
  choice: не пренебрегая
  rationale: По смыслу передаёт требование не оставлять без исполнения менее важную обязанность; деепричастная конструкция естественно связывает обе части изречения.
theological_decisions:
- issue: Значение родительного оборота τὴν ἀγάπην τοῦ θεοῦ
  choice: любовь к Богу[a]
  alternative: Божья любовь / любовь Бога
  rationale: 'В контексте обличения обязанностей человека вероятнее объективное значение: любовь, направленная к Богу. Однако греческая конструкция допускает и субъектное понимание, поэтому неоднозначность отмечена в сноске.'
- issue: Соотношение «это» и «то» в заключении
  choice: «Это» относится к справедливости и любви к Богу, «тем» — к десятине
  alternative: Явно повторить обе группы обязанностей
  rationale: 'Сохранена краткая противопоставленная структура оригинала: главное следовало исполнять, не оставляя и второстепенного.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямого пророческого обличения. Обращение «фарисеям» выделено восклицанием; конкретные растения названы без архаизации. Образ «обходите стороной» намеренно сохранён.
