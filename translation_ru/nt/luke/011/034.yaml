base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: ru
  text: Светильник тела — твой глаз. Когда твой глаз здоров[a], то и всё твоё тело наполнено светом; а когда он плох[b], то и тело твоё темно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ясен», «целен»; традиционно: «прост». Греческое слово может обозначать ясность, цельность или нераздвоенность; здесь оно относится к глазу и противопоставлено «плохому».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зол». Греческое слово может означать как «плохой», так и «злой»; образ допускает мысль и о нездоровом глазе, и об искажённом нравственном восприятии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: светильник
  rationale: Передаёт конкретный источник света и сохраняет образ, в отличие от отвлечённого слова «свет».
- source_word: σῶμα
  choice: тело
  rationale: Основное значение в данном контексте; телесный образ служит также для выражения внутреннего состояния человека.
- source_word: ὀφθαλμός
  choice: глаз
  rationale: Сохранено буквальное обозначение органа зрения, на котором строится метафора восприятия.
- source_word: ὅταν ... ᾖ
  choice: когда ... здоров
  rationale: Конструкция выражает общее условно-временное отношение; русское «когда» естественно передаёт его здесь.
- source_word: ἁπλοῦς
  choice: здоров
  rationale: В противопоставлении πονηρός и в образе глаза как светильника слово указывает на цельность и правильное состояние глаза. «Здоров» понятно современному читателю, а неоднозначность отмечена в сноске.
- source_word: ὅλον ... φωτεινόν
  choice: всё твоё тело наполнено светом
  rationale: Идиоматично передаёт значение «светлое, полное света» и сохраняет образ света.
- source_word: ἐπὰν δὲ
  choice: а когда
  rationale: Передаёт контраст и сохраняет параллелизм с первым условно-временным оборотом.
- source_word: πονηρός
  choice: плох
  rationale: Не сужает значение до физической болезни или только нравственного зла, сохраняя возможную двойственность образа.
- source_word: σκοτεινόν
  choice: погружено во тьму
  rationale: Естественная русская формулировка, ясно противопоставленная выражению «наполнено светом».
theological_decisions:
- issue: Значение ἁπλοῦς применительно к глазу
  choice: 'В основном тексте: «здоров»'
  alternative: «прост», «целен», «чист», «искренен»
  rationale: Непосредственный контекст говорит о действии глаза и состоянии тела, поэтому функциональное «здоров» наиболее понятно. Сноска сохраняет оттенки цельности и нераздвоенности, не сводя образ к определённому богословскому толкованию.
- issue: Значение πονηρός применительно к глазу
  choice: 'В основном тексте: «плох»'
  alternative: «зол», «нездоров»
  rationale: Греческое слово допускает как оценку неисправности, так и нравственную оценку. Нейтрально широкое «плох» вместе со сноской сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой. Сохранён конкретный образ светильника, света и тьмы; неясность ключевых греческих прилагательных вынесена в сноски без навязывания конфессионального толкования.
