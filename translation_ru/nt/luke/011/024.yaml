source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: ru
  text: 'Когда нечистый дух выйдет из человека, он проходит через безводные места[a], ища покоя, и, не находя его, говорит: «Вернусь в свой дом, откуда я вышел».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через засушливые места»; буквально: «через места без воды».'
    reason: 'Лексическое пояснение к ἀνύδρων: основной текст сохраняет буквальный образ безводности, а примечание даёт естественный смысловой вариант.'
lexical_decisions:
- source_word: Ὅταν ... ἐξέλθῃ
  choice: Когда ... выйдет
  rationale: Сочетание ὅταν с аористом сослагательного наклонения описывает общий случай как завершившееся событие; русская конструкция с будущим совершенного вида передаёт это естественно.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: нечистый дух
  rationale: Устойчивое новозаветное обозначение злого духа; «нечистый» сохраняет нравственно-ритуальный оттенок ἀκάθαρτος.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: из человека
  rationale: В данном обобщающем высказывании ἄνθρωπος обозначает человека как представителя рода; русское «человек» естественно и не сужает значение до взрослого мужчины.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: проходит по безводным местам
  rationale: «Проходит» передаёт движение через некоторую область, а «безводные места» сохраняет конкретный образ отсутствия воды, не заменяя его толкованием.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: ища покоя
  rationale: Краткая деепричастная конструкция естественно передаёт сопутствующее целенаправленное действие; «покой» соответствует ἀνάπαυσις.
- source_word: καὶ μὴ εὑρίσκον
  choice: и, не найдя его
  rationale: Местоимение «его» ясно отсылает к покою и устраняет неестественную для русского языка безобъектность, не добавляя нового смысла.
- source_word: λέγει
  choice: говорит
  rationale: Настоящее время сохраняет живость греческого исторического настоящего и согласуется с характером общего высказывания.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Вернусь в свой дом
  rationale: «Вернусь» передаёт решение, выраженное будущим временем, а «свой дом» является естественным русским способом обозначить дом говорящего и сохраняет образ дома.
- source_word: ὅθεν ἐξῆλθον
  choice: откуда я вышел
  rationale: «Откуда» прямо соответствует ὅθεν, а «вышел» повторяет образ выхода из начала стиха.
theological_decisions:
- issue: Личностный характер нечистого духа
  choice: Сохранён «нечистый дух» как действующее лицо, которое выходит, ищет, говорит и возвращается.
  alternative: Истолковать выражение как безличную силу или метафору нравственного падения.
  rationale: Грамматика и контекст представляют духа личным деятелем; перевод не должен демифологизировать текст или заранее сводить его к метафоре.
- issue: Обобщающее значение ἀνθρώπου
  choice: Переведено «из человека».
  alternative: «из мужчины» или «из того человека»
  rationale: Хотя форма существительного мужского рода и имеет артикль, здесь она обозначает типичный, обобщённый случай; в русском «человек» точно сохраняет это значение без необоснованного указания на пол или на ранее названное лицо.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для чтения вслух; сохранены образ дома, повтор выхода и возвращения, а также конкретный образ безводных мест.
