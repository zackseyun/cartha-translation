  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: ru
  text: И прости нам наши грехи, ведь и мы сами прощаем всякому, кто нам должен[a]. И не введи нас в искушение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякому задолжавшему нам»; здесь в греческом тексте используется язык долга, хотя в первой части сказано «грехи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в испытание».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: прости
  rationale: Аористный императив ἀφίημι в обращённой к Богу молитве естественно передаётся как «прости»; буквальное «отпусти» здесь звучало бы менее ясно.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: наши грехи
  rationale: В первой части прямо употреблено ἁμαρτίας — «грехи», а не слово со значением «долги».
- source_word: καὶ γὰρ αὐτοὶ
  choice: ведь и мы сами
  rationale: «Ведь» передаёт обосновывающее γάρ, «и» — добавочное καί, а «мы сами» сохраняет эмфазу αὐτοί.
- source_word: ἀφίομεν
  choice: прощаем
  rationale: «Прощаем» сохраняет лексическую связь с ἄφες и естественно описывает межличностное прощение, не сводя образ к буквальному списанию денежного долга.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: всякому, кто нам должен
  rationale: Так сохраняется язык долга, присутствующий во второй части, и одновременно получается естественная современная русская фраза.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: не введи нас в искушение
  rationale: «Введи» точно и идиоматично передаёт направленность εἰσφέρω «внести/ввести», а «искушение» является основным контекстуальным значением πειρασμός; возможность значения «испытание» отмечена в сноске.
theological_decisions:
- issue: Смысл прошения о πειρασμός
  choice: «не введи нас в искушение» без поясняющего смягчения
  alternative: «не введи нас в испытание»
  rationale: Формулировка сохраняет богословское напряжение самого греческого текста и не добавляет объяснения об отношении Бога к искушению; лексическая неоднозначность πειρασμός вынесена в сноску.
- issue: Соотношение греха и долга в двух частях стиха
  choice: Сохранить «грехи» в просьбе к Богу и язык долга в описании прощения людей
  alternative: Унифицировать обе части как «долги/должников» или как «грехи/согрешивших»
  rationale: Греческий текст намеренно использует ἁμαρτίας в первой части и ὀφείλοντι во второй; перевод не должен устранять это различие.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранена знакомая формула «не введи нас в искушение», поскольку она одновременно естественна и близка греческому тексту. Архаические «оставь» и «долги наши» не используются, так как в первой части оригинал прямо говорит о грехах.
