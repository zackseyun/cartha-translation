base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: ru
  text: 'от крови Авеля до крови Захарии[b], погибшего между жертвенником и храмом[a]. Да, говорю вам: она будет взыскана с этого поколения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между жертвенником и домом», то есть зданием храма.'
    reason: lexical_alternative
  - marker: b
    text: О каком Захарии идёт речь, остаётся предметом споров. Среди возможных отождествлений — Захария, сын Иодая (2 Пар. 24:20–22), и Захария, сын Варахии.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: от крови Авеля до крови Захарии
  rationale: Сохраняет риторическую конструкцию «от… до…» и библейский образ крови как пролитой жизни и вины за убийство.
- source_word: τοῦ ἀπολομένου
  choice: погибшего
  rationale: Передаёт средний причастный оборот без излишнего уточнения действующего лица; контекст указывает на насильственную смерть.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: между жертвенником и храмом
  rationale: В храмовом контексте οἶκος обозначает храмовое здание; «храм» естественнее и понятнее современному русскому читателю, а буквальное «дом» отмечено в сноске.
- source_word: ναί, λέγω ὑμῖν
  choice: Да, говорю вам
  rationale: Сохраняет торжественное усиление ναί и близкую к греческому, привычную для библейской речи формулу.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: она будет взыскана с этого поколения
  rationale: Страдательная форма сохраняет не названного прямо субъекта суда; местоимение «она» естественно отсылает к ранее упомянутой крови, а «взыскана с» передаёт смысл привлечения к ответу.
theological_decisions:
- issue: Личность Захарии
  choice: Не уточнять личность Захарии в основном тексте; отметить спорность в сноске.
  alternative: Отождествить его с Захарией, сыном Иодая, либо с Захарией, сыном Варахии.
  rationale: Греческий текст данного стиха не содержит отчества, поэтому перевод не должен разрешать исторический спор.
- issue: Смысл взыскания крови с «этого поколения»
  choice: Сохранить судебный образ и прямое указание на «это поколение» без доктринального расширения.
  alternative: Явно истолковать выражение как наказание, вину или возмездие, относящееся к более широкой группе.
  rationale: Так сохраняются неоднозначность страдательной формы и напряжённость исходного высказывания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но понятен обычному читателю; архаизмы сведены к общеупотребительному слову «жертвенник».
