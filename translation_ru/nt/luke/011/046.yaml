  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: ru
  text: 'Но Он сказал: «И вам, знатокам Закона[a], горе, потому что вы взваливаете на людей бремена, которые трудно нести, а сами ни одним пальцем не прикасаетесь к этим бременам[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законоучителям». Речь идёт о специалистах по иудейскому Закону.'
    reason: lexical_alternative
  - marker: b
    text: То есть вы не прилагаете ни малейшего усилия, чтобы помочь людям нести то, что сами на них возлагаете.
    reason: idiom_explanation
lexical_decisions:
- source_word: νομικοῖς
  choice: знатокам Закона
  rationale: В данном контексте речь идёт не о светских юристах, а о специалистах по иудейскому Закону; прописная буква поясняет, что имеется в виду Закон Моисея.
- source_word: οὐαί
  choice: горе
  rationale: Сохраняет пророческую силу предостережения и обличения, не смягчая её до простого сожаления.
- source_word: φορτίζετε
  choice: взваливаете
  rationale: 'Передаёт каузативный и образный смысл: адресаты возлагают тяжёлую ношу на других.'
- source_word: ἀνθρώπους
  choice: людей
  rationale: Греческое слово употреблено обобщённо и не обозначает исключительно мужчин.
- source_word: φορτία δυσβάστακτα
  choice: бремена, которые трудно нести
  rationale: Передаёт метафору и значение δυσβάστακτα без усиления до абсолютного «непосильные».
- source_word: αὐτοὶ
  choice: сами
  rationale: Сохраняет эмфатическое противопоставление знатоков Закона людям, на которых они возлагают бремена.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: и одним пальцем
  rationale: Естественный русский оборот, выражающий отсутствие даже минимального участия.
- source_word: προσψαύετε
  choice: не прикасаетесь
  rationale: Сохраняет конкретный образ прикосновения, не подменяя его истолкованием «не помогаете».
theological_decisions:
- issue: Кого обозначает νομικοῖς
  choice: знатоки Закона
  alternative: законоучители; законники
  rationale: Перевод ясно указывает на специалистов по Закону Моисея и не создаёт современной ассоциации со светскими юристами; «книжники» было бы более узким и не полностью тождественным обозначением.
- issue: Смысл заключительной фразы
  choice: 'Сохранён буквальный образ: «и одним пальцем не прикасаетесь к этим бременам»'
  alternative: «и пальцем не пошевелите, чтобы помочь»
  rationale: Греческий текст говорит именно о прикосновении к бременам. Подразумеваемое нежелание помочь остаётся понятным, но не вводится в основной текст как явное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. «Бремена» сохраняет повтор и метафору оригинала, а конструкция «которые трудно нести» не преувеличивает значение δυσβάστακτα. Местоимение «Он» оформлено по традиционной русской библейской орфографии.
