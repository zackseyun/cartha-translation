  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ru
  text: 'И я говорю вам[a]: просите — и будет дано вам; ищите — и найдёте; стучите — и вам откроют.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Настоящие формы греческих повелительных глаголов могут также подчёркивать продолжение или повторение действия: «продолжайте просить… искать… стучать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: И Я говорю вам
  rationale: Сохраняет соединительную силу καί, акцент на ἐγώ и естественно передаёт вводную формулу в настоящем времени.
- source_word: αἰτεῖτε
  choice: просите
  rationale: Простой императив естественен по-русски и не делает возможную длительность или повторяемость действия обязательным толкованием.
- source_word: δοθήσεται ὑμῖν
  choice: будет дано вам
  rationale: Безличная пассивная конструкция точно сохраняет будущее время, страдательный залог и адресата обещания.
- source_word: ζητεῖτε, καὶ εὑρήσετε
  choice: ищите — и найдёте
  rationale: Передаёт прямую заповедь и обещание, сохраняя параллелизм греческого текста.
- source_word: κρούετε
  choice: стучите
  rationale: В контексте подразумевается стук в дверь; русский глагол сохраняет этот образ без добавления подразумеваемого объекта.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: отворят вам
  rationale: Русская неопределённо-личная конструкция естественно передаёт греческий пассив при невыраженном деятеле; «отворят» ясно поддерживает образ двери.
theological_decisions:
- issue: Видовое значение настоящих императивов αἰτεῖτε, ζητεῖτε, κρούετε
  choice: В основном тексте употреблены простые императивы «просите», «ищите», «стучите».
  alternative: «продолжайте просить… искать… стучать» или «просите снова и снова…»
  rationale: Настоящие императивы могут допускать длительное или повторяющееся действие, но сами по себе не требуют однозначно выражать его в переводе. Неопределённый вид русских императивов позволяет сохранить эту открытость; возможный оттенок пояснён в сноске.
- issue: Неуказанный деятель в δοθήσεται и ἀνοιγήσεται
  choice: Сохранены безличная и неопределённо-личная конструкции без прямого называния Бога.
  alternative: «Бог даст вам… Бог отворит вам»
  rationale: В контексте Бог подразумевается, однако греческий текст прямо Его не называет. Перевод не превращает подразумеваемого деятеля в явного.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным трёхчастным параллелизмом. Заглавная «Я» передаёт эмфатическое местоимение без добавочного «также». «Отворят» слегка возвышенно, но понятно и точно сочетается с образом стука в дверь.
