lexical_decisions:
- source_word: ἐπειδὴ
  choice: потому что
  rationale: Вводит причину просьбы и естественно связывает стих с предшествующим обращением.
- source_word: φίλος μου
  choice: друг
  rationale: В русском языке сочетание «ко мне пришёл друг» естественно передаёт неопределённость без добавления «один»; принадлежность к кругу друзей говорящего ясна из контекста.
- source_word: παρεγένετο
  choice: пришёл
  rationale: Передаёт состоявшееся прибытие гостя; результат сохраняется в ситуации рассказа.
- source_word: ἐξ ὁδοῦ
  choice: с дороги
  rationale: 'Близко к греческому выражению и при этом идиоматично по-русски: друг прибыл после пути.'
- source_word: πρός με
  choice: ко мне
  rationale: Точно передаёт направленность движения, не добавляя прямо не названные «домой» или «в гости».
- source_word: οὐκ ἔχω
  choice: мне нечего
  rationale: Естественная русская конструкция, выражающая отсутствие того, что можно дать гостю.
- source_word: ὃ παραθήσω αὐτῷ
  choice: предложить ему
  rationale: В контексте гостеприимства означает подать или поставить перед гостем еду; «предложить» естественно передаёт этот смысл без излишнего уточнения.
