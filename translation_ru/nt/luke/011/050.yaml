source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: ru
  text: чтобы с этого поколения потребовали ответа за кровь всех пророков, пролитую от основания мира,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение союза в связи с предшествующим контекстом.
- source_word: ἐκζητηθῇ
  choice: был взыскан ответ за
  rationale: В контексте пролитой крови глагол имеет судебный смысл привлечения к ответу. Эта формулировка ясно выражает ответственность, не превращая «кровь» в абстрактную «вину».
- source_word: τὸ αἷμα
  choice: за кровь
  rationale: Сохраняется образ крови, метонимически указывающий на убийство пророков и ответственность за него.
- source_word: πάντων τῶν προφητῶν
  choice: всех пророков
  rationale: Прямо сохраняет всеохватность греческого πάντων.
- source_word: τὸ ἐκκεχυμένον
  choice: пролитую
  rationale: Обычное и точное русское сочетание применительно к крови, пролитой при насильственной смерти.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: от основания мира
  rationale: Сохраняет традиционный библейский образ и временное значение исходной конструкции.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: с этого поколения
  rationale: Передаёт лицо, с которого требуется ответ, и сохраняет повторённый греческий предлог ἀπό естественным русским оборотом.
theological_decisions:
- issue: Характер взыскания за кровь пророков
  choice: Божественное судебное привлечение этого поколения к ответу за кровь пророков
  alternative: Лишь риторическое указание на историческую преемственность без выраженного судебного смысла
  rationale: ἐκζητέω в контексте кровопролития выражает требование отчёта и воздаяние. Перевод сохраняет судебную силу, но не уточняет сверх текста механизм коллективной ответственности.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Оборот «взыскан ответ за кровь» несколько возвышен, но понятен и передаёт судебную образность оригинала. Пунктуация и конечная запятая учитывают, что стих синтаксически продолжается в следующем стихе.
