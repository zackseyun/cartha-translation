  verdict: revise
  source_fidelity: 'Судебно-ответственное значение ἐκζητηθῇ и оба обстоятельства с ἀπό в целом переданы верно. Однако «был взыскан ответ» — неудачное управление: по-русски взыскивают с кого-либо, либо требуют ответа; ответ не бывает естественным прямым объектом «взыскать» в данной конструкции.'
  naturalness: «Чтобы с этого поколения потребовали ответа за кровь…» — естественный литературный и достаточно торжественный русский оборот. Он сохраняет незавершённость синтаксиса, отражённую конечной запятой.
  terminology: «Кровь всех пророков», «пролитую», «от основания мира» точно передают ключевые образы и не добавляют доктринальных объяснений. «Потребовали ответа» передаёт судебный смысл без ненужного уточнения механизма ответственности.
  issues:
