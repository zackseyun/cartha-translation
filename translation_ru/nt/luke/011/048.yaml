  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: ru
  text: 'Итак, вы свидетельствуете о делах своих отцов и одобряете их: они убили пророков, а вы строите им гробницы[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте дополнение после «строите» не названо; из предыдущего стиха подразумеваются гробницы пророков.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: Итак
  rationale: Передаёт вывод из предшествующего обличения и естественно звучит в современном русском.
- source_word: μάρτυρές ἐστε
  choice: вы свидетели
  rationale: Сохраняет именную конструкцию и смысл свидетельства, которое действия слушателей дают против них самих.
- source_word: καὶ συνευδοκεῖτε τοῖς ἔργοις
  choice: дел своих отцов и одобряете их
  rationale: В греческом одна и та же группа «делам ваших отцов» связана с тем, что они являются свидетелями и одобряют; русская перестройка сохраняет обе связи без тяжеловесности.
- source_word: τῶν πατέρων ὑμῶν
  choice: своих отцов
  rationale: Сохраняет семейно-риторическую связь с прежними поколениями; возвратное «своих» естественно при подлежащем «вы».
- source_word: ὅτι
  choice: ':'
  rationale: Двоеточие естественно вводит разъяснение основания обвинения, сохраняя причинно-пояснительную функцию ὅτι.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: они убили пророков
  rationale: «Они» относится к отцам, а объект «пророков» ясно восстанавливается из предыдущего стиха и устраняет неясную цепочку русских местоимений.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: а вы строите им гробницы
  rationale: «А вы» передаёт контраст μέν…δέ; объект глагола восполнен из непосредственного контекста стиха 47 ради ясного и завершённого русского предложения.
theological_decisions:
- issue: Следует ли восполнить подразумеваемый объект οἰκοδομεῖτε
  choice: 'Восполнить: «строите им гробницы»'
  alternative: 'Оставить буквально без объекта: «а вы строите»'
  rationale: В стихе 48 объект формально отсутствует, но однозначно задан выражением «гробницы пророкам» в стихе 47. В русском языке голое «строите» здесь звучит незавершённо; восполнение не снимает богословской напряжённости, а лишь делает явной контекстуальную связь.
- issue: Характер связи слушателей с поступками предков
  choice: «свидетели дел… и одобряете их»
  alternative: «свидетельствуете о делах… и одобряете их»
  rationale: 'Сохранено более резкое «вы свидетели»: слушатели своими действиями подтверждают и одновременно одобряют дела предков; перевод не уточняет сверх текста, являются ли они свидетелями за или против.'
translation_notes:
  register: Современный литературный русский с достоинством и ясной обличительной интонацией. Синтаксис слегка перестроен ради естественности, при этом сохранены вывод ἄρα, сочетание свидетельства и одобрения, а также контраст μέν…δέ.
