id: LUK.11.25
reference: Luke 11:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: ru
  text: И, придя, он находит дом выметенным и приведённым в порядок.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выметенным и украшенным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: придя
  rationale: Аористное причастие передаёт предшествующее возвращение нечистого духа; деепричастие естественно и кратко сохраняет греческую конструкцию.
- source_word: εὑρίσκει
  choice: он находит
  rationale: Настоящее время сохраняет живость повествования. В русском род местоимения определяется словом «дух» из предыдущего стиха, поэтому употреблено «он».
- source_word: σεσαρωμένον
  choice: выметенным
  rationale: Перфектное страдательное причастие обозначает дом, который вымели и который остаётся в таком состоянии. «Выметенным» точнее передаёт действие σαρόω без добавления отсутствующего в греческом слова «чисто».
- source_word: κεκοσμημένον
  choice: приведённым в порядок
  rationale: В контексте дома κοσμέω вероятнее указывает на устроенность и упорядоченность, хотя также может означать украшение; альтернативный смысл сохранён в сноске.
theological_decisions:
- issue: Подразумеваемое дополнение при εὑρίσκει
  choice: дом
  alternative: его
  rationale: В греческом дополнение не выражено, но из ближайшего контекста ясно, что речь о доме. В русском явное «дом» устраняет двусмысленность местоимения и не добавляет нового референта.
- issue: Род субъекта — нечистого духа
  choice: он
  alternative: оно
  rationale: Хотя πνεῦμα в греческом среднего рода, русское «дух» мужского рода; согласование «он» является грамматическим, а не богословской персонализацией.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified повествовательная формулировка. Смысловая возможность «украшенным» не устранена, а вынесена в сноску.
