  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: ru
  text: 'Тогда в ответ один из знатоков Закона сказал Ему: «Учитель, говоря это, Ты оскорбляешь и нас[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унижаешь»; возможный смысл: «обращаешься с нами с презрением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Тогда … сказал
  rationale: Причастие ἀποκριθείς вводит ответную реплику, а δέ отмечает развитие повествования. По-русски естественно передать сочетание одним повествовательным оборотом; ответный характер слов ясен из контекста.
- source_word: τις τῶν νομικῶν
  choice: один из знатоков Закона
  rationale: νομικός здесь обозначает специалиста по иудейскому Закону, а не юриста в современном профессиональном смысле. Прописная буква указывает на Закон Моисея.
- source_word: λέγει αὐτῷ
  choice: сказал Ему
  rationale: Историческое настоящее передано прошедшим временем, естественным для современного русского повествования.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое и современное обращение, сохраняющее смысл греческого διδάσκαλος.
- source_word: ταῦτα λέγων
  choice: говоря это
  rationale: Деепричастный оборот сохраняет одновременность и прямо связывает обвинение с только что произнесёнными словами Иисуса.
- source_word: καὶ ἡμᾶς
  choice: и нас
  rationale: 'Передаёт добавочное значение καί: слова Иисуса затрагивают не только ранее упомянутых, но также знатоков Закона.'
- source_word: ὑβρίζεις
  choice: оскорбляешь
  rationale: Глагол означает оскорблять, унижать или обращаться с презрением; «оскорбляешь» точно и естественно передаёт смысл в контексте речи.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Знатоки Закона» устраняет ошибочную ассоциацию с современными адвокатами; обращение «Учитель» и прописное «Ты» соответствуют принятому благоговейному библейскому регистру.
