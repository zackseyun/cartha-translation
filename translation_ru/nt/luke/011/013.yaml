source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: ru
  text: Итак, если вы, будучи злыми, умеете давать своим детям добрые дары, то тем более Отец с небес даст Святого Духа тем, кто просит Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте — Матфея 7:11 — сказано «ваш Небесный Отец» и «добрые дары»; здесь же греческий текст Луки буквально говорит «Отец с небес» и называет дар — Святого Духа.
    reason: alternative_reading_and_cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: будучи злы
  rationale: Причастная конструкция прямо характеризует нравственное состояние людей; такой перевод сохраняет её описательно-уступительный оттенок без смягчения.
- source_word: οἴδατε ... διδόναι
  choice: умеете давать
  rationale: В сочетании с инфинитивом глагол выражает практическое знание или способность; «умеете давать» естественно передаёт это по-русски.
- source_word: δόματα ἀγαθὰ
  choice: добрые дары
  rationale: δόματα обозначает именно дары, а не просто вещи; «добрые дары» сохраняет конкретный смысл и сопоставление с даром Отца.
- source_word: τέκνοις ὑμῶν
  choice: своим детям
  rationale: В русском возвратное притяжательное местоимение естественно соотносится с подлежащим «вы», а «детям» точно передаёт семейный контекст.
- source_word: πόσῳ μᾶλλον
  choice: то тем более
  rationale: Обычная русская формула для аргумента от меньшего к большему; «то» ясно завершает условную конструкцию.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: Отец с небес
  rationale: Сохраняет предлог ἐξ («с, из») и не добавляет отсутствующее в греческом «ваш», не уподобляя текст Матфея 7:11.
- source_word: πνεῦμα ἅγιον
  choice: Святого Духа
  rationale: В данном контексте выражение обозначает Божьего Духа; русская падежная форма обусловлена глаголом «даст».
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: тем, кто просит Его
  rationale: Субстантивированное причастие естественно передано придаточным определительным; «Его» сохраняет явно выраженное αὐτόν, относящееся к Отцу.
theological_decisions:
- issue: Референт πνεῦμα ἅγιον
  choice: Святой Дух как Божий Дух
  alternative: «святой дух» в неопределённом или неличном смысле
  rationale: Луканский контекст указывает на Божьего Духа как особый дар Отца; написание с прописных букв передаёт этот референт, не добавляя к стиху дальнейших догматических определений.
- issue: Соотношение с параллелью в Матфея 7:11
  choice: 'Сохранить особую формулировку Луки: «Отец с небес» и «Святого Духа»'
  alternative: Гармонизировать как «ваш Небесный Отец» и/или «доброе»
  rationale: Перевод следует греческому тексту Луки, где нет «ваш», употреблено ἐξ οὐρανοῦ и назван Святой Дух; особенности параллельных евангельских формулировок не следует устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис близок к греческому, но естественен по-русски. «Будучи злы» намеренно сохраняет резкость исходной нравственной характеристики; «Отец с небес» сохраняет отличительную формулировку Луки.
