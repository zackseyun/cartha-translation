id: LUK.11.19
reference: Luke 11:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ru
  text: Но если Я изгоняю бесов с помощью Веельзевула, то с чьей помощью[a] изгоняют их ваши сыновья? Поэтому они сами[b] будут вам судьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чем»; или: «какой силой».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое местоимение подчёркнуто: именно они будут вам судьями.'
    reason: lexical_emphasis
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: δέ вводит возражение в ходе рассуждения; «но если» естественно передаёт лёгкое противопоставление.
- source_word: ἐγὼ
  choice: Я
  rationale: Явно выраженное греческое местоимение сохранено; прописная буква соответствует принятому русскому оформлению речи Иисуса.
- source_word: ἐν Βεελζεβοὺλ
  choice: с помощью Веельзевула
  rationale: ἐν здесь обозначает посредника или средство действия. Такой оборот понятен по-русски и не утверждает, будто Веельзевул сам непосредственно совершает изгнание.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: изгоняю бесов
  rationale: «Изгонять бесов» — точное, естественное и укоренившееся в русском языке обозначение экзорцизма.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ваши сыновья
  rationale: Сохранено прямое значение υἱοί без истолкования выражения как «ученики», «последователи» или «соотечественники».
- source_word: ἐν τίνι
  choice: с чьей помощью
  rationale: В контексте сопоставления с Веельзевулом вопрос естественно понимается как вопрос о личном посреднике; возможное значение средства или силы отмечено в сноске.
- source_word: ἐκβάλλουσιν
  choice: изгоняют их
  rationale: Повторено то же русское соответствие для ἐκβάλλω; местоимение «их» естественно восстанавливает ранее названных бесов.
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и ясно выражает логическое следствие риторического вопроса.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: они сами будут вам судьями
  rationale: «Они сами» передаёт эмфатическое αὐτοί, а дательный «вам» естественно выражает отношение суда над адресатами.
theological_decisions:
- issue: Кого обозначают «ваши сыновья»
  choice: Сохранить буквальное «ваши сыновья».
  alternative: «Ваши ученики», «ваши последователи» или «ваши соотечественники».
  rationale: Греческий текст не уточняет их связь с оппонентами Иисуса; перевод не должен устранять эту толковательную открытость.
- issue: Личный посредник или сила в выражении ἐν τίνι
  choice: В основном тексте — «с чьей помощью».
  alternative: «Чем» или «какой силой».
  rationale: Сопоставление с личным именем Веельзевула поддерживает личное прочтение, однако грамматика допускает вопрос о средстве или силе, поэтому альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет ход аргумента и риторический вопрос; неоднозначность выражений «ваши сыновья» и ἐν τίνι не разрешается конфессиональным толкованием.
