  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: ru
  text: Но когда нападает тот, кто сильнее его, и побеждает его[a], он отнимает всё его вооружение[b], на которое тот полагался, и раздаёт его добычу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одолевает его»; также возможно: «наносит ему поражение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «полное вооружение» — весь комплект оружия и доспехов.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «его трофеи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Но когда
  rationale: Передаёт условно-временное значение ἐπάν и контраст, выраженный δέ, естественным современным русским оборотом.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: тот, кто сильнее его
  rationale: Сохраняет субстантивированное сравнительное прилагательное, не добавляя отсутствующее в этой фразе слово «человек».
- source_word: ἐπελθὼν
  choice: нападает
  rationale: В контексте вооружённого противоборства причастие означает наступление на противника; «нападает» ясно и естественно передаёт направленность действия.
- source_word: νικήσῃ αὐτόν
  choice: побеждает его
  rationale: Прямо передаёт значение νικάω и сохраняет возможность понимать победу как поражение или одоление противника.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: всё его вооружение
  rationale: πανοπλία обозначает полный комплект оружия и доспехов; «всё вооружение» передаёт идею полноты без архаичного «всеоружие».
- source_word: αἴρει
  choice: отнимает
  rationale: В данном контексте речь идёт не просто об удалении, а о лишении побеждённого его вооружения.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: на которое тот полагался
  rationale: Передаёт устойчивую уверенность, выраженную плюсквамперфектом ἐπεποίθει, и устраняет возможную неясность русского местоимения.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: захваченную у него добычу
  rationale: σκῦλα — трофеи или добыча, отнятые у побеждённого; добавление «захваченную» проясняет военный оттенок слова.
- source_word: διαδίδωσιν
  choice: раздаёт
  rationale: Естественно передаёт распределение добычи между другими, не сводя действие лишь к её делению на части.
theological_decisions:
- issue: Следует ли прямо назвать более сильного «человеком» и тем самым теснее связать фразу с образом из предыдущего стиха?
  choice: «тот, кто сильнее его» без добавления слова «человек»
  alternative: «человек сильнее его» или «более сильный человек»
  rationale: В греческом тексте прилагательное употреблено субстантивированно, без явного существительного. Контекст позволяет понять образ, не добавляя отсутствующее слово и не сужая его толкование.
- issue: Насколько конкретно передавать νικάω в образе противоборства?
  choice: «побеждает его»
  alternative: «одолевает его» или «покоряет его»
  rationale: «Побеждает» точно и нейтрально передаёт νικάω, сохраняя образ практического поражения, после которого победитель отнимает вооружение и распределяет добычу, но не вводя в сам стих явных отождествлений участников образа.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Военный образ сохранён без архаизмов; синтаксис разграничивает более сильного и побеждённого при помощи слова «тот».
