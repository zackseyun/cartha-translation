  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ru
  text: Но если Я изгоняю бесов пальцем Бога[a], значит, Царство Бога достигло вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божьим пальцем». Этот образ означает непосредственную силу и действие Бога и перекликается с Исх. 8:19.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришло к вам»; возможно также: «настигло вас».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: пальцем Бога
  rationale: Сохраняет яркий образ греческого текста и указывает на непосредственное действие и силу Бога, не заменяя образ толкованием; выражение перекликается с Исх. 8:19.
- source_word: ἐκβάλλω
  choice: изгоняю
  rationale: Естественный современный русский эквивалент стандартного новозаветного обозначения изгнания бесов.
- source_word: τὰ δαιμόνια
  choice: бесов
  rationale: Прямой и привычный в русском библейском языке эквивалент; выражение «нечистых духов» переводило бы иную греческую формулировку.
- source_word: ἄρα
  choice: значит
  rationale: Ясно передаёт логический вывод из условной части и естественно звучит в современной русской речи.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: уже достигло вас
  rationale: Передаёт совершившееся, решительное приближение или достижение адресатов; «уже» естественно выражает контекстуальную силу наступившего события, не превращая его в исключительно будущее.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Бога
  rationale: Точно и понятно сохраняет как образ царства, так и смысл Божьего владычества; конструкция с родительным падежом соответствует греческому тексту.
theological_decisions:
- issue: Смысл выражения «палец Бога»
  choice: Сохранён образ непосредственной силы и действия Бога в изгнании бесов Иисусом.
  alternative: Истолковать выражение непосредственно как указание на Святого Духа на основании Мф. 12:28.
  rationale: Лука употребляет собственную формулировку, которую следует сохранить, не подменяя её словами параллельного места и не внося толкование в основной текст.
- issue: Сила выражения «Царство Бога уже достигло вас»
  choice: Передано настоящее, решительное наступление Божьего Царства в служении Иисуса.
  alternative: 'Понять Царство как исключительно будущее либо передать фразу только в осуждающем смысле: «настигло вас».'
  rationale: Аорист ἔφθασεν в данном контексте обозначает достигшее адресатов событие; перевод сохраняет реализованное наступление Царства, не навязывая развёрнутой эсхатологической схемы.
translation_notes:
  register: Современный литературный русский с ясной синтаксической связью «если… значит». Сохранён конкретный библейский образ «палец Бога»; избегается более архаичное «перст Божий». Заглавная буква в «Я» отражает традиционное русское оформление речи Иисуса, а «Царство Бога» остаётся понятным и торжественным без излишней архаизации.
