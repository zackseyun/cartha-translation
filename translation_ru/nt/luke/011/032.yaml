source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: ru
  text: Мужчины Ниневии восстанут на суде вместе с этим поколением и осудят его, потому что они покаялись в ответ на проповедь Ионы, и вот, здесь — нечто большее, чем Иона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «здесь тот, кто больше Ионы»; или: «здесь больше, чем Иона». В греческом употреблена форма среднего рода («большее / больше»), которая может широко указывать на превосходящую реальность, присутствующую в Иисусе и его служении, а не только на сравнение лиц.'
    reason: Сохраняются грамматическая особенность исходного текста и возможные варианты понимания πλεῖον.
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Ниневитяне
  rationale: Это естественное современное русское обозначение мужчин из Ниневии; грамматически мужской род сохранён без тяжеловесного и архаизирующего «ниневийские мужи».
- source_word: ἀναστήσονται
  choice: восстанут
  rationale: Передаёт образ вставания в эсхатологической судебной сцене, не уточняя сверх текста, что речь непосредственно о воскресении.
- source_word: ἐν τῇ κρίσει
  choice: на суде
  rationale: Устойчивое и ясное русское выражение для участия в судебном событии; κρίσις здесь обозначает суд, а не уже вынесенное осуждение.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: вместе с этим поколением
  rationale: Сохраняет значение совместности у μετά с родительным падежом и синоптическое выражение «это поколение».
- source_word: κατακρινοῦσιν αὐτήν
  choice: осудят его
  rationale: κατακρίνω означает именно осудить; местоимение отнесено к слову «поколение» и согласовано с ним по нормам русского языка.
- source_word: μετενόησαν
  choice: покаялись
  rationale: В пророческом контексте речь идёт о нравственно-духовном обращении, а не только о перемене мнения.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: в ответ на проповедь Ионы
  rationale: Передаёт смысл реакции на возвещённую Ионой весть и звучит естественно по-русски, не сводя κήρυγμα к отвлечённому содержанию.
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет торжественный указательный акцент дискурсивного маркера и естественно звучит в современном литературном русском.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: здесь — нечто большее, чем Иона
  rationale: Средний род πλεῖον передан словом «нечто», чтобы сохранить возможность широкого указания на превосходящую реальность, присутствующую в Иисусе и его служении, а не молча заменить её только личным сравнением.
theological_decisions:
- issue: Референт и смысл πλεῖον Ἰωνᾶ
  choice: здесь — нечто большее, чем Иона
  alternative: здесь тот, кто больше Ионы; здесь больше, чем Иона
  rationale: Средний род греческого πλεῖον сохранён. Иисус несомненно находится в центре высказывания, однако форма выражения может охватывать не только сравнение двух лиц, но и превосходящую реальность его присутствия и служения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Избегнуты как архаичное «ниневийские мужи», так и разговорные обороты. Пунктуационное тире подчёркивает указательный поворот ἰδοὺ и не добавляет отдельного смыслового утверждения.
