  source_fidelity: 'Требуется уточнение ἄνδρες Νινευῖται: «Ниневитяне» в русском может обозначать жителей Ниневии вообще и не передаёт явное мужское обозначение исходного текста. «Мужчины Ниневии» сохраняет это различие, существенное также в сопоставлении с царицей юга в предыдущем стихе. Остальные ключевые соответствия точны: «восстанут на суде», «осудят», «покаялись в ответ на проповедь Ионы» и нейтральное «нечто большее, чем Иона» адекватно передают греческий текст.'
