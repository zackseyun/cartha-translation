id: LUK.11.16
reference: Luke 11:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: ru
  text: А другие, испытывая Его, просили у Него знамения с неба.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесного знамения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: другие
  rationale: Передаёт противопоставление этой группы людям, упомянутым ранее, без добавления отсутствующего в греческом слова «некоторые».
- source_word: δὲ
  choice: А
  rationale: Естественно выражает в русском языке мягкое противопоставление или переход к реакции другой группы.
- source_word: πειράζοντες
  choice: испытывая Его
  rationale: В контексте означает проверку Иисуса с недоброжелательным намерением; «искушая» могло бы неоправданно сузить смысл до склонения ко греху. Местоимение «Его» восполняет ясный из контекста объект.
- source_word: σημεῖον
  choice: знамения
  rationale: Сохраняет обычный библейский термин и не добавляет прямо не выраженного определения «чудесного».
- source_word: ἐξ οὐρανοῦ
  choice: с неба
  rationale: Естественно передаёт небесное происхождение или подтверждение требуемого знамения.
- source_word: ἐζήτουν
  choice: просили
  rationale: В сочетании со знамением глагол обозначает просьбу или требование предоставить его. Несовершенный вид передаёт продолженный или повторявшийся характер действия.
- source_word: παρ’ αὐτοῦ
  choice: у Него
  rationale: Передаёт Иисуса как того, от кого ожидали знамения, и избегает неестественного повтора конструкции «от Него… с неба».
theological_decisions:
- issue: Характер требуемого знамения
  choice: знамения с неба
  alternative: небесного знамения
  rationale: Основной вариант сохраняет значение небесного происхождения или удостоверения, не уточняя сверх текста, какого именно рода знамение ожидалось.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Просили» звучит естественно, тогда как контекст и оборот «испытывая Его» сохраняют враждебный характер просьбы.
