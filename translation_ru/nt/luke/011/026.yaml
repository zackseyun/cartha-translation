id: LUK.11.26
reference: Luke 11:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: ru
  text: Тогда он идёт и берёт с собой семь других духов[b], злее его самого[a]. Они, войдя, поселяются там, и последнее состояние того человека становится хуже прежнего[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «порочнее его самого».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте сказано «духов», а не прямо «бесов» или «нечистых духов», хотя из контекста ясно, что речь идёт о злых духах.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «итоговое положение того человека оказывается хуже первоначального».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно обозначает следующий этап повествования.
- source_word: πορεύεται
  choice: идёт
  rationale: Передаёт обычное значение движения и сохраняет настоящее историческое время греческого повествования.
- source_word: παραλαμβάνει
  choice: берёт с собой
  rationale: Выражает не просто взятие, а присоединение спутников к себе.
- source_word: ἕτερα πνεύματα
  choice: других духов
  rationale: Сохраняет буквальное «духов», не добавляя отсутствующих здесь определений «нечистых» или «бесов».
- source_word: πονηρότερα ἑαυτοῦ
  choice: ещё злее его самого
  rationale: Передаёт сравнительную степень и однозначно относит сравнение к первоначальному духу; мужской род обусловлен русским существительным «дух».
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Они входят и поселяются там
  rationale: Нейтрально и естественно передаёт вход и последующее постоянное пребывание. Единственное число греческого глагола допустимо при подлежащем среднего рода во множественном числе и не требует единственного числа в русском.
- source_word: τὰ ἔσχατα
  choice: последнее состояние
  rationale: В данном контексте выражение обозначает последующее, итоговое положение человека, а не буквально его «последние вещи».
- source_word: τῶν πρώτων
  choice: прежнего
  rationale: Естественно выражает противопоставление последнего состояния исходному.
theological_decisions:
- issue: Уточнять ли природу духов словами «бесы» или «нечистые духи»
  choice: духов
  alternative: бесов; нечистых духов
  rationale: Контекст ясно указывает на враждебных духов, однако в самом стихе стоит только πνεύματα; перевод не добавляет отсутствующего определения.
- issue: Субъект глагола κατοικεῖ при множественном εἰσελθόντα
  choice: Они входят и поселяются
  alternative: войдя, он поселяется
  rationale: В греческом языке подлежащее среднего рода во множественном числе может согласовываться с глаголом в единственном числе. Русское множественное число сохраняет естественную связь с семью духами и не создаёт нового богословского различия.
- issue: Передача ἀνθρώπου
  choice: того человека
  alternative: того мужчины
  rationale: ἄνθρωπος здесь обозначает конкретного человека, но не подчёркивает его пол; русское «человек» точно сохраняет этот смысл.
translation_notes:
  register: Современный литературный русский язык с простым, повествовательным синтаксисом. Местоимение «он» естественно согласовано с русским словом «дух». «Поселяются» передаёт длительное обитание точнее, чем нейтральное «живут», и остаётся понятным широкому читателю.
