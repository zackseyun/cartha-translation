  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: ru
  text: Иисус изгонял беса, из-за которого человек не мог говорить[a]. Когда бес вышел, немой заговорил, и толпы изумились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «немого беса». Греческое слово может означать «немой» или «глухой»; здесь по контексту речь идёт о немоте человека, потому что после выхода беса он заговорил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: изгонял
  rationale: Перифрастический имперфект обозначает продолжавшееся в прошлом действие; русское несовершенное «изгонял» естественно передаёт этот видовой оттенок.
- source_word: δαιμόνιον
  choice: беса
  rationale: Прямое и традиционно понятное обозначение злого духовного существа; «нечистый дух» добавило бы отсутствующее в стихе определение.
- source_word: κωφόν
  choice: который лишал человека речи
  rationale: При δαιμόνιον прилагательное грамматически характеризует беса как «немого», однако контекст показывает, что его действие проявлялось в немоте человека. Развёрнутая формулировка звучит по-русски естественно и не создаёт нелепого впечатления, будто речь идёт лишь о неспособности беса говорить.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Когда бес вышел
  rationale: 'Естественно передаёт временную последовательность: выход беса предшествует речи человека; служебное ἐγένετο не требует буквального «случилось».'
- source_word: ἐλάλησεν
  choice: заговорил
  rationale: В данном контексте русское «заговорил» естественно обозначает наступление способности говорить после немоты, не добавляя продолжительного разговора.
- source_word: ὁ κωφός
  choice: немой
  rationale: Субстантивированное прилагательное обозначает человека, который не мог говорить; контекст прямо подтверждает значение «немой», хотя κωφός может также означать «глухой».
- source_word: ἐθαύμασαν
  choice: изумился
  rationale: Передаёт сильное удивление и хорошо соответствует современному литературному повествованию.
- source_word: οἱ ὄχλοι
  choice: народ
  rationale: Собирательное «народ» идиоматично в русском библейском повествовании. Оно передаёт присутствующую массу людей, хотя формально греческое слово стоит во множественном числе.
theological_decisions:
- issue: Природа недуга и язык изгнания
  choice: Сохранить прямое повествование о реальном бесе, изгнание которого привело к восстановлению речи человека.
  alternative: Передать δαιμόνιον как неопределённую болезнь либо устранить явную сверхъестественную причинность.
  rationale: Греческий текст прямо называет беса и связывает его выход с тем, что немой заговорил; перевод не должен ни рационализировать это утверждение, ни дополнять его.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Однажды» естественно вводит эпизод и передаёт повествовательную конструкцию без тяжеловесного буквализма; «бес» и «изгонял» сохраняют ясный язык экзорцизма. Маркер [a] поставлен непосредственно после фразы, которую поясняет сноска.
