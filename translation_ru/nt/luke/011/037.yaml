  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: ru
  text: Когда Он говорил, один фарисей пригласил Его разделить с ним трапезу. Иисус вошёл и возлёг за столом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Во время трапезы было принято возлежать у стола, опираясь на ложа.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Когда Он ещё говорил
  rationale: Конструкция ἐν с субстантивированным инфинитивом выражает одновременность; «когда Он ещё говорил» естественно передаёт продолжающееся действие.
- source_word: ἐρωτᾷ
  choice: пригласил
  rationale: Буквально глагол означает «просит», но придаточное цели ὅπως ἀριστήσῃ показывает, что речь идёт о приглашении на трапезу. Прошедшее время естественно для русского повествования, где сохранение греческого исторического настоящего звучало бы немотивированно.
- source_word: Φαρισαῖος
  choice: один фарисей
  rationale: Неопределённое лицо в русском повествовании естественно вводится словом «один»; название группы передано традиционным русским словом.
- source_word: ὅπως ἀριστήσῃ
  choice: пообедать
  rationale: ἀριστάω обозначает принятие утренней или дневной пищи. «Пообедать» естественно передаёт дневную трапезу, не придавая ей оттенка торжественного ужина.
- source_word: παρ’ αὐτῷ
  choice: у него
  rationale: Выражение буквально значит «у него/с ним»; «у него» точно сохраняет локально-социальную неопределённость и не добавляет прямо не названный дом.
- source_word: εἰσελθὼν
  choice: Иисус вошёл
  rationale: Аористное причастие обозначает действие, предшествующее основному. Имя восстанавливает субъект по контексту и устраняет неясность после упоминания фарисея.
- source_word: ἀνέπεσεν
  choice: возлёг за столом
  rationale: Глагол обозначает принятую в ту эпоху позу полулёжа во время трапезы. «Возлёг» сохраняет историческую деталь, а «за столом» ясно обозначает ситуацию.
