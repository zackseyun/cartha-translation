  to: Когда Он говорил, один фарисей пригласил Его разделить с ним трапезу. Иисус вошёл и возлёг за столом.[a]
  rationale: Нейтральное обозначение трапезы устраняет излишнюю временную конкретизацию глагола ἀριστάω. Сноска исправлена так, чтобы пояснять культурную деталь, передаваемую ἀνέπεσεν, без добавления характеристики трапезы, которой нет в оригинале.
