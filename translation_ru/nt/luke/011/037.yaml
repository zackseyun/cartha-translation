translation_notes:
  register: Современный литературный русский с умеренно традиционным библейским словом «возлёг», необходимым для передачи исторической позы за трапезой. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно устойчивой русской библейской издательской практике.
