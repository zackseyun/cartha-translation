  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: ru
  text: 'Но некоторые из них сказали: «Он изгоняет бесов силой Веельзевула[a], правителя бесов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Веельзевув — традиционная форма этого имени; в греческом тексте здесь: Веельзевул.'
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Но некоторые из них
  rationale: Передаёт неопределённую часть присутствующих и контраст с реакцией окружающих в контексте.
- source_word: εἶπον
  choice: сказали
  rationale: Аорист обозначает высказывание как целостное событие; простая форма естественна по-русски.
- source_word: Ἐν Βεελζεβοὺλ
  choice: силой Веельзевула
  rationale: Предлог ἐν здесь выражает средство или действующую силу. Такая формулировка ясно передаёт обвинение, будто Иисус действует властью Веельзевула.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: правителя бесов
  rationale: ἄρχων обозначает властителя или правителя; перевод сохраняет представление о власти над бесами, не добавляя поздней демонологической системы.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: Он изгоняет бесов
  rationale: ἐκβάλλω в контексте экзорцизма естественно передаётся глаголом «изгонять», а δαιμόνια прямо обозначает бесов.
theological_decisions:
- issue: Передача имени Βεελζεβούλ
  choice: Веельзевул
  alternative: Вельзевул
  rationale: Основной текст следует греческой форме имени; более привычная сокращённая русская форма отмечена в сноске.
- issue: Передача ἄρχων
  choice: правитель бесов
  alternative: князь бесов
  rationale: «Правитель» ясно выражает власть, тогда как традиционное «князь» в современном русском может восприниматься как особый титул, которого греческое слово само по себе не требует.
translation_notes:
  register: Современный литературный русский язык; обвинение передано ясно и сдержанно. Синтаксис естественный, без архаичного «князь бесовский».
