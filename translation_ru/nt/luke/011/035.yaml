  source_fidelity: 'Основной вариант «не оказался тьмой» смещает значение: он вводит оттенок обнаружения/выявления того, что нечто лишь казалось светом. В греческом стоит простая связка ἐστίν («есть/является»), без этого дополнительного эпистемического нюанса. Формулировка «не был тьмой» точнее передаёт предупреждение, сохраняя метафору и её намеренную широту.'
  naturalness: «Итак, смотри, чтобы свет в тебе не был тьмой» — естественная, краткая и литературная русская фраза с уместной предостерегающей интонацией. Относительное «который в тебе» допустимо, но менее компактно и не требуется греческой конструкцией.
  terminology: «Свет» и «тьма» сохранены без доктринального истолкования. «Итак» адекватно передаёт οὖν, а «смотри, чтобы… не» — естественная передача σκόπει… μὴ.
