  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: ru
  text: Итак, смотри, чтобы свет в тебе не был тьмой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Итак, следи, чтобы свет в тебе не был тьмой».'
    reason: 'Лексическая альтернатива: σκόπει может передаваться как «следи».'
lexical_decisions:
- source_word: σκόπει
  choice: смотри
  rationale: Настоящее повелительное наклонение во втором лице единственного числа выражает продолжающееся внимание и предостережение. В сочетании «смотри, чтобы» современное русское «смотри» естественно передаёт побудительную силу глагола.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения о глазе, свете и тьме и звучит естественно в современном литературном русском.
- source_word: μὴ
  choice: чтобы… не
  rationale: После повелительного «смотри» конструкция естественно выражает предостережение о нежелательной возможности.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: свет, который в тебе
  rationale: Сохраняет образ света и внутреннее расположение, не сводя его значение к совести, разумению или духовному состоянию.
- source_word: σκότος
  choice: тьмой
  rationale: Буквально сохраняет контраст света и тьмы; творительный падеж требуется русской именной конструкцией.
- source_word: ἐστίν
  choice: не оказался
  rationale: В русской предупредительной конструкции «чтобы… не оказался» естественно передаёт опасение, что принимаемое за свет в действительности является тьмой, не утверждая изменения света во тьму.
theological_decisions:
- issue: Метафорический смысл света и тьмы
  choice: Сохранить широкую метафору без уточняющей интерпретации.
  alternative: Передать «свет» как разумение, совесть или внутреннее духовное состояние.
  rationale: Греческий текст не сужает образ до одного аспекта человеческой внутренней жизни; контекст связывает его и с восприятием, и с внутренним состоянием.
- issue: Характер предостережения
  choice: «не оказался тьмой»
  alternative: «не стал тьмой» или «не есть тьма»
  rationale: Речь, вероятнее всего, не о превращении света в тьму, а о возможности ошибочно принимать тьму за свет. Выбранная формулировка сохраняет эту смысловую напряжённость и естественна по-русски.
translation_notes:
  register: Современный литературный русский с краткой, весомой формой предостережения. Образы света и тьмы сохранены без конфессионального или психологизирующего толкования.
