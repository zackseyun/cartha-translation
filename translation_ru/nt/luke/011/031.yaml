id: LUK.11.31
reference: Luke 11:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ru
  text: Царица Юга[a] восстанет на суде вместе с мужчинами этого поколения и осудит их, потому что она пришла с краёв земли, чтобы услышать мудрость Соломона. И вот[b], здесь — нечто большее, чем Соломон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть царица, которую обычно отождествляют с царицей Савской (см. 3 Царств 10:1–13; 2 Паралипоменон 9:1–12).
    reason: cross_reference
  - marker: b
    text: 'Или: «Тот, кто больше Соломона». В греческом употреблено выражение среднего рода, буквально «нечто большее, чем Соломон»; оно может подчёркивать не только прямое сравнение двух лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Царица Юга
  rationale: Буквально передаёт греческое сочетание и сохраняет ветхозаветную аллюзию, не подменяя исходное выражение уточняющим именованием «царица Савская».
- source_word: ἐγερθήσεται
  choice: восстанет
  rationale: Передаёт появление царицы на эсхатологическом суде и сохраняет возможный оттенок воскресения, не делая его единственным смыслом.
- source_word: ἐν τῇ κρίσει
  choice: на суде
  rationale: Естественное русское обозначение определённого эсхатологического суда.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: вместе с мужчинами
  rationale: Сохраняет конкретно мужское значение ἀνδρῶν, не заменяя его более общим словом «люди».
- source_word: τῆς γενεᾶς ταύτης
  choice: этого поколения
  rationale: Обозначает поколение современников Иисуса и соответствует обычному синоптическому употреблению γενεά.
- source_word: κατακρινεῖ αὐτούς
  choice: осудит их
  rationale: Передаёт сильное значение κατακρίνω — не просто судить, а вынести осуждение.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: с краёв земли
  rationale: Сохраняет образное обозначение чрезвычайно далёкого места.
- source_word: ἀκοῦσαι
  choice: чтобы услышать
  rationale: Передаёт цель её прихода, выраженную инфинитивом.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: мудрость Соломона
  rationale: Точно и естественно передаёт объект, ради которого пришла царица.
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет торжественный указательный возглас, привлекающий внимание к кульминационному утверждению.
- source_word: πλεῖον Σολομῶνος
  choice: нечто большее, чем Соломон
  rationale: Сохраняет средний род греческого πλεῖον и не сводит высказывание исключительно к прямому сравнению двух лиц.
- source_word: ὧδε
  choice: здесь
  rationale: Кратко и естественно передаёт указание на присутствие в данном месте.
theological_decisions:
- issue: Следует ли прямо назвать царицу Юга царицей Савской
  choice: В основном тексте сохранено «Царица Юга»
  alternative: царица Савская
  rationale: Связь с рассказом о царице Савской весьма вероятна, однако греческий текст употребляет выражение «царица Юга»; идентификация вынесена в примечание.
- issue: Следует ли передать πλεῖον Σολομῶνος как личное «Тот, кто больше Соломона»
  choice: нечто большее, чем Соломон
  alternative: Тот, кто больше Соломона
  rationale: Прилагательное стоит в среднем роде. Выбранный вариант сохраняет возможность более широкого указания на присутствующую в Иисусе реальность, не отрицая личной отнесённости к нему.
- issue: Следует ли явно выразить воскресение в ἐγερθήσεται
  choice: восстанет
  alternative: будет воскрешена
  rationale: В контексте суда глагол может обозначать как эсхатологическое воскресение, так и выступление на суде. «Восстанет» сохраняет обе смысловые возможности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Восстанет» сохраняет судебный и эсхатологический оттенки; «мужчинами» выбрано ради точной передачи мужского значения ἀνδρῶν, хотя сочетание намеренно звучит менее традиционно, чем «людьми».
