lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: И пока Он ехал
  rationale: Родительный самостоятельный оборот с причастием настоящего времени выражает действие, одновременное с последующим. В контексте Иисус передвигается верхом, поэтому «ехал» естественнее общего «шёл»; «пока» сохраняет длительность и одновременность.
- source_word: δέ
  choice: И
  rationale: Здесь δέ — слабая повествовательная связка без выраженного противопоставления; союз «и» естественно продолжает рассказ.
- source_word: ὑπεστρώννυον
  choice: расстилали
  rationale: Имперфект передаёт продолжающееся или повторяющееся действие. Форма «расстилали» сохраняет этот видовой оттенок и хорошо сочетается с одеждой, которую клали на путь.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: свои плащи
  rationale: Ἱμάτια обозначает одежду и нередко верхнюю одежду. В данной сцене «плащи» — конкретный и понятный русский эквивалент; возвратное ἑαυτῶν естественно передано словом «свои».
- source_word: ἐν τῇ ὁδῷ
  choice: на дороге
  rationale: Оборот обозначает место действия. «На дороге» ясно передаёт, что одежду расстилали на пути следования, и звучит естественно по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно-торжественное. Местоимение «Он» применительно к Иисусу написано с прописной буквы. Слово «люди» добавлено для естественности русского синтаксиса, поскольку греческое личное окончание глагола оставляет субъект подразумеваемым.
