source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: ru
  text: 'сказав: «Идите в селение напротив вас. Войдя в него, вы найдёте привязанного ослёнка, на которого ещё никто никогда не садился. Отвяжите его и приведите».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμην
  choice: селение
  rationale: Нейтрально и естественно передаёт небольшое поселение, не уточняя его административный статус.
- source_word: πῶλον
  choice: ослёнка
  rationale: Само слово может обозначать детёныша вьючного животного, однако контекст Лк. 19:35 и параллельная традиция ясно указывают на молодого осла.
- source_word: κατέναντι
  choice: напротив
  rationale: Прямо передаёт пространственное отношение без добавления отсутствующего в греческом местоимения.
- source_word: δεδεμένον
  choice: привязанного
  rationale: 'Естественный русский эквивалент совершенного страдательного причастия: животное находится в привязанном состоянии.'
- source_word: οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν
  choice: на которого ещё никто никогда не садился
  rationale: Сохраняет усиленное отрицание πώποτε и естественно передаёт ἀνθρώπων без тяжеловесного «никто из людей».
- source_word: λύσαντες αὐτὸν ἀγάγετε
  choice: Отвяжите его и приведите
  rationale: Передаёт последовательность действий, выраженную аористным причастием и повелительным наклонением, естественной русской конструкцией.
theological_decisions: []
