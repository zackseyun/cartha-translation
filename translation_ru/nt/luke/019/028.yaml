  naturalness: 'Сочетание «пошёл дальше впереди всех» стилистически тяжеловесно: «дальше» и «впереди» частично дублируют друг друга, а управление «впереди всех» делает фразу менее естественной. «Пошёл вперёд» кратко и естественно передаёт движение впереди/вперёд.'
  terminology: «Иисус», «Иерусалим» и «поднимаясь в Иерусалим» соответствуют современному литературному библейскому употреблению. Сноски не требуются.
