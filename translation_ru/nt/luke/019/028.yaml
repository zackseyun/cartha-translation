  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: ru
  text: Сказав это, Иисус пошёл вперёд, поднимаясь в Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: не передано отдельным словом
  rationale: В русском повествовании связь с предыдущим событием естественно выражена последовательностью деепричастного оборота и главного предложения; начальное «и» здесь было бы допустимо, но звучало бы несколько тяжеловесно.
- source_word: εἰπὼν ταῦτα
  choice: Сказав это
  rationale: Естественно передаёт предшествующее действие аористного причастия и не сужает ταῦτα до обозначения только слов.
- source_word: ἐπορεύετο
  choice: пошёл дальше
  rationale: Передаёт продолжение движения в повествовании и значение имперфекта без неестественной конструкции «продолжал идти».
- source_word: ἔμπροσθεν
  choice: впереди всех
  rationale: Наречие указывает, что Иисус шёл впереди сопровождавших его людей; добавление «всех» делает подразумеваемое отношение ясным и естественным по-русски.
- source_word: ἀναβαίνων
  choice: поднимаясь
  rationale: Сохраняет образ восхождения к Иерусалиму и одновременность действия с основным глаголом.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Обычное русское обозначение движения к городу; не утверждает, что вход в город уже состоялся.
theological_decisions:
- issue: Сохранение языка восхождения к Иерусалиму
  choice: поднимаясь в Иерусалим
  alternative: направляясь в Иерусалим
  rationale: Так сохраняются географический образ и повествовательная выразительность ἀναβαίνων без добавления явно богословского толкования.
- issue: Явное называние подлежащего
  choice: Иисус
  alternative: он
  rationale: В греческом подлежащее подразумевается формой глагола и контекстом; в отдельном русском стихе имя устраняет возможную неясность, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык; краткая и плавная повествовательная фраза. Сохранён достойный библейский регистр без архаизмов. Подлинной текстовой или смысловой неоднозначности, требующей сноски, в стихе нет.
