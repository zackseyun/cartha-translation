lexical_decisions:
- source_word: ἀπελθόντες
  choice: пошли
  rationale: Аористное причастие ἀπέρχομαι обозначает предшествующее действие — отправившись, они пришли к описанному месту. В русском повествовании личная форма «пошли» передаёт это естественно и без тяжеловесности.
- source_word: δὲ
  choice: и
  rationale: Здесь δέ служит связкой при продолжении повествования. Союз «и» естественно соединяет действия, не придавая связке излишнего причинно-следственного значения.
- source_word: οἱ ἀπεσταλμένοι
  choice: посланные
  rationale: Артиклированное причастие совершенного вида в страдательном залоге употреблено субстантивно. «Посланные» сохраняет пассивный смысл и не вводит более специального обозначения «посланники».
- source_word: εὗρον
  choice: нашли всё
  rationale: В греческом прямое дополнение не выражено и восстанавливается из контекста. Русское «нашли всё так» идиоматично указывает на полное соответствие увиденного сказанному, не ограничивая подразумеваемое дополнение только ослёнком.
- source_word: καθὼς
  choice: так, как
  rationale: καθώς выражает соответствие между произошедшим и ранее сказанным. Русская конструкция «всё так, как» естественно передаёт это точное соответствие.
- source_word: εἶπεν αὐτοῖς
  choice: Он им сказал
  rationale: Буквальное значение λέγω передаётся глаголом «сказал»; порядок слов естественен для русского языка. Заглавная буква в местоимении соответствует принятому в русском библейском регистре уважительному обозначению Иисуса.
