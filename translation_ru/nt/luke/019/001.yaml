base_translation:
  language: en
  yaml_path: translation/nt/luke/019/001.yaml
  text: And he entered and was passing through Jericho[a].
translation:
  language: ru
  text: Войдя в Иерихон, Иисус проходил через город.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «И, войдя, проходил через Иерихон».'
    reason: Более формальная передача греческой конструкции и начального союза.
lexical_decisions:
- source_word: Καὶ
  choice: не передано отдельным словом
  rationale: В русском повествовании связь с предыдущим событием естественно выражается последовательностью фраз; начальное «И» здесь необязательно и утяжеляет изложение.
- source_word: εἰσελθὼν
  choice: войдя
  rationale: Деепричастие кратко и естественно передаёт аористное причастие и действие, предшествующее основному глаголу.
- source_word: διήρχετο
  choice: проходил через город
  rationale: Прошедшее несовершенного вида сохраняет незавершённый, протекающий характер имперфекта. Добавление «город» делает русскую конструкцию естественной и не меняет референт.
- source_word: τὴν Ἰεριχώ
  choice: Иерихон
  rationale: Устоявшаяся русская форма названия; при глаголе движения употребляется винительный падеж.
theological_decisions:
- issue: Явное обозначение подлежащего
  choice: Иисус
  alternative: он
  rationale: В греческом подлежащее подразумевается глагольной формой и определяется контекстом. В начале русского стиха имя «Иисус» обеспечивает ясность без богословского уточнения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанный. Несовершенный вид «проходил» сохраняет аспект основного греческого глагола; деепричастный оборот передаёт последовательность действий.
