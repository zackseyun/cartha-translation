  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: ru
  text: Когда Он приблизился к Вифагии и Вифании, к горе, называемой Елеонской, Он послал двух учеников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Когда
  rationale: Луканская повествовательная формула вместе с временным ὡς естественно передаётся по-русски придаточным времени; буквальное «и случилось, когда» здесь было бы тяжеловесным.
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: приблизился к Вифании и Вифагии
  rationale: Глагол обозначает приближение к месту. Порядок названий приведён в естественной для русской библейской географии форме, хотя в греческом тексте сначала названа Вифагия.
- source_word: πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν
  choice: к горе, называемой Елеонской
  rationale: Оборот передаёт направление к горе и её традиционное русское название; греческое Ἐλαιῶν буквально связано с оливами, но «Елеонская гора» ясно и привычно современному читателю.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычное повествовательное значение аориста передано простым русским глаголом.
- source_word: δύο τῶν μαθητῶν
  choice: двух учеников
  rationale: Русская конструкция естественно выражает двух представителей группы учеников; притяжательное «Своих» не добавлено, поскольку его нет в греческом тексте.
