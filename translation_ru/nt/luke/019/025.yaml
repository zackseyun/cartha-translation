lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простую повествовательную связь, не добавляя явно не выраженного временного или противительного оттенка.
- source_word: εἶπαν αὐτῷ
  choice: сказали ему
  rationale: Аорист передан обычным для русского повествования прошедшим временем; дательный αὐτῷ обозначает адресата речи.
- source_word: Κύριε
  choice: Господин
  rationale: Внутри притчи это естественное уважительное обращение к властному хозяину или правителю. Вариант «Господи» сохраняется в примечании, поскольку κύριος допускает такую передачу и повествование может иметь более широкий смысловой резонанс.
- source_word: ἔχει
  choice: у него
  rationale: Естественно передаёт обладание в настоящем времени без добавления отсутствующего в греческом усиления «уже».
- source_word: δέκα μνᾶς
  choice: десять мин
  rationale: Историческая денежная единица сохранена транслитерацией, а не заменена потенциально вводящим в заблуждение современным эквивалентом; после числительного требуется родительный множественного числа «мин».
theological_decisions:
- issue: Передача κύριος в прямом обращении внутри притчи
  choice: Господин
  alternative: Господи; владыка
  rationale: «Господин» естественно звучит как обращение к персонажу притчи и не превращает реплику в явно богословское исповедание. Примечание сохраняет лексическую возможность перевода «Господи» и тем самым не устраняет смысловой резонанс обращения.
translation_notes:
  register: Современный литературный русский язык с естественным порядком слов. Восклицательный знак передаёт возражающий характер реплики в контексте; исторический термин «мина» пояснён в сноске.
