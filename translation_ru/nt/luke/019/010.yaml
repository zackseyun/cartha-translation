  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: ru
  text: Ибо Сын Человеческий пришёл, чтобы искать и спасти потерянное[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что было потеряно». Греческое выражение стоит в единственном числе среднего рода и может иметь обобщённый смысл.'
    reason: Лексическая альтернатива и пояснение грамматической обобщённости τὸ ἀπολωλός.
lexical_decisions:
- source_word: ἦλθεν
  choice: пришёл
  rationale: Аорист изъявительного наклонения естественно передаётся прошедшим временем; глагол сохраняет смысл прихода Сына Человеческого ради определённой миссии.
- source_word: γὰρ
  choice: ибо
  rationale: Союз вводит объяснение предыдущего высказывания. «Ибо» ясно передаёт причинно-пояснительную связь и соответствует достойному литературному регистру.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохранено традиционное титульное именование Иисуса, передающее библейские и богословские ассоциации выражения без истолковывающего пересказа.
- source_word: ζητῆσαι
  choice: искать
  rationale: Инфинитив выражает цель прихода. «Искать» точно передаёт намеренное разыскивание и не подменяет процесс его результатом, как могло бы сделать слово «найти».
- source_word: σῶσαι
  choice: спасти
  rationale: Глагол сохраняет широкий спасительный смысл, особенно важный после упоминания спасения в Лк 19:9, и не сужает значение до физического избавления.
- source_word: τὸ ἀπολωλός
  choice: погибшее
  rationale: Субстантивированное причастие среднего рода единственного числа обозначает находящееся в состоянии погибели или утраты. Русское «погибшее» сохраняет грамматическую обобщённость и богословскую ёмкость выражения.
theological_decisions:
- issue: Объём и отнесённость выражения τὸ ἀπολωλός
  choice: погибшее
  alternative: того, кто погиб; то, что было потеряно
  rationale: Греческая форма среднего рода единственного числа может употребляться обобщённо. Перевод не ограничивает слова одним мужчиной — Закхеем, — но и не превращает грамматическое единственное число в явное множественное; тем самым сохраняется связь и с непосредственным контекстом, и с более широким описанием миссии Иисуса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ибо» и традиционный титул «Сын Человеческий» поддерживают достоинство речи; синтаксис остаётся ясным для современного читателя. Сочетание «искать и спасти» намеренно сохраняет различие между поиском и его спасительной целью.
