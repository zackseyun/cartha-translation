lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: И этому он сказал
  rationale: Передаёт повествовательную связку δέ и указательное τούτῳ с добавочным καί; русское «этому» в данном контексте естественно подразумевает «и этому также».
- source_word: Καὶ σὺ
  choice: И ты
  rationale: Сохраняет прямое обращение, эмфазу и параллелизм греческой фразы.
- source_word: ἐπάνω γίνου
  choice: управляй
  rationale: Сочетание ἐπάνω с повелительным γίνου обозначает поставление над городами и осуществление власти; «управляй» естественно и ясно выражает это по-русски, не усиливая оттенок сверх контекста.
- source_word: πέντε πόλεων
  choice: пятью городами
  rationale: πόλις обычно означает «город», а творительный падеж естественно зависит от русского глагола «управлять».
