  text: 'И этому он тоже сказал: «И ты управляй пятью городами».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь поставлен над пятью городами»; «имей власть над пятью городами».'
