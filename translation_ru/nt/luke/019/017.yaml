lexical_decisions:
- source_word: Εὖγε
  choice: Хорошо
  rationale: Естественное русское восклицание одобрения в прямом обращении; передаёт похвалу без излишнего усиления.
- source_word: ἀγαθὲ
  choice: добрый
  rationale: Прямое соответствие прилагательному в звательном обращении к слуге.
- source_word: δοῦλε
  choice: слуга
  rationale: В контексте притчи естественно обозначает подчинённого господину человека; значение «раб» сохраняется в сноске.
- source_word: ἐν ἐλαχίστῳ
  choice: в самом малом
  rationale: Кратко и идиоматично передаёт верность в деле крайне малого значения или объёма.
- source_word: πιστὸς ἐγένου
  choice: ты оказался верен
  rationale: 'Передаёт оценочный смысл сочетания πιστός с ἐγένου: поведение слуги показало его верность, не превращая оборот в простое «стал верным».'
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: управляй
  rationale: В контексте власти над городами естественно выражает повеление быть наделённым управленческими полномочиями.
- source_word: ἐπάνω δέκα πόλεων
  choice: десятью городами
  rationale: Творительный падеж при «управляй» естественно передаёт власть над десятью городами.
theological_decisions:
- issue: Передача δοῦλος в притче об отношениях господина и подчинённого
  choice: слуга
  alternative: раб
  rationale: «Слуга» естественнее в современном русском повествовании и сохраняет отношение подчинения; более жёсткое социально-правовое значение слова отмечено в сноске.
- issue: Характер власти над десятью городами
  choice: управляй десятью городами
  alternative: имей власть над десятью городами
  rationale: Контекст награды предполагает поручение управления. Выбор не уточняет форму правления и сохраняет общий смысл ἐξουσία.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. Синтаксис сделан естественным для устного обращения; сохранены похвала, основание награды и повелительный характер поручения.
