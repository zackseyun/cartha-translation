revisions:
- from: 'И он сказал ему[a]: «Хорошо, добрый слуга! За то, что ты оказался верен в самом малом, управляй десятью городами».'
  to: 'И он сказал ему[a]: «Хорошо, добрый слуга! За то, что ты был верен в самом малом, имей власть над десятью городами».'
  rationale: Заменено «управляй десятью городами» на «имей власть над десятью городами», чтобы прямо передать ἐξουσία и не сужать смысл до административной деятельности. «Ты оказался верен» заменено на более нейтральное «ты был верен», не добавляющее оттенка обнаружения, отсутствующий как обязательный в греческом тексте.
