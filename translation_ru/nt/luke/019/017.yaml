base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: ru
  text: 'И он сказал ему[a]: «Хорошо, добрый слуга! За то, что ты был верен в самом малом, имей власть над десятью городами».'
  philosophy: optimal-equivalence
  footnotes:
