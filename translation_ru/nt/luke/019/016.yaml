base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: ru
  text: 'Первый пришёл и сказал: «Господин[a], твоя мина принесла ещё десять мин».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хозяин». Греческое обращение может также передаваться как «Господь», однако здесь оно обращено к господину из притчи.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο δὲ ὁ πρῶτος λέγων
  choice: Первый пришёл и сказал
  rationale: Дословное причастное построение «пришёл, говоря» по-русски тяжеловесно; сочинительная конструкция естественно передаёт последовательность повествования и одновременную речь.
- source_word: Κύριε
  choice: Господин
  rationale: Внутри притчи это уважительное обращение раба к высокопоставленному хозяину. «Господин» передаёт контекстуальный смысл κύριε, не превращая обращение в прямое исповедание божественного титула.
- source_word: ἡ μνᾶ σου
  choice: твоя мина
  rationale: Сохранено историческое название денежно-весовой единицы и подчёркнуто, что исходная мина принадлежала господину.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: принесла ещё десять мин
  rationale: Приставка προσ- указывает на дополнительный результат. Оборот «принесла ещё десять мин» естественен для денежного дохода и ясно показывает, что речь идёт о десяти минах сверх первоначальной.
theological_decisions:
- issue: Значение κύριε в обращении внутри притчи
  choice: Господин
  alternative: Господь; Хозяин
  rationale: Греческое κύριε может быть как титулом «Господь», так и почтительным обращением к земному начальнику. Здесь непосредственный адресат — знатный хозяин из притчи, поэтому «Господин» точнее в данном повествовательном контексте; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; речь лаконична и естественна для устного отчёта слуги. Исторический термин «мина» сохранён, а дополнительный характер прибыли выражен словом «ещё».
