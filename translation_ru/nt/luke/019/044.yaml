base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: ru
  text: и сровняют с землёй тебя — и твоих детей в тебе, — и не оставят в тебе камня на камне, потому что ты не распознала времени твоего посещения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «времени проверки тебя». Греческое слово может означать посещение или проверку, особенно Божье посещение, которое способно принести как милость, так и суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: сровняют с землёй
  rationale: Глагол означает низвергнуть или разрушить до основания. Русское выражение естественно передаёт полноту разорения и сохраняет образ земли.
- source_word: σε
  choice: тебя
  rationale: Сохранено прямое обращение к олицетворённому Иерусалиму; замена на «твой город» была бы излишним истолкованием.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: твоими детьми, находящимися в тебе
  rationale: τέκνα передано буквально как «дети», чтобы сохранить образ Иерусалима как матери, а ἐν σοί — как нахождение людей внутри города. Оборот с «вместе с» естественно связывает их участь с участью города.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: не оставят в тебе камня на камне
  rationale: Устойчивое русское выражение точно передаёт образ полного разрушения; «в тебе» сохраняет повторное указание на внутреннее пространство Иерусалима.
- source_word: ἀνθ’ ὧν
  choice: потому что
  rationale: В данном контексте оборот указывает на причину грядущего суда; причинный союз ясен и естественен по-русски.
- source_word: ἔγνως
  choice: не распознала
  rationale: Форма женского рода согласована с олицетворённым Иерусалимом. «Распознала» передаёт не просто отсутствие знания, а неспособность понять значение решающего события.
- source_word: καιρὸν
  choice: времени
  rationale: καιρός обозначает значимое, определённое время; нейтральное «время» сохраняет смысл без добавления отсутствующего в тексте слова «назначенное».
- source_word: τῆς ἐπισκοπῆς σου
  choice: своего посещения
  rationale: «Посещение» сохраняет широкий смысл ἐπισκοπή и его библейскую окраску, не уточняя прямо ни посетителя, ни то, несёт ли посещение милость или суд. Возвратное «своего» грамматически соотносит посещение с адресатом, не меняя лица обращения.
theological_decisions:
- issue: Значение ἐπισκοπή в контексте суда
  choice: «посещение» с оставленным неявным оттенком Божьего посещения
  alternative: «проверка»; «время, когда Бог посетил тебя»
  rationale: Слово может обозначать посещение или проверку и в библейском контексте способно подразумевать Божье действие как ради милости, так и ради суда. Перевод «посещение» сохраняет эту напряжённость, не вводя в основной текст отсутствующее существительное «Бог» и не сводя смысл только к проверке.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Обращение к Иерусалиму передано во втором лице и в женском роде. Образ «детей» не заменён пояснительным «жители». Маркер сноски поставлен при слове «посещения», к которому относится пояснение.
