  source_fidelity: 'Основной текст точно передаёт обращение к олицетворённому Иерусалиму, разрушение города и «детей в тебе», образ «камня на камне», а также причинное ἀνθ’ ὧν. Однако «своего посещения» в русском языке неудачно: возвратное притяжательное может быть понято как посещение, совершаемое самим адресатом, тогда как ἐπισκοπῆς σου обозначает посещение, относящееся к Иерусалиму/обращённое к нему.'
