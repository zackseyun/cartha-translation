source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: ru
  text: 'Но его сограждане ненавидели его и послали вслед за ним делегацию[a] с заявлением: «Мы не хотим, чтобы этот человек царствовал над нами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посольство». Греческое слово обозначает представительную группу, посланную с официальным поручением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: сограждане
  rationale: Передаёт принадлежность к тому же политическому сообществу, обозначенную притяжательным αὐτοῦ, и не называет их заранее подданными царя, которого они отвергают.
- source_word: ἐμίσουν
  choice: ненавидели
  rationale: Естественно передаёт продолжительную или устойчивую враждебность, выраженную имперфектом, без излишнего усиления.
- source_word: ἀπέστειλαν
  choice: послали
  rationale: Прямой и естественный эквивалент повествовательного аориста.
- source_word: πρεσβείαν
  choice: делегацию
  rationale: Современное русское слово для представительной группы, официально отправленной с поручением; политический смысл сохранён без архаизации.
- source_word: ὀπίσω αὐτοῦ
  choice: вслед за ним
  rationale: В контексте означает, что делегацию отправили после его отъезда, по его следу.
- source_word: λέγοντες
  choice: с заявлением
  rationale: Естественно связывает отправку делегации с содержанием переданного ею официального сообщения.
- source_word: Οὐ θέλομεν
  choice: Мы не хотим
  rationale: Прямо и современно выражает волю и отказ говорящих.
- source_word: τοῦτον
  choice: этот человек
  rationale: Сохраняет дистанцирующий, слегка пренебрежительный оттенок указательного местоимения, не усиливая его до грубости.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: чтобы этот человек царствовал над нами
  rationale: Сохраняет именно царскую, а не общую административную лексику оригинала; придаточная конструкция естественна по-русски.
theological_decisions:
- issue: Царско-политическая образность притчи
  choice: царствовал над нами
  alternative: правил нами
  rationale: Глагол βασιλεύω прямо относится к царствованию. Выбор сохраняет мотив отвергнутой царской власти, но не навязывает читателю конкретного аллегорического истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Сограждане» сохраняет гражданско-политический оттенок; «делегация» звучит естественнее, чем более узкое или архаизирующее «посольство». Прямая речь передана ясно и с сохранением царской лексики.
