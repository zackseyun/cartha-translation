  source_fidelity: 'Перевод точно передаёт все существенные элементы греческого текста: πολι̂ται как «сограждане», имперфект ἐμίσουν как устойчивую ненависть, πρεσβείαν как официально направленную «делегацию», ὀπίσω αὐτοῦ как «вслед за ним», а βασιλεῦσαι ἐφ’ ἡμᾶς — с сохранением царской семантики: «царствовал над нами». Оттенок дистанцирования в τοῦτον адекватно сохранён в выражении «этот человек».'
