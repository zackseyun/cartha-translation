  source_fidelity: Сочетание «некоторые фарисеи из толпы» точно передаёт неопределённую часть фарисеев, находившихся в толпе; «Учитель» точно соответствует Διδάσκαλε. Однако «запрети своим ученикам» в русском языке обычно требует указания того, что именно запрещается, и потому не передаёт прямо переходное ἐπιτίμησον с дательным адресата. Глагол означает сделать строгое замечание, укорить, а не буквально «запретить» без дополнения.
