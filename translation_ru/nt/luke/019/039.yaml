  terminology: «Фарисеи», «Учитель» и «ученики» употреблены точно и в нейтральном современном регистре. Альтернатива «Наставник» для Διδάσκαλε допустима. Смысл ἀπὸ τοῦ ὄχλου корректно отражён основным текстом; сноска объясняет возможное более развёрнутое понимание.
