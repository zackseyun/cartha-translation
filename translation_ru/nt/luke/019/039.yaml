base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: ru
  text: 'Некоторые фарисеи из толпы[a] сказали ему: «Учитель[b], упрекни своих учеников!»'
  philosophy: optimal-equivalence
  footnotes:
