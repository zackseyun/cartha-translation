    reason: lexical_alternative
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: некоторые фарисеи
  rationale: Передаёт неопределённую часть группы фарисеев естественно для современного русского языка, без излишне буквального «некоторые из фарисеев».
- source_word: ἀπὸ τοῦ ὄχλου
  choice: из толпы
  rationale: 'Предлог ἀπό указывает на исходную среду или место: говорившие фарисеи находились среди толпы. Краткое «из толпы» сохраняет эту пространственно-групповую связь.'
- source_word: εἶπαν πρὸς αὐτόν
  choice: сказали ему
  rationale: Естественная русская передача обычной повествовательной формулы речи с πρός и винительным падежом.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Передаёт звательную форму διδάσκαλος как уважительное обращение к наставнику, не добавляя более сильного оттенка власти.
- source_word: ἐπιτίμησον
  choice: запрети
  rationale: Передаёт повеление строго пресечь поведение учеников. Это ёмкий русский эквивалент глагола ἐπιτιμάω в евангельском контексте, не вставляющий прямо не названное требование «замолчать».
- source_word: τοῖς μαθηταῖς σου
  choice: своим ученикам
  rationale: «Ученики» сохраняет устойчивое отношение учителя и учеников; возвратное «своим» естественно указывает на принадлежность подлежащему подразумеваемого действия.
theological_decisions:
- issue: Характер обращения Διδάσκαλε к Иисусу
  choice: Учитель
  alternative: Наставник; Господин
  rationale: В данном месте обращение прежде всего обозначает учительскую роль и само по себе не выражает развёрнутого христологического исповедания. «Учитель» сохраняет это значение без усиления.
- issue: Содержание приказа ἐπιτίμησον
  choice: запрети своим ученикам
  alternative: прикажи своим ученикам замолчать; строго одёрни своих учеников
  rationale: Греческий глагол требует строгого пресечения или порицания, но не называет прямо требуемый результат. Поэтому перевод не добавляет слово «замолчать», хотя контекст подразумевает прекращение возгласов.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Местоимение «ему» и притяжательное «своим» даны со строчной буквы согласно обычной современной орфографической практике; прямая речь сохраняет настойчивость повеления.
