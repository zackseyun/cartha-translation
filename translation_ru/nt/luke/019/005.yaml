id: LUK.19.5
reference: Luke 19:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: ru
  text: 'Когда Иисус пришёл к тому месту, Он посмотрел вверх и сказал ему: «Закхей, скорее спускайся, потому что сегодня Мне надлежит[a] остановиться у тебя дома[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «надлежит», может указывать на необходимость, связанную с миссией Иисуса или Божьим замыслом.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в твоём доме»; возможно также: «у тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: когда
  rationale: В повествовательной последовательности союз вводит придаточное времени; «когда» естественно передаёт его функцию.
- source_word: ἐπὶ τὸν τόπον
  choice: к тому месту
  rationale: Передаёт направительное значение выражения и отсылает к месту, где находился Закхей.
- source_word: ἀναβλέψας
  choice: посмотрел вверх
  rationale: Контекст уточняет направление взгляда Иисуса на Закхея, находившегося на дереве.
- source_word: σπεύσας κατάβηθι
  choice: скорее спускайся
  rationale: Сочетание причастия со сказуемым в повелительном наклонении выражает срочность; по-русски она естественно передаётся наречием «скорее».
- source_word: δεῖ
  choice: надлежит
  rationale: Сохраняет более сильный оттенок необходимости, чем разговорное «надо», не уточняя прямо источник этой необходимости.
- source_word: μεῖναι
  choice: остановиться
  rationale: В данном контексте означает побыть или расположиться в доме Закхея; «остановиться у кого-либо» естественно для современного русского языка.
- source_word: ἐν τῷ οἴκῳ σου
  choice: у тебя дома
  rationale: Естественно передаёт пребывание в жилище Закхея, сохраняя домашний характер встречи.
theological_decisions:
- issue: Смысл необходимости в δεῖ
  choice: Мне надлежит
  alternative: Мне надо; Мне необходимо
  rationale: В Евангелии от Луки δεῖ нередко связано с миссией Иисуса и Божьим замыслом. «Надлежит» сохраняет сильную необходимость, но не превращает возможный богословский подтекст в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. «Скорее спускайся» звучит естественно и передаёт срочность; «надлежит» намеренно сохраняет весомость δεῖ. Местоимение «Он» и форма «Мне» оформлены с прописной буквы в соответствии с распространённой русской библейской традицией.
