  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: ru
  text: 'И другой пришёл и сказал: «Господин, вот твоя мина, которую я держал завёрнутой в платок[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в кусок ткани». Греческое слово обозначает небольшой платок или ткань, которой, в частности, вытирали лицо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: другой
  rationale: В контексте это ещё один из слуг, противопоставленный уже упомянутым; русское «другой» естественно и не уточняет сверх текста, последний ли он.
- source_word: ἦλθεν λέγων
  choice: подошёл и сказал
  rationale: Греческая конструкция с причастием естественно передаётся двумя однородными сказуемыми, сохраняя последовательность приближения и речи.
- source_word: Κύριε
  choice: Господин
  rationale: Внутри притчи это прямое обращение слуги к знатному хозяину; «Господин» естественно передаёт социальное отношение и не превращает реплику персонажа в явное христологическое исповедание.
- source_word: ἰδοὺ ἡ μνᾶ σου
  choice: вот твоя мина
  rationale: «Вот» одновременно привлекает внимание и указывает на предъявляемую мину; название древней денежно-весовой единицы сохранено транслитерацией.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: Я хранил её завёрнутой
  rationale: Сочетание имперфекта с причастием описывает продолжавшееся состояние хранения; «хранил» передаёт длительность, а «завёрнутой» естественно связывает монету с последующим ἐν σουδαρίῳ.
- source_word: ἐν σουδαρίῳ
  choice: в платок
  rationale: σουδάριον обозначает небольшой платок или кусок ткани, в частности для вытирания лица; «платок» конкретен и исторически уместен, а более общее значение отмечено в сноске.
theological_decisions:
- issue: Передача κύριος в обращении внутри притчи
  choice: Господин
  alternative: Господь
  rationale: Непосредственный адресат — знатный хозяин в сюжетном мире притчи. «Господин» сохраняет обычное социальное значение κύριος; возможный более широкий богословский резонанс притчи не устраняется, но и не вносится прямо в речь слуги.
translation_notes:
  register: Современный литературный русский язык; речь проста и достойна. «Тогда» обеспечивает естественную повествовательную связь, не добавляя причинного значения. Прямая речь слегка перестроена на два предложения ради ясности, при сохранении всех смысловых компонентов греческого текста.
