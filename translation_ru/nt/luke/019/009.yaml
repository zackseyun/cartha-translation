  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: ru
  text: 'Иисус сказал ему: «Сегодня спасение пришло в этот дом[a], потому что и он — сын Авраама».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к этим домашним». Греческое слово может означать как сам дом, так и живущих в нём людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Иисус сказал ему
  rationale: Частица δέ здесь служит мягкой связкой в повествовании и не требует отдельной передачи; естественный русский порядок слов сохраняет явное πρὸς αὐτόν как «ему» без добавления имени Закхея.
- source_word: Σήμερον
  choice: Сегодня
  rationale: Современный и прямой эквивалент, сохраняющий вынесенное вперёд временное ударение.
- source_word: σωτηρία
  choice: спасение
  rationale: Слово сохраняет характерный для Луки богословский смысл, не сводя его лишь к избавлению от конкретной опасности.
- source_word: τῷ οἴκῳ τούτῳ
  choice: в этот дом
  rationale: В сочетании с глаголом движения «пришло» русский язык естественно требует направления «в этот дом»; οἶκος может обозначать как жилище, так и связанных с ним домашних, что отмечено в сноске.
- source_word: ἐγένετο
  choice: пришло
  rationale: Буквально глагол означает «возникло, совершилось, стало», однако в сочетании со «спасением» русский идиоматический оборот «спасение пришло» точно выражает наступление спасения.
- source_word: καθότι
  choice: потому что
  rationale: Ясно передаёт причинную связь, не уточняя её сверх того, что выражено греческим текстом.
- source_word: καὶ αὐτὸς
  choice: и он
  rationale: 'Передаёт включающий акцент: он также принадлежит к обозначенной группе.'
- source_word: υἱὸς Ἀβραάμ
  choice: сын Авраама
  rationale: Сохранён конкретный библейский оборот и его идентификационно-заветный оттенок; замена на «потомок» сузила бы возможный смысл.
theological_decisions:
- issue: Значение выражения «сын Авраама»
  choice: Сохранить выражение без поясняющего сужения
  alternative: Передать как «потомок Авраама» либо «истинный член семьи веры Авраама»
  rationale: В самом стихе выражение может указывать на происхождение, принадлежность к народу завета или на более насыщенное значение в контексте покаяния и спасения. Перевод не должен устранять эту богословскую напряжённость.
- issue: Объём спасения, пришедшего в дом
  choice: Сохранить «дом» с лексической сноской
  alternative: Однозначно перевести как «семья» или «домочадцы»
  rationale: οἶκος допускает как пространственное, так и коллективное понимание; основной текст и сноска сохраняют обе возможности, не решая без достаточных оснований, кого именно охватывает высказывание.
translation_notes:
  register: Современный литературный русский язык, краткий и торжественно-нейтральный. Нулевой эквивалент для δέ выбран ради естественного русского повествования; тире перед именной частью подчёркивает включающее «и он — сын Авраама» без добавочного толкования.
