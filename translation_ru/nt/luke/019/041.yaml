  source_fidelity: 'Текст точно передаёт все смысловые элементы греческого оригинала: приближение Иисуса, вид города и плач о нём. Русская личная форма «увидел» является допустимой естественной передачей греческого аористного причастия ἰδών; последовательность действий и причинная связь сохранены. «Заплакал о нём» верно передаёт ἔκλαυσεν ἐπ’ αὐτήν без добавления интенсивности или толкования.'
