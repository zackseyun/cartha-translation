  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: ru
  text: И когда Он приблизился и увидел город, то заплакал о нём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: когда Он приблизился
  rationale: ὡς с аористом здесь естественно передаёт обстоятельство времени; «приблизился» сохраняет движение к Иерусалиму, не добавляя явно не названного объекта.
- source_word: ἰδὼν τὴν πόλιν
  choice: увидел город
  rationale: Аористное причастие выражает действие, непосредственно предшествующее плачу или совпадающее с ним по ситуации. Личная форма звучит естественно по-русски и ясно связывает вид города с последующей реакцией.
- source_word: ἔκλαυσεν
  choice: заплакал
  rationale: κλαίω означает плакать, рыдать. «Заплакал» естественно передаёт наступление действия, выраженное греческим аористом, без добавления неуказанной степени силы переживания.
- source_word: ἐπ’ αὐτήν
  choice: о нём
  rationale: При κλαίω сочетание ἐπί с винительным обозначает предмет скорби. Русское «плакать о городе / о нём» естественно и сохраняет направленность плача на город.
theological_decisions:
- issue: Следует ли передавать женский род αὐτήν как олицетворение Иерусалима
  choice: «о нём» — согласование с русским словом «город»
  alternative: «о ней» при явном назывании или олицетворении Иерусалима
  rationale: Женский род греческого местоимения грамматически обусловлен существительным πόλις женского рода и сам по себе не требует олицетворения. В русском языке «город» мужского рода, поэтому естественно «о нём». Явное олицетворение в перевод не добавляется.
translation_notes:
  register: Современный литературный русский язык; краткая, достоинственная фраза. Синтаксис слегка развёрнут по сравнению с греческой причастной конструкцией ради естественности и ясности.
