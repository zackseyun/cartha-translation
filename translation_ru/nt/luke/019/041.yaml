  terminology: «Город» точно соответствует πόλις в данном контексте. Местоимение «о нём» нормативно согласовано с русским словом «город». Греческий женский род αὐτήν обусловлен родом πόλις и не требует русского олицетворения; отдельная сноска не нужна.
