  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: ru
  text: И привели его к Иисусу. Набросив свои плащи на ослёнка[a], они посадили на него Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает молодое животное; здесь по контексту — ослёнка.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον
  choice: привели
  rationale: Глагол ἄγω обозначает направленное движение одушевлённого существа; применительно к ослёнку естественно русское «привели».
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение мужского рода относится к πῶλος; русское «его» грамматически согласуется с «ослёнком» и не требует пояснения.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: к Иисусу
  rationale: πρός с винительным падежом здесь выражает движение к лицу.
- source_word: ἐπιρίψαντες
  choice: набросив
  rationale: Аористное причастие обозначает действие, предшествующее посадке Иисуса; деепричастие естественно передаёт эту последовательность.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: свои плащи
  rationale: ἱμάτια здесь означает верхнюю одежду; возвратное «свои» ясно связывает плащи с действующими лицами.
- source_word: ἐπὶ τὸν πῶλον
  choice: на ослёнка
  rationale: ἐπί с винительным падежом передаёт помещение одежды на животное.
- source_word: πῶλον
  choice: ослёнка
  rationale: πῶλος в общем смысле обозначает молодое животное, а повествовательный контекст въезда Иисуса указывает здесь на молодого осла; это естественнее и яснее для современного русского читателя, чем двусмысленное «жеребёнок».
- source_word: ἐπεβίβασαν
  choice: посадили
  rationale: 'Глагол имеет каузативное значение: действующие лица помогли Иисусу сесть на животное.'
- source_word: τὸν Ἰησοῦν
  choice: Иисуса
  rationale: Традиционная и общепринятая русская форма имени Ἰησοῦς.
