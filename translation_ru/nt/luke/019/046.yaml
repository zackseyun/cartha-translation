base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: ru
  text: 'говоря им: «Написано: „И будет дом Мой домом молитвы“, а вы сделали его притоном разбойников[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Притон разбойников» — отсылка к Иеремии 7:11; греческое слово, переданное как «разбойники», также может означать «грабители» или «бандиты».
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: и говорил им
  rationale: Причастный оборот связан с предшествующим повествованием; личная форма с союзом естественно передаёт продолженное действие по-русски.
- source_word: Γέγραπται
  choice: Написано
  rationale: Устойчивая русская формула введения авторитетной цитаты из Писания, соответствующая греческому перфекту страдательного залога.
- source_word: Καὶ ἔσται
  choice: И будет
  rationale: Сохраняет начальный союз и будущее время цитаты из Ис 56:7.
- source_word: ὁ οἶκός μου
  choice: дом Мой
  rationale: Передаёт οἶκος буквально и сохраняет связь с пророческой цитатой; речь в контексте идёт о храме.
- source_word: οἶκος προσευχῆς
  choice: домом молитвы
  rationale: Естественная и узнаваемая передача греческой конструкции с родительным падежом.
- source_word: ὑμεῖς δὲ
  choice: а вы
  rationale: Передаёт резкое противопоставление и выраженное местоимением смысловое ударение.
- source_word: ἐποιήσατε
  choice: сделали
  rationale: Русский совершенный вид естественно выражает совершённое действие и его наличный результат.
- source_word: σπήλαιον λῃστῶν
  choice: разбойничьим притоном
  rationale: «Притон» передаёт пещеру или убежище как укрытие преступников в аллюзии на Иер 7:11; прилагательное образует естественное современное русское выражение.
theological_decisions:
- issue: Передача храмовой цитаты словом «дом», а не «храм»
  choice: дом Мой… домом молитвы
  alternative: храм Мой… храмом молитвы
  rationale: В греческом тексте стоит οἶκος; «дом» сохраняет формулировку и богословский образ Ис 56:7, не устраняя отождествление с храмом, ясное из контекста.
- issue: Значение λῃστῶν
  choice: разбойничьим
  alternative: грабительским / бандитским
  rationale: λῃστής допускает значения «разбойник», «грабитель», «бандит». «Разбойничий притон» сохраняет пророческую аллюзию, не сужая смысл до политических повстанцев.
translation_notes:
  register: Современный литературный русский с достоинством библейской прямой речи. Инверсия «дом Мой» сохраняет возвышенный характер цитаты, не делая весь стих архаичным.
