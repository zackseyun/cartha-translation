  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: ru
  text: 'Закхей же встал и сказал Господу: «Вот, Господи, половину моего имущества я отдаю бедным, а если я получил что-нибудь у кого-нибудь вымогательством[a], то возвращаю вчетверо[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если я кого-нибудь в чём-нибудь обманул». Греческий глагол может обозначать вымогательство, притеснение или обман, в том числе посредством ложного обвинения.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческие глаголы в настоящем времени можно также понимать как выражение немедленного решения: «отдам» и «возвращу».'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: встал
  rationale: Аористное причастие от ἵστημι употреблено непереходно; «встал» кратко и естественно передаёт повествовательное действие, не уточняя без необходимости, стоял ли Закхей до этого или выступил вперёд.
- source_word: κύριον / κύριε
  choice: Господу / Господи
  rationale: Сохраняет титул κύριος и его звательную форму в прямом обращении; в контексте обращения к Иисусу не сводит значение к простой вежливости.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современное и естественное средство привлечения внимания, сохраняющее эмфатическую силу греческого слова.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: половину моего имущества
  rationale: ὑπάρχοντα здесь обозначает собственность, имущество; выбранная формулировка естественно передаёт партитивный смысл.
- source_word: τοῖς πτωχοῖς
  choice: бедным
  rationale: Обычное субстантивированное употребление πτωχός; краткий и ясный русский эквивалент.
- source_word: δίδωμι
  choice: я отдаю
  rationale: Настоящее время сохранено без превращения в будущее; «отдаю» в данном контексте естественно обозначает передачу части имущества бедным.
- source_word: εἴ τινός τι
  choice: если я у кого-нибудь что-нибудь
  rationale: Сохраняет обе неопределённости греческой конструкции — лицо и предмет — в естественном русском порядке слов.
- source_word: ἐσυκοφάντησα
  choice: вымогательством отнял
  rationale: Передаёт возможные оттенки злоупотребления властью и неправомерного изъятия, уместные в контексте начальника сборщиков налогов; примечание сохраняет более широкую альтернативу.
- source_word: ἀποδίδωμι
  choice: возвращаю
  rationale: Точно передаёт смысл возврата или возмещения и естественно сочетается с указанием на четырёхкратное возмещение.
- source_word: τετραπλοῦν
  choice: вчетверо
  rationale: Кратко и точно передаёт четырёхкратный размер возмещения.
theological_decisions:
- issue: Значение настоящего времени δίδωμι и ἀποδίδωμι
  choice: 'Передать настоящим временем: «отдаю… возвращаю»'
  alternative: «отдам… возвращу» как выражение немедленного решения
  rationale: Греческий текст употребляет формы настоящего времени. Русское настоящее сохраняет открытым вопрос, описывает ли Закхей уже существующую практику, заявляет о немедленном решении или совмещает оба оттенка, и тем самым не снимает богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; архаизмы устранены, а лексическая и временная неоднозначность оригинала сохранена в тексте и примечаниях.
