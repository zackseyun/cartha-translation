lexical_decisions:
- source_word: εἰσελθὼν
  choice: войдя
  rationale: Деепричастие естественно передаёт предшествующее главному действию действие аористного причастия, не утяжеляя повествование.
- source_word: ἱερὸν
  choice: храм
  rationale: Ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; краткое общеупотребительное «храм» сопровождается уточняющей сноской.
- source_word: ἤρξατο
  choice: начал
  rationale: Точно и естественно передаёт начинательное значение ἄρχομαι с инфинитивом.
- source_word: ἐκβάλλειν
  choice: выгонять
  rationale: Передаёт решительное удаление людей и сохраняет длительный вид инфинитивной конструкции после «начал».
- source_word: πωλοῦντας
  choice: продающих
  rationale: Субстантивированное причастие обозначает людей, занятых продажей, не уточняя предмет торговли, который в данном стихе не назван.
theological_decisions:
- issue: Объём значения ἱερόν при описании действий Иисуса в храме
  choice: В основном тексте — «храм», понимаемый как храмовый комплекс.
  alternative: «храмовые дворы» или «территория храма»; «святилище» было бы слишком узким.
  rationale: Греческое ἱερόν обычно относится ко всему храмовому комплексу, в отличие от ναός — внутреннего святилища. Сноска сохраняет пространственное уточнение, не перегружая основной текст.
translation_notes:
  register: Современный литературный русский язык с лаконичным и достойным повествовательным строем. Заглавное «Он» применено как традиционное контекстуальное обозначение Иисуса; запятая в конце сохранена, поскольку предоставленный стих синтаксически продолжается в следующем стихе.
