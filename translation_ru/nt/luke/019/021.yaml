  source_fidelity: 'Текст точно передаёт синтаксис и смысл греческого оригинала: ἐφοβούμην — «я боялся» (имперфектное состояние в прошлом), γάρ — «ведь», ὅτι — «потому что»; αὐστηρός передан как «суровый» без неоправданного смягчения или усиления. Параллелизм «берёшь ... не клал / жнёшь ... не сеял» сохранён, как и образный, несколько широкий характер αἴρεις и τίθημι. Характеристика остаётся словами слуги, а не авторским суждением.'
