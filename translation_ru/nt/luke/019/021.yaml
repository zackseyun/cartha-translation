  terminology: «Суровый» — удачный нейтрально-негативный эквивалент αὐστηρός; примечание корректно указывает «строгий» и «жёсткий» как варианты. «Жнёшь» и «сеял» сохраняют традиционную и ясную земледельческую пару. Сноски привязаны к соответствующим словам и не навязывают интерпретацию.
