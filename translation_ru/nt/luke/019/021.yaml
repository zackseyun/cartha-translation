id: LUK.19.21
reference: Luke 19:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: ru
  text: 'ведь я боялся тебя, потому что ты человек суровый[a]: берёшь то, чего не клал[b], и жнёшь то, чего не сеял».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «строгий»; возможно также: «жёсткий».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «берёшь то, чего не клал». По смыслу также возможно: «забираешь то, чего не вкладывал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: я боялся
  rationale: Имперфект передаёт продолжительное состояние страха в прошлом; русское «я боялся» звучит естественно и точно.
- source_word: γάρ
  choice: ведь
  rationale: Частица вводит объяснение предыдущих слов слуги; «ведь» естественно передаёт эту пояснительно-причинную связь.
- source_word: αὐστηρὸς
  choice: суровый
  rationale: Слово обозначает строгого, жёсткого или взыскательного человека. «Суровый» сохраняет отрицательную силу обвинения, не усиливая её до однозначной жестокости.
- source_word: αἴρεις
  choice: берёшь
  rationale: Передаёт общее значение «брать, забирать» и сохраняет намеренно широкую формулировку греческого текста.
- source_word: ὃ οὐκ ἔθηκας
  choice: то, чего не клал
  rationale: Буквально сохраняет образ глагола τίθημι — «класть, помещать», не вводя более узкого финансового понятия «вкладывать» или «вносить».
- source_word: θερίζεις
  choice: жнёшь
  rationale: Сохраняет земледельческий образ и устойчивую смысловую пару с «сеял».
- source_word: ὃ οὐκ ἔσπειρας
  choice: то, чего не сеял
  rationale: Точно передаёт σπείρω и сохраняет параллелизм «жать — сеять».
- source_word: ἄνθρωπος
  choice: человек
  rationale: В современном русском «ты человек суровый» естественно относится к конкретному мужчине и ближе к обычному значению ἄνθρωπος, чем стилистически отмеченное «муж».
theological_decisions:
- issue: Следует ли смягчать данную слугой характеристику господина
  choice: 'Сохранить обвинительную формулировку слуги: «человек суровый»'
  alternative: 'Передать мягче: «человек строгий» или «требовательный»'
  rationale: Это речь персонажа, а не прямое авторское утверждение о господине. Перевод сохраняет напряжение повествования и не решает заранее, насколько справедливо обвинение слуги.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Порядок «ты человек суровый» сохраняет выразительность обвинения; земледельческая пара «жнёшь — сеял» оставлена без истолкования.
