  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: ru
  text: Когда он вернулся, получив царскую власть, он велел позвать к себе тех рабов, которым дал деньги, чтобы узнать, что они приобрели торговлей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы узнать, какое дело они совершили»; возможно также: «какую прибыль они получили». Греческий глагол может обозначать как ведение торговли или дела, так и достигнутый благодаря этому результат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: Когда он вернулся
  rationale: Луканская повествовательная формула ἐγένετο не требует отдельного буквального соответствия в естественном современном русском; конструкция с ἐν и артиклевым инфинитивом передана временным придаточным.
- source_word: λαβόντα τὴν βασιλείαν
  choice: получив царскую власть
  rationale: В политическом контексте притчи βασιλεία означает не столько территорию, сколько царское достоинство и право править; деепричастие сохраняет предшествование возвращению без избыточного уточнения.
- source_word: φωνηθῆναι αὐτῷ
  choice: велел позвать к себе
  rationale: Пассивный инфинитив φωνηθῆναι после εἶπεν идиоматически выражает приказ созвать или позвать; русская формулировка естественна и сохраняет направленность к нему.
- source_word: δούλους
  choice: рабов
  rationale: δοῦλος обозначает зависимого человека, находящегося под властью господина. В социальном мире притчи «рабы» точнее передаёт статус, чем более мягкое «слуги».
- source_word: δεδώκει τὸ ἀργύριον
  choice: которым дал деньги
  rationale: Плюсквамперфект обозначает ранее совершённую передачу; ἀργύριον здесь имеет общее значение денежных средств, а не название конкретной единицы.
- source_word: ἵνα γνοῖ
  choice: чтобы узнать
  rationale: Целевая конструкция естественно передаётся инфинитивом после «чтобы»; «узнать» в данном контексте идиоматичнее буквального «знать».
- source_word: τί διεπραγματεύσαντο
  choice: кто сколько приобрёл, пустив их в дело
  rationale: τί в контексте отчёта допускает количественный смысл результата, а διαπραγματεύομαι обозначает ведение дела или торговли с получением результата. Формулировка передаёт и деятельность, и итог, не сводя глагол исключительно к прибыли.
theological_decisions:
- issue: Значение βασιλεία в политическом сюжете притчи
  choice: царская власть
  alternative: царство
  rationale: Знатный человек получает право царствовать, а затем возвращается; «царская власть» ясно передаёт этот смысл и не создаёт впечатления, будто он получил территорию.
- issue: Передача δοῦλος
  choice: рабы
  alternative: слуги
  rationale: Контекст подчёркивает подчинённый статус людей, которыми господин распоряжается и от которых требует отчёта. «Рабы» сохраняет социальную реальность текста без дополнительного богословского истолкования.
- issue: Степень конкретизации результата торговли
  choice: кто сколько приобрёл, пустив их в дело
  alternative: кто какую прибыль получил
  rationale: Контекст указывает на коммерческий результат, но глагол может охватывать как ведение дела, так и достигнутый итог. Выбранная формулировка сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский, повествовательный и сдержанно-достоинственный регистр. Опущено отдельное воспроизведение вводного ἐγένετο как неестественное для русского; смысл временной конструкции сохранён. Местоимение «их» относится к деньгам.
