  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: ru
  text: 'говоря: «Благословен Царь[a], грядущий во имя Господа! Мир на небесах[b] и слава в вышних!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В отличие от знакомой формулы «Благословен грядущий во имя Господа», здесь Лука прямо называет грядущего Царём.
    reason: alternative_reading
  - marker: b
    text: 'Эти слова перекликаются с Лк 2:14, но место мира названо иначе: там — «на земле», здесь — «на небесах».'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени кратко и естественно связывает возглас учеников с действием предыдущего стиха.
- source_word: Εὐλογημένος
  choice: Благословен
  rationale: Сохраняет форму торжественного благословения и отсылку к псалмовой лексике, не подменяя её словами «прославлен» или «хвалим».
- source_word: ὁ ἐρχόμενος
  choice: грядущий
  rationale: Передаёт субстантивированное причастие настоящего времени и уместно звучит в торжественном возгласе; при этом слово остаётся понятным современному читателю.
- source_word: βασιλεὺς
  choice: Царь
  rationale: Слово прямо присутствует в исходном тексте и сохраняет явный царский акцент Луки; определённость выражается контекстом и конструкцией русского предложения.
- source_word: ἐν ὀνόματι κυρίου
  choice: во имя Господа
  rationale: Естественная русская библейская формула, сохраняющая как семитский фон, так и смысл прихода с властью и полномочиями Господа.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Мир на небесах
  rationale: Сохраняет краткую безглагольную форму возгласа и необычное указание именно на небеса, не гармонизируя текст с Лк 2:14.
- source_word: δόξα ἐν ὑψίστοις
  choice: слава в вышних
  rationale: Точно и компактно передаёт устойчивое обозначение высших небесных сфер и сохраняет словесную перекличку с Лк 2:14.
theological_decisions:
- issue: Царский и мессианский характер возгласа
  choice: Сохранить слово «Царь» в основном тексте.
  alternative: «Благословен грядущий во имя Господа».
  rationale: βασιλεὺς выражено прямо; его устранение свело бы формулировку к более общей цитате из Пс 117:26 и ослабило бы особый акцент Луки.
- issue: Связь с Лк 2:14
  choice: Перевести «Мир на небесах», как в исходном тексте.
  alternative: «Мир на земле».
  rationale: Лука здесь говорит о мире на небесах. Это создаёт значимую перекличку и напряжение с песнью ангелов, которые перевод не должен устранять путём гармонизации.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией народного возгласа. Формы «грядущий» и «в вышних» слегка возвышенны, но широко узнаваемы в библейской речи и помогают сохранить псалмовую и межтекстовую окраску стиха.
