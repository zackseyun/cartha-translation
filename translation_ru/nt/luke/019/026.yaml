id: LUK.19.26
reference: Luke 19:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: ru
  text: 'Говорю вам: всякому, кто имеет, будет дано[a], а у того, кто не имеет, будет отнято даже то, что он имеет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или по подразумеваемому смыслу: «будет дано ещё». В греческом тексте слово «ещё» прямо не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Говорю вам
  rationale: Настоящее время и обращение переданы прямо; формула звучит естественно и сохраняет торжественную краткость высказывания.
- source_word: παντὶ τῷ ἔχοντι
  choice: всякому, кто имеет
  rationale: Субстантивированное причастие с παντί обозначает любого человека, обладающего чем-либо; объект намеренно не уточняется, как и в греческом тексте.
- source_word: δοθήσεται
  choice: будет дано
  rationale: Будущее страдательного залога передано буквально, без добавления отсутствующего в греческом тексте слова «ещё»; подразумеваемое увеличение отмечено в сноске.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: а у того, кто не имеет
  rationale: Предлог ἀπό при глаголе отнятия естественно передаётся русской конструкцией «у того»; δέ выражает противопоставление и передано союзом «а».
- source_word: καὶ ὃ ἔχει
  choice: даже то, что он имеет
  rationale: καί здесь имеет усилительное значение «даже». Местоимение «он» употреблено в обобщённом значении и согласуется с единственным числом исходной конструкции.
- source_word: ἀρθήσεται
  choice: будет отнято
  rationale: Будущее страдательного залога αἴρω в данном контексте означает лишение того, чем человек располагает; форма согласована с относительным местоимением «то».
theological_decisions:
- issue: Смысл изречения как принципа приобретения и утраты
  choice: Передать изречение кратко, не уточняя, что именно человек имеет и получает.
  alternative: Явно связать слова с верностью в распоряжении вверенным, с Царством Божьим, спасением, заслугами или предопределением.
  rationale: Сам стих не называет богословский механизм и сохраняет обобщённую форму. Конкретное применение определяется контекстом притчи, но не должно вноситься в перевод самого изречения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная по тону. Сохранены обобщённость и намеренная недосказанность греческого текста, при этом синтаксис остаётся понятным обычному читателю.
