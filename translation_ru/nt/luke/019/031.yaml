id: LUK.19.31
reference: Luke 19:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: ru
  text: 'И если кто-нибудь спросит вас: «Зачем вы его отвязываете?» — ответьте так: «Он нужен Господу[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяину».'
    reason: Греческое κύριος может означать как «Господь», так и «хозяин, господин».
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: спросит
  rationale: В условной конструкции естественное современное русское будущее передаёт действие спрашивающего; глагол обозначает постановку вопроса.
- source_word: Διὰ τί
  choice: зачем
  rationale: В контексте вопрос касается цели совершаемого действия; «зачем» звучит естественно и ёмко, не исключая общего смысла «почему».
- source_word: λύετε
  choice: вы его отвязываете
  rationale: Речь идёт о привязанном молодом осле; «отвязываете» точно передаёт контекстуальное значение λύω. Местоимение «его» восполняет подразумеваемое в греческом дополнение и согласуется с русским употреблением.
- source_word: οὕτως ἐρεῖτε
  choice: ответьте так
  rationale: Будущее изъявительное имеет наставительный смысл. «Ответьте так» естественно передаёт и предписание, и связь с заданным вопросом.
- source_word: κύριος
  choice: Господу
  rationale: «Господь» сохраняет обычное у Луки обозначение Иисуса и возможный богословский оттенок титула; дательный падеж обусловлен естественной русской конструкцией «нужен Господу».
- source_word: αὐτοῦ χρείαν ἔχει
  choice: Он нужен
  rationale: Русская перестройка идиомы «имеет нужду в нём» в «он нужен» сохраняет смысл, ясно относит местоимение к животному и избегает архаичного оборота.
theological_decisions:
- issue: Значение и референт Ὁ κύριος
  choice: «Господь» — вероятное обозначение Иисуса с сохранением титульного звучания
  alternative: «хозяин» — владелец или господин в бытовом смысле
  rationale: Контекст и словоупотребление Луки позволяют понимать κύριος как обозначение Иисуса, однако само слово допускает бытовое значение «хозяин». Основной текст сохраняет более вероятное и богословски значимое прочтение, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной речью. Фраза «Он нужен Господу» предпочтена более буквальному, но архаичному «Господь имеет в нём нужду». Маркер сноски поставлен непосредственно при слове, к которому относится лексическая альтернатива.
