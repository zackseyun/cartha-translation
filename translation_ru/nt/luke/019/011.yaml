  to: Когда они слушали это, Иисус продолжил речь и рассказал им притчу, потому что Он был близко к Иерусалиму, а они думали, что Божье Царство вот-вот явится[a].
  rationale: Исправлена русская сочетаемость при передаче προσθεὶς εἶπεν; причинные основания ясно разведены по субъектам. Основное значение ожидания скорого явления Божьего Царства сохранено, а возможный оттенок ἀναφαίνεσθαι вынесен в сноску.
