    rationale: προσθεὶς εἶπεν — идиоматическое указание на продолжение речи; по-русски «продолжил» без дополнения воспринимается как незавершённый глагол. «Продолжил речь и рассказал им притчу» передаёт это без изменения смысла.
  - severity: low
    issue: Отсутствует примечание к «явится».
    rationale: В английском аудиторском следе отмечена лексическая альтернатива для ἀναφαίνεσθαι. Сноска позволяет сохранить значение «стать явным/обнаружиться», не перегружая основной текст.
  revised_text: Когда они слушали это, Иисус продолжил речь и рассказал им притчу, потому что Он был близко к Иерусалиму, а они думали, что Божье Царство вот-вот явится[a].
