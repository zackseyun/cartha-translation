source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: ru
  text: Когда они слушали это, Иисус продолжил речь и рассказал им притчу, потому что Он был близко к Иерусалиму, а они думали, что Божье Царство вот-вот явится[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вот-вот станет явным». Глагол может обозначать становление видимым или явным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Когда они слушали это
  rationale: Родительный самостоятельный оборот с причастием настоящего времени обозначает действие, одновременное с последующим; формулировка естественно передаёт продолжающееся слушание.
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: Иисус продолжил и рассказал притчу
  rationale: Сочетание выражает продолжение речи. Имя «Иисус» добавлено вместо местоимения для естественной ясности по-русски; «рассказал притчу» соответствует жанру и русскому словоупотреблению.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: потому что был близко к Иерусалиму
  rationale: διά с субстантивированным инфинитивом имеет причинное значение; винительный αὐτόν указывает, что близко к Иерусалиму находился Иисус.
- source_word: δοκεῖν αὐτοὺς
  choice: они думали
  rationale: Передаёт мнение или ожидание людей без оттенка уверенности и без излишне книжного «полагали».
- source_word: παραχρῆμα μέλλει ... ἀναφαίνεσθαι
  choice: вот-вот явится
  rationale: «Вот-вот» естественно объединяет значение непосредственной близости события, выраженное μέλλω, и усиление παραχρῆμα; «явится» передаёт становление видимым или явным.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Божье Царство
  rationale: Современная и ясная русская передача устойчивого евангельского выражения; заглавная буква сохраняет традиционное обозначение Божьего владычества.
theological_decisions:
- issue: Характер ожидаемого явления Божьего Царства
  choice: «Божье Царство вот-вот явится» без уточнения способа его явления
  alternative: «Божье Царство вот-вот будет установлено» или «полностью откроется»
  rationale: Греческий текст сообщает об ожидании скорого явления Царства, но не определяет здесь, будет ли оно политическим, апокалиптическим или духовным. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Вот-вот явится» звучит естественно и точно передаёт усиленное ожидание немедленного события; синтаксис не перегружен книжными оборотами.
