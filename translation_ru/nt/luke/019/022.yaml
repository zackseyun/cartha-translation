  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: ru
  text: 'Он сказал ему: «По твоим же словам[a] я буду судить тебя, злой раб! Ты знал, что я человек суровый: беру то, чего не клал[b], и пожинаю то, чего не сеял?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Из твоих уст я буду судить тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не вкладывал»; в данном контексте возможен смысл внесения денег на хранение или в оборот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Он сказал ему
  rationale: Историческое настоящее передано естественным для русского повествования прошедшим временем; адресат выражен явно, как и в греческом тексте.
- source_word: Ἐκ τοῦ στόματός σου
  choice: По твоим же словам
  rationale: 'Русская идиома ясно передаёт смысл: основанием суда служат собственные слова раба. Частица «же» подчёркивает обращение слов говорящего против него самого; буквальный образ сохранён в сноске.'
- source_word: κρίνω σε
  choice: я буду судить тебя
  rationale: Будущее время греческого глагола сохранено; более узкое «осужу» не выбрано, чтобы не сужать значение κρίνω.
- source_word: πονηρὲ δοῦλε
  choice: негодный раб
  rationale: «Раб» точно передаёт социально зависимое положение δοῦλος в контексте господина и раба. «Негодный» выражает нравственное порицание и естественно звучит в прямом обращении, не усиливая его до абстрактного «злой».
- source_word: αὐστηρός
  choice: суровый
  rationale: Слово передаёт жёсткий, требовательный характер, приписанный господину, и сохраняет отрицательный оттенок без архаизма.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: забираю то, чего не клал
  rationale: Сохранены предметное «то, чего», параллелизм с последующей фразой и широкое значение обоих глаголов. Возможный финансовый смысл τίθημι указан в сноске, но не навязан основному тексту.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: пожинаю то, чего не сеял
  rationale: 'Сохранены земледельческая метафора и объектное значение относительного местоимения: «то, чего», а не «там, где».'
theological_decisions:
- issue: Передаёт ли характеристика господина объективное утверждение рассказчика
  choice: Прямая формулировка «Ты знал, что я человек суровый» сохранена без поясняющей вставки.
  alternative: «Ты утверждаешь, что я человек суровый» или условное «Если ты знал…»
  rationale: Греческий текст прямо повторяет характеристику из уст раба и может иметь риторическую силу. Перевод не решает за читателя, подтверждает ли господин её как объективную истину или обращает против раба его собственные слова.
- issue: Передача δοῦλος в притче
  choice: раб
  alternative: слуга
  rationale: В отношениях господина и подчинённого здесь существенно несвободное, зависимое положение; русское «раб» передаёт его точнее, чем более широкое «слуга».
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого повествования. Синтаксис сделан естественным для устной реплики; архаизмы устранены. Местоимение «я» оставлено со строчной буквы, поскольку речь идёт о персонаже притчи и текст сам по себе не требует конфессионального оформления божественных местоимений.
