source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: ru
  text: 'Увидев это, все стали роптать: «Он зашёл к грешному человеку, чтобы остановиться у него[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погостить у него».'
    reason: 'Лексическая альтернатива для καταλῦσαι: глагол может обозначать пребывание в доме в качестве гостя.'
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев это
  rationale: Аористное причастие передаёт обстоятельство, вызвавшее реакцию толпы; «это» естественно отсылает к происходящему с Иисусом и Закхеем.
- source_word: πάντες
  choice: все
  rationale: Сохраняет подчёркнутый в греческом тексте всеобщий характер реакции.
- source_word: διεγόγγυζον
  choice: стали роптать
  rationale: Имперфект допускает начинательное и продолжающееся значение; «стали роптать» естественно передаёт возникшую неодобрительную реакцию.
- source_word: λέγοντες
  choice: двоеточие перед прямой речью
  rationale: В современном русском содержание речи после глагола «роптать» естественно вводится прямой речью без отдельного «говоря».
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: к грешному человеку … у него
  rationale: Передаёт παρά с дательным как пребывание у кого-либо и сохраняет сочетание прилагательного ἁμαρτωλός с существительным ἀνήρ, не сводя его просто к слову «грешник».
- source_word: εἰσῆλθεν
  choice: зашёл
  rationale: Обозначает вход в дом Закхея; совершенный вид уместен в прямой речи о уже совершённом поступке.
- source_word: καταλῦσαι
  choice: чтобы остановиться
  rationale: Передаёт цель входа — пребывание или проживание в качестве гостя, не уточняя без необходимости длительность.
theological_decisions:
- issue: Характеристика Закхея толпой
  choice: грешный человек
  alternative: грешник
  rationale: Греческий текст содержит прилагательное ἁμαρτωλός и существительное ἀνήρ. Выбранный вариант сохраняет форму и оттенок осуждающей характеристики толпы, не усиливая её дополнительным богословским толкованием.
translation_notes:
  register: Современный литературный русский язык; речь толпы звучит естественно, но сохраняет достоинство библейского повествования. Причастная конструкция и прямая речь позволяют избежать тяжеловесного буквального «роптали, говоря».
