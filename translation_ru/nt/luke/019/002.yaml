  text: И вот, был человек по имени Закхей; он был начальником сборщиков налогов и был богат.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет указательный повествовательный маркер Луки и естественно вводит нового участника рассказа по-русски.
- source_word: ἀνὴρ
  choice: человек
  rationale: В данном представлении персонажа современное русское «человек» звучит естественнее, чем стилистически отмеченное «мужчина»; мужской пол однозначен из имени и местоимения.
- source_word: ὀνόματι καλούμενος
  choice: по имени
  rationale: Естественно передаёт греческое сочетание со значением «называемый по имени», не воспроизводя его избыточно буквально.
- source_word: Ζακχαῖος
  choice: Закхей
  rationale: Использована устоявшаяся русская библейская передача личного имени.
- source_word: αὐτὸς ἦν
  choice: он был
  rationale: Естественно возобновляет подлежащее; усилительное «сам» здесь могло бы создать чрезмерный контраст.
- source_word: ἀρχιτελώνης
  choice: начальник сборщиков налогов
  rationale: Передаёт как иерархический компонент ἀρχι-, так и понятную современному читателю функцию τελώνης.
- source_word: αὐτὸς πλούσιος
  choice: был богат
  rationale: Прямо и естественно передаёт πλούσιος; повторное αὐτός не требует отдельного «сам» в русском контексте.
