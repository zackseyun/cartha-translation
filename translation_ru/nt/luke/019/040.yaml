  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: ru
  text: 'В ответ он сказал: «Говорю вам: если они умолкнут[a], камни закричат».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замолчат»; возможно также: «будут молчать».'
    reason: 'Лексико-аспектуальная альтернатива: σιωπάω может обозначать как наступление молчания, так и состояние молчания.'
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: В ответ он сказал
  rationale: Сочетание причастия «ответив» с личной формой «сказал» передано естественным русским оборотом, который сохраняет и значение ответа, и глагол речи без тяжеловесного повтора.
- source_word: Λέγω ὑμῖν
  choice: Говорю вам
  rationale: Прямая и выразительная передача устойчивой авторитетной формулы; в современном русском звучит естественно и сохраняет настоящее время греческого глагола.
- source_word: οὗτοι
  choice: они
  rationale: Указательное местоимение относится к присутствующим ученикам, восхваляющим Иисуса. Русское «они» ясно из контекста и не добавляет толкования.
- source_word: σιωπήσουσιν
  choice: умолкнут
  rationale: Будущая форма σιωπάω в условии обозначает прекращение звучащей сейчас хвалы. «Умолкнут» точно и лаконично передаёт этот переход к молчанию.
- source_word: οἱ λίθοι
  choice: камни
  rationale: Буквальная передача яркого конкретного образа. В русском определённость здесь не требует отдельного выражения.
- source_word: κράξουσιν
  choice: закричат
  rationale: κράζω обозначает громкий крик или возглас; «закричат» сохраняет силу и непосредственность образа.
theological_decisions:
- issue: Следует ли пояснять, является ли крик камней метафорой, пророческим образом или буквальным чудом
  choice: Сохранить без пояснения буквальный образ «камни закричат»
  alternative: 'Передать толковательно: «само творение возвестит хвалу»'
  rationale: Греческий текст не объясняет природу образа. Буквальная формулировка сохраняет его риторическую и богословскую напряжённость, не навязывая одного истолкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Оборот «В ответ он сказал» сохраняет греческую структуру без неестественной для русского избыточности. Местоимение «он» дано со строчной буквы, поскольку греческий текст не кодирует особого почтительного написания.
