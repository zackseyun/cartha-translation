  verdict: approve
  source_fidelity: Текст точно передаёт греческую конструкцию καὶ ἀποκριθεὶς εἶπεν как «В ответ он сказал», формулу Λέγω ὑμῖν как «Говорю вам», условное высказывание и будущие формы σιωπήσουσιν / κράξουσιν. «Умолкнут» удачно выражает прекращение звучащей хвалы, а «камни закричат» сохраняет намеренно неистолкованный образ оригинала.
  naturalness: Перевод звучит ясно и литературно. Оборот «В ответ он сказал» несколько более формален, чем «Он ответил», но вполне естествен в сдержанном библейском регистре и оправдан стремлением передать ответную реплику вместе с глаголом речи. «Говорю вам» уместно в современной литературной библейской речи.
  terminology: Ключевые слова переданы последовательно и без конфессионально обусловленного толкования. «Камни» соответствует λίθοι; «закричат» точно передаёт громкий характер κράζω. Сноска корректно отмечает допустимые аспектуальные оттенки σιωπάω и привязана к слову «умолкнут».
