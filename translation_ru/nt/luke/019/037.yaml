  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: ru
  text: Когда Он уже приближался к спуску с Елеонской горы, всё множество учеников, радуясь, стало громко славить Бога за все могущественные деяния[a], которые они видели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудеса»; греческое слово означает силу либо могущественные деяния, в которых она проявляется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Когда Он уже приближался
  rationale: Родительный самостоятельный оборот задаёт временной фон; несовершенный вид передаёт продолжающееся приближение, а «уже» сохраняет ἤδη.
- source_word: πρὸς τῇ καταβάσει
  choice: к спуску
  rationale: Сочетание указывает на близость к месту, где начинается спуск; формулировка естественна по-русски и не уточняет топографию сверх текста.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: с Елеонской горы
  rationale: Использовано устоявшееся русское название; родительный падеж связан со словом «спуск».
- source_word: ἤρξαντο
  choice: стало
  rationale: Передаёт начинательное значение глагола и согласуется с собирательным подлежащим «множество».
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: всё множество учеников
  rationale: Сохраняет указание на многочисленную совокупность именно учеников, а не неопределённую толпу.
- source_word: χαίροντες
  choice: радуясь
  rationale: Деепричастие сохраняет самостоятельную глагольную силу причастия и выражает сопутствующее состояние.
- source_word: αἰνεῖν τὸν θεὸν
  choice: славить Бога
  rationale: Естественная и достойная русская передача действия хвалы, направленного к Богу.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Идиоматично передаёт буквальное «великим/громким голосом» без тяжеловесности.
- source_word: περὶ πασῶν ... δυνάμεων
  choice: за все явления силы
  rationale: Сохраняет связь δύναμις с силой и обозначает проявившиеся в деяниях могущественные действия, не сводя слово исключительно к техническому понятию чуда.
- source_word: ὧν εἶδον
  choice: которые они видели
  rationale: Прямо передаёт относительное предложение и факт личного свидетельства учеников.
theological_decisions:
- issue: Передача δύναμις в контексте чудесных деяний
  choice: явления силы
  alternative: чудеса; могущественные дела
  rationale: Греческое слово может обозначать силу, проявление силы или совершённое силой чудесное деяние. Выбранная формулировка сохраняет смысловую широту и акцент на силе, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён до естественной русской временной конструкции; сохранены движение, радость учеников, громкость хвалы и лексическая широта δύναμις.
