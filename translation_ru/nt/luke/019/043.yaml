id: LUK.19.43
reference: Luke 19:43
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: ru
  text: Потому что придут на тебя дни, когда твои враги возведут против тебя осадный вал[a], окружат тебя и сожмут со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осадное укрепление»; возможны также значения «частокол» или «заграждение».'
    reason: Хάραξ обозначает сооружение, возводимое осаждающими; его точный вид в данном контексте не уточнён.
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Сохраняет причинную связь с предшествующим плачем и предсказанием Иисуса.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: придут на тебя дни
  rationale: Передаёт греческий пророческий оборот и образ грядущих событий, которые постигнут олицетворённый Иерусалим.
- source_word: παρεμβαλοῦσιν
  choice: возведут
  rationale: В сочетании с χάραξ обозначает устройство осадного сооружения; «возведут» естественно сочетается с «осадный вал».
- source_word: οἱ ἐχθροί σου
  choice: твои враги
  rationale: Прямо передаёт греческое словосочетание и сохраняет обращение во втором лице единственного числа.
- source_word: χάρακά σοι
  choice: против тебя осадный вал
  rationale: Хάραξ в данном военном контексте означает осадное заграждение или вал, а дательный σοι имеет значение направленности во вред адресату.
- source_word: περικυκλώσουσίν σε
  choice: окружат тебя
  rationale: Ясно и непосредственно передаёт полное военное окружение.
- source_word: συνέξουσίν σε πάντοθεν
  choice: сожмут со всех сторон
  rationale: Передаёт идею стеснения и давления при осаде, не сливая её с уже выраженным окружением.
theological_decisions:
- issue: К кому относятся местоимения второго лица в плаче Иисуса об Иерусалиме
  choice: 'Сохранено единственное число: «тебя», как обращение к олицетворённому Иерусалиму.'
  alternative: Передать обращение во множественном числе как относящееся ко всем жителям города.
  rationale: Греческий текст последовательно употребляет формы единственного числа; их сохранение удерживает пророческую образность и не уточняет референт сверх текста.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохраняет нарастающую последовательность трёх действий врагов; обращение к Иерусалиму передано в единственном числе.
