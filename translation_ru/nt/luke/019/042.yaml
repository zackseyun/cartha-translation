  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: ru
  text: 'говоря: «Если бы и ты в этот день узнал то, что ведёт к миру! Но теперь это¹ скрыто от твоих глаз».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени продолжает синтаксический поток предыдущего стиха; деепричастие сохраняет эту связь.
- source_word: Εἰ ἔγνως
  choice: Если бы… узнал
  rationale: В контексте плача условная конструкция выражает несбывшуюся возможность; русская форма с «бы» естественно передаёт это значение без добавления слова «только».
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: в этот день
  rationale: Естественное русское временное выражение, сохраняющее указание на конкретный день.
- source_word: καὶ σὺ
  choice: и ты
  rationale: Постановка рядом с условным оборотом сохраняет эмфатическую силу καί применительно к адресату — Иерусалиму.
- source_word: τὰ πρὸς εἰρήνην
  choice: что ведёт к миру
  rationale: 'Передаёт идиоматический смысл: то, что относится к миру или приводит к нему. В русском собирательное «что» звучит естественнее буквального «то, что служит миру».'
- source_word: εἰρήνην
  choice: миру
  rationale: '«Мир» сохраняет широкое значение εἰρήνη: примирение, благополучие и предотвращение грядущего суда.'
- source_word: νῦν δὲ
  choice: Но теперь
  rationale: Передаёт резкое противопоставление упущенной возможности нынешнему сокрытию.
- source_word: ἐκρύβη
  choice: это скрыто
  rationale: Аорист пассива передан результативным русским кратким страдательным причастием. Нейтральное «это» отсылает ко всему предыдущему выражению и соответствует единственному числу греческого глагола.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: от твоих глаз
  rationale: Сохраняет образную библейскую формулировку и остаётся понятным современному читателю.
theological_decisions:
- issue: Подразумеваемый референт ἐκρύβη
  choice: Собирательная отсылка «это скрыто» к тому, что ведёт к миру.
  alternative: «Они скрыты» с грамматическим согласованием по смыслу с τὰ πρὸς εἰρήνην.
  rationale: Греческий глагол стоит в единственном числе, хотя ему предшествует субстантивированное словосочетание среднего рода множественного числа. Русское «это» сохраняет собирательность и формальное единственное число, не разрывая смысловую связь.
- issue: Сила условного плача
  choice: «Если бы… узнал» без добавления «только».
  alternative: «Если бы только… узнал».
  rationale: Контекст ясно выражает скорбное, несбывшееся условие, однако отдельной частицы со значением «только» в греческом тексте нет.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены незавершённость условного восклицания и резкий переход после него; богословская неоднозначность не уточняется сверх исходного текста.
