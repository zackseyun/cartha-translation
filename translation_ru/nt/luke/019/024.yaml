  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: ru
  text: 'И сказал стоявшим рядом: «Возьмите у него мину[a] и отдайте тому, у кого десять мин».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Мина — древняя денежная единица; традиционный вариант перевода: «фунт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεστῶσιν
  choice: стоявшим рядом
  rationale: Субстантивированное причастие обозначает людей, находившихся поблизости; перевод сохраняет конкретную сцену и естественно звучит по-русски.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: Возьмите у него
  rationale: В данном контексте αἴρω с ἀπό выражает изъятие; сочетание «возьмите у него» прямо и естественно передаёт повеление и значение отделения.
- source_word: μνᾶν / μνᾶς
  choice: мину / мин
  rationale: Транслитерация сохраняет древнюю денежную единицу и не создаёт ложной ассоциации с современным фунтом.
- source_word: δότε
  choice: отдайте
  rationale: В последовательности изъятия и передачи «отдайте» естественно передаёт δίδωμι и ясно указывает на передачу мины другому человеку.
- source_word: τῷ ... ἔχοντι
  choice: тому, у кого
  rationale: Так естественно по-русски передаётся субстантивированное причастие без добавления отсутствующего в греческом тексте слова «человек» или «слуга».
- source_word: τὰς δέκα μνᾶς
  choice: десять мин
  rationale: Определённость количества понятна из контекста; русский язык не имеет артикля, поэтому отдельное указательное слово не требуется.
theological_decisions:
- issue: Передача μνᾶ как древней денежной единицы
  choice: мина
  alternative: фунт
  rationale: «Мина» непосредственно сохраняет историческую денежную единицу греческого текста, тогда как «фунт» может быть ошибочно понят как современная валюта или мера веса.
translation_notes:
  register: Современный литературный русский язык; речь краткая и повелительная. «Стоявшим рядом» сохраняет зримую конкретность сцены, а «тому, у кого» избегает ненужного добавления пола или статуса лица.
