  text: καὶ σπεύσας κατέβη, καὶ ὑπεδέξατο αὐτὸν χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/006.yaml
  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: ru
  text: Он поспешно спустился и с радостью принял Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он поспешил, спустился и радостно встретил Его».'
    reason: 'Лексико-синтаксический вариант: σπεύσας можно передать отдельным глаголом, ὑπεδέξατο — как «встретил», а χαίρων — наречием «радостно».'
lexical_decisions:
- source_word: σπεύσας
  choice: поспешно
  rationale: Аористное причастие передаёт незамедлительность и поспешность действия; наречие естественно сочетается со сказуемым «спустился».
- source_word: κατέβη
  choice: спустился
  rationale: Глагол обозначает движение вниз; в контексте Закхея на дереве «спустился» точно и естественно передаёт направление.
- source_word: ὑπεδέξατο
  choice: принял
  rationale: Средний залог ὑποδέχομαι означает принять или встретить, нередко как гостя. «Принял» сохраняет гостеприимный оттенок, не добавляя прямо не выраженного упоминания дома.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Иисусу; прописная буква соответствует принятой русской библейской издательской практике.
- source_word: χαίρων
  choice: с радостью
  rationale: Причастие настоящего времени выражает сопутствующее радостное состояние; оборот «с радостью» естественен в современном русском языке.
- source_word: καὶ ... καὶ
  choice: и
  rationale: Повторяющийся союз связывает последовательные действия. В русском первое καί естественно не выражать отдельно в начале самостоятельного стиха, а второе передать союзом «и».
theological_decisions: []
