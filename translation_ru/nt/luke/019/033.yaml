  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: ru
  text: 'Когда они отвязывали ослёнка, его хозяева сказали им: «Зачем вы отвязываете ослёнка?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυόντων ... λύετε
  choice: отвязывали ... отвязываете
  rationale: Конкретно передаёт действие с привязанным животным, сохраняет значение настоящего времени и повтор одного и того же греческого глагола.
- source_word: δὲ
  choice: Когда
  rationale: Греческая частица мягко продолжает повествование; отдельный союз в русском не требуется, поскольку естественная придаточная конструкция уже передаёт ход событий.
- source_word: αὐτῶν
  choice: они
  rationale: Местоимение отсылает к двум ученикам из предшествующего контекста, не называя их повторно.
- source_word: τὸν πῶλον
  choice: молодого осла
  rationale: πῶλος обозначает молодое животное, а предшествующий контекст уточняет, что это осёл. Такое выражение яснее современному русскому читателю, чем неоднозначное «жеребёнок».
- source_word: εἶπαν
  choice: сказали
  rationale: Сохраняет прямое значение λέγω, хотя далее следует вопрос.
- source_word: οἱ κύριοι αὐτοῦ
  choice: его хозяева
  rationale: В данном контексте κύριοι — люди, которым принадлежит животное; «хозяева» естественно передаёт это значение без богословской окраски.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: Естественная русская передача адресата при глаголе речи.
- source_word: Τί
  choice: Зачем
  rationale: В данном вопросе τί выясняет цель или основание действия; «зачем» звучит естественно и не устраняет возможный оттенок требования объяснить поступок.
theological_decisions:
- issue: Передача κύριοι в контексте человеческого владения
  choice: хозяева
  alternative: господа / владельцы
  rationale: Здесь слово относится не к божественному титулу, а к человеческим хозяевам осла. «Господа» создало бы ложную богословскую ассоциацию, а «владельцы» звучит более официально.
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Повтор «отвязывали / отвязываете» намеренно сохраняет лексическую связь оригинала. Форма «молодого осла» проясняет вид животного из ближайшего контекста.
