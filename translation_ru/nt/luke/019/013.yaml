  verdict: approve
  source_fidelity: 'Текст точно передаёт последовательность действий: призвав десять своих рабов, он дал им десять мин и повелел распорядиться ими в коммерческом деле до своего возвращения. «Пустите их в дело» обоснованно эксплицирует связь повеления с переданными минами; «вернусь» соответствует контекстуальному значению ἔρχομαι как возвращения, не выходя за смысл текста.'
  naturalness: Перевод звучит естественно на современном литературном русском. «Позвав десятерых своих рабов» и «Пустите их в дело» ясны и стилистически уместны для притчевого повествования.
  terminology: «Рабы» адекватно сохраняет социально-правовую окраску δούλους, усиленную ἑαυτοῦ («своих»), без конфессионального переосмысления. «Мины» — удачная исторически конкретная передача μνᾶς. Примечания корректно поясняют альтернативу для δοῦλος, культурную реалию и возможный более буквальный коммерческий оттенок повеления.
