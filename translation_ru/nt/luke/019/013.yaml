id: LUK.19.13
reference: Luke 19:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: ru
  text: 'Позвав десятерых своих рабов[a], он дал им десять мин[b] и сказал: «Пустите их в дело, пока я не вернусь»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг». Греческое слово δοῦλος может означать раба или слугу в зависимости от контекста.'
    reason: alternative_reading
  - marker: b
    text: Мина — древняя денежно-весовая единица.
    reason: cultural_note
  - marker: c
    text: 'Или: «Ведите торговые дела, пока я не вернусь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Позвав
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастие естественно передаёт эту последовательность по-русски.
- source_word: δούλους
  choice: рабов
  rationale: В контексте отношений хозяина и принадлежащих ему людей слово обозначает рабов; этот социальный смысл важно сохранить, не смягчая его до «слуг».
- source_word: ἑαυτοῦ
  choice: своих
  rationale: Возвратное местоимение подчёркивает принадлежность; русское «своих» точно и естественно передаёт эту связь.
- source_word: μνᾶς
  choice: мин
  rationale: Сохранено историческое название древней денежно-весовой единицы, чтобы не создавать ложной аналогии с современной валютой.
- source_word: Πραγματεύσασθε
  choice: Пустите их в дело
  rationale: Императив требует вести торговые или иные доходные дела на переданные деньги. Эта русская формулировка естественно связывает повеление с десятью минами, не уточняя способ получения прибыли сверх текста.
- source_word: ἐν ᾧ ἔρχομαι
  choice: пока я не вернусь
  rationale: Оборот имеет временной смысл «до моего прихода/возвращения»; в контексте отъезда знатного человека «вернусь» звучит естественно и ясно.
theological_decisions:
- issue: Передача δοῦλος в притче об отношениях хозяина и зависимых от него людей
  choice: рабы
  alternative: слуги
  rationale: Упоминание «своих» и вся структура притчи указывают на принадлежность хозяину. «Рабы» сохраняет историко-социальную реальность текста, не внося дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным строем. «Десятерых» употреблено применительно к людям; исторические реалии сохранены. Прямая речь сформулирована естественно, без конфессионально обусловленной интерпретации.
