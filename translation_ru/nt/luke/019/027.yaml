  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: ru
  text: А этих моих врагов, которые не хотели, чтобы я царствовал над ними, приведите сюда и перебейте у меня на глазах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: А
  rationale: В данном контексте частица вводит заключительный, резко противопоставленный пункт речи; русское «А» естественно сочетает переход и выделение темы.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: этих моих врагов
  rationale: Сохраняются значение ἐχθρούς, притяжательное местоимение и эмфатическая указательность τούτους; такой порядок слов естественен по-русски.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτούς
  choice: которые не хотели, чтобы я царствовал над ними
  rationale: Причастный оборот естественно передан относительным придаточным; «царствовал над ними» сохраняет глагольный смысл βασιλεύω и идею царской власти.
- source_word: ἀγάγετε ὧδε
  choice: приведите сюда
  rationale: «Приведите» точно и естественно передаёт движение лиц к говорящему по приказу.
- source_word: κατασφάξατε
  choice: перебейте
  rationale: Глагол передаёт усиленный, жестокий характер κατασφάζω и повеление убить всю названную группу, не добавляя специально судебного оттенка.
- source_word: ἔμπροσθέν μου
  choice: у меня на глазах
  rationale: Естественное современное выражение, ярко передающее совершение действия непосредственно перед говорящим, в его присутствии.
theological_decisions:
- issue: Соотнесение приказа с говорящим в притче
  choice: Передать приказ знатного человека прямо, сохранив его жестокость, но не выводить его за рамки речи персонажа притчи.
  alternative: Смягчить насилие или добавить формулировку, явно дистанцирующую приказ от Иисуса.
  rationale: Греческий текст без смягчения передаёт слова персонажа внутри притчи. Перевод должен сохранять повествовательную и богословскую напряжённость, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык; речь прямая, строгая и выразительная. «Перебейте» намеренно сохраняет жестокую силу исходного глагола, а «у меня на глазах» — конкретность сцены без архаизации.
