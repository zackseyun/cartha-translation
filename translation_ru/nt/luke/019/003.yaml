  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: ru
  text: Он старался увидеть, кто такой Иисус, но из-за толпы не мог Его увидеть, потому что был мал ростом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был невысок». Греческое выражение буквально указывает на то, что он был мал ростом; в данном контексте речь идёт о физическом росте, а не о возрасте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: старался
  rationale: Имперфект передаёт продолжавшуюся попытку, а не только желание; «старался» естественно выражает это по-русски.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Инфинитив обозначает цель усилий Закхея; простой глагол «увидеть» точно передаёт смысл.
- source_word: τίς ἐστιν
  choice: кто такой Иисус
  rationale: Оборот может касаться как личности, так и того, что это за человек. Русское «кто такой Иисус» сохраняет эту смысловую широту и звучит естественно.
- source_word: οὐκ ἠδύνατο
  choice: не мог
  rationale: Краткое и обычное русское соответствие форме δύναμαι в данном контексте.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: из-за толпы
  rationale: Предлог ἀπό здесь указывает на препятствующую причину; «из-за толпы» ясно и идиоматично передаёт эту связь.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину, по которой толпа мешала ему увидеть Иисуса.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: был мал ростом
  rationale: Хотя ἡλικία может обозначать возраст или физический рост, контекст препятствующей обзору толпы ясно указывает на рост. Выражение «мал ростом» точно, сжато и литературно.
