  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: ru
  text: И каждый день Он учил в храме. А первосвященники, книжники и видные люди народа[a] искали, как погубить Его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «первые [люди] народа», то есть видные или влиятельные представители народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: Он учил
  rationale: Перифрастический имперфект передаёт продолжавшееся и повторявшееся действие; в сочетании с «каждый день» естественная русская форма «учил» ясно сохраняет этот смысл.
- source_word: τὸ καθ’ ἡμέραν
  choice: каждый день
  rationale: 'Естественно передаёт распределительное значение греческого оборота: действие происходило изо дня в день.'
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс, а не только внутреннее святилище; «в храме» — краткий и общепринятый русский эквивалент.
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся обозначение представителей высшего священнического руководства.
- source_word: οἱ γραμματεῖς
  choice: книжники
  rationale: Прямой и традиционно понятный эквивалент, не расширяющий значение до толковательного «учители закона».
- source_word: ἐζήτουν αὐτὸν ἀπολέσαι
  choice: искали, как погубить Его
  rationale: Имперфект выражает продолжавшиеся попытки; конструкция «искали, как» естественна по-русски, а «погубить» сохраняет более широкий оттенок ἀπόλλυμι, хотя в контексте подразумевается смертельная расправа.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: влиятельные люди в народе
  rationale: Передаёт общественную значимость и высокое положение названных лиц без неестественной буквальности выражения «первые народа».
theological_decisions:
- issue: Характер намерения, выраженного ἀπολέσαι
  choice: погубить Его
  alternative: убить Его
  rationale: Контекст допускает и фактически предполагает убийство, однако «погубить» ближе к лексической широте глагола и не снимает его зловещей, смертельной направленности.
- issue: Мужской референт в οἱ πρῶτοι τοῦ λαοῦ
  choice: влиятельные люди в народе
  alternative: вожди народа
  rationale: Русское «люди» естественно обозначает конкретных влиятельных представителей народа и не вносит дополнительного официального титула; исторический контекст при этом допускает, что речь идёт о мужчинах.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавное «Он/Его» употреблено как традиционная форма почтительного указания на Иисуса. Финальная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
