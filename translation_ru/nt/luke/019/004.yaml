  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: ru
  text: Он побежал вперёд и взобрался на сикоморовую смоковницу[a], чтобы увидеть Иисуса, потому что Иисус собирался пройти там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: сикомор; дерево Ficus sycomorus, не клён-сикомор.'
    reason: Лексическое пояснение слова συκομορέα и устранение возможной ботанической неоднозначности.
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: забежал вперёд
  rationale: Причастие от προτρέχω вместе с εἰς τὸ ἔμπροσθεν обозначает, что Закхей бегом оказался впереди; русский глагол «забежал» естественно передаёт и бег, и опережение.
- source_word: ἀνέβη ἐπὶ
  choice: взобрался на
  rationale: Сочетание обозначает подъём на дерево; «взобрался» ясно передаёт физическое усилие и звучит естественно в современном повествовании.
- source_word: συκομορέαν
  choice: сикомор
  rationale: Греческое слово называет Ficus sycomorus — сикомор, или сикоморовую смоковницу. Краткое ботаническое название уместно в основном тексте, а пояснение дано в сноске.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: чтобы увидеть Иисуса
  rationale: ἵνα с сослагательным наклонением выражает цель. Имя «Иисус» естественно проясняет местоимение в русском и устраняет возможную неясность между участниками рассказа.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину, по которой Закхей выбрал это место.
- source_word: ἐκείνης
  choice: там
  rationale: Женская форма местоимения, вероятно, подразумевает дорогу или местность; «там» сохраняет эллиптичность оригинала, не добавляя отсутствующего существительного.
- source_word: ἤμελλεν διέρχεσθαι
  choice: должен был пройти
  rationale: μέλλω с инфинитивом указывает на предстоящее действие. В данном контексте «должен был пройти» естественно означает ожидаемый маршрут, а не обязанность.
