  language: ru
  text: И они не могли придумать, что предпринять, потому что весь народ не отрываясь слушал Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь народ, слушая, висел на Нём». Греческий оборот означает, что люди слушали Иисуса с пристальным, напряжённым вниманием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: не могли придумать
  rationale: Отрицательная форма имперфекта передаёт продолжающуюся неспособность найти подходящий образ действий; по-русски это естественно выражается словами «не могли придумать».
- source_word: τὸ τί ποιήσωσιν
  choice: что предпринять
  rationale: Сочетание τί с аористом сослагательного наклонения имеет оттенок обдумываемого образа действий; «что предпринять» сохраняет его лучше, чем более общее «что делать».
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: потому что весь народ
  rationale: γάρ вводит причину, ἅπας подчёркивает всеобщность, а λαός в данном контексте естественно переводится как «народ».
- source_word: ἐξεκρέματο αὐτοῦ
  choice: ловя каждое слово
  rationale: Греческая идиома буквально говорит, что народ «висел на Нём», то есть слушал Иисуса с напряжённым, неослабевающим вниманием. Русская идиома «ловить каждое слово» ясно передаёт этот смысл; буквальный образ сохранён в сноске.
- source_word: ἀκούων
  choice: слушал Его
  rationale: Причастие настоящего времени описывает одновременное действие и способ проявления напряжённого внимания. Единственное число согласовано с собирательным существительным «народ».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; естественная идиома в основном тексте сочетается с более буквальной передачей греческого образа в сноске. Местоимение «Его» написано с прописной буквы в соответствии с традиционным русским библейским регистром.
