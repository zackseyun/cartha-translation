  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: ru
  text: Почему ты не внёс мои деньги в банк[a]? А я, вернувшись, получил бы их с процентами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдал мои деньги банкирам»; буквально: «отдал мои деньги на стол».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: почему
  rationale: Естественно передаёт вопрос о причине и сохраняет укоризненный тон.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: не отдал ... в банк
  rationale: В финансовом контексте τράπεζα обозначает место банковских операций; выражение ясно передаёт внесение денег для получения процентов, не воспроизводя буквально устаревший образ стола менялы.
- source_word: μου τὸ ἀργύριον
  choice: мои деньги
  rationale: ἀργύριον буквально связано с серебром, но здесь обозначает деньги; современный русский эквивалент естественен и точен.
- source_word: κἀγὼ ἐλθὼν
  choice: Тогда, вернувшись, я
  rationale: Причастный оборот передан временно-обстоятельственной конструкцией; «тогда» выражает следствие предполагаемого действия слуги.
- source_word: σὺν τόκῳ
  choice: с процентами
  rationale: Стандартное современное обозначение дохода на внесённые деньги без привнесения отрицательных коннотаций ростовщичества.
- source_word: αὐτὸ ἔπραξα
  choice: получил бы их
  rationale: В данном коммерческом контексте πράσσω означает взыскать или получить причитающуюся сумму; условность передана частицей «бы».
