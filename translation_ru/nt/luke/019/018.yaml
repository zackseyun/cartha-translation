  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: ru
  text: 'Второй пришёл и сказал: «Твоя мина, господин, принесла пять мин».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: второй
  rationale: Определённое порядковое числительное естественно передаёт следующего по счёту слугу в повествовании.
- source_word: κύριε
  choice: Господин
  rationale: Это обращение слуги к знатному хозяину в рамках притчи; «Господин» сохраняет уважительный светский смысл без ненужного отождествления с божественным титулом.
- source_word: μνᾶ
  choice: мина
  rationale: Сохранено историческое название денежно-весовой единицы; оно соответствует реалиям текста и форме, уже принятой в русском библейском языке.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: принесла ещё пять мин
  rationale: Буквально «сделала пять мин»; по-русски глагол «принесла» естественно выражает полученную прибыль, а «ещё» ясно показывает прирост, не меняя результата.
theological_decisions:
- issue: Значение обращения κύριε
  choice: Господин
  alternative: Господи
  rationale: В непосредственной сцене раб обращается к своему хозяину. Выбор «Господин» сохраняет повествовательный уровень притчи и не навязывает прямое христологическое прочтение, хотя более широкое применение притчи остаётся открытым.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Реплика звучит естественно; исторический термин «мина» сохранён. Маркеры сносок не требуются.
