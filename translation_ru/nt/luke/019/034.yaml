id: LUK.19.34
reference: Luke 19:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: ru
  text: 'Они сказали[a]: «Он нужен Господу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он нужен хозяину», если κύριος означает владельца или хозяина, а не служит титулом Иисуса.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Они
  rationale: Артикль употреблён субстантивно и указывает на ранее названных учеников. Слабый повествовательный союз δέ в русском естественно не выражать отдельным словом.
- source_word: εἶπαν
  choice: сказали
  rationale: Аорист λέγω передан нейтральным глаголом «сказали», без добавления более узкого оттенка «ответили».
- source_word: ὅτι
  choice: передано двоеточием и кавычками
  rationale: ὅτι вводит прямую речь; в современном русском эту функцию естественно передаёт пунктуация.
- source_word: Ὁ κύριος
  choice: Господу
  rationale: κύριος может означать «Господь» либо «хозяин». Контекст Луки преимущественно указывает на Иисуса, поэтому в основном тексте сохранён титул «Господь», а лексическая неоднозначность отмечена в сноске.
- source_word: αὐτοῦ
  choice: он
  rationale: Местоимение относится к ослёнку. Русский грамматический род требует формы мужского рода; перестройка фразы позволяет ясно и естественно сохранить местоименную отсылку.
- source_word: χρείαν ἔχει
  choice: нужен
  rationale: Греческий оборот буквально означает «имеет нужду в нём». Русское «он нужен Господу» идиоматично и точно передаёт смысл без тяжеловесности.
theological_decisions:
- issue: К кому относится κύριος в ответе учеников
  choice: «Господу» — в контексте как указание на Иисуса
  alternative: «хозяину» — если имеется в виду владелец ослёнка
  rationale: Лука часто называет Иисуса κύριος, и ученики повторяют данную им Иисусом формулу. Однако само слово допускает значение «хозяин», поэтому подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая естественная прямая речь. Инверсия «Он нужен Господу» передаёт греческий смысл яснее и естественнее, чем буквальное «Господь имеет в нём нужду».
