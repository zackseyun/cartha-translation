  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: ru
  text: 'Все плакали и скорбели о ней. Но он сказал: «Не плачьте: она не умерла, а спит».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находится во сне». Иисус употребляет сон как метафорическое обозначение в контексте её предстоящего возвращения к жизни.'
    reason: Лексический вариант и нейтральное пояснение метафорического употребления.
lexical_decisions:
- source_word: ἔκλαιον
  choice: плакали
  rationale: Имперфект передаёт продолжавшееся действие; русская форма несовершенного вида естественно сохраняет эту длительность.
- source_word: πάντες
  choice: все
  rationale: Прямо сохраняет указание на всеобщность среди присутствующих.
- source_word: ἐκόπτοντο αὐτήν
  choice: оплакивали её
  rationale: В контексте траура глагол обозначает скорбное оплакивание, иногда сопровождавшееся ударами в грудь; выбранный вариант передаёт смысл, не добавляя прямо не выраженного жеста.
- source_word: Μὴ κλαίετε
  choice: Не плачьте
  rationale: Настоящее повелительное наклонение с μή может означать прекращение уже совершающегося действия; «Не плачьте» естественно звучит по-русски и не усиливает толкование.
- source_word: οὐ γὰρ
  choice: двоеточие после «Не плачьте»
  rationale: Причинно-пояснительную связь γάρ в современном русском естественно передаёт бессоюзная пояснительная конструкция с двоеточием.
- source_word: ἀπέθανεν
  choice: не умерла
  rationale: Аорист обозначает наступление смерти; совершенный вид «умерла» точно противопоставлен продолжающемуся состоянию «спит».
- source_word: καθεύδει
  choice: спит
  rationale: Настоящее время и метафора сна сохранены непосредственно, без замены толкованием.
theological_decisions:
- issue: Слова Иисуса о том, что девочка «не умерла, а спит»
  choice: Сохранить буквальное противопоставление смерти и сна, не разъясняя его в основном тексте.
  alternative: «Она не останется мёртвой» или «она лишь кажется умершей»
  rationale: Фраза намеренно сохраняет повествовательное и богословское напряжение в преддверии возвращения девочки к жизни; уточняющие варианты разрешали бы неоднозначность за читателя.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и сдержанно-торжественная. Сочетание «плакали и оплакивали» сохраняет два параллельных действия исходного текста, хотя по-русски они близки по смыслу.
