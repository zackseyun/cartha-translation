  naturalness: «Все плакали и скорбели о ней» — естественная современная литературная формулировка, сохраняющая параллелизм оригинала без тавтологии. Строчная форма «он» соответствует обычной русской орфографической норме для местоимения; имя Иисуса не названо в греческом тексте данного стиха.
