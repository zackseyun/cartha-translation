  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: ru
  text: 'Тогда Иисус спросил его: «Как тебя зовут?» Он ответил: «Легион»[a], потому что в него вошло много бесов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Легион» — слово латинского происхождения, обозначавшее крупное подразделение римской армии; здесь это имя указывает на множество бесов в человеке.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν δὲ
  choice: Тогда … спросил
  rationale: Глагол обозначает прямой вопрос, а δέ мягко продвигает повествование вперёд; «тогда» естественно передаёт эту связь.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Как тебя зовут?
  rationale: Естественный современный русский эквивалент греческого вопроса об имени; буквальная конструкция звучала бы не по-русски.
- source_word: Λεγιών
  choice: Легион
  rationale: Сохранено имя, являющееся заимствованным обозначением крупного римского воинского подразделения.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину, по которой дано имя «Легион».
- source_word: εἰσῆλθεν
  choice: вошло
  rationale: Аорист сообщает о совершившемся вхождении; в русском прошедшее совершенного вида естественно выражает предшествующее событие без необходимости добавочного временного уточнения.
- source_word: δαιμόνια πολλὰ
  choice: много бесов
  rationale: «Бесы» — точное, понятное и устойчивое в русском библейском языке обозначение злых духовных существ; конструкция сохраняет акцент на их многочисленности.
- source_word: εἰς αὐτόν
  choice: в него
  rationale: Предлог εἰς передаёт направленность внутрь, которую сохраняет русское «в него».
theological_decisions:
- issue: Передача δαιμόνια в повествовании об одержимости
  choice: бесов
  alternative: злых духов; демонов
  rationale: Выбор прямо сохраняет утверждение текста о множестве личных злых духов и не смягчает его сверхъестественный смысл.
- issue: Временное соотношение εἰσῆλθεν с ответом «Легион»
  choice: вошло
  alternative: уже вошло
  rationale: Русский совершенный вид достаточно ясно обозначает завершившееся ранее вхождение; слово «уже» не добавлено, поскольку его нет в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с естественным диалогом и умеренно библейской лексикой. Местоимения, относящиеся к Иисусу, не капитализируются сверх обычных правил русского языка.
