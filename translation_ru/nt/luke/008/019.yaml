  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: ru
  text: Его мать и братья[b] пришли к Нему, но из-за толпы не могли добраться до Него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встретиться с Ним»; «подойти к Нему».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «братья». Некоторые понимают это слово шире — как «родственники», однако сам текст говорит «братья».
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: К Нему пришли
  rationale: Естественно передаёт прибытие к Иисусу; δέ служит мягким повествовательным переходом и не требует отдельного слова в русском тексте.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: Его мать и братья
  rationale: Сохраняет прямо названные родственные отношения и естественный для русского языка общий притяжательный определитель.
- source_word: οὐκ ἠδύναντο συντυχεῖν αὐτῷ
  choice: не могли приблизиться к Нему
  rationale: В контексте препятствующей толпы выражает невозможность добраться до Иисуса и вступить с Ним в непосредственный контакт, не придавая встрече формального характера.
- source_word: διὰ τὸν ὄχλον
  choice: из-за толпы
  rationale: Кратко и естественно передаёт причинное значение διά с винительным падежом.
theological_decisions:
- issue: Кого обозначает выражение «Его братья»
  choice: 'Передать буквально: «братья»'
  alternative: «родственники» или «сородичи»
  rationale: Греческий текст употребляет ἀδελφοί и не уточняет характер родства. Перевод не должен разрешать историко-богословский спор о том, были ли они родными братьями, сводными братьями или иными родственниками.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный по тону. Местоимение «Нему» применительно к Иисусу написано с прописной буквы в соответствии с принятой русской библейской традицией. Порядок маркеров [a][b] соответствует порядку поясняемых мест: сначала значение глагольного выражения, затем родственный термин.'
