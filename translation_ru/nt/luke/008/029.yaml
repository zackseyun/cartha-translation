  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: ru
  text: Ибо Иисус велел нечистому духу выйти из этого человека. Ведь тот много раз[a] овладевал им; человека связывали цепями и кандалами и держали под стражей, а он, разрывая путы, был гоним бесом в безлюдные места[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долгое время». Греческое выражение допускает указание как на неоднократность, так и на продолжительность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в пустыню». Буквально: «в пустынные (безлюдные) места»; в греческом тексте употреблено множественное число.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: велел
  rationale: Передаёт властное повеление Иисуса естественным русским глаголом; в данном объяснительном контексте несовершенный вид греческого глагола обозначает предшествующее фоновое действие, которое по-русски яснее выражается формой «велел».
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: нечистому духу
  rationale: Сохраняет обычное новозаветное обозначение и прямую связь с понятием ритуальной и нравственной нечистоты.
- source_word: πολλοῖς χρόνοις
  choice: много раз
  rationale: Множественное число и описание повторявшихся попыток связать человека поддерживают значение неоднократности; возможное значение длительности сохранено в сноске.
- source_word: συνηρπάκει
  choice: овладевал им
  rationale: Передаёт насильственное подчинение человека духом и хорошо сочетается с повторным характером действия.
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: цепями и кандалами
  rationale: Различает два вида средств удержания и звучит понятно для современного читателя.
- source_word: φυλασσόμενος
  choice: держали под стражей
  rationale: Естественно выражает продолжающийся надзор, сопровождавший связывание.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: разрывал путы
  rationale: Сохраняет силу глагола и использует более общее слово для удерживающих средств, не повторяя «цепи».
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: бес гнал его
  rationale: Активная русская конструкция ясно передаёт названного деятеля и принудительный, повторяющийся характер движения.
- source_word: εἰς τὰς ἐρήμους
  choice: в безлюдные места
  rationale: Сохраняет множественное число греческого выражения и его основной смысл — необитаемые, пустынные места.
theological_decisions:
- issue: Обозначение демонической силы
  choice: нечистый дух; бес
  alternative: злой дух; демон
  rationale: Перевод прямо сохраняет личную демоническую деятельность в мире повествования, не сводя её к метафоре или болезни; при этом два разных греческих обозначения переданы двумя привычными русскими выражениями.
- issue: Субъект повеления
  choice: Иисус велел
  alternative: Он велел
  rationale: Имя «Иисус» эксплицирует очевидный из контекста референт греческой глагольной формы, не меняя смысла и устраняя неясность в отдельно цитируемом стихе.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Причастные конструкции исходного текста развёрнуты в личные формы ради естественности; тон остаётся сдержанным и достойным. Противительный оттенок перед «разрывал путы» выражен союзом «но», поскольку он естественно следует из контекста, хотя греческий текст использует обычное соединительное καί.
