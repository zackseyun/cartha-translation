  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: ru
  text: И вся толпа из окрестностей герасинцев попросила Его уйти от них, потому что великий страх овладел ими[a]. Тогда Он сел в лодку и возвратился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они были охвачены великим страхом».'
    reason: Лексическая альтернатива для συνείχοντο; сохраняет образ людей, охваченных или объятых страхом.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: попросил
  rationale: В данном контексте ἐρωτάω означает обращение с просьбой. «Попросил» естественно передаёт это значение, не усиливая его до «умолял».
- source_word: ἅπαν τὸ πλῆθος
  choice: весь народ
  rationale: Сочетание обозначает всё собравшееся множество людей. «Весь народ» звучит естественно по-русски и сохраняет собирательный и всеохватный смысл, не предполагая буквально каждого жителя области.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: из окрестностей Герасы
  rationale: περίχωρος обозначает окружающую область, а Γερασηνοί — людей или местность, связанную с Герасой. Русская формулировка кратко и естественно передаёт географическую принадлежность; буквальная структура отмечена в сноске.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: уйти от них
  rationale: Инфинитив выражает содержание просьбы, а ἀπό — удаление от людей. «Уйти от них» точно и современно передаёт направление действия.
- source_word: φόβῳ μεγάλῳ συνείχοντο
  choice: они были охвачены сильным страхом
  rationale: συνέχω в страдательной форме описывает состояние, властно овладевшее людьми. «Были охвачены» сохраняет образ, а «сильный страх» естественно передаёт φόβος μέγας.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: сел в лодку
  rationale: Причастие описывает посадку в судно. «Сел в лодку» — обычное современное русское выражение, точно передающее действие.
- source_word: ὑπέστρεψεν
  choice: возвратился
  rationale: Глагол означает возвращение назад. «Возвратился» соответствует сдержанному повествовательному регистру.
theological_decisions:
- issue: Причина страха жителей перед Иисусом
  choice: Сообщается лишь, что сильный страх побудил их просить Иисуса уйти.
  alternative: Истолковать страх как благоговение перед Божьей силой либо как враждебную реакцию на ущерб и общественные перемены.
  rationale: Греческий текст не уточняет характера и причин страха, поэтому перевод не разрешает эту богословскую и повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Местоимение «Его» написано с прописной буквы по принятой русской библейской традиции; дополнительных толкований в текст не внесено.
