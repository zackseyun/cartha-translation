  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: ru
  text: и Иоанна[a], жена Хузы, управляющего Ирода, и Сусанна, и многие другие женщины, которые служили им из своего имущества.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Ему» вместо «им».'
    reason: textual_variant
  - marker: b
    text: 'Или: «из того, что им принадлежало»; «за счёт своих средств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: жена Хузы
  rationale: В приложении к имени Иоанны и с последующим личным именем в родительном падеже γυνή естественно обозначает супругу.
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: управляющего Ирода
  rationale: ἐπίτροπος обозначает человека, которому поручено управление делами или имуществом; «управляющий» понятно современному читателю и не звучит корпоративно.
- source_word: ἕτεραι πολλαί
  choice: многие другие женщины
  rationale: Форма женского рода отсылает к перечисленным женщинам; явное существительное устраняет неестественную для русского языка неопределённость.
- source_word: διηκόνουν
  choice: служили
  rationale: Передаёт широкое значение διακονέω, не ограничивая служение только материальным обеспечением и не привнося позднейшего церковного оттенка.
- source_word: αὐτοῖς
  choice: им
  rationale: Перевод следует множественному числу в SBLGNT, естественно относя его к Иисусу и бывшим с Ним.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: используя своё имущество
  rationale: Фраза означает, что женщины служили за счёт принадлежавших им средств или имущества; эта формулировка естественна по-русски и сохраняет указание на собственные ресурсы.
theological_decisions:
- issue: Число и референт αὐτοῖς
  choice: 'множественное число: женщины служили им'
  alternative: 'единственное число: женщины служили Ему, Иисусу'
  rationale: Основной текст SBLGNT содержит αὐτοῖς во множественном числе. Вариант единственного числа отмечен в сноске без догматического предпочтения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Союзы сохраняют связь с продолжающимся перечнем предыдущего стиха; «женщины» добавлено для естественности и для явной передачи женского рода ἕτεραι.
