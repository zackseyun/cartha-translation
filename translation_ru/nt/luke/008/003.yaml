review_pass:
  verdict: revise
  source_fidelity: Перечень имён, семейное обозначение «жена Хузы», должность Хузы при Ироде, женский род «многих других женщин» и множественное «им» точно передают греческий текст SBLGNT. Однако «используя своё имущество» несколько смещает конструкцию к способу действия; ἐκ τῶν ὑπαρχόντων αὐταῖς означает, что служение осуществлялось из принадлежавших женщинам ресурсов.
  naturalness: Фраза «служили им из своего имущества» естественна в современном литературном русском, лаконична и точно выражает источник материального обеспечения. Начальное строчное «и» уместно, поскольку стих продолжает перечень предыдущего стиха.
  terminology: «Управляющий Ирода» — удачная нейтральная передача ἐπίτροπος; «служили» сохраняет широкое значение διηκόνουν, не навязывая конкретный вид служения. Имена «Иоанна», «Хуза», «Сусанна» даны в принятой русской библейской форме. Сноска a корректно отражает вариант единственного числа; сноска b сохраняет допустимые лексические альтернативы.
  issues:
  - severity: low
    issue: «используя своё имущество»
    rationale: Деепричастная конструкция может означать, что имущество было непосредственно инструментом служения, тогда как греческий предлог ἐκ обозначает источник ресурсов. «Из своего имущества» передаёт это отношение точнее и звучит более естественно.
