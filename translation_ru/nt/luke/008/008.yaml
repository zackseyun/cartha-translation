  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: ru
  text: 'А другое семя упало на добрую почву[a] и, когда выросло, принесло стократный плод[b]. Говоря это, Иисус возглашал: «У кого есть уши, чтобы слышать, пусть слышит!»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «на добрую землю».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дало стократный урожай».'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционный перевод: «Кто имеет уши слышать, да слышит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: другое семя
  rationale: Форма среднего рода подразумевает ещё одно семя из описываемого ряда. Слово «семя» добавлено как ясное из контекста подразумеваемое существительное.
- source_word: γῆν τὴν ἀγαθήν
  choice: добрую почву
  rationale: В земледельческом контексте γῆ означает именно почву; «добрая» сохраняет положительную оценку ἀγαθήν и привычное звучание притчи.
- source_word: φυὲν
  choice: когда выросло
  rationale: Аористное причастие передаёт рост, предшествующий принесению плода; придаточное времени естественно звучит по-русски.
- source_word: ἐποίησεν καρπὸν ἑκατονταπλασίονα
  choice: принесло плод во сто крат
  rationale: Сохраняется образ плода и значение стократной урожайности; выражение понятно и обладает уместным библейским достоинством.
- source_word: ταῦτα λέγων
  choice: говоря это
  rationale: Настоящее причастие выражает одновременность с последующим громким обращением.
- source_word: ἐφώνει
  choice: громко воззвал
  rationale: Глагол обозначает подчёркнуто громкое публичное произнесение. «Воззвал» сохраняет торжественный тон, а наречие проясняет силу голоса.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: у кого есть уши, чтобы слышать
  rationale: Конструкция передана обобщённо и без необоснованного указания на мужской пол; инфинитив цели сохранён естественным русским оборотом.
- source_word: ἀκουέτω
  choice: пусть слышит
  rationale: Точно передаёт третье лицо единственного числа настоящего императива и сохраняет призыв к внимательному восприятию.
theological_decisions:
- issue: Обобщённое лицо в призыве Иисуса
  choice: «У кого есть уши, чтобы слышать, пусть слышит»
  alternative: «Кто имеет уши слышать, да слышит»
  rationale: Греческая конструкция относится к любому слушателю, а не только к мужчине. Основной вариант сохраняет единственное число и повелительную силу, не привнося гендерной специфики.
- issue: Смысл глагола ἀκούω в заключительном призыве
  choice: сохранить «слышать», не заменяя его толкованием «слушаться» или «понимать»
  alternative: «пусть внимательно слушает»
  rationale: Греческий текст допускает более глубокий смысл восприимчивого слушания, но не выражает его отдельным словом; буквальный образ ушей и слышания сохраняет намеренную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием прямой речи. Местоимение «Иисус» введено вместо отсутствующего в греческом подлежащего для естественности и ясности; конфессиональная капитализация местоимений не используется.
