id: LUK.8.24
reference: Luke 8:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: ru
  text: 'Подойдя, они разбудили его и сказали: «Наставник! Наставник! Мы погибаем!» Проснувшись, он запретил ветру и волнению воды[a]. Они прекратились, и настала тишина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бурным волнам».'
    reason: Лексическая альтернатива для κλύδωνι τοῦ ὕδατος, которое может обозначать как волнение воды, так и вздымающиеся волны.
lexical_decisions:
- source_word: προσελθόντες
  choice: Подойдя
  rationale: Аористное причастие передаёт движение учеников к Иисусу перед тем, как они его разбудили, без лишнего уточнения.
- source_word: διήγειραν
  choice: разбудили
  rationale: Естественный современный русский эквивалент переходного глагола со значением пробуждения ото сна.
- source_word: Ἐπιστάτα
  choice: Наставник
  rationale: Обращение, характерное для Луки, выражает признание авторитета Иисуса; «Наставник» сохраняет это значение лучше, чем исключительно педагогическое «Учитель».
- source_word: ἀπολλύμεθα
  choice: Мы погибаем
  rationale: Настоящее время передаёт происходящую и непосредственно угрожающую гибель.
- source_word: διεγερθεὶς
  choice: Проснувшись
  rationale: Сохраняет последовательность действий, выраженную аористным причастием, и естественно звучит по-русски.
- source_word: ἐπετίμησεν
  choice: запретил
  rationale: В евангельском контексте глагол обозначает властное обуздание или строгий приказ; «запретил» сохраняет силу действия без пояснительной добавки.
- source_word: τῷ ἀνέμῳ
  choice: ветру
  rationale: Прямое и точное обозначение ветра; дательный падеж естественно обусловлен русским глаголом «запретил».
- source_word: τῷ κλύδωνι τοῦ ὕδατος
  choice: волнению воды
  rationale: κλύδων обозначает сильное волнение, зыбь или набегающие волны, а τοῦ ὕδατος уточняет, что речь идёт о воде. Формулировка сохраняет образ, не сводя его только к отдельным волнам.
- source_word: ἐπαύσαντο
  choice: Они прекратились
  rationale: Множественное число сохраняет грамматическую отсылку к ветру и волнению воды как двум явлениям.
- source_word: ἐγένετο γαλήνη
  choice: настала тишина
  rationale: Естественная русская передача наступившего полного спокойствия после ветра и волнения.
theological_decisions:
- issue: Передача обращения Ἐπιστάτα к Иисусу
  choice: Наставник
  alternative: Учитель; Повелитель
  rationale: «Наставник» выражает уважительное признание авторитета Иисуса, не ограничивая обращение одной лишь ролью преподавателя и не усиливая его до отсутствующего в тексте титула «Повелитель».
- issue: Характер власти Иисуса в ἐπετίμησεν
  choice: запретил
  alternative: приказал; укорил
  rationale: Форма сохраняет представленное в тексте непосредственное и властное воздействие Иисуса на ветер и воду, не добавляя богословского объяснения природы этой власти.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным повествованием. Повтор обращения и последовательность действий сохранены; местоимения, относящиеся к Иисусу, даны со строчной буквы согласно нейтральной современной издательской норме.
