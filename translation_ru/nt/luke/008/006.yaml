base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: ru
  text: А другое упало на скалу и, взойдя, засохло, потому что ему не хватило влаги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: другое
  rationale: Субстантивированное прилагательное среднего рода обозначает другое семя в последовательности; русский перевод сохраняет подразумеваемое «семя».
- source_word: κατέπεσεν
  choice: упало
  rationale: Простая и естественная передача аориста καταπίπτω без избыточного усиления значения приставки.
- source_word: ἐπὶ τὴν πέτραν
  choice: на скалу
  rationale: Сохранены единственное число и конкретный образ πέτρα; более широкое «на каменистую почву» не вносится в текст.
- source_word: φυὲν
  choice: взойдя
  rationale: Деепричастие естественно передаёт предшествующее действие и обычный русский образ всходящего семени.
- source_word: ἐξηράνθη
  choice: засохло
  rationale: В контексте растения глагол естественно означает, что оно высохло и увяло; «засохло» кратко сохраняет этот земледельческий образ.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: потому что ему не хватило
  rationale: Причинная конструкция передана ясно и по-русски естественно; местоимение относится к подразумеваемому семени или растению.
- source_word: ἰκμάδα
  choice: влаги
  rationale: ἰκμάς обозначает необходимую для роста влагу; вариант «сок» был бы неоправданно узким.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая и образная. Единственное число «скалу» сохраняет конкретность греческого текста, а деепричастие «взойдя» — последовательность событий.
