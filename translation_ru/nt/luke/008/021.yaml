base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: ru
  text: 'Он же ответил им: «Моя мать и мои братья[a] — те, кто слушают слово Божье и исполняют его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры». В греческом тексте буквально «братья», однако смысл высказывания может распространяться не только на мужчин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ответил
  rationale: Русское «ответил» естественно передаёт греческую повествовательную формулу; буквальное «ответив, сказал» здесь звучало бы избыточно и не добавляло бы смысла.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: Естественная русская передача адресата речи без лишнего утяжеления.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: моя мать и мои братья
  rationale: Сохраняется буквальная родственная лексика и мужской род ἀδελφοί, перекликающийся с упомянутыми ранее родными Иисуса.
- source_word: οὗτοί εἰσιν οἱ
  choice: те, кто
  rationale: Передаёт отождествление и указательную силу конструкции естественным современным русским выражением.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Традиционная и понятная передача λόγος как Божьего слова или возвещённой вести, сохраняющая богословскую ёмкость выражения.
- source_word: ἀκούοντες
  choice: слушает
  rationale: В данном контексте глагол обозначает не только физическое восприятие звука, но внимательное слушание; настоящее причастие выражает характерное, продолжающееся действие.
- source_word: ποιοῦντες
  choice: исполняет его
  rationale: Передаёт осуществление услышанного на деле, не добавляя более узкого толкования «повинуется».
theological_decisions:
- issue: Кого Иисус называет своей семьёй
  choice: Высказывание относит к семье Иисуса тех, кто слушает слово Божье и исполняет его, не утверждая при этом прямого отвержения его кровных родственников.
  alternative: Понять слова как полное отвержение биологической семьи.
  rationale: Текст переопределяет основание духовного родства, но сам по себе не говорит, что Иисус отвергает мать и братьев.
- issue: Объём значения ἀδελφοί
  choice: В основном тексте сохранено «братья», а возможное более широкое применение отмечено в сноске.
  alternative: Перевести в основном тексте как «братья и сёстры» или «родные».
  rationale: Греческое слово имеет форму мужского рода и непосредственно перекликается с буквальными братьями Иисуса, однако применение высказывания может не ограничиваться мужчинами.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Местоимения, относящиеся к Иисусу, набраны со строчной буквы в соответствии с обычной современной издательской практикой. Конструкция «те, кто слушает… и исполняет» сохраняет обобщающий характер греческих причастий.
