lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Когда они плыли
  rationale: Родительный самостоятельный оборот с причастием настоящего времени задаёт фоновое продолжающееся действие; эта формулировка естественна по-русски.
- source_word: ἀφύπνωσεν
  choice: Он уснул
  rationale: Аорист передаёт наступление сна; «уснул» точно и естественно выражает это значение. Местоимение указывает на Иисуса из контекста.
- source_word: κατέβη λαῖλαψ ἀνέμου
  choice: обрушилась буря с сильным ветром
  rationale: Глагол κατέβη буквально описывает движение вниз, а λαῖλαψ ἀνέμου — сильную ветровую бурю. «Обрушилась» естественно передаёт внезапное нисхождение бури на озеро, не превращая выражение в метеорологический термин.
- source_word: εἰς τὴν λίμνην
  choice: на озеро
  rationale: В сочетании с глаголом движения и погодным явлением εἰς идиоматично обозначает, что буря сошла на поверхность озера.
- source_word: συνεπληροῦντο
  choice: лодку заливало водой
  rationale: Греческая форма стоит во множественном числе и допускает буквальное понимание «они наполнялись», однако по ситуации речь идёт о наполнении лодки водой. Русская формулировка ясно передаёт продолжающийся процесс, а неоднозначность отмечена в сноске.
- source_word: ἐκινδύνευον
  choice: они оказались в опасности
  rationale: Передаёт реальную угрозу для находившихся в лодке. Несовершенный вид конструкции в целом поддерживается предшествующим «заливало».
