source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: ru
  text: Тогда бесы вышли из человека и вошли в свиней, а стадо бросилось по крутому склону[a] в озеро и утонуло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с обрыва»; греческое выражение обозначает крутой спуск.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: вышли
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу; в естественном русском последовательность ясно передаётся личной формой.
- source_word: τὰ δαιμόνια
  choice: бесы
  rationale: Греческое существительное означает именно бесов; это сохраняет отличие от выражения «нечистые духи».
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: из человека
  rationale: С глаголом выхода предлог ἀπό здесь естественно передаётся как «из»; речь идёт о ранее упомянутом человеке.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: вошли в свиней
  rationale: Передаёт направленное движение внутрь животных без добавочного толкования.
- source_word: τοὺς χοίρους
  choice: свиней
  rationale: Современное общеупотребительное и точное обозначение животных.
- source_word: ὥρμησεν
  choice: бросилось
  rationale: Глагол выражает внезапное и стремительное движение; «бросилось» естественно сочетается со словом «стадо».
- source_word: ἡ ἀγέλη
  choice: стадо
  rationale: Обычное русское собирательное обозначение группы свиней.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: по крутому склону
  rationale: Фраза обозначает движение вниз по крутому спуску; перевод не усиливает образ до обязательного отвесного утёса.
- source_word: τὴν λίμνην
  choice: озеро
  rationale: λίμνη означает озеро; сохраняется лексический выбор Луки, отличный от слова «море».
- source_word: ἀπεπνίγη
  choice: утонуло
  rationale: В контексте падения стада в воду глагол означает гибель от утопления; форма согласована с собирательным существительным «стадо».
theological_decisions:
- issue: Передача δαιμόνια в повествовании об одержимости
  choice: бесы
  alternative: нечистые духи
  rationale: В данном стихе употреблено δαιμόνια, поэтому перевод сохраняет собственную лексику текста и не подменяет её близким, но иным выражением.
- issue: Степень топографической конкретности κρημνός
  choice: крутой склон
  alternative: обрыв
  rationale: Слово указывает на крутой спуск, но само по себе не требует представления об отвесной скале; основной текст сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-повествовательный. Союз «а» естественно переводит переход к действию стада, не создавая излишне тяжёлой цепочки с повторным «и».
