  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: ru
  text: Её родители были поражены, но Он велел им никому не рассказывать о случившемся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέστησαν
  choice: были поражены
  rationale: Передаёт сильное изумление и потрясение родителей естественным современным русским языком, не прибегая к чрезмерно идиоматическому «были вне себя».
- source_word: οἱ γονεῖς αὐτῆς
  choice: её родители
  rationale: Прямое и естественное соответствие стандартному обозначению отца и матери.
- source_word: παρήγγειλεν
  choice: велел
  rationale: Сохраняет директивную силу παραγγέλλω без излишне жёсткой окраски слова «приказал».
- source_word: μηδενὶ εἰπεῖν
  choice: никому не рассказывать
  rationale: Естественно передаёт запрет сообщать другим о событии; русский несовершенный инфинитив после «велел не» здесь идиоматичен.
- source_word: τὸ γεγονός
  choice: о случившемся
  rationale: Передаёт субстантивированное причастие совершенного вида как уже происшедшее событие, сохраняя естественность русского повествования.
- source_word: δὲ
  choice: но
  rationale: Выражает лёгкое противопоставление между потрясением родителей и последовавшим повелением Иисуса.
theological_decisions:
- issue: Мотив мессианской тайны и объём повеления Иисуса
  choice: Передать прямое повеление никому не рассказывать о случившемся без объяснения его мотива или срока действия.
  alternative: Истолковать запрет как элемент мессианской тайны либо как временное распоряжение, ограниченное определённым кругом людей.
  rationale: Сам стих сообщает только о запрете рассказывать; перевод не должен добавлять отсутствующее в тексте богословское объяснение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской издательской традицией; синтаксис остаётся простым и повествовательным.
