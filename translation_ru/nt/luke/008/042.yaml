    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: единственная
  rationale: В сочетании с «дочь» означает единственного ребёнка женского пола; «единственная дочь» естественно передаёт смысл без привнесения идеи особого способа рождения.
- source_word: ὡς ἐτῶν δώδεκα
  choice: лет двенадцати
  rationale: Частица ὡς при числе выражает приблизительность; обычная русская конструкция «лет двенадцати» сохраняет её.
- source_word: ἀπέθνῃσκεν
  choice: умирала
  rationale: Имперфект изображает продолжающийся процесс, а не уже наступившую смерть.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Когда же Он шёл
  rationale: Конструкция с ἐν и субстантивированным инфинитивом обозначает одновременность; перевод не добавляет прямо не названного пункта назначения.
- source_word: οἱ ὄχλοι
  choice: толпы
  rationale: Сохранено множественное число греческого существительного.
- source_word: συνέπνιγον
  choice: теснили
  rationale: Глагол обозначает сильное сдавливание окружающими людьми и может подразумевать, что Его едва не душили; «теснили» естественно для повествования, а оттенок силы пояснён в сноске.
- source_word: ὅτι
  choice: потому что
  rationale: Союз объясняет настоятельность просьбы Иаира, изложенной в предыдущем стихе.
- source_word: αὐτῷ
  choice: у него была
  rationale: Дательный падеж при ἦν выражает обладание; эта русская конструкция точно и естественно его передаёт.
