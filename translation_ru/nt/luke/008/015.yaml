id: LUK.8.15
reference: Luke 8:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: ru
  text: А семя на доброй земле — это те, кто, услышав слово с благородным и добрым сердцем[a], крепко хранят его и приносят плод, проявляя стойкость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с честным и добрым сердцем».'
    reason: Лексическая альтернатива для καλῇ καὶ ἀγαθῇ; «честным» возможно, хотя в современном русском может восприниматься преимущественно как «правдивым».
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: семя на доброй земле
  rationale: Греческое выражение эллиптично и в контексте притчи отсылает к семени. Слово «семя» добавлено для ясности, а «земля» естественно сохраняет земледельческий образ.
- source_word: καλῇ γῇ
  choice: доброй земле
  rationale: γῆ здесь означает почву, на которую падает семя; традиционное и понятное сочетание «добрая земля» сохраняет как земледельческий, так и оценочный оттенок καλῇ.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: это те, кто
  rationale: Передаёт отождествляющую и пояснительную функцию конструкции естественным современным русским языком.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: с благородным и добрым сердцем
  rationale: «Сердце» обозначает внутреннего человека. Два близких, но не тождественных прилагательных переданы разными словами, чтобы сохранить двойную положительную характеристику без сведения её к одной лишь правдивости.
- source_word: ἀκούσαντες τὸν λόγον
  choice: услышав слово
  rationale: 'Деепричастие естественно передаёт предшествование: сначала люди слышат слово, затем хранят его и приносят плод.'
- source_word: κατέχουσιν
  choice: крепко хранят его
  rationale: Глагол выражает не простое обладание, а стойкое удержание. Местоимение «его» явно отсылает к слову.
- source_word: καρποφοροῦσιν
  choice: приносят плод
  rationale: Сохраняется земледельческий образ притчи и обычная русская библейская метафора.
- source_word: ἐν ὑπομονῇ
  choice: проявляя стойкость
  rationale: ὑπομονή означает стойкое терпение и выдержку. Такая формулировка ясно описывает образ действия и не сужает смысл до пассивного ожидания.
theological_decisions:
- issue: Нравственная характеристика восприимчивого сердца
  choice: с благородным и добрым сердцем
  alternative: с честным и добрым сердцем
  rationale: Перевод сохраняет положительную нравственную характеристику внутреннего расположения слушающих, но не добавляет объяснения того, как оно возникает, и не вводит выводов о заслуге, возрождении или порядке спасения.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified библейской интонацией. Синтаксис сохраняет образ притчи, избегая архаизмов и конфессионально нагруженных уточнений.
