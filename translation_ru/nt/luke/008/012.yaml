id: LUK.8.12
reference: Luke 8:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: ru
  text: А упавшее у дороги — это те, кто услышал. Потом приходит дьявол и уносит слово[a] из их сердец, чтобы они не уверовали и не были спасены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «слово» означает возвещённое Божье послание в этой притче.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: у дороги
  rationale: Передаёт пространственный образ семени, упавшего рядом с дорогой, естественным современным русским выражением.
- source_word: οἱ ἀκούσαντες
  choice: те, кто услышал
  rationale: Естественно передаёт субстантивированное причастие аориста и характеризует людей по их состоявшемуся слышанию слова.
- source_word: εἶτα
  choice: потом
  rationale: Ясно обозначает последовательность действий.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: В контексте обозначает личное злое существо; это общепринятый и точный русский эквивалент.
- source_word: αἴρει
  choice: уносит
  rationale: Передаёт удаление слова из сердца, не добавляя отсутствующей в глаголе идеи насильственного вырывания.
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняет библейскую формулировку; в контексте притчи речь идёт о возвещённом Божьем послании, что пояснено в сноске.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: из их сердец
  rationale: Сохраняет библейское понимание сердца как внутреннего средоточия мысли, воли и отклика, а множественное число соответствует множеству людей.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: чтобы они не уверовали и не были спасены
  rationale: Естественно передаёт целевую конструкцию с μή и связь веры со спасением, не превращая русскую фразу в тяжеловесный буквальный оборот.
- source_word: πιστεύσαντες
  choice: уверовали
  rationale: В данном контексте речь идёт не просто о признании факта, а о приходе к вере в ответ на услышанное слово; совершенный вид соответствует аористу.
- source_word: σωθῶσιν
  choice: были спасены
  rationale: Страдательная форма и сотериологический смысл греческого глагола переданы прямо и без сужения до временного избавления.
theological_decisions:
- issue: Связь веры и спасения
  choice: «чтобы они не уверовали и не были спасены»
  alternative: Толкования, уточняющие характер веры, её продолжительность или причинный порядок спасения
  rationale: Греческий текст связывает предотвращение веры с предотвращением спасения, но не разрешает более широкие межконфессиональные споры; перевод сохраняет эту связь без догматических добавлений.
- issue: Значение ἵνα в описании действия дьявола
  choice: цель передана союзом «чтобы»
  alternative: 'Ослабленное следствие: «так что они не веруют и не спасаются»'
  rationale: Конструкция ἵνα μή естественно выражает направленность действия дьявола; перевод не приписывает эту цель Богу и не устраняет напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Начальное «упавшее» восполняет подразумеваемое семя из непосредственного контекста притчи и делает фразу понятной по-русски; формулировка не добавляет толкования сверх образа оригинала.
