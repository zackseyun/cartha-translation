base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: ru
  text: Когда Иисус вернулся, народ принял Его[a], потому что все ждали Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ радушно принял Его»; греческий глагол может означать «принять» или «радушно принять» и в данном контексте имеет положительный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что все ожидали Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Когда ... вернулся
  rationale: Конструкция ἐν с артиклевым инфинитивом выражает время; по-русски естественно передаётся придаточным с «когда». Частица δέ отмечает продолжение повествования и не требует отдельного слова в данном контексте.
- source_word: ὑποστρέφειν
  choice: вернулся
  rationale: ὑποστρέφω означает «возвращаться, вернуться»; совершенный вид естественно представляет событие как наступившее.
- source_word: ἀπεδέξατο
  choice: радушно принял
  rationale: ἀποδέχομαι здесь обозначает благожелательный приём. «Радушно принял» передаёт положительный оттенок глагола, не добавляя более сильного «с радостью».
- source_word: ὁ ὄχλος
  choice: народ
  rationale: В данном повествовательном контексте ὄχλος — собравшаяся масса людей; «народ» звучит естественно и не означает здесь нацию.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: потому что все ждали Его
  rationale: γάρ вводит причину, а προσδοκάω допускает значения «ждать» и «ожидать». «Все ждали Его» естественно передаёт продолжающееся ожидание и сохраняет πάντες.
- source_word: Ἰησοῦν
  choice: Иисус
  rationale: Имя передано в принятой русской библейской форме.
