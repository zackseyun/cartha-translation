base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: ru
  text: Придя в дом, Он никому не позволил войти с Ним, кроме Петра, Иоанна, Иакова, отца девочки и её матери[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ребёнка». Греческое слово может обозначать ребёнка вообще, но из контекста ясно, что речь идёт о девочке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: Придя в дом
  rationale: Аористное причастие передаёт предшествующее обстоятельство; деепричастный оборот естественно и кратко выражает последовательность действий. δέ в данном контексте не требует отдельного перевода.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: никому не позволил войти
  rationale: ἀφίημι с инфинитивом здесь означает «позволять». Отрицательная конструкция с τινα по-русски естественно передаётся местоимением «никому».
- source_word: τινα σὺν αὐτῷ
  choice: никому … войти с Ним
  rationale: Неопределённое местоимение в отрицательной конструкции имеет обобщающее значение. Оборот σὺν αὐτῷ отнесён к действию входа.
- source_word: εἰ μὴ
  choice: кроме
  rationale: После отрицания выражение вводит исключение, а не условие.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Петра, Иоанна и Иакова
  rationale: Имена переданы в их устойчивой русской библейской форме; повторение καὶ сглажено согласно нормам современного русского перечисления.
- source_word: τῆς παιδὸς
  choice: девочки
  rationale: παῖς может обозначать ребёнка любого пола, однако непосредственный контекст ясно указывает на дочь Иаира; перевод «девочка» естественен и контекстуально точен.
- source_word: τὸν πατέρα … καὶ τὴν μητέρα
  choice: отца и матери
  rationale: Сохранено раздельное упоминание обоих родителей, а не обобщающее «родителей».
theological_decisions:
- issue: Конкретизация значения παῖς по контексту
  choice: девочки
  alternative: ребёнка
  rationale: Само существительное допускает общее значение «ребёнок», но в повествовании речь идёт о дочери Иаира. Контекстуальная конкретизация не добавляет богословского толкования; лексическая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской издательской традиции.
