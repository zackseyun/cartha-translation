  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: ru
  text: 'Но Он взял её за руку и позвал: «Дитя[a], встань!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Девочка, встань!» Греческое слово παῖς может означать «ребёнок» или, в данном контексте, «девочка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Но Он
  rationale: δέ обозначает здесь переход с лёгким противопоставлением реакции окружающих; αὐτός естественно передаётся местоимением без искусственного усиления «Сам».
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: взял её за руку
  rationale: Так естественно по-русски передаётся конкретное действие — Иисус берёт девочку за руку; выражение не приобретает излишне резкого оттенка «схватил».
- source_word: ἐφώνησεν λέγων
  choice: громко сказал
  rationale: φωνέω указывает на произнесённый вслух призыв, а λέγων вводит прямую речь. Сочетание передано естественно, без тяжеловесного «возгласил, говоря».
- source_word: Ἡ παῖς
  choice: Дитя
  rationale: παῖς может означать ребёнка вообще или девочку в данном контексте. «Дитя» сохраняет широту слова и ласковый, достойный тон, не добавляя уменьшительности.
- source_word: ἔγειρε
  choice: встань
  rationale: Прямое повеление ἐγείρω в контексте возвращения к жизни естественно передаётся современным русским «встань»; оно может обозначать как поднятие, так и пробуждение.
theological_decisions:
- issue: Обращение Иисуса к дочери Иаира
  choice: Дитя
  alternative: Девочка
  rationale: Выбор сохраняет смысловую широту παῖς и не гармонизирует стих с формулировками параллельных повествований.
- issue: Повеление при возвращении к жизни
  choice: встань
  alternative: поднимись
  rationale: Оставлено простое и непосредственное повеление без архаизации; многозначность ἐγείρω в контексте пробуждения и вставания не превращается в отдельное доктринальное пояснение.
translation_notes:
  register: Современный литературный русский язык с dignified, но не архаичным библейским звучанием. Заглавное «Он» использовано как традиционное уважительное обозначение Иисуса; синтаксис сделан естественным для русского повествования.
