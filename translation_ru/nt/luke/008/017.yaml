id: LUK.8.17
reference: Luke 8:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: ru
  text: Ведь нет ничего скрытого, что не станет явным, и ничего тайного, что не станет известным и не выйдет наружу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обнаружится».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: скрытого
  rationale: Передаёт то, что скрыто или утаено, и естественно противопоставляется «явным».
- source_word: φανερόν
  choice: явным
  rationale: Сохраняет противопоставление скрытого и открыто обнаружившегося; современно и литературно.
- source_word: γενήσεται
  choice: станет
  rationale: 'Передаёт изменение состояния: скрытое станет явным.'
- source_word: ἀπόκρυφον
  choice: тайного
  rationale: Слегка отличает вторую параллельную характеристику от κρυπτόν, не разрушая смыслового параллелизма.
- source_word: οὐ μὴ γνωσθῇ
  choice: не станет известным
  rationale: В конструкции с предшествующим отрицанием выражает, что ничто тайное не останется неизвестным; русская двойная отрицательная структура естественно передаёт этот смысл.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: не выйдет наружу
  rationale: Передаёт образ выхода в открытую область и публичного обнаружения, сохраняя отличие от первого φανερόν.
- source_word: γάρ
  choice: Ведь
  rationale: Естественно выражает пояснительно-обосновывающую связь с предыдущим высказыванием.
theological_decisions:
- issue: Сфера и время раскрытия скрытого
  choice: 'Общий принцип: скрытое и тайное будет обнаружено.'
  alternative: Исключительно эсхатологическое раскрытие на последнем суде либо только раскрытие учения Иисуса в ближайшем контексте.
  rationale: Сам стих не уточняет временной горизонт и конкретную сферу; перевод сохраняет эту широту и не снимает богословское напряжение.
translation_notes:
  register: Современный литературный русский язык; параллелизм двух частей сохранён. «Ведь» звучит естественнее буквального «ибо», оставаясь достойным по регистру. Сильное греческое отрицание передано нормативной русской конструкцией «нет ничего… что не…».
