  source_fidelity: 'Текст точно передаёт греческую последовательность и синтаксические отношения: ἀκούσας — «услышав это», ἀπεκρίθη αὐτῷ — «ответил ему», Μὴ φοβοῦ — «Не бойся», μόνον πίστευσον — «только верь». Будущее страдательное σωθήσεται сохранено в «она будет спасена»; женский субъект корректно восстанавливается из контекста как дочь Иаира. Смысловой диапазон σῴζω не сужен в основном тексте.'
