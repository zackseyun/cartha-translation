  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: ru
  text: 'Но Иисус, услышав это, ответил ему: «Не бойся, только верь[a], и она будет спасена[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «только доверься»; «только имей веру».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «она будет исцелена»; «она выздоровеет». Греческий глагол может означать «спасти», «избавить» или «исцелить»; здесь речь идёт о возвращении девочки к жизни и здоровью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: услышав это
  rationale: Аористное причастие обозначает действие, предшествующее ответу Иисуса; «это» естественно восполняет подразумеваемое из контекста содержание услышанного.
- source_word: ἀπεκρίθη αὐτῷ
  choice: ответил ему
  rationale: Прямой и естественный русский эквивалент греческой конструкции с дательным падежом адресата.
- source_word: Μὴ φοβοῦ
  choice: не бойся
  rationale: Точно и идиоматично передаёт запрещение, выраженное настоящим императивом с μή.
- source_word: μόνον πίστευσον
  choice: только верь
  rationale: «Только» сохраняет ограничительное значение μόνον, а «верь» прямо передаёт императив πιστεύω, не сводя его лишь к интеллектуальному согласию.
- source_word: σωθήσεται
  choice: она будет спасена
  rationale: Будущая пассивная форма σῴζω допускает значения спасения, избавления и исцеления. Основной текст сохраняет широкое значение и лексическую связь со «спасать», тогда как контекстуально более узкие варианты вынесены в сноску.
theological_decisions:
- issue: Передача πιστεύω в повелении Иисуса
  choice: верь
  alternative: доверься; имей веру
  rationale: «Верь» — наиболее прямой русский глагольный эквивалент; сноска сохраняет оттенок доверия, чтобы выражение не воспринималось как указание лишь на умственное признание факта.
- issue: Передача σωθήσεται в рассказе об исцелении и возвращении к жизни
  choice: она будет спасена
  alternative: она будет исцелена; она выздоровеет
  rationale: «Будет спасена» сохраняет широту σῴζω и возможный богословский резонанс, не отрицая очевидного в данном контексте значения восстановления здоровья и жизни.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и естественной прямой речью. Союз «но» передаёт повествовательное противопоставление δέ; порядок слов не калькирует греческий, но сохраняет смысловые акценты.
