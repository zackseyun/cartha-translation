lexical_decisions:
- source_word: Ἐπηρώτων
  choice: спросили
  rationale: Имперфект обозначает действие в прошлом и может подразумевать продолженность или повторность; в данном повествовательном контексте естественное русское «спросили» передает сам факт обращения с вопросом без ненужной тяжеловесности.
- source_word: δὲ
  choice: же
  rationale: Частица обозначает мягкую связь с предшествующим рассказом; «же» сохраняет эту связь, не внося сильного противопоставления.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ученики Его
  rationale: «Ученики» — устоявшееся и точное обозначение последователей, обучавшихся у Иисуса; местоимение передает αὐτοῦ.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: что означает эта притча
  rationale: Буквальная конструкция «что это за притча / чем могла бы быть эта притча» в контексте выражает просьбу разъяснить ее смысл. Выбранный вариант естественен по-русски, а формальная особенность отмечена в сноске.
- source_word: παραβολή
  choice: притча
  rationale: Традиционный и контекстуально точный русский эквивалент для образного поучительного рассказа или сравнения.
- source_word: εἴη
  choice: означает
  rationale: Оптатив в косвенном вопросе после глагола прошедшего времени передает содержание вопроса; по смыслу ученики спрашивают о значении притчи.
