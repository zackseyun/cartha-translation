source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: ru
  text: Когда он вышел на сушу[a], его встретил один человек из города, у которого были бесы[b]. И долгое время он не надевал одежды и жил не в доме, а среди гробниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он сошёл на берег».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более привычно: «одержимый бесами». Буквально: «имевший бесов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: когда он вышел на сушу
  rationale: Дательный оборот с причастием передан временным придаточным; «на сушу» сохраняет буквальный образ выхода из лодки, не уточняя берег сверх сказанного в греческом тексте.
- source_word: ὑπήντησεν
  choice: его встретил
  rationale: Прямой и естественный русский эквивалент повествовательного глагола со значением встречи.
- source_word: ἀνήρ τις
  choice: один человек
  rationale: «Один человек» естественно передаёт неопределённость τις и мужской референт ἀνήρ без неуместно книжного «некий муж».
- source_word: ἐκ τῆς πόλεως
  choice: из города
  rationale: Передаёт происхождение или связь человека с городом, не утверждая дополнительно, что в этот момент он вышел именно оттуда.
- source_word: ἔχων δαιμόνια
  choice: у которого были бесы
  rationale: Формулировка близка к буквальному «имевший бесов» и не вводит в основной текст более интерпретирующее понятие одержимости.
- source_word: χρόνῳ ἱκανῷ
  choice: уже довольно долго
  rationale: Естественно выражает значительную продолжительность состояния; «уже» уместно связывает описание с моментом встречи.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: не надевал одежды
  rationale: Сохраняет глагольное значение «надевать» и обобщённое обозначение одежды; контекст длительности передан наречным оборотом.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: жил не в доме
  rationale: В данном описании обычного местопребывания μένω естественно передаётся русским «жил»; отрицание связано с противопоставлением следующей фразе.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: а среди гробниц
  rationale: «Гробницы» точнее «могил» для погребальных сооружений; «среди» естественно описывает место обитания, не утверждая, что человек постоянно находился внутри одной гробницы.
theological_decisions:
- issue: Передача δαιμόνια в контексте власти злых духов
  choice: бесы
  alternative: нечистые духи
  rationale: В стихе употреблено δαιμόνια, а не πνεύματα ἀκάθαρτα; «бесы» сохраняет конкретную лексику автора и не смешивает разные евангельские выражения.
- issue: Степень интерпретации оборота ἔχων δαιμόνια
  choice: у которого были бесы
  alternative: одержимый бесами
  rationale: Основной текст сохраняет буквальную структуру «иметь бесов» и не уточняет характер их власти термином «одержимый»; привычный идиоматический вариант дан в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранено начальное соединительное «И» во втором предложении как соответствие καί, без добавления причинной связи. Местоимение, относящееся к Иисусу, написано со строчной буквы, поскольку греческий текст не кодирует почтительного различия регистра.
