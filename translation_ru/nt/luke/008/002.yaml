  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: ru
  text: 'и некоторые женщины, которые были исцелены от злых духов и болезней: Мария, называемая Магдалиной, из которой уже вышли семь демонов,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: некоторые женщины
  rationale: Неопределённое местоимение τινες при существительном во множественном числе обозначает часть более широкой группы; «некоторые женщины» естественно и точно передаёт смысл.
- source_word: ἦσαν τεθεραπευμέναι
  choice: исцелённые
  rationale: Перифрастическая конструкция с перфектным страдательным причастием указывает на совершившееся ранее исцеление с сохраняющимся результатом. В русском причастие естественно связывается с предшествующим повествованием и охватывает как духовные, так и телесные недуги.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: от злых духов
  rationale: Прямо передаёт πονηρῶν как «злых», не подменяя его словом «нечистых», которому соответствовало бы другое греческое прилагательное.
- source_word: καὶ ἀσθενειῶν
  choice: и болезней
  rationale: В данном контексте ἀσθένεια обозначает телесные недуги; «болезни» — ясное и современное русское соответствие.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: называемая Магдалиной
  rationale: Причастие καλουμένη вводит обозначение, по которому была известна Мария. Форма «Магдалина» закреплена в русском языке и передаёт греческое Μαγδαληνή.
- source_word: ἀφ’ ἧς
  choice: из которой
  rationale: Сочетание ἀπό с относительным местоимением выражает удаление или исход; применительно к выходу бесов русский оборот «из которой» точнее и естественнее, чем буквальное «от которой».
- source_word: δαιμόνια ἑπτὰ
  choice: семь бесов
  rationale: δαιμόνια обозначает демонических существ и отличается от более общего πνεύματα выше. «Бесы» — понятное и традиционно точное русское соответствие без дополнительного толкования.
- source_word: ἐξεληλύθει
  choice: вышли
  rationale: Плюсквамперфект указывает, что выход бесов уже произошёл ранее. В русском временная предшествованность достаточно ясна из контекста и конструкции «исцелённые… из которой вышли»; тяжеловесное «до этого вышли» не требуется.
theological_decisions:
- issue: Передача языка демонического поражения
  choice: Сохранены личностные обозначения «злые духи» и «бесы».
  alternative: Истолковать их как метафорические названия психических или телесных болезней.
  rationale: Греческий текст различает πνεύματα πονηρά и δαιμόνια, с одной стороны, и ἀσθένειαι — с другой, представляя духовные и телесные недуги как связанные, но не тождественные категории. Перевод сохраняет это различие, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет характер перечисления и продолжение предыдущего стиха; двоеточие вводит имя первой названной женщины. Архаические «недуги» и «немощи» не используются, поскольку нейтральное «болезни» яснее современному читателю.
