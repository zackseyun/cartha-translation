    issue: Ослаблено значение предшествующего исцеления в «исцелённые».
    rationale: ἦσαν τεθεραπευμέναι — перифрастическая конструкция с перфектным страдательным причастием, по функции передающая состояние вследствие ранее совершившегося исцеления. «Которые были исцелены» выражает это отчётливее.
  - severity: medium
    issue: Не передано предшествование в «из которой вышли семь бесов».
    rationale: 'ἐξεληλύθει стоит в плюсквамперфекте: семь демонов уже вышли до описываемого момента. Наречие «уже» естественно передаёт этот аспект без искусственной конструкции.'
  - severity: low
    issue: «Бесы» имеет более традиционно-церковную стилистическую окраску.
    rationale: Для целевого современного литературного регистра «демоны» нейтральнее и ближе к специфическому δαιμόνια, при сохранении личностного демонического языка исходника.
