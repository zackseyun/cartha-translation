  verdict: revise
  source_fidelity: В целом перевод точно передаёт неопределённую группу женщин, различие между злыми духами и болезнями, а также обозначение Марии Магдалины. Однако греческая перифрастическая форма ἦσαν τεθεραπευμέναι имеет явно предшествующее действие («были исцелены»), а ἐξεληλύθει — плюсквамперфект («уже вышли»). В исходном русском варианте эти временные оттенки ослаблены.
  naturalness: «Некоторые женщины, которые были исцелены...» — естественный современный литературный русский синтаксис для продолжения фразы из предыдущего стиха. «Уже вышли» ясно и ненавязчиво передаёт предшествование, выраженное греческим плюсквамперфектом.
  terminology: «Злые духи» прямо соответствует πνεύματα πονηρά. «Демоны» — нейтральное современное литературное соответствие δαιμόνια и позволяет сохранить различие с более широким обозначением «духи». «Магдалина» сохранено как устоявшееся русское именование.
  issues:
