  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: ru
  text: 'Тогда Он сказал им: «Где ваша вера[a]?» Они испугались и изумились, говоря друг другу: «Кто же Он, что повелевает даже ветрам и воде, и они повинуются Ему?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверие». Вопрос Иисуса можно также понять так: «Где ваше доверие?»'
    reason: Лексическая альтернатива для πίστις, особенно уместная в контексте опасности.
lexical_decisions:
- source_word: Ποῦ
  choice: Где
  rationale: Сохраняет прямую форму греческого вопроса о наличии или проявлении веры, не превращая его в толкование «почему у вас нет веры».
- source_word: πίστις
  choice: вера
  rationale: Обычный и достаточно широкий русский эквивалент; в данном контексте включает смысл доверия Иисусу перед лицом опасности.
- source_word: φοβηθέντες δὲ ἐθαύμασαν
  choice: Охваченные страхом и изумлением
  rationale: Естественно передаёт одновременную эмоциональную реакцию учеников и сохраняет связь страха с удивлением, выраженную причастием и глаголом.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Кто же Он
  rationale: Частица «же» передаёт заключительно-вопросительный оттенок ἄρα; местоимение «Он» естественно указывает на присутствующего Иисуса.
- source_word: ἐπιτάσσει
  choice: повелевает
  rationale: Точно передаёт властное приказание и соответствует приподнятому, но понятному повествовательному регистру.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: ветрам и воде
  rationale: 'Следует явной лексике Луки: множественное «ветрам» и единственное «воде», не заменяя воду волнами или морем под влиянием параллельных повествований.'
- source_word: ὑπακούουσιν αὐτῷ
  choice: те повинуются Ему
  rationale: «Повинуются» ясно выражает послушание стихий; указательное «те» устраняет возможную грамматическую неясность из-за различного рода слов «ветры» и «вода».
theological_decisions:
- issue: Значение πίστις в контексте опасности
  choice: вера
  alternative: доверие
  rationale: «Вера» сохраняет основной богословский термин и широту греческого слова, тогда как сноска отмечает особенно заметный здесь оттенок доверия.
- issue: Смысл вопроса Ποῦ ἡ πίστις ὑμῶν;
  choice: Где ваша вера?
  alternative: Почему у вас нет веры?
  rationale: Прямой вопрос не утверждает однозначно полного отсутствия веры, а спрашивает о том, где она и почему не проявляется; более истолковывающая альтернатива сняла бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан естественным для русского читателя; слова «ветрам и воде» сохранены по греческому тексту, а не заменены привычным выражением «ветру и волнам».
