  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: ru
  text: А они смеялись над Ним, потому что знали, что она умерла.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: смеялись над
  rationale: Имперфект передаёт продолжавшееся действие, а русская конструкция «смеялись над» естественно выражает насмешку в данном контексте.
- source_word: αὐτοῦ
  choice: Ним
  rationale: Родительный падеж местоимения зависит от καταγελάω; по-русски объект насмешки естественно оформляется конструкцией «смеяться над» с творительным падежом.
- source_word: εἰδότες
  choice: потому что знали
  rationale: Причастие выражает основание их реакции. Придаточное причины ясно и естественно передаёт эту связь на современном русском языке.
- source_word: ὅτι
  choice: что
  rationale: 'Союз вводит содержание знания: они знали, что она умерла.'
- source_word: ἀπέθανεν
  choice: умерла
  rationale: Аорист обозначает свершившийся факт смерти; форма женского рода восстанавливает очевидный из контекста референт без добавления существительного.
theological_decisions:
- issue: Нужно ли прямо называть девочку, хотя в греческой фразе существительное отсутствует
  choice: 'Сохранить местоименное указание: «она умерла».'
  alternative: «девочка умерла»; «ребёнок умер»
  rationale: Субъект понятен из контекста, а местоименная передача сохраняет лаконичность исходного текста и не добавляет отсутствующего в нём существительного.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная, сдержанная и повествовательно естественная. Заглавная буква в местоимении «Ним» соответствует принятому благоговейному оформлению обращения к Иисусу, не меняя смысла текста.
