  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: ru
  text: «Вернись домой и расскажи, что сделал для тебя Бог». Он ушёл и возвещал по всему городу, что сделал для него Иисус.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε εἰς τὸν οἶκόν σου
  choice: Вернись домой
  rationale: Императив ὑπόστρεφε означает возвращение в прежнее место; сочетание εἰς τὸν οἶκόν σου естественно передаётся по-русски как «домой», сохраняя пространственный смысл без тяжеловесного «в свой дом».
- source_word: διηγοῦ
  choice: расскажи
  rationale: διηγέομαι означает подробно поведать или изложить; «расскажи» — естественный современный русский эквивалент в прямом повелении.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: что сделал для тебя Бог
  rationale: ὅσα буквально указывает на то, что или всё, что было сделано. Перевод не добавляет отсутствующего в греческом тексте прилагательного «великое» и сохраняет открытую меру выражения.
- source_word: ἀπῆλθεν
  choice: Он пошёл
  rationale: Глагол обозначает уход от данного места; в русском повествовании «пошёл» кратко и естественно передаёт последовавшее действие.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: по всему городу
  rationale: κατά с винительным имеет здесь распределительное значение; «по всему городу» — точная и идиоматичная передача.
- source_word: κηρύσσων
  choice: стал возвещать
  rationale: κηρύσσω обозначает публичное провозглашение, а не просто частный рассказ. Конструкция «стал возвещать» естественно связывает причастие с основным глаголом и отражает продолженное действие.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: что сделал для него Иисус
  rationale: Формулировка зеркально соотносится с предыдущими словами о том, что сделал Бог, и сохраняет намеренный повествовательный параллелизм.
theological_decisions:
- issue: Параллель между «Бог» в повелении Иисуса и «Иисус» в рассказе исцелённого
  choice: 'Сохранить без поясняющей гармонизации: «что сделал для тебя Бог» / «что сделал для него Иисус»'
  alternative: Заменить оба наименования одним либо добавить пояснение, отождествляющее Бога и Иисуса
  rationale: Греческий текст намеренно ставит эти формулировки в параллель, но не разъясняет её. Перевод сохраняет богословскую силу и напряжение исходного текста, не добавляя толкования.
translation_notes:
  register: Современный литературный русский язык; речь ясная, сдержанная и достойная. «Домой» предпочтено буквальному, но менее естественному «в свой дом»; «возвещать» сохраняет публичный характер κηρύσσω. Синтаксис слегка перестроен ради естественного русского повествования.
