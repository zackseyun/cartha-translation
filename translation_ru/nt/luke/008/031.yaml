lexical_decisions:
- source_word: παρεκάλουν
  choice: упрашивали
  rationale: Имперфект передаёт продолжавшуюся настойчивую просьбу; «упрашивали» естественно выражает это в современном русском без обязательного добавления наречия.
- source_word: ἐπιτάξῃ
  choice: приказывать
  rationale: Глагол обозначает властное распоряжение; этот выбор сохраняет акцент на власти Иисуса.
- source_word: ἄβυσσον
  choice: бездну
  rationale: «Бездна» прямо передаёт значение великой глубины и в данном контексте допускает смысл места заключения злых духов, не вводя более узкого толкования в основной текст.
- source_word: ἀπελθεῖν
  choice: уйти
  rationale: Инфинитив движения означает удаление к указанному месту; русское «уйти в бездну» звучит естественно и передаёт как движение прочь, так и направление.
- source_word: ἵνα μὴ
  choice: не приказывать
  rationale: После глагола просьбы конструкция выражает содержание прошения; русский инфинитив с отрицанием передаёт её кратко и идиоматично.
- source_word: αὐτοῖς
  choice: им
  rationale: 'Дательный падеж сохранён при русском глаголе «приказывать»: «приказывать им уйти».'
theological_decisions:
- issue: Значение ἄβυσσος в контексте бесов
  choice: «бездна» с вероятным смыслом места заключения злых духов
  alternative: «глубина» в более общем пространственном смысле
  rationale: Контекст говорит о бесах, страшившихся властного повеления Иисуса. «Бездна» сохраняет духовно-космический оттенок, но примечание оставляет открытым более общее лексическое значение и не уточняет природу этого места сверх сказанного Лукой.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Заглавная буква в местоимении «Его» соответствует принятому благоговейному библейскому регистру. Формулировка сохраняет длительный характер просьбы и не конкретизирует природу бездны сверх контекста.
