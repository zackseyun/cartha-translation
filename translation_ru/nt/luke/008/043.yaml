lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: женщина, … страдавшая
  rationale: Причастная конструкция естественно передана по-русски определительным оборотом, который вводит фоновое описание женщины.
- source_word: ἐν ῥύσει αἵματος
  choice: страдавшая кровотечением
  rationale: Такой перевод ясно и естественно передаёт продолжительное патологическое истечение крови, не уточняя его причину или характер сверх греческого текста.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: двенадцать лет
  rationale: Предлог ἀπό с обозначением времени в данном контексте выражает длительность состояния.
- source_word: ἰατροῖς προσαναλώσασα
  choice: истратившая на врачей
  rationale: Глагол указывает, что средства были полностью израсходованы, а дательный падеж ἰατροῖς обозначает тех, на кого они были потрачены.
- source_word: ὅλον τὸν βίον
  choice: все свои средства
  rationale: βίος здесь означает имущество или средства к существованию, а не биологическую жизнь.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: ни у кого не смогла исцелиться
  rationale: Перевод сохраняет выраженную в греческом тексте неспособность получить исцеление от кого-либо и звучит естественно по-русски.
