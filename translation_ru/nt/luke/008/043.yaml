  register: Современный литературный русский язык с достоинством повествовательного стиля. «Кровотечение» понятно широкому читателю и не привносит медицинской конкретизации, отсутствующей в оригинале. Порядок слов сохраняет стих как часть продолжающегося повествования, но завершён точкой для самостоятельного представления стиха.
