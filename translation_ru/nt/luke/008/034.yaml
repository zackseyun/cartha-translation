  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: ru
  text: Пастухи же, увидев, что произошло, убежали и рассказали об этом в городе и в сельской местности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на полях»; здесь имеются в виду сельские места вокруг города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: увидев
  rationale: Деепричастие естественно передаёт обстоятельственное значение аористного причастия и показывает, что бегство последовало за увиденным.
- source_word: οἱ βόσκοντες
  choice: пастухи
  rationale: Субстантивированное причастие обозначает людей, пасших стадо свиней. В современном русском «пастухи» применимо не только к овцам и звучит естественно в данном контексте.
- source_word: τὸ γεγονός
  choice: что произошло
  rationale: Субстантивированное перфектное причастие обозначает уже совершившееся событие; эта формулировка естественна и сохраняет результативный оттенок.
- source_word: ἔφυγον
  choice: убежали
  rationale: Передаёт прямое значение φεύγω в повествовательном контексте, не добавляя оттенка успешного спасения, возможного у слова «скрылись».
- source_word: ἀπήγγειλαν
  choice: рассказали об этом
  rationale: ἀπαγγέλλω означает сообщить или возвестить; «рассказали об этом» естественно передаёт сообщение о случившемся и восполняет подразумеваемый объект.
- source_word: εἰς τὴν πόλιν
  choice: в городе
  rationale: При глаголе сообщения εἰς указывает на место или круг людей, куда дошла весть; русское «в городе» звучит естественнее буквального «в город».
- source_word: εἰς τοὺς ἀγρούς
  choice: в окрестных селениях
  rationale: Во множественном числе ἀγροί в противопоставлении городу обозначает сельскую местность и населённые места вне города; «окрестные селения» ясно выражает, что сообщение передавали людям в округе.
