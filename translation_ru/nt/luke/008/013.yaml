base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: ru
  text: 'А те, что на камне, — это те, кто, услышав слово, с радостью принимают его. Но у них нет корня: некоторое время они верят, а во время испытания[a] отпадают.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искушения»; возможен также смысл: «когда наступает испытание». Греческое слово может обозначать испытание, проверку или искушение в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: упавшее на камень
  rationale: Формулировка сохраняет конкретный образ камня в единственном числе и в контексте притчи естественно подразумевает посеянное семя, не заменяя πέτρα более широким понятием «каменистая почва».
- source_word: ἀκούσωσιν
  choice: услышав
  rationale: Деепричастие естественно передаёт предшествующее слышание в общем описании реакции людей.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямо и естественно передаёт греческое предложное сочетание и его эмоциональную окраску.
- source_word: δέχονται τὸν λόγον
  choice: принимает слово
  rationale: «Принимать слово» сохраняет библейский образ λόγος и ясно обозначает положительный отклик на возвещённую весть.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: у них нет корня
  rationale: Сохраняется единственное число и лаконичная метафора оригинала.
- source_word: πρὸς καιρὸν
  choice: некоторое время
  rationale: Естественно выражает ограниченную продолжительность, не добавляя оценки характера веры.
- source_word: πιστεύουσιν
  choice: они верят
  rationale: Прямой нейтральный эквивалент, не уточняющий вопреки тексту, является ли эта вера подлинной, поверхностной или спасительной.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: во время испытания
  rationale: «Испытание» достаточно широко передаёт πειρασμός и допускает внешнее испытание, проверку и искушение; иной возможный оттенок отмечен в сноске.
- source_word: ἀφίστανται
  choice: отступают
  rationale: Передаёт отказ от прежней веры под давлением без более специального и конфессионально нагруженного термина «впадают в отступничество».
theological_decisions:
- issue: Характер веры, обозначенной πιστεύουσιν
  choice: они верят
  alternative: они лишь кажутся верующими; они верят искренне, но затем отпадают; их вера поверхностна
  rationale: Стих утверждает, что они верят некоторое время, а затем отступают, но не разрешает сам по себе богословский спор о подлинности или спасительности этой веры.
- issue: Значение πειρασμός
  choice: испытание
  alternative: искушение; тяжёлое испытание
  rationale: Греческое слово допускает как внешнее испытание, так и искушение. Основной текст сохраняет широкий смысл, а сноска указывает альтернативы.
translation_notes:
  register: Современный литературный русский язык с сохранением образности притчи. Синтаксис сделан плавным и понятным; богословская напряжённость между временной верой и последующим отступлением намеренно не разрешена переводом.
