source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: ru
  text: 'Ему сообщили: «Твоя мать и твои братья[a] стоят снаружи и хотят тебя увидеть».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «родственники», если греческое слово ἀδελφοί понимать здесь шире; обычно оно означает «братья».
    reason: Лексическая альтернатива сохраняет возможную широту родственного употребления, не подменяя обычное значение в основном тексте.
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: сообщили
  rationale: 'Безличная конструкция естественно передаёт греческий аорист пассива: Иисусу передали известие, причём сообщивший не назван.'
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь δέ — слабая повествовательная связка; в современном русском начало нового предложения без «и» или «тогда» передаёт ход рассказа естественнее и не добавляет оттенка противопоставления.
- source_word: αὐτῷ
  choice: ему
  rationale: Местоимение прямо сохраняет косвенный объект сообщения.
- source_word: μήτηρ
  choice: мать
  rationale: Нейтральное, точное и достойное соответствие в повествовательной речи.
- source_word: ἀδελφοί
  choice: братья
  rationale: Обычное значение греческого существительного мужского рода во множественном числе сохранено без богословского расширения или сужения.
- source_word: ἑστήκασιν
  choice: стоят
  rationale: 'Перфект имеет значение наличного состояния; русское настоящее время естественно передаёт результат: они находятся снаружи стоя.'
- source_word: ἔξω
  choice: снаружи
  rationale: Точно передаёт пространственное наречие, не добавляя прямо не названного дома или помещения.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Сохраняет основное значение инфинитива ὁράω и не заменяет его более толковательными «встретиться» или «поговорить».
- source_word: θέλοντες
  choice: хотят
  rationale: Личная форма естественна по-русски и передаёт одновременное желание матери и братьев увидеть Иисуса.
theological_decisions:
- issue: Кого обозначает слово ἀδελφοί применительно к семье Иисуса
  choice: В основном тексте — «братья»
  alternative: «родственники»
  rationale: Стих употребляет обычное слово «братья» и сам по себе не определяет точнее характер родства. Основной текст сохраняет прямой лексический смысл, а примечание отмечает более широкую контекстуальную возможность, не разрешая конфессиональный спор.
translation_notes:
  register: Современный литературный русский, ясный и сдержанный. Прямая речь звучит естественно; порядок слов сохраняет акцент на сообщении Иисусу. Добавлений о конкретном помещении или цели встречи нет.
