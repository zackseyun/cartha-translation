  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: ru
  text: 'Человек же, из которого вышли бесы, умолял Иисуса быть с Ним. Но Иисус отослал его, сказав:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: умолял
  rationale: Имперфект δέομαι передаёт продолжительную или настойчивую просьбу; «умолял» естественно выражает её силу.
- source_word: αὐτοῦ
  choice: Иисуса
  rationale: Родительный при δέομαι обозначает того, к кому обращена просьба. Имя восстановлено из контекста ради ясности русского текста.
- source_word: ὁ ἀνὴρ
  choice: человек
  rationale: В контексте речь идёт о конкретном мужчине; русское «человек» звучит естественнее и не утрачивает референцию.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: из которого вышли бесы
  rationale: Оборот сохраняет исходное пространственное представление; плюсквамперфект указывает на действие, завершившееся прежде просьбы, что в русском ясно из порядка событий.
- source_word: τὰ δαιμόνια
  choice: бесы
  rationale: Прямой и общепринятый новозаветный эквивалент, сохраняющий представление текста о личных сверхъестественных существах.
- source_word: εἶναι σὺν αὐτῷ
  choice: позволить ему остаться с Ним
  rationale: Буквально «быть с Ним»; добавление «позволить» естественно раскрывает содержание просьбы, а «остаться» соответствует ситуации, не превращая её непременно в просьбу сопровождать Иисуса.
- source_word: ἀπέλυσεν
  choice: отпустил
  rationale: Глагол может означать отпустить или отослать; «отпустил» сохраняет эту широту и естественно предваряет распоряжение следующего стиха.
- source_word: λέγων
  choice: сказав
  rationale: Деепричастие естественно вводит следующую прямую речь и передаёт греческое причастие.
theological_decisions:
- issue: Передача δαιμόνια в рассказе об изгнании
  choice: бесы
  alternative: злые духи
  rationale: «Бесы» непосредственно передаёт термин и сохраняет сверхъестественную реальность, предполагаемую повествованием, без рационализирующего смягчения.
- issue: Смысл εἶναι σὺν αὐτῷ
  choice: остаться с Ним
  alternative: пойти с Ним
  rationale: Греческий текст говорит просто «быть с Ним» и не уточняет, просил ли человек постоянно сопровождать Иисуса или оставаться рядом; выбранная формулировка не вводит явного мотива путешествия.
translation_notes:
  register: Современный литературный русский, ясный и dignified повествовательный стиль. Противительный δέ передан словами «же» и «но» по синтаксической функции. Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской традиции; имя «Иисус» повторено для устранения неясной цепочки местоимений.
