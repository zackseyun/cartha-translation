  source_fidelity: 'Текст точно передаёт греческий оригинал: δέ отражено как «Но», обращение Θυγάτηρ — «Дочь», πίστις — «вера», совершенный вид σέσωκέν — «спасла», а πορεύου εἰς εἰρήνην — «Иди с миром». Сохранена намеренная семантическая широта σῴζω при очевидном для контекста значении исцеления.'
  naturalness: Фраза краткая, ясная и соответствует современному литературному русскому с уместным библейским достоинством. Обращение «Дочь» в устах Иисуса звучит несколько возвышенно, но естественно в данном евангельском регистре и передаёт теплоту оригинала.
  terminology: «Вера» и «спасла» последовательно сохраняют значимые термины и не сужают σῴζω до одного физического исцеления. Сноска корректно сообщает возможные контекстные передачи («исцелила», «вернула тебе здоровье») и объясняет основание вариативности.
