source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: ru
  text: 'Но Он сказал ей: «Дочь, твоя вера спасла тебя[a]. Иди с миром».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исцелила тебя»; также возможно: «вернула тебе здоровье». Греческий глагол может означать как спасение, так и исцеление.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Дочь
  rationale: Сохранено буквальное обращение, выражающее теплоту и принятие; оно естественно и понятно в данном контексте.
- source_word: πίστις
  choice: вера
  rationale: Передаёт доверие женщины Иисусу и сохраняет богословскую значимость греческого слова.
- source_word: σέσωκέν
  choice: спасла
  rationale: Широкое значение σῴζω включает спасение и исцеление. Основной вариант сохраняет эту смысловую многослойность, а телесное исцеление поясняется в сноске.
- source_word: πορεύου
  choice: иди
  rationale: Естественная и точная передача повелительного наклонения в современном русском языке.
- source_word: εἰς εἰρήνην
  choice: с миром
  rationale: Естественная русская формула благословенного ухода, соответствующая смыслу греческого выражения.
- source_word: δὲ
  choice: но
  rationale: Передаёт мягкий контраст между страхом женщины в предыдущем контексте и успокаивающим ответом Иисуса.
theological_decisions:
- issue: Смысловой объём σῴζω в контексте исцеления
  choice: 'В основном тексте: «спасла тебя»'
  alternative: «исцелила тебя» или «вернула тебе здоровье»
  rationale: Контекст прямо указывает на телесное исцеление, однако глагол σῴζω имеет более широкий смысл и может обозначать также спасение. Широкая передача в основном тексте сохраняет богословское напряжение, а узкий медицинский смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная речь. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
