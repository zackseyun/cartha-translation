  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: ru
  text: А другое семя упало среди колючих растений, и колючие растения, выросшие вместе с ним, заглушили его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: другое семя
  rationale: Субстантивированное прилагательное среднего рода отсылает к семени из контекста притчи; существительное добавлено по-русски для ясности.
- source_word: ἔπεσεν
  choice: упало
  rationale: Прямо передаёт простое повествовательное действие аориста πίπτω.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: среди колючек
  rationale: Естественно передаёт пространственное значение «посреди, среди», не уточняя без необходимости вид колючих растений.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: колючки
  rationale: Сохраняет образ колючих растений и звучит естественно в современном русском языке.
- source_word: συμφυεῖσαι
  choice: выросшие вместе с ним
  rationale: Причастие выражает совместный рост колючек и семени; формулировка сохраняет его связь со сказуемым.
- source_word: ἀπέπνιξαν
  choice: заглушили
  rationale: Обычное русское обозначение того, как сорные или колючие растения подавляют рост посева; сохраняет сельскохозяйственный образ.
- source_word: αὐτό
  choice: его
  rationale: Местоимение отсылает к названному в переводе слову «семя».
