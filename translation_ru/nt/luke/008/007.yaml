    issue: «Колючки» может означать шипы, а не колючие растения.
    rationale: В греческом ἄκανθαι в данной притче выступают как растущие растения, которые способны заглушить посев. Формулировка «колючие растения» яснее выражает этот референт для современного читателя.
  revised_text: А другое семя упало среди колючих растений, и колючие растения, выросшие вместе с ним, заглушили его.
