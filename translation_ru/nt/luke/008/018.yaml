id: LUK.8.18
reference: Luke 8:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: ru
  text: Итак, будьте внимательны к тому, как вы слушаете. Ведь тому, кто имеет, будет дано, а у того, кто не имеет, будет отнято даже то, что, по его мнению, у него есть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даже то, что у него, как кажется, есть».'
    reason: Глагол δοκέω может означать как субъективное мнение («он думает»), так и внешнюю видимость («кажется»).
lexical_decisions:
- source_word: βλέπετε
  choice: будьте внимательны
  rationale: Императив призывает не буквально смотреть, а проявлять осмотрительность и пристальное внимание; эта формулировка естественно передаёт предупредительную силу выражения.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего наставления о слышании и восприимчивости.
- source_word: πῶς ἀκούετε
  choice: как вы слушаете
  rationale: Сохраняет акцент πῶς на образе и качестве слушания, а глагол «слушаете» передаёт активное, отзывчивое восприятие лучше, чем простое «слышите».
- source_word: ὃς ἂν ... ἔχῃ
  choice: тому, кто имеет
  rationale: Естественно передаёт неопределённо-общее условие и сохраняет афористичность высказывания.
- source_word: δοθήσεται αὐτῷ
  choice: будет дано
  rationale: Сохраняет отсутствующий в греческом тексте объект и не добавляет прямо слово «больше», хотя увеличение подразумевается параллелизмом.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: у того, кто не имеет
  rationale: Сохраняет общее условие и антитезу с первой частью изречения; конструкция согласована с русским «будет отнято у».
- source_word: ὃ δοκεῖ ἔχειν
  choice: то, что, по его мнению, у него есть
  rationale: Передаёт возможное значение δοκέω «думать, полагать» естественным современным русским языком; альтернативное значение «казаться» отмечено в сноске.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: будет отнято ... у него
  rationale: Будущий пассив αἴρω обозначает лишение или удаление; «будет отнято» ясно и точно передаёт этот смысл.
- source_word: αὐτῷ / αὐτοῦ
  choice: тому / у того / его
  rationale: Русские формы соответствуют обобщённому лицу в греческом единственном числе, не превращая его в множественное.
theological_decisions:
- issue: Смысл парадоксального изречения об имеющем и не имеющем
  choice: Изречение оставлено в непосредственном контексте внимательного и восприимчивого слушания слова Иисуса без дополнительного истолкования.
  alternative: Понимать его как общий принцип духовной восприимчивости или как более широкую пословицу о распоряжении вверенным.
  rationale: Сам стих формулирует парадоксальный принцип в связи со слушанием; перевод сохраняет эту напряжённость и не вводит учения о предопределении, заслугах или материальном благополучии.
translation_notes:
  register: Современный литературный русский язык с ясным, наставительным и достойным звучанием. Афористическая структура и повтор «кто имеет / кто не имеет» сохранены; избыточно поясняющее «больше» не добавлено.
