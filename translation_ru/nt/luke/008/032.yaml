base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: ru
  text: А там, на горе, паслось большое стадо свиней[a][b]. Они[c] умоляли его позволить им войти в тех свиней, и он позволил им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стадо из множества свиней»; или: «довольно большое стадо свиней».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на склоне горы».'
    reason: lexical_alternative
  - marker: c
    text: То есть бесы (нечистые духи), о которых говорится в ближайшем контексте.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: большое стадо свиней
  rationale: Передаёт многочисленность или значительный размер стада естественным современным русским выражением.
- source_word: βοσκομένη
  choice: которое кормилось
  rationale: Причастие описывает, как свиньи добывали или принимали пищу; «кормилось» не сужает значение до щипания травы.
- source_word: ἐν τῷ ὄρει
  choice: на горе
  rationale: Формально и естественно передаёт ὄρος, не подменяя его более конкретным «склоном».
- source_word: παρεκάλεσαν
  choice: умоляли
  rationale: Выражает настойчивую просьбу, подходящую контексту.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: позволить / позволил
  rationale: Сохраняет лексическую связь между просьбой и ответом Иисуса.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: войти в тех свиней
  rationale: Передаёт направленность εἰς, значение εἰσελθεῖν и указательное ἐκείνους.
- source_word: δὲ
  choice: а
  rationale: Ненавязчиво обозначает переход в повествовании, не добавляя явного временного значения.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее при παρεκάλεσαν («они умоляли»)
  choice: Оставить местоимение «они», как в контекстуально определяемой греческой форме
  alternative: «Бесы умоляли его»
  rationale: В окружающем контексте речь идёт о бесах/нечистых духах, однако сам стих не называет их существительным; местоимение сохраняет эту особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык; повествование звучит естественно и сдержанно. Местоимения, относящиеся к Иисусу, написаны со строчной буквы в соответствии с обычной современной орфографией и формой исходного текста.
