  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: ru
  text: 'Но Иисус сказал: «Кто-то прикоснулся ко Мне, потому что Я узнал, что из Меня вышла сила».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: Кто-то прикоснулся ко Мне
  rationale: Естественно и точно передаёт неопределённое τις и глагол ἅπτομαι с родительным местоимением.
- source_word: ἔγνων
  choice: Я почувствовал
  rationale: В данном контексте γινώσκω обозначает непосредственное осознание или ощущение произошедшего; «почувствовал» естественно связывает знание Иисуса с выходом силы, не сводя выражение к отвлечённому знанию.
- source_word: δύναμιν ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: как из Меня вышла сила
  rationale: Оборот с причастием передан придаточной конструкцией, естественной для современного русского языка; «сила» сохраняет обычное значение δύναμις в повествовании об исцелении.
theological_decisions:
- issue: Характер осознания Иисусом выхода силы
  choice: почувствовал
  alternative: узнал / понял
  rationale: Перевод не объясняет механизм знания и не вводит догматических выводов; он передаёт непосредственное восприятие события в данном повествовательном контексте.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и сохраняет достоинство евангельского повествования. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно принятой русской библейской традиции.
