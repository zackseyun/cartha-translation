- from: 'Но Иисус сказал: «Кто-то прикоснулся ко Мне, потому что Я почувствовал, как из Меня вышла сила».'
  to: 'Но Иисус сказал: «Кто-то прикоснулся ко Мне, потому что Я узнал, что из Меня вышла сила».'
  rationale: 'Заменено «почувствовал, как» на «узнал, что», чтобы точно передать ἔγνων как акт осознания/знания, не добавляя оттенка телесного ощущения. Остальная лексика и синтаксис сохранены: τις передано как «кто-то», δύναμις — как «сила», а завершённость выхода силы — прошедшим временем «вышла».'
  reviewer_model: gpt-5.6-terra
