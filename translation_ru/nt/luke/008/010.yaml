source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: ru
  text: 'Он сказал: «Вам дано знать тайны Царства Божьего, а остальным — в притчах, чтобы они, глядя, не видели и, слушая, не понимали».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «чтобы они, глядя, не видели и, слушая, не понимали» перекликаются с Ис. 6:9–10. Их можно понимать как выражение Божьей судебной цели, наступающего результата или обоих смыслов одновременно.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: дано
  rationale: Кратко и естественно передаёт перфект пассивного залога и сохраняет подразумеваемого Дарующего неназванным.
- source_word: γνῶναι
  choice: знать
  rationale: Прямо передаёт γινώσκω и сохраняет отличие от συνιῶσιν («понимали») в конце стиха.
- source_word: μυστήρια
  choice: тайны
  rationale: В современном русском библейском употреблении обозначает прежде сокрытые и открываемые Богом истины, а не загадки как таковые.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Естественное и традиционное русское соответствие, сохраняющее смысл как Божьего царствования, так и Его Царства.
- source_word: τοῖς δὲ λοιποῖς ἐν παραβολαῖς
  choice: а остальным всё возвещается в притчах
  rationale: Русский текст требует восполнить эллипсис. «Всё возвещается» ясно указывает на форму сообщения, не привнося марковского выражения «внешним».
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет напряжение между целью и результатом, не ослабляя формулировку до чисто причинной или описательной.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: глядя, не видели
  rationale: Сохраняет повтор корня со значением зрения и лаконичную парадоксальность исходной формулы.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: слушая, не понимали
  rationale: Различает физическое слушание и осмысление; «понимали» естественно передаёт συνίημι.
theological_decisions:
- issue: Смысловой оттенок придаточного с ἵνα в отсылке к Исаии 6:9–10
  choice: «чтобы» с сохранением целевого/результативного напряжения
  alternative: «так что», подчёркивающее только результат
  rationale: Греческое ἵνα допускает целевой и результативный оттенки. Перевод не должен заранее устранять напряжение между Божьим судом и наступающим результатом.
- issue: Функция притч для «остальных»
  choice: Сохранена жёсткая связь с последующим «чтобы»
  alternative: Смягчить до «потому что они не видят и не понимают»
  rationale: Причинное перефразирование изменило бы направление мысли и разрешило бы богословское напряжение, присутствующее в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Эллипсис τοῖς δὲ λοιποῖς ἐν παραβολαῖς восполнен ради грамматической естественности; формула отсылки к Исаии оставлена сдержанной и напряжённой.
