lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: рассказали
  rationale: Аорист ἀπαγγέλλω обозначает сообщение или рассказ о случившемся. «Рассказали» естественно звучит в повествовании и передаёт сообщение очевидцев.
- source_word: δὲ
  choice: передано порядком слов без отдельного союза
  rationale: Здесь δέ — слабая повествовательная связка. В современном русском отдельное «и» или «тогда» необязательно и утяжелило бы фразу.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж обозначает тех, кому очевидцы сообщили о случившемся.
- source_word: οἱ ἰδόντες
  choice: очевидцы
  rationale: Субстантивированное причастие буквально означает «видевшие». «Очевидцы» кратко и естественно передаёт людей, лично видевших событие, без добавления нового смысла.
- source_word: πῶς
  choice: как
  rationale: Сохраняет форму косвенного сообщения и допускает как описание способа, так и сообщение о самом происшедшем.
- source_word: ἐσώθη
  choice: был спасён
  rationale: Пассив σῴζω имеет диапазон значений «спасти, избавить, исцелить». Основной вариант сохраняет широкое звучание греческого слова; контекстуальные варианты отмечены в сноске.
- source_word: ὁ δαιμονισθείς
  choice: человек, прежде одержимый бесами
  rationale: Субстантивированное причастие указывает на мужчину, находившегося под властью бесов. «Прежде» ясно показывает, что после совершившегося избавления это состояние осталось в прошлом; множественное «бесами» соответствует контексту рассказа о легионе.
theological_decisions:
- issue: Значение ἐσώθη в контексте изгнания бесов
  choice: был спасён
  alternative: был исцелён; был избавлен
  rationale: σῴζω может обозначать спасение, избавление или исцеление. «Был спасён» сохраняет лексическую и богословскую широту слова, а сноска не позволяет свести его здесь исключительно к духовному спасению.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и доступная. Выражение «одержимый бесами» сохраняет библейскую предметность, а конструкция с «прежде» избегает впечатления, будто человек по-прежнему оставался одержимым.
