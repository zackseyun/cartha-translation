revisions:
- from: И вскоре после этого Иисус стал переходить из города в город и из селения в селение[a], возвещая и неся благую весть о Царстве Бога[b]. С Ним были и Двенадцать.
  to: И вот, вскоре после этого Иисус ходил из города в город и из селения в селение[a], проповедуя и возвещая Благую весть о Царстве Божьем[b], и Двенадцать были с Ним.
  rationale: 'Исправлена аспектуальная неточность «стал переходить»: «ходил из города в город» передаёт повторяющееся передвижение, выраженное имперфектом. Повествовательный переход передан естественным «И вот, вскоре после этого». Два греческих причастия сохранены двумя разными русскими глаголами, а устойчивое выражение τὴν βασιλείαν τοῦ θεοῦ передано более естественным «Царство Божье». Синтаксически Двенадцать вновь присоединены союзом «и», как в греческом тексте.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:16:14Z'
review_pass:
  verdict: revise
  source_fidelity: В черновике верно переданы последовательное посещение городов и селений, два связанных, но различных действия и обозначение «Двенадцать». Однако «стал переходить» вносит ингрессивное значение («начал»), которого у имперфекта διώδευεν нет; требуется форма, передающая длительное/повторяющееся хождение. Формула ἐγένετο ἐν τῷ καθεξῆς может быть естественно передана русским повествовательным «И вот, вскоре после этого», без тяжеловесного буквального «и случилось».
  naturalness: «Стал переходить» менее естественно и семантически менее точно, чем «ходил из города в город». Сочетание «возвещая и неся благую весть» понятно, но «нести благую весть» здесь несколько образно и слабее передаёт εὐαγγελιζόμενος как возвещение. «Царство Божье» — более обычная современная русская форма устойчивого библейского выражения, чем «Царство Бога».
  terminology: «Двенадцать» сохранено без необоснованного добавления «апостолы» или «ученики». «Царство Божье» сохраняет широту βασιλεία и не сводит её к одному значению. Альтернатива «Божье правление» яснее и современнее, чем отвлечённое «царствование Бога».
  issues:
  - severity: medium
    issue: «стал переходить» для διώδευεν
    rationale: «Стал» добавляет начало действия, тогда как имперфект описывает продолжающееся или повторяющееся путешествие. «Ходил из города в город» передаёт этот аспект без добавочного значения.
  - severity: low
    issue: «неся благую весть»
    rationale: Выражение возможно, но в данном контексте менее прямо передаёт глагол εὐαγγελιζόμενος, обозначающий возвещение благой вести. «Возвещая Благую весть» естественнее; различие с κηρύσσων сохранено через «проповедуя».
  - severity: low
    issue: «Царство Бога»
    rationale: Форма грамматически допустима, но «Царство Божье» является более идиоматичным современным русским библейским словосочетанием и не меняет смысла.
  revised_text: И вот, вскоре после этого Иисус ходил из города в город и из селения в селение[a], проповедуя и возвещая Благую весть о Царстве Божьем[b], и Двенадцать были с Ним.
  revised_footnotes:
