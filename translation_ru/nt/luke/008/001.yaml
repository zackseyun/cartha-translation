  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: ru
  text: И вот, вскоре после этого Иисус ходил из города в город и из селения в селение[a], проповедуя и возвещая Благую весть о Царстве Божьем[b], и Двенадцать были с Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по городам и селениям».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о Божьем правлении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: вскоре после этого
  rationale: Луканская повествовательная формула обозначает переход к следующему событию. По-русски буквальное «и случилось» здесь звучало бы тяжеловесно; временная последовательность передана естественно.
- source_word: αὐτὸς
  choice: Иисус
  rationale: Явное имя естественно восстанавливает подлежащее из контекста и устраняет неясность русского местоимения при публикации отдельного стиха; усилительного значения «Сам» контекст не требует.
- source_word: διώδευεν
  choice: стал переходить
  rationale: Глагол описывает передвижение по разным местам, а имперфект — разворачивающуюся или повторяющуюся деятельность. «Стал переходить» естественно вводит этот этап служения.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: из города в город и из селения в селение
  rationale: Распределительное κατά с существительными в единственном числе передаёт последовательное посещение ряда городов и селений.
- source_word: κηρύσσων
  choice: возвещая
  rationale: Сохраняет смысл публичного провозглашения и не сужает действие до формальной проповеди.
- source_word: εὐαγγελιζόμενος
  choice: неся благую весть
  rationale: Передаёт смысл сообщения благой вести и лексически отличает причастие от κηρύσσων.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: о Царстве Бога
  rationale: «Царство» сохраняет широту βασιλεία — и царственную власть, и область её осуществления; родительный оборот передан современно и ясно.
- source_word: οἱ δώδεκα
  choice: Двенадцать
  rationale: Это устойчивое обозначение известной группы; не добавляются отсутствующие в тексте слова «ученики» или «апостолы».
- source_word: σὺν αὐτῷ
  choice: С Ним были
  rationale: Естественная русская конструкция сопровождения; сказуемое восстанавливается по смыслу греческой присоединённой фразы.
theological_decisions:
- issue: Передача βασιλεία τοῦ θεοῦ
  choice: Царство Бога
  alternative: царствование Бога
  rationale: «Царство» сохраняет как динамический смысл Божьего правления, так и более конкретное измерение царства, не сводя выражение лишь к одному из них.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского, при этом сохранены два различных действия — публичное возвещение и принесение благой вести. Заглавные буквы в «Царстве» и «Двенадцать» обозначают устойчивые библейские понятия; местоимение «Ним» оформлено по принятой благоговейной издательской норме.
