reference: Luke 8:47
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: ru
  text: Женщина же, увидев, что ей не удалось остаться незамеченной[a], дрожа, подошла и, пав перед Ним[b], рассказала перед всем народом, почему прикоснулась к Нему и как тотчас исцелилась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что это не осталось незамеченным»; «что ей не удалось скрыться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пав к Его ногам». В греческом тексте буквально сказано «пав перед Ним»; ноги прямо не упомянуты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: увидев
  rationale: Аористное причастие передаёт обстоятельство, предшествующее основным действиям; деепричастие естественно и точно для русского повествования.
- source_word: οὐκ ἔλαθεν
  choice: ей не удалось остаться незамеченной
  rationale: Оборот с λανθάνω означает, что поступок женщины не укрылся от внимания; формулировка сохраняет подразумеваемое отношение к ней самой, не уточняя, от кого именно это не укрылось.
- source_word: τρέμουσα
  choice: дрожа
  rationale: Сохраняет зримо выраженное физическое и эмоциональное состояние, не сводя его только к страху.
- source_word: προσπεσοῦσα αὐτῷ
  choice: пав перед Ним
  rationale: Передаёт падение ниц или к ногам в мольбе либо почтении, но не добавляет отсутствующего в греческом тексте слова «ноги».
- source_word: δι’ ἣν αἰτίαν
  choice: почему
  rationale: Естественно передаёт значение «по какой причине» без ненужной тяжеловесности.
- source_word: ἥψατο αὐτοῦ
  choice: прикоснулась к Нему
  rationale: ἅπτομαι с родительным падежом здесь прямо означает прикосновение.
- source_word: ἀπήγγειλεν
  choice: рассказала
  rationale: Глагол обозначает сообщение или объявление; «рассказала» естественно звучит по-русски и в сочетании с публичным обстоятельством не ослабляет смысла.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: перед всем народом
  rationale: Близко передаёт публичность сообщения и сохраняет существительное λαός как «народ», не заменяя его интерпретирующим «толпа».
- source_word: ὡς ἰάθη
  choice: как ... исцелилась
  rationale: Сохраняет возможный оттенок способа или обстоятельства исцеления, не сводя ὡς однозначно к простому «что».
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт немедленность исцеления в кратком и достойном повествовательном регистре.
theological_decisions:
- issue: Характер публичного признания женщины
  choice: Описать её дрожь, падение перед Иисусом и публичный рассказ без добавления терминов покаяния или поклонения.
  alternative: Передать её действие как исповедание греха или прямо назвать поклонением.
  rationale: Греческий текст сообщает о её позе и публичном объяснении, но не называет действие покаянием или поклонением; перевод сохраняет возможный оттенок благоговения или мольбы без догматического уточнения.
- issue: Смысл ὡς перед сообщением об исцелении
  choice: «как ... исцелилась»
  alternative: «что ... исцелилась»
  rationale: ὡς допускает передачу обстоятельства или способа наряду с фактом; «как» сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Синтаксис следует ходу греческого предложения, но избегает буквальной тяжеловесности. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией, без изменения смысла.
