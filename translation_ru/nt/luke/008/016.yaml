id: LUK.8.16
reference: Luke 8:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: ru
  text: Никто, зажегши светильник, не накрывает его сосудом и не ставит под кровать, а ставит на подставку, чтобы входящие видели свет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: светильник
  rationale: Передаёт бытовой масляный светильник древности и звучит естественно в современном литературном русском.
- source_word: σκεύει
  choice: сосудом
  rationale: Широкое значение слова — предмет утвари или ёмкость; «сосуд» сохраняет неопределённость исходного текста, не уточняя форму.
- source_word: κλίνης
  choice: кровать
  rationale: В данном бытовом контексте естественное обозначение предмета, под который можно поставить светильник.
- source_word: λυχνίας
  choice: подставку
  rationale: Обозначает предназначенную для светильника опору; «подставка» понятно современному читателю и не вызывает образа многосвечника.
- source_word: οἱ εἰσπορευόμενοι
  choice: входящие
  rationale: Сохраняет субстантивированное причастие и направленность движения внутрь.
theological_decisions:
- issue: Связь стиха с предшествующей речью через δέ
  choice: Не выражать отдельным вводным словом
  alternative: «Но никто…» или «И никто…»
  rationale: δέ здесь служит мягким переходом; начальное «но» без явного противопоставления звучало бы в русском тяжеловесно, а добавление «теперь» не имеет прямой лексической опоры.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Сохранена образность бытовой сцены и параллельная конструкция исходного текста; архаичное «возжегши» не используется.
