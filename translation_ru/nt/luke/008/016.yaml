  source_fidelity: 'Текст точно передаёт все основные элементы греческого оригинала: отрицательное обобщение («Никто»), последовательность действий после зажигания светильника, «сосуд», помещение под кровать, постановку на подставку и цель — чтобы входящие видели свет. Неопределённость σκεύει сохранена. Причастный оборот «зажегши светильник» адекватно отражает ἅψας.'
