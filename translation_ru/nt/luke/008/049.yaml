  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: ru
  text: 'Когда он ещё говорил, от начальника синагоги пришёл человек и сказал: «Твоя дочь умерла. Больше не беспокой учителя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Когда он ещё говорил
  rationale: Родительный самостоятельный оборот выражает одновременность, а ἔτι — продолжающееся действие; формулировка естественна для современного русского повествования.
- source_word: ἔρχεταί τις
  choice: пришёл человек
  rationale: Историческое настоящее передано русским прошедшим временем; неопределённое τις выражено без добавления предположения, что этот человек непременно был посланником.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: от начальника синагоги
  rationale: παρά с родительным указывает на источник, а ἀρχισυνάγωγος обозначает руководителя или председательствующего служителя синагоги. «Начальник синагоги» кратко и понятно передаёт должность.
- source_word: λέγων
  choice: и сказал
  rationale: Причастная конструкция естественно преобразована в однородное сказуемое, вводящее прямую речь.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: Твоя дочь умерла
  rationale: Перфект сообщает о наступившей смерти и сохраняющемся результате; русское прошедшее совершенного вида естественно выражает это в данном контексте.
- source_word: μηκέτι σκύλλε
  choice: Больше не беспокой
  rationale: μηκέτι требует прекращения действия, а σκύλλω здесь означает беспокоить или утруждать; выбран современный, уважительный и понятный оборот.
- source_word: τὸν διδάσκαλον
  choice: учителя
  rationale: Передано обычное значение διδάσκαλος без усиления титула. Строчная буква сохраняет лексический характер наименования, не добавляя отсутствующей в греческом графической маркировки.
theological_decisions:
- issue: Значение должности ἀρχισυνάγωγος
  choice: начальник синагоги
  alternative: руководитель синагоги; старейшина синагоги
  rationale: Это обозначение синагогальной должности, а не богословский титул. «Старейшина» могло бы привнести более узкую институциональную ассоциацию, которой слово само по себе не требует.
- issue: Передача обращения διδάσκαλος
  choice: учитель
  alternative: Наставник; Учитель
  rationale: Греческое слово имеет обычное значение «учитель». Такой перевод не вносит в реплику дополнительного христологического оттенка и при этом не исключает его в более широком повествовательном контексте.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи и без архаизмов. Синтаксис слегка перестроен ради естественности, но последовательность событий, источник пришедшего человека и сдержанный тон сообщения сохранены.
