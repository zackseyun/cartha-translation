revisions:
- from: 'Иисус спросил: «Кто прикоснулся ко Мне?» Когда же все стали отрицать это, Пётр сказал: «Наставник, толпы теснят и сдавливают Тебя».[a]'
  to: 'Иисус спросил: «Кто прикоснулся ко Мне?» Но все отрицали это, и Пётр сказал: «Наставник, толпы теснят и сдавливают Тебя»[a].'
  rationale: Исправлена начинательная оттеночность «стали отрицать» на форму «отрицали», соответствующую настоящему причастию ἀρνουμένων и контексту одновременного действия. Союз «Но» передаёт δέ в естественном русском повествовании. Маркер сноски перенесён к поясняемой реплике Петра. Остальные формулировки сохранены как точные и стилистически пригодные.
