    rationale: '«Стали отрицать» имеет начинательное значение («начали отрицать»), отсутствующее в ἀρνουμένων δὲ πάντων. Нужна несовершенная форма, передающая одновременное, продолжающееся отрицание: «Но все отрицали это».'
  - severity: low
