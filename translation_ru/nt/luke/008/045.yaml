  source_fidelity: 'Основной смысл передан точно: вопрос Иисуса относится к физическому прикосновению; Пётр обращается к Нему как «Наставник»; два глагола описывают тесноту и давление толпы. Однако «стали отрицать» вносит не выраженное греческим начало действия, тогда как настоящее причастие ἀρνουμένων передаёт происходящее в тот момент отрицание.'
  naturalness: Текст звучит естественно на современном литературном русском. Форму «все отрицали это» следует предпочесть варианту «все стали отрицать это», поскольку она точнее и не менее естественна. Сноску следует поставить непосредственно после слов, к которым она относится.
  terminology: '«Наставник» — уместная передача Ἐπιστάτα: это уважительное обращение, не подменяющее греческое слово титулом «Господь». «Прикоснулся ко Мне» и «толпы» точны. «Теснят и сдавливают» сохраняет различение συνέχω и ἀποθλίβω.'
