  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: ru
  text: 'Иисус спросил: «Кто прикоснулся ко Мне?» Но все отрицали это, и Пётр сказал: «Наставник, толпы теснят и сдавливают Тебя»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «толпы окружают Тебя и напирают на Тебя».'
    reason: Лексически допустимая альтернативная передача двух близких по смыслу глаголов συνέχω и ἀποθλίβω.
lexical_decisions:
- source_word: ἁψάμενός μου
  choice: прикоснулся ко Мне
  rationale: В данном повествовательном контексте средний залог ἅπτω обозначает физическое прикосновение; русское «прикоснулся» естественно и точно передаёт смысл.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Когда же все стали отрицать это
  rationale: Оборот передаёт одновременное и продолжающееся отрицание со стороны всех; «это» естественно восполняет предмет отрицания из предыдущего вопроса.
- source_word: Ἐπιστάτα
  choice: Наставник
  rationale: Луканское обращение выражает признание авторитета Иисуса. «Наставник» сохраняет уважительный смысл, не подменяя его словами «Господь» или исключительно педагогическим «Учитель».
- source_word: οἱ ὄχλοι
  choice: толпы
  rationale: Сохранено множественное число греческого существительного, указывающее на множество окружавших Иисуса людей.
- source_word: συνέχουσίν σε
  choice: теснят Тебя
  rationale: Глагол здесь передаёт окружение и стеснение со всех сторон; «теснят» звучит естественно в описании плотной толпы.
- source_word: ἀποθλίβουσιν
  choice: сдавливают Тебя
  rationale: Более сильный второй глагол отличён от συνέχω и передаёт физическое давление толпы без чрезмерного усиления до «раздавливают».
theological_decisions:
- issue: Передача обращения Ἐπιστάτα
  choice: Наставник
  alternative: Учитель; Господь
  rationale: В тексте стоит Ἐπιστάτα, а не κύριε. «Наставник» передаёт уважение и признание власти Иисуса, не внося более сильного христологического титула, которого здесь нет.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Реплика Петра передаёт образ плотной толпы двумя различными глаголами. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
