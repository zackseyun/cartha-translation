  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: ru
  text: Сеятель вышел сеять своё семя. И когда он сеял, часть семян упала у дороги, была затоптана, и небесные птицы склевали её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: вышел
  rationale: Аорист ἐξέρχομαι естественно передаётся современным русским «вышел».
- source_word: ὁ σπείρων
  choice: сеятель
  rationale: Субстантивированное причастие обозначает того, кто сеет; «сеятель» — краткое и устойчивое русское соответствие.
- source_word: τοῦ σπεῖραι
  choice: сеять
  rationale: Родительный артиклевого инфинитива после глагола движения выражает цель; русский инфинитив естественно сохраняет эту функцию.
- source_word: τὸν σπόρον αὐτοῦ
  choice: своё семя
  rationale: σπόρος означает семя для посева; возвратное «своё» естественно соотносит его с подлежащим.
- source_word: ἐν τῷ σπείρειν αὐτόν
  choice: когда он сеял
  rationale: Конструкция обозначает действие, одновременное с главным; придаточное времени звучит естественно по-русски.
- source_word: ὃ μὲν
  choice: часть семян
  rationale: Форма распределительно указывает на одну часть посеянного. Добавление «семян» устраняет неестественную неодушевлённую ссылку при сохранении смысла.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: упала у дороги
  rationale: παρά с винительным здесь указывает на место рядом с дорогой; «у дороги» естественно и не уточняет сверх текста, была ли это тропа или дорога.
- source_word: κατεπατήθη
  choice: была затоптана
  rationale: Пассивная форма точно сохраняется и передаёт попрание ногами.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: небесные птицы
  rationale: Обычный библейский оборот для птиц, летающих в небе; он сохраняет образ οὐρανός без тяжеловесного «птицы неба».
- source_word: κατέφαγεν αὐτό
  choice: склевали её
  rationale: В отношении птиц «склевали» естественно выражает полное поедание, заложенное в усиленном κατεσθίω; множественное число согласуется с русским «птицы».
