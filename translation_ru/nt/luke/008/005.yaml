  source_fidelity: 'Текст точно передаёт ход и основные смысловые элементы греческого оригинала: выход сеятеля с целью посева, одновременность посева, распределительное «часть», падение у дороги, попрание и поедание птицами. «Часть семян» — естественная русская передача распределительного ὃ μὲν при собирательном τὸν σπόρον.'
  naturalness: Перевод звучит естественно на современном литературном русском. «Сеятель», «у дороги», «была затоптана» и «склевали её» ясны и сохраняют сжатый повествовательный характер притчи.
