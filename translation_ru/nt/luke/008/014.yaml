source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: ru
  text: А то, что упало среди колючек, — это те, кто услышал и, идя, заглушаются заботами, богатством и житейскими удовольствиями и не приносят зрелого плода.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не доводят плод до зрелости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: упавшее среди колючек
  rationale: Субстантивированное причастие среднего рода отсылает к семени, не называя его прямо. «Упавшее» сохраняет эту форму, а «среди колючек» естественно передаёт образ терний.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: это те, кто услышал
  rationale: Аорист указывает на состоявшееся слушание; русский совершенный вид передаёт его естественно и без добавочного толкования.
- source_word: ὑπὸ μεριμνῶν
  choice: заботами
  rationale: μέριμναι допускает значения «заботы», «тревоги». «Заботы» достаточно широко и естественно обозначает житейские попечения, способные заглушить услышанное.
- source_word: πλούτου
  choice: богатством
  rationale: Прямое и современное соответствие, сохраняющее единственное число греческого отвлечённого существительного.
- source_word: ἡδονῶν τοῦ βίου
  choice: житейскими удовольствиями
  rationale: βίος обозначает земную, повседневную жизнь; «житейские» отличает её от богословски нагруженного понятия жизни вообще.
- source_word: πορευόμενοι
  choice: идя своим путём
  rationale: Передаёт продолжающееся движение в ходе жизни, не превращая оборот в чрезмерно явное толкование всей человеческой жизни.
- source_word: συμπνίγονται
  choice: заглушаются
  rationale: 'Русское «заглушаются» естественно продолжает растительный образ: колючки подавляют рост посева. Страдательная форма оригинала сохранена.'
- source_word: οὐ τελεσφοροῦσιν
  choice: не приносят зрелого плода
  rationale: τελεσφορέω соединяет плодоношение с достижением завершённости. Формулировка сохраняет образ плода и подчёркивает, что он не созревает.
theological_decisions:
- issue: Характер неудачи слушающих, изображённых почвой с колючками
  choice: Сохранён образ заглушённого роста и отсутствия зрелого плода без вывода об их духовном статусе.
  alternative: Истолковать их как невозрождённых, как истинно верующих, ставших бесплодными, либо как отпавших.
  rationale: Стих описывает воздействие забот, богатства и удовольствий, но сам по себе не разрешает споры об отступничестве, возрождении или утрате награды.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и сельскохозяйственной образности притчи. «Колючки» понятнее обычному читателю, чем архаичное «терния»; «житейские удовольствия» точно передаёт земную сферу βίος.
