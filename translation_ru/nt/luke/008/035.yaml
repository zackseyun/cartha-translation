  source_fidelity: 'Содержание в целом передано точно: движение людей, осмотр случившегося, приход к Иисусу, состояние человека и страх сохранены. Однако греческая конструкция εὗρον ... τὸν ἄνθρωπον ... καθήμενον ... ἱματισμένον καὶ σωφρονοῦντα представляет человека как найденного уже сидящим, одетым и пребывающим в здравом уме. В черновике двоеточие и личное «он сидел» слегка ослабляют эту синтаксическую связь, хотя смысла не меняют.'
