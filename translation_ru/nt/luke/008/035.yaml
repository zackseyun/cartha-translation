  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: ru
  text: Тогда они вышли посмотреть, что произошло, и пришли к Иисусу. Они нашли человека, из которого вышли бесы[b], сидящим у ног Иисуса, одетым и в здравом уме[a]. И они испугались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мыслящий здраво».'
    reason: lexical_alternative
  - marker: b
    text: В некоторых рукописях глагол стоит во множественном числе («бесы вышли»); в печатном греческом тексте при подлежащем во множественном числе употреблена форма единственного числа, но смысл от этого не меняется.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышли
  rationale: Аорист ἐξέρχομαι передаёт движение людей из города или окрестностей к месту события; «вышли» естественно сохраняет направленность.
- source_word: ἰδεῖν τὸ γεγονός
  choice: посмотреть, что произошло
  rationale: Инфинитив выражает цель, а субстантивированное причастие — уже совершившееся событие; формулировка ясна на современном русском.
- source_word: εὗρον
  choice: нашли
  rationale: Обычное повествовательное значение εὑρίσκω; добавленное «там» естественно связывает действие с приходом к Иисусу, не меняя смысла.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: из которого вышли бесы
  rationale: Оборот определяет прежде одержимого человека. В русском согласование во множественном числе необходимо при подлежащем «бесы»; разночтение формы глагола отмечено в сноске.
- source_word: δαιμόνια
  choice: бесы
  rationale: Прямой и общеупотребительный русский эквивалент, сохраняющий личностный и сверхъестественный характер действующих сил в повествовании.
- source_word: καθήμενον
  choice: сидел
  rationale: Передаёт положение человека в момент, когда его нашли; личная форма звучит естественнее длинной цепочки причастий.
- source_word: ἱματισμένον
  choice: одетый
  rationale: Подчёркивает восстановленное состояние человека и контраст с его прежней наготой; «одетый» естественно для современного русского.
- source_word: σωφρονοῦντα
  choice: в здравом уме
  rationale: Передаёт здравость рассудка и самообладание без введения современной клинической терминологии.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: у ног Иисуса
  rationale: Естественно передаёт положение рядом с ногами Иисуса и не делает обязательным дополнительный вывод о статусе ученика.
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Точно и естественно передаёт возникший у людей страх.
theological_decisions:
- issue: Значение δαιμόνια в повествовании об изгнании
  choice: бесы
  alternative: злые духи
  rationale: Текст представляет изгнание реальных демонических существ, а не метафору болезни; «бесы» сохраняет эту силу без дополнительных толкований.
- issue: Состояние человека, выраженное σωφρονοῦντα
  choice: в здравом уме
  alternative: мыслящий здраво
  rationale: Выбранная формулировка передаёт восстановление рассудка и самообладания, не сводя выражение к узкой медицинской категории.
- issue: Возможный оттенок позы у ног Иисуса
  choice: у ног Иисуса
  alternative: возле ног Иисуса
  rationale: Перевод сохраняет пространственный смысл и допускаемый контекстом оттенок покорности или ученичества, но не навязывает его.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. Длинное греческое предложение разделено для естественности; содержание и последовательность сохранены. Маркеры сносок поставлены непосредственно при выражениях, к которым относятся.
