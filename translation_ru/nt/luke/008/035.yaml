  terminology: '«Иисус», «бесы», «в здравом уме» и «у ног Иисуса» уместны и естественны для современного литературного русского. Сноска к σωφρονοῦντα ошибочно закреплена за маркером a в английской опоре: английская сноска a фактически стоит после «what had happened», но её текст относится к «in his right mind». В русском следует поставить якорь непосредственно после «в здравом уме». Текстологическая сноска b поставлена у соответствующей глагольной группы верно.'
