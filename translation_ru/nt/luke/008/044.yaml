id: LUK.8.44
reference: Luke 8:44
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: ru
  text: Подойдя сзади, она прикоснулась к краю[a] его одежды, и кровотечение у неё тотчас прекратилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: подолу; или: кисти.'
    reason: 'Лексическая неоднозначность κράσπεδον: край, подол либо кисть одежды.'
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Подойдя сзади
  rationale: Деепричастная конструкция естественно передаёт предшествующее сопутствующее действие и положение женщины позади Иисуса, не добавляя лишних деталей.
- source_word: ἥψατο
  choice: прикоснулась
  rationale: В данном контексте средняя форма означает «коснуться, прикоснуться» и не предполагает обязательного хватания.
- source_word: τοῦ κρασπέδου
  choice: к краю
  rationale: κράσπεδον может обозначать край, кайму, подол или кисть одежды. «Край» сохраняет широту значения и звучит естественно по-русски; возможная более узкая отсылка сохранена в сноске.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: его одежды
  rationale: ἱμάτιον обозначает одежду, часто верхнюю; общее «одежда» не вносит неоправданной конкретизации вроде плаща или накидки.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт непосредственность результата в краткой, достойной повествовательной форме.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: кровотечение у неё прекратилось
  rationale: Естественная современная русская передача буквального выражения «остановилось течение её крови», ясно обозначающая продолжавшееся кровотечение.
theological_decisions:
- issue: Возможный иудейский смысл κράσπεδον как кисти на одежде
  choice: 'В основном тексте — «край», со сноской «Или: подолу; или: кисти»'
  alternative: Передать прямо как «кисть»
  rationale: Само слово допускает как общее обозначение края или подола, так и более специальное значение кисти на иудейской одежде. Контекст стиха не позволяет бесспорно выбрать только специальное значение, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и dignified. «Кровотечение» понятно современному читателю и не эвфемизирует состояние женщины. Местоимение в сочетании «его одежды» естественно соотносится с Иисусом из контекста.
