reference: Luke 8:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: ru
  text: 'Увидев Иисуса, он закричал, пал перед Ним и громко сказал: «Что Тебе до меня, Иисус, Сын Бога Всевышнего?[a] Умоляю Тебя, не мучь меня!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что мне и Тебе?»'
    reason: Сохранение более буквальной формы семитизированной идиомы, допускающей оттенки отчуждения, протеста и требования не вмешиваться.
lexical_decisions:
- source_word: ἰδὼν
  choice: Увидев
  rationale: Аористное причастие обозначает обстоятельство, предшествующее главным действиям; русское деепричастие передаёт это естественно и кратко.
- source_word: ἀνακράξας
  choice: закричал
  rationale: Глагол обозначает внезапный громкий крик; отдельное «громко сказал» далее сохраняет оба выражения оригинала.
- source_word: προσέπεσεν αὐτῷ
  choice: пал перед Ним
  rationale: Передаёт падение перед кем-либо в состоянии подчинения или отчаяния, не уточняя отсутствующее в греческом упоминание ног.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Естественно передаёт дательный образа действия; буквальное «громким голосом» в данном контексте было бы тяжелее.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Что Тебе до меня
  rationale: Современная русская идиома выражает отчуждение и протест, заложенные в семитизированном обороте. Более буквальная форма приведена в сноске.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Сын Бога Всевышнего
  rationale: Сохраняет обращение и титул Бога без добавочного богословского истолкования.
- source_word: δέομαί σου
  choice: Умоляю Тебя
  rationale: Передаёт настойчивую и отчаянную просьбу; в современном русском звучит естественно и достойно.
- source_word: μή με βασανίσῃς
  choice: не мучь меня
  rationale: Передаёт сильное страдание, подразумеваемое βασανίζω, не сужая значение до физической пытки.
theological_decisions:
- issue: Исповедание личности Иисуса нечистым духом
  choice: Иисус, Сын Бога Всевышнего
  alternative: Иисус, Сын Всевышнего Бога
  rationale: Сохранена полная христологическая сила обращения в пределах сказанного персонажем; перевод ничего не ослабляет и не разворачивает в более позднюю догматическую формулу.
- issue: Характер просьбы «не мучь меня»
  choice: не мучь меня
  alternative: не подвергай меня мучениям
  rationale: Формулировка сохраняет духовно-судебную напряжённость контекста, но не уточняет ни способ, ни время мучения сверх текста.
translation_notes:
  register: Современный литературный русский, ясный и торжественно-сдержанный. Местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно устойчивой русской библейской традиции; это орфографическое почтение не добавляет нового содержания.
