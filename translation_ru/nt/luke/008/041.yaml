source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: ru
  text: И вот пришёл человек по имени Иаир. Он был начальником синагоги. Упав к ногам Иисуса, он просил Его войти к нему в дом,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет повествовательное привлечение внимания, звуча при этом естественно в современном русском.
- source_word: ἀνὴρ ᾧ ὄνομα Ἰάϊρος
  choice: человек по имени Иаир
  rationale: Естественная русская передача представления нового участника повествования; ἀνήρ здесь обозначает взрослого мужчину, но отдельное слово «мужчина» стилистически тяжеловесно.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: начальник синагоги
  rationale: Устоявшееся и понятное обозначение руководящего должностного лица синагоги без излишнего уточнения его конкретных обязанностей.
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: Упав к ногам Иисуса
  rationale: Передаёт телесный жест настойчивой мольбы и почтения, не добавляя толкования о его богословском значении.
- source_word: παρεκάλει
  choice: просил
  rationale: Имперфект выражает продолжающуюся настойчивую просьбу; в данном контексте русское «просил» передаёт это естественно, не усиливая смысл до прямо не выраженного отчаяния.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: войти к нему в дом
  rationale: Сохраняет значение просьбы Иаира, избегая неестественного буквального «войти в его дом» после местоимения «Его».
theological_decisions:
- issue: Характер жеста у ног Иисуса
  choice: 'Оставить жест без пояснения: «Упав к ногам Иисуса»'
  alternative: Истолковать его как поклонение Иисусу
  rationale: Греческий текст описывает действие, но не определяет явно, является ли оно актом поклонения, почтения или отчаянной мольбы; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Длинное греческое предложение разделено для естественности; завершающая запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
