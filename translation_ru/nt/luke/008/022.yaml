  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: ru
  text: 'В один из тех дней Иисус вместе со Своими учениками вошёл в лодку и сказал им: «Переправимся на другую сторону озера». И они отплыли.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отчалили»; греческий глагол означает, что они пустились в плавание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν μιᾷ τῶν ἡμερῶν
  choice: В один из тех дней
  rationale: Естественная для современного русского повествовательная формула сохраняет неопределённое указание на один день в известном из контекста периоде; отдельная передача служебного ἐγένετο δὲ сделала бы фразу тяжеловесной.
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Иисус вместе со Своими учениками вошёл в лодку
  rationale: Имя «Иисус» естественно проясняет местоименный субъект в отдельно цитируемом стихе. «Вместе со Своими учениками» точно и гладко передаёт совместное вхождение в лодку.
- source_word: Διέλθωμεν
  choice: Переправимся
  rationale: Форма первого лица множественного числа передаёт побуждение-предложение, а глагол «переправимся» естественно выражает движение через водоём.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: на другую сторону озера
  rationale: Сохраняет пространственный образ τὸ πέραν и точно передаёт λίμνη словом «озеро».
- source_word: ἀνήχθησαν
  choice: они отплыли
  rationale: В данном морском употреблении глагол означает отчалить или пуститься в плавание; «отплыли» кратко и естественно для движения по озеру.
