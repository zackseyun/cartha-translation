  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: ru
  text: И её дух возвратился, и она тотчас встала, а Он велел дать ей поесть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: возвратился
  rationale: Передаёт конкретное значение аориста ἐπιστρέφω — возвращение духа и восстановление жизни — без добавочного толкования.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: к ней дух
  rationale: πνεῦμα может означать «дух» или «дыхание»; в рассказе о возвращении умершей к жизни «дух» лучше сохраняет широту и богословскую напряжённость греческого выражения. Русская конструкция «возвратился к ней дух» естественнее буквального «её дух возвратился».
- source_word: ἀνέστη
  choice: она встала
  rationale: Обычное современное соответствие значению «подняться, встать»; ясно обозначает физическое действие девочки.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт подчёркнутую немедленность события в сжатом и достойном повествовательном стиле.
- source_word: διέταξεν
  choice: велел
  rationale: Естественно передаёт авторитетное практическое распоряжение, не придавая ему излишне сурового оттенка.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: дать ей поесть
  rationale: Естественная русская конструкция, сохраняющая и значение δοθῆναι («дать»), и явно выраженное φαγεῖν («поесть»).
theological_decisions:
- issue: Значение πνεῦμα в контексте возвращения умершей к жизни
  choice: дух
  alternative: дыхание
  rationale: «Дух» сохраняет широкий смысл πνεῦμα и не сводит описанное событие лишь к возобновлению дыхания; лексически возможный вариант отмечен в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским ритмом. Союзы распределены естественно: заключительная часть введена через «а», чтобы избежать тяжёлой цепочки повторяющихся «и». Местоимение «Он» относится к Иисусу.'
