revisions:
- from: И возвратился к ней дух[a], и она тотчас встала, а Он велел дать ей поесть.
  to: И её дух возвратился, и она тотчас встала, а Он велел дать ей поесть.
  rationale: 'Исправлена только передача αὐτῆς: «её дух» точно отражает греческую принадлежность и не создаёт впечатления, будто к девочке вернулся посторонний дух. Остальные элементы сохраняют исходную структуру, немедленность παραχρῆμα и практический смысл αὐτῇ δοθῆναι φαγεῖν. Сноска оставлена при слове «дух» и уточнена стилистически.'
