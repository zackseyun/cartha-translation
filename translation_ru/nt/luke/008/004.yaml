lexical_decisions:
- source_word: Συνιόντος
  choice: собиралась
  rationale: Причастие настоящего времени в родительном самостоятельном обороте передаёт продолжающееся действие, на фоне которого Иисус начал говорить.
- source_word: δὲ
  choice: когда
  rationale: Частица обозначает продолжение повествования и в русском естественно учитывается в составе временной конструкции, без искусственного противопоставления.
- source_word: ὄχλου πολλοῦ
  choice: большая толпа
  rationale: Передаёт как значение ὄχλος («толпа»), так и указание πολλοῦ на её многочисленность.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: из города за городом сходились люди
  rationale: 'Оборот κατὰ πόλιν имеет распределительное значение: люди приходили из одного города за другим. «Сходились» естественно передаёт направленное к одному месту движение множества людей.'
- source_word: πρὸς αὐτόν
  choice: к Нему
  rationale: Предлог πρός с винительным падежом обозначает движение по направлению к Иисусу.
- source_word: εἶπεν
  choice: заговорил
  rationale: В сочетании с последующим указанием на форму речи глагол «заговорил» звучит по-русски естественнее буквального «сказал», сохраняя начало речевого действия.
- source_word: διὰ παραβολῆς
  choice: притчей
  rationale: Творительный падеж передаёт значение средства или образа действия у διά с родительным падежом, не превращая оборот просто в прямое дополнение «рассказал притчу».
