  source_fidelity: Генитив абсолют передан верно как продолжающееся действие на фоне основного события. «Большая толпа» точно отражает ὄχλου πολλοῦ, а движение людей к Иисусу сохранено. Однако «из города за городом» не является нормативным или ясным современным русским способом передать распределительное κατὰ πόλιν; «из разных городов» естественно передаёт приход людей из многих городов, хотя несколько менее формально воспроизводит распределительность.
