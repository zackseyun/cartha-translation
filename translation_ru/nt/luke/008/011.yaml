  language: ru
  text: 'Вот что означает эта притча: семя — слово Божье.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот эта притча». В греческом тексте буквальнее: «Вот эта притча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν δὲ αὕτη ἡ παραβολή
  choice: Вот эта притча
  rationale: Конструкция сохраняет прямую форму греческого текста без добавления слова «смысл»; «вот» естественно передаёт переход δέ к объяснению и указательность αὕτη.
- source_word: ὁ σπόρος
  choice: семя
  rationale: Единственное число сохраняет собирательный образ греческого σπόρος и естественно звучит по-русски.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: слово Божье
  rationale: «Слово» сохраняет библейскую образность и широту λόγος, а «Божье» естественно передаёт родительный τοῦ θεοῦ без уточнения, идёт ли речь об источнике или принадлежности.
theological_decisions:
- issue: Передавать ли παραβολή буквально или раскрыть как «смысл притчи»
  choice: притча
  alternative: смысл притчи
  rationale: Хотя по контексту Иисус начинает объяснять притчу, в греческом тексте отсутствует слово «смысл». Прямой вариант сохраняет напряжение между буквальной формой и контекстуальной функцией.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и понятной формулировкой. Тире естественно выражает именную связку во второй части; форма «Божье» современнее, чем «Божие», и сохраняет библейский регистр без архаизации.
