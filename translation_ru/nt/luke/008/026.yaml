  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: ru
  text: И они приплыли в область герасинцев[a], лежащую напротив Галилеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях, а также в параллельных местах Евангелий: «гадаринцев» или «гергесинцев».'
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: приплыли
  rationale: Глагол обозначает прибытие по воде; «приплыли» естественно передаёт достижение места назначения, не навязывая сомнительного пространственного оттенка приставки κατά.
- source_word: χώραν
  choice: землю
  rationale: Здесь χώρα означает территорию или область, населённую указанным народом. Сочетание «земля герасинцев» естественно для библейского повествования и не подразумевает современное государство.
- source_word: Γερασηνῶν
  choice: герасинцев
  rationale: Передаёт греческое название жителей в форме родительного падежа и следует основному чтению SBLGNT.
- source_word: ἥτις
  choice: лежащую
  rationale: Описательное относительное предложение естественно свёрнуто в причастный оборот, относящийся к «земле».
- source_word: ἀντιπέρα
  choice: напротив
  rationale: Точно и кратко обозначает расположение на противоположной стороне.
- source_word: Γαλιλαίας
  choice: Галилеи
  rationale: Общепринятая русская форма географического названия в требуемом падеже.
theological_decisions:
- issue: Текстовые и географические варианты названия местности в синоптической традиции
  choice: герасинцев
  alternative: гадаринцев или гергесинцев
  rationale: Основной текст следует чтению Γερασηνῶν в SBLGNT. Иные древние чтения не гармонизируются, а указываются в сноске ради текстологической прозрачности.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским звучанием. «Приплыли» проще и естественнее буквального «плыли вниз»; «земля герасинцев» сохраняет достоинство стиля и территориальный смысл χώρα.
