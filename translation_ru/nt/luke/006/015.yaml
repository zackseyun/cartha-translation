  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: ru
  text: и Матфея, и Фому, и Иакова, сына Алфея, и Симона, прозванного Зилотом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ревнителем». Греческое слово может быть прозвищем и само по себе не требует считать Симона членом определённого политического движения.'
    reason: Лексическая альтернатива и сохранение исторической неоднозначности.
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Повторяющийся сочинительный союз сохранён, чтобы передать перечислительный строй греческого текста.
- source_word: Μαθθαῖον
  choice: Матфея
  rationale: Устоявшаяся русская форма имени; винительный падеж соответствует синтаксису продолжающегося списка.
- source_word: Θωμᾶν
  choice: Фому
  rationale: Устоявшаяся русская форма имени; винительный падеж передаёт форму исходного текста.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Иакова, сына Алфеева
  rationale: В данной формуле родительный падеж Ἁλφαίου естественно указывает на отца; пояснение «сына» устраняет неестественную для современного русского языка двусмысленность.
- source_word: Σίμωνα
  choice: Симона
  rationale: Устоявшаяся русская передача имени, оформленная в винительном падеже.
- source_word: τὸν καλούμενον
  choice: прозванного
  rationale: Причастная конструкция атрибутивно обозначает имя или прозвище; «прозванного» естественно и кратко звучит в русском перечне.
- source_word: Ζηλωτὴν
  choice: Зилотом
  rationale: Традиционная русская передача греческого эпитета сохраняет его как обозначение Симона, не утверждая прямо его формальное членство в позднее оформленном политическом движении.
theological_decisions:
- issue: Следует ли понимать Ζηλωτής как название политической принадлежности или как описательный эпитет
  choice: «Зилотом» — традиционный идентифицирующий эпитет без дополнительного историко-политического уточнения.
  alternative: «ревнителем» или «ревностным» как чисто описательное прозвище.
  rationale: Греческое слово допускает связь с ревностью и употребление как устойчивого эпитета, но само по себе не требует вывода о формальном членстве в позднее оформленной партии; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского перечня. Традиционные формы имён оставлены ради узнаваемости; синтаксис сделан естественным для современного читателя.
