lexical_decisions:
- source_word: Τί
  choice: Почему
  rationale: В сочетании с καλεῖτε вопросительное местоимение употреблено в значении вопроса о причине; «Почему» естественно передаёт обличительный вопрос.
- source_word: δέ
  choice: же
  rationale: Мягкая частица связывает вопрос с предшествующим наставлением; русское «же» естественно передаёт этот переход и оттенок возражения.
- source_word: με καλεῖτε
  choice: вы зовёте Меня
  rationale: Сохраняет прямой объект и настоящее время; «зовёте» естественно для обращения к человеку с повторённым званием.
- source_word: Κύριε κύριε
  choice: Господи, Господи
  rationale: Повтор и звательная форма сохранены; «Господь» передаёт как обращение к владыке, так и возможную христологическую значимость титула.
- source_word: καὶ οὐ ποιεῖτε
  choice: и не делаете
  rationale: Сохраняет греческое сочинение и подчёркивает противоречие между обращением и поступками.
- source_word: ἃ λέγω
  choice: того, что Я говорю
  rationale: Естественно передаёт нейтральное множественное относительное местоимение в собирательном смысле, не добавляя отсутствующего в тексте «вам».
theological_decisions:
- issue: Передача κύριος как обращения к Иисусу
  choice: Господи
  alternative: Учитель / Владыка
  rationale: «Господи» — обычная и содержательно ёмкая передача κύριε, сохраняющая возможный диапазон от почтительного обращения до исповедального титула; альтернативное значение отмечено в сноске, чтобы не устранять лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис близок к греческому, но естественен по-русски; повтор обращения и риторический контраст полностью сохранены.
