  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: ru
  text: Симона, которого он также назвал Петром, и Андрея, его брата, Иакова и Иоанна, Филиппа и Варфоломея,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Симона
  rationale: Устоявшаяся русская форма имени апостола Симона; падеж сохранён в соответствии с греческим винительным падежом и синтаксисом продолжающегося перечня.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: которого Он также назвал Петром
  rationale: Глагол ὀνομάζω передаёт наречение именем; «назвал Петром» естественно и точно выражает это действие. Καί перед глаголом передано словом «также».
- source_word: Πέτρον
  choice: Петром
  rationale: Устоявшаяся русская новозаветная форма имени Πέτρος; творительный падеж требуется русской конструкцией «назвал Петром».
- source_word: Ἀνδρέαν
  choice: Андрея
  rationale: Устоявшаяся русская форма имени Ἀνδρέας, поставленная в винительный падеж как часть перечня избранных.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: его брата
  rationale: В данном контексте ἀδελφός обозначает родного брата; такая передача естественна по-русски и сохраняет отнесение местоимения к Симону.
- source_word: Ἰάκωβον
  choice: Иакова
  rationale: Устоявшаяся русская новозаветная форма имени Ἰάκωβος применительно к этому апостолу.
- source_word: Ἰωάννην
  choice: Иоанна
  rationale: Устоявшаяся русская форма имени Ἰωάννης.
- source_word: Φίλιππον
  choice: Филиппа
  rationale: Устоявшаяся русская форма имени Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: Варфоломея
  rationale: Устоявшаяся русская форма имени Βαρθολομαῖος.
- source_word: καὶ
  choice: и
  rationale: Повторяющийся союз координирует имена в перечне. В русском его естественно сохранить перед смысловыми группами, не воспроизводя механически перед каждым именем.
