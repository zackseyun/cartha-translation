  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: ru
  text: Добрый человек из доброго сокровища своего сердца извлекает добро, а злой человек из злого сокровища извлекает зло. Ведь его уста говорят от избытка сердца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь его уста говорят то, чем переполнено сердце».'
    reason: Лексико-стилистическая альтернатива для ἐκ περισσεύματος καρδίας, передающая образ переполнения более естественно по-русски.
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: добрый человек
  rationale: Передаёт нравственную характеристику и обобщённый смысл ἄνθρωπος естественным современным русским выражением.
- source_word: θησαυροῦ
  choice: сокровище
  rationale: Сохраняет метафору внутреннего хранилища или накопленного запаса, из которого человек извлекает добро; слово «запас» было бы яснее, но ослабило бы образ.
- source_word: καρδίας
  choice: сердце
  rationale: Сохраняет обычное библейское обозначение внутреннего человека — его мыслей, воли и склонностей — без разъяснительного парафраза.
- source_word: προφέρει
  choice: извлекает
  rationale: Естественно по-русски передаёт вынесение наружу того, что находится во внутреннем хранилище; вторая глагольная форма подразумевается эллиптически, как и часть образа в греческой второй половине.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: злой / злого / зло
  rationale: Последовательно сохраняет нравственную силу πονηρός и прямое противопоставление добру; «плохой» было бы неоправданно слабым.
- source_word: περισσεύματος
  choice: избыток
  rationale: Формально сохраняет представление о содержимом сердца, которого настолько много, что оно проявляется в речи. Более образный вариант «переполненность» отражён в сноске.
- source_word: λαλεῖ
  choice: говорят
  rationale: Нейтральный и достойный русский эквивалент; форма множественного числа согласована с подлежащим «уста».
- source_word: τὸ στόμα αὐτοῦ
  choice: его уста
  rationale: Сохраняет явно названные в греческом тексте уста как внешнее выражение состояния сердца; «уста» поддерживает достоинство афористического высказывания.
theological_decisions:
- issue: Нравственное противопоставление ἀγαθός и πονηρός
  choice: Сохранены категории «добрый» и «злой», «добро» и «зло».
  alternative: «хороший» и «плохой»
  rationale: Речь идёт о нравственном характере человека и его проявлении, а не просто о качестве или пригодности; более слабые слова сгладили бы этическую остроту высказывания.
- issue: Связь речи с внутренним состоянием сердца
  choice: Сохранена причинная формула «от избытка сердца», не уточняющая, идёт ли речь о запасе, полноте или переполнении.
  alternative: «уста говорят то, чем переполнено сердце»
  rationale: Греческое ἐκ περισσεύματος допускает оттенки изобилия и переполнения. Основной текст удерживает исходную метафору, а сноска предлагает естественное русское выражение.
translation_notes:
  register: Современный литературный русский с сохранением краткой афористичности и параллелизма. «Уста» выбрано вместо разговорного «рот», поскольку последнее в данном изречении звучало бы сниженно; конструкция остаётся понятной обычному читателю.
