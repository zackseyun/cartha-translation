  footnotes:
  - marker: a
    text: 'Или: «кто оскорбляет вас»; или: «кто притесняет вас». Греческое слово охватывает разные виды враждебного и оскорбительного обращения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Форма повелительного наклонения во множественном числе. «Благословляйте» естественно передаёт прямое повеление и сохраняет смысловой контраст с проклятием.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: проклинающих вас
  rationale: Артиклированное причастие обозначает людей, которые проклинают адресатов. Причастный оборот звучит естественно по-русски и сохраняет активное враждебное действие.
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Повелительная форма настоящего времени передана обычным русским императивом несовершенного вида, который уместно выражает повторяющееся или постоянное действие.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: за тех, кто оскорбляет вас
  rationale: С глаголом молитвы περί естественно передаётся как «за». ἐπηρεάζω может обозначать оскорбительное, злонамеренное обращение или более широкое притеснение; «оскорбляет» ясно и естественно, а сноска сохраняет более широкие возможности.
theological_decisions:
- issue: Объём заповеди об отношении к враждебно настроенным людям
  choice: Передать оба повеления прямо, без поясняющих богословских добавлений.
  alternative: Уточнить характер благословения или молитвы доктринальным толкованием.
  rationale: Греческий текст формулирует этические повеления и оставляет их напряжённую силу без дополнительной квалификации; перевод не должен сужать или расширять их конфессиональным толкованием.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный и достойный стиль. Повтор местоимения «вас» сохраняет параллелизм исходного текста. Слово «оскорбляет» в основном тексте понятно широкому читателю, а сноска отмечает более широкий диапазон греческого глагола.
