  rationale: Исправлена первая пара, чтобы сохранить прямое лексическое соответствие κρίνω / κριθῆτε («судить / быть судимым») и не стирать градацию к καταδικάζω («осуждать»). Юридическая перифраза заменена естественной краткой формой. Основной перевод последней пары приведён в соответствие с её наиболее ясным русским контекстуальным смыслом и английским аудиторским текстом, тогда как более широкое значение ἀπολύω сохранено в сноске.
