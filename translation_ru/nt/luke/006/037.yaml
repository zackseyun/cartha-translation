  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: ru
  text: И не судите — и не будете судимы; и не осуждайте — и не будете осуждены. Прощайте[a] — и будете прощены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отпускайте — и вас отпустят». Греческий глагол может означать «отпускать», «освобождать»; в данном контексте он также означает «прощать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: судите
  rationale: Краткое и естественное соответствие κρίνω; сохраняет общий смысл суждения о другом и словесную связь с пассивной формой.
- source_word: οὐ μὴ κριθῆτε
  choice: сами не будете осуждены
  rationale: В русском будущем изъявительном отрицание передаёт уверенный результат; «сами» естественно подчёркивает взаимность. «Осуждены» здесь помогает отличить пассивное претерпевание суда от простого оценивания, не устраняя связи с «судите».
- source_word: καταδικάζετε
  choice: выносите обвинительного приговора
  rationale: 'Передаёт усиление по сравнению с κρίνω: речь идёт не просто о суждении, а о признании виновным, обвинительном решении.'
- source_word: οὐ μὴ καταδικασθῆτε
  choice: вам не вынесут обвинительного приговора
  rationale: Сохраняет параллелизм и эмфатическую уверенность конструкции οὐ μή, а также точный оттенок осуждающего приговора.
- source_word: ἀπολύετε
  choice: отпускайте
  rationale: Сохраняет широкое значение ἀπολύω — отпускать, освобождать, снимать предъявляемое требование; контекстуальное значение «прощать» указано в примечании.
- source_word: ἀπολυθήσεσθε
  choice: вас отпустят
  rationale: Сохраняет соответствие активной и пассивной форм одного греческого глагола и не сужает заранее смысл до прощения.
- source_word: καὶ
  choice: и
  rationale: Повторяющийся союз сохраняет координацию и ритм греческого изречения; тире естественно выражает связь наставления со следствием.
theological_decisions:
- issue: Следует ли передавать ἀπολύετε узко как «прощайте» или шире как «отпускайте»
  choice: 'В основном тексте: «Отпускайте — и вас отпустят»'
  alternative: «Прощайте — и будете прощены»
  rationale: Глагол допускает значения освобождения, отпускания и снятия обвинения; широкая передача сохраняет намеренную лексическую открытость и взаимность форм. Значение прощения вполне вероятно в данном этическом контексте, поэтому оно отмечено в сноске, но не подменяет более широкий образ основного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Параллелизм оригинала сохранён; тире передаёт связь между повелением и обещанным результатом. Формулировка «обвинительный приговор» намеренно отличает более сильное καταδικάζω от общего κρίνω.
