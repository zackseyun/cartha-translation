  source_fidelity: 'Первое соответствие следует исправить: κρίνετε / κριθῆτε образуют прямую пару «судить / быть судимым», тогда как «осуждены» преждевременно сближает его с более сильным καταδικάζετε / καταδικασθῆτε. Во второй паре «осуждать / быть осуждённым» точно передаёт усиление καταδικάζω. В данном контексте ἀπολύετε наиболее естественно передать как «прощайте»; более широкое «отпускайте» следует сохранить как лексическую альтернативу в сноске.'
