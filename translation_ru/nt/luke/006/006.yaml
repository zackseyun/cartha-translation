base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: ru
  text: В другую субботу он вошёл в синагогу и учил. Там был человек с усохшей[a] правой рукой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иссохшей». Греческое слово буквально означает «сухая» и здесь описывает повреждённую руку, утратившую нормальную функцию.'
    reason: Лексическая альтернатива поясняет образное значение ξηρά, не подменяя его конкретным медицинским диагнозом.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: В другую субботу он вошёл
  rationale: Луканская формула вводит новое событие, а δέ служит мягкой связкой повествования. В современном русском её значение естественно передаётся переходом к новому предложению без буквального «и случилось».
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: в другую субботу
  rationale: ἕτερος указывает на другой случай того же рода; выражение сохраняет временную привязку и звучит естественно.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: он вошёл в синагогу
  rationale: Инфинитивная конструкция после ἐγένετο передана обычной для русского языка личной формой глагола.
- source_word: καὶ διδάσκειν
  choice: и стал учить
  rationale: Настоящий инфинитив представляет действие в его протекании; «стал учить» естественно показывает начало продолжавшегося обучения.
- source_word: ἄνθρωπος ἐκεῖ
  choice: там был человек
  rationale: Сохранены мужской референт и указание на присутствие этого человека в синагоге.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: у которого правая рука
  rationale: Относительная конструкция естественна по-русски и сохраняет уточнение, что поражена именно правая рука.
- source_word: ξηρά
  choice: иссохшей
  rationale: Прилагательное буквально связано с сухостью и в данном контексте описывает иссохшую, утратившую нормальную функцию руку, не уточняя медицинский диагноз.
