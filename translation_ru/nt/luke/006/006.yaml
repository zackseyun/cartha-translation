  register: Современный литературный русский язык с ясным и сдержанным повествовательным стилем. Местоимение «он» оставлено со строчной буквы, поскольку в греческом тексте нет особого графического почтительного выделения. Сноска поставлена при слове «иссохшей», к которому относится пояснение.
