id: LUK.6.42
reference: Luke 6:42
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: ru
  text: 'Как можешь ты говорить своему брату: «Брат, дай я выну соринку из твоего глаза», — а сам не видишь бревна в собственном глазу? Лицемер! Сначала вынь бревно из собственного глаза — и тогда будешь ясно видеть, как вынуть соринку из глаза твоего брата.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Соринка» — греч. κάρφος, то есть крошечный кусочек сухого материала; возможный перевод: «щепка».'
    reason: lexical_alternative
  - marker: b
    text: «Бревно» — греч. δοκός, крупный деревянный брус или балка.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Как можешь ты говорить
  rationale: Передаёт риторический вопрос о возможности и уместности поступка; постановка «ты» после модального глагола сохраняет смысловое ударение без неестественной тяжеловесности.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: брату / Брат / брата
  rationale: Сохраняет мужской род и единственное число греческого родственного обращения, не сужая его пояснительной заменой вроде «единоверец».
- source_word: ἄφες ἐκβάλω
  choice: дай я выну
  rationale: ἄφες здесь вводит просьбу о позволении; современное русское «дай я» естественно передаёт эту функцию.
- source_word: κάρφος
  choice: соринка
  rationale: Обозначает крошечный кусочек сухого материала; «соринка» естественна в русском контексте глаза и отчётливо противопоставлена бревну.
- source_word: δοκός
  choice: бревно
  rationale: Передаёт крупный деревянный брус и сохраняет намеренную гиперболу. «Балка» ближе к строительной функции предмета, но «бревно» яснее и естественнее для широкого читателя.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: а сам не видишь
  rationale: «Сам» сохраняет эмфатическое противопоставление между исправлением другого и собственной слепотой.
- source_word: ὑποκριτά
  choice: Лицемер!
  rationale: Прямое обращение в звательном падеже передано кратким и резким русским восклицанием.
- source_word: διαβλέψεις
  choice: будешь ясно видеть
  rationale: Сохраняет зрительный образ и усилительное значение глагола, а также будущую форму; не превращает метафору лишь в общее «сможешь».
- source_word: ἐκβαλεῖν
  choice: как вынуть
  rationale: Инфинитив при διαβλέψεις выражает действие, которое станет возможно совершить при ясном зрении; конструкция «ясно видеть, как...» естественна по-русски и сохраняет связь зрения с удалением соринки.
theological_decisions:
- issue: Гендерно маркированное ἀδελφός в нравственном наставлении
  choice: брат
  alternative: брат или сестра; ближний; единоверец
  rationale: В исходном тексте последовательно употреблено существительное мужского рода в единственном числе, включая прямое обращение. Перевод сохраняет эту форму, не отрицая возможной широты применения наставления.
- issue: Гиперболическое противопоставление κάρφος и δοκός
  choice: соринка ... бревно
  alternative: щепка ... балка; соринка ... балка
  rationale: Сохраняется резкий контраст между малым недостатком другого и огромным собственным недостатком, без ослабления образа или его догматического истолкования.
- issue: Значение διαβλέψεις перед удалением соринки
  choice: будешь ясно видеть, как вынуть
  alternative: сможешь вынуть; тогда разглядишь соринку
  rationale: Перевод удерживает как буквальный образ прояснившегося зрения, так и практическую направленность инфинитива, не сводя высказывание исключительно к способности или исключительно к восприятию.
translation_notes:
  register: Современный литературный русский язык с достоинством и разговорной естественностью прямой речи. Повтор «брат» и зрительная метафора сохранены. «Собственный глаз» употреблено для естественной передачи эмфатического σοῦ и противопоставления чужого и своего. Маркеры сносок поставлены в основном тексте после завершения стиха.
