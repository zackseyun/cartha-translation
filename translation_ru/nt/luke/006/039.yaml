  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: ru
  text: 'И ещё Он рассказал им притчу: «Разве может слепой вести слепого? Не упадут ли оба в яму?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в канаву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ
  choice: И ещё
  rationale: Передаёт переход и добавочное значение καί естественно для современного русского повествования.
- source_word: παραβολὴν
  choice: притчу
  rationale: Обычное и узнаваемое обозначение образного поучения в евангельском контексте.
- source_word: Μήτι δύναται
  choice: Разве может
  rationale: Риторический вопрос ожидает отрицательного ответа; частица «разве» ясно и естественно передаёт эту направленность.
- source_word: τυφλὸς ... τυφλὸν
  choice: слепой ... слепого
  rationale: Субстантивированные формы мужского рода сохранены; в русском такая пословичная конструкция естественна и имеет обобщающий смысл.
- source_word: ὁδηγεῖν
  choice: вести
  rationale: Кратко и естественно передаёт руководство другого человека по пути; «направлять» здесь звучало бы менее образно.
- source_word: οὐχὶ ... ἀμφότεροι
  choice: Не ... ли оба
  rationale: Сохраняет риторический вопрос, ожидающий утвердительного ответа, и явно передаёт значение «оба».
- source_word: βόθυνον
  choice: яму
  rationale: βόθυνος может обозначать яму или канаву; «яма» — широкое, наглядное и естественное соответствие.
- source_word: ἐμπεσοῦνται
  choice: упадут
  rationale: Будущее время передано прямо; сочетание «упасть в яму» естественно выражает движение, заданное εἰς.
theological_decisions:
- issue: Обобщающее значение формы τυφλός мужского рода
  choice: слепой ... слепого
  alternative: незрячий человек ... незрячего человека
  rationale: Греческий текст использует формы мужского рода в пословичном, обобщающем высказывании. Русская субстантивация «слепой» сохраняет форму и образ, не ограничивая смысл только одним конкретным мужчиной.
translation_notes:
  register: Современный литературный русский язык с кратким, выразительным ритмом притчи. Местоимение «Он» написано с прописной буквы по принятой русской библейской традиции; синтаксис двух риторических вопросов сохранён.
