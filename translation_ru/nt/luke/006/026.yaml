  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: ru
  text: 'Горе вам, когда все люди говорят о вас хорошо: ведь так поступали с лжепророками их предки[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «их отцы», то есть предшествующие поколения их народа.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: Горе вам
  rationale: «Горе» сохраняет силу пророческого предостережения и обличения. Местоимение «вам» естественно передаёт по-русски направленность возгласа, ясную из обращения ὑμᾶς и контекста параллельных изречений.
- source_word: ὅταν
  choice: когда
  rationale: Передаёт общее условие, относящееся к возможной повторяющейся ситуации, и звучит естественно в русском предостережении.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: говорят о вас хорошо
  rationale: Передаёт устойчивый смысл выражения — положительно отзываться о ком-либо, а не просто говорить правильно или правдиво.
- source_word: πάντες οἱ ἄνθρωποι
  choice: все люди
  rationale: Сохраняет всеобщность и родовое значение ἄνθρωποι без неоправданного ограничения только мужчинами.
- source_word: κατὰ τὰ αὐτά
  choice: так же
  rationale: Естественно передаёт значение одинакового образа действий в сочетании с ποιέω.
- source_word: γάρ
  choice: ведь
  rationale: Выражает основание предшествующего предостережения и сохраняет связность фразы в современном литературном русском.
- source_word: ἐποίουν
  choice: поступали
  rationale: Имперфект указывает на характерное, повторявшееся поведение прежних поколений; русская форма прошедшего времени во множественном числе естественно передаёт эту мысль в контексте.
- source_word: τοῖς ψευδοπροφήταις
  choice: с лжепророками
  rationale: При глаголе «поступали» русский предлог «с» естественно обозначает тех, на кого было направлено такое отношение.
- source_word: οἱ πατέρες αὐτῶν
  choice: их предки
  rationale: В данном контексте πατέρες обозначает прежние поколения народа. «Предки» ясно передаёт этот смысл, тогда как буквальное «отцы» в современном русском может быть понято слишком узко.
theological_decisions:
- issue: Смысл сопоставления с лжепророками
  choice: Всеобщее одобрение представлено как тревожный признак, поскольку прежние поколения так же относились к лжепророкам.
  alternative: Стих безусловно осуждает всякую положительную оценку со стороны других людей.
  rationale: Связка γάρ и выражение κατὰ τὰ αὐτά обосновывают предостережение исторической аналогией. Перевод сохраняет эту напряжённость, не превращая её в запрет на всякую похвалу.
translation_notes:
  register: Современный литературный русский с торжественной, но общепонятной интонацией. Восклицательный знак после первой части подчёркивает силу Οὐαί, а «ведь» естественно вводит объяснение.
