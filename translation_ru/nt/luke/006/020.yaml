id: LUK.6.20
reference: Luke 6:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: ru
  text: 'И Он, подняв глаза на Своих учеников, говорил: «Блаженны вы, бедные[a], потому что ваше — Царство Божье».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Блаженны бедные». Однако последующее «ваше» показывает, что это прямое обращение к ученикам. Лука говорит именно о бедных, не добавляя «духом» (ср. Мф. 5:3).'
    reason: Формальная грамматика, прямое обращение и важное отличие от параллели в Матфее.
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: подняв глаза
  rationale: Естественно передаёт предшествующее действие аористного причастия и сохраняет конкретный образ направления взгляда.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: на Своих учеников
  rationale: В сочетании с глагольным выражением «поднять глаза» предлог εἰς обозначает направление взгляда; по-русски естественно «поднять глаза на».
- source_word: ἔλεγεν
  choice: говорил
  rationale: Несовершенный вид передаёт имперфект как ввод продолжающейся речи без избыточного «начал говорить».
- source_word: Μακάριοι
  choice: Блаженны
  rationale: Традиционное и семантически ёмкое обозначение одобряемого Богом состояния; «счастливы» звучало бы преимущественно эмоционально.
- source_word: οἱ πτωχοί
  choice: вы, бедные
  rationale: Артикль с прилагательным формально означает «бедные», но следующее ὑμετέρα прямо обращает изречение к слушателям. Русская конструкция сохраняет и категорию бедных, и прямое обращение.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинное основание провозглашённого блаженства.
- source_word: ὑμετέρα ἐστὶν
  choice: ваше
  rationale: Предикативное притяжательное местоимение передано с сохранением греческого акцента на принадлежности; связка в настоящем времени по-русски естественно опускается.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшийся, понятный и широкий по смыслу эквивалент, не сужающий βασιλεία только до процесса царствования.
theological_decisions:
- issue: Следует ли понимать πτωχοί как материально бедных или добавлять «духом»
  choice: бедные
  alternative: бедные духом
  rationale: У Луки отсутствует уточнение «духом», поэтому его нельзя вносить из Мф. 5:3; перевод сохраняет самостоятельную формулировку и напряжение текста Луки.
- issue: Третье лицо формы οἱ πτωχοί или прямое обращение
  choice: Блаженны вы, бедные
  alternative: Блаженны бедные
  rationale: Хотя οἱ πτωχοί формально стоит в третьем лице, ὑμετέρα («ваше») сразу обозначает прямое обращение. Выбранная русская формулировка делает дискурсивную связь прозрачной, не изменяя обозначение адресатов.
- issue: Характер принадлежности Царства
  choice: ваше — Царство Божье
  alternative: вам будет принадлежать Царство Божье
  rationale: Сохраняется настоящее время ἐστίν и не вводится отсутствующая в тексте исключительно будущая перспектива.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. «Божье» выбрано как нормативная современная форма; синтаксис сохраняет выразительный акцент исходного текста: «ваше — Царство Божье».'
