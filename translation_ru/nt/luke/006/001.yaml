base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: ru
  text: Однажды в субботу Иисус проходил через засеянные поля, и его ученики срывали колосья, растирали их руками и ели зёрна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Однажды
  rationale: Естественно вводит отдельный эпизод и вместе с выражением «в субботу» передаёт, что событие произошло в одну из суббот; δέ здесь служит мягким повествовательным переходом.
- source_word: ἐν σαββάτῳ
  choice: в субботу
  rationale: Передаёт неопределённое указание на одну субботу без тяжеловесного «в одну из суббот».
- source_word: διαπορεύεσθαι αὐτὸν
  choice: Иисус проходил
  rationale: Имя восстанавливает референта местоимения для ясности отдельного стиха; несовершенный вид передаёт разворачивающееся действие.
- source_word: διὰ σπορίμων
  choice: через засеянные поля
  rationale: σπόριμα обозначает засеянные участки или хлебные поля; формулировка не уточняет вид зерновой культуры.
- source_word: ἔτιλλον
  choice: срывали
  rationale: Несовершенный вид передаёт продолжавшееся действие учеников.
- source_word: τοὺς στάχυας
  choice: колосья
  rationale: Обычное и точное современное русское обозначение στάχυας.
- source_word: καὶ ἤσθιον ... ψώχοντες ταῖς χερσίν
  choice: и ели зёрна, растирая их руками
  rationale: По-русски естественно явно назвать съедаемые зёрна; причастный оборот сохраняет конкретное действие, которым их отделяли от колосьев.
