  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: ru
  text: 'Книжники же и фарисеи пристально наблюдали за ним[a]: не исцелит ли он в субботу, чтобы найти основание обвинить его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внимательно следили за ним». Греческий глагол может обозначать пристальное, в данном контексте даже недоброжелательное наблюдение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «найти, в чём его обвинить»; возможно также: «получить возможность обвинить его». Греческий оборот подразумевает поиск основания или повода для обвинения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: пристально наблюдали за ним
  rationale: Имперфект передаёт продолженное наблюдение, а глагол в данном контексте подразумевает настороженное, недоброжелательное внимание. Дополнение «за ним» ясно из контекста.
- source_word: γραμματεῖς
  choice: книжники
  rationale: Традиционный и точный русский термин для знатоков и толкователей Писания в евангельском повествовании.
- source_word: Φαρισαῖοι
  choice: фарисеи
  rationale: Устоявшееся русское наименование этой религиозной группы.
- source_word: εἰ ἐν τῷ σαββάτῳ θεραπεύει
  choice: не исцелит ли он кого-нибудь в субботу
  rationale: Русская косвенная вопросительная конструкция с «не… ли» естественно передаёт εἰ; будущее «исцелит» соответствует перспективе наблюдателей. «Кого-нибудь» имплицитно заложено в переходном значении русского «исцелить» и необходимо для естественности фразы.
- source_word: ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ
  choice: чтобы найти основание обвинить его
  rationale: Оборот ясно передаёт цель наблюдения и естественно выражает подразумеваемый поиск повода или основания для обвинения, не усиливая характер возможного обвинения.
theological_decisions:
- issue: Намерение книжников и фарисеев
  choice: Их наблюдение показано как целенаправленное и связанное с поиском основания для обвинения.
  alternative: 'Передать наблюдение нейтрально: «смотрели, исцеляет ли он».'
  rationale: Сочетание παρατηρέω с целевым оборотом ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ указывает на враждебную цель, однако текст не уточняет содержание предполагаемого обвинения.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Местоимения, относящиеся к Иисусу, даны со строчной буквы, поскольку регистр отсутствует в греческом источнике и не должен вносить дополнительное конфессиональное оформление.
