  rationale: 'Убрано невыраженное в оригинале «к Себе». Перестроена заключительная часть для более естественного русского порядка слов при сохранении значения καί («также»). Сноска b исправлена: устранено неверное аспектуальное значение «стал звать». Сноска a не нужна, поскольку после устранения «к Себе» основной текст не требует пояснения спорного оттенка глагола; значение «обратился к» остаётся возможной, но в данном контексте менее подходящей альтернативой.'
