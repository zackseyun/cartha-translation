  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: ru
  text: И когда настал день, Он позвал Своих учеников и избрал из них двенадцать, которых Он также назвал апостолами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «которых Он также именовал апостолами». Греческий глагол означает «назвал», «дал наименование»; «назвал» в основном тексте помогает отличить его от предыдущего глагола «позвал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: когда настал день
  rationale: Естественно передаёт наступление дневного времени, не сужая значение до утра.
- source_word: προσεφώνησεν
  choice: позвал к Себе
  rationale: В данном контексте речь идёт о том, что Иисус созвал учеников для избрания двенадцати; оборот естественен в современном русском и сохраняет направленность действия.
- source_word: μαθητὰς αὐτοῦ
  choice: Своих учеников
  rationale: «Ученики» — ясный и устоявшийся евангельский эквивалент; возвратное «Своих» естественно соотносит их с подлежащим.
- source_word: ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα
  choice: избрал из них двенадцать
  rationale: Передаёт осознанный выбор двенадцати из более широкого круга учеников; деепричастная конструкция заменена однородным сказуемым ради естественного русского синтаксиса.
- source_word: οὓς καὶ ἀποστόλους ὠνόμασεν
  choice: которых и назвал апостолами
  rationale: «Назвал» ясно выражает присвоение обозначения и не смешивается с более ранним «позвал»; частица «и» сохраняет καί и естественна по-русски.
- source_word: ἀποστόλους
  choice: апостолами
  rationale: Устоявшийся и контекстуально точный термин для особого обозначения двенадцати; буквальное «посланниками» ослабило бы формирующееся титульное значение.
theological_decisions:
- issue: Передавать ли ἀποστόλους буквальным «посланники» или установленным обозначением «апостолы»
  choice: апостолы
  alternative: посланники; посланные
  rationale: Здесь Иисус даёт двенадцати особое наименование, а не просто описывает выполняемое ими поручение. «Апостолы» сохраняет повествовательную и богословскую значимость термина, не добавляя к тексту дальнейших доктринальных выводов.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным евангельским звучанием. Синтаксис слегка разгружен по сравнению с греческой причастной конструкцией, но последовательность действий и смысловые связи сохранены. Прописные буквы в местоимениях, относящихся к Иисусу, следуют распространённой русской библейской издательской традиции.
