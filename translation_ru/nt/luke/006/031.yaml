id: LUK.6.31
reference: Luke 6:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: ru
  text: И как хотите, чтобы люди поступали с вами, так и вы поступайте с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: как
  rationale: Вводит норму сопоставления; в паре «как… так и» естественно и точно передаёт сравнительную связь.
- source_word: θέλετε
  choice: хотите
  rationale: Передаёт обычное желание или предпочтение современным и нейтральным русским словом.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: чтобы … поступали с вами
  rationale: Конструкция с ἵνα выражает содержание желания. «Поступали с вами» естественно по-русски обозначает действия людей по отношению к адресатам.
- source_word: οἱ ἄνθρωποι
  choice: люди
  rationale: ἄνθρωποι употреблено обобщённо и не ограничивает речь мужчинами.
- source_word: ποιεῖτε αὐτοῖς
  choice: вы поступайте с ними
  rationale: Сохраняет ответную, взаимно соотнесённую структуру повеления. Местоимение «вы» подчёркивает соответствие сторон без изменения смысла.
- source_word: ὁμοίως
  choice: так и
  rationale: В русской конструкции «как… так и» ясно выражает требование поступать соответствующим образом.
theological_decisions:
- issue: Обобщённое значение οἱ ἄνθρωποι
  choice: люди
  alternative: мужчины; другие
  rationale: В данном контексте речь идёт о людях вообще, поэтому перевод не вводит гендерного ограничения.
- issue: Широта значения ποιέω
  choice: поступать с
  alternative: делать для
  rationale: «Поступать с» идиоматично в русском этическом высказывании и сохраняет широкий смысл отношения и действий, не сводя заповедь только к оказанию услуг.
translation_notes:
  register: 'Современный литературный русский язык; краткая, dignified и легко запоминающаяся формулировка. Синтаксический параллелизм оригинала передан конструкцией «как… так и». '
