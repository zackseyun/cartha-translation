id: LUK.6.12
reference: Luke 6:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: ru
  text: В те дни случилось, что Он вышел на гору помолиться и провёл всю ночь в молитве Богу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всю ночь пребывал в молитве Богу».'
    reason: Лексическая альтернатива, более явно передающая продолженное действие конструкции ἦν διανυκτερεύων.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: случилось
  rationale: Передаёт характерный для Луки переход к новому событию; δέ здесь имеет лёгкую связующую функцию, которую по-русски нет необходимости выражать отдельным союзом.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: в те дни
  rationale: Естественное русское повествовательное выражение, отсылающее к описываемому периоду.
- source_word: ἐξελθεῖν αὐτὸν
  choice: Он вышел
  rationale: Инфинитив с винительным падежом после ἐγένετο естественно передан личной формой; «вышел» сохраняет значение движения без добавления неуказанных подробностей.
- source_word: εἰς τὸ ὄρος
  choice: на гору
  rationale: Обычное и точное русское соответствие; определённый артикль не требует здесь указательного слова.
- source_word: προσεύξασθαι
  choice: помолиться
  rationale: Совершенный вид естественно выражает цель выхода на гору, не отрицая продолжительности последующей молитвы.
- source_word: ἦν διανυκτερεύων
  choice: провёл всю ночь
  rationale: Передаёт длительность действия и значение пребывания в течение целой ночи естественным современным русским выражением.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: в молитве Богу
  rationale: Родительный τοῦ θεοῦ по смыслу обозначает адресата молитвы; русский дательный падеж ясно и естественно передаёт это отношение.
theological_decisions:
- issue: Отношение τοῦ θεοῦ к молитве Иисуса
  choice: в молитве Богу
  alternative: в Божьей молитве / в молитве Божьей
  rationale: Контекст представляет Бога адресатом молитвы, а не её обладателем или совершающим её лицом. Формулировка сохраняет прямой смысл текста, не добавляя указания «Отцу», которого в данном стихе нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской норме. Маркер сноски поставлен после той части стиха, к которой относится предлагаемая лексическая альтернатива.
