  terminology: «Гора», «помолиться», «молитва Богу» употреблены последовательно и без конфессионально окрашенных добавлений. Прописное «Он» соответствует заявленной издательской норме. Сноска привязана к заключительной конструкции и предлагает допустимый способ более явно выразить её продолженный характер.
