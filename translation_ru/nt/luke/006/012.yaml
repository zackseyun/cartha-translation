  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: вводную формулу Ἐγένετο δὲ, временное «в те дни», выход на гору с целью молитвы и продолжительное пребывание в молитве всю ночь. «В молитве Богу» корректно передаёт смысл τοῦ θεοῦ как адресата молитвы, не добавляя «Отцу» или иной богословской конкретизации.'
