  source_fidelity: 'Смысл передан верно: сохранены обращение Иисуса к оппонентам, субботний контекст и обе антитезы («делать добро/зло», «спасти/погубить жизнь»). Однако «что позволено делать ... — добро или зло» несколько смещает вопрос к выбору одного из двух вариантов, тогда как εἰ ἔξεστιν вводит прямой вопрос о допустимости действия. Формулировка с «позволено ли» точнее воспроизводит синтаксис и риторическую силу греческого текста.'
  naturalness: Предлагаемая правка естественна для современного литературного русского и яснее оформляет вопрос. «В субботу» нормативно и уместно в библейском контексте.
  terminology: «Добро или зло» точно отражает нравственную пару ἀγαθοποιῆσαι / κακοποιῆσαι. «Спасти жизнь или погубить её» адекватно передаёт ψυχήν в данном контексте и не навязывает значение «душа».
