source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: ru
  text: 'Но Иисус сказал им: «Я спрашиваю вас: позволено ли в субботу делать добро или зло, спасти жизнь или погубить её?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление и переход к ответу Иисуса в сложившейся ситуации.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Я спрашиваю вас
  rationale: Естественно передаёт прямой, вызывающий на ответ вопрос без излишней формальности.
- source_word: εἰ ἔξεστιν
  choice: что позволено
  rationale: Сохраняет смысл дозволенности по закону и обычаю; в русском вопрос с «что позволено» звучит естественнее буквального «позволено ли» при последующем выборе.
- source_word: τῷ σαββάτῳ
  choice: в субботу
  rationale: Обычное русское обозначение времени действия, сохраняющее указание на особый день.
- source_word: ἀγαθοποιῆσαι
  choice: делать добро
  rationale: Сохраняет явную нравственную антитезу с κακοποιῆσαι.
- source_word: κακοποιῆσαι
  choice: делать зло
  rationale: Прямо сохраняет этическую противоположность «добро — зло»; в контексте зло включает причинение вреда.
- source_word: ψυχὴν
  choice: жизнь
  rationale: В сочетании со «спасти» и «погубить» и в контексте исцеления обозначает человеческую жизнь, не обязательно нематериальную душу.
- source_word: σῶσαι
  choice: спасти
  rationale: Сохраняет основное значение и более широкую библейскую лексическую связь.
- source_word: ἀπολέσαι
  choice: погубить
  rationale: Передаёт сильную противоположность глаголу «спасти», не сужая значение до физического убийства.
theological_decisions:
- issue: Значение ψυχή в выражении ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: «спасти жизнь или погубить её»
  alternative: «спасти душу или погубить её»
  rationale: Контекст субботнего исцеления указывает на сохранение или погубление человеческой жизни. Такой перевод не превращает стих в специальное утверждение о составе человека, однако сохраняет силу противопоставления.
- issue: Характер противопоставления ἀγαθοποιῆσαι и κακοποιῆσαι
  choice: «делать… добро или зло»
  alternative: «делать добро или причинять вред»
  rationale: Русская пара «добро или зло» точно сохраняет этическую симметрию греческих составных глаголов; конкретный смысл причинения вреда остаётся очевидным из следующей пары «спасти… или погубить».
translation_notes:
  register: Современный литературный русский язык; речь краткая, торжественно-сдержанная и понятная. Порядок вопроса слегка перестроен ради естественного русского синтаксиса, при этом обе греческие антитезы сохранены.
