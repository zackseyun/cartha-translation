  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: ru
  text: Тому, кто бьёт тебя по щеке[a], подставь ему и другую[b]; и тому, кто забирает у тебя плащ[c], не препятствуй забрать и рубаху.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по челюсти».'
    reason: lexical_alternative
  - marker: b
    text: Подразумевается другая щека. У Луки сказано не «поверни», а «подставь, предоставь».
    reason: alternative_reading
  - marker: c
    text: Плащ — верхняя одежда (ἱμάτιον), а рубаха — одежда, которую носили под ней (χιτών).
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί σε
  choice: тому, кто бьёт тебя
  rationale: Субстантивированное причастие настоящего времени обозначает всякого человека, совершающего это действие. Такая формулировка естественна по-русски и сохраняет обобщённый характер высказывания.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: по щеке
  rationale: σιαγών может обозначать щёку или челюсть. В контексте удара «по щеке» — естественный русский эквивалент, не исключающий анатомического значения «по челюсти».
- source_word: πάρεχε
  choice: предоставь
  rationale: παρέχω означает «предоставлять, давать, предлагать». Выбор сохраняет особую формулировку Луки и не подменяет её привычным выражением «подставь другую щёку», восходящим к иной глагольной конструкции.
- source_word: καὶ τὴν ἄλλην
  choice: и другую
  rationale: Подразумевается другая щека; союз καί передаёт добавочное значение «и, также».
- source_word: ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον
  choice: тому, кто забирает у тебя плащ
  rationale: αἴρω здесь означает унести или забрать, а ἱμάτιον — верхнюю одежду. Дательный «тому» естественно связан по-русски с последующим запретом препятствовать.
- source_word: καὶ τὸν χιτῶνα
  choice: взять и рубаху
  rationale: χιτών — одежда, которую носили под верхним плащом. «Рубаха» доступно передаёт функцию предмета одежды, а подразумеваемый инфинитив «взять» делает русскую фразу грамматически полной.
- source_word: μὴ κωλύσῃς
  choice: не препятствуй
  rationale: κωλύω означает «мешать, препятствовать, не позволять». Прямой эквивалент сохраняет силу запретительного повеления и не добавляет мотивировки.
theological_decisions:
- issue: Следует ли согласовать формулировку Луки с более привычным выражением «подставь другую щёку»
  choice: 'Сохранить особую формулировку Луки: «предоставь и другую»'
  alternative: «подставь и другую щёку»
  rationale: В тексте Луки стоит πάρεχε («предоставь, предложи»), а не глагол со значением «поверни». Перевод не должен незаметно заменять лексику Луки формулировкой параллельного места.
- issue: Следует ли смягчить или истолковать безусловно звучащие повеления
  choice: Передать повеления прямо, без поясняющих ограничений
  alternative: Добавить в основной текст оговорки о непротивлении, гиперболе или конкретных допустимых исключениях
  rationale: Греческий текст содержит прямые повеления во втором лице. Перевод сохраняет их силу и богословское напряжение, не разрешая дискуссионные вопросы толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. «Предоставь» намеренно сохраняет необычность греческого πάρεχε, а «плащ» и «рубаха» доступно передают различие между верхней и внутренней одеждой без излишней архаизации.
