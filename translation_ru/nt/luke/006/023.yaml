  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: ru
  text: 'Радуйтесь в тот день и прыгайте от радости[a], ибо вот: велика ваша награда на небесах. Ведь так же поступали их предки с пророками[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подпрыгните от радости»; глагол обозначает бурное телесное проявление радости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ведь то же делали их отцы пророкам»; смысл в том, что их предки так же обращались с пророками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: Радуйтесь
  rationale: Аорист повелительного наклонения во множественном числе выражает прямой призыв к радости; «радуйтесь» естественно и достойно звучит по-русски.
- source_word: σκιρτήσατε
  choice: ликуйте
  rationale: Глагол буквально обозначает прыжок или подскакивание как бурное проявление радости. «Ликуйте» естественно передаёт эту радость, а буквальный телесный образ отмечен в сноске.
- source_word: ἰδοὺ
  choice: ведь вот
  rationale: «Вот» сохраняет функцию привлечения внимания, а «ведь» вводит основание предшествующего призыва, соответствуя γάρ.
- source_word: μισθὸς
  choice: награда
  rationale: В данном контексте речь идёт о положительном воздаянии, поэтому «награда» яснее, чем экономически окрашенная «плата».
- source_word: πολὺς
  choice: велика
  rationale: «Велика награда» — естественное русское сочетание, сохраняющее усилительный смысл греческого прилагательного.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небесах
  rationale: Устойчивое современное русское выражение для небесной сферы; оно не добавляет уточнения о характере или времени получения награды.
- source_word: κατὰ τὰ αὐτά
  choice: так же
  rationale: Передаёт идиоматическое значение «таким же образом», связывая гонения на учеников с обращением предков гонителей с пророками.
- source_word: ἐποίουν
  choice: поступали ... с
  rationale: Имперфект допускает обычное или повторявшееся действие; русская конструкция «поступали с пророками» естественно передаёт сжатое ποιέω с дательным падежом, не уточняя сверх текста конкретный вид враждебного обращения.
- source_word: οἱ πατέρες αὐτῶν
  choice: их предки
  rationale: В контексте πατέρες обозначает прежние поколения, а не только непосредственных отцов; «предки» ясно передаёт этот смысл современному читателю.
theological_decisions:
- issue: Характер и местонахождение обещанного воздаяния
  choice: велика ваша награда на небесах
  alternative: велика ваша награда у Бога на небесах
  rationale: Перевод сохраняет указанную текстом небесную сферу награды, не добавляя отсутствующего в греческом тексте пояснения «у Бога» и не определяя подробнее природу воздаяния.
- issue: Кого обозначают «их отцы»
  choice: их предки
  alternative: их отцы
  rationale: В данном историко-пророческом сопоставлении имеются в виду предшествующие поколения противников; «предки» передаёт референт ясно, не снимая обвинительной связи между поколениями.
- issue: Что именно предки делали пророкам
  choice: так же поступали их предки с пророками
  alternative: то же делали их отцы пророкам
  rationale: Греческая фраза с ποιέω семантически сжата и опирается на контекст предшествующего гонения. Перевод сохраняет это общее сопоставление и не вводит более конкретного действия, чем дано в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён для ясности, но причинные связи и сопоставление с пророками сохранены. Все маркеры сносок присутствуют в основном тексте.
