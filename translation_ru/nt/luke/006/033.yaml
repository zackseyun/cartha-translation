  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: ru
  text: И если вы делаете добро тем, кто делает вам добро, какая вам за это заслуга?[a] Ведь и грешники делают то же самое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какая вам за это благодарность?» Греческое слово может означать «благодать», «благосклонность», «благодарность» или «заслугу»; здесь оно относится к особому признанию или заслуге за ответное добро.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: делаете добро
  rationale: Прямо передаёт значение «делать добро, приносить пользу» и сохраняет повтор с причастием далее.
- source_word: τοὺς ἀγαθοποιοῦντας ὑμᾶς
  choice: тем, кто делает добро вам
  rationale: Естественная русская передача причастной конструкции с сохранением лексического повтора греческого глагола.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: какая вам за это благодарность?
  rationale: В данном этическом контексте χάρις обозначает признательность или одобрение, а не спасительную благодать. «За это» естественно выражает отношение оценки к поступку.
- source_word: ἁμαρτωλοὶ
  choice: грешники
  rationale: Прямая и традиционно понятная передача социально-нравственной категории в Евангелии от Луки.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: делают то же самое
  rationale: Точная и естественная передача греческого выражения.
- source_word: καὶ
  choice: И / Ведь и
  rationale: Первое καί связывает стих с рядом параллельных изречений; второе подчёркивает, что так поступают также и грешники, а «ведь» естественно передаёт обосновывающую функцию фразы.
theological_decisions:
- issue: Значение χάρις в контексте нравственного наставления
  choice: благодарность или признательность за поступок
  alternative: благодать; заслуга; похвала
  rationale: Риторический вопрос касается того, заслуживает ли взаимное добро особой признательности. Перевод «благодать» мог бы без основания придать слову здесь сотериологический смысл; однако многозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Повтор «делаете добро — делает добро» сохранён как значимый элемент оригинала. Частица «Ведь и» естественно вводит основание риторического вопроса.
