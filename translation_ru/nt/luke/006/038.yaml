reference: Luke 6:38
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: ru
  text: Давайте — и дано будет вам. Хорошую меру — утрамбованную, утрясённую, переполненную — дадут вам в складку вашей одежды[a]. Ведь какой мерой вы мерите, такой отмерят и вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в вашу пазуху». Имеется в виду складка просторной одежды, которую использовали как вместилище для отмеренного товара.'
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Давайте
  rationale: Настоящее повелительное наклонение во множественном числе передано общим, продолжающим действовать призывом без излишне явного добавления «продолжайте».
- source_word: δοθήσεται ὑμῖν
  choice: дано будет вам
  rationale: Сохранены будущее время и страдательный залог; деятель, как и в греческом тексте, не назван.
- source_word: μέτρον καλὸν
  choice: хорошую меру
  rationale: Сохраняется образ отмеренного количества. «Щедрую» звучало бы естественно, но заранее истолковывало бы καλόν как щедрость.
- source_word: πεπιεσμένον
  choice: утрамбованную
  rationale: Передаёт уплотнение содержимого мерного сосуда, чтобы в него вместилось больше.
- source_word: σεσαλευμένον
  choice: утрясённую
  rationale: Передаёт встряхивание, благодаря которому содержимое оседает и уплотняется.
- source_word: ὑπερεκχυννόμενον
  choice: переливающуюся через край
  rationale: Живо передаёт продолжающееся переполнение и высыпание содержимого за края меры; переносное «переливаться» в русском применимо и к сыпучему содержимому.
- source_word: δώσουσιν
  choice: дадут
  rationale: Сохранена неопределённо-личная форма третьего лица множественного числа, не называющая деятеля.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: вам в подол
  rationale: «Подол» кратко и наглядно обозначает часть одежды, которую можно было использовать для принятия и переноски отмеренного товара; культурная подробность пояснена в сноске.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Ведь какой мерой вы мерите
  rationale: Сохраняются образ меры, относительная конструкция и обобщающий характер изречения.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: такой отмерят и вам
  rationale: Неопределённо-личная русская конструкция естественно передаёт неназванного деятеля, а «и вам» выражает ответность, заложенную в ἀντι-.
theological_decisions:
- issue: Ограничивать ли призыв материальным подаянием
  choice: Сохранить широкий смысл давания и ответной меры
  alternative: Передать стих как обещание, относящееся исключительно к деньгам или милостыне
  rationale: Греческий текст не называет ни денег, ни милостыни, а ближайший контекст охватывает милосердие, отказ от осуждения и прощение. Поэтому перевод не сужает смысл и не вводит идею гарантированного материального воздаяния.
- issue: Кто именно даёт в ответ
  choice: Не называть деятеля
  alternative: Прямо назвать Бога или людей
  rationale: В δοθήσεται деятель не выражен, а δώσουσιν имеет неопределённое «они». Перевод сохраняет эту напряжённость и не отождествляет неназванного деятеля исключительно с Богом либо людьми.
translation_notes:
  register: Современный литературный русский с умеренно торжественным ритмом. Повтор «мера — мерите — отмерят» намеренно сохраняет словесную связь греческого текста. Формы «утрамбованную, утрясённую» делают бытовой образ наполненной меры понятным без добавления конкретного товара.
