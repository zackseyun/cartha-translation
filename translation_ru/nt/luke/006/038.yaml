review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл и образ меры переданы верно: сохранены повеление, будущее пассивное «дано будет», неопределённый деятель во втором предложении и ответная мера. Однако «подол» означает нижний край одежды и не соответствует κόλπος — складке одежды у груди/на груди, служившей вместилищем. «Переливающаяся через край» менее естественно для подразумеваемых сыпучих товаров; «переполненную» точнее и нейтральнее передаёт образ избытка, выливающегося за край.'
  naturalness: Фраза в целом литературна и ясна. Замена «в подол» на «в складку вашей одежды» устраняет неверный бытовой образ. Цепочка «утрамбованную, утрясённую, переполненную» естественна в контексте мерной ёмкости.
  terminology: «Мера — мерите — отмерят» удачно сохраняет лексическую связь μέτρον / μετρεῖτε / ἀντιμετρηθήσεται. «Давайте» допустимо для настоящего императива и не навязывает значение постоянного действия. Деятель не называется, как и в греческом.
  issues:
