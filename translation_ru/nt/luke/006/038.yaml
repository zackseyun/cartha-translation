    issue: «В подол» для εἰς τὸν κόλπον ὑμῶν
    rationale: «Подол» — нижний край одежды; κόλπος здесь обозначает пазуху или складку свободной верхней одежды, куда принимали отмеренный товар. Нынешний вариант меняет конкретный культурный образ.
  - severity: low
    issue: «Переливающуюся через край»
    rationale: При образе отмериваемого товара русское «переливаться» прежде всего относится к жидкости. «Переполненную» сохраняет избыточность ὑπερεκχυννόμενον без неестественной сочетаемости.
