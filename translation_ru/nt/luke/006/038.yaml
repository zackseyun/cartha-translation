- from: Давайте — и дано будет вам. Хорошую меру — утрамбованную, утрясённую, переливающуюся через край — дадут вам в подол[a]. Ведь какой мерой вы мерите, такой отмерят и вам[b].
  to: Давайте — и дано будет вам. Хорошую меру — утрамбованную, утрясённую, переполненную — дадут вам в складку вашей одежды[a]. Ведь какой мерой вы мерите, такой отмерят и вам.
  rationale: 'Исправлены два безопасных места: κόλπος передан как складка одежды, а причастие ὑπερεκχυννόμενον — нейтральным для русской меры словом «переполненную». Неопределённость деятеля и широкий, не ограниченный деньгами смысл высказывания сохранены. Сноска b удалена как не обязательная: ответность уже ясно выражена в основном тексте словом «такой».'
