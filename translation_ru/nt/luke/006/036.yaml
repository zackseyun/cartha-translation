  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: ru
  text: Будьте милосердны[a], как милосерден ваш Отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сострадательны». Греческое прилагательное описывает того, кто, движимый состраданием, проявляет милость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Будьте
  rationale: Форма настоящего времени повелительного наклонения выражает продолжающийся призыв проявлять это качество. «Будьте» естественно передаёт его по-русски; буквальное «становитесь» здесь звучало бы менее естественно и могло бы неоправданно подчеркнуть процесс изменения.
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: милосердны / милосерден
  rationale: Прилагательное οἰκτίρμων обозначает того, кто исполнен сострадания и проявляет милость. Повтор одного русского корня сохраняет лексическую связь между призывом к ученикам и характеристикой Отца.
- source_word: καθὼς
  choice: как
  rationale: Союз вводит сопоставление и представляет милосердие Отца как образец поведения. Русское «как» ясно и естественно передаёт это значение без добавления причинного оттенка.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ваш Отец
  rationale: Перевод сохраняет прямую формулировку греческого текста и не добавляет отсутствующее в нём определение «Небесный».
theological_decisions:
- issue: Связь повеления с характером Отца
  choice: 'Милосердие Отца представлено как образец: «как милосерден ваш Отец».'
  alternative: 'Передать связь причинно: «потому что ваш Отец милосерден».'
  rationale: καθώς имеет здесь сравнительное значение. Такой перевод сохраняет мотив подражания Отцу и не добавляет отсутствующего в тексте причинного объяснения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Порядок слов во второй части естественен для русского языка и сохраняет смысловое сопоставление.
