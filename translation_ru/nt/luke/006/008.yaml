base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: ru
  text: 'Но Он знал их мысли[a] и сказал мужчине, у которого была иссохшая рука[b]: «Поднимись и стань посреди[c]». Тот поднялся и встал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их рассуждения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «усохшая рука».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в середину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: знал
  rationale: Форма οἶδα здесь имеет обычное значение знания; «знал» естественно передаёт повествовательное утверждение, не уточняя способ этого знания.
- source_word: διαλογισμοὺς
  choice: помыслы
  rationale: Слово обозначает мысли, рассуждения или внутренние размышления. «Помыслы» сохраняет оттенок внутреннего рассуждения и уместно в современном литературном библейском повествовании.
- source_word: ἀνδρὶ
  choice: мужчине
  rationale: ἀνήρ обозначает взрослого мужчину; перевод сохраняет указание на пол.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: иссохшая рука
  rationale: ξηρός применительно к части тела означает иссохшую, усохшую или атрофированную конечность. «Иссохшая рука» точно и естественно передаёт образ.
- source_word: Ἔγειρε
  choice: встань
  rationale: Первое повеление велит человеку подняться со своего места; оно передано отдельно от следующего στῆθι.
- source_word: στῆθι εἰς τὸ μέσον
  choice: выйди на середину
  rationale: По-русски это естественно выражает движение и последующее положение посреди собравшихся, сохраняя публичный характер действия.
- source_word: ἀναστὰς ἔστη
  choice: тот поднялся и встал там
  rationale: Перевод сохраняет последовательность двух действий, выраженных причастием и личной формой глагола, а «там» естественно указывает на названное место.
theological_decisions:
- issue: Знание Иисусом внутренних мыслей других людей
  choice: 'Передать как прямое повествовательное утверждение: «Он знал их помыслы».'
  alternative: «Он распознал их намерения» или «Он сверхъестественно знал их рассуждения».
  rationale: Греческий текст утверждает знание, но не объясняет его механизм; перевод не должен добавлять богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Заглавное «Он» применительно к Иисусу соответствует распространённой русской библейской издательской практике. Реплика звучит ясно и непосредственно; лексическая неоднозначность διαλογισμοί и образность ξηρός отмечены в сносках.
