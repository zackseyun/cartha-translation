  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: τινὲς («некоторые»), контрастивное δέ («но»), название группы («фарисеи»), аорист εἶπαν («сказали»), упрекающий вопрос Τί ποιεῖτε («Почему вы делаете»), запретительный смысл οὐκ ἔξεστιν («чего нельзя делать») и идиоматическое τοῖς σάββασιν («в субботу»). Единственное число в русском естественно и соответствует конкретной ситуации; оно не утрачивает смысла греческого идиоматического множественного числа.'
