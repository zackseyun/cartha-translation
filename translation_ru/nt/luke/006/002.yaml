  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: ru
  text: 'Но некоторые из фарисеев сказали: «Почему вы делаете то, чего нельзя делать в субботу?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: некоторые
  rationale: Неопределённое множественное число указывает лишь на часть фарисеев, а не на всю группу.
- source_word: δὲ
  choice: но
  rationale: Передаёт лёгкое противопоставление и переход к возражению фарисеев.
- source_word: Φαρισαίων
  choice: фарисеев
  rationale: Общепринятое русское наименование этой иудейской религиозной группы.
- source_word: εἶπαν
  choice: сказали
  rationale: Аорист просто представляет состоявшееся речевое действие.
- source_word: Τί ποιεῖτε
  choice: Почему вы делаете
  rationale: Хотя τί буквально означает «что», в вопросе-упрёке данное сочетание естественно передаётся по-русски как «почему вы делаете».
- source_word: ὃ οὐκ ἔξεστιν
  choice: то, чего нельзя делать
  rationale: Передаёт запретительный смысл ἔξεστιν в контексте спора о допустимом поведении, сохраняя естественный русский синтаксис.
- source_word: τοῖς σάββασιν
  choice: в субботу
  rationale: Формально греческое выражение стоит во множественном числе, но это обычное идиоматическое обозначение дня субботы; русский язык здесь естественно требует единственного числа.
theological_decisions:
- issue: Передача выражения τοῖς σάββασιν
  choice: в субботу
  alternative: по субботам
  rationale: Греческое множественное число идиоматично обозначает субботний день в данной конкретной сцене. Единственное число по-русски ясно связывает вопрос с происходящим эпизодом и не создаёт впечатления о многократно повторяемом поступке.
- issue: Характер запрета в οὐκ ἔξεστιν
  choice: нельзя делать
  alternative: не позволено законом
  rationale: Исходное выражение означает отсутствие дозволения, но прямо не называет ни Моисеев закон, ни человеческое предание. Перевод не уточняет источник запрета и тем самым сохраняет богословское напряжение повествования.
translation_notes:
  register: Современный литературный русский язык; речь краткая, естественная и достойная. Синтаксис вопроса передаёт упрёк без добавочного толкования. Слово «суббота» употреблено в принятом библейском значении иудейского дня покоя.
