lexical_decisions:
- source_word: Ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующим словам и естественно вводит прямое обращение.
- source_word: ὑμῖν λέγω
  choice: вам… я говорю
  rationale: Сохраняет вынесенное вперёд «вам» и прямую формулу речи; местоимение «я» передаёт выраженное в греческом глаголе лицо без искусственной торжественности.
- source_word: τοῖς ἀκούουσιν
  choice: тем, кто слушает
  rationale: Настоящее причастие обозначает слушающих в данный момент; глагол «слушает» естественно передаёт активное внимание, не сводя смысл лишь к физической способности слышать.
- source_word: ἀγαπᾶτε
  choice: любите
  rationale: Прямо передаёт повелительное наклонение и обычное значение ἀγαπάω без поясняющего перефразирования.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: своих врагов
  rationale: Возвратно-притяжательное «своих» — естественный русский эквивалент при обращённом к слушателям повелении.
- source_word: καλῶς ποιεῖτε
  choice: делайте добро
  rationale: Естественный русский оборот, точно сохраняющий деятельный и нравственный смысл выражения.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: тем, кто ненавидит вас
  rationale: Передаёт дательный объект и сильное, не смягчённое значение μισέω.
theological_decisions:
- issue: Этические повеления по отношению к противникам
  choice: Передать как прямые и ничем не ограниченные в тексте повеления
  alternative: Ограничить смысл личными врагами либо представить слова как риторическое преувеличение
  rationale: В греческом тексте стоят прямые повеления во втором лице множественного числа без явного ограничения; перевод сохраняет их радикальную этическую силу и не решает толковательные споры за читателя.
