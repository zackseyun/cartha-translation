  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: ru
  text: Блаженны вы, голодные ныне[a], потому что насытитесь. Блаженны вы, плачущие ныне, потому что будете смеяться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Блаженны голодные ныне… Блаженны плачущие ныне». В греческом тексте употреблены причастия с артиклем, однако глаголы во втором лице и ближайший контекст поддерживают прямое обращение.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Сохраняет традиционную форму изречения-блаженства и его богословскую весомость; «счастливы» может звучать слишком субъективно.
- source_word: οἱ πεινῶντες
  choice: вы, голодные
  rationale: Артикль с причастием буквально обозначает «голодных», однако формы глаголов во втором лице и ближайший контекст указывают на прямое обращение. Краткая субстантивированная форма естественна по-русски.
- source_word: νῦν
  choice: ныне
  rationale: Передаёт временное противопоставление настоящего лишения будущей перемене; в форме блаженства «ныне» звучит достойно и понятно.
- source_word: χορτασθήσεσθε
  choice: насытитесь
  rationale: Сохраняет конкретный образ утолённого голода и одновременно допускает более широкий смысл полного удовлетворения, не определяя характер исполнения.
- source_word: οἱ κλαίοντες
  choice: вы, плачущие
  rationale: Передаёт причастие настоящего времени как продолжающееся состояние и, благодаря «вы», отражает прямое обращение, выраженное последующим глаголом второго лица.
- source_word: γελάσετε
  choice: будете смеяться
  rationale: Прямо сохраняет яркий образ будущей перемены; «возрадуетесь» было бы истолковывающим обобщением.
theological_decisions:
- issue: Прямое обращение или обобщённая форма блаженства
  choice: «вы, голодные… вы, плачущие»
  alternative: «голодные… плачущие» или «те, кто голоден… те, кто плачет»
  rationale: Хотя в греческом стоят субстантивированные причастия с артиклем, сказуемые имеют форму второго лица множественного числа, а контекст — прямое обращение к ученикам.
- issue: Характер обещанной перемены
  choice: Сохранить конкретные образы «насытитесь» и «будете смеяться»
  alternative: Уточнить как духовное насыщение или эсхатологическую радость
  rationale: Стих не устанавливает здесь ни способ, ни время исполнения обещания, поэтому перевод не должен снимать эту богословскую открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Блаженны» и «ныне» сохраняют достоинство жанра, а синтаксис остаётся простым и понятным. Вторая английская сноска была по смыслу связана с χορτασθήσεσθε, поэтому её лексическая альтернатива учтена в решении; отдельная сноска не требуется, поскольку русский глагол «насытиться» естественно охватывает конкретное насыщение и удовлетворение.
