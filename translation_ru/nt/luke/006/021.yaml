  source_fidelity: 'Текст точно передаёт греческий оригинал: прямое обращение «вы» обоснованно согласовано с формами будущего времени второго лица множественного числа (χορτασθήσεσθε, γελάσετε), а субстантивированные причастия сохранены формами «голодные» и «плачущие». «Ныне» передаёт νῦν в обеих частях и сохраняет временное противопоставление. «Насытитесь» точно передаёт конкретный образ χορτασθήσεσθε, а «будете смеяться» — прямое значение γελάσετε без истолковывающей подмены.'
