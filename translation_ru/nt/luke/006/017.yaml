  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: ru
  text: Спустившись вместе с ними, Он остановился на ровном месте[a]. Там было множество Его учеников и великое множество народа со всей Иудеи, из Иерусалима и с побережья Тира и Сидона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на равнине». Буквально: «на ровном месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: Спустившись
  rationale: Аористное причастие передаёт движение вниз, предшествующее основному действию; деепричастие естественно выражает эту последовательность по-русски.
- source_word: ἔστη
  choice: Он остановился
  rationale: В контексте движения форма ἵστημι обозначает, что Иисус остановился и занял место; это естественнее современного русского «встал», которое могло бы подразумевать вставание из сидячего положения.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: на ровном месте
  rationale: Передаёт буквально выраженные значения τόπος («место») и πεδινός («ровный, плоский»), не уточняя без необходимости, была ли это обширная равнина.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: множество Его учеников
  rationale: Передаёт большую группу, состоявшую из учеников Иисуса; русское «множество» здесь звучит естественно и сохраняет отличие от последующего более усиленного πλῆθος πολὺ.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: великое множество народа
  rationale: Сохраняет усиленное указание на многочисленность и отличает более широкий народ от учеников.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: со всей Иудеи
  rationale: Естественно передаёт охват всей области.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: приморских окрестностей Тира и Сидона
  rationale: παράλιος указывает на прибрежную территорию; «окрестности» ясно обозначает область, связанную с двумя городами, а не только сами города.
theological_decisions:
- issue: Топографическое описание места и его соотношение с изложением проповеди у Матфея
  choice: на ровном месте
  alternative: на равнине
  rationale: Перевод сохраняет лексическую широту греческого выражения и не гармонизирует повествования, но также не создаёт между ними искусственного противоречия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка разделён для ясности, поскольку в греческом после основного глагола следуют эллиптические именные группы; «Там было» естественно восполняет подразумеваемое присутствие толпы. Местоимение «Он» и притяжательное «Его» написаны с прописной буквы согласно распространённой русской библейской издательской норме.
