  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: ru
  text: Но любите своих врагов, делайте добро и давайте взаймы, ничего не ожидая взамен[a]. И велика будет ваша награда, и вы будете сынами Всевышнего[b], потому что Он добр к неблагодарным и злым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный, хотя менее вероятный перевод: «ни в ком не отчаиваясь» или «никогда не теряя надежды». Греческое выражение μηδὲν ἀπελπίζοντες трудно для истолкования; в данном контексте оно понято как отсутствие ожидания возврата или ответной выгоды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынами». Греческое слово стоит в мужском роде и во множественном числе, но здесь может употребляться в представительном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующей мысли и естественно звучит в современном русском языке.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: любите своих врагов
  rationale: Прямо сохраняет повеление и резкость выражения, не смягчая значение слова «враги».
- source_word: ἀγαθοποιεῖτε
  choice: делайте добро
  rationale: Естественное русское выражение, передающее деятельное благодеяние.
- source_word: δανίζετε
  choice: давайте взаймы
  rationale: Точно передаёт значение глагола, не добавляя отсутствующего в греческом тексте уточнения о деньгах.
- source_word: μηδὲν ἀπελπίζοντες
  choice: ничего не ожидая взамен
  rationale: В контексте займа наиболее вероятно означает отказ от ожидания возврата или ответной выгоды; неоднозначность отмечена в сноске.
- source_word: μισθὸς ὑμῶν πολύς
  choice: велика будет ваша награда
  rationale: «Награда» уместнее коммерческого «плата» в этическом и эсхатологическом контексте, а перестановка слов естественна для русского синтаксиса.
- source_word: υἱοὶ Ὑψίστου
  choice: сынами Всевышнего
  rationale: Сохраняет мужской род и множественное число греческого υἱοί, а также традиционное и понятное русское наименование Бога.
- source_word: χρηστός
  choice: добр
  rationale: Передаёт благожелательность и благость Бога по отношению к недостойным; кратко и естественно сочетается с «к».
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: неблагодарным и злым
  rationale: Прямой и ясный перевод двух субстантивированных прилагательных без смягчения нравственной оценки.
theological_decisions:
- issue: Передача υἱοὶ Ὑψίστου с сохранением грамматического мужского рода
  choice: сынами Всевышнего
  alternative: детьми Всевышнего
  rationale: В исходном тексте стоит мужское множественное υἱοί. Основной текст сохраняет эту форму, а возможный представительный смысл поясняется в сноске.
- issue: Толкование μηδὲν ἀπελπίζοντες в контексте займа
  choice: ничего не ожидая взамен
  alternative: ни в ком не отчаиваясь; никогда не теряя надежды
  rationale: Контекст противопоставляет бескорыстное благодеяние взаимности и возврату, поэтому значение ожидания возврата наиболее вероятно. Реальная лексическая неоднозначность не устраняется и вынесена в сноску.
- issue: Связь καὶ ἔσται с обещанием награды
  choice: Тогда велика будет ваша награда
  alternative: и велика будет ваша награда
  rationale: «Тогда» естественно выражает следствие в русском языке, не превращая обещание в механическую оплату заслуг.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан плавным и понятным; ключевые повеления сохранены краткими и прямыми. Местоимение «Он» написано с прописной буквы по распространённой русской библейской традиции.
