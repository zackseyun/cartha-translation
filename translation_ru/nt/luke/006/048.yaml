  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: ru
  text: 'Он подобен человеку, строящему дом: тот выкопал глубокую яму и заложил основание на скале. Когда же случилось наводнение, река хлынула на тот дом, но не смогла поколебать его, потому что он был хорошо построен.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «потому что он был основан на скале».'
    reason: textual_variant
lexical_decisions:
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: Он подобен человеку
  rationale: Естественная для современного литературного русского формула сравнения; «человеку» передаёт ἀνθρώπῳ без ненужного уточнения пола, сохраняя образ одного представителя.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: который, строя дом
  rationale: Причастный оборот передан естественной русской конструкцией, ясно связывающей последующие действия со строительством дома.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: копал, углубляясь
  rationale: Сохраняет два взаимосвязанных действия греческого текста — копание и углубление — и звучит естественнее буквального «копал и углубил» без явно названного дополнения.
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: заложил основание на скале
  rationale: «Заложил основание» — обычное русское строительное выражение; «на скале» сохраняет конкретный образ πέτρα и определённый артикль.
- source_word: πλημμύρης δὲ γενομένης
  choice: Когда же случилось наводнение
  rationale: Передаёт временное значение родительного самостоятельного оборота и сохраняет переходное δέ посредством «же».
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: река с силой обрушилась на тот дом
  rationale: «С силой обрушилась» выражает резкий, мощный удар, заключённый в προσρήγνυμι; «тот дом» передаёт указательное ἐκείνῃ.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: не смогла поколебать его
  rationale: Точно передаёт невозможность расшатать или дестабилизировать дом; местоимение согласовано с русским словом «дом».
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: потому что он был хорошо построен
  rationale: Передаёт причинное значение διά с субстантивированным инфинитивом и сохраняет пассивную конструкцию без добавления толкования.
theological_decisions:
- issue: Представительный характер ἀνθρώπῳ в сравнении
  choice: человеку
  alternative: мужчине
  rationale: Греческое ἄνθρωπος обозначает человека и в данном сравнении представляет отдельного строителя; русское «человек» естественно сохраняет как единичный образ, так и его обобщающий смысл, не внося отсутствующего в лексеме акцента на пол.
- issue: Основание устойчивости дома
  choice: потому что он был хорошо построен
  alternative: потому что был основан на скале
  rationale: Основной текст SBLGNT прямо связывает устойчивость с тем, что дом был хорошо построен. Вариант рукописей об основании на скале вынесен в примечание, а не смешан с принятым текстом.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повествовательным ритмом. Строительная образность сохранена без архаизмов; усиление удара реки выражено идиоматически.
