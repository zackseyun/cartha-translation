review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: сохранены сравнение, глубокая подготовка основания на скале, наводнение, удар реки, невозможность поколебать дом и причинное объяснение. Однако «копал, углубляясь» неудачно передаёт пару ἔσκαψεν καὶ ἐβάθυνεν: по-русски оборот может описывать самого строителя, а не углубление выемки. Более ясная конструкция передаёт результат усиленной разработки грунта без добавления толкования.'
  naturalness: Текст в целом литературный, но «который, строя дом, копал, углубляясь» синтаксически тяжеловесен и не вполне естественен. «Выкопал глубокую яму» ясно и современно выражает требуемое углубление. «Река хлынула на тот дом» естественно передаёт разрушительный напор в контексте наводнения.
  terminology: «Человек» точно соответствует ἀνθρώπῳ и не требует искусственного уточнения пола. «Основание», «скала» и «поколебать» удачны. Примечание корректно отделяет рукописный вариант от текста SBLGNT; формулировка варианта сохранена без догматического истолкования.
