  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: ru
  text: И если вы любите тех, кто любит вас, что в этом похвального для вас?[a] Ведь и грешники любят тех, кто любит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какая вам за это благодарность?»; буквально возможно также: «какая вам благодать?» Греческое слово χάρις может означать благодать, благосклонность, благодарность или одобрение; здесь речь о том, что заслуживает похвалы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: любите / любит / любят
  rationale: Единообразно передано глаголом «любить», чтобы сохранить троекратный лексический повтор и риторическую силу греческого текста.
- source_word: ποία
  choice: что
  rationale: В сочетании с χάρις естественный русский вопрос «что в этом…?» передаёт вопрос о ценности или похвальности такого поведения без излишней буквальности.
- source_word: χάρις
  choice: похвального
  rationale: В данном контексте слово обозначает то, что заслуживает одобрения или признания, а не прежде всего богословское понятие благодати. Субстантивированное «что… похвального» звучит естественно по-русски.
- source_word: ἁμαρτωλοὶ
  choice: грешники
  rationale: Субстантивированное прилагательное естественно и традиционно передаётся словом «грешники», сохраняя нравственную категорию исходного текста.
- source_word: καὶ γὰρ
  choice: ведь и
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «и» — усилительно-включительное значение καί.
- source_word: ὑμῖν
  choice: для вас
  rationale: Такой дательный естественно сочетается по-русски с выражением «что в этом похвального», сохраняя отнесённость оценки к слушателям.
theological_decisions:
- issue: Значение χάρις в изречении Иисуса
  choice: похвальность, то, что заслуживает одобрения
  alternative: благодать; благодарность; заслуга
  rationale: Ближайший контекст противопоставляет обычную взаимность отличительному поведению учеников. Перевод «благодать» мог бы необоснованно выдвинуть на первый план сотериологический смысл; примечание сохраняет подлинную лексическую широту слова.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, с сохранением риторического вопроса, троекратного повтора «любить» и смысловой неоднозначности χάρις в примечании.
