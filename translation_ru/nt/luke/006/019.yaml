  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: ru
  text: И вся толпа старалась прикоснуться к Нему, потому что от Него исходила сила и исцеляла всех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: весь народ
  rationale: Сочетание πᾶς с собирательным ὄχλος обозначает всю собравшуюся массу людей. «Весь народ» естественно для современного русского библейского повествования; «вся толпа» возможно, но звучит несколько более обезличенно.
- source_word: ἐζήτουν
  choice: старался
  rationale: Имперфект передаёт продолжавшиеся или повторявшиеся попытки. Собирательное подлежащее «народ» требует единственного числа; «старался» естественно выражает стремление реально прикоснуться, не превращая его лишь в поиск.
- source_word: ἅπτεσθαι
  choice: прикоснуться
  rationale: В данном контексте ἅπτομαι означает физически коснуться человека. Совершенный вид в инфинитиве естественен по-русски после «старался» и обозначает достижение контакта.
- source_word: δύναμις
  choice: сила
  rationale: «Сила» прямо и без богословского расширения передаёт δύναμις как действенную силу, совершающую исцеление. Добавление «чудотворная» было бы контекстуальным пояснением, отсутствующим в греческом тексте.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: от Него исходила
  rationale: Оборот сохраняет представление о продолжающемся исхождении силы от Иисуса и звучит естественно и достойно по-русски. Направление движения достаточно выражено предлогом «от» и глаголом «исходила».
- source_word: ἰᾶτο
  choice: исцеляла
  rationale: Имперфект передаёт продолжавшееся действие. По ближайшей синтаксической связи подлежащим выступает «сила», поэтому русское единственное число женского рода точно и ясно передаёт конструкцию.
- source_word: πάντας
  choice: всех
  rationale: Форма мужского рода множественного числа относится ко всем людям, получавшим исцеление. Русское «всех» сохраняет полноту утверждения, не добавляя явного местоименного объекта.
theological_decisions:
- issue: Природа силы, исходящей от Иисуса
  choice: «от Него исходила сила» без дополнительного определения
  alternative: «от Него исходила чудотворная сила»
  rationale: Текст прямо представляет Иисуса источником действенной исцеляющей силы, но не определяет её отдельным прилагательным. Перевод сохраняет утверждение и его богословскую напряжённость без привнесённого толкования.
- issue: Синтаксический деятель исцеления
  choice: «сила… исцеляла всех»
  alternative: «Он исцелял всех»
  rationale: 'Греческое ἰᾶτο формально может быть понято в связи с ближайшим подлежащим δύναμις, и именно это чтение естественно продолжает фразу: сила исходила и исцеляла. Замена подлежащего на Иисуса упростила бы образ и внесла бы синтаксическую конкретизацию, которой текст прямо не требует.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Нему/Него» написано с прописной буквы согласно распространённой русской издательской традиции. Стих передан одним плавным предложением; сносок не требуется, поскольку существенная лексическая альтернатива «выходила» по-русски менее естественна, а «исходила» точно охватывает значение.
