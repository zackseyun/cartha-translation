id: LUK.6.16
reference: Luke 6:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: ru
  text: и Иуду, сына Иакова[a], и Иуду Искариота, который стал предателем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иуду, брата Иакова»; по-гречески буквально: «Иуду Иакова».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Иуду, сына Иакова
  rationale: Родительный падеж Ἰακώβου обозначает неуточнённую родственную связь. В перечне апостолов по-русски естественно восполнить её словом «сын»; это наиболее вероятное понимание, тогда как неоднозначность отражена в сноске.
- source_word: Ἰσκαριὼθ
  choice: Иуду Искариота
  rationale: Имя-прозвище передано принятой в русском библейском языке транслитерацией; падеж согласован с греческим винительным и русским синтаксисом.
- source_word: ὃς ἐγένετο
  choice: который стал
  rationale: Так сохраняется динамическое значение γίνομαι — «стать, сделаться», а не статическое «был».
- source_word: προδότης
  choice: предателем
  rationale: «Предатель» точно и естественно передаёт существительное, обозначающее человека, совершившего предательство.
- source_word: καὶ
  choice: и
  rationale: Повторяющийся союз сохраняет простое соединение последних имён в перечне.
theological_decisions:
- issue: Родственная связь, подразумеваемая в сочетании Ἰούδαν Ἰακώβου
  choice: 'В основном тексте: «Иуду, сына Иакова»'
  alternative: '«Иуду, брата Иакова»; буквально: «Иуду Иакова»'
  rationale: Греческий родительный падеж не называет связь прямо. «Сын Иакова» — наиболее вероятное и естественное восполнение, но возможное понимание «брат Иакова» сохранено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной передачей библейских имён. Формулировка сохраняет структуру перечня и остаётся понятной при чтении вслух.
