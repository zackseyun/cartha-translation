  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: ru
  text: которые пришли послушать Его и исцелиться от своих болезней; исцелялись и те, кого тревожили[a] нечистые духи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мучили», «изнуряли»; греческое слово может обозначать, что человека тревожат, изнуряют или мучат.'
    reason: Лексическая широта причастия ἐνοχλούμενοι.
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: которые пришли
  rationale: Относительное местоимение связывает стих с множеством людей, названным в предыдущем стихе; аорист передан естественным русским прошедшим временем.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: послушать Его
  rationale: Инфинитив выражает цель прихода. «Послушать» в данном контексте естественнее русского «услышать» и подразумевает слушание учения Иисуса.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: исцелиться от своих болезней
  rationale: Пассивный по форме греческий инфинитив естественно передаётся русским возвратным глаголом; предлог «от» сохраняет идею освобождения от болезней.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: те, кого мучили нечистые духи
  rationale: Причастная конструкция развёрнута для ясного современного русского синтаксиса. «Мучили» передаёт воздействие духов, не уточняя его конкретную форму; лексическая широта отмечена в сноске.
- source_word: ἐθεραπεύοντο
  choice: исцелялись
  rationale: Несовершенный вид русского глагола передаёт продолженное или повторявшееся действие греческого имперфекта.
theological_decisions:
- issue: Передача πνευμάτων ἀκαθάρτων
  choice: нечистые духи
  alternative: злые духи; бесы
  rationale: «Нечистые духи» прямо сохраняет устойчивое евангельское выражение и не подменяет исходную формулировку более толковательными обозначениями.
- issue: Аспект ἐθεραπεύοντο
  choice: исцелялись
  alternative: были исцелены
  rationale: Несовершенный вид сохраняет незавершённый или повторяющийся характер действия, выраженный греческим имперфектом.
translation_notes:
  register: Современный литературный русский язык; продолжение предыдущего предложения сохранено строчной буквой. Второе предложение перестроено естественно для русского языка, при этом аспект исцеления и личностное действие нечистых духов не сглажены.
