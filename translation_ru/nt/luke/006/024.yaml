  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: ru
  text: Но горе вам, богатые, ибо вы получили своё утешение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы сполна получили своё утешение». Глагол может подразумевать получение всего причитающегося.'
