lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт резкое противопоставление предшествующим блаженствам естественным современным русским союзом.
- source_word: οὐαὶ ὑμῖν
  choice: горе вам
  rationale: Сохраняет традиционную пророческую формулу серьёзного предостережения и суда, не ослабляя её до простого сожаления.
- source_word: τοῖς πλουσίοις
  choice: богатые
  rationale: Прямое обращение к определённой группе; краткая форма естественна по-русски и не добавляет не выраженных в тексте условий.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает причинную связь между возвещённым горем и последующим утверждением.
- source_word: ἀπέχετε
  choice: уже получили
  rationale: Глагол в данном употреблении может означать получение причитающегося, вплоть до получения сполна. Частица «уже» естественно передаёт наличный, завершённый результат, не вводя образ оплаты непосредственно в основной текст.
- source_word: τὴν παράκλησιν ὑμῶν
  choice: своё утешение
  rationale: «Утешение» доступно современному читателю и сохраняет значение παράκλησις в контексте противопоставления нынешнего благополучия будущей перемене участи.
theological_decisions:
- issue: Характер обращения к богатым
  choice: Сохранено прямое «горе вам, богатые» без смягчения и без пояснения, что речь лишь о злоупотребляющих богатством или надеющихся на него.
  alternative: «Увы вам» либо «горе тем, кто уповает на богатство»
  rationale: Греческий текст прямо обращён к богатым и не формулирует в этом стихе дополнительных ограничений; перевод не должен ни ослаблять, ни доктринально расширять высказывание.
- issue: Смысл и временная сила ἀπέχετε
  choice: «вы уже получили» с примечанием о возможном оттенке полноты получения
  alternative: «вы получаете»; «вы получили сполна»
  rationale: Настоящее ἀπέχετε в идиоматическом употреблении может обозначать, что причитающееся уже получено полностью. Основной текст передаёт достигнутый результат, а примечание сохраняет более выраженный коммерческий оттенок, не делая его обязательным.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и прямая. Сохранён контраст с предшествующими блаженствами и суровая сила формулы «горе вам».
