base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: ru
  text: Ибо нет хорошего дерева, приносящего гнилой плод[a], и нет, наоборот, гнилого дерева, приносящего хороший плод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плохой плод» / «плохое дерево». Греческое слово σαπρός может означать «испорченный», «гнилой» или «плохой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: Ведь не бывает
  rationale: «Ведь» естественно передаёт пояснительную связь γάρ с предшествующим контекстом, а «не бывает» — отрицание существования в кратком изречении.
- source_word: δένδρον καλόν
  choice: хорошего дерева
  rationale: «Хорошее» сохраняет как прямой смысл качества плодового дерева, так и нравственный оттенок образа, не делая его чрезмерно явным.
- source_word: ποιοῦν καρπόν
  choice: которое приносило бы… плод
  rationale: Для дерева русское «приносить плод» идиоматично передаёт ποιέω с καρπός; сослагательная форма естественна после конструкции «не бывает».
- source_word: σαπρόν
  choice: гнилой / гнилого
  rationale: «Гнилой» сохраняет конкретный образ испорченного плода или дерева и одновременно допускает переносный смысл «плохой, негодный».
- source_word: οὐδὲ πάλιν
  choice: как не бывает и
  rationale: Эта конструкция естественно выражает вторую, обратную сторону параллельного отрицания; отдельное буквальное «снова» по-русски звучало бы неестественно.
- source_word: καρπὸν καλόν
  choice: хороший плод
  rationale: Повтор «хороший» сохраняет лексическую и смысловую симметрию греческой антитезы.
theological_decisions:
- issue: Соотношение конкретного сельскохозяйственного образа и нравственного смысла
  choice: Передать σαπρός словом «гнилой» в обоих случаях
  alternative: «плохой» или «негодный»
  rationale: «Гнилой» удерживает конкретную образность исходного текста, позволяя нравственному применению вытекать из метафоры, а не подменять её отвлечённой оценкой.
translation_notes:
  register: Современный литературный русский язык с ясной, пословичной структурой. Параллелизм оригинала сохранён, но οὐδὲ πάλιν передано естественной русской конструкцией «как не бывает и».
