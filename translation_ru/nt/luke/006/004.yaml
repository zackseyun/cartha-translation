id: LUK.6.4
reference: Luke 6:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: ru
  text: как он вошёл в дом Божий, взял хлебы предложения[a] и ел их, и дал тем, кто был с ним, — хлебы, которые никому, кроме одних священников, не позволено есть?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть освящённые хлебы, которые клали перед Богом; также их называют хлебами присутствия.
    reason: Поясняет культовый термин и даёт понятный современному читателю смысловой вариант.
lexical_decisions:
- source_word: ὡς
  choice: как
  rationale: Вводит содержание и образ действия в продолжение вопроса о поступке Давида; русское «как» естественно сохраняет эту функцию.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: вошёл в дом Божий
  rationale: Сохраняет образ «дома Божьего» и не заменяет οἶκος более узким словом «храм».
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: хлебы предложения
  rationale: Устоявшееся русское название священных хлебов, полагавшихся перед Богом; пояснение дано в сноске, поскольку выражение не вполне прозрачно современному читателю.
- source_word: λαβὼν ἔφαγεν
  choice: взял ... и ел их
  rationale: Передаёт последовательность действий, не создавая впечатления, будто Давид съел все упомянутые хлебы целиком.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: а затем дал тем, кто был с ним
  rationale: Естественно передаёт последующее действие и буквально сохраняет неопределённое обозначение спутников Давида.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: не позволено ... есть
  rationale: Передаёт не просто обычай, а установленное религиозным законом ограничение; конструкция остаётся естественной по-русски.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: никому, кроме одних священников
  rationale: 'Сохраняет двойное подчёркивание исключительности: есть эти хлебы могли только священники.'
theological_decisions:
- issue: Законодательное и культовое ограничение на вкушение священных хлебов
  choice: «не позволено ... есть»
  alternative: «не разрешается есть»; «по закону могут есть только»
  rationale: Формулировка сохраняет смысл обязательного религиозно-правового установления, но не добавляет отсутствующего в греческом тексте слова «закон».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Устоявшееся выражение «дом Божий» сохранено; специальный термин «хлебы предложения» пояснён сноской. Вопросительный знак оставлен, поскольку стих продолжает вопрос, начатый в предыдущем контексте.
