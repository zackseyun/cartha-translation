  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: ru
  text: 'Оглядев их всех, он сказал человеку: «Протяни руку». Тот так и сделал, и его рука была восстановлена[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его рука исцелилась». Буквально греческий текст говорит, что рука «была восстановлена», то есть вернулась в надлежащее состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: оглядев
  rationale: 'Аористное причастие передаёт предшествующее речи действие: Иисус обвёл взглядом присутствующих. «Оглядев» естественно и кратко сохраняет эту последовательность.'
- source_word: πάντας αὐτούς
  choice: их всех
  rationale: Сохраняет подчёркнутый греческим текстом охват всех присутствующих, не добавляя отсутствующего в оригинале уточнения.
- source_word: εἶπεν αὐτῷ
  choice: сказал человеку
  rationale: Дательный αὐτῷ указывает на мужчину с больной рукой из ближайшего контекста. Существительное делает русскую фразу ясной без многократного столкновения местоимений.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Протяни руку
  rationale: Прямое и естественное повеление; χείρ передано как «рука», без неоправданного расширения до предплечья или всей руки.
- source_word: ὁ δὲ ἐποίησεν
  choice: Тот так и сделал
  rationale: Фраза отсылает к исполнению только что данного повеления. «Тот» ясно обозначает человека, а «так и сделал» естественно передаёт ответное действие; δέ здесь имеет лёгкую повествовательную функцию.
- source_word: ἀπεκατεστάθη
  choice: была восстановлена
  rationale: Пассивная форма ἀποκαθίστημι обозначает возвращение к надлежащему или прежнему состоянию. «Была восстановлена» сохраняет и пассив, и идею восстановления, не заменяя её более толковательным «исцелилась».
- source_word: ἡ χεὶρ αὐτοῦ
  choice: его рука
  rationale: Сохраняет явно названный в греческом тексте субъект и естественно передаёт притяжательное αὐτοῦ.
theological_decisions:
- issue: Характер чуда в глаголе ἀπεκατεστάθη
  choice: его рука была восстановлена
  alternative: его рука исцелилась
  rationale: Греческий глагол акцентирует возвращение руки в надлежащее состояние. Формулировка с «восстановлена» сохраняет эту смысловую окраску и не подменяет её исключительно медицинским обозначением исцеления.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Местоимение, относящееся к Иисусу, написано со строчной буквы в соответствии с нейтральной современной орфографической практикой; двусмысленность цепочки местоимений устранена контекстуально оправданным словом «человеку».
