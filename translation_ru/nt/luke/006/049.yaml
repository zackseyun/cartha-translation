  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: ru
  text: А тот, кто услышал и не исполнил, подобен человеку, построившему дом на земле, без фундамента. Когда река ударила в него, дом сразу рухнул, и разрушение того дома было огромным.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и пролом (или крушение) того дома стал велик». Греческое ῥῆγμα может обозначать пролом, крушение или последовавшее разрушение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: А тот, кто услышал и не исполнил
  rationale: Субстантивированное причастие передано естественной русской конструкцией «тот, кто». ποιέω в контексте означает исполнение услышанных слов Иисуса; «не исполнил» ясно выражает этот смысл, не добавляя местоименного объекта.
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: подобен человеку
  rationale: Формулировка сохраняет обычную конструкцию сравнения и репрезентативное единственное число, при этом ἄνθρωπος естественно передаётся как «человек».
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: построившему дом прямо на земле, без фундамента
  rationale: «На земле» передаёт поверхность, на которой возведён дом. «Прямо» естественно подчёркивает отсутствие фундамента, не меняя образа.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Когда река обрушилась на этот дом
  rationale: Относительная конструкция преобразована во временную для естественного русского синтаксиса. προσρήγνυμι выражает сильный удар; «обрушилась на» сохраняет его интенсивность.
- source_word: καὶ εὐθὺς συνέπεσεν
  choice: он сразу рухнул
  rationale: συμπίπτω применительно к дому означает обрушиться; «рухнул» кратко и образно передаёт результат, а «сразу» сохраняет εὐθύς.
- source_word: καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: и разрушение того дома было велико
  rationale: ῥῆγμα может обозначать пролом, крушение или разрушение. Контекст полного обвала поддерживает естественное русское «разрушение», а «было велико» сохраняет формальную напряжённость греческой фразы.
theological_decisions:
- issue: Репрезентативное обозначение человека в сравнении
  choice: человеку
  alternative: мужчине
  rationale: Греческое ἀνθρώπῳ обозначает человека вообще, а не специально взрослого мужчину; «человеку» точно сохраняет универсальность образа без конфессионального толкования.
- issue: Связь исполнения с услышанными словами Иисуса
  choice: не исполнил
  alternative: не поступил по ним
  rationale: «Не исполнил» сохраняет краткость ποιέω и подразумеваемую связь с предшествующими словами Иисуса, не вводя в основной текст отсутствующее в стихе местоимение.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинством выдержанным повествованием. Синтаксис слегка сглажен ради естественности, но последовательность образов и резкость заключительной фразы сохранены.
