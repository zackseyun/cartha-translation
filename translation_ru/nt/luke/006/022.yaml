id: LUK.6.22
reference: Luke 6:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: ru
  text: Блаженны вы, когда люди возненавидят вас, когда исключат вас, оскорбят и отвергнут ваше имя как злое[a] из-за Сына Человеческого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть публично отвергнут или опорочат вас, объявляя нравственно дурными.
    reason: Пояснение образного выражения «отвергнут ваше имя как злое».
lexical_decisions:
- source_word: Μακάριοί
  choice: Блаженны
  rationale: Сохраняет форму и богословскую значимость евангельского макаризма; «счастливы» звучало бы преимущественно как обозначение субъективного чувства.
- source_word: ὅταν
  choice: когда
  rationale: С сослагательным наклонением обозначает неопределённо-будущую ситуацию; «когда» естественно для русского языка и стиля заповедей блаженства.
- source_word: μισήσωσιν ὑμᾶς οἱ ἄνθρωποι
  choice: люди возненавидят вас
  rationale: «Люди» передаёт обобщённое, а не исключительно мужское значение οἱ ἄνθρωποι; «возненавидят» точно выражает будущую враждебность.
- source_word: ἀφορίσωσιν ὑμᾶς
  choice: отлучат вас от себя
  rationale: Передаёт социальное исключение и сохраняет образ отделения, не уточняя без достаточных оснований, идёт ли речь о формальном религиозном отлучении.
- source_word: ὀνειδίσωσιν
  choice: станут поносить
  rationale: «Поносить» выражает словесное оскорбление и поругание, оставаясь понятным в современном литературном русском.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: отвергнут ваше имя
  rationale: Естественно передаёт идиому публичного отвержения имени или репутации, сохраняя упоминание «имени» и не сводя выражение к одному конкретному общественному действию.
- source_word: ὡς πονηρὸν
  choice: как злое
  rationale: Сохраняет прямую нравственную характеристику имени в греческом тексте и его намеренно резкую формулировку.
- source_word: ἕνεκα
  choice: из-за
  rationale: Ясно и естественно обозначает причину преследования; здесь выражение не подразумевает, что Сын Человеческий является виновником зла.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Сохраняет устойчивый евангельский титул и его ветхозаветные и межтекстовые связи.
theological_decisions:
- issue: Значение выражения ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: «отвергнут ваше имя как злое» в основном тексте с пояснением в сноске
  alternative: «опорочат вас как злых»; «изгонят ваше имя как злое»
  rationale: Греческое выражение образно и может обозначать публичное отвержение, осуждение или дискредитацию человека через его имя. Выбранная формулировка сохраняет образ «имени» и подлинную широту смысла, а сноска помогает читателю понять идиому.
- issue: Обобщённое значение οἱ ἄνθρωποι
  choice: «люди»
  alternative: «мужчины»; «человечество»
  rationale: В контексте речь идёт о людях вообще, а не только о лицах мужского пола.
- issue: Передача титула τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: «Сына Человеческого»
  alternative: «Человеческого Сына»; «Человека»
  rationale: Традиционный титул точно соответствует евангельскому употреблению и сохраняет возможную связь с Дан 7, не навязывая её толкование.
translation_notes:
  register: Современный литературный русский с достоинством евангельского макаризма. Синтаксис сохраняет нарастающий ряд форм преследования, но избегает ненужной архаики. «Блаженны» и «Сын Человеческий» оставлены как понятные и укоренённые библейские выражения.
