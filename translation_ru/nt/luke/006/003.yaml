  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: ru
  text: 'Иисус ответил им: «Разве вы не читали даже о том, что сделал Давид, когда он и те, кто был с ним, проголодались?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ответил
  rationale: Обычная койне-конструкция буквально означает «ответив, сказал»; в современном русском «ответил» естественно передаёт её смысл без избыточного повтора.
- source_word: πρὸς αὐτοὺς
  choice: им
  rationale: Дательный падеж при «ответил» естественно передаёт адресатов ответа.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: Неужели вы не читали даже о том
  rationale: «Неужели» передаёт риторический характер вопроса, а «даже» сохраняет усилительное значение οὐδέ. Оборот «о том, что сделал» в данном контексте естественнее по-русски, чем буквальное «это, что сделал».
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: что сделал Давид
  rationale: Прямая и естественная передача относительной конструкции без добавочного толкования.
- source_word: ὁπότε ἐπείνασεν
  choice: когда проголодались
  rationale: Глагол «проголодались» передаёт наступление голода в повествовательном аористе; множественное число согласуется с последующим составным подлежащим и естественно звучит по-русски.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: он и те, кто был с ним
  rationale: Сохраняет явное местоимение и описательное обозначение сопровождавших Давида, не заменяя его более толковательным «спутники».
