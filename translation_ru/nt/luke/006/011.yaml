  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: ru
  text: Но они исполнились безумия и обсуждали между собой, что бы им сделать с Иисусом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Но они
  rationale: δὲ передаёт контраст с совершённым Иисусом исцелением; отдельное усиление αὐτοὶ по-русски здесь звучало бы тяжеловесно.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: пришли в ярость
  rationale: В данном контексте ἄνοια обозначает утратившее здравый смысл, исступлённое состояние противников. Естественная русская идиома передаёт эмоциональную силу, а сноска сохраняет более буквальные смысловые возможности.
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: стали обсуждать друг с другом
  rationale: Имперфект изображает продолжавшееся взаимное обсуждение; «стали обсуждать» естественно вводит последовавший за реакцией процесс совещания.
- source_word: τί ἂν ποιήσαιεν
  choice: что бы им сделать
  rationale: ἄν с оптативом в косвенном совещательном вопросе выражает обдумываемую возможность; конструкция с «бы» сохраняет неопределённость замысла.
- source_word: τῷ Ἰησοῦ
  choice: с Иисусом
  rationale: Дательный при ποιέω указывает на лицо, к которому направлено предполагаемое действие. «Сделать с Иисусом» по-русски естественнее, чем «сделать Иисусу», и не конкретизирует враждебный замысел сверх текста.
theological_decisions:
- issue: Передача ἀνοίας как эмоциональной ярости либо как безумия или неразумия
  choice: пришли в ярость
  alternative: исполнились безумия; исполнились неразумия
  rationale: Контекст явно показывает враждебную эмоциональную реакцию, однако само слово подчёркивает утрату рассудительности. Основной текст остаётся естественным, а сноска сохраняет лексическую напряжённость и не приписывает героям клинического расстройства.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Сохранены контраст, процесс обсуждения и неопределённость замышляемого действия; буквальные оттенки ἀνοίας вынесены в сноску.
