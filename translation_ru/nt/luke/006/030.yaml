  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: ru
  text: Всякому, кто просит у тебя, давай; а у того, кто забирает принадлежащее тебе, не требуй возврата.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не проси вернуть».'
    reason: 'Лексическая альтернатива: ἀπαιτέω может означать как более настойчивое «требовать возврата», так и менее сильное «просить вернуть».'
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: всякому, кто просит у тебя
  rationale: Передаёт дистрибутивное значение παντί и прямое дополнение σε, сохраняя широкий охват повеления. Глагол «просит» не добавляет отсутствующего в тексте указания на нищенство.
- source_word: δίδου
  choice: давай
  rationale: Настоящее повелительное наклонение естественно передаётся русским «давай», которое может выражать постоянную, характерную практику, не перегружая формулировку.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: у того, кто забирает
  rationale: Сочетание с ἀπό передано конструкцией «у того», а αἴρω — широким «забирает», без неоправданного уточнения, идёт ли речь о краже, насилии или иной ситуации.
- source_word: τὰ σὰ
  choice: принадлежащее тебе
  rationale: Естественно передаёт субстантивированное выражение «то, что твоё», сохраняя его широкий смысл и не сужая до конкретного вида имущества.
- source_word: μὴ ἀπαίτει
  choice: не требуй вернуть это
  rationale: Передаёт запрет и возвратное значение ἀπαιτέω. «Требуй» сохраняет более сильный оттенок, чем простое «проси», а «это» ясно отсылает к принадлежащему адресату.
theological_decisions:
- issue: Охват и сила этических повелений Иисуса
  choice: Передать оба повеления прямо и широко, не смягчая и не ограничивая их толкованием
  alternative: Представить слова как гиперболу либо ограничить их милостыней или случаями кражи
  rationale: Греческий текст содержит прямые повеления и универсальное «всякому». Перевод сохраняет нравственную напряжённость высказывания и не решает в самом тексте спор о пределах его практического применения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Точка с запятой ясно разделяет два параллельных повеления. Сохранены широта и резкость исходного изречения без внесения правовых или конфессиональных уточнений.
