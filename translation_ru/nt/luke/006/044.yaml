review_pass:
  verdict: revise
  source_fidelity: Требуется уточнение ботанических образов. «Колючки» в русском обычно обозначает шипы, а не растения, поэтому не передаёт ἀκανθῶν как источник, «с которого» собирают плоды. «Терновый куст» может слишком конкретно отсылать к тёрну, тогда как βάτος обозначает ежевичный/ежевикоподобный колючий куст. Следует также явно сохранить второе пояснительное γάρ.
  naturalness: Исправленный текст остаётся кратким, естественным и литературным. «С колючих кустов» и «с куста ежевики» ясно выражают сельскохозяйственный образ; «гроздья винограда» естественно передаёт σταφυλήν.
  terminology: «Инжир» — нормативный современный эквивалент σῦκα. «Куст ежевики» передаёт βάτος без архаизации и с примечанием сохраняет более широкий смысл «ежевикоподобного колючего куста». «Собирают» передаёт συλλέγουσιν, а «срывают» — τρυγῶσιν, сохраняя уместное различие действий.
  issues:
  - severity: medium
    issue: «С колючек»
    rationale: «Колючки» — это обычно шипы, а не колючие растения или кусты; такая формулировка создаёт неестественный образ и ослабляет значение ἀκανθῶν.
  - severity: medium
    issue: «С тернового куста» для βάτου
    rationale: Терновник/тёрн — более конкретное ботаническое обозначение, тогда как βάτος относится к ежевике или сходному колючему кустарнику. Без примечания перевод чрезмерно сужает референцию.
  - severity: low
    issue: Второе γάρ не выражено
    rationale: Русское двоеточие показывает связь, но добавление «ведь» после двоеточия безопасно сохраняет повторное пояснительное γάρ оригинала.
  revised_text: 'Ведь каждое дерево узнают по его собственному плоду: ведь с колючих кустов не собирают инжир и с куста ежевики не срывают гроздья винограда.'
