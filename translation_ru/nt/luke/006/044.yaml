  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: ru
  text: 'Ведь каждое дерево узнают по его собственному плоду: ведь с колючих кустов не собирают инжир и с куста ежевики не срывают гроздья винограда.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: каждое дерево
  rationale: Сочетание ἕκαστον с существительным в единственном числе имеет распределительное значение; «каждое дерево» естественно передаёт индивидуализирующую силу выражения.
- source_word: γὰρ
  choice: ведь / не выражено отдельно во второй части
  rationale: Первое γάρ передано как «ведь», сохраняя пояснительную связь с контекстом. Второе в русском не повторено, поскольку двоеточие естественно передаёт обоснование и избегает тяжеловесности.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: по его собственному плоду
  rationale: Предлог «по» идиоматично сочетается с «узнают», а «собственному» сохраняет акцент ἰδίου на соответствии дерева именно его плоду.
- source_word: γινώσκεται
  choice: узнают
  rationale: Неопределённо-личная конструкция естественно передаёт греческий пассив настоящего времени и характерное, общеизвестное распознавание.
- source_word: ἀκανθῶν
  choice: колючек
  rationale: Множественное ἀκάνθαι широко обозначает колючие растения. «Колючки» понятно современному читателю и не сужает значение до конкретного вида.
- source_word: συλλέγουσιν
  choice: собирают
  rationale: Обычный и точный русский глагол для сбора плодов.
- source_word: σῦκα
  choice: инжир
  rationale: В современном русском название плода обычно употребляется как собирательное вещественное существительное в единственном числе.
- source_word: βάτου
  choice: тернового куста
  rationale: βάτος обозначает колючий кустарник, подобный ежевике или терновнику; «терновый куст» сохраняет общий ботанический образ без необоснованного указания конкретного вида.
- source_word: σταφυλήν
  choice: виноград
  rationale: Хотя греческое слово стоит в единственном числе и может обозначать гроздь, русское собирательное «виноград» естественно передаёт плод лозы в этом изречении.
- source_word: τρυγῶσιν
  choice: снимают
  rationale: Глагол обозначает сбор созревших плодов, особенно винограда. «Снимают виноград» естественно в русском и сохраняет лексическое отличие от συλλέγουσιν «собирают».
theological_decisions:
- issue: Метафорический смысл образа плода
  choice: Сохранить земледельческое изречение без поясняющего добавления о характере или поступках человека.
  alternative: Раскрыть метафору непосредственно как указание на нравственный характер или дела.
  rationale: Греческий текст оставляет образ без эксплицитного толкования в самом стихе; сохранение метафоры удерживает её риторическую силу и не сужает применение.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Поговорочная краткость сохранена; двоеточие подчёркивает пояснительную логику второй части. Архаичные «смоквы» и «терние» не использованы.
