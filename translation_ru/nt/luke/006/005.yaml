base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: ru
  text: 'И говорил им: «Сын Человеческий — Господь субботы».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сын Человеческий господствует над субботой».'
    reason: 'Лексико-синтаксическая альтернатива: родительный падеж после κύριος обозначает власть над субботой.'
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз сохраняет последовательное течение повествования, не добавляя отсутствующего в греческом тексте временного оттенка.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передан несовершенным видом, естественно сохраняющим длительный или повторяющийся характер речи без искусственной тяжеловесности.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения передан прямо и естественно, без уточнения собеседников сверх сказанного в тексте.
- source_word: Κύριος
  choice: Господь
  rationale: В данном предикативном употреблении слово выражает верховную власть Сына Человеческого, а не вежливое обращение. «Господь» сохраняет сильное христологическое звучание и традиционную связь титула κύριος.
- source_word: τοῦ σαββάτου
  choice: субботы
  rationale: Родительный падеж после «Господь» компактно воспроизводит греческую конструкцию и выражает власть по отношению к субботе, не добавляя пояснительного предлога в основной текст.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Устоявшийся русский эквивалент сохраняет самообозначение Иисуса, семитский фон выражения и возможную связь с Дан 7.
theological_decisions:
- issue: Христологическая сила утверждения о субботе
  choice: «Сын Человеческий — Господь субботы»
  alternative: «Сын Человеческий господствует над субботой»
  rationale: Основной вариант прямо сохраняет титул κύριος и сильное утверждение власти Сына Человеческого. Альтернатива яснее раскрывает смысл отношения, но превращает существительное-титул в глагол. Слово «даже» не добавлено, поскольку в данном греческом тексте оно отсутствует.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью исходного изречения. Нулевая связка с тире естественна для настоящего времени; «говорил» сохраняет аспект греческого имперфекта. Прописные буквы в титуле «Сын Человеческий» и слове «Господь» отражают их христологическое употребление.
