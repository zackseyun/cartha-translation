  terminology: «Сын Человеческий» — устойчивое и наиболее подходящее обозначение, сохраняющее титульный и межтекстовый потенциал выражения. «Господь субботы» точно передаёт κύριος с родительным падежом и сохраняет титульно-христологическую силу. Альтернативная сноска «господствует над субботой» допустимо разъясняет отношение власти, не подменяя основной текст.
