  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: καὶ — «И», имперфект ἔλεγεν — «говорил», αὐτοῖς — «им», а предикативное Κύριός ἐστιν ... ὁ υἱὸς τοῦ ἀνθρώπου — «Сын Человеческий — Господь субботы». Порядок слов в русском естественно переносит подлежащее вперёд, не ослабляя акцента на господстве Сына Человеческого. Добавлений, в том числе интерпретирующего «даже», нет.'
