source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: ru
  text: Ученик не выше своего учителя, но всякий, кто полностью подготовлен[a], будет как его учитель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но всякий, кого вполне подготовили, будет как его учитель».'
    reason: 'Лексическая альтернатива: κατηρτισμένος — совершенное страдательное причастие; вариант более явно выражает страдательный залог.'
lexical_decisions:
- source_word: μαθητής
  choice: ученик
  rationale: «Ученик» естественно передаёт человека, который учится у наставника, сохраняя как учебный, так и личностно-формирующий оттенок.
- source_word: ὑπὲρ
  choice: выше
  rationale: В сравнительной конструкции слово обозначает превосходство по положению; «не выше» кратко и естественно передаёт смысл.
- source_word: διδάσκαλον / διδάσκαλος
  choice: учитель
  rationale: Прямой и общеупотребительный эквивалент, подходящий контексту обучения и формирования ученика.
- source_word: κατηρτισμένος
  choice: пройдя полную подготовку
  rationale: Совершенное страдательное причастие передаёт состояние человека, доведённого подготовкой до готовности; деепричастная конструкция звучит естественно по-русски и не сводит значение лишь к академическому обучению.
- source_word: πᾶς
  choice: всякий
  rationale: Мужской род единственного числа имеет обобщающее значение; «всякий» сохраняет форму изречения и согласуется с последующим местоимением.
- source_word: ὡς
  choice: как
  rationale: Передаёт прямое сравнение между подготовленным учеником и его учителем.
- source_word: αὐτοῦ
  choice: его
  rationale: Сохраняет отнесённость учителя к обобщённо названному ученику и грамматическое единственное число.
theological_decisions:
- issue: Характер уподобления ученика учителю
  choice: «будет как его учитель»
  alternative: «станет равен своему учителю»
  rationale: Греческое ὡς выражает подобие, а не обязательно полное равенство; перевод не усиливает утверждение и сохраняет его открытый смысл.
- issue: Значение κατηρτισμένος
  choice: «пройдя полную подготовку»
  alternative: «достигнув совершенства»
  rationale: В учебном контексте глагол указывает на завершённое формирование или подготовку. «Достигнув совершенства» могло бы внести более сильное богословское понятие без необходимости.
- issue: Обобщающее мужское единственное число
  choice: «всякий… его учитель»
  alternative: «каждый человек… его учитель»
  rationale: Краткая формулировка сохраняет грамматическую и пословичную структуру греческого текста без ограничения круга подразумеваемых людей.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого афористического изречения. Формулировка «не выше своего учителя» естественна и прозрачна; «пройдя полную подготовку» сохраняет идею завершённого формирования, не привнося конфессионально окрашенного понятия совершенства.
