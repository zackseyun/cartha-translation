id: LUK.6.41
reference: Luke 6:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ru
  text: Но почему ты видишь соринку в глазу своего брата[a], а бревна в собственном глазу не замечаешь?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Брат» передаёт греческое слово мужского рода в единственном числе; наставление относится не только к родному брату или к мужчине.
    reason: cultural_note
  - marker: b
    text: «Соринка» может также означать щепку или соломинку; «бревно» — крупный брус или балку. Образ намеренно противопоставляет крошечную частицу огромному куску дерева.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: Но почему
  rationale: В риторическом вопросе τί при βλέπεις передаёт укоризненное «почему», а δέ обозначает лёгкое противопоставление предыдущей мысли.
- source_word: βλέπεις
  choice: видишь
  rationale: Сохраняет прямой зрительный образ и естественно звучит в риторическом вопросе.
- source_word: κάρφος
  choice: соринка
  rationale: Обозначает малую сухую частицу, щепку или соломинку; «соринка» естественна в русском образном выражении и ясно контрастирует с бревном.
- source_word: ἀδελφοῦ
  choice: брата
  rationale: Сохраняет мужской род и единственное число греческого текста; в наставлении слово имеет более широкое применимое значение.
- source_word: δοκόν
  choice: бревна
  rationale: Греческое слово обозначает крупный деревянный брус или балку; «бревно» создаёт ясную, намеренно гиперболическую противоположность соринке.
- source_word: ἰδίῳ
  choice: собственном
  rationale: Передаёт усиленное значение принадлежности и подчёркивает противопоставление глазу брата.
- source_word: οὐ κατανοεῖς
  choice: не замечаешь
  rationale: Передаёт отсутствие внимательного восприятия и сохраняет смысловой контраст с простым «видишь».
theological_decisions:
- issue: Род и объём значения ἀδελφοῦ
  choice: брата
  alternative: ближнего; брата или сестры
  rationale: Исходный текст употребляет существительное мужского рода в единственном числе в нравственном примере. Перевод сохраняет эту форму, а более широкую применимость поясняет сноска.
translation_notes:
  register: 'Современный литературный русский язык с сохранением краткости, риторического укора и гиперболы оригинала. Порядок второй части слегка адаптирован ради естественного русского противопоставления: «а бревна… не замечаешь».'
