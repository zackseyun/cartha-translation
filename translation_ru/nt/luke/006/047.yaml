  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: ru
  text: Всякий, кто приходит ко Мне, слышит Мои слова и исполняет их, — Я покажу вам, кому он подобен:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кому он подобен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Всякий, кто приходит ко Мне
  rationale: Конструкция с πᾶς и субстантивированным причастием имеет обобщающее значение. «Всякий, кто» естественно передаёт всеобщий охват и сохраняет единственное число; πρός с винительным обозначает движение к Иисусу.
- source_word: ἀκούων μου τῶν λόγων
  choice: слышит Мои слова
  rationale: «Слышит» прямо передаёт ἀκούων, не добавляя толкования об особом внимании или послушании; μου при λόγων естественно передаётся притяжательным «Мои».
- source_word: ποιῶν αὐτούς
  choice: исполняет их
  rationale: В сочетании со словами или наставлениями ποιέω означает поступать согласно им. Русское «исполняет их» естественнее буквального «делает их» и не ослабляет практического смысла.
- source_word: ὑποδείξω ὑμῖν
  choice: Я покажу вам
  rationale: Будущее время вводит последующее сравнение; «покажу» точно и естественно передаёт ὑποδείξω.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: кому он подобен
  rationale: Так сохраняются дательный вопросительного местоимения τίνι и личное сравнение, которое раскрывается в следующем стихе.
theological_decisions:
- issue: Обобщающее мужское единственное число
  choice: Сохранить единственное число в форме «всякий, кто… он»
  alternative: Употребить множественное число или повторить «такой человек»
  rationale: Греческие причастия и ὅμοιος стоят в мужском роде единственного числа, но обозначают любого человека. Русское «всякий, кто… он» сохраняет грамматическую форму и обобщающий смысл без ограничения только мужчинами.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским регистром. Заглавные буквы в «Мне» и «Мои» употреблены как традиционное почтительное обозначение Иисуса. Тире перед «Я покажу» передаёт смену от описания человека к обещанию привести сравнение.
