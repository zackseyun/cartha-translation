id: LUK.6.34
reference: Luke 6:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: ru
  text: И если вы даёте взаймы тем, от кого надеетесь получить обратно, какая вам за это похвала?[a] Ведь и грешники дают взаймы грешникам, чтобы получить обратно столько же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какая вам за это благодарность?» Греческое слово χάρις может означать благодарность, благосклонность или одобрение; здесь по контексту вероятнее речь об одобрении поступка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: даёте взаймы / дают взаймы
  rationale: Передаёт финансовый смысл глагола естественным современным русским выражением, не уточняя, идёт ли речь о деньгах или имуществе.
- source_word: παρ’ ὧν
  choice: тем, от кого
  rationale: Русская конструкция одновременно ясно указывает на получателей займа и на тех, от кого ожидают возврата.
- source_word: ἐλπίζετε λαβεῖν
  choice: надеетесь получить обратно
  rationale: «Надеетесь» сохраняет смысловую широту ἐλπίζω между надеждой и ожиданием, а «обратно» выражает подразумеваемый контекстом возврат.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: какая вам за это похвала?
  rationale: Здесь χάρις обозначает одобрение или положительную оценку такого поступка, а не спасительную благодать; вариант «похвала» естественно звучит в риторическом вопросе.
- source_word: ἁμαρτωλοὶ
  choice: грешники
  rationale: Прямой и традиционно понятный русский эквивалент субстантивированного прилагательного.
- source_word: ἵνα ἀπολάβωσιν
  choice: чтобы получить обратно
  rationale: Передаёт значение возвратного получения без добавления идеи прибыли или процентов.
- source_word: τὰ ἴσα
  choice: столько же
  rationale: Естественно выражает равноценный возврат и не конкретизирует его как денежную сумму, поскольку греческий текст этого не требует.
theological_decisions:
- issue: Значение χάρις в риторическом вопросе Иисуса
  choice: «похвала» — одобрение или положительная оценка
  alternative: «благодарность»; «благодать»; «заслуга»
  rationale: Контекст сопоставляет поведение учеников с обычной взаимностью грешников. Речь идёт о том, заслуживает ли поступок особого одобрения, а не о благодати как богословском понятии. Возможное значение «благодарность» сохранено в сноске.
- issue: Характер ожидаемого возврата займа
  choice: равноценный возврат без уточнения процентов
  alternative: возврат с прибылью или процентами
  rationale: τὰ ἴσα указывает на равное или равноценное полученному; текст не даёт основания привносить идею процентов либо прибыли.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и доступным синтаксисом. Выражение «давать взаймы» сохраняет бытовой финансовый контекст, а «столько же» не сужает равноценный возврат до исключительно денежной суммы.
