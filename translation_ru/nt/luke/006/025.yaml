revisions:
- from: Горе вам, сытым сейчас, потому что вы будете голодать! Горе вам, смеющимся сейчас, потому что вы будете скорбеть и плакать!
  to: Горе вам, кто сейчас сыт, потому что вы будете голодать! Горе вам, кто сейчас смеётся, потому что вы будете скорбеть и плакать!
  rationale: 'Исправление исключительно стилистико-синтаксическое: субстантивированные причастия заменены естественными для современного русского конструкциями «кто сейчас сыт/смеётся». Сохранены повтор «горе вам», временной контраст «сейчас» — будущее, причинное «потому что» и различение «скорбеть» / «плакать».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:15:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: «горе» сохраняет пророческую силу οὐαί; «сейчас» передаёт νῦν; будущие «будете голодать», «будете скорбеть и плакать» воспроизводят будущий перелом. Однако дательные субстантивированные причастия «сытым» и «смеющимся» после «вам» формально возможны, но заметно утяжеляют современную русскую фразу и менее ясно передают греческие субстантивированные причастия как обозначение групп людей.'
  naturalness: 'Для современного литературного русского естественнее раскрыть эти группы придаточными с «кто»: «вам, кто сейчас сыт» и «вам, кто сейчас смеётся». Это не меняет ни временной аспект, ни смысловую определённость оригинала. «Будете голодать» допустимо как передача πεινάσετε и сохраняет контраст с нынешней сытостью.'
  terminology: '«Горе вам» удачно передаёт οὐαί и соответствует возвышенно-предостерегающему регистру. «Скорбеть и плакать» обоснованно сохраняет два различных будущих глагола πενθήσετε и κλαύσετε, не навязывая конкретного вида утраты или механизма суда. Примечания не требуются: в русском тексте нет необходимой для читателя неоднозначности, которую нужно было бы отмечать.'
