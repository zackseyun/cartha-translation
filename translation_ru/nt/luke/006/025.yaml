  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: ru
  text: Горе вам, кто сейчас сыт, потому что вы будете голодать! Горе вам, кто сейчас смеётся, потому что вы будете скорбеть и плакать!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: горе
  rationale: Сохраняет силу пророческого предостережения и возвещения суда, не сводя выражение лишь к жалости.
- source_word: ἐμπεπλησμένοι
  choice: сытым
  rationale: Передаёт состояние, возникшее в результате насыщения, и сохраняет конкретное противопоставление будущему голоду.
- source_word: νῦν
  choice: сейчас
  rationale: Ясно и естественно для современного читателя передаёт ключевой временной контраст между нынешним состоянием и будущей переменой.
- source_word: πεινάσετε
  choice: будете голодать
  rationale: Естественно передаёт будущее наступление голода или лишения, не уточняя его природу сверх сказанного в тексте.
- source_word: γελῶντες
  choice: смеющимся
  rationale: Сохраняет конкретный образ нынешнего смеха; более широкое «радующимся» было бы истолковывающим расширением.
- source_word: πενθήσετε
  choice: будете скорбеть
  rationale: Передаёт тяжёлую скорбь и сохраняет отличие от следующего глагола «плакать».
- source_word: κλαύσετε
  choice: плакать
  rationale: Передаёт явное выражение горя и сохраняет риторическое усиление в паре со «скорбеть».
- source_word: ὅτι
  choice: потому что
  rationale: Прямо и понятно передаёт причинную связь между возвещением горя и грядущим переломом.
theological_decisions:
- issue: Характер возвещения «горе»
  choice: Пророческое предостережение о грядущем переломе и суде над теми, кто сейчас сыт и смеётся
  alternative: Только социологическое наблюдение о переменчивости жизненных обстоятельств
  rationale: Повторение «горе», формы будущего времени и параллель с окружающими благословениями указывают на грядущий перелом, однако перевод не уточняет его механизм или сроки сверх самого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Дательные причастные формы «сытым» и «смеющимся» точно соотносятся с «вам» и позволяют избежать архаизмов; «сейчас» выбрано вместо более возвышенного «ныне» ради непосредственной понятности.
