source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: ru
  text: Кто из вас, имея сто овец и потеряв одну из них, разве не оставит девяносто девять в открытой местности[a] и не пойдёт за потерявшейся, пока не найдёт её?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пустынной местности». Греческое слово может обозначать открытую, незаселённую или пустынную местность.'
    reason: Лексическая широта ἔρημος не позволяет свести выражение только к одному типу ландшафта.
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Кто из вас
  rationale: Естественная русская форма риторического вопроса. Хотя ἄνθρωπος стоит в мужском роде, русское «кто из вас» не устраняет представительный характер примера и избегает неестественного «какой человек из вас».
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: имея сто овец
  rationale: Сохраняет причастное построение и плавность исходного предложения; «сто овец» прямо передаёт числительное и существительное.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: потеряв одну из них
  rationale: Аористное причастие обозначает случившуюся потерю одной овцы; формулировка естественна по-русски и не предполагает намеренного погубления.
- source_word: οὐ καταλείπει
  choice: не оставит
  rationale: Будущее совершенного вида естественно выражает по-русски ожидаемое действие в риторическом вопросе, смысл которого предполагает утвердительный ответ.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: девяносто девять
  rationale: Референт — оставшиеся овцы — ясен из контекста, поэтому повтор существительного не требуется.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в открытой местности
  rationale: ἔρημος может обозначать безлюдную, незастроенную или пустынную местность. В пастушеском контексте «открытая местность» сохраняет широту значения и не создаёт обязательного образа песчаной пустыни.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλός
  choice: пойдёт за потерявшейся
  rationale: Передаёт направленное движение на поиски овцы. Женский род естественно согласуется с русским словом «овца».
- source_word: ἕως εὕρῃ αὐτό
  choice: пока не найдёт её
  rationale: Обычная русская конструкция со значением достижения предела действия; местоимение ясно относится к потерявшейся овце.
theological_decisions:
- issue: Представительное обозначение человека в риторическом вопросе
  choice: Кто из вас
  alternative: Какой человек из вас
  rationale: Греческое ἄνθρωπος вводит типичный пример, а не ограничивает применение высказывания мужчинами. Русская конструкция «кто из вас» точно и естественно сохраняет эту представительную функцию без искусственного уточнения.
- issue: Состояние потерянной овцы
  choice: за потерявшейся
  alternative: за пропавшей
  rationale: Перевод сохраняет образ овцы, отделившейся от стада и находящейся в потерянном состоянии, не добавляя богословского объяснения метафоры.
translation_notes:
  register: Современный литературный русский язык; риторическая форма и единое длинное предложение оригинала сохранены. Тон простой и достойный, подходящий для устной притчи.
