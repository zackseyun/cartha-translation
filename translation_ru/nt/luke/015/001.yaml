base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: ru
  text: Все сборщики налогов и грешники приходили к Нему, чтобы слушать Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приближались к Нему». Греческая конструкция указывает на продолжавшееся или повторявшееся действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ … ἐγγίζοντες
  choice: постоянно приходили
  rationale: Перифрастическая конструкция с имперфектом и причастием передаёт продолжавшееся или повторявшееся действие. «Постоянно приходили» естественно выражает этот видовой оттенок по-русски; δέ здесь служит переходом и не требует отдельного перевода.
- source_word: αὐτῷ ἐγγίζοντες
  choice: к Нему … приходили
  rationale: ἐγγίζω означает приближаться или подходить. В данном контексте «приходили к Нему» звучит естественно и сохраняет направленность действия.
- source_word: πάντες
  choice: все
  rationale: Слово относится к обеим названным группам и подчёркивает широкий охват.
- source_word: οἱ τελῶναι
  choice: сборщики налогов
  rationale: Так ясно и понятно современному читателю передаётся название людей, собиравших налоги и иные государственные платежи.
- source_word: οἱ ἁμαρτωλοὶ
  choice: грешники
  rationale: Субстантивированное прилагательное обозначает людей, считавшихся грешными или нравственно предосудительными; буквальный эквивалент сохраняет социально-религиозное напряжение.
- source_word: ἀκούειν αὐτοῦ
  choice: чтобы послушать Его
  rationale: Инфинитив выражает цель. «Послушать» здесь естественно передаёт намеренное слушание учения, а не лишь физическое восприятие звука.
theological_decisions:
- issue: Социально-религиозный смысл сочетания «сборщики налогов и грешники»
  choice: Обе категории сохранены без поясняющего расширения.
  alternative: «сборщики налогов и другие отверженные»; «сборщики налогов и явные грешники»
  rationale: Греческий текст называет две группы, не раскрывая их дополнительными характеристиками. Прямой перевод сохраняет повествовательное и богословское напряжение, не навязывая толкования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Формулировка избегает архаизма «мытари», поскольку «сборщики налогов» непосредственно понятнее современному читателю.
