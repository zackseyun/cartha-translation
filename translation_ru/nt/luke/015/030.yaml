id: LUK.15.30
reference: Luke 15:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: ru
  text: Но когда пришёл этот твой сын, проевший твоё состояние с проститутками, ты заколол для него откормленного телёнка.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Но когда
  rationale: Передаёт временное значение ὅτε и контраст, выраженный δέ, естественно продолжая возмущённую речь старшего сына.
- source_word: ὁ υἱός σου οὗτος
  choice: этот твой сын
  rationale: 'Сохраняет указательное значение οὗτος и намеренное отчуждение: говорящий не называет его своим братом.'
- source_word: ὁ καταφαγών σου τὸν βίον
  choice: проевший твоё состояние
  rationale: «Проевший» сохраняет яркий образ буквального «пожирания», а «состояние» естественно передаёт βίος в значении имущества и средств к жизни.
- source_word: μετὰ πορνῶν
  choice: с проститутками
  rationale: Прямая, современная и точная передача обвинения старшего сына без смягчения.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Следует простому значению греческого глагола, не добавляя контекстуально вероятное, но не выраженное здесь «вернулся».
- source_word: ἔθυσας
  choice: заколол
  rationale: В контексте праздничной трапезы означает заклание животного; «заколол» точно и не создаёт лишнего культового оттенка слова «принёс в жертву».
- source_word: τὸν σιτευτὸν μόσχον
  choice: откормленного телёнка
  rationale: Точная и естественная передача специально откормленного для праздничной трапезы животного.
- source_word: αὐτῷ
  choice: для него
  rationale: Передаёт дательный падеж как обозначение лица, в честь и ради которого устроена трапеза.
theological_decisions:
- issue: Следует ли представить слова о проститутках как установленный факт или как обвинение старшего сына
  choice: Передать обвинение прямо в составе реплики без оговорок
  alternative: Добавить «якобы» или перефразировать как подтверждённое рассказчиком распутство
  rationale: Греческий текст приводит слова старшего сына, но отдельно не подтверждает это обвинение голосом рассказчика. Прямая речь сохраняет данную повествовательную напряжённость без дополнительных пояснений.
translation_notes:
  register: Современный литературный русский язык; речь эмоционально резкая, но без архаизмов. «Этот твой сын» сохраняет презрительное дистанцирование, а «проевший» — образность исходного глагола.
