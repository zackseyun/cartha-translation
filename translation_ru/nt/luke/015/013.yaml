source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: ru
  text: Через несколько дней[a] младший сын, собрав всё, отправился в далёкую страну и там растратил своё имущество[b], живя расточительно[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по прошествии немногих дней».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своё состояние», «свои средства».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ведя безрассудный образ жизни». В этом стихе не названы конкретные пороки, а описан разорительный, беспутный образ жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Через несколько дней
  rationale: Естественно передаёт греческое выражение «по прошествии немногих дней»; буквальная форма отмечена в сноске.
- source_word: συναγαγὼν πάντα
  choice: собрав всё
  rationale: Сохраняет предшествующее отъезду действие и широкий смысл πάντα, не уточняя без необходимости, превратил ли сын имущество в деньги.
- source_word: ὁ νεώτερος υἱός
  choice: младший сын
  rationale: Нормальное современное соответствие сравнительной форме в контексте двух сыновей.
- source_word: ἀπεδήμησεν
  choice: отправился
  rationale: Передаёт отъезд в другое, далёкое место и естественно сочетается с указанием направления.
- source_word: εἰς χώραν μακράν
  choice: в далёкую страну
  rationale: Точно и естественно передаёт χώραν μακράν в современном русском языке.
- source_word: διεσκόρπισεν
  choice: растратил
  rationale: В отношении имущества глагол означает не буквальное рассеивание, а бесполезную, неразумную трату.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: своё имущество
  rationale: Широко передаёт совокупность принадлежавших ему средств и собственности, не сужая смысл до одних денег.
- source_word: ζῶν ἀσώτως
  choice: живя расточительно
  rationale: Передаёт образ жизни, приведший к растрате, и не привносит конкретных пороков, не названных в стихе.
theological_decisions:
- issue: Характер ἀσώτως
  choice: живя расточительно
  alternative: живя распутно
  rationale: Греческий текст здесь характеризует безудержный, разорительный образ жизни, но сам по себе не уточняет сексуальные или иные конкретные грехи; более узкое «распутно» преждевременно снимает эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Через несколько дней» предпочтено буквальному, но тяжеловесному «спустя немного дней». Формулировка «живя расточительно» сохраняет смысловую связь между образом жизни и растратой имущества.
