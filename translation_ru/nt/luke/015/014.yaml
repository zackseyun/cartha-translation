  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: ru
  text: Когда же он всё потратил, по всей той стране наступил сильный голод, и он начал нуждаться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαπανήσαντος δὲ αὐτοῦ πάντα
  choice: Когда же он всё потратил
  rationale: Родительный абсолют с аористным причастием естественно передан временным придаточным. «Потратил» точно отражает δαπανάω и не добавляет оценки «растратил», которой сам глагол здесь не требует; «же» обозначает поворот повествования.
- source_word: ἐγένετο λιμὸς ἰσχυρὰ
  choice: наступил сильный голод
  rationale: ἐγένετο обозначает наступление события, а ἰσχυρά усиливает значение λιμός. Сочетание «наступил сильный голод» естественно для современного русского и сохраняет образ начала бедствия.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: по всей той стране
  rationale: κατά с винительным может обозначать распространение по территории; «по всей той стране» передаёт охват местности. χώρα в контексте дальней страны естественно переводится как «страна».
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: и он начал нуждаться
  rationale: Конструкция ἤρξατο с инфинитивом указывает на начало состояния, а ὑστερεῖσθαι здесь означает испытывать недостаток. «Начал нуждаться» ясно и идиоматично передаёт смысл без неоправданного уточнения того, чего именно ему недоставало.
theological_decisions: []
