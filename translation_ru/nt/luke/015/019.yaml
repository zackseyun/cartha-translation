  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: ru
  text: Я уже недостоин называться твоим сыном; сделай меня одним из твоих наёмных работников.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово обозначает работника, нанятого за плату, в отличие от домашнего раба.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно передаёт временное отрицание и изменение прежнего положения.
- source_word: ἄξιος
  choice: достоин
  rationale: Сохраняет нравственный и социальный смысл соответствия сыновнему статусу.
- source_word: κληθῆναι
  choice: называться
  rationale: Передаёт пассивный инфинитив и допускает как буквальный смысл именования, так и смысл признания в определённом качестве.
- source_word: υἱός
  choice: сыном
  rationale: Сохраняет конкретное мужское обозначение и родственные отношения в притче.
- source_word: ποίησόν με
  choice: прими меня
  rationale: В данном контексте просьба касается предоставления нового положения; буквальное «сделай меня» по-русски звучит неестественно, тогда как «прими меня» ясно передаёт просьбу включить его в число работников, не подменяя её более слабым «обращайся со мной».
- source_word: ὡς
  choice: как
  rationale: Сохраняет сравнительную силу выражения.
- source_word: ἕνα τῶν μισθίων σου
  choice: одного из твоих наёмных работников
  rationale: μίσθιος обозначает работника за плату, а не домашнего раба; формулировка понятна современному читателю и сохраняет социально-экономическое различие.
theological_decisions:
- issue: Статусная лексика в признании сына
  choice: Сохранены «достоин» и «сыном» без смягчения.
  alternative: «Я больше не заслуживаю называться твоим ребёнком»
  rationale: Текст говорит о воспринимаемом героем недостоинстве сыновнего положения; выбранная формулировка сохраняет семейное и общественное измерения, не навязывая дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. «Наёмные работники» точно и нейтрально передаёт μίσθιοι; вариант «батраки» вынесен в примечание как более краткий, но стилистически и исторически окрашенный.
