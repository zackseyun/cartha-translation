  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: И сказал он
  rationale: Аорист εἶπεν вводит следующую часть речи Иисуса, а δέ служит мягкой связкой или переходом. Русское «И сказал он» естественно продолжает повествование, не придавая связке излишне строгого временного или противопоставительного значения.
- source_word: Ἄνθρωπός τις
  choice: у одного человека
  rationale: В конструкции принадлежности с εἶχεν по-русски естественно сказать «у одного человека было». Слово «одного» передаёт неопределённость τις и вводит не названного по имени персонажа, не создавая неестественного оттенка выражением «некий человек».
- source_word: εἶχεν
  choice: было
  rationale: Имперфект ἔχω описывает исходное положение в притче. Русская конструкция «у ... было» идиоматично выражает обладание в прошедшем времени.
- source_word: δύο
  choice: два
  rationale: Прямой эквивалент количественного числительного.
- source_word: υἱούς
  choice: сына
  rationale: υἱούς обозначает именно сыновей; форма «сына» требуется русским управлением после числительного «два» и сохраняет существенную для притчи семейную связь.
theological_decisions:
- issue: Степень определённости выражения Ἄνθρωπός τις
  choice: у одного человека
  alternative: 'у некоего человека; у одного человека[a] с примечанием «Или: У человека»'
  rationale: '«У одного человека» сохраняет лёгкую индивидуализацию, выраженную τις, но не привносит в персонажа дополнительного символического значения. Отдельная сноска не нужна: русская формулировка одновременно естественна и достаточно полно передаёт исходный оборот.'
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и устно естественная формулировка. Порядок «сказал он» поддерживает повествовательный библейский регистр без архаизации.
