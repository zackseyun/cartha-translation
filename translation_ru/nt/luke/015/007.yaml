source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: ru
  text: 'Говорю вам: так[a] и на небесах будет больше радости об одном грешнике, который кается, чем о девяноста девяти праведниках[b], которым не нужно каяться.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таким образом»; «так же». Эти слова связывают небесную радость с основной мыслью предшествующей притчи.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте сказано «праведники». В контексте это слово можно понимать прямо или иронически; перевод сохраняет эту неоднозначность.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Говорю вам
  rationale: Естественная и торжественная вводная формула, сохраняющая прямое обращение.
- source_word: οὕτως
  choice: так
  rationale: Кратко и естественно связывает вывод с предшествующей притчей; возможные оттенки пояснены в сноске.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: на небесах будет больше радости
  rationale: Сохраняет будущее время и указание на место радости, не называя тех, кто радуется. Слово «больше» раскрывает сравнительную конструкцию с ἤ.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι
  choice: об одном грешнике, который кается
  rationale: Предлог передаёт предмет радости, а придаточное сохраняет активное и продолжающееся значение причастия настоящего времени.
- source_word: ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις
  choice: чем о девяноста девяти праведниках
  rationale: ἤ в данном сравнении естественно передаётся словом «чем»; субстантивированное прилагательное переведено существительным «праведники».
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: которым не нужно каяться
  rationale: Современная русская формулировка ясно передаёт отсутствие нужды в покаянии, не меняя утверждения текста.
theological_decisions:
- issue: Относится ли слово «праведники» к действительно праведным людям или употреблено иронически
  choice: Сохранить прямое обозначение «праведники» и отметить неоднозначность в сноске.
  alternative: Передать как «те, кто считает себя праведным» или выделить слово кавычками.
  rationale: Греческий текст прямо говорит «праведники» и формально не обозначает иронию; перевод не должен снимать возможное смысловое напряжение.
- issue: Кто именно радуется на небесах
  choice: Сохранить безличную конструкцию «на небесах будет… радости».
  alternative: Указать Бога, ангелов или небесных обитателей как субъект радости.
  rationale: Стих называет место радости, но не указывает её действующих субъектов; их добавление выходило бы за пределы греческой формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «радость о ком-либо» несколько возвышенная, но ясная и позволяет сохранить предмет радости без добавления не названных в тексте действующих лиц.
