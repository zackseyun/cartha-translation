  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: ru
  text: Но он рассердился и не хотел войти[a]. Тогда отец его вышел и стал уговаривать его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не желал войти»; возможно также: «отказался войти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «настойчиво просил его». Форма греческого глагола указывает на продолжавшееся обращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: рассердился
  rationale: Аорист ὀργίζομαι здесь естественно передаёт наступление гнева. «Рассердился» выражает это без чрезмерного усиления, возможного в варианте «пришёл в ярость».
- source_word: δὲ
  choice: но
  rationale: Первое δέ обозначает контраст между всеобщим празднованием и реакцией старшего сына.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: не хотел войти
  rationale: θέλω с инфинитивом выражает желание или волю. Формулировка сохраняет волевой оттенок, не усиливая его до однозначного «отказался войти».
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: тогда отец его
  rationale: Второе δέ вводит ответное действие отца. «Тогда» естественно передаёт развитие повествования, а «отец его» сохраняет связь с сыном.
- source_word: ἐξελθὼν
  choice: вышел
  rationale: Причастие ἐξέρχομαι обозначает выход отца из дома; в русском последовательность действий естественно передаётся личной формой глагола.
- source_word: παρεκάλει
  choice: стал уговаривать
  rationale: παρακαλέω здесь обозначает настойчивое обращение или просьбу, а имперфект указывает на продолжавшееся действие. Конструкция «стал уговаривать» передаёт и начало, и длительность обращения.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к старшему сыну и прямо передаётся русским «его».
theological_decisions:
- issue: Характер обращения отца к старшему сыну
  choice: стал уговаривать его
  alternative: настойчиво просил его; умолял его
  rationale: Перевод сохраняет сердечную и настойчивую инициативу отца, но не усиливает её до униженной мольбы и не привносит дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык; повествование простое и достоинственное. Выбраны общеупотребительные «рассердился» и «уговаривать», при этом волевой оттенок нежелания сына и длительность обращения отца сохранены.
