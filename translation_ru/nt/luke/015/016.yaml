lexical_decisions:
- source_word: ἐπεθύμει
  choice: ему хотелось
  rationale: Имперфект передаёт продолжительное сильное желание; в данном контексте естественная русская формулировка выражает мучительный голод без излишнего усиления.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: наполнить желудок
  rationale: Сохраняется конкретный телесный образ греческого текста; «насытиться» было бы более толковательным.
- source_word: ἀπὸ τῶν κερατίων
  choice: стручками рожкового дерева
  rationale: Предлог ἀπό при глаголе наполнения естественно передаётся русским творительным падежом, а κεράτια конкретно обозначает плоды рожкового дерева.
- source_word: οἱ χοῖροι
  choice: свиньи
  rationale: Современное нейтральное и точное соответствие.
- source_word: ἤσθιον
  choice: ели
  rationale: Русский несовершенный вид передаёт длительное фоновое действие имперфекта.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: никто ничего ему не давал
  rationale: Несовершенный вид сохраняет продолжительность отсутствия помощи; «ничего» естественно восполняет подразумеваемый объект.
