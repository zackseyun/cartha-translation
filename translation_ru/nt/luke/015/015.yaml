    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: пошёл
  rationale: Аористное причастие передаёт предшествующее действие; «пошёл» естественно связывает его с главным глаголом.
- source_word: ἐκολλήθη
  choice: нанялся к
  rationale: Буквально глагол означает «прикрепился, примкнул» и подразумевает тесную, зависимую связь. В данном контексте отправки на работу «нанялся к» естественно передаёт ситуацию, не устраняя буквального образа, отмеченного в сноске.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: к одному из жителей
  rationale: πολίτης может обозначать гражданина или члена местного сообщества; «житель» звучит естественно в русском повествовании и не привносит современного юридического оттенка гражданства.
- source_word: τῆς χώρας ἐκείνης
  choice: той страны
  rationale: χώρα здесь продолжает упоминание дальней страны и естественно переводится как «страна».
- source_word: ἔπεμψεν αὐτόν
  choice: тот послал его
  rationale: 'Указательное «тот» ясно обозначает смену субъекта: посылает упомянутый житель, а не сын.'
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: на свои поля
  rationale: Сохраняется множественное число ἀγρούς; «на поля» — естественное русское обозначение направления.
- source_word: βόσκειν χοίρους
  choice: пасти свиней
  rationale: βόσκω охватывает кормление и выпас скота; русское «пасти свиней» идиоматично и точно описывает порученную работу.
