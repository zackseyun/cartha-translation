base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: ru
  text: 'Но придя в себя[a], он сказал: «У скольких наёмных работников моего отца хлеба более чем достаточно[b], а я здесь погибаю от голода[c]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «опомнившись». Буквально по-гречески: «придя к себе».'
    reason: lexical_alternative
  - marker: b
    text: Или «хлеба с избытком».
    reason: lexical_alternative
  - marker: c
    text: Или «умираю от голода».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: придя в себя
  rationale: Сохраняет образ греческого выражения и естественно передаёт возвращение к ясному осознанию своего положения; возможное значение «опомнившись» вынесено в примечание.
- source_word: ἔφη
  choice: он сказал
  rationale: Аорист в повествовании естественно передаётся русским глаголом совершенного вида в прошедшем времени.
- source_word: μίσθιοι
  choice: наёмные работники
  rationale: Речь идёт о людях, работающих за плату, а не о рабах или постоянных домашних слугах.
- source_word: περισσεύονται ἄρτων
  choice: хлеба более чем достаточно
  rationale: Передаёт значение изобилия и избытка, сохраняя конкретное слово «хлеб» и выражая конструкцию естественно по-русски.
- source_word: ἄρτων
  choice: хлеба
  rationale: Сохранён конкретный образ исходного текста без обобщения до «еды» или «пищи».
- source_word: λιμῷ
  choice: от голода
  rationale: В данном контексте существительное обозначает испытываемый голод, а русская причинная конструкция естественно сочетается с «погибаю».
- source_word: ὧδε
  choice: здесь
  rationale: Подчёркивает противопоставление нынешнего бедственного положения сына достатку работников его отца.
- source_word: ἀπόλλυμαι
  choice: погибаю
  rationale: Сохраняет широкий и сильный смысл продолжающейся гибели, не сводя его без необходимости только к буквальному умиранию.
