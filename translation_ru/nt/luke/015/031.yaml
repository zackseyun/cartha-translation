lexical_decisions:
- source_word: Τέκνον
  choice: Дитя
  rationale: Обращение τέκνον буквально обозначает ребёнка или дитя и здесь выражает тёплое семейное отношение. «Дитя» сохраняет нежность обращения и не заменяет исходное слово более узким υἱός («сын»), хотя по-русски звучит несколько возвышенно.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой и естественный русский эквивалент со значением постоянного пребывания.
- source_word: μετ’ ἐμοῦ
  choice: со мной
  rationale: μετά с родительным падежом выражает совместность; «со мной» точно и естественно передаёт эту связь.
- source_word: πάντα τὰ ἐμὰ
  choice: всё моё
  rationale: Субстантивированное neutrum plural охватывает всё принадлежащее отцу; русское «всё моё» передаёт эту совокупность без ненужного уточнения об имуществе.
- source_word: σά ἐστιν
  choice: твоё
  rationale: Краткая именная конструкция «всё моё — твоё» близко сохраняет греческую структуру и оставляет широким смысл принадлежности.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Но он сказал ему
  rationale: δέ здесь обозначает мягкий контраст между жалобой старшего сына и ответом отца; союз «но» естественно передаёт этот переход.
theological_decisions:
- issue: Семейное обращение отца к старшему сыну
  choice: Передать τέκνον как «Дитя»
  alternative: «Сын» или «сын мой»
  rationale: Обращение подчёркивает близость и нежность, но в греческом стоит τέκνον, а не более конкретное υἱός. Вариант «Дитя» сохраняет лексическую широту оригинала; «сын» дан в примечании как естественная русская альтернатива, а «сын мой» не выбран, поскольку добавляет отсутствующее в тексте притяжательное местоимение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Слово «Дитя» слегка возвышенно, однако уместно в прямой речи отца и позволяет сохранить особое греческое обращение; тире в «всё моё — твоё» делает именную конструкцию естественной по-русски.
