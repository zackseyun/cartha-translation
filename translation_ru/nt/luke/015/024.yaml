    rationale: Греческая перипрастическая конструкция с совершенным причастием обозначает состояние «был потерян» (или «был пропавшим»), а не процесс «пропадал». Русское «пропадал» может быть понятo как «исчезал/гиб», что менее точно передаёт мотив «потерян — найден».
