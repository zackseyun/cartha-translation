source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: ru
  text: Ведь этот мой сын был мёртв и ожил; был потерян и нашёлся. И они начали праздновать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Передаёт причинное объяснение предшествующего призыва праздновать и естественно звучит в прямой речи.
- source_word: οὗτος ὁ υἱός μου
  choice: этот мой сын
  rationale: Сохраняет указательное усиление οὗτος и при этом соответствует естественному русскому порядку слов.
- source_word: νεκρὸς ἦν
  choice: был мёртв
  rationale: Прямо сохраняет резкий образ смерти, не заменяя его толкованием об отчуждении.
- source_word: ἀνέζησεν
  choice: ожил
  rationale: Кратко и естественно передаёт возвращение к жизни; приставочное значение повторности в русском контексте уже ясно из противопоставления «был мёртв».
- source_word: ἦν ἀπολωλὼς
  choice: пропадал
  rationale: Передаёт состояние отсутствующего, считавшегося потерянным человека и образует естественную русскую пару «пропадал и нашёлся».
- source_word: εὑρέθη
  choice: нашёлся
  rationale: Естественная русская форма для обнаружившегося пропавшего человека; не называет действующее лицо и сохраняет смысл греческого пассива.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: начали праздновать
  rationale: Сохраняет начинательное значение ἤρξαντο, а «праздновать» точно соответствует пиршественному ликованию в данном контексте.
theological_decisions:
- issue: Метафорическая сила слов «мёртв» и «ожил»
  choice: Сохранить прямую лексику смерти и возвращения к жизни без поясняющего пересказа.
  alternative: Передать как «был для нас словно мёртв и вернулся к прежней жизни».
  rationale: Внутри притчи эти слова описывают восстановление сына после отчуждения, однако текст намеренно использует сильный образ смерти и жизни; перевод не должен заранее снимать это смысловое напряжение.
- issue: Неуказанный деятель в εὑρέθη
  choice: Передать как «нашёлся», не называя того, кто нашёл.
  alternative: «его нашли».
  rationale: Греческий пассив оставляет деятеля невыраженным. Русское «нашёлся» естественно сохраняет эту открытость и перекликается с мотивом потерянного и найденного в главе.
translation_notes:
  register: Современный литературный русский язык; речь естественная, но достойная. Симметричные пары «был мёртв и ожил; пропадал и нашёлся» сохраняют ритм и образность оригинала. Лексические варианты не требуют сносок, поскольку русские видо-временные формы естественно передают греческие конструкции без существенной смысловой потери.
