  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: ru
  text: 'Он ответил ему: «Твой брат пришёл, и твой отец заколол откормленного телёнка, потому что получил его обратно живым и здоровым[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «здоровым». Греческое причастие ὑγιαίνοντα означает «здоровым»; в данном контексте оно может передавать более широкий смысл благополучного возвращения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: вернулся
  rationale: В контексте притчи речь не просто о прибытии, а о возвращении брата домой; совершившееся действие имеет наличный результат.
- source_word: ἔθυσεν
  choice: заколол
  rationale: Глагол обозначает заклание животного, здесь — для праздничной трапезы; перевод не создаёт ненужного впечатления о культовом жертвоприношении.
- source_word: μόσχον τὸν σιτευτόν
  choice: откормленного телёнка
  rationale: Естественно передаёт животное, специально откормленное и прибережённое для особого пира.
- source_word: ὑγιαίνοντα
  choice: живым и невредимым
  rationale: В данном контексте естественное русское выражение передаёт благополучное возвращение; буквально причастие может означать состояние здоровья или благополучия.
- source_word: ἀπέλαβεν
  choice: получил его обратно
  rationale: Сохраняет значение возвращения или обретения прежде отсутствовавшего сына, не усиливая его до более толковательного «обрёл».
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 'Он ответил ему:'
  rationale: δέ здесь имеет слабую связующую функцию, а ὅτι вводит прямую речь; «ответил» естественно в диалогическом контексте.
