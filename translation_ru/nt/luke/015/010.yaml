id: LUK.15.10
reference: Luke 15:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: ru
  text: Так же, говорю вам, перед ангелами Божьими бывает радость об одном грешнике, который кается.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед ангелами Божьими». Эти слова прямо не утверждают, что радуются именно ангелы.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Кратко и естественно связывает вывод с предшествующей притчей, сохраняя значение «таким же образом».
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохраняет прямое обращение и обычную для речи Иисуса формулу без стилистического утяжеления.
- source_word: γίνεται χαρά
  choice: бывает радость
  rationale: Передаёт возникновение радости и естественно сочетается с обобщающим «так»; не вводит прямо названного субъекта радости.
- source_word: ἐνώπιον
  choice: перед
  rationale: Формально и ясно передаёт пространственно-сферическое значение «в присутствии», не утверждая, что именно ангелы радуются.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: ангелами Божьими
  rationale: Естественная современная русская форма, сохраняющая принадлежность ангелов Богу и умеренно библейский регистр.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: об одном грешнике
  rationale: Передаёт повод и предмет радости; «об» в русском естественно употребляется с радостью по поводу человека или события.
- source_word: μετανοοῦντι
  choice: который кается
  rationale: Относительное предложение естественно по-русски передаёт причастие настоящего времени и сохраняет широкое библейское содержание покаяния без доктринального разъяснения.
theological_decisions:
- issue: Смысл языка покаяния
  choice: который кается
  alternative: который меняет образ мыслей / обращается
  rationale: «Каяться» — точный и понятный библейский термин; стих не определяет покаяние подробнее, поэтому перевод не сужает его до одной интеллектуальной или поведенческой стороны.
- issue: Место или субъект радости
  choice: радость перед ангелами Божьими
  alternative: ангелы Божьи радуются / радость среди ангелов Божьих
  rationale: Греческий текст прямо говорит, что радость бывает «перед» ангелами, но не называет их грамматическим субъектом радости. Формулировка сохраняет эту богословски значимую открытость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Порядок слов остаётся ясным и близким к греческому; неоднозначность относительно того, кто именно радуется, сохранена. Маркер сноски поставлен после всего предложения, к которому относится пояснение.
