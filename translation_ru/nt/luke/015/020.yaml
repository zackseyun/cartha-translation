base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: ru
  text: Он встал и пошёл к своему отцу. И когда он был ещё далеко, отец увидел его, сжалился над ним, побежал ему навстречу, бросился ему на шею и горячо поцеловал его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может подразумевать усиленное, сердечное и, возможно, многократное целование.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Аористное причастие обозначает решительное действие сына перед его движением к отцу; «встал» прямо передаёт последовательность повествования.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: пошёл к своему отцу
  rationale: ἔρχομαι допускает значение «идти/приходить» в зависимости от точки зрения; здесь русское «пошёл» естественно продолжает решение сына и не предполагает, что он уже достиг цели.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: когда он был ещё далеко
  rationale: Генитив абсолютный передаёт одновременное обстоятельство; формулировка естественна по-русски и сохраняет пространственную дистанцию.
- source_word: ἐσπλαγχνίσθη
  choice: сжалился над ним
  rationale: Глагол выражает глубокое внутреннее сострадание; «сжалился» передаёт эмоциональную силу кратко и по-русски естественно.
- source_word: δραμὼν
  choice: побежал ему навстречу
  rationale: «Побежал» прямо передаёт действие, а «ему навстречу» естественно выражает направленность бега, ясную из сцены.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: бросился ему на шею
  rationale: Сохраняется яркий греческий образ и употребляется понятная современная русская идиома без сведения действия к нейтральному «обнял».
- source_word: κατεφίλησεν
  choice: стал горячо целовать его
  rationale: Сложный глагол может выражать усиленное, сердечное и, возможно, повторяющееся целование. Выбор сохраняет интенсивность, а несовершенный инфинитив естественно допускает длительность или повторность, не навязывая её как единственно возможную.
theological_decisions:
- issue: Изображение сострадания отца в притче
  choice: Сохранить эмоционально насыщенную инициативу отца без аллегорического пояснения.
  alternative: Ослабить эмоциональную окраску либо прямо отождествить действия отца с действиями Бога.
  rationale: Сам текст подчёркивает сострадание отца цепью ярких действий. Перевод должен сохранить эту силу, но не добавлять богословского толкования, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Синтаксис плавный и повествовательный; яркие телесные образы оригинала сохранены. Маркер сноски поставлен непосредственно после выражения, к которому относится.
