  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: ru
  text: 'И фарисеи, и книжники роптали, говоря: «Этот человек принимает[a] грешников и ест с ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радушно принимает».'
    reason: Лексическая альтернатива для προσδέχεται, позволяющая явнее передать благосклонный характер приёма.
lexical_decisions:
- source_word: διεγόγγυζον
  choice: роптали
  rationale: Имперфект передаёт продолжавшееся или повторявшееся недовольное ворчание; «роптали» естественно и точно сохраняет отрицательный оттенок глагола.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: и фарисеи, и книжники
  rationale: Повтор союза «и» передаёт соотносительную конструкцию τε ... καί и подчёркивает участие обеих групп; «книжники» — устоявшееся евангельское обозначение знатоков и толкователей Закона.
- source_word: λέγοντες
  choice: говоря
  rationale: Деепричастие передаёт одновременность речи с ропотом и сохраняет структуру греческой фразы.
- source_word: Οὗτος
  choice: Он
  rationale: В русском указательное «этот» без существительного звучит неестественно, а «этот человек» может чрезмерно усилить пренебрежение, которое контекст допускает, но не требует выражать явно.
- source_word: ἁμαρτωλοὺς
  choice: грешников
  rationale: Субстантивированное прилагательное естественно передаётся традиционным и понятным словом «грешники», сохраняющим социально-религиозную категорию обвинения.
- source_word: προσδέχεται
  choice: принимает
  rationale: «Принимает» сохраняет широкий смысл благосклонного допущения и общения, не сужая его до гостеприимной встречи и не привнося современных психологических оттенков слова «принимает» в значении одобрения.
- source_word: συνεσθίει αὐτοῖς
  choice: ест с ними
  rationale: Прямой перевод ясно выражает совместную трапезу и сохраняет её социальное значение без пояснительного расширения.
theological_decisions:
- issue: Социальный и богословский смысл общения Иисуса с грешниками
  choice: 'Передать обвинение прямо: Он принимает грешников и разделяет с ними трапезу.'
  alternative: «Он радушно встречает грешников и ест с ними».
  rationale: Текст подчёркивает вызывавшее возмущение благосклонное отношение Иисуса к людям, обозначенным как грешники, и совместную еду с ними. Перевод не смягчает этого, но и не добавляет оценки, которой нет в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Роптали» и «книжники» dignified и широко понятны в евангельском контексте; фраза обвинения оставлена простой и разговорно естественной.
