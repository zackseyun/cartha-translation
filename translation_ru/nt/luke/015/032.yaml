id: LUK.15.32
reference: Luke 15:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: ru
  text: Но надо было праздновать и радоваться[a], потому что этот твой брат был мёртв и ожил[b], пропал и нашёлся[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «следовало праздновать и радоваться».'
    reason: Лексема ἔδει может выражать как необходимость, так и то, что было подобающим или уместным.
  - marker: b
    text: Греческое слово может означать «жил»; в противопоставлении с «был мёртв» оно естественно передаётся как «ожил». В притче это, вероятно, образ восстановления отношений.
    reason: Сноска отмечает буквальное значение глагола и его вероятное образное употребление в контексте, не навязывая толкования.
  - marker: c
    text: 'Или, более буквально: «был найден».'
    reason: Греческий глагол стоит в страдательном залоге, тогда как русское «нашёлся» естественнее в сочетании с «пропал».
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: праздновать
  rationale: В контексте устроенного пиршества передаёт не только внутреннюю радость, но и праздничное веселье; звучит естественно и современно.
- source_word: χαρῆναι
  choice: радоваться
  rationale: Сохраняет второе, близкое по смыслу выражение радости и не сводит греческую пару глаголов к одному слову.
- source_word: ἔδει
  choice: надо было
  rationale: Передаёт безличную необходимость или должное поведение, не добавляя в текст неопределённого субъекта «мы».
- source_word: ὁ ἀδελφός σου οὗτος
  choice: этот твой брат
  rationale: Сохраняет указательное местоимение и подчёркнутое напоминание отца о братских отношениях, оставаясь естественным по-русски.
- source_word: νεκρὸς ἦν
  choice: был мёртв
  rationale: Воспроизводит прямой образ смерти; его метафорический смысл раскрывается контекстом притчи, а не поясняющей вставкой в перевод.
- source_word: ἔζησεν
  choice: ожил
  rationale: Кратко и естественно передаёт противопоставление смерти и возвращения к жизни. Русский глагол уже заключает в себе значение перехода к жизни, поэтому добавление «снова» необязательно.
- source_word: ἀπολωλὼς
  choice: пропадал
  rationale: Передаёт состояние утраченности в привычной русской паре «пропадал и нашёлся», не усиливая смысл до «погиб» или «был уничтожен».
- source_word: εὑρέθη
  choice: нашёлся
  rationale: Это естественное русское выражение для обнаружения пропавшего; буквальная пассивная конструкция отмечена в сноске.
theological_decisions:
- issue: Следует ли прямо истолковывать νεκρὸς ἦν καὶ ἔζησεν как духовное или нравственное восстановление
  choice: 'Сохранён образ: «был мёртв и ожил».'
  alternative: «Был отчуждён и вернулся» или иная разъясняющая передача.
  rationale: В притче эти слова описывают восстановление сына образным языком смерти и жизни. Перевод сохраняет сам образ и его богословскую ёмкость, не превращая его ни в буквальное утверждение о телесном воскресении, ни в узкое толкование.
- issue: Степень обязательности в ἔδει
  choice: «Надо было».
  alternative: «Следовало» или «необходимо было».
  rationale: Форма допускает оттенки необходимости и уместности. Основной вариант сохраняет силу должного, а сноска отмечает возможный оттенок уместности.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Пара «праздновать и радоваться» сохраняет смысловую двойственность греческих инфинитивов; «пропадал и нашёлся» звучит идиоматично и узнаваемо. Все пояснения, способные сузить образный смысл, вынесены в сноски.
