  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: ru
  text: 'И, придя домой[a], он созывает друзей и соседей и говорит им: «Порадуйтесь вместе со мной[b]: я нашёл свою овцу, которая потерялась[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «придя в дом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Разделите мою радость».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «свою потерявшуюся овцу». Буквально: «свою овцу — ту, что потерялась».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: придя домой
  rationale: Аористное причастие передаёт предшествующее действие; русское «придя домой» естественно выражает движение в дом, хотя буквально сказано «придя в дом».
- source_word: συγκαλεῖ
  choice: созывает
  rationale: Глагол означает собрать людей, позвав их; «созывает» точно и естественно передаёт это значение.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: друзей и соседей
  rationale: Прямые современные соответствия греческим существительным.
- source_word: λέγων αὐτοῖς
  choice: и говорит им
  rationale: Сочинительная конструкция в русском звучит естественнее буквального «говоря им» и сохраняет связь с основным действием.
- source_word: Συγχάρητέ μοι
  choice: Порадуйтесь вместе со мной
  rationale: Форма συγχαίρω призывает разделить радость говорящего; перевод сохраняет как радость, так и совместность.
- source_word: ὅτι
  choice: двоеточие перед «я нашёл»
  rationale: ὅτι вводит основание для призыва. В прямой русской речи причинная связь естественно и ясно выражается бессоюзной конструкцией после двоеточия.
- source_word: εὗρον
  choice: я нашёл
  rationale: Русское прошедшее совершенного вида естественно передаёт завершённое нахождение и его актуальный результат.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: свою овцу, которая потерялась
  rationale: Относительное придаточное отражает греческую конструкцию «мою овцу — ту, что была потеряна» и сохраняет состояние потерянности без истолкования образа.
theological_decisions:
- issue: Приточный образ возвращения потерянного
  choice: Сохранить конкретный образ овцы, которая потерялась
  alternative: Передать образ истолковательно как грешника или спасённого человека
  rationale: В самом стихе дан образ притчи; его богословское применение раскрывает контекст, поэтому в перевод не следует вносить пояснение о грешниках или спасении.
- issue: Характер совместной радости
  choice: «Порадуйтесь вместе со мной»
  alternative: «Отпразднуйте со мной»
  rationale: Выбранный вариант прямо сохраняет мотив общей радости, не добавляя обязательного оттенка устроенного празднования.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Домой» выбрано ради естественности; более буквальная форма отмечена в сноске. Порядок маркеров в основном тексте соответствует порядку сносок.
