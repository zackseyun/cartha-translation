  source_fidelity: 'Перевод точно передаёт последовательность действий и основные элементы греческого текста: придя в дом/домой, человек созывает друзей и соседей и призывает их разделить его радость, потому что нашёл овцу, которая была потеряна. «Домой» является естественной русской идиомой для εἰς τὸν οἶκον и надлежащим образом снабжено буквальной альтернативой в сноске. Прошедшее «я нашёл» естественно передаёт аорист εὗρον. Относительное придаточное «которая потерялась» сохраняет образ потерянной овцы без богословской интерпретации.'
