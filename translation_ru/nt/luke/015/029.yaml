base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: ru
  text: 'Но он ответил отцу: «Вот, столько лет я служу тебе[a] и ни разу не нарушил твоего повеления, а ты ни разу не дал мне даже козлёнка, чтобы повеселиться с друзьями».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может означать не только «служить», но и «служить как раб, быть порабощённым». Здесь более сильный оттенок подчёркивает горечь старшего сына.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: сказал … в ответ
  rationale: Естественно передаёт обычное греческое сочетание со значением ответа, не сохраняя избыточное для русского «ответив, сказал».
- source_word: τῷ πατρὶ αὐτοῦ
  choice: отцу
  rationale: Контекст однозначно указывает, что речь обращена к его отцу; русское «сказал отцу в ответ» естественно передаёт дательный адресата.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современный русский указательно-эмфатический маркер, сохраняющий резкий, привлекающий внимание тон реплики.
- source_word: τοσαῦτα ἔτη
  choice: столько лет
  rationale: Естественное русское выражение длительности, сохраняющее эмоциональное подчёркивание продолжительности.
- source_word: δουλεύω σοι
  choice: служу тебе
  rationale: Сохраняет основное значение подчинённого служения и допускает более сильный оттенок рабского труда, пояснённый в сноске, не превращая жалобу сына в утверждение о буквальном рабстве.
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: ни разу не нарушил твоего повеления
  rationale: Передаёт παρέρχομαι в контексте заповеди как нарушение или отступление от неё; «повеление» сохраняет серьёзный, но понятный регистр.
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: ты ни разу не дал мне даже козлёнка
  rationale: «Козлёнок» точно и понятно передаёт ἔριφος; «даже» выражает подразумеваемое в жалобе противопоставление скромного дара устроенному пиру.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: чтобы я мог повеселиться с друзьями
  rationale: Естественно передаёт целевое придаточное и праздничное значение εὐφραίνω в контексте совместной трапезы.
theological_decisions:
- issue: Сила выражения δουλεύω в речи старшего сына
  choice: служу тебе
  alternative: тружусь на тебя как раб / нахожусь у тебя в рабстве
  rationale: Глагол принадлежит к лексической группе рабского служения и усиливает горечь сына, однако контекст не требует утверждать его буквальный рабский статус. Основной текст сохраняет смысловую открытость, а сноска сообщает о более сильном оттенке.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи и без архаизмов. Повтор «ни разу» сохраняет настойчивость жалобы; союз «а» естественно оформляет резкое противопоставление.
