lexical_decisions:
- source_word: εὑρὼν
  choice: найдя её
  rationale: Аористное действительное причастие передаёт действие, предшествующее основному. Объект «её» восполнен из непосредственного контекста, где речь идёт о потерянной овце.
- source_word: ἐπιτίθησιν
  choice: кладёт
  rationale: Настоящее время сохраняет живость повествования; «кладёт ... на плечи» естественно передаёт действие помещения ноши на плечи.
- source_word: ἐπὶ τοὺς ὤμους
  choice: себе на плечи
  rationale: ἐπί с винительным обозначает движение или помещение на поверхность; множественное число ὤμους передано словом «плечи». Возвратное «себе» естественно указывает, что это плечи пастуха.
- source_word: αὐτοῦ
  choice: себе
  rationale: Местоимение относится к пастуху. В русском сочетании «кладёт себе на плечи» возвратная форма звучит естественнее буквального «на его плечи» и устраняет возможную двусмысленность.
- source_word: χαίρων
  choice: с радостью
  rationale: Причастие настоящего времени выражает сопутствующее состояние. Оборот «с радостью» естественно и без смыслового усиления передаёт, что пастух радуется, совершая действие.
theological_decisions:
- issue: Восполнение прямого дополнения при εὑρὼν и ἐπιτίθησιν
  choice: Местоимение «её» добавлено в обоих оборотах как указание на потерянную овцу.
  alternative: «А найдя, кладёт себе на плечи, радуясь».
  rationale: В греческом дополнение может оставаться подразумеваемым благодаря контексту, однако по-русски его восполнение делает фразу ясной и естественной, не изменяя смысла притчи.
- issue: Связь χαίρων с действием пастуха
  choice: «с радостью»
  alternative: «радуясь»
  rationale: Оба варианта сохраняют сопутствующую радость пастуха; предложный оборот лучше вписывается в современную русскую фразу и не определяет причину радости сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным и повествовательно живым синтаксисом. Начальное «А» связывает стих с предшествующим условным описанием поисков; настоящее «кладёт» сохраняет наглядность греческого исторического настоящего.
