  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: ru
  text: А найдя её[a], он с радостью кладёт её себе на плечи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть потерянную овцу, о которой говорится в предыдущем стихе.
