source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: ru
  text: 'Встану, пойду к моему отцу и скажу ему: «Отец, я согрешил против неба[a] и перед тобой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть против Бога; «небо» здесь, вероятно, служит благоговейным обозначением Бога.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в твоих глазах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Встану
  rationale: 'Аористное причастие обозначает первое действие в принятом сыном решении. В русском естественно передать его личной формой будущего времени перед следующим глаголом: «Встану, пойду».'
- source_word: πορεύσομαι
  choice: пойду
  rationale: Будущая форма πορεύομαι обозначает движение к отцу. «Пойду» ясно и естественно передаёт это значение, не добавляя отсутствующих в греческом оттенков.
- source_word: πρὸς τὸν πατέρα μου
  choice: к моему отцу
  rationale: Предлог πρός с винительным падежом указывает на движение к человеку. «К моему отцу» точно передаёт направление и сохраняет притяжательное местоимение.
- source_word: ἐρῶ αὐτῷ
  choice: скажу ему
  rationale: Будущее время λέγω с дательным косвенного объекта естественно передаётся как «скажу ему».
- source_word: Πάτερ
  choice: Отец
  rationale: Сохраняется прямое обращение без добавления притяжательного местоимения, которого в греческом обращении нет.
- source_word: ἥμαρτον
  choice: я согрешил
  rationale: Аорист ἁμαρτάνω выражает совершённый грех, который сын теперь исповедует. Русская форма совершенного вида «согрешил» естественно передаёт завершённость и сохраняющуюся нравственную значимость поступка.
- source_word: εἰς τὸν οὐρανὸν
  choice: против неба[a]
  rationale: Буквально сохраняется слово «небо», вероятно служащее благоговейным обозначением Бога. Оборот с εἰς в данном контексте передаёт направленность греха против того, кто назван «небом».
- source_word: ἐνώπιόν σου
  choice: перед тобой[b]
  rationale: ἐνώπιον с родительным означает «перед, в присутствии, в глазах». «Перед тобой» сохраняет отличительное выражение оригинала и не сливает его с предыдущим оборотом в единое «против тебя».
theological_decisions:
- issue: Следует ли прямо заменить «небо» словом «Бог» в основном тексте
  choice: 'Сохранить «небо»: «я согрешил против неба»'
  alternative: «я согрешил против Бога»
  rationale: Хотя «небо», вероятно, является благоговейным косвенным обозначением Бога, греческий текст употребляет οὐρανός. Сохранение исходного образа не устраняет присущую выражению богословскую и языковую многозначность; значение поясняется в сноске.
- issue: Следует ли переводить ἐνώπιόν σου как «против тебя»
  choice: «перед тобой»
  alternative: «против тебя»
  rationale: Вторая часть исповедания буквально говорит о грехе, совершённом «перед» отцом или «в его глазах». Перевод «против тебя» возможен по смыслу, но сглаживает различие между двумя греческими оборотами.
translation_notes:
  register: Современный литературный русский язык с естественным, но достойным звучанием. Последовательность «Встану, пойду» кратко и выразительно передаёт решимость сына; обращение и исповедание сохраняют торжественную простоту оригинала.
