  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: ru
  text: 'Но отец сказал своим рабам[a]: «Скорее принесите лучшую одежду[b] и оденьте его; наденьте ему на руку кольцо[c] и сандалии на ноги».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугам». Греческое слово обозначает рабов или зависимых домашних слуг.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «первую одежду»; вероятный смысл — лучшую или главную одежду.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте сказано просто «кольцо»; иногда его понимают как перстень-печать, служивший знаком восстановленного положения.
    reason: interpretive_clarification
lexical_decisions:
- source_word: δούλους
  choice: рабам
  rationale: Слово обозначает рабов или зависимых домашних слуг; «рабам» прямо передаёт социальное положение, отражённое в греческом тексте.
- source_word: Ταχὺ
  choice: Скорее
  rationale: Наречие выражает требование действовать без промедления; «скорее» естественно звучит в русском побуждении.
- source_word: ἐξενέγκατε
  choice: принесите
  rationale: В данном контексте повелительная форма означает вынести или принести одежду из дома либо места хранения; русский глагол «принесите» естественно передаёт требуемое действие.
- source_word: στολὴν τὴν πρώτην
  choice: лучшую одежду
  rationale: Буквально «первую одежду»; здесь πρῶτος, вероятнее всего, указывает на первенство по качеству или достоинству. «Одежда» сохраняет значение длинного нарядного одеяния без неуместно узкой современной ассоциации слова «халат».
- source_word: ἐνδύσατε αὐτόν
  choice: оденьте его
  rationale: Прямо и естественно передаёт приказ облачить сына в только что названную одежду.
- source_word: δακτύλιον
  choice: кольцо
  rationale: Греческое слово означает кольцо, но само по себе не уточняет, что оно было перстнем-печатью.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: на руку
  rationale: Так по-русски естественно обозначается надевание украшения; единственное число исходного текста сохранено.
- source_word: ὑποδήματα
  choice: сандалии
  rationale: Передаёт характерную для древнего средиземноморского мира обувь точнее, чем общее «обувь».
- source_word: εἰς τοὺς πόδας
  choice: на ноги
  rationale: Естественная русская конструкция при указании, куда надевают обувь.
- source_word: δὲ
  choice: Но
  rationale: Передаёт повествовательный поворот и мягкое противопоставление словам сына и немедленному распоряжению отца.
theological_decisions:
- issue: Передача δούλους как «рабы» или «слуги»
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет социальную реальность зависимого положения домашних работников и не смягчает исходное слово, не добавляя при этом богословского толкования.
- issue: Передача πρῶτην буквально или идиоматически
  choice: лучшую одежду
  alternative: первую одежду
  rationale: В сочетании с одеждой определение, вероятнее всего, означает наилучшую или главную, а не первую по порядку; буквальная двусмысленность отмечена в сноске.
- issue: Уточнять ли δακτύλιον как перстень-печать
  choice: кольцо
  alternative: перстень-печать
  rationale: Текст прямо называет только кольцо. Возможная функция знака положения или власти остаётся толкованием и не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной повествовательной интонацией. Приказ отца передан кратко и энергично. Термин «рабы» сохраняет историческую конкретность; потенциально неоднозначные «первая одежда» и «кольцо» пояснены, но не истолкованы в основном тексте.
