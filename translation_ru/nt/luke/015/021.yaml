  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: ru
  text: 'Но сын сказал ему: «Отец, я согрешил против неба[a] и перед тобой. Я больше недостоин называться твоим сыном»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение «против неба» употребляет слово «небо» как благоговейный способ указать на Бога; в некоторых переводах его смысл передан прямо: «против Бога».'
    reason: lexical_alternative
  - marker: b
    text: В некоторых рукописях речь сына продолжается словами, соответствующими фразе «Сделай меня одним из своих наёмных работников», как в ст. 19; текст SBLGNT заканчивает предложение словами «твоим сыном».
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Но … сказал
  rationale: δέ — мягкая повествовательная связка; «но» естественно передаёт переход к словам сына после действий отца, не делая противопоставление чрезмерно резким.
- source_word: ὁ υἱὸς αὐτῷ
  choice: сын сказал ему
  rationale: Определённый артикль указывает на уже известного участника повествования; местоименное αὐτῷ сохранено как «ему», без поясняющей замены на «отцу».
- source_word: Πάτερ
  choice: Отец
  rationale: Прямое и естественное соответствие звательной форме; добавление «мой» не требуется и отсутствует в греческом тексте.
- source_word: ἥμαρτον
  choice: я согрешил
  rationale: 'Русский совершенный вид естественно передаёт аорист в формуле признания вины: совершённый грех имеет значение для настоящего.'
- source_word: εἰς τὸν οὐρανὸν
  choice: против неба
  rationale: Сохраняется образная еврейская формула, благоговейно указывающая на Бога, вместо её истолковывающей замены словом «Бог».
- source_word: καὶ ἐνώπιόν σου
  choice: и перед тобой
  rationale: «Перед тобой» сохраняет буквальный пространственно-личностный оттенок ἐνώπιον — «перед, в присутствии» — и в контексте выражает вину сына перед отцом.
- source_word: οὐκέτι
  choice: больше не
  rationale: Естественное современное русское соответствие значению «уже не, более не».
- source_word: ἄξιος
  choice: достоин
  rationale: Передаёт нравственный и семейно-реляционный смысл признания сына.
- source_word: κληθῆναι
  choice: называться
  rationale: Естественно передаёт пассивный инфинитив καλέω в данном контексте; оборот «быть названным» звучал бы тяжелее.
- source_word: υἱός σου
  choice: твоим сыном
  rationale: Творительный падеж после «называться» естественно передаёт греческое именное сказуемое с притяжательным местоимением и сохраняет семейный статус, которого говорящий считает себя недостойным.
theological_decisions:
- issue: Значение слова «небо» в исповедании сына
  choice: Сохранить в тексте выражение «против неба» как благоговейное косвенное указание на грех против Бога.
  alternative: 'Передать истолковывающе: «против Бога».'
  rationale: Греческий текст прямо говорит «против неба». Сохранение формулировки удерживает исходный образ и не подменяет перевод толкованием; значение поясняется в сноске.
- issue: Граница речи сына в этом стихе
  choice: Завершить слова сына выражением «твоим сыном» согласно SBLGNT.
  alternative: 'Добавить: «Прими меня как одного из своих наёмников» — по расширенному чтению некоторых рукописей и формулировке Лк 15:19.'
  rationale: Предоставленный исходный текст заканчивает речь здесь. Более длинное чтение отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с естественным, но достойным повествовательным тоном. Формула «против неба» намеренно сохраняет исходную религиозную образность, а «перед тобой» удерживает буквальный оттенок греческого выражения без архаизации.
