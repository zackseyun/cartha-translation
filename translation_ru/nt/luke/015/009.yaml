base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: ru
  text: 'И, найдя её, она созывает подруг и соседок и говорит: «Порадуйтесь со мной: я нашла драхму[a], которую потеряла».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Драхма — греческая серебряная монета, во многих случаях приблизительно равная дневному заработку работника.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: найдя её
  rationale: Аористное причастие женского рода передаёт действие, предшествующее созыву; местоимение «её» естественно восполняет подразумеваемый объект — драхму.
- source_word: συγκαλεῖ
  choice: созывает
  rationale: Настоящее историческое сохраняет живость повествования, а «созывает» передаёт значение приглашения нескольких людей к себе.
- source_word: φίλας καὶ γείτονας
  choice: подруг и соседок
  rationale: φίλας явно имеет женский род; согласованное социальное окружение женщины естественно передано женскими формами, не утяжеляющими русский текст.
- source_word: Συγχάρητέ μοι
  choice: Порадуйтесь со мной
  rationale: Передаёт призыв разделить радость говорящей и сохраняет связь с корнем χαίρω.
- source_word: δραχμὴν
  choice: драхму
  rationale: Сохранено конкретное название греческой монеты; культурная справка вынесена в сноску.
- source_word: ἣν ἀπώλεσα
  choice: которую потеряла
  rationale: Русское прошедшее время естественно выражает предшествующую утрату без необходимости добавлять видовое или временное уточнение.
