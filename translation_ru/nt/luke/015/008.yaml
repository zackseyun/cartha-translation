id: LUK.15.8
reference: Luke 15:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: ru
  text: Или какая женщина, имея десять драхм, если потеряет одну драхму[a], не зажжёт светильник, не подметёт дом и не станет тщательно искать[b], пока не найдёт её?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Драхма — греческая серебряная монета.
    reason: cultural_note
  - marker: b
    text: 'Или: «усердно искать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Или
  rationale: Сохраняет связь со стоящей перед этим параллельной притчей.
- source_word: τίς γυνὴ
  choice: какая женщина
  rationale: Естественно передаёт риторический вопрос, не добавляя отсутствующего в греческом тексте выражения «из вас».
- source_word: δραχμὰς / δραχμὴν
  choice: драхм / драхму
  rationale: Сохраняет конкретное историческое название монеты; пояснение дано в сноске.
- source_word: ἐὰν ἀπολέσῃ
  choice: если потеряет
  rationale: Передаёт общее условие, выраженное конструкцией ἐάν с аористом сослагательного наклонения.
- source_word: οὐχὶ
  choice: не зажжёт… не подметёт… и не станет… искать
  rationale: Риторический вопрос предполагает утвердительный ответ; повтор отрицания необходим для естественного русского синтаксиса при перечислении действий.
- source_word: ἅπτει λύχνον
  choice: зажжёт светильник
  rationale: «Светильник» точно передаёт древний бытовой λύχνος и не вызывает современного образа электрической лампы.
- source_word: σαροῖ τὴν οἰκίαν
  choice: подметёт дом
  rationale: Конкретно и естественно передаёт домашнюю обстановку и действие σαρόω.
- source_word: ζητεῖ ἐπιμελῶς
  choice: станет тщательно искать
  rationale: Передаёт продолжительный целенаправленный поиск и значение наречия «тщательно, усердно».
- source_word: ἕως οὗ εὕρῃ
  choice: пока не найдёт её
  rationale: Естественная русская конструкция для обозначения предела действия; местоимение женского рода однозначно отсылает к драхме.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным риторическим построением. Исторический термин «драхма» сохранён, а «светильник» выбран вместо современной «лампы» для точности бытовой картины. Маркеры сносок помещены непосредственно после поясняемых слов и выражений.
