lexical_decisions:
- source_word: Ἦν δὲ
  choice: был
  rationale: δέ обозначает переход к другой линии повествования; по-русски он естественно передаётся началом нового предложения без обязательного союза и без добавления временного «теперь».
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: старший его сын
  rationale: πρεσβύτερος здесь — сравнительное обозначение старшего из двух сыновей, а не указание на первенство среди нескольких; порядок слов сохраняет повествовательный акцент и звучит литературно.
- source_word: ἐν ἀγρῷ
  choice: в поле
  rationale: Прямое и естественное соответствие ἀγρός в данном сельскохозяйственном контексте.
- source_word: ὡς ἐρχόμενος
  choice: возвращаясь
  rationale: Оборот передаёт одновременное приближение сына после пребывания в поле; «возвращаясь» естественно выражает подразумеваемое движение к дому, не меняя хода сцены.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: подошёл к дому
  rationale: Естественная русская передача значения «приблизился к дому» без архаичности.
- source_word: ἤκουσεν
  choice: услышал
  rationale: Простой повествовательный аорист без добавления начинательного оттенка.
- source_word: συμφωνίας
  choice: музыку
  rationale: συμφωνία может обозначать музыку или согласное звучание, особенно инструментальное; общее «музыку» ясно и не вызывает современного анахроничного образа симфонии.
- source_word: χορῶν
  choice: танцы
  rationale: χορός может означать танец либо группу танцующих; «танцы» естественно сочетается с «музыкой», а более конкретная возможность отмечена в сноске.
