  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: ru
  text: 'Младший из них сказал отцу: «Отец, отдай мне ту часть имущества, которая мне полагается»[a]. И отец разделил между ними свои средства к жизни[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причитающуюся мне долю собственности»; или: «долю, которая мне принадлежит».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жизнь» или «средства к жизни» (βίον); здесь имеется в виду имущество отца, обеспечивавшее его жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: младший
  rationale: 'Сравнительное прилагательное употреблено субстантивированно: буквально «младший [из них]». Слово «сын» ясно из контекста, но в данном стихе не выражено.'
- source_word: δός μοι
  choice: отдай мне
  rationale: Аористный императив δίδωμι с местоимением в дательном падеже. В контексте требования причитающейся доли «отдай мне» естественно передаёт прямой и настойчивый характер просьбы.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: ту часть ... которая мне полагается
  rationale: Причастие ἐπιβάλλον обозначает долю, приходящуюся или причитающуюся человеку; придаточное предложение точно и естественно передаёт этот смысл.
- source_word: οὐσία
  choice: имущество
  rationale: В контексте раздела наследства οὐσία означает собственность или имущественные средства. «Имущество» шире и естественнее русского юридического «наследства», поскольку отец ещё жив.
- source_word: διεῖλεν
  choice: разделил
  rationale: 'Прямое соответствие аористу διαιρέω: разделить, распределить.'
- source_word: αὐτοῖς
  choice: между ними
  rationale: Формально «им», но речь идёт о разделе между двумя сыновьями; русское «между ними» ясно и идиоматично выражает подразумеваемое распределение.
- source_word: βίον
  choice: свои средства к жизни
  rationale: βίος здесь обозначает имущество как средства существования. Такой перевод сохраняет образ жизненного достатка отца и не сводит значение просто к абстрактному богатству.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Реплика сына передана прямо и естественно; буквальный оттенок βίον сохранён в основном тексте и пояснён в сноске. Слово «отец» добавлено во втором предложении ради естественной русской связности и ясного субъекта, выраженного в греческом артиклем с δέ.
