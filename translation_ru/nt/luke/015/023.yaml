lexical_decisions:
- source_word: φέρετε
  choice: приведите
  rationale: Повелительная форма множественного числа от φέρω. Поскольку речь идёт о живом телёнке, по-русски естественнее «приведите», а не общее «принесите».
- source_word: μόσχον τὸν σιτευτόν
  choice: откормленного телёнка
  rationale: μόσχος обозначает телёнка или молодое крупное рогатое животное, а σιτευτός — специально откормленного. Сочетание передаёт и предмет, и его предназначение для особого пиршества.
- source_word: θύσατε
  choice: заколите
  rationale: Глагол может означать как заклание животного для еды, так и жертвенное заклание. В контексте домашнего праздника «заколите» естественно обозначает приготовление животного к пиршеству и при этом не исключает более широкого оттенка исходного слова.
- source_word: φαγόντες
  choice: будем есть
  rationale: Аористное причастие буквально выражает действие еды, связанное с последующим празднованием. Русская сочинительная конструкция естественно передаёт его роль в призыве к общей трапезе, не усиливая значение до «пировать».
- source_word: εὐφρανθῶμεν
  choice: будем праздновать
  rationale: Побудительный конъюнктив первого лица множественного числа выражает приглашение вместе радоваться и праздновать. В контексте устроенного торжества «будем праздновать» конкретно и современно.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повторяющийся союз связывает последовательность распоряжений с приглашением к общей трапезе и празднику.
theological_decisions:
- issue: Возможный жертвенный оттенок θύσατε
  choice: Основной текст передаёт распоряжение заколоть животное для праздничной трапезы.
  alternative: «Принесите его в жертву» — если понимать глагол в явно культовом смысле.
  rationale: Контекст сосредоточен на домашнем пиршестве, а не на культовом обряде. Явное «принесите в жертву» внесло бы в притчу не обязательный здесь богословский смысл; сноска сохраняет реальную широту греческого слова.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. «Приведите» учитывает живое животное; «заколите» сохраняет уместную для сельского и праздничного контекста конкретность без обязательного культового толкования.
