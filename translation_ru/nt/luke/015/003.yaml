  text: 'И Он рассказал им эту притчу:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: рассказал
  rationale: При прямом дополнении «притчу» глагол «рассказал» естественно передаёт речевой акт λέγω по-русски, не меняя смысла.
- source_word: δὲ
  choice: И
  rationale: Частица δέ служит мягкой повествовательной связкой; «и» сохраняет переход от ропота в предыдущем контексте к ответу Иисуса, не усиливая противопоставление или причинность.
- source_word: πρὸς αὐτοὺς
  choice: им
  rationale: Сочетание πρός с винительным обозначает адресатов; при глаголе «рассказал» это естественно выражается дательным падежом.
- source_word: τὴν παραβολὴν ταύτην
  choice: такую притчу
  rationale: παραβολή в синоптическом контексте — «притча»; ταύτην здесь естественно передаётся словом «такую», вводящим последующее содержание.
- source_word: λέγων
  choice: двоеточие после «притчу»
  rationale: Причастие λέγων вводит прямое содержание речи. В современном русском эту функцию естественно и полно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и достойная по тону. Местоимение «Он» написано с прописной буквы в соответствии с принятой благоговейной издательской практикой русского библейского текста. Греческая конструкция с λέγων передана идиоматически двоеточием.
