  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: ru
  text: 'Вот, ваш дом[b] оставлен вам.[a] И говорю вам: вы ни за что не увидите Меня, пока не наступит время, когда вы скажете:[d][c] «Благословен тот, кто приходит во имя Господа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покинут вам» или «оставлен без попечения». Страдательная форма греческого глагола может иметь судебный оттенок: дом отдан самому себе.'
    reason: lexical_alternative
  - marker: b
    text: '«Ваш дом», вероятно, относится к Иерусалиму, особенно к его храму, однако греческий текст говорит просто: «ваш дом».'
    reason: alternative_reading
  - marker: c
    text: Эти слова перекликаются с Псалмом 117:26 (в иной нумерации — 118:26).
    reason: cross_reference
  - marker: d
    text: Одни толкователи относят эти слова к торжественному входу Иисуса в Иерусалим, другие — к будущему признанию Его. Сам греческий текст не требует единственного понимания времени исполнения.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Современное и вместе с тем торжественное средство привлечения внимания, сохраняющее указательную силу греческого слова.
- source_word: ἀφίεται
  choice: оставляется
  rationale: Сохраняет настоящее время и страдательный залог, не устраняя возможный смысл оставления или предания запустению.
- source_word: ὁ οἶκος ὑμῶν
  choice: дом ваш
  rationale: Буквально передаёт широкую греческую формулировку и не подменяет её толкованием «храм» или «Иерусалим».
- source_word: λέγω δὲ ὑμῖν
  choice: И говорю вам
  rationale: Передаёт δέ как мягкий переход к следующему высказыванию без излишне сильного противопоставления.
- source_word: οὐ μὴ ἴδητέ με
  choice: вы уже не увидите Меня
  rationale: В данном русском обороте «уже не» естественно выражает категорическое отрицание будущего; ограничение затем задаётся придаточным с «пока».
- source_word: ἕως ἥξει ὅτε
  choice: пока не придёт время, когда
  rationale: Ясно и естественно передаёт несколько тяжеловесную греческую временную конструкцию.
- source_word: εἴπητε
  choice: вы скажете
  rationale: Будущее время естественно для русского языка и сохраняет направленность греческого аориста сослагательного наклонения на будущее событие.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Благословен Идущий
  rationale: Сохраняет узнаваемую библейскую формулу и возможную титульную окраску субстантивированного причастия, не делая её обязательной.
- source_word: ἐν ὀνόματι κυρίου
  choice: во имя Господа
  rationale: Передаёт устойчивую библейскую формулу естественным литературным русским языком.
theological_decisions:
- issue: К чему относится выражение «дом ваш»
  choice: В основном тексте сохранено «дом ваш»
  alternative: Иерусалим, храм или дом Израиля
  rationale: Контекст указывает прежде всего на Иерусалим и, вероятно, на храм, однако греческий текст прямо говорит лишь «дом ваш»; уточнение сузило бы подлинную неоднозначность.
- issue: Когда исполнятся заключительные слова
  choice: В основном тексте время исполнения не уточняется
  alternative: Торжественный вход Иисуса в Иерусалим либо будущее признание Его
  rationale: Греческая формулировка сама по себе не требует одного конкретного исторического или эсхатологического толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Инверсия «дом ваш» и форма «Благословен Идущий» сохраняют достоинство и узнаваемость цитаты, не прибегая к архаичным грамматическим формам.
