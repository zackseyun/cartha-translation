  terminology: '«Господь» и «Благословен» уместны. «Тот, кто приходит» точно передаёт субстантивированное причастие без не требуемой текстом титульной капитализации «Идущий». Сноски разделены по своим опорам: лексический нюанс, референт «дома», ветхозаветная цитата и спорное временно́е соотнесение.'
