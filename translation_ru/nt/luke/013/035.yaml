  source_fidelity: Греческое ἀφίεται — настоящее страдательного залога; «оставляется вам» формально близко, но по-русски неестественно и не передаёт ясно судебно-итоговый смысл. «Ваш дом оставлен вам» естественно выражает объявляемое оставление, не уточняя референт «дома». Добавленное в черновике «уже» не имеет прямого соответствия в греческом тексте и ослабляет/смещает акцент сильного οὐ μή; его следует убрать. Заключительная формула передана без навязывания титульного прочтения ὁ ἐρχόμενος.
