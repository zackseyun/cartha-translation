  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: ru
  text: Оно подобно закваске[a], которую женщина взяла и спрятала[b] в три саты[c] муки, пока всё не заквасилось.
  philosophy: optimal-equivalence
  footnotes:
