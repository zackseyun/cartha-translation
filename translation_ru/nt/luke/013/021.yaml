    reason: cultural_note
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Оно подобно
  rationale: Предикативное прилагательное вводит сравнение. Местоимение среднего рода естественно отсылает к Царству Божьему из предыдущего контекста, не повторяя отсутствующее здесь существительное.
- source_word: ζύμῃ
  choice: закваске
  rationale: «Закваска» точно передаёт древний заквашивающий агент и сохраняет библейский образ, не вызывая ассоциации исключительно с современными промышленными дрожжами.
- source_word: λαβοῦσα γυνὴ
  choice: которую женщина взяла
  rationale: Аористное причастие передано естественной для русского языка последовательностью личных глагольных форм.
- source_word: ἔκρυψεν
  choice: спрятала
  rationale: Сохранено буквальное значение «спрятала, скрыла», хотя по смыслу речь идёт о помещении закваски в муку.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: в трёх сатах муки
  rationale: Сохранено историческое название меры σάτον в русифицированной форме «сата»; пояснение вынесено в сноску. Предлог «в» естественно сочетается с образом скрытой в муке закваски.
- source_word: ἕως οὗ
  choice: пока не
  rationale: Естественная русская временная конструкция, обозначающая предел действия.
- source_word: ἐζυμώθη ὅλον
  choice: не заквасилось всё
  rationale: Средний род «всё» сохраняет неопределённую совокупность, выраженную греческим ὅλον, не добавляя отсутствующего в оригинале слова «тесто».
theological_decisions:
- issue: Символическое значение закваски
  choice: Образ передан нейтрально, без явной положительной или отрицательной оценки.
  alternative: Истолковать закваску как положительный образ распространения Царства либо как отрицательный образ порчи.
  rationale: Сам стих не разъясняет оценочную сторону образа; перевод должен сохранять притчевую неоднозначность и не вносить толкование в текст.
- issue: Референт ὁμοία
  choice: «Оно» как отсылка к Царству Божьему из контекста.
  alternative: Повторить «Царство Божье» ради полной самостоятельности стиха.
  rationale: В представленном греческом тексте существительное отсутствует, поэтому местоименная отсылка точнее сохраняет связь стиха с предшествующим вопросом Иисуса.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевой речи. Буквальный образ «спрятала» сохранён, а малознакомая мера пояснена в сноске. Маркеры сносок размещены непосредственно при соответствующих словах.
