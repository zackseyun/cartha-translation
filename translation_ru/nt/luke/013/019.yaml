source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: ru
  text: Оно подобно горчичному зерну, которое человек взял и бросил в свой сад. Зерно выросло и стало деревом[b], и птицы небесные[a] поселились в его ветвях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «птицы неба»; по смыслу также возможно: «птицы, летающие в небе».'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте сказано «стало деревом»; так сохраняется подчёркнуто крупный образ роста в притче.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Оно подобно
  rationale: Естественно передаёт формулу сравнения; местоимение среднего рода соотносится с подразумеваемым из контекста «Царством Божьим».
- source_word: κόκκῳ σινάπεως
  choice: горчичному зерну
  rationale: Обычное и точное русское обозначение малого семени горчицы.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: которое человек взял
  rationale: Сохраняет конкретного персонажа притчи и последовательность греческой конструкции.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: бросил в свой сад
  rationale: «Бросил» сохраняет наглядность βάλλω, не подменяя его истолковывающим «посеял»; κῆπος точно передано словом «сад».
- source_word: ηὔξησεν
  choice: Зерно выросло
  rationale: Повтор существительного вместо местоимения устраняет возможную двусмысленность после упоминания человека и сада.
- source_word: ἐγένετο εἰς δένδρον
  choice: стало деревом
  rationale: Прямо сохраняет намеренно крупный образ δένδρον, не исправляя его по ботаническим соображениям.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: птицы небесные
  rationale: Литературное и узнаваемое русское выражение, близко передающее родительный оборот τοῦ οὐρανοῦ в пространственном смысле.
- source_word: κατεσκήνωσεν
  choice: поселились
  rationale: Передаёт значение расположиться или обосноваться; форма множественного числа естественно согласуется в русском с «птицы».
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: в его ветвях
  rationale: Прямое и естественное соответствие; «его» относится к дереву.
theological_decisions:
- issue: Передача ἄνθρωπος
  choice: человек
  alternative: кто-то
  rationale: В притче представлен один конкретный человек; нейтрализация до неопределённого «кто-то» ослабила бы образ исходного текста.
- issue: Образ δένδρον в притче о горчичном зерне
  choice: дерево
  alternative: куст
  rationale: Греческий текст прямо говорит δένδρον — «дерево»; перевод сохраняет гиперболический или стилизованный образ, не сглаживая его ботанически.
translation_notes:
  register: Современный литературный русский с умеренно библейской выразительностью. Синтаксис упрощён разделением на два предложения, но последовательность образов и повтор союзов сохранены. Маркер [a] поставлен при выражении о птицах, к которому относится соответствующее примечание; [b] — при слове «деревом».
