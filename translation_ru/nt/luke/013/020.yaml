  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: ru
  text: 'И снова Он сказал: «С чем Мне сравнить Царство Божье?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет простой повествовательный переход без добавления временного оттенка.
- source_word: πάλιν
  choice: снова
  rationale: Естественно и прямо передаёт повторность действия в современном русском языке.
- source_word: εἶπεν
  choice: Он сказал
  rationale: Обычный повествовательный эквивалент аориста λέγω, естественно вводящий прямую речь; местоимение указывает на Иисуса из контекста.
- source_word: Τίνι
  choice: С чем
  rationale: Форма среднего рода в дательном падеже обозначает предмет сравнения; русская конструкция «сравнить с чем» требует творительного падежа с предлогом «с».
- source_word: ὁμοιώσω
  choice: Мне сравнить
  rationale: Передаёт совещательный оттенок греческого будущего в риторическом вопросе естественной русской конструкцией с инфинитивом.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: Царство Божье
  rationale: Сохраняет укоренившийся библейский термин и его смысловую широту, включая Божье царственное правление и царство.
theological_decisions:
- issue: Передача βασιλεία в изречении о Божьем царственном правлении
  choice: Царство Божье
  alternative: Божье правление
  rationale: «Царство Божье» сохраняет традиционную библейскую формулу и более широкий диапазон значения, не сводя его исключительно к действию правления.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Заглавные буквы в «Он» и «Мне» отражают принятую русскую библейскую традицию, а «Божье» звучит современнее, чем «Божие».
