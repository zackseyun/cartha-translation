    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Естественно и кратко передаёт временную последовательность в речи.
- source_word: ἄρξεσθε λέγειν
  choice: вы начнёте говорить
  rationale: Сохраняет начинательное значение конструкции с будущим временем и инфинитивом, не сводя её просто к «вы скажете».
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: Мы ели и пили
  rationale: Передаёт два аориста естественным русским прошедшим временем и сохраняет образ совместной трапезы.
- source_word: ἐνώπιόν σου
  choice: перед Тобой
  rationale: Ёмкое и естественное выражение личного присутствия и близости без утверждения о признанных отношениях.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: на наших улицах
  rationale: πλατεῖαι может обозначать широкие городские улицы или открытые общественные места; «на наших улицах» естественно передаёт публичную местную обстановку.
- source_word: ἐδίδαξας
  choice: Ты учил
  rationale: Простое прошедшее время точно передаёт аорист и утверждение о совершавшемся среди них публичном учении.
theological_decisions:
- issue: Характер ссылки говорящих на знакомство с Иисусом
  choice: 'Сохранена их ссылка на внешнюю близость: они ели и пили перед Ним, а Он учил на их улицах.'
  alternative: Сформулировать так, будто речь идёт о признанном общении или заветных отношениях.
  rationale: Греческий текст утверждает близость и публичное присутствие, но не говорит, что Иисус признаёт этих людей Своими; перевод не должен устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык; речь проста, достойна и понятна. Прописные местоимения в обращении к Иисусу соответствуют принятому русскому библейскому регистру.
