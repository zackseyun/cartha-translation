  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: ru
  text: Когда Он говорил это, все противившиеся Ему были посрамлены, а вся толпа радовалась всем славным делам[a], которые Он совершал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем чудесным делам» или «всем великолепным делам». Буквально: «всему славному». Это широкое выражение может включать совершённые Им могущественные деяния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Когда Он говорил это
  rationale: Передаёт одновременность действий в генитивной абсолютной конструкции с причастием настоящего времени и естественно звучит по-русски.
- source_word: κατῃσχύνοντο
  choice: были посрамлены
  rationale: 'Сохраняет страдательный оттенок: слова Иисуса публично обнаруживали несостоятельность противников и приводили их к стыду.'
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: все противившиеся Ему
  rationale: Причастная конструкция сохраняет активный и продолжающийся характер их противодействия, не сводя выражение к нейтральному существительному «противники».
- source_word: πᾶς ὁ ὄχλος
  choice: вся толпа
  rationale: Точно передаёт собирательное ὄχλος и всеобщий характер реакции присутствовавших.
- source_word: ἔχαιρεν
  choice: радовалась
  rationale: Русский несовершенный вид естественно передаёт продолженное значение греческого имперфекта.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: всем славным делам
  rationale: «Славным» сохраняет широкое значение ἔνδοξος — славное, великолепное, достойное восхищения — и не ограничивает речь исключительно чудесами; существительное «делам» естественно восполняет субстантивированное прилагательное.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: которые Он совершал
  rationale: Передаёт непосредственную деятельность Иисуса, выраженную ὑπό с родительным падежом, а несовершенный вид отражает настоящее причастие и совокупность происходивших дел.
theological_decisions:
- issue: Характер «славных дел»
  choice: Сохранить широкое выражение «славные дела»
  alternative: «чудесные дела» или «удивительные дела»
  rationale: Контекст включает исцеление, однако ἔνδοξος само по себе не означает только чудеса. Широкий перевод сохраняет формулировку текста и позволяет контексту раскрывать её содержание.
- issue: Действующее лицо в ὑπ’ αὐτοῦ
  choice: «которые Он совершал»
  alternative: «которые совершались через Него»
  rationale: Конструкция прямо указывает на Иисуса как деятеля; перевод не ослабляет эту грамматическую связь и не вводит не требуемого текстом посреднического смысла.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской издательской традиции. Синтаксис остаётся ясным для широкого круга читателей, при этом сохраняются длительность реакций и широкое значение ἔνδοξος.
