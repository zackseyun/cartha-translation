id: LUK.13.11
reference: Luke 13:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: ru
  text: И вот, была женщина, имевшая дух немощи[a] уже восемнадцать лет; она была сгорблена и не могла полностью выпрямиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух, вызывавший немощь». Греческий текст прямо упоминает «дух», что может указывать на духовную причину её недуга.'
    reason: Лексическая альтернатива и сохранение неоднозначности выражения πνεῦμα ἀσθενείας.
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Естественное для современного русского повествовательное выражение, привлекающее внимание и сохраняющее живость греческого оборота.
- source_word: γυνὴ
  choice: женщина
  rationale: В данном контексте впервые вводит в повествование не названную по имени женщину.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: имевшая дух немощи
  rationale: Сохраняет явное упоминание духа и конструкцию с родительным падежом, не сводя состояние лишь к болезни и не уточняя сверх текста природу духовного воздействия.
- source_word: ἔτη δεκαοκτώ
  choice: восемнадцать лет
  rationale: Естественное русское обозначение длительности состояния.
- source_word: συγκύπτουσα
  choice: была скорчена
  rationale: Передаёт выраженную постоянную согбенность женщины; этот вариант сильнее простого «сгорблена», но не добавляет образа полного сгибания пополам.
- source_word: μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές
  choice: совсем не могла выпрямиться
  rationale: Естественно передаёт как физическую невозможность принять прямое положение, так и усиление εἰς τὸ παντελές.
theological_decisions:
- issue: Следует ли передавать πνεῦμα ἀσθενείας как чисто медицинское состояние или как прямую бесовскую одержимость
  choice: дух немощи
  alternative: дух, вызывавший немощь; болезнь
  rationale: Греческий текст прямо говорит о πνεῦμα, поэтому упоминание духа сохранено. Вместе с тем формулировка не отождествляет его прямо с бесом и не разрешает неоднозначность относительно характера духовного воздействия.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «И вот» понятно широкой аудитории; «дух немощи» сохраняет формальную близость к оригиналу, а сноска поясняет возможный причинный смысл.
