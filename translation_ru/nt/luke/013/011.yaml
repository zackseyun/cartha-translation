revisions:
- from: И вот, там была женщина, восемнадцать лет имевшая дух немощи[a]. Она была скорчена и совсем не могла выпрямиться.
  to: И вот, была женщина, имевшая дух немощи[a] уже восемнадцать лет; она была сгорблена и не могла полностью выпрямиться.
  rationale: Убрано невыраженное в оригинале «там». Уточнены описание позы и значение усилительного выражения, при этом сохранены явное упоминание духа и неоднозначность его отношения к немощи.
