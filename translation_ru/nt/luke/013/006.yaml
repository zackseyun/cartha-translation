base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: ru
  text: 'И рассказал Он такую притчу: «У одного человека была смоковница, посаженная в его винограднике[a]. Он пришёл поискать на ней плода, но ничего не нашёл».'
