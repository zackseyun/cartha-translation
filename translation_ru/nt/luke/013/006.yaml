    text: 'Или: «У кого-то была смоковница, посаженная в его винограднике». Греческое неопределённое местоимение допускает более общее выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: И рассказал Он
  rationale: Имперфект вводит речь в повествовании; естественный русский совершенный вид передаёт начало рассказа без тяжеловесного «рассказывал». Частица δέ передана мягким связующим «и».
- source_word: ταύτην τὴν παραβολήν
  choice: такую притчу
  rationale: Указательное местоимение естественно вводит последующее содержание притчи; «притча» является точным и общепринятым соответствием παραβολή.
- source_word: Συκῆν εἶχέν τις
  choice: У одного человека ... была ... смоковница
  rationale: τις обозначает неопределённого участника. Русская повествовательная формула «у одного человека» звучит естественно и не придаёт персонажу лишней определённости.
- source_word: πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: в винограднике была посажена
  rationale: Перфектное страдательное причастие описывает смоковницу в состоянии посаженного дерева; конструкция сохраняет эту смысловую черту и принадлежность виноградника тому же человеку.
- source_word: ἦλθεν ζητῶν καρπὸν
  choice: пришёл поискать ... плода
  rationale: Сочетание аориста с причастием передаёт приход с целью поиска. Родительный «плода» после «поискать» естественен и сохраняет собирательное значение καρπός.
- source_word: ἐν αὐτῇ
  choice: на ней
  rationale: Для плодов дерева нормативное русское соответствие пространственному выражению — «на ней».
- source_word: καὶ οὐχ εὗρεν
  choice: но ничего не нашёл
  rationale: В русском контексте противительное «но» ясно выражает несбывшееся ожидание, имплицированное греческим καί; «ничего» однозначно относится к искомому плоду.
theological_decisions:
- issue: Неопределённый субъект τις в притче
  choice: у одного человека
  alternative: у кого-то
  rationale: Формула сохраняет неопределённость персонажа и естественный стиль русской притчи, не вводя богословской идентификации владельца.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Местоимение «Он» написано с прописной буквы по традиции русского библейского стиля; синтаксис не архаизирован.
