id: LUK.13.34
reference: Luke 13:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: ru
  text: Иерусалим, Иерусалим, убивающий пророков и побивающий камнями посланных к тебе! Сколько раз Я хотел собрать твоих детей, как наседка собирает свой выводок под крылья, но вы не захотели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Иерусалим, Иерусалим
  rationale: Сохранены повтор и звательная сила обращения, передающие скорбь и настойчивость.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: убивающий ... и побивающий камнями
  rationale: Причастия настоящего времени сохраняют живую характеристику Иерусалима по его обычному обращению с Божьими посланниками; мужской род согласован с названием города в русском языке.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: посланных к тебе
  rationale: Кратко и естественно передан пассивный смысл; переход к второму лицу обусловлен прямым обращением к Иерусалиму.
- source_word: ποσάκις ἠθέλησα
  choice: Сколько раз Я хотел
  rationale: Передаёт частотность и личное волеизъявление без богословского расширения.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: собрать твоих детей
  rationale: Сохранены образ города-матери и намеренно широкий референт слова «дети».
- source_word: ὄρνις
  choice: наседка
  rationale: Хотя слово может обозначать птицу вообще, женский образ птицы, укрывающей выводок крыльями, естественно передаётся словом «наседка».
- source_word: τὴν ἑαυτῆς νοσσιὰν
  choice: свой выводок
  rationale: Передан собирательный смысл названия птичьего молодняка.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: но вы не захотели
  rationale: Противительное «но» естественно выражает резкий смысловой контраст; множественное число сохранено и противопоставлено единственному числу в обращении к городу.
theological_decisions:
- issue: Кого обозначают «твои дети»
  choice: Сохранено буквальное «твои дети» без уточнения референта.
  alternative: жители Иерусалима; народ, представленный Иерусалимом
  rationale: Греческий текст олицетворяет город и не ограничивает прямо значение выражения; перевод сохраняет эту неоднозначность.
- issue: Противопоставление ἠθέλησα и οὐκ ἠθελήσατε
  choice: «Я хотел ... вы не захотели»
  alternative: «Я желал ... вы не пожелали»; «Я был готов ... вы не были готовы»
  rationale: Формулировка сохраняет явный контраст волеизъявлений и не привносит выводов из более широких споров о Божьей и человеческой воле.
- issue: 'Смена числа: город в единственном числе и адресаты во множественном'
  choice: «к тебе ... твоих ... вы не захотели»
  alternative: Сгладить всё до единственного числа либо явно назвать жителей.
  rationale: Смена числа присутствует в греческом тексте и создаёт значимое напряжение между олицетворённым городом и его детьми; она сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией плача. Синтаксис сохраняет риторическую напряжённость оригинала, а смена единственного числа на множественное не сглажена.
