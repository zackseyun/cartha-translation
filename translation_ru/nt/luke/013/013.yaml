  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: ru
  text: И Он возложил на неё руки. Она тотчас выпрямилась[a] и стала прославлять Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была выпрямлена»; или: «встала прямо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: возложил на неё руки
  rationale: Устойчивый и естественный русский эквивалент греческого выражения; артикль при части тела по-русски не требует притяжательного местоимения.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт немедленность исцеления кратко и в современном литературном регистре.
- source_word: ἀνωρθώθη
  choice: выпрямилась
  rationale: В контексте согбенной женщины обозначает восстановление прямого положения тела. Русская возвратная форма естественно передаёт греческий пассив, не уточняя механизм исцеления.
- source_word: ἐδόξαζεν
  choice: стала прославлять
  rationale: Передаёт несовершенный вид греческого имперфекта как начавшееся и продолжавшееся действие, сохраняя богословскую весомость глагола δοξάζω.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Стандартная передача прямого дополнения; прописная буква соответствует современному русскому употреблению при обозначении единого Бога.
theological_decisions:
- issue: Характер телесного восстановления в ἀνωρθώθη
  choice: выпрямилась
  alternative: была выпрямлена; встала прямо; снова выпрямилась
  rationale: Контекст ясно указывает на физическое исцеление, однако наречие «снова» в греческом прямо не выражено. Формулировка сохраняет смысл восстановления, не добавляя отсутствующей лексемы и не конкретизируя сверх текста способ действия.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Разделение на два предложения делает последовательность действий естественной по-русски; союз καί перед последней частью передан союзом «и». Местоимение «Он» сохраняет традиционное благоговейное написание в отношении Иисуса.
