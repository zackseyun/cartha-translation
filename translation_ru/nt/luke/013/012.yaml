  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: ru
  text: 'Увидев её, Иисус обратился к ней и сказал ей: «Женщина, ты освобождена от своего недуга[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты избавлена от своей немощи».'
    reason: Лексически возможная передача ἀπολέλυσαι и ἀσθένεια, сохраняющая образ освобождения и более широкое значение «немощь».
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: Увидев её
  rationale: Аористное причастие естественно передаёт предшествующее обстоятельство; δέ здесь служит переходу повествования и не требует обязательного противительного союза в русском.
- source_word: προσεφώνησεν
  choice: подозвал её
  rationale: Глагол обозначает обращение или призыв к человеку; в данном контексте «подозвал» ясно передаёт инициативу Иисуса и естественно звучит по-русски.
- source_word: Γύναι
  choice: Женщина
  rationale: Прямое и уважительное обращение без добавления невыраженных оттенков близости или социального статуса.
- source_word: ἀπολέλυσαι
  choice: ты освобождена
  rationale: Перфект пассивного залога выражает совершившееся освобождение с сохраняющимся результатом; русская краткая форма передаёт нынешнее состояние, возникшее вследствие действия.
- source_word: τῆς ἀσθενείας σου
  choice: от своего недуга
  rationale: В контексте речь идёт о телесной немощи; «недуг» сохраняет достаточную широту значения и звучит естественнее, чем буквальное «слабость».
theological_decisions:
- issue: Характер состояния женщины, обозначенного ἀσθένεια
  choice: недуг
  alternative: немощь; болезнь; слабость
  rationale: Контекст указывает на телесное страдание, но не даёт точного диагноза. «Недуг» не сводит состояние к конкретной болезни или современной категории инвалидности.
- issue: Временной оттенок перфекта ἀπολέλυσαι
  choice: ты освобождена
  alternative: ты была освобождена; ты освобождаешься
  rationale: Краткое страдательное причастие выражает достигнутое состояние и не превращает высказывание ни в простое сообщение о прошлом, ни в незавершённый процесс.
translation_notes:
  register: Современный литературный русский язык; изложение естественное и сдержанно-достоинственное. Обращение «Женщина» сохранено как прямой эквивалент греческого вокатива. Маркер сноски поставлен после цитаты, к которой относится лексическая альтернатива.
