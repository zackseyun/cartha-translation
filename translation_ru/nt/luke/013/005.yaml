id: LUK.13.5
reference: Luke 13:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: ru
  text: Нет, говорю вам. Но если не покаетесь, все так же погибнете.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погибнете подобным образом». Греческое слово может указывать на сходный характер суда в свете приведённых выше примеров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Нет
  rationale: Прямой и выразительный отрицательный ответ на подразумеваемый вопрос из предшествующего контекста.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Естественная по-русски передача распространённой у Луки формулы, близкая к форме греческого текста.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: Но если не
  rationale: Сохраняет противительный поворот и условие греческой конструкции; в русском здесь звучит естественнее, чем «но если только не».
- source_word: μετανοῆτε
  choice: покаетесь
  rationale: Передаёт призыв к покаянию перед Богом, не сводя его ни к одной лишь перемене мыслей, ни к одному лишь чувству сожаления.
- source_word: πάντες
  choice: все
  rationale: Сохраняет всеобщий охват предупреждения и естественно относится к подразумеваемому множественному субъекту.
- source_word: ὡσαύτως
  choice: так же
  rationale: Сохраняет сравнение с предшествующими примерами, не уточняя без достаточных оснований, идёт ли речь об одинаковом способе, неизбежности или характере суда.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Передаёт тяжесть грозящей гибели или окончательного крушения и не ограничивает смысл одной лишь физической смертью.
theological_decisions:
- issue: Смысл покаяния в предупреждении Иисуса
  choice: покаетесь
  alternative: измените свои мысли; обратитесь
  rationale: Устоявшийся библейский глагол сохраняет полноту призыва, не сужая его до интеллектуальной перемены или эмоционального сожаления.
- issue: Смысл сочетания ὡσαύτως ἀπολεῖσθε
  choice: так же погибнете
  alternative: погибнете подобным образом; погибнете так же, как они
  rationale: Формулировка сохраняет намеренную широту сравнения с людьми из предшествующих событий и не определяет точнее, чем греческий текст, в чём именно состоит сходство.
translation_notes:
  register: Современный литературный русский язык; краткое, торжественно-серьёзное предупреждение без архаизмов. Порядок слов «все так же погибнете» сохраняет естественность и оставляет «так же» при сказуемом, тогда как «все» обозначает полный состав слушателей.
