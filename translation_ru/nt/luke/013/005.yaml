  source_fidelity: 'Перевод точно передаёт все элементы греческого текста: emphатическое «Нет», формулу «говорю вам», противительно-условное предупреждение, призыв к покаянию, всеобщий охват «все», сопоставительное ὡσαύτως и глагол ἀπολεῖσθε. «Так же погибнете» намеренно не уточняет, в каком именно отношении гибель будет сходной с предшествующими случаями.'
  naturalness: Фраза звучит естественно на современном литературном русском и сохраняет краткий, серьёзный характер высказывания. Порядок слов «все так же погибнете» приемлем и ясно выражает включённость всех адресатов.
  terminology: «Покаетесь» — точная, устоявшаяся и не конфессионально суженная передача μετανοῆτε. «Погибнете» сохраняет вес ἀπολεῖσθε, не сводя предупреждение только к физической смерти. Термин «суд» в сноске отражает контекстуально возможный оттенок и сформулирован как возможность, а не как навязанное толкование.
