  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: ru
  text: И если впредь она принесёт плод — хорошо; а если нет[a], ты срубишь её».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в следующем году». Некоторые переводы уточняют срок на основании предыдущего стиха, однако греческое выражение здесь буквально означает «в будущем» или «в грядущее время».'
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: И если
  rationale: Сочетание καί + ἐάν вводит условие, а μέν подготавливает противопоставление с δέ; «И если» естественно передаёт связь с предыдущей речью и условный смысл.
- source_word: ποιήσῃ καρπὸν
  choice: она принесёт плод
  rationale: В сочетании с καρπός глагол ποιέω означает «приносить плод»; это естественное русское выражение, сохраняющее образ смоковницы.
- source_word: εἰς τὸ μέλλον
  choice: в будущем
  rationale: Фраза буквально указывает на будущее или грядущее время, не называя прямо «следующий год».
- source_word: εἰ δὲ μήγε
  choice: а если нет
  rationale: Кратко и естественно передаёт контраст δέ и отрицание предыдущего условия.
- source_word: ἐκκόψεις αὐτήν
  choice: ты срубишь её
  rationale: В садоводческом контексте ἐκκόπτω означает срубить или вырубить дерево; местоимение женского рода естественно согласуется с русским словом «смоковница» из контекста.
theological_decisions:
- issue: Временной смысл отсроченного суда хозяина
  choice: Сохранено общее указание «в будущем», без внесения точного срока в основной текст.
  alternative: «В следующем году» — конкретизация на основании предыдущего стиха.
  rationale: Сам греческий текст этого стиха не повторяет «этот год» и прямо не говорит «в следующем году»; более общее выражение сохраняет подлинную временную неопределённость и напряжение между отсрочкой и возможным судом.
translation_notes:
  register: Современный литературный русский язык; речь проста и достойна, сельскохозяйственный образ сохранён. Слово «хорошо» добавлено как естественное восполнение незавершённой условной конструкции, подразумеваемое греческим текстом.
