lexical_decisions:
- source_word: Ἔλεγεν
  choice: Он говорил
  rationale: Имперфект передаёт продолжающуюся речь в повествовании; русское «говорил» естественно сохраняет этот видовой оттенок.
- source_word: οὖν
  choice: Итак
  rationale: Союз связывает вопрос с предшествующим контекстом и может выражать продолжение или вывод; «итак» сохраняет эту связь в современном литературном русском.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: Чему подобно
  rationale: Естественная русская форма вопроса о сходстве, близкая к синтаксису греческого текста.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  rationale: Устоявшееся и понятное библейское выражение, которое сохраняет смысловой диапазон царства и царствования.
- source_word: καὶ
  choice: и
  rationale: Простой сочинительный союз сохраняет параллелизм двух вопросов.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: с чем Мне сравнить его
  rationale: Будущее изъявительное здесь имеет совещательно-риторическую силу; русская конструкция с инфинитивом передаёт её естественно. Местоимение согласовано с русским словом «Царство».
theological_decisions:
- issue: Передача βασιλεία τοῦ θεοῦ
  choice: Царство Божье
  alternative: Божье царствование
  rationale: Греческое βασιλεία может обозначать как царство, так и осуществление царской власти. Основной вариант сохраняет традиционное библейское выражение и образный строй притч, а примечание указывает на динамический смысл Божьего правления.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Божье» выбрано вместо более архаичного «Божие»; местоимение «Мне» оформлено с прописной буквы по принятой русской библейской традиции.
