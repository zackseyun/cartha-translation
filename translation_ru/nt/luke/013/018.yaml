  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: ru
  text: 'Итак, Он говорил: «Чему подобно Царство Божье[a] и с чем Мне сравнить его?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «царствование Бога», с акцентом на Божьем правлении.
