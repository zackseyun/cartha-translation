  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: ru
  text: 'Тогда он сказал виноградарю: «Вот уже три года я прихожу искать плода на этой смоковнице, но не нахожу. Сруби её. Зачем ей ещё и землю истощать?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зачем ей ещё и делать землю бесплодной?» Греческий глагол может означать, что дерево лишает землю продуктивности, а не просто занимает место.'
    reason: Лексическая неоднозначность глагола καταργεῖ.
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: виноградарю
  rationale: Точное и естественное обозначение человека, который возделывает виноградник; сохраняет место действия притчи.
- source_word: Ἰδοὺ
  choice: Вот уже
  rationale: Передаёт привлечение внимания и вместе с последующим указанием времени естественно звучит по-русски.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: вот уже три года
  rationale: Выражает длительность действия от прошлого момента до настоящего.
- source_word: ἔρχομαι ζητῶν
  choice: я прихожу искать
  rationale: Сохраняет настоящее время и допускаемую контекстом повторяемость посещений, не превращая её в явно выраженную форму, которой нет в греческом.
- source_word: καρπὸν
  choice: плода
  rationale: Сохраняет буквальный сельскохозяйственный образ притчи; единственное число имеет обобщённый смысл.
- source_word: συκῇ
  choice: смоковнице
  rationale: Традиционное и литературно нейтральное русское название фигового дерева в библейском контексте.
- source_word: οὐχ εὑρίσκω
  choice: не нахожу
  rationale: Прямо передаёт настоящее время греческого глагола и повторяющийся безрезультатный поиск.
- source_word: ἔκκοψον αὐτήν
  choice: Сруби её
  rationale: Краткий прямой приказ удалить дерево; «срубить» естественно употребляется о дереве.
- source_word: ἱνατί καὶ τὴν γῆν καταργεῖ
  choice: Зачем ей ещё и землю истощать?
  rationale: Передаёт риторический вопрос, усилительную роль καί и практический смысл бесплодного дерева, которое расходует возможности почвы; неоднозначность καταργεῖ отмечена в сноске.
theological_decisions:
- issue: Образ притчи и его богословское истолкование
  choice: Сохранить буквальный сельскохозяйственный образ без добавления духовного толкования.
  alternative: Передать бесплодие дерева как духовное бесплодие прямо в тексте стиха.
  rationale: Греческий текст говорит о смоковнице, плоде и земле; истолкование образов должно следовать из контекста, а не вноситься в перевод.
- issue: Смысл καταργεῖ применительно к земле
  choice: Основной текст передаёт воздействие дерева как истощение земли, а сноска сохраняет более широкий смысл приведения её в бесполезное или неплодородное состояние.
  alternative: «Зачем ей попусту занимать землю?»
  rationale: Глагол может означать не только занятие места, но и лишение почвы продуктивности; нельзя без оговорки сводить его смысл лишь к занимаемой площади.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Реплика звучит естественно и прямо; традиционное слово «смоковница» сохраняет узнаваемость библейского образа без архаизации синтаксиса.
