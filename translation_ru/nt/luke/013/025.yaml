  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: ru
  text: 'После того как хозяин дома встанет и закроет дверь, вы начнёте стоять снаружи и стучать в дверь, говоря: «Господи[a], открой нам!» И тогда он ответит вам: «Я не знаю вас и не знаю, откуда вы»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. κύριε; традиционно «Господи», но в контексте притчи обращение может также означать «господин» или «хозяин».
    reason: alternative_reading
  - marker: b
    text: 'Греч. буквально: «Не знаю вас, откуда вы». В русском переводе повторено подразумеваемое «не знаю», чтобы сохранить явное «вас» и передать фразу естественно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: После того как
  rationale: Естественно передаёт неопределённо-временную конструкцию со значением «когда/после того как» и сохраняет последовательность действий.
- source_word: ἐγερθῇ
  choice: встанет
  rationale: В контексте речь о том, что хозяин поднимается со своего места, а не о воскресении.
- source_word: ὁ οἰκοδεσπότης
  choice: хозяин дома
  rationale: Современное и понятное соответствие, передающее власть распорядителя дома без архаичного оттенка.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: запрёт дверь
  rationale: Глагол обозначает закрытие, отсекающее доступ; «запрёт» естественно выражает решительность исключения, не обязательно уточняя способ запирания.
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: вы, стоя снаружи, начнёте
  rationale: Передаёт как состояние нахождения снаружи, так и начало последующих действий, избегая тяжеловесного буквального «начнёте стоять».
- source_word: κρούειν τὴν θύραν
  choice: стучать в дверь
  rationale: Устойчивое современное русское выражение, не усиливающее действие до «колотить».
- source_word: Κύριε
  choice: Господи
  rationale: Сохраняет обычное новозаветное соответствие и возможный богословский резонанс, тогда как в рамках притчи обращение может также означать «господин».
- source_word: ἄνοιξον ἡμῖν
  choice: открой нам
  rationale: Краткое и естественное русское соответствие просьбе открыть дверь для говорящих.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: он ответит вам
  rationale: Естественно свёртывает греческую конструкцию «ответив, скажет» без утраты смысла.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Не знаю вас, откуда вы
  rationale: Сохраняет явное ὑμᾶς («вас») и следующую фразу об их происхождении, не сглаживая необычную структуру исходного текста.
theological_decisions:
- issue: Значение κύριε в обращении внутри притчи
  choice: Господи
  alternative: господин / хозяин
  rationale: «Господи» сохраняет основное новозаветное соответствие и возможную лукианскую богословскую многозначность; примечание сообщает бытовое значение обращения в самой притче.
- issue: Синтаксическая сила οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Не знаю вас, откуда вы
  alternative: Не знаю, откуда вы
  rationale: Выбранный вариант сохраняет прямое дополнение «вас», присутствующее в греческом, и не сводит ответ лишь к незнанию места происхождения; формальная неровность поясняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис в основном естественный, но заключительная реплика намеренно сохраняет напряжённую и несколько необычную структуру греческого текста. Все примечания отмечены в основном тексте.
