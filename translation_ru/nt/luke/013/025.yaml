revisions:
- from: 'После того как хозяин дома встанет и запрёт дверь, вы, стоя снаружи, начнёте стучать в дверь и говорить: «Господи[a], открой нам!» Но он ответит вам: «Не знаю вас, откуда вы»[b].'
  to: 'После того как хозяин дома встанет и закроет дверь, вы начнёте стоять снаружи и стучать в дверь, говоря: «Господи[a], открой нам!» И тогда он ответит вам: «Я не знаю вас и не знаю, откуда вы»[b].'
  rationale: 'Правка устраняет добавленное значение запирания на замок, делает русский синтаксис естественным и сохраняет оба компонента греческого ответа: «вас» (ὑμᾶς) и «откуда вы» (πόθεν ἐστέ). Перевод «вы начнёте стоять снаружи и стучать» сохраняет начало обоих последующих действий, выраженное ἄρξησθε с инфинитивами.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:19:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Требуется безопасная правка: ἀποκλείσῃ означает «закроет/затворит», а не обязательно «запрёт» (то есть запрёт на замок). В заключительной реплике следует сохранить и прямое дополнение ὑμᾶς, и вопрос об их происхождении, но передать это по-русски грамматически естественно.'
  naturalness: «Не знаю вас, откуда вы» намеренно близко к греческому, но в современном литературном русском звучит синтаксически нарушенно. «Я не знаю вас и не знаю, откуда вы» естественно раскрывает подразумеваемое при втором члене «не знаю», не меняя смысла. «И тогда» точнее воспроизводит последовательность, чем противительное «Но».
  terminology: «Хозяин дома» и «Господи» допустимы. Примечание к κύριε уместно сохраняет бытовой смысл обращения в притче, не устраняя возможный более значимый оттенок. «Закроет дверь» не добавляет невыраженного способа исключения.
  issues:
  - severity: medium
    issue: «запрёт дверь»
    rationale: ἀποκλείσῃ передаёт закрытие/затворение двери, но само по себе не утверждает, что дверь запирают на замок. «Закроет дверь» точнее и не сужает значение.
  - severity: medium
    issue: «Не знаю вас, откуда вы»
    rationale: Хотя это следует порядку греческих слов, такая конструкция неестественна для современного русского. Нужна минимальная синтаксическая экспликация эллипсиса при сохранении явного «вас».
  - severity: low
    issue: «Но он ответит вам»
    rationale: В греческом καί связывает последующее действие; «и тогда он ответит вам» лучше передаёт временную последовательность и не создаёт противопоставления.
