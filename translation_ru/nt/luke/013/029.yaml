source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: ru
  text: И придут с востока и запада, с севера и юга и возлягут за столом[a] в Царстве Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «займут места за столом»; греческий глагол обозначает принятую в древности позу за праздничной трапезой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: придут
  rationale: Будущая форма ἥκω естественно передаётся глаголом «придут» и хорошо сочетается с последующим указанием направлений.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: с востока и запада
  rationale: Буквально множественные формы обозначают «восходы» и «закаты», но здесь это устойчивое обозначение сторон света.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: с севера и юга
  rationale: Передаёт продолжение полного географического охвата естественным современным русским языком.
- source_word: ἀνακλιθήσονται
  choice: возлягут за столом
  rationale: Глагол обозначает принятую в древности позу за праздничной трапезой; перевод сохраняет конкретный образ пира, не сводя его просто к сидению.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: в Царстве Бога
  rationale: Прямо и ясно передаёт βασιλεία τοῦ θεοῦ, сохраняя богословский и эсхатологический вес выражения.
theological_decisions:
- issue: Образ пира в эсхатологическом Царстве
  choice: 'Сохранить образ трапезы: «возлягут за столом».'
  alternative: «сядут в Царстве Бога»
  rationale: Контекстное значение ἀνακλιθήσονται вызывает образ участия в пире; его не следует ослаблять до простого входа или пребывания в Царстве.
- issue: Всеобщий географический охват
  choice: Передать четыре стороны света без уточнения этнической принадлежности приходящих.
  alternative: Явно назвать их язычниками из всех народов.
  rationale: Стих изображает людей, приходящих отовсюду, но сам по себе прямо не называет их язычниками; перевод сохраняет широту выражения без добавочного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Возлягут» слегка возвышенно, но точно сохраняет древний образ; пояснение делает его понятным обычному читателю.
