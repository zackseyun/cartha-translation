id: LUK.13.8
reference: Luke 13:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: ru
  text: 'Он же сказал ему в ответ: «Господин! Оставь её и на этот год[a], пока я не окопаю её и не внесу навоз[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пощади её ещё на один год».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «положу навоз»; то есть удобрю землю вокруг неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ
  choice: Он же сказал ему в ответ
  rationale: Естественно передаёт сочетание причастия ἀποκριθείς с глаголом λέγει, сохраняя значение ответа без тяжеловесного «ответив, говорит».
- source_word: Κύριε
  choice: Господин!
  rationale: Внутри притчи работник уважительно обращается к владельцу виноградника. Русское «Господин!» сохраняет форму обращения и не превращает её без необходимости в прямой божественный титул «Господь».
- source_word: ἄφες αὐτὴν
  choice: Оставь её
  rationale: ἀφίημι здесь означает позволить смоковнице остаться, не срубая её. «Оставь её» передаёт прямой смысл, тогда как «пощади» яснее выражает подразумеваемую отсрочку, но несколько усиливает текст.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: и на этот год
  rationale: Передаёт добавочное время, о котором просит виноградарь, и естественно звучит по-русски.
- source_word: ἕως ὅτου
  choice: пока … не
  rationale: Обычная русская конструкция для обозначения срока до совершения намеченных действий.
- source_word: σκάψω περὶ αὐτὴν
  choice: я не окопаю её
  rationale: «Окопаю» кратко и конкретно передаёт выкапывание или рыхление земли вокруг дерева.
- source_word: βάλω κόπρια
  choice: не внесу навоз
  rationale: Сохраняет конкретный образ навоза как удобрения и естественно описывает сельскохозяйственное действие; более буквальное «не положу навоз» по-русски звучит менее точно без добавления места.
theological_decisions:
- issue: Передача Κύριε в обращении внутри притчи
  choice: Господин!
  alternative: Господи! / Хозяин!
  rationale: Непосредственный адресат в сюжете — владелец виноградника. «Господин» является уважительным обращением и сохраняет возможность символического прочтения притчи, не навязывая его на уровне реплики. «Хозяин» контекстуально ясно, но уже прямо определяет отношения говорящих.
translation_notes:
  register: Современный литературный русский с ясной, сдержанно-достоинственной речью. Синтаксис повествования сглажен без утраты исходных смысловых элементов; сельскохозяйственные образы сохранены конкретными.
