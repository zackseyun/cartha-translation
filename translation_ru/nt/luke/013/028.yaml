- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: в Царстве Божьем
  rationale: Естественная современная форма устойчивого библейского выражения, сохраняющая его богословское содержание.
- source_word: ὑμᾶς δὲ
  choice: а самих себя
  rationale: Противительный союз и усиленное местоимение переданы явным контрастом с патриархами и пророками.
- source_word: ἐκβαλλομένους ἔξω
  choice: изгоняемыми вон
  rationale: Причастная форма сохраняет изображаемое действие, а сочетание «изгоняемыми вон» передаёт принудительность ἐκβάλλω и пространственное усиление ἔξω.
theological_decisions:
- issue: Характер образа суда
  choice: Сохранить конкретные образы плача, скрежета зубов и насильственного исключения из Царства.
  alternative: Передать их толковательно как «глубокую скорбь» или «вечное осуждение».
  rationale: Стих изображает исключение и страдание, но сам по себе не формулирует исчерпывающего учения о последнем суде; перевод не должен ни смягчать, ни расширять сказанное.
