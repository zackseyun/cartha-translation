- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: плач и скрежет зубов
  rationale: Точная и укоренившаяся в русской библейской речи передача образа скорби и мучения.
- source_word: ὅταν ὄψησθε
