  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: ru
  text: А эту женщину — дочь Авраама, которую Сатана связал вот уже восемнадцать лет, — разве не следовало освободить от этих уз в субботний день?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: дочь Авраама
  rationale: Сохранён буквальный библейский образ, указывающий на принадлежность женщины к народу завета; он естественен и понятен по-русски.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: держал связанной / освободить / уз
  rationale: Передана сквозная метафора связывания и развязывания, но по-русски устранено неестественное повторение однокоренных слов.
- source_word: ἰδοὺ δέκα καὶ ὀκτὼ ἔτη
  choice: вот уже восемнадцать лет
  rationale: ἰδού сохранено как риторическое привлечение внимания; сочетание «вот уже» естественно подчёркивает длительность.
- source_word: οὐκ ἔδει
  choice: разве не следовало
  rationale: Передан риторический вопрос с оттенком нравственной и религиозной необходимости без усиления до абсолютного «должно было».
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: в субботний день
  rationale: Точно и естественно передано указание на день субботы.
- source_word: ὁ Σατανᾶς
  choice: сатана
  rationale: Традиционное и общепонятное русское соответствие; строчная буква соответствует современной практике при обозначении противника как титула/наименования.
theological_decisions:
- issue: Значение выражения «дочь Авраама»
  choice: Сохранить образ без поясняющей интерпретации
  alternative: Передать как «потомок Авраама» или добавить указание на веру
  rationale: Греческий текст использует родственно-заветный образ и не уточняет, имеется ли в виду происхождение, вера или оба аспекта; перевод сохраняет эту содержательную ёмкость.
- issue: Причинная роль сатаны в немощи женщины
  choice: 'Прямо сохранить: «которую сатана… держал связанной»'
  alternative: Ослабить до «которая из-за сатаны была больна»
  rationale: Исходный текст прямо приписывает сатане связывание; перевод не переопределяет ни механизм, ни степень этой причинности.
- issue: Необходимость исцеления в субботу
  choice: «разве не следовало освободить»
  alternative: «не надлежало ли развязать»
  rationale: Формулировка сохраняет богословское напряжение между субботним покоем и необходимостью милосердного освобождения, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Пунктуация подчёркивает вставное описание женщины и сохраняет силу заключительного риторического вопроса. Архаизмы «надлежало» и «связь сия» отвергнуты; метафорическая система оригинала сохранена естественными русскими средствами.
