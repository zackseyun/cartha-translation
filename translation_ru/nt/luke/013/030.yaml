  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: ru
  text: 'И вот: есть последние, которые будут первыми, и есть первые, которые будут последними.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественная для современного русского языка частица, привлекающая внимание к следующему изречению; сохраняет торжественную выразительность без архаического «се».
- source_word: ἔσχατοι
  choice: последние
  rationale: Передаёт положение в конце или низший ранг и сохраняет краткую антитезу с «первыми», не сужая смысл до нравственной малозначительности.
- source_word: πρῶτοι
  choice: первые
  rationale: Прямое и естественное соответствие, образующее точную смысловую пару с «последними».
- source_word: οἳ ἔσονται
  choice: которые станут
  rationale: В данном изречении «станут» естественно выражает будущую перемену положения и подчёркивает мотив переворота, заложенный в противопоставлении настоящего и будущего.
- source_word: εἰσὶν
  choice: есть
  rationale: Сохраняет экзистенциальную конструкцию греческого текста и не добавляет слова «некоторые», хотя наличие людей двух названных групп подразумевается.
- source_word: καὶ
  choice: и
  rationale: Сохраняет соединение и уравновешенный параллелизм обеих частей изречения.
theological_decisions:
- issue: Сфера применения изречения о перемене положения
  choice: 'Передать общий принцип: последние станут первыми, а первые — последними, не уточняя, идёт ли речь об этническом, общественном или эсхатологическом положении.'
  alternative: Истолковать слова непосредственно как противопоставление язычников и иудеев, смиренных и гордых либо разных мест на последнем суде.
  rationale: Контекст связан со входом в Царство Бога, однако сам греческий текст намеренно краток и допускает несколько уровней применения. Перевод сохраняет эту широту и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с лаконичной, афористичной и достойной формой. Двоеточие после «И вот» естественно вводит изречение и ясно передаёт дискурсивную функцию ἰδοὺ. Субстантивированные прилагательные «последние» и «первые» звучат по-русски естественно и сохраняют симметрию оригинала.
