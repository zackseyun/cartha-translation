  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: ru
  text: Нет, говорю вам; но если не покаетесь, все так же[a] погибнете.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таким же образом». Слова «так же» могут указывать на столь же внезапный суд, а не обязательно на одинаковый способ смерти.'
    reason: Лексическая неоднозначность наречия ὁμοίως.
lexical_decisions:
- source_word: οὐχί
  choice: Нет
  rationale: Сильное отрицание отвечает на подразумеваемое предположение из предшествующего контекста; краткое «Нет» звучит естественно и не усиливает греческий текст сверх меры.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохранена прямая и выразительная формула обращения, характерная для речи Иисуса у Луки.
- source_word: ἀλλ’
  choice: но
  rationale: Передаёт контраст между отвергнутым предположением и следующим предостережением.
- source_word: ἐὰν μὴ
  choice: если не
  rationale: Естественно передаёт отрицательное условие; в русском контексте эта конструкция яснее и стилистически ровнее, чем «если только не».
- source_word: μετανοῆτε
  choice: покаетесь
  rationale: Глагол означает не просто интеллектуальную перемену мнения, а нравственное и духовное обращение перед Богом; «покаетесь» точно и естественно передаёт это значение в современном русском языке.
- source_word: πάντες
  choice: все
  rationale: Сохраняет всеобщий охват предостережения, обращённого ко всем слушателям.
- source_word: ὁμοίως
  choice: так же
  rationale: Передаёт сопоставление с описанными ранее погибшими, не утверждая непременно тождественный способ смерти; возможная конкретизация вынесена в сноску.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Сохраняет значение гибели и суда, не сужая его до одной лишь физической смерти и не уточняя сверх текста окончательный характер наказания.
theological_decisions:
- issue: Характер покаяния в μετανοῆτε
  choice: покаетесь
  alternative: измените своё мышление
  rationale: «Покаетесь» сохраняет нравственный и духовный смысл обращения к Богу, тогда как буквальное «измените мышление» в современном русском может быть понято как простая интеллектуальная переоценка.
- issue: Объём значения ἀπολεῖσθε
  choice: погибнете
  alternative: умрёте / будете осуждены навеки
  rationale: Форма «погибнете» сохраняет серьёзность предупреждения о суде, но не ограничивает его только телесной смертью и не вводит прямо уточнение о вечном осуждении, которого сам глагол здесь не формулирует.
- issue: Смысл сравнения в ὁμοίως
  choice: так же
  alternative: таким же образом
  rationale: Основной текст сохраняет сопоставление, а сноска предупреждает, что речь может идти о сходном внезапном суде, а не об идентичном способе смерти.
translation_notes:
  register: Современный литературный русский язык с краткой, прямой и достойной формулировкой. Точка с запятой сохраняет тесную риторическую связь отрицания с последующим предостережением.
