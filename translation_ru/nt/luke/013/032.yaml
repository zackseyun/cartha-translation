  rationale: Исправлена неестественная конструкция «достигаю завершения»; выбранный оборот передаёт завершение назначенного пути в естественном современном русском, а сноска сохраняет пассивный характер и смысловую открытость τελειοῦμαι. «Бесов» заменено на нейтральное современное «демонов».
