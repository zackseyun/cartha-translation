base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: ru
  text: 'И Он сказал им: «Пойдите и скажите этой лисе: „Вот, Я изгоняю демонов и совершаю исцеления сегодня и завтра, а на третий день завершу Свой путь[a]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достигну цели», «буду приведён к завершению» или «буду усовершён». Греческий глагол стоит в страдательной форме и может означать доведение до завершения или полноты; вероятно, речь идёт о завершении предназначенного Иисусу служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι ταύτῃ
  choice: этой лисе
  rationale: Сохраняет буквальный образ лисы, указательное местоимение и презрительный оттенок, не подменяя метафору толкованием вроде «этому хитрецу».
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественный русский указательный маркер, привлекающий внимание к последующему высказыванию без архаизации.
- source_word: ἐκβάλλω δαιμόνια
  choice: Я изгоняю бесов
  rationale: Устойчивое и точное евангельское выражение, передающее силу ἐκβάλλω.
- source_word: ἰάσεις ἀποτελῶ
  choice: совершаю исцеления
  rationale: Естественно передаёт осуществление исцелений и сохраняет отличие этого оборота от предшествующего «изгоняю бесов».
- source_word: σήμερον καὶ αὔριον
  choice: сегодня и завтра
  rationale: Сохраняет буквальную временную пару и не устраняет её возможный идиоматический смысл — краткий, определённый срок.
- source_word: τῇ τρίτῃ
  choice: на третий день
  rationale: Ясно и естественно передаёт временной дательный падеж с порядковым числительным.
- source_word: τελειοῦμαι
  choice: достигаю завершения
  rationale: Передаёт значение достижения полноты или конца назначенного дела, не сводя выражение исключительно к смерти, воскресению либо нравственному совершенствованию. Сноска отмечает пассивную форму и иные допустимые оттенки.
theological_decisions:
- issue: Смысл τελειοῦμαι и возможный намёк на завершение миссии Иисуса через смерть и последующее оправдание
  choice: достигаю завершения
  alternative: достигаю цели; буду приведён к завершению; завершаю свой путь
  rationale: Греческое выражение допускает связь с завершением назначенного Иисусу пути, но прямо не называет здесь ни смерть, ни воскресение, ни прославление. Формулировка сохраняет эту богословскую напряжённость и не сужает смысл до одного события.
translation_notes:
  register: Современный литературный русский язык с достойным евангельским регистром. Синтаксис прямой речи сохранён ясным и разговорно естественным; заглавные местоимения в речи Иисуса соответствуют принятой русской библейской издательской традиции.
