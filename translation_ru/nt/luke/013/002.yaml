  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: ru
  text: 'Иисус сказал им в ответ: «Думаете, что эти галилеяне оказались грешнее всех остальных галилеян, потому что претерпели всё это?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: сказал им в ответ
  rationale: Естественно передаёт семитизированную греческую формулу ответа без тяжеловесного буквального «ответив, сказал им».
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: оказались грешнее всех остальных галилеян
  rationale: Передаёт ἐγένοντο без утверждения, будто страдание сделало их грешниками; сравнительная конструкция παρὰ πάντας означает большую степень греховности по сравнению со всеми прочими галилеянами.
- source_word: ταῦτα πεπόνθασιν
  choice: они так пострадали
  rationale: Естественная русская передача перфекта со значением пережитого ими бедствия; «так» относится к характеру упомянутой трагедии.
theological_decisions:
- issue: Связь трагической смерти со степенью греховности
  choice: Вопрос сформулирован без утверждения, что погибшие действительно были грешнее других.
  alternative: «стали грешниками больше всех»
  rationale: Контекст ставит под сомнение вывод о большей виновности жертв из тяжести их страдания; буквальное «стали грешниками» по-русски могло бы ошибочно представить трагедию причиной их греховности.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достоинственная. «Неужели» естественно оформляет вопрос, предполагающий отрицательный ответ. Имя «Иисус» введено вместо местоимения для ясности отдельного стиха.
