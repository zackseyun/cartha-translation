    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Боритесь за то, чтобы
  rationale: Настоящее повелительное наклонение ἀγωνίζομαι выражает напряжённое, настойчивое усилие. «Боритесь за то, чтобы» передаёт силу призыва современным русским языком; «старайтесь» было бы слабее, а «подвизайтесь» звучит архаично и конфессионально окрашено.
- source_word: εἰσελθεῖν
  choice: войти
  rationale: Обычный и точный русский эквивалент инфинитива εἰσέρχομαι; одинаково передан в обоих случаях.
- source_word: διὰ τῆς στενῆς θύρας
  choice: через узкую дверь
  rationale: θύρα обычно означает «дверь», тогда как «ворота» соответствовали бы иной греческой лексеме и, вероятно, возникли бы под влиянием параллели у Матфея. στενῆς передано пространственно и метафорически естественным словом «узкую».
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание предшествующего повеления; «потому что» ясно сохраняет причинную связь.
- source_word: πολλοί
  choice: многие
  rationale: Субстантивированное прилагательное прямо и естественно передаётся словом «многие».
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Сохранена вводная формула и её положение внутри предложения; выражение естественно для современного литературного русского языка.
- source_word: ζητήσουσιν
  choice: будут стараться
  rationale: В данном контексте ζητέω обозначает стремление или попытку войти. «Будут стараться» звучит естественнее буквального «будут искать войти» и остаётся слабее напряжённого «боритесь», сохраняя смысловое различие между двумя глаголами.
- source_word: οὐκ ἰσχύσουσιν
  choice: не смогут
  rationale: Здесь ἰσχύω означает наличие силы или возможности совершить действие. «Не смогут» точно и идиоматично передаёт смысл без добавочного объяснения причины неудачи.
theological_decisions:
- issue: Человеческое усилие и вхождение в спасение
  choice: Сохранить сильное повеление «Боритесь» и предупреждение о тех, кто будет стараться, но не сможет войти.
  alternative: Смягчить призыв до «Старайтесь войти» либо пояснить его с точки зрения заслуг, благодати или предопределения.
  rationale: Греческий текст подчёркивает серьёзность человеческого усилия, но не объясняет здесь его отношение к заслугам, благодати или Божьему действию. Перевод сохраняет эту богословскую напряжённость и не разрешает её в пользу определённой доктринальной системы.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Боритесь за то, чтобы» сохраняет настойчивость исходного повеления без архаичного «подвизайтесь». Частица «но» естественно выражает контраст, заложенный в сочетании καὶ οὐκ, не меняя смысла.
