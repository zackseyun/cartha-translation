  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: ru
  text: Прилагайте все усилия, чтобы войти через узкую дверь[a], потому что многие, говорю вам, будут стремиться войти, но не смогут.
  philosophy: optimal-equivalence
  footnotes:
