    reason: alternative_reading
lexical_decisions:
- source_word: δέ
  choice: И
  rationale: Мягко продолжает повествование, не придавая связке излишнего противительного оттенка.
- source_word: τις
  choice: кто-то
  rationale: Естественно передаёт неопределённое указание на неназванного человека.
- source_word: αὐτῷ
  choice: Его
  rationale: Сохраняет местоимение исходного текста, не подставляя имя Иисуса.
- source_word: Κύριε
  choice: Господи
  rationale: Обычная русская звательная форма обращения «Господь»; она допускает как почтительное, так и более глубокое богословское понимание титула.
- source_word: εἰ ὀλίγοι οἱ σῳζόμενοι
  choice: неужели лишь немногие спасаются?
  rationale: Естественная русская формулировка вопроса; «немногие» передаёт малое число, а «спасаются» сохраняет настоящее время и пассивно-возвратное значение причастия.
- source_word: ὁ δὲ
  choice: Он же
  rationale: Передаёт смену говорящего и лёгкое противопоставление, выраженное δέ.
- source_word: πρὸς αὐτούς
  choice: им
  rationale: Передаёт множественное число αὐτούς и примечательный переход от одного спрашивающего к группе слушателей.
theological_decisions:
- issue: Смысл обращения κύριε к Иисусу
  choice: Господи
  alternative: господин; учитель
  rationale: '«Господи» сохраняет открытость греческого обращения: оно может быть почтительным обращением, но в повествовании Луки способно иметь и более весомое христологическое звучание.'
- issue: Аспект οἱ σῳζόμενοι
  choice: спасаются
  alternative: будут спасены; спасены
  rationale: Настоящее время не сведено ни к завершённому результату, ни исключительно к будущему событию; русская возвратная форма естественно передаёт пассивный смысл без навязывания определённой сотериологической системы.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный библейского повествования. «Лишь немногие» звучит естественнее буквального «немногие ли те, кто спасается», а переход к множественному «им» сохранён.
