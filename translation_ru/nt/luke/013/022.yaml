  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: ru
  text: И Он проходил по городам и селениям, уча и направляясь в Иерусалим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεπορεύετο
  choice: проходил
  rationale: Имперфект передаёт продолжительное движение через разные места; «проходил» естественно выражает этот процесс в русском повествовании.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: по городам и селениям
  rationale: κατά с винительным имеет здесь дистрибутивное значение — движение по ряду населённых мест; перевод сохраняет различие между более крупными и небольшими поселениями.
- source_word: διδάσκων
  choice: уча
  rationale: Причастие настоящего времени обозначает действие, сопровождавшее путь; деепричастие кратко и естественно передаёт эту связь.
- source_word: πορείαν ποιούμενος
  choice: направляясь
  rationale: Идиома обозначает совершение пути с определённым направлением; «направляясь» избегает тяжеловесной буквальности и сохраняет целенаправленность движения.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: εἰς указывает на конечную цель движения; при глаголе направления русское «в Иерусалим» естественно передаёт движение к городу, не подразумевая прибытия в данный момент.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
theological_decisions:
- issue: Направление пути Иисуса к Иерусалиму
  choice: в Иерусалим
  alternative: к Иерусалиму
  rationale: Русская конструкция «направляясь в Иерусалим» ясно обозначает конечную цель продолжающегося пути и не утверждает немедленного прибытия; тем самым сохраняется перспектива повествования о пути.
translation_notes:
  register: Современный литературный русский язык; лаконичный и достойный повествовательный стиль. Местоимение «Он» написано с прописной буквы в соответствии с принятой русской библейской традицией, без добавления имени, отсутствующего в данном стихе.
