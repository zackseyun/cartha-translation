source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: ru
  text: 'Но Господь сказал ему в ответ: «Лицемеры! Разве не каждый из вас в субботу отвязывает своего вола или осла от кормушки[a] и отводит его, чтобы напоить?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «яслей». Греческое слово может обозначать кормушку или место кормления животных.'
    reason: Лексическая неоднозначность слова φάτνη.
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Сохраняет принятое у Луки повествовательное именование Иисуса и его христологическую значимость.
- source_word: Ὑποκριταί
  choice: Лицемеры
  rationale: Прямое обращение во множественном числе; передаёт резкость обличения без добавления местоимения.
- source_word: ἕκαστος ὑμῶν
  choice: каждый из вас
  rationale: 'Естественно передаёт распределительное значение: речь идёт о поступке каждого из слушателей.'
- source_word: τῷ σαββάτῳ
  choice: в субботу
  rationale: Обычное и естественное выражение временного значения дательного падежа.
- source_word: λύει
  choice: отвязывает
  rationale: В контексте привязанного у кормушки животного это конкретный и понятный русский эквивалент.
- source_word: βοῦν
  choice: вола
  rationale: Традиционное и контекстуально уместное обозначение рабочего крупного рогатого скота в паре с ослом.
- source_word: ὄνον
  choice: осла
  rationale: Прямой современный русский эквивалент.
- source_word: φάτνης
  choice: кормушки
  rationale: Конкретно обозначает место кормления, от которого отвязывают животное; возможный традиционный вариант «ясли» вынесен в сноску.
- source_word: ἀπαγαγὼν ποτίζει
  choice: ведёт его поить
  rationale: 'Естественно передаёт последовательность действий: животное отводят от кормушки, чтобы дать ему воды.'
theological_decisions:
- issue: Повествовательный титул κύριος применительно к Иисусу
  choice: Господь
  alternative: господин
  rationale: «Господь» сохраняет характерное для Луки повествовательное именование Иисуса и не ослабляет возможный христологический смысл.
translation_notes:
  register: Современный литературный русский язык. Формула ἀπεκρίθη… καὶ εἶπεν передана естественным оборотом «сказал ему в ответ», а риторический вопрос сохранён. Обращение «Лицемеры!» оставлено во множественном числе, как в греческом тексте.
