- source_word: ἐν τοῖς σάββασιν
  choice: в субботу
  rationale: Форма множественного числа в греческом нередко идиоматически обозначает один субботний день; по-русски в данном эпизоде естественно единственное число. Формальная альтернатива отмечена в сноске.
