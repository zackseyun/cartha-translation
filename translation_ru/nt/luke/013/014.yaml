reference: Luke 13:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: ru
  text: 'Но начальник синагоги, негодуя из-за того, что Иисус исцелил в субботу, сказал народу: «Есть шесть дней, в которые следует работать. Поэтому приходите исцеляться в эти дни, а не в субботу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Но начальник синагоги, ответив и негодуя из-за того, что Иисус исцелил в субботу, говорил народу…»'
    reason: Сохраняет формальные особенности аористного причастия ἀποκριθείς («ответив») и имперфекта ἔλεγεν («говорил»), которые в основном тексте переданы естественной русской конструкцией.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Но ... сказал
  rationale: Причастие ἀποκριθείς вводит ответную реакцию, а δέ обозначает контраст с предшествующим исцелением. В русском отдельное «ответил» без прямого вопроса звучит менее естественно; «но ... сказал» сохраняет дискурсивную функцию и противительный поворот.
- source_word: ὁ ἀρχισυνάγωγος
  choice: начальник синагоги
  rationale: Традиционное и понятное обозначение лица, ведавшего порядком и делами синагоги; оно не подразумевает гражданской власти.
- source_word: ἀγανακτῶν
  choice: негодуя
  rationale: Передаёт сильное возмущение с оттенком морального неодобрения и сохраняет сопутствующий характер причастного действия.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: из-за того, что Иисус исцелил в субботу
  rationale: ὅτι имеет причинное значение, а аорист указывает на уже совершившееся исцеление. «Из-за того, что» естественно связывает причину с негодованием.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: сказал народу
  rationale: Имперфект здесь может представлять речь в её развитии, но русское «говорил» способно ошибочно внушить повторяемость; «сказал» естественно вводит следующую прямую речь. ὄχλος обозначает собравшихся людей; «народ» в данном контексте звучит естественнее, чем «толпа».
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Есть шесть дней, в которые следует работать
  rationale: Сохраняется структура исходной фразы и нормативная сила δεῖ, но без неестественно тяжёлого «необходимо работать».
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: В эти дни и приходите исцеляться
  rationale: Русская конструкция естественно передаёт вывод οὖν, движение ἐρχόμενοι и повелительное θεραπεύεσθε, не уточняя человеческого целителя там, где греческая форма допускает значение «получайте исцеление».
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: а не в день субботний
  rationale: Противопоставление передано прямо; слегка приподнятая формула уместна в библейском повествовании и сохраняет явное слово «день».
theological_decisions:
- issue: Нормативное высказывание начальника синагоги о работе и исцелении
  choice: 'Передать его требование прямо, как слова персонажа: «Есть шесть дней, в которые следует работать»'
  alternative: Перефразировать реплику так, чтобы уже в переводе назвать её лицемерной или ошибочной
  rationale: Стих сообщает позицию начальника синагоги, не подтверждая её как Божье постановление. Прямой перевод сохраняет повествовательное и богословское напряжение, не предваряя последующую оценку Иисуса.
- issue: Значение θεραπεύεσθε в обращении к народу
  choice: «приходите исцеляться»
  alternative: «приходите, чтобы вас исцеляли»
  rationale: Выбранная форма сохраняет естественность русского языка и не вводит в реплику явного указания на того, кто совершает исцеление; это соответствует форме и контексту греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Реплика звучит строго и назидательно, но перевод не добавляет явной авторской оценки. Маркер сноски помещён в основном тексте.
