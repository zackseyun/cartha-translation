source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: ru
  text: В это самое время были некоторые люди, сообщавшие Ему о галилеянах, чью кровь Пилат смешал с их жертвами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смешал с приносимыми ими жертвами».'
    reason: 'Уточняющая лексико-синтаксическая возможность: αὐτῶν может указывать на жертвы, принадлежавшие им в смысле приносимых ими, хотя сам греческий текст не описывает действие принесения прямо.'
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: там находились люди
  rationale: Имперфект πάρειμι передаёт присутствие людей, а не их прибытие. Неопределённое τινες естественно выражено без уточнения числа; δέ передано связью с контекстом, без избыточного вводного слова.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: В это самое время
  rationale: Сохраняет временную конкретность и усиление αὐτῷ.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: которые рассказали Ему
  rationale: Причастный оборот естественно развёрнут в определительное предложение; ἀπαγγέλλω обозначает сообщение известия.
- source_word: περὶ τῶν Γαλιλαίων
  choice: о галилеянах
  rationale: περί с родительным падежом вводит тему сообщения.
- source_word: ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν
  choice: чью кровь Пилат смешал
  rationale: Сохранена резкая и лаконичная образность греческого текста без поясняющего добавления о способе убийства.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: с их жертвами
  rationale: Переданы μετά и притяжательное αὐτῶν; формулировка не уточняет, были ли это принесённые ими жертвы или жертвы, которые они приносили в тот момент.
theological_decisions:
- issue: Исторический и нравственный смысл поступка Пилата
  choice: Прямо передать, что Пилат смешал кровь галилеян с их жертвами.
  alternative: 'Разъяснить: «убил их, когда они приносили жертвы».'
  rationale: Греческий текст сообщает потрясающий факт, но не объясняет обстоятельств события и не формулирует его богословского смысла; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно-достоинственное. Заглавная буква в местоимении «Ему» соответствует принятому благоговейному русскому библейскому регистру. Маркер сноски помещён непосредственно после соответствующего предложения.
