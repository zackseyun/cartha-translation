  source_fidelity: В целом переданы участники, временная конкретность и намеренно резкая формулировка о крови и жертвах. Однако «там» не имеет опоры в греческом тексте, а прошедшее совершенное «рассказали» несколько ослабляет одновременное с «находились» значение причастия ἀπαγγέλλοντες («сообщая»).
  naturalness: Фраза понятна и выдержана в современном литературном регистре, но сочетание «находились люди, которые рассказали» менее плавно и хуже передаёт синхронность действий, чем деепричастный оборот.
  terminology: «Галилеяне», «Пилат», «кровь», «жертвы» переданы точно и нейтрально. Заглавное «Ему» допустимо в русском библейском регистре. Сноска уместно отмечает возможность, не превращая её в толковательное утверждение.
