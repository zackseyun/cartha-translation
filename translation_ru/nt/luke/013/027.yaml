  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: ru
  text: 'И он скажет вам: «Не знаю, откуда вы. Отойдите от меня, все, кто творит неправду[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несправедливость»; «неправедность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: он скажет вам
  rationale: Причастие λέγων образует с ἐρεῖ характерную для греческой речи плеонастическую конструкцию и не добавляет отдельного смыслового компонента; по-русски она естественно передаётся одним глаголом речи с адресатом.
- source_word: οὐκ οἶδα
  choice: не знаю
  rationale: Прямо передаёт значение οἶδα и сохраняет контекстуально значимый оттенок отказа признать какую-либо связь, не подменяя его толкованием «не признаю».
- source_word: πόθεν ἐστέ
  choice: откуда вы
  rationale: Естественное современное русское выражение, обозначающее происхождение или принадлежность; оно сохраняет краткость и некоторую контекстуальную открытость греческой фразы.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: отойдите от меня
  rationale: Передаёт повеление решительно удалиться и сохраняет весомый, но понятный современному читателю тон.
- source_word: πάντες ἐργάται ἀδικίας
  choice: все, кто творит неправду
  rationale: Функционально передаёт обозначение людей по их постоянным делам. Буквальное «работники неправды» по-русски неестественно, а «творящие неправду» сохраняет деятельный и нравственный смысл выражения.
theological_decisions:
- issue: Значение ἀδικίας в изречении о суде
  choice: неправду
  alternative: несправедливость; зло; беззаконие
  rationale: «Неправда» сохраняет широкий нравственный смысл ἀδικία и связь с отсутствием праведности, не сужая его до нарушения закона, что точнее соответствовало бы ἀνομία.
translation_notes:
  register: Современный литературный русский язык с торжественной сдержанностью. Плеонастическое ἐρεῖ λέγων сглажено ради естественности; прямая речь и категоричность повеления сохранены.
