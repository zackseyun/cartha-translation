  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: ru
  text: 'В тот самый час к Нему подошли некоторые фарисеи и сказали: «Уйди и отправляйся отсюда, потому что Ирод хочет Тебя убить».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: В тот самый час
  rationale: Передаёт конкретность времени и усилительный оттенок αὐτῇ; по-русски звучит естественно и сохраняет связь с ближайшим контекстом.
- source_word: προσῆλθάν
  choice: подошли
  rationale: Естественно передаёт приближение фарисеев к Иисусу, выраженное προσέρχομαι.
- source_word: τινες Φαρισαῖοι
  choice: некоторые фарисеи
  rationale: Сохраняет неопределённость τινες и не распространяет действие на всех фарисеев.
- source_word: λέγοντες αὐτῷ
  choice: и сказали
  rationale: Причастная конструкция естественно преобразована в однородное личное сказуемое; адресат ясен из местоимения «к Нему» и контекста прямой речи.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Уйди и отправляйся отсюда
  rationale: 'Сохраняет два повелительных глагола: ἔξελθε требует оставить место, а πορεύου — двинуться прочь. Формулировка современна и не чрезмерно разговорна.'
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит причину данного предупреждения.
- source_word: Ἡρῴδης
  choice: Ирод
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: θέλει
  choice: хочет
  rationale: Передаёт желание, выраженное θέλω, не усиливая его до твёрдого намерения.
- source_word: σε ἀποκτεῖναι
  choice: Тебя убить
  rationale: Прямо и точно передаёт объект и значение инфинитива, не добавляя оттенка официальной казни.
theological_decisions:
- issue: Мотив фарисеев, предупредивших Иисуса
  choice: Передать их слова прямо, не уточняя, искренне ли они предупреждают Иисуса
  alternative: Представить фарисеев как доброжелателей либо как участников попытки запугать Иисуса
  rationale: Греческий текст сообщает их слова, но не раскрывает мотив; перевод сохраняет эту повествовательную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис простой и понятный; местоимения, относящиеся к Иисусу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
