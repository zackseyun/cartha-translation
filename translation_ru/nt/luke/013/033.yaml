base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: ru
  text: Однако Мне надлежит продолжать путь сегодня, завтра и на следующий день[a], потому что невозможно[b], чтобы пророк погиб вне Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «сегодня, завтра и на следующий день» могут быть образным обозначением краткого, определённого срока, а не ровно трёх календарных дней.
    reason: cultural_note
  - marker: b
    text: 'Или: «немыслимо, чтобы пророк погиб вне Иерусалима»; выражение может передавать не только буквальную невозможность, но и резкую иронию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Однако
  rationale: Передаёт сильное противопоставление или оговорку по отношению к предыдущим словам и естественно звучит в современном литературном русском.
- source_word: δεῖ με
  choice: Мне надлежит
  rationale: Сохраняет выраженную безличным δεῖ необходимость, не уточняя сверх текста, является ли она божественно установленной или обусловленной обстоятельствами.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: сегодня, завтра и на следующий день
  rationale: Сохраняет явную трёхчастную временную последовательность греческого текста и допускает как буквальное, так и идиоматическое понимание.
- source_word: πορεύεσθαι
  choice: продолжать путь
  rationale: Передаёт движение вперёд в контексте пути лучше, чем нейтральное «идти», и не добавляет конкретного места назначения.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание для высказанной необходимости.
- source_word: οὐκ ἐνδέχεται
  choice: невозможно
  rationale: Сохраняет основное значение невозможности или немыслимости, оставляя открытой вероятную ироническую окраску высказывания.
- source_word: προφήτην
  choice: пророк
  rationale: Единственное число без артикля передано обобщённо, что сохраняет характер изречения.
- source_word: ἀπολέσθαι
  choice: погиб
  rationale: «Погиб» сохраняет торжественный смысл ἀπόλλυμι и шире, чем «был убит», не делая способ смерти явным сверх исходного текста.
- source_word: ἔξω Ἰερουσαλήμ
  choice: вне Иерусалима
  rationale: Точно и лаконично передаёт пространственное выражение, сохраняя возвышенный регистр.
theological_decisions:
- issue: Смысл утверждения о невозможности гибели пророка вне Иерусалима
  choice: Высказывание передано как невозможность без уточнения, является ли она буквальной, риторической или иронической.
  alternative: «Немыслимо, чтобы пророк погиб вдали от Иерусалима» либо «не бывает, чтобы пророк погиб вне Иерусалима».
  rationale: οὐκ ἐνδέχεται допускает оттенки невозможности, недопустимости и немыслимости. Формулировка сохраняет напряжение и вероятную пророческую иронию, не превращая слова ни в абсолютное метафизическое правило, ни в явный сарказм.
- issue: Характер необходимости, выраженной δεῖ
  choice: «Мне надлежит» без разъяснения источника необходимости.
  alternative: «Я должен» или «Мне необходимо».
  rationale: В повествовании δεῖ может указывать на божественную необходимость, однако сам стих не называет её источник; перевод не вводит это толкование непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Надлежит», «погиб» и «вне Иерусалима» сохраняют достоинство и лаконичность оригинала, оставаясь понятными обычному читателю.
