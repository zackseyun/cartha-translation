  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: ru
  text: Или те восемнадцать человек, на которых упала башня в Силоаме и убила их, — думаете ли вы, что они оказались виновнее всех людей, живущих в Иерусалиме?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стали должниками в большей степени, чем все люди, живущие в Иерусалиме». Здесь «должники», вероятно, означает нравственно виновных или ответственных перед Богом; возможно также: «оказались более виновными».'
    reason: Сохраняет буквальную метафору ὀφειλέται, точно передаёт сравнительный смысл παρὰ πάντας и отмечает нравственный смысл слова, не подменяя его без пояснения словом «грешники».
lexical_decisions:
- source_word: ἢ
  choice: Или
  rationale: Вводит ещё один пример в продолжающемся рассуждении и сохраняет связь с предыдущим стихом.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: те восемнадцать человек
  rationale: В русском языке после числительного здесь естественно назвать подразумеваемых людей; слово «человек» не ограничивает их только мужчинами.
- source_word: ἔπεσεν ὁ πύργος
  choice: упала башня
  rationale: Прямо передаёт глагол «упала», не заменяя его более истолковывающим «обрушилась».
- source_word: ἐν τῷ Σιλωὰμ
  choice: в Силоаме
  rationale: Сохраняет название места и простое пространственное значение предлога.
- source_word: ἀπέκτεινεν αὐτούς
  choice: убила их
  rationale: Башня остаётся грамматическим субъектом, как в греческом тексте; выражение ясно описывает результат несчастья.
- source_word: δοκεῖτε ὅτι
  choice: думаете ли вы, что
  rationale: Естественно передаёт прямой риторический вопрос Иисуса.
- source_word: ὀφειλέται ἐγένοντο
  choice: оказались виновнее
  rationale: В данном сравнительном контексте «должники» обозначает нравственную вину или ответственность. «Оказались виновнее» передаёт смысл по-русски, не создавая ложного впечатления о денежном долге; буквальный образ сохранён в примечании.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: всех людей
  rationale: παρά с винительным выражает сравнение, а ἀνθρώπους здесь относится ко всем людям без ограничения по полу.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: живущих в Иерусалиме
  rationale: Естественно передаёт причастие настоящего времени и значение постоянного проживания.
theological_decisions:
- issue: Смысл ὀφειλέται как нравственного обозначения
  choice: оказались виновнее
  alternative: стали большими должниками
  rationale: Буквальное «должники» сохраняет метафору, но в современном русском без пояснения почти неизбежно понимается финансово. Контекст требует сравнения нравственной виновности, однако примечание сохраняет особое слово Луки и его отличие от слова «грешники» в предыдущем стихе.
- issue: Круг лиц, обозначенный ἀνθρώπους
  choice: всех людей
  alternative: всех мужчин
  rationale: Речь идёт обо всех жителях Иерусалима, поэтому родовое значение «людей» точнее, чем обозначение только мужчин.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет торжественную ясность риторического вопроса, но избегает неестественного буквального оборота «должники больше всех». Название места передано традиционной формой «Силоам».
