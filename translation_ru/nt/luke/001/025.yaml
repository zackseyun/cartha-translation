  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: ru
  text: «Так поступил со мной Господь в те дни, когда обратил на меня внимание, чтобы снять с меня позор[a] среди людей».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесчестье»; «поношение». Греческое слово обозначает прежде всего позор или осуждение со стороны окружающих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: не передавать отдельным союзом
  rationale: Здесь ὅτι может вводить содержание слов или их объяснение. Поскольку стих непосредственно продолжает повествование о том, что Елисавета скрывалась и говорила, русская прямая речь естественно начинается без «потому что» или «что»; смысловая связь сохраняется контекстом.
- source_word: Οὕτως μοι πεποίηκεν κύριος
  choice: Так поступил со мной Господь
  rationale: Передаёт подчеркнутое указание на образ действия и личную направленность Божьего поступка; «поступил со мной» естественнее буквального «сделал мне».
- source_word: ἐν ἡμέραις αἷς
  choice: в те дни, когда
  rationale: Сохраняет временную относительную конструкцию в естественной русской форме.
- source_word: ἐπεῖδεν
  choice: обратил на меня внимание
  rationale: Глагол означает не просто зрительное восприятие, а благосклонное внимание; дополнение «на меня» ясно восстанавливается из контекста.
- source_word: ἀφελεῖν
  choice: чтобы снять с меня
  rationale: Инфинитив допускает целевое или результативное понимание. Конструкция с «чтобы» сохраняет эту связь, а «снять с меня» идиоматично сочетается с «позор».
- source_word: ὄνειδός μου
  choice: позор
  rationale: ὄνειδος обозначает общественное поношение, бесчестье или позор. «Позор» в данном контексте передаёт внешнее социальное бесчестье лучше, чем преимущественно внутреннее чувство стыда.
- source_word: ἐν ἀνθρώποις
  choice: среди людей
  rationale: Передаёт общественную сферу переживаемого бесчестья и сохраняет родовую, а не только мужскую, отнесённость ἄνθρωποι.
theological_decisions:
- issue: К кому относится κύριος
  choice: «Господь» относится к Богу
  alternative: Существенной контекстуальной альтернативы нет
  rationale: Елисавета говорит о Божьем действии, избавившем её от бесплодия и связанного с ним общественного бесчестья. Титул сохранён без более узкого христологического уточнения.
- issue: Социальный смысл ὄνειδος
  choice: «позор» как общественное бесчестье
  alternative: «поношение»; «бесчестье»; «стыд»
  rationale: Контекст говорит о том, как бездетность воспринималась окружающими. Перевод сохраняет внешнее общественное измерение и не сводит значение к внутреннему чувству стыда.
- issue: Связь ἐπεῖδεν и ἀφελεῖν
  choice: «обратил на меня внимание, чтобы снять»
  alternative: «обратил на меня внимание и снял»
  rationale: Греческий инфинитив может выражать цель или результат. Формулировка с «чтобы» сохраняет синтаксическую связь и не устраняет присущую ей смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный регистр. Сохранён социальный оттенок высказывания; архаичные «призрел» и «между людьми» не использованы.
