lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Поскольку
  rationale: Передаёт причинно-фоновое введение к торжественному предисловию и естественно связывает этот стих с продолжением предложения.
- source_word: πολλοὶ
  choice: многие
  rationale: Прямо и без лишнего уточнения передаёт количественное значение; слово «другие» в греческом тексте отсутствует.
- source_word: ἐπεχείρησαν
  choice: взялись
  rationale: Обозначает предпринятое дело, не подразумевая, что оно закончилось неудачей; по-русски естественно сочетается с инфинитивом «составить».
- source_word: ἀνατάξασθαι
  choice: составить
  rationale: Передаёт литературную работу по подготовке и упорядочению связного изложения.
- source_word: διήγησιν
  choice: повествование
  rationale: Сохраняет жанровый и литературный оттенок слова, обозначающего последовательный рассказ или изложение.
- source_word: περὶ
  choice: о
  rationale: Естественный современный русский эквивалент, уместный и в литературном регистре.
- source_word: τῶν πεπληροφορημένων
  choice: совершившихся
  rationale: В сочетании с πράγματα наиболее вероятно указывает на события, достигшие осуществления; форма сохраняет возможность смысловой связи с исполнением Божьего замысла, не делая её чрезмерно явной.
- source_word: ἐν ἡμῖν
  choice: среди нас
  rationale: Передаёт корпоративное значение, не уточняя сверх текста, кто именно включён в «нас».
- source_word: πραγμάτων
  choice: событиях
  rationale: В контексте повествования обозначает произошедшие дела и события; по-русски это яснее и естественнее, чем широкое «вещах» или отвлечённое «обстоятельствах».
theological_decisions:
- issue: Значение πεπληροφορημένων в прологе Луки
  choice: совершившихся
  alternative: исполнившихся; получивших полное подтверждение
  rationale: Перфектное страдательное причастие допускает смысл осуществления или исполнения, а в отдельных контекстах — полной удостоверенности. Сочетание с πράγματα и дальнейшее повествование делают смысл совершившихся событий наиболее вероятным; иные лексически возможные прочтения сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством формального пролога. «Поскольку» и «повествование» сохраняют возвышенный характер, а «взялись составить» звучит естественно и не предполагает неудачи предшественников.
