  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: ru
  text: Поскольку многие взялись составить повествование о событиях, совершившихся среди нас,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнившихся»; возможно также: «получивших полное подтверждение среди нас».'
