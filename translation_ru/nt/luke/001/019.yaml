base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: ru
  text: 'Ангел ответил ему: «Я — Гавриил, который стоит перед Богом. Я был послан, чтобы говорить с тобой и возвестить тебе эту радостную весть[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвестить тебе эти вещи». Речь идёт о сообщении, которое Гавриил только что объявил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ответил
  rationale: Аористное причастие вводит прямую речь; в современном русском естественно передать его личной формой глагола.
- source_word: ἄγγελος
  choice: ангел
  rationale: По контексту речь идёт о небесном вестнике, который называет себя Гавриилом; «ангел» здесь точнее общего «вестник».
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Я — Гавриил
  rationale: Именное предложение с тире естественно по-русски и сохраняет подчёркнутое ἐγώ.
- source_word: ὁ παρεστηκὼς
  choice: предстоящий
  rationale: Перфектное причастие обозначает устойчивое положение и служение Гавриила перед Богом; «предстоящий» сохраняет придворно-служебный оттенок и достоинство речи.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Краткое и точное соответствие, передающее нахождение в Божьем присутствии.
- source_word: ἀπεστάλην
  choice: Я послан
  rationale: Пассивная форма сохраняет смысл поручения, полученного от подразумеваемого отправителя — Бога.
- source_word: λαλῆσαι πρὸς σὲ
  choice: говорить с тобой
  rationale: Инфинитив цели передан прямо и естественно, без добавления отсутствующего в греческом содержания.
- source_word: εὐαγγελίσασθαί σοι ταῦτα
  choice: возвестить тебе эту радостную весть
  rationale: Глагол означает сообщить благую, радостную новость; сочетание с ταῦτα относится к только что объявленному сообщению. Слитное русское выражение естественно, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача εὐαγγελίζω в контексте ангельского возвещения
  choice: возвестить… радостную весть
  alternative: благовествовать; возвестить Евангелие
  rationale: Выбранная формулировка сохраняет значение доброй вести и возвышенный тон, но не вводит преждевременно позднейшее терминологическое понимание слова «Евангелие».
- issue: Характер стояния Гавриила перед Богом
  choice: предстоящий перед Богом
  alternative: стоящий в присутствии Бога
  rationale: «Предстоящий» передаёт не только позу, но и продолжающееся положение служителя при Божьем присутствии, не уточняя сверх текста характер этого служения.
translation_notes:
  register: Современный литературный русский с достоинством прямой ангельской речи. «Предстоящий» слегка возвышенно, но понятно из контекста и точнее передаёт устойчивое служебное положение, чем нейтральное «стоящий».
