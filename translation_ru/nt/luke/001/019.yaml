  to: 'Ангел ответил ему: «Я — Гавриил, который стоит перед Богом. Я был послан, чтобы говорить с тобой и возвестить тебе эту радостную весть[a]».'
  rationale: Изменения уточняют видо-временное значение ἀπεστάλην и делают передачу ὁ παρεστηκώς естественнее для современного литературного русского. Интерпретирующее «эту радостную весть» допустимо в основном тексте, поскольку εὐαγγελίσασθαι и ταῦτα вместе указывают на только что возвещённое сообщение; буквальная форма ταῦτα сохранена в сноске.
