  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: ru
  text: чтобы нам, избавленным из рук врагов, без страха служить Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесстрашно служить Ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: без страха
  rationale: Передаёт значение наречия «бесстрашно, без страха» и естественно сочетается с инфинитивом «служить».
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: от руки врагов
  rationale: Сохраняет библейский образ руки как власти или контроля; притяжательное «наших» в греческом тексте отсутствует, поэтому оно не добавлено.
- source_word: ῥυσθέντας
  choice: избавленным
  rationale: Аористное страдательное причастие обозначает избавление, предшествующее служению; русская краткая конструкция естественно передаёт это отношение.
- source_word: λατρεύειν
  choice: служить
  rationale: Глагол обозначает служение, обращённое к Богу, и может включать поклонение; «служить» сохраняет более широкий смысл.
- source_word: αὐτῷ
  choice: Ему
  rationale: Местоимение относится к Богу; дательный падеж естественно обусловлен русским глаголом «служить».
theological_decisions:
- issue: Объём значения λατρεύειν применительно к Богу
  choice: служить Ему
  alternative: поклоняться Ему
  rationale: «Служить» охватывает как почитание Бога, так и преданное повиновение, не сужая смысл до богослужебного поклонения.
- issue: Связь ἀφόβως с синтаксисом высказывания
  choice: без страха служить Ему
  alternative: чтобы нам бесстрашно, избавленным от руки врагов, служить Ему
  rationale: Положение выражения рядом с «служить» ясно передаёт, что отсутствие страха характеризует служение, тогда как греческий порядок допускает стилистическую вариативность.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Оборот «от руки врагов» намеренно сохраняет метафору исходного текста; заглавная буква в «Ему» соответствует принятой русской традиции благоговейного обозначения Бога.
