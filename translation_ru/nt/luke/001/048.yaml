  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: ru
  text: потому что Он обратил взор на низкое положение[a] Своей рабы[b]. Ибо вот, отныне все поколения будут называть меня блаженной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уничижение»; «приниженность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служанки». Греческое слово обозначает женщину-рабыню и подчёркивает её принадлежность господину.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: обратил взор на
  rationale: Передаёт направленное и благосклонное внимание Бога; совершенный вид естественно выражает греческий аорист в данном повествовательно-поэтическом контексте.
- source_word: ταπείνωσιν
  choice: низкое положение
  rationale: Здесь существительное указывает прежде всего на невысокое, неприметное положение Марии, а не только на внутреннее смирение; формулировка понятна современному читателю и не усиливает оттенок унижения.
- source_word: δούλης
  choice: рабы
  rationale: Сохраняет выраженную в δούλη идею принадлежности Богу и женский род, не смягчая её до общего обозначения служения.
- source_word: ἰδοὺ γὰρ
  choice: И вот
  rationale: Естественный для современной русской поэтической речи указательно-эмфатический оборот; связь с основанием высказывания понятна из контекста.
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Кратко и точно передаёт начальную временную точку и дальнейшую перспективу.
- source_word: μακαριοῦσίν με
  choice: будут называть меня блаженной
  rationale: Передаёт публичное признание Марии благословенной и сохраняет форму будущего времени.
- source_word: πᾶσαι αἱ γενεαί
  choice: все поколения
  rationale: Точно передаёт последовательные поколения людей, не добавляя слова «будущие», уже подразумеваемого словом «отныне».
theological_decisions:
- issue: Самоназвание Марии δούλη
  choice: Своей рабы
  alternative: Своей служанки
  rationale: Основной вариант сохраняет сильный смысл полной принадлежности Богу, не вводя дополнительных мариологических выводов; более мягкий функциональный вариант отмечен в сноске.
- issue: Смысл ταπείνωσις в песни Марии
  choice: низкое положение
  alternative: уничижение; приниженность
  rationale: Перевод относит выражение к неприметному общественному положению Марии и не сводит его к нравственной добродетели смирения, сохраняя при этом возможные более сильные оттенки в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом, соответствующим песнопению Марии. «И вот» и «блаженной» сохраняют библейскую торжественность, оставаясь понятными; синтаксис не копирует греческий механически.
