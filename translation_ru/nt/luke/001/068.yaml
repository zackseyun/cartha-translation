  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: ru
  text: Благословен Господь, Бог Израиля, потому что Он посетил Свой народ[a] и совершил для него искупление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришёл на помощь Своему народу»; греческое «посетил» — библейское выражение, обозначающее внимательное и действенное вмешательство Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Благословен
  rationale: Предикативное прилагательное в славословии; традиционное и вместе с тем понятное современному читателю выражение.
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: Господь, Бог Израиля
  rationale: Сохраняет божественный титул, приложение и ветхозаветное богослужебное звучание формулы.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно вводит основание для благословения.
- source_word: ἐπεσκέψατο
  choice: посетил
  rationale: Сохраняет библейский образ Божьего посещения как внимательного и действенного вмешательства, не сводя его к узкому пересказу.
- source_word: ἐποίησεν λύτρωσιν
  choice: совершил искупление
  rationale: Естественно передаёт греческое сочетание «сделал искупление», сохраняя совершённое действие и богословскую весомость λύτρωσις.
- source_word: τῷ λαῷ αὐτοῦ
  choice: для Своего народа / для него
  rationale: Дательный падеж указывает на народ как получателя и благополучателя Божьего искупительного действия; местоимение устраняет тяжёлый повтор.
theological_decisions:
- issue: Образ Божьего посещения
  choice: посетил Свой народ
  alternative: пришёл на помощь Своему народу
  rationale: Буквальное выражение сохраняет библейскую метафору Божьего спасительного вмешательства и её смысловую многослойность.
- issue: Значение λύτρωσις
  choice: искупление
  alternative: избавление
  rationale: «Искупление» сохраняет оттенок освобождения ценой выкупа и устойчивую лексическую связь с новозаветной темой спасения, не исключая общего смысла избавления.
translation_notes:
  register: 'Современный литературный русский язык с достоинством славословия. Сохранён библейский оборот «посетил», а синтаксис слегка прояснён: народ назван объектом посещения и благополучателем искупления.'
