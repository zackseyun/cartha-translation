  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: ru
  text: по великому милосердию нашего Бога, в силу которого нас посетит рассвет свыше,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «восход»; греческое слово ἀνατολή может также перекликаться с мессианским названием «Отрасль» в греческом Ветхом Завете.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: по
  rationale: С винительным падежом выражает причину или основание; в сочетании «по глубокой милости» естественно передаёт мотив Божьего действия.
- source_word: σπλάγχνα ἐλέους
  choice: глубокой милости
  rationale: Буквально речь идёт о внутренностях как средоточии чувств; русское выражение передаёт сердечную глубину сострадания без неестественного буквализма.
- source_word: θεοῦ ἡμῶν
  choice: нашего Бога
  rationale: Прямо передаёт притяжательный родительный падеж.
- source_word: ἐν οἷς
  choice: благодаря которой
  rationale: Относительное выражение указывает на милость как основание или средство последующего посещения; единственное число согласовано с естественным русским собирательным выражением «милость».
- source_word: ἐπισκέψεται
  choice: посетит
  rationale: Сохраняет будущее время и библейский смысл посещения, подразумевающего действенную помощь, не разворачивая его в толкование.
- source_word: ἀνατολὴ
  choice: Рассвет
  rationale: В ближайшем контексте образ света поддерживает значение восхода или рассвета. Прописная буква показывает личностно-мессианское употребление образа, а возможный отзвук титула «Отрасль» отмечен в сноске.
- source_word: ἐξ ὕψους
  choice: свыше
  rationale: Естественно и кратко передаёт происхождение «с высоты», не конкретизируя его пояснительным словом «небеса».
theological_decisions:
- issue: Значение ἀνατολή в мессианском контексте
  choice: Рассвет
  alternative: Восход; Отрасль
  rationale: Образы света в стихах 78–79 делают значение «рассвет/восход» основным, но слово может также перекликаться с мессианским названием «Отрасль» в греческом Ветхом Завете. Эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Пунктуация учитывает, что стих продолжает предыдущее предложение.
