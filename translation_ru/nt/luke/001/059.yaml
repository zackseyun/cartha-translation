  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: ru
  text: И вот, на восьмой день пришли обрезать ребёнка и стали называть его Захарией[a] — по имени его отца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «называли его Захарией»; возможно также: «хотели назвать его Захарией». Греческий имперфект допускает незавершённое, продолжавшееся или предпринятое действие, что соответствует возражению в следующем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «называли его по имени его отца — Захарией». Речь идёт об обычае давать ребёнку имя одного из родственников.'
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: И вот
  rationale: Лаконично передаёт характерную для Луки повествовательную формулу, вводящую новое событие, без архаичного или тяжеловесного оборота.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: на восьмой день
  rationale: Естественная русская передача временного оборота с сохранением точного указания времени.
- source_word: ἦλθον
  choice: пришли
  rationale: Сохраняет неопределённый субъект множественного числа, не уточняя, кто именно пришёл.
- source_word: περιτεμεῖν
  choice: обрезать
  rationale: 'Прямо передаёт инфинитив цели: пришли с целью совершить обрезание.'
- source_word: τὸ παιδίον
  choice: ребёнка
  rationale: Нейтральный и естественный современный эквивалент παιδίον в данном контексте.
- source_word: ἐκάλουν
  choice: стали называть
  rationale: Передаёт незавершённость греческого имперфекта и естественно согласуется с возражением матери в следующем стихе, не представляя наречение окончательно состоявшимся.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: по имени его отца
  rationale: Передаёт смысл наречения ребёнка тем же именем, которое носил его отец, не добавляя идеи почитания, прямо не выраженной в греческом.
- source_word: Ζαχαρίαν
  choice: Захарией
  rationale: Использована традиционная и общеупотребительная русская форма библейского имени в требуемом падеже.
