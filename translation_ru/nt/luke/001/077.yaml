  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: ru
  text: чтобы дать Его народу познание спасения в прощении их грехов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через прощение их грехов»; или: «посредством прощения их грехов».'
    reason: Лексико-синтаксическая многозначность ἐν ἀφέσει.
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: чтобы дать
  rationale: Артиклевый инфинитив выражает цель по отношению к предыдущему стиху; конструкция «чтобы дать» естественно передаёт эту синтаксическую связь.
- source_word: γνῶσιν σωτηρίας
  choice: познание спасения
  rationale: «Познание» передаёт значение γνῶσις и сохраняет тесную связь с родительным σωτηρίας, не сводя выражение только к сообщению сведений о спасении.
- source_word: τῷ λαῷ αὐτοῦ
  choice: Его народу
  rationale: Дательный падеж обозначает получателя, а «Его народ» сохраняет притяжательное и заветное звучание исходного выражения.
- source_word: ἐν ἀφέσει
  choice: в прощении
  rationale: Буквально сохраняется ἐν с дательным падежом и не устраняется возможная смысловая многозначность между сферой, способом и средством.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: их грехов
  rationale: Сохранены множественное число ἁμαρτιῶν и отнесение αὐτῶν к народу.
theological_decisions:
- issue: Связь спасения с прощением грехов
  choice: Спасение познаётся в связи с прощением грехов, без дальнейшего уточнения характера этой связи.
  alternative: «через прощение их грехов» или «посредством прощения их грехов»
  rationale: Оборот ἐν ἀφέσει допускает понимание сферы, способа или средства. Основной текст сохраняет более открытую формулировку, а возможные инструментальные оттенки вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Форма «познание спасения» выбрана ради точности и смысловой ёмкости; порядок слов остаётся естественным для русского языка.
