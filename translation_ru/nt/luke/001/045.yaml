  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: ru
  text: И блаженна поверившая, что исполнится сказанное ей от Господа[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что исполнится сказанное ей от Господа». Греческий союз может иметь причинное значение, хотя здесь вероятнее значение «что», вводящее содержание веры.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «будет исполнение того, что было сказано ей»; возможны также значения «завершение», «доведение до конца», «осуществление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: блаженна
  rationale: Сохраняет религиозный и богословский вес слова в контексте Луки; «счастлива» звучало бы более субъективно, а «счастливая» — менее торжественно.
- source_word: ἡ πιστεύσασα
  choice: поверившая
  rationale: Субстантивированное причастие аориста естественно передаётся русским причастием и указывает на совершившийся акт веры.
- source_word: ὅτι
  choice: что
  rationale: 'Наиболее естественно вводит содержание веры: она поверила, что сказанное исполнится. Причинное значение «потому что» возможно, но менее вероятно.'
- source_word: τελείωσις
  choice: исполнится
  rationale: Глагольная перестройка естественна по-русски и точно передаёт доведение обещанного до осуществления.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: сказанное ей
  rationale: Передаёт содержание ранее произнесённых слов без избыточно буквального «вещи, сказанные ей».
- source_word: παρὰ κυρίου
  choice: от Господа
  rationale: 'Παρά с родительным обозначает источник: слова исходят от Господа. Русское «от Господа» сохраняет этот оттенок лучше, чем агентное «Господом».'
- source_word: κυρίου
  choice: Господа
  rationale: Традиционное и понятное обозначение Бога Израиля в данном контексте.
theological_decisions:
- issue: Связь блаженства Марии с её верой и обещанным словом
  choice: Мария названа блаженной как поверившая, что слово Господа исполнится.
  alternative: Мария блаженна потому, что сказанное ей исполнится; при таком прочтении ὅτι имеет причинное значение.
  rationale: Синтаксис наиболее естественно связывает πιστεύσασα с придаточным, раскрывающим содержание веры, при этом альтернативное причинное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Краткая конструкция «блаженна поверившая» сохраняет выразительность оригинала; «от Господа» подчёркивает источник слова.
