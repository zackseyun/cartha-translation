source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: ru
  text: 'Ангел ответил ей: «Святой Дух сойдёт на тебя, и сила Всевышнего осенит тебя. Поэтому и святое дитя, которое родится[a], будет названо Сыном Божьим[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рождаемое» или «то, что рождается». Греческое τὸ γεννώμενον в данном контексте относится к ребёнку.'
    reason: lexical_alternative
  - marker: b
    text: В греческом перед словом «Сын» нет артикля, однако здесь выражение имеет значение титула, а не смысл «один из сынов Бога».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: Ангел ответил ей
  rationale: Греческое сочетание буквально означает «ангел, ответив, сказал ей», но по-русски естественно передаётся одним глаголом «ответил», сохраняющим значение реплики в ответ.
- source_word: Πνεῦμα ἅγιον
  choice: Святой Дух
  rationale: В контексте речь идёт о Божьем Духе как действующем лице; традиционное и естественное русское наименование передаёт это без добавления отсутствующих в тексте пояснений.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: сойдёт на тебя
  rationale: Оборот обозначает направленное действие — пришествие Духа на Марию. «Сойдёт на тебя» естественно для русского библейского регистра и сохраняет оттенок движения свыше, не конкретизируя способ действия.
- source_word: δύναμις Ὑψίστου
  choice: сила Всевышнего
  rationale: Родительный падеж передан прямо, а Ὕψιστος сохранено как титул Бога — «Всевышний».
- source_word: ἐπισκιάσει σοι
  choice: осенит тебя
  rationale: Глагол сохраняет образ покрывающей тени и Божьего присутствия. «Осенит» звучит достойно и не вносит в текст биологических или сексуализированных объяснений.
- source_word: διὸ καὶ
  choice: Поэтому и
  rationale: Переданы как следственное значение διό («поэтому»), так и усилительно-присоединительный оттенок καί («и»).
- source_word: τὸ γεννώμενον
  choice: дитя, которое родится
  rationale: Субстантивированное причастие буквально означает «рождаемое / то, что рождается». В данном контексте оно относится к ребёнку; выбранный вариант понятен современному читателю и не делает русскую фразу искусственной.
- source_word: ἅγιον
  choice: будет святым
  rationale: Форма может восприниматься как предикативная характеристика рождаемого. Такой перевод близок греческому порядку смыслов и не превращает прилагательное без необходимости в отдельный титул «Святой».
- source_word: κληθήσεται
  choice: будет названо
  rationale: Будущий пассив καλέω передан прямо; формулировка допускает и именование, и признание соответствующей личности, не выбирая между этими оттенками.
- source_word: υἱὸς θεοῦ
  choice: Сыном Божьим
  rationale: В контексте безартиклевое греческое выражение имеет качественно-титульный, а не неопределённый смысл. Русский творительный падеж требуется после «будет названо».
theological_decisions:
- issue: Личный характер действия Πνεῦμα ἅγιον
  choice: Святой Дух сойдёт на тебя
  alternative: святой дух сойдёт на тебя
  rationale: Контекст представляет Божий Дух как непосредственного божественного деятеля. Заглавные буквы обозначают референта, не добавляя к стиху позднейшей догматической терминологии.
- issue: Образ divine agency в ἐπισκιάσει
  choice: сила Всевышнего осенит тебя
  alternative: сила Всевышнего покроет тебя тенью
  rationale: «Осенит» сохраняет метафору и богословскую сдержанность оригинала, не объясняя механизм зачатия сверх сказанного в тексте.
- issue: Синтаксическая связь ἅγιον
  choice: дитя… будет святым и будет названо Сыном Божьим
  alternative: рождающийся Святой будет назван Сыном Божьим
  rationale: Греческая конструкция допускает тесную связь ἅγιον с причастием и его предикативное прочтение. Выбранная формулировка сохраняет характеристику святости и избегает необоснованного превращения слова в самостоятельный титул; добавленное русское «и будет» лишь делает синтаксическую связь ясной.
- issue: Титульное значение υἱὸς θεοῦ
  choice: Сыном Божьим
  alternative: сыном Бога / одним из сынов Бога
  rationale: Отсутствие артикля в греческом не делает выражение неопределённым. В сцене благовещения оно функционирует как обозначение личности и статуса ребёнка; русский перевод не должен внушать смысл «один из многих».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Осенит» сохраняет образность оригинала, а «дитя, которое родится» заменяет неестественное для обычной русской речи субстантивированное «рождаемое». Все местоимения переданы без конфессионально обусловленной почтительной капитализации.
