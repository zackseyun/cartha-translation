  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: ru
  text: 'И Захария сказал ангелу: «Как я узнаю это? Ведь я стар, и жена моя уже в преклонных годах[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «продвинулась в своих днях»; это идиома, обозначающая преклонный возраст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: сказал
  rationale: Обычный повествовательный глагол речи; «сказал» естественно и точно передаёт форму оригинала.
- source_word: πρὸς τὸν ἄγγελον
  choice: ангелу
  rationale: При глаголе речи πρός обозначает адресата; русский дательный падеж передаёт это естественно.
- source_word: Κατὰ τί
  choice: По чему
  rationale: Выражение запрашивает основание или подтверждение, по которому Захария сможет узнать истинность обещанного; «по чему» сохраняет этот оттенок точнее, чем общее «как».
- source_word: γνώσομαι
  choice: я узнаю
  rationale: Будущая форма передаёт последующее обретение знания или уверенности; «узнаю» сохраняет будущее время и не смещает смысл к способности.
- source_word: τοῦτο
  choice: это
  rationale: Простое указание на возвещение ангела без лишнего уточнения.
- source_word: πρεσβύτης
  choice: я стар
  rationale: Существительное обозначает пожилого мужчину, а не должностное лицо; предикативное «я стар» в русском естественно и лаконично.
- source_word: γυνή
  choice: жена
  rationale: Притяжательное местоимение и контекст однозначно указывают на супругу.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: уже в преклонных годах
  rationale: Естественный современный русский эквивалент идиомы о преклонном возрасте; примечание сохраняет буквальный образ «продвинулась в своих днях».
theological_decisions:
- issue: Передача ἄγγελος
  choice: ангел
  alternative: вестник
  rationale: В непосредственном контексте речь идёт о Гаврииле; «ангел» здесь контекстуально точен и не добавляет к тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Вопрос «По чему я узнаю это?» намеренно сохраняет запрос Захарии на основание или подтверждение, а идиома о возрасте передана естественно с буквальным образом в сноске.
