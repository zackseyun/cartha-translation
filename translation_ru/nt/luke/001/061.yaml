  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: ru
  text: 'Они сказали ей: «Среди твоих родственников нет никого, кто носит это имя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Среди твоей родни нет никого, кого зовут этим именем».'
    reason: Слово συγγένεια может обозначать родственников или родню как собирательный круг; καλεῖται с именем можно передать как «кого зовут».
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: Они сказали ей
  rationale: Обычная для повествования передача аориста λέγω; πρός с винительным при глаголе речи обозначает адресата.
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: Среди твоих родственников нет никого
  rationale: Естественно передаёт отрицательную конструкцию и партитивное ἐκ; συγγένεια здесь означает круг родных, родственников.
- source_word: ὃς καλεῖται τῷ ὀνόματι τούτῳ
  choice: кто носил бы это имя
  rationale: В данном контексте καλεῖται с обозначением имени значит «называется/носит имя». Сослагательная форма по-русски естественно следует за отрицательным «нет никого, кто…», не изменяя смысла греческого настоящего времени.
