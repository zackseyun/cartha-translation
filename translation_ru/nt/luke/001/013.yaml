source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: ru
  text: 'Но ангел сказал ему: «Не бойся, Захария, потому что твоя молитва[a] услышана, и твоя жена Елизавета родит тебе сына, и ты назовёшь его Иоанном[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоя мольба услышана».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты назовёшь его имя Иоанном».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Но … сказал
  rationale: δέ обозначает мягкий переход с лёгким противопоставлением испугу Захарии; «но» естественно передаёт его, не делая контраст чрезмерным.
- source_word: ὁ ἄγγελος
  choice: ангел
  rationale: В данном повествовании речь идёт о небесном посланнике; «ангел» — точный и общепринятый русский эквивалент.
- source_word: Μὴ φοβοῦ
  choice: Не бойся
  rationale: Естественная современная русская форма запрета, непосредственно относящаяся к испугу Захарии.
- source_word: Ζαχαρία
  choice: Захария
  rationale: Традиционная и узнаваемая русская форма новозаветного имени.
- source_word: διότι
  choice: потому что
  rationale: Союз вводит причину, по которой Захарии не следует бояться.
- source_word: εἰσηκούσθη
  choice: услышана
  rationale: Пассив сохранён без добавления названного действующего лица; в контексте подразумевается, что молитву услышал Бог.
- source_word: ἡ δέησίς σου
  choice: твоя молитва
  rationale: δέησις означает обращённую к Богу настоятельную просьбу. «Молитва» естественна в основном тексте, а более узкий оттенок «мольба» отражён в сноске.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: твоя жена Елисавета
  rationale: Притяжательное местоимение и контекст однозначно указывают на значение «жена».
- source_word: γεννήσει υἱόν σοι
  choice: родит тебе сына
  rationale: С женским субъектом γεννάω означает «родить»; дательный σοι естественно передан словом «тебе».
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: ты назовёшь его Иоанном
  rationale: Естественный современный русский способ передать семитизированное греческое выражение; буквальная структура приведена в сноске.
- source_word: Ἰωάννην
  choice: Иоанном
  rationale: «Иоанн» — традиционная русская форма имени; творительный падеж требуется глаголом «назовёшь».
theological_decisions:
- issue: Кто услышал молитву в пассивной конструкции εἰσηκούσθη
  choice: Сохранить безлично-пассивное выражение «молитва услышана», подразумевающее действие Бога.
  alternative: «Бог услышал твою молитву».
  rationale: В молитвенном и иудейском повествовательном контексте подразумевается Бог, однако греческий текст прямо Его не называет. Пассивная конструкция сохраняет эту особенность и не делает неявное явным.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим повествованию о благовещении. Синтаксис сделан естественным для обычного читателя; при этом пассив «услышана» и последовательность обещаний сохранены. Буквальная формула наречения имени вынесена в сноску.
