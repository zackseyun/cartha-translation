id: LUK.1.76
reference: Luke 1:76
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: ru
  text: И ты, дитя, будешь назван пророком Всевышнего, потому что пойдёшь перед Господом[a], чтобы приготовить пути Его[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии Господа». Выражение может означать как идти впереди кого-либо, так и служить перед ним.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с пророческими обещаниями о приготовлении пути перед Господом (ср. Ис 40:3; Мал 3:1). В повествовании Луки они исполняются в служении Иоанна, предшествующем служению Иисуса.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: И ты
  rationale: Сочетание вводит обращение к ребёнку с подчёркнутым переходом. В современном русском «И ты» естественно передаёт этот акцент; добавление «также» здесь было бы тяжеловесным.
- source_word: παιδίον
  choice: дитя
  rationale: Обращение к младенцу Иоанну. «Дитя» сохраняет теплоту и достоинство пророческой речи, не уточняя возраст сверх греческого текста.
- source_word: προφήτης
  choice: пророк
  rationale: Прямое и общепринятое соответствие греческому существительному.
- source_word: Ὑψίστου
  choice: Всевышнего
  rationale: Устоявшийся русский эквивалент почтительного божественного титула с сохранением родительного падежа.
- source_word: κληθήσῃ
  choice: будешь назван
  rationale: Будущая пассивная форма обозначает наречение или признание в определённом качестве. «Будешь назван» точно и естественно передаёт это значение.
- source_word: προπορεύσῃ
  choice: пойдёшь перед
  rationale: Глагол означает идти впереди кого-либо. Формулировка сохраняет образ предшественника и связь с последующим приготовлением путей.
- source_word: ἐνώπιον κυρίου
  choice: перед Господом
  rationale: ἐνώπιον допускает как пространственное «перед», так и «в присутствии». В контексте служения предтечи «перед Господом» естественно сохраняет обе смысловые возможности.
- source_word: ἑτοιμάσαι
  choice: чтобы приготовить
  rationale: Инфинитив выражает цель предшествующего действия; русская целевая конструкция передаёт синтаксическую связь ясно и естественно.
- source_word: ὁδοὺς αὐτοῦ
  choice: пути Его
  rationale: Сохранено множественное число греческого текста и отзвук пророческих текстов о приготовлении путей Господа.
theological_decisions:
- issue: Кого обозначает «Господь» в пророчестве о предтече
  choice: Сохранить титул «Господь», не сужая его референцию в основном тексте.
  alternative: Явно истолковать как Бога в свете Ис 40:3 и Мал 3:1 либо как Иисуса в повествовании Луки.
  rationale: Ветхозаветный фон говорит о приготовлении пути перед Господом, а повествование Луки показывает Иоанна предтечей Иисуса. Нейтральное сохранение титула удерживает заложенное в тексте богословское напряжение.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. «Дитя» выбрано как уместное прямое обращение в пророческой песне; прописная буква в «Его» поддерживает традиционный почтительный регистр. Пунктуация заканчивается запятой согласно положению стиха внутри продолжающегося предложения.
