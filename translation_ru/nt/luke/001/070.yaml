lexical_decisions:
- source_word: καθὼς
  choice: как и
  rationale: Передаёт соответствие предшествующего события тому, что Бог ранее возвещал; по-русски естественнее, чем буквальное «точно как».
- source_word: ἐλάλησεν
  choice: говорил
  rationale: Глагол речи согласуется с оборотом «устами пророков»; прошедшее несовершенного вида естественно выражает неоднократное пророческое возвещение.
- source_word: διὰ στόματος
  choice: устами
  rationale: Русский творительный сохраняет библейский образ посредничества речи, не создавая тяжеловесного оборота «через уста».
- source_word: τῶν ἁγίων ... προφητῶν
  choice: Своих святых пророков
  rationale: Прилагательное относится к пророкам, а возвратное «Своих» ясно связывает их с субъектом «говорил», то есть с Богом.
- source_word: ἀπ’ αἰῶνος
  choice: издавна
  rationale: Естественно обозначает далёкую древность и сохраняет историко-пророческий смысл контекста, не утверждая однозначно метафизическую вечность.
- source_word: αὐτοῦ
  choice: Своих
  rationale: Возвратное местоимение — нормативный русский способ обозначить принадлежность пророков тому же лицу, которое является субъектом речи.
theological_decisions:
- issue: Временной охват ἀπ’ αἰῶνος
  choice: далёкая древность («издавна»)
  alternative: «от века» / «от вечности»
  rationale: Упоминание пророков указывает прежде всего на давнюю историю Божьего пророческого свидетельства. Сноска сохраняет более сильную возможную трактовку, не внося её прямо в текст.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и библейского образа речи Божьей устами пророков. Прописная буква в «Своих» употреблена как традиционный знак уважения к Богу, не меняющий смысла исходного текста.
