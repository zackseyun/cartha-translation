  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: ru
  text: 'Мария сказала: «Вот я, раба Господа.[a] Да будет мне по твоему слову».[b] И ангел отошёл от неё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанка Господа». Греческое δούλη означает женщину-рабыню; «служанка» передаёт оттенок смиренного служения, но может слабее выражать принадлежность Господу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Пусть будет со мной по твоему слову».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: сказала
  rationale: Слабый повествовательный связующий элемент естественно остаётся невыраженным по-русски; отдельное «и» перед первой репликой утяжеляло бы фразу.
- source_word: Ἰδοὺ
  choice: Вот я
  rationale: Передаёт подчёркнутое и торжественное самопредставление Марии естественным русским оборотом.
- source_word: δούλη
  choice: служанка
  rationale: Сохраняет женский род и выражает смиренное подчинение Господу; буквальный оттенок рабского статуса отмечен в сноске.
- source_word: κυρίου
  choice: Господа
  rationale: Передаёт κύριος как божественный титул и сохраняет отношение принадлежности.
- source_word: γένοιτό μοι
  choice: Пусть будет со мной
  rationale: Оптатив выражает добровольное согласие и пожелание; формулировка естественна по-русски и не превращает высказывание в простое предсказание.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: по твоему слову
  rationale: Кратко сохраняет идею соответствия сказанному ангелом и ключевое значение ῥῆμα как произнесённого слова или сообщения.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: отошёл от неё
  rationale: Прямо передаёт удаление ангела от Марии и соответствует приподнятому, но современному повествовательному регистру.
- source_word: ὁ ἄγγελος
  choice: ангел
  rationale: В контексте повествования Луки речь идёт об ангельском существе, а не просто о человеческом вестнике.
theological_decisions:
- issue: Самоназвание Марии δούλη
  choice: служанка Господа
  alternative: рабыня Господа
  rationale: δούλη может обозначать рабыню или служанку. В контексте на первом плане смиренное и добровольное подчинение Марии Божьей воле, однако более сильный социально-правовой оттенок слова сохранён в сноске.
- issue: Смысл γένοιτό μοι
  choice: Пусть будет со мной по твоему слову
  alternative: Да будет мне по твоему слову
  rationale: Аористный оптатив выражает согласие-пожелание, а не простую будущность. Основной вариант ясно передаёт добровольное принятие сказанного, тогда как традиционная формула дана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Вот я» сохраняет торжественность Ἰδοὺ без архаичного «се», а «пусть будет со мной» передаёт оптатив естественно и ясно.
