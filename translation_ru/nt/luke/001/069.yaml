lexical_decisions:
- source_word: ἤγειρεν
  choice: воздвиг
  rationale: Аорист передаёт совершённое спасительное действие Бога; «воздвиг» сохраняет библейский оборот о явлении поставленного Богом избавителя и естественно звучит в контексте пророческой хвалы.
- source_word: κέρας σωτηρίας
  choice: рог спасения
  rationale: Сохранён конкретный библейский образ силы и победоносного избавления, а также форма родительного падежа; смысл поясняется в сноске.
- source_word: ἡμῖν
  choice: для нас
  rationale: 'Дательный падеж выражает пользу: спасительная сила воздвигнута ради нас.'
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: в доме Давида
  rationale: «Дом» обозначает род и династию Давида. Буквальный оборот остаётся понятным по-русски и сохраняет связь с обетованиями Давиду.
- source_word: παιδὸς αὐτοῦ
  choice: Своего слуги
  rationale: По отношению к Давиду παῖς в библейской речи означает Божьего слугу, а не ребёнка. Возвратное «Своего» ясно соотносит слугу с Богом, субъектом действия.
theological_decisions:
- issue: Сохранять ли метафору κέρας σωτηρίας или передать её истолкованием
  choice: В основном тексте сохранено «рог спасения».
  alternative: могущественного Спасителя
  rationale: Метафора восходит к ветхозаветному языку царской силы и победного избавления. Её сохранение удерживает литературные и богословские связи, не сужая образ до одного истолкования; понятный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский с сохранением достоинства поэтической пророческой речи. Библейская метафора оставлена в тексте; прописное «Своего» употреблено для ясной отсылки к Богу.
