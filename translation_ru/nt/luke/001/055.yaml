  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: ru
  text: как Он сказал нашим отцам[a] — Аврааму и его потомству[b] — навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашим предкам». Буквально в греческом: «нашим отцам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его семени». В греческом употреблено собирательное существительное в единственном числе, которое может означать «семя», «потомство» или «потомков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: как… и
  rationale: Русская конструкция «как… и» естественно выражает соответствие предшествующего действия ранее данному Божьему слову.
- source_word: ἐλάλησεν
  choice: говорил
  rationale: Аорист передан прошедшим временем; «говорил» естественно сочетается с адресатами и сохраняет акцент на Божьей речи.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: нашим отцам
  rationale: Сохраняет явно мужскую форму греческого текста и её патриархально-заветный оттенок; более обобщённое «нашим предкам» отмечено в сноске.
- source_word: τῷ Ἀβραὰμ
  choice: Аврааму
  rationale: Дательный падеж естественно продолжает подразумеваемое управление глагола «говорил» и представляет Авраама как уточнение к «нашим отцам».
- source_word: τῷ σπέρματι αὐτοῦ
  choice: его потомству
  rationale: «Потомство» — естественное русское собирательное существительное в единственном числе, сохраняющее форму и диапазон значения греческого σπέρμα.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Устойчивое и достаточно возвышенное русское соответствие выражению со значением непреходящей длительности.
theological_decisions:
- issue: Передача πατέρας ἡμῶν в контексте истории завета
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Буквальная мужская форма сохраняет отсылку к праотцам Израиля и не нейтрализует формулировку источника; более широкое современное соответствие дано в сноске.
- issue: Передача σπέρματι αὐτοῦ в обетовании Аврааму
  choice: его потомству
  alternative: его семени; его потомкам
  rationale: «Потомству» сохраняет собирательное единственное число и не сводит потенциальную богословскую многозначность ни исключительно к одному потомку, ни к явному множеству; буквальное «семени» приведено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Местоимение «Он» написано с прописной буквы как уважительное обозначение Бога. Тире делает приложение «Аврааму и его потомству» ясным по-русски, не устраняя возможной синтаксической связи с предыдущей фразой.
