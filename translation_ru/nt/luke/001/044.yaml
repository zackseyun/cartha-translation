  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: ru
  text: Ибо вот, когда звук твоего приветствия достиг моих ушей, младенец радостно взыграл[a] в моей утробе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «младенец взыграл в ликовании в моей утробе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: ведь
  rationale: ἰδού здесь усиливает и вводит пояснение, выраженное γάρ. В естественной современной русской речи отдельное «вот» перед «ведь» было бы тяжеловесно; «ведь» ясно сохраняет пояснительную связь с предыдущими словами.
- source_word: ὡς ἐγένετο
  choice: как только … достиг
  rationale: Оборот обозначает момент наступления события и в данном контексте естественно передаётся конструкцией непосредственного следования «как только».
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: звук твоего приветствия
  rationale: φωνή обозначает здесь слышимый звук приветствия; такая передача сохраняет конкретную слуховую образность и не создаёт неестественного сочетания «голос приветствия».
- source_word: εἰς τὰ ὦτά μου
  choice: достиг моих ушей
  rationale: Глагольная формулировка естественно передаёт направленность εἰς и сохраняет телесный образ слухового восприятия.
- source_word: ἐσκίρτησεν
  choice: взыграл
  rationale: «Взыграл» — достоинная и понятная библейская лексема, способная одновременно передать резкое движение младенца и радостную окраску контекста.
- source_word: ἐν ἀγαλλιάσει
  choice: радостно
  rationale: Наречие естественно передаёт обстоятельственное значение оборота и его смысл — ликование, бурную радость.
- source_word: τὸ βρέφος
  choice: младенец
  rationale: βρέφος обозначает младенца, в том числе ещё не родившегося; русский эквивалент точен и не требует добавочных толкований.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: в моей утробе
  rationale: «Утроба» точно и в достойном регистре передаёт здесь место пребывания нерождённого младенца.
theological_decisions:
- issue: Обозначение нерождённого Иоанна словом βρέφος
  choice: младенец
  alternative: ребёнок
  rationale: Выбор сохраняет обычное значение греческого слова применительно к младенцу в утробе, не добавляя к формулировке текста отдельного доктринального тезиса.
- issue: Связь движения младенца с ἀγαλλίασις
  choice: радостно взыграл
  alternative: взыграл в ликовании
  rationale: Передача сохраняет прямую характеристику движения как исполненного радости, не объясняя сверх текста источник или природу этой радости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Взыграл» сохраняет достоинство и смысловую ёмкость оригинала; синтаксис остаётся ясным для обычного читателя.
