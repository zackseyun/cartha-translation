  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: ru
  text: 'По прошествии этих дней его жена Елизавета зачала и в течение пяти месяцев скрывалась, говоря:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: После этих дней
  rationale: μετά с винительным падежом обозначает временную последовательность; ταύτας прямо передано указательным местоимением «этих». Слабое связующее δέ отдельно не выражено ради естественного русского повествования.
- source_word: συνέλαβεν
  choice: зачала
  rationale: В данном контексте глагол означает зачатие ребёнка; «зачала» непосредственно и кратко передаёт греческое выражение.
- source_word: Ἐλισάβετ
  choice: Елисавета
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: его жена
  rationale: γυνή здесь, при указании на принадлежность и в брачном контексте, означает «жена».
- source_word: περιέκρυβεν ἑαυτὴν
  choice: скрывалась
  rationale: Возвратная форма естественно передаёт ἑαυτήν, а несовершенный вид русского глагола отражает продолженное действие греческого имперфекта.
- source_word: μῆνας πέντε
  choice: пять месяцев
  rationale: Винительный падеж обозначает длительность; по-русски длительность естественно выражается без предлога.
- source_word: λέγουσα
  choice: 'говоря:'
  rationale: Деепричастие сохраняет причастную связь с последующей прямой речью; двоеточие указывает, что содержание речи следует в следующем стихе.
