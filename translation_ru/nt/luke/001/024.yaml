translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Порядок слов перестроен ради естественности: «его жена Елисавета» вместо буквального «Елисавета, жена его». Имперфект передан несовершенным видом «скрывалась», поэтому отдельная сноска об аспектуальности не требуется.'
