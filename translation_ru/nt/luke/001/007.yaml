  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: ru
  text: И детей у них не было, потому что Елисавета была бесплодна, и оба они были уже в преклонных летах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «продвинулись в своих днях».'
    reason: Сноска сохраняет образность греческой идиомы, переданной в тексте естественным русским выражением о преклонном возрасте.
lexical_decisions:
- source_word: τέκνον
  choice: детей
  rationale: Хотя в греческом стоит единственное число, в русском отрицательная конструкция «детей не было» естественно обозначает отсутствие потомства вообще и не подразумевает множественности.
- source_word: καθότι
  choice: потому что
  rationale: Союз вводит причину их бездетности; «потому что» ясно и естественно передаёт причинную связь.
- source_word: στεῖρα
  choice: бесплодна
  rationale: Слово прямо обозначает неспособность иметь детей; «бесплодна» сохраняет отличие между причиной и уже названным результатом — бездетностью.
- source_word: ἀμφότεροι
  choice: оба они
  rationale: Передаёт подчёркнутое отнесение последующего утверждения и к Захарии, и к Елисавете.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: были уже в преклонных летах
  rationale: Уважительная и естественная русская идиома передаёт смысл преклонного возраста и отчасти сохраняет образ прожитых дней.
- source_word: οὐκ ἦν αὐτοῖς
  choice: у них не было
  rationale: Греческая конструкция обладания буквально означает «не было у них» и естественно воспроизводится той же русской конструкцией.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «В преклонных летах» звучит уважительно и понятно; «бесплодна» точно передаёт медицинско-жизненное состояние, не смешивая его с бездетностью.
