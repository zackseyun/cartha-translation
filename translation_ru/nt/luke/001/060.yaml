  source_fidelity: 'Смысл в целом передан верно: мать отвергает предложенное имя и утверждает, что ребёнка назовут Иоанном. Однако καὶ при ответном причастии обычно следует передать нейтральным «И» (или опустить без противопоставительного оттенка); начальное «Но» преждевременно вносит контраст, который в самой реплике уже выражен словами «Нет, напротив».'
