  language: ru
  text: 'И его мать ответила: «Нет, напротив, его назовут Иоанном».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: возразила
  rationale: Аористное причастие от ἀποκρίνομαι вводит прямую речь; в данном контексте мать отвечает на предложенное имя и возражает, поэтому естественное русское «возразила» передаёт как ответ, так и корректирующую силу реплики.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: его мать
  rationale: Естественная русская передача определённой именной группы с притяжательным местоимением.
- source_word: Οὐχί
  choice: Нет
  rationale: Прямой и сильный отрицательный ответ в диалоге.
- source_word: ἀλλὰ
  choice: но
  rationale: Союз вводит исправление предыдущего предположения; в сочетании «Нет, но…» русское «но» ясно и естественно передаёт противопоставление.
- source_word: κληθήσεται
  choice: его назовут
  rationale: Будущее страдательное от καλέω в контексте наречения имени. Неопределённо-личная русская конструкция естественно передаёт греческий пассив, не добавляя действующего лица.
- source_word: Ἰωάννης
  choice: Иоанном
  rationale: Традиционная русская форма имени; творительный падеж требуется конструкцией «назовут Иоанном».
