base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: ru
  text: 'Но Мария сказала ангелу: «Как это будет, ведь я не знаю мужчины[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть: «у меня не было близости с мужчиной». В греческом тексте «знать мужчину» — сдержанное выражение, обозначающее половые отношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкий контраст между возвещением ангела и вопросом Марии, не превращая его в резкое возражение.
- source_word: Μαριὰμ
  choice: Мария
  rationale: Устоявшаяся русская форма имени.
- source_word: πρὸς τὸν ἄγγελον
  choice: ангелу
  rationale: Дательный адресата естественно передаёт греческое сочетание с πρὸς; в контексте речь идёт о небесном ангеле.
- source_word: Πῶς ἔσται τοῦτο
  choice: Как это будет
  rationale: Сохраняет простоту и будущую форму греческого вопроса, звуча естественно и торжественно по-русски.
- source_word: ἐπεὶ
  choice: если
  rationale: В данном вопросе русское «если» естественно вводит обстоятельство, на котором основано недоумение Марии; причинное «поскольку» возможно, но тяжелее стилистически.
- source_word: ἄνδρα οὐ γινώσκω
  choice: я не знаю мужа
  rationale: Сохраняет библейский эвфемизм «знать» для половых отношений. «Муж» здесь допускает значение взрослого мужчины и не утверждает, что речь только о законном супруге; смысл пояснён в сноске.
theological_decisions:
- issue: Слова Марии и девственное зачатие Иисуса
  choice: Сохранить в основном тексте эвфемизм «я не знаю мужа»
  alternative: «у меня не было близости с мужчиной» или «я девственница»
  rationale: Греческий текст употребляет выражение γινώσκω ἄνδρα, буквально связанное со «знанием» мужчины и в контексте означающее половую близость. Перевод сохраняет формулировку источника и не заменяет её богословски верным, но более явным толкованием.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, достоинства и библейского эвфемизма. «Как это будет» намеренно оставлено без поясняющего «произойдёт», чтобы не расширять исходную формулировку.
