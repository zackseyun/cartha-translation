source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: ru
  text: На шестом месяце[a] ангел Гавриил был послан от Бога в галилейский город под названием Назарет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на шестом месяце беременности Елисаветы; см. Лк. 1:24, 36.
    reason: cross_reference
  - marker: b
    text: 'Или: «в город Галилеи, называемый Назаретом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: На шестом месяце
  rationale: Предлог ἐν с дательным выражает время. Частица δέ служит мягкой связкой с предыдущим повествованием и в естественном русском не требует отдельной передачи союзом.
- source_word: ἀπεστάλη
  choice: был послан
  rationale: Аорист пассивного залога от ἀποστέλλω прямо передан пассивной конструкцией, сохраняющей смысл поручения и не меняющей указание на источник на прямое обозначение деятеля.
- source_word: ὁ ἄγγελος
  choice: ангел
  rationale: В данном повествовательном контексте речь идёт о небесном ангеле, а не просто о человеческом вестнике.
- source_word: Γαβριὴλ
  choice: Гавриил
  rationale: Использована закрепившаяся в русском библейском и литературном употреблении форма имени.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: от Бога
  rationale: 'ἀπό с родительным прежде всего указывает на источник: ангел послан от Бога. Вариант «Богом» сильнее выдвигал бы значение деятеля.'
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: в галилейский город
  rationale: εἰς обозначает направление, а родительный τῆς Γαλιλαίας естественно передаётся по-русски относительным прилагательным «галилейский».
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: под названием Назарет
  rationale: Относительная конструкция буквально означает «имя которому Назарет»; выбран современный и ясный русский оборот без добавления сведений.
theological_decisions:
- issue: К чему относится выражение «шестой месяц»
  choice: В основном тексте сохранено неуточнённое «на шестом месяце»; контекстуальное отнесение к беременности Елисаветы вынесено в примечание.
  alternative: Прямо написать «на шестом месяце беременности Елисаветы».
  rationale: Ближайший контекст указывает на беременность Елисаветы, однако сам греческий текст стиха этого уточнения не повторяет; его добавление в основной текст устранило бы формальную недосказанность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; пассивная конструкция и смысловая неопределённость временного указания сохранены.
