  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: ru
  text: 'Войдя к ней, ангел сказал: «Радуйся[a], наделённая благодатью[b]! Господь с тобой».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приветствую тебя», «здравствуй». Греческое слово служило обычным приветствием, хотя буквально означает «радуйся».'
