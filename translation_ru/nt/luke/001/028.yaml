  - marker: b
    text: 'Или: «облагодатствованная», «та, кому оказано благоволение»; традиционно: «исполненная благодати». Греческое слово указывает на ту, которой дарована благодать или оказано особое благоволение.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: войдя к ней
  rationale: Аористное причастие с πρός обозначает вход и приближение к Марии перед основной речью. Русское «войдя к ней» естественно передаёт последовательность действий; слово «ангел» восстановлено из ближайшего контекста как подразумеваемое подлежащее.
- source_word: Χαῖρε
  choice: Радуйся
  rationale: Форма буквально является повелительным наклонением от χαίρω («радоваться»), но одновременно служит обычным греческим приветствием. «Радуйся» сохраняет форму и важный смысловой оттенок, а приветственное значение поясняется в сноске.
- source_word: κεχαριτωμένη
  choice: удостоенная благодати
  rationale: Перфектное страдательное причастие от χαριτόω представляет Марию как ту, которую Бог наделил благодатью или милостью, причём результат этого действия сохраняется. Формулировка передаёт пассивный смысл, не превращая благодать во внутреннее качество или запас.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Стандартный русский библейский титул Бога, сохраняющий достоинство и преемственность словоупотребления.
- source_word: μετὰ σοῦ
  choice: с тобой
  rationale: μετά с родительным означает совместное присутствие; в русском именная конструкция «Господь с тобой» естественна и не требует выраженной связки.
theological_decisions:
- issue: Передача κεχαριτωμένη в богословски чувствительном тексте о Марии
  choice: удостоенная благодати
  alternative: облагодатствованная; исполненная благодати; снискавшая благоволение
  rationale: Выбранный вариант подчёркивает, что Мария является получательницей Божьей благодати, и передаёт страдательный залог греческой формы. Он не вносит позднейших вероучительных выводов, но и не ослабляет сильного утверждения о дарованной ей благодати. Традиционный и другие возможные варианты приведены в сноске.
- issue: Приветствие или повеление в Χαῖρε
  choice: Радуйся
  alternative: Приветствую тебя; здравствуй
  rationale: Греческое слово функционирует как приветствие, но его буквальная форма «радуйся» может быть значимой в повествовании. Основной текст сохраняет эту напряжённость, а сноска объясняет идиоматическое употребление.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественности ангельского приветствия. «Радуйся» намеренно оставлено в основном тексте как естественное библейское обращение, одновременно отражающее буквальную форму греческого слова. Архаичное «благодатная» не выбрано из-за неоднозначности и возможного восприятия как обозначения собственного качества Марии.
