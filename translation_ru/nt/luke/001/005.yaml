  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: ru
  text: Во дни Ирода, царя Иудеи, был священник по имени Захария, из священнической череды Авии[a]. Его жена происходила из дочерей Аарона[b], и звали её Елисавета.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Священническая череда Авии — одна из групп священников, которые по очереди несли служение при храме.
    reason: cultural_note
  - marker: b
    text: 'То есть происходила из рода Аарона. По-гречески буквально: «из дочерей Аарона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: был
  rationale: В данном повествовательном введении γίνομαι представляет нового участника; русское «был» естественно передаёт экзистенциальный смысл.
- source_word: ἐν ταῖς ἡμέραις
  choice: во дни
  rationale: Устойчивое и понятное литературное выражение, близкое греческому временному обороту.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Ирода, царя Иудеи
  rationale: Генитивная конструкция обозначает правителя и подвластную ему территорию; «Иудея» соответствует историко-географическому значению Ἰουδαία.
- source_word: ἱερεύς τις
  choice: священник
  rationale: Неопределённое τις при введении нового лица естественно передаётся контекстом и отсутствием определённого артикля в русском, без тяжеловесного «некий».
- source_word: ὀνόματι Ζαχαρίας
  choice: по имени Захария
  rationale: Естественный русский эквивалент греческой формулы именования.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: из Авиевой череды
  rationale: ἐφημερία обозначает установленную группу священников, поочерёдно несущую храмовое служение; «череда» кратко передаёт как состав группы, так и идею очередности.
- source_word: γυνὴ αὐτῷ
  choice: его жена
  rationale: Дательный αὐτῷ имеет посессивное значение. Конструкция «его жена» естественна по-русски и не добавляет смысл сверх текста.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: происходила из дочерей Аарона
  rationale: Сохранён конкретный родовой образ греческого текста; глагол «происходила» ясно выражает значение происхождения.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: звали её Елисавета
  rationale: Естественная современная русская формула именования, эквивалентная буквальному «имя её — Елисавета».
- source_word: Ζαχαρίας / Ἐλισάβετ / Ἀβιά / Ἀαρών
  choice: Захария / Елисавета / Авий / Аарон
  rationale: Употреблены закрепившиеся в русском библейском языке формы имён, понятные современному читателю.
theological_decisions:
- issue: Родословное обозначение происхождения Елисаветы
  choice: из дочерей Аарона
  alternative: из потомков Аарона
  rationale: Греческий текст буквально сохраняет женский родовой образ «из дочерей Аарона». Основной текст не заменяет его более общим толкованием, а значение родового происхождения поясняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно сохранённой библейской торжественностью. «Во дни» и традиционные формы имён поддерживают достоинство стиля; синтаксис упрощён до естественного русского без утраты единства повествования. Маркеры сносок поставлены непосредственно после поясняемых выражений.
