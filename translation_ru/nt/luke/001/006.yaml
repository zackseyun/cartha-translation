  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: ru
  text: Оба они были праведны перед Богом[a] и жили безупречно, исполняя все заповеди и установления Господа.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в глазах Бога».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод: «и были безупречны, следуя всем заповедям и установлениям Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Оба они были
  rationale: Частица δέ служит мягкой повествовательной связкой и не требует отдельного перевода в естественном русском контексте; множественное число и акцент ἀμφότεροι переданы словами «оба они».
- source_word: δίκαιοι
  choice: праведны
  rationale: «Праведны» сохраняет нравственный и заветный смысл слова, не сводя его к юридической справедливости или общей порядочности.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: перед Богом
  rationale: 'Выражение передаёт оценочный смысл: их праведность признаётся Богом, а не только людьми. Возможный вариант отмечен в сноске.'
- source_word: πορευόμενοι
  choice: жили
  rationale: В данном контексте глагол движения метафорически обозначает образ жизни; «жили» ясно и естественно передаёт этот этический смысл на современном русском языке.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: исполняя все заповеди
  rationale: Оборот передаёт образ жизни в послушании всем заповедям. «Исполняя» естественнее по-русски, чем буквальное «ходя во всех заповедях», при сохранении всеохватности πάσαις.
- source_word: δικαιώμασιν
  choice: установления
  rationale: «Установления» обозначает предписанные нормы и сохраняет различие с «заповедями», не придавая слову узко юридического оттенка.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Традиционное и контекстуально уместное обозначение Бога Израиля как Господа завета.
- source_word: ἄμεμπτοι
  choice: безупречно
  rationale: Греческое прилагательное характеризует обоих как не заслуживающих упрёка; наречная форма образует естественную русскую фразу и связывает характеристику с их образом жизни.
theological_decisions:
- issue: Означает ли ἄμεμπτοι абсолютную безгрешность
  choice: Слово описывает безупречный, не заслуживающий упрёка образ жизни в верности Божьим заповедям, не уточняя вопрос абсолютной безгрешности.
  alternative: Понять выражение как утверждение абсолютного нравственного совершенства.
  rationale: Контекст связывает характеристику с исполнением заповедей и установлений. Перевод сохраняет сильное слово «безупречно», но не добавляет отсутствующего в тексте догматического пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Буквальная метафора «ходить» заменена естественным «жили», а различие между «заповедями» и «установлениями» сохранено. Все маркеры сносок присутствуют в основном тексте.
