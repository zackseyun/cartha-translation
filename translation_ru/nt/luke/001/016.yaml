  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: ru
  text: И он обратит многих сынов Израиля к Господу, их Богу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей Израиля»; или: «израильтян». По-гречески буквально: «сынов Израиля» — традиционное обозначение народа завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет соединительную связь с предыдущим стихом и естественное течение повествования.
- source_word: πολλοὺς
  choice: многих
  rationale: Прилагательное употреблено субстантивированно; краткое русское соответствие сохраняет прямой смысл.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: из сынов Израиля
  rationale: Сохраняет явную формулировку греческого текста и традиционное библейское обозначение народа завета; предлог «из» естественно передаёт частичное значение родительного падежа после «многих».
- source_word: ἐπιστρέψει
  choice: обратит
  rationale: Будущее время действительного залога представляет Иоанна как того, через кого многие будут направлены обратно к Богу; «обратит» сохраняет переходность и духовный смысл без узкого конфессионального оттенка слова «конвертирует».
- source_word: ἐπὶ
  choice: к
  rationale: При ἐπιστρέφω с винительным падежом обозначает направленность к лицу; по-русски естественно передаётся предлогом «к».
- source_word: κύριον
  choice: Господу
  rationale: В данном контексте обозначает Бога Израиля и несёт заветный смысл, а не значение человеческого господина.
- source_word: τὸν θεὸν αὐτῶν
  choice: их Богу
  rationale: Приложение к слову «Господу»; такая форма естественна по-русски и сохраняет заветное выражение.
theological_decisions:
- issue: Передача заветного выражения τῶν υἱῶν Ἰσραὴλ
  choice: сынов Израиля
  alternative: детей Израиля; израильтян
  rationale: Буквальное выражение сохраняет мужской род исходного текста и традиционное библейское звучание; более идиоматичные варианты отмечены в сноске.
- issue: Референт κύριον τὸν θεὸν αὐτῶν
  choice: Господу, их Богу
  alternative: их Владыке и Богу
  rationale: Приложение прямо отождествляет Господа с Богом Израиля; «Господь» сохраняет богословскую и заветную силу выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, торжественным регистром. Порядок слов сделан естественным для русского, при этом сохранены соединительное «И», переходное «обратит» и заветное выражение «сыны Израиля».
