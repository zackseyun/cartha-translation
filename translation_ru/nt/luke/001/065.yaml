  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: ru
  text: И страх охватил всех, кто жил вокруг них,[a] и по всей нагорной области Иудеи говорили обо всём этом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «страх» здесь может включать и благоговейный трепет перед явным действием Бога.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обо всех этих словах»; греческое слово может обозначать также события или обстоятельства, о которых говорят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: страх охватил всех
  rationale: Естественная русская передача наступления состояния, выраженного греческой конструкцией; сохраняет прямое значение φόβος, не сводя его только к благоговению.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: кто жил вокруг них
  rationale: Передаёт значение проживания поблизости и не сужает круг лиц до близких знакомых, что могло бы подразумевать слово «соседи».
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: по всей нагорной области Иудеи
  rationale: ἡ ὀρεινή обозначает гористую, возвышенную область; формулировка звучит естественно и сохраняет географический смысл.
- source_word: διελαλεῖτο
  choice: говорили
  rationale: Имперфект пассива описывает продолжавшееся широкое обсуждение; русская неопределённо-личная конструкция естественно передаёт пассивный смысл.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: обо всём этом
  rationale: В данном повествовательном контексте ῥήματα может охватывать как слова, так и события или обстоятельства, о которых рассказывали.
theological_decisions:
- issue: Оттенок φόβος как реакции на явное действие Бога
  choice: страх
  alternative: трепет; благоговейный страх
  rationale: Прямая передача сохраняет напряжение между испугом и благоговейным трепетом, не устраняя ни одного из возможных оттенков.
translation_notes:
  register: Современный литературный русский язык; ясный и достойный повествовательный стиль. Синтаксис слегка сохраняет библейскую торжественность, избегая архаизмов.
