source:
  edition: SBLGNT
  text: ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν καὶ μνησθῆναι διαθήκης ἁγίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: ru
  text: чтобы явить милость нашим отцам[a][c] и вспомнить свой святой завет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с нашими отцами»; греческое выражение означает явить милость по отношению к праотцам Израиля.'
    reason: lexical_alternative
  - marker: b
    text: В библейском языке завета «вспомнить» часто означает не просто припомнить, но и верно поступить согласно прежде данному обещанию.
    reason: cultural_note
  - marker: c
    text: '«Наши отцы» — праотцы или патриархи Израиля; возможно также: «наши предки».'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: явить милость
  rationale: Устойчивое сочетание означает не буквально «сделать милость», а милостиво поступить, явить милость. Такой перевод естественен для современного русского языка и сохраняет библейское звучание.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: нашим отцам
  rationale: Хотя μετά с родительным падежом буквально означает «с», в данном сочетании речь идёт о милости, явленной по отношению к праотцам Израиля. Дательный падеж естественно передаёт это отношение по-русски.
- source_word: πατέρων
  choice: отцам
  rationale: Слово указывает на отцов или праотцов Израиля. «Отцам» сохраняет мужской род исходного текста и его библейско-заветные ассоциации; более широкое значение пояснено в сноске.
- source_word: μνησθῆναι
  choice: вспомнить
  rationale: Сохранено прямое значение греческого глагола. В языке Писания Божье «воспоминание» обычно предполагает последующее верное действие, однако это не развёрнуто в основном тексте.
- source_word: διαθήκης
  choice: завет
  rationale: В данном контексте слово обозначает установленный Богом завет, а не завещание или обычное соглашение.
- source_word: ἁγίας
  choice: святой
  rationale: Прямо передаёт характеристику завета как принадлежащего Богу и освящённого Им.
- source_word: αὐτοῦ
  choice: свой
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит завет с подразумеваемым субъектом — Богом — и не добавляет имени, отсутствующего в греческом тексте.
theological_decisions:
- issue: Божье «воспоминание» как действие в рамках завета
  choice: вспомнить свой святой завет
  alternative: исполнить свой святой завет
  rationale: В библейской речи Божье «воспоминание» подразумевает верность обещанию и действие, но греческий текст буквально говорит «вспомнить». Прямой перевод сохраняет смысловую и богословскую напряжённость, не подменяя образ его следствием.
- issue: Значение πατέρων ἡμῶν
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Форма исходного текста имеет мужской род и в контексте относится к отцам или праотцам Израиля. Основной текст сохраняет эту формулировку, а более широкое обозначение «предки» приводится в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Оборот «явить милость» понятен современному читателю и не архаичен; «отцам» сохраняет связь с заветной историей. Божественное местоимение написано со строчной буквы по общим современным орфографическим нормам и без добавочного конфессионального маркирования.
