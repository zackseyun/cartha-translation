id: LUK.1.58
reference: Luke 1:58
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: ru
  text: Её соседи и родственники услышали, что Господь явил ей великую милость, и радовались вместе с ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: соседи
  rationale: Слово обозначает живущих поблизости; «соседи» — естественный и точный современный русский эквивалент.
- source_word: συγγενεῖς
  choice: родственники
  rationale: Прямое и общеупотребительное обозначение родных по происхождению.
- source_word: ἐμεγάλυνεν
  choice: явил великую
  rationale: Буквально глагол означает «сделал великим, возвеличил», но в сочетании с «милостью» естественный русский смысл — «явил великую милость»; при этом сохраняется семантика величия.
- source_word: κύριος
  choice: Господь
  rationale: Хотя в греческом нет артикля, в контексте это определённое наименование Бога; нормативное русское соответствие — «Господь».
- source_word: ἔλεος
  choice: милость
  rationale: «Милость» точно передаёт значение сострадательной благости и сохраняет ключевую лексику повествования Луки.
- source_word: μετ’ αὐτῆς
  choice: ей
  rationale: В данном обороте буквальное «с ней» в современном русском звучало бы неестественно; дательный падеж передаёт направленность Божьей милости к Елисавете.
- source_word: συνέχαιρον αὐτῇ
  choice: радовались вместе с ней
  rationale: Точно передаёт совместную радость, выраженную приставочным глаголом συγχαίρω и дательным αὐτῇ.
theological_decisions:
- issue: Передача оборота ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: Господь явил ей великую милость
  alternative: Господь возвеличил Свою милость с ней
  rationale: Выбранный вариант естественен по-русски и точно выражает смысл оборота, не превращая необычную греческую сочетаемость в неясную русскую кальку. Слово «великую» сохраняет смысл μεγαλύνω.
translation_notes:
  register: Современный литературный русский язык; ясная, достойная и естественная формулировка без архаизмов. Порядок подлежащих и действий в основном следует греческому тексту.
