lexical_decisions:
- source_word: δὲ
  choice: А
  rationale: Мягкий повествовательный связующий союз, обозначающий переход к Елисавете; русское «А» естественно передаёт эту функцию, не добавляя явного значения времени.
- source_word: Ἐλισάβετ
  choice: Елисавета
  rationale: Традиционная и широко узнаваемая русская форма библейского имени.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: исполнилось время
  rationale: Сохраняет образное выражение оригинала о завершении срока беременности, оставаясь понятным по-русски.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: для Елисаветы … родить
  rationale: Инфинитивная конструкция относится к Елисавете и ясно передаёт наступление времени родов; имя повторно выражено по-русски вместо местоимения ради естественной связи с дательной конструкцией оригинала.
- source_word: ἐγέννησεν
  choice: она родила
  rationale: Прямо и естественно передаёт завершённое действие повествовательного аориста.
- source_word: υἱόν
  choice: сына
  rationale: Сохраняет конкретное указание оригинала на сына, а не просто на ребёнка.
