lexical_decisions:
- source_word: Ζαχαρίας
  choice: Захария
  rationale: Традиционная и общеупотребительная русская передача библейского имени, соответствующая греческой форме.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: отец его
  rationale: Естественная для возвышенного повествовательного регистра русская конструкция, сохраняющая порядок и связь с предшествующим упоминанием ребёнка.
- source_word: ἐπλήσθη
  choice: исполнился
  rationale: Точный и устойчивый русский эквивалент пассивной формы πίμπλημι в контексте исполнения Духом; передаёт наступившее событие.
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: Родительный падеж естественно зависит от «исполнился»; прописные буквы указывают на Божьего Духа как конкретного референта в повествовании Луки.
- source_word: ἐπροφήτευσεν
  choice: пророчествовал
  rationale: Прямая передача προφητεύω, сохраняющая значение вдохновенной пророческой речи.
- source_word: λέγων
  choice: говоря
  rationale: Деепричастие сохраняет греческую конструкцию и вводит содержание следующей далее пророческой речи.
- source_word: Καὶ
  choice: И
  rationale: Сохраняет повествовательную связность, выраженную греческим союзом.
theological_decisions:
- issue: Референт πνεύματος ἁγίου
  choice: Святого Духа
  alternative: святого духа
  rationale: В контексте Луки исполнение, ведущее к пророческой речи, относится к действию Божьего Святого Духа. Такая передача отражает повествовательное употребление, не добавляя к тексту дальнейших догматических уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «исполнился Святого Духа» несколько возвышенна, но понятна и точно сохраняет конструкцию и традиционный смысл исходного текста.
