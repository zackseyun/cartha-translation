  source_fidelity: Текст точно передаёт будущее утверждение, дательный σοι («тебе»), два разграниченных существительных χαρά и ἀγαλλίασις («радость и ликование»), а также πολλοὶ и будущее χαρήσονται. «Возрадуются его рождению» естественно выражает ἐπὶ τῇ γενέσει αὐτοῦ, сохраняя возможный оттенок повода или основания для радости.
