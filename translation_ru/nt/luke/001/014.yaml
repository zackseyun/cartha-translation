id: LUK.1.14
reference: Luke 1:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: ru
  text: И будет тебе радость и ликование, и многие возрадуются его рождению.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при его рождении». Греческое выражение может указывать как на повод для радости, так и на время, когда радуются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: будет
  rationale: Будущее время εἰμί вводит то, что произойдёт; русская безличная конструкция естественна с последующими существительными.
- source_word: χαρά
  choice: радость
  rationale: Прямое и естественное соответствие, сохраняющее связь с глаголом χαρήσονται.
- source_word: σοι
  choice: тебе
  rationale: Дательный падеж обозначает человека, которому предстоят радость и ликование.
- source_word: ἀγαλλίασις
  choice: ликование
  rationale: Передаёт усиленную, торжественную радость и сохраняет отличие от χαρά.
- source_word: πολλοὶ
  choice: многие
  rationale: Субстантивированное прилагательное естественно передаётся без добавления слова «люди».
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: его рождению
  rationale: При глаголе «возрадуются» дательный падеж звучит естественно и допускает как повод, так и основание радости; возможный временной оттенок отмечен в сноске.
- source_word: χαρήσονται
  choice: возрадуются
  rationale: Будущая форма χαίρω; «возрадуются» сохраняет лексическую связь с «радостью» и соответствует возвышенному, но понятному регистру.
theological_decisions: []
