base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: ru
  text: то и я, тщательно проследив всё с самого начала, решил написать тебе обо всём по порядку[a], достопочтенный Феофил,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в последовательном изложении»; выражение может обозначать упорядоченное построение, а не обязательно строгую хронологию.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε κἀμοὶ
  choice: то и я… счёл нужным
  rationale: Передаёт обдуманное решение, выраженное идиомой ἔδοξε, и сохраняет связь с предшествующими авторами через «то и я».
- source_word: παρηκολουθηκότι
  choice: тщательно проследив
  rationale: Глагол может означать внимательное прослеживание или исследование; сочетание с «тщательно» естественно передаёт оба оттенка, не сужая смысл до одного метода работы.
- source_word: ἄνωθεν
  choice: с самого начала
  rationale: В историографическом контексте наиболее естественно обозначает начало событий, а не пространственное «свыше».
- source_word: πᾶσιν ἀκριβῶς
  choice: тщательно… всё
  rationale: Сохраняет полноту πᾶσιν и точность, внимательность ἀκριβῶς в естественном русском порядке слов.
- source_word: καθεξῆς
  choice: по порядку
  rationale: Передаёт последовательное или упорядоченное изложение, не утверждая непременно строгую хронологию.
- source_word: σοι γράψαι
  choice: написать тебе об этом
  rationale: Дательный адресата передан прямо; «об этом» естественно отсылает к событиям и сведениям из контекста.
- source_word: κράτιστε
  choice: достопочтенный
  rationale: Формальное уважительное обращение к лицу высокого положения; звучит достойно и естественно в современном литературном русском.
- source_word: Θεόφιλε
  choice: Феофил
  rationale: Традиционная русская передача личного имени Θεόφιλος.
theological_decisions:
- issue: Значение καθεξῆς и характер порядка изложения
  choice: по порядку
  alternative: в хронологической последовательности
  rationale: Греческое слово допускает последовательность или упорядоченное построение, но само по себе не требует утверждения о строго хронологическом порядке.
translation_notes:
  register: Современный литературный русский с достоинством формального предисловия. Причастная конструкция преобразована в естественный русский деепричастный оборот; связь с предыдущим стихом сохранена словами «то и я».
