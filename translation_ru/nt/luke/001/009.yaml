  source_fidelity: 'Основной смысл передан верно: обычай священнического служения, избрание по жребию, воскурение и вход в ναός Господа сохранены. Однако «воскурить благовония» менее точно, чем «воскурить фимиам»: θυμιάω в данном культовом контексте относится именно к фимиаму. Кроме того, деепричастное «войдя» после «ему выпал жребий» в русском легко создаёт неверное временное впечатление, будто жребий выпал уже после входа.'
