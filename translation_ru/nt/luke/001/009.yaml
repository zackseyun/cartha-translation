  terminology: «Священническое служение» и «святилище Господа» уместны. «Фимиам» — точный и в современном литературном библейском регистре понятный термин для храмового воскурения; он предпочтительнее более широкого «благовония». Примечание к «святилищу» адекватно сохраняет вариант «храм».
