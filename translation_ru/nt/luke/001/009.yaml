  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: ru
  text: По обычаю священнического служения ему выпал жребий войти в святилище[a] Господа и воскурить фимиам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «храм». Греческое слово ναός здесь обозначает собственно храмовое здание, а не весь храмовый комплекс с его дворами.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: по обычаю священнического служения
  rationale: Оборот передаёт следование установленному обычаю и сохраняет значение ἱερατεία как священнического служения или института, а не просто группы священников.
- source_word: ἔλαχε
  choice: ему выпал жребий
  rationale: Глагол λαγχάνω указывает на получение поручения по жребию. Русский оборот естественно и ясно выражает этот способ выбора.
- source_word: τοῦ θυμιᾶσαι
  choice: воскурить благовония
  rationale: Артиклевый инфинитив обозначает выпавшее по жребию действие. «Воскурить благовония» точно передаёт храмовое сжигание ароматического состава и соответствует возвышенному, но понятному регистру.
- source_word: εἰσελθὼν
  choice: войдя
  rationale: Деепричастие сохраняет сжатую форму греческого аористного причастия и не уточняет временную последовательность сверх текста.
- source_word: εἰς τὸν ναὸν
  choice: в святилище
  rationale: В данном храмовом контексте ναός обозначает внутреннее здание храма, куда священник входил для воскурения, а не весь храмовый комплекс.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: κύριος в данном контексте относится к Богу; традиционное «Господь» сохраняет достоинство и не подменяет греческое слово явной передачей божественного имени.
theological_decisions:
- issue: Значение ναός в контексте храмового служения
  choice: святилище
  alternative: храм
  rationale: ναός обычно обозначает собственно храмовое здание или его внутреннюю священную часть, в отличие от всего храмового комплекса. Контекст воскурения поддерживает более точное «святилище», однако возможное более общее понимание «храм» сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной храмовой лексикой. Конструкция остаётся компактной и близкой к синтаксису источника; «священническое служение» понятнее современному читателю, чем более отвлечённое «священство».
