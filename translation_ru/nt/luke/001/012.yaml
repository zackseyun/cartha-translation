  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: ru
  text: Увидев его, Захария смутился, и страх объял его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθη
  choice: смутился
  rationale: Глагол передаёт внутреннее смятение и тревогу, не усиливая их до ужаса, который отдельно выражен словом φόβος.
- source_word: Ζαχαρίας
  choice: Захария
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: ἰδών
  choice: увидев его
  rationale: Аористное причастие естественно передаётся русским деепричастием; местоимение указывает на ангела из предыдущего стиха и делает выражение ясным.
- source_word: φόβος
  choice: страх
  rationale: Прямой и нейтральный эквивалент, не усиливающий значение до «ужаса».
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: объял его
  rationale: Естественная для современного литературного русского передача внезапно охватившего человека чувства; она сохраняет силу греческого оборота без неестественной буквальности «пал на него».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок первой части сохраняет связь зрительного восприятия с последовавшим смятением; близкое повторение «его» отражает структуру исходного текста и остаётся ясным в контексте.
