id: LUK.1.17
reference: Luke 1:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: ru
  text: И он пойдёт перед ним в духе и силе Илии[c], чтобы обратить сердца отцов к детям[a], а непокорных — к образу мыслей праведных[b], и приготовить для Господа готовый народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «сердца отцов навстречу детям». Эти слова перекликаются с Мал 4:6 и могут подразумевать восстановление отношений в семье.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «к разумению праведных» или «к благоразумию праведных».'
    reason: lexical_alternative
  - marker: c
    text: Выражение «в духе и силе Илии» указывает на служение и силу, подобные служению и силе пророка Илии, и само по себе не означает буквального возвращения Илии.
    reason: cross_reference
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: пойдёт перед ним
  rationale: Сохраняет как значение предшествования, так и компактность греческого выражения, не уточняя в самом тексте референта местоимения.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: в духе и силе Илии
  rationale: Прозрачно передаёт пророческое сходство и данную свыше силу, не отождествляя Иоанна буквально с Илиёй.
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: чтобы обратить сердца отцов к детям
  rationale: Передаёт инфинитив цели и сохраняет узнаваемое эхо Мал 4:6; предлог «к» естественно выражает направленность.
- source_word: ἀπειθεῖς
  choice: непокорных
  rationale: Передаёт не просто отсутствие послушания, а упорное нежелание повиноваться или принимать убеждение; при этом не сужает смысл до неверия.
- source_word: ἐν φρονήσει δικαίων
  choice: к образу мыслей праведных
  rationale: В связи с глаголом «обратить» предложное выражение получает направительный смысл. «Образ мыслей» передаёт нравственно-практическое разумение φρόνησις естественнее, чем буквальное «в разумении».
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: приготовить для Господа готовый народ
  rationale: «Для Господа» передаёт дательный κυρίῳ, а «готовый» сохраняет результирующее состояние, выраженное перфектным страдательным причастием κατεσκευασμένον. Небольшой лексический повтор предпочтительнее добавления отсутствующей в греческом цели вроде «к встрече» или «к служению».
theological_decisions:
- issue: Смысл упоминания Илии
  choice: Иоанн совершит служение в духе и силе Илии.
  alternative: Илия лично и буквально вернётся.
  rationale: Греческий текст говорит не о тождестве личности, а о «духе и силе Илии»; перевод сохраняет эту формулировку и её связь с пророчеством Малахии.
- issue: Референт местоимения αὐτοῦ и титула κύριος
  choice: Сохранены «перед ним» и «для Господа» без поясняющей подстановки имени.
  alternative: 'Уточнить в основном тексте: «перед Мессией/Иисусом».'
  rationale: Контекст помогает определить референт, но сам стих использует местоимение и титул; его неоднозначность не следует устранять добавлением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным за счёт тире при пропущенном повторе «обратить». Местоимение «ним» оставлено со строчной буквы, чтобы не вносить в графику дополнительное толкование, отсутствующее в греческом тексте.
