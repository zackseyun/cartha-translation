  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: ru
  text: В те дни Мария встала и поспешно отправилась в горную местность, в город Иудеи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в город Иуды» или «в иудейский город». Греческое πόλις может означать как город, так и небольшое поселение; Ἰούδα может обозначать Иуду/Иудею как область, а возможно, быть названием населённого пункта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα δὲ
  choice: Мария встала и
  rationale: Причастие Ἀναστᾶσα передаёт действие, предшествующее основному глаголу, а δέ — мягкий переход в повествовании. Русское «встала и… отправилась» естественно сохраняет последовательность, не превращая выражение в более толковательное «собралась в путь».
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: В те дни
  rationale: Естественное и точное соответствие временному обороту с сохранением указательного значения ταύταις.
- source_word: ἐπορεύθη
  choice: отправилась
  rationale: В контексте путешествия «отправилась» звучит естественнее простого «пошла» и не добавляет деталей о способе передвижения.
- source_word: εἰς τὴν ὀρεινὴν
  choice: в горную область
  rationale: Субстантивированное ὀρεινή обозначает гористую местность или нагорье; «горная область» понятно современному читателю и сохраняет географический смысл.
- source_word: μετὰ σπουδῆς
  choice: поспешно
  rationale: σπουδή может выражать поспешность, рвение или усердие. В данном контексте дороги «поспешно» передаёт прежде всего быстроту и безотлагательность, не исключая усердия.
- source_word: εἰς πόλιν Ἰούδα
  choice: в один из городов Иуды
  rationale: Неопределённый πόλις допускает значение города или поселения. Оборот «один из городов Иуды» естественно передаёт неназванный населённый пункт и понимает Ἰούδα как обозначение области; неоднозначность вынесена в сноску.
theological_decisions:
- issue: Значение Ἰούδα
  choice: Иуда как обозначение области или земли колена Иуды
  alternative: Иудея как более привычное географическое название; либо Иуда как название самого города
  rationale: Форма Ἰούδα допускает региональное понимание «Иуда», которое здесь наиболее естественно. В основном тексте сохранена более близкая к греческой форме передача без молчаливой замены на «Иудею».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок фразы слегка перестроен ради естественности; сохранены последовательность действий, поспешность пути и географическая неоднозначность заключительного оборота.
