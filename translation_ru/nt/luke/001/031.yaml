base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: ru
  text: И вот, ты зачнёшь во чреве и родишь сына, и назовёшь его Иисусом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «наречёшь ему имя Иисус».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт функцию частицы, привлекающей внимание, и сохраняет торжественный тон благовещения; в современном русском «и вот» естественнее, чем отдельное «вот» или «смотри».
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: ты зачнёшь во чреве
  rationale: Сохраняет явное упоминание чрева и библейскую образность греческого выражения, оставаясь понятным современному читателю; более динамический вариант — «ты забеременеешь».
- source_word: τέξῃ υἱόν
  choice: родишь Сына
  rationale: Точно и естественно передаёт рождение ребёнка мужского пола. Заглавная буква в «Сына» отражает русскую традицию почтительного написания мессианского титула в данном контексте, не меняя лексического значения.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: назовёшь Его
  rationale: В современном русском буквальное «наречёшь имя Ему» звучит архаично, а «назовёшь Его» естественно передаёт формулу наречения имени.
- source_word: Ἰησοῦν
  choice: Иисусом
  rationale: Использована общепринятая русская форма новозаветного имени; творительный падеж требуется после глагола «назовёшь».
theological_decisions:
- issue: Передача формулы наречения имени καλέσεις τὸ ὄνομα αὐτοῦ
  choice: назовёшь Его Иисусом
  alternative: наречёшь Ему имя Иисус
  rationale: Выбран современный и ясный русский оборот без утраты смысла. Альтернатива ближе к форме греческого текста и библейской стилистике, но заметно архаичнее.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Выражение «во чреве» намеренно сохраняет образность оригинала; синтаксис формулы имени сглажен ради естественности.
