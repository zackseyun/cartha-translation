  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: ru
  text: 'Попросив дощечку для письма, он написал: «Иоанн — его имя». И все удивились.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: попросив
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастие естественно и кратко передаёт эту последовательность по-русски.
- source_word: πινακίδιον
  choice: дощечку для письма
  rationale: Уменьшительная форма обозначает небольшую табличку или дощечку, предназначенную для письма; такое уточнение устраняет современную неоднозначность слова «планшет».
- source_word: ἔγραψεν λέγων
  choice: написал
  rationale: В русском глагол «написал» естественно вводит содержание записи; буквальное «написал, говоря» было бы неестественной избыточностью, хотя смысл конструкции сохранён прямой речью.
- source_word: Ἰωάννης ἐστὶν ὄνομα αὐτοῦ
  choice: Иоанн — имя ему
  rationale: Порядок слов сохраняет вынесенное вперёд имя и тем самым решительность утверждения Захарии; настоящее время передано именной конструкцией, без истолковывающего будущего «будет».
- source_word: ἐθαύμασαν πάντες
  choice: все удивились
  rationale: Обычное современное русское выражение точно передаёт общую реакцию изумления без излишне архаичного «дивились».
theological_decisions:
- issue: Время и сила утверждения имени
  choice: «Иоанн — имя ему»
  alternative: «Его будут звать Иоанном»
  rationale: Греческий текст использует настоящее ἐστίν и утверждает уже данное имя; перевод не превращает фразу в предсказание или решение на будущее.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имя передано в принятой русской библейской форме «Иоанн». Неестественная для русского конструкция «написал, говоря» сглажена без потери содержания.
