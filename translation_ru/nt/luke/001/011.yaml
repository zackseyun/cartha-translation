  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: ru
  text: Тогда ему явился ангел Господень, стоящий справа от жертвенника благовоний.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: явился
  rationale: Аорист пассивной формы ὁράω здесь имеет обычное для повествования непереходное значение внезапного видимого явления; «явился» естественно передаёт событие, а не только факт восприятия.
- source_word: δὲ
  choice: Тогда
  rationale: Частица обозначает продвижение повествования; «тогда» естественно связывает явление ангела с предшествующим действием.
- source_word: αὐτῷ
  choice: ему
  rationale: Дательный при ὤφθη указывает, кому явился ангел.
- source_word: ἄγγελος κυρίου
  choice: ангел Господень
  rationale: В храмовом видении ἄγγελος означает небесного посланника; традиционное и литературно естественное сочетание «ангел Господень» точно передаёт генитив κυρίου.
- source_word: ἑστὼς
  choice: стоявший
  rationale: Перфектное причастие описывает положение ангела в момент явления; русское причастие сохраняет сопутствующее обстоятельство без лишней временной детализации.
- source_word: ἐκ δεξιῶν
  choice: справа от
  rationale: Идиома указывает на положение по правую сторону; «справа от» ясно выражает пространственное отношение к жертвеннику.
- source_word: τοῦ θυσιαστηρίου τοῦ θυμιάματος
  choice: жертвенника для воскурения благовоний
  rationale: θυσιαστήριον — «жертвенник», а родительный τοῦ θυμιάματος обозначает его назначение. Развёрнутая формулировка понятнее современному читателю, чем потенциально неясное «жертвенник курения».
theological_decisions:
- issue: Передача κύριος в выражении ἄγγελος κυρίου
  choice: Господень
  alternative: Господа
  rationale: Прилагательное «Господень» — естественная для возвышенного библейского повествования передача принадлежности и не добавляет к исходному выражению доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис прост и доступен; традиционные слова «ангел», «Господень» и «жертвенник» сохранены, тогда как назначение жертвенника выражено понятно для неспециалиста.
