id: LUK.1.32
reference: Luke 1:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: ru
  text: Он[a] будет велик и будет назван[b] Сыном Всевышнего, и Господь Бог даст ему престол Давида, его отца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Этот будет велик». Греческое предложение начинается с указательного местоимения «этот».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет зваться Сыном Всевышнего».'
    reason: lexical_alternative
  - marker: c
    text: Давид назван его отцом в смысле царственного предка Иисуса по линии Давида.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Он
  rationale: Указательное местоимение относится к только что возвещённому ребёнку. В современном русском «Он» звучит естественно; буквальное «Этот» отмечено в сноске.
- source_word: ἔσται μέγας
  choice: будет велик
  rationale: Сохраняет будущее время и широкий смысл μέγας — величие и высокое значение, без сужения до могущества или известности.
- source_word: υἱὸς Ὑψίστου
  choice: Сыном Всевышнего
  rationale: Творительный падеж требуется конструкцией «будет назван». «Всевышний» сохраняет традиционное и понятное божественное именование, а «Сын» передаёт титульный характер выражения.
- source_word: κληθήσεται
  choice: будет назван
  rationale: Будущее страдательного залога передаёт наименование и признание титула. Вариант «будет назван» точен и естественен; возможный оттенок «будет зваться» указан в сноске.
- source_word: κύριος ὁ θεὸς
  choice: Господь Бог
  rationale: Прямо передаёт греческое божественное именование, не подменяя κύριος реконструированным тетраграмматоном.
- source_word: δώσει αὐτῷ
  choice: даст ему
  rationale: Простая и идиоматичная передача будущего времени δίδωμι с дательным местоимением.
- source_word: τὸν θρόνον Δαυὶδ
  choice: престол Давида
  rationale: Сохраняет образ царской власти и формулировку династического обетования.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: его отца
  rationale: Передаёт πατήρ непосредственно, сохраняя династическую лексику; в данном контексте Давид является царственным предком Иисуса, что поясняется в сноске.
theological_decisions:
- issue: Христологический титул υἱὸς Ὑψίστου
  choice: Сыном Всевышнего
  alternative: сыном Всевышнего; одним из сынов Всевышнего
  rationale: Конструкция имеет титульный характер и относится к возвещённому Иисусу. Перевод сохраняет силу сыновнего именования, не добавляя более поздних догматических формулировок.
- issue: Передача κύριος в отношении Бога
  choice: Господь Бог
  alternative: Владыка Бог; ГОСПОДЬ Бог
  rationale: «Господь» является прямой и общеупотребительной передачей κύριος. Написание «ГОСПОДЬ» неоправданно уточняло бы, что в греческом непосредственно представлен тетраграмматон.
- issue: Давид как «отец» Иисуса
  choice: Давида, его отца
  alternative: Давида, его предка
  rationale: Буквальное «отца» сохраняет библейскую династическую и заветную связь. Смысл отдалённого царственного предка поясняется, а не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным библейским звучанием. Синтаксис близок к греческому, однако местоимение οὗτος передано естественным русским «Он». Заглавные буквы сохранены в божественных именованиях и титуле «Сын Всевышнего»; местоимения, относящиеся к Иисусу и Богу, оставлены со строчной буквы согласно нейтральной современной норме.
