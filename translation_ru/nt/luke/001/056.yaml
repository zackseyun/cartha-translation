  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: ru
  text: Мария пробыла с ней около трёх месяцев, а потом вернулась домой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: пробыла
  rationale: Аорист μένω обозначает пребывание в определённом месте в течение указанного времени; «пробыла» естественно передаёт завершённый период.
- source_word: δὲ
  choice: а потом
  rationale: Мягкая повествовательная связка δέ здесь вводит следующий этап рассказа; «а потом» естественно связывает пребывание Марии с её возвращением, не выражая сильного противопоставления.
- source_word: Μαριὰμ
  choice: Мария
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: σὺν αὐτῇ
  choice: с ней
  rationale: σύν с дательным падежом выражает совместное пребывание; местоимение сохраняет формулировку исходного текста, а его референтом в контексте является Елизавета.
- source_word: ὡς μῆνας τρεῖς
  choice: около трёх месяцев
  rationale: ὡς при указании меры времени выражает приблизительность; «около» точно и естественно передаёт этот оттенок.
- source_word: ὑπέστρεψεν
  choice: вернулась
  rationale: Глагол означает возвращение в прежнее место; русская форма согласована с Марией.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: домой
  rationale: Выражение обозначает возвращение в свой дом; наречие «домой» наиболее естественно в современном русском и сохраняет пространственный смысл.
