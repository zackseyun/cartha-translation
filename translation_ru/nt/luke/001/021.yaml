  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: ru
  text: А народ ждал Захарию и удивлялся, что он так долго оставался в святилище.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в собственно храмовом святилище, а не во всём храмовом комплексе с его дворами.
    reason: lexical_clarification
lexical_decisions:
- source_word: λαὸς
  choice: народ
  rationale: Определённое собирательное существительное обозначает собравшихся снаружи людей; «народ» естественно сохраняет коллективный смысл.
- source_word: προσδοκῶν
  choice: ждал
  rationale: Причастие с ἦν образует перифрастический имперфект и передаёт продолжавшееся ожидание.
- source_word: Ζαχαρίαν
  choice: Захарию
  rationale: Использована традиционная и общепонятная русская форма библейского имени.
- source_word: ἐθαύμαζον
  choice: удивлялся
  rationale: Имперфект передаёт продолжавшуюся реакцию собравшихся; «удивлялся» сохраняет оттенок изумления, не добавляя лишних мотивов.
- source_word: ἐν τῷ χρονίζειν
  choice: что он так долго остаётся
  rationale: 'Оборот с артиклевым инфинитивом обозначает обстоятельство, вызвавшее удивление: Захария оставался внутри дольше ожидаемого. Формулировка естественна по-русски и не приписывает ему намеренного промедления.'
- source_word: ναῷ
  choice: святилище
  rationale: ναός здесь обозначает храмовое святилище, куда Захария вошёл для священнического служения, а не весь храмовый комплекс.
- source_word: αὐτόν
  choice: он
  rationale: В греческом местоимение в винительном падеже является субъектом инфинитива; в русском придаточном предложении требуется именительный падеж.
