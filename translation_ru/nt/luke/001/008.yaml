id: LUK.1.8
reference: Luke 1:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἱερατεύειν αὐτὸν ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ ἔναντι τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: ru
  text: Однажды, когда он совершал священническое служение перед Богом согласно порядку своей череды,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Однажды
  rationale: Повествовательная формула вводит очередное событие. «Однажды» естественно выполняет эту функцию в современном русском; слабый связующий оттенок δέ отдельно не выражен.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: когда он совершал священническое служение
  rationale: Конструкция с артиклевым инфинитивом имеет временное значение, а ἱερατεύω обозначает именно исполнение обязанностей священника.
- source_word: ἐν τῇ τάξει
  choice: согласно порядку
  rationale: Здесь τάξις указывает на установленный порядок храмового служения; «согласно порядку» ясно передаёт нормативно-распорядительный смысл.
- source_word: τῆς ἐφημερίας αὐτοῦ
  choice: своей череды
  rationale: ἐφημερία обозначает священническую группу и назначенную ей очередь служения. Традиционное русское «череда» кратко сохраняет оба связанных оттенка в данном храмовом контексте.
- source_word: ἔναντι τοῦ θεοῦ
  choice: перед Богом
  rationale: Точно и лаконично передаёт служение в Божьем присутствии.
theological_decisions:
- issue: Культовая терминология храмового служения Захарии
  choice: совершал священническое служение перед Богом согласно порядку своей череды
  alternative: служил священником перед Богом, когда настала очередь его священнической группы
  rationale: Выбранный вариант сохраняет историческую храмовую терминологию и структуру исходного текста, не перенося на неё позднейшие церковные представления.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Священническое служение» понятно без упрощения, а «череда» уместна как устоявшийся термин для очередной группы храмовых священников. Запятая в конце сохранена, поскольку стих синтаксически продолжается в Лк 1:9.
