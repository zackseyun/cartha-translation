source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: ru
  text: чтобы озарить тех, кто сидит во тьме и тени смерти[a], и направить наши ноги на путь мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертной тени»; некоторые понимают это выражение шире — как «глубокую тьму», однако в греческом тексте прямо упомянута смерть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: озарить
  rationale: Передаёт образ света, достигающего пребывающих во тьме, и естественно сочетается с прямым дополнением в русском языке.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: тех, кто сидит во тьме
  rationale: Сохраняет буквальный и выразительный образ сидящих, не заменяя его толкованием вроде «живущих» или «пребывающих».
- source_word: σκότει
  choice: тьме
  rationale: Обычный русский эквивалент, сохраняющий как прямой образ, так и его возможный метафорический смысл.
- source_word: σκιᾷ θανάτου
  choice: тени смерти
  rationale: Сохраняет явное упоминание смерти в греческом тексте и библейский образ, не сводя его к более общему значению глубокой тьмы.
- source_word: τοῦ κατευθῦναι
  choice: направить
  rationale: Естественно передаёт целевое движение и хорошо сочетается с образом ног и пути.
- source_word: τοὺς πόδας ἡμῶν
  choice: наши ноги
  rationale: Сохраняет телесный поэтический образ вместо абстрактного «нас».
- source_word: εἰς ὁδὸν εἰρήνης
  choice: на путь мира
  rationale: Передаёт направленность εἰς и сохраняет образ пути; «мир» оставлен без уточняющего толкования.
theological_decisions:
- issue: Метафорический или истолковывающий перевод образов тьмы и пути
  choice: Сохранить образы тьмы, тени смерти, ног и пути без пояснения их значения в основном тексте.
  alternative: Передать их как духовное неведение, смертельную опасность или нравственную жизнь, ведущую к миру.
  rationale: Поэтический и аллюзивный характер стиха допускает несколько взаимосвязанных смыслов; перевод не должен сужать их до одного толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Союз «и» перед вторым инфинитивом добавлен для естественной русской координации двух целей.
