  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: ru
  text: Ведь ни одно слово от Бога не окажется невозможным[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь для Бога не будет ничего невозможного».'
    reason: Альтернативное грамматически допустимое понимание παρὰ τοῦ θεοῦ πᾶν ῥῆμα.
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит основание для предыдущих слов Гавриила; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: οὐκ ἀδυνατήσει
  choice: не останется неисполнимым
  rationale: Будущая форма ἀδυνατέω означает невозможность или бессилие. В сочетании со «словом» эта формулировка естественно выражает мысль о том, что сказанное Богом не окажется невозможным для исполнения.
- source_word: παρὰ τοῦ θεοῦ
  choice: от Бога
  rationale: Παρά с родительным падежом обозначает источник; рядом с ῥῆμα это позволяет сохранить смысл слова, исходящего от Бога, не исключая традиционного понимания, приведённого в сноске.
- source_word: πᾶν
  choice: ни одно
  rationale: При отрицании универсальное πᾶν естественно передаётся русской конструкцией «ни одно… не», сохраняющей всеобщий охват.
- source_word: ῥῆμα
  choice: слово
  rationale: «Слово» сохраняет явный лексический элемент греческого текста и связь с провозглашённым Гавриилом Божьим словом; варианты «дело» и «обещание» были бы соответственно шире и уже оригинала.
theological_decisions:
- issue: Смысл выражения παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Ни одно слово от Бога не останется неисполнимым.
  alternative: Для Бога не будет ничего невозможного.
  rationale: Оба понимания грамматически возможны. Основной текст сохраняет явно присутствующее ῥῆμα («слово») и представление об исходящем от Бога речении, а традиционное прочтение о Божьем всемогуществе дано в сноске, чтобы не устранять смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная по тону. «Не останется неисполнимым» звучит естественнее применительно к слову, чем отвлечённое «не будет невозможным», и подчёркивает действенность Божьего речения без добавления слова «обещание».
