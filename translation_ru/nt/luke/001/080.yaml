  terminology: Строчное «духом» не предрешает отнесение πνεύματι к Святому Духу. «Израилю» естественно передаёт направленность πρός к народу Израиля. Сноски сохраняют существенные лексические и смысловые альтернативы; их маркеры размещены корректно.
