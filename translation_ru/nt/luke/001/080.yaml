  source_fidelity: Текст точно передаёт оба имперфекта («рос и укреплялся»), неоднозначное πνεύματι через «духом», множественное ἐρήμοις как «в пустынных местах» и ἀνάδειξις как публичное явление, обращённое к Израилю. «Жил» уместно раскрывает повествовательное ἦν в данном контексте, не добавляя существенного смысла.
