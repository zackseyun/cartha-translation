id: LUK.1.80
reference: Luke 1:80
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: ru
  text: А ребёнок рос и укреплялся духом[a] и жил в пустынных местах[b] до дня своего явления Израилю[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Духом». Греческое выражение может означать как внутреннее, духовное укрепление, так и укрепление, связанное со Святым Духом.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в пустынях»; то есть в пустынных, безлюдных местах.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «до дня, когда он был представлен Израилю»; возможный смысл — его открытое выступление перед народом Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: ребёнок
  rationale: Широкое и естественное обозначение Иоанна в годы его взросления; не ограничивает возраст словом «младенец» или «мальчик».
- source_word: ηὔξανε
  choice: рос
  rationale: Имперфект передаёт продолжавшийся процесс роста; в русском языке это естественно выражается глаголом несовершенного вида.
- source_word: ἐκραταιοῦτο
  choice: укреплялся
  rationale: Передаёт постепенное обретение силы и не решает однозначно, является ли форма пассивной («его укрепляли») или непереходной («становился сильнее»).
- source_word: πνεύματι
  choice: духом
  rationale: 'Сохраняет краткость и неоднозначность греческого дательного без артикля: речь может идти о внутренней духовной силе или о связи со Святым Духом.'
- source_word: ἐν ταῖς ἐρήμοις
  choice: в пустынных местах
  rationale: Передаёт множественное число греческой формы и широкий смысл безлюдных, пустынных мест, не сводя выражение к одной конкретной пустыне.
- source_word: ἀναδείξεως
  choice: явления
  rationale: Передаёт смысл выхода из неизвестности и открытого появления перед народом, сохраняя несколько более формальную окраску исходного существительного.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: Израилю
  rationale: Обозначает Израиль как народ, к которому было обращено явление Иоанна; формулировка остаётся краткой и близкой к греческой конструкции.
- source_word: ἦν
  choice: жил
  rationale: В данном повествовательном контексте естественно раскрывает значение продолжительного пребывания в пустынных местах.
theological_decisions:
- issue: Значение πνεύματι при описании взросления Иоанна
  choice: духом
  alternative: Духом; духовно
  rationale: Строчная буква и форма «духом» не отождествляют referent прямо со Святым Духом, которого греческий текст здесь явно не называет, но сохраняют возможность такого понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Несовершенный вид глаголов передаёт длительность взросления и пребывания; формулировки избегают конфессионального уточнения значения πνεύματι.
