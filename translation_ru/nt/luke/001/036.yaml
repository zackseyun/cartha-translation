  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: ru
  text: И вот, твоя родственница Елисавета тоже зачала сына в старости, и у той, которую называют бесплодной, уже шестой месяц.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Естественный и вместе с тем выразительный русский эквивалент, привлекающий внимание к сообщаемому факту.
- source_word: ἡ συγγενίς σου
  choice: твоя родственница
  rationale: Передаёт родство без необоснованного уточнения его степени.
- source_word: συνείληφεν υἱὸν
  choice: зачала сына
  rationale: Прямо передаёт зачатие ребёнка мужского пола; «тоже» отражает καὶ αὐτή.
- source_word: ἐν γήρει αὐτῆς
  choice: в старости
  rationale: Сохраняет прямое значение греческого оборота и естественно звучит по-русски.
- source_word: οὗτος μὴν ἕκτος ἐστὶν αὐτῇ
  choice: сейчас уже шестой месяц у той
  rationale: Идиоматично обозначает шестой месяц беременности; «у той» сохраняет связь с последующим определением.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: которую называли бесплодной
  rationale: Прошедшее несовершенное «называли» передаёт репутацию или характеристику, существовавшую до беременности, не утверждая её как нынешнее состояние.
theological_decisions:
- issue: Степень родства Марии и Елисаветы
  choice: родственница
  alternative: двоюродная сестра
  rationale: Греческое συγγενίς не уточняет степень родства, поэтому более конкретный вариант был бы добавлением к тексту.
- issue: Временной оттенок καλουμένῃ
  choice: которую называли бесплодной
  alternative: которую называют бесплодной
  rationale: Русское прошедшее время естественно подчёркивает перемену обстоятельств, не устраняя содержащуюся в причастии идею того, как её знали и именовали.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Сохранён библейский указательный оборот «И вот», но избегнуты архаизмы вроде «се» и «во чреве».
