    rationale: «Сейчас уже шестой месяц у той» звучит менее плавно, чем русская конструкция с вынесенным «у той» перед сказуемым; дополнительное «сейчас» не имеет отдельного соответствия в греческом тексте.
  revised_text: И вот, твоя родственница Елисавета тоже зачала сына в старости, и у той, которую называют бесплодной, уже шестой месяц.
