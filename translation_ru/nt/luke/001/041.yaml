  terminology: «Приветствие», «младенец», «утроба» и «исполнилась Святого Духа» точны и стилистически согласованы. Написание «Святого Духа» обоснованно контекстом Луки и не привносит дополнительного догматического истолкования. Традиционное библейское имя «Елисавета» последовательно употреблено в стихе.
