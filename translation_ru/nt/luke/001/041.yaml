reference: Luke 1:41
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: ru
  text: И когда Елисавета услышала приветствие Марии, младенец взыграл в её утробе, и Елисавета исполнилась Святого Духа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: не передано отдельным оборотом
  rationale: В сочетании καὶ ἐγένετο ὡς это лукианская повествовательная формула. Русское «и случилось, когда» здесь тяжеловесно; начало «И когда…» естественно передаёт переход и временную связь, не меняя смысла.
- source_word: ὡς
  choice: когда
  rationale: При аористе выражает временную связь и естественно передаётся русским «когда».
- source_word: ἀσπασμός
  choice: приветствие
  rationale: Обозначает произнесённое Марией приветствие; это точное и современное литературное соответствие.
- source_word: ἐσκίρτησεν
  choice: взыграл
  rationale: Передаёт внезапное живое движение младенца и сохраняет приподнятый библейский регистр; «зашевелился» было бы слабее, а «подпрыгнул» — разговорнее.
- source_word: βρέφος
  choice: младенец
  rationale: Точно обозначает очень маленького ребёнка и естественно относится здесь к ещё не родившемуся Иоанну.
- source_word: κοιλία
  choice: утроба
  rationale: В данном контексте означает материнское чрево; «утроба» точна, понятна и стилистически достойна.
- source_word: ἐπλήσθη
  choice: исполнилась
  rationale: Устойчиво и точно передаёт пассив «была наполнена», сохраняя возвышенный, но понятный русский регистр.
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: В контексте Луки выражение относится к Божьему Святому Духу; прописные буквы естественно обозначают личного божественного референта.
theological_decisions:
- issue: Референт πνεύματος ἁγίου
  choice: Святой Дух как Божий Дух
  alternative: святой дух как неопределённая духовная сила
  rationale: В контексте Луки — Деяний это выражение обычно обозначает Божьего Духа, дарующего пророческое вдохновение. Перевод не добавляет дальнейшего догматического толкования.
- issue: Обозначение нерождённого Иоанна словом βρέφος
  choice: младенец
  alternative: ребёнок; дитя
  rationale: «Младенец» сохраняет конкретное обозначение очень маленького ребёнка и не привносит в стих дополнительных богословских выводов.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской окраской. Синтаксис упрощён естественным образом: формула καὶ ἐγένετο ὡς передана как «И когда…». «Взыграл» и «исполнилась» сохраняют достоинство и выразительность текста, оставаясь понятными современному читателю.'
