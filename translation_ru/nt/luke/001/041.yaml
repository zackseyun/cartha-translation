  source_fidelity: 'Перевод точно передаёт временную связь ὡς («когда»), содержание приветствия Марии, живое движение младенца в утробе Елисаветы и последующее исполнение Елисаветы Святым Духом. Непередача καὶ ἐγένετο отдельной русской формулой допустима: в сочетании с ὡς это главным образом лукианский повествовательный переход, который естественно свёрнут в «И когда…», без утраты событийной последовательности.'
