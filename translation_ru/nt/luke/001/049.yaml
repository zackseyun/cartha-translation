lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину прославления Господа Марией в предыдущем стихе; «потому что» ясно передаёт причинное значение.
- source_word: ἐποίησέν
  choice: совершил
  rationale: Аорист указывает на решительное действие Бога ради Марии; совершенный вид естественно передаёт завершённость действия и его значимость в настоящем.
- source_word: μοι
  choice: для меня
  rationale: Дательный падеж имеет здесь значение лица, в пользу которого совершено действие; «для меня» естественнее и точнее, чем «мне» в данном сочетании.
- source_word: μεγάλα
  choice: великие дела
  rationale: Субстантивированное прилагательное среднего рода множественного числа обозначает великие свершения; «великие дела» сохраняет широту смысла и звучит естественно по-русски.
- source_word: ὁ δυνατός
  choice: Сильный
  rationale: Прилагательное с артиклем употреблено субстантивно как именование Бога. «Сильный» сохраняет лексическую связь с δύναμαι и титульный характер, не добавляя отсутствующего в тексте существительного.
- source_word: ἅγιον
  choice: свято
  rationale: Предикативное прилагательное характеризует имя Бога; краткая форма среднего рода грамматически согласуется со словом «имя» и сохраняет вынесение определения вперёд для смыслового акцента.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: имя Его
  rationale: Буквально и естественно передаёт греческое выражение; слово «имя» сохранено без пояснительного расширения.
theological_decisions:
- issue: Передача ὁ δυνατός как именования Бога
  choice: Сильный
  alternative: Всемогущий; Тот, Кто силён
  rationale: Греческий текст называет Бога субстантивированным прилагательным «Сильный». «Всемогущий» могло бы усилить смысл сверх непосредственного значения слова, а описательный вариант менее лаконичен.
- issue: Порядок слов в καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: и свято имя Его
  alternative: и имя Его свято
  rationale: Вынесенное вперёд «свято» воспроизводит акцент греческого порядка слов и остаётся понятным в возвышенной современной русской речи; сноска отмечает более нейтральный русский порядок.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, песнопевческим звучанием. Синтаксис сохраняет акцент греческого текста, не прибегая к архаическим формам.
