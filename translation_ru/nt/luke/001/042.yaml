base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: ru
  text: 'И она громко воскликнула и сказала: «Благословенна ты среди женщин, и благословен плод твоего чрева».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεφώνησεν κραυγῇ μεγάλῃ καὶ εἶπεν
  choice: громко воскликнула
  rationale: Глагол ἀναφωνέω уже передаёт громкое, явственно слышимое высказывание, а κραυγῇ μεγάλῃ усиливает эту характеристику. Сжатое русское выражение естественно передаёт смысл всего оборота и избегает тяжеловесного повтора «воскликнула громким голосом и сказала».
- source_word: Εὐλογημένη σὺ
  choice: Благословенна ты
  rationale: Современная и вместе с тем торжественная форма благословения; сохраняет предикативный смысл перфектного пассивного причастия и эмфатический порядок слов.
- source_word: ἐν γυναιξίν
  choice: среди женщин
  rationale: Точно передаёт сопоставление Марии с женщинами вообще, не добавляя отсутствующего в греческом слова «всех».
- source_word: εὐλογημένος ὁ καρπὸς
  choice: благословен плод
  rationale: Сохраняет параллелизм двух благословений и метафору исходного текста.
- source_word: τῆς κοιλίας σου
  choice: твоего чрева
  rationale: В контексте беременности κοιλία означает материнскую утробу. «Чрево» сохраняет традиционный библейский образ и в составе устойчивого выражения «плод чрева» остаётся понятным современному читателю.
theological_decisions:
- issue: Формула благословения, обращённая к Марии
  choice: Благословенна ты среди женщин
  alternative: Ты благословенна среди женщин
  rationale: Выбранный порядок слов сохраняет торжественный параллелизм греческого текста, не преуменьшая и не расширяя сказанного о Марии за пределы стиха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Устойчивое выражение «плод твоего чрева» сохранено ради образности и межтекстовой узнаваемости; синтаксис первой части сделан естественным для современного русского.
