  source_fidelity: Русский текст точно передаёт греческое восклицание καὶ πόθεν μοι τοῦτο как выражение удивления перед незаслуженным благоволением. «Откуда мне такая честь» — допустимое оптимально-эквивалентное раскрытие, а сноска сохраняет буквальную форму «И откуда мне это?». Придаточное «что мать моего Господа пришла ко мне» верно передаёт содержание ἵνα ἔλθῃ ... πρὸς ἐμέ; прошедшее «пришла» естественно в данном повествовательном контексте, где Мария уже находится у Елисаветы.
