lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: откуда мне такая честь
  rationale: Греческое идиоматическое восклицание буквально означает «откуда мне это?» и выражает изумление перед оказанной честью. Русская формулировка сохраняет образ источника и естественно передаёт подразумеваемый смысл.
- source_word: ἵνα ἔλθῃ
  choice: что ... пришла
  rationale: После данного восклицания ἵνα с конъюнктивом раскрывает содержание удивительного обстоятельства; по-русски здесь естественно прошедшее время, поскольку Мария уже пришла.
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: мать моего Господа
  rationale: Прямой перевод сохраняет исповедальный и христологически значимый титул κύριος, не добавляя более поздних богословских формулировок.
- source_word: πρὸς ἐμέ
  choice: ко мне
  rationale: Передаёт направленное движение к Елисавете без отсутствующего в греческом уточнения «в мой дом».
theological_decisions:
- issue: Передача κυρίου в выражении ἡ μήτηρ τοῦ κυρίου μου
  choice: моего Господа
  alternative: моего господина
  rationale: «Господь» сохраняет почтительный и христологический вес титула в повествовании Луки, тогда как «господин» мог бы неоправданно его ослабить.
- issue: Степень буквальности идиомы πόθεν μοι τοῦτο
  choice: откуда мне такая честь
  alternative: откуда мне это
  rationale: Вариант в основном тексте делает понятным подразумеваемое почётное благоволение, не превращая его в узкоконфессиональное утверждение; буквальная форма сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; речь звучит естественно, почтительно и торжественно без архаизмов. «Такая честь» представляет собой умеренное раскрытие греческой идиомы, а буквальная форма вынесена в сноску.
