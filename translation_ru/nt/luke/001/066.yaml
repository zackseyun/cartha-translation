  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: ru
  text: 'И все, кто слышал об этом, сохранили услышанное в своих сердцах, говоря: «Кем же станет этот ребёнок?» Ведь рука Господа была с ним.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых греческих рукописях отсутствует καί («и») перед γάρ («ведь, ибо»).
    reason: textual_variant
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: сохранили это в сердце
  rationale: Передаёт образ буквального «положили в своём сердце» естественным русским библейским выражением, подразумевающим памятование и глубокое обдумывание.
- source_word: πάντες οἱ ἀκούσαντες
  choice: все, кто слышал об этом
  rationale: Причастный оборот обозначает всех услышавших о предшествующих событиях; «об этом» естественно восполняет подразумеваемый объект.
- source_word: Τί ἄρα τὸ παιδίον τοῦτο ἔσται
  choice: Кем же станет этот ребёнок?
  rationale: ἄρα передано частицей «же», выражающей вывод из событий; «кем станет» естественно указывает на будущую судьбу или роль ребёнка, тогда как буквальное значение ἔσται отмечено в сноске.
- source_word: καὶ γὰρ
  choice: Ведь
  rationale: Сочетание вводит основание для вопроса и естественно передаётся русским объяснительным союзом «ведь».
- source_word: χεὶρ κυρίου
  choice: рука Господа
  rationale: Сохранён библейский образ Божьей деятельной силы, благоволения или водительства без сужающего истолкования.
- source_word: μετ’ αὐτοῦ
  choice: была с ним
  rationale: Прямо передаёт μετά с родительным падежом; местоимение относится к ребёнку.
theological_decisions:
- issue: Значение выражения «рука Господа была с ним»
  choice: Сохранить метафору как указание на деятельное присутствие, силу или благоволение Бога, не уточняя смысл.
  alternative: Господь помогал ему; сила Бога была на нём.
  rationale: Сам текст не определяет точнее, идёт ли речь о защите, содействии, силе или благоволении; сохранение образа не устраняет эту смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Синтаксис сделан естественным для обычного читателя; устойчивый образ «рука Господа» сохранён. Маркер сноски поставлен после относящегося к ней предложения.
