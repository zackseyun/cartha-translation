lexical_decisions:
- source_word: ἀνεῴχθη
  choice: открылись
  rationale: Аорист пассивного залога от ἀνοίγω передаёт внезапное восстановление способности говорить; русская форма сохраняет образ открывшихся уст, а множественное число обусловлено двумя однородными подлежащими.
- source_word: δὲ
  choice: и
  rationale: Здесь δέ мягко продолжает повествование, не выражая явного противопоставления.
- source_word: τὸ στόμα αὐτοῦ
  choice: его уста
  rationale: «Уста» естественно и достойно звучит в контексте речи и благословения, оставаясь прямым соответствием στόμα.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт немедленность события и хорошо соответствует повествовательному регистру.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: и язык
  rationale: Сохранено прямое упоминание языка без добавления отсутствующего в греческом тексте глагола «развязался» или «освободился».
- source_word: ἐλάλει
  choice: заговорил
  rationale: Имперфект допускает как продолженное действие, так и вступление в него; после периода немоты контекстуально естественно передать начало речи.
- source_word: εὐλογῶν
  choice: благословляя
  rationale: Прямо передаёт εὐλογέω и сохраняет форму причастия, описывающего содержание или характер речи.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Стандартная передача прямого дополнения; прописная буква соответствует современной русской библейской практике.
