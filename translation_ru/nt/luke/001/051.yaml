lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: явил силу
  rationale: Греческое сочетание буквально означает «сделал силу», но идиоматически говорит о явлении или проявлении могущества. «Явил силу» естественно по-русски и сохраняет образ решительного Божьего действия.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: Своей рукой
  rationale: ἐν имеет здесь инструментальное значение в библейском образе Божьей могущественной руки. «Своей рукой» сохраняет антропоморфную метафору и звучит естественно.
- source_word: διεσκόρπισεν
  choice: рассеял
  rationale: Глагол обозначает рассеивание или разбрасывание и поддерживает поэтическую картину Божьего суда.
- source_word: ὑπερηφάνους
  choice: гордых
  rationale: Субстантивированное прилагательное указывает на гордых людей; краткое «гордых» сохраняет нравственную характеристику оригинала.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: в помыслах их сердец
  rationale: Буквально-семитизированное выражение связывает διάνοια с внутренним замыслом, мышлением или намерением, а καρδία — с внутренним человеком. Формулировка сохраняет эту необычную связь, не сводя ее к одному психологическому понятию.
theological_decisions:
- issue: Передача аористов в Песни Марии
  choice: 'Русское прошедшее совершенного вида: «явил», «рассеял»'
  alternative: «Являет», «рассеивает» либо конструкции с результативным оттенком
  rationale: Русское прошедшее совершенного вида непосредственно передает завершенное решительное действие и допускает как обобщающее, так и пророческое прочтение контекста, не требуя искусственного аналога английского present perfect.
- issue: Связь διανοίᾳ с действием рассеивания
  choice: Сохранить «в помыслах их сердец» в основном тексте
  alternative: «из-за замыслов их сердец» или «по намерению их сердец»
  rationale: Дательный допускает понимание сферы, образа или основания действия. Основной вариант сохраняет формальную неоднозначность, а сноска отмечает другие возможные отношения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Заглавная буква в «Своей» ясно соотносит местоимение с Богом. Необычное выражение «помыслы сердец» сохранено ради образности и смысловой неоднозначности оригинала.
