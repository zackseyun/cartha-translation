  text: и вошла в дом Захарии и приветствовала Елизавету.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошла
  rationale: Аорист εἰσέρχομαι обозначает вход в указанное место; «вошла» кратко и естественно передаёт действие, а женский род определяется подлежащим из ближайшего контекста — Марией (Лк. 1:39).
- source_word: οἶκον
  choice: дом
  rationale: При εἰς здесь имеется в виду место, куда вошла Мария; «дом» точно и естественно передаёт οἶκος.
- source_word: Ζαχαρίου
  choice: Захарии
  rationale: Употреблена современная русская библейская форма имени; родительный падеж передаёт греческий генитив принадлежности.
- source_word: ἠσπάσατο
  choice: приветствовала
  rationale: ἀσπάζομαι в данном контексте означает обратиться с приветствием. «Приветствовала» не добавляет ни особой сердечности, ни церемониальности.
- source_word: Ἐλισάβετ
  choice: Елисавету
  rationale: Выбрана укоренившаяся русская библейская форма имени; винительный падеж соответствует функции прямого дополнения.
- source_word: καὶ
  choice: и … и
  rationale: Оба καί сохранены как простые сочинительные союзы, передающие последовательность действий и паратактический строй греческой фразы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением простой повествовательной структуры оригинала. Начальное «и» оставлено как связь с предыдущим стихом; повтор союза также сохранён. Архаичное «салютовала» и менее точное по ситуации «встретила» не использованы.
