id: LUK.1.20
reference: Luke 1:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: ru
  text: И вот, ты будешь молчать, не в силах говорить, до того дня, когда всё это произойдёт, за то, что ты не поверил моим словам, которые исполнятся в назначенное для них время.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в надлежащее для них время». Речь идёт о сроке, подходящем или назначенном для исполнения этих слов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет функцию привлечения внимания и торжественность ангельского возвещения, оставаясь естественным в современном русском языке.
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: ты будешь молчать, не в силах говорить
  rationale: Передаёт как наступающее состояние молчания, так и прямо выраженную неспособность говорить; это не добровольное молчание.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: до того дня, когда всё это произойдёт
  rationale: Естественно передаёт временной предел и значение γίνομαι в данном контексте.
- source_word: ἀνθ’ ὧν
  choice: за то, что
  rationale: В контексте выражает не только причину, но и воздаяние за неверие; русская конструкция сохраняет обе смысловые стороны лучше, чем нейтральное «потому что».
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: ты не поверил моим словам
  rationale: Прямо передаёт πιστεύω с дательным дополнением и сохраняет лексический образ λόγοι — «слова».
- source_word: οἵτινες πληρωθήσονται
  choice: которые исполнятся
  rationale: Сохраняет относительную связь со «словами» и библейски естественное значение исполнения сказанного.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: в назначенное для них время
  rationale: Передаёт καιρός как надлежащий, определённый срок, а местоимение αὐτῶν — как относящееся к словам или предсказанным событиям, не конкретизируя сверх исходного текста.
theological_decisions:
- issue: Характер наказания Захарии
  choice: Вынужденное молчание вследствие неспособности говорить до исполнения обещанного
  alternative: Добровольное соблюдение молчания
  rationale: Сочетание «будешь молчать» и «не в силах говорить» недвусмысленно указывает на наложенное ограничение, а не на простой призыв хранить молчание.
- issue: Оттенок ἀνθ’ ὧν
  choice: «за то, что» — причинно-воздаятельная связь
  alternative: «потому что» — исключительно причинная связь
  rationale: Предлог ἀντί в составе выражения допускает оттенок соответствующего воздаяния; контекст знамения-наказания поддерживает его, не требуя дополнительного богословского пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «И вот» сохраняет дискурсивный сигнал ἰδοὺ; архаизмы вроде «доколе» и «сбудется сие» не используются. Маркер сноски поставлен непосредственно после относящегося к ней выражения.
