  source_fidelity: 'Текст точно передаёт основные элементы греческого оригинала: ἰδού («И вот»), состояние молчания и невозможность говорить, временной предел «до того дня», причинно-воздаятельное ἀνθ’ ὧν, неверие словам ангела и их исполнение в назначенный срок. Множественное «всё это» уместно для ταῦτα. «За то, что» допустимо передаёт контекстуальный оттенок последствия/воздаяния, не выходя за пределы исходного смысла.'
