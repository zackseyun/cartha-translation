  terminology: «Моим словам», «исполнятся» и «назначенное для них время» являются точными и стилистически уместными соответствиями λόγοι, πληρωθήσονται и καιρός. Не вводятся конфессионально обусловленные толкования. Сноска корректно даёт близкий лексический вариант для «назначенного времени».
