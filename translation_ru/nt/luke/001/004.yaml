    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит целевое придаточное и сохраняет значение цели.
- source_word: ἐπιγνῷς
  choice: ты мог убедиться
  rationale: В данном контексте передаёт не простое получение сведений, а обретение уверенного знания о надёжности ранее полученного наставления.
- source_word: περὶ ὧν ... λόγων
  choice: того, чему
  rationale: Естественная русская передача содержания наставления; позволяет не воспроизводить буквально λόγων как «слов», что здесь звучало бы неясно.
- source_word: κατηχήθης
  choice: был научен
  rationale: Передаёт пассивную форму и значение устного наставления, не внося более позднего специального смысла слова «катехизирован».
- source_word: τὴν ἀσφάλειαν
  choice: в достоверности
  rationale: Передаёт надёжность и обоснованность сообщённого, сохраняя связь с личной уверенностью адресата.
theological_decisions:
- issue: Характер цели Луки
  choice: «убедиться в достоверности» сохраняет как объективную надёжность наставления, так и уверенность адресата
  alternative: «узнать с точностью» или «обрести уверенность»
  rationale: ἀσφάλεια допускает оттенки достоверности, надёжности и уверенности; формулировка не сводит смысл исключительно к субъективному переживанию либо только к исторической проверке.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка. «Был научен» понятно широкому читателю и не вносит специальной церковной терминологии.
