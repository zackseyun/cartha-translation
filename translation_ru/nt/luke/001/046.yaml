  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: ru
  text: 'И Мария сказала: «Моя душа величит[a] Господа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «провозглашает величие Господа».'
    reason: 'Лексическая альтернатива: μεγαλύνει может обозначать признание и возвещение чьего-либо величия.'
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Простой сочинительный союз сохраняет последовательность повествования, не добавляя временного оттенка «тогда».
- source_word: εἶπεν
  choice: сказала
  rationale: Обычная и естественная передача аориста λέγω при введении прямой речи.
- source_word: Μαριάμ
  choice: Мария
  rationale: Употреблена закрепившаяся в русском библейском и литературном обиходе форма имени.
- source_word: Μεγαλύνει
  choice: величит
  rationale: Глагол сохраняет поэтический образ μεγαλύνω — признавать и возвещать величие; настоящее время передано настоящим временем. Слово «величит» понятно в возвышенном библейско-поэтическом контексте и не сводит выражение к общему «прославляет».
- source_word: ἡ ψυχή μου
  choice: Моя душа
  rationale: Сохранён образный антропологический язык греческого текста и лежащей за ним библейской поэзии; замена на «я» чрезмерно сгладила бы выражение.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В данном контексте κύριος выступает как благоговейный титул Бога; традиционная русская передача сохраняет его библейско-богословский вес.
theological_decisions:
- issue: Передача κύριος
  choice: Господа
  alternative: Владыку
  rationale: Контекст гимнической хвалы и отголоски языка Писания указывают на божественный титул. «Владыку» лексически возможно, но оно уже по смыслу и менее естественно здесь.
- issue: Передача ἡ ψυχή μου
  choice: Моя душа
  alternative: Я; всё моё существо
  rationale: Буквально-поэтическая передача сохраняет напряжение между «душой» как внутренним началом и целостным самовыражением говорящей, не навязывая тексту узкой антропологической схемы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, гимническим звучанием. Прямой порядок слов делает фразу доступной современному читателю, а «душа» и «величит» сохраняют поэтическую плотность исходного текста.
