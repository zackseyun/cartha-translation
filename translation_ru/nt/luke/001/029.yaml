  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: ru
  text: Она же была глубоко встревожена этими словами[a] и всё размышляла, что это за приветствие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при слове»; возможный перевод: «из-за сказанного».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «какого рода было бы это приветствие». Греческая форма передаёт её размышление о характере этого приветствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: же
  rationale: Частица мягко отмечает переход к реакции Марии; русское «же» передаёт этот повествовательный сдвиг без чрезмерно резкого противопоставления.
- source_word: ἐπὶ τῷ λόγῳ
  choice: этими словами
  rationale: Выражение указывает на только что произнесённое ангелом. Во множественном числе «этими словами» естественно звучит по-русски и обозначает содержание сказанного, а не отдельное слово.
- source_word: διεταράχθη
  choice: была глубоко встревожена
  rationale: Глагол обозначает сильное внутреннее смятение; «глубоко встревожена» передаёт усилительный оттенок формы и сохраняет достойный современный регистр.
- source_word: διελογίζετο
  choice: всё размышляла
  rationale: Имперфект изображает продолжающееся внутреннее обдумывание; частица «всё» естественно передаёт длительность процесса.
- source_word: ποταπὸς εἴη
  choice: что бы значило
  rationale: В контексте косвенного вопроса оборот естественно передаёт размышление о характере и смысле приветствия; частица «бы» сохраняет оттенок предположительности оптатива.
- source_word: ἀσπασμὸς οὗτος
  choice: такое приветствие
  rationale: «Приветствие» точно обозначает обращение ангела, а «такое» передаёт вопрос о его необычном характере и отсылает к конкретно прозвучавшим словам.
theological_decisions:
- issue: Характер реакции Марии
  choice: Мария глубоко встревожена сказанными ей словами и продолжает размышлять об их значении.
  alternative: Мария испугалась явления ангела или проявила неверие.
  rationale: Греческий текст непосредственно связывает её смятение со сказанным (ἐπὶ τῷ λόγῳ) и описывает продолжающееся размышление, не давая нравственной оценки и не называя её реакцию неверием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Синтаксис сохраняет повествовательную плавность; длительность размышления выражена естественным русским оборотом «всё размышляла».
