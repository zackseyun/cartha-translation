  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: ru
  text: А всё множество народа молилось снаружи в час каждения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время воскурения благовоний».'
    reason: 'Лексическая альтернатива: ὥρα может обозначать час или время, а θυμίαμα — благовоние либо действие его воскурения в данном храмовом контексте.'
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: всё множество
  rationale: Сохраняет собирательное единственное число πλῆθος и подчёркнутую πᾶν полноту собравшихся; по-русски звучит достойно и естественно.
- source_word: τοῦ λαοῦ
  choice: народа
  rationale: Передаёт буквальное «народа», не добавляя прямо не названного в стихе уточнения «Израиля».
- source_word: ἦν ... προσευχόμενον
  choice: в это время молилось
  rationale: Продолженное действие выражено естественной русской формой прошедшего времени; слова «в это время» помогают передать одновременность с действием Захарии в контексте, не добавляя совместности молитвы.
- source_word: ἔξω
  choice: снаружи
  rationale: Сохраняет намеренно неопределённое «вне, снаружи», не уточняя сверх греческого текста «вне святилища».
- source_word: τῇ ὥρᾳ
  choice: в час
  rationale: Сохраняет значение установленного часа храмового богослужения, а не более общее «во время».
- source_word: τοῦ θυμιάματος
  choice: каждения
  rationale: «Каждение» — точный и понятный термин для обрядового воскурения фимиама; он передаёт храмовый контекст без добавления идеи жертвы, не выраженной существительным напрямую.
theological_decisions:
- issue: Храмовая терминология θυμίαμα
  choice: каждение
  alternative: воскурение благовоний; принесение фимиама
  rationale: В контексте речь идёт об установленном храмовом обряде воскурения. «Каждение» кратко сохраняет культовый смысл, не превращая выражение в более специфическое богословское утверждение о жертвоприношении.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Множество народа» сохраняет структуру оригинала, «снаружи» — его пространственную неопределённость, а «каждение» естественно обозначает храмовый обряд.
