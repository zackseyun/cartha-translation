  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: ru
  text: Но когда он вышел, то не мог говорить с ними, и они поняли, что он видел видение в святилище. Он продолжал подавать им знаки и оставался немым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать немого, а в некоторых контекстах — также глухого.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: когда он вышел
  rationale: Аористное причастие естественно передано временным придаточным, сохраняющим последовательность событий.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: не мог говорить
  rationale: Передаёт выраженную сочетанием δύναμαι с инфинитивом неспособность говорить и звучит естественно по-русски.
- source_word: ἐπέγνωσαν
  choice: поняли
  rationale: В контексте речь идёт о выводе, к которому люди пришли по увиденным признакам.
- source_word: ὀπτασίαν
  choice: видение
  rationale: Здесь слово обозначает сверхъестественное явление или откровение, увиденное Захарией.
- source_word: ἐν τῷ ναῷ
  choice: в святилище
  rationale: ναός обозначает внутреннее храмовое святилище, а не весь храмовый комплекс.
- source_word: ἦν διανεύων
  choice: продолжал объясняться с ними знаками
  rationale: Перифрастический имперфект выражает продолжающееся действие; русский оборот ясно передаёт общение посредством жестов.
- source_word: διέμενεν κωφός
  choice: оставался немым
  rationale: Передаёт длительное состояние и непосредственный контекст неспособности говорить, не добавляя однозначного утверждения о глухоте.
theological_decisions:
- issue: Значение κωφός применительно к состоянию Захарии
  choice: оставался немым
  alternative: оставался глухим и немым
  rationale: Ближайший контекст подчёркивает невозможность говорить. При этом потенциальное значение, связанное с глухотой, сохранено в примечании, чтобы не устранять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. «Святилище» сохраняет различие между внутренней частью храма и всем храмовым комплексом.
