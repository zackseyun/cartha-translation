  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: ru
  text: спасение от наших врагов и от руки всех, кто ненавидит нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавление от наших врагов и от власти всех, кто ненавидит нас».'
    reason: 'Лексическая альтернатива: σωτηρία может означать «избавление», а идиома ἐκ χειρός — «от власти».'
lexical_decisions:
- source_word: σωτηρίαν
  choice: спасение
  rationale: Сохраняет как широкий богословский смысл, так и конкретный смысл избавления от враждебных сил в контексте пророчества Захарии.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: от наших врагов
  rationale: Предлог ἐξ обозначает удаление или избавление; естественный русский эквивалент — «от» без добавления отсутствующего в тексте слова «власть».
- source_word: ἐκ χειρὸς
  choice: от руки
  rationale: Сохраняет понятный библейский образ руки как власти или контроля и ветхозаветную интертекстуальную окраску.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: всех, кто ненавидит нас
  rationale: Естественно передаёт субстантивированное причастие настоящего времени и его характерный либо продолжающийся смысл.
- source_word: καὶ
  choice: и
  rationale: Прямо соединяет две предложные конструкции без дополнительного истолкования.
theological_decisions:
- issue: Характер обещанного спасения в пророчестве Захарии
  choice: Формулировка сохраняет одновременно конкретное избавление от врагов и более широкий богословский смысл спасения.
  alternative: Свести смысл либо исключительно к политико-национальному избавлению, либо исключительно к духовному спасению от греха.
  rationale: Сам стих говорит о врагах и ненавидящих, тогда как контекст Лк 1 придаёт спасению также искупительное значение; перевод не должен преждевременно устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Буквальное «от руки» понятно в контексте и поддержано поясняющей сноской.
