  text: ὅρκον ὃν ὤμοσεν πρὸς Ἀβραὰμ τὸν πατέρα ἡμῶν, τοῦ δοῦναι ἡμῖν
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/073.yaml
  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: ru
  text: клятву, которую Он дал Аврааму, нашему отцу[a], — даровать нам
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашему предку». Буквально в греческом: «нашему отцу» — так сохраняется заветный язык об Аврааме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: клятву
  rationale: Винительный падеж продолжает синтаксис предыдущего стиха; речь идёт о конкретной клятве.
- source_word: ὃν ὤμοσεν
  choice: которую Он дал
  rationale: Русское сочетание «дать клятву» естественно передаёт греческое «поклялся клятвой» и сохраняет торжественный регистр.
- source_word: πρὸς Ἀβραὰμ
  choice: Аврааму
  rationale: При глаголе клятвы πρός указывает на лицо, которому она дана; дательный падеж естественен по-русски.
- source_word: τὸν πατέρα ἡμῶν
  choice: нашему отцу
  rationale: Сохраняет буквальный семейно-заветный образ греческого текста; «предку» возможно, но ослабляет библейскую формулировку.
- source_word: τοῦ δοῦναι ἡμῖν
  choice: даровать нам
  rationale: Инфинитив выражает содержание или цель клятвы и остаётся незавершённым до следующего стиха; «даровать» соответствует возвышенному поэтическому контексту.
theological_decisions:
- issue: Заветное обозначение Авраама
  choice: нашему отцу
  alternative: нашему предку
  rationale: Формулировка сохраняет традиционный заветный язык и коллективный голос пророчества, не добавляя конфессионального толкования.
- issue: Связь инфинитива τοῦ δοῦναι с клятвой
  choice: — даровать нам
  alternative: чтобы даровать нам
  rationale: Тире сохраняет возможный оттенок как содержания, так и цели клятвы, не устраняя синтаксической неоднозначности греческого текста.
translation_notes:
  register: Современный литературный русский с торжественной интонацией песни Захарии. Прописное «Он» обозначает Бога согласно принятой русской издательской норме; фраза намеренно остаётся синтаксически открытой и продолжается в следующем стихе.
