base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: ru
  text: Ведь он будет велик перед Господом и не будет пить ни вина, ни крепкого напитка[a]; он исполнится Святого Духа с самого чрева своей матери[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Крепкий напиток» — опьяняющий напиток, отличный от вина.
    reason: cultural_note
  - marker: b
    text: 'Возможны также переводы: «уже от чрева своей матери» или «ещё в утробе матери». Греческое выражение подчёркивает исключительно раннее время исполнения Святым Духом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: велик
  rationale: Прямой и традиционный эквивалент, сохраняющий значение величия и значимости без уточнения его характера.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: перед Господом
  rationale: Естественно передаёт положение и оценку пред Господом, не сужая смысл до физического присутствия.
- source_word: οἶνον καὶ σίκερα
  choice: ни вина, ни крепкого напитка
  rationale: «Вино» прямо соответствует οἶνος, а «крепкий напиток» обозначает иной опьяняющий напиток, не сводя σίκερα к конкретному виду.
- source_word: οὐ μὴ πίῃ
  choice: не будет пить
  rationale: Будущая форма в русском естественно соответствует пророческому сообщению, а конструкция «ни… ни» передаёт категоричность греческого οὐ μή без превращения предсказания в явно сформулированный приказ.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: исполнится Святого Духа
  rationale: Сохраняет пассивно-результативный смысл πλησθήσεται и личный божественный референт πνεύματος ἁγίου; это устойчивое и понятное библейское выражение.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: ещё во чреве матери
  rationale: Передаёт исключительно раннее, внутриутробное время исполнения Духом и естественно выражает сочетание ἔτι с ἐκ в данном контексте.
theological_decisions:
- issue: Сила οὐ μὴ πίῃ в пророческом возвещении
  choice: 'Категорическое предсказание: «не будет пить ни… ни…»'
  alternative: 'Предписание: «не должен никогда пить»'
  rationale: Греческая конструкция решительно отрицает будущее действие. Русская формулировка сохраняет эту силу и пророческую форму, не исключая подразумеваемого посвящения Иоанна.
- issue: Референт πνεύματος ἁγίου
  choice: 'Личный божественный референт: «Святого Духа»'
  alternative: Безличная святая сила или расположение духа
  rationale: Контекст и характерное для Луки употребление указывают на Божьего Святого Духа; прописные буквы ясно передают этот референт.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Во чреве» сохраняет узнаваемый высокий регистр, оставаясь понятным; синтаксис слегка упорядочен для естественного русского звучания. Все маркеры сносок присутствуют в основном тексте.
