lexical_decisions:
- source_word: καθεῖλεν
  choice: низложил
  rationale: Глагол передаёт решительное устранение с высокого положения; в сочетании с престолами «низложил» звучит естественно и сохраняет политико-социальный образ, не уточняя способ свержения.
- source_word: δυνάστας
  choice: властителей
  rationale: Слово может обозначать могущественных людей или правителей. Упоминание престолов выдвигает на первый план носителей власти, но более широкий оттенок отмечен в сноске.
- source_word: ἀπὸ θρόνων
  choice: с престолов
  rationale: Прямой перевод сохраняет конкретный образ престолов; притяжательное «их» не добавляется, поскольку его нет в греческом тексте.
- source_word: ὕψωσεν
  choice: возвысил
  rationale: Передаёт как социальное возвышение, так и богословский мотив перемены положения и хорошо уравновешивает «низложил».
- source_word: ταπεινούς
  choice: смиренных
  rationale: Сохраняет значение смирения, не исключая низкого общественного положения; социальный оттенок явно указан в сноске.
theological_decisions:
- issue: Временное и аспектуальное значение аористов в Песни Марии
  choice: 'Передать совершенным видом в прошедшем времени: «низложил… возвысил»'
  alternative: «низлагает… возвышает» или формы с явным значением уже совершившегося действия
  rationale: Русское прошедшее совершенного вида естественно передаёт решительные, целостные Божьи действия, не устанавливая однозначно, понимаются ли они как уже совершившиеся, пророчески предвосхищённые или обобщённые в хвалебной песне.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Пара «низложил — возвысил» ясно выражает контраст, а сноски сохраняют смысловую широту δυνάστας и ταπεινούς.
