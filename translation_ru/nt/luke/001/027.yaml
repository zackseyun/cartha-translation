base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: ru
  text: К деве, обручённой[a] с мужчиной по имени Иосиф, из дома Давида; а имя девы — Мария[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть состоявшей в официально установленном обручении, предшествовавшем совместной супружеской жизни.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Мариам» — более близкая передача греческой формы имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: дева
  rationale: В данном контексте слово обозначает девственницу; «дева» ясно передаёт этот смысл, сохраняет повтор греческого текста и звучит естественно в библейском повествовании.
- source_word: ἐμνηστευμένην
  choice: обручённой
  rationale: Причастие перфекта обозначает уже установленное, официальное состояние обручения до начала совместной супружеской жизни. Русское «обручённой» точнее, чем современное «помолвленной», передаёт юридико-общественную значимость этого состояния.
- source_word: ἀνδρὶ
  choice: с мужчиной
  rationale: ἀνήρ допускает значения «мужчина» и «муж», но при упоминании обручения перевод «мужчина» не создаёт преждевременного впечатления о полностью заключённом и осуществлённом браке.
- source_word: ᾧ ὄνομα Ἰωσήφ
  choice: по имени Иосиф
  rationale: Естественная русская передача греческой формулы именования без изменения смысла.
- source_word: ἐξ οἴκου Δαυίδ
  choice: из дома Давида
  rationale: Сохраняет библейский династический образ «дома», не заменяя его более толковательным словом «рода» или «линии».
- source_word: Μαριάμ
  choice: Мария
  rationale: Использована традиционная и общепонятная русская форма имени; более близкая к греческому написанию форма «Мариам» отмечена в сноске.
theological_decisions:
- issue: Передача παρθένος с сохранением значения девственности в повествовании Луки
  choice: дева
  alternative: молодая женщина
  rationale: Лексическое значение слова и его повтор в стихе указывают именно на девственность. «Молодая женщина» неоправданно ослабила бы выраженный в тексте смысл.
- issue: Степень брачного статуса Марии и Иосифа
  choice: обручённой с мужчиной
  alternative: помолвленной с будущим мужем / обручённой с мужем
  rationale: Так передаётся формально установленное обручение, но не утверждается сверх текста, что супружеская жизнь уже началась.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Слово «дева» выбрано вместо более клинического «девственница», а конструкция «по имени» — вместо буквальной, но неестественной греческой формулы. Порядок слов сохраняет связь Иосифа с домом Давида, не добавляя отсутствующих в стихе пояснений.
