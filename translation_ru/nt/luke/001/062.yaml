lexical_decisions:
- source_word: ἐνένευον
  choice: знаками спросили
  rationale: Глагол обозначает общение посредством знаков или жестов. В сочетании с последующим косвенным вопросом естественная русская передача — «знаками спросили».
- source_word: δὲ
  choice: Тогда
  rationale: Здесь частица служит мягкой повествовательной связкой и продвигает рассказ; «тогда» естественно передаёт последовательность событий.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: его отца
  rationale: Дательный падеж обозначает адресата жестов; при русском глаголе «спросили» требуется винительный падеж.
- source_word: τὸ τί ἂν θέλοι
  choice: как бы он хотел
  rationale: Косвенный вопрос с ἄν и оптативом выражает смягчённое, потенциальное желание. Частица «бы» сохраняет этот оттенок, не делая фразу тяжеловесной.
- source_word: καλεῖσθαι αὐτό
  choice: назвать ребёнка
  rationale: Греческая конструкция буквально означает «чтобы он был назван». Активная русская формулировка естественнее в данном контексте; «ребёнка» ясно обозначает референта местоимения αὐτό.
