  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: ru
  text: Когда окончились дни его служения[a], он отправился к себе домой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть установленного срока его священнического служения в храме.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «в свой дом». Греческое слово может обозначать как жилище, так и дом в более широком смысле — домашний круг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: не выражено отдельно
  rationale: Луканская повествовательная формула καὶ ἐγένετο естественно передаётся по-русски переходом к придаточному времени; буквальное «и случилось» здесь было бы тяжеловесно.
- source_word: ὡς
  choice: когда
  rationale: В данном контексте вводит временное придаточное и естественно передаётся союзом «когда».
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: окончились дни
  rationale: Означает, что установленный срок достиг завершения; выражение сохраняет образ «дней» и звучит естественно по-русски.
- source_word: λειτουργίας
  choice: служения
  rationale: В контексте речь идёт об установленном храмовом служении Захарии как священника; краткий вариант сохраняет культовый оттенок, поясняемый сноской.
- source_word: ἀπῆλθεν
  choice: вернулся
  rationale: По контексту Захария ушёл из храма к себе домой; «вернулся» естественно выражает это движение, хотя буквальнее было бы «пошёл» или «отправился».
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: домой
  rationale: Идиоматично обозначает возвращение к своему дому; греческое οἶκος допускает как значение здания, так и более широкое значение дома или домашнего круга.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательная формула передана без архаического «и было». Порядок сносок приведён к последовательному [a], [b].
