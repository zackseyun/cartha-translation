lexical_decisions:
- source_word: ἀντελάβετο
  choice: поддержал
  rationale: Глагол означает «взяться за кого-либо», чтобы помочь или поддержать. «Поддержал» естественно по-русски и сохраняет образ действенной Божьей помощи.
- source_word: Ἰσραὴλ
  choice: Израиля
  rationale: Имя передано в традиционной русской форме; винительный падеж обусловлен управлением глагола. В контексте речь идёт о народе Израиля как едином целом.
- source_word: παιδὸς αὐτοῦ
  choice: Своего слугу
  rationale: παῖς может означать и «слуга», и «дитя». Здесь «слуга» лучше отражает ветхозаветный образ Израиля как Божьего слуги; возвратное «Своего» естественно указывает на Бога как действующее лицо.
- source_word: μνησθῆναι
  choice: вспомнив
  rationale: Аористный инфинитив связан с основным действием и может выражать сопутствующее обстоятельство либо цель/результат. Деепричастие передаёт связь действий кратко, не уточняя её сверх текста.
- source_word: ἐλέους
  choice: о милости
  rationale: «Милость» прямо передаёт ἔλεος; предложное управление требуется русским глаголом «вспомнить». Возможный оттенок верности завету вынесен в примечание.
theological_decisions:
- issue: Значение παῖς применительно к Израилю
  choice: Израиля, Своего слугу
  alternative: Израиля, Своё дитя
  rationale: Выбор «слугу» сохраняет связь с ветхозаветной традицией именования Израиля Божьим слугой, при этом подлинная лексическая неоднозначность отмечена в сноске.
- issue: Смысл μνησθῆναι ἐλέους
  choice: вспомнив о милости
  alternative: чтобы вспомнить о милости; в воспоминание о милости
  rationale: Формулировка сохраняет компактность греческого текста и представляет Божье воспоминание как проявившееся в помощи, не добавляя прямо отсутствующего притяжательного местоимения и не сводя милость только к одному богословскому оттенку.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной интонацией песни Марии. Сохранены краткость исходной фразы, неоднозначность παῖς и возможный заветный оттенок ἔλεος; «поддержал» выбрано как естественное выражение действенной помощи.
