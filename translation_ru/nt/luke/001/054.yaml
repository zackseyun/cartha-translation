  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израилю, Своему ребёнку». Греческое слово παῖς может означать как «слуга», так и «ребёнок»; здесь выбрано «слуга» ввиду ветхозаветного наименования Израиля Божьим слугой.'
