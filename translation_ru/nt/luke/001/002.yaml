lexical_decisions:
- source_word: καθὼς
  choice: как
  rationale: Передаёт сравнительно-соотносительную связь с предыдущим стихом естественным русским оборотом.
- source_word: παρέδοσαν
  choice: передали
  rationale: В данном контексте глагол обозначает передачу полученных сведений или предания; «передали» сохраняет этот смысл без излишне специальной окраски.
- source_word: ἡμῖν
  choice: нам
  rationale: Прямое соответствие дательному падежу, обозначающему получателей.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: те, которые с самого начала
  rationale: Сохраняет указание на определённую группу людей и временное значение выражения.
- source_word: αὐτόπται
  choice: очевидцами
  rationale: Точно и естественно обозначает людей, лично видевших описываемые события.
- source_word: ὑπηρέται
  choice: служителями
  rationale: Передаёт идею служения слову и не вводит значения формальной церковной должности.
- source_word: γενόμενοι
  choice: стали
  rationale: Отражает значение становления в причастии γενόμενοι и сохраняет различие между тем, что они были очевидцами с начала, и тем, что стали служителями.
- source_word: τοῦ λόγου
  choice: слова
  rationale: Сохраняет широту значения λόγος и традиционную формулировку; вероятный смысл «весть» поясняется в сноске.
theological_decisions:
- issue: Значение τοῦ λόγου
  choice: «слова» — с вероятным значением провозглашаемой вести об Иисусе
  alternative: «вести» или «повествования»
  rationale: Контекст, вероятнее всего, говорит о передаваемой вести об Иисусе, а не употребляет λόγος как христологический титул. Формальное «слова» сохраняет лексическую многозначность.
- issue: Связь γενόμενοι с двумя существительными
  choice: «были очевидцами и стали служителями»
  alternative: «став очевидцами и служителями»
  rationale: 'Такой перевод естественно выражает наиболее вероятную временную последовательность: эти люди были очевидцами с самого начала и затем стали служителями слова, не превращая «очевидца» в приобретённую должность.'
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Структура продолжает синтаксис Лк 1:1; местоимение «их» восполняет подразумеваемое в греческом дополнение и соотносится с событиями или сведениями о них из предыдущего стиха. Строчная буква в слове «слова» помогает не навязывать понимание λόγος как личного титула Христа.
