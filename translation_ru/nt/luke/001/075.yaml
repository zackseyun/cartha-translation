  text: in holiness and righteousness before him all our days[a].
translation:
  language: ru
  text: в святости и праведности[a] перед Ним во все наши дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости».'
    reason: Лексически возможный вариант передачи δικαιοσύνη.
lexical_decisions:
- source_word: ἐν
  choice: в
  rationale: Предлог обозначает сферу или образ служения; «в» естественно сохраняет греческую конструкцию.
- source_word: ὁσιότητι
  choice: святости
  rationale: Слово обозначает святость и благочестие по отношению к Богу; «святость» ясно передаёт его смысл и сохраняет отличие от δικαιοσύνη.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз между двумя однородными понятиями.
- source_word: δικαιοσύνῃ
  choice: праведности
  rationale: В сочетании со «святостью» слово описывает нравственную правоту перед Богом; «праведность» сохраняет широкий этический и богословский смысл.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед Ним
  rationale: Естественное русское выражение со значением «в Его присутствии, пред Его взором»; местоимение относится к Богу.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: во все дни наши
  rationale: Точно передаёт греческий оборот и его значение — на протяжении всей нашей жизни, не добавляя отсутствующего в тексте слова «жизнь».
theological_decisions:
- issue: Передача δικαιοσύνη в непавловском этическом контексте
  choice: праведность
  alternative: справедливость
  rationale: В паре со «святостью» здесь подразумевается праведная жизнь перед Богом. «Справедливость» лексически возможна, но в данном контексте может неоправданно сузить смысл до беспристрастного или общественно-правового отношения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «во все дни наши» сохраняет достоинство и ритм исходного оборота, оставаясь понятной современному читателю.
