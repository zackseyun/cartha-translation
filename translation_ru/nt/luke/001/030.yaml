base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: ru
  text: 'И ангел сказал ей: «Не бойся, Мария, потому что ты обрела благоволение у Бога[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодать». Греческое χάρις может означать как «благодать», так и «благоволение», однако в выражении «обрести благоволение у Бога» второе лучше передаёт смысл данной идиомы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: сказал
  rationale: Обычная повествовательная форма аориста от λέγω; «сказал» естественно вводит прямую речь по-русски.
- source_word: ἄγγελος
  choice: ангел
  rationale: В контексте повествования о рождении Иисуса речь идёт о небесном существе, поэтому «ангел» точнее общего «вестник».
- source_word: Μὴ φοβοῦ
  choice: не бойся
  rationale: Естественная современная русская форма запрета, точно передающая значение греческого императива с μή.
- source_word: Μαριάμ
  choice: Мария
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: εὗρες
  choice: ты обрела
  rationale: Греческий аорист обозначает уже состоявшееся обретение с актуальным результатом; «обрела» звучит естественно и достойно в данном возвещении.
- source_word: χάριν
  choice: благоволение
  rationale: В устойчивом обороте εὑρίσκω χάριν παρά выражает благосклонное отношение Бога; «благоволение» сохраняет этот смысл и не подменяет его позднейшей богословской терминологией.
- source_word: παρὰ τῷ θεῷ
  choice: у Бога
  rationale: После выражения «обрести благоволение» παρά с дательным указывает на того, в чьих глазах или перед кем оно обретено; «у Бога» кратко и идиоматично.
theological_decisions:
- issue: Передача χάριν в контексте обращения к Марии
  choice: благоволение
  alternative: благодать
  rationale: Сочетание εὑρίσκω χάριν παρά + дательный представляет собой устойчивое выражение «обрести благоволение у кого-либо». Такой перевод следует греческой идиоме и не вводит в стих более поздние конфессиональные смыслы, сохраняя при этом идею Божьей милости к Марии.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и торжественный без архаизмов. Союз καί в начале стиха не передан отдельным «и», поскольку при изолированном русском стихе это звучало бы менее естественно; повествовательная связь сохраняется контекстом.
