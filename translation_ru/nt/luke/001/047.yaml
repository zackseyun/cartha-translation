  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: ru
  text: и дух мой возликовал[a] в Боге, моём Спасителе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возрадовался».'
    reason: 'Лексическая альтернатива: вариант точен, но «возликовал» лучше передаёт интенсивность ἀγαλλιάω.'
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз сохраняет связь с предыдущей строкой и поэтический параллелизм.
- source_word: ἠγαλλίασεν
  choice: возликовал
  rationale: Глагол передаёт сильную, торжествующую радость; совершенный вид естественно соответствует аористу, не превращая его в продолженное состояние.
- source_word: τὸ πνεῦμά μου
  choice: дух мой
  rationale: Сохраняет отдельную лексику оригинала и параллель с «душой моей» в предыдущем стихе, не навязывая строгого антропологического разграничения.
- source_word: ἐπὶ τῷ θεῷ
  choice: о Боге
  rationale: При глаголе ликования конструкция ἐπί с дательным указывает на основание или предмет радости. «О Боге» сохраняет эту ёмкость и соответствует возвышенной поэтической речи.
- source_word: τῷ σωτῆρί μου
  choice: моём Спасителе
  rationale: «Спаситель» прямо и весомо передаёт σωτήρ; приложение ясно отождествляет Бога с Тем, кого Мария называет своим Спасителем.
theological_decisions:
- issue: Именование Бога «моим Спасителем»
  choice: о Боге, моём Спасителе
  alternative: о Боге, моём Избавителе
  rationale: Греческий текст прямо называет Бога Спасителем Марии. Перевод сохраняет это утверждение, не ослабляя его и не выводя из него дополнительных догматических заключений.
- issue: Соотношение «духа» и «души» в параллельных строках
  choice: сохранить слово «дух» отдельно от «души»
  alternative: передать оба слова общим обозначением внутреннего существа
  rationale: Поэтический параллелизм указывает на близость значений, однако оригинал использует разные слова. Их различие сохранено без утверждения, что речь непременно идёт о строго раздельных составляющих человека.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Инверсия «дух мой» поддерживает ритм и библейскую поэтичность, оставаясь понятной современному читателю.
