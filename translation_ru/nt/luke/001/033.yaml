  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: ru
  text: И будет царствовать над домом Иакова вовеки[a], и царству его не будет конца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на века». Греческое выражение εἰς τοὺς αἰῶνας означает бесконечную продолжительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: будет царствовать
  rationale: Будущее время глагола βασιλεύω обозначает осуществление царской власти; «будет царствовать» естественно и точно передаёт этот смысл.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: над домом Иакова
  rationale: ἐπί с винительным падежом при βασιλεύω выражает власть над кем-либо; «дом Иакова» сохраняет традиционное библейское корпоративное обозначение без пояснительного расширения.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Греческий идиоматический оборот выражает бесконечную продолжительность; «вовеки» кратко, понятно и соответствует возвышенному регистру повествования.
- source_word: βασιλείας
  choice: Царству
  rationale: βασιλεία может означать царствование, власть или царство. В сочетании с отсутствием конца «Царство» по-русски естественно сохраняет как царский, так и непреходящий смысл.
- source_word: οὐκ ἔσται τέλος
  choice: не будет конца
  rationale: Экзистенциальная конструкция с будущим временем и отрицанием естественно передаётся устойчивым русским оборотом «не будет конца».
theological_decisions:
- issue: Объём понятия «дом Иакова»
  choice: Сохранено буквальное выражение «дом Иакова» без замены на «Израиль» или «народ Божий».
  alternative: «народ Израиля»; «народ Божий»
  rationale: Исходное выражение является заветным и корпоративным обозначением. Его сохранение не привносит в ангельское возвещение более позднего богословского толкования его объёма.
- issue: Продолжительность царствования
  choice: εἰς τοὺς αἰῶνας передано как «вовеки», а οὐκ ἔσται τέλος — как «не будет конца», что выражает непрекращающееся царствование.
  alternative: «на века»; «во веки»
  rationale: Обе части стиха взаимно усиливают утверждение о бесконечности царствования и Царства; перевод сохраняет эту силу, не сглаживая повтор.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены традиционные выражения «дом Иакова» и «вовеки»; синтаксис остаётся ясным для современного читателя. «Царству Его» оформлено с прописных букв как уважительное мессианское обозначение, без добавления толкования.
