  text: Голодных Он насытил благами, а богатых отослал ни с чем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: голодных
  rationale: Субстантивированное причастие настоящего времени обозначает людей, испытывающих голод; краткая форма естественна по-русски и не усиливает значение до «голодающих» или «умирающих с голоду».
- source_word: ἐνέπλησεν
  choice: насытил
  rationale: Глагол означает наполнить досыта, насытить. В сочетании с «голодных» русский глагол «насытил» естественно передаёт и действие наполнения, и обусловленный контекстом результат.
- source_word: ἀγαθῶν
  choice: благами
  rationale: Родительный падеж указывает, чем именно Бог насытил голодных. «Благами» сохраняет широкое значение существительно употреблённого прилагательного и не добавляет идеи даров, прямо не выраженной в греческом.
- source_word: πλουτοῦντας
  choice: богатых
  rationale: Субстантивированное причастие настоящего времени обозначает богатых людей и сохраняет конкретный социальный контраст с голодными.
- source_word: ἐξαπέστειλεν
  choice: отослал
  rationale: 'Передаёт направленное удаление: послал прочь. «Отослал» звучит естественно и не привносит оттенка официального увольнения.'
- source_word: κενούς
  choice: ни с чем
  rationale: Предикативное прилагательное описывает состояние богатых при их удалении. Идиома «ни с чем» естественно передаёт смысл «пустыми», не ограничивая его буквальной картиной пустых рук.
theological_decisions:
- issue: Социально-богословская перемена участи в песне Марии
  choice: Сохранён прямой контраст между голодными и богатыми без одухотворения этих обозначений.
  alternative: Понимать голодных только как духовно нуждающихся, а богатых — как самодовольных или гордых.
  rationale: Греческий текст называет конкретно голодных и богатых. Перевод сохраняет социальную остроту и богословское напряжение стиха, не сводя его к аллегории.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная фраза соответствует поэтическому параллелизму Магнификата. Прописное «Он» ясно отсылает к Богу в данном контексте.
