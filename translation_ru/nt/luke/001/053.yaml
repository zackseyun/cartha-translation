  source_fidelity: 'Текст точно передаёт греческий параллелизм и оба противопоставленных класса: πεινῶντας — «голодных», πλουτοῦντας — «богатых». «Насытил благами» естественно выражает ἐνέπλησεν ἀγαθῶν в данном контексте, а «отослал ни с чем» передаёт ἐξαπέστειλεν κενούς без неоправданного добавления образа «пустых рук». Прошедшее время уместно в контексте поэтического, пророчески-совершенного описания Божьих действий.'
