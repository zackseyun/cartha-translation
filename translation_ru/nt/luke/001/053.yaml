  terminology: «Блага» сохраняет широкое содержание ἀγαθῶν, не сводя его только к материальным дарам и не превращая в специально богословский термин. «Голодные» и «богатые» сохраняют конкретный социальный контраст исходного текста, без его аллегоризации.
