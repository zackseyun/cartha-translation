  footnotes:
  - marker: a
    text: '«Боится Его» означает жить в благоговейном страхе перед Богом. Буквально: «в поколения и поколения», то есть на протяжении многих поколений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: милость
  rationale: Прямое и естественное соответствие, передающее милосердие и благоволение Бога к нуждающимся без неоправданного сужения смысла.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: из поколения в поколение
  rationale: Устойчивое русское выражение естественно передаёт распространение милости на последовательные поколения; греческий оборот буквально имеет направительный оттенок «в поколения и поколения».
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: к тем, кто боится Его
  rationale: Дательный падеж обозначает тех, на кого направлена милость, а «боится Его» сохраняет библейскую формулировку и её смысл благоговейного страха.
- source_word: καὶ
  choice: И
  rationale: Союз сохранён, поскольку связывает эту строку с предшествующими утверждениями песни Марии.
- source_word: αὐτοῦ / αὐτόν
  choice: Его / Его
  rationale: Оба местоимения относятся к Богу; прописная буква соответствует принятому благоговейному русскому оформлению и не меняет смысла.
theological_decisions:
- issue: Значение страха перед Богом
  choice: боится Его
  alternative: благоговеет перед Ним
  rationale: Греческое φοβουμένοις при Боге как объекте включает благоговейный страх, а не только испуг. Слово «боится» сохраняет библейскую напряжённость и не сводит понятие лишь к почтению.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Тире делает именную конструкцию естественной по-русски; традиционное «боится Бога» сохранено, но пояснено в сноске во избежание понимания как простого ужаса.
