  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: ru
  text: 'И он сказал: «Вот что я сделаю: снесу свои хранилища и построю бо́льшие, и там соберу всё зерно[a] и всё своё добро[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю пшеницу». Греческое слово σῖτος может обозначать зерно вообще или, более конкретно, пшеницу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё своё имущество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Вот что я сделаю
  rationale: Естественно по-русски передаёт указательное τοῦτο и решительное намерение, выраженное будущим временем.
- source_word: καθελῶ
  choice: снесу
  rationale: Точно и конкретно обозначает разбор существующих построек; звучит естественнее, чем «разрушу», которое может подразумевать уничтожение без последующего строительства.
- source_word: ἀποθήκας
  choice: хранилища
  rationale: Передаёт широкое значение мест для хранения сельскохозяйственных запасов, не вводя не вполне точного образа русского амбара.
- source_word: μείζονας οἰκοδομήσω
  choice: построю бо́льшие
  rationale: Сохраняет сравнительную степень и естественно восполняет по-русски подразумеваемое существительное из предыдущей части.
- source_word: συνάξω ἐκεῖ
  choice: там соберу
  rationale: Близко следует греческому выражению, сохраняя указание на место и основное значение συνάγω без усиления до «накоплю».
- source_word: πάντα τὸν σῖτον
  choice: всё своё зерно
  rationale: σῖτος обозначает зерно, нередко пшеницу; «зерно» сохраняет широту значения. Притяжательное «своё» естественно в контексте и согласуется с последующим μου.
- source_word: τὰ ἀγαθά μου
  choice: всё своё добро
  rationale: В данном контексте обозначает материальные блага и запасы; «добро» звучит естественно и не сужает смысл до денег.
