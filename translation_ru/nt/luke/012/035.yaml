  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть ваши поясницы будут подпоясаны». Длинную одежду подбирали и закрепляли поясом, чтобы быть готовыми немедленно отправиться в путь или взяться за дело.'
    reason: Культурное пояснение древнего образа готовности; уточняет буквальное значение χωρίς ошибочного «бёдра».
lexical_decisions:
- source_word: Ἔστωσαν
  choice: пусть … будут / горят
  rationale: Форма повелительного наклонения третьего лица выражает наставление; по-русски естественно передаётся конструкцией «пусть», общей для двух однородных частей.
- source_word: ὑμῶν
  choice: ваши
  rationale: Родительный падеж местоимения имеет притяжательное значение и относится к обоим образам; в русском это естественно выражается притяжательным местоимением.
- source_word: ὀσφύες περιεζωσμέναι
  choice: одежды будут подпоясаны
  rationale: Буквально говорится о подпоясанных бёдрах или поясницах, то есть о длинной одежде, подобранной и закреплённой поясом. Метонимическое «одежды» сохраняет конкретный древний образ и звучит понятнее в современном русском.
- source_word: λύχνοι
  choice: светильники
  rationale: Слово обозначает небольшие масляные светильники, а не свет как абстрактное понятие.
- source_word: καιόμενοι
  choice: горят
  rationale: Причастие настоящего времени описывает продолжающееся горение; «горят» кратко и естественно сохраняет этот смысл.
theological_decisions:
- issue: Образ готовности к действию
  choice: сохранить конкретный образ подпоясанной одежды в основном тексте
  alternative: Будьте готовы к действию
  rationale: Греческий текст выражает готовность посредством культурно обусловленного образа. Перевод не заменяет образ толкованием, а поясняет его в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Светильники» точнее исторически, чем «лампы»; архаичное «чресла» отвергнуто. Синтаксис сохраняет параллелизм двух образов.
