source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: ru
  text: 'Но даже все волосы у вас на голове сосчитаны. Не бойтесь: вы дороже множества воробьёв.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Но даже
  rationale: 'Передаёт и противопоставление предшествующей мысли, и усиление: Бог знает даже каждый волос.'
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: даже все волосы у вас на голове
  rationale: Естественная современная русская конструкция, сохраняющая конкретный образ и значение πᾶσαι.
- source_word: ἠρίθμηνται
  choice: сосчитаны
  rationale: 'Кратко передаёт перфектный пассив: подсчёт совершён, и его результат сохраняется; форма также предполагает Бога как подразумеваемого деятеля.'
- source_word: μὴ φοβεῖσθε
  choice: Не бойтесь
  rationale: Прямой, естественный и точный перевод запретительного повеления.
- source_word: πολλῶν στρουθίων
  choice: множества воробьёв
  rationale: Сохраняет конкретный вид птиц и связь с ближайшим контекстом; родительный после сравнительной формы естественен по-русски.
- source_word: διαφέρετε
  choice: вы дороже
  rationale: В данном контексте глагол обозначает превосходство в ценности, а не просто отличие; «дороже» звучит естественно и сохраняет сравнительный смысл.
theological_decisions:
- issue: Сравнение ценности учеников и воробьёв
  choice: вы дороже множества воробьёв
  alternative: вы ценнее множества воробьёв
  rationale: «Дороже» ясно выражает аргумент от меньшего к большему о Божьей заботе, не превращая высказывание в отвлечённое учение о человеческой ценности.
translation_notes:
  register: Современный литературный русский язык; краткая, утешительная и достойная формулировка. Двоеточие естественно связывает повеление не бояться с последующим основанием.
