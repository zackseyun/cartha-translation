  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: ru
  text: Итак, если вы не можете сделать даже самого малого, зачем тревожитесь об остальном?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Итак, если
  rationale: Сохраняет условное значение εἰ и выводную связь οὖν с предшествующим рассуждением; такой порядок слов естественен для современного русского языка.
- source_word: οὐδὲ ἐλάχιστον
  choice: даже самого малого
  rationale: Субстантивированное прилагательное среднего рода обозначает самое малое дело или действие. Родительный падеж при отрицании звучит естественно и не требует добавлять отсутствующее в греческом тексте существительное.
- source_word: δύνασθε
  choice: не можете сделать
  rationale: Передаёт значение способности; глагол «сделать» восполняет подразумеваемое действие, необходимое для ясного русского выражения.
- source_word: τί
  choice: зачем
  rationale: В риторическом вопросе τί имеет значение причины или основания. «Зачем» естественно передаёт вопрос о бессмысленности тревоги.
- source_word: περὶ τῶν λοιπῶν
  choice: об остальном
  rationale: Передаёт все прочие заботы или дела по контрасту с «самым малым», не конкретизируя их сверх исходного текста.
- source_word: μεριμνᾶτε
  choice: тревожитесь
  rationale: Передаёт продолжающуюся обеспокоенность и согласуется с контекстом наставления Иисуса о тревоге, не сводя слово к нейтральной предусмотрительности.
theological_decisions:
- issue: Значение μεριμνάω в наставлении Иисуса о доверии Богу
  choice: тревожитесь
  alternative: беспокоитесь; заботитесь
  rationale: «Тревожитесь» обозначает мучительное беспокойство, но не создаёт впечатления, будто запрещена всякая разумная забота. Перевод сохраняет направленность увещевания, не придавая слову узкого клинического смысла.
- issue: Что названо «самым малым»
  choice: даже самого малого
  alternative: даже малейшего дела
  rationale: Исходный текст оставляет ἐλάχιστον без названного существительного. Перевод сохраняет эту обобщённость и не решает за читателя, относится ли выражение строго к предшествующему примеру или шире — к человеческим возможностям.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая конструкция сохраняет достоинство и ясность речи. Выводное «итак» связывает стих с предшествующим примером, а «об остальном» удерживает лаконичность оригинала.
