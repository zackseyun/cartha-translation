  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: ru
  text: 'Но Бог сказал ему: «Безумец! Этой же ночью у тебя потребуют твою жизнь[a]. Кому же достанется то, что ты приготовил?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твою душу». Греческое слово ψυχή в зависимости от контекста может означать «жизнь» или «душу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Безумец!
  rationale: Форма обращения передаёт прямой и резкий упрёк; «безумец» звучит естественно и достойно, не сводя смысл лишь к недостатку ума.
- source_word: ταύτῃ τῇ νυκτί
  choice: Этой же ночью
  rationale: 'Частица «же» естественно передаёт подчёркнутую непосредственность: это произойдёт именно нынешней ночью.'
- source_word: τὴν ψυχήν σου
  choice: твою жизнь
  rationale: В контексте близкой смерти ψυχή прежде всего обозначает жизнь человека; возможное значение «душа» сохранено в сноске.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: у тебя потребуют
  rationale: Неопределённо-личная конструкция сохраняет множественное число глагола и не вводит в текст неназванных действующих лиц. «Потребуют» передаёт требование или взыскание, не добавляя явно отсутствующего в греческом слове «назад».
- source_word: ἃ δὲ ἡτοίμασας
  choice: то, что ты приготовил
  rationale: Естественная русская передача собирательного смысла относительной конструкции, относящейся к накопленному имуществу.
- source_word: τίνι ἔσται
  choice: Кому же достанется?
  rationale: Дательный вопросительный τίς выражает принадлежность или переход во владение; «кому достанется» кратко и естественно передаёт риторический вопрос.
theological_decisions:
- issue: Значение ψυχή в контексте смерти
  choice: жизнь
  alternative: душа
  rationale: Речь непосредственно идёт о прекращении земной жизни богача. «Жизнь» не навязывает более узкого антропологического толкования, а традиционная возможность «душа» отмечена в сноске.
- issue: Неуказанный субъект ἀπαιτοῦσιν
  choice: неопределённо-личное «потребуют»
  alternative: пассивное «будет потребована» или явное указание на Бога
  rationale: Греческий текст использует множественное число без названного субъекта. Русская неопределённо-личная форма сохраняет эту особенность и не определяет, кто именно требует жизнь.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясной устной силой притчевого высказывания. Синтаксис естественный, без церковнославянизмов; неопределённость субъекта греческого глагола сохранена.
