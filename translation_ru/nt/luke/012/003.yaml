  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: ru
  text: Поэтому всё, что вы сказали во тьме, будет услышано при свете, и то, что вы говорили на ухо во внутренних комнатах, будет провозглашено с крыш[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на крышах». Имеется в виду публичное объявление с плоских крыш домов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Поэтому
  rationale: Оборот имеет здесь выводное значение и связывает стих с предшествующим утверждением о раскрытии скрытого.
- source_word: ὅσα
  choice: всё, что
  rationale: Передаёт всеохватный смысл неопределённо-относительной конструкции естественным современным русским выражением.
- source_word: ἐν τῇ σκοτίᾳ
  choice: во тьме
  rationale: Сохраняет образ и прямое противопоставление свету, не устраняя переносного смысла тайны и сокрытия.
- source_word: ἀκουσθήσεται
  choice: будет услышано
  rationale: Естественно передаёт форму будущего времени страдательного залога и мотив раскрытия.
- source_word: πρὸς τὸ οὖς
  choice: на ухо
  rationale: Устойчивое русское выражение для тихой, доверительной речи, точно передающее смысл греческого оборота.
- source_word: ἐν τοῖς ταμείοις
  choice: во внутренних комнатах
  rationale: Передаёт закрытое, уединённое пространство, не сужая значение до кладовых.
- source_word: κηρυχθήσεται
  choice: будет провозглашено
  rationale: Выражает публичное и открытое объявление без неоправданного сужения до религиозной проповеди.
- source_word: ἐπὶ τῶν δωμάτων
  choice: с крыш
  rationale: Естественно передаёт образ публичного объявления с плоских крыш домов; пространственная точка объявления в русском обычно выражается предлогом «с».
theological_decisions:
- issue: Характер раскрытия тайного
  choice: Сохранить общее предупреждение о том, что скрытая речь станет явной, не уточняя время и способ раскрытия.
  alternative: Истолковать слова исключительно как раскрытие на последнем суде либо исключительно как разоблачение лицемерия уже в истории.
  rationale: Контекст говорит о раскрытии скрытого, но сам стих не ограничивает это раскрытие одним временем или механизмом.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной образности противопоставлений «тьма — свет» и «внутренние комнаты — крыши». Формулировка понятна широкому читателю и не вводит конфессионально обусловленного толкования.
