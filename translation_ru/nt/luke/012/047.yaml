  to: Тот раб, который знал волю своего господина и не приготовился или не поступил по его воле, получит много ударов.[a]
  rationale: Правка устраняет двусмысленность «тот же», сохраняет нейтральное соединение, соответствующее καί, и заменяет стилистически тяжёлую конструкцию на естественный современный русский эквивалент эллиптического выражения δαρήσεται πολλάς. Смысл, степень наказания и неоднозначность подразумеваемого существительного сохранены в основном тексте и сноске.
