source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: ru
  text: Тот раб, который знал волю своего господина и не приготовился или не поступил по его воле, получит много ударов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет много раз бит». В греческом тексте существительное «ударов» подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: Слово обозначает несвободного, подвластного хозяину человека, а не наёмного слугу; в контексте притчи эта зависимость существенна.
- source_word: γνοὺς
  choice: который знал
  rationale: Причастие указывает на имевшееся у раба знание воли господина; придаточное предложение естественно передаёт это по-русски.
- source_word: θέλημα
  choice: воля
  rationale: Обычный и уместный здесь эквивалент, обозначающий намерение и распоряжение господина.
- source_word: κυρίου αὐτοῦ
  choice: своего господина
  rationale: Внутри бытового образа κύριος обозначает господина раба; «своего» ясно передаёт принадлежность αὐτοῦ и не превращает слово в прямой божественный титул.
- source_word: μὴ ἑτοιμάσας
  choice: не приготовился
  rationale: Греческий текст не называет приготовляемого объекта; возвратная форма естественна по-русски и сохраняет общий смысл готовности к исполнению воли господина.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: или не поступил по его воле
  rationale: Сохранён разделительный союз ἢ и передан смысл действия в соответствии с волей господина.
- source_word: δαρήσεται πολλάς
  choice: будет много раз бит
  rationale: Будущее страдательное δαρήσεται передаёт физическое наказание, а πολλάς — многократность; русский оборот позволяет не добавлять отсутствующее в греческом существительное «удары».
theological_decisions:
- issue: Передача κύριος в бытовом контексте притчи
  choice: господин
  alternative: Господь
  rationale: Непосредственно в повествовательном образе речь идёт об отношениях раба и его господина. Такой перевод сохраняет образ, не отрицая более широкого значения притчи.
- issue: Эллиптическое выражение δαρήσεται πολλάς
  choice: будет много раз бит
  alternative: получит много ударов
  rationale: В греческом подразумеваемое существительное при πολλάς не выражено. Основной перевод сохраняет эллиптичность и конкретный характер наказания, не уточняя орудие или вид ударов.
- issue: Связь двух упущений через ἢ
  choice: не приготовился или не поступил
  alternative: не приготовился и не поступил
  rationale: Перевод с «или» формально сохраняет греческий союз и допускает, что наказание относится к любому из названных проявлений непослушания, не сводя их непременно к одновременному двойному проступку.
translation_notes:
  register: Современный литературный русский язык; тон прямой и серьёзный. «Раб» сохраняет социальную реальность притчи, а «господин» естественно обозначает хозяина в данном образе. Архаичные «розги» и «многие удары» не используются.
