    issue: «Тот же раб»
    rationale: ἐκεῖνος δὲ ὁ δοῦλος выделяет данного раба в противопоставлении следующему случаю; русское «тот же» может ошибочно означать «тот самый, уже упомянутый раб». Лучше «Тот раб».
  - severity: low
    issue: «но не приготовился»
    rationale: Греческое καὶ μὴ соединяет характеристику знания с последующим непослушанием без специально выраженного противительного союза. «И не приготовился» точнее и не утяжеляет логическую связь.
  - severity: low
    issue: «будет много раз бит»
    rationale: Формально возможно, однако пассивный оборот стилистически тяжёл для современного русского. Явное «получит много ударов» естественно воспроизводит подразумеваемое греческим πολλάς существительное.
  revised_text: Тот раб, который знал волю своего господина и не приготовился или не поступил по его воле, получит много ударов.[a]
