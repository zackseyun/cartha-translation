source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: ru
  text: Но если Бог так одевает полевую траву[a], которая сегодня растёт, а завтра будет брошена в печь[b], то тем более Он оденет вас, маловеры!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растительность» или «зелень».'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду печь для выпечки; высушенную полевую траву могли использовать как топливо.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: полевую траву
  rationale: χόρτος обозначает траву или травянистую растительность. В сочетании с ἐν ἀγρῷ перевод «полевую траву» естественно передаёт обычную растительность поля и не сужает образ до газонной травы.
- source_word: ἐν ἀγρῷ
  choice: полевую
  rationale: Определение «полевую» естественно и кратко передаёт местонахождение ἐν ἀγρῷ без излишней конкретизации.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: которая сегодня есть, а завтра будет брошена
  rationale: Причастная конструкция развёрнута в придаточное предложение, чтобы ясно сохранить резкий временной контраст и недолговечность травы.
- source_word: κλίβανον
  choice: печь
  rationale: κλίβανος — печь, прежде всего печь для выпечки; «печь» точнее и естественнее, чем «горн» или «топка».
- source_word: ἀμφιέζει
  choice: одевает
  rationale: Глагол означает «одевать, облачать». «Одевает» сохраняет связь с человеческой одеждой в контексте и звучит современно.
- source_word: πόσῳ μᾶλλον
  choice: тем более
  rationale: Русское «тем более» естественно передаёт довод от меньшего к большему; повтор глагола в будущем времени делает подразумеваемую вторую часть сравнения ясной.
- source_word: ὀλιγόπιστοι
  choice: маловеры
  rationale: Краткое обращение «маловеры» передаёт прямой укор ученикам и значение недостаточной веры, не превращая его в техническое вероучительное определение.
- source_word: εἰ δὲ
  choice: Но если
  rationale: «Но» передаёт лёгкий контраст и продолжение рассуждения, а «если» сохраняет условную форму греческой фразы.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое и точное соответствие явно названному субъекту.
- source_word: οὕτως
  choice: так
  rationale: «Так» кратко и естественно передаёт указание на образ действия.
theological_decisions:
- issue: Сила обращения ὀλιγόπιστοι
  choice: 'Прямой, но не усиленный укор: «маловеры»'
  alternative: «люди маловерные» или более резкое «неверующие»
  rationale: Слово указывает на недостаток доверия Богу, но не утверждает полного отсутствия веры и не выносит суждения об отступничестве. «Маловеры» сохраняет одновременно упрёк и пастырскую направленность обращения.
- issue: Подразумеваемый глагол во второй части сравнения
  choice: «тем более он оденет вас»
  alternative: 'Сохранить эллипсис: «насколько же больше — вас»'
  rationale: В греческом после πόσῳ μᾶλλον ὑμᾶς глагол подразумевается из первой части. В русском его восстановление необходимо для естественности; будущее время уместно выражает уверенность применительно к Божьей заботе об учениках, не меняя логики аргумента.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис развёрнут ровно настолько, насколько требуется для естественного русского выражения; образ одежды, кратковечность травы и прямое обращение сохранены.
