  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: ru
  text: Блажен тот слуга, которого господин[a], придя, застанет поступающим так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь». Греческое слово может означать господина в образе домашнего хозяйства или Господа, если иметь в виду более широкое применение притчи.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Сохраняет характерную для изречений-блаженств религиозную и оценочную силу; «счастлив» могло бы звучать преимущественно как описание субъективного чувства.
- source_word: δοῦλος
  choice: слуга
  rationale: В образе домашнего хозяйства слово обозначает подчинённого господину человека. «Слуга» естественно передаёт его роль и обязанность, не выдвигая на первый план юридический статус раба.
- source_word: ἐκεῖνος
  choice: тот
  rationale: Передаёт указательное значение и выделяет именно этого слугу.
- source_word: κύριος
  choice: господин
  rationale: В непосредственном сюжете притчи речь идёт о хозяине, которому подчинён слуга; «господин» сохраняет эту социальную связь. Возможное указание на Господа в более широком применении отмечено в сноске.
- source_word: ἐλθὼν
  choice: придя
  rationale: 'Деепричастие естественно передаёт предшествующее обстоятельство аористного причастия: господин приходит и затем обнаруживает слугу за этим делом.'
- source_word: εὑρήσει
  choice: найдёт
  rationale: Точно передаёт форму будущего времени.
- source_word: ποιοῦντα οὕτως
  choice: поступающим так
  rationale: Естественно отсылает к описанному ранее верному исполнению поручения и передаёт продолжающееся действие, которое господин застаёт по возвращении.
theological_decisions:
- issue: Возможный христологический оттенок κύριος в притче о возвращении господина
  choice: В основном тексте — «господин»
  alternative: «Господь» — если подчеркнуть более широкое применение притчи к возвращению Иисуса
  rationale: На уровне сюжетного образа κύριος — господин слуги. Вместе с тем контекст допускает эсхатологическое применение, поэтому альтернативный оттенок не устраняется, а сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейскому изречению. «Блажен» сохраняет форму макаризма; синтаксис остаётся ясным и близким к греческой структуре без излишней буквальности.
