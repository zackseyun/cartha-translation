id: LUK.12.12
reference: Luke 12:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: ru
  text: Ведь Святой Дух в тот самый час научит вас, что следует сказать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тот час». Греческое выражение подчёркивает именно тот момент, когда возникнет необходимость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим заверением и естественно звучит в современном русском контексте.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Святой Дух
  rationale: Общепринятое современное обозначение божественного Духа; сохраняет личный характер действующего субъекта.
- source_word: διδάξει
  choice: научит
  rationale: Точно передаёт будущее время и основное значение διδάσκω — дать знание о том, как следует поступить или что сказать.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передаёт форму второго лица множественного числа.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: в тот самый час
  rationale: Сохраняет усиление, выраженное αὐτῇ, и подчёркивает помощь непосредственно в нужный момент.
- source_word: ἃ
  choice: что
  rationale: Естественно передаёт содержание предстоящей речи без тяжеловесного буквального «то, что».
- source_word: δεῖ
  choice: следует
  rationale: Передаёт обусловленную обстоятельствами необходимость, не усиливая её до безусловного приказа.
- source_word: εἰπεῖν
  choice: сказать
  rationale: Наиболее естественный русский эквивалент в конструкции, указывающей на содержание ответа.
theological_decisions:
- issue: Характер действия Святого Духа
  choice: Святой Дух представлен личным действующим субъектом, который научит учеников
  alternative: Безличное божественное влияние или вдохновение
  rationale: Святой Дух является грамматическим субъектом активного глагола «научит»; перевод сохраняет это представление, не добавляя позднейших догматических формулировок.
- issue: Оттенок необходимости в δεῖ
  choice: что следует сказать
  alternative: что вы должны сказать
  rationale: Греческое δεῖ выражает необходимость; «следует» сохраняет её, но не превращает обещание помощи в прямое повеление. Возможен и более сильный вариант «должны».
translation_notes:
  register: Современный литературный русский язык; фраза краткая, ясная и dignified. Порядок слов сохраняет акцент на своевременности помощи, а «ведь» естественно связывает стих с предыдущим обещанием.
