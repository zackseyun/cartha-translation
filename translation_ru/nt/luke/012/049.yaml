translation:
  language: ru
  text: Я пришёл бросить огонь на землю — и как я хочу, чтобы он уже зажёгся![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и чего я хочу, если он уже зажжён?» Греческая фраза трудна для понимания; основной текст передаёт её вероятный идиоматический смысл как выражение сильного желания.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: огонь
  rationale: Сохраняет неистолкованный образ исходного текста; добавлять значение суда, очищения, Духа или разделения в основной текст не следует.
- source_word: ἦλθον
  choice: Я пришёл
  rationale: Естественно передаёт аорист в высказывании о цели и миссии Иисуса.
- source_word: βαλεῖν
  choice: бросить
  rationale: Передаёт конкретность и силу глагола βάλλω, не ослабляя образ до более общего «принести».
- source_word: ἐπὶ τὴν γῆν
  choice: на землю
  rationale: В данном широком по смыслу изречении γῆ естественно понимать как землю, а не как локальную страну или почву.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: и как Я хочу, чтобы он уже разгорелся!
  rationale: Передаёт вероятный идиоматический смысл трудной греческой фразы как сильное желание, сохраняя альтернативное буквальное понимание в сноске.
- source_word: ἤδη
  choice: уже
  rationale: Прямо передаёт временное наречие ἤδη.
- source_word: ἀνήφθη
  choice: разгорелся
  rationale: Естественно продолжает образ огня и передаёт значение «быть зажжённым, воспламениться»; русская конструкция с «чтобы» требует формы совершенного вида.
theological_decisions:
- issue: Значение образа огня
  choice: Сохранить слово «огонь» без истолкования метафоры.
  alternative: Передать как суд, очищение, Святого Духа или разделяющий кризис служения Иисуса.
  rationale: Сам стих не определяет образ однозначно; перевод должен сохранять его многозначность и богословское напряжение.
- issue: Смысл τί θέλω εἰ ἤδη ἀνήφθη
  choice: Передать как восклицание, выражающее сильное желание.
  alternative: 'Передать буквальным вопросом: «и чего Я хочу, если он уже разгорелся?»'
  rationale: Греческая фраза трудна и допускает более буквальный разбор, однако в контексте наиболее вероятен идиоматический смысл сильного желания; альтернативу следует указать в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. «Бросить огонь» сохраняет резкость исходного образа; тире естественно связывает цель прихода с последующим эмоциональным восклицанием.
