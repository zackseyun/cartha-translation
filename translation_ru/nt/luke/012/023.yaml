id: LUK.12.23
reference: Luke 12:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: ru
  text: Ведь жизнь[a] — больше, чем пища, и тело — больше, чем одежда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «душа»: греческое слово ψυχή может означать «жизнь», «самого человека» или «душу»; здесь контекст указывает прежде всего на жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ведь
  rationale: Вводит основание для предшествующего призыва не тревожиться; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: ψυχή
  choice: жизнь
  rationale: В контексте пищи, тревоги и телесных нужд слово обозначает жизнь человека, а не специально нематериальную душу; иной возможный смысл отмечен в сноске.
- source_word: πλεῖόν
  choice: больше, чем
  rationale: Сохраняет сравнительную конструкцию с родительным падежом и не уточняет сверх текста, идёт ли речь только о ценности или о более широком превосходстве.
- source_word: τροφή
  choice: пища
  rationale: Прямой и уместный в современном литературном русском эквивалент, соответствующий контексту питания.
- source_word: σῶμα
  choice: тело
  rationale: Стандартно и точно обозначает физическое тело в параллели с одеждой.
- source_word: ἔνδυμα
  choice: одежда
  rationale: Естественный современный эквивалент общего обозначения того, чем покрывают тело.
theological_decisions:
- issue: Значение ψυχή в наставлении о тревоге и Божьем попечении
  choice: «жизнь»
  alternative: «душа»
  rationale: Параллелизм «ψυχή — пища» и «тело — одежда» указывает здесь на земную жизнь и её поддержание. Такой перевод не отрицает иных значений ψυχή в других контекстах и не превращает стих в антропологическое утверждение о душе.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Повтор «больше, чем» сохранён в обеих частях ради явного параллелизма греческого текста; тире делает конструкцию естественной по-русски.
