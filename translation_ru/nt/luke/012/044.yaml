source:
  edition: SBLGNT
  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: ru
  text: 'Истинно говорю вам: он поставит его над всем своим имуществом[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над всем, что ему принадлежит».'
    reason: 'Лексическая альтернатива: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ может обозначать в широком смысле всё, чем хозяин владеет.'
lexical_decisions:
- source_word: ἀληθῶς
  choice: Истинно
  rationale: Наречие подчёркивает истинность и торжественность утверждения; «истинно» сохраняет характерную для речи Иисуса формулу и звучит достойно.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямо передаёт устойчивую формулу обращения, сохраняя настоящее время и авторитетный характер высказывания.
- source_word: ὅτι
  choice: ':'
  rationale: В русском языке содержание речи после формулы «говорю вам» естественно вводится двоеточием; смысл греческого союза ὅτι сохраняется без тяжеловесного «что».
- source_word: ἐπὶ
  choice: над
  rationale: Предлог с дательным падежом обозначает здесь власть и управление; «поставит над» естественно передаёт поручение надзора.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: всем своим имуществом
  rationale: Субстантивированное причастие обозначает всё принадлежащее хозяину. «Всё имущество» передаёт совокупность владений и естественно сочетается с конструкцией «поставить над».
- source_word: καταστήσει
  choice: поставит
  rationale: В данном контексте καθίστημι означает назначить или поставить кого-либо управлять. «Поставит над» ясно и естественно выражает это значение.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение мужского рода единственного числа относится к верному управляющему из ближайшего контекста и сохраняет грамматическую форму оригинала.
theological_decisions:
- issue: Мужской род местоимений в контексте притчи
  choice: Сохранить форму «его» и подразумеваемое подлежащее мужского рода «он»
  alternative: Использовать нейтральное обозначение лица
  rationale: Греческий текст говорит о персонажах притчи в мужском роде единственного числа. Сохранение этой формы точно передаёт повествовательный образ, не превращая его в утверждение об ограничении духовного применения по полу.
translation_notes:
  register: Современный литературный русский с сохранением торжественной формулы «Истинно говорю вам». Основная фраза краткая и естественная; двоеточие вместо буквального «что» соответствует русскому синтаксису прямого утверждения.
