base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: ru
  text: 'Говорю тебе: ты ни за что не выйдешь оттуда, пока не отдашь даже последнюю лепту[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «последнюю мелкую монету». Греческое слово λεπτόν обозначает монету очень малого достоинства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Говорю тебе
  rationale: Естественная для современного русского языка формула прямого обращения, сохраняющая настоящее время и личный характер высказывания.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ты ни за что не выйдешь
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание будущего действия; «ни за что не выйдешь» естественно передаёт его категоричность.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Точно и идиоматично передаёт значение удаления из указанного места.
- source_word: ἕως
  choice: пока не
  rationale: В русском языке эта конструкция естественно обозначает предел, до которого сохраняется отрицательно сформулированное положение.
- source_word: καὶ τὸ ἔσχατον
  choice: и последней
  rationale: 'Частица καί подчёркивает полноту уплаты: долг должен быть погашен вплоть до последней монеты. Русское «и последней» сохраняет этот акцент без утяжеления фразы.'
- source_word: λεπτόν
  choice: лепты
  rationale: «Лепта» — исторически точное и закрепившееся в русском языке название очень мелкой древней монеты; сноска разъясняет значение.
- source_word: ἀποδῷς
  choice: не отдашь
  rationale: Глагол означает выплатить или возвратить причитающееся. «Отдать» естественно для контекста долга и в сочетании с «последней лептой» передаёт завершённость расчёта.
theological_decisions:
- issue: Смысл образа заключения за долг
  choice: Сохранить образ заключения до полной уплаты долга, не уточняя его подразумеваемое значение.
  alternative: Истолковать слова как предупреждение лишь о земных правовых последствиях, как образ окончательного Божьего суда или как указание на посмертное очистительное наказание.
  rationale: Сам стих не называет, к чему именно относится этот образ. Буквальная и неинтерпретирующая передача сохраняет заложенную в тексте богословскую напряжённость и не привносит позднейших доктринальных выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Категоричность предупреждения сохранена, а исторический термин «лепта» пояснён в сноске.
