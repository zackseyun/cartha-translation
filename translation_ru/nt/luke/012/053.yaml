id: LUK.12.53
reference: Luke 12:53
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: ru
  text: 'Они разделятся: отец будет против сына, и сын — против отца; мать — против дочери, и дочь — против матери; свекровь[a] — против своей невестки[b], и невестка — против свекрови.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. слово может обозначать как свекровь, так и тёщу; здесь по-русски выбрано «свекровь» в соответствии с парой «невестка».
    reason: lexical_alternative
  - marker: b
    text: То же греч. слово в других контекстах может означать «невеста», но здесь родственная пара со свекровью указывает на невестку.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: разделятся
  rationale: Будущее пассивное по форме допускает «будут разделены», однако русское возвратное «разделятся» естественно передаёт возникшее внутри семьи разделение, не уточняя его деятеля.
- source_word: ἐπὶ
  choice: против
  rationale: В повторяющейся конструкции с членами семьи предлог выражает противостояние; «против» ясно и идиоматично передаёт этот смысл.
- source_word: πατήρ / υἱός
  choice: отец / сын
  rationale: Сохранены конкретные родственные отношения и взаимность противостояния.
- source_word: μήτηρ / θυγάτηρ
  choice: мать / дочь
  rationale: Сохранены конкретные родственные отношения и параллельная взаимность конструкции.
- source_word: πενθερά
  choice: свекровь
  rationale: В русском языке точный термин зависит от пола человека, чья мать имеется в виду. В паре с νύμφη в значении «невестка» традиционное и естественное соответствие — «свекровь», хотя греческое слово само по себе шире.
- source_word: νύμφη
  choice: невестка
  rationale: Хотя слово может означать «невеста», здесь взаимная пара с πενθερά требует значения родства по браку — «невестка».
- source_word: αὐτῆς
  choice: своей
  rationale: Возвратное притяжательное местоимение естественно указывает, что речь идёт о невестке названной свекрови.
theological_decisions:
- issue: Характер описанного разделения
  choice: Сохранено резкое описание взаимного семейного противостояния как следствия миссии Иисуса.
  alternative: Смягчить до общего упоминания семейных разногласий или представить это как одобрение вражды.
  rationale: Контекст говорит о разделении, которое возникнет даже между ближайшими родственниками. Перевод не ослабляет напряжение, но и не добавляет мысли, будто вражда сама по себе одобряется.
translation_notes:
  register: Современный литературный русский язык; двоеточие и эллиптические конструкции с тире сохраняют ритмичный перечень взаимных противопоставлений. Формулировка понятна широкому читателю и сохраняет напряжённость оригинала.
