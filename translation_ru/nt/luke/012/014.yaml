  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: ru
  text: 'Но Он ответил ему: «Человек, кто поставил Меня вашим судьёй или распределителем?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Человек
  rationale: Прямое обращение, сохраняющее некоторую дистанцию и лёгкую строгость греческого текста; более разговорное «друг» смягчило бы тон.
- source_word: κατέστησεν
  choice: поставил
  rationale: Передаёт назначение на определённую роль или должность без добавления не выраженного в тексте субъекта.
- source_word: κριτὴν
  choice: судьёй
  rationale: Обычный и точный эквивалент лица, уполномоченного выносить решение в споре.
- source_word: μεριστὴν
  choice: делителем
  rationale: Сохраняет конкретный образ лица, распределяющего или разделяющего имущество, и соответствует отличию этого слова от более общего «посредник» или «арбитр».
- source_word: ἐφ’ ὑμᾶς
  choice: над вами
  rationale: Формально сохраняет предложную конструкцию, выражающую власть или полномочия по отношению к спорящим сторонам; множественное число «вами» включает обоих участников спора.
theological_decisions:
- issue: Смысл риторического вопроса о назначении Иисуса
  choice: Сохранён вопрос без поясняющей вставки о том, кто именно мог бы Его назначить.
  alternative: «Кто назначил Меня разбирать ваши споры?»
  rationale: Исходный текст оставляет субъект назначения и более широкий богословский смысл вопроса неуточнёнными; перевод не должен превращать его в категорическое отрицание всякой судебной роли Иисуса.
translation_notes:
  register: Современный литературный русский с достоинством и близостью к структуре греческого текста. Местоимения, относящиеся к Иисусу, написаны с прописной буквы по принятой русской библейской традиции. «Делителем» несколько необычно по-русски, но намеренно сохраняет отдельную роль μεριστής и связь с просьбой о разделе наследства.
