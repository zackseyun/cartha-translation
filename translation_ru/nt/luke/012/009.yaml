  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: ru
  text: А кто отречётся от Меня перед людьми, от того отрекутся перед ангелами Божьими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «будет отвергнут»; греческий текст не называет того, кто совершит это действие.'
    reason: Уточняет, что «будет отвергнут» является смысловым вариантом, и сохраняет неназванного деятеля греческой пассивной конструкции.
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός
  choice: А кто отречётся
  rationale: Субстантивированное причастие обозначает всякого, кто совершит названное действие. Русская конструкция «кто отречётся» естественно передаёт общий принцип; союз «а» выражает противопоставление предыдущему стиху.
- source_word: με
  choice: от Меня
  rationale: Глагол «отречься» в современном русском языке управляет родительным падежом с предлогом «от»; местоимение прямо относится к Иисусу.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: перед людьми
  rationale: «Перед» кратко и естественно передаёт публичное действие в присутствии людей; «людьми» охватывает людей обоих полов и сохраняет противопоставление ангелам.
- source_word: ἀπαρνηθήσεται
  choice: от того отрекутся
  rationale: Будущее страдательное значение передано русской неопределённо-личной конструкцией, которая не называет деятеля. Повтор глагола «отречься» сохраняет смысловую и риторическую взаимность двух греческих однокоренных глаголов.
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: перед ангелами Божьими
  rationale: Естественная и торжественная русская формулировка, сохраняющая образ небесного свидетельства.
theological_decisions:
- issue: Кто именно отречётся от человека
  choice: Не называть субъекта действия, используя неопределённо-личное «отрекутся»
  alternative: «Сын Человеческий отречётся от него» или «Бог отречётся от него»
  rationale: В греческом тексте стоит пассив без названного деятеля. Контекст допускает вывод о Сыне Человеческом либо понимание как божественного пассива, однако сам стих этого не уточняет.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и легко понятной синтаксической формой. Заглавная буква в «Меня» соответствует принятой русской библейской орфографии при обозначении Христа; «Божьими» звучит современно и достойно.
