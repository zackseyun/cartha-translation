id: LUK.12.2
reference: Luke 12:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: ru
  text: Но нет ничего сокрытого, что не откроется,[a] и ничего тайного, что не станет известным.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что не будет раскрыто». Образ в греческом тексте противопоставляет сокрытое тому, что впоследствии открывается.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова могут относиться к любому будущему обнаружению сокрытого — как в нынешнее время, так и на последнем суде.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: нет ничего
  rationale: Естественно передаёт абсолютный охват отрицательного местоимения среднего рода.
- source_word: δὲ
  choice: Но
  rationale: Передаёт продолжение мысли с лёгким противопоставлением в контексте предостережения.
- source_word: συγκεκαλυμμένον
  choice: сокрытого
  rationale: Передаёт состояние того, что было скрыто или покрыто; в современном русском звучит естественно и достойно.
- source_word: ἀποκαλυφθήσεται
  choice: не откроется
  rationale: Будущая пассивная форма противопоставлена сокрытому; русская возвратная конструкция естественно выражает раскрытие без названного действующего лица.
- source_word: κρυπτὸν
  choice: тайного
  rationale: Сохраняет параллелизм и различает второе обозначение скрытого от первого.
- source_word: γνωσθήσεται
  choice: не станет известным
  rationale: Точно передаёт наступление будущей известности и звучит естественнее буквального «не будет познано».
theological_decisions:
- issue: Время и сфера раскрытия сокрытого
  choice: 'Общий принцип: ныне сокрытое впоследствии откроется и станет известным.'
  alternative: Исключительно раскрытие на последнем суде либо только разоблачение лицемерия уже в нынешнем веке.
  rationale: Будущие пассивные формы указывают на грядущее раскрытие, но сами по себе не уточняют ни срок, ни обстоятельства; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и параллелизм оригинала сохранены. Повтор «ничего» добавлен во второй части ради ясного и естественного русского синтаксиса.
