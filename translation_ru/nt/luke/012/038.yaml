    rationale: '«И если» выражает обычное условие и добавляет присоединительное «и», которого в данном стихе нет; повторённое κἄν требует передать усиленно-уступительный смысл: «Даже если ... или даже ...».'
  - severity: low
    issue: Сноска a неточно сформулирована и не отражает собственно альтернативу перевода.
    rationale: Формулировка «То есть во вторую часть ночи, когда несли стражу» является объяснением, не требуемым текстом, а «далее — в третью часть ночи» может создать впечатление последовательности. Уместнее отметить, что «стражу ночи» можно повторить и во второй части фразы.
  revised_text: Даже если он придёт во вторую стражу ночи[a] или даже в третью и застанет их такими, блаженны те слуги[b].
