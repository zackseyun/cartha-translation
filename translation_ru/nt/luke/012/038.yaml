- from: И если он придёт во вторую стражу ночи[a] или в третью и застанет их в таком состоянии, то блаженны те слуги[b].
  to: Даже если он придёт во вторую стражу ночи[a] или даже в третью и застанет их такими, блаженны те слуги[b].
  rationale: 'Исправлено только значение повторённого κἂν: «Даже если ... или даже ...» передаёт его уступительно-усилительную функцию. «Такими» сохраняет отсылку οὕτως к предшествующему описанию без добавления характеристики. Сноска о стражах приведена в соответствие с текстовой альтернативой и не вводит ненужных исторических уточнений.'
