base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: ru
  text: Даже если он придёт во вторую стражу ночи[a] или даже в третью и застанет их такими, блаженны те слуги[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с повторением: «во вторую стражу ночи или даже в третью стражу ночи».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «блаженны те». Речь идёт о слугах, упомянутых выше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: И если ... или
  rationale: Повторная условно-уступительная частица допускает смысл «даже если», но в русском контексте естественное «и если... или...» сохраняет присоединение к предыдущему стиху и неопределённость времени прихода.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: во вторую стражу ночи ... в третью
  rationale: φυλακή обозначает часть ночи, в течение которой несли караул. «Стража ночи» — понятное традиционное обозначение временного отрезка; во втором случае слово «ночь» не повторяется ради естественности.
- source_word: ἔλθῃ
  choice: он придёт
  rationale: Аорист конъюнктива в условной конструкции выражает неопределённое будущее событие; русское совершенное будущее передаёт это естественно.
- source_word: εὕρῃ οὕτως
  choice: застанет их в таком состоянии
  rationale: οὕτως отсылает к описанной выше готовности слуг. Дополненное по контексту «их» и нейтральное «в таком состоянии» передают эту отсылку, не конкретизируя её сверх текста.
- source_word: μακάριοί
  choice: блаженны
  rationale: «Блаженны» сохраняет библейский смысл особого благополучия и одобрения, тогда как «счастливы» могло бы звучать преимущественно как обозначение эмоции.
- source_word: ἐκεῖνοι
  choice: те слуги
  rationale: Буквально — «те»; существительное «слуги» восстановлено из непосредственного контекста, чтобы по-русски референт был ясен.
theological_decisions:
- issue: Уточнение референта ἐκεῖνοι
  choice: те слуги
  alternative: те
  rationale: Греческий текст содержит только указательное местоимение, однако оно явно отсылает к слугам из предыдущего контекста. Уточнение вынесено также в сноску, чтобы сохранить прозрачность по отношению к форме оригинала.
- issue: Смысл εὕρῃ οὕτως
  choice: застанет их в таком состоянии
  alternative: застанет их так
  rationale: Фраза сохраняет анафорическую отсылку, не добавляя прямо «бодрствующими» или «готовыми» и тем самым не сужая смысл, заданный контекстом.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Стража ночи» и «блаженны» сохранены как точные и узнаваемые термины; синтаксис сделан естественным для современного читателя.
