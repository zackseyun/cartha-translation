id: LUK.12.33
reference: Luke 12:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: ru
  text: Продайте своё имущество и подайте милостыню[a]. Приготовьте себе кошельки, которые не ветшают, — неистощимое сокровище на небесах[b], где вор не приближается и моль не уничтожает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздайте нуждающимся». Греческое слово обозначает дела милосердия, выраженные в помощи нуждающимся.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на небе». В греческом тексте стоит множественное число: «на небесах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Продайте
  rationale: Аористный императив передан прямым повелением совершенного вида; перевод не усиливает требование до обязательной полной ликвидации всего имущества.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: своё имущество
  rationale: Оборот обозначает принадлежащую адресатам собственность; «имущество» естественно и достаточно широко передаёт смысл.
- source_word: δότε ἐλεημοσύνην
  choice: раздайте милостыню
  rationale: Сохраняется конкретное значение помощи нуждающимся и формальная связь с существительным ἐλεημοσύνη; «раздайте» естественно сочетается с призывом распорядиться имуществом ради других.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Приготовьте себе
  rationale: Передаёт повеление и значение действия ради собственной пользы; по-русски звучит естественнее буквального «сделайте себе».
- source_word: βαλλάντια
  choice: кошельки
  rationale: Слово обозначает мешочки или сумки для денег; «кошельки» сохраняет конкретную метафору без архаизации.
- source_word: μὴ παλαιούμενα
  choice: которые не ветшают
  rationale: Глагол указывает на старение и изнашивание; «не ветшают» кратко сохраняет этот образ.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: неистощимое сокровище
  rationale: Передаёт сокровище, которое не иссякает и не утрачивается, сохраняя образ и силу определения.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Сохраняется множественное число греческого выражения; это также естественная русская библейская идиома.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: где вор не подбирается к нему
  rationale: «Подбирается» естественно передаёт приближение вора с недобрым намерением; местоимение явно связывает действие с сокровищем.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: и моль его не уничтожает
  rationale: Передано разрушительное действие моли; местоимение восполняет необходимое в русском языке дополнение, уже выраженное словом «сокровище».
theological_decisions:
- issue: Значение ἐλεημοσύνην в призыве распорядиться имуществом
  choice: раздайте милостыню
  alternative: раздайте нуждающимся
  rationale: Основной текст сохраняет традиционное и точное обозначение дел милосердия, а примечание раскрывает подразумеваемых получателей, не превращая призыв в отвлечённую благотворительность и не привнося более широкую экономическую программу.
- issue: Форма ἐν τοῖς οὐρανοῖς
  choice: на небесах
  alternative: на небе
  rationale: Множественное число оригинала сохранено как естественная для русского языка библейская идиома без догматического уточнения устройства небес.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конкретные образы кошельков, сокровища, вора и моли сохранены; синтаксис сделан ясным для обычного читателя.
