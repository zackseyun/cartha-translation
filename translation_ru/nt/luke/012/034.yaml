  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ru
  text: Ведь где ваше сокровище, там будет и ваше сердце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: где
  rationale: Прямо вводит придаточное места и естественно звучит в русском афористическом высказывании; «где бы ни» было бы несколько шире исходной формулировки.
- source_word: γάρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим наставлением естественнее для современного русского языка, чем книжное «ибо».
- source_word: θησαυρός
  choice: сокровище
  rationale: Сохраняет как прямой смысл ценного достояния, так и метафорический смысл того, что человек особенно ценит.
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет библейский образ внутреннего центра желаний, привязанностей и жизненной направленности, не сужая его до одной психологической способности.
- source_word: ἐκεῖ
  choice: там
  rationale: Сохраняет греческую соотносительную конструкцию «где… там…».
- source_word: καὶ
  choice: и
  rationale: 'Передаёт добавочное значение: сердце также оказывается там, где находится сокровище.'
- source_word: ἔσται
  choice: будет
  rationale: Сохраняет явное будущее время греческого текста и оттенок неизбежного результата или непреложной истины.
- source_word: ὑμῶν
  choice: ваше
  rationale: Передаёт форму второго лица множественного числа; согласование с существительными требует форм «ваше» в обоих случаях.
theological_decisions:
- issue: Антропологический смысл слова «сердце»
  choice: Сохранить «сердце» как библейское обозначение внутреннего центра привязанностей, стремлений и жизненной направленности человека.
  alternative: Передать толковательно как «желания», «помыслы» или «внутренний мир».
  rationale: Исречение говорит о том, что внутренняя направленность человека следует за тем, что он ценит. Слово «сердце» сохраняет смысловую ёмкость и литературно-богословскую преемственность, не устраняя многозначность образа.
translation_notes:
  register: Современный литературный русский язык с достоинством и афористической краткостью. «Ведь» естественно выражает пояснение; порядок слов сохраняет выразительный параллелизм «где… там…». Местоимение «ваше» ясно указывает на обращение к нескольким слушателям по контексту.
