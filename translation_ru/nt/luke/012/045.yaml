id: LUK.12.45
reference: Luke 12:45
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: ru
  text: 'Но если тот раб скажет в своём сердце[a]: «Мой господин медлит прийти», — и начнёт бить слуг и служанок[b], есть, пить и напиваться,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть «скажет про себя».
    reason: Пояснение идиомы «в своём сердце».
  - marker: b
    text: 'Возможный перевод: «рабов и рабынь».'
    reason: Греческие слова могут обозначать домашних слуг или рабов; мужская и женская формы различены.
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: В контексте домашней иерархии и полной подотчётности слово «раб» точнее передаёт зависимое положение персонажа, чем более мягкое «слуга».
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: в своём сердце
  rationale: Сохраняет образ греческого выражения и ясно передаёт внутреннюю, не высказанную вслух мысль.
- source_word: Χρονίζει … ἔρχεσθαι
  choice: медлит прийти
  rationale: Естественно передаёт продолжающуюся задержку, не добавляя идеи возвращения, которой в самом выражении нет.
- source_word: κύριός μου
  choice: мой господин
  rationale: Внутри притчи речь идёт о стоящем над рабом хозяине дома; «господин» сохраняет отношение власти и не превращает слово непосредственно в божественный титул.
- source_word: τύπτειν
  choice: бить
  rationale: Передаёт насильственное и, по контексту, не единичное обращение с подчинёнными.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: слуг и служанок
  rationale: Сохраняет явное различение мужской и женской групп и звучит естественно по-русски; возможный оттенок рабского статуса отмечен в сноске.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: есть, пить и напиваться
  rationale: Прямо и естественно воспроизводит последовательность трёх инфинитивов, включая состояние опьянения.
theological_decisions:
- issue: Значение κύριος в притче
  choice: господин
  alternative: Господь; хозяин
  rationale: На уровне повествования это глава домашнего хозяйства, а не прямое именование Бога или Мессии. «Господин» сохраняет заложенную в притче связь власти, не устраняя возможного более широкого применения образа.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга
  rationale: Контекст подчёркивает подчинённость, власть господина и последующий суд над рабом; «раб» точнее сохраняет социальную реальность греческого слова.
- issue: Статус лиц, обозначенных παῖδας и παιδίσκας
  choice: слуг и служанок
  alternative: рабов и рабынь
  rationale: Эти слова допускают значения домашних слуг или рабов. Основной текст использует естественную русскую пару, а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сохраняет незавершённость стиха, поскольку условное предложение продолжается в следующем стихе. Формулировки ясны для обычного читателя без конфессионально окрашенной терминологии.
