id: LUK.12.37
reference: Luke 12:37
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: ru
  text: 'Блаженны те рабы, которых господин[a], придя, найдёт бодрствующими. Истинно говорю вам: он подпояшется[b], разместит их за столом[c] и, подойдя, будет служить им.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь». Греческое κύριος может обозначать и господина в домашнем хозяйстве, и Господа как титул.'
    reason: lexical_alternative
  - marker: b
    text: То есть приготовится служить, подобрав и закрепив поясом длинную одежду.
    reason: cultural_note
  - marker: c
    text: Греческий глагол означает разместить для трапезы полулёжа, как было принято во время трапезы.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Сохраняет торжественную форму макаризма и его религиозный смысл; «счастливы» звучало бы более субъективно.
- source_word: δοῦλοι
  choice: рабы
  rationale: В образе домашнего хозяйства явно выражено подчинённое положение по отношению к господину; «слуги» возможно, но ослабляет социальную сторону образа.
- source_word: κύριος
  choice: господин
  rationale: В непосредственном сюжете притчи речь идёт о хозяине рабов. Написание со строчной буквы сохраняет образный уровень, не устраняя возможной отсылки к Господу.
- source_word: γρηγοροῦντας
  choice: бодрствующими
  rationale: Передаёт как буквальное отсутствие сна, так и подразумеваемую бдительность и готовность.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Истинно говорю вам
  rationale: Устоявшаяся, понятная и близкая к форме греческого текста передача усилительной формулы.
- source_word: περιζώσεται
  choice: подпояшется
  rationale: Сохраняет конкретный древний образ приготовления к работе и не вводит в основной текст развёрнутое толкование.
- source_word: ἀνακλινεῖ αὐτούς
  choice: возложит их за стол
  rationale: Глагол обозначает размещение полулёжа для трапезы; уточнение «за стол» делает трапезный контекст понятным современному читателю.
- source_word: παρελθὼν
  choice: подойдя
  rationale: Естественно передаёт движение господина к находящимся за столом людям ради обслуживания.
- source_word: διακονήσει αὐτοῖς
  choice: станет служить им
  rationale: Прямо передаёт практическое, в данном контексте застольное, служение без излишне церковной окраски.
theological_decisions:
- issue: Передача κύριος в притче с возможным христологическим звучанием
  choice: господин
  alternative: Господь
  rationale: Непосредственная бытовая сцена требует значения «господин», тогда как примечание сохраняет возможное более широкое звучание. Это не заставляет читателя заранее отождествлять персонажа притчи с Иисусом и не исключает такого прочтения.
- issue: Передача δοῦλος в иерархическом домашнем контексте
  choice: раб
  alternative: слуга
  rationale: 'Статус зависимого человека существен для парадоксального переворота ролей: господин сам обслуживает рабов. Более мягкое «слуга» затемнило бы этот контраст.'
- issue: Парадокс служащего господина
  choice: 'сохранён буквально: «станет служить им»'
  alternative: обслужит их за столом
  rationale: Более широкая формулировка сохраняет одновременно конкретный застольный смысл и богословское напряжение образа, не ограничивая его пояснительным пересказом.
translation_notes:
  register: Современный литературный русский с торжественной библейской интонацией. «Блаженны» и «Истинно говорю вам» сохраняют узнаваемую форму изречения; редкое «подпояшется» оставлено ради предметного образа и разъяснено в примечании. Порядок действий и резкий переворот ролей сохранены.
