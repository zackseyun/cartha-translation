review_pass:
  verdict: revise
  source_fidelity: 'В целом порядок образов и смысл греческого текста переданы верно: бодрствующие рабы, господин подпоясывается, размещает их для трапезы и сам им служит. Однако «возложит их за стол» не соответствует современному русскому употреблению и создаёт неверную ассоциацию с физическим «возложением»; это неудачная передача ἀνακλινεῖ.'
  naturalness: «Блаженны», «Истинно говорю вам» и «подпояшется» уместны в современном литературном русском с библейской торжественностью. «Разместит их за столом» естественно и ясно; примечание сохраняет существенную деталь о возлежании во время трапезы.
  terminology: «Рабы» адекватно передаёт δοῦλοι в данной домашней сцене. «Господин» — естественное контекстуальное значение κύριος; сноска корректно отмечает возможность титульного «Господь». «Будет служить им» точно передаёт διακονήσει без излишней конфессиональной окраски.
  issues:
  - severity: medium
    issue: Неестественная и семантически неточная формулировка «возложит их за стол».
    rationale: ἀνακλινεῖ означает распорядиться, чтобы люди расположились/возлегли для трапезы. Русское «возложит их» обычно означает положить на что-либо либо возложить обязанность и не является нормальным способом сказать «разместит гостей за столом».
  - severity: low
    issue: Сноска c ошибочно называет «возложит их» буквальным переводом.
    rationale: Такой русский оборот не является пригодным буквальным соответствием греческому ἀνακλινεῖ; примечание должно объяснять значение глагола, не закрепляя неудачную кальку.
  - severity: low
    issue: «Станет служить им» может иметь оттенок начала действия.
    rationale: Будущее διακονήσει нейтральнее передаётся формой «будет служить им».
