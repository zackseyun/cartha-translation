- from: 'Блаженны те рабы, которых господин[a], придя, найдёт бодрствующими. Истинно говорю вам: он подпояшется[b], возложит их за стол[c] и, подойдя, станет служить им.'
  to: 'Блаженны те рабы, которых господин[a], придя, найдёт бодрствующими. Истинно говорю вам: он подпояшется[b], разместит их за столом[c] и, подойдя, будет служить им.'
  rationale: Исправлена неестественная калька при передаче ἀνακλινεῖ и связанная с нею сноска. «Разместит их за столом» передаёт действие господина и трапезный контекст, а сноска сохраняет исторически важную деталь о возлежании. Будущее «будет служить» точнее передаёт форму διακονήσει.
