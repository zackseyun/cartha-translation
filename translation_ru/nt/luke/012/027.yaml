reference: Luke 12:27
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: ru
  text: 'Обратите внимание на лилии[a], как они растут: они не трудятся и не прядут. Но говорю вам: даже Соломон во всей своей славе[b] не был одет, как одна из них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «полевые цветы», или просто «цветы»; по-гречески буквально «лилии».
    reason: lexical_alternative
  - marker: b
    text: Или «во всём своём великолепии».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Обратите внимание
  rationale: Аористный императив призывает не просто взглянуть, а внимательно рассмотреть и осмыслить; это выражение естественно передаёт такой призыв по-русски.
- source_word: τὰ κρίνα
  choice: лилии
  rationale: κρίνα непосредственно обозначает лилии; более общее «цветы» без необходимости расширяло бы значение исходного слова.
- source_word: πῶς αὐξάνει
  choice: как они растут
  rationale: При подлежащем среднего рода во множественном числе греческий глагол стоит в единственном числе, тогда как русская норма требует множественного; πῶς сохраняется как «как».
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: они не трудятся и не прядут
  rationale: κοπιάω обозначает тяжёлый труд, а νήθω — прядение волокна или нити; краткая пара сохраняет образ изготовления одежды.
- source_word: λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: δέ вводит умеренное противопоставление и переход к выводу; «но» естественно передаёт риторический поворот.
- source_word: οὐδὲ Σολομὼν
  choice: даже Соломон
  rationale: 'οὐδέ здесь усиливает отрицательное сравнение: даже прославленный своим великолепием царь не мог сравниться с лилией.'
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: во всей своей славе
  rationale: δόξα в контексте означает царское великолепие, однако «слава» остаётся понятной и сохраняет более широкий библейский смысл слова.
- source_word: περιεβάλετο
  choice: не был одет
  rationale: Форма допускает среднее или пассивное понимание; русское «был одет» естественно сохраняет образ одежды, не уточняя действующее лицо.
- source_word: ὡς ἓν τούτων
  choice: как одна из них
  rationale: Сравнение передано прямо; местоимение женского рода ясно отсылает к лилиям.
theological_decisions:
- issue: Конкретность образа растений
  choice: Сохранено конкретное «лилии».
  alternative: «цветы» или «полевые цветы»
  rationale: Греческий текст прямо называет κρίνα; богословская мысль о Божьей заботе не требует обобщать исходное обозначение.
- issue: Значение δόξα в описании Соломона
  choice: «слава»
  alternative: «великолепие»
  rationale: «Слава» сохраняет лексическую и библейскую многозначность, а примечание поясняет уместный здесь оттенок царского великолепия.
translation_notes:
  register: Современный литературный русский язык; обращение ясное и достойное, без архаизмов. Синтаксис следует движению греческой фразы, но согласование и порядок слов адаптированы к естественной русской речи. Маркер [b] поставлен непосредственно после слова «славе», к которому относится примечание.
