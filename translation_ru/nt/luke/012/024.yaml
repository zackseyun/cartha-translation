  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: ru
  text: 'Обратите внимание на воронов[a]: они не сеют и не жнут; нет у них ни кладовой, ни амбара[b], а Бог кормит их. Насколько же вы ценнее птиц[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Внимательно посмотрите на воронов»; или: «Поразмышляйте о воронах».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте употреблены два разных слова для мест хранения: ταμεῖον — «кладовая», ἀποθήκη — «амбар» или «хранилище».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Насколько же больше вы значите, чем птицы!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Обратите внимание
  rationale: Аористный императив призывает не просто мельком посмотреть, а внимательно рассмотреть и осмыслить пример воронов. Выражение естественно для современного русского языка.
- source_word: τοὺς κόρακας
  choice: воронов
  rationale: κόραξ обозначает именно ворона; конкретный образ сохранён без обобщения до «птиц».
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν
  choice: они не сеют и не жнут
  rationale: Сохранены парные земледельческие глаголы и краткий параллелизм греческого текста.
- source_word: ταμεῖον
  choice: кладовой
  rationale: Слово обозначает внутреннее помещение для хранения. «Кладовая» позволяет отличить его от следующего ἀποθήκη.
- source_word: ἀποθήκη
  choice: амбара
  rationale: В данном сельскохозяйственном контексте речь идёт о месте хранения урожая. «Амбар» естественно сочетается с «кладовой» и сохраняет два разных термина оригинала.
- source_word: τρέφει
  choice: кормит
  rationale: Простое настоящее время передаёт постоянную Божью заботу о птицах без смыслового расширения.
- source_word: πόσῳ μᾶλλον
  choice: Насколько же
  rationale: Естественно передаёт усиленное сопоставление от меньшего к большему.
- source_word: διαφέρετε
  choice: вы ценнее
  rationale: Хотя глагол буквально может означать «отличаться» или «превосходить», контекст указывает на превосходство в ценности или значимости. Формулировка сохраняет сравнительный смысл.
- source_word: τῶν πετεινῶν
  choice: птиц
  rationale: πετεινόν — общее обозначение птиц; после конкретного упоминания воронов Иисус расширяет сравнение.
theological_decisions:
- issue: Божье провидение как основание сравнения
  choice: а Бог кормит их
  alternative: и Бог питает их
  rationale: Перевод прямо сохраняет утверждение о деятельной Божьей заботе, не превращая его в более широкое доктринальное объяснение.
- issue: Сравнительная ценность людей и птиц
  choice: Насколько же вы ценнее птиц!
  alternative: Насколько же больше вы значите, чем птицы!
  rationale: В контексте увещания не тревожиться διαφέρετε выражает превосходство в ценности, а не просто различие. Восклицательная форма передаёт риторическую силу фразы, формально не имеющей вопросительного местоимения.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Сохранены конкретный образ воронов, парный земледельческий оборот и различие двух мест хранения. Финальное восклицание передаёт риторическую силу греческого сравнения.
