  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: ru
  text: Разве не продают пять воробьёв за два ассария? И ни один из них не забыт Богом[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за две мелкие медные монеты»; ассарий — мелкая римская медная монета.'
    reason: cultural_note
  - marker: b
    text: 'Или: «ни один из них не упущен из виду у Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: воробьёв
  rationale: Уменьшительная форма обозначает мелких птиц и в данном контексте естественно передаётся традиционным и конкретным словом «воробьи».
- source_word: πωλοῦνται
  choice: продают
  rationale: Греческая форма имеет пассивное значение «продаются», однако неопределённо-личная конструкция «продают» естественнее в современном русском и сохраняет смысл.
- source_word: ἀσσαρίων δύο
  choice: за два ассария
  rationale: Сохранено название древнеримской мелкой медной монеты, чтобы не подменять её неточным современным денежным эквивалентом; пояснение дано в сноске.
- source_word: ἐπιλελησμένον
  choice: не забыт
  rationale: Перфектное причастие выражает состояние забвения; «не забыт» близко к лексическому значению и не усиливает текст до развёрнутого утверждения о промысле.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: пред Богом
  rationale: Краткая, естественная и торжественная передача пространственно-реляционного оборота, сохраняющая образ пребывания в Божьем поле зрения.
- source_word: οὐχὶ ... ;
  choice: Разве не ...?
  rationale: «Разве не» естественно передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: И ни один из них
  rationale: Буквальное соединительное «и» сохраняет структуру греческого текста, а «ни один» идиоматично выражает отрицание применительно даже к одной птице.
theological_decisions:
- issue: Язык Божьей памяти и заботы
  choice: ни один из них не забыт пред Богом
  alternative: ни один из них не упущен из виду Богом
  rationale: Выбранная формулировка сохраняет прямое значение глагола и утверждает Божье внимательное знание, не разворачивая его в более широкое доктринальное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Пред Богом» сохраняет достоинство и компактность оригинала; название монеты оставлено в тексте и пояснено в сноске.
