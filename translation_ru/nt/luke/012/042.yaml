  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: ru
  text: 'И сказал Господь: «Кто же тот верный и благоразумный управляющий, которого господин поставит над его домашними слугами, чтобы он вовремя выдавал им пищевую норму[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «меру зерна» — отмеренную порцию пищи, полагавшуюся каждому слуге.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Господь / господин
  rationale: В словах повествователя «Господь» обозначает Иисуса; внутри образного вопроса то же греческое слово относится к хозяину дома и естественно передаётся как «господин».
- source_word: πιστός
  choice: верный
  rationale: Передаёт надёжность человека, которому доверена ответственность.
- source_word: οἰκονόμος
  choice: управляющий
  rationale: Обозначает человека, которому поручено управление домом и его хозяйством; это ясно и естественно для современного русского читателя.
- source_word: φρόνιμος
  choice: благоразумный
  rationale: Передаёт практическую мудрость, рассудительность и здравое суждение в исполнении поручения.
- source_word: καταστήσει
  choice: поставит
  rationale: В данном контексте означает назначение на ответственное положение; «поставит над» сохраняет образ и естественно звучит по-русски.
- source_word: θεραπείας
  choice: слуги
  rationale: Здесь слово обозначает совокупность домашней прислуги или челяди, находящейся под надзором управляющего.
- source_word: ἐν καιρῷ
  choice: вовремя
  rationale: Кратко и естественно передаёт смысл выдачи пищи в надлежащий, установленный срок.
- source_word: σιτομέτριον
  choice: положенная пища
  rationale: Речь идёт об отмеренной норме пищи, выдаваемой каждому; основной текст передаёт функцию выражения, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Повторное употребление κύριος в повествовательной рамке и внутри образного вопроса
  choice: «Господь» об Иисусе; «господин» о хозяине дома
  alternative: «Господь» в обоих случаях
  rationale: Различение соответствует двум уровням повествования и русскому словоупотреблению, не устраняя смысловой связи, создаваемой одним и тем же греческим словом.
- issue: Характер вопроса о верном управляющем
  choice: Сохранён открытый риторический вопрос без уточнения личности или церковной должности управляющего
  alternative: Истолковать управляющего как конкретного церковного служителя
  rationale: Сам стих не называет конкретную должность и оставляет образ открытым; перевод не должен вводить конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Управляющий» понятнее современному читателю, чем архаичное «домоправитель»; «благоразумный» сохраняет оттенок практической мудрости. Все местоименные связи выражены естественно, без добавления толкований.
