id: LUK.12.48
reference: Luke 12:48
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: ru
  text: А тот, кто не знал, но совершил то, за что полагались удары, получит немного ударов. От всякого, кому много дано, много и потребуют; и с того, кому многое доверили, спросят ещё больше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: тот, кто не знал
  rationale: Субстантивированное причастие передано естественной русской относительной конструкцией; сохраняется отсутствие знания без добавочного суждения о виновности.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: сделал то, что заслуживает ударов
  rationale: Передаёт поступки, заслуживающие наказания, и сохраняет конкретный образ ударов без архаической тяжеловесности.
- source_word: δαρήσεται ὀλίγας
  choice: получит немного ударов
  rationale: Глагол δέρω прямо обозначает избиение, а подразумеваемое существительное согласуется с ранее упомянутыми πληγῶν; русский оборот естественно передаёт малое число ударов.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: от всякого, кому много дано
  rationale: Сохраняет обобщённую формулу и пассивную форму «дано», не уточняя не названного в тексте дающего.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: много и потребуют
  rationale: В контексте ответственности ζητέω означает требовать; неопределённо-личная русская конструкция естественно выражает требование с человека.
- source_word: παρέθεντο
  choice: доверили
  rationale: В данном контексте παρατίθημι означает передать под ответственность, доверить попечению.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: спросят ещё больше
  rationale: Оборот «с того ... спросят» передаёт требование отчёта и сохраняет отличие αἰτέω от предшествующего ζητέω; «ещё больше» выражает сравнительное περισσότερον.
theological_decisions:
- issue: Характер образа наказания
  choice: Сохранить конкретный образ ударов и различие в их числе.
  alternative: Передать обобщённо как «наказание» либо конкретизировать как порку плетью.
  rationale: Текст использует образ телесного наказания в притче, но не называет орудия и не раскрывает здесь точный механизм суда.
- issue: Субъект действий в заключительной части
  choice: Сохранить неопределённый субъект в формах «доверили», «потребуют», «спросят».
  alternative: Прямо назвать Бога или людей субъектом этих действий.
  rationale: В греческом употреблено неопределённое третье лицо множественного числа, поэтому уточнение субъекта выходило бы за пределы текста.
- issue: Соотношение знания и ответственности
  choice: Передать меньшую меру наказания незнавшего, не превращая незнание в полное оправдание.
  alternative: Истолковать незнание как снимающее вину либо подробно определить степени посмертного наказания.
  rationale: Стих одновременно говорит о наказуемости поступка и о различной мере ответственности; это напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством притчевого изречения. Параллелизм двух заключительных частей сохранён, а неопределённо-личные формы позволяют не вводить отсутствующего в греческом явно названного деятеля.
