  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: ru
  text: господин того раба придёт в день, когда тот его не ожидает, и в час, которого не знает, рассечёт его надвое[a] и определит ему участь среди неверных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые понимают это выражение в переносном смысле: «жестоко накажет его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с неверующими».'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: господин
  rationale: В сочетании «господин того раба» слово обозначает хозяина в рамках притчи, а не служит прямым христологическим титулом.
- source_word: δοῦλος
  choice: раб
  rationale: Слово сохраняет выраженное в контексте отношение подчинённости и принадлежности хозяину; «слуга» неоправданно смягчило бы его.
- source_word: ἥξει
  choice: придёт
  rationale: Будущая форма естественно обозначает приход хозяина и хорошо звучит в контексте предостережения.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: в день, когда тот его не ожидает
  rationale: Местоимение «тот» устраняет возможную неясность субъекта, а «его» естественно восполняет подразумеваемый объект ожидания — господина.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: в час, которого не знает
  rationale: Перевод сохраняет различие между отсутствием ожидания в первой фразе и отсутствием знания во второй.
- source_word: διχοτομήσει
  choice: рассечёт его надвое
  rationale: Передаёт буквальное и резкое значение глагола — разделить на две части — не ослабляя образ суда; возможное идиоматическое понимание вынесено в сноску.
- source_word: τὸ μέρος αὐτοῦ
  choice: определит ему долю
  rationale: μέρος буквально означает «часть, доля»; сочетание с «определит» естественно передаёт назначенный человеку удел.
- source_word: ἀπίστων
  choice: неверными
  rationale: В контексте притчи слово прежде всего указывает на тех, кто оказался неверен, при этом русское «неверные» до некоторой степени сохраняет связь с отсутствием веры; более явная альтернатива дана в сноске.
- source_word: θήσει
  choice: определит
  rationale: Здесь τίθημι означает назначить человеку место или удел; «определит» передаёт судебный оттенок без тяжеловесности.
theological_decisions:
- issue: Следует ли буквально передавать образ наказания или понимать его как идиому сурового наказания
  choice: 'Сохранить в основном тексте буквальный образ: «рассечёт его надвое»'
  alternative: «жестоко накажет его»
  rationale: Греческий глагол создаёт намеренно резкий образ суда. Его смягчение в основном тексте устранило бы силу предостережения, однако идиоматическое понимание остаётся возможным и отмечено в сноске.
- issue: Означает ли ἀπίστων неверных своему долгу или неверующих
  choice: «с неверными»
  alternative: «с неверующими»
  rationale: Непосредственный контекст говорит о верности раба своему господину, но слово допускает и значение неверия в эсхатологическом контексте. Альтернативу следует сохранить, не снимая богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством и резкостью, соответствующей предостережению. «Раб» сохраняет социальную реальность образа, а синтаксис остаётся ясным для обычного читателя.
