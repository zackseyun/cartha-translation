  text: 'И он рассуждал про себя: «Что мне делать? Ведь мне некуда складывать свой урожай».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: рассуждал
  rationale: Имперфект передаёт продолжавшееся внутреннее обдумывание, а «рассуждал» сохраняет оттенок взвешивания и расчёта.
- source_word: ἐν ἑαυτῷ
  choice: про себя
  rationale: Естественное современное выражение для внутренней речи, не предполагающее, что слова были произнесены вслух.
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Содержание внутреннего рассуждения естественно вводится в русском языке прямой речью; отдельное «говоря» было бы тяжеловесным.
- source_word: Τί ποιήσω
  choice: Что мне делать?
  rationale: Передаёт делиберативный аорист-конъюнктив как естественный вопрос о предстоящем решении.
- source_word: ὅτι
  choice: отдельное поясняющее предложение
  rationale: Причинная связь сохраняется последовательностью «Что мне делать? Мне некуда...», которая естественна для русской внутренней речи.
- source_word: οὐκ ἔχω ποῦ
  choice: мне некуда
  rationale: Идиоматично и точно передаёт отсутствие места.
- source_word: συνάξω
  choice: собрать
  rationale: Сохраняет основное значение глагола «собирать вместе»; контекст дальнейшего хранения раскрывается соседними стихами.
- source_word: τοὺς καρπούς μου
  choice: мой урожай
  rationale: В сельскохозяйственном контексте καρποί означает полученную продукцию или урожай; «урожай» ясно и естественно, без узкого значения слова «плоды».
