review_pass:
  verdict: revise
  source_fidelity: Смысл внутреннего deliberative рассуждения, вопрос «что мне делать?» и сельскохозяйственное значение καρποί в целом переданы верно. Однако «Мне некуда собрать мой урожай» в русском языке звучит неестественно и может означать отсутствие места для самой жатвы, тогда как ποῦ συνάξω обозначает отсутствие места, куда можно собрать/сложить урожай. Причинное ὅτι также лучше выразить явно.
  naturalness: «Рассуждал про себя» уместно в современном литературном регистре. Формулировка «некуда собрать урожай» требует замены на естественное выражение с направлением хранения или складывания.
  terminology: «Урожай» — точная и естественная передача τοὺς καρπούς μου в данном контексте. «Свой» естественнее «мой» при субъектном отнесении в русском предложении.
  issues:
  - severity: medium
    issue: Неестественное и потенциально двусмысленное «Мне некуда собрать мой урожай».
    rationale: Греческое οὐκ ἔχω ποῦ συνάξω означает, что у человека нет места, куда поместить собранный урожай. Русское «некуда собрать» не вполне идиоматично; «некуда складывать» ясно передаёт направленность действия и не добавляет чуждого смыслу содержания.
  - severity: low
    issue: Причинная связь ὅτι оставлена только подразумеваемой.
    rationale: Два коротких вопросительных/повествовательных предложения возможны, но частица «ведь» естественно и кратко сохраняет выраженную в оригинале причинную связь.
