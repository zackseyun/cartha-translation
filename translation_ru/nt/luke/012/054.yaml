  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: ru
  text: 'Он также говорил собравшимся: «Когда вы видите, что на западе поднимается облако, вы сразу говорите: „Будет ливень[a]“, — и так и бывает».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойдёт дождь». Греческое слово ὄμβρος может обозначать как дождь вообще, так и сильный дождь, ливень.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт продолжающуюся или фоновую речь; русское несовершенное прошедшее естественно сохраняет этот аспект.
- source_word: δὲ καὶ
  choice: также
  rationale: Передаёт добавочное значение καί, тогда как слабое δέ не требует отдельного выражения в русском контексте.
- source_word: τοῖς ὄχλοις
  choice: народу
  rationale: Хотя греческое слово стоит во множественном числе, в современном русском обращение к собравшимся естественно передаётся собирательным словом «народ»; значение множества слушателей сохраняется.
- source_word: Ὅταν ἴδητε
  choice: Когда вы видите
  rationale: Сочетание ὅταν с аористом сослагательного наклонения выражает типичное повторяющееся условие; настоящее время по-русски естественно передаёт обобщённость.
- source_word: νεφέλην ἀνατέλλουσαν
  choice: поднимается туча
  rationale: «Поднимается» сохраняет образ ἀνατέλλουσαν, а «туча» в погодном контексте естественнее нейтрального «облако» и не добавляет больше, чем подразумевает последующее ожидание дождя.
- source_word: ἐπὶ δυσμῶν
  choice: на западе
  rationale: Передаёт наблюдаемое положение облака у западного горизонта, не устраняя возможный оттенок движения с запада.
- source_word: εὐθέως
  choice: сразу
  rationale: Современный и естественный эквивалент со значением немедленности.
- source_word: Ὄμβρος
  choice: ливень
  rationale: Слово может обозначать дождь вообще либо сильный дождь; «ливень» кратко и конкретно передаёт более интенсивный оттенок, а более широкое значение отмечено в сноске.
- source_word: ἔρχεται
  choice: будет
  rationale: В русском прогноз погоды естественно формулируется будущим временем; оно передаёт ближайшее наступление дождя.
- source_word: γίνεται οὕτως
  choice: так и бывает
  rationale: Настоящее время и οὕτως передают регулярно подтверждающийся результат, а не только единичное событие.
