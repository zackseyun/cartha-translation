  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: ru
  text: Ведь ко всему этому стремятся народы мира[a], но ваш Отец знает, что вы нуждаетесь во всём этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язычники». Греческое слово может означать как «народы», так и «язычников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα γὰρ πάντα
  choice: Ведь ко всему этому
  rationale: Сочетание ταῦτα ... πάντα указывает на перечисленные в контексте жизненные нужды. Русское «ко всему этому» естественно связано с глаголом «стремятся», а γάρ передано словом «ведь».
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: народы мира[a]
  rationale: ἔθνη может обозначать как «народы», так и «язычников». Основной текст сохраняет широкое и буквальное значение, а возможный конфессионально-этнический оттенок отмечен в сноске.
- source_word: ἐπιζητοῦσιν
  choice: стремятся
  rationale: ἐπιζητέω выражает деятельное, настойчивое искание. «Стремятся» естественно передаёт направленность и интенсивность действия без разговорного оттенка выражения «гонятся за».
- source_word: ὑμῶν ... ὁ πατήρ
  choice: ваш Отец
  rationale: Передано ровно то, что присутствует в греческом тексте; определение «Небесный» не добавляется из параллельного места.
- source_word: οἶδεν
  choice: знает
  rationale: Формально перфектная форма οἶδα имеет настоящее значение и естественно передаётся глаголом «знает».
- source_word: χρῄζετε τούτων
  choice: вы нуждаетесь в этом
  rationale: Передаёт значение нужды и сохраняет повторное указание на те же предметы, выраженное греческим τούτων.
theological_decisions:
- issue: Противопоставление стремлений народов и сыновнего доверия учеников
  choice: Сохранить «народы мира» и «ваш Отец» без поясняющего расширения
  alternative: Перевести ἔθνη как «язычники» и/или добавить «Небесный» перед словом «Отец»
  rationale: Так сохраняется заложенное в стихе противопоставление без сужения значения ἔθνη и без внесения слов из параллельной традиции.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный, без архаизмов. «Стремятся» выбрано вместо более разговорного «гонятся», при этом сохранена активность, выраженная ἐπιζητοῦσιν.
