source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: ru
  text: Не бойся, малое стадо, потому что ваш Отец благоволил дать вам Царство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Царство» может также означать «царствование» или «владычество», то есть осуществление Божьей царской власти; оно может указывать как на Божье правление, так и на реальность, даруемую Его народу.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Не бойся
  rationale: Запрет с μή и формой настоящего времени передан прямо и естественно; единственное число соответствует греческому обращению к стаду как к единому целому.
- source_word: τὸ μικρὸν ποίμνιον
  choice: малое стадо
  rationale: Сохраняются пастырская метафора, обращение и оттенок немногочисленности; «малое» звучит в данном библейском образе естественнее и теплее, чем «небольшое».
- source_word: ὅτι
  choice: потому что
  rationale: Союз явно вводит основание призыва не бояться.
- source_word: εὐδόκησεν
  choice: благоволил
  rationale: Передаёт благую волю и благосклонное желание Отца, не сводя глагол ни только к эмоции, ни к техническому понятию предопределения.
- source_word: ὁ πατὴρ ὑμῶν
  choice: ваш Отец
  rationale: Точно передаёт греческий текст без добавления отсутствующего определения «Небесный»; прописная буква указывает на Бога в соответствии с русской библейской традицией.
- source_word: δοῦναι ὑμῖν
  choice: дать вам
  rationale: Прямая и естественная передача инфинитива δίδωμι с дательным местоимением.
- source_word: τὴν βασιλείαν
  choice: Царство
  rationale: Сохраняет привычное и ёмкое библейское обозначение, способное охватывать и царское правление Бога, и принадлежащую его народу реальность Царства.
theological_decisions:
- issue: Смысл βασιλεία
  choice: Царство
  alternative: царствование / владычество
  rationale: «Царство» сохраняет традиционную широту выражения и не ограничивает его только территорией либо только осуществлением царской власти; возможный динамический смысл пояснён в сноске.
- issue: Смысл εὐδόκησεν применительно к воле Бога
  choice: благоволил
  alternative: пожелал по Своей благости / решил
  rationale: Выбранный вариант выражает благосклонную, благую волю Отца, но не вносит в текст более узкого доктринального утверждения о предвечном решении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Благоволил» сохраняет достоинство речи и положительный оттенок εὐδόκησεν; синтаксис остаётся ясным для обычного читателя.
