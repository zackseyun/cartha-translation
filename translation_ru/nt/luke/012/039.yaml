  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: ru
  text: 'Но знайте: если бы хозяин дома знал, в который час придёт вор, то не позволил бы проломить стену своего дома.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы его дом был прокопан»; имеется в виду проникновение через пролом в стене дома.'
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Но знайте
  rationale: Императив настоящего времени передан прямым и естественным русским повелением «знайте»; δέ обозначено союзом «но», связывающим изречение с предшествующим призывом к бдительности.
- source_word: ὅτι
  choice: ':'
  rationale: Содержание того, что следует знать, естественно вводится в русском языке двоеточием, без тяжеловесного «что» перед условным предложением.
- source_word: ὁ οἰκοδεσπότης
  choice: хозяин дома
  rationale: Передаёт главу и распорядителя дома, не сводя значение к современному юридическому понятию собственника жилья.
- source_word: ποίᾳ ὥρᾳ
  choice: в который час
  rationale: Сохраняет конкретность ὥρα и мотив своевременной бдительности, оставаясь понятным современному читателю.
- source_word: ὁ κλέπτης ἔρχεται
  choice: придёт вор
  rationale: Греческое настоящее в речи о предполагаемом приходе естественно передаётся русским будущим временем; это не устраняет условного, контрфактического характера всего высказывания.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: не позволил бы
  rationale: Сочетание отрицания, частицы ἄν и аориста выражает нереализованное следствие; русская форма с «бы» точно передаёт контрфактический смысл.
- source_word: διορυχθῆναι
  choice: проломить стену
  rationale: Буквально глагол обозначает проделывание пролома посредством рытья или пробивания, характерное для стен древних домов. Включение «стену» делает образ ясным по-русски, тогда как просто «подкопать дом» могло бы ошибочно означать подкоп под фундамент.
- source_word: τὸν οἶκον αὐτοῦ
  choice: своего дома
  rationale: Возвратное местоимение естественно указывает на принадлежность дома подлежащему «хозяин» и сохраняет физический образ дома.
theological_decisions:
- issue: Образ внезапного прихода вора
  choice: Сохранён без поясняющего отождествления в основном тексте
  alternative: Явно связать вора с приходом Сына Человеческого
  rationale: Сам стих представляет условный бытовой образ; богословское применение раскрывается контекстом, поэтому перевод не должен добавлять отсутствующее в данной фразе толкование.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет краткость и назидательную прямоту греческого текста; буквальный материальный образ διορύσσω сохранён в основном тексте и уточнён примечанием.
