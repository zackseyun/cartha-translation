lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Почему же
  rationale: Естественно передаёт риторический вопрос и связующую, усиливающую функцию частиц δὲ καὶ без тяжеловесного буквального воспроизведения.
- source_word: ἀφ’ ἑαυτῶν
  choice: сами
  rationale: В данном контексте выражение указывает на самостоятельное суждение, исходящее от самих слушателей; русское «сами» ясно и естественно передаёт этот смысл.
- source_word: οὐ κρίνετε
  choice: не судите
  rationale: Глагол κρίνω означает оценивать и выносить суждение. «Не судите» сохраняет основное значение и связь с контекстом рассуждения.
- source_word: τὸ δίκαιον
  choice: что правильно
  rationale: Субстантивированное прилагательное обозначает правильное или справедливое. «Что правильно» естественно звучит по-русски и сохраняет широкий нравственно-оценочный смысл.
theological_decisions:
- issue: Смысл τὸ δίκαιον
  choice: что правильно
  alternative: что справедливо; как следует поступить
  rationale: Контекст допускает как нравственную правильность, так и справедливость. Основной вариант не сужает выражение до юридической справедливости, а сноска сохраняет смысловые альтернативы.
translation_notes:
  register: Современный литературный русский язык; краткий риторический вопрос передан естественно и с достоинством. Порядок «вы и сами» сохраняет усиление самостоятельной ответственности слушателей.
