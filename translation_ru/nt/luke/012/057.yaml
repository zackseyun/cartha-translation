  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: ru
  text: Почему же вы сами не судите о том, что правильно?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что справедливо» или «то, что правильно».'
