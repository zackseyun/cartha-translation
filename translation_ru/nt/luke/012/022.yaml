id: LUK.12.22
reference: Luke 12:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: ru
  text: 'И Он сказал Своим ученикам: «Поэтому говорю вам: не тревожьтесь[a] о своей жизни[b] — что вам есть, ни о своём теле — во что одеться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не беспокойтесь».'
    reason: Лексический вариант передачи μεριμνάω.
  - marker: b
    text: 'Буквально: «о душе»; здесь греческое слово означает жизнь человека, его земное существование.'
    reason: Пояснение контекстуального значения ψυχή и сохранение возможного буквального соответствия.
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: И Он сказал
  rationale: δέ — мягкая повествовательная связка; «и» естественно продолжает рассказ, не придавая ей излишне сильного временного или противительного значения.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: Своим ученикам
  rationale: Передаёт как обращение к μαθηταί, так и явно выраженную принадлежность αὐτοῦ; возвратное «Своим» естественно по-русски при подлежащем «Он».
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и ясно передаёт вывод из предшествующего наставления.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Прямое и естественное соответствие греческому выражению с сохранением непосредственного обращения.
- source_word: μὴ μεριμνᾶτε
  choice: не тревожьтесь
  rationale: В данном контексте глагол обозначает мучительную, тревожную заботу. Этот вариант не создаёт впечатления, будто ученикам запрещена разумная предусмотрительность.
- source_word: τῇ ψυχῇ
  choice: о своей жизни
  rationale: Здесь ψυχή обозначает земную жизнь человека, нуждающуюся в пище, а не специально нематериальную душу.
- source_word: τί φάγητε
  choice: что вам есть
  rationale: Естественно передаёт косвенный вопрос о необходимой в будущем пище без ненужного уточнения времени.
- source_word: μηδὲ τῷ σώματι
  choice: ни о своём теле
  rationale: «Ни» сохраняет координацию двух объектов тревоги после общего отрицания; «своём» делает русскую конструкцию естественной.
- source_word: τί ἐνδύσησθε
  choice: во что одеться
  rationale: Передаёт среднее значение ἐνδύω — надеть на себя одежду — и образует естественную русскую параллель с «что вам есть».
theological_decisions:
- issue: Значение ψυχή в данном контексте
  choice: жизнь
  alternative: душа
  rationale: Параллелизм связывает ψυχή с пищей, а тело — с одеждой; речь идёт о поддержании земной жизни. Сноска сохраняет лексическую широту слова и не навязывает антропологического толкования.
- issue: Характер запрещаемой заботы
  choice: тревожиться
  alternative: заботиться
  rationale: μεριμνάω здесь указывает на тревогу о жизненных нуждах. «Не заботьтесь» в современном русском может ошибочно звучать как запрет на ответственную заботу вообще.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Синтаксический параллелизм двух запретов сохранён; тире помогает обычному читателю увидеть, что последующие вопросы поясняют, о чём именно не следует тревожиться.
