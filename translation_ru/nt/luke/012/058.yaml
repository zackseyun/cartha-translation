  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: ru
  text: Ведь когда ты идёшь со своим противником к должностному лицу, постарайся ещё по дороге освободиться от него[a], иначе он потащит тебя к судье, судья передаст тебя судебному исполнителю, а судебный исполнитель бросит тебя в тюрьму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «освободиться от него». В юридическом контексте это, вероятно, означает уладить с ним дело до того, как оно дойдёт до судьи.'
    reason: Сохраняет буквальную неоднозначность выражения ἀπηλλάχθαι ἀπ’ αὐτοῦ и отмечает вероятный контекстуальный смысл, не подменяя им основной текст.
lexical_decisions:
- source_word: ἀντιδίκου
  choice: противником в суде
  rationale: Передаёт юридический смысл стороны, выступающей против человека в тяжбе, не сужая значение до уголовного обвинителя.
- source_word: ἄρχοντα
  choice: представителю власти
  rationale: В данном контексте слово обозначает гражданское должностное лицо; этот вариант понятен современному читателю и не вызывает бытовой ассоциации с начальником на работе.
- source_word: δὸς ἐργασίαν
  choice: постарайся
  rationale: Естественно передаёт идиоматический призыв приложить деятельное усилие.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: освободиться от его притязаний
  rationale: Сохраняет образ освобождения и делает понятным его юридический смысл; буквальная конструкция и возможное значение «уладить дело» отмечены в сноске.
- source_word: κατασύρῃ
  choice: потащит
  rationale: Передаёт принудительный и выразительный характер греческого глагола.
- source_word: κριτήν / κριτής
  choice: судье / судья
  rationale: Прямой и однозначный эквивалент в юридическом контексте.
- source_word: παραδώσει
  choice: передаст
  rationale: Естественно выражает передачу человека должностному лицу для исполнения судебного решения.
- source_word: πράκτορι / πράκτωρ
  choice: судебному исполнителю / судебный исполнитель
  rationale: Обозначает служащего, исполняющего постановление судьи, в том числе связанное со взысканием или заключением; вариант точнее общего «служитель».
- source_word: βαλεῖ εἰς φυλακήν
  choice: бросит тебя в тюрьму
  rationale: Сохраняет силу и выразительность βάλλω, не сглаживая фразу до нейтрального «посадит».
- source_word: ὡς γὰρ
  choice: Ведь когда
  rationale: «Ведь» сохраняет пояснительную связь γάρ с предыдущим контекстом, а «когда» естественно вводит описываемую ситуацию.
- source_word: ἐν τῇ ὁδῷ
  choice: ещё по дороге
  rationale: 'Передаёт как буквальный путь, так и срочность: договориться необходимо до прибытия к судье.'
theological_decisions:
- issue: Степень истолкования юридического образа
  choice: Сохранить юридическую сцену, не отождествляя её участников с Богом, последним судом или иными богословскими реалиями.
  alternative: Передать стих как прямой призыв примириться с Богом до последнего суда.
  rationale: Сам стих формулирует наставление посредством юридического образа и прямо не раскрывает духовных соответствий. Более конкретное богословское толкование неоправданно устранило бы заложенную в контексте открытость применения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Юридическая последовательность и нарастающая угроза исходного текста сохранены; формулировки не привязаны к современной правовой системе какой-либо одной страны.
