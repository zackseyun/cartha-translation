  timestamp: '2026-07-14T20:19:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная юридическая последовательность передана точно: противная сторона, должностное лицо, судья, исполнитель и тюрьма. Однако «идёшь ... в суде к представителю власти» синтаксически неудачно и способно создать впечатление, что действие уже происходит в суде, тогда как греческое ἐν τῇ ὁδῷ подчёркивает путь к власти. Формулировка «освободиться от его притязаний» поясняет контекст, но заменяет буквальное «освободиться от него» добавленным объектом; это лучше оставить в сноске как вероятное юридическое следствие, а не вносить в основной текст.'
  naturalness: После устранения «в суде» фраза звучит естественно и сохраняет нарастающую цепь юридических действий. «Должностное лицо» нейтральнее и естественнее здесь, чем расплывчатое «представитель власти»; «судебный исполнитель» остаётся понятным современным обозначением исполняющего распоряжение судьи.
  terminology: «Противник» сохраняет более широкое юридическое значение ἀντίδικος, не ограничивая его уголовным обвинителем. «Судья» последовательно передаёт κριτής. «Судебный исполнитель» приемлемо передаёт πράκτωρ без отождествления античной должности с конкретным современным институтом. Буквальная связь ἀπηλλάχθαι ἀπ’ αὐτοῦ сохранена в основном тексте и разъяснена сноской.
  issues:
  - severity: medium
    issue: «идёшь со своим противником в суде к представителю власти»
    rationale: Оборот «в суде» синтаксически присоединён к «идёшь» и не соответствует сцене движения вместе с противной стороной к ἄρχων; судья упомянут далее как отдельная инстанция.
  - severity: low
    issue: «освободиться от его притязаний»
    rationale: Греческий текст буквально говорит «освободиться от него», а не прямо от его притязаний. Юридическое уточнение правдоподобно, но несколько сужает выражение; его следует обозначить как контекстуальное в сноске.
  revised_text: Ведь когда ты идёшь со своим противником к должностному лицу, постарайся ещё по дороге освободиться от него[a], иначе он потащит тебя к судье, судья передаст тебя судебному исполнителю, а судебный исполнитель бросит тебя в тюрьму.
