revisions:
- from: Ведь когда ты идёшь со своим противником в суде к представителю власти, постарайся ещё по дороге освободиться от его притязаний[a], иначе он потащит тебя к судье, судья передаст тебя судебному исполнителю, а судебный исполнитель бросит тебя в тюрьму.
  to: Ведь когда ты идёшь со своим противником к должностному лицу, постарайся ещё по дороге освободиться от него[a], иначе он потащит тебя к судье, судья передаст тебя судебному исполнителю, а судебный исполнитель бросит тебя в тюрьму.
  rationale: Исправлена синтаксическая связь, чтобы путь к должностному лицу и срочность действия «по дороге» соответствовали греческой сцене. Буквальное «освободиться от него» возвращено в текст; объяснение возможного смысла урегулирования дела перенесено в сноску. Замена «представителя власти» на «должностное лицо» точнее выражает административно-правовую функцию ἄρχων, не смешивая её с последующим судьёй.
