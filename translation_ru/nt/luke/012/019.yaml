  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: ru
  text: 'И скажу своей душе[a]: «Душа, у тебя много добра, припасённого на многие годы. Отдыхай, ешь, пей и веселись».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «себе»; греч. ψυχή также может означать «жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: скажу
  rationale: Будущее время λέγω прямо и естественно передаётся формой «скажу».
- source_word: ψυχῇ / Ψυχή
  choice: своей душе / Душа
  rationale: В контексте это обращение человека к самому себе; «душа» сохраняет повтор и образность греческого текста, не превращая выражение в техническое антропологическое утверждение.
- source_word: πολλὰ ἀγαθὰ
  choice: много добра
  rationale: В данном контексте речь о накопленных материальных благах; «добро» естественно обозначает имущество и сохраняет широту слова ἀγαθά.
- source_word: κείμενα
  choice: припасённого
  rationale: Причастие указывает на блага, уже отложенные и хранящиеся в запасе; «припасённого» естественно согласуется с собирательным «добра».
- source_word: εἰς ἔτη πολλά
  choice: на многие годы
  rationale: Предлог εἰς здесь выражает рассчитанную на будущее продолжительность запаса.
- source_word: ἀναπαύου
  choice: отдыхай
  rationale: Императив передаёт призыв жить без забот и пользоваться покоем; «отдыхай» ясно и современно.
- source_word: φάγε, πίε
  choice: ешь, пей
  rationale: Прямое и естественное воспроизведение двух повелительных форм.
- source_word: εὐφραίνου
  choice: веселись
  rationale: Глагол означает радоваться, предаваться веселью; «веселись» точно вписывается в последовательность призывов к беззаботному наслаждению.
theological_decisions:
- issue: Передача ψυχή в обращении человека к самому себе
  choice: душа
  alternative: сам; жизнь
  rationale: «Душа» сохраняет намеренный повтор и литературно-богословскую многозначность ψυχή. Сноска поясняет, что здесь возможно понимание «самого себя» или «жизни», не закрепляя спорную антропологическую схему.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранено риторическое самообращение и краткая последовательность повелений; союз «и» перед последним глаголом естественен для русского перечисления.
