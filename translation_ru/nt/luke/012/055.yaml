  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: ru
  text: 'А когда дует южный ветер, вы говорите: «Будет зной», — и так и бывает.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: южный ветер
  rationale: Существительное может означать «юг» или «южный ветер», но в сочетании с πνέοντα речь явно идёт о ветре; явное обозначение естественно для современного русского языка.
- source_word: πνέοντα
  choice: дует
  rationale: Причастие настоящего времени описывает наблюдаемое дуновение ветра; личная глагольная конструкция «дует южный ветер» звучит по-русски естественно.
- source_word: λέγετε
  choice: вы говорите
  rationale: Настоящее время передаёт обычное, повторяющееся действие без необходимости усиливающего «всякий раз».
- source_word: Καύσων
  choice: зной
  rationale: Слово обозначает сильную, палящую жару; «зной» кратко, выразительно и без современного метеорологического оттенка выражения «волна жары».
- source_word: ἔσται
  choice: будет
  rationale: 'Будущее время непосредственно передаёт прогноз: «Будет зной».'
- source_word: γίνεται
  choice: так и бывает
  rationale: Формула естественно передаёт осуществление регулярно высказываемого прогноза и сохраняет обобщённый характер настоящего времени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая и разговорно естественная, но сохраняет достоинство евангельской речи. Лексическая неоднозначность νότον не требует сноски, поскольку глагол «дует» однозначно указывает на ветер; интенсивность Καύσων передана словом «зной».
