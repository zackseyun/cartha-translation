review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан в целом верно: ученики уподобляются людям, ожидающим возвращения своего господина со свадебного торжества, чтобы немедленно открыть ему после стука. Однако греческое ἀνοίξωσιν — форма множественного числа («они открыли»), и это следует явно отразить в русском тексте.'
  naturalness: «Будьте подобны людям» и «тотчас» соответствуют современному литературному, умеренно возвышенному регистру. В исходном варианте инфинитив «открыть» после «чтобы» стирает множественное число и создаёт менее ясную синтаксическую связь; личная форма «они открыли» естественнее.
  terminology: «Господин» удачно передаёт κύριος в рамках притчи, не навязывая толкования. «Свадебный пир» естественно передаёт ἐκ τῶν γάμων в данном контексте. «Вернётся» ясно выражает ожидаемое прибытие господина, подразумеваемое контекстом.
  issues:
  - severity: medium
    issue: Утрата множественного числа в заключительной цели
    rationale: ἀνοίξωσιν стоит во множественном числе и относится к «людям»; «чтобы ... открыть ему» использует инфинитив и не выражает явно, что открыть должны они. Следует поставить личную форму множественного числа.
  revised_text: И вы будьте подобны людям, ожидающим, когда их господин вернётся со свадебного пира, чтобы, когда он придёт и постучит, они тотчас открыли ему.
