  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: ru
  text: И вы будьте подобны людям, ожидающим, когда их господин вернётся со свадебного пира, чтобы, когда он придёт и постучит, они тотчас открыли ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιοι ἀνθρώποις
  choice: подобны людям
  rationale: Сохраняет прямое сравнение исходного текста и звучит естественно в современном литературном русском.
- source_word: τὸν κύριον ἑαυτῶν
  choice: своего господина
  rationale: κύριος здесь обозначает господина ожидающих его слуг; «господин» сохраняет социальное отношение, не устраняя возможного образного смысла.
- source_word: ἀναλύσῃ ἐκ τῶν γάμων
  choice: с брачного пира
  rationale: В данном контексте ἀναλύω означает возвращение/уход откуда-либо, а γάμοι — свадебное торжество; по-русски естественно выразить ожидаемое прибытие через «с брачного пира».
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт немедленность действия и сохраняет достойный, но понятный современному читателю регистр.
theological_decisions:
- issue: Передача κύριος в притче
  choice: господин
  alternative: Господь / хозяин
  rationale: Строчная форма «господин» непосредственно соответствует роли персонажа в образе и не навязывает явное отождествление, хотя более широкий христологический смысл контекста остаётся доступным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием; синтаксис близок к греческому, но не тяжеловесен.
