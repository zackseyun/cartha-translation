  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: ru
  text: 'Говорю же вам: всякого, кто признает Меня перед людьми, признает и Сын Человеческий перед ангелами Божьими.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Но говорю вам
  rationale: Настоящее время передает непосредственное и торжественное утверждение; δέ здесь мягко связывает высказывание с предыдущим контекстом и допускает естественное русское «но».
- source_word: πᾶς ὃς ἂν
  choice: всякого, кто
  rationale: Оборот выражает общее неопределенное условие; винительный «всякого» обусловлен управлением будущего «признает» во второй части и сохраняет универсальный охват.
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: признает … признает
  rationale: Повтор одного русского глагола сохраняет взаимность формулы. В данном контексте «признать» естественно передает открытое признание и исповедание принадлежности, не вызывая у современного читателя преимущественной ассоциации с признанием в проступке.
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: Меня … всякого, кто
  rationale: 'Сочетание ὁμολογέω с ἐν и дательным передано идиоматически: «признать Меня» и затем посредством объекта «всякого, кто». Буквальное «признается во Мне / в нем» было бы неясным по-русски.'
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: перед людьми
  rationale: ἔμπροσθεν означает публичное действие в присутствии других, а ἄνθρωποι здесь обозначает людей вообще; русское «людьми» точно передает родовое значение без ненужного ограничения мужчинами.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Сохранен устойчивый титул Иисуса с его библейскими и мессианскими ассоциациями.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: перед ангелами Божьими
  rationale: Естественно и близко к форме оригинала передает небесную публичность признания.
theological_decisions:
- issue: Взаимная формула признания с ἐν + дательный
  choice: 'Передать идиоматически: «кто признает Меня … Сын Человеческий признает [того]»'
  alternative: «кто исповедует во Мне … исповедует в нем»
  rationale: Буквальное воспроизведение предлога звучит по-русски неестественно и затемняет смысл. Идиоматический вариант сохраняет взаимность открытого признания, не добавляя доктринального толкования.
- issue: Значение ἀνθρώπων
  choice: «людьми»
  alternative: «мужчинами»
  rationale: Хотя греческая форма имеет грамматический мужской род, существительное здесь относится к людям вообще. Современное русское «люди» передает смысл источника точнее.
- issue: Явное дополнение при втором ὁμολογήσει
  choice: «всякого, кто» служит вынесенным вперед общим дополнением второй части
  alternative: 'Повторить местоимение: «признает того»'
  rationale: Такая русская конструкция сохраняет тесную симметрию стиха и не вводит родовое местоимение там, где греческое αὐτῷ грамматически мужского рода, но соотносится с любым человеком.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Заглавные буквы в «Меня» и титуле следуют принятой русской библейской традиции; «Божьими» выбрано как современная литературная форма. Лексический повтор «признает … признает» намеренно сохраняет повтор ὁμολογέω.
