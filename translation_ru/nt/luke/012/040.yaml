  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: ru
  text: Будьте и вы готовы, потому что Сын Человеческий[b] придёт в час, когда вы этого не ожидаете[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда вы не думаете»; по смыслу: «когда вы этого не ожидаете».'
    reason: lexical_alternative
  - marker: b
    text: «Сын Человеческий» — наименование, которым Иисус говорит о Себе; вероятно, оно отсылает к Дан 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: Сочетание выражает включение и подчёркивает, что наставление относится также к слушателям; в русском естественно поставить «и вы» после сказуемого.
- source_word: γίνεσθε ἕτοιμοι
  choice: будьте готовы
  rationale: Настоящее повелительное наклонение призывает сохранять состояние готовности. «Будьте готовы» точно и естественно передаёт повелительную силу без избыточного добавления модальности.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание для повеления и ясно передаётся причинным «потому что».
- source_word: ᾗ ὥρᾳ
  choice: в час, когда
  rationale: Относительная конструкция имеет временное значение. Русское «в час, когда» сохраняет образ часа и естественно связывается с последующим придаточным.
- source_word: οὐ δοκεῖτε
  choice: вы не ожидаете
  rationale: Хотя δοκέω буквально может означать «думать» или «полагать», в контексте предупреждения речь идёт о времени, которого слушатели не ожидают.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  rationale: Традиционное буквальное наименование сохраняет функцию самообозначения Иисуса и вероятный отзвук Дан 7:13–14.
- source_word: ἔρχεται
  choice: придёт
  rationale: Греческое настоящее здесь имеет будущее значение. В современном русском «придёт» естественно выражает предстоящее событие; буквальное «приходит» могло бы ошибочно восприниматься как уже совершающееся или повторяющееся действие.
theological_decisions:
- issue: Передача христологического титула ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Сын Человеческий
  alternative: Человеческий Сын / Сын человека
  rationale: Устоявшаяся форма сохраняет титульный характер выражения и его апокалиптический, вероятно данииловский, фон, не добавляя к тексту конфессионального толкования.
- issue: Временная сила ἔρχεται в эсхатологическом изречении
  choice: придёт
  alternative: приходит
  rationale: Настоящее время греческого глагола допускает футуральное употребление. Русское будущее ясно передаёт смысл предстоящего прихода, не определяя его время и не навязывая эсхатологической схемы.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены повелительная настойчивость, образ «часа» и традиционный христологический титул. Порядок слов слегка адаптирован к естественному русскому синтаксису.
