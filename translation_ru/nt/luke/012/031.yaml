base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: ru
  text: Но ищите Его Царства[b][a], и всё это будет дано вам сверх того.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Царства Божьего»; в греческом тексте: «Его Царства», а к кому относится местоимение, ясно из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «Царства Божьего» вместо «Его Царства».'
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Кратко и естественно передаёт противопоставление тревожной погоне за необходимым, о которой говорится выше.
- source_word: ζητεῖτε
  choice: ищите
  rationale: Настоящее повелительное наклонение выражает постоянную направленность; русская форма «ищите» естественно допускает это значение без добавочного истолкования.
- source_word: βασιλείαν
  choice: Царства
  rationale: «Царство» — узнаваемый и достаточно широкий эквивалент, способный обозначать как царствование, так и область власти.
- source_word: αὐτοῦ
  choice: Его
  rationale: Сохраняет местоименную форму греческого текста; из контекста ясно, что речь идёт о Боге.
- source_word: ταῦτα
  choice: это
  rationale: Указывает на необходимые для жизни вещи из предыдущего контекста и не вносит отсутствующее в данном греческом тексте слово «всё».
- source_word: προστεθήσεται
  choice: будет дано вдобавок
  rationale: Естественно по-русски передаёт будущую страдательную форму и образ добавления, не превращая обещание в более узкое «будет обеспечено».
- source_word: ὑμῖν
  choice: вам
  rationale: Прямо и идиоматично передаёт дательный падеж адресата.
theological_decisions:
- issue: К кому относится αὐτοῦ
  choice: Местоимение относится к Богу и переведено как «Его Царства».
  alternative: «Царства Божьего».
  rationale: Ближайший контекст говорит об Отце и Божьей заботе; сохранение местоимения передаёт форму основного греческого текста, не устраняя контекстуально ясную отсылку.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Заглавные буквы в «Его Царства» помогают обычному читателю распознать отсылку к Богу, при этом местоименная форма оригинала сохранена.
