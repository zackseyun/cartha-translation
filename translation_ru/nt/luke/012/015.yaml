base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: ru
  text: 'Затем Он сказал им: «Смотрите, берегитесь всякой алчности[a], потому что жизнь человека не состоит в изобилии его имущества».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякой жадности» либо «всякого корыстолюбия». Греческое слово может обозначать жадное стремление приобретать или иметь больше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Смотрите
  rationale: Повелительная форма множественного числа имеет предостерегающую силу; «смотрите» естественно вводит предупреждение и сохраняет отдельный глагол перед φυλάσσεσθε.
- source_word: φυλάσσεσθε
  choice: берегитесь
  rationale: Средняя форма повелительного наклонения выражает самозащиту; русское «берегитесь» передаёт возвратный смысл естественно и ясно.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: всякой алчности
  rationale: πλεονεξία обозначает жадное стремление иметь больше; «алчность» передаёт широкий нравственный смысл, а «всякой» сохраняет охват πάσης.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание для предостережения; причинная связь выражена прямо и современно.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: жизнь человека не зависит от изобилия
  rationale: Передаёт мысль, что жизнь не определяется и не обеспечивается наличием избытка, без неестественного буквального воспроизведения греческой конструкции.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: его имущества
  rationale: Субстантивированное выражение означает принадлежащее человеку, его достояние или имущество; «имущество» здесь кратко и естественно.
theological_decisions:
- issue: Обобщённое обозначение человека формами мужского рода
  choice: жизнь человека … его имущества
  alternative: его жизнь … того, чем он владеет
  rationale: Греческое τινί и местоимения имеют обобщающий смысл, а не ограничивают высказывание мужчинами; русское «человека» естественно сохраняет универсальность.
- issue: Характер предостережения о πλεονεξία
  choice: всякой алчности
  alternative: всякого корыстолюбия; всякой жадности
  rationale: Предостережение касается стремления приобретать и иметь больше вообще, а не только желания присвоить чужую собственность; «алчность» сохраняет эту широту.
- issue: Связь жизни с материальным изобилием
  choice: жизнь человека не зависит от изобилия его имущества
  alternative: жизнь человека не состоит в изобилии его имущества
  rationale: Греческая фраза отрицает, что жизнь основана на множестве принадлежащих человеку вещей. «Не зависит» передаёт смысл ясно, не уточняя без основания, идёт ли речь лишь о продолжительности, безопасности или полноте жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Парные императивы «смотрите, берегитесь» сохраняют риторическое усиление оригинала; формулировка остаётся понятной обычному читателю.
