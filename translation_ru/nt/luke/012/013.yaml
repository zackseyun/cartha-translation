id: LUK.12.13
reference: Luke 12:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: ru
  text: 'Тогда кто-то из толпы сказал Ему: «Учитель, скажи моему брату, чтобы он разделил со мной наследство».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он поделился со мной наследством»; или: «чтобы он выделил мне долю наследства».'
    reason: Лексема μερίζομαι и сочетание μετ’ ἐμοῦ допускают как раздел наследства, так и передачу просителю причитающейся ему доли.
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Тогда ... сказал
  rationale: δέ — мягкая повествовательная связка; «тогда» естественно продолжает рассказ, не создавая резкого противопоставления.
- source_word: τις ἐκ τοῦ ὄχλου
  choice: кто-то из толпы
  rationale: Точно и естественно передаёт неопределённое лицо, находившееся среди собравшихся.
- source_word: αὐτῷ
  choice: Ему
  rationale: Косвенное дополнение относится к Иисусу; прописная буква соответствует принятому благоговейному оформлению местоимений в русском библейском тексте.
- source_word: Διδάσκαλε
  choice: Учитель
  rationale: Прямое современное соответствие обращению к наставнику, без усиления оттенка власти.
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: скажи моему брату
  rationale: Императив здесь выражает просьбу побудить брата к действию; эта конструкция естественна по-русски.
- source_word: μερίσασθαι
  choice: чтобы он разделил
  rationale: Инфинитив означает разделить или распределить по долям; придаточное с «чтобы» естественно передаёт зависимость от «скажи».
- source_word: μετ’ ἐμοῦ
  choice: со мной
  rationale: Сохраняет выраженную в греческом идею совместного участия и не уточняет сверх текста, идёт ли речь о разделе между двумя лицами.
- source_word: τὴν κληρονομίαν
  choice: наследство
  rationale: Широкий и обычный русский термин для наследуемого имущества, не вводящий лишней юридической конкретизации.
