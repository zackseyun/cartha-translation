  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: ru
  text: 'Тогда Пётр сказал: «Господи, эту притчу ты рассказываешь нам или также всем?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: Тогда Пётр сказал
  rationale: δέ продолжает повествование и естественно передаётся словом «тогда»; Εἶπεν буквально означает «сказал», а вопросительный характер реплики выражен её формой и пунктуацией.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма «Господи» естественно передаёт прямое обращение к Иисусу и сохраняет возможную христологическую значимость титула κύριος.
- source_word: πρὸς ἡμᾶς
  choice: нам
  rationale: После глагола речи πρός с винительным указывает на тех, к кому обращены слова; по-русски это естественно выражается дательным падежом.
- source_word: τὴν παραβολὴν ταύτην
  choice: эту притчу
  rationale: «Притча» — устойчивый и точный русский эквивалент παραβολή в синоптической традиции.
- source_word: λέγεις
  choice: рассказываешь
  rationale: В сочетании с «притчей» глагол «рассказываешь» звучит естественнее буквального «говоришь», сохраняя значение произнесения данной притчи.
- source_word: ἢ καὶ πρὸς πάντας
  choice: или также всем
  rationale: «Также» сохраняет добавочное значение καί, а «всем» естественно передаёт обобщающее πάντας без неоправданного ограничения только мужчинами.
theological_decisions:
- issue: Передача κύριος в обращении Петра к Иисусу
  choice: Господи
  alternative: Учитель
  rationale: «Господи» соответствует κύριος и сохраняет как уважительное обращение, так и возможный христологический оттенок, не делая его более определённым, чем в греческом тексте.
- issue: Обобщающее значение πάντας
  choice: всем
  alternative: всем людям
  rationale: Русское «всем» естественно охватывает более широкий круг слушателей и не вносит отсутствующего в тексте ограничения по полу.
translation_notes:
  register: Современный литературный русский язык; реплика передана просто и достойно. Строчная форма местоимения «ты» избегает внесения в сам текст поздней русской типографской традиции почтительного написания, при этом уважение выражено обращением «Господи».
