source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: ru
  text: 'Но говорю вам, друзья мои: не бойтесь тех, которые убивают тело и после этого уже ничего больше не могут сделать.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Но говорю
  rationale: δέ обозначает мягкий переход с оттенком противопоставления; «но» естественно связывает эту фразу с предшествующим контекстом, не усиливая контраст чрезмерно.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: вам, Моим друзьям
  rationale: 'Дательный оборот имеет пояснительно-приложительное значение: Иисус обращается к слушателям как к Своим друзьям. Формулировка сохраняет и местоимение, и тёплое обращение.'
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: не бойтесь тех, кто убивает
  rationale: Сочетание с μή выражает запрет, а ἀπό при φοβέομαι указывает на объект страха. Причастие настоящего времени передано обобщённо, как характеристика таких людей.
- source_word: τὸ σῶμα
  choice: тело
  rationale: σῶμα здесь означает физическое тело; перевод прямо передаёт текст, не добавляя отсутствующего в стихе упоминания души.
- source_word: καὶ μετὰ ταῦτα
  choice: и после этого
  rationale: Оборот имеет временное значение и указывает на то, что следует после убийства тела.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: больше ничего не может сделать
  rationale: 'Фраза подчёркивает предел возможностей убийц: после телесной смерти они не способны сделать что-либо ещё. Единственное число согласовано с обобщённым «кто» в естественном русском синтаксисе.'
theological_decisions:
- issue: Предел человеческой власти после телесной смерти
  choice: Стих говорит лишь о том, что люди могут убить тело, но после этого не могут сделать ничего больше.
  alternative: Уточнить в переводе, что они не могут убить душу.
  rationale: Хотя следующий стих противопоставляет ограниченность людей Божьей власти, данный стих прямо не упоминает душу. Перевод сохраняет формулировку и напряжение исходного текста без истолковательного дополнения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи Иисуса. «Не бойтесь» звучит естественно и ясно; структура фразы близка к греческой, но не калькирована. Местоимение «Моим» написано с прописной буквы как принятая в русском библейском регистре форма почтительного обозначения принадлежности Христу.
