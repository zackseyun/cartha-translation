  verdict: revise
  source_fidelity: 'Смысл исходного греческого текста в целом передан верно: обращение к «друзьям», запрет бояться людей, убивающих тело, и предел их власти после этого сохранены. Однако в русском тексте нарушено число: «тех, кто убивает ... не может» формально переводит множественное число греческого причастия единственным числом через относительное «кто».'
  naturalness: Фраза понятна и выдержана в современном литературном регистре, но согласование следует сделать последовательно множественным числом. Обращение «друзья мои» естественнее передаёт прямое личное обращение и сохраняет приложение в греческом тексте.
  terminology: «Тело» точно соответствует σῶμα. Формулировка не добавляет упоминания души и не навязывает истолкования следующего стиха. Написание «мои» со строчной буквы соответствует нейтральной современной орфографической норме; это не меняет христологического смысла.
