source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: ru
  text: 'Тем временем, когда собрались многотысячные толпы народа, так что люди наступали друг на друга, Иисус начал говорить прежде всего Своим ученикам: «Берегитесь закваски фарисеев, то есть лицемерия».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Тем временем, когда
  rationale: Передаёт временно-обстоятельственный переход к событию, связанному с предыдущим контекстом.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: собралась многотысячная толпа
  rationale: Естественно передаёт чрезвычайно многочисленное скопление людей; μυριάδες здесь не обязательно обозначает точное число.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: так что люди теснили друг друга
  rationale: Конструкция выражает результат. В данном контексте καταπατεῖν может указывать на то, что люди наступали друг на друга или давили друг друга в тесноте; «теснили» естественно передаёт хаотичную давку без излишнего усиления.
- source_word: ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: Иисус прежде всего обратился к Своим ученикам
  rationale: Сохраняет начало речи и приоритет учеников как адресатов; имя Иисуса восполняет греческое местоименное подлежащее для ясности русского повествования.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: Берегитесь
  rationale: Естественное русское предостережение, передающее как внимание к себе, так и необходимость ограждать себя от опасности.
- source_word: τῆς ζύμης ... τῶν Φαρισαίων
  choice: фарисейской закваски
  rationale: Сохраняет исходный образ и его библейские ассоциации; прилагательное естественно передаёт греческий родительный падеж.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: — лицемерия
  rationale: Тире и приложение прямо отождествляют образ закваски с лицемерием, сохраняя пояснительную силу греческой конструкции.
theological_decisions:
- issue: Образ закваски
  choice: Сохранить метафору «закваска», пояснённую словом «лицемерие».
  alternative: Передать как «влияние» или «учение» фарисеев.
  rationale: Сам текст раскрывает значение образа; его замена толкованием сузила бы смысл и ослабила литературную форму.
- issue: Связь лицемерия с фарисейской закваской
  choice: Пунктуационно представить «лицемерие» как прямое пояснение образа.
  alternative: 'Перестроить как отдельное утверждение: «закваска фарисеев — это лицемерие».'
  rationale: Оба варианта возможны, но приложение с тире кратко и ясно сохраняет отождествление, выраженное ἥτις ἐστίν.
- issue: Сфера действия πρῶτον
  choice: «прежде всего» относится к обращению Иисуса к ученикам.
  alternative: «сначала» как общее вводное слово к первому пункту речи.
  rationale: Порядок слов естественно подчёркивает первоочередность учеников как адресатов, не утверждая подробной последовательности дальнейших речей.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Многотысячная толпа» звучит естественнее буквального «мириады толпы»; «закваска» сохраняет метафорический и межтекстовый оттенок. Местоимение «Своим» оформлено с прописной буквы по традиции уважительного религиозного письма, без добавления конфессионального толкования.
