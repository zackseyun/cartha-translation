id: LUK.12.51
reference: Luke 12:51
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: ru
  text: Думаете ли вы, что Я пришёл дать мир на земле? Нет, говорю вам, а разделение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: Думаете ли вы
  rationale: Естественно передаёт обращённый к слушателям риторический вопрос и сохраняет прямой вызов их предположению.
- source_word: εἰρήνην
  choice: мир
  rationale: Основное соответствие, сохраняющее широкий смысл общественного мира и согласия без ненужного уточнения.
- source_word: παρεγενόμην
  choice: Я пришёл
  rationale: Аорист παραγίνομαι в сочетании с инфинитивом выражает приход с определённой целью; форма «пришёл» естественна и близка к греческому тексту.
- source_word: δοῦναι
  choice: дать
  rationale: Прямое лексическое соответствие греческому инфинитиву; по-русски сочетание «дать мир» понятно и сохраняет форму оригинала.
- source_word: ἐν τῇ γῇ
  choice: на земле
  rationale: Передаёт наиболее вероятный широкий смысл γῆ в данном контексте; вариант «в стране» неоправданно сужал бы масштаб высказывания.
- source_word: οὐχί
  choice: Нет
  rationale: Краткий и сильный отрицательный ответ, соответствующий усиленной греческой отрицательной форме.
- source_word: λέγω ὑμῖν
  choice: говорю вам
  rationale: Близко передаёт обычную евангельскую формулу и сохраняет её торжественную прямоту.
- source_word: ἀλλ’ ἢ
  choice: но
  rationale: После явного отрицания русский союз «но» естественно и резко вводит противопоставленный результат; добавление «скорее» возможно, но не обязательно.
- source_word: διαμερισμόν
  choice: разделение
  rationale: Прямое и достаточно широкое соответствие; ближайший контекст раскрывает его как раскол между людьми, в том числе внутри семьи.
theological_decisions:
- issue: Следует ли смягчать кажущееся противоречие с другими текстами о мире
  choice: Сохранено резкое противопоставление мира и разделения.
  alternative: Передать более истолковательно как «не мир, а конфликт» либо уточнить, что разделение является лишь побочным следствием.
  rationale: Греческий текст намеренно сохраняет напряжение. Контекст следующих стихов показывает разделяющее воздействие миссии Иисуса, но сам стих не объясняет и не смягчает это утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены риторический вопрос, лаконичный отрицательный ответ и богословски напряжённый контраст. Местоимение «Я» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
