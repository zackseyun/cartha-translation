id: LUK.12.10
reference: Luke 12:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: ru
  text: И всякому, кто скажет слово против Сына Человеческого, будет прощено; но тому, кто похулит Святого Духа, не будет прощено.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὃς
  choice: всякому, кто
  rationale: Передаёт обобщённо-распределительное значение конструкции и естественно сочетается с дательным αὐτῷ в главной части.
- source_word: ἐρεῖ λόγον
  choice: скажет слово
  rationale: Сохраняет явно выраженное λόγον и при этом звучит понятно и достойно в современном русском языке.
- source_word: εἰς
  choice: против
  rationale: В контексте враждебной речи и хулы предлог выражает направленность против лица, а не просто направление к нему.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Сына Человеческого
  rationale: Устоявшаяся русская передача титула, сохраняющая его библейский и христологический смысл.
- source_word: ἀφεθήσεται αὐτῷ
  choice: будет прощено
  rationale: Русская безличная конструкция естественно подразумевает проступок как предмет прощения; адресат уже выражен формой «всякому».
- source_word: τῷ ... βλασφημήσαντι
  choice: тому, кто похулит
  rationale: Передаёт субстантивированное причастие и аористное представление поступка, не превращая фразу в объяснение характера или длительности греха.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Святого Духа
  rationale: Стандартное и точное современное русское наименование.
- source_word: οὐκ ἀφεθήσεται
  choice: не будет прощено
  rationale: Прямо передаёт отрицание будущего страдательного залога и сохраняет параллелизм с первой частью.
theological_decisions:
- issue: Сопоставление слова против Сына Человеческого и хулы на Святого Духа
  choice: Сохранить заявленное в тексте различие без пояснения природы или условий непрощения.
  alternative: Истолковать в самом переводе первую речь как неведение, а хулу на Духа — как окончательное нераскаяние.
  rationale: Сам стих проводит резкое различие, но не раскрывает его богословский механизм; перевод не должен разрешать эту напряжённость за исходный текст.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксический параллелизм двух частей сохранён; архаизмы и конфессионально окрашенные пояснения не использованы.
