  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: ru
  text: 'Ведь отныне пятеро в одном доме[a] будут разделены: трое против двоих и двое против троих.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в одном домохозяйстве». Греческое слово может означать как сам дом, так и живущую в нём семью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: будут
  rationale: Будущее время εἰμί естественно входит в русскую конструкцию «пятеро… будут разделены».
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим высказыванием о разделении и естественно звучит в современном русском языке.
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Кратко и точно передаёт значение «с этого времени впредь», сохраняя достойный современный регистр.
- source_word: πέντε
  choice: пятеро
  rationale: Собирательное числительное естественно обозначает группу из пяти людей.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: в одном доме
  rationale: Сохраняет конкретный образ греческого οἶκος, при этом в контексте подразумевается и живущая в доме семья; социальный оттенок отмечен в сноске.
- source_word: διαμεμερισμένοι
  choice: разделены
  rationale: Передаёт результативное состояние, выраженное перфектным страдательным причастием, и соответствует контексту межличностного противостояния.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: трое против двоих
  rationale: Предлог ἐπί с дательным здесь выражает противостояние; «против» ясно и естественно передаёт этот смысл.
- source_word: δύο ἐπὶ τρισίν
  choice: двое против троих
  rationale: Сохраняет параллелизм и симметрию второй части греческой фразы.
theological_decisions:
- issue: Передавать ли οἶκος буквально как «дом» или истолковывающе как «семья/домочадцы»
  choice: дом
  alternative: семья; домочадцы
  rationale: Следующий стих показывает, что речь идёт о семейной общности, однако «дом» сохраняет образ и семантическую широту оригинала, не устраняя его неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет параллелизм оригинала. «Отныне» имеет достойный библейский регистр без выраженной архаичности.
