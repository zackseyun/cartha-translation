source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: ru
  text: 'Но Я покажу вам, кого бояться: бойтесь того, кто после того, как убьёт, имеет власть бросить в геенну[a]. Да, говорю вам: вот кого бойтесь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ад». Греческое слово «геенна» — обозначение суда, восходящее к образу долины Еннома.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: Я покажу
  rationale: Будущее время ὑποδείκνυμι вводит прямое наставление; «покажу» естественно передаёт указание на того, кого следует бояться, без добавочной интерпретации.
- source_word: τίνα φοβηθῆτε
  choice: кого следует бояться
  rationale: Косвенный вопрос с сослагательным наклонением естественно передаётся по-русски конструкцией «кого следует бояться».
- source_word: φοβήθητε
  choice: бойтесь
  rationale: Повторённое повеление сохраняет силу предостережения и лексическую связь с предыдущим «бояться».
- source_word: τὸν
  choice: Того, Кто
  rationale: Субстантивированный артикль обозначает лицо; русская конструкция «Того, Кто» ясна и естественна. Прописная буква указывает на Бога в соответствии с русской издательской традицией, хотя греческая форма сама по себе имени не называет.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: после того, как убьёт
  rationale: Конструкция μετά с артиклевым инфинитивом выражает временную последовательность; личная русская конструкция звучит естественнее буквального «после убийства».
- source_word: ἔχοντα ἐξουσίαν
  choice: имеет власть
  rationale: ἐξουσία обозначает власть или полномочие, а не только способность или физическую силу.
- source_word: ἐμβαλεῖν εἰς
  choice: бросить в
  rationale: Прямой современный эквивалент, сохраняющий резкость образа и направление действия.
- source_word: γέενναν
  choice: геенну
  rationale: Транслитерация сохраняет конкретный греческий термин и его иудейский образный фон, не сводя его без пояснения к более позднему общему понятию «ад».
- source_word: ναί
  choice: Да
  rationale: Кратко и выразительно передаёт emphатическое подтверждение.
- source_word: τοῦτον φοβήθητε
  choice: Его бойтесь
  rationale: Вынесенное вперёд «Его» сохраняет усиленное указание греческого τοῦτον и естественно звучит по-русски.
theological_decisions:
- issue: Передача γέεννα в контексте суда
  choice: геенна
  alternative: ад
  rationale: Основной текст сохраняет исходный термин и связанную с долиной Еннома образность суда, не отождествляя его безоговорочно со всеми позднейшими представлениями об аде; привычный функциональный эквивалент дан в сноске.
- issue: Кого обозначает τὸν… τοῦτον
  choice: Лицо обозначено местоименно как Бог, с традиционными прописными буквами
  alternative: того… его со строчных букв
  rationale: Контраст с теми, кто способен убить лишь тело (ст. 4), и власть ввергнуть в геенну указывают в контексте на Бога. При этом перевод не вставляет отсутствующее в греческом тексте существительное «Бог».
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Повтор корня «бояться / бойтесь» и финальное усиление сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
