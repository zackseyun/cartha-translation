  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: ru
  text: И вы не ищите, что вам есть и что вам пить, и не тревожьтесь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не беспокойтесь», «не будьте в смятении»; более буквально: «не оставайтесь в подвешенном состоянии».'
    reason: 'Лексическая многозначность μετεωρίζεσθε: глагол может обозначать тревогу, внутреннюю неустойчивость или состояние напряжённой неопределённости.'
lexical_decisions:
- source_word: ὑμεῖς
  choice: вы
  rationale: Явно выраженное местоимение имеет усилительный оттенок; начальная конструкция «И вы» естественно передаёт это выделение без утяжеления «вы сами».
- source_word: ζητεῖτε
  choice: не ищите
  rationale: Сохраняется основное значение ζητέω — «искать, стремиться к» — и запрет озабоченной сосредоточенности на пропитании. Форма настоящего времени допускает понимание продолжающегося образа действий, но по-русски это не требует отдельного выражения.
- source_word: τί φάγητε
  choice: что вам есть
  rationale: 'Конструкция передаёт открытый, практически-вопросительный смысл: речь о том, какую пищу иметь для еды, а не о предопределённом будущем.'
- source_word: τί πίητε
  choice: что пить
  rationale: Параллельная краткая конструкция сохраняет структуру греческого текста и естественно дополняет «что вам есть».
- source_word: μετεωρίζεσθε
  choice: не пребывайте в тревоге
  rationale: Глагол обозначает состояние тревожной неопределённости, смятения или напряжённого ожидания. Выбор передаёт контекстуальный смысл и при этом не сводит многозначный образ только к обычному беспокойству.
- source_word: καὶ ... καὶ ... καὶ
  choice: и ... и ... и
  rationale: Повтор союза сохраняет накопительный ритм и координацию греческой фразы.
theological_decisions:
- issue: 'Запрет искать пищу и питьё: отказ от обычного попечения или запрет тревожной поглощённости'
  choice: Прямой запрет тревожно сосредоточиваться на еде и питье
  alternative: Запрет всякого планирования пропитания или призыв к безразличию к телесным нуждам
  rationale: Контекст говорит о тревоге из-за необходимых материальных благ, а не отрицает допустимость повседневного попечения или ценность пищи и питья. Формулировка сохраняет напряжённую прямоту повеления, не превращая его в аскетическое предписание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис близок к греческому, но остаётся понятным; «не пребывайте в тревоге» избегает как разговорной упрощённости, так и архаизма.
