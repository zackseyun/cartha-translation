source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: ru
  text: И кто из вас, тревожась, может прибавить к сроку своей жизни один локоть?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прибавить к своему росту один локоть». Локоть — древняя мера длины, приблизительно 45 см.'
    reason: Греческое ἡλικία может означать продолжительность жизни, возраст или физический рост; в данном контексте основным выбран смысл продолжительности жизни, но альтернативное понимание сохраняется в сноске. Πῆχυς буквально обозначает локоть как меру длины.
lexical_decisions:
- source_word: μεριμνῶν
  choice: тревожась
  rationale: Передаёт продолжающееся беспокойство или тревогу естественным современным русским выражением.
- source_word: ἡλικία
  choice: срок своей жизни
  rationale: Слово может означать возраст, продолжительность жизни или рост; в контексте заботы о жизни наиболее естественно понимание продолжительности жизни, при сохранении альтернативы в сноске.
- source_word: πῆχυν
  choice: локоть
  rationale: Сохранена конкретная древняя мера длины и образная напряжённость высказывания.
- source_word: δύναται ... προσθεῖναι
  choice: может прибавить
  rationale: Точно и естественно передаёт способность что-либо добавить.
theological_decisions:
- issue: Значение выражения ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι πῆχυν
  choice: прибавить к сроку своей жизни хотя бы локоть
  alternative: прибавить к своему росту хотя бы локоть
  rationale: Контекст говорит о тревоге за жизнь, поэтому выбран временной смысл ἡλικία; поскольку сочетание с мерой длины намеренно образно и допускает смысл роста, эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос передан просто и достойно. Частица «хотя бы» естественно выражает подразумеваемую малость добавления, не устраняя образность оригинала.
