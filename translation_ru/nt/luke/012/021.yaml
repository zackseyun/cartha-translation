  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: ru
  text: Так бывает с тем, кто копит сокровища для себя, но не богат перед Богом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не богат по отношению к Богу»; греческое выражение буквально указывает на направленность к Богу.'
    reason: Лексико-синтаксическая альтернатива для εἰς θεόν.
lexical_decisions:
- source_word: οὕτως
  choice: Так бывает с
  rationale: Оборот подводит итог предшествующей притче и естественно вводит её применение к человеку такого рода.
- source_word: ὁ θησαυρίζων
  choice: тем, кто копит сокровища
  rationale: Субстантивированное причастие обозначает всякого человека, для которого характерно это действие; «копит сокровища» сохраняет образ накопления и связь с существительным «сокровища».
- source_word: ἑαυτῷ
  choice: для себя
  rationale: Дательный возвратного местоимения выражает направленность накопленного на собственную пользу.
- source_word: καὶ μὴ
  choice: но не
  rationale: Хотя καί обычно означает «и», в русском противопоставление двух направленностей — для себя и для Бога — естественно передаётся союзом «но» без изменения смысла.
- source_word: εἰς θεὸν
  choice: для Бога
  rationale: При πλουτέω предлог εἰς выражает направленность или отношение. «Для Бога» звучит естественно по-русски, при этом возможное значение оценки перед Богом отмечено в сноске.
- source_word: πλουτῶν
  choice: богатеет
  rationale: Настоящее причастие передано личной формой глагола, естественной в русском придаточном и сохраняющей процессуальный оттенок.
theological_decisions:
- issue: Обобщённое обозначение человека формой мужского рода
  choice: тем, кто
  alternative: с мужчиной, который
  rationale: Греческое причастие мужского рода употреблено обобщённо и не ограничивает применение изречения мужчинами; русское «кто» точно и естественно сохраняет универсальность.
- issue: Смысл выражения πλουτῶν εἰς θεόν
  choice: не богатеет для Бога
  alternative: не богат перед Богом
  rationale: Основной текст сохраняет направленность, выраженную εἰς, и не поясняет, в чём именно состоит такое богатство. Альтернативное понимание как оценки перед Богом вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, афористичная и понятная, с сохранением образа сокровищ и богословской открытости заключительной фразы.
