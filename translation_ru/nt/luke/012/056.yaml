  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: ru
  text: Лицемеры! Вы умеете судить по виду земли и неба, а как же вы не умеете судить об этом времени?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этой поры»; возможный смысл: «этого решающего момента». Греческое καιρός может обозначать особое, подходящее или решающее время, а не время вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Лицемеры
  rationale: Прямое обращение с обличением; в данном контексте слово обозначает нравственное притворство, а не актёрство в буквальном смысле.
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: вид земли и неба
  rationale: Πρόσωπον здесь означает видимый облик; «вид земли и неба» естественно передаёт выражение и контекст наблюдения за погодными признаками.
- source_word: οἴδατε δοκιμάζειν
  choice: умеете распознавать
  rationale: Сочетание выражает способность посредством наблюдения оценить и верно распознать признаки. «Умеете распознавать» сохраняет повтор в обеих частях стиха.
- source_word: τὸν δὲ καιρὸν τοῦτον
  choice: этого времени
  rationale: Καιρός может обозначать не просто течение времени, а особый, значимый момент; основной текст не конкретизирует значение сверх греческого.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: а как же … не распознаёте?
  rationale: Такая конструкция передаёт негодование риторического вопроса и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Значение καιρός в обличении Иисуса
  choice: этого времени
  alternative: этого решающего момента; этой поры
  rationale: Формулировка сохраняет возможность понимать время как значимый период служения Иисуса и действия Бога, но не вводит это истолкование непосредственно в основной текст.
translation_notes:
  register: Современный литературный русский; обращение резкое и прямое, синтаксис риторического вопроса естественный и достойный. Повтор «распознавать» сохраняет словесную связь двух частей греческого текста.
