  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: ru
  text: Когда же вас приведут в синагоги, к начальствам и властям,[a] не тревожьтесь о том, как вам защищаться или что сказать в свою защиту, или что говорить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Синагоги, начальства и власти — религиозные и гражданские инстанции, перед которыми учеников могли подвергнуть разбирательству.
    reason: cultural_note
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Когда же
  rationale: ὅταν обозначает неопределённое будущее обстоятельство, а δέ мягко продолжает и оттеняет ход речи; «когда же» естественно передаёт оба элемента.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: вас приведут
  rationale: В данном судебном контексте глагол означает, что учеников приведут для разбирательства; неопределённо-личная конструкция сохраняет неуказанный субъект греческого глагола.
- source_word: ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: в синагоги, к начальствам и властям
  rationale: ἐπί с винительным указывает на приведение к соответствующим религиозным и гражданским инстанциям. Разные русские предлоги обеспечивают естественную сочетаемость, не устраняя различий между тремя названиями.
- source_word: συναγωγάς
  choice: синагоги
  rationale: Сохранено прямое значение слова; в контексте синагоги выступают также местом или органом разбирательства.
- source_word: ἀρχάς
  choice: начальствам
  rationale: Здесь слово обозначает правящие структуры или должностные инстанции. «Начальства» сохраняет отдельный термин и хорошо сочетается с «властями».
- source_word: ἐξουσίας
  choice: властям
  rationale: Передаёт органы или лица, наделённые полномочиями, и сохраняет широкий смысл греческого существительного.
- source_word: μὴ μεριμνήσητε
  choice: не тревожьтесь
  rationale: Запрет относится к беспокойной, заранее поглощающей заботе; «не тревожьтесь» звучит современно и достойно.
- source_word: πῶς ἢ τί ἀπολογήσησθε
  choice: как вам защищаться
  rationale: ἀπολογέομαι имеет судебный смысл «говорить в свою защиту». По-русски «как вам защищаться» естественно включает способ защиты; вариант чтения с τί отражён в примечании из-за текстовой неоднозначности.
- source_word: ἢ τί εἴπητε
  choice: или что говорить
  rationale: Отдельно передаёт содержание речи и сохраняет различие между защитой и тем, что ученики скажут.
theological_decisions:
- issue: Характер обещанной помощи при допросе
  choice: Сохранён запрет заранее тревожиться о защите и речи без уточнения механизма этой помощи.
  alternative: Истолковать стих как запрет всякой подготовки к любому религиозному выступлению.
  rationale: Сам стих говорит о приведении к религиозным и гражданским властям; более широкое доктринальное обобщение не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. Синтаксис упрощён без утраты судебного контекста; термин «синагоги» сохранён буквально, а его институциональная функция пояснена в сноске.
