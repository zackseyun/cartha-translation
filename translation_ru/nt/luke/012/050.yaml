    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: крещение
  rationale: Сохраняет явный образ крещения и не подменяет метафору толкованием «страдание» или «смерть».
- source_word: ἔχω βαπτισθῆναι
  choice: Мне предстоит креститься крещением
  rationale: Передаёт предстоящее и необходимое событие, сохраняя намеренный повтор однокоренных слов βάπτισμα и βαπτισθῆναι.
- source_word: πῶς
  choice: как
  rationale: Сохраняет восклицательную конструкцию, выражающую силу внутреннего переживания.
- source_word: συνέχομαι
  choice: Я томлюсь
  rationale: Естественно передаёт сильное внутреннее напряжение, не сводя многозначный глагол только к скорби или страху.
- source_word: ἕως ὅτου
  choice: пока
  rationale: Естественно обозначает временной предел продолжающегося состояния.
- source_word: τελεσθῇ
  choice: оно не совершится
  rationale: Передаёт пассивное завершение предстоящего события и его осуществление, не заимствуя формулировку из Ин. 19:30.
theological_decisions:
- issue: Метафорическое значение «крещения»
  choice: Сохранить образ крещения в основном тексте, пояснив вероятную связь с предстоящими страданиями и смертью Иисуса в сноске.
  alternative: Передать непосредственно как «страдания» либо понимать как буквальное водное крещение.
  rationale: Контекст указывает на грядущие страдания Иисуса, однако исходный текст намеренно выражает это через метафору крещения; перевод не должен устранять эту образную и богословскую напряжённость.
- issue: Оттенок συνέχομαι
  choice: Передать как «томлюсь», сохранив внутреннее напряжение и тягостное ожидание.
  alternative: «Я стеснён», «Я охвачен», «Я под давлением».
  rationale: Греческий глагол допускает оттенки сдерживания, охваченности и давления. «Томлюсь» звучит естественно по-русски и не делает переживание более определённым, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Однокоренной повтор «креститься крещением» сохранён намеренно как значимая особенность греческого текста; «томлюсь» обеспечивает понятность без чрезмерного уточнения эмоции.
