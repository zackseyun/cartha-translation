id: LUK.12.16
reference: Luke 12:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: ru
  text: 'И Он рассказал им притчу: «У одного богатого человека земля принесла обильный урожай.[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хорошо уродила»; «дала богатый урожай».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: И Он рассказал
  rationale: δέ передано мягкой повествовательной связкой «и», без усиления противопоставления; при прямом дополнении παραβολή по-русски естественно сказать «рассказал притчу».
- source_word: παραβολὴν
  choice: притчу
  rationale: «Притча» — устоявшийся и точный русский термин для данного евангельского жанра.
- source_word: πρὸς αὐτοὺς
  choice: им
  rationale: Адресат естественно выражен дательным падежом при глаголе «рассказал».
- source_word: λέγων
  choice: двоеточие перед прямой речью
  rationale: Причастие вводит содержание притчи; в современном русском его естественно передать пунктуационным переходом к прямой речи, избегая тяжеловесного «говоря».
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: у одного богатого человека
  rationale: Оборот сохраняет неопределённо-повествовательное значение τινός и принадлежность земли богатому человеку, звуча естественно по-русски.
- source_word: εὐφόρησεν
  choice: принесла обильный урожай
  rationale: Глагол означает, что земля хорошо уродила или дала много плодов; выбранная формулировка ясна в земледельческом контексте.
- source_word: ἡ χώρα
  choice: земля
  rationale: В контексте имеется в виду сельскохозяйственная земля, принадлежавшая человеку, а не страна или область.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, с сохранением традиционного термина «притча». Местоимение «Он» написано с прописной буквы как уважительное обозначение Иисуса, без добавления имени, отсутствующего в данном стихе.
