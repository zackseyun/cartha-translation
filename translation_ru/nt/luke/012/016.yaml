  source_fidelity: 'Текст точно передаёт греческий смысл: Иисус обращается к слушателям с притчей, а сельскохозяйственная земля некоего богатого человека даёт обильный урожай. Оборот «у одного богатого человека земля» естественно выражает принадлежность, передаваемую родительным падежом Ἀνθρώπου τινὸς πλουσίου. «Принесла обильный урожай» адекватно передаёт εὐφόρησεν.'
