  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: ru
  text: чтобы вы не так быстро теряли ясность мысли и не приходили в смятение — ни через духа, ни через устное сообщение, ни через письмо, будто бы от нас, — с утверждением, что день Господа уже наступил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «уже здесь». Греческий перфект может передавать утверждение, что день Господа уже наступил и теперь присутствует.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: так быстро
  rationale: Передаёт наречие как характеристику поспешной реакции адресатов, а не как указание на близость события.
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: вы не теряли… здравого рассудка
  rationale: Естественная русская передача образного выражения о том, что человека выводят из устойчивого состояния ума; она сохраняет смысл душевной и мыслительной неустойчивости без неясного буквального оборота «поколебать от ума».
- source_word: θροεῖσθαι
  choice: приходили в смятение
  rationale: Передаёт сильную тревогу и внутреннее волнение, не усиливая значение до панического страха.
- source_word: πνεύματος
  choice: духа
  rationale: Сохраняет буквальную и намеренно неоднозначную форму греческого существительного без артикля; вероятный смысл заявленного духовного или пророческого откровения указан в сноске.
- source_word: λόγου
  choice: устного сообщения
  rationale: В ряду с духом и письмом λόγος естественно обозначает произнесённое сообщение или учение; уточнение «устного» ясно передаёт противопоставление письму.
- source_word: ἐπιστολῆς ὡς δι’ ἡμῶν
  choice: письма, якобы от нас
  rationale: Передаёт письменное послание, ложно приписываемое Павлу и его сотрудникам, современным и естественным русским оборотом.
- source_word: ὡς ὅτι
  choice: с утверждением, будто
  rationale: Явно вводит содержание распространяемого утверждения и сохраняет дистанцию автора от его истинности.
- source_word: ἐνέστηκεν
  choice: уже наступил
  rationale: Перфект обозначает заявленное наступление дня с сохраняющимся результатом — то есть утверждение, что этот день уже здесь; более буквальная возможность приведена в сноске.
- source_word: ἡ ἡμέρα τοῦ κυρίου
  choice: день Господа
  rationale: Передаёт устойчивое эсхатологическое выражение и не смешивает его с обозначением еженедельного дня поклонения.
theological_decisions:
- issue: Значение ἐνέστηκεν в эсхатологическом утверждении
  choice: уже наступил
  alternative: уже настал и теперь присутствует
  rationale: Греческий перфект совмещает наступление события с его нынешней реальностью. Основной текст естественно выражает это через «уже наступил», а сноска сохраняет аспект присутствия, важный для толкования.
- issue: Значение πνεύματος среди предполагаемых источников вести
  choice: духа
  alternative: духовного изречения или пророческого откровения
  rationale: Форма без артикля не требует понимания как прямой ссылки на Святого Духа. Буквальный вариант сохраняет неоднозначность, а вероятный контекстуальный смысл вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным регистром. Оборот «не теряли здравого рассудка» естественно передаёт идиому ἀπὸ τοῦ νοὸς; параллель «не приходили в смятение» сохраняет различие между мыслительной неустойчивостью и эмоциональной тревогой. Тире помогает ясно оформить трёхчастный перечень предполагаемых источников.
