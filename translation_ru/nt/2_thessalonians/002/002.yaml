  source_fidelity: 'Основной смысл передан точно: предостережение не поддаваться скорому умственному потрясению и тревоге вследствие предполагаемого духовного сообщения, устной вести или письма, приписываемых апостольской группе, с утверждением о уже наступившем дне Господа. Однако «терять здравый рассудок» в современном русском обычно означает утрачивать вменяемость и поэтому заметно сильнее греческого образа «быть поколебленным в уме».'
  naturalness: «Терять ясность мысли» — естественный современный литературный оборот, передающий утрату устойчивости или ясности суждения без коннотации безумия. «Через» удачно выражает ряд каналов/источников сообщения. Пунктуация с тире позволяет отнести «будто бы от нас» ко всему предшествующему ряду, не искусственно ограничивая это определение одним письмом.
