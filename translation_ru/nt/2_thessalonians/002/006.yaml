  verdict: revise
  source_fidelity: 'Нужна правка глагола «открылся»: ἀποκαλυφθῆναι — аористный пассивный инфинитив («быть явленным/раскрытым»), тогда как «открылся» в русском обычно звучит как возвратное действие самого лица и ослабляет пассивный залог оригинала. Нейтральное «что удерживает его» точно передаёт τὸ κατέχον и сохраняет неопределённость относительно удерживающей силы. «В своё время» допустимо передаёт ἐν τῷ ἑαυτοῦ καιρῷ.'
  naturalness: «И теперь вы знаете» и «что удерживает его» естественны для современного литературного русского и соответствуют сдержанному библейскому регистру. «Чтобы он был явлен» несколько книжное, но уместно в данном контексте и ясно передаёт пассивную форму; оно предпочтительнее двусмысленного «открылся».
  terminology: Терминологически не следует идентифицировать удерживающее начало. «Явлен» передаёт апокалиптический оттенок ἀποκαλύπτω без доктринального истолкования. Сноски корректно поясняют нейтральный средний род τὸ κατέχον и возможный оттенок καιρός.
