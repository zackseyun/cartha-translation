base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: ru
  text: И теперь вы знаете, что удерживает его[a], чтобы он был явлен в своё время[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что сдерживает его». В греческом тексте употреблено выражение среднего рода, и удерживающая сила здесь не названа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в назначенное ему время». Греческое выражение может указывать на подходящее или назначенное время.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατέχον
  choice: что удерживает его
  rationale: Субстантивированное причастие среднего рода передано безлично и без отождествления удерживающей силы. Дополнение «его» естественно восстанавливается из последующего αὐτόν и контекста.
- source_word: οἴδατε
  choice: вы знаете
  rationale: Глагольная форма имеет настоящее значение; прямой перевод естественно передаёт обращение Павла к уже известному читателям.
- source_word: εἰς τὸ ἀποκαλυφθῆναι
  choice: чтобы он открылся
  rationale: Оборот с артиклевым инфинитивом допускает целевое или результативное понимание; «чтобы» сохраняет эту смысловую связь и звучит естественно по-русски.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: в своё время
  rationale: Формулировка кратко передаёт принадлежность времени самому упомянутому лицу и не добавляет прямо не выраженного уточнения «назначенное».
- source_word: νῦν
  choice: теперь
  rationale: В данном рассуждении «теперь» естественно обозначает текущий момент и одновременно связывает стих с предыдущим контекстом.
- source_word: αὐτόν
  choice: он / его
  rationale: Местоименная отсылка сохранена без уточнения личности того, кому предстоит открыться.
theological_decisions:
- issue: Кто или что является удерживающей силой
  choice: 'Передать нейтрально: «что удерживает его», не называя удерживающую силу.'
  alternative: Римская власть; Святой Дух; ангельская сила; Божье определение или провидение.
  rationale: Сам стих не отождествляет удерживающее начало, а средний род τὸ κατέχον не позволяет переводчику безосновательно представить его конкретным лицом или силой.
- issue: Значение καιρός в эсхатологическом контексте
  choice: «в своё время»
  alternative: «в назначенное ему время»; «в надлежащее время»
  rationale: καιρός может обозначать назначенное или подходящее время, однако основной перевод сохраняет более широкую формулировку оригинала, а уточняющий смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и ясный, тон выдержанно-библейский. Неопределённость относительно удерживающей силы и оттенка значения времени сохранена.
