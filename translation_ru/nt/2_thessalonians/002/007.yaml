revisions:
- from: Ведь тайна беззакония уже действует. Только тот, кто теперь удерживает[a], будет удерживать до тех пор, пока не окажется в стороне[b].
  to: Ведь тайна беззакония уже действует; только тот, кто теперь удерживает[a], будет удерживать, пока не окажется вне среды[b].
  rationale: Исправлено только неудачное «в стороне». «Вне среды» ближе к ἐκ μέσου, не предполагает конкретного деятеля устранения и сохраняет спорную неоднозначность выражения. Примечание уточнено, чтобы объяснить буквальную основу основного перевода и сохранить альтернативы.
