    issue: «пока не окажется в стороне»
    rationale: Формулировка неестественно и неточно передаёт ἕως ἐκ μέσου γένηται. Она может означать лишь положение «сбоку» или неучастие, тогда как греческое выражение говорит о том, что удерживающий оказывается «из среды», то есть более не находится среди/на пути.
