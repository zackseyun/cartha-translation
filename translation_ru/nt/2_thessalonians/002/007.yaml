base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: ru
  text: Ведь тайна беззакония уже действует; только тот, кто теперь удерживает[a], будет удерживать, пока не окажется вне среды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто теперь сдерживает». Греческий текст не указывает, кто именно является удерживающим.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «пока не будет устранён» или «пока не будет убран с пути». Греческое выражение буквально: «пока не окажется вне среды»; оно менее определённо говорит о том, как это произойдёт.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: тайна
  rationale: Сохраняет характерное для Павла значение скрытой реальности, которая уже действует, а не просто загадки.
- source_word: ἐνεργεῖται
  choice: уже действует
  rationale: Естественно передаёт продолжающееся действие, уже совершающееся в настоящее время.
- source_word: ἀνομίας
  choice: беззакония
  rationale: Прямо передаёт ἀνομία и сохраняет связь с темой противления Божьему порядку в контексте.
- source_word: μόνον
  choice: только
  rationale: Передаёт ограничительный переход к следующей мысли; добавление «будет удерживать» восполняет греческий эллипсис для ясности по-русски.
- source_word: ὁ κατέχων
  choice: тот, кто теперь удерживает
  rationale: Передаёт субстантивированное причастие, не называя и не истолковывая личность удерживающего.
- source_word: ἄρτι
  choice: теперь
  rationale: Обозначает нынешнее время удерживающего действия.
- source_word: ἕως ἐκ μέσου γένηται
  choice: до тех пор, пока не окажется в стороне
  rationale: Передаёт достижение состояния «вне среды / с пути», не вводя явно внешнего деятеля, который его устраняет.
theological_decisions:
- issue: Личность ὁ κατέχων («удерживающего»)
  choice: Обозначить его нейтрально как «тот, кто теперь удерживает», не устанавливая его личность.
  alternative: Римская власть, человеческое правительство, Святой Дух, ангельское существо, Павел или апостольская проповедь.
  rationale: В этом стихе греческий текст не поясняет, кто именно удерживает; перевод сохраняет данную неопределённость.
- issue: Характер события в ἕως ἐκ μέσου γένηται
  choice: «пока не окажется в стороне» — формулировка без явного указания на деятеля устранения.
  alternative: «пока не будет устранён» или «пока не будет убран с пути».
  rationale: Греческое выражение обозначает выход из среды или устранение с пути, но не уточняет, происходит ли это по собственной воле или под действием иной силы.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексемой «беззаконие». Синтаксический эллипсис оригинала осторожно восполнен словами «будет удерживать», а спорная личность удерживающего и способ его ухода не конкретизированы.
