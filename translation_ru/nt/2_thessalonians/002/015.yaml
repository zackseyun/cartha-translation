  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: ru
  text: Итак, братья[a], стойте твёрдо и держитесь преданий, которым вас научили — устно или через наше послание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; по-гречески буквально «братья», но обращение, вероятно, относится ко всей общине.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Итак
  rationale: Сочетание выводных частиц подводит итог предшествующему рассуждению; «итак» естественно и ясно передаёт логический переход.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена форма обращения мужского рода, буквально соответствующая греческому слову; вероятное обращение ко всей общине пояснено в сноске.
- source_word: στήκετε
  choice: стойте твёрдо
  rationale: Настоящее повелительное наклонение призывает к продолжающейся стойкости; выражение передаёт и образ стояния, и значение непоколебимости.
- source_word: κρατεῖτε
  choice: держитесь
  rationale: Глагол означает крепко сохранять и не оставлять; «держитесь» естественно сочетается с объектом «преданий» и сохраняет силу призыва.
- source_word: τὰς παραδόσεις
  choice: преданий
  rationale: «Предания» непосредственно передаёт смысл того, что было передано другим, и сохраняет связь с последующим указанием на устную и письменную передачу.
- source_word: ἃς ἐδιδάχθητε
  choice: которым вы были научены
  rationale: Пассивная конструкция сохраняет акцент на адресатах как получателях наставления.
- source_word: εἴτε διὰ λόγου
  choice: устно
  rationale: В противопоставлении посланию λόγος обозначает устную передачу; наречие ясно и естественно выражает этот смысл по-русски.
- source_word: εἴτε δι’ ἐπιστολῆς ἡμῶν
  choice: или через наше послание
  rationale: Формулировка сохраняет значение средства передачи и притяжательное ἡμῶν, не уточняя сверх текста, идёт ли речь об одном конкретном письме или письме от апостольских служителей.
theological_decisions:
- issue: Передача παράδοσις в тексте, связанном с позднейшими спорами об апостольском предании
  choice: преданий
  alternative: учений; наставлений
  rationale: «Предания» точнее сохраняет значение переданного содержания и охватывает названные в стихе устную и письменную формы. Перевод не распространяет утверждение стиха на более поздние традиции и не разрешает конфессиональные споры.
- issue: Обращение ἀδελφοί к общине, вероятно включавшей мужчин и женщин
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматическую форму оригинала, а вероятный охват всей общины отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и увещевательным звучанием. Синтаксис близок к греческому, но контраст устной и письменной передачи выражен естественно для русского читателя.
