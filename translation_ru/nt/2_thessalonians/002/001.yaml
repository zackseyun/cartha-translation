source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: ru
  text: 'Что же касается пришествия нашего Господа Иисуса Мессии[a] и нашего собрания к Нему, то просим вас, братья[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческий титул Χριστός здесь переведён как «Мессия», чтобы передать его значение.'
    reason: alternative_reading
  - marker: b
    text: «Братья» — форма обращения Павла; в данном контексте он, вероятно, обращается ко всей общине верующих, включая женщин.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: просим вас
  rationale: Глагол вводит пастырскую просьбу, а не приказ. «Просим вас» естественно передаёт его мягкую побудительную силу.
- source_word: δὲ
  choice: что же касается… то
  rationale: Частица отмечает переход к новой, связанной теме. Русская конструкция передаёт этот переход без добавления временного значения «теперь» и одновременно естественно вводит оборот с ὑπέρ.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена мужская форма обращения, соответствующая греческому тексту; вероятный охват всей общины пояснён в сноске.
- source_word: ὑπὲρ
  choice: что касается
  rationale: Здесь предлог вводит предмет последующей просьбы, а не выражает значение «ради» или «за».
- source_word: παρουσίας
  choice: пришествия
  rationale: В данном эсхатологическом контексте παρουσία обозначает будущее явление и прибытие Господа; «пришествие» ясно и сохраняет устойчивое новозаветное значение.
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняется титул, выражающий власть Иисуса и его новозаветное богословское значение.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет прозрачную функцию титула, поэтому передано смысловым соответствием «Мессия», а традиционное «Христос» указано как допустимый вариант.
- source_word: ἐπισυναγωγῆς
  choice: собирания
  rationale: Слово обозначает собирание верующих вместе. Отглагольное существительное сохраняет параллель с «пришествием» и не придаёт выражению институционального смысла.
- source_word: ἐπ’ αὐτόν
  choice: к Нему
  rationale: Предлог с винительным падежом при ἐπισυναγωγή выражает направленность к Иисусу; «к Нему» сохраняет это движение и не заменяет его более определённым толкованием «вокруг Него» или «с Ним».
theological_decisions:
- issue: Передача титула Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В сочетании «Господь Иисус Мессия» титульный смысл остаётся активным. Основной текст передаёт значение титула, а традиционная форма отмечена в сноске.
- issue: Объём обращения ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматически мужскую форму источника, не исключая того, что Павел обращается ко всей общине; это поясняется в сноске.
- issue: Связь между пришествием Господа и собиранием верующих
  choice: два однородно соединённых понятия без уточнения их точного соотношения
  alternative: собирание верующих во время пришествия; собирание как пояснение пришествия
  rationale: Греческий текст соединяет оба существительных союзом καί под управлением ὑπέρ, но не определяет их точную временную или логическую связь. Перевод не вводит конкретную эсхатологическую схему.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского обращения. Конструкция «что же касается… то» естественно передаёт тематический переход и позволяет стиху грамматически продолжаться в следующем стихе; двоеточие показывает эту незавершённость. Несколько книжное «собирание к Нему» сохранено ради точности направления и параллельной именной структуры, без замены на богословски более определённое «соединение с Ним».
