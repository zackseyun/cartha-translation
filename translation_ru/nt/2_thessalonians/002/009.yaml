  text: οὗ ἐστιν ἡ παρουσία κατ’ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν ψεύδους
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/009.yaml
  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: ru
  text: Его пришествие происходит в соответствии с действием Сатаны и сопровождается всякой силой, знамениями и чудесами лжи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всякой силе, знамениях и чудесах лжи»; возможно также: «в обманных знамениях и чудесах».'
    reason: Сохраняет формальную структуру оригинала и отмечает неоднозначность родительного ψεύδους, не сводя явления к заведомо поддельным.
lexical_decisions:
- source_word: οὗ
  choice: Его
  rationale: Родительное относительное местоимение отсылает к «беззаконнику» в предыдущем стихе; русское притяжательное местоимение естественно связывает его с последующим словом «пришествие».
- source_word: παρουσία
  choice: пришествие
  rationale: В эсхатологическом контексте обозначает явление или прибытие лица; «пришествие» сохраняет традиционный библейский оттенок и понятно современному читателю.
- source_word: κατ’ ἐνέργειαν τοῦ Σατανᾶ
  choice: совершается действием сатаны
  rationale: Передаёт соответствие пришествия действенной активности сатаны и естественно звучит по-русски, не сводя ἐνέργεια лишь к намерению или влиянию.
- source_word: ἐν πάσῃ δυνάμει
  choice: сопровождается всякой силой
  rationale: ἐν вводит обстоятельства или проявления, сопровождающие пришествие; «всякой силой» сохраняет широту πάσῃ и не сужает δύναμις до одних чудес.
- source_word: σημείοις
  choice: знамениями
  rationale: Обычный новозаветный эквивалент для явлений, служащих знаками или притязающих на удостоверяющую силу.
- source_word: τέρασιν
  choice: чудесами
  rationale: Естественный русский эквивалент в устойчивой паре «знамения и чудеса», обозначающий поразительные явления.
- source_word: ψεύδους
  choice: лжи
  rationale: Родительный падеж сохраняет широкую связь с рядом «сила, знамения и чудеса» и не решает заранее, являются ли эти явления мнимыми либо реальными, но служащими обману.
theological_decisions:
- issue: Природа проявлений, связанных с сатаной
  choice: «силой, знамениями и чудесами лжи»
  alternative: «ложными чудесами» или «обманными чудесами»
  rationale: Греческий текст характеризует явления через ψεύδους, но не объясняет, полностью ли они поддельны или представляют собой реальные сверхъестественные проявления, используемые для обмана. Родительная конструкция сохраняет эту напряжённость.
- issue: Отношение пришествия беззаконника к действию сатаны
  choice: «совершается действием сатаны»
  alternative: «соответствует действию сатаны»
  rationale: Формулировка передаёт деятельное участие сатаны, не утверждая сверх текста полного тождества между пришествием и сатанинским действием.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («пришествие», «знамения»). Структура сделана естественной для русского синтаксиса, при этом неоднозначность выражения «чудеса лжи» сохранена.
