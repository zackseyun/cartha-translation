source:
  edition: SBLGNT
  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: ru
  text: и со всяким неправедным обманом — для погибающих,[a] потому что они не приняли любви к истине,[b] чтобы быть спасёнными.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди погибающих»; также возможно: «по отношению к погибающим».'
    reason: Дательный оборот τοῖς ἀπολλυμένοις допускает оттенки адресата, сферы или отношения.
  - marker: b
    text: 'Букв.: «любви истины»; по смыслу — любви к истине. «Не приняли» можно также перевести как «не восприняли» или «не приветствовали».'
    reason: Сноска сохраняет форму греческого родительного падежа и отмечает смысловой диапазон ἐδέξαντο.
  - marker: c
    text: 'Или: «чтобы они были спасены».'
    reason: Более явно воспроизводит подлежащее αὐτούς и пассивную форму σωθῆναι.
lexical_decisions:
- source_word: ἀπάτῃ ἀδικίας
  choice: неправедным обманом
  rationale: Сочетание передаёт обман, характеризуемый неправедностью; в современном русском прилагательное звучит естественнее буквального «обманом неправедности» и сохраняет нравственно-богословский смысл ἀδικία.
- source_word: τοῖς ἀπολλυμένοις
  choice: для погибающих
  rationale: Дательный падеж обозначает людей, в отношении которых действует обман. «Погибающих» сохраняет процессуальный оттенок причастия настоящего времени и не превращает его в предрешённый ярлык.
- source_word: ἀνθ’ ὧν
  choice: потому что
  rationale: В данном контексте оборот указывает на основание происходящего; причинная связь ясно и естественно выражается словами «потому что».
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: любви к истине
  rationale: 'Родительный τῆς ἀληθείας вероятнее всего имеет объектное значение: речь о любви, направленной к истине. Русское «любовь истины» неестественно и может ошибочно восприниматься как любовь, исходящая от истины.'
- source_word: ἐδέξαντο
  choice: не приняли
  rationale: δέχομαι допускает значения «принимать», «получать», «приветствовать». «Не приняли» естественно сочетается с абстрактным дополнением и передаёт осознанное неприятие.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: чтобы спастись
  rationale: Конструкция с εἰς и субстантивированным инфинитивом выражает цель или предполагаемый результат. Русская конструкция с «чтобы» сохраняет этот оттенок; возвратная форма естественно передаёт пассивное «быть спасёнными» без указания действующего лица.
theological_decisions:
- issue: Следует ли понимать «погибающих» как предопределённую категорию или как продолжающееся состояние?
  choice: погибающих
  alternative: обречённых; тех, кто подвергается уничтожению
  rationale: Причастие настоящего времени ἀπολλυμένοις изображает продолжающееся состояние или процесс. Перевод не добавляет идеи неизменного предрешения и сохраняет богословское напряжение текста.
- issue: Означает ли τῆς ἀληθείας любовь к истине или любовь, исходящую от истины?
  choice: любви к истине
  alternative: любви истины
  rationale: Контекст отказа принять истину убедительно поддерживает объектное понимание родительного падежа. При этом сноска отмечает более формальное воспроизведение конструкции, не представляя маловероятное чтение как основное.
- issue: Выражает ли εἰς τὸ σωθῆναι цель или результат?
  choice: чтобы спастись
  alternative: так что они могли бы быть спасены
  rationale: Греческая конструкция допускает целевой и результативный оттенки. «Чтобы спастись» сохраняет естественную для контекста целевую направленность, не уточняя механизм спасения.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис сохраняет зависимость стиха от предыдущего контекста начальным «и». Выражение «неправедный обман» предпочтено тяжеловесному «обман неправедности», а «любовь к истине» — неестественному и двусмысленному «любовь истины».
