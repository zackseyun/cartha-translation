source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: ru
  text: который противится и превозносится над всем, что называется богом или предметом поклонения, так что восседает в храме Божьем[a], представляя себя Богом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в святилище Божьем».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «представляя себя богом».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: который противится
  rationale: Субстантивированное причастие настоящего времени передано относительным оборотом, сохраняющим продолжающийся характер противодействия и не превращающим выражение в отсутствующий в греческом тексте особый титул.
- source_word: ὑπεραιρόμενος
  choice: превозносится над
  rationale: Возвратная форма естественно передаёт самовозвышение, а сочетание с «над» выражает заявленное превосходство.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: над всем, что называется богом
  rationale: 'Так сохраняются и значение превосходства при ἐπί с винительным, и дистанцирующий смысл λεγόμενον: речь идёт обо всём, что именуют богом, без признания его божественности.'
- source_word: σέβασμα
  choice: предмет поклонения
  rationale: Слово обозначает почитаемый религиозный объект в широком смысле, не обязательно божество; выбранный вариант ясен современному читателю.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι
  choice: садится в храме Божьем
  rationale: Русское «садится в» естественно передаёт результат движения, выраженного εἰς, и само действие καθίσαι. «Храм» остаётся ясным и не решает вопрос о буквальном или образном смысле образа.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: представляя себя
  rationale: Выражение передаёт публичное предъявление себя в определённом качестве, не сужая смысл до устного провозглашения и не добавляя прямо отсутствующее слово «выдавая».
- source_word: ὅτι ἔστιν θεός
  choice: Богом
  rationale: В контексте храма Божьего заключительная фраза выражает высшее божественное притязание. Творительный падеж после «представляя себя» естественно воспроизводит греческую конструкцию.
theological_decisions:
- issue: Передавать ли конечное θεός как «Бог» или «бог»
  choice: Бог
  alternative: бог
  rationale: Контекст — пребывание в храме Божьем и кульминационное самопредставление — поддерживает притязание на положение Бога. Однако отсутствие артикля допускает понимание «бог», поэтому оно сохранено в сноске.
- issue: Передавать ли ναός как «храм» или более узко как «святилище»
  choice: храм
  alternative: святилище
  rationale: «Храм Божий» — естественное и понятное русское выражение; оно не предрешает, имеется ли в виду внутреннее святилище, весь храмовый образ или метафорическая священная сфера.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет единство греческой фразы, но остаётся понятным обычному читателю; толковательные титулы и конфессионально обусловленные уточнения не добавлены.
