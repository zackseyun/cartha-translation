  text: И по этой причине Бог посылает им действие заблуждения[a], чтобы они поверили лжи,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводящее в заблуждение воздействие», «действие обмана»; в английской традиции: «сильное заблуждение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: по этой причине
  rationale: Передаёт явную причинную связь с предшествующим отказом принять любовь к истине, не сводя оборот к одному лишь выводу «поэтому».
- source_word: πέμπει
  choice: посылает
  rationale: Прямо передаёт настоящее время и действие Бога как подлежащего, не ослабляя его до позволения или попущения.
- source_word: ἐνέργειαν πλάνης
  choice: действие заблуждения
  rationale: 'Сохраняет два существительных и неоднозначность греческого сочетания: речь может идти как о действенной силе, вводящей в заблуждение, так и о действии, характеризуемом заблуждением.'
- source_word: εἰς τὸ πιστεῦσαι
  choice: чтобы они поверили
  rationale: Естественно передаёт целевое или результативное значение конструкции, не проводя более жёсткого различия, чем позволяет греческий текст.
- source_word: τῷ ψεύδει
  choice: лжи
  rationale: Глагол «поверить» естественно управляет дательным падежом. Слово «ложь» сохраняет конкретность греческого существительного с артиклем, насколько это возможно без добавления отсутствующего в тексте указательного слова.
theological_decisions:
- issue: Божественное действие в суде над отвергшими истину
  choice: Бог посылает им действие заблуждения
  alternative: Бог допускает, чтобы на них подействовало заблуждение
  rationale: В греческом Бог прямо назван подлежащим глагола «посылает». Перевод не заменяет это действие простым дозволением и сохраняет напряжение между Божьим судом и предшествующим человеческим отвержением истины.
- issue: Цель или результат в εἰς τὸ πιστεῦσαι
  choice: чтобы они поверили
  alternative: так что они поверят
  rationale: Греческая конструкция допускает целевой и результативный оттенки. Русское «чтобы» сохраняет направленность действия, не устраняя полностью эту смысловую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского стиля. Выражение «действие заблуждения» намеренно несколько формально: оно сохраняет структуру и смысловую неоднозначность ἐνέργειαν πλάνης; более естественные, но более истолковывающие варианты вынесены в сноску.'
