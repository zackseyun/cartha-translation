  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: ru
  text: И тогда откроется беззаконник, которого Господь Иисус убьёт дыханием Своих уст[a] и сведёт на нет явлением Своего пришествия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом Своих уст». Греческое слово может означать и «дыхание», и «дух»; в данном обороте наиболее естественно значение «дыхание».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «явлением Своего присутствия». В этом контексте греческое παρουσία обычно означает «пришествие», хотя в его смысловой диапазон входит и «присутствие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: откроется
  rationale: Будущее пассивное указывает, что беззаконник станет явным. Русская возвратная форма естественно передаёт этот пассив, не уточняя действующее лицо.
- source_word: ὁ ἄνομος
  choice: беззаконник
  rationale: Субстантивированное прилагательное обозначает известную из контекста фигуру. «Беззаконник» кратко и естественно передаёт смысл, не добавляя отсутствующего здесь слова «человек».
- source_word: ὁ κύριος Ἰησοῦς
  choice: Господь Иисус
  rationale: Сохраняет титул κύριος и личное имя в принятой новозаветной форме.
- source_word: ἀνελεῖ
  choice: убьёт
  rationale: В данном контексте глагол означает лишение жизни; «убьёт» ясно и точно передаёт его силу без архаизации.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: дыханием Своих уст
  rationale: В этом обороте πνεῦμα естественнее всего означает «дыхание»; формулировка также сохраняет образ пророческого суда, созвучный Ис 11:4. Возможное значение «дух» вынесено в примечание.
- source_word: καταργήσει
  choice: упразднит
  rationale: Передаёт решительное лишение силы и прекращение действия, не сводя значение лишь к физическому уничтожению.
- source_word: τῇ ἐπιφανείᾳ
  choice: явлением
  rationale: Передаёт видимое обнаружение или проявление без добавления толкования о сиянии.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: Своего пришествия
  rationale: В эсхатологическом контексте παρουσία обычно обозначает приход Христа; «пришествие» — ясный и устоявшийся русский эквивалент. Более буквальное «присутствие» отмечено в примечании.
theological_decisions:
- issue: Обозначение эсхатологического противника
  choice: беззаконник
  alternative: беззаконный; человек беззакония
  rationale: В самом стихе стоит субстантивированное ὁ ἄνομος, а не более полное выражение из ближайшего контекста. Перевод не добавляет отсутствующее здесь слово «человек» и не уточняет личность фигуры.
- issue: Средство победы Господа Иисуса
  choice: дыханием Своих уст
  alternative: духом Своих уст
  rationale: «Дыхание» наиболее естественно в данном образном обороте и вероятной перекличке с Ис 11:4, однако допустимое значение πνεῦμα «дух» сохранено в примечании.
- issue: Характер окончательного поражения противника
  choice: упразднит
  alternative: лишит силы; уничтожит
  rationale: καταργέω подчёркивает лишение действенности и прекращение, поэтому перевод сохраняет смысл решительного устранения, не утверждая точнее, чем греческий текст, характер этого уничтожения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис следует греческому ходу мысли, но остаётся естественным; заглавное «Своих/Своего» использовано по русской традиции при отнесении к Господу Иисусу.
