  text: Разве вы не помните, что, когда я ещё был у вас, я говорил вам обо всём этом?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: помните
  rationale: Настоящее время в риторическом вопросе обращено к сохраняющейся памяти читателей; «помните» естественно передаёт этот смысл.
- source_word: ἔτι
  choice: ещё
  rationale: 'Наречие указывает на продолжавшееся тогда обстоятельство: Павел в то время ещё находился среди адресатов.'
- source_word: ὢν πρὸς ὑμᾶς
  choice: находясь у вас
  rationale: Оборот обозначает личное присутствие Павла среди фессалоникийцев; деепричастная конструкция сохраняет временную связь с главным глаголом.
- source_word: ταῦτα
  choice: об этом
  rationale: Греческое указательное местоимение формально имеет форму множественного числа («эти вещи»), но в современном русском контекстуальная отсылка к обсуждаемым вопросам естественно выражается собирательным «об этом».
- source_word: ἔλεγον
  choice: говорил
  rationale: Имперфект представляет действие как продолжавшееся или повторявшееся в прошлом; русское несовершенное «говорил» сохраняет эту аспектуальность.
- source_word: οὐ ... ὅτι
  choice: Неужели вы не помните, что…?
  rationale: «Что» вводит содержание воспоминания, а «неужели» естественно передаёт оттенок риторического вопроса с отрицанием.
