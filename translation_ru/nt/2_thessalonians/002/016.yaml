reference: 2 Thessalonians 2:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: ru
  text: Сам же Господь наш Иисус, Мессия, и Бог, Отец наш, возлюбивший нас и по благодати давший вечное ободрение[a] и добрую надежду,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечное утешение».'
    reason: Греческое παράκλησις может означать ободрение, утешение или поддержку. В данном контексте «ободрение» хорошо передаёт укрепляющий оттенок; «утешение» остаётся допустимой альтернативой.
lexical_decisions:
- source_word: Αὐτὸς δὲ
  choice: Сам же
  rationale: «Сам» передаёт усилительное употребление αὐτός, а частица «же» естественно обозначает мягкий переход δέ без добавления отсутствующего в греческом указания на время.
- source_word: κύριος ἡμῶν Ἰησοῦς Χριστός
  choice: Господь наш Иисус Мессия
  rationale: Сохраняются титул κύριος и смысл Χριστός как титула Мессии; порядок слов остаётся естественным для возвышенной современной русской речи.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Бог, Отец наш
  rationale: Приложение «Отец наш» сохраняет оба обозначения и ясно передаёт греческую конструкцию.
- source_word: ὁ ἀγαπήσας ἡμᾶς
  choice: возлюбивший нас
  rationale: Причастие сохраняет форму и совершённый характер действия, не вводя лишнего временного уточнения.
- source_word: δοὺς
  choice: давший
  rationale: Однородное причастие естественно соответствует аористному δοὺς и сохраняет связь с «возлюбивший».
- source_word: παράκλησιν αἰωνίαν
  choice: вечное ободрение
  rationale: «Ободрение» хорошо соответствует контексту укрепления верующих в следующем стихе; возможные значения утешения сохранены в сноске.
- source_word: ἐλπίδα ἀγαθὴν
  choice: добрую надежду
  rationale: Прямо передаёт положительную характеристику надежды без истолковывающего расширения.
- source_word: ἐν χάριτι
  choice: по благодати
  rationale: Передаёт благодать как основание и средство дара естественным русским библейским выражением.
theological_decisions:
- issue: Единственное число причастий при составном подлежащем «Господь наш Иисус Мессия и Бог, Отец наш»
  choice: 'Сохранить причастия в единственном числе: «возлюбивший… давший…»'
  alternative: Передать их множественным числом как явно относящиеся к обоим лицам либо прямо отнести только к Богу Отцу
  rationale: Греческий текст сочетает два названных субъекта с причастиями единственного числа. Русский перевод сохраняет эту синтаксическую особенность и не снимает её богословское напряжение поясняющим пересказом.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного благословения. Конечная запятая сохранена, поскольку синтаксически предложение продолжается в стихе 17.
