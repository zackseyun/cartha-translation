base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/017.yaml
  text: encourage your hearts and strengthen them in every good work and word[a][b].
translation:
  language: ru
  text: да ободрит[a] ваши сердца и укрепит[b] их во всяком добром деле и слове.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утешит»; это слово может также означать «увещевать».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утвердит» или «сделает стойкими».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: ободрит
  rationale: Глагол может означать ободрение, утешение или увещание. «Ободрит» сохраняет широкий смысл и перекликается с упоминанием вечного ободрения в предыдущем стихе, не сводя значение только к утешению или наставлению.
- source_word: καρδίας
  choice: сердца
  rationale: Сохраняется библейский образ внутреннего человека без сужения смысла до одних чувств или рассудка.
- source_word: στηρίξαι
  choice: укрепит
  rationale: Передаёт смысл придания твёрдости и устойчивости естественным современным русским словом; местоимение «их» указывает на названные ранее сердца.
- source_word: ἐν παντὶ
  choice: во всяком
  rationale: Предлог с дательным падежом обозначает сферу, в которой должно проявиться укрепление; единственное число сохраняет распределительный смысл.
- source_word: ἔργῳ
  choice: деле
  rationale: «Дело» естественно обозначает поступок или деятельность и образует краткую смысловую пару со «словом».
- source_word: λόγῳ
  choice: слове
  rationale: В параллели с «делом» речь идёт прежде всего о сказанном, причём «слово» сохраняет лаконичность оригинала.
- source_word: ἀγαθῷ
  choice: добром
  rationale: Прилагательное по смыслу относится и к делу, и к слову; форма единственного числа естественно согласуется с ближайшим существительным и охватывает всю пару.
- source_word: ὑμῶν
  choice: ваши
  rationale: Родительный местоимения при «сердцах» естественно передаётся русским притяжательным местоимением.
- source_word: καὶ
  choice: и
  rationale: Сохраняет прямое сочинение двух молитвенных пожеланий и двух существительных.
theological_decisions:
- issue: Передача καρδία современным психологическим термином или библейским образом
  choice: сердца
  alternative: внутреннего человека; мысли
  rationale: Библейский образ намеренно сохранён, поскольку он обозначает внутреннюю жизнь человека шире, чем только эмоции или интеллект.
- issue: Передача στηρίξαι как укрепления или утверждения
  choice: укрепит
  alternative: утвердит; сделает стойкими
  rationale: «Укрепит» естественно для современного русского языка и сохраняет идею придания твёрдости, не вводя дополнительного конфессионального оттенка.
- issue: Субъект молитвенного пожелания
  choice: не повторять субъект, сохранив зависимость от предыдущего стиха
  alternative: добавить «Он»
  rationale: В греческом тексте субъект в данном стихе явно не назван. Конструкция с «да» сохраняет связь с субъектом предыдущего предложения и не устраняет примечательную грамматическую напряжённость контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной конструкцией «да ободрит». Порядок «деле и слове» следует представленному греческому тексту. Все маркеры сносок размещены непосредственно после соответствующих слов.
