  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: ru
  text: чтобы были судимы все, кто не поверили истине, а нашли удовольствие в неправде.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были осуждены». В данном контексте греческий глагол может подразумевать осуждение, хотя буквально означает «были судимы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно связывает стих с предшествующим контекстом и сохраняет возможный оттенок как цели, так и результата, не уточняя его сверх греческого текста.
- source_word: κριθῶσιν
  choice: были судимы
  rationale: Пассивная форма κρίνω прежде всего обозначает подвергнуться суду. Контекст подразумевает неблагоприятный приговор, однако перевод «были осуждены» выражал бы это явнее, чем сам глагол.
- source_word: πάντες οἱ μὴ πιστεύσαντες
  choice: все, кто не поверил
  rationale: Субстантивированное причастие естественно передаётся относительным оборотом; совершенный вид «не поверил» соответствует аористу и хорошо звучит по-русски.
- source_word: τῇ ἀληθείᾳ
  choice: истине
  rationale: Дательный объект при πιστεύω естественно сохраняется в русском управлении «поверить истине»; определённость истины в данном контексте следует из контекста и не требует дополнительного слова.
- source_word: ἀλλὰ
  choice: а
  rationale: Передаёт резкое противопоставление неверия истине и положительного отношения к неправде; в данной русской конструкции «а» звучит естественнее, чем «но».
- source_word: εὐδοκήσαντες
  choice: нашёл удовольствие
  rationale: Передаёт не только одобрение, но и волевую, эмоциональную удовлетворённость неправдой. Единственное число согласуется с русской конструкцией «все, кто».
- source_word: τῇ ἀδικίᾳ
  choice: в неправде
  rationale: «Неправда» сохраняет широкий нравственный смысл ἀδικία и контраст с «истиной», не сужая значение до социальной несправедливости.
theological_decisions:
- issue: Передавать ли κριθῶσιν как «были судимы» или более определённо как «были осуждены»
  choice: были судимы
  alternative: были осуждены
  rationale: Контекст явно указывает на неблагоприятный исход, но κρίνω само по себе имеет более широкое значение суда. Основной текст сохраняет эту смысловую напряжённость, а возможное значение осуждения отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом. «Неправда» намеренно сохраняет лексический и смысловой контраст с «истиной». Маркер сноски помещён непосредственно после предложения.
