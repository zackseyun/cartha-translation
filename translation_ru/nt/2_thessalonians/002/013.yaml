id: 2TH.2.13
reference: 2 Thessalonians 2:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: ru
  text: Мы же должны всегда благодарить Бога за вас, братья[b], возлюбленные Господом, потому что Бог избрал вас как первые плоды[a] для спасения через освящение Духом[c] и веру в истину,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «избрал вас от начала для спасения». В основном тексте принято чтение ἀπαρχήν — «как первые плоды»; вариант отражает чтение ἀπ’ ἀρχῆς — «от начала».'
    reason: textual_variant
  - marker: b
    text: Греческое ἀδελφοί имеет форму мужского рода («братья»), но обращение могло относиться ко всей общине верующих, включая женщин.
    reason: cultural_note
  - marker: c
    text: 'Или: «через освящение духа». Греческое πνεύματος может относиться к Святому Духу или к человеческому духу; контекст скорее указывает на Святого Духа.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Мы же
  rationale: Частица δέ обозначает противопоставление предшествующему описанию погибающих, а явное ἡμεῖς придаёт местоимению смысловое ударение; русское «мы же» естественно передаёт оба оттенка.
- source_word: ὀφείλομεν
  choice: должны
  rationale: Передаёт нравственную обязанность и уместность постоянной благодарности, не усиливая значение до внешнего принуждения.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: всегда благодарить Бога за вас
  rationale: Естественная современная русская формулировка, точно передающая устойчивое выражение Павла.
- source_word: ἀδελφοὶ
  choice: братья
  rationale: Сохраняет грамматически мужское множественное число греческого обращения; возможное включение всей общины пояснено в сноске.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: возлюбленные Господом
  rationale: Причастная форма передаёт устойчивое состояние тех, кого любит Господь, и сохраняет тёплый, возвышенный характер обращения.
- source_word: εἵλατο
  choice: избрал
  rationale: Точно и естественно передаёт значение среднего залога αἱρέομαι — «выбрать, избрать», не добавляя конфессиональной трактовки избрания.
- source_word: ἀπαρχὴν
  choice: как первые плоды
  rationale: Передаёт образ первого урожая понятным современным языком. Разночтение ἀπ’ ἀρχῆς отражено в сноске.
- source_word: εἰς σωτηρίαν
  choice: для спасения
  rationale: Передаёт направленность или цель, выраженную εἰς с винительным падежом, яснее для современного читателя, чем архаичное «ко спасению».
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: через освящение Духом
  rationale: «Через» передаёт инструментальный оттенок ἐν; «освящение» сохраняет богословски значимое понятие ἁγιασμός. Контекст благоприятствует пониманию πνεῦμα как Святого Духа, но грамматическая неоднозначность отмечена в сноске.
- source_word: καὶ πίστει ἀληθείας
  choice: и веру в истину
  rationale: Родительный падеж ἀληθείας естественно понимается как объект веры; русское «вера в истину» передаёт это без лишнего истолкования.
theological_decisions:
- issue: Значение πνεύματος в выражении ἐν ἁγιασμῷ πνεύματος
  choice: Святой Дух («Духом»)
  alternative: человеческий дух («духом»)
  rationale: В данном сотериологическом контексте освящение наиболее естественно связывается со Святым Духом. Поскольку сама греческая форма не устраняет иной возможности, она сохранена в сноске.
- issue: Смысл εἵλατο ὑμᾶς ὁ θεὸς
  choice: Бог избрал вас
  alternative: Бог выбрал вас / взял вас Себе
  rationale: «Избрал» точно передаёт действие Бога, не уточняя механизм, основание или порядок избрания сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет противопоставление «мы же» и последовательность мысли оригинала. Метафора ἀπαρχή передана прозрачным выражением «первые плоды», а не менее понятным современному читателю словом «начаток». Конечная запятая показывает, что предложение продолжается в следующем стихе.
