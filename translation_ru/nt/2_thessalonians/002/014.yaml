  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: ru
  text: К этому Он и призвал вас через возвещённую нами Благую Весть — чтобы вы обрели[a] славу нашего Господа Иисуса Мессии.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение можно также передать: «чтобы вы обладали славой» или «чтобы вы разделили славу» нашего Господа Иисуса Мессии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, в более традиционной передаче: «Иисуса Христа».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: к этому
  rationale: Оборот указывает назад на сказанное в предыдущем стихе о спасении и освящении, не уточняя чрезмерно единственный возможный антецедент.
- source_word: ἐκάλεσεν
  choice: призвал
  rationale: Обычное для Павла обозначение Божьего призвания; перевод сохраняет его спасительный вес, но не определяет богословский механизм призвания.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: через возвещённую нами Благую Весть
  rationale: διά с родительным падежом выражает средство. Развёрнутый русский оборот поясняет, что речь о Благой Вести, которую апостолы возвещали, а не о принадлежащем им особом благовестии.
- source_word: εἰς περιποίησιν
  choice: чтобы вы обрели
  rationale: Передаёт целевое значение εἰς и основное контекстуальное значение περιποίησις — обретение; близкие значения владения и участия сохраняются в примечании.
- source_word: δόξης
  choice: славу
  rationale: Сохраняет стандартное и богословски ёмкое соответствие греческому δόξα.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Передаёт κύριος традиционным и контекстуально точным титулом «Господь».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет титульное значение; «Мессия» раскрывает смысл греческого титула, а традиционный вариант дан в примечании.
theological_decisions:
- issue: Характер Божьего призвания
  choice: призвал
  alternative: действенно призвал; пригласил
  rationale: Текст говорит о Божьем призвании через Благую Весть, но сам не формулирует конфессиональную теорию о том, каким образом действует это призвание.
- issue: Смысл περιποίησις в сочетании со «славой»
  choice: обрели славу
  alternative: владели славой; разделили славу
  rationale: «Обрели» естественно передаёт направленность к цели и не исключает оттенков обладания или участия, отмеченных в примечании.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном полном титуле значение помазанника остаётся различимым; общеупотребительный традиционный эквивалент сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского послания. Заглавные буквы в «Он» и «Благая Весть» служат ясности и принятому русскому библейскому регистру. Тире естественно обозначает переход к цели призвания.
