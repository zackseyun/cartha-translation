source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: ru
  text: Пусть никто никоим образом не обманет вас, ибо тот день не наступит, если прежде не произойдёт отступление[a] и не откроется человек беззакония[b], сын погибели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпадение», «вероотступничество» или «мятеж». Греческое слово может обозначать решительное восстание или отступление, в том числе от веры.'
    reason: alternative_reading
  - marker: b
    text: 'В некоторых рукописях: «человек греха» вместо «человек беззакония».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: обманет
  rationale: Глагол означает «обмануть, ввести в заблуждение»; «обманет» естественно передаёт предупреждение без избыточного усиления приставки.
- source_word: κατὰ μηδένα τρόπον
  choice: никоим образом
  rationale: Идиома усиливает запрет и исключает любой способ обмана; выражение ясно и уместно в современном литературном русском.
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит основание предшествующего предупреждения; «ведь» естественно связывает предложения и сохраняет пояснительно-причинный оттенок.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: тот день не наступит, пока прежде не произойдёт
  rationale: Из предыдущего стиха восстановлено подразумеваемое «тот день». Условная конструкция указывает на события, которые должны произойти раньше.
- source_word: ἡ ἀποστασία
  choice: отступление
  rationale: Слово может обозначать отпадение, мятеж или решительный отход. «Отступление» сохраняет религиозно-нравственный оттенок, не уточняя спорную эсхатологическую природу события; более широкий вариант отмечен в сноске.
- source_word: πρῶτον
  choice: прежде
  rationale: Наречие обозначает временную последовательность; «прежде» естественно сочетается с конструкцией «пока не».
- source_word: ἀποκαλυφθῇ
  choice: не откроется
  rationale: Пассивная форма означает, что эта фигура станет явной. «Откроется» сохраняет апокалиптический оттенок и привычно звучит в данном контексте.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: человек беззакония
  rationale: Так прямо передаётся чтение SBLGNT ἀνομίας. Единственное число и мужской род сохранены, поскольку речь идёт об определённой фигуре.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: сын погибели
  rationale: Сохранён семитский оборот, обозначающий того, кто характеризуется погибелью или обречён на неё. Выражение понятно в библейском литературном регистре и не устраняет присущую обороту смысловую ёмкость.
theological_decisions:
- issue: Восстановление подразумеваемого подлежащего при ἐὰν μὴ ἔλθῃ
  choice: В основном тексте добавлено «тот день» из непосредственного контекста стиха 2.
  alternative: 'Оставить эллипсис: «ведь пока прежде не произойдёт…»'
  rationale: Греческий текст опускает подлежащее, ясное из контекста — «день Господа». В русском языке его восстановление устраняет синтаксическую неясность, не добавляя нового толкования.
- issue: Значение ἀποστασία
  choice: отступление
  alternative: мятеж; отпадение; вероотступничество
  rationale: Термин допускает как более общее восстание, так и религиозное отпадение. «Отступление» сохраняет традиционно узнаваемый и достаточно широкий смысл, а сноска фиксирует альтернативы, не разрешая спорную эсхатологическую интерпретацию.
- issue: Текстуальное чтение τῆς ἀνομίας
  choice: беззакония — по SBLGNT
  alternative: греха — вариант рукописной традиции
  rationale: Основной текст следует предоставленному греческому изданию; известный вариант «человек греха» отмечен в сноске для текстологической прозрачности.
- issue: Смысл выражения ὁ υἱὸς τῆς ἀπωλείας
  choice: Сохранён формальный оборот «сын погибели».
  alternative: обречённый на погибель
  rationale: Более разъясняющий вариант снял бы неоднозначность между характеристикой принадлежности погибели и указанием на конечную участь. Основной текст сохраняет напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя; выражение «сын погибели» сохранено как понятный и богословски ёмкий семитизм. Все маркеры сносок помещены непосредственно после соответствующих выражений.
