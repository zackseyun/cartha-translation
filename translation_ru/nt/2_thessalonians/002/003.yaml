  terminology: «Отступление» допустимо как широкая передача ἀποστασία; сноска корректно сохраняет варианты, в том числе религиозное значение и «мятеж». «Человек беззакония» точно следует SBLGNT; вариант «человек греха» в сноске уместен. «Сын погибели» сохраняет образность и неоднозначную семитскую конструкцию оригинала.
