  source_fidelity: 'В целом переданы запрет на обман, подразумеваемый из контекста «тот день», последовательность двух предварительных событий, чтение ἀνομίας («беззакония») и образное определение «сын погибели». Однако конструкция «пока прежде не произойдёт» неточно и неудачно передаёт ἐὰν μή: в греческом это условие необходимости («если прежде не…», «если только прежде не…»), а не временной союз «пока».'
