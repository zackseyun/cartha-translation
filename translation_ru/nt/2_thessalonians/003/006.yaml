  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: ru
  text: Повелеваем же вам, братья, именем нашего Господа Иисуса Христа держаться в стороне от всякого брата, который живёт беспорядочно и не следует преданию, принятому ими от нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В ряде рукописей: «которое вы приняли от нас» или «которое он принял от нас». В основном тексте греческий глагол стоит во множественном числе: «они приняли от нас».'
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν δὲ ὑμῖν
  choice: А вам… повелеваем
  rationale: Глагол передаёт властное апостольское распоряжение; δέ выражено естественной русской связкой «А», без добавления временного «теперь».
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена форма мужского рода обращения; в контексте Павел обращается ко всей общине.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: именем нашего Господа Иисуса Христа
  rationale: «Именем» естественно передаёт ἐν ὀνόματι и подразумеваемую власть; «Христос» в современном русском сохраняет узнаваемый мессианский титул.
- source_word: στέλλεσθαι ὑμᾶς ἀπό
  choice: держаться в стороне от
  rationale: Передаёт сознательное уклонение от близкого общения, не усиливая выражение до формального отлучения.
- source_word: ἀτάκτως περιπατοῦντος
  choice: который ведёт себя беспорядочно
  rationale: Метафорическое «ходит» по-русски здесь менее естественно; «ведёт себя» ясно передаёт образ жизни, а «беспорядочно» сохраняет более широкий смысл, чем только праздность.
- source_word: παράδοσιν
  choice: преданию
  rationale: Прямо передаёт то, что было передано апостолами, не подменяя понятие более узким словом «учение».
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: принятому ими от нас
  rationale: Согласование «принятому» с русским словом «преданию» делает фразу естественной, а «ими» сохраняет третье лицо множественного числа печатного текста SBLGNT.
theological_decisions:
- issue: Значение Χριστοῦ в титуле
  choice: Христа
  alternative: Мессии
  rationale: В современном литературном русском «Иисус Христос» — естественная и общеупотребительная форма титула; она не устраняет его мессианского содержания.
- issue: Характер предписанного удаления
  choice: держаться в стороне
  alternative: сторониться; удаляться
  rationale: Формулировка сохраняет дисциплинарную силу повеления, не превращая его без прямого основания в техническое указание об отлучении.
- issue: Необычное число в παρελάβοσαν
  choice: принятому ими от нас
  alternative: которое он принял от нас; которое вы приняли от нас
  rationale: Сохранено чтение SBLGNT в третьем лице множественного числа, несмотря на напряжение после единственного «всякого брата»; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Сохранены апостольская властность, семейное обращение общины и термин «предание». Необычное множественное число исходного текста не сглажено молча; оно вынесено в прозрачную сноску.
