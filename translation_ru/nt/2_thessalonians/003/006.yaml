review_pass:
  verdict: revise
  source_fidelity: 'Смысл основных элементов передан точно: авторитетное повеление, дистанцирование от члена общины, беспорядочный образ жизни, «предание» и необычное множественное число παρελάβοσαν сохранены. Однако союз «а» перед «не по преданию» создаёт в русском ненужное противопоставление, тогда как καὶ μὴ просто присоединяет второй признак.'
  naturalness: «А вам, братья, повелеваем» возможно, но порядок слов тяжеловесен. «Повелеваем же вам, братья» естественнее для современного литературного русского и передаёт сдержанную связующую функцию δέ. Формулировка «ведёт себя беспорядочно и не по преданию» грамматически понятна, но стилистически неудачна; «живёт беспорядочно и не следует преданию» яснее и естественнее.
  terminology: «Господь Иисус Христос», «братья», «предание» и «держаться в стороне» уместны и не вносят конфессионального истолкования. «Христос» — нормативная, естественная русская форма титула в данном именовании.
