revisions:
- from: А вам, братья, повелеваем именем нашего Господа Иисуса Христа держаться в стороне от всякого брата, который ведёт себя беспорядочно, а не по преданию, принятому ими от нас.[a]
  to: Повелеваем же вам, братья, именем нашего Господа Иисуса Христа держаться в стороне от всякого брата, который живёт беспорядочно и не следует преданию, принятому ими от нас.[a]
  rationale: 'Исправлены только русская связность и синтаксис: δέ передано частицей «же», а καὶ μὴ — координирующим «и не». «Принятому ими» намеренно сохраняет множественное число SBLGNT; сноска корректно объясняет текстологическую трудность.'
