source:
  edition: SBLGNT
  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: ru
  text: 'Но Господь верен: Он укрепит вас и сохранит от лукавого[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от зла». Греческое τοῦ πονηροῦ можно понимать либо как форму мужского рода («лукавый»), либо как форму среднего рода («зло»).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: верен
  rationale: Предикативное прилагательное выражает надёжность и верность Господа, контрастируя с неверием людей в предыдущем стихе.
- source_word: δέ
  choice: Но
  rationale: 'Союз передаёт противопоставление предыдущему утверждению: не у всех есть вера, но Господь верен.'
- source_word: ὁ κύριος
  choice: Господь
  rationale: Сохранён новозаветный титул без добавочного уточнения личности носителя титула.
- source_word: στηρίξει
  choice: укрепит
  rationale: Глагол означает утвердить, сделать стойким или укрепить; «укрепит» естественно передаёт пастырский смысл обещания.
- source_word: ὑμᾶς
  choice: вас
  rationale: Передано прямое обращение к общине во множественном числе.
- source_word: φυλάξει
  choice: сохранит
  rationale: Глагол обозначает охрану и оберегание; «сохранит» естественно сочетается в русском языке с оборотом «от лукавого» и сохраняет активный защитный смысл.
- source_word: ἀπὸ
  choice: от
  rationale: Предлог выражает удаление от опасности и защиту от неё.
- source_word: τοῦ πονηροῦ
  choice: лукавого
  rationale: Форма может быть понята как мужской род («лукавый», то есть личный противник) или как средний род («зло»). В основном тексте выбран личный смысл, а грамматически возможная альтернатива вынесена в примечание.
theological_decisions:
- issue: Референт τοῦ πονηροῦ
  choice: лукавого
  alternative: зла
  rationale: Греческая форма с артиклем грамматически допускает как личное, так и отвлечённое понимание. Основной текст отражает распространённое в Новом Завете личное прочтение, не устраняя альтернативу, указанную в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным и достойным звучанием. Двоеточие естественно раскрывает верность Господа через последующее обещание; местоимение «Он» делает фразу плавнее, не меняя смысла относительного предложения.
