base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: ru
  text: 'Ведь мы слышим, что некоторые у вас живут беспорядочно[a]: ничего не делают, а лишь вмешиваются в чужие дела[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «ведут праздную жизнь» или «живут недисциплинированно». Греческое наречие может обозначать поведение, нарушающее порядок, в том числе уклонение от труда.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте здесь игра однокоренных слов: они ничего не «делают», но занимаются посторонними делами, вмешиваясь не в свои дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: мы слышим
  rationale: Настоящее время передаёт поступающие или продолжающие поступать сведения; русское «мы слышим» естественно сохраняет этот смысл.
- source_word: γάρ
  choice: ведь
  rationale: Частица вводит обоснование предшествующего наставления; «ведь» естественно выражает пояснительно-причинную связь.
- source_word: τινας
  choice: некоторые
  rationale: Неопределённо указывает на часть людей внутри общины, не уточняя их личности.
- source_word: περιπατοῦντας
  choice: живут
  rationale: Глагол употреблён как устойчивое обозначение образа жизни и поведения. Буквальное «ходят» в современном русском здесь было бы менее ясно.
- source_word: ἐν ὑμῖν
  choice: у вас
  rationale: Передаёт принадлежность этих людей к среде фессалоникийской общины естественным современным выражением.
- source_word: ἀτάκτως
  choice: беспорядочно
  rationale: Сохраняет широкий смысл поведения, нарушающего должный порядок, не сводя слово исключительно к праздности.
- source_word: μηδὲν ἐργαζομένους
  choice: ничего не делают
  rationale: Передаёт подчёркнутое отрицание всякого труда и одновременно позволяет отчасти воспроизвести словесное противопоставление следующему глаголу.
- source_word: ἀλλὰ
  choice: а лишь
  rationale: Выражает резкий контраст между отсутствием полезного труда и неподобающей деятельностью.
- source_word: περιεργαζομένους
  choice: вмешиваются в чужие дела
  rationale: Естественно передаёт значение назойливого занятия не своим делом. Русский корневой каламбур с «делают» воспроизвести полностью невозможно, поэтому он отмечен в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Сохранена объяснительная связь через «ведь», метафорическое «ходить» передано идиоматически как «жить», а широкий смысл ἀτάκτως не сужен до одной лишь праздности. Двоеточие естественно раскрывает, в чём проявляется беспорядочный образ жизни.
