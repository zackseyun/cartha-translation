base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: ru
  text: Пусть Сам Господь мира дарует вам мир во всякое время[a] и всяким образом[b]. Пусть Господь будет со всеми вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всегда».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всяческим образом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ὁ κύριος
  choice: Пусть Сам Господь
  rationale: Интенсивное αὐτός передаётся словом «Сам», подчёркивающим личное действие Господа. Частица δέ обозначает мягкий переход; отдельное «же» в русском благословении не требуется, поскольку связь естественно передаётся началом новой заключительной молитвы.
- source_word: τῆς εἰρήνης
  choice: мира
  rationale: Родительный падеж сохранён в титулоподобном выражении «Господь мира» без поясняющего парафраза.
- source_word: δῴη
  choice: Пусть ... дарует
  rationale: Оптатив выражает молитвенное пожелание. Конструкция с «пусть» естественна в современном русском, а «дарует» уместно передаёт благословительный характер фразы.
- source_word: τὴν εἰρήνην
  choice: мир
  rationale: Русское существительное без дополнительного указательного элемента естественно передаёт объект пожелания и сохраняет повтор ключевого слова.
- source_word: διὰ παντὸς
  choice: во всякое время
  rationale: Выражение имеет временное значение и подчёркивает постоянство; перевод сохраняет его буквально и понятно.
- source_word: ἐν παντὶ τρόπῳ
  choice: всяким образом
  rationale: Перевод сохраняет значение способа или образа действия, не сужая его до обстоятельств или средств.
- source_word: μετὰ πάντων ὑμῶν
  choice: со всеми вами
  rationale: Передаёт включающее πάντων и естественный русский порядок слов.
theological_decisions:
- issue: Кого обозначает «Господь» в благословении
  choice: Сохранить слово «Господь» без добавления имени или уточнения.
  alternative: Передать как «Господь Иисус» либо явно отнести выражение к Богу вообще.
  rationale: Греческий текст содержит только ὁ κύριος. Контекст допускает обычное для Павла указание на Господа Иисуса, но перевод не должен делать подразумеваемое уточнение явным.
- issue: Смысл заключительной безглагольной фразы
  choice: 'Передать как пожелание: «Пусть Господь будет со всеми вами».'
  alternative: 'Передать как утверждение: «Господь со всеми вами».'
  rationale: В контексте заключительного благословения фраза имеет молитвенно-пожелательную, а не просто изъявительную силу; русский перевод явно выражает эту функцию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой, подходящей для апостольского благословения. Конструкция с «пусть» яснее современному читателю, чем более архаичное «да дарует», при этом сохраняет молитвенный характер текста.
