  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: ru
  text: Пусть же Господь направит ваши сердца к любви Божьей[a] и к стойкости Мессии[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «к любви к Богу» или «к Божьей любви». Греческая конструкция допускает несколько смысловых отношений.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «к стойкости самого Мессии», «к стойкости ради Мессии» или «к стойкости, подобной стойкости Мессии». Греческая конструкция допускает несколько смысловых отношений.'
    reason: alternative_reading
  - marker: c
    text: В греческом тексте — «Христос», то есть «Помазанник»; здесь передано словом «Мессия», поскольку это титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: Обычный новозаветный эквивалент, сохраняющий значение божественного и христологического титула без уточнения референта сверх того, что сказано в тексте.
- source_word: κατευθύναι
  choice: пусть направит
  rationale: Оптатив передаёт пожелание или молитву. Конструкция «пусть направит» естественна в современном русском языке и сохраняет образ направления к определённой цели.
- source_word: καρδίας
  choice: сердца
  rationale: Сохраняет библейскую антропологическую метафору внутреннего средоточия мыслей, воли и чувств.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: любви Божьей
  rationale: Формулировка близка к греческой конструкции и не заменяет её однозначным «любви к Богу» или «любви Бога к вам»; допустимые понимания отмечены в сноске.
- source_word: ὑπομονὴν
  choice: стойкости
  rationale: Передаёт упорную выдержку и способность устоять под давлением; в данном контексте звучит естественнее, чем более процессуальное «терпение».
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός употреблено как титул; «Мессия» передаёт его смысл, а не превращает в имя. Неоднозначность родительного падежа пояснена в сноске.
theological_decisions:
- issue: Неоднозначный генитив в τὴν ἀγάπην τοῦ θεοῦ
  choice: любви Божьей
  alternative: любви к Богу; Божьей любви к людям
  rationale: Греческая конструкция допускает субъективное, объективное и более широкое качественно-сферическое понимание. Основной текст не закрепляет одну богословскую трактовку, а сноска раскрывает варианты.
- issue: Неоднозначный генитив в τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: стойкости Мессии
  alternative: стойкости самого Мессии; стойкости ради Мессии; стойкости в ожидании Мессии
  rationale: Родительный падеж может указывать на стойкость, проявленную Мессией, направленную к нему или характеризуемую отношением к нему. Перевод сохраняет формальную открытость, а сноска предупреждает о нескольких прочтениях.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа; Помазанника
  rationale: Здесь Χριστός сохраняет функцию титула. «Мессия» — понятный и укоренившийся в русском языке смысловой эквивалент.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного пожелания. Частица «же» естественно передаёт связующую силу δέ без добавления временного «теперь». Формулировки намеренно близки к структуре оригинала там, где это необходимо для сохранения смысловой и богословской неоднозначности.
