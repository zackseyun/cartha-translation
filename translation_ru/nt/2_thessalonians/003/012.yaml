  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: ru
  text: А таким людям повелеваем и призываем в Господе Иисусе Мессии[a], чтобы они, спокойно трудясь, ели свой хлеб[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «именем Господа Иисуса Мессии»; греческое выражение может указывать на Его власть, но буквально означает «в Господе».'
    reason: semantic_alternative
  - marker: b
    text: 'То есть жили за счёт собственного труда. Буквально: «спокойно трудясь, ели свой хлеб».'
    reason: idiom_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: А таким людям
  rationale: Дательный оборот указывает на ранее описанных праздных и нарушающих порядок людей; δέ передано мягким связующим «а», сохраняющим переход и лёгкое противопоставление.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: повелеваем и настоятельно советуем
  rationale: 'Сохранены оба оттенка: властное предписание и серьёзный пастырский призыв. «Настоятельно советуем» естественнее для современного русского читателя, чем книжное «увещеваем», и не ослабляет контекст.'
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: в Господе Иисусе Мессии
  rationale: Буквальное «в» сохраняет возможные оттенки сферы единения и авторитета, не сводя выражение только к инструментальному «именем». Χριστός передан как живой титул «Мессия».
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: спокойно трудятся
  rationale: Оборот означает тихий, мирный и упорядоченный образ труда в противоположность праздности и вмешательству в чужие дела; наречная передача естественна по-русски.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: едят свой хлеб
  rationale: Сохранён конкретный образ хлеба как заработанного человеком пропитания; «свой» передаёт возвратное ἑαυτῶν без излишнего пояснения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В сочетании с именем Иисуса слово сохраняет функцию титула; «Мессия» делает его смысл прозрачным и не превращает в подобие фамилии.
- issue: Основание апостольского наставления
  choice: в Господе Иисусе Мессии
  alternative: именем Господа Иисуса Мессии
  rationale: Предлог ἐν допускает оттенок авторитета, но также сферы принадлежности и единения; буквальное «в» сохраняет эту смысловую широту.
- issue: Сочетание повеления и призыва
  choice: повелеваем и настоятельно советуем
  alternative: наставляем
  rationale: Два греческих глагола намеренно удерживают вместе апостольскую власть и пастырскую настойчивость; сведение их к одному глаголу обеднило бы текст.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксис упрощён до естественной русской конструкции «пусть…», при этом сохранены повелительная сила, призыв к спокойному труду и образ собственного хлеба.
