lexical_decisions:
- source_word: δωρεὰν
  choice: даром
  rationale: Наречие означает получение без платы или возмещения; «даром» естественно и кратко передаёт экономический оттенок.
- source_word: ἄρτον
  choice: хлеба
  rationale: Сохранено буквальное «хлеб», которое в контексте может шире обозначать пищу или материальное содержание.
- source_word: παρά τινος
  choice: ни у кого
  rationale: παρά с родительным указывает на источник, а отрицательная конструкция по-русски естественно передаётся как «ни у кого».
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: в тяжком труде
  rationale: Два близких по смыслу слова усиливают представление об изнурительном, тягостном труде; русское выражение передаёт их совокупный смысл без неестественного удвоения.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ночь и день
  rationale: Устойчивое обозначение продолжительного труда во всё время суток; сохранён порядок греческого текста.
- source_word: ἐργαζόμενοι
  choice: трудились
  rationale: Причастие передаёт фактическую работу ради самообеспечения; личная форма делает русское предложение естественным.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: чтобы не обременить
  rationale: Конструкция выражает цель, а глагол в данном контексте означает не возлагать на общину материальное бремя.
- source_word: τινα ὑμῶν
  choice: никого из вас
  rationale: 'Сохраняется распределительный смысл: ни один человек из числа адресатов.'
- source_word: οὐδὲ ... ἀλλ’
  choice: и ни ... но
  rationale: Передан контраст между отказом от бесплатного содержания и тяжёлым трудом; начальное «и» естественно связывает стих с предыдущим контекстом.
