  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: ru
  text: Не потому, что у нас нет права[a], а чтобы самим подать вам пример[b], чтобы вы подражали нам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полномочие» или «власть». В данном контексте речь, вероятнее всего, идёт о законном праве на поддержку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «образец» или «модель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: права
  rationale: В данном контексте речь идёт о законном притязании Павла и его спутников на материальную поддержку, а не о власти вообще. «Право» естественно передаёт эту мысль по-русски.
- source_word: ἑαυτοὺς
  choice: в собственном лице
  rationale: Греческое возвратное местоимение относится к Павлу и его спутникам. Русское выражение «в собственном лице» сохраняет мысль о том, что именно они сами служат примером, и звучит естественнее буквального «дать самих себя».
- source_word: τύπον
  choice: пример
  rationale: Здесь слово обозначает образец поведения, которому следует подражать. «Пример» ясно и естественно передаёт эту функцию.
- source_word: δῶμεν
  choice: дать
  rationale: Сохраняет греческий образ «дать себя как пример»; вместе с выражением «в собственном лице дать вам пример» образует естественную русскую конструкцию.
- source_word: εἰς τὸ μιμεῖσθαι
  choice: для подражания
  rationale: Передаёт целевое значение конструкции и непосредственно связывает данный пример с предполагаемым подражанием.
- source_word: μιμεῖσθαι ἡμᾶς
  choice: для подражания нам
  rationale: 'Сохраняет прямой объект греческого глагола: адресаты должны подражать Павлу и его спутникам, а не просто следовать отвлечённому принципу.'
- source_word: οὐχ ὅτι οὐκ
  choice: не потому, что у нас нет
  rationale: Естественно передаёт двойное отрицание и вводит пояснение мотива, противопоставленное следующей целевой части.
- source_word: ἀλλ’ ἵνα
  choice: а чтобы
  rationale: Ясно выражает противопоставление и цель в современном русском языке.
theological_decisions:
- issue: Характер притязания, выраженного словом ἐξουσίαν
  choice: Павел говорит, что он и его спутники имеют законное право на поддержку, но добровольно им не воспользовались.
  alternative: Слово может шире обозначать апостольскую власть или полномочие.
  rationale: Ближайший контекст говорит о труде апостолов и их желании никого не обременять, поэтому «право» точнее передаёт практический смысл, не превращая стих в более широкое утверждение об апостольской власти.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным звучанием. Выражение «в собственном лице дать вам пример» естественно передаёт греческую конструкцию ἑαυτοὺς τύπον δῶμεν, не устраняя прямого призыва подражать апостолам.
