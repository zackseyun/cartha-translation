  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: ru
  text: Благодать нашего Господа Иисуса Христа — со всеми вами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях слово «вами» отсутствует: «со всеми».'
    reason: Текстовый вариант отмечен в исходном греческом издании; основной текст следует чтению SBLGNT.
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Устоявшийся и смыслово точный русский эквивалент для ключевого термина Павловых благословений, выражающего незаслуженную милость и благой дар.
- source_word: κυρίου
  choice: Господа
  rationale: Передаёт христологический титул κύριος естественным для русского библейского языка словом, сохраняя оттенки власти и почитания.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: «Иисус» передаёт имя, а «Христос» — укоренившийся в современном русском языке мессианский титул; в формуле благословения сочетание звучит естественно и торжественно.
- source_word: μετὰ πάντων ὑμῶν
  choice: со всеми вами
  rationale: Точно сохраняет значение μετά с родительным падежом и подчёркнуто всеохватный характер благословения, обращённого ко всей общине.
theological_decisions:
- issue: Передача Χριστοῦ в заключительном благословении
  choice: Христа
  alternative: Мессии
  rationale: Оба варианта отражают титул Помазанника, однако «Иисус Христос» в русском языке остаётся прозрачным, общепринятым и естественным сочетанием, не превращая титул в частное конфессиональное толкование.
- issue: Глагольная форма благословения
  choice: 'Сохранена именная конструкция: «Благодать… — со всеми вами»'
  alternative: «Да будет благодать… со всеми вами»
  rationale: В греческом тексте глагол отсутствует. Русская именная конструкция сохраняет лаконичность и благословительный характер оригинала, не уточняя моление как явно выраженное пожелание.
translation_notes:
  register: Современный литературный русский язык с достоинством заключительного апостольского благословения. Тире помогает естественно оформить безглагольную греческую конструкцию; архаическая формула «да пребудет» не вводится.
