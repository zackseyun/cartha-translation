  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: ru
  text: И не считайте его врагом, но увещевайте его как брата.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «брат» здесь обозначает единоверца, члена христианской общины; оно может употребляться в представительном смысле о любом её члене.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: считайте
  rationale: Глагол означает считать или рассматривать кого-либо определённым образом; «считайте» естественно передаёт оценочное значение в данном сочетании.
- source_word: ἐχθρόν
  choice: врагом
  rationale: Стандартное и ясное соответствие; форма творительного падежа обусловлена русской конструкцией «считать кем».
- source_word: νουθετεῖτε
  choice: вразумляйте
  rationale: Передаёт наставление с предостерегающей и исправляющей целью, сохраняя пастырский, но не враждебный характер действия.
- source_word: ἀδελφόν
  choice: брата
  rationale: Сохраняет мужское единственное число исходного текста и обозначение члена общины; представительное употребление пояснено в сноске.
- source_word: ὡς
  choice: как
  rationale: В обоих подразумеваемых отношениях обозначает, в каком качестве следует воспринимать человека и обращаться с ним; по-русски естественно передаётся словом «как».
- source_word: καὶ μὴ ... ἀλλὰ
  choice: И не ... но ...
  rationale: Сохраняет связь с предыдущим наставлением и выраженный в греческом противопоставительный строй.
theological_decisions:
- issue: Отношение к непослушному члену общины при дисциплинарном воздействии
  choice: Не считать его врагом, а исправляюще наставлять как брата, то есть сохранять братское отношение.
  alternative: Понимать стих как общее наставление о межличностном конфликте вне контекста церковной дисциплины.
  rationale: Контекст 2 Фес 3:14–15 говорит о непослушании наставлению апостола и о мерах ради исправления; слово «брат» сохраняет признание человека членом общины, не превращая дисциплину в личную вражду.
translation_notes:
  register: 'Современный литературный русский язык, краткий и достойный. «Вразумляйте» сохраняет одновременно наставительный и исправляющий оттенки νουθετεῖτε. Отдельная сноска к «считайте врагом» не добавлена: вариант «рассматривайте как врага» является стилистическим, а не смысловым расхождением и по-русски не требует примечания.'
