base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: ru
  text: Мы же уверены в Господе, что вы исполняете и будете исполнять то, что мы предписываем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: мы уверены
  rationale: Перфект выражает сложившуюся и сохраняющуюся уверенность; настоящее время естественно передаёт это по-русски.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: 'Сохраняет богословски значимую основу уверенности: она укоренена не просто в человеческой оценке адресатов, а в Господе.'
- source_word: ἐφ’ ὑμᾶς
  choice: относительно вас
  rationale: Нейтрально передаёт направленность уверенности на адресатов, не устраняя связи с выражением «в Господе».
- source_word: παραγγέλλομεν
  choice: повелеваем
  rationale: Передаёт властный характер апостольского наставления; более слабое «просим» не соответствует глаголу.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: исполняете и будете исполнять
  rationale: В контексте повелений русское «исполнять» естественнее буквального «делать» и сохраняет различие настоящего и будущего времени.
theological_decisions:
- issue: Соотношение доверия Господу и уверенности в адресатах
  choice: «уверены в Господе относительно вас»
  alternative: «полагаемся на вас в Господе»
  rationale: 'Выбранная формулировка сохраняет обе стороны греческой конструкции: источник и сфера уверенности — Господь, а относится она к поведению адресатов; при этом не создаётся впечатление безусловного упования на людей.'
- issue: Характер апостольских указаний
  choice: «то, что мы повелеваем»
  alternative: «то, что мы вам поручаем»
  rationale: Глагол παραγγέλλω в данном контексте обозначает авторитетное предписание; перевод не ослабляет эту силу и не добавляет конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный. Синтаксис близок к греческому, но естественен для обычного читателя; подлинная богословская напряжённость выражения «в Господе относительно вас» сохранена.
