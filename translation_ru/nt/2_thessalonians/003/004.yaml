  verdict: revise
  source_fidelity: 'Смысл передан точно: πεποίθαμεν выражено как сохраняющаяся уверенность, ἐν κυρίῳ сохранено, а настоящее ποιεῖτε и будущее ποιήσετε различены. Однако русское «относительно вас» излишне канцелярски и утяжеляет естественную для русского языка конструкцию; связь уверенности с адресатами достаточно передаётся придаточным «что вы...».'
  naturalness: «Но мы уверены в Господе относительно вас» грамматически возможно, но в современном литературном русском звучит неестественно и бюрократически. «Мы же уверены в Господе, что...» естественно, сохраняет переходное δέ и не меняет смысл.
  terminology: «Господе» и «исполняете» уместны. Для παραγγέλλομεν «предписываем» передаёт авторитетный характер указания и в данном синтаксисе современнее и естественнее, чем несколько тяжеловесное «повелеваем».
  issues:
  - severity: low
    issue: Неестественное «относительно вас»
    rationale: 'Это буквальное, но канцелярское воспроизведение ἐφ’ ὑμᾶς. В русском адресаты естественно обозначаются содержанием уверенности: «что вы исполняете и будете исполнять...».'
  - severity: low
    issue: Выбор союза «Но»
    rationale: δέ здесь скорее продолжает рассуждение с оттенком сопоставления, чем вводит сильное противопоставление; «же» точнее по тону.
  - severity: low
    issue: «Повелеваем» звучит тяжеловесно
    rationale: Глагол παραγγέλλω сохраняет силу предписания, но «предписываем» лучше соответствует современному литературному употреблению и сочетается с «исполнять».
  revised_text: Мы же уверены в Господе, что вы исполняете и будете исполнять то, что мы предписываем.
