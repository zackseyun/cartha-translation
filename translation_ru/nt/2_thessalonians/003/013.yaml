    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Вы же
  rationale: Вынесенное вперёд ὑμεῖς подчёркивает адресатов, а δέ противопоставляет их упомянутым ранее праздным людям. Русское «Вы же» естественно передаёт и акцент, и контраст.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма мужского рода буквально означает «братья». В обращениях Павла она может включать всю общину; это пояснено в сноске, чтобы не устранять особенность греческого текста.
- source_word: μὴ ἐγκακήσητε
  choice: не уставайте
  rationale: Запрет с μή и аористом сослагательного наклонения предостерегает от ослабления усердия или потери духа. В сочетании с продолжающимся добрым деланием «не уставайте» звучит естественно и точно.
- source_word: καλοποιοῦντες
  choice: делать добро
  rationale: Причастие настоящего времени обозначает продолжающуюся деятельность, в которой нельзя ослабевать. Инфинитивная конструкция «не уставайте делать добро» естественна для современного русского языка и сохраняет длительный смысл.
theological_decisions:
- issue: Значение ἀδελφοί в обращении к общине
  choice: братья
  alternative: братья и сёстры
  rationale: Греческая форма — мужского рода, но в данном общинном обращении, вероятно, охватывает всех верующих. Основной текст сохраняет форму источника, а возможный инклюзивный охват отмечен в сноске без навязывания конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. «Вы же» сохраняет контраст с предыдущим контекстом, а «делать добро» передаёт продолжающееся благотворное действие без архаизма.
