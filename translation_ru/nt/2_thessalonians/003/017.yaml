  to: Приветствие написано моей собственной рукой — рукой Павла; это знак в каждом послании. Так я пишу.
  rationale: 'Исправлена неестественная конструкция с «Павловой». Основной текст ясно выражает, что заключительное приветствие написано самим Павлом, но сохраняет его самоназвание через пояснительное «рукой Павла». Разделение на два предложения не меняет связи: относительное «это» по-прежнему относится к собственноручному приветствию. Сноска предлагает более близкий к греческой эллиптической форме вариант и отмечает допустимую передачу οὕτως.'
