  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: ru
  text: Приветствие написано моей собственной рукой — рукой Павла; это знак в каждом послании. Так я пишу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμὸς
  choice: приветствие
  rationale: Обычное обозначение заключительного приветствия в письме; современно и естественно по-русски.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: написано моей рукой, Павловой
  rationale: Дательный оборот указывает на собственноручное написание; имя в родительном падеже поясняет, чья это рука. Формулировка сохраняет необычное самообозначение Павла.
- source_word: σημεῖον
  choice: знак
  rationale: Передаёт смысл опознавательного или удостоверяющего признака без добавления отсутствующего в тексте пояснения.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: в каждом послании
  rationale: Сохраняет распределительное значение πᾶς и уместный для апостольской переписки литературный термин.
- source_word: οὕτως γράφω
  choice: Так я пишу
  rationale: 'Близко передаёт краткость и возможную указательную неоднозначность оригинала: это может относиться как к почерку, так и к данной собственноручной формуле.'
theological_decisions:
- issue: Удостоверяющая функция собственноручного приветствия
  choice: Слова Павла представлены как указание на опознавательный знак в его посланиях.
  alternative: 'Последнюю фразу можно понимать уже: «вот так я пишу», как непосредственное указание на образец почерка или на данное приветствие.'
  rationale: Контекст 2 Фес. 2:2 и выражение «знак в каждом послании» поддерживают смысл удостоверения подлинности, однако перевод «Так я пишу» не устраняет неоднозначность οὕτως.
translation_notes:
  register: Современный литературный русский с умеренно библейским регистром. «Послание» выбрано вместо разговорного «письмо» как естественное обозначение апостольской корреспонденции; архаизмы исключены.
