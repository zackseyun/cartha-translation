  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: ru
  text: и чтобы мы были избавлены от порочных и злых людей, ведь не у всех есть вера[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь не все верны». Буквально по-гречески: «ибо не у всех вера».'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: нам избавиться
  rationale: Аорист пассивного сослагательного наклонения после ἵνα выражает цель. Русское «чтобы нам избавиться» естественно передаёт избавление от враждебных людей, не уточняя способа.
- source_word: ἀτόπων
  choice: порочных
  rationale: 'Слово может означать «неуместный», «нелепый», «неразумный» или нравственно превратный. В сочетании с πονηρῶν здесь уместно «порочных»: оно обозначает нравственную испорченность, не дублируя полностью «злых».'
- source_word: πονηρῶν
  choice: злых
  rationale: Обычное нравственное обозначение зла; «злых» ясно и естественно характеризует враждебных противников.
- source_word: ἀνθρώπων
  choice: людей
  rationale: Русское «людей» является обычным немаркированным соответствием множественного числа ἄνθρωπος. Само греческое слово здесь не требует подчёркивать мужской пол противников.
- source_word: πίστις
  choice: вера
  rationale: В контексте противодействия апостольской проповеди наиболее вероятно значение «вера», хотя лексически возможно и «верность».
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: ведь не у всех есть вера
  rationale: 'Греческое выражение буквально эллиптично: «ибо не всех вера». Русская конструкция естественно восполняет подразумеваемое обладание и сохраняет общий смысл без усиления утверждения.'
theological_decisions:
- issue: Значение πίστις в эллиптическом выражении οὐ γὰρ πάντων ἡ πίστις
  choice: не у всех есть вера
  alternative: не все верны
  rationale: Непосредственный контекст враждебного сопротивления миссии делает отсутствие веры наиболее вероятным смыслом. Однако πίστις способно обозначать верность или надёжность, поэтому подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет связь с предыдущей просьбой через начальное «и чтобы». Лексика ясная и достойная, без конфессионально окрашенных уточнений.
