  source_fidelity: 'Основной смысл передан верно: ἵνα сохраняется как целевое «чтобы», ῥυσθῶμεν — как избавление от враждебных людей, а οὐ γὰρ πάντων ἡ πίστις — без богословского усиления. Однако «нам избавиться» может звучать так, будто действующие лица сами избавляются от противников; пассивное «мы были избавлены» точнее передаёт греческий аористный пассив. В сноске формула «не всех вера» не является грамматичным русским буквальным соответствием генитива πάντων.'
