  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: ru
  text: Если же кто не повинуется нашему слову в этом послании[a], отметьте такого[b] и не общайтесь с ним[c], чтобы ему стало стыдно[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «через это послание» или «посредством этого послания». Греческое выражение может указывать на средство, через которое передано наставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возьмите такого на заметку», «обозначьте такого».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не водитесь с ним», «не поддерживайте с ним общения».'
    reason: lexical_alternative
  - marker: d
    text: 'Цель этой меры — исправление: ср. стих 15, где такого человека следует вразумлять «как брата», а не считать врагом.'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: не повинуется
  rationale: Глагол обозначает повиновение или послушание авторитетному наставлению; «не повинуется» естественно передаёт его силу в увещательном контексте.
- source_word: τῷ λόγῳ ἡμῶν
  choice: нашему слову
  rationale: «Слово» здесь означает апостольское наставление; буквальная форма остаётся понятной в современном русском языке.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: переданному в этом послании
  rationale: 'διά с родительным падежом указывает на средство передачи: слово сообщается посредством данного послания. Причастие делает эту связь ясной и естественной по-русски, не сводя выражение только к местонахождению текста.'
- source_word: σημειοῦσθε
  choice: заметьте такого
  rationale: Средний императив призывает особо отметить или взять на заметку непослушного человека. «Заметьте» сохраняет образ маркирования без излишне формально-карательного оттенка.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: не общайтесь с ним
  rationale: Глагол означает не смешиваться и не поддерживать общение; выбранная формулировка естественна и сохраняет дисциплинарный характер указания, не вводя поздней юридической терминологии.
- source_word: ἐντραπῇ
  choice: чтобы ему стало стыдно
  rationale: Пассивный аорист сослагательного наклонения в целевой конструкции выражает возникновение чувства стыда. Формулировка передаёт предполагаемый исправительный результат, не делая унижение самоцелью.
- source_word: τις / τοῦτον / αὐτῷ
  choice: кто / такого / с ним
  rationale: Сохраняется открытое условие и последовательная отсылка к конкретному человеку с естественными для русского языка формами.
theological_decisions:
- issue: Характер предписанного ограничения общения
  choice: Исправительная мера внутри общины, выраженная как прекращение обычного общения
  alternative: Формальное полное отлучение либо только необязательное бытовое избегание
  rationale: Непосредственный контекст, особенно стих 15, не позволяет считать человека врагом и велит вразумлять его как брата. Перевод сохраняет серьёзность меры, не приписывая ей поздней церковно-правовой формы.
- issue: Смысл ἐντραπῇ
  choice: Возникновение исправительного чувства стыда
  alternative: Публичное унижение как самостоятельная цель
  rationale: Целевая конструкция и следующий стих указывают на исправительную направленность, хотя сам текст прямо не называет покаяние или восстановление результатом.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. «Послание» выбрано вместо более бытового «письмо» ради жанрового контекста; синтаксис сделан ясным для обычного читателя. Все примечания отмечены в основном тексте.
