  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: ru
  text: 'Ведь даже когда мы были у вас, мы велели вам вот что: «Если кто не хочет трудиться[a], тот пусть и не ест[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть если кто-либо не желает трудиться, а не если он не способен трудиться.
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «пусть такой человек не ест».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь ещё
  rationale: «Ведь» передаёт пояснительную связь γάρ с предыдущей мыслью, а «ещё» естественно выражает усилительное καί в сочетании с придаточным времени.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: когда мы были у вас
  rationale: В данном контексте πρός с личным местоимением означает пребывание рядом, в обществе адресатов; по-русски естественно сказать «были у вас».
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: мы велели вам вот что
  rationale: Глагол παραγγέλλω выражает распоряжение или настойчивое наставление. Несовершенный вид «велели» естественно соответствует имперфекту и не требует искусственного уточнения кратности; «вот что» указывает вперёд на содержание повеления.
- source_word: εἴ τις οὐ θέλει ἐργάζεσθαι
  choice: если кто не хочет трудиться
  rationale: θέλει обозначает желание или готовность, поэтому речь идёт о нежелании, а не о неспособности работать. «Трудиться» сохраняет смысл ἐργάζεσθαι и соответствует достойному литературному регистру.
- source_word: μηδὲ ἐσθιέτω
  choice: тот пусть и не ест
  rationale: «Пусть не ест» передаёт повелительное значение формы ἐσθιέτω, а частица «и» естественно выражает связь μηδέ с отрицанием в условии. Указательное «тот» делает русскую условную конструкцию ясной, не меняя её общего смысла.
theological_decisions:
- issue: Относится ли высказывание к неспособности трудиться или к нежеланию трудиться
  choice: «не хочет трудиться» — речь о нежелании
  alternative: «не может трудиться» — речь о неспособности
  rationale: Греческий глагол θέλω относится к воле и желанию. Перевод через неспособность изменил бы нравственную направленность высказывания и распространил бы его на тех, о ком исходный текст не говорит.
- issue: Форма общего условия и следствия в единственном числе
  choice: «если кто… тот пусть…»
  alternative: «если люди… пусть они…»
  rationale: Греческое τις и повелительная форма третьего лица стоят в единственном числе и имеют обобщающее значение. Русская конструкция «если кто… тот пусть…» сохраняет и число, и представительный характер высказывания.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной формулировкой. Выражение «если кто… тот пусть…» сохраняет афористическую силу греческого текста без архаизации; «велели» передаёт властный характер наставления естественнее, чем книжное «заповедовали».
