base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: ru
  text: 'Ведь вы сами знаете, как вам следует подражать нам: мы не вели себя среди вас беспорядочно[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом ближайшего контекста: «мы не бездельничали среди вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: сами
  rationale: Интенсивное местоимение подчёркивает, что фессалоникийцы сами это знают.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего наставления; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: οἴδατε
  choice: знаете
  rationale: Перфектная по форме лексема имеет обычное настоящее значение.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: как вам следует подражать нам
  rationale: Передаёт образ действия и обязательность, сохраняя личный объект «нам» без замены на пояснительное «нашему примеру».
- source_word: ὅτι
  choice: двоеточие
  rationale: В данном построении ὅτι вводит основание или пояснение того, как следует подражать; русское бессоюзное пояснение с двоеточием звучит естественно и не устраняет смысловой связи.
- source_word: οὐκ ἠτακτήσαμεν
  choice: мы не вели себя беспорядочно
  rationale: Сохраняет широкий смысл глагола ἀτακτέω — вести себя нестройно, недисциплинированно, не как положено, — не сужая его до одной лишь праздности.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Естественно обозначает поведение апостольских сотрудников в среде адресатов.
theological_decisions:
- issue: Значение ἀτακτέω в ближайшем контексте
  choice: Широкое обозначение беспорядочного, недисциплинированного поведения
  alternative: «мы не бездельничали среди вас»
  rationale: Контекст главы связывает такое поведение с отказом трудиться, однако само слово шире понятия праздности. Основной текст сохраняет широту греческого выражения, а контекстуально вероятное уточнение вынесено в сноску.
- issue: Связь, выраженная ὅτι
  choice: Пояснительно-обосновывающая связь, переданная двоеточием
  alternative: «потому что мы не вели себя среди вас беспорядочно»
  rationale: ὅτι допускает причинное или изъяснительное прочтение. Двоеточие по-русски сохраняет связь с предшествующим утверждением, не делая её излишне однозначной.
translation_notes:
  register: Современный литературный русский язык; тон наставительный и сдержанно-достоинственный. «Подражать нам» сохранено как прямое и понятное соответствие греческому выражению.
