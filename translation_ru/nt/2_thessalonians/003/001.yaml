    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бежало и прославлялось».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Наконец
  rationale: Естественный русский эпистолярный маркер, вводящий заключительную часть письма; не обязательно обозначает строго последнее высказывание.
- source_word: προσεύχεσθε
  choice: молитесь
  rationale: Настоящее повелительное второго лица множественного числа передано естественным русским призывом; контекст допускает подразумеваемую продолжительность молитвы.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужское обращение оригинала; в данном контексте оно может представительно относиться ко всей общине, что пояснено в сноске.
- source_word: περὶ ἡμῶν
  choice: о нас
  rationale: При глаголе «молиться» это естественное русское соответствие конструкции περί с родительным падежом.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: слово Господне
  rationale: Сохраняет библейскую формулировку и возможность понимать λόγος как возвещаемое слово, весть Господа.
- source_word: τρέχῃ
  choice: быстро распространялось
  rationale: Передаёт смысл метафоры «бежало» применительно к быстрому и беспрепятственному продвижению Господнего слова; буквальный образ отмечен в сноске.
- source_word: δοξάζηται
  choice: было прославлено
  rationale: Близко передаёт пассивную форму δοξάζω и сохраняет более сильный оттенок «прославления», не сводя его только к уважению или почёту.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: как и у вас
  rationale: Естественно по-русски выражает сравнение с тем, что уже произошло среди фессалоникийской общины, сохраняя значение καί.
theological_decisions:
- issue: Обращение ἀδελφοί ко всей общине
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет форму оригинала, а вероятный охват всей смешанной общины поясняется сноской без расширения самого обращения.
- issue: Метафора продвижения Господнего слова
  choice: быстро распространялось
  alternative: бежало
  rationale: Оптимальная эквивалентность требует ясно передать смысл необычной для современного русского речи метафоры, сохранив буквальную форму в примечании.
- issue: Значение δοξάζηται применительно к слову
  choice: было прославлено
  alternative: было почитаемо
  rationale: '«Прославлено» сохраняет лексическую и богословскую напряжённость выражения: речь может идти не только о почтительном принятии, но и о явлении славы слова через его воздействие.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского обращения. Синтаксис прост и понятен; библейское выражение «слово Господне» сохранено, а непривычная метафора разъяснена в сноске.
