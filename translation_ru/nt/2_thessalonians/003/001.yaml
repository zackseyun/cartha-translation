  source_fidelity: «Наконец, братья, молитесь о нас» точно передаёт Τὸ λοιπὸν, ἀδελφοί, προσεύχεσθε περὶ ἡμῶν. «Быстро распространялось» удачно раскрывает метафорическое τρέχῃ. Однако «было прославлено» имеет совершенный вид и может обозначать разовое завершённое действие, тогда как оба греческих глагола стоят в настоящем времени сослагательного наклонения и описывают продолжаемое желаемое действие. «Среди вас» яснее передаёт πρὸς ὑμᾶς в данном сравнении, чем несколько неопределённое «у вас».
