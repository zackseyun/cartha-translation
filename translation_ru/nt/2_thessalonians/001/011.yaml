id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: ru
  text: С этой целью мы также всегда молимся о вас, чтобы наш Бог счёл вас достойными призвания[a] и силой исполнил всякое доброе намерение[b] и дело веры[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал вас достойными призвания». Греческий глагол может означать как «счесть, признать достойным», так и «сделать достойным».'
    reason: alternative_reading
  - marker: b
    text: 'Возможные переводы: «всякое намерение к добру» или «всякую решимость творить добро».'
    reason: lexical_alternative
  - marker: c
    text: «Дело веры» можно также понимать как «дело, порождённое верой»; слово «вера» в данном контексте может иметь и значение «верность».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: Ради этого мы и
  rationale: Оборот связывает молитву с предшествующим рассуждением и выражает цель или основание; частица καί естественно передана усилительно-присоединительным «и».
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: всегда молимся о вас
  rationale: Передаёт продолжающееся, обычное действие настоящего времени и естественно воспроизводит περὶ ὑμῶν.
- source_word: ἀξιώσῃ
  choice: счёл вас достойными
  rationale: Сохраняет оценочное значение глагола — «признать, счесть достойным», не исключая другого возможного значения «сделать достойным», отмеченного в сноске.
- source_word: τῆς κλήσεως
  choice: призвания
  rationale: В греческом тексте нет выраженного притяжательного местоимения; русский родительный падеж позволяет не добавлять «Его» или «вашего».
- source_word: ὁ θεὸς ἡμῶν
  choice: наш Бог
  rationale: Точно сохраняет явно выраженное притяжательное местоимение.
- source_word: πληρώσῃ
  choice: исполнил
  rationale: Передаёт значение полного осуществления или доведения до исполнения и подходит к обоим однородным дополнениям.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: всякое доброе намерение
  rationale: εὐδοκία здесь естественно понимается как намерение или решимость, а родительный ἀγαθωσύνης характеризует его как направленное к добру; формулировка остаётся ясной современному читателю.
- source_word: ἔργον πίστεως
  choice: дело веры
  rationale: 'Компактно сохраняет неоднозначность греческого родительного: это может быть дело, порождённое верой, либо дело, отмеченное верностью.'
- source_word: ἐν δυνάμει
  choice: силой
  rationale: Творительный падеж естественно выражает средство или действенную силу, которой Бог приводит к исполнению названные намерение и дело.
theological_decisions:
- issue: Значение ἀξιώσῃ применительно к призванию
  choice: счёл вас достойными призвания
  alternative: сделал вас достойными призвания
  rationale: Основной текст сохраняет оценочный смысл глагола, не приписывая людям самостоятельно достигнутой достойности. Поскольку греческий глагол допускает и преобразующий смысл, этот вариант указан в сноске.
- issue: Значение πίστεως в выражении ἔργον πίστεως
  choice: дело веры
  alternative: дело, порождённое верой; дело верности
  rationale: Буквально-компактная передача не решает за читателя, обозначает ли родительный источник дела или его качество; πίστις также может иметь оттенок верности.
- issue: Связь ἐν δυνάμει с глаголом и его дополнениями
  choice: силой исполнил всякое доброе намерение и дело веры
  alternative: исполнил всякое доброе намерение и сильное дело веры
  rationale: 'Положение оборота и синтаксис естественнее связывают его с πληρώσῃ: Бог осуществляет оба названных предмета силой. При этом перевод не уточняет сверх текста, идёт ли речь исключительно о Божьей силе, хотя субъект глагола делает это наиболее вероятным.'
translation_notes:
  register: Современный литературный русский язык с достоинством апостольской молитвы. Синтаксис сохранён как единое плавное предложение; церковно понятное «призвание» оставлено без добавления отсутствующего в оригинале притяжательного местоимения. Формулировки избегают архаизмов и конфессионально нагруженных уточнений.
