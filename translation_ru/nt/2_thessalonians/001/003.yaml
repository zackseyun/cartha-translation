  - marker: b
    text: Слово, переведённое как «вера», может также иметь оттенок верности или доверия.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Мы должны благодарить
  rationale: Сочетание инфинитива с ὀφείλομεν выражает нравственный долг и подобающее действие; «должны» естественно передаёт эту силу, не превращая её в указание на внешнее принуждение.
- source_word: πάντοτε περὶ ὑμῶν
  choice: всегда … за вас
  rationale: В формуле благодарения περί с обозначением людей естественно передаётся по-русски как «за вас»; πάντοτε сохраняется как «всегда».
- source_word: ἀδελφοί
  choice: братья и сёстры
  rationale: Форма буквально означает «братья», но в обращении к общине может включать верующих обоих полов. Основной текст ясно передаёт эту представитель­ную функцию, а буквальная форма отмечена в сноске.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: как и подобает
  rationale: Оборот выражает уместность и нравственную правоту благодарения; «как и подобает» звучит естественно и достойно.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: ваша вера всё больше возрастает
  rationale: ὑπεραυξάνει — усиленный глагол роста; сочетание «всё больше возрастает» сохраняет интенсивность, а πίστις здесь наиболее естественно означает «вера».
- source_word: πλεονάζει ἡ ἀγάπη
  choice: любовь … умножается
  rationale: πλεονάζει обозначает увеличение и изобилие; «умножается» сохраняет образ возрастания и хорошо сочетается с «любовь».
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: каждого из вас друг к другу
  rationale: Русская формулировка передаёт распределительный акцент на каждом члене общины и взаимную направленность любви без тяжеловесного воспроизведения греческого плеоназма.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: верность; доверие
  rationale: В данном контексте речь наиболее естественно идёт о возрастающей вере фессалоникийцев. Семантическая возможность оттенка верности сохраняется в сноске, без подмены основного значения.
- issue: Инклюзивная функция ἀδελφοί
  choice: братья и сёстры
  alternative: братья
  rationale: Мужской род греческого существительного сохранён в примечании, тогда как основной текст явно передаёт обращение ко всей смешанной общине и избегает возможного современного недопонимания.
translation_notes:
  register: Современный литературный русский язык с достойным эпистолярным звучанием. Синтаксис сохраняет единую причинную конструкцию оригинала; усиленный рост веры и взаимный характер любви выражены ясно, без излишней буквальности.
