source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: ru
  text: 'Павел, Силуан и Тимофей — церкви фессалоникийцев в Боге, нашем Отце, и Господе Иисусе Мессии[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господе Иисусе Христе». Греческий титул Χριστός можно передать как «Мессия» или, согласно традиции, как «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Павел
  rationale: Устоявшаяся русская форма имени, соответствующая Παῦλος.
- source_word: Σιλουανὸς
  choice: Силуан
  rationale: Передаёт именно форму Σιλουανός, не заменяя её сокращённым именем Сила из Деяний.
- source_word: Τιμόθεος
  choice: Тимофей
  rationale: Устоявшаяся русская форма имени Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: церкви
  rationale: Естественное в русском новозаветном контексте обозначение общины верующих.
- source_word: Θεσσαλονικέων
  choice: фессалоникийцев
  rationale: Сохраняет указание греческого родительного множественного числа на людей, а не преобразует его в название места.
- source_word: ἐν
  choice: в
  rationale: Буквально сохраняет сжатую формулировку Павла и не сводит её смысл только к принадлежности, основанию или единению.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Боге, нашем Отце
  rationale: Сохраняет явное ἡμῶν («нашем») и естественно оформляет приложение в современном русском языке.
- source_word: κυρίῳ
  choice: Господе
  rationale: Устоявшаяся передача титула κύριος применительно к Иисусу.
- source_word: Χριστῷ
  choice: Мессии
  rationale: Передаёт Χριστός как титул («Помазанник», «Мессия»), а не только как традиционную часть имени; традиционный вариант дан в сноске.
theological_decisions:
- issue: Передача Χριστῷ в сочетании Ἰησοῦ Χριστῷ
  choice: Иисусе Мессии
  alternative: Иисусе Христе
  rationale: Основной текст сохраняет титульный смысл Χριστός; традиционная русская передача «Христос» указана как допустимая альтернатива.
- issue: Значение ἐν в выражении ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: в Боге, нашем Отце, и Господе Иисусе Мессии
  alternative: принадлежащей Богу, нашему Отцу, и Господу Иисусу Мессии
  rationale: Предлог «в» сохраняет возможные оттенки пребывания, единения, сферы и основания, не разрешая богословскую многозначность в пользу одного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Тире естественно отделяет отправителей от адресата; двоеточие сохраняет незавершённость формулы перед следующим стихом. Формулировка «церкви фессалоникийцев» намеренно следует структуре греческого текста, оставаясь понятной современному читателю.
