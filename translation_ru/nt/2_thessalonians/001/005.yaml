id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: ru
  text: Это — свидетельство праведного суда Божьего[a], чтобы вы были признаны достойными Царства Божьего[b], ради которого вы и страдаете[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доказательство» либо «знак» праведного суда Божьего.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в результате чего вы будете признаны достойными». Греческий оборот может выражать цель или результат.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «за которое»; буквально также возможно: «в пользу которого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: свидетельство
  rationale: Слово обозначает то, что указывает на реальность и подтверждает её. «Свидетельство» естественно по-русски передаёт доказательную силу, не усиливая её до безусловного «доказательства». Подразумеваемая связка «Это —» восполнена, поскольку греческий текст представляет собой безглагольный фрагмент, связанный с предыдущим стихом.
- source_word: δικαίας κρίσεως
  choice: праведного суда
  rationale: Передаёт как справедливость, так и нравственную правоту Божьего суда, сохраняя привычное библейское словоупотребление.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: чтобы вы были признаны достойными
  rationale: Страдательный залог καταξιόω означает признание или счёт кого-либо достойным, а не наделение внутренним достоинством. Оборот εἰς τὸ с инфинитивом допускает оттенок цели или результата; основной текст естественно передаёт его через «чтобы».
- source_word: βασιλείας τοῦ θεοῦ
  choice: Царства Божьего
  rationale: Традиционная, прозрачная и современно понятная передача устойчивого библейского выражения; прописная буква подчёркивает употребление как богословского наименования.
- source_word: ὑπὲρ ἧς
  choice: ради которого
  rationale: ὑπέρ с родительным падежом здесь связывает страдания верующих с Царством как тем, ради чего они страдают; «ради которого» яснее выражает этот смысл, чем более общее «за которое».
- source_word: καὶ πάσχετε
  choice: вы и страдаете
  rationale: Настоящее время передаёт продолжающееся страдание, а частица «и» сохраняет связующую и усилительную функцию καί.
theological_decisions:
- issue: Связь страданий с признанием достойными Царства
  choice: Страдания верующих служат свидетельством в контексте праведного Божьего суда, при котором они будут признаны достойными Царства; текст не говорит прямо, что страдание заслуживает вход в Царство.
  alternative: Страдания сами по себе приобретают или заслуживают достоинство для входа в Царство.
  rationale: Страдательное καταξιωθῆναι означает «быть признанными достойными». Синтаксис связывает это признание с Божьим праведным судом, но не описывает страдание как плату или самостоятельную заслугу. Формулировка сохраняет напряжение текста, не разрешая его конфессионально.
- issue: Цель или результат в εἰς τὸ καταξιωθῆναι
  choice: В основном тексте использован целевой оборот «чтобы», при этом в сноске сохранена возможность результативного понимания.
  alternative: «В результате чего вы будете признаны достойными».
  rationale: Конструкция εἰς τό с инфинитивом может выражать как цель, так и результат; контекст не требует окончательно исключать один из оттенков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя, при этом сохранены богословская насыщенность выражений «праведный суд» и «Царство Божье» и неоднозначность цели/результата.
