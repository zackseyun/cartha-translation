  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: ru
  text: Они понесут наказание — вечную гибель вдали от присутствия Господа и от славы Его могущества,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «вечную гибель, происходящую от присутствия Господа и от славы Его могущества». Греческий предлог может указывать как на отделение («вдали от»), так и на источник («от»).'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Они
  rationale: Местоимение отсылает к упомянутым ранее людям; «они» естественно передаёт эту возобновляющую отсылку, не перегружая качественный оттенок οἵτινες.
- source_word: δίκην τίσουσιν
  choice: понесут наказание
  rationale: Устойчивое греческое сочетание обозначает несение судебной кары. Русское «понесут наказание» сохраняет юридический смысл и звучит естественно.
- source_word: ὄλεθρον αἰώνιον
  choice: вечную гибель
  rationale: «Гибель» передаёт суровый смысл ὄλεθρος, не уточняя спорный способ окончательного наказания; «вечную» естественно передаёт αἰώνιος в эсхатологическом контексте.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: вдали от лица Господа
  rationale: Основной текст понимает ἀπό как удаление или отделение. «Лицо Господа» сохраняет библейский образ πρόσωπον и остаётся понятным в современном литературном русском.
- source_word: ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: от славы Его могущества
  rationale: «Слава» обычно и точно передаёт δόξα, а «могущество» — ἰσχύς; родительная конструкция сохраняется без излишнего истолкования.
theological_decisions:
- issue: Значение ἀπό применительно к окончательному суду
  choice: 'отделение или удаление: «вдали от лица Господа»'
  alternative: 'источник: гибель, исходящая от лица Господа и от славы Его могущества'
  rationale: Предлог ἀπό допускает оба понимания. В основном тексте выбрано контекстуально сильное значение отделения, а грамматически возможное понимание источника сохранено в сноске.
- issue: Смысл выражения «вечная гибель»
  choice: формулировка сохранена без уточнения природы окончательного наказания
  alternative: истолкование как уничтожения либо как вечного сознательного наказания
  rationale: Само греческое выражение обозначает кару и её вечный характер, но не разрешает здесь весь богословский спор о точной природе этой кары.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Лицо Господа» сохраняет исходный образ; формулировка не вносит конфессионального толкования природы вечной гибели.
