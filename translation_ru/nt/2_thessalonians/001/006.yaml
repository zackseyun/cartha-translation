translation:
  language: ru
  text: ведь для Бога справедливо воздать страданием тем, кто причиняет вам страдания[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если действительно справедливо для Бога воздать страданием тем, кто причиняет вам страдания».'
    reason: Сохраняется более формальное условное прочтение εἴπερ; «для Бога» передаёт оценочное значение παρὰ θεῷ без добавления глагола «считает».
lexical_decisions:
- source_word: εἴπερ
  choice: ведь
  rationale: В данном контексте частица вводит основание, которое Павел считает истинным, а не выражает реальное сомнение. «Ведь» естественно передаёт эту риторически предполагаемую посылку; условный оттенок сохранён в сноске.
- source_word: δίκαιον παρὰ θεῷ
  choice: Бог считает справедливым
  rationale: 'Так по-русски естественно передаётся оценочное значение выражения: речь идёт о том, что справедливо у Бога, по Его суждению. Формулировка не превращает справедливость лишь в человеческое мнение о Боге.'
- source_word: ἀνταποδοῦναι
  choice: воздать
  rationale: «Воздать» точно выражает ответное возмездие и соответствует возвышенному, но понятному регистру; оно менее разговорно, чем «отплатить».
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: тем, кто причиняет вам страдания
  rationale: Передаёт причинение тяжёлых притеснений и сохраняет корневую связь с последующим θλῖψιν посредством повтора «страдания».
- source_word: θλῖψιν
  choice: страданием
  rationale: В контексте ответного Божьего воздаяния слово обозначает тяжёлое бедствие или страдание. Этот выбор понятен современному читателю и сохраняет намеренный смысловой повтор с θλίβουσιν.
theological_decisions:
- issue: Характер Божьего воздаяния
  choice: Стих утверждает, что Бог справедливо воздаёт притеснителям страданием, не уточняя в этой части предложения время и способ суда.
  alternative: Ограничить воздаяние исключительно последним судом либо включить сюда также исторические суды.
  rationale: Греческая формулировка утверждает справедливость воздаяния, но сама по себе не разрешает вопрос о полном времени и способе его осуществления.
- issue: Степень условности εἴπερ
  choice: 'Основной текст передаёт посылку как принимаемую за истинную: «ведь».'
  alternative: «Если действительно…»
  rationale: В контексте это риторическое основание, однако формальная условность греческого выражения остаётся возможным оттенком и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским глаголом «воздать». Повтор «страданием… страдания» намеренно отражает однокоренные греческие θλῖψιν и θλίβουσιν. Текст является продолжением синтаксического предложения из предыдущего стиха, поэтому начинается со строчной буквы.
