translation:
  language: ru
  text: Благодать вам и мир от Бога Отца и Господа Иисуса, Мессии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческий титул Χριστός означает «Мессия»; традиционно он передаётся словом «Христос».'
    reason: Указывает традиционный русский эквивалент и поясняет значение титула.
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Передаёт как форму апостольского приветствия, так и богословскую насыщенность слова; «милость» или «благоволение» здесь были бы менее точны.
- source_word: ὑμῖν
  choice: вам
  rationale: Естественная русская передача дательного падежа в формуле благословения.
- source_word: εἰρήνη
  choice: мир
  rationale: Сохраняет прямое значение и библейские оттенки целостности и благополучия.
- source_word: ἀπὸ
  choice: от
  rationale: Указывает на источник благодати и мира.
- source_word: θεοῦ πατρὸς
  choice: Бога Отца
  rationale: Греческий текст не содержит ἡμῶν («нашего»), поэтому перевод не добавляет притяжательное местоимение; русское сочетание «Бог Отец» естественно склоняется как «от Бога Отца».
- source_word: κυρίου
  choice: Господа
  rationale: Сохраняет титульное и богословское значение κύριος в новозаветном контексте.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Передаёт Χριστός как титул со значением «Мессия», а не только как ставшую привычной часть имени; форма родительного падежа обусловлена предлогом «от».
theological_decisions:
- issue: Следует ли добавлять «нашего» при слове «Отца»
  choice: Бога Отца
  alternative: Бога, нашего Отца
  rationale: В представленном тексте SBLGNT местоимения ἡμῶν нет. Русский язык допускает естественное «Бог Отец» без добавления, поэтому исходная формулировка сохраняется без устранения текстовой особенности.
- issue: Передача титула Χριστός
  choice: Мессии
  alternative: Христа
  rationale: «Мессия» явно передаёт значение греческого титула и сохраняет его связь с мессианскими ожиданиями; традиционный вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой и торжественной формы апостольского приветствия. Формулировка понятна без архаизмов; порядок однородных источников благословения следует греческому тексту.
