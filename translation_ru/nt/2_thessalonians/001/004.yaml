id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: ru
  text: так что мы сами хвалимся вами среди Божьих церквей — вашей стойкостью и верой во всех гонениях и скорбях, которые вы переносите.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верностью»; πίστις может означать как веру, так и стойкую верность, особенно в контексте страданий.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт результат того, о чём сказано в предыдущем стихе, и естественно связывает предложения по-русски.
- source_word: αὐτοὺς ἡμᾶς
  choice: мы сами
  rationale: Сохраняет эмфатическое указание на Павла и его сотрудников.
- source_word: ἐν ὑμῖν
  choice: вами
  rationale: При глаголе хвалы обозначает тех, кем хвалятся; русское управление «хвалиться кем» передаёт это кратко и естественно.
- source_word: ἐγκαυχᾶσθαι
  choice: хвалимся
  rationale: Сохраняет сильную положительную риторику исходного глагола и не смягчает её до простого одобрения.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: среди Божьих церквей
  rationale: Передаёт сферу, в которой Павел говорит о фессалоникийцах; «среди» избегает возможной ассоциации исключительно с церковными зданиями.
- source_word: ὑπὲρ
  choice: — вашей
  rationale: Тире вводит основание хвалы — стойкость и веру адресатов. Такая конструкция естественна по-русски и сохраняет причинно-тематический оттенок предлога.
- source_word: ὑπομονῆς
  choice: стойкостью
  rationale: Обозначает терпеливую, твёрдую выдержку под давлением; «стойкость» ясно и современно выражает этот смысл.
- source_word: πίστεως
  choice: верой
  rationale: Сохраняет основное значение πίστις, не исключая в данном контексте оттенка верности, отмеченного в сноске.
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: во всех гонениях и скорбях
  rationale: Передаёт обстоятельства, в которых проявляются стойкость и вера, сохраняя различие между враждебным преследованием и более широкими страданиями.
- source_word: διωγμοῖς
  choice: гонениях
  rationale: Обычное и точное русское обозначение враждебного преследования за убеждения и принадлежность Христу.
- source_word: θλίψεσιν
  choice: скорбях
  rationale: Передаёт тяжёлые бедствия и давление; слово остаётся понятным в современном литературном русском и соответствует возвышенному регистру послания.
- source_word: αἷς ἀνέχεσθε
  choice: которые вы переносите
  rationale: Передаёт продолжающееся терпеливое перенесение испытаний, выраженное настоящим временем.
theological_decisions:
- issue: Значение πίστις в контексте страданий
  choice: вера
  alternative: верность
  rationale: В контексте гонений πίστις может обозначать как веру и доверие Богу, так и сохраняемую верность. Основной текст оставляет привычное и широкое «вера», а реальную смысловую альтернативу отмечает сноска.
translation_notes:
  register: Современный литературный русский с достоинством апостольского послания. Синтаксис сохраняет эмфазу «мы сами», а тире естественно вводит конкретное основание хвалы.
