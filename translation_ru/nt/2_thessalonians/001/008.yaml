    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: в пылающем огне
  rationale: Естественно и образно передаёт сочетание «в пламени огня»; оборот относится к явлению Господа, описанному в предыдущем стихе.
- source_word: διδόντος ἐκδίκησιν
  choice: совершая возмездие
  rationale: Греческое сочетание буквально означает «давая возмездие», но в данном судебном контексте — осуществляя заслуженное наказание. Выбранный оборот сохраняет активный смысл причастия и звучит естественно по-русски.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: над теми, кто не знает Бога
  rationale: Форма οἶδα имеет настоящее значение «знать»; перевод сохраняет обозначенное текстом состояние без добавления мотива или степени виновности.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: не повинуется
  rationale: ὑπακούω означает слушаться, повиноваться; перевод не усиливает выражение до «отказывается повиноваться», поскольку волевой отказ прямо не выражен.
- source_word: τῷ εὐαγγελίῳ
  choice: Евангелию
  rationale: Устоявшийся и точный термин Павловых посланий; прописная буква подчёркивает употребление слова как обозначения христианской Благой вести.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: нашего Господа Иисуса
  rationale: Сохраняет титул κύριος, притяжательное отношение и естественный русский порядок слов.
theological_decisions:
- issue: Характер ἐκδίκησις в Божьем суде
  choice: возмездие
  alternative: отмщение
  rationale: «Возмездие» ясно передаёт судебное воздаяние и суровость контекста, не создавая лишней ассоциации с греховной человеческой мстительностью. В сноске сохраняется более прямой вариант «отмщение».
- issue: Соотношение двух групп адресатов суда
  choice: теми, кто не знает Бога и не повинуется Евангелию
  alternative: понимать обороты как обозначение двух строго разграниченных групп
  rationale: Союз καί сохранён без пояснения того, совпадают ли эти группы полностью, частично или не совпадают; присущая тексту неоднозначность не устраняется.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный регистр. Синтаксис намеренно остаётся продолжением предыдущего стиха; конечная запятая отражает незавершённость предложения в данном фрагменте.
