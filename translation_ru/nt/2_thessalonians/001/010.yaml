  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: ru
  text: в тот день, когда Он придёт, чтобы быть прославленным среди Своих святых[a] и вызвать восхищение у всех уверовавших, потому что вы поверили нашему свидетельству[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Своих святых». Греческий предлог может означать как то, что Христос будет прославлен среди Своего святого народа, так и то, что Его слава явится в них.'
    reason: lexical_alternative
  - marker: b
    text: 'С сохранением порядка греческого текста: «когда Он придёт, чтобы быть прославленным среди Своих святых и вызвать восхищение у всех уверовавших, потому что наше свидетельство, обращённое к вам, было принято вами с верой, — в тот день».'
    reason: word_order_and_previous_rendering
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: когда Он придёт
  rationale: ὅταν с аористом сослагательного наклонения указывает здесь на определённое будущее событие; эта формулировка естественна в современном русском языке.
- source_word: ἐνδοξασθῆναι
  choice: чтобы прославиться
  rationale: Пассивный инфинитив выражает цель или результат пришествия и сохраняет смысл явления и признания славы.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: среди Своих святых
  rationale: Предлог ἐν допускает значения «среди» и «в». В основном тексте выбрано естественное корпоративное «среди», а возможный смысл проявления славы «в» святых сохранён в примечании.
- source_word: θαυμασθῆναι
  choice: вызвать изумление
  rationale: Такая активная перестройка естественно передаёт пассивный инфинитив и выражает благоговейное, поражённое восхищение, не сводя его к простому одобрению.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: у всех уверовавших
  rationale: Субстантивированное причастие передано причастием, что сохраняет его глагольную силу; предлог «у» естественно сочетается с выражением «вызвать изумление».
- source_word: ὅτι
  choice: потому что
  rationale: 'Союз понимается причинно: фессалоникийцы относятся к уверовавшим, поскольку приняли апостольское свидетельство.'
- source_word: ἐπιστεύθη τὸ μαρτύριον ἡμῶν
  choice: вы поверили нашему свидетельству
  rationale: Русская личная конструкция естественнее буквального пассива «наше свидетельство было принято с верой» и точно передаёт смысл πιστεύω с дательным дополнением.
- source_word: ἐφ’ ὑμᾶς
  choice: вы
  rationale: Направленность свидетельства к адресатам и их отклик естественно выражены личной конструкцией «вы поверили»; буквальное «вам» при пассиве звучало бы тяжеловесно.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Устойчивое русское эсхатологическое временное выражение; вынесение в начало делает связь с пришествием ясной.
theological_decisions:
- issue: Значение выражения «ἐν τοῖς ἁγίοις αὐτοῦ»
  choice: «среди Своих святых» — Христос прославляется среди принадлежащего Ему святого народа.
  alternative: «в Своих святых» — Его слава обнаруживается и явлена в них.
  rationale: Контекст сближает «святых» со «всеми уверовавшими», поэтому речь, вероятнее всего, идёт о верующих. Однако неоднозначность предлога ἐν сохранена в примечании.
- issue: Связь ὅτι ἐπιστεύθη с адресатами
  choice: 'Причинное чтение: «потому что вы поверили нашему свидетельству».'
  alternative: 'Более буквальное пассивное чтение: «потому что наше свидетельство вам было принято с верой».'
  rationale: Причинное значение ὅτι объясняет включение адресатов в число уверовавших; личная русская конструкция не добавляет специального конфессионального смысла.
- issue: Положение временной фразы «ἐν τῇ ἡμέρᾳ ἐκείνῃ»
  choice: «в тот день» поставлено в начале стиха и обрамляет всё описываемое событие.
  alternative: Сохранить греческий порядок, поставив «в тот день» в конце.
  rationale: Конечное положение сохраняет риторический акцент оригинала, но в русском может ошибочно восприниматься как относящееся лишь к ближайшей части фразы; вариант порядка слов отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным эсхатологическим звучанием. Местоимение «Он» и притяжательное «Своих» написаны с прописной буквы как уважительное обозначение Христа. Причастие «уверовавших» сохраняет библейскую возвышенность, оставаясь понятным современному читателю.
