  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: ru
  text: а вам, терпящим притеснения, — облегчение вместе с нами, когда Господь Иисус явится с неба вместе со Своими могущественными ангелами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «с ангелами Его силы».'
    reason: Сохраняет более формальное прочтение неоднозначной родительной конструкции ἀγγέλων δυνάμεως αὐτοῦ.
lexical_decisions:
- source_word: θλιβομένοις
  choice: терпящим притеснения
  rationale: Причастие настоящего времени в страдательном залоге обозначает тех, кто сейчас подвергается давлению и угнетению. Такой перевод сохраняет пассивный смысл и словесную связь с θλίβω в ближайшем контексте.
- source_word: ἄνεσιν
  choice: облегчение
  rationale: Слово означает ослабление давления, передышку или покой. «Облегчение» непосредственно противопоставлено переживаемым притеснениям и не сводит обещание лишь к внутреннему покою.
- source_word: μεθ’ ἡμῶν
  choice: вместе с нами
  rationale: Передаёт простое значение совместности и сохраняет включение Павла и его сотрудников в обещанное облегчение.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: когда … явится
  rationale: Предлог с существительным события имеет здесь временной смысл. Придаточное времени естественно звучит по-русски и ясно передаёт эсхатологическое явление Иисуса.
- source_word: ἀποκαλύψει
  choice: явится
  rationale: В данном контексте ἀποκάλυψις обозначает открытое явление, снятие сокрытия. Глагольная передача сохраняет смысл, избегая двусмысленного русского сочетания «откровение Господа».
- source_word: κυρίου
  choice: Господь
  rationale: Передаёт титульное значение κύριος и соответствует устойчивому новозаветному употреблению.
- source_word: ἀπ’ οὐρανοῦ
  choice: с неба
  rationale: ἀπό указывает на исходную точку; «с неба» — естественная русская передача в контексте явления Господа.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: со Своими могущественными ангелами
  rationale: 'Сжатая родительная конструкция допускает качественное понимание: ангелы, отличающиеся силой. Основной текст передаёт это естественно по-русски, а более буквальная конструкция, сохраняющая возможную связь ангелов с силой Господа, дана в сноске.'
theological_decisions:
- issue: Значение родительной конструкции ἀγγέλων δυνάμεως αὐτοῦ
  choice: со Своими могущественными ангелами
  alternative: с ангелами Его силы
  rationale: Греческая конструкция может качественно характеризовать ангелов как могущественных либо связывать их с силой Господа. Естественный качественный смысл помещён в основной текст, а формально более близкий вариант сохранён в сноске, чтобы не скрывать синтаксическую неоднозначность.
- issue: Временное значение ἐν τῇ ἀποκαλύψει
  choice: когда Господь Иисус явится
  alternative: при явлении Господа Иисуса
  rationale: Оба варианта связывают обещанное облегчение с эсхатологическим открытым явлением Иисуса. Придаточное времени яснее и естественнее в современном русском, не меняя временной связи.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Синтаксис учитывает, что стих продолжает мысль предыдущего стиха; подразумеваемое «дать» делает фрагмент понятным по-русски. Местоимение «Своими» употреблено как возвратное к подлежащему «Господь Иисус».
