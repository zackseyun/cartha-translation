source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: ru
  text: чтобы имя нашего Господа Иисуса прославилось в вас[a] и вы — в Нём, по благодати нашего Бога и Господа Иисуса Христа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди вас». Греческий предлог в данном контексте допускает оба оттенка.'
    reason: lexical_alternative
  - marker: b
    text: Греческий оборот тесно связывает слова «Бог» и «Господь Иисус Христос» и может пониматься как отнесение обоих титулов к Иисусу Христу; возможно также различать «нашего Бога» и «Господа Иисуса Христа». Перевод сохраняет компактность исходной формулировки.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно вводит цель или ожидаемый результат молитвы из предыдущего стиха.
- source_word: ἐνδοξασθῇ
  choice: прославилось
  rationale: Передаёт аорист пассивного сослагательного наклонения и сохраняет богословски значимую лексику славы.
- source_word: τὸ ὄνομα
  choice: имя
  rationale: 'Сохраняет буквальную библейскую метонимию: имя представляет личность, её явленную сущность и честь.'
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: нашего Господа Иисуса
  rationale: Естественный русский порядок слов, сохраняющий титул κύριος и притяжательное ἡμῶν.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Формально соответствует ἐν и сохраняет как личный, так и собирательный оттенок; возможное значение «среди вас» отмечено в сноске.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: и вы — в Нём
  rationale: 'Сохраняет взаимную параллель: имя Господа прославляется в верующих, а верующие — в Нём. Местоимение естественнее всего относится к Господу Иисусу.'
- source_word: κατὰ τὴν χάριν
  choice: по благодати
  rationale: Кратко и естественно передаёт соответствие или основание, выраженное κατά с винительным падежом, не сводя оборот только к инструментальности.
- source_word: χάριν
  choice: благодати
  rationale: Устоявшийся и содержательно точный русский эквивалент χάρις в посланиях Павла.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: нашего Бога и Господа Иисуса Христа
  rationale: Компактный оборот близко воспроизводит единственный греческий артикль и тесную синтаксическую связь определений, не добавляя второго артикля или предлога. «Христос» в современном русском является естественным и узнаваемым соответствием Χριστός.
theological_decisions:
- issue: К кому относится αὐτῷ
  choice: 'к Господу Иисусу: «в Нём»'
  alternative: 'к имени: «в нём»'
  rationale: Мужской род местоимения и взаимная конструкция прославления убедительнее указывают на Господа Иисуса; это также согласуется с павловским языком пребывания «в Нём».
- issue: Синтаксическая сила заключительного родительного оборота
  choice: 'сохранена тесная связь: «нашего Бога и Господа Иисуса Христа»'
  alternative: 'два явно разграниченных референта: «нашего Бога и Господа Иисуса Христа» с пояснительной сноской о возможном различении'
  rationale: Один артикль перед θεοῦ и соединение посредством καί синтаксически тесно связывают выражение и естественно допускают отнесение обоих титулов к Иисусу Христу. Перевод сохраняет компактность греческого оборота, а сноска фиксирует обсуждаемую альтернативу без её навязывания.
- issue: Передача Χριστοῦ
  choice: Христа
  alternative: Мессии
  rationale: В современном литературном русском «Иисус Христос» — естественная форма имени с титульным происхождением; вариант «Мессия» возможен как смысловая передача, но здесь звучит менее органично в формульном эпистолярном обороте.
translation_notes:
  register: Современный литературный русский язык с dignified библейским регистром. Синтаксис сохранён компактным; тире проясняет эллиптическое «и вы [прославились] в Нём». Прописная буква в «Нём» указывает на личный референт в соответствии с русской библейской традицией.
