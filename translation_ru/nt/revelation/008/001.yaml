  source_fidelity: 'Текст точно передаёт греческую конструкцию: временное «когда», невыраженное подлежащее через «он», «открыл седьмую печать», наступление тишины «на небе» и приблизительную длительность «примерно на полчаса». Динамическое «настала тишина» уместно передаёт ἐγένετο σιγή, не добавляя смысловых деталей.'
