id: REV.8.1
reference: Revelation 8:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: ru
  text: И когда он открыл седьмую печать[a], на небе примерно на полчаса настала тишина.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вскрыл седьмую печать». Греческий текст буквально говорит: «открыл седьмую печать».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на небе примерно полчаса была тишина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Хотя ὅταν может иметь неопределённое или повторяющееся значение «всякий раз, когда», здесь повествуется об одном конкретном событии, поэтому естественно «когда».
- source_word: ἤνοιξεν
  choice: открыл
  rationale: ἀνοίγω означает «открывать». Более образное «вскрыл» сильнее подчёркивало бы нарушение целостности печати, чем это выражено в греческом тексте.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: седьмую печать
  rationale: σφραγίς — обычное обозначение печати; порядковое определение естественно передаётся как «седьмую».
- source_word: ἐγένετο σιγὴ
  choice: настала тишина
  rationale: Конструкция обозначает наступление состояния. «Настала тишина» естественно по-русски и передаёт динамический оттенок ἐγένετο точнее, чем простое «была тишина».
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В данном контексте οὐρανός обозначает небесную сферу. Нормативное русское выражение — «на небе».
- source_word: ὡς ἡμιώριον
  choice: примерно на полчаса
  rationale: ὡς при обозначении времени выражает приблизительность, а винительный ἡμιώριον — продолжительность; сочетание естественно передано как «примерно на полчаса».
theological_decisions:
- issue: Невыраженное подлежащее при ἤνοιξεν
  choice: «он открыл»
  alternative: «Агнец открыл»
  rationale: Форма глагола указывает на третье лицо единственного числа, но прямо не называет действующее лицо. Местоимение сохраняет структуру исходного текста и связь с Агнцем из предшествующего контекста, не добавляя имени в сам стих.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Порядок слов делает акцент на наступившей тишине и сохраняет приблизительность указанного промежутка времени.
