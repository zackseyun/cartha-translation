source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: ru
  text: И я увидел семь ангелов, которые стоят перед Богом[a], и им были даны семь труб.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые находятся перед Богом»; греческий перфект подчёркивает, что они пребывают в этом состоянии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: увидел
  rationale: Аорист ὁράω в повествовании о видении естественно передаётся как «увидел»; это сохраняет характер сообщения о видении без архаизма.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: семь ангелов
  rationale: Определённый артикль указывает на определённую группу; в русском языке определённость здесь достаточно выражена контекстом и придаточным определением, поскольку отдельного артикля нет.
- source_word: ἀγγέλους
  choice: ангелов
  rationale: В небесной сцене у престола речь идёт о сверхъестественных ангелах, а не о человеческих посланниках.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Естественное и точное выражение пространственно-отношенческого смысла ἐνώπιον без избыточного развёртывания.
- source_word: ἑστήκασιν
  choice: стоят
  rationale: Перфект ἵστημι обозначает сохраняющееся состояние; настоящее время «стоят» естественно передаёт этот стативный смысл по-русски.
- source_word: ἐδόθησαν αὐτοῖς
  choice: им были даны
  rationale: Пассивная конструкция сохраняет не названного прямо деятеля и не заменяет её активным по смыслу глаголом «получили».
- source_word: σάλπιγγες
  choice: труб
  rationale: «Трубы» — традиционное и контекстуально уместное обозначение σάλπιγγες в апокалиптической сцене суда.
theological_decisions:
- issue: Личность и статус семи ангелов
  choice: «семь ангелов, которые стоят перед Богом» без уточнения их ранга
  alternative: «семь архангелов» или явное отождествление с ангелами позднейшей традиции
  rationale: Греческий текст говорит об определённой группе из семи ангелов, но не называет их архангелами и не поясняет их ранг; перевод не должен вносить более поздние отождествления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены последовательность двух частей стиха, пассивная конструкция и смысловая неопределённость относительно статуса ангелов и того, кто дал им трубы.
