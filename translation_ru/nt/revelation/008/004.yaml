id: REV.8.4
reference: Revelation 8:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: ru
  text: И дым благовоний поднялся вместе с молитвами святых из руки ангела перед Богом[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознёсся».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с молитвами святых». Эти слова связывают дым благовоний с молитвами, но в данном стихе прямо не отождествляют их.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: поднялся
  rationale: Аорист ἀναβαίνω обозначает движение вверх. «Поднялся» естественно передаёт конкретный образ дыма, не добавляя торжественной окраски, возможной у «вознёсся».
- source_word: καπνὸς
  choice: дым
  rationale: Передано в обычном конкретном значении; апокалиптический контекст не требует истолковывать образ.
- source_word: θυμιαμάτων
  choice: благовоний
  rationale: θυμίαμα здесь означает культовое ароматическое курение. Русское «благовония» естественно в библейском храмовом контексте и допускает собирательное понимание греческого множественного числа.
- source_word: ταῖς προσευχαῖς
  choice: вместе с молитвами
  rationale: Дательный падеж связывает восходящий дым с молитвами, но не уточняет природу этой связи. «Вместе с» сохраняет ассоциацию, не отождествляя благовония с молитвами и не утверждая, что дым их переносит.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: В Откровении это устойчивое обозначение посвящённого Богу народа. «Святых» сохраняет библейский термин и не сужает его до позднейшего значения официально канонизированных лиц.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: из руки ангела
  rationale: 'Близкая к форме оригинала передача сохраняет зримый образ: дым поднимается из руки ангела. Более идиоматическое «от руки ангела» могло бы быть понято как указание лишь на действующее лицо.'
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Естественная современная передача значения «в присутствии Бога», сохраняющая пространственно-культовый образ видения.
theological_decisions:
- issue: Соотношение благовоний и молитв
  choice: «дым благовоний поднялся вместе с молитвами святых» — связь сохранена без прямого отождествления.
  alternative: «дым благовоний, то есть молитвы святых, поднялся»; либо «дым поднялся ради молитв святых».
  rationale: Греческая конструкция связывает дым с молитвами, но в этом стихе прямо не объявляет их тождественными и не определяет точнее характер связи. Перевод сохраняет эту неоднозначность.
- issue: Кого обозначают «святые»
  choice: Сохранён широкий библейский термин «святые» для принадлежащего Богу народа.
  alternative: «святой народ»; «Божьи святые».
  rationale: Контекст не даёт оснований ограничивать обозначение какой-либо позднейшей конфессиональной категорией; добавление «Божьи» отсутствует в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис оставлен достаточно близким к греческому ради сохранения последовательности образов; выражение «из руки ангела» намеренно сохраняет конкретность видения.
