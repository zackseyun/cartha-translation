id: REV.8.8
reference: Revelation 8:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: ru
  text: И второй ангел протрубил; и нечто, подобное большой горе, пылающей огнём,[a] было брошено в море; и треть моря стала кровью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно большая гора, пылающая огнём»; греческое ὡς указывает на подобие, а не обязательно на тождество.'
    reason: Лексическая альтернатива для ὡς и сохранение неопределённости образа.
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: вострубил
  rationale: Глагол означает «протрубить, издать звук трубы». «Вострубил» естественно для возвышенного апокалиптического повествования и не требует добавлять отсутствующее в греческом тексте дополнение «в трубу».
- source_word: ὡς
  choice: нечто, подобное
  rationale: Так передаётся сравнение, а не утверждение, что брошенный предмет действительно был горой; при этом сохраняется неопределённость видения.
- source_word: ὄρος μέγα
  choice: великая гора
  rationale: «Великая» сохраняет как представление о большом размере, так и возвышенный тон образа, не добавляя разговорной экспрессии слова «огромная».
- source_word: πυρὶ καιόμενον
  choice: пылающей огнём
  rationale: Передаёт причастие и дательный πυρί буквально и образно, не отождествляя видение с вулканом, метеоритом или иным конкретным явлением.
- source_word: ἐβλήθη
  choice: было брошено
  rationale: Пассивная форма сохраняет неуказанного деятеля и не усиливает действие сверх значения греческого глагола.
- source_word: εἰς τὴν θάλασσαν
  choice: в море
  rationale: Прямой и естественный русский эквивалент; «океан» был бы неоправданным уточнением.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: треть моря
  rationale: Естественно передаёт партитивное выражение и характерный для Откровения мотив суда, затрагивающего треть.
- source_word: αἷμα
  choice: кровью
  rationale: Прямо передаёт утверждение текста без символического или натуралистического истолкования.
theological_decisions:
- issue: Природа предмета, подобного горе
  choice: Передать его как неопределённое «нечто, подобное великой горе»
  alternative: Понять образ как буквальную гору, небесное тело либо исключительно символ суда
  rationale: Слово ὡς выражает подобие. Перевод сохраняет неопределённость видения и не решает, является ли образ буквальным, символическим или совмещает оба аспекта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Союзы и параллельные части фразы сохраняют последовательный ритм греческого повествования; устаревшая лексика сведена к понятному в библейском контексте глаголу «вострубил».
