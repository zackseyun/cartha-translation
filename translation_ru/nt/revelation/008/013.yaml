  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: ru
  text: 'И я увидел и услышал одного орла[a], летящего посреди неба[b] и громко говорящего: «Горе, горе, горе живущим на земле — из-за остальных трубных звуков трёх ангелов, которые готовы затрубить!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «одного ангела» вместо «одного орла».'
    reason: textual_variant
  - marker: b
    text: 'Или: «в зените»; греческое слово обозначает открытую часть неба в его высшей точке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: орла
  rationale: Обычное значение — «орёл»; контекст не указывает специально на птицу, питающуюся падалью. Основной текст следует чтению SBLGNT.
- source_word: μεσουρανήματι
  choice: посреди неба
  rationale: Передаёт открытое небо в высшей точке над землёй, сохраняя возвышенный апокалиптический регистр и оставаясь понятным современному читателю.
- source_word: λέγοντος φωνῇ μεγάλῃ
  choice: громко возглашающего
  rationale: Естественно по-русски передаёт буквальное «говорящего громким голосом» и характер публичного провозглашения.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Горе, горе, горе
  rationale: Тройное повторение сохранено ради пророческой силы и риторического напряжения.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: живущим на земле
  rationale: Естественная современная формулировка, сохраняющая повторяющееся в Откровении обозначение людей, обитающих на земле.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: от остальных трубных звуков
  rationale: Предлог ἐκ здесь передаёт причину бедствия; φωναί сохраняется как «звуки», а принадлежность к трубе выражена прилагательным «трубных».
- source_word: τῶν μελλόντων σαλπίζειν
  choice: которые готовы затрубить
  rationale: Передаёт близость предстоящего действия в конструкции μέλλω с инфинитивом и естественно выражает подразумеваемую игру на трубах.
theological_decisions:
- issue: Текстовое чтение о летящем вестнике
  choice: одного орла
  alternative: одного ангела
  rationale: Основной текст следует чтению SBLGNT ἀετοῦ («орла»). Вариант «ангела» отмечен в сноске, но не подменяет исходное чтение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Сохранены начальное повторение «увидел… услышал», тройное «горе» и образ трубных звуков.
