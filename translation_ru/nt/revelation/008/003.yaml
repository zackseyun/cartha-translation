id: REV.8.3
reference: Revelation 8:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: ru
  text: И пришёл другой ангел и встал у жертвенника, держа золотую кадильницу[a]. Ему дали много благовоний, чтобы он возложил их вместе с молитвами всех святых[b] на золотой жертвенник перед престолом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «золотой сосуд для благовоний».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы он дал их молитвам всех святых»; по смыслу благовония приносятся вместе с молитвами или присоединяются к ним.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: другой ангел
  rationale: ἄλλος указывает на ещё одного ангела в последовательности, а не на существо иного рода; «другой ангел» естественно передаёт это значение.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: встал у жертвенника
  rationale: ἐστάθη описывает, как ангел занял место; ἐπί с родительным здесь естественно понимать как положение у жертвенника, а не на его поверхности.
- source_word: λιβανωτὸν χρυσοῦν
  choice: золотую кадильницу
  rationale: λιβανωτός обозначает сосуд для воскурения благовоний. «Кадильница» — точный и устоявшийся русский эквивалент, а χρυσοῦν передано словом «золотую».
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: ему дали много благовоний
  rationale: Русская активная неопределённо-личная конструкция естественно передаёт греческий богословский пассив, не называя дающего; θυμιάματα здесь обозначает благовонное вещество или курение, поэтому употреблено неисчисляемое «много благовоний».
- source_word: ἵνα δώσει
  choice: чтобы он возложил их
  rationale: δίδωμι буквально означает «дать», но в культовом контексте жертвенника и благовоний передаёт их принесение или возложение. Местоимение «их» восстанавливает подразумеваемый объект из предыдущей части фразы.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: вместе с молитвами всех святых
  rationale: Дательный падеж в греческом синтаксически сжат и допускает более буквальное «к молитвам». В контексте образ означает, что благовония сопровождают молитвы; неоднозначность отмечена в сноске.
- source_word: ἅγιοι
  choice: святые
  rationale: В Откровении слово обозначает освящённый Божий народ. «Святые» — краткий, точный и традиционно понятный русский эквивалент без уточнения их статуса сверх сказанного в тексте.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: на золотой жертвенник
  rationale: ἐπί с винительным после глагола культового действия указывает на направление и помещение благовоний на жертвенник.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: перед престолом
  rationale: ἐνώπιον выражает пространственное положение или нахождение в присутствии; «перед престолом» естественно сохраняет оба оттенка.
theological_decisions:
- issue: Связь благовоний с молитвами святых
  choice: Благовония возлагаются вместе с молитвами всех святых.
  alternative: Благовония даются или прилагаются к молитвам всех святых.
  rationale: Сжатая конструкция с дательным падежом буквально допускает «дать к молитвам», однако храмовый образ указывает на совместное принесение благовоний и молитв. Перевод не развивает из этого отдельного учения об ангельском посредничестве, а буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слова «жертвенник», «кадильница», «святые» и «престол» сохранены как точные и широко узнаваемые термины; синтаксис сделан ясным для обычного современного читателя.
