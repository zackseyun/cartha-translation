reference: Revelation 8:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: ru
  text: Имя звезды — Полынь[a]. И треть вод стала полынью, и многие люди умерли от этих вод, потому что воды стали горькими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может обозначать полынь — растение с резко горьким вкусом. Одно и то же слово служит именем звезды и описывает, чем стали воды.
    reason: lexical_link
  - marker: b
    text: 'Буквальнее: «потому что они были сделаны горькими»; по смыслу местоимение относится к водам.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄνομα τοῦ ἀστέρος λέγεται
  choice: Имя звезды —
  rationale: Естественная русская именная конструкция передаёт смысл «звезда называется», не воспроизводя тяжеловесно греческий оборот «имя называется».
- source_word: Ἄψινθος / ἄψινθον
  choice: Полынь / полынью
  rationale: «Полынь» — обычное русское название горького растения; повтор одного слова сохраняет смысловую связь между именем звезды и изменением вод.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: треть вод
  rationale: Краткое и естественное выражение, точно сохраняющее долевое значение греческой конструкции.
- source_word: ἐγένετο ... εἰς ἄψινθον
  choice: стала полынью
  rationale: Творительный падеж после «стала» естественно передаёт превращение или наступившее состояние и сохраняет конкретность образа.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: многие люди
  rationale: Передаёт общее обозначение людей без необоснованного ограничения по полу; по-русски естественнее буквального «многие из людей».
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: умерли от этих вод
  rationale: Предлог «от» передаёт источник или причину смерти, не добавляя отсутствующего в тексте указания на питьё.
- source_word: ὅτι ἐπικράνθησαν
  choice: потому что воды стали горькими
  rationale: Явное повторение «воды» устраняет неестественную для русского местоименную двусмысленность; «стали горькими» ясно выражает наступивший результат, хотя формально греческий глагол пассивен.
theological_decisions:
- issue: К чему относится форма ἐπικράνθησαν
  choice: 'К водам: «воды стали горькими»'
  alternative: 'К людям: они испытали горечь, были отравлены или ожесточились'
  rationale: Ближайший грамматический антецедент во множественном числе — «воды», и контекст связывает смерть людей с изменившимися водами. Это синтаксически и контекстуально наиболее вероятное прочтение, не требующее доктринального уточнения.
- issue: Характер превращения вод в полынь
  choice: 'Сохранён конкретный метафорический образ: «стала полынью»'
  alternative: 'Истолковать образ: «стала горькой, как полынь» или «стала ядовитой»'
  rationale: Греческий текст не поясняет, идёт ли речь о буквальном превращении, горечи или ядовитости; перевод сохраняет эту образную напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Сохранены повтор «полынь — полынью» и конкретность апокалиптического образа; устранён лишь неестественный греческий оборот «имя называется».
