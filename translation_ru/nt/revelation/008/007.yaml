id: REV.8.7
reference: Revelation 8:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: ru
  text: И первый затрубил. Тогда появились град и огонь, смешанные с кровью, и всё это было брошено на землю. Треть земли сгорела, треть деревьев сгорела, и вся зелёная трава сгорела.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Существительное «ангел» подразумевается ближайшим контекстом (Откр. 8:2, 6), но в самом стихе отсутствует; русская субстантивация «первый» сохраняет эллипсис оригинала.
- source_word: ἐσάλπισεν
  choice: затрубил
  rationale: Русский глагол естественно передаёт звучание трубы без добавления прямо не выраженного дополнения; из контекста ясно, что речь идёт о трубе.
- source_word: ἐγένετο
  choice: появились
  rationale: Передаёт событийное значение γίνομαι и естественно вводит возникшее в видении явление.
- source_word: χάλαζα καὶ πῦρ
  choice: град и огонь
  rationale: Прямо сохраняет парный и зримый образ оригинала.
- source_word: μεμιγμένα ἐν αἵματι
  choice: смешанные с кровью
  rationale: Причастие во множественном числе относится к граду и огню вместе; оборот с «с» естественно передаёт значение смешения при ἐν.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: всё это было брошено на землю
  rationale: Указательное «всё это» позволяет по-русски передать единственное число пассивного глагола, представляющего совокупное явление как одно целое, и сохраняет направленность εἰς.
- source_word: τὸ τρίτον τῆς γῆς
  choice: треть земли
  rationale: Естественное русское выражение доли; слово «земля» сохраняет возможный диапазон значений γῆ — от суши/земли до мира людей — без искусственного сужения.
- source_word: κατεκάη
  choice: сгорела
  rationale: Глагол «сгореть» естественно выражает результативное, усиленное значение κατακαίω; повтор сохранён как риторическая черта оригинала.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: треть деревьев
  rationale: Точная и естественная передача партитивной конструкции.
- source_word: πᾶς χόρτος χλωρός
  choice: вся зелёная трава
  rationale: Конкретно передаёт χόρτος и χλωρός и сохраняет образ живой зелёной растительности.
theological_decisions:
- issue: Объём значения γῆ в картине апокалиптического суда
  choice: земля
  alternative: суша; страна
  rationale: Русское «земля» соответствует широкому семантическому диапазону греческого γῆ и сохраняет присущую тексту неоднозначность, не ограничивая действие одной местностью и не навязывая космологическое толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Сохранены повтор «сгорела» и эллиптическое «первый»; устаревшие «вострубил», «повержено» и «третья часть» не использованы.
