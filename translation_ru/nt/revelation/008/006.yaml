  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: ru
  text: И семь ангелов, у которых были семь труб, приготовились трубить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подать трубный звук». Греческий глагол означает «трубить, подавать звук трубой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: ангелов
  rationale: В контексте небесного видения Откровения речь идёт о небесных существах; «ангелы» — точный и естественный эквивалент.
- source_word: ἔχοντες
  choice: у которых были
  rationale: Причастный оборот естественно передан определительным придаточным, обозначающим обладание трубами.
- source_word: σάλπιγγας
  choice: труб
  rationale: «Труба» — обычное русское библейское обозначение сигнального инструмента и сохраняет апокалиптическую образность.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: приготовились
  rationale: Возвратный русский глагол точно и естественно передаёт действие подготовки самих себя.
- source_word: ἵνα σαλπίσωσιν
  choice: трубить
  rationale: Инфинитив после «приготовились» естественно выражает цель; «трубить» передаёт действие подачи звука трубой без добавления не выраженного существительного.
theological_decisions:
- issue: Кого обозначает ἄγγελοι
  choice: небесные ангелы
  alternative: человеческие посланники
  rationale: Небесная сцена и вручённые семи персонажам трубы однозначно поддерживают обычное для данного контекста значение «ангелы».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Лаконичная конструкция сохраняет порядок событий и цель подготовки; маркер сноски помещён непосредственно после соответствующего глагола.
