id: REV.8.10
reference: Revelation 8:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: ru
  text: И третий ангел протрубил. С неба[a] упала большая звезда[b], горевшая, словно факел[c], и упала на треть рек и на источники вод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «с небес». Греческое слово может обозначать как небо над землёй, так и небесную сферу.
    reason: lexical_alternative
  - marker: b
    text: Образ «звезды» не истолковывается в переводе. Его понимают как ангельское существо, небесное тело наподобие метеора или символическую власть.
    reason: alternative_reading
  - marker: c
    text: Или «словно светильник». Греческое слово может обозначать факел или светильник; «факел» лучше соответствует образу ярко горящей падающей звезды.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: протрубил
  rationale: Глагол означает «затрубить, подать звук трубой». Русское «протрубил» естественно передаёт действие без добавления отсутствующего в греческом тексте существительного «труба».
- source_word: ἀστὴρ μέγας
  choice: большая звезда
  rationale: Прямо передаёт сочетание существительного и прилагательного, не уточняя, идёт ли речь о размере, величии или значимости образа.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: В описании падения звезды современное русское «с неба» звучит естественно; греческое οὐρανός допускает также значение «небеса».
- source_word: καιόμενος ὡς λαμπάς
  choice: горевшая, словно факел
  rationale: Причастие передаёт продолжающееся горение, а сравнение с факелом сохраняет яркий зрительный образ греческого текста.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: упала ... и упала
  rationale: 'Повтор глагола сохранён ради ритма и акцента оригинала: сначала говорится о падении с неба, затем — о том, куда звезда упала.'
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: на треть рек
  rationale: τὸ τρίτον в последовательности судов Откровения обозначает одну треть; такая формулировка кратка и естественна по-русски.
- source_word: πηγὰς τῶν ὑδάτων
  choice: источники вод
  rationale: Сохраняет образ родников или природных источников и торжественный генитивный оборот оригинала, оставаясь понятным современному читателю.
theological_decisions:
- issue: Кого или что обозначает падающая звезда
  choice: Образ оставлен как «большая звезда» без истолкования.
  alternative: Ангельское существо, небесное тело наподобие метеора либо символическая власть.
  rationale: Сам стих называет увиденное звездой, но не раскрывает однозначно её природу. Буквальная передача сохраняет образ и богословскую неоднозначность видения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Синтаксис остаётся ясным, а повтор «упала ... и упала» намеренно сохраняет ритм греческого текста.
