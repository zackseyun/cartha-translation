  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: ru
  text: И ангел взял кадильницу, наполнил её огнём с жертвенника и бросил на землю; и раздались раскаты грома и звуки[a], засверкали молнии, и произошло землетрясение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голоса». Греческое слово может означать как голоса, так и звуки или шум в сцене богоявления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: взял
  rationale: Перфект передан естественным для русского повествования прошедшим временем; контекст описывает последовательность действий, продолженную аористами.
- source_word: λιβανωτόν
  choice: кадильницу
  rationale: В данном храмовом контексте речь идёт о сосуде для благовоний и горящих углей; «кадильница» — точный и общепонятный русский эквивалент.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: наполнил её огнём с жертвенника
  rationale: Формулировка естественно передаёт, что кадильница была наполнена огнём, взятым с жертвенника, и сохраняет символически важное указание на источник огня.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: бросил на землю
  rationale: Глагол передаёт резкое, силовое действие, а γῆ в этой сцене суда имеет широкий смысл «земля», а не только «почва».
- source_word: βρονταὶ
  choice: раскаты грома
  rationale: Множественное число передаёт повторяющиеся громовые раскаты; это естественная современная русская формулировка.
- source_word: φωναὶ
  choice: звуки
  rationale: φωνή может обозначать как голос, так и звук. Поскольку говорящие не названы, «звуки» не уточняет сверх исходного текста; вариант «голоса» сохранён в сноске.
- source_word: ἀστραπαὶ
  choice: вспышки молний
  rationale: Передаёт множественное число и зрительный характер явления естественным современным русским языком.
- source_word: σεισμός
  choice: землетрясение
  rationale: Прямой и контекстуально ясный эквивалент греческого существительного.
theological_decisions:
- issue: Значение γῆ в апокалиптической сцене суда
  choice: земля
  alternative: почва; суша; страна
  rationale: Образный строй Откровения указывает на широкий земной масштаб происходящего. «Почва» чрезмерно сужает смысл, а «страна» придаёт не обозначенную текстом локальность.
- issue: Значение φωναί в формуле богоявления
  choice: звуки
  alternative: голоса
  rationale: Носители речи не названы, поэтому основной текст сохраняет неопределённость между голосами и иными звуками; традиционный и лексически возможный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повтор союза «и» в заключительном перечне сохранён для передачи ритма и нарастающей последовательности греческого текста.
