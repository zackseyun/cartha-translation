id: REV.8.12
reference: Revelation 8:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: ru
  text: И четвёртый ангел затрубил, и были поражены треть солнца, треть луны и треть звёзд, так что треть их помрачилась, и день не светил третью часть своего времени[a], и ночь — так же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы день не светил третью часть своего времени». Греческая конструкция допускает более выраженный оттенок цели.'
    reason: Сохранение возможного целевого оттенка ἵνα наряду с основным переводом как следствия.
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: затрубил
  rationale: Русский глагол «затрубил» естественно обозначает подачу звука трубой и не требует добавления прямого дополнения.
- source_word: ἐπλήγη
  choice: была поражена
  rationale: Пассивная форма сохраняет образ нанесённого удара и суда, не уточняя способ поражения.
- source_word: τὸ τρίτον
  choice: треть
  rationale: «Треть» точно и естественно передаёт количественное значение повторяющегося греческого выражения.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: солнце / луна / звёзды
  rationale: Прямой перевод названий небесных светил сохраняет космический образ текста.
- source_word: ἵνα
  choice: так что
  rationale: В данном контексте выражение естественно передаёт следствие поражения светил, сохраняя в сноске возможный оттенок цели.
- source_word: σκοτισθῇ
  choice: помрачилась
  rationale: Пассивное «помрачилась» сохраняет смысл утраты света и возвышенный, но современный регистр.
- source_word: αὐτῶν
  choice: их
  rationale: Местоимение во множественном числе собирательно относится к солнцу, луне и звёздам.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: день не светил
  rationale: В контексте помрачения небесных светил φαίνω естественно означает «светить»; формулировка сохраняет день как грамматический субъект.
- source_word: τὸ τρίτον αὐτῆς
  choice: третью часть своего времени
  rationale: Так передаётся ограниченная продолжительность отсутствия дневного света; слово «времени» делает выражение понятным по-русски, не меняя количественной меры.
- source_word: ἡ νὺξ ὁμοίως
  choice: и ночь — так же
  rationale: 'Краткая конструкция сохраняет параллель: то же ограничение относится и к ночи.'
theological_decisions:
- issue: Характер космического суда
  choice: Передать помрачение небесных светил прямо как апокалиптический образ суда, не определяя, является ли оно буквальным, символическим или сочетает оба аспекта.
  alternative: Истолковать событие либо исключительно как астрономическое явление, либо исключительно как символ политических или космических потрясений.
  rationale: Сам стих описывает поражение и помрачение светил, но не объясняет способ исполнения образа; перевод не должен заранее разрешать эту богословскую и образную напряжённость.
- issue: 'Оттенок ἵνα: следствие или цель'
  choice: 'В основном тексте передать как следствие: «так что».'
  alternative: 'Передать более целевым оборотом: «чтобы».'
  rationale: Греческая конструкция допускает оттенки цели и результата. Контекстическая последовательность хорошо выражается через результат, а возможный целевой оттенок сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность апокалиптического повествования; образность не истолковывается сверх сказанного в исходном тексте.
