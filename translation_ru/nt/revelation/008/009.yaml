  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: ru
  text: И погибла треть морских существ, имевших жизнь[a], и была уничтожена треть кораблей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имевших души»; возможно: «живых существ». Буквально: «имеющих души/жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: умерла
  rationale: Аорист ἀποθνῄσκω прямо обозначает смерть; форма единственного числа согласуется с собирательно понимаемой «третью».
- source_word: τὸ τρίτον
  choice: треть
  rationale: Естественная современная передача количественного значения без архаичного «третья часть».
- source_word: κτισμάτων
  choice: творений
  rationale: κτίσμα означает сотворённое существо или творение. «Творений» сохраняет связь с идеей сотворённости, а последующее уточнение показывает, что речь идёт о живых морских существах.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: находившихся в море
  rationale: Причастный оборот естественно передаёт определительное значение греческой предложной группы.
- source_word: τὰ ἔχοντα ψυχάς
  choice: имевших душу
  rationale: Передача сохраняет лексическое присутствие ψυχή и относит оборот к морским творениям, не превращая его в отдельное техническое утверждение об антропологии.
- source_word: ψυχάς
  choice: душу
  rationale: В данном контексте ψυχή указывает на одушевлённую жизнь; «душу» сохраняет значимый библейский термин, а сноска отмечает естественные контекстуальные варианты.
- source_word: πλοίων
  choice: кораблей
  rationale: Обычная и ясная русская передача πλοῖον в контексте морского бедствия.
- source_word: διεφθάρησαν
  choice: была уничтожена
  rationale: Пассив διαφθείρω здесь обозначает гибель или разрушение, а не нравственное растление. Единственное число согласовано со словом «треть».
theological_decisions:
- issue: Передача ψυχάς применительно к морским существам
  choice: Сохранить в основном тексте слово «душу»
  alternative: «имевших жизнь»; «живых существ»; «одушевлённых»
  rationale: Контекст не формулирует специального учения о природе души животных, однако значимый термин ψυχή не следует без необходимости устранять. Сноска сохраняет смысловую широту и предупреждает чрезмерно техническое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной библейской тональностью. Синтаксис сохраняет последовательность двух бедствий и подлинную неоднозначность ψυχάς; архаизмы и конфессионально окрашенные уточнения не вводятся.
