  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: ru
  text: И второй вылил свою чашу в море, и оно стало кровью, как кровь мертвеца[a], и всякое живое существо в море умерло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. буквально: «как [кровь] мёртвого человека»; возможно также: «как кровь из трупа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: второй
  rationale: Субстантивированное порядковое числительное отсылает к ангелам из ближайшего контекста, однако слово «ангел» в самом стихе не выражено, поэтому эллипсис сохранён.
- source_word: ἐξέχεεν
  choice: вылил
  rationale: Естественно передаёт действие ἐκχέω с содержимым чаши и сохраняет образ излияния суда.
- source_word: φιάλην
  choice: чашу
  rationale: φιάλη обозначает широкую неглубокую чашу; «чаша» точнее и понятнее современному читателю, чем традиционный «фиал».
- source_word: εἰς τὴν θάλασσαν
  choice: в море
  rationale: Передаёт направленность εἰς и естественно звучит при русском глаголе «вылить».
- source_word: ἐγένετο αἷμα
  choice: оно стало кровью
  rationale: Прямо передаёт γίνομαι с именной частью сказуемого; местоимение «оно» относится к морю и не ослабляет утверждение до простого внешнего сходства.
- source_word: ὡς νεκροῦ
  choice: как у мертвеца
  rationale: Сохраняет краткое сравнение и подразумеваемое слово «кровь», а также единственное число νεκροῦ. Возможная трактовка вынесена в сноску.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: всякое живое существо
  rationale: В данном контексте выражение означает живое создание, а буквальное «всякая душа жизни» в современном русском неестественно и может создать ошибочно узкий антропологический смысл.
- source_word: ἀπέθανεν
  choice: умерло
  rationale: Прямой эквивалент простого глагола со значением смерти, без усиления или толкования.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: в море
  rationale: Нейтрально-множественная конструкция уточняет, что речь идёт о находившихся в море живых существах; по-русски это естественно присоединяется как обстоятельственное определение.
theological_decisions:
- issue: Характер образа казни
  choice: Море действительно становится кровью в рамках видения.
  alternative: 'Передать только внешнее впечатление: «оно стало похоже на кровь».'
  rationale: Греческий текст утверждает ἐγένετο αἷμα — «стало кровью», а последующее сравнение характеризует эту кровь. Перевод сохраняет силу образа суда, не превращая событие лишь во внешнее подобие.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Эллиптическое «второй» сохранено без добавления слова «ангел»; синтаксически сложное πᾶσα ψυχὴ ζωῆς … τὰ ἐν τῇ θαλάσσῃ передано естественной русской конструкцией.
