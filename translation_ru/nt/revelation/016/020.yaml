lexical_decisions:
- source_word: πᾶσα
  choice: всякий
  rationale: 'При существительном νῆσος в единственном числе передаёт распределительное значение: каждый остров без исключения.'
- source_word: νῆσος
  choice: остров
  rationale: Прямое соответствие греческому существительному; единственное число сохраняется в сочетании «всякий остров».
- source_word: ἔφυγεν
  choice: бежал
  rationale: Сохраняет буквальный смысл φεύγω и яркое олицетворение апокалиптического образа; по контексту результатом является исчезновение.
- source_word: ὄρη
  choice: гор
  rationale: Форма родительного множественного числа естественно обусловлена русской безличной конструкцией «не стало видно» и соответствует множественному ὄρη.
- source_word: οὐχ εὑρέθησαν
  choice: не стало видно
  rationale: Естественно передаёт смысл «больше не обнаруживались / не находились», не превращая выражение в утверждение о чьей-либо неспособности искать.
- source_word: καὶ ... καὶ
  choice: И ... и
  rationale: Сохраняет сочинительную, накопительную структуру греческой фразы и характерный для Откровения паратаксис.
theological_decisions:
- issue: Следует ли истолковывать космический образ как буквальное исчезновение или как символический крах
  choice: Сохранить конкретный апокалиптический образ без истолковывающего смягчения
  alternative: Передать прямо как «исчез» и «исчезли», тем самым яснее обозначив результат
  rationale: Греческий текст рисует конкретную и напряжённую картину, но сам перевод не должен решать, буквальна она или символична.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной краткости и паратаксиса оригинала. «Бежал» намеренно сохраняет необычный живой образ; «не стало видно» звучит естественнее буквального «не были найдены», не устраняя смысла исчезновения.
