  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: ru
  text: 'И услышал я, как ангел вод говорил: «Праведен Ты, Тот, Кто есть и Кто был, Святой[a], ибо Ты рассудил так».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях здесь стоит более полное наименование: «Тот, Кто есть, и был, и грядёт»; вероятно, оно приведено в соответствие со сходными выражениями в других местах Откровения. В принятом здесь греческом тексте: «Тот, Кто есть и Кто был, Святой».'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: ангел вод
  rationale: Буквально передаёт родительный оборот и сохраняет возможность понимать его как ангела, связанного с водами или поставленного над ними.
- source_word: Δίκαιος
  choice: Праведен
  rationale: Передаёт нравственную правоту Бога, явленную в суде, и естественно звучит в торжественном славословии.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: Тот, Кто есть и Кто был
  rationale: Сохраняет формульное божественное наименование и субстантивированный характер греческих конструкций.
- source_word: ὁ ὅσιος
  choice: Святой
  rationale: Передаёт ὅσιος как титул, обозначающий святость и нравственную чистоту; обособление сохраняет греческую конструкцию и её возможную неоднозначность.
- source_word: ὅτι
  choice: потому что
  rationale: 'Ясно выражает причинную связь: Божья праведность провозглашается на основании совершённого Им суда.'
- source_word: ταῦτα ἔκρινας
  choice: Ты совершил этот суд
  rationale: В контексте ταῦτα указывает на только что описанные действия суда. Русское «судил это» неидиоматично, поэтому смысл передан естественным оборотом без добавления множественного числа, отсутствующего в греческом.
theological_decisions:
- issue: Божественный титул без ожидаемого указания на будущее
  choice: Тот, Кто есть и Кто был, Святой
  alternative: Тот, Кто есть, и был, и грядёт
  rationale: 'Перевод следует тексту SBLGNT: ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος, не дополняя его знакомой по другим местам Откровения формулой. Вариант рукописей отмечен в сноске.'
- issue: Синтаксическая связь ὁ ὅσιος
  choice: Святой как обособленный божественный титул
  alternative: о Святой, Который есть и был
  rationale: Греческий допускает восприятие выражения как отдельного приложения или обращения. Обособленный титул близко следует порядку слов источника и не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Инверсия «Праведен Ты» сохраняет характер славословия; прописные буквы в местоимениях и титуле поддерживают принятый русский религиозный регистр.
