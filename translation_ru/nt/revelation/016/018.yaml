id: REV.16.18
reference: Revelation 16:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: ru
  text: И сверкнули молнии, раздались голоса[a] и раскаты грома; и произошло великое землетрясение, какого не бывало с тех пор, как люди появились на земле, — настолько велико было это землетрясение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звуки».'
    reason: Лексема φωναί может обозначать как голоса, так и вообще звуки.
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: сверкнули молнии
  rationale: Множественное число передаёт ряд вспышек; глагол «сверкнули» естественно выражает по-русски конструкцию ἐγένοντο без изменения образа.
- source_word: φωναὶ
  choice: голоса[a]
  rationale: Основное значение «голоса» сохраняет формальную и образную неоднозначность греческого слова; возможное контекстуальное значение «звуки» отмечено в сноске.
- source_word: βρονταί
  choice: раскаты грома
  rationale: Естественное русское счётное выражение передаёт множественное число и повторяющийся гром.
- source_word: σεισμὸς μέγας
  choice: великое землетрясение
  rationale: «Землетрясение» — точный контекстуальный эквивалент σεισμός, а «великое» сохраняет возвышенный апокалиптический регистр μέγας.
- source_word: οἷος οὐκ ἐγένετο
  choice: какого не бывало
  rationale: Передаёт сравнение с беспрецедентным событием естественным русским оборотом.
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: с тех пор, как люди появились на земле
  rationale: «Люди» точно передаёт обобщённое ἄνθρωποι без мужского ограничения; «появились» сохраняет становление, выраженное ἐγένοντο.
- source_word: τηλικοῦτος σεισμὸς οὕτω μέγας
  choice: настолько велико было это землетрясение
  rationale: Сохраняет заключительное усиление и повтор слова «землетрясение», не сглаживая риторическую избыточность оригинала.
theological_decisions:
- issue: Обобщённое ἄνθρωποι в историческом сравнении
  choice: люди
  alternative: человечество
  rationale: Форма обозначает всех людей, а не только мужчин; «люди» является прямым, естественным и богословски нейтральным русским соответствием.
- issue: Неоднозначность φωναὶ в описании небесных явлений
  choice: голоса[a]
  alternative: звуки
  rationale: «Голоса» не исключает личного или сверхъестественного оттенка, тогда как «звуки» контекстуально возможно, но заранее снимает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным апокалиптическим тоном. Синтаксис сделан естественным для русского, при этом сохранены повтор «землетрясение», нарастание масштаба и неоднозначность φωναί.
