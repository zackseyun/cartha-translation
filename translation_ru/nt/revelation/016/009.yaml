id: REV.16.9
reference: Revelation 16:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: ru
  text: И люди были опалены сильным зноем и хулили имя Бога, имеющего власть над этими язвами, и не раскаялись, чтобы воздать Ему славу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: были опалены
  rationale: Пассивная форма передаёт воздействие обжигающего жара; «были опалены» естественно звучит по-русски и не преувеличивает степень поражения.
- source_word: οἱ ἄνθρωποι
  choice: люди
  rationale: В данном контексте существительное обозначает людей вообще, а не только мужчин.
- source_word: καῦμα μέγα
  choice: сильным зноем
  rationale: Творительный падеж естественно передаёт средство воздействия, а «сильный зной» выражает крайнюю интенсивность жара и сохраняет образ исходного текста.
- source_word: ἐβλασφήμησαν
  choice: хулили
  rationale: По отношению к имени Бога глагол означает нечестивое поношение; «хулили» сохраняет религиозный смысл и звучит естественно в библейском регистре.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: имя Бога
  rationale: Близкая к форме оригинала передача сохраняет библейский оборот, где имя связано с явленной личностью и честью Бога.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: имеющего власть над этими язвами
  rationale: Причастный оборот сохраняет настоящее значение ἔχοντος и прямо передаёт приписываемую Богу власть над язвами.
- source_word: πληγὰς
  choice: язвами
  rationale: «Язвы» — укоренившееся и контекстуально точное обозначение посланных свыше бедствий в Откровении, сохраняющее связь с повествованием об исходе.
- source_word: οὐ μετενόησαν
  choice: не раскаялись
  rationale: В контексте суда речь идёт о нравственном и духовном раскаянии, а не просто о перемене мнения.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: чтобы воздать Ему славу
  rationale: Оборот естественно передаёт связь ожидаемого раскаяния с прославлением Бога и сохраняет конкретный библейский образ.
theological_decisions:
- issue: Объём значения οἱ ἄνθρωποι
  choice: общее обозначение людей
  alternative: только мужчины
  rationale: Контекст говорит о человечестве, подвергшемся суду, и не даёт оснований ограничивать референт мужчинами.
- issue: Власть Бога над язвами
  choice: Бог имеет власть над этими язвами
  alternative: Бог лишь связан с этими язвами
  rationale: Оригинал прямо употребляет ἐξουσία и тем самым утверждает власть Бога над язвами; перевод не смягчает и не расширяет это утверждение.
- issue: Связь раскаяния и прославления Бога
  choice: они не раскаялись, чтобы воздать Богу славу
  alternative: они не раскаялись и отдельно не воздали Богу славу
  rationale: Инфинитив δοῦναι естественно обозначает цель или ожидаемый итог раскаяния; перевод сохраняет эту грамматическую связь, не уточняя её сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Зной», «хулили» и «язвы» понятны современному читателю и сохраняют образность и межтекстовые связи оригинала; синтаксис слегка упрощён для ясности без потери богословского напряжения.
