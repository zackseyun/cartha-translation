id: REV.16.6
reference: Revelation 16:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: ru
  text: потому что они пролили кровь святых и пророков[a], и Ты дал им пить кровь. Они того достойны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «излили кровь святых и пророков». Выражение также перекликается с излиянием чаш суда в окружающем контексте.'
    reason: lexical_alternative
  - marker: b
    text: То есть они заслуживают этого суда.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Вводит причину провозглашённого в предыдущем стихе суда; современная и ясная передача причинной связи.
- source_word: αἷμα
  choice: кровь
  rationale: Буквальная передача обоих употреблений сохраняет резкое повторение и идею соразмерного воздаяния.
- source_word: ἁγίων
  choice: святых
  rationale: В Откровении это обычное обозначение принадлежащего Богу святого народа, без подразумеваемого ограничения позднейшей категорией канонизированных святых.
- source_word: προφητῶν
  choice: пророков
  rationale: Прямой и естественный эквивалент; вместе со «святыми» обозначает тех, чью кровь пролили.
- source_word: ἐξέχεαν
  choice: пролили
  rationale: Русское «пролить кровь» естественно и вместе с тем сохраняет образ глагола ἐκχέω («изливать, выливать»), перекликающийся с излиянием чаш в контексте.
- source_word: αὐτοῖς
  choice: им
  rationale: Естественная передача дательного падежа, указывающего на виновников, которым дано пить кровь.
- source_word: δέδωκας
  choice: Ты дал
  rationale: Русский совершенный вид естественно передаёт завершённость действия и его актуальный результат; местоимение с прописной буквы поддерживает принятый в русском библейском стиле почтительный регистр.
- source_word: πιεῖν
  choice: пить
  rationale: Естественная передача инфинитива, зависящего от «дал».
- source_word: ἄξιοί εἰσιν
  choice: Они того достойны
  rationale: Сохраняет оценочную формулу и торжественно-судебный тон, не заменяя её прямым толкованием «они это заслужили»; «того» естественно указывает на только что названный суд.
theological_decisions:
- issue: Язык воздающего правосудия
  choice: 'Сохранено прямое: «Ты дал им пить кровь. Они того достойны».'
  alternative: «Ты воздал им, дав пить кровь; они это заслужили».
  rationale: Греческий текст изображает суд резко и соразмерно преступлению; перевод не смягчает эту мысль и не превращает её в общее утверждение о наказании.
- issue: Значение слова «святые»
  choice: «святых» в широком библейском смысле Божьего народа
  alternative: «святых людей» / «освящённых»
  rationale: Так сохраняется устойчивый термин Откровения без внесения позднейших конфессиональных категорий.
- issue: Смысл формулы ἄξιοί εἰσιν
  choice: «Они того достойны» — достойны данного суда
  alternative: «они достойны» без пояснения или «они это заслужили»
  rationale: Формальная оценка сохранена, а подразумеваемая отрицательная направленность прояснена сноской, чтобы «достойны» не было понято как похвала.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным судебным звучанием. Синтаксис краток и близок к греческому. Формула «пролили кровь» идиоматична и не утрачивает ключевого образа излияния; эта образная перекличка отмечена в сноске.
