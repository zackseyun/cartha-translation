    issue: Множественное число «язвы» вместо единственного «язва».
    rationale: В оригинале ἕλκος — единственное число; вероятнее всего оно имеет собирательный смысл, но в русском его можно естественно сохранить, не меняя картины бедствия.
  - severity: medium
    issue: «Страшные мучительные» недостаточно различает κακόν и πονηρόν.
    rationale: «Страшные» передаёт впечатление от бедствия, но не вполне значение пагубности/тяжести первого определения. «Тяжёлая и мучительная» лучше сохраняет два усилительных признака в нейтральном современном регистре.
  - severity: low
    issue: «Носивших знак» несколько конкретизирует способ обладания знаком.
    rationale: ἔχοντας означает «имеющих»; вариант «имевших» точнее сохраняет простое отношение обладания.
