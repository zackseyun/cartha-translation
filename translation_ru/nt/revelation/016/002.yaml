id: REV.16.2
reference: Revelation 16:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: ru
  text: Первый пошёл и вылил свою чашу на землю. И у людей, имевших знак зверя и поклонявшихся его образу, появилась тяжёлая и мучительная язва.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пагубная и тяжкая язва». В греческом тексте употреблены единственное число («язва», вероятно в собирательном смысле) и два сильных определения — κακόν и πονηρόν, усиливающие описание бедствия.'
    reason: Передаёт форму существительного в оригинале и даёт близкий лексический вариант для пары прилагательных.
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: пошёл
  rationale: Аорист в последовательности повествования; «пошёл» естественно передаёт движение без излишнего усиления значения.
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Субстантивированное прилагательное отсылает к первому из семи ангелов; существительное «ангел» не добавляется, поскольку его нет в стихе.
- source_word: ἐξέχεεν
  choice: вылил
  rationale: Передаёт обычное значение ἐκχέω и повторяющуюся в Откровении формулу излияния чаш.
- source_word: φιάλην
  choice: чашу
  rationale: «Чаша» — понятное и традиционно закрепившееся обозначение широкого сосуда φιάλη в данном контексте.
- source_word: εἰς τὴν γῆν
  choice: на землю
  rationale: εἰς указывает на направленность действия и его цель; «на землю» естественно по-русски и не сужает γῆ до отдельной страны.
- source_word: ἐγένετο
  choice: появились
  rationale: Здесь γίνομαι обозначает возникновение язв как результат излияния чаши.
- source_word: ἕλκος
  choice: язвы
  rationale: ἕλκος обозначает болезненную, изъязвлённую рану. Русское множественное число естественно описывает поражение множества людей, хотя греческое единственное имеет собирательный характер.
- source_word: κακὸν καὶ πονηρὸν
  choice: страшные мучительные
  rationale: Два сильных близких определения усиливают тяжесть поражения. Такая передача описывает его ужас и причиняемое страдание, не приписывая язвам нравственного зла.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: у людей
  rationale: Естественная русская конструкция для появления телесных язв; ἄνθρωποι означает людей независимо от пола.
- source_word: τοὺς ἔχοντας
  choice: носивших
  rationale: В контексте χάραγμα глагол «носить» естественно выражает наличие нанесённого знака и сохраняет одновременность признака с судом.
- source_word: τὸ χάραγμα τοῦ θηρίου
  choice: знак зверя
  rationale: Прозрачная передача ключевого выражения Откровения; «знак» сохраняет значение начертания или метки без чрезмерной конкретизации.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: поклонявшихся его образу
  rationale: Точно передаёт культовое поклонение образу зверя; местоимение сохраняет грамматическую отсылку к зверю.
theological_decisions:
- issue: Два определения κακὸν καὶ πονηρὸν при ἕλκος
  choice: «страшные мучительные язвы»
  alternative: «злая и тяжкая язва»; «скверная и мучительная язва»
  rationale: Сочетание двух близких отрицательных прилагательных понято как усиление тяжести бедствия. Перевод не сводит их в одно определение и не навязывает язве нравственное значение слова «злая».
- issue: Круг поражённых судом
  choice: «у людей, носивших знак зверя и поклонявшихся его образу»
  alternative: «у людей, носивших знак зверя, то есть поклонявшихся его образу»
  rationale: Греческий текст соединяет две характеристики союзом καί. Перевод сохраняет их как два явно названных признака, не объявляя один простым пояснением другого.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис остаётся ясным для широкого читателя; начальное «И» и последовательность двух предложений сохраняют ритм греческого текста. Формулировки избегают архаизмов и конфессионально нагруженных уточнений.
