id: REV.16.10
reference: Revelation 16:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: ru
  text: Пятый вылил свою чашу на престол зверя, и царство его покрылось тьмой[a]. Они грызли свои языки от боли,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царство его оказалось омрачено».'
    reason: Лексическая альтернатива, более формально передающая пассивно-результативную форму ἐσκοτωμένη.
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: Пятый
  rationale: В греческом тексте стоит субстантивированное порядковое числительное; «ангел» ясен из контекста, но в этом стихе прямо не назван.
- source_word: ἐξέχεεν
  choice: вылил
  rationale: Естественная русская передача действия с чашей, соответствующая повторяющейся формуле суда в этой главе.
- source_word: φιάλην
  choice: чашу
  rationale: Здесь имеется в виду широкая чаша, а не современный флакон или сосуд с узким горлышком; «чаша» сохраняет принятую апокалиптическую образность.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: на престол зверя
  rationale: Прямая и естественная передача ἐπί с винительным падежом; «зверь» сохраняет устойчивый образ Откровения.
- source_word: ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη
  choice: царство его покрылось тьмой
  rationale: Передаёт наступление результирующего состояния и пассивно-результативную силу причастия естественным современным русским языком.
- source_word: ἐμασῶντο
  choice: грызли
  rationale: Несовершенный вид передаёт продолжительное действие греческого имперфекта и силу глагола μασάομαι.
- source_word: τὰς γλώσσας αὐτῶν
  choice: свои языки
  rationale: Возвратное «свои» естественно по-русски соотносит языки с действующими лицами.
- source_word: ἐκ τοῦ πόνου
  choice: от боли
  rationale: Кратко и идиоматично выражает причинное значение ἐκ.
theological_decisions:
- issue: Соотнесение местоимения αὐτοῦ
  choice: царство его
  alternative: царство зверя
  rationale: Русское «его» естественно относится к зверю и, в отличие от английского местоимения, не требует выбора между грамматическим средним родом и олицетворением.
- issue: Степень образности при передаче ἐσκοτωμένη
  choice: покрылось тьмой
  alternative: оказалось омрачено
  rationale: Выбранный вариант ясно передаёт наступившую тьму, не добавляя причины или толкования природы этого суда.
- issue: Неявное подлежащее ἐμασῶντο
  choice: Они
  alternative: люди
  rationale: Греческая форма указывает на множественное число, но прямо не называет действующих лиц; местоимение сохраняет эту недосказанность, тогда как «люди» было бы уточнением.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной, торжественной структуры видения. Союз «а» перед вторым предложением делает переход естественным, не устраняя причинно-смысловую напряжённость оригинала. Конечная запятая сохранена, поскольку греческий стих продолжается следующим стихом.
