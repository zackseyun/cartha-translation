  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: ru
  text: И я увидел, как из уст дракона, из уст зверя и из уст лжепророка вышли три нечистых духа, похожих на лягушек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я увидел из уст дракона, из уст зверя и из уст лжепророка трёх нечистых духов, похожих на лягушек». В греческом тексте повторяющиеся слова об источнике стоят перед словами «три нечистых духа».'
    reason: лексическая альтернатива и порядок слов оригинала
lexical_decisions:
- source_word: εἶδον
  choice: я увидел
  rationale: Простой аорист ὁράω передаёт очередное событие видения; «я увидел» естественно для современного русского повествования.
- source_word: ἐκ τοῦ στόματος
  choice: из уст
  rationale: ἐκ обозначает исходную точку; по-русски «из уст» естественно передаёт образ и позволяет сохранить троекратный повтор греческой конструкции.
- source_word: δράκοντος
  choice: дракона
  rationale: Стандартное обозначение уже известного из контекста символического персонажа Откровения.
- source_word: θηρίου
  choice: зверя
  rationale: «Зверь» точно сохраняет устойчивый апокалиптический образ θηρίον.
- source_word: ψευδοπροφήτου
  choice: лжепророка
  rationale: Естественный и точный русский эквивалент сложного существительного со значением ложного пророка.
- source_word: πνεύματα τρία ἀκάθαρτα
  choice: три нечистых духа
  rationale: Естественный русский порядок слов; «нечистых» сохраняет духовно-нравственные и библейские оттенки ἀκάθαρτα без преждевременного уточнения «бесовские».
- source_word: ὡς βάτραχοι
  choice: похожих на лягушек
  rationale: ὡς выражает сравнение, а не тождество; такая формулировка ясно передаёт, что духи имели сходство с лягушками.
theological_decisions:
- issue: Природа πνεύματα ἀκάθαρτα в апокалиптическом образе
  choice: «три нечистых духа» без поясняющего добавления «бесовских»
  alternative: «три бесовских духа» или «три нечистых духа, похожие на бесов»
  rationale: В данном стихе сказано только «нечистые духи»; их бесовская природа уточняется в следующем стихе. Перевод не должен вносить это уточнение раньше текста.
- issue: Синтаксическая связь трёх предложных оборотов
  choice: 'Передать их как источники движения духов: «как ... вышли»'
  alternative: 'Сохранить максимально буквальное расположение: «из уст... я увидел три нечистых духа»'
  rationale: Греческое ἐκ с названиями уст указывает на источник; глагол движения подразумевается образом. Добавление «вышли» делает русскую фразу ясной, сохраняя смысл и троекратный повтор.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Троекратное «из уст» сохранено ради риторического строя оригинала; «лжепророк» употреблено как устоявшееся наименование.
