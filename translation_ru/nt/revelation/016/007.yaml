  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: ru
  text: 'И я услышал, как жертвенник говорил: «Да, Господи Боже, Вседержитель! Истинны и справедливы Твои суды».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα
  choice: услышал я
  rationale: Аорист ἀκούω передаёт единичное событие в прошлом; инверсия сохраняет возвышенный повествовательный строй, не делая язык архаичным.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: как жертвенник говорил
  rationale: Родительный падеж при ἤκουσα может обозначать источник услышанного, однако причастие λέγοντος естественно представляет сам жертвенник говорящим; это сохраняет олицетворение апокалиптического образа и не добавляет отсутствующее в греческом слово «голос».
- source_word: Ναί
  choice: Да
  rationale: Сильная утвердительная частица с ответным оттенком естественно передаётся словом «Да».
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Господи Боже Вседержитель
  rationale: Сохраняются все три элемента прямого обращения. «Вседержитель» — устойчивый и ёмкий русский эквивалент παντοκράτωρ, выражающий всеобъемлющее владычество и могущество.
- source_word: ἀληθιναὶ
  choice: истинны
  rationale: В сочетании с κρίσεις обозначает соответствие истине и надёжность Божьих судеб.
- source_word: δίκαιαι
  choice: справедливы
  rationale: В судебном контексте естественно выражает правосудность Божьих решений; «праведны» возможно, но в современном русском менее непосредственно сочетается со словом «суды».
- source_word: αἱ κρίσεις σου
  choice: суды Твои
  rationale: «Суды» кратко сохраняет судебно-богословскую ёмкость κρίσεις, включая решения и действия суда, без сужения до одних приговоров.
theological_decisions:
- issue: Олицетворение жертвенника как говорящего
  choice: «услышал я, как жертвенник говорил»
  alternative: «услышал я от жертвенника» или «услышал голос от жертвенника»
  rationale: Греческая конструкция допускает понимание жертвенника как источника услышанного, но причастие «говорящего» наиболее прямо олицетворяет жертвенник. Добавление «голос» неоправданно, поскольку этого слова в тексте нет; альтернативная синтаксическая возможность отмечена в сноске.
- issue: Передача составного обращения к Богу
  choice: «Господи Боже Вседержитель»
  alternative: «Господи, Боже, Вседержитель» или «Господи Боже, Вседержитель»
  rationale: Переданы κύριε, ὁ θεός и ὁ παντοκράτωρ без устранения какого-либо титула. Слитное русское обращение звучит естественно и сохраняет их приложение друг к другу.
- issue: Характер Божьих судов
  choice: «истинны и справедливы»
  alternative: «праведны и истинны»
  rationale: Выбранный порядок следует греческому тексту, а слова различают истинность и правосудность, не ослабляя богословского утверждения.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Инверсия «услышал я» и прописные местоименные формы в обращении поддерживают возвышенный библейский регистр; устаревшая лексика и добавление слова «голос» исключены.
