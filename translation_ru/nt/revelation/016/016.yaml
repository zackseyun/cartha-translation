  source_fidelity: Основной текст точно передаёт греческий сингулярный аорист συνήγαγεν («он собрал»), не подменяя его контекстуально предполагаемым множественным числом. «Их», «место», «которое ... называется», «по-еврейски» и «Армагеддон» соответствуют исходному тексту. Русское «на место» передаёт направленность εἰς и допустимо в данном торжественно-библейском контексте.
