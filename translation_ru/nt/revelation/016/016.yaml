source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: ru
  text: И он[a] собрал их на место, которое по-еврейски называется Армагеддон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте глагол стоит в единственном числе: «собрал», но действующее лицо прямо не названо. В предыдущих стихах царей собирают нечистые духи (ст. 13–14).'
    reason: alternative_reading
  - marker: b
    text: 'Или: «на еврейском или арамейском языке». В Откровении выражение «по-еврейски» указывает на семитскую форму имени и не обязательно строго разграничивает еврейский и арамейский языки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: он собрал
  rationale: Греческий глагол стоит в третьем лице единственного числа. Русское «он собрал» сохраняет это число; поскольку подлежащее в греческом тексте не названо, неопределённость относительно действующего лица отмечена в сноске.
- source_word: αὐτοὺς
  choice: их
  rationale: Естественная передача винительного падежа множественного числа; в контексте речь идёт о царях, собираемых на битву.
- source_word: εἰς τὸν τόπον
  choice: на место
  rationale: Предлог εἰς обозначает направление к месту; сочетание «собрал их на место» естественно передаёт эту направленность по-русски.
- source_word: τὸν καλούμενον
  choice: которое ... называется
  rationale: Относительное придаточное естественно по-русски передаёт пассивное причастие, относящееся к слову «место».
- source_word: Ἑβραϊστὶ
  choice: по-еврейски
  rationale: Краткая и прозрачная передача наречия; возможное более широкое указание на еврейскую или арамейскую семитскую форму имени поясняется в сноске.
- source_word: Ἁρμαγεδών
  choice: Армагеддон
  rationale: Устоявшаяся русская транслитерация имени, хорошо понятная современному читателю.
theological_decisions:
- issue: Кто собирает царей
  choice: он собрал их
  alternative: они собрали их / их собрали
  rationale: Форма συνήγαγεν грамматически единственного числа, поэтому основной текст не заменяет её множественным числом на основании контекста стихов 13–14. При этом неназванный субъект не отождествляется ни с Богом, ни с дьяволом, зверем или духами; неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся простым и ясным; грамматическое единственное число оригинала и неопределённость субъекта сохранены без конфессионального истолкования.
