id: REV.16.21
reference: Revelation 16:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: ru
  text: И с неба на людей обрушивается огромный град — каждая градина весом примерно в талант[a]. И люди хулили Бога из-за бедствия от града, потому что это бедствие было чрезвычайно велико[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «град, весом примерно в талант». Речь идёт о весе отдельных градин — приблизительно по таланту каждая; греческое выражение обозначает сравнение, а не точную меру.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ибо бедствие от него было весьма велико».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: огромный град
  rationale: Сохраняет собирательное единственное число греческого существительного и передаёт необычайную величину града естественным современным русским выражением.
- source_word: ὡς ταλαντιαία
  choice: с градинами весом примерно в талант каждая
  rationale: Передаёт весовую характеристику и сравнительное ὡς без ложной точности; слово «градинами» эксплицирует подразумеваемые отдельные куски града.
- source_word: καταβαίνει
  choice: обрушивается
  rationale: Настоящее время сохраняет живость апокалиптического повествования, а «обрушивается» естественно описывает падение огромного града.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: Русское «небо» сохраняет как пространственный, так и апокалиптический оттенок οὐρανός и естественно сочетается с глаголом движения.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: на людей
  rationale: Передаёт общее, не ограниченное мужчинами значение ἄνθρωποι.
- source_word: ἐβλασφήμησαν
  choice: хулили
  rationale: «Хулить Бога» — точное, традиционно понятное и стилистически достойное соответствие речи, направленной против Бога.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: из-за бедствия, причинённого градом
  rationale: ἐκ понято причинно; πληγή передано как «бедствие», что в данном контексте охватывает губительное действие кары и избегает неестественного сочетания «язва града».
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: потому что это бедствие было чрезвычайно тяжёлым
  rationale: Сохраняет причинное пояснение и усиление μεγάλη ... σφόδρα естественным литературным русским языком; «это бедствие» ясно отсылает к бедствию от града.
theological_decisions:
- issue: Значение οὐρανός в сцене апокалиптического суда
  choice: с неба
  alternative: с небосвода
  rationale: «С неба» не сводит образ только к метеорологическому явлению и сохраняет характерную для Откровения перспективу суда, исходящего свыше, не добавляя доктринального толкования.
- issue: Обобщённое значение ἄνθρωποι
  choice: людей / люди
  alternative: человечество
  rationale: Греческое слово обозначает людей вообще, а не только мужчин; конкретное «люди» естественно по-русски и не расширяет референт до абстрактного человечества.
- issue: Значение πληγή применительно к граду
  choice: бедствие
  alternative: кара
  rationale: «Бедствие» сохраняет смысл губительного поражения, не вводя сверх текста прямого толкования этого явления как кары, хотя контекст суда допускает такое понимание.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис упрощён ради ясности, но настоящее время первого глагола сохранено как живое повествовательное настоящее; последующее прошедшее время следует греческому аористу.
