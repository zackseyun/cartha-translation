revisions:
- from: И с неба на людей обрушивается огромный град[a], с градинами весом примерно в талант каждая. Люди хулили Бога из-за бедствия, причинённого градом, потому что это бедствие было чрезвычайно тяжёлым[b].
  to: И с неба на людей обрушивается огромный град — каждая градина весом примерно в талант[a]. И люди хулили Бога из-за бедствия от града, потому что это бедствие было чрезвычайно велико[b].
  rationale: Исправлены неточное и неестественное пояснение в примечании a и несколько перегруженная передача генитивной конструкции о бедствии града. Уточнение о весе сохранено как приблизительное и распределённое по отдельным градинам; причинная структура и усиление заключительной части сохранены.
