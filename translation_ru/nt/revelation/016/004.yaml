  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: ru
  text: И третий вылил свою чашу в реки и источники вод, и вода стала кровью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и стало кровью». Глагол в греческом тексте стоит в единственном числе; подразумевается вода рек и источников как единое целое.'
    reason: Уточнение грамматической формы и подразумеваемого собирательного подлежащего.
lexical_decisions:
- source_word: ὁ τρίτος
  choice: третий
  rationale: 'Греческий текст сохраняет эллипсис: существительное подразумевается из ближайшего контекста. По-русски «третий» звучит естественно, поэтому добавлять «ангел» не требуется.'
- source_word: ἐξέχεεν
  choice: вылил
  rationale: Глагол ἐκχέω обозначает выливание содержимого; «вылил свою чашу» естественно передаёт действие, не предполагая, что выливается сам сосуд.
- source_word: φιάλην
  choice: чашу
  rationale: φιάλη — широкая неглубокая чаша. Русское «чаша» точно и соответствует устойчивой образности данного отрывка; «сосуд» менее конкретно.
- source_word: εἰς τοὺς ποταμοὺς καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: в реки и источники вод
  rationale: εἰς передаёт направленность внутрь или в пределы названного объекта. «Источники вод» сохраняет множественное τῶν ὑδάτων и возвышенный апокалиптический регистр без архаизма.
- source_word: ἐγένετο αἷμα
  choice: всё стало кровью
  rationale: В греческом стоит глагол в единственном числе без явно выраженного подлежащего. «Всё» естественно обобщает воды рек и источников, сохраняет итоговое значение γίνομαι и не создаёт неясного русского «оно».
theological_decisions:
- issue: Подразумеваемое подлежащее при ἐγένετο
  choice: Совокупность вод в реках и источниках стала кровью
  alternative: Реки и источники стали кровью
  rationale: Единственное число греческого глагола допускает собирательное понимание воды как единого целого. Русское «всё» сохраняет эту грамматическую особенность и одновременно ясно связывает превращение со всеми только что названными водами, не вводя дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным повествовательным строем. Тире перед итоговой фразой естественно выделяет наступивший результат; сноска сохраняет буквальную грамматическую неоднозначность оригинала.
