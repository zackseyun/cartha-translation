id: REV.16.19
reference: Revelation 16:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: ru
  text: Великий город распался на три части, и города народов пали. Бог вспомнил о великом Вавилоне[a], чтобы дать ему чашу с вином ярости своего гнева.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великий Вавилон был вспомянут пред Богом». Это библейский оборот, означающий, что Бог обратил на него внимание и теперь совершит суд.'
    reason: Лексическая альтернатива и пояснение библейского оборота.
lexical_decisions:
- source_word: ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη
  choice: Великий город распался на три части
  rationale: 'Конструкция с ἐγένετο и εἰς обозначает наступившее состояние: город оказался разделён на три части. «Распался» естественно передаёт результат, не уточняя способ разрушения.'
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: города народов
  rationale: В контексте всемирного суда ἔθνη означает народы или нации; «народы» звучит естественно и не сужает смысл до религиозно-этнического обозначения «язычники».
- source_word: ἔπεσαν
  choice: пали
  rationale: Сохраняется краткий и образный апокалиптический глагол πίπτω без поясняющего сужения до физического обрушения.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: великий Вавилон
  rationale: Сохраняется устойчивое апокалиптическое наименование; согласование следует грамматическому роду русского топонима.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: Бог вспомнил о
  rationale: Естественная русская передача библейского оборота о Божьем воспоминании, ведущем к действию. Необычная греческая формулировка «был вспомянут пред Богом» приведена в сноске.
- source_word: δοῦναι αὐτῇ
  choice: чтобы дать ему
  rationale: Инфинитив передан как цель или последствие Божьего воспоминания; местоимение мужского рода согласовано с русским словом «Вавилон».
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: чашу с вином
  rationale: Русская предложная конструкция яснее буквальной цепочки родительных падежей и сохраняет образ чаши, содержащей вино.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: ярости своего гнева
  rationale: Различение θυμός («ярость») и ὀργή («гнев») сохраняет усиленную формулу исходного текста, не сводя два слова к одному понятию.
theological_decisions:
- issue: Библейский судебный оборот ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: Бог вспомнил о великом Вавилоне
  alternative: великий Вавилон был вспомянут пред Богом
  rationale: 'Основной текст передаёт оборот естественно по-русски, но не добавляет прямо слова «для суда»: судебный смысл раскрывается последующей целью — дать чашу гнева. Буквальная форма отмечена в сноске, поэтому напряжение образа Божьего воспоминания сохранено.'
- issue: Соотношение θυμός и ὀργή
  choice: ярость своего гнева
  alternative: яростный гнев
  rationale: Два отдельных существительных сохраняют риторическое наслоение исходного текста и не превращают одно из понятий в простое прилагательное.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной апокалиптической образности. Архаизмы в основном тексте устранены; краткое «пали» оставлено как понятное и стилистически уместное. Маркер сноски поставлен непосредственно при обороте, который она поясняет.
