id: REV.16.14
reference: Revelation 16:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: ru
  text: Ибо это духи бесов[a], творящие знамения. Они выходят к царям всего мира[b], чтобы собрать их на битву в великий день Бога Вседержителя —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесовские духи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всей обитаемой земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: духи бесов
  rationale: Передаёт генитивную конструкцию прямо и сохраняет возможную неоднозначность отношения между «духами» и «бесами»; более естественный вариант «бесовские духи» вынесен в примечание.
- source_word: ποιοῦντα σημεῖα
  choice: творящие знамения
  rationale: «Творить знамения» — понятное и достойное библейского регистра сочетание; оно не определяет заранее, были ли эти знамения обманом, сверхъестественными действиями или тем и другим.
- source_word: ἃ ἐκπορεύεται
  choice: они выходят
  rationale: Несмотря на единственное число греческого глагола при местоимении среднего рода множественного числа, по смыслу действие относится к духам; русское множественное число устраняет грамматическую несогласованность без изменения смысла.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: к царям
  rationale: 'После глагола движения ἐπί здесь обозначает направление: духи идут к царям, чтобы собрать их.'
- source_word: τῆς οἰκουμένης ὅλης
  choice: всего мира
  rationale: Естественно передаёт глобальный политико-человеческий охват οἰκουμένη; буквальный оттенок «обитаемой земли» сохранён в примечании.
- source_word: συναγαγεῖν αὐτοὺς
  choice: чтобы собрать их
  rationale: Инфинитив выражает цель выхода духов; конструкция с «чтобы» естественна в современном русском языке.
- source_word: εἰς τὸν πόλεμον
  choice: на битву
  rationale: Передаёт направленность к конкретному решающему столкновению; «война» здесь была бы шире по смыслу.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: в великий день
  rationale: В русском языке временная конструкция естественнее буквального «битва великого дня» и ясно связывает решающую битву с великим днём, не меняя апокалиптического смысла.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: Бога Вседержителя
  rationale: «Вседержитель» — укоренённый и понятный русский библейский титул, соответствующий παντοκράτωρ и сохраняющий торжественный регистр.
theological_decisions:
- issue: Природа знамений, совершаемых духами
  choice: Назвать их «знамениями», не уточняя механизм и степень их сверхъестественности.
  alternative: Передать как «ложные чудеса», «фокусы» или прямо назвать их чудесами того же рода, что и Божьи.
  rationale: Текст приписывает знамения духам бесов, но не объясняет, являются ли они обманной видимостью, реальными сверхъестественными действиями или сочетают оба аспекта.
- issue: Связь битвы с великим днём
  choice: «На битву в великий день Бога Вседержителя».
  alternative: «На битву великого дня Бога Вседержителя».
  rationale: Выбранная русская конструкция естественно указывает, когда произойдёт битва, сохраняя связь с эсхатологическим великим днём и не вводя дополнительных доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Причастие «творящие» и титул «Вседержитель» сохраняют достоинство апокалиптической речи, а разделение на два предложения делает сложную греческую конструкцию ясной. Конечное тире сохранено как знак продолжения мысли в следующем контексте.
