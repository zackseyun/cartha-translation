  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: ru
  text: 'И я услышал из святилища[a] громкий голос, говоривший семи ангелам: «Идите и вылейте на землю семь чаш[b] Божьего гнева».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храма». Греческое слово ναός нередко обозначает именно внутреннее святилище, а не весь храмовый комплекс.'
    reason: lexical_alternative
  - marker: b
    text: 'Иногда переводят: «фиалы»; греческое слово φιάλη означает широкую неглубокую чашу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: громкий голос
  rationale: В сочетании с φωνή прилагательное μέγας указывает прежде всего на силу звучания; «громкий голос» естественно и точно передаёт этот смысл по-русски.
- source_word: ναοῦ
  choice: святилища
  rationale: ναός часто обозначает собственно священную внутреннюю часть храма, в отличие от всего храмового комплекса; «святилище» сохраняет эту смысловую точность в небесной сцене Откровения.
- source_word: λεγούσης
  choice: говоривший
  rationale: Причастие относится к слову «голос». Русское «голос, говоривший» сохраняет образ и синтаксическую связь исходного текста без добавления идеи приказа, прямо не выраженной этим словом.
- source_word: Ὑπάγετε
  choice: Идите
  rationale: В данном повелении ὑπάγω означает отправиться для исполнения порученного действия; «идите» — ясный и естественный русский эквивалент.
- source_word: ἐκχέετε
  choice: вылейте
  rationale: Глагол передаёт действие полного излития содержимого сосудов; совершенный вид естественен в русском повелении и соответствует направленности действия на результат.
- source_word: φιάλας
  choice: чаш
  rationale: φιάλη — широкая неглубокая чаша, а не небольшой флакон; «чаши» точно передаёт вид сосуда на современном русском языке.
- source_word: θυμοῦ
  choice: гнева
  rationale: В контексте апокалиптического суда θυμός обозначает сильный Божий гнев; «гнев» сохраняет торжественную серьёзность выражения без смыслового усиления.
- source_word: εἰς τὴν γῆν
  choice: на землю
  rationale: После глагола излития εἰς выражает направленность действия на поверхность или область; «на землю» естественно передаёт это движение и мировой масштаб сцены.
theological_decisions:
- issue: Передача ναός в небесной сцене Откровения
  choice: святилище
  alternative: храм
  rationale: «Святилище» сохраняет возможное указание на внутреннее священное пространство, тогда как «храм» может обозначать весь комплекс. Альтернатива отмечена в сноске, поскольку границы значения в данном контексте нельзя считать совершенно однозначными.
- issue: Передача θυμός τοῦ θεοῦ
  choice: Божий гнев
  alternative: ярость Бога
  rationale: «Божий гнев» передаёт судебную и богословскую весомость выражения, не усиливая θυμός до эмоционально более резкой «ярости» и не разрешая сверх текста напряжение образа Божьего суда.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранено начальное «И», связывающее стих с предыдущим видением. Формулировка не архаизируется и не вводит конфессионально окрашенных толкований.
