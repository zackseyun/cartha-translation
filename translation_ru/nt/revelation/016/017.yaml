id: REV.16.17
reference: Revelation 16:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: ru
  text: 'И седьмой вылил свою чашу в воздух. И из святилища[a], от престола, раздался громкий голос: «Свершилось»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из храма». Греческое слово ναός обозначает собственно святилище, а не весь храмовый комплекс.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Произошло»; возможен также перевод: «Исполнилось». Греческая форма выражает наступившее событие или завершение с сохраняющимся результатом.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: седьмой
  rationale: В греческом тексте стоит субстантивированное порядковое числительное без слова «ангел». Контекст ясно указывает на седьмого ангела, но перевод сохраняет исходное опущение.
- source_word: ἐξέχεεν
  choice: вылил
  rationale: Обычный современный русский эквивалент для излияния содержимого чаши; согласуется с повторяющейся формулой в этой главе.
- source_word: φιάλην
  choice: чашу
  rationale: Передаёт широкую неглубокую чашу и соответствует принятой лексике повествования о семи чашах, не вызывая образа современной ампулы или флакона.
- source_word: ἐπὶ τὸν ἀέρα
  choice: в воздух
  rationale: После глагола движения и излияния сочетание ἐπί с винительным естественно передаётся направлением «в воздух».
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: раздался громкий голос
  rationale: Естественная русская формулировка, выражающая и появление голоса из указанного источника, и силу звучания.
- source_word: ἐκ τοῦ ναοῦ
  choice: из святилища
  rationale: ναός обозначает собственно святилище, а не весь храмовый комплекс; вариант «храм» сохранён в примечании как допустимый русский эквивалент.
- source_word: ἀπὸ τοῦ θρόνου
  choice: от престола
  rationale: Сохранено отдельное обозначение источника голоса, стоящее рядом с «из святилища», без сведения двух оборотов в один.
- source_word: Γέγονεν
  choice: Свершилось
  rationale: 'Краткая торжественная формула передаёт перфектный, результативный смысл: событие осуществилось и достигло завершённого состояния. Более буквальный вариант отмечен в сноске.'
theological_decisions:
- issue: Значение ναός в образе небесного храма
  choice: святилище
  alternative: храм
  rationale: «Святилище» сохраняет лексическую конкретность ναός и не расширяет образ до всего храмового комплекса; это языковое, а не конфессиональное уточнение.
- issue: Результативный смысл Γέγονεν
  choice: Свершилось
  alternative: Произошло; исполнилось
  rationale: Основной вариант естественно звучит как кульминационное провозглашение завершения, но не уточняет, что именно завершено. Сноска сохраняет возможное событийное прочтение глагола.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом апокалиптического провозглашения. Эллипсис «седьмой» сохранён; слово «ангел» не добавлено. Два обозначения источника голоса — «из святилища» и «от престола» — оставлены раздельными.
