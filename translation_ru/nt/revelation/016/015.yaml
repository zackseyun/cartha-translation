reference: Revelation 16:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: ru
  text: «Вот, Я иду как вор. Блажен тот, кто бодрствует[a] и хранит свои одежды, чтобы он не ходил нагим и чтобы не увидели его срама[b]» —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бдителен»; греческое слово обозначает бодрствование и бдительность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его постыдную наготу»; греческое слово может обозначать постыдное обнажение или непристойность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Естественное для современного литературного русского возглашение, привлекающее внимание и сохраняющее торжественно-предупредительный тон.
- source_word: ἔρχομαι
  choice: Я приду
  rationale: Настоящее время имеет здесь яркое грядущее значение; русское совершенное будущее естественно передаёт предстоящее внезапное пришествие.
- source_word: ὡς κλέπτης
  choice: как вор
  rationale: Сохраняет прямое сравнение, указывающее на неожиданность прихода, без нравственного уподобления вору.
- source_word: μακάριος
  choice: Блажен
  rationale: Традиционное и понятное слово для формулы блаженства, сохраняющее её богословскую значимость.
- source_word: ὁ γρηγορῶν
  choice: тот, кто бодрствует
  rationale: Передаёт как буквальное бодрствование, так и контекстуальную настороженность, не сводя образ только к одному смыслу.
- source_word: τηρῶν
  choice: хранит
  rationale: В сочетании с одеждами выражает сохранение и бережное удержание; не конкретизирует сверх исходного текста способ такого хранения.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: свои одежды
  rationale: Возвратное местоимение естественно по-русски соотносит одежды с субъектом, а «одежды» сохраняет возвышенный регистр и возможную символическую насыщенность.
- source_word: ἵνα μὴ γυμνὸς περιπατῇ
  choice: чтобы не ходить ему нагим
  rationale: Сохраняет целевую конструкцию и конкретный образ хождения нагим; дательный субъект при инфинитиве придаёт фразе естественный библейский, но понятный строй.
- source_word: βλέπωσιν
  choice: не увидели
  rationale: Неопределённо-личная форма сохраняет неуказанный субъект греческого глагола во множественном числе.
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: его срам
  rationale: Передаёт одновременно постыдное обнажение и бесчестье; слово возвышенное, но сохраняется в современном религиозно-литературном употреблении.
theological_decisions:
- issue: Символическое значение одежд, наготы и срама
  choice: Сохранить конкретные образы без аллегорического пояснения в основном тексте.
  alternative: Передать одежды как праведность или готовность, а наготу как эсхатологический позор.
  rationale: Апокалиптический контекст допускает символический смысл, однако сам греческий текст его здесь прямо не раскрывает; перевод сохраняет эту богословскую напряжённость.
- issue: Грамматически мужской род единственного числа
  choice: Передать конструкцией «тот, кто» и формами мужского рода.
  alternative: Перестроить во множественном числе или применить гендерно-нейтральную формулировку.
  rationale: Так сохраняется грамматическая форма и представительный характер греческого причастия мужского рода единственного числа.
- issue: Видо-временное значение ἔρχομαι
  choice: «Я приду».
  alternative: «Я иду» или «Я прихожу».
  rationale: Форма настоящего времени создаёт живость и ощущение близости, но в русском контексте возвещения о будущем приходе «приду» звучит естественнее и не создаёт пространственной двусмысленности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической интонацией. «Блажен», «нагим» и «срам» поддерживают достоинство и образность текста, оставаясь понятными. Конечное многоточие передаёт незавершённость/переход, отмеченный тире в издании SBLGNT.
