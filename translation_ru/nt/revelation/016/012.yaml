  naturalness: Исправленный вариант звучит естественно в современном литературном русском и сохраняет торжественную библейскую интонацию. «От восхода солнца» намеренно сохраняет образ оригинала; сноска даёт простой современный эквивалент.
  terminology: «Чаша», «великая река Евфрат» и «цари» удачны. «Шестой» правомерно сохраняет эллипсис греческого текста и не добавляет слова «ангел».
