  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: ru
  text: И шестой вылил свою чашу на великую реку Евфрат, и вода в ней высохла, чтобы был приготовлен путь царей от восхода солнца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или проще: «с востока». Буквально: «от восхода солнца».'
    reason: 'Лексическая альтернатива: поясняет смысл греческой идиомы, сохраняя её буквальный образ в основном тексте.'
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: шестой
  rationale: В греческом тексте стоит субстантивированное порядковое числительное без слова «ангел»; контекст указывает на шестого из несущих чаши, поэтому эллипсис сохранён.
- source_word: ἐξέχεεν
  choice: вылил
  rationale: Естественно передаёт действие ἐκχέω над чашей и сохраняет образ излияния суда.
- source_word: φιάλην
  choice: чашу
  rationale: В данном контексте φιάλη обозначает широкий сосуд; «чаша» точно и привычно передаёт этот образ, в отличие от устаревшей или вводящей в заблуждение «фиалы».
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: на великую реку Евфрат
  rationale: Сохраняет объект излияния, эпитет «великая» и приложение «Евфрат» в естественном русском порядке слов.
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: вода в ней высохла
  rationale: Передаёт аорист пассивного залога естественной русской конструкцией и ясно связывает воду с рекой; женский род местоимения обусловлен русским словом «река».
- source_word: ἵνα ἑτοιμασθῇ ἡ ὁδὸς
  choice: чтобы был приготовлен путь
  rationale: Сохраняет целевое значение ἵνα и пассивную форму, не называя того, кто готовит путь.
- source_word: τῶν βασιλέων
  choice: для царей
  rationale: Русская конструкция «приготовить путь для кого-либо» естественно передаёт смысл греческого генитива при ὁδός.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: идущих от восхода солнца
  rationale: Сохраняет яркий буквальный образ востока как места восхода солнца; причастие «идущих» естественно выражает происхождение или приближение царей, не истолковывая апокалиптическую картину.
theological_decisions:
- issue: Следует ли явно назвать шестого ангелом
  choice: Сохранено «шестой» без добавления слова «ангел».
  alternative: «шестой ангел»
  rationale: Хотя из контекста ясно, что речь об ангеле, в самом стихе существительное отсутствует; перевод не вносит пояснение непосредственно в текст.
- issue: Следует ли истолковывать высыхание Евфрата и приближение царей символически
  choice: Образы переданы прямо, без толкования.
  alternative: Парафраз, объясняющий их как нашествие или эсхатологическое собирание войск.
  rationale: Сам стих не раскрывает окончательного смысла образов, поэтому перевод сохраняет апокалиптическую многозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Синтаксис остаётся близким к греческому, но не звучит искусственно; устаревшие слова и конфессионально окрашенные пояснения не используются.
