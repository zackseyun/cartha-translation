id: REV.16.8
reference: Revelation 16:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: ru
  text: Четвёртый вылил свою чашу на солнце, и ему[a] было дано палить людей огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Местоимение «ему», вероятнее всего, относится к солнцу: «солнцу было дано палить людей огнём». Последние слова можно перевести более буквально: «палить людей в огне».'
    reason: Уточнение вероятного референта местоимения и буквального значения ἐν πυρί без устранения неоднозначности основного текста.
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: четвёртый
  rationale: Субстантивированное прилагательное указывает на четвёртого участника последовательности; по контексту это ангел, но слово «ангел» в данном стихе не выражено.
- source_word: ἐξέχεεν
  choice: вылил
  rationale: Естественно передаёт действие ἐκχέω в повторяющейся формуле излияния чаш суда.
- source_word: φιάλην
  choice: чашу
  rationale: φιάλη обозначает широкую чашу; это современное и понятное соответствие, сохраняющее образ Откровения.
- source_word: ἐπὶ τὸν ἥλιον
  choice: на солнце
  rationale: ἐπί с винительным падежом обозначает цель излияния; русское «на солнце» точно и естественно.
- source_word: ἐδόθη αὐτῷ
  choice: ему было дано
  rationale: Сохраняет безличную пассивную конструкцию и не называет подразумеваемого дающего. Мужской род русского местоимения также не устраняет формально возможную неоднозначность, хотя ближайший референт — солнце.
- source_word: καυματίσαι
  choice: палить
  rationale: Глагол передаёт причинение сильного жара, обжигание; «палить» естественно сочетается с солнцем и огнём.
- source_word: τοὺς ἀνθρώπους
  choice: людей
  rationale: Обозначает людей вообще, без указания исключительно на мужчин.
- source_word: ἐν πυρί
  choice: огнём
  rationale: Творительный падеж естественно выражает средство или образ действия, сохраняя образ огня; буквальное «в огне» отмечено в сноске.
theological_decisions:
- issue: Неявно выраженный деятель в ἐδόθη
  choice: Сохранить пассивную формулировку «было дано», не называя Бога прямо.
  alternative: «Бог дал ему власть» или «ему было позволено».
  rationale: Пассив, вероятно, подразумевает Божье дозволение или наделение властью, однако деятель в греческом тексте не назван.
- issue: Референт αὐτῷ
  choice: Сохранить местоимение «ему» и в сноске указать, что оно, вероятнее всего, относится к солнцу.
  alternative: Явно сказать «солнцу было дано» либо отнести местоимение к четвёртому ангелу.
  rationale: Ближайший грамматический референт — ἥλιος («солнце»), и способность палить людей соответствует контексту; однако форма местоимения сама по себе допускает неоднозначность, которую не следует без необходимости устранять.
- issue: Общее значение ἀνθρώπους
  choice: Перевести как «людей».
  alternative: «мужчин» или «человечество».
  rationale: В контексте слово относится к людям в целом, а не только к лицам мужского пола.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Сохранена краткая повторяющаяся формула главы; не добавлено отсутствующее в стихе слово «ангел», а божественный деятель пассивной конструкции не назван.
