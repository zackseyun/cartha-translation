  source_fidelity: Смысл причинных оборотов ἐκ τῶν πόνων / ἐκ τῶν ἑλκῶν и отрицания покаяния передан верно. Однако «Бога небесного» заменяет греческий генитивный титул «Бог неба» прилагательным и может означать просто «небесного Бога»; точнее сохранить титул «Бог небес».
