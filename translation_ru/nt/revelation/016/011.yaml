id: REV.16.11
reference: Revelation 16:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: ru
  text: И они хулили Бога небес из-за своих страданий и язв, но не раскаялись в своих делах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: хулили
  rationale: Глагол «хулить» естественно и точно передаёт злоречие, направленное против Бога, сохраняя религиозную силу греческого βλασφημέω.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: Бога небесного
  rationale: Выражение сохраняет библейский титул и торжественный апокалиптический регистр, оставаясь естественным для современного русского языка.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: из-за своих страданий
  rationale: В данном контексте ἐκ имеет причинное значение; πόνος обозначает мучительную боль или страдание, а не труд.
- source_word: ἑλκῶν
  choice: язв
  rationale: «Язвы» точно передают ἕλκος — болезненные открытые поражения — и соответствуют контексту казней в Откровении.
- source_word: μετενόησαν
  choice: не раскаялись
  rationale: В Откровении μετανοέω означает нравственно-религиозное раскаяние, а не просто перемену мнения.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: в своих делах
  rationale: Русское сочетание «раскаяться в своих делах» естественно выражает предмет раскаяния, хотя греческое ἐκ буквально указывает на отход от дел.
theological_decisions:
- issue: Значение повторяющегося предлога ἐκ
  choice: В первых двух оборотах передана причина хулы («из-за»), а в последнем — предмет раскаяния («в своих делах»).
  alternative: 'Более буквально: «от своих страданий и язв» и «не отвернулись от своих дел».'
  rationale: Контекст противопоставляет хулу, вызванную страданиями, раскаянию, которого не произошло. Разные русские соответствия передают обычные контекстуальные значения ἐκ, не добавляя богословского толкования.
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным апокалиптическим звучанием. Союз «но» естественно подчёркивает смысловой контраст, выраженный последним καί: несмотря на страдания, они не раскаялись.'
