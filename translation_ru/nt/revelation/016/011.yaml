  terminology: «Хулили» точно передаёт ἐβλασφήμησαν в обращении к Богу. «Язвы» приемлемо передаёт ἕλκη, а «раскаялись» — μετανοέω в данном нравственно-религиозном контексте. Титул следует исправить на «Бог небес».
