  verdict: revise
  source_fidelity: 'Начало стиха передано точно: «на небе разразилась война» естественно выражает возникновение конфликта, а Михаил, его ангелы и дракон названы без интерпретирующих добавлений. Однако «Дракон и его ангелы сражались в ответ» заменяет единственное число греческого ἐπολέμησεν («дракон сражался») множественным и добавляет эксплицитное «в ответ», которого в тексте нет. Более близкая и естественная русская передача возможна без утраты подразумеваемого участия ангелов.'
