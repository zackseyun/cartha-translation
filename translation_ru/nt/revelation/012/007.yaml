  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: ru
  text: 'И на небе разразилась война[a]: Михаил и его ангелы сразились с драконом[b]. И дракон сражался вместе со своими ангелами[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и произошла на небе война»; «и возникла на небе война».'
    reason: lexical_alternative
  - marker: b
    text: 'Более буквально: «Михаил и его ангелы — сразиться с драконом». В греческом употреблён артикулярный инфинитив, выражающий действие; в зависимости от анализа конструкции он может также передавать цель.'
    reason: lexical_alternative
  - marker: c
    text: 'Более буквально: «и дракон сражался, и его ангелы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: разразилась война
  rationale: Сочетание γίνομαι с существительным обозначает возникновение события. «Разразилась война» естественно по-русски передаёт начинательное значение, не сводя выражение к статичному «была война».
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В данном апокалиптическом контексте οὐρανός обозначает небесную сферу, а не просто видимое небо; «на небе» — естественная русская библейская формулировка.
- source_word: Μιχαὴλ
  choice: Михаил
  rationale: Использована устоявшаяся русская форма библейского личного имени без поясняющего титула.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: его ангелы
  rationale: Притяжательная конструкция прямо сохраняет связь ангелов с Михаилом, а затем — параллельно — с драконом.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: сразились с драконом
  rationale: Артикулярный инфинитив представляет действие или цель в сжатой конструкции после упоминания Михаила и его ангелов. Личная глагольная форма естественно передаёт смысл по-русски; в контексте войны «сразились с» однозначно выражает противостояние.
- source_word: δράκοντος / δράκων
  choice: дракон / драконом
  rationale: «Дракон» сохраняет апокалиптический образ и соответствует ближайшему контексту Откровения 12.
- source_word: ἐπολέμησεν
  choice: сражались в ответ
  rationale: Форма единственного числа непосредственно относится к дракону, однако последующее «и его ангелы» включает их в действие. Множественное число создаёт естественную русскую конструкцию, а «в ответ» передаёт контекстуально подразумеваемую ответную сторону столкновения; более буквальная структура отмечена в сноске.
theological_decisions:
- issue: Личность и статус Михаила
  choice: Передать только личное имя «Михаил», без истолковывающего дополнения.
  alternative: Добавить «архангел» либо отождествить Михаила с христологической фигурой.
  rationale: Сам стих называет Михаила, но здесь не указывает его чин и не отождествляет его с Христом. Перевод не должен вносить в текст выводы отдельных богословских традиций.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим апокалиптическому повествованию. Сохранён параллелизм двух сторон конфликта; тяжёлая греческая синтаксическая конструкция передана естественно, а её формальная структура отражена в сносках. Конечная запятая сохранена, поскольку предложение продолжается в следующем стихе.
