lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный повествовательный союз, связывающий предложение с предыдущим контекстом.
- source_word: ἐστάθη
  choice: стал он
  rationale: Аорист пассивной формы ἵστημι употреблён непереходно в значении «стал, встал». Местоимение «он» естественно отсылает к дракону из предыдущего стиха; инверсия сохраняет плавность русского повествования.
- source_word: ἐπὶ
  choice: на
  rationale: С винительным падежом здесь обозначает место, на котором оказался и стоял субъект.
- source_word: τὴν ἄμμον
  choice: песке
  rationale: Передаёт буквальное значение ἄμμος — «песок», не заменяя образ более общим словом «берег».
- source_word: τῆς θαλάσσης
  choice: у моря
  rationale: Естественно по-русски передаёт определительный генитив и обозначает морской песок; буквальное «песок моря» звучало бы неестественно.
theological_decisions:
- issue: Лицо подлежащего и текстовый вариант формы глагола
  choice: Основной текст следует чтению ἐστάθη — «стал он», которое в контексте наиболее естественно относится к дракону.
  alternative: «И стал я на песке у моря».
  rationale: Таков печатный текст SBLGNT. Вариант первого лица ἐστάθην существенно меняет говорящего, поэтому он сохранён в сноске, а не устранён.
translation_notes:
  register: Современный литературный русский язык; краткая, образная и понятная формулировка. Выражение «на песке у моря» сохраняет упоминание песка и звучит естественнее буквального «на песке моря».
