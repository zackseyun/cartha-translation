    rationale: «К месту своему» яснее выражает движение к предназначенному ей месту и соответствует возвышенному повествовательному регистру.
  revised_text: Женщине были даны два крыла великого орла, чтобы она могла улететь в пустыню, к месту своему, где там её будут кормить в течение времени, времён и половины времени, вдали от змея.[a]
