revisions:
- from: И даны были женщине два крыла великого орла, чтобы она летела в пустыню, в своё место, где её будут кормить в течение времени, времён и половины времени, вдали от змея.[a]
  to: Женщине были даны два крыла великого орла, чтобы она могла улететь в пустыню, к месту своему, где там её будут кормить в течение времени, времён и половины времени, вдали от змея.[a]
  rationale: Добавлено «там» для передачи ἐκεῖ, а направительный оборот уточнён как «к месту своему». «Могла улететь» естественно выражает целевое ἵνα при глаголе полёта, не вводя нового толкования. Пассивность питания, неопределённость действующего лица и символическая временная формула сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:35:17Z'
