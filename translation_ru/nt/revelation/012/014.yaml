  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт пассивные формы, образ крыльев, пустыню, временную формулу и удаление от змея. Однако явно присутствующее в SBLGNT ἐκεῖ («там») не следует опускать: в греческом оно подчёркивает место питания. Также русское «в своё место» допустимо, но «к месту своему» точнее отражает направление εἰς τὸν τόπον αὐτῆς и лучше сохраняет возвышенный регистр.'
  naturalness: Исправленный порядок слов «Женщине были даны» естественнее современного литературного русского. «Где там её будут кормить» сохраняет греческое ἐκεῖ и остаётся понятным; повтор места здесь мотивирован оригиналом.
  terminology: «Женщина», «великий орёл», «пустыня» и «змей» переданы последовательно и без конфессионального истолкования. Формула «время, времена и половина времени» сохранена намеренно нерасшифрованной.
