id: REV.12.14
reference: Revelation 12:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: ru
  text: Женщине были даны два крыла великого орла, чтобы она могла улететь в пустыню, к месту своему, где там её будут кормить в течение времени, времён и половины времени, вдали от змея.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица змея».'
    reason: Показывает конкретную греческую идиому, которая в основном тексте передана естественным русским выражением «вдали от змея».
lexical_decisions:
- source_word: ἐδόθησαν
  choice: даны были
  rationale: Пассивная форма оригинала сохранена; она не называет действующего лица и допускает подразумеваемое божественное действие.
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: два крыла великого орла
  rationale: Формально близкая и естественная по-русски передача апокалиптического образа.
- source_word: ἵνα πέτηται
  choice: чтобы она летела
  rationale: Передаёт целевое значение ἵνα и форму настоящего времени без ненужного уточнения характера полёта.
- source_word: ἡ ἔρημος
  choice: пустыня
  rationale: Стандартный библейский эквивалент, сохраняющий как географический, так и символический потенциал слова.
- source_word: ὅπου τρέφεται ἐκεῖ
  choice: где её будут кормить
  rationale: τρέφεται передано пассивно, без указания кормящего; отдельное «там» опущено как избыточное в современном русском, поскольку его значение уже выражено словом «где».
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: в течение времени, времён и половины времени
  rationale: Сохранена намеренно загадочная формула оригинала без истолковывающего пересчёта в годы.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: вдали от змея
  rationale: Идиоматичная русская передача пространственного удаления и укрытия от присутствия змея; буквальное «от лица» здесь звучало бы неестественно.
theological_decisions:
- issue: Неуказанный деятель при пассивных глаголах
  choice: 'Сохранить пассив: «даны были», «её будут кормить»'
  alternative: Явно назвать Бога дающим крылья и питающим женщину
  rationale: Греческий текст не называет деятеля; перевод не должен устранять эту сдержанность.
- issue: Продолжительность «время, времена и половина времени»
  choice: Сохранить формулу буквально
  alternative: Передать как «три с половиной года»
  rationale: Числовое толкование вероятно в контексте книги, но в данном стихе оно не выражено напрямую; образная формула должна остаться открытой.
- issue: Образ великого орла
  choice: Не добавлять пояснений или отсылок в основной текст
  alternative: Истолковать крылья как Божью защиту либо связать их с конкретным ветхозаветным текстом
  rationale: Стих даёт образ, но не формулирует его однозначного истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис остаётся близким к греческому, но избегает тяжеловесной кальки; неопределённость пассивных конструкций и символической временной формулы сохранена.
