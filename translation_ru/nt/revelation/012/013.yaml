  terminology: «Дракон», «женщина», «низвержен» и «преследовал» выбраны удачно. «Преследовал» оставляет открытыми конкретную погоню и враждебное гонение, не навязывая один из оттенков διώκω. Сноска b должна ясно сообщать, что буквально в греческом стоит «мужского [пола]», а слово «дитя» добавлено ради норм русского синтаксиса.
