  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: ru
  text: И когда дракон увидел, что он был низвержен на землю, он преследовал[a] женщину, родившую дитя мужского пола[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может означать как преследование в смысле погони, так и гонение; здесь, вероятно, присутствуют оба оттенка.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мужского [пола]». Слово «дитя» добавлено для естественности русского выражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: дракон
  rationale: Сохраняет конкретный апокалиптический образ исходного текста; отождествление дракона со змеем в другом месте не следует переносить в формулировку этого стиха.
- source_word: ἐβλήθη
  choice: был низвержен
  rationale: Аорист пассивного залога передаёт насильственное свержение. «Низвержен» естественно сочетается с направлением «на землю» и сохраняет возвышенный, но понятный регистр.
- source_word: εἰς τὴν γῆν
  choice: на землю
  rationale: В космическом контексте Откровения γῆ означает землю в противопоставлении небу, а не отдельную страну или сушу.
- source_word: ἐδίωξεν
  choice: стал преследовать
  rationale: 'Русское «преследовать» удачно сохраняет оба возможных оттенка διώκω: погоню и гонение. Конструкция «стал преследовать» естественно обозначает последовавшее действие.'
- source_word: γυναῖκα
  choice: женщину
  rationale: Прямой и нейтральный эквивалент, не предрешающий символическую личность женщины.
- source_word: ἥτις ἔτεκεν
  choice: родившую
  rationale: Причастный оборот естественен в современном русском и точно передаёт указание на женщину, которая родила.
- source_word: τὸν ἄρσενα
  choice: младенца мужского пола
  rationale: Субстантивированное ἄρσενα буквально обозначает существо мужского пола; слово «младенца» восполняется из ближайшего контекста и делает выражение естественным по-русски, не заменяя его интерпретирующим «сына».
theological_decisions:
- issue: Символическая личность женщины и младенца
  choice: Сохранить образы «женщина» и «младенец мужского пола» без истолковывающего уточнения.
  alternative: Отождествить женщину с Марией, Израилем или народом Божьим/Церковью, а младенца прямо назвать Христом.
  rationale: Апокалиптические образы допускают несколько толкований. Перевод должен передавать сказанное по-гречески и не разрешать в основном тексте вопрос, который сам стих оставляет на уровне символа.
- issue: Значение διώκω
  choice: Передать словом «преследовать», сохраняющим оттенки погони и гонения.
  alternative: Однозначно передать как «гнать» либо как «погнаться за».
  rationale: Контекст предполагает враждебное преследование, в котором конкретная погоня и гонение могут совмещаться; сужать значение до одного оттенка не требуется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, соответствующей апокалиптическому повествованию. Синтаксис остаётся ясным для широкого читателя; символические образы и смысловая неоднозначность глагола διώκω сохранены.
