  - severity: low
    issue: «Младенца» чрезмерно конкретизирует τὸν ἄρσενα
    rationale: Греческое выражение буквально называет «мужское [существо]» и не указывает возраст. «Дитя» восполняет необходимое по-русски существительное без возрастной конкретизации.
