  verdict: revise
  source_fidelity: 'Основной смысл передан верно: δράκων — «дракон», пассивное ἐβλήθη — «был низвержен», γῆ в данном космическом контексте — «земля», а символические образы женщины и рождённого ею существа не истолковываются. Однако «стал преследовать» добавляет начинательный оттенок, которого аорист ἐδίωξεν сам по себе не выражает. «Младенец» также обозначает конкретный возраст, отсутствующий в субстантивированном ἄρσενα; безопаснее употребить более широкое «дитя».'
