base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: ru
  text: Но дракон не смог одержать верх[a], и места для них на небе больше не нашлось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оказался достаточно силён». Греческий глагол может означать «быть сильным», «быть в состоянии» или «одерживать верх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Но
  rationale: 'В контексте небесной битвы союз имеет противительный оттенок: после нападения дракона сообщается о его поражении.'
- source_word: οὐκ ἴσχυσεν
  choice: дракон не одолел
  rationale: ἰσχύω может означать «быть сильным», «быть в состоянии» или «одержать верх». В контексте битвы естественное русское «не одолел» сохраняет идею неспособности победить; явное повторение «дракон» устраняет неясность местоимения без изменения референта.
- source_word: οὐδὲ
  choice: и
  rationale: После отрицательной первой части русское «и» естественно связывает второй результат поражения; отрицание выражено словами «не нашлось».
- source_word: τόπος
  choice: места
  rationale: Прямое и естественное обозначение места в небесной сфере.
- source_word: εὑρέθη
  choice: не нашлось
  rationale: Безличная возвратная форма естественно передаёт греческий пассив «не было найдено», сохраняя его результативный смысл.
- source_word: αὐτῶν
  choice: для них
  rationale: Место предназначено для группы — дракона и его ангелов, упомянутых в предыдущем стихе.
- source_word: ἔτι
  choice: больше не
  rationale: В сочетании с отрицанием указывает, что отныне места там для них нет.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В данном контексте οὐρανός обозначает небесную сферу; нормативное русское выражение — «на небе».
theological_decisions:
- issue: Референт единственного числа ἴσχυσεν
  choice: Субъект — дракон из предыдущего стиха; затем «для них» относится к дракону и его ангелам вместе.
  alternative: 'Передать первую часть во множественном числе: «они не смогли одолеть».'
  rationale: Единственное число греческого глагола продолжает субъект δράκων из Откр. 12:7, тогда как αὐτῶν во второй части охватывает всю группу. Перевод сохраняет это различие.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Формулировка лаконична и понятна; сохранены единственное число субъекта и пассивно-результативный смысл второй части.
