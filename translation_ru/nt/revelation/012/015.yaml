source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: ru
  text: И змей изверг из своей пасти вслед за женщиной воду, подобную реке,[a] чтобы река унесла её.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позади женщины». Греческое выражение может обозначать как положение позади неё, так и движение вслед за ней.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы сделать её уносимой рекой», то есть чтобы река унесла её.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: изверг
  rationale: В контексте воды, выходящей из пасти, «изверг» естественно и выразительно передаёт направленное, мощное действие βάλλω, не ослабляя образ до нейтрального «выпустил».
- source_word: ὁ ὄφις
  choice: змей
  rationale: «Змей» сохраняет библейский и символический оттенок ὄφις; «змея» звучала бы преимущественно как обозначение обычного животного.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: из своей пасти
  rationale: Для змея по-русски естественно «пасть»; возвратное «своей» ясно соотносит её с подлежащим.
- source_word: ὀπίσω τῆς γυναικός
  choice: вслед за женщиной
  rationale: Передаёт направленность погони или нападения, одновременно не исключая пространственного смысла «позади женщины».
- source_word: ὕδωρ ὡς ποταμόν
  choice: воду, подобную реке
  rationale: Сохраняет сравнительный оборот с ὡς и образ реки, не заменяя его толкованием «поток» или «наводнение».
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает целевое значение греческого союза.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: чтобы река унесла её
  rationale: Редкое прилагательное означает «уносимая рекой»; русская конструкция прямо и естественно передаёт желаемый результат, не добавляя идеи утопления.
theological_decisions:
- issue: Символический смысл воды и реки в апокалиптическом видении
  choice: Сохранить в основном тексте образы воды и реки без их расшифровки.
  alternative: Передать воду как войско, гонение, ложь или хаос.
  rationale: Греческий текст изображает нападение символически, но сам стих не определяет символ однозначно; перевод не должен закреплять одну богословскую интерпретацию.
- issue: Цель нападения змея
  choice: Передать её как намерение добиться, чтобы река унесла женщину.
  alternative: Уточнить, что змей хотел утопить или убить её.
  rationale: ποταμοφόρητος говорит о том, что кого-либо несёт река, но прямо не утверждает смерть или утопление.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим апокалиптическому повествованию. «Изверг» и «пасть» поддерживают яркость образа без архаизации; синтаксис остаётся ясным для широкого читателя.
