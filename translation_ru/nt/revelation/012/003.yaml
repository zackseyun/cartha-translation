  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: ru
  text: 'И явилось на небе другое знамение: и вот, огромный огненно-красный дракон[a], у которого семь голов и десять рогов, а на головах — семь диадем[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красный дракон». Греческое πυρρός обозначает огненно-красный, пламенный цвет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «корон». Точнее, в греческом тексте стоят «диадемы» — царские головные повязки, отличные от венка победителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: явилось
  rationale: Пассивная форма ὁράω в повествовании о видении естественно передаётся возвратным глаголом «явилось», а не буквальным «было увидено».
- source_word: ἄλλο σημεῖον
  choice: другое знамение
  rationale: «Знамение» передаёт символический характер увиденного и сохраняет возвышенный регистр Откровения.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В апокалиптическом контексте речь идёт о небесной сфере; русское «на небе» звучит естественнее, чем «в небе».
- source_word: ἰδοὺ
  choice: и вот
  rationale: «Вот» привлекает внимание к внезапно открывшемуся образу, а начальное «и» сохраняет καί и повествовательную последовательность.
- source_word: δράκων μέγας πυρρός
  choice: огромный огненно-красный дракон
  rationale: «Огромный» ясно передаёт величину μέγας в данном зрительном образе, а «огненно-красный» сохраняет огненный оттенок πυρρός.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: у которого семь голов и десять рогов
  rationale: Естественная русская конструкция сохраняет все элементы описания без тяжеловесного причастия «имеющий».
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: на головах
  rationale: Принадлежность голов уже однозначно выражена конструкцией «у которого»; повторное «его» по-русски избыточно.
- source_word: διαδήματα
  choice: диадем
  rationale: «Диадемы» точно обозначают царские головные повязки и сохраняют отличие διάδημα от венка στέφανος.
theological_decisions:
- issue: Цвет дракона (πυρρός)
  choice: огненно-красный
  alternative: красный
  rationale: Выбранный вариант передаёт буквальный огненный, пламенный оттенок слова, не истолковывая его символически.
- issue: Значение μέγας при описании дракона
  choice: огромный
  alternative: великий
  rationale: В зрительном описании «огромный» естественно указывает на внушительный размер; «великий» могло бы неоправданно звучать как положительная оценка величия.
- issue: Образ семи диадем
  choice: диадемы
  alternative: короны
  rationale: Перевод сохраняет конкретный знак царской власти, но не объясняет в основном тексте, является ли эта власть истинной или притязаемой.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным регистром. Двоеточие вводит содержание знамения; конструкция «у которого» делает длинное описание естественным по-русски. Повтор «и вот» намеренно сохраняет резкий переход греческого текста.
