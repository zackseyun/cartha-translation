- from: А женщина убежала в пустыню, где у неё было место, приготовленное Богом, чтобы там её кормили тысячу двести шестьдесят дней.[a]
  to: А женщина убежала в пустыню, где у неё есть приготовленное Богом место, чтобы там её кормили[a] тысячу двести шестьдесят дней.
  rationale: 'Сохранено настоящее время ἔχει («есть») и перенесён знак сноски к неопределённо-личной форме «кормили». Остальные решения оставлены: они точно передают лексику, цель ἵνα и неназванный субъект τρέφωσιν, не внося богословского истолкования.'
