  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: ru
  text: А женщина убежала в пустыню, где у неё есть приготовленное Богом место, чтобы там её кормили[a] тысячу двести шестьдесят дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы там они кормили её»; в греческом стоит глагол третьего лица множественного числа без указания, кто именно совершает действие.'
    reason: Сохранение грамматической неопределённости относительно тех, кто кормит женщину.
lexical_decisions:
- source_word: ἔφυγεν
  choice: убежала
  rationale: Аорист φεύγω обозначает бегство или поспешное удаление; «убежала» естественно и ясно передаёт это действие.
- source_word: ἔρημον
  choice: пустыню
  rationale: ἔρημος означает пустынное, безлюдное место; «пустыня» сохраняет библейские ассоциации и не требует представления о песчаной местности.
- source_word: τόπον
  choice: место
  rationale: Прямое и естественное соответствие существительному τόπος.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: приготовленное Богом
  rationale: Перфектное страдательное причастие указывает на уже приготовленное место, а ἀπό обозначает Бога как деятеля.
- source_word: ἔχει
  choice: было у неё
  rationale: Настоящее историческое ἔχει в русском повествовании естественно передаётся прошедшим временем; оборот «у неё было место» сохраняет значение обладания или предоставленности места.
- source_word: τρέφωσιν αὐτὴν
  choice: её кормили
  rationale: Неопределённо-личная конструкция сохраняет неуказанного деятеля греческой формы третьего лица множественного числа и звучит естественнее буквального «они кормили бы её».
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: тысячу двести шестьдесят дней
  rationale: Винительный длительности естественно передаётся в русском без предлога; число сохранено словами.
theological_decisions:
- issue: Неуказанный субъект τρέφωσιν
  choice: «чтобы там её кормили»
  alternative: «чтобы там они кормили её»
  rationale: Греческий текст использует активную форму третьего лица множественного числа без названного субъекта. Русская неопределённо-личная конструкция сохраняет эту неопределённость, не приписывая действие прямо Богу.
- issue: Отношение цели в ἵνα
  choice: «чтобы»
  alternative: «для того чтобы»
  rationale: «Чтобы» кратко и естественно передаёт целевое значение, не исключая возможного оттенка результата.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Греческое повторение указания места передано без неестественного русского «где у неё там», а неопределённый деятель сохранён посредством неопределённо-личной конструкции.
