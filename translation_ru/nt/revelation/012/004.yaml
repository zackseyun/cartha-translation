source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: ru
  text: Его хвост увлекает за собой треть небесных звёзд и низверг их на землю. Дракон стоит перед женщиной, которой предстояло родить, чтобы, когда она родит, пожрать её ребёнка.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: увлекает
  rationale: Настоящее время сохранено; глагол передаёт мощное движение хвоста, уносящего звёзды за собой, без излишней конкретизации способа.
- source_word: τὸ τρίτον
  choice: треть
  rationale: Естественная русская передача доли; по смыслу — треть от совокупности небесных звёзд.
- source_word: ἔβαλεν
  choice: низверг
  rationale: Аорист передан прошедшим временем, сохраняя резкий переход от исторического настоящего σύρει; «низверг» естественно выражает бросок сверху вниз.
- source_word: ἕστηκεν
  choice: встал
  rationale: Перфект описывает занятое драконом положение перед женщиной; «встал» естественно передаёт результирующее состояние в повествовательном контексте.
- source_word: τῆς μελλούσης τεκεῖν
  choice: которой предстояло родить
  rationale: Передаёт значение близкого или ожидаемого события без добавления отсутствующего в греческом указания на схватки.
- source_word: καταφάγῃ
  choice: пожрать
  rationale: Сильный глагол соответствует хищническому и чудовищному образу дракона; сослагательное значение цели передано инфинитивной конструкцией с «чтобы».
- source_word: τὸ τέκνον αὐτῆς
  choice: её ребёнка
  rationale: τέκνον обозначает ребёнка без указания пола; перевод сохраняет эту неопределённость, не предвосхищая последующий стих.
theological_decisions:
- issue: Значение трети небесных звёзд
  choice: Сохранить образ буквально без отождествления звёзд с ангелами или иными существами
  alternative: Истолковать звёзды как падших ангелов
  rationale: Сам стих даёт апокалиптический образ, но прямо не объясняет его; перевод не должен встраивать спорное толкование.
- issue: Временная смена σύρει / ἔβαλεν
  choice: 'Сохранить сочетание настоящего и прошедшего времени: «увлекает… и низверг»'
  alternative: Согласовать оба глагола в настоящем или прошедшем времени
  rationale: Необычная смена времён присутствует в греческом тексте и создаёт напряжённую живописность; её не следует молча сглаживать.
- issue: Пол ребёнка в стихе 4
  choice: Использовать нейтральное «ребёнка»
  alternative: Передать как «сына» или «младенца-мужчину» на основании стиха 5
  rationale: В данном стихе стоит средний род τέκνον; пол становится явным далее, поэтому здесь сохраняется локальная неопределённость.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной апокалиптической образностью. Синтаксис близок к оригиналу, при этом естественен для чтения вслух. Архаизирующее «пожрать» сохранено как уместно сильное слово для дракона; тяжеловесные церковнославянизмы избегаются.
