  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: ru
  text: Они победили его кровью Агнца и словом своего свидетельства и не дорожили своей жизнью вплоть до смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не возлюбили своей жизни до смерти». Греческое слово также может означать «душа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: победили
  rationale: Передаёт аорист активного залога и характерный для Откровения образ победы в духовной борьбе; естественно и ясно в современном русском языке.
- source_word: διὰ τὸ αἷμα
  choice: кровью
  rationale: Творительный падеж естественно выражает средство победы и сохраняет возможный оттенок основания, не добавляя отсутствующего в тексте догматического пояснения.
- source_word: τοῦ ἀρνίου
  choice: Агнца
  rationale: Сохраняет установленный в Откровении христологический титул и жертвенный образ; прописная буква указывает на титульное употребление.
- source_word: διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν
  choice: словом своего свидетельства
  rationale: Сохраняет оба существительных λόγος и μαρτυρία и передаёт их свидетельствующую весть; возвратное «своего» естественно соотносится с подлежащим «они».
- source_word: οὐκ ἠγάπησαν
  choice: не дорожили
  rationale: В сочетании с жизнью русское «не дорожили» естественно выражает, что они не держались за неё как за высшее благо. Буквальное «не любили свою жизнь» могло бы ошибочно прозвучать как отрицательная оценка жизни.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: своей жизнью
  rationale: В контексте мученической смерти ψυχή означает земную жизнь, а не требует противопоставления души и тела. Единственное число сохраняет распределительное число греческого текста.
- source_word: ἄχρι θανάτου
  choice: даже перед лицом смерти
  rationale: Передаёт предельную готовность отдать жизнь, вплоть до смерти, и звучит естественно и торжественно по-русски.
theological_decisions:
- issue: Характер победы кровью Агнца
  choice: Кровь Агнца представлена как средство или основание победы без дальнейшего догматического разъяснения.
  alternative: «из-за крови Агнца» или «благодаря крови Агнца» с более явным причинным оттенком
  rationale: διά с винительным допускает причинный и инструментальный оттенки; русский творительный сохраняет краткость и не сужает смысл до одной богословской формулы.
- issue: Значение ψυχή в контексте мученичества
  choice: «жизнь»
  alternative: «душа»
  rationale: Упоминание смерти показывает, что речь идёт о готовности лишиться земной жизни; перевод «душа» мог бы внести не требуемое текстом противопоставление души и тела.
- issue: Смысл οὐκ ἠγάπησαν применительно к жизни
  choice: «не дорожили своей жизнью»
  alternative: «не любили своей жизни»
  rationale: Фраза означает, что верующие не предпочли сохранение жизни верности свидетельству, а не то, что жизнь сама по себе была для них ненавистна или лишена ценности.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаическим звучанием. Синтаксис сохраняет параллелизм греческого текста; лексика понятна широкому читателю. Маркер сноски помещён непосредственно после относящейся к нему заключительной фразы.
