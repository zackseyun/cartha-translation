lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: беременна
  rationale: Греческое выражение буквально означает «имеющая во чреве» и обычно обозначает беременность. «Беременна» — естественный и точный современный русский эквивалент.
- source_word: κράζει
  choice: кричит
  rationale: Настоящее время передано настоящим временем, чтобы сохранить непосредственность и живость видения.
- source_word: ὠδίνουσα
  choice: мучаясь от родовых схваток
  rationale: Причастие обозначает переживание родовых болей. Этот вариант ясно сохраняет как связь с родами, так и образ боли.
- source_word: βασανιζομένη
  choice: терзаемая муками
  rationale: Страдательное причастие выражает сильное мучение. Формулировка сохраняет интенсивность греческого слова и не ослабляет страдание до простого беспокойства.
- source_word: τεκεῖν
  choice: чтобы родить
  rationale: Инфинитив связан с мучениями женщины и указывает на предстоящее рождение. Целевая конструкция естественна по-русски и сохраняет связь с процессом родов.
- source_word: καὶ ... καὶ
  choice: и ... и
  rationale: Повтор союза сохранён, чтобы передать накопительный, напряжённый характер греческой фразы.
theological_decisions:
- issue: Сила страданий женщины и её символическая идентичность
  choice: Передать βασανιζομένη сильным выражением «терзаемая муками», не поясняя, кого символизирует женщина.
  alternative: Смягчить до «испытывая боль» или истолковать женщину в самом тексте.
  rationale: Стих ярко описывает страдания женщины, но сам по себе не раскрывает её символическую идентичность и не объясняет богословское значение родовых мук. Перевод сохраняет силу образа, не навязывая толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной напряжённости апокалиптического видения. Настоящее время «кричит» поддерживает живость повествования; буквальный повтор образов боли сохранён без конфессионального истолкования.
