id: REV.12.9
reference: Revelation 12:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: ru
  text: И был низвергнут великий дракон — древний змей[a], называемый Дьяволом и Сатаной, который вводит в заблуждение весь мир[b]. Он был низвергнут на землю, и ангелы его были низвергнуты вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ «древнего змея» отсылает к змею в Быт 3.
    reason: cross_reference
  - marker: b
    text: 'Или: «всю обитаемую землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: был низвергнут / были низвергнуты
  rationale: Пассивные формы βάλλω в данном контексте обозначают насильственное изгнание вниз. «Низвергнут» ясно передаёт направление и силу действия, а повтор сохраняет выразительный повтор греческого текста.
- source_word: δράκων ὁ μέγας
  choice: великий дракон
  rationale: Прямой и естественный эквивалент, сохраняющий апокалиптический образ Откровения.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: древний змей
  rationale: «Змей» соответствует библейскому образу и отсылке к Быт 3; «древний» передаёт ἀρχαῖος, не усиливая его до более толковательного «изначальный».
- source_word: ὁ καλούμενος
  choice: называемый
  rationale: Причастие вводит признанные имена или наименования дракона и естественно сочетается с рядом приложений.
- source_word: Διάβολος καὶ ὁ Σατανᾶς
  choice: Дьяволом и Сатаной
  rationale: В данном контексте оба слова служат устойчивыми личными именованиями. Прописные буквы подчёркивают их функцию имён, не добавляя толкования их этимологии.
- source_word: ὁ πλανῶν
  choice: который вводит в заблуждение
  rationale: Передаёт длительное, характерное действие πλανάω и сохраняет возможные оттенки обмана и уведения с верного пути.
- source_word: τὴν οἰκουμένην ὅλην
  choice: весь мир
  rationale: Естественное современное выражение универсального масштаба; более буквальное значение «вся обитаемая земля» сохранено в сноске.
- source_word: εἰς τὴν γῆν
  choice: на землю
  rationale: Контекст противопоставляет небесную сферу земле, поэтому «земля», а не «страна», является наиболее точным выбором.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: ангелы его
  rationale: В апокалиптическом контексте речь идёт о сверхъестественных существах, связанных с драконом; «вестники» здесь было бы неоправданно общим.
- source_word: μετ’ αὐτοῦ
  choice: вместе с ним
  rationale: Естественно и ясно передаёт совместность их низвержения.
theological_decisions:
- issue: Передача Διάβολος и Σατανᾶς в ряду приложений
  choice: называемый Дьяволом и Сатаной
  alternative: называемый клеветником и противником
  rationale: Текст отождествляет дракона посредством общеизвестных имён или титулов. Традиционные формы сохраняют это отождествление, тогда как перевод этимологических значений внёс бы в основной текст дополнительное истолкование.
- issue: Масштаб значения οἰκουμένη
  choice: весь мир
  alternative: вся обитаемая земля
  rationale: Основной текст передаёт универсальный апокалиптический масштаб естественным русским выражением, а буквальный пространственный оттенок отмечен в сноске без искусственного сужения смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. «Низвергнут» сохраняет торжественность и направленность действия, не прибегая к архаическим формам; синтаксис остаётся ясным для современного читателя.
