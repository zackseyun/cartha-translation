source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: ru
  text: И дракон разгневался на женщину и отправился вести войну с остальными её потомками — с теми, кто соблюдает заповеди Бога и имеет свидетельство Иисуса[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельство об Иисусе»; также возможно: «свидетельство, данное Иисусом». Греческая форма допускает оба понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: разгневался
  rationale: Передаёт наступление сильного гнева, выраженное аористом ὀργίζομαι, и естественно звучит в современном литературном русском.
- source_word: δράκων
  choice: дракон
  rationale: Стандартное соответствие, сохраняющее апокалиптический образ и связь с ранее названным персонажем главы.
- source_word: ἐπὶ τῇ γυναικί
  choice: на женщину
  rationale: Русская конструкция «разгневаться на кого-либо» естественно передаёт направленность гнева; определённость восстанавливается из контекста.
- source_word: ἀπῆλθεν
  choice: отправился
  rationale: Передаёт движение к последующему действию без ненужной архаичности; по смыслу соответствует «ушёл/отправился».
- source_word: ποιῆσαι πόλεμον
  choice: вести войну
  rationale: Идиоматическое русское выражение, точно передающее намерение начать и вести военные действия.
- source_word: μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: с остальными её потомками
  rationale: «С» сохраняет конструкцию μετά с родительным при выражении войны, а «потомки» естественно передаёт коллективное σπέρμα в отношении людей.
- source_word: τηρούντων τὰς ἐντολὰς τοῦ θεοῦ
  choice: кто соблюдает заповеди Бога
  rationale: «Соблюдать заповеди» — точное и устойчивое современное соответствие для τηρεῖν τὰς ἐντολάς.
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: хранит свидетельство Иисуса
  rationale: «Хранит» выражает обладание с оттенком верности, уместным в контексте; «свидетельство Иисуса» сохраняет неоднозначность греческого родительного.
theological_decisions:
- issue: Значение родительного падежа в τὴν μαρτυρίαν Ἰησοῦ
  choice: свидетельство Иисуса
  alternative: свидетельство об Иисусе; свидетельство, данное Иисусом
  rationale: Греческий родительный допускает как объективное понимание (свидетельство об Иисусе), так и субъектное (свидетельство, исходящее от Иисуса). Основной текст не устраняет эту богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования; синтаксис сделан естественным и ясным. Тире вводит пояснение, кто именно назван остальными потомками. Маркер сноски поставлен непосредственно после неоднозначного выражения.
