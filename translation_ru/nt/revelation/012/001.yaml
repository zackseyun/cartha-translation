lexical_decisions:
- source_word: σημεῖον
  choice: знамение
  rationale: В контексте Откровения слово обозначает зримый символический знак; «знамение» сохраняет апокалиптический оттенок, не сводя образ к чуду.
- source_word: μέγα
  choice: великое
  rationale: Передаёт как значительность, так и масштаб знамения и соответствует возвышенному повествовательному регистру.
- source_word: ὤφθη
  choice: явилось
  rationale: Греческая пассивная форма буквально означает «было увидено», однако «явилось» естественно передаёт язык видения и факт появления перед взором.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В русском языке «на небе» естественнее для локализации видимого небесного знамения и не устраняет возможной связи с небесной сферой.
- source_word: γυνή
  choice: женщина
  rationale: Стих представляет символическую женскую фигуру, не называя её женой.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: облачённая в солнце
  rationale: Причастие передаёт устойчивое состояние облачения; формулировка сохраняет необычный образ оригинала и звучит естественно в возвышенной современной русской речи.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: под ногами у неё — луна
  rationale: Сохраняет пространственный образ и делает русскую фразу ясной без добавочной интерпретации.
- source_word: στέφανος
  choice: венец
  rationale: «Венец» лучше, чем общее «корона», передаёт στέφανος — почётный или победный венок, отличный от царской диадемы; пояснение дано в сноске.
- source_word: ἀστέρων δώδεκα
  choice: из двенадцати звёзд
  rationale: Естественно передаёт родительный падеж состава и не добавляет подробностей к образу.
theological_decisions:
- issue: Символическая личность женщины
  choice: Не отождествлять женщину в переводе; передать её только как фигуру видения.
  alternative: Израиль; Мария; народ Божий; церковь.
  rationale: Сам стих не раскрывает личность женщины. Неинтерпретирующий перевод сохраняет намеренную символическую многозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, уместным для апокалиптического видения. Причастное определение и параллельное построение сохраняют торжественный ритм оригинала; символика не истолковывается внутри перевода.
