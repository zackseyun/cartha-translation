id: REV.12.12
reference: Revelation 12:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: ru
  text: Поэтому радуйтесь, небеса и живущие в них! Горе земле[a] и морю, потому что к вам сошёл дьявол в великой ярости[b], зная, что у него мало времени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суше». Греческое слово γῆ может означать как землю вообще, так и сушу или страну; здесь выбран более широкий смысл ввиду космического контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «имея великий гнев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Кратко и естественно передаёт вывод из предшествующей сцены небесной победы.
- source_word: εὐφραίνεσθε
  choice: радуйтесь
  rationale: Сохраняет повелительное значение и возвышенное, но понятное современному читателю звучание.
- source_word: οἱ οὐρανοὶ
  choice: небеса
  rationale: Именительный падеж в греческом выполняет функцию обращения; в русском обращение ясно без добавления междометия «о».
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: живущие в них
  rationale: Передаёт здесь смысл пребывания и обитания; буквальное указание на шатёр в русском было бы неясным и чрезмерно конкретным.
- source_word: οὐαὶ
  choice: горе
  rationale: Устоявшаяся русская формула пророческого предупреждения и суда.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: земле и морю
  rationale: В космическом контексте Откровения γῆ естественнее понимать как землю в широком смысле; русский дательный падеж требуется конструкцией «горе кому».
- source_word: κατέβη
  choice: сошёл
  rationale: Передаёт движение вниз из небесной сферы и завершённость действия без добавления отсутствующего в тексте значения низвержения.
- source_word: ὁ διάβολος
  choice: дьявол
  rationale: Стандартное и ясное обозначение данного лица в этом контексте.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: Сохраняет основное пространственное значение движения к адресатам, не добавляя прямо значения «против вас».
- source_word: ἔχων θυμὸν μέγαν
  choice: в великой ярости
  rationale: Естественно и выразительно передаёт крайне сильный гнев, обозначенный θυμός.
- source_word: εἰδὼς
  choice: зная
  rationale: Сохраняет причастную структуру и пояснительную связь с предшествующим высказыванием.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: у него мало времени
  rationale: Близко следует греческой формулировке и подчёркивает краткость оставшегося ему периода, не добавляя слова «только», которого в тексте нет.
theological_decisions:
- issue: К кому относится «вам» во фразе «к вам сошёл дьявол»
  choice: Местоимение оставлено без поясняющего добавления и естественно соотносится с только что названными землёй и морем как земной сферой.
  alternative: Считать, что обращение по-прежнему направлено к небесам и живущим в них.
  rationale: Непосредственное соседство с возгласом «горе земле и морю» указывает на земную сферу, однако перевод не добавляет отсутствующего слова «жители» и тем самым сохраняет образность и некоторую грамматическую напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с возвышенной ритмикой, уместной для Откровения. Формулировки остаются понятными обычному читателю; синтаксический контраст между радостью небес и горем земли и моря сохранён.
