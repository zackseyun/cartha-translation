  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: ru
  text: И земля[a] помогла женщине, и земля разверзла свои уста и поглотила реку, которую дракон изверг из своих уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суша». Греческое γῆ может означать землю, сушу или почву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: помогла
  rationale: Прямой и естественный эквивалент со значением «оказала помощь»; сохраняет простую повествовательную силу аориста.
- source_word: ἡ γῆ
  choice: земля
  rationale: В апокалиптической картине «земля» естественно передаёт космический масштаб и сохраняет повтор подлежащего; возможные значения «суша» и «почва» отмечены в сноске.
- source_word: τῇ γυναικί
  choice: женщине
  rationale: Прямая передача дательного дополнения при βοηθέω без истолкования символического образа.
- source_word: ἤνοιξεν ... τὸ στόμα αὐτῆς
  choice: разверзла свои уста
  rationale: «Разверзла» естественно сочетается с олицетворённой землёй, а «уста» поддерживают возвышенный апокалиптический регистр и образ отверстия земли.
- source_word: κατέπιεν
  choice: поглотила
  rationale: Точно передаёт καταπίνω и естественно описывает исчезновение реки в разверзшейся земле.
- source_word: τὸν ποταμόν
  choice: реку
  rationale: Прямое значение ποταμός; перевод не усиливает образ до «потока» или «наводнения».
- source_word: ὃν ἔβαλεν
  choice: которую ... изверг
  rationale: В контексте испускания реки из пасти «изверг» по-русски естественно передаёт направленное и мощное действие βάλλω, не превращая его в более конкретное «вылил».
- source_word: ὁ δράκων
  choice: дракон
  rationale: Устоявшийся прямой эквивалент δράκων, сохраняющий апокалиптический образ.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: из своих уст
  rationale: Точно передаёт исходное направление ἐκ; возвратное «своих» однозначно соотносит уста с подлежащим «дракон».
theological_decisions:
- issue: Олицетворение земли в апокалиптическом образе
  choice: Сохранить землю как действующее лицо, которое помогает, разверзает уста и поглощает реку.
  alternative: Истолковать землю как сушу, определённую территорию, человеческое общество или средство Божьего избавления.
  rationale: Сам стих не раскрывает символическое значение земли; перевод сохраняет образ и его богословскую многозначность, не подменяя его толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, уместной для апокалиптического видения. Повтор «земля» сохраняет композицию греческого текста; «разверзла свои уста» удерживает яркое олицетворение без поясняющего толкования.
