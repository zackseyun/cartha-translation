  source_fidelity: 'Основной смысл передан точно: рождение сына, его будущая пастырско-царская власть над народами железным жезлом и внезапное перенесение ребёнка к Богу и Его престолу сохранены. Однако «младенца мужского пола» неоправданно конкретизирует ἄρσεν как младенца; греческое слово обозначает мужской пол, не возраст. «Предстоит пасти» естественнее передаёт μέλλει ποιμαίνειν, сохраняя будущую направленность без чрезмерного оттенка нормативной обязанности в «надлежит».'
