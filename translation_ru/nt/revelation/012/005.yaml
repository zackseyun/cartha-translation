  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: ru
  text: И родила она сына, мальчика, которому предстоит пасти все народы железным жезлом[a]. И дитя её было восхищено к Богу и к престолу Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «править всеми народами железным жезлом». Греческий глагол буквально означает «пасти», но здесь, в отсылке к Псалму 2, он также выражает царскую власть.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: родила
  rationale: Естественно и точно передаёт конкретный образ рождения.
- source_word: υἱόν, ἄρσεν
  choice: сына, младенца мужского пола
  rationale: Сохраняет оба греческих обозначения и их намеренное смысловое усиление, не сливая их в одно.
- source_word: μέλλει ποιμαίνειν
  choice: которому надлежит пасти
  rationale: Передаёт предстоящее и предопределённое действие естественнее для русского апокалиптического повествования, не сводя μέλλει к простому будущему времени.
- source_word: ποιμαίνειν
  choice: пасти
  rationale: Сохраняет пастырскую метафору ποιμαίνω; царственный смысл, обусловленный отсылкой к Псалму 2, отмечен в сноске.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Обозначает народы мира и соответствует контексту отсылки к Псалму 2.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: железным жезлом
  rationale: Передаёт инструментальное значение ἐν и сохраняет библейский образ царского жезла.
- source_word: ἡρπάσθη
  choice: было восхищено
  rationale: Передаёт внезапное перемещение вверх к Богу; «восхищено» остаётся понятным в возвышенном библейском регистре и не предполагает эмоционального значения благодаря конструкции и контексту.
- source_word: τὸ τέκνον αὐτῆς
  choice: дитя её
  rationale: Отражает переход от более определённого υἱός к общему τέκνον и сохраняет достоинство стиля.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: к Богу и к престолу Его
  rationale: Повтор предлога «к» сохраняет направленность движения к обоим названным объектам.
theological_decisions:
- issue: Мессианская отсылка к Псалму 2 в ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ
  choice: 'Сохранить в основном тексте пастырскую метафору: «пасти ... железным жезлом».'
  alternative: «править всеми народами железным жезлом»
  rationale: Глагол ποιμαίνω буквально означает пасти, хотя в данной отсылке он выражает царскую власть. Основной текст сохраняет образ, а сноска сообщает возможную смысловую передачу.
- issue: Значение μέλλει
  choice: «которому надлежит пасти»
  alternative: «который вскоре будет пасти»; «который будет пасти»
  rationale: Формулировка сохраняет направленность к будущему и оттенок предназначенности, не утверждая однозначно только временную близость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Жезл», «дитя» и «восхищено» сохраняют достоинство и образность текста; синтаксис остаётся доступным современному читателю.
