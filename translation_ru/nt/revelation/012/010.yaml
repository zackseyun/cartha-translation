id: REV.12.10
reference: Revelation 12:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: ru
  text: 'И услышал я громкий голос на небе, говоривший: «Теперь настали спасение, сила и Царство нашего Бога и власть Его Мессии[a], потому что низвержен обвинитель наших братьев[b], обвиняющий их перед нашим Богом день и ночь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческое Χριστός означает «Помазанник» и здесь употреблено как титул.'
    reason: alternative_reading
  - marker: b
    text: Слово «братья» здесь может обозначать всех собратьев по вере, включая женщин.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: громкий голос
  rationale: В сочетании с φωνή прилагательное μέγας указывает прежде всего на громкость; это естественная современная русская передача.
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: Речь идёт о небесной сфере; «на небе» — обычное и ясное русское выражение.
- source_word: Ἄρτι ἐγένετο
  choice: Теперь настали
  rationale: Ἄρτι отмечает решающий настоящий момент, а ἐγένετο — наступление провозглашаемой реальности. Множественное число естественно согласует сказуемое с рядом однородных подлежащих.
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία
  choice: спасение, сила и Царство
  rationale: Сохранён торжественный перечень; артикли по нормам русского языка отдельно не воспроизводятся. «Царство» сохраняет апокалиптический и царственный оттенок βασιλεία.
- source_word: ἡ ἐξουσία
  choice: власть
  rationale: Передаёт законное право и полномочие властвовать, сохраняя отличие от δύναμις — «сила».
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: Его Мессии
  rationale: Χριστός здесь является титулом Божьего Помазанника, а не личным именем; «Мессия» ясно передаёт титульное значение.
- source_word: ἐβλήθη
  choice: низвержен
  rationale: Глагол обозначает насильственное низвержение; краткая форма передаёт завершённость события и соответствует возвышенному апокалиптическому регистру.
- source_word: ὁ κατήγωρ ... ὁ κατηγορῶν
  choice: обвинитель ... обвиняющий
  rationale: Сохраняется судебная образность и намеренный лексический повтор греческого текста.
- source_word: ἡμέρας καὶ νυκτός
  choice: день и ночь
  rationale: Естественная русская идиома, передающая непрерывность обвинения.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В обороте «Его Χριστός» слово явно функционирует как титул Божьего помазанного Царя. «Мессия» передаёт смысл титула, не превращая его в имя.
- issue: Род и охват ἀδελφῶν
  choice: братьев
  alternative: братьев и сестёр
  rationale: Основной текст сохраняет грамматическую форму греческого мужского множественного числа; примечание сообщает, что в контексте общины слово может охватывать верующих обоих полов.
- issue: Характер наступления спасения, силы, Царства и власти
  choice: Теперь настали
  alternative: Теперь явились; теперь осуществились
  rationale: Формулировка передаёт решительное наступление провозглашаемой небесной реальности, не уточняя сверх текста, идёт ли речь исключительно о начале, проявлении или полном завершении.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сделан ясным для чтения вслух; сохранены судебная образность, риторический перечень и повтор «обвинитель — обвиняющий».
