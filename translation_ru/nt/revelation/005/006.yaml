    issue: «У Него было семь рогов и семь глаз»
    rationale: Греческое ἔχων — настоящее описательное причастие, характеризующее Агнца в сцене видения. Русское прошедшее «было» способно представить признаки как относящиеся лишь к прошлому моменту, а не как наличные.
  - severity: low
    issue: «посланных по всей земле»
    rationale: 'Оборот естественен, но εἰς πᾶσαν τὴν γῆν направительно: духи посланы «на всю землю». Предложенный вариант точнее передаёт направление посылания.'
