id: REV.5.6
reference: Revelation 5:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: ru
  text: И я увидел посреди престола и четырёх живых существ и посреди старейшин Агнца, стоящего, словно закланного[a], с семью рогами и семью глазами; эти глаза — семь духов Божьих[b], посланных на всю землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «как закланного»; возможно также: «будто убитого».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «семь духов Божьих» сохранено в том виде, в каком оно стоит в тексте; некоторые понимают его как символическое указание на Святого Духа в семикратной полноте.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων
  choice: посреди престола и четырёх живых существ и посреди старейшин
  rationale: Сохраняет повтор ἐν μέσῳ и многослойное пространственное описание видения, не устраняя его некоторую синтаксическую неоднозначность.
- source_word: ζῴων
  choice: живых существ
  rationale: В контексте небесного престола речь идёт об особых живых существах, а не об обычных животных.
- source_word: πρεσβυτέρων
  choice: старейшин
  rationale: Передаёт обозначение признанной небесной группы и звучит естественнее для современного русского текста, чем архаичное «старцев».
- source_word: ἀρνίον
  choice: Агнца
  rationale: Сохраняет утвердившийся сакрально-мессианский образ и жертвенную символику, не внося уменьшительного оттенка.
- source_word: ἑστηκὸς
  choice: стоящего
  rationale: Передаёт состояние Агнца, который стоит; причастная конструкция сохраняет зрительную цельность греческой фразы.
- source_word: ὡς ἐσφαγμένον
  choice: словно закланного
  rationale: «Словно» передаёт сравнительное ὡς, а «закланного» сохраняет насильственный и жертвенный оттенок σφάζω и результат завершённого действия.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: У Него было семь рогов и семь глаз
  rationale: Естественная русская конструкция сохраняет буквальные апокалиптические образы, не подменяя их толкованием.
- source_word: οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: это семь духов Божьих
  rationale: Относит пояснение прежде всего к ближайшему antecedent — семи глазам — и сохраняет формулировку греческого текста без доктринального перефразирования.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: посланных по всей земле
  rationale: Передаёт пассивное причастие множественного числа и пространственный охват выражения εἰς πᾶσαν τὴν γῆν естественным русским оборотом.
theological_decisions:
- issue: К чему относится выражение «это семь духов Божьих»
  choice: Пояснение грамматически связано прежде всего с семью глазами.
  alternative: Возможно более широкое отнесение к рогам и глазам вместе.
  rationale: Ближайшим и наиболее связным предшествующим образом являются «семь глаз»; при этом перевод не добавляет толкования сверх текста.
- issue: Смысл выражения «семь духов Божьих»
  choice: Сохранена буквальная формулировка во множественном числе.
  alternative: «Семикратный Дух Божий» или «Дух Божий в семикратной полноте».
  rationale: Греческий текст прямо говорит о семи духах Бога; спорную богословскую символику не следует молча сводить к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, уместной для апокалиптического видения. «Агнец» и «закланный» сохранены ради жертвенно-мессианской образности; синтаксис слегка упрощён после первой фразы для ясности. Все сноски отмечены в основном тексте.
