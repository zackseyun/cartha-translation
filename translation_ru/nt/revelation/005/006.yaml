  to: И я увидел посреди престола и четырёх живых существ и посреди старейшин Агнца, стоящего, словно закланного[a], с семью рогами и семью глазами; эти глаза — семь духов Божьих[b], посланных на всю землю.
  rationale: Правка сохраняет образный и синтаксический строй исходного текста, но заменяет прошедшее «было» на описательную конструкцию, соответствующую ἔχων, и уточняет направительное значение εἰς. «Эти глаза» делает в русском языке явной связь пояснительной части с ближайшим предшествующим словосочетанием «семью глазами», при этом не исключая символической многослойности видения.
