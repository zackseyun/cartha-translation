  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: ru
  text: 'И я увидел[a] и услышал голос многих ангелов вокруг престола, живых существ и старейшин; число их было: мириады мириад и тысячи тысяч[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я взглянул».'
    reason: lexical_alternative
  - marker: b
    text: Мириада — десять тысяч; это выражение передаёт необозримое множество.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: я увидел
  rationale: Обычное повествовательное значение ὁράω; сохраняет формулу видения. В контексте возможно также «я взглянул», что отмечено в сноске.
- source_word: ἤκουσα
  choice: услышал
  rationale: Прямой и естественный эквивалент аориста ἀκούω в повествовании.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: голос множества ангелов
  rationale: Единственное число φωνή передаёт их совокупное звучание; «множество» естественно выражает πολλῶν и согласуется с последующим описанием неисчислимого числа.
- source_word: κύκλῳ
  choice: вокруг
  rationale: Кратко и точно передаёт пространственное расположение участников видения.
- source_word: ζῴων
  choice: живых существ
  rationale: Сохраняет особое обозначение четырёх существ в Откровении и не создаёт ассоциации с обычными животными.
- source_word: πρεσβυτέρων
  choice: старейшин
  rationale: Современный литературный эквивалент πρεσβύτεροι в сценах небесного престола.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: число их было
  rationale: Сохраняет явное указание греческого текста на число, оставаясь естественным по-русски.
- source_word: μυριάδες μυριάδων
  choice: десятки тысяч десятков тысяч
  rationale: Передаёт числовое значение μυριάς и намеренную повторность выражения, не превращая образ в точное арифметическое количество.
- source_word: χιλιάδες χιλιάδων
  choice: тысячи тысяч
  rationale: Формально сохраняет повторную числовую конструкцию и её торжественный библейский ритм.
theological_decisions:
- issue: Обозначение апокалиптических существ (ζῷα)
  choice: живые существа
  alternative: животные; живые создания
  rationale: Выбор сохраняет особую идентичность четырёх существ в Откровении, не сводя их к обычным животным и не добавляя догматического истолкования.
- issue: Характер огромного числа ангелов
  choice: сохранена образная числовая формула
  alternative: бесчисленное множество; сто миллионов и многие тысячи
  rationale: Греческая формула выражает необозримое множество, но перевод не должен молча превращать её ни в абстрактное «бесчисленное», ни в вычисленную точную сумму.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом, уместным для небесной сцены. Порядок групп после «вокруг» сохранён близко к греческому; новое предложение облегчает восприятие длинной конструкции. Все сноски отмечены в основном тексте.
