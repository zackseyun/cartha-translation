  verdict: revise
  source_fidelity: 'Основной синтаксис и все ключевые элементы греческого текста переданы верно: Иоанн видит и слышит, ангелы находятся вокруг престола, живых существ и старейшин, а их число выражено удвоенными числовыми формулами. Однако «десятки тысяч десятков тысяч» в современном русском звучит тяжеловесно и менее точно воспроизводит намеренно повторённую формулу μυριάδες μυριάδων.'
