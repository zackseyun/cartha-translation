revisions:
- from: И когда он взял свиток, четыре живых существа и двадцать четыре старца пали перед Агнцем. У каждого были кифара[a] и золотые чаши, полные благовоний; эти чаши — молитвы святых[b].
  to: И когда он взял свиток, четыре живых существа и двадцать четыре старца пали перед Агнцем; каждый держал кифару[a] и золотые чаши, полные благовоний, которые и есть молитвы святых[b].
  rationale: Правка делает русский синтаксис более плавным и точнее передаёт распределительное ἕκαστος через «каждый держал». Относительное предложение оставлено как прямое отождествление, соответствующее αἵ εἰσιν, при этом «которые» согласуется с «чашами», как в греческом. Сноска b приведена в соответствие с её функцией как лексической альтернативы. Значение текста не изменено.
