source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: ru
  text: И когда он взял свиток, четыре живых существа и двадцать четыре старца пали перед Агнцем; каждый держал кифару[a] и золотые чаши, полные благовоний, которые и есть молитвы святых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арфа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посвящённых Богу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον
  choice: свиток
  rationale: В сцене Откровения имеется в виду древний письменный документ, вероятнее всего свиток, а не книга в современном переплёте.
- source_word: ζῷα
  choice: живые существа
  rationale: Так передаётся обозначение небесных существ у престола без уничижительного оттенка слова «звери».
- source_word: πρεσβύτεροι
  choice: старцы
  rationale: Традиционное и естественное для апокалиптической сцены обозначение двадцати четырёх небесных старейшин; оно не вводит позднейшую церковную должность.
- source_word: ἐνώπιον τοῦ ἀρνίου
  choice: перед Агнцем
  rationale: Кратко передаёт пространственный и почтительный смысл выражения; «Агнец» сохраняет христологический титул Откровения.
- source_word: ἔχοντες ἕκαστος
  choice: у каждого были
  rationale: Передаёт распределительное значение ἕκαστος и естественно связывает перечисленные предметы с каждым участником.
- source_word: κιθάραν
  choice: кифара
  rationale: «Кифара» точнее называет древний струнный инструмент, хотя более привычным библейским соответствием может быть «арфа».
- source_word: φιάλας χρυσᾶς
  choice: золотые чаши
  rationale: φιάλη — широкая неглубокая чаша; «чаши» понятнее современному читателю, чем архаические или неточные варианты.
- source_word: γεμούσας θυμιαμάτων
  choice: полные благовоний
  rationale: Передаёт содержимое как ароматическое вещество для воскурения, сохраняя возвышенный, но понятный регистр.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: эти чаши — молитвы святых
  rationale: Женское множественное αἵ грамматически соотносится с φιάλας («чаши»), а прямая связка сохраняет сильное символическое отождествление исходного текста.
theological_decisions:
- issue: Символическое отождествление чаш с молитвами
  choice: «эти чаши — молитвы святых»
  alternative: «благовония — это молитвы святых» / «чаши символизируют молитвы святых»
  rationale: Греческое αἵ по роду и числу относится к «чашам», а εἰσιν выражает прямое отождествление. Перевод не ослабляет его пояснением «символизируют» и не переносит грамматическую связь исключительно на благовония.
- issue: Значение τῶν ἁγίων
  choice: «святых»
  alternative: «освящённых» / «святого народа»
  rationale: «Святые» — точное и устойчивое обозначение посвящённого Богу народа; оно не должно пониматься как ограничение позднее канонизированными лицами.
- issue: Референт подразумеваемого подлежащего ἔλαβεν
  choice: «он» со строчной буквы
  alternative: «Он» / повтор «Агнец»
  rationale: Подлежащее восстанавливается из контекста как Агнец. Строчная буква избегает внесения в перевод отсутствующей в греческом тексте конфессиональной типографской маркировки, тогда как титул «Агнец» сохраняется с прописной.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис разделён на два предложения ради ясности; точка не меняет логической связи. Маркеры сносок поставлены непосредственно после слов, к которым относятся.
