id: REV.5.12
reference: Revelation 5:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: ru
  text: 'Они говорили громким голосом:


    «Достоин Агнец, Который был заклан[a],

    принять силу, богатство, мудрость,

    могущество[b], честь, славу и благословение[c]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Который был убит». Греческое слово описывает насильственное умерщвление и может звучать более резко; «заклан» также сохраняет жертвенный образ Агнца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крепость». Здесь выбрано слово «могущество», чтобы отличить его от стоящего ранее слова «сила».'
    reason: lexical_alternative
  - marker: c
    text: В контексте славословия греческое слово может также означать «хвалу».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Они говорили
  rationale: Причастие настоящего времени связано с множеством из предыдущего стиха. В русском самостоятельном стихе личная форма естественнее, при этом сохраняется продолжающееся совместное возглашение.
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Конкретно передаёт дательный образа действия и сохраняет торжественную звуковую картину.
- source_word: Ἄξιόν ἐστιν
  choice: Достоин
  rationale: Начальная позиция сказуемого сохраняет греческое смысловое выделение и гимнический строй.
- source_word: τὸ ἀρνίον
  choice: Агнец
  rationale: Устоявшееся русское наименование Христа в Откровении; прописная буква указывает на титульное употребление.
- source_word: τὸ ἐσφαγμένον
  choice: Который был заклан
  rationale: Передаёт перфектное страдательное причастие и сохраняет образ насильственной, жертвенной смерти, не уточняя её богословский механизм.
- source_word: λαβεῖν
  choice: принять
  rationale: В контексте славословия речь идёт о принятии перечисляемых даров и почестей; «принять» естественнее, чем более волевое «взять».
- source_word: δύναμιν
  choice: силу
  rationale: Основное и ясное соответствие δύναμις; отличается от последующего ἰσχύς посредством выбора «могущество».
- source_word: πλοῦτον
  choice: богатство
  rationale: Точно и современно передаёт πλοῦτος как полноту достояния и ресурсов.
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямое и устойчивое соответствие.
- source_word: ἰσχὺν
  choice: могущество
  rationale: Сохраняет отличие от δύναμις («сила») и подходит торжественному перечислению.
- source_word: τιμὴν
  choice: честь
  rationale: Передаёт воздаваемое почтение и признание достоинства.
- source_word: δόξαν
  choice: славу
  rationale: Устоявшееся соответствие в контексте поклонения.
- source_word: εὐλογίαν
  choice: благословение
  rationale: Сохраняет основное значение εὐλογία и параллель с последующим славословием, хотя в данном контексте возможно значение «хвала».
theological_decisions:
- issue: Христологический титул и прописная буква
  choice: Агнец
  alternative: агнец
  rationale: В контексте Откровения это титульное обозначение Иисуса; прописная буква обозначает референта, не добавляя отдельного вероучительного утверждения.
- issue: Язык смерти Агнца
  choice: Который был заклан
  alternative: Который был убит
  rationale: «Заклан» сохраняет связь образа Агнца с жертвенной смертью и возвышенный строй гимна, но не определяет конкретную теорию искупления.
- issue: Значение εὐλογία в славословии
  choice: благословение
  alternative: хвала
  rationale: Основное значение слова сохранено в тексте, а контекстуально возможное значение отмечено в сноске, чтобы не устранять семантическую неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным гимническим ритмом. Архаизирующий элемент «заклан» сохранён намеренно как понятный библейский термин, поддерживающий образ Агнца; его общеупотребительный эквивалент дан в сноске. Семичленное перечисление и различие между δύναμις и ἰσχύς сохранены.
