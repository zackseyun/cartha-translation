  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: ru
  text: 'И четыре живых существа говорили: «Аминь». И старейшины пали и поклонились[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях после слова «поклонились» прямо назван объект поклонения — например, «Живущему во веки веков» или «Ему». Основной текст следует более краткому чтению SBLGNT, где объект подразумевается из контекста.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: живые существа
  rationale: В Откровении речь идёт о небесных существах у престола, а не просто о животных; этот перевод также сохраняет связь с видением престола у Иезекииля.
- source_word: ἔλεγον
  choice: говорили
  rationale: Форма имперфекта передаёт продолжающееся или повторяющееся действие; русское «говорили» сохраняет эту аспектуальную открытость без излишнего уточнения.
- source_word: Ἀμήν
  choice: Аминь
  rationale: Устоявшаяся литургическая формула передаётся традиционной транслитерацией.
- source_word: πρεσβύτεροι
  choice: старейшины
  rationale: Здесь это обозначение определённой небесной группы, а не просто указание на возраст; «старейшины» понятно современному читателю и передаёт функцию наименования.
- source_word: ἔπεσαν
  choice: пали
  rationale: Глагол передаёт телесное действие, предшествующее поклонению; краткое «пали» сохраняет торжественный регистр.
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: В сцене у небесного престола слово обозначает благоговейное поклонение; русский глагол естественно сочетает телесный жест и религиозный смысл.
theological_decisions:
- issue: Неуказанный объект поклонения
  choice: Сохранить абсолютное «поклонились», не добавляя объекта.
  alternative: «поклонились Ему», «поклонились Богу» или «поклонились Живущему во веки веков»
  rationale: В тексте SBLGNT после προσεκύνησαν прямой объект отсутствует. Его добавление разрешило бы оставленную греческим текстом контекстуальную неопределённость либо внесло бы чтение из других рукописей.
translation_notes:
  register: Современный литературный русский язык с торжественной простотой, уместной для сцены небесного поклонения. Повтор союза «И» сохраняет последовательный ритм греческого текста. Маркер сноски помещён после «поклонились», поскольку примечание относится к отсутствующему объекту этого глагола.
