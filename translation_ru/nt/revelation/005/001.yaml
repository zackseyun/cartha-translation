base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: ru
  text: И увидел я в правой руке сидящего на престоле свиток, написанный изнутри и с обратной стороны[a], запечатанный семью печатями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «написанный изнутри и сзади». Вероятно, речь идет о внутренней и обратной стороне свитка; возможно также более общее понимание: «изнутри и снаружи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: увидел я
  rationale: Аорист ὁράω передан простым глаголом прошедшего времени; порядок слов сохраняет торжественный повествовательный ритм, оставаясь естественным для русского языка.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: в правой руке
  rationale: Хотя ἐπί с винительным может буквально обозначать положение «на», здесь по-русски естественно передать нахождение предмета в руке; это не меняет зрительного образа сцены.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Сидящего на престоле
  rationale: Субстантивированное причастие передано без добавления имени или титула, чтобы сохранить описательный способ обозначения небесной фигуры в греческом тексте.
- source_word: βιβλίον
  choice: свиток
  rationale: В данном образе предмет, исписанный с двух сторон и запечатанный, вероятнее всего является свитком; этот выбор также соответствует материальной культуре эпохи.
- source_word: γεγραμμένον
  choice: исписанный
  rationale: Перфектное страдательное причастие обозначает сохраняющийся результат письма. «Исписанный» естественно выражает наличие текста на обеих сторонах предмета.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: изнутри и с обратной стороны
  rationale: Передача сохраняет физический образ текста на внутренней и обратной сторонах свитка. «С обратной стороны» точнее и естественнее буквального «сзади».
- source_word: κατεσφραγισμένον
  choice: запечатанный
  rationale: Русское страдательное причастие передаёт завершённое действие и наличное состояние свитка; отдельная передача усилительного оттенка приставки κατα- не требуется.
- source_word: σφραγῖσιν ἑπτά
  choice: семью печатями
  rationale: Творительный падеж естественно передаёт инструментальный дательный греческого текста.
theological_decisions:
- issue: Обозначение фигуры на престоле
  choice: Сидящего на престоле
  alternative: Того, Кто сидел на престоле
  rationale: Греческий текст обозначает фигуру описательно, не называя её прямо. Перевод не вносит в стих явного имени или дополнительного богословского отождествления.
- issue: Характер предмета βιβλίον
  choice: свиток
  alternative: книга
  rationale: Выбор основан на историко-материальном контексте и образе текста с двух сторон, а не на богословском истолковании содержания свитка.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом. Причастные конструкции сохраняют плотность и образность оригинала; архаизмы и конфессионально маркированные добавления исключены.
