source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: ru
  text: 'И один из старейшин говорит мне: «Не плачь. Вот, Лев из колена Иуды, Корень Давида, одержал победу[a], чтобы раскрыть свиток и снять семь его печатей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «победил», «одолел». Греческий глагол — одно из ключевых обозначений победы в Откровении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «раскрыть свиток и семь его печатей». По-русски о печатях естественнее сказать «снять» или «вскрыть».'
    reason: translation_clarity
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: старейшин
  rationale: В Откровении это обозначение определённой небесной группы, а не просто пожилых мужчин.
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого текста, придающее повествованию непосредственность.
- source_word: Μὴ κλαῖε
  choice: Не плачь
  rationale: Естественная современная русская передача торжественного запрета; контекст показывает, что плач уже происходит.
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественный русский указательный возглас, привлекающий внимание без излишне архаического оттенка.
- source_word: ἐνίκησεν
  choice: одержал победу
  rationale: Передаёт совершившуюся победу и сохраняет важный для Откровения мотив νικάω — побеждать, одолевать.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: Лев из колена Иуды
  rationale: Предлог «из» непосредственно передаёт ἐκ и сохраняет мессианский титул.
- source_word: ἡ ῥίζα Δαυίδ
  choice: Корень Давида
  rationale: Сохранён образный мессианский титул и его связь с ветхозаветной пророческой речью.
- source_word: ἀνοῖξαι
  choice: чтобы раскрыть
  rationale: Русский целевой инфинитив после «одержал победу» звучал бы неестественно; конструкция сохраняет связь победы с последующим раскрытием свитка, не добавляя прямо идеи способности или достоинства.
- source_word: τὸ βιβλίον
  choice: свиток
  rationale: В данном описании имеется в виду запечатанный письменный свиток, а не книга-кодекс.
- source_word: τὰς ἑπτὰ σφραγῖδας αὐτοῦ
  choice: снять семь его печатей
  rationale: По-русски печати на свитке естественно «снимают» или «вскрывают»; местоимение «его» относится к свитку.
theological_decisions:
- issue: Мессианские царские титулы
  choice: 'Сохранены оба титула: «Лев из колена Иуды» и «Корень Давида».'
  alternative: Передать титулы пояснительными перифразами.
  rationale: Нагромождение библейских титулов намеренно и несёт христологическую нагрузку; пояснительная замена ослабила бы межтекстовые связи.
- issue: Синтаксическая сила ἀνοῖξαι после ἐνίκησεν
  choice: «одержал победу, чтобы раскрыть»
  alternative: «одержал победу и может раскрыть» или более буквально «победил — раскрыть»
  rationale: Формулировка сохраняет неоднозначность инфинитива между целью и результатом и не вводит отсутствующих в стихе слов о способности или достоинстве.
- issue: Действие над свитком и печатями
  choice: «раскрыть свиток и снять семь его печатей»
  alternative: «открыть свиток и семь его печатей»
  rationale: В русском языке печать обычно не «открывают», поэтому употреблены разные естественные глаголы без изменения последовательности или богословского смысла.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаичным звучанием. Заглавные буквы в «Лев» и «Корень» отмечают титульное употребление. «Старейшины» сохраняют устойчивое обозначение небесной группы в Откровении.
