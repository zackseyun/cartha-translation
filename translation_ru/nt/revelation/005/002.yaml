  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: ru
  text: 'И увидел я могучего ангела, возглашавшего громким голосом: «Кто достоин раскрыть свиток[a] и снять с него печати?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «книгу». Греческое слово βιβλίον может обозначать письменный документ вообще, однако в этой сцене образу предмета с несколькими печатями лучше соответствует свиток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: могучего ангела
  rationale: ἰσχυρός указывает на силу и могущество; «могучий» естественно звучит применительно к небесному существу и сохраняет выразительность оригинала.
- source_word: κηρύσσοντα
  choice: возглашавшего
  rationale: κηρύσσω означает публично и властно провозглашать. «Возглашавшего» передаёт торжественный характер объявления и согласуется с указанием на громкий голос.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Греческий оборот обозначает громкую, хорошо слышимую речь; это естественный русский эквивалент.
- source_word: Τίς ἄξιος
  choice: Кто достоин
  rationale: ἄξιος выражает достоинство или соответствие для исполнения особой задачи. «Достоин» сохраняет как прямой смысл, так и богословскую весомость вопроса.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: раскрыть свиток
  rationale: В данной сцене βιβλίον обозначает запечатанный письменный документ, вероятнее всего свиток. Глагол «раскрыть» естественно описывает разворачивание свитка.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: снять с него печати
  rationale: λύω буквально означает развязать, освободить или устранить. В сочетании с печатями речь идёт об их снятии, которое делает возможным раскрытие свитка; формулировка сохраняет различие между снятием печатей и раскрытием самого свитка.
theological_decisions:
- issue: Передача βιβλίον в видении небесного престола
  choice: свиток
  alternative: книга
  rationale: Предмет запечатан несколькими печатями, и исторический контекст вместе с образностью отрывка лучше согласуется со свитком. Это лексико-историческое решение, не предполагающее отдельного доктринального толкования.
- issue: Связь достоинства с двумя действиями
  choice: 'сохранить единый вопрос: «раскрыть свиток и снять с него печати»'
  alternative: переформулировать так, будто снятие печатей лишь поясняет раскрытие
  rationale: Греческий текст соединяет два инфинитива союзом καί. Перевод сохраняет оба действия и не устраняет их риторическое и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Инверсия «И увидел я» сохраняет повествовательную возвышенность апокалиптического видения, не прибегая к архаичным формам.
