  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: ru
  text: И он пришёл и взял свиток[a] из правой руки сидящего на престоле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте прямое дополнение не выражено; из предыдущего контекста ясно, что речь идёт о свитке.
    reason: Отмечает сделанное ради ясности контекстуальное восполнение и сохраняет прозрачность по отношению к форме оригинала.
lexical_decisions:
- source_word: ἦλθεν
  choice: пришёл
  rationale: Аорист ἔρχομαι описывает движение Агнца к сидящему на престоле. «Пришёл» прямо передаёт глагол, тогда как «подошёл» несколько усилило бы значение приближения.
- source_word: εἴληφεν
  choice: взял свиток
  rationale: Перфект λαμβάνω в последовательном повествовании о видении естественно передаётся русским прошедшим видом «взял». Назван подразумеваемый объект — свиток из ближайшего контекста; «получил» слабее передавало бы непосредственность действия.
- source_word: ἐκ
  choice: из
  rationale: Предлог указывает на источник, откуда был взят свиток. В сочетании с рукой естественно русское «из правой руки».
- source_word: τῆς δεξιᾶς
  choice: правой руки
  rationale: Субстантивированное δεξιά здесь обозначает правую руку, а не правую сторону, сохраняя конкретный образ видения.
- source_word: τοῦ καθημένου
  choice: сидящего
  rationale: Субстантивированное причастие настоящего времени передано причастием «сидящего», которое сохраняет описательный характер греческого выражения и не вводит дополнительного наименования.
- source_word: ἐπὶ τοῦ θρόνου
  choice: на престоле
  rationale: Передано обычное местное значение ἐπί; «на престоле» звучит естественно и торжественно без архаизации.
theological_decisions:
- issue: Подразумеваемое прямое дополнение при εἴληφεν
  choice: В основном тексте добавлено «свиток», относящееся к свитку из непосредственного контекста.
  alternative: 'Оставить объект невыраженным: «пришёл и взял из правой руки…»; либо употребить местоимение «его».'
  rationale: В греческом объект понятен из контекста и опущен. В русском отсутствие дополнения здесь звучало бы незавершённо, а существительное «свиток» яснее местоимения и не добавляет нового участника или предмета.
- issue: Обозначение сидящего на престоле
  choice: «сидящего на престоле» без поясняющего имени и без прописной буквы.
  alternative: «Сидящего на престоле» или «Того, кто сидит на престоле».
  rationale: Так сохраняется различие между Агнцем и фигурой на престоле, но не вносится отсутствующее в стихе богословское наименование. Строчная буква следует нейтральной современной орфографической подаче.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Сохранён повтор союза «и», отражающий последовательность καὶ… καὶ. Избегаются архаические обороты и конфессионально обусловленная капитализация.
