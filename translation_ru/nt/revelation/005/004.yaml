id: REV.5.4
reference: Revelation 5:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: ru
  text: И я много плакал, потому что не нашлось никого достойного открыть свиток[a] или посмотреть на него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «книгу». Греческое слово βιβλίον может означать и книгу, и свиток; в этой сцене образу лучше соответствует свиток.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «заглянуть в него», то есть увидеть его содержимое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: И я
  rationale: Сохраняет повествовательную связь καί и выраженное местоимение ἐγώ без искусственного усиления.
- source_word: ἔκλαιον
  choice: плакал
  rationale: Русский несовершенный вид естественно передаёт продолженное действие греческого имперфекта.
- source_word: πολὺ
  choice: много
  rationale: Передаёт степень плача без добавления не выраженных в греческом оттенков громкости или горечи.
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: не нашлось никого достойного
  rationale: Естественная русская конструкция сохраняет отрицание, смысл достоинства и отсутствие найденного лица, не уточняя действующее лицо поиска.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: открыть свиток
  rationale: В данной сцене βιβλίον обозначает свиток; инфинитив прямо передаёт требуемое действие.
- source_word: οὔτε βλέπειν αὐτό
  choice: или посмотреть на него
  rationale: После общего отрицания русское «или» естественно передаёт οὔτε; «посмотреть на него» ближе к обычному значению βλέπειν αὐτό и сохраняет возможность контекстуального понимания как ознакомления с содержанием.
theological_decisions:
- issue: Смысл ἄξιος в небесной сцене
  choice: достойного
  alternative: способного; пригодного
  rationale: «Достойного» сохраняет нравственный и статусный вес слова, не сводя его к технической способности.
- issue: Предмет, обозначенный βιβλίον
  choice: свиток
  alternative: книга
  rationale: Образ запечатанного и открываемого предмета в древнем контексте лучше соответствует свитку, хотя само греческое слово допускает более общее «книга».
- issue: Значение βλέπειν αὐτό
  choice: посмотреть на него
  alternative: заглянуть в него
  rationale: Основной текст не делает однозначным вывод, что речь именно о чтении содержимого; более широкое толкование отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка ясна обычному читателю; несовершенный вид передаёт длительность плача, а сноски сохраняют подлинную лексическую неоднозначность.
