language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: ru
  text: 'И я услышал, как каждое создание[a] на небе, на земле, под землёй и на море — всё, что в них, — говорило: «Сидящему на престоле и Агнцу — благословение, честь, слава и могущество во веки веков[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё сотворённое».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в века веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: всякое творение
  rationale: κτίσμα означает сотворённое существо или нечто сотворённое. «Всякое творение» сохраняет распределительное значение πᾶν, универсальный охват и способность участников сцены произносить хвалу; более вещественное «всё сотворённое» дано в сноске.
- source_word: ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς θαλάσσης, καὶ τὰ ἐν αὐτοῖς πάντα
  choice: на небе, на земле, под землёй и на море — всё, что в них
  rationale: Перечень охватывает все области мироздания. «На небе» соответствует космическому контексту Откровения, а «всё, что в них» передаёт совокупную отсылку αὐτοῖς ко всем названным областям.
- source_word: ἤκουσα λέγοντας
  choice: я услышал, как ... говорило
  rationale: Русская конструкция с «как» естественно передаёт восприятие звучащей речи. Единственное число «говорило» грамматически согласовано с собирательным «всякое творение», тогда как греческое причастие мужского рода во множественном числе согласуется по смыслу с множеством одушевлённых участников.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Сидящему на престоле
  rationale: Субстантивированное причастие передано краткой и торжественной русской формой, сохраняющей образ непрерывного царственного восседания.
- source_word: τῷ ἀρνίῳ
  choice: Агнцу
  rationale: «Агнец» — укоренившееся в русском библейском языке христологическое наименование, сохраняющее жертвенный и царственный образ Откровения.
- source_word: ἡ εὐλογία
  choice: благословение
  rationale: В славословии εὐλογία обозначает воздаваемое благословение; русский эквивалент прозрачен и сохраняет литургическую окраску.
- source_word: ἡ τιμή
  choice: честь
  rationale: «Честь» точно передаёт воздаваемое почитание в славословной формуле.
- source_word: ἡ δόξα
  choice: слава
  rationale: «Слава» является естественным и устойчивым соответствием δόξα в контексте поклонения.
- source_word: τὸ κράτος
  choice: могущество
  rationale: κράτος обозначает проявленную силу и властное могущество. «Могущество» понятно современному читателю и не сужает значение исключительно до юридической власти.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивая русская формула естественно выражает бесконечную продолжительность и близко отражает образную структуру греческого выражения.
theological_decisions:
- issue: Единое славословие Богу на престоле и Агнцу
  choice: 'Сохранить одно общее перечисление: «Сидящему на престоле и Агнцу — благословение, честь, слава и могущество»'
  alternative: Разделить славословие или повторить связку при каждом адресате
  rationale: Греческий текст совместно обращает единое славословие к обоим адресатам и не поясняет богословское соотношение между ними. Перевод сохраняет этот параллелизм и напряжение без добавочного толкования.
- issue: Объём значения κτίσμα в сцене всеобщей хвалы
  choice: всякое творение
  alternative: всё творение; всё сотворённое; всякое существо
  rationale: Форма подчёркивает каждого участника всеохватной хвалы, не ограничивая круг только людьми или животными и не превращая выражение в отвлечённое понятие «творение» как целое.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены традиционные и общепонятные формы «Агнец», «престол» и «во веки веков»; синтаксис сделан естественным для современного чтения. Тире выделяют вставное всеохватное уточнение и бессвязочную формулу славословия.
