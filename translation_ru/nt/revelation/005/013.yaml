    rationale: 'Текст сноски «Буквально: “в веки веков”» по существу повторяет основное «во веки веков». «В века веков» отражает греческую форму τοὺς αἰῶνας τῶν αἰώνων и даёт читателю действительную буквальную подсказку.'
