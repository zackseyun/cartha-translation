  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: ru
  text: И сделал их царством и священниками для нашего Бога,[a] и они царствуют на земле.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «царями» вместо «царством».'
    reason: textual_variant
  - marker: b
    text: 'В некоторых рукописях: «будут царствовать» вместо «царствуют».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: сделал
  rationale: Аорист действительного залога передан естественным русским прошедшим временем; подразумеваемое подлежащее «ты» ясно из личной формы глагола и контекста песнопения.
- source_word: αὐτοὺς
  choice: их
  rationale: Прямое соответствие винительному падежу множественного числа; местоимение указывает на искупленных из предыдущего стиха.
- source_word: τῷ θεῷ ἡμῶν
  choice: для нашего Бога
  rationale: Дательный падеж здесь естественно выражает предназначение или принадлежность; «для нашего Бога» ясно и не сужает смысл до одного лишь владения.
- source_word: βασιλείαν
  choice: царством
  rationale: 'Передаёт единственное число и собирательный смысл принятого текста: искупленные образуют царство.'
- source_word: ἱερεῖς
  choice: священниками
  rationale: Обычное и точное соответствие греческому существительному; сохраняет связь с Исходом 19:6 и Откровением 1:6.
- source_word: βασιλεύουσιν
  choice: царствуют
  rationale: В представленном тексте SBLGNT стоит форма настоящего времени, поэтому основной текст сохраняет настоящее время, не превращая его в эсхатологическое будущее.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Прямое и естественное соответствие ἐπί с родительным; вариант «над землёй» сильнее подчёркивал бы власть, чем требует сама конструкция.
theological_decisions:
- issue: Искупленные как βασιλείαν
  choice: царством
  alternative: царями
  rationale: В принятом греческом тексте стоит βασιλείαν («царство»), а не βασιλεῖς («цари»). Альтернативное чтение отмечено в сноске без подмены основного текста.
- issue: Время царствования искупленных
  choice: они царствуют
  alternative: они будут царствовать
  rationale: Форма βασιλεύουσιν в предоставленном греческом тексте является настоящим временем. Будущее чтение засвидетельствовано в рукописной традиции и отмечено в сноске, чтобы не разрешать текстологическую и богословскую напряжённость без основания.
translation_notes:
  register: Современный литературный русский язык с достоинством гимнической речи. Порядок слов «для нашего Бога царством и священниками» позволяет отнести дательный оборот к обоим именным дополнениям и избежать неестественного «царство нашему Богу». Настоящее время следует непосредственно предоставленному тексту SBLGNT; сведения английского консультационного слоя о будущем времени исправлены по греческой форме.
