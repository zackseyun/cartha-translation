base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: ru
  text: И никто ни на небе, ни на земле, ни под землёй не мог ни открыть свиток, ни взглянуть на него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «книгу». Греческое слово может обозначать письменный документ вообще, но в этой сцене древнему образу лучше соответствует «свиток».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: никто
  rationale: Естественное и точное соответствие отрицательному местоимению, сохраняющее всеобщий охват.
- source_word: ἐδύνατο
  choice: не мог
  rationale: Имперфект δύναμαι в повествовательном контексте передаёт отсутствие способности; по-русски «не мог» звучит естественнее, чем более тяжеловесное «не был в состоянии».
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: Обычное русское обозначение небесной сферы; предлог «на» здесь идиоматичен.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Точно передаёт местонахождение и сохраняет трёхчастную космическую картину.
- source_word: ὑποκάτω τῆς γῆς
  choice: под землёй
  rationale: Прямое пространственное соответствие, сохраняющее апокалиптическую триаду.
- source_word: ἀνοῖξαι
  choice: открыть
  rationale: Прямое соответствие инфинитиву без ненужного расширения смысла.
- source_word: τὸ βιβλίον
  choice: свиток
  rationale: В данной сцене βιβλίον обозначает письменный свиток; этот вариант лучше соответствует древнему предметному образу, чем современная книга-кодекс.
- source_word: οὔτε βλέπειν αὐτό
  choice: или посмотреть на него
  rationale: Сохраняет второй однородный инфинитив под общим отрицанием. Частица «даже» не добавлена, поскольку в греческом тексте она прямо не выражена.
theological_decisions:
- issue: Всеобщий охват неспособных открыть свиток
  choice: 'Сохранить трёхчастное пространственное перечисление: «ни на небе, ни на земле, ни под землёй».'
  alternative: Обобщить как «нигде во всём творении».
  rationale: Буквенное сохранение космической триады передаёт универсальность неспособности и не сглаживает апокалиптическую образность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной синтаксической формой. Повтор «ни» естественно передаёт отрицательный всеобщий охват; лексическая неоднозначность βιβλίον сохранена в сноске.
