source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: ru
  text: 'И они поют новую песнь, говоря:


    «Ты достоин взять свиток

    и вскрыть его печати,

    потому что Ты был заклан

    и Своей кровью[c] приобрёл для Бога[a] людей[b]

    из всякого племени, языка, народа и народности[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Богу». Греческий дательный τῷ θεῷ допускает обе передачи.'
    reason: lexical_alternative
  - marker: b
    text: Слово «людей» подразумевается по смыслу, но прямо в данном греческом тексте не выражено.
    reason: textual_grammar_note
  - marker: c
    text: 'Возможна передача: «ценой Своей крови».'
    reason: lexical_alternative
  - marker: d
    text: Греч. «из всякого племени, языка, народа и народности». Четырёхчастная формула подчёркивает всемирный охват приобретённых.
    reason: cultural_note
lexical_decisions:
- source_word: ᾄδουσιν
  choice: они поют
  rationale: Настоящее время передано живым повествовательным настоящим; добавлять значение хвалы, прямо не выраженное глаголом, не требуется.
- source_word: ᾠδὴν καινὴν
  choice: новую песнь
  rationale: «Песнь» сохраняет возвышенный поэтический регистр и узнаваемый библейский мотив, оставаясь понятным современному читателю.
- source_word: Ἄξιος εἶ
  choice: Ты достоин
  rationale: Естественная современная формулировка прямого славословия без искусственной инверсии.
- source_word: τὸ βιβλίον
  choice: свиток
  rationale: В контексте речь идёт о запечатанном древнем письменном свитке, а не о книге современного кодексного типа.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: вскрыть его печати
  rationale: Русское «вскрыть печати» естественно обозначает открытие запечатанного документа и близко передаёт греческое выражение; «сорвать печати» было бы несколько более толковательным.
- source_word: ἐσφάγης
  choice: Ты был заклан
  rationale: «Заклан» сохраняет одновременно насильственный и жертвенный оттенок σφάζω, особенно существенный в образе Агнца; нейтральное «убит» этот оттенок ослабляет.
- source_word: ἠγόρασας
  choice: приобрёл
  rationale: Передаёт основное значение покупки, но по-русски звучит естественнее, чем буквальное «купил», применённое к людям. «Искупил» сильнее вводило бы богословское истолкование.
- source_word: τῷ θεῷ
  choice: для Бога
  rationale: Передаёт дательный как указание на того, для кого совершено приобретение; более буквальное «Богу» сохранено в примечании.
- source_word: ἐν τῷ αἵματί σου
  choice: Своей кровью
  rationale: Русский творительный естественно выражает средство или цену приобретения и сохраняет конкретный образ крови.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: из всякого племени, языка, народа и нации
  rationale: Сохранена четырёхчастная формула и повторяющееся значение ἐκ πάσης без сглаживания её выразительной структуры.
theological_decisions:
- issue: В греческом тексте отсутствует явно выраженное прямое дополнение при ἠγόρασας
  choice: В основном тексте восполнено «людей», а отсутствие слова в греческом отмечено в сноске.
  alternative: 'Оставить дополнение невыраженным: «приобрёл для Бога из всякого племени…»'
  rationale: Русское предложение обычно требует прямого дополнения. Контекст ясно указывает на людей, однако сноска не скрывает грамматическую неполноту исходной формулировки и не приписывает греческому тексту отсутствующее существительное.
- issue: Смысл ἐν τῷ αἵματί σου
  choice: 'Сохранён конкретный образ: «Своей кровью».'
  alternative: 'Истолковать шире: «Своей смертью» или «ценой Своей жизни».'
  rationale: Источник прямо говорит о крови Агнца. Перевод не заменяет этот жертвенный образ разъясняющей богословской формулой.
- issue: Значение дательного τῷ θεῷ
  choice: «для Бога»
  alternative: «Богу»
  rationale: Оба варианта грамматически возможны. Основной вариант яснее выражает принадлежность приобретённых Богу, а сноска сохраняет более формальное соответствие греческому дательному.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром, уместным для небесной песни. «Песнь» и «заклан» сохраняют торжественный и жертвенный оттенок, но синтаксис остаётся ясным. Местоимение «Ты» написано с прописной буквы как принятое в русском религиозном обращении; это регистровое, а не толковательное решение.
