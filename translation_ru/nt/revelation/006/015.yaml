base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: ru
  text: И цари земли, и вельможи, и военачальники, и богатые, и сильные — все, и рабы, и свободные[a], скрылись в пещерах и среди горных скал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякий раб и свободный». Формы мужского рода в единственном числе имеют здесь обобщающее значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: цари земли
  rationale: В космическом контексте суда в Откровении γῆ указывает на землю в широком смысле; выражение также соответствует повторяющейся формуле книги.
- source_word: μεγιστᾶνες
  choice: вельможи
  rationale: Слово обозначает высокопоставленных и влиятельных людей; «вельможи» естественно и ёмко передаёт социальный статус, не сводя его строго к наследственной знати.
- source_word: χιλίαρχοι
  choice: военачальники
  rationale: Хотя буквально речь идёт о начальниках над тысячей, в данном перечне важен общий смысл высокого военного командования; «военачальники» ясно передаёт его современному читателю.
- source_word: πλούσιοι
  choice: богатые
  rationale: Субстантивированное прилагательное прямо и естественно передаётся как название социальной группы.
- source_word: ἰσχυροί
  choice: сильные
  rationale: Выбор сохраняет основное значение физической силы или могущества и не сливает эту группу с уже названными высокопоставленными лицами.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: всякий раб и свободный
  rationale: Противопоставление раба свободному делает подневольный статус δοῦλος явным. Мужские формы единственного числа имеют обобщающее значение; это пояснено в сноске.
- source_word: ἔκρυψαν ἑαυτούς
  choice: скрылись
  rationale: Русский возвратный глагол естественно и точно передаёт действие, направленное на самих действующих лиц.
- source_word: εἰς τὰ σπήλαια
  choice: в пещерах
  rationale: После глагола «скрылись» русский предложный оборот естественно выражает достигнутое место укрытия, хотя εἰς также допускает оттенок движения внутрь.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: среди горных скал
  rationale: Оборот передаёт укрытие в скальных образованиях гор и звучит естественнее буквального «в скалы».
theological_decisions:
- issue: Передача δοῦλος в паре «раб — свободный»
  choice: раб
  alternative: слуга
  rationale: Прямое противопоставление ἐλεύθερος подчёркивает юридический и социальный статус несвободы, поэтому «раб» точнее, чем «слуга».
- issue: Обобщающее значение мужских форм πᾶς δοῦλος καὶ ἐλεύθερος
  choice: всякий раб и свободный с пояснительной сноской
  alternative: все — и рабы, и свободные
  rationale: Основной текст сохраняет грамматическую форму и ритм греческого перечня, а сноска предотвращает ошибочное ограничение смысла только мужчинами.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом перечисления. Повтор союза «и» сохранён как выразительная особенность греческого текста. Термины понятны обычному читателю и не привносят конфессионально обусловленных толкований.
