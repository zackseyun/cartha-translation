    rationale: В греческом ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς обозначает лиц, с которых взыскивается возмездие. Русское «отомстишь живущим на земле за нашу кровь» допустимо, но может читаться менее прозрачно; «взыщешь за нашу кровь с живущих на земле» прямо передаёт эту связь.
  - severity: low
