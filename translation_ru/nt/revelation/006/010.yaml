  verdict: revise
  source_fidelity: 'В целом смысл передан верно: κρίνω и ἐκδικέω сохранены как просьба о Божьем суде и воздаянии, а «живущие на земле» воспроизводит устойчивую формулу Откровения. Однако «отомстишь живущим на земле за нашу кровь» синтаксически возможно, но менее ясно передаёт ἐκ τῶν κατοικούντων — тех, с кого взыскивается возмездие. Формула «взыщешь ... с» точнее отражает направление действия.'
  naturalness: «Громко воззвали», «доколе» и «Владыка» уместны в современном литературном русском с библейски возвышенной интонацией. «Совершишь суда» и «взыщешь за нашу кровь с живущих на земле» звучат естественно и яснее, чем сочетание «отомстишь живущим ... за нашу кровь».
  terminology: «Владыка» удачно передаёт δεσπότης, не смешивая его с обычным соответствием κύριος («Господь»). «Святой и истинный» верно. «Взыскать ... с» сохраняет судебно-воздаятельный, а не частно-мстительный характер ἐκδικέω.
