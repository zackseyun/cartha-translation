id: REV.6.10
reference: Revelation 6:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: ru
  text: 'И они громко воззвали: «Доколе, Владыка[a], святой и истинный, Ты не совершишь суда и не взыщешь за нашу кровь с живущих на земле?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господин». Греческое δεσπότης подчёркивает безусловную власть и отличается от κύριος, обычно переводимого как «Господь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «…не отомстишь живущим на земле за нашу кровь». Греческий предлог может указывать на тех, с кого взыскивается возмездие; выражение «живущие на земле» неоднократно употребляется в Откровении как особое обозначение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: громко воззвали
  rationale: Передаёт громкий, настойчивый крик; глагол «воззвали» уместен для торжественной молитвенной речи, а наречие естественно выражает греческий дательный образа действия.
- source_word: Ἕως πότε
  choice: доколе
  rationale: Естественная для возвышенной русской речи формула скорбного вопроса о задержке ожидаемого действия.
- source_word: δεσπότης
  choice: Владыка
  rationale: Передаёт верховную власть и сохраняет отличие δεσπότης от обычного титула κύριος («Господь»).
- source_word: ἅγιος καὶ ἀληθινός
  choice: святой и истинный
  rationale: Прямо сохраняет оба определения Бога, включая значения святости, подлинности и верности.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: Ты не совершишь суд и не отомстишь
  rationale: В вопросе с «доколе» формы настоящего времени указывают на ожидаемое, но откладываемое действие. Русское будущее звучит естественно; «отомстишь» сохраняет сильный смысл справедливого воздаяния, не смягчая его до одного лишь оправдания.
- source_word: τὸ αἷμα ἡμῶν
  choice: за нашу кровь
  rationale: Сохраняет библейский образ крови как обозначения насильственной смерти и основания для воздаяния.
- source_word: τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: живущим на земле
  rationale: Сохраняет повторяющееся в Откровении обозначение людей, живущих на земле, не заменяя его обобщающим существительным.
theological_decisions:
- issue: Передача обращения δεσπότης
  choice: Владыка
  alternative: Господь; верховный Владыка
  rationale: «Владыка» естественно выражает безусловную власть и не стирает лексическое отличие от κύριος; добавление «верховный» излишне разъясняло бы текст.
- issue: Характер просьбы мучеников о правосудии
  choice: совершишь суд и отомстишь ... за нашу кровь
  alternative: осудишь и взыщешь за нашу кровь; рассудишь и оправдаешь нас
  rationale: Греческий текст прямо соединяет суд с возмездием за пролитую кровь. Сильная формулировка сохранена как обращённая к Божьему правосудию просьба, без смягчения или дополнительного богословского объяснения.
- issue: Временная форма в вопросе οὐ κρίνεις καὶ ἐκδικεῖς
  choice: будущее совершенного вида в конструкции «доколе ... не»
  alternative: 'настоящее время: «не судишь и не мстишь»'
  rationale: Греческое настоящее находится в вопросе о том, как долго действие будет откладываться. Русская конструкция с будущим совершенного вида естественно передаёт ожидание решающего суда, не утверждая иной хронологии.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Воззвали», «доколе» и «Владыка» сохраняют достоинство апокалиптической сцены, оставаясь понятными современному читателю. Порядок слов в обращении следует греческой последовательности и сохраняет торжественное присоединение определений «святой и истинный».
