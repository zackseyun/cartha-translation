review_pass:
  verdict: revise
  source_fidelity: «Снял третью печать», «третье живое существо», «я увидел — и вот» и «сидящий на нём ... в руке» в целом точно передают греческий текст. Однако «Иди» обычно означает движение от говорящего и в русском звучит как обращение, отправляющее адресата прочь; оно хуже сохраняет значение Ἔρχου и его неуказанный адресат. «Приди» точнее передаёт призыв приблизиться/явиться и позволяет сохранить намеренную неоднозначность.
  naturalness: Текст в целом литературен и ясен. «Вороной конь» — естественное и точное обозначение чёрной масти; в апокалиптическом повествовании оно уместно. «Приди» несколько возвышенно, но соответствует регистру Откровения и не является непонятной архаикой.
  terminology: '«Живое существо» удачно отличает ζῷον от обычного животного. «Весы» верно передаёт ζυγός в данном контексте. Формулировка сноски о весах нуждается в небольшой правке: основное значение в контексте — именно весы/весовой прибор, тогда как «ярмо» является лексической альтернативой; «коромысло весов» как отдельная альтернатива излишне конкретизирует значение.'
