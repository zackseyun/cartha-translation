source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: ru
  text: 'И когда Он снял третью печать, я услышал, как третье живое существо сказало: «Приди».[a] И я увидел — и вот, вороной конь, а сидящий на нём держал в руке весы.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подойди». Повеление можно понимать как обращённое к Иоанну либо как призыв коню и сидящему на нём явиться.'
    reason: alternative_reading
  - marker: b
    text: Греческое слово может означать также «ярмо»; здесь, судя по следующему стиху, имеются в виду весы для отвешивания продовольствия.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: снял
  rationale: В сочетании с печатью русское «снять печать» естественно передаёт её открытие, не добавляя идеи разрушения.
- source_word: σφραγῖδα τὴν τρίτην
  choice: третью печать
  rationale: Прямо сохраняет последовательность печатей в видении.
- source_word: ζῴου
  choice: живое существо
  rationale: Передаёт обозначение небесного существа у престола и не смешивает его с обычным животным.
- source_word: Ἔρχου
  choice: Иди
  rationale: Краткий повелительный глагол без названного адресата. В данном повествовании естественно звучит как призыв появиться или выступить; неоднозначность адресата отмечена в сноске.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: я увидел — и вот
  rationale: Сохраняет оба элемента греческой зрительной формулы и её внезапную, выразительную подачу.
- source_word: ἵππος μέλας
  choice: вороной конь
  rationale: «Вороной» — современное и точное русское обозначение чёрной масти коня; оно естественнее сочетания «чёрный конь».
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: сидящий на нём
  rationale: Близко передаёт греческую причастную конструкцию, не заменяя её толкующим существительным «всадник».
- source_word: ζυγὸν
  choice: весы
  rationale: В контексте следующего стиха слово обозначает весы для отмеривания продовольствия, хотя само по себе может означать также ярмо или коромысло весов.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: в руке
  rationale: Естественная русская передача; принадлежность руки субъекту ясна из контекста.
theological_decisions:
- issue: Адресат повеления Ἔρχου
  choice: 'Адресат в основном тексте не назван: «Иди».'
  alternative: Повеление может быть обращено к Иоанну («Подойди») либо призывать коня и сидящего на нём выступить.
  rationale: В греческом тексте адресат не выражен, поэтому перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Формула «я увидел — и вот» сохраняет зрительную выразительность оригинала; «вороной конь» употреблено как общеупотребительное обозначение чёрной конской масти.
