source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: ru
  text: И когда Он открыл пятую печать, я увидел под жертвенником души тех, кто был заклан[a] за слово Божье и за свидетельство[b], которое они имели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был убит». Слово «заклан» точнее сохраняет более сильный, жертвенный оттенок греческого глагола.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свидетельствование». Греческое слово может обозначать как данное свидетельство, так и само свидетельствование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: открыл
  rationale: Обычный и естественный эквивалент ἀνοίγω в повторяющейся сцене снятия печатей.
- source_word: σφραγῖδα
  choice: печать
  rationale: Точный традиционный эквивалент, сохраняющий апокалиптический образ.
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: под жертвенником
  rationale: Передаёт пространственное значение ὑποκάτω и культовое значение θυσιαστήριον, не уточняя сверх текста, небесный это жертвенник или земной.
- source_word: ψυχὰς
  choice: души
  rationale: Сохраняет конкретный образ видения умерших под жертвенником и не заменяет его более расплывчатыми «жизни» или «люди».
- source_word: ἐσφαγμένων
  choice: был заклан
  rationale: «Заклан» передаёт насильственный характер σφάζω и его жертвенный оттенок, особенно значимый рядом с образом жертвенника.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: за слово Божье
  rationale: 'Кратко и естественно передаёт причинное διά с винительным падежом: они были убиты из-за верности слову Бога.'
- source_word: μαρτυρίαν
  choice: свидетельство
  rationale: Сохраняет возможный смысл как содержания свидетельства, так и свидетельствования; альтернативное значение отмечено в сноске.
- source_word: ἣν εἶχον
  choice: которое они несли
  rationale: По-русски сочетание «нести свидетельство» естественнее буквального «имели свидетельство» и без лишней конкретизации выражает устойчивое обладание и исповедание свидетельства.
theological_decisions:
- issue: Смысл ψυχὰς в образе видения
  choice: «души» в основном тексте
  alternative: «жизни» или «люди»
  rationale: «Души» сохраняет образ мучеников, увиденных после смерти, но само по себе не превращает данный образ в исчерпывающее антропологическое учение.
- issue: Сила и жертвенный оттенок ἐσφαγμένων
  choice: «был заклан»
  alternative: «был убит» или «был умерщвлён»
  rationale: Выбор сохраняет связь насильственной смерти мучеников с жертвенником и жертвенной образностью Откровения, не утверждая сверх текста, что они являются искупительной жертвой.
- issue: Значение μαρτυρία
  choice: «свидетельство»
  alternative: «свидетельствование»
  rationale: Греческое слово допускает акцент как на содержании свидетельства, так и на самом свидетельствовании; основной текст и сноска сохраняют эту смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Жертвенник» и «заклан» сохранены ради культовой и жертвенной образности; синтаксис сделан естественным для современного читателя. Все сноски отмечены в основном тексте.
