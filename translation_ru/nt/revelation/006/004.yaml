source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: ru
  text: И вышел другой конь, огненно-красный[a]; сидящему на нём было дано лишить землю мира[b], чтобы люди закалывали друг друга[c]; и дан был ему большой меч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красный конь». Греческое πυρρός точнее обозначает огненно-красный, подобный огню цвет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страны» или «суши». Греческое γῆ может означать землю вообще, страну или сушу; здесь сохранено более широкое значение.'
    reason: lexical_alternative
  - marker: c
    text: Греческий глагол σφάζω сильнее общего слова «убивать» и обозначает насильственное заклание, кровавую расправу.
    reason: lexical_nuance
lexical_decisions:
- source_word: ἄλλος
  choice: другой
  rationale: В последовательности видения обозначает следующего коня, отличного от предыдущего; «другой» естественно передаёт это значение.
- source_word: ἵππος πυρρός
  choice: конь, огненно-красный
  rationale: πυρρός обозначает огненно-красный цвет; перевод сохраняет образ огня и звучит естественно по-русски.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: сидящему на нём
  rationale: Сохраняет причастную конструкцию оригинала, не заменяя её более истолковывающим словом «всадник».
- source_word: ἐδόθη αὐτῷ
  choice: ему было дано / дан был ему
  rationale: Безлично-пассивная формулировка сохраняет повтор оригинала и не называет подразумеваемого дающего.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: отнять мир у земли
  rationale: «Отнять» естественно передаёт λαβεῖν в сочетании с ἐκ, а «земля» сохраняет широкий и при этом неоднозначный смысл γῆ.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: чтобы люди убивали друг друга
  rationale: Неопределённое «люди» естественно восполняет подразумеваемый субъект множественного числа. «Убивали» читается естественнее буквального «закалывали», тогда как оттенок жестокого кровопролития отмечен в сноске.
- source_word: μάχαιρα μεγάλη
  choice: большой меч
  rationale: «Меч» ясно передаёт апокалиптический образ μάχαιρα, а «большой» сохраняет прямое значение μεγάλη без лишнего истолкования.
theological_decisions:
- issue: Пассивная форма в повторяющихся ἐδόθη
  choice: Сохранить «было дано / дан был», не называя Бога
  alternative: «Бог дал ему» или «ему была дана власть»
  rationale: Оригинал оставляет дающего не названным. Пассив сохраняет подразумеваемое верховное дозволение и не устраняет богословскую напряжённость.
- issue: Значение ἵνα после отнятия мира
  choice: Передать целевым оборотом «чтобы»
  alternative: Результативное «так что»
  rationale: ἵνα допускает оттенки цели и результата; «чтобы» формально сохраняет целевую конструкцию, не уточняя, кому именно принадлежит намерение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Сохранены параллелизм двух пассивных форм и повтор «ему»; порядок последней части слегка отмечен для передачи торжественного ритма оригинала.
