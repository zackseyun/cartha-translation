  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: ru
  text: 'И когда Он снял четвёртую печать, я услышал голос четвёртого живого существа: «Приди!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Иди!» или «Выступи!» Греческое слово буквально означает «приди»; толкователи расходятся во мнении, обращено ли повеление к Иоанну или к всаднику.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: снял
  rationale: В контексте печатей на свитке естественное русское выражение — «снять печать»; оно передаёт открытие печати без подразумеваемого разрушения.
- source_word: σφραγῖδα
  choice: печать
  rationale: Устоявшееся и точное обозначение печати, запирающей свиток в Откровении 6.
- source_word: τετάρτην / τετάρτου
  choice: четвёртую / четвёртого
  rationale: Оба порядковых числительных переданы последовательно с необходимым согласованием по роду и падежу.
- source_word: φωνὴν
  choice: голос
  rationale: Родительный оборот «четвёртого живого существа» ясно определяет, чей именно голос слышит Иоанн.
- source_word: ζῴου
  choice: живого существа
  rationale: Передаёт особое обозначение престольных существ и не смешивает ζῷον со θηρίον, то есть «зверем».
- source_word: λέγοντος
  choice: говорившего
  rationale: Причастная конструкция близко отражает греческий оборот и естественно связывается со словом «существа».
- source_word: Ἔρχου
  choice: Иди!
  rationale: Русское «иди» может обозначать движение как к говорящему, так и для выступления вперёд, поэтому в данном контексте лучше сохраняет неопределённость адресата и направления, чем более однозначное «приди».
theological_decisions:
- issue: Адресат повеления Ἔρχου
  choice: 'Передать кратко: «Иди!», не называя адресата.'
  alternative: «Приди!» — с возможным пониманием как обращения к Иоанну либо к всаднику.
  rationale: Греческий текст не называет адресата. Краткое повеление сохраняет повествовательную и богословскую неоднозначность, не решая, обращено ли оно к Иоанну или к всаднику.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной лаконичности апокалиптического повествования. Местоимение «Он» написано с прописной буквы как указание на Агнца в непосредственном контексте.
