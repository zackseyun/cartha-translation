source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: ru
  text: 'И я увидел, как Агнец вскрыл одну из семи печатей, и услышал, как одно из четырёх живых существ произнесло голосом, подобным грому: «Приди!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иди!» или «Выступи!», если повеление обращено к всаднику, а не к Иоанну.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: Агнец
  rationale: В Откровении это устойчивый христологический титул; «Агнец» сохраняет его библейскую узнаваемость и не вносит буквального уменьшительного оттенка формы.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: одну из семи печатей
  rationale: Естественно передаёт партитивную конструкцию и женский род согласуемого числительного.
- source_word: ἤνοιξεν ... σφραγίδων
  choice: снял ... печатей
  rationale: По-русски печать обычно «снимают» или «вскрывают»; «снял печать» естественно обозначает действие, открывающее запечатанное, и не меняет образ.
- source_word: ζῴων
  choice: живых существ
  rationale: Речь идёт о небесных существах у престола, а не об обычных животных; этот вариант точен и понятен современному читателю.
- source_word: ὡς φωνῇ βροντῆς
  choice: голосом, подобным грому
  rationale: Сохраняет явное сравнение голоса с громом и звучит достойно и естественно.
- source_word: Ἔρχου
  choice: Иди
  rationale: Русское «иди» может передавать обращённое к всаднику повеление явиться или выступить, не добавляя объекта или направления; возможное «приди» сохранено в примечании из-за неуказанного адресата.
- source_word: ὅτε
  choice: как
  rationale: В конструкции «увидел, как» естественно передаёт временно-событийную связь, не превращая её в значение «после».
- source_word: εἶδον
  choice: я увидел
  rationale: Прямо передаёт аорист повествовательного глагола без добавления отсутствующего в греческом действия «посмотрел».
- source_word: ἤκουσα
  choice: услышал
  rationale: Стандартная и естественная передача повествовательного аориста ἀκούω.
- source_word: λέγοντος
  choice: произнесло
  rationale: По-русски при указании на мощный голос это естественнее буквального «говорившее», при этом не усиливает высказывание до «закричало».
theological_decisions:
- issue: Адресат и направленность повеления Ἔρχου
  choice: 'В основном тексте: «Иди!» без названного адресата.'
  alternative: «Приди!», если повеление обращено к Иоанну; также возможно понимание как приказа всаднику выступить.
  rationale: Греческий императив не называет адресата. Контекст допускает обращение к всаднику, однако форма сама по себе обычно означает «иди/приходи». Основной текст не уточняет адресата, а примечание сохраняет альтернативную направленность повеления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Титул «Агнец» сохранён ради точности и узнаваемости; синтаксис сделан естественным для повествования. Маркер [a] помещён непосредственно после спорного повеления.
