base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: ru
  text: 'И я увидел: вот белый конь, и у сидящего на нём[b] был лук. Ему был дан венец[a], и он вышел, побеждая и чтобы победить.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «венец победителя». Греческое στέφανος часто означает венок или венец, связанный с победой, а не царскую диадему.'
    reason: lexical_alternative
  - marker: b
    text: В тексте не сказано, кто сидит на белом коне. Толкования этой фигуры существенно различаются.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: εἶδον
  choice: я увидел
  rationale: Обычное и точное соответствие аористу ὁράω в повествовании о видении; в русском сочетание с последующим «вот» звучит естественнее, чем «я посмотрел».
- source_word: ἰδοὺ
  choice: вот
  rationale: Передаёт указательно-восклицательную силу частицы и живость видения без излишне архаичного «се».
- source_word: ἵππος λευκός
  choice: белый конь
  rationale: Прямо передаёт греческое словосочетание; «конь» естественно для всаднического и торжественного образа.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: сидящий на нём
  rationale: Сохраняет субстантивированное причастие и не добавляет отсутствующего в тексте обозначения «всадник».
- source_word: ἔχων τόξον
  choice: держал лук
  rationale: В данном зрительном описании естественно передаёт причастие ἔχων и ясно обозначает находившийся у него предмет.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: ему был дан венец
  rationale: Сохраняет страдательную конструкцию и не уточняет источник действия. «Венец» передаёт στέφανος как наградной или почётный венок, не смешивая его с царской диадемой.
- source_word: ἐξῆλθεν
  choice: он вышел
  rationale: Прямо передаёт движение, выраженное ἐξέρχομαι, не уточняя не названную исходную точку.
- source_word: νικῶν
  choice: побеждая
  rationale: Деепричастие сохраняет одновременное, разворачивающееся действие настоящего причастия и повтор того же корня в следующей форме.
- source_word: ἵνα νικήσῃ
  choice: чтобы победить
  rationale: Естественно передаёт целевую силу ἵνα с конъюнктивом, сохраняя напряжение между продолжающимся завоеванием и его целью.
theological_decisions:
- issue: Личность сидящего на белом коне
  choice: Перевод не устанавливает, кто он.
  alternative: Христос или подобная Христу фигура; завоеватель либо имперская власть; антихрист или обманчивый завоеватель.
  rationale: Греческий текст описывает фигуру и её действия, но не называет её; отождествление в переводе устранило бы намеренно сохранённую текстом неопределённость.
- issue: Характер венца
  choice: «Венец» без уточняющего определения.
  alternative: «Венец победителя» или «победный венок».
  rationale: στέφανος часто связан с победой, однако само существительное здесь не содержит явного определения; основное чтение сохраняет образ без чрезмерного истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией, подходящей апокалиптическому видению. «Вот» сохраняет живость оригинала без архаизации; паратаксис и повтор корня «побеждая — победить» удерживают риторику греческого текста.
