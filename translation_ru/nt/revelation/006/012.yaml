  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: ru
  text: 'И я увидел, как Он открыл шестую печать: произошло великое землетрясение, солнце стало чёрным, как грубая волосяная ткань[a], и вся луна стала как кровь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как власяница» — грубая ткань из животного волоса, традиционно связанная с трауром.'
    reason: Лексическая альтернатива и краткое пояснение древней реалии σάκκος τρίχινος.
lexical_decisions:
- source_word: εἶδον
  choice: я увидел
  rationale: Аорист ὁράω вводит очередное видение Иоанна; это естественная и точная формула повествования.
- source_word: ὅτε ἤνοιξεν
  choice: как Он открыл
  rationale: Передаёт временную связь событий естественным русским оборотом. Местоимение «Он» сохраняет подразумеваемого деятеля из контекста и не добавляет его имени.
- source_word: τὴν σφραγῖδα τὴν ἕκτην
  choice: шестую печать
  rationale: Прямой и устоявшийся русский эквивалент существительного с порядковым числительным.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: произошло великое землетрясение
  rationale: σεισμός здесь естественно означает землетрясение; «великое» сохраняет возвышенный апокалиптический регистр μέγας.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: солнце стало чёрным
  rationale: μέλας означает именно «чёрный», а не просто «тёмный»; «стало» сохраняет событийное значение ἐγένετο.
- source_word: ὡς σάκκος τρίχινος
  choice: как грубая ткань из волоса
  rationale: Передаёт σάκκος как грубую ткань и τρίχινος как указание на материал, не уточняя вид животного, которого греческий текст не называет.
- source_word: ἡ σελήνη ὅλη
  choice: вся луна
  rationale: Явно сохраняет усиление ὅλη и звучит естественно по-русски.
- source_word: ἐγένετο ὡς αἷμα
  choice: стала как кровь
  rationale: Союз «как» сохраняет сравнительный характер ὡς и не превращает образ в утверждение о буквальном превращении луны в кровь.
theological_decisions:
- issue: Характер космических знамений
  choice: Передать увиденные явления прямо, сохранив образные сравнения.
  alternative: Истолковать их либо как исключительно буквальную астрономическую катастрофу, либо как исключительно символическое изображение суда и политических потрясений.
  rationale: Греческий текст описывает видение и использует сравнения «как», но сам не разрешает более широкий спор о буквальном и символическом смысле знамений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор «стало» и последовательность апокалиптических образов; архаичное слово «власяница» вынесено в примечание.
