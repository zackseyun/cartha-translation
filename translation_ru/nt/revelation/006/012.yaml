  source_fidelity: 'Смысл в целом передан точно: сохранены временная связь, шестая печать, великое землетрясение, чёрное солнце и сравнительный характер образа луны («как кровь»). Однако «грубая ткань из волоса» звучит несколько неестественно по-русски; «волосяная ткань» точнее передаёт τρίχινος как характеристику материала. В примечании не следует добавлять «покаяние»: исходный текст и английская аудиторская помета говорят о трауре, но не требуют такого расширения.'
