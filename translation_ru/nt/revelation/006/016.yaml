source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: ru
  text: 'И говорят горам и скалам: «Падите на нас и скройте нас от лица[a] Сидящего на престоле и от гнева Агнца»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от присутствия Сидящего на престоле».'
    reason: Лексически ἀπὸ προσώπου может обозначать как удаление «от лица», так и удаление «от присутствия» кого-либо.
lexical_decisions:
- source_word: λέγουσιν
  choice: говорят
  rationale: Настоящее время сохраняет характерное для апокалиптического повествования живое настоящее и непосредственность сцены.
- source_word: ὄρεσιν
  choice: горам
  rationale: ὄρος обычно означает гору; это соответствие точно передаёт масштаб образа.
- source_word: πέτραις
  choice: скалам
  rationale: πέτρα обозначает скалу, каменную глыбу или скальный массив; «скалам» естественно сочетается с обращением к горам и лучше передаёт массивное укрытие, чем отдельные «камни».
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Падите на нас
  rationale: Аористный императив во множественном числе выражает прямой и настойчивый призыв; сочетание с ἐπί и винительным передано буквально и естественно.
- source_word: κρύψατε ἡμᾶς
  choice: скройте нас
  rationale: Прямо и ясно передаёт повелительную форму и просьбу укрыть говорящих от взора или присутствия Судьи.
- source_word: ἀπὸ προσώπου
  choice: от лица
  rationale: Буквальное значение πρόσωπον сохраняет яркий личностный образ встречи с Богом; контекстуальное значение «от присутствия» отмечено в сноске.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Сидящего на престоле
  rationale: Субстантивированное причастие передано русским причастным оборотом, сохраняющим продолжающееся положение Восседающего; прописная буква указывает на титульное употребление в контексте.
- source_word: ὀργῆς
  choice: гнева
  rationale: В контексте суда «гнев» передаёт силу и эсхатологическую серьёзность ὀργή, не сводя его к мимолётной эмоции.
- source_word: τοῦ ἀρνίου
  choice: Агнца
  rationale: «Агнец» — устоявшееся и узнаваемое в русском христианском языке наименование Христа в Откровении; оно сохраняет связь с жертвенным образом и его парадоксальное сочетание с гневом.
theological_decisions:
- issue: Два соотнесённых носителя эсхатологического суда
  choice: Сохранены как отдельные, но соединённые выражения «Сидящего на престоле» и «Агнца».
  alternative: Обобщить их в единое упоминание Бога или смягчить выражение «гнев Агнца».
  rationale: 'Греческий текст координирует два зависимых от ἀπό оборота: один относится к Сидящему на престоле, другой — к Агнцу. Перевод сохраняет различение и напряжённый образ Агнца, связанного одновременно с жертвой и эсхатологическим гневом.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической тональностью. Сохранены традиционные и широко понятные библейские слова «престол» и «Агнец». Структура оставлена незавершённой запятой, поскольку стих синтаксически продолжается в Откр. 6:17.
