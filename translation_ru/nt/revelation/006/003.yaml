  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: ru
  text: 'И когда Он открыл вторую печать, я услышал, как второе живое существо сказало: «Приди!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иди!» Некоторые понимают это повеление как обращённое к всаднику, а не как призыв приблизиться.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Сохраняет повествовательную связь с предыдущим стихом и естественно звучит по-русски.
- source_word: ὅτε
  choice: когда
  rationale: Передаёт временное придаточное и последовательность событий без добавочного толкования.
- source_word: ἤνοιξεν
  choice: Он открыл
  rationale: ἀνοίγω прямо означает «открывать»; заглавная буква у местоимения соответствует принятому русскому библейскому оформлению при указании на Христа.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: вторую печать
  rationale: Естественный русский порядок слов, точно сохраняющий порядковое определение.
- source_word: ἤκουσα
  choice: я услышал
  rationale: Прямая и естественная передача повествовательного аориста ἀκούω.
- source_word: τοῦ δευτέρου ζῴου
  choice: второе живое существо
  rationale: В Откровении ζῷον обозначает живых существ у престола, а не обычных животных; этот вариант ясен и не создаёт ложной ассоциации со зверями.
- source_word: λέγοντος
  choice: как … сказало
  rationale: Естественно передаёт зависимое причастие в русском синтаксисе; совершенный вид уместен для единичной реплики в повествовании.
- source_word: Ἔρχου
  choice: Иди!
  rationale: Русское «иди» может в зависимости от точки отсчёта передавать побуждение выступить или приблизиться. Оно естественнее при обращении к выходящему всаднику, но прямое значение «Приди!» сохранено в примечании.
theological_decisions:
- issue: Передача повеления Ἔρχου и определение его адресата
  choice: Иди!
  alternative: Приди!
  rationale: Контекст допускает понимание повеления как обращения к всаднику с приказом выступить, тогда как обычное лексическое значение Ἔρχου — «Приди!». Основной текст даёт естественную русскую реплику в сцене выхода всадника, а примечание сохраняет подлинную неоднозначность направления и адресата.
translation_notes:
  register: Современный литературный русский язык, сжатый и торжественный без архаизмов. Конструкция «услышал, как … сказало» звучит естественнее буквального «услышал … говорящего». Местоимение «Он» написано с прописной буквы по русской библейской издательской традиции.
