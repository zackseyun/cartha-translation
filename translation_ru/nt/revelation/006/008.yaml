id: REV.6.8
reference: Revelation 6:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: ru
  text: 'И я увидел: вот, бледно-зелёный конь[a], и имя сидящего на нём — Смерть, и ад[b] следовал за ним. И дана была им власть над четвёртой частью земли — умерщвлять мечом, голодом, мором[c] и дикими зверями земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конь бледный». Греческое слово означает зелёный или бледно-зелёный цвет, здесь напоминающий болезненную, мертвенную бледность.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «ад» — царство мёртвых, а не обозначение места окончательного наказания.
    reason: semantic_clarification
  - marker: c
    text: 'Буквально: «смертью». В ветхозаветном перечне Божьих судов это слово может обозначать мор или смертоносную язву; ср. Иез. 14:21.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: бледно-зелёный
  rationale: Слово обозначает зелёный или зеленоватый цвет и в данном контексте вызывает представление о болезненной, мертвенной бледности; сочетание сохраняет и цветовой компонент, и зловещий оттенок.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: сидящий на нём
  rationale: Причастная конструкция передана близко к греческой и естественно по-русски, без замены на менее буквальное «всадник».
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: имя сидящего на нём — Смерть
  rationale: Передана явная формула именования, а прописная буква отмечает олицетворение.
- source_word: ᾅδης
  choice: ад
  rationale: В русской библейской лексике «ад» может обозначать царство мёртвых; сноска ограждает от отождествления здесь с местом окончательного наказания.
- source_word: μετ’ αὐτοῦ
  choice: за ним
  rationale: Хотя μετά с родительным обычно значит «с ним», при глаголе «следовал» естественный русский оборот «следовал за ним» точно передаёт сопровождающее движение.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: дана была им власть
  rationale: Сохранены значение делегированного полномочия и характерная для Откровения пассивная конструкция.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: над четвёртой частью земли
  rationale: Переданы как доля в одну четверть, так и широкий смысл γῆ в контексте суда.
- source_word: ἀποκτεῖναι
  choice: умерщвлять
  rationale: Глагол естественно вводит перечисление средств гибели и соответствует торжественному регистру, не становясь архаичным.
- source_word: ἐν ῥομφαίᾳ
  choice: мечом
  rationale: Творительный падеж естественно передаёт инструментальное значение греческого оборота.
- source_word: ἐν λιμῷ
  choice: голодом
  rationale: В контексте бедствий слово обозначает массовый голод, а не только субъективное чувство.
- source_word: ἐν θανάτῳ
  choice: мором
  rationale: В ветхозаветной формуле судов, особенно в перекличке с Иезекиилем 14, θάνατος может обозначать смертоносную язву или мор; буквальный вариант сохранён в сноске.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: земными зверями
  rationale: Творительный падеж передаёт действующую причину; «земные звери» сохраняет определение источника без излишнего уточнения «дикие».
theological_decisions:
- issue: Значение ᾅδης
  choice: ад со сноской «царство мёртвых»
  alternative: царство мёртвых; преисподняя; могила
  rationale: Текст различает олицетворённую Смерть и следующую за ней область умерших. Сноска предотвращает внесение представления о месте окончательного наказания, которого сам термин здесь не требует.
- issue: Значение ἐν θανάτῳ в перечне судов
  choice: мором
  alternative: смертью
  rationale: Перевод отражает идиоматическое употребление в формуле судов, созвучной Иезекиилю 14, но буквальное значение оставлено читателю в сноске.
translation_notes:
  register: 'Современный литературный русский с торжественным, но понятным библейским ритмом. Сохранены начальное видение «И я увидел: вот», олицетворение Смерти, божественный пассив и четырёхчастный перечень бедствий. Неоднозначные χλωρός, ᾅδης и θάνατος раскрыты в сносках без догматического сужения.'
