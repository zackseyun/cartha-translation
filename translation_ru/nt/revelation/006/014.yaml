  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: ru
  text: И небо отступило[a], как свиток, который сворачивают, и каждая гора и каждый остров были сдвинуты со своих мест.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отделилось» или «удалилось». Греческий глагол может обозначать отделение либо удаление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: небо
  rationale: В русском «небо» естественно обозначает видимый небосвод и сохраняет космический характер апокалиптического образа, не вынуждая толковать речь как указание исключительно на место Божьего пребывания.
- source_word: ἀπεχωρίσθη
  choice: отступило
  rationale: Глагол передаёт отделение, удаление или отступление. «Отступило» звучит естественно по-русски и сохраняет образ удаления небосвода, не усиливая его до полного исчезновения.
- source_word: βιβλίον
  choice: свиток
  rationale: В данном историческом и образном контексте имеется в виду свиток, что подтверждается упоминанием его сворачивания; «книга» создала бы образ современного переплётного кодекса.
- source_word: ἑλισσόμενον
  choice: сворачиваемый
  rationale: Причастие обозначает сворачивание или скатывание; форма «сворачиваемый» сохраняет пассивность и одновременность образа.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: каждая гора и каждый остров
  rationale: Повторение «каждый» естественно передаёт распределительное значение πᾶν и ясно распространяет его на оба существительных.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: со своих мест
  rationale: Русское множественное выражение прямо соответствует греческому «из их мест» и относится к каждой горе и каждому острову.
- source_word: ἐκινήθησαν
  choice: были сдвинуты
  rationale: Пассивная форма сохраняет греческий залог и выражает перемещение с прежнего места, а не только сотрясение.
theological_decisions:
- issue: Космическое значение οὐρανός
  choice: Передать как «небо» в смысле видимого небосвода
  alternative: Понимать как небесную сферу или место Божьего пребывания
  rationale: Контекст описывает видимое космическое потрясение. Русское «небо» сохраняет смысловую широту слова и не вводит дополнительного догматического утверждения.
- issue: Характер действия неба
  choice: «отступило»
  alternative: «разделилось», «отделилось», «исчезло»
  rationale: Греческий глагол допускает оттенки отделения и удаления. Выбор не утверждает уничтожение неба, а сноска сохраняет реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным строем. Образ свитка передан без архаизма «книга»; пассив «были сдвинуты» сохраняет торжественный тон и грамматику источника.
