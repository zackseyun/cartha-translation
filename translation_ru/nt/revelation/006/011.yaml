id: REV.6.11
reference: Revelation 6:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: ru
  text: И каждому из них было дано белое одеяние. Им было сказано, чтобы они ещё немного отдохнули, пока не будут доведены до полноты и их товарищи по рабству, и братья[a], которым предстояло быть убитыми так же, как и они сами.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока не будут исполнены (или доведены до полноты) и их товарищи по рабству, и братья». Возможно и понимание: «пока не дополнится их полное число»; слова «число» в греческом тексте нет.'
    reason: Сохраняется неоднозначность πληρωθῶσιν и отмечается распространённое числовое понимание без внесения его в основной текст.
  - marker: b
    text: Греческое слово «братья» имеет форму мужского рода, но в раннехристианской речи могло обозначать верующих в целом, включая женщин.
    reason: Поясняется возможный широкий объём значения ἀδελφοί при сохранении формы источника в основном тексте.
lexical_decisions:
- source_word: στολὴ λευκή
  choice: белое одеяние
  rationale: στολή обозначает длинную одежду или одеяние; «белое одеяние» естественно и сохраняет торжественный образ, не уточняя покрой одежды.
- source_word: ἑκάστῳ
  choice: каждому из них
  rationale: 'Передаёт дистрибутивное значение формы единственного числа: одеяние получает каждый по отдельности.'
- source_word: ἐρρέθη αὐτοῖς
  choice: им было сказано
  rationale: Сохранён безлично-пассивный строй греческого текста без ненужного указания говорящего.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: чтобы они успокоились ещё на малое время
  rationale: ἀναπαύω здесь означает покой или прекращение страдания; «успокоились» передаёт это значение, а «ещё на малое время» сохраняет временную формулировку источника.
- source_word: πληρωθῶσιν
  choice: не будут доведены до полноты
  rationale: Формулировка сохраняет пассивное значение πληρόω и намеренно не добавляет отсутствующее в греческом тексте слово «число».
- source_word: σύνδουλοι
  choice: сорабы
  rationale: Слово обозначает рабов одного и того же господина. «Сорабы» кратко сохраняет как рабский статус, так и общность принадлежности.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохранена грамматически мужская форма источника; возможное включение женщин поясняется в сноске.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: которым предстояло быть убитыми
  rationale: Передаёт направленность к будущему в μέλλω и страдательный залог инфинитива, не усиливая выражение до явного утверждения о предопределении.
- source_word: ὡς καὶ αὐτοί
  choice: так же, как и они сами
  rationale: Ясно соотносит будущую насильственную смерть со смертью душ под жертвенником и сохраняет усилительное αὐτοί.
theological_decisions:
- issue: Значение πληρωθῶσιν применительно к сорабам и братьям мучеников
  choice: 'Сохранить общее пассивное значение: «будут доведены до полноты».'
  alternative: «пока не дополнится полное число их сорабов и братьев»
  rationale: В греческом тексте слово «число» отсутствует. Контекст допускает числовое понимание, но не требует вводить его непосредственно в основной текст; сноска сообщает о такой возможности.
- issue: Объём значения ἀδελφοί
  choice: «братья» в основном тексте с пояснением в сноске
  alternative: «братья и сёстры» или «единоверцы»
  rationale: Так сохраняется мужская форма греческого существительного без отрицания того, что в раннехристианской речи оно могло обозначать более широкий круг верующих.
- issue: Передача σύνδουλοι
  choice: «сорабы»
  alternative: «товарищи по служению» или «другие слуги»
  rationale: Образ общей принадлежности господину значим в контексте Откровения; смягчение до «служителей» устранило бы рабскую метафору источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом, соответствующим апокалиптическому повествованию. Синтаксис остаётся ясным для обычного читателя; более необычное «доведены до полноты» сознательно сохраняет смысловую открытость греческого текста и сопровождается сноской.
