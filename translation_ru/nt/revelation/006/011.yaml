revisions:
- from: И каждому из них было дано белое одеяние. Им было сказано, чтобы они успокоились ещё на малое время, пока не будут доведены до полноты также их сорабы и братья, которым предстояло быть убитыми так же, как и они сами.[a][b]
  to: И каждому из них было дано белое одеяние. Им было сказано, чтобы они ещё немного отдохнули, пока не будут доведены до полноты и их товарищи по рабству, и братья[a], которым предстояло быть убитыми так же, как и они сами.[b]
  rationale: 'Исправлены две безопасные лексико-стилистические проблемы: «успокоились» заменено на «отдохнули», а редкое «сорабы» — на прозрачное «товарищи по рабству». Синтаксис с «и ... и ...» передаёт координацию οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ αὐτῶν. Неоднозначность πληρωθῶσιν сохранена в основном тексте и раскрыта сноской; слово «число» не введено в перевод.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:34:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основные соответствия сохранены: «белое одеяние», распределительное «каждому», пассивное «им было сказано», перспективное «предстояло быть убитыми» и сравнение с уже убитыми переданы верно. Однако «успокоились» обычно значит перестали тревожиться/пришли в спокойное состояние, тогда как ἀναπαύσονται здесь говорит о продолжении покоя. «Товарищи по рабству» яснее передаёт σύνδουλοι для современного читателя, чем редкое и церковнославянизированное «сорабы».'
  naturalness: «Ещё немного отдохнули» — естественная современная передача «ещё недолгое время пребывали в покое». Формулировка «доведены до полноты» остаётся намеренно несколько необычной, поскольку отражает неуточнённый пассив πληρωθῶσιν; сноска объясняет это место. Замена «сорабы» на «товарищи по рабству» устраняет малопонятный архаизм, не смягчая образ рабской принадлежности.
  terminology: «Одеяние», «братья» и «товарищи по рабству» подходят умеренно торжественному современному библейскому регистру. «Товарищи по рабству» сохраняет δοῦλος-образ и общее подчинение одному господину, не сводя σύνδουλοι к нейтральным «сослужителям». Сноска к «братья» уместно отмечает возможный инклюзивный референт без подмены формы исходного текста.
  issues:
  - severity: medium
    issue: «Успокоились» неточно передаёт ἀναπαύσονται.
    rationale: В современном русском «успокоиться» прежде всего означает перестать волноваться или утихомириться. В данном контексте речь о том, чтобы мученики продолжали отдыхать/пребывать в покое ещё недолгое время.
  - severity: medium
    issue: «Сорабы» не соответствует требованию современного литературного русского.
    rationale: Слово редко употребительно и для многих читателей непрозрачно; оно создаёт ненужную архаизацию. «Товарищи по рабству» понятно выражает значение σύνδουλοι, не устраняя рабскую метафору.
  - severity: low
    issue: Привязку сноски о πληρωθῶσιν следует поставить непосредственно после соответствующего выражения.
    rationale: Так читателю яснее, что пояснение относится именно к «доведены до полноты», а не ко всему заключительному предложению.
