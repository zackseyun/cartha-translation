id: REV.6.17
reference: Revelation 6:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: ru
  text: потому что пришёл великий день их гнева[a], и кто может устоять?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их гнева» — то есть гнева Сидящего на престоле и Агнца вместе; в некоторых истолковывающих переводах: «Его гнева».'
    reason: Поясняет необычное множественное местоимение и отмечает распространённый истолковывающий вариант, не подменяя им исходный текст.
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Вводит причину ужаса, описанного в предыдущем стихе; это ясная и естественная причинная связка в современном русском языке.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Аорист ἔρχομαι обозначает наступление дня как уже совершившееся событие с наличными последствиями; русское прошедшее совершенного вида естественно передаёт этот смысл.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: великий день
  rationale: Сохраняет торжественный эсхатологический вес выражения и естественный русский порядок слов.
- source_word: τῆς ὀργῆς
  choice: гнева
  rationale: В контексте суда ὀργή обозначает не просто раздражение, а сильный карающий гнев; слово «гнев» сохраняет эту силу и высокий регистр.
- source_word: αὐτῶν
  choice: их
  rationale: Греческое местоимение стоит во множественном числе и отсылает к Сидящему на престоле и Агнцу из предыдущего стиха; перевод сохраняет эту грамматическую и богословскую напряжённость.
- source_word: τίς δύναται σταθῆναι
  choice: кто может устоять?
  rationale: «Устоять» естественно передаёт способность остаться стоящим и выдержать суд, не вводя излишнего пояснения в основной текст.
theological_decisions:
- issue: Множественное местоимение при слове «гнев», относящееся к Сидящему на престоле и Агнцу
  choice: Сохранить выражение «их гнева»
  alternative: Передать как «Его гнева», согласовав с представлением о едином божественном действии
  rationale: SBLGNT прямо читает αὐτῶν («их»), с отсылкой к двум названным в Откровении 6:16 лицам. Перевод не должен устранять необычную грамматическую и богословскую напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. «Устоять» выбрано вместо более буквального «стоять», поскольку в русском оно естественно выражает способность выдержать суд. Маркер [a] помещён непосредственно после спорного выражения.
