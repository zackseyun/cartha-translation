  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: ru
  text: и звёзды небесные пали на землю, как смоковница, сотрясаемая сильным ветром, сбрасывает свои незрелые смоквы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зимние», «зелёные» или «поздние смоквы»; греческое слово обозначает незрелые плоды смоковницы, которые сильный ветер срывает до созревания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες τοῦ οὐρανοῦ
  choice: звёзды небесные
  rationale: Сохраняет обычное значение ἀστέρες и возвышенный космический образ τοῦ οὐρανοῦ, не истолковывая звёзды как ангелов или правителей.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: пали на землю
  rationale: Передаёт направленное движение εἰς τὴν γῆν и соответствует достоинству апокалиптического стиля.
- source_word: συκῆ
  choice: смоковница
  rationale: Точное и укоренённое в русской библейской речи название фигового дерева, остающееся понятным современному читателю.
- source_word: βάλλει
  choice: сбрасывает
  rationale: В отношении дерева и плодов естественно передаёт βάλλει, сохраняя оттенок их резкого падения под действием ветра.
- source_word: ὀλύνθους
  choice: незрелые плоды
  rationale: Передаёт незрелость особого вида смокв, осыпающихся до созревания; слово «плоды» избегает неестественного повтора «смоковница — смоквы».
- source_word: ὑπὸ ἀνέμου μεγάλου σειομένη
  choice: сотрясаемая сильным ветром
  rationale: Сохраняет пассивное причастие и естественно передаёт силу ветра, выраженную μέγας.
theological_decisions:
- issue: Апокалиптический образ падающих звёзд
  choice: 'Сохранён буквальный образ: «звёзды небесные пали на землю».'
  alternative: Истолковать звёзды как ангельских существ, земных правителей или иные символические фигуры.
  rationale: Греческий текст даёт образ звёзд и не раскрывает его символическое соответствие в самом стихе; перевод не должен устранять эту намеренную образность и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Инверсия «звёзды небесные» и глагол «пали» поддерживают торжественность, не делая текст архаичным.
