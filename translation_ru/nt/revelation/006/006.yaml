id: REV.6.6
reference: Revelation 6:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: ru
  text: 'И услышал я как бы голос посреди четырёх живых существ, говоривший: «Мера пшеницы[a] — за динарий[b], и три меры ячменя — за динарий; а маслу и вину не причиняй вреда[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое χοῖνιξ — сухая мера объёма, примерно один литр; её часто считают приблизительным дневным количеством зерна для одного человека.
    reason: cultural_note
  - marker: b
    text: Динарий обычно составлял дневную плату наёмного работника; названные цены указывают на тяжёлую нехватку продовольствия.
    reason: cultural_note
  - marker: c
    text: 'Или: «не повреждай масла и вина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: как бы голос
  rationale: Оборот сохраняет оттенок подобия или воспринимаемого впечатления, не утверждая определённее исходного текста, кому именно принадлежал голос.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: посреди четырёх живых существ
  rationale: «Посреди» передаёт пространственное значение ἐν μέσῳ, а «живые существа» отличает престольных существ видения от враждебных зверей в последующих главах.
- source_word: λέγουσαν
  choice: говоривший
  rationale: Причастие согласуется с «голосом» и естественно вводит прямую речь.
- source_word: Χοῖνιξ / χοίνικες
  choice: мера / меры
  rationale: Общеупотребительное «мера» делает возглас понятным в основном тексте; точный древний объём и его бытовое значение поясняются в сноске.
- source_word: σίτου
  choice: пшеницы
  rationale: Передаёт конкретное значение σῖτος в противопоставлении ячменю.
- source_word: δηναρίου
  choice: за динарий
  rationale: Естественно передаёт родительный падеж цены и сохраняет историческое название монеты.
- source_word: κριθῶν
  choice: ячменя
  rationale: Прямой эквивалент κριθή в данном контексте.
- source_word: μὴ ἀδικήσῃς
  choice: не причиняй вреда
  rationale: Сохраняет широкое значение ἀδικέω — вредить, повреждать — и не сужает запрет только до физической порчи.
- source_word: τὸ ἔλαιον
  choice: маслу
  rationale: В контексте речь идёт об оливковом масле; краткое «масло» естественно для библейского контекста.
- source_word: τὸν οἶνον
  choice: вину
  rationale: Прямой и однозначный эквивалент οἶνος.
theological_decisions:
- issue: Обозначение ζῴων в престольном видении
  choice: живые существа
  alternative: звери; животные
  rationale: Такой перевод отражает их принадлежность к небесному видению и не смешивает их с враждебными «зверями» далее в Откровении.
- issue: Передача древней меры и денежной единицы
  choice: Передать χοῖνιξ словом «мера», а «динарий» сохранить и пояснить оба понятия в сносках
  alternative: Транслитерировать «хиникс»; пересчитать объём и стоимость в современные единицы
  rationale: Решение сочетает понятность с сохранением исторической среды и не создаёт ложной точности при современном пересчёте.
- issue: Характер запрета относительно масла и вина
  choice: не причиняй вреда
  alternative: не повреждай; не трогай
  rationale: Формулировка сохраняет смысловую широту ἀδικέω и не определяет точный способ вреда, которого исходный текст не уточняет.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной апокалиптической интонацией. «Как бы голос» сохраняет намеренную неопределённость; параллельные ценовые формулы оформлены кратко, как возглас.
