review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: временная связь, землетрясение, падение десятой части города, число погибших, страх остальных и воздание славы Богу небес сохранены. Однако ἀπεκτάνθησαν — пассив от «убивать»; «погибли» сглаживает выраженную в греческом формулировку «были убиты/были умерщвлены».'
  naturalness: 'Текст звучит естественно и литературно. «Пала» о части города допустимо, но «рухнула» яснее в современном русском и не вносит лишней конкретики: греческое ἔπεσεν буквально означает «пала».'
  terminology: «Богу небес» точно передаёт титул τῷ θεῷ τοῦ οὐρανοῦ и уместно в библейском регистре. «Воздали славу» корректно передаёт ἔδωκαν δόξαν. Сноска адекватно объясняет ὀνόματα ἀνθρώπων, но «учтённых погибших» добавляет оттенок учёта, который не требуется для смысла идиомы; лучше ограничиться «семь тысяч человек».
  issues:
  - severity: medium
    issue: «Погибли» вместо «были убиты»
    rationale: Греческое ἀπεκτάνθησαν — аористный пассив глагола ἀποκτείνω («убивать»). Хотя землетрясение указывает на обстоятельство смерти, нейтральное «погибли» устраняет пассивную лексику исходника. «Были убиты при землетрясении» сохраняет форму и не приписывает человеческого исполнителя.
  - severity: low
    issue: Сноска добавляет «учтённых»
    rationale: «Имена людей» является идиоматическим обозначением лиц/человек; идея учёта возможна как объяснение, но не нужна и несколько расширяет текст. Более нейтральное пояснение точнее.
