revisions:
- from: И в тот час произошло сильное землетрясение, и десятая часть города пала. При землетрясении погибли семь тысяч человек[a], а остальные пришли в ужас и воздали славу Богу небес.
  to: И в тот час произошло сильное землетрясение, и десятая часть города рухнула. При землетрясении были убиты семь тысяч человек[a], а остальные пришли в ужас и воздали славу Богу небес.
  rationale: Исправление сохраняет современный литературный стиль и последовательность событий, но точнее передаёт пассивный глагол ἀπεκτάνθησαν. «Рухнула» естественно передаёт ἔπεσεν в отношении части города, не уточняя механизм разрушения. Сноска упрощена, чтобы пояснять идиому без дополнительного смыслового оттенка. Богословская неоднозначность реакции остальных сохранена.
