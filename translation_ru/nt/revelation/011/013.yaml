  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: ru
  text: И в тот час произошло сильное землетрясение, и десятая часть города рухнула. При землетрясении были убиты семь тысяч человек[a], а остальные пришли в ужас и воздали славу Богу небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имён человеческих — семь тысяч»; необычный оборот означает семь тысяч человек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: в тот час
  rationale: Сохраняет образную временную точность и непосредственность греческого выражения; «в то время» было бы естественно, но менее выразительно.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: произошло сильное землетрясение
  rationale: Естественная русская событийная конструкция; «сильное» точно передаёт μέγας применительно к землетрясению без архаичного оттенка.
- source_word: τὸ δέκατον τῆς πόλεως ἔπεσεν
  choice: десятая часть города пала
  rationale: Сохраняет числовую точность и буквальную неопределённость глагола ἔπεσεν, не уточняя без необходимости характер разрушения словом «обрушилась».
- source_word: ἀπεκτάνθησαν
  choice: погибли
  rationale: В контексте землетрясения это естественная современная русская формулировка результата; она не предполагает человеческого исполнителя, хотя греческая пассивная форма буквально допускает «были убиты».
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: семь тысяч человек
  rationale: Передаёт значение необычного оборота «имён человеческих — семь тысяч» понятным современным русским выражением; буквальная форма отмечена в сноске.
- source_word: οἱ λοιποὶ
  choice: остальные
  rationale: Прямо передаёт греческое выражение, не подменяя его более толковательным «уцелевшие».
- source_word: ἔμφοβοι ἐγένοντο
  choice: пришли в ужас
  rationale: Передаёт наступление состояния и интенсивность страха естественным современным русским оборотом.
- source_word: ἔδωκαν δόξαν
  choice: воздали славу
  rationale: Сохраняет устойчивую библейскую формулу и её смысл без сведения к простому «почтили».
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: Богу небес
  rationale: Сохраняет форму титула с родительным падежом и его библейское звучание; множественное «небес» естественно для русского библейского регистра.
theological_decisions:
- issue: Следует ли истолковывать реакцию остальных как истинное покаяние или спасительную веру
  choice: 'Нейтрально передать: «пришли в ужас и воздали славу Богу небес»'
  alternative: Явно сказать, что они покаялись, либо что они лишь вынужденно признали Божью власть
  rationale: Греческий текст сообщает об ужасе и воздании славы Богу, но не определяет внутреннее духовное качество этой реакции. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения ради ясности, при сохранении последовательности греческих союзов внутри смысловых частей. Формулировки избегают как архаизмов, так и излишнего толкования.
