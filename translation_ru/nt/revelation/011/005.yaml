id: REV.11.5
reference: Revelation 11:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: ru
  text: И если кто хочет причинить им зло, из их уст[a] выходит огонь и пожирает их врагов; и если кто захочет причинить им зло, тот должен быть убит именно так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из их рта». В греческом тексте слово «рот» стоит в единственном числе при местоимении множественного числа.'
    reason: Сноска отмечает необычное сочетание единственного числа существительного с множественным числом обладателей, тогда как в основном русском тексте употреблено естественное «из их уст».
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: причинить им зло
  rationale: В данном апокалиптическом контексте глагол обозначает враждебное действие против двух свидетелей. «Причинить зло» естественно по-русски и не уточняет способ нападения сверх сказанного в тексте.
- source_word: πῦρ
  choice: огонь
  rationale: Прямой эквивалент, сохраняющий конкретный и яркий образ Откровения без его истолкования в основном тексте.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: из их уст выходит
  rationale: Передаёт движение изнутри наружу и сохраняет образ. Русское «из их уст» звучит естественно и возвышенно; особенность греческого числа отмечена в сноске.
- source_word: κατεσθίει
  choice: пожирает
  rationale: Сохраняет интенсивный, зримый характер глагола и звучит естественно в апокалиптическом повествовании.
- source_word: ἐχθροὺς
  choice: врагов
  rationale: Обычный и точный русский эквивалент для обозначения противников свидетелей.
- source_word: θέλει / θελήσῃ
  choice: хочет / захочет
  rationale: Видовое различие по-русски естественно отражает настоящее изъявительное наклонение в первом условии и более частный, возможный случай с аористом сослагательного наклонения во втором.
- source_word: οὕτως
  choice: именно так
  rationale: Ясно указывает назад на только что описанный способ гибели и сохраняет смысловую связь, не объясняя природу образа.
- source_word: δεῖ
  choice: должен
  rationale: Передаёт необходимость или неизбежность, не добавляя уточнения о её источнике.
- source_word: ἀποκτανθῆναι
  choice: быть убит
  rationale: Сохраняет пассивную форму и прямое значение глагола, не заменяя его менее определённым «погибнуть».
theological_decisions:
- issue: Следует ли истолковывать огонь, выходящий из уст свидетелей
  choice: 'Сохранить образ буквально: «из их уст выходит огонь».'
  alternative: Передать огонь как символ осуждающей или губительной речи.
  rationale: Греческий текст непосредственно даёт образ огня. Перевод не должен решать за читателя, является ли он буквальным или символическим.
- issue: Характер необходимости в выражении δεῖ
  choice: Передать нейтрально словом «должен».
  alternative: Уточнить как Божье предопределение или как простую неизбежность.
  rationale: Сам стих выражает необходимость, но не называет её источник; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной образностью, уместной для Откровения. Синтаксический параллелизм двух условных конструкций сохранён; архаизмы и конфессионально окрашенные толкования не вводятся.
