base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: ru
  text: 'говоря: «Благодарим Тебя, Господи Боже Вседержитель, Который есть и был[a], потому что Ты принял Свою великую силу и воцарился[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях и переводах в сходной формуле добавлено: «и Кто грядёт», однако здесь греческий текст этих слов не содержит.'
    reason: textual_variant
  - marker: b
    text: 'Или: «начал царствовать»; возможно также: «царствовал». Греческий глагол может обозначать вступление в царственное правление или осуществление царской власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие настоящего времени связывает речь старцев с действием предыдущего стиха; русское деепричастие естественно сохраняет эту связь.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Благодарим Тебя
  rationale: Точное и естественное выражение благодарения с возвышенным, но современным звучанием.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Господи Боже Вседержитель
  rationale: Сохраняет звательную форму обращения и традиционный библейский титул παντοκράτωρ без утраты понятности.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: Тот, Кто есть и Кто был
  rationale: Передаёт субстантивированное наименование и сохраняет различие настоящего и прошедшего времени; не добавляет отсутствующую в греческом тексте формулу о грядущем.
- source_word: ὅτι
  choice: потому что
  rationale: 'Ясно передаёт причинную связь: благодарение возносится за совершённое Богом действие.'
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: Ты принял Свою великую силу
  rationale: Перфект εἴληφας передан результативной формой; «принял» сохраняет основной образ λαμβάνω и не вводит пояснения о характере применения силы.
- source_word: ἐβασίλευσας
  choice: воцарился
  rationale: Русский совершенный вид естественно допускает начинательное значение — вступление в явленное царственное правление, — при этом не разворачивает неоднозначный аорист в пояснительную фразу.
theological_decisions:
- issue: Краткая форма божественного наименования
  choice: Тот, Кто есть и Кто был
  alternative: Тот, Кто есть, был и грядёт
  rationale: SBLGNT в данном стихе не содержит слов «и Кто грядёт»; перевод не гармонизирует текст с другими местами Откровения.
- issue: Характер царствования в ἐβασίλευσας
  choice: воцарился
  alternative: начал царствовать; царствовал
  rationale: «Воцарился» сохраняет возможный ингрессивный оттенок контекста, но не утверждает, будто прежде Бог совершенно не обладал царской властью; альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным богослужебным оттенком. Прописные местоимения в обращении к Богу поддерживают принятый в русском религиозном письме почтительный регистр. Конструкция «Господи Боже Вседержитель» сохраняет достоинство титульной последовательности без архаизации.
