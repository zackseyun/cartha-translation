id: REV.11.6
reference: Revelation 11:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: ru
  text: Они имеют власть затворить небо[a], чтобы не шёл дождь во дни их пророчества; и имеют власть над водами — обращать их в кровь и поражать землю всякой язвой, когда только пожелают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небосвод». Греческое слово οὐρανός может означать как небо вообще, так и видимое небо; здесь речь идёт о прекращении дождя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: они
  rationale: По-русски местоимение естественно продолжает речь о двух свидетелях; числительное не добавляется, поскольку в этом стихе его нет.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Передаёт предоставленное право и полномочие, а не только способность совершать названные действия.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: затворить небо
  rationale: «Затворить» сохраняет образ закрытия, а «небо» естественно обозначает и видимое небо, откуда идёт дождь, не устраняя более широкого значения οὐρανός.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: чтобы не шёл дождь
  rationale: Естественная современная русская передача целевой конструкции и сочетания существительного «дождь» с глаголом βρέχω.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: во дни их пророчества
  rationale: Сохраняет временную конструкцию и допускает понимание προφητεία как пророческого служения или возвещения в течение указанного срока.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: над водами
  rationale: Сочетание с «имеют власть» выражает господство над данной областью и сохраняет множественное число.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: обращать их в кровь
  rationale: Точно и идиоматично передаёт образ превращения вод в кровь.
- source_word: πατάξαι τὴν γῆν
  choice: поражать землю
  rationale: «Поражать» сохраняет силу глагола и связь с последующими язвами, оставаясь понятным современному читателю.
- source_word: ἐν πάσῃ πληγῇ
  choice: всякой язвой
  rationale: Творительный падеж передаёт инструментальное ἐν; «всякой» близко к πάσῃ без добавления отсутствующего в тексте слова «вид».
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: когда только пожелают
  rationale: Передаёт повторяемую возможность действия всякий раз по их желанию; в русском звучит естественнее буквального «столько раз, сколько».
theological_decisions:
- issue: Связь действий свидетелей с образами Илии и Моисея
  choice: Сохранить прямое описание чудесных действий без истолкования их природы.
  alternative: Передать действия как явно символические либо пояснить аллюзии в основном тексте.
  rationale: Греческий текст утверждает предоставленную свидетелям власть, но не разрешает вопрос о буквальном, символическом или совмещённом характере образов.
- issue: Значение οὐρανός
  choice: «небо» с примечанием о возможном значении «небосвод».
  alternative: «небосвод» или «небо» без примечания.
  rationale: Дождевой контекст указывает на видимое небо, но слово οὐρανός шире; примечание сохраняет лексическую многозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Затворить», «во дни» и «язва» поддерживают достоинство апокалиптической речи, не делая синтаксис непонятным; параллель двух упоминаний власти сохранена.
