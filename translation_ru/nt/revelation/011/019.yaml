id: REV.11.19
reference: Revelation 11:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: ru
  text: И открылся храм Бога на небе[a], и в Его храме стал виден ковчег Его завета[b]. И произошли молнии, и голоса[c], и раскаты грома, и землетрясение, и сильный град.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище Бога на небе». Греческое слово ναός может обозначать внутреннюю, святую часть храмового комплекса.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ковчег завета Его»; греческий текст прямо называет этот завет Его, то есть Божьим.'
    reason: lexical_clarification
  - marker: c
    text: 'Или: «звуки», «гул». В Откровении слово «голоса» входит в повторяющееся описание явления Божьего величия и суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: храм
  rationale: «Храм» — естественный и традиционно понятный русский эквивалент; возможное более узкое значение внутреннего святилища отмечено в сноске.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: Передаёт местонахождение Божьего храма естественной русской конструкцией без добавочного толкования.
- source_word: ἠνοίγη
  choice: открылся
  rationale: Возвратная форма естественно передаёт греческий пассив и не называет подразумеваемого деятеля.
- source_word: ὤφθη
  choice: стал виден
  rationale: 'Сохраняет пассивный смысл: ковчег сделался доступен зрению, без утверждения, что он самостоятельно явился.'
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: ковчег Его завета
  rationale: Явно сохраняет местоимение αὐτοῦ и обычное библейское значение διαθήκη — «завет».
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: в Его храме
  rationale: Сохраняет повтор ναός и притяжательное αὐτοῦ.
- source_word: ἐγένοντο
  choice: произошли
  rationale: Передаёт наступление перечисленных знамений и позволяет естественно согласовать сказуемое со всем рядом явлений.
- source_word: ἀστραπαὶ
  choice: молнии
  rationale: Прямой и естественный русский эквивалент множественного числа.
- source_word: φωναὶ
  choice: голоса
  rationale: Буквально сохраняет характерную для Откровения теофаническую формулу, не сводя её заранее к неопределённым звукам.
- source_word: βρονταὶ
  choice: раскаты грома
  rationale: Естественно передаёт множественное число и повторяющийся гром.
- source_word: σεισμὸς
  choice: землетрясение
  rationale: Стандартный эквивалент σεισμός в данном апокалиптическом контексте.
- source_word: χάλαζα μεγάλη
  choice: сильный град
  rationale: Естественное современное русское выражение, передающее значительность и мощь града без добавления слова «буря».
theological_decisions:
- issue: Характер небесного ναός
  choice: В основном тексте употреблено «храм».
  alternative: «Святилище», особенно внутреннее святое помещение храма.
  rationale: «Храм» понятнее широкому читателю и не навязывает детализированного представления об устройстве небесного храма; более узкое лексическое значение сохранено в сноске.
- issue: Значение φωναὶ в теофаническом ряду
  choice: В основном тексте сохранено буквальное «голоса».
  alternative: «Звуки» или «гул».
  rationale: Так сохраняется повторяющаяся формула Откровения и её смысловая напряжённость; метеорологическое истолкование не вносится в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Синтаксис сохраняет торжественный ряд с повтором «и», но избегает архаизмов. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской норме.
