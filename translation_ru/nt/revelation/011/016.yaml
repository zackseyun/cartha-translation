id: REV.11.16
reference: Revelation 11:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: ru
  text: И двадцать четыре старейшины, сидевшие перед Богом на своих престолах, пали ниц и поклонились Богу,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: двадцать четыре старейшины
  rationale: «Старейшины» — ясное и устоявшееся обозначение членов небесного совета в Откровении; оно не сводит их к просто пожилым людям и не требует заимствованного термина «пресвитеры».
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Передаёт пространственное и реляционное значение пребывания в присутствии Бога кратко и естественно для современного русского языка.
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: сидевшие ... на своих престолах
  rationale: Причастный оборот сохраняет описательный характер греческой конструкции, а «на своих престолах» естественно передаёт принадлежность и положение.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: пали ниц
  rationale: Устойчивое русское выражение точно и естественно передаёт полное простирание лицом вниз, не прибегая к буквальному и тяжеловесному «пали на свои лица».
- source_word: προσεκύνησαν τῷ θεῷ
  choice: поклонились Богу
  rationale: В сочетании с дательным «Богу» и описанием падения ниц выражение ясно обозначает религиозное поклонение, сохраняя при этом телесный оттенок греческого глагола.
theological_decisions:
- issue: Значение προσκυνέω в небесной сцене поклонения
  choice: «поклонились Богу»
  alternative: «почтили Бога»; «совершили поклонение Богу»
  rationale: Поскольку действие прямо обращено к Богу и происходит у небесного престола, речь идёт о богопочитании. «Поклонились» передаёт это без ослабления смысла и без добавления конфессионально окрашенной терминологии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пали ниц» сохраняет достоинство и образность исходной сцены; синтаксис остаётся ясным для обычного читателя.
