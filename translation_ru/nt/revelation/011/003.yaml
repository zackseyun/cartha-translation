id: REV.11.3
reference: Revelation 11:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: ru
  text: И Я дам Моим двум свидетелям[a], и они будут пророчествовать тысячу двести шестьдесят дней, облачённые во вретище[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дам Моим двум свидетелям». В греческом тексте не сказано, что именно будет дано; по контексту, вероятно, подразумевается поручение или возможность пророчествовать.'
    reason: lexical_alternative
  - marker: b
    text: Вретище — грубая одежда, которую носили в знак скорби и покаяния; оно также связано с пророческим плачем.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: дам
  rationale: Передаёт обычное значение глагола «дать» и сохраняет намеренную неполноту греческой конструкции, где прямое дополнение не выражено. Контекст подразумевает дарованное поручение или возможность пророчествовать, но не называет их прямо.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: Моим двум свидетелям
  rationale: Естественная русская конструкция сохраняет притяжательное местоимение и свидетельский смысл μάρτυς.
- source_word: προφητεύσουσιν
  choice: будут пророчествовать
  rationale: Прямой, устоявшийся и понятный эквивалент будущего времени προφητεύω.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: тысячу двести шестьдесят дней
  rationale: Винительный падеж длительности естественно передаётся по-русски винительным без предлога.
- source_word: περιβεβλημένοι
  choice: облачённые
  rationale: Передаёт состояние, выраженное перфектным причастием, и сохраняет возвышенный, образный регистр Апокалипсиса.
- source_word: σάκκους
  choice: во вретище
  rationale: Традиционный и литературно понятный русский эквивалент библейского sackcloth; единственное собирательное обозначение естественно передаёт греческое множественное число в данной идиоме.
theological_decisions:
- issue: Не выраженное дополнение при δώσω
  choice: 'Сохранить в основном тексте: «дам Моим двум свидетелям»'
  alternative: «дарую Моим двум свидетелям власть» или «поручу Моим двум свидетелям»
  rationale: Греческий текст не называет прямо, что именно будет дано. Хотя последующее пророчествование позволяет предполагать полномочие или поручение, их явное добавление сняло бы подлинную синтаксическую и смысловую открытость текста.
- issue: Смысл образа вретища
  choice: Сохранить образ без истолкования в основном тексте
  alternative: «облачённые в одежду скорби»
  rationale: Вретище связано со скорбью, покаянием и пророческим плачем, однако стих не сводит его символику к одному значению.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Вретище» сохранено как точный культурно-библейский термин и пояснено в сноске. Заглавная буква в «Я» и «Моим» указывает на речь Бога в контексте, не меняя содержания греческого текста.
