  source_fidelity: 'Основной текст точно передаёт греческий порядок и намеренно невыраженное дополнение при δώσω: «дам Моим двум свидетелям». Будущее «будут пророчествовать», длительность в винительном падеже и образ «облачённые во вретище» соответствуют оригиналу. Однако русская пунктуация перед деепричастно-причастным оборотом требует уточнения: «облачённые во вретище» относится к «они» и должен быть обособлен.'
  naturalness: Фраза литературна и понятна. «Вретище» — уместный библейско-культурный термин; поясняющая сноска обеспечивает доступность. Обособление оборота запятой делает синтаксис современно нормативным и ясным.
  terminology: «Свидетели», «пророчествовать» и «вретище» удачны. Заглавные буквы в «Я» и «Моим» допустимы в библейском регистре и не создают богословского добавления. Сноска a корректно сохраняет неоднозначность δώσω; сноска b точно и ненавязчиво поясняет культурный образ.
