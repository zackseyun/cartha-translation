id: REV.11.15
reference: Revelation 11:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: ru
  text: 'И седьмой ангел затрубил, и на небе раздались громкие голоса, говорившие: «Царство мира[a] стало царством нашего Господа и Его Мессии[b], и Он будет царствовать во веки веков[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «царства мира»; в других: «царство этого мира». В тексте SBLGNT стоит единственное число: «царство мира».'
    reason: textual_variant
  - marker: b
    text: 'Или: «Его Христа». Греческое Χριστός означает титул «Помазанник» и здесь передано словом «Мессия».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в века веков» — греческое выражение, обозначающее нескончаемую длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: затрубил
  rationale: Глагол σαλπίζω означает «трубить, подавать звук трубой». Русское «затрубил» естественно передаёт действие и не требует добавлять подразумеваемое слово «труба».
- source_word: φωναὶ μεγάλαι
  choice: громкие голоса
  rationale: При последующем λέγοντες речь идёт о членораздельных голосах; μεγάλαι в данном сочетании естественно передаётся как «громкие».
- source_word: ἐν τῷ οὐρανῷ
  choice: на небе
  rationale: В контексте Откровения имеется в виду небесная сфера; нормативное русское выражение — «на небе».
- source_word: λέγοντες
  choice: говорившие
  rationale: Причастие относится по смыслу к слышимым голосам. Такая передача сохраняет структуру высказывания и звучит естественно по-русски.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: Царство мира стало царством
  rationale: В SBLGNT βασιλεία стоит в единственном числе. Повтор слова «царство» по-русски ясно выражает эллиптическую греческую конструкцию со значением перехода царской власти.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Кύριος передано традиционным и современно понятным титулом «Господь»; родительный падеж выражает принадлежность царства.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: Его Мессии
  rationale: Χριστός здесь выступает как титул Божьего Помазанника, что особенно ясно в сочетании «Его Мессия».
- source_word: καὶ βασιλεύσει
  choice: и Он будет царствовать
  rationale: Сохранено единственное число греческого глагола. Местоимение не уточняет референта сверх того, что позволяет сжатая греческая формулировка.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивое русское выражение передаёт греческую идиому неограниченной длительности и сохраняет её торжественный регистр.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В обороте «Его Χριστός» слово явно функционирует как титул Помазанника, поэтому «Мессия» непосредственно передаёт титульный смысл.
- issue: Субъект βασιλεύσει
  choice: Он будет царствовать
  alternative: Они будут царствовать / Господь и Его Мессия будут царствовать
  rationale: Греческий глагол стоит в единственном числе. Перевод сохраняет это число и намеренно не разрешает до конца сжатость и возможную богословскую напряжённость в определении референта.
- issue: Единственное число βασιλεία
  choice: Царство мира
  alternative: царства мира / царство этого мира
  rationale: Основной текст SBLGNT имеет единственное число и не содержит указательного местоимения «этого»; иные чтения отмечены только в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим небесному провозглашению. Традиционные библейские обороты сохранены там, где они понятны современному читателю («Господь», «во веки веков»); архаическая грамматика и искусственная буквальность избегаются.
