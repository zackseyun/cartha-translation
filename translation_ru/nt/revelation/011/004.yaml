  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: ru
  text: Они — две маслины и два светильника; они стоят перед Господом земли[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь содержится отсылка к Захарии 4, где образы маслин и светильника указывают на поставленных Богом служителей, наделённых силой Духа.
    reason: cross_reference
  - marker: b
    text: 'Или: «Они — две маслины и два светильника, которые стоят перед Господом земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: Они
  rationale: Указательное местоимение мужского рода во множественном числе отсылает к двум свидетелям из предыдущего контекста. «Они» естественно по-русски сохраняет эту отсылку, не добавляя в текст слово «свидетели».
- source_word: ἐλαῖαι
  choice: маслины
  rationale: В данном апокалиптическом образе имеются в виду масличные деревья. «Маслины» — точное и традиционно понятное название деревьев, сохраняющее связь с Захарией 4.
- source_word: λυχνίαι
  choice: светильника
  rationale: λυχνία обозначает подставку со светильником, а не только лампу. «Светильник» естественно передаёт устойчивый библейский образ в книге Откровение; форма родительного единственного употреблена после числительного «два».
- source_word: ἐνώπιον
  choice: перед
  rationale: Передаёт положение в присутствии кого-либо и звучит естественно в современном русском языке.
- source_word: κυρίου
  choice: Господом
  rationale: κύριος здесь является богословским титулом; «Господь» сохраняет его почтительный и библейский смысл.
- source_word: γῆς
  choice: земли
  rationale: В космическом контексте Откровения γῆ вероятнее означает всю землю, а не отдельную страну или область.
- source_word: ἑστῶτες
  choice: стоящие
  rationale: Причастие совершенного вида в греческом описывает продолжающееся состояние тех, кто занял своё место. Русское причастие «стоящие» кратко и естественно передаёт это состояние, не устраняя возможную синтаксическую двусмысленность.
theological_decisions:
- issue: Связь образов с Захарией 4 и личность двух свидетелей
  choice: 'Сохранить прямое отождествление: «Они — две маслины и два светильника», не объясняя символы в основном тексте.'
  alternative: 'Разъясняющая передача: «Эти два свидетеля подобны двум маслинам и двум светильникам».'
  rationale: Греческий текст прямо отождествляет свидетелей с апокалиптическими образами, а не вводит явное сравнение. Буквенный образ сохраняет межтекстовую связь и не предрешает истолкование символов.
- issue: К чему относится причастие ἑστῶτες
  choice: Передать причастием «стоящие», сохранив компактность и некоторую синтаксическую открытость оригинала.
  alternative: 'Передать отдельным определительным оборотом: «которые стоят перед Господом земли».'
  rationale: Мужской род греческого причастия соотносит стоящих с обозначенными словом Οὗτοί свидетелями, однако его положение после образных наименований допускает восприятие всей конструкции как единого описания. Основной текст не должен искусственно усиливать одно толкование.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Тире подчёркивает прямое отождествление, присутствующее в греческом тексте. Образы оставлены без поясняющей вставки; все примечания отмечены в основном тексте.
