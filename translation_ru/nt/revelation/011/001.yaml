reference: Revelation 11:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: ru
  text: 'Мне была дана трость, подобная жезлу, со словами: «Встань и измерь храм[a] Бога, жертвенник и тех, кто поклоняется в нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище». Греческое ναός может обозначать собственно внутреннюю часть храма, а не весь храмовый комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: Мне была дана
  rationale: Пассивная конструкция сохраняет направленность греческого текста на данный Иоанну предмет и не называет того, кто его дал.
- source_word: κάλαμος
  choice: трость
  rationale: Передаёт основное значение слова — тростниковый стебель, пригодный как мерило, — не подменяя его сразу пояснительным «мерный шест».
- source_word: ὅμοιος ῥάβδῳ
  choice: подобная жезлу
  rationale: Сохраняет прямое сравнение и образ ῥάβδος; «жезл» соответствует возвышенному, но понятному регистру видения.
- source_word: λέγων
  choice: со словами
  rationale: Естественно передаёт синтаксически резкий причастный оборот, не вводя отсутствующих в греческом тексте «голос», «ангела» или явного говорящего.
- source_word: Ἔγειρε
  choice: Встань
  rationale: Краткий прямой императив, естественный в современном русском языке.
- source_word: μέτρησον
  choice: измерь
  rationale: Прямо передаёт повеление совершить измерение.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: храм Бога
  rationale: «Храм» — естественный основной эквивалент; возможное более узкое значение внутреннего святилища отмечено в сноске без навязывания толкования видения.
- source_word: τὸ θυσιαστήριον
  choice: жертвенник
  rationale: Обычный точный эквивалент, не уточняющий вид жертвенника сверх сказанного в тексте.
- source_word: τοὺς προσκυνοῦντας
  choice: тех, кто поклоняется
  rationale: Сохраняет глагольную силу субстантивированного причастия и звучит естественно по-русски.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Местоимение естественно соотносится с ναός («храм»), что позволяет сохранить пространственный смысл без лишнего уточнения.
theological_decisions:
- issue: Референт ναός в апокалиптическом контексте
  choice: храм Бога
  alternative: святилище Бога
  rationale: Сам стих не определяет, является ли храм земным, небесным или символически обозначает Божий народ. Основной текст поэтому не закрепляет конкретную эсхатологическую схему.
- issue: Кто говорит в обороте λέγων
  choice: 'говорящий не назван: «со словами»'
  alternative: «и ангел сказал» или «и голос сказал»
  rationale: Греческий текст не называет говорящего явно; нейтральный оборот сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, уместной для апокалиптического видения. Формулировка остаётся ясной для обычного читателя; синтаксическая и богословская неопределённость оригинала не устраняется добавлениями.
