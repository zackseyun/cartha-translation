  verdict: revise
  source_fidelity: 'Основные соответствия оригиналу сохранены: настоящее время χαίρουσιν / εὐφραίνονται передано настоящим временем, будущее πέμψουσιν — будущим, повторяющееся οἱ κατοικοῦντες ἐπὶ τῆς γῆς переведено последовательно, а сильное ἐβασάνισαν не смягчено. Однако «радуются о них» в современном литературном русском неестественно и воспринимается как архаичная калька.'
  naturalness: «Живущие на земле» и «будут посылать друг другу подарки» ясны и уместны. Для современного литературного регистра сочетание «радуются о них» следует заменить. «Радуются по их поводу» естественно передаёт направленность радости на двух пророков, не добавляя в текст слова «смерть» или иной конкретизации из контекста.
  terminology: «Живущие на земле» удачно сохраняет повтор и словесный характер устойчивого выражения Откровения. «Мучили» адекватно передаёт ἐβασάνισαν; оно не ограничивает характер причиняемого страдания. Имена и специальные богословские термины отсутствуют. Английская аудиторская дорожка в целом поддерживает эти решения; её примечания не требуют переноса в русский текст.
