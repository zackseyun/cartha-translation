id: REV.11.10
reference: Revelation 11:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: ru
  text: И живущие на земле радуются по их поводу и веселятся, и будут посылать друг другу подарки, потому что эти два пророка мучили живущих на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: живущие на земле
  rationale: Причастная конструкция передана естественно и близко к форме оригинала; одинаковый перевод сохранён при обоих употреблениях в стихе и поддерживает характерное для Откровения выражение.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: радуются о них
  rationale: Передаёт радость по поводу участи двух пророков, сохраняя соотнесённость с ними без добавления причины, прямо не выраженной в этой фразе.
- source_word: εὐφραίνονται
  choice: веселятся
  rationale: Отличает этот глагол от χαίρουσιν и передаёт оттенок праздничного ликования естественным современным русским словом.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: будут посылать друг другу подарки
  rationale: Сохраняет будущее время πέμψουσιν, взаимность ἀλλήλοις и прямое значение δῶρα без истолковывающего «обмениваться».
- source_word: οὗτοι οἱ δύο προφῆται
  choice: эти два пророка
  rationale: Прямой и естественный русский эквивалент указательной именной группы.
- source_word: ἐβασάνισαν
  choice: мучили
  rationale: Передаёт сильное значение βασανίζω и не смягчает воздействие пророков до «тревожили» или «досаждали».
theological_decisions:
- issue: Характерное для Откровения обозначение земного мира, противостоящего Богу
  choice: живущие на земле
  alternative: обитатели земли
  rationale: Выбранный вариант сохраняет словесную форму повторяющегося выражения и его возможный богословский вес, но не вводит в основной текст пояснение, будто речь непременно о каждом жителе планеты или, наоборот, только о заранее определённой группе.
- issue: Сила воздействия двух пророков
  choice: мучили
  alternative: терзали; причиняли страдания
  rationale: Формулировка сохраняет резкость греческого глагола и напряжение повествования, не уточняя сверх текста, было ли мучение преимущественно телесным, душевным или связано с пророческими карами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «живущие на земле» намеренно сохранён вслед за оригиналом; синтаксис остаётся ясным для обычного читателя.
