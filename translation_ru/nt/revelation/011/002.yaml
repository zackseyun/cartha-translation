  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: ru
  text: А двор вне храма[a] исключи и не измеряй его, потому что он отдан народам[b], и они будут попирать святой город сорок два месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вне святилища». Греческое слово ναός может обозначать собственно святилище, а не весь храмовый комплекс.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «язычникам». Греческое слово ἔθνεσιν может означать как «народы», так и «язычники» — в зависимости от контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: двор
  rationale: В данном контексте речь идёт о дворе храмового комплекса; «двор» — естественное и точное обозначение по-русски.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: находящийся вне храма
  rationale: Оборот определяет местоположение двора и сохраняет пространственное противопоставление двора и ναός.
- source_word: ναός
  choice: храм
  rationale: «Храм» естественнее для широкого круга русскоязычных читателей; более узкое значение «святилище» сохранено в сноске, поскольку оно может быть существенно для образа.
- source_word: ἔκβαλε ἔξωθεν
  choice: оставь за пределами
  rationale: Сочетание выражает исключение двора из измеряемого пространства. Такой перевод передаёт образ удаления, не добавляя оттенка насильственного выбрасывания.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: не измеряй его
  rationale: Прямо сохраняет запрет во втором лице единственного числа; местоимение согласовано с русским словом «двор».
- source_word: ἐδόθη
  choice: он отдан
  rationale: Сохранён страдательный залог и не назван подразумеваемый деятель; настоящее результативное состояние естественно выражено кратким страдательным причастием.
- source_word: τοῖς ἔθνεσιν
  choice: народам
  rationale: «Народы» сохраняет широкий коллективный смысл и пророческую лексику; возможное значение «язычники» отмечено в сноске.
- source_word: πόλιν τὴν ἁγίαν
  choice: святой город
  rationale: Устойчивый и точный перевод, не уточняющий прямо, какой именно город представлен в видении.
- source_word: πατήσουσιν
  choice: будут попирать
  rationale: Глагол передаёт враждебное осквернение и господство, сохраняя возвышенный библейский регистр без архаизма.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: сорок два месяца
  rationale: Винительный падеж длительности естественно передаётся по-русски без обязательного предлога «в течение».
theological_decisions:
- issue: Значение ναός в храмовой образности видения
  choice: В основном тексте — «храм», с вариантом «святилище» в сноске.
  alternative: святилище
  rationale: ναός может обозначать собственно святилище, а не весь храмовый комплекс. Основной вариант обеспечивает ясность, а сноска сохраняет более узкое значение и связанную с ним интерпретационную напряжённость.
- issue: Значение ἔθνεσιν
  choice: В основном тексте — «народам», с вариантом «язычникам» в сноске.
  alternative: язычникам
  rationale: Греческое слово может обозначать народы вообще или неиудеев. «Народам» не сужает смысл, тогда как сноска сохраняет возможный этнорелигиозный оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Формулировка «оставь за пределами» связывает повеление с последующим запретом измерять двор, а «будут попирать» сохраняет сильную образность исходного текста.
