id: REV.11.7
reference: Revelation 11:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: ru
  text: И когда они завершат своё свидетельство, зверь, выходящий из бездны, пойдёт на них войной, победит их и убьёт их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσωσιν
  choice: завершат
  rationale: 'Аорист конъюнктива после ὅταν выражает будущее обстоятельство: «когда завершат». Глагол «завершат» естественно передаёт доведение порученного свидетельства до конца.'
- source_word: μαρτυρίαν
  choice: свидетельство
  rationale: Слово может обозначать «свидетельство» или «свидетельствование». «Свидетельство» сохраняет смысл свидетельского служения и хорошо сочетается с глаголом «завершат».
- source_word: θηρίον
  choice: зверь
  rationale: «Зверь» — точное и привычное для апокалиптического контекста соответствие, не требующее уточняющего «дикий».
- source_word: ἀναβαῖνον
  choice: выходящий
  rationale: Причастие настоящего времени описывает зверя как выходящего из бездны. «Выходящий» естественно по-русски передаёт движение снизу наружу; буквальное «поднимающийся» также возможно, но звучит менее плавно.
- source_word: ἀβύσσου
  choice: бездна
  rationale: «Бездна» прямо соответствует греческому слову и сохраняет терминологию книги Откровение без добавления толкования вроде «бездонная пропасть».
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: вступит с ними в войну
  rationale: Оборот сохраняет греческое μετά с родительным в форме «с ними» и ясно выражает начало военных действий. Враждебность недвусмысленно подтверждается последующими глаголами.
- source_word: νικήσει
  choice: победит
  rationale: «Победит» естественно передаёт νικάω и сохраняет образ противоборства, не усиливая его дополнительным толкованием.
- source_word: ἀποκτενεῖ
  choice: убьёт
  rationale: Прямое и современное соответствие греческому глаголу; оно точнее по регистру, чем архаическое «умертвит», и короче, чем «предаст смерти».
theological_decisions:
- issue: Передача враждебного отношения в ποιήσει μετ’ αὐτῶν πόλεμον
  choice: вступит с ними в войну
  alternative: пойдёт на них войной; будет воевать против них
  rationale: Греческий текст буквально строит выражение с μετά и родительным («с ними»). Русский оборот «вступит с ними в войну» сохраняет эту конструкцию и остаётся ясным благодаря последующим словам «победит» и «убьёт».
translation_notes:
  register: Современный литературный русский язык с dignified апокалиптическим звучанием. Синтаксис близок к последовательности греческого оригинала, но естественен для обычного читателя; богословская неоднозначность оборота μετά сохранена в основном тексте и пояснена сноской.
