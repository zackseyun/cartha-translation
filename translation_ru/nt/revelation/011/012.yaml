  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: ru
  text: 'И услышали они громкий голос с неба, говоривший им: «Поднимитесь сюда!» И они поднялись на небо в облаке[a], а их враги смотрели на них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «в облаке»; определённый артикль может также отсылать к библейским сценам Божьего присутствия и оправдания.'
    reason: Лексическая особенность и возможная библейская аллюзия.
lexical_decisions:
- source_word: ἤκουσαν
  choice: услышали
  rationale: Аорист передаёт событие восприятия небесного голоса; «услышали» естественно и точно.
- source_word: φωνῆς μεγάλης
  choice: громкий голос
  rationale: В данном контексте μέγας характеризует силу звучания; по-русски естественно «громкий голос», а не буквальное «великий голос».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: В контексте видения и небесной речи οὐρανός означает небо как божественную сферу; русская конструкция «голос с неба» идиоматична.
- source_word: λεγούσης αὐτοῖς
  choice: говоривший им
  rationale: Причастный оборот сохраняет грамматическую связь с «голосом» и явно передаёт αὐτοῖς.
- source_word: Ἀνάβατε ὧδε
  choice: Поднимитесь сюда!
  rationale: Повелительная форма во множественном числе передаёт призыв двигаться вверх, а ὧδε — указание «сюда».
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: поднялись на небо
  rationale: Передаёт направленное вверх движение к небу естественным современным русским выражением без излишне терминологического оттенка слова «вознеслись».
- source_word: ἐν τῇ νεφέλῃ
  choice: в облаке
  rationale: 'Сохранён определённый артикль по смыслу: формулировка допускает отсылку к известному библейскому образу облака божественного присутствия.'
- source_word: ἐθεώρησαν
  choice: смотрели на них
  rationale: θεωρέω обозначает наблюдение, а не только мгновенное зрительное восприятие; «смотрели на них» передаёт длительный, внимательный оттенок.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: их враги
  rationale: Естественная русская притяжательная конструкция точно сохраняет отношение к свидетелям.
theological_decisions:
- issue: Возможная библейская отсылка в выражении ἐν τῇ νεφέλῃ
  choice: Сохранить в основном тексте «в облаке»
  alternative: «в одном облаке» или «на облаке»
  rationale: Греческий текст буквально говорит «в облаке» с определённым артиклем, что может вызывать образ облака божественного присутствия и оправдания. Перевод сохраняет эту возможность, не делая её однозначной.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис близок к греческой последовательности, но естественен для обычного русскоязычного читателя; традиционно нагруженное «вознеслись» не использовано.
