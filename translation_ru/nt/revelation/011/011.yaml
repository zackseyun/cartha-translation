source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: ru
  text: После трёх с половиной дней дыхание жизни[a] от Бога вошло в них, и они встали на ноги; и великий страх объял тех, кто наблюдал за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух жизни от Бога»; возможно: «Дух жизни от Бога». Греческое слово πνεῦμα может означать «дыхание», «дух» или «Дух».'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: после тех трёх с половиной дней
  rationale: Предлог μετά с винительным падежом обозначает временную последовательность. Указательное «тех» естественно передаёт определённость греческого выражения и связь с уже названным сроком.
- source_word: πνεῦμα ζωῆς
  choice: дыхание жизни
  rationale: πνεῦμα допускает значения «дыхание», «дух» и «Дух». В сцене оживления «дыхание жизни» естественно передаёт образ даруемой жизни и сохраняет созвучие с Иез 37, не отождествляя выражение прямо со Святым Духом.
- source_word: ἐκ τοῦ θεοῦ
  choice: от Бога
  rationale: Естественное русское обозначение источника или происхождения; сохраняет прямое указание на Бога как источник жизни.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: вошло в них
  rationale: Идиоматически передаёт внутреннее вхождение; средний род согласован с «дыхание».
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: они встали на ноги
  rationale: Естественный современный русский оборот, точно передающий переход в стоячее положение и образ восстановления к жизни.
- source_word: φόβος μέγας
  choice: великий страх
  rationale: Сохраняет силу μέγας и возвышенный апокалиптический регистр, не усиливая значение до «ужаса».
- source_word: ἐπέπεσεν ἐπὶ
  choice: объял
  rationale: Русское «страх объял» естественно и образно передаёт внезапное охватывающее воздействие греческого оборота.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: тех, кто смотрел на них
  rationale: Передаёт продолжающееся внимательное наблюдение без архаичного «взиравших».
theological_decisions:
- issue: Следует ли понимать πνεῦμα ζωῆς как безличное животворящее дыхание или прямо как Святого Духа
  choice: дыхание жизни от Бога
  alternative: дух жизни от Бога; Дух жизни от Бога
  rationale: Греческий текст ясно указывает божественный источник, но не отождествляет πνεῦμα прямо со Святым Духом. Основной перевод поддерживает образ оживления, а примечание сохраняет лексическую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Синтаксис ясен для широкого читателя; точка с запятой подчёркивает переход от оживления свидетелей к реакции наблюдавших.
