  source_fidelity: 'Основной смысл передан точно: временная последовательность, божественное происхождение πνεῦμα ζωῆς, вхождение в свидетелей, их вставание и страх наблюдающих сохранены. Однако начальное «Но» не имеет соответствия в Καί и создаёт неоправданный противительный оттенок. Указательное «тех» также излишне: греческий артикль здесь не требует его передачи в русском.'
  naturalness: «После трёх с половиной дней» — естественный современный русский оборот; «великий страх объял тех, кто наблюдал за ними» сохраняет торжественность и передаёт длительный характер θεωροῦντας без разговорности.
  terminology: «Дыхание жизни от Бога» обоснованно сохраняет неоднозначность πνεῦμα. Примечание корректно указывает альтернативы «дух» и «Дух» и не навязывает отождествления со Святым Духом. Якорь примечания перенесён непосредственно к словосочетанию, к которому оно относится.
