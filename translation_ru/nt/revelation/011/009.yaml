id: REV.11.9
reference: Revelation 11:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: ru
  text: И люди из народов, племён, языков и народностей смотрят на их мёртвое тело три с половиной дня[a] и не позволяют положить их тела в гробницу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте сначала стоит единственное число — «их мёртвое тело», а затем множественное — «их тела». Единственное число, возможно, представляет двух свидетелей как единое целое, после чего речь вновь идёт об их отдельных телах.
    reason: Сохранение необычной смены числа и возможного смыслового оттенка исходного текста.
lexical_decisions:
- source_word: βλέπουσιν
  choice: смотрят на
  rationale: Настоящее время и направленное зрительное действие переданы прямо; выражение естественно для современного русского языка и сохраняет длительный, наглядный характер сцены.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: люди из разных народов, племён, языков и племенных сообществ
  rationale: Предлог ἐκ выражает принадлежность к перечисленным группам, а не всеобщность. Слово «люди» естественно восполняет подразумеваемый субъект; «разных» передаёт распределённость по группам, не утверждая, что речь идёт о каждом их представителе.
- source_word: λαῶν
  choice: народов
  rationale: Сохраняет множественное число и обычное для Откровения обозначение коллективных человеческих общностей.
- source_word: φυλῶν
  choice: племён
  rationale: Прямой и устойчивый русский эквивалент для φυλή в этнографических перечнях Откровения.
- source_word: γλωσσῶν
  choice: языков
  rationale: В данном перечне γλῶσσα обозначает языковые сообщества; современное «языков» яснее архаичного «языков/наречий» в значении людей.
- source_word: ἐθνῶν
  choice: племенных сообществ
  rationale: Так сохраняется отличие ἐθνῶν от уже употреблённого λαῶν («народов») и передаётся значение этнических общностей; «язычников» здесь было бы неоправданно узко и конфессионально окрашено.
- source_word: τὸ πτῶμα αὐτῶν
  choice: их мёртвое тело
  rationale: Намеренно сохранено единственное число πτῶμα при отнесении к двум свидетелям. Несколько необычная русская формулировка позволяет увидеть грамматический переход исходного текста.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: три с половиной дня
  rationale: Естественно передаёт винительный длительности и точно сохраняет указанный апокалиптический срок.
- source_word: τὰ πτώματα αὐτῶν
  choice: их тела
  rationale: Во второй части стиха сохранён переход греческого текста ко множественному числу. Смысл смерти уже выражен словосочетанием «мёртвое тело» и ближайшим контекстом.
- source_word: οὐκ ἀφίουσιν
  choice: не позволяют
  rationale: В этой конструкции ἀφίημι имеет значение разрешения или допущения; выбран ясный современный русский эквивалент.
- source_word: τεθῆναι εἰς μνῆμα
  choice: положить … в гробницу
  rationale: Передаёт страдательное значение инфинитива в естественной русской конструкции и сохраняет конкретный образ помещения тела в место погребения, не сводя его к более общему «похоронить».
theological_decisions:
- issue: Единственное число πτῶμα в первой части и множественное πτώματα во второй
  choice: Сохранить «их мёртвое тело», а затем «их тела»
  alternative: 'Согласовать обе части во множественном числе: «их мёртвые тела»'
  rationale: Смена числа присутствует в греческом тексте и может представлять двух свидетелей сначала как единое свидетельство, а затем как отдельных людей. Перевод не устраняет эту возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Необычное единственное число сохранено намеренно и пояснено сноской; синтаксис в остальном сделан ясным и естественным.
