id: REV.11.18
reference: Revelation 11:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: ru
  text: 'И народы разгневались, и пришёл Твой гнев, и настало время: мёртвым — быть судимыми, а Твоим рабам[a] — пророкам, святым и боящимся Твоего имени, малым и великим, — получить награду и погубить тех, кто губит землю[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слугам». Греческое δοῦλος может означать раба или слугу; здесь это обозначение принадлежащих Богу и служащих Ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение можно также передать: «разоряет» или «растлевает землю»; слово γῆ может означать также страну или сушу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: народы
  rationale: В контексте Откровения речь идёт о народах мира как совокупности, а не специально о язычниках в противопоставлении иудеям.
- source_word: ὠργίσθησαν
  choice: разгневались
  rationale: Передаёт наступление гнева и сохраняет смысловую связь с последующим ὀργή, не усиливая значение до «пришли в ярость».
- source_word: ὀργή
  choice: гнев
  rationale: Обычное и достойное русское обозначение Божьего судебного, эсхатологического гнева; сохраняет контраст с гневом народов.
- source_word: καιρός
  choice: настало время
  rationale: καιρός обозначает решающий, назначенный момент; глагольная формулировка естественно продолжает русское предложение и выявляет зависимость от ἦλθεν.
- source_word: τῶν νεκρῶν κριθῆναι
  choice: мёртвым быть судимыми
  rationale: Сохраняет пассивную судебную конструкцию и дательный смысл греческого родительного при инфинитиве после «время».
- source_word: μισθός
  choice: награда
  rationale: В контексте Божьего воздаяния верным это естественнее, чем коммерчески окрашенная «плата».
- source_word: δούλοις
  choice: рабам
  rationale: Русское библейское «рабы Божьи» естественно выражает принадлежность и полное служение Богу; более мягкий вариант отмечен в сноске.
- source_word: ἁγίοις
  choice: святым
  rationale: Устоявшееся обозначение посвящённого Богу народа, не ограниченное позднейшим специальным статусом отдельных лиц.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: боящимся Твоего имени
  rationale: Сохраняет библейский образ благоговейного страха и исходную метонимию имени Бога.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: малым и великим
  rationale: Сохраняет парную формулу всеохватности по положению и согласует её с рядом получателей награды.
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: погубить тех, кто губит
  rationale: Повтор одного корня передаёт намеренную игру слов греческого текста; «губить» допускает как разрушение, так и разорение.
- source_word: γῆ
  choice: землю
  rationale: Апокалиптический контекст всемирного суда поддерживает значение «земля»; возможность значения «страна/суша» отмечена в сноске.
theological_decisions:
- issue: Значение δοῦλος как обозначения Божьего народа
  choice: рабы
  alternative: слуги
  rationale: «Рабы Божьи» в современном литературном русском остаётся понятным библейским выражением полной принадлежности Богу и не сводит образ к наёмной службе. Лексически возможное «слуги» сохранено в сноске.
- issue: Состав получателей награды
  choice: «пророкам, святым и боящимся Твоего имени» передано как три соотнесённые группы под общим обозначением «Твоим рабам»
  alternative: понимать «рабам Твоим, пророкам» как одну группу, а последующие определения — как другие группы
  rationale: Греческая координация допускает некоторую синтаксическую неоднозначность. Пунктуация не утверждает строгого взаимного исключения групп и сохраняет их общий охват обозначением Божьих рабов.
- issue: К кому относится «малым и великим»
  choice: к боящимся Божьего имени, а по смыслу — ко всем получающим награду независимо от положения
  alternative: отдельная четвёртая группа
  rationale: Согласование и положение фразы естественно связывают её с τοῖς φοβουμένοις, тогда как формула выражает всеохватность. Русская конструкция сохраняет эту открытость.
- issue: Сфера γῆ
  choice: земля
  alternative: страна / суша
  rationale: Космический масштаб сцены суда благоприятствует универсальному значению, но более узкое лексическое значение не исключено и отмечено в сноске.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим ритмом. Повтор «и настало время» добавлен для ясного русского синтаксиса длинной цепочки, заложенной в ἦλθεν … ὁ καιρός, без изменения её смысловой структуры. Заглавные буквы в местоимениях «Твой/Твоего» следуют принятой русской благоговейной орфографической традиции.
