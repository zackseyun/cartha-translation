  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: ru
  text: Второе горе миновало; вот, третье горе грядёт стремительно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скоро». Греческое ταχύ может указывать как на временную близость, так и на быстроту наступления.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: горе
  rationale: «Горе» сохраняет форму скорбного возгласа и обозначение грядущего бедствия; в Откровении это также последовательное название трёх пронумерованных бедствий.
- source_word: δευτέρα
  choice: второе
  rationale: Порядковое числительное прямо относится к слову «горе».
- source_word: ἀπῆλθεν
  choice: миновало
  rationale: Аорист ἀπέρχομαι буквально передаёт уход или завершение; «миновало» естественно обозначает, что второе горе завершилось.
- source_word: ἰδού
  choice: вот
  rationale: «Вот» естественно и выразительно привлекает внимание, сохраняя торжественный пророческий тон без архаизации.
- source_word: τρίτη
  choice: третье
  rationale: Порядковое числительное прямо относится к слову «горе».
- source_word: ἔρχεται
  choice: грядёт
  rationale: «Грядёт» передаёт живой настоящий план и приближение события, а также соответствует возвышенному апокалиптическому регистру.
- source_word: ταχύ
  choice: стремительно
  rationale: ταχύ может указывать как на быстроту наступления, так и на временную близость. «Стремительно» сохраняет оттенок быстроты, а возможное значение «скоро» отмечено в сноске.
theological_decisions:
- issue: Передача ταχύ в эсхатологическом контексте
  choice: стремительно
  alternative: скоро
  rationale: Греческое наречие допускает акцент либо на быстроте и внезапности наступления, либо на его временной близости. Основной текст передаёт первый оттенок, а сноска сохраняет второй, не устанавливая однозначного эсхатологического срока.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Грядёт» уместно в апокалиптическом контексте и остаётся понятным современному читателю; синтаксис краток и следует напряжённому ритму оригинала.
