  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: ἡ οὐαὶ ἡ δευτέρα — «Второе горе», ἀπῆλθεν — «миновало», ἰδού — «вот», а ἔρχεται ταχύ — «грядёт стремительно». Сохранены настоящее время и напряжённая пророческая подача заключительной фразы. Неоднозначность ταχύ (вскоре / быстро, стремительно) не снята догматически и прозрачно отражена в сноске.'
