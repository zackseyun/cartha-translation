  terminology: «Горе» — удачный последовательный эквивалент οὐαί в контексте трёх пронумерованных апокалиптических «горей». Порядковые числительные согласованы с субстантивированным средним родом слова «горе». Передача ταχύ как «стремительно» не исключает временного смысла благодаря корректной сноске.
