  source_fidelity: Текст точно передаёт греческий оригинал. Единственное число τὸ πτῶμα сохранено в «труп их», а «лежит» естественно восполняет подразумеваемое в греческой номинативной конструкции сказуемое. «На улице», «великого города», «в духовном смысле называется Содомом и Египтом» и «там же был распят и их Господь» адекватно отражают соответственно ἐπὶ τῆς πλατείας, τῆς πόλεως τῆς μεγάλης, πνευματικῶς καλεῖται и ὅπου καὶ ... ἐσταυρώθη. Символическое наименование города не подменено явным отождествлением с Иерусалимом.
  naturalness: 'Перевод звучит как современный литературный русский с уместной библейской возвышенностью. Инверсия «труп их» несколько книжна, но здесь оправданна: она позволяет сохранить единственное число и яснее обозначить собирательный образ. Тире перед «там же» помогает членению длинного предложения и не меняет смысл.'
  terminology: «Господь» — надлежащая передача κύριος в данном контексте. Формы «Содомом и Египтом» нормативны и синтаксически требуются при «называется». «В духовном смысле» сохраняет значение πνευματικῶς без преждевременного сведения его к одному лишь литературному приёму.
