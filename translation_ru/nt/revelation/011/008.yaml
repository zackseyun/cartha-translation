id: REV.11.8
reference: Revelation 11:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: ru
  text: И труп их[a] лежит на улице[b] великого города, который в духовном смысле[c] называется Содомом и Египтом, — там же был распят и их Господь[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «труп» в единственном числе, хотя речь идёт о двух свидетелях; возможно, они представлены здесь как одно целое.
    reason: grammatical_feature
  - marker: b
    text: 'Или: «на площади»; греческое слово может обозначать широкую улицу или городскую площадь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «образно» либо «символически».'
    reason: lexical_alternative
  - marker: d
    text: Слова о месте, где был распят их Господь, указывают на Иерусалим, однако текст сохраняет символическое обозначение «великий город».
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: труп их
  rationale: πτῶμα обозначает павшее мёртвое тело. Существительное в греческом стоит в единственном числе, хотя αὐτῶν относится к двум свидетелям; русский оборот сохраняет это намеренное собирательное представление.
- source_word: ἐπὶ τῆς πλατείας
  choice: на улице
  rationale: πλατεῖα может означать широкую городскую улицу или площадь. «На улице» естественно в данном контексте и не сужает образ до конкретной площади; альтернативное значение отмечено в сноске.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: великого города
  rationale: Сохраняется значимое для Откровения апокалиптическое обозначение «великий город», а не нейтральное описание его размера.
- source_word: πνευματικῶς
  choice: в духовном смысле
  rationale: Это естественный современный русский эквивалент наречия «духовно» в данном синтаксисе; он сохраняет духовно-символический характер наименования, не сводя его лишь к литературной фигуре.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Содомом и Египтом
  rationale: Имена переданы в принятой русской библейской форме; творительный падеж требуется глаголом «называется».
- source_word: ὅπου καὶ
  choice: там же
  rationale: Передаёт и указание на место, и добавочное значение καί естественным русским оборотом.
- source_word: ὁ κύριος αὐτῶν
  choice: их Господь
  rationale: «Господь» сохраняет богословски весомый титул κύριος; местоимение относится к двум свидетелям.
- source_word: ἐσταυρώθη
  choice: был распят
  rationale: Стандартная и точная передача аориста страдательного залога от σταυρόω.
theological_decisions:
- issue: Единственное число πτῶμα при указании на двух свидетелей
  choice: 'Сохранить единственное число: «труп их».'
  alternative: «их трупы» или «их мёртвые тела»
  rationale: Греческий текст намеренно употребляет единственное число и тем самым может представлять двух свидетелей как одно целое. Перевод не устраняет эту особенность.
- issue: Смысл πνευματικῶς
  choice: «в духовном смысле»
  alternative: «образно» или «символически»
  rationale: Основной текст сохраняет прямую связь со значением πνεῦμα и не разрешает неоднозначность исключительно в пользу литературно-фигурального понимания; более пояснительный вариант дан в сноске.
- issue: Отождествление «великого города»
  choice: Не заменять символическое название словом «Иерусалим».
  alternative: Явно перевести или пояснить в основном тексте как «Иерусалим».
  rationale: Упоминание распятия Господа указывает на Иерусалим, однако сам текст сохраняет апокалиптическое обозначение и сопоставляет город с Содомом и Египтом. Перевод оставляет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Инверсия «труп их» сохраняет греческое единственное число и звучит по-библейски, но остаётся понятной. Тире перед «там же» делает длинную фразу яснее, не добавляя нового смыслового отношения.
