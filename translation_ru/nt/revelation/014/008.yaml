id: REV.14.8
reference: Revelation 14:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: ru
  text: 'И вслед за ним последовал другой, второй ангел и сказал: «Пал, пал Вавилон великий, который напоил[c] все народы вином неистовства[a] своего разврата[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «ярости», «гнева» или «страсти». Греческое θυμός обозначает сильный порыв и может выражать как ярость, так и необузданную страсть.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «разврат», вероятно, служит образом растлевающего влияния, идолопоклонства и неверности, однако сам текст не ограничивает этот образ только одним из этих значений.
    reason: cultural_note
  - marker: c
    text: 'Или: «опьянил все народы». Буквально в греческом тексте: «напоил все народы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: другой ангел, второй
  rationale: Сохранены оба определения — «другой» и «второй»; приложение передаёт несколько необычную, но значимую структуру греческого текста.
- source_word: ἠκολούθησεν λέγων
  choice: вслед за ним пошёл … и сказал
  rationale: Передана последовательность видения; естественная русская личная конструкция заменяет греческое причастие без изменения смысла.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Пал, пал
  rationale: Повтор и совершенный вид сохраняют краткость и торжественную силу пророческого провозглашения.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: великий Вавилон
  rationale: Имя собственное передано в традиционной русской форме, а согласование соответствует его грамматическому роду в русском языке.
- source_word: ἐκ τοῦ οἴνου
  choice: вином
  rationale: Русское управление глагола «напоить» естественно передаёт вино как то, из чего дали пить; буквальное «из вина» здесь было бы неестественно.
- source_word: τοῦ θυμοῦ
  choice: неистовства
  rationale: Слово сохраняет интенсивность θυμός и допускает оттенки как необузданной страсти, так и ярости, не сводя выражение только к гневу.
- source_word: τῆς πορνείας αὐτῆς
  choice: своего разврата
  rationale: «Разврат» — понятное современное слово, сохраняющее сексуальный образ и не ограничивающее его конкретным видом поведения; возвратное местоимение ясно относит его к Вавилону.
- source_word: πεπότικεν πάντα τὰ ἔθνη
  choice: напоил все народы
  rationale: Сохранены каузативный смысл ποτίζω и образ питья; совершенный вид указывает на совершившееся действие с сохраняющимся результатом.
theological_decisions:
- issue: Метафорический смысл πορνεία применительно к Вавилону
  choice: Оставить в основном тексте сексуальный образ — «разврат».
  alternative: Прямо истолковать как идолопоклонство, духовную неверность или политическое разложение.
  rationale: Сам стих не сводит образ к одному толкованию; буквальная метафора сохраняет его широкий обличительный смысл.
- issue: Значение θυμός в сочетании с πορνεία
  choice: Передать как «неистовство».
  alternative: «ярость», «гнев» или «страсть»
  rationale: «Неистовство» сохраняет неоднозначность между яростью и необузданным страстным порывом и не приписывает этот гнев Богу без прямого основания в тексте.
- issue: Олицетворение Вавилона
  choice: Использовать грамматически мужское согласование «который» согласно нормам русского языка.
  alternative: «она, которая» с явным олицетворением города-женщины
  rationale: Греческая форма женского рода согласована с Βαβυλών, тогда как русское «Вавилон» мужского рода; изменение рода в русском создало бы искусственную грамматическую шероховатость, не требуемую данным стихом.
translation_notes:
  register: Современный литературный русский с торжественной краткостью пророческой речи. Синтаксис сделан естественным для широкого читателя, при этом сохранены повтор «пал, пал», оба определения ангела и неоднозначная образность выражения о вине, неистовстве и разврате.
