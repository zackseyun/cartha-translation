source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: ru
  text: И они поют как бы новую песню перед престолом, перед четырьмя живыми существами и старейшинами[a]. Никто не мог научиться этой песне, кроме ста сорока четырёх тысяч — тех, кто были куплены с земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно новую песню». Греческое ὡς («как», «словно», «как бы») часто употребляется в Откровении при описании того, что воспринимает автор видения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выкуплены с земли»; также возможно: «искуплены с земли». Греческий глагол буквально означает «купить».'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: они поют
  rationale: Настоящее время передано настоящим временем, что сохраняет живое повествование о видении и естественно звучит по-русски.
- source_word: ὡς ᾠδὴν καινὴν
  choice: как бы новую песню
  rationale: Оборот «как бы» сохраняет значение уподобления или воспринимаемого образа, характерное для языка видений, не отрицая при этом, что песня действительно была новой.
- source_word: ἐνώπιον
  choice: перед
  rationale: Краткий и естественный эквивалент, передающий нахождение в присутствии престола и небесных существ.
- source_word: τῶν τεσσάρων ζῴων
  choice: четырьмя живыми существами
  rationale: В Откровении ζῷα обозначает небесных существ вокруг престола; этот вариант точнее и уместнее, чем «животные» или «звери».
- source_word: τῶν πρεσβυτέρων
  choice: старейшинами
  rationale: Устоявшееся современное обозначение особой группы небесного совета; сохраняет отличие от простого указания на возраст.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: никто не мог научиться
  rationale: Передаёт несовершенный вид глагола возможности и основное значение μαθεῖν без добавления смысла «овладеть».
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: ста сорока четырёх тысяч
  rationale: Число записано словами ради литературной цельности; падеж обусловлен русской конструкцией с «кроме».
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: тех, кто был куплен с земли
  rationale: «Куплен» сохраняет прямую торговую метафору ἀγοράζω, а «с земли» близко передаёт ἀπὸ τῆς γῆς, не уточняя сверх текста, идёт ли речь о месте или о людях земли.
theological_decisions:
- issue: Смысл ὡς в описании песни
  choice: «как бы новую песню» как язык восприятия в видении
  alternative: «словно новую песню» или просто «новую песню»
  rationale: 'Формулировка сохраняет неопределённость: автор описывает то, как песня воспринимается в видении, но не утверждает, что она не была действительно новой.'
- issue: Передача ἠγορασμένοι
  choice: «куплен»
  alternative: «искуплен» или «выкуплен»
  rationale: В исходном тексте непосредственно использована торговая метафора «покупать». Вариант «искуплен» богословски возможен, но в основном тексте сильнее истолковывает эту метафору.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным синтаксисом. Повтор «перед» сохранён ради ясности и ритма. Тире поясняет, что заключительная характеристика относится к ста сорока четырём тысячам.
