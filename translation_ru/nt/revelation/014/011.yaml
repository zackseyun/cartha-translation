id: REV.14.11
reference: Revelation 14:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: ru
  text: И дым их мучения поднимается во веки веков[a], и нет покоя ни днём, ни ночью тем, кто поклоняется зверю и его образу, — и если кто принимает начертание его имени[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в веки веков».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь резко переходит к словам «и если кто принимает начертание его имени». По смыслу они, вероятно, продолжают описание тех, кто подвергается суду; возможен более гладкий перевод: «и всякий, кто принимает».'
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: дым
  rationale: Прямой и естественный эквивалент, сохраняющий конкретный апокалиптический образ.
- source_word: βασανισμοῦ
  choice: мучения
  rationale: Передаёт тягостное карательное страдание в данном контексте, не уточняя способ причинения боли.
- source_word: εἰς αἰῶνας αἰώνων
  choice: во веки веков
  rationale: Устоявшаяся и естественная русская передача усиленной формулы длительности; буквальная структура пояснена в сноске.
- source_word: ἀναβαίνει
  choice: поднимается
  rationale: Сохраняет настоящее время и наглядный образ непрерывно восходящего дыма.
- source_word: ἀνάπαυσιν
  choice: покоя
  rationale: Прямой эквивалент, сохраняющий широкий смысл отдыха и избавления от тяготы.
- source_word: ἡμέρας καὶ νυκτός
  choice: ни днём ни ночью
  rationale: В сочетании с отрицанием это естественно выражает непрерывное отсутствие покоя.
- source_word: προσκυνοῦντες
  choice: поклоняется
  rationale: В Откровении обозначает поклонение и религиозную преданность, а не только телесный поклон.
- source_word: θηρίον
  choice: зверю
  rationale: Традиционный и точный эквивалент в апокалиптической образности Откровения.
- source_word: εἰκόνα
  choice: образу
  rationale: Сохраняет широту значения греческого слова и устойчивую лексику данного контекста.
- source_word: εἴ τις λαμβάνει
  choice: если кто принимает
  rationale: Сохраняет резкий переход греческого текста от множественного причастного оборота к условно-обобщающей конструкции в единственном числе.
- source_word: χάραγμα
  choice: начертание
  rationale: Устоявшийся русский термин для опознавательного знака в Откровении, более контекстуально точный, чем общее «знак».
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: его имени
  rationale: Формально сохраняет родительную конструкцию, не превращая её в пояснительную перифразу.
theological_decisions:
- issue: Длительность суда в выражении εἰς αἰῶνας αἰώνων
  choice: во веки веков
  alternative: на веки веков / в веки веков
  rationale: Формула передана как сильнейшее идиоматическое выражение непрекращающейся длительности в Откровении, без привнесения дополнительной догматической схемы; буквальная форма отмечена в сноске.
- issue: Синтаксис и охват заключительной конструкции εἴ τις λαμβάνει
  choice: сохранён условный оборот «и если кто принимает»
  alternative: «и тот, кто принимает» или «и всякий, кто принимает»
  rationale: Греческий текст резко переходит от множественного причастия к неопределённому условному обороту в единственном числе. Перевод сохраняет эту неровность и не решает молча, является ли последняя часть строго однородным определением или добавочным общим условием.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Тире помогает читателю связать последующее описание с местоимением «им», но заключительный условный оборот намеренно не сглажен. Все местоимения о звере даны со строчной буквы.
