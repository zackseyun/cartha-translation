  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: ru
  text: И сидящий на облаке[c] опустил свой серп на землю[a], и земля была пожата[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «бросил» или «метнул свой серп на землю». В контексте жатвы речь идёт о том, что серп был приведён в действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «земля была сжата».'
    reason: lexical_alternative
  - marker: c
    text: Сидящего на облаке, исходя из предыдущего стиха, часто отождествляют с Сыном Человеческим; однако здесь он назван лишь «сидящим на облаке».
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: пустил
  rationale: Глагол βάλλω буквально означает «бросить, метнуть», однако при слове «серп» в сцене жатвы обозначает приведение серпа в действие. «Пустил свой серп по земле» естественно передаёт движение орудия, не устраняя конкретный образ.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: тот, кто сидел на облаке
  rationale: Описательный перевод субстантивированного причастия сохраняет формулировку стиха и не вводит в основной текст истолкование личности сидящего.
- source_word: νεφέλης
  choice: облаке
  rationale: 'Определённость передана с учётом контекста: речь идёт об облаке, уже упомянутом в предыдущем стихе; отдельный русский артикль не требуется.'
- source_word: δρέπανον
  choice: серп
  rationale: «Серп» — общепонятное и точное название орудия жатвы, сохраняющее сельскохозяйственный и судебный образ.
- source_word: ἐπὶ τὴν γῆν
  choice: по земле
  rationale: Предлог ἐπί с винительным указывает на направленность действия к земле; в сочетании с серпом русское «по земле» естественно изображает охватывающее землю движение жатвы.
- source_word: ἐθερίσθη
  choice: была пожата
  rationale: Пассивная форма аориста сохранена; «пожата» точно передаёт завершившуюся жатву и словесную связь с серпом.
- source_word: ἡ γῆ
  choice: земля
  rationale: В апокалиптическом контексте имеется в виду земля в широком, а не локальном смысле. Повтор слова сохранён.
theological_decisions:
- issue: Личность жнеца, сидящего на облаке
  choice: 'Описать его только словами самого стиха: «тот, кто сидел на облаке».'
  alternative: Прямо назвать его Сыном Человеческим, Мессией или ангельским исполнителем.
  rationale: Предыдущий контекст связывает образ с подобным Сыну Человеческому, однако данный стих сам по себе не повторяет этого наименования. Описательный перевод сохраняет богословскую напряжённость и не делает спорное отождествление частью текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; повтор «земля» и пассивная конструкция оригинала сохранены.
