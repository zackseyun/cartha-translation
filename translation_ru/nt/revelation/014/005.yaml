  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: ru
  text: И в их устах не нашлось лжи; они безупречны[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непорочны» или «без порока». Греческое слово может обозначать как нравственную безупречность, так и отсутствие порока у жертвенного животного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: в их устах
  rationale: Естественное для современного русского языка выражение о содержании речи. Множественное «устах» идиоматично передаёт греческое единственное число с собирательным значением.
- source_word: οὐχ εὑρέθη
  choice: не нашлось
  rationale: Безличная конструкция сохраняет пассивную направленность греческого аориста и акцентирует отсутствие лжи, не превращая высказывание в активный пересказ.
- source_word: ψεῦδος
  choice: лжи
  rationale: «Ложь» — прямой и понятный эквивалент, обозначающий неправду в речи; «обман» сильнее подчёркивал бы намерение обмануть.
- source_word: ἄμωμοί
  choice: безупречны
  rationale: Слово передаёт нравственную незапятнанность ясным современным языком, а возможный оттенок жертвенной чистоты сохраняется в сноске.
- source_word: καὶ
  choice: И
  rationale: Союз сохранён, поскольку стих продолжает предыдущее описание этой группы людей.
theological_decisions:
- issue: Передача ἄμωμοί с сохранением нравственного и жертвенно-культового оттенков без усиления до утверждения абсолютной безгрешности
  choice: безупречны
  alternative: непорочны; без порока
  rationale: «Безупречны» естественно выражает отсутствие основания для обвинения и нравственную цельность. Варианты «непорочны» и «без порока» заметнее передают образ жертвенной чистоты, поэтому они указаны в сноске, не устраняя смысловой многозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка «в их устах» сохраняет достоинство стиля, оставаясь понятной обычному читателю.
