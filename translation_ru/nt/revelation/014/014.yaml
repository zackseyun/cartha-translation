reference: Revelation 14:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: ru
  text: 'И увидел я — и вот: белое облако, а на облаке сидел некто, подобный сыну человеческому[a]. На голове у него был золотой венец[b], а в руке — острый серп.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобный Сыну Человеческому». Эти слова перекликаются с Дан. 7:13 и часто понимаются как мессианский титул, хотя в греческом тексте здесь буквально стоит безартиклевая фраза «подобный сыну человеческому».'
    reason: alternative_reading
  - marker: b
    text: Греческое слово στέφανος обозначает венец или венок, нередко венок победителя, а не царскую диадему.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Сохраняет внезапный призыв обратить внимание, характерный для повествования о видении, и естественно звучит в современном литературном русском языке.
- source_word: νεφέλη λευκή
  choice: белое облако
  rationale: Прямо передаёт обычные значения существительного и прилагательного, не заменяя «белое» толкованием «светлое» или «сияющее».
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: на облаке сидел некто
  rationale: Естественно передаёт положение изображённой фигуры; слово «некто» восполняет подразумеваемое лицо при субстантивированном причастном обороте.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: некто, подобный сыну человеческому
  rationale: Сохраняет неопределённость безартиклевой греческой фразы и отсылку к Даниилу 7:13, не превращая её в основном тексте в явно оформленный титул.
- source_word: στέφανον χρυσοῦν
  choice: золотой венец
  rationale: «Венец» естественно соответствует στέφανος и, в отличие от «диадемы», не приписывает слову исключительно царское значение; золотой материал передан прямо.
- source_word: δρέπανον ὀξύ
  choice: острый серп
  rationale: Точное и понятное обозначение орудия жатвы, соответствующее ближайшему контексту.
theological_decisions:
- issue: Следует ли передавать υἱὸν ἀνθρώπου как однозначный христологический титул
  choice: 'В основном тексте: «некто, подобный сыну человеческому»'
  alternative: «некто, подобный Сыну Человеческому»
  rationale: В греческом перед υἱὸν нет артикля, поэтому основной текст не усиливает выражение до фиксированного титула. Вместе с тем явная перекличка с Даниилом 7:13 и распространённое мессианское понимание отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, уместным для апокалиптического видения строем речи. Инверсия «увидел я» поддерживает ритм видения, а тире и двоеточие делают многократные греческие καί естественными по-русски, не устраняя последовательность образов.
