id: REV.14.9
reference: Revelation 14:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: ru
  text: 'И другой ангел, третий, последовал за ними и громко сказал: «Если кто поклоняется[a] зверю и его образу и принимает начертание на свой лоб или на свою руку[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склоняется перед зверем и его образом». Греческий глагол может обозначать земной поклон, но здесь выражает поклонение и преданность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на его лоб или на его руку». Местоимение мужского рода в греческом употреблено обобщённо после слова «кто».'
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: ещё один ангел, третий
  rationale: 'Переданы и ἄλλος, и порядковое τρίτος: это ещё один ангел, третий в последовательности видения.'
- source_word: ἠκολούθησεν αὐτοῖς
  choice: последовал за ними
  rationale: Естественно передаёт прямое повествовательное значение ἀκολουθέω и последовательность явлений.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: громко сказал
  rationale: Современная и естественная русская формулировка, сохраняющая смысл публичного провозглашения громким голосом.
- source_word: Εἴ τις
  choice: Кто
  rationale: В русской условной конструкции «кто …, тот …» это естественный эквивалент греческого «если кто»; продолжение условия находится в следующем стихе.
- source_word: προσκυνεῖ
  choice: поклоняется
  rationale: В данном контексте означает религиозное почитание и верноподданническую преданность зверю, а не только телесный поклон.
- source_word: τὸ θηρίον
  choice: зверю
  rationale: Устоявшийся и контекстуально точный русский эквивалент апокалиптического θηρίον.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: его образу
  rationale: Русское «зверь» мужского рода, поэтому местоимение «его» естественно соотносится со зверем, не добавляя отдельного толкования.
- source_word: λαμβάνει χάραγμα
  choice: принимает начертание
  rationale: «Принимает» выражает получение или принятие знака, а «начертание» сохраняет характерный для Откровения смысл нанесённого опознавательного знака.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: на свой лоб или на свою руку
  rationale: Возвратное притяжательное местоимение естественно связывает обе части тела с неопределённым лицом и сохраняет единственное число.
theological_decisions:
- issue: Религиозный смысл προσκυνέω по отношению к зверю
  choice: поклоняется
  alternative: склоняется перед
  rationale: Контекст говорит об идолопоклонстве и преданности зверю; «поклоняется» сохраняет богословскую серьёзность действия, тогда как альтернативу можно понять лишь как телесный жест.
- issue: Соотнесение αὐτοῦ в выражении τὴν εἰκόνα αὐτοῦ
  choice: его образу
  alternative: образу зверя
  rationale: Местоименная связь сохранена без избыточного повтора. Грамматический мужской род русского слова «зверь» не утверждает дополнительного биологического или личностного смысла.
- issue: Единственное число при неопределённом τις
  choice: на свой лоб или на свою руку
  alternative: на лоб или на руку
  rationale: Возвратные формы сохраняют индивидуальную отнесённость греческого единственного числа и при этом звучат естественно и гендерно нейтрально по-русски.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокалиптического провозглашения. Синтаксис слегка сглажен: «громко сказал» вместо буквального «говоря громким голосом». Незавершённая условная конструкция и заключительная запятая сохранены, поскольку предложение продолжается в Откр. 14:10.'
