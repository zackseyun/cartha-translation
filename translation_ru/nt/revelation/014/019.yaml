  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: ru
  text: И ангел взмахнул своим серпом над землёй, собрал виноград с лозы земли и бросил его в великое точило Божьего гнева.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: взмахнул своим серпом над землёй
  rationale: В контексте жатвы ἔβαλεν с серпом обозначает направленное рабочее движение. «Взмахнул» естественно по-русски и не создаёт впечатления, будто ангел выбросил серп или вонзил его в почву; εἰς τὴν γῆν передано контекстуально как направленность действия на землю.
- source_word: ἐτρύγησεν
  choice: собрал виноград
  rationale: Глагол означает сбор урожая, особенно винограда; явное обозначение винограда делает образ естественным в современном русском языке.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: с земной лозы
  rationale: Сохраняет образ виноградной лозы и родительный оборот «земли», передавая его естественным русским определением «земной».
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: в великое точило
  rationale: «Точило» — традиционное и точное обозначение ёмкости для давки винограда; согласование «великий» следует греческому определению и подчёркивает масштаб образа.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: Божьего гнева
  rationale: Передаёт θυμός как сильный гнев в эсхатологическом образе суда, без добавочного конфессионального истолкования.
theological_decisions:
- issue: Объект суда в образе земной виноградной лозы
  choice: Не уточнять, кого именно символизирует лоза
  alternative: Добавить «нечестивых» или «людей земли»
  rationale: Греческий текст оставляет символический образ без прямой расшифровки; перевод сохраняет эту богословскую напряжённость.
- issue: Связь точила с Божьим гневом
  choice: Сохранить метафору «точило Божьего гнева»
  alternative: Развернуть как «точило, символизирующее Божий гнев»
  rationale: Прямой родительный оборот сохраняет силу и многозначность апокалиптического образа.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного апокалиптического образа. «Точило» выбрано как понятное в библейском контексте традиционное слово; синтаксис сделан плавным и доступным.
