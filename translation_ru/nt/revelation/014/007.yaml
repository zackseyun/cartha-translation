id: REV.14.7
reference: Revelation 14:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: ru
  text: 'говоря громким голосом: «Бойтесь Бога[a] и воздайте Ему славу, потому что настал час Его суда; поклонитесь Тому, Кто сотворил небо, землю, море и источники вод[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благоговейте перед Богом». Греческий глагол может обозначать как благоговейный страх, так и страх перед лицом суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «источники воды». Буквально в греческом: «источники вод».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: говоря громким голосом
  rationale: Причастная конструкция сохраняет связь с предыдущим стихом, а оборот «громким голосом» естественно и близко передаёт греческое выражение.
- source_word: Φοβήθητε τὸν θεὸν
  choice: Бойтесь Бога
  rationale: «Бойтесь» сохраняет присущее контексту сочетание благоговения и страха перед грядущим судом, не сводя смысл ни к одному лишь почтению, ни к одному лишь ужасу.
- source_word: δότε αὐτῷ δόξαν
  choice: воздайте Ему славу
  rationale: Устойчивое и достойное русское выражение точно передаёт призыв признать и провозгласить Божью славу.
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: потому что настал час Его суда
  rationale: «Потому что» передаёт причинное значение ὅτι, «час» сохраняет апокалиптическую конкретность ὥρα, а «Его суда» оставляет ёмкость греческого генитива.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: поклонитесь Тому, Кто сотворил
  rationale: «Поклонитесь» передаёт религиозное поклонение, обычное для προσκυνέω в Откровении; относительная конструкция естественно воспроизводит субстантивированное причастие.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: небо, землю, море и источники вод
  rationale: Перечень сохраняет отзвук языка творения, а «источники вод» отражает множественное число ὑδάτων и возвышенный стиль оригинала.
theological_decisions:
- issue: Характер повеления Φοβήθητε τὸν θεόν
  choice: Бойтесь Бога
  alternative: Благоговейте перед Богом
  rationale: В контексте суда, прославления и поклонения глагол объединяет благоговение и страх. Основной вариант сохраняет это богословское напряжение, а примечание указывает более мягкую возможную передачу.
- issue: Значение τῆς κρίσεως αὐτοῦ
  choice: Его суда
  alternative: суда, который Он совершит
  rationale: 'Краткая конструкция сохраняет возможную смысловую ёмкость генитива: суд принадлежит Богу и исходит от Него; развёрнутый вариант неоправданно уточнил бы отношение.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения и формы «Тому, Кто» употреблены как уважительная издательская конвенция. Перечень оформлен без многократного союза «и», поскольку такая форма естественнее по-русски и не меняет состава созданного мира.
