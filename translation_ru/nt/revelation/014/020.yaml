source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: ru
  text: И давильню топтали вне города, и из давильни вытекла кровь — до узд коней, на протяжении тысячи шестисот стадиев.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стадий — древняя мера расстояния; тысяча шестьсот стадиев — примерно 296 километров.
    reason: cultural_note
  - marker: b
    text: 'Или: «и из давильни вышла кровь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: была истоптана
  rationale: Пассивная форма πατέω буквально передаёт топтание винограда ногами и сохраняет образ давильни.
- source_word: ληνός / ληνοῦ
  choice: давильня
  rationale: Устоявшееся русское обозначение места, где давят виноград; оно сохраняет образ жатвы и суда.
- source_word: ἔξωθεν τῆς πόλεως
  choice: вне города
  rationale: Естественное и близкое к греческому пространственное выражение в возвышенном повествовательном регистре.
- source_word: ἐξῆλθεν αἷμα
  choice: кровь вышла
  rationale: Буквально сохраняет значение ἐξέρχομαι — «выходить»; подразумеваемое течение не вносится непосредственно в эту часть текста.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: поднявшись до узд коней
  rationale: Передаёт предел, выраженный ἄχρι, и делает образ уровня крови ясным по-русски.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: разлившись на тысячу шестьсот стадиев
  rationale: ἀπό с указанием расстояния передано как протяжённость; добавление «разлившись» естественно связывает меру расстояния с кровью, не заменяя древнюю единицу современной.
theological_decisions:
- issue: Сохранять ли гиперболически-апокалиптический образ или объяснить его символический смысл
  choice: Сохранить конкретный образ крови до узд коней на протяжении 1 600 стадиев
  alternative: Перефразировать как символ всепоглощающего суда
  rationale: Исходный текст намеренно использует яркий и устрашающий образ; перевод не должен заранее определять или смягчать его символическое значение.
- issue: Относится ли мера 1 600 стадиев к протяжённости потока крови
  choice: Передать её как расстояние, на которое разлилась кровь
  alternative: Сохранить формальное «от 1 600 стадиев», неясное по-русски
  rationale: Греческое ἀπὸ σταδίων χιλίων ἑξακοσίων идиоматически указывает здесь на протяжённость; русский текст выражает эту связь явно, не превращая её в богословское толкование.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Конкретная апокалиптическая образность сохранена; «давильня» понятно передаёт виноградный пресс, а «истоптана» удерживает буквальный образ топтания ногами.
