    rationale: Эта пассивная конструкция в русском может означать, что саму давильню затоптали или повредили. Греческое ἐπατήθη в контексте ληνός означает топтание в давильне при отжиме; неопределённо-личное «давильню топтали» сохраняет действие и звучит яснее.
  - severity: medium
