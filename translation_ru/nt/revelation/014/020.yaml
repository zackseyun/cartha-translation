revisions:
- from: И давильня была истоптана вне города, и кровь вышла из давильни, поднявшись до узд коней и разлившись на тысячу шестьсот стадиев.[a][b]
  to: И давильню топтали вне города, и из давильни вытекла кровь — до узд коней, на протяжении тысячи шестисот стадиев.[a][b]
  rationale: Перевод исправлен для естественного русского выражения действия в давильне и для устранения добавленных деепричастных деталей. «Вытекла» — нормальный русский способ передать выход жидкости, тогда как сноска сохраняет более формально близкий вариант «вышла». Апокалиптическая образность и исходная мера расстояния сохранены без толкования.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:35:39Z'
review_pass:
  verdict: revise
  source_fidelity: В черновике сохранены все основные элементы греческого текста, однако «была истоптана» по-русски скорее описывает повреждение давильни, а деепричастия «поднявшись» и «разлившись» добавляют способ и последовательность действия, не выраженные прямо в оригинале. Исправленный текст передаёт пассивное «давильню топтали» естественной неопределённо-личной конструкцией и сохраняет пространственный масштаб образа.
  naturalness: '«Давильню топтали» и «из давильни вытекла кровь» звучат в современном литературном русском естественнее, чем «давильня была истоптана» и «кровь вышла». Тире ясно связывает два параметра образа: высоту до узд и протяжённость в 1 600 стадиев.'
  terminology: «Давильня» допустима как современное наименование виноградного пресса. «Узды коней» точно передаёт τῶν χαλινῶν τῶν ἵππων. «Стадий» сохранён как древняя мера; конверсия вынесена в примечание.
