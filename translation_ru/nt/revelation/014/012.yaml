source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: ru
  text: 'Вот в чём — стойкость святых: они хранят заповеди Бога и веру Иисуса[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «веру в Иисуса»; другой возможный перевод: «верность Иисуса». Греческое выражение допускает разные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: В этом
  rationale: Указательное наречие отсылает к только что описанным обстоятельствам. «В этом» естественно передаёт смысл «здесь проявляется / вот в чём», не добавляя пояснения в основной текст.
- source_word: ὑπομονὴ
  choice: стойкость
  rationale: Слово обозначает упорное, терпеливое постоянство в испытаниях. «Стойкость» звучит естественно и ёмко; «терпение» могло бы ослабить оттенок деятельной верности.
- source_word: ἁγίων
  choice: святых
  rationale: Обычное новозаветное обозначение принадлежащего Богу народа; традиционно и понятно в современном русском языке.
- source_word: τηροῦντες
  choice: хранят
  rationale: Глагол относится и к заповедям, и к вере. «Хранят» позволяет сохранить единое управление и передаёт верное соблюдение заповедей и сохранение веры без повторения или смыслового сужения.
- source_word: ἐντολὰς
  choice: заповеди
  rationale: Передаёт обязательные Божьи повеления и сохраняет уместное библейское звучание.
- source_word: πίστιν
  choice: веру
  rationale: Основное и наиболее нейтральное соответствие πίστις; возможный оттенок «верность» отмечен в сноске из-за неоднозначности всей генитивной конструкции.
- source_word: Ἰησοῦ
  choice: Иисуса
  rationale: Родительный падеж буквально сохраняет греческую конструкцию и не решает без достаточных оснований, означает ли она веру в Иисуса или веру/верность Иисуса.
theological_decisions:
- issue: Значение τὴν πίστιν Ἰησοῦ
  choice: веру Иисуса
  alternative: веру в Иисуса; верность Иисуса
  rationale: Греческий родительный допускает как объектное понимание («вера в Иисуса»), так и субъектное («вера/верность Иисуса»). Основной текст сохраняет эту напряжённость близкой к форме оригинала, а ясные истолковательные варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире после «В этом» передаёт риторическое выделение греческой формулы; придаточное с «которые» естественно выражает пояснительное приложение οἱ τηροῦντες.
