id: REV.14.17
reference: Revelation 14:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: ru
  text: И другой ангел вышел из храма, находящегося на небе[a]; у него тоже был острый серп.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из святилища, находящегося на небе». Греческое слово ναός может обозначать, в частности, внутреннюю, священную часть храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: другой ангел
  rationale: ἄλλος обозначает ещё одного ангела в последовательности небесных посланников; «другой ангел» естественно и точно передаёт это значение.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Аорист ἐξέρχομαι описывает движение изнутри наружу; «вышел из храма» — прямое и естественное русское выражение.
- source_word: ναοῦ
  choice: храма
  rationale: ναός может обозначать храм, а более узко — его священную внутреннюю часть. В основном тексте выбрано общеупотребительное «храм», а более узкий вариант отмечен в сноске.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: находящегося на небе
  rationale: Определительная конструкция прямо указывает, что храм находится на небе. Причастный оборот сохраняет эту связь и не превращает образ в толкование.
- source_word: ἔχων καὶ αὐτὸς
  choice: у него тоже был
  rationale: Конструкция подчёркивает, что этот ангел, подобно упомянутому ранее, также имеет серп. Русская предикативная конструкция передаёт акцент естественнее буквального причастного оборота.
- source_word: δρέπανον ὀξύ
  choice: острый серп
  rationale: δρέπανον — серп, орудие жатвы, а ὀξύ указывает на его остроту; сочетание «острый серп» ясно сохраняет образ оригинала.
theological_decisions:
- issue: Образ небесного храма
  choice: Передать ναός как «храм», не поясняя природу образа.
  alternative: «святилище» или истолковательный пересказ как символического небесного жилища
  rationale: Апокалиптический образ следует сохранить без решения вопроса, является ли храм архитектурным, символическим или литургическим образом. Вариант «святилище» дан как лексическая альтернатива, а не как навязанное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и лаконичности апокалиптического повествования. Точка с запятой ясно связывает действие ангела с сообщением о серпе, не утяжеляя фразу буквальным причастным оборотом.
