id: REV.14.10
reference: Revelation 14:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: ru
  text: тот тоже будет пить вино ярости Божьей, приготовленное неразбавленным в чаше Его гнева[a], и будет мучим огнём и серой перед святыми ангелами и перед Агнцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально сочетание греческих слов объединяет идеи приготовленного (или смешанного) вина и вина неразбавленного; образ подчёркивает, что суд ничем не ослаблен.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: тот тоже
  rationale: Указательное «тот» возвращает к человеку, описанному в предыдущем стихе, а «тоже» передаёт присоединительное καί и эмфатическое αὐτός без тяжеловесности.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: будет пить вино
  rationale: Будущее время передано прямо; в современном русском партитивный образ источника естественно выражается без буквального и неидиоматичного «пить от вина».
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: ярости Божьей
  rationale: «Ярость» передаёт интенсивность θυμός и позволяет отличить его от ὀργή далее в стихе.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: приготовленное неразбавленным
  rationale: «Приготовленное» передаёт результативный смысл перфектного причастия κεκερασμένου, а «неразбавленным» — ἀκράτου; сочетание сохраняет намеренное напряжение древнего образа вина, приготовленного без ослабления водой.
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: в чаше Его гнева
  rationale: «В чаше» прямо передаёт ἐν τῷ ποτηρίῳ, а «гнев» сохраняет смысл ὀργή и его отличие от ранее употреблённого θυμός.
- source_word: βασανισθήσεται
  choice: будет мучим
  rationale: Форма передаёт будущее пассивное действие и суровый карательный смысл, оставаясь естественной для возвышенного библейского регистра.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: огнём и серой
  rationale: Творительный падеж естественно обозначает средство мучения; «сера» — точный и современный эквивалент θείον.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: перед святыми ангелами и перед Агнцем
  rationale: Повтор «перед» сохраняет анафору исходного текста; «Агнец» является устойчивым и понятным обозначением центрального образа Откровения.
theological_decisions:
- issue: Различение θυμός и ὀργή в одном стихе
  choice: θυμός — «ярость», ὀργή — «гнев»
  alternative: Передать оба слова как «гнев» либо θυμός как «гнев», а ὀργή как «ярость»
  rationale: Исходный текст намеренно ставит рядом два близких, но разных слова. Разные русские соответствия сохраняют риторическое напряжение, не превращая различие в жёсткое догматическое разграничение.
- issue: Сочетание κεκερασμένου ἀκράτου
  choice: «приготовленное неразбавленным» с пояснением
  alternative: «смешанное неразбавленным» или более толковательное «налитое в полную силу»
  rationale: Выбранный вариант сохраняет одновременно идеи приготовления вина и отсутствия разбавления, не устраняя необычность исходной формулировки и не создавая в основном тексте резкого словесного противоречия.
- issue: Сцена мучения перед ангелами и Агнцем
  choice: Сохранить простое пространственно-свидетельское «перед»
  alternative: Истолковать как «в присутствии» либо уточнить роль наблюдающих
  rationale: ἐνώπιον обозначает нахождение перед кем-либо или в чьём-либо присутствии, но само по себе не определяет точную роль ангелов и Агнца; перевод не добавляет такого толкования.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным апокалиптическим звучанием. Формы «Божьей», «огнём», «серой» общеупотребительны; «Агнец» сохранён как узнаваемый библейский титул. Порядок образов и повтор «перед» следуют греческому тексту.
