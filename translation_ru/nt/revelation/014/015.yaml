id: REV.14.15
reference: Revelation 14:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: ru
  text: 'И другой ангел вышел из святилища и громким голосом воззвал к Сидящему на облаке: «Пусти в ход Свой серп и жни, потому что пришёл час жатвы: созрела жатва земли».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: святилище
  rationale: Обозначает храмовое святилище, а не весь храмовый комплекс; такой перевод сохраняет смысловое отличие от ἱερόν.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Пусти в ход Свой серп
  rationale: Буквально πέμπω значит «послать», но в сочетании с серпом это идиома побуждения применить его; выбран естественный русский эквивалент без добавления нового действия.
- source_word: ἐξηράνθη ὁ θερισμός
  choice: созрела жатва
  rationale: Буквально глагол означает «высохла», однако применительно к жатве выражает полную готовность к уборке. «Созрела» естественно передаёт контекстуальный смысл, не усиливая его до «перезрела».
theological_decisions:
- issue: Повеление ангела Сидящему на облаке
  choice: сохранена прямая повелительная форма «Пусти… и жни»
  alternative: 'смягчить как просьбу: «Пожалуйста, пусти…» или «Настало время Тебе пожать»'
  rationale: Греческий текст употребляет два императива; необычная богословская напряжённость сцены не должна устраняться переводом.
- issue: Образ готовой жатвы земли
  choice: «созрела жатва земли»
  alternative: «перезрела жатва земли» или буквальное «высохла жатва земли»
  rationale: Текст указывает на готовность жатвы, но сам по себе не требует идеи перезрелости; буквальное «высохла» в современном русском способно ошибочно обозначать гибель урожая.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Причастное обозначение «Сидящему» и местоимение «Свой» написаны с прописной буквы как уважительное указание на небесную фигуру, без более точного догматического отождествления.
