revisions:
- from: 'И услышал я голос с неба, говоривший: «Напиши: блаженны умершие, которые отныне умирают в Господе». «Да, — говорит Дух, — чтобы они отдохнули от своих трудов, ведь дела их следуют вместе с ними».[a]'
  to: 'И услышал я голос с неба, говорящий: «Напиши: блаженны умершие — те, кто отныне умирает в Господе». «Да, — говорит Дух, — они отдохнут[a] от своих трудов, ибо их дела сопровождают их».'
  rationale: 'Исправление устраняет две заметные проблемы естественности, не меняя смысла: блаженство относится к умершим, которые отныне умирают в Господе; Дух подтверждает, что они обретут отдых; их дела сопровождают их. Сноска перенесена к действительно неоднозначной конструкции и снабжена корректным якорем.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:35:48Z'
review_pass:
  verdict: revise
  source_fidelity: Основной смысл передан верно, включая «в Господе», «отныне» и связь дел с умершими. Однако сочетание «умершие, которые отныне умирают» тяжеловесно и логически спотыкается в русском, а придаточное «чтобы они отдохнули» после прямой речи Духа остаётся синтаксически неуправляемым. Более естественное русское будущее «они отдохнут» передаёт будущую форму ἀναπαήσονται; спорный целевой/результативный оттенок отмечен сноской.
  naturalness: Исправленный текст сохраняет торжественный библейский регистр, но звучит как современный литературный русский. «Умершие — те, кто…» намеренно воспроизводит напряжённое сочетание οἱ νεκροὶ с настоящим причастием, не превращая его в негладкую относительную конструкцию. «Их дела сопровождают их» естественно выражает смысл ἀκολουθεῖ μετ’ αὐτῶν — сопровождение, без предположения о механизме этого сопровождения.
  terminology: «Блаженны», «в Господе» и «Дух» сохранены. «Дела» остаётся широким соответствием ἔργα и не навязывает учение о заслуге.
  issues:
  - severity: medium
    issue: Неестественное сочетание «умершие, которые отныне умирают».
    rationale: Оно формально отражает греческую конструкцию, но в русском создаёт ненужное логическое противоречие. Приложение через тире («умершие — те, кто…») сохраняет оба элемента оригинала и делает высказывание читаемым.
  - severity: medium
    issue: Синтаксически незавершённое «Да, — говорит Дух, — чтобы они отдохнули».
    rationale: Русский союз «чтобы» обычно требует главной части; в данном расположении она отсутствует. Будущее изъявительное «они отдохнут» прямо передаёт форму ἀναπαήσονται, а сноска сохраняет возможный целевой/результативный нюанс ἵνα.
  - severity: low
    issue: Сноска объединяет неясное утверждение о пунктуации и лексический вариант, но не поясняет основной синтаксический вопрос ἵνα.
    rationale: В SBLGNT союз ἵνα с будущим изъявительным действительно допускает обсуждение цели/результата; это уместнее отметить у перевода «отдохнут». Формулировка о пунктуации не нужна для понимания русского текста.
