id: REV.14.13
reference: Revelation 14:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: ru
  text: 'И услышал я голос с неба, говорящий: «Напиши: блаженны умершие — те, кто отныне умирает в Господе». «Да, — говорит Дух, — они отдохнут[a] от своих трудов, ибо их дела сопровождают их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они отдохнули». Греческий союз может выражать цель или результат.'
    reason: Сохраняет спорный целевой/результативный оттенок конструкции ἵνα с будущим изъявительным, не создавая в основном русском тексте синтаксической неполноты.
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: голос с неба, говоривший
  rationale: Сохраняет источник голоса и причастную конструкцию, оставаясь естественным для современного русского языка.
- source_word: Γράψον
  choice: Напиши
  rationale: Прямой аористный императив в единственном числе; дополнение не добавляется.
- source_word: Μακάριοι
  choice: блаженны
  rationale: Традиционная и понятная формула блаженства, соответствующая торжественному регистру.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: умершие, которые отныне умирают в Господе
  rationale: «Умершие» естественно передаёт οἱ νεκροί, а «умирают в Господе» сохраняет настоящее причастие и богословскую ёмкость ἐν κυρίῳ.
- source_word: ἀπ’ ἄρτι
  choice: отныне
  rationale: Кратко и точно передаёт временную точку отсчёта, сохраняя торжественный тон.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: Да, — говорит Дух
  rationale: Сохраняет emphатическое подтверждение и явно названного говорящего.
- source_word: ἵνα ἀναπαήσονται
  choice: чтобы они отдохнули
  rationale: Передаёт целевой или результативный оттенок ἵνα; русское прошедшее совершенного вида после «чтобы» естественно выражает ожидаемый итог и не является указанием на прошлое время.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: от своих трудов
  rationale: «Труды» охватывают изнурительную работу и тяготы, не сводя значение только к страданию.
- source_word: τὰ γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν
  choice: ведь дела их следуют вместе с ними
  rationale: «Дела» естественно передаёт ἔργα, а «вместе с ними» явно сохраняет значение μετά.
theological_decisions:
- issue: Значение выражения ἐν κυρίῳ
  choice: в Господе
  alternative: верные Господу; принадлежащие Господу
  rationale: Буквально-естественная передача сохраняет возможные оттенки единения, принадлежности и верности, не выбирая один из них.
- issue: Сила конструкции ἵνα ἀναπαήσονται
  choice: чтобы они отдохнули
  alternative: так что они отдохнут; и они отдохнут
  rationale: Формулировка сохраняет целевой/результативный оттенок, не устраняя синтаксическую напряжённость греческой конструкции с будущим изъявительным.
- issue: Связь дел с умершими
  choice: дела их следуют вместе с ними
  alternative: дела их следуют за ними
  rationale: Текст утверждает сопровождение делами, но не объясняет его механизм и не формулирует учение о заслуге; перевод этого не добавляет.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским звучанием. Сохранены «блаженны», «в Господе» и «Дух» как узнаваемые богословски ёмкие выражения; архаические формы избегаются. Маркер сноски помещён в основном тексте.
