  - severity: medium
    issue: Тире перед универсальным перечнем адресатов
    rationale: В оригинале δεύτεое καὶ ἐπὶ присоединяет адресатов союзом «и», а не вводит пояснение. Русское «и каждой...» точнее сохраняет координацию.
  - severity: low
