source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: ru
  text: И увидел я другого ангела, летящего посреди неба[a] и имеющего вечное Евангелие, чтобы возвестить его живущим на земле[b] и каждой нации, племени, языку и народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в вышине», «в зените»; греческое слово обозначает середину небесного пространства и характерно для апокалиптической образности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сидящим на земле»; в Откровении это выражение употребляется об обитателях земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: другого ангела
  rationale: «Другого» естественно передаёт ἄλλον и сохраняет последовательность видений; в апокалиптическом контексте ἄγγελος означает небесного ангела.
- source_word: πετόμενον ἐν μεσουρανήματι
  choice: летящего посреди неба
  rationale: Причастие передаёт продолжающееся движение, а «посреди неба» сохраняет характерный для Откровения образ открытого небесного пространства, оставаясь понятным современному читателю.
- source_word: εὐαγγέλιον αἰώνιον
  choice: вечное Евангелие
  rationale: Традиционное «Евангелие» сохраняет каноническое и богословское звучание εὐαγγέλιον, а «вечное» прямо передаёт αἰώνιον. Отсутствие артикля в греческом не требует в русском неопределённого местоимения.
- source_word: εὐαγγελίσαι
  choice: чтобы возвестить
  rationale: Инфинитив выражает цель; «возвестить» передаёт публичное провозглашение благой вести и избегает неестественного повтора «Евангелие, чтобы благовествовать».
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: живущим на земле
  rationale: Буквально выражение говорит о «сидящих на земле», но в Откровении оно идиоматически обозначает её обитателей; выбранный вариант не создаёт ложного акцента на позе.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: всякому племени, колену, языку и народу
  rationale: Четырёхчастная формула передаёт всеобщий охват. «Племя» для ἔθνος и «колено» для φυλή позволяют сохранить различие соседних понятий и библейский регистр.
theological_decisions:
- issue: Следует ли передавать εὐαγγέλιον традиционным церковным термином или общим выражением «благая весть»
  choice: вечное Евангелие
  alternative: вечная благая весть
  rationale: «Евангелие» сохраняет межтекстовые и богословские связи, не добавляя к греческому тексту конфессионального толкования; строчная или прописная буква в русском является редакционным решением, здесь избрана традиционная прописная.
- issue: Как передать образ καθημένους ἐπὶ τῆς γῆς
  choice: живущим на земле
  alternative: сидящим на земле
  rationale: Контекстуальный идиоматический перевод обозначает земных обитателей и не сводит апокалиптическую категорию к буквальной позе. Буквальная форма сохранена в примечании.
- issue: Как соотнести «живущим на земле» с последующим всеобщим перечнем
  choice: сохранить присоединение через тире
  alternative: соединить повторным союзом «и»
  rationale: Греческое καὶ ἐπὶ присоединяет поясняющий всеобщий перечень адресатов. Тире естественно показывает это разъяснение по-русски, не утверждая, будто речь идёт о двух взаимоисключающих группах.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Инверсия «И увидел я» сохраняет повествовательный ритм видения. Синтаксис разделён на два предложения ради ясности, при этом смысловая связь причастных конструкций сохранена.
