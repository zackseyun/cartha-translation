id: REV.14.2
reference: Revelation 14:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: ru
  text: И услышал я звук[a] с неба, подобный шуму множества вод[b] и грохоту сильного грома, — звук, который я услышал, был подобен звуку музыкантов, играющих на своих кифарах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово φωνή может означать как «звук», так и «голос»; здесь контекст не указывает однозначно на речь.
    reason: lexical_alternative
  - marker: b
    text: «Множество вод» — библейский образ мощного, всё заполняющего шума; ср. Иезекииль 43:2.
    reason: cross_reference
  - marker: c
    text: Кифара — древний струнный щипковый инструмент, близкий к лире; в переводах её также традиционно называют арфой.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: звук / шум
  rationale: В этом стихе слово обозначает слышимое явление, которое сравнивается с водами, громом и инструментальной музыкой. «Звук» не предполагает без достаточных оснований говорящего; в сочетании с водами естественное русское «шум» передаёт ту же акустическую реальность.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: с неба
  rationale: В контексте Откровения οὐρανός обозначает небесную сферу; «с неба» естественно и не сводит образ только к физическому небосводу.
- source_word: ὡς
  choice: подобный / подобен тому, как
  rationale: Обе формулировки ясно вводят сравнение и позволяют избежать тяжеловесного повторения «как» в современном русском тексте.
- source_word: ὑδάτων πολλῶν
  choice: множества вод
  rationale: Сохраняет традиционный библейский образ огромного, подавляющего шума и межтекстовую связь, не заменяя его толкованием вроде «бурного потока».
- source_word: βροντῆς μεγάλης
  choice: могучего грома
  rationale: Прилагательное μέγας передаёт силу и мощь грома; «могучий гром» естественно выражает интенсивность образа.
- source_word: κιθαρῳδῶν
  choice: музыканты
  rationale: Существительное обозначает исполнителей, связанных с кифарой; последующее причастие прямо уточняет, что они играют. «Музыканты» в сочетании с «играют на кифарах» понятно современному читателю и не вводит пение, которого контекст здесь не утверждает явно.
- source_word: κιθαριζόντων
  choice: играют
  rationale: Прямо и естественно передаёт действие игры на струнном инструменте без добавления способа звукоизвлечения.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: на своих кифарах
  rationale: Русское управление «играть на» соответствует норме; «своих» сохраняет αὐτῶν, а «кифара» точнее обозначает древний струнный инструмент, чем современная арфа.
theological_decisions:
- issue: Характер небесного звучания
  choice: Передать φωνή прежде всего как «звук», а при водах — естественным сочетанием «шум вод».
  alternative: Последовательно переводить φωνή как «голос» либо чередовать «голос» и «звук».
  rationale: Сравнения с водами, громом и инструментальной игрой подчёркивают акустический характер явления. «Звук» не приписывает его определённому говорящему, которого стих не называет, а примечание сохраняет возможное значение «голос».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор «звук» и образ «множества вод», но синтаксис сделан ясным для обычного современного читателя. Все примечания отмечены в основном тексте.
