  source_fidelity: 'В целом переданы все основные элементы греческого текста: небесное звучание, сравнения со многими водами и сильным громом, а также с исполнителями на кифарах. Однако «был подобен тому, как музыканты играют» сопоставляет звук с самим действием, тогда как греческое ὡς κιθαρῳδῶν κιθαριζόντων естественнее передать как звук исполнителей, играющих на инструментах. Также лучше сохранить явную связь двух частей, выраженную καί.'
