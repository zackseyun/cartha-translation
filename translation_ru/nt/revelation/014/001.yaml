id: REV.14.1
reference: Revelation 14:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: ru
  text: 'И увидел я: вот, Агнец стоит на горе Сион, и с Ним — сто сорок четыре тысячи; на лбах у них написаны Его имя и имя Его Отца.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «на лбах у них написано имя Его Отца».'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: И увидел я
  rationale: Сохраняет характерное для повествования о видениях продвижение через καί и прямое значение εἶδον; инверсия придаёт фразе естественный для русского библейского повествования возвышенный, но понятный тон.
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественный современный русский указатель, сохраняющий функцию привлечения внимания без излишне архаичного «се».
- source_word: τὸ ἀρνίον
  choice: Агнец
  rationale: Устоявшееся русское наименование Христа в Откровении; прописная буква указывает на титульное употребление, не добавляя отсутствующих в тексте толкований.
- source_word: ἑστὸς
  choice: стоит
  rationale: 'Перфектное причастие передаёт состояние: Агнец находится стоящим на Сионе. Русское настоящее время естественно в живом описании увиденного после вводного «увидел».'
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: на горе Сион
  rationale: Прямая и идиоматичная передача места; традиционная русская форма имени — «Сион».
- source_word: μετ’ αὐτοῦ
  choice: а с Ним —
  rationale: Восполняет подразумеваемую связку и ясно вводит сопутствующую группу. «А» обозначает переход к следующей части картины, не создавая сильного противопоставления.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: сто сорок четыре тысячи
  rationale: Точно сохраняет указанное число в нормативной русской форме.
- source_word: ἔχουσαι ... γεγραμμένον
  choice: на лбах у них написаны
  rationale: Перестройка греческой причастной конструкции в самостоятельную русскую часть предложения делает фразу ясной и сохраняет результативное состояние перфекта γεγραμμένον.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: Его имя и имя Его Отца
  rationale: Сохраняет два сочинённых объекта и тем самым не отождествляет явно имя Агнца с именем Отца.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: на лбах у них
  rationale: Естественно по-русски передаёт отмеченное место надписи и сохраняет образную связь с другими знаками на лбу в Откровении.
theological_decisions:
- issue: Кого обозначает τὸ ἀρνίον
  choice: Передано титулом «Агнец» без поясняющего добавления.
  alternative: «жертвенный Агнец» или «Христос-Агнец»
  rationale: Контекст книги связывает этот титул с Христом, однако дополнительные определения отсутствуют в стихе и сузили бы его образный богословский смысл.
- issue: Соотношение двух имён
  choice: «Его имя и имя Его Отца»
  alternative: «Его имя, то есть имя Его Отца»
  rationale: Греческий текст соединяет два наименования союзом καί и не оформляет их как приложение; перевод сохраняет различие Агнца и Отца, не предлагая сверх текста объяснения их взаимосвязи.
- issue: Текстовый вариант надписи
  choice: В основном тексте сохранено чтение SBLGNT с именем Агнца и именем Его Отца.
  alternative: Только «имя Его Отца»
  rationale: В ряде рукописей слова о собственном имени Агнца отсутствуют; существенный вариант отмечен в сноске, но не подменяет принятый исходный текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Архаичное «се» заменено на понятное «вот»; сохранён традиционный христологический титул «Агнец». Местоимения, относящиеся к Агнцу и Отцу, написаны с прописной буквы в соответствии с распространённой русской религиозно-издательской нормой.
