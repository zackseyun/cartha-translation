source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: ru
  text: 'И ещё один ангел вышел от жертвенника — обладающий властью над огнём — и громко воззвал к державшему острый серп: «Пошли свой острый серп[a] и собери гроздья виноградной лозы земли[b], ибо созрели её ягоды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусти в ход свой острый серп» (также возможно: «Запусти свой острый серп»). Греческий глагол буквально означает «послать», но в образе жатвы его можно передать идиоматически.'
    reason: lexical_alternative
  - marker: b
    text: «Виноградная лоза земли» — апокалиптический образ. Сам стих прямо не называет тех, кого он обозначает, хотя окружающий контекст говорит о суде.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: ещё один ангел
  rationale: В видениях Откровения ἄγγελος обычно обозначает ангельское существо, а ἄλλος продолжает последовательность действующих лиц.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: от жертвенника
  rationale: Сохраняет образ происхождения или выхода со стороны небесного жертвенника; русское «вышел от жертвенника» естественнее буквального «из жертвенника».
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: тот, у кого была власть над огнём
  rationale: Передаёт определительное причастие и значение полномочия или власти в отношении огня; прошедшее время естественно согласуется с русским повествованием.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: громко воззвал
  rationale: Естественно передаёт силу устойчивого оборота и сохраняет возвышенный регистр апокалиптического повествования.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: к державшему острый серп
  rationale: Причастная конструкция ясно определяет адресата; прилагательное «острый» сохранено ввиду его повторения в стихе.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Пошли свой острый серп
  rationale: «Пошли» формально передаёт πέμπω и сохраняет необычную образность исходного текста; идиоматическая альтернатива указана в сноске.
- source_word: τρύγησον τοὺς βότρυας
  choice: собери гроздья
  rationale: τρυγάω обозначает сбор винограда, а βότρυες — виноградные гроздья; контекст лозы делает добавление «виноградные» необязательным.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: с виноградной лозы земли
  rationale: Сохраняет двойную родительную конструкцию и апокалиптический образ, не отождествляя лозу с конкретной группой людей.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: созрели её ягоды
  rationale: ἀκμάζω означает достижение зрелости; «ягоды» естественно обозначает отдельные плоды виноградной лозы и отличает их от уже упомянутых гроздьев.
theological_decisions:
- issue: Апокалиптический образ τῆς ἀμπέλου τῆς γῆς
  choice: виноградная лоза земли
  alternative: нечестивые жители земли; лоза, растущая на земле
  rationale: Контекст указывает на суд, однако сам стих не раскрывает референт метафоры. Поэтому образ сохранён без внесения толкования в основной текст.
- issue: Связь ангела с огнём
  choice: власть над огнём
  alternative: власть жертвенника или истолкование огня как конкретного вида суда
  rationale: Фраза прямо говорит о власти над огнём, но не поясняет её природу; перевод не конкретизирует богословское значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, подходящим для апокалиптического видения. Синтаксис упрощён ровно настолько, чтобы текст оставался понятным, но повтор «острый серп» и непривычный образ «лозы земли» сохранены как значимые черты оригинала.
