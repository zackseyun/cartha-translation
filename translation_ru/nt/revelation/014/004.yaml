  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: ru
  text: Это те, кто не осквернили себя связью с женщинами, ибо они девственники[a]. Это те, кто следуют за Агнцем, куда бы Он ни шёл. Они были куплены из числа людей в качестве начатка для Бога и Агнца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, этот образ означает духовную чистоту или свободу от осквернения идолопоклонством, а не только буквальное половое воздержание.
    reason: alternative_reading
  - marker: b
    text: «Начаток» — первая доля урожая или иного достояния, отделяемая как приношение. «Люди» здесь означает человеческий род в целом, а не только мужчин.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: не осквернился
  rationale: Греческая пассивная форма обозначает осквернение; русская возвратная форма естественно передаёт состояние и участие описываемых лиц, сохраняя нравственно-культовый оттенок глагола.
- source_word: μετὰ γυναικῶν
  choice: с женщинами
  rationale: Предлог μετά с родительным падежом означает «с», а γυναικῶν здесь естественнее понимать как «женщинами», не ограничивая смысл только жёнами.
- source_word: παρθένοι
  choice: девственники
  rationale: Конкретное существительное сохраняет буквальный образ исходного текста и мужской род греческой формы, не подменяя его толкованием «целомудренные».
- source_word: ἀκολουθοῦντες
  choice: следуют
  rationale: Настоящее причастие выражает постоянное, характерное действие; русское настоящее время передаёт это естественно.
- source_word: ἀρνίῳ
  choice: Агнцем
  rationale: «Агнец» — устойчивое и точное русское обозначение христологического образа в Откровении.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: куда бы Он ни шёл
  rationale: Сочетание с ἄν и сослагательным наклонением выражает неопределённость «куда бы ни»; выбранная конструкция естественна для литературного русского языка.
- source_word: ἠγοράσθησαν
  choice: были куплены
  rationale: Сохранена буквальная торговая метафора глагола ἀγοράζω без её преждевременной замены богословски истолковывающим словом «искуплены».
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: из числа людей
  rationale: ἄνθρωποι обозначает людей вообще, а не только мужчин; формулировка также естественно передаёт значение отделения из общей среды.
- source_word: ἀπαρχὴ
  choice: начаток
  rationale: Традиционное русское слово сохраняет образ первой доли урожая или приношения, предназначенной Богу.
theological_decisions:
- issue: Следует ли понимать неосквернение с женщинами и девственность буквально или как символ духовной чистоты
  choice: 'В основном тексте сохранена конкретная формулировка: «не осквернился с женщинами, ведь они девственники»'
  alternative: Понимать весь образ как указание на духовную чистоту и непричастность к идолопоклонству
  rationale: Исходный текст выражен конкретно, тогда как жанр Откровения допускает символическое значение. Перевод сохраняет форму и напряжение текста, а возможный символический смысл отмечен в сноске.
- issue: Передача торгово-искупительного образа ἠγοράσθησαν
  choice: «были куплены»
  alternative: «были искуплены» или «были выкуплены»
  rationale: «Куплены» непосредственно передаёт глагол и сохраняет метафору, не уточняя её богословский механизм сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Слово «Агнец» сохранено как устойчивый образ Откровения, а «начаток» — как культово-земледельческий термин. Заглавная буква в местоимении «Он» поддерживает принятый в русском библейском письме благоговейный регистр, не меняя смысла.
