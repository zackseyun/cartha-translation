    rationale: Относительное «кто» допускает единственное число в некоторых конструкциях, но здесь сказуемое описывает явно множественную группу («те», «они», «девственники»), и единственное число выглядит как грамматическая ошибка.
  - severity: low
    issue: Оборот «не осквернились с женщинами» недостаточно естественен для современного литературного русского.
    rationale: Он близок к традиционной библейской модели, но может быть понят как не вполне обычное управление. «Не осквернили себя связью с женщинами» выражает ту же конкретную образность без богословского истолкования.
  - severity: low
    issue: Сноска b не сохраняет уточнение аудиторского следа о всеобщем значении ἀνθρώπων.
    rationale: Пояснение «начаток» полезно, но стоит также явно отметить, что «люди» здесь не означает только мужчин.
