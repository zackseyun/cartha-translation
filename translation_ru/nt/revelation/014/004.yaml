  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: сохранены буквальное упоминание женщин и девственности, постоянное следование за Агнцем, неопределённое «куда бы ни шёл», а также образ приобретения людей как начатка для Бога и Агнца. Однако в тексте имеется грамматическое несогласование: «Это те, кто не осквернился» употребляет единственное число при множественном референте. Исправление также делает оборот осквернения более естественным по-русски, не разрешая вопрос о буквальном либо символическом характере образа.'
  naturalness: «Ведь» возможно, но «ибо» лучше соответствует умеренно возвышенному библейскому регистру. Оборот «не осквернились с женщинами» понятен, однако в современном литературном русском несколько тяжеловесен; «не осквернили себя связью с женщинами» естественнее и передаёт подразумеваемый характер выражения. «В качестве начатка» ясно оформляет греческое приложение в русском предложении.
  terminology: «Агнец» и «начаток» выбраны удачно. «Из числа людей» корректно передаёт ἀπὸ τῶν ἀνθρώπων как включающее всех людей, а не только мужчин. Сноска b в исправленном виде одновременно поясняет «начаток» и сохраняет существенное уточнение английского аудиторского следа о значении «люди».
