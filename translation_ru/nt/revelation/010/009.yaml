id: REV.10.9
reference: Revelation 10:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: ru
  text: 'И я пошёл к ангелу и сказал ему, чтобы он дал мне маленький свиток[a]. Он говорит мне[b]: «Возьми и съешь его. Он вызовет горечь в твоём животе[c], но во рту он будет сладок, как мёд».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленькую книжку». Греческое слово βιβλαρίδιον — уменьшительное и может обозначать небольшой свиток или книжечку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он сказал мне». В греческом здесь употреблено историческое настоящее, придающее рассказу живость.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сделает горьким твой живот»; возможно также: «утробу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: я пошёл к ангелу
  rationale: Передаёт движение Иоанна по направлению к ангелу; буквальное «отошёл» в данном контексте по-русски вводило бы в заблуждение.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: сказал ему, чтобы он дал мне
  rationale: Естественно передаёт сопутствующую речь и содержание инфинитивной конструкции, не добавляя оттенка вежливой просьбы, которого греческий текст прямо не выражает.
- source_word: βιβλαρίδιον
  choice: маленький свиток
  rationale: Сохраняет уменьшительный оттенок и наиболее вероятную для древнего контекста материальную форму текста.
- source_word: λέγει μοι
  choice: Он говорит мне
  rationale: Сохраняет историческое настоящее греческого повествования и его живую непосредственность; в современном русском такой переход допустим.
- source_word: Λάβε καὶ κατάφαγε αὐτό
  choice: Возьми и съешь его
  rationale: Ясно и естественно передаёт два повеления. Контекстуального «съешь» достаточно; усиленное «съешь целиком» могло бы чрезмерно конкретизировать приставочное значение.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: От него у тебя станет горько в животе
  rationale: Передаёт причинное значение πικραίνω и телесный смысл κοιλία естественным современным русским выражением, не превращая образ в медицинское описание.
- source_word: γλυκὺ ὡς μέλι
  choice: сладок, как мёд
  rationale: Точно сохраняет сравнение и звучит естественно и литературно по-русски.
theological_decisions:
- issue: Символическое съедение свитка
  choice: Конкретное повеление «Возьми и съешь его» сохранено без истолкования символа.
  alternative: Передать действие объяснительно как усвоение или принятие Божьего послания.
  rationale: Греческий текст изображает пророческое символическое действие, но сам в этом стихе не заменяет образ богословским объяснением; перевод сохраняет эту напряжённость.
- issue: Горечь в κοιλία и сладость во рту
  choice: Оба телесных образа сохранены как последовательные и контрастные.
  alternative: Истолковать горечь как скорбь, суд или тяжесть поручения, а сладость — как радость от Божьего слова.
  rationale: Такие толкования возможны в контексте, однако не должны вноситься непосредственно в перевод стиха.
translation_notes:
  register: Современный литературный русский с ясным, dignified повествовательным строем. Сохранено историческое настоящее «говорит», конкретная телесная образность и уменьшительный оттенок названия свитка. Архаические «чрево» и «утроба» не вынесены в основной текст; «утроба» отмечена только как возможный вариант в сноске.
