id: REV.10.3
reference: Revelation 10:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: ru
  text: И вскричал он громким голосом, как рычит лев. И когда он вскричал, семь громов заговорили своими голосами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семь громов произнесли свои собственные голоса». Греческое выражение необычно и олицетворяет громы, представляя их говорящими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: вскричал
  rationale: Аорист κράζω обозначает сильный, громкий возглас. «Вскричал» передаёт интенсивность и не сводит действие к обычной речи.
- source_word: φωνῇ μεγάλῃ
  choice: громким голосом
  rationale: Сохраняет конкретное существительное φωνή и естественно передаёт дательный образа действия.
- source_word: ὥσπερ λέων μυκᾶται
  choice: как рычит лев
  rationale: Естественная русская передача сравнения; «рычит» точно соответствует характерному голосу льва.
- source_word: ὅτε
  choice: когда
  rationale: Передаёт временную связь, не уточняя без необходимости, было ли действие строго последующим.
- source_word: ἐλάλησαν αἱ ἑπτὰ βρονταὶ
  choice: семь громов заговорили
  rationale: Сохраняет необычное олицетворение громов как говорящих, явно выраженное глаголом λαλέω.
- source_word: τὰς ἑαυτῶν φωνάς
  choice: своими голосами
  rationale: Передаёт множественное число φωνάς и усилительное возвратное ἑαυτῶν, оставаясь приемлемым в современном русском языке.
theological_decisions:
- issue: Олицетворение семи громов
  choice: 'Сохранено: «семь громов заговорили своими голосами»'
  alternative: «семь громов прогремели» или «семь громов возвестили свои слова»
  rationale: Греческий текст прямо приписывает громам речь и их собственные голоса. Апокалиптический образ не следует ослаблять до простого звукового явления или истолковывать «голоса» как сообщения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «вскричал» сохранён вслед за греческим текстом; необычное олицетворение громов не сглажено.
