lexical_decisions:
- source_word: ἔχων ἐν τῇ χειρὶ αὐτοῦ
  choice: держал в руке
  rationale: Причастный оборот передан естественной для современного русского личной формой; связь с описанием ангела из предыдущего стиха сохраняется союзом «и».
- source_word: βιβλαρίδιον
  choice: малый свиток
  rationale: Уменьшительная форма обозначает небольшой свиток или книжицу; «свиток» лучше сохраняет предметный образ контекста.
- source_word: ἠνεῳγμένον
  choice: раскрытый
  rationale: 'Перфектное страдательное причастие выражает состояние вследствие совершённого действия: свиток был раскрыт и остаётся раскрытым.'
- source_word: ἔθηκεν
  choice: поставил
  rationale: В сочетании с ногой русское «поставил» естественно передаёт намеренное размещение.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιόν
  choice: правую ногу
  rationale: Прямой и естественный русский эквивалент; притяжательное местоимение можно не повторять, поскольку принадлежность ясна из контекста.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: на море
  rationale: Сохраняет яркий пространственный образ греческого текста.
- source_word: τὸν δὲ εὐώνυμον
  choice: а левую
  rationale: Существительное «ногу» естественно опущено во второй части параллельной конструкции и восстанавливается из первой.
- source_word: ἐπὶ τῆς γῆς
  choice: на сушу
  rationale: В противопоставлении морю γῆ естественно означает сушу; винительный падеж после «поставил» соответствует русскому управлению и передаёт направление постановки.
theological_decisions:
- issue: Значение γῆ в противопоставлении θάλασσα
  choice: суша
  alternative: земля
  rationale: «Суша» ясно выражает непосредственное пространственное противопоставление морю, не навязывая более широкого космологического значения.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным звучанием. Начальное причастие преобразовано в личную форму ради естественности; параллелизм положения ног сохранён. Маркеры сносок поставлены непосредственно после соответствующих выражений.
