id: REV.10.5
reference: Revelation 10:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: ru
  text: И ангел, которого я видел стоящим на море и на суше[a], поднял правую руку к небу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в небо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: ангел
  rationale: В контексте Откровения речь идёт о небесном существе; «ангел» точнее и естественнее общего «вестник».
- source_word: ἑστῶτα
  choice: стоящим
  rationale: Перфектное причастие обозначает наличное состояние и позу ангела; по-русски естественно передать его словом «стоящим».
- source_word: ἐπὶ τῆς θαλάσσης
  choice: на море
  rationale: ἐπί с родительным здесь передаёт положение «на»; перевод сохраняет яркий образ видения и связь с предшествующим контекстом.
- source_word: ἐπὶ τῆς γῆς
  choice: на суше
  rationale: В непосредственном противопоставлении морю γῆ естественно означает сушу; этот вариант ясно передаёт пространственный контраст.
- source_word: ἦρεν
  choice: поднял
  rationale: Глагол αἴρω здесь обозначает поднятие руки в торжественном жесте клятвы.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: правую руку
  rationale: Греческий текст прямо уточняет, что ангел поднял именно правую руку; русский порядок слов естественен и сохраняет эту деталь.
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: Предлог εἰς выражает направление жеста; «к небу» звучит естественно и сохраняет богословски значимый образ небесной сферы.
theological_decisions:
- issue: Передача γῆ в противопоставлении θάλασσα
  choice: суша
  alternative: земля
  rationale: Образ показывает ангела, стоящего над двумя пространственными областями — морем и сушей. «Суша» ясно сохраняет непосредственный зрительный контраст, не исключая более широкого значения γῆ.
- issue: Передача οὐρανός
  choice: небо
  alternative: небосвод
  rationale: Жест предваряет клятву Творцом в следующем стихе, поэтому «небо» сохраняет религиозно-богословский регистр, тогда как «небосвод» чрезмерно сужает смысл до видимого пространства.
- issue: Направительное значение εἰς в жесте поднятой руки
  choice: к небу
  alternative: в небо
  rationale: «К небу» естественно обозначает направление руки и не создаёт впечатления, будто рука буквально входит в небесную область; альтернативное понимание направления отмечено в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным повествовательным строем. Сохранён порядок образов греческого текста; «суша» выбрана ради ясного контраста с морем, а варианты вынесены в краткие примечания.
