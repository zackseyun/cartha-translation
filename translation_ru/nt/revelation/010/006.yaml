  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: ru
  text: и поклялся Тем, кто живёт во веки веков, кто сотворил небо и всё, что в нём, землю и всё, что в ней, море и всё, что в нём, что промедления больше не будет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «времени больше не будет». В данном контексте χρόνος, вероятно, означает «промедление»: период ожидания Божьего решающего действия подошёл к концу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: поклялся
  rationale: Аорист ὀμνύω обозначает принесение клятвы; «поклялся» кратко и естественно передаёт торжественное действие.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: тем, кто живёт во веки веков
  rationale: Дательный падеж указывает, кем клянётся говорящий; субстантивированное причастие передано ясной современной конструкцией, а устойчивое выражение сохраняет значение бесконечной длительности.
- source_word: ἔκτισεν
  choice: сотворил
  rationale: В формуле о создании мира κτίζω означает творение; «сотворил» сохраняет торжественный регистр и ясно указывает на Творца.
- source_word: τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ
  choice: небо и всё, что в нём
  rationale: Собирательное «всё, что в нём» естественно по-русски и сохраняет повторяющуюся структуру перечисления.
- source_word: τὴν γῆν καὶ τὰ ἐν αὐτῇ
  choice: землю и всё, что на ней
  rationale: В космической триаде γῆ означает землю; по-русски о находящемся на земле естественно сказать «на ней», хотя греческая конструкция буквально имеет значение «в ней».
- source_word: τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ
  choice: море и всё, что в нём
  rationale: Сохраняются единственное число и третья часть формулы «небо — земля — море».
- source_word: ὅτι
  choice: что
  rationale: После глагола клятвы союз вводит содержание клятвы, а не её причину.
- source_word: χρόνος οὐκέτι ἔσται
  choice: промедления больше не будет
  rationale: В ближайшем контексте речь идёт о прекращении ожидания перед завершением Божьего замысла, а не обязательно об исчезновении времени как такового. Буквальная возможность сохранена в сноске.
theological_decisions:
- issue: Значение χρόνος в содержании клятвы
  choice: «промедления больше не будет» — период ожидания Божьего решающего действия завершён
  alternative: «времени больше не будет»
  rationale: Следующий стих говорит о свершении Божьей тайны, поэтому контекст поддерживает значение «промедление». Однако греческое χρόνος буквально означает «время», и эта подлинная смысловая напряжённость отмечена в сноске, без утверждения, будто временная последовательность непременно прекратится.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Повтор трёхчастной формулы творения сохранён; громоздкое «то, что» заменено естественным собирательным «всё, что». Местоименные обозначения Бога не капитализированы, чтобы не вносить в исходный текст отсутствующее графическое различие.
