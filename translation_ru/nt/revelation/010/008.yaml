    rationale: Сноска относится к βιβλίον / «свиток», поэтому её якорь должен непосредственно следовать за этим словом. В нынешнем виде она структурно и семантически отнесена ко всему предложению.
  - severity: low
    issue: Сноска b стоит после закрывающей кавычки / в конце прямой речи вместо слова «суше».
    rationale: Лексическая альтернатива «земле» относится исключительно к γῆ, переведённому как «суше», и должна быть поставлена непосредственно после этого слова.
  - severity: low
    issue: «Из руки ангела» менее буквально, чем ἐν τῇ χειρὶ.
    rationale: Греческий текст описывает свиток как находящийся в руке ангела; направление «из руки» возможно по смыслу повеления, но не выражено предлогом ἐν.
